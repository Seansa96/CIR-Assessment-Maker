  answer: Any $N$ with $N+1\ge10^3$; the least is $10^3-1$.
  explanation: The alternating remainder is at most the next term, $1/(N+1)^2$. It suffices that this be at most $10^-3$; the displayed answer is a simple guaranteed choice (not necessarily sharp).
