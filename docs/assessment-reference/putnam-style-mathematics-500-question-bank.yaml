- id: putnam-art-of-problem-solving-aops-integers-number-theory-001
  categoryId: art-of-problem-solving
  topicId: aops-integers-number-theory
  difficulty: putnam-style
  learningGoals:
  - evaluate
  - synthesize
  - prove
  assessmentFits:
  - quiz
  - test
  questionTypes:
  - freeResponse
  solutionOutline: Find a structural reduction for Using the Integers, prove the key lemma before computation, then show both that the construction works and that alternatives are impossible.
  commonErrors:
  - Showing divisibility by only one factor.
  - Using Fermat when n is divisible by the modulus without handling that case.
  tags:
  - putnam-style
  - hard
  - original
  - aops-integers-number-theory
  prompt: Prove that $n^5-n$ is divisible by 30 for every integer $n$.
  answer: It is divisible by 2, 3, and 5, hence by 30.
  explanation: Modulo 2, 3, and 5, Fermat's theorem (or direct residues) gives $n^5\equiv n$. The moduli are coprime.
- id: putnam-art-of-problem-solving-aops-integers-number-theory-002
