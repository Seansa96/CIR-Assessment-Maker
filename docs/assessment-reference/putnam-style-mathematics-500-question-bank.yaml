  solutionOutline: Find a structural reduction for Using the Integers, prove the key lemma before computation, then show both that the construction works and that alternatives are impossible.
  commonErrors:
  - Forgetting divisor cannot be zero.
  - Failing to test every signed divisor of the remainder.
  tags:
  - putnam-style
  - hard
  - original
  - aops-integers-number-theory
  prompt: Find all integers $n$ for which $n^2+2$ is divisible by $n+1$.
  answer: $n=-4,-2,0,2$.
  explanation: 'Divide: $n^2+2=(n+1)(n-1)+3$, so $n+1$ divides 3. The four divisors $\pm1,\pm3$ give the stated values.'
