- id: putnam-art-of-problem-solving-aops-exponents-logarithms-001
  categoryId: art-of-problem-solving
  topicId: aops-exponents-logarithms
  difficulty: putnam-style
  learningGoals:
  - evaluate
  - synthesize
  - prove
  assessmentFits:
  - quiz
  - test
  questionTypes:
  - freeResponse
  solutionOutline: Find a structural reduction for Exponents and Logarithms, prove the key lemma before computation, then show both that the construction works and that alternatives are impossible.
  commonErrors:
  - Dropping the shift.
  - Taking logs inaccurately.
  tags:
  - putnam-style
  - hard
  - original
  - aops-exponents-logarithms
  prompt: Justify your answer and solve $3^{x+2}=3^{7}$.
  answer: '5'
  explanation: 'Equal powers of base 3 have equal exponents: x+2=7.'
