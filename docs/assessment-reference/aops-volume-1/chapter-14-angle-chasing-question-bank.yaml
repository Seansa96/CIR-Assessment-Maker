  answer: 90 degrees
  solutionOutline: Half of 180.
  commonTrap: 180 degrees.
- id: aops-v1-ch14-q064
  concept: parallel-line-converse
  difficulty: advanced
  source: original-authoring
  prompt: Prove equal corresponding angles imply two lines are parallel.
  answer: Apply corresponding-angle converse with common transversal.
  solutionOutline: Assume the desired parallelism.
  commonTrap: ''
- id: aops-v1-ch14-q065
  concept: isosceles-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove equal base angles imply equal opposite sides.
  answer: Use the converse isosceles theorem or contradiction by side-angle order.
  solutionOutline: Use only forward theorem.
  commonTrap: ''
- id: aops-v1-ch14-q066
  concept: circle-angle-theorem
  difficulty: advanced
  source: original-authoring
  prompt: Prove an angle in a semicircle is right.
  answer: It intercepts 180-degree arc, and inscribed angle is half arc.
  solutionOutline: Assume every chord is diameter.
