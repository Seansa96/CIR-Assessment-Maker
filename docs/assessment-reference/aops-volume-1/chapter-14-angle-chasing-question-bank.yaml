  solutionOutline: They are vertical angles.
  commonTrap: ''
- id: aops-v1-ch14-q080
  concept: proof-obligation
  difficulty: advanced
  source: original-authoring
  prompt: A solution says “obvious by symmetry.” What must be supplied?
