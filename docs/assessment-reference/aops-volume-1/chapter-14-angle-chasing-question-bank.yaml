  answer: 90 degrees
  solutionOutline: Inside chord angle is half sum.
  commonTrap: 20 degrees.
- id: aops-v1-ch14-q018
  concept: cyclic-angle-relations
  difficulty: intermediate
  source: original-authoring
  prompt: Two secants meet outside circle; far arc 150, near arc 70. Find angle.
  answer: 40 degrees
  solutionOutline: Outside angle is half difference.
  commonTrap: 110 degrees.
- id: aops-v1-ch14-q019
  concept: cyclic-quadrilateral
  difficulty: intermediate
  source: original-authoring
  prompt: Cyclic quadrilateral angles are 2x and 4x opposite. Find x.
  answer: 30 degrees
  solutionOutline: They sum 180.
  commonTrap: '45.'
- id: aops-v1-ch14-q020
  concept: regular-polygon-angles
  difficulty: intermediate
  source: original-authoring
  prompt: A regular hexagon has interior 120. An adjacent exterior turn is what?
  answer: 60 degrees
  solutionOutline: Interior plus exterior is 180.
  commonTrap: 120 degrees.
- id: aops-v1-ch14-q021
  concept: auxiliary-line-selection
  difficulty: intermediate
  source: original-authoring
  prompt: To use isosceles facts in a circle with center O and chord AB, what should
    you draw?
  answer: Radii OA and OB.
  solutionOutline: They create isosceles triangle OAB.
  commonTrap: A random tangent.
- id: aops-v1-ch14-q022
  concept: angle-chasing-ledger
  difficulty: intermediate
  source: original-authoring
  prompt: A chase gives x+20=3x-40. Find x.
  answer: '30'
  solutionOutline: Solve the equality of justified angles.
  commonTrap: '10.'
- id: aops-v1-ch14-q023
  concept: diagram-assumption-check
  difficulty: intermediate
  source: original-authoring
  prompt: Why can you not assume two unmarked lines are parallel?
  answer: Parallelism requires a marking or proof.
  solutionOutline: They look equally spaced.
  commonTrap: ''
- id: aops-v1-ch14-q024
  concept: cyclic-angle-relations
  difficulty: intermediate
  source: original-authoring
  prompt: An angle subtending a diameter is what?
  answer: 90 degrees
  solutionOutline: It intercepts a semicircle.
  commonTrap: 180 degrees.
- id: aops-v1-ch14-q025
  concept: angle-chasing-ledger
  difficulty: advanced
  source: original-authoring
  prompt: Prove exterior angle theorem.
  answer: Compare triangle sum with adjacent linear-pair sum.
  solutionOutline: Use a diagram measurement.
  commonTrap: ''
- id: aops-v1-ch14-q026
  concept: parallel-line-transfer
  difficulty: advanced
  source: original-authoring
  prompt: Prove equal alternate interior angles imply lines parallel.
  answer: Use the converse parallel-line theorem.
  solutionOutline: Assume parallelism as a given.
  commonTrap: ''
- id: aops-v1-ch14-q027
  concept: cyclic-quadrilateral
  difficulty: advanced
  source: original-authoring
  prompt: Prove opposite angles of cyclic quadrilateral are supplementary.
  answer: Each is half a pair of arcs totaling 360.
  solutionOutline: Assume all quadrilaterals have this property.
  commonTrap: ''
- id: aops-v1-ch14-q028
  concept: tangent-chord
  difficulty: advanced
  source: original-authoring
  prompt: Prove radius to tangent point is perpendicular.
  answer: A nonperpendicular line through contact would pass inside circle and meet
    it twice.
  solutionOutline: Use a visual right-angle guess.
  commonTrap: ''
- id: aops-v1-ch14-q029
  concept: auxiliary-line-selection
  difficulty: advanced
  source: original-authoring
  prompt: Why draw a radius to a point of tangency?
  answer: It unlocks perpendicular tangent-radius theorem and isosceles triangles.
  solutionOutline: It always bisects the chord.
  commonTrap: ''
- id: aops-v1-ch14-q030
  concept: angle-chasing-ledger
  difficulty: advanced
  source: original-authoring
  prompt: A proof has an angle equality with no cited reason. Is it complete?
  answer: 'No'
  solutionOutline: Every inference needs a theorem or given.
  commonTrap: Yes if diagram appears clear.
- id: aops-v1-ch14-q031
  concept: diagram-assumption-check
  difficulty: advanced
  source: original-authoring
  prompt: Give counterexample to “equal-looking angles are equal.”
  answer: A distorted non-scale drawing with unequal measures.
  solutionOutline: Drawings do not determine metric facts.
  commonTrap: A symmetric diagram.
- id: aops-v1-ch14-q032
  concept: mixed-angle-chase
  difficulty: advanced
  source: original-authoring
  prompt: A triangle has angles 40,60,80. Extend side at 80-degree vertex. Find exterior
    angle.
  answer: 100 degrees
  solutionOutline: Exterior equals remote 40+60.
  commonTrap: 80 degrees.
- id: aops-v1-ch14-q033
  concept: mixed-angle-chase
  difficulty: advanced
  source: original-authoring
  prompt: An isosceles triangle has vertex angle 20. A line from vertex bisects it.
    Find each new vertex angle.
  answer: 10 degrees
  solutionOutline: Angle bisector halves the angle.
  commonTrap: 80 degrees.
- id: aops-v1-ch14-q034
  concept: circle-angle-theorem
  difficulty: advanced
  source: original-authoring
  prompt: An inscribed angle is 35. Find its intercepted arc.
  answer: 70 degrees
  solutionOutline: Arc is twice inscribed angle.
  commonTrap: 35 degrees.
- id: aops-v1-ch14-q035
  concept: circle-angle-theorem
  difficulty: advanced
  source: original-authoring
  prompt: Two tangent segments from one exterior point meet circle. What length relation
    holds?
  answer: They are equal.
  solutionOutline: Use tangent-segment theorem.
  commonTrap: They are perpendicular.
- id: aops-v1-ch14-q036
  concept: proof-obligation
  difficulty: advanced
  source: original-authoring
  prompt: Why is “the arc looks like a semicircle” insufficient?
  answer: A diameter or 180-degree arc must be given/proved.
  solutionOutline: Arcs are always halves.
  commonTrap: ''
- id: aops-v1-ch14-q037
  concept: construction
  difficulty: advanced
  source: original-authoring
  prompt: What auxiliary line often helps prove a circle angle relation?
