items:
- id: aops-v1-ch14-q001
  concept: angle-chasing-ledger
  difficulty: foundational
  source: original-authoring
  prompt: Two lines intersect. One angle is 47 degrees. Find its vertical angle.
  answer: 47 degrees
  solutionOutline: Vertical angles are equal.
  commonTrap: 133 degrees.
- id: aops-v1-ch14-q002
  concept: linear-pairs
  difficulty: foundational
  source: original-authoring
  prompt: A linear pair has one angle 68 degrees. Find the other.
  answer: 112 degrees
  solutionOutline: Linear pair sums to 180.
  commonTrap: 68 degrees.
- id: aops-v1-ch14-q003
  concept: angles-around-point
  difficulty: foundational
  source: original-authoring
  prompt: Angles around point are 90,120,80,x. Find x.
  answer: 70 degrees
  solutionOutline: They sum to 360.
  commonTrap: 110 degrees.
- id: aops-v1-ch14-q004
  concept: triangle-angles
  difficulty: foundational
  source: original-authoring
  prompt: Triangle angles are 52,63,x. Find x.
  answer: 65 degrees
  solutionOutline: Use triangle sum.
  commonTrap: 115 degrees.
- id: aops-v1-ch14-q005
  concept: parallel-line-transfer
  difficulty: foundational
  source: original-authoring
  prompt: Parallel lines cut by transversal have corresponding angle 75. Find its
