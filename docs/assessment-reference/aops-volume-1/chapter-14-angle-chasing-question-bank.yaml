  solutionOutline: Only opposite A+C are supplementary.
  commonTrap: Assuming D=100.
- id: aops-v1-ch14-q077
  concept: geometry-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: What distinguishes a proof chase from a calculation chase?
  answer: A proof establishes a general relation from givens; a calculation finds
    a specified measure with reasons.
  solutionOutline: A proof uses no equations.
  commonTrap: ''
- id: aops-v1-ch14-q078
  concept: circle-angle-theorem
  difficulty: advanced
  source: original-authoring
  prompt: An arc AB is 140. Any inscribed angles intercepting the same arc have what
