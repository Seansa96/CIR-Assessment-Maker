- id: aops-v1-ch14-q067
  concept: cyclic-quadrilateral
  difficulty: advanced
  source: original-authoring
  prompt: Prove a quadrilateral with supplementary opposite angles is cyclic.
  answer: Use the converse inscribed-angle relation to show one vertex lies on circle
