  answer: 75 degrees
  solutionOutline: Corresponding angles are equal.
  commonTrap: 105 degrees.
- id: aops-v1-ch14-q006
  concept: parallel-line-transfer
  difficulty: foundational
  source: original-authoring
  prompt: 'Same-side interior angles: one is 118. Find other.'
  answer: 62 degrees
  solutionOutline: They are supplementary.
  commonTrap: 118 degrees.
- id: aops-v1-ch14-q007
  concept: isosceles-triangle-angles
  difficulty: foundational
  source: original-authoring
  prompt: Isosceles triangle base angles 38 each. Find vertex angle.
  answer: 104 degrees
  solutionOutline: Subtract 76 from 180.
  commonTrap: 142 degrees.
- id: aops-v1-ch14-q008
  concept: cyclic-angle-relations
  difficulty: foundational
  source: original-authoring
  prompt: An inscribed angle intercepts arc 100 degrees. Find angle.
  answer: 50 degrees
  solutionOutline: Inscribed angle is half arc.
  commonTrap: 100 degrees.
- id: aops-v1-ch14-q009
  concept: cyclic-angle-relations
  difficulty: foundational
  source: original-authoring
  prompt: A central angle is 130 degrees. Find intercepted arc.
  answer: 130 degrees
  solutionOutline: Central angle equals arc.
  commonTrap: 65 degrees.
- id: aops-v1-ch14-q010
  concept: tangent-chord
  difficulty: foundational
  source: original-authoring
  prompt: A tangent-chord angle intercepts arc 80 degrees. Find angle.
  answer: 40 degrees
  solutionOutline: It is half intercepted arc.
  commonTrap: 80 degrees.
- id: aops-v1-ch14-q011
  concept: cyclic-quadrilateral
  difficulty: foundational
  source: original-authoring
  prompt: One angle of cyclic quadrilateral is 112. Find opposite angle.
  answer: 68 degrees
  solutionOutline: Opposite angles supplement.
  commonTrap: 112 degrees.
- id: aops-v1-ch14-q012
  concept: angle-chasing-ledger
  difficulty: foundational
  source: original-authoring
  prompt: What should accompany every derived angle in a chase?
  answer: A stated reason/theorem.
  solutionOutline: Maintain a reason ledger.
  commonTrap: A measurement from drawing.
- id: aops-v1-ch14-q013
  concept: parallel-line-transfer
  difficulty: intermediate
  source: original-authoring
  prompt: 'Parallel lines: alternate interior angle is 3x+5 and its mate 80. Find
    x.'
  answer: '25'
  solutionOutline: Set equal and solve.
  commonTrap: '85.'
- id: aops-v1-ch14-q014
  concept: triangle-angles
  difficulty: intermediate
  source: original-authoring
  prompt: Exterior angle is 140, one remote interior is 65. Find other remote.
  answer: 75 degrees
  solutionOutline: Exterior equals remote sum.
  commonTrap: 40 degrees.
- id: aops-v1-ch14-q015
  concept: isosceles-triangle-angles
  difficulty: intermediate
  source: original-authoring
  prompt: AB=AC and exterior angle at B is 130. Find angle A.
  answer: 80 degrees
  solutionOutline: Interior B is 50, so C=50.
  commonTrap: 130 degrees.
- id: aops-v1-ch14-q016
  concept: parallel-line-transfer
  difficulty: intermediate
  source: original-authoring
  prompt: A transversal makes 35 degrees with one parallel line. Find acute angle
    it makes with other.
  answer: 35 degrees
  solutionOutline: Corresponding acute angles equal.
  commonTrap: 145 degrees.
- id: aops-v1-ch14-q017
  concept: cyclic-angle-relations
  difficulty: intermediate
  source: original-authoring
  prompt: Two chords intersect inside circle; intercepted arcs are 70 and 110. Find
