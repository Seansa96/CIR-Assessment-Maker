- id: aops-v1-ch14-q068
  concept: auxiliary-line-selection
  difficulty: advanced
  source: original-authoring
  prompt: A circle problem has a chord and center but no useful angles. What first
    construction is natural?
  answer: Connect center to chord endpoints.
  solutionOutline: It produces equal radii and isosceles triangle.
  commonTrap: Draw a random parallel.
- id: aops-v1-ch14-q069
  concept: angle-chasing-ledger
  difficulty: advanced
  source: original-authoring
  prompt: Why is substituting labels into a triangle sum safer than chasing by appearance?
  answer: The equation records a complete invariant and exposes arithmetic errors.
  solutionOutline: It makes the diagram to scale.
  commonTrap: ''
- id: aops-v1-ch14-q070
  concept: mixed-angle-chase
  difficulty: advanced
  source: original-authoring
  prompt: Parallel lines transfer an acute angle 28 to a triangle. The triangle has
    another angle 67. Find third angle.
  answer: 85 degrees
  solutionOutline: Subtract 28+67 from 180.
  commonTrap: Using the obtuse supplement instead.
- id: aops-v1-ch14-q071
  concept: corrected-chase
  difficulty: advanced
  source: original-authoring
  prompt: A triangle uses angles 28 and 67 transferred by parallel lines. Find third.
  answer: 85 degrees
  solutionOutline: Subtract their sum from 180.
  commonTrap: 113 degrees.
- id: aops-v1-ch14-q072
  concept: mixed-angle-chase
  difficulty: advanced
  source: original-authoring
  prompt: An isosceles triangle has base angles 40. A tangent at its circumcircle
    vertex forms what angle with each equal chord if it intercepts arc?
  answer: Use tangent-chord theorem; angle equals opposite inscribed angle, requiring
    the stated arc.
  solutionOutline: Assume it is 40 without establishing cyclic configuration.
  commonTrap: ''
- id: aops-v1-ch14-q073
  concept: proof-obligation
  difficulty: advanced
  source: original-authoring
  prompt: Why must an outside-secant angle use arc difference, not sum?
  answer: Its rays intercept nested arcs and the external turning compares far minus
    near.
  solutionOutline: All circle angles average arcs the same way.
  commonTrap: ''
- id: aops-v1-ch14-q074
  concept: diagram-assumption-check
  difficulty: advanced
  source: original-authoring
  prompt: Why does a point drawn on a circle require incidence marking?
  answer: A diagram alone cannot certify exact membership.
  solutionOutline: Circles contain every nearby point.
  commonTrap: ''
- id: aops-v1-ch14-q075
  concept: construction
  difficulty: advanced
  source: original-authoring
  prompt: How can an auxiliary parallel line transfer an angle to a remote vertex?
  answer: Draw through target vertex a line parallel to the reference side and use
    corresponding angles.
  solutionOutline: Extend the angle arbitrarily.
  commonTrap: ''
- id: aops-v1-ch14-q076
  concept: mixed-angle-chase
  difficulty: advanced
  source: original-authoring
  prompt: In cyclic quadrilateral, angle A=65 and angle B=80. Find C and D relation.
