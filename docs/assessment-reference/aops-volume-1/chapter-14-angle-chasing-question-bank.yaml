  solutionOutline: They supplement the acute 72.
  commonTrap: 72 degrees each.
- id: aops-v1-ch14-q040
  concept: geometry-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: What should be checked before applying an inscribed-angle theorem?
