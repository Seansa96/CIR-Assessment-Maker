metadata:
  id: aops-v1-ch11-triangles-bank
  chapter: 11
  topicIds:
  - aops-triangles
  status: in-progress
  minimumRequiredItems: 150
  sourcePageRange: pdf 107-131; printed 93-117
items:
- id: aops-v1-ch11-q001
  concept: triangle-inequality
  difficulty: foundational
  source: original-authoring
  prompt: Do side lengths 4, 7, and 12 form a triangle?
  answer: No; 4+7 is less than 12.
  solutionOutline: Check the sum of the two shorter sides.
  commonTrap: ''
- id: aops-v1-ch11-q002
  concept: triangle-inequality
  difficulty: foundational
  source: original-authoring
  prompt: Find the integer values of x if sides are 5, 8, and x.
  answer: $4\le x\le12$
  solutionOutline: Use $|8-5|<x<13$ and integrality.
  commonTrap: ''
- id: aops-v1-ch11-q003
  concept: triangle-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: A triangle has angles 48 degrees and 71 degrees. Find the third angle.
  answer: 61 degrees
  solutionOutline: Subtract their sum from 180 degrees.
  commonTrap: ''
- id: aops-v1-ch11-q004
  concept: exterior-angle
  difficulty: foundational
  source: original-authoring
  prompt: An exterior angle is 125 degrees and one remote interior angle is 54 degrees.
    Find the other remote interior angle.
  answer: 71 degrees
  solutionOutline: Use exterior angle equals remote interior sum.
  commonTrap: ''
- id: aops-v1-ch11-q005
  concept: pythagorean-theorem
  difficulty: foundational
  source: original-authoring
  prompt: Find the hypotenuse of a right triangle with legs 9 and 12.
  answer: '15'
  solutionOutline: Compute the square root of 81+144.
  commonTrap: ''
- id: aops-v1-ch11-q006
  concept: pythagorean-converse
  difficulty: foundational
  source: original-authoring
  prompt: Classify a triangle with sides 6, 8, 10.
  answer: Right
  solutionOutline: Compare 6 squared plus 8 squared with 10 squared.
  commonTrap: ''
- id: aops-v1-ch11-q007
  concept: pythagorean-converse
  difficulty: foundational
  source: original-authoring
  prompt: Classify a triangle with sides 5, 6, 8.
  answer: Acute
  solutionOutline: Since 8 squared is less than 5 squared plus 6 squared, it is acute.
  commonTrap: ''
- id: aops-v1-ch11-q008
  concept: pythagorean-converse
  difficulty: foundational
  source: original-authoring
  prompt: Classify a triangle with sides 3, 4, 6.
  answer: Obtuse
  solutionOutline: The longest side squared exceeds the sum of the other squares.
  commonTrap: ''
- id: aops-v1-ch11-q009
  concept: isosceles-triangle
  difficulty: foundational
  source: original-authoring
  prompt: In isosceles triangle ABC, AB=AC and angle B=37 degrees. Find angle A.
  answer: 106 degrees
  solutionOutline: The base angles B and C are equal.
  commonTrap: ''
- id: aops-v1-ch11-q010
  concept: equilateral-triangle
  difficulty: foundational
  source: original-authoring
  prompt: Find each angle of an equilateral triangle.
  answer: 60 degrees
  solutionOutline: All three angles are equal and total 180 degrees.
  commonTrap: ''
- id: aops-v1-ch11-q011
  concept: congruence
  difficulty: foundational
  source: original-authoring
  prompt: Which criterion proves two triangles congruent from three matching side
    lengths?
  answer: SSS
  solutionOutline: Three corresponding side equalities determine the triangle.
  commonTrap: ''
- id: aops-v1-ch11-q012
  concept: congruence
  difficulty: foundational
  source: original-authoring
  prompt: Why is SSA generally insufficient for triangle congruence?
  answer: It can yield two noncongruent triangles.
  solutionOutline: The given angle is not included between the known sides.
  commonTrap: ''
- id: aops-v1-ch11-q013
  concept: similarity
  difficulty: foundational
  source: original-authoring
  prompt: Triangles have corresponding side ratios 2:3 and one matching included angle.
    Are they necessarily similar?
  answer: Not from this information alone.
  solutionOutline: A scale ratio and one angle do not supply a valid general similarity
    criterion.
  commonTrap: ''
- id: aops-v1-ch11-q014
  concept: similarity
  difficulty: foundational
  source: original-authoring
  prompt: Two similar triangles have scale factor 3 from small to large. A small side
    is 7. Find its corresponding large side.
  answer: '21'
  solutionOutline: Multiply every length by the linear scale factor.
  commonTrap: ''
- id: aops-v1-ch11-q015
  concept: similarity-and-area
  difficulty: foundational
  source: original-authoring
  prompt: Similar triangles have linear scale factor 4. What is their area ratio?
  answer: '16:1'
  solutionOutline: Area scales by the square of a length factor.
  commonTrap: ''
- id: aops-v1-ch11-q016
  concept: triangle-area
  difficulty: foundational
  source: original-authoring
  prompt: Find area of a triangle with base 14 and altitude 5.
  answer: '35'
  solutionOutline: Use one half times base times altitude.
  commonTrap: ''
- id: aops-v1-ch11-q017
  concept: triangle-area
  difficulty: foundational
  source: original-authoring
  prompt: A triangle has sides 8 and 10 enclosing a 30 degree angle. Find its area.
  answer: '20'
  solutionOutline: Use one half ab sine C.
  commonTrap: ''
- id: aops-v1-ch11-q018
  concept: right-triangle-trigonometry
  difficulty: foundational
  source: original-authoring
  prompt: In a right triangle, opposite=3 and hypotenuse=5. Find sine theta.
  answer: 3/5
  solutionOutline: Use opposite divided by hypotenuse.
  commonTrap: ''
- id: aops-v1-ch11-q019
  concept: right-triangle-trigonometry
  difficulty: foundational
  source: original-authoring
  prompt: In a right triangle, adjacent=12 and opposite=5. Find tangent theta.
  answer: 5/12
  solutionOutline: Use opposite divided by adjacent.
  commonTrap: ''
- id: aops-v1-ch11-q020
  concept: special-right-triangles
  difficulty: foundational
  source: original-authoring
  prompt: A 45-45-90 triangle has leg 6. Find hypotenuse.
  answer: $6\sqrt2$
  solutionOutline: Hypotenuse is leg times square root of 2.
  commonTrap: ''
- id: aops-v1-ch11-q021
  concept: special-right-triangles
  difficulty: foundational
  source: original-authoring
  prompt: A 30-60-90 triangle has short leg 4. Find long leg.
  answer: $4\sqrt3$
  solutionOutline: The long leg is short leg times square root of 3.
  commonTrap: ''
- id: aops-v1-ch11-q022
  concept: triangle-centers
  difficulty: foundational
  source: original-authoring
  prompt: Which center is equidistant from all three sides of a triangle?
  answer: Incenter
  solutionOutline: It is the intersection of angle bisectors.
  commonTrap: ''
- id: aops-v1-ch11-q023
  concept: triangle-centers
  difficulty: foundational
  source: original-authoring
  prompt: Which center divides each median in a 2:1 ratio from vertex to midpoint?
  answer: Centroid
  solutionOutline: It is the intersection of medians.
  commonTrap: ''
- id: aops-v1-ch11-q024
  concept: triangle-centers
  difficulty: foundational
  source: original-authoring
  prompt: Where is the circumcenter of an acute triangle?
  answer: Inside the triangle
  solutionOutline: Perpendicular bisectors meet inside for acute triangles.
  commonTrap: ''
- id: aops-v1-ch11-q025
  concept: triangle-centers
  difficulty: intermediate
  source: original-authoring
  prompt: A right triangle has legs 5 and 12. Find its circumradius.
  answer: 13/2
  solutionOutline: The circumcenter is midpoint of hypotenuse 13.
  commonTrap: ''
- id: aops-v1-ch11-q026
  concept: similarity
  difficulty: intermediate
  source: original-authoring
  prompt: A line parallel to BC cuts AB at D and AC at E. If AD=4, AB=10, and DE=6,
    find BC.
  answer: '15'
  solutionOutline: Triangles ADE and ABC are similar with scale 2:5.
  commonTrap: ''
- id: aops-v1-ch11-q027
  concept: similarity
  difficulty: intermediate
  source: original-authoring
  prompt: A 10-foot pole casts 6-foot shadow. A tree casts 21-foot shadow. Find tree
    height.
  answer: 35 feet
  solutionOutline: Use similar right triangles from the same sun angle.
  commonTrap: ''
- id: aops-v1-ch11-q028
  concept: right-triangle-altitude
  difficulty: intermediate
  source: original-authoring
  prompt: An altitude to a right triangle hypotenuse splits it into 4 and 9. Find
    hypotenuse.
  answer: '13'
  solutionOutline: The two segments add to the hypotenuse.
  commonTrap: ''
- id: aops-v1-ch11-q029
  concept: right-triangle-altitude
  difficulty: intermediate
  source: original-authoring
  prompt: An altitude to a right triangle hypotenuse splits it into 4 and 9. Find
    altitude.
  answer: '6'
  solutionOutline: Altitude squared is the product 4 times 9.
  commonTrap: ''
- id: aops-v1-ch11-q030
  concept: right-triangle-altitude
  difficulty: intermediate
  source: original-authoring
  prompt: A right triangle hypotenuse is split into 5 and 20 by altitude. Find the
    leg adjacent to the 5 segment.
  answer: 5 square root of 5
  solutionOutline: 'That leg squared is hypotenuse times adjacent segment: 25 times
    5.'
  commonTrap: ''
- id: aops-v1-ch11-q031
  concept: inradius-area
  difficulty: intermediate
  source: original-authoring
  prompt: A triangle has semiperimeter 12 and inradius 3. Find its area.
  answer: '36'
  solutionOutline: Use area equals inradius times semiperimeter.
  commonTrap: ''
- id: aops-v1-ch11-q032
  concept: heron
  difficulty: intermediate
  source: original-authoring
  prompt: Find area of a 3-4-5 triangle by Heron formula.
  answer: '6'
  solutionOutline: Semiperimeter is 6; compute square root of 6 times 3 times 2 times
    1.
  commonTrap: ''
- id: aops-v1-ch11-q033
  concept: median
  difficulty: intermediate
  source: original-authoring
  prompt: A median divides a triangle into two regions. What is their area ratio?
  answer: '1:1'
  solutionOutline: The two triangles share an altitude and have equal bases.
  commonTrap: ''
- id: aops-v1-ch11-q034
  concept: angle-bisector
  difficulty: intermediate
  source: original-authoring
  prompt: An angle bisector meets opposite side in segments 6 and 9. If adjacent side
    near 6 is 8, find the other adjacent side.
  answer: '12'
  solutionOutline: Use side ratio equals split-segment ratio.
  commonTrap: ''
- id: aops-v1-ch11-q035
  concept: triangle-inequality
  difficulty: intermediate
  source: original-authoring
  prompt: How many integer-sided triangles have perimeter 10?
  answer: '2'
  solutionOutline: 'Enumerate ordered side triples with a<=b<=c and apply inequality:
    3,3,4 and 2,4,4.'
  commonTrap: ''
- id: aops-v1-ch11-q036
  concept: congruence-proof
  difficulty: intermediate
  source: original-authoring
  prompt: Two right triangles have equal hypotenuses and one matching leg. Name the
    congruence theorem.
  answer: HL
  solutionOutline: Hypotenuse-leg applies only to right triangles.
  commonTrap: ''
- id: aops-v1-ch11-q037
  concept: similarity-proof
  difficulty: intermediate
  source: original-authoring
  prompt: Why do two triangles created by a line parallel to one side of a triangle
    become similar?
  answer: They have two equal corresponding angles.
  solutionOutline: Parallel-line angles give AA similarity.
  commonTrap: ''
- id: aops-v1-ch11-q038
  concept: trigonometry
  difficulty: intermediate
  source: original-authoring
  prompt: A ladder makes 60 degrees with ground and reaches 8 square root of 3 feet
    high. Find ladder length.
  answer: '16'
  solutionOutline: Height is L sine 60 degrees.
  commonTrap: ''
- id: aops-v1-ch11-q039
  concept: triangle-area
  difficulty: intermediate
  source: original-authoring
  prompt: A triangle has sides 13,14,15. Find its area.
  answer: '84'
  solutionOutline: 'Heron: semiperimeter 21 and square root of 21 times 8 times 7
    times 6.'
  commonTrap: ''
- id: aops-v1-ch11-q040
  concept: triangle-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: Prove that the medians of a triangle concur.
  answer: Use coordinates or area ratios; each median divides area equally and the
    shared ratio locates the common point.
  solutionOutline: A full proof must establish all three medians, not draw their apparent
    intersection.
  commonTrap: ''
- id: aops-v1-ch11-q041
  concept: triangle-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: A triangle has one right angle and one 28 degree angle. Find the third angle.
  answer: 62 degrees
  solutionOutline: Subtract 90 and 28 from 180.
  commonTrap: Using 180-28 only.
- id: aops-v1-ch11-q042
  concept: triangle-inequality
  difficulty: foundational
  source: original-authoring
  prompt: Find the largest integer side if the other sides are 9 and 14.
  answer: '22'
  solutionOutline: The third side is strictly less than 23.
  commonTrap: Allowing 23, which is degenerate.
- id: aops-v1-ch11-q043
  concept: isosceles-triangle
  difficulty: foundational
  source: original-authoring
  prompt: An isosceles triangle has vertex angle 44 degrees. Find a base angle.
  answer: 68 degrees
  solutionOutline: Split the remaining 136 degrees equally.
  commonTrap: Splitting 44 instead.
- id: aops-v1-ch11-q044
  concept: pythagorean-theorem
  difficulty: foundational
  source: original-authoring
  prompt: A right triangle has hypotenuse 17 and one leg 8. Find the other leg.
  answer: '15'
  solutionOutline: Subtract 64 from 289 before square rooting.
  commonTrap: Subtracting 8 from 17.
- id: aops-v1-ch11-q045
  concept: congruence
  difficulty: foundational
  source: original-authoring
  prompt: 'Which information proves congruence: two angles and a nonincluded side?'
  answer: AAS
  solutionOutline: Two angles determine the third and the side fixes scale.
  commonTrap: Calling it AAA.
- id: aops-v1-ch11-q046
  concept: similarity
  difficulty: foundational
  source: original-authoring
  prompt: Which criterion proves similarity from two equal angle pairs?
  answer: AA
  solutionOutline: Two equal angles force the third equal too.
  commonTrap: Using SAS congruence.
- id: aops-v1-ch11-q047
  concept: triangle-area
  difficulty: foundational
  source: original-authoring
  prompt: Find the altitude to base 16 of a triangle with area 56.
  answer: '7'
  solutionOutline: Solve 56=one-half times 16 times h.
  commonTrap: Dividing 56 by 16.
- id: aops-v1-ch11-q048
  concept: trigonometry
  difficulty: foundational
  source: original-authoring
  prompt: Find cosine theta if adjacent=8 and hypotenuse=17.
  answer: 8/17
  solutionOutline: Cosine is adjacent over hypotenuse.
  commonTrap: Using opposite over hypotenuse.
- id: aops-v1-ch11-q049
  concept: special-right-triangles
  difficulty: foundational
  source: original-authoring
  prompt: A 30-60-90 triangle has hypotenuse 18. Find short leg.
  answer: '9'
  solutionOutline: Short leg is half hypotenuse.
  commonTrap: Using 9 square root of 3.
- id: aops-v1-ch11-q050
  concept: triangle-centers
  difficulty: foundational
  source: original-authoring
  prompt: Which center is equidistant from vertices?
  answer: Circumcenter
  solutionOutline: It lies on perpendicular bisectors.
  commonTrap: Incenter.
- id: aops-v1-ch11-q051
  concept: triangle-centers
  difficulty: foundational
  source: original-authoring
  prompt: Where is the orthocenter of an obtuse triangle?
  answer: Outside the triangle
  solutionOutline: Altitudes meet outside in an obtuse triangle.
  commonTrap: At the midpoint of hypotenuse.
- id: aops-v1-ch11-q052
  concept: triangle-area
  difficulty: foundational
  source: original-authoring
  prompt: A triangle has base 20 and area 90. Find altitude.
  answer: '9'
  solutionOutline: Rearrange A=bh/2.
  commonTrap: Using 90/20.
- id: aops-v1-ch11-q053
  concept: similarity-and-perimeter
  difficulty: intermediate
  source: original-authoring
  prompt: Similar triangles have perimeters 24 and 40. A small side is 9. Find corresponding
    large side.
  answer: '15'
  solutionOutline: Linear scale factor is 40/24=5/3.
  commonTrap: Scaling by the area ratio.
- id: aops-v1-ch11-q054
  concept: similarity-and-area
  difficulty: intermediate
  source: original-authoring
  prompt: Similar triangles have areas 25 and 121. Find positive linear scale factor.
  answer: 11/5
  solutionOutline: Take square root of area ratio.
  commonTrap: Using 121/25 as length factor.
- id: aops-v1-ch11-q055
  concept: right-triangle-trigonometry
  difficulty: intermediate
  source: original-authoring
  prompt: From 40 meters away, angle of elevation to a tower top is 30 degrees. Find
    height.
  answer: $40\sqrt3/3$ meters
  solutionOutline: Use tangent equals height over 40.
  commonTrap: Using sine without hypotenuse.
- id: aops-v1-ch11-q056
  concept: right-triangle-trigonometry
  difficulty: intermediate
  source: original-authoring
  prompt: A 13-meter cable reaches a point 5 meters above ground. Find horizontal
    distance.
  answer: 12 meters
  solutionOutline: Use Pythagoras with cable as hypotenuse.
  commonTrap: Subtracting lengths.
- id: aops-v1-ch11-q057
  concept: inradius-area
  difficulty: intermediate
  source: original-authoring
  prompt: A right triangle has legs 6 and 8. Find inradius.
  answer: '2'
  solutionOutline: Area is 24, semiperimeter is 12, so r=2.
  commonTrap: Using half hypotenuse.
- id: aops-v1-ch11-q058
  concept: circumcenter
  difficulty: intermediate
  source: original-authoring
  prompt: Find circumradius of an equilateral triangle of side 6.
  answer: $2\sqrt3$
  solutionOutline: Altitude is $3\sqrt3$ and centroid/circumcenter lies two thirds
    from vertex.
  commonTrap: Using altitude itself.
- id: aops-v1-ch11-q059
  concept: centroid
  difficulty: intermediate
  source: original-authoring
  prompt: A median has length 15. Find vertex-to-centroid distance.
  answer: '10'
  solutionOutline: Centroid divides median 2:1 from vertex.
  commonTrap: Taking 5.
- id: aops-v1-ch11-q060
  concept: angle-bisector
  difficulty: intermediate
  source: original-authoring
  prompt: In triangle ABC, AB=10, AC=15, and angle bisector from A meets BC at D.
    Find BD:DC.
  answer: '2:3'
  solutionOutline: Apply angle-bisector theorem.
  commonTrap: Using 10:25.
- id: aops-v1-ch11-q061
  concept: median
  difficulty: intermediate
  source: original-authoring
  prompt: In triangle ABC, M is midpoint of BC. If area ABC is 72, find area ABM.
  answer: '36'
  solutionOutline: Median creates equal-area triangles.
  commonTrap: Using one third.
- id: aops-v1-ch11-q062
  concept: triangle-inequality
  difficulty: intermediate
  source: original-authoring
  prompt: Find number of integer x such that 7, 11, x make a triangle.
  answer: '13'
  solutionOutline: Integers run from 5 through 17 inclusive.
  commonTrap: Including 4 or 18.
- id: aops-v1-ch11-q063
  concept: congruence
  difficulty: intermediate
  source: original-authoring
  prompt: Two triangles have sides 5,7,9 and 5,7,9. What corresponding angle fact
    follows?
  answer: All corresponding angles are equal.
  solutionOutline: Use SSS congruence then CPCTC.
  commonTrap: Assuming angles before proving congruence.
- id: aops-v1-ch11-q064
  concept: similarity
  difficulty: intermediate
  source: original-authoring
  prompt: Two triangles have angle pairs 40,70 and 40,70. If one has side opposite
    40 equal 6 and other corresponding side 15, find scale factor.
  answer: 5/2
  solutionOutline: AA establishes similarity; use 15/6.
  commonTrap: Using 6/15 for large from small.
- id: aops-v1-ch11-q065
  concept: triangle-area
  difficulty: intermediate
  source: original-authoring
  prompt: Find area of an equilateral triangle with side 10.
  answer: $25\sqrt3$
  solutionOutline: Use altitude $5\sqrt3$ then base-height formula.
  commonTrap: Using 50 square root of 3.
- id: aops-v1-ch11-q066
  concept: heron
  difficulty: intermediate
  source: original-authoring
  prompt: Find area of a triangle with sides 5,5,6.
  answer: '12'
  solutionOutline: Semiperimeter 8; square root of 8 times 3 times 3 times 2.
  commonTrap: Using 15 as semiperimeter.
- id: aops-v1-ch11-q067
  concept: right-triangle-altitude
  difficulty: intermediate
  source: original-authoring
  prompt: A right triangle has hypotenuse 25 and projection of a leg 9. Find that
    leg.
  answer: '15'
  solutionOutline: Leg squared equals hypotenuse times its projection.
  commonTrap: Using 25-9 as leg length.
- id: aops-v1-ch11-q068
  concept: triangle-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: Prove the angle bisector theorem using areas.
  answer: Triangles ABD and ACD share altitude from A, so their area ratio is BD:DC;
    use sine-area expressions with equal half-angles to get AB:AC.
  solutionOutline: Claiming equal areas; their bases generally differ.
  commonTrap: ''
- id: aops-v1-ch11-q069
  concept: triangle-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: Prove that an angle bisector is the locus of points equidistant from the
    angle sides.
  answer: Drop perpendiculars to both sides and use congruent right triangles in both
    directions.
  solutionOutline: Showing only one direction of the locus statement.
  commonTrap: ''
- id: aops-v1-ch11-q070
  concept: triangle-centers
  difficulty: advanced
  source: original-authoring
  prompt: Prove that perpendicular bisectors of a triangle concur.
  answer: Intersect two; equal-distance properties place that point on the third bisector.
  solutionOutline: Assuming the third line passes through the intersection.
  commonTrap: ''
- id: aops-v1-ch11-q071
  concept: similarity-proof
  difficulty: advanced
  source: original-authoring
  prompt: Show that the altitude to hypotenuse of a right triangle forms two triangles
    similar to the original.
  answer: Each small triangle shares an acute angle with original and has a right
    angle, so use AA.
  solutionOutline: Using congruence despite different sizes.
  commonTrap: ''
- id: aops-v1-ch11-q072
  concept: triangle-area
  difficulty: advanced
  source: original-authoring
  prompt: A triangle has sides 13,14,15. Find its inradius.
  answer: '4'
  solutionOutline: Heron gives area 84 and semiperimeter is 21.
  commonTrap: Using 84/42.
- id: aops-v1-ch11-q073
  concept: trigonometry
  difficulty: advanced
  source: original-authoring
  prompt: Prove sine squared theta plus cosine squared theta equals 1.
  answer: Divide the Pythagorean theorem by hypotenuse squared.
  solutionOutline: Adding ratios with mismatched denominators.
  commonTrap: ''
- id: aops-v1-ch11-q074
  concept: triangle-inequality
  difficulty: advanced
  source: original-authoring
  prompt: Prove that the longest side is opposite the largest angle.
  answer: Drop an altitude or compare by the law-of-cosines-style construction; larger
    included angle increases opposite side.
  solutionOutline: Relying on a drawing without proof.
  commonTrap: ''
- id: aops-v1-ch11-q075
  concept: construction
  difficulty: advanced
  source: original-authoring
  prompt: Describe how to construct the circumcenter with straightedge and compass.
  answer: Construct perpendicular bisectors of two sides; their intersection is equidistant
    from all vertices.
  solutionOutline: Constructing angle bisectors instead.
  commonTrap: ''
- id: aops-v1-ch11-q076
  concept: construction
  difficulty: advanced
  source: original-authoring
  prompt: Describe how to construct the incenter.
  answer: Intersect two internal angle bisectors; it is equidistant from all sides.
  solutionOutline: Using perpendicular bisectors.
  commonTrap: ''
- id: aops-v1-ch11-q077
  concept: proof-obligation
  difficulty: advanced
  source: original-authoring
  prompt: Why does equal area not imply congruent triangles?
  answer: Different base-height pairs can have same half-product, e.g. base 6 height
    4 and base 8 height 3.
  solutionOutline: Treating area as a complete size-and-shape invariant.
  commonTrap: ''
- id: aops-v1-ch11-q078
  concept: triangle-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: An equiangular triangle has one angle 60 degrees. What type is it?
  answer: Equilateral
  solutionOutline: Equal angles imply equal opposite sides.
  commonTrap: Thinking equiangular only describes angles.
- id: aops-v1-ch11-q079
  concept: triangle-inequality
  difficulty: foundational
  source: original-authoring
  prompt: Can lengths 2,3,5 form a nondegenerate triangle?
  answer: 'No'
  solutionOutline: The sum of two sides equals the third, giving a degenerate segment.
  commonTrap: Allowing equality in triangle inequality.
- id: aops-v1-ch11-q080
