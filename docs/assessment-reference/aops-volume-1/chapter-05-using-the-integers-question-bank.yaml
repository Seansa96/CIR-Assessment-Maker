metadata:
  id: aops-v1-ch05-using-integers-bank
  title: 'AoPS Volume 1 Chapter 5: Using the Integers Question Bank'
  chapter: 5
  topicIds:
  - aops-integers-number-theory
  sourcePageRange: pdf 53-65; printed 39-51
  originalAuthoring: true
  distribution:
    foundational: 12
    multi-step: 16
    contest-transfer: 8
    proof-strategy: 4
items:
- id: aops-v1-ch05-q001
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: foundational
  questionType: freeResponse
  prompt: List the positive divisors of 18.
  answer: 1, 2, 3, 6, 9, 18
  solutionOutline: Pair factors of 18 systematically.
  commonTrap: Listing 18 twice or omitting 1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q002
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: foundational
  questionType: freeResponse
  prompt: Is 1 prime, composite, or neither?
  answer: Neither
  solutionOutline: 'Use the definition: a prime has exactly two positive divisors.'
  commonTrap: Calling 1 prime because it has no nontrivial factors.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q003
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: foundational
  questionType: freeResponse
  prompt: Find the prime factorization of 360.
  answer: $2^3\cdot3^2\cdot5$
  solutionOutline: Divide by small primes until every factor is prime.
  commonTrap: Stopping at 12 times 30.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q004
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Find $\gcd(84,126)$.
  answer: '42'
  solutionOutline: 'Use common prime powers: $2\cdot3\cdot7$.'
  commonTrap: Taking the larger exponent for a gcd.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q005
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: foundational
  questionType: freeResponse
  prompt: Find $\operatorname{lcm}(18,24)$.
  answer: '72'
  solutionOutline: Take every prime at its largest required exponent.
  commonTrap: Multiplying 18 and 24 without removing overlap.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q006
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: foundational
  questionType: freeResponse
  prompt: Convert $101101_2$ to base ten.
  answer: '45'
  solutionOutline: Expand as $32+8+4+1$.
  commonTrap: Reading the numeral as decimal one hundred one thousand one hundred
    one.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q007
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: foundational
  questionType: freeResponse
  prompt: Write $47$ in base 2.
  answer: $101111_2$
  solutionOutline: Decompose 47 into powers of two.
  commonTrap: Using decimal digits larger than 1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q008
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: foundational
  questionType: freeResponse
  prompt: Find the units digit of $7^{23}$.
  answer: '3'
  solutionOutline: Use the period-four units-digit cycle of powers of 7.
  commonTrap: Using 23 itself as the last digit.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q009
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Find the least nonnegative residue of $-17$ modulo 6.
  answer: '1'
  solutionOutline: Add a multiple of 6 until the result lies from 0 through 5.
  commonTrap: Reporting -5 without converting to the requested representative.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q010
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: foundational
  questionType: freeResponse
  prompt: Compute $38+57\pmod7$.
  answer: '4'
  solutionOutline: Reduce to $3+1$ modulo 7.
  commonTrap: Adding first and forgetting to reduce.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q011
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: foundational
  questionType: freeResponse
  prompt: Is $123456$ divisible by 3?
  answer: 'Yes'
  solutionOutline: Its digit sum is 21, which is divisible by 3.
  commonTrap: Confusing the tests for 3 and 9.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q012
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: foundational
  questionType: freeResponse
  prompt: 'Correct the claim: Is $123456$ divisible by 9?'
  answer: 'No'
  solutionOutline: The digit sum is 21; 21 is not a multiple of 9.
  commonTrap: Calling it divisible because 2+1 is 3.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q013
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the remainder when $2^{20}$ is divided by 7.
  answer: '4'
  solutionOutline: Use $2^3\equiv1\pmod7$, so reduce exponent modulo 3.
  commonTrap: Reducing 20 modulo 7 instead of the power cycle length.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q014
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the number of positive divisors of $2^3 3^2 5$.
  answer: '24'
  solutionOutline: 'Choose exponents independently: $(3+1)(2+1)(1+1)$.'
  commonTrap: Adding exponents instead of adding one and multiplying.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q015
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the greatest integer that divides both 252 and 198.
  answer: '18'
  solutionOutline: 'Use Euclid: 252-198=54, 198 mod 54=36, 54 mod 36=18.'
  commonTrap: Choosing 36 although it does not divide 198.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q016
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the least positive integer divisible by 12, 15, and 18.
  answer: '180'
  solutionOutline: Use $2^2\cdot3^2\cdot5$.
  commonTrap: Using the product 3240.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q017
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: multi-step
  questionType: freeResponse
  prompt: Convert $2A_{16}$ to base ten.
  answer: '42'
  solutionOutline: Use $2\cdot16+10$.
  commonTrap: Treating A as 1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q018
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: multi-step
  questionType: freeResponse
  prompt: Write $100$ in base 5.
  answer: $400_5$
  solutionOutline: Four groups of $25$ make 100.
  commonTrap: Writing $100_5$, which equals 25.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q019
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the remainder when $3^{100}$ is divided by 10.
  answer: '1'
  solutionOutline: The powers of 3 have units cycle 3,9,7,1.
  commonTrap: Using the exponent modulo 10.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q020
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: multi-step
  questionType: freeResponse
  prompt: Show that the sum of two odd integers is even.
  answer: Let $2a+1$ and $2b+1$; their sum is $2(a+b+1)$.
  solutionOutline: Represent each odd integer in defining form.
  commonTrap: Saying two examples are a proof.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q021
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the last two digits of $11^{20}$.
  answer: '01'
  solutionOutline: Since $11^2=121\equiv21$ and powers can be reduced modulo 100;
    or use binomial expansion.
  commonTrap: Assuming the last two digits repeat with period 2 without checking.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q022
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the remainder when $5^{37}+3^{37}$ is divided by 4.
  answer: '0'
  solutionOutline: Reduce $5\equiv1$ and $3\equiv-1$ modulo 4.
  commonTrap: Reducing only one term.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q023
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: multi-step
  questionType: freeResponse
  prompt: A number leaves remainder 2 on division by 5 and remainder 3 on division
    by 4. Give the smallest positive example.
  answer: '7'
  solutionOutline: Test the numbers $2,7,12,\ldots$ modulo 4.
  commonTrap: Using 23 without checking minimality.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q024
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the gcd and lcm of 72 and 120.
  answer: gcd 24, lcm 360
  solutionOutline: Factor both and use minimum/maximum exponents.
  commonTrap: Using the gcd exponents for both values.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q025
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: multi-step
  questionType: freeResponse
  prompt: How many trailing zeros does $50!$ have in base ten?
  answer: '12'
  solutionOutline: "Count factors of 5: $\\lfloor50/5\rfloor+\\lfloor50/25\rfloor$."
  commonTrap: Counting factors of 2 instead of limiting factors of 5.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q026
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: multi-step
  questionType: freeResponse
  prompt: Prove that consecutive integers are coprime.
  answer: Any common divisor divides their difference, 1.
  solutionOutline: Apply the difference property of common divisors.
  commonTrap: Claiming consecutive integers have no factors.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q027
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: multi-step
  questionType: freeResponse
  prompt: Can $n^2$ leave remainder 2 when divided by 4?
  answer: 'No'
  solutionOutline: Check residues 0,1,2,3 modulo 4 and square them.
  commonTrap: Testing only even n.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q028
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the remainder of $1+2+\cdots+100$ modulo 9.
  answer: '1'
  solutionOutline: Use $100\cdot101/2=5050$ and reduce modulo 9.
  commonTrap: Dividing a congruence by 2 without noting 2 is invertible mod 9.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q029
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: What is the smallest base in which $234$ is a valid numeral?
  answer: '5'
  solutionOutline: Every digit must be smaller than the base.
  commonTrap: Answering 4 because 4 is the largest digit.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q030
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Find the base-ten value of $123_4$.
  answer: '27'
  solutionOutline: Compute $1\cdot16+2\cdot4+3$.
  commonTrap: Compute $1+2+3$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q031
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Show that $n^3-n$ is divisible by 6 for every integer n.
  answer: Factor as $n(n-1)(n+1)$; three consecutive integers supply factors 2 and
    3.
  solutionOutline: Use consecutive-integer divisibility.
  commonTrap: Claiming every factor is divisible by 6.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q032
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Find the units digit of $9^{999}$.
  answer: '9'
  solutionOutline: Odd powers of 9 end in 9.
  commonTrap: Using the even-power result 1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q033
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: If $a\equiv b\pmod m$, why may one add the same integer c to both sides?
  answer: Because $(a+c)-(b+c)=a-b$ remains divisible by m.
  solutionOutline: Use the definition of congruence.
  commonTrap: Treating congruence as equality without a divisibility argument.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q034
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Give a counterexample to the claim that $a\equiv b\pmod m$ permits cancellation
    by every nonzero factor.
  answer: '$2\cdot1\equiv2\cdot3\pmod4$, but $1

    ot\equiv3\pmod4$.'
  solutionOutline: Use a noninvertible factor modulo a composite modulus.
  commonTrap: Choosing a factor that is invertible modulo m.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q035
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Explain why a prime factorization is unique up to order.
  answer: The fundamental theorem of arithmetic states it; divisibility by a prime
    forces the same prime to appear in any factorization.
  solutionOutline: State the theorem and its consequence.
  commonTrap: Claiming uniqueness because examples look unique.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q036
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: gcd-lcm
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Find all possible last digits of a square in base ten.
  answer: 0, 1, 4, 5, 6, 9
  solutionOutline: Square the ten possible final digits.
  commonTrap: Listing 2, 3, 7, or 8.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q037
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: base
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Find the remainder when $10^{50}-1$ is divided by 99.
  answer: '0'
  solutionOutline: Since $10^2\equiv1\pmod{99}$, an even power is 1.
  commonTrap: Using $10\equiv1\pmod{99}$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q038
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: remainder
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: A clock has 12 positions. What remainder interpretation explains moving
    29 hours forward?
  answer: 29 is congruent to 5 modulo 12, so move five positions.
  solutionOutline: Model positions by residues modulo 12.
  commonTrap: Calling the remainder 17.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q039
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: proof
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Design a divisibility test for 11 using decimal digits.
  answer: Use alternating digit sum because $10\equiv-1\pmod{11}$.
  solutionOutline: Expand place value modulo 11.
  commonTrap: Using ordinary digit sum, which tests 3 or 9.
  intendedUse: quiz-test-bank
- id: aops-v1-ch05-q040
  skillIds:
  - factor-integers-and-use-divisibility
  - use-modular-arithmetic
  archetype: factor
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Why is modular arithmetic useful for a last-digit question?
  answer: All numbers with the same residue modulo 10 have the same units digit.
  solutionOutline: Connect base-ten last digit to remainder modulo 10.
  commonTrap: Saying it makes numbers smaller without naming the preserved property.
  intendedUse: quiz-test-bank
