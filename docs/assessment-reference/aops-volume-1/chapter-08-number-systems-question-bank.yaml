metadata:
  id: aops-v1-ch08-number-systems-bank
  title: 'AoPS Volume 1 Chapter 8: Number Systems Question Bank'
  chapter: 8
  topicIds:
  - aops-number-systems
  sourcePageRange: pdf 89-94; printed 75-80
  originalAuthoring: true
  distribution:
    foundational: 12
    multi-step: 16
    contest-transfer: 8
    proof-strategy: 4
items:
- id: aops-v1-ch08-q001
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: foundational
  questionType: freeResponse
  prompt: 'Classify -7 in the smallest listed set: natural, integer, rational, real,
    complex.'
  answer: integer
  solutionOutline: It is negative but has no fractional part.
  commonTrap: Calling every negative number irrational.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q002
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: foundational
  questionType: freeResponse
  prompt: Classify $3/8$ in the smallest listed set.
  answer: rational
  solutionOutline: It is a quotient of two integers with nonzero denominator.
  commonTrap: Calling it an integer.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q003
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Classify $\sqrt{49}$ in the smallest listed set.
  answer: natural number
  solutionOutline: It equals 7.
  commonTrap: Classifying by the radical symbol alone.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q004
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: foundational
  questionType: freeResponse
  prompt: Classify $\sqrt2$ in the smallest listed set.
  answer: irrational real
  solutionOutline: It is real but not rational.
  commonTrap: Calling every square root complex.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q005
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: foundational
  questionType: freeResponse
  prompt: Write 0.375 as a fraction in lowest terms.
  answer: $3/8$
  solutionOutline: Use 375/1000 and reduce.
  commonTrap: Stopping before reduction.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q006
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: foundational
  questionType: freeResponse
  prompt: Write $0.\overline{6}$ as a fraction.
  answer: $2/3$
  solutionOutline: Let x=.666..., then 10x-x=6.
  commonTrap: Writing 6/10.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q007
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: foundational
  questionType: freeResponse
  prompt: Is $0.1010010001\ldots$ rational?
  answer: No, assuming the displayed gaps continue growing.
  solutionOutline: Its nonrepeating pattern cannot be eventually periodic.
  commonTrap: Calling it irrational merely because it is long.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q008
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: 'Which is larger: $5/12$ or $3/7$?'
  answer: $3/7$
  solutionOutline: 'Cross multiply positive denominators: 35 versus 36.'
  commonTrap: Comparing only numerators.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q009
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: foundational
  questionType: freeResponse
  prompt: Write $-2.4$ as a lowest-terms fraction.
  answer: $-12/5$
  solutionOutline: Convert -24/10 and reduce.
  commonTrap: Dropping the sign.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q010
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: foundational
  questionType: freeResponse
  prompt: Is 0 rational?
  answer: 'Yes'
  solutionOutline: Use 0/1.
  commonTrap: Thinking a rational number must be nonzero.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q011
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: foundational
  questionType: freeResponse
  prompt: Can a denominator in a rational representation be zero?
  answer: 'No'
  solutionOutline: Division by zero is undefined.
  commonTrap: Using 1/0 as infinity.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q012
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: foundational
  questionType: freeResponse
  prompt: Classify $4+3i$ in the smallest listed set.
  answer: complex nonreal
  solutionOutline: Its imaginary component is nonzero.
  commonTrap: Calling it real because 4 is real.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q013
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Write $0.\overline{27}$ as a fraction.
  answer: $3/11$
  solutionOutline: Let x=.2727..., then 100x-x=27.
  commonTrap: Using 27/100.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q014
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: multi-step
  questionType: freeResponse
  prompt: Write $1.2\overline{3}$ as a fraction.
  answer: $37/30$
  solutionOutline: 'Shift past the nonrepeating digit, then subtract: 100x-10x=111.'
  commonTrap: Treating all digits as repeating.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q015
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: multi-step
  questionType: freeResponse
  prompt: Prove that the sum of a rational and an irrational is irrational.
  answer: If r+x were rational, subtracting rational r would make x rational, contradiction.
  solutionOutline: Use closure of rationals under subtraction.
  commonTrap: Claiming examples alone prove it.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q016
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: multi-step
  questionType: freeResponse
  prompt: Give two irrational numbers whose sum is rational.
  answer: $\sqrt2$ and $-\sqrt2$
  solutionOutline: Their sum is 0.
  commonTrap: Choosing two positives without checking sum.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q017
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: multi-step
  questionType: freeResponse
  prompt: Give two irrational numbers whose product is rational.
  answer: $\sqrt2$ and $\sqrt2$
  solutionOutline: Their product is 2.
  commonTrap: Assuming irrational products are always irrational.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q018
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Is $\sqrt{18}$ rational?
  answer: 'No'
  solutionOutline: Simplify to $3\sqrt2$ and use irrationality of sqrt2.
  commonTrap: Saying 18 is not a perfect square without explanation.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q019
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the smallest set containing $-i$.
  answer: complex
  solutionOutline: It is not real.
  commonTrap: Calling it irrational.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q020
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: multi-step
  questionType: freeResponse
  prompt: Explain why every integer is rational.
  answer: n=n/1.
  solutionOutline: Give a valid nonzero denominator.
  commonTrap: Using n/0.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q021
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: multi-step
  questionType: freeResponse
  prompt: Reduce $84/126$ to lowest terms.
  answer: $2/3$
  solutionOutline: Divide numerator and denominator by gcd 42.
  commonTrap: Dividing by different factors.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q022
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: multi-step
  questionType: freeResponse
  prompt: Does $0.125$ terminate in base ten?
  answer: 'Yes'
  solutionOutline: It has finitely many decimal digits.
  commonTrap: Confusing it with a repeating decimal.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q023
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: What denominator forms allow a lowest-terms rational number to terminate
    in base ten?
  answer: Only powers of 2 times powers of 5.
  solutionOutline: A terminating decimal denominator divides a power of 10.
  commonTrap: Saying any even denominator works.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q024
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: multi-step
  questionType: freeResponse
  prompt: Prove $\sqrt2$ is irrational in outline.
  answer: Assume lowest p/q; p squared=2q squared forces p and q even, contradiction.
  solutionOutline: Use parity and lowest terms.
  commonTrap: Skipping why p even forces q even.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q025
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: multi-step
  questionType: freeResponse
  prompt: 'Which is larger: $7/15$ or $11/24$?'
  answer: $7/15$
  solutionOutline: Compare 7 times 24=168 with 11 times 15=165.
  commonTrap: Comparing denominators alone.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q026
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: multi-step
  questionType: freeResponse
  prompt: If x is rational and nonzero, is 1/x rational?
  answer: 'Yes'
  solutionOutline: If x=p/q, then 1/x=q/p.
  commonTrap: Forgetting x cannot be zero.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q027
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: multi-step
  questionType: freeResponse
  prompt: Is $\sqrt{a^2}$ always a?
  answer: No; it is $|a|$ for real a.
  solutionOutline: Test a negative value.
  commonTrap: Dropping absolute value.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q028
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find a rational between $\sqrt2$ and $3/2$.
  answer: $7/5$
  solutionOutline: Check 1.4 squared is below 2 and 1.5 is above it.
  commonTrap: Using a decimal without verifying bounds.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q029
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Why does a repeating decimal represent a rational number?
  answer: A power-of-ten shift and subtraction produce an integer equation for it.
  solutionOutline: Describe the algebraic mechanism.
  commonTrap: Saying repetition makes it a fraction by definition.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q030
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Classify $\sqrt{-9}$ in the complex system.
  answer: 3i or -3i are square roots; it is nonreal complex.
  solutionOutline: Use i squared=-1.
  commonTrap: Saying the expression has no meaning when complex numbers are allowed.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q031
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Prove that a rational in lowest terms cannot have numerator and denominator
    both even.
  answer: They would share factor 2, contradicting lowest terms.
  solutionOutline: Apply the definition.
  commonTrap: Saying even fractions do not exist.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q032
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Give a counterexample to “the difference of two irrational numbers is irrational.”
  answer: $\sqrt2-\sqrt2=0$.
  solutionOutline: Produce a rational difference.
  commonTrap: Using two unrelated irrationals without computing.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q033
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Choose a proof approach for irrationality of $\sqrt{12}$.
  answer: Reduce to $2\sqrt3$, then use the prime-factor contradiction for sqrt3.
  solutionOutline: Connect to a nonsquare prime factor.
  commonTrap: Trying decimal approximation.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q034
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Why must a rational representation use integers p and q?
  answer: The definition concerns a ratio of integers; allowing arbitrary reals would
    classify every real as x/1.
  solutionOutline: State why the restriction has content.
  commonTrap: Saying fractions visually have integers.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q035
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: If r is rational and x is irrational, can rx be rational when r is nonzero?
  answer: 'No'
  solutionOutline: Otherwise divide by nonzero rational r to make x rational.
  commonTrap: Forgetting the nonzero condition.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q036
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: decimal
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Give a counterexample showing irrational times irrational need not be irrational.
  answer: $\sqrt2\cdot\sqrt2=2$.
  solutionOutline: Compute the product exactly.
  commonTrap: Giving a sum example.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q037
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: closure
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Explain the real-versus-complex distinction for $x^2+1=0$.
  answer: No real x squares to -1, but complex roots are i and -i.
  solutionOutline: Name the permitted number system.
  commonTrap: Saying it has both roots in the reals.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q038
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: proof
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Find the decimal form of $7/40$.
  answer: '0.175'
  solutionOutline: Scale denominator to 1000.
  commonTrap: Writing .17 repeating.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q039
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: restriction
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Verify that $0.\overline{09}=1/11$.
  answer: 'Multiply by 100 and subtract x: 99x=9.'
  solutionOutline: Use the repeated block length.
  commonTrap: Using 9/100.
  intendedUse: quiz-test-bank
- id: aops-v1-ch08-q040
  skillIds:
  - classify-number-sets
  - prove-irrationality
  archetype: classify
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Why is a calculator approximation insufficient to prove irrationality?
  answer: Finite displays cannot establish a decimal never terminates or repeats.
  solutionOutline: Distinguish evidence from proof.
  commonTrap: Treating many digits as a proof.
  intendedUse: quiz-test-bank
