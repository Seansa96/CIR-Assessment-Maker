metadata:
  id: aops-v1-ch04-proportions-bank
  title: 'AoPS Volume 1 Chapter 4: Proportions Question Bank'
  chapter: 4
  topicIds:
  - aops-proportions
  sourcePageRange: pdf 42-52; printed 28-38
  originalAuthoring: true
  distribution:
    foundational: 12
    multi-step: 16
    contest-transfer: 8
    proof-strategy: 4
items:
- id: aops-v1-ch04-q001
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: inverse
  difficulty: foundational
  questionType: freeResponse
  prompt: A quantity y varies directly with x. If y=18 when x=6, find y when x=10.
  answer: '30'
  solutionOutline: Find k=18/6 and compute 3(10).
  commonTrap: Adding 4 instead of scaling.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q002
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: ratio
  difficulty: foundational
  questionType: freeResponse
  prompt: A quantity y varies inversely with x. If y=12 when x=4, find y when x=8.
  answer: '6'
  solutionOutline: 'Keep xy constant: 12(4)=y(8).'
  commonTrap: Using 12/4=8/y incorrectly.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q003
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: scale
  difficulty: foundational
  questionType: freeResponse
  prompt: Red and blue beads are in the ratio 3:5. If there are 32 beads, how many
    are red?
  answer: '12'
  solutionOutline: There are 8 total ratio parts; take 3/8 of 32.
  commonTrap: Using 3/5 of the total.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q004
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: percent
  difficulty: foundational
  questionType: freeResponse
  prompt: On a 1:50,000 map, 3 cm represents what actual distance?
  answer: 1.5 km
  solutionOutline: Multiply 3 cm by 50,000 and convert centimeters to kilometers.
  commonTrap: Stopping at 150,000 cm without converting units.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q005
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: rate
  difficulty: foundational
  questionType: freeResponse
  prompt: A price rises from $80 to $100. What is the percent increase?
  answer: 25%
  solutionOutline: Divide the change 20 by the original 80.
  commonTrap: Dividing by the new price.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q006
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: mixture
  difficulty: foundational
  questionType: freeResponse
  prompt: Five identical notebooks cost $17.50. What do three cost?
  answer: $10.50
  solutionOutline: Find one notebook price, then multiply by 3.
  commonTrap: Multiplying the five-book price by 3.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q007
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: strategy
  difficulty: foundational
  questionType: freeResponse
  prompt: A recipe uses flour:sugar=2:3. How much sugar is needed for 20 cups of flour?
  answer: 30 cups
  solutionOutline: Scale both recipe parts by 20/2.
  commonTrap: Reversing flour and sugar.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q008
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: direct
  difficulty: foundational
  questionType: freeResponse
  prompt: Similar triangles have scale factor 3 from small to large. A 12-unit side
    becomes what length?
  answer: '36'
  solutionOutline: Multiply the small side by the linear scale factor.
  commonTrap: Scaling area instead of a side.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q009
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: inverse
  difficulty: foundational
  questionType: freeResponse
  prompt: A car travels 150 miles in 3 hours at constant speed. Find its speed.
  answer: 50 mph
  solutionOutline: Use rate=distance/time.
  commonTrap: Using 150 times 3.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q010
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: ratio
  difficulty: foundational
  questionType: freeResponse
  prompt: Convert 2.5 meters to centimeters.
  answer: 250 cm
  solutionOutline: Use 100 centimeters per meter.
  commonTrap: Treating 2.5 as 25 cm.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q011
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: scale
  difficulty: foundational
  questionType: freeResponse
  prompt: If a:b=4:7 and b=35, find a.
  answer: '20'
  solutionOutline: The scale factor from 7 to 35 is 5; multiply 4 by 5.
  commonTrap: Scaling both terms by different factors.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q012
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: percent
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve 6/9=x/30.
  answer: '20'
  solutionOutline: Cross multiply 6(30)=9x.
  commonTrap: Cross multiplying 6x=9(30).
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q013
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: rate
  difficulty: multi-step
  questionType: freeResponse
  prompt: A $50 meal has 18% tax. Find the total.
  answer: $59
  solutionOutline: Compute 50(1.18).
  commonTrap: Adding 18 dollars rather than 18 percent.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q014
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: mixture
  difficulty: multi-step
  questionType: freeResponse
  prompt: After a 25% discount, a jacket costs $54. Find its original price.
  answer: $72
  solutionOutline: 'The sale price is 75% of original: 54/.75.'
  commonTrap: Subtracting 25% of 54.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q015
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: strategy
  difficulty: multi-step
  questionType: freeResponse
  prompt: Six workers finish a job in 10 days at equal rates. How many days for 15
    workers?
  answer: 4 days
  solutionOutline: Fixed work means workers times days is constant.
  commonTrap: Treating workers and days as direct variation.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q016
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: direct
  difficulty: multi-step
  questionType: freeResponse
  prompt: A map scale is 1 inch:8 miles. Two towns are 5.5 inches apart. Find the
    actual distance.
  answer: 44 miles
  solutionOutline: Multiply the map length by 8 miles per inch.
  commonTrap: Dividing by 8 rather than multiplying.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q017
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: inverse
  difficulty: multi-step
  questionType: freeResponse
  prompt: A solution is 30% acid. How much acid is in 250 mL?
  answer: 75 mL
  solutionOutline: Take 30% of 250.
  commonTrap: Taking 30% as 0.03.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q018
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: ratio
  difficulty: multi-step
  questionType: freeResponse
  prompt: A 12-ounce drink is 25% juice. How many ounces of pure juice must be added
    to make it 40% juice?
  answer: 3 ounces
  solutionOutline: Let x be added juice and solve (3+x)/(12+x)=.4.
  commonTrap: Adding 3 ounces without solving for the new total.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q019
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: scale
  difficulty: multi-step
  questionType: freeResponse
  prompt: A machine makes 180 parts in 12 minutes. At that rate, how many in 35 minutes?
  answer: '525'
  solutionOutline: Find 15 parts per minute then multiply by 35.
  commonTrap: Dividing 180 by 35.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q020
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: percent
  difficulty: multi-step
  questionType: freeResponse
  prompt: A photograph is enlarged from 4 by 6 inches to 10 inches wide. Find the
    new height.
  answer: 15 inches
  solutionOutline: The width scale is 10/4; apply it to 6.
  commonTrap: Using an area scale factor.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q021
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: rate
  difficulty: multi-step
  questionType: freeResponse
  prompt: A $120 item is discounted 20% and then taxed 10% on the discounted price.
    Find the final price.
  answer: $105.60
  solutionOutline: Apply the discount first, then tax the reduced amount.
  commonTrap: Taxing the original price.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q022
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: mixture
  difficulty: multi-step
  questionType: freeResponse
  prompt: A pump fills 3/8 of a tank in 15 minutes. At a constant rate, how long for
    the full tank?
  answer: 40 minutes
  solutionOutline: If 3/8 needs 15 minutes, one whole needs 8/3 as long.
  commonTrap: Assuming 15 minutes per eighth.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q023
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: strategy
  difficulty: multi-step
  questionType: freeResponse
  prompt: A 4-person team needs 18 days. If two equally productive people join from
    day 1, how many days are needed?
  answer: 12 days
  solutionOutline: Work is 72 person-days, so divide by 6 people.
  commonTrap: Adding workers and days.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q024
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: direct
  difficulty: multi-step
  questionType: freeResponse
  prompt: A mixture has milk:water=7:3. How much water is in 45 liters?
  answer: 13.5 liters
  solutionOutline: Take 3/10 of 45 liters.
  commonTrap: Taking 7/10 of the water.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q025
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: inverse
  difficulty: multi-step
  questionType: freeResponse
  prompt: A currency exchange charges 2% of the amount exchanged. How many euros are
    received when $500 converts at 0.90 euro per dollar after the fee?
  answer: 441 euros
  solutionOutline: The fee leaves .98(500); exchange the remainder at .90.
  commonTrap: Charging the fee after conversion without saying so.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q026
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: ratio
  difficulty: multi-step
  questionType: freeResponse
  prompt: A 5-foot person casts a 4-foot shadow. At the same moment a tree casts a
    28-foot shadow. Find the tree height.
  answer: 35 feet
  solutionOutline: Equal sun angle gives height/shadow=5/4.
  commonTrap: Comparing heights without shadows.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q027
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: scale
  difficulty: multi-step
  questionType: freeResponse
  prompt: A store marks an item up 30% and later discounts the marked price 30%. Is
    the final price the original price?
  answer: No; it is 91% of the original.
  solutionOutline: Compare factors 1.30 and .70.
  commonTrap: Subtracting 30%-30%=0.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q028
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: percent
  difficulty: multi-step
  questionType: freeResponse
  prompt: Three taps fill a pool in 6, 8, and 12 hours respectively. What fraction
    of the pool do they fill in one hour together?
  answer: 3/8
  solutionOutline: Add hourly rates 1/6+1/8+1/12.
  commonTrap: Adding times rather than rates.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q029
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: rate
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A classroom ratio of girls to boys is 5:4. After 6 girls leave, it is 7:6.
    Find the original class size.
  answer: '162'
  solutionOutline: Let girls=5k and boys=4k; solve (5k-6)/(4k)=7/6.
  commonTrap: Changing only one ratio part after six leave.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q030
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: mixture
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A 15% solution is mixed with a 45% solution to make 20 liters of 30% solution.
    How many liters of each are used?
  answer: 10 L of each
  solutionOutline: Let x be liters of 15%; the other amount is 20-x.
  commonTrap: Averaging 15% and 45% without amounts.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q031
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: strategy
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A runner increases speed from 8 to 10 km/h. By what percent does travel
    time for a fixed distance decrease?
  answer: 20%
  solutionOutline: For fixed distance time is inverse to speed; compare 8/10.
  commonTrap: Saying time decreases 25%.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q032
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: direct
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A blueprint uses 1 cm for 2.4 m. A room measures 7.5 cm on the blueprint.
    Find the actual length.
  answer: 18 m
  solutionOutline: Multiply 7.5 by 2.4.
  commonTrap: Reversing the blueprint scale.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q033
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: inverse
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: The ratios p:q=2:3 and q:r=4:5. Find p:q:r in whole-number form.
  answer: '8:12:15'
  solutionOutline: Match q using LCM 12 before combining ratios.
  commonTrap: Combining ratios without matching q.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q034
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: ratio
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A recipe for 8 servings uses 1.5 cups of rice. You have 4.875 cups. What
    is the greatest whole number of servings possible?
  answer: '26'
  solutionOutline: Find servings per cup, then take the largest integer not exceeding
    the result.
  commonTrap: Rounding up beyond available rice.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q035
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: scale
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Why does cross multiplication in a/b=c/d require b and d to be nonzero?
  answer: The original fractions are undefined otherwise.
  solutionOutline: State the domain restriction before multiplying.
  commonTrap: Cancelling denominators that could be zero.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q036
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: percent
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Give a counterexample showing that a constant difference does not prove
    direct variation.
  answer: For example y=x+1 has constant difference but y/x is not constant.
  solutionOutline: Compare y/x, not y-x, for direct variation.
  commonTrap: Mistaking a linear pattern for proportionality.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q037
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: rate
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: 'Choose a model: does the time to transfer a fixed file vary directly or
    inversely with download speed?'
  answer: Inversely
  solutionOutline: For fixed file size, time=filesize/speed.
  commonTrap: Calling it direct because speed increases.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q038
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: mixture
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Explain why successive 20% increase and 20% decrease do not cancel.
  answer: They use different bases; factor 1.2 times 0.8 is 0.96.
  solutionOutline: Compute the two multiplicative factors.
  commonTrap: Subtracting percentages instead of multiplying factors.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q039
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: strategy
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Two similar rectangles have side ratio 2:5. What is their area ratio, and
    why?
  answer: 4:25; area scales by the square of the length factor.
  solutionOutline: Square the linear ratio 2:5.
  commonTrap: Using 2:5 for area.
  intendedUse: quiz-test-bank
- id: aops-v1-ch04-q040
  skillIds:
  - apply-proportions
  - check-proportions-restrictions
  archetype: direct
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: A recipe is doubled and then made 25% smaller than that doubled batch. What
    multiple of the original batch remains?
  answer: 1.5 times the original
  solutionOutline: Compute 2 times .75.
  commonTrap: Treating 25% smaller as subtracting .25 from the original after doubling.
  intendedUse: quiz-test-bank
