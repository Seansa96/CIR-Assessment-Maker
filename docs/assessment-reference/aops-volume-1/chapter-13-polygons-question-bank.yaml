  commonTrap: ''
- id: aops-v1-ch13-q069
  concept: polygon-optimization
  difficulty: advanced
  source: original-authoring
  prompt: Why does increased regularity tend to increase area for fixed perimeter?
  answer: Redistributing unequal adjacent lengths/angles toward equality reduces wasted
    boundary; formal proof uses isoperimetric principles.
  solutionOutline: Because regular shapes look round.
  commonTrap: ''
- id: aops-v1-ch13-q070
  concept: diagram-assumption-check
  difficulty: advanced
  source: original-authoring
  prompt: Why may a polygon drawing not establish convexity?
  answer: A reflex angle must be marked, measured, or proved.
  solutionOutline: Concavity is always obvious in sketches.
  commonTrap: ''
- id: aops-v1-ch13-q071
  concept: mixed-polygon-triangle
  difficulty: advanced
  source: original-authoring
  prompt: A regular hexagon has side 6. Find distance between opposite vertices.
  answer: '12'
  solutionOutline: Opposite vertices lie on a diameter of circumcircle radius 6.
  commonTrap: $6\sqrt3$.
- id: aops-v1-ch13-q072
  concept: mixed-polygon-triangle
  difficulty: advanced
  source: original-authoring
  prompt: 'A regular hexagon side 6: find long diagonal skipping one vertex.'
