  solutionOutline: Each axis passes through a vertex and opposite side midpoint.
  commonTrap: n/2.
- id: aops-v1-ch13-q065
  concept: polygon-symmetry
  difficulty: advanced
  source: original-authoring
  prompt: How many reflection axes does a regular even n-gon have?
  answer: n
  solutionOutline: Half join opposite vertices and half opposite side midpoints.
  commonTrap: n/2.
- id: aops-v1-ch13-q066
  concept: regular-polygon-area
  difficulty: advanced
  source: original-authoring
  prompt: Derive regular polygon area using central triangles.
