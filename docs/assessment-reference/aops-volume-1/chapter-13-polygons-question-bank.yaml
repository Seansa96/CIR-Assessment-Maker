items:
- id: aops-v1-ch13-q001
  concept: polygon-classification
  difficulty: foundational
  source: original-authoring
  prompt: How many sides does a hexagon have?
  answer: '6'
  solutionOutline: Use the name prefix.
  commonTrap: '5.'
- id: aops-v1-ch13-q002
  concept: polygon-classification
  difficulty: foundational
  source: original-authoring
  prompt: What is a convex polygon?
  answer: One whose interior angles are all less than 180 degrees.
  solutionOutline: Use the convexity definition.
  commonTrap: Any polygon with equal sides.
- id: aops-v1-ch13-q003
  concept: interior-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: Find interior-angle sum of a pentagon.
  answer: 540 degrees
  solutionOutline: Use (n-2) times 180 with n=5.
  commonTrap: 360 degrees.
- id: aops-v1-ch13-q004
  concept: interior-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: Find interior-angle sum of an octagon.
  answer: 1080 degrees
  solutionOutline: Use six triangles.
  commonTrap: 1440 degrees.
- id: aops-v1-ch13-q005
  concept: exterior-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: What is sum of one exterior angle at each vertex of a convex polygon?
  answer: 360 degrees
  solutionOutline: One circuit makes a full turn.
  commonTrap: 180 degrees.
- id: aops-v1-ch13-q006
  concept: regular-polygon-angles
  difficulty: foundational
  source: original-authoring
  prompt: Find each exterior angle of regular hexagon.
  answer: 60 degrees
  solutionOutline: Divide 360 by 6.
  commonTrap: 120 degrees.
- id: aops-v1-ch13-q007
  concept: regular-polygon-angles
  difficulty: foundational
  source: original-authoring
  prompt: Find each interior angle of regular pentagon.
  answer: 108 degrees
  solutionOutline: Use 540 divided by 5.
  commonTrap: 72 degrees.
- id: aops-v1-ch13-q008
  concept: polygon-diagonals
  difficulty: foundational
  source: original-authoring
  prompt: How many diagonals does a quadrilateral have?
  answer: '2'
  solutionOutline: Use n(n-3)/2.
  commonTrap: '4.'
- id: aops-v1-ch13-q009
  concept: polygon-diagonals
  difficulty: foundational
  source: original-authoring
  prompt: How many diagonals does a pentagon have?
  answer: '5'
  solutionOutline: Use 5 times 2 divided by 2.
  commonTrap: '10.'
- id: aops-v1-ch13-q010
  concept: regular-polygon-area
  difficulty: foundational
  source: original-authoring
  prompt: A regular polygon has perimeter 24 and apothem 5. Find area.
  answer: '60'
  solutionOutline: Use one-half apothem times perimeter.
  commonTrap: '120.'
- id: aops-v1-ch13-q011
  concept: regular-polygon-angles
  difficulty: foundational
  source: original-authoring
  prompt: A regular polygon exterior angle is 45 degrees. How many sides?
  answer: '8'
  solutionOutline: Divide 360 by 45.
  commonTrap: '4.'
- id: aops-v1-ch13-q012
  concept: polygon-classification
  difficulty: foundational
  source: original-authoring
  prompt: Is a regular polygon necessarily equiangular?
  answer: 'Yes'
  solutionOutline: Regular means equal sides and equal angles.
  commonTrap: No.
- id: aops-v1-ch13-q013
  concept: interior-angle-sum
  difficulty: intermediate
  source: original-authoring
  prompt: A polygon interior-angle sum is 1260 degrees. Find number of sides.
  answer: '9'
  solutionOutline: Solve (n-2)180=1260.
  commonTrap: '7.'
- id: aops-v1-ch13-q014
  concept: regular-polygon-angles
  difficulty: intermediate
  source: original-authoring
  prompt: Each interior angle of regular polygon is 150 degrees. Find n.
  answer: '12'
  solutionOutline: Exterior is 30; 360/30.
  commonTrap: '10.'
- id: aops-v1-ch13-q015
  concept: polygon-diagonals
  difficulty: intermediate
  source: original-authoring
  prompt: A polygon has 27 diagonals. Find n.
  answer: '9'
  solutionOutline: Solve n(n-3)/2=27.
  commonTrap: '8.'
- id: aops-v1-ch13-q016
  concept: exterior-angle-sum
  difficulty: intermediate
  source: original-authoring
  prompt: Exterior angles of a convex polygon are 70,80,90,120. Is this possible?
  answer: 'Yes'
  solutionOutline: They sum to 360.
  commonTrap: No because angles differ.
- id: aops-v1-ch13-q017
  concept: interior-angle-sum
  difficulty: intermediate
  source: original-authoring
  prompt: Find one missing angle if hexagon interior angles total 720 and five sum
    610.
  answer: 110 degrees
  solutionOutline: Subtract known sum.
  commonTrap: 180 degrees.
- id: aops-v1-ch13-q018
  concept: regular-polygon-area
  difficulty: intermediate
  source: original-authoring
  prompt: A regular hexagon side is 4. Find area.
  answer: $24\sqrt3$
  solutionOutline: It is six equilateral triangles of area $4\sqrt3$.
  commonTrap: $16\sqrt3$.
- id: aops-v1-ch13-q019
  concept: regular-polygon-area
  difficulty: intermediate
  source: original-authoring
  prompt: A regular octagon has perimeter 40 and apothem 6. Find area.
  answer: '120'
  solutionOutline: Use one-half 40 times 6.
  commonTrap: '240.'
- id: aops-v1-ch13-q020
  concept: polygon-symmetry
  difficulty: intermediate
  source: original-authoring
  prompt: How many lines of symmetry has regular decagon?
  answer: '10'
  solutionOutline: One for each vertex/side pattern.
  commonTrap: '5.'
- id: aops-v1-ch13-q021
  concept: polygon-symmetry
  difficulty: intermediate
  source: original-authoring
  prompt: What rotational symmetry angle maps a regular nonagon to itself first?
  answer: 40 degrees
  solutionOutline: 360/9.
  commonTrap: 45 degrees.
- id: aops-v1-ch13-q022
  concept: polygon-triangulation
  difficulty: intermediate
  source: original-authoring
  prompt: How many triangles arise by drawing diagonals from one vertex of decagon?
  answer: '8'
  solutionOutline: An n-gon gives n-2 triangles.
  commonTrap: '7.'
- id: aops-v1-ch13-q023
  concept: polygon-diagonals
  difficulty: intermediate
  source: original-authoring
  prompt: How many diagonals start from one vertex of a heptagon?
  answer: '4'
  solutionOutline: Exclude itself and two adjacent vertices.
  commonTrap: '7.'
- id: aops-v1-ch13-q024
  concept: regular-polygon-angles
  difficulty: intermediate
  source: original-authoring
  prompt: Find central angle of regular 15-gon.
  answer: 24 degrees
  solutionOutline: 360/15.
  commonTrap: 12 degrees.
- id: aops-v1-ch13-q025
  concept: polygon-classification
  difficulty: advanced
  source: original-authoring
  prompt: Prove interior-angle sum formula for convex n-gon.
  answer: Triangulate from one vertex into n-2 triangles.
  solutionOutline: Assuming formula by pattern.
  commonTrap: ''
- id: aops-v1-ch13-q026
  concept: exterior-angle-sum
  difficulty: advanced
  source: original-authoring
  prompt: Prove exterior-angle sum is 360 degrees.
  answer: Track directed turning through one closed convex boundary.
  solutionOutline: Adding interior angles directly.
  commonTrap: ''
- id: aops-v1-ch13-q027
  concept: polygon-diagonals
  difficulty: advanced
  source: original-authoring
  prompt: Derive n(n-3)/2 diagonal formula.
  answer: Each vertex joins n-3 nonneighbors; divide by two for double count.
  solutionOutline: Forgetting double counting.
  commonTrap: ''
- id: aops-v1-ch13-q028
  concept: regular-polygon-area
  difficulty: advanced
  source: original-authoring
  prompt: Prove area equals one-half apothem times perimeter.
  answer: Decompose into n center triangles sharing apothem height.
  solutionOutline: Using circle area formula.
  commonTrap: ''
- id: aops-v1-ch13-q029
  concept: polygon-converse
  difficulty: advanced
  source: original-authoring
  prompt: Give counterexample to “equiangular means regular.”
  answer: A non-square rectangle is equiangular but unequal-sided.
  solutionOutline: Using a regular square.
  commonTrap: ''
- id: aops-v1-ch13-q030
  concept: polygon-symmetry
  difficulty: advanced
  source: original-authoring
  prompt: Why is every regular polygon cyclic?
  answer: All vertices are equally distant from its center.
  solutionOutline: Assuming all polygons are cyclic.
  commonTrap: ''
- id: aops-v1-ch13-q031
  concept: mixed-polygon-circle
  difficulty: advanced
  source: original-authoring
  prompt: A regular hexagon is inscribed in circle radius 7. Find side.
  answer: '7'
  solutionOutline: Each central triangle is equilateral.
  commonTrap: '14.'
- id: aops-v1-ch13-q032
  concept: mixed-polygon-circle
  difficulty: advanced
  source: original-authoring
  prompt: A square is inscribed in circle radius 5. Find its side.
  answer: $5\sqrt2$
  solutionOutline: Diagonal is diameter 10.
  commonTrap: '10.'
- id: aops-v1-ch13-q033
  concept: construction
  difficulty: advanced
  source: original-authoring
  prompt: Describe construction of a regular hexagon in a given circle.
  answer: Step the radius around the circumference six times.
  solutionOutline: Divide diameter into six parts.
  commonTrap: ''
- id: aops-v1-ch13-q034
  concept: polygon-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: Why can concave polygons require care in triangulation?
  answer: Some vertex-to-vertex segments leave the interior.
  solutionOutline: Their angles merely look different.
  commonTrap: ''
- id: aops-v1-ch13-q035
  concept: diagram-assumption-check
  difficulty: advanced
  source: original-authoring
  prompt: Why does a symmetric-looking polygon not prove regularity?
  answer: Equal sides/angles need marks or proof.
  solutionOutline: Symmetry in a drawing is a theorem.
  commonTrap: ''
- id: aops-v1-ch13-q036
  concept: regular-polygon-angles
  difficulty: advanced
  source: original-authoring
  prompt: A regular polygon has an interior angle twice its exterior angle. Find n.
  answer: '6'
  solutionOutline: Let exterior x; 180-x=2x, then n=360/x.
  commonTrap: '3.'
- id: aops-v1-ch13-q037
  concept: polygon-optimization
  difficulty: advanced
  source: original-authoring
  prompt: Among n-gons with fixed perimeter, which has maximal area?
  answer: The regular n-gon.
  solutionOutline: Symmetry/optimization result; use as advanced principle.
  commonTrap: A degenerate polygon.
- id: aops-v1-ch13-q038
  concept: mixed-polygon-triangle
  difficulty: advanced
  source: original-authoring
  prompt: Connect alternate vertices of regular hexagon. What triangle forms?
  answer: Equilateral
  solutionOutline: The selected chords subtend equal 120-degree arcs and are equal.
  commonTrap: Right triangle.
- id: aops-v1-ch13-q039
  concept: classification
  difficulty: advanced
  source: original-authoring
  prompt: Can a concave polygon be regular under ordinary Euclidean definition?
  answer: 'No'
  solutionOutline: Equal interior angles in a simple regular polygon are convex.
  commonTrap: Yes if one vertex is reflex.
- id: aops-v1-ch13-q040
  concept: proof-obligation
  difficulty: advanced
  source: original-authoring
  prompt: Why is an exterior angle not simply 180 minus any interior angle without
    orientation?
  answer: It must be the adjacent turn along a chosen traversal.
  solutionOutline: Every nonadjacent angle pairs with it.
  commonTrap: ''
- id: aops-v1-ch13-q041
  concept: polygon-classification
  difficulty: foundational
  source: original-authoring
  prompt: How many sides has a nonagon?
  answer: '9'
  solutionOutline: Use the name prefix.
  commonTrap: '8.'
- id: aops-v1-ch13-q042
  concept: polygon-classification
  difficulty: foundational
  source: original-authoring
  prompt: What is a concave polygon?
  answer: One with an interior angle greater than 180 degrees.
  solutionOutline: Use the reflex-angle criterion.
  commonTrap: One with unequal sides.
