items:
- id: aops-v1-ch03-q001
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $3x-7=14$
  answer: x=7
  solutionOutline: Add 7 and divide by 3; substitute 7 back.
  commonTrap: Dividing before undoing subtraction.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q002
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $5-2x=17$
  answer: x=-6
  solutionOutline: Subtract 5 and divide by -2.
  commonTrap: Dropping the negative sign.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q003
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $4(x-3)=2x+6$
  answer: x=9
  solutionOutline: Distribute, collect x terms, then isolate x.
  commonTrap: Forgetting to distribute.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q004
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $x/3+5=9$
  answer: x=12
  solutionOutline: Subtract 5, then multiply the entire equation by 3.
  commonTrap: Treating x/3+5 as (x/3+5)/3.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q005
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $7(x+1)-2=3x+18$
  answer: x=13/4
  solutionOutline: Expand first and collect like terms.
  commonTrap: Combining unlike terms.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q006
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: foundational
  questionType: freeResponse
  prompt: Classify $4x+2=4x+2$
  answer: infinitely many solutions
  solutionOutline: Cancel 4x to obtain the identity 2=2.
  commonTrap: Calling an identity one solution.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q007
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: foundational
  questionType: freeResponse
  prompt: Classify $3x-5=3x+1$
  answer: no solution
  solutionOutline: Cancel 3x to obtain the contradiction -5=1.
  commonTrap: Calling a contradiction infinitely many solutions.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q008
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: foundational
  questionType: freeResponse
  prompt: Find the slope through $(2,3)$ and $(6,11)$
  answer: '2'
  solutionOutline: 'Use rise over run: (11-3)/(6-2).'
  commonTrap: Using x/y instead of coordinate differences.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q009
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $x+y=9$, $x-y=1$
  answer: x=5,y=4
  solutionOutline: Add the two equations, then recover y.
  commonTrap: Stopping after x.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q010
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $2x+y=7$, $x-y=2$
  answer: x=3,y=1
  solutionOutline: Substitute y=x-2 into 2x+y=7.
  commonTrap: Using y=x+2.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q011
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: foundational
  questionType: freeResponse
  prompt: Does $(2,-1)$ satisfy $3x+2y=4$?
  answer: 'yes'
  solutionOutline: Plug both coordinates into the equation.
  commonTrap: Checking only one coordinate.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q012
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: foundational
  questionType: freeResponse
  prompt: Write an equation with slope -3 through $(1,4)$
  answer: y-4=-3(x-1)
  solutionOutline: Use point-slope form with (1,4).
  commonTrap: Treating 4 as an intercept.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q013
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $3(x-2)=2(x+5)+x$
  answer: no solution
  solutionOutline: Expand; cancellation leaves unequal constants.
  commonTrap: Dividing by a vanished coefficient.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q014
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $2(x+1)-3=5x-6$
  answer: x=5/3
  solutionOutline: Simplify the left side before moving terms.
  commonTrap: Moving a term with the wrong sign.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q015
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: multi-step
  questionType: freeResponse
  prompt: A taxi costs $4 plus $2.50 per mile; cost is $19$. Miles?
  answer: '6'
  solutionOutline: Model cost as 4+2.5m=19.
  commonTrap: Omitting the fixed fee.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q016
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: multi-step
  questionType: freeResponse
  prompt: Two consecutive integers sum to 41. Find them.
  answer: 20,21
  solutionOutline: Let the integers be n and n+1.
  commonTrap: Using n and n+2.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q017
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: multi-step
  questionType: freeResponse
  prompt: A rectangle has perimeter 34 and length 3 more than width. Find dimensions.
  answer: 10,7
  solutionOutline: Let width be w and use 2w+2(w+3)=34.
  commonTrap: Using area rather than perimeter.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q018
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $x/2+y/3=4$ and $x+y=9$
  answer: x=6,y=3
  solutionOutline: Clear denominators, then solve with x+y=9.
  commonTrap: Multiplying only one term by 6.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q019
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find intersection of $y=2x+1$ and $y=7-x$
  answer: (2,5)
  solutionOutline: Set 2x+1 equal to 7-x.
  commonTrap: Averaging expressions for y.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q020
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: multi-step
  questionType: freeResponse
  prompt: A mixture has 3 kg more water than juice and totals 17 kg. Find each.
  answer: water=10,juice=7
  solutionOutline: Let juice be j and water be j+3.
  commonTrap: Giving the extra 3 kg to both amounts.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q021
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: multi-step
  questionType: freeResponse
  prompt: What operation eliminates y from $4x+3y=8$ and $2x-3y=10$?
  answer: add equations
  solutionOutline: Add because 3y and -3y cancel.
  commonTrap: Subtracting and doubling y.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q022
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $0.2x+1.5=2.7$
  answer: x=6
  solutionOutline: Subtract 1.5 and divide by 0.2.
  commonTrap: Treating .2 as 2.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q023
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: multi-step
  questionType: freeResponse
  prompt: A number increased by 8 is twice itself minus 1. Find it.
  answer: '9'
  solutionOutline: Write n+8=2n-1 before solving.
  commonTrap: Writing 8n.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q024
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $|x-4|=7$
  answer: x=11,-3
  solutionOutline: Solve the positive and negative absolute-value cases.
  commonTrap: Keeping one branch only.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q025
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: multi-step
  questionType: freeResponse
  prompt: Explain why $x=0$ must be checked before dividing an equation by x.
  answer: division by zero can discard a case
  solutionOutline: State that division by zero is undefined and may discard cases.
  commonTrap: Assuming x can be cancelled.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q026
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $3x+2y=12$, $6x+4y=24$
  answer: infinitely many solutions
  solutionOutline: Recognize the second equation as twice the first.
  commonTrap: Reporting one point.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q027
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $x+y=4$, $2x+2y=11$
  answer: no solution
  solutionOutline: Compare 2 times the first equation with the second.
  commonTrap: Calling proportional equations inconsistent.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q028
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: multi-step
  questionType: freeResponse
  prompt: A 120-mile trip takes 2 hours partly at 50 mph and partly at 70 mph. Times?
  answer: 1 hour each
  solutionOutline: Let t be time at 50 mph and use 50t+70(2-t)=120.
  commonTrap: Using average speed without time variables.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q029
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Prove an equation has at most one solution when it simplifies to $ax=b$
    with $a\ne0$.
  answer: division by nonzero a gives one value
  solutionOutline: Divide ax=b by the nonzero a to get x=b/a.
  commonTrap: Forgetting a must be nonzero.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q030
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Give a counterexample to “two equations always have one intersection.”
  answer: parallel distinct lines
  solutionOutline: Name distinct parallel lines as the counterexample.
  commonTrap: Giving coincident lines.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q031
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Choose substitution or elimination for $y=3x-2$ and $4x+y=9$.
  answer: substitution
  solutionOutline: Use substitution because y is already isolated.
  commonTrap: Choosing elimination by habit.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q032
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Explain the invariant in solving an equation.
  answer: both sides remain equal
  solutionOutline: State that reversible steps preserve exactly the solution set.
  commonTrap: Preserving equality but not solutions.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q033
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A solution obtained x=-2 for a count. What must be decided?
  answer: whether context permits it
  solutionOutline: Compare the algebraic result with the quantity being counted.
  commonTrap: Accepting a negative count.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q034
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Derive the distance-rate-time equation from units.
  answer: distance=rate times time
  solutionOutline: Multiply rate units (distance/time) by time.
  commonTrap: Adding incompatible units.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q035
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Why can multiplying an equation by zero destroy information?
  answer: both sides become 0
  solutionOutline: Explain that both sides become zero regardless of the original
    relation.
  commonTrap: Thinking 0=0 proves the original equation.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q036
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: system
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Create a system with solution $(1,2)$.
  answer: any two independent lines through point
  solutionOutline: Give two nonparallel equations through (1,2).
  commonTrap: Choosing parallel lines.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q037
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: model
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Explain why a check uses original equations.
  answer: transformations may introduce errors
  solutionOutline: Substitute into the original, not merely a simplified line.
  commonTrap: Checking a transformed equation only.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q038
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: classification
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: A store discounts 20% then adds $6 tax; write cost from price p.
  answer: 0.8p+6
  solutionOutline: Translate 20% off as 0.8p, then add 6.
  commonTrap: Discounting the tax too.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q039
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: proof
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Identify the unknowns before modeling a coin problem.
  answer: counts of each coin
  solutionOutline: Define variables as the two coin counts.
  commonTrap: Using dollar values instead of counts.
  intendedUse: quiz-test-bank
- id: aops-v1-ch03-q040
  skillIds:
  - apply-linear-equations
  - verify-linear-equations-solutions
  archetype: isolate
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Describe a graphical meaning of no solution in a system.
  answer: distinct parallel lines
  solutionOutline: Describe equal slopes with different intercepts.
  commonTrap: Saying simply that lines do not cross.
  intendedUse: quiz-test-bank
