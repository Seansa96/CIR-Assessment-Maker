items:
- id: aops-v1-ch07-q001
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: foundational
  questionType: freeResponse
  prompt: Factor $x^2-49$.
  answer: $(x-7)(x+7)$
  solutionOutline: Apply the difference-of-squares identity.
  commonTrap: Using $(x-49)(x+1).
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q002
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: foundational
  questionType: freeResponse
  prompt: Factor $8a^3-27$.
  answer: $(2a-3)(4a^2+6a+9)$
  solutionOutline: Recognize $(2a)^3-3^3$.
  commonTrap: Using a minus sign in the quadratic factor.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q003
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: foundational
  questionType: freeResponse
  prompt: Factor $x^3+125$.
  answer: $(x+5)(x^2-5x+25)$
  solutionOutline: Recognize a sum of cubes.
  commonTrap: Making both signs positive.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q004
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Evaluate $1003^2-997^2$.
  answer: '12000'
  solutionOutline: Use $(1003-997)(1003+997)$.
  commonTrap: Squaring both large numbers first.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q005
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: foundational
  questionType: freeResponse
  prompt: Expand $(a-b)^2$.
  answer: $a^2-2ab+b^2$
  solutionOutline: Square the binomial or multiply it by itself.
  commonTrap: Using plus 2ab.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q006
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: foundational
  questionType: freeResponse
  prompt: Simplify $x^2+6x+9$.
  answer: $(x+3)^2$
  solutionOutline: It is a perfect-square trinomial.
  commonTrap: Factoring as $(x+9)(x+1).
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q007
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: foundational
  questionType: freeResponse
  prompt: Factor $27y^3+8$.
  answer: $(3y+2)(9y^2-6y+4)$
  solutionOutline: Use $(3y)^3+2^3$.
  commonTrap: Using $(3y-2)$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q008
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: foundational
  questionType: freeResponse
  prompt: If $a+b=10$ and $ab=21$, find $a^2+b^2$.
  answer: '58'
  solutionOutline: Square the sum and subtract 2ab.
  commonTrap: Computing $10^2-21$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q009
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: If $x+1/x=5$, find $x^2+1/x^2$.
  answer: '23'
  solutionOutline: Square the given relation and subtract 2.
  commonTrap: Squaring each term but omitting the cross term.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q010
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: foundational
  questionType: freeResponse
  prompt: Factor $16m^4-n^4$.
  answer: $(4m^2-n^2)(4m^2+n^2)$
  solutionOutline: First use a difference of squares.
  commonTrap: Treating it as a difference of cubes.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q011
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: foundational
  questionType: freeResponse
  prompt: Is $a^2+b^2=(a+b)(a-b)$?
  answer: 'No'
  solutionOutline: Expand the right side to get $a^2-b^2$.
  commonTrap: Trusting visual similarity.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q012
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: foundational
  questionType: freeResponse
  prompt: Factor $x^3-x$.
  answer: $x(x-1)(x+1)$
  solutionOutline: Factor x, then factor a difference of squares.
  commonTrap: Stopping at x times $(x^2-1)$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q013
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: multi-step
  questionType: freeResponse
  prompt: Evaluate $51^2-49^2$.
  answer: '200'
  solutionOutline: Use $(51-49)(51+49)$.
  commonTrap: Treating it as $(2)^2.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q014
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Factor $2x^3+16$.
  answer: $2(x+2)(x^2-2x+4)$
  solutionOutline: Factor 2, then use sum of cubes.
  commonTrap: Forgetting the common factor.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q015
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: multi-step
  questionType: freeResponse
  prompt: If $p+q=7$ and $pq=10$, find $p^3+q^3$.
  answer: '133'
  solutionOutline: Use $(p+q)^3-3pq(p+q)$.
  commonTrap: Using $7^3-10$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q016
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $(x+4)^2-(x-4)^2$.
  answer: 16x
  solutionOutline: Treat as a difference of squares with factors 8 and 2x.
  commonTrap: Expanding only one square.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q017
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: multi-step
  questionType: freeResponse
  prompt: Factor $a^4-16$.
  answer: $(a-2)(a+2)(a^2+4)$
  solutionOutline: Use difference of squares twice.
  commonTrap: Factoring $a^2+4$ over the reals.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q018
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: multi-step
  questionType: freeResponse
  prompt: If $r+1/r=3$, find $r^3+1/r^3$.
  answer: '18'
  solutionOutline: 'Cube the sum: $27=r^3+1/r^3+9$.'
  commonTrap: Using 27-3.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q019
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Factor $x^3-8y^3$.
  answer: $(x-2y)(x^2+2xy+4y^2)$
  solutionOutline: Use difference of cubes.
  commonTrap: Using a negative middle term.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q020
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find $99^2$ without ordinary multiplication.
  answer: '9801'
  solutionOutline: Use $(100-1)^2=10000-200+1$.
  commonTrap: Using $10000-1$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q021
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: multi-step
  questionType: freeResponse
  prompt: If $u-v=4$ and $uv=3$, find $u^2+v^2$.
  answer: '22'
  solutionOutline: 'Square $u-v$: 16 equals sum of squares minus 6.'
  commonTrap: Subtracting 6 rather than adding it.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q022
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: multi-step
  questionType: freeResponse
  prompt: "Simplify $\frac{x^2-1}{x-1}$ for $x\ne1$."
  answer: $x+1$
  solutionOutline: Factor numerator and cancel the factor only under its restriction.
  commonTrap: Claiming the result is defined at x=1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q023
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: multi-step
  questionType: freeResponse
  prompt: 'Factor by grouping: $ax+ay+bx+by$.'
  answer: $(a+b)(x+y)$
  solutionOutline: Group first two and last two terms, then factor common binomial.
  commonTrap: Cancelling a or b.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q024
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: If $z+1/z=4$, find $z^2+1/z^2$.
  answer: '14'
  solutionOutline: Square and subtract 2.
  commonTrap: Using 16-1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q025
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find $1001\cdot999$.
  answer: '999999'
  solutionOutline: Use $(1000+1)(1000-1)$.
  commonTrap: Multiplying 1001 by 999 directly.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q026
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: multi-step
  questionType: freeResponse
  prompt: Why is $(x+y)(x-y)$ not a factorization of $x^2+y^2$?
  answer: It expands to $x^2-y^2$.
  solutionOutline: Expand to check the claimed identity.
  commonTrap: Saying it fails only for negative inputs.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q027
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find all real x satisfying $x^4-13x^2+36=0$.
  answer: $x=\pm2,\pm3$
  solutionOutline: Let u=x squared and factor $(u-4)(u-9)$.
  commonTrap: Reporting u=4,9 as x values.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q028
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: multi-step
  questionType: freeResponse
  prompt: If a+b=6 and a squared+b squared=20, find ab.
  answer: '8'
  solutionOutline: 'Square the sum: 36=20+2ab.'
  commonTrap: Using 36-20 without dividing by 2.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q029
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Simplify $(x^2+x+1)(x-1)$.
  answer: $x^3-1$
  solutionOutline: Distribute and observe cancellation.
  commonTrap: Calling it $x^3+1$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q030
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A positive x satisfies x+1/x=2. Find x.
  answer: '1'
  solutionOutline: 'Equality case: $(x-1)^2/x=0$, or solve $x^2-2x+1=0$.'
  commonTrap: Giving x=-1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q031
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Prove $a^3-b^3$ is divisible by a-b.
  answer: Use $a^3-b^3=(a-b)(a^2+ab+b^2)$.
  solutionOutline: Exhibit the quotient.
  commonTrap: Testing a few numerical cases only.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q032
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: 'Explain why $x

    e0$ is required before multiplying $x+1/x=5$ by x.'
  answer: The original reciprocal is undefined at zero.
  solutionOutline: Record the domain before a transformation.
  commonTrap: Assuming multiplication makes zero harmless.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q033
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Give a counterexample to cancelling x in $x(x-1)=x(x-2)$.
  answer: x=0 satisfies both originals but not $x-1=x-2$.
  solutionOutline: Use the zero factor that cancellation would discard.
  commonTrap: Choosing nonzero x.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q034
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Choose a fast method for $1000001^2-999999^2$.
  answer: Use difference of squares to get $4,000,000$.
  solutionOutline: Recognize the numbers as 1,000,000 plus/minus 1.
  commonTrap: Subtracting the bases before squaring.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q035
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Why does knowing a+b and ab often suffice for symmetric expressions?
  answer: Many can be rewritten using elementary symmetric quantities, such as $a^2+b^2=(a+b)^2-2ab$.
  solutionOutline: Name the rewrite.
  commonTrap: Claiming it determines a and b uniquely.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q036
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: symmetry
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Find $a^4+b^4$ if a+b=3 and ab=1.
  answer: '47'
  solutionOutline: First get $a^2+b^2=7$, then square and subtract $2a^2b^2$.
  commonTrap: Using $7^2-2$ without explaining the square.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q037
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: reciprocal
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Construct two distinct real numbers with sum 5 and product 6.
  answer: 2 and 3
  solutionOutline: Use roots of $t^2-5t+6$.
  commonTrap: Giving 1 and 4.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q038
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: grouping
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: When does $a^2-b^2=0$ imply a=b?
  answer: Only with extra conditions; in general a=\pm b.
  solutionOutline: Factor $(a-b)(a+b)=0$.
  commonTrap: Ignoring the a=-b branch.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q039
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: proof
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Verify the sum-of-cubes identity by expansion.
  answer: $(a+b)(a^2-ab+b^2)=a^3+b^3$.
  solutionOutline: Distribute every term and cancel.
  commonTrap: Leaving an uncancelled ab squared term.
  intendedUse: quiz-test-bank
- id: aops-v1-ch07-q040
  skillIds:
  - recognize-special-factorizations
  - manipulate-symmetric-expressions
  archetype: identity
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Explain a purposeful “add zero” move for $x^2+6x$.
  answer: Add and subtract 9 to create $(x+3)^2-9$.
  solutionOutline: Create a useful square without changing value.
  commonTrap: Adding 6 because it is visible.
  intendedUse: quiz-test-bank
