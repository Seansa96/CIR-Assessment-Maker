metadata:
  id: aops-v1-ch12-quadrilaterals-bank
  chapter: 12
  topicIds:
  - aops-quadrilaterals
  status: in-progress
  minimumRequiredItems: 150
  sourcePageRange: pdf 132-140; printed 118-126
items:
- id: aops-v1-ch12-q001
  concept: quadrilateral-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: Find the fourth angle of a quadrilateral with angles 80,95,110 degrees.
  answer: 75 degrees
  solutionOutline: Subtract 285 from 360.
  commonTrap: Using triangle sum 180.
- id: aops-v1-ch12-q002
  concept: parallelogram-properties
  difficulty: foundational
  source: original-authoring
  prompt: In parallelogram ABCD, AB=13. Find CD.
  answer: '13'
  solutionOutline: Opposite sides of a parallelogram are equal.
  commonTrap: Using adjacent side.
- id: aops-v1-ch12-q003
  concept: parallelogram-properties
  difficulty: foundational
  source: original-authoring
  prompt: One angle of a parallelogram is 68 degrees. Find an adjacent angle.
  answer: 112 degrees
  solutionOutline: Consecutive angles are supplementary.
  commonTrap: Using 68 degrees.
- id: aops-v1-ch12-q004
  concept: rectangle-properties
  difficulty: foundational
  source: original-authoring
  prompt: A rectangle has sides 6 and 8. Find its diagonal.
  answer: '10'
  solutionOutline: Use Pythagoras.
  commonTrap: Adding 6 and 8.
- id: aops-v1-ch12-q005
  concept: rhombus-properties
  difficulty: foundational
  source: original-authoring
  prompt: A rhombus has diagonals 10 and 24. Find its area.
  answer: '120'
  solutionOutline: Use half product of perpendicular diagonals.
  commonTrap: Using full product.
- id: aops-v1-ch12-q006
  concept: square-properties
  difficulty: foundational
  source: original-authoring
  prompt: A square has side 7. Find its diagonal.
  answer: $7\sqrt2$
  solutionOutline: Use a 45-45-90 triangle.
  commonTrap: Using 14.
- id: aops-v1-ch12-q007
  concept: trapezoid-area
  difficulty: foundational
  source: original-authoring
  prompt: A trapezoid has bases 8 and 14 and height 5. Find area.
  answer: '55'
  solutionOutline: Use half sum of bases times height.
  commonTrap: Using 110.
- id: aops-v1-ch12-q008
  concept: kite-properties
  difficulty: foundational
  source: original-authoring
  prompt: A kite has perpendicular diagonals 12 and 9. Find area.
  answer: '54'
  solutionOutline: Use half the diagonal product.
  commonTrap: Using 108.
- id: aops-v1-ch12-q009
  concept: parallelogram-test
  difficulty: foundational
  source: original-authoring
  prompt: 'Which property proves a quadrilateral is a parallelogram: diagonals bisect
    each other?'
  answer: 'Yes'
  solutionOutline: This is a converse test.
  commonTrap: Thinking equal diagonals alone is enough.
- id: aops-v1-ch12-q010
  concept: rectangle-properties
  difficulty: foundational
  source: original-authoring
  prompt: What is every interior angle of a rectangle?
  answer: 90 degrees
  solutionOutline: A rectangle is a parallelogram with a right angle.
  commonTrap: 360 degrees.
- id: aops-v1-ch12-q011
  concept: rhombus-properties
  difficulty: foundational
  source: original-authoring
  prompt: What do rhombus diagonals do?
  answer: They bisect each other at right angles.
  solutionOutline: State both properties.
  commonTrap: Saying they are always congruent.
- id: aops-v1-ch12-q012
  concept: trapezoid-properties
  difficulty: foundational
  source: original-authoring
  prompt: What is the midsegment length of a trapezoid with bases 6 and 18?
  answer: '12'
  solutionOutline: Average the bases.
  commonTrap: Taking difference 12.
- id: aops-v1-ch12-q013
  concept: parallelogram-area
  difficulty: intermediate
  source: original-authoring
  prompt: A parallelogram has base 15 and height 7. Find area.
  answer: '105'
  solutionOutline: Use base times perpendicular height.
  commonTrap: Using side length if not altitude.
- id: aops-v1-ch12-q014
  concept: parallelogram-area
  difficulty: intermediate
  source: original-authoring
  prompt: Adjacent sides 8 and 10 enclose 30 degrees. Find parallelogram area.
  answer: '40'
  solutionOutline: Use ab sine theta.
  commonTrap: Using half ab sine theta.
- id: aops-v1-ch12-q015
  concept: rectangle-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A rectangle has diagonal 13 and width 5. Find length.
  answer: '12'
  solutionOutline: Use Pythagoras.
  commonTrap: Subtracting 5.
- id: aops-v1-ch12-q016
  concept: rhombus-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A rhombus side is 13 and one diagonal is 10. Find other diagonal.
  answer: '24'
  solutionOutline: 'Half diagonals and side form right triangle: 5,12,13.'
  commonTrap: Using 26.
- id: aops-v1-ch12-q017
  concept: trapezoid-area
  difficulty: intermediate
  source: original-authoring
  prompt: An isosceles trapezoid has bases 10,18 and legs 5. Find height.
  answer: '3'
  solutionOutline: Each horizontal offset is 4; use 3-4-5 triangle.
  commonTrap: Using height 5.
- id: aops-v1-ch12-q018
  concept: trapezoid-area
  difficulty: intermediate
  source: original-authoring
  prompt: Using previous trapezoid, find area.
  answer: '42'
  solutionOutline: Average bases 14 times height 3.
  commonTrap: Using 84.
- id: aops-v1-ch12-q019
  concept: diagonal-reasoning
  difficulty: intermediate
  source: original-authoring
  prompt: Parallelogram diagonals intersect at O. If AO=9, find OC.
  answer: '9'
  solutionOutline: Diagonals bisect each other.
  commonTrap: Using 18.
- id: aops-v1-ch12-q020
  concept: rectangle-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A rectangle has diagonal 10 and makes 30 degrees with its base. Find shorter
    side.
  answer: '5'
  solutionOutline: Opposite side is 10 sine 30.
  commonTrap: Using $5\sqrt3$.
- id: aops-v1-ch12-q021
  concept: square-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A square has diagonal 12. Find area.
  answer: '72'
  solutionOutline: Side squared is diagonal squared divided by 2.
  commonTrap: Using 144.
- id: aops-v1-ch12-q022
  concept: kite-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A kite has diagonals 14 and 20. Find area.
  answer: '140'
  solutionOutline: Use half product.
  commonTrap: Using 280.
- id: aops-v1-ch12-q023
  concept: parallelogram-test
  difficulty: intermediate
  source: original-authoring
  prompt: A quadrilateral has one pair of opposite sides both parallel and equal.
    Classify it.
  answer: Parallelogram
  solutionOutline: This is a sufficient test.
  commonTrap: Trapezoid only.
- id: aops-v1-ch12-q024
  concept: rhombus-test
  difficulty: intermediate
  source: original-authoring
  prompt: A parallelogram has perpendicular diagonals. Classify it.
  answer: Rhombus
  solutionOutline: Perpendicular diagonals in a parallelogram imply equal sides.
  commonTrap: Rectangle.
- id: aops-v1-ch12-q025
  concept: rectangle-test
  difficulty: intermediate
  source: original-authoring
  prompt: A parallelogram has congruent diagonals. Classify it.
  answer: Rectangle
  solutionOutline: Congruent diagonals in a parallelogram imply right angles.
  commonTrap: Rhombus.
- id: aops-v1-ch12-q026
  concept: isosceles-trapezoid
  difficulty: intermediate
  source: original-authoring
  prompt: An isosceles trapezoid has base angle 70 degrees. Find the other angle on
    same leg.
  answer: 110 degrees
  solutionOutline: Angles along a leg are supplementary.
  commonTrap: 70 degrees.
- id: aops-v1-ch12-q027
  concept: quadrilateral-angle-sum
  difficulty: intermediate
  source: original-authoring
  prompt: Three angles of a parallelogram are 2x,3x,2x. Find x.
  answer: 36 degrees
  solutionOutline: Opposite angles equal, so the data require 2x+3x=180.
  commonTrap: Using all three as independent.
- id: aops-v1-ch12-q028
  concept: diagonal-reasoning
  difficulty: intermediate
  source: original-authoring
  prompt: A rectangle has sides 9 and 12. Find distance from diagonal intersection
    to a vertex.
  answer: 15/2
  solutionOutline: It is half the diagonal 15.
  commonTrap: Using 15.
- id: aops-v1-ch12-q029
  concept: quadrilateral-converses
  difficulty: advanced
  source: original-authoring
  prompt: Give a counterexample to “a quadrilateral with equal diagonals is a rectangle.”
  answer: An isosceles trapezoid that is not a rectangle.
  solutionOutline: Equal diagonals alone do not ensure opposite sides parallel.
  commonTrap: Giving a square, which is a rectangle.
- id: aops-v1-ch12-q030
  concept: parallelogram-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove opposite sides of a parallelogram are equal.
  answer: Draw a diagonal; alternate interior angles and shared diagonal give congruent
    triangles.
  solutionOutline: Assuming equality from a sketch.
  commonTrap: ''
- id: aops-v1-ch12-q031
  concept: trapezoid-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove the trapezoid midsegment has length average of bases.
  answer: Use similar triangles or coordinate heights to show its endpoints divide
    legs equally.
  solutionOutline: Averaging without proving midpoint relation.
  commonTrap: ''
- id: aops-v1-ch12-q032
  concept: rhombus-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove diagonals of a rhombus are perpendicular.
  answer: Use congruent SSS triangles formed by a diagonal and show bisected angles
    create equal supplementary angles.
  solutionOutline: Claiming all parallelogram diagonals are perpendicular.
  commonTrap: ''
- id: aops-v1-ch12-q033
  concept: quadrilateral-area
  difficulty: advanced
  source: original-authoring
  prompt: Prove area of a rhombus with perpendicular diagonals is half their product.
  answer: Split into four right triangles and add their areas.
  solutionOutline: Using formula without the perpendicular hypothesis.
  commonTrap: ''
- id: aops-v1-ch12-q034
  concept: parallelogram-area
  difficulty: advanced
  source: original-authoring
  prompt: Prove area of a parallelogram is base times height.
  answer: Cut a corner triangle and translate it to form a rectangle.
  solutionOutline: Changing area during the move.
  commonTrap: ''
- id: aops-v1-ch12-q035
  concept: rectangle-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove a parallelogram with one right angle is a rectangle.
  answer: Consecutive angles supplementary and opposite angles equal force all four
    right.
  solutionOutline: Assuming adjacent angles are equal.
  commonTrap: ''
- id: aops-v1-ch12-q036
  concept: square-classification
  difficulty: advanced
  source: original-authoring
  prompt: What two properties prove a parallelogram is a square?
  answer: It is both a rectangle and a rhombus.
  solutionOutline: Combine right-angle and equal-side characterizations.
  commonTrap: Equal diagonals and equal area.
- id: aops-v1-ch12-q037
  concept: orthodiagonal
  difficulty: advanced
  source: original-authoring
  prompt: A quadrilateral has perpendicular diagonals 16 and 30. Find area.
  answer: '240'
  solutionOutline: Use half product, valid for orthodiagonal quadrilateral.
  commonTrap: Using 480.
- id: aops-v1-ch12-q038
  concept: diagonal-reasoning
  difficulty: advanced
  source: original-authoring
  prompt: A rhombus has diagonals 18 and 24. Find side length.
  answer: '15'
  solutionOutline: Half diagonals 9 and 12 make right triangle.
  commonTrap: Using 21.
- id: aops-v1-ch12-q039
  concept: trapezoid-area
  difficulty: advanced
  source: original-authoring
  prompt: A trapezoid has area 96, bases 10 and 14. Find height.
  answer: '8'
  solutionOutline: Area is 12h.
  commonTrap: Using 4.
- id: aops-v1-ch12-q040
  concept: quadrilateral-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: Why is “opposite sides look equal” not a proof of parallelogram?
  answer: Diagrams are not necessarily to scale; use a converse test or marked relation.
  solutionOutline: Saying drawings are never useful.
  commonTrap: ''
- id: aops-v1-ch12-q041
  concept: quadrilateral-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: A quadrilateral has three right angles. Find the fourth.
  answer: 90 degrees
  solutionOutline: Four angles total 360 degrees.
  commonTrap: Using 180 degrees.
- id: aops-v1-ch12-q042
  concept: parallelogram-properties
  difficulty: foundational
  source: original-authoring
  prompt: Opposite angles in a parallelogram are what?
  answer: Equal
  solutionOutline: Use parallel sides and alternate interior angles.
  commonTrap: Supplementary in every case.
- id: aops-v1-ch12-q043
  concept: rectangle-properties
  difficulty: foundational
  source: original-authoring
  prompt: A rectangle has diagonals 18. What is each diagonal length?
  answer: '18'
  solutionOutline: Rectangle diagonals are congruent.
  commonTrap: '9.'
- id: aops-v1-ch12-q044
  concept: rhombus-properties
  difficulty: foundational
  source: original-authoring
  prompt: A rhombus has four sides of what relation?
  answer: Equal length
  solutionOutline: This is the defining side property.
  commonTrap: Parallel only.
- id: aops-v1-ch12-q045
  concept: square-properties
  difficulty: foundational
  source: original-authoring
  prompt: Is every square a rectangle?
  answer: 'Yes'
  solutionOutline: It has four right angles.
  commonTrap: No because it has equal sides.
- id: aops-v1-ch12-q046
  concept: square-properties
  difficulty: foundational
  source: original-authoring
  prompt: Is every rectangle a square?
  answer: 'No'
  solutionOutline: A rectangle need not have equal adjacent sides.
  commonTrap: Yes because both have right angles.
- id: aops-v1-ch12-q047
  concept: trapezoid-properties
  difficulty: foundational
  source: original-authoring
  prompt: What sides are called bases of a trapezoid?
  answer: The parallel sides
  solutionOutline: They define the height direction.
  commonTrap: The equal sides.
- id: aops-v1-ch12-q048
  concept: kite-properties
  difficulty: foundational
  source: original-authoring
  prompt: A kite has which adjacent side condition?
  answer: Two pairs of adjacent congruent sides
  solutionOutline: This distinguishes it from a general quadrilateral.
  commonTrap: Opposite sides congruent.
- id: aops-v1-ch12-q049
  concept: parallelogram-area
  difficulty: foundational
  source: original-authoring
  prompt: Find area of a parallelogram base 11 height 4.
  answer: '44'
  solutionOutline: Use bh.
  commonTrap: Using 22.
- id: aops-v1-ch12-q050
  concept: trapezoid-area
  difficulty: foundational
  source: original-authoring
  prompt: Find area of trapezoid bases 5,9 height 6.
  answer: '42'
  solutionOutline: Average bases 7, multiply by 6.
  commonTrap: Using 84.
- id: aops-v1-ch12-q051
  concept: quadrilateral-angle-sum
  difficulty: intermediate
  source: original-authoring
  prompt: A quadrilateral has angles x,2x,3x,4x. Find x.
  answer: 36 degrees
  solutionOutline: Ten x equals 360.
  commonTrap: Using 18.
- id: aops-v1-ch12-q052
  concept: parallelogram-properties
  difficulty: intermediate
  source: original-authoring
  prompt: In parallelogram, AB=3x+1 and CD=19. Find x.
  answer: '6'
  solutionOutline: Set opposite sides equal.
  commonTrap: Using 19/3.
- id: aops-v1-ch12-q053
  concept: parallelogram-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A parallelogram angle is 3x and adjacent angle is 5x. Find x.
  answer: 45 degrees
  solutionOutline: Adjacent angles sum to 180.
  commonTrap: Using 22.5.
- id: aops-v1-ch12-q054
  concept: diagonal-reasoning
  difficulty: intermediate
  source: original-authoring
  prompt: Diagonals of a parallelogram meet at O. If AC=26, find AO.
  answer: '13'
  solutionOutline: O bisects diagonal AC.
  commonTrap: Using 26.
- id: aops-v1-ch12-q055
  concept: rectangle-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A rectangle has perimeter 30 and width 6. Find diagonal.
  answer: $3\sqrt5$
  solutionOutline: Length is 9; use Pythagoras.
  commonTrap: Using 15.
- id: aops-v1-ch12-q056
  concept: square-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A square has area 98. Find its diagonal.
  answer: '14'
  solutionOutline: Diagonal squared is twice area.
  commonTrap: Using $7\sqrt2$.
- id: aops-v1-ch12-q057
  concept: rhombus-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A rhombus has area 96 and one diagonal 12. Find other diagonal.
  answer: '16'
  solutionOutline: 96=half times 12 times d.
  commonTrap: Using 8.
- id: aops-v1-ch12-q058
  concept: trapezoid-midsegment
  difficulty: intermediate
  source: original-authoring
  prompt: Trapezoid midsegment is 17 and one base 9. Find other base.
  answer: '25'
  solutionOutline: Midsegment equals half sum.
  commonTrap: Using 8.
- id: aops-v1-ch12-q059
  concept: isosceles-trapezoid
  difficulty: intermediate
  source: original-authoring
  prompt: An isosceles trapezoid has one base angle 55. Find all angles.
  answer: 55,55,125,125
  solutionOutline: Base angles match and same-leg angles supplement.
  commonTrap: Four 55-degree angles.
- id: aops-v1-ch12-q060
  concept: kite-properties
  difficulty: intermediate
  source: original-authoring
  prompt: A kite has diagonal lengths 16 and 25. Find area.
  answer: '200'
  solutionOutline: Use half product.
  commonTrap: Using 400.
- id: aops-v1-ch12-q061
  concept: coordinate-quadrilateral
  difficulty: intermediate
  source: original-authoring
  prompt: Classify points (0,0),(4,0),(4,3),(0,3).
  answer: Rectangle
  solutionOutline: Opposite sides are parallel and adjacent slopes are perpendicular.
  commonTrap: Square.
- id: aops-v1-ch12-q062
  concept: coordinate-quadrilateral
  difficulty: intermediate
  source: original-authoring
  prompt: Classify points (0,0),(3,0),(4,2),(1,2).
  answer: Parallelogram
  solutionOutline: Opposite side vectors match.
  commonTrap: Rectangle.
- id: aops-v1-ch12-q063
  concept: parallelogram-test
  difficulty: advanced
  source: original-authoring
  prompt: Prove that both pairs of opposite sides equal implies parallelogram.
  answer: Draw a diagonal; SSS gives alternate interior angles equal, hence both parallel
    pairs.
  solutionOutline: Assuming equal lengths imply parallel.
  commonTrap: ''
- id: aops-v1-ch12-q064
  concept: quadrilateral-converses
  difficulty: advanced
  source: original-authoring
  prompt: Give counterexample to “perpendicular diagonals imply rhombus.”
  answer: A non-square kite with perpendicular diagonals.
  solutionOutline: Perpendicularity alone does not give diagonal bisection.
  commonTrap: Using a rhombus.
- id: aops-v1-ch12-q065
  concept: quadrilateral-converses
  difficulty: advanced
  source: original-authoring
  prompt: Give counterexample to “a quadrilateral with one pair parallel is a parallelogram.”
  answer: A non-parallelogram trapezoid.
  solutionOutline: Need both pairs parallel or a valid converse.
  commonTrap: Using a rectangle.
- id: aops-v1-ch12-q066
  concept: rectangle-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove diagonals of a rectangle are equal.
  answer: Each diagonal is hypotenuse of congruent right triangles with the same two
    side lengths.
  solutionOutline: Assuming it from the drawing.
  commonTrap: ''
- id: aops-v1-ch12-q067
  concept: rhombus-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove each diagonal of a rhombus bisects opposite angles.
  answer: Use SSS congruence of the two triangles cut by a diagonal.
  solutionOutline: Using only equal diagonals.
  commonTrap: ''
- id: aops-v1-ch12-q068
  concept: trapezoid-proof
  difficulty: advanced
  source: original-authoring
  prompt: Prove base angles of an isosceles trapezoid are equal.
  answer: Drop altitudes to create congruent right triangles using equal legs and
    equal heights.
  solutionOutline: Claiming all trapezoids have equal base angles.
  commonTrap: ''
- id: aops-v1-ch12-q069
  concept: quadrilateral-area
  difficulty: advanced
  source: original-authoring
  prompt: A kite has sides 5,5,8,8 with equal-side vertices opposite. Explain an area
    strategy.
  answer: Draw the diagonal joining equal-side vertices; it is a symmetry axis and
    creates two congruent triangles.
  solutionOutline: Using one-half product without knowing diagonals.
  commonTrap: ''
- id: aops-v1-ch12-q070
  concept: coordinate-quadrilateral
  difficulty: advanced
  source: original-authoring
  prompt: Show points (0,0),(2,1),(5,7),(3,6) form a parallelogram.
  answer: 'Compare vectors: first-to-second equals fourth-to-third and second-to-third
    equals first-to-fourth.'
  solutionOutline: Using only two equal distances.
  commonTrap: ''
- id: aops-v1-ch12-q071
  concept: orthodiagonal
  difficulty: advanced
  source: original-authoring
  prompt: Why does half diagonal product give area only for perpendicular diagonals?
  answer: The four triangle areas combine as one-half d1 d2 sine theta; sine theta
    must be 1.
  solutionOutline: Assuming any crossing diagonals work.
  commonTrap: ''
- id: aops-v1-ch12-q072
  concept: quadrilateral-proof-strategy
  difficulty: advanced
  source: original-authoring
  prompt: What must be checked before using a trapezoid midsegment formula?
  answer: That the segment joins midpoints of the legs and is parallel to bases.
  solutionOutline: Only that it looks centered.
  commonTrap: ''
- id: aops-v1-ch12-q073
  concept: mixed-quadrilateral-reasoning
  difficulty: advanced
  source: original-authoring
  prompt: A parallelogram has side lengths 10,14 and included angle 30. Find its diagonal
    lengths.
  answer: $\sqrt{296}$ and $\sqrt{576}=24$
  solutionOutline: Use cosine law on the two triangles formed by a diagonal.
  commonTrap: Assuming both diagonals equal.
- id: aops-v1-ch12-q074
  concept: area-decomposition
  difficulty: advanced
  source: original-authoring
  prompt: Prove a diagonal of a parallelogram divides its area equally.
  answer: It forms congruent triangles with equal opposite sides and shared diagonal,
    or equal base-height products.
  solutionOutline: Assuming equal-looking halves.
  commonTrap: ''
- id: aops-v1-ch12-q075
  concept: square-classification
  difficulty: advanced
  source: original-authoring
  prompt: A quadrilateral is a rhombus with a right angle. Prove it is a square.
  answer: A rhombus is a parallelogram; one right angle forces all right angles.
  solutionOutline: Treating a kite as a parallelogram.
  commonTrap: ''
- id: aops-v1-ch12-q076
  concept: parallelogram-test
  difficulty: advanced
  source: original-authoring
  prompt: If diagonals of a quadrilateral bisect each other, why are opposite sides
    parallel?
  answer: The diagonal-created triangles are congruent by SAS, yielding alternate
    interior angles.
  solutionOutline: Using equal diagonal lengths instead of equal halves.
  commonTrap: ''
- id: aops-v1-ch12-q077
  concept: trapezoid-area
  difficulty: advanced
  source: original-authoring
  prompt: A trapezoid bases differ by 8 and legs are 5, height 3. Find bases if perimeter
    is 30.
  answer: 7 and 15
  solutionOutline: Horizontal offsets are 4 each; legs confirm, then use perimeter.
  commonTrap: Treating both bases as 11.
- id: aops-v1-ch12-q078
  concept: diagram-assumption-check
  difficulty: advanced
  source: original-authoring
  prompt: Why does a slanted drawing not prove a quadrilateral is a trapezoid?
  answer: Parallelism requires markings, coordinates, or proof.
  solutionOutline: Measuring the screen angle.
  commonTrap: ''
- id: aops-v1-ch12-q079
  concept: classification
  difficulty: advanced
  source: original-authoring
  prompt: State one property that separates a rhombus from a general parallelogram.
  answer: All four sides equal, or perpendicular diagonals.
  solutionOutline: Equal opposite sides only.
  commonTrap: ''
- id: aops-v1-ch12-q080
  concept: quadrilateral-angle-sum
  difficulty: foundational
  source: original-authoring
  prompt: Find fourth angle if three angles are 90,90,120 degrees.
  answer: 60 degrees
  solutionOutline: Subtract 300 from 360.
  commonTrap: Using 180.
- id: aops-v1-ch12-q081
  concept: parallelogram-properties
