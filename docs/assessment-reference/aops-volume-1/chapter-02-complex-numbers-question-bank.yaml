items:
- id: aops-v1-ch02-q001
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: foundational
  questionType: freeResponse
  prompt: Evaluate $i^{37}$.
  answer: i
  solutionOutline: Use the period-four power cycle.
  commonTrap: Ignoring the power cycle.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q002
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: foundational
  questionType: freeResponse
  prompt: Write $(3+4i)+(5-9i)$ in standard form.
  answer: 8-5i
  solutionOutline: Add real and imaginary components.
  commonTrap: Combining unlike components.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q003
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: foundational
  questionType: freeResponse
  prompt: Compute $(6-2i)-(1+7i)$.
  answer: 5-9i
  solutionOutline: Distribute the subtraction.
  commonTrap: Losing a minus sign.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q004
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Find the real part of $-8+3i$.
  answer: '-8'
  solutionOutline: Read the real coefficient.
  commonTrap: Naming the imaginary part.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q005
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: foundational
  questionType: freeResponse
  prompt: Find $i^2+i^3+i^4$.
  answer: -i
  solutionOutline: List the three powers of i and add.
  commonTrap: Using i to the fourth as -1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q006
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: foundational
  questionType: freeResponse
  prompt: Simplify $\sqrt{-49}$.
  answer: 7i
  solutionOutline: Factor out sqrt(-1).
  commonTrap: Writing -7i.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q007
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: foundational
  questionType: freeResponse
  prompt: Compute $(2+i)(2-i)$.
  answer: '5'
  solutionOutline: Use conjugate factors.
  commonTrap: Forgetting cancellation.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q008
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: foundational
  questionType: freeResponse
  prompt: 'Which is larger: $|3+4i|$ or $|1+5i|$?'
  answer: '|1+5i|'
  solutionOutline: Compare squared moduli.
  commonTrap: Comparing coordinates instead of moduli.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q009
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $z+ (4-3i)=10+i$.
  answer: z=6+4i
  solutionOutline: Subtract the known addend.
  commonTrap: Changing both signs.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q010
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: foundational
  questionType: freeResponse
  prompt: Write $7i+(-2)$ in standard form.
  answer: -2+7i
  solutionOutline: Write real plus imaginary form.
  commonTrap: Putting i first.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q011
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: foundational
  questionType: freeResponse
  prompt: Compute $(1+i)^2$.
  answer: 2i
  solutionOutline: Expand and use i squared.
  commonTrap: Treating i squared as 1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q012
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: foundational
  questionType: freeResponse
  prompt: Compute $(3-2i)(4+i)$.
  answer: 14-5i
  solutionOutline: FOIL before collecting terms.
  commonTrap: Dropping an i squared term.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q013
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $(5+i)/(5-i)$.
  answer: (12+5i)/13
  solutionOutline: Rationalize with the conjugate.
  commonTrap: Not rationalizing the denominator.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q014
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find $i^{2026}$.
  answer: '-1'
  solutionOutline: Reduce the exponent modulo four.
  commonTrap: Using period two.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q015
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: multi-step
  questionType: freeResponse
  prompt: If $a+bi=7-2i$, find $a-b$.
  answer: '9'
  solutionOutline: Match standard-form coefficients.
  commonTrap: Adding a and b.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q016
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $(x+2i)(x-2i)=13$ for real x.
  answer: x=+-3
  solutionOutline: Use the difference of squares.
  commonTrap: Expanding x plus 2i incorrectly.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q017
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the conjugate of $-6+11i$.
  answer: -6-11i
  solutionOutline: Change only the imaginary sign.
  commonTrap: Negating the real part too.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q018
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: multi-step
  questionType: freeResponse
  prompt: Compute $(2-3i)^2$.
  answer: -5-12i
  solutionOutline: Expand the binomial completely.
  commonTrap: Using a squared plus b squared as the real part.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q019
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $i(4-7i)$.
  answer: 7+4i
  solutionOutline: Distribute i, then simplify.
  commonTrap: Leaving i squared unchanged.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q020
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find all real x for which $x^2+9=0$ has a real solution.
  answer: none
  solutionOutline: Use the fact that real squares are nonnegative.
  commonTrap: Accepting an imaginary real-number solution.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q021
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $z^2=-16$.
  answer: z=4i,-4i
  solutionOutline: Take both complex square roots.
  commonTrap: Giving only one root.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q022
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: multi-step
  questionType: freeResponse
  prompt: Compute $(1-i)^3$.
  answer: -2-2i
  solutionOutline: Square then multiply once.
  commonTrap: Stopping after the square.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q023
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: multi-step
  questionType: freeResponse
  prompt: Show whether $3+2i=3-2i$.
  answer: 'false'
  solutionOutline: Compare real and imaginary parts.
  commonTrap: Assuming conjugates are equal.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q024
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: multi-step
  questionType: freeResponse
  prompt: Divide $8+6i$ by $2-i$.
  answer: 2+4i
  solutionOutline: Multiply by the conjugate of 2-i.
  commonTrap: Multiplying by the denominator again.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q025
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find the imaginary part of $(3+i)(3-i)$.
  answer: '0'
  solutionOutline: Use the conjugate product.
  commonTrap: Calling a real product imaginary.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q026
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $\sqrt{-12}$.
  answer: 2i\sqrt3
  solutionOutline: Separate 12 into 4 times 3.
  commonTrap: Leaving sqrt(12) unsimplified.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q027
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: multi-step
  questionType: freeResponse
  prompt: Compute $(4+i)(4-i)(2+i)$.
  answer: 34+17i
  solutionOutline: Collapse the first conjugate pair.
  commonTrap: Multiplying all three first.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q028
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: multi-step
  questionType: freeResponse
  prompt: If $z=1+i$, find $z^4$.
  answer: '-4'
  solutionOutline: Square z twice.
  commonTrap: Using the modulus instead.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q029
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: "Solve $z+(\bar z)=10$ when $z=5+bi$."
  answer: any real b
  solutionOutline: Add z to its conjugate.
  commonTrap: Forcing b to zero.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q030
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Explain why $a+bi=0$ implies $a=b=0$.
  answer: uniqueness of standard form
  solutionOutline: Invoke uniqueness of a+bi form.
  commonTrap: Allowing cancellation of components.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q031
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Prove $i^{n+4}=i^n$.
  answer: because i^4=1
  solutionOutline: Factor out i to the fourth.
  commonTrap: Using i fourth equals -1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q032
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Give a counterexample to $\sqrt{ab}=\sqrt a\sqrt b$ over complex numbers
    using a=b=-1.
  answer: left 1, right -1
  solutionOutline: Compare principal square roots.
  commonTrap: Ignoring the principal-root convention.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q033
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Choose the quickest method for $i^{12345}$.
  answer: reduce exponent modulo four
  solutionOutline: Reduce the exponent rather than expanding.
  commonTrap: Repeated multiplication.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q034
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Explain why multiplying by a conjugate helps divide complex numbers.
  answer: denominator becomes a real sum of squares
  solutionOutline: Make the denominator a real norm.
  commonTrap: Changing only the numerator.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q035
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A student says $(a+bi)^2=a^2+b^2i$. Name the missing term.
  answer: 2abi and sign change from i^2
  solutionOutline: Expand to expose 2abi and i squared.
  commonTrap: Omitting the sign from i squared.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q036
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: power-cycle
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Find a complex number whose square is $8i$.
  answer: 2+2i or -2-2i
  solutionOutline: Compare components after squaring.
  commonTrap: Giving a number whose square is -8i.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q037
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: conjugate
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Show that $(a+bi)(a-bi)$ is real.
  answer: cross terms cancel; result a^2+b^2
  solutionOutline: Show the cross terms cancel.
  commonTrap: Keeping cross terms.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q038
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: equation
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: When can a complex quotient have denominator zero?
  answer: when both real and imaginary denominator parts are zero
  solutionOutline: Set both components of the denominator to zero.
  commonTrap: Allowing one nonzero component.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q039
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: proof
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Explain why a real-number equation can gain solutions after extending to
    complex numbers.
  answer: negative values may have complex square roots
  solutionOutline: Contrast real square roots with complex ones.
  commonTrap: Claiming all equations gain roots.
  intendedUse: quiz-test-bank
- id: aops-v1-ch02-q040
  skillIds:
  - apply-complex-numbers
  - verify-complex-numbers-solutions
  archetype: standard-form
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Design a verification for a proposed quotient z=w/v.
  answer: multiply proposed z by v and compare with w
  solutionOutline: Multiply the proposed quotient by the divisor.
  commonTrap: Checking against the wrong product.
  intendedUse: quiz-test-bank
