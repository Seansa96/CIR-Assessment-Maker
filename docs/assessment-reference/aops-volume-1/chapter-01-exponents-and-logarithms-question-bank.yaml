items:
- id: aops-v1-ch01-q001
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: foundational
  questionType: freeResponse
  prompt: Evaluate $2^0+5^{-1}$.
  answer: 6/5
  solutionOutline: Use the zero and negative exponent definitions.
  commonTrap: Reading a negative exponent as a negative value.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q002
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: foundational
  questionType: freeResponse
  prompt: Write $1/(3^4)$ as a power of 3.
  answer: 3^{-4}
  solutionOutline: A reciprocal reverses the exponent sign.
  commonTrap: Writing $-3^4$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q003
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: foundational
  questionType: freeResponse
  prompt: Simplify $(x^7)(x^{-3})$.
  answer: x^4
  solutionOutline: Combine exponents only for the same base.
  commonTrap: Subtracting because one exponent is negative.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q004
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: foundational
  questionType: freeResponse
  prompt: Simplify $a^{12}/a^5$ for $a\ne0$.
  answer: a^7
  solutionOutline: Cancel seven common factors.
  commonTrap: Dividing exponents.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q005
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: foundational
  questionType: freeResponse
  prompt: Evaluate $16^{3/4}$.
  answer: '8'
  solutionOutline: Take the fourth root, then cube.
  commonTrap: Using $16^{3}/4$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q006
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: foundational
  questionType: freeResponse
  prompt: Simplify $\sqrt{72}$.
  answer: 6\sqrt2
  solutionOutline: Extract the largest square factor.
  commonTrap: Replacing it with $\sqrt{36}+\sqrt2$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q007
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: foundational
  questionType: freeResponse
  prompt: State $\sqrt{x^2}$ for real $x$.
  answer: '|x|'
  solutionOutline: The principal square root is nonnegative.
  commonTrap: Answering $x$ for negative x.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q008
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: foundational
  questionType: freeResponse
  prompt: Rationalize $5/\sqrt3$.
  answer: 5\sqrt3/3
  solutionOutline: Multiply top and bottom by $\sqrt3$.
  commonTrap: Multiplying only the denominator.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q009
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: foundational
  questionType: freeResponse
  prompt: Find $\log_2 32$.
  answer: '5'
  solutionOutline: Ask which exponent on 2 gives 32.
  commonTrap: Dividing 32 by 2 once.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q010
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: foundational
  questionType: freeResponse
  prompt: Find $\log_{10}(0.01)$.
  answer: '-2'
  solutionOutline: $10^{-2}=0.01$.
  commonTrap: Ignoring negative logarithms.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q011
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: foundational
  questionType: freeResponse
  prompt: For which real x is $\log_4(x-7)$ defined?
  answer: x>7
  solutionOutline: A real logarithm needs a positive argument.
  commonTrap: Allowing $x=7$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q012
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: foundational
  questionType: freeResponse
  prompt: Solve $3^{x+1}=81$.
  answer: x=3
  solutionOutline: Rewrite 81 as $3^4$.
  commonTrap: Taking $x=4$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q013
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $(2x^3y^{-2})^2$ using positive exponents.
  answer: 4x^6/y^4
  solutionOutline: Apply the power to each factor.
  commonTrap: Leaving $y^{-4}$ when positive form is requested.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q014
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $(a^2b^3)^4/(a^3b)$.
  answer: a^5b^{11}
  solutionOutline: Multiply exponents inside, then subtract across division.
  commonTrap: Adding exponents in the quotient.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q015
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: multi-step
  questionType: freeResponse
  prompt: Evaluate $27^{-2/3}$.
  answer: 1/9
  solutionOutline: 'Cube root first: $27^{1/3}=3$.'
  commonTrap: Making the answer $-9$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q016
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $\sqrt[3]{54}$.
  answer: 3\sqrt[3]2
  solutionOutline: Extract $27$ as a cube factor.
  commonTrap: Using a square-factor rule.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q017
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: multi-step
  questionType: freeResponse
  prompt: Rationalize $1/(2-\sqrt3)$.
  answer: 2+\sqrt3
  solutionOutline: Use the conjugate; denominator becomes 1.
  commonTrap: Multiplying by $2-\sqrt3$ again.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q018
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $5^{2x}=125$.
  answer: x=3/2
  solutionOutline: Rewrite 125 as $5^3$.
  commonTrap: Answering 3.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q019
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $\log_3 x=4$.
  answer: x=81
  solutionOutline: Convert the logarithm to exponential form.
  commonTrap: Using $x=12$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q020
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $\log_2(x+1)=3$.
  answer: x=7
  solutionOutline: Exponentiate then check the argument.
  commonTrap: Keeping $x=8$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q021
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $\log_5(x-1)+\log_5(x+1)=1$.
  answer: x=\sqrt6
  solutionOutline: Combine logs, solve, and retain $x>1$.
  commonTrap: Keeping the negative square root.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q022
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: multi-step
  questionType: freeResponse
  prompt: Solve $\sqrt{x+5}=x-1$.
  answer: x=4
  solutionOutline: Require $x\ge1$, square, then verify.
  commonTrap: Keeping the extraneous root -1.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q023
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: multi-step
  questionType: freeResponse
  prompt: Compare $8^{11}$ and $4^{17}$.
  answer: 8^{11}>4^{17}
  solutionOutline: 'Rewrite as powers of 2: $2^{33}$ and $2^{34}$? Correct comparison
    is $4^{17}>8^{11}$.'
  commonTrap: Comparing bases without common exponents.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q024
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: multi-step
  questionType: freeResponse
  prompt: 'Correct the previous comparison: which is larger, $8^{11}$ or $4^{17}$?'
  answer: 4^{17}
  solutionOutline: Use $8^{11}=2^{33}$ and $4^{17}=2^{34}$.
  commonTrap: Repeating an unchecked conclusion.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q025
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: multi-step
  questionType: freeResponse
  prompt: Simplify $(9x^4)^{1/2}$ when $x\ge0$.
  answer: 3x^2
  solutionOutline: Use the stated sign condition.
  commonTrap: Writing $3x$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q026
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: multi-step
  questionType: freeResponse
  prompt: If $2^a=7$ and $2^b=5$, express $2^{a-b}$.
  answer: 7/5
  solutionOutline: Use the quotient law before substituting.
  commonTrap: Using $7-5$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q027
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: multi-step
  questionType: freeResponse
  prompt: Find all real x satisfying $x^{2/3}=4$.
  answer: x=8,-8
  solutionOutline: Cube first or set $\sqrt[3]x=\pm2$.
  commonTrap: Giving only 8.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q028
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: multi-step
  questionType: freeResponse
  prompt: "Simplify $\frac{\\sqrt{x^5}}{\\sqrt{x}}$ for $x>0$."
  answer: x^2
  solutionOutline: Combine radicals under the positive-domain condition.
  commonTrap: Answering $x^4$.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q029
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Solve $4^x=7$ exactly.
  answer: x=\log_4 7
  solutionOutline: A logarithm names the needed exponent.
  commonTrap: Claiming no solution because 7 is not a power of 4.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q030
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Explain why $\log_2(-8)$ has no real value.
  answer: No real exponent on positive 2 gives a negative result.
  solutionOutline: Use the range of a positive-base exponential function.
  commonTrap: Treating logs as roots.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q031
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Prove $a^m a^n=a^{m+n}$ for positive integers.
  answer: Both sides are m+n copies of a.
  solutionOutline: Count repeated factors.
  commonTrap: Citing the rule as its own proof.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q032
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Prove $a^{-n}=1/a^n$ for $a\ne0$.
  answer: From $a^n a^{-n}=a^0=1$.
  solutionOutline: Use the inverse needed for product 1.
  commonTrap: Assuming the result for a=0.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q033
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: A student says $\sqrt{a+b}=\sqrt a+\sqrt b$. Give a counterexample.
  answer: 'a=b=1: $\sqrt2\ne2$.'
  solutionOutline: Test a small positive pair.
  commonTrap: Using a=0, which does not disprove it.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q034
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Why must $\log_b x$ require $b\ne1$?
  answer: Base 1 never produces values other than 1.
  solutionOutline: An inverse needs a one-to-one exponential function.
  commonTrap: Saying only that it is a convention.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q035
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Choose a method for $9^{x}=27^{x-1}$.
  answer: Rewrite both bases as powers of 3.
  solutionOutline: Common-base rewriting makes exponents comparable.
  commonTrap: Taking decimal approximations first.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q036
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: direct-application
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Choose a method for $\sqrt{50}-\sqrt8$.
  answer: Extract square factors then combine like radicals.
  solutionOutline: Both radicals reduce to multiples of $\sqrt2$.
  commonTrap: Subtracting inside one radical.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q037
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: condition-check
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: A formula contains $\log(x-2)$ after squaring an equation. What check is
    mandatory?
  answer: Verify $x>2$ and test the original equation.
  solutionOutline: Domain and extraneous-root checks are separate.
  commonTrap: Checking only the squared equation.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q038
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: changed-condition
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Design a one-line verification for $\log_3 81=4$.
  answer: Show $3^4=81$.
  solutionOutline: Use the inverse definition.
  commonTrap: Recomputing an unrelated decimal.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q039
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: synthesis
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: Explain why rationalizing $1/(\sqrt5+\sqrt2)$ uses a conjugate.
  answer: The conjugate product removes the cross radicals and is rational.
  solutionOutline: Use $(u+v)(u-v)=u^2-v^2$.
  commonTrap: Multiplying by an arbitrary radical.
  intendedUse: quiz-test-bank
- id: aops-v1-ch01-q040
  skillIds:
  - apply-exponents-and-logarithms
  - check-exponents-and-logarithms-restrictions
  archetype: recognition
  difficulty: proof-strategy
  questionType: freeResponse
  prompt: A solution divides by $x-3$. What case must be checked separately?
  answer: x=3
  solutionOutline: The divisor could be zero and discard a case.
  commonTrap: Only check x=0.
  intendedUse: quiz-test-bank
