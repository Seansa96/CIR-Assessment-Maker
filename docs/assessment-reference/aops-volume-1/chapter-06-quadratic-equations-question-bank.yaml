  archetype: factor
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Explain why a real-coefficient quadratic with nonreal root a+bi also has
    a-bi.
  answer: The formula has real part $-b/(2a)$ and opposite imaginary signs.
  solutionOutline: Use the conjugate form from a negative discriminant.
  commonTrap: Calling it true for arbitrary complex coefficients.
  intendedUse: quiz-test-bank
