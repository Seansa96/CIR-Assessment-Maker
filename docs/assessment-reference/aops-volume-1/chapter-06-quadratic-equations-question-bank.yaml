  archetype: formula
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Prove a monic quadratic with roots r,s equals $x^2-(r+s)x+rs$.
  answer: Expand $(x-r)(x-s)$.
  solutionOutline: Use expansion as the proof.
  commonTrap: Writing a signless middle term.
  intendedUse: quiz-test-bank
