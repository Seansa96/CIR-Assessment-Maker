  difficulty: proof-strategy
  questionType: freeResponse
  prompt: 'Why must $a

    e0$ in a quadratic $ax^2+bx+c$?'
  answer: Otherwise the x-squared term vanishes and degree is at most one.
  solutionOutline: Use the definition of degree.
  commonTrap: Saying division by a is inconvenient.
  intendedUse: quiz-test-bank
