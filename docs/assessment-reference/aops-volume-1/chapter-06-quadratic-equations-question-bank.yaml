  archetype: formula
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: If r+s=10 and rs=21, find $r^2+s^2$.
  answer: '58'
  solutionOutline: Compute $(r+s)^2-2rs$.
  commonTrap: Using 100-21.
  intendedUse: quiz-test-bank
