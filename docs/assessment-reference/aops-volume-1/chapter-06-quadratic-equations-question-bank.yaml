  - verify-quadratic-solutions
  archetype: discriminant
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Why can squaring create extraneous roots?
  answer: It makes $A=B$ and $A=-B$ indistinguishable.
  solutionOutline: Compare the reversible and nonreversible directions.
  commonTrap: Claiming squaring always preserves equivalence.
  intendedUse: quiz-test-bank
