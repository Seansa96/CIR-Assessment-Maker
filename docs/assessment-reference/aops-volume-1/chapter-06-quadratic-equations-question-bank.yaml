  - verify-quadratic-solutions
  archetype: proof
  difficulty: contest-transfer
  questionType: freeResponse
  prompt: Choose a method for $x^2+11x+7=0$ and justify it.
  answer: Quadratic formula; integer factoring is unavailable.
  solutionOutline: Compare factor pairs of 7 with required sum.
  commonTrap: Factoring by guessing decimals.
  intendedUse: quiz-test-bank
