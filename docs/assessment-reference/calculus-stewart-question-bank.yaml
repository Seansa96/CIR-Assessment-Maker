      assessmentFits: [workedExample, quiz]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Eliminate the parameter from trig parametric equations and preserve the correct trace interval.
      answerShape: Cartesian equation plus domain or orientation information
      solutionOutline: Normalize by amplitudes, use a trig identity, then translate parameter bounds into geometric restrictions.
      commonErrors:
      - Giving the full conic instead of the traced portion.
      - Forgetting orientation.
      tags: [parametric-curves, parameter-elimination, trig-identities]
    - id: calc2-parampolar-002
      topicId: parametric-derivatives
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz]
      questionTypes: [symbolicResponse]
      promptSeed: Find the slope and tangent line to a parametric curve at a given parameter value.
      answerShape: slope and tangent line
      solutionOutline: Compute dx/dt and dy/dt, form dy/dx, evaluate at the parameter, find the point, and write the line.
      commonErrors:
      - Evaluating slope without finding the actual point.
      - Dividing by zero without checking vertical tangent behavior.
      tags: [parametric-derivatives, tangent-lines]
    - id: calc2-parampolar-003
      topicId: polar-curves
      difficulty: medium
      learningGoals: [practice]
      assessmentFits: [quiz, workedExample]
      questionTypes: [multipleChoice, freeResponse]
      promptSeed: Match a polar graph to its equation by identifying family, symmetry, maximum radius, and loop or petal count.
      answerShape: selected equation with graph-feature justification
      solutionOutline: Identify whether the graph is cardioid, limacon, rose, circle, or lemniscate, then use symmetry and radius landmarks to choose the equation.
      commonErrors:
      - Confusing sine and cosine orientation.
      - Counting rose petals incorrectly for even and odd multipliers.
      tags: [polar-graphs, graph-recognition, limacons, roses]
    - id: calc2-parampolar-004
      topicId: polar-calculus
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Find horizontal and vertical tangent points on a polar curve over a given interval.
      answerShape: theta values and rectangular points
      solutionOutline: Compute r prime, set dy/dtheta to zero for horizontal tangents and dx/dtheta to zero for vertical tangents, check nonzero companion derivative, then convert points.
      commonErrors:
      - Choosing arbitrary theta values instead of solving tangent equations.
      - Treating dr/dtheta as dy/dx.
      tags: [polar-calculus, tangent-lines, horizontal-vertical-tangents]
    - id: calc2-parampolar-005
      topicId: polar-calculus
      difficulty: hard
      learningGoals: [apply, evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Find the area inside one polar curve and outside another, requiring correct angle bounds.
      answerShape: exact area
      solutionOutline: Solve intersections, determine which radius is outer on the interval, and integrate one half of outer squared minus inner squared.
      commonErrors:
      - Integrating over a full period when the target region appears multiple times.
      - Subtracting radii before squaring instead of subtracting squared radii.
      tags: [polar-area, intersections, area-between-polar-curves]
