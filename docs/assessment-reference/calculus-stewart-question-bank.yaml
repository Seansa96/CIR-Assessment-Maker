      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Find the sum of a convergent geometric series after rewriting the index to identify first term and ratio.
      answerShape: exact sum
      solutionOutline: Identify first term and common ratio, verify absolute ratio less than one, and apply the geometric sum formula.
      commonErrors:
      - Using the wrong first term because of index shift.
      - Applying the finite geometric formula to an infinite series.
      tags: [geometric-series, index-shift, series-sum]
