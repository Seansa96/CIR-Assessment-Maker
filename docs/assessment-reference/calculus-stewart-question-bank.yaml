      promptSeed: Find the radius and interval of convergence for a power series, including endpoint tests.
      answerShape: radius and interval
      solutionOutline: Use ratio or root test for radius, then test each endpoint with ordinary series tests.
      commonErrors:
      - Reporting only the radius.
      - Assuming endpoints behave like interior points.
