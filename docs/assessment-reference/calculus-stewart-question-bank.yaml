      answerShape: selected test and convergence conclusion
      solutionOutline: Match structural clues to likely tests, execute the chosen test, and state whether convergence is absolute, conditional, or divergent.
      commonErrors:
      - Using the nth-term test as a convergence proof.
      - Applying alternating series test to a nondecreasing sequence.
      tags: [convergence-tests, test-selection, series]
