courses:
- id: calculus-1
  title: Calculus 1
  units:
  - id: calc1-functions-models
    title: Functions and Models
    mappedSubcategories:
    - calc1-sets-functions
    - calc1-inequalities-real-numbers
    referenceFocus:
    - domain and range
    - transformations
    - inverse functions
    - average rate of change
    items:
    - id: calc1-func-001
      topicId: calc1-sets-functions
      difficulty: easy
      learningGoals: [recall, practice]
      assessmentFits: [recallDrill, quiz]
      questionTypes: [multipleChoice, cloze, typed]
      promptSeed: Identify the domain restriction caused by combining a radical with a rational denominator.
      answerShape: domain interval or excluded values
      solutionOutline: Locate denominator zeros, radical restrictions, and intersection of all valid input sets.
      commonErrors:
      - Checking only one restriction source.
      - Including a denominator zero as an endpoint.
      tags: [domain, function-analysis, restrictions]
    - id: calc1-func-002
      topicId: calc1-sets-functions
      difficulty: medium
      learningGoals: [learn, apply]
      assessmentFits: [conceptLesson, workedExample, quiz]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Build a function model from a rectangular geometry situation and interpret the units of its output.
      answerShape: algebraic function plus domain and interpretation
      solutionOutline: Define the variable, express the dependent dimension, form the target quantity, and restrict the domain from geometry.
      commonErrors:
      - Giving an algebraic expression without a physically meaningful domain.
      - Confusing perimeter, area, and side length units.
      tags: [modeling, functions, units]
  - id: calc1-limits-continuity
    title: Limits and Continuity
    mappedSubcategories:
    - calc1-limits-functions
    - calc1-continuity-discontinuities
    referenceFocus:
    - one-sided limits
    - algebraic simplification
    - squeeze theorem
    - continuity conditions
    items:
    - id: calc1-limit-001
      topicId: calc1-limits-functions
      difficulty: easy
      learningGoals: [practice]
      assessmentFits: [quiz, workedExample]
      questionTypes: [multipleChoice, symbolicResponse]
      promptSeed: Evaluate a removable-discontinuity limit by factoring and cancelling a common factor.
      answerShape: exact number
      solutionOutline: Factor numerator and denominator, cancel only before substitution, then substitute the approach value.
      commonErrors:
      - Cancelling terms across addition.
      - Reporting undefined instead of the limiting value.
      tags: [limits, factoring, removable-discontinuity]
    - id: calc1-limit-002
      topicId: calc1-limits-functions
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz, test]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Evaluate a limit requiring rationalization of a square-root expression.
      answerShape: exact number or simplified radical expression
      solutionOutline: Multiply by the conjugate, simplify the difference of squares, cancel the vanishing factor, and substitute.
      commonErrors:
      - Forgetting to multiply numerator and denominator by the conjugate.
      - Losing a negative sign after expanding.
      tags: [limits, rationalization, conjugate]
    - id: calc1-limit-003
      topicId: calc1-continuity-discontinuities
      difficulty: medium
      learningGoals: [evaluate]
      assessmentFits: [quiz, test]
      questionTypes: [freeResponse, multipleChoice]
      promptSeed: Choose a parameter value that makes a piecewise function continuous at the joining point.
      answerShape: parameter value with continuity justification
      solutionOutline: Set the left-hand limit, right-hand limit, and function value equal at the join.
      commonErrors:
      - Matching only the two formulas and ignoring the defined value.
      - Using the wrong branch at the endpoint.
      tags: [continuity, piecewise-functions, parameter-solving]
    - id: calc1-limit-004
      topicId: calc1-limits-functions
      difficulty: hard
      learningGoals: [apply, evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Use the squeeze theorem to prove a trig-times-bounded-function limit.
      answerShape: limiting value plus bounding argument
      solutionOutline: Bound the oscillating or trig expression between two functions that approach the same value.
      commonErrors:
      - Claiming the oscillating factor has its own limit.
      - Forgetting to multiply the bounds by a nonnegative shrinking factor.
      tags: [limits, squeeze-theorem, trig-limits]
  - id: calc1-derivatives
    title: Derivatives
    mappedSubcategories:
    - calc1-derivative-definition
    - calc1-differentiation-theorems
    referenceFocus:
    - derivative definition
    - differentiation rules
    - chain rule
    - implicit differentiation
    - inverse and logarithmic differentiation
    items:
    - id: calc1-deriv-001
      topicId: calc1-derivative-definition
      difficulty: easy
      learningGoals: [learn, practice]
      assessmentFits: [conceptLesson, workedExample, quiz]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Use the limit definition to find the derivative of a quadratic at a general input.
      answerShape: derivative formula
      solutionOutline: Substitute into the difference quotient, expand, cancel the zero-producing term, then take the limit.
      commonErrors:
      - Substituting h=0 before cancellation.
      - Expanding (x+h)^2 incorrectly.
      tags: [derivative-definition, difference-quotient]
    - id: calc1-deriv-002
      topicId: calc1-differentiation-theorems
      difficulty: easy
      learningGoals: [recall, practice]
      assessmentFits: [recallDrill, quiz]
      questionTypes: [cloze, multipleChoice, symbolicResponse]
      promptSeed: Select the correct derivative rule for a product nested inside a chain-rule expression.
      answerShape: rule choice and derivative expression
      solutionOutline: Identify the outer function, inner product, and product-rule terms before simplifying.
      commonErrors:
      - Multiplying derivatives of both factors.
      - Dropping the outer derivative.
      tags: [chain-rule, product-rule, derivative-rules]
    - id: calc1-deriv-003
      topicId: calc1-differentiation-theorems
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz, test]
      questionTypes: [symbolicResponse]
      promptSeed: Differentiate an expression using logarithmic differentiation because the variable appears in both base and exponent.
      answerShape: derivative formula
      solutionOutline: Take natural logs, use log rules, differentiate implicitly, and multiply back by the original function.
      commonErrors:
      - Applying the ordinary power rule to a variable exponent.
      - Forgetting to multiply by the original function after solving for y prime.
      tags: [logarithmic-differentiation, exponential-functions]
    - id: calc1-deriv-004
      topicId: calc1-differentiation-theorems
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Use implicit differentiation to find the slope of a tangent line on a curve defined by mixed x and y terms.
      answerShape: tangent slope or tangent line equation
      solutionOutline: Differentiate both sides, attach y prime to every y derivative, solve for y prime, then evaluate at the point.
      commonErrors:
      - Treating y as a constant.
      - Solving for y prime before collecting all y prime terms.
      tags: [implicit-differentiation, tangent-lines]
  - id: calc1-derivative-applications
    title: Applications of Derivatives
    mappedSubcategories:
    - calc1-graph-analysis
    - calc1-differentiation-theorems
    referenceFocus:
    - related rates
    - optimization
    - graph analysis
    - linear approximation
    - L'Hopital's rule
    items:
    - id: calc1-app-001
      topicId: calc1-graph-analysis
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Use first and second derivatives to classify intervals of increase, decrease, concavity, and local extrema.
      answerShape: interval table and feature list
      solutionOutline: Find critical numbers, sign-test f prime, find possible inflection points, sign-test f double prime, then summarize.
      commonErrors:
      - Confusing concavity with increasing behavior.
      - Forgetting undefined derivative points as critical numbers.
      tags: [graph-analysis, critical-points, concavity]
    - id: calc1-app-002
      topicId: calc1-differentiation-theorems
      difficulty: medium
      learningGoals: [apply, evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Solve a related-rates problem involving a changing geometric measurement.
      answerShape: instantaneous rate with units
      solutionOutline: Write the geometric relation first, differentiate with respect to time, substitute known values at the instant, and solve.
      commonErrors:
      - Substituting changing values before differentiating in a way that removes variables.
      - Omitting units or sign interpretation.
      tags: [related-rates, implicit-differentiation, units]
    - id: calc1-app-003
      topicId: calc1-graph-analysis
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [freeResponse, numericResponse]
      promptSeed: Optimize a quantity under a constraint, including endpoint checks when the domain is closed.
      answerShape: optimal input and maximum or minimum value
      solutionOutline: Define objective, reduce to one variable, determine domain, find critical points, evaluate candidates, and interpret.
      commonErrors:
      - Optimizing the constraint instead of the objective.
      - Ignoring endpoints.
      tags: [optimization, modeling, extrema]
    - id: calc1-app-004
      topicId: calc1-differentiation-theorems
      difficulty: medium
      learningGoals: [practice]
      assessmentFits: [quiz, test]
      questionTypes: [multipleChoice, freeResponse]
      promptSeed: Determine whether L'Hopital's rule is allowed and transform an indeterminate expression when it is not immediately a quotient.
      answerShape: valid transformation and evaluated limit
      solutionOutline: Classify the indeterminate form, rewrite as a quotient if needed, verify the rule's conditions, then differentiate numerator and denominator.
      commonErrors:
      - Applying L'Hopital's rule to a non-indeterminate quotient.
      - Differentiating the whole expression as if it were an ordinary derivative problem.
      tags: [lhopital, indeterminate-forms, limits]
  - id: calc1-integrals-ftc
    title: Integrals and the Fundamental Theorem
    mappedSubcategories:
    - calc1-riemann-integration
    referenceFocus:
    - Riemann sums
    - signed area
    - antiderivatives
    - Fundamental Theorem of Calculus
    - substitution
    items:
    - id: calc1-int-001
      topicId: calc1-riemann-integration
      difficulty: easy
      learningGoals: [learn, practice]
      assessmentFits: [conceptLesson, workedExample, quiz]
      questionTypes: [multipleChoice, freeResponse]
      promptSeed: Interpret a definite integral from a graph as signed accumulation rather than total area.
      answerShape: net signed area with explanation
      solutionOutline: Split the graph into regions above and below the axis, compute geometric areas, and subtract below-axis regions.
      commonErrors:
      - Adding all areas as positive when net accumulation is requested.
      - Missing the sign of below-axis regions.
      tags: [definite-integral, signed-area, graph-interpretation]
    - id: calc1-int-002
      topicId: calc1-riemann-integration
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz, test]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Evaluate a derivative of an accumulation function with a nontrivial upper limit.
      answerShape: derivative expression
      solutionOutline: Apply FTC Part 1 to the outer accumulation, then multiply by the derivative of the upper limit.
      commonErrors:
      - Substituting the upper limit without applying the chain rule.
      - Treating the dummy variable as the final variable.
      tags: [fundamental-theorem, accumulation-functions, chain-rule]
    - id: calc1-int-003
      topicId: calc1-riemann-integration
      difficulty: medium
      learningGoals: [practice]
      assessmentFits: [workedExample, quiz]
      questionTypes: [symbolicResponse]
      promptSeed: Evaluate a substitution integral where the inner derivative appears up to a constant factor.
      answerShape: antiderivative or definite integral value
      solutionOutline: Choose u as the composed expression, rewrite dx terms, integrate in u, then substitute back or change bounds.
      commonErrors:
      - Choosing u but leaving x terms behind.
      - Forgetting to change bounds in a definite integral.
      tags: [u-substitution, antiderivatives, integration]
    - id: calc1-int-004
      topicId: calc1-riemann-integration
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [test]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Compare average value, net change, and total distance for a velocity graph.
      answerShape: separate quantities with units and interpretation
      solutionOutline: Integrate velocity for displacement, integrate absolute velocity for total distance, and divide by interval length for average value.
      commonErrors:
      - Treating displacement and distance as identical.
      - Averaging endpoint velocities instead of using the integral average.
      tags: [average-value, motion, definite-integral]
- id: calculus-2
  title: Calculus 2
  units:
  - id: calc2-techniques-integration
    title: Techniques of Integration
    mappedSubcategories:
    - integration-techniques
    - rational-integration
    - u-sub-integration
    referenceFocus:
    - integration by parts
    - trigonometric integrals
    - trigonometric substitution
    - partial fractions
    - strategy selection
    items:
    - id: calc2-tech-001
      topicId: integration-techniques
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Choose integration by parts for a product of an algebraic factor and a transcendental factor.
      answerShape: antiderivative
      solutionOutline: Select u to simplify after differentiation, select dv to integrate cleanly, apply integration by parts, and simplify.
      commonErrors:
      - Choosing u so that the remaining integral becomes more complex.
      - Losing the minus sign in uv minus integral v du.
      tags: [integration-by-parts, technique-selection]
    - id: calc2-tech-002
      topicId: integration-techniques
      difficulty: medium
      learningGoals: [learn, practice]
      assessmentFits: [conceptLesson, workedExample, quiz]
      questionTypes: [multipleChoice, symbolicResponse]
      promptSeed: Integrate an odd power of sine times a power of cosine by saving one sine factor and converting the rest.
      answerShape: antiderivative
      solutionOutline: Save the odd factor, convert remaining sine powers with the Pythagorean identity, and substitute u=cos x.
      commonErrors:
      - Converting the wrong function and leaving an unmatched differential.
      - Treating all trig-power integrals as power-reduction problems.
      tags: [trig-integrals, pythagorean-identities, u-substitution]
    - id: calc2-tech-003
      topicId: integration-techniques
      difficulty: hard
      learningGoals: [apply, evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Use trigonometric substitution for a radical matching a squared constant minus a squared variable expression.
      answerShape: antiderivative with back-substitution
      solutionOutline: Match the radical pattern, choose the trig substitution, rewrite dx and the radical, integrate, and use a reference triangle to return to x.
      commonErrors:
      - Using the wrong trig substitution family.
      - Leaving the final answer in theta when x is required.
      tags: [trig-substitution, reference-triangle, radicals]
    - id: calc2-tech-004
      topicId: rational-integration
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [workedExample, quiz, test]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Integrate an improper rational function requiring polynomial division and partial fractions with an irreducible quadratic factor.
      answerShape: antiderivative
      solutionOutline: Divide first, factor the denominator, assign linear numerator over irreducible quadratics, solve coefficients, and integrate log/arctangent pieces.
      commonErrors:
      - Skipping polynomial division.
      - Using a constant numerator over an irreducible quadratic factor.
      tags: [partial-fractions, irreducible-quadratics, polynomial-division]
    - id: calc2-tech-005
      topicId: integration-techniques
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [test]
      questionTypes: [multipleChoice, freeResponse, symbolicResponse]
      promptSeed: Select the most efficient method among substitution, parts, trig identities, trig substitution, and partial fractions for a mixed integral.
      answerShape: method selection plus evaluation or setup
      solutionOutline: Classify the integrand by structure, eliminate unsuitable techniques, choose the lowest-complexity path, and justify the choice.
      commonErrors:
      - Starting algebra before identifying structure.
      - Choosing a familiar method instead of the fitting method.
      tags: [integration-strategy, technique-selection, mixed-review]
    - id: calc2-tech-006
      topicId: integration-techniques
      difficulty: medium
      learningGoals: [practice, apply]
      assessmentFits: [workedExample, quiz]
      questionTypes: [numericResponse, freeResponse]
      promptSeed: Use midpoint, trapezoidal, and Simpson-style approximations on a short table of values and compare the estimates.
      answerShape: numerical estimates with method identification
      solutionOutline: Determine subinterval width, apply the requested weighted sum formula, and compare whether the estimate is likely above or below from concavity when possible.
      commonErrors:
      - Using the wrong number of subintervals for Simpson's rule.
      - Averaging function values without the interval-width factor.
      tags: [approximate-integration, midpoint-rule, trapezoidal-rule, simpsons-rule]
  - id: calc2-applications-integration
    title: Applications of Integration
    mappedSubcategories:
    - area-between-curves
    - volumes-of-solids
    - cylindrical-shells
    - arc-length-surface-area
    - work-physics
    - hydrostatic-pressure
    - moments-mass
    referenceFocus:
    - area
    - volume
    - arc length
    - surface area
    - work and force
    - centers of mass
    items:
    - id: calc2-appint-001
      topicId: area-between-curves
      difficulty: easy
      learningGoals: [practice]
      assessmentFits: [quiz, workedExample]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Set up and evaluate area between two curves after finding their intersection points.
      answerShape: exact area
      solutionOutline: Solve intersections, determine upper minus lower on the interval, integrate the difference, and interpret positivity.
      commonErrors:
      - Reversing upper and lower functions.
      - Using visual assumptions without checking intersections.
      tags: [area-between-curves, intersection-points, setup]
    - id: calc2-appint-002
      topicId: volumes-of-solids
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz]
      questionTypes: [multipleChoice, symbolicResponse]
      promptSeed: Decide whether washer or shell setup is simpler for a region rotated about a shifted axis.
      answerShape: volume setup or exact volume
      solutionOutline: Sketch the region, compare slice direction to axis of rotation, identify radius and height, and form the integral.
      commonErrors:
      - Measuring radius from the wrong axis.
      - Mixing shell height with washer thickness.
      tags: [volumes, shells, washers, axis-of-rotation]
    - id: calc2-appint-003
      topicId: arc-length-surface-area
      difficulty: medium
      learningGoals: [apply]
      assessmentFits: [workedExample, quiz]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Set up arc length and surface area for a smooth curve on a finite interval.
      answerShape: exact integral setup or evaluated expression
      solutionOutline: Differentiate the curve, build the arc-length factor, then include the rotation radius for surface area.
      commonErrors:
      - Forgetting the square root in arc length.
      - Using diameter rather than radius in surface area.
      tags: [arc-length, surface-area, geometric-applications]
    - id: calc2-appint-004
      topicId: hydrostatic-pressure
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Model hydrostatic force on a vertical plate with width depending on depth.
      answerShape: force integral and exact or approximate force
      solutionOutline: Choose depth variable, write pressure as weight density times depth, express width as a function of depth, and integrate pressure times area strip.
      commonErrors:
      - Measuring depth from the wrong water surface.
      - Treating width as constant when the plate shape varies.
      tags: [hydrostatic-force, integration-modeling, applied-integration]
    - id: calc2-appint-005
      topicId: moments-mass
      difficulty: hard
      learningGoals: [apply, evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Find the centroid of a planar region using moment integrals.
      answerShape: ordered pair centroid with setup
      solutionOutline: Compute area, set up moments about the axes, divide each moment by area, and check whether the centroid location is geometrically plausible.
      commonErrors:
      - Dividing by the wrong area.
      - Swapping moment formulas for x-bar and y-bar.
      tags: [moments, center-of-mass, centroid, applied-integration]
    - id: calc2-appint-006
      topicId: applied-integration
      difficulty: medium
      learningGoals: [learn, practice]
      assessmentFits: [conceptLesson, quiz]
      questionTypes: [multipleChoice, freeResponse]
      promptSeed: Interpret a probability density function using area under the curve and average value ideas.
      answerShape: probability or expected-value setup
      solutionOutline: Verify nonnegative density and total area, integrate over the requested interval for probability, or integrate x times density for expected value.
      commonErrors:
      - Treating the density value itself as a probability.
      - Forgetting that total density area must equal one.
      tags: [probability-density, applied-integration, expected-value]
  - id: calc2-improper-integrals
    title: Improper Integrals
    mappedSubcategories:
    - improper-integrals
    referenceFocus:
    - infinite intervals
    - vertical asymptotes
    - p-test
    - comparison
    - convergence vs value
    items:
    - id: calc2-imp-001
      topicId: improper-integrals
      difficulty: easy
      learningGoals: [recall, practice]
      assessmentFits: [recallDrill, quiz]
      questionTypes: [multipleChoice, cloze]
      promptSeed: Classify an improper integral as Type 1, Type 2, both, or neither.
      answerShape: classification with trigger
      solutionOutline: Inspect bounds for infinity and integrand for discontinuities inside or at endpoints.
      commonErrors:
      - Missing a denominator zero inside a finite interval.
      - Calling every hard integral improper.
      tags: [improper-integrals, type-classification]
    - id: calc2-imp-002
      topicId: improper-integrals
      difficulty: medium
      learningGoals: [practice]
      assessmentFits: [workedExample, quiz]
      questionTypes: [symbolicResponse, freeResponse]
      promptSeed: Evaluate an infinite-tail integral and decide convergence by taking the endpoint limit.
      answerShape: convergent value or divergent conclusion
      solutionOutline: Replace the infinite endpoint with a variable, integrate, then take the limit.
      commonErrors:
      - Plugging infinity directly into an antiderivative.
      - Reporting an antiderivative instead of convergence status.
      tags: [improper-integrals, infinite-tail, limits]
    - id: calc2-imp-003
      topicId: improper-integrals
      difficulty: hard
      learningGoals: [evaluate]
      assessmentFits: [workedExample, test]
      questionTypes: [freeResponse, symbolicResponse]
      promptSeed: Split an integral at an internal vertical asymptote and determine whether both pieces converge.
      answerShape: convergence decision with both one-sided limits
      solutionOutline: Identify the discontinuity, split the integral, evaluate each one-sided limit separately, and require both to converge.
      commonErrors:
      - Evaluating across an asymptote as if cancellation made it safe.
      - Accepting one convergent side as enough.
      tags: [improper-integrals, vertical-asymptote, split-interval]
