objectives:
  - id: calc2-improper-identify-and-limit
    statement: Identify an infinite interval or unbounded integrand and replace the definite integral by the required one-sided limit.
    prerequisites: [calc1-definite-integrals, calc1-limits]
  - id: calc2-improper-split-and-evaluate
    statement: Split two-tailed and interior-singularity integrals into independent limits and evaluate each valid component.
    prerequisites: [calc2-improper-identify-and-limit, calc2-integration-techniques]
  - id: calc2-improper-classify-by-comparison
    statement: Classify improper integrals using the p-test, direct comparison, limit comparison, and logarithmic boundary transformations.
    prerequisites: [calc2-improper-identify-and-limit, calc2-u-substitution]
  - id: calc2-improper-justify-and-extend
    statement: Build and justify convergence arguments for parameterized, signed, or transformed improper integrals.
    prerequisites: [calc2-improper-split-and-evaluate, calc2-improper-classify-by-comparison]
