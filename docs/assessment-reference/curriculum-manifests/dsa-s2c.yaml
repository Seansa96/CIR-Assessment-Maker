# Source-to-Curriculum Manifest for Data Structures and Algorithms
# Phase 1: Complexity and Recursion
schemaVersion: 1
sourceId: "src-20260810144616-0dc6e2835b" # An Open Guide to Data Structures and Algorithms
format: "pdf"

topics:
  - topicId: dsa-complexity
    title: "Complexity and Tradeoffs"
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
    objectives:
      - id: obj-dsa-complexity-01
        description: "Define algorithms and data structures and understand the difference between skills and synthesis."
      - id: obj-dsa-complexity-02
        description: "Analyze the cost function of simple processes (worst case, average case, amortized case)."
      - id: obj-dsa-complexity-03
        description: "Use asymptotic notation (Big-O, Big-Omega, Big-Theta) to describe the upper, lower, and tight bounds of algorithm growth."
      - id: obj-dsa-complexity-04
        description: "Identify polynomial growth rate differences and compare resource scaling."
        
  - topicId: dsa-recursion-backtracking
    title: "Recursion" # We will limit to foundational recursion first
    prerequisiteIds: ["dsa-complexity"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
    objectives:
      - id: obj-dsa-recursion-01
        description: "Identify the base cases and recursive cases of a recursive function."
      - id: obj-dsa-recursion-02
        description: "Trace the execution of a recursive procedure to predict its output."
      - id: obj-dsa-recursion-03
        description: "Implement simple recursive algorithms (e.g. sequence generation) using Python."
      - id: obj-dsa-recursion-04
        description: "Estimate the complexity and recognize efficiency tradeoffs when using recursion versus iteration."

  - topicId: dsa-sorting-searching
    title: "Sorting, Searching, and Selection"
    prerequisiteIds: ["dsa-arrays-strings"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
    objectives:
      - id: obj-dsa-sorting-01
        description: "Understand and trace linear and binary search algorithms."
      - id: obj-dsa-sorting-02
        description: "Analyze and implement O(n^2) sorting algorithms (Bubble, Selection, Insertion)."
      - id: obj-dsa-sorting-03
        description: "Understand the divide-and-conquer strategy in O(n log n) sorts (Merge Sort, Quick Sort)."
      - id: obj-dsa-sorting-04
        description: "Evaluate stability and in-place properties of sorting algorithms."

  - topicId: dsa-linked-structures
    title: "Linked Structures and Memory-Aware Containers"
    prerequisiteIds: ["dsa-arrays-strings"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
      - "focusedPractice"
    objectives:
      - id: obj-dsa-linked-01
        description: "Understand node-based, non-contiguous memory structures."
      - id: obj-dsa-linked-02
        description: "Implement traversal, insertion, and deletion for singly linked lists."
      - id: obj-dsa-linked-03
        description: "Trace pointer manipulation in doubly linked lists."
      - id: obj-dsa-linked-04
        description: "Compare performance tradeoffs between linked lists and dynamic arrays."

  - topicId: dsa-stacks-queues
    title: "Stacks, Queues, Deques, and Ring Buffers"
    prerequisiteIds: ["dsa-arrays-strings"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
      - "guidedWorkedExample"
    objectives:
      - id: obj-dsa-stacks-01
        description: "Understand the LIFO principle and implement a stack using an array or linked list."
      - id: obj-dsa-stacks-02
        description: "Understand the FIFO principle and implement a queue using an array or linked list."
      - id: obj-dsa-stacks-03
        description: "Trace standard operations (push/pop/enqueue/dequeue) and analyze their O(1) time complexity."
      - id: obj-dsa-stacks-04
        description: "Apply stacks and queues to solve problems like balancing parentheses."

  - topicId: dsa-hashmaps
    title: "Hash Tables, Sets, and Caches"
    prerequisiteIds: ["dsa-arrays-strings"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
    objectives:
      - id: obj-dsa-hash-01
        description: "Understand hash functions and the conversion of keys to array indices."
      - id: obj-dsa-hash-02
        description: "Analyze O(1) average case vs O(n) worst case lookups."
      - id: obj-dsa-hash-03
        description: "Identify and resolve collisions using chaining or open addressing."
      - id: obj-dsa-hash-04
        description: "Implement a basic hash set or map in Python."

  - topicId: dsa-trees
    title: "Trees and Ordered Indexes"
    prerequisiteIds: ["dsa-linked-structures"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
    objectives:
      - id: obj-dsa-trees-01
        description: "Understand hierarchical data and binary tree node structures."
      - id: obj-dsa-trees-02
        description: "Trace in-order, pre-order, and post-order traversals."
      - id: obj-dsa-trees-03
        description: "Analyze the properties of a Binary Search Tree (BST) and its O(log n) average search time."
      - id: obj-dsa-trees-04
        description: "Implement a recursive BST search or insertion."

  - topicId: dsa-heaps-priority-queues
    title: "Heaps and Priority Queues"
    prerequisiteIds: ["dsa-trees"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
    objectives:
      - id: obj-dsa-heaps-01
        description: "Understand the heap property (min-heap vs max-heap)."
      - id: obj-dsa-heaps-02
        description: "Trace insertion and extraction processes (bubble up / sink down)."
      - id: obj-dsa-heaps-03
        description: "Understand the array representation of a complete binary tree."
      - id: obj-dsa-heaps-04
        description: "Implement priority queue operations."

  - topicId: dsa-graphs
    title: "Graphs and Dependency Systems"
    prerequisiteIds: ["dsa-stacks-queues"]
    activities:
      - "conceptLesson"
      - "glossary"
      - "recallDrill"
      - "quiz"
    objectives:
      - id: obj-dsa-graphs-01
        description: "Understand vertices, edges, directed vs undirected, and weighted graphs."
      - id: obj-dsa-graphs-02
        description: "Compare adjacency matrices and adjacency lists."
      - id: obj-dsa-graphs-03
        description: "Trace Breadth-First Search (BFS) and Depth-First Search (DFS)."
      - id: obj-dsa-graphs-04
        description: "Apply graph traversal to solve dependency or reachability problems."
