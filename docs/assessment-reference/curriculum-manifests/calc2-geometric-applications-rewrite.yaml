topics:
  - id: geometric-intuition
    objectives:
      - id: calc2-geom-interpret-accumulation
        statement: Interpret a definite integral as signed accumulation and distinguish geometric quantities from algebraic integral values.
      - id: calc2-geom-build-slice
        statement: Construct a representative slice, identify its variable, thickness, and measurement units.
    sourceChunks: [src-20260719182540-a40fdcd443:chunk-1353, src-20260719182540-a40fdcd443:chunk-1354]
  - id: area-between-curves
    prerequisites: [geometric-intuition]
    objectives:
      - id: calc2-area-vertical-horizontal
        statement: Set up the area between curves using vertical or horizontal slices and correct bounds.
      - id: calc2-area-piecewise-order
        statement: Locate intersections and partition an area when the top/bottom or right/left relation changes.
    sourceChunks: [src-20260719182540-a40fdcd443:chunk-1354, src-20260719182540-a40fdcd443:chunk-1363, src-20260719182540-a40fdcd443:chunk-1366]
  - id: volumes-of-solids
    prerequisites: [area-between-curves, geometric-intuition]
    objectives:
      - id: calc2-volume-cross-sections
        statement: Model a volume from a cross-sectional-area function.
      - id: calc2-volume-disk-washer
        statement: Build and evaluate disk and washer integrals for solids of revolution.
    sourceChunks: [src-20260719182540-a40fdcd443:chunk-1368, src-20260719182540-a40fdcd443:chunk-1372, src-20260719182540-a40fdcd443:chunk-1380]
  - id: cylindrical-shells
    prerequisites: [area-between-curves]
    objectives:
      - id: calc2-shell-model
        statement: Model a cylindrical shell using radius, height, and thickness measured relative to the axis of rotation.
      - id: calc2-shell-method-choice
        statement: Choose shells or washers based on slice orientation, algebraic complexity, and bounds.
    sourceChunks: [src-20260719182540-a40fdcd443:chunk-1388, src-20260719182540-a40fdcd443:chunk-1390, src-20260719182540-a40fdcd443:chunk-1394]
  - id: volume-methods-review
    prerequisites: [volumes-of-solids, cylindrical-shells]
    objectives:
      - id: calc2-volume-method-synthesis
        statement: Compare disk, washer, shell, and cross-section models and justify a method choice.
    sourceChunks: [src-20260719182540-a40fdcd443:chunk-1372, src-20260719182540-a40fdcd443:chunk-1392]
  - id: arc-length-surface-area
    prerequisites: [geometric-intuition]
    objectives:
      - id: calc2-arc-length-model
        statement: Derive and use an arc-length integrand from a differential line segment.
      - id: calc2-surface-area-model
        statement: Build a surface-of-revolution integral using circumference times differential arc length.
    sourceChunks: [src-20260719182540-a40fdcd443:chunk-1600, src-20260719182540-a40fdcd443:chunk-1602, src-20260719182540-a40fdcd443:chunk-1604, src-20260719182540-a40fdcd443:chunk-1605]
