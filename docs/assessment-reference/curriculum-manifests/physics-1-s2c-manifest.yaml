objectives:
  - id: phys1-obj-newtons-laws
    title: Apply Newton's Laws
    description: Apply Newton's three laws of motion to solve for forces, mass, and acceleration in 1D and 2D.
  - id: phys1-obj-applications-newtons-laws
    title: Applications of Newton's Laws
    description: Solve problems involving friction, tension, drag forces, and centripetal force.
  - id: phys1-obj-fixed-axis-rotation
    title: Fixed-Axis Rotation
    description: Relate angular and translational variables and apply torque and moment of inertia to solve rotational dynamics problems.
  - id: phys1-obj-static-equilibrium
    title: Static Equilibrium and Elasticity
    description: Apply conditions of translational and rotational equilibrium to rigid bodies, and calculate stress and strain.
  - id: phys1-obj-oscillations
    title: Oscillations
    description: Analyze simple harmonic motion, including the mass-spring system, pendulums, and energy in SHM.
  - id: phys1-obj-waves
    title: Waves
    description: Analyze traveling waves, wave speed on a stretched string, interference, and standing waves.
  - id: phys1-obj-sound
    title: Sound
    description: Understand sound waves, speed of sound, sound intensity, beats, and the Doppler effect.
