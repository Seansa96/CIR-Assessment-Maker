    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0995, src-20260720035703-91ea51b0d8:chunk-0997]
    reviewState: approved
    givens: 'A Lewis environment, formula, or explicit bond/lone-pair inventory.'
    unknown: 'The local electron-domain count or corresponding starting arrangement.'
    representationRequirement: required
    governingPrinciple: 'Each bond direction and each central lone pair counts as one electron domain.'
    methodSteps: [select center, count bond directions, count central lone pairs, total domains, verify local inventory]
    likelyMisconception: 'Counting bond order or terminal lone pairs as additional central domains.'
    difficultyEvidence: 'Requires local structural parsing rather than formula-name recall.'
    answerVerificationMethod: 'independent Lewis-environment and domain-count audit'
    variationAxes: [molecule, representation, unknown, bond-order pattern, lone-pair count]
  names: &names
    objectiveId: chem-vsepr-distinguish-geometries
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0996, src-20260720035703-91ea51b0d8:chunk-0998, src-20260720035703-91ea51b0d8:chunk-0999]
    reviewState: approved
    givens: 'A domain count or AXE environment.'
    unknown: 'Electron-domain geometry, molecular geometry, or both.'
    representationRequirement: required
    governingPrinciple: 'Electron geometry includes every domain; molecular geometry names bonded-atom positions only.'
    methodSteps: [count domains, name electron geometry, omit lone-pair positions, name molecular geometry, cross-check AXE]
    likelyMisconception: 'Using the electron-domain name as the molecular-geometry answer.'
    difficultyEvidence: 'Coordinates two related but nonidentical geometry labels.'
    answerVerificationMethod: 'AXE-to-geometry table and atom-position check'
    variationAxes: [AXE family, requested label, representation, lone-pair count]
  angles: &angles
    objectiveId: chem-vsepr-refine-angles
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-1002, src-20260720035703-91ea51b0d8:chunk-1011]
    reviewState: approved
    givens: 'A local geometry and any lone-pair or multiple-bond asymmetry.'
    unknown: 'Ideal angle, distortion direction, or defensible precision.'
    representationRequirement: required
    governingPrinciple: 'Ideal angles follow the domain family; unequal domain repulsions produce qualitative distortions.'
    methodSteps: [select angle vertex, determine domain family, state ideal, compare repulsions, qualify prediction]
    likelyMisconception: 'Assigning an unsupported exact angle or reversing compression and expansion.'
    difficultyEvidence: 'Separates ideal geometry from molecule-specific refinement.'
    answerVerificationMethod: 'ideal-angle table and qualitative repulsion audit'
    variationAxes: [domain family, angle requested, repulsion source, precision]
  positions: &positions
    objectiveId: chem-vsepr-position-five-six
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-1004, src-20260720035703-91ea51b0d8:chunk-1005, src-20260720035703-91ea51b0d8:chunk-1006]
    reviewState: approved
    givens: 'A five- or six-domain AXE inventory.'
    unknown: 'Preferred lone-pair positions and resulting molecular geometry.'
    representationRequirement: required
    governingPrinciple: 'Lone pairs minimize close interactions; equatorial sites are favored in five domains and opposite sites in AX4E2.'
    methodSteps: [identify family, compare positions, place lone pairs, identify remaining atom sites, name geometry]
    likelyMisconception: 'Treating axial/equatorial positions as equivalent or failing to separate domain and molecular names.'
    difficultyEvidence: 'Requires spatial optimization before naming the atoms.'
    answerVerificationMethod: '90-degree interaction count and spatial site audit'
    variationAxes: [domain family, X/E split, position unknown, requested shape]
  local: &local
    objectiveId: chem-vsepr-local-centers
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-1008, src-20260720035703-91ea51b0d8:chunk-1010]
    reviewState: approved
    givens: 'A molecule with multiple potential local centers.'
    unknown: 'The geometry at one or more selected centers.'
    representationRequirement: required
    governingPrinciple: 'VSEPR geometry is defined locally around one selected atom at a time.'
    methodSteps: [select center, inventory local domains, name local geometries, repeat, communicate sequence]
    likelyMisconception: 'Assigning one global VSEPR geometry to a multicenter molecule.'
    difficultyEvidence: 'Decomposes one structure into several independent local analyses.'
    answerVerificationMethod: 'center-by-center domain audit'
    variationAxes: [molecule, centers, bond-order pattern, output sequence]
