blueprints:
  - id: phys1-ch10-moment-of-inertia-point-masses
    objectiveId: phys1-obj-fixed-axis-rotation
    archetype: moment-of-inertia-discrete
    questionType: numericResponse
    givens: ["masses of two point particles", "distances from the axis of rotation"]
    unknown: "total moment of inertia of the system"
    requiresDiagram: false
    governingPrinciple: "The total moment of inertia of a system of discrete particles is the sum of the moments of inertia of the individual particles: I = sum(m_i * r_i^2)."
    methodSteps:
      - "Identify the mass and distance from the rotation axis for each particle."
      - "Calculate the moment of inertia for the first particle: I_1 = m_1 * r_1^2."
      - "Calculate the moment of inertia for the second particle: I_2 = m_2 * r_2^2."
      - "Sum the individual moments of inertia: I_total = I_1 + I_2."
    likelyMisconception: "Forgetting to square the distance or summing distances before squaring (e.g., computing I = (m1+m2)*(r1+r2)^2)."
    difficultyEvidence: "Requires understanding that moment of inertia is additive and depends on the square of the radial distance from the axis."
    answerVerificationMethod: independent-derivation
    variationAxes: ["number of particles", "axis of rotation (changing the r values for the same geometric setup)", "units (cm vs m)"]
    reasoningSignature: "Additivity of I; r is perpendicular distance to axis."

  - id: phys1-ch10-rotational-kinetic-energy
    objectiveId: phys1-obj-fixed-axis-rotation
    archetype: rotational-kinetic-energy
    questionType: numericResponse
    givens: ["moment of inertia of a rigid body", "angular velocity"]
    unknown: "rotational kinetic energy"
    requiresDiagram: false
    governingPrinciple: "Rotational kinetic energy is given by K = 0.5 * I * omega^2."
    methodSteps:
      - "Identify the moment of inertia I and angular velocity omega."
      - "Convert angular velocity to rad/s if given in rev/min (rpm)."
      - "Substitute values into K = 0.5 * I * omega^2."
    likelyMisconception: "Failing to convert rpm to rad/s or forgetting the factor of 1/2."
    difficultyEvidence: "Requires unit conversion (rpm to rad/s) and applying the rotational kinetic energy formula."
    answerVerificationMethod: independent-derivation
    variationAxes: ["angular velocity units (rad/s vs rpm)", "providing mass and radius of a specific shape instead of giving I directly"]
    reasoningSignature: "Unit conversion omega; K proportional to omega squared."
