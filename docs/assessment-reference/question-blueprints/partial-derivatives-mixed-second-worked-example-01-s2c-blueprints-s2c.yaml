  questionType: freeResponse
  givens: Let $f(x,y)=x^3y^2-4xy+2y$. Find $f_{xy}$ and $f_{yx}$ independently, then compare them.
  unknown: Find $f_x$ while holding y fixed.
  representationRequirement: Algebraic function with specified domain and requested mixed derivative order.
  governingPrinciple: Differentiate the named first partial in the next variable; use Clairaut only with
    continuity on a neighborhood.
  methodSteps:
  - Compute the first partial in the stated order.
  - Differentiate that expression in the second variable, applying product, chain, or quotient rules as
    needed.
  - Repeat in reverse order and compare; verify domain and continuity conditions.
  likelyMisconception: Reverse the order without recomputing the first partial, omit an inner chain factor,
    or invoke Clairaut outside a smooth domain.
  difficultyTier: challenging
  difficultyEvidence: Two independently computed second-order paths with chain/product/quotient structure
    and a domain or continuity justification.
  answerVerificationMethod: Symbolically differentiate both first partials independently and simplify
    to a common expression.
  variationAxes:
  - function structure
  - domain
