- id: physics-newtons-second-law-rotation-bp-easy-q007
  objectiveId: phys1-obj-fixed-axis-rotation
  sourceChunkIds:
  - src-20260720001005-93652b69c4:chunk-0839
  reviewState: approved
  questionType: symbolicResponse
  difficulty: easy
  givens: mass, radius, force
  unknown: alpha
  representation: text-only
  governingPrinciple: tau = I * alpha and I = 1/2 m r^2
  methodSteps: []
  likelyMisconception: ''
  answerVerificationMethod: independent calculation
  variationAxes:
    scenario: Disk pulled by string (variant 7)
    constraints: ''
    methodBranch: ''
  reasoningSignature: physics-newtons-second-law-rotation-easy-7
  difficultyDimensions:
  - symbolic-manipulation
  - coupled-equations
  subjectDifficultyTags: []
  difficultyEvidence: Requires substitution and algebra
  prerequisiteObjectiveIds: []
  draftAssessmentData:
    prompt: A force $F$ is applied tangentially to the edge of a solid uniform disk
      of mass $M$ and radius $R$. Derive the expression for its angular acceleration
      $\alpha$.
    type: symbolicResponse
    answer:
      expectedLatex: \frac{2F}{MR}
      equivalenceMode: derivative
      variables:
      - F
      - M
      - R
      tolerance: 0.001
    explanation: Torque is $\tau = FR$. MOI of a solid disk is $I = \frac{1}{2}MR^2$.
      Using $\tau = I\alpha$, we get $FR = (\frac{1}{2}MR^2)\alpha \implies \alpha
      = \frac{2F}{MR}$.
