  questionType: multipleChoice
  givens: A flat surface, a uniform electric field, and an area vector normal to the surface.
  unknown: Identify the angle used by the flux dot product.
  representationRequirement: Original area-vector diagram.
  governingPrinciple: 'Electric flux through a flat surface is the oriented dot product $\Phi_E=\mathbf E\cdot\mathbf A=EA\cos\theta$.'
  methodSteps: [Locate the surface normal, compare it with the field direction, interpret the dot product angle.]
  likelyMisconception: Measuring the angle from the plane of the surface instead of from its normal.
  difficultyEvidence: Requires translating a geometric label into the dot-product convention.
  answerVerificationMethod: Check the definition of a dot product and the limiting cases at zero and ninety degrees.
