  questionType: multipleChoice
  givens: '$E=kq/r^2$, $A=4\pi r^2$, and parallel field and area vectors.'
  unknown: Explain the cancellation of radius in spherical flux.
  representationRequirement: Equation-by-equation reading of the sphere visual.
  governingPrinciple: The inverse-square field decrease exactly offsets the quadratic growth of spherical area.
  methodSteps: [Substitute field and area into flux, cancel radius squared, replace the Coulomb constant.]
  likelyMisconception: Concluding that the field is independent of radius because the flux is independent of radius.
  difficultyEvidence: Requires distinguishing local field magnitude from total surface flux.
  answerVerificationMethod: Verify algebraically that $r^2$ cancels only after multiplication by the full sphere area.
  variationAxes: [algebraic derivation, physical interpretation]
  reasoningSignature: inverse-square-times-sphere-area-cancellation
