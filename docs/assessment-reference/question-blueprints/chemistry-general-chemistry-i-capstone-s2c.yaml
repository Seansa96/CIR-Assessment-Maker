  - id: chem1-capstone-stoichiometry
    objectiveId: chem1-quantitative-pipeline
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0310]
    reviewState: approved
    questionType: numericResponse
    givens: Balanced combustion equation and two reactant masses
    unknown: Product mass after limiting-reactant analysis
    governingPrinciple: Mole conversion, coefficient ratio, and limiting-reactant comparison
    methodSteps: Convert both masses to moles; identify limiting reactant; convert limiting amount to requested mass.
    likelyMisconception: Selecting the smaller mass rather than the smaller stoichiometric extent.
    difficultyEvidence: Requires three representations and a branch based on limiting evidence.
    variationAxes: [reactant identity, requested product, amount units]
    reasoningSignature: mass-to-moles -> limiting comparison -> mole ratio -> mass
  - id: chem1-capstone-aqueous
    objectiveId: chem1-aqueous-reaction-model
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402]
    reviewState: approved
    questionType: multipleChoice
    givens: Two soluble ionic compounds in water
    unknown: Net ionic equation
    governingPrinciple: Solubility rules and conservation of mass and charge
    methodSteps: Exchange ions; identify precipitate; dissociate strong electrolytes; cancel spectators.
    likelyMisconception: Leaving spectator ions in the net ionic equation.
    difficultyEvidence: Combines reaction prediction, solubility evidence, and ionic notation.
    variationAxes: [ions, precipitate, spectator set]
    reasoningSignature: predict products -> apply solubility -> cancel spectators
  - id: chem1-capstone-thermochemistry
    objectiveId: chem1-energy-model
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0521]
    reviewState: approved
    questionType: numericResponse
    givens: Formation enthalpies and balanced reaction
    unknown: Standard reaction enthalpy
    governingPrinciple: Sum products minus sum reactants
    methodSteps: Multiply each formation enthalpy by its coefficient; subtract reactant sum.
    likelyMisconception: Reversing the subtraction order or omitting coefficients.
    difficultyEvidence: Requires table interpretation, stoichiometry, and sign control.
    variationAxes: [reaction, coefficients, phases]
    reasoningSignature: coefficient-weighted product sum minus reactant sum
