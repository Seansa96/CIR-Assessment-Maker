    objectiveId: chem-kinetics-rate-law
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-1596]
    questionType: symbolicResponse
    governingPrinciple: Comparing trials that isolate one reactant reveals its exponent in the rate law.
    methodSteps: [Choose matched trials, Form rate ratio, Solve exponent, Write rate law]
    likelyMisconception: Copying balanced-equation coefficients into a rate law.
    difficultyEvidence: Requires controlled-comparison reasoning rather than direct substitution.
    answerVerificationMethod: substitute every trial into the proposed rate law
    variationAxes: [reactant changed, rate factor, reaction order]
    reasoningSignature: initial-rate-ratio-order-deduction
