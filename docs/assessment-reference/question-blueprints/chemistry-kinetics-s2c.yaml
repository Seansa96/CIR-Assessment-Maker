    objectiveId: chem-kinetics-rate-stoichiometry
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-1578]
    questionType: numericResponse
    governingPrinciple: Average reaction rate is concentration change divided by elapsed time, with sign selected for disappearance or appearance.
    methodSteps: [Identify concentration change, Divide by interval, Report positive physical rate with units]
    likelyMisconception: Reporting a negative disappearance rate.
    difficultyEvidence: Requires interpreting a concentration-time table and a sign convention.
    answerVerificationMethod: independent substitution into rate definition
    variationAxes: [species role, time interval, stoichiometric coefficient]
    reasoningSignature: average-rate-signed-concentration-change
