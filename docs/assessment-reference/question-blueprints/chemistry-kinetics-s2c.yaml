    objectiveId: chem-kinetics-time-models
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-1598]
    questionType: numericResponse
    governingPrinciple: A first-order half-life is constant and related to k by t-half equals 0.693 divided by k.
    methodSteps: [Identify first-order model, Select half-life relation, Calculate and attach units]
    likelyMisconception: Using concentration-dependent half-life for a first-order reaction.
    difficultyEvidence: Requires model selection and unit conversion.
    answerVerificationMethod: dimensional analysis and reverse calculation
    variationAxes: [given variable, time unit, requested quantity]
    reasoningSignature: first-order-half-life-rate-constant
