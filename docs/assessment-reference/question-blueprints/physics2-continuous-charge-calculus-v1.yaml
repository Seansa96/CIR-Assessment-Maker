  givens: For a uniform rod on $[-L,L]$, the vertical field at $(0,a)$ is $k\lambda
    a\int_{-L}^{L}(x^2+a^2)^{-3/2}dx$, with $a,L>0$. Which endpoint evaluation is
    correct?
  unknown: $E_y=2k\lambda L/[a\sqrt{a^2+L^2}]$
  representationRequirement: Use the coordinates, positive-parameter conditions, and
    geometric source element specified in the prompt.
  governingPrinciple: Endpoint subtraction after the rod antiderivative
  methodSteps:
  - Differentiate x/(a^2 sqrt(x^2+a^2)) to verify the primitive.
  - Subtract its values at -L and L.
  - Multiply by k lambda a without an extra doubling.
  likelyMisconception: Missing one endpoint, double-counting halves, or using a fixed
    distance
