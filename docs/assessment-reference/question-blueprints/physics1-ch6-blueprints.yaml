blueprints:
  - id: phys1-ch6-friction-horizontal
    objectiveId: phys1-obj-applications-newtons-laws
    archetype: friction-horizontal-pull
    questionType: numericResponse
    givens: ["mass of block", "coefficient of kinetic friction", "applied pulling force angle"]
    unknown: "acceleration of the block"
    requiresDiagram: false
    governingPrinciple: "Newton's Second Law in 2D (sum of Fx = ma, sum of Fy = 0) and f_k = mu_k * N"
    methodSteps:
      - "Resolve applied force into horizontal and vertical components."
      - "Calculate normal force N = mg - Fy."
      - "Calculate kinetic friction f_k = mu_k * N."
      - "Calculate net horizontal force F_net = Fx - f_k."
      - "Solve for acceleration a = F_net / m."
    likelyMisconception: "Assuming N = mg regardless of the upward vertical component of the pulling force."
    difficultyEvidence: "Requires 2D vector resolution and recognizing that applied force alters the normal force."
    answerVerificationMethod: independent-derivation
    variationAxes: ["angle of pull (horizontal vs angled)", "direction of pull (pushing down vs pulling up)", "surface angle (flat vs slight incline)"]
    reasoningSignature: "N != mg; N depends on Fy. f_k depends on N. a depends on Fx and f_k."

  - id: phys1-ch6-friction-static-limit
    objectiveId: phys1-obj-applications-newtons-laws
    archetype: static-friction-threshold
    questionType: numericResponse
    givens: ["mass of block", "coefficient of static friction"]
    unknown: "maximum angle of incline before sliding"
    requiresDiagram: true
    governingPrinciple: "Static equilibrium on an incline limit (mg*sin(theta) = mu_s * mg*cos(theta))"
    methodSteps:
      - "Set up force balance parallel and perpendicular to the incline."
      - "Recognize that at the verge of slipping, f_s = mu_s * N."
      - "Equate mg*sin(theta) = mu_s * mg*cos(theta)."
      - "Simplify to tan(theta) = mu_s and solve for theta."
    likelyMisconception: "Using kinetic friction instead of static, or misidentifying sine/cosine components of weight."
    difficultyEvidence: "Requires algebraic simplification showing mass cancels out, and inverse trigonometric function."
    answerVerificationMethod: independent-derivation
    variationAxes: ["solving for angle given mu_s", "solving for mu_s given angle", "adding an external holding force"]
    reasoningSignature: "Threshold condition means inequality becomes equality. Mass independence."
