templates:
  equations: &equations
    objectiveId: chem-nuclear-equations
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2430, src-20260720035703-91ea51b0d8:chunk-2431]
    reviewState: approved
    givens: 'Nuclear notation or an incomplete nuclear equation.'
    unknown: 'A missing particle, daughter nuclide, mass number, or atomic number.'
    representationRequirement: required
    governingPrinciple: 'Mass number and atomic number are separately conserved in nuclear equations.'
    methodSteps: [sum mass numbers, sum atomic numbers, solve missing values, identify element or particle, verify both sums]
    likelyMisconception: 'Treating chemical charge or ordinary atom coefficients as nuclear mass and atomic numbers.'
    difficultyEvidence: 'Coordinates two conservation equations with isotope notation.'
    answerVerificationMethod: 'independent mass-number and atomic-number audit'
    variationAxes: [missing quantity, decay representation, nuclide family, requested interpretation]
  stability: &stability
    objectiveId: chem-nuclear-stability-decay
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2436]
    reviewState: approved
    givens: 'A decay mode, parent nuclide, or neutron-to-proton condition.'
    unknown: 'Daughter-number change, likely decay mode, or stability implication.'
    representationRequirement: required
    governingPrinciple: 'Each decay mode has a characteristic mass-number and atomic-number change related to nuclear stability.'
    methodSteps: [identify decay particle, apply delta A and delta Z, identify daughter or trend, verify conservation]
    likelyMisconception: 'Changing mass number during beta-family decay or applying the atomic-number shift backward.'
    difficultyEvidence: 'Links a symbolic emission to daughter location and stability direction.'
    answerVerificationMethod: 'decay-change table and conservation check'
    variationAxes: [decay mode, parent location, unknown, stability condition]
  half: &half
    objectiveId: chem-nuclear-half-life
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2455, src-20260720035703-91ea51b0d8:chunk-2460, src-20260720035703-91ea51b0d8:chunk-2461]
    reviewState: approved
    givens: 'Initial amount, elapsed time or half-lives, and a half-life or decay constant.'
    unknown: 'Remaining amount, elapsed time, half-life, or decay constant.'
    representationRequirement: none
    governingPrinciple: '$N=N_0(1/2)^{t/t_{1/2}}$ and $t_{1/2}=\ln2/k$ for first-order radioactive decay.'
    methodSteps: [identify model, count half-lives or convert k, evaluate fraction, attach units, reverse-check]
    likelyMisconception: 'Subtracting equal amounts each half-life instead of halving what remains.'
    difficultyEvidence: 'Applies multiplicative decay with time and unit interpretation.'
    answerVerificationMethod: 'reverse half-life count or substitution into exponential decay'
    variationAxes: [given quantity, requested quantity, discrete or continuous model, time unit]
  energy: &energy
    objectiveId: chem-nuclear-energy
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2473, src-20260720035703-91ea51b0d8:chunk-2475, src-20260720035703-91ea51b0d8:chunk-2491]
    reviewState: approved
    givens: 'Nuclear masses, binding-energy information, or a fission/fusion description.'
    unknown: 'Mass defect, binding-energy implication, or process classification.'
    representationRequirement: none
    governingPrinciple: 'A positive mass defect corresponds to nuclear binding energy through $E=\Delta mc^2$; fission splits heavy nuclei and fusion joins light nuclei.'
    methodSteps: [identify constituents or process, compare masses or products, apply energy relation or binding trend, verify sign and units]
    likelyMisconception: 'Using a negative mass defect or reversing fission and fusion.'
    difficultyEvidence: 'Connects microscopic mass differences to energy and nuclear process direction.'
    answerVerificationMethod: 'mass inventory, sign, unit, and process-definition check'
    variationAxes: [process type, representation, requested energy meaning, nuclear mass region]
  radiation: &radiation
    objectiveId: chem-nuclear-radiation
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2463, src-20260720035703-91ea51b0d8:chunk-2496, src-20260720035703-91ea51b0d8:chunk-2497]
    reviewState: approved
    givens: 'A radiation type, exposure geometry, detector, or shielding scenario.'
    unknown: 'Penetration, monitoring choice, shielding, or relative hazard.'
    representationRequirement: required
    governingPrinciple: 'Alpha, beta, and gamma differ in ionization and penetration; hazard also depends on whether the source is outside or inside the body.'
    methodSteps: [identify radiation, compare range and penetration, locate source, select detector or shield, state limitation]
    likelyMisconception: 'Equating greatest penetration with greatest hazard in every exposure context.'
    difficultyEvidence: 'Integrates radiation identity, material interaction, and exposure location.'
    answerVerificationMethod: 'penetration model and internal-versus-external consistency check'
    variationAxes: [radiation type, source location, material, detector or safety unknown]
