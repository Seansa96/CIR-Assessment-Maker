  - id: phys1-ch15-shm-period
    objectiveId: phys1-obj-oscillations
    archetype: shm-period-mass-spring
    questionType: numericResponse
    givens: ["mass of the oscillating object", "spring constant"]
    unknown: "period of oscillation"
    requiresDiagram: true
    governingPrinciple: "The period of a mass-spring system in simple harmonic motion is T = 2*pi*sqrt(m/k)."
    methodSteps:
      - "Identify mass m and spring constant k."
      - "Substitute into T = 2*pi*sqrt(m/k)."
    likelyMisconception: "Using frequency instead of period, or forgetting the square root."
    difficultyEvidence: "Direct application of formula."
    answerVerificationMethod: independent-derivation
    variationAxes: ["mass vs spring constant solving", "presence of external constant forces"]
    reasoningSignature: "Period is independent of amplitude; governed strictly by m and k."

  - id: phys1-ch16-traveling-wave-speed
    objectiveId: phys1-obj-waves
    archetype: traveling-wave-speed-frequency
    questionType: numericResponse
    givens: ["wavelength", "frequency or period"]
    unknown: "wave speed"
    requiresDiagram: true
    governingPrinciple: "The speed of a traveling wave is v = lambda * f or v = lambda / T."
    methodSteps:
      - "Identify wavelength lambda and frequency f (or period T)."
      - "Calculate wave speed v = lambda * f."
    likelyMisconception: "Dividing lambda by f instead of multiplying."
    difficultyEvidence: "Direct application of basic wave property relation."
    answerVerificationMethod: independent-derivation
    variationAxes: ["extracting lambda and T from graphs vs given text", "solving for lambda given v and f"]
    reasoningSignature: "Wave speed is constant for a uniform medium; v = f * lambda."

  - id: phys1-ch17-sound-speed
    objectiveId: phys1-obj-sound
    archetype: sound-wave-speed
    questionType: numericResponse
    givens: ["temperature of air"]
    unknown: "speed of sound"
    requiresDiagram: false
    governingPrinciple: "The speed of sound in air at temperature T (in Celsius) is v = 331 m/s * sqrt(1 + T/273) or approximately v = 331 + 0.6*T."
    methodSteps:
      - "Identify the temperature of the air."
      - "Apply the empirical formula for speed of sound based on temperature."
    likelyMisconception: "Assuming speed of sound is exactly 343 m/s at all temperatures."
    difficultyEvidence: "Requires temperature-dependent calculation."
    answerVerificationMethod: independent-derivation
    variationAxes: ["temperature in Celsius vs Kelvin", "using speed to find distance to lightning strike"]
    reasoningSignature: "Sound speed depends on the properties of the medium (temperature)."
