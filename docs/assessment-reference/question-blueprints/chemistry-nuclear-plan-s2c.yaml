contractNotes:
  - 'All six learner activities are published from approved item-level blueprints; no generic placeholder items remain.'
  - 'Nuclear notation, decay equations, mass-energy conversions, and penetration diagrams require item-level source review before approval.'
objectives:
  - chem-nuclear-equations
  - chem-nuclear-stability-decay
  - chem-nuclear-half-life
  - chem-nuclear-energy
  - chem-nuclear-radiation
activities:
  - assessmentId: chemistry-nuclear-concept-lesson-s2c
    activityType: conceptLesson
    plannedStructure: { sections: 6, checksPerSection: 1 }
    coverage: [nuclear notation and conservation, decay modes and daughter changes, stability patterns, half-life, mass defect and nuclear energy, radiation detection and safety]
    requiredVisuals: [decay-daughter-map, radiation-penetration-model]
  - assessmentId: chemistry-nuclear-glossary-s2c
    activityType: glossary
    plannedStructure: { terms: 16, drillsPerTerm: 1 }
    coverage: [nuclide, radionuclide, alpha, beta, positron, electron capture, gamma, half-life, decay constant, activity, mass defect, binding energy, fission, fusion, dosimeter, shielding]
  - assessmentId: chemistry-nuclear-worked-examples-s2c
    activityType: guidedWorkedExample
    plannedStructure: { examples: 3, minimumStepsPerExample: 3 }
    coverage: [balanced nuclear equation, half-life or first-order decay calculation, mass-defect energy calculation]
  - assessmentId: chemistry-nuclear-recall-s2c
    activityType: mixedRecallSet
    plannedStructure: { minimumItems: 12 }
    coverage: [conservation rules, daughter shifts, stability reasoning, decay relations, energy relations, detection, penetration, safety]
  - assessmentId: chemistry-nuclear-easy-quiz-s2c
    activityType: focusedPractice
    plannedStructure: { items: 10, minimumDifficultyDimensions: 2 }
    coverage: [equation completion, decay identification, repeated half-lives, detector and shielding selection]
  - assessmentId: chemistry-nuclear-test-s2c
    activityType: formalTest
    plannedStructure: { items: 12, transferDifficultyDimensions: 3 }
    coverage: [stability and decay transfer, continuous decay, binding energy, fission and fusion, dose and penetration scenarios]
