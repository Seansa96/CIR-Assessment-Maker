qualityGates:
  - 'Conserve both mass number and atomic number in every nuclear equation.'
  - 'Verify half-life and continuous-decay calculations independently with units.'
  - 'Verify mass defect sign, atomic-mass-unit conversion, and energy units.'
  - 'Distinguish penetration from biological hazard and internal from external exposure.'
