templates:
  redox: &redox
    objectiveId: chem-electrochem-redox
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2293, src-20260720035703-91ea51b0d8:chunk-2299]
    reviewState: approved
    givens: 'Oxidation states or a redox equation with stated medium.'
    unknown: 'Electron-transfer roles or a mass- and charge-balanced relation.'
    representationRequirement: none
    governingPrinciple: 'Oxidation loses electrons, reduction gains them, and both atoms and net charge are conserved.'
    methodSteps: [assign oxidation states, separate half-reactions, balance mass and charge, cancel electrons, verify]
    likelyMisconception: 'Reversing oxidation and reduction or balancing atoms without charge.'
    answerVerificationMethod: 'independent atom, charge, and electron-count audit'
    variationAxes: [medium, species roles, unknown, representation]
  cells: &cells
    objectiveId: chem-electrochem-cells
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2311, src-20260720035703-91ea51b0d8:chunk-2317]
    reviewState: approved
    givens: 'A cell reaction, half-cells, or labeled cell representation.'
    unknown: 'Anode, cathode, electron/ion direction, notation, or practical implication.'
    representationRequirement: required
    governingPrinciple: 'Oxidation occurs at the anode, reduction at the cathode, and electrons travel externally from anode to cathode.'
    methodSteps: [identify half-reactions, assign electrodes, trace electrons and ions, encode notation, verify charge balance]
    likelyMisconception: 'Using electrode sign instead of oxidation/reduction to name anode and cathode.'
    answerVerificationMethod: 'half-reaction and circuit-direction consistency check'
    variationAxes: [cell type, representation, requested direction, active species]
  potential: &potential
    objectiveId: chem-electrochem-potential
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2319, src-20260720035703-91ea51b0d8:chunk-2325, src-20260720035703-91ea51b0d8:chunk-2334]
    reviewState: approved
    givens: 'Standard reduction potentials and a balanced electron count.'
    unknown: 'Cell potential, spontaneity, free energy, or equilibrium implication.'
    representationRequirement: none
    governingPrinciple: '$E^\circ_{cell}=E^\circ_{red,cathode}-E^\circ_{red,anode}$ and $\Delta G^\circ=-nFE^\circ$.'
    methodSteps: [choose cathode, subtract reduction potentials, interpret sign, apply thermodynamic relation, verify units]
    likelyMisconception: 'Multiplying an intensive potential by a balancing coefficient or reversing the subtraction.'
    answerVerificationMethod: 'independent sign, unit, and half-reaction check'
    variationAxes: [electrode pair, unknown, sign interpretation, thermodynamic link]
  nonstandard: &nonstandard
    objectiveId: chem-electrochem-nonstandard
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2340, src-20260720035703-91ea51b0d8:chunk-2344, src-20260720035703-91ea51b0d8:chunk-2345]
    reviewState: approved
    givens: 'A balanced cell reaction, $E^\circ$, temperature, n, and Q or concentrations.'
    unknown: 'Nonstandard potential, Q trend, free energy, or equilibrium state.'
    representationRequirement: none
    governingPrinciple: 'At 25 C, $E=E^\circ-(0.05916/n)\log Q$; equilibrium has E=0 and Q=K.'
    methodSteps: [form Q, count electrons, apply Nernst equation, interpret sign and limiting state, verify]
    likelyMisconception: 'Reversing Q or the Nernst correction direction.'
    answerVerificationMethod: 'recalculation plus limiting-case check at Q=1 or Q=K'
    variationAxes: [concentration pattern, requested quantity, reaction direction, temperature condition]
  electrolysis: &electrolysis
    objectiveId: chem-electrochem-electrolysis
    sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-2375, src-20260720035703-91ea51b0d8:chunk-2378, src-20260720035703-91ea51b0d8:chunk-2380]
    reviewState: approved
    givens: 'Current, time, Faraday constant, half-reaction electron count, and molar mass as needed.'
    unknown: 'Charge, moles of electrons, deposited amount, time, or electrolytic direction.'
    representationRequirement: required
    governingPrinciple: '$q=It$, $n(e^-)=q/F$, and half-reaction stoichiometry converts electrons to substance.'
    methodSteps: [convert time, calculate charge, convert to electron moles, apply stoichiometry, convert to requested unit]
    likelyMisconception: 'Skipping electron stoichiometry or treating current as total charge.'
    answerVerificationMethod: 'independent dimensional and electron-mole calculation'
    variationAxes: [ion charge, requested quantity, current-time data, cell representation]
