    givens: Spherically symmetric source and concentric Gaussian surface outside all charge.
    unknown: Physical reason the exterior field has point-charge form.
    representationRequirement: Translate concentric geometry into constant field magnitude and direction on the surface.
    governingPrinciple: Gauss's law with spherical symmetry and Qenc equal to total charge.
    methodSteps: [Use radial symmetry, factor E from flux, use area 4 pi r squared, equate flux to Qtotal over epsilon zero.]
    misconception: Treating equivalent exterior field as evidence all charge sits at the center.
    difficultyEvidence: Identifies the assumptions that permit solving for E.
    verification: {method: Substitute spherical area and total enclosed charge into Gauss's law, result: kQtotal/r^2}
