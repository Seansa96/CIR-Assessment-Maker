    questionType: multipleChoice
    givens: Radial-only density dependence in a spherical source diagram.
    unknown: Which spatial symmetry describes the full source?
    representationRequirement: Infer 3D symmetry from density dependence rather than the outline in a 2D view.
    governingPrinciple: Spherical symmetry requires charge density to depend only on distance from the center.
    methodSteps: [Identify the center, test whether rotations alter the distribution, classify its symmetry.]
    misconception: Assuming density must be constant everywhere or confusing a cross-section with the full object.
    difficultyEvidence: Classifies a charge pattern from its density dependence and representation.
    verification: {method: Compare invariance under arbitrary rotations, result: Spherical symmetry}
    variationAxes: [source geometry, density dependence]
    reasoningSignature: charge-geometry-s1:spherical-radial-density
    difficultyDimensions: [modelOrDerivation, representation]
