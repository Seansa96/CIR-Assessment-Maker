    givens: Uniform finite rod with paired source elements and perpendicular-bisector observer.
    unknown: Why the field component parallel to the rod cancels.
    representationRequirement: Read paired displacement vectors and project field components.
    governingPrinciple: Coulomb superposition with reflection symmetry about the perpendicular bisector.
    methodSteps: [Pair equal elements, compare distances, resolve parallel and perpendicular components, add pairs.]
    misconception: Believing an individual element has no component along the rod or invoking Gauss's law for a finite rod.
    difficultyEvidence: Explains component cancellation through source pairing.
    verification: {method: Compare the signs of paired vector components, result: Parallel cancels; perpendicular adds}
    variationAxes: [field point placement, source-element pairing]
    reasoningSignature: charge-geometry-s2:paired-components
