    reviewState: approved
    questionType: multipleChoice
    givens: Uniform volume density in a nonconducting solid sphere and an interior Gaussian radius r.
    unknown: Why interior field is proportional to r.
    representationRequirement: Compare enclosed volume growth to Gaussian area growth.
    governingPrinciple: Qenc equals rho times four-thirds pi r cubed; Gauss flux is E times four pi r squared.
    methodSteps: [Find enclosed volume, compute enclosed charge, equate flux to Qenc/epsilon zero, simplify the radius power.]
    misconception: Applying zero interior field for a conductor to a nonconducting solid.
    difficultyEvidence: Derives the scaling from the changing enclosed charge and area.
    verification: {method: Divide Qenc by epsilon zero and spherical area, result: rho r/(3 epsilon zero)}
    variationAxes: [radial extent, material model]
    reasoningSignature: charge-geometry-s6:sphere-inside-scaling
    difficultyDimensions: [modelOrDerivation, scaling]
