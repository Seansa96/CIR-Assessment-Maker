  givens: Pillbox crossing a charged sheet, with two flat faces and a tangent side wall.
  unknown: Determine the total flux expression.
  representationRequirement: Original side-view pillbox flux diagram.
  governingPrinciple: Each flat face contributes $EA$ with outward orientation, while the curved side contributes zero.
