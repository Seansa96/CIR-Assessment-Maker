  questionType: multipleChoice
  givens: Pillbox flux $2EA$ and enclosed sheet charge $Q_{enc}=\sigma A$.
  unknown: Solve the sheet field.
  representationRequirement: Equation chain tied to the pillbox.
  governingPrinciple: $2EA=\sigma A/\epsilon_0$ and cancellation of the pillbox face area gives $E=\sigma/(2\epsilon_0)$.
  methodSteps: [Substitute enclosed charge, cancel common face area, isolate E and retain direction separately.]
  likelyMisconception: Losing the factor of two or retaining an irrelevant distance variable.
  difficultyEvidence: Requires interpreting two equal face contributions and symbolic cancellation.
  answerVerificationMethod: Confirm the result has no r dependence and has units N/C.
  variationAxes: [surface count, algebraic cancellation]
  reasoningSignature: sheet-field-two-face-derivation
