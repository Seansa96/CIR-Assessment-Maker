  questionType: multipleChoice
  givens: A neutral CO2 skeleton has 16 valence electrons; after two single bonds and terminal oxygen octets, carbon has only four surrounding electrons and the full budget is used.
  unknown: The valid next electron-redistribution step that completes carbon's octet without changing the 16-electron total.
  representation: staged CO2 Lewis structures linked to a conserved electron budget
  governingPrinciple: When the central atom lacks an octet after all counted electrons are placed, an adjacent lone pair may become an additional shared pair without changing the electron total.
  methodSteps:
  - Confirm the 16-electron CO2 budget and count four electrons in the two initial bonds
  - Reassign one lone pair from each oxygen as a second C-O bonding pair
  - Recount 16 electrons, verify three octets, and calculate zero formal charge on every atom
  likelyMisconception: chemistry-bonding-valence-count-error
  answerVerificationMethod: Recount dots plus bonding electrons and evaluate FC = V - N - B/2 for C and O
  variationAxes:
    scenario: carbon-dioxide octet repair
    representation: electron-budget workflow and multiple-choice diagnosis
    unknown: which lone-pair redistribution completes the central octet
  reasoningSignature: chem-lewis-dot-structures-chem-lewis-dot-structures-concept-lesson-chk-sec-procedure
