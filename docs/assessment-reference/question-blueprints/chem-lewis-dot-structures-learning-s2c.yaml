- id: bp-chem-lewis-dot-structures-concept-lesson-chk-sec-incomplete-octets
  assessmentId: chem-lewis-dot-structures-concept-lesson
  questionId: chk-sec-incomplete-octets
  objectiveId: chem-bond-lewis-structures
  sourceChunkIds: *id001
  reviewState: approved
  questionType: multipleChoice
  givens: BF3 has 24 total valence electrons arranged as three B-F bonds and three lone pairs on each fluorine.
  unknown: Whether six electrons around boron can constitute a valid incomplete-octet Lewis structure.
  representation: side-by-side duet and electron-deficient Lewis structures for H2, BeCl2, and BF3
  governingPrinciple: Hydrogen follows a duet rule, while electron-deficient Be and B centers may have four or six surrounding electrons when the complete valence budget is conserved.
  methodSteps:
  - Total BF3 valence electrons as 3 + 3(7) = 24
  - Assign six electrons to three B-F bonds and eighteen to fluorine lone pairs
  - Verify that no counted electrons remain for a boron lone pair and that each fluorine has an octet
  likelyMisconception: lewis-structure-octet-error
  answerVerificationMethod: Count all 24 electrons and confirm six around B and eight around each F
  variationAxes:
    scenario: boron-trifluoride electron-deficient center
    representation: structural exception comparison and multiple-choice classification
    unknown: validity of a six-electron boron center
  reasoningSignature: chem-lewis-dot-structures-chem-lewis-dot-structures-concept-lesson-chk-sec-incomplete-octets
- id: bp-chem-lewis-dot-structures-concept-lesson-chk-sec-expanded-octets
  assessmentId: chem-lewis-dot-structures-concept-lesson
  questionId: chk-sec-expanded-octets
  objectiveId: chem-bond-lewis-structures
  sourceChunkIds: *id001
  reviewState: approved
  questionType: multipleChoice
  givens: In the usual SF6 Lewis structure, sulfur has V = 6, N = 0, and twelve bonding electrons from six S-F single bonds.
  unknown: Sulfur's formal charge under FC = V - N - B/2.
  representation: expanded-octet SF6 bond map paired with sulfur and fluorine formal-charge ledgers
  governingPrinciple: Expanded-octet structures still conserve the electron budget, use FC = V - N - B/2 atom by atom, and require formal charges to sum to the species charge.
  methodSteps:
  - Count twelve bonding electrons around sulfur and no sulfur lone electrons
  - Calculate FC(S) = 6 - 0 - 12/2 = 0
  - Calculate FC(F) = 7 - 6 - 2/2 = 0 and verify the molecular charge sum is zero
  likelyMisconception: chemistry-bonding-formal-charge-error
  answerVerificationMethod: Independently evaluate sulfur and fluorine formal charges and sum all seven values
  variationAxes:
    scenario: sulfur-hexafluoride expanded-shell audit
    representation: structure, formula, and multiple-choice calculation
    unknown: central-atom formal charge
  reasoningSignature: chem-lewis-dot-structures-chem-lewis-dot-structures-concept-lesson-chk-sec-expanded-octets
