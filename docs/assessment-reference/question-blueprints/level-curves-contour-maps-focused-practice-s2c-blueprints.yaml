  questionType: multipleChoice
  givens: Point P lies halfway between the 120 and 140 contours. Estimate the elevation.
  unknown: The map-based interpretation or estimate asked for in this prompt.
  representationRequirement: An original contour map with labeled function values, coordinate axes, and any relevant
    marked locations.
  governingPrinciple: A contour is the level set f(x,y)=c; comparing equal value intervals across distance reveals
    local change rate.
  methodSteps:
  - Identify the relevant labeled contour(s) and point position(s).
  - Interpolate between adjacent levels or compare equal-level spacing when needed.
  - Translate the result into a function value, signed change, equation, or geometric interpretation.
