  questionType: freeResponse
  givens: A survey marker is halfway between the 220-m and 240-m contours. Estimate its elevation. Show the map
    reading or calculation that supports your answer.
  unknown: The map-based interpretation or estimate asked for in this prompt.
  representationRequirement: An original contour map with labeled function values, coordinate axes, and any relevant
    marked locations.
  governingPrinciple: A contour is the level set f(x,y)=c; comparing equal value intervals across distance reveals
    local change rate.
  methodSteps:
  - Identify the relevant labeled contour(s) and point position(s).
  - Interpolate between adjacent levels or compare equal-level spacing when needed.
  - Translate the result into a function value, signed change, equation, or geometric interpretation.
  likelyMisconception: contour-interpolation-error
  issueSignal: contour-interpolation-error
  difficultyTier: hard
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  - errorDiagnosis
  subjectDifficultyTags:
  - contour-map-interpretation
  difficultyEvidence: Interprets this distinct map, chooses the relevant level values or spacing, and explains an
    estimate, change, or geometric consequence.
