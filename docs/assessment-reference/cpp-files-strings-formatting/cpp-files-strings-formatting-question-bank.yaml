- id: cpp-fsf-string-015
  topicId: cpp-strings-formatting
  skills:
  - format-integers-as-english
  - decompose-place-values
  archetype: recursive-number-word-formatting
  difficulty: hard
  reasoningDepth: 4
  difficultyEvidence: Requires hierarchical place-value decomposition, zero suppression inside groups, and stable
    spacing.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `std::string integer_to_english(unsigned int value)` for values
    from 0 through 999,999,999. Use American English without `and` or
    hyphens, capitalize the first letter only, and use single spaces.
    Examples: `12` becomes `Twelve`; `29` becomes `Twenty Nine`; `1005`
    becomes `One Thousand Five`.
  answer:
    functionSignature: std::string integer_to_english(unsigned int value)
    expectedCases:
    - - 0
      - Zero
    - - 29
      - Twenty Nine
    - - 1005
      - One Thousand Five
    - - 999999999
      - Nine Hundred Ninety Nine Million Nine Hundred Ninety Nine Thousand Nine Hundred Ninety Nine
  sampleSolution: |
    #include <array>
    #include <string>

    namespace {
    std::string below_thousand(unsigned int n) {
        static const std::array<std::string, 20> small{
            "", "One", "Two", "Three", "Four", "Five", "Six", "Seven",
            "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen",
            "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen",
            "Nineteen"};
        static const std::array<std::string, 10> tens{
            "", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty",
            "Seventy", "Eighty", "Ninety"};
        std::string out;
        auto add = [&](const std::string& word) {
            if (!word.empty()) {
                if (!out.empty()) out += ' ';
                out += word;
            }
        };
        if (n >= 100) {
            add(small[n / 100]);
            add("Hundred");
            n %= 100;
        }
        if (n >= 20) {
            add(tens[n / 10]);
            n %= 10;
        }
        if (n > 0) add(small[n]);
        return out;
    }
    }

    std::string integer_to_english(unsigned int value) {
        if (value == 0) return "Zero";
        std::string out;
        auto add_group = [&](unsigned int group, const char* scale) {
            if (group == 0) return;
            if (!out.empty()) out += ' ';
            out += below_thousand(group);
            if (*scale) {
                out += ' ';
                out += scale;
            }
        };
        add_group(value / 1'000'000, "Million");
        add_group((value / 1'000) % 1'000, "Thousand");
        add_group(value % 1'000, "");
        return out;
    }
  explanation: |
    English number names are naturally grouped in blocks of three decimal
    digits. A helper formats one block; the outer function appends only
    nonzero million, thousand, and unit blocks, preventing unwanted `Zero`
    words inside the number.
  solutionOutline: Format each nonzero three-digit group with lookup tables, append its scale name, and join groups
    with exactly one space.
  commonTrap: Emitting `Zero` for empty internal groups, producing text such as `One Thousand Zero Five`.
  verification:
    method: place-value-boundary-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-test
- id: cpp-fsf-string-016
  topicId: cpp-strings-formatting
  skills:
  - find-common-prefix
  - bound-parallel-indexing
  archetype: vertical-prefix-scan
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires comparing the same position across variable-length strings and stopping safely at
    the shortest.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `std::string longest_common_prefix(const
    std::vector<std::string>& words)`. Return the longest case-sensitive
    prefix shared by every string. Return an empty string for an empty vector
    or when the first characters differ.
  answer:
    functionSignature: std::string longest_common_prefix(const std::vector<std::string>& words)
    expectedCases:
    - - - Pasta
        - Pastel
        - Paste
      - Past
    - - - Java
        - JavaScript
        - Jam
      - Ja
    - - []
      - ''
  sampleSolution: |
    #include <string>
    #include <vector>

    std::string longest_common_prefix(
        const std::vector<std::string>& words) {
        if (words.empty()) return {};
        std::size_t length = 0;
        while (length < words.front().size()) {
            const char expected = words.front()[length];
            for (const auto& word : words) {
                if (length >= word.size() || word[length] != expected) {
                    return words.front().substr(0, length);
                }
            }
            ++length;
        }
        return words.front();
    }
  explanation: |
    At index `length`, every string must both contain that position and match
    the first string. The established invariant is that positions below
    `length` already match across the entire vector.
  solutionOutline: Advance a shared prefix index only after every word proves that the current character exists
    and matches.
  commonTrap: Indexing every word before checking its length, causing out-of-range access when one word is the prefix
    of another.
  verification:
    method: shortest-word-and-empty-input-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-test
- id: cpp-fsf-string-017
  topicId: cpp-strings-formatting
  skills:
  - generate-balanced-parentheses
  - maintain-backtracking-invariants
  archetype: constrained-backtracking-generation
  difficulty: hard
  reasoningDepth: 4
  difficultyEvidence: Requires exploring a combinatorial search tree while pruning every prefix that cannot become
    balanced.
  assessmentUses:
  - guided-project
  questionType: code
  prompt: |
    Implement `std::vector<std::string> balanced_parentheses(int pairs)`.
    Return every well-formed string containing exactly `pairs` `(` characters
    and `pairs` `)` characters, in lexicographic order. For `pairs == 0`,
    return a vector containing the empty string. For `pairs < 0`, return an
    empty vector.
  answer:
    functionSignature: std::vector<std::string> balanced_parentheses(int pairs)
    expectedCases:
    - - 2
      - - (())
        - ()()
    - - 3
      - - ((()))
        - (()())
        - (())()
        - ()(())
        - ()()()
    - - 0
      - - ''
  sampleSolution: |
    #include <string>
    #include <vector>

    namespace {
    void build_parentheses(int pairs, int open, int close,
                           std::string& current,
                           std::vector<std::string>& out) {
        if (open == pairs && close == pairs) {
            out.push_back(current);
            return;
        }
        if (open < pairs) {
            current.push_back('(');
            build_parentheses(pairs, open + 1, close, current, out);
            current.pop_back();
        }
        if (close < open) {
            current.push_back(')');
            build_parentheses(pairs, open, close + 1, current, out);
            current.pop_back();
        }
    }
    }

    std::vector<std::string> balanced_parentheses(int pairs) {
        if (pairs < 0) return {};
        std::vector<std::string> out;
        std::string current;
        build_parentheses(pairs, 0, 0, current, out);
        return out;
    }
  explanation: |
    An opening parenthesis is legal while fewer than `pairs` have been used.
    A closing parenthesis is legal only when it closes an unmatched opening
    one. Trying `(` before `)` produces the requested lexicographic order.
  solutionOutline: Backtrack over valid next characters while maintaining `close <= open <= pairs`, and emit only
    complete balanced strings.
  commonTrap: Generating all binary strings and filtering afterward, which explores exponentially many prefixes
    already known to be invalid.
  verification:
    method: invariant-and-catalan-count-check
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-delimiter-toolkit-guided-project
- id: cpp-fsf-string-018
  topicId: cpp-strings-formatting
  skills:
  - find-longest-valid-parentheses
  - use-unmatched-index-stack
  archetype: longest-valid-delimiter-substring
  difficulty: hard
  reasoningDepth: 4
  difficultyEvidence: Requires preserving unmatched boundary positions so valid suffix lengths can be measured after
    failures.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `std::size_t longest_valid_parentheses(std::string_view text)`.
    The input contains only `(` and `)`. Return the length of the longest
    contiguous well-formed parentheses substring. Examples: `(()` returns
    `2`, `(()))` returns `4`, and `))))((((` returns `0`.
  answer:
    functionSignature: std::size_t longest_valid_parentheses(std::string_view text)
    expectedCases:
    - - (()
      - 2
    - - (()))
      - 4
    - - )()())
      - 4
  sampleSolution: |
    #include <algorithm>
    #include <string_view>
    #include <vector>

    std::size_t longest_valid_parentheses(std::string_view text) {
        std::vector<long long> stack{-1};
        std::size_t best = 0;
        for (std::size_t i = 0; i < text.size(); ++i) {
            if (text[i] == '(') {
                stack.push_back(static_cast<long long>(i));
            } else {
                stack.pop_back();
                if (stack.empty()) {
                    stack.push_back(static_cast<long long>(i));
                } else {
                    best = std::max(
                        best, i - static_cast<std::size_t>(stack.back()));
                }
            }
        }
        return best;
    }
  explanation: |
    The stack stores unmatched opening indices plus a base boundary. After a
    successful close, the distance to the current unmatched boundary is the
    length of the valid suffix ending at that close. An unmatched close
    becomes the next base.
  solutionOutline: Track unmatched positions with a sentinel boundary, reset that boundary on unmatched closes,
    and maximize each valid suffix length.
  commonTrap: Keeping only a balance count, which cannot locate the start of the longest valid contiguous substring.
  verification:
    method: stack-boundary-trace
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-test
- id: cpp-fsf-string-019
  topicId: cpp-strings-formatting
  skills:
  - reverse-selected-characters
  - apply-two-pointer-invariant
  archetype: predicate-filtered-reversal
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires moving two pointers over non-target characters while swapping only vowel positions.
  assessmentUses:
  - directed-project
  questionType: code
  prompt: |
    Implement `std::string reverse_vowels(std::string text)`. Reverse the
    order of ASCII vowels `a e i o u`, case-insensitively, while every
    consonant, digit, space, and punctuation mark remains at its original
    index. Examples: `Hello` becomes `Holle` and `USA` becomes `ASU`.
  answer:
    functionSignature: std::string reverse_vowels(std::string text)
    expectedCases:
    - - w3resource
      - w3resuorce
    - - Hello
      - Holle
    - - USA
      - ASU
  sampleSolution: |
    #include <cctype>
    #include <string>
    #include <string_view>

    std::string reverse_vowels(std::string text) {
        auto vowel = [](char ch) {
            const char lower = static_cast<char>(
                std::tolower(static_cast<unsigned char>(ch)));
            return std::string_view{"aeiou"}.find(lower) !=
                   std::string_view::npos;
        };
        std::size_t left = 0;
        std::size_t right = text.size();
        while (left < right) {
            while (left < right && !vowel(text[left])) ++left;
            while (left < right && !vowel(text[right - 1])) --right;
            if (left < right) {
                std::swap(text[left++], text[--right]);
            }
        }
        return text;
    }
  explanation: |
    `right` is kept one past the candidate index, which makes empty input
    safe. Characters outside `[left, right)` are final; only two discovered
    vowel positions are swapped.
  solutionOutline: Advance inward to the next vowel on each side, swap those vowels, and repeat without moving any
    nonvowel.
  commonTrap: Reversing the whole string and filtering afterward, which changes consonant positions.
  verification:
    method: two-pointer-position-check
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-selective-character-reversal-directed-project
- id: cpp-fsf-string-020
  topicId: cpp-strings-formatting
  skills:
  - find-longest-palindromic-substring
  - expand-around-centers
  archetype: longest-palindrome-interval
  difficulty: hard
  reasoningDepth: 4
  difficultyEvidence: Requires considering both odd and even centers and distinguishing a contiguous substring from
    a rearrangeable multiset.
  assessmentUses:
  - worked-example
  questionType: code
  prompt: |
    Implement `std::size_t longest_palindromic_substring_length(std::string_view
    text)`. Comparison is case-sensitive. Return the length of the longest
    contiguous palindromic substring, or `0` for empty input. Examples:
    `adcdcdy` returns `5`, `abddddeeff` returns `4`, and `PYTHON` returns `1`.
  answer:
    functionSignature: std::size_t longest_palindromic_substring_length(std::string_view text)
    expectedCases:
    - - adcdcdy
      - 5
    - - abddddeeff
      - 4
    - - ''
      - 0
  sampleSolution: |
    #include <algorithm>
    #include <string_view>

    std::size_t longest_palindromic_substring_length(
        std::string_view text) {
        std::size_t best = 0;
        auto expand = [&](std::size_t left, std::size_t right) {
            while (right < text.size() && text[left] == text[right]) {
                best = std::max(best, right - left + 1);
                if (left == 0) break;
                --left;
                ++right;
            }
        };
        for (std::size_t center = 0; center < text.size(); ++center) {
            expand(center, center);
            if (center + 1 < text.size()) expand(center, center + 1);
        }
        return best;
    }
  explanation: |
    Every palindrome has either one central character or a gap between two
    central characters. Expanding from both center types enumerates all
    palindromic intervals in `O(n^2)` time and constant auxiliary space.
  solutionOutline: Expand around every odd and even center while endpoints match, recording the greatest interval
    length encountered.
  commonTrap: Counting character frequencies, which answers a different question about constructing a palindrome
    after rearrangement.
  verification:
    method: center-parity-and-example-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-worked-example
