    base-10 notation with a comma before each group of three digits counted
    from the right. Preserve a leading minus sign. Examples: `5000` becomes
    `5,000` and `-1234567` becomes `-1,234,567`.
  answer:
    functionSignature: std::string comma_separated(long long value)
    expectedCases:
    - - 5000
      - 5,000
    - - -1234567
      - -1,234,567
    - - 12
      - '12'
  sampleSolution: |
    #include <algorithm>
    #include <string>

    std::string comma_separated(long long value) {
        std::string digits = std::to_string(value);
        const std::size_t start = digits[0] == '-' ? 1 : 0;
        for (std::size_t pos = digits.size();
             pos > start + 3; pos -= 3) {
            digits.insert(pos - 3, 1, ',');
        }
        return digits;
    }
