  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `std::string reverse_odd_length_words(std::string text)`. A
    word is a maximal ASCII-letter run. Reverse each word with odd length and
    preserve every nonletter at its original index. For
    `The quick brown fox jumps over the lazy dog`, return
    `ehT kciuq nworb xof spmuj over eht lazy god`.
  answer:
    functionSignature: std::string reverse_odd_length_words(std::string text)
    expectedCases:
    - - Exercises Practice Solution
      - sesicrexE Practice Solution
    - - The quick brown fox jumps over the lazy dog
      - ehT kciuq nworb xof spmuj over eht lazy god
    - - ab, cde!
      - ab, edc!
  sampleSolution: |
    #include <algorithm>
    #include <cctype>
    #include <string>

    std::string reverse_odd_length_words(std::string text) {
        for (std::size_t i = 0; i < text.size();) {
            while (i < text.size() &&
                   !std::isalpha(static_cast<unsigned char>(text[i]))) ++i;
            const std::size_t start = i;
            while (i < text.size() &&
                   std::isalpha(static_cast<unsigned char>(text[i]))) ++i;
            if ((i - start) % 2 == 1) {
                std::reverse(text.begin() + start, text.begin() + i);
            }
