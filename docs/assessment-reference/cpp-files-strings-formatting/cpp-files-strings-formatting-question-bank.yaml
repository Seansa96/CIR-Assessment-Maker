- id: cpp-fsf-file-006
  topicId: cpp-working-with-files
  skills:
  - replace-whole-words-in-files
  - preserve-source-files
  archetype: boundary-aware-file-rewrite
  difficulty: hard
  reasoningDepth: 4
  difficultyEvidence: Requires whole-word boundary checks, variable-length replacement, and separate input/output
    error handling.
  assessmentUses:
  - worked-example
  questionType: code
  prompt: |
    Implement `bool replace_ascii_word(const std::filesystem::path& source,
    const std::filesystem::path& destination, std::string_view target,
    std::string_view replacement)`. Read `source`, replace every
    case-sensitive whole occurrence of `target`, and write the result to
    `destination`. A word character is an ASCII letter, digit, or underscore.
    Reject an empty target. Assume source and destination are different paths.
  answer:
    functionSignature: bool replace_ascii_word(const std::filesystem::path& source, const std::filesystem::path&
      destination, std::string_view target, std::string_view replacement)
    expectedBehavior:
    - Replacing `cat` does not alter `catalog`.
    - Adjacent punctuation forms valid word boundaries.
    - The source file remains unchanged.
  sampleSolution: |
    #include <cctype>
    #include <filesystem>
    #include <fstream>
    #include <iterator>
    #include <string>
    #include <string_view>

    bool replace_ascii_word(const std::filesystem::path& source,
                            const std::filesystem::path& destination,
                            std::string_view target,
                            std::string_view replacement) {
        if (target.empty()) return false;
        std::ifstream input(source, std::ios::binary);
        if (!input) return false;
        std::string text((std::istreambuf_iterator<char>(input)),
                         std::istreambuf_iterator<char>());
        if (input.bad()) return false;

        auto word = [](char ch) {
            const auto u = static_cast<unsigned char>(ch);
            return std::isalnum(u) || ch == '_';
        };
        std::string result;
        result.reserve(text.size());
        for (std::size_t i = 0; i < text.size();) {
            const bool match =
                i + target.size() <= text.size() &&
                text.compare(i, target.size(), target) == 0;
            const bool left_ok = i == 0 || !word(text[i - 1]);
            const bool right_ok =
                match && (i + target.size() == text.size() ||
                          !word(text[i + target.size()]));
            if (match && left_ok && right_ok) {
                result.append(replacement);
                i += target.size();
            } else {
                result.push_back(text[i++]);
            }
        }

        std::ofstream output(destination,
                             std::ios::binary | std::ios::trunc);
        if (!output) return false;
        output.write(result.data(),
                     static_cast<std::streamsize>(result.size()));
        output.flush();
        return static_cast<bool>(output);
    }
  explanation: |
    A textual match is accepted only when neither neighboring byte is a word
    character. Building a separate result supports replacements of different
    lengths, and writing to another path avoids corrupting the source if
    output fails.
  solutionOutline: Read the source, scan for target matches with valid word boundaries, build the replacement text,
    and write it to a distinct destination.
  commonTrap: Replacing every substring match, which changes `cat` inside `catalog` despite the whole-word requirement.
  verification:
    method: boundary-fixture-and-output-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-working-with-files-worked-example
