  - handle-empty-input
  archetype: uniform-case-validation
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires accepting either of two all-character predicates while rejecting nonletters.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `bool has_uniform_letter_case(std::string_view text)`. Return
    true only when the input is nonempty, contains ASCII letters only, and
    every letter is uppercase or every letter is lowercase. Mixed case,
    digits, punctuation, and empty input return false.
  answer:
    functionSignature: bool has_uniform_letter_case(std::string_view text)
    expectedCases:
    - - ABCDEF
      - true
    - - abcdef
      - true
    - - Abc
      - false
    - - ABC1
      - false
  sampleSolution: |
    #include <cctype>
    #include <string_view>

    bool has_uniform_letter_case(std::string_view text) {
        if (text.empty()) return false;
        bool all_upper = true;
        bool all_lower = true;
        for (char ch : text) {
            const auto u = static_cast<unsigned char>(ch);
            if (!std::isalpha(u)) return false;
            all_upper = all_upper && std::isupper(u);
            all_lower = all_lower && std::islower(u);
        }
        return all_upper || all_lower;
    }
  explanation: |
    Two running predicates represent the only acceptable alternatives.
    Rejecting nonletters explicitly prevents vacuous classification of
    punctuation, and the initial empty check defines that edge case.
  solutionOutline: Require letters throughout while accumulating all-uppercase and all-lowercase predicates, then
    accept either complete predicate.
