  questionType: code
  prompt: |
    Implement `std::optional<std::string> first_vowels(std::string_view text,
    std::size_t count)`. Extract the first `count` ASCII vowels,
    case-insensitively, preserving their original case. Return `nullopt` when
    fewer than `count` vowels exist. A count of zero returns an empty string.
  answer:
    functionSignature: std::optional<std::string> first_vowels(std::string_view text, std::size_t count)
    expectedCases:
    - - Education
      - 4
      - Euai
    - - sky
      - 1
      - null
    - - abc
      - 0
      - ''
  sampleSolution: |
    #include <cctype>
    #include <optional>
    #include <string>
    #include <string_view>

    std::optional<std::string> first_vowels(std::string_view text,
                                            std::size_t count) {
        std::string result;
        result.reserve(count);
        for (char ch : text) {
            const char lower = static_cast<char>(
                std::tolower(static_cast<unsigned char>(ch)));
            if (std::string_view{"aeiou"}.find(lower) !=
                std::string_view::npos) {
                result.push_back(ch);
                if (result.size() == count) return result;
