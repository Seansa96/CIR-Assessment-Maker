  - test
  questionType: code
  prompt: |
    Implement `bool can_construct_from(std::string_view available,
    std::string_view requested)`. Each case-sensitive byte from `available`
    may be used at most once. Return whether all bytes of `requested` can be
    supplied. Examples: `("CPP", "Cpp")` is false, `("Java", "Ja")` is
    true, and `("Check first string", "sifC")` is true.
  answer:
    functionSignature: bool can_construct_from(std::string_view available, std::string_view requested)
    expectedCases:
    - - CPP
      - Cpp
      - false
    - - Java
      - Ja
      - true
    - - a
      - aa
      - false
  sampleSolution: |
    #include <array>
    #include <string_view>

    bool can_construct_from(std::string_view available,
                            std::string_view requested) {
        std::array<std::size_t, 256> counts{};
        for (unsigned char ch : available) ++counts[ch];
        for (unsigned char ch : requested) {
            if (counts[ch] == 0) return false;
            --counts[ch];
        }
        return true;
    }
  explanation: |
    The frequency table models a consumable inventory. Every requested byte
    decrements one available copy; reaching zero before a request proves that
    multiplicity cannot be satisfied.
  solutionOutline: Count available bytes, consume one count per requested byte, and fail at the first exhausted
    value.
  commonTrap: Using a set, which would incorrectly allow one available `a` to satisfy multiple requested `a` characters.
