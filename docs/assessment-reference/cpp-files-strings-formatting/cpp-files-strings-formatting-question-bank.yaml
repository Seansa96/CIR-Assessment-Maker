  questionType: code
  prompt: |
    Implement `std::string remove_special_characters(std::string_view text)`.
    Keep ASCII letters, decimal digits, and whitespace exactly as supplied;
    remove every other byte. Thus `abcd $ js# @acde$` becomes
    `abcd  js acde` with the original spaces preserved.
  answer:
    functionSignature: std::string remove_special_characters(std::string_view text)
    expectedCases:
    - - abcd $ js# @acde$
      - abcd  js acde
    - - C++17
      - C17
  sampleSolution: |
    #include <cctype>
    #include <string>
    #include <string_view>

    std::string remove_special_characters(std::string_view text) {
        std::string result;
        result.reserve(text.size());
        for (char ch : text) {
            const auto u = static_cast<unsigned char>(ch);
            if (std::isalnum(u) || std::isspace(u)) result.push_back(ch);
        }
        return result;
