  primaryAssessmentId: cpp-strings-formatting-test
- id: cpp-fsf-string-032
  topicId: cpp-strings-formatting
  skills:
  - transform-words-by-length
  - preserve-space-layout
  archetype: conditional-word-reversal
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires locating word intervals, applying a length threshold, and preserving all spaces.
  assessmentUses:
  - directed-project
  questionType: code
  prompt: |
    Implement `std::string reverse_words_at_least_three(std::string text)`.
    Input contains ASCII letters and spaces only. Reverse each maximal word
    whose length is at least three, in place; preserve every space. For
    `The quick brown fox jumps over the lazy dog`, return
    `ehT kciuq nworb xof spmuj revo eht yzal god`.
  answer:
    functionSignature: std::string reverse_words_at_least_three(std::string text)
    expectedCases:
    - - The quick brown fox jumps over the lazy dog
      - ehT kciuq nworb xof spmuj revo eht yzal god
    - - an ox
      - an ox
    - - '  abc  de '
      - '  cba  de '
  sampleSolution: |
    #include <algorithm>
    #include <string>

    std::string reverse_words_at_least_three(std::string text) {
        for (std::size_t start = 0; start < text.size();) {
            if (text[start] == ' ') {
                ++start;
                continue;
            }
            std::size_t end = text.find(' ', start);
            if (end == std::string::npos) end = text.size();
            if (end - start >= 3) {
                std::reverse(text.begin() + start, text.begin() + end);
            }
            start = end;
        }
        return text;
    }
  explanation: |
    Each word is represented by a half-open interval `[start, end)`.
    Reversing inside the original string leaves delimiters exactly where they
    were, including repeated and trailing spaces.
  solutionOutline: Find each non-space interval, reverse it when its length meets the threshold, and leave separator
    positions untouched.
  commonTrap: Rebuilding with stream extraction, which collapses repeated spaces and loses the original layout.
  verification:
    method: interval-and-spacing-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-length-based-word-transformer-directed-project
