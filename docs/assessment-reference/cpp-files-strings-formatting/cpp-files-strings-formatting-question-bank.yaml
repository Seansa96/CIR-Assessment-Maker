    #include <cctype>
    #include <filesystem>
    #include <fstream>
    #include <optional>

    std::optional<std::size_t> count_file_words(
        const std::filesystem::path& path) {
        std::ifstream input(path, std::ios::binary);
        if (!input) return std::nullopt;
        std::size_t count = 0;
        bool in_word = false;
        char ch;
        while (input.get(ch)) {
