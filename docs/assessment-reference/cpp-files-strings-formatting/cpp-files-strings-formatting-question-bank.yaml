- id: cpp-fsf-string-001
  topicId: cpp-strings-formatting
  skills:
  - reverse-string-content
  - use-standard-algorithms
  archetype: whole-string-reversal
  difficulty: foundation
  reasoningDepth: 1
  difficultyEvidence: Requires selecting a reversal operation while preserving every byte.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `std::string reverse_string(std::string text)`.
    Return every character in reverse order. Empty strings and punctuation are
    valid input. Example: `w3resource` becomes `ecruoser3w`.
  answer:
    functionSignature: std::string reverse_string(std::string text)
    expectedCases:
    - - w3resource
      - ecruoser3w
    - - ''
      - ''
    - - a b!
      - '!b a'
  sampleSolution: |
    #include <algorithm>
    #include <string>

    std::string reverse_string(std::string text) {
        std::reverse(text.begin(), text.end());
        return text;
    }
  explanation: |
    `std::reverse` swaps the first and last characters, then moves inward
    until the range is exhausted. It works in place, takes linear time, and
    uses constant auxiliary space.
  solutionOutline: Reverse the complete half-open range `[begin, end)` and return the mutated copy.
  commonTrap: Stopping at `size() - 1` as though the standard range endpoint were inclusive.
  verification:
    method: compile-and-edge-case-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-002
  topicId: cpp-strings-formatting
  skills:
  - transform-ascii-letters
  - preserve-nonletters
  archetype: alphabet-successor-transform
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires wraparound for both cases while leaving digits and punctuation unchanged.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `std::string next_ascii_letters(std::string text)`. Replace
    each ASCII letter by its alphabetic successor, wrapping `z` to `a` and
    `Z` to `A`. Preserve all nonletters. Example: `w3resource` becomes
    `x3sftpvsdf`.
  answer:
    functionSignature: std::string next_ascii_letters(std::string text)
    expectedCases:
    - - w3resource
      - x3sftpvsdf
    - - Zaz-9
      - Aba-9
  sampleSolution: |
    #include <string>

    std::string next_ascii_letters(std::string text) {
        for (char& ch : text) {
            if (ch == 'z') ch = 'a';
            else if (ch == 'Z') ch = 'A';
            else if ((ch >= 'a' && ch < 'z') ||
                     (ch >= 'A' && ch < 'Z')) {
                ++ch;
            }
        }
        return text;
    }
  explanation: |
    The explicit ASCII ranges make the alphabet and wrap rule unambiguous.
    Digits are never passed through arithmetic intended for letters, so the
    `3` in the example remains unchanged.
  solutionOutline: Handle the two wraparound letters first, increment other ASCII letters, and skip every other
    character.
  commonTrap: Incrementing `z` directly, which produces `{` in ASCII instead of wrapping to `a`.
  verification:
    method: boundary-case-table
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-003
  topicId: cpp-strings-formatting
  skills:
  - capitalize-word-initials
  - track-token-boundaries
  archetype: word-boundary-case-conversion
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires detecting the first letter and every letter following a space.
  assessmentUses:
  - directed-project
  questionType: code
  prompt: |
    Implement `std::string capitalize_words(std::string text)` for
    ASCII text whose words are separated by one space. Capitalize the first
    character of each nonempty word and preserve the remaining characters.
    Example: `cpp string exercises` becomes `Cpp String Exercises`.
  answer:
    functionSignature: std::string capitalize_words(std::string text)
    expectedCases:
    - - cpp string exercises
      - Cpp String Exercises
    - - already Done
      - Already Done
  sampleSolution: |
    #include <cctype>
    #include <string>

    std::string capitalize_words(std::string text) {
        bool at_start = true;
        for (char& ch : text) {
            if (ch == ' ') {
                at_start = true;
            } else if (at_start) {
                ch = static_cast<char>(
                    std::toupper(static_cast<unsigned char>(ch)));
                at_start = false;
            }
        }
        return text;
    }
  explanation: |
    `at_start` is true exactly when the next non-space character begins a
    word. Casting to `unsigned char` before `std::toupper` avoids undefined
    behavior for negative `char` values.
  solutionOutline: Maintain a word-start flag, reset it at spaces, and uppercase the next non-space byte safely.
  commonTrap: Uppercasing `text[i + 1]` after every space without checking that the index exists.
  verification:
    method: state-invariant-trace
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-word-capitalization-directed-project
- id: cpp-fsf-string-004
  topicId: cpp-strings-formatting
  skills:
  - tokenize-words
  - select-longest-token
  archetype: longest-word-selection
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires a word definition and a deterministic first-longest tie rule.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `std::string longest_word(std::string_view text)`. A word is a
    maximal run of ASCII letters. Return the first longest word, or an empty
    string when no word exists. In `C++ is a general-purpose programming
    language.`, return `programming`.
  answer:
    functionSignature: std::string longest_word(std::string_view text)
    expectedCases:
    - - C++ is a general-purpose programming language.
      - programming
    - - one two
      - one
    - - 123!
      - ''
  sampleSolution: |
    #include <cctype>
    #include <string>
    #include <string_view>

    std::string longest_word(std::string_view text) {
        std::string best;
        for (std::size_t i = 0; i < text.size();) {
            while (i < text.size() &&
                   !std::isalpha(static_cast<unsigned char>(text[i]))) ++i;
            const std::size_t start = i;
            while (i < text.size() &&
                   std::isalpha(static_cast<unsigned char>(text[i]))) ++i;
            if (i - start > best.size()) {
                best = std::string(text.substr(start, i - start));
            }
        }
        return best;
    }
  explanation: |
    The scan alternates between skipping delimiters and consuming one maximal
    letter run. Using `>` rather than `>=` preserves the first word when two
    words share the maximum length.
  solutionOutline: Identify each maximal alphabetic interval and replace the saved word only when the new interval
    is strictly longer.
  commonTrap: Treating punctuation as part of a word, which would return `language.` with the period attached.
  verification:
    method: token-boundary-and-tie-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-test
- id: cpp-fsf-string-005
  topicId: cpp-strings-formatting
  skills:
  - sort-string-characters
  - reason-about-ascii-order
  archetype: character-sorting
  difficulty: foundation
  reasoningDepth: 1
  difficultyEvidence: Requires sorting a letter-only input into ascending byte order.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `std::string sort_letters(std::string text)`. The input contains
    only lowercase ASCII letters. Return the letters in ascending order.
    Example: `python` becomes `hnopty`.
  answer:
    functionSignature: std::string sort_letters(std::string text)
    expectedCases:
    - - python
      - hnopty
    - - baba
      - aabb
    - - ''
      - ''
  sampleSolution: |
    #include <algorithm>
    #include <string>

    std::string sort_letters(std::string text) {
        std::sort(text.begin(), text.end());
        return text;
    }
  explanation: |
    For lowercase ASCII input, the ordinary character ordering is alphabetic.
    `std::sort` runs in `O(n log n)` time and rearranges the owned copy.
  solutionOutline: Sort the full mutable string range with the standard comparison and return it.
  commonTrap: Claiming linear time without using a fixed-alphabet counting sort.
  verification:
    method: sorted-output-check
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-006
  topicId: cpp-strings-formatting
  skills:
  - scan-fixed-distance-patterns
  - avoid-index-underflow
  archetype: separated-character-detection
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires translating “two characters between” into an index distance of three.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `bool has_e_g_gap_two(std::string_view text)`. Return true when
    a lowercase `e` and lowercase `g` occur with exactly two characters
    between them, in either order. Thus their indices differ by three.
    Example: `e12g` returns true.
  answer:
    functionSignature: bool has_e_g_gap_two(std::string_view text)
    expectedCases:
    - - e12g
      - true
    - - g--e
      - true
    - - e-g
      - false
  sampleSolution: |
    #include <string_view>

    bool has_e_g_gap_two(std::string_view text) {
        for (std::size_t i = 0; i + 3 < text.size(); ++i) {
            if ((text[i] == 'e' && text[i + 3] == 'g') ||
                (text[i] == 'g' && text[i + 3] == 'e')) {
                return true;
            }
        }
        return false;
    }
  explanation: |
    Two intervening characters mean positions `i` and `i + 3`. The loop
    condition proves that `i + 3` is a valid index before it is accessed.
  solutionOutline: Compare each character with the character three positions later and accept either endpoint order.
  commonTrap: Using an offset of two, which leaves only one character between the endpoints.
  verification:
    method: index-distance-trace
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-007
  topicId: cpp-strings-formatting
  skills:
  - count-vowels
  - classify-ascii-case-insensitively
  archetype: predicate-count
  difficulty: foundation
  reasoningDepth: 1
  difficultyEvidence: Requires a case-insensitive vowel predicate and a count.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `std::size_t count_vowels(std::string_view text)`. Count ASCII
    `a`, `e`, `i`, `o`, and `u` without regard to case. Do not count `y`.
    Example: `eagerer` contains four vowels.
  answer:
    functionSignature: std::size_t count_vowels(std::string_view text)
    expectedCases:
    - - eagerer
      - 4
    - - USA
      - 3
    - - rhythm
      - 0
  sampleSolution: |
    #include <cctype>
    #include <string_view>

    std::size_t count_vowels(std::string_view text) {
        std::size_t count = 0;
        for (char ch : text) {
            const char lower = static_cast<char>(
                std::tolower(static_cast<unsigned char>(ch)));
            if (std::string_view{"aeiou"}.find(lower) !=
                std::string_view::npos) {
                ++count;
            }
        }
        return count;
    }
  explanation: |
    Normalizing each byte to lowercase reduces ten case variants to five
    comparisons. The fixed five-character lookup keeps the algorithm linear
    in the input length.
  solutionOutline: Lowercase each byte safely, test membership in `aeiou`, and increment the accumulator on matches.
  commonTrap: Forgetting uppercase vowels or accidentally treating `y` as a vowel without the prompt authorizing
    it.
  verification:
    method: predicate-case-table
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-008
  topicId: cpp-strings-formatting
  skills:
  - count-whitespace-delimited-words
  - track-token-state
  archetype: word-count-state-machine
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires handling leading, trailing, and repeated whitespace without creating empty words.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `std::size_t count_words(std::string_view text)`. A word is a
    maximal non-whitespace run, and any ASCII whitespace may separate words.
    Leading, trailing, or repeated whitespace must not create empty words.
  answer:
    functionSignature: std::size_t count_words(std::string_view text)
    expectedCases:
    - - Python
      - 1
    - - "  C++\tstreams\nwork  "
      - 3
    - - ''
      - 0
  sampleSolution: |
    #include <cctype>
    #include <string_view>

    std::size_t count_words(std::string_view text) {
        std::size_t count = 0;
        bool in_word = false;
        for (char ch : text) {
            const bool space =
                std::isspace(static_cast<unsigned char>(ch)) != 0;
            if (!space && !in_word) ++count;
            in_word = !space;
        }
        return count;
    }
  explanation: |
    A word begins only on a transition from whitespace to non-whitespace.
    Counting transitions avoids special cases for multiple separators and
    does not allocate temporary tokens.
  solutionOutline: Track whether the previous position was inside a word and count each transition into a non-whitespace
    run.
  commonTrap: Returning the number of spaces plus one, which fails for empty input and repeated spaces.
  verification:
    method: transition-state-trace
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-009
  topicId: cpp-strings-formatting
  skills:
  - compare-character-frequencies
  - parameterize-string-queries
  archetype: equal-frequency-comparison
  difficulty: foundation
  reasoningDepth: 1
  difficultyEvidence: Requires counting two specified characters under an exact case-sensitive contract.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `bool equal_occurrences(std::string_view text, char first,
    char second)`. Return whether the two case-sensitive characters occur
    equally often. Two zero counts are equal.
  answer:
    functionSignature: bool equal_occurrences(std::string_view text, char first, char second)
    expectedCases:
    - - aabcdeef
      - a
      - e
      - true
    - - banana
      - a
      - n
      - false
    - - xyz
      - a
      - b
      - true
  sampleSolution: |
    #include <algorithm>
    #include <string_view>

    bool equal_occurrences(std::string_view text, char first, char second) {
        return std::count(text.begin(), text.end(), first) ==
               std::count(text.begin(), text.end(), second);
    }
  explanation: |
    The two standard counts make the contract direct and readable. This uses
    two linear passes; a single pass with two counters is an equivalent
    optimization when scanning cost matters.
  solutionOutline: Count each requested byte across the same range and compare the two totals.
  commonTrap: Assuming the example implies fixed letters rather than accepting the two characters as parameters.
  verification:
    method: independent-count-check
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-010
  topicId: cpp-strings-formatting
  skills:
  - recognize-palindromes
  - compare-from-both-ends
  archetype: two-pointer-palindrome-test
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires a symmetric comparison that avoids unsigned-index underflow.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `bool is_palindrome(std::string_view text)`. Compare the input
    exactly as supplied: case, spaces, and punctuation all matter. The empty
    string and every one-character string are palindromes.
  answer:
    functionSignature: bool is_palindrome(std::string_view text)
    expectedCases:
    - - madam
      - true
    - - Madam
      - false
    - - ''
      - true
  sampleSolution: |
    #include <algorithm>
    #include <string_view>

    bool is_palindrome(std::string_view text) {
        return std::equal(text.begin(), text.begin() + text.size() / 2,
                          text.rbegin());
    }
  explanation: |
    Only the first half must be compared with characters read from the end.
    `std::equal` avoids manually decrementing an unsigned index past zero and
    performs at most half as many comparisons as constructing a reversal.
  solutionOutline: Compare the first half of the forward range with the reverse range and require every paired byte
    to match.
  commonTrap: Silently discarding punctuation or changing case even though the contract requests an exact comparison.
  verification:
    method: symmetry-and-empty-case-review
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-011
  topicId: cpp-strings-formatting
  skills:
  - measure-repeated-letters
  - select-word-with-ties
  archetype: frequency-scored-word-selection
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires tokenizing words, building a per-word frequency table, and applying a defined score
    and tie rule.
  assessmentUses:
  - guided-project
  questionType: code
  prompt: |
    Implement `std::string word_with_most_repetition(std::string_view text)`.
    A word is a maximal ASCII-letter run. Score a word by the number of
    distinct letters whose case-insensitive frequency is at least two.
    Return the first word with the greatest positive score, or an empty
    string when no word repeats a letter. For `Print a welcome text in a
    separate line.`, return `separate`.
  answer:
    functionSignature: std::string word_with_most_repetition(std::string_view text)
    expectedCases:
    - - Print a welcome text in a separate line.
      - separate
    - - no repeats
      - ''
    - - letter better
      - letter
  sampleSolution: |
    #include <array>
    #include <cctype>
    #include <string>
    #include <string_view>

    std::string word_with_most_repetition(std::string_view text) {
        std::string best;
        int best_score = 0;
        for (std::size_t i = 0; i < text.size();) {
            while (i < text.size() &&
                   !std::isalpha(static_cast<unsigned char>(text[i]))) ++i;
            const std::size_t start = i;
            std::array<int, 26> counts{};
            while (i < text.size() &&
                   std::isalpha(static_cast<unsigned char>(text[i]))) {
                const char lower = static_cast<char>(
                    std::tolower(static_cast<unsigned char>(text[i++])));
                ++counts[static_cast<std::size_t>(lower - 'a')];
            }
            int score = 0;
            for (int count : counts) score += count >= 2;
            if (score > best_score) {
                best_score = score;
                best = std::string(text.substr(start, i - start));
            }
        }
        return best;
    }
  explanation: |
    The original phrase “most repeated letters” is ambiguous, so the bank
    defines a score: count distinct letters that repeat. A fresh 26-slot
    table isolates each word, and strict improvement preserves the first tie.
  solutionOutline: Parse each letter run, score its repeated case-insensitive letters, and retain the first word
    that sets a new positive maximum.
  commonTrap: Carrying letter counts from one word into the next or counting total word length as repetition.
  verification:
    method: score-definition-and-example-trace
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-text-quality-analyzer-guided-project
- id: cpp-fsf-string-012
  topicId: cpp-strings-formatting
  skills:
  - insert-delimiters-conditionally
  - classify-digit-parity
  archetype: adjacent-digit-rewrite
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires checking adjacent original digits before appending a separator.
  assessmentUses:
  - directed-project
  questionType: code
  prompt: |
    Implement `std::string dash_between_odd_digits(std::string_view digits)`.
    The input contains decimal digits only. Insert `-` between adjacent odd
    digits and nowhere else. Example: `1345789` becomes `1-345-789`.
  answer:
    functionSignature: std::string dash_between_odd_digits(std::string_view digits)
    expectedCases:
    - - '1345789'
      - 1-345-789
    - - '135'
      - 1-3-5
    - - '246'
      - '246'
  sampleSolution: |
    #include <string>
    #include <string_view>

    std::string dash_between_odd_digits(std::string_view digits) {
        std::string result;
        result.reserve(digits.size() * 2);
        for (std::size_t i = 0; i < digits.size(); ++i) {
            if (i > 0 && ((digits[i - 1] - '0') % 2 != 0) &&
                ((digits[i] - '0') % 2 != 0)) {
                result.push_back('-');
            }
            result.push_back(digits[i]);
        }
        return result;
    }
  explanation: |
    Each separator belongs immediately before the current digit when both it
    and the previous input digit are odd. Building a new string avoids
    invalidating indices through repeated middle insertions.
  solutionOutline: Walk the original digits once, append a dash before an odd digit whose predecessor is also odd,
    then append the digit.
  commonTrap: Testing the previously appended output character, which may be a dash rather than the preceding input
    digit.
  verification:
    method: adjacency-case-enumeration
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-conditional-digit-rewriter-directed-project
- id: cpp-fsf-string-013
  topicId: cpp-strings-formatting
  skills:
  - toggle-letter-case
  - use-cctype-safely
  archetype: case-inversion
  difficulty: foundation
  reasoningDepth: 1
  difficultyEvidence: Requires applying the complementary case conversion only to letters.
  assessmentUses:
  - quiz
  questionType: code
  prompt: |
    Implement `std::string toggle_ascii_case(std::string text)`. Convert each
    lowercase ASCII letter to uppercase and each uppercase ASCII letter to
    lowercase. Preserve all other characters. Example: `Pythpn` becomes
    `pYTHPN`.
  answer:
    functionSignature: std::string toggle_ascii_case(std::string text)
    expectedCases:
    - - Pythpn
      - pYTHPN
    - - C++17
      - c++17
  sampleSolution: |
    #include <cctype>
    #include <string>

    std::string toggle_ascii_case(std::string text) {
        for (char& ch : text) {
            const auto u = static_cast<unsigned char>(ch);
            if (std::islower(u)) {
                ch = static_cast<char>(std::toupper(u));
            } else if (std::isupper(u)) {
                ch = static_cast<char>(std::tolower(u));
            }
        }
        return text;
    }
  explanation: |
    The mutually exclusive tests ensure a lowercase letter is not converted
    and then immediately converted back. Nonletters take neither branch.
  solutionOutline: Classify each byte once and replace it with the opposite case only when it is alphabetic.
  commonTrap: Using two independent `if` statements, allowing a newly uppercased letter to be lowercased again.
  verification:
    method: upper-lower-nonletter-table
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-strings-formatting-quiz
- id: cpp-fsf-string-014
  topicId: cpp-strings-formatting
  skills:
  - parse-embedded-integers
  - accumulate-numeric-runs
  archetype: digit-run-parsing
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires grouping adjacent digits into whole numbers, handling boundaries, and preventing
    accidental digit-by-digit addition.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `long long sum_embedded_nonnegative_integers(std::string_view
    text)`. Treat each maximal ASCII-digit run as one base-10 non-negative
    integer and return their sum. Assume every run and the total fit in
    `long long`. Example: `w3resource from 2008` returns `2011`.
  answer:
    functionSignature: long long sum_embedded_nonnegative_integers(std::string_view text)
    expectedCases:
    - - w3resource from 2008
      - 2011
    - - 12 apples, 30 pears
      - 42
    - - none
      - 0
  sampleSolution: |
    #include <cctype>
    #include <string_view>

    long long sum_embedded_nonnegative_integers(std::string_view text) {
        long long sum = 0;
        long long current = 0;
        bool reading = false;
        for (char ch : text) {
            if (std::isdigit(static_cast<unsigned char>(ch))) {
                current = current * 10 + (ch - '0');
                reading = true;
            } else if (reading) {
                sum += current;
                current = 0;
                reading = false;
            }
        }
        if (reading) sum += current;
        return sum;
    }
  explanation: |
    Multiplying the current value by ten shifts its decimal digits before the
    next digit is added. A delimiter commits the completed run; the final
    conditional commits a number ending at the last character.
  solutionOutline: Build one decimal value while digits continue, add it when the run ends, and separately flush
    a run at end of input.
  commonTrap: Forgetting the final flush, which loses a number when the string ends with a digit.
  verification:
    method: digit-run-state-trace
