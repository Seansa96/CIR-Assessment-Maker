      - true
    - - pae
      - apple
      - false
  sampleSolution: |
    #include <string_view>

    bool is_subsequence(std::string_view candidate,
                        std::string_view text) {
        std::size_t next = 0;
        for (char ch : text) {
            if (next < candidate.size() && ch == candidate[next]) ++next;
        }
        return next == candidate.size();
    }
  explanation: |
    `next` identifies the first unmatched candidate character. A text
    character is consumed only when it advances that prefix, so matches can
    never be reordered or reused.
