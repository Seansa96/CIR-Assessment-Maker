  sampleSolution: |
    #include <array>
    #include <string_view>

    std::size_t distinct_bytes_in_both(std::string_view first,
                                       std::string_view second) {
        std::array<bool, 256> seen{};
        for (unsigned char ch : first) seen[ch] = true;
        for (unsigned char ch : second) seen[ch] = true;
        std::size_t count = 0;
        for (bool present : seen) count += present;
