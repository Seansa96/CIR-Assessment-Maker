  questionType: code
  prompt: |
    Implement `std::size_t distinct_bytes_in_both(std::string_view first,
    std::string_view second)`. Return the number of distinct byte values in
    the union of both strings. Matching is case-sensitive and includes
    spaces and punctuation. For `Python` and `Java`, return `9`.
