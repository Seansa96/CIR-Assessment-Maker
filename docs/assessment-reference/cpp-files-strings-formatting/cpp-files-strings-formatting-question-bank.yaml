- id: cpp-fsf-string-026
  topicId: cpp-strings-formatting
  skills:
  - validate-title-case
  - parse-letter-words
  archetype: all-words-case-validation
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires defining words around punctuation and checking both the initial and remaining letters.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `bool is_title_cased(std::string_view text)`. A word is a
    maximal run of ASCII letters. At least one word must exist. Each word
    must begin with an uppercase letter and all of its remaining letters
    must be lowercase; nonletters delimit words and are otherwise ignored.
    `The Quick Brown Fox.` returns true.
  answer:
    functionSignature: bool is_title_cased(std::string_view text)
    expectedCases:
    - - The Quick Brown Fox.
      - true
    - - The quick Brown Fox.
      - false
    - - '123'
      - false
  sampleSolution: |
    #include <cctype>
    #include <string_view>

    bool is_title_cased(std::string_view text) {
        bool at_start = true;
        bool saw_word = false;
        for (char ch : text) {
            const auto u = static_cast<unsigned char>(ch);
            if (!std::isalpha(u)) {
                at_start = true;
            } else if (at_start) {
                if (!std::isupper(u)) return false;
                at_start = false;
                saw_word = true;
            } else if (!std::islower(u)) {
                return false;
            }
        }
        return saw_word;
    }
  explanation: |
    A nonletter ends the current word. The first following letter must be
    uppercase, while later letters in the same run must be lowercase. The
    separate `saw_word` flag prevents punctuation-only input from passing.
  solutionOutline: Treat nonletters as boundaries, enforce uppercase at each new letter run and lowercase afterward,
