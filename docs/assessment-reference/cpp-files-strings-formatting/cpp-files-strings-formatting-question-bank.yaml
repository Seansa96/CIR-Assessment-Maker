    #include <cctype>
    #include <string>
    #include <string_view>

    std::string select_where_first_is_lower(std::string_view mask,
                                            std::string_view values) {
        std::string result;
        const std::size_t length = std::min(mask.size(), values.size());
        for (std::size_t i = 0; i < length; ++i) {
