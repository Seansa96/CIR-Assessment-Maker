  prompt: |
    Implement `bool is_subsequence(std::string_view candidate,
    std::string_view text)`. Return whether every character of `candidate`
    appears in `text` in the same order, not necessarily contiguously.
    Matching is case-sensitive, and the empty string is a subsequence of
    every string.
  answer:
    functionSignature: bool is_subsequence(std::string_view candidate, std::string_view text)
    expectedCases:
    - - apl
      - apple
      - true
    - - ppe
