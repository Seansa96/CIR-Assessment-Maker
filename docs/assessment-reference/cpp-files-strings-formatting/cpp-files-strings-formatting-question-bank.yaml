    bool merge_file_bytes(
        const std::vector<std::filesystem::path>& sources,
        const std::filesystem::path& destination) {
        std::ofstream output(destination,
                             std::ios::binary | std::ios::trunc);
        if (!output) return false;
        for (const auto& source : sources) {
            std::ifstream input(source, std::ios::binary);
            if (!input) return false;
            output << input.rdbuf();
            if (input.bad() || !output) return false;
        }
        output.flush();
        return static_cast<bool>(output);
    }
  explanation: |
    Opening and streaming one source at a time keeps memory usage bounded by
    stream buffers. Because the contract is concatenation, the last byte of
    one source is immediately followed by the first byte of the next.
  solutionOutline: Open the destination once, stream each binary source buffer in caller order, check both streams
    after every copy, and flush at the end.
  commonTrap: Adding a newline between inputs, which corrupts a byte-exact concatenation and may create duplicate
    blank lines.
  verification:
    method: ordered-binary-fixture-comparison
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-document-bundle-builder-guided-project
- id: cpp-fsf-file-010
  topicId: cpp-working-with-files
  skills:
  - split-files-by-line-count
  - generate-sequential-paths
  archetype: bounded-line-chunking
  difficulty: hard
  reasoningDepth: 4
  difficultyEvidence: Requires chunk-boundary management, sequential naming, empty-input behavior, and cleanup-aware
    error reporting.
  assessmentUses:
  - guided-project
  questionType: code
  prompt: |
    Implement `std::optional<std::vector<std::filesystem::path>>
    split_file_by_lines(const std::filesystem::path& source, const
    std::filesystem::path& output_directory, std::size_t lines_per_part)`.
    Reject zero `lines_per_part`. Write groups of at most that many lines to
    `part-001.txt`, `part-002.txt`, and so on, with `\n` after every written
    line. Return created paths in order, an empty vector for an empty file,
    or `nullopt` on an I/O failure. The output directory already exists.
  answer:
    functionSignature: std::optional<std::vector<std::filesystem::path>> split_file_by_lines(const std::filesystem::path&
      source, const std::filesystem::path& output_directory, std::size_t lines_per_part)
    expectedBehavior:
    - Five lines split by two produce parts containing 2, 2, and 1 line.
    - Empty input creates no part.
    - Part numbering is zero-padded to three digits.
  sampleSolution: |
    #include <filesystem>
    #include <fstream>
    #include <iomanip>
    #include <optional>
    #include <sstream>
    #include <string>
    #include <vector>

    std::optional<std::vector<std::filesystem::path>>
    split_file_by_lines(const std::filesystem::path& source,
                        const std::filesystem::path& output_directory,
                        std::size_t lines_per_part) {
        if (lines_per_part == 0) return std::nullopt;
        std::ifstream input(source);
        if (!input) return std::nullopt;
        std::vector<std::filesystem::path> created;
        std::ofstream output;
        std::size_t in_part = 0;
        std::string line;
        while (std::getline(input, line)) {
            if (in_part == 0) {
                std::ostringstream name;
                name << "part-" << std::setw(3) << std::setfill('0')
                     << created.size() + 1 << ".txt";
                const auto path = output_directory / name.str();
                output.open(path, std::ios::trunc);
                if (!output) return std::nullopt;
                created.push_back(path);
            }
            output << line << '\n';
            if (!output) return std::nullopt;
            if (++in_part == lines_per_part) {
                output.close();
                if (!output) return std::nullopt;
                in_part = 0;
            }
        }
        if (input.bad()) return std::nullopt;
        if (output.is_open()) {
            output.close();
            if (!output) return std::nullopt;
        }
        return created;
    }
  explanation: |
    A new part opens only when a successfully read line needs one, so empty
    input creates no file. Closing each full part before the next resets the
    chunk count and makes sequential ownership explicit.
  solutionOutline: Validate the chunk size, open a numbered part on demand, write at most the requested line count,
    close completed parts, and return their paths.
  commonTrap: Creating the first output before the first successful read, which leaves an unwanted empty part for
    an empty source.
  verification:
    method: chunk-size-and-empty-source-fixtures
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-log-archive-chunker-guided-project
- id: cpp-fsf-file-011
  topicId: cpp-working-with-files
  skills:
  - search-file-lines
  - report-one-based-line-numbers
  archetype: line-oriented-substring-search
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Requires exact substring semantics and correct one-based numbering.
  assessmentUses:
  - directed-project
  questionType: code
  prompt: |
    Implement `std::optional<std::vector<std::size_t>>
    containing_line_numbers(const std::filesystem::path& path,
    std::string_view needle)`. Return the one-based number of every line
    containing the case-sensitive substring `needle`, once per matching line.
    Reject an empty needle with `nullopt`, and return `nullopt` on I/O failure.
    A successful search with no matches returns an empty vector.
  answer:
    functionSignature: std::optional<std::vector<std::size_t>> containing_line_numbers(const std::filesystem::path&
      path, std::string_view needle)
    expectedBehavior:
    - Several occurrences on one line contribute one line number.
    - No matches return an empty vector.
    - Empty needle is invalid rather than matching every line.
  sampleSolution: |
    #include <filesystem>
    #include <fstream>
    #include <optional>
    #include <string>
    #include <string_view>
    #include <vector>

    std::optional<std::vector<std::size_t>>
    containing_line_numbers(const std::filesystem::path& path,
                            std::string_view needle) {
        if (needle.empty()) return std::nullopt;
        std::ifstream input(path);
        if (!input) return std::nullopt;
        std::vector<std::size_t> matches;
        std::size_t number = 0;
        std::string line;
        while (std::getline(input, line)) {
            ++number;
            if (line.find(needle) != std::string::npos) {
                matches.push_back(number);
            }
        }
        if (input.bad()) return std::nullopt;
        return matches;
    }
  explanation: |
    The line number increments only after `getline` succeeds, aligning the
    first extracted line with number one. One `find` decision per line
    naturally records the line once regardless of its occurrence count.
  solutionOutline: Reject the empty search, scan successful lines with a one-based counter, record lines containing
    the substring, and distinguish no matches from I/O failure.
  commonTrap: Returning zero-based indices even though file-search tools conventionally display line numbers beginning
    at one.
  verification:
    method: repeated-match-and-no-match-fixtures
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-file-search-reporter-directed-project
- id: cpp-fsf-file-012
  topicId: cpp-working-with-files
  skills:
  - encrypt-files-with-caesar-shift
  - preserve-nonletters
  archetype: streamed-caesar-encryption
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires normalizing arbitrary shifts, wrapping both letter cases, and preserving every nonletter
    byte.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `bool caesar_encrypt_file(const std::filesystem::path& source,
    const std::filesystem::path& destination, int shift)`. Shift ASCII
    letters forward modulo 26, preserving case and every nonletter byte.
    Normalize any positive or negative shift. Stream from a binary source to
    a different binary destination and return false on any I/O failure.
    This is an instructional cipher, not secure encryption.
  answer:
    functionSignature: bool caesar_encrypt_file(const std::filesystem::path& source, const std::filesystem::path&
      destination, int shift)
    expectedBehavior:
    - With shift 3, `Az-z!` becomes `Dc-c!`.
    - Shift 26 leaves content unchanged.
    - Negative shifts wrap correctly.
  sampleSolution: |
    #include <filesystem>
    #include <fstream>

    bool caesar_encrypt_file(const std::filesystem::path& source,
                             const std::filesystem::path& destination,
                             int shift) {
        std::ifstream input(source, std::ios::binary);
        if (!input) return false;
        std::ofstream output(destination,
                             std::ios::binary | std::ios::trunc);
        if (!output) return false;
        const int amount = ((shift % 26) + 26) % 26;
        char ch;
        while (input.get(ch)) {
            if (ch >= 'a' && ch <= 'z') {
                ch = static_cast<char>('a' + (ch - 'a' + amount) % 26);
            } else if (ch >= 'A' && ch <= 'Z') {
                ch = static_cast<char>('A' + (ch - 'A' + amount) % 26);
            }
            output.put(ch);
            if (!output) return false;
        }
        output.flush();
        return !input.bad() && static_cast<bool>(output);
    }
  explanation: |
    Double modulo normalization maps every integer shift into `0..25`.
    Offsetting from the appropriate ASCII base applies wraparound separately
    to lowercase and uppercase letters while other bytes pass through.
  solutionOutline: Normalize the shift, transform each ASCII letter relative to its case-specific base, copy nonletters
    unchanged, and verify both streams.
  commonTrap: Applying the shift to every byte, which corrupts whitespace, punctuation, and line endings.
  verification:
    method: wraparound-and-round-trip-fixtures
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-working-with-files-test
- id: cpp-fsf-file-013
  topicId: cpp-working-with-files
  skills:
  - decrypt-caesar-files
  - invert-modular-transformations
  archetype: streamed-caesar-decryption
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires deriving the inverse modular shift rather than duplicating the encryption direction.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `bool caesar_decrypt_file(const std::filesystem::path& source,
    const std::filesystem::path& destination, int encryption_shift)`.
    Reverse the ASCII-letter Caesar transformation performed with
    `encryption_shift`, preserving case and nonletters. Normalize arbitrary
    shifts, use different source and destination paths, and report I/O
    failure with false.
  answer:
    functionSignature: bool caesar_decrypt_file(const std::filesystem::path& source, const std::filesystem::path&
      destination, int encryption_shift)
    expectedBehavior:
    - With encryption shift 3, `Dc-c!` becomes `Az-z!`.
    - Decrypting encrypted content with the same shift restores all bytes.
    - Case remains unchanged.
  sampleSolution: |
    #include <filesystem>
    #include <fstream>

    bool caesar_decrypt_file(const std::filesystem::path& source,
                             const std::filesystem::path& destination,
                             int encryption_shift) {
        std::ifstream input(source, std::ios::binary);
        if (!input) return false;
        std::ofstream output(destination,
                             std::ios::binary | std::ios::trunc);
        if (!output) return false;
        const int amount =
            ((-encryption_shift % 26) + 26) % 26;
        char ch;
        while (input.get(ch)) {
            if (ch >= 'a' && ch <= 'z') {
                ch = static_cast<char>('a' + (ch - 'a' + amount) % 26);
            } else if (ch >= 'A' && ch <= 'Z') {
                ch = static_cast<char>('A' + (ch - 'A' + amount) % 26);
            }
            output.put(ch);
            if (!output) return false;
        }
        output.flush();
        return !input.bad() && static_cast<bool>(output);
    }
  explanation: |
    Decryption is encryption by the additive inverse of the original shift
    modulo 26. Normalizing that inverse before the loop avoids negative
    remainder mistakes at `A` and `a`.
  solutionOutline: Convert the encryption shift to its modular inverse, apply the same case-preserving letter transform,
    and copy all other bytes exactly.
  commonTrap: Subtracting and using `% 26` directly in C++, where negative remainders can leave a character before
    `A` or `a`.
  verification:
    method: encrypt-decrypt-byte-round-trip
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-working-with-files-test
- id: cpp-fsf-file-014
  topicId: cpp-working-with-files
  skills:
  - parse-simple-csv-files
  - format-aligned-tables
  archetype: csv-to-fixed-width-table
  difficulty: hard
  reasoningDepth: 4
  difficultyEvidence: Requires retaining empty fields, computing column widths across rows, and separating parsing
    limitations from table formatting.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `std::optional<std::string> simple_csv_table(const
    std::filesystem::path& path)`. The file uses a deliberately limited CSV
    dialect: commas always delimit fields, quotes have no special meaning,
    and every row has the same number of fields. Preserve empty fields.
    Return a left-aligned table with two spaces between columns and no spaces
    after the final column. Pad each nonfinal field to that column's maximum
    width and end every row with `\n`. Return `nullopt` on I/O failure or
    inconsistent column counts.
  answer:
    functionSignature: std::optional<std::string> simple_csv_table(const std::filesystem::path& path)
    expectedBehavior:
    - Empty fields between adjacent commas are retained.
    - Column widths include header and data rows.
    - Quoted commas are outside this intentionally simple dialect.
  sampleSolution: |
    #include <algorithm>
    #include <filesystem>
    #include <fstream>
    #include <iomanip>
    #include <optional>
    #include <sstream>
    #include <string>
    #include <vector>

    std::optional<std::string> simple_csv_table(
        const std::filesystem::path& path) {
        std::ifstream input(path);
        if (!input) return std::nullopt;
        std::vector<std::vector<std::string>> rows;
        std::string line;
        std::size_t columns = 0;
        while (std::getline(input, line)) {
            std::vector<std::string> row;
            std::size_t start = 0;
            while (true) {
                const std::size_t comma = line.find(',', start);
                row.push_back(line.substr(
                    start, comma == std::string::npos
                               ? std::string::npos : comma - start));
                if (comma == std::string::npos) break;
                start = comma + 1;
            }
            if (rows.empty()) columns = row.size();
            if (row.size() != columns) return std::nullopt;
            rows.push_back(std::move(row));
        }
        if (input.bad()) return std::nullopt;
        if (rows.empty()) return std::string{};

        std::vector<std::size_t> widths(columns);
        for (const auto& row : rows) {
            for (std::size_t c = 0; c < columns; ++c) {
                widths[c] = std::max(widths[c], row[c].size());
            }
        }
        std::ostringstream output;
        output << std::left;
        for (const auto& row : rows) {
            for (std::size_t c = 0; c < columns; ++c) {
                if (c + 1 == columns) {
                    output << row[c];
                } else {
                    output << std::setw(
                        static_cast<int>(widths[c] + 2)) << row[c];
                }
            }
            output << '\n';
        }
        return output.str();
    }
  explanation: |
    Parsing and presentation are separate passes because widths depend on all
    rows. The manual comma scan preserves leading, trailing, and adjacent
    empty fields, while the prompt explicitly avoids pretending that this is
    a complete RFC-style CSV parser.
  solutionOutline: Parse every simple row including empty fields, validate a rectangular table, compute maximum
    widths, and render left-aligned padded columns.
  commonTrap: Using `std::getline(stream, field, ',')` without handling a trailing comma, which can lose the final
    empty field.
  verification:
    method: empty-field-and-ragged-row-fixtures
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-working-with-files-test
- id: cpp-fsf-file-015
  topicId: cpp-working-with-files
  skills:
  - average-valid-file-numbers
  - handle-invalid-tokens
  archetype: tolerant-numeric-file-aggregation
  difficulty: intermediate
  reasoningDepth: 3
  difficultyEvidence: Requires validating complete numeric tokens, excluding invalid data, and representing the
    no-data case.
  assessmentUses:
  - test
  questionType: code
  prompt: |
    Implement `std::optional<double> average_file_numbers(const
    std::filesystem::path& path)`. Read whitespace-separated tokens. Include
    a token only when `std::stod` consumes the entire token and produces a
    finite value; ignore other tokens. Return `nullopt` if the file cannot be
    read or contains no valid finite numbers. Otherwise return the arithmetic
    mean.
  answer:
    functionSignature: std::optional<double> average_file_numbers(const std::filesystem::path& path)
    expectedBehavior:
    - '`10 20 bad 30` produces 20.'
    - '`12x` is invalid rather than being accepted as 12.'
    - A file with no valid finite numbers returns nullopt.
  sampleSolution: |
    #include <cmath>
    #include <filesystem>
    #include <fstream>
    #include <optional>
    #include <stdexcept>
    #include <string>

    std::optional<double> average_file_numbers(
        const std::filesystem::path& path) {
        std::ifstream input(path);
        if (!input) return std::nullopt;
        long double sum = 0.0L;
        std::size_t count = 0;
        std::string token;
        while (input >> token) {
            try {
                std::size_t used = 0;
                const double value = std::stod(token, &used);
                if (used == token.size() && std::isfinite(value)) {
                    sum += value;
                    ++count;
                }
            } catch (const std::invalid_argument&) {
            } catch (const std::out_of_range&) {
            }
        }
        if (input.bad() || count == 0) return std::nullopt;
        return static_cast<double>(sum / count);
    }
  explanation: |
    Extracting strings first lets the function reject partially numeric
    tokens that direct numeric extraction would leave in a failed stream.
    The consumed-length and finiteness checks define valid data, while
    `optional` distinguishes no usable values from a legitimate average of
    zero.
  solutionOutline: Tokenize by whitespace, parse and fully validate each finite number, accumulate valid values,
    and return no result when I/O fails or the count is zero.
  commonTrap: Dividing by the total token count, which includes ignored invalid entries and produces the wrong mean.
  verification:
    method: valid-invalid-token-fixtures
    result: verified
  reviewStatus: verified
  primaryAssessmentId: cpp-working-with-files-test
