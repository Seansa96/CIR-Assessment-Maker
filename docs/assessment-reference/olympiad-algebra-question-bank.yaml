items:
- id: alg-amgm-01
  concept: AM-GM Inequality
  difficulty: 3
  source: AIME Adaptation
  prompt: Find the minimum value of \frac{x^2+y^2+z^2}{xyz} given x,y,z > 0 and x+y+z=1.
  answer: '9'
  solutionOutline: By AM-GM, x^2+y^2+z^2 \ge 3(xyz)^{2/3}. Also 1 = x+y+z \ge 3(xyz)^{1/3},
    so xyz \le 1/27. Wait, actually, (x+y+z)^2 = x^2+y^2+z^2 + 2(xy+yz+zx). The minimum
    is attained when x=y=z=1/3. Then sum of squares is 3(1/9)=1/3, and xyz = 1/27.
    (1/3)/(1/27) = 9.
- id: alg-vieta-01
  concept: Vieta's Formulas & Newton's Sums
  difficulty: 4
  source: AIME Adaptation
  prompt: Let r,s,t be roots of x^3 - 3x^2 + 4x - 5 = 0. Find r^2 + s^2 + t^2.
  answer: '1'
  solutionOutline: r+s+t = 3, rs+st+tr = 4. r^2+s^2+t^2 = (r+s+t)^2 - 2(rs+st+tr)
    = 9 - 8 = 1.
- id: alg-fe-01
  concept: Functional Equations
  difficulty: 5
  source: USAMO Adaptation
  prompt: 'Find all functions f: R -> R satisfying f(x+y) = f(x) + f(y) + xy for all
    x,y.'
  answer: f(x) = \frac{1}{2}x^2 + cx
  solutionOutline: Let g(x) = f(x) - x^2/2. Then g(x+y) = g(x) + g(y), which is Cauchy's
    functional equation. Assuming continuity or other mild conditions, g(x) = cx,
    so f(x) = x^2/2 + cx.
- id: alg-cauchy-01
  concept: Cauchy-Schwarz Inequality
  difficulty: 4
  source: AIME Adaptation
  prompt: Given real x,y,z such that x+2y+3z=14, find the minimum value of x^2+y^2+z^2.
  answer: '14'
  solutionOutline: By Cauchy-Schwarz, (1^2+2^2+3^2)(x^2+y^2+z^2) \ge (x+2y+3z)^2.
    14(x^2+y^2+z^2) \ge 196 -> x^2+y^2+z^2 \ge 14.
