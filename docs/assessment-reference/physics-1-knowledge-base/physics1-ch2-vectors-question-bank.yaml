- id: ch2-conc-041
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the fundamental difference between a scalar and a vector?
  answer: Scalars have only magnitude, while vectors have both magnitude and direction.
  solutionOutline: Define scalar and vector.
- id: ch2-conc-042
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Can the magnitude of a vector be negative?
  answer: No, magnitude represents length or size, which is always non-negative.
  solutionOutline: Explain magnitude properties.
- id: ch2-conc-043
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What does it mean for two vectors to be equal?
  answer: They must have the same magnitude and the same direction, regardless of
    their starting points.
  solutionOutline: Define vector equality.
- id: ch2-conc-044
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If the dot product of two non-zero vectors is zero, what can you conclude
    about the vectors?
  answer: They are perpendicular (orthogonal) to each other.
  solutionOutline: Explain dot product implication.
- id: ch2-conc-045
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If the cross product of two non-zero vectors is zero, what can you conclude?
  answer: The vectors are parallel or anti-parallel.
  solutionOutline: Explain cross product implication.
- id: ch2-conc-046
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Does the order of vector addition matter?
  answer: No, vector addition is commutative ($\vec{A} + \vec{B} = \vec{B} + \vec{A}$).
  solutionOutline: Explain vector commutativity.
- id: ch2-conc-047
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Does the order of a cross product matter?
  answer: Yes, the cross product is anti-commutative ($\vec{A} \times \vec{B} = -\vec{B}
    \times \vec{A}$).
  solutionOutline: Explain cross product anti-commutativity.
- id: ch2-conc-048
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is a unit vector?
  answer: A vector with a magnitude of 1, used purely to specify a direction.
  solutionOutline: Define unit vector.
- id: ch2-conc-049
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: How do you find the angle between two vectors using the dot product?
  answer: Use the formula $\cos\theta = (\vec{A} \cdot \vec{B}) / (AB)$.
  solutionOutline: Explain angle derivation.
- id: ch2-conc-050
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the Right-Hand Rule used for?
  answer: To determine the direction of the vector resulting from a cross product.
  solutionOutline: Explain Right-Hand Rule.
