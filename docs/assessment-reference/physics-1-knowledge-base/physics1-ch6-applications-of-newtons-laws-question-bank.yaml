- id: phys1-ch6-foundation-001
  topicId: friction
  skills:
  - max-static-friction
  archetype: max-static-friction
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Basic application of laws
  assessmentUses:
  - easy-quiz
  - hard-quiz
  - easy-test
  questionType: freeResponse
  prompt: A 5 kg block sits on a horizontal surface with a coefficient of static friction of 0.1. What is the maximum static friction force?
  answer:
    gradingMode: selfCheck
    expected: 4.9 N
  solutionOutline: Use f_s = mu * N where N = mg. f_s = 0.1 * (5 * 9.8) = 4.9 N.
  commonTrap: Forgetting to resolve vectors into components or confusing sine and cosine for incline planes.
  verification:
    method: independent-derivation
    result: verified
  reviewStatus: verified
