- id: ch1-conc-041
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the difference between a base unit and a derived unit?
  answer: Base units are fundamental (e.g., meter, second). Derived units are algebraic
    combinations of base units (e.g., m/s).
  solutionOutline: Define base and derived units.
- id: ch1-conc-042
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Why is it important to use standard units in physics?
  answer: Standard units ensure consistency and accurate communication of measurements
    globally.
  solutionOutline: Explain standardization.
- id: ch1-conc-043
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Can dimensional analysis tell you if an equation is definitively correct?
  answer: No. It can only tell if an equation is dimensionally consistent. It cannot
    verify dimensionless constants (like 1/2).
  solutionOutline: Explain limitations of dimensional analysis.
- id: ch1-conc-044
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is a Fermi estimate?
  answer: A rough order-of-magnitude approximation based on reasonable assumptions
    for a hard-to-measure quantity.
  solutionOutline: Define Fermi estimate.
- id: ch1-conc-045
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Does increasing the number of decimal places always increase the number
    of significant figures?
  answer: No. Leading zeros (e.g., 0.005) are not significant, even though there are
    more decimal places.
  solutionOutline: Explain significant figure rules for zeros.
- id: ch1-conc-046
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the difference between accuracy and precision?
  answer: Accuracy is how close a measurement is to the true value; precision is how
    close repeated measurements are to each other.
  solutionOutline: Compare accuracy and precision.
- id: ch1-conc-047
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What are the SI base units for mass, length, and time?
  answer: Kilogram (kg), meter (m), and second (s).
  solutionOutline: List SI base units.
- id: ch1-conc-048
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Why do physicists use scientific notation?
  answer: To easily represent very large or very small numbers and clearly indicate
    significant figures.
  solutionOutline: Explain scientific notation purpose.
- id: ch1-conc-049
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If an equation is dimensionally inconsistent, can it be physically correct?
  answer: No. Dimensional consistency is a necessary condition for physical correctness.
  solutionOutline: Explain dimensional consistency.
- id: ch1-conc-050
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: How does order of magnitude help in physics?
  answer: It allows physicists to quickly estimate the scale of a value and check
    if detailed calculations make physical sense.
  solutionOutline: Explain order of magnitude utility.
