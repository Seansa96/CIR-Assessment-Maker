- id: ch1-proc-001
  concept: Unit Conversion
  difficulty: 2
  source: Generated
  prompt: Convert 10 km/h to m/s.
  answer: 2.78 m/s
  solutionOutline: Divide by 3.6 (since 1 km = 1000 m and 1 h = 3600 s).
- id: ch1-proc-002
  concept: Dimensional Analysis
  difficulty: 2
  source: Generated
  prompt: What are the dimensions of kinetic energy ($\frac{1}{2}mv^2$)?
  answer: $ML^2/T^2$
  solutionOutline: Mass is M. Velocity is L/T, so velocity squared is $L^2/T^2$. Multiply
    to get $ML^2/T^2$.
