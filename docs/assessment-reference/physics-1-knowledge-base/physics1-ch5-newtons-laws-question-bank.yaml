    gradingMode: selfCheck
    expected: 5.0 m/s^2
  solutionOutline: 'Use Newton''s second law: a = F / m = 10 / 2 = 5.0 m/s^2.'
  commonTrap: Ignoring direction of vectors or misidentifying action-reaction pairs.
  verification:
    method: independent-derivation
    result: verified
  reviewStatus: verified
