- id: ch5-conc-041
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What does Newton's First Law state?
  answer: An object at rest stays at rest, and an object in motion stays in motion
    with constant velocity unless acted upon by a net external force.
  solutionOutline: State Newton's First Law.
- id: ch5-conc-042
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is inertia?
  answer: The tendency of an object to resist changes to its state of motion. Mass
    is a quantitative measure of inertia.
  solutionOutline: Define inertia.
- id: ch5-conc-043
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the difference between mass and weight?
  answer: Mass is an intrinsic property measuring inertia; weight is the gravitational
    force acting on an object.
  solutionOutline: Compare mass and weight.
- id: ch5-conc-044
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Do action and reaction pairs in Newton's Third Law act on the same object?
  answer: No, they act on two different interacting objects.
  solutionOutline: Explain Third Law forces.
- id: ch5-conc-045
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If an elevator is moving upward at a constant velocity, is the tension in
    the cable greater than, equal to, or less than the weight?
  answer: Equal to. Constant velocity means zero acceleration, so net force is zero.
  solutionOutline: Analyze elevator forces.
- id: ch5-conc-046
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is a normal force?
  answer: A contact force exerted by a surface on an object, acting perpendicular
    to the surface.
  solutionOutline: Define normal force.
- id: ch5-conc-047
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the purpose of a Free-Body Diagram?
  answer: To isolate an object and visualize all external forces acting upon it to
    easily apply Newton's Second Law.
  solutionOutline: Explain Free-Body Diagram purpose.
- id: ch5-conc-048
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If a horse pulls a cart, by Newton's 3rd Law the cart pulls the horse backward
    equally. How does the horse move forward?
  answer: The horse pushes backward on the ground, and the ground pushes forward on
    the horse. The force from the ground must exceed the backward pull of the cart.
  solutionOutline: Analyze horse-cart paradox.
- id: ch5-conc-049
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Can an object be in equilibrium if only one force acts upon it?
  answer: No. Equilibrium requires the net force to be zero, which is impossible with
    a single non-zero force.
  solutionOutline: Analyze equilibrium.
- id: ch5-conc-050
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: In what type of reference frame is Newton's First Law valid?
  answer: An inertial reference frame (a frame that is not accelerating).
  solutionOutline: Define inertial frame.
