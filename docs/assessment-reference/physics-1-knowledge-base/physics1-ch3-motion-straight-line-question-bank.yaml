- id: ch3-conc-041
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the difference between displacement and distance?
  answer: Displacement is the vector change in position (straight line from start
    to finish), while distance is the scalar total path length traveled.
  solutionOutline: Compare displacement and distance.
- id: ch3-conc-042
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Can an object have a negative acceleration but be speeding up?
  answer: Yes, if its velocity is also negative (moving in the negative direction).
  solutionOutline: Explain acceleration direction.
- id: ch3-conc-043
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What does the slope of a position-time graph represent?
  answer: Instantaneous velocity.
  solutionOutline: Explain position-time slope.
- id: ch3-conc-044
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What does the area under a velocity-time graph represent?
  answer: Displacement.
  solutionOutline: Explain velocity-time area.
- id: ch3-conc-045
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If an object is thrown straight up, what is its velocity and acceleration
    at the highest point?
  answer: Velocity is zero; acceleration is 9.8 m/s^2 downwards.
  solutionOutline: Analyze peak of trajectory.
- id: ch3-conc-046
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Is it possible to have zero velocity and non-zero acceleration?
  answer: Yes, such as an object at the very top of its trajectory when thrown upwards.
  solutionOutline: Analyze v=0, a!=0.
- id: ch3-conc-047
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the difference between average and instantaneous velocity?
  answer: Average velocity is over a time interval; instantaneous is at a specific
    moment in time.
  solutionOutline: Compare average and instantaneous velocity.
- id: ch3-conc-048
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: In free fall, does the mass of an object affect its acceleration?
  answer: No, all objects in free fall (ignoring air resistance) experience the same
    acceleration due to gravity.
  solutionOutline: Explain mass independence in free fall.
- id: ch3-conc-049
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What does a straight, non-horizontal line on a velocity-time graph indicate?
  answer: Constant, non-zero acceleration.
  solutionOutline: Analyze velocity-time graph.
- id: ch3-conc-050
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If instantaneous speed is constant, must the instantaneous velocity be constant?
  answer: No, the direction could be changing (e.g., circular motion), which changes
    velocity.
  solutionOutline: Differentiate speed and velocity.
