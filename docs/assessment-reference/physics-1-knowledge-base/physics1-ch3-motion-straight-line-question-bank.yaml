items:
- id: ch3-proc-001
  concept: Kinematics
  difficulty: 3
  source: Generated
  prompt: An object starts with $v_0 = 10$ m/s and accelerates at $a = 3$ m/s$^2$.
    Find the displacement after $t = 9$ s.
  answer: 211.5 m
  solutionOutline: Use $\Delta x = v_0 t + \frac{1}{2}at^2$.
- id: ch3-proc-002
  concept: Free Fall
  difficulty: 3
  source: Generated
  prompt: An object is dropped from rest from a height of 26 m. How long does it take
    to hit the ground? (Use $g=9.8$ m/s$^2$)
  answer: 2.3 s
  solutionOutline: Use $y = \frac{1}{2}gt^2$ and solve for $t$.
