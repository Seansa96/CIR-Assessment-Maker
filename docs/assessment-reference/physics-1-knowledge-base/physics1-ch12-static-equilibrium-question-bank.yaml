- id: phys1-ch12-foundation-001
  topicId: translational-equilibrium
  skills:
  - vertical-forces
  archetype: vertical-forces
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Direct application of formula.
  assessmentUses:
  - easy-quiz
  - hard-quiz
  - easy-test
  questionType: freeResponse
  prompt: A 10 kg block is supported symmetrically by two vertical ropes. An additional downward force of 50 N is applied. What is the tension in each rope?
  answer:
    gradingMode: selfCheck
    expected: 74.0 N
  solutionOutline: 'Sum of forces in y is zero: 2T = mg + F. 2T = 10*9.8 + 50. T = 74.0 N.'
  commonTrap: Choosing a pivot point that does not eliminate unknown forces, or mixing up sine and cosine for the lever arm.
  verification:
    method: independent-derivation
    result: verified
  reviewStatus: verified
