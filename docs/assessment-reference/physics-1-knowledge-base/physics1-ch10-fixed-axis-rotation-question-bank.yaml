items:
- id: phys1-ch10-foundation-001
  topicId: rotational-kinematics
  skills:
  - angular-velocity
  archetype: angular-velocity
  difficulty: foundation
  reasoningDepth: 2
  difficultyEvidence: Direct application of formula.
  assessmentUses:
  - easy-quiz
  - hard-quiz
  - easy-test
  questionType: freeResponse
  prompt: A wheel starts with an angular velocity of 2 rad/s and accelerates at 1 rad/s^2 for 1 s. What is its final angular velocity?
  answer:
    gradingMode: selfCheck
    expected: 3 rad/s
  solutionOutline: Use w = w_0 + alpha * t. w = 2 + 1 * 1 = 3 rad/s.
  commonTrap: Confusing linear and angular variables, or forgetting the radius squared in moment of inertia.
  verification:
    method: independent-derivation
    result: verified
  reviewStatus: verified
