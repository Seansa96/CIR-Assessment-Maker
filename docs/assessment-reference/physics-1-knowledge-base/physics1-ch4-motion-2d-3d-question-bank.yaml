items:
- id: ch4-proc-001
  concept: Circular Motion
  difficulty: 2
  source: Generated
  prompt: A car travels in a circle of radius $r = 2$ m at a constant speed of $v
    = 14$ m/s. Find the centripetal acceleration.
  answer: 98.0 m/s$^2$
  solutionOutline: Use $a_c = \frac{v^2}{r}$.
- id: ch4-proc-002
  concept: Projectile Motion
  difficulty: 3
  source: Generated
  prompt: A projectile is launched with $v_0 = 33$ m/s at an angle of $30^\circ$.
    Find the horizontal range.
  answer: 96.23 m
  solutionOutline: Use $R = \frac{v_0^2 \sin(2\theta)}{g}$.
