- id: ch4-conc-041
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: In projectile motion, what is the horizontal acceleration?
  answer: Zero (assuming no air resistance).
  solutionOutline: Analyze horizontal acceleration.
- id: ch4-conc-042
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What angle provides the maximum range for a projectile over level ground?
  answer: 45 degrees.
  solutionOutline: Identify max range angle.
- id: ch4-conc-043
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: In uniform circular motion, is the velocity constant?
  answer: No, the speed is constant but the direction is constantly changing, so velocity
    is changing.
  solutionOutline: Analyze circular motion velocity.
- id: ch4-conc-044
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: What is the direction of centripetal acceleration?
  answer: Inwards, toward the center of the circular path.
  solutionOutline: Identify centripetal direction.
- id: ch4-conc-045
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Are horizontal and vertical motions in projectile motion dependent on each
    other?
  answer: No, they are completely independent.
  solutionOutline: Explain motion independence.
- id: ch4-conc-046
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: If you drop a bullet and fire a bullet horizontally at the same time, which
    hits the level ground first?
  answer: They hit at the exact same time, as vertical motion is independent of horizontal
    velocity.
  solutionOutline: Explain simultaneous fall.
- id: ch4-conc-047
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: How do you find the velocity of an object A relative to object C, if you
    know A relative to B, and B relative to C?
  answer: 'Vector addition: v_AC = v_AB + v_BC.'
  solutionOutline: Explain relative velocity addition.
- id: ch4-conc-048
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: At the peak of its trajectory, what is the vertical velocity of a projectile?
  answer: Zero.
  solutionOutline: Analyze peak trajectory velocity.
- id: ch4-conc-049
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: Does a car moving at a constant speed in a curve have acceleration?
  answer: Yes, it has centripetal acceleration because its direction is changing.
  solutionOutline: Analyze curved path acceleration.
- id: ch4-conc-050
  concept: Conceptual Understanding
  difficulty: 3
  source: Manual
  prompt: In nonuniform circular motion, what are the two components of acceleration?
  answer: Centripetal (radial) acceleration and tangential acceleration.
  solutionOutline: Identify acceleration components.
