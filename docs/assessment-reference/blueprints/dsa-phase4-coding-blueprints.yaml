    reviewState: approved
    questionType: code
    givens: "A sorted array and a target value."
    unknown: "A Python function to implement Binary Search."
    representationRequirement: "Python code execution."
    governingPrinciple: "O(log N) search via halving."
    methodSteps: ["Initialize left and right pointers", "While left <= right, find mid", "Compare mid to target and adjust pointers"]
    likelyMisconception: "Using O(N) linear scan instead of halving."
    difficultyEvidence: "Pointer manipulation and off-by-one loop conditions."
    answerVerificationMethod: "Unit tests."
    variationAxes: ["Target presence/absence", "Array size"]
    reasoningSignature: "Pointers -> Midpoint Check -> Halve Space"

