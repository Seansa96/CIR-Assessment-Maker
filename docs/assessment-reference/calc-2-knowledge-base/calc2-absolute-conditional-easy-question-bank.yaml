schemaVersion: 1
bankId: calc2-absolute-conditional-easy
categoryId: calculus-2
topicIds:
  - absolute-conditional-convergence
minimumItemCount: 15
items:
  - id: calc2-ac-easy-001
    topicId: absolute-conditional-convergence
    skills: [define-absolute-convergence]
    archetype: definition-recognition
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying the series that defines absolute convergence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What must converge for $\sum a_n$ to converge absolutely?
    choices:
      - { id: a, text: '$\sum|a_n|$' }
      - { id: b, text: '$\sum(-1)^na_n$' }
      - { id: c, text: 'The sequence $(|a_n|)$ to a nonzero limit' }
      - { id: d, text: 'Only the positive-indexed terms' }
    answer: { choiceId: a }
    solutionOutline: Absolute convergence is defined by convergence of the series of term magnitudes.
    commonTrap: Confusing convergence of the magnitude sequence with convergence of the sum of magnitudes.
    verification: { method: definition-check, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-002
    topicId: absolute-conditional-convergence
    skills: [apply-absolute-convergence-implication]
    archetype: theorem-direction
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the valid one-way implication.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\sum|a_n|$ converges, what is guaranteed?
    choices:
      - { id: a, text: '$\sum a_n$ converges.' }
      - { id: b, text: '$\sum a_n$ diverges.' }
      - { id: c, text: '$a_n$ is eventually positive.' }
      - { id: d, text: '$\sum a_n=0$.' }
    answer: { choiceId: a }
    solutionOutline: The triangle inequality makes absolute convergence a sufficient condition for convergence of the signed series.
    commonTrap: Reversing the implication and claiming every convergent series is absolute.
    verification: { method: absolute-convergence-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-003
    topicId: absolute-conditional-convergence
    skills: [define-conditional-convergence]
    archetype: two-part-definition
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires combining convergence of the signed series with divergence of its magnitude series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which statement defines conditional convergence?
    choices:
      - { id: a, text: '$\sum a_n$ converges but $\sum|a_n|$ diverges.' }
      - { id: b, text: '$\sum a_n$ and $\sum|a_n|$ both converge.' }
      - { id: c, text: '$a_n\to0$ but $\sum a_n$ diverges.' }
      - { id: d, text: 'The signs alternate, regardless of convergence.' }
    answer: { choiceId: a }
    solutionOutline: “Conditional” means cancellation is essential because removing signs destroys convergence.
    commonTrap: Using alternating signs alone as the classification.
    verification: { method: definition-check, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-004
    topicId: absolute-conditional-convergence
    skills: [classify-standard-series]
    archetype: alternating-harmonic
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires applying both alternating convergence and harmonic divergence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^{n-1}/n$.
    choices:
      - { id: a, text: 'Absolutely convergent' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent by the term test' }
      - { id: d, text: 'Geometric' }
    answer: { choiceId: b }
    solutionOutline: The signed series passes the alternating test, while its absolute-value series is the divergent harmonic series.
    commonTrap: Transferring absolute divergence to the signed series.
    verification: { method: alternating-and-harmonic-tests, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-005
    topicId: absolute-conditional-convergence
    skills: [classify-p-series-magnitudes]
    archetype: absolute-p-series
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires testing magnitudes with the p-series theorem.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      How does $\sum_{n=1}^{\infty}(-1)^n/n^2$ converge?
    choices:
      - { id: a, text: 'Absolutely' }
      - { id: b, text: 'Conditionally' }
      - { id: c, text: 'It diverges.' }
      - { id: d, text: 'Only its even terms converge.' }
    answer: { choiceId: a }
    solutionOutline: Taking absolute values produces the convergent p-series $\sum1/n^2$.
    commonTrap: Calling every convergent alternating series conditional.
    verification: { method: p-series-test, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-006
    topicId: absolute-conditional-convergence
    skills: [apply-the-divergence-test]
    archetype: nonzero-term-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires checking the term limit before classifying signed behavior.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^n n/(n+1)$.
    choices:
      - { id: a, text: 'Absolutely convergent' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent because the terms do not approach zero' }
      - { id: d, text: 'Convergent by alternation' }
    answer: { choiceId: c }
    solutionOutline: The magnitudes approach one, so the signed terms oscillate near $\pm1$ and violate a necessary convergence condition.
    commonTrap: Invoking the alternating-series test without checking its zero-limit hypothesis.
    verification: { method: term-limit-test, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-007
    topicId: absolute-conditional-convergence
    skills: [select-absolute-convergence-tests]
    archetype: factorial-structure
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires choosing a test that simplifies factorial magnitudes.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which test is most direct for absolute convergence of
      $\sum(-1)^n3^n/n!$?
    choices:
      - { id: a, text: 'Ratio test' }
      - { id: b, text: 'Alternating-series test only' }
      - { id: c, text: 'Integral test' }
      - { id: d, text: 'Divergence test, because the terms approach zero' }
    answer: { choiceId: a }
    solutionOutline: Consecutive absolute terms have ratio $3/(n+1)\to0$, proving absolute convergence.
    commonTrap: Using a weaker signed-series test when the factorial makes absolute convergence immediate.
    verification: { method: ratio-test-computation, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-008
    topicId: absolute-conditional-convergence
    skills: [reason-about-rearrangements]
    archetype: order-invariance
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires connecting absolute convergence to rearrangement invariance.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which convergence type guarantees that every rearrangement has the same sum?
    choices:
      - { id: a, text: 'Absolute convergence' }
      - { id: b, text: 'Conditional convergence' }
      - { id: c, text: 'Divergence with terms approaching zero' }
      - { id: d, text: 'Alternating signs' }
    answer: { choiceId: a }
    solutionOutline: Finite total magnitude controls all reordered tails, so an absolutely convergent series is order-independent.
    commonTrap: Assuming ordinary convergence alone makes infinite addition behave like a finite sum.
    verification: { method: rearrangement-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-009
    topicId: absolute-conditional-convergence
    skills: [use-contrapositives]
    archetype: logical-implication
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires taking the contrapositive of the absolute-convergence theorem.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\sum a_n$ diverges, what must be true?
    choices:
      - { id: a, text: '$\sum|a_n|$ diverges.' }
      - { id: b, text: '$\sum|a_n|$ converges.' }
      - { id: c, text: '$a_n$ never approaches zero.' }
      - { id: d, text: 'Every term is positive.' }
    answer: { choiceId: a }
    solutionOutline: If the magnitude series converged, the absolute-convergence theorem would force the signed series to converge; therefore it cannot.
    commonTrap: Claiming that divergence always comes from a nonzero term limit.
    verification: { method: theorem-contrapositive, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-010
    topicId: absolute-conditional-convergence
    skills: [classify-parameter-families]
    archetype: p-boundary
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires comparing the signed and absolute p-series thresholds.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For which $p$ does $\sum(-1)^{n-1}/n^p$ converge absolutely?
    choices:
      - { id: a, text: '$p>1$' }
      - { id: b, text: '$p>0$' }
      - { id: c, text: '$p\ge0$' }
      - { id: d, text: 'All real $p$' }
    answer: { choiceId: a }
    solutionOutline: Absolute values produce $\sum1/n^p$, which converges exactly above the p-series threshold one.
    commonTrap: Using the alternating convergence threshold $p>0$ as the absolute threshold.
    verification: { method: p-series-threshold, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-011
    topicId: absolute-conditional-convergence
    skills: [apply-limit-comparison-to-magnitudes]
    archetype: rational-absolute-series
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires comparing an absolute rational magnitude to a p-series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^n/(n^2+n)$.
    choices:
      - { id: a, text: 'Absolutely convergent' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent' }
      - { id: d, text: 'The term test is the only applicable test.' }
    answer: { choiceId: a }
    solutionOutline: The magnitudes are bounded above by $1/n^2$, so their series converges by comparison.
    commonTrap: Comparing with $1/n$ and assuming a smaller-than-divergent bound proves divergence.
    verification: { method: direct-comparison, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-012
    topicId: absolute-conditional-convergence
    skills: [recognize-positive-series-classifications]
    archetype: impossible-category
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires recognizing that conditional convergence requires sign cancellation.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Can a series with $a_n\ge0$ for every $n$ converge conditionally?
    choices:
      - { id: a, text: 'No, because $\sum|a_n|=\sum a_n$.' }
      - { id: b, text: 'Yes, whenever $a_n\to0$.' }
      - { id: c, text: 'Yes, if the terms decrease.' }
      - { id: d, text: 'Yes, if the sum is less than one.' }
    answer: { choiceId: a }
    solutionOutline: For nonnegative terms, ordinary and absolute convergence are the same question.
    commonTrap: Treating conditional convergence as a synonym for slow convergence.
    verification: { method: nonnegative-absolute-identity, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-013
    topicId: absolute-conditional-convergence
    skills: [understand-finite-term-invariance]
    archetype: finite-modification
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires separating convergence classification from numerical sum.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A conditionally convergent series has its first three terms changed. What
      is guaranteed?
    choices:
      - { id: a, text: 'It remains conditionally convergent, though its sum may change.' }
      - { id: b, text: 'It becomes absolutely convergent.' }
      - { id: c, text: 'It diverges.' }
      - { id: d, text: 'Its sum remains exactly unchanged.' }
    answer: { choiceId: a }
    solutionOutline: Finite changes preserve convergence of both the signed and magnitude tails but can shift the total by a finite amount.
    commonTrap: Confusing tail classification with the exact value of the full sum.
    verification: { method: finite-tail-invariance, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-014
    topicId: absolute-conditional-convergence
    skills: [diagnose-failed-test-logic]
    archetype: inconclusive-ratio-test
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires interpreting a ratio-test limit of one correctly.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      The absolute ratio-test limit for a series is $1$. What follows?
    choices:
      - { id: a, text: 'The ratio test is inconclusive.' }
      - { id: b, text: 'The series converges conditionally.' }
      - { id: c, text: 'The series converges absolutely.' }
      - { id: d, text: 'The series diverges.' }
    answer: { choiceId: a }
    solutionOutline: Both convergent p-series and divergent harmonic-type series can have ratio limit one.
    commonTrap: Treating the boundary value as belonging to either decisive ratio-test case.
    verification: { method: ratio-test-boundary-rule, result: verified }
    reviewStatus: verified

  - id: calc2-ac-easy-015
    topicId: absolute-conditional-convergence
    skills: [select-classification-workflows]
    archetype: method-order
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires choosing an efficient two-stage workflow for a signed series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is generally the best first question when classifying a signed series?
    choices:
      - { id: a, text: 'Does the series of absolute values converge?' }
      - { id: b, text: 'What is the exact sum?' }
      - { id: c, text: 'Are all early terms decreasing?' }
      - { id: d, text: 'Can the first term be removed?' }
    answer: { choiceId: a }
    solutionOutline: A positive answer immediately gives the strongest classification; a negative answer leads to a separate signed-convergence test.
    commonTrap: Applying several signed tests before checking whether magnitude convergence settles the problem.
    verification: { method: classification-decision-tree, result: verified }
    reviewStatus: verified
