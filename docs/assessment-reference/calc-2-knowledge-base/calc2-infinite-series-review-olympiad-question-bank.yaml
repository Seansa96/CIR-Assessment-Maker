schemaVersion: 1
bankId: calc2-infinite-series-review-olympiad
categoryId: calculus-2
topicIds: [infinite-series-review]
minimumItemCount: 30
items:
  - id: calc2-review-oly-001
    topicId: infinite-series-review
    skills: [compute-radii-with-limsup]
    archetype: alternating-coefficient-growth-rates
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires using limsup rather than an ordinary limit for oscillating coefficient growth.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      A power series $\sum a_nx^n$ has $a_n=2^n$ for even n and
      $a_n=3^n$ for odd n. What is its radius of convergence?
    choices: [{id: a, text: '$1/3$'}, {id: b, text: '$1/2$'}, {id: c, text: '$1/\sqrt6$'}, {id: d, text: '$1$'}]
    answer: {choiceId: a}
    solutionOutline: The limsup of $|a_n|^{1/n}$ is three, so Cauchy-Hadamard gives reciprocal radius one-third.
    commonTrap: Averaging the two subsequential growth rates.
    verification: {method: cauchy-hadamard-subsequence-limsup, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-002
    topicId: infinite-series-review
    skills: [apply-cauchy-condensation]
    archetype: logarithmic-harmonic-boundary
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires transforming a slowly varying positive series into a simpler harmonic benchmark.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Why does $\displaystyle\sum_{n=2}^{\infty}1/(n\log n)$ diverge?
    choices: [{id: a, text: 'Condensation produces terms comparable to $1/k$.'}, {id: b, text: 'Its terms do not approach zero.'}, {id: c, text: 'It is a p-series with exponent two.'}, {id: d, text: 'The ratio-test limit exceeds one.'}]
    answer: {choiceId: a}
    solutionOutline: The condensed term $2^k/[2^k\log(2^k)]$ equals $1/(k\log2)$, a constant multiple of the harmonic series.
    commonTrap: Assuming any logarithm in a denominator forces convergence.
    verification: {method: cauchy-condensation-log-harmonic, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-003
    topicId: infinite-series-review
    skills: [classify-iterated-logarithm-series]
    archetype: bertrand-series-threshold
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires applying an integral or condensation test through two logarithmic scales.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For sufficiently large n, when does
      $\displaystyle\sum\frac{1}{n\log n(\log\log n)^p}$ converge?
    choices: [{id: a, text: 'Exactly when $p>1$'}, {id: b, text: 'Exactly when $p\ge1$'}, {id: c, text: 'For every positive p'}, {id: d, text: 'For no p'}]
    answer: {choiceId: a}
    solutionOutline: Successive substitutions $u=\log x$ and $v=\log u$ reduce the integral test to $\int v^{-p}\,dv$.
    commonTrap: Treating the first logarithm as enough to move the threshold to p greater than zero.
    verification: {method: iterated-log-integral-threshold, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-004
    topicId: infinite-series-review
    skills: [apply-dirichlet-tests]
    archetype: oscillatory-harmonic-series
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires using bounded oscillatory partial sums rather than monotone alternation.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      How does $\displaystyle\sum_{n=1}^{\infty}\sin(n)/n$ converge?
    choices: [{id: a, text: 'Conditionally by Dirichlet’s test'}, {id: b, text: 'Absolutely by comparison with $1/n^2$'}, {id: c, text: 'It diverges because $1/n$ diverges'}, {id: d, text: 'Geometrically'}]
    answer: {choiceId: a}
    solutionOutline: Partial sums of $\sin n$ are bounded and $1/n$ decreases to zero; the absolute series still has harmonic-scale mass.
    commonTrap: Replacing an oscillatory numerator by its upper bound one, which cannot prove divergence or convergence.
    verification: {method: dirichlet-sine-harmonic, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-005
    topicId: infinite-series-review
    skills: [apply-dirichlet-tests]
    archetype: cosine-frequency-harmonic
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires identifying the exceptional frequencies where bounded partial sums fail.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For which real $\theta$ does
      $\displaystyle\sum_{n=1}^{\infty}\cos(n\theta)/n$ fail the usual
      Dirichlet conclusion because the cosine partial sums are not bounded?
    choices: [{id: a, text: '$\theta\in2\pi\mathbb Z$'}, {id: b, text: '$\theta\in\pi\mathbb Z$'}, {id: c, text: 'Every irrational multiple of pi'}, {id: d, text: 'No real theta'}]
    answer: {choiceId: a}
    solutionOutline: When theta is a multiple of two pi every cosine equals one; otherwise the finite geometric formula bounds the exponential partial sums.
    commonTrap: Including odd multiples of pi, where the cosine sequence alternates and has bounded partial sums.
    verification: {method: trigonometric-geometric-partial-sums, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-006
    topicId: infinite-series-review
    skills: [understand-conditional-rearrangements]
    archetype: riemann-rearrangement
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires distinguishing convergence under a fixed order from convergence under arbitrary permutations.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      A real series converges conditionally. Which phenomenon is possible?
    choices: [{id: a, text: 'A rearrangement can converge to a prescribed real value.'}, {id: b, text: 'Every rearrangement has the original sum.'}, {id: c, text: 'The absolute-value series also converges.'}, {id: d, text: 'Only finitely many terms are negative.'}]
    answer: {choiceId: a}
    solutionOutline: The positive and negative subseries separately diverge, allowing rearrangements that alternately overshoot and undershoot a chosen target.
    commonTrap: Extending the reorder-invariance of absolutely convergent series to conditional series.
    verification: {method: riemann-rearrangement-principle, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-007
    topicId: infinite-series-review
    skills: [justify-cauchy-products]
    archetype: absolute-series-product
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires identifying a sufficient condition for multiplying two infinite sums by convolution.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $\sum a_n=A$ and $\sum b_n=B$ both converge absolutely, what
      can be asserted about $c_n=\sum_{k=0}^{n}a_kb_{n-k}$?
    choices: [{id: a, text: '$\sum c_n$ converges absolutely to $AB$'}, {id: b, text: '$c_n=a_nb_n$'}, {id: c, text: '$\sum c_n$ must diverge'}, {id: d, text: '$\sum c_n=A+B$'}]
    answer: {choiceId: a}
    solutionOutline: Absolute convergence permits regrouping the doubly indexed product sum by total degree.
    commonTrap: Confusing the Cauchy convolution with coefficientwise multiplication.
    verification: {method: absolute-cauchy-product-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-008
    topicId: infinite-series-review
    skills: [apply-abel-boundary-theorems]
    archetype: radial-limit-of-power-series
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires connecting convergence at a boundary point to a one-sided limit from within the disk.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $\sum a_n$ converges to S, what does Abel’s theorem imply about
      $f(r)=\sum a_nr^n$ as $r\to1^-$?
    choices: [{id: a, text: '$f(r)\to S$'}, {id: b, text: '$f(r)\to0$'}, {id: c, text: '$f(r)$ must be constant'}, {id: d, text: 'The limit exists only under absolute convergence'}]
    answer: {choiceId: a}
    solutionOutline: Abel’s theorem transfers convergence of the boundary coefficient sum to the radial limit from inside the interval of convergence.
    commonTrap: Assuming conditional convergence is insufficient for the one-sided Abel conclusion.
    verification: {method: abel-radial-limit, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-009
    topicId: infinite-series-review
    skills: [establish-uniform-power-series-convergence]
    archetype: compact-subinterval-majorant
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires shrinking inside the radius and building a uniform geometric-type majorant.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      A power series has radius R. On which sets is uniform convergence
      automatically guaranteed?
    choices: [{id: a, text: 'Every closed interval $|x|\le r<R$'}, {id: b, text: 'The entire closed interval $|x|\le R$ including both endpoints'}, {id: c, text: 'Every set containing points with $|x|>R$'}, {id: d, text: 'Only the center point'}]
    answer: {choiceId: a}
    solutionOutline: Inside the radius, choose a slightly larger interior radius and use its convergent absolute series as a Weierstrass majorant.
    commonTrap: Assuming endpoint behavior is controlled by the interior radius theorem.
    verification: {method: compact-subdisk-uniform-convergence, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-010
    topicId: infinite-series-review
    skills: [compute-radii-from-polynomial-exponential-growth]
    archetype: polynomial-weighted-four-power
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires separating the irrelevant polynomial factor from exponential coefficient growth.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of $\displaystyle\sum_{n=1}^{\infty}n^2 4^n x^n$?
    choices: [{id: a, text: '$1/4$'}, {id: b, text: '$4$'}, {id: c, text: '$1/2$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The nth root of the coefficient tends to four because $(n^2)^{1/n}$ tends to one.
    commonTrap: Letting the polynomial factor change the exponential radius.
    verification: {method: coefficient-root-growth, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-011
    topicId: infinite-series-review
    skills: [test-logarithmic-power-series-endpoints]
    archetype: shifted-log-denominator-series
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires using distinct logarithmic and alternating tests at the two endpoints.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the interval of convergence of
      $\displaystyle\sum_{n=2}^{\infty}\frac{(x-1)^n}{n\log n}$?
    choices: [{id: a, text: '$[0,2)$'}, {id: b, text: '$(0,2]$'}, {id: c, text: '$[0,2]$'}, {id: d, text: '$(0,2)$'}]
    answer: {choiceId: a}
    solutionOutline: The radius is one; at x equals two the positive logarithmic harmonic series diverges, while at x equals zero the alternating version converges.
    commonTrap: Assuming the slowly varying logarithm gives the same result at both endpoints.
    verification: {method: logarithmic-endpoint-classification, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-012
    topicId: infinite-series-review
    skills: [recognize-logarithmic-telescoping]
    archetype: logarithm-of-product
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires converting a sum of logarithms to a telescoping product.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What happens to
      $\displaystyle\sum_{n=1}^{\infty}\log(1+1/n)$?
    choices: [{id: a, text: 'It diverges because the Nth partial sum is $\log(N+1)$.'}, {id: b, text: 'It converges to $\log2$.'}, {id: c, text: 'It converges absolutely by comparison with $1/n^2$.'}, {id: d, text: 'Its terms do not approach zero.'}]
    answer: {choiceId: a}
    solutionOutline: Each term is $\log(n+1)-\log n$, so the partial sums telescope even though the individual terms tend to zero.
    commonTrap: Concluding convergence from the term limit alone.
    verification: {method: logarithmic-telescoping-partial-sum, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-013
    topicId: infinite-series-review
    skills: [classify-infinite-products]
    archetype: positive-small-factor-product
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires using logarithms to connect product convergence with a summable perturbation.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What can be concluded about
      $\displaystyle\prod_{n=1}^{\infty}(1+1/n^2)$?
    choices: [{id: a, text: 'It converges to a finite positive value.'}, {id: b, text: 'It converges to zero.'}, {id: c, text: 'It diverges because every factor exceeds one.'}, {id: d, text: 'It alternates.'}]
    answer: {choiceId: a}
    solutionOutline: The logarithms are asymptotic to $1/n^2$, so their sum converges and the product has a finite nonzero limit.
    commonTrap: Assuming infinitely many factors greater than one force an infinite product to blow up.
    verification: {method: logarithm-of-infinite-product, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-014
    topicId: infinite-series-review
    skills: [apply-integral-tests-with-log-substitution]
    archetype: convergent-log-square-tail
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires using a logarithmic substitution to expose a p-integral.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=2}^{\infty}1/[n(\log n)^2]$.
    choices: [{id: a, text: 'It converges by the integral test.'}, {id: b, text: 'It diverges by condensation to the harmonic series.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'The terms do not approach zero.'}]
    answer: {choiceId: a}
    solutionOutline: With u equal to log x, the comparison integral becomes $\int u^{-2}\,du$, which converges at infinity.
    commonTrap: Confusing this exponent-two logarithmic series with the divergent exponent-one boundary.
    verification: {method: log-square-integral-test, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-015
    topicId: infinite-series-review
    skills: [compare-conditional-and-square-summability]
    archetype: alternating-harmonic-square
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires distinguishing a conditionally convergent series from the series of squared terms.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Let $a_n=(-1)^{n+1}/n$. How does $\sum a_n^2$ behave?
    choices: [{id: a, text: 'It converges absolutely as $\sum1/n^2$.'}, {id: b, text: 'It converges conditionally.'}, {id: c, text: 'It diverges because $\sum a_n$ is only conditional.'}, {id: d, text: 'It telescopes.'}]
    answer: {choiceId: a}
    solutionOutline: Squaring removes the signs and changes the decay from harmonic to reciprocal-square.
    commonTrap: Assuming a transformation of a conditional series inherits its original classification.
    verification: {method: squared-alternating-harmonic, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-016
    topicId: infinite-series-review
    skills: [sum-higher-order-telescoping-series]
    archetype: three-factor-reciprocal
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires a nested partial-fraction telescoping decomposition.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{1}{n(n+1)(n+2)}$.
    choices: [{id: a, text: '$1/4$'}, {id: b, text: '$1/2$'}, {id: c, text: '$1$'}, {id: d, text: '$\pi^2/12$'}]
    answer: {choiceId: a}
    solutionOutline: Write the term as one-half times $[1/(n(n+1))-1/((n+1)(n+2))]$ and telescope.
    commonTrap: Omitting the factor one-half in the partial-fraction identity.
    verification: {method: second-order-telescoping-sum, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-017
    topicId: infinite-series-review
    skills: [derive-weighted-geometric-sums]
    archetype: first-geometric-moment
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires differentiating a generating identity and evaluating inside its radius.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}n/2^n$.
    choices: [{id: a, text: '$2$'}, {id: b, text: '$1$'}, {id: c, text: '$4$'}, {id: d, text: '$3/2$'}]
    answer: {choiceId: a}
    solutionOutline: From $\sum nx^n=x/(1-x)^2$, substitute x equals one-half.
    commonTrap: Using the unweighted geometric sum.
    verification: {method: first-moment-geometric-evaluation, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-018
    topicId: infinite-series-review
    skills: [derive-second-moment-geometric-sums]
    archetype: squared-index-binary-series
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires applying the Euler derivative operator twice.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}n^2/2^n$.
    choices: [{id: a, text: '$6$'}, {id: b, text: '$4$'}, {id: c, text: '$8$'}, {id: d, text: '$2$'}]
    answer: {choiceId: a}
    solutionOutline: Use $\sum n^2x^n=x(1+x)/(1-x)^3$ and set x equal to one-half.
    commonTrap: Reusing the first-moment value from the series with coefficient n.
    verification: {method: second-moment-geometric-evaluation, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-019
    topicId: infinite-series-review
    skills: [use-small-angle-asymptotics]
    archetype: sine-harmonic-equivalence
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires applying asymptotic equivalence to a nonlinear term.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=1}^{\infty}\sin(1/n)$.
    choices: [{id: a, text: 'It diverges by limit comparison with $1/n$.'}, {id: b, text: 'It converges by comparison with $1/n^2$.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'It alternates.'}]
    answer: {choiceId: a}
    solutionOutline: The ratio $\sin(1/n)/(1/n)$ tends to one, so the positive series has harmonic behavior.
    commonTrap: Assuming the boundedness of sine forces summability.
    verification: {method: sine-small-angle-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-020
    topicId: infinite-series-review
    skills: [use-quadratic-small-angle-asymptotics]
    archetype: cosine-defect-square-scale
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing second-order rather than first-order small-angle behavior.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=1}^{\infty}[1-\cos(1/n)]$.
    choices: [{id: a, text: 'It converges by limit comparison with $1/n^2$.'}, {id: b, text: 'It diverges by comparison with $1/n$.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'Its terms approach one.'}]
    answer: {choiceId: a}
    solutionOutline: Since $1-\cos u\sim u^2/2$, the terms are asymptotic to $1/(2n^2)$.
    commonTrap: Using the linear small-angle approximation for sine on a cosine defect.
    verification: {method: cosine-defect-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-021
    topicId: infinite-series-review
    skills: [analyze-monotone-recurrences]
    archetype: nested-radical-limit
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires establishing bounded monotonic behavior before solving the fixed-point equation.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Let $a_1=1$ and $a_{n+1}=\sqrt{2+a_n}$. What is the limit?
    choices: [{id: a, text: '$2$'}, {id: b, text: '$1$'}, {id: c, text: '$\sqrt2$'}, {id: d, text: 'The sequence diverges'}]
    answer: {choiceId: a}
    solutionOutline: The sequence increases and remains below two; its limit L satisfies $L=\sqrt{2+L}$, whose compatible nonnegative solution is two.
    commonTrap: Solving the fixed-point equation without ruling out divergence or choosing the extraneous negative root.
    verification: {method: monotone-bounded-fixed-point, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-022
    topicId: infinite-series-review
    skills: [compute-limsup-and-liminf]
    archetype: two-subsequence-oscillation
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires analyzing even and odd subsequences separately.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $a_n=(-1)^n+1/n$, what are $\limsup a_n$ and $\liminf a_n$?
    choices: [{id: a, text: '$1$ and $-1$'}, {id: b, text: '$0$ and $0$'}, {id: c, text: '$1$ and $0$'}, {id: d, text: '$\infty$ and $-\infty$'}]
    answer: {choiceId: a}
    solutionOutline: The even subsequence approaches one and the odd subsequence approaches minus one.
    commonTrap: Averaging the two subsequential limits.
    verification: {method: parity-subsequence-extrema, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-023
    topicId: infinite-series-review
    skills: [find-entire-factorial-ratio-series]
    archetype: double-factorial-denominator-growth
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires simplifying a coefficient ratio containing two linked factorials.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the radius of
      $\displaystyle\sum_{n=0}^{\infty}\frac{n!}{(2n)!}x^n$?
    choices: [{id: a, text: '$\infty$'}, {id: b, text: '$2$'}, {id: c, text: '$4$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The ratio of successive coefficient magnitudes is $1/[2(2n+1)]$, so the term ratio tends to zero for every fixed x.
    commonTrap: Treating both factorials as though their growth canceled completely.
    verification: {method: factorial-ratio-entire-radius, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-024
    topicId: infinite-series-review
    skills: [find-central-binomial-type-radii]
    archetype: squared-factorial-coefficients
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires retaining the finite exponential rate left after factorial cancellation.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the radius of
      $\displaystyle\sum_{n=0}^{\infty}\frac{(n!)^2}{(2n)!}x^n$?
    choices: [{id: a, text: '$4$'}, {id: b, text: '$1/4$'}, {id: c, text: '$\infty$'}, {id: d, text: '$2$'}]
    answer: {choiceId: a}
    solutionOutline: The successive coefficient ratio tends to one-fourth, so the series term ratio tends to $|x|/4$.
    commonTrap: Taking the coefficient ratio itself as the radius rather than its reciprocal threshold in x.
    verification: {method: squared-factorial-ratio-radius, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-025
    topicId: infinite-series-review
    skills: [test-binomial-series-boundaries]
    archetype: inverse-square-root-endpoint
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires using central-binomial asymptotics at the radius endpoint.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      At $x=1$, how does the Maclaurin series for $(1-x)^{-1/2}$
      behave?
    choices: [{id: a, text: 'It diverges, with coefficients of order $n^{-1/2}$.'}, {id: b, text: 'It converges absolutely.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'It terminates.'}]
    answer: {choiceId: a}
    solutionOutline: The coefficients are $\binom{2n}{n}/4^n\sim1/\sqrt{\pi n}$, whose positive sum diverges.
    commonTrap: Assuming every algebraic function's binomial series converges at both radius endpoints.
    verification: {method: central-binomial-endpoint-asymptotic, result: verified}
    reviewStatus: verified
  - id: calc2-review-oly-026
    topicId: infinite-series-review
    skills: [derive-third-moment-generating-series]
    archetype: cubic-index-geometric-sum
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires repeated application of the Euler differential operator and algebraic simplification.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $|x|<1$, which expression equals
      $\displaystyle\sum_{n=1}^{\infty}n^3x^n$?
