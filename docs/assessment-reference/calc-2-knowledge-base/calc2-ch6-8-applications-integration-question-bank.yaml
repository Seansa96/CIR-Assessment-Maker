- id: ch6-8-stewart-001
  concept: Applications of Integration
  difficulty: 3
  source: Stewart Calculus Ch 6 & 8 Inspired
  prompt: A spring has natural length 2 m. A force of 20 N stretches it by 1 m. Find
    the work done stretching it 2 m.
  answer: 40 J
  solutionOutline: Find the spring constant k, then integrate kx from 0 to a.
