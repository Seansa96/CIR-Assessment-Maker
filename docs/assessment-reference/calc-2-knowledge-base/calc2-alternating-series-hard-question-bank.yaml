schemaVersion: 1
bankId: calc2-alternating-series-hard
categoryId: calculus-2
topicIds: [alternating-series]
minimumItemCount: 15
items:
  - id: calc2-alt-hard-001
    topicId: alternating-series
    skills: [check-the-term-test-before-ast]
    archetype: alternating-nonzero-limit
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires checking the full term limit before relying on alternating signs.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What happens to $\sum_{n=1}^{\infty}(-1)^n n/(n+1)$?
    choices: [{id: a, text: 'It diverges by the term test.'}, {id: b, text: 'It converges conditionally.'}, {id: c, text: 'It converges absolutely.'}, {id: d, text: 'It telescopes.'}]
    answer: {choiceId: a}
    solutionOutline: The term magnitude approaches one, so the terms do not approach zero.
    commonTrap: Treating sign alternation as sufficient for convergence.
    verification: {method: necessary-term-limit, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-002
    topicId: alternating-series
    skills: [classify-alternating-series]
    archetype: asymptotically-harmonic-magnitude
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires proving signed convergence and absolute divergence with different tests.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^{n-1}/(n+\sqrt n)$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: The positive magnitudes decrease to zero, but limit comparison with $1/n$ gives absolute divergence.
    commonTrap: Comparing the absolute terms with $1/n$ and transferring that divergence to the signed series.
    verification: {method: ast-and-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-003
    topicId: alternating-series
    skills: [solve-alternating-error-thresholds]
    archetype: strict-first-omitted-bound
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires solving a strict discrete inequality with the first omitted index.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For $\sum_{n=1}^{\infty}(-1)^{n-1}/n^2$, what is the least $N$ for
      which the alternating-series theorem guarantees $|R_N|<10^{-4}$?
    choices: [{id: a, text: '$100$'}, {id: b, text: '$99$'}, {id: c, text: '$101$'}, {id: d, text: '$10{,}000$'}]
    answer: {choiceId: a}
    solutionOutline: The bound is $1/(N+1)^2<10^{-4}$, requiring $N+1>100$ and hence least integer $N=100$.
    commonTrap: Replacing the strict inequality by equality and choosing 99.
    verification: {method: adjacent-integer-error-check, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-004
    topicId: alternating-series
    skills: [bound-alternating-series-sums]
    archetype: bracketing-by-consecutive-partial-sums
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires using the direction of the first term to order partial sums.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For a positive-first alternating series with decreasing magnitudes, which
      relation always holds?
    choices: [{id: a, text: '$S_{2N}\le S\le S_{2N-1}$'}, {id: b, text: '$S_{2N-1}\le S\le S_{2N}$'}, {id: c, text: '$S=S_N$ for some finite $N$'}, {id: d, text: '$S\le0$'}]
    answer: {choiceId: a}
    solutionOutline: Even partial sums approach upward from below and odd partial sums approach downward from above.
    commonTrap: Reversing the bounds by forgetting whether the first included term is positive.
    verification: {method: alternating-partial-sum-monotonicity, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-005
    topicId: alternating-series
    skills: [verify-eventual-monotonicity]
    archetype: derivative-check
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires recognizing that monotonicity is only needed eventually and proving it.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Why is the alternating-series test applicable to
      $\sum_{n=3}^{\infty}(-1)^n(\ln n)/n$?
    choices: [{id: a, text: '$\ln x/x$ decreases for $x>e$ and tends to $0$.'}, {id: b, text: '$\sum(\ln n)/n$ converges.'}, {id: c, text: 'The magnitudes decrease from $n=1$ onward.'}, {id: d, text: 'Every logarithmic series converges.'}]
    answer: {choiceId: a}
    solutionOutline: Differentiation gives $(1-\ln x)/x^2<0$ after e, and the logarithm grows more slowly than x.
    commonTrap: Demanding monotonicity at every early index instead of eventually.
    verification: {method: derivative-and-growth-limit, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-006
    topicId: alternating-series
    skills: [classify-rational-alternating-series]
    archetype: degree-one-tail
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires asymptotic classification and a separate monotonicity argument.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^n(n+1)/(n^2+1)$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent by the term test'}, {id: d, text: 'Telescoping'}]
    answer: {choiceId: a}
    solutionOutline: The magnitude is eventually decreasing to zero and is asymptotic to $1/n$, so its absolute series diverges.
    commonTrap: Using the denominator degree alone and calling it a convergent p-series.
    verification: {method: eventual-ast-and-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-007
    topicId: alternating-series
    skills: [classify-parameterized-alternating-series]
    archetype: p-parameter-regimes
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires separating absolute, conditional, and divergent parameter ranges.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For which $p$ is $\sum_{n=1}^{\infty}(-1)^{n-1}/n^p$
      conditionally convergent?
    choices: [{id: a, text: '$0<p\le1$'}, {id: b, text: '$p>1$'}, {id: c, text: '$p\le0$'}, {id: d, text: 'Every real $p$'}]
    answer: {choiceId: a}
    solutionOutline: Signed convergence needs $p>0$, while absolute p-series convergence begins only when $p>1$.
    commonTrap: Including $p=0$, where the terms fail to tend to zero.
    verification: {method: ast-and-p-series-regimes, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-008
    topicId: alternating-series
    skills: [classify-slowly-decreasing-alternating-series]
    archetype: logarithmic-denominator
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires proving convergence despite extremely slow term decay and proving absolute divergence.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the strongest classification of
      $\sum_{n=2}^{\infty}(-1)^n/\ln(n+1)$?
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent because logarithms grow slowly'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes decrease to zero; their positive sum diverges since eventually $1/\ln(n+1)>1/n$.
    commonTrap: Believing slow convergence to zero invalidates the alternating-series test.
    verification: {method: ast-and-harmonic-lower-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-009
    topicId: alternating-series
    skills: [use-small-angle-comparison]
    archetype: trigonometric-magnitude
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires a small-angle limit for absolute classification.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^{n-1}\sin(1/n)$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent by the term test'}, {id: d, text: 'Telescoping'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes decrease to zero, while $\sin(1/n)/(1/n)\to1$, so the absolute series behaves harmonically.
    commonTrap: Assuming bounded sine values imply absolute convergence.
    verification: {method: ast-and-small-angle-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-010
    topicId: alternating-series
    skills: [compute-error-guarantees]
    archetype: specified-partial-sum-error
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires mapping a concrete truncation to the first omitted term.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $S_{20}$ approximates
      $\sum_{n=1}^{\infty}(-1)^{n-1}/(2n+1)$, which guaranteed error bound is
      sharpest from the alternating-series theorem?
    choices: [{id: a, text: '$1/43$'}, {id: b, text: '$1/41$'}, {id: c, text: '$1/21$'}, {id: d, text: '$1/400$'}]
    answer: {choiceId: a}
    solutionOutline: The first omitted index is 21, whose magnitude is $1/(2\cdot21+1)=1/43$.
    commonTrap: Using the twentieth term instead of the twenty-first.
    verification: {method: first-omitted-term-substitution, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-011
    topicId: alternating-series
    skills: [detect-invalid-ast-use]
    archetype: alternating-blocks
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires distinguishing termwise alternation from blocks with nonvanishing total size.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A signed series has two positive terms followed by two negative terms,
      repeating, and term magnitudes $1/n$. Why does the ordinary
      alternating-series test not apply directly?
    choices: [{id: a, text: 'The signs do not alternate term by term.'}, {id: b, text: 'The terms fail to approach zero.'}, {id: c, text: '$1/n$ is increasing.'}, {id: d, text: 'Negative terms are forbidden.'}]
    answer: {choiceId: a}
    solutionOutline: The standard theorem requires a single sign change at each successive term; a block argument would need separate analysis.
    commonTrap: Calling every series containing both signs an alternating series.
    verification: {method: theorem-hypothesis-check, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-012
    topicId: alternating-series
    skills: [combine-ratio-and-alternating-tests]
    archetype: ratio-proves-absolute-convergence
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires interpreting a ratio result for the absolute-value series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For a signed series, suppose
      $\lim|a_{n+1}/a_n|=3/4$. What is guaranteed?
    choices: [{id: a, text: 'Absolute convergence'}, {id: b, text: 'Conditional convergence only'}, {id: c, text: 'Divergence'}, {id: d, text: 'No conclusion'}]
    answer: {choiceId: a}
    solutionOutline: A ratio limit below one proves convergence of $\sum|a_n|$, which is stronger than signed convergence.
    commonTrap: Assuming a signed appearance limits the conclusion to conditional convergence.
    verification: {method: absolute-ratio-test, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-013
    topicId: alternating-series
    skills: [analyze-factorial-alternating-series]
    archetype: double-factorial-growth
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires simplifying a factorial ratio with a two-step denominator.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      How does $\sum_{n=1}^{\infty}(-1)^n n!/(2n)!$ converge?
    choices: [{id: a, text: 'Absolutely'}, {id: b, text: 'Conditionally'}, {id: c, text: 'It diverges.'}, {id: d, text: 'The term test is inconclusive and no other test applies.'}]
    answer: {choiceId: a}
    solutionOutline: The absolute consecutive ratio is $(n+1)/[(2n+2)(2n+1)]$, which tends to zero.
    commonTrap: Using only sign alternation and failing to test the much faster absolute decay.
    verification: {method: factorial-ratio-test, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-014
    topicId: alternating-series
    skills: [check-vanishing-terms]
    archetype: growing-magnitude-perturbation
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires checking a hidden nonzero magnitude limit.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Determine the behavior of
      $\sum_{n=1}^{\infty}(-1)^n(1+1/n)$.
    choices: [{id: a, text: 'Divergent'}, {id: b, text: 'Conditionally convergent'}, {id: c, text: 'Absolutely convergent'}, {id: d, text: 'Converges to zero'}]
    answer: {choiceId: a}
    solutionOutline: The term magnitudes approach one, so the terms themselves do not approach zero.
    commonTrap: Focusing on the small reciprocal correction and overlooking the constant component.
    verification: {method: term-test, result: verified}
    reviewStatus: verified
  - id: calc2-alt-hard-015
    topicId: alternating-series
    skills: [infer-error-sign]
    archetype: remainder-direction
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires relating the sign of the first omitted term to over- or underestimation.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A positive-first alternating series has decreasing magnitudes. If $N$ is
      odd, how does $S_N$ compare with the sum $S$?
    choices: [{id: a, text: '$S_N>S$'}, {id: b, text: '$S_N<S$'}, {id: c, text: '$S_N=S$'}, {id: d, text: 'No comparison is possible'}]
    answer: {choiceId: a}
    solutionOutline: Odd partial sums end after a positive term and form the decreasing sequence of upper bounds.
    commonTrap: Remembering only the magnitude of the remainder and not its direction.
    verification: {method: alternating-partial-sum-bracketing, result: verified}
    reviewStatus: verified
