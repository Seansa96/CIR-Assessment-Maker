metadata:
  title: Calculus 2 Question Bank
  description: A general question bank spanning Integration Techniques, Applications, Sequences & Series, Parametric/Polar, and Differential Equations.
  tags:
  - calculus-2
  - integrals
  - series
  - differential-equations
items:
- id: calc2-parts-01
  concept: Integration by Parts
  difficulty: 2
  source: Stewart Calculus Chapter 7 Adaptation
  prompt: 'Evaluate the integral: \int x \ln x \, dx'
  answer: \frac{1}{2}x^2 \ln x - \frac{1}{4}x^2 + C
  solutionOutline: Let u = \ln x and dv = x \, dx. Then du = \frac{1}{x} dx and v = \frac{1}{2}x^2. Applying integration by parts yields \frac{1}{2}x^2 \ln x - \int \frac{1}{2}x \, dx = \frac{1}{2}x^2 \ln x - \frac{1}{4}x^2 + C.
- id: calc2-trigint-01
  concept: Trigonometric Integrals
  difficulty: 3
  source: Stewart Calculus Chapter 7 Adaptation
  prompt: 'Evaluate: \int \sin^3 x \cos^2 x \, dx'
  answer: -\frac{1}{3}\cos^3 x + \frac{1}{5}\cos^5 x + C
  solutionOutline: Since the power of sine is odd, factor out one \sin x. Convert the remaining \sin^2 x to 1 - \cos^2 x. Let u = \cos x, du = -\sin x \, dx. The integral becomes -\int (1 - u^2)u^2 \, du = -\frac{1}{3}u^3 + \frac{1}{5}u^5 + C.
- id: calc2-trigsub-01
  concept: Trigonometric Substitution
  difficulty: 4
  source: Stewart Calculus Chapter 7 Adaptation
  prompt: 'Evaluate: \int \frac{1}{x^2 \sqrt{16 - x^2}} \, dx'
  answer: -\frac{\sqrt{16-x^2}}{16x} + C
  solutionOutline: Let x = 4\sin\theta, dx = 4\cos\theta \, d\theta. The radical becomes 4\cos\theta. The integral simplifies to \frac{1}{16} \int \csc^2\theta \, d\theta = -\frac{1}{16}\cot\theta + C. Drawing a triangle with \sin\theta = x/4 gives \cot\theta = \frac{\sqrt{16-x^2}}{x}.
- id: calc2-partialfrac-01
  concept: Partial Fractions
  difficulty: 3
  source: Stewart Calculus Chapter 7 Adaptation
  prompt: 'Evaluate: \int \frac{2x+1}{(x-1)(x+2)} \, dx'
  answer: \ln|x-1| + \ln|x+2| + C
  solutionOutline: Decompose \frac{2x+1}{(x-1)(x+2)} = \frac{A}{x-1} + \frac{B}{x+2}. Solving yields A = 1, B = 1. The integral is \int (\frac{1}{x-1} + \frac{1}{x+2}) \, dx = \ln|x-1| + \ln|x+2| + C.
- id: calc2-improper-01
  concept: Improper Integrals
  difficulty: 3
  source: Stewart Calculus Chapter 7 Adaptation
  prompt: 'Determine whether \int_1^\infty \frac{1}{x^3} \, dx converges or diverges. If it converges, evaluate it.'
  answer: 'Converges to 1/2'
  solutionOutline: \lim_{t \to \infty} \int_1^t x^{-3} \, dx = \lim_{t \to \infty} \left[ -\frac{1}{2x^2} \right]_1^t = \lim_{t \to \infty} (-\frac{1}{2t^2} + \frac{1}{2}) = \frac{1}{2}.
- id: calc2-volume-01
  concept: Volumes of Solids of Revolution
  difficulty: 4
  source: Stewart Calculus Chapter 6 Adaptation
  prompt: 'Find the volume of the solid obtained by rotating the region bounded by y = x^2 and y = x around the x-axis.'
  answer: \frac{2\pi}{15}
  solutionOutline: The curves intersect at x=0 and x=1. Using the washer method: V = \pi \int_0^1 (x^2 - (x^2)^2) \, dx = \pi \int_0^1 (x^2 - x^4) \, dx = \pi [\frac{x^3}{3} - \frac{x^5}{5}]_0^1 = \pi (1/3 - 1/5) = \frac{2\pi}{15}.
- id: calc2-series-geo-01
  concept: Geometric Series
  difficulty: 2
  source: Stewart Calculus Chapter 11 Adaptation
  prompt: 'Find the sum of the series \sum_{n=1}^\infty \frac{3^n}{5^{n+1}}'
  answer: '3/10'
  solutionOutline: Rewrite the general term as \frac{1}{5} (\frac{3}{5})^n. This is a geometric series with a = 3/25 and r = 3/5. The sum is S = \frac{a}{1-r} = \frac{3/25}{1 - 3/5} = \frac{3/25}{2/5} = 3/10.
- id: calc2-series-alt-01
  concept: Alternating Series Test
  difficulty: 3
  source: Stewart Calculus Chapter 11 Adaptation
  prompt: 'Determine whether \sum_{n=1}^\infty \frac{(-1)^n}{\sqrt{n}} is absolutely convergent, conditionally convergent, or divergent.'
  answer: 'Conditionally convergent'
  solutionOutline: The absolute value series \sum \frac{1}{\sqrt{n}} is a p-series with p = 1/2 \le 1, so it diverges. The original alternating series converges by the Alternating Series Test since 1/\sqrt{n} decreases to 0. Thus, it is conditionally convergent.
- id: calc2-taylor-01
  concept: Taylor Series
  difficulty: 3
  source: Stewart Calculus Chapter 11 Adaptation
  prompt: 'Find the Maclaurin series for f(x) = e^{-x^2}.'
  answer: \sum_{n=0}^\infty \frac{(-1)^n x^{2n}}{n!}
  solutionOutline: We know the Maclaurin series for e^u is \sum_{n=0}^\infty \frac{u^n}{n!}. Substituting u = -x^2 gives \sum_{n=0}^\infty \frac{(-x^2)^n}{n!} = \sum_{n=0}^\infty \frac{(-1)^n x^{2n}}{n!}.
- id: calc2-diffeq-sep-01
  concept: Separable Differential Equations
  difficulty: 3
  source: Stewart Calculus Chapter 9 Adaptation
  prompt: 'Solve the initial value problem: \frac{dy}{dx} = xy, y(0) = 5.'
  answer: y = 5e^{x^2/2}
  solutionOutline: Separate variables: \frac{dy}{y} = x \, dx. Integrate both sides: \ln|y| = \frac{1}{2}x^2 + C. Then |y| = e^C e^{x^2/2}. Let A = \pm e^C, so y = Ae^{x^2/2}. Using y(0)=5 gives 5 = A. Thus, y = 5e^{x^2/2}.
- id: calc2-diffeq-linear-01
  concept: First-Order Linear Equations
  difficulty: 4
  source: Stewart Calculus Chapter 9 Adaptation
  prompt: 'Solve the linear differential equation: \frac{dy}{dx} + \frac{2}{x}y = 3x'
  answer: y = \frac{3}{4}x^2 + \frac{C}{x^2}
  solutionOutline: Standard form with P(x) = 2/x. Integrating factor I(x) = e^{\int \frac{2}{x} dx} = e^{2\ln x} = x^2. Multiply by x^2: x^2 y' + 2xy = 3x^3. This is \frac{d}{dx}(x^2 y) = 3x^3. Integrating gives x^2 y = \frac{3}{4}x^4 + C. Thus y = \frac{3}{4}x^2 + Cx^{-2}.
- id: calc2-adv-int-01
  concept: Advanced Integration Techniques
  difficulty: 5
  source: 100+1 Problems in Advanced Calculus Adaptation
  prompt: 'Evaluate \int_0^\infty \frac{\ln x}{1+x^2} \, dx'
  answer: '0'
  solutionOutline: Substitute x = 1/u, dx = -1/u^2 \, du. The bounds become \infty to 0. The integral transforms into \int_\infty^0 \frac{\ln(1/u)}{1+1/u^2} (-1/u^2) \, du = \int_0^\infty \frac{-\ln u}{u^2+1} \, du. Thus I = -I, meaning 2I = 0, so I = 0.
