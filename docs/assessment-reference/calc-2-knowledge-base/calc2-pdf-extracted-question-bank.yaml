metadata:
  title: Calc2 PDF Extracted Question Bank
  description: Extracted questions from PDF references.
  tags:
  - calculus-2
items:
- id: pdf-taylor-001
  concept: Taylor Polynomials
  difficulty: 2
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: "Find the Taylor polynomial for $f(x) = \tan(x)$ of order 3 centered at $x = 0$."
- id: pdf-taylor-002
  concept: Taylor Polynomials
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: "Find the Taylor polynomial for $f(x) = \tan(x)$ of order 3 centered at $x = \\pi/4$."
- id: pdf-taylor-003
  concept: Taylor Series
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Find the Taylor series for $f(x) = \cos^2(x^3)$ about $x = 0$.
- id: pdf-taylor-004
  concept: Taylor Series
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Find the Taylor series for $f(x) = \frac{1}{1 - x - 6x^2}$ centered at $x = 0$.
- id: pdf-taylor-005
  concept: Taylor Series
  difficulty: 4
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Given that $f(x) = \sum_{n=0}^{\infty} \frac{(x-2)^n}{4^n}$, find the Taylor series for $f(x)$ centered at $x = 3$.
- id: pdf-taylor-006
  concept: Taylor Series
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Given that $f(x) = \sin(x^3)e^{3x}$, find $f^{(10)}(0)$.
- id: pdf-taylor-007
  concept: Taylor Series
  difficulty: 4
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Rewrite $\left(\sum_{k=0}^{\infty} \frac{(-1)^k x^{2k+1}}{(2k+1)!}\right)\left(\sum_{k=0}^{\infty} \frac{(-1)^k x^{2k}}{(2k)!}\right)$ as a single series, in other words as $\sum_{n=0}^{\infty} c_n x^n$.
- id: pdf-taylor-008
  concept: Series Evaluation
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Find the exact value of $\sum_{n=1}^{\infty} \frac{(-1)^n}{n 3^n}$.
- id: pdf-taylor-019
  concept: Series Evaluation
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Find the exact value of $\sum_{n=1}^{\infty} \frac{n+1}{n 3^n}$.
- id: pdf-taylor-021
  concept: Taylor Series
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    (a) Find the first three non-zero terms of the Taylor series of $f(x) = \sqrt{10-x}$ centered at 1.
    (b) Use the answer from part (a) to estimate $\int_1^{15/4} \sqrt{10-x} \, dx$.
- id: pdf-taylor-022
  concept: Taylor Series
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: "(a) Find the Taylor series for $f(x) = \arctan(x^3)$.\n(b) Use the answer from part (a) to find $f^{(15)}(0)$ (the fifteenth derivative evaluated at 0)."
- id: pdf-taylor-028
  concept: Taylor Polynomials
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Find $P_2(x)$, the Taylor polynomial of order 2, for $f(x) = e^{x^{3/2}-1}$ centered at $x = 1$.
- id: pdf-taylor-042
  concept: Taylor Polynomials
  difficulty: 4
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Find the second order Taylor polynomial for $f(x) = \sqrt{e^x + x}$ centered at $x = 0$.
- id: pdf-taylor-045
  concept: Taylor Series
  difficulty: 3
  source: |-
    166_quiz12_series_taylorseries.pdf
  prompt: |-
    Let $f(x) = x^2 e^{3x}$.
    (a) Find the Taylor series for $f(x)$ around $x = 0$.
    (b) Use the series expansion of $f(x)$ to find the value of $f^{(12)}(0)$.
- id: pdf-int-series-diffeq-001
  concept: Differentiation
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Evaluate $\frac{d}{dx} \left(e^{2x} \sinh^{-1}(\sqrt{x})\right)$.
- id: pdf-int-series-diffeq-002
  concept: Integration Techniques
  difficulty: 4
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Evaluate $\int \sqrt{1+x^2} \, dx$, using the substitution $x = \sinh(\theta)$.
- id: pdf-int-series-diffeq-003
  concept: Differential Equations
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Consider the differential equation $\frac{dy}{dx} = \frac{\ln(x)}{xy^2}$ for $x > 0$.
    (a) Find the general solution.
    (b) Find the solution satisfying the initial condition $y(1) = 4$.
- id: pdf-int-series-diffeq-004
  concept: Sequence Limits
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Find the limit of the sequence or state that it diverges: $\lim_{n \to \infty} \frac{(\ln(n))^2}{n}$.
- id: pdf-int-series-diffeq-005
  concept: Sequence Limits
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Find the limit of the sequence or state that it diverges: $\lim_{n \to \infty} n \sin(2/n)$.
- id: pdf-int-series-diffeq-006
  concept: Series Evaluation
  difficulty: 2
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Evaluate the series: $\sum_{n=2}^{\infty} (-1)^n \left(\frac{2}{3}\right)^n$.
- id: pdf-int-series-diffeq-007
  concept: Series Evaluation
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Evaluate the series: $\sum_{n=3}^{\infty} \frac{2}{n^2 - 1}$.
- id: pdf-int-series-diffeq-008
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Use the limit comparison test to determine whether the following series converges or diverges. Show all work to justify your answer: $\sum_{n=1}^{\infty} \frac{n^2 + 8}{4n^4 - n^2}$.
- id: pdf-int-series-diffeq-009
  concept: Convergence Tests
  difficulty: 2
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Determine whether the following series converge or diverge. Show all work to justify your answers: $\sum_{n=1}^{\infty} \frac{1}{n^{3/2}}$.
- id: pdf-int-series-diffeq-010
  concept: Convergence Tests
  difficulty: 2
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Determine whether the following series converge or diverge. Show all work to justify your answers: $\sum_{n=1}^{\infty} \cos(1/n)$.
- id: pdf-int-series-diffeq-011
  concept: Convergence Tests
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Determine whether the following series converge or diverge. Show all work to justify your answers: $\sum_{n=2}^{\infty} \frac{1}{n \ln(n)}$.
- id: pdf-int-series-diffeq-012
  concept: Alternating Series Error Bound
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Find the minimum $M$ that guarantees that $\left| \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{2n-1} - \sum_{n=1}^{M} \frac{(-1)^{n+1}}{2n-1} \right| < 0.01$.
- id: pdf-int-series-diffeq-013
  concept: Absolute and Conditional Convergence
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Determine whether the following series converge conditionally, converge absolutely, or diverge. Justify your answer: $\sum_{n=1}^{\infty} \frac{(-1)^n}{\sqrt{n}}$.
- id: pdf-int-series-diffeq-014
  concept: Absolute and Conditional Convergence
  difficulty: 3
  source: |-
    calc2_exam_int_series_diffeq.pdf
  prompt: |-
    Determine whether the following series converge conditionally, converge absolutely, or diverge. Justify your answer: $\sum_{n=1}^{\infty} \frac{(-1)^{n+1} \sin(n)}{5e^n}$.
- id: pdf-sampletest-001
  concept: Fundamental Theorem of Calculus
  difficulty: 3
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    Compute the derivative of $F(x) := \int_0^{x^2} \ln(1+t) \, dt$.
- id: pdf-sampletest-002
  concept: Integration Techniques
  difficulty: 2
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    Determine the integral: $\int (3-2x)^5 \, dx$.
- id: pdf-sampletest-003
  concept: Integration Techniques
  difficulty: 2
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    Determine the integral: $\int x e^{-x^2} \, dx$.
- id: pdf-sampletest-004
  concept: Integration Techniques
  difficulty: 3
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    Determine the integral: $\int \frac{e^{2x}}{e^x+1} \, dx$.
- id: pdf-sampletest-005
  concept: Logarithmic Differentiation
  difficulty: 3
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    (a) Express $x^{(x^2+1)}$ in terms of the $\ln$ and $\exp$ functions.
    (b) Differentiate $x^{(x^2+1)}$.
- id: pdf-sampletest-006
  concept: Area Between Curves
  difficulty: 3
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    (a) Sketch a graph of the region bounded by the curves $y=x^2$ and $x=y-2$.
    (b) Determine the area of the specified region.
- id: pdf-sampletest-007
  concept: Volumes of Revolution
  difficulty: 3
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    Using the Disk/Washer method, determine the volume of revolution, about the x-axis, of the region bounded by the curves $y=x^2$ and $x=y-2$.
- id: pdf-sampletest-008
  concept: Volumes of Revolution
  difficulty: 4
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    Using the Cylindrical Shell method, determine the volume of revolution about the y-axis of the region in the first quadrant which is bounded by the curves $y=x^2$ and $x=y-2$.
- id: pdf-sampletest-009
  concept: Arc Length
  difficulty: 3
  source: |-
    calc2_sampletest.pdf
  prompt: |-
    Determine the arclength of the curve given by the graph of $y = \frac{1}{3}(x^2+2)^{3/2}$ for $x=0$ to $x=1$.
- id: pdf-convtest-001
  concept: Convergence Tests
  difficulty: 2
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{1}{n^{1/2} + n^{3/2}}$ converges.
- id: pdf-convtest-002
  concept: Convergence Tests
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{1}{2^n - \sqrt{n}}$ converges.
- id: pdf-convtest-003
  concept: Convergence Tests
  difficulty: 2
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{5n^3 + 3\sqrt{n}}{2n - 17}$ converges.
- id: pdf-convtest-004
  concept: Convergence Tests
  difficulty: 2
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{5n^3 + 3\sqrt{n}}{2n^5 - 17}$ converges.
- id: pdf-convtest-005
  concept: Convergence Tests
  difficulty: 4
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \sqrt{n^2 + 1} \sin^2\left(\frac{1}{n}\right)$ converges.
- id: pdf-convtest-006
  concept: Convergence Tests
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=0}^{\infty} \frac{2^n + 3^n}{3^n + 4^n}$ converges.
- id: pdf-convtest-007
  concept: Root Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \left(\frac{n}{2n+1}\right)^n$ converges.
- id: pdf-convtest-008
  concept: Root Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{(\arctan(n))^n}{2^n}$ converges.
- id: pdf-convtest-009
  concept: Ratio Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{3^n}{n^{1000} e^n}$ converges.
- id: pdf-convtest-010
  concept: Ratio Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{(3n)!}{7^n n! (2n)!}$ converges.
- id: pdf-convtest-011
  concept: Telescoping Series
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    For the infinite series, determine whether it converges or diverges. Justify your answer: $\sum_{k=1}^{\infty} (\ln(k+2) - \ln(k))$.
- id: pdf-convtest-012
  concept: Limit Comparison Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    For the infinite series, determine whether it converges or diverges. Justify your answer: $\sum_{j=10}^{\infty} \frac{3j-2}{\sqrt{j^5+2j+4}}$.
- id: pdf-convtest-013
  concept: Comparison Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    For the infinite series, determine whether it converges or diverges. Justify your answer: $\sum_{r=1}^{\infty} \frac{5}{(3 - \sin(r))^r}$.
- id: pdf-convtest-014
  concept: Limit Comparison Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine if the following series converges or diverges. Indicate your method: $\sum_{n=1}^{\infty} \frac{n+20}{\sqrt{n^5 + n^2 + 15/n}}$.
- id: pdf-convtest-015
  concept: Root Test
  difficulty: 3
  source: convergencetestingofseries.pdf
  prompt: |-
    Determine if $S = \sum_{n=1}^{\infty} \frac{n^{n+1}}{(2n+1)^n}$ converges or diverges.
- id: pdf-convtests-001
  concept: Conditional and Absolute Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Determine if $\sum_{n=1}^{\infty} \frac{\cos(\pi/2 n)}{\sqrt{n}}$ diverges, converges conditionally, or converges absolutely.
- id: pdf-convtests-002
  concept: Conditional and Absolute Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Determine if $\sum_{n=3}^{\infty} \frac{(-1)^n}{n \ln n}$ diverges, converges conditionally, or converges absolutely.
- id: pdf-convtests-003
  concept: Conditional and Absolute Convergence
  difficulty: 2
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Determine if $\sum_{n=1}^{\infty} \frac{(-1)^n}{\sqrt{n} + n^2}$ diverges, converges conditionally, or converges absolutely.
- id: pdf-convtests-004
  concept: Radius of Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Find the radius of convergence for $\sum_{n=0}^{\infty} \frac{(n!)^2 x^n}{(2n)!}$.
- id: pdf-convtests-005
  concept: Radius of Convergence
  difficulty: 4
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Find the radius of convergence for $\sum_{n=1}^{\infty} x^n \left(1 + \frac{1}{n}\right)^{n^2}$.
- id: pdf-convtests-006
  concept: Radius of Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Find the radius of convergence for $\sum_{n=1}^{\infty} \frac{(nx^2)^n}{n!}$.
- id: pdf-convtests-007
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Find the interval of convergence for $\sum_{n=1}^{\infty} \frac{(2(x-1))^n}{n^2}$.
- id: pdf-convtests-008
  concept: Interval of Convergence
  difficulty: 4
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Determine the values of $x$ for which $\sum_{n=1}^{\infty} \frac{(x^2-5)^n}{n 4^n}$ converges.
- id: pdf-convtests-009
  concept: Power Series Representation
  difficulty: 2
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    For $|x| < 1$, find the power series for $\ln(1+x^2)$. (Hint: start with the derivative).
- id: pdf-convtests-010
  concept: Power Series Functions
  difficulty: 4
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Express $\sum_{n=0}^{\infty} n^2 x^n$ as a rational function (i.e., a ratio of polynomials). Then find the exact value of $\sum_{n=0}^{\infty} \frac{n^2}{2^n}$.
- id: pdf-convtests-011
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Find the radius and interval of convergence of the power series $\sum_{n=0}^{\infty} \frac{2^n}{n^2+1} (x-1)^n$.
- id: pdf-convtests-012
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Find the interval of convergence for $f(x) = \sum_{n=1}^{\infty} \frac{2(x+1)^n}{n^4 4^n}$.
- id: pdf-convtests-013
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Find the interval of convergence for $f(x) = \sum_{n=1}^{\infty} \frac{27(2-x)^{3n}}{8^n \sqrt{n}}$.
- id: pdf-convtests-014
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    convergence_series_tests.pdf
  prompt: |-
    Consider the power series $\sum_{k=0}^{\infty} \frac{2}{5^k \ln(2k+3)} (x+1)^k$.
    (a) Find the radius of convergence for the series. Justify your answer.
    (b) Find the interval of convergence (including endpoints) for the series. Justify your answer.
- id: pdf-moreseq-001
  concept: Recursive Sequences
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Given $a_0 = 137$ and $a_n = (n - 18)a_{n-1} + 3$, find $a_{20}$.
- id: pdf-moreseq-002
  concept: Recursive Sequence Limits
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Given $a_0 = 1$ and $a_n = \sqrt{1 + a_{n-1}}$ is a sequence which converges (you don't have to prove convergence); determine the limit of the sequence.
- id: pdf-moreseq-003
  concept: Telescoping Series
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Find the sum of the series: $\sum_{n=2}^{\infty} \frac{6}{4n^2 - 9}$.
- id: pdf-moreseq-004
  concept: Series Evaluation
  difficulty: 4
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Find the sum of the series: $\sum_{n=1}^{\infty} \frac{3}{(n+3)\sqrt{n} + n\sqrt{n+3}}$.
- id: pdf-moreseq-005
  concept: Geometric Series
  difficulty: 2
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Find the sum of the series: $\sum_{n=0}^{\infty} \frac{3^n + 4^n}{5^n}$.
- id: pdf-moreseq-006
  concept: Series Evaluation
  difficulty: 4
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Suppose that $\{a_n\}_{n=0}^{\infty} = \{ 1, 3, 3/4, 9/4, 9/16, 27/16, \dots \}$, where we start with 1 and then alternate between multiplying by 3 and by 1/4. Find $\sum_{n=0}^{\infty} a_n$.
- id: pdf-moreseq-007
  concept: Power Series
  difficulty: 2
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    For $|x| < 1$, find the sum: $\sum_{n=0}^{\infty} (-1)^n x^{2n}$.
- id: pdf-moreseq-008
  concept: Divergence Test
  difficulty: 2
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Determine whether $\sum_{n=5}^{\infty} n \sin\left(\frac{1}{n}\right)$ converges.
- id: pdf-moreseq-009
  concept: Integral Test
  difficulty: 2
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Determine whether $\sum_{n=0}^{\infty} \frac{1}{n^2 + 1}$ converges.
- id: pdf-moreseq-010
  concept: Limit Comparison Test
  difficulty: 2
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Determine whether $\sum_{n=1}^{\infty} \frac{2n}{n^2 + 1}$ converges.
- id: pdf-moreseq-011
  concept: Telescoping Series
  difficulty: 4
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Find the value of $\sum_{n=1}^{\infty} \frac{(2n+5)! - (2n+1)!}{(2n+5)! \cdot (2n+1)!}$.
- id: pdf-moreseq-012
  concept: Series Evaluation
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Determine the value of the series: $\sum_{n=1}^{\infty} \left( \frac{4}{n^2+4n+3} - \frac{9^{-n+2}}{4^{n+1}} \right)$.
- id: pdf-moreseq-013
  concept: Telescoping Series
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Does the following series converge or diverge? If it converges, find its sum. $\sum_{n=1}^{\infty} \frac{2}{(2n-1)(2n+1)}$
- id: pdf-moreseq-014
  concept: Series Evaluation
  difficulty: 4
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Find the exact value of the series $\sum_{k=0}^{\infty} \frac{2+2k}{3^k}$.
- id: pdf-moreseq-015
  concept: Sequence Limits
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Find the limit of the sequence, or determine that it diverges:
    (a) $a_n = \left(1 + \frac{166}{n}\right)^n$
    (b) $a_n = \ln(n+1) - \ln(n)$
- id: pdf-moreseq-016
  concept: Integral Test Remainder
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: |-
    Use the integral test to determine how many terms are needed to approximate the sum of the series $\sum_{k=1}^{\infty} \frac{1}{k^2+1}$ with error less than $10^{-5}$.
- id: pdf-moreseq-017
  concept: Recursive Sequence Limits
  difficulty: 3
  source: moresequencesandseriesandconvergence.pdf
  prompt: "Let $a_n$ be the recursively defined sequence $a_0 = 2$ and for $n \\ge 1$ we have $a_n = 2 + \\frac{1}{a_{n-1}}$.\n(a) Write down $a_1, a_2, a_3, a_4$.\n(b) Determine $L$ so that $a_n \to L$ as $n \to \\infty$."
- id: pdf-myputnam-001
  concept: Double Integrals
  difficulty: 5
  source: myputnam.pdf
  prompt: |-
    Given that $\int_0^1 \frac{\ln(1+x)}{x} \, dx = \frac{\pi^2}{12}$, evaluate $\int_0^1 \int_0^y \frac{\ln(1+x)}{x} \, dx \, dy$.
- id: pdf-myputnam-002
  concept: Volume Geometry
  difficulty: 5
  source: myputnam.pdf
  prompt: |-
    Let $B$ be an $a \times b \times c$ rectangular brick. Let $C_1$ be the set of all points $p$ in $\mathbb{R}^3$ such that the minimum distance from $p$ to a point in $B$ is at most one. Find the volume of $C_1$.
- id: pdf-myputnam-003
  concept: Factorial Recurrence
  difficulty: 5
  source: myputnam.pdf
  prompt: |-
