schemaVersion: 1
bankId: calc2-alternating-series-olympiad
categoryId: calculus-2
topicIds: [alternating-series]
minimumItemCount: 30
items:
  - id: calc2-alt-oly-001
    topicId: alternating-series
    skills: [distinguish-absolute-from-alternating-convergence]
    archetype: hidden-quadratic-decay
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires simplifying a product denominator before choosing a convergence classification.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n(n+1)}$.
    choices: [{id: a, text: 'Absolutely convergent'}, {id: b, text: 'Conditionally convergent'}, {id: c, text: 'Divergent'}, {id: d, text: 'The alternating-series test is inconclusive'}]
    answer: {choiceId: a}
    solutionOutline: The absolute terms are bounded by $1/n^2$, so the signed series has the stronger absolute convergence property.
    commonTrap: Calling every convergent series with alternating signs conditionally convergent.
    verification: {method: p-series-absolute-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-002
    topicId: alternating-series
    skills: [analyze-radical-difference-series]
    archetype: telescoping-absolute-values
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires rationalizing the magnitudes and separately analyzing their unsigned partial sums.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Determine the strongest classification of
      $$\sum_{n=1}^{\infty}(-1)^{n-1}\left(\sqrt{n+1}-\sqrt n\right).$$
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent by the term test'}, {id: d, text: 'Divergent because its absolute series telescopes'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes decrease to zero after rationalization, while their unsigned partial sum is $\sqrt{N+1}-1$, which diverges.
    commonTrap: Assuming that telescoping automatically means convergence even when the surviving boundary grows.
    verification: {method: rationalized-ast-and-absolute-partial-sum, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-003
    topicId: alternating-series
    skills: [classify-parameterized-alternating-series]
    archetype: power-over-linear-parameter
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires deriving separate term, monotonicity, and absolute-convergence parameter thresholds.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For which real $\alpha$ is
      $\sum_{n=1}^{\infty}(-1)^{n-1}n^\alpha/(n+1)$ conditionally convergent?
    choices: [{id: a, text: '$0\le\alpha<1$'}, {id: b, text: '$\alpha<0$'}, {id: c, text: '$\alpha\ge1$'}, {id: d, text: '$-1<\alpha<0$'}]
    answer: {choiceId: a}
    solutionOutline: Signed convergence holds for $\alpha<1$ because the magnitudes eventually decrease to zero; absolute convergence holds exactly for $\alpha<0$.
    commonTrap: Losing the endpoint alpha equals zero, where the absolute terms remain harmonic-order.
    verification: {method: asymptotic-power-regime-analysis, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-004
    topicId: alternating-series
    skills: [analyze-logarithmic-parameter-series]
    archetype: logarithmic-p-threshold
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires combining eventual decrease with the logarithmic integral-test threshold.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For what $p$ is
      $\sum_{n=2}^{\infty}(-1)^n/[n(\ln n)^p]$ conditionally convergent?
    choices: [{id: a, text: '$p\le1$'}, {id: b, text: '$p>1$'}, {id: c, text: '$p>0$ only'}, {id: d, text: 'No real $p$'}]
    answer: {choiceId: a}
    solutionOutline: For every real p the magnitudes eventually decrease to zero, but the positive logarithmic p-series converges only for p greater than one.
    commonTrap: Assuming a negative p prevents the full term from tending to zero.
    verification: {method: eventual-derivative-and-log-integral-test, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-005
    topicId: alternating-series
    skills: [pair-alternating-series]
    archetype: alternating-harmonic-pairs
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires grouping consecutive terms and identifying the resulting positive series exactly.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Pair consecutive terms of the alternating harmonic series. Which positive
      series results?
    choices: [{id: a, text: '$\sum_{k=1}^{\infty}1/[(2k-1)(2k)]$'}, {id: b, text: '$\sum_{k=1}^{\infty}1/(2k)$'}, {id: c, text: '$\sum_{k=1}^{\infty}1/k^2$'}, {id: d, text: '$\sum_{k=1}^{\infty}1/(2k-1)$'}]
    answer: {choiceId: a}
    solutionOutline: Each pair is $1/(2k-1)-1/(2k)=1/[(2k-1)(2k)]$.
    commonTrap: Subtracting denominators rather than forming a common denominator.
    verification: {method: exact-pair-algebra, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-006
    topicId: alternating-series
    skills: [infer-remainder-sign-and-size]
    archetype: logarithm-partial-sum-bracket
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires using both parity and the first omitted term for a named series.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Let $S_N=\sum_{n=1}^{N}(-1)^{n-1}/n$. Which statement is true for
      every even $N$?
    choices: [{id: a, text: '$0<\ln2-S_N<1/(N+1)$'}, {id: b, text: '$0<S_N-\ln2<1/(N+1)$'}, {id: c, text: '$|\ln2-S_N|>1/(N+1)$'}, {id: d, text: '$S_N=\ln2$'}]
    answer: {choiceId: a}
    solutionOutline: Even partial sums lie below the limit, and the remainder magnitude is smaller than the next positive term.
    commonTrap: Reversing the parity-dependent overestimate and underestimate.
    verification: {method: alternating-bracketing-and-remainder-bound, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-007
    topicId: alternating-series
    skills: [apply-small-angle-asymptotics]
    archetype: inverse-trigonometric-magnitude
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires a small-angle comparison for absolute divergence.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^{n-1}\arctan(1/n)$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent'}, {id: d, text: 'Telescoping'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes decrease to zero, while $\arctan(1/n)/(1/n)\to1$, so their absolute sum is harmonic-order.
    commonTrap: Treating bounded arctangent values as evidence of absolute summability.
    verification: {method: ast-and-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-008
    topicId: alternating-series
    skills: [detect-absolute-convergence-from-cancellation-order]
    archetype: cosine-quadratic-decay
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires recognizing second-order small-angle decay.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      How does $\sum_{n=1}^{\infty}(-1)^n[1-\cos(1/n)]$ converge?
    choices: [{id: a, text: 'Absolutely'}, {id: b, text: 'Conditionally'}, {id: c, text: 'It diverges by the term test.'}, {id: d, text: 'The alternating-series test is the only available argument.'}]
    answer: {choiceId: a}
    solutionOutline: Since $1-\cos x\sim x^2/2$, the absolute terms are comparable to $1/(2n^2)$.
    commonTrap: Seeing an alternating sign and stopping after proving only ordinary convergence.
    verification: {method: cosine-small-angle-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-009
    topicId: alternating-series
    skills: [use-abel-summation-limits]
    archetype: grandi-abel-limit
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires distinguishing ordinary convergence from an Abel boundary value.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $0\le x<1$, let $F(x)=\sum_{n=0}^{\infty}(-1)^nx^n$. What is
      $\lim_{x\to1^-}F(x)$?
    choices: [{id: a, text: '$1/2$'}, {id: b, text: '$0$'}, {id: c, text: '$1$'}, {id: d, text: 'The limit diverges.'}]
    answer: {choiceId: a}
    solutionOutline: Inside its convergence interval the geometric sum is $1/(1+x)$, whose left boundary limit is one half.
    commonTrap: Claiming that this calculation makes the original Grandi series ordinarily convergent.
    verification: {method: geometric-function-and-abel-boundary, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-010
    topicId: alternating-series
    skills: [apply-dirichlets-test]
    archetype: periodic-zero-mean-coefficients
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires replacing simple alternation with bounded partial sums of a periodic coefficient.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Let $c_n$ repeat $1,-2,1$. What is the strongest classification of
      $\sum_{n=1}^{\infty}c_n/n$?
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent because signs do not alternate one by one'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient partial sums are bounded because each period sums to zero, so Dirichlet applies; the absolute terms dominate a positive-density harmonic subseries.
    commonTrap: Assuming the ordinary alternating-series test is the only cancellation theorem.
    verification: {method: dirichlet-and-residue-class-divergence, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-011
    topicId: alternating-series
    skills: [reason-from-convex-magnitudes]
    archetype: paired-term-bound
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires comparing paired differences using convexity rather than merely quoting AST.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Suppose $b_n>0$ decreases to zero. Why does grouping
      $(b_1-b_2)+(b_3-b_4)+\cdots$ preserve the alternating-series sum?
    choices: [{id: a, text: 'The grouped partial sums are the even partial sums of the original series.'}, {id: b, text: 'Every grouped term equals zero.'}, {id: c, text: 'The original series is absolutely convergent.'}, {id: d, text: 'Grouping is an arbitrary rearrangement.'}]
    answer: {choiceId: a}
    solutionOutline: The Nth grouped sum equals the original partial sum through index $2N$, and that subsequence approaches the same limit.
    commonTrap: Justifying grouping by absolute convergence, which need not hold.
    verification: {method: partial-sum-subsequence-identity, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-012
    topicId: alternating-series
    skills: [evaluate-remainder-thresholds-with-logarithms]
    archetype: implicit-discrete-error-bound
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires solving a nonlinear first-omitted-term inequality and checking adjacent integers.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $\sum_{n=2}^{\infty}(-1)^n/[n\ln n]$, which condition exactly
      guarantees $|R_N|<10^{-4}$ by the alternating estimate?
    choices: [{id: a, text: '$(N+1)\ln(N+1)>10^4$'}, {id: b, text: '$N\ln N\ge10^4$'}, {id: c, text: '$(N+1)\ln N<10^4$'}, {id: d, text: '$N>10^4$ is necessary and sufficient'}]
    answer: {choiceId: a}
    solutionOutline: The bound uses the first omitted magnitude $1/[(N+1)\ln(N+1)]$ and the requested inequality is strict.
    commonTrap: Substituting the last retained index or reversing the reciprocal inequality.
    verification: {method: exact-remainder-inequality, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-013
    topicId: alternating-series
    skills: [analyze-perturbed-alternating-magnitudes]
    archetype: harmonic-plus-summable-perturbation
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires decomposing a nonstandard summand into conditional and absolute components.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Classify
      $$\sum_{n=1}^{\infty}(-1)^{n-1}\left(\frac1n+\frac1{n^2}\right).$$
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent'}, {id: d, text: 'Telescoping'}]
    answer: {choiceId: a}
    solutionOutline: It is the sum of a conditional alternating harmonic series and an absolutely convergent signed p-series; absolute values remain at least harmonic-order.
    commonTrap: Believing the added $1/n^2$ term upgrades the harmonic component to absolute convergence.
    verification: {method: component-decomposition-and-lower-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-014
    topicId: alternating-series
    skills: [test-monotonicity-hypotheses]
    archetype: nonmonotone-but-dirichlet
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing that a failed AST hypothesis does not itself prove divergence.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      A signed series has terms $a_n=(-1)^nb_n$ with $b_n\to0$, but $b_n$
      is not eventually decreasing. Which conclusion is logically valid?
    choices: [{id: a, text: 'The alternating-series test is inconclusive; another argument may still prove convergence.'}, {id: b, text: 'The series must diverge.'}, {id: c, text: 'The series must converge absolutely.'}, {id: d, text: 'The term test proves convergence.'}]
    answer: {choiceId: a}
    solutionOutline: Failure of a sufficient theorem's monotonicity hypothesis removes that theorem, not the possibility of convergence by Dirichlet, grouping, or another method.
    commonTrap: Treating failure to satisfy a test as proof of the opposite outcome.
    verification: {method: logical-theorem-hypothesis-analysis, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-015
    topicId: alternating-series
    skills: [compare-error-bounds-after-pairing]
    archetype: convergence-acceleration-by-pairs
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires comparing first-order original terms with second-order paired differences.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Why can pairing consecutive terms accelerate numerical approximation of
      the alternating harmonic series?
    choices: [{id: a, text: 'The paired terms are $1/[(2k-1)(2k)]$, of order $1/k^2$.'}, {id: b, text: 'Pairing changes its sum to zero.'}, {id: c, text: 'The original terms become geometric.'}, {id: d, text: 'Pairing makes the series finite.'}]
    answer: {choiceId: a}
    solutionOutline: Cancellation within each pair converts harmonic-order magnitudes to quadratic-order positive terms while preserving even partial sums.
    commonTrap: Assuming faster convergence must come from changing the value of the series.
    verification: {method: exact-pair-and-asymptotic-order, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-016
    topicId: alternating-series
    skills: [evaluate-alternating-zeta-values]
    archetype: even-zeta-parity-split
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires separating odd and even reciprocal-square contributions from the Basel sum.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^2}$.
    choices: [{id: a, text: '$\pi^2/12$'}, {id: b, text: '$\pi^2/6$'}, {id: c, text: '$\pi^2/8$'}, {id: d, text: '$\ln2$'}]
    answer: {choiceId: a}
    solutionOutline: Subtract twice the even reciprocal-square subseries from $\zeta(2)$ to get $(1-2^{1-2})\zeta(2)=\pi^2/12$.
    commonTrap: Assuming alternation merely halves the individual terms rather than subtracting the even-index contribution twice.
    verification: {method: odd-even-zeta-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-017
    topicId: alternating-series
    skills: [connect-power-series-and-alternating-constants]
    archetype: arctangent-boundary
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires identifying an endpoint value of the integrated geometric series.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is $\displaystyle1-\frac13+\frac15-\frac17+\cdots$?
    choices: [{id: a, text: '$\pi/4$'}, {id: b, text: '$\ln2$'}, {id: c, text: '$1/2$'}, {id: d, text: '$\pi/2$'}]
    answer: {choiceId: a}
    solutionOutline: Integrating $1/(1+x^2)=1-x^2+x^4-\cdots$ from zero to one gives $\arctan1=\pi/4$.
    commonTrap: Confusing the odd-denominator Gregory series with the alternating harmonic series.
    verification: {method: integrated-geometric-series-at-endpoint, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-018
    topicId: alternating-series
    skills: [shift-alternating-series-indices]
    archetype: missing-leading-term
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires aligning a shifted odd-denominator tail with a known constant.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\frac13-\frac15+\frac17-\frac19+\cdots$.
    choices: [{id: a, text: '$1-\pi/4$'}, {id: b, text: '$\pi/4$'}, {id: c, text: '$\pi/4-1$'}, {id: d, text: '$1/3$'}]
    answer: {choiceId: a}
    solutionOutline: The Gregory series is $1-(1/3-1/5+1/7-\cdots)=\pi/4$.
    commonTrap: Dropping the leading one without reversing the sign of the remaining tail.
    verification: {method: exact-series-tail-subtraction, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-019
    topicId: alternating-series
    skills: [classify-harmonic-number-series]
    archetype: slowly-varying-harmonic-magnitude
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires establishing eventual decrease of H_n/n and logarithmic-order absolute divergence.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=1}^{\infty}(-1)^{n-1}H_n/n$, where
      $H_n=1+1/2+\cdots+1/n$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent by the term test'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes eventually decrease to zero because $H_n=O(\ln n)$, while $\sum H_n/n$ dominates the harmonic series and diverges.
    commonTrap: Treating the unbounded numerator H_n as proof that the quotient fails to approach zero.
    verification: {method: harmonic-growth-and-eventual-monotonicity, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-020
    topicId: alternating-series
    skills: [check-full-term-limits]
    archetype: harmonic-number-nonvanishing
    difficulty: olympiad
    reasoningDepth: 3
    difficultyEvidence: Requires rejecting a superficially alternating expression before applying cancellation.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What happens to $\sum_{n=1}^{\infty}(-1)^nH_n$?
    choices: [{id: a, text: 'It diverges by the term test.'}, {id: b, text: 'It converges conditionally.'}, {id: c, text: 'It converges absolutely.'}, {id: d, text: 'It sums to $\ln2$.'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes H_n grow rather than approach zero, so the series cannot converge.
    commonTrap: Believing that an alternating sign can compensate for terms of increasing magnitude.
    verification: {method: necessary-term-test, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-021
    topicId: alternating-series
    skills: [use-exact-harmonic-increments]
    archetype: difference-of-harmonic-numbers
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires simplifying a sequence difference before classification.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^{n-1}(H_{n+1}-H_n)$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent'}, {id: d, text: 'Finite'}]
    answer: {choiceId: a}
    solutionOutline: Since $H_{n+1}-H_n=1/(n+1)$, this is a shifted alternating harmonic series whose absolute series diverges.
    commonTrap: Assuming that every difference of adjacent sequence values telescopes after an alternating multiplier is introduced.
    verification: {method: exact-increment-reduction, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-022
    topicId: alternating-series
    skills: [solve-large-error-thresholds]
    archetype: square-root-remainder-index
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires solving a strict first-omitted inequality at a large exact boundary.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $\sum_{n=1}^{\infty}(-1)^{n-1}/\sqrt n$, what is the least $N$
      for which the alternating estimate guarantees $|R_N|<10^{-3}$?
    choices: [{id: a, text: '$1{,}000{,}000$'}, {id: b, text: '$999{,}999$'}, {id: c, text: '$1000$'}, {id: d, text: '$1{,}000{,}001$'}]
    answer: {choiceId: a}
    solutionOutline: The strict condition $1/\sqrt{N+1}<10^{-3}$ requires $N+1>10^6$, so the least integer N is one million.
    commonTrap: Allowing equality at N equals 999999 despite the requested strict error.
    verification: {method: strict-square-root-threshold, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-023
    topicId: alternating-series
    skills: [analyze-modulated-harmonic-series]
    archetype: trigonometric-frequency-resonance
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires detecting the exceptional parameter where bounded oscillatory partial sums disappear.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $0\le\theta<2\pi$, when does
      $\sum_{n=1}^{\infty}(-1)^n\cos(n\theta)/n$ fail to converge?
    choices: [{id: a, text: 'Only when $\theta=\pi$'}, {id: b, text: 'Only when $\theta=0$'}, {id: c, text: 'For every $\theta$'}, {id: d, text: 'For no $\theta$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient is $\cos(n(\theta+\pi))$; its partial sums are bounded except when the frequency is a multiple of $2\pi$, which here occurs at theta equals pi and leaves the harmonic series.
    commonTrap: Testing theta equals zero because the cosine alone loses oscillation while forgetting the outside alternating factor.
    verification: {method: frequency-shift-and-dirichlet-exception, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-024
    topicId: alternating-series
    skills: [justify-integral-series-interchange]
    archetype: geometric-integral-representation
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires representing reciprocal terms as integrals and summing finite geometric partial sums safely.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Since $1/(n+1)=\int_0^1x^n\,dx$, what value follows for
      $\sum_{n=0}^{\infty}(-1)^n/(n+1)$?
    choices: [{id: a, text: '$\ln2$'}, {id: b, text: '$1/2$'}, {id: c, text: '$1$'}, {id: d, text: '$\pi/4$'}]
    answer: {choiceId: a}
    solutionOutline: Finite geometric sums integrate to a limit of $\int_0^1(1+x)^{-1}\,dx=\ln2$.
    commonTrap: Substituting x equals one into the geometric series before handling its endpoint convergence.
    verification: {method: finite-geometric-integral-limit, result: verified}
    reviewStatus: verified
  - id: calc2-alt-oly-025
    topicId: alternating-series
    skills: [analyze-infinite-bounded-displacement-permutations]
    archetype: swap-adjacent-pairs
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires distinguishing a structured infinite permutation from a sum-changing rearrangement.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Swap each adjacent pair in the alternating harmonic series:
      $$-\frac12+1-\frac14+\frac13-\frac16+\frac15-\cdots.$$
      What is its sum?
    choices: [{id: a, text: '$\ln2$'}, {id: b, text: '$-\ln2$'}, {id: c, text: '$0$'}, {id: d, text: 'It diverges.'}]
    answer: {choiceId: a}
    solutionOutline: Every even partial sum equals the corresponding even partial sum before the swaps, and the odd-even discrepancy is a single term tending to zero.
