schemaVersion: 1
bankId: calc2-arithmetic-series-easy
categoryId: calculus-2
topicIds: [arithmetic-series]
minimumItemCount: 30
items:
  - id: calc2-arith-easy-001
    topicId: arithmetic-series
    skills: [find-arithmetic-sequence-terms]
    archetype: nth-term-from-first-and-difference
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires translating the term number into n minus one equal steps.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      An arithmetic sequence has $a_1=7$ and common difference $4$. What is
      $a_{12}$?
    choices: [{id: a, text: '$51$'}, {id: b, text: '$55$'}, {id: c, text: '$48$'}, {id: d, text: '$44$'}]
    answer: {choiceId: a}
    solutionOutline: The twelfth term is $7+11(4)=51$ because there are eleven differences after the first term.
    commonTrap: Multiplying the common difference by twelve instead of eleven.
    verification: {method: arithmetic-nth-term-formula, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-002
    topicId: arithmetic-series
    skills: [identify-common-differences]
    archetype: recover-difference-from-two-terms
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires dividing the total change by the number of index gaps.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $a_3=11$ and $a_9=35$ in an arithmetic sequence, what is the common
      difference?
    choices: [{id: a, text: '$4$'}, {id: b, text: '$3$'}, {id: c, text: '$6$'}, {id: d, text: '$24$'}]
    answer: {choiceId: a}
    solutionOutline: Six equal steps separate indices three and nine, so $d=(35-11)/6=4$.
    commonTrap: Dividing by nine or by the number of listed terms rather than the index difference.
    verification: {method: two-term-difference-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-003
    topicId: arithmetic-series
    skills: [sum-finite-arithmetic-series]
    archetype: first-last-average
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires using both the number of terms and the endpoint average.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Find $5+8+11+\cdots+50$.
    choices: [{id: a, text: '$440$'}, {id: b, text: '$495$'}, {id: c, text: '$880$'}, {id: d, text: '$405$'}]
    answer: {choiceId: a}
    solutionOutline: Solving $5+(n-1)3=50$ gives sixteen terms, and the sum is $16(5+50)/2=440$.
    commonTrap: Counting fifteen differences as fifteen terms.
    verification: {method: endpoint-count-and-average, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-004
    topicId: arithmetic-series
    skills: [solve-arithmetic-sum-equations]
    archetype: unknown-number-of-terms
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires forming and solving a quadratic in the term count.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      How many terms of $3+7+11+\cdots$ have sum $528$?
    choices: [{id: a, text: '$16$'}, {id: b, text: '$15$'}, {id: c, text: '$18$'}, {id: d, text: '$12$'}]
    answer: {choiceId: a}
    solutionOutline: $S_n=n[2(3)+(n-1)4]/2=n(2n+1)=528$, whose positive integer solution is sixteen.
    commonTrap: Solving only for the final term and reporting it as the number of terms.
    verification: {method: quadratic-sum-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-005
    topicId: arithmetic-series
    skills: [insert-arithmetic-means]
    archetype: equal-spacing-between-endpoints
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires counting intervals after inserting terms.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Three arithmetic means are inserted between $2$ and $18$. What is the
      second inserted mean?
    choices: [{id: a, text: '$10$'}, {id: b, text: '$8$'}, {id: c, text: '$12$'}, {id: d, text: '$6$'}]
    answer: {choiceId: a}
    solutionOutline: Five total terms create four gaps, so the common difference is four and the sequence is 2, 6, 10, 14, 18.
    commonTrap: Dividing the endpoint difference by three inserted values instead of four gaps.
    verification: {method: interval-counting, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-006
    topicId: arithmetic-series
    skills: [translate-sigma-notation]
    archetype: linear-sigma-sum
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing a linear summand as an arithmetic sequence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{k=1}^{20}(3k-1)$.
    choices: [{id: a, text: '$610$'}, {id: b, text: '$590$'}, {id: c, text: '$620$'}, {id: d, text: '$60$'}]
    answer: {choiceId: a}
    solutionOutline: The terms run from two through fifty-nine, so the sum is $20(2+59)/2=610$.
    commonTrap: Substituting only the upper index into the summand.
    verification: {method: sigma-endpoint-average, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-007
    topicId: arithmetic-series
    skills: [recognize-recursive-arithmetic-sequences]
    archetype: recursive-to-explicit
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires identifying a constant additive recurrence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $a_1=-2$ and $a_{n+1}=a_n+5$, which explicit formula is correct?
    choices: [{id: a, text: '$a_n=5n-7$'}, {id: b, text: '$a_n=5n-2$'}, {id: c, text: '$a_n=-2(5)^{n-1}$'}, {id: d, text: '$a_n=3n$'}]
    answer: {choiceId: a}
    solutionOutline: $a_n=-2+5(n-1)=5n-7$.
    commonTrap: Forgetting that the first term occurs before any recurrence step.
    verification: {method: recursive-explicit-conversion, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-008
    topicId: arithmetic-series
    skills: [sum-consecutive-integers]
    archetype: inclusive-integer-range
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires inclusive counting and endpoint averaging.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the sum of all integers from $23$ through $67$, inclusive?
    choices: [{id: a, text: '$2025$'}, {id: b, text: '$1980$'}, {id: c, text: '$2070$'}, {id: d, text: '$3015$'}]
    answer: {choiceId: a}
    solutionOutline: There are $67-23+1=45$ integers with average $(23+67)/2=45$, giving 2025.
    commonTrap: Omitting the plus one in the inclusive count.
    verification: {method: inclusive-count-times-average, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-009
    topicId: arithmetic-series
    skills: [use-odd-number-sum-identities]
    archetype: first-n-odd-numbers
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing or deriving a standard arithmetic sum.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Find $1+3+5+\cdots+99$.
    choices: [{id: a, text: '$2500$'}, {id: b, text: '$2450$'}, {id: c, text: '$5000$'}, {id: d, text: '$99^2$'}]
    answer: {choiceId: a}
    solutionOutline: Ninety-nine is the fiftieth odd number, and the first fifty odd numbers sum to $50^2$.
    commonTrap: Treating ninety-nine as the number of terms.
    verification: {method: odd-number-index-and-square-identity, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-010
    topicId: arithmetic-series
    skills: [model-linear-growth-sums]
    archetype: weekly-savings
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires translating a word model into first term, difference, and count.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A student saves $12$ dollars in week one and $3$ dollars more each
      following week. How much is saved during the first $10$ weeks?
    choices: [{id: a, text: '$255$'}, {id: b, text: '$390$'}, {id: c, text: '$120$'}, {id: d, text: '$270$'}]
    answer: {choiceId: a}
    solutionOutline: The tenth deposit is $12+9(3)=39$, and ten deposits average $(12+39)/2=25.5$.
    commonTrap: Multiplying the tenth-week amount by ten.
    verification: {method: arithmetic-model-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-011
    topicId: arithmetic-series
    skills: [recover-terms-from-arithmetic-partial-sums]
    archetype: quadratic-partial-sum-difference
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires differencing a quadratic partial-sum formula.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $S_n=2n^2+n$ is the sum of the first n terms, what is $a_n$?
    choices: [{id: a, text: '$4n-1$'}, {id: b, text: '$2n+1$'}, {id: c, text: '$4n+1$'}, {id: d, text: '$2n^2+n$'}]
    answer: {choiceId: a}
    solutionOutline: $a_n=S_n-S_{n-1}=(2n^2+n)-[2(n-1)^2+n-1]=4n-1$.
    commonTrap: Differentiating the polynomial instead of taking an exact discrete difference.
    verification: {method: discrete-partial-sum-difference, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-012
    topicId: arithmetic-series
    skills: [find-middle-terms]
    archetype: arithmetic-sequence-average
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires using equal spacing around the middle term.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      In an arithmetic sequence, $a_4=17$ and $a_{10}=41$. What is $a_7$?
    choices: [{id: a, text: '$29$'}, {id: b, text: '$24$'}, {id: c, text: '$31$'}, {id: d, text: '$28$'}]
    answer: {choiceId: a}
    solutionOutline: Index seven is midway between four and ten, so its value is the average $(17+41)/2=29$.
    commonTrap: Averaging the indices but not the corresponding term values.
    verification: {method: midpoint-linearity, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-013
    topicId: arithmetic-series
    skills: [distinguish-sequences-and-series]
    archetype: term-versus-sum
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires distinguishing a_n from S_n.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which expression gives the sum of the first n terms of an arithmetic
      sequence?
    choices: [{id: a, text: '$S_n=n(a_1+a_n)/2$'}, {id: b, text: '$S_n=a_1+(n-1)d$'}, {id: c, text: '$S_n=a_1d^{n-1}$'}, {id: d, text: '$S_n=a_n-a_1$'}]
    answer: {choiceId: a}
    solutionOutline: Pairing the first and last terms shows that their average is $(a_1+a_n)/2$ across n terms.
    commonTrap: Selecting the nth-term formula instead of the finite-sum formula.
    verification: {method: endpoint-pairing-formula, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-014
    topicId: arithmetic-series
    skills: [solve-for-first-terms]
    archetype: known-sum-and-last-term
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires rearranging the endpoint-average sum formula.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      An arithmetic series has $20$ terms, last term $61$, and sum $800$.
      What is its first term?
    choices: [{id: a, text: '$19$'}, {id: b, text: '$20$'}, {id: c, text: '$21$'}, {id: d, text: '$39$'}]
    answer: {choiceId: a}
    solutionOutline: $800=20(a_1+61)/2$ gives $a_1+61=80$, so $a_1=19$.
    commonTrap: Dividing by twenty but forgetting the factor one half.
    verification: {method: solve-endpoint-sum-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-015
    topicId: arithmetic-series
    skills: [classify-infinite-arithmetic-series]
    archetype: nonzero-common-difference-infinite-sum
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires connecting arithmetic term behavior with the necessary series condition.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Can an infinite arithmetic series with nonzero common difference
      converge?
    choices: [{id: a, text: 'No; its terms cannot approach zero.'}, {id: b, text: 'Yes, whenever $|d|<1$.'}, {id: c, text: 'Yes, if d is negative.'}, {id: d, text: 'Yes, by the finite arithmetic sum formula.'}]
    answer: {choiceId: a}
    solutionOutline: Arithmetic terms change linearly and therefore cannot tend to zero indefinitely unless the sequence is constantly zero.
    commonTrap: Applying the geometric ratio condition to an additive common difference.
    verification: {method: term-test-for-arithmetic-progressions, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-016
    topicId: arithmetic-series
    skills: [recover-first-terms]
    archetype: nth-term-backsolve
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires reversing a known number of common-difference steps.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      An arithmetic sequence has $a_8=31$ and $d=3$. What is $a_1$?
    choices: [{id: a, text: '$10$'}, {id: b, text: '$7$'}, {id: c, text: '$28$'}, {id: d, text: '$4$'}]
    answer: {choiceId: a}
    solutionOutline: Seven differences separate the first and eighth terms, so $a_1=31-7(3)=10$.
    commonTrap: Subtracting eight common differences.
    verification: {method: reverse-nth-term-formula, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-017
    topicId: arithmetic-series
    skills: [solve-for-term-indices]
    archetype: target-value-index
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires solving a linear equation and interpreting the index.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      In the sequence $14,19,24,\ldots$, which term is $104$?
    choices: [{id: a, text: 'The 19th term'}, {id: b, text: 'The 18th term'}, {id: c, text: 'The 20th term'}, {id: d, text: 'The 21st term'}]
    answer: {choiceId: a}
    solutionOutline: Solve $14+5(n-1)=104$, giving $n-1=18$ and n equals nineteen.
    commonTrap: Reporting the number of differences, eighteen, as the term index.
    verification: {method: linear-index-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-018
    topicId: arithmetic-series
    skills: [sum-multiples-in-ranges]
    archetype: bounded-multiples
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires locating the first and last qualifying multiples and counting them.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Find the sum of all positive multiples of $7$ below $100$.
    choices: [{id: a, text: '$735$'}, {id: b, text: '$700$'}, {id: c, text: '$749$'}, {id: d, text: '$686$'}]
    answer: {choiceId: a}
    solutionOutline: The terms are $7$ through $98=14\cdot7$, so the sum is $14(7+98)/2=735$.
    commonTrap: Including 105 or treating 100 as an endpoint term.
    verification: {method: multiple-count-and-arithmetic-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-019
    topicId: arithmetic-series
    skills: [model-row-capacity]
    archetype: stadium-seating
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires translating incremental row sizes into a total.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      A theater has $18$ seats in its first row and two more seats in each
      successive row. How many seats are in the first $25$ rows?
    choices: [{id: a, text: '$1050$'}, {id: b, text: '$1650$'}, {id: c, text: '$900$'}, {id: d, text: '$1125$'}]
    answer: {choiceId: a}
    solutionOutline: The last row has $18+24(2)=66$ seats, and the total is $25(18+66)/2=1050$.
    commonTrap: Multiplying the final row capacity by the number of rows.
    verification: {method: linear-row-model-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-020
    topicId: arithmetic-series
    skills: [use-arithmetic-sequence-averages]
    archetype: odd-count-middle-term
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires using symmetry of an odd number of equally spaced values.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What is the average of the first $21$ terms of an arithmetic sequence?
    choices: [{id: a, text: '$a_{11}$'}, {id: b, text: '$a_{10}$'}, {id: c, text: '$a_{21}/2$'}, {id: d, text: '$a_1+a_{21}$'}]
    answer: {choiceId: a}
    solutionOutline: With an odd count, paired endpoints average to the unique middle term, whose index is eleven.
    commonTrap: Dividing the number of terms by two without accounting for the central position.
    verification: {method: symmetric-pair-average, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-021
    topicId: arithmetic-series
    skills: [sum-symmetric-arithmetic-terms]
    archetype: terms-around-zero
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing pairwise cancellation.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate $-30,-25,-20,\ldots,25,30$ as a finite sum.
    choices: [{id: a, text: '$0$'}, {id: b, text: '$30$'}, {id: c, text: '$-30$'}, {id: d, text: '$390$'}]
    answer: {choiceId: a}
    solutionOutline: Every negative term pairs with its positive opposite, and the middle term is zero.
    commonTrap: Treating the comma-separated arithmetic progression as only its last term.
    verification: {method: symmetric-cancellation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-022
    topicId: arithmetic-series
    skills: [solve-common-differences-from-sums]
    archetype: known-first-count-and-sum
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires substituting the nth-term expression into the sum formula.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      An arithmetic series has $a_1=4$, $n=12$, and $S_{12}=378$. What is
      the common difference?
    choices: [{id: a, text: '$5$'}, {id: b, text: '$4$'}, {id: c, text: '$6$'}, {id: d, text: '$7$'}]
    answer: {choiceId: a}
    solutionOutline: $378=12[8+11d]/2=6(8+11d)$ gives $d=5$.
    commonTrap: Using twelve d increments instead of eleven.
    verification: {method: solve-sum-parameter-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-023
    topicId: arithmetic-series
    skills: [evaluate-shifted-sigma-sums]
    archetype: nonunit-lower-index
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires inclusive term counting with a shifted lower bound.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{k=4}^{18}(2k+3)$.
    choices: [{id: a, text: '$375$'}, {id: b, text: '$336$'}, {id: c, text: '$345$'}, {id: d, text: '$390$'}]
    answer: {choiceId: a}
    solutionOutline: There are fifteen terms, from eleven through thirty-nine, so the sum is $15(11+39)/2=375$.
    commonTrap: Treating eighteen as the number of terms.
    verification: {method: shifted-index-count-and-average, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-024
    topicId: arithmetic-series
    skills: [insert-arithmetic-means]
    archetype: count-inserted-values
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires translating a desired difference into interval and insertion counts.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      How many arithmetic means must be inserted between $5$ and $41$ so the
      common difference is $6$?
    choices: [{id: a, text: '$5$'}, {id: b, text: '$6$'}, {id: c, text: '$4$'}, {id: d, text: '$7$'}]
    answer: {choiceId: a}
    solutionOutline: The endpoint difference creates six intervals of size six, so five interior terms are inserted.
    commonTrap: Reporting the six intervals as six inserted values.
    verification: {method: intervals-minus-one, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-025
    topicId: arithmetic-series
    skills: [sum-decreasing-arithmetic-series]
    archetype: negative-common-difference
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires retaining signs through endpoint and sum calculations.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Find the sum of the first $15$ terms of $40,37,34,\ldots$.
    choices: [{id: a, text: '$285$'}, {id: b, text: '$315$'}, {id: c, text: '$-285$'}, {id: d, text: '$570$'}]
    answer: {choiceId: a}
    solutionOutline: The fifteenth term is $40+14(-3)=-2$, so the sum is $15(40-2)/2=285$.
    commonTrap: Dropping the negative sign of the common difference.
    verification: {method: signed-endpoint-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-026
    topicId: arithmetic-series
    skills: [recover-terms-from-partial-sums]
    archetype: consecutive-partial-sum-values
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires using the defining difference between consecutive partial sums.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      If $S_{14}=210$ and $S_{13}=182$, what is $a_{14}$?
    choices: [{id: a, text: '$28$'}, {id: b, text: '$14$'}, {id: c, text: '$392$'}, {id: d, text: '$26$'}]
    answer: {choiceId: a}
    solutionOutline: The new term added between the two partial sums is $a_{14}=210-182=28$.
    commonTrap: Dividing the total by the index instead of differencing partial sums.
    verification: {method: partial-sum-increment, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-027
    topicId: arithmetic-series
    skills: [sum-even-number-progressions]
    archetype: first-n-even-numbers
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires connecting a simple progression to a closed form.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What is $2+4+6+\cdots+80$?
    choices: [{id: a, text: '$1640$'}, {id: b, text: '$1600$'}, {id: c, text: '$3240$'}, {id: d, text: '$820$'}]
    answer: {choiceId: a}
    solutionOutline: There are forty terms, so the sum is $40(2+80)/2=1640$.
    commonTrap: Treating eighty as the number of terms.
    verification: {method: even-term-count-and-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-028
    topicId: arithmetic-series
    skills: [model-constant-depreciation]
    archetype: yearly-value-loss
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires distinguishing a term value from a cumulative sum.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      A machine is worth $50{,}000$ initially and loses $3{,}500$ in value
      each year. What is its value after $8$ yearly losses?
    choices: [{id: a, text: '$22{,}000$'}, {id: b, text: '$25{,}500$'}, {id: c, text: '$28{,}000$'}, {id: d, text: '$78{,}000$'}]
    answer: {choiceId: a}
    solutionOutline: Eight constant losses total $8(3500)=28000$, leaving 22000.
    commonTrap: Using seven losses because an nth-term formula often contains n minus one.
    verification: {method: explicit-event-count-model, result: verified}
    reviewStatus: verified
  - id: calc2-arith-easy-029
    topicId: arithmetic-series
    skills: [justify-arithmetic-sum-formulas]
    archetype: reverse-and-add-proof
    difficulty: intermediate
    reasoningDepth: 3
