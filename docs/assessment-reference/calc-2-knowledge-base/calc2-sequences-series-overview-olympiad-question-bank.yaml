schemaVersion: 1
bankId: calc2-sequences-series-overview-olympiad
categoryId: calculus-2
topicIds: [sequences-series]
minimumItemCount: 30
items:
  - id: calc2-overview-oly-001
    topicId: sequences-series
    skills: [analyze-renormalized-partial-sums]
    archetype: euler-constant-sequence
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires proving monotonicity and boundedness after subtracting logarithmic growth.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      The sequence $a_n=H_n-\ln n$ converges to Euler's constant $\gamma$.
      Which related series therefore converges to $\gamma$?
    choices: [{id: a, text: '$1+\sum_{n=2}^{\infty}[1/n-\ln(1+1/(n-1))]$'}, {id: b, text: '$\sum_{n=1}^{\infty}1/n$'}, {id: c, text: '$\sum_{n=1}^{\infty}\ln(1+1/n)$'}, {id: d, text: '$\sum_{n=1}^{\infty}(H_n-\ln n)$'}]
    answer: {choiceId: a}
    solutionOutline: The Nth partial sum of the first expression is $H_N-\ln N$, since the logarithms telescope.
    commonTrap: Confusing a convergent sequence of renormalized values with the series formed by adding all those values.
    verification: {method: exact-partial-sum-identification, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-002
    topicId: sequences-series
    skills: [evaluate-higher-order-telescoping-series]
    archetype: three-consecutive-factors
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires discovering a scaled difference of adjacent rational terms.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac1{n(n+1)(n+2)}$.
    choices: [{id: a, text: '$1/4$'}, {id: b, text: '$1/2$'}, {id: c, text: '$1$'}, {id: d, text: '$1/6$'}]
    answer: {choiceId: a}
    solutionOutline: The summand is one half of $1/[n(n+1)]-1/[(n+1)(n+2)]$, leaving one fourth.
    commonTrap: Omitting the factor one half in the adjacent-difference identity.
    verification: {method: exact-scaled-telescoping, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-003
    topicId: sequences-series
    skills: [apply-cauchy-condensation]
    archetype: logarithmic-harmonic-boundary
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires condensing a positive decreasing series and simplifying its dyadic terms.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What does Cauchy condensation show about
      $\sum_{n=2}^{\infty}1/[n\ln n]$?
    choices: [{id: a, text: 'It diverges because its condensed series is a constant multiple of the harmonic series.'}, {id: b, text: 'It converges geometrically.'}, {id: c, text: 'It converges because its terms approach zero.'}, {id: d, text: 'Condensation is inconclusive.'}]
    answer: {choiceId: a}
    solutionOutline: At $n=2^k$, the condensed term is $2^k/[2^k\ln(2^k)]=1/(k\ln2)$.
    commonTrap: Treating the power-of-two sampling as though it discarded the block-size multiplier.
    verification: {method: cauchy-condensation-computation, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-004
    topicId: sequences-series
    skills: [classify-radical-increment-series]
    archetype: rationalized-asymptotic-product
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires rationalizing a difference and combining two growth factors.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=1}^{\infty}\frac{\sqrt{n+1}-\sqrt n}{n}$.
    choices: [{id: a, text: 'Convergent'}, {id: b, text: 'Divergent like the harmonic series'}, {id: c, text: 'Conditionally convergent'}, {id: d, text: 'Divergent by the term test'}]
    answer: {choiceId: a}
    solutionOutline: Rationalization makes the term $1/[n(\sqrt{n+1}+\sqrt n)]$, comparable to $1/(2n^{3/2})$.
    commonTrap: Seeing a telescoping-looking numerator and ignoring the additional division by n.
    verification: {method: rationalization-and-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-005
    topicId: sequences-series
    skills: [classify-two-parameter-series]
    archetype: rational-power-regime
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires reducing a two-parameter term to its asymptotic power and solving the threshold inequality.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For which real $p,q$ does
      $\sum_{n=1}^{\infty}n^p/(n+1)^q$ converge?
    choices: [{id: a, text: '$q-p>1$'}, {id: b, text: '$q-p\ge1$'}, {id: c, text: '$p+q>1$'}, {id: d, text: '$p<q$'}]
    answer: {choiceId: a}
    solutionOutline: The term is asymptotic to $n^{p-q}=1/n^{q-p}$, so the p-series exponent must exceed one.
    commonTrap: Using mere term decay q greater than p instead of the stricter summability threshold.
    verification: {method: asymptotic-p-series-regime, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-006
    topicId: sequences-series
    skills: [apply-the-limsup-root-test]
    archetype: nonexisting-root-limit
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires using limsup when the ordinary nth-root limit does not exist.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $\limsup_{n\to\infty}|a_n|^{1/n}=3/4$, what is guaranteed about
      $\sum a_n$?
    choices: [{id: a, text: 'It converges absolutely.'}, {id: b, text: 'It converges conditionally only.'}, {id: c, text: 'It diverges.'}, {id: d, text: 'Nothing can be concluded.'}]
    answer: {choiceId: a}
    solutionOutline: A limsup root strictly below one gives an eventual geometric upper bound for the absolute terms.
    commonTrap: Believing the root test requires an ordinary limit to exist.
    verification: {method: limsup-root-test, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-007
    topicId: sequences-series
    skills: [reason-about-cauchy-products]
    archetype: absolutely-convergent-product
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires applying the correct theorem hypothesis to a convolution of coefficients.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Suppose $\sum a_n=A$ and $\sum b_n=B$ converge absolutely. For
      $c_n=\sum_{k=0}^{n}a_kb_{n-k}$, what is $\sum c_n$?
    choices: [{id: a, text: '$AB$'}, {id: b, text: '$A+B$'}, {id: c, text: '$0$'}, {id: d, text: 'It need not converge.'}]
    answer: {choiceId: a}
    solutionOutline: Absolute convergence justifies regrouping the double sum, and the Cauchy product theorem gives the product of the sums.
    commonTrap: Applying finite polynomial multiplication without naming the convergence condition that validates regrouping.
    verification: {method: absolute-cauchy-product-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-008
    topicId: sequences-series
    skills: [construct-series-from-prescribed-partial-sums]
    archetype: convergent-oscillatory-partial-sum
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires reading both the sum and term behavior from a prescribed partial-sum sequence.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Let $S_n=2+(-1)^n/n$ and define $a_1=S_1$,
      $a_n=S_n-S_{n-1}$. What is $\sum a_n$?
    choices: [{id: a, text: '$2$'}, {id: b, text: '$0$'}, {id: c, text: '$-1$'}, {id: d, text: 'Divergent'}]
    answer: {choiceId: a}
    solutionOutline: By construction, the Nth partial sum is exactly S_N, whose oscillatory correction tends to zero.
    commonTrap: Mistaking the alternating correction for nonconvergence despite its shrinking magnitude.
    verification: {method: prescribed-partial-sum-limit, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-009
    topicId: sequences-series
    skills: [analyze-block-series]
    archetype: dyadic-block-mass
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires aggregating many small terms over growing blocks.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Define $a_n=2^{-k}$ whenever $2^k\le n<2^{k+1}$. What happens to
      $\sum_{n=1}^{\infty}a_n$?
    choices: [{id: a, text: 'It diverges because every dyadic block has sum $1$.'}, {id: b, text: 'It converges because $a_n\to0$.'}, {id: c, text: 'It converges geometrically.'}, {id: d, text: 'It alternates.'}]
    answer: {choiceId: a}
    solutionOutline: The kth block contains $2^k$ terms, each equal to $2^{-k}$, so block-boundary partial sums grow by one forever.
    commonTrap: Looking at individual term decay without accounting for the number of terms at each scale.
    verification: {method: exact-dyadic-block-sums, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-010
    topicId: sequences-series
    skills: [use-summation-by-parts]
    archetype: bounded-partial-sums-times-decreasing-weight
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing the discrete integration-by-parts structure behind Dirichlet's test.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If the partial sums $A_n=\sum_{k=1}^{n}a_k$ are bounded and
      $b_n\downarrow0$, what can be concluded about $\sum a_nb_n$?
    choices: [{id: a, text: 'It converges.'}, {id: b, text: 'It converges absolutely.'}, {id: c, text: 'It diverges.'}, {id: d, text: 'It has nonzero terms and therefore diverges.'}]
    answer: {choiceId: a}
    solutionOutline: Summation by parts writes each tail using bounded A_n and the summable positive differences $b_n-b_{n+1}$.
    commonTrap: Upgrading Dirichlet convergence to absolute convergence without a bound on the absolute coefficient sums.
    verification: {method: dirichlet-via-summation-by-parts, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-011
    topicId: sequences-series
    skills: [identify-convergence-from-tail-asymptotics]
    archetype: ratio-to-harmonic-correction
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires canceling leading harmonic behavior and identifying the next asymptotic order.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}[1/n-\ln(1+1/n)]$.
    choices: [{id: a, text: 'Convergent'}, {id: b, text: 'Divergent like $\sum1/n$'}, {id: c, text: 'Conditionally convergent'}, {id: d, text: 'Divergent by the term test'}]
    answer: {choiceId: a}
    solutionOutline: The logarithm expansion gives $1/n-\ln(1+1/n)\sim1/(2n^2)$; its partial sums also equal $H_N-\ln(N+1)$.
    commonTrap: Comparing each component separately and ignoring their leading-order cancellation.
    verification: {method: asymptotic-cancellation-and-partial-sums, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-012
    topicId: sequences-series
    skills: [analyze-series-under-rearrangement]
    archetype: absolute-order-invariance
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires distinguishing arbitrary permutations from finite regrouping.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Which hypothesis guarantees that every permutation of $\sum a_n$
      converges to the same sum?
    choices: [{id: a, text: 'Absolute convergence'}, {id: b, text: '$a_n\to0$'}, {id: c, text: 'Bounded terms'}, {id: d, text: 'Conditional convergence'}]
    answer: {choiceId: a}
    solutionOutline: Absolute convergence controls all omitted absolute mass and makes the sum invariant under arbitrary reordering.
    commonTrap: Treating the necessary term condition as a guarantee of order independence.
    verification: {method: rearrangement-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-013
    topicId: sequences-series
    skills: [test-convergence-of-sparse-series]
    archetype: power-of-two-support
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires reindexing a sparse series rather than comparing by its ambient index formula.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Let $a_n=1/n$ when $n$ is a power of two and $a_n=0$ otherwise.
      What is $\sum a_n$?
    choices: [{id: a, text: '$2$'}, {id: b, text: 'Divergent'}, {id: c, text: '$1$'}, {id: d, text: '$\ln2$'}]
    answer: {choiceId: a}
    solutionOutline: Reindexing the nonzero terms gives $\sum_{k=0}^{\infty}2^{-k}=2$.
    commonTrap: Comparing with the full harmonic series and assuming every subseries diverges.
    verification: {method: sparse-support-reindexing, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-014
    topicId: sequences-series
    skills: [interpret-series-of-sequence-differences]
    archetype: total-variation-question
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires separating convergence of signed increments from absolute summability of increments.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $b_n\to L$, what is guaranteed about
      $\sum_{n=1}^{\infty}(b_{n+1}-b_n)$?
    choices: [{id: a, text: 'It converges to $L-b_1$.'}, {id: b, text: 'It converges absolutely.'}, {id: c, text: 'It diverges unless $L=0$.'}, {id: d, text: 'It sums to $L$.'}]
    answer: {choiceId: a}
    solutionOutline: The finite sum telescopes to $b_{N+1}-b_1$; absolute convergence would additionally require finite total variation and is not automatic.
    commonTrap: Assuming telescoping also proves absolute convergence.
    verification: {method: endpoint-limit-with-variation-distinction, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-015
    topicId: sequences-series
    skills: [derive-geometric-series-from-functional-equations]
    archetype: self-similar-sum
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires setting up a self-similarity equation rather than directly quoting the formula.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Let $S=1+x+x^2+\cdots$ for $|x|<1$. Which equation determines S?
    choices: [{id: a, text: '$S=1+xS$'}, {id: b, text: '$S=x+S$'}, {id: c, text: '$S=1+x+S$'}, {id: d, text: '$xS=1$'}]
    answer: {choiceId: a}
    solutionOutline: Multiplying by x shifts every term one place, so subtracting xS from S leaves the initial one.
    commonTrap: Manipulating the infinite expression without preserving the shifted index structure.
    verification: {method: convergent-series-shift-identity, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-016
    topicId: sequences-series
    skills: [evaluate-binomial-denominator-series]
    archetype: reciprocal-triangular-telescoping
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires rewriting a binomial coefficient and discovering an exact difference.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=2}^{\infty}\frac1{\binom n2}$.
    choices: [{id: a, text: '$2$'}, {id: b, text: '$1$'}, {id: c, text: '$\pi^2/6$'}, {id: d, text: 'Diverges'}]
    answer: {choiceId: a}
    solutionOutline: The term is $2/[n(n-1)]=2[1/(n-1)-1/n]$, so the partial sums approach two.
    commonTrap: Comparing with $1/n^2$ and proving convergence without finding the requested exact value.
    verification: {method: binomial-expansion-and-telescoping, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-017
    topicId: sequences-series
    skills: [use-generating-functions-for-harmonic-numbers]
    archetype: harmonic-geometric-convolution
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires reversing summation order in a nonnegative double series.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Find $\displaystyle\sum_{n=1}^{\infty}H_n/2^n$.
    choices: [{id: a, text: '$2\ln2$'}, {id: b, text: '$\ln2$'}, {id: c, text: '$2$'}, {id: d, text: '$\pi^2/12$'}]
    answer: {choiceId: a}
    solutionOutline: For $|x|<1$, reversing the nonnegative sums gives $\sum H_nx^n=[-\ln(1-x)]/(1-x)$; substituting one half gives $2\ln2$.
    commonTrap: Replacing H_n by its limit, even though the harmonic numbers do not converge.
    verification: {method: tonelli-geometric-tail-summation, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-018
    topicId: sequences-series
    skills: [apply-tonellis-theorem]
    archetype: nonnegative-double-series
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires identifying when summation order is safe even before finiteness is known.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For nonnegative numbers $a_{m,n}$, which statement about
      $\sum_m\sum_n a_{m,n}$ and $\sum_n\sum_m a_{m,n}$ is correct?
    choices: [{id: a, text: 'They are equal in $[0,\infty]$, even if both diverge.'}, {id: b, text: 'They are equal only when finitely many entries are nonzero.'}, {id: c, text: 'Changing order always changes the value.'}, {id: d, text: 'They must both be finite.'}]
    answer: {choiceId: a}
    solutionOutline: Tonelli's theorem permits reordering nonnegative sums, with infinity allowed as the common value.
    commonTrap: Importing the absolute-convergence requirement for signed sums without using nonnegativity.
    verification: {method: tonelli-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-019
    topicId: sequences-series
    skills: [classify-central-binomial-ratio-series]
    archetype: factorial-ratio
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires simplifying a four-factor consecutive ratio.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      How does $\displaystyle\sum_{n=1}^{\infty}\frac{(n!)^2}{(2n)!}$
      behave?
    choices: [{id: a, text: 'It converges absolutely.'}, {id: b, text: 'It diverges harmonically.'}, {id: c, text: 'It is conditionally convergent.'}, {id: d, text: 'Its terms do not approach zero.'}]
    answer: {choiceId: a}
    solutionOutline: The consecutive ratio is $(n+1)^2/[(2n+2)(2n+1)]$, which tends to one fourth.
    commonTrap: Assuming the squared numerator factorial matches the denominator factorial in growth.
    verification: {method: factorial-ratio-test, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-020
    topicId: sequences-series
    skills: [connect-products-and-log-series]
    archetype: infinite-product-criterion
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires converting a positive infinite product to partial sums of logarithms.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $u_n>-1$, which finite identity underlies analysis of
      $\prod_{n=1}^{\infty}(1+u_n)$?
    choices: [{id: a, text: '$\ln\prod_{n=1}^{N}(1+u_n)=\sum_{n=1}^{N}\ln(1+u_n)$'}, {id: b, text: '$\prod(1+u_n)=1+\prod u_n$'}, {id: c, text: '$\ln(1+u_n)=u_n$ exactly'}, {id: d, text: 'Every such product converges'}]
    answer: {choiceId: a}
    solutionOutline: The logarithm turns each finite product into a finite sum; only after that identity is established should limits be taken.
    commonTrap: Replacing logarithm by its first-order approximation as an exact equality.
    verification: {method: finite-log-product-identity, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-021
    topicId: sequences-series
    skills: [apply-cesaro-to-partial-sums]
    archetype: averaged-partial-sum-limit
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires transferring convergence through arithmetic means.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      If the partial sums $S_n$ of a series converge to $S$, what is
      $\lim_{N\to\infty}(S_1+\cdots+S_N)/N$?
    choices: [{id: a, text: '$S$'}, {id: b, text: '$0$'}, {id: c, text: '$S/2$'}, {id: d, text: 'It need not exist.'}]
    answer: {choiceId: a}
    solutionOutline: Cesàro's theorem states that arithmetic means of any convergent sequence share its limit.
    commonTrap: Dividing the limiting value by N as though the numerator had only one term.
    verification: {method: cesaro-convergence-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-022
    topicId: sequences-series
    skills: [apply-iterated-log-condensation]
    archetype: second-logarithmic-boundary
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires condensation followed by a logarithmic integral threshold.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Classify
      $\sum_{n=3}^{\infty}1/[n\ln n\,\ln(\ln n)]$.
    choices: [{id: a, text: 'Divergent'}, {id: b, text: 'Convergent'}, {id: c, text: 'Conditionally convergent'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: Condensation reduces it, up to constants, to $\sum1/[k\ln k]$, which diverges.
    commonTrap: Assuming every additional logarithm in a denominator forces convergence.
    verification: {method: condensation-to-log-harmonic-series, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-023
    topicId: sequences-series
    skills: [evaluate-weighted-geometric-series]
    archetype: triangular-number-generating-function
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires combining first and second derivative geometric identities.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{n(n+1)}{2^{n+1}}$.
    choices: [{id: a, text: '$4$'}, {id: b, text: '$2$'}, {id: c, text: '$6$'}, {id: d, text: '$8$'}]
    answer: {choiceId: a}
    solutionOutline: At x equals one half, $\sum n(n+1)x^n=2x/(1-x)^3=8$; the extra factor one half gives four.
    commonTrap: Using only the first derivative identity for the linear weight n.
    verification: {method: second-geometric-derivative, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-024
    topicId: sequences-series
    skills: [use-recurrence-generating-functions]
    archetype: fibonacci-geometric-weight
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires deriving a generating function from a recurrence and evaluating within its radius.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      With $F_0=0$, $F_1=1$, and $F_{n+1}=F_n+F_{n-1}$, find
      $\sum_{n=1}^{\infty}F_n/2^n$.
    choices: [{id: a, text: '$2$'}, {id: b, text: '$1$'}, {id: c, text: '$\varphi$'}, {id: d, text: 'Diverges'}]
    answer: {choiceId: a}
    solutionOutline: The generating function is $x/(1-x-x^2)$; at x equals one half it equals two.
    commonTrap: Assuming Fibonacci growth exceeds $2^n$ because it is exponential.
    verification: {method: recurrence-generating-function, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-025
    topicId: sequences-series
    skills: [detect-recurrence-series-divergence]
    archetype: critical-fibonacci-weight
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires comparing recurrence growth with a critical exponential base.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What happens to $\sum_{n=1}^{\infty}F_n/\varphi^n$, where
      $\varphi=(1+\sqrt5)/2$?
    choices: [{id: a, text: 'It diverges because its terms approach $1/\sqrt5$.'}, {id: b, text: 'It converges geometrically.'}, {id: c, text: 'It converges to $\varphi$.'}, {id: d, text: 'It alternates.'}]
    answer: {choiceId: a}
    solutionOutline: Binet's formula gives $F_n/\varphi^n\to1/\sqrt5$, violating the necessary term condition.
    commonTrap: Confusing division by the dominant growth rate with decay to zero.
    verification: {method: binet-asymptotic-term-test, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-026
    topicId: sequences-series
    skills: [use-monotone-partial-sum-convergence]
    archetype: nonnegative-series-equivalence
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires recognizing boundedness as the missing half of monotone convergence.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $a_n\ge0$, which condition is equivalent to convergence of
      $\sum a_n$?
    choices: [{id: a, text: 'The partial sums are bounded above.'}, {id: b, text: '$a_n\to0$.'}, {id: c, text: 'The terms are bounded.'}, {id: d, text: 'Some subsequence of terms converges.'}]
    answer: {choiceId: a}
    solutionOutline: Nonnegative terms make partial sums monotone increasing, so boundedness is exactly the remaining hypothesis of monotone convergence.
    commonTrap: Substituting the necessary but insufficient zero-term condition.
    verification: {method: monotone-convergence-of-partial-sums, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-027
    topicId: sequences-series
    skills: [use-asymptotic-equivalence]
    archetype: positive-term-ratio-one
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires applying two-sided eventual comparison derived from a ratio limit.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Suppose $a_n,b_n>0$ and $a_n/b_n\to1$. What relationship holds
      between $\sum a_n$ and $\sum b_n$?
    choices: [{id: a, text: 'They either both converge or both diverge.'}, {id: b, text: 'They have the same numerical sum.'}, {id: c, text: 'Both converge.'}, {id: d, text: 'No relationship is possible.'}]
    answer: {choiceId: a}
    solutionOutline: Eventually the ratio lies between two positive constants, giving comparison in both directions.
    commonTrap: Upgrading asymptotic equality of terms to equality of total sums.
    verification: {method: two-sided-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-028
    topicId: sequences-series
    skills: [analyze-positive-and-negative-parts]
    archetype: conditional-mass-decomposition
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires decomposing a real series into two nonnegative subseries.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      If a real series converges conditionally, what happens to the sum of its
      positive terms and the sum of the absolute values of its negative terms?
    choices: [{id: a, text: 'Both diverge to $+\infty$.'}, {id: b, text: 'Both converge.'}, {id: c, text: 'Exactly one diverges.'}, {id: d, text: 'Both equal the original sum.'}]
    answer: {choiceId: a}
    solutionOutline: Finiteness of either nonnegative part plus convergence of the signed difference would force the other finite, contradicting failure of absolute convergence.
    commonTrap: Assuming cancellation means each sign contributes only finite mass.
    verification: {method: positive-negative-part-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-029
    topicId: sequences-series
    skills: [apply-dirichlet-to-oscillatory-series]
    archetype: sine-harmonic-series
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires bounded trigonometric partial sums and an independent absolute-divergence argument.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}\sin n/n$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent by the term test'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: Partial sums of sine n are bounded and 1/n decreases to zero, while absolute sine values retain positive average harmonic mass.
    commonTrap: Treating nonalternating-looking signs as absence of cancellation.
    verification: {method: dirichlet-and-block-absolute-divergence, result: verified}
    reviewStatus: verified
  - id: calc2-overview-oly-030
    topicId: sequences-series
    skills: [evaluate-telescoping-products]
    archetype: rational-product-boundaries
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires factoring every term and evaluating two linked finite products.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\prod_{n=2}^{\infty}\frac{n^2-1}{n^2}$.
    choices: [{id: a, text: '$1/2$'}, {id: b, text: '$0$'}, {id: c, text: '$1$'}, {id: d, text: '$2$'}]
    answer: {choiceId: a}
    solutionOutline: Factoring into $(n-1)/n$ and $(n+1)/n$ makes the Nth product $(N+1)/(2N)$.
    commonTrap: Declaring the product zero because every factor is below one without evaluating the rate of accumulated loss.
    verification: {method: exact-finite-product-telescoping, result: verified}
    reviewStatus: verified
