schemaVersion: 1
bankId: calc2-sequence-fundamentals-easy
categoryId: calculus-2
topicIds:
  - sequence-fundamentals
minimumItemCount: 15
items:
  - id: calc2-seq-easy-001
    topicId: sequence-fundamentals
    skills: [interpret-sequence-notation]
    archetype: indexed-function
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires interpreting a sequence as an indexed function rather than a sum.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $a_n=2n-1$, what are the first three terms of the sequence $(a_n)$?
    choices:
      - { id: a, text: '$1,3,5$' }
      - { id: b, text: '$1,4,9$' }
      - { id: c, text: '$2,4,6$' }
      - { id: d, text: '$-1,1,3$' }
    answer: { choiceId: a }
    solutionOutline: Substitute $n=1,2,3$ into $2n-1$ to obtain $1,3,5$.
    commonTrap: Beginning the index at zero even though the usual sequence convention here begins at one.
    verification: { method: direct-substitution, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-002
    topicId: sequence-fundamentals
    skills: [evaluate-rational-sequence-limits]
    archetype: equal-degree-rational-limit
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires normalizing a rational expression by its dominant power.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Find
      $$\lim_{n\to\infty}\frac{5n^2-n}{2n^2+7}.$$
    choices:
      - { id: a, text: '$0$' }
      - { id: b, text: '$2/5$' }
      - { id: c, text: '$5/2$' }
      - { id: d, text: '$+\infty$' }
    answer: { choiceId: c }
    solutionOutline: Divide by $n^2$; the lower-order fractions vanish and the leading-coefficient ratio is $5/2$.
    commonTrap: Reversing the numerator and denominator leading coefficients.
    verification: { method: dominant-power-limit, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-003
    topicId: sequence-fundamentals
    skills: [apply-the-squeeze-theorem]
    archetype: bounded-oscillation-over-growth
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires bounding an oscillatory numerator by a vanishing envelope.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is $\lim_{n\to\infty}\sin n/n$?
    choices:
      - { id: a, text: '$-1$' }
      - { id: b, text: '$0$' }
      - { id: c, text: '$1$' }
      - { id: d, text: 'The limit does not exist because $\sin n$ oscillates.' }
    answer: { choiceId: b }
    solutionOutline: The bound $-1/n\le\sin n/n\le1/n$ squeezes the sequence to zero.
    commonTrap: Transferring the oscillation of $\sin n$ to the quotient without accounting for the growing denominator.
    verification: { method: squeeze-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-004
    topicId: sequence-fundamentals
    skills: [distinguish-boundedness-from-convergence]
    archetype: bounded-divergent-counterexample
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires recognizing a standard bounded sequence with no limit.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which sequence is bounded but divergent?
    choices:
      - { id: a, text: '$a_n=(-1)^n$' }
      - { id: b, text: '$a_n=1/n$' }
      - { id: c, text: '$a_n=2+1/n$' }
      - { id: d, text: '$a_n=0$' }
    answer: { choiceId: a }
    solutionOutline: Its terms remain in $[-1,1]$ but its even and odd subsequences approach different values.
    commonTrap: Assuming every bounded sequence converges.
    verification: { method: parity-subsequence-check, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-005
    topicId: sequence-fundamentals
    skills: [apply-monotone-convergence]
    archetype: theorem-hypotheses
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying the pair of conditions in the monotone convergence theorem.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which information is sufficient to prove that a real sequence converges?
    choices:
      - { id: a, text: 'It is increasing and bounded above.' }
      - { id: b, text: 'It is increasing.' }
      - { id: c, text: 'It is bounded.' }
      - { id: d, text: 'Its first term is positive.' }
    answer: { choiceId: a }
    solutionOutline: A nondecreasing sequence with an upper bound converges to its supremum.
    commonTrap: Omitting either monotonicity or the corresponding bound.
    verification: { method: monotone-convergence-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-006
    topicId: sequence-fundamentals
    skills: [check-monotonicity]
    archetype: consecutive-difference
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires determining a monotonic direction from consecutive terms.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      How does $a_n=n/(n+1)$ behave?
    choices:
      - { id: a, text: 'It is increasing and bounded above by $1$.' }
      - { id: b, text: 'It is decreasing and bounded below by $1$.' }
      - { id: c, text: 'It alternates signs.' }
      - { id: d, text: 'It is unbounded.' }
    answer: { choiceId: a }
    solutionOutline: Write $a_n=1-1/(n+1)$; the subtracted reciprocal decreases, so $a_n$ increases toward one.
    commonTrap: Seeing a growing numerator and denominator and declaring the behavior indeterminate.
    verification: { method: algebraic-rewrite-and-bound, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-007
    topicId: sequence-fundamentals
    skills: [evaluate-geometric-sequence-limits]
    archetype: exponential-base-cases
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the magnitude condition for powers.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is $\lim_{n\to\infty}(-2/3)^n$?
    choices:
      - { id: a, text: '$-2/3$' }
      - { id: b, text: '$0$' }
      - { id: c, text: '$1$' }
      - { id: d, text: 'The limit does not exist.' }
    answer: { choiceId: b }
    solutionOutline: The signs alternate, but the magnitudes $(2/3)^n$ shrink to zero because the base magnitude is below one.
    commonTrap: Treating any alternating sign pattern as divergent.
    verification: { method: geometric-sequence-limit, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-008
    topicId: sequence-fundamentals
    skills: [use-subsequences-to-prove-divergence]
    archetype: parity-limit
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires computing two exhaustive subsequential limits.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $a_n=3+(-1)^n$, what are the even and odd subsequential limits?
    choices:
      - { id: a, text: '$4$ and $2$, respectively' }
      - { id: b, text: '$2$ and $4$, respectively' }
      - { id: c, text: '$3$ and $3$, respectively' }
      - { id: d, text: '$1$ and $-1$, respectively' }
    answer: { choiceId: a }
    solutionOutline: Even powers of $-1$ equal one and odd powers equal negative one, producing constants four and two.
    commonTrap: Reporting the midpoint three as though averaging oscillations created a limit.
    verification: { method: parity-substitution, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-009
    topicId: sequence-fundamentals
    skills: [interpret-fixed-point-equations]
    archetype: recurrence-candidate-limit
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires separating a possible fixed point from a proof of convergence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A recurrence has the form $a_{n+1}=\sqrt{2+a_n}$. If $a_n$ converges to
      a positive limit $L$, what must $L$ equal?
    choices:
      - { id: a, text: '$1$' }
      - { id: b, text: '$2$' }
      - { id: c, text: '$-1$' }
      - { id: d, text: '$\sqrt2$' }
    answer: { choiceId: b }
    solutionOutline: Continuity gives $L=\sqrt{2+L}$, so $L^2-L-2=0$; positivity selects $L=2$.
    commonTrap: Treating the negative algebraic root as compatible with a positive square-root recurrence.
    verification: { method: fixed-point-equation, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-010
    topicId: sequence-fundamentals
    skills: [construct-epsilon-thresholds]
    archetype: epsilon-N-bound
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires solving an eventual-error inequality for an integer index.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $a_n=1/n$, which condition on $n$ guarantees $|a_n-0|<0.01$?
    choices:
      - { id: a, text: '$n>100$' }
      - { id: b, text: '$n\ge10$' }
      - { id: c, text: '$n<100$' }
      - { id: d, text: '$n=1$ only' }
    answer: { choiceId: a }
    solutionOutline: Solve $1/n<1/100$ for positive $n$, giving the strict condition $n>100$.
    commonTrap: Using $n=100$, where the error equals rather than falls below the tolerance.
    verification: { method: inequality-solution, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-011
    topicId: sequence-fundamentals
    skills: [apply-limit-laws]
    archetype: sum-product-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires combining known limits under addition and multiplication.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $a_n\to2$ and $b_n\to-3$, what is
      $\lim(a_nb_n+a_n)$?
    choices:
      - { id: a, text: '$-8$' }
      - { id: b, text: '$-4$' }
      - { id: c, text: '$1$' }
      - { id: d, text: '$6$' }
    answer: { choiceId: b }
    solutionOutline: Limit laws give $(2)(-3)+2=-4$.
    commonTrap: Adding all limiting values without respecting the product.
    verification: { method: sequence-limit-laws, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-012
    topicId: sequence-fundamentals
    skills: [distinguish-sequences-from-series]
    archetype: object-comparison
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires separating convergence of terms from convergence of accumulated sums.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which statement about $a_n=1/n$ is correct?
    choices:
      - { id: a, text: 'The sequence converges to zero, but $\sum a_n$ diverges.' }
      - { id: b, text: 'Both the sequence and series converge to zero.' }
      - { id: c, text: 'The sequence diverges, but the series converges.' }
      - { id: d, text: 'Both diverge because the terms are positive.' }
    answer: { choiceId: a }
    solutionOutline: Reciprocal terms approach zero, while harmonic partial sums grow without bound.
    commonTrap: Assuming the term limit and the series sum answer the same question.
    verification: { method: standard-harmonic-counterexample, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-013
    topicId: sequence-fundamentals
    skills: [identify-unbounded-monotone-sequences]
    archetype: missing-theorem-hypothesis
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires explaining why monotonicity alone does not give a finite limit.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Why does the monotone convergence theorem not prove that $a_n=n$ converges?
    choices:
      - { id: a, text: 'The sequence is not bounded above.' }
      - { id: b, text: 'The sequence is not increasing.' }
      - { id: c, text: 'The terms are integers.' }
      - { id: d, text: 'The first term is one.' }
    answer: { choiceId: a }
    solutionOutline: Although increasing, the sequence has no finite upper bound and tends to positive infinity.
    commonTrap: Remembering the monotonicity hypothesis but omitting boundedness.
    verification: { method: theorem-hypothesis-check, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-014
    topicId: sequence-fundamentals
    skills: [evaluate-factorial-sequence-limits]
    archetype: factorial-dominance
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires using a consecutive ratio or elementary bound to compare exponential and factorial growth.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is $\lim_{n\to\infty}2^n/n!$?
    choices:
      - { id: a, text: '$0$' }
      - { id: b, text: '$1$' }
      - { id: c, text: '$2$' }
      - { id: d, text: '$+\infty$' }
    answer: { choiceId: a }
    solutionOutline: The consecutive ratio is $2/(n+1)$, eventually below any fixed number less than one, so the sequence decays to zero.
    commonTrap: Assuming an exponential always outgrows a factorial.
    verification: { method: eventual-geometric-ratio-bound, result: verified }
    reviewStatus: verified

  - id: calc2-seq-easy-015
    topicId: sequence-fundamentals
    skills: [use-continuity-with-sequence-limits]
    archetype: continuous-image-limit
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires verifying the limiting input lies in the domain of a continuous outer function.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $a_n\to4$ and every $a_n\ge0$, what is
      $\lim_{n\to\infty}\sqrt{a_n}$?
    choices:
      - { id: a, text: '$0$' }
      - { id: b, text: '$2$' }
      - { id: c, text: '$4$' }
      - { id: d, text: '$16$' }
    answer: { choiceId: b }
    solutionOutline: The square-root function is continuous at four, so the limit passes through it and equals $\sqrt4=2$.
    commonTrap: Applying the outer function incorrectly by squaring the limit instead of taking its square root.
    verification: { method: continuity-of-square-root, result: verified }
    reviewStatus: verified
