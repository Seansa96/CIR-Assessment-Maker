items:
  - id: calc2-error-oly-001
    topicId: series-approximation-error
    skills: [sharpen-alternating-series-bounds]
    archetype: consecutive-sum-midpoint
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires using the two-sided enclosure rather than only one partial sum.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For an alternating series satisfying the Leibniz hypotheses, the
      sum S lies between consecutive partial sums $S_N$ and $S_{N+1}$.
      What error is guaranteed by their midpoint M?
    choices: [{id: a, text: '$|S-M|\le b_{N+1}/2$'}, {id: b, text: '$|S-M|\le b_{N+1}$'}, {id: c, text: '$|S-M|=b_{N+1}/2$'}, {id: d, text: '$|S-M|\le b_N/2$'}]
    answer: {choiceId: a}
    solutionOutline: The enclosing interval has width $|S_{N+1}-S_N|=b_{N+1}$, so its midpoint is at most half that width from any point inside.
    commonTrap: Quoting the ordinary one-sided partial-sum bound without exploiting both endpoints.
    verification: {method: alternating-enclosure-midpoint-radius, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-002
    topicId: series-approximation-error
    skills: [determine-alternating-remainder-signs]
    archetype: first-omitted-term-direction
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires extracting directional information in addition to magnitude.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      An alternating series meets the Leibniz hypotheses, and the first
      omitted term after $S_N$ is negative. Which statement follows?
    choices: [{id: a, text: '$S<S_N$'}, {id: b, text: '$S>S_N$'}, {id: c, text: '$S=S_N$'}, {id: d, text: 'Only the magnitude, not the direction, is known'}]
    answer: {choiceId: a}
    solutionOutline: The remainder has the sign of the first omitted term, so $S-S_N$ is negative.
    commonTrap: Remembering only the absolute error inequality and discarding the sign conclusion.
    verification: {method: alternating-remainder-sign, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-003
    topicId: series-approximation-error
    skills: [bound-tails-from-term-ratios]
    archetype: dominated-geometric-tail
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires constructing a geometric majorant from a ratio inequality.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Positive tail terms satisfy $a_{n+1}/a_n\le r<1$ for every
      $n\ge N+1$. Which bound holds for $R_N=\sum_{n=N+1}^{\infty}a_n$?
    choices: [{id: a, text: '$R_N\le a_{N+1}/(1-r)$'}, {id: b, text: '$R_N\le ra_{N+1}$'}, {id: c, text: '$R_N\le a_N/(1+r)$'}, {id: d, text: '$R_N=a_{N+1}$'}]
    answer: {choiceId: a}
    solutionOutline: Each later term is bounded by $a_{N+1}r^k$, so summing the majorant gives the geometric factor.
    commonTrap: Bounding the entire tail by its first term despite all remaining positive contributions.
    verification: {method: ratio-geometric-majorization, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-004
    topicId: series-approximation-error
    skills: [analyze-signed-geometric-remainders]
    archetype: negative-ratio-exact-tail
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires preserving the signed denominator before taking absolute value.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $-1<x<0$, what is the absolute error after truncating
      $\sum_{n=0}^{\infty}x^n$ at exponent N?
    choices: [{id: a, text: '$|x|^{N+1}/|1-x|$'}, {id: b, text: '$|x|^{N+1}/(1-|x|)$'}, {id: c, text: '$|x|^N$'}, {id: d, text: '$|x|^{N+1}$'}]
    answer: {choiceId: a}
    solutionOutline: The exact signed tail is $x^{N+1}/(1-x)$; taking its magnitude retains $|1-x|$.
    commonTrap: Replacing x by its magnitude inside the denominator, which gives a looser different expression.
    verification: {method: signed-geometric-exact-remainder, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-005
    topicId: series-approximation-error
    skills: [derive-p-series-tail-brackets]
    archetype: reciprocal-cube-integral-bracket
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires integrating the comparison function and assigning each endpoint correctly.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $R_N=\sum_{n=N+1}^{\infty}1/n^3$, which bounds follow from the
      integral remainder theorem?
    choices: [{id: a, text: '$1/[2(N+1)^2]\le R_N\le1/(2N^2)$'}, {id: b, text: '$1/(N+1)^3\le R_N\le1/N^3$'}, {id: c, text: '$1/(2N^2)\le R_N\le1/[2(N+1)^2]$'}, {id: d, text: '$R_N=1/(2N^2)$'}]
    answer: {choiceId: a}
    solutionOutline: Integrating $x^{-3}$ from N plus one gives the lower bound and from N gives the upper bound.
    commonTrap: Keeping the original cubic exponent after integration.
    verification: {method: reciprocal-cube-integral-tail, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-006
    topicId: series-approximation-error
    skills: [bound-sparse-alternating-taylor-series]
    archetype: cubic-sine-polynomial
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires choosing the sharper series-specific estimate over a generic degree-four remainder.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Approximate $\sin(0.4)$ by $0.4-(0.4)^3/3!$. Which bound follows
      from the alternating sine series?
    choices: [{id: a, text: '$(0.4)^5/5!$'}, {id: b, text: '$(0.4)^4/4!$'}, {id: c, text: '$(0.4)^3/3!$'}, {id: d, text: '$(0.4)^5/4!$'}]
    answer: {choiceId: a}
    solutionOutline: The first omitted nonzero sine term has degree five and the term magnitudes decrease at this input.
    commonTrap: Treating the absent fourth-degree term as the next remainder term.
    verification: {method: sparse-sine-alternating-remainder, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-007
    topicId: series-approximation-error
    skills: [bound-negative-exponential-truncations]
    archetype: exponential-at-minus-one
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing an alternating factorial series at a boundary-sized input.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      The degree-N Maclaurin polynomial approximates $e^{-1}$. What error
      bound follows directly from the alternating-series theorem?
    choices: [{id: a, text: '$|R_N|\le1/(N+1)!$'}, {id: b, text: '$|R_N|\le e/(N+1)!$'}, {id: c, text: '$|R_N|\le1/N!$ only'}, {id: d, text: '$|R_N|=1/(N+1)!$'}]
    answer: {choiceId: a}
    solutionOutline: The terms $1/n!$ decrease to zero, so the first omitted factorial term controls the absolute error.
    commonTrap: Importing the larger Lagrange derivative bound when the alternating estimate is sharper.
    verification: {method: alternating-reciprocal-factorial-bound, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-008
    topicId: series-approximation-error
    skills: [bound-logarithm-series-errors]
    archetype: logarithm-positive-input-alternation
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires aligning polynomial degree with the next logarithmic denominator.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $0<x\le1$, truncate
      $\log(1+x)=\sum_{n=1}^{\infty}(-1)^{n+1}x^n/n$ after degree N.
      Which error bound applies?
    choices: [{id: a, text: '$x^{N+1}/(N+1)$'}, {id: b, text: '$x^N/N$'}, {id: c, text: '$x^{N+1}/N$'}, {id: d, text: '$1/(1-x)$'}]
    answer: {choiceId: a}
    solutionOutline: The term magnitudes decrease for this input range, and the first omitted term has index N plus one.
    commonTrap: Using the last included logarithmic term as the bound.
    verification: {method: logarithm-alternating-remainder, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-009
    topicId: series-approximation-error
    skills: [assess-slow-boundary-convergence]
    archetype: gregory-series-term-count
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires translating a count of nonzero terms into the odd index of the first omitted term.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Using N terms of
      $\pi/4=1-1/3+1/5-\cdots$, what error bound is guaranteed?
    choices: [{id: a, text: '$1/(2N+1)$'}, {id: b, text: '$1/(2N-1)$'}, {id: c, text: '$1/N!$'}, {id: d, text: '$1/(N+1)^2$'}]
    answer: {choiceId: a}
    solutionOutline: N terms run from index zero through N minus one, so the first omitted odd denominator is $2N+1$.
    commonTrap: Reporting the denominator of the last included term.
    verification: {method: gregory-first-omitted-index, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-010
    topicId: series-approximation-error
    skills: [optimize-lagrange-derivative-bounds]
    archetype: negative-exponential-interval-maximum
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires maximizing the derivative on an interval whose endpoint value is smaller.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For the degree-N Maclaurin approximation to $e^{-1/2}$, which
      Lagrange bound is valid using the sharp maximum of $e^t$ on
      $[-1/2,0]$?
    choices: [{id: a, text: '$(1/2)^{N+1}/(N+1)!$'}, {id: b, text: '$e^{-1/2}(1/2)^{N+1}/(N+1)!$'}, {id: c, text: '$e^{1/2}/(N+1)!$'}, {id: d, text: '$(1/2)^N/N!$'}]
    answer: {choiceId: a}
    solutionOutline: The derivative maximum is one at t equals zero, leaving only the displacement power and factorial.
    commonTrap: Using the function value at the evaluation point as an upper bound on the entire interval.
    verification: {method: negative-interval-exponential-maximum, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-011
    topicId: series-approximation-error
    skills: [derive-uniform-taylor-bounds]
    archetype: exponential-symmetric-interval
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires selecting one derivative maximum valid for every evaluation point in an interval.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Which uniform bound holds for the degree-N Maclaurin remainder of
      $e^x$ for every $|x|\le a$?
    choices: [{id: a, text: '$e^a a^{N+1}/(N+1)!$'}, {id: b, text: '$e^{-a}a^{N+1}/(N+1)!$'}, {id: c, text: '$a^N/N!$'}, {id: d, text: '$e^a/(N+1)$'}]
    answer: {choiceId: a}
    solutionOutline: Every intermediate point lies in the symmetric interval, where all relevant exponential derivatives are at most $e^a$.
    commonTrap: Choosing a pointwise derivative value that is not valid uniformly.
    verification: {method: uniform-lagrange-supremum, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-012
    topicId: series-approximation-error
    skills: [combine-independent-error-bounds]
    archetype: difference-of-approximations
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires applying the triangle inequality to two independently approximated quantities.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $|A-\tilde A|\le\epsilon$ and
      $|B-\tilde B|\le\delta$, what bound is guaranteed for the error in
      approximating $A-B$ by $\tilde A-\tilde B$?
    choices: [{id: a, text: '$\epsilon+\delta$'}, {id: b, text: '$|\epsilon-\delta|$'}, {id: c, text: '$\epsilon\delta$'}, {id: d, text: '$\max(\epsilon,\delta)/2$'}]
    answer: {choiceId: a}
    solutionOutline: The error is $(A-\tilde A)-(B-\tilde B)$, whose magnitude is at most the sum of the two bounds.
    commonTrap: Assuming the two unknown signed errors cancel.
    verification: {method: two-error-triangle-inequality, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-013
    topicId: series-approximation-error
    skills: [choose-effective-taylor-centers]
    archetype: equal-derivative-bound-center-choice
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires isolating the displacement factor while holding the derivative bound and degree fixed.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Two degree-N Taylor bounds for the same target point use the same
      derivative maximum M. Center a is twice as far from the target as
      center b. How do their Lagrange bounds compare?
    choices: [{id: a, text: 'The bound from a is $2^{N+1}$ times the bound from b.'}, {id: b, text: 'The bound from a is twice the bound from b.'}, {id: c, text: 'The bounds are equal.'}, {id: d, text: 'The bound from a is $2^N$ times the bound from b.'}]
    answer: {choiceId: a}
    solutionOutline: The displacement appears to power N plus one, while M and the factorial are identical.
    commonTrap: Scaling the bound linearly with distance.
    verification: {method: lagrange-distance-power-scaling, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-014
    topicId: series-approximation-error
    skills: [bound-geometric-series-uniformly]
    archetype: compact-subdisk-tail
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires turning a pointwise exact remainder into a worst-case bound on a whole interval.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      On $|x|\le\rho<1$, which uniform bound holds for the remainder after
      exponent N in $\sum_{n=0}^{\infty}x^n$?
    choices: [{id: a, text: '$\rho^{N+1}/(1-\rho)$'}, {id: b, text: '$\rho^N$'}, {id: c, text: '$1/(1-\rho^{N+1})$'}, {id: d, text: '$\rho^{N+1}/(1+\rho)$'}]
    answer: {choiceId: a}
    solutionOutline: Bound the exact magnitude $|x|^{N+1}/|1-x|$ using $|x|\le\rho$ and $|1-x|\ge1-\rho$.
    commonTrap: Substituting rho into the signed denominator without using the reverse triangle inequality.
    verification: {method: geometric-uniform-tail-bound, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-015
    topicId: series-approximation-error
    skills: [test-validity-of-remainder-theorems]
    archetype: missing-derivative-control
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing that endpoint derivative data alone cannot control an intermediate-point remainder.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      To use a Lagrange remainder bound from center a to target x, which
      information is essential?
    choices: [{id: a, text: 'A bound on $|f^{(N+1)}|$ throughout the interval between a and x'}, {id: b, text: 'Only the value of $f^{(N+1)}(a)$'}, {id: c, text: 'Only the signs of the Taylor coefficients'}, {id: d, text: 'Absolute convergence of an unrelated series'}]
    answer: {choiceId: a}
    solutionOutline: Taylor's theorem evaluates the derivative at an unknown intermediate point, so a valid guarantee must cover the full interval.
    commonTrap: Replacing an interval maximum by the derivative value at the center.
    verification: {method: lagrange-hypothesis-interval-check, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-016
    topicId: series-approximation-error
    skills: [apply-richardson-extrapolation]
    archetype: cancel-quadratic-leading-error
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires solving for a linear combination that eliminates the leading error term.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Suppose $A(h)=L+Ch^2+O(h^4)$. Which combination improves the
      approximation to fourth-order error?
    choices: [{id: a, text: '$[4A(h/2)-A(h)]/3$'}, {id: b, text: '$[A(h/2)+A(h)]/2$'}, {id: c, text: '$2A(h/2)-A(h)$'}, {id: d, text: '$[A(h)-4A(h/2)]/3$'}]
    answer: {choiceId: a}
    solutionOutline: At half-step the leading error is $Ch^2/4$; multiplying by four and subtracting the full-step value cancels it, while division by three restores L.
    commonTrap: Canceling the error but also canceling or rescaling the target value incorrectly.
    verification: {method: richardson-leading-term-cancellation, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-017
    topicId: series-approximation-error
    skills: [bound-central-difference-errors]
    archetype: symmetric-derivative-formula
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires combining Taylor expansions at plus and minus h and bounding the surviving cubic terms.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      If $|f'''(t)|\le M$ near x, what bound holds for the central
      difference approximation
      $[f(x+h)-f(x-h)]/(2h)$ to $f'(x)$?
    choices: [{id: a, text: '$Mh^2/6$'}, {id: b, text: '$Mh/2$'}, {id: c, text: '$Mh^2/2$'}, {id: d, text: '$M/(6h)$'}]
    answer: {choiceId: a}
    solutionOutline: The even Taylor terms cancel, and the two cubic remainders together contribute at most $Mh^3/3$, followed by division by $2h$.
    commonTrap: Treating the symmetric formula as first-order in h.
    verification: {method: central-difference-taylor-bound, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-018
    topicId: series-approximation-error
    skills: [sharpen-integral-tail-estimates]
    archetype: midpoint-of-integral-bracket
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires converting a two-sided tail enclosure to a smaller midpoint error.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $R_N=\sum_{n=N+1}^{\infty}1/n^2$, the integral test gives
      $1/(N+1)\le R_N\le1/N$. If R is approximated by the midpoint of
      these bounds, what error is guaranteed?
    choices: [{id: a, text: '$1/[2N(N+1)]$'}, {id: b, text: '$1/[N(N+1)]$'}, {id: c, text: '$1/(2N)$'}, {id: d, text: '$1/[2(N+1)]$'}]
    answer: {choiceId: a}
    solutionOutline: Half the bracket width is $\frac12(1/N-1/(N+1))=1/[2N(N+1)]$.
    commonTrap: Using the full width of the enclosure as the midpoint error.
    verification: {method: integral-bracket-midpoint-radius, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-019
    topicId: series-approximation-error
    skills: [find-large-geometric-truncation-counts]
    archetype: slow-geometric-tail-tolerance
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires solving a logarithmic inequality and handling a strict integer threshold.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Truncate $\sum_{n=0}^{\infty}(0.9)^n$ after exponent N. What is
      the smallest N making the exact remainder less than $0.01$?
    choices: [{id: a, text: '$65$'}, {id: b, text: '$64$'}, {id: c, text: '$66$'}, {id: d, text: '$43$'}]
    answer: {choiceId: a}
    solutionOutline: The tail is $10(0.9)^{N+1}$, so $(0.9)^{N+1}<0.001$; the first successful exponent is N plus one equals sixty-six.
    commonTrap: Forgetting the factor ten from dividing by one minus 0.9.
    verification: {method: logarithmic-geometric-threshold-check, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-020
    topicId: series-approximation-error
    skills: [compute-exponential-lagrange-bounds]
    archetype: degree-eight-exponential-at-one
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires matching degree, derivative order, and the interval maximum.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Which Lagrange bound applies when the degree-eight Maclaurin
      polynomial approximates e?
    choices: [{id: a, text: '$e/9!$'}, {id: b, text: '$1/9!$'}, {id: c, text: '$e/8!$'}, {id: d, text: '$1/8!$'}]
    answer: {choiceId: a}
    solutionOutline: The ninth derivative is exponential and has maximum e on zero through one, while the displacement is one.
    commonTrap: Using the last included factorial rather than the remainder-order factorial.
    verification: {method: exponential-degree-eight-lagrange, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-021
    topicId: series-approximation-error
    skills: [bound-generalized-binomial-tails]
    archetype: square-root-cubic-truncation
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires computing a fourth half-binomial coefficient and evaluating it at a rational input.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Approximate $\sqrt{1.25}$ through the cubic term of
      $(1+x)^{1/2}$ at $x=1/4$. What is the magnitude of the first
      omitted term?
    choices: [{id: a, text: '$5/32768$'}, {id: b, text: '$5/8192$'}, {id: c, text: '$1/2048$'}, {id: d, text: '$5/128$'}]
    answer: {choiceId: a}
    solutionOutline: The fourth coefficient is minus $5/128$ and $(1/4)^4=1/256$, giving magnitude $5/32768$.
    commonTrap: Reporting the coefficient without multiplying by the fourth power of the input.
    verification: {method: half-binomial-fourth-term-evaluation, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-022
    topicId: series-approximation-error
    skills: [propagate-reciprocal-errors]
    archetype: reciprocal-stability-bound
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires deriving a lower bound on the unknown exact denominator.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      If $|A-\tilde A|\le\epsilon<|\tilde A|$, which bound is guaranteed
      for $|1/A-1/\tilde A|$?
    choices: [{id: a, text: '$\epsilon/[|\tilde A|(|\tilde A|-\epsilon)]$'}, {id: b, text: '$\epsilon/|\tilde A|$'}, {id: c, text: '$\epsilon/|\tilde A|^2$ exactly'}, {id: d, text: '$1/\epsilon$'}]
    answer: {choiceId: a}
    solutionOutline: The difference equals $|A-\tilde A|/(|A||\tilde A|)$ and $|A|\ge|\tilde A|-\epsilon$.
    commonTrap: Replacing the unknown exact denominator by the approximate one without allowing for its error.
    verification: {method: reciprocal-perturbation-lower-denominator, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-023
    topicId: series-approximation-error
    skills: [derive-exact-logarithm-remainders]
    archetype: integral-form-log-tail
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires integrating a finite geometric identity rather than only quoting an alternating bound.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Let $P_N(x)=\sum_{n=1}^{N}(-1)^{n+1}x^n/n$. For $x\ge0$, which
      exact remainder identity holds?
    choices: [{id: a, text: '$\log(1+x)-P_N(x)=(-1)^N\int_0^x t^N/(1+t)\,dt$'}, {id: b, text: '$\log(1+x)-P_N(x)=x^{N+1}/(N+1)$'}, {id: c, text: '$\log(1+x)-P_N(x)=\int_0^x t^{N+1}\,dt$'}, {id: d, text: '$\log(1+x)-P_N(x)=(-1)^{N+1}x^N$'}]
    answer: {choiceId: a}
    solutionOutline: Integrate the finite geometric decomposition of $1/(1+t)$; its leftover term is $(-1)^Nt^N/(1+t)$.
    commonTrap: Replacing a bound by an equality and dropping the denominator one plus t.
    verification: {method: integrated-finite-geometric-remainder, result: verified}
    reviewStatus: verified
  - id: calc2-error-oly-024
