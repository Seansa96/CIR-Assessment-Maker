metadata:
  title: Calc2 Convergence Tests Question Bank
  description: Extracted questions from convergence test image notes.
  tags:
  - calculus-2
  - convergence-tests
items:
- id: img-convtest-001
  concept: Limit Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{n^3}{n^4+1}$.
  explanation: |-
    LCT with $1/n$: limit $= 1 > 0$. Diverges.
- id: img-convtest-002
  concept: Ratio Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{3^n}{n!}$.
  explanation: |-
    Ratio: $3/(n+1) \to 0 < 1$. Converges.
- id: img-convtest-003
  concept: Absolute Convergence
  difficulty: 2
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{n^2}$.
  explanation: |-
    $\sum |a_n| = \sum 1/n^2$ converges. Absolutely converges.
- id: img-convtest-004
  concept: Direct Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{1}{2^n+1}$.
  explanation: |-
    Comparison: $1/(2^n+1) < 1/2^n$. $\sum 1/2^n$ converges. Converges.
- id: img-convtest-005
  concept: Ratio Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{n!}{n^n}$.
  explanation: |-
    Ratio: $\frac{(n+1)!}{(n+1)^{n+1}} \cdot \frac{n^n}{n!} = \frac{n^n}{(n+1)^n} \to 1/e < 1$. Converges.
- id: img-convtest-006
  concept: Ratio Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{1}{n \cdot 2^n}$.
  explanation: |-
    Ratio: $\frac{n}{2(n+1)} \to 1/2 < 1$. Converges.
- id: img-convtest-007
  concept: Root Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \left(\frac{n}{n+1}\right)^{n^2}$.
  explanation: |-
    Root: $a_n^{1/n} = \left(\frac{n}{n+1}\right)^n = \frac{1}{(1+1/n)^n} \to 1/e < 1$. Converges.
- id: img-convtest-008
  concept: Integral Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{\ln n}{n}$.
  explanation: |-
    Integral test: $\int_2^{\infty} \frac{\ln x}{x} \, dx = \infty$. Diverges.
- id: img-convtest-009
  concept: Alternating Series Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n n}{n^2+1}$.
  explanation: |-
    $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges.
- id: img-convtest-010
  concept: Limit Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{n^2+1}{n^4+2}$.
  explanation: |-
    LCT with $1/n^2$: limit $= 1$. Converges.
- id: img-convtest-011
  concept: Root Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \left(\frac{3n}{4n+5}\right)^n$.
  explanation: |-
    Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.
- id: img-convtest-012
  concept: Absolute Convergence
  difficulty: 2
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{\cos n}{n^2}$.
  explanation: |-
    $|\cos n / n^2| \le 1/n^2$. Absolutely converges.
- id: img-convtest-013
  concept: Ratio Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{n^n}{(2n)!}$.
  explanation: |-
    Ratio: $\frac{(n+1)^{n+1}}{(2n+2)!} \cdot \frac{(2n)!}{n^n} = \frac{(n+1)^{n+1}}{(2n+2)(2n+1)n^n} \sim \frac{en}{4n^2} = \frac{e}{4n} \to 0 < 1$. Converges.
- id: img-convtest-014
  concept: Integral Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{1}{n(\ln n)^2}$.
  explanation: |-
    Integral test: $\int_2^{\infty} \frac{dx}{x(\ln x)^2} = [-1/\ln x]_2^{\infty} = 1/\ln 2 < \infty$. Converges.
- id: img-convtest-015
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{4^n}{5^n - 3^n}$.
  explanation: |-
    $\frac{4^n}{5^n-3^n} \sim (4/5)^n$. LCT with $(4/5)^n$: $\frac{5^n}{5^n-3^n} \to 1$. Converges.
- id: img-convtest-016
  concept: Alternating Series Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{\ln(n+1)}$.
  explanation: |-
    $1/\ln(n+1) \to 0$, decreasing. AST: converges. Absolute: $1/\ln(n+1) > 1/(n+1)$, diverges. Conditionally converges.
- id: img-convtest-017
  concept: Root Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{n!}{2^{n^2}}$.
  explanation: |-
    Root: $(n!/2^{n^2})^{1/n} = \frac{(n!)^{1/n}}{2^n} \sim \frac{n/e}{2^n} \to 0 < 1$. Converges.
- id: img-convtest-018
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{\sin(1/n)}{n}$.
  explanation: |-
    $\sin(1/n) \sim 1/n$ for large $n$. LCT with $1/n^2$: $\lim n^2 \sin(1/n)/n = \lim n\sin(1/n) = 1$. Converges.
- id: img-convtest-019
  concept: Root Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{(-3)^n}{n^n}$.
  explanation: |-
    Root: $(3^n/n^n)^{1/n} = 3/n \to 0 < 1$. Absolutely converges.
- id: img-convtest-020
  concept: Limit Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{1}{(n+1)(n+2)}$.
  explanation: |-
    LCT with $1/n^2$: converges. Converges.
- id: img-convtest-021
  concept: Absolute Convergence
  difficulty: 2
  source: |-
    Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{(-1)^n \arctan n}{n^2}$.
  explanation: |-
    $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.
- id: img-convtest-022
  concept: Ratio Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{n^5}{e^n}$.
  explanation: |-
    Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges.
- id: img-convtest-023
  concept: Limit Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{1}{\sqrt{n^2+n}}$.
  explanation: |-
    $1/\sqrt{n^2+n} \sim 1/n$. LCT with $1/n$: limit$=1 > 0$. Diverges.
- id: img-convtest-024
  concept: Direct Comparison Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{2^n \sin^{2n} \theta}{n}$ for $0 < \theta < \pi/2$.
  explanation: |-
    Comparison: $\frac{2^n \sin^{2n} \theta}{n} \le (2\sin^2\theta)^n$. For $\theta < \pi/4$: $2\sin^2\theta < 1$: converges. For $\theta \ge \pi/4$: diverges.
- id: img-convtest-025
  concept: Direct Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{1}{n^{3/2}+1}$.
  explanation: |-
    Comparison with $1/n^{3/2}$: $1/(n^{3/2}+1) < 1/n^{3/2}$. $p=3/2 > 1$. Converges.
- id: img-convtest-026
  concept: Ratio Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \frac{n^2}{2^n}$.
  explanation: |-
    Ratio: $\frac{(n+1)^2}{2^{n+1}} \cdot \frac{2^n}{n^2} = \frac{(n+1)^2}{2n^2} \to 1/2 < 1$. Converges.
- id: img-convtest-027
  concept: Telescoping Series
  difficulty: 3
  source: |-
    Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \frac{1}{1+2+\cdots+n}$.
  explanation: |-
    $1+2+\cdots+n = n(n+1)/2$. $\sum 2/(n(n+1))$: telescoping, $S=2$. Converges.
- id: img-convtest-028
  concept: Alternating Series Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{n-\ln n}$.
  explanation: |-
    $b_n = 1/(n-\ln n) > 0, b_n \to 0$, decreasing (for large $n$). AST: converges conditionally.
- id: img-convtest-029
  concept: Root Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \left(\frac{n+1}{3n-2}\right)^n$.
  explanation: |-
    Root: $a_n^{1/n} = (n+1)/(3n-2) \to 1/3 < 1$. Converges.
- id: img-convtest-030
  concept: Direct Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \frac{\ln n}{n^2}$.
  explanation: |-
    Comparison: $\ln n/n^2 \le n^{0.5}/n^2 = n^{-1.5}$ for large $n$. Converges.
- id: img-convtest-031
  concept: Series Properties
  difficulty: 2
  source: |-
    Tests For Convergence/pset_7.png
  prompt: |-
    True/False: If $\sum a_n$ and $\sum b_n$ both diverge, then $\sum (a_n+b_n)$ diverges.
  explanation: |-
    False. Example: $a_n = 1/n$, $b_n = -1/n$. Both diverge, but $\sum (a_n+b_n) = 0$.
- id: img-convtest-032
  concept: Limit Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{n^3+2n}{3n^5-4}$.
  explanation: |-
    LCT with $1/n^2$: $\lim \frac{n^5+2n^3}{3n^5-4} \to 1/3 > 0$. Converges.
- id: img-convtest-033
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{1}{n^{1+1/n}}$.
  explanation: |-
    $n^{1+1/n} = n \cdot n^{1/n} \sim n \cdot e^{(\ln n)/n} \sim n$. LCT with $1/n$: $\to 1$. Diverges.
- id: img-convtest-034
  concept: Limit Comparison Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{n \sin(1/n^2)}{1+n^2}$.
  explanation: |-
    $\sin(1/n^2) \sim 1/n^2$. So $a_n \sim n \cdot (1/n^2) / (n^2) \sim 1/n^3$. LCT with $1/n^3$: converges.
- id: img-convtest-035
  concept: Divergence Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{2 \cdot 4 \cdot 6 \cdots (2n)}{1 \cdot 3 \cdot 5 \cdots (2n-1)}$.
  explanation: |-
    Ratio: $a_{n+1}/a_n = \frac{2(n+1)}{2n+1} \to 1$. Inconclusive. Note $a_n > 1$ for all $n$ (each factor $> 1$), so $a_n \not\to 0$. Diverges.
- id: img-convtest-036
  concept: Alternating Series Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{(-1)^n n^2}{n^3+1}$.
  explanation: |-
    $b_n = n^2/(n^3+1) \to 0$, decreasing (eventually). AST: converges. Absolute: $\sim 1/n$: diverges. Conditionally converges.
- id: img-convtest-001-v1
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{n^4}{n^5+2}$.
  explanation: |-
    LCT with $1/n$: limit $= 1 > 0$. Diverges.
- id: img-convtest-001-v2
  concept: Limit Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{n^3}{n^5+1}$.
  explanation: |-
    LCT with $1/n^2$: limit $= 1 > 0$. Converges.
- id: img-convtest-001-v3
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{(-1)^n n^3}{n^4+1}$.
  explanation: |-
    AST: $n^3/(n^4+1) \to 0$ and decreasing. Converges conditionally.
- id: img-convtest-002-v1
  concept: Ratio Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{4^n}{(n+1)!}$.
  explanation: |-
    Ratio: $4/(n+2) \to 0 < 1$. Converges.
- id: img-convtest-002-v2
  concept: Ratio Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{n!}{3^n}$.
  explanation: |-
    Ratio: $(n+1)/3 \to \infty > 1$. Diverges.
- id: img-convtest-002-v3
  concept: Ratio Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{3^{2n}}{(2n)!}$.
  explanation: |-
    Ratio: $9/((2n+2)(2n+1)) \to 0 < 1$. Converges.
- id: img-convtest-003-v1
  concept: Absolute Convergence
  difficulty: 3
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{n^3}$.
  explanation: |-
    $\sum |a_n| = \sum 1/n^3$ converges. Absolutely converges.
- id: img-convtest-003-v2
  concept: Absolute Convergence
  difficulty: 2
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{\sqrt{n}}$.
  explanation: |-
    AST: converges. Absolute: $1/n^{1/2}$ diverges. Conditionally converges.
- id: img-convtest-003-v3
  concept: Absolute Convergence
  difficulty: 3
  source: |-
    Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{(-1)^n n}{n^3+2}$.
  explanation: |-
    Absolute: $\sim 1/n^2$ converges. Absolutely converges.
- id: img-convtest-004-v1
  concept: Direct Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{3}{4^n+2}$.
  explanation: |-
    Comparison: $3/(4^n+2) < 3/4^n$. $\sum 3/4^n$ converges. Converges.
- id: img-convtest-004-v2
  concept: Direct Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{1}{2^n-1}$.
  explanation: |-
    LCT with $1/2^n$: limit is $1 > 0$. Converges.
- id: img-convtest-004-v3
  concept: Direct Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{n}{2^n+1}$.
  explanation: |-
    Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges.
- id: img-convtest-005-v1
  concept: Ratio Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{(n+1)!}{n^n}$.
  explanation: |-
    Ratio: $\frac{n+2}{(n+1)(1+1/n)^n} \to \infty$. Diverges.
- id: img-convtest-005-v2
  concept: Ratio Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{(2n)!}{n^{2n}}$.
  explanation: |-
    Ratio: $\frac{(2n+2)(2n+1)}{n^2(1+1/n)^{2n}} \sim \frac{4}{e^2} < 1$. Converges.
- id: img-convtest-005-v3
  concept: Ratio Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{n!}{(2n)^n}$.
  explanation: |-
    Ratio: $\frac{n+1}{2(n+1)(1+1/n)^n} \to 1/2e < 1$. Converges.
- id: img-convtest-006-v1
  concept: Ratio Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{1}{n^2 \cdot 3^n}$.
  explanation: |-
    Ratio: $\frac{n^2}{3(n+1)^2} \to 1/3 < 1$. Converges.
- id: img-convtest-006-v2
  concept: Ratio Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{n}{2^n}$.
  explanation: |-
    Ratio: $\frac{n+1}{2n} \to 1/2 < 1$. Converges.
- id: img-convtest-006-v3
  concept: Ratio Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{n \cdot 2^n}$.
  explanation: |-
    Absolute convergence by ratio test ($1/2 < 1$). Absolutely converges.
- id: img-convtest-007-v1
  concept: Root Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \left(\frac{n}{n+2}\right)^{n^2}$.
  explanation: |-
    Root: $(n/(n+2))^n = 1/(1+2/n)^n \to 1/e^2 < 1$. Converges.
- id: img-convtest-007-v2
  concept: Root Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \left(\frac{2n}{n+1}\right)^{n^2}$.
  explanation: |-
    Root: $(2n/(n+1))^n \to \infty$. Diverges.
- id: img-convtest-007-v3
  concept: Root Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \left(\frac{n+1}{n}\right)^{n^2}$.
  explanation: |-
    Root: $(1+1/n)^n \to e > 1$. Diverges.
- id: img-convtest-008-v1
  concept: Integral Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{\ln n}{n^4}$.
  explanation: |-
    Comparison with $n^{0.5}/n^4 = 1/n^{3.5}$. Converges.
- id: img-convtest-008-v2
  concept: Integral Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{\ln n}{\sqrt{n}}$.
  explanation: |-
    Comparison: $\ln n / \sqrt{n} > 1/\sqrt{n}$ (for $n>2$). Diverges.
- id: img-convtest-008-v3
  concept: Integral Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{(\ln n)^2}{n}$.
  explanation: "Integral test: $\\int (\\ln x)^2/x \\, dx = (\\ln x)^3/3 \to \\infty$. Diverges."
- id: img-convtest-009-v1
  concept: Alternating Series Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n n^2}{n^3+5}$.
  explanation: |-
    AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.
- id: img-convtest-009-v2
  concept: Alternating Series Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n n}{n^4+1}$.
  explanation: |-
    Absolute: $\sim 1/n^3$, converges. Absolutely converges.
- id: img-convtest-009-v3
  concept: Alternating Series Test
  difficulty: 4
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n (n+1)}{n^2+n}$.
  explanation: |-
    AST: $1/n \to 0$. Conditionally converges.
- id: img-convtest-010-v1
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{n^3+2}{n^5+n}$.
  explanation: |-
    LCT with $1/n^2$. Converges.
- id: img-convtest-010-v2
  concept: Limit Comparison Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{n^2+1}{n^3+2n}$.
  explanation: |-
    LCT with $1/n$. Diverges.
- id: img-convtest-010-v3
  concept: Limit Comparison Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n (n^2+1)}{n^4+2}$.
  explanation: |-
    Absolute convergence via LCT with $1/n^2$. Absolutely converges.
- id: img-convtest-011-v1
  concept: Root Test
  difficulty: 3
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \left(\frac{4n}{3n+2}\right)^n$.
  explanation: |-
    Root test: $4/3 > 1$. Diverges.
- id: img-convtest-011-v2
  concept: Root Test
  difficulty: 2
  source: |-
    Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \left(\frac{n}{2n+1}\right)^n$.
  explanation: |-
