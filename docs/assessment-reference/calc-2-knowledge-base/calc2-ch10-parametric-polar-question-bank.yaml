items:
- id: ch10-stewart-001
  concept: Polar Coordinates
  difficulty: 3
  source: Stewart Calculus Chapter 10 Inspired
  prompt: Find the area enclosed by the polar curve r = 5\sin(3\theta).
  answer: 25*pi/4
  solutionOutline: Integrate 1/2 r^2 d(theta) over one loop and multiply.
