schemaVersion: 1
bankId: calc2-taylor-maclaurin-olympiad
categoryId: calculus-2
topicIds: [taylor-maclaurin]
minimumItemCount: 30
items:
  - id: calc2-taylor-oly-001
    topicId: taylor-maclaurin
    skills: [extract-coefficients-with-complex-exponentials]
    archetype: vanished-real-part-coefficient
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing a zero coefficient through the phase of a complex power.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^{10}$ in $e^x\cos x$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1/10!$'}, {id: c, text: '$32/10!$'}, {id: d, text: '$-32/10!$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient is $\operatorname{Re}(1+i)^{10}/10!$, and $(1+i)^{10}=32i$ is purely imaginary.
    commonTrap: Assuming every even power in the product has a nonzero coefficient.
    verification: {method: complex-phase-coefficient, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-002
    topicId: taylor-maclaurin
    skills: [recognize-sparse-composite-series]
    archetype: sine-quadratic-support
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires determining the entire exponent pattern after composition.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^9$ in $\sin(x^2)$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1/9!$'}, {id: c, text: '$-1/6$'}, {id: d, text: '$1/120$'}]
    answer: {choiceId: a}
    solutionOutline: The nonzero exponents are $4k+2$, so no ninth-degree term occurs.
    commonTrap: Looking only at the odd powers in sine before multiplying their exponents by two.
    verification: {method: composite-exponent-support, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-003
    topicId: taylor-maclaurin
    skills: [evaluate-high-cancellation-limits]
    archetype: fifth-order-sine-remainder
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires following cancellation through two leading odd terms.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate
      $\displaystyle\lim_{x\to0}\frac{\sin x-x+x^3/6}{x^5}$.
    choices: [{id: a, text: '$1/120$'}, {id: b, text: '$-1/120$'}, {id: c, text: '$1/24$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: After cancellation, the first surviving sine term is $x^5/5!$.
    commonTrap: Retaining the negative cubic sign after that term has been explicitly canceled.
    verification: {method: fifth-order-leading-term, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-004
    topicId: taylor-maclaurin
    skills: [compute-logarithmic-cauchy-products]
    archetype: squared-logarithm-harmonic-number
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires reducing a convolution to a harmonic-number identity.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^8$ in $[\log(1+x)]^2$?
    choices: [{id: a, text: '$363/560$'}, {id: b, text: '$-363/560$'}, {id: c, text: '$1/64$'}, {id: d, text: '$1/8$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient is $\sum_{k=1}^{7}(-1)^k(-1)^{8-k}/[k(8-k)]=2H_7/8=363/560$.
    commonTrap: Forgetting that the two alternating signs combine to a positive sign for even total degree.
    verification: {method: logarithm-convolution-harmonic-sum, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-005
    topicId: taylor-maclaurin
    skills: [extract-tangent-series-coefficients]
    archetype: tangent-fifth-degree
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires series division or a differential identity rather than direct memorization.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^5$ in the Maclaurin series for
      $\tan x$?
    choices: [{id: a, text: '$2/15$'}, {id: b, text: '$1/15$'}, {id: c, text: '$-2/15$'}, {id: d, text: '$1/120$'}]
    answer: {choiceId: a}
    solutionOutline: Dividing the sine series by the cosine series gives $\tan x=x+x^3/3+2x^5/15+\cdots$.
    commonTrap: Using the fifth-degree sine coefficient without accounting for division by cosine.
    verification: {method: trigonometric-series-division, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-006
    topicId: taylor-maclaurin
    skills: [derive-ode-coefficient-recurrences]
    archetype: airy-equation-modular-support
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires aligning the coefficient sequences in a variable-coefficient second-order equation.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $y=\sum_{n=0}^{\infty}a_nx^n$ satisfies $y''=xy$, which
      recurrence holds for $n\ge1$?
    choices: [{id: a, text: '$a_{n+2}=a_{n-1}/[(n+2)(n+1)]$'}, {id: b, text: '$a_{n+2}=a_n/[(n+2)(n+1)]$'}, {id: c, text: '$a_{n+1}=na_n$'}, {id: d, text: '$a_{n+2}=-(n+2)(n+1)a_{n-1}$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient of $x^n$ in xy is $a_{n-1}$, while in the second derivative it is $(n+2)(n+1)a_{n+2}$.
    commonTrap: Missing the one-place exponent shift introduced by multiplication by x.
    verification: {method: airy-coefficient-alignment, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-007
    topicId: taylor-maclaurin
    skills: [invert-series-with-lagrange-inversion]
    archetype: lambert-w-coefficient
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires recognizing the inverse of $xe^x$ and applying the inverse-series coefficient formula.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Near zero, let w be the inverse function of $x\mapsto xe^x$. What
      is the coefficient of $x^4$ in w?
    choices: [{id: a, text: '$-8/3$'}, {id: b, text: '$8/3$'}, {id: c, text: '$-1/24$'}, {id: d, text: '$4$'}]
    answer: {choiceId: a}
    solutionOutline: Lagrange inversion gives $[x^n]w=(-n)^{n-1}/n!$; at n equals four this is minus sixty-four over twenty-four.
    commonTrap: Omitting the alternating sign in the inverse-series coefficients.
    verification: {method: lagrange-inversion-lambert-series, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-008
    topicId: taylor-maclaurin
    skills: [compose-exponential-series]
    archetype: cubic-input-factorial-index
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires mapping a requested exponent back to the correct exponential index.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^{12}$ in $e^{x^3}$?
    choices: [{id: a, text: '$1/24$'}, {id: b, text: '$1/12!$'}, {id: c, text: '$1/4$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The term $(x^3)^k/k!$ reaches degree twelve when k equals four.
    commonTrap: Using twelve factorial based on the final exponent instead of the exponential-series index.
    verification: {method: composite-exponential-index, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-009
    topicId: taylor-maclaurin
    skills: [use-parity-to-constrain-series]
    archetype: analytic-even-function
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires translating a functional symmetry into coefficient equations.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      An analytic function near zero satisfies $f(-x)=f(x)$. What must be
      true of its Maclaurin coefficients?
    choices: [{id: a, text: 'Every odd-degree coefficient is zero.'}, {id: b, text: 'Every even-degree coefficient is zero.'}, {id: c, text: 'All coefficients are positive.'}, {id: d, text: 'Only finitely many coefficients are nonzero.'}]
    answer: {choiceId: a}
    solutionOutline: Comparing $\sum a_n(-x)^n$ with $\sum a_nx^n$ forces $a_n=-a_n$ for each odd n.
    commonTrap: Confusing even symmetry with an even number of nonzero terms.
    verification: {method: power-series-uniqueness-parity, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-010
    topicId: taylor-maclaurin
    skills: [recognize-bernoulli-series-structure]
    archetype: removable-generating-function-parity
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires expanding a quotient far enough to detect a missing odd-power term.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^3$ in the removable extension of
      $x/(e^x-1)$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$-1/6$'}, {id: c, text: '$1/12$'}, {id: d, text: '$-1/720$'}]
    answer: {choiceId: a}
    solutionOutline: Series division gives $1-x/2+x^2/12-x^4/720+\cdots$, with no cubic term.
    commonTrap: Assuming signs alternate at every degree even when a coefficient vanishes.
    verification: {method: exponential-quotient-series-division, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-011
    topicId: taylor-maclaurin
    skills: [derive-generalized-binomial-recurrences]
    archetype: adjacent-binomial-coefficients
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires deriving the coefficient ratio for a noninteger exponent.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $(1+x)^\alpha=\sum_{n=0}^{\infty}c_nx^n$, which recurrence is
      valid?
    choices: [{id: a, text: '$c_{n+1}=c_n(\alpha-n)/(n+1)$'}, {id: b, text: '$c_{n+1}=\alpha c_n$'}, {id: c, text: '$c_{n+1}=c_n(n+1)/(\alpha-n)$'}, {id: d, text: '$c_{n+1}=(-1)^nc_n$'}]
    answer: {choiceId: a}
    solutionOutline: Divide $\binom{\alpha}{n+1}$ by $\binom{\alpha}{n}$ to obtain $(\alpha-n)/(n+1)$.
    commonTrap: Applying the constant ratio of an exponential series to binomial coefficients.
    verification: {method: generalized-binomial-adjacent-ratio, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-012
    topicId: taylor-maclaurin
    skills: [extract-coefficients-from-trigonometric-identities]
    archetype: squared-sine-eighth-degree
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires transforming a product before extracting a relatively high coefficient.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^8$ in $\sin^2 x$?
    choices: [{id: a, text: '$-1/315$'}, {id: b, text: '$1/315$'}, {id: c, text: '$-2/315$'}, {id: d, text: '$1/8!$'}]
    answer: {choiceId: a}
    solutionOutline: Use $\sin^2x=(1-\cos2x)/2$; the degree-eight coefficient is $-\frac12(2^8/8!)=-1/315$.
    commonTrap: Losing the negative sign in one minus cosine.
    verification: {method: double-angle-coefficient-extraction, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-013
    topicId: taylor-maclaurin
    skills: [apply-analytic-identity-principles]
    archetype: infinite-order-zero
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires connecting all vanished derivatives to uniqueness of an analytic expansion.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      An analytic function near zero satisfies $f^{(n)}(0)=0$ for every
      $n\ge0$. What follows in some neighborhood of zero?
    choices: [{id: a, text: '$f$ is identically zero.'}, {id: b, text: '$f$ may equal $e^{-1/x^2}$ away from zero.'}, {id: c, text: '$f$ must be odd.'}, {id: d, text: 'Only $f(0)$ is determined.'}]
    answer: {choiceId: a}
    solutionOutline: Every Maclaurin coefficient is zero, and analyticity means the function equals that series locally.
    commonTrap: Using a smooth but nonanalytic flat function as a counterexample.
    verification: {method: analytic-series-uniqueness, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-014
    topicId: taylor-maclaurin
    skills: [identify-orders-of-composite-zeros]
    archetype: leading-order-composition
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires composing leading terms without expanding the full series.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Suppose $f(x)=x^2+O(x^3)$ and $g(x)=x^3+O(x^4)$. What is the
      order of the zero of $f(g(x))$ at zero?
    choices: [{id: a, text: '$6$'}, {id: b, text: '$5$'}, {id: c, text: '$3$'}, {id: d, text: '$2$'}]
    answer: {choiceId: a}
    solutionOutline: The leading term of f is its input squared, and the leading input from g is $x^3$, producing $x^6$.
    commonTrap: Adding the two orders instead of multiplying them under composition.
    verification: {method: composite-leading-order, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-015
    topicId: taylor-maclaurin
    skills: [translate-centers-in-entire-series]
    archetype: exponential-center-change
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires factoring the function value at the new center and preserving the displacement variable.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Which expansion represents $e^{3x}$ in powers of $x-2$?
    choices: [{id: a, text: '$e^6\sum_{n=0}^{\infty}3^n(x-2)^n/n!$'}, {id: b, text: '$\sum 3^n(x-2)^n/n!$'}, {id: c, text: '$e^2\sum (3x)^n/n!$'}, {id: d, text: '$e^6\sum (x-2)^n/(3^n n!)$'}]
    answer: {choiceId: a}
    solutionOutline: Write $3x=6+3(x-2)$ and split the exponential into $e^6e^{3(x-2)}$.
    commonTrap: Changing the center but discarding the multiplicative factor created by the constant shift.
    verification: {method: exponential-center-factorization, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-016
    topicId: taylor-maclaurin
    skills: [extract-imaginary-exponential-coefficients]
    archetype: exponential-sine-seventh-degree
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires tracking magnitude and phase through a complex power.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^7$ in $e^x\sin x$?
    choices: [{id: a, text: '$-1/630$'}, {id: b, text: '$1/630$'}, {id: c, text: '$-1/7!$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient is $\operatorname{Im}(1+i)^7/7!=-8/5040=-1/630$.
    commonTrap: Taking the real part, which corresponds to the cosine product.
    verification: {method: complex-exponential-imaginary-part, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-017
    topicId: taylor-maclaurin
    skills: [recognize-central-binomial-generating-series]
    archetype: inverse-square-root-coefficient
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires converting a generalized binomial coefficient to a central binomial form.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^n$ in $(1-4x)^{-1/2}$?
    choices: [{id: a, text: '$\binom{2n}{n}$'}, {id: b, text: '$4^n$'}, {id: c, text: '$\binom{2n}{n}/4^n$'}, {id: d, text: '$(-1)^n\binom{2n}{n}$'}]
    answer: {choiceId: a}
    solutionOutline: The identity $(1-z)^{-1/2}=\sum\binom{2n}{n}z^n/4^n$ with $z=4x$ cancels the denominator $4^n$.
    commonTrap: Retaining the normalization factor after also scaling the input by four.
    verification: {method: central-binomial-generating-identity, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-018
    topicId: taylor-maclaurin
    skills: [use-parity-in-inverse-trigonometric-series]
    archetype: arcsine-even-degree
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires identifying parity without unnecessary coefficient calculation.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^{10}$ in the Maclaurin series for
      $\arcsin x$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$\binom{20}{10}/(4^{10}\cdot21)$'}, {id: c, text: '$1/10!$'}, {id: d, text: '$-1/10$'}]
    answer: {choiceId: a}
    solutionOutline: Arcsine is odd, so its Maclaurin series contains no even-degree powers.
    commonTrap: Applying the nonzero odd-coefficient formula at an even exponent.
    verification: {method: inverse-sine-parity, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-019
    topicId: taylor-maclaurin
    skills: [evaluate-logarithmic-trigonometric-limits]
    archetype: log-cosine-leading-term
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires composing a logarithm with a trigonometric expansion and isolating leading order.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\lim_{x\to0}\frac{\log(\cos x)}{x^2}$.
    choices: [{id: a, text: '$-1/2$'}, {id: b, text: '$1/2$'}, {id: c, text: '$-1$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: Since $\cos x=1-x^2/2+O(x^4)$ and $\log(1+u)=u+O(u^2)$, the numerator is $-x^2/2+O(x^4)$.
    commonTrap: Dropping the negative sign in the leading cosine displacement.
    verification: {method: nested-leading-term-expansion, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-020
    topicId: taylor-maclaurin
    skills: [solve-nonlinear-odes-by-series]
    archetype: reciprocal-solution-geometric-series
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires connecting a nonlinear initial-value problem to its analytic solution and series.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      If $y'=y^2$ and $y(0)=1$, what is the coefficient of $x^8$ in
      the Maclaurin series of y?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$1/8!$'}, {id: c, text: '$8$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The local solution is $y=1/(1-x)=\sum_{n\ge0}x^n$.
    commonTrap: Treating the equation as the linear problem $y'=y$.
    verification: {method: separable-ivp-geometric-solution, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-021
    topicId: taylor-maclaurin
    skills: [derive-series-from-differential-equations]
    archetype: exponential-characterization
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires converting an initial-value relation into a coefficient recurrence.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      An analytic function satisfies $f'=2f$ and $f(0)=3$. What is its
      Maclaurin coefficient $a_n$?
    choices: [{id: a, text: '$3\cdot2^n/n!$'}, {id: b, text: '$3^n/n!$'}, {id: c, text: '$2n+3$'}, {id: d, text: '$3/2^n$'}]
    answer: {choiceId: a}
    solutionOutline: Coefficient matching gives $(n+1)a_{n+1}=2a_n$ starting from $a_0=3$.
    commonTrap: Omitting the factorial accumulated from repeated division by n plus one.
    verification: {method: first-order-ode-coefficient-recurrence, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-022
    topicId: taylor-maclaurin
    skills: [compose-nonlinear-exponential-series]
    archetype: cancellation-in-exponential-of-sine
    difficulty: olympiad
    reasoningDepth: 6
    difficultyEvidence: Requires collecting contributions from multiple powers of the inner series.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^3$ in $e^{\sin x}$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1/6$'}, {id: c, text: '$-1/6$'}, {id: d, text: '$1/3$'}]
    answer: {choiceId: a}
    solutionOutline: The cubic contribution from $\sin x$ is minus one-sixth, while the cubic contribution from $(\sin x)^3/6$ is plus one-sixth.
    commonTrap: Taking only the cubic term of the inner sine series.
    verification: {method: composite-series-degree-collection, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-023
    topicId: taylor-maclaurin
    skills: [identify-hyperbolic-series-parity]
    archetype: cosh-even-series
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires deriving parity from exponential definitions.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Which is the Maclaurin series for $\cosh x$?
    choices: [{id: a, text: '$\sum_{n=0}^{\infty}x^{2n}/(2n)!$'}, {id: b, text: '$\sum x^{2n+1}/(2n+1)!$'}, {id: c, text: '$\sum(-1)^nx^{2n}/(2n)!$'}, {id: d, text: '$\sum x^n/n$'}]
    answer: {choiceId: a}
    solutionOutline: Averaging $e^x$ and $e^{-x}$ cancels odd powers and retains every even power with positive sign.
    commonTrap: Importing the alternating signs from the cosine series.
    verification: {method: hyperbolic-exponential-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-024
    topicId: taylor-maclaurin
    skills: [compute-generalized-binomial-coefficients]
    archetype: inverse-square-root-sixth-degree
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires reducing a half-integer binomial coefficient exactly.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^6$ in $(1+x)^{-1/2}$?
    choices: [{id: a, text: '$231/1024$'}, {id: b, text: '$-231/1024$'}, {id: c, text: '$63/256$'}, {id: d, text: '$1/64$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient is positive for even degree and equals $\binom{12}{6}/4^6=924/4096=231/1024$.
    commonTrap: Assigning a negative sign to every coefficient because the exponent is negative.
    verification: {method: half-integer-binomial-reduction, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-oly-025
    topicId: taylor-maclaurin
    skills: [find-radii-of-trigonometric-taylor-series]
    archetype: tangent-nearest-poles
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires connecting real Taylor convergence to the nearest complex-analytic singularities.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the radius of the Maclaurin series for $\tan x$?
    choices: [{id: a, text: '$\pi/2$'}, {id: b, text: '$\pi$'}, {id: c, text: '$1$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Tangent has its nearest poles where cosine vanishes, at plus and minus pi over two.
    commonTrap: Using the period pi as the radius.
    verification: {method: nearest-tangent-pole-distance, result: verified}
