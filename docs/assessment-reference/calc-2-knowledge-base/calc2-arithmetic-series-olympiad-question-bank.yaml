schemaVersion: 1
bankId: calc2-arithmetic-series-olympiad
categoryId: calculus-2
topicIds: [arithmetic-series]
minimumItemCount: 30
items:
  - id: calc2-arith-oly-001
    topicId: arithmetic-series
    skills: [solve-symmetric-arithmetic-progressions]
    archetype: five-term-sum-and-endpoint-product
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires centering five terms at their mean and using a product constraint.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Five increasing positive terms are in arithmetic progression. Their sum
      is $55$, and the product of the first and last terms is $85$. What is
      the common difference?
    choices: [{id: a, text: '$3$'}, {id: b, text: '$2$'}, {id: c, text: '$4$'}, {id: d, text: '$5$'}]
    answer: {choiceId: a}
    solutionOutline: The middle term is eleven, so the endpoints are $11-2d$ and $11+2d$; their product gives $121-4d^2=85$.
    commonTrap: Using eleven plus or minus d for endpoints that are two steps from the center.
    verification: {method: centered-five-term-parameterization, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-002
    topicId: arithmetic-series
    skills: [solve-arithmetic-triples-from-power-sums]
    archetype: sum-and-square-sum
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires converting symmetric terms into a quadratic constraint.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Three increasing positive integers in arithmetic progression have sum
      $21$ and sum of squares $165$. What are they?
    choices: [{id: a, text: '$4,7,10$'}, {id: b, text: '$3,7,11$'}, {id: c, text: '$5,7,9$'}, {id: d, text: '$1,7,13$'}]
    answer: {choiceId: a}
    solutionOutline: Write the terms as $7-d,7,7+d$; their squares sum to $147+2d^2=165$, so d equals three.
    commonTrap: Applying the sum condition but not checking the square-sum constraint.
    verification: {method: centered-square-sum-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-003
    topicId: arithmetic-series
    skills: [invert-quadratic-partial-sums]
    archetype: partial-sum-polynomial
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires an exact discrete derivative rather than ordinary differentiation.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      A sequence has partial sums $S_n=n(3n+1)$. What is $a_n$?
    choices: [{id: a, text: '$6n-2$'}, {id: b, text: '$6n+1$'}, {id: c, text: '$3n+1$'}, {id: d, text: '$6n-1$'}]
    answer: {choiceId: a}
    solutionOutline: Subtract $S_{n-1}=(n-1)(3n-2)$ from S_n to obtain $6n-2$.
    commonTrap: Taking a continuous derivative and obtaining a nonexact constant term.
    verification: {method: discrete-partial-sum-difference, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-004
    topicId: arithmetic-series
    skills: [evaluate-floor-arithmetic-sums]
    archetype: periodic-floor-increments
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires exploiting the period-five residue pattern rather than listing blindly.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{k=1}^{20}\left\lfloor\frac{3k+1}{5}\right\rfloor$.
    choices: [{id: a, text: '$122$'}, {id: b, text: '$120$'}, {id: c, text: '$126$'}, {id: d, text: '$118$'}]
    answer: {choiceId: a}
    solutionOutline: Group k into four blocks of five; increasing k by five raises each floor by three, and the first block sums to eight, giving $8+(8+15)+(8+30)+(8+45)=122$.
    commonTrap: Replacing the floor of a sum by the sum of separate floors.
    verification: {method: residue-block-floor-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-005
    topicId: arithmetic-series
    skills: [solve-arithmetic-digit-numbers]
    archetype: digit-sum-and-reversal
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires combining centered digit structure with a base-ten reversal equation.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      The digits of a three-digit number form an increasing arithmetic
      progression and sum to $18$. Reversing the digits increases the number
      by $594$. What is the number?
    choices: [{id: a, text: '$369$'}, {id: b, text: '$258$'}, {id: c, text: '$147$'}, {id: d, text: '$468$'}]
    answer: {choiceId: a}
    solutionOutline: The digits are $6-d,6,6+d$, and reversal changes the number by $198d$; hence d equals three.
    commonTrap: Dividing the reversal difference by ninety-nine instead of accounting for both outer digits.
    verification: {method: centered-digits-reversal-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-006
    topicId: arithmetic-series
    skills: [relate-arithmetic-and-harmonic-means]
    archetype: reciprocals-in-arithmetic-progression
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires translating an arithmetic condition on reciprocals into an algebraic mean identity.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Positive numbers $a,b,c$ have reciprocals in arithmetic progression.
      Which equation must hold?
    choices: [{id: a, text: '$b=2ac/(a+c)$'}, {id: b, text: '$b=(a+c)/2$'}, {id: c, text: '$b^2=ac$'}, {id: d, text: '$b=a+c$'}]
    answer: {choiceId: a}
    solutionOutline: The condition $2/b=1/a+1/c$ solves to the harmonic-mean formula $b=2ac/(a+c)$.
    commonTrap: Applying the ordinary arithmetic-mean formula to the original numbers rather than their reciprocals.
    verification: {method: reciprocal-ap-algebra, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-007
    topicId: arithmetic-series
    skills: [compare-arithmetic-and-geometric-progressions]
    archetype: simultaneous-positive-progressions
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires combining equality of arithmetic and geometric means.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Three positive numbers are simultaneously in arithmetic progression and
      geometric progression in the same order. What must be true?
    choices: [{id: a, text: 'All three numbers are equal.'}, {id: b, text: 'The middle number is twice the first.'}, {id: c, text: 'The common difference is one.'}, {id: d, text: 'The common ratio is two.'}]
    answer: {choiceId: a}
    solutionOutline: The middle is both the arithmetic and geometric mean of the endpoints; equality in AM–GM forces the endpoints equal.
    commonTrap: Searching for a nonconstant numerical example without applying the equality condition.
    verification: {method: am-gm-equality, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-008
    topicId: arithmetic-series
    skills: [derive-parameter-ratios-from-partial-sums]
    archetype: scaled-partial-sum-identity
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires reducing an identity between two finite sums to a parameter ratio.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      An arithmetic sequence with first term a and difference d satisfies
      $S_{20}=5S_{10}$. What is $a:d$?
    choices: [{id: a, text: '$-7:6$'}, {id: b, text: '$7:6$'}, {id: c, text: '$-6:7$'}, {id: d, text: '$1:1$'}]
    answer: {choiceId: a}
    solutionOutline: Substitute the two sum formulas to obtain $20a+190d=50a+225d$, hence $30a=-35d$.
    commonTrap: Cancelling the factor five against the term counts before expanding the endpoint contributions.
    verification: {method: partial-sum-parameter-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-009
    topicId: arithmetic-series
    skills: [use-index-symmetry]
    archetype: equal-index-sum-invariant
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires recognizing an invariant of linear index dependence.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      In an arithmetic sequence, $a_2+a_{14}=30$. What is
      $a_5+a_{11}$?
    choices: [{id: a, text: '$30$'}, {id: b, text: '$16$'}, {id: c, text: '$60$'}, {id: d, text: 'Cannot be determined'}]
    answer: {choiceId: a}
    solutionOutline: Both index pairs sum to sixteen, so the explicit linear formula gives equal term sums.
    commonTrap: Assuming the common difference is needed to compare symmetric index pairs.
    verification: {method: equal-index-sum-identity, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-010
    topicId: arithmetic-series
    skills: [solve-deletion-average-problems]
    archetype: remove-one-integer
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires comparing original and modified totals with different counts.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      One number is removed from $1,2,\ldots,100$, and the average of the
      remaining $99$ numbers is $50$. Which number was removed?
    choices: [{id: a, text: '$100$'}, {id: b, text: '$50$'}, {id: c, text: '$99$'}, {id: d, text: '$1$'}]
    answer: {choiceId: a}
    solutionOutline: The original total is 5050 and the remaining total is $99\cdot50=4950$, leaving removed value 100.
    commonTrap: Assuming the removed number equals the new average.
    verification: {method: total-difference, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-011
    topicId: arithmetic-series
    skills: [characterize-arithmetic-sequences-by-differences]
    archetype: zero-second-difference
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires recognizing a discrete linearity criterion.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Which identity for every applicable n characterizes arithmetic
      sequences?
    choices: [{id: a, text: '$a_{n+2}-2a_{n+1}+a_n=0$'}, {id: b, text: '$a_{n+1}^2=a_na_{n+2}$'}, {id: c, text: '$a_{n+2}=a_{n+1}a_n$'}, {id: d, text: '$a_{n+1}/a_n$ is constant'}]
    answer: {choiceId: a}
    solutionOutline: A zero second difference says consecutive first differences are equal.
    commonTrap: Selecting the constant-ratio condition for a geometric sequence.
    verification: {method: discrete-second-difference, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-012
    topicId: arithmetic-series
    skills: [sum-arithmetic-subsequences]
    archetype: every-third-term-sum
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires forming a sampled arithmetic sequence and summing it.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $a_n=2n+1$, evaluate $a_3+a_6+\cdots+a_{30}$.
    choices: [{id: a, text: '$340$'}, {id: b, text: '$330$'}, {id: c, text: '$310$'}, {id: d, text: '$610$'}]
    answer: {choiceId: a}
    solutionOutline: The ten sampled terms run from seven to sixty-one with common difference six, so their sum is $10(7+61)/2=340$.
    commonTrap: Treating thirty as the number of sampled terms.
    verification: {method: sampled-progression-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-013
    topicId: arithmetic-series
    skills: [solve-equal-block-sums]
    archetype: consecutive-integer-partition
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires solving a triangular-number equation for an exact partition.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      The list $1,2,\ldots,20$ is split after k. For which k do the two
      blocks have equal sum?
    choices: [{id: a, text: '$14$'}, {id: b, text: '$10$'}, {id: c, text: '$15$'}, {id: d, text: 'No such k'}]
    answer: {choiceId: a}
    solutionOutline: The total is 210, so the first block must sum to 105; $14\cdot15/2=105$.
    commonTrap: Splitting by equal block lengths rather than equal block sums.
    verification: {method: half-total-triangular-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-014
    topicId: arithmetic-series
    skills: [analyze-square-arithmetic-progressions]
    archetype: square-endpoints-and-middle
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires using the arithmetic mean and checking that it is itself a square.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      The squares $1$ and $49$ are the first and third terms of a
      three-term arithmetic progression of squares. What is the middle term?
    choices: [{id: a, text: '$25$'}, {id: b, text: '$24$'}, {id: c, text: '$16$'}, {id: d, text: '$36$'}]
    answer: {choiceId: a}
    solutionOutline: The middle arithmetic term is the endpoint average $(1+49)/2=25$, which is the square of five.
    commonTrap: Averaging the square roots instead of the square values.
    verification: {method: arithmetic-mean-of-endpoint-squares, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-015
    topicId: arithmetic-series
    skills: [derive-general-arithmetic-sums]
    archetype: symbolic-linear-summand
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires reducing a symbolic progression to standard finite sums.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Simplify $\sum_{k=1}^{n}[a+(k-1)d]$.
    choices: [{id: a, text: '$na+dn(n-1)/2$'}, {id: b, text: '$na+dn(n+1)/2$'}, {id: c, text: '$a+(n-1)d$'}, {id: d, text: '$n(a+d)$'}]
    answer: {choiceId: a}
    solutionOutline: Sum the constant a over n terms and use $\sum_{k=1}^{n}(k-1)=n(n-1)/2$.
    commonTrap: Using the sum from one through n instead of zero through n minus one.
    verification: {method: symbolic-sigma-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-016
    topicId: arithmetic-series
    skills: [solve-centered-four-term-progressions]
    archetype: sum-and-square-sum
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires a symmetric four-term parameterization with two constraints.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Four increasing terms in arithmetic progression have sum $40$ and sum
      of squares $580$. What is their common difference?
    choices: [{id: a, text: '$6$'}, {id: b, text: '$3$'}, {id: c, text: '$4$'}, {id: d, text: '$8$'}]
    answer: {choiceId: a}
    solutionOutline: Write the terms as $10-3r,10-r,10+r,10+3r$; their square sum is $400+20r^2=580$, so r equals three and the actual adjacent difference is $2r=6$.
    commonTrap: Reporting the half-difference parameter r instead of the common difference.
    verification: {method: symmetric-four-term-square-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-017
    topicId: arithmetic-series
    skills: [evaluate-absolute-distance-sums]
    archetype: split-at-central-index
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires splitting an absolute-value sum into two arithmetic progressions.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{k=1}^{50}|k-25|$.
    choices: [{id: a, text: '$625$'}, {id: b, text: '$600$'}, {id: c, text: '$650$'}, {id: d, text: '$1275$'}]
    answer: {choiceId: a}
    solutionOutline: Distances on the left sum $1+\cdots+24=300$, and those on the right sum $1+\cdots+25=325$.
    commonTrap: Assuming equal counts on both sides of 25 within the asymmetric interval 1 through 50.
    verification: {method: piecewise-triangular-sums, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-018
    topicId: arithmetic-series
    skills: [recover-sequences-from-global-sum-identities]
    archetype: square-partial-sums
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires extracting every term from an identity valid for all n.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      A sequence satisfies $a_1+\cdots+a_n=n^2$ for every positive integer
      n. Which formula is forced?
    choices: [{id: a, text: '$a_n=2n-1$'}, {id: b, text: '$a_n=n$'}, {id: c, text: '$a_n=n^2$'}, {id: d, text: '$a_n=2n+1$'}]
    answer: {choiceId: a}
    solutionOutline: Consecutive square partial sums differ by $n^2-(n-1)^2=2n-1$.
    commonTrap: Treating the partial-sum value n squared as the nth term.
    verification: {method: difference-of-squares-partial-sums, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-019
    topicId: arithmetic-series
    skills: [derive-zero-sum-conditions]
    archetype: parameterized-zero-partial-sum
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires solving a symbolic finite-sum condition.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      An arithmetic progression has nonzero difference d and first n terms
      summing to zero. What is $a_1$?
    choices: [{id: a, text: '$-(n-1)d/2$'}, {id: b, text: '$-nd/2$'}, {id: c, text: '$(n-1)d/2$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: Setting $n[2a_1+(n-1)d]/2=0$ forces the bracket to vanish.
    commonTrap: Replacing the n minus one increments by n.
    verification: {method: symbolic-zero-sum-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-020
    topicId: arithmetic-series
    skills: [use-average-index-symmetry]
    archetype: ten-term-complementary-pair
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires deriving a pair invariant from the total average.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Ten terms of an arithmetic sequence have sum $100$. What is
      $a_3+a_8$?
    choices: [{id: a, text: '$20$'}, {id: b, text: '$10$'}, {id: c, text: '$100$'}, {id: d, text: 'Cannot be determined'}]
    answer: {choiceId: a}
    solutionOutline: The average is ten, so every complementary pair whose indices sum to eleven has sum twenty.
    commonTrap: Assuming individual terms are unknown and overlooking the invariant pair sum.
    verification: {method: complementary-index-pair-average, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-021
    topicId: arithmetic-series
    skills: [optimize-products-under-arithmetic-symmetry]
    archetype: fixed-sum-four-term-product
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires combining symmetry with a product-maximization inequality.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Four nonnegative terms in arithmetic progression have sum $40$. What is
      the greatest possible product?
    choices: [{id: a, text: '$10{,}000$'}, {id: b, text: '$9{,}801$'}, {id: c, text: '$6{,}400$'}, {id: d, text: '$40^4$'}]
    answer: {choiceId: a}
    solutionOutline: AM–GM bounds the product by $(40/4)^4$, and equality occurs at the valid constant progression $10,10,10,10$.
    commonTrap: Assuming the common difference must be nonzero despite no such restriction.
    verification: {method: am-gm-equality-progression, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-022
    topicId: arithmetic-series
    skills: [compare-consecutive-block-sums]
    archetype: equal-length-adjacent-blocks
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires comparing two symbolic blocks rather than expanding every term.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      In an arithmetic sequence, the sum of terms $a_1$ through $a_n$ equals
      the sum of $a_{n+1}$ through $a_{2n}$. What must hold?
    choices: [{id: a, text: '$d=0$'}, {id: b, text: '$a_1=0$'}, {id: c, text: '$d=1$'}, {id: d, text: '$a_n=0$'}]
    answer: {choiceId: a}
    solutionOutline: Each term in the second block exceeds its paired first-block term by nd, so the block-sum difference is $n^2d$.
    commonTrap: Looking for cancellation inside the blocks rather than pairing corresponding positions.
    verification: {method: paired-block-difference, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-023
    topicId: arithmetic-series
    skills: [classify-palindromic-digit-progressions]
    archetype: four-digit-palindrome
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires combining equal outer digits with a constant first difference.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      The four digits of a four-digit palindrome are in arithmetic
      progression from left to right. Which conclusion is necessary?
    choices: [{id: a, text: 'All four digits are equal.'}, {id: b, text: 'The common difference is one.'}, {id: c, text: 'The number is divisible by $1001$ only.'}, {id: d, text: 'The middle digits are zero.'}]
    answer: {choiceId: a}
    solutionOutline: In a four-term arithmetic progression, equality of the first and fourth terms gives three d equal to zero.
    commonTrap: Using only the equality of the middle palindrome digits, which already implies d equals zero as well.
    verification: {method: palindrome-endpoint-difference, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-024
    topicId: arithmetic-series
    skills: [sum-quadratic-functions-of-arithmetic-terms]
    archetype: square-sum-of-linear-sequence
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires expanding and using both first- and second-power finite sums.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{k=1}^{10}(2k-1)^2$.
    choices: [{id: a, text: '$1330$'}, {id: b, text: '$1335$'}, {id: c, text: '$670$'}, {id: d, text: '$1000$'}]
    answer: {choiceId: a}
    solutionOutline: Expand to $4\sum k^2-4\sum k+10=4(385)-4(55)+10=1330$.
    commonTrap: Squaring the sum of the odd numbers instead of summing their squares.
    verification: {method: quadratic-power-sum-expansion, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-025
    topicId: arithmetic-series
    skills: [distinguish-polynomial-difference-orders]
    archetype: cubic-partial-sums
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires relating polynomial degree to discrete differences.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      If partial sums $S_n$ are given by a cubic polynomial in n with nonzero
      leading coefficient, what kind of sequence is $a_n=S_n-S_{n-1}$?
    choices: [{id: a, text: 'Quadratic, so not arithmetic in general'}, {id: b, text: 'Linear and always arithmetic'}, {id: c, text: 'Constant'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: One discrete difference lowers polynomial degree from three to two; arithmetic sequences are degree one.
    commonTrap: Confusing the second difference property of arithmetic terms with one difference of the partial sums.
    verification: {method: discrete-polynomial-degree, result: verified}
    reviewStatus: verified
  - id: calc2-arith-oly-026
    topicId: arithmetic-series
    skills: [prove-divisibility-of-odd-length-sums]
    archetype: integer-middle-term
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires a symmetry proof rather than direct computation.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      An arithmetic progression contains an odd number $2m+1$ of integer
      terms. Why is its sum divisible by $2m+1$?
    choices: [{id: a, text: 'Its average is the integer middle term.'}, {id: b, text: 'Every term is divisible by $2m+1$.'}, {id: c, text: 'Its common difference is divisible by $2m+1$.'}, {id: d, text: 'The claim is false.'}]
    answer: {choiceId: a}
    solutionOutline: Symmetric pairs average to the middle term, so the total equals the number of terms times that integer.
    commonTrap: Trying to prove termwise divisibility instead of divisibility of the total.
    verification: {method: odd-length-average-symmetry, result: verified}
