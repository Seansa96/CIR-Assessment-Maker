schemaVersion: 1
bankId: calc2-convergence-tests-hard
categoryId: calculus-2
topicIds: [convergence-tests]
minimumItemCount: 15
items:
  - id: calc2-tests-hard-001
    topicId: convergence-tests
    skills: [apply-limit-comparison-to-perturbed-terms]
    archetype: bounded-denominator-oscillation
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires proving a positive oscillatory perturbation remains harmonic-order.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=2}^{\infty}\frac1{n+(-1)^n}$.
    choices: [{id: a, text: 'Divergent by limit comparison with $1/n$'}, {id: b, text: 'Convergent by cancellation'}, {id: c, text: 'Conditionally convergent'}, {id: d, text: 'Divergent by the term test'}]
    answer: {choiceId: a}
    solutionOutline: The terms are positive and their quotient with $1/n$ is $n/[n+(-1)^n]\to1$.
    commonTrap: Treating oscillation in the denominator as alternating signs in the series.
    verification: {method: harmonic-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-002
    topicId: convergence-tests
    skills: [classify-bertrand-series]
    archetype: logarithmic-p-boundary
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires a substitution in an improper integral and the exact exponent threshold.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For which p does
      $\sum_{n=2}^{\infty}1/[n(\ln n)^p]$ converge?
    choices: [{id: a, text: '$p>1$'}, {id: b, text: '$p\ge1$'}, {id: c, text: '$p>0$'}, {id: d, text: 'Every real p'}]
    answer: {choiceId: a}
    solutionOutline: Substitution u equals ln x turns the integral into $\int u^{-p}\,du$, whose threshold is p greater than one.
    commonTrap: Including the p equals one case, which becomes the divergent logarithmic harmonic integral.
    verification: {method: integral-test-log-substitution, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-003
    topicId: convergence-tests
    skills: [apply-cauchy-condensation]
    archetype: square-root-log-series
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires condensing and then recognizing exponential growth in the condensed terms.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What does condensation show for
      $\sum_{n=2}^{\infty}1/[\sqrt n\,\ln n]$?
    choices: [{id: a, text: 'It diverges.'}, {id: b, text: 'It converges.'}, {id: c, text: 'It is alternating.'}, {id: d, text: 'The test is inapplicable because terms approach zero.'}]
    answer: {choiceId: a}
    solutionOutline: The condensed term is $2^k/[2^{k/2}k\ln2]=2^{k/2}/(k\ln2)$, which does not even approach zero.
    commonTrap: Assuming the logarithm makes every reciprocal-root series summable.
    verification: {method: exact-condensed-term-test, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-004
    topicId: convergence-tests
    skills: [apply-ratio-tests-to-factorials]
    archetype: factorial-over-even-factorial
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires simplifying multiple new factors in a consecutive ratio.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      How does $\sum_{n=1}^{\infty}n!/(2n)!$ behave?
    choices: [{id: a, text: 'It converges.'}, {id: b, text: 'It diverges harmonically.'}, {id: c, text: 'It is conditionally convergent.'}, {id: d, text: 'Its terms approach one.'}]
    answer: {choiceId: a}
    solutionOutline: The consecutive ratio is $(n+1)/[(2n+2)(2n+1)]\to0$.
    commonTrap: Cancelling only one of the two new denominator factors.
    verification: {method: factorial-ratio-test, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-005
    topicId: convergence-tests
    skills: [use-limsup-root-tests]
    archetype: parity-dependent-exponential-rate
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires computing two subsequential root limits and using their limsup.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Let $a_n=(1/2)^n$ for even n and $a_n=(3/4)^n$ for odd n. What does
      the root test conclude for $\sum a_n$?
    choices: [{id: a, text: 'It converges because the limsup root is $3/4$.'}, {id: b, text: 'It diverges because the root limit does not exist.'}, {id: c, text: 'It is conditionally convergent.'}, {id: d, text: 'The limsup root is $1$.'}]
    answer: {choiceId: a}
    solutionOutline: The nth roots alternate between one half and three fourths, and the decisive limsup remains below one.
    commonTrap: Believing nonexistence of the ordinary root limit makes the generalized root test unusable.
    verification: {method: parity-root-limsup, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-006
    topicId: convergence-tests
    skills: [choose-two-sided-comparisons]
    archetype: square-root-polynomial-denominator
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires extracting the correct asymptotic power from a radical.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}1/\sqrt{n^3+2n}$.
    choices: [{id: a, text: 'Convergent by limit comparison with $1/n^{3/2}$'}, {id: b, text: 'Divergent by comparison with $1/n$'}, {id: c, text: 'Conditionally convergent'}, {id: d, text: 'Divergent by the term test'}]
    answer: {choiceId: a}
    solutionOutline: Multiplying by $n^{3/2}$ gives $1/\sqrt{1+2/n^2}\to1$.
    commonTrap: Reading the exponent inside the square root as the final p-series exponent.
    verification: {method: radical-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-007
    topicId: convergence-tests
    skills: [interpret-ratio-test-boundaries]
    archetype: polynomial-series-ratio-one
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires following an inconclusive test with a decisive benchmark.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      The ratio test gives limit $1$ for $\sum1/n^3$. What is the correct
      next conclusion?
    choices: [{id: a, text: 'The ratio test is inconclusive, but the p-series test proves convergence.'}, {id: b, text: 'The series diverges.'}, {id: c, text: 'The ratio test proves conditional convergence.'}, {id: d, text: 'No other test may be used.'}]
    answer: {choiceId: a}
    solutionOutline: A ratio boundary result says nothing; the exact p-series structure gives convergence because three exceeds one.
    commonTrap: Treating test failure as series failure.
    verification: {method: ratio-boundary-then-p-test, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-008
    topicId: convergence-tests
    skills: [apply-integral-remainder-estimates]
    archetype: logarithmic-tail-bound
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires evaluating an improper tail integral and solving an exponential threshold.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For $\sum_{n=2}^{\infty}1/[n(\ln n)^2]$, which integral gives the
      standard upper bound for the tail after N?
    choices: [{id: a, text: '$1/\ln N$'}, {id: b, text: '$1/N$'}, {id: c, text: '$\ln N$'}, {id: d, text: '$1/(\ln N)^2$'}]
    answer: {choiceId: a}
    solutionOutline: $\int_N^\infty dx/[x(\ln x)^2]=1/\ln N$.
    commonTrap: Replacing the integral with the first omitted term.
    verification: {method: exact-logarithmic-tail-integral, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-009
    topicId: convergence-tests
    skills: [apply-comparison-to-trigonometric-terms]
    archetype: bounded-numerator-over-p-series
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires moving to absolute values and building a uniform bound.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      How does $\sum_{n=1}^{\infty}\sin n/n^2$ converge?
    choices: [{id: a, text: 'Absolutely'}, {id: b, text: 'Conditionally'}, {id: c, text: 'It diverges because $\sin n$ oscillates.'}, {id: d, text: 'It diverges by the term test.'}]
    answer: {choiceId: a}
    solutionOutline: $|\sin n|/n^2\le1/n^2$, so the absolute series converges.
    commonTrap: Treating irregular signs as an obstacle when absolute comparison removes them.
    verification: {method: absolute-p-series-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-010
    topicId: convergence-tests
    skills: [apply-small-angle-limit-comparison]
    archetype: tangent-harmonic-order
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires a standard small-angle limit to expose divergence.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=2}^{\infty}\tan(1/n)$.
    choices: [{id: a, text: 'Divergent by limit comparison with $1/n$'}, {id: b, text: 'Convergent by comparison with $1/n^2$'}, {id: c, text: 'Conditionally convergent'}, {id: d, text: 'Divergent because terms do not approach zero'}]
    answer: {choiceId: a}
    solutionOutline: $\tan(1/n)/(1/n)\to1$, so the positive series has harmonic behavior.
    commonTrap: Assuming a bounded trigonometric function automatically gives summable terms.
    verification: {method: small-angle-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-011
    topicId: convergence-tests
    skills: [classify-binomial-coefficient-series]
    archetype: reciprocal-central-binomial
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires simplifying the ratio of consecutive central binomial coefficients.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What does the ratio test show for
      $\sum_{n=1}^{\infty}1/\binom{2n}{n}$?
    choices: [{id: a, text: 'Convergence, with ratio limit $1/4$'}, {id: b, text: 'Divergence, with ratio limit $4$'}, {id: c, text: 'Inconclusive, with ratio limit $1$'}, {id: d, text: 'Conditional convergence'}]
    answer: {choiceId: a}
    solutionOutline: The ratio is $(n+1)^2/[(2n+2)(2n+1)]\to1/4$.
    commonTrap: Computing the growth ratio of the binomial coefficients rather than their reciprocals.
    verification: {method: central-binomial-reciprocal-ratio, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-012
    topicId: convergence-tests
    skills: [apply-dirichlets-test]
    archetype: cosine-over-linear
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires bounded trigonometric partial sums and decreasing weights.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Why does $\sum_{n=1}^{\infty}\cos n/n$ converge?
    choices: [{id: a, text: 'Partial sums of $\cos n$ are bounded and $1/n\downarrow0$.'}, {id: b, text: 'It converges absolutely by comparison with $1/n$.'}, {id: c, text: 'The cosine terms approach zero.'}, {id: d, text: 'It is geometric.'}]
    answer: {choiceId: a}
    solutionOutline: Dirichlet's test uses bounded coefficient partial sums and a monotone weight tending to zero.
    commonTrap: Claiming absolute convergence from an upper bound by a divergent series.
    verification: {method: trigonometric-dirichlet-test, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-013
    topicId: convergence-tests
    skills: [test-endpoint-comparison-logic]
    archetype: insufficient-upper-bound
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires diagnosing why a true comparison provides no conclusion.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Suppose $0\le a_n\le1/n$ for every n. What can be concluded about
      $\sum a_n$ from this inequality alone?
    choices: [{id: a, text: 'Nothing definitive'}, {id: b, text: 'It diverges.'}, {id: c, text: 'It converges.'}, {id: d, text: 'It converges conditionally.'}]
    answer: {choiceId: a}
    solutionOutline: Both $a_n=1/n$ and $a_n=1/n^2$ satisfy the inequality but have opposite convergence behavior.
    commonTrap: Assuming an upper bound by a divergent series proves divergence.
    verification: {method: comparison-direction-counterexamples, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-014
    topicId: convergence-tests
    skills: [combine-asymptotics-and-p-series]
    archetype: logarithm-over-power
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires using the fact that logarithms grow slower than any positive power.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=2}^{\infty}(\ln n)/n^{3/2}$.
    choices: [{id: a, text: 'Convergent'}, {id: b, text: 'Divergent like $\sum1/n$'}, {id: c, text: 'Conditionally convergent'}, {id: d, text: 'Divergent by the term test'}]
    answer: {choiceId: a}
    solutionOutline: Eventually $\ln n<n^{1/4}$, making the term smaller than $1/n^{5/4}$.
    commonTrap: Treating the unbounded logarithm as stronger than every power denominator.
    verification: {method: logarithm-power-upper-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-tests-hard-015
    topicId: convergence-tests
    skills: [distinguish-conditional-and-absolute-tests]
    archetype: alternating-logarithmic-series
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires an alternating test for signed convergence and an integral test for absolute divergence.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=2}^{\infty}(-1)^n/[n\ln n]$.
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes decrease to zero, but their positive series is the divergent p equals one logarithmic boundary.
    commonTrap: Using absolute divergence to reject signed convergence.
    verification: {method: alternating-plus-log-integral-tests, result: verified}
    reviewStatus: verified
