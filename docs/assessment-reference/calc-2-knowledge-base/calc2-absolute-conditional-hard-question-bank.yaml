items:
  - id: calc2-ac-hard-001
    topicId: absolute-conditional-convergence
    skills: [classify-conditional-convergence, use-limit-comparison]
    archetype: rational-magnitude-classification
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires an alternating-series argument and a separate limit comparison with the harmonic series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify
      $$\sum_{n=1}^{\infty}(-1)^{n-1}\frac{n}{n^2+4}.$$
    choices:
      - { id: a, text: 'Absolutely convergent' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent because the magnitudes behave like $1/n$' }
      - { id: d, text: 'Divergent because the ratio-test limit is $1$' }
    answer: { choiceId: b }
    solutionOutline: The magnitudes tend to zero and decrease for $n\ge2$, so the signed series converges; their ratio to $1/n$ tends to $1$, so absolute convergence fails.
    commonTrap: Using divergence of the magnitude series to declare the signed series divergent.
    verification: { method: derivative-check-and-limit-comparison, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-002
    topicId: absolute-conditional-convergence
    skills: [classify-conditional-convergence, verify-eventual-monotonicity]
    archetype: logarithmic-magnitude
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires locating the eventual decrease of $\log n/n$ and proving absolute divergence.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the convergence classification of
      $$\sum_{n=2}^{\infty}(-1)^n\frac{\ln n}{n}?$$
    choices:
      - { id: a, text: 'Absolutely convergent by comparison with $1/n$' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent because $\ln n$ grows' }
      - { id: d, text: 'Geometric with ratio $-1$' }
    answer: { choiceId: b }
    solutionOutline: The function $\ln x/x$ decreases after $x=e$ and tends to zero, while $\sum\ln n/n$ diverges by the integral test.
    commonTrap: Assuming an unbounded numerator prevents the quotient from tending to zero.
    verification: { method: derivative-and-integral-tests, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-003
    topicId: absolute-conditional-convergence
    skills: [classify-parameter-families]
    archetype: p-series-thresholds
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires combining the term test, alternating-series test, and p-series threshold at both boundary values.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For real $p$, when is
      $$\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^p}$$
      conditionally convergent?
    choices:
      - { id: a, text: '$p>1$' }
      - { id: b, text: '$0<p\le1$' }
      - { id: c, text: '$p\le0$' }
      - { id: d, text: 'All real $p$' }
    answer: { choiceId: b }
    solutionOutline: Signed convergence begins at $p>0$, whereas absolute convergence begins only at $p>1$; their difference is $0<p\le1$.
    commonTrap: Excluding $p=1$, the alternating harmonic boundary, from the conditional interval.
    verification: { method: theorem-threshold-intersection, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-004
    topicId: absolute-conditional-convergence
    skills: [apply-ratio-test-to-absolute-values]
    archetype: factorial-versus-exponential
    difficulty: hard
    reasoningDepth: 2
    difficultyEvidence: Requires forming the absolute ratio after separating a nontrivial sign pattern.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify
      $$\sum_{n=1}^{\infty}(-1)^{n(n+1)/2}\frac{3^n}{n!}.$$
    choices:
      - { id: a, text: 'Absolutely convergent' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent because the signs are not strictly alternating' }
      - { id: d, text: 'Divergent by the term test' }
    answer: { choiceId: a }
    solutionOutline: Regardless of the signs, the absolute ratio is $3/(n+1)\to0$, so the series of magnitudes converges.
    commonTrap: Analyzing the irregular sign cycle even though absolute convergence makes it irrelevant.
    verification: { method: ratio-test-computation, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-005
    topicId: absolute-conditional-convergence
    skills: [classify-radical-series, rationalize-differences]
    archetype: radical-alternating-series
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires rationalization to reveal both monotonic behavior and comparison with a divergent p-series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Determine the strongest classification of
      $$\sum_{n=1}^{\infty}(-1)^{n-1}\left(\sqrt{n+1}-\sqrt n\right).$$
    choices:
      - { id: a, text: 'Absolutely convergent' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent because each radical grows' }
      - { id: d, text: 'Telescoping to $1$' }
    answer: { choiceId: b }
    solutionOutline: Rationalization gives magnitude $1/(\sqrt{n+1}+\sqrt n)$, which decreases to zero but is comparable to $1/\sqrt n$, so only conditional convergence holds.
    commonTrap: Telescoping the radicals while overlooking the alternating coefficient that changes the cancellation pattern.
    verification: { method: rationalization-and-limit-comparison, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-006
    topicId: absolute-conditional-convergence
    skills: [classify-composed-magnitudes, use-limit-comparison]
    archetype: inverse-trigonometric-magnitude
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires using the small-argument behavior of arctangent to test absolute convergence.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify
      $$\sum_{n=1}^{\infty}(-1)^n\arctan(1/n).$$
    choices:
      - { id: a, text: 'Absolutely convergent because arctangent is bounded' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent because $\arctan(1/n)$ is positive' }
      - { id: d, text: 'Divergent because the signs alternate' }
    answer: { choiceId: b }
    solutionOutline: The magnitudes decrease to zero, but $\arctan(1/n)/(1/n)\to1$, so their positive series diverges like the harmonic series.
    commonTrap: Confusing boundedness of a function with convergence of the series of its values.
    verification: { method: alternating-test-and-standard-limit, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-007
    topicId: absolute-conditional-convergence
    skills: [reason-about-series-sums]
    archetype: closure-property
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires proving how adding an absolutely convergent series affects a conditionally convergent one.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Suppose $\sum a_n$ converges conditionally and $\sum b_n$ converges
      absolutely. Which statement must be true?
    choices:
      - { id: a, text: '$\sum(a_n+b_n)$ converges conditionally.' }
      - { id: b, text: '$\sum(a_n+b_n)$ converges absolutely.' }
      - { id: c, text: '$\sum(a_n+b_n)$ diverges.' }
      - { id: d, text: 'No convergence conclusion is possible.' }
    answer: { choiceId: a }
    solutionOutline: The sum series converges, and if it were absolute then $\sum|a_n|$ would converge by $|a_n|\le|a_n+b_n|+|b_n|$, contradicting conditionality.
    commonTrap: Assuming an absolutely convergent perturbation can repair the divergent absolute-value sum.
    verification: { method: triangle-inequality-contradiction, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-008
    topicId: absolute-conditional-convergence
    skills: [reason-about-rearrangements]
    archetype: rearrangement-invariance
    difficulty: hard
    reasoningDepth: 2
    difficultyEvidence: Requires identifying the convergence class that guarantees order-independent sums.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which hypothesis guarantees that every rearrangement of $\sum a_n$
      converges to the original sum?
    choices:
      - { id: a, text: '$a_n\to0$' }
      - { id: b, text: '$\sum a_n$ converges conditionally' }
      - { id: c, text: '$\sum|a_n|$ converges' }
      - { id: d, text: 'The positive and negative terms occur equally often' }
    answer: { choiceId: c }
    solutionOutline: Absolute convergence controls the total magnitude of every tail, making finite permutations and then arbitrary rearrangements sum-invariant.
    commonTrap: Treating ordinary convergence as sufficient despite the Riemann rearrangement phenomenon.
    verification: { method: absolute-rearrangement-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-009
    topicId: absolute-conditional-convergence
    skills: [analyze-positive-and-negative-parts]
    archetype: jordan-decomposition
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires relating absolute convergence to separate sums of positive and negative parts.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Define $a_n^+=\max(a_n,0)$ and $a_n^-=\max(-a_n,0)$. Which condition is
      equivalent to absolute convergence of $\sum a_n$?
    choices:
      - { id: a, text: 'Both $\sum a_n^+$ and $\sum a_n^-$ converge.' }
      - { id: b, text: 'At least one of $\sum a_n^+$ and $\sum a_n^-$ diverges.' }
      - { id: c, text: '$a_n^+=a_n^-$ for every $n$.' }
      - { id: d, text: 'The two partial sums have the same limit.' }
    answer: { choiceId: a }
    solutionOutline: Since $|a_n|=a_n^++a_n^-$, convergence of the nonnegative absolute series is equivalent to convergence of both nonnegative component series.
    commonTrap: Using cancellation between positive and negative parts, which is unavailable after absolute values are taken.
    verification: { method: positive-negative-part-identities, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-010
    topicId: absolute-conditional-convergence
    skills: [select-comparison-directions]
    archetype: invalid-comparison
    difficulty: hard
    reasoningDepth: 2
    difficultyEvidence: Requires diagnosing why a proposed absolute-convergence comparison proves nothing.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A student observes $0\le |a_n|\le1/n$ and concludes that $\sum a_n$
      converges absolutely. What is wrong?
    choices:
      - { id: a, text: 'An upper bound by a divergent series cannot prove convergence.' }
      - { id: b, text: 'Absolute values cannot be compared.' }
      - { id: c, text: 'The harmonic series converges too slowly.' }
      - { id: d, text: 'The inequality proves conditional convergence instead.' }
    answer: { choiceId: a }
    solutionOutline: Direct comparison proves convergence only when the upper comparison series converges; $\sum1/n$ does not.
    commonTrap: Believing any upper bound supplies a convergence proof regardless of the comparison series.
    verification: { method: comparison-test-logic, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-011
    topicId: absolute-conditional-convergence
    skills: [classify-logarithmic-p-series]
    archetype: two-parameter-threshold
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires applying alternating convergence and the logarithmic integral threshold at a boundary.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For which $q$ is
      $$\sum_{n=2}^{\infty}\frac{(-1)^n}{n(\ln n)^q}$$
      conditionally convergent?
    choices:
      - { id: a, text: '$q>1$' }
      - { id: b, text: '$q\le1$' }
      - { id: c, text: '$q\le0$ only' }
      - { id: d, text: 'No real $q$' }
    answer: { choiceId: b }
    solutionOutline: The magnitudes eventually decrease to zero for every real $q$, while the positive logarithmic p-series converges exactly for $q>1$.
    commonTrap: Importing the ordinary p-series threshold onto the logarithm without checking the integral $\int dx/[x(\ln x)^q]$.
    verification: { method: derivative-tail-check-and-log-substitution, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-012
    topicId: absolute-conditional-convergence
    skills: [apply-root-test, classify-absolute-convergence]
    archetype: nth-root-structure
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires simplifying an nth root with both polynomial and exponential factors.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Determine the convergence type of
      $$\sum_{n=1}^{\infty}(-1)^n\frac{n^4}{5^n}.$$
    choices:
      - { id: a, text: 'Absolutely convergent because the root-test limit is $1/5$' }
      - { id: b, text: 'Conditionally convergent because signs alternate' }
      - { id: c, text: 'Divergent because $n^4$ grows' }
      - { id: d, text: 'The root test is inconclusive with limit $1$' }
    answer: { choiceId: a }
    solutionOutline: The nth root of the magnitude is $n^{4/n}/5\to1/5<1$, proving convergence of the absolute-value series.
    commonTrap: Comparing polynomial and exponential growth informally without evaluating the decisive root limit.
    verification: { method: root-test-limit, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-013
    topicId: absolute-conditional-convergence
    skills: [analyze-grouped-series]
    archetype: grouping-versus-rearranging
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires distinguishing order-preserving grouping from a rearrangement of a conditional series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A convergent series is grouped as
      $(a_1+a_2)+(a_3+a_4)+\cdots$ without changing term order. Which statement
      is correct?
    choices:
      - { id: a, text: 'The grouped series converges to the same sum.' }
      - { id: b, text: 'The sum may change whenever convergence is conditional.' }
      - { id: c, text: 'Grouping always produces absolute convergence.' }
      - { id: d, text: 'The grouped series must diverge if signs alternate.' }
    answer: { choiceId: a }
    solutionOutline: Grouped partial sums form a subsequence of the original convergent partial sums, so they approach the same limit when every term remains in order.
    commonTrap: Treating finite consecutive grouping as an arbitrary rearrangement.
    verification: { method: partial-sum-subsequence-argument, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-014
    topicId: absolute-conditional-convergence
    skills: [test-absolute-convergence, use-asymptotic-equivalence]
    archetype: trigonometric-small-angle
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires a small-angle limit and separate signed/absolute conclusions.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify
      $$\sum_{n=1}^{\infty}(-1)^{n-1}\sin(1/n).$$
    choices:
      - { id: a, text: 'Absolutely convergent' }
      - { id: b, text: 'Conditionally convergent' }
      - { id: c, text: 'Divergent because sine oscillates' }
      - { id: d, text: 'Divergent because the terms approach $1$' }
    answer: { choiceId: b }
    solutionOutline: The magnitudes decrease to zero, while $\sin(1/n)/(1/n)\to1$, so the absolute series has harmonic behavior and diverges.
    commonTrap: Confusing oscillation of $\sin x$ on large inputs with its monotone small-angle behavior at $x=1/n$.
    verification: { method: alternating-test-and-sine-limit, result: verified }
    reviewStatus: verified

  - id: calc2-ac-hard-015
    topicId: absolute-conditional-convergence
    skills: [reason-from-cauchy-criterion]
    archetype: tail-control
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires translating absolute tail control through the triangle inequality.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $\sum|a_n|$ converges, why must $\sum a_n$ satisfy the Cauchy
      criterion?
    choices:
      - { id: a, text: 'Because $|\sum_{k=m}^{n}a_k|\le\sum_{k=m}^{n}|a_k|$, whose tails become arbitrarily small.' }
      - { id: b, text: 'Because every $a_n$ is nonnegative.' }
      - { id: c, text: 'Because the signed tail always equals the absolute tail.' }
      - { id: d, text: 'Because the ratio $a_{n+1}/a_n$ must approach zero.' }
    answer: { choiceId: a }
    solutionOutline: Convergence of the nonnegative magnitude series makes every sufficiently late magnitude tail small, and the triangle inequality bounds the signed tail by it.
    commonTrap: Replacing the triangle inequality with equality, which generally fails when signs differ.
    verification: { method: cauchy-criterion-and-triangle-inequality, result: verified }
    reviewStatus: verified
