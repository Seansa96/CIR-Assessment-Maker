schemaVersion: 1
bankId: calc2-convergence-tests-easy
categoryId: calculus-2
topicIds:
  - convergence-tests
minimumItemCount: 30
items:
  - id: calc2-tests-easy-001
    topicId: convergence-tests
    skills: [apply-the-divergence-test]
    archetype: nonzero-term-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires using the term test in its decisive direction.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What does $\lim a_n=2$ prove about $\sum a_n$?
    choices:
      - { id: a, text: 'The series diverges.' }
      - { id: b, text: 'The series converges to $2$.' }
      - { id: c, text: 'The ratio test is required.' }
      - { id: d, text: 'The series converges absolutely.' }
    answer: { choiceId: a }
    solutionOutline: A convergent series must have terms tending to zero, so a nonzero limit proves divergence.
    commonTrap: Treating the term limit as the series sum.
    verification: { method: term-test, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-002
    topicId: convergence-tests
    skills: [apply-the-p-series-test]
    archetype: p-threshold
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the exact p-series boundary.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For which $p$ does $\sum_{n=1}^{\infty}1/n^p$ converge?
    choices:
      - { id: a, text: '$p>1$' }
      - { id: b, text: '$p\ge1$' }
      - { id: c, text: '$p>0$' }
      - { id: d, text: 'Every real $p$' }
    answer: { choiceId: a }
    solutionOutline: The p-series threshold is strict; the boundary $p=1$ is the divergent harmonic series.
    commonTrap: Including the harmonic boundary.
    verification: { method: p-series-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-003
    topicId: convergence-tests
    skills: [apply-the-geometric-series-test]
    archetype: ratio-magnitude
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires checking the magnitude of a constant ratio.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which geometric series converges?
    choices:
      - { id: a, text: '$\sum(3/4)^n$' }
      - { id: b, text: '$\sum(5/4)^n$' }
      - { id: c, text: '$\sum(-1)^n$' }
      - { id: d, text: '$\sum2^n$' }
    answer: { choiceId: a }
    solutionOutline: Only the first series has a ratio whose magnitude is strictly below one.
    commonTrap: Assuming a negative ratio such as negative one guarantees convergence.
    verification: { method: geometric-ratio-condition, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-004
    topicId: convergence-tests
    skills: [check-integral-test-hypotheses]
    archetype: theorem-conditions
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying all structural hypotheses of the integral test.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which conditions are required for the standard integral test with
      $a_n=f(n)$?
    choices:
      - { id: a, text: '$f$ is continuous, positive, and decreasing eventually.' }
      - { id: b, text: '$f$ is negative and increasing.' }
      - { id: c, text: '$f$ is periodic.' }
      - { id: d, text: '$f$ has an elementary antiderivative only.' }
    answer: { choiceId: a }
    solutionOutline: Rectangle-integral comparison requires a positive decreasing continuous model on a tail interval.
    commonTrap: Treating ease of integration as a theorem hypothesis rather than a practical selection cue.
    verification: { method: integral-test-statement, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-005
    topicId: convergence-tests
    skills: [use-direct-comparison-for-convergence]
    archetype: convergent-upper-bound
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires choosing the valid comparison direction.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For positive terms, which fact proves $\sum a_n$ converges?
    choices:
      - { id: a, text: '$0\le a_n\le b_n$ and $\sum b_n$ converges' }
      - { id: b, text: '$0\le a_n\le b_n$ and $\sum b_n$ diverges' }
      - { id: c, text: '$a_n\ge b_n\ge0$ and $\sum b_n$ converges' }
      - { id: d, text: '$a_n\to0$' }
    answer: { choiceId: a }
    solutionOutline: A positive series dominated by one with finite total mass must also have finite total mass.
    commonTrap: Using an upper bound by a divergent series.
    verification: { method: direct-comparison-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-006
    topicId: convergence-tests
    skills: [use-direct-comparison-for-divergence]
    archetype: divergent-lower-bound
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires choosing the lower-bound direction for divergence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For nonnegative terms, which fact proves $\sum a_n$ diverges?
    choices:
      - { id: a, text: '$a_n\ge b_n$ and $\sum b_n$ diverges' }
      - { id: b, text: '$a_n\le b_n$ and $\sum b_n$ diverges' }
      - { id: c, text: '$a_n\ge b_n$ and $\sum b_n$ converges' }
      - { id: d, text: '$a_n$ is bounded' }
    answer: { choiceId: a }
    solutionOutline: A series at least as large as a divergent positive benchmark cannot have bounded partial sums.
    commonTrap: Reversing the comparison direction used for divergence.
    verification: { method: direct-comparison-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-007
    topicId: convergence-tests
    skills: [apply-limit-comparison]
    archetype: positive-finite-limit
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires interpreting the decisive limit-comparison range.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $a_n,b_n>0$ and $\lim a_n/b_n=4$, what follows?
    choices:
      - { id: a, text: '$\sum a_n$ and $\sum b_n$ have the same convergence behavior.' }
      - { id: b, text: 'Both series converge to $4$.' }
      - { id: c, text: '$\sum a_n$ always diverges.' }
      - { id: d, text: '$\sum a_n$ always converges.' }
    answer: { choiceId: a }
    solutionOutline: A finite positive asymptotic ratio makes the terms comparable in both directions on a tail.
    commonTrap: Treating the comparison limit as the value of either series.
    verification: { method: limit-comparison-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-008
    topicId: convergence-tests
    skills: [apply-the-ratio-test]
    archetype: decisive-ratio-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the ratio-test threshold below one.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\lim|a_{n+1}/a_n|=0.6$, what does the ratio test prove?
    choices:
      - { id: a, text: 'Absolute convergence' }
      - { id: b, text: 'Conditional convergence' }
      - { id: c, text: 'Divergence' }
      - { id: d, text: 'No conclusion' }
    answer: { choiceId: a }
    solutionOutline: A ratio limit strictly below one proves convergence of the magnitude series.
    commonTrap: Calling the result conditional because the original terms might have signs.
    verification: { method: ratio-test, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-009
    topicId: convergence-tests
    skills: [apply-the-root-test]
    archetype: decisive-root-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the root-test threshold above one.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\lim\sqrt[n]{|a_n|}=3/2$, what does the root test prove?
    choices:
      - { id: a, text: 'The series diverges.' }
      - { id: b, text: 'The series converges absolutely.' }
      - { id: c, text: 'The series converges conditionally.' }
      - { id: d, text: 'The series sums to $3/2$.' }
    answer: { choiceId: a }
    solutionOutline: A root limit above one means the terms fail to decay geometrically and in fact do not approach zero.
    commonTrap: Interpreting a positive finite root limit as a comparison constant rather than a root-test threshold.
    verification: { method: root-test, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-010
    topicId: convergence-tests
    skills: [recognize-inconclusive-test-results]
    archetype: boundary-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires correctly handling the ratio-test boundary.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What does a ratio-test limit of $1$ mean?
    choices:
      - { id: a, text: 'The ratio test is inconclusive.' }
      - { id: b, text: 'The series converges.' }
      - { id: c, text: 'The series diverges.' }
      - { id: d, text: 'The series is geometric.' }
    answer: { choiceId: a }
    solutionOutline: Both convergent and divergent p-series have consecutive ratio limits equal to one.
    commonTrap: Assigning the equality case to one of the decisive inequalities.
    verification: { method: ratio-test-boundary, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-011
    topicId: convergence-tests
    skills: [select-tests-for-factorials]
    archetype: factorial-cue
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires selecting a test based on algebraic cancellation structure.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which test is usually most direct for $\sum n!/5^n$?
    choices:
      - { id: a, text: 'Ratio test' }
      - { id: b, text: 'Integral test' }
      - { id: c, text: 'Alternating-series test' }
      - { id: d, text: 'Telescoping test' }
    answer: { choiceId: a }
    solutionOutline: Consecutive factorials cancel to $n+1$, making the ratio easy to evaluate.
    commonTrap: Choosing a test solely because all terms are positive.
    verification: { method: structural-test-selection, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-012
    topicId: convergence-tests
    skills: [select-tests-for-nth-powers]
    archetype: nth-root-cue
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing an entire expression raised to the nth power.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which test is especially natural for
      $\sum[(2n+1)/(3n+4)]^n$?
    choices:
      - { id: a, text: 'Root test' }
      - { id: b, text: 'Integral test' }
      - { id: c, text: 'Telescoping' }
      - { id: d, text: 'Alternating-series test' }
    answer: { choiceId: a }
    solutionOutline: The nth root removes the outer exponent and leaves a simple rational limit of $2/3$.
    commonTrap: Applying the ratio test and creating unnecessary shifted powers.
    verification: { method: structural-test-selection, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-013
    topicId: convergence-tests
    skills: [diagnose-integral-test-misuse]
    archetype: failed-hypothesis
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires identifying why the standard integral test cannot be used directly.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Why is the standard integral test not directly applicable to
      $\sum(-1)^n/n$?
    choices:
      - { id: a, text: 'The summand model is not positive.' }
      - { id: b, text: '$1/x$ has no antiderivative.' }
      - { id: c, text: 'The terms do not approach zero.' }
      - { id: d, text: 'The index begins at one.' }
    answer: { choiceId: a }
    solutionOutline: The standard integral test compares positive areas and does not incorporate alternating signs.
    commonTrap: Confusing existence of an improper integral with satisfaction of all theorem hypotheses.
    verification: { method: hypothesis-check, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-014
    topicId: convergence-tests
    skills: [choose-asymptotic-comparisons]
    archetype: rational-dominant-power
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires identifying a p-series benchmark from rational dominant powers.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which benchmark is best for limit comparison with
      $(4n^2+1)/(n^5+3)$?
    choices:
      - { id: a, text: '$1/n^3$' }
      - { id: b, text: '$1/n^2$' }
      - { id: c, text: '$1/n^5$' }
      - { id: d, text: '$2^{-n}$' }
    answer: { choiceId: a }
    solutionOutline: The dominant quotient is $4n^2/n^5=4/n^3$.
    commonTrap: Matching only the denominator degree and ignoring numerator growth.
    verification: { method: dominant-power-analysis, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-015
    topicId: convergence-tests
    skills: [use-test-selection-workflows]
    archetype: preliminary-check
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires choosing the efficient first step before specialized tests.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What should usually be checked before applying a more specialized
      convergence test?
    choices:
      - { id: a, text: 'Whether the terms approach zero' }
      - { id: b, text: 'Whether the exact sum is an integer' }
      - { id: c, text: 'Whether the first term is positive' }
      - { id: d, text: 'Whether the index can be renamed' }
    answer: { choiceId: a }
    solutionOutline: A failed zero-term condition ends the problem immediately and prevents unnecessary work.
    commonTrap: Spending time on a sophisticated test when the divergence test already decides the series.
    verification: { method: method-selection-workflow, result: verified }
    reviewStatus: verified

  - id: calc2-tests-easy-016
    topicId: convergence-tests
    skills: [apply-the-divergence-test]
    archetype: rational-nonzero-limit
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires computing the term limit before selecting a more elaborate test.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What is the quickest conclusion for $\sum_{n=1}^{\infty}n/(n+1)$?
    choices: [{id: a, text: 'It diverges because the terms approach $1$.'}, {id: b, text: 'It converges by comparison with $1/n$.'}, {id: c, text: 'It converges to $1$.'}, {id: d, text: 'The ratio test proves convergence.'}]
    answer: {choiceId: a}
    solutionOutline: The summand has nonzero limit one, violating a necessary condition for series convergence.
    commonTrap: Reporting the limit of the terms as the sum of the series.
    verification: {method: rational-limit-term-test, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-017
    topicId: convergence-tests
    skills: [use-direct-comparison]
    archetype: bounded-denominator-perturbation
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires constructing a simple convergent upper bound.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Which inequality proves convergence of
      $\sum_{n=1}^{\infty}1/(n^2+\sin^2n)$?
    choices: [{id: a, text: '$0<1/(n^2+\sin^2n)\le1/n^2$'}, {id: b, text: '$1/(n^2+\sin^2n)\le1/n$'}, {id: c, text: '$1/(n^2+\sin^2n)\ge1/(n^2+1)$'}, {id: d, text: 'The terms are positive.'}]
    answer: {choiceId: a}
    solutionOutline: Adding a nonnegative quantity to the denominator makes the term no larger than the convergent p-series term.
    commonTrap: Choosing an upper bound by the divergent harmonic series, which is true but useless.
    verification: {method: convergent-upper-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-018
    topicId: convergence-tests
    skills: [use-divergent-lower-comparison]
    archetype: square-root-harmonic-order
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires finding the comparison direction that proves divergence.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Which benchmark is useful for proving divergence of
      $\sum_{n=1}^{\infty}1/(\sqrt n+1)$?
    choices: [{id: a, text: '$\sum1/\sqrt n$'}, {id: b, text: '$\sum1/n^2$'}, {id: c, text: '$\sum(1/2)^n$'}, {id: d, text: '$\sum1/n^3$'}]
    answer: {choiceId: a}
    solutionOutline: For large n the term is comparable to $1/\sqrt n$, a divergent p-series with exponent one half.
    commonTrap: Comparing with a smaller convergent series, which cannot establish divergence.
    verification: {method: limit-comparison-p-half, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-019
    topicId: convergence-tests
    skills: [apply-limit-comparison]
    archetype: rational-harmonic-order
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires reducing a rational expression to its leading power.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(n+2)/(n^2+1)$.
    choices: [{id: a, text: 'Divergent by limit comparison with $1/n$'}, {id: b, text: 'Convergent by comparison with $1/n^2$'}, {id: c, text: 'Geometric and convergent'}, {id: d, text: 'Divergent by the term test'}]
    answer: {choiceId: a}
    solutionOutline: Multiplying the summand by n gives a limit of one, so it shares harmonic divergence.
    commonTrap: Using the quadratic denominator alone and ignoring the linear numerator.
    verification: {method: harmonic-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-020
    topicId: convergence-tests
    skills: [apply-the-integral-test]
    archetype: logarithmic-p-integral
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires a logarithmic substitution in an improper integral.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What does the integral test show for
      $\sum_{n=2}^{\infty}1/[n(\ln n)^2]$?
    choices: [{id: a, text: 'It converges.'}, {id: b, text: 'It diverges.'}, {id: c, text: 'The terms do not approach zero.'}, {id: d, text: 'It is geometric.'}]
    answer: {choiceId: a}
    solutionOutline: With u equal to ln x, the improper integral becomes $\int_{\ln2}^{\infty}u^{-2}\,du$, which is finite.
    commonTrap: Confusing this exponent-two logarithmic denominator with the divergent exponent-one boundary.
    verification: {method: logarithmic-substitution-integral-test, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-021
    topicId: convergence-tests
    skills: [apply-the-ratio-test]
    archetype: factorial-over-self-power
    difficulty: intermediate
    reasoningDepth: 4
    difficultyEvidence: Requires simplifying a consecutive ratio and evaluating a standard exponential limit.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      For $a_n=n!/n^n$, what is $\lim a_{n+1}/a_n$?
    choices: [{id: a, text: '$1/e$'}, {id: b, text: '$1$'}, {id: c, text: '$0$'}, {id: d, text: '$e$'}]
    answer: {choiceId: a}
    solutionOutline: The ratio is $(n/(n+1))^n$, which approaches $e^{-1}$.
    commonTrap: Cancelling all powers of n and incorrectly obtaining zero.
    verification: {method: ratio-simplification-standard-e-limit, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-022
    topicId: convergence-tests
    skills: [apply-the-root-test]
    archetype: nth-power-rational-base
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires removing an nth power and evaluating a rational limit.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What does the root test conclude for
      $\sum_{n=1}^{\infty}[(2n+1)/(3n)]^n$?
    choices: [{id: a, text: 'Absolute convergence'}, {id: b, text: 'Divergence'}, {id: c, text: 'Conditional convergence'}, {id: d, text: 'Inconclusive'}]
    answer: {choiceId: a}
    solutionOutline: The nth root tends to two thirds, strictly below one.
    commonTrap: Treating the inside ratio as tending to one because both numerator and denominator are linear.
    verification: {method: root-test-leading-coefficients, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-023
    topicId: convergence-tests
    skills: [interpret-inconclusive-ratio-results]
    archetype: ratio-limit-one
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires knowing the exact boundary of the ratio test.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      If $\lim|a_{n+1}/a_n|=1$, which statement is correct?
    choices: [{id: a, text: 'The ratio test gives no conclusion.'}, {id: b, text: 'The series converges.'}, {id: c, text: 'The series diverges.'}, {id: d, text: 'The series is conditionally convergent.'}]
    answer: {choiceId: a}
    solutionOutline: Both the harmonic and reciprocal-square series have ratio limit one but opposite outcomes.
    commonTrap: Including equality in one of the ratio test's strict decision ranges.
    verification: {method: ratio-boundary-counterexamples, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-024
    topicId: convergence-tests
    skills: [check-comparison-test-hypotheses]
    archetype: signed-comparison-warning
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires identifying why the standard direct comparison theorem is stated for nonnegative terms.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Before applying the standard direct comparison test to $\sum a_n$ and
      $\sum b_n$, what should be checked?
    choices: [{id: a, text: 'The relevant terms are nonnegative eventually.'}, {id: b, text: 'Both series have the same first term.'}, {id: c, text: 'Both terms alternate.'}, {id: d, text: 'Their partial sums are equal.'}]
    answer: {choiceId: a}
    solutionOutline: Ordering individual terms controls sums only in the required direction when the tail terms are nonnegative.
    commonTrap: Applying inequalities to signed terms without moving to absolute values or another signed-series theorem.
    verification: {method: direct-comparison-hypothesis, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-025
    topicId: convergence-tests
    skills: [apply-the-p-series-test]
    archetype: harmonic-boundary
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires treating the p equals one endpoint correctly.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      How does $\sum_{n=1}^{\infty}1/n^{1.001}$ behave?
    choices: [{id: a, text: 'It converges.'}, {id: b, text: 'It diverges because the exponent is close to $1$.'}, {id: c, text: 'It is geometric.'}, {id: d, text: 'The p-series test is inconclusive.'}]
    answer: {choiceId: a}
    solutionOutline: The p-series threshold is strict but any exponent greater than one qualifies.
    commonTrap: Treating slow convergence near the boundary as divergence.
    verification: {method: p-series-threshold, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-026
    topicId: convergence-tests
    skills: [classify-geometric-series]
    archetype: negative-ratio-outside-unit-circle
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires using ratio magnitude rather than its sign.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What happens to $\sum_{n=0}^{\infty}(-6/5)^n$?
    choices: [{id: a, text: 'It diverges.'}, {id: b, text: 'It converges because signs alternate.'}, {id: c, text: 'It converges to $5/11$.'}, {id: d, text: 'It converges absolutely.'}]
    answer: {choiceId: a}
    solutionOutline: A geometric series converges only when the ratio magnitude is below one; here it is six fifths.
    commonTrap: Treating a negative ratio as sufficient for convergence.
    verification: {method: geometric-ratio-magnitude, result: verified}
    reviewStatus: verified
  - id: calc2-tests-easy-027
    topicId: convergence-tests
    skills: [check-integral-test-hypotheses]
    archetype: eventual-conditions
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires understanding that a finite exceptional prefix is irrelevant.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      A function matching $a_n=f(n)$ is positive, continuous, and decreasing
      only for $x\ge100$. Can the integral test still apply?
    choices: [{id: a, text: 'Yes; eventual hypotheses are enough.'}, {id: b, text: 'No; they must hold from $x=1$.'}, {id: c, text: 'Only if the first 99 terms are zero.'}, {id: d, text: 'Only for alternating series.'}]
    answer: {choiceId: a}
    solutionOutline: Removing or changing finitely many initial terms does not affect convergence.
    commonTrap: Demanding tail properties on an irrelevant finite prefix.
