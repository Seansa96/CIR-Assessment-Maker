schemaVersion: 1
bankId: calc2-power-series-easy
categoryId: calculus-2
topicIds:
  - power-series
minimumItemCount: 30
items:
  - id: calc2-power-easy-001
    topicId: power-series
    skills: [identify-power-series-centers]
    archetype: center-recognition
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires reading the center from standard power-series form.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the center of $\sum_{n=0}^{\infty}c_n(x-4)^n$?
    choices:
      - { id: a, text: '$0$' }
      - { id: b, text: '$-4$' }
      - { id: c, text: '$4$' }
      - { id: d, text: '$c_n$' }
    answer: { choiceId: c }
    solutionOutline: Standard form uses powers of $x-a$, so $a=4$.
    commonTrap: Reading the written minus sign as a negative center.
    verification: { method: standard-form-definition, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-002
    topicId: power-series
    skills: [evaluate-power-series-at-centers]
    archetype: center-value
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires evaluating powers at the center and retaining the constant coefficient.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $f(x)=\sum_{n=0}^{\infty}c_n(x-a)^n$, what is $f(a)$?
    choices:
      - { id: a, text: '$c_0$' }
      - { id: b, text: '$c_1$' }
      - { id: c, text: '$0$' }
      - { id: d, text: '$\sum c_n$' }
    answer: { choiceId: a }
    solutionOutline: At $x=a$, every positive power vanishes and the zeroth-power term remains.
    commonTrap: Treating $0^0$ as eliminating the constant coefficient in power-series notation.
    verification: { method: direct-center-substitution, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-003
    topicId: power-series
    skills: [find-radii-with-ratio-tests]
    archetype: geometric-coefficient-radius
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires isolating the variable factor in a ratio-test limit.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of convergence of
      $$\sum_{n=0}^{\infty}\frac{(x-1)^n}{5^n}?$$
    choices:
      - { id: a, text: '$1$' }
      - { id: b, text: '$5$' }
      - { id: c, text: '$1/5$' }
      - { id: d, text: '$\infty$' }
    answer: { choiceId: b }
    solutionOutline: It is geometric with ratio $(x-1)/5$, so convergence requires $|x-1|<5$.
    commonTrap: Reporting the reciprocal coefficient $1/5$ as the radius.
    verification: { method: geometric-ratio-condition, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-004
    topicId: power-series
    skills: [convert-radius-to-interval]
    archetype: absolute-value-inequality
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires solving a centered absolute-value inequality.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which open interval is described by $|x+2|<3$?
    choices:
      - { id: a, text: '$(-5,1)$' }
      - { id: b, text: '$(-3,3)$' }
      - { id: c, text: '$(-1,5)$' }
      - { id: d, text: '$(-2,3)$' }
    answer: { choiceId: a }
    solutionOutline: Solve $-3<x+2<3$ and subtract two to obtain $-5<x<1$.
    commonTrap: Treating the center as positive two because the expression contains a plus sign.
    verification: { method: compound-inequality, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-005
    topicId: power-series
    skills: [test-power-series-endpoints]
    archetype: harmonic-versus-alternating-endpoints
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires substituting both radius endpoints and classifying two different numerical series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Find the interval of convergence of
      $$\sum_{n=1}^{\infty}\frac{(x+2)^n}{n3^n}.$$
    choices:
      - { id: a, text: '$[-5,1)$' }
      - { id: b, text: '$(-5,1)$' }
      - { id: c, text: '$(-5,1]$' }
      - { id: d, text: '$[-5,1]$' }
    answer: { choiceId: a }
    solutionOutline: The radius is three; $x=-5$ gives the alternating harmonic series, while $x=1$ gives the divergent harmonic series.
    commonTrap: Including or excluding both endpoints together without separate substitution.
    verification: { method: ratio-test-and-endpoint-tests, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-006
    topicId: power-series
    skills: [recognize-geometric-function-representations]
    archetype: sum-to-function
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the geometric sum formula to a power series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $|x|<1$, what function is represented by
      $\sum_{n=0}^{\infty}x^n$?
    choices:
      - { id: a, text: '$1/(1-x)$' }
      - { id: b, text: '$1/(1+x)$' }
      - { id: c, text: '$e^x$' }
      - { id: d, text: '$\ln(1+x)$' }
    answer: { choiceId: a }
    solutionOutline: A geometric series with first term one and ratio $x$ sums to $1/(1-x)$.
    commonTrap: Reversing the sign in the denominator.
    verification: { method: geometric-sum-formula, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-007
    topicId: power-series
    skills: [transform-power-series-by-substitution]
    archetype: quadratic-substitution
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires substituting a composite expression and translating its convergence condition.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which series represents $1/(1-x^2)$ for $|x|<1$?
    choices:
      - { id: a, text: '$\sum_{n=0}^{\infty}x^{2n}$' }
      - { id: b, text: '$\sum_{n=0}^{\infty}x^n$' }
      - { id: c, text: '$\sum_{n=0}^{\infty}(-1)^nx^{2n}$' }
      - { id: d, text: '$\sum_{n=1}^{\infty}2nx^{n-1}$' }
    answer: { choiceId: a }
    solutionOutline: Substitute $u=x^2$ into $1/(1-u)=\sum u^n$.
    commonTrap: Alternating signs as though the denominator were $1+x^2$.
    verification: { method: geometric-substitution, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-008
    topicId: power-series
    skills: [differentiate-power-series]
    archetype: coefficient-transformation
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires differentiating a general power-series term correctly.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Inside its radius, what is the derivative of
      $\sum_{n=0}^{\infty}c_n(x-a)^n$?
    choices:
      - { id: a, text: '$\sum_{n=1}^{\infty}nc_n(x-a)^{n-1}$' }
      - { id: b, text: '$\sum_{n=0}^{\infty}c_n(x-a)^{n+1}/(n+1)$' }
      - { id: c, text: '$\sum_{n=0}^{\infty}nc_n(x-a)^n$' }
      - { id: d, text: '$\sum_{n=1}^{\infty}c_n$' }
    answer: { choiceId: a }
    solutionOutline: The ordinary power rule applies termwise, and the constant term disappears.
    commonTrap: Keeping exponent $n$ after introducing the multiplier $n$.
    verification: { method: termwise-power-rule, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-009
    topicId: power-series
    skills: [integrate-power-series]
    archetype: antiderivative-coefficients
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires integrating a general term and including a constant.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which expression is an antiderivative of
      $\sum_{n=0}^{\infty}c_n(x-a)^n$ inside its radius?
    choices:
      - { id: a, text: '$C+\sum_{n=0}^{\infty}c_n(x-a)^{n+1}/(n+1)$' }
      - { id: b, text: '$\sum_{n=1}^{\infty}nc_n(x-a)^{n-1}$' }
      - { id: c, text: '$C+\sum c_n(x-a)^n$' }
      - { id: d, text: '$\sum c_n/(x-a)$' }
    answer: { choiceId: a }
    solutionOutline: Increase each exponent by one, divide by the new exponent, and add the integration constant.
    commonTrap: Omitting the arbitrary constant from an indefinite integral.
    verification: { method: termwise-antiderivative, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-010
    topicId: power-series
    skills: [sum-differentiated-geometric-series]
    archetype: weighted-geometric-function
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires differentiating and then multiplying a known geometric identity.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $|x|<1$, what is $\sum_{n=1}^{\infty}nx^n$?
    choices:
      - { id: a, text: '$x/(1-x)^2$' }
      - { id: b, text: '$1/(1-x)^2$' }
      - { id: c, text: '$x/(1-x)$' }
      - { id: d, text: '$-\ln(1-x)$' }
    answer: { choiceId: a }
    solutionOutline: Differentiate $\sum x^n=1/(1-x)$ to get $\sum nx^{n-1}$, then multiply by $x$.
    commonTrap: Forgetting the final multiplication needed to restore exponent $n$.
    verification: { method: differentiated-geometric-identity, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-011
    topicId: power-series
    skills: [understand-radius-preservation]
    archetype: calculus-operation-radius
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires knowing what remains invariant under termwise differentiation.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A power series has radius $R=6$. What radius does its derivative series have?
    choices:
      - { id: a, text: '$6$' }
      - { id: b, text: '$3$' }
      - { id: c, text: '$12$' }
      - { id: d, text: '$0$' }
    answer: { choiceId: a }
    solutionOutline: Differentiation changes coefficients by polynomial factors but preserves the radius of convergence.
    commonTrap: Assuming the exponent decrease shrinks the radius.
    verification: { method: radius-preservation-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-012
    topicId: power-series
    skills: [classify-endpoint-convergence]
    archetype: conditional-endpoint
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing an alternating harmonic endpoint as conditional.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      At an endpoint, a power series becomes $\sum(-1)^n/n$. How does it
      converge there?
    choices:
      - { id: a, text: 'Conditionally' }
      - { id: b, text: 'Absolutely' }
      - { id: c, text: 'It diverges by the term test.' }
      - { id: d, text: 'Geometrically' }
    answer: { choiceId: a }
    solutionOutline: Alternating harmonic convergence holds, while the absolute harmonic series diverges.
    commonTrap: Labeling all included power-series endpoints absolutely convergent.
    verification: { method: alternating-and-harmonic-tests, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-013
    topicId: power-series
    skills: [interpret-radius-behavior]
    archetype: inside-outside-boundary
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires stating the universal behavior inside and outside a positive finite radius.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A power series centered at $a$ has radius $R>0$. Which statement is true?
    choices:
      - { id: a, text: 'It converges absolutely for $|x-a|<R$ and diverges for $|x-a|>R$.' }
      - { id: b, text: 'It converges at every point with $|x-a|\le R$.' }
      - { id: c, text: 'It diverges throughout $|x-a|<R$.' }
      - { id: d, text: 'It has the same sum at every interior point.' }
    answer: { choiceId: a }
    solutionOutline: The radius theorem settles the interior and exterior, leaving only boundary points for separate tests.
    commonTrap: Treating the boundary as automatically part of the absolute-convergence region.
    verification: { method: radius-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-014
    topicId: power-series
    skills: [extract-power-series-coefficients]
    archetype: sparse-coefficients
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires reading coefficients when only even powers occur.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      In $\sum_{n=0}^{\infty}(-1)^nx^{2n}$, what is the coefficient of $x^6$?
    choices:
      - { id: a, text: '$-1$' }
      - { id: b, text: '$1$' }
      - { id: c, text: '$0$' }
      - { id: d, text: '$6$' }
    answer: { choiceId: a }
    solutionOutline: The exponent $2n=6$ gives $n=3$, whose coefficient is $(-1)^3=-1$.
    commonTrap: Using the exponent six directly in the sign exponent.
    verification: { method: exponent-index-solution, result: verified }
    reviewStatus: verified

  - id: calc2-power-easy-015
    topicId: power-series
    skills: [apply-root-radius-formulas]
    archetype: coefficient-growth-radius
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires connecting coefficient nth-root growth to the radius.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\lim_{n\to\infty}|c_n|^{1/n}=2$, what is the radius of
      $\sum c_n(x-a)^n$?
    choices:
      - { id: a, text: '$1/2$' }
      - { id: b, text: '$2$' }
      - { id: c, text: '$1$' }
      - { id: d, text: '$\infty$' }
    answer: { choiceId: a }
    solutionOutline: The root-test limit is $2|x-a|$, so convergence requires $|x-a|<1/2$.
    commonTrap: Reporting coefficient growth itself rather than its reciprocal as the radius.
    verification: { method: cauchy-hadamard-root-test, result: verified }
    reviewStatus: verified
  - id: calc2-power-easy-016
    topicId: power-series
    skills: [find-radii-with-factorial-growth]
    archetype: factorial-coefficients
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires simplifying a ratio that grows with n.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of convergence of $\sum_{n=0}^{\infty}n!x^n$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1$'}, {id: c, text: '$\infty$'}, {id: d, text: '$e$'}]
    answer: {choiceId: a}
    solutionOutline: The consecutive absolute ratio is $(n+1)|x|$, which exceeds one eventually for every nonzero x.
    commonTrap: Assuming a factorial denominator is present because factorials usually signal convergence.
    verification: {method: ratio-test-factorial-growth, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-017
    topicId: power-series
    skills: [recognize-entire-power-series]
    archetype: reciprocal-factorial-coefficients
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires showing convergence for every fixed real x.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of $\sum_{n=0}^{\infty}x^n/n!$?
    choices: [{id: a, text: '$\infty$'}, {id: b, text: '$1$'}, {id: c, text: '$0$'}, {id: d, text: '$e$'}]
    answer: {choiceId: a}
    solutionOutline: The ratio is $|x|/(n+1)\to0$ for every fixed x.
    commonTrap: Confusing the value e at x equals one with a radius.
    verification: {method: ratio-test-entire-series, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-018
    topicId: power-series
    skills: [test-power-series-endpoints]
    archetype: asymmetric-endpoint-behavior
    difficulty: intermediate
    reasoningDepth: 4
    difficultyEvidence: Requires finding the open interval and classifying both endpoints separately.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Find the interval of convergence of
      $\sum_{n=1}^{\infty}(x-2)^n/[3^n\sqrt n]$.
    choices: [{id: a, text: '$[-1,5)$'}, {id: b, text: '$(-1,5)$'}, {id: c, text: '$[-1,5]$'}, {id: d, text: '$(-1,5]$'}]
    answer: {choiceId: a}
    solutionOutline: The radius is three; x equals negative one gives a convergent alternating p-series, while x equals five gives the divergent positive p-series with exponent one half.
    commonTrap: Assuming endpoints share the same behavior because they are equally far from the center.
    verification: {method: radius-plus-independent-endpoint-tests, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-019
    topicId: power-series
    skills: [derive-geometric-function-series]
    archetype: multiply-shifted-geometric
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires converting the denominator and shifting powers.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Which series represents $x^2/(1+x)$ for $|x|<1$?
    choices: [{id: a, text: '$\sum_{n=0}^{\infty}(-1)^nx^{n+2}$'}, {id: b, text: '$\sum_{n=0}^{\infty}x^{2n}$'}, {id: c, text: '$\sum_{n=0}^{\infty}(-1)^nx^{2n}$'}, {id: d, text: '$\sum_{n=0}^{\infty}x^{n+2}$'}]
    answer: {choiceId: a}
    solutionOutline: Use $1/(1+x)=\sum(-x)^n$ and multiply every term by $x^2$.
    commonTrap: Squaring the exponent n when multiplying by x squared.
    verification: {method: geometric-substitution-and-power-shift, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-020
    topicId: power-series
    skills: [integrate-power-series]
    archetype: logarithm-from-geometric
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires integrating coefficients and fixing the constant at zero.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Which power series equals $\ln(1-x)$ for $|x|<1$?
    choices: [{id: a, text: '$-\sum_{n=1}^{\infty}x^n/n$'}, {id: b, text: '$\sum_{n=1}^{\infty}x^n/n$'}, {id: c, text: '$\sum_{n=0}^{\infty}nx^{n-1}$'}, {id: d, text: '$-\sum_{n=0}^{\infty}x^n$'}]
    answer: {choiceId: a}
    solutionOutline: Integrate $1/(1-x)=\sum x^n$ and use the negative derivative of ln one minus x.
    commonTrap: Losing the negative sign from differentiating the inner expression.
    verification: {method: termwise-integration-and-initial-value, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-021
    topicId: power-series
    skills: [differentiate-power-series]
    archetype: derivative-of-geometric
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires a correct index and exponent shift.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      For $|x|<1$, what is $\sum_{n=1}^{\infty}nx^{n-1}$?
    choices: [{id: a, text: '$1/(1-x)^2$'}, {id: b, text: '$x/(1-x)^2$'}, {id: c, text: '$1/(1+x)$'}, {id: d, text: '$-\ln(1-x)$'}]
    answer: {choiceId: a}
    solutionOutline: Differentiate $\sum_{n=0}^{\infty}x^n=1/(1-x)$ term by term.
    commonTrap: Using the formula for $\sum nx^n$ without accounting for the exponent n minus one.
    verification: {method: differentiated-geometric-series, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-022
    topicId: power-series
    skills: [derive-arctangent-series]
    archetype: integrate-alternating-geometric
    difficulty: intermediate
    reasoningDepth: 4
    difficultyEvidence: Requires substituting x squared and integrating odd powers.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      Which series represents $\arctan x$ for $|x|\le1$ where the endpoint
      series converges?
    choices: [{id: a, text: '$\sum_{n=0}^{\infty}(-1)^nx^{2n+1}/(2n+1)$'}, {id: b, text: '$\sum_{n=0}^{\infty}x^{n+1}/(n+1)$'}, {id: c, text: '$\sum_{n=0}^{\infty}(-1)^nx^{n}$'}, {id: d, text: '$\sum_{n=0}^{\infty}x^{2n}/(2n)$'}]
    answer: {choiceId: a}
    solutionOutline: Expand $1/(1+x^2)$ as $\sum(-1)^nx^{2n}$ and integrate from zero to x.
    commonTrap: Forgetting that substituting x squared creates only odd powers after integration.
    verification: {method: substituted-geometric-integration, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-023
    topicId: power-series
    skills: [recover-power-series-coefficients]
    archetype: derivative-at-center
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires connecting coefficients with repeated derivatives.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      If $f(x)=\sum_{n=0}^{\infty}c_n(x-a)^n$ near a, what is $c_3$?
    choices: [{id: a, text: '$f^{(3)}(a)/3!$'}, {id: b, text: '$f^{(3)}(a)$'}, {id: c, text: '$f(a)/3$'}, {id: d, text: '$3!f(a)$'}]
    answer: {choiceId: a}
    solutionOutline: Three differentiations make the cubic coefficient equal to $3!c_3$ at the center.
    commonTrap: Omitting the factorial created by repeated differentiation.
    verification: {method: coefficient-derivative-identity, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-024
    topicId: power-series
    skills: [classify-endpoint-series]
    archetype: conditional-radius-endpoint
    difficulty: intermediate
    reasoningDepth: 4
    difficultyEvidence: Requires converting an endpoint to a numerical series and classifying it.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      At $x=-1$, how does $\sum_{n=1}^{\infty}x^n/n$ converge?
    choices: [{id: a, text: 'Conditionally'}, {id: b, text: 'Absolutely'}, {id: c, text: 'It diverges by the term test.'}, {id: d, text: 'Geometrically'}]
    answer: {choiceId: a}
    solutionOutline: Substitution gives the alternating harmonic series, while its absolute series is harmonic.
    commonTrap: Calling every convergent endpoint absolute because it belongs to the interval.
    verification: {method: endpoint-substitution-and-classification, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-025
    topicId: power-series
    skills: [track-radii-under-differentiation]
    archetype: derivative-radius-invariance
    difficulty: intermediate
    reasoningDepth: 3
    difficultyEvidence: Requires separating the radius theorem from endpoint behavior.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      A power series has radius $R>0$. What radius does its differentiated
      series have?
    choices: [{id: a, text: '$R$'}, {id: b, text: '$R/2$'}, {id: c, text: '$2R$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Multiplying coefficients by n does not change their exponential growth rate, so the radius is unchanged.
    commonTrap: Assuming larger coefficients automatically shrink the radius by a fixed factor.
    verification: {method: power-series-radius-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-026
    topicId: power-series
    skills: [convert-radius-to-open-intervals]
    archetype: shifted-center-interval
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires solving a centered absolute-value inequality.
    assessmentUses: [focused-quiz]
    questionType: multipleChoice
    prompt: |
      A power series centered at $-3$ has radius $5$. On what open interval
      does it certainly converge?
    choices: [{id: a, text: '$(-8,2)$'}, {id: b, text: '$(-5,5)$'}, {id: c, text: '$(-2,8)$'}, {id: d, text: '$[-8,2]$'}]
    answer: {choiceId: a}
    solutionOutline: The condition $|x+3|<5$ gives negative eight less than x less than two.
    commonTrap: Centering the interval at zero instead of negative three.
    verification: {method: radius-inequality-solution, result: verified}
    reviewStatus: verified
  - id: calc2-power-easy-027
    topicId: power-series
    skills: [evaluate-power-series-at-points]
