schemaVersion: 1
bankId: calc2-taylor-maclaurin-hard
categoryId: calculus-2
topicIds: [taylor-maclaurin]
minimumItemCount: 15
items:
  - id: calc2-taylor-hard-001
    topicId: taylor-maclaurin
    skills: [extract-exponential-series-coefficients]
    archetype: scaled-exponential-coefficient
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires accounting for both the scaled input and factorial denominator.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^5$ in the Maclaurin series for $e^{2x}$?
    choices: [{id: a, text: '$4/15$'}, {id: b, text: '$2/15$'}, {id: c, text: '$32$'}, {id: d, text: '$1/120$'}]
    answer: {choiceId: a}
    solutionOutline: Substitute $2x$ into $\sum x^n/n!$ to obtain $2^5/5!=4/15$.
    commonTrap: Using 2 over 5 factorial instead of raising 2 to the fifth power.
    verification: {method: exponential-coefficient-formula, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-002
    topicId: taylor-maclaurin
    skills: [construct-shifted-taylor-polynomials]
    archetype: logarithm-centered-at-one
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires expressing the polynomial in powers of the displacement from the center.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which is the degree-three Taylor polynomial for $\log x$ centered at
      $x=1$?
    choices: [{id: a, text: '$(x-1)-(x-1)^2/2+(x-1)^3/3$'}, {id: b, text: '$x-x^2/2+x^3/3$'}, {id: c, text: '$(x-1)+(x-1)^2/2+(x-1)^3/3$'}, {id: d, text: '$1+(x-1)+(x-1)^2/2$'}]
    answer: {choiceId: a}
    solutionOutline: Set $h=x-1$ in $\log(1+h)=h-h^2/2+h^3/3-\cdots$.
    commonTrap: Writing a Maclaurin polynomial in x instead of a Taylor polynomial in x minus one.
    verification: {method: shifted-logarithm-expansion, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-003
    topicId: taylor-maclaurin
    skills: [relate-derivative-series-coefficients]
    archetype: coefficient-index-shift
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires aligning the differentiated exponent with a requested coefficient.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $f(x)=\sum_{n=0}^{\infty}a_nx^n$, what is the coefficient of
      $x^7$ in $f'(x)$?
    choices: [{id: a, text: '$8a_8$'}, {id: b, text: '$7a_7$'}, {id: c, text: '$a_8$'}, {id: d, text: '$8a_7$'}]
    answer: {choiceId: a}
    solutionOutline: Differentiating $a_8x^8$ produces the unique $x^7$ contribution, namely $8a_8x^7$.
    commonTrap: Matching the coefficient index to the post-derivative exponent.
    verification: {method: derivative-index-alignment, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-004
    topicId: taylor-maclaurin
    skills: [compose-trigonometric-series]
    archetype: sinc-even-coefficient
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires dividing a known odd series by x and tracking signs.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^4$ in the removable extension of
      $\sin x/x$ at zero?
    choices: [{id: a, text: '$1/120$'}, {id: b, text: '$-1/120$'}, {id: c, text: '$1/24$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: Dividing $x-x^3/3!+x^5/5!-\cdots$ by x makes the $x^4$ coefficient $1/5!$.
    commonTrap: Taking the sign from the preceding quadratic term.
    verification: {method: sine-series-division, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-005
    topicId: taylor-maclaurin
    skills: [combine-exponential-and-trigonometric-series]
    archetype: complex-exponential-coefficient
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires using a complex exponential or a Cauchy product to isolate a high-order coefficient.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^5$ in $e^x\cos x$?
    choices: [{id: a, text: '$-1/30$'}, {id: b, text: '$1/30$'}, {id: c, text: '$-1/120$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The function is the real part of $e^{(1+i)x}$, so the coefficient is $\operatorname{Re}(1+i)^5/5!=-4/120$.
    commonTrap: Multiplying only the fifth-degree coefficients of the two factors.
    verification: {method: complex-exponential-real-part, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-006
    topicId: taylor-maclaurin
    skills: [read-shifted-exponential-coefficients]
    archetype: exponential-nonzero-center
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires retaining the value of the function at the expansion center.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      In the Taylor series of $e^x$ centered at $x=2$, what is the
      coefficient of $(x-2)^3$?
    choices: [{id: a, text: '$e^2/6$'}, {id: b, text: '$1/6$'}, {id: c, text: '$e^3/2$'}, {id: d, text: '$2e^2$'}]
    answer: {choiceId: a}
    solutionOutline: Every derivative of the exponential evaluated at two is $e^2$, and the cubic coefficient divides by $3!$.
    commonTrap: Using the Maclaurin coefficient without evaluating at the new center.
    verification: {method: taylor-derivative-at-center, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-007
    topicId: taylor-maclaurin
    skills: [construct-centered-cosine-polynomials]
    archetype: cosine-centered-at-pi
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires shifting the input and using the angle-addition identity before truncation.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which is the degree-four Taylor polynomial for $\cos x$ centered at
      $x=\pi$?
    choices: [{id: a, text: '$-1+(x-\pi)^2/2-(x-\pi)^4/24$'}, {id: b, text: '$1-(x-\pi)^2/2+(x-\pi)^4/24$'}, {id: c, text: '$-(x-\pi)+(x-\pi)^3/6$'}, {id: d, text: '$-1-(x-\pi)^2/2-(x-\pi)^4/24$'}]
    answer: {choiceId: a}
    solutionOutline: With $h=x-\pi$, $\cos(\pi+h)=-\cos h=-1+h^2/2-h^4/24+\cdots$.
    commonTrap: Copying the Maclaurin series for cosine without the sign change caused by the shift.
    verification: {method: angle-shifted-cosine-expansion, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-008
    topicId: taylor-maclaurin
    skills: [compose-logarithmic-series]
    archetype: logarithm-even-power-substitution
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires substituting a quadratic input and matching the resulting sparse exponents.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^6$ in $\log(1+x^2)$?
    choices: [{id: a, text: '$1/3$'}, {id: b, text: '$-1/3$'}, {id: c, text: '$1/6$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: Substitution into $\log(1+u)=u-u^2/2+u^3/3-\cdots$ makes the cubic-in-u term $x^6/3$.
    commonTrap: Alternating signs by the exponent of x rather than by the power of the substituted variable.
    verification: {method: logarithm-quadratic-composition, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-009
    topicId: taylor-maclaurin
    skills: [recover-coefficients-from-derivatives]
    archetype: derivative-data-to-series
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires applying the factorial normalization in Taylor's formula.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Suppose $f^{(n)}(0)=3^n n$ for every $n\ge1$. What is the
      coefficient of $x^7$ in the Maclaurin series of f?
    choices: [{id: a, text: '$3^7/6!$'}, {id: b, text: '$3^7/7!$'}, {id: c, text: '$7\cdot3^7$'}, {id: d, text: '$3^6/7!$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient is $f^{(7)}(0)/7!=7\cdot3^7/7!=3^7/6!$.
    commonTrap: Forgetting the factor seven in the supplied derivative data.
    verification: {method: taylor-factorial-normalization, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-010
    topicId: taylor-maclaurin
    skills: [recognize-exact-taylor-representations]
    archetype: polynomial-termination
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires distinguishing exact polynomial representation from approximation.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If p is a polynomial of degree seven, which statement holds for its
      Taylor polynomial of degree seven about any center a?
    choices: [{id: a, text: 'It equals p for every x.'}, {id: b, text: 'It equals p only near a.'}, {id: c, text: 'It omits the constant term unless a is zero.'}, {id: d, text: 'It requires an infinite remainder series.'}]
    answer: {choiceId: a}
    solutionOutline: All derivatives above order seven vanish, so Taylor's finite formula reconstructs the polynomial exactly.
    commonTrap: Treating every Taylor polynomial as merely local and approximate.
    verification: {method: polynomial-taylor-termination, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-011
    topicId: taylor-maclaurin
    skills: [integrate-composed-series]
    archetype: removable-integrand-series
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires expanding a composed exponential, canceling a removable factor, and integrating termwise.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Let $F(x)=\int_0^x (e^{t^2}-1)/t\,dt$, using the removable value at
      $t=0$. What is the coefficient of $x^6$ in F?
    choices: [{id: a, text: '$1/36$'}, {id: b, text: '$1/18$'}, {id: c, text: '$1/6$'}, {id: d, text: '$1/720$'}]
    answer: {choiceId: a}
    solutionOutline: The integrand is $\sum_{k\ge1}t^{2k-1}/k!$, so integration gives $x^{2k}/(2k\,k!)$; use k equals three.
    commonTrap: Integrating the exponential series before dividing by t and removing the constant term.
    verification: {method: composed-series-termwise-integration, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-012
    topicId: taylor-maclaurin
    skills: [solve-linear-odes-with-series]
    archetype: forced-first-order-series
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires deriving or recognizing the series solution of a nonhomogeneous initial-value problem.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      The solution of $y'=y+x$ with $y(0)=0$ has a Maclaurin series.
      What is its $x^4$ coefficient?
    choices: [{id: a, text: '$1/24$'}, {id: b, text: '$1/6$'}, {id: c, text: '$-1/24$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: Solving gives $y=e^x-x-1$, whose terms of degree two and above have coefficient $1/n!$.
    commonTrap: Keeping the linear and constant terms of the exponential without applying the initial condition.
    verification: {method: linear-ivp-series-solution, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-013
    topicId: taylor-maclaurin
    skills: [compose-cosine-series]
    archetype: quartic-exponent-spacing
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires recognizing that composition changes the spacing of nonzero powers.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^8$ in $\cos(x^2)$?
    choices: [{id: a, text: '$1/24$'}, {id: b, text: '$-1/24$'}, {id: c, text: '$1/8!$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: Since $\cos u=1-u^2/2!+u^4/4!-\cdots$, substituting $u=x^2$ makes the $x^8$ term $x^8/4!$.
    commonTrap: Associating x to the eighth with the eighth cosine derivative rather than the fourth power of the substituted input.
    verification: {method: cosine-quadratic-composition, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-014
    topicId: taylor-maclaurin
    skills: [evaluate-limits-with-leading-series-terms]
    archetype: canceled-exponential-limit
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires identifying the first surviving term after cancellation.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\lim_{x\to0}\frac{e^x-1-x}{x^2}$.
    choices: [{id: a, text: '$1/2$'}, {id: b, text: '$1$'}, {id: c, text: '$0$'}, {id: d, text: 'The limit does not exist'}]
    answer: {choiceId: a}
    solutionOutline: The numerator begins with $x^2/2+x^3/6+\cdots$, so division by $x^2$ leaves one-half in the limit.
    commonTrap: Using the canceled constant or linear term as the leading behavior.
    verification: {method: leading-nonzero-taylor-term, result: verified}
    reviewStatus: verified
  - id: calc2-taylor-hard-015
    topicId: taylor-maclaurin
    skills: [extract-cauchy-product-coefficients]
    archetype: exponential-geometric-product
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires summing every coefficient pair that contributes to one degree.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^5$ in $e^x/(1-x)$?
    choices: [{id: a, text: '$163/60$'}, {id: b, text: '$1/120$'}, {id: c, text: '$31/30$'}, {id: d, text: '$5$'}]
    answer: {choiceId: a}
    solutionOutline: The Cauchy coefficient is $\sum_{k=0}^{5}1/k!=1+1+1/2+1/6+1/24+1/120=163/60$.
    commonTrap: Multiplying the fifth-degree terms instead of summing all degree pairs.
    verification: {method: finite-cauchy-coefficient-sum, result: verified}
    reviewStatus: verified
