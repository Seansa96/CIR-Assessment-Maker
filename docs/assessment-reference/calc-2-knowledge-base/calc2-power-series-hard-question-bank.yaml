schemaVersion: 1
bankId: calc2-power-series-hard
categoryId: calculus-2
topicIds: [power-series]
minimumItemCount: 15
items:
  - id: calc2-power-hard-001
    topicId: power-series
    skills: [find-radii-from-stirling-asymptotics]
    archetype: self-power-over-factorial-coefficients
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires estimating nth-root coefficient growth with Stirling's formula.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the radius of convergence of
      $\sum_{n=1}^{\infty}(n^n/n!)x^n$?
    choices: [{id: a, text: '$1/e$'}, {id: b, text: '$e$'}, {id: c, text: '$1$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Stirling gives $(n^n/n!)^{1/n}\to e$, so the Cauchy–Hadamard radius is its reciprocal.
    commonTrap: Reporting coefficient growth e rather than the reciprocal radius.
    verification: {method: stirling-cauchy-hadamard, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-002
    topicId: power-series
    skills: [find-radii-from-central-binomial-growth]
    archetype: reciprocal-central-binomial-scale
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires retaining exponential growth while ignoring subexponential factors.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Find the radius of
      $\sum_{n=1}^{\infty}[(n!)^2/(2n)!]x^n$.
    choices: [{id: a, text: '$4$'}, {id: b, text: '$1/4$'}, {id: c, text: '$2$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: The coefficient is the reciprocal central binomial coefficient and has nth-root limit one fourth.
    commonTrap: Using the central binomial growth $4^n$ without noticing the reciprocal.
    verification: {method: central-binomial-root-growth, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-003
    topicId: power-series
    skills: [test-shifted-power-series-endpoints]
    archetype: alternating-left-harmonic-right
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires solving the radius inequality and classifying two different endpoint series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Determine the interval of convergence of
      $\sum_{n=1}^{\infty}(x+2)^n/(n3^n)$.
    choices: [{id: a, text: '$[-5,1)$'}, {id: b, text: '$(-5,1)$'}, {id: c, text: '$[-5,1]$'}, {id: d, text: '$(-5,1]$'}]
    answer: {choiceId: a}
    solutionOutline: The radius is three; x equals negative five gives the alternating harmonic series, while x equals one gives the harmonic series.
    commonTrap: Assuming symmetric geometric distance produces symmetric endpoint behavior.
    verification: {method: ratio-radius-and-endpoint-substitution, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-004
    topicId: power-series
    skills: [derive-binomial-generating-functions]
    archetype: second-geometric-derivative
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires differentiating a geometric identity and matching coefficients.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^n$ in $1/(1-x)^3$?
    choices: [{id: a, text: '$(n+1)(n+2)/2$'}, {id: b, text: '$n+1$'}, {id: c, text: '$n^2$'}, {id: d, text: '$3^n$'}]
    answer: {choiceId: a}
    solutionOutline: The negative-binomial expansion gives $\binom{n+2}{2}$, or differentiate the geometric series twice with the correct scale.
    commonTrap: Using the coefficient sequence for $1/(1-x)^2$.
    verification: {method: negative-binomial-coefficient, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-005
    topicId: power-series
    skills: [compute-cauchy-product-coefficients]
    archetype: square-of-geometric-series
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires counting convolution pairs at a fixed total index.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Squaring $\sum_{n=0}^{\infty}x^n$ inside $|x|<1$, what is the
      coefficient of $x^m$?
    choices: [{id: a, text: '$m+1$'}, {id: b, text: '$m$'}, {id: c, text: '$2^m$'}, {id: d, text: '$1$'}]
    answer: {choiceId: a}
    solutionOutline: The convolution pairs $(k,m-k)$ range from k equals zero through m, giving m plus one contributions.
    commonTrap: Multiplying coefficients with matching indices only instead of convolving all index pairs.
    verification: {method: cauchy-product-pair-count, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-006
    topicId: power-series
    skills: [extract-even-and-odd-power-series]
    archetype: parity-symmetrization
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires combining function values at x and negative x.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $f(x)=\sum c_nx^n$, which expression retains only its even-power
      terms?
    choices: [{id: a, text: '$[f(x)+f(-x)]/2$'}, {id: b, text: '$[f(x)-f(-x)]/2$'}, {id: c, text: '$f(x^2)/2$'}, {id: d, text: '$f(x)+f(x)$'}]
    answer: {choiceId: a}
    solutionOutline: Substitution of negative x preserves even powers and reverses odd powers, so averaging cancels the odd part.
    commonTrap: Subtracting and thereby extracting the odd part instead.
    verification: {method: parity-symmetrization, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-007
    topicId: power-series
    skills: [derive-coefficient-recurrences-from-odes]
    archetype: exponential-initial-value-problem
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires aligning indices after differentiating a formal series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Let $y=\sum_{n=0}^{\infty}c_nx^n$ satisfy $y'=y$ and $y(0)=2$.
      Which recurrence is correct?
    choices: [{id: a, text: '$c_0=2$ and $c_{n+1}=c_n/(n+1)$'}, {id: b, text: '$c_0=0$ and $c_{n+1}=(n+1)c_n$'}, {id: c, text: '$c_n=2$ for every n'}, {id: d, text: '$c_{n+1}=-c_n$'}]
    answer: {choiceId: a}
    solutionOutline: Matching the x-to-the-n coefficient in $y'=\sum(n+1)c_{n+1}x^n$ with y gives the recurrence.
    commonTrap: Forgetting the derivative multiplier n plus one.
    verification: {method: ode-coefficient-matching, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-008
    topicId: power-series
    skills: [compose-power-series]
    archetype: quadratic-substitution
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires transforming both exponent pattern and convergence condition.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      From $1/(1-u)=\sum u^n$, which series represents $1/(1-x^2)$?
    choices: [{id: a, text: '$\sum_{n=0}^{\infty}x^{2n}$ for $|x|<1$'}, {id: b, text: '$\sum x^n$ for $|x|<2$'}, {id: c, text: '$\sum(-1)^nx^{2n}$'}, {id: d, text: '$\sum x^{n+2}$'}]
    answer: {choiceId: a}
    solutionOutline: Substitute u equals x squared; the condition $|u|<1$ becomes $|x|<1$.
    commonTrap: Squaring the radius along with the variable.
    verification: {method: geometric-composition-condition, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-009
    topicId: power-series
    skills: [use-power-series-uniqueness]
    archetype: identical-functions-coefficients
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires invoking uniqueness on a neighborhood rather than at a point.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Two power series centered at a agree for every x in an open interval
      around a. What follows?
    choices: [{id: a, text: 'Their corresponding coefficients are equal.'}, {id: b, text: 'Only their constant coefficients agree.'}, {id: c, text: 'Their radii must be infinite.'}, {id: d, text: 'Their coefficients may differ arbitrarily.'}]
    answer: {choiceId: a}
    solutionOutline: Repeated derivatives at the center recover each coefficient uniquely.
    commonTrap: Treating equality on an interval like equality at one sample point.
    verification: {method: analytic-coefficient-uniqueness, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-010
    topicId: power-series
    skills: [connect-singularities-and-radii]
    archetype: nearest-real-singularity
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires measuring distance from the center to the nearest obstruction.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the radius of the Taylor series of $1/(1+x^2)$ centered at
      zero?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$\infty$'}, {id: c, text: '$2$'}, {id: d, text: '$1/2$'}]
    answer: {choiceId: a}
    solutionOutline: The geometric representation $\sum(-1)^nx^{2n}$ requires $|x|<1$; equivalently the complex singularities are at plus or minus i.
    commonTrap: Assuming no real singularity means an infinite Taylor radius.
    verification: {method: geometric-representation-and-nearest-singularity, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-011
    topicId: power-series
    skills: [track-radii-under-integration]
    archetype: termwise-antiderivative
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires separating radius preservation from endpoint changes.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $\sum c_n(x-a)^n$ has radius R, what radius does its termwise
      antiderivative have?
    choices: [{id: a, text: '$R$'}, {id: b, text: '$R+1$'}, {id: c, text: '$R/2$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Dividing coefficients by n plus one changes only subexponential growth, so the radius is unchanged.
    commonTrap: Assuming smaller coefficients force an infinite radius.
    verification: {method: radius-preservation-under-integration, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-012
    topicId: power-series
    skills: [analyze-sums-of-power-series]
    archetype: cancellation-can-enlarge-radius
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires distinguishing a guaranteed lower bound from an exact radius.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Power series f and g share a center and have radii $2$ and $5$. What is
      guaranteed about the radius of $f+g$?
    choices: [{id: a, text: 'It is at least $2$.'}, {id: b, text: 'It is exactly $2$.'}, {id: c, text: 'It is exactly $7$.'}, {id: d, text: 'It is zero.'}]
    answer: {choiceId: a}
    solutionOutline: Both converge in the smaller disk, while coefficient cancellation can make the sum's radius larger.
    commonTrap: Declaring the minimum exact without ruling out cancellation.
    verification: {method: common-disk-guarantee, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-013
    topicId: power-series
    skills: [differentiate-known-power-series]
    archetype: logarithmic-derivative-recovery
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires recognizing a differentiated coefficient pattern.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Inside $|x|<1$, what function equals
      $\sum_{n=1}^{\infty}(-1)^{n-1}x^{n-1}$?
    choices: [{id: a, text: '$1/(1+x)$'}, {id: b, text: '$1/(1-x)$'}, {id: c, text: '$\ln(1+x)$'}, {id: d, text: '$-\ln(1-x)$'}]
    answer: {choiceId: a}
    solutionOutline: This is the geometric series with ratio negative x, and it is also the derivative of $\ln(1+x)$.
    commonTrap: Selecting the logarithm itself rather than its derivative.
    verification: {method: alternating-geometric-identification, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-014
    topicId: power-series
    skills: [evaluate-power-series-at-interior-points]
    archetype: generating-function-substitution
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires connecting a coefficient identity to a numerical sum.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{n=0}^{\infty}(n+1)/2^n$.
    choices: [{id: a, text: '$4$'}, {id: b, text: '$2$'}, {id: c, text: '$3$'}, {id: d, text: '$6$'}]
    answer: {choiceId: a}
    solutionOutline: Use $\sum(n+1)x^n=1/(1-x)^2$ at x equals one half.
    commonTrap: Applying the unweighted geometric sum and ignoring n plus one.
    verification: {method: differentiated-geometric-evaluation, result: verified}
    reviewStatus: verified
  - id: calc2-power-hard-015
    topicId: power-series
    skills: [interpret-endpoint-underdetermination]
    archetype: same-radius-different-endpoints
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires providing contrasting coefficient examples with the same radius.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Why does a radius alone not determine endpoint behavior?
    choices: [{id: a, text: '$\sum x^n/n$ and $\sum x^n/n^2$ both have radius $1$ but differ at endpoints.'}, {id: b, text: 'Every radius is approximate.'}, {id: c, text: 'Endpoints are always excluded.'}, {id: d, text: 'Power series have no endpoints.'}]
    answer: {choiceId: a}
    solutionOutline: At x equals one the first is harmonic and diverges, while the second converges absolutely, despite identical radii.
    commonTrap: Treating the ratio/root boundary as a divergence result.
    verification: {method: contrasting-endpoint-examples, result: verified}
    reviewStatus: verified
