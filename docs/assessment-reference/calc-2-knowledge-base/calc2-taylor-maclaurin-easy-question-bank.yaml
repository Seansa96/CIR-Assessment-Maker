schemaVersion: 1
bankId: calc2-taylor-maclaurin-easy
categoryId: calculus-2
topicIds:
  - taylor-maclaurin
minimumItemCount: 15
items:
  - id: calc2-taylor-easy-001
    topicId: taylor-maclaurin
    skills: [identify-taylor-coefficients]
    archetype: coefficient-formula
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires matching derivative order, center, and factorial.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $(x-a)^n$ in the Taylor series of $f$ about $a$?
    choices:
      - { id: a, text: '$f^{(n)}(a)/n!$' }
      - { id: b, text: '$f(a)/n$' }
      - { id: c, text: '$f^{(n)}(x)$' }
      - { id: d, text: '$n!f(a)$' }
    answer: { choiceId: a }
    solutionOutline: Repeated differentiation at the center isolates the nth coefficient as $f^{(n)}(a)/n!$.
    commonTrap: Evaluating the derivative at the variable $x$ instead of the fixed center.
    verification: { method: taylor-coefficient-definition, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-002
    topicId: taylor-maclaurin
    skills: [distinguish-taylor-and-maclaurin-series]
    archetype: center-identification
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying the special center defining Maclaurin series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A Maclaurin series is a Taylor series centered at which value?
    choices:
      - { id: a, text: '$a=0$' }
      - { id: b, text: '$a=1$' }
      - { id: c, text: '$a=e$' }
      - { id: d, text: '$a=\infty$' }
    answer: { choiceId: a }
    solutionOutline: “Maclaurin” is the conventional name for the Taylor expansion about zero.
    commonTrap: Confusing the common logarithm center one with the Maclaurin center.
    verification: { method: definition-check, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-003
    topicId: taylor-maclaurin
    skills: [construct-exponential-series]
    archetype: derivative-pattern
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires using the repeated derivative pattern of the exponential.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which Maclaurin series represents $e^x$?
    choices:
      - { id: a, text: '$\sum_{n=0}^{\infty}x^n/n!$' }
      - { id: b, text: '$\sum_{n=0}^{\infty}(-1)^nx^n$' }
      - { id: c, text: '$\sum_{n=1}^{\infty}x^n/n$' }
      - { id: d, text: '$\sum_{n=0}^{\infty}n!x^n$' }
    answer: { choiceId: a }
    solutionOutline: Every derivative of $e^x$ equals $e^x$ and evaluates to one at zero.
    commonTrap: Omitting factorial denominators from the Taylor coefficient formula.
    verification: { method: derivative-coefficient-check, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-004
    topicId: taylor-maclaurin
    skills: [recognize-sine-series]
    archetype: parity-and-sign-pattern
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires matching odd powers, alternating signs, and odd factorials.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which are the first four nonzero Maclaurin terms for $\sin x$?
    choices:
      - { id: a, text: '$x-x^3/3!+x^5/5!-x^7/7!$' }
      - { id: b, text: '$1-x^2/2!+x^4/4!-x^6/6!$' }
      - { id: c, text: '$x+x^2+x^3+x^4$' }
      - { id: d, text: '$1+x+x^2/2!+x^3/3!$' }
    answer: { choiceId: a }
    solutionOutline: The sine derivative cycle vanishes at even orders and alternates signs at odd orders.
    commonTrap: Selecting the even-power cosine pattern.
    verification: { method: derivative-cycle, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-005
    topicId: taylor-maclaurin
    skills: [form-taylor-polynomials]
    archetype: cosine-polynomial
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires truncating at a specified degree without adding a nonexistent odd coefficient.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the degree-four Maclaurin polynomial for $\cos x$?
    choices:
      - { id: a, text: '$1-x^2/2!+x^4/4!$' }
      - { id: b, text: '$x-x^3/3!$' }
      - { id: c, text: '$1+x+x^2/2!+x^3/3!+x^4/4!$' }
      - { id: d, text: '$1-x+x^2-x^3+x^4$' }
    answer: { choiceId: a }
    solutionOutline: Cosine has nonzero even-order coefficients with alternating signs.
    commonTrap: Including all degrees up to four even when odd coefficients vanish.
    verification: { method: cosine-series-truncation, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-006
    topicId: taylor-maclaurin
    skills: [use-geometric-series-as-a-source]
    archetype: known-series-foundation
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires recalling both formula and convergence condition.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For which $x$ is
      $$\frac1{1-x}=\sum_{n=0}^{\infty}x^n$$
      valid?
    choices:
      - { id: a, text: '$|x|<1$' }
      - { id: b, text: '$|x|\le1$' }
      - { id: c, text: '$x>1$' }
      - { id: d, text: 'All real $x$' }
    answer: { choiceId: a }
    solutionOutline: It is a geometric series with ratio $x$, which converges precisely when the ratio magnitude is below one.
    commonTrap: Including endpoints where the geometric terms do not approach zero.
    verification: { method: geometric-convergence-condition, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-007
    topicId: taylor-maclaurin
    skills: [transform-known-series-by-substitution]
    archetype: sign-substitution
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires substituting a negative variable into a known representation and preserving its domain.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which series represents $1/(1+x)$ for $|x|<1$?
    choices:
      - { id: a, text: '$\sum_{n=0}^{\infty}(-1)^nx^n$' }
      - { id: b, text: '$\sum_{n=0}^{\infty}x^n$' }
      - { id: c, text: '$\sum_{n=1}^{\infty}x^n/n$' }
      - { id: d, text: '$\sum_{n=0}^{\infty}x^{2n}$' }
    answer: { choiceId: a }
    solutionOutline: Replace $x$ by $-x$ in $1/(1-x)=\sum x^n$.
    commonTrap: Changing the denominator sign without changing the coefficient signs.
    verification: { method: geometric-substitution, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-008
    topicId: taylor-maclaurin
    skills: [differentiate-power-series]
    archetype: geometric-derivative
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires termwise differentiation and correct reindexing.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Differentiating $\sum_{n=0}^{\infty}x^n=1/(1-x)$ gives which identity?
    choices:
      - { id: a, text: '$\sum_{n=1}^{\infty}nx^{n-1}=1/(1-x)^2$' }
      - { id: b, text: '$\sum_{n=1}^{\infty}x^{n-1}=1/(1-x)$' }
      - { id: c, text: '$\sum_{n=0}^{\infty}nx^n=1/(1-x)$' }
      - { id: d, text: '$\sum_{n=1}^{\infty}x^n/n=\ln(1-x)$' }
    answer: { choiceId: a }
    solutionOutline: Differentiate each $x^n$ to $nx^{n-1}$ and the rational function to $(1-x)^{-2}$.
    commonTrap: Forgetting the factor $n$ created by differentiation.
    verification: { method: termwise-differentiation, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-009
    topicId: taylor-maclaurin
    skills: [integrate-power-series]
    archetype: logarithm-from-geometric
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires integrating a known series and fixing the integration constant.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which series equals $\ln(1+x)$ for $|x|<1$?
    choices:
      - { id: a, text: '$\sum_{n=1}^{\infty}(-1)^{n-1}x^n/n$' }
      - { id: b, text: '$\sum_{n=0}^{\infty}x^n$' }
      - { id: c, text: '$\sum_{n=1}^{\infty}nx^{n-1}$' }
      - { id: d, text: '$\sum_{n=1}^{\infty}x^n/n!$' }
    answer: { choiceId: a }
    solutionOutline: Integrate $1/(1+x)=\sum(-1)^nx^n$ from zero to $x$, using $\ln1=0$.
    commonTrap: Omitting alternating signs or the new divisor $n$.
    verification: { method: definite-termwise-integration, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-010
    topicId: taylor-maclaurin
    skills: [track-radii-under-calculus-operations]
    archetype: radius-preservation
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires knowing what differentiation changes and preserves.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What happens to the radius of convergence when a power series is
      differentiated term by term?
    choices:
      - { id: a, text: 'The radius stays the same.' }
      - { id: b, text: 'The radius always becomes zero.' }
      - { id: c, text: 'The radius doubles.' }
      - { id: d, text: 'The radius becomes infinite.' }
    answer: { choiceId: a }
    solutionOutline: Differentiation changes coefficients by polynomial factors, which do not alter their exponential growth rate.
    commonTrap: Assuming all endpoint behavior is also preserved; endpoints must be retested.
    verification: { method: power-series-radius-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-011
    topicId: taylor-maclaurin
    skills: [test-power-series-endpoints]
    archetype: endpoint-independence
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires recognizing that the ratio test is inconclusive on the radius boundary.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      After finding a finite radius $R$, what must be done at $x=a\pm R$?
    choices:
      - { id: a, text: 'Substitute each endpoint and test the resulting numerical series separately.' }
      - { id: b, text: 'Include both endpoints automatically.' }
      - { id: c, text: 'Exclude both endpoints automatically.' }
      - { id: d, text: 'Differentiate until the endpoints disappear.' }
    answer: { choiceId: a }
    solutionOutline: Boundary points make the radius test inconclusive and can have different convergence behavior.
    commonTrap: Assuming symmetry of the radius forces symmetry of endpoint inclusion.
    verification: { method: endpoint-procedure, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-012
    topicId: taylor-maclaurin
    skills: [build-shifted-taylor-polynomials]
    archetype: logarithm-centered-at-one
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires evaluating derivatives at a nonzero center.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the degree-two Taylor polynomial for $\ln x$ centered at $a=1$?
    choices:
      - { id: a, text: '$(x-1)-(x-1)^2/2$' }
      - { id: b, text: '$1+x-x^2/2$' }
      - { id: c, text: '$x+x^2/2$' }
      - { id: d, text: '$\ln1+(x-1)+(x-1)^2/2$' }
    answer: { choiceId: a }
    solutionOutline: At one, $f(1)=0$, $f'(1)=1$, and $f''(1)=-1$, giving the stated coefficients.
    commonTrap: Losing the negative second derivative of the logarithm.
    verification: { method: derivative-evaluation-at-center, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-013
    topicId: taylor-maclaurin
    skills: [evaluate-taylor-approximations]
    archetype: polynomial-substitution
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires substituting into a Taylor polynomial with factorial coefficients.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Using $T_2(x)=1+x+x^2/2$, approximate $e^{0.2}$.
    choices:
      - { id: a, text: '$1.22$' }
      - { id: b, text: '$1.2$' }
      - { id: c, text: '$1.02$' }
      - { id: d, text: '$0.22$' }
    answer: { choiceId: a }
    solutionOutline: Substitute $0.2$ to get $1+0.2+0.04/2=1.22$.
    commonTrap: Forgetting to divide the quadratic term by two.
    verification: { method: direct-polynomial-evaluation, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-014
    topicId: taylor-maclaurin
    skills: [distinguish-formal-series-from-function-equality]
    archetype: remainder-condition
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires stating the condition that makes a Taylor series equal its source function.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What must happen for the Taylor series of $f$ at $a$ to equal $f(x)$ at
      a particular $x$?
    choices:
      - { id: a, text: 'The Taylor remainder $R_n(x)$ must tend to zero.' }
      - { id: b, text: 'All derivatives must be positive.' }
      - { id: c, text: 'The polynomial degree must remain fixed.' }
      - { id: d, text: '$x$ must equal zero.' }
    answer: { choiceId: a }
    solutionOutline: Taylor's formula is $f(x)=T_n(x)+R_n(x)$, so equality with the infinite coefficient series requires the remainder to vanish.
    commonTrap: Assuming existence of derivatives alone guarantees representation by the Taylor series.
    verification: { method: taylor-formula-limit, result: verified }
    reviewStatus: verified

  - id: calc2-taylor-easy-015
    topicId: taylor-maclaurin
    skills: [transform-exponential-series]
    archetype: scaled-argument-substitution
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires substituting a scaled argument into a known expansion.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which Maclaurin series represents $e^{-2x}$?
    choices:
      - { id: a, text: '$\sum_{n=0}^{\infty}(-2)^nx^n/n!$' }
      - { id: b, text: '$\sum_{n=0}^{\infty}2^nx^n$' }
      - { id: c, text: '$\sum_{n=0}^{\infty}(-1)^nx^n$' }
      - { id: d, text: '$\sum_{n=1}^{\infty}x^n/(2n)!$' }
    answer: { choiceId: a }
    solutionOutline: Substitute $u=-2x$ into $e^u=\sum u^n/n!$.
    commonTrap: Applying the negative sign but omitting the factor $2^n$.
    verification: { method: known-series-substitution, result: verified }
    reviewStatus: verified
