schemaVersion: 1
bankId: calc2-sequences-series-overview
categoryId: calculus-2
topicIds:
  - sequences-series
minimumItemCount: 15
items:
  - id: calc2-ss-overview-001
    topicId: sequences-series
    skills:
      - distinguish-sequences-from-series
    archetype: object-identification
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires distinguishing the term sequence from the partial-sum sequence.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      For a series $\sum_{n=1}^{\infty}a_n$, which sequence must converge for
      the series itself to converge?
    choices:
      - id: a
        text: '$a_n$'
      - id: b
        text: '$S_N=\sum_{n=1}^{N}a_n$'
      - id: c
        text: '$a_{n+1}/a_n$'
      - id: d
        text: '$|a_n|/N$'
    answer:
      choiceId: b
    solutionOutline: An infinite series is defined as the limit of its finite partial sums, so convergence means $S_N$ approaches a finite number.
    commonTrap: Checking only the term limit $a_n\to0$, which is necessary but not sufficient.
    verification:
      method: definition-of-series-convergence
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-002
    topicId: sequences-series
    skills:
      - apply-the-divergence-test
    archetype: necessary-condition
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the necessary term condition in the valid direction.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      Suppose $\lim_{n\to\infty}a_n=-3$. What can be concluded about
      $\sum_{n=1}^{\infty}a_n$?
    choices:
      - id: a
        text: It converges to $-3$.
      - id: b
        text: It converges absolutely.
      - id: c
        text: It diverges.
      - id: d
        text: The term test is inconclusive.
    answer:
      choiceId: c
    solutionOutline: A convergent series must have terms tending to zero; the nonzero term limit violates that necessary condition.
    commonTrap: Treating the limit of the terms as though it were the sum of the series.
    verification:
      method: contrapositive-of-term-condition
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-003
    topicId: sequences-series
    skills:
      - interpret-zero-term-limits
    archetype: invalid-converse
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Tests recognition that a zero term limit does not settle series convergence.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      A student computes $\lim_{n\to\infty}a_n=0$. Which statement is always valid?
    choices:
      - id: a
        text: '$\sum a_n$ converges.'
      - id: b
        text: '$\sum a_n$ diverges.'
      - id: c
        text: The divergence test gives no conclusion.
      - id: d
        text: '$\sum |a_n|$ converges.'
    answer:
      choiceId: c
    solutionOutline: The divergence test rejects nonzero or nonexistent term limits, but a zero limit is compatible with either convergence or divergence.
    commonTrap: Reversing the true implication “series convergence implies term limit zero.”
    verification:
      method: harmonic-and-geometric-counterexamples
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-004
    topicId: sequences-series
    skills:
      - compute-partial-sums
    archetype: finite-sum-calculation
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires calculating a specified finite partial sum without using an infinite-series formula.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      If $a_n=2^{-n}$, what is the third partial sum
      $S_3=\sum_{n=1}^{3}a_n$?
    choices:
      - id: a
        text: '$3/4$'
      - id: b
        text: '$7/8$'
      - id: c
        text: '$1$'
      - id: d
        text: '$15/16$'
    answer:
      choiceId: b
    solutionOutline: 'Add the first three indexed terms: $1/2+1/4+1/8=7/8$.'
    commonTrap: Including the $n=0$ term even though the series begins at $n=1$.
    verification:
      method: direct-fraction-addition
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-005
    topicId: sequences-series
    skills:
      - derive-telescoping-partial-sums
    archetype: telescoping-boundaries
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires expanding a finite telescoping sum and retaining the correct endpoint.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      Given $a_n=1/n-1/(n+1)$, which formula equals
      $S_N=\sum_{n=1}^{N}a_n$?
    choices:
      - id: a
        text: '$1-1/(N+1)$'
      - id: b
        text: '$1-1/N$'
      - id: c
        text: '$1+1/(N+1)$'
      - id: d
        text: '$N/(N+1)+1/N$'
    answer:
      choiceId: a
    solutionOutline: Expanding the finite sum cancels every reciprocal from $1/2$ through $1/N$, leaving $1-1/(N+1)$.
    commonTrap: Dropping the first omitted denominator and writing $1/N$ as the final boundary.
    verification:
      method: finite-expansion-and-small-N-check
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-006
    topicId: sequences-series
    skills:
      - connect-partial-sums-to-series-values
    archetype: partial-sum-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires taking the limit of a supplied partial-sum formula.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      A series has partial sums $S_N=4-3/(N+2)$. What is its sum?
    choices:
      - id: a
        text: '$1$'
      - id: b
        text: '$3$'
      - id: c
        text: '$4$'
      - id: d
        text: The series diverges.
    answer:
      choiceId: c
    solutionOutline: Since $3/(N+2)\to0$, the defining limit of the partial sums is $\lim S_N=4$.
    commonTrap: Substituting an early value of $N$ instead of taking the limit.
    verification:
      method: direct-limit-evaluation
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-007
    topicId: sequences-series
    skills:
      - recover-terms-from-partial-sums
    archetype: partial-sum-difference
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires using $a_n=S_n-S_{n-1}$ and simplifying the result.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      For $n\ge2$, a series has $S_n=n/(n+1)$. Which expression is its $n$th term?
    choices:
      - id: a
        text: '$1/(n+1)$'
      - id: b
        text: '$1/[n(n+1)]$'
      - id: c
        text: '$n/(n+1)$'
      - id: d
        text: '$-1/[n(n+1)]$'
    answer:
      choiceId: b
    solutionOutline: Compute $S_n-S_{n-1}=n/(n+1)-(n-1)/n=1/[n(n+1)]$.
    commonTrap: Reporting the partial sum itself as the individual term.
    verification:
      method: algebraic-difference-check
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-008
    topicId: sequences-series
    skills:
      - distinguish-bounded-terms-from-bounded-partial-sums
    archetype: counterexample-selection
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires choosing a counterexample that separates two different boundedness claims.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      Which example disproves the claim “if $(a_n)$ is bounded, then
      $\sum a_n$ converges”?
    choices:
      - id: a
        text: '$a_n=2^{-n}$'
      - id: b
        text: '$a_n=1$'
      - id: c
        text: '$a_n=0$'
      - id: d
        text: '$a_n=(-1)^n/n$'
    answer:
      choiceId: b
    solutionOutline: The constant terms are bounded, but their partial sums are $S_N=N$, which grow without bound.
    commonTrap: Selecting any bounded sequence without verifying that its associated series actually diverges.
    verification:
      method: explicit-partial-sum-counterexample
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-009
    topicId: sequences-series
    skills:
      - understand-finite-term-changes
    archetype: tail-property
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires separating convergence behavior from the numerical value of a sum.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      A convergent series is changed only in its first four terms. What is guaranteed?
    choices:
      - id: a
        text: The modified series converges, though its sum may change.
      - id: b
        text: The modified series has exactly the same sum.
      - id: c
        text: The modified series must diverge.
      - id: d
        text: Its terms no longer approach zero.
    answer:
      choiceId: a
    solutionOutline: Adding or subtracting a finite constant from every later partial sum preserves existence of a finite limit but shifts that limit.
    commonTrap: Confusing invariance of convergence with invariance of the sum.
    verification:
      method: partial-sum-tail-argument
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-010
    topicId: sequences-series
    skills:
      - interpret-remainders
    archetype: truncation-error
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires translating the definition $R_N=S-S_N$ into a numerical error.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      A convergent series has sum $S=5/3$ and $S_6=13/8$. What is the signed
      remainder $R_6=S-S_6$?
    choices:
      - id: a
        text: '$1/24$'
      - id: b
        text: '$-1/24$'
      - id: c
        text: '$79/24$'
      - id: d
        text: '$5/24$'
    answer:
      choiceId: a
    solutionOutline: 'Use a common denominator: $5/3-13/8=40/24-39/24=1/24$.'
    commonTrap: Reversing the subtraction and reporting $S_N-S$.
    verification:
      method: exact-rational-arithmetic
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-011
    topicId: sequences-series
    skills:
      - analyze-positive-term-partial-sums
    archetype: monotone-partial-sums
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires connecting positivity to monotonicity and boundedness to convergence.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      Assume $a_n\ge0$ for all $n$. Which additional fact is sufficient to prove
      $\sum a_n$ converges?
    choices:
      - id: a
        text: The partial sums are bounded above.
      - id: b
        text: The terms are bounded above.
      - id: c
        text: The first partial sum is positive.
      - id: d
        text: The terms are nonincreasing.
    answer:
      choiceId: a
    solutionOutline: Positivity makes $S_N$ nondecreasing; an upper bound then invokes the monotone convergence theorem for the partial-sum sequence.
    commonTrap: Applying monotone convergence to the term sequence rather than to the partial sums.
    verification:
      method: monotone-convergence-theorem
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-012
    topicId: sequences-series
    skills:
      - diagnose-divergent-partial-sums
    archetype: oscillating-partial-sums
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires deciding convergence from two alternating partial-sum values.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      If $S_{2k}=0$ and $S_{2k+1}=1$ for every $k\ge1$, how does the series behave?
    choices:
      - id: a
        text: It converges to $1/2$.
      - id: b
        text: It converges to $0$.
      - id: c
        text: It diverges because its partial sums have two subsequential limits.
      - id: d
        text: It converges absolutely.
    answer:
      choiceId: c
    solutionOutline: The even partial sums stay at $0$ while the odd partial sums stay at $1$, so $(S_N)$ has no single limit.
    commonTrap: Averaging the two oscillating values even though the definition requires an actual limit.
    verification:
      method: subsequence-limit-criterion
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-013
    topicId: sequences-series
    skills:
      - recognize-geometric-series
    archetype: model-recognition
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying a constant ratio and checking its magnitude.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      Which series is geometric and convergent?
    choices:
      - id: a
        text: '$\sum_{n=0}^{\infty}3(2/5)^n$'
      - id: b
        text: '$\sum_{n=1}^{\infty}1/n$'
      - id: c
        text: '$\sum_{n=1}^{\infty}n/2$'
      - id: d
        text: '$\sum_{n=0}^{\infty}4(3/2)^n$'
    answer:
      choiceId: a
    solutionOutline: The first choice has constant ratio $2/5$ with magnitude below one; the fourth is geometric but has ratio magnitude above one.
    commonTrap: Calling every expression containing an exponent geometric without checking that the ratio has magnitude below one.
    verification:
      method: consecutive-ratio-check
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-014
    topicId: sequences-series
    skills:
      - evaluate-geometric-series
    archetype: exact-sum
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires extracting the actual first term from a shifted exponent.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{n=2}^{\infty}6(1/3)^n$.
    choices:
      - id: a
        text: '$1$'
      - id: b
        text: '$2$'
      - id: c
        text: '$3$'
      - id: d
        text: '$9$'
    answer:
      choiceId: a
    solutionOutline: The first included term is $6/9=2/3$ and the ratio is $1/3$, so the sum is $(2/3)/(1-1/3)=1$.
    commonTrap: Using $6$ as the first term despite the starting index $n=2$.
    verification:
      method: geometric-sum-and-partial-sum-check
      result: verified
    reviewStatus: verified

  - id: calc2-ss-overview-015
    topicId: sequences-series
    skills:
      - combine-term-and-partial-sum-reasoning
    archetype: implication-selection
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires selecting the only implication supported by the definitions and a standard theorem.
    assessmentUses:
      - easy-quiz
    questionType: multipleChoice
    prompt: |
      Which statement is true for every real series $\sum a_n$?
    choices:
      - id: a
        text: If $(a_n)$ is bounded, then the series converges.
      - id: b
        text: If the partial sums converge, then $a_n\to0$.
      - id: c
        text: If $a_n\to0$, then the partial sums are bounded.
      - id: d
        text: If the partial sums are bounded, then they converge.
    answer:
      choiceId: b
    solutionOutline: From $a_n=S_n-S_{n-1}$, convergence of both adjacent partial sums to the same limit forces $a_n\to0$.
    commonTrap: Assuming bounded partial sums converge without monotonicity or another convergence argument.
    verification:
      method: partial-sum-difference-proof
      result: verified
    reviewStatus: verified
