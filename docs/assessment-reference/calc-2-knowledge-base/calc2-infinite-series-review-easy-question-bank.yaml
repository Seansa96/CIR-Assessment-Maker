schemaVersion: 1
bankId: calc2-infinite-series-review-easy
categoryId: calculus-2
topicIds: [infinite-series-review]
minimumItemCount: 15
items:
  - id: calc2-review-easy-001
    topicId: infinite-series-review
    skills: [connect-series-and-partial-sums]
    archetype: partial-sum-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires translating convergence into a statement about partial sums.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $S_N=\sum_{n=1}^{N}a_n$ and $\lim_{N\to\infty}S_N=7$, what is $\sum_{n=1}^{\infty}a_n$?
    choices: [{id: a, text: '$7$'}, {id: b, text: '$0$'}, {id: c, text: '$a_7$'}, {id: d, text: 'The series diverges.'}]
    answer: {choiceId: a}
    solutionOutline: An infinite series is defined as the limit of its partial sums, so its sum is seven.
    commonTrap: Confusing the term limit with the partial-sum limit.
    verification: {method: definition-of-series, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-002
    topicId: infinite-series-review
    skills: [apply-the-divergence-test]
    archetype: preliminary-check
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires checking the necessary condition before other tests.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What conclusion follows immediately for $\sum_{n=1}^{\infty}\frac{3n+1}{n+4}$?
    choices: [{id: a, text: 'It diverges because the terms approach $3$.'}, {id: b, text: 'It converges by comparison.'}, {id: c, text: 'It converges to $3$.'}, {id: d, text: 'The term test proves convergence.'}]
    answer: {choiceId: a}
    solutionOutline: The summand tends to three rather than zero, so the necessary condition for convergence fails.
    commonTrap: Treating a finite term limit as the value of the series.
    verification: {method: limit-and-term-test, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-003
    topicId: infinite-series-review
    skills: [sum-a-geometric-series]
    archetype: geometric-sum
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying the first term and common ratio.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{n=0}^{\infty}5(1/3)^n$.
    choices: [{id: a, text: '$15/2$'}, {id: b, text: '$5/2$'}, {id: c, text: '$15$'}, {id: d, text: 'Diverges'}]
    answer: {choiceId: a}
    solutionOutline: The ratio has magnitude below one, and $5/(1-1/3)=15/2$.
    commonTrap: Multiplying by one minus the ratio instead of dividing.
    verification: {method: geometric-sum-formula, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-004
    topicId: infinite-series-review
    skills: [recognize-telescoping-series]
    archetype: cancellation
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires forming a partial sum and observing cancellation.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is $\sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+1}\right)$?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$0$'}, {id: c, text: '$1/2$'}, {id: d, text: 'Diverges'}]
    answer: {choiceId: a}
    solutionOutline: The partial sum is $1-1/(N+1)$, whose limit is one.
    commonTrap: Cancelling every term and overlooking the first surviving term.
    verification: {method: partial-sum-telescoping, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-005
    topicId: infinite-series-review
    skills: [select-a-benchmark-series]
    archetype: p-series-classification
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires applying the strict p-series threshold.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which series converges?
    choices: [{id: a, text: '$\sum 1/n^{3/2}$'}, {id: b, text: '$\sum 1/n$'}, {id: c, text: '$\sum 1/\sqrt n$'}, {id: d, text: '$\sum 1$'}]
    answer: {choiceId: a}
    solutionOutline: A p-series converges exactly when its exponent is greater than one.
    commonTrap: Assuming every positive exponent gives convergence.
    verification: {method: p-series-test, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-006
    topicId: infinite-series-review
    skills: [use-direct-comparison]
    archetype: comparison-direction
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires choosing a larger convergent benchmark.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Since $0\le\frac1{n^2+4}\le\frac1{n^2}$, what follows?
    choices: [{id: a, text: '$\sum1/(n^2+4)$ converges.'}, {id: b, text: '$\sum1/(n^2+4)$ diverges.'}, {id: c, text: 'Both sums are equal.'}, {id: d, text: 'No conclusion is possible.'}]
    answer: {choiceId: a}
    solutionOutline: A nonnegative series bounded above by the convergent p-series with exponent two converges.
    commonTrap: Reversing the direction needed for a convergence comparison.
    verification: {method: direct-comparison-test, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-007
    topicId: infinite-series-review
    skills: [apply-limit-comparison]
    archetype: rational-asymptotic
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires identifying the dominant-power benchmark.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which benchmark is most natural for $\sum\frac{4n+1}{n^3+2}$?
    choices: [{id: a, text: '$\sum1/n^2$'}, {id: b, text: '$\sum1/n$'}, {id: c, text: '$\sum n^2$'}, {id: d, text: '$\sum(1/2)^n$'}]
    answer: {choiceId: a}
    solutionOutline: The quotient of leading powers behaves like $4/n^2$, so limit comparison with $1/n^2$ is decisive.
    commonTrap: Comparing only the denominator degree with the harmonic series.
    verification: {method: dominant-power-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-008
    topicId: infinite-series-review
    skills: [apply-the-alternating-series-test]
    archetype: alternating-hypotheses
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires checking decrease and a zero limit.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Why does $\sum_{n=1}^{\infty}(-1)^{n-1}/n$ converge?
    choices: [{id: a, text: '$1/n$ decreases to $0$.'}, {id: b, text: '$\sum1/n$ converges.'}, {id: c, text: 'Its ratio has limit below $1$.'}, {id: d, text: 'Alternating signs alone suffice.'}]
    answer: {choiceId: a}
    solutionOutline: The magnitudes decrease monotonically to zero, which supplies both alternating-series hypotheses.
    commonTrap: Believing sign alternation alone guarantees convergence.
    verification: {method: alternating-series-test, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-009
    topicId: infinite-series-review
    skills: [classify-absolute-and-conditional-convergence]
    archetype: convergence-classification
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires checking both the signed and absolute series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      How is $\sum_{n=1}^{\infty}(-1)^{n}/n$ classified?
    choices: [{id: a, text: 'Conditionally convergent'}, {id: b, text: 'Absolutely convergent'}, {id: c, text: 'Divergent'}, {id: d, text: 'Geometric'}]
    answer: {choiceId: a}
    solutionOutline: The alternating harmonic series converges, while its absolute-value series is harmonic and diverges.
    commonTrap: Calling every convergent alternating series absolutely convergent.
    verification: {method: signed-and-absolute-tests, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-010
    topicId: infinite-series-review
    skills: [select-the-ratio-test]
    archetype: factorial-series
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing factorial cancellation as the useful structure.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which test is usually most efficient for $\sum_{n=1}^{\infty}\frac{3^n}{n!}$?
    choices: [{id: a, text: 'Ratio test'}, {id: b, text: 'Integral test'}, {id: c, text: 'Alternating-series test'}, {id: d, text: 'Telescoping test'}]
    answer: {choiceId: a}
    solutionOutline: Consecutive-term division cancels the factorial and gives ratio $3/(n+1)\to0$.
    commonTrap: Choosing a test by habit without using the factorial structure.
    verification: {method: ratio-test, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-011
    topicId: infinite-series-review
    skills: [interpret-an-inconclusive-test]
    archetype: ratio-boundary
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires knowing what the ratio-test boundary does and does not prove.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\lim|a_{n+1}/a_n|=1$, what does the ratio test conclude?
    choices: [{id: a, text: 'Nothing; another argument is needed.'}, {id: b, text: 'Absolute convergence'}, {id: c, text: 'Conditional convergence'}, {id: d, text: 'Divergence'}]
    answer: {choiceId: a}
    solutionOutline: The ratio test is inconclusive at its boundary value one.
    commonTrap: Treating the boundary as part of either decisive inequality.
    verification: {method: ratio-test-thresholds, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-012
    topicId: infinite-series-review
    skills: [estimate-alternating-remainders]
    archetype: error-bound
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires applying the first-omitted-term error bound.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For an alternating series with decreasing magnitudes, what bounds $|S-S_N|$?
    choices: [{id: a, text: '$b_{N+1}$'}, {id: b, text: '$b_N+b_{N+1}$'}, {id: c, text: '$1/N$ for every series'}, {id: d, text: '$|S_N|$'}]
    answer: {choiceId: a}
    solutionOutline: The alternating-series estimation theorem bounds the remainder by the first omitted magnitude.
    commonTrap: Using the last included term instead of the first omitted term.
    verification: {method: alternating-remainder-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-013
    topicId: infinite-series-review
    skills: [find-a-power-series-radius]
    archetype: center-and-radius
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires reading a geometric power series in shifted form.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of convergence of $\sum_{n=0}^{\infty}((x-2)/4)^n$?
    choices: [{id: a, text: '$4$'}, {id: b, text: '$2$'}, {id: c, text: '$1/4$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Geometric convergence requires $|(x-2)/4|<1$, equivalently $|x-2|<4$.
    commonTrap: Reporting the reciprocal coefficient as the radius.
    verification: {method: geometric-convergence-condition, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-014
    topicId: infinite-series-review
    skills: [test-power-series-endpoints]
    archetype: endpoint-procedure
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires distinguishing radius work from endpoint work.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      After finding $|x-c|<R$ for a power series, how should the interval of convergence be completed?
    choices: [{id: a, text: 'Substitute and test each endpoint separately.'}, {id: b, text: 'Always include both endpoints.'}, {id: c, text: 'Always exclude both endpoints.'}, {id: d, text: 'Differentiate the original function.'}]
    answer: {choiceId: a}
    solutionOutline: Ratio or root tests usually leave equality unresolved, so each endpoint becomes its own numerical series.
    commonTrap: Assuming endpoints inherit the open-interval result.
    verification: {method: endpoint-analysis, result: verified}
    reviewStatus: verified
  - id: calc2-review-easy-015
    topicId: infinite-series-review
    skills: [use-taylor-polynomials]
    archetype: maclaurin-coefficient
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires matching derivatives to the factorial coefficient formula.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the quadratic Maclaurin polynomial for $e^x$?
    choices: [{id: a, text: '$1+x+x^2/2$'}, {id: b, text: '$x+x^2$'}, {id: c, text: '$1+x^2/2$'}, {id: d, text: '$1+x+x^2$'}]
    answer: {choiceId: a}
    solutionOutline: Every derivative of $e^x$ equals one at zero, giving coefficients $1/k!$.
    commonTrap: Omitting factorials from Taylor coefficients.
    verification: {method: maclaurin-formula, result: verified}
    reviewStatus: verified
