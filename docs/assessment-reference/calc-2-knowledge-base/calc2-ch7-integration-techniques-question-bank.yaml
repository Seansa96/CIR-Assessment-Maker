items:
- id: ch7-stewart-001
  concept: Techniques of Integration
  difficulty: 3
  source: Stewart Calculus Chapter 7 Inspired
  prompt: 'Evaluate the integral: \(\int x \sin{\left(x \right)} \, dx\)'
  answer: '- x \cos{\left(x \right)} + \sin{\left(x \right)} + C'
  solutionOutline: Use integration by parts with u = 1x and dv = \sin{\left(x \right)}
    dx.
- id: ch7-stewart-002
  concept: Techniques of Integration
  difficulty: 3
  source: Stewart Calculus Chapter 7 Inspired
  prompt: 'Evaluate the integral: \(\int \frac{3 x + 1}{\left(x - 1\right) \left(x
    + 4\right)} \, dx\)'
  answer: \frac{4 \log{\left(x - 1 \right)}}{5} + \frac{11 \log{\left(x + 4 \right)}}{5}
    + C
  solutionOutline: Use partial fraction decomposition.
- id: ch7-stewart-003
  concept: Techniques of Integration
  difficulty: 3
  source: Stewart Calculus Chapter 7 Inspired
  prompt: 'Evaluate the integral: \(\int \frac{2 x + 3}{\left(x - 1\right) \left(x
    + 4\right)} \, dx\)'
  answer: \log{\left(x^{2} + 3 x - 4 \right)} + C
  solutionOutline: Use partial fraction decomposition.
- id: ch7-stewart-004
  concept: Techniques of Integration
  difficulty: 2
  source: Stewart Calculus Chapter 7 Inspired
  prompt: 'Evaluate the integral: \(\int 4 x e^{3 x} \, dx\)'
  answer: \frac{\left(12 x - 4\right) e^{3 x}}{9} + C
  solutionOutline: Use integration by parts with u = 4x and dv = e^{3 x} dx.
- id: ch7-stewart-005
  concept: Techniques of Integration
  difficulty: 3
  source: Stewart Calculus Chapter 7 Inspired
  prompt: 'Evaluate the integral: \(\int \frac{3 x + 1}{\left(x - 1\right) \left(x
    + 2\right)} \, dx\)'
  answer: \frac{4 \log{\left(x - 1 \right)}}{3} + \frac{5 \log{\left(x + 2 \right)}}{3}
    + C
  solutionOutline: Use partial fraction decomposition.
- id: ch7-stewart-006
  concept: Techniques of Integration
  difficulty: 4
  source: Stewart Calculus Chapter 7 Inspired
  prompt: 'Evaluate the integral: \(\int \frac{1}{x^{2} \sqrt{9 - x^{2}}} \, dx\)'
  answer: '\begin{cases} - \frac{i \sqrt{x^{2} - 9}}{9 x} & \text{for}\: \left|{x^{2}}\right|
    > 9 \\- \frac{\sqrt{9 - x^{2}}}{9 x} & \text{otherwise} \end{cases} + C'
  solutionOutline: Use trigonometric substitution x = 3\sin\theta.
- id: ch7-stewart-007
  concept: Techniques of Integration
  difficulty: 2
  source: Stewart Calculus Chapter 7 Inspired
  prompt: 'Evaluate the integral: \(\int 4 x e^{2 x} \, dx\)'
  answer: \left(2 x - 1\right) e^{2 x} + C
  solutionOutline: Use integration by parts with u = 4x and dv = e^{2 x} dx.
