schemaVersion: 1
bankId: calc2-power-series-olympiad
categoryId: calculus-2
topicIds: [power-series]
minimumItemCount: 30
items:
  - id: calc2-power-oly-001
    topicId: power-series
    skills: [find-radii-from-complex-singularities]
    archetype: quadratic-unit-circle-roots
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires locating nonreal singularities and measuring their distance from the center.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of the Maclaurin series of $1/(1+x+x^2)$?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$\infty$'}, {id: c, text: '$1/2$'}, {id: d, text: '$\sqrt3$'}]
    answer: {choiceId: a}
    solutionOutline: The denominator roots are $e^{\pm2\pi i/3}$, both one unit from zero.
    commonTrap: Looking only for real denominator zeros and concluding the radius is infinite.
    verification: {method: complex-root-distance, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-002
    topicId: power-series
    skills: [find-shifted-taylor-radii]
    archetype: off-center-complex-poles
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires measuring complex distance from a nonzero real center.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Find the radius of the Taylor series of $1/(1+x^2)$ centered at
      $x=2$.
    choices: [{id: a, text: '$\sqrt5$'}, {id: b, text: '$1$'}, {id: c, text: '$2$'}, {id: d, text: '$3$'}]
    answer: {choiceId: a}
    solutionOutline: The poles are at plus or minus i, each at distance $\sqrt{(2-0)^2+1^2}=\sqrt5$ from the center.
    commonTrap: Using the distance from zero rather than from the stated center.
    verification: {method: shifted-complex-pole-distance, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-003
    topicId: power-series
    skills: [derive-rational-function-coefficients]
    archetype: even-power-filter
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires factoring or substituting into a geometric series.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^n$ in $1/(1-x^2)$?
    choices: [{id: a, text: '$1$ when n is even and $0$ when n is odd'}, {id: b, text: '$1$ for every n'}, {id: c, text: '$(-1)^n$'}, {id: d, text: '$n+1$'}]
    answer: {choiceId: a}
    solutionOutline: The expansion is $\sum_{k=0}^{\infty}x^{2k}$ inside the unit disk.
    commonTrap: Treating x squared as x in the geometric expansion.
    verification: {method: geometric-quadratic-substitution, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-004
    topicId: power-series
    skills: [derive-fibonacci-generating-functions]
    archetype: recurrence-to-rational-function
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires converting a recurrence to a generating-function equation and reading its nearest pole.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $F_0=0$, $F_1=1$, $F_{n+1}=F_n+F_{n-1}$, what is the generating
      function $\sum_{n=0}^{\infty}F_nx^n$?
    choices: [{id: a, text: '$x/(1-x-x^2)$'}, {id: b, text: '$1/(1-x)^2$'}, {id: c, text: '$x/(1+x^2)$'}, {id: d, text: '$1/(1-x-x^2)$'}]
    answer: {choiceId: a}
    solutionOutline: Multiplying the recurrence by powers of x and shifting indices gives $G-x=xG+x^2G$.
    commonTrap: Losing the initial x term generated by F one.
    verification: {method: recurrence-generating-function-derivation, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-005
    topicId: power-series
    skills: [identify-generating-function-radii]
    archetype: fibonacci-dominant-pole
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires locating the smaller-magnitude root of a quadratic denominator.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of the Fibonacci generating function
      $x/(1-x-x^2)$?
    choices: [{id: a, text: '$1/\varphi$'}, {id: b, text: '$\varphi$'}, {id: c, text: '$1$'}, {id: d, text: '$1/2$'}]
    answer: {choiceId: a}
    solutionOutline: The closest denominator zero is $(\sqrt5-1)/2=1/\varphi$.
    commonTrap: Choosing the dominant coefficient-growth factor phi rather than its reciprocal radius.
    verification: {method: quadratic-pole-radius, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-006
    topicId: power-series
    skills: [use-catalan-generating-functions]
    archetype: algebraic-generating-function
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires identifying the branch singularity of an algebraic generating function.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      The Catalan generating function is
      $C(x)=[1-\sqrt{1-4x}]/(2x)$. What is its radius?
    choices: [{id: a, text: '$1/4$'}, {id: b, text: '$4$'}, {id: c, text: '$1/2$'}, {id: d, text: '$1$'}]
    answer: {choiceId: a}
    solutionOutline: The nearest nonremovable singularity is the square-root branch point where $1-4x=0$.
    commonTrap: Treating the removable-looking x in the denominator at zero as the radius-limiting singularity.
    verification: {method: algebraic-branch-point-distance, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-007
    topicId: power-series
    skills: [apply-generalized-binomial-series]
    archetype: noninteger-binomial-coefficients
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires using falling-factorial coefficients for a noninteger exponent.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^3$ in $(1+x)^{1/2}$?
    choices: [{id: a, text: '$1/16$'}, {id: b, text: '$-1/16$'}, {id: c, text: '$1/8$'}, {id: d, text: '$-1/8$'}]
    answer: {choiceId: a}
    solutionOutline: $\binom{1/2}{3}=(1/2)(-1/2)(-3/2)/6=1/16$.
    commonTrap: Assuming coefficients must alternate strictly after the linear term.
    verification: {method: generalized-binomial-coefficient, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-008
    topicId: power-series
    skills: [compose-entire-series]
    archetype: exponential-even-powers
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires composing a known series and tracking factorial coefficients.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Which series represents $e^{x^2}$?
    choices: [{id: a, text: '$\sum_{n=0}^{\infty}x^{2n}/n!$'}, {id: b, text: '$\sum x^n/(2n)!$'}, {id: c, text: '$\sum x^{2n}/(2n)!$'}, {id: d, text: '$\sum x^{n+2}/n!$'}]
    answer: {choiceId: a}
    solutionOutline: Substitute x squared for the input in the exponential series.
    commonTrap: Replacing n factorial by two-n factorial during composition.
    verification: {method: entire-series-composition, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-009
    topicId: power-series
    skills: [derive-ode-power-series-solutions]
    archetype: harmonic-oscillator-recurrence
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires aligning a second derivative with the original coefficient sequence.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      If $y=\sum c_nx^n$ solves $y''+y=0$, which recurrence holds?
    choices: [{id: a, text: '$c_{n+2}=-c_n/[(n+2)(n+1)]$'}, {id: b, text: '$c_{n+1}=-c_n$'}, {id: c, text: '$c_{n+2}=c_n$'}, {id: d, text: '$c_{n+2}=-(n+2)(n+1)c_n$'}]
    answer: {choiceId: a}
    solutionOutline: Matching x-to-the-n coefficients gives $(n+2)(n+1)c_{n+2}+c_n=0$.
    commonTrap: Moving the derivative multiplier to the wrong side as a product.
    verification: {method: second-order-ode-coefficient-match, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-010
    topicId: power-series
    skills: [identify-ordinary-and-singular-points]
    archetype: power-series-ode-center
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires checking whether the leading ODE coefficient vanishes at the center.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $x^2y''+xy'+y=0$, why is an ordinary power-series recurrence
      centered at zero potentially singular?
    choices: [{id: a, text: 'The coefficient of the highest derivative vanishes at zero.'}, {id: b, text: 'Power series cannot solve second-order equations.'}, {id: c, text: 'The coefficient y is nonzero.'}, {id: d, text: 'Zero is outside the real line.'}]
    answer: {choiceId: a}
    solutionOutline: Dividing into standard form introduces coefficients with poles at zero, marking a singular point.
    commonTrap: Looking only at the lower-order coefficients.
    verification: {method: ode-leading-coefficient-check, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-011
    topicId: power-series
    skills: [analyze-lacunary-series-radii]
    archetype: factorial-exponent-support
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires applying root-growth reasoning to a sparse coefficient sequence.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      What is the radius of $\sum_{n=1}^{\infty}x^{n!}$?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$\infty$'}, {id: c, text: '$0$'}, {id: d, text: '$e$'}]
    answer: {choiceId: a}
    solutionOutline: The series converges absolutely for $|x|<1$, while for $|x|>1$ its terms fail to approach zero; the sparse support does not change the boundary radius.
    commonTrap: Assuming rapidly growing exponents imply convergence for every x.
    verification: {method: inside-outside-unit-disk-term-check, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-012
    topicId: power-series
    skills: [distinguish-series-from-analytic-continuation]
    archetype: geometric-continuation-outside-disk
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires separating a function formula from convergence of its defining series.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Although $1/(1-x)$ is defined at $x=2$, what happens to its Maclaurin
      series $\sum x^n$ there?
    choices: [{id: a, text: 'It diverges.'}, {id: b, text: 'It converges to $-1$.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'It terminates.'}]
    answer: {choiceId: a}
    solutionOutline: Analytic continuation of the rational function does not extend the convergence disk of this particular series.
    commonTrap: Substituting into the closed form outside the series radius.
    verification: {method: representation-versus-continuation, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-013
    topicId: power-series
    skills: [bound-radii-of-hadamard-products]
    archetype: coefficientwise-product
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires combining limsup coefficient-growth bounds.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      Power series $\sum a_nx^n$ and $\sum b_nx^n$ have radii R and S.
      What radius is guaranteed for $\sum a_nb_nx^n$?
    choices: [{id: a, text: 'At least $RS$'}, {id: b, text: 'Exactly $R+S$'}, {id: c, text: 'At most $\min(R,S)$'}, {id: d, text: 'Always zero'}]
    answer: {choiceId: a}
    solutionOutline: The limsup nth-root growth of products is at most the product of the two limsups, giving reciprocal radius at most $1/(RS)$.
    commonTrap: Confusing coefficientwise multiplication with the Cauchy product.
    verification: {method: limsup-hadamard-product-bound, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-014
    topicId: power-series
    skills: [derive-second-moment-generating-series]
    archetype: squared-index-geometric-sum
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires differentiating a weighted geometric identity.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      For $|x|<1$, what is $\sum_{n=1}^{\infty}n^2x^n$?
    choices: [{id: a, text: '$x(1+x)/(1-x)^3$'}, {id: b, text: '$x/(1-x)^2$'}, {id: c, text: '$1/(1-x)^3$'}, {id: d, text: '$x^2/(1-x)$'}]
    answer: {choiceId: a}
    solutionOutline: Apply x times the derivative operator to $\sum nx^n=x/(1-x)^2$.
    commonTrap: Stopping at the first-moment formula.
    verification: {method: repeated-euler-operator, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-015
    topicId: power-series
    skills: [analyze-generalized-binomial-endpoints]
    archetype: square-root-binomial-boundary
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires separating the open radius from endpoint convergence of a noninteger binomial series.
    assessmentUses: [olympiad-quiz]
    questionType: multipleChoice
    prompt: |
      The binomial series for $(1+x)^{1/2}$ has radius one. At $x=1$, how
      does its coefficient series behave?
    choices: [{id: a, text: 'It converges absolutely.'}, {id: b, text: 'It diverges by the term test.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'It is geometric.'}]
    answer: {choiceId: a}
    solutionOutline: The generalized binomial coefficients have magnitude of order $n^{-3/2}$, so their absolute sum converges.
    commonTrap: Assuming every radius endpoint is at best conditional.
    verification: {method: binomial-coefficient-asymptotic, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-016
    topicId: power-series
    skills: [find-radii-from-nearest-singularities]
    archetype: logarithm-shifted-center
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires locating the logarithm's singularity relative to a shifted center.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the radius of the Taylor series for $\log x$ centered at
      $x=1$?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$2$'}, {id: c, text: '$\infty$'}, {id: d, text: '$1/2$'}]
    answer: {choiceId: a}
    solutionOutline: The nearest obstruction to analyticity is at $x=0$, one unit from the center.
    commonTrap: Treating the function's domain on the positive real axis as an infinite convergence interval.
    verification: {method: nearest-logarithmic-singularity, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-017
    topicId: power-series
    skills: [extract-rational-function-coefficients]
    archetype: negative-binomial-coefficients
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing the general coefficient pattern for an integer negative power.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For a positive integer $m$, what is the coefficient of $x^n$ in
      $(1-x)^{-m}$?
    choices: [{id: a, text: '$\binom{n+m-1}{m-1}$'}, {id: b, text: '$\binom{m}{n}$'}, {id: c, text: '$m^n$'}, {id: d, text: '$(-1)^n\binom{m}{n}$'}]
    answer: {choiceId: a}
    solutionOutline: The negative-binomial expansion counts weak compositions of n into m parts, producing the stated binomial coefficient.
    commonTrap: Applying the finite binomial theorem as though the exponent were positive.
    verification: {method: negative-binomial-expansion, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-018
    topicId: power-series
    skills: [use-cauchy-products]
    archetype: exponential-inverse-product
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires translating a product identity into a coefficient convolution.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For every integer $n\ge 1$, what is
      $\displaystyle\sum_{k=0}^{n}\frac{(-1)^k}{k!(n-k)!}$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1$'}, {id: c, text: '$1/n!$'}, {id: d, text: '$(-1)^n/n!$'}]
    answer: {choiceId: a}
    solutionOutline: This is the coefficient of $x^n$ in $e^{-x}e^x=1$, whose positive-degree coefficients vanish.
    commonTrap: Multiplying matching coefficients instead of forming the Cauchy convolution.
    verification: {method: exponential-cauchy-product, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-019
    topicId: power-series
    skills: [classify-power-series-endpoints]
    archetype: arctangent-boundary
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires testing absolute and alternating convergence separately at a boundary point.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      At $x=1$, how does
      $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{2n+1}$
      converge?
    choices: [{id: a, text: 'Conditionally'}, {id: b, text: 'Absolutely'}, {id: c, text: 'It diverges by the term test'}, {id: d, text: 'It terminates'}]
    answer: {choiceId: a}
    solutionOutline: The alternating odd-harmonic series converges, but its absolute-value series diverges by comparison with the harmonic series.
    commonTrap: Inferring absolute convergence from convergence at a radius endpoint.
    verification: {method: alternating-versus-absolute-endpoint-test, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-020
    topicId: power-series
    skills: [differentiate-power-series-identities]
    archetype: logarithmic-series-derivative
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires differentiating termwise and recognizing the resulting geometric series.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Inside $|x|<1$, what is the derivative of
      $\displaystyle\sum_{n=1}^{\infty}\frac{x^n}{n}$?
    choices: [{id: a, text: '$1/(1-x)$'}, {id: b, text: '$1/(1+x)$'}, {id: c, text: '$-\log(1-x)$'}, {id: d, text: '$x/(1-x)^2$'}]
    answer: {choiceId: a}
    solutionOutline: Termwise differentiation gives $\sum_{n=1}^{\infty}x^{n-1}=\sum_{j=0}^{\infty}x^j$.
    commonTrap: Returning the original closed form instead of its derivative.
    verification: {method: termwise-derivative-and-geometric-sum, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-021
    topicId: power-series
    skills: [solve-initial-value-problems-by-series]
    archetype: gaussian-exponential-ode
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires solving a coefficient recurrence or identifying and expanding the exact solution.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      The solution of $y'=xy$ with $y(0)=1$ has a Maclaurin series. What
      is the coefficient of $x^6$?
    choices: [{id: a, text: '$1/48$'}, {id: b, text: '$1/6$'}, {id: c, text: '$1/720$'}, {id: d, text: '$1/24$'}]
    answer: {choiceId: a}
    solutionOutline: The solution is $e^{x^2/2}=\sum_{k\ge0}x^{2k}/(2^k k!)$; set $2k=6$.
    commonTrap: Substituting x squared into the exponential series without retaining the factor one-half.
    verification: {method: ivp-solution-series-coefficient, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-022
    topicId: power-series
    skills: [apply-cauchy-hadamard-formula]
    archetype: factorial-coefficient-growth
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires recognizing superexponential coefficient growth.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the radius of convergence of
      $\displaystyle\sum_{n=0}^{\infty} n!x^n$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1$'}, {id: c, text: '$e^{-1}$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: For every nonzero x, the ratio of successive term magnitudes is $(n+1)|x|$, which eventually exceeds one without bound.
    commonTrap: Associating factorials automatically with rapid decay, despite the factorial appearing in the numerator.
    verification: {method: factorial-ratio-radius, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-023
    topicId: power-series
    skills: [recognize-entire-series]
    archetype: reciprocal-factorial-growth
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires contrasting reciprocal-factorial coefficients with geometric growth.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      Which statement about $\displaystyle\sum_{n=0}^{\infty}x^n/n!$
      is correct?
    choices: [{id: a, text: 'It converges for every real and complex x.'}, {id: b, text: 'It converges only when $|x|<1$.'}, {id: c, text: 'It converges conditionally at $x=-1$.'}, {id: d, text: 'Its radius is zero.'}]
    answer: {choiceId: a}
    solutionOutline: The successive-term ratio has magnitude $|x|/(n+1)$, which tends to zero for every fixed x.
    commonTrap: Assuming all familiar Maclaurin series inherit the geometric series radius.
    verification: {method: reciprocal-factorial-ratio-test, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-024
    topicId: power-series
    skills: [derive-weighted-geometric-series]
    archetype: differentiated-geometric-coefficients
    difficulty: olympiad
    reasoningDepth: 4
    difficultyEvidence: Requires matching an indexed coefficient pattern to a differentiated geometric series.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      For $|x|<1$, which power series equals $1/(1-x)^2$?
    choices: [{id: a, text: '$\sum_{n=0}^{\infty}(n+1)x^n$'}, {id: b, text: '$\sum_{n=1}^{\infty}x^n/n$'}, {id: c, text: '$\sum_{n=0}^{\infty}x^{2n}$'}, {id: d, text: '$\sum_{n=0}^{\infty}n!x^n$'}]
    answer: {choiceId: a}
    solutionOutline: Differentiate $\sum_{n\ge0}x^n=1/(1-x)$ and shift the index so the exponent begins at zero.
    commonTrap: Keeping coefficient n while also starting the index at zero.
    verification: {method: differentiated-geometric-index-shift, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-025
    topicId: power-series
    skills: [analyze-removable-singularities]
    archetype: canceled-rational-factor
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires simplifying a removable factor before locating the nearest genuine singularity.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      After defining its removable value at $x=1$, what is the radius of
      the Maclaurin series of $(1-x)/(1-x^2)$?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$0$'}, {id: c, text: '$2$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Cancellation gives $1/(1+x)$ away from the removable point, and its genuine pole at $x=-1$ is one unit from zero.
    commonTrap: Treating the canceled zero at x equals one as a remaining singularity or overlooking the pole at minus one.
    verification: {method: rational-cancellation-then-pole-distance, result: verified}
    reviewStatus: verified
  - id: calc2-power-oly-026
    topicId: power-series
    skills: [determine-shifted-series-intervals]
    archetype: logarithm-endpoint-asymmetry
    difficulty: olympiad
    reasoningDepth: 5
    difficultyEvidence: Requires converting a centered series to endpoint tests with different outcomes.
    assessmentUses: [olympiad-test]
    questionType: multipleChoice
    prompt: |
      What is the interval of convergence of
      $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n+1}(x-1)^n}{n}$?
    choices: [{id: a, text: '$(0,2]$'}, {id: b, text: '$[0,2)$'}, {id: c, text: '$(0,2)$'}, {id: d, text: '$[0,2]$'}]
    answer: {choiceId: a}
