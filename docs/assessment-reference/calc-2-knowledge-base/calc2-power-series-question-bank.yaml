metadata:
  title: Calc2 Power Series Question Bank
  description: Extracted questions from power series image notes.
  tags:
  - calculus-2
  - power-series
  - taylor-series
items:
- id: img-powerser-001
  concept: Maclaurin Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_1.png
  prompt: |-
    Find the Maclaurin series for $e^{2x}$.
  explanation: |-
    $e^{2x} = \sum_{n=0}^\infty \frac{(2x)^n}{n!} = \sum_{n=0}^\infty \frac{2^n x^n}{n!}$. $R = \infty$.
- id: img-powerser-002
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_1.png
  prompt: |-
    Find the interval of convergence of $\sum \frac{x^n}{n \cdot 3^n}$.
  explanation: |-
    $R=3$. At $x=3$: $\sum 1/n$ diverges. At $x=-3$: $\sum (-1)^n/n$ converges. IOC: $[-3, 3)$.
- id: img-powerser-003
  concept: Series Evaluation of Limits
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_1.png
  prompt: |-
    Use series to find $\lim_{x \to 0} \frac{\sin x - x}{x^3}$.
  explanation: |-
    $\sin x = x - x^3/6 + \cdots$. $(\sin x - x)/x^3 \to -1/6$.
- id: img-powerser-004
  concept: Taylor Polynomials
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_2.png
  prompt: |-
    Find $T_3(x)$ for $f(x) = \sqrt{1+x}$ at $a=0$.
  explanation: |-
    $f=1, f'=1/2, f''=-1/4, f'''=3/8$. $T_3 = 1 + x/2 - x^2/8 + x^3/16$.
- id: img-powerser-005
  concept: Maclaurin Series Substitution
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_2.png
  prompt: |-
    Find the Maclaurin series for $\sin(x^2)$.
  explanation: |-
    $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.
- id: img-powerser-006
  concept: Recognizing Series Sums
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_2.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty \frac{(-1)^n}{(2n+1)!}$.
  explanation: "$= \\sin(1) \approx 0.8415$."
- id: img-powerser-007
  concept: Radius of Convergence
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_2.png
  prompt: |-
    Find the radius of convergence of $\sum n^2 x^n$.
  explanation: |-
    Ratio: $\frac{(n+1)^2}{n^2} |x| \to |x| < 1$. $R=1$.
- id: img-powerser-008
  concept: Integration of Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_2.png
  prompt: |-
    Use a series to estimate $\int_0^{0.5} \frac{\sin x}{x} \, dx$ to 4 decimal places.
  explanation: "$\\sin x / x = 1 - x^2/6 + x^4/120 - \\cdots$. $\\int_0^{0.5} = 0.5 - 0.5^3/18 + 0.5^5/600 - \\cdots = 0.5 - 0.00694 + 0.000052 - \\cdots \approx 0.4931$."
- id: img-powerser-009
  concept: Power Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_2.png
  prompt: |-
    Find the power series for $\frac{1}{1+x^2}$ and state its radius.
  explanation: |-
    $= \sum (-x^2)^n = \sum (-1)^n x^{2n}$. $R=1$.
- id: img-powerser-010
  concept: Taylor Polynomial Error Bound
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_3.png
  prompt: |-
    Find $T_4(x)$ for $\cos x$ and bound the error at $x=0.1$.
  explanation: "$T_4 = 1 - x^2/2 + x^4/24$. $|R_4| \\le |x|^5/5! = 10^{-5}/120 \approx 8 \\times 10^{-8}$."
- id: img-powerser-011
  concept: Maclaurin Series Derivatives
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_3.png
  prompt: |-
    Find $f^{(5)}(0)$ if $f(x) = e^{x^2}$.
  explanation: |-
    $e^{x^2} = \sum x^{2n}/n!$. Coeff of $x^5$: 0 (only even powers). $f^{(5)}(0) = 5! \cdot 0 = 0$.
- id: img-powerser-012
  concept: Integration of Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_3.png
  prompt: |-
    Find the power series for $\arctan(x^2)$.
  explanation: |-
    $= \sum \frac{(-1)^n (x^2)^{2n+1}}{2n+1} = \sum \frac{(-1)^n x^{4n+2}}{2n+1}$. $R=1$.
- id: img-powerser-013
  concept: Differentiation of Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_3.png
  prompt: |-
    Find the sum $\sum_{n=1}^\infty \frac{n}{4^n}$.
  explanation: |-
    $\sum nx^n = x/(1-x)^2$ at $x=1/4$: $(1/4)/(3/4)^2 = 4/9$.
- id: img-powerser-014
  concept: Maclaurin Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_3.png
  prompt: |-
    Find the Maclaurin series for $\ln(1-x^2)$.
  explanation: |-
    $\ln(1-x^2) = \ln(1-x) + \ln(1+x) = -\sum \frac{x^n}{n} - \sum \frac{(-x)^n}{n} = \sum \frac{-(x^n + (-x)^n)}{n} = -2 \sum_{k=1}^\infty \frac{x^{2k}}{2k} = -\sum_{k=1}^\infty \frac{x^{2k}}{k}$. $R=1$.
- id: img-powerser-015
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_4.png
  prompt: |-
    Find the interval of convergence of $\sum \frac{(x-2)^n}{n \cdot 2^n}$.
  explanation: |-
    $R=2$, centre $a=2$. At $x=4$: $\sum 1/n$ diverges. At $x=0$: $\sum (-1)^n/n$ converges. IOC: $[0, 4)$.
- id: img-powerser-016
  concept: Taylor Polynomials
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_4.png
  prompt: |-
    Find $T_2(x)$ for $\tan x$ at $a=\pi/4$.
  explanation: |-
    $f(\pi/4)=1, f'(\pi/4)=\sec^2(\pi/4)=2, f''(\pi/4)=2\sec^2(\pi/4)\tan(\pi/4)=4$. $T_2 = 1 + 2(x-\pi/4) + 2(x-\pi/4)^2$.
- id: img-powerser-017
  concept: Recognizing Series Sums
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_4.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty (-1)^n \frac{\pi^{2n}}{4^n(2n)!}$.
  explanation: |-
    $\sum (-1)^n \frac{(\pi/2)^{2n}}{(2n)!} = \cos(\pi/2) = 0$.
- id: img-powerser-018
  concept: Binomial Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_4.png
  prompt: |-
    Use the binomial series $(1+x)^{1/2} = \sum \binom{1/2}{n} x^n$ to find $\sqrt{1.1}$ to 4 decimal places.
  explanation: "Using $x=0.1$: $\\approx 1 + (1/2)(0.1) - (1/8)(0.1)^2 + \\cdots = 1 + 0.05 - 0.00125 + \\cdots \approx 1.0488$."
- id: img-powerser-019
  concept: Integration of Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_4.png
  prompt: |-
    Find the power series for $\int_0^x e^{-t^2} dt$.
  explanation: |-
    $e^{-t^2} = \sum (-1)^n t^{2n}/n!$. $\int_0^x e^{-t^2} dt = \sum \frac{(-1)^n x^{2n+1}}{n!(2n+1)}$.
- id: img-powerser-020
  concept: Power Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_5.png
  prompt: |-
    Find the Maclaurin series for $\frac{x}{1+x^3}$.
  explanation: |-
    $= x \sum (-x^3)^n = \sum (-1)^n x^{3n+1}$. $R=1$.
- id: img-powerser-021
  concept: Recognizing Series Sums
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_5.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty \frac{(-1)^n \pi^{2n+1}}{4^{2n+1}(2n+1)!}$.
  explanation: |-
    $\sum \frac{(-1)^n (\pi/4)^{2n+1}}{(2n+1)!} = \sin(\pi/4) = \sqrt{2}/2$.
- id: img-powerser-022
  concept: Taylor Polynomials
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_5.png
  prompt: |-
    Find $T_3(x)$ for $\ln x$ at $a=1$.
  explanation: |-
    $f=0, f'=1, f''=-1, f'''=2$. $T_3 = (x-1) - \frac{(x-1)^2}{2} + \frac{(x-1)^3}{3}$.
- id: img-powerser-023
  concept: Series Evaluation of Limits
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_5.png
  prompt: |-
    Use a series to evaluate $\lim_{x \to 0} \frac{1-\cos x}{x^2}$.
  explanation: |-
    $1-\cos x = 1 - (1 - x^2/2 + x^4/24 - \cdots) = x^2/2 - x^4/24 + \cdots$. Limit$=1/2$.
- id: img-powerser-024
  concept: Differentiation of Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_5.png
  prompt: |-
    Find $\sum_{n=2}^\infty \frac{n(n-1)}{3^n}$.
  explanation: |-
    $\sum n(n-1)x^n = \frac{2x^2}{(1-x)^3}$ (differentiate $\sum x^n$ twice and multiply by $x^2$). At $x=1/3$: $\frac{2(1/9)}{(2/3)^3} = \frac{2/9}{8/27} = \frac{3}{4}$.
- id: img-powerser-025
  concept: Multiplication of Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_5.png
  prompt: |-
    Find the power series for $e^x \sin x$ up to $x^4$.
  explanation: |-
    $(1 + x + x^2/2 + x^3/6 + \cdots)(x - x^3/6 + \cdots) = x + x^2 + x^3/2 - x^3/6 + \cdots = x + x^2 + x^3/3 + \cdots$. Full up to $x^5$: $x + x^2 + \frac{x^3}{3} - \frac{x^5}{30} + \cdots$
- id: img-powerser-026
  concept: Maclaurin Series Derivatives
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_6.png
  prompt: |-
    Find $f^{(8)}(0)$ for $f(x) = \cos(x^2)$.
  explanation: |-
    $\cos(x^2) = \sum \frac{(-1)^n x^{4n}}{(2n)!}$. Coeff of $x^8$ (when $n=2$): $\frac{(-1)^2}{4!} = \frac{1}{24}$. So $f^{(8)}(0) = 8! \cdot \frac{1}{24} = 1680$.
- id: img-powerser-027
  concept: Differentiation of Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_6.png
  prompt: |-
    Find the Taylor series for $\frac{1}{x^2}$ centred at $a=1$.
  explanation: |-
    $\frac{1}{x} = \frac{1}{1 - (1-x)} = \sum_{n=0}^\infty (1-x)^n$. Differentiate: $-\frac{1}{x^2} = \sum_{n=1}^\infty n(1-x)^{n-1}(-1) = -\sum_{n=0}^\infty (n+1)(1-x)^n$. So $\frac{1}{x^2} = \sum_{n=0}^\infty (-1)^n (n+1)(x-1)^n, R=1$.
- id: img-powerser-028
  concept: Integration of Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_6.png
  prompt: |-
    Use a series to estimate $\int_0^1 \cos(\sqrt{x}) dx$ to 3 decimal places.
  explanation: "$\\cos(\\sqrt{x}) = \\sum \\frac{(-1)^n x^n}{(2n)!}$. $\\int_0^1 = \\sum \\frac{(-1)^n}{(2n)!(n+1)} = 1 - 1/6 + 1/120 - \\cdots \approx 0.845$."
- id: img-powerser-029
  concept: Series Proofs
  difficulty: 5
  source: |-
    Power and Taylor Series/pset_6.png
  prompt: |-
    Show that $e$ is irrational using the series $e = \sum 1/n!$.
  explanation: |-
    If $e=p/q$, then $q!e = q! \sum_{n=0}^q 1/n! + q! \sum_{n=q+1}^\infty 1/n!$. LHS ($q!p/q$) and first RHS sum are integers. Second term: $q! \sum_{n>q} 1/n! < 1/(q+1) + 1/(q+1)^2 + \cdots = 1/q \le 1$. So $q!e$ is between consecutive integers: contradiction.
- id: img-powerser-030
  concept: Interval of Convergence
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_6.png
  prompt: |-
    Find the interval of convergence of $\sum n! (x-3)^n$.
  explanation: |-
    Ratio: $(n+1)!|x-3|^{n+1}/(n!|x-3|^n) = (n+1)|x-3| \to \infty$ unless $x=3$. $R=0$. IOC: $\{3\}$.
- id: img-powerser-031
  concept: Maclaurin Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_7.png
  prompt: |-
    Find the Maclaurin series for $\sinh x$.
  explanation: |-
    $\sinh x = (e^x - e^{-x})/2 = \sum \frac{x^{2n+1}}{(2n+1)!}$. $R=\infty$.
- id: img-powerser-032
  concept: Taylor Polynomials
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_7.png
  prompt: |-
    Find $T_4(x)$ for $x^4-3x^2+2$ at $a=1$. (Exact finite series.)
  explanation: |-
    $f(1)=0, f'=4x^3-6x|_1 = -2, f''=12x^2-6|_1=6, f'''=24x|_1=24, f^{(4)}=24$. $T_4 = -2(x-1)+3(x-1)^2+4(x-1)^3+(x-1)^4$. (Exact since $f$ is degree 4.)
- id: img-powerser-033
  concept: Integration of Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_7.png
  prompt: |-
    Find $\sum_{n=0}^\infty \frac{x^{2n+2}}{n+1}$.
  explanation: |-
    $\sum \frac{(x^2)^{n+1}}{n+1} = -\ln(1-x^2)$. $R=1$.
- id: img-powerser-034
  concept: Taylor Polynomial Error Bound
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_7.png
  prompt: |-
    Find the error bound in using $T_3(x) = x-x^3/6$ to approximate $\sin(0.5)$.
  explanation: "$|R_3| \\le (0.5)^5/5! = 0.000026$. Actual: $\\sin 0.5 \approx 0.479426, T_3 \approx 0.479167$. Diff $0.00026$ (within bound)."
- id: img-powerser-035
  concept: Differentiation of Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_7.png
  prompt: |-
    Find the Maclaurin series for $\frac{1}{(1-x)^2}$ by differentiating $\frac{1}{1-x}$.
  explanation: |-
    $\frac{d}{dx} \sum x^n = \sum_{n=1}^\infty n x^{n-1} = \frac{1}{(1-x)^2}$. So $\sum_{n=0}^\infty (n+1)x^n = \frac{1}{(1-x)^2}$.
- id: img-powerser-036
  concept: Differentiation of Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_7.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty (-1)^n \frac{n+1}{2^n}$.
  explanation: |-
    $\sum (n+1)x^n = 1/(1-x)^2$ at $x=-1/2$: $1/(3/2)^2 = 4/9$.
- id: img-powerser-037
  concept: Power Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_8.png
  prompt: |-
    Find the power series for $\frac{x^2}{1+x}$.
  explanation: |-
    $= x^2 \sum (-x)^n = \sum (-1)^n x^{n+2}$. $R=1$.
- id: img-powerser-038
  concept: Euler's Formula
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_8.png
  prompt: |-
    Derive Euler's formula $e^{i\theta} = \cos\theta + i\sin\theta$ from Maclaurin series.
  explanation: |-
    $e^{i\theta} = \sum \frac{(i\theta)^n}{n!} = \sum \frac{i^n\theta^n}{n!}$. Separate even/odd: $= \sum \frac{(-1)^n \theta^{2n}}{(2n)!} + i \sum \frac{(-1)^n \theta^{2n+1}}{(2n+1)!} = \cos\theta + i\sin\theta$.
- id: img-powerser-039
  concept: Interval of Convergence
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_8.png
  prompt: |-
    Find the interval of convergence of $\sum \frac{(2x)^n}{n^2}$.
  explanation: |-
    $R=1/2$. At $x=1/2$: $\sum 1/n^2$ converges. At $x=-1/2$: $\sum (-1)^n/n^2$ converges. IOC: $[-1/2, 1/2]$.
- id: img-powerser-040
  concept: Recognizing Series Sums
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_8.png
  prompt: |-
    Find $\sum_{n=0}^\infty \frac{(i)^n}{n!}$ where $i = \sqrt{-1}$.
  explanation: "$= e^i = \\cos 1 + i\\sin 1 \approx 0.5403 + 0.8415i$."
- id: img-powerser-041
  concept: Integration of Series
  difficulty: 5
  source: |-
    Power and Taylor Series/pset_8.png
  prompt: |-
    Find the Maclaurin series for $\arcsin x$.
  explanation: |-
    $\frac{1}{\sqrt{1-x^2}} = \sum \binom{-1/2}{n} (-x^2)^n = \sum \frac{(2n)!}{4^n (n!)^2} x^{2n}$. Integrate: $\arcsin x = \sum \frac{(2n)!}{4^n (n!)^2} \frac{x^{2n+1}}{2n+1} = x + \frac{x^3}{6} + \frac{3x^5}{40} + \cdots$
- id: img-powerser-042
  concept: Series Evaluation of Limits
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_9.png
  prompt: |-
    Find $\lim_{x \to 0} \frac{e^x - 1 - x}{x^2}$ using series.
  explanation: |-
    $e^x = 1 + x + x^2/2 + \cdots$. $(e^x - 1 - x)/x^2 \to 1/2$.
- id: img-powerser-043
  concept: Integration of Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_9.png
  prompt: |-
    Find the power series for $\int_0^x \frac{1-\cos t}{t^2} dt$.
  explanation: |-
    $(1-\cos t)/t^2 = \sum_{n=1}^\infty \frac{(-1)^{n+1} t^{2n-2}}{(2n)!}$. $\int_0^x = \sum_{n=1}^\infty \frac{(-1)^{n+1} x^{2n-1}}{(2n)!(2n-1)}$.
- id: img-powerser-044
  concept: Taylor Polynomials
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_9.png
  prompt: |-
    Find $T_2(x)$ for $f(x) = x^x$ at $a=1$.
  explanation: |-
    $f(1)=1$. $\ln f = x \ln x$. $f'/f = 1 + \ln x \Rightarrow f' = x^x(1+\ln x)$. $f'(1)=1$. $f'' = f'(1+\ln x) + x^x(1/x)$. $f''(1) = 1+1=2$. $T_2 = 1 + (x-1) + (x-1)^2$.
- id: img-powerser-045
  concept: Differentiation of Series
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_9.png
  prompt: |-
    Find the power series for $f(x) = \frac{1}{(1+x)^3}$.
  explanation: |-
    $\frac{d^2}{dx^2} \frac{1}{1+x} = \frac{2}{(1+x)^3}$. $\frac{1}{1+x} = \sum (-1)^n x^n$, differentiate twice: $\sum (-1)^n n(n-1)x^{n-2}$. Divide by 2: $\frac{1}{(1+x)^3} = \sum_{n=2}^\infty (-1)^n \frac{n(n-1)}{2} x^{n-2} = \sum_{m=0}^\infty (-1)^m \binom{m+2}{2} x^m$.
- id: img-powerser-046
  concept: Maclaurin Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_9.png
  prompt: |-
    Find the Maclaurin series for $x \sin(x^3)$.
  explanation: |-
    $= x \sum \frac{(-1)^n (x^3)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{6n+4}}{(2n+1)!}$. $R=\infty$.
- id: img-powerser-047
  concept: Series Evaluation of Limits
  difficulty: 5
  source: |-
    Power and Taylor Series/pset_9.png
  prompt: |-
    Use series to prove $\lim_{n \to \infty} n(a^{1/n}-1) = \ln a$ for $a > 0$.
  explanation: |-
    $a^{1/n} = e^{(\ln a)/n} = 1 + \frac{\ln a}{n} + O(1/n^2)$. $n(a^{1/n}-1) = \ln a + O(1/n) \to \ln a$.
- id: img-powerser-048
  concept: Recognizing Series Sums
  difficulty: 5
  source: |-
    Power and Taylor Series/pset_10.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty \frac{(-1)^n}{4^n(2n+1)}$.
  explanation: |-
    $\arctan(x) = \sum \frac{(-1)^n x^{2n+1}}{2n+1}$. $\arctan x / x = \sum \frac{(-1)^n x^{2n}}{2n+1}$. At $x = 1/2$: $\sum \frac{(-1)^n}{4^n(2n+1)} = \frac{\arctan(1/2)}{1/2} = 2\arctan(1/2)$.
- id: img-powerser-049
  concept: Division of Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_10.png
  prompt: |-
    Find the full Maclaurin series for $\sec x$ up to the $x^6$ term by long division of $\cos x$ into 1.
  explanation: |-
    $\cos x = 1 - x^2/2 + x^4/24 - x^6/720 + \cdots$. Divide: $\sec x = 1 + x^2/2 + 5x^4/24 + 61x^6/720 + \cdots$.
- id: img-powerser-050
  concept: Series Properties
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_10.png
  prompt: |-
    Derive the Leibniz formula $\pi/4 = 1 - 1/3 + 1/5 - 1/7 + \cdots$ and show that to get 3 correct decimal places, you need about 1000 terms.
  explanation: |-
    $\arctan x = \sum \frac{(-1)^n x^{2n+1}}{2n+1}$. At $x=1$: $\arctan 1 = \pi/4 = \sum \frac{(-1)^n}{2n+1}$. Convergence follows from AST. Error after $N$ terms: $|R| \le 1/(2N+1)$. For 3 decimal places, need $1/(2N+1) < 5 \times 10^{-4}$, i.e. $N > 999$.
- id: img-powerser-001-v1
  concept: Maclaurin Series
  difficulty: 3
  source: |-
    Power and Taylor Series/pset_1.png
  prompt: |-
    Find the Maclaurin series for $e^{-x}$.
  explanation: |-
    $e^{-x} = \sum_{n=0}^\infty \frac{(-x)^n}{n!} = \sum_{n=0}^\infty \frac{(-1)^n x^n}{n!}$. $R = \infty$.
- id: img-powerser-001-v2
  concept: Maclaurin Series
  difficulty: 2
  source: |-
    Power and Taylor Series/pset_1.png
  prompt: |-
    Find the Maclaurin series for $e^{x/2}$.
  explanation: |-
    $e^{x/2} = \sum_{n=0}^\infty \frac{(x/2)^n}{n!} = \sum_{n=0}^\infty \frac{x^n}{2^n n!}$. $R = \infty$.
