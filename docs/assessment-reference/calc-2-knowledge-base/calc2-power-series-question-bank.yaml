- id: img-powerser-044-v1
  concept: Taylor Polynomials
  difficulty: 4
  source: |-
    Power and Taylor Series/pset_9.png
  prompt: |-
    Find $T_2(x)$ for $f(x) = x^{2x}$ at $a=1$.
  explanation: |-
    $f(1)=1$. $\ln f = 2x \ln x \Rightarrow f' = x^{2x}(2\ln x + 2)$. $f'(1)=2$. $f'' = f'(2\ln x+2) + x^{2x}(2/x)$. $f''(1) = 2(2) + 2 = 6$. $T_2 = 1 + 2(x-1) + 3(x-1)^2$.
- id: img-powerser-044-v2
  concept: Taylor Polynomials
