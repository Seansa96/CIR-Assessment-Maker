  explanation: |-
    $(t-\sin t)/t^3 = \sum_{n=1}^\infty \frac{(-1)^{n+1} t^{2n-2}}{(2n+1)!}$. $\int = \sum_{n=1}^\infty \frac{(-1)^{n+1} x^{2n-1}}{(2n+1)!(2n-1)}$.
