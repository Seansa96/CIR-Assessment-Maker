schemaVersion: 1
bankId: calc2-infinite-series-review-hard
categoryId: calculus-2
topicIds: [infinite-series-review]
minimumItemCount: 15
items:
  - id: calc2-review-hard-001
    topicId: infinite-series-review
    skills: [evaluate-sequence-limits]
    archetype: rational-leading-coefficients
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires normalizing competing polynomial degrees.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\lim_{n\to\infty}\frac{3n^2-n+4}{5n^2+7}$.
    choices: [{id: a, text: '$3/5$'}, {id: b, text: '$1$'}, {id: c, text: '$0$'}, {id: d, text: '$\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Divide numerator and denominator by $n^2$ and take the ratio of the leading coefficients.
    commonTrap: Subtracting the leading coefficients instead of forming their ratio.
    verification: {method: rational-sequence-leading-order, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-002
    topicId: infinite-series-review
    skills: [apply-the-term-test]
    archetype: oscillating-nonzero-terms
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires checking the necessary condition before choosing a more elaborate test.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What happens to $\displaystyle\sum_{n=1}^{\infty}(-1)^n n/(n+1)$?
    choices: [{id: a, text: 'It diverges because its terms do not approach zero.'}, {id: b, text: 'It converges conditionally by the alternating-series test.'}, {id: c, text: 'It converges absolutely.'}, {id: d, text: 'It is geometric with ratio minus one.'}]
    answer: {choiceId: a}
    solutionOutline: The term magnitude approaches one, so the necessary condition for series convergence fails.
    commonTrap: Applying the alternating-series theorem without verifying that the magnitudes tend to zero.
    verification: {method: nth-term-divergence-test, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-003
    topicId: infinite-series-review
    skills: [sum-geometric-series]
    archetype: shifted-geometric-series
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires identifying both the first term and ratio after an index shift.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=3}^{\infty}5(2/3)^n$.
    choices: [{id: a, text: '$40/9$'}, {id: b, text: '$5$'}, {id: c, text: '$10/9$'}, {id: d, text: '$40/27$'}]
    answer: {choiceId: a}
    solutionOutline: The first term is $40/27$, and division by $1-2/3$ gives $40/9$.
    commonTrap: Using five as the first term despite the series starting at n equals three.
    verification: {method: shifted-geometric-sum, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-004
    topicId: infinite-series-review
    skills: [sum-telescoping-series]
    archetype: reciprocal-neighbor-difference
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires exposing cancellation through partial fractions.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{1}{n(n+1)}$.
    choices: [{id: a, text: '$1$'}, {id: b, text: '$1/2$'}, {id: c, text: '$\pi^2/6$'}, {id: d, text: 'It diverges'}]
    answer: {choiceId: a}
    solutionOutline: Write the term as $1/n-1/(n+1)$; the finite partial sum is $1-1/(N+1)$.
    commonTrap: Comparing with the harmonic series without preserving the cancellation.
    verification: {method: telescoping-partial-sum-limit, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-005
    topicId: infinite-series-review
    skills: [apply-limit-comparison]
    archetype: rational-power-tail
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires selecting the correct benchmark from dominant powers.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which conclusion holds for
      $\displaystyle\sum_{n=1}^{\infty}\frac{4n+1}{n^3+2}$?
    choices: [{id: a, text: 'It converges by limit comparison with $1/n^2$.'}, {id: b, text: 'It diverges by comparison with $1/n$.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'The term test proves convergence.'}]
    answer: {choiceId: a}
    solutionOutline: The term is asymptotic to $4/n^2$, giving a positive finite comparison limit with a convergent p-series.
    commonTrap: Comparing numerator and denominator degrees separately and choosing the harmonic series.
    verification: {method: rational-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-006
    topicId: infinite-series-review
    skills: [apply-ratio-tests-to-factorials]
    archetype: factorial-over-exponential
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires simplifying a factorial ratio before taking its limit.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What does the ratio test show for
      $\displaystyle\sum_{n=1}^{\infty}n!/5^n$?
    choices: [{id: a, text: 'It diverges because the ratio eventually exceeds one.'}, {id: b, text: 'It converges with ratio one-fifth.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'The ratio limit is zero.'}]
    answer: {choiceId: a}
    solutionOutline: The ratio of successive terms is $(n+1)/5$, which grows without bound.
    commonTrap: Canceling the factorial as though it contributed only a constant factor.
    verification: {method: factorial-ratio-growth, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-007
    topicId: infinite-series-review
    skills: [apply-root-tests]
    archetype: polynomial-times-geometric
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires separating polynomial nth-root growth from exponential growth.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=1}^{\infty}n^4(3/4)^n$.
    choices: [{id: a, text: 'It converges absolutely by the root test.'}, {id: b, text: 'It diverges because $n^4$ grows.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'The root-test limit is one.'}]
    answer: {choiceId: a}
    solutionOutline: The nth root is $n^{4/n}(3/4)$, which tends to three-fourths.
    commonTrap: Letting polynomial growth dominate exponential decay.
    verification: {method: root-test-polynomial-geometric, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-008
    topicId: infinite-series-review
    skills: [classify-absolute-and-conditional-convergence]
    archetype: alternating-p-series-threshold
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires applying separate tests to the signed and absolute-value series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      How does $\displaystyle\sum_{n=1}^{\infty}(-1)^{n+1}/\sqrt n$
      converge?
    choices: [{id: a, text: 'Conditionally'}, {id: b, text: 'Absolutely'}, {id: c, text: 'It diverges by the term test'}, {id: d, text: 'Geometrically'}]
    answer: {choiceId: a}
    solutionOutline: The alternating magnitudes decrease to zero, but the absolute p-series has exponent one-half and diverges.
    commonTrap: Assuming alternating convergence automatically implies absolute convergence.
    verification: {method: alternating-versus-p-series, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-009
    topicId: infinite-series-review
    skills: [find-power-series-intervals]
    archetype: shifted-harmonic-power-series
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires finding the radius and testing two distinct endpoint series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Find the interval of convergence of
      $\displaystyle\sum_{n=1}^{\infty}(x-2)^n/n$.
    choices: [{id: a, text: '$[1,3)$'}, {id: b, text: '$(1,3]$'}, {id: c, text: '$(1,3)$'}, {id: d, text: '$[1,3]$'}]
    answer: {choiceId: a}
    solutionOutline: The radius is one; x equals one gives the alternating harmonic series, while x equals three gives the harmonic series.
    commonTrap: Including both endpoints merely because the interior radius calculation is symmetric.
    verification: {method: shifted-power-endpoint-tests, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-010
    topicId: infinite-series-review
    skills: [extract-taylor-coefficients]
    archetype: logarithm-composition
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires composing a standard series and matching a sparse exponent.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the coefficient of $x^8$ in $\log(1+x^2)$?
    choices: [{id: a, text: '$-1/4$'}, {id: b, text: '$1/4$'}, {id: c, text: '$-1/8$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The fourth logarithm term is $-(x^2)^4/4=-x^8/4$.
    commonTrap: Using the final exponent eight as the logarithmic denominator.
    verification: {method: composed-logarithm-coefficient, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-011
    topicId: infinite-series-review
    skills: [bound-alternating-approximation-errors]
    archetype: alternating-first-omitted-index
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires connecting the number of retained terms with the correct remainder term.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      The first six terms of
      $\sum_{n=1}^{\infty}(-1)^{n+1}/n^2$ are used. Which error bound
      is guaranteed?
    choices: [{id: a, text: '$1/49$'}, {id: b, text: '$1/36$'}, {id: c, text: '$1/7$'}, {id: d, text: '$1/64$'}]
    answer: {choiceId: a}
    solutionOutline: The first omitted term has n equals seven and magnitude one over forty-nine.
    commonTrap: Bounding with the sixth term, which is the last term already included.
    verification: {method: alternating-square-tail-bound, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-012
    topicId: infinite-series-review
    skills: [identify-inconclusive-convergence-tests]
    archetype: ratio-test-limit-one
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires knowing both the calculation and the logical scope of the test.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Applying the ratio test to $\sum1/n^2$ gives a ratio limit of one.
      What conclusion follows from that test alone?
    choices: [{id: a, text: 'The ratio test is inconclusive.'}, {id: b, text: 'The series diverges.'}, {id: c, text: 'The series converges conditionally.'}, {id: d, text: 'The sum equals one.'}]
    answer: {choiceId: a}
    solutionOutline: A ratio limit equal to one lies exactly at the test's undecided boundary, even though another test proves this series converges.
    commonTrap: Interpreting the ratio-test boundary as divergence.
    verification: {method: ratio-test-boundary-logic, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-013
    topicId: infinite-series-review
    skills: [use-asymptotic-equivalence]
    archetype: logarithmic-small-angle-tail
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires replacing a nonlinear expression by its leading small-argument behavior.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\displaystyle\sum_{n=2}^{\infty}\log(1+1/n^2)$.
    choices: [{id: a, text: 'It converges because the terms are asymptotic to $1/n^2$.'}, {id: b, text: 'It diverges because logarithms grow.'}, {id: c, text: 'It converges conditionally.'}, {id: d, text: 'It diverges by the term test.'}]
    answer: {choiceId: a}
    solutionOutline: Since $\log(1+u)\sim u$ as u tends to zero, limit comparison with the reciprocal-square series applies.
    commonTrap: Judging convergence from the name of the function rather than its small-input asymptotic behavior.
    verification: {method: logarithm-asymptotic-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-014
    topicId: infinite-series-review
    skills: [understand-rearrangements]
    archetype: absolute-convergence-reordering
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires distinguishing the stability of absolute convergence from conditional behavior.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A series converges absolutely to S. What happens under any
      rearrangement of its terms?
    choices: [{id: a, text: 'It still converges to S.'}, {id: b, text: 'It may converge to any chosen value.'}, {id: c, text: 'It must diverge.'}, {id: d, text: 'Its sum changes sign.'}]
    answer: {choiceId: a}
    solutionOutline: Absolute convergence permits reordering because the total absolute tail can be made arbitrarily small independent of order.
    commonTrap: Applying the rearrangement phenomenon for conditionally convergent series to every infinite series.
    verification: {method: absolute-rearrangement-invariance, result: verified}
    reviewStatus: verified
  - id: calc2-review-hard-015
    topicId: infinite-series-review
    skills: [select-efficient-convergence-tests]
    archetype: factorial-rational-test-selection
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires matching structural features to an efficient method rather than computing blindly.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which test is most direct for
      $\displaystyle\sum_{n=1}^{\infty}\frac{3^n(n!)^2}{(2n)!}$?
    choices: [{id: a, text: 'The ratio test'}, {id: b, text: 'The alternating-series test'}, {id: c, text: 'The telescoping test'}, {id: d, text: 'The integral test on the original formula'}]
    answer: {choiceId: a}
    solutionOutline: Successive factorials cancel cleanly in a ratio, revealing a limiting factor without estimating the factorials separately.
    commonTrap: Choosing a test whose hypotheses do not match the positive factorial structure.
    verification: {method: structural-test-selection-factorials, result: verified}
    reviewStatus: verified
