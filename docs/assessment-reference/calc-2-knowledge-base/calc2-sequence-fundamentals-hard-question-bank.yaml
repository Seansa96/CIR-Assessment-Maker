schemaVersion: 1
bankId: calc2-sequence-fundamentals-hard
categoryId: calculus-2
topicIds: [sequence-fundamentals]
minimumItemCount: 15
items:
  - id: calc2-seq-hard-001
    topicId: sequence-fundamentals
    skills: [evaluate-rational-sequence-limits]
    archetype: dominant-degree-with-cancellation
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires simplifying leading powers after a nontrivial numerator cancellation.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\lim_{n\to\infty}\frac{(n+1)^2-n^2}{3n+5}$.
    choices: [{id: a, text: '$2/3$'}, {id: b, text: '$0$'}, {id: c, text: '$1/3$'}, {id: d, text: '$+\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Expanding the numerator gives $2n+1$, and the ratio of leading coefficients is $2/3$.
    commonTrap: Comparing the unsimplified quadratic terms and incorrectly reporting an infinite limit.
    verification: {method: algebraic-expansion-and-leading-coefficients, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-002
    topicId: sequence-fundamentals
    skills: [apply-the-squeeze-theorem]
    archetype: bounded-oscillation-over-growth
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires building an absolute-value bound independent of oscillation.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is $\displaystyle\lim_{n\to\infty}\frac{n\sin n}{n^2+1}$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1$'}, {id: c, text: 'Does not exist'}, {id: d, text: '$+\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Its absolute value is at most $n/(n^2+1)$, which tends to zero.
    commonTrap: Concluding divergence merely because $\sin n$ oscillates.
    verification: {method: absolute-bound-squeeze, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-003
    topicId: sequence-fundamentals
    skills: [prove-monotone-bounded-convergence]
    archetype: averaging-recurrence
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires finding an invariant bound and the direction of monotonicity.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Let $a_1=0$ and $a_{n+1}=(a_n+3)/2$. Which description is correct?
    choices: [{id: a, text: '$a_n$ increases to $3$.'}, {id: b, text: '$a_n$ decreases to $0$.'}, {id: c, text: '$a_n$ increases without bound.'}, {id: d, text: '$a_n$ alternates around $3$.'}]
    answer: {choiceId: a}
    solutionOutline: If $a_n<3$, then $a_n<a_{n+1}<3$; induction and the fixed-point equation give the limit three.
    commonTrap: Solving for the fixed point without verifying convergence toward it.
    verification: {method: invariant-monotonicity-fixed-point, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-004
    topicId: sequence-fundamentals
    skills: [classify-geometric-sequences]
    archetype: negative-ratio-magnitude
    difficulty: hard
    reasoningDepth: 2
    difficultyEvidence: Requires separating sign oscillation from magnitude decay.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Determine the limit of $a_n=5(-3/4)^n$.
    choices: [{id: a, text: '$0$'}, {id: b, text: '$5$'}, {id: c, text: 'Does not exist'}, {id: d, text: '$-\infty$'}]
    answer: {choiceId: a}
    solutionOutline: Although signs alternate, the magnitude is $5(3/4)^n$, which tends to zero.
    commonTrap: Treating every alternating sequence as divergent.
    verification: {method: geometric-magnitude-limit, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-005
    topicId: sequence-fundamentals
    skills: [analyze-subsequences]
    archetype: parity-cluster-points
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires evaluating two indexed subsequences separately.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What are the limits of the even and odd subsequences of
      $a_n=(-1)^n+1/n$?
    choices: [{id: a, text: '$1$ and $-1$, respectively'}, {id: b, text: '$-1$ and $1$, respectively'}, {id: c, text: 'Both are $0$'}, {id: d, text: 'Neither exists'}]
    answer: {choiceId: a}
    solutionOutline: At even indices the sign term is one; at odd indices it is negative one, while the reciprocal perturbation vanishes.
    commonTrap: Dropping the sign term because the smaller reciprocal term tends to zero.
    verification: {method: even-odd-substitution, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-006
    topicId: sequence-fundamentals
    skills: [distinguish-boundedness-and-convergence]
    archetype: theorem-counterexample
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires testing a proposed implication with a standard counterexample.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which additional condition, together with boundedness, guarantees that a
      real sequence converges?
    choices: [{id: a, text: 'Monotonicity'}, {id: b, text: 'Infinitely many positive terms'}, {id: c, text: 'Distinct terms'}, {id: d, text: 'A bounded first difference'}]
    answer: {choiceId: a}
    solutionOutline: The monotone convergence theorem states that a bounded monotone sequence converges.
    commonTrap: Assuming boundedness alone prevents persistent oscillation.
    verification: {method: monotone-convergence-theorem, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-007
    topicId: sequence-fundamentals
    skills: [evaluate-nth-root-limits]
    archetype: logarithmic-transform
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires converting an indeterminate power to a logarithmic quotient.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Find $\displaystyle\lim_{n\to\infty}n^{1/n}$.
    choices: [{id: a, text: '$1$'}, {id: b, text: '$e$'}, {id: c, text: '$0$'}, {id: d, text: '$+\infty$'}]
    answer: {choiceId: a}
    solutionOutline: The logarithm is $(\ln n)/n\to0$, so exponentiation gives $e^0=1$.
    commonTrap: Assuming that an unbounded base forces the whole power to diverge.
    verification: {method: logarithmic-transform, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-008
    topicId: sequence-fundamentals
    skills: [compare-factorial-and-exponential-growth]
    archetype: consecutive-ratio-decay
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires using a consecutive ratio to establish eventual rapid decay.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is $\displaystyle\lim_{n\to\infty}\frac{4^n}{n!}$?
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1$'}, {id: c, text: '$4$'}, {id: d, text: '$+\infty$'}]
    answer: {choiceId: a}
    solutionOutline: The consecutive ratio is $4/(n+1)$, eventually bounded by a fixed number below one.
    commonTrap: Assuming every exponential outgrows every other familiar expression, including factorials.
    verification: {method: ratio-to-geometric-bound, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-009
    topicId: sequence-fundamentals
    skills: [recognize-riemann-sum-limits]
    archetype: quadratic-riemann-sum
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires inserting the missing mesh factor and identifying the limiting integral.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\lim_{n\to\infty}\frac1{n^3}\sum_{k=1}^{n}k^2$.
    choices: [{id: a, text: '$1/3$'}, {id: b, text: '$1/2$'}, {id: c, text: '$1$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: Rewrite the expression as $(1/n)\sum(k/n)^2$, a Riemann sum for $\int_0^1x^2\,dx$.
    commonTrap: Forgetting that the sum contains roughly $n$ terms as well as terms of order $n^2$.
    verification: {method: riemann-sum-identification, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-010
    topicId: sequence-fundamentals
    skills: [apply-the-cauchy-criterion]
    archetype: cauchy-definition
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires distinguishing pairwise tail control from closeness of adjacent terms.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which condition is the Cauchy criterion for a real sequence $(a_n)$?
    choices: [{id: a, text: 'For every $\varepsilon>0$, sufficiently large $m,n$ satisfy $|a_m-a_n|<\varepsilon$.'}, {id: b, text: '$a_{n+1}-a_n\to0$.'}, {id: c, text: '$|a_n|\le1$ eventually.'}, {id: d, text: 'Some subsequence converges.'}]
    answer: {choiceId: a}
    solutionOutline: Convergence in the complete real line is equivalent to uniform closeness of every pair in a sufficiently late tail.
    commonTrap: Replacing all-pairs tail control with the weaker adjacent-difference condition.
    verification: {method: cauchy-convergence-criterion, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-011
    topicId: sequence-fundamentals
    skills: [evaluate-logarithmic-growth-limits]
    archetype: logarithm-versus-power
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires comparing two unbounded growth scales.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Determine $\displaystyle\lim_{n\to\infty}\frac{\ln n}{\sqrt n}$.
    choices: [{id: a, text: '$0$'}, {id: b, text: '$1$'}, {id: c, text: '$+\infty$'}, {id: d, text: 'Does not exist'}]
    answer: {choiceId: a}
    solutionOutline: Any positive power dominates a logarithm; equivalently, l'Hôpital on the continuous analogue gives $(1/x)/(1/(2\sqrt x))=2/\sqrt x\to0$.
    commonTrap: Concluding that a quotient of two divergent quantities must diverge.
    verification: {method: growth-hierarchy-or-lhopital, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-012
    topicId: sequence-fundamentals
    skills: [evaluate-radical-difference-limits]
    archetype: conjugate-rationalization
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires rationalizing an infinity-minus-infinity expression.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Find $\displaystyle\lim_{n\to\infty}\left(\sqrt{n^2+4n}-n\right)$.
    choices: [{id: a, text: '$2$'}, {id: b, text: '$0$'}, {id: c, text: '$4$'}, {id: d, text: '$+\infty$'}]
    answer: {choiceId: a}
    solutionOutline: The conjugate gives $4n/(\sqrt{n^2+4n}+n)$, and division by $n$ yields a denominator tending to two.
    commonTrap: Subtracting the leading terms and reporting zero without retaining the next-order contribution.
    verification: {method: conjugate-rationalization, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-013
    topicId: sequence-fundamentals
    skills: [reason-about-subsequence-implications]
    archetype: conflicting-subsequence-limits
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires applying uniqueness of limits contrapositively.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A sequence has one subsequence converging to $2$ and another converging
      to $5$. What follows?
    choices: [{id: a, text: 'The original sequence diverges.'}, {id: b, text: 'The original sequence converges to $7/2$.'}, {id: c, text: 'The original sequence converges to $2$.'}, {id: d, text: 'The sequence is unbounded.'}]
    answer: {choiceId: a}
    solutionOutline: Every subsequence of a convergent sequence must share the full sequence's unique limit.
    commonTrap: Averaging cluster points to manufacture a limit.
    verification: {method: subsequence-limit-uniqueness, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-014
    topicId: sequence-fundamentals
    skills: [solve-linear-recurrences]
    archetype: error-from-fixed-point
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires shifting by the fixed point to expose geometric error decay.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Let $a_1=10$ and $a_{n+1}=(2a_n+3)/5$. What is $\lim a_n$?
    choices: [{id: a, text: '$1$'}, {id: b, text: '$3/5$'}, {id: c, text: '$10$'}, {id: d, text: '$+\infty$'}]
    answer: {choiceId: a}
    solutionOutline: The fixed point is one and $a_{n+1}-1=(2/5)(a_n-1)$, so the error tends geometrically to zero.
    commonTrap: Treating the constant numerator term as the fixed point.
    verification: {method: fixed-point-error-recurrence, result: verified}
    reviewStatus: verified
  - id: calc2-seq-hard-015
    topicId: sequence-fundamentals
    skills: [use-eventual-properties]
    archetype: finite-prefix-invariance
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires recognizing that convergence depends only on the tail.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If a convergent sequence has its first one million terms replaced by
      arbitrary real values, what happens?
    choices: [{id: a, text: 'It retains the same limit.'}, {id: b, text: 'It necessarily diverges.'}, {id: c, text: 'Its limit becomes the average replacement value.'}, {id: d, text: 'It converges only if replacements are bounded by one.'}]
    answer: {choiceId: a}
    solutionOutline: The modified sequence has exactly the same tail as the original, and the definition of limit ignores every finite prefix.
    commonTrap: Believing a very large finite number of exceptional terms affects an infinite-tail property.
    verification: {method: tail-invariance-of-limits, result: verified}
    reviewStatus: verified
