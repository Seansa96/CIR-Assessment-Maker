schemaVersion: 1
bankId: calc2-series-fundamentals-easy
categoryId: calculus-2
topicIds:
  - series-fundamentals
minimumItemCount: 15
items:
  - id: calc2-series-easy-001
    topicId: series-fundamentals
    skills: [define-partial-sums]
    archetype: notation-interpretation
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires distinguishing a finite partial sum from an infinite series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What does $S_N=\sum_{n=1}^{N}a_n$ represent?
    choices:
      - { id: a, text: 'The finite sum of the first $N$ terms' }
      - { id: b, text: 'The $N$th term $a_N$' }
      - { id: c, text: 'The infinite-series sum regardless of convergence' }
      - { id: d, text: 'The remainder after $N$ terms' }
    answer: { choiceId: a }
    solutionOutline: A partial sum has a finite upper index and accumulates exactly the first $N$ terms.
    commonTrap: Treating $S_N$ as interchangeable with the individual term $a_N$.
    verification: { method: definition-check, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-002
    topicId: series-fundamentals
    skills: [define-series-convergence]
    archetype: partial-sum-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying the sequence whose limit defines a series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      When does $\sum_{n=1}^{\infty}a_n$ converge to $S$?
    choices:
      - { id: a, text: 'When $\lim_{N\to\infty}S_N=S$' }
      - { id: b, text: 'Whenever $\lim a_n=0$' }
      - { id: c, text: 'Whenever every $a_n$ is bounded' }
      - { id: d, text: 'When $S_N=a_N$' }
    answer: { choiceId: a }
    solutionOutline: The infinite series is defined as the limit of its finite partial-sum sequence.
    commonTrap: Replacing the partial-sum condition with the weaker zero-term condition.
    verification: { method: series-convergence-definition, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-003
    topicId: series-fundamentals
    skills: [apply-the-divergence-test]
    archetype: necessary-term-condition
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires using a nonzero term limit to reject convergence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\lim_{n\to\infty}a_n=7$, what happens to $\sum a_n$?
    choices:
      - { id: a, text: 'It diverges.' }
      - { id: b, text: 'It converges to $7$.' }
      - { id: c, text: 'It converges absolutely.' }
      - { id: d, text: 'It is geometric.' }
    answer: { choiceId: a }
    solutionOutline: Terms of a convergent series must approach zero; a limit of seven violates that necessary condition.
    commonTrap: Calling the term limit the value of the infinite sum.
    verification: { method: term-test, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-004
    topicId: series-fundamentals
    skills: [recognize-the-invalid-converse]
    archetype: harmonic-counterexample
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires recognizing why a zero term limit remains inconclusive.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which series shows that $a_n\to0$ does not guarantee $\sum a_n$ converges?
    choices:
      - { id: a, text: '$\sum1/n$' }
      - { id: b, text: '$\sum1/2^n$' }
      - { id: c, text: '$\sum0$' }
      - { id: d, text: '$\sum1/n^2$' }
    answer: { choiceId: a }
    solutionOutline: Harmonic terms approach zero while their partial sums grow without bound.
    commonTrap: Selecting another series whose zero terms and partial sums both converge.
    verification: { method: standard-counterexample, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-005
    topicId: series-fundamentals
    skills: [evaluate-geometric-series]
    archetype: exact-geometric-sum
    difficulty: foundation
    reasoningDepth: 2
    difficultyEvidence: Requires identifying first term and common ratio.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{n=0}^{\infty}3(1/4)^n$.
    choices:
      - { id: a, text: '$3$' }
      - { id: b, text: '$4$' }
      - { id: c, text: '$12$' }
      - { id: d, text: 'The series diverges.' }
    answer: { choiceId: b }
    solutionOutline: The geometric sum is $3/(1-1/4)=4$.
    commonTrap: Multiplying rather than dividing by $1-r$.
    verification: { method: geometric-sum-formula, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-006
    topicId: series-fundamentals
    skills: [derive-telescoping-partial-sums]
    archetype: adjacent-cancellation
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires expanding a finite difference and retaining the correct upper boundary.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the sum of
      $$\sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+1}\right)?$$
    choices:
      - { id: a, text: '$0$' }
      - { id: b, text: '$1$' }
      - { id: c, text: '$2$' }
      - { id: d, text: 'The series diverges.' }
    answer: { choiceId: b }
    solutionOutline: The finite partial sum is $1-1/(N+1)$, whose limit is one.
    commonTrap: Assuming complete cancellation and losing the first boundary term.
    verification: { method: finite-telescoping-sum, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-007
    topicId: series-fundamentals
    skills: [understand-finite-term-invariance]
    archetype: tail-property
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires separating convergence behavior from sum value.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Changing the first term of a convergent series can do what?
    choices:
      - { id: a, text: 'Change the sum but not convergence.' }
      - { id: b, text: 'Force divergence in every case.' }
      - { id: c, text: 'Leave both convergence and sum unchanged.' }
      - { id: d, text: 'Make the term limit nonzero.' }
    answer: { choiceId: a }
    solutionOutline: Every later partial sum shifts by one fixed finite amount, preserving existence of a finite limit.
    commonTrap: Assuming convergence invariance also makes the numerical sum invariant.
    verification: { method: shifted-partial-sum-argument, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-008
    topicId: series-fundamentals
    skills: [analyze-positive-partial-sums]
    archetype: monotone-partial-sum-criterion
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires applying monotone convergence to partial sums rather than terms.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If every $a_n\ge0$, which additional fact proves $\sum a_n$ converges?
    choices:
      - { id: a, text: 'The partial sums are bounded above.' }
      - { id: b, text: 'The terms are bounded above.' }
      - { id: c, text: 'The terms are positive.' }
      - { id: d, text: 'The first partial sum is finite.' }
    answer: { choiceId: a }
    solutionOutline: Nonnegative terms make $S_N$ nondecreasing, and an upper bound then guarantees a finite limit.
    commonTrap: Applying boundedness to the term sequence instead of the accumulating partial sums.
    verification: { method: monotone-partial-sum-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-009
    topicId: series-fundamentals
    skills: [apply-the-cauchy-criterion]
    archetype: tail-smallness
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires interpreting convergence as uniform smallness of late finite tails.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What must be true of $\sum_{k=m}^{n}a_k$ for a convergent series when
      both $m$ and $n$ are sufficiently large?
    choices:
      - { id: a, text: 'Its magnitude is smaller than any prescribed positive tolerance.' }
      - { id: b, text: 'It equals the first term.' }
      - { id: c, text: 'It is always positive.' }
      - { id: d, text: 'It contains exactly one term.' }
    answer: { choiceId: a }
    solutionOutline: Differences of late partial sums must be arbitrarily small because a convergent sequence is Cauchy.
    commonTrap: Checking only individual late terms rather than arbitrary finite tails.
    verification: { method: cauchy-criterion, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-010
    topicId: series-fundamentals
    skills: [recover-terms-from-partial-sums]
    archetype: consecutive-difference
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires subtracting consecutive partial sums.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $n\ge2$, how is $a_n$ recovered from the partial sums?
    choices:
      - { id: a, text: '$a_n=S_n-S_{n-1}$' }
      - { id: b, text: '$a_n=S_n+S_{n-1}$' }
      - { id: c, text: '$a_n=S_n/n$' }
      - { id: d, text: '$a_n=S_nS_{n-1}$' }
    answer: { choiceId: a }
    solutionOutline: The two partial sums share all earlier terms, leaving only $a_n$ when subtracted.
    commonTrap: Dividing the total by $n$ as though every term were equal.
    verification: { method: partial-sum-identity, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-011
    topicId: series-fundamentals
    skills: [evaluate-series-from-partial-sum-formulas]
    archetype: supplied-partial-sum-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires taking the defining limit of a closed partial-sum expression.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A series has $S_N=2-1/(N+1)$. What is its sum?
    choices:
      - { id: a, text: '$1$' }
      - { id: b, text: '$2$' }
      - { id: c, text: '$3$' }
      - { id: d, text: 'It diverges.' }
    answer: { choiceId: b }
    solutionOutline: The reciprocal term vanishes, so $\lim S_N=2$.
    commonTrap: Substituting a finite early index instead of taking the limit.
    verification: { method: direct-limit, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-012
    topicId: series-fundamentals
    skills: [diagnose-oscillating-partial-sums]
    archetype: two-subsequence-divergence
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires deciding series behavior from parity partial sums.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $S_{2k}=1$ and $S_{2k+1}=3$ for every $k$, what happens to the series?
    choices:
      - { id: a, text: 'It diverges.' }
      - { id: b, text: 'It converges to $2$.' }
      - { id: c, text: 'It converges to $1$.' }
      - { id: d, text: 'It converges absolutely.' }
    answer: { choiceId: a }
    solutionOutline: Even and odd partial sums have distinct limits, so the full partial-sum sequence has no limit.
    commonTrap: Averaging the two oscillating values.
    verification: { method: subsequential-limits, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-013
    topicId: series-fundamentals
    skills: [handle-first-terms-from-partial-sums]
    archetype: initial-index
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires treating the first partial sum correctly.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What is the relationship between $a_1$ and $S_1$?
    choices:
      - { id: a, text: '$a_1=S_1$' }
      - { id: b, text: '$a_1=0$' }
      - { id: c, text: '$a_1=S_1-S_2$' }
      - { id: d, text: '$a_1=S_1/2$' }
    answer: { choiceId: a }
    solutionOutline: The first partial sum contains exactly one term.
    commonTrap: Applying a consecutive-difference formula with an undefined preceding partial sum.
    verification: { method: partial-sum-definition, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-014
    topicId: series-fundamentals
    skills: [interpret-series-tails]
    archetype: tail-as-infinite-sum
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires expressing the remainder as the omitted series.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If $\sum a_n$ converges, which expression equals $R_N$?
    choices:
      - { id: a, text: '$\sum_{n=N+1}^{\infty}a_n$' }
      - { id: b, text: '$\sum_{n=1}^{N}a_n$' }
      - { id: c, text: '$a_N$' }
      - { id: d, text: '$S+S_N$' }
    answer: { choiceId: a }
    solutionOutline: The remainder consists of exactly the terms omitted after the first $N$.
    commonTrap: Identifying the entire included partial sum as the tail.
    verification: { method: remainder-decomposition, result: verified }
    reviewStatus: verified

  - id: calc2-series-easy-015
    topicId: series-fundamentals
    skills: [understand-consecutive-grouping]
    archetype: grouping-invariance
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires distinguishing order-preserving grouping from rearrangement.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      If a convergent series is grouped into consecutive finite blocks without
      changing term order, what happens?
    choices:
      - { id: a, text: 'The grouped series converges to the same sum.' }
      - { id: b, text: 'The sum always changes.' }
      - { id: c, text: 'It becomes absolutely convergent.' }
      - { id: d, text: 'It must diverge.' }
    answer: { choiceId: a }
    solutionOutline: Grouped partial sums form a subsequence of the original partial sums and therefore approach the same limit.
    commonTrap: Treating grouping as though it permuted the order of a conditional series.
    verification: { method: partial-sum-subsequence, result: verified }
    reviewStatus: verified
