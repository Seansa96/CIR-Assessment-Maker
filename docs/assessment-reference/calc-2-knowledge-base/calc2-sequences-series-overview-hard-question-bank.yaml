schemaVersion: 1
bankId: calc2-sequences-series-overview-hard
categoryId: calculus-2
topicIds: [sequences-series]
minimumItemCount: 15
items:
  - id: calc2-overview-hard-001
    topicId: sequences-series
    skills: [recover-terms-from-partial-sums]
    archetype: partial-sum-difference
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires distinguishing the first term from the general difference formula.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A series has partial sums $S_n=n/(n+1)$. What is $a_n$ for $n\ge2$?
    choices: [{id: a, text: '$1/[n(n+1)]$'}, {id: b, text: '$n/(n+1)$'}, {id: c, text: '$1/(n+1)$'}, {id: d, text: '$-1/[n(n+1)]$'}]
    answer: {choiceId: a}
    solutionOutline: Compute $a_n=S_n-S_{n-1}=n/(n+1)-(n-1)/n=1/[n(n+1)]$.
    commonTrap: Reporting the partial-sum formula itself as the term formula.
    verification: {method: adjacent-partial-sum-difference, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-002
    topicId: sequences-series
    skills: [determine-convergence-from-partial-sums]
    archetype: oscillating-partial-sums
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires applying the definition of a series rather than checking only its terms.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If the partial sums of $\sum a_n$ satisfy $S_n=(-1)^n+1/n$, what
      happens to the series?
    choices: [{id: a, text: 'It diverges because $S_n$ has two cluster points.'}, {id: b, text: 'It converges to $0$.'}, {id: c, text: 'It converges absolutely.'}, {id: d, text: 'It converges to $1$.'}]
    answer: {choiceId: a}
    solutionOutline: The even partial sums approach one and the odd partial sums approach negative one, so no partial-sum limit exists.
    commonTrap: Looking only at the vanishing reciprocal perturbation.
    verification: {method: parity-partial-sum-limits, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-003
    topicId: sequences-series
    skills: [apply-the-cauchy-criterion-for-series]
    archetype: tail-sum-condition
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires translating sequence Cauchy behavior into arbitrary finite tails.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which condition is equivalent to convergence of $\sum a_n$?
    choices: [{id: a, text: 'For every $\varepsilon>0$, all sufficiently late finite tails satisfy $|\sum_{k=m}^{n}a_k|<\varepsilon$.'}, {id: b, text: '$a_n\to0$.'}, {id: c, text: '$|a_{n+1}-a_n|\to0$.'}, {id: d, text: 'The terms are bounded.'}]
    answer: {choiceId: a}
    solutionOutline: A finite tail is the difference $S_n-S_{m-1}$, so this is exactly the Cauchy criterion for the partial sums.
    commonTrap: Replacing the sufficient-and-necessary tail condition with the merely necessary term test.
    verification: {method: partial-sum-cauchy-equivalence, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-004
    topicId: sequences-series
    skills: [use-linearity-of-convergent-series]
    archetype: linear-combination-of-sums
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires tracking coefficients through limits of partial sums.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $\sum a_n=3$ and $\sum b_n=-2$, what is
      $\sum(4a_n-5b_n)$?
    choices: [{id: a, text: '$22$'}, {id: b, text: '$2$'}, {id: c, text: '$-22$'}, {id: d, text: 'Cannot be determined'}]
    answer: {choiceId: a}
    solutionOutline: Linearity gives $4(3)-5(-2)=22$.
    commonTrap: Losing the negative sign in the second series sum.
    verification: {method: partial-sum-linearity, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-005
    topicId: sequences-series
    skills: [analyze-telescoping-boundaries]
    archetype: shifted-reciprocal-difference
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires forming a finite partial sum and retaining two boundary terms.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\displaystyle\sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+2}\right)$.
    choices: [{id: a, text: '$3/2$'}, {id: b, text: '$1$'}, {id: c, text: '$1/2$'}, {id: d, text: 'Diverges'}]
    answer: {choiceId: a}
    solutionOutline: The Nth partial sum leaves $1+1/2-1/(N+1)-1/(N+2)$.
    commonTrap: Keeping only one initial survivor despite the shift by two.
    verification: {method: exact-telescoping-partial-sum, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-006
    topicId: sequences-series
    skills: [choose-direct-comparison-directions]
    archetype: divergent-lower-bound
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires deriving a useful lower bound rather than an irrelevant upper bound.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which comparison proves that
      $\sum_{n=1}^{\infty}1/\sqrt{n^2+n}$ diverges?
    choices: [{id: a, text: '$1/\sqrt{n^2+n}\ge1/(\sqrt2\,n)$ for $n\ge1$'}, {id: b, text: '$1/\sqrt{n^2+n}\le1/n$'}, {id: c, text: '$1/\sqrt{n^2+n}\le1/\sqrt n$'}, {id: d, text: 'The terms are positive.'}]
    answer: {choiceId: a}
    solutionOutline: Since $n^2+n\le2n^2$, the terms dominate a constant multiple of the harmonic series.
    commonTrap: Using an upper bound by a divergent series, which proves nothing.
    verification: {method: harmonic-lower-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-007
    topicId: sequences-series
    skills: [apply-limit-comparison]
    archetype: rational-leading-order
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires selecting a benchmark from the difference in polynomial degrees.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the best benchmark for
      $\sum_{n=1}^{\infty}(5n^2+1)/(n^4+3n)$?
    choices: [{id: a, text: '$\sum1/n^2$'}, {id: b, text: '$\sum1/n$'}, {id: c, text: '$\sum1/n^4$'}, {id: d, text: '$\sum(1/2)^n$'}]
    answer: {choiceId: a}
    solutionOutline: The summand is asymptotic to $5/n^2$, producing a finite positive limit-comparison constant.
    commonTrap: Matching only the denominator degree and choosing $1/n^4$.
    verification: {method: dominant-power-limit-comparison, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-008
    topicId: sequences-series
    skills: [select-the-ratio-test]
    archetype: polynomial-times-exponential
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires simplifying a consecutive ratio containing both polynomial and exponential factors.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For $\sum n^3/4^n$, what is
      $\lim_{n\to\infty}a_{n+1}/a_n$?
    choices: [{id: a, text: '$1/4$'}, {id: b, text: '$3/4$'}, {id: c, text: '$1$'}, {id: d, text: '$0$'}]
    answer: {choiceId: a}
    solutionOutline: The ratio is $[(n+1)/n]^3/4$, whose polynomial factor tends to one.
    commonTrap: Treating the exponent three as a multiplicative limit factor.
    verification: {method: consecutive-ratio-limit, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-009
    topicId: sequences-series
    skills: [apply-the-root-test]
    archetype: nth-power-with-rational-base-limit
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires taking an exact nth root before evaluating a rational limit.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What does the root test conclude for
      $\sum[(2n+1)/(3n-1)]^n$?
    choices: [{id: a, text: 'Absolute convergence because the root limit is $2/3$.'}, {id: b, text: 'Divergence because the root limit is $3/2$.'}, {id: c, text: 'Inconclusive because the root limit is $1$.'}, {id: d, text: 'Conditional convergence'}]
    answer: {choiceId: a}
    solutionOutline: The nth root removes the exponent and the remaining rational sequence tends to two thirds.
    commonTrap: Inverting the leading-coefficient ratio.
    verification: {method: exact-root-and-rational-limit, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-010
    topicId: sequences-series
    skills: [use-integral-test-remainder-bounds]
    archetype: p-series-tail-bracket
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires selecting the correct lower and upper tail integrals.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For $R_N=\sum_{n=N+1}^{\infty}1/n^2$, which bound is correct?
    choices: [{id: a, text: '$1/(N+1)\le R_N\le1/N$'}, {id: b, text: '$1/N\le R_N\le1/(N+1)$'}, {id: c, text: '$R_N=1/N^2$'}, {id: d, text: '$R_N\ge1$'}]
    answer: {choiceId: a}
    solutionOutline: For decreasing $1/x^2$, integrate from N+1 for the lower bound and from N for the upper bound.
    commonTrap: Reversing the bounds because the lower integral starts later.
    verification: {method: integral-tail-sandwich, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-011
    topicId: sequences-series
    skills: [distinguish-term-and-series-limits]
    archetype: zero-term-limit-counterexample
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires identifying the exact logical limitation of the divergence test.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $a_n\to0$, which conclusion about $\sum a_n$ is valid?
    choices: [{id: a, text: 'No convergence conclusion follows without more information.'}, {id: b, text: 'The series converges.'}, {id: c, text: 'The series converges absolutely.'}, {id: d, text: 'The series diverges.'}]
    answer: {choiceId: a}
    solutionOutline: Both the convergent $\sum1/n^2$ and divergent harmonic series have terms approaching zero.
    commonTrap: Reversing the necessary condition for convergence.
    verification: {method: contrasting-counterexamples, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-012
    topicId: sequences-series
    skills: [classify-series-under-finite-changes]
    archetype: finite-prefix-invariance
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires separating convergence behavior from the numerical sum.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Changing finitely many terms of a convergent series can have which effect?
    choices: [{id: a, text: 'It can change the sum but not convergence.'}, {id: b, text: 'It can force divergence.'}, {id: c, text: 'It cannot change the sum.'}, {id: d, text: 'It always creates absolute convergence.'}]
    answer: {choiceId: a}
    solutionOutline: The unchanged tail retains convergence, while the finite prefix contributes a possibly different finite amount.
    commonTrap: Confusing invariance of convergence with invariance of the sum.
    verification: {method: finite-prefix-tail-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-013
    topicId: sequences-series
    skills: [analyze-difference-series]
    archetype: general-telescoping-criterion
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires expressing partial sums through endpoint sequence values.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $b_n\to L$, what is
      $\sum_{n=1}^{\infty}(b_n-b_{n+1})$?
    choices: [{id: a, text: '$b_1-L$'}, {id: b, text: '$L-b_1$'}, {id: c, text: '$L$'}, {id: d, text: 'It always diverges.'}]
    answer: {choiceId: a}
    solutionOutline: The Nth partial sum is $b_1-b_{N+1}$, whose limit is $b_1-L$.
    commonTrap: Discarding both boundary terms because the middle terms cancel.
    verification: {method: endpoint-partial-sum-formula, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-014
    topicId: sequences-series
    skills: [detect-divergent-telescoping-boundaries]
    archetype: logarithmic-increment-series
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires converting terms to differences and then checking an unbounded boundary.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}\ln[(n+1)/n]$.
    choices: [{id: a, text: 'Divergent'}, {id: b, text: 'Convergent to $\ln2$'}, {id: c, text: 'Convergent to $1$'}, {id: d, text: 'Conditionally convergent'}]
    answer: {choiceId: a}
    solutionOutline: The partial sum telescopes in logarithms to $\ln(N+1)$, which is unbounded.
    commonTrap: Assuming cancellation alone makes the surviving boundary finite.
    verification: {method: logarithmic-partial-sum-boundary, result: verified}
    reviewStatus: verified
  - id: calc2-overview-hard-015
    topicId: sequences-series
    skills: [classify-parameterized-geometric-series]
    archetype: rational-ratio-parameter
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires solving an absolute-value inequality for a parameterized ratio.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      For which real $x$ does
      $\sum_{n=0}^{\infty}[(x-1)/(x+1)]^n$ converge?
    choices: [{id: a, text: '$x>0$'}, {id: b, text: '$x<0$'}, {id: c, text: '$x\ne-1$'}, {id: d, text: '$-1<x<1$'}]
    answer: {choiceId: a}
    solutionOutline: The condition $|x-1|<|x+1|$ means x is closer to one than to negative one, equivalently x is positive.
    commonTrap: Solving numerator and denominator inequalities separately instead of comparing squared distances.
    verification: {method: geometric-ratio-distance-inequality, result: verified}
    reviewStatus: verified
