schemaVersion: 1
bankId: calc2-arithmetic-series-hard
categoryId: calculus-2
topicIds: [arithmetic-series]
minimumItemCount: 15
items:
  - id: calc2-arith-hard-001
    topicId: arithmetic-series
    skills: [solve-arithmetic-series-from-separated-terms]
    archetype: two-terms-and-finite-sum
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires recovering the first term and difference before evaluating a sum.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      An arithmetic sequence satisfies $a_4=13$ and $a_{11}=34$. What is
      $S_{20}$?
    choices: [{id: a, text: '$650$'}, {id: b, text: '$620$'}, {id: c, text: '$680$'}, {id: d, text: '$470$'}]
    answer: {choiceId: a}
    solutionOutline: Seven steps increase by 21, so d equals three and $a_1=4$; then $a_{20}=61$ and $S_{20}=20(4+61)/2=650$.
    commonTrap: Dividing the term difference by eleven rather than the index gap seven.
    verification: {method: recover-parameters-and-sum, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-002
    topicId: arithmetic-series
    skills: [solve-constrained-arithmetic-triples]
    archetype: sum-and-product-of-three-terms
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires centering three consecutive arithmetic terms around their mean.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Three consecutive terms of an increasing arithmetic sequence have sum
      $24$ and product $440$. What is the common difference?
    choices: [{id: a, text: '$3$'}, {id: b, text: '$2$'}, {id: c, text: '$4$'}, {id: d, text: '$5$'}]
    answer: {choiceId: a}
    solutionOutline: Write the terms as $8-d,8,8+d$; their product is $8(64-d^2)=440$, so $d^2=9$ and increasing selects d equals three.
    commonTrap: Keeping the negative square root despite the stated increasing order.
    verification: {method: centered-triple-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-003
    topicId: arithmetic-series
    skills: [sum-multiples-with-inclusion-exclusion]
    archetype: union-of-two-progressions
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires summing two arithmetic progressions and subtracting their overlap.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What is the sum of all positive integers at most $100$ that are
      divisible by $3$ or $5$?
    choices: [{id: a, text: '$2418$'}, {id: b, text: '$2733$'}, {id: c, text: '$1683$'}, {id: d, text: '$3150$'}]
    answer: {choiceId: a}
    solutionOutline: Multiples of three sum to 1683, multiples of five to 1050, and multiples of fifteen to 315; inclusion–exclusion gives 2418.
    commonTrap: Double-counting multiples of fifteen.
    verification: {method: arithmetic-sums-inclusion-exclusion, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-004
    topicId: arithmetic-series
    skills: [recover-sequences-from-quadratic-partial-sums]
    archetype: parameterized-discrete-difference
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires exact differencing and identification of the resulting common difference.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $S_n=3n^2-2n$, which pair $(a_1,d)$ describes the arithmetic
      sequence of terms?
    choices: [{id: a, text: '$(1,6)$'}, {id: b, text: '$(3,-2)$'}, {id: c, text: '$(1,3)$'}, {id: d, text: '$(5,6)$'}]
    answer: {choiceId: a}
    solutionOutline: $a_n=S_n-S_{n-1}=6n-5$, so the first term is one and successive terms differ by six.
    commonTrap: Reading the coefficients of the partial-sum polynomial directly as sequence parameters.
    verification: {method: polynomial-discrete-difference, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-005
    topicId: arithmetic-series
    skills: [evaluate-weighted-arithmetic-sums]
    archetype: index-times-linear-term
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires reducing a weighted arithmetic sum to standard first- and second-power sums.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{k=1}^{10}k(2k-1)$.
    choices: [{id: a, text: '$715$'}, {id: b, text: '$660$'}, {id: c, text: '$770$'}, {id: d, text: '$385$'}]
    answer: {choiceId: a}
    solutionOutline: The sum is $2\sum k^2-\sum k=2(385)-55=715$.
    commonTrap: Treating the products $k(2k-1)$ as an arithmetic progression.
    verification: {method: power-sum-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-006
    topicId: arithmetic-series
    skills: [evaluate-alternating-finite-arithmetic-sums]
    archetype: pairwise-alternating-linear-terms
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires pairing a finite number of signed terms and handling parity.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Find $1-4+7-10+\cdots+97-100$.
    choices: [{id: a, text: '$-51$'}, {id: b, text: '$-50$'}, {id: c, text: '$51$'}, {id: d, text: '$-100$'}]
    answer: {choiceId: a}
    solutionOutline: There are thirty-four terms, forming seventeen pairs, each equal to negative three; the sum is negative fifty-one.
    commonTrap: Pairing a positive term with the wrong following negative term.
    verification: {method: signed-pair-count, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-007
    topicId: arithmetic-series
    skills: [solve-integer-term-count-constraints]
    archetype: triangular-number-equation
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires solving a quadratic and rejecting a noninteger or negative root.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      The sum $1+2+\cdots+n$ is $1275$. What is n?
    choices: [{id: a, text: '$50$'}, {id: b, text: '$49$'}, {id: c, text: '$51$'}, {id: d, text: '$25$'}]
    answer: {choiceId: a}
    solutionOutline: Solve $n(n+1)/2=1275$, or $n^2+n-2550=0$, whose positive root is fifty.
    commonTrap: Taking the square root of 1275 directly.
    verification: {method: triangular-quadratic-solution, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-008
    topicId: arithmetic-series
    skills: [reason-about-arithmetic-subsequences]
    archetype: every-mth-term
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires deriving parameters of a sampled subsequence.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $(a_n)$ is arithmetic with $a_1=2$ and $d=5$, what is the common
      difference of $(a_{3n})_{n\ge1}$?
    choices: [{id: a, text: '$15$'}, {id: b, text: '$5$'}, {id: c, text: '$10$'}, {id: d, text: '$6$'}]
    answer: {choiceId: a}
    solutionOutline: Increasing n by one advances the original index by three positions, accumulating three differences of five.
    commonTrap: Keeping the original common difference despite skipping terms.
    verification: {method: sampled-index-increment, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-009
    topicId: arithmetic-series
    skills: [use-equal-sum-segments]
    archetype: split-arithmetic-list
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires comparing a partial sum with half of a full arithmetic sum.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      The integers $1,2,\ldots,20$ are split after k so the first block has
      the same sum as the second. Which statement is correct?
    choices: [{id: a, text: 'No integer k works.'}, {id: b, text: '$k=14$'}, {id: c, text: '$k=15$'}, {id: d, text: '$k=10$'}]
    answer: {choiceId: b}
    solutionOutline: The total is 210, so one block needs sum 105; $14\cdot15/2=105$, hence k equals fourteen.
    commonTrap: Estimating the split from the number of terms instead of solving the triangular-number equation.
    verification: {method: half-total-triangular-check, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-010
    topicId: arithmetic-series
    skills: [compare-arithmetic-series-averages]
    archetype: changed-endpoints-fixed-count
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires tracking how endpoint changes affect a fixed-count sum.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A 30-term arithmetic series has both its first and last terms increased
      by $4$, with terms remaining arithmetic. How much does its sum increase?
    choices: [{id: a, text: '$120$'}, {id: b, text: '$60$'}, {id: c, text: '$240$'}, {id: d, text: '$8$'}]
    answer: {choiceId: a}
    solutionOutline: Increasing both endpoints by four increases their average by four, so thirty terms add 120.
    commonTrap: Adding only the two endpoint changes rather than recognizing every term shifts by four.
    verification: {method: endpoint-average-shift, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-011
    topicId: arithmetic-series
    skills: [solve-digit-arithmetic-progressions]
    archetype: three-digit-number
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires combining a digit progression with a place-value equation.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      The digits of a three-digit number form an increasing arithmetic
      sequence. Their sum is $15$, and reversing the digits increases the
      number by $396$. What is the number?
    choices: [{id: a, text: '$357$'}, {id: b, text: '$246$'}, {id: c, text: '$159$'}, {id: d, text: '$468$'}]
    answer: {choiceId: a}
    solutionOutline: Write the digits as $5-d,5,5+d$; reversal changes the number by $198d$, so d equals two and the number is 357.
    commonTrap: Treating the reversal difference as the difference between digit sums, which is zero.
    verification: {method: centered-digits-place-value-equation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-012
    topicId: arithmetic-series
    skills: [sum-nested-arithmetic-series]
    archetype: cumulative-triangular-sum
    difficulty: hard
    reasoningDepth: 5
    difficultyEvidence: Requires interchanging a finite double sum or using a quadratic sum formula.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{k=1}^{10}(1+2+\cdots+k)$.
    choices: [{id: a, text: '$220$'}, {id: b, text: '$385$'}, {id: c, text: '$55$'}, {id: d, text: '$275$'}]
    answer: {choiceId: a}
    solutionOutline: The kth inner sum is $k(k+1)/2$, so the total is one half of $\sum k^2+\sum k=(385+55)/2=220$.
    commonTrap: Replacing every inner sum by the final triangular number 55.
    verification: {method: triangular-number-summation, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-013
    topicId: arithmetic-series
    skills: [derive-sums-from-average-constraints]
    archetype: mean-and-count
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires recognizing that an arithmetic-series average determines the sum independently of the difference.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A 17-term arithmetic sequence has middle term $42$. What is the sum of
      all 17 terms?
    choices: [{id: a, text: '$714$'}, {id: b, text: '$672$'}, {id: c, text: '$756$'}, {id: d, text: 'Cannot be determined'}]
    answer: {choiceId: a}
    solutionOutline: The middle term equals the average of all terms, so the sum is $17\cdot42=714$.
    commonTrap: Assuming the common difference is needed despite symmetry.
    verification: {method: odd-count-middle-average, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-014
    topicId: arithmetic-series
    skills: [analyze-modular-arithmetic-progressions]
    archetype: residue-class-count-and-sum
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires identifying and summing a residue class in a bounded interval.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Find the sum of integers $n$ with $1\le n\le200$ and
      $n\equiv2\pmod7$.
    choices: [{id: a, text: '$2813$'}, {id: b, text: '$2900$'}, {id: c, text: '$2716$'}, {id: d, text: '$2871$'}]
    answer: {choiceId: b}
    solutionOutline: The progression is 2 through 198 with 29 terms, so its sum is $29(2+198)/2=2900$.
    commonTrap: Miscounting the residue-class endpoints.
    verification: {method: residue-progression-endpoint-count, result: verified}
    reviewStatus: verified
  - id: calc2-arith-hard-015
    topicId: arithmetic-series
    skills: [prove-equal-distance-term-identities]
    archetype: symmetric-index-sums
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires using the linear dependence of arithmetic terms on their indices.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      In any arithmetic sequence, which identity holds whenever
      $i+j=r+s$?
    choices: [{id: a, text: '$a_i+a_j=a_r+a_s$'}, {id: b, text: '$a_ia_j=a_ra_s$'}, {id: c, text: '$a_i-a_j=a_r-a_s$'}, {id: d, text: '$a_i/a_j=a_r/a_s$'}]
    answer: {choiceId: a}
    solutionOutline: Using $a_k=a_1+(k-1)d$, each pair sum depends only on the sum of its indices.
    commonTrap: Extending the additive symmetry to products or ratios.
    verification: {method: explicit-linear-index-formula, result: verified}
    reviewStatus: verified
