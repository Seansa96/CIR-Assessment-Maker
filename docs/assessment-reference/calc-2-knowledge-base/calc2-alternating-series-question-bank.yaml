schemaVersion: 1
bankId: calc2-alternating-series
categoryId: calculus-2
topicIds:
  - alternating-series
minimumItemCount: 15
items:
  - id: calc2-alt-001
    topicId: alternating-series
    skills: [recognize-alternating-series]
    archetype: sign-pattern
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires separating a sign pattern from the positive magnitude sequence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Which expression writes $1-\frac12+\frac13-\frac14+\cdots$ using a
      positive magnitude sequence?
    choices:
      - { id: a, text: '$\sum_{n=1}^{\infty}(-1)^{n-1}/n$' }
      - { id: b, text: '$\sum_{n=1}^{\infty}(-1)^n n$' }
      - { id: c, text: '$\sum_{n=1}^{\infty}1/n$' }
      - { id: d, text: '$\sum_{n=1}^{\infty}(-1)^{n-1}n$' }
    answer: { choiceId: a }
    solutionOutline: Substituting $n=1,2,3$ into $(-1)^{n-1}/n$ reproduces the signs and reciprocals in order.
    commonTrap: Choosing $(-1)^n/n$, which starts with a negative term instead of the displayed positive term.
    verification: { method: first-three-terms-check, result: verified }
    reviewStatus: verified

  - id: calc2-alt-002
    topicId: alternating-series
    skills: [verify-alternating-series-hypotheses]
    archetype: theorem-conditions
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying both hypotheses on the magnitude sequence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $\sum(-1)^{n-1}b_n$ with $b_n\ge0$, which pair of conditions is
      sufficient for the alternating-series test?
    choices:
      - { id: a, text: '$b_n$ is eventually nonincreasing and $b_n\to0$.' }
      - { id: b, text: '$b_n$ is bounded and $b_n\to1$.' }
      - { id: c, text: '$b_n$ is increasing and positive.' }
      - { id: d, text: '$\sum b_n$ converges and $b_n$ increases.' }
    answer: { choiceId: a }
    solutionOutline: The theorem uses eventual nonincrease to trap partial sums and a zero magnitude limit to make the trap width vanish.
    commonTrap: Replacing the zero-limit condition with boundedness, which does not prevent nonzero alternating terms.
    verification: { method: alternating-series-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-alt-003
    topicId: alternating-series
    skills: [apply-the-divergence-test]
    archetype: failed-zero-limit
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires checking the necessary term condition before invoking alternating signs.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      What happens to $\sum_{n=1}^{\infty}(-1)^n(2+1/n)$?
    choices:
      - { id: a, text: It converges by the alternating-series test. }
      - { id: b, text: It converges absolutely. }
      - { id: c, text: It diverges because its terms do not approach zero. }
      - { id: d, text: It telescopes to $2$. }
    answer: { choiceId: c }
    solutionOutline: The magnitudes approach $2$, so the signed terms oscillate near $\pm2$ and violate a necessary condition for series convergence.
    commonTrap: Treating alternating signs as sufficient even when term magnitudes have a nonzero limit.
    verification: { method: term-limit-test, result: verified }
    reviewStatus: verified

  - id: calc2-alt-004
    topicId: alternating-series
    skills: [interpret-eventual-monotonicity]
    archetype: finite-exception
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing that finitely many early violations do not affect convergence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A positive sequence satisfies $b_n\to0$ and $b_{n+1}\le b_n$ for every
      $n\ge20$, but not for all earlier indices. What can be said about
      $\sum(-1)^n b_n$?
    choices:
      - { id: a, text: It converges by applying the alternating-series test to the tail. }
      - { id: b, text: It must diverge because monotonicity fails once. }
      - { id: c, text: It converges absolutely. }
      - { id: d, text: Its terms have a nonzero limit. }
    answer: { choiceId: a }
    solutionOutline: Removing the first nineteen terms leaves a decreasing-to-zero alternating tail, and finitely many terms do not change convergence.
    commonTrap: Requiring monotonicity from the first index rather than eventually.
    verification: { method: finite-tail-invariance, result: verified }
    reviewStatus: verified

  - id: calc2-alt-005
    topicId: alternating-series
    skills: [limit-alternating-test-conclusions]
    archetype: conclusion-scope
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires distinguishing ordinary convergence from absolute convergence.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      After verifying the alternating-series hypotheses, which conclusion is
      justified immediately?
    choices:
      - { id: a, text: The signed series converges. }
      - { id: b, text: The series of absolute values converges. }
      - { id: c, text: The exact sum equals the first term. }
      - { id: d, text: Every rearrangement has the same sum. }
    answer: { choiceId: a }
    solutionOutline: The alternating-series test proves convergence of the signed partial sums but makes no absolute-convergence claim.
    commonTrap: Upgrading the theorem's conclusion to absolute convergence without testing $\sum b_n$.
    verification: { method: theorem-conclusion-review, result: verified }
    reviewStatus: verified

  - id: calc2-alt-006
    topicId: alternating-series
    skills: [classify-conditional-convergence]
    archetype: harmonic-boundary
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires combining two different convergence tests into one classification.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      How is $\sum_{n=1}^{\infty}(-1)^{n-1}/n$ classified?
    choices:
      - { id: a, text: Absolutely convergent }
      - { id: b, text: Conditionally convergent }
      - { id: c, text: Divergent by the term test }
      - { id: d, text: Geometric }
    answer: { choiceId: b }
    solutionOutline: Decreasing magnitudes tending to zero give signed convergence, while the absolute-value harmonic series diverges.
    commonTrap: Inferring divergence of the signed series from divergence after absolute values are taken.
    verification: { method: alternating-and-p-series-tests, result: verified }
    reviewStatus: verified

  - id: calc2-alt-007
    topicId: alternating-series
    skills: [classify-absolute-convergence]
    archetype: absolute-p-series
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires testing absolute values before choosing the strongest classification.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Classify $\sum_{n=1}^{\infty}(-1)^n/n^3$.
    choices:
      - { id: a, text: Absolutely convergent }
      - { id: b, text: Conditionally convergent }
      - { id: c, text: Divergent because it alternates }
      - { id: d, text: Inconclusive by every standard test }
    answer: { choiceId: a }
    solutionOutline: Its absolute-value series is the convergent $p$-series $\sum1/n^3$, so absolute convergence is established directly.
    commonTrap: Labeling every convergent alternating series conditional without checking the magnitudes.
    verification: { method: p-series-classification, result: verified }
    reviewStatus: verified

  - id: calc2-alt-008
    topicId: alternating-series
    skills: [apply-alternating-remainder-bound]
    archetype: next-term-error
    difficulty: foundation
    reasoningDepth: 1
    difficultyEvidence: Requires identifying the first omitted magnitude rather than the last included one.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $\sum_{n=1}^{\infty}(-1)^{n-1}/n^2$, what bound does the
      alternating remainder theorem give after $N$ terms?
    choices:
      - { id: a, text: '$|R_N|\le1/(N+1)^2$' }
      - { id: b, text: '$|R_N|\le1/N^2$ only' }
      - { id: c, text: '$|R_N|=1/(N+1)^2$' }
      - { id: d, text: '$|R_N|\le1/(N+1)$' }
    answer: { choiceId: a }
    solutionOutline: The error is at most the magnitude $b_{N+1}$ of the first omitted term.
    commonTrap: Replacing the theorem's inequality with an unsupported equality.
    verification: { method: alternating-remainder-theorem, result: verified }
    reviewStatus: verified

  - id: calc2-alt-009
    topicId: alternating-series
    skills: [solve-remainder-inequalities]
    archetype: least-term-count
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires preserving a strict accuracy requirement and finding the least integer.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For the alternating harmonic series, what is the least $N$ for which the
      next-term bound guarantees $|R_N|<1/20$?
    choices:
      - { id: a, text: '$N=19$' }
      - { id: b, text: '$N=20$' }
      - { id: c, text: '$N=21$' }
      - { id: d, text: '$N=400$' }
    answer: { choiceId: b }
    solutionOutline: Solve $1/(N+1)<1/20$, giving $N+1>20$; the least integer is $N=20$.
    commonTrap: Choosing $N=19$, which yields a bound equal to $1/20$ rather than strictly smaller.
    verification: { method: boundary-inequality-check, result: verified }
    reviewStatus: verified

  - id: calc2-alt-010
    topicId: alternating-series
    skills: [determine-remainder-signs]
    archetype: over-under-estimate
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires tracking the sign of the first omitted term.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Let $S=1-\frac12+\frac13-\cdots$. Is $S_4$ an overestimate or an
      underestimate of $S$?
    choices:
      - { id: a, text: Overestimate, because the first omitted term is positive. }
      - { id: b, text: Underestimate, because the first omitted term is positive. }
      - { id: c, text: Exact, because four terms cancel. }
      - { id: d, text: Impossible to determine from alternation. }
    answer: { choiceId: b }
    solutionOutline: The fifth term is positive, so $R_4=S-S_4>0$ and the true sum lies above $S_4$.
    commonTrap: Calling a positive next correction an overestimate rather than an underestimate.
    verification: { method: remainder-sign-tracking, result: verified }
    reviewStatus: verified

  - id: calc2-alt-011
    topicId: alternating-series
    skills: [bracket-alternating-series-sums]
    archetype: consecutive-partial-sum-bracket
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires using opposite-sided consecutive partial sums.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For a decreasing positive magnitude sequence beginning with a positive
      term, which interval must contain the series sum?
    choices:
      - { id: a, text: 'The interval with endpoints $S_{2k}$ and $S_{2k+1}$' }
      - { id: b, text: '$[0,b_{2k}]$ for every $k$' }
      - { id: c, text: 'The interval with endpoints $b_{2k}$ and $b_{2k+1}$' }
      - { id: d, text: '$[S_{2k}-1,S_{2k}+1]$ only' }
    answer: { choiceId: a }
    solutionOutline: Even and odd partial sums approach from opposite sides, so every consecutive pair of opposite parity brackets the limit.
    commonTrap: Bracketing with term magnitudes instead of accumulated partial sums.
    verification: { method: nested-partial-sum-intervals, result: verified }
    reviewStatus: verified

  - id: calc2-alt-012
    topicId: alternating-series
    skills: [verify-monotonicity]
    archetype: derivative-check
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires interpreting the sign of a derivative on the relevant discrete domain.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      For $b_n=n/(n^2+4)$, which fact proves the magnitudes eventually decrease?
    choices:
      - { id: a, text: '$f''(x)=(4-x^2)/(x^2+4)^2<0$ for $x>2$.' }
      - { id: b, text: '$f(x)>0$ for $x>0$.' }
      - { id: c, text: '$f(1)<1$.' }
      - { id: d, text: '$f''(x)>0$ for $x>2$.' }
    answer: { choiceId: a }
    solutionOutline: Extending to $f(x)=x/(x^2+4)$ shows it is decreasing on $(2,\infty)$, which is enough for the discrete tail.
    commonTrap: Using positivity of $f$ as though it implied monotonic decrease.
    verification: { method: quotient-rule-and-sign-analysis, result: verified }
    reviewStatus: verified

  - id: calc2-alt-013
    topicId: alternating-series
    skills: [check-test-applicability]
    archetype: nonmonotone-counterexample
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires recognizing that a zero limit alone does not satisfy the stated theorem.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      Suppose $b_n>0$ and $b_n\to0$, but $b_n$ has infinitely many increases.
      What is the correct conclusion about $\sum(-1)^n b_n$ from the
      alternating-series test alone?
    choices:
      - { id: a, text: The test is not applicable; another argument is needed. }
      - { id: b, text: The series necessarily converges. }
      - { id: c, text: The series necessarily diverges. }
      - { id: d, text: The series converges absolutely. }
    answer: { choiceId: a }
    solutionOutline: The theorem's eventual monotonicity hypothesis has not been established, so it supplies no verdict even though other methods might.
    commonTrap: Concluding divergence whenever the conditions of a sufficient test fail.
    verification: { method: hypothesis-logic-review, result: verified }
    reviewStatus: verified

  - id: calc2-alt-014
    topicId: alternating-series
    skills: [estimate-alternating-series-values]
    archetype: error-interval
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires converting a remainder bound into an interval centered at a partial sum.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      A valid alternating approximation has $S_{10}=0.742$ and
      $b_{11}=0.006$. Which interval is guaranteed to contain $S$?
    choices:
      - { id: a, text: '$[0.736,0.748]$' }
      - { id: b, text: '$[0.742,0.748]$ only, regardless of the next sign' }
      - { id: c, text: '$[0.006,0.742]$' }
      - { id: d, text: '$[0.748,0.754]$' }
    answer: { choiceId: a }
    solutionOutline: The absolute error inequality $|S-S_{10}|\le0.006$ places $S$ within $0.006$ on either side of $0.742$.
    commonTrap: Using the first omitted magnitude as an endpoint rather than as an error radius.
    verification: { method: absolute-value-inequality, result: verified }
    reviewStatus: verified

  - id: calc2-alt-015
    topicId: alternating-series
    skills: [select-convergence-tests]
    archetype: method-selection
    difficulty: intermediate
    reasoningDepth: 2
    difficultyEvidence: Requires selecting a method that answers both convergence and classification efficiently.
    assessmentUses: [easy-quiz]
    questionType: multipleChoice
    prompt: |
      To classify $\sum_{n=2}^{\infty}(-1)^n/[n\ln n]$, which plan is most
      direct?
    choices:
      - { id: a, text: Use the alternating-series test, then the integral test on $\sum1/(n\ln n)$. }
      - { id: b, text: Use only the divergence test because the terms approach zero. }
      - { id: c, text: Use the geometric-series formula. }
      - { id: d, text: Use only the ratio test, whose limit is $1$. }
    answer: { choiceId: a }
    solutionOutline: The magnitudes decrease to zero, while the absolute-value series diverges because $\int_2^\infty dx/(x\ln x)$ is unbounded; the result is conditional.
    commonTrap: Treating an inconclusive ratio limit or zero term limit as a final classification.
    verification: { method: alternating-and-integral-tests, result: verified }
    reviewStatus: verified
