schemaVersion: 1
bankId: calc2-series-fundamentals-hard
categoryId: calculus-2
topicIds: [series-fundamentals]
minimumItemCount: 15
items:
  - id: calc2-series-hard-001
    topicId: series-fundamentals
    skills: [recover-series-terms-from-partial-sums]
    archetype: exponential-partial-sum-difference
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires differencing a convergent partial-sum formula and treating the first term consistently.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A series has partial sums $S_n=3-2^{-n}$. What is $a_n$ for $n\ge2$?
    choices: [{id: a, text: '$2^{-n}$'}, {id: b, text: '$-2^{-n}$'}, {id: c, text: '$3-2^{-n}$'}, {id: d, text: '$2^{1-n}$'}]
    answer: {choiceId: a}
    solutionOutline: $a_n=S_n-S_{n-1}=(3-2^{-n})-(3-2^{1-n})=2^{-n}$.
    commonTrap: Reporting the partial-sum formula as the term formula.
    verification: {method: adjacent-partial-sum-difference, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-002
    topicId: series-fundamentals
    skills: [interpret-remainders]
    archetype: exact-tail-from-partial-sum
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires subtracting a partial sum from the limiting sum.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $S_n=5-3/(n+2)$, what is the exact remainder $R_n=S-S_n$?
    choices: [{id: a, text: '$3/(n+2)$'}, {id: b, text: '$5-3/(n+2)$'}, {id: c, text: '$3/n$'}, {id: d, text: '$-3/(n+2)$'}]
    answer: {choiceId: a}
    solutionOutline: The partial sums approach five, so $R_n=5-[5-3/(n+2)]$.
    commonTrap: Confusing the remainder with the partial sum itself.
    verification: {method: limit-minus-partial-sum, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-003
    topicId: series-fundamentals
    skills: [use-tail-invariance]
    archetype: finite-prefix-replacement
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires separating convergence from the numerical sum under finite changes.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A convergent series has its first ten terms replaced. What is guaranteed?
    choices: [{id: a, text: 'It still converges, but generally to a different sum.'}, {id: b, text: 'It diverges.'}, {id: c, text: 'Its sum is unchanged.'}, {id: d, text: 'It becomes absolutely convergent.'}]
    answer: {choiceId: a}
    solutionOutline: The unchanged tail converges; only the finite prefix contribution changes.
    commonTrap: Treating invariance of convergence as invariance of value.
    verification: {method: finite-prefix-tail-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-004
    topicId: series-fundamentals
    skills: [apply-the-cauchy-criterion]
    archetype: finite-tail-control
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires expressing Cauchy behavior directly in term sums.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Which property is equivalent to convergence of $\sum a_n$?
    choices: [{id: a, text: 'Every sufficiently late finite tail $\sum_{k=m}^{n}a_k$ has arbitrarily small magnitude.'}, {id: b, text: '$a_n\to0$.'}, {id: c, text: 'The terms are bounded.'}, {id: d, text: 'Adjacent terms become arbitrarily close.'}]
    answer: {choiceId: a}
    solutionOutline: A finite tail equals the difference of two partial sums, so the statement is precisely their Cauchy criterion.
    commonTrap: Substituting the necessary zero-term condition for an equivalent criterion.
    verification: {method: series-cauchy-equivalence, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-005
    topicId: series-fundamentals
    skills: [evaluate-shifted-geometric-series]
    archetype: nonzero-start-index
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires identifying the first term after an index shift.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Evaluate $\sum_{n=3}^{\infty}5(2/3)^n$.
    choices: [{id: a, text: '$40/9$'}, {id: b, text: '$5$'}, {id: c, text: '$10/9$'}, {id: d, text: '$15$'}]
    answer: {choiceId: a}
    solutionOutline: The first included term is $5(8/27)=40/27$, and division by $1-2/3$ gives $40/9$.
    commonTrap: Using five as the first term despite the series beginning at n equals three.
    verification: {method: shifted-geometric-tail, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-006
    topicId: series-fundamentals
    skills: [convert-repeating-decimals-to-series]
    archetype: repeating-block-decimal
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires translating a two-digit repeating block into place-value terms.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      What fraction equals $0.\overline{27}$?
    choices: [{id: a, text: '$3/11$'}, {id: b, text: '$27/100$'}, {id: c, text: '$27/90$'}, {id: d, text: '$2/7$'}]
    answer: {choiceId: a}
    solutionOutline: The series is $(27/100)\sum_{k=0}^{\infty}(1/100)^k=27/99=3/11$.
    commonTrap: Treating the repeating decimal as the terminating decimal 0.27.
    verification: {method: place-value-geometric-series, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-007
    topicId: series-fundamentals
    skills: [evaluate-general-telescoping-series]
    archetype: sequence-difference-boundary
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires deriving a general boundary formula.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $b_n\to4$ and $b_1=9$, what is
      $\sum_{n=1}^{\infty}(b_n-b_{n+1})$?
    choices: [{id: a, text: '$5$'}, {id: b, text: '$13$'}, {id: c, text: '$-5$'}, {id: d, text: '$4$'}]
    answer: {choiceId: a}
    solutionOutline: The Nth partial sum is $b_1-b_{N+1}$, which approaches nine minus four.
    commonTrap: Keeping only the limiting boundary and dropping the initial one.
    verification: {method: endpoint-telescoping-limit, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-008
    topicId: series-fundamentals
    skills: [reason-about-bounded-partial-sums]
    archetype: bounded-not-convergent
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires distinguishing boundedness from convergence with an explicit series.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Does boundedness of the partial sums guarantee series convergence?
    choices: [{id: a, text: 'No; $\sum(-1)^n$ has bounded oscillating partial sums.'}, {id: b, text: 'Yes, by monotone convergence.'}, {id: c, text: 'Yes, because bounded terms approach zero.'}, {id: d, text: 'No, but only for unbounded terms.'}]
    answer: {choiceId: a}
    solutionOutline: Bounded sequences need not have limits unless another property such as monotonicity is present.
    commonTrap: Applying monotone convergence without checking monotonicity.
    verification: {method: oscillating-partial-sum-counterexample, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-009
    topicId: series-fundamentals
    skills: [use-nonnegative-partial-sum-monotonicity]
    archetype: bounded-positive-series
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires combining nonnegativity with a boundedness hypothesis.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Suppose $a_n\ge0$ and all partial sums satisfy $S_n\le12$. What follows?
    choices: [{id: a, text: 'The series converges to a value at most $12$.'}, {id: b, text: 'The series diverges because terms are positive.'}, {id: c, text: 'The sum equals $12$ exactly.'}, {id: d, text: 'The terms are eventually zero.'}]
    answer: {choiceId: a}
    solutionOutline: Nonnegative terms make partial sums monotone increasing, and the upper bound gives convergence.
    commonTrap: Turning an upper bound into an equality for the limit.
    verification: {method: monotone-bounded-partial-sums, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-010
    topicId: series-fundamentals
    skills: [apply-linearity-with-convergence-hypotheses]
    archetype: difference-of-convergent-series
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires identifying exactly when subtraction of infinite sums is valid.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $\sum a_n=A$ and $\sum b_n=B$ both converge, what is
      $\sum(a_n-b_n)$?
    choices: [{id: a, text: '$A-B$'}, {id: b, text: '$A+B$'}, {id: c, text: 'It must diverge.'}, {id: d, text: 'It equals zero.'}]
    answer: {choiceId: a}
    solutionOutline: Finite partial-sum linearity passes to the two existing limits.
    commonTrap: Applying linearity when one or both component series diverge.
    verification: {method: partial-sum-limit-linearity, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-011
    topicId: series-fundamentals
    skills: [distinguish-grouping-and-rearrangement]
    archetype: consecutive-finite-blocks
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires proving preservation using a subsequence of partial sums.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      A convergent series is grouped into finite consecutive blocks without
      changing order. What is guaranteed?
    choices: [{id: a, text: 'The grouped series has the same sum.'}, {id: b, text: 'It becomes absolutely convergent.'}, {id: c, text: 'Its sum can become arbitrary.'}, {id: d, text: 'It must diverge.'}]
    answer: {choiceId: a}
    solutionOutline: Group-boundary partial sums form a subsequence of the original convergent partial sums.
    commonTrap: Confusing grouping with a term permutation.
    verification: {method: partial-sum-subsequence-grouping, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-012
    topicId: series-fundamentals
    skills: [analyze-combinations-of-divergent-series]
    archetype: cancellation-of-divergent-components
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires rejecting undefined infinity arithmetic with a termwise counterexample.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      Two series $\sum a_n$ and $\sum b_n$ both diverge. Must
      $\sum(a_n-b_n)$ diverge?
    choices: [{id: a, text: 'No; taking $a_n=b_n=1/n$ makes the difference series zero.'}, {id: b, text: 'Yes, divergence is preserved by subtraction.'}, {id: c, text: 'Yes, unless terms alternate.'}, {id: d, text: 'No, because every difference series converges.'}]
    answer: {choiceId: a}
    solutionOutline: Divergent component sums cannot be subtracted as infinities, while termwise cancellation may be exact.
    commonTrap: Treating divergent sums as ordinary real numbers.
    verification: {method: exact-cancellation-counterexample, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-013
    topicId: series-fundamentals
    skills: [interpret-index-shifts]
    archetype: remove-first-term
    difficulty: hard
    reasoningDepth: 3
    difficultyEvidence: Requires relating two sums with shifted starting indices.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $\sum_{n=0}^{\infty}a_n=S$, what is
      $\sum_{n=1}^{\infty}a_n$?
    choices: [{id: a, text: '$S-a_0$'}, {id: b, text: '$S-a_1$'}, {id: c, text: '$S$'}, {id: d, text: '$S+a_0$'}]
    answer: {choiceId: a}
    solutionOutline: Removing the initial finite term subtracts exactly $a_0$ from the total.
    commonTrap: Subtracting the first term in the shifted sum rather than the removed term.
    verification: {method: finite-prefix-removal, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-014
    topicId: series-fundamentals
    skills: [derive-terms-from-remainders]
    archetype: remainder-difference
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires relating consecutive tails to the intervening term.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $R_n=\sum_{k=n+1}^{\infty}a_k$, which identity is correct?
    choices: [{id: a, text: '$a_{n+1}=R_n-R_{n+1}$'}, {id: b, text: '$a_{n+1}=R_{n+1}-R_n$'}, {id: c, text: '$a_n=R_n$'}, {id: d, text: '$R_n+R_{n+1}=0$'}]
    answer: {choiceId: a}
    solutionOutline: The tail R_n consists of the first omitted term plus the next tail.
    commonTrap: Reversing the subtraction and changing the sign.
    verification: {method: nested-tail-decomposition, result: verified}
    reviewStatus: verified
  - id: calc2-series-hard-015
    topicId: series-fundamentals
    skills: [use-absolute-convergence-for-tail-control]
    archetype: triangle-inequality-tail
    difficulty: hard
    reasoningDepth: 4
    difficultyEvidence: Requires transferring absolute tail control to a signed tail.
    assessmentUses: [hard-test]
    questionType: multipleChoice
    prompt: |
      If $\sum|a_n|$ converges, why must $\sum a_n$ satisfy the Cauchy
      criterion?
    choices: [{id: a, text: 'Every signed tail is bounded in magnitude by the corresponding absolute tail.'}, {id: b, text: 'Every term is positive.'}, {id: c, text: 'The partial sums are constant.'}, {id: d, text: 'Absolute convergence makes all terms zero eventually.'}]
    answer: {choiceId: a}
    solutionOutline: The triangle inequality gives $|\sum_{k=m}^{n}a_k|\le\sum_{k=m}^{n}|a_k|$, and absolute tails become arbitrarily small.
    commonTrap: Assuming absolute convergence removes signs from the original terms.
    verification: {method: triangle-inequality-cauchy-tail, result: verified}
    reviewStatus: verified
