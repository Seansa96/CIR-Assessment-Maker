  prompt: |-
    In a triangle, two of the interior angles measure $56^\circ$ and $83^\circ$. What is the measure of the third interior angle in degrees?
  type: numericResponse
  answer:
    value: 41.0
    tolerance: 0
  explanation: |-
    The sum of interior angles is $180^\circ$. $180 - 56 - 83 = 41^\circ$.
