<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc"><title id="title">C++ input validation flow</title><desc id="desc">Keyboard input enters cin, is extracted into a variable, and a success check routes to output or recovery.</desc><style>text{font-family:system-ui,sans-serif;fill:#edf3ff}.box{fill:#172554;stroke:#67e8f9;stroke-width:3}.warn{fill:#4c1d1d;stroke:#fca5a5;stroke-width:3}.arrow{stroke:#a5f3fc;stroke-width:4;marker-end:url(#a)}.small{font-size:17px}.large{font-size:23px;font-weight:700}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a5f3fc"/></marker></defs><rect width="920" height="260" rx="22" fill="#0f172a"/><rect class="box" x="28" y="82" width="150" height="88" rx="12"/><text class="large" x="53" y="120">keyboard</text><text class="small" x="59" y="147">characters</text><line class="arrow" x1="184" y1="126" x2="286" y2="126"/><rect class="box" x="296" y="82" width="130" height="88" rx="12"/><text class="large" x="326" y="120">std::cin</text><text class="small" x="318" y="147">stream</text><line class="arrow" x1="432" y1="126" x2="534" y2="126"/><rect class="box" x="544" y="82" width="158" height="88" rx="12"/><text class="large" x="570" y="120">double value</text><text class="small" x="573" y="147">extraction</text><line class="arrow" x1="708" y1="126" x2="774" y2="126"/><text class="large" x="753" y="85">valid?</text><text class="small" x="754" y="145">yes → use value</text><rect class="warn" x="612" y="194" width="218" height="44" rx="10"/><text class="small" x="630" y="222">no → clear + ignore + retry</text></svg>
