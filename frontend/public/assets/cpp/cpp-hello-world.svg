<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="title desc"><title id="title">C++ build and output flow</title><desc id="desc">A source file is compiled and linked into an executable that prints text to a console.</desc><style>text{font-family:system-ui,sans-serif;fill:#edf3ff}.box{fill:#172554;stroke:#60a5fa;stroke-width:3}.arrow{stroke:#93c5fd;stroke-width:4;marker-end:url(#a)}.small{font-size:18px}.large{font-size:25px;font-weight:700}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker></defs><rect width="920" height="250" rx="22" fill="#0f172a"/><rect class="box" x="28" y="78" width="170" height="92" rx="12"/><text class="large" x="63" y="118">hello.cpp</text><text class="small" x="61" y="148">source code</text><line class="arrow" x1="205" y1="124" x2="315" y2="124"/><rect class="box" x="325" y="78" width="170" height="92" rx="12"/><text class="large" x="361" y="118">compiler</text><text class="small" x="358" y="148">object code</text><line class="arrow" x1="502" y1="124" x2="612" y2="124"/><rect class="box" x="622" y="78" width="130" height="92" rx="12"/><text class="large" x="651" y="118">linker</text><text class="small" x="646" y="148">program</text><line class="arrow" x1="758" y1="124" x2="842" y2="124"/><text class="large" x="774" y="80">console</text><text class="small" x="762" y="156">Hello, world!</text></svg>
