<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Evaporation separation method animation">
  <defs>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:28px;font-weight:800;fill:#0f172a}
      .label{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:700;fill:#1f2937}
      .note{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#334155}
      .glass{fill:#e0f2fe;stroke:#0f766e;stroke-width:4}
      .line{stroke:#0f766e;stroke-width:5;fill:none;stroke-linecap:round}
      .path{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="760" height="420" fill="#fbfbf8"/>
  <text x="34" y="48" class="title">Evaporation</text>
  <rect x="34" y="72" width="690" height="310" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M105 280 L145 125 L305 125 L345 280 Z" class="glass"/>
  <path d="M390 120 L575 120 L575 285 L390 285 Z" class="glass" opacity=".78"/>
  <path d="M170 250 C210 170 250 130 300 90" class="path"/>
  <g>
    <circle r="8" fill="#0ea5e9"/>
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M170 250 C210 170 250 130 300 90"/>
  </g>
  <path d="M108 248 C160 230 245 265 338 238" class="line" opacity=".55"/>
  <text x="390" y="330" class="label">Best use</text>
  <text x="390" y="354" class="note">recovering a dissolved solid when the solvent can be removed and the solvent does not need to be collected</text>
  <text x="70" y="330" class="label">Why it works</text>
  <text x="70" y="354" class="note">the solvent escapes as vapor, leaving the nonvolatile solute behind</text>
  <text x="410" y="102" class="label">solvent leaves as vapor</text>
</svg>
