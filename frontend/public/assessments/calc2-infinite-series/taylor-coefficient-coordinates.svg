<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Coefficients as coordinates and derivatives as coefficient detectors</title>
  <desc id="desc">A sequence of coefficients fills slots labeled one, x, x squared, and x cubed. A derivative filter selects the x cubed coefficient and returns three factorial times that coefficient.</desc>
  <rect width="1000" height="400" fill="#f8fafc"/>
  <text x="500" y="43" text-anchor="middle" font-family="Georgia, serif" font-size="29" fill="#172554">A power series is coefficient data placed into power slots</text>
  <text x="500" y="83" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#334155">7 + 5x + 9x² + 2x³</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="90" y="120" width="150" height="100" rx="10"/><rect x="275" y="120" width="150" height="100" rx="10"/><rect x="460" y="120" width="150" height="100" rx="10"/><rect x="645" y="120" width="150" height="100" rx="10"/>
    </g>
    <g font-size="20" fill="#1e3a8a"><text x="165" y="151">x⁰ slot</text><text x="350" y="151">x¹ slot</text><text x="535" y="151">x² slot</text><text x="720" y="151">x³ slot</text></g>
    <g font-size="38" fill="#172554"><text x="165" y="199">7</text><text x="350" y="199">5</text><text x="535" y="199">9</text><text x="720" y="199">2</text></g>
  </g>
  <path d="M720 230 L720 271" stroke="#d97706" stroke-width="4"/><path d="M720 271 L500 300" stroke="#d97706" stroke-width="4"/>
  <rect x="245" y="299" width="510" height="58" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#78350f">Third derivative at 0: 3! · 2 = 12</text>
  <text x="500" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">Lower powers vanish; higher powers retain x and vanish at 0.</text>
</svg>
