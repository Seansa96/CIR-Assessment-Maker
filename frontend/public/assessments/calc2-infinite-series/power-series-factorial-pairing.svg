<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Splitting a factorial into odd and even products</title>
  <desc id="desc">The factors of 2n factorial are rearranged into an odd product and an even product, with the even product simplifying to two to the n times n factorial.</desc>
  <rect width="960" height="280" fill="#f8fafc"/>
  <text x="480" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="31" fill="#172554">(2n)! = 1 · 2 · 3 · 4 · ··· · (2n−1) · 2n</text>
  <path d="M480 66 L480 95" stroke="#334155" stroke-width="3"/>
  <path d="M480 95 L255 128 M480 95 L705 128" stroke="#334155" stroke-width="3"/>
  <rect x="45" y="135" width="420" height="88" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="255" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#78350f">odd factors</text>
  <text x="255" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#78350f">1 · 3 · 5 · ··· · (2n−1)</text>
  <rect x="495" y="135" width="420" height="88" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="705" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#1e3a8a">even factors</text>
  <text x="705" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#1e3a8a">2 · 4 · 6 · ··· · 2n = 2ⁿn!</text>
  <text x="480" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">Associativity groups the factors; commutativity collects them by parity.</text>
</svg>
