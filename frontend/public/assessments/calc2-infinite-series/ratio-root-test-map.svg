<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Ratio and Root Test decision map</title><desc id="desc">A comparison of the successive ratio and nth-root forms, their shared conclusions, and the patterns that suggest each test.</desc><style>text{font-family:Arial,sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.s{font-size:20px}.box{fill:#f0f9ff;stroke:#0369a1;stroke-width:3}.root{fill:#f5f3ff;stroke:#6d28d9;stroke-width:3}.out{fill:#ecfdf5;stroke:#047857;stroke-width:3}</style><rect width="960" height="430" rx="24" fill="#f8fafc"/><text x="35" y="45" class="h">Choose the structure, then interpret the same threshold</text><rect x="42" y="82" width="390" height="174" rx="16" class="box"/><text x="70" y="122" class="h">Ratio Test</text><text x="70" y="158" class="s">L = lim |aₙ₊₁ / aₙ|</text><text x="70" y="195" class="s">Best cue: factorials, products,</text><text x="70" y="223" class="s">or adjacent exponential terms.</text><rect x="528" y="82" width="390" height="174" rx="16" class="root"/><text x="555" y="122" class="h">Root Test</text><text x="555" y="158" class="s">L = lim ⁿ√|aₙ|</text><text x="555" y="195" class="s">Best cue: the whole term is</text><text x="555" y="223" class="s">raised to the n-th power.</text><rect x="145" y="302" width="670" height="84" rx="16" class="out"/><text x="182" y="338" class="s">L &lt; 1: absolutely convergent   •   L &gt; 1 (or ∞): divergent</text><text x="252" y="370" class="s">L = 1: inconclusive — choose a different test</text><path d="M238 257 V292 M723 257 V292" stroke="#334e68" stroke-width="4"/><path d="M238 292 H723" stroke="#334e68" stroke-width="4"/></svg>
