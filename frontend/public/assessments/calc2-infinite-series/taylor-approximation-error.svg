  <circle cx="270" cy="159" r="7" fill="#e9f0ff"/><text x="246" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="18">center a</text><text x="500" y="260" fill="#fca5a5" font-family="sans-serif" font-size="18">|Rₙ(x)|</text><text x="410" y="112" fill="#5eead4" font-family="sans-serif" font-size="18">f(x)</text><text x="420" y="170" fill="#fde68a" font-family="sans-serif" font-size="18">Pₙ(x)</text>
