<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Coefficient extraction workflow</title><desc id="desc">A four-step flow for extracting a requested coefficient from a binomial expansion.</desc>
  <rect width="980" height="300" fill="#f8fafc"/><text x="490" y="45" text-anchor="middle" font-family="system-ui" font-size="27" font-weight="700" fill="#0f172a">Extract one coefficient without expanding everything</text>
  <g font-family="system-ui" font-size="19" text-anchor="middle"><g fill="#ecfeff" stroke="#0891b2" stroke-width="2"><rect x="35" y="105" width="190" height="115" rx="16"/><rect x="275" y="105" width="190" height="115" rx="16"/><rect x="515" y="105" width="190" height="115" rx="16"/><rect x="755" y="105" width="190" height="115" rx="16"/></g><g fill="#0f172a"><text x="130" y="140">1. Write</text><text x="130" y="168">C(n,k)aⁿ⁻ᵏbᵏ</text><text x="370" y="140">2. Match the</text><text x="370" y="168">requested power</text><text x="610" y="140">3. Solve</text><text x="610" y="168">for k</text><text x="850" y="140">4. Evaluate</text><text x="850" y="168">only that term</text></g></g>
  <g stroke="#0891b2" stroke-width="4" fill="none"><path d="M225 162h40"/><path d="M465 162h40"/><path d="M705 162h40"/></g><g fill="#0891b2"><path d="M265 154l12 8-12 8z"/><path d="M505 154l12 8-12 8z"/><path d="M745 154l12 8-12 8z"/></g>
</svg>
