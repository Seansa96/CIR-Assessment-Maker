<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="-100 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Term map for a fifth binomial power</title><desc id="desc">A table showing coefficients, descending a powers, and ascending b powers for (a plus b) to the fifth.</desc>
  <rect width="1100" height="410" fill="#f8fafc"/><text x="550" y="48" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="700" fill="#0f172a">Every term has a predictable job</text>
  <g font-family="system-ui" text-anchor="middle"><g fill="#dbeafe"><rect x="60" y="85" width="150" height="55" rx="10"/><rect x="225" y="85" width="150" height="55" rx="10"/><rect x="390" y="85" width="150" height="55" rx="10"/><rect x="555" y="85" width="150" height="55" rx="10"/><rect x="720" y="85" width="150" height="55" rx="10"/><rect x="885" y="85" width="150" height="55" rx="10"/></g><g font-size="21" font-weight="700" fill="#1e3a8a"><text x="135" y="120">term 0</text><text x="300" y="120">term 1</text><text x="465" y="120">term 2</text><text x="630" y="120">term 3</text><text x="795" y="120">term 4</text><text x="960" y="120">term 5</text></g>
  <g font-size="22" fill="#0f172a"><text x="35" y="195" text-anchor="end">coefficient</text><text x="135" y="195">1</text><text x="300" y="195">5</text><text x="465" y="195">10</text><text x="630" y="195">10</text><text x="795" y="195">5</text><text x="960" y="195">1</text><text x="35" y="260" text-anchor="end">power of a</text><text x="135" y="260">5</text><text x="300" y="260">4</text><text x="465" y="260">3</text><text x="630" y="260">2</text><text x="795" y="260">1</text><text x="960" y="260">0</text><text x="35" y="325" text-anchor="end">power of b</text><text x="135" y="325">0</text><text x="300" y="325">1</text><text x="465" y="325">2</text><text x="630" y="325">3</text><text x="795" y="325">4</text><text x="960" y="325">5</text></g></g>
  <text x="550" y="385" text-anchor="middle" font-family="system-ui" font-size="20" fill="#475569">The a-exponent falls by 1, the b-exponent rises by 1, and their sum stays 5.</text>
</svg>
