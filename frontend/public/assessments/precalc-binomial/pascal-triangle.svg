<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Pascal's triangle through row five</title><desc id="desc">Rows of Pascal's triangle with the fifth row highlighted as binomial coefficients.</desc>
  <rect width="900" height="560" fill="#f8fafc"/><text x="450" y="55" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="700" fill="#0f172a">Pascal's triangle: coefficient rows</text>
  <g font-family="system-ui" font-size="24" text-anchor="middle" fill="#0f172a">
    <text x="450" y="115">1</text><text x="390" y="180">1</text><text x="510" y="180">1</text>
    <text x="330" y="245">1</text><text x="450" y="245">2</text><text x="570" y="245">1</text>
    <text x="270" y="310">1</text><text x="390" y="310">3</text><text x="510" y="310">3</text><text x="630" y="310">1</text>
    <text x="210" y="375">1</text><text x="330" y="375">4</text><text x="450" y="375">6</text><text x="570" y="375">4</text><text x="690" y="375">1</text>
  </g>
  <g fill="#2563eb"><circle cx="150" cy="450" r="28"/><circle cx="270" cy="450" r="28"/><circle cx="390" cy="450" r="28"/><circle cx="510" cy="450" r="28"/><circle cx="630" cy="450" r="28"/><circle cx="750" cy="450" r="28"/></g>
  <g font-family="system-ui" font-size="22" text-anchor="middle" fill="white" font-weight="700"><text x="150" y="458">1</text><text x="270" y="458">5</text><text x="390" y="458">10</text><text x="510" y="458">10</text><text x="630" y="458">5</text><text x="750" y="458">1</text></g>
  <text x="450" y="525" text-anchor="middle" font-family="system-ui" font-size="21" fill="#1e40af">Row 5 gives the coefficients of (a + b)⁵</text>
</svg>
