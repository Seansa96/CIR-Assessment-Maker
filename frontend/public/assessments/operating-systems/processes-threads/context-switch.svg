<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Context Switch</title>
  <desc id="desc">Context Switch diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Context Switch</text>
  <rect x="80" y="95" width="175" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="167.5" y="126.0" text-anchor="middle" class="label">Running A</text><rect x="365" y="95" width="180" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="455.0" y="126.0" text-anchor="middle" class="label">Save A state</text><rect x="650" y="95" width="175" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="737.5" y="126.0" text-anchor="middle" class="label">Ready A</text><rect x="80" y="250" width="175" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="167.5" y="281.0" text-anchor="middle" class="label">Ready B</text><rect x="365" y="250" width="180" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="455.0" y="281.0" text-anchor="middle" class="label">Restore B state</text><rect x="650" y="250" width="175" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="737.5" y="281.0" text-anchor="middle" class="label">Running B</text><line x1="255" y1="130" x2="365" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="545" y1="130" x2="650" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="255" y1="285" x2="365" y2="285" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="545" y1="285" x2="650" y2="285" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="455" y1="165" x2="455" y2="250" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="455" y="210" text-anchor="middle" class="small">scheduler</text>
</svg>
