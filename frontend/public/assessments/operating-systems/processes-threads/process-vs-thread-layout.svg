<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Process vs Thread Layout</title>
  <desc id="desc">Process vs Thread Layout diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Process vs Thread Layout</text>
  <rect x="55" y="80" width="780" height="285" rx="18" class="zone"/><text x="445" y="115" text-anchor="middle" class="label">One process address space</text><rect x="95" y="145" width="160" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="175.0" y="168.5" text-anchor="middle" class="label">code</text><rect x="280" y="145" width="160" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="360.0" y="168.5" text-anchor="middle" class="label">data</text><rect x="465" y="145" width="160" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="545.0" y="168.5" text-anchor="middle" class="label">heap</text><rect x="110" y="255" width="130" height="58" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="175.0" y="280.0" text-anchor="middle" class="label">Thread A stack</text><rect x="310" y="255" width="130" height="58" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="375.0" y="280.0" text-anchor="middle" class="label">Thread B stack</text><rect x="510" y="255" width="130" height="58" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="575.0" y="280.0" text-anchor="middle" class="label">Thread C stack</text><text x="445" y="225" text-anchor="middle" class="small">Threads share code/data/heap but keep separate stacks and registers.</text>
</svg>
