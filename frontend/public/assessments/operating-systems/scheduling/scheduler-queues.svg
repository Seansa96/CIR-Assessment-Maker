<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Scheduler Queues</title>
  <desc id="desc">Scheduler Queues diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Scheduler Queues</text>
  <rect x="60" y="95" width="190" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="155.0" y="126.0" text-anchor="middle" class="label">Ready queue</text><rect x="355" y="95" width="180" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="445.0" y="126.0" text-anchor="middle" class="label">Running</text><rect x="650" y="95" width="190" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="745.0" y="126.0" text-anchor="middle" class="label">Blocked queue</text><rect x="80" y="210" width="150" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="155.0" y="228.5" text-anchor="middle" class="label">P2 P3 P4</text><rect x="385" y="210" width="120" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="445.0" y="228.5" text-anchor="middle" class="label">P1</text><rect x="680" y="210" width="130" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="745.0" y="228.5" text-anchor="middle" class="label">waiting I/O</text><line x1="250" y1="130" x2="355" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="535" y1="130" x2="650" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="650" y1="250" x2="250" y2="250" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="450" y="300" text-anchor="middle" class="small">Preemption, blocking, and wakeups move work among queues.</text>
</svg>
