<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Round-Robin Time Slices</title>
  <desc id="desc">Round-Robin Time Slices diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Round-Robin Time Slices</text>
  <rect x="70" y="120" width="110" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="125.0" y="143.5" text-anchor="middle" class="label">P1</text><rect x="230" y="120" width="110" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="285.0" y="143.5" text-anchor="middle" class="label">P2</text><rect x="390" y="120" width="110" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="445.0" y="143.5" text-anchor="middle" class="label">P3</text><rect x="550" y="120" width="110" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="605.0" y="143.5" text-anchor="middle" class="label">P4</text><rect x="340" y="260" width="160" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="420.0" y="286.0" text-anchor="middle" class="label">CPU</text><line x1="180" y1="148" x2="230" y2="148" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="340" y1="148" x2="390" y2="148" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="500" y1="148" x2="550" y2="148" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="630" y1="175" x2="500" y2="260" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><circle class="motion rr" r="9"><animateMotion dur="5s" repeatCount="indefinite" path="M125 210 L285 210 L445 210 L605 210 L420 290 L125 210"/></circle>
</svg>
