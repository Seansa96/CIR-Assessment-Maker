<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">User Mode and Kernel Mode</title>
  <desc id="desc">User Mode and Kernel Mode diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">User Mode and Kernel Mode</text>
  <rect x="50" y="85" width="350" height="230" rx="18" class="zone"/><rect x="500" y="85" width="350" height="230" rx="18" class="kernel"/><text x="225" y="125" text-anchor="middle" class="label">User mode</text><text x="675" y="125" text-anchor="middle" class="label">Kernel mode</text><rect x="105" y="165" width="240" height="58" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="225.0" y="190.0" text-anchor="middle" class="label">ordinary instructions</text><rect x="105" y="245" width="240" height="58" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="225.0" y="270.0" text-anchor="middle" class="label">library wrappers</text><rect x="555" y="165" width="240" height="58" rx="10" fill="#e4f2ef" stroke="#1d7774" stroke-width="2"/><text x="675.0" y="190.0" text-anchor="middle" class="label">privileged instructions</text><rect x="555" y="245" width="240" height="58" rx="10" fill="#e4f2ef" stroke="#1d7774" stroke-width="2"/><text x="675.0" y="270.0" text-anchor="middle" class="label">device + memory control</text><line x1="350" y1="245" x2="555" y2="205" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="450" y="235" text-anchor="middle" class="small">trap / return</text>
</svg>
