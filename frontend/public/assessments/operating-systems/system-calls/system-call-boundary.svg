<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">System Call Privilege Boundary</title>
  <desc id="desc">System Call Privilege Boundary diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      .request { opacity: .9; }
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">System Call Privilege Boundary</text>
  <rect x="55" y="105" width="155" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="132.5" y="136.0" text-anchor="middle" class="label">User code</text><rect x="260" y="105" width="160" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="340.0" y="136.0" text-anchor="middle" class="label">Library API</text><rect x="475" y="105" width="165" height="70" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="557.5" y="136.0" text-anchor="middle" class="label">syscall trap</text><rect x="700" y="105" width="150" height="70" rx="10" fill="#e4f2ef" stroke="#1d7774" stroke-width="2"/><text x="775.0" y="136.0" text-anchor="middle" class="label">Kernel work</text><rect x="650" y="70" width="220" height="150" rx="14" fill="#e4f2ef" stroke="#1d7774" stroke-width="2" opacity="0.5"/><text x="760" y="250" text-anchor="middle" class="small">Protected kernel functions are entered through the controlled syscall path.</text><line x1="210" y1="140" x2="260" y2="140" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="420" y1="140" x2="475" y2="140" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="640" y1="140" x2="700" y2="140" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><circle class="motion request" r="9"><animateMotion dur="4s" repeatCount="indefinite" path="M130 200 L340 200 L555 200 L775 200 L555 200 L340 200 L130 200"/></circle>
</svg>
