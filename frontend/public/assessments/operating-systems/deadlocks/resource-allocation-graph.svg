<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Deadlock Resource Allocation Graph</title>
  <desc id="desc">Deadlock Resource Allocation Graph diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Deadlock Resource Allocation Graph</text>
  <circle cx="185" cy="135" r="48" fill="#e4f2ef" stroke="#1d7774" stroke-width="2"/><text x="185" y="142" text-anchor="middle" class="label">P1</text><circle cx="185" cy="285" r="48" fill="#e4f2ef" stroke="#1d7774" stroke-width="2"/><text x="185" y="292" text-anchor="middle" class="label">P2</text><rect x="585" y="105" width="100" height="60" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="635.0" y="131.0" text-anchor="middle" class="label">R1</text><rect x="585" y="255" width="100" height="60" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="635.0" y="281.0" text-anchor="middle" class="label">R2</text><line x1="233" y1="135" x2="585" y2="135" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="585" y1="285" x2="233" y2="285" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="635" y1="165" x2="635" y2="255" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="585" y1="135" x2="233" y2="285" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="445" y="365" text-anchor="middle" class="small">A cycle with nonpreemptable resources is the warning sign.</text>
</svg>
