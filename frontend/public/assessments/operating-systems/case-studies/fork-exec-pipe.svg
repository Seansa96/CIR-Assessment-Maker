<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Fork, Exec, and Pipe</title>
  <desc id="desc">Fork, Exec, and Pipe diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Fork, Exec, and Pipe</text>
  <rect x="55" y="100" width="130" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="120.0" y="126.0" text-anchor="middle" class="label">Shell</text><rect x="245" y="70" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="320.0" y="96.0" text-anchor="middle" class="label">fork child A</text><rect x="245" y="180" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="320.0" y="206.0" text-anchor="middle" class="label">fork child B</text><rect x="470" y="70" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="545.0" y="96.0" text-anchor="middle" class="label">exec cmd A</text><rect x="470" y="180" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="545.0" y="206.0" text-anchor="middle" class="label">exec cmd B</text><rect x="700" y="125" width="120" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="760.0" y="151.0" text-anchor="middle" class="label">pipe</text><line x1="185" y1="130" x2="245" y2="100" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="185" y1="130" x2="245" y2="210" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="395" y1="100" x2="470" y2="100" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="395" y1="210" x2="470" y2="210" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="620" y1="100" x2="700" y2="155" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="700" y1="155" x2="620" y2="210" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/>
