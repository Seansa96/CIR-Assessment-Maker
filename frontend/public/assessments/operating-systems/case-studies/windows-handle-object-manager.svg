<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Windows Handle and Object Manager</title>
  <desc id="desc">Windows Handle and Object Manager diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Windows Handle and Object Manager</text>
  <rect x="65" y="115" width="160" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="145.0" y="141.0" text-anchor="middle" class="label">Process handle</text><rect x="305" y="115" width="180" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="395.0" y="141.0" text-anchor="middle" class="label">Object manager</text><rect x="565" y="70" width="180" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="655.0" y="93.5" text-anchor="middle" class="label">File object</text><rect x="565" y="160" width="180" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="655.0" y="183.5" text-anchor="middle" class="label">Event object</text><rect x="565" y="250" width="180" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="655.0" y="273.5" text-anchor="middle" class="label">Process object</text><line x1="225" y1="145" x2="305" y2="145" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="485" y1="145" x2="565" y2="98" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="485" y1="145" x2="565" y2="188" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="485" y1="145" x2="565" y2="278" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><text x="435" y="355" text-anchor="middle" class="small">Handles mediate access to kernel-managed objects.</text>
</svg>
