<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Journaled Write Ordering</title>
  <desc id="desc">Journaled Write Ordering diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Journaled Write Ordering</text>
  <rect x="70" y="105" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="145.0" y="131.0" text-anchor="middle" class="label">Write intent</text><rect x="285" y="105" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="360.0" y="131.0" text-anchor="middle" class="label">Journal</text><rect x="500" y="105" width="165" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="582.5" y="131.0" text-anchor="middle" class="label">Metadata update</text><rect x="710" y="105" width="130" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="775.0" y="131.0" text-anchor="middle" class="label">Commit</text><line x1="220" y1="135" x2="285" y2="135" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="435" y1="135" x2="500" y2="135" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="665" y1="135" x2="710" y2="135" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="290" y="245" width="320" height="55" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="450.0" y="268.5" text-anchor="middle" class="label">Recovery replays or rolls back known operations.</text>
</svg>
