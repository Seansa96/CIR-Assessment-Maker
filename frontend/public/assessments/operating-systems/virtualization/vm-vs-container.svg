<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Machines and Containers</title>
  <desc id="desc">Virtual Machines and Containers diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Virtual Machines and Containers</text>
  <rect x="55" y="75" width="360" height="285" rx="14" class="zone"/><text x="235" y="110" text-anchor="middle" class="label">Virtual machine stack</text><rect x="95" y="140" width="280" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="235.0" y="158.5" text-anchor="middle" class="label">App</text><rect x="95" y="195" width="280" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="235.0" y="213.5" text-anchor="middle" class="label">Guest OS</text><rect x="95" y="250" width="280" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="235.0" y="268.5" text-anchor="middle" class="label">Hypervisor</text><rect x="95" y="305" width="280" height="35" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="235.0" y="318.5" text-anchor="middle" class="label">Hardware</text><rect x="485" y="75" width="360" height="285" rx="14" class="zone"/><text x="665" y="110" text-anchor="middle" class="label">Container stack</text><rect x="525" y="140" width="280" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="665.0" y="158.5" text-anchor="middle" class="label">Containerized app</text><rect x="525" y="195" width="280" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="665.0" y="213.5" text-anchor="middle" class="label">Shared host kernel</text><rect x="525" y="250" width="280" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="665.0" y="268.5" text-anchor="middle" class="label">Host OS services</text><rect x="525" y="305" width="280" height="35" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="665.0" y="318.5" text-anchor="middle" class="label">Hardware</text>
</svg>
