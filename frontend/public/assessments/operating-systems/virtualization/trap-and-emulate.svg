<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Trap and Emulate</title>
  <desc id="desc">Trap and Emulate diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Trap and Emulate</text>
  <rect x="75" y="105" width="190" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="170.0" y="131.0" text-anchor="middle" class="label">Guest privileged op</text><rect x="355" y="105" width="180" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="445.0" y="131.0" text-anchor="middle" class="label">Trap to hypervisor</text><rect x="625" y="105" width="190" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="720.0" y="131.0" text-anchor="middle" class="label">Safe emulation</text><line x1="265" y1="135" x2="355" y2="135" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="535" y1="135" x2="625" y2="135" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y="250" width="260" height="55" rx="10" fill="#e4f2ef" stroke="#1d7774" stroke-width="2"/><text x="450.0" y="273.5" text-anchor="middle" class="label">Guest sees progress; host keeps control.</text>
</svg>
