<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Kernel Structure Comparison</title>
  <desc id="desc">Kernel Structure Comparison diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Kernel Structure Comparison</text>
  <rect x="45" y="90" width="240" height="250" rx="14" class="zone"/><text x="165" y="125" text-anchor="middle" class="label">Monolithic</text><rect x="80" y="160" width="170" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="165.0" y="178.5" text-anchor="middle" class="label">drivers</text><rect x="80" y="215" width="170" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="165.0" y="233.5" text-anchor="middle" class="label">files + memory</text><rect x="80" y="270" width="170" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="165.0" y="288.5" text-anchor="middle" class="label">scheduler</text><rect x="330" y="90" width="240" height="250" rx="14" class="zone"/><text x="450" y="125" text-anchor="middle" class="label">Microkernel</text><rect x="365" y="160" width="170" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="450.0" y="178.5" text-anchor="middle" class="label">minimal kernel</text><rect x="365" y="245" width="170" height="45" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="450.0" y="263.5" text-anchor="middle" class="label">user services</text><rect x="615" y="90" width="240" height="250" rx="14" class="zone"/><text x="735" y="125" text-anchor="middle" class="label">Layered</text><rect x="650" y="155" width="170" height="38" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="735.0" y="170.0" text-anchor="middle" class="label">interface</text><rect x="650" y="205" width="170" height="38" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="735.0" y="220.0" text-anchor="middle" class="label">services</text><rect x="650" y="255" width="170" height="38" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="735.0" y="270.0" text-anchor="middle" class="label">hardware layer</text>
</svg>
