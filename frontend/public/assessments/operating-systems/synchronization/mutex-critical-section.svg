<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Mutex Guarding a Critical Section</title>
  <desc id="desc">Mutex Guarding a Critical Section diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Mutex Guarding a Critical Section</text>
  <rect x="65" y="100" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="140.0" y="126.0" text-anchor="middle" class="label">Thread A</text><rect x="65" y="240" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="140.0" y="266.0" text-anchor="middle" class="label">Thread B</text><rect x="380" y="85" width="220" height="230" rx="18" fill="#e4f2ef" stroke="#1d7774" stroke-width="2"/><text x="490" y="125" text-anchor="middle" class="label">Critical section</text><rect x="420" y="170" width="140" height="58" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="490.0" y="195.0" text-anchor="middle" class="label">shared data</text><rect x="270" y="160" width="80" height="60" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="310.0" y="186.0" text-anchor="middle" class="label">mutex</text><line x1="215" y1="130" x2="270" y2="180" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="350" y1="190" x2="380" y2="190" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="215" y1="270" x2="270" y2="205" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="260" y="250" text-anchor="middle" class="small">waits</text>
</svg>
