<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Semaphore Count and Wait Queue</title>
  <desc id="desc">Semaphore Count and Wait Queue diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Semaphore Count and Wait Queue</text>
  <rect x="85" y="85" width="170" height="58" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="170.0" y="110.0" text-anchor="middle" class="label">Semaphore count = 2</text><rect x="85" y="185" width="110" height="50" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="140.0" y="206.0" text-anchor="middle" class="label">T1 enters</text><rect x="220" y="185" width="110" height="50" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="275.0" y="206.0" text-anchor="middle" class="label">T2 enters</text><rect x="355" y="185" width="110" height="50" rx="10" fill="#fff4f4" stroke="#b94a56" stroke-width="2"/><text x="410.0" y="206.0" text-anchor="middle" class="label">T3 waits</text><rect x="575" y="95" width="220" height="140" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="685.0" y="161.0" text-anchor="middle" class="label">Wait queue</text><text x="685" y="180" text-anchor="middle" class="small">T3 blocked until signal</text><line x1="255" y1="115" x2="315" y2="205" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="465" y1="210" x2="575" y2="165" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><circle class="motion sem" r="8"><animateMotion dur="4s" repeatCount="indefinite" path="M170 300 L280 300 L390 300 L685 300 L685 230"/></circle>
</svg>
