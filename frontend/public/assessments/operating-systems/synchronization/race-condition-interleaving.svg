<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Race Condition Interleaving</title>
  <desc id="desc">Race Condition Interleaving diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Race Condition Interleaving</text>
  <text x="115" y="90" text-anchor="middle" class="label">Thread A</text><text x="115" y="240" text-anchor="middle" class="label">Thread B</text><line x1="190" y1="85" x2="800" y2="85" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="190" y1="235" x2="800" y2="235" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="230" y="55" width="120" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="290.0" y="78.5" text-anchor="middle" class="label">read x=5</text><rect x="430" y="55" width="135" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="497.5" y="78.5" text-anchor="middle" class="label">compute 6</text><rect x="650" y="55" width="120" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="710.0" y="78.5" text-anchor="middle" class="label">write 6</text><rect x="330" y="205" width="120" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="390.0" y="228.5" text-anchor="middle" class="label">read x=5</text><rect x="520" y="205" width="135" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="587.5" y="228.5" text-anchor="middle" class="label">compute 6</text><rect x="720" y="205" width="120" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="780.0" y="228.5" text-anchor="middle" class="label">write 6</text><rect x="345" y="330" width="260" height="50" rx="10" fill="#fff4f4" stroke="#b94a56" stroke-width="2"/><text x="475.0" y="351.0" text-anchor="middle" class="label">Two increments, final value 6</text>
</svg>
