<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Cache Coherence</title>
  <desc id="desc">Cache Coherence diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Cache Coherence</text>
  <rect x="75" y="80" width="150" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="150.0" y="103.5" text-anchor="middle" class="label">CPU A</text><rect x="75" y="160" width="150" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="150.0" y="183.5" text-anchor="middle" class="label">Cache A: x=7</text><rect x="675" y="80" width="150" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="750.0" y="103.5" text-anchor="middle" class="label">CPU B</text><rect x="675" y="160" width="150" height="55" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="750.0" y="183.5" text-anchor="middle" class="label">Cache B: x=5</text><rect x="360" y="270" width="180" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="450.0" y="296.0" text-anchor="middle" class="label">Shared memory x=7</text><line x1="225" y1="185" x2="360" y2="300" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="675" y1="185" x2="540" y2="300" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="450" y="235" text-anchor="middle" class="small">Coherence prevents stale cached views from persisting.</text>
</svg>
