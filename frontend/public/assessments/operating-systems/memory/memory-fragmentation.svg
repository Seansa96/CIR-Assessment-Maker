<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Free Memory and Fragmentation</title>
  <desc id="desc">Free Memory and Fragmentation diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Free Memory and Fragmentation</text>
  <rect x="70" y="120" width="760" height="85" rx="10" fill="#eef4f3" stroke="#9eb7b8" stroke-width="2"/><rect x="80" y="130" width="130" height="65" fill="#e4f2ef" stroke="#1d7774"/><text x="145" y="168" text-anchor="middle" class="small">P1</text><rect x="220" y="130" width="90" height="65" fill="#fff7de" stroke="#a07119"/><text x="265" y="168" text-anchor="middle" class="small">hole</text><rect x="320" y="130" width="160" height="65" fill="#e4f2ef" stroke="#1d7774"/><text x="400" y="168" text-anchor="middle" class="small">P2</text><rect x="490" y="130" width="120" height="65" fill="#fff7de" stroke="#a07119"/><text x="550" y="168" text-anchor="middle" class="small">hole</text><rect x="620" y="130" width="190" height="65" fill="#e4f2ef" stroke="#1d7774"/><text x="715" y="168" text-anchor="middle" class="small">P3</text><rect x="230" y="270" width="440" height="58" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="450.0" y="295.0" text-anchor="middle" class="label">Enough total free space can still fail a large contiguous request.</text>
</svg>
