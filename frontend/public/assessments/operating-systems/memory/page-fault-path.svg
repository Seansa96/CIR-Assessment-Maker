<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Page Fault Recovery Path</title>
  <desc id="desc">Page Fault Recovery Path diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Page Fault Recovery Path</text>
  <rect x="50" y="100" width="140" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="120.0" y="126.0" text-anchor="middle" class="label">Memory access</text><rect x="245" y="100" width="120" height="60" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="305.0" y="126.0" text-anchor="middle" class="label">TLB miss</text><rect x="420" y="100" width="145" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="492.5" y="126.0" text-anchor="middle" class="label">Page table</text><rect x="625" y="70" width="160" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="705.0" y="96.0" text-anchor="middle" class="label">Page present</text><rect x="625" y="180" width="160" height="60" rx="10" fill="#fff4f4" stroke="#b94a56" stroke-width="2"/><text x="705.0" y="206.0" text-anchor="middle" class="label">Page fault</text><rect x="420" y="275" width="145" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="492.5" y="301.0" text-anchor="middle" class="label">Disk fetch</text><line x1="190" y1="130" x2="245" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="365" y1="130" x2="420" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="565" y1="130" x2="625" y2="100" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="565" y1="130" x2="625" y2="210" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="625" y1="210" x2="565" y2="305" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="420" y1="305" x2="250" y2="160" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><circle class="motion pulse" r="8"><animateMotion dur="5s" repeatCount="indefinite" path="M120 250 L305 250 L490 250 L705 250 L490 350 L300 350"/></circle>
</svg>
