<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Address Translation</title>
  <desc id="desc">Virtual Address Translation diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Virtual Address Translation</text>
  <rect x="45" y="110" width="210" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="150.0" y="141.0" text-anchor="middle" class="label">Virtual address</text><rect x="310" y="80" width="170" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="395.0" y="106.0" text-anchor="middle" class="label">VPN</text><rect x="310" y="180" width="170" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="395.0" y="206.0" text-anchor="middle" class="label">Offset</text><rect x="540" y="75" width="150" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="615.0" y="106.0" text-anchor="middle" class="label">TLB</text><rect x="540" y="185" width="150" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="615.0" y="216.0" text-anchor="middle" class="label">Page table</text><rect x="745" y="130" width="120" height="70" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="805.0" y="161.0" text-anchor="middle" class="label">Frame</text><line x1="255" y1="145" x2="310" y2="110" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="255" y1="145" x2="310" y2="210" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="110" x2="540" y2="110" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="480" y1="110" x2="540" y2="220" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><line x1="690" y1="220" x2="745" y2="165" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><text x="452" y="292" text-anchor="middle" class="small">The offset is copied through; the page number is translated.</text>
</svg>
