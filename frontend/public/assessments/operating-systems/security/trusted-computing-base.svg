<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Trusted Computing Base</title>
  <desc id="desc">Trusted Computing Base diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Trusted Computing Base</text>
  <rect x="90" y="95" width="720" height="235" rx="20" fill="#fff4f4" stroke="#b94a56" stroke-width="2"/><text x="450" y="130" text-anchor="middle" class="label">Security relies on this trusted base</text><rect x="145" y="175" width="160" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="225.0" y="201.0" text-anchor="middle" class="label">Kernel</text><rect x="370" y="175" width="160" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="450.0" y="201.0" text-anchor="middle" class="label">Auth service</text><rect x="595" y="175" width="160" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="675.0" y="201.0" text-anchor="middle" class="label">Policy store</text><rect x="300" y="275" width="300" height="45" rx="10" fill="#fff7de" stroke="#a07119" stroke-width="2"/><text x="450.0" y="293.5" text-anchor="middle" class="label">Keep this as small and reviewable as possible.</text>
</svg>
