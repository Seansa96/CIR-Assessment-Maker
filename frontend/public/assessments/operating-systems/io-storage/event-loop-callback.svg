<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Event Loop and Callback Dispatch</title>
  <desc id="desc">Event Loop and Callback Dispatch diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">Event Loop and Callback Dispatch</text>
  <circle cx="440" cy="205" r="115" fill="#eef4f3" stroke="#2f6f73" stroke-width="3"/><text x="440" y="205" text-anchor="middle" class="label">Event loop</text><rect x="70" y="85" width="170" height="58" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="155.0" y="110.0" text-anchor="middle" class="label">I/O event</text><rect x="70" y="265" width="170" height="58" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="155.0" y="290.0" text-anchor="middle" class="label">Timer event</text><rect x="640" y="85" width="190" height="58" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="735.0" y="110.0" text-anchor="middle" class="label">Callback A</text><rect x="640" y="265" width="190" height="58" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="735.0" y="290.0" text-anchor="middle" class="label">Callback B</text><line x1="240" y1="115" x2="335" y2="165" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="240" y1="295" x2="335" y2="245" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="545" y1="165" x2="640" y2="115" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="545" y1="245" x2="640" y2="295" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><circle class="motion evt" r="8"><animateMotion dur="5s" repeatCount="indefinite" path="M440 90 A115 115 0 1 1 439 90"/></circle>
</svg>
