<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">I/O Stack</title>
  <desc id="desc">I/O Stack diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">I/O Stack</text>
  <rect x="55" y="95" width="135" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="122.5" y="121.0" text-anchor="middle" class="label">App</text><rect x="245" y="95" width="145" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="317.5" y="121.0" text-anchor="middle" class="label">System call</text><rect x="445" y="95" width="165" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="527.5" y="121.0" text-anchor="middle" class="label">OS I/O layer</text><rect x="665" y="95" width="145" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="737.5" y="121.0" text-anchor="middle" class="label">Driver</text><rect x="445" y="240" width="165" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="527.5" y="266.0" text-anchor="middle" class="label">Controller</text><rect x="665" y="240" width="145" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="737.5" y="266.0" text-anchor="middle" class="label">Device</text><line x1="190" y1="125" x2="245" y2="125" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="390" y1="125" x2="445" y2="125" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="610" y1="125" x2="665" y2="125" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="735" y1="155" x2="735" y2="240" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="665" y1="270" x2="610" y2="270" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
