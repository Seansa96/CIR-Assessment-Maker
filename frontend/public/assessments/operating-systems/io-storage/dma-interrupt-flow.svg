<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">DMA and Interrupt Flow</title>
  <desc id="desc">DMA and Interrupt Flow diagram for the operating systems curriculum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b63"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #29464c; }
      .label { font: 700 15px system-ui, sans-serif; fill: #24393f; }
      .small { font: 13px system-ui, sans-serif; fill: #496169; }
      .tiny { font: 11px system-ui, sans-serif; fill: #496169; }
      .zone { fill: #eef4f3; stroke: #9eb7b8; stroke-width: 2; }
      .kernel { fill: #e4f2ef; stroke: #1d7774; }
      .warn { fill: #fff4f4; stroke: #b94a56; }
      .accent { fill: #fff7de; stroke: #a07119; }
      .motion { fill: #1f8a8a; stroke: #0d5757; stroke-width: 2; }
      
    </style>
  </defs>
  <rect width="900" height="420" fill="#fbfcfb"/>
  <text x="24" y="34" class="title">DMA and Interrupt Flow</text>
  <rect x="55" y="100" width="140" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="125.0" y="126.0" text-anchor="middle" class="label">CPU setup</text><rect x="265" y="100" width="170" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="350.0" y="126.0" text-anchor="middle" class="label">DMA transfer</text><rect x="505" y="100" width="150" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="580.0" y="126.0" text-anchor="middle" class="label">Memory buffer</text><rect x="710" y="100" width="130" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="775.0" y="126.0" text-anchor="middle" class="label">Interrupt</text><rect x="265" y="250" width="170" height="60" rx="10" fill="#f8faf9" stroke="#2f6f73" stroke-width="2"/><text x="350.0" y="276.0" text-anchor="middle" class="label">Device</text><line x1="195" y1="130" x2="265" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="435" y1="130" x2="505" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="655" y1="130" x2="710" y2="130" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="350" y1="250" x2="350" y2="160" stroke="#315b63" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><circle class="motion dma" r="8"><animateMotion dur="4s" repeatCount="indefinite" path="M350 250 L350 130 L580 130 L775 130"/></circle>
</svg>
