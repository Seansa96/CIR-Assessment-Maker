<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="30-60-90 Triangle Ratio">
  <defs><style>
    .tri{fill:#e8f5f2;stroke:#0f766e;stroke-width:4;stroke-linejoin:round}
    .aux{stroke:#d97706;stroke-width:3;fill:none}
    .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:6 6}
    .title{font-family:Inter,Arial,sans-serif;font-size:22px;fill:#0f172a;font-weight:800}
    .label{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#1f2937;font-weight:700}
    .note{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#334155}
  </style></defs>
  <rect width="720" height="380" fill="#fbfbf8"/>
  <text x="30" y="38" class="title">30-60-90 Triangle Ratio</text>
  <polygon points="80,300 255,300 150,95" class="tri"/>
  <line x1="150" y1="95" x2="150" y2="300" class="dash"/>
  <path d="M80 300 L116 300 L105 268" class="aux"/>
  <path d="M118 124 Q150 150 185 124" class="aux"/>
  <circle cx="80" cy="300" r="5" fill="#dc2626"/><circle cx="255" cy="300" r="5" fill="#dc2626"/><circle cx="150" cy="95" r="5" fill="#dc2626"/>
  <text x="60" y="326" class="label">A</text><text x="262" y="326" class="label">B</text><text x="151" y="84" class="label">C</text>
  <text x="300" y="218" class="label">What to notice</text><text x="300" y="250" class="note">Side ratio 1:sqrt3:2</text>
</svg>
