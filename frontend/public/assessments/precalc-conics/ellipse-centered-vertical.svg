<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title desc">
  <title id="title">Vertically oriented ellipse centered at the origin</title>
  <desc id="desc">A coordinate grid showing an ellipse centered at zero with horizontal radius two and vertical radius three.</desc>
  <rect width="520" height="420" fill="#f7f8f8"/>
  <g stroke="#d3d8d9" stroke-width="1">
    <path d="M60 35V385M110 35V385M160 35V385M210 35V385M260 35V385M310 35V385M360 35V385M410 35V385M460 35V385"/>
    <path d="M60 60H460M60 110H460M60 160H460M60 210H460M60 260H460M60 310H460M60 360H460"/>
  </g>
  <g stroke="#4d5a5e" stroke-width="2">
    <path d="M50 210H470"/>
    <path d="M260 390V25"/>
  </g>
  <g fill="#4d5a5e" font-family="system-ui, sans-serif" font-size="15">
    <text x="472" y="202">x</text>
    <text x="269" y="28">y</text>
    <text x="267" y="228">0</text>
    <text x="305" y="228">1</text>
    <text x="205" y="228">-1</text>
    <text x="267" y="165">1</text>
    <text x="267" y="115">2</text>
    <text x="267" y="65">3</text>
  </g>
  <ellipse cx="260" cy="210" rx="100" ry="150" fill="none" stroke="#d64f58" stroke-width="5"/>
  <g fill="#0f8277">
    <circle cx="260" cy="60" r="5"/><circle cx="260" cy="360" r="5"/>
    <circle cx="160" cy="210" r="5"/><circle cx="360" cy="210" r="5"/>
  </g>
</svg>
