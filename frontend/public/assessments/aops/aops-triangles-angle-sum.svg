<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-labelledby="title desc">
  <title id="title">Triangle angle sum and exterior angle</title>
  <desc id="desc">Triangle ABC has interior angles 48 degrees at A, 71 degrees at B, and y at C. Side AC extends past C to form exterior angle x.</desc>
  <rect width="620" height="360" fill="#f8fafc"/>
  <path d="M90 280 L300 55 L500 280 Z" fill="#fef3c7" stroke="#a16207" stroke-width="4"/>
  <line x1="90" y1="280" x2="590" y2="280" stroke="#a16207" stroke-width="4"/>
  <g fill="none" stroke="#7c3aed" stroke-width="3">
    <path d="M130 280 A40 40 0 0 1 117 251"/>
    <path d="M278 79 A36 36 0 0 1 323 80"/>
    <path d="M466 280 A34 34 0 0 0 478 254"/>
    <path d="M535 280 A35 35 0 0 0 478 254" stroke="#dc2626"/>
  </g>
  <g font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">
    <text x="110" y="258">48&#176;</text><text x="286" y="98">71&#176;</text><text x="455" y="258">y</text><text x="527" y="256" fill="#b91c1c">x</text>
    <text x="70" y="307">A</text><text x="290" y="42">B</text><text x="493" y="307">C</text>
  </g>
</svg>
