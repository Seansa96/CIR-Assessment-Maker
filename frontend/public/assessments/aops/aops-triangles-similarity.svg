<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Similar triangles created by a parallel segment</title>
  <desc id="desc">Triangle ABC contains points D on AB and E on AC. Segment DE is parallel to base BC, producing similar triangles ADE and ABC. Matching angle arcs are marked.</desc>
  <rect width="560" height="360" fill="#f8fafc"/>
  <path d="M75 305 L280 45 L485 305 Z" fill="#e0f2fe" stroke="#075985" stroke-width="4"/>
  <line x1="160" y1="198" x2="400" y2="198" stroke="#dc2626" stroke-width="4"/>
  <g fill="none" stroke="#7c3aed" stroke-width="3">
    <path d="M176 198 A25 25 0 0 1 160 218"/>
    <path d="M101 305 A28 28 0 0 1 83 282"/>
    <path d="M384 198 A25 25 0 0 0 400 218"/>
    <path d="M459 305 A28 28 0 0 0 477 282"/>
  </g>
  <g stroke="#dc2626" stroke-width="3">
    <path d="M255 190 l10 8 -10 8 M275 190 l10 8 -10 8" fill="none"/>
    <path d="M255 297 l10 8 -10 8 M275 297 l10 8 -10 8" fill="none"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">
    <text x="269" y="35">A</text><text x="52" y="330">B</text><text x="492" y="330">C</text>
    <text x="137" y="190">D</text><text x="406" y="190">E</text>
  </g>
  <text x="280" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">DE is parallel to BC.</text>
</svg>
