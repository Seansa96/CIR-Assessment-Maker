<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Inscribed angle over a diameter</title>
  <desc id="desc">A circle has horizontal diameter AB through center O and point C on the upper semicircle. Segments AC, BC, and OC are drawn, and the right angle at C is marked.</desc>
  <rect width="520" height="360" fill="#f8fafc"/>
  <circle cx="260" cy="180" r="130" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="130" y1="180" x2="390" y2="180" stroke="#0f172a" stroke-width="4"/>
  <line x1="130" y1="180" x2="260" y2="50" stroke="#334155" stroke-width="3"/>
  <line x1="260" y1="50" x2="390" y2="180" stroke="#334155" stroke-width="3"/>
  <line x1="260" y1="50" x2="260" y2="180" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7"/>
  <polyline points="247.3,62.7 260,75.4 272.7,62.7" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="130" cy="180" r="5" fill="#0f172a"/>
  <circle cx="390" cy="180" r="5" fill="#0f172a"/>
  <circle cx="260" cy="180" r="5" fill="#7c3aed"/>
  <circle cx="260" cy="50" r="5" fill="#dc2626"/>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    <text x="105" y="205">A</text>
    <text x="397" y="205">B</text>
    <text x="269" y="202" fill="#7c3aed">O</text>
    <text x="268" y="44" fill="#dc2626">C</text>
  </g>
  <text x="260" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">AB is a diameter; OA = OB = OC.</text>
</svg>
