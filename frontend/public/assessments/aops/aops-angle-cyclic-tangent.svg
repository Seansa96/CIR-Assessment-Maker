<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" role="img" aria-labelledby="title desc">
  <title id="title">Cyclic quadrilateral and tangent</title>
  <desc id="desc">Quadrilateral ABCD is inscribed in a circle. A tangent at A forms a marked angle y with chord AB, and inscribed angle ADB is marked 38 degrees.</desc>
  <rect width="580" height="360" fill="#f8fafc"/>
  <circle cx="280" cy="185" r="135" fill="#ecfdf5" stroke="#166534" stroke-width="5"/>
  <path d="M162 120L370 76L405 250L215 309Z" fill="none" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="75" y1="255" x2="260" y2="40" stroke="#9f1239" stroke-width="5"/>
  <path d="M169 112 A31 31 0 0 1 188 133M232 281 A35 35 0 0 1 252 300" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <g font-family="sans-serif" font-size="20">
    <text x="143" y="114">A</text><text x="373" y="67">B</text><text x="414" y="257">C</text><text x="203" y="333">D</text>
    <text x="111" y="160">y</text><text x="236" y="273">38&#176;</text><text x="73" y="279">tangent</text>
  </g>
</svg>
