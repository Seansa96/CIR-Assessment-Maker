  <line x1="420" y1="270" x2="525" y2="270" stroke="#92400e" stroke-width="5"/>
  <path d="M124 270 A32 32 0 0 1 122 238M257 84 A35 35 0 0 1 304 88M420 270 A43 43 0 0 1 446 231" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <g font-family="sans-serif" font-size="21">
