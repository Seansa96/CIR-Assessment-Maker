<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title desc">
  <title id="title">Central and inscribed angles intercepting one arc</title>
  <desc id="desc">Points A, B, and C lie on a circle centered at O. Central angle AOB is 104 degrees and inscribed angle ACB, marked x, intercepts the same minor arc AB.</desc>
  <rect width="560" height="350" fill="#f8fafc"/>
  <circle cx="280" cy="175" r="135" fill="#fefce8" stroke="#854d0e" stroke-width="5"/>
  <line x1="280" y1="175" x2="166" y2="102" stroke="#dc2626" stroke-width="4"/>
  <line x1="280" y1="175" x2="394" y2="102" stroke="#dc2626" stroke-width="4"/>
  <line x1="166" y1="102" x2="280" y2="310" stroke="#2563eb" stroke-width="4"/>
  <line x1="394" y1="102" x2="280" y2="310" stroke="#2563eb" stroke-width="4"/>
  <path d="M249 155 A37 37 0 0 1 311 155M261 276 A38 38 0 0 1 299 276" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <g font-family="sans-serif" font-size="20">
    <text x="145" y="96">A</text><text x="402" y="96">B</text><text x="272" y="337">C</text><text x="270" y="196">O</text>
    <text x="251" y="135">104&#176;</text><text x="272" y="270">x</text>
  </g>
</svg>
