<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="400" viewBox="0 0 1050 400" role="img" aria-labelledby="title desc">
  <title id="title">Three structural views of triangle area</title>
  <desc id="desc">Three panels show base and perpendicular height, two sides with their included angle, and an incircle whose radius is perpendicular to each side. The panels correspond to one-half base times height, one-half ab sine C, Heron formula, and area equals inradius times semiperimeter.</desc>
  <rect width="1050" height="400" fill="#f8fafc"/>
  <g font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">
    <text x="175" y="35" text-anchor="middle">Base and altitude</text>
    <text x="525" y="35" text-anchor="middle">Two sides and included angle</text>
    <text x="875" y="35" text-anchor="middle">Three sides or inradius</text>
  </g>
  <g transform="translate(20,45)">
    <path d="M30 285 L310 285 L200 55 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
    <line x1="200" y1="55" x2="200" y2="285" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M200 265 h20 v20" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="170" y="315" font-family="Arial" font-size="22">b</text><text x="210" y="175" font-family="Arial" font-size="22" fill="#b91c1c">h</text>
    <text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="19" fill="#334155">K = 1/2 bh</text>
  </g>
  <g transform="translate(365,45)">
    <path d="M25 285 L300 285 L145 65 Z" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
    <path d="M80 285 A55 55 0 0 1 55 240" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <text x="83" y="265" font-family="Arial" font-size="22" fill="#7c3aed">C</text>
    <text x="160" y="315" font-family="Arial" font-size="22">b</text>
    <text x="65" y="165" font-family="Arial" font-size="22">a</text>
    <text x="165" y="342" text-anchor="middle" font-family="Arial" font-size="19" fill="#334155">K = 1/2 ab sin C</text>
  </g>
  <g transform="translate(710,45)">
    <path d="M20 285 L320 285 L170 45 Z" fill="#fef3c7" stroke="#a16207" stroke-width="4"/>
    <circle cx="170" cy="201.9" r="83.1" fill="none" stroke="#dc2626" stroke-width="3"/>
    <line x1="170" y1="201.9" x2="170" y2="285" stroke="#dc2626" stroke-width="3"/>
    <path d="M170 267 h18 v18" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="181" y="245" font-family="Arial" font-size="22" fill="#b91c1c">r</text>
    <text x="78" y="160" font-family="Arial" font-size="20">c</text><text x="255" y="160" font-family="Arial" font-size="20">a</text><text x="167" y="315" font-family="Arial" font-size="20">b</text>
    <text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">K = rs or Heron with s = (a+b+c)/2</text>
  </g>
</svg>
