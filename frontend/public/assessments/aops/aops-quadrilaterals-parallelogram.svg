<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410" role="img" aria-labelledby="title desc">
  <title id="title">Parallelogram properties and diagonal intersection</title>
  <desc id="desc">Parallelogram ABCD has both pairs of opposite sides marked parallel. Diagonals AC and BD meet at O, with matching tick marks showing AO equals OC and BO equals OD.</desc>
  <rect width="700" height="410" fill="#f8fafc"/>
  <path d="M95 320 L210 75 L590 75 L475 320 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="95" y1="320" x2="590" y2="75" stroke="#dc2626" stroke-width="3"/>
  <line x1="210" y1="75" x2="475" y2="320" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="342.5" cy="197.5" r="6" fill="#0f172a"/>
  <g stroke="#dc2626" stroke-width="4">
    <line x1="214" y1="253" x2="226" y2="265"/><line x1="459" y1="132" x2="471" y2="144"/>
  </g>
  <g stroke="#7c3aed" stroke-width="4">
    <line x1="269" y1="121" x2="258" y2="133"/><line x1="278" y1="129" x2="267" y2="141"/>
    <line x1="418" y1="259" x2="407" y2="271"/><line x1="427" y1="267" x2="416" y2="279"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="3" fill="none">
    <path d="M335 66 l12 9 -12 9 M365 66 l12 9 -12 9"/>
    <path d="M290 311 l12 9 -12 9 M320 311 l12 9 -12 9"/>
    <path d="M141 211 l14 2 -5 13"/><path d="M535 169 l14 2 -5 13"/>
  </g>
  <g font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">
    <text x="70" y="348">A</text><text x="200" y="62">B</text><text x="598" y="62">C</text><text x="482" y="348">D</text><text x="352" y="193">O</text>
  </g>
  <text x="350" y="390" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">Opposite sides are parallel; the diagonals bisect each other.</text>
</svg>
