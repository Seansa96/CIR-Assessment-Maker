<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="title desc">
  <title id="title">Parallel lines cut by a transversal</title>
  <desc id="desc">Parallel lines l and m are crossed by transversal t. A 62 degree angle and target angle x are marked as alternate interior angles.</desc>
  <rect width="560" height="330" fill="#f8fafc"/>
  <line x1="70" y1="90" x2="490" y2="90" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="70" y1="245" x2="490" y2="245" stroke="#1d4ed8" stroke-width="5"/>
  <path d="M105 75l10 15-10 15M125 75l10 15-10 15M420 230l10 15-10 15M440 230l10 15-10 15" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="180" y1="300" x2="375" y2="35" stroke="#9f1239" stroke-width="5"/>
  <path d="M335 90 A38 38 0 0 1 357 121" fill="none" stroke="#15803d" stroke-width="4"/>
  <path d="M199 214 A38 38 0 0 1 225 245" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <g font-family="sans-serif" font-size="21" fill="#111827">
    <text x="500" y="96">l</text><text x="500" y="251">m</text><text x="383" y="38">t</text>
    <text x="300" y="132">62&#176;</text><text x="225" y="217">x</text>
  </g>
</svg>
