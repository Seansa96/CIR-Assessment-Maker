<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
  <title id="title">Isosceles trapezoid with heights and midsegment</title>
  <desc id="desc">An isosceles trapezoid has bases 10 and 18, equal legs 5, height 3, and a dashed midsegment of length 14. Perpendicular height segments split the extra base length equally.</desc>
  <rect width="680" height="420" fill="#f8fafc"/>
  <path d="M60 330 L166.7 250 L433.3 250 L540 330 Z" fill="#e0f2fe" stroke="#075985" stroke-width="4"/>
  <line x1="166.7" y1="250" x2="166.7" y2="330" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="433.3" y1="250" x2="433.3" y2="330" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M166.7 312 h18 v18 M433.3 312 h-18 v18" fill="none" stroke="#dc2626" stroke-width="3"/>
  <line x1="113.3" y1="290" x2="486.7" y2="290" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 7"/>
  <g stroke="#15803d" stroke-width="4"><line x1="105" y1="285" x2="116" y2="298"/><line x1="484" y1="298" x2="495" y2="285"/></g>
  <g font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">
    <text x="300" y="240" text-anchor="middle">10</text><text x="300" y="365" text-anchor="middle">18</text>
    <text x="101" y="278">5</text><text x="490" y="278">5</text><text x="178" y="294" fill="#b91c1c">3</text>
    <text x="300" y="282" text-anchor="middle" fill="#7c3aed">14</text>
  </g>
  <text x="340" y="400" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Midsegment = (10 + 18)/2 = 14; area = midsegment times height.</text>
</svg>
