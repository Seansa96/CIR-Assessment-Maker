<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d"><title id="t">Circle scaling comparison</title><desc id="d">Two circles with radii 3 and 6 illustrate a linear scale factor of 2 and area factor of 4.</desc><rect width="520" height="300" fill="#f8fafc"/><circle cx="145" cy="145" r="65" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/><line x1="145" y1="145" x2="210" y2="145" stroke="#dc2626" stroke-width="3"/><circle cx="370" cy="145" r="115" fill="#dcfce7" stroke="#166534" stroke-width="4"/><line x1="370" y1="145" x2="485" y2="145" stroke="#dc2626" stroke-width="3"/><g font-family="sans-serif" font-size="18"><text x="155" y="138">r = 3</text><text x="390" y="138">r = 6</text><text x="75" y="235">circumference factor 2</text><text x="300" y="282">area factor 4</text></g></svg>
