<svg xmlns="http://www.w3.org/2000/svg" width="650" height="390" viewBox="0 0 650 390" role="img" aria-labelledby="title desc">
  <title id="title">Quadrilateral split into two triangles</title>
  <desc id="desc">Convex quadrilateral ABCD contains diagonal AC. The diagonal divides the quadrilateral into triangles ABC and ACD, showing why the four interior angles total 360 degrees.</desc>
  <rect width="650" height="390" fill="#f8fafc"/>
  <path d="M85 315 L190 55 L500 95 L555 315 Z" fill="#fef3c7" stroke="#a16207" stroke-width="4"/>
  <line x1="85" y1="315" x2="500" y2="95" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 7"/>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">
    <text x="62" y="343">A</text><text x="180" y="43">B</text><text x="505" y="88">C</text><text x="563" y="343">D</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#334155">
    <text x="240" y="145">triangle ABC</text><text x="345" y="270">triangle ACD</text>
  </g>
  <text x="325" y="375" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">Two triangle sums give 180&#176; + 180&#176; = 360&#176;.</text>
</svg>
