<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title desc">
  <title id="title">Isosceles triangle with an angle bisector</title>
  <desc id="desc">Triangle ABC has equal sides AB and AC. Segment AD bisects the 40 degree vertex angle at A and meets BC at D.</desc>
  <rect width="560" height="350" fill="#f8fafc"/>
  <path d="M280 45L95 285L465 285Z" fill="#e0f2fe" stroke="#075985" stroke-width="5"/>
  <line x1="280" y1="45" x2="280" y2="285" stroke="#be123c" stroke-width="4"/>
  <line x1="177" y1="165" x2="193" y2="177" stroke="#111827" stroke-width="4"/>
  <line x1="367" y1="177" x2="383" y2="165" stroke="#111827" stroke-width="4"/>
  <path d="M256 76 A40 40 0 0 1 280 85M280 85 A40 40 0 0 1 304 76" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <g font-family="sans-serif" font-size="21">
    <text x="270" y="34">A</text><text x="72" y="308">B</text><text x="472" y="308">C</text><text x="270" y="309">D</text>
    <text x="247" y="106">20&#176;</text><text x="292" y="106">20&#176;</text>
  </g>
</svg>
