<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Triangle with side lengths 5, 8, and x</title>
  <desc id="desc">A scalene triangle has sides labeled 5, 8, and x. A note states that the figure is not to scale and that existence must be tested algebraically.</desc>
  <rect width="600" height="360" fill="#f8fafc"/>
  <path d="M90 285 L510 285 L350 70 Z" fill="#e0f2fe" stroke="#075985" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">
    <text x="280" y="322">8</text>
    <text x="185" y="165">5</text>
    <text x="440" y="170" fill="#b91c1c">x</text>
  </g>
  <text x="300" y="345" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Not to scale: require |8 - 5| &lt; x &lt; 8 + 5.</text>
</svg>
