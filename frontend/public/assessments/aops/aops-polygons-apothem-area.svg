<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
  <title id="title">Regular hexagon decomposed for the apothem area formula</title>
  <desc id="desc">A regular hexagon is divided from center O into six congruent triangles. A perpendicular apothem a meets one side of length s, illustrating area one half times apothem times perimeter.</desc>
  <rect width="760" height="550" fill="#f8fafc"/>
  <path d="M600 275 L490 85 L270 85 L160 275 L270 465 L490 465 Z" fill="#dcfce7" stroke="#15803d" stroke-width="5"/>
  <g stroke="#7c3aed" stroke-width="3"><line x1="380" y1="275" x2="600" y2="275"/><line x1="380" y1="275" x2="490" y2="85"/><line x1="380" y1="275" x2="270" y2="85"/><line x1="380" y1="275" x2="160" y2="275"/><line x1="380" y1="275" x2="270" y2="465"/><line x1="380" y1="275" x2="490" y2="465"/></g>
  <line x1="380" y1="275" x2="380" y2="465" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 6"/>
  <path d="M380 445 h20 v20" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="380" cy="275" r="6" fill="#0f172a"/>
  <g font-family="Arial" font-size="22" font-weight="700" fill="#0f172a"><text x="392" y="270">O</text><text x="392" y="382" fill="#b91c1c">a</text><text x="380" y="500" text-anchor="middle">s</text></g>
  <text x="380" y="530" text-anchor="middle" font-family="Arial" font-size="22" fill="#334155">Area = 6·½sa = ½a(6s) = ½aP</text>
</svg>
