<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
  <title id="title">Altitude to the hypotenuse of a right triangle</title>
  <desc id="desc">Right triangle ABC has right angle at C. Altitude CD meets hypotenuse AB at D, dividing AB into segments AD equal to p and DB equal to q. The altitude is h.</desc>
  <rect width="600" height="370" fill="#f8fafc"/>
  <path d="M80 300 L520 300 L410 109.5 Z" fill="#e0f2fe" stroke="#075985" stroke-width="4"/>
  <line x1="410" y1="109.5" x2="410" y2="300" stroke="#dc2626" stroke-width="4"/>
  <path d="M410 282 L428 282 L428 300" fill="none" stroke="#dc2626" stroke-width="3"/>
  <polyline points="389.2,121.5 401.2,142.3 422,130.3" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    <text x="57" y="327">A</text><text x="526" y="327">B</text><text x="402" y="96">C</text><text x="402" y="327">D</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#334155">
    <text x="240" y="326">p</text><text x="462" y="326">q</text><text x="422" y="205" fill="#b91c1c">h</text>
  </g>
  <text x="300" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">CD is perpendicular to AB; all three displayed triangles are similar.</text>
</svg>
