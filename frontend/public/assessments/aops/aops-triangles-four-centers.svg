<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">The four classical triangle centers</title>
  <desc id="desc">Four panels show the incenter with an incircle and angle bisectors, the circumcenter with a circumcircle and equal radii, the centroid with three medians, and the orthocenter with three altitudes.</desc>
  <rect width="1000" height="630" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    <text x="245" y="34" text-anchor="middle">Incenter: angle bisectors</text>
    <text x="750" y="34" text-anchor="middle">Circumcenter: perpendicular bisectors</text>
    <text x="245" y="352" text-anchor="middle">Centroid: medians</text>
    <text x="750" y="352" text-anchor="middle">Orthocenter: altitudes</text>
  </g>
  <g transform="translate(70,45)">
    <path d="M30 210 L370 210 L200 30 Z" fill="#fef3c7" stroke="#a16207" stroke-width="4"/>
    <line x1="30" y1="210" x2="200" y2="136.7" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="370" y1="210" x2="200" y2="136.7" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="200" y1="30" x2="200" y2="136.7" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="200" cy="136.7" r="73.3" fill="none" stroke="#dc2626" stroke-width="3"/>
    <circle cx="200" cy="136.7" r="5" fill="#7c3aed"/>
    <text x="210" y="132" font-family="Arial" font-size="20" fill="#7c3aed">I</text>
    <line x1="200" y1="136.7" x2="200" y2="210" stroke="#dc2626" stroke-width="3"/>
    <text x="210" y="178" font-family="Arial" font-size="18" fill="#b91c1c">r</text>
  </g>
  <g transform="translate(565,45)">
    <circle cx="210" cy="152.2" r="102.2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M115 190 L305 190 L205 50 Z" fill="none" stroke="#075985" stroke-width="4"/>
    <line x1="210" y1="40" x2="210" y2="240" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="140" y1="107.2" x2="280" y2="197.2" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="140" y1="202.2" x2="280" y2="102.2" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="210" y1="152.2" x2="115" y2="190" stroke="#dc2626" stroke-width="3"/>
    <line x1="210" y1="152.2" x2="305" y2="190" stroke="#dc2626" stroke-width="3"/>
    <line x1="210" y1="152.2" x2="205" y2="50" stroke="#dc2626" stroke-width="3"/>
    <circle cx="210" cy="152.2" r="5" fill="#dc2626"/>
    <text x="219" y="148" font-family="Arial" font-size="20" fill="#b91c1c">O</text>
    <text x="205" y="225" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">OA = OB = OC</text>
  </g>
  <g transform="translate(70,365)">
    <path d="M30 210 L390 210 L200 25 Z" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
    <line x1="30" y1="210" x2="295" y2="117.5" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="390" y1="210" x2="115" y2="117.5" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="200" y1="25" x2="210" y2="210" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="206.7" cy="148.3" r="5" fill="#dc2626"/>
    <text x="216" y="144" font-family="Arial" font-size="20" fill="#b91c1c">G</text>
    <text x="210" y="235" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Each median is divided 2:1 from its vertex.</text>
  </g>
  <g transform="translate(565,365)">
    <path d="M70 210 L370 210 L220 30 Z" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
    <line x1="220" y1="30" x2="220" y2="210" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="70" y1="210" x2="247.05" y2="62.46" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="370" y1="210" x2="192.95" y2="62.46" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M220 192 h18 v18" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="220" cy="85" r="5" fill="#dc2626"/>
    <text x="230" y="80" font-family="Arial" font-size="20" fill="#b91c1c">H</text>
    <text x="220" y="235" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Each altitude is perpendicular to an opposite side line.</text>
  </g>
</svg>
