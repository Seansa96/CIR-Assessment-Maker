<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Metric structure of a regular hexagon</title>
  <desc id="desc">A regular hexagon of side s is divided into six equilateral center triangles. One long diagonal through the center is labeled 2s and one short diagonal spanning two sides is labeled square root of 3 times s.</desc>
  <rect width="760" height="540" fill="#f8fafc"/>
  <path d="M620 270 L500 62 L260 62 L140 270 L260 478 L500 478 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="5"/>
  <g stroke="#94a3b8" stroke-width="2"><line x1="380" y1="270" x2="620" y2="270"/><line x1="380" y1="270" x2="500" y2="62"/><line x1="380" y1="270" x2="260" y2="62"/><line x1="380" y1="270" x2="140" y2="270"/><line x1="380" y1="270" x2="260" y2="478"/><line x1="380" y1="270" x2="500" y2="478"/></g>
  <line x1="140" y1="270" x2="620" y2="270" stroke="#dc2626" stroke-width="5"/>
  <line x1="260" y1="62" x2="260" y2="478" stroke="#059669" stroke-width="5"/>
  <g font-family="Arial" font-size="22" font-weight="700"><text x="535" y="170" fill="#4338ca">s</text><text x="380" y="250" text-anchor="middle" fill="#b91c1c">2s</text><text x="275" y="240" fill="#047857">√3 s</text><text x="390" y="295" fill="#0f172a">O</text></g>
  <text x="380" y="525" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Central angles are 60°, so each center triangle is equilateral.</text>
</svg>
