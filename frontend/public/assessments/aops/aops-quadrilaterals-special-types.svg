<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="390" viewBox="0 0 1050 390" role="img" aria-labelledby="title desc">
  <title id="title">Rectangle, rhombus, and square property comparison</title>
  <desc id="desc">Three panels show a rectangle with right angles and congruent diagonals, a rhombus with four equal sides and perpendicular diagonals, and a square carrying both sets of properties.</desc>
  <rect width="1050" height="390" fill="#f8fafc"/>
  <g font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">
    <text x="175" y="38" text-anchor="middle">Rectangle</text><text x="525" y="38" text-anchor="middle">Rhombus</text><text x="875" y="38" text-anchor="middle">Square</text>
  </g>
  <g transform="translate(25,60)">
    <rect x="20" y="65" width="270" height="170" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
    <line x1="20" y1="65" x2="290" y2="235" stroke="#dc2626" stroke-width="3"/>
    <line x1="290" y1="65" x2="20" y2="235" stroke="#dc2626" stroke-width="3"/>
    <path d="M20 88 h23 v-23 M267 65 v23 h23 M290 212 h-23 v23 M43 235 v-23 h-23" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <text x="155" y="275" text-anchor="middle" font-family="Arial" font-size="18">four right angles; equal diagonals</text>
  </g>
  <g transform="translate(365,60)">
    <path d="M155 35 L290 150 L155 265 L20 150 Z" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
    <line x1="155" y1="35" x2="155" y2="265" stroke="#7c3aed" stroke-width="3"/>
    <line x1="20" y1="150" x2="290" y2="150" stroke="#7c3aed" stroke-width="3"/>
    <path d="M155 132 h18 v18" fill="none" stroke="#dc2626" stroke-width="3"/>
    <g stroke="#dc2626" stroke-width="4"><line x1="81" y1="91" x2="91" y2="103"/><line x1="219" y1="92" x2="229" y2="102"/><line x1="80" y1="209" x2="91" y2="198"/><line x1="219" y1="208" x2="229" y2="198"/></g>
    <text x="155" y="300" text-anchor="middle" font-family="Arial" font-size="18">four equal sides; perpendicular diagonals</text>
  </g>
  <g transform="translate(725,60)">
    <rect x="45" y="35" width="230" height="230" fill="#fef3c7" stroke="#a16207" stroke-width="4"/>
    <line x1="45" y1="35" x2="275" y2="265" stroke="#7c3aed" stroke-width="3"/>
    <line x1="275" y1="35" x2="45" y2="265" stroke="#7c3aed" stroke-width="3"/>
    <path d="M45 58 h23 v-23 M252 35 v23 h23 M275 242 h-23 v23 M68 265 v-23 h-23" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="160" y="300" text-anchor="middle" font-family="Arial" font-size="18">rectangle and rhombus properties</text>
  </g>
</svg>
