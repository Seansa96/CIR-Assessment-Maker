<svg xmlns="http://www.w3.org/2000/svg" width="620" height="370" viewBox="0 0 620 370" role="img" aria-labelledby="title desc">
  <title id="title">A 7-24-25 right triangle</title>
  <desc id="desc">Right triangle ABC has hypotenuse 25, one leg 7, an unknown leg y, and a right-angle marker between the legs.</desc>
  <rect width="620" height="370" fill="#f8fafc"/>
  <path d="M100 300 L520 300 L100 178 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M100 278 h22 v22" fill="none" stroke="#dc2626" stroke-width="4"/>
  <g font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">
    <text x="75" y="247">7</text><text x="300" y="334" fill="#b91c1c">y</text><text x="305" y="226" transform="rotate(16 305 226)">25</text>
    <text x="78" y="325">A</text><text x="525" y="325">B</text><text x="78" y="170">C</text>
  </g>
  <text x="310" y="360" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">The right-angle mark licenses 7 squared + y squared = 25 squared.</text>
</svg>
