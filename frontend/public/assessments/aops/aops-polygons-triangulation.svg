<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Triangulating a convex heptagon from one vertex</title>
  <desc id="desc">Convex heptagon ABCDEFG has four diagonals drawn from vertex A to C, D, E, and F, partitioning it into five nonoverlapping triangles.</desc>
  <rect width="760" height="520" fill="#f8fafc"/>
  <path d="M380 55 L590 145 L655 315 L520 455 L280 455 L105 315 L170 145 Z" fill="#fef3c7" stroke="#a16207" stroke-width="5"/>
  <g stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 7">
    <line x1="380" y1="55" x2="655" y2="315"/><line x1="380" y1="55" x2="520" y2="455"/>
    <line x1="380" y1="55" x2="280" y2="455"/><line x1="380" y1="55" x2="105" y2="315"/>
  </g>
  <g font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">
    <text x="375" y="38">A</text><text x="603" y="142">B</text><text x="668" y="320">C</text>
    <text x="525" y="485">D</text><text x="260" y="485">E</text><text x="76" y="322">F</text><text x="140" y="142">G</text>
  </g>
  <g font-family="Arial" font-size="19" fill="#334155" text-anchor="middle">
    <text x="505" y="135">1</text><text x="538" y="255">2</text><text x="455" y="325">3</text><text x="330" y="325">4</text><text x="215" y="250">5</text>
    <text x="380" y="510">A convex 7-gon becomes 7 − 2 = 5 triangles.</text>
  </g>
</svg>
