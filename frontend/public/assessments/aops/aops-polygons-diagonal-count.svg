<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Counting the diagonals of a regular pentagon</title>
  <desc id="desc">A regular pentagon ABCDE contains its five diagonals drawn in red. Each vertex has two diagonal endpoints, giving ten vertex-diagonal incidences, and division by two gives five distinct diagonals.</desc>
  <rect width="760" height="540" fill="#f8fafc"/>
  <path d="M380 55 L620 230 L528 495 L232 495 L140 230 Z" fill="#fef3c7" stroke="#a16207" stroke-width="5"/>
  <g stroke="#dc2626" stroke-width="4"><line x1="380" y1="55" x2="528" y2="495"/><line x1="380" y1="55" x2="232" y2="495"/><line x1="620" y1="230" x2="232" y2="495"/><line x1="620" y1="230" x2="140" y2="230"/><line x1="528" y1="495" x2="140" y2="230"/></g>
  <g font-family="Arial" font-size="24" font-weight="700" fill="#0f172a"><text x="372" y="40">A</text><text x="635" y="230">B</text><text x="535" y="520">C</text><text x="210" y="520">D</text><text x="110" y="230">E</text></g>
  <rect x="260" y="245" width="240" height="70" rx="12" fill="white" fill-opacity="0.9" stroke="#64748b"/>
  <text x="380" y="274" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">5(5 − 3) = 10 incidences</text>
  <text x="380" y="302" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">10 ÷ 2 = 5 diagonals</text>
</svg>
