<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title desc">
  <title id="title">Counterexamples to unsafe quadrilateral converses</title>
  <desc id="desc">A non-rhombus kite has perpendicular diagonals, and a non-rectangle isosceles trapezoid has congruent diagonals. These show that either diagonal property alone is insufficient for the stronger classification.</desc>
  <rect width="760" height="455" fill="#f8fafc"/>
  <g font-family="Arial" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="190" y="25">Perpendicular diagonals</text>
    <text x="190" y="47">do not force a rhombus</text>
    <text x="570" y="25">Congruent diagonals</text>
    <text x="570" y="47">do not force a rectangle</text>
  </g>
  <g transform="translate(20,70)">
    <path d="M170 20 L300 155 L170 350 L40 155 Z" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
    <line x1="170" y1="20" x2="170" y2="350" stroke="#7c3aed" stroke-width="3"/>
    <line x1="40" y1="155" x2="300" y2="155" stroke="#7c3aed" stroke-width="3"/>
    <path d="M170 137 h18 v18" fill="none" stroke="#dc2626" stroke-width="3"/>
    <g stroke="#dc2626" stroke-width="4"><line x1="91" y1="92" x2="102" y2="103"/><line x1="238" y1="103" x2="249" y2="92"/><line x1="88" y1="252" x2="102" y2="242"/><line x1="238" y1="242" x2="252" y2="252"/></g>
  </g>
  <g transform="translate(400,70)">
    <path d="M25 330 L75 80 L285 80 L335 330 Z" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
    <line x1="25" y1="330" x2="285" y2="80" stroke="#dc2626" stroke-width="3"/>
    <line x1="335" y1="330" x2="75" y2="80" stroke="#dc2626" stroke-width="3"/>
    <g stroke="#dc2626" stroke-width="4"><line x1="153" y1="198" x2="166" y2="211"/><line x1="194" y1="211" x2="207" y2="198"/></g>
    <text x="180" y="370" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">The slanted legs prevent four right angles.</text>
  </g>
</svg>
