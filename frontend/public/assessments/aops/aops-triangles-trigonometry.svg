<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-labelledby="title desc">
  <title id="title">Right-triangle side roles relative to theta</title>
  <desc id="desc">A right triangle has angle theta at the left base, a horizontal adjacent leg, a vertical opposite leg, and a slanted hypotenuse. The right angle is marked at the lower right.</desc>
  <rect width="660" height="420" fill="#f8fafc"/>
  <path d="M80 315 L525 315 L525 70 Z" fill="#e0f2fe" stroke="#075985" stroke-width="4"/>
  <path d="M500 315 v-25 h25" fill="none" stroke="#dc2626" stroke-width="4"/>
  <path d="M128 315 A48 48 0 0 0 119 288" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <text x="132" y="294" font-family="Arial" font-size="26" fill="#7c3aed">&#952;</text>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700">
    <text x="285" y="350" text-anchor="middle" fill="#0f766e">adjacent</text>
    <text x="500" y="210" transform="rotate(-90 500 210)" text-anchor="middle" fill="#b91c1c">opposite</text>
    <text x="275" y="170" transform="rotate(-29 275 170)" fill="#1d4ed8">hypotenuse</text>
  </g>
  <text x="330" y="382" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">Side names depend on the chosen acute angle.</text>
  <text x="330" y="407" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">The hypotenuse is always opposite the right angle.</text>
</svg>
