<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Exterior turns around a regular pentagon</title>
  <desc id="desc">A regular pentagon is traversed counterclockwise. Five curved arrows outside the vertices mark equal 72 degree exterior turns, totaling one full 360 degree revolution.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#dc2626"/></marker></defs>
  <rect width="760" height="540" fill="#f8fafc"/>
  <path d="M380 65 L620 240 L528 495 L232 495 L140 240 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
  <g fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)">
    <path d="M325 58 Q380 18 435 58"/><path d="M625 185 Q675 225 640 282"/>
    <path d="M574 475 Q550 515 490 508"/><path d="M270 508 Q210 515 186 475"/>
    <path d="M120 282 Q85 225 135 185"/>
  </g>
  <g font-family="Arial" font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle">
    <text x="380" y="42">72°</text><text x="675" y="240">72°</text><text x="535" y="518">72°</text><text x="225" y="518">72°</text><text x="85" y="240">72°</text>
  </g>
  <text x="380" y="300" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">5 × 72° = 360°</text>
  <text x="380" y="330" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">One exterior turn at each vertex completes one revolution.</text>
</svg>
