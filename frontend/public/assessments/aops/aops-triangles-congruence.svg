<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-labelledby="title desc">
  <title id="title">Corresponding parts in two congruent triangles</title>
  <desc id="desc">Triangles ABC and DEF have matching one-tick, two-tick, and three-tick sides. Their vertex order is A to D, B to E, and C to F.</desc>
  <rect width="620" height="340" fill="#f8fafc"/>
  <path d="M55 280 L185 55 L285 280 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M350 280 L480 55 L580 280 Z" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
  <g stroke="#dc2626" stroke-width="4">
    <line x1="113" y1="171" x2="125" y2="178"/><line x1="408" y1="171" x2="420" y2="178"/>
    <line x1="230" y1="162" x2="218" y2="169"/><line x1="237" y1="174" x2="225" y2="181"/>
    <line x1="525" y1="162" x2="513" y2="169"/><line x1="532" y1="174" x2="520" y2="181"/>
    <line x1="155" y1="270" x2="155" y2="290"/><line x1="170" y1="270" x2="170" y2="290"/><line x1="185" y1="270" x2="185" y2="290"/>
    <line x1="450" y1="270" x2="450" y2="290"/><line x1="465" y1="270" x2="465" y2="290"/><line x1="480" y1="270" x2="480" y2="290"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    <text x="174" y="43">A</text><text x="34" y="307">B</text><text x="290" y="307">C</text>
    <text x="469" y="43">D</text><text x="329" y="307">E</text><text x="585" y="307">F</text>
  </g>
  <text x="310" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">The marks encode AB = DE, AC = DF, and BC = EF.</text>
</svg>
