<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">A parametric path marked by parameter values</title>
  <desc id="desc">A coordinate grid with a smooth curve moving from a lower-left point at t equals zero to an upper-right point at t equals two.</desc>
  <defs><marker id="curveArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#7c3aed"/></marker></defs>
  <rect width="360" height="260" fill="#f8fafc" rx="12"/>
  <g stroke="#cbd5e1" stroke-width="1"><path d="M60 30V225 M110 30V225 M160 30V225 M210 30V225 M260 30V225 M310 30V225 M35 50H330 M35 100H330 M35 150H330 M35 200H330"/></g>
  <path d="M35 200 H330 M60 225 V25" stroke="#334155" stroke-width="2"/>
  <path d="M82 190 C112 177, 122 144, 156 130 S211 103, 286 48" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#curveArrow)"/>
  <g fill="#dc2626"><circle cx="82" cy="190" r="5"/><circle cx="156" cy="130" r="5"/><circle cx="286" cy="48" r="5"/></g>
  <text x="333" y="205" font-family="sans-serif" font-size="16" fill="#0f172a">x</text><text x="65" y="25" font-family="sans-serif" font-size="16" fill="#0f172a">y</text>
  <text x="68" y="214" font-family="sans-serif" font-size="14" fill="#991b1b">t = 0</text><text x="143" y="121" font-family="sans-serif" font-size="14" fill="#991b1b">t = 1</text><text x="287" y="42" font-family="sans-serif" font-size="14" fill="#991b1b">t = 2</text>
  <text x="185" y="178" font-family="sans-serif" font-size="14" fill="#6d28d9">increasing t</text>
</svg>
