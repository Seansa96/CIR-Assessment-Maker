<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Multivariable chain rule dependency tree</title>
  <desc id="desc">The parameter t feeds x(t) and y(t), which feed z=f(x,y). The two paths contribute f sub x times x prime and f sub y times y prime to dz over dt.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="720" height="340" rx="18" fill="#f8fafc"/>
  <text x="32" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Follow every dependency path</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="52" y="136" width="112" height="62" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="108" y="174" font-size="22" fill="#1e1b4b">t</text>
    <rect x="286" y="72" width="142" height="62" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="357" y="110" font-size="20" fill="#172554">x(t)</text>
    <rect x="286" y="204" width="142" height="62" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="357" y="242" font-size="20" fill="#172554">y(t)</text>
    <rect x="548" y="136" width="132" height="62" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="614" y="174" font-size="20" fill="#14532d">z = f(x,y)</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M164 150L282 104"/><path d="M164 184L282 232"/>
    <path d="M428 104L544 150"/><path d="M428 232L544 184"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#334155" text-anchor="middle">
    <text x="220" y="112">x′(t)</text><text x="220" y="234">y′(t)</text>
    <text x="488" y="112">fₓ</text><text x="488" y="239">fᵧ</text>
  </g>
  <path d="M102 286H615" stroke="#2563eb" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="360" y="319" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="600" fill="#1d4ed8">dz/dt = fₓ x′(t) + fᵧ y′(t)</text>
</svg>
