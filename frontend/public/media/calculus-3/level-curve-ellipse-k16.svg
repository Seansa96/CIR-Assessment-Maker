<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">Ellipse level curve at value 16</title>
  <desc id="desc">The level curve x squared plus four y squared equals 16 is an ellipse with horizontal semiaxis 4 and vertical semiaxis 2.</desc>
  <rect width="640" height="440" fill="#fff"/><text x="320" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#19324a">Level curve: x² + 4y² = 16</text>
  <rect x="78" y="68" width="500" height="300" fill="#fbfcfd" stroke="#b7c4d0" stroke-width="2"/>
  <g stroke="#e2e8ee"><line x1="128" y1="68" x2="128" y2="368"/><line x1="178" y1="68" x2="178" y2="368"/><line x1="228" y1="68" x2="228" y2="368"/><line x1="278" y1="68" x2="278" y2="368"/><line x1="328" y1="68" x2="328" y2="368"/><line x1="378" y1="68" x2="378" y2="368"/><line x1="428" y1="68" x2="428" y2="368"/><line x1="478" y1="68" x2="478" y2="368"/><line x1="528" y1="68" x2="528" y2="368"/><line x1="78" y1="118" x2="578" y2="118"/><line x1="78" y1="168" x2="578" y2="168"/><line x1="78" y1="218" x2="578" y2="218"/><line x1="78" y1="268" x2="578" y2="268"/><line x1="78" y1="318" x2="578" y2="318"/></g>
  <line x1="90" y1="218" x2="568" y2="218" stroke="#475569" stroke-width="2.5"/><line x1="328" y1="355" x2="328" y2="82" stroke="#475569" stroke-width="2.5"/>
  <ellipse cx="328" cy="218" rx="200" ry="100" fill="#d9edf2" fill-opacity=".5" stroke="#17658a" stroke-width="4"/><circle cx="328" cy="218" r="5" fill="#334155"/>
  <text x="565" y="241" font-family="Arial,sans-serif" font-size="18" fill="#334155">x</text><text x="345" y="96" font-family="Arial,sans-serif" font-size="18" fill="#334155">y</text>
  <text x="128" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4e89">−4</text><text x="528" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4e89">4</text><text x="347" y="119" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4e89">2</text><text x="347" y="326" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4e89">−2</text>
  <text x="320" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">Semiaxes: 4 along x and 2 along y</text>
</svg>
