<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">An ordered pair maps to one function value</title>
  <desc id="desc">The input pair (2, negative 1) enters the rule g of x and y equals 2x minus y squared, producing the scalar output 3.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536579"/></marker></defs>
  <rect width="760" height="340" rx="18" fill="#f8fafc"/>
  <text x="380" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#19324a">One ordered input, one scalar output</text>
  <rect x="35" y="110" width="175" height="125" rx="14" fill="#e8f1fb" stroke="#4f78a6" stroke-width="2"/>
  <text x="122" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#526579">input pair</text><text x="122" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#19324a">(2, −1)</text>
  <line x1="220" y1="173" x2="293" y2="173" stroke="#536579" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="305" y="110" width="175" height="125" rx="14" fill="#fff" stroke="#7c6baa" stroke-width="2"/>
  <text x="392" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#526579">rule</text><text x="392" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#40356c">g=2x−y²</text>
  <line x1="490" y1="173" x2="563" y2="173" stroke="#536579" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="575" y="110" width="150" height="125" rx="14" fill="#e9f6ef" stroke="#45835e" stroke-width="2"/>
  <text x="650" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#526579">output</text><text x="650" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#245b38">3</text>
  <text x="380" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">2(2) − (−1)² = 3</text>
</svg>
