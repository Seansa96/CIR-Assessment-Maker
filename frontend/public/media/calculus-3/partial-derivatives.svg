<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">Ordinary derivative and partial derivatives compared</title><desc id="desc">Left: a one-variable curve y equals F of x with a tangent at x equals a; its slope is F prime of a. Right: a surface z equals f of x and y with two coordinate slices through the same point. Fixing y gives slope f sub x; fixing x gives slope f sub y. Each partial is an ordinary derivative along one selected slice.</desc><rect width="1120" height="560" rx="20" fill="#f8fafc"/><rect x="24" y="62" width="410" height="420" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="454" y="62" width="642" height="420" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="48" y="101" font-family="sans-serif" font-size="23" font-weight="bold" fill="#0f172a">One input: ordinary derivative</text><text x="479" y="101" font-family="sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Two inputs: choose a surface slice</text><path d="M78 405H390M112 430V145" stroke="#334155" stroke-width="3"/><text x="394" y="411" font-family="sans-serif" font-size="18">x</text><text x="96" y="141" font-family="sans-serif" font-size="18">y=F(x)</text><path d="M130 370 C175 330 192 257 248 245 C296 235 330 280 367 348" fill="none" stroke="#2563eb" stroke-width="6"/><path d="M198 289L300 205" stroke="#d97706" stroke-width="4" stroke-dasharray="10 7"/><circle cx="248" cy="245" r="8" fill="#dc2626"/><text x="253" y="267" font-family="sans-serif" font-size="18" fill="#991b1b">(a,F(a))</text><text x="130" y="452" font-family="sans-serif" font-size="19" fill="#b45309">tangent slope = F′(a)</text><text x="483" y="135" font-family="sans-serif" font-size="17" fill="#475569">Each colored curve is an ordinary 1-D slice of the surface.</text><path d="M528 393 Q666 272 802 288 Q930 305 1045 178 M528 393 Q690 432 802 288 Q893 202 1045 178 M544 385 Q677 308 802 288 Q933 250 1033 188" fill="none" stroke="#a8b5c3" stroke-width="3"/><path d="M544 385 Q677 308 802 288 Q933 250 1033 188" fill="none" stroke="#2563eb" stroke-width="7"/><path d="M794 294 Q841 241 884 211" fill="none" stroke="#7c3aed" stroke-width="7"/><path d="M747 306L863 270" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="9 7"/><path d="M780 319L827 259" stroke="#6d28d9" stroke-width="4" stroke-dasharray="9 7"/><circle cx="802" cy="288" r="9" fill="#dc2626"/><text x="814" y="316" font-family="sans-serif" font-size="17" fill="#991b1b">(a,b,f(a,b))</text><text x="553" y="431" font-family="sans-serif" font-size="19" fill="#1d4ed8">y=b fixed; x varies: slope fₓ(a,b)</text><text x="832" y="168" font-family="sans-serif" font-size="19" fill="#6d28d9">x=a fixed; y varies: slope fᵧ(a,b)</text><path d="M510 409H1065M545 441L925 158M545 441V168" stroke="#334155" stroke-width="2"/><text x="1068" y="414" font-family="sans-serif" font-size="17">x</text><text x="930" y="157" font-family="sans-serif" font-size="17">y</text><text x="522" y="164" font-family="sans-serif" font-size="17">z=f(x,y)</text><text x="95" y="523" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Curve → one ordinary slope</text><text x="520" y="523" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Surface → many possible directional rates; each partial selects one coordinate slice</text></svg>