<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Unit circle with a polar point</title>
  <desc id="desc">A unit circle on coordinate axes with a point at angle theta and coordinates cosine theta, sine theta.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#334155"/></marker></defs>
  <rect width="360" height="260" fill="#f8fafc" rx="12"/>
  <path d="M38 135 H326 M180 238 V22" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="180" cy="135" r="86" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M218 135 A38 38 0 0 0 202 102" fill="none" stroke="#f97316" stroke-width="3"/>
  <line x1="180" y1="135" x2="223" y2="61" stroke="#0f766e" stroke-width="3"/>
  <line x1="223" y1="61" x2="223" y2="135" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <line x1="223" y1="61" x2="180" y2="61" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <circle cx="223" cy="61" r="5" fill="#dc2626"/>
  <text x="331" y="128" font-family="sans-serif" font-size="16" fill="#0f172a">x</text>
  <text x="188" y="27" font-family="sans-serif" font-size="16" fill="#0f172a">y</text>
  <text x="201" y="124" font-family="serif" font-size="20" fill="#c2410c">θ</text>
  <text x="192" y="94" font-family="sans-serif" font-size="15" fill="#0f766e">r = 1</text>
  <text x="231" y="57" font-family="sans-serif" font-size="14" fill="#991b1b">(cos θ, sin θ)</text>
  <text x="226" y="153" font-family="sans-serif" font-size="13" fill="#475569">cos θ</text>
  <text x="124" y="58" font-family="sans-serif" font-size="13" fill="#475569">sin θ</text>
  <circle cx="180" cy="135" r="3" fill="#0f172a"/>
</svg>
