<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" role="img" aria-labelledby="title desc">
  <title id="title">Three inputs determine one temperature output</title>
  <desc id="desc">Two location coordinates x and y and a time coordinate t enter a scalar-valued temperature function T, which returns one temperature.</desc>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#536579"/></marker></defs>
  <rect width="780" height="350" rx="16" fill="#f8fafc"/><text x="390" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#19324a">Three coordinates, one scalar value</text>
  <rect x="36" y="100" width="275" height="170" rx="12" fill="#e9f2fb" stroke="#4f78a6" stroke-width="2"/>
  <text x="173" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#526579">ordered input triple</text>
  <text x="173" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#19324a">longitude, latitude</text>
  <text x="173" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#19324a">time</text>
  <text x="173" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">(x, y, t)</text>
  <line x1="321" y1="185" x2="390" y2="185" stroke="#536579" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="402" y="120" width="150" height="130" rx="12" fill="#fff" stroke="#7c6baa" stroke-width="2"/><text x="477" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#526579">function rule</text><text x="477" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#40356c">T(x,y,t)</text>
  <line x1="562" y1="185" x2="625" y2="185" stroke="#536579" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="636" y="120" width="115" height="130" rx="12" fill="#fff3df" stroke="#d58c24" stroke-width="2"/><text x="693" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#735018">output</text><text x="693" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#8a4b0a">°C</text>
  <text x="390" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526579">At a fixed time, the model becomes a function of location alone.</text>
</svg>
