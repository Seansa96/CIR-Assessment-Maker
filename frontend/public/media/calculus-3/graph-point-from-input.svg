<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">A graph point appends the function value to its inputs</title>
  <desc id="desc">A point (x,y) in the domain plane is evaluated by f. The resulting graph point in three-dimensional space is (x,y,z), where z equals f of x and y.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536579"/></marker></defs>
  <rect width="760" height="400" rx="16" fill="#f8fafc"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#19324a">A graph point appends the function value</text>
  <rect x="36" y="92" width="205" height="230" rx="14" fill="#e8f1fb" stroke="#4f78a6" stroke-width="2"/>
  <text x="138" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#526579">domain input</text>
  <text x="138" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#19324a">(x, y)</text>
  <text x="138" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">a point in D ⊂ R²</text>
  <line x1="72" y1="264" x2="205" y2="264" stroke="#536579" stroke-width="2"/>
  <line x1="138" y1="291" x2="138" y2="238" stroke="#536579" stroke-width="2"/>
  <circle cx="168" cy="251" r="6" fill="#2563a6"/><text x="176" y="249" font-family="Arial,sans-serif" font-size="15" fill="#1d4e89">(x,y)</text>
  <line x1="257" y1="206" x2="330" y2="206" stroke="#536579" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="344" y="137" width="115" height="138" rx="14" fill="#fff" stroke="#7c6baa" stroke-width="2"/>
  <text x="401" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526579">evaluate</text>
  <text x="401" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#40356c">f(x,y)</text>
  <line x1="475" y1="206" x2="538" y2="206" stroke="#536579" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="552" y="92" width="172" height="230" rx="14" fill="#e9f6ef" stroke="#45835e" stroke-width="2"/>
  <text x="638" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#526579">graph in R³</text>
  <text x="638" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#245b38">(x, y, z)</text>
  <text x="638" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">with z = f(x,y)</text>
  <text x="638" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526579">input coordinates</text>
  <text x="638" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526579">plus output height</text>
  <text x="380" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">The full graph is the set of all such triples over the domain.</text>
</svg>
