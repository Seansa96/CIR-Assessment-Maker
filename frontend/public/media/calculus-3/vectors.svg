<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Vector addition in space</title>
  <desc id="desc">Coordinate axes with two vectors from the origin and their componentwise sum.</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2563eb"/></marker>
    <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#7c3aed"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#059669"/></marker>
  </defs>
  <rect width="640" height="360" rx="16" fill="#f8fafc"/>
  <text x="40" y="44" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Vectors in Space</text>
  <path d="M105 294H570M105 294V91M105 294L42 333" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="578" y="300" font-family="sans-serif" font-size="18" fill="#334155">x</text><text x="96" y="81" font-family="sans-serif" font-size="18" fill="#334155">z</text><text x="27" y="342" font-family="sans-serif" font-size="18" fill="#334155">y</text>
  <path d="M105 294L295 202" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/><text x="206" y="184" font-family="sans-serif" font-size="18" fill="#1d4ed8">u = (2, 1, 0)</text>
  <path d="M105 294L187 123" stroke="#7c3aed" stroke-width="5" marker-end="url(#violet)"/><text x="122" y="138" font-family="sans-serif" font-size="18" fill="#6d28d9">v = (1, 0, 2)</text>
  <path d="M105 294L377 110" stroke="#059669" stroke-width="5" marker-end="url(#green)"/><text x="388" y="117" font-family="sans-serif" font-size="18" fill="#047857">u + v = (3, 1, 2)</text>
  <circle cx="105" cy="294" r="6" fill="#dc2626"/><text x="115" y="320" font-family="sans-serif" font-size="16" fill="#334155">origin</text>
</svg>
