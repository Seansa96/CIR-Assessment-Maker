<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
  <title id="title">Closed disk domain for a square-root function</title>
  <desc id="desc">The function h of x and y equals the square root of 9 minus x squared minus y squared is defined on the closed disk x squared plus y squared less than or equal to 9. The solid circular boundary is included.</desc>
  <rect width="620" height="500" fill="#fff"/><text x="310" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#19324a">Domain in the xy-plane</text>
  <rect x="92" y="70" width="436" height="360" fill="#fbfcfd" stroke="#b7c4d0" stroke-width="2"/>
  <g stroke="#e3e9ef"><line x1="165" y1="70" x2="165" y2="430"/><line x1="237" y1="70" x2="237" y2="430"/><line x1="310" y1="70" x2="310" y2="430"/><line x1="383" y1="70" x2="383" y2="430"/><line x1="455" y1="70" x2="455" y2="430"/><line x1="92" y1="130" x2="528" y2="130"/><line x1="92" y1="190" x2="528" y2="190"/><line x1="92" y1="250" x2="528" y2="250"/><line x1="92" y1="310" x2="528" y2="310"/><line x1="92" y1="370" x2="528" y2="370"/></g>
  <circle cx="310" cy="250" r="150" fill="#a8d5ee" fill-opacity=".55" stroke="#17658a" stroke-width="4"/>
  <line x1="105" y1="250" x2="515" y2="250" stroke="#3e5368" stroke-width="2.5"/><line x1="310" y1="415" x2="310" y2="84" stroke="#3e5368" stroke-width="2.5"/>
  <text x="515" y="275" font-family="Arial,sans-serif" font-size="19" fill="#334155">x</text><text x="326" y="95" font-family="Arial,sans-serif" font-size="19" fill="#334155">y</text>
  <line x1="310" y1="250" x2="460" y2="250" stroke="#b45309" stroke-width="3"/><circle cx="460" cy="250" r="5" fill="#b45309"/><text x="386" y="238" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#92400e">radius 3</text>
  <text x="310" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">x² + y² ≤ 9 · solid boundary is included</text>
</svg>
