<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc">
  <title id="title">Contour labeled 18 on a level curve map</title>
  <desc id="desc">A schematic x-y contour map with three nested level curves labeled 12, 18, and 24. Point P lies on the middle curve labeled 18, so its coordinates satisfy f(x,y)=18.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
      .grid { stroke: #e4e9ee; stroke-width: 1; }
      .axis { stroke: #536577; stroke-width: 2.5; }
      .level { fill: none; stroke: #236b8e; stroke-width: 4; }
      .label { font-size: 21px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
    </style>
    <marker id="axisArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#536577"/></marker>
  </defs>
  <rect width="780" height="520" fill="#ffffff"/>
  <text x="390" y="42" text-anchor="middle" font-size="27" font-weight="700">Read a contour label as a function value</text>
  <text x="390" y="72" text-anchor="middle" font-size="17" fill="#526575">Schematic level curves in the xy-plane</text>
  <rect x="95" y="100" width="590" height="350" rx="8" fill="#fbfcfd" stroke="#b8c5d0" stroke-width="2"/>
  <g class="grid">
    <line x1="195" y1="100" x2="195" y2="450"/><line x1="295" y1="100" x2="295" y2="450"/><line x1="395" y1="100" x2="395" y2="450"/><line x1="495" y1="100" x2="495" y2="450"/><line x1="595" y1="100" x2="595" y2="450"/>
    <line x1="95" y1="170" x2="685" y2="170"/><line x1="95" y1="240" x2="685" y2="240"/><line x1="95" y1="310" x2="685" y2="310"/><line x1="95" y1="380" x2="685" y2="380"/>
  </g>
  <line class="axis" x1="115" y1="275" x2="660" y2="275" marker-end="url(#axisArrow)"/>
  <line class="axis" x1="395" y1="430" x2="395" y2="118" marker-end="url(#axisArrow)"/>
  <text x="660" y="300" font-size="21" font-style="italic">x</text>
  <text x="411" y="126" font-size="21" font-style="italic">y</text>
  <ellipse class="level" cx="395" cy="275" rx="220" ry="135"/>
  <ellipse class="level" cx="395" cy="275" rx="155" ry="90"/>
  <ellipse class="level" cx="395" cy="275" rx="85" ry="48"/>
  <text class="label" x="571" y="172">12</text>
  <text class="label" x="526" y="211">18</text>
  <text class="label" x="451" y="251">24</text>
  <circle cx="240" cy="275" r="8" fill="#c2410c" stroke="#fff" stroke-width="3"/>
  <text x="219" y="263" text-anchor="end" font-size="19" font-weight="700" fill="#9a3412">P</text>
  <text x="390" y="488" text-anchor="middle" font-size="18">P lies on the curve whose label is 18.</text>
</svg>
