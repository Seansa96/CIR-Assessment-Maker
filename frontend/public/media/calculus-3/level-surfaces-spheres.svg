<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
  <title id="title">Spherical level surfaces and their equatorial cross sections</title>
  <desc id="desc">For F of x, y, z equals x squared plus y squared plus z squared, levels 4, 9, and 16 are spheres of radii 2, 3, and 4. Their intersections with the plane z equals zero are shown as concentric circles.</desc>
  <rect width="700" height="470" fill="#fff"/><text x="350" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#19324a">Level surfaces of F = x² + y² + z²</text><text x="350" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526575">Equatorial cross sections in the plane z = 0</text>
  <rect x="75" y="92" width="550" height="300" rx="8" fill="#fbfcfd" stroke="#bac6d1" stroke-width="2"/>
  <g stroke="#e4eaf0"><line x1="150" y1="92" x2="150" y2="392"/><line x1="225" y1="92" x2="225" y2="392"/><line x1="300" y1="92" x2="300" y2="392"/><line x1="375" y1="92" x2="375" y2="392"/><line x1="450" y1="92" x2="450" y2="392"/><line x1="525" y1="92" x2="525" y2="392"/><line x1="75" y1="167" x2="625" y2="167"/><line x1="75" y1="242" x2="625" y2="242"/><line x1="75" y1="317" x2="625" y2="317"/></g>
  <line x1="110" y1="242" x2="590" y2="242" stroke="#475569" stroke-width="2.5"/><line x1="350" y1="365" x2="350" y2="115" stroke="#475569" stroke-width="2.5"/>
  <circle cx="350" cy="242" r="150" fill="#b7d7eb" fill-opacity=".10" stroke="#276c91" stroke-width="4"/><circle cx="350" cy="242" r="112.5" fill="#e7c981" fill-opacity=".11" stroke="#b47716" stroke-width="4"/><circle cx="350" cy="242" r="75" fill="#b9d5bd" fill-opacity=".18" stroke="#45835e" stroke-width="4"/>
  <circle cx="350" cy="242" r="4" fill="#334155"/>
  <line x1="100" y1="420" x2="122" y2="420" stroke="#276c91" stroke-width="5"/><text x="130" y="426" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d5576">F = 16 · radius 4</text>
  <line x1="300" y1="420" x2="322" y2="420" stroke="#b47716" stroke-width="5"/><text x="330" y="426" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#8a5a10">F = 9 · radius 3</text>
  <line x1="500" y1="420" x2="522" y2="420" stroke="#45835e" stroke-width="5"/><text x="530" y="426" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#356a48">F = 4 · radius 2</text>
  <text x="350" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">Each complete level set is a sphere in three-dimensional input space.</text>
</svg>
