<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Gradient and directional derivative on level curves</title>
  <desc id="desc">Concentric level curves surround a point. The gradient vector points normal to the curve toward increasing values; a unit direction vector makes an angle with the gradient, and its directional derivative is the gradient dot that unit vector.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="720" height="360" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Gradient geometry at a point</text>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <ellipse cx="245" cy="207" rx="210" ry="112"/>
    <ellipse cx="245" cy="207" rx="170" ry="87"/>
    <ellipse cx="245" cy="207" rx="106" ry="62"/>
    <ellipse cx="245" cy="207" rx="64" ry="37"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#475569">
    <text x="452" y="162">f = c₄</text><text x="408" y="181">f = c₃</text><text x="367" y="197">f = c₂</text><text x="315" y="207">f = c₁</text>
  </g>
  <circle cx="351" cy="207" r="5" fill="#0f172a"/>
  <text x="341" y="231" font-family="sans-serif" font-size="15" fill="#0f172a">P</text>
  <path d="M351 207L500 207" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="448" y="194" font-family="sans-serif" font-size="17" font-weight="600" fill="#6d28d9">∇f</text>
  <path d="M351 207L440 118" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <text x="445" y="116" font-family="sans-serif" font-size="17" font-weight="600" fill="#1d4ed8">u (unit)</text>
  <path d="M351 207L351 300" stroke="#16a34a" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="365" y="326" font-family="sans-serif" font-size="16" fill="#15803d">tangent to level curve</text>
  <path d="M389 207A38 38 0 0 0 378 180" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="392" y="183" font-family="sans-serif" font-size="15" fill="#334155">θ</text>
  <rect x="490" y="222" width="198" height="76" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="589" y="253" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4c1d95">Dᵤf = ∇f · u</text>
  <text x="589" y="279" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5b21b6">maximum rate = |∇f|</text>
</svg>
