<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Improper integral limit map</title><desc id="desc">A decision map showing infinite tails, endpoint singularities, and interior singularities, each converted to one or two limits.</desc><rect width="960" height="440" fill="#10233b"/><g font-family="Arial, sans-serif" fill="#eef6ff"><text x="480" y="48" text-anchor="middle" font-size="28" font-weight="bold">Turn the defect into a limit</text><rect x="345" y="76" width="270" height="60" rx="12" fill="#1c4e70"/><text x="480" y="112" text-anchor="middle" font-size="19">What makes the integral improper?</text><path d="M480 136v34M190 170h580" stroke="#8ed1fc" stroke-width="3"/><path d="M190 170v40M480 170v40M770 170v40" stroke="#8ed1fc" stroke-width="3"/><g font-size="18" text-anchor="middle"><rect x="60" y="210" width="260" height="155" rx="12" fill="#174a5d"/><text x="190" y="242" font-weight="bold">Infinite interval</text><text x="190" y="277">$[a,∞)$ or $(-∞,b]$</text><text x="190" y="313">replace the infinite end</text><text x="190" y="342">with a moving cutoff limit</text><rect x="350" y="210" width="260" height="155" rx="12" fill="#5a3a67"/><text x="480" y="242" font-weight="bold">Endpoint blow-up</text><text x="480" y="277">vertical asymptote at a or b</text><text x="480" y="313">approach from inside</text><text x="480" y="342">with one one-sided limit</text><rect x="640" y="210" width="260" height="155" rx="12" fill="#74512f"/><text x="770" y="242" font-weight="bold">Interior blow-up</text><text x="770" y="277">vertical asymptote at c</text><text x="770" y="313">split at c; test left</text><text x="770" y="342">and right limits separately</text></g><text x="480" y="410" text-anchor="middle" font-size="19" fill="#ffe09b">Converges only when every required limit is finite.</text></g></svg>
