<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">U-substitution transforms a composite integrand into a simpler integral</title>
  <desc id="desc">A flow diagram begins with an integral containing an inner expression and its derivative, replaces the inner expression by u, integrates in u, and substitutes back.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/></marker></defs>
  <rect width="960" height="390" fill="#f8fafc"/>
  <text x="480" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#1e293b">U-substitution: preserve the whole differential</text>
  <rect x="35" y="95" width="210" height="185" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
  <text x="140" y="135" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="700" fill="#3730a3">1. Spot a pair</text>
  <text x="140" y="180" text-anchor="middle" font-family="serif" font-size="25" fill="#111827">∫ 2x cos(x²) dx</text>
  <text x="140" y="220" text-anchor="middle" font-family="system-ui" font-size="16" fill="#334155">inner: x²</text>
  <text x="140" y="246" text-anchor="middle" font-family="system-ui" font-size="16" fill="#334155">derivative: 2x dx</text>
  <path d="M255 188 H338" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="350" y="95" width="260" height="185" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text x="480" y="135" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="700" fill="#155e75">2. Change all pieces</text>
  <text x="480" y="180" text-anchor="middle" font-family="serif" font-size="25" fill="#111827">u = x², du = 2x dx</text>
  <text x="480" y="220" text-anchor="middle" font-family="serif" font-size="25" fill="#111827">∫ cos(u) du</text>
  <text x="480" y="246" text-anchor="middle" font-family="system-ui" font-size="16" fill="#334155">No x terms remain.</text>
  <path d="M620 188 H703" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="715" y="95" width="210" height="185" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="820" y="135" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="700" fill="#166534">3. Integrate, return</text>
  <text x="820" y="180" text-anchor="middle" font-family="serif" font-size="25" fill="#111827">sin(u) + C</text>
  <text x="820" y="220" text-anchor="middle" font-family="serif" font-size="25" fill="#111827">sin(x²) + C</text>
  <text x="480" y="335" text-anchor="middle" font-family="system-ui" font-size="18" fill="#475569">For a definite integral, change bounds to u-values instead of returning to x.</text>
</svg>
