<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Common sequence limit behaviors</title>
  <desc id="desc">Four small coordinate plots showing sequence terms converging to a horizontal limit, diverging upward, oscillating without settling, and oscillating with shrinking amplitude.</desc>
  <defs>
    <style>
      .panel{fill:#f7faf9;stroke:#b9c7c3;stroke-width:2}
      .axis{stroke:#5d6b70;stroke-width:2}
      .guide{stroke:#78908d;stroke-width:2;stroke-dasharray:6 6}
      .dot{fill:#0f766e}
      .dot2{fill:#b45309}
      .label{font-family:Arial, sans-serif;font-size:19px;fill:#20343a;font-weight:700}
      .small{font-family:Arial, sans-serif;font-size:15px;fill:#405157}
    </style>
  </defs>
  <rect width="960" height="360" fill="#eef3f2"/>
  <g transform="translate(20 24)">
    <rect class="panel" x="0" y="0" width="215" height="300" rx="10"/>
    <text class="label" x="18" y="34">Converges</text>
    <line class="axis" x1="30" y1="250" x2="190" y2="250"/>
    <line class="axis" x1="30" y1="250" x2="30" y2="58"/>
    <line class="guide" x1="35" y1="110" x2="190" y2="110"/>
    <text class="small" x="48" y="96">limit</text>
    <circle class="dot" cx="52" cy="185" r="6"/>
    <circle class="dot" cx="74" cy="154" r="6"/>
    <circle class="dot" cx="96" cy="135" r="6"/>
    <circle class="dot" cx="118" cy="123" r="6"/>
    <circle class="dot" cx="140" cy="116" r="6"/>
    <circle class="dot" cx="162" cy="113" r="6"/>
    <circle class="dot" cx="184" cy="111" r="6"/>
    <text class="small" x="24" y="282">terms settle near one value</text>
  </g>
  <g transform="translate(255 24)">
    <rect class="panel" x="0" y="0" width="215" height="300" rx="10"/>
    <text class="label" x="18" y="34">Diverges upward</text>
    <line class="axis" x1="30" y1="250" x2="190" y2="250"/>
    <line class="axis" x1="30" y1="250" x2="30" y2="58"/>
    <circle class="dot2" cx="52" cy="226" r="6"/>
    <circle class="dot2" cx="74" cy="207" r="6"/>
    <circle class="dot2" cx="96" cy="181" r="6"/>
    <circle class="dot2" cx="118" cy="148" r="6"/>
    <circle class="dot2" cx="140" cy="108" r="6"/>
    <circle class="dot2" cx="162" cy="72" r="6"/>
    <path d="M162 72 L162 45 L153 57 M162 45 L171 57" fill="none" stroke="#b45309" stroke-width="3"/>
    <text class="small" x="33" y="282">terms do not approach a finite value</text>
  </g>
  <g transform="translate(490 24)">
    <rect class="panel" x="0" y="0" width="215" height="300" rx="10"/>
    <text class="label" x="18" y="34">Oscillates</text>
    <line class="axis" x1="30" y1="155" x2="190" y2="155"/>
    <line class="axis" x1="30" y1="250" x2="30" y2="58"/>
    <circle class="dot2" cx="52" cy="88" r="6"/>
    <circle class="dot2" cx="74" cy="222" r="6"/>
    <circle class="dot2" cx="96" cy="88" r="6"/>
    <circle class="dot2" cx="118" cy="222" r="6"/>
    <circle class="dot2" cx="140" cy="88" r="6"/>
    <circle class="dot2" cx="162" cy="222" r="6"/>
    <circle class="dot2" cx="184" cy="88" r="6"/>
    <text class="small" x="32" y="282">two subsequences disagree</text>
  </g>
  <g transform="translate(725 24)">
    <rect class="panel" x="0" y="0" width="215" height="300" rx="10"/>
    <text class="label" x="18" y="34">Squeezed oscillation</text>
    <line class="axis" x1="30" y1="155" x2="190" y2="155"/>
    <line class="axis" x1="30" y1="250" x2="30" y2="58"/>
    <path d="M45 74 C80 95, 125 125, 190 146" fill="none" stroke="#78908d" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M45 236 C80 215, 125 185, 190 164" fill="none" stroke="#78908d" stroke-width="2" stroke-dasharray="6 6"/>
    <circle class="dot" cx="52" cy="80" r="6"/>
    <circle class="dot" cx="74" cy="220" r="6"/>
    <circle class="dot" cx="96" cy="112" r="6"/>
    <circle class="dot" cx="118" cy="194" r="6"/>
    <circle class="dot" cx="140" cy="135" r="6"/>
    <circle class="dot" cx="162" cy="176" r="6"/>
    <circle class="dot" cx="184" cy="149" r="6"/>
    <text class="small" x="25" y="282">oscillation shrinks to a limit</text>
  </g>
</svg>
