<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Partial sum behavior for infinite series</title>
  <desc id="desc">Three coordinate plots showing partial sums approaching a finite sum, diverging upward, and oscillating while settling.</desc>
  <defs>
    <style>
      .panel{fill:#f7faf9;stroke:#b9c7c3;stroke-width:2}
      .axis{stroke:#5d6b70;stroke-width:2}
      .guide{stroke:#78908d;stroke-width:2;stroke-dasharray:6 6}
      .curve{fill:none;stroke:#0f766e;stroke-width:4}
      .curve2{fill:none;stroke:#b45309;stroke-width:4}
      .dot{fill:#0f766e}
      .dot2{fill:#b45309}
      .label{font-family:Arial, sans-serif;font-size:20px;fill:#20343a;font-weight:700}
      .small{font-family:Arial, sans-serif;font-size:16px;fill:#405157}
    </style>
  </defs>
  <rect width="960" height="360" fill="#eef3f2"/>
  <g transform="translate(30 24)">
    <rect class="panel" x="0" y="0" width="280" height="300" rx="10"/>
    <text class="label" x="18" y="34">Partial sums converge</text>
    <line class="axis" x1="38" y1="250" x2="245" y2="250"/>
    <line class="axis" x1="38" y1="250" x2="38" y2="58"/>
    <line class="guide" x1="45" y1="98" x2="245" y2="98"/>
    <text class="small" x="55" y="84">finite sum $S$</text>
    <path class="curve" d="M58 224 C80 177, 103 145, 128 126 C158 105, 190 99, 236 98"/>
    <circle class="dot" cx="58" cy="224" r="5"/>
    <circle class="dot" cx="88" cy="167" r="5"/>
    <circle class="dot" cx="118" cy="132" r="5"/>
    <circle class="dot" cx="148" cy="112" r="5"/>
    <circle class="dot" cx="178" cy="103" r="5"/>
    <circle class="dot" cx="208" cy="100" r="5"/>
    <text class="small" x="38" y="282">$S_n$ approaches a horizontal limit</text>
  </g>
  <g transform="translate(340 24)">
    <rect class="panel" x="0" y="0" width="280" height="300" rx="10"/>
    <text class="label" x="18" y="34">Partial sums diverge</text>
    <line class="axis" x1="38" y1="250" x2="245" y2="250"/>
    <line class="axis" x1="38" y1="250" x2="38" y2="58"/>
    <path class="curve2" d="M58 235 C84 213, 112 186, 142 150 C176 109, 205 82, 232 62"/>
    <circle class="dot2" cx="58" cy="235" r="5"/>
    <circle class="dot2" cx="88" cy="209" r="5"/>
    <circle class="dot2" cx="118" cy="178" r="5"/>
    <circle class="dot2" cx="148" cy="142" r="5"/>
    <circle class="dot2" cx="178" cy="105" r="5"/>
    <circle class="dot2" cx="208" cy="78" r="5"/>
    <path d="M232 62 L232 35 L223 47 M232 35 L241 47" fill="none" stroke="#b45309" stroke-width="3"/>
    <text class="small" x="38" y="282">$S_n$ never settles to a finite sum</text>
  </g>
  <g transform="translate(650 24)">
    <rect class="panel" x="0" y="0" width="280" height="300" rx="10"/>
    <text class="label" x="18" y="34">Alternating settling</text>
    <line class="axis" x1="38" y1="250" x2="245" y2="250"/>
    <line class="axis" x1="38" y1="250" x2="38" y2="58"/>
    <line class="guide" x1="45" y1="145" x2="245" y2="145"/>
    <text class="small" x="55" y="132">sum</text>
    <polyline class="curve" points="58,92 84,202 110,116 136,176 162,132 188,162 214,141 240,149"/>
    <circle class="dot" cx="58" cy="92" r="5"/>
    <circle class="dot" cx="84" cy="202" r="5"/>
    <circle class="dot" cx="110" cy="116" r="5"/>
    <circle class="dot" cx="136" cy="176" r="5"/>
    <circle class="dot" cx="162" cy="132" r="5"/>
    <circle class="dot" cx="188" cy="162" r="5"/>
    <circle class="dot" cx="214" cy="141" r="5"/>
    <circle class="dot" cx="240" cy="149" r="5"/>
    <text class="small" x="34" y="282">upper and lower partial sums close in</text>
  </g>
</svg>
