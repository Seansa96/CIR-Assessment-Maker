<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Representative vertical slice for a geometric integral</title>
  <desc id="desc">A shaded region between two curves with a vertical slice labelled width dx and height top minus bottom.</desc>
  <rect width="900" height="430" fill="#0f172a"/>
  <path d="M80 355H850M130 390V45" stroke="#94a3b8" stroke-width="3"/>
  <path d="M160 295 C300 110 495 105 790 285" fill="none" stroke="#38bdf8" stroke-width="7"/>
  <path d="M160 315 C335 355 545 365 790 190" fill="none" stroke="#fbbf24" stroke-width="7"/>
  <path d="M250 262 C385 155 520 145 665 244 L665 286 C530 335 385 326 250 295Z" fill="#38bdf8" fill-opacity=".22"/>
  <rect x="455" y="161" width="42" height="155" fill="#a78bfa" fill-opacity=".55" stroke="#ddd6fe" stroke-width="3"/>
  <path d="M455 335v28M497 335v28M455 350h42" stroke="#ddd6fe" stroke-width="3"/>
  <path d="M515 161h42M515 316h42M536 161v155" stroke="#ddd6fe" stroke-width="3"/>
  <text x="449" y="385" fill="#f8fafc" font-family="Arial" font-size="24">Δx → dx</text>
  <text x="566" y="245" fill="#f8fafc" font-family="Arial" font-size="24">top − bottom</text>
  <text x="610" y="105" fill="#7dd3fc" font-family="Arial" font-size="24">upper curve</text>
  <text x="638" y="348" fill="#fde68a" font-family="Arial" font-size="24">lower curve</text>
  <text x="800" y="383" fill="#cbd5e1" font-family="Arial" font-size="22">x</text>
  <text x="96" y="70" fill="#cbd5e1" font-family="Arial" font-size="22">y</text>
  <text x="155" y="37" fill="#f8fafc" font-family="Arial" font-size="25" font-weight="bold">Model first: measurement × thickness</text>
</svg>
