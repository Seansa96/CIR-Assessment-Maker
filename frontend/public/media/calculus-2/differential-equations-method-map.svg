<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a first-order differential-equation method</title><desc id="desc">A flow diagram for classifying a differential equation as separable or first-order linear.</desc>
  <rect width="900" height="360" fill="#f8fafc"/><style>text{font-family:system-ui,sans-serif;fill:#102a43}.box{fill:#fff;stroke:#2b6cb0;stroke-width:3}.yes{fill:#e6fffa;stroke:#0f766e;stroke-width:3}.no{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.arrow{stroke:#475569;stroke-width:3;fill:none}</style>
  <text x="450" y="36" text-anchor="middle" font-size="24" font-weight="700">First-order differential equation: choose a method</text>
  <rect class="box" x="290" y="65" width="320" height="55" rx="12"/><text x="450" y="98" text-anchor="middle" font-size="20">Put the equation in a useful form</text>
  <path class="arrow" d="M450 120v38M450 158H215v25M450 158h235v25"/><polygon points="450,168 443,155 457,155" fill="#475569"/>
  <rect class="yes" x="55" y="185" width="320" height="78" rx="12"/><text x="215" y="216" text-anchor="middle" font-size="19">Can it factor as $g(x)f(y)$?</text><text x="215" y="244" text-anchor="middle" font-size="17">Yes: separate variables, then integrate.</text>
  <rect class="no" x="525" y="185" width="320" height="78" rx="12"/><text x="685" y="216" text-anchor="middle" font-size="19">Can it be written $y'+P(x)y=Q(x)$?</text><text x="685" y="244" text-anchor="middle" font-size="17">Yes: use an integrating factor.</text>
  <path class="arrow" d="M215 263v42M685 263v42"/><rect class="box" x="70" y="305" width="290" height="35" rx="8"/><rect class="box" x="540" y="305" width="290" height="35" rx="8"/><text x="215" y="329" text-anchor="middle" font-size="16">Check lost equilibria and the IVP.</text><text x="685" y="329" text-anchor="middle" font-size="16">Integrate, divide by $\mu$, then check.</text>
</svg>
