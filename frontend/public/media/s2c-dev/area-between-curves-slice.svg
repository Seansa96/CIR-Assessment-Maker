<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Area between two curves using a vertical slice</title>
  <desc id="desc">A shaded region between an upper curve and lower curve with a representative vertical rectangle of height upper minus lower.</desc>
  <rect width="760" height="360" fill="#f8fbfc"/>
  <path d="M70 292H705M120 325V35" stroke="#25343a" stroke-width="3"/>
  <path d="M145 260 C250 82 395 78 650 240" fill="none" stroke="#087e8b" stroke-width="6"/>
  <path d="M145 275 C280 205 470 176 650 88" fill="none" stroke="#ca4d6f" stroke-width="6"/>
  <path d="M145 260 C250 82 395 78 650 240 L650 88 C470 176 280 205 145 275 Z" fill="#ffd98d" opacity=".68"/>
  <rect x="421" y="144" width="26" height="63" fill="#6a5acd" opacity=".55" stroke="#342c6e" stroke-width="2"/>
  <text x="468" y="171" font-family="Arial, sans-serif" font-size="22" fill="#342c6e">height = upper − lower</text>
  <text x="454" y="230" font-family="Arial, sans-serif" font-size="21" fill="#342c6e">width = Δx</text>
  <text x="670" y="316" font-family="Arial, sans-serif" font-size="24" fill="#25343a">x</text>
  <text x="94" y="55" font-family="Arial, sans-serif" font-size="24" fill="#25343a">y</text>
  <text x="175" y="105" font-family="Arial, sans-serif" font-size="22" fill="#087e8b">upper curve</text>
  <text x="520" y="125" font-family="Arial, sans-serif" font-size="22" fill="#ca4d6f">lower curve</text>
</svg>
