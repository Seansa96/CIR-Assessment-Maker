<svg width="420" height="320" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" fill="#ffffff" />
        <text x="210" y="25" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Particles in a Glass</text>
        <g transform="translate(0, 40)">
        <rect x="50" y="50" width="100" height="150" rx="10" fill="none" stroke="#333" stroke-width="4"/>
        <line x1="40" y1="50" x2="160" y2="50" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Fill level based on 'amount' parameter (0-1) -->
        <rect x="52" y="156.2" width="96" height="43.8" rx="8" fill="#aaccff" opacity="0.7">
            <animate attributeName="height" from="0" to="43.8" dur="1.5s" fill="freeze" />
            <animate attributeName="y" from="200" to="156.2" dur="1.5s" fill="freeze" />
        </rect>
        
        <text x="100" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Glass of Water</text>
        <text x="100" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555">250 mL</text>
    </g><g transform="translate(220, 40)">
        <rect x="10" y="40" width="180" height="180" rx="8" fill="#e0ffdb" opacity="0.3" stroke="#333" stroke-width="2"/>
        <text x="100" y="25" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">Molecules</text>
        <text x="100" y="80" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333"><tspan x="100" dy="0">8.36 × 10²⁴</tspan><tspan x="100" dy="25">water molecules</tspan></text>
    </g>
    </svg>