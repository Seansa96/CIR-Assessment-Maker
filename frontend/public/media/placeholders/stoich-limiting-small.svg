<svg width="640" height="320" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" fill="#ffffff" />
        <text x="320" y="25" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Small Reactor (Limiting Reactant)</text>
        <g transform="translate(0, 40)">
        <rect x="50" y="50" width="100" height="150" rx="10" fill="none" stroke="#333" stroke-width="4"/>
        <line x1="40" y1="50" x2="160" y2="50" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Fill level based on 'amount' parameter (0-1) -->
        <rect x="52" y="127" width="96" height="73" rx="8" fill="#aadaff" opacity="0.7">
            <animate attributeName="height" from="0" to="73" dur="1.5s" fill="freeze" />
            <animate attributeName="y" from="200" to="127" dur="1.5s" fill="freeze" />
        </rect>
        
        <text x="100" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">H2 (Excess)</text>
        <text x="100" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555">25.0g (12.4mol)</text>
    </g><g transform="translate(220, 40)">
        <rect x="50" y="50" width="100" height="150" rx="10" fill="none" stroke="#333" stroke-width="4"/>
        <line x1="40" y1="50" x2="160" y2="50" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Fill level based on 'amount' parameter (0-1) -->
        <rect x="52" y="185.4" width="96" height="14.600000000000001" rx="8" fill="#ffd0d0" opacity="0.7">
            <animate attributeName="height" from="0" to="14.600000000000001" dur="1.5s" fill="freeze" />
            <animate attributeName="y" from="200" to="185.4" dur="1.5s" fill="freeze" />
        </rect>
        
        <text x="100" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">O2 (Limiting)</text>
        <text x="100" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555">75.0g (2.3mol)</text>
    </g><g transform="translate(440, 40)">
        <rect x="50" y="50" width="100" height="150" rx="10" fill="none" stroke="#333" stroke-width="4"/>
        <line x1="40" y1="50" x2="160" y2="50" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Fill level based on 'amount' parameter (0-1) -->
        <rect x="52" y="170.8" width="96" height="29.200000000000003" rx="8" fill="#c0e0c0" opacity="0.7">
            <animate attributeName="height" from="0" to="29.200000000000003" dur="1.5s" fill="freeze" />
            <animate attributeName="y" from="200" to="170.8" dur="1.5s" fill="freeze" />
        </rect>
        
        <text x="100" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">H2O Yield</text>
        <text x="100" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555">78.5g (93%)</text>
    </g>
    </svg>