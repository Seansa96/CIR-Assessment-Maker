<svg width="420" height="320" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" fill="#ffffff" />
        <text x="210" y="25" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Pilot Scale Ammonia Reaction</text>
        <g transform="translate(0, 40)">
        <rect x="50" y="50" width="100" height="150" rx="10" fill="none" stroke="#333" stroke-width="4"/>
        <line x1="40" y1="50" x2="160" y2="50" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Fill level based on 'amount' parameter (0-1) -->
        <rect x="52" y="127" width="96" height="73" rx="8" fill="#aadaff" opacity="0.7">
            <animate attributeName="height" from="0" to="73" dur="1.5s" fill="freeze" />
            <animate attributeName="y" from="200" to="127" dur="1.5s" fill="freeze" />
        </rect>
        
        <text x="100" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Reactant</text>
        <text x="100" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555">500.0 mol H2</text>
    </g><g transform="translate(220, 40)">
        <rect x="50" y="50" width="100" height="150" rx="10" fill="none" stroke="#333" stroke-width="4"/>
        <line x1="40" y1="50" x2="160" y2="50" stroke="#333" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Fill level based on 'amount' parameter (0-1) -->
        <rect x="52" y="163.5" width="96" height="36.5" rx="8" fill="#ffc0a0" opacity="0.7">
            <animate attributeName="height" from="0" to="36.5" dur="1.5s" fill="freeze" />
            <animate attributeName="y" from="200" to="163.5" dur="1.5s" fill="freeze" />
        </rect>
        
        <text x="100" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Product</text>
        <text x="100" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555">166.7 mol N2</text>
    </g>
    </svg>