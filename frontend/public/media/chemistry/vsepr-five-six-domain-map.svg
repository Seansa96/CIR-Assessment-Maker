<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Five- and six-domain position map</title><desc id="d">A trigonal bipyramid distinguishes axial and equatorial sites; an octahedron shows six equivalent starting sites and opposite lone-pair placement.</desc><style>.card{fill:#f7fbff;stroke:#326da8;stroke-width:3}.h{font:700 22px Arial;fill:#17263b}.b{font:17px Arial;fill:#17263b}.bond{stroke:#17263b;stroke-width:5}.back{stroke:#70859e;stroke-width:4;stroke-dasharray:6 6}.lp{fill:#b23969}</style><text x="600" y="34" text-anchor="middle" class="h">Position lone pairs before naming the atoms</text><g transform="translate(35 60)"><rect class="card" width="530" height="335" rx="16"/><text x="265" y="36" text-anchor="middle" class="h">5 domains: trigonal bipyramidal</text><circle cx="265" cy="165" r="27" fill="#d8edff"/><line x1="265" y1="138" x2="265" y2="70" class="bond"/><line x1="265" y1="192" x2="265" y2="270" class="bond"/><line x1="242" y1="178" x2="135" y2="240" class="bond"/><line x1="288" y1="178" x2="395" y2="240" class="bond"/><line x1="265" y1="145" x2="385" y2="125" class="back"/><text x="265" y="305" text-anchor="middle" class="b">axial: three 90-degree contacts; equatorial: two</text></g><g transform="translate(635 60)"><rect class="card" width="530" height="335" rx="16"/><text x="265" y="36" text-anchor="middle" class="h">6 domains: octahedral</text><circle cx="265" cy="165" r="27" fill="#d8edff"/><line x1="265" y1="138" x2="265" y2="65" class="bond"/><line x1="265" y1="192" x2="265" y2="275" class="bond"/><line x1="238" y1="165" x2="135" y2="165" class="bond"/><line x1="292" y1="165" x2="395" y2="165" class="bond"/><line x1="247" y1="145" x2="180" y2="92" class="back"/><line x1="283" y1="185" x2="350" y2="238" class="back"/><circle cx="265" cy="68" r="10" class="lp"/><circle cx="265" cy="272" r="10" class="lp"/><text x="265" y="305" text-anchor="middle" class="b">two lone pairs maximize separation at 180 degrees</text></g></svg>
