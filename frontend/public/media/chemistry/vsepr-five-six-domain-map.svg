<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Five- and six-domain VSEPR positions</title><desc id="desc">Diagram compares trigonal bipyramidal axial and equatorial positions with an octahedral arrangement and shows where lone pairs minimize repulsion.</desc>
<style>text{font-family:Arial,sans-serif;fill:#13233a}.h{font-size:25px;font-weight:bold}.b{font-size:18px}.s{font-size:16px}.atom{fill:#dcecff;stroke:#13233a;stroke-width:3}.bond{stroke:#3478b8;stroke-width:5}.lp{fill:#b43b66}.card{fill:#f7fbff;stroke:#3478b8;stroke-width:3}</style>
<text x="600" y="42" text-anchor="middle" class="h">Five and six domains: position matters before naming the atoms</text>
<g transform="translate(40,75)"><rect width="535" height="380" rx="18" class="card"/><text x="267" y="42" text-anchor="middle" class="h">5 domains: trigonal bipyramidal</text><circle cx="267" cy="210" r="32" class="atom"/><text x="267" y="217" text-anchor="middle" class="h">A</text><line x1="267" y1="178" x2="267" y2="100" class="bond"/><line x1="267" y1="242" x2="267" y2="320" class="bond"/><line x1="237" y1="222" x2="145" y2="270" class="bond"/><line x1="297" y1="222" x2="389" y2="270" class="bond"/><line x1="267" y1="242" x2="267" y2="335" class="bond"/><text x="267" y="92" text-anchor="middle" class="b">axial</text><text x="267" y="360" text-anchor="middle" class="b">axial</text><text x="120" y="290" class="b">equatorial</text><text x="360" y="290" class="b">equatorial</text><text x="267" y="400" text-anchor="middle" class="s">A lone pair favors an equatorial site: two 90° interactions, not three.</text></g>
<g transform="translate(625,75)"><rect width="535" height="380" rx="18" class="card"/><text x="267" y="42" text-anchor="middle" class="h">6 domains: octahedral</text><circle cx="267" cy="210" r="32" class="atom"/><text x="267" y="217" text-anchor="middle" class="h">A</text><line x1="267" y1="178" x2="267" y2="95" class="bond"/><line x1="267" y1="242" x2="267" y2="325" class="bond"/><line x1="235" y1="210" x2="140" y2="210" class="bond"/><line x1="299" y1="210" x2="394" y2="210" class="bond"/><line x1="245" y1="188" x2="180" y2="130" class="bond"/><line x1="289" y1="232" x2="354" y2="290" class="bond"/><text x="267" y="370" text-anchor="middle" class="b">All sites are equivalent; two lone pairs occupy opposite sites.</text><text x="267" y="400" text-anchor="middle" class="s">That leaves AX₄E₂ square planar, with 90° and 180° atom–A–atom angles.</text></g>
</svg>
