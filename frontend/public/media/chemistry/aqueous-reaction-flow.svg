<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">Aqueous reaction equation workflow</title><desc id="d">A flow from reactant ions through solubility decision to molecular, complete ionic, and net ionic equations.</desc><rect width="760" height="230" fill="#f7fbff"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.b{fill:#fff;stroke:#3977a8;stroke-width:2}.a{stroke:#3977a8;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3977a8"/></marker></defs><text x="24" y="30" font-size="20" font-weight="bold">Aqueous-reaction workflow</text><g><rect class="b" x="25" y="65" width="145" height="115" rx="9"/><text x="44" y="98" font-size="15">1. Predict products</text><text x="49" y="124" font-size="13">and phases</text><path class="a" d="M175 122h65"/><rect class="b" x="245" y="65" width="145" height="115" rx="9"/><text x="263" y="98" font-size="15">2. Solubility</text><text x="263" y="124" font-size="13">reaction or NR?</text><path class="a" d="M395 122h65"/><rect class="b" x="465" y="65" width="125" height="115" rx="9"/><text x="481" y="98" font-size="15">3. Split strong</text><text x="478" y="124" font-size="13">aqueous ions</text><path class="a" d="M595 122h65"/><rect class="b" x="665" y="65" width="75" height="115" rx="9"/><text x="675" y="98" font-size="15">4. Cancel</text><text x="679" y="124" font-size="13">spectators</text></g></svg>
