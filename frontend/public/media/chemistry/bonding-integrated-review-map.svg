<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280"><title>Integrated bonding decision chain</title><desc>Four-stage transfer map for integrated bonding decision chain.</desc><style>.t{font:700 21px Arial;fill:#172554}.h{font:700 14px Arial;fill:#172554}.c{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.a{stroke:#7c3aed;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker></defs><text x="28" y="36" class="t">Integrated bonding decision chain</text><rect x="25" y="84" width="190" height="118" rx="14" class="c"/><text x="43" y="138" class="h">1. classify particles</text><line x1="220" y1="143" x2="250" y2="143" class="a"/><rect x="260" y="84" width="190" height="118" rx="14" class="c"/><text x="278" y="138" class="h">2. name or write formula</text><line x1="455" y1="143" x2="485" y2="143" class="a"/><rect x="495" y="84" width="190" height="118" rx="14" class="c"/><text x="513" y="138" class="h">3. build structure and geometry</text><line x1="690" y1="143" x2="720" y2="143" class="a"/><rect x="730" y="84" width="190" height="118" rx="14" class="c"/><text x="748" y="138" class="h">4. predict polarity and properties</text></svg>