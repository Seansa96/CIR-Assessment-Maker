<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="t d"><title id="t">Equilibrium stress response model</title><desc id="d">For a reversible reaction, adding reactant produces a net forward shift until the reaction quotient again equals the equilibrium constant.</desc><rect width="700" height="300" fill="#f8fafc"/><g font-family="Arial" fill="#334155"><text x="55" y="55" font-size="20">A + B ⇌ C</text><text x="55" y="100" font-size="16">initially: Q = K</text><text x="250" y="55" font-size="20">add A</text><text x="250" y="100" font-size="16">denominator rises: Q &lt; K</text><text x="480" y="55" font-size="20">net forward change</text><text x="480" y="100" font-size="16">forms C until Q = K</text></g><g stroke="#0f766e" stroke-width="4" fill="none"><path d="M160 75H225"/><path d="M385 75H455"/></g><g fill="#0f766e"><path d="M225 75l-12-8v16z"/><path d="M455 75l-12-8v16z"/></g><g fill="#b45309"><circle cx="90" cy="190" r="20"/><circle cx="150" cy="190" r="20"/><circle cx="290" cy="190" r="20"/><circle cx="350" cy="190" r="20"/><circle cx="410" cy="190" r="20"/></g><g fill="#0f766e"><rect x="520" y="170" width="42" height="42" rx="7"/><rect x="580" y="170" width="42" height="42" rx="7"/></g></svg>
