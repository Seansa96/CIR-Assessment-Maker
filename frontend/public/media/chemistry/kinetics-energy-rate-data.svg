<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Reaction-coordinate energy profile and initial-rate comparison</title>
  <desc id="desc">A catalyzed reaction has a lower activation-energy peak than the uncatalyzed path; a small table compares rate changes when reactant concentration is doubled.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <g stroke="#334155" stroke-width="2" fill="none"><path d="M55 285H390M55 285V45"/><path d="M65 255 C145 255 145 92 225 92 S305 255 380 255" stroke="#b45309"/><path d="M65 255 C140 255 145 160 220 160 S300 255 380 255" stroke="#0f766e" stroke-dasharray="8 6"/></g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="16"><text x="180" y="325">reaction progress</text><text x="15" y="55">energy</text><text x="230" y="82">uncatalyzed $E_a$</text><text x="230" y="150">catalyzed path</text><text x="470" y="65" font-weight="bold">Initial-rate evidence</text><text x="470" y="105">[A] doubles, [B] fixed</text><text x="470" y="135">rate: 0.030 → 0.120</text><text x="470" y="180">rate factor = 4 = 2²</text><text x="470" y="210">order in A = 2</text></g>
</svg>
