<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Preparing a solution to a known molarity</title><desc id="desc">Solute is weighed, transferred to a volumetric flask, dissolved, then diluted to the calibration mark.</desc>
  <rect width="720" height="260" fill="#f7fbff"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.box{fill:#fff;stroke:#3977a8;stroke-width:2}.arrow{stroke:#3977a8;stroke-width:3;fill:none;marker-end:url(#a)}.water{fill:#9bd8f4}.solute{fill:#e7b45a}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#3977a8"/></marker></defs>
  <text x="24" y="30" font-size="20" font-weight="bold">Known-molarity preparation: final volume is the flask volume</text>
  <rect class="box" x="25" y="58" width="135" height="145" rx="9"/><text x="43" y="86" font-size="16">1. Weigh solute</text><rect x="55" y="145" width="75" height="12" fill="#777"/><path d="M75 145 L90 120 L105 145" class="solute"/><text x="43" y="185" font-size="13">known mass → moles</text>
  <path class="arrow" d="M170 130 H245"/><rect class="box" x="255" y="58" width="135" height="145" rx="9"/><text x="269" y="86" font-size="16">2. Dissolve</text><path d="M300 110 v65 q22 18 44 0 v-65z" fill="#dff4ff" stroke="#3977a8" stroke-width="2"/><circle cx="315" cy="150" r="4" class="solute"/><circle cx="338" cy="136" r="4" class="solute"/><text x="272" y="185" font-size="13">add some water</text>
  <path class="arrow" d="M400 130 H475"/><rect class="box" x="485" y="58" width="205" height="145" rx="9"/><text x="500" y="86" font-size="16">3. Dilute to the mark</text><path d="M560 105 v68 q27 23 54 0 v-68z" fill="#fff" stroke="#3977a8" stroke-width="2"/><path d="M560 137 h54 v36 q-27 23-54 0z" class="water"/><path d="M550 137 h74" stroke="#d25353" stroke-width="3"/><text x="500" y="185" font-size="13">total solution volume = V</text>
</svg>
