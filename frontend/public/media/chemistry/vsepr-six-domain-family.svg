<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Six-domain molecular geometry family</title><desc id="d">Cards show octahedral AX6, square-pyramidal AX5E, and square-planar AX4E2 with opposite lone pairs.</desc><style>.c{fill:#f7fbff;stroke:#326da8;stroke-width:3}.h{font:700 21px Arial;fill:#17263b}.b{font:17px Arial;fill:#17263b}.l{stroke:#17263b;stroke-width:5}.back{stroke:#70859e;stroke-width:4;stroke-dasharray:5 6}.lp{fill:#b23969}.a{fill:#d8edff}</style><text x="600" y="32" text-anchor="middle" class="h">Six domains: remove lone-pair positions from an octahedron</text><g transform="translate(35 58)"><rect class="c" width="350" height="325" rx="14"/><text x="175" y="36" text-anchor="middle" class="h">AX6 octahedral</text><g transform="translate(175 170)"><circle r="23" class="a"/><line y1="-23" y2="-90" class="l"/><line y1="23" y2="90" class="l"/><line x1="-23" x2="-95" class="l"/><line x1="23" x2="95" class="l"/><line x1="-16" y1="-16" x2="-70" y2="-65" class="back"/><line x1="16" y1="16" x2="70" y2="65" class="back"/></g><text x="175" y="295" text-anchor="middle" class="b">six atom positions</text></g><g transform="translate(425 58)"><rect class="c" width="350" height="325" rx="14"/><text x="175" y="36" text-anchor="middle" class="h">AX5E square pyramidal</text><g transform="translate(175 170)"><circle r="23" class="a"/><line y1="-23" y2="-90" class="l"/><circle cy="80" r="11" class="lp"/><line x1="-23" x2="-95" class="l"/><line x1="23" x2="95" class="l"/><line x1="-16" y1="-16" x2="-70" y2="-65" class="back"/><line x1="16" y1="16" x2="70" y2="65" class="back"/></g><text x="175" y="295" text-anchor="middle" class="b">one omitted site</text></g><g transform="translate(815 58)"><rect class="c" width="350" height="325" rx="14"/><text x="175" y="36" text-anchor="middle" class="h">AX4E2 square planar</text><g transform="translate(175 170)"><circle r="23" class="a"/><circle cy="-80" r="11" class="lp"/><circle cy="80" r="11" class="lp"/><line x1="-23" x2="-95" class="l"/><line x1="23" x2="95" class="l"/><line x1="-16" y1="-16" x2="-70" y2="-65" class="back"/><line x1="16" y1="16" x2="70" y2="65" class="back"/></g><text x="175" y="295" text-anchor="middle" class="b">opposite lone pairs</text></g></svg>
