<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Electron-domain geometry atlas</title><desc id="d">Five cards show linear, trigonal-planar, tetrahedral, trigonal-bipyramidal, and octahedral arrangements with ideal angles.</desc><style>.c{fill:#f7fbff;stroke:#326da8;stroke-width:3}.h{font:700 20px Arial;fill:#17263b}.b{font:16px Arial;fill:#17263b}.l{stroke:#17263b;stroke-width:4}.x{fill:#d8edff;stroke:#17263b;stroke-width:2}</style><text x="600" y="32" text-anchor="middle" class="h">Total domain count fixes the electron-domain geometry</text><g transform="translate(15 60)"><rect class="c" width="220" height="380" rx="14"/><text x="110" y="35" text-anchor="middle" class="h">2 linear</text><circle cx="110" cy="180" r="22" class="x"/><line x1="88" y1="180" x2="35" y2="180" class="l"/><line x1="132" y1="180" x2="185" y2="180" class="l"/><text x="110" y="320" text-anchor="middle" class="b">180 degrees</text></g><g transform="translate(250 60)"><rect class="c" width="220" height="380" rx="14"/><text x="110" y="35" text-anchor="middle" class="h">3 trigonal planar</text><circle cx="110" cy="180" r="22" class="x"/><line x1="110" y1="158" x2="110" y2="92" class="l"/><line x1="92" y1="193" x2="38" y2="230" class="l"/><line x1="128" y1="193" x2="182" y2="230" class="l"/><text x="110" y="320" text-anchor="middle" class="b">120 degrees</text></g><g transform="translate(485 60)"><rect class="c" width="220" height="380" rx="14"/><text x="110" y="35" text-anchor="middle" class="h">4 tetrahedral</text><circle cx="110" cy="180" r="22" class="x"/><line x1="95" y1="165" x2="50" y2="115" class="l"/><line x1="125" y1="165" x2="170" y2="115" class="l"/><path d="M97 192L35 250L88 205Z" fill="#326da8"/><line x1="123" y1="194" x2="185" y2="250" stroke="#17263b" stroke-width="4" stroke-dasharray="5 6"/><text x="110" y="320" text-anchor="middle" class="b">109.5 degrees</text></g><g transform="translate(720 60)"><rect class="c" width="220" height="380" rx="14"/><text x="110" y="35" text-anchor="middle" class="h">5 trigonal bipyramidal</text><circle cx="110" cy="180" r="22" class="x"/><line x1="110" y1="158" x2="110" y2="82" class="l"/><line x1="110" y1="202" x2="110" y2="278" class="l"/><line x1="92" y1="193" x2="35" y2="230" class="l"/><line x1="128" y1="193" x2="185" y2="230" class="l"/><line x1="110" y1="160" x2="180" y2="140" stroke="#70859e" stroke-width="4" stroke-dasharray="5 6"/><text x="110" y="320" text-anchor="middle" class="b">90, 120, 180 degrees</text></g><g transform="translate(955 60)"><rect class="c" width="230" height="380" rx="14"/><text x="115" y="35" text-anchor="middle" class="h">6 octahedral</text><circle cx="115" cy="180" r="22" class="x"/><line x1="115" y1="158" x2="115" y2="80" class="l"/><line x1="115" y1="202" x2="115" y2="280" class="l"/><line x1="93" y1="180" x2="30" y2="180" class="l"/><line x1="137" y1="180" x2="200" y2="180" class="l"/><line x1="100" y1="164" x2="55" y2="115" stroke="#70859e" stroke-width="4" stroke-dasharray="5 6"/><line x1="130" y1="196" x2="175" y2="245" stroke="#70859e" stroke-width="4" stroke-dasharray="5 6"/><text x="115" y="320" text-anchor="middle" class="b">90 and 180 degrees</text></g></svg>
