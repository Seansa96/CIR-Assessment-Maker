<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Labeled electrolytic cell</title><desc id="d">An external power supply drives a nonspontaneous reaction; oxidation remains at the positive anode and reduction remains at the negative cathode.</desc><rect width="760" height="340" fill="#f8fafc"/><rect x="305" y="30" width="150" height="65" rx="8" fill="#fde68a" stroke="#334155"/><text x="330" y="69" font-family="Arial" font-size="18">DC power</text><path d="M320 95L190 145M440 95L570 145" stroke="#334155" stroke-width="4"/><rect x="90" y="130" width="580" height="170" rx="8" fill="#dbeafe" stroke="#334155"/><path d="M190 110V255M570 110V255" stroke="#475569" stroke-width="18"/><g font-family="Arial" fill="#334155" font-size="16"><text x="105" y="325">anode (+): oxidation</text><text x="500" y="325">cathode (−): reduction</text><text x="250" y="185">external energy drives reaction</text></g></svg>
