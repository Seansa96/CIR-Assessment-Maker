<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="t d"><title id="t">Solution stoichiometry mole map</title><desc id="d">A chain from volume and molarity to moles, mole ratio, and requested mass or concentration.</desc><rect width="760" height="190" fill="#f7fbff"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.b{fill:#fff;stroke:#3977a8;stroke-width:2}.a{stroke:#3977a8;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3977a8"/></marker></defs><text x="25" y="30" font-size="20" font-weight="bold">Solution stoichiometry: use moles as the bridge</text><rect class="b" x="25" y="65" width="150" height="75" rx="9"/><text x="42" y="96" font-size="14">Molarity × volume</text><text x="61" y="119" font-size="14">moles A</text><path class="a" d="M180 102h70"/><rect class="b" x="255" y="65" width="150" height="75" rx="9"/><text x="278" y="96" font-size="14">balanced equation</text><text x="290" y="119" font-size="14">moles B</text><path class="a" d="M410 102h70"/><rect class="b" x="485" y="65" width="240" height="75" rx="9"/><text x="512" y="96" font-size="14">molar mass or M = n/V</text><text x="525" y="119" font-size="14">requested mass, volume, or M</text></svg>
