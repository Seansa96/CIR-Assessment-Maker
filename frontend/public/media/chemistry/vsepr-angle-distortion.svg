<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">VSEPR bond-angle refinement</title><desc id="d">Three panels show ideal tetrahedral methane and angle compression in ammonia and water, plus a trigonal-planar multiple-bond distortion example.</desc><style>.c{fill:#f7fbff;stroke:#326da8;stroke-width:3}.h{font:700 21px Arial;fill:#17263b}.b{font:17px Arial;fill:#17263b}.l{stroke:#17263b;stroke-width:5}.lp{fill:#b23969}.arc{fill:none;stroke:#e07a2f;stroke-width:4}</style><text x="600" y="32" text-anchor="middle" class="h">Start from the ideal; then compare domain repulsions</text><g transform="translate(20 58)"><rect class="c" width="270" height="325" rx="14"/><text x="135" y="35" text-anchor="middle" class="h">CH4: 109.5 degrees</text><circle cx="135" cy="165" r="23" fill="#d8edff"/><line x1="118" y1="150" x2="65" y2="100" class="l"/><line x1="152" y1="150" x2="205" y2="100" class="l"/><path d="M95 125Q135 95 175 125" class="arc"/><text x="135" y="285" text-anchor="middle" class="b">equivalent bond domains</text></g><g transform="translate(315 58)"><rect class="c" width="270" height="325" rx="14"/><text x="135" y="35" text-anchor="middle" class="h">NH3: about 107 degrees</text><circle cx="135" cy="165" r="23" fill="#d8edff"/><circle cx="123" cy="90" r="6" class="lp"/><circle cx="147" cy="90" r="6" class="lp"/><line x1="118" y1="180" x2="65" y2="230" class="l"/><line x1="152" y1="180" x2="205" y2="230" class="l"/><path d="M92 215Q135 185 178 215" class="arc"/><text x="135" y="285" text-anchor="middle" class="b">one lone pair compresses</text></g><g transform="translate(610 58)"><rect class="c" width="270" height="325" rx="14"/><text x="135" y="35" text-anchor="middle" class="h">H2O: about 104.5 degrees</text><circle cx="135" cy="165" r="23" fill="#d8edff"/><circle cx="95" cy="95" r="6" class="lp"/><circle cx="113" cy="95" r="6" class="lp"/><circle cx="157" cy="95" r="6" class="lp"/><circle cx="175" cy="95" r="6" class="lp"/><line x1="118" y1="180" x2="65" y2="230" class="l"/><line x1="152" y1="180" x2="205" y2="230" class="l"/><path d="M95 215Q135 190 175 215" class="arc"/><text x="135" y="285" text-anchor="middle" class="b">two lone pairs compress more</text></g><g transform="translate(905 58)"><rect class="c" width="275" height="325" rx="14"/><text x="138" y="35" text-anchor="middle" class="h">Unequal trigonal domains</text><circle cx="138" cy="165" r="23" fill="#d8edff"/><line x1="138" y1="142" x2="138" y2="75" stroke="#b23969" stroke-width="9"/><line x1="120" y1="178" x2="65" y2="218" class="l"/><line x1="156" y1="178" x2="211" y2="218" class="l"/><path d="M90 205Q138 170 186 205" class="arc"/><text x="138" y="275" text-anchor="middle" class="b">denser multiple-bond domain</text><text x="138" y="300" text-anchor="middle" class="b">compresses opposite angle</text></g></svg>
