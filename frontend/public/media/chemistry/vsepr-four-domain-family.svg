<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Four-domain VSEPR family</title><desc id="desc">Comparative diagram showing tetrahedral electron-domain geometry and the molecular geometries of methane, ammonia, and water as lone pairs replace bonded atoms.</desc>
<style>text{font-family:Arial,sans-serif;fill:#13233a}.h{font-size:25px;font-weight:bold}.b{font-size:18px}.atom{fill:#dcecff;stroke:#13233a;stroke-width:3}.bond{stroke:#3478b8;stroke-width:5}.lp{fill:#b43b66}.card{fill:#f7fbff;stroke:#3478b8;stroke-width:3}</style>
<text x="600" y="42" text-anchor="middle" class="h">Four electron domains: lone pairs change the molecular name, not the starting arrangement</text>
<g transform="translate(25,80)"><rect width="350" height="360" rx="18" class="card"/><text x="175" y="42" text-anchor="middle" class="h">AX₄: methane</text><text x="175" y="72" text-anchor="middle" class="b">tetrahedral molecular geometry</text><circle cx="175" cy="195" r="32" class="atom"/><text x="175" y="202" text-anchor="middle" class="h">C</text><line x1="150" y1="175" x2="95" y2="125" class="bond"/><line x1="200" y1="175" x2="255" y2="125" class="bond"/><line x1="145" y1="215" x2="95" y2="270" class="bond"/><line x1="205" y1="215" x2="255" y2="270" class="bond"/><text x="175" y="325" text-anchor="middle" class="b">ideal H–C–H = 109.5°</text></g>
<g transform="translate(425,80)"><rect width="350" height="360" rx="18" class="card"/><text x="175" y="42" text-anchor="middle" class="h">AX₃E: ammonia</text><text x="175" y="72" text-anchor="middle" class="b">trigonal pyramidal molecular geometry</text><circle cx="175" cy="195" r="32" class="atom"/><text x="175" y="202" text-anchor="middle" class="h">N</text><circle cx="175" cy="115" r="7" class="lp"/><circle cx="193" cy="115" r="7" class="lp"/><line x1="150" y1="215" x2="95" y2="270" class="bond"/><line x1="205" y1="215" x2="255" y2="270" class="bond"/><line x1="175" y1="227" x2="175" y2="300" class="bond"/><text x="175" y="325" text-anchor="middle" class="b">about 107°; lone pair compresses</text></g>
<g transform="translate(825,80)"><rect width="350" height="360" rx="18" class="card"/><text x="175" y="42" text-anchor="middle" class="h">AX₂E₂: water</text><text x="175" y="72" text-anchor="middle" class="b">bent molecular geometry</text><circle cx="175" cy="195" r="32" class="atom"/><text x="175" y="202" text-anchor="middle" class="h">O</text><circle cx="140" cy="115" r="7" class="lp"/><circle cx="158" cy="115" r="7" class="lp"/><circle cx="192" cy="115" r="7" class="lp"/><circle cx="210" cy="115" r="7" class="lp"/><line x1="150" y1="215" x2="100" y2="275" class="bond"/><line x1="200" y1="215" x2="250" y2="275" class="bond"/><text x="175" y="325" text-anchor="middle" class="b">about 104.5°; two lone pairs compress</text></g>
</svg>
