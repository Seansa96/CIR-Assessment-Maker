<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Four-domain VSEPR family</title><desc id="d">Perspective models compare tetrahedral methane, trigonal-pyramidal ammonia, and bent water as atom positions are replaced by lone pairs.</desc><style>.card{fill:#f7fbff;stroke:#326da8;stroke-width:3}.h{font:700 22px Arial;fill:#17263b}.b{font:17px Arial;fill:#17263b}.bond{stroke:#17263b;stroke-width:5}.dash{stroke:#17263b;stroke-width:4;stroke-dasharray:5 7}.lp{fill:#b23969}.wedge{fill:#326da8}</style><text x="600" y="34" text-anchor="middle" class="h">Four domains share a tetrahedral starting arrangement</text><g transform="translate(20 60)"><rect class="card" width="360" height="335" rx="16"/><text x="180" y="36" text-anchor="middle" class="h">AX4 methane: tetrahedral</text><circle cx="180" cy="165" r="27" fill="#d8edff"/><line x1="160" y1="148" x2="100" y2="95" class="bond"/><line x1="200" y1="148" x2="260" y2="95" class="bond"/><path d="M166 180L80 245L145 195Z" class="wedge"/><line x1="194" y1="182" x2="280" y2="245" class="dash"/><text x="180" y="295" text-anchor="middle" class="b">ideal angle 109.5 degrees</text></g><g transform="translate(420 60)"><rect class="card" width="360" height="335" rx="16"/><text x="180" y="36" text-anchor="middle" class="h">AX3E ammonia: trigonal pyramidal</text><circle cx="180" cy="165" r="27" fill="#d8edff"/><circle cx="168" cy="92" r="6" class="lp"/><circle cx="192" cy="92" r="6" class="lp"/><line x1="180" y1="192" x2="180" y2="260" class="bond"/><path d="M162 178L80 230L150 190Z" class="wedge"/><line x1="198" y1="180" x2="280" y2="230" class="dash"/><text x="180" y="295" text-anchor="middle" class="b">one lone pair; angle near 107 degrees</text></g><g transform="translate(820 60)"><rect class="card" width="360" height="335" rx="16"/><text x="180" y="36" text-anchor="middle" class="h">AX2E2 water: bent</text><circle cx="180" cy="165" r="27" fill="#d8edff"/><circle cx="140" cy="95" r="6" class="lp"/><circle cx="158" cy="95" r="6" class="lp"/><circle cx="202" cy="95" r="6" class="lp"/><circle cx="220" cy="95" r="6" class="lp"/><path d="M162 180L85 235L150 192Z" class="wedge"/><line x1="198" y1="182" x2="275" y2="235" class="dash"/><text x="180" y="295" text-anchor="middle" class="b">two lone pairs; angle near 104.5 degrees</text></g></svg>
