+<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc"><title id="title">Titration curve and endpoint</title><desc id="desc">A measured titrant volume reaches equivalence and an indicator changes color near the steep region.</desc><rect width="640" height="260" rx="14" fill="#f6f9fc"/><text x="24" y="42" font-family="Arial" font-size="24" fill="#173047">Titration curve and endpoint</text><line x1="80" y1="150" x2="560" y2="150" stroke="#36536a" stroke-width="3"/><circle cx="190" cy="150" r="30" fill="#2d83a5"/><circle cx="450" cy="150" r="30" fill="#da7830"/><text x="175" y="158" fill="white" font-size="22">acid</text><text x="430" y="158" fill="white" font-size="22">base</text><path d="M225 95H415" stroke="#147d92" stroke-width="5"/><polygon points="415,95 397,86 397,104" fill="#147d92"/><text x="270" y="82" font-family="Arial" font-size="18" fill="#173047">proton / measured change</text></svg>
