<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Carbon dioxide Lewis-structure electron-accounting workflow</title>
  <desc id="desc">Five connected panels count sixteen valence electrons for carbon dioxide, draw an oxygen-carbon-oxygen skeleton, complete oxygen octets, diagnose carbon's incomplete octet, form two double bonds, and verify zero formal charges without changing the electron total.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 25px Arial,sans-serif;fill:#172554}.step{font:700 17px Arial,sans-serif;fill:#312e81}.body{font:15px Arial,sans-serif;fill:#334155}.atom{font:700 25px Arial,sans-serif;fill:#172554}.small{font:14px Arial,sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#6366f1;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2}.bond{stroke:#172554;stroke-width:3}.flow{stroke:#0f766e;stroke-width:3;marker-end:url(#arrow)}.dot{fill:#7c3aed}
    </style>
  </defs>
  <rect width="1120" height="520" rx="22" fill="#f1f5f9"/>
  <text x="40" y="42" class="title">Lewis structures: keep one electron budget from start to finish</text>

  <rect x="35" y="78" width="200" height="155" rx="15" class="box"/>
  <text x="52" y="108" class="step">1. Count</text>
  <text x="52" y="143" class="body">CO₂: 4 + 2(6)</text>
  <text x="52" y="177" class="atom">= 16 e⁻</text>
  <text x="52" y="207" class="small">Neutral: no charge adjustment</text>

  <line x1="240" y1="155" x2="270" y2="155" class="flow"/>
  <rect x="280" y="78" width="200" height="155" rx="15" class="box"/>
  <text x="297" y="108" class="step">2. Connect</text>
  <text x="317" y="164" class="atom">O</text><line x1="345" y1="155" x2="380" y2="155" class="bond"/><text x="388" y="164" class="atom">C</text><line x1="418" y1="155" x2="453" y2="155" class="bond"/><text x="459" y="164" class="atom">O</text>
  <text x="297" y="207" class="small">2 single bonds use 4 e⁻</text>

  <line x1="485" y1="155" x2="515" y2="155" class="flow"/>
  <rect x="525" y="78" width="250" height="155" rx="15" class="warn"/>
  <text x="542" y="108" class="step">3. Fill terminal octets</text>
  <g transform="translate(560 138)">
    <text x="0" y="25" class="atom">O</text><line x1="29" y1="16" x2="73" y2="16" class="bond"/><text x="81" y="25" class="atom">C</text><line x1="111" y1="16" x2="155" y2="16" class="bond"/><text x="162" y="25" class="atom">O</text>
    <circle cx="9" cy="-4" r="3" class="dot"/><circle cx="18" cy="-4" r="3" class="dot"/><circle cx="-7" cy="9" r="3" class="dot"/><circle cx="-7" cy="19" r="3" class="dot"/><circle cx="9" cy="38" r="3" class="dot"/><circle cx="18" cy="38" r="3" class="dot"/>
    <circle cx="171" cy="-4" r="3" class="dot"/><circle cx="180" cy="-4" r="3" class="dot"/><circle cx="196" cy="9" r="3" class="dot"/><circle cx="196" cy="19" r="3" class="dot"/><circle cx="171" cy="38" r="3" class="dot"/><circle cx="180" cy="38" r="3" class="dot"/>
  </g>
  <text x="542" y="218" class="small">All 16 e⁻ placed; carbon has only 4</text>

  <line x1="780" y1="155" x2="810" y2="155" class="flow"/>
  <rect x="820" y="78" width="265" height="155" rx="15" class="ok"/>
  <text x="837" y="108" class="step">4. Redistribute, then verify</text>
  <g transform="translate(862 137)">
    <text x="0" y="27" class="atom">O</text><line x1="30" y1="12" x2="78" y2="12" class="bond"/><line x1="30" y1="22" x2="78" y2="22" class="bond"/><text x="87" y="27" class="atom">C</text><line x1="117" y1="12" x2="165" y2="12" class="bond"/><line x1="117" y1="22" x2="165" y2="22" class="bond"/><text x="173" y="27" class="atom">O</text>
  </g>
  <text x="837" y="198" class="small">O=C=O • 16 e⁻ • all FC = 0</text>
  <text x="837" y="220" class="small">No electrons created or discarded</text>

  <rect x="86" y="285" width="948" height="175" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="112" y="320" class="step">Independent final audit</text>
  <text x="112" y="354" class="body">Electron count:</text><text x="250" y="354" class="body">4 bonding pairs + 4 lone pairs = 16 e⁻</text>
  <text x="112" y="388" class="body">Octets:</text><text x="250" y="388" class="body">two double bonds give C and both O atoms eight surrounding electrons</text>
  <text x="112" y="422" class="body">Formal charge:</text><text x="250" y="422" class="body">C: 4 − 0 − 8/2 = 0; each O: 6 − 4 − 4/2 = 0</text>
  <text x="112" y="447" class="small">If any audit fails, return to the electron placement—not to a new electron total.</text>
</svg>
