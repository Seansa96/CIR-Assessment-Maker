<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Local VSEPR geometry in a multicenter molecule</title><desc id="d">Acetic acid is divided into a tetrahedral methyl carbon, trigonal-planar carbonyl carbon, and bent hydroxyl oxygen.</desc><style>.h{font:700 22px Arial;fill:#17263b}.b{font:17px Arial;fill:#17263b}.bond{stroke:#17263b;stroke-width:5}.call{fill:#f7fbff;stroke:#326da8;stroke-width:3}.lead{stroke:#326da8;stroke-width:3;stroke-dasharray:6 5}.atom{font:700 28px Arial;fill:#17263b}</style><text x="600" y="35" text-anchor="middle" class="h">One molecule, three local VSEPR analyses</text><g transform="translate(300 170)"><text x="0" y="8" class="atom">H3C</text><line x1="60" y1="0" x2="125" y2="0" class="bond"/><text x="140" y="8" class="atom">C</text><line x1="165" y1="-8" x2="235" y2="-65" class="bond"/><line x1="170" y1="0" x2="240" y2="-57" class="bond"/><text x="250" y="-55" class="atom">O</text><line x1="165" y1="8" x2="235" y2="65" class="bond"/><text x="250" y="78" class="atom">O-H</text></g><rect x="60" y="245" width="300" height="105" rx="14" class="call"/><text x="210" y="280" text-anchor="middle" class="h">methyl carbon</text><text x="210" y="315" text-anchor="middle" class="b">4 bond domains - tetrahedral</text><line x1="300" y1="245" x2="345" y2="190" class="lead"/><rect x="450" y="245" width="300" height="105" rx="14" class="call"/><text x="600" y="280" text-anchor="middle" class="h">carbonyl carbon</text><text x="600" y="315" text-anchor="middle" class="b">3 directions - trigonal planar</text><line x1="570" y1="245" x2="460" y2="190" class="lead"/><rect x="840" y="245" width="300" height="105" rx="14" class="call"/><text x="990" y="280" text-anchor="middle" class="h">hydroxyl oxygen</text><text x="990" y="315" text-anchor="middle" class="b">2 bonds + 2 lone pairs - bent</text><line x1="875" y1="245" x2="565" y2="220" class="lead"/></svg>
