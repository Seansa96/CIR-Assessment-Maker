<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260"><title>Sigma and pi bond map</title><desc>Four-stage visual reasoning aid for sigma and pi bond map.</desc><style>.t{font:700 20px Arial;fill:#172554}.h{font:700 14px Arial;fill:#172554}.b{font:13px Arial;fill:#334155}.c{fill:#f8fafc;stroke:#7c3aed;stroke-width:2}.a{stroke:#0f766e;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker></defs><text x="28" y="34" class="t">Sigma and pi bond map</text><rect x="25" y="76" width="190" height="110" rx="14" class="c"/><text x="43" y="126" class="h">1. single: one sigma</text><line x1="220" y1="130" x2="250" y2="130" class="a"/><rect x="260" y="76" width="190" height="110" rx="14" class="c"/><text x="278" y="126" class="h">2. double: sigma plus pi</text><line x1="455" y1="130" x2="485" y2="130" class="a"/><rect x="495" y="76" width="190" height="110" rx="14" class="c"/><text x="513" y="126" class="h">3. triple: sigma plus two pi</text><line x1="690" y1="130" x2="720" y2="130" class="a"/><rect x="730" y="76" width="190" height="110" rx="14" class="c"/><text x="748" y="126" class="h">4. connect order to properties</text><text x="28" y="228" class="b">Verify the representation with an independent electron, charge, geometry, or vector check.</text></svg>