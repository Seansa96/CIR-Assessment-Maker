<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc"><title id="title">Proton transfer does not require hydroxide</title><desc id="desc">A schematic representation of proton transfer does not require hydroxide.</desc><rect width="720" height="250" rx="18" fill="#f4f9fb"/><text x="360" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18394a">Proton transfer does not require hydroxide</text><rect x="42" y="76" width="240" height="82" rx="14" fill="#d9eff5" stroke="#237b91" stroke-width="3"/><rect x="438" y="76" width="240" height="82" rx="14" fill="#fce7d6" stroke="#ba652d" stroke-width="3"/><text x="162" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#18394a">HCl gives H⁺</text><text x="558" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#18394a">NH₃ accepts H⁺</text><path d="M300 117h112" stroke="#344f5d" stroke-width="4"/><path d="m400 107 14 10-14 10" fill="none" stroke="#344f5d" stroke-width="4"/><text x="360" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#405967">HCl + NH₃ → NH₄⁺ + Cl⁻</text></svg>