<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Relative penetration of alpha, beta, and gamma radiation</title><desc id="d">Alpha is stopped by paper, beta passes paper but is stopped by thin metal, and gamma penetrates farther and is reduced by dense shielding.</desc><rect width="760" height="330" fill="#f8fafc"/><g font-family="Arial" font-size="16" fill="#334155"><text x="40" y="55">source</text><text x="210" y="55">paper</text><text x="390" y="55">thin metal</text><text x="570" y="55">dense shield</text></g><rect x="220" y="75" width="10" height="210" fill="#d6d3d1"/><rect x="405" y="75" width="22" height="210" fill="#94a3b8"/><rect x="595" y="75" width="70" height="210" fill="#475569"/><g stroke-width="8" fill="none"><path d="M70 120H220" stroke="#dc2626"/><path d="M70 180H405" stroke="#2563eb"/><path d="M70 240H625" stroke="#7c3aed"/></g><g font-family="Arial" font-size="18"><text x="80" y="110" fill="#dc2626">alpha</text><text x="80" y="170" fill="#2563eb">beta</text><text x="80" y="230" fill="#7c3aed">gamma</text></g><text x="35" y="315" font-family="Arial" font-size="15" fill="#334155">Penetration is not the only hazard factor: source location and energy deposition also matter.</text></svg>
