<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">Lewis structures with valid incomplete octets</title>
  <desc id="desc">Three panels show hydrogen with a two-electron duet, linear beryllium chloride with four electrons around beryllium, and trigonal boron trifluoride with six electrons around boron. Each panel states and verifies its total valence-electron budget.</desc>
  <style>.title{font:700 25px Arial,sans-serif;fill:#172554}.head{font:700 20px Arial,sans-serif;fill:#312e81}.atom{font:700 27px Arial,sans-serif;fill:#172554}.body{font:15px Arial,sans-serif;fill:#334155}.count{font:700 16px Arial,sans-serif;fill:#047857}.pairs{font:700 15px Arial,sans-serif;fill:#7c3aed}.box{fill:#fff;stroke:#6366f1;stroke-width:2}.bond{stroke:#172554;stroke-width:4}.dot{fill:#7c3aed}</style>
  <rect width="1080" height="470" rx="22" fill="#f1f5f9"/>
  <text x="38" y="44" class="title">Incomplete octets are exceptions—not broken electron budgets</text>

  <rect x="35" y="80" width="290" height="330" rx="18" class="box"/>
  <text x="58" y="116" class="head">H₂: duet rule</text>
  <text x="102" y="205" class="atom">H</text><line x1="135" y1="195" x2="193" y2="195" class="bond"/><text x="207" y="205" class="atom">H</text>
  <circle cx="160" cy="188" r="4" class="dot"/><circle cx="170" cy="188" r="4" class="dot"/>
  <text x="58" y="270" class="body">Budget: 1 + 1 = 2 e⁻</text>
  <text x="58" y="302" class="count">2 e⁻ around each H — confirmed</text>
  <text x="58" y="342" class="body">Hydrogen fills the first shell</text>
  <text x="58" y="365" class="body">with one shared pair.</text>

  <rect x="395" y="80" width="290" height="330" rx="18" class="box"/>
  <text x="418" y="116" class="head">BeCl₂: four around Be</text>
  <text x="425" y="205" class="atom">Cl</text><line x1="462" y1="195" x2="520" y2="195" class="bond"/><text x="529" y="205" class="atom">Be</text><line x1="570" y1="195" x2="628" y2="195" class="bond"/><text x="637" y="205" class="atom">Cl</text>
  <text x="426" y="173" class="pairs">••</text><text x="400" y="200" class="pairs">••</text><text x="426" y="230" class="pairs">••</text>
  <text x="640" y="173" class="pairs">••</text><text x="670" y="200" class="pairs">••</text><text x="640" y="230" class="pairs">••</text>
  <text x="418" y="270" class="body">Budget: 2 + 2(7) = 16 e⁻</text>
  <text x="418" y="302" class="count">4 e⁻ around Be — confirmed</text>
  <text x="418" y="342" class="body">The other 12 electrons are</text>
  <text x="418" y="365" class="body">three lone pairs on each Cl.</text>

  <rect x="755" y="80" width="290" height="330" rx="18" class="box"/>
  <text x="778" y="116" class="head">BF₃: six around B</text>
  <text x="892" y="215" class="atom">B</text>
  <line x1="907" y1="183" x2="907" y2="145" class="bond"/><text x="896" y="137" class="atom">F</text>
  <line x1="883" y1="208" x2="835" y2="238" class="bond"/><text x="807" y="260" class="atom">F</text>
  <line x1="931" y1="208" x2="979" y2="238" class="bond"/><text x="985" y="260" class="atom">F</text>
  <text x="896" y="108" class="pairs">••</text><text x="874" y="132" class="pairs">••</text><text x="920" y="132" class="pairs">••</text>
  <text x="804" y="228" class="pairs">••</text><text x="784" y="254" class="pairs">••</text><text x="809" y="282" class="pairs">••</text>
  <text x="985" y="228" class="pairs">••</text><text x="1014" y="254" class="pairs">••</text><text x="986" y="282" class="pairs">••</text>
  <text x="778" y="300" class="body">Budget: 3 + 3(7) = 24 e⁻</text>
  <text x="778" y="332" class="count">6 e⁻ around B — confirmed</text>
  <text x="778" y="372" class="body">The remaining 18 electrons are</text>
  <text x="778" y="395" class="body">three lone pairs on each F.</text>
  <text x="38" y="447" class="body">Do not add a central lone pair unless it exists in the species' counted valence-electron total.</text>
</svg>
