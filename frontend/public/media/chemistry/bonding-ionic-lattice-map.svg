<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260"><title>Ionic lattice reasoning</title><desc>Four-stage chemistry reasoning diagram for Ionic Bonds and Compounds.</desc><style>.t{font:700 20px Arial;fill:#172554}.h{font:700 15px Arial;fill:#172554}.b{font:13px Arial;fill:#334155}.card{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.atom{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.e{fill:#dc2626}.arrow{stroke:#0f766e;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/></marker></defs><text x="30" y="34" class="t">Ionic lattice reasoning</text><rect x="25" y="70" width="190" height="120" rx="14" class="card"/><circle cx="57" cy="105" r="18" class="atom"/><text x="51" y="111" class="h">1</text><text x="45" y="150" class="h">form ions</text><line x1="220" y1="130" x2="250" y2="130" class="arrow"/><rect x="260" y="70" width="190" height="120" rx="14" class="card"/><circle cx="292" cy="105" r="18" class="atom"/><text x="286" y="111" class="h">2</text><text x="280" y="150" class="h">balance ratio</text><line x1="455" y1="130" x2="485" y2="130" class="arrow"/><rect x="495" y="70" width="190" height="120" rx="14" class="card"/><circle cx="527" cy="105" r="18" class="atom"/><text x="521" y="111" class="h">3</text><text x="515" y="150" class="h">assemble lattice</text><line x1="690" y1="130" x2="720" y2="130" class="arrow"/><rect x="730" y="70" width="190" height="120" rx="14" class="card"/><circle cx="762" cy="105" r="18" class="atom"/><text x="756" y="111" class="h">4</text><text x="750" y="150" class="h">predict properties</text><text x="30" y="232" class="b">Keep electron accounting, particle identity, and observable evidence as separate verification layers.</text></svg>