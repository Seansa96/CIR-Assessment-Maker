<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Water structure, dipoles, and hydrogen bonding</title><desc id="d">A bent water molecule shows two oxygen lone pairs, a 104.5-degree angle, bond dipoles toward oxygen, and a dotted intermolecular hydrogen bond to a neighbor.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#b23969"/></marker></defs><style>.h{font:700 22px Arial;fill:#17263b}.b{font:17px Arial;fill:#17263b}.bond{stroke:#17263b;stroke-width:8}.dip{stroke:#b23969;stroke-width:4;marker-end:url(#a)}.hb{stroke:#326da8;stroke-width:4;stroke-dasharray:7 7}.lp{fill:#b23969}</style><text x="500" y="34" text-anchor="middle" class="h">Bent shape prevents O-H bond dipoles from canceling</text><circle cx="410" cy="190" r="48" fill="#ef6b6b"/><text x="410" y="198" text-anchor="middle" class="h">O</text><circle cx="240" cy="300" r="33" fill="#d8edff"/><text x="240" y="308" text-anchor="middle" class="h">H</text><circle cx="580" cy="300" r="33" fill="#d8edff"/><text x="580" y="308" text-anchor="middle" class="h">H</text><line x1="375" y1="224" x2="270" y2="285" class="bond"/><line x1="445" y1="224" x2="550" y2="285" class="bond"/><circle cx="380" cy="110" r="7" class="lp"/><circle cx="400" cy="110" r="7" class="lp"/><circle cx="420" cy="110" r="7" class="lp"/><circle cx="440" cy="110" r="7" class="lp"/><path d="M340 245Q410 285 480 245" fill="none" stroke="#e07a2f" stroke-width="4"/><text x="410" y="285" text-anchor="middle" class="b">104.5 degrees</text><line x1="285" y1="268" x2="365" y2="220" class="dip"/><line x1="535" y1="268" x2="455" y2="220" class="dip"/><line x1="410" y1="150" x2="410" y2="70" class="dip"/><text x="430" y="72" class="b">net dipole</text><circle cx="820" cy="190" r="42" fill="#ef6b6b"/><text x="820" y="198" text-anchor="middle" class="h">O</text><circle cx="710" cy="275" r="28" fill="#d8edff"/><text x="710" y="282" text-anchor="middle" class="h">H</text><line x1="790" y1="220" x2="735" y2="260" class="bond"/><line x1="580" y1="300" x2="785" y2="205" class="hb"/><text x="745" y="340" text-anchor="middle" class="b">dotted line: intermolecular hydrogen bond</text></svg>
