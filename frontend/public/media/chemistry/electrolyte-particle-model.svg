<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc"><title id="title">Particle models for electrolyte strength</title><desc id="desc">Strong electrolyte separates completely into ions, weak electrolyte is mostly intact molecules, and nonelectrolyte has neutral molecules.</desc><rect width="720" height="260" fill="#f7fbff"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.b{fill:#fff;stroke:#3977a8;stroke-width:2}.p{fill:#e88872}.n{fill:#7ab6e8}.m{fill:#e7c96b}</style><text x="25" y="30" font-size="20" font-weight="bold">Particles, not just dissolved material, determine electrolyte behavior</text><g transform="translate(25 55)"><rect class="b" width="205" height="175" rx="10"/><text x="38" y="30" font-size="16">Strong electrolyte</text><text x="25" y="55" font-size="13">complete ion separation</text><circle class="p" cx="45" cy="95" r="15"/><text x="39" y="100">+</text><circle class="n" cx="105" cy="95" r="15"/><text x="100" y="100">−</text><circle class="p" cx="155" cy="130" r="15"/><text x="149" y="135">+</text><circle class="n" cx="75" cy="140" r="15"/><text x="70" y="145">−</text></g><g transform="translate(257 55)"><rect class="b" width="205" height="175" rx="10"/><text x="38" y="30" font-size="16">Weak electrolyte</text><text x="25" y="55" font-size="13">partial ionization</text><ellipse class="m" cx="52" cy="100" rx="25" ry="14"/><ellipse class="m" cx="130" cy="135" rx="25" ry="14"/><circle class="p" cx="150" cy="88" r="13"/><text x="146" y="93">+</text><circle class="n" cx="180" cy="105" r="13"/><text x="176" y="110">−</text></g><g transform="translate(489 55)"><rect class="b" width="205" height="175" rx="10"/><text x="32" y="30" font-size="16">Nonelectrolyte</text><text x="28" y="55" font-size="13">neutral molecules only</text><ellipse class="m" cx="55" cy="100" rx="27" ry="15"/><ellipse class="m" cx="130" cy="125" rx="27" ry="15"/><ellipse class="m" cx="90" cy="155" rx="27" ry="15"/></g></svg>
