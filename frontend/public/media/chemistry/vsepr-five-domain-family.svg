<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Five-domain molecular geometry family</title><desc id="d">Cards show AX5 trigonal bipyramidal, AX4E seesaw, AX3E2 T-shaped, and AX2E3 linear after equatorial lone-pair placement.</desc><style>.c{fill:#f7fbff;stroke:#326da8;stroke-width:3}.h{font:700 20px Arial;fill:#17263b}.b{font:16px Arial;fill:#17263b}.l{stroke:#17263b;stroke-width:4}.back{stroke:#70859e;stroke-width:4;stroke-dasharray:5 6}.lp{fill:#b23969}.a{fill:#d8edff}</style><text x="600" y="32" text-anchor="middle" class="h">Five domains: lone pairs occupy equatorial sites first</text><g transform="translate(15 55)"><rect class="c" width="275" height="325" rx="14"/><text x="138" y="35" text-anchor="middle" class="h">AX5</text><circle cx="138" cy="170" r="22" class="a"/><line x1="138" y1="148" x2="138" y2="85" class="l"/><line x1="138" y1="192" x2="138" y2="255" class="l"/><line x1="120" y1="182" x2="68" y2="218" class="l"/><line x1="156" y1="182" x2="208" y2="218" class="l"/><line x1="138" y1="152" x2="210" y2="135" class="back"/><text x="138" y="295" text-anchor="middle" class="b">trigonal bipyramidal</text></g><g transform="translate(310 55)"><rect class="c" width="275" height="325" rx="14"/><text x="138" y="35" text-anchor="middle" class="h">AX4E</text><circle cx="138" cy="170" r="22" class="a"/><line x1="138" y1="148" x2="138" y2="85" class="l"/><line x1="138" y1="192" x2="138" y2="255" class="l"/><line x1="120" y1="182" x2="68" y2="218" class="l"/><line x1="156" y1="182" x2="208" y2="218" class="l"/><circle cx="210" cy="135" r="10" class="lp"/><text x="138" y="295" text-anchor="middle" class="b">seesaw</text></g><g transform="translate(605 55)"><rect class="c" width="275" height="325" rx="14"/><text x="138" y="35" text-anchor="middle" class="h">AX3E2</text><circle cx="138" cy="170" r="22" class="a"/><line x1="138" y1="148" x2="138" y2="85" class="l"/><line x1="138" y1="192" x2="138" y2="255" class="l"/><line x1="120" y1="182" x2="68" y2="218" class="l"/><circle cx="208" cy="218" r="10" class="lp"/><circle cx="210" cy="135" r="10" class="lp"/><text x="138" y="295" text-anchor="middle" class="b">T-shaped</text></g><g transform="translate(900 55)"><rect class="c" width="285" height="325" rx="14"/><text x="143" y="35" text-anchor="middle" class="h">AX2E3</text><circle cx="143" cy="170" r="22" class="a"/><line x1="143" y1="148" x2="143" y2="85" class="l"/><line x1="143" y1="192" x2="143" y2="255" class="l"/><circle cx="73" cy="218" r="10" class="lp"/><circle cx="213" cy="218" r="10" class="lp"/><circle cx="215" cy="135" r="10" class="lp"/><text x="143" y="295" text-anchor="middle" class="b">linear</text></g></svg>
