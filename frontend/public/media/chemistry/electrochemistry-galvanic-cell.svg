<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Labeled galvanic cell</title><desc id="d">A zinc anode oxidizes on the left, a copper cathode reduces on the right, electrons move through the wire from zinc to copper, and a salt bridge maintains charge balance.</desc><rect width="760" height="340" fill="#f8fafc"/><path d="M180 70V250M580 70V250" stroke="#475569" stroke-width="18"/><path d="M180 70C290 20 470 20 580 70" stroke="#0f766e" stroke-width="4" fill="none"/><path d="M465 40l-14-9v18z" fill="#0f766e"/><path d="M285 135Q380 80 475 135" stroke="#7c3aed" stroke-width="12" fill="none"/><rect x="80" y="150" width="220" height="145" rx="8" fill="#dbeafe" stroke="#334155"/><rect x="460" y="150" width="220" height="145" rx="8" fill="#fee2e2" stroke="#334155"/><g font-family="Arial" fill="#334155" font-size="16"><text x="110" y="325">Zn anode (−): oxidation</text><text x="485" y="325">Cu cathode (+): reduction</text><text x="315" y="30">electron flow →</text><text x="315" y="105">salt bridge: ion migration</text></g></svg>
