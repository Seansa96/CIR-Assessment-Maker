<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Nuclear decay daughter-number map</title><desc id="d">A parent nuclide at mass number A and atomic number Z maps to characteristic daughter changes for alpha, beta-minus, positron emission, electron capture, and gamma emission.</desc><rect width="760" height="360" fill="#f8fafc"/><rect x="275" y="135" width="210" height="90" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="325" y="175" font-family="Arial" font-size="22" fill="#334155">parent ᴬZX</text><text x="320" y="205" font-family="Arial" font-size="16" fill="#334155">track ΔA and ΔZ</text><g font-family="Arial" font-size="16" fill="#334155"><text x="35" y="65">alpha: ΔA = −4, ΔZ = −2</text><text x="500" y="65">beta−: ΔA = 0, ΔZ = +1</text><text x="30" y="315">positron / capture: ΔA = 0, ΔZ = −1</text><text x="510" y="315">gamma: ΔA = 0, ΔZ = 0</text></g><g stroke="#0f766e" stroke-width="4" fill="none"><path d="M280 140L205 80"/><path d="M480 140L555 80"/><path d="M280 220L205 285"/><path d="M480 220L555 285"/></g><g fill="#0f766e"><path d="M205 80l16 3-10 12z"/><path d="M555 80l-16 3 10 12z"/><path d="M205 285l16-3-10-12z"/><path d="M555 285l-16-3 10-12z"/></g></svg>
