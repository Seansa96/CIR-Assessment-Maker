<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Formal-charge audit for an expanded-octet sulfur hexafluoride structure</title>
  <desc id="desc">A sulfur atom with six single bonds to fluorine atoms is paired with the formal-charge formula. Calculations show zero formal charge on sulfur and on every fluorine, and a final sum of zero for the neutral molecule.</desc>
  <style>.title{font:700 25px Arial,sans-serif;fill:#172554}.head{font:700 19px Arial,sans-serif;fill:#312e81}.atom{font:700 25px Arial,sans-serif;fill:#172554}.body{font:16px Arial,sans-serif;fill:#334155}.math{font:700 20px Arial,sans-serif;fill:#0f766e}.box{fill:#fff;stroke:#6366f1;stroke-width:2}.bond{stroke:#172554;stroke-width:4}.tag{fill:#ecfdf5;stroke:#059669;stroke-width:2}</style>
  <rect width="1080" height="500" rx="22" fill="#f1f5f9"/>
  <text x="38" y="44" class="title">Expanded shell, ordinary bookkeeping: audit SF₆ atom by atom</text>
  <rect x="35" y="78" width="445" height="370" rx="18" class="box"/>
  <text x="58" y="112" class="head">Structure and bonding-electron count</text>
  <g transform="translate(255 265)">
    <text x="-14" y="8" class="atom">S</text>
    <line x1="0" y1="-22" x2="0" y2="-105" class="bond"/><text x="-10" y="-118" class="atom">F</text>
    <line x1="0" y1="22" x2="0" y2="105" class="bond"/><text x="-10" y="138" class="atom">F</text>
    <line x1="-24" y1="0" x2="-108" y2="0" class="bond"/><text x="-143" y="9" class="atom">F</text>
    <line x1="24" y1="0" x2="108" y2="0" class="bond"/><text x="119" y="9" class="atom">F</text>
    <line x1="-18" y1="-18" x2="-78" y2="-77" class="bond"/><text x="-111" y="-82" class="atom">F</text>
    <line x1="18" y1="18" x2="78" y2="77" class="bond"/><text x="87" y="94" class="atom">F</text>
  </g>
  <text x="58" y="416" class="body">Six S–F bonds = 12 bonding electrons around S</text>

  <rect x="515" y="78" width="530" height="370" rx="18" class="box"/>
  <text x="542" y="112" class="head">Formal charge: FC = V − N − B/2</text>
  <rect x="542" y="140" width="468" height="92" rx="14" class="tag"/>
  <text x="562" y="174" class="math">Sulfur: 6 − 0 − 12/2 = 0</text>
  <text x="562" y="205" class="body">Expanded shell: 12 surrounding electrons, no lone electrons</text>
  <rect x="542" y="252" width="468" height="92" rx="14" class="tag"/>
  <text x="562" y="286" class="math">Each fluorine: 7 − 6 − 2/2 = 0</text>
  <text x="562" y="317" class="body">Three lone pairs and one single bond on each F</text>
  <text x="542" y="382" class="head">Charge-sum check</text>
  <text x="542" y="416" class="math">0 + 6(0) = 0 = molecular charge</text>
  <text x="38" y="478" class="body">Count bonding electrons before dividing by two; counting bonds and then dividing again applies the half-share rule twice.</text>
</svg>
