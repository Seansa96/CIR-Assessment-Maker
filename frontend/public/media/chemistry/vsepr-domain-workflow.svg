<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">VSEPR prediction workflow</title><desc id="desc">A four-stage diagram moves from a Lewis structure through domain counting and electron-domain geometry to molecular geometry and angle refinement.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#13233a}.h{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:16px}.box{fill:#f7fbff;stroke:#3478b8;stroke-width:3}.arrow{stroke:#3478b8;stroke-width:5;fill:none;marker-end:url(#m)}.bond{stroke:#13233a;stroke-width:5}.lp{fill:#b43b66}.atom{fill:#dcecff;stroke:#13233a;stroke-width:3}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3478b8"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="h">VSEPR: use the same order every time</text>
  <rect x="25" y="80" width="260" height="355" rx="18" class="box"/><text x="155" y="120" text-anchor="middle" class="h">1. Lewis structure</text>
  <text x="155" y="155" text-anchor="middle" class="b">Identify the central atom.</text><circle cx="155" cy="245" r="32" class="atom"/><text x="155" y="252" text-anchor="middle" class="h">S</text><text x="84" y="210" class="b">O</text><text x="217" y="210" class="b">O</text><line x1="110" y1="228" x2="135" y2="238" class="bond"/><line x1="200" y1="228" x2="175" y2="238" class="bond"/><circle cx="142" cy="300" r="4" class="lp"/><circle cx="168" cy="300" r="4" class="lp"/><text x="155" y="350" text-anchor="middle" class="s">Single, double, and triple bonds</text><text x="155" y="374" text-anchor="middle" class="s">each occupy one domain.</text>
  <path d="M290 255 H345" class="arrow"/><rect x="355" y="80" width="225" height="355" rx="18" class="box"/><text x="468" y="120" text-anchor="middle" class="h">2. Count domains</text><text x="468" y="175" text-anchor="middle" class="b">bond domains + lone pairs</text><text x="468" y="230" text-anchor="middle" class="h">2 + 1 = 3</text><text x="468" y="280" text-anchor="middle" class="b">AX₂E₁</text><text x="468" y="330" text-anchor="middle" class="s">Count only around the</text><text x="468" y="354" text-anchor="middle" class="s">atom whose shape you name.</text>
  <path d="M585 255 H640" class="arrow"/><rect x="650" y="80" width="245" height="355" rx="18" class="box"/><text x="772" y="120" text-anchor="middle" class="h">3. Place all domains</text><text x="772" y="155" text-anchor="middle" class="b">electron-domain geometry</text><circle cx="772" cy="260" r="28" class="atom"/><text x="772" y="267" text-anchor="middle" class="h">S</text><line x1="746" y1="245" x2="685" y2="210" class="bond"/><line x1="798" y1="245" x2="859" y2="210" class="bond"/><circle cx="772" cy="180" r="9" class="lp"/><text x="772" y="335" text-anchor="middle" class="b">3 domains → trigonal planar</text><text x="772" y="365" text-anchor="middle" class="s">Lone pairs are included here.</text>
  <path d="M900 255 H955" class="arrow"/><rect x="965" y="80" width="210" height="355" rx="18" class="box"/><text x="1070" y="120" text-anchor="middle" class="h">4. Name atoms</text><text x="1070" y="155" text-anchor="middle" class="b">molecular geometry</text><circle cx="1070" cy="260" r="28" class="atom"/><text x="1070" y="267" text-anchor="middle" class="h">S</text><line x1="1045" y1="248" x2="990" y2="215" class="bond"/><line x1="1095" y1="248" x2="1150" y2="215" class="bond"/><text x="1070" y="335" text-anchor="middle" class="b">bent</text><text x="1070" y="365" text-anchor="middle" class="s">Then compare with the ideal</text><text x="1070" y="389" text-anchor="middle" class="s">angle: lone pairs compress it.</text>
  <text x="600" y="485" text-anchor="middle" class="b">Electron-domain geometry counts every region; molecular geometry names only the atom positions.</text>
</svg>
