<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">VSEPR prediction workflow</title><desc id="d">Four panels move from a sulfur dioxide Lewis environment to three domains, trigonal planar electron geometry, and bent molecular geometry.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#326da8"/></marker></defs><style>.p{fill:#f6fbff;stroke:#326da8;stroke-width:3}.h{font:700 22px Arial;fill:#17263b}.b{font:17px Arial;fill:#17263b}.bond{stroke:#17263b;stroke-width:5}.lp{fill:#b23969}.arr{stroke:#326da8;stroke-width:5;marker-end:url(#a)}</style><text x="600" y="34" text-anchor="middle" class="h">Lewis environment -&gt; domains -&gt; electron geometry -&gt; molecular geometry</text><g transform="translate(20 65)"><rect class="p" width="260" height="300" rx="16"/><text x="130" y="35" text-anchor="middle" class="h">1. Select center</text><circle cx="130" cy="145" r="30" fill="#d8edff" stroke="#17263b" stroke-width="3"/><text x="130" y="153" text-anchor="middle" class="h">S</text><text x="45" y="105" class="h">O</text><text x="205" y="105" class="h">O</text><line x1="75" y1="112" x2="108" y2="132" class="bond"/><line x1="185" y1="112" x2="152" y2="132" class="bond"/><circle cx="118" cy="205" r="6" class="lp"/><circle cx="142" cy="205" r="6" class="lp"/><text x="130" y="255" text-anchor="middle" class="b">2 bond directions + 1 lone pair</text></g><line x1="285" y1="215" x2="325" y2="215" class="arr"/><g transform="translate(335 65)"><rect class="p" width="230" height="300" rx="16"/><text x="115" y="35" text-anchor="middle" class="h">2. Count</text><text x="115" y="125" text-anchor="middle" class="h">2 + 1 = 3</text><text x="115" y="175" text-anchor="middle" class="h">AX2E</text><text x="115" y="235" text-anchor="middle" class="b">Multiple bonds still use</text><text x="115" y="260" text-anchor="middle" class="b">one direction.</text></g><line x1="570" y1="215" x2="610" y2="215" class="arr"/><g transform="translate(620 65)"><rect class="p" width="250" height="300" rx="16"/><text x="125" y="35" text-anchor="middle" class="h">3. All domains</text><circle cx="125" cy="155" r="26" fill="#d8edff"/><line x1="125" y1="129" x2="125" y2="70" class="bond"/><line x1="105" y1="168" x2="52" y2="202" class="bond"/><line x1="145" y1="168" x2="198" y2="202" class="bond"/><circle cx="125" cy="72" r="10" class="lp"/><text x="125" y="250" text-anchor="middle" class="h">trigonal planar</text><text x="125" y="278" text-anchor="middle" class="b">includes lone pair</text></g><line x1="875" y1="215" x2="915" y2="215" class="arr"/><g transform="translate(925 65)"><rect class="p" width="255" height="300" rx="16"/><text x="128" y="35" text-anchor="middle" class="h">4. Atom positions</text><circle cx="128" cy="145" r="26" fill="#d8edff"/><line x1="108" y1="160" x2="48" y2="205" class="bond"/><line x1="148" y1="160" x2="208" y2="205" class="bond"/><text x="128" y="250" text-anchor="middle" class="h">bent</text><text x="128" y="278" text-anchor="middle" class="b">lone pair omitted</text></g></svg>
