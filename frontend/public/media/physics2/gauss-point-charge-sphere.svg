<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-labelledby="title desc">
  <title id="title">Point charge inside a spherical Gaussian surface</title>
  <desc id="desc">A positive point charge is centered within a dashed sphere. Radial electric-field arrows align with outward area vectors at every point on the sphere.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1769aa"/></marker>
    <marker id="area" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="940" height="620" fill="#fbfcfe"/>
  <circle cx="340" cy="285" r="205" fill="#d8ecff" fill-opacity="0.45" stroke="#425a70" stroke-width="5" stroke-dasharray="13 11"/>
  <circle cx="340" cy="285" r="18" fill="#d63c32"/>
  <text x="340" y="295" text-anchor="middle" font-family="Arial" font-size="28" fill="white">+</text>
  <text x="365" y="320" font-family="Arial" font-size="30">q</text>
  <g stroke="#1769aa" stroke-width="6" marker-end="url(#arrow)">
    <path d="M340 255V55"/><path d="M370 285H570"/><path d="M340 315V515"/><path d="M310 285H110"/><path d="M362 263L505 120"/><path d="M318 263L175 120"/><path d="M362 307L505 450"/><path d="M318 307L175 450"/>
  </g>
  <path d="M340 285L505 120" stroke="#444" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="420" y="190" font-family="Arial" font-size="28">r</text>
  <path d="M505 120L585 40" stroke="#c0392b" stroke-width="7" marker-end="url(#area)"/>
  <text x="600" y="45" font-family="Arial" font-size="29" fill="#c0392b">dA</text>
  <text x="595" y="135" font-family="Arial" font-size="25">E and dA are parallel</text>
  <text x="595" y="170" font-family="Arial" font-size="25">theta = 0</text>
  <g font-family="Arial" font-size="27" fill="#222"><text x="595" y="245">E(r) = kq/r^2</text><text x="595" y="295">A = 4 pi r^2</text><text x="595" y="345">Phi = E(r)A</text><text x="595" y="395">= (kq/r^2)(4 pi r^2)</text><text x="595" y="445">= q/epsilon_0</text></g>
  <text x="470" y="585" text-anchor="middle" font-family="Arial" font-size="28">closed-surface flux = Q_enclosed / epsilon_0</text>
</svg>
