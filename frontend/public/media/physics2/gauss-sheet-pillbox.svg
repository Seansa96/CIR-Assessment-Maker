<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Pillbox Gaussian surface crossing a uniformly charged infinite sheet</title>
  <desc id="desc">A short cylindrical pillbox straddles a charged plane. Field arrows point normally away from both sides of the sheet.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1769aa"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="980" height="620" fill="#fbfcfe"/>
  <polygon points="180,135 650,75 790,440 320,500" fill="#f5d76e" fill-opacity="0.58" stroke="#8a6d00" stroke-width="5"/>
  <g fill="#8a6d00" font-family="Arial" font-size="30"><text x="255" y="205">+</text><text x="405" y="155">+</text><text x="580" y="130">+</text><text x="690" y="270">+</text><text x="540" y="390">+</text><text x="365" y="430">+</text><text x="270" y="330">+</text></g>
  <text x="585" y="500" font-family="Arial" font-size="25" fill="#6c5500">uniform sheet: sigma</text>
  <path d="M465 110L590 260" stroke="#18766b" stroke-width="6"/>
  <ellipse cx="590" cy="260" rx="85" ry="40" transform="rotate(50 590 260)" fill="#bde5df" stroke="#18766b" stroke-width="5"/>
  <path d="M465 110L385 180M590 260L510 330" stroke="#18766b" stroke-width="6"/>
  <ellipse cx="385" cy="180" rx="85" ry="40" transform="rotate(50 385 180)" fill="#bde5df" fill-opacity="0.75" stroke="#18766b" stroke-width="5"/>
  <ellipse cx="510" cy="330" rx="85" ry="40" transform="rotate(50 510 330)" fill="#bde5df" fill-opacity="0.75" stroke="#18766b" stroke-width="5"/>
  <g stroke="#1769aa" stroke-width="7" marker-end="url(#blue)"><path d="M390 180L270 35"/><path d="M510 330L650 500"/></g>
  <g stroke="#c0392b" stroke-width="6" marker-end="url(#red)"><path d="M385 180L305 85"/><path d="M510 330L590 425"/></g>
  <g font-family="Arial" font-size="27"><text x="120" y="55" fill="#1769aa">E away from + sheet</text><text x="660" y="545" fill="#1769aa">E away from + sheet</text><text x="650" y="220">Gaussian pillbox</text><text x="650" y="255">straddles the sheet</text></g>
  <text x="490" y="600" text-anchor="middle" font-family="Arial" font-size="29">Q_enclosed = sigma A</text>
</svg>
