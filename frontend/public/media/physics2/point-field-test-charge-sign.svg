<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d"><title id="t">Same upward E; negative test charge force points down</title><desc id="d">E is unchanged; F reverses with q₀.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#267d9a"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#bc5d40"/></marker></defs><rect width="720" height="250" rx="18" fill="#f4f9fb"/><text x="360" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18394a">Same upward E; negative test charge force points down</text><path d="M360 185V92" stroke="#267d9a" stroke-width="6" marker-end="url(#a)"/><path d="M390 80V173" stroke="#bc5d40" stroke-width="6" marker-end="url(#b)"/><text x="390" y="68" font-size="18" fill="#267d9a">E</text><text x="410" y="180" font-size="18" fill="#bc5d40">F (q₀ &lt; 0)</text><text x="360" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#405967">E is unchanged; F reverses with q₀</text></svg>