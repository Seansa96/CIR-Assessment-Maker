<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Three positive charges and point P</title><desc id="desc">A rectangle geometry showing q1 above q2, q3 to the right of q2, and P above q3. Distances a, b, and c are marked.</desc>
  <rect width="900" height="520" fill="#fffdf7"/><g stroke="#18324b" stroke-width="4" fill="none">
    <line x1="150" y1="340" x2="650" y2="340"/><line x1="150" y1="120" x2="150" y2="340"/><line x1="650" y1="120" x2="650" y2="340"/>
    <line x1="150" y1="120" x2="650" y2="120" stroke-dasharray="10 10"/><line x1="150" y1="340" x2="650" y2="120" stroke="#d45b4c"/><line x1="650" y1="340" x2="650" y2="120" stroke-dasharray="8 8"/>
  </g><g fill="#d45b4c" stroke="#7c2d24" stroke-width="3"><circle cx="150" cy="120" r="25"/><circle cx="150" cy="340" r="25"/><circle cx="650" cy="340" r="25"/></g>
  <circle cx="650" cy="120" r="12" fill="#1f8a70"/><g font-family="Arial, sans-serif" font-size="28" fill="#18324b"><text x="115" y="82">q1 &gt; 0</text><text x="100" y="400">q2 &gt; 0</text><text x="625" y="400">q3 &gt; 0</text><text x="670" y="112">P</text><text x="385" y="375">a</text><text x="112" y="240">b</text><text x="395" y="105">a + c</text><text x="650" y="245">b</text><text x="700" y="350">c</text><text x="405" y="235" fill="#d45b4c">r2</text><text x="675" y="215" fill="#d45b4c">r3</text></g>
</svg>
