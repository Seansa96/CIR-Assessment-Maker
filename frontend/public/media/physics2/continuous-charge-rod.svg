<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Finite rod: source elements and observation point</title><desc id="desc">A horizontal uniform rod extends from minus L to L. Equal elements at minus x and x contribute along displacement vectors to P at zero comma a. Their horizontal field components cancel; vertical components add.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#36536a"/></marker></defs>
<rect width="760" height="470" rx="16" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif" fill="#173047"><text x="30" y="38" font-size="23">Finite rod • uniform positive λ • full length 2L</text>
<g stroke="#36536a" stroke-width="2" marker-end="url(#arrow)"><path d="M90 335H695"/><path d="M380 375V65"/><path d="M230 335L380 135"/><path d="M530 335L380 135"/></g>
<path d="M140 335H620" stroke="#147d92" stroke-width="12"/>
<path d="M216 335H244M516 335H544" stroke="#da7830" stroke-width="14"/>
<path d="M380 135L335 75M380 135L425 75" stroke="#36536a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="380" cy="135" r="6" fill="#173047"/>
<g font-size="19"><text x="697" y="342">x</text><text x="394" y="73">y</text><text x="398" y="145">P = (0, a)</text><text x="393" y="248">a &gt; 0</text><text x="128" y="368">−L</text><text x="608" y="368">L</text><text x="365" y="368">0</text><text x="208" y="307">−x</text><text x="524" y="307">x</text><text x="548" y="306">dq = λ dx</text><text x="443" y="225">R⃗ = (−x, a)</text><text x="181" y="209">equal distance</text><text x="251" y="76">dE from +x</text><text x="434" y="76">dE from −x</text></g>
<text x="90" y="423" font-size="19">Source distance: √(x² + a²)  •  horizontal parts cancel</text>
</g></svg>
