<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Uniformly charged solid cylinder and coaxial Gaussian surface</title>
  <desc id="desc">A long uniformly charged solid cylinder of radius R lies inside a larger coaxial Gaussian cylinder of radius r. A radial electric field crosses the curved wall, while the end caps carry no flux.</desc>
  <rect width="720" height="420" rx="20" fill="#f7fafc"/>
  <text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">Uniform solid cylinder: source and Gaussian surface</text>
  <g transform="translate(40 66)">
    <ellipse cx="280" cy="80" rx="105" ry="35" fill="#abf5d1" fill-opacity="0.72" stroke="#00875a" stroke-width="3"/>
    <path d="M175 80 V265 M385 80 V265" stroke="#00875a" stroke-width="3"/>
    <ellipse cx="280" cy="265" rx="105" ry="35" fill="#abf5d1" fill-opacity="0.35" stroke="#00875a" stroke-width="3"/>
    <ellipse cx="280" cy="80" rx="190" ry="62" fill="none" stroke="#6554c0" stroke-width="3" stroke-dasharray="10 7"/>
    <path d="M90 80 V265 M470 80 V265" stroke="#6554c0" stroke-width="3" stroke-dasharray="10 7"/>
    <ellipse cx="280" cy="265" rx="190" ry="62" fill="none" stroke="#6554c0" stroke-width="3" stroke-dasharray="10 7"/>
    <line x1="280" y1="45" x2="280" y2="300" stroke="#344563" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="294" y="60" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">axis</text>
    <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#006644">
      <text x="236" y="132">+</text><text x="310" y="132">+</text>
      <text x="236" y="184">+</text><text x="310" y="184">+</text>
      <text x="236" y="236">+</text><text x="310" y="236">+</text>
    </g>
    <line x1="385" y1="173" x2="470" y2="173" stroke="#6554c0" stroke-width="2"/>
    <text x="416" y="160" font-family="Arial, sans-serif" font-size="16" fill="#403294">r</text>
    <line x1="280" y1="173" x2="385" y2="173" stroke="#00875a" stroke-width="2"/>
    <text x="324" y="160" font-family="Arial, sans-serif" font-size="16" fill="#006644">R</text>
    <circle cx="470" cy="173" r="7" fill="#0052cc"/>
    <text x="484" y="179" font-family="Arial, sans-serif" font-size="17" fill="#0052cc">P</text>
    <path d="M385 173 H496 M90 173 H64" stroke="#de350b" stroke-width="4"/>
    <path d="M496 173 l-12-7 M496 173 l-12 7 M64 173 l12-7 M64 173 l12 7" fill="none" stroke="#de350b" stroke-width="3"/>
    <text x="530" y="168" font-family="Arial, sans-serif" font-size="15" fill="#de350b">radial E</text>
    <text x="280" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172b4d">Green = charged source radius R; dashed purple = Gaussian radius r</text>
  </g>
</svg>
