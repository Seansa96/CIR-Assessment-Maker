<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Electric field of a point charge</title><desc id="desc">A source charge and observation point are joined by a displacement vector; field direction depends on the source sign.</desc><rect width="640" height="320" fill="#f6f9fc"/><text x="24" y="38" font-size="24" fill="#173047">Electric field: source, observer, and vector</text><circle cx="190" cy="175" r="34" fill="#2d83a5"/><text x="180" y="185" fill="white" font-size="26">+</text><circle cx="485" cy="175" r="8" fill="#da7830"/><text x="470" y="220" fill="#173047" font-size="19">P</text><line x1="225" y1="175" x2="475" y2="175" stroke="#36536a" stroke-width="3"/><polygon points="475,175 458,166 458,184" fill="#36536a"/><text x="300" y="158" fill="#173047" font-size="20">R = r − rₛ</text><line x1="485" y1="145" x2="575" y2="145" stroke="#147d92" stroke-width="5"/><polygon points="575,145 557,136 557,154" fill="#147d92"/><text x="500" y="118" fill="#173047" font-size="18">E away from +q</text></svg>
