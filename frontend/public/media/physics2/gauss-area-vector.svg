<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Area vector and electric flux through a flat surface</title>
  <desc id="desc">A tilted rectangular surface is crossed by a uniform electric field. The area vector is normal to the surface and makes angle theta with the field.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1769aa"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="900" height="500" fill="#fbfcfe"/>
  <g stroke="#1769aa" stroke-width="6" marker-end="url(#arrow-blue)">
    <path d="M70 115H790"/><path d="M70 200H790"/><path d="M70 285H790"/><path d="M70 370H790"/>
  </g>
  <text x="805" y="205" font-family="Arial" font-size="34" fill="#1769aa">E</text>
  <polygon points="380,80 575,150 510,420 315,350" fill="#f2c94c" fill-opacity="0.72" stroke="#8a6d00" stroke-width="5"/>
  <text x="400" y="255" font-family="Arial" font-size="38" font-weight="700" fill="#5f4b00">area A</text>
  <path d="M445 250L710 95" stroke="#c0392b" stroke-width="7" marker-end="url(#arrow-red)"/>
  <text x="720" y="92" font-family="Arial" font-size="34" fill="#c0392b">A (normal)</text>
  <path d="M550 250A105 105 0 0 0 535 195" fill="none" stroke="#333" stroke-width="4"/>
  <text x="560" y="205" font-family="Arial" font-size="32">θ</text>
  <text x="450" y="470" text-anchor="middle" font-family="Arial" font-size="31" fill="#222">Φ = E · A = EA cos θ</text>
</svg>
