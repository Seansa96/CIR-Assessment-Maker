  <text x="480" y="165" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Model</text><text x="480" y="210" text-anchor="middle" font-family="Arial" font-size="24">Z=\\sqrt{R^2+(X_L-X_C)^2}</text>
