<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Ring axis geometry</title><desc id="desc">A uniformly charged ring lies in the xy-plane. Its radius R and observation height z form the right triangle with source distance D equals square root of R squared plus z squared. A small arc carries dq equals lambda R d phi.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#36536a"/></marker></defs>
<rect width="760" height="470" rx="16" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif" fill="#173047"><text x="30" y="38" font-size="23">Uniform ring • constant source distance on the axis</text>
<ellipse cx="330" cy="322" rx="175" ry="65" fill="none" stroke="#147d92" stroke-width="8"/>
<path d="M330 360V66M330 322H579M330 322L204 415" stroke="#36536a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M330 322L482 355L330 130" stroke="#36536a" stroke-width="2" fill="none"/>
<path d="M468 364Q484 357 495 345" stroke="#da7830" stroke-width="11" fill="none"/>
<path d="M482 355L330 130" stroke="#36536a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="330" cy="130" r="6" fill="#173047"/>
<g font-size="19"><text x="347" y="132">P = (0, 0, z)</text><text x="341" y="82">z-axis; net E for Q &gt; 0, z &gt; 0</text><text x="304" y="228">z</text><text x="398" y="320">R</text><text x="403" y="211">D = √(R² + z²)</text><text x="513" y="367">dq = λR dφ</text><text x="588" y="326">y</text><text x="185" y="438">x</text><text x="88" y="427">xy-plane</text></g>
<text x="339" y="442" font-size="19">Axial projection factor: z / D</text>
</g></svg>
