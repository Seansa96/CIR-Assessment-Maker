<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
<title id="title">Disk assembled from annuli</title><desc id="desc">A disk of outer radius R contains a thin annulus at radius s and width ds. The observer P is at height z above the disk. The annulus area is 2 pi s ds and its distance to P is square root of s squared plus z squared.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#36536a"/></marker></defs>
<rect width="760" height="490" rx="16" fill="#f6f9fc"/>
<g font-family="Arial,sans-serif" fill="#173047"><text x="30" y="38" font-size="23">Uniform disk • integrate variable ring radius s</text>
<ellipse cx="325" cy="326" rx="220" ry="78" fill="#d9eff3" stroke="#147d92" stroke-width="3"/>
<ellipse cx="325" cy="326" rx="132" ry="46.8" fill="none" stroke="#da7830" stroke-width="12"/>
<g stroke="#36536a" stroke-width="2" fill="none"><path d="M325 326V70" marker-end="url(#arrow)"/><path d="M325 326H545"/><path d="M325 326L210 367L325 131"/><path d="M451 320L464 300H556"/></g>
<circle cx="325" cy="131" r="6" fill="#173047"/>
<g font-size="19"><text x="345" y="139">P = (0, 0, z), z &gt; 0</text><text x="340" y="82">z-axis</text><text x="339" y="235">z</text><text x="442" y="350">R (fixed)</text><text x="259" y="367">s</text><text x="563" y="307">width ds</text><text x="80" y="217">D = √(s² + z²)</text><text x="447" y="419">0 ≤ s ≤ R</text></g>
<text x="63" y="456" font-size="19">Annulus: dA = 2πs ds   •   dq = σ 2πs ds   •   D varies with s</text>
</g></svg>
