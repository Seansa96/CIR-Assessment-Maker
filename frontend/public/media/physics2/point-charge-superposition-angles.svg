<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Angles for diagonal field vectors</title><desc id="desc">Two right triangles show theta2 from q2 to P and theta3 from q3 to P, with horizontal and vertical legs.</desc>
<rect width="900" height="500" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#18324b" font-size="26"><text x="70" y="55" font-size="32">q2 to P</text><text x="535" y="55" font-size="32">q3 to P</text><text x="95" y="430">horizontal leg: a + c</text><text x="565" y="430">horizontal leg: c</text><text x="75" y="210">vertical leg: b</text><text x="520" y="210">vertical leg: b</text></g>
<g stroke="#18324b" stroke-width="4" fill="none"><path d="M90 360 L400 360 L400 110 Z"/><path d="M540 360 L790 360 L790 110 Z"/><path d="M145 360 A55 55 0 0 1 195 320" stroke="#d45b4c"/><path d="M585 360 A55 55 0 0 1 635 320" stroke="#d45b4c"/><line x1="90" y1="360" x2="400" y2="110" stroke="#d45b4c"/><line x1="540" y1="360" x2="790" y2="110" stroke="#d45b4c"/></g>
<g font-family="Arial, sans-serif" font-size="30" fill="#d45b4c"><text x="155" y="340">θ2</text><text x="600" y="340">θ3</text><text x="250" y="300">tan θ2 = b/(a+c)</text><text x="620" y="300">tan θ3 = b/c</text></g></svg>
