<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Trigonometric substitution map</title><desc id="desc">A flow from y equals x tangent alpha to the transformed differential and integral limits.</desc>
<rect width="1000" height="520" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#18324b"><text x="70" y="75" font-size="32">Make the radical match a trig identity</text><text x="100" y="170" font-size="30">y = x tan(alpha)</text><text x="100" y="225" font-size="30">dy = x sec^2(alpha) d(alpha)</text><text x="100" y="280" font-size="30">x^2 + y^2 = x^2 sec^2(alpha)</text><text x="100" y="335" font-size="30">1/(x^2+y^2)^(3/2) = cos^3(alpha)/x^3</text><path d="M570 170 L690 170" stroke="#d45b4c" stroke-width="5"/><path d="M690 170 l-18 -12 m18 12 l-18 12" stroke="#d45b4c" stroke-width="5"/><text x="715" y="180" font-size="27">limits</text><text x="590" y="265" font-size="27">y: -infinity to +infinity</text><text x="590" y="325" font-size="27">alpha: -pi/2 to +pi/2</text><text x="570" y="405" font-size="25" fill="#1f8a70">E = (k lambda/x)</text><text x="570" y="438" font-size="25" fill="#1f8a70">integral cos(alpha) d(alpha)</text></g></svg>
