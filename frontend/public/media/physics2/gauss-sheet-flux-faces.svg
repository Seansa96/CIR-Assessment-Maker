<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">Flux contributions of a pillbox around an infinite charged sheet</title>
  <desc id="desc">A side view of a charged sheet and a rectangular cross section of a pillbox shows field and outward normals aligned on both flat faces and tangent to the side wall.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1769aa"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1100" height="590" fill="#fbfcfe"/>
  <path d="M520 60V500" stroke="#8a6d00" stroke-width="14"/>
  <g font-family="Arial" font-size="27" fill="#8a6d00"><text x="495" y="120">+</text><text x="495" y="210">+</text><text x="495" y="300">+</text><text x="495" y="390">+</text><text x="495" y="480">+</text></g>
  <rect x="320" y="185" width="400" height="220" fill="#bde5df" fill-opacity="0.5" stroke="#18766b" stroke-width="6"/>
  <g stroke="#1769aa" stroke-width="6" marker-end="url(#blue)">
    <path d="M500 125H150"/><path d="M500 225H150"/><path d="M500 325H150"/><path d="M540 125H890"/><path d="M540 225H890"/><path d="M540 325H890"/>
  </g>
  <g stroke="#c0392b" stroke-width="7" marker-end="url(#red)"><path d="M320 295H215"/><path d="M720 295H825"/><path d="M520 185V90"/></g>
  <g font-family="Arial" font-size="27"><text x="120" y="440">left face: +EA</text><text x="760" y="440">right face: +EA</text><text x="655" y="105">side wall: 0 flux</text><text x="30" y="535">Both face normals point outward, so both face contributions have the same positive sign.</text></g>
  <text x="550" y="575" text-anchor="middle" font-family="Arial" font-size="29">2EA = sigma A / epsilon_0  ->  E = sigma / (2 epsilon_0)</text>
</svg>
