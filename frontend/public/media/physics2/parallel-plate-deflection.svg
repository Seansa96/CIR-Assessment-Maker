<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Proton deflection between parallel capacitor plates</title>
  <desc id="desc">A proton enters horizontally between a positive upper plate and negative lower plate. The uniform electric field and acceleration point downward, and the path curves downward while the horizontal velocity remains constant.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#1769aa"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="900" height="430" fill="#fffdf7"/>
  <rect x="105" y="45" width="600" height="24" rx="5" fill="#d95f59"/>
  <rect x="105" y="360" width="600" height="24" rx="5" fill="#4d78a8"/>
  <text x="115" y="36" font-family="sans-serif" font-size="18" fill="#9b241c">upper plate: +</text>
  <text x="115" y="414" font-family="sans-serif" font-size="18" fill="#244f7d">lower plate: −</text>
  <g stroke="#1769aa" stroke-width="3" marker-end="url(#arrowBlue)">
    <line x1="180" y1="100" x2="180" y2="145"/><line x1="280" y1="100" x2="280" y2="145"/><line x1="380" y1="100" x2="380" y2="145"/><line x1="480" y1="100" x2="480" y2="145"/><line x1="580" y1="100" x2="580" y2="145"/>
    <line x1="180" y1="170" x2="180" y2="215"/><line x1="280" y1="170" x2="280" y2="215"/><line x1="380" y1="170" x2="380" y2="215"/><line x1="480" y1="170" x2="480" y2="215"/><line x1="580" y1="170" x2="580" y2="215"/>
    <line x1="180" y1="240" x2="180" y2="285"/><line x1="280" y1="240" x2="280" y2="285"/><line x1="380" y1="240" x2="380" y2="285"/><line x1="480" y1="240" x2="480" y2="285"/><line x1="580" y1="240" x2="580" y2="285"/>
  </g>
  <path d="M135 220 C260 220 410 225 700 345" fill="none" stroke="#222" stroke-width="4"/>
  <circle cx="135" cy="220" r="12" fill="#f0a202" stroke="#222" stroke-width="2"/><text x="122" y="215" font-family="sans-serif" font-size="14">p+</text>
  <line x1="135" y1="220" x2="230" y2="220" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="145" y="205" font-family="sans-serif" font-size="17" fill="#9b241c">v₀x</text>
  <line x1="390" y1="225" x2="390" y2="285" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="398" y="260" font-family="sans-serif" font-size="17" fill="#9b241c">aᵧ</text>
  <line x1="705" y1="345" x2="790" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="705" y1="345" x2="705" y2="280" stroke="#555" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="795" y="351" font-family="sans-serif" font-size="16">+x</text><text x="712" y="276" font-family="sans-serif" font-size="16">−y</text>
  <text x="730" y="110" font-family="sans-serif" font-size="17" fill="#1769aa">E downward</text>
  <text x="300" y="405" font-family="sans-serif" font-size="16" fill="#333">uniform field region, length L</text>
</svg>
