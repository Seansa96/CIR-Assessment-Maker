<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Maximum, intermediate, and zero electric flux</title>
  <desc id="desc">Three panels compare a flat surface whose area vector is parallel, angled, or perpendicular to a uniform electric field.</desc>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1769aa"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#fbfcfe"/>
  <g font-family="Arial" text-anchor="middle">
    <g transform="translate(0 0)">
      <text x="200" y="45" font-size="30" font-weight="700">Maximum flux</text>
      <g stroke="#1769aa" stroke-width="5" marker-end="url(#b)"><path d="M40 130H350"/><path d="M40 205H350"/><path d="M40 280H350"/></g>
      <path d="M195 90V330" stroke="#8a6d00" stroke-width="12"/>
      <path d="M195 205H330" stroke="#c0392b" stroke-width="7" marker-end="url(#r)"/>
      <text x="200" y="380" font-size="27">θ = 0°</text><text x="200" y="425" font-size="30">Φ = EA</text>
    </g>
    <g transform="translate(400 0)">
      <text x="200" y="45" font-size="30" font-weight="700">Intermediate flux</text>
      <g stroke="#1769aa" stroke-width="5" marker-end="url(#b)"><path d="M40 130H350"/><path d="M40 205H350"/><path d="M40 280H350"/></g>
      <path d="M120 315L280 95" stroke="#8a6d00" stroke-width="12"/>
      <path d="M200 205L305 130" stroke="#c0392b" stroke-width="7" marker-end="url(#r)"/>
      <text x="200" y="380" font-size="27">0° &lt; θ &lt; 90°</text><text x="200" y="425" font-size="30">Φ = EA cos θ</text>
    </g>
    <g transform="translate(800 0)">
      <text x="200" y="45" font-size="30" font-weight="700">Zero flux</text>
      <g stroke="#1769aa" stroke-width="5" marker-end="url(#b)"><path d="M40 130H350"/><path d="M40 205H350"/><path d="M40 280H350"/></g>
      <path d="M80 205H320" stroke="#8a6d00" stroke-width="12"/>
      <path d="M200 205V75" stroke="#c0392b" stroke-width="7" marker-end="url(#r)"/>
      <text x="200" y="380" font-size="27">θ = 90°</text><text x="200" y="425" font-size="30">Φ = 0</text>
    </g>
    <text x="600" y="490" font-size="25" fill="#444">θ is measured between E and the area vector A, not between E and the surface.</text>
  </g>
</svg>
