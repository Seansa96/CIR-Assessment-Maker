<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Curved surface divided into small flux patches</title>
  <desc id="desc">A curved surface is divided into patches. Uniform field arrows cross it, while local outward area vectors make different angles with the field.</desc>
  <defs>
    <marker id="field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1769aa"/></marker>
    <marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="980" height="560" fill="#fbfcfe"/>
  <g stroke="#1769aa" stroke-width="5" marker-end="url(#field)"><path d="M45 120H900"/><path d="M45 210H900"/><path d="M45 300H900"/><path d="M45 390H900"/></g>
  <text x="910" y="215" font-family="Arial" font-size="34" fill="#1769aa">E</text>
  <path d="M390 55C300 150 300 410 390 500C500 435 555 125 390 55Z" fill="#8fd3c7" fill-opacity="0.58" stroke="#18766b" stroke-width="6"/>
  <g fill="none" stroke="#18766b" stroke-width="2"><path d="M350 110C430 145 455 155 500 145"/><path d="M325 205C420 225 480 220 525 200"/><path d="M320 300C415 300 485 285 525 265"/><path d="M335 395C410 375 465 350 500 315"/></g>
  <g stroke="#c0392b" stroke-width="6" marker-end="url(#normal)"><path d="M360 125L265 55"/><path d="M330 260L210 245"/><path d="M350 405L275 485"/><path d="M485 180L590 115"/></g>
  <g font-family="Arial" font-size="27" fill="#c0392b"><text x="205" y="50">dA1</text><text x="145" y="245">dA2</text><text x="220" y="515">dA3</text><text x="600" y="110">dA4</text></g>
  <text x="535" y="330" font-family="Arial" font-size="27">Each patch:</text>
  <text x="535" y="370" font-family="Arial" font-size="22">dPhi_i = E_i dA_i cos(theta_i)</text>
  <text x="490" y="535" text-anchor="middle" font-family="Arial" font-size="27">Phi = sum of patch fluxes -&gt; surface integral</text>
</svg>
