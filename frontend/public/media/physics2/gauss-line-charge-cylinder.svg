<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Cylindrical Gaussian surface around a uniform line charge</title>
  <desc id="desc">A vertical line charge lies on the axis of a cylindrical Gaussian surface. Electric field arrows point radially outward, crossing the curved wall while remaining tangent to the end caps.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1769aa"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#fbfcfe"/>
  <ellipse cx="420" cy="130" rx="165" ry="55" fill="#cdeee8" fill-opacity="0.75" stroke="#18766b" stroke-width="5"/>
  <path d="M255 130V480M585 130V480" stroke="#18766b" stroke-width="5"/>
  <ellipse cx="420" cy="480" rx="165" ry="55" fill="#cdeee8" fill-opacity="0.45" stroke="#18766b" stroke-width="5"/>
  <path d="M420 55V555" stroke="#d08700" stroke-width="9"/>
  <g font-family="Arial" font-size="27" fill="#8b5a00"><text x="650" y="85">uniform line charge</text><text x="650" y="120">density lambda</text></g>
  <g stroke="#1769aa" stroke-width="6" marker-end="url(#blue)">
    <path d="M420 210H770"/><path d="M420 300H770"/><path d="M420 390H770"/>
    <path d="M420 210H75"/><path d="M420 300H75"/><path d="M420 390H75"/>
  </g>
  <text x="785" y="305" font-family="Arial" font-size="33" fill="#1769aa">E(r)</text>
  <path d="M420 300H585" stroke="#444" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="495" y="285" font-family="Arial" font-size="28">r</text>
  <path d="M585 300H700" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
  <text x="710" y="345" font-family="Arial" font-size="26" fill="#c0392b">E parallel dA</text>
  <text x="710" y="380" font-family="Arial" font-size="26">curved wall contributes</text>
  <path d="M420 130V60" stroke="#c0392b" stroke-width="7" marker-end="url(#red)"/>
  <text x="95" y="570" font-family="Arial" font-size="25">End caps: E perpendicular dA, so flux = 0</text>
  <text x="625" y="510" font-family="Arial" font-size="27">curved area = 2 pi r L</text>
  <text x="625" y="550" font-family="Arial" font-size="27">Q_enclosed = lambda L</text>
  <text x="500" y="605" text-anchor="middle" font-family="Arial" font-size="29">E(r) = lambda / (2 pi epsilon_0 r)</text>
</svg>
