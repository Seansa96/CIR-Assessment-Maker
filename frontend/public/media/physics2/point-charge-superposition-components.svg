<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Field-vector components and resultant</title><desc id="desc">At P, E1 is horizontal and E2 and E3 are resolved into horizontal and vertical components; component sums form the resultant.</desc>
<rect width="1000" height="520" fill="#fffdf7"/><g stroke="#18324b" stroke-width="3" fill="none"><line x1="150" y1="400" x2="850" y2="400"/><line x1="500" y1="470" x2="500" y2="70"/><line x1="500" y1="400" x2="770" y2="165" stroke="#d45b4c" stroke-width="6"/><line x1="500" y1="400" x2="735" y2="400" stroke="#3e7cb1" stroke-width="6"/><line x1="735" y1="400" x2="770" y2="165" stroke="#3e7cb1" stroke-dasharray="8 8"/><line x1="500" y1="400" x2="560" y2="115" stroke="#ef9b3f" stroke-width="6"/><line x1="560" y1="115" x2="560" y2="400" stroke="#ef9b3f" stroke-dasharray="8 8"/></g><g font-family="Arial, sans-serif" font-size="28" fill="#18324b"><text x="810" y="430">+x</text><text x="510" y="65">+y</text><text x="530" y="105" fill="#ef9b3f">E2</text><text x="775" y="155" fill="#d45b4c">E3</text><text x="610" y="385" fill="#3e7cb1">E3x</text><text x="745" y="290" fill="#3e7cb1">E3y</text><text x="515" y="250" fill="#ef9b3f">E2y</text><text x="530" y="430" fill="#ef9b3f">E2x</text><text x="70" y="90">EPx = E1 + E2 cos θ2 + E3 cos θ3</text><text x="70" y="135">EPy = E2 sin θ2 + E3 sin θ3</text><text x="70" y="480">EP = EPx i-hat + EPy j-hat</text></g></svg>
