<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Recognizing line, spherical, and cylindrical charge symmetry</title>
  <desc id="desc">Three panels compare a finite and effectively infinite charged rod, a spherically symmetric charged object with concentric Gaussian sphere, and a cylindrically symmetric charged object with a coaxial Gaussian cylinder. Each shows an observation point and the direction of the electric field.</desc>
  <rect width="1200" height="600" rx="24" fill="#f7fafc"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700">Read the source shape, its symmetry, and the matching Gaussian surface</text>
    <g transform="translate(24 72)">
      <rect width="368" height="490" rx="18" fill="#fff" stroke="#9fb3c8" stroke-width="2"/>
      <text x="184" y="38" text-anchor="middle" font-size="22" font-weight="700">LINE CHARGE</text>
      <text x="184" y="66" text-anchor="middle" font-size="15">finite rod → long-line idealization</text>
      <line x1="62" y1="204" x2="306" y2="204" stroke="#42526e" stroke-width="4"/>
      <line x1="116" y1="204" x2="252" y2="204" stroke="#de350b" stroke-width="12" stroke-linecap="round"/>
      <text x="184" y="190" text-anchor="middle" font-size="17" fill="#fff">+ + + + +</text>
      <line x1="184" y1="204" x2="184" y2="118" stroke="#6554c0" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="184" cy="118" r="8" fill="#0052cc"/><text x="200" y="123" font-size="16">P, distance r</text>
      <path d="M90 270 H278" stroke="#8993a4" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="M90 258 V282 M278 258 V282" stroke="#8993a4" stroke-width="2"/>
      <text x="184" y="302" text-anchor="middle" font-size="15">finite ends matter unless length is much greater than r</text>
      <text x="184" y="350" text-anchor="middle" font-size="16" font-weight="700">Cylindrical symmetry only when</text>
      <text x="184" y="376" text-anchor="middle" font-size="15">the rod is effectively infinite and uniform</text>
      <text x="184" y="426" text-anchor="middle" font-size="17">E proportional to 1/r</text>
      <text x="184" y="455" text-anchor="middle" font-size="14">finite rod: integrate each dq; check endpoints</text>
    </g>
    <g transform="translate(416 72)">
      <rect width="368" height="490" rx="18" fill="#fff" stroke="#9fb3c8" stroke-width="2"/>
      <text x="184" y="38" text-anchor="middle" font-size="22" font-weight="700">SPHERICAL SYMMETRY</text>
      <text x="184" y="66" text-anchor="middle" font-size="15">rotation about one center changes nothing</text>
      <circle cx="184" cy="204" r="75" fill="#deebff" stroke="#0052cc" stroke-width="3"/>
      <circle cx="184" cy="204" r="112" fill="none" stroke="#6554c0" stroke-width="3" stroke-dasharray="9 6"/>
      <circle cx="184" cy="204" r="5" fill="#172b4d"/>
      <circle cx="296" cy="204" r="7" fill="#0052cc"/><text x="306" y="210" font-size="15">P</text>
      <path d="M184 184 V118 M184 224 V290 M164 204 H98 M204 204 H270" stroke="#de350b" stroke-width="3"/>
      <path d="M184 118 l-7 12 M184 118 l7 12 M184 290 l-7-12 M184 290 l7-12 M98 204 l12-7 M98 204 l12 7 M270 204 l-12-7 M270 204 l-12 7" fill="none" stroke="#de350b" stroke-width="3"/>
      <text x="184" y="340" text-anchor="middle" font-size="16" font-weight="700">Gaussian surface: concentric sphere</text>
      <text x="184" y="378" text-anchor="middle" font-size="17">outside: E proportional to 1/r^2</text>
      <text x="184" y="410" text-anchor="middle" font-size="15">uniform solid sphere inside: E proportional to r</text>
      <text x="184" y="455" text-anchor="middle" font-size="14">density may vary with radius, not direction</text>
    </g>
    <g transform="translate(808 72)">
      <rect width="368" height="490" rx="18" fill="#fff" stroke="#9fb3c8" stroke-width="2"/>
      <text x="184" y="38" text-anchor="middle" font-size="22" font-weight="700">CYLINDRICAL SYMMETRY</text>
      <text x="184" y="66" text-anchor="middle" font-size="15">translation along axis + rotation about axis</text>
      <ellipse cx="184" cy="140" rx="70" ry="22" fill="#e3fcef" stroke="#00875a" stroke-width="3"/>
      <path d="M114 140 V270 M254 140 V270" stroke="#00875a" stroke-width="3"/>
      <ellipse cx="184" cy="270" rx="70" ry="22" fill="#e3fcef" stroke="#00875a" stroke-width="3"/>
      <line x1="184" y1="108" x2="184" y2="300" stroke="#344563" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="130" y="170" font-size="15" fill="#006644">+ +</text>
      <text x="178" y="170" font-size="15" fill="#006644">+ +</text>
      <text x="220" y="170" font-size="15" fill="#006644">+ +</text>
      <ellipse cx="184" cy="140" rx="104" ry="35" fill="none" stroke="#6554c0" stroke-width="3" stroke-dasharray="8 6"/>
      <path d="M288 140 V270" stroke="#6554c0" stroke-width="3" stroke-dasharray="8 6"/>
      <ellipse cx="184" cy="270" rx="104" ry="35" fill="none" stroke="#6554c0" stroke-width="3" stroke-dasharray="8 6"/>
      <circle cx="288" cy="205" r="7" fill="#0052cc"/><text x="301" y="211" font-size="15">P</text>
      <text x="184" y="340" text-anchor="middle" font-size="16" font-weight="700">Gaussian surface: coaxial cylinder</text>
      <text x="184" y="378" text-anchor="middle" font-size="16">long line / shell outside: E proportional to 1/r</text>
      <text x="184" y="410" text-anchor="middle" font-size="15">uniform solid cylinder inside: E proportional to r</text>
      <text x="184" y="455" text-anchor="middle" font-size="14">finite ends or uneven density break the model</text>
    </g>
  </g>
</svg>
