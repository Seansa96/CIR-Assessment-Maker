<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" role="img" aria-labelledby="title desc">
  <title id="title">Exit velocity components and deflection angle</title>
  <desc id="desc">A right triangle shows the exit velocity as the resultant of a horizontal component and a downward vertical component. The angle below the positive x-axis is found with tangent.</desc>
  <rect width="620" height="390" fill="#f7fbff"/>
  <line x1="105" y1="300" x2="510" y2="300" stroke="#333" stroke-width="3"/>
  <line x1="105" y1="300" x2="405" y2="110" stroke="#c0392b" stroke-width="5"/>
  <line x1="405" y1="110" x2="405" y2="300" stroke="#1769aa" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M160 300 A55 55 0 0 0 158 267" fill="none" stroke="#333" stroke-width="2"/>
  <text x="168" y="280" font-family="sans-serif" font-size="18">θ</text>
  <text x="225" y="325" font-family="sans-serif" font-size="18" fill="#333">vₓ = 2.00×10⁶ m/s</text>
  <text x="412" y="214" font-family="sans-serif" font-size="18" fill="#1769aa">|vᵧ|</text>
  <text x="270" y="180" font-family="sans-serif" font-size="18" fill="#9b241c">v_exit</text>
  <text x="92" y="350" font-family="sans-serif" font-size="17">tan θ = |vᵧ| / vₓ</text>
  <text x="390" y="350" font-family="sans-serif" font-size="17">θ below +x</text>
</svg>
