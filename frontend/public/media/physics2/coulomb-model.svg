<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Coulomb force geometry</title><desc id="desc">Two signed point charges lie on a horizontal line with a separation vector and equal opposite force arrows.</desc><rect width="640" height="320" fill="#f6f9fc"/><text x="24" y="38" font-size="24" fill="#173047">Point charges: line of centers and separation</text><line x1="120" y1="170" x2="520" y2="170" stroke="#36536a" stroke-width="3"/><circle cx="180" cy="170" r="28" fill="#2d83a5"/><circle cx="460" cy="170" r="28" fill="#da7830"/><text x="171" y="179" fill="white" font-size="24">+</text><text x="451" y="179" fill="white" font-size="24">−</text><line x1="212" y1="125" x2="428" y2="125" stroke="#173047" stroke-width="2"/><text x="302" y="115" fill="#173047" font-size="20">r</text><line x1="210" y1="215" x2="125" y2="215" stroke="#147d92" stroke-width="5"/><line x1="430" y1="215" x2="515" y2="215" stroke="#147d92" stroke-width="5"/><text x="95" y="255" fill="#173047" font-size="18">force on +</text><text x="475" y="255" fill="#173047" font-size="18">force on −</text></svg>
