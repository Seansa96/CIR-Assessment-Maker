<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Infinite line charge geometry</title><desc id="desc">A vertical infinite line charge on the y axis, point P a distance x away, and paired source elements above and below the x axis.</desc>
<rect width="900" height="560" fill="#fffdf7"/><g stroke="#18324b" stroke-width="4" fill="none"><line x1="180" y1="55" x2="180" y2="505"/><line x1="180" y1="280" x2="790" y2="280"/><line x1="180" y1="130" x2="700" y2="280" stroke="#d45b4c"/><line x1="180" y1="430" x2="700" y2="280" stroke="#d45b4c"/><line x1="700" y1="130" x2="700" y2="280" stroke-dasharray="9 9"/><line x1="700" y1="430" x2="700" y2="280" stroke-dasharray="9 9"/><path d="M260 280 A80 80 0 0 0 255 257" stroke="#ef9b3f"/><path d="M260 280 A80 80 0 0 1 255 303" stroke="#ef9b3f"/></g><g fill="#d45b4c" stroke="#7c2d24" stroke-width="2"><circle cx="180" cy="130" r="10"/><circle cx="180" cy="430" r="10"/><circle cx="180" cy="195" r="10"/><circle cx="180" cy="365" r="10"/></g><circle cx="700" cy="280" r="13" fill="#1f8a70"/><g font-family="Arial, sans-serif" font-size="28" fill="#18324b"><text x="125" y="45">infinite line of charge</text><text x="150" y="270">y=0</text><text x="715" y="272">P</text><text x="430" y="315">x</text><text x="390" y="170">r = sqrt(x^2 + y^2)</text><text x="245" y="245" fill="#ef9b3f">alpha</text><text x="248" y="330" fill="#ef9b3f">alpha</text><text x="195" y="125">dq</text><text x="195" y="470">paired dq</text><text x="520" y="125" fill="#d45b4c">dE</text><text x="520" y="455" fill="#d45b4c">dE</text><text x="655" y="350" font-size="22">only x-components</text><text x="655" y="378" font-size="22">survive</text></g></svg>
