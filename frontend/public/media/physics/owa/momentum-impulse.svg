<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">Impulse changes a cart's momentum</title><desc id="desc">A force arrow acts on a cart during a time interval, with an impulse equals change in momentum equation.</desc><rect width="720" height="280" fill="#f7fbff"/><path d="M70 220H650" stroke="#29435c" stroke-width="5"/><rect x="300" y="155" width="125" height="60" rx="8" fill="#4c8eda" stroke="#173b63" stroke-width="4"/><circle cx="330" cy="225" r="14" fill="#173b63"/><circle cx="395" cy="225" r="14" fill="#173b63"/><path d="M130 125H282" stroke="#e16b2f" stroke-width="12"/><path d="M282 125l-28-20v40z" fill="#e16b2f"/><text x="150" y="105" font-family="Arial" font-size="25" fill="#9b3e13">net force during Δt</text><path d="M435 185H580" stroke="#257345" stroke-width="8"/><path d="M580 185l-25-18v36z" fill="#257345"/><text x="435" y="165" font-family="Arial" font-size="23" fill="#1c6038">momentum changes</text><text x="210" y="55" font-family="Arial" font-size="31" font-weight="bold" fill="#173b63">J = FΔt = Δp</text></svg>
