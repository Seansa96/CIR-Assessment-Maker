<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Pulse reflection at string boundaries</title><desc id="d">Top panel shows an upward pulse reflecting inverted at a fixed wall. Bottom panel shows an upward pulse reflecting upright at a free ring.</desc><style>text{font-family:Arial;font-size:18px;fill:#162c46}.s{fill:none;stroke:#24699b;stroke-width:5}.p{fill:none;stroke:#b34242;stroke-width:5}.wall{stroke:#333;stroke-width:10}</style><text x="30" y="30">fixed boundary: reflected pulse inverts</text><path class="s" d="M30 105H630"/><path class="p" d="M140 105q40-70 80 0"/><line class="wall" x1="650" y1="55" x2="650" y2="145"/><path class="p" d="M430 105q40 70 80 0"/><text x="30" y="180">free boundary: reflected pulse does not invert</text><path class="s" d="M30 255H630"/><path class="p" d="M140 255q40-70 80 0"/><circle cx="650" cy="255" r="14" fill="none" stroke="#333" stroke-width="5"/><path class="p" d="M430 255q40-70 80 0"/></svg>
