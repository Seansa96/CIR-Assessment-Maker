<title id="title">Displacement and derivative phase quadrature</title><desc id="desc">Displacement sine and transverse velocity cosine are shifted by a quarter cycle.</desc>
<rect width="900" height="420" fill="#f7fbff"/><text x="48" y="45" font-family="Arial" font-size="28" fill="#102a43">Time derivatives shift the phase</text>
<path d="M75 220H840" stroke="#486581" stroke-width="3"/><path d="M85 220 C135 70 185 70 235 220 S335 370 385 220 S485 70 535 220 S635 370 685 220 S785 70 835 220" fill="none" stroke="#1976d2" stroke-width="6"/>
<path d="M85 120 C135 120 185 270 235 270 S335 120 385 120 S485 270 535 270 S635 120 685 120 S785 270 835 270" fill="none" stroke="#e76f51" stroke-width="6" stroke-dasharray="12 7"/>
<text x="90" y="95" font-family="Arial" font-size="20" fill="#155a9c">y = A sin Φ</text><text x="90" y="330" font-family="Arial" font-size="20" fill="#b94b2c">vᵧ = ∂y/∂t = −Aω cos Φ</text><text x="600" y="385" font-family="Arial" font-size="19" fill="#486581">quarter-cycle phase shift</text>
