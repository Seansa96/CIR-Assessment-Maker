<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Elastic loading modes</title><desc id="desc">Three panels show axial tension and compression, uniform pressure, and shear deformation.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#162c46;font-size:22px}.shape{fill:#d9ecff;stroke:#24699b;stroke-width:4}.arrow{stroke:#b34242;stroke-width:5;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#b34242"/></marker></defs>
  <text x="70" y="38">Axial loading: Young's modulus</text><rect class="shape" x="145" y="105" width="100" height="130"/><line class="arrow" x1="55" y1="170" x2="140" y2="170"/><line class="arrow" x1="335" y1="170" x2="250" y2="170"/>
  <text x="360" y="38">Uniform pressure: bulk modulus</text><circle class="shape" cx="510" cy="170" r="62"/><line class="arrow" x1="510" y1="65" x2="510" y2="103"/><line class="arrow" x1="510" y1="275" x2="510" y2="237"/><line class="arrow" x1="400" y1="170" x2="443" y2="170"/><line class="arrow" x1="620" y1="170" x2="577" y2="170"/>
  <text x="650" y="38">Shear modulus</text><path class="shape" d="M700 235 L810 235 L845 105 L735 105Z"/><line class="arrow" x1="700" y1="82" x2="770" y2="82"/><text x="150" y="275">length</text><text x="473" y="275">volume</text><text x="745" y="275">shape</text>
</svg>
