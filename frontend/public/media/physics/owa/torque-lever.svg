<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">Torque depends on force and lever arm</title><desc id="desc">A force acts perpendicular to a lever about a pivot.</desc><rect width="720" height="280" fill="#fffaf4"/><path d="M130 185H570" stroke="#70451e" stroke-width="15" stroke-linecap="round"/><path d="M185 185l-35 60h70z" fill="#29435c"/><circle cx="185" cy="185" r="11" fill="#e16b2f"/><path d="M510 95V165" stroke="#257345" stroke-width="11"/><path d="M510 165l-24-29h48z" fill="#257345"/><path d="M185 220H510" stroke="#7d4db3" stroke-width="4" stroke-dasharray="10 8"/><text x="310" y="247" font-family="Arial" font-size="24" fill="#7d4db3">lever arm r</text><text x="530" y="125" font-family="Arial" font-size="25" fill="#257345">F</text><text x="250" y="65" font-family="Arial" font-size="31" font-weight="bold" fill="#173b63">τ = rF sin φ</text></svg>
