<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Mass spring calculation map</title><desc id="desc">A calculation map connects mass and spring constant to angular frequency, period, frequency, maximum speed, and maximum acceleration.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#0f766e"/></marker></defs><style>.b{fill:#ecfeff;stroke:#0f766e;stroke-width:3}.arrow{stroke:#0f766e;stroke-width:4;marker-end:url(#a)}text{font-family:Arial,sans-serif;fill:#102a43}.h{font-size:24px;font-weight:700}.s{font-size:19px}</style>
  <rect width="960" height="380" rx="24" fill="#f8fafc"/><text x="38" y="48" class="h">Choose the relation from the quantities supplied</text><rect class="b" x="45" y="125" width="190" height="100" rx="14"/><text x="89" y="165" class="h">m and k</text><text x="73" y="200" class="s">mass; stiffness</text><line class="arrow" x1="240" y1="175" x2="350" y2="175"/><rect class="b" x="360" y="125" width="240" height="100" rx="14"/><text x="405" y="165" class="h">ω = √(k/m)</text><text x="403" y="200" class="s">angular frequency</text><line class="arrow" x1="605" y1="150" x2="710" y2="104"/><line class="arrow" x1="605" y1="175" x2="710" y2="175"/><line class="arrow" x1="605" y1="200" x2="710" y2="250"/><rect class="b" x="720" y="65" width="190" height="72" rx="14"/><text x="758" y="109" class="h">T = 2π/ω</text><rect class="b" x="720" y="142" width="190" height="72" rx="14"/><text x="774" y="186" class="h">f = 1/T</text><rect class="b" x="720" y="219" width="190" height="72" rx="14"/><text x="751" y="263" class="h">vₘₐₓ = Aω</text><rect class="b" x="360" y="270" width="240" height="68" rx="14"/><text x="405" y="313" class="h">aₘₐₓ = Aω²</text><line class="arrow" x1="470" y1="230" x2="470" y2="264"/><text x="54" y="350" class="s">Amplitude A is needed only for maximum speed and maximum acceleration.</text>
</svg>
