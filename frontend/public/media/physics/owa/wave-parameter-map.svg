<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Wave parameter map</title><desc id="desc">A sinusoid labels amplitude, wavelength, phase, wave number, angular frequency, and positive-x travel.</desc>
<rect width="900" height="420" fill="#f7fbff"/><text x="48" y="45" font-family="Arial" font-size="28" fill="#102a43">Read y = A sin(kx − ωt + φ)</text>
<path d="M75 245H840M95 245 C145 95 205 95 255 245 S365 395 425 245 S535 95 595 245 S705 395 765 245" fill="none" stroke="#1976d2" stroke-width="7"/>
<path d="M155 245V105M155 105H205" fill="none" stroke="#e76f51" stroke-width="4"/><text x="105" y="88" font-family="Arial" font-size="20" fill="#c05621">A</text>
<path d="M155 65H535" stroke="#2a9d8f" stroke-width="4" marker-end="url(#arrow)"/><text x="300" y="58" font-family="Arial" font-size="20" fill="#2a7f62">λ = 2π/k</text>
<path d="M680 345H815" stroke="#7b61a8" stroke-width="5" marker-end="url(#arrow)"/><text x="610" y="380" font-family="Arial" font-size="20" fill="#5b4384">−ωt → +x travel</text>
<text x="80" y="395" font-family="Arial" font-size="19" fill="#486581">k: rad/m · ω: rad/s · φ: initial phase</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="currentColor"/></marker></defs>
</svg>
