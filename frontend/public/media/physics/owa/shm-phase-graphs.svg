<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Position velocity and acceleration in simple harmonic motion</title><desc id="desc">Aligned graphs show position, velocity, and acceleration over one period, with the equilibrium and turning points labeled.</desc>
  <rect width="960" height="500" rx="24" fill="#f8fafc"/><text x="38" y="47" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">One cycle: position, velocity, and acceleration are phase-related</text>
  <g stroke="#94a3b8" stroke-width="2"><line x1="125" y1="125" x2="900" y2="125"/><line x1="125" y1="245" x2="900" y2="245"/><line x1="125" y1="365" x2="900" y2="365"/><line x1="125" y1="85" x2="125" y2="405"/><line x1="318" y1="85" x2="318" y2="405" stroke-dasharray="5 7"/><line x1="512" y1="85" x2="512" y2="405" stroke-dasharray="5 7"/><line x1="706" y1="85" x2="706" y2="405" stroke-dasharray="5 7"/><line x1="900" y1="85" x2="900" y2="405"/></g>
  <path d="M125 85 C222 85 222 165 318 165 S415 85 512 85 S609 165 706 165 S803 85 900 85" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M125 245 C222 165 222 325 318 245 S415 165 512 245 S609 325 706 245 S803 165 900 245" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M125 405 C222 405 222 325 318 325 S415 405 512 405 S609 325 706 325 S803 405 900 405" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="45" y="132" font-family="Arial" font-size="22" fill="#2563eb">x(t)</text><text x="43" y="252" font-family="Arial" font-size="22" fill="#7c3aed">v(t)</text><text x="43" y="372" font-family="Arial" font-size="22" fill="#dc2626">a(t)</text><text x="116" y="440" font-family="Arial" font-size="18" fill="#334e68">0</text><text x="302" y="440" font-family="Arial" font-size="18" fill="#334e68">T/4</text><text x="500" y="440" font-family="Arial" font-size="18" fill="#334e68">T/2</text><text x="690" y="440" font-family="Arial" font-size="18" fill="#334e68">3T/4</text><text x="892" y="440" font-family="Arial" font-size="18" fill="#334e68">T</text>
  <text x="136" y="72" font-family="Arial" font-size="17" fill="#334e68">turning point: v = 0</text><text x="333" y="191" font-family="Arial" font-size="17" fill="#334e68">equilibrium: |v| maximum</text><text x="345" y="486" font-family="Arial" font-size="18" fill="#334e68">x = A cos(ωt + φ), v = −Aω sin(ωt + φ), a = −ω²x</text>
</svg>
