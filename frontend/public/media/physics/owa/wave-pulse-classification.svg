<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Localized sign-changing pulse</title><desc id="desc">A rational pulse crosses zero, has a negative lobe on the left and a positive lobe on the right, and decays toward zero.</desc>
<rect width="900" height="420" fill="#f7fbff"/><text x="48" y="48" font-family="Arial" font-size="28" fill="#102a43">Localized pulse: sign and decay</text>
<path d="M80 270H840M450 90V350" stroke="#486581" stroke-width="3"/><path d="M90 270 C170 270 190 330 270 318 C335 308 370 274 410 270 C470 264 500 180 570 164 C650 145 705 246 830 270" fill="none" stroke="#1976d2" stroke-width="7"/>
<circle cx="450" cy="270" r="7" fill="#e76f51"/><text x="420" y="300" font-family="Arial" font-size="20" fill="#c05621">zero at x=0</text>
<text x="105" y="345" font-family="Arial" font-size="21" fill="#334e68">negative lobe</text><text x="610" y="125" font-family="Arial" font-size="21" fill="#2a7f62">positive lobe</text><text x="610" y="385" font-family="Arial" font-size="19" fill="#486581">tails approach equilibrium</text>
</svg>
