<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">Rotational variables on a wheel</title><desc id="desc">A wheel shows angular displacement, angular velocity, and tangential speed.</desc><rect width="720" height="280" fill="#f7fbff"/><circle cx="300" cy="145" r="92" fill="#dcecff" stroke="#173b63" stroke-width="5"/><circle cx="300" cy="145" r="8" fill="#173b63"/><path d="M300 145L365 82" stroke="#e16b2f" stroke-width="7"/><path d="M405 145A105 105 0 0 0 345 50" fill="none" stroke="#257345" stroke-width="8"/><path d="M345 50l-25 5 16 19z" fill="#257345"/><path d="M365 82l52-42" stroke="#7d4db3" stroke-width="7"/><path d="M417 40l-27 5 16 20z" fill="#7d4db3"/><text x="440" y="55" font-family="Arial" font-size="25" fill="#7d4db3">v = rω</text><text x="430" y="135" font-family="Arial" font-size="25" fill="#257345">ω, α</text><text x="120" y="255" font-family="Arial" font-size="25" fill="#e16b2f">angular displacement θ</text></svg>
