<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Traveling profile and wave equation verification</title><desc id="desc">A profile f(x-vt) translates right while its second derivatives satisfy the linear wave equation.</desc>
<rect width="900" height="420" fill="#f7fbff"/><text x="48" y="45" font-family="Arial" font-size="28" fill="#102a43">Verify y = f(x − vt)</text>
<path d="M75 275H840" stroke="#486581" stroke-width="3"/><path d="M135 275 C185 275 190 130 250 130 C310 130 315 275 365 275" fill="none" stroke="#1976d2" stroke-width="7"/><path d="M350 110H620" stroke="#2a9d8f" stroke-width="5" marker-end="url(#arrow)"/><text x="440" y="95" font-family="Arial" font-size="21" fill="#2a7f62">profile travels at v</text>
<text x="95" y="350" font-family="Arial" font-size="22" fill="#334e68">yₓₓ = f″(u)</text><text x="350" y="350" font-family="Arial" font-size="22" fill="#334e68">yₜₜ = v² f″(u)</text><text x="640" y="350" font-family="Arial" font-size="22" fill="#334e68">yₓₓ = yₜₜ/v²</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2a9d8f"/></marker></defs>
</svg>
