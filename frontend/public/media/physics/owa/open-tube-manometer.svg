<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-labelledby="t d"><title id="t">Open-tube manometer</title><desc id="d">A U-shaped tube has gas pressure on the left and atmosphere on the right. The liquid is lower on the gas side and the vertical difference is h.</desc><style>text{font-family:Arial;font-size:21px;fill:#162c46}.tube{fill:none;stroke:#24699b;stroke-width:16}.liquid{fill:none;stroke:#5bb8e6;stroke-width:13}.line{stroke:#b34242;stroke-width:3;stroke-dasharray:7 6}</style><path class="tube" d="M180 55V245Q180 290 245 290H455Q520 290 520 245V55"/><path class="liquid" d="M180 190V245Q180 275 245 275H455Q520 275 520 210"/><line class="line" x1="545" y1="190" x2="640" y2="190"/><line class="line" x1="545" y1="210" x2="640" y2="210"/><path d="M610 194v12m-5-7 5 7 5-7" stroke="#b34242" stroke-width="3" fill="none"/><text x="45" y="48">gas pressure</text><text x="470" y="48">atmosphere</text><text x="645" y="205">h</text><text x="230" y="318">manometer liquid</text></svg>
