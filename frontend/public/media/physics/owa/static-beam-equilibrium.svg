<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Beam in static equilibrium</title><desc id="d">A horizontal beam hinged at left is supported by an angled cable and carries its own weight and a hanging load.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b34242"/></marker></defs><style>text{font-family:Arial;font-size:19px;fill:#162c46}.b{stroke:#24699b;stroke-width:14}.f{stroke:#b34242;stroke-width:4;marker-end:url(#a)}</style><line class="b" x1="100" y1="160" x2="640" y2="160"/><circle cx="100" cy="160" r="12" fill="#24699b"/><line class="f" x1="520" y1="60" x2="520" y2="145"/><line class="f" x1="630" y1="250" x2="630" y2="175"/><line class="f" x1="430" y1="245" x2="430" y2="175"/><line class="f" x1="290" y1="55" x2="500" y2="145"/><text x="75" y="195">pivot</text><text x="500" y="50">cable tension</text><text x="400" y="275">beam weight</text><text x="610" y="275">load</text></svg>
