<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Mass-spring simple harmonic motion states</title><desc id="desc">A block on a frictionless horizontal track is shown at negative amplitude, equilibrium, and positive amplitude with labeled displacement and restoring force directions.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#9a3412"/></marker></defs>
  <rect width="960" height="460" rx="24" fill="#f8fafc"/><text x="40" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#102a43">Mass–spring states during one oscillation</text>
  <line x1="72" y1="320" x2="900" y2="320" stroke="#334e68" stroke-width="5"/><line x1="480" y1="110" x2="480" y2="350" stroke="#0f766e" stroke-width="3" stroke-dasharray="9 8"/><text x="425" y="378" font-family="Arial, sans-serif" font-size="20" fill="#0f766e">equilibrium x = 0</text>
  <path d="M70 180 h25 l12 -20 l24 40 l24 -40 l24 40 l24 -40 l24 40 l24 -40 l24 40 h28" fill="none" stroke="#2563eb" stroke-width="6"/><rect x="326" y="145" width="88" height="70" rx="7" fill="#f59e0b" stroke="#92400e" stroke-width="3"/><text x="350" y="187" font-family="Arial" font-size="24" font-weight="700" fill="#422006">m</text><text x="275" y="120" font-family="Arial" font-size="19" fill="#102a43">x = −A</text><line x1="370" y1="242" x2="458" y2="242" stroke="#9a3412" stroke-width="4" marker-end="url(#arrow)"/><text x="303" y="270" font-family="Arial" font-size="18" fill="#9a3412">Fₛ toward equilibrium</text><text x="305" y="412" font-family="Arial" font-size="18" fill="#102a43">v = 0, |a| maximum</text>
  <path d="M70 180 h70 l12 -20 l24 40 l24 -40 l24 40 l24 -40 l24 40 l24 -40 l24 40 h28" fill="none" stroke="#2563eb" stroke-width="6"/><rect x="436" y="145" width="88" height="70" rx="7" fill="#f59e0b" stroke="#92400e" stroke-width="3"/><text x="460" y="187" font-family="Arial" font-size="24" font-weight="700" fill="#422006">m</text><text x="438" y="120" font-family="Arial" font-size="19" fill="#102a43">x = 0</text><line x1="450" y1="242" x2="510" y2="242" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/><text x="390" y="270" font-family="Arial" font-size="18" fill="#7c3aed">|v| maximum; a = 0</text><text x="407" y="412" font-family="Arial" font-size="18" fill="#102a43">spring neither stretched nor compressed</text>
  <path d="M70 180 h120 l12 -20 l24 40 l24 -40 l24 40 l24 -40 l24 40 l24 -40 l24 40 h28" fill="none" stroke="#2563eb" stroke-width="6"/><rect x="546" y="145" width="88" height="70" rx="7" fill="#f59e0b" stroke="#92400e" stroke-width="3"/><text x="570" y="187" font-family="Arial" font-size="24" font-weight="700" fill="#422006">m</text><text x="585" y="120" font-family="Arial" font-size="19" fill="#102a43">x = +A</text><line x1="590" y1="242" x2="502" y2="242" stroke="#9a3412" stroke-width="4" marker-end="url(#arrow)"/><text x="552" y="270" font-family="Arial" font-size="18" fill="#9a3412">Fₛ toward equilibrium</text><text x="558" y="412" font-family="Arial" font-size="18" fill="#102a43">v = 0, |a| maximum</text>
  <line x1="370" y1="95" x2="590" y2="95" stroke="#0f766e" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="455" y="86" font-family="Arial" font-size="20" fill="#0f766e">2A</text>
</svg>
