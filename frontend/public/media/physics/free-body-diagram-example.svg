<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
  <title id="title">Free-body diagram example</title>
  <desc id="desc">A block on a surface with normal force up, weight down, applied force right, and friction left.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#334155">Free-body diagram: isolate one object</text>
  <line x1="160" y1="395" x2="660" y2="395" stroke="#64748b" stroke-width="5"/>
  <rect x="345" y="285" width="130" height="110" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
  <circle cx="410" cy="340" r="8" fill="#334155"/>
  <line x1="410" y1="340" x2="410" y2="165" stroke="#155e75" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <line x1="410" y1="340" x2="410" y2="500" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <line x1="410" y1="340" x2="600" y2="340" stroke="#155e75" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <line x1="410" y1="340" x2="235" y2="340" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="424" y="182" font-family="Arial, sans-serif" font-size="24" fill="#155e75">N</text>
  <text x="424" y="486" font-family="Arial, sans-serif" font-size="24" fill="#b91c1c">mg</text>
  <text x="565" y="322" font-family="Arial, sans-serif" font-size="24" fill="#155e75">F applied</text>
  <text x="188" y="322" font-family="Arial, sans-serif" font-size="24" fill="#b91c1c">friction</text>
</svg>
