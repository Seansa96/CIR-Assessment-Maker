<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Inclined-plane Atwood machine without friction</title>
  <desc id="desc">A block on a frictionless incline connected over a pulley to a hanging mass. Forces and motion directions are labeled.</desc>
  <rect width="760" height="440" fill="#f7f9f9"/>
  <polygon points="96,360 470,360 470,160" fill="#e8ecec" stroke="#546168" stroke-width="4"/>
  <line x1="96" y1="360" x2="470" y2="160" stroke="#546168" stroke-width="5"/>
  <text x="368" y="346" font-family="Arial, sans-serif" font-size="22" fill="#546168">35 deg</text>
  <circle cx="520" cy="142" r="38" fill="#e7eeee" stroke="#415057" stroke-width="5"/>
  <line x1="520" y1="104" x2="520" y2="66" stroke="#415057" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(250 254) rotate(-28)">
    <rect x="-52" y="-34" width="104" height="68" rx="8" fill="#dbe9e7" stroke="#14776f" stroke-width="4"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#143c3a">m2 = 6 kg</text>
  </g>
  <path d="M292 232 L504 142 L520 142 L520 244" fill="none" stroke="#263238" stroke-width="5"/>
  <rect x="474" y="244" width="92" height="82" rx="8" fill="#f0ded6" stroke="#9d3b32" stroke-width="4"/>
  <text x="520" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b231e">m1 = 2 kg</text>
  <line x1="226" y1="268" x2="290" y2="234" stroke="#9d3b32" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="235" y="222" font-family="Arial, sans-serif" font-size="20" fill="#9d3b32">m2g sin(theta)</text>
  <line x1="292" y1="232" x2="350" y2="202" stroke="#0f7770" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="347" y="190" font-family="Arial, sans-serif" font-size="20" fill="#0f7770">T</text>
  <line x1="520" y1="238" x2="520" y2="184" stroke="#0f7770" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="534" y="210" font-family="Arial, sans-serif" font-size="20" fill="#0f7770">T</text>
  <line x1="520" y1="332" x2="520" y2="394" stroke="#263238" stroke-width="5" marker-end="url(#arrowDark)"/>
  <text x="534" y="370" font-family="Arial, sans-serif" font-size="20" fill="#263238">m1g</text>
  <line x1="158" y1="316" x2="236" y2="274" stroke="#9d3b32" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="102" y="314" font-family="Arial, sans-serif" font-size="19" fill="#9d3b32">motion down slope</text>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Driving force: m2g sin(theta) minus m1g</text>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#263238"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f7770"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9d3b32"/></marker>
  </defs>
</svg>
