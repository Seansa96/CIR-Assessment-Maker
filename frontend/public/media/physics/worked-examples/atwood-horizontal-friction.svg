<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Half-Atwood machine on a rough horizontal table</title>
  <desc id="desc">A block on a rough horizontal table is connected to a hanging mass. Kinetic friction opposes the block's motion toward the pulley.</desc>
  <rect width="760" height="420" fill="#f7f9f9"/>
  <rect x="70" y="258" width="480" height="34" fill="#d9dedf" stroke="#546168" stroke-width="3"/>
  <path d="M90 292 L530 292" stroke="#9b7b53" stroke-width="6" stroke-dasharray="10 10"/>
  <rect x="172" y="180" width="126" height="78" rx="8" fill="#dbe9e7" stroke="#14776f" stroke-width="4"/>
  <text x="235" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#143c3a">m2 = 8 kg</text>
  <circle cx="586" cy="184" r="38" fill="#e7eeee" stroke="#415057" stroke-width="5"/>
  <line x1="586" y1="146" x2="586" y2="98" stroke="#415057" stroke-width="7" stroke-linecap="round"/>
  <path d="M298 216 L586 184 L586 260" fill="none" stroke="#263238" stroke-width="5"/>
  <rect x="540" y="260" width="92" height="82" rx="8" fill="#f0ded6" stroke="#9d3b32" stroke-width="4"/>
  <text x="586" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b231e">m1 = 5 kg</text>
  <line x1="306" y1="216" x2="382" y2="216" stroke="#0f7770" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="334" y="202" font-family="Arial, sans-serif" font-size="20" fill="#0f7770">T</text>
  <line x1="170" y1="216" x2="112" y2="216" stroke="#b45c28" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <text x="118" y="202" font-family="Arial, sans-serif" font-size="20" fill="#b45c28">fk</text>
  <line x1="235" y1="174" x2="235" y2="120" stroke="#263238" stroke-width="5" marker-end="url(#arrowDark)"/>
  <text x="250" y="146" font-family="Arial, sans-serif" font-size="20" fill="#263238">N</text>
  <line x1="235" y1="262" x2="235" y2="324" stroke="#263238" stroke-width="5" marker-end="url(#arrowDark)"/>
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="20" fill="#263238">m2g</text>
  <line x1="586" y1="254" x2="586" y2="204" stroke="#0f7770" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <line x1="586" y1="348" x2="586" y2="398" stroke="#263238" stroke-width="5" marker-end="url(#arrowDark)"/>
  <text x="600" y="382" font-family="Arial, sans-serif" font-size="20" fill="#263238">m1g</text>
  <text x="380" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Friction reduces the hanging mass's driving force</text>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#263238"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f7770"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45c28"/></marker>
  </defs>
</svg>
