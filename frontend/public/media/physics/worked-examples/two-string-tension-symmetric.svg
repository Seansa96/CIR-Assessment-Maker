<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Symmetric two-string tension</title>
  <desc id="desc">A symmetric two-string hanging mass setup showing equal angles, equal tensions, canceling horizontal components, and vertical support.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#334155">Symmetric suspension: equal angles, equal tensions</text>
  <line x1="155" y1="74" x2="745" y2="74" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <circle cx="270" cy="74" r="8" fill="#334155"/>
  <circle cx="630" cy="74" r="8" fill="#334155"/>
  <circle cx="450" cy="250" r="10" fill="#0f766e"/>
  <line x1="270" y1="74" x2="450" y2="250" stroke="#155e75" stroke-width="6" stroke-linecap="round"/>
  <line x1="630" y1="74" x2="450" y2="250" stroke="#155e75" stroke-width="6" stroke-linecap="round"/>
  <line x1="450" y1="250" x2="450" y2="382" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <rect x="395" y="382" width="110" height="80" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
  <text x="450" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#334155">m</text>
  <line x1="450" y1="250" x2="326" y2="129" stroke="#155e75" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="250" x2="574" y2="129" stroke="#155e75" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="250" x2="450" y2="342" stroke="#b91c1c" stroke-width="4" marker-end="url(#redArrow)"/>
  <line x1="450" y1="250" x2="326" y2="250" stroke="#047857" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <line x1="450" y1="250" x2="574" y2="250" stroke="#047857" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <line x1="326" y1="250" x2="326" y2="129" stroke="#047857" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <line x1="574" y1="250" x2="574" y2="129" stroke="#047857" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow)"/>
  <text x="315" y="119" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">T</text>
  <text x="580" y="119" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">T</text>
  <text x="462" y="330" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#b91c1c">mg</text>
  <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#047857">x-components cancel</text>
  <text x="450" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0f766e">Vertical balance: 2T sin(theta) = mg</text>
</svg>
