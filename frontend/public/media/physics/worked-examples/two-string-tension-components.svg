<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Component breakdown at the knot</title>
  <desc id="desc">A free-body diagram of the knot showing tension vectors, x and y axes, and their horizontal and vertical components.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,5 L1,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#334155">Resolve only the forces acting on the knot</text>
  <circle cx="490" cy="292" r="12" fill="#0f766e"/>
  <line x1="250" y1="292" x2="730" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="490" y1="502" x2="490" y2="82" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="742" y="298" font-family="Arial, sans-serif" font-size="21" fill="#64748b">+x</text>
  <text x="500" y="84" font-family="Arial, sans-serif" font-size="21" fill="#64748b">+y</text>
  <line x1="490" y1="292" x2="322" y2="168" stroke="#155e75" stroke-width="5" marker-end="url(#blueArrow)"/>
  <line x1="490" y1="292" x2="658" y2="168" stroke="#155e75" stroke-width="5" marker-end="url(#blueArrow)"/>
  <line x1="490" y1="292" x2="490" y2="428" stroke="#b91c1c" stroke-width="5" marker-end="url(#redArrow)"/>
  <line x1="490" y1="292" x2="322" y2="292" stroke="#047857" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#greenArrow)"/>
  <line x1="322" y1="292" x2="322" y2="168" stroke="#047857" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#greenArrow)"/>
  <line x1="490" y1="292" x2="658" y2="292" stroke="#047857" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#greenArrow)"/>
  <line x1="658" y1="292" x2="658" y2="168" stroke="#047857" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#greenArrow)"/>
  <text x="296" y="154" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">T1</text>
  <text x="665" y="154" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#155e75">T2</text>
  <text x="504" y="412" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#b91c1c">mg</text>
  <text x="366" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#047857">T1 cos(theta1)</text>
  <text x="614" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#047857">T2 cos(theta2)</text>
  <text x="252" y="225" font-family="Arial, sans-serif" font-size="21" fill="#047857">T1 sin(theta1)</text>
  <text x="672" y="225" font-family="Arial, sans-serif" font-size="21" fill="#047857">T2 sin(theta2)</text>
  <rect x="85" y="488" width="810" height="82" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="490" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Equilibrium conditions</text>
  <text x="490" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e40af">Horizontal components cancel. Vertical components add to support the weight.</text>
</svg>
