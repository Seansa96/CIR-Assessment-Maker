<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
  <title id="title">Unbanked curve centripetal friction diagram</title>
  <desc id="desc">A top-down view of a car on a flat circular curve where static friction points toward the center and supplies centripetal force.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#334155">Flat curve: static friction supplies centripetal force</text>
  <circle cx="440" cy="300" r="175" fill="none" stroke="#cbd5e1" stroke-width="70"/>
  <circle cx="440" cy="300" r="175" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="9 9"/>
  <circle cx="440" cy="300" r="8" fill="#334155"/>
  <text x="452" y="292" font-family="Arial, sans-serif" font-size="18" fill="#334155">center</text>
  <g transform="translate(585 205) rotate(28)">
    <rect x="-42" y="-22" width="84" height="44" rx="10" fill="#f97316" stroke="#9a3412" stroke-width="4"/>
    <circle cx="-25" cy="25" r="7" fill="#1f2937"/>
    <circle cx="25" cy="25" r="7" fill="#1f2937"/>
    <circle cx="-25" cy="-25" r="7" fill="#1f2937"/>
    <circle cx="25" cy="-25" r="7" fill="#1f2937"/>
  </g>
  <line x1="585" y1="205" x2="472" y2="273" stroke="#155e75" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="526" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#155e75">fs</text>
  <line x1="585" y1="205" x2="655" y2="320" stroke="#047857" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="650" y="280" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#047857">v</text>
  <line x1="440" y1="300" x2="585" y2="205" stroke="#64748b" stroke-width="3"/>
  <text x="512" y="284" font-family="Arial, sans-serif" font-size="21" fill="#475569">r</text>
  <rect x="120" y="462" width="640" height="58" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="440" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f766e">On a flat road, friction is the only horizontal force pointing inward.</text>
</svg>
