<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Atwood machine energy bookkeeping diagram</title>
  <desc id="desc">Two masses connected over a pulley, showing the heavier mass falling, the lighter mass rising, shared speed, and potential energy changes.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#334155">Atwood machine: use the whole system for energy</text>

  <circle cx="490" cy="130" r="58" fill="#e2e8f0" stroke="#475569" stroke-width="5"/>
  <circle cx="490" cy="130" r="11" fill="#475569"/>
  <path d="M432 130 C372 130 355 170 355 215 L355 375" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M548 130 C608 130 625 170 625 215 L625 430" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <rect x="300" y="375" width="110" height="92" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <text x="355" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">m1</text>
  <rect x="570" y="430" width="110" height="110" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="4"/>
  <text x="625" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7f1d1d">m2</text>

  <line x1="260" y1="430" x2="260" y2="340" stroke="#155e75" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="226" y="387" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#155e75">m1 rises by h</text>
  <line x1="720" y1="430" x2="720" y2="520" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="754" y="482" font-family="Arial, sans-serif" font-size="22" fill="#b91c1c">m2 falls by h</text>
  <line x1="300" y1="330" x2="680" y2="330" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="300" y1="540" x2="680" y2="540" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="700" y="337" font-family="Arial, sans-serif" font-size="18" fill="#64748b">higher position</text>
  <text x="700" y="546" font-family="Arial, sans-serif" font-size="18" fill="#64748b">lower position</text>

  <line x1="430" y1="250" x2="385" y2="250" stroke="#047857" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="550" y1="250" x2="595" y2="250" stroke="#047857" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="490" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#047857">same speed v</text>

  <rect x="88" y="70" width="250" height="92" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="213" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#155e75">Potential energy</text>
  <text x="213" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">m1 gains m1gh</text>
  <text x="213" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f766e">m2 loses m2gh</text>

  <rect x="646" y="70" width="250" height="92" rx="12" fill="#fef3c7" stroke="#facc15" stroke-width="2"/>
  <text x="771" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">Kinetic energy</text>
  <text x="771" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#92400e">both masses move</text>
  <text x="771" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#92400e">with the same v</text>
</svg>
