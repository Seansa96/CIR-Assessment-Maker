<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">Rollercoaster loop energy and top-of-loop condition</title>
  <desc id="desc">A rollercoaster starts from height H and enters a loop of radius R; the top of the loop is height 2R and has downward weight and normal force.</desc>
  <defs>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1040" height="640" fill="#f8fafc"/>
  <text x="520" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#334155">Rollercoaster loop: energy plus circular-motion threshold</text>

  <line x1="90" y1="548" x2="960" y2="548" stroke="#64748b" stroke-width="4"/>
  <path d="M115 190 C210 190 240 548 390 548 C510 548 530 220 690 220 C850 220 850 548 690 548 C570 548 545 430 590 342" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
  <circle cx="690" cy="384" r="164" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="690" cy="220" r="17" fill="#0f766e" stroke="#064e3b" stroke-width="3"/>
  <rect x="92" y="160" width="54" height="34" rx="7" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
  <text x="119" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">start</text>

  <line x1="68" y1="548" x2="68" y2="190" stroke="#155e75" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="40" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#155e75" transform="rotate(-90 40 375)">H</text>
  <line x1="910" y1="548" x2="910" y2="220" stroke="#155e75" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="936" y="392" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#155e75">2R</text>
  <line x1="690" y1="384" x2="690" y2="220" stroke="#155e75" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="706" y="310" font-family="Arial, sans-serif" font-size="22" fill="#155e75">R</text>

  <line x1="690" y1="220" x2="690" y2="292" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <line x1="730" y1="220" x2="730" y2="292" stroke="#475569" stroke-width="5" marker-end="url(#arrowGray)"/>
  <text x="646" y="283" font-family="Arial, sans-serif" font-size="22" fill="#b91c1c">mg</text>
  <text x="744" y="283" font-family="Arial, sans-serif" font-size="22" fill="#475569">N</text>
  <text x="628" y="186" font-family="Arial, sans-serif" font-size="20" fill="#0f766e">top of loop</text>

  <rect x="104" y="470" width="340" height="70" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="274" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#155e75">Energy relation</text>
  <text x="274" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f766e">initial height H -> top height 2R plus kinetic energy</text>

  <rect x="578" y="470" width="360" height="70" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <text x="758" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#991b1b">Threshold condition</text>
  <text x="758" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">at minimum speed, N = 0 and mg supplies centripetal force</text>
</svg>
