<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Standard Atwood machine force diagram</title>
  <desc id="desc">Two hanging masses over a pulley with the heavier mass moving downward and the lighter mass moving upward. Tension and weight forces are shown.</desc>
  <rect width="720" height="420" fill="#f6f8f8"/>
  <line x1="360" y1="72" x2="360" y2="42" stroke="#415057" stroke-width="8" stroke-linecap="round"/>
  <circle cx="360" cy="100" r="58" fill="#e7eeee" stroke="#415057" stroke-width="5"/>
  <circle cx="360" cy="100" r="14" fill="#f6f8f8" stroke="#718087" stroke-width="3"/>
  <path d="M304 116 C250 140 224 180 224 230" fill="none" stroke="#263238" stroke-width="5"/>
  <path d="M416 116 C470 140 496 180 496 230" fill="none" stroke="#263238" stroke-width="5"/>
  <rect x="178" y="230" width="92" height="82" rx="8" fill="#dbe9e7" stroke="#14776f" stroke-width="4"/>
  <rect x="444" y="230" width="104" height="104" rx="8" fill="#f0ded6" stroke="#9d3b32" stroke-width="4"/>
  <text x="224" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#143c3a">m1 = 3 kg</text>
  <text x="496" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#5b231e">m2 = 5 kg</text>
  <line x1="224" y1="224" x2="224" y2="164" stroke="#0f7770" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="184" y="188" font-family="Arial, sans-serif" font-size="22" fill="#0f7770">T</text>
  <line x1="224" y1="318" x2="224" y2="376" stroke="#263238" stroke-width="5" marker-end="url(#arrowDark)"/>
  <text x="238" y="356" font-family="Arial, sans-serif" font-size="22" fill="#263238">m1g</text>
  <line x1="496" y1="224" x2="496" y2="164" stroke="#0f7770" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="510" y="188" font-family="Arial, sans-serif" font-size="22" fill="#0f7770">T</text>
  <line x1="496" y1="340" x2="496" y2="398" stroke="#263238" stroke-width="5" marker-end="url(#arrowDark)"/>
  <text x="510" y="378" font-family="Arial, sans-serif" font-size="22" fill="#263238">m2g</text>
  <line x1="134" y1="286" x2="134" y2="236" stroke="#14776f" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="84" y="258" font-family="Arial, sans-serif" font-size="20" fill="#14776f">m1 up</text>
  <line x1="600" y1="248" x2="600" y2="318" stroke="#9d3b32" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="612" y="292" font-family="Arial, sans-serif" font-size="20" fill="#9d3b32">m2 down</text>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238">Choose positive along the motion</text>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#263238"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f7770"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9d3b32"/>
    </marker>
  </defs>
</svg>
