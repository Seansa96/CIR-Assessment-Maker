<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Two-string hanging mass setup</title>
  <desc id="desc">A hanging mass supported by two angled strings meeting at a central knot, with tensions and weight labeled.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#f7f9f9"/>
  <line x1="120" y1="72" x2="800" y2="72" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#334155">Two-string static equilibrium setup</text>
  <circle cx="225" cy="72" r="8" fill="#334155"/>
  <circle cx="695" cy="72" r="8" fill="#334155"/>
  <circle cx="460" cy="265" r="10" fill="#0f766e"/>
  <line x1="225" y1="72" x2="460" y2="265" stroke="#155e75" stroke-width="6" stroke-linecap="round"/>
  <line x1="695" y1="72" x2="460" y2="265" stroke="#155e75" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="265" x2="460" y2="395" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <rect x="405" y="395" width="110" height="82" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
  <text x="460" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#334155">m</text>
  <line x1="460" y1="265" x2="320" y2="150" stroke="#155e75" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="460" y1="265" x2="600" y2="150" stroke="#155e75" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="460" y1="265" x2="460" y2="345" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="302" y="146" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#155e75">T1</text>
  <text x="604" y="146" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#155e75">T2</text>
  <text x="474" y="330" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#b91c1c">mg</text>
  <line x1="315" y1="265" x2="605" y2="265" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M385 265 A75 75 0 0 0 402 218" fill="none" stroke="#475569" stroke-width="3"/>
  <path d="M535 265 A75 75 0 0 1 518 218" fill="none" stroke="#475569" stroke-width="3"/>
  <text x="382" y="236" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#334155">theta1</text>
  <text x="538" y="236" font-family="Arial, sans-serif" font-size="22" fill="#334155">theta2</text>
  <rect x="72" y="472" width="776" height="48" rx="10" fill="#ecfeff" stroke="#99f6e4" stroke-width="2"/>
  <text x="460" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f766e">Analyze the knot: the two angled tensions and the downward weight all act at this point.</text>
</svg>
