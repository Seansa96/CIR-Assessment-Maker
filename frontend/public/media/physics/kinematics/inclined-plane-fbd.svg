<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
  <title id="title">Inclined plane free-body diagram</title>
  <desc id="desc">A block on an inclined plane with weight split into parallel and perpendicular components, plus normal force.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#155e75"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#334155">Inclined plane force components</text>
  <polygon points="140,460 720,460 720,180" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
  <line x1="140" y1="460" x2="720" y2="180" stroke="#475569" stroke-width="6"/>
  <g transform="translate(455 310) rotate(-26)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="#fed7aa" stroke="#9a3412" stroke-width="4"/>
  </g>
  <circle cx="455" cy="310" r="7" fill="#334155"/>
  <line x1="455" y1="310" x2="455" y2="455" stroke="#b91c1c" stroke-width="5" marker-end="url(#arrowRed)"/>
  <line x1="455" y1="310" x2="525" y2="165" stroke="#155e75" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <line x1="455" y1="310" x2="336" y2="367" stroke="#047857" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <line x1="455" y1="310" x2="388" y2="171" stroke="#047857" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="466" y="438" font-family="Arial, sans-serif" font-size="23" fill="#b91c1c">mg</text>
  <text x="530" y="171" font-family="Arial, sans-serif" font-size="23" fill="#155e75">N</text>
  <text x="286" y="374" font-family="Arial, sans-serif" font-size="22" fill="#047857">mg sin(theta)</text>
  <text x="294" y="162" font-family="Arial, sans-serif" font-size="22" fill="#047857">mg cos(theta)</text>
  <path d="M185 460 A74 74 0 0 0 252 428" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="250" y="452" font-family="Arial, sans-serif" font-size="22" fill="#334155">theta</text>
</svg>
