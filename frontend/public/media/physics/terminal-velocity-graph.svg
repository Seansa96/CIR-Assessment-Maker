<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Terminal velocity graph</title>
  <desc id="desc">Velocity increases quickly at first, then levels off toward a horizontal terminal velocity line.</desc>
  <rect width="820" height="520" fill="#f8fafc"/>
  <line x1="100" y1="420" x2="740" y2="420" stroke="#475569" stroke-width="4"/>
  <line x1="100" y1="420" x2="100" y2="70" stroke="#475569" stroke-width="4"/>
  <text x="420" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">time</text>
  <text x="36" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155" transform="rotate(-90 36 250)">speed</text>
  <line x1="100" y1="145" x2="740" y2="145" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="650" y="130" font-family="Arial, sans-serif" font-size="21" fill="#64748b">terminal speed</text>
  <path d="M100 420 C170 310 230 235 310 190 C410 134 560 143 740 145" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="420" r="6" fill="#0f766e"/>
  <circle cx="740" cy="145" r="6" fill="#0f766e"/>
  <text x="410" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#334155">Approaching terminal velocity</text>
</svg>
