<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Modeling cycle</title><desc id="d">A feedback cycle linking state variables, assumptions, rate laws, predictions, observations, and revision</desc><rect width="960" height="300" rx="24" fill="#f4f8fb"/><g font-family="Arial" font-size="17" text-anchor="middle"><circle cx="480" cy="155" r="92" fill="#fff" stroke="#277da1" stroke-width="3"/><text x="480" y="145">Model</text><text x="480" y="169">with units</text><g fill="#e7f4f8" stroke="#277da1" stroke-width="2"><rect x="70" y="55" width="180" height="50" rx="10"/><rect x="710" y="55" width="180" height="50" rx="10"/><rect x="710" y="215" width="180" height="50" rx="10"/><rect x="70" y="215" width="180" height="50" rx="10"/></g><text x="160" y="86">State + assumptions</text><text x="800" y="86">Rate law + data</text><text x="800" y="246">Prediction</text><text x="160" y="246">Observe and revise</text><g fill="none" stroke="#c65d32" stroke-width="4"><path d="M250 80C380 20 580 20 710 80"/><path d="M800 105v110"/><path d="M710 240C580 290 380 290 250 240"/><path d="M160 215V105"/></g></g></svg>