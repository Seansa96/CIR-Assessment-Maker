<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Resistance opposes motion</title><desc id="d">Force arrows for upward and downward motion, showing gravity and drag directions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c65d32"/></marker></defs><rect width="900" height="360" rx="24" fill="#f4f8fb"/><text x="450" y="40" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Resistance opposes motion</text><g font-family="Arial" font-size="18"><path d="M230 285V80" stroke="#277da1" stroke-width="7" marker-end="url(#arrow)"/><circle cx="230" cy="190" r="28" fill="#fff" stroke="#277da1" stroke-width="4"/><path d="M190 190V275" stroke="#c65d32" stroke-width="7" marker-end="url(#arrow)"/><path d="M270 190V270" stroke="#c65d32" stroke-width="7" marker-end="url(#arrow)"/><text x="125" y="185">v&gt;0 upward</text><text x="145" y="300">mg</text><text x="275" y="300">drag</text><path d="M650 90V290" stroke="#277da1" stroke-width="7" marker-end="url(#arrow)"/><circle cx="650" cy="190" r="28" fill="#fff" stroke="#277da1" stroke-width="4"/><path d="M610 190V275" stroke="#c65d32" stroke-width="7" marker-end="url(#arrow)"/><path d="M690 190V105" stroke="#c65d32" stroke-width="7" marker-end="url(#arrow)"/><text x="710" y="185">v&lt;0 downward</text><text x="565" y="300">mg</text><text x="700" y="95">drag</text><text x="245" y="70">chosen positive</text><text x="665" y="320">quadratic drag: -b|v|v</text></g></svg>