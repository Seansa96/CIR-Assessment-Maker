<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Rate-model construction workflow</title><desc id="d">A workflow connects the changing quantity and its units to accumulation, proportional change, and input-output balance models.</desc><rect width="900" height="300" rx="24" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="95" width="190" height="110" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="130" y="133" font-size="20" font-weight="700">Define the state</text><text x="130" y="163" font-size="17">Q(t) and units</text><path d="M225 150h75" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="300" y="60" width="260" height="180" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/><text x="430" y="98" font-size="20" font-weight="700">Identify the rate rule</text><text x="430" y="133" font-size="17">accumulation: Qâ€² = r(t)</text><text x="430" y="165" font-size="17">proportional: Qâ€² = kQ</text><text x="430" y="197" font-size="17">balance: Qâ€² = in âˆ’ out</text><path d="M560 150h75" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="635" y="95" width="230" height="110" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="750" y="133" font-size="20" font-weight="700">Check the model</text><text x="750" y="163" font-size="17">units and signs agree</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#334155"/></marker></defs></svg>
