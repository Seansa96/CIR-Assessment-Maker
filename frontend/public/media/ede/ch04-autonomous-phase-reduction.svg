<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Autonomous phase plane</title><desc id="d">Position-velocity axes, a phase trajectory, its initial state, and the local direction vector.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c65d32"/></marker></defs><rect width="900" height="360" rx="24" fill="#f4f8fb"/><text x="450" y="40" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Autonomous phase plane</text><g font-family="Arial" font-size="18"><path d="M100 290H820M450 325V70" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/><text x="830" y="296">y</text><text x="462" y="75">v</text><ellipse cx="450" cy="195" rx="270" ry="105" fill="none" stroke="#277da1" stroke-width="6"/><circle cx="260" cy="120" r="9" fill="#d62828"/><path d="M260 120Q315 90 365 92" fill="none" stroke="#c65d32" stroke-width="5" marker-end="url(#arrow)"/><text x="175" y="95">(y0,v0)</text><text x="530" y="105">trajectory selected by initial data</text><rect x="610" y="245" width="210" height="55" rx="10" fill="#fff" stroke="#277da1" stroke-width="3"/><text x="715" y="278" text-anchor="middle">(y',v')=(v,f(y,v))</text></g></svg>