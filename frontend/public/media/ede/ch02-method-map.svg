<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">First-order differential-equation method map</title><desc id="d">A decision map checks linear, separable, exact, Bernoulli, homogeneous, and supported integrating-factor structures before solving and verifying.</desc><rect width="1000" height="470" rx="24" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="350" y="25" width="300" height="58" rx="15" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="500" y="61" font-size="21" font-weight="700">Normalize the first-order ODE</text><path d="M500 83v38" stroke="#334155" stroke-width="4"/><g font-size="18"><rect x="35" y="122" width="175" height="78" rx="14" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/><text x="122" y="153">linear?</text><text x="122" y="179">yâ€²+py=q</text><rect x="225" y="122" width="175" height="78" rx="14" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/><text x="312" y="153">separable?</text><text x="312" y="179">g(y)dy=f(x)dx</text><rect x="415" y="122" width="175" height="78" rx="14" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/><text x="502" y="153">exact?</text><text x="502" y="179">Máµ§=Nâ‚“</text><rect x="605" y="122" width="175" height="78" rx="14" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/><text x="692" y="153">Bernoulli?</text><text x="692" y="179">v=yÂ¹â»â¿</text><rect x="795" y="122" width="170" height="78" rx="14" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/><text x="880" y="153">homogeneous?</text><text x="880" y="179">v=y/x</text></g><path d="M500 200v55" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="245" y="255" width="510" height="72" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="500" y="285" font-size="20" font-weight="700">If nonexact, test only the supported</text><text x="500" y="312" font-size="18">one-variable integrating-factor ratios</text><path d="M500 327v45" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="290" y="372" width="420" height="62" rx="15" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="500" y="397" font-size="20" font-weight="700">Solve â†’ apply data â†’ verify</text><text x="500" y="422" font-size="17">including equilibria and valid interval</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#334155"/></marker></defs></svg>
