<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Changing-volume mixing balance</title><desc id="d">A tank with unequal inflow and outflow, current concentration Q over V, and a capacity boundary.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c65d32"/></marker></defs><rect width="900" height="360" rx="24" fill="#f4f8fb"/><text x="450" y="40" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Changing-volume mixing balance</text><g font-family="Arial" font-size="18"><path d="M300 95V300H650V95" fill="#fff" stroke="#277da1" stroke-width="5"/><path d="M305 190H645V295H305Z" fill="#b9e3ee"/><path d="M70 135H300" stroke="#c65d32" stroke-width="8" marker-end="url(#arrow)"/><path d="M650 245H835" stroke="#c65d32" stroke-width="8" marker-end="url(#arrow)"/><path d="M290 120H660" stroke="#d62828" stroke-width="3" stroke-dasharray="10 8"/><text x="80" y="115">r_in, concentration c_in</text><text x="675" y="225">r_out, Q/V</text><text x="420" y="240" font-size="24">Q(t), V(t)</text><text x="670" y="125" fill="#d62828">capacity</text><text x="350" y="330">V(t)=V0+(r_in-r_out)t</text></g></svg>