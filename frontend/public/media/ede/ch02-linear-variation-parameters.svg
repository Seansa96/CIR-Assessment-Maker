<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Linear structure</title><desc id="d">A complementary solution connects variation of parameters to the reciprocal integrating factor</desc><rect width="960" height="300" rx="24" fill="#f4f8fb"/><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#277da1" stroke-width="3"><rect x="55" y="105" width="240" height="80" rx="14"/><rect x="360" y="105" width="240" height="80" rx="14"/><rect x="665" y="105" width="240" height="80" rx="14"/></g><g font-size="20"><text x="175" y="138">y1' + p y1 = 0</text><text x="175" y="166">known y1 != 0</text><text x="480" y="138">y = u y1</text><text x="480" y="166">solve for u</text><text x="785" y="138">mu = 1/y1</text><text x="785" y="166">(mu y)' = mu q</text></g><g stroke="#c65d32" stroke-width="4" fill="none"><path d="M295 145h65m240 0h65"/><path d="M345 136l15 9-15 9m305-18l15 9-15 9"/></g></g></svg>