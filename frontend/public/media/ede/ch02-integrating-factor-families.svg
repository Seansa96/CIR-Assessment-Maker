<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Integrating factors</title><desc id="d">A workflow branches to one-variable and product integrating factors before retesting exactness and auditing excluded curves</desc><rect width="960" height="300" rx="24" fill="#f4f8fb"/><g font-family="Arial" text-anchor="middle"><rect x="35" y="45" width="205" height="60" rx="12" fill="#fff" stroke="#277da1" stroke-width="3"/><text x="138" y="80" font-size="18">Mdx+Ndy nonexact</text><g fill="#e7f4f8" stroke="#277da1" stroke-width="2"><rect x="305" y="20" width="170" height="55" rx="10"/><rect x="305" y="90" width="170" height="55" rx="10"/><rect x="305" y="160" width="170" height="55" rx="10"/></g><text x="390" y="54" font-size="18">mu(x)</text><text x="390" y="124" font-size="18">mu(y)</text><text x="390" y="194" font-size="18">P(x)Q(y)</text><rect x="540" y="75" width="170" height="70" rx="12" fill="#fff" stroke="#277da1" stroke-width="3"/><text x="625" y="105" font-size="18">Multiply</text><text x="625" y="130" font-size="18">retest exactness</text><rect x="765" y="75" width="165" height="70" rx="12" fill="#fff1e8" stroke="#c65d32" stroke-width="3"/><text x="848" y="104" font-size="18">Audit mu=0</text><text x="848" y="130" font-size="18">or undefined</text><g stroke="#555" stroke-width="3"><path d="M240 75l65-28M240 75h65M240 75l65 112M475 48l65 55M475 118l65-8M475 188l65-55M710 110h55"/></g></g></svg>