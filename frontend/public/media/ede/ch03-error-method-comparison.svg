<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430" role="img" aria-labelledby="t d"><title id="t">Numerical error and method comparison</title><desc id="d">A reference curve is compared with coarse and fine Euler polygons. One-step local error and final global errors are labeled. A table compares Euler, Heun, and RK4 evaluations per step and typical global order.</desc><rect width="1050" height="430" rx="22" fill="#f8fafc"/><g transform="translate(55 45)" font-family="Arial,sans-serif"><path d="M0 300H610M0 0V320" stroke="#334155" stroke-width="3"/><path d="M20 280C160 250 250 175 360 120S520 45 590 35" fill="none" stroke="#2563eb" stroke-width="5"/><polyline points="20,280 210,215 400,123 590,75" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="12 8"/><polyline points="20,280 115,255 210,214 305,170 400,121 495,78 590,43" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M210 214v-22" stroke="#b45309" stroke-width="4"/><path d="M590 75v-40M590 43v-8" stroke="#7c3aed" stroke-width="4"/><text x="330" y="90" fill="#2563eb" font-size="18">reference</text><text x="320" y="225" fill="#dc2626" font-size="18">coarse Euler</text><text x="330" y="155" fill="#0f766e" font-size="18">fine Euler</text><text x="120" y="190" fill="#b45309" font-size="17">local one-step error</text><text x="455" y="105" fill="#7c3aed" font-size="17">endpoint global errors</text><g transform="translate(655 50)"><rect width="325" height="245" rx="15" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/><text x="162" y="36" text-anchor="middle" font-size="20" font-weight="700">Cost and typical order</text><text x="25" y="78" font-size="18">Euler</text><text x="145" y="78" font-size="18">1 eval/step</text><text x="265" y="78" font-size="18">order 1</text><text x="25" y="125" font-size="18">Heun</text><text x="145" y="125" font-size="18">2 eval/step</text><text x="265" y="125" font-size="18">order 2</text><text x="25" y="172" font-size="18">RK4</text><text x="145" y="172" font-size="18">4 eval/step</text><text x="265" y="172" font-size="18">order 4</text><text x="162" y="218" text-anchor="middle" font-size="17">compare at the same endpoint</text></g></g></svg>
