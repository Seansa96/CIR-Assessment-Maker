<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Equation types</title><desc id="d">Four panels distinguish scalar, higher-order, coupled-system, and partial differential equation structures</desc><rect width="960" height="300" rx="24" fill="#f4f8fb"/><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#277da1" stroke-width="2"><rect x="35" y="75" width="205" height="145" rx="12"/><rect x="263" y="75" width="205" height="145" rx="12"/><rect x="491" y="75" width="205" height="145" rx="12"/><rect x="719" y="75" width="205" height="145" rx="12"/></g><g font-size="18" font-weight="700"><text x="138" y="110">Scalar ODE</text><text x="366" y="110">Higher order</text><text x="594" y="110">Coupled system</text><text x="822" y="110">PDE</text></g><g font-size="20"><text x="138" y="160">y' = f(t,y)</text><text x="366" y="160">y'' = -g</text><text x="594" y="150">P' = F(P,Q)</text><text x="594" y="180">Q' = G(P,Q)</text><text x="822" y="160">du/dt = k d2u/dx2</text></g></g></svg>