<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Transformation map</title><desc id="d">A decision tree maps Bernoulli, homogeneous nonlinear, and known-solution Riccati forms to their substitutions</desc><rect width="960" height="300" rx="24" fill="#f4f8fb"/><g font-family="Arial" text-anchor="middle"><rect x="355" y="35" width="250" height="55" rx="12" fill="#fff" stroke="#277da1" stroke-width="3"/><text x="480" y="70" font-size="20">Recognize equation structure</text><g fill="#e7f4f8" stroke="#277da1" stroke-width="2"><rect x="40" y="185" width="250" height="70" rx="12"/><rect x="355" y="185" width="250" height="70" rx="12"/><rect x="670" y="185" width="250" height="70" rx="12"/></g><g font-size="18"><text x="165" y="214">Bernoulli y^n</text><text x="165" y="240">v=y^(1-n)</text><text x="480" y="214">q(y/x)</text><text x="480" y="240">y=u x; keep q(u)=u</text><text x="795" y="214">Riccati + known y1</text><text x="795" y="240">z=y-y1</text></g><g stroke="#c65d32" stroke-width="3"><path d="M480 90L165 185M480 90v95M480 90l315 95"/></g></g></svg>