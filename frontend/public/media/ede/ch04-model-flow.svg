<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Differential equation modeling workflow</title><desc id="desc">A left-to-right flow from situation to variables to rate law to initial condition to interpreted solution.</desc><rect width="720" height="300" fill="#f8fbff"/><g font-family="sans-serif" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb"><rect x="24" y="110" width="120" height="70" rx="10"/><rect x="164" y="110" width="120" height="70" rx="10"/><rect x="304" y="110" width="120" height="70" rx="10"/><rect x="444" y="110" width="120" height="70" rx="10"/><rect x="584" y="110" width="112" height="70" rx="10"/></g><g fill="#1e3a8a" font-size="17"><text x="84" y="141">Situation</text><text x="224" y="141">Variables</text><text x="364" y="141">Rate law</text><text x="504" y="141">Initial data</text><text x="640" y="141">Interpret</text></g><g fill="#475569" font-size="13"><text x="84" y="162">physical context</text><text x="224" y="162">quantities, units</text><text x="364" y="162">dQ/dt relation</text><text x="504" y="162">starting state</text><text x="640" y="162">check meaning</text></g><path d="M144 145h20m120 0h20m120 0h20m120 0h20" stroke="#475569" stroke-width="3"/><path d="M153 137l11 8-11 8m140-16l11 8-11 8m140-16l11 8-11 8m140-16l11 8-11 8" fill="none" stroke="#475569" stroke-width="3"/></g><text x="360" y="55" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#1e3a8a">Model before solving: each arrow is a checkable decision</text></svg>
