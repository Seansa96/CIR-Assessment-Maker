<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Local theorem</title><desc id="d">An open rectangle around initial data avoids a singular line and distinguishes local from global conclusions</desc><rect width="960" height="300" rx="24" fill="#f4f8fb"/><g transform="translate(80 45)" font-family="Arial"><rect x="170" y="25" width="470" height="185" fill="#e7f4f8" stroke="#277da1" stroke-width="4" stroke-dasharray="10 7"/><path d="M675 0L790 230" stroke="#d62828" stroke-width="5"/><circle cx="390" cy="120" r="9" fill="#176b3a"/><path d="M315 135C355 95 430 90 505 125" fill="none" stroke="#176b3a" stroke-width="5"/><text x="405" y="145" font-size="18">(x0,y0)</text><text x="260" y="55" font-size="18">open rectangle: f and f_y continuous</text><text x="665" y="220" font-size="18" fill="#d62828">singular set avoided</text><text x="300" y="235" font-size="17">conclusion: unique on some local x-interval</text></g></svg>