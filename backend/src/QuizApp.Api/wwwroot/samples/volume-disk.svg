  <line x1="70" y1="232" x2="580" y2="232" stroke="#445057" stroke-width="3"/>
  <line x1="70" y1="48" x2="70" y2="232" stroke="#445057" stroke-width="3"/>
  <path d="M70 232 C165 210 225 167 303 120 C395 64 480 52 580 48" fill="none" stroke="#1d625b" stroke-width="5"/>
  <path d="M70 232 C165 210 225 167 303 120 C395 64 480 52 580 48 L580 232 L70 232 Z" fill="#d6e5e2" opacity="0.62"/>
  <g fill="none" stroke="#8a5a12" stroke-width="3">
    <ellipse cx="178" cy="197" rx="17" ry="36"/>
    <ellipse cx="286" cy="131" rx="20" ry="88"/>
    <ellipse cx="396" cy="77" rx="22" ry="132"/>
