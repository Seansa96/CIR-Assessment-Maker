<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Disk method cross sections</title>
  <desc id="desc">A curve above the x-axis with several circular cross sections indicating disk method slices.</desc>
