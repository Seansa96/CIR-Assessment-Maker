schemaVersion: 1
id: mathematical-literacy
title: Mathematical Literacy
description: Learn to read mathematical notation, statements, definitions, proofs, and unfamiliar mathematical exposition with confidence.
authoringProfile: stem
directedProjectEligible: false
subcategories:
  - id: mathematical-notation-and-structure
    title: Mathematical Notation and Structure
    description: Read symbols, variables, binding, sets, functions, and expressions as meaningful mathematical language.
  - id: mathematical-statements-and-logic
    title: Mathematical Statements and Logic
    description: Interpret propositions, connectives, implication, quantifiers, negation, and English-to-symbolic translations.
    prerequisiteIds: [mathematical-notation-and-structure]
  - id: quantifiers-negation-and-mathematical-translation
    title: Quantifiers, Negation, and Mathematical Translation
    description: Track quantifier scope, negate statements accurately, and translate between ordinary language and symbolic mathematical claims.
    prerequisiteIds: [mathematical-statements-and-logic]
  - id: definitions-theorems-and-examples
    title: Definitions, Theorems, and Examples
    description: Separate definitions, hypotheses, conclusions, examples, and counterexamples when reading mathematical text.
    prerequisiteIds: [quantifiers-negation-and-mathematical-translation]
  - id: theorem-reading-and-application
    title: Theorem Reading and Application
    description: Extract hypotheses, conclusions, and permitted uses from theorem statements before applying them to a new case.
    prerequisiteIds: [definitions-theorems-and-examples]
  - id: reading-proofs-and-exposition
    title: Reading Proofs and Exposition
    description: Trace proof structure, identify local justifications, and read unfamiliar mathematical prose without treating it as a calculation recipe.
    prerequisiteIds: [theorem-reading-and-application]
  - id: proof-forms-and-argument-diagnosis
    title: Proof Forms and Argument Diagnosis
    description: Recognize proof forms, repair local gaps, and distinguish a valid inference from a tempting but unsupported move.
    prerequisiteIds: [reading-proofs-and-exposition]
  - id: reading-mathematical-exposition
    title: Reading Mathematical Exposition
    description: Read a definition-theorem-proof passage by building a dependency map and translating its claims into your own words.
    prerequisiteIds: [proof-forms-and-argument-diagnosis]
  - id: mathematical-literacy-cumulative-review
    title: Mathematical Literacy Cumulative Review
    description: Integrate notation, logic, theorem structure, proof reading, and exposition analysis across unfamiliar short excerpts.
    prerequisiteIds: [reading-mathematical-exposition]
