schemaVersion: 1
id: calculus-3
title: Calculus 3
description: Flexible multivariable calculus study paths covering spatial vectors, derivatives of several variables, multiple integration, and vector-calculus theorems. Topic prerequisites recommend preparation but do not restrict access when a professor uses a different course order.
authoringProfile: stem
directedProjectEligible: false
subcategories:
  - id: calc3-readiness
    title: Calc 3 Readiness and Prior-Knowledge Check
    description: Review assumed algebra, trigonometry, polar and parametric notation, single-variable derivatives, and integration before entering any Calc 3 track.
  - id: calc3-three-dimensional-coordinate-systems
    title: Three-Dimensional Coordinate Systems
    description: Points, distance, spheres, and coordinate geometry in space.
    prerequisiteIds: [calc3-readiness]
  - id: calc3-vectors
    title: Vectors in Space
    description: Vector components, magnitude, scalar multiplication, and geometric interpretation in two and three dimensions.
    prerequisiteIds: [calc3-three-dimensional-coordinate-systems]
  - id: calc3-dot-cross-products
    title: Dot and Cross Products
    description: Orthogonality, projections, areas, orientations, and normal vectors.
    prerequisiteIds: [calc3-vectors]
  - id: calc3-lines-and-planes
    title: Lines and Planes in Space
    description: Vector, parametric, and scalar equations with spatial relationships and distances.
    prerequisiteIds: [calc3-dot-cross-products]
  - id: calc3-vector-valued-functions
    title: Vector-Valued Functions and Space Curves
    description: Parametric vector functions, space curves, and geometric representations.
    prerequisiteIds: [calc3-vectors]
  - id: calc3-motion-in-space
    title: Motion in Space
    description: Velocity, acceleration, speed, and motion models from vector-valued functions.
    prerequisiteIds: [calc3-vector-valued-functions]
  - id: calc3-functions-of-several-variables
    title: Functions of Several Variables
    description: Domains, graphs, level curves, and level surfaces for multivariable functions.
    prerequisiteIds: [calc3-readiness]
  - id: calc3-multivariable-limits-continuity
    title: Multivariable Limits and Continuity
    description: Limits and continuity in two and three variables, including path-sensitive reasoning.
    prerequisiteIds: [calc3-functions-of-several-variables]
  - id: calc3-partial-derivatives
    title: Partial Derivatives
    description: First and higher partial derivatives, interpretation, and multivariable rates of change.
    prerequisiteIds: [calc3-multivariable-limits-continuity]
  - id: calc3-tangent-planes-linearization
    title: Tangent Planes and Linearization
    description: Local linear models, differentials, and approximation of surfaces.
    prerequisiteIds: [calc3-partial-derivatives]
  - id: calc3-multivariable-chain-rule
    title: The Multivariable Chain Rule
    description: Differentiate compositions and implicitly defined multivariable relationships.
    prerequisiteIds: [calc3-partial-derivatives]
  - id: calc3-directional-derivatives-gradients
    title: Directional Derivatives and Gradients
    description: Directional rates of change, gradient geometry, and maximum-rate directions.
    prerequisiteIds: [calc3-partial-derivatives]
  - id: calc3-multivariable-optimization
    title: Multivariable Optimization and Lagrange Multipliers
    description: Critical points, constrained optimization, and interpretation of extrema.
    prerequisiteIds: [calc3-tangent-planes-linearization, calc3-directional-derivatives-gradients]
  - id: calc3-double-integrals
    title: Double Integrals
    description: Iterated integrals, general planar regions, and geometric or physical interpretation.
    prerequisiteIds: [calc3-readiness]
  - id: calc3-double-integrals-polar
    title: Double Integrals in Polar Coordinates
    description: Polar regions, Jacobian factor, and coordinate choice for double integrals.
    prerequisiteIds: [calc3-double-integrals]
  - id: calc3-triple-integrals
    title: Triple Integrals
    description: Iterated triple integrals, solid regions, volume, and density applications.
    prerequisiteIds: [calc3-double-integrals]
  - id: calc3-triple-integrals-cylindrical-spherical
    title: Triple Integrals in Cylindrical and Spherical Coordinates
    description: Coordinate conversions, Jacobians, and three-dimensional integration regions.
    prerequisiteIds: [calc3-triple-integrals]
  - id: calc3-change-of-variables
    title: Change of Variables in Multiple Integrals
    description: Transform regions and integrands using coordinate maps and Jacobian determinants.
    prerequisiteIds: [calc3-double-integrals-polar, calc3-triple-integrals]
  - id: calc3-vector-fields
    title: Vector Fields
    description: Two- and three-dimensional vector fields, gradient fields, and physical interpretations.
    prerequisiteIds: [calc3-vectors, calc3-functions-of-several-variables]
  - id: calc3-line-integrals
    title: Line Integrals
    description: Scalar and vector line integrals along parametrized curves.
    prerequisiteIds: [calc3-vector-valued-functions]
  - id: calc3-conservative-vector-fields
    title: Conservative Vector Fields and the Fundamental Theorem
    description: Potential functions, path independence, and the Fundamental Theorem for Line Integrals.
    prerequisiteIds: [calc3-line-integrals, calc3-directional-derivatives-gradients]
  - id: calc3-greens-theorem
    title: Green's Theorem
    description: Relate circulation and flux line integrals to double integrals over planar regions.
    prerequisiteIds: [calc3-line-integrals, calc3-double-integrals]
  - id: calc3-curl-divergence
    title: Curl and Divergence
    description: Compute and interpret local rotation, sources, and sinks in vector fields.
    prerequisiteIds: [calc3-vector-fields, calc3-partial-derivatives]
  - id: calc3-parametric-surfaces-surface-integrals
    title: Parametric Surfaces and Surface Integrals
    description: Parametrize surfaces, compute area, orient normals, and integrate scalar or vector fields across surfaces.
    prerequisiteIds: [calc3-vector-valued-functions, calc3-double-integrals]
  - id: calc3-stokes-theorem
    title: Stokes' Theorem
    description: Relate circulation around an oriented boundary to curl through a surface.
    prerequisiteIds: [calc3-parametric-surfaces-surface-integrals, calc3-curl-divergence, calc3-line-integrals]
  - id: calc3-divergence-theorem
    title: The Divergence Theorem
    description: Relate outward flux through a closed surface to divergence over its enclosed volume.
    prerequisiteIds: [calc3-parametric-surfaces-surface-integrals, calc3-curl-divergence, calc3-triple-integrals]
  - id: calc3-comprehensive-review
    title: Calculus 3 Comprehensive Review
    description: Cumulative synthesis across spatial reasoning, multivariable derivatives, multiple integration, and vector-calculus theorems.
    prerequisiteIds: [calc3-motion-in-space, calc3-multivariable-optimization, calc3-change-of-variables, calc3-greens-theorem, calc3-stokes-theorem, calc3-divergence-theorem]
