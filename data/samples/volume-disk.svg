<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Disk method cross sections</title>
  <desc id="desc">A curve revolved around the x-axis with circular disk slices perpendicular to the x-axis.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <line x1="80" y1="300" x2="650" y2="300" stroke="#334155" stroke-width="3"/>
  <line x1="100" y1="340" x2="100" y2="70" stroke="#334155" stroke-width="3"/>
  <text x="660" y="306" font-family="Arial, sans-serif" font-size="18" fill="#334155">x-axis</text>
  <text x="82" y="62" font-family="Arial, sans-serif" font-size="18" fill="#334155">y</text>
  <path d="M100 300 C180 238 260 205 340 178 C440 145 540 118 630 94" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M100 300 C180 238 260 205 340 178 C440 145 540 118 630 94 L630 300 Z" fill="#bfdbfe" opacity="0.32"/>
  <ellipse cx="405" cy="231" rx="34" ry="74" fill="#f97316" opacity="0.68" stroke="#9a3412" stroke-width="3"/>
  <line x1="405" y1="300" x2="405" y2="161" stroke="#9a3412" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="420" y="222" font-family="Arial, sans-serif" font-size="20" fill="#7c2d12">disk slice</text>
  <text x="415" y="278" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">r=f(x)</text>
  <text x="505" y="132" font-family="Arial, sans-serif" font-size="22" fill="#1d4ed8">y=f(x)</text>
</svg>
