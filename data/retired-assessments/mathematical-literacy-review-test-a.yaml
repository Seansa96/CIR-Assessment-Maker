questions:
  - id: q001
    type: multipleChoice
    prompt: "Let $S = \\{x \\in \\mathbb{R} : x^2 < 4\\}$. What is $S$?"
    choices:
      - id: a
        text: "The open interval $(-2, 2)$."
      - id: b
        text: "The set containing only $-1, 0, 1$."
        issueSignals:
          - id: domainCondition-error
      - id: c
        text: "The closed interval $[-2, 2]$."
        issueSignals:
          - id: structuralRecognition-error
      - id: d
        text: "All real numbers less than 2."
        issueSignals:
          - id: mathematical-translation-error
    answer:
      choiceId: a
    issueSignals:
      - id: domainCondition-error
    difficultyDimensions:
      - representationTransfer
      - domainCondition
    difficultyEvidence: "Translates set-builder notation with a quadratic inequality into an interval."
    explanation: |
      Solution: The open interval $(-2, 2)$.
      Why it works: The condition $x^2 < 4$ is equivalent to $|x| < 2$, which means $-2 < x < 2$. Since $x \\in \\mathbb{R}$, this is the open interval $(-2, 2)$.
      Why the other choices fail: B incorrectly restricts the domain to integers. C includes the boundaries where $x^2 = 4$. D ignores the negative bounds (e.g., $x=-3$ is less than 2, but $(-3)^2 = 9 > 4$).

  - id: q002
    type: multipleChoice
    prompt: "Which statement is the negation of 'For every student, there is a class they like'?"
    choices:
      - id: a
        text: "There is a student who likes no classes."
      - id: b
        text: "No student likes any class."
        issueSignals:
          - id: logical-negation-error
      - id: c
        text: "There is a class that no student likes."
        issueSignals:
          - id: quantifier-scope-error
      - id: d
        text: "Every student dislikes at least one class."
        issueSignals:
          - id: logical-negation-error
    answer:
      choiceId: a
    issueSignals:
      - id: logical-negation-error
    difficultyDimensions:
      - representationTransfer
      - logicalNegation
      - quantifierScope
    difficultyEvidence: "Negates a nested quantifier statement ($\\forall \\exists \\to \\exists \\forall$)."
    explanation: |
      Solution: There is a student who likes no classes.
      Why it works: Original: $\\forall s \\exists c \\ (L(s,c))$. Negation: $\\exists s \\forall c \\ (\\neg L(s,c))$. In English, this means 'There exists a student such that for all classes, they do not like it', or 'There is a student who likes no classes'.
      Why the other choices fail: B over-negates, changing $\\exists s$ to $\\forall s$. C negates the statement 'For every class, there is a student who likes it'. D just negates the inner predicate but leaves the universal outer quantifier.

  - id: q003
    type: multipleChoice
    prompt: "Evaluate the truth value of the biconditional: '$2+2=5$ if and only if the moon is made of green cheese'."
    choices:
      - id: a
        text: "True, because both statements are false."
      - id: b
        text: "False, because both statements are false."
        issueSignals:
          - id: truthTableApplication-error
      - id: c
        text: "Undefined, because the statements are unrelated."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: d
        text: "False, because $2+2$ does not equal $5$."
        issueSignals:
          - id: truthTableApplication-error
    answer:
      choiceId: a
    issueSignals:
      - id: truthTableApplication-error
    difficultyDimensions:
      - truthTableApplication
      - logicalEquivalence
    difficultyEvidence: "Evaluates the truth value of a biconditional operator with two false operands."
    explanation: |
      Solution: True, because both statements are false.
      Why it works: A biconditional statement $P \\iff Q$ is true when $P$ and $Q$ have the exact same truth value. Since both $2+2=5$ and 'the moon is made of green cheese' are false, the biconditional connecting them evaluates to true.
      Why the other choices fail: B forgets how biconditionals work (they are an equivalence test). C invents a requirement that the statements must be causally related, which is not required in formal logic. D only looks at the left side of the biconditional.

  - id: q004
    type: multipleChoice
    prompt: "A student attempts to prove 'If $n^2$ is odd, then $n$ is odd'. They write: 'Assume $n$ is odd. Then $n=2k+1$. So $n^2 = (2k+1)^2 = 4k^2+4k+1 = 2(2k^2+2k)+1$, which is odd.' What error did the student make?"
    choices:
      - id: a
        text: "They proved the converse statement instead of the requested theorem."
      - id: b
        text: "They made an algebraic error in expanding $(2k+1)^2$."
        issueSignals:
          - id: factual-error
      - id: c
        text: "They should have assumed $n^2$ is even to use proof by contradiction."
        issueSignals:
          - id: applicationStrategy-error
      - id: d
        text: "They did not define what $k$ is."
        issueSignals:
          - id: conventionRecognition-error
    answer:
      choiceId: a
    issueSignals:
      - id: applicationStrategy-error
    difficultyDimensions:
      - errorDiagnosis
      - proofStructure
    difficultyEvidence: "Diagnoses the fallacy of proving $Q \\implies P$ when asked to prove $P \\implies Q$."
    explanation: |
      Solution: They proved the converse statement instead of the requested theorem.
      Why it works: The theorem is 'If $n^2$ is odd ($P$), then $n$ is odd ($Q$)'. The student assumed $n$ is odd ($Q$) and proved $n^2$ is odd ($P$). This is a proof of the converse, not the actual theorem. (A correct proof would use the contrapositive: assuming $n$ is even and proving $n^2$ is even).
      Why the other choices fail: B is incorrect; the algebra is flawless. C is incorrect; assuming $n^2$ is even would be the start of a proof by contradiction for the converse, not the direct theorem. D is a minor expositional flaw, but not the fatal logical error.
