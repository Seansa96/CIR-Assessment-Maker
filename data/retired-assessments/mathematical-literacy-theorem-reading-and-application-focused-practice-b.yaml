questions:
- id: q001
  type: multipleChoice
  prompt: 'A theorem states: ''A matrix is invertible if and only if its determinant is non-zero''. How can you
    apply this theorem?'
  choices:
  - id: a
    text: You can use a non-zero determinant to prove invertibility, AND you can use invertibility to prove the
      determinant is non-zero.
  - id: b
    text: You can only use a non-zero determinant to prove invertibility.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: c
    text: You can only use invertibility to prove the determinant is non-zero.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: You must prove both facts independently before applying the theorem.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - structuralRecognition
  - logicalEquivalence
  difficultyEvidence: Recognizes that a biconditional theorem provides two separate, usable implications.
  explanation: |-
    Solution: You can use a non-zero determinant to prove invertibility, AND you can use invertibility to prove the determinant is non-zero.
    Why it works: The phrase 'if and only if' ($\\iff$) means the implication goes both ways. You can use either condition as the hypothesis to guarantee the other as the conclusion.
    Why the other choices fail: B and C treat the theorem as a one-way implication, ignoring half of its power. D misunderstands the purpose of theorems, which is to derive one unknown fact from a known one.
- id: q002
  type: multipleChoice
  prompt: 'A theorem begins: ''Let $X$ be a compact metric space. If $f: X \to \mathbb{R}$ is continuous, then...''.
    Which of the following is a strict requirement to use this theorem?'
  choices:
  - id: a
    text: The space $X$ must be both a metric space and compact.
  - id: b
    text: The function $f$ must be compact.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: c
    text: The space $X$ must be continuous.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: The output of the function must be a metric space.
    issueSignals:
    - id: mathematical-structure-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Parses the domain declaration constraints ('Let...') that precede the formal 'If... then...'
    structure.
  explanation: |-
    Solution: The space $X$ must be both a metric space and compact.
    Why it works: The 'Let' statement establishes the universe of discourse and the foundational properties of the objects involved. These act as prerequisite hypotheses that must be satisfied before the 'If' clause is even considered.
    Why the other choices fail: B incorrectly applies the property 'compact' to the function instead of the space. C incorrectly applies 'continuous' to the space instead of the function. D misinterprets the codomain $\\mathbb{R}$ as the metric space requirement.
- id: q003
  type: multipleChoice
  prompt: 'A theorem requires two conditions: ''If a sequence is bounded AND monotonic, then it converges.'' Your
    sequence is bounded, but you don''t know if it is monotonic. Can you conclude it converges?'
  choices:
  - id: a
    text: No, because the theorem requires both conditions to be met.
  - id: b
    text: Yes, because satisfying one of the conditions is enough.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: Yes, because bounded sequences are always monotonic.
    issueSignals:
    - id: factual-error
  - id: d
    text: No, because the theorem proves it diverges.
    issueSignals:
    - id: inverse-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - truthTableApplication
  - errorDiagnosis
  difficultyEvidence: Evaluates the strictness of a conjunctive hypothesis (AND) in a theorem.
  explanation: |-
    Solution: No, because the theorem requires both conditions to be met.
    Why it works: A hypothesis connected by 'AND' ($\\land$) means every conjunct must be verified. If even one is missing or unproven, the theorem's trigger is not activated.
    Why the other choices fail: B confuses 'AND' with 'OR'. C asserts a false mathematical fact. D commits the inverse error; failing the hypothesis doesn't guarantee the conclusion is false, it just means the theorem is silent.
- id: q004
  type: multipleChoice
  prompt: If a theorem says 'If $P$ or $Q$, then $R$', and you know $P$ is true, what do you need to know about
    $Q$ to conclude $R$?
  choices:
  - id: a
    text: You don't need to know anything about $Q$.
  - id: b
    text: You must prove $Q$ is also true.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: You must prove $Q$ is false.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: You must prove $Q$ implies $P$.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - truthTableApplication
  - errorDiagnosis
  difficultyEvidence: Evaluates the flexibility of a disjunctive hypothesis (OR) in a theorem.
  explanation: |-
    Solution: You don't need to know anything about $Q$.
    Why it works: A hypothesis connected by 'OR' ($\\lor$) is an inclusive disjunction. As long as at least one condition ($P$) is true, the entire hypothesis ($P \\lor Q$) is true, which is sufficient to trigger the conclusion $R$.
    Why the other choices fail: B treats the 'OR' as an 'AND'. C treats the 'OR' as an exclusive OR ($\\oplus$) which is almost never used in theorem hypotheses. D is irrelevant to evaluating the truth of a disjunction.
