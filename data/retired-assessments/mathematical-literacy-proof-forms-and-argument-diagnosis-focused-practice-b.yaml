questions:
- id: q001
  type: multipleChoice
  prompt: Which annotation correctly reads 'If a number is divisible by 4, then it is even'?
  choices:
  - id: a
    text: The hypothesis is divisibility by 4; the conclusion is evenness.
  - id: b
    text: The hypothesis is evenness; the conclusion is divisibility by 4.
    issueSignals:
    - id: reversed-implication
  - id: c
    text: Both directions are automatically proved.
    issueSignals:
    - id: reversed-implication
  - id: d
    text: The statement is a definition.
    issueSignals:
    - id: reversed-implication
  answer:
    choiceId: a
  issueSignals:
  - id: reversed-implication
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: The hypothesis is divisibility by 4; the conclusion is evenness.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
- id: q002
  type: multipleChoice
  prompt: Which sentence is the correct negation of 'Every member of a set S has property P'?
  choices:
  - id: a
    text: At least one member of S does not have property P.
  - id: b
    text: Every member of S lacks property P.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: At least one member of S has property P.
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: The set S is empty.
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: At least one member of S does not have property P.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
- id: q003
  type: multipleChoice
  prompt: A text gives one value that satisfies a definition. What has it established?
  choices:
  - id: a
    text: An example, not a proof that every value satisfies the claim.
  - id: b
    text: A proof of every related theorem.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: A counterexample to the definition.
    issueSignals:
    - id: example-as-proof
  - id: d
    text: A converse implication.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: An example, not a proof that every value satisfies the claim.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
- id: q004
  type: multipleChoice
  prompt: A proof says 'therefore' after introducing a new claim with no cited reason. What should a careful reader
    do?
  choices:
  - id: a
    text: Ask which definition, hypothesis, or earlier result licenses the step.
  - id: b
    text: Accept it because mathematical prose is concise.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: Treat the new claim as a definition.
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: Reverse the preceding implication.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: Ask which definition, hypothesis, or earlier result licenses the step.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
