items:
- id: r001
  type: typed
  prompt: What can justify a local proof step?
  answer:
    expected: a definition, hypothesis, or earlier result
    aliases:
    - a definition, hypothesis, or earlier result
  explanation: |-
    Solution: a definition, hypothesis, or earlier result.
    Why it works: The source reading convention identifies a cited definition, hypothesis, or earlier result without requiring a new calculation.
- id: r002
  type: typed
  prompt: What proof form proves “if P then Q” by showing “if not Q then not P”?
  answer:
    expected: contrapositive proof
    aliases:
    - contrapositive proof
  explanation: |-
    Solution: contrapositive proof.
    Why it works: The source reading convention identifies contrapositive proof without requiring a new calculation.
- id: r003
  type: cloze
  prompt: What must a proof reader trace for each assertion?
  answer:
    expected: its justification
    aliases:
    - its justification
  explanation: |-
    Solution: its justification.
    Why it works: The source reading convention identifies a justification without requiring a new calculation.
- id: r004
  type: typed
  prompt: What does “therefore” require in a proof?
  answer:
    expected: a warranted inference
    aliases:
    - a warranted inference
  explanation: |-
    Solution: a warranted inference.
    Why it works: The source reading convention identifies a warranted inference without requiring a new calculation.
- id: r005
  type: recognition
  prompt: Which source can license substituting $n=2k$ after assuming n is even?
  choices:
  - id: a
    text: The definition of even.
  - id: b
    text: A related term with the direction or role changed.
    issueSignals:
    - id: mathematical-role-confusion
  - id: c
    text: A numerical example rather than the requested reading.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: An unrelated proof label.
    issueSignals:
    - id: proofStructure-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-structure-recognition-error
  explanation: |-
    Solution: The definition of even..
    Why it works: This is the requested retrieval fact about the definition.
    Why the other choices fail: They change the requested relation, substitute an example for a term, or name an unrelated proof role.
