questions:
- id: q001
  type: multipleChoice
  prompt: What is the correct negation of the statement 'Every integer is a rational number'?
  choices:
  - id: a
    text: There exists an integer that is not a rational number.
  - id: b
    text: No integers are rational numbers.
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: Every integer is an irrational number.
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: There exists a rational number that is not an integer.
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  difficultyEvidence: Negates a universal affirmative statement into an existential negative statement.
  explanation: |-
    Solution: There exists an integer that is not a rational number.
    Why it works: The negation of 'For all $x$, $P(x)$' is 'There exists an $x$ such that not $P(x)$'. To disprove a universal claim, you must assert the existence of a counterexample.
    Why the other choices fail: B and C over-negate by making universal claims about the failure of the property. D swaps the roles of the sets.
- id: q002
  type: multipleChoice
  prompt: How would you translate 'Every real number has a real cube root' into formal logic?
  choices:
  - id: a
    text: '$\forall x \in \mathbb{R}, \exists y \in \mathbb{R}, y^3 = x$'
  - id: b
    text: '$\exists y \in \mathbb{R}, \forall x \in \mathbb{R}, y^3 = x$'
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: '$\forall x \in \mathbb{R}, \forall y \in \mathbb{R}, y^3 = x$'
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: '$\exists x \in \mathbb{R}, \exists y \in \mathbb{R}, y^3 = x$'
    issueSignals:
    - id: logical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - representationTransfer
  - quantifierScope
  difficultyEvidence: 'Correctly orders nested quantifiers ($\forall$ followed by $\exists$) to express a dependency.'
  explanation: |-
    Solution: $\\forall x \\in \\mathbb{R}, \\exists y \\in \\mathbb{R}, y^3 = x$
    Why it works: 'Every real number' is the universal quantifier $\\forall x$. 'Has a cube root' means there exists some $y$ such that $y^3=x$, using the existential quantifier $\\exists y$. The $y$ depends on the $x$, so $\\exists y$ must follow $\\forall x$.
    Why the other choices fail: B asserts there is one single universal cube root for all numbers. C asserts that every number is the cube root of every other number. D only asserts that at least one number has a cube root.
- id: q003
  type: multipleChoice
  prompt: What is the correct negation of 'There exists a continuous function that is nowhere differentiable'?
  choices:
  - id: a
    text: Every continuous function is differentiable at least somewhere.
  - id: b
    text: No continuous function is differentiable anywhere.
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: Every continuous function is everywhere differentiable.
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: There exists a continuous function that is everywhere differentiable.
    issueSignals:
    - id: logical-negation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  difficultyEvidence: Applies De Morgan's laws to negate a complex existential statement involving an implicit universal
    claim ('nowhere').
  explanation: |-
    Solution: Every continuous function is differentiable at least somewhere.
    Why it works: The original statement is $\\exists f \\ (C(f) \\land \\forall x \\ \\neg D(f, x))$. Negating this gives $\\forall f \\ (C(f) \\implies \\exists x \\ D(f, x))$, which translates to 'every continuous function is differentiable at some point'.
    Why the other choices fail: B is logically equivalent to the original claim, not its negation. C over-negates 'nowhere' to 'everywhere' instead of 'somewhere'. D changes the quantifier incorrectly.
- id: q004
  type: multipleChoice
  prompt: 'Consider the statements $P$: ''For every patient, there is a nurse assigned to them'' and $Q$: ''There
    is a nurse assigned to every patient''. What is the relationship between them?'
  choices:
  - id: a
    text: $Q$ implies $P$, but $P$ does not imply $Q$.
  - id: b
    text: $P$ implies $Q$, but $Q$ does not imply $P$.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: $P$ and $Q$ are logically equivalent.
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: They contradict each other.
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - representationTransfer
  - quantifierScope
  difficultyEvidence: 'Analyzes the direction of implication between $\exists y \forall x$ and $\forall x \exists
    y$ claims.'
  explanation: |-
    Solution: $Q$ implies $P$, but $P$ does not imply $Q$.
    Why it works: $Q$ claims there is one 'super-nurse' assigned to everyone ($\\exists n \\forall p$). If this is true, then $P$ ($\\forall p \\exists n$) is trivially true because you can just point to the super-nurse for each patient. However, $P$ allows each patient to have a different nurse, which would make $Q$ false.
    Why the other choices fail: B gets the implication backward. C fails to recognize the semantic difference between the quantifier orderings. D is false since they can both be true simultaneously.
