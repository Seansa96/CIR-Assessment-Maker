questions:
  - id: q001
    type: multipleChoice
    prompt: "When attempting to prove or disprove a new, complex universal conjecture (e.g., 'For all graphs $G$...'), what is usually the most mathematically productive first heuristic step?"
    choices:
      - id: a
        text: "Test the conjecture on very small, trivial, or extreme examples (like the empty graph or a triangle)."
      - id: b
        text: "Attempt to write a formal proof by induction immediately."
        issueSignals:
          - id: applicationStrategy-error
      - id: c
        text: "Assume the conjecture is false and attempt a proof by contradiction."
        issueSignals:
          - id: applicationStrategy-error
      - id: d
        text: "Search for a highly complex, random example to ensure rigor."
        issueSignals:
          - id: applicationStrategy-error
    answer:
      choiceId: a
    issueSignals:
      - id: applicationStrategy-error
    difficultyDimensions:
      - applicationStrategy
      - conceptualUnderstanding
    difficultyEvidence: "Identifies boundary testing as a primary heuristic for intuition building and counterexample hunting."
    explanation: |
      Solution: Test the conjecture on very small, trivial, or extreme examples (like the empty graph or a triangle).
      Why it works: Small or degenerate examples are easy to compute by hand. They quickly build intuition about why the conjecture might be true, or they provide an immediate, cheap counterexample that saves you from wasting hours trying to prove a false statement.
      Why the other choices fail: B and C jump to formal proof techniques before the solver even understands the statement's behavior. D is highly inefficient; complex examples are hard to calculate and rarely provide clear intuition.

  - id: q002
    type: multipleChoice
    prompt: "You observe a sequence of values for $n = 1, 2, 3, 4, 5$ yielding $1, 2, 4, 8, 16$. What is the greatest risk of using pattern recognition to conclude the formula is $2^{n-1}$?"
    choices:
      - id: a
        text: "The pattern may unexpectedly break at higher values of $n$, as empirical observation does not constitute a proof."
      - id: b
        text: "The formula $2^{n-1}$ is only valid for continuous functions, not discrete sequences."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: c
        text: "Pattern recognition is not allowed in formal mathematics."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: d
        text: "The sequence might actually be alternating in sign, which is hidden by the first five terms."
        issueSignals:
          - id: factual-error
    answer:
      choiceId: a
    issueSignals:
      - id: conceptual-misunderstanding
    difficultyDimensions:
      - logicalEvaluation
      - errorDiagnosis
    difficultyEvidence: "Distinguishes inductive reasoning (pattern recognition) from deductive proof, recognizing the limitations of the former."
    explanation: |
      Solution: The pattern may unexpectedly break at higher values of $n$, as empirical observation does not constitute a proof.
      Why it works: A classic example in geometry (regions of a circle divided by chords) yields $1, 2, 4, 8, 16...$ but then $31$. A finite number of observations can fit infinitely many different polynomials or formulas. It is a heuristic to guess the formula, but a proof is still required.
      Why the other choices fail: B is factually false (exponentials work fine for sequences). C is false; pattern recognition is how most theorems are discovered. D is highly unlikely and misses the fundamental epistemological limit of finite observation.

  - id: q003
    type: multipleChoice
    prompt: "How does the heuristic of 'working backward' (retrograde analysis) assist in constructing a direct proof?"
    choices:
      - id: a
        text: "It helps identify the intermediate logical steps by asking 'What statement would immediately imply my desired conclusion?'."
      - id: b
        text: "It proves the theorem by starting with the conclusion and deriving the hypothesis."
        issueSignals:
          - id: logical-evaluation-error
      - id: c
        text: "It is a formal proof technique equivalent to proof by contradiction."
        issueSignals:
          - id: structuralRecognition-error
      - id: d
        text: "It eliminates the need to state the initial assumptions."
        issueSignals:
          - id: applicationStrategy-error
    answer:
      choiceId: a
    issueSignals:
      - id: logical-evaluation-error
    difficultyDimensions:
      - applicationStrategy
      - conceptualUnderstanding
    difficultyEvidence: "Defines retrograde analysis as a discovery heuristic rather than a formal proof structure."
    explanation: |
      Solution: It helps identify the intermediate logical steps by asking 'What statement would immediately imply my desired conclusion?'.
      Why it works: Working backward is a scratchpad discovery technique. You trace logical requirements backward from the goal until you reach the givens. You then write the formal proof forward.
      Why the other choices fail: B describes the fallacy of the converse ($Q \implies P$). C is incorrect; it is a discovery tool, not a formal logical structure like contradiction. D is false; assumptions must always be stated in the final proof.

  - id: q004
    type: multipleChoice
    prompt: "You are trying to solve a difficult problem with three complex conditions. A common heuristic is to temporarily 'drop' or weaken one of the conditions. Why is this useful?"
    choices:
      - id: a
        text: "It creates a simpler, related problem whose solution might provide insight or structure for the original, harder problem."
      - id: b
        text: "It allows you to prove the theorem faster, since fewer conditions mean less writing."
        issueSignals:
          - id: logical-evaluation-error
      - id: c
        text: "It automatically proves the original theorem by generalizing it."
        issueSignals:
          - id: logical-evaluation-error
      - id: d
        text: "It guarantees that the problem has at least one solution."
        issueSignals:
          - id: conceptual-misunderstanding
    answer:
      choiceId: a
    issueSignals:
      - id: logical-evaluation-error
    difficultyDimensions:
      - applicationStrategy
      - conceptualUnderstanding
    difficultyEvidence: "Identifies the purpose of problem simplification (Polya's heuristic) in mathematical discovery."
    explanation: |
      Solution: It creates a simpler, related problem whose solution might provide insight or structure for the original, harder problem.
      Why it works: This is a core problem-solving strategy (often associated with George Polya). By solving a relaxed version of the problem, you map out the general territory. You then reintroduce the complex condition to refine your approach.
      Why the other choices fail: B and C wrongly suggest that solving the simpler problem actually constitutes a proof of the harder problem (it doesn't). D is false; dropping a condition doesn't guarantee a solution exists.
