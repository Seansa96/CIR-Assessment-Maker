lesson:
  introduction: 'This lesson practices one reading action: read an expression by naming its object, variable, and
    restriction.'
  sections:
  - id: s01
    title: Locate the mathematical object
    content: First identify whether the passage defines an object, states a claim, or justifies a claim. This prevents
      symbols from being read as detached calculations.
  - id: s02
    title: Mark the scope
    content: Underline declarations and conditions before deciding what a statement says. A variable only has the
      role assigned by its local context.
  - id: s03
    title: Translate before evaluating
    content: Say the claim in a full sentence, then check whether every restriction survived your translation.
  - id: s04
    title: Record the dependency
    content: When a line uses a definition, hypothesis, or earlier result, write that reason in the margin. A proof
      is a chain of licensed moves.
