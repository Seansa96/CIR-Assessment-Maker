questions:
  - id: q001
    type: multipleChoice
    prompt: "You are trying to find a counterexample to the claim 'Every continuous function on $(0,1)$ is bounded'. Which of the following is the most mathematically productive heuristic?"
    choices:
      - id: a
        text: "Test functions whose values explode near the boundary points $0$ or $1$, like $1/x$."
      - id: b
        text: "Test very complicated polynomials of high degree."
        issueSignals:
          - id: applicationStrategy-error
      - id: c
        text: "Attempt to write a direct proof first to see where it breaks."
        issueSignals:
          - id: applicationStrategy-error
      - id: d
        text: "Test periodic functions like $\\sin(x)$."
        issueSignals:
          - id: applicationStrategy-error
    answer:
      choiceId: a
    issueSignals:
      - id: applicationStrategy-error
    difficultyDimensions:
      - applicationStrategy
      - conceptualUnderstanding
    difficultyEvidence: "Applies the heuristic of checking boundary/extreme behavior to find a counterexample to a universal claim."
    explanation: |
      Solution: Test functions whose values explode near the boundary points $0$ or $1$, like $1/x$.
      Why it works: Since the interval $(0,1)$ is open, it does not contain its endpoints. A common heuristic for finding unbounded behavior is to look at functions with vertical asymptotes exactly at those missing boundary points. $f(x) = 1/x$ is continuous on $(0,1)$ but goes to infinity as $x \\to 0$.
      Why the other choices fail: B is useless; all polynomials are bounded on finite intervals. C is a waste of time if you already suspect it's false. D is useless; sine and cosine are inherently bounded everywhere.

  - id: q002
    type: multipleChoice
    prompt: "Translate the condition $x \\in [a, b)$ into code (assuming $x, a, b$ are numbers)."
    choices:
      - id: a
        text: "`a <= x and x < b`"
      - id: b
        text: "`a < x and x <= b`"
        issueSignals:
          - id: domainCondition-error
      - id: c
        text: "`a <= x and x <= b`"
        issueSignals:
          - id: domainCondition-error
      - id: d
        text: "`a < x and x < b`"
        issueSignals:
          - id: domainCondition-error
    answer:
      choiceId: a
    issueSignals:
      - id: domainCondition-error
    difficultyDimensions:
      - representationTransfer
      - domainCondition
    difficultyEvidence: "Translates a half-open mathematical interval into strict and inclusive code operators."
    explanation: |
      Solution: `a <= x and x < b`
      Why it works: The square bracket $[$ means inclusive ($a \\le x$), and the parenthesis $)$ means exclusive ($x < b$).
      Why the other choices fail: B is the interval $(a, b]$. C is the closed interval $[a, b]$. D is the open interval $(a, b)$.

  - id: q003
    type: multipleChoice
    prompt: "How does a mathematical definition differ from a proposition?"
    choices:
      - id: a
        text: "A definition is an agreement on terminology and cannot be proven, whereas a proposition asserts a truth that requires proof."
      - id: b
        text: "A definition is always true, whereas a proposition might be false."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: c
        text: "A definition describes objects, whereas a proposition describes operations."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: d
        text: "They are the same thing; both are assumed to be true without proof."
        issueSignals:
          - id: conceptual-misunderstanding
    answer:
      choiceId: a
    issueSignals:
      - id: conceptual-misunderstanding
    difficultyDimensions:
      - conceptualUnderstanding
      - conventionRecognition
    difficultyEvidence: "Distinguishes declarative naming conventions from logical claims."
    explanation: |
      Solution: A definition is an agreement on terminology and cannot be proven, whereas a proposition asserts a truth that requires proof.
      Why it works: You cannot prove that a prime number is defined the way it is; it's a choice of words. You *can* prove a proposition, such as 'there are infinitely many prime numbers', because it asserts a relationship or fact about the defined objects.
      Why the other choices fail: B incorrectly assigns truth values to definitions. C creates an arbitrary subject divide. D confuses definitions with axioms (which are assumed truths).

  - id: q004
    type: multipleChoice
    prompt: "If a theorem states 'If $f$ is continuous, then $f$ is integrable', and you want to prove a function $g$ is NOT continuous by using this theorem, what must you do?"
    choices:
      - id: a
        text: "Prove that $g$ is NOT integrable, and invoke the contrapositive."
      - id: b
        text: "Prove that $g$ IS integrable, and invoke the inverse."
        issueSignals:
          - id: logical-evaluation-error
      - id: c
        text: "The theorem cannot be used to prove a function is not continuous."
        issueSignals:
          - id: applicationStrategy-error
      - id: d
        text: "Assume $g$ is not continuous and look for a contradiction."
        issueSignals:
          - id: applicationStrategy-error
    answer:
      choiceId: a
    issueSignals:
      - id: applicationStrategy-error
    difficultyDimensions:
      - applicationStrategy
      - logicalEquivalence
    difficultyEvidence: "Applies the contrapositive of a theorem to deduce the falsity of a hypothesis."
    explanation: |
      Solution: Prove that $g$ is NOT integrable, and invoke the contrapositive.
      Why it works: The theorem is $C \implies I$. Its contrapositive is $\\neg I \implies \\neg C$. If you want to conclude $\\neg C$ (not continuous), you must satisfy the hypothesis of the contrapositive, which means proving $\\neg I$ (not integrable).
      Why the other choices fail: B uses the inverse, which is logically invalid. C is false because the contrapositive is always a valid application of a theorem. D is the start of a proof by contradiction, but doesn't explain how to use the theorem itself.
