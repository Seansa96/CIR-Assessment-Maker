questions:
  - id: q001
    type: multipleChoice
    prompt: "In mathematical problem solving, what is the fundamental difference between a heuristic and an algorithm?"
    choices:
      - id: a
        text: "An algorithm guarantees a correct solution if followed exactly, whereas a heuristic is a rule of thumb that helps guide discovery but offers no guarantees."
      - id: b
        text: "A heuristic is used in geometry, while algorithms are used in algebra."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: c
        text: "An algorithm is executed by computers, whereas heuristics can only be executed by humans."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: d
        text: "A heuristic is a formal mathematical proof, while an algorithm is just a calculation."
        issueSignals:
          - id: conceptual-misunderstanding
    answer:
      choiceId: a
    issueSignals:
      - id: conceptual-misunderstanding
    difficultyDimensions:
      - conceptualUnderstanding
      - conventionRecognition
    difficultyEvidence: "Differentiates between deterministic procedures (algorithms) and exploratory strategies (heuristics)."
    explanation: |
      Solution: An algorithm guarantees a correct solution if followed exactly, whereas a heuristic is a rule of thumb that helps guide discovery but offers no guarantees.
      Why it works: Algorithms (like long division or the quadratic formula) are deterministic step-by-step processes. Heuristics (like 'draw a picture', 'work backward', or 'test small numbers') are strategies that make finding a solution more likely, but they can fail or lead to dead ends.
      Why the other choices fail: B creates an arbitrary subject divide. C is false (computers use heuristic search algorithms all the time, e.g., in chess). D incorrectly equates heuristics with proofs.

  - id: q002
    type: multipleChoice
    prompt: "When solving a geometry problem about a general triangle, a student decides to test the extreme case where one angle approaches 180 degrees (a 'flat' triangle). Why is this a powerful heuristic?"
    choices:
      - id: a
        text: "Extreme cases often reduce complex 2D relationships into simpler 1D relationships that are easier to calculate and verify."
      - id: b
        text: "It proves that the theorem holds for all triangles by the principle of continuity."
        issueSignals:
          - id: logical-evaluation-error
      - id: c
        text: "Extreme cases are the only cases required for a rigorous proof in geometry."
        issueSignals:
          - id: logical-evaluation-error
      - id: d
        text: "It automatically identifies the exact angles of the triangle in question."
        issueSignals:
          - id: conceptual-misunderstanding
    answer:
      choiceId: a
    issueSignals:
      - id: logical-evaluation-error
    difficultyDimensions:
      - applicationStrategy
      - conceptualUnderstanding
    difficultyEvidence: "Identifies the mechanical advantage of examining degenerate or extreme bounds during problem exploration."
    explanation: |
      Solution: Extreme cases often reduce complex 2D relationships into simpler 1D relationships that are easier to calculate and verify.
      Why it works: A 'flat' triangle essentially becomes a line segment. The math collapses into simple addition and subtraction. If a proposed formula for the triangle fails on this simple 1D extreme case, the formula is wrong, saving the student from a complex proof attempt.
      Why the other choices fail: B and C incorrectly elevate a testing heuristic to the level of a formal proof. D is nonsensical; testing an extreme case doesn't solve for specific unknowns in a standard problem.

  - id: q003
    type: multipleChoice
    prompt: "You are tasked with finding the maximum value of $f(x, y) = xy$ given that $x + y = 10$. You suspect the maximum occurs when $x = y = 5$. What heuristic principle strongly suggests this guess?"
    choices:
      - id: a
        text: "The principle of symmetry, as the function and the constraint are perfectly symmetric with respect to $x$ and $y$."
      - id: b
        text: "The principle of mathematical induction."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: c
        text: "The pigeonhole principle."
        issueSignals:
          - id: conceptual-misunderstanding
      - id: d
        text: "The well-ordering principle."
        issueSignals:
          - id: conceptual-misunderstanding
    answer:
      choiceId: a
    issueSignals:
      - id: conceptual-misunderstanding
    difficultyDimensions:
      - applicationStrategy
      - structuralRecognition
    difficultyEvidence: "Recognizes symmetry in algebraic constraints and objective functions as a predictor of extremal behavior."
    explanation: |
      Solution: The principle of symmetry, as the function and the constraint are perfectly symmetric with respect to $x$ and $y$.
      Why it works: If you swap $x$ and $y$, the problem remains exactly the same ($yx = xy$ and $y+x = 10$). Because the problem cannot distinguish between $x$ and $y$, it is highly likely (though it still requires proof) that the unique maximum occurs when the variables are equal.
      Why the other choices fail: B (induction) is for integers/sequences. C (pigeonhole) is for counting discrete objects. D (well-ordering) is for subsets of natural numbers. None apply to continuous optimization.

  - id: q004
    type: multipleChoice
    prompt: "A student notices that for $n=1, 2, 3$, the polynomial $n^2 + n + 41$ produces prime numbers (43, 47, 53). They use the heuristic of pattern recognition to claim it produces primes for all $n$. What is the easiest way to disprove this?"
    choices:
      - id: a
        text: "Test the extreme case where $n = 41$, since $41^2 + 41 + 41$ is clearly divisible by 41."
      - id: b
        text: "Take the derivative of the polynomial to show it is not constant."
        issueSignals:
          - id: applicationStrategy-error
      - id: c
        text: "Prove that no polynomial can ever produce a prime number."
        issueSignals:
          - id: factual-error
      - id: d
        text: "Test $n=4$, because patterns always break on the fourth term."
        issueSignals:
          - id: conceptual-misunderstanding
    answer:
      choiceId: a
    issueSignals:
      - id: applicationStrategy-error
    difficultyDimensions:
      - applicationStrategy
      - logicalEvaluation
    difficultyEvidence: "Applies structural inspection (noticing the constant term 41) to deliberately construct a counterexample, bypassing brute force."
    explanation: |
      Solution: Test the extreme case where $n = 41$, since $41^2 + 41 + 41$ is clearly divisible by 41.
      Why it works: Instead of testing $n=4, 5, 6...$ blindly, looking at the structure of the polynomial reveals a vulnerability. If $n=41$, every term in $41^2 + 41 + 41$ shares a factor of 41, meaning the sum factors to $41(41 + 1 + 1) = 41 \\times 43$, which is composite.
      Why the other choices fail: B uses calculus which has no bearing on prime number generation. C is a false statement (e.g., $f(n)=3$ is a polynomial that always produces a prime). D is a superstitious and false heuristic.
