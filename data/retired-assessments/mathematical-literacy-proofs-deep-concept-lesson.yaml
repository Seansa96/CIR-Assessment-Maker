lesson:
  introduction: 'This lesson practices one reading action: map each proof claim to a stated reason or earlier result.'
  sections:
  - id: s01
    title: Locate the mathematical object
    content: First identify whether the passage defines an object, states a claim, or justifies a claim. This prevents
      symbols from being read as detached calculations.
    check:
      id: check-001
      type: multipleChoice
      prompt: While reading “Locate the mathematical object,” which action best preserves the mathematical meaning?
      choices:
      - id: a
        text: Name the object, condition, and relation actually stated.
      - id: b
        text: Replace the condition with a familiar example.
        issueSignals:
        - id: mathematical-structure-recognition-error
      - id: c
        text: Reverse the implication before checking it.
        issueSignals:
        - id: mathematical-structure-recognition-error
      - id: d
        text: Treat a label as proof that the claim is true.
        issueSignals:
        - id: mathematical-structure-recognition-error
      answer:
        choiceId: a
      issueSignals:
      - id: mathematical-structure-recognition-error
      difficultyDimensions:
      - errorDiagnosis
      - representationTransfer
      - proofJustification
      difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
        claim.
      explanation: |-
        Solution: Name the object, condition, and relation actually stated.
        Why it works: Careful mathematical reading keeps the declared object, condition, and logical direction visible.
        Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
