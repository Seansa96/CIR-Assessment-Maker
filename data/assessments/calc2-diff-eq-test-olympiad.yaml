questions:
- id: q-ch9-adv-050-0
  type: freeResponse
  issueSignals:
  - id: boundary-condition-failure
  - id: u-substitution-failure
  - id: algebraic-simplification-error
  - id: chain-rule-missed
  - id: product-rule-misapplied
  - id: logarithm-property-misapplied
  prompt: Solve the non-linear Riccati equation y' = y^2 + x.
  answer:
    gradingMode: selfCheck
    points: 1
    explanation: '**Answer:** Requires Bessel functions.


      **Solution Outline:** Substitute y = -u''/u to transform into Airy''s equation.'
