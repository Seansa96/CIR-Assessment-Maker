items:
- id: r001
  type: typed
  prompt: In C#, what character is required to enclose the boolean condition of an
    `if` statement?
  answer:
    expected: )
    aliases:
    - (
    - Parentheses
- id: r002
  type: typed
  prompt: In a standard C# `switch` statement, what keyword MUST be placed at the
    end of every non-empty case to prevent fall-through?
  answer:
    expected: break
    aliases:
    - break;
- id: r003
  type: typed
  prompt: In a C# switch statement, what keyword catches any values that did not match
    the specific cases?
  answer:
    expected: default
    aliases:
    - 'default:'
- id: r004
  type: typed
  prompt: In a C# 8+ switch EXPRESSION, what character acts as the wildcard or default
    case pattern?
  answer:
    expected: _
    aliases:
    - underscore
- id: r005
  type: typed
  prompt: What loop structure is specifically designed to iterate over every item
    in an array or List without using an index?
  answer:
    expected: foreach
- id: r006
  type: flashcard
  prompt: What does the `continue;` keyword do inside a loop?
  answer:
    expected: It immediately skips the rest of the current iteration and jumps back
      to the start of the next iteration.
- id: r007
  type: typed
  prompt: In C#,\rhow do you write the logical "AND" operator?
  answer:
    expected: '&&'
- id: r008
  type: typed
  prompt: In C#,\rhow do you write the logical "OR" operator?
  answer:
    expected: '||'
