  prompt: |-
    Classify $\sum_{n=1}^\infty(-1)^n/(n^2+1)$ and justify your answer.
  answer:
    gradingMode: selfCheck
    checkModel: Absolutely convergent by comparison with the convergent p-series sum 1/n^2.
  explanation: |-
    Solution: $1/(n^2+1)\le1/n^2$, so the absolute-value series converges. Answer check: Absolutely convergent by comparison with the convergent p-series sum 1/n^2.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.
