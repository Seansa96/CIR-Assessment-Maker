modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 20
authoring:
  visualRequirement: notApplicable
  visualRationale: Series classification and convergence proofs are symbolic; a diagram would not materially improve the required analysis.
  difficultyTier: easy
questions:
- id: q001
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^{n-1}/n$ as absolute, conditional, or divergent. State the test(s) used.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent; alternating-series test converges and the harmonic absolute-value series diverges. }
  explanation: The terms $1/n$ decrease to zero, but their absolute values form the divergent harmonic series.
- id: q002
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^n/(n^2+1)$ and justify your answer.
  answer: { gradingMode: selfCheck, checkModel: Absolutely convergent by comparison with the convergent p-series sum 1/n^2. }
  explanation: $1/(n^2+1)\le1/n^2$, so the absolute-value series converges.
- id: q003
  type: freeResponse
  prompt: For which real $p$ is $\sum_{n=1}^\infty(-1)^{n-1}/n^p$ conditionally convergent?
  answer: { gradingMode: selfCheck, checkModel: '0<p<=1.' }
  explanation: Alternation gives convergence for $p>0$; absolute convergence begins only when $p>1$.
- id: q004
  type: freeResponse
  prompt: Decide whether $\sum_{n=1}^\infty(-1)^n3^n/n!$ is absolute, conditional, or divergent.
  answer: { gradingMode: selfCheck, checkModel: Absolutely convergent; the ratio test on 3^n/n! has limit 0. }
  explanation: Factorial growth wins against the exponential factor.
- id: q005
  type: freeResponse
  prompt: Explain why $\sum_{n=1}^\infty(-1)^n n/(n+1)$ diverges.
  answer: { gradingMode: selfCheck, checkModel: The terms approach alternating plus-or-minus 1 rather than 0, so the nth-term test gives divergence. }
  explanation: A convergent series must have terms tending to zero.
- id: q006
  type: freeResponse
  prompt: Classify $\sum_{n=2}^\infty(-1)^n/(n\ln n)$.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent; alternating-series test converges while the positive series diverges by the integral test. }
  explanation: The positive terms decrease to zero, but $\sum1/(n\ln n)$ diverges.
- id: q007
  type: freeResponse
  prompt: If $\sum a_n$ converges absolutely, what can you conclude about $\sum a_n$? Give the theorem in words.
  answer: { gradingMode: selfCheck, checkModel: It converges, because convergence of sum |a_n| implies convergence of sum a_n. }
  explanation: Absolute convergence is the stronger property.
- id: q008
  type: freeResponse
  prompt: Does changing finitely many terms of a conditionally convergent series change its convergence classification? Explain.
  answer: { gradingMode: selfCheck, checkModel: No; a finite change changes only a finite partial-sum offset, not convergence or absolute convergence. }
  explanation: Tails determine convergence.
- id: q009
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^{n-1}\arctan(1/n)$.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent; arctan(1/n) decreases to 0 and is limit-comparable to 1/n. }
  explanation: The alternating test applies, while the magnitudes have harmonic-size behavior.
- id: q010
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^n(\sqrt{n+1}-\sqrt n)$.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent; the positive magnitudes decrease to 0 and telescope to an unbounded sum. }
  explanation: The absolute-value partial sums equal $\sqrt{N+1}-1$.
- id: q011
  type: freeResponse
  prompt: A series $\sum a_n$ is conditionally convergent. What can you conclude about $\sum|a_n|$?
  answer: { gradingMode: selfCheck, checkModel: It diverges. }
  explanation: Conditional convergence means convergence without absolute convergence.
- id: q012
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^n/n!$.
  answer: { gradingMode: selfCheck, checkModel: Absolutely convergent by the ratio test. }
  explanation: The ratio of successive magnitudes is $1/(n+1)$, which tends to zero.
- id: q013
  type: freeResponse
  prompt: If $\sum a_n$ is absolutely convergent and $\sum b_n$ is conditionally convergent, classify $\sum(a_n+b_n)$.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent. }
  explanation: The sum converges, while absolute convergence would force the conditional component to be absolute after subtracting $a_n$.
- id: q014
  type: freeResponse
  prompt: State the three hypotheses needed to use the alternating-series test for $\sum(-1)^{n-1}b_n$.
  answer: { gradingMode: selfCheck, checkModel: b_n is nonnegative, eventually nonincreasing, and tends to 0. }
  explanation: These conditions control the alternating partial sums.
- id: q015
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^{n-1}\sin(1/n)$.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent; sin(1/n) decreases to 0 and is limit-comparable to 1/n. }
  explanation: $\sin x/x\to1$ as $x\to0$.
- id: q016
  type: freeResponse
  prompt: Explain why an absolutely convergent real series may be rearranged without changing its sum.
  answer: { gradingMode: selfCheck, checkModel: Absolute convergence controls the total omitted tail, so every rearrangement has the same limiting sum. }
  explanation: This is the rearrangement theorem for absolutely convergent series.
- id: q017
  type: freeResponse
  prompt: What extra behavior can rearrangements of a conditionally convergent real series exhibit?
  answer: { gradingMode: selfCheck, checkModel: They can converge to a different prescribed real sum or diverge, under suitable rearrangement. }
  explanation: Conditional convergence does not provide rearrangement invariance.
- id: q018
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^{n-1}/\sqrt n$.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent. }
  explanation: The alternating test applies, but the absolute p-series has $p=1/2$ and diverges.
- id: q019
  type: freeResponse
  prompt: Classify $\sum_{n=1}^\infty(-1)^n\,n/(n^2+4)$.
  answer: { gradingMode: selfCheck, checkModel: Conditionally convergent; it alternates with magnitudes decreasing to zero and is limit-comparable to 1/n. }
  explanation: Its absolute-value series has harmonic behavior.
- id: q020
  type: freeResponse
  prompt: If $\sum|a_n|$ converges, prove in one sentence that $a_n\to0$.
  answer: { gradingMode: selfCheck, checkModel: Since a convergent series has terms tending to 0, |a_n| tends to 0, hence a_n tends to 0. }
  explanation: This necessary condition follows from convergence of the absolute-value series.
