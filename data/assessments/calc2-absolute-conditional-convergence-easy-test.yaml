  prompt: |-
    Classify $\sum_{n=1}^\infty(-1)^{n-1}/n$ as absolute, conditional, or divergent. State the test(s) used.
  answer:
    gradingMode: selfCheck
    checkModel: Conditionally convergent; alternating-series test converges and the harmonic absolute-value series diverges.
  explanation: |-
    Solution: The terms $1/n$ decrease to zero, but their absolute values form the divergent harmonic series.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.
