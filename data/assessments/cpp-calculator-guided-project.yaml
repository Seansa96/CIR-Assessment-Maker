guidedProject:
  language: cpp
  instructions: 'Build a small `UnitConverter` class that converts between miles and
    kilometers.


    The app will handle compiling and running hidden checks. Do not write `main()`.


    Required behavior:

    - Create a class named exactly `UnitConverter`.

    - Create a public method named exactly `milesToKm` that takes a `double miles`
    and returns a `double`. (Use `km = miles * 1.60934`)

    - Create a public method named exactly `kmToMiles` that takes a `double km` and
    returns a `double`. (Use `miles = km / 1.60934`)

    - Create a public method named exactly `formatOutput` that takes a `double value`
    and a `string unit` and returns a string like `"10.5 km"` or `"5 miles"`. (Use
    `to_string(value) + " " + unit`)

    '
  files:
  - path: UnitConverter.h
    readOnly: false
    content: "#pragma once\n#include <string>\n\nusing namespace std;\n\nclass UnitConverter\
      \ {\npublic:\n    // Add milesToKm(double miles)\n    \n    // Add kmToMiles(double\
      \ km)\n    \n    // Add formatOutput(double value, string unit)\n};\n"
  - path: ProjectNotes.md
    readOnly: true
    content: 'Required names:

      - `UnitConverter`

      - `milesToKm`

      - `kmToMiles`

      - `formatOutput`

      '
  requiredChecks:
  - id: miles-to-km
    title: milesToKm calculates correctly
    description: Check if milesToKm(10.0) returns 16.0934
    expectedOutputContains:
    - MILES_OK
    testCode: "#include \"UnitConverter.h\"\n#include <iostream>\n#include <cmath>\n\
      \nint main() {\n    UnitConverter uc;\n    if (abs(uc.milesToKm(10.0) - 16.0934)\
      \ < 0.001) {\n        cout << \"MILES_OK\";\n    } else {\n        cout << \"\
      FAIL:\" << uc.milesToKm(10.0);\n    }\n    return 0;\n}\n"
  - id: km-to-miles
    title: kmToMiles calculates correctly
    description: Check if kmToMiles(16.0934) returns 10.0
    expectedOutputContains:
    - KM_OK
    testCode: "#include \"UnitConverter.h\"\n#include <iostream>\n#include <cmath>\n\
      \nint main() {\n    UnitConverter uc;\n    if (abs(uc.kmToMiles(16.0934) - 10.0)\
      \ < 0.001) {\n        cout << \"KM_OK\";\n    } else {\n        cout << \"FAIL:\"\
      \ << uc.kmToMiles(16.0934);\n    }\n    return 0;\n}\n"
  - id: format-output
    title: formatOutput strings match
    description: Check if formatOutput(5.0, "miles") combines them.
    expectedOutputContains:
    - FORMAT_OK
    testCode: "#include \"UnitConverter.h\"\n#include <iostream>\n\nint main() {\n\
      \    UnitConverter uc;\n    string res = uc.formatOutput(5.0, \"miles\");\n\
      \    // to_string(5.0) adds trailing zeros like \"5.000000 miles\"\n    if (res.find(\"\
      5.0\") != string::npos && res.find(\"miles\") != string::npos) {\n        cout\
      \ << \"FORMAT_OK\";\n    } else {\n        cout << \"FAIL:\" << res;\n    }\n\
      \    return 0;\n}\n"
