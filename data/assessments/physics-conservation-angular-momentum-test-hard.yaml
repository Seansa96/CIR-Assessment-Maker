questions:
- id: q1
  type: numericResponse
  prompt: A star of radius $R_0$ rotates with period $T_0$. It collapses to a neutron
    star of radius $R = R_0/100$, losing no mass. What is the ratio of its new rotational
    period to its old period ($T / T_0$)? Assume a uniform sphere. Enter 0.0001 as
    0.00010.
  answer:
    value: 0.0001
    tolerance: 0.00005
  explanation: $I_0\omega_0 = I_f\omega_f \implies R_0^2 (2\pi/T_0) = (R_0/100)^2
    (2\pi/T)$. $T = T_0 / 10000 = 10^{-4} T_0$.
