workedExamples:
  - id: ex-29-1
    title: Topic 29 Example 1 - Order and Variables
    problem: |
      Determine the order and the implied dependent and independent variables for: $y' = 1 + 7x - 4y$
    steps:
      - id: step-29-1-1
        title: Identify the highest derivative
        instruction: |
          Look at the derivatives present.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the highest derivative, and what does it imply about the variables?
        choices:
          - id: c1
            text: First derivative y is dependent on x.
          - id: c2
            text: Second derivative x is dependent on y.
        answer:
          choiceId: c1
          explanation: |
            The highest derivative is $y'$, which implies $\frac{dy}{dx}$. Thus it is first-order, $y$ is dependent, and $x$ is independent.

  - id: ex-29-2
    title: Topic 29 Example 2 - Verifying a Solution
    problem: |
      Show that every member of the family of functions $y = Ce^{x^2/2}$ is a solution of $y' = xy$.
    steps:
      - id: step-29-2-1
        title: Differentiate the proposed solution
        instruction: |
          Find $y'$.
        type: symbolicResponse
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the derivative of $y = Ce^{x^2/2}$?
        answer:
          expectedLatex: Cxe^{x^2/2}
          equivalenceMode: expression
          tolerance: 0
          variables: [x, C]
          explanation: |
            By the chain rule, $y' = C e^{x^2/2} \cdot \frac{d}{dx}(x^2/2) = C e^{x^2/2} \cdot x = x(Ce^{x^2/2}) = xy$.

  - id: ex-29-3
    title: Topic 29 Example 3 - Initial Value Problem
    problem: |
      Solve $y' = xy$, given $y(0) = 5$.
    steps:
      - id: step-29-3-1
        title: Apply the initial condition
        instruction: |
          Use the general solution from Example 2: $y = Ce^{x^2/2}$.
        type: symbolicResponse
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the value of C?
        answer:
          expectedLatex: 5
          equivalenceMode: expression
          tolerance: 0
          variables: []
          explanation: |
            $5 = C e^0 \implies C = 5$. The solution is $y = 5e^{x^2/2}$.

  - id: ex-29-4
    title: Topic 29 Example 4 - Parameters for a Solution
    problem: |
      Determine the values of $r$ such that $y = e^{rx}$ is a solution of $y'' - 3y' - 18y = 0$.
    steps:
      - id: step-29-4-1
        title: Substitute into the differential equation
        instruction: |
          Find $y'$ and $y''$ and substitute.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          After substitution and factoring out $e^{rx}$, what characteristic equation remains?
        choices:
          - id: c1
            text: $r^2 - 3r - 18 = 0$
          - id: c2
            text: $r^2 + 3r - 18 = 0$
        answer:
          choiceId: c1
          explanation: |
            $y' = re^{rx}$, $y'' = r^2 e^{rx}$. Substituting gives $e^{rx}(r^2 - 3r - 18) = 0$. Since $e^{rx} \neq 0$, the roots are $r = 6, -3$.

  - id: ex-29-5
    title: Topic 29 Example 5 - Superposition
    problem: |
      For what nonzero values of $k$ does $y = \sin(kt)$ solve $y'' + 4y = 0$?
    steps:
      - id: step-29-5-1
        title: Substitute and solve for k
        instruction: |
          Find $y''$ and substitute.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What are the values of $k$?
        choices:
          - id: c1
            text: $k = \pm 2$
          - id: c2
            text: $k = \pm 4$
        answer:
          choiceId: c1
          explanation: |
            $y'' = -k^2 \sin(kt)$. So $-k^2 \sin(kt) + 4\sin(kt) = 0 \implies 4 - k^2 = 0 \implies k = \pm 2$.

  - id: ex-29-6
    title: Topic 29 Example 6 - Slope Fields
    problem: |
      Consider the IVP $\frac{dy}{dx} = xy, y(1) = 2$. Visualize the solution curve on the slope field.
    steps:
      - id: step-29-6-1
        title: Analyze the slope field
        instruction: |
          Observe the provided slope field.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          At the point $(1,2)$, what is the slope?
        media:
          - type: image
            src: /data/media/slope_field_xy.png
            alt: Slope field for xy
        choices:
          - id: c1
            text: 2
          - id: c2
            text: 0
        answer:
          choiceId: c1
          explanation: |
            The slope is $1 \cdot 2 = 2$.

  - id: ex-29-7
    title: Topic 29 Example 7 - Slope Field x/y
    problem: |
      Create a slope field for $y' = x/y$.
    steps:
      - id: step-29-7-1
        title: Analyze the behavior
        instruction: |
          Observe the behavior near the axes.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the slope on the y-axis (where x=0)?
        media:
          - type: image
            src: /data/media/slope_field_x_over_y.png
            alt: Slope field for x/y
        choices:
          - id: c1
            text: 0 (horizontal)
          - id: c2
            text: Undefined (vertical)
        answer:
          choiceId: c1
          explanation: |
            When $x=0$, $y' = 0/y = 0$, so the tangent segments are horizontal.

  - id: ex-29-8
    title: Topic 29 Example 8 - Equilibrium Solutions
    problem: |
      A function satisfies $\frac{dy}{dt} = y^4 - 6y^3 + 5y^2$. What are the constant (equilibrium) solutions?
    steps:
      - id: step-29-8-1
        title: Find the roots
        instruction: |
          Set the derivative equal to zero.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What are the roots of $y^4 - 6y^3 + 5y^2 = 0$?
        choices:
          - id: c1
            text: $y = 0, y = 1, y = 5$
          - id: c2
            text: $y = 0, y = 2, y = 3$
        answer:
          choiceId: c1
          explanation: |
            Factor out $y^2$: $y^2(y^2 - 6y + 5) = 0 \implies y^2(y-1)(y-5) = 0$. So $y=0, 1, 5$ are the constant solutions.

  - id: ex-29-9
    title: Topic 29 Example 9 - Proportional Growth
    problem: |
      Translate: 'A population grows at a rate proportional to its size.'
    steps:
      - id: step-29-9-1
        title: Write the differential equation
        instruction: |
          Use P for population and t for time.
        type: symbolicResponse
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          Write the differential equation for dP/dt.
        answer:
          expectedLatex: kP
          equivalenceMode: expression
          tolerance: 0
          variables: [k, P]
          explanation: |
            The rate $\frac{dP}{dt}$ is a constant $k$ times $P$.

  - id: ex-29-10
    title: Topic 29 Example 10 - Rumor Spread
    problem: |
      Translate: 'The rate at which a rumor spreads is proportional to the product of those who heard it and those who have not.'
    steps:
      - id: step-29-10-1
        title: Write the differential equation
        instruction: |
          Use y for those who heard it, and M for the total population.
        type: symbolicResponse
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          Write the differential equation for dy/dt.
        answer:
          expectedLatex: k y (M - y)
          equivalenceMode: expression
          tolerance: 0
          variables: [k, y, M]
          explanation: |
            Those who have not heard it is $M - y$. Thus $\frac{dy}{dt} = k y (M - y)$.

  - id: ex-30-1
    title: Topic 30 Example 1 - Separable Equation
    problem: |
      Solve: $\frac{dy}{dx} = \frac{e^{2x}}{4y^3}$
    steps:
      - id: step-30-1-1
        title: Separate and integrate
        instruction: |
          Move y to the left, x to the right.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the general solution after integrating?
        choices:
          - id: c1
            text: $y^4 = \frac{1}{2} e^{2x} + C$
          - id: c2
            text: $y^4 = 2 e^{2x} + C$
        answer:
          choiceId: c1
          explanation: |
            $4y^3 dy = e^{2x} dx \implies y^4 = \frac{1}{2} e^{2x} + C$.

  - id: ex-30-2
    title: Topic 30 Example 2 - Separable Equation
    problem: |
      Solve: $\frac{dy}{dt} = \frac{te^t}{y\sqrt{1+y^2}}$
    steps:
      - id: step-30-2-1
        title: Separate and integrate
        instruction: |
          Integrate both sides.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What technique is needed to integrate the right side $t e^t dt$?
        choices:
          - id: c1
            text: Integration by Parts
          - id: c2
            text: Partial Fractions
        answer:
          choiceId: c1
          explanation: |
            The left side integrates to $\frac{1}{3}(1+y^2)^{3/2}$. The right side requires Integration by Parts: $\int t e^t dt = t e^t - e^t + C$.

  - id: ex-30-5
    title: Topic 30 Example 5 - Initial Value Problem
    problem: |
      Solve: $\frac{dy}{dx} = \frac{1+x}{xy}$, given $x>0$ and $y(1) = -4$.
    steps:
      - id: step-30-5-1
        title: Solve the IVP
        instruction: |
          Find the particular solution.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the value of C when finding the particular solution?
        choices:
          - id: c1
            text: $C = 7$
          - id: c2
            text: $C = 16$
        answer:
          choiceId: c1
          explanation: |
            $\int y dy = \int (\frac{1}{x} + 1) dx \implies \frac{1}{2}y^2 = \ln x + x + C$. Using $y(1)=-4$, we get $\frac{16}{2} = 0 + 1 + C \implies 8 = 1 + C \implies C = 7$.

  - id: ex-30-7
    title: Topic 30 Example 7 - Mixture Problem
    problem: |
      A tank contains 50 gal of solution at 2 lbs/gal. Pure water pumped in at 4 gal/min. Well-stirred mixture drained at 4 gal/min. Find the amount of salt $y(t)$.
    steps:
      - id: step-30-7-1
        title: Set up the differential equation
        instruction: |
          Rate In - Rate Out.
        type: multipleChoice
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the differential equation?
        choices:
          - id: c1
            text: $y' = - \frac{4}{50} y$
          - id: c2
            text: $y' = 4 - \frac{4}{50} y$
        answer:
          choiceId: c1
          explanation: |
            Pure water means Rate In = 0. Rate Out = $(y/50) \times 4$. So $y' = -\frac{4}{50}y = -0.08y$. The solution is $y(t) = 100 e^{-0.08t}$ since $y(0) = 50 \times 2 = 100$.

  - id: ex-31-2
    title: Topic 31 Example 2 - First-Order Linear
    problem: |
      Solve $y' + \frac{3}{x}y = x^4$.
    steps:
      - id: step-31-2-1
        title: Find the Integrating Factor
        instruction: |
          Identify $P(x)$.
        type: symbolicResponse
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the integrating factor $I(x)$?
        answer:
          expectedLatex: x^3
          equivalenceMode: expression
          tolerance: 0
          variables: [x]
          explanation: |
            $I(x) = e^{\int \frac{3}{x} dx} = e^{3\ln x} = x^3$.

  - id: ex-31-5
    title: Topic 31 Example 5 - Mixture Problem Unequal Flow
    problem: |
      A tank contains 100 gal of brine with 60 lbs salt. Salt water (1 lb/gal) runs in at 2 gal/min. Mixture runs out at 3 gal/min. Find salt after 30 mins.
    steps:
      - id: step-31-5-1
        title: Determine Volume
        instruction: |
          Since Inflow = 2 and Outflow = 3, volume is changing.
        type: symbolicResponse
        issueSignals:
        - id: boundary-condition-failure
        - id: u-substitution-failure
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: product-rule-misapplied
        - id: logarithm-property-misapplied
        prompt: |
          What is the volume $V(t)$ of liquid in the tank at time $t$?
        answer:
          expectedLatex: 100 - t
          equivalenceMode: expression
          tolerance: 0
          variables: [t]
          explanation: |
            The volume decreases by 1 gal/min. So $V(t) = 100 - t$.
