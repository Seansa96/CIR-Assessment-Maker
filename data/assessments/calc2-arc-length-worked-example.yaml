- id: fractional-power
  title: Arc Length of a Fractional Power Function
  problem: 'Find the exact arc length of the curve $y = \frac{2}{3}x^{3/2}$ from $x
    = 0$ to $x = 3$.

    '
  steps:
  - id: step-fractional-power-1
    title: Find the derivative
    type: freeResponse
    skills:
    - arc-length
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'First, find $y'' = f''(x)$.


      $$

      y = \frac{2}{3}x^{3/2} \implies y'' = \frac{2}{3} \cdot \frac{3}{2} x^{1/2}
      = x^{1/2} = \sqrt{x}

      $$

      '
  - id: step-fractional-power-2
    title: Square the derivative
    type: freeResponse
    skills:
    - arc-length
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Next, find $[y'']^2$.


      $$

      [y'']^2 = (\sqrt{x})^2 = x

      $$

      '
  - id: step-fractional-power-3
    title: Set up and evaluate the integral
    type: freeResponse
    skills:
    - arc-length
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Now, plug this into the arc length formula.


      $$

      L = \int_0^3 \sqrt{1 + [y'']^2}\,dx = \int_0^3 \sqrt{1 + x}\,dx

      $$


      Use a simple u-substitution: $u = 1+x$, $du = dx$. Bounds change from $[0, 3]$
      to $[1, 4]$.


      $$

      L = \int_1^4 u^{1/2}\,du = \left[ \frac{2}{3}u^{3/2} \right]_1^4

      $$


      Evaluate:

      $$

      \frac{2}{3} (4^{3/2} - 1^{3/2}) = \frac{2}{3} (8 - 1) = \frac{2}{3}(7) = \frac{14}{3}

      $$

      '
  check:
    id: fractional-power-check
    type: numericResponse
    skills:
    - arc-length
    prompt: What is the decimal value of $14/3$?
    answer:
      value: 4.666
      tolerance: 0.01
    explanation: '$14 \div 3 = 4.666...$

      '
- id: perfect-square-trick
  title: The Perfect Square Algebraic Trick
  problem: 'Find the arc length of the curve $y = \frac{x^3}{6} + \frac{1}{2x}$ on
    the interval $[1, 2]$.

    '
  steps:
  - id: step-perfect-square-trick-1
    title: Derivative and its square
    type: freeResponse
    skills:
    - arc-length
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ y = \frac{1}{6}x^3 + \frac{1}{2}x^{-1} $$

      $$ y'' = \frac{1}{2}x^2 - \frac{1}{2}x^{-2} $$


      Square it carefully:

      $$ [y'']^2 = \left( \frac{1}{2}x^2 - \frac{1}{2}x^{-2} \right)^2 = \frac{1}{4}x^4
      - 2\left(\frac{1}{2}x^2\right)\left(\frac{1}{2}x^{-2}\right) + \frac{1}{4}x^{-4}
      $$

      Notice the middle term: $x^2 \cdot x^{-2} = 1$. So the middle term is simply
      $-\frac{1}{2}$.

      $$ [y'']^2 = \frac{1}{4}x^4 - \frac{1}{2} + \frac{1}{4}x^{-4} $$

      '
  - id: step-perfect-square-trick-2
    title: Add 1 and factor
    type: freeResponse
    skills:
    - arc-length
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'The formula requires $1 + [y'']^2$.


      $$ 1 + [y'']^2 = 1 + \frac{1}{4}x^4 - \frac{1}{2} + \frac{1}{4}x^{-4} = \frac{1}{4}x^4
      + \frac{1}{2} + \frac{1}{4}x^{-4} $$


      Notice that adding 1 just changed the middle term from $-1/2$ to $+1/2$. This
      means it factors perfectly back into a square, just with a plus sign!


      $$ 1 + [y'']^2 = \left( \frac{1}{2}x^2 + \frac{1}{2}x^{-2} \right)^2 $$

      '
  - id: step-perfect-square-trick-3
    title: Integrate
    type: freeResponse
    skills:
    - arc-length
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Now the square root in the formula perfectly cancels the square
      we just found!


      $$ L = \int_1^2 \sqrt{ \left( \frac{1}{2}x^2 + \frac{1}{2}x^{-2} \right)^2 }\,dx
      = \int_1^2 \left( \frac{1}{2}x^2 + \frac{1}{2}x^{-2} \right)\,dx $$


      $$ L = \left[ \frac{x^3}{6} - \frac{1}{2x} \right]_1^2 $$


      At $x=2$: $8/6 - 1/4 = 4/3 - 1/4 = 16/12 - 3/12 = 13/12$.

      At $x=1$: $1/6 - 1/2 = 1/6 - 3/6 = -2/6 = -1/3 = -4/12$.


      Total $L = 13/12 - (-4/12) = 17/12$.

      '
  check:
    id: perfect-square-trick-check
    type: multipleChoice
    skills:
    - arc-length
    prompt: What makes this problem solvable by hand without advanced techniques like
      trig substitution?
    choices:
    - id: a
      text: The clever algebraic cancellation where adding 1 flips the sign of the
        middle term, creating a perfect square under the square root.
    - id: b
      text: The fact that $x^3$ integrates easily.
    - id: c
      text: The bounds of integration.
    - id: d
      text: The use of the power rule.
    answer:
      choiceId: a
    explanation: 'Without the perfect square trick, we would be left trying to integrate
      a messy square root polynomial, which is often impossible in terms of elementary
      functions.

      '
