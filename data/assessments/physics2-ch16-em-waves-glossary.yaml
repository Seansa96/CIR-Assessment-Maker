id: physics2-ch16-em-waves-glossary
title: Electromagnetic Waves Glossary
assessmentType: glossary
categoryId: physics-2
topicId: physics2-electromagnetic-waves
glossary:
  introduction: Core terms for EM Waves.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of waves and equations.
    entries:
    - id: t1
      term: Displacement Current
      definition: An effective current caused by a changing electric flux, completing
        Ampere's Law.
    - id: t2
      term: Poynting Vector
      definition: A vector representing the directional energy flux density (rate
        of energy transfer per unit area) of an electromagnetic field.
    - id: t3
      term: Radiation Pressure
      definition: The mechanical pressure exerted upon any surface due to the exchange
        of momentum between the object and the electromagnetic field.
