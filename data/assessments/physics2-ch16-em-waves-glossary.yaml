            per unit area) of an electromagnetic field.
        explanation: 'Solution:


          A vector representing the directional energy flux density (rate of energy transfer per unit
          area) of an electromagnetic field.


          Why it works:


          This definition identifies the essential meaning of Poynting Vector.'
        tags: []
    - id: t3
      term: Radiation Pressure
      definition: The mechanical pressure exerted upon any surface due to the exchange of momentum between
        the object and the electromagnetic field.
