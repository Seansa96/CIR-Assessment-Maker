workedExamples:
- id: we001
  title: Choosing and applying the Law of Cosines
  problem: |-
    Use the Law of Cosines when a triangle is not necessarily right and the information is built around either SAS or SSS.

    ![Oblique Triangle](/assessments/trigonometry/oblique_triangle.svg)


    Standard notation pairs side $a$ with opposite angle $A$, side $b$ with opposite
    angle $B$, and side $c$ with opposite angle $C$.

    '
  steps:
  - id: step-we001-1
    title: Write the identity family
    instruction: 'First, memorize the Law of Cosines in all three side forms:


      $$

      a^2=b^2+c^2-2bc\cos A

      $$


      $$

      b^2=a^2+c^2-2ac\cos B

      $$


      $$

      c^2=a^2+b^2-2ab\cos C

      $$


      The side alone on the left is opposite the angle in the cosine term. For example,
      $c$ is opposite $C$, and the included angle $C$ sits between sides $a$ and $b$.


      Rearranged angle forms:


      $$

      \cos A=\frac{b^2+c^2-a^2}{2bc}

      $$


      $$

      \cos B=\frac{a^2+c^2-b^2}{2ac}

      $$


      $$

      \cos C=\frac{a^2+b^2-c^2}{2ab}

      $$


      Use the side forms for SAS. Use the rearranged cosine forms for SSS.

      '
    type: freeResponse
    prompt: |
      Type out all three side forms of the Law of Cosines and the three rearranged angle forms.
    answer:
      expected: 'A complete response should include:


        $$

        a^2=b^2+c^2-2bc\cos A

        $$


        $$

        b^2=a^2+c^2-2ac\cos B

        $$


        $$

        c^2=a^2+b^2-2ab\cos C

        $$


        and:


        $$

        \cos A=\frac{b^2+c^2-a^2}{2bc},

        \qquad

        \cos B=\frac{a^2+c^2-b^2}{2ac},

        \qquad

        \cos C=\frac{a^2+b^2-c^2}{2ab}.

        $$

        '
      gradingMode: selfCheck
      keyPoints:
      - The left-side side must be opposite the angle in the cosine term.
      - SAS uses the side-squared forms.
      - SSS uses the rearranged cosine forms to find an angle.
    hint: 'Rotate the letters. The isolated side and the cosine angle use the same
      letter.

      '
    explanation: |
      The Law of Cosines generalizes the Pythagorean theorem. When the included angle is $90^\circ$, the cosine term becomes zero and the formula reduces to $c^2=a^2+b^2$.

      Related topic: Law of Cosines identity family and included angles.
  - id: step-we001-2
    title: Choose Law of Cosines for SAS
    instruction: |-
      SAS means two sides and the included angle are known. The included angle is the angle between the two known sides.

      ![SAS Triangle](/assessments/trigonometry/sas_triangle.svg)
    type: multipleChoice
    prompt: |
      A triangle has sides $a=7$, $b=10$, and included angle $C=48^\circ$. Which law should you use first to find $c$?
    choices:
    - id: a
      text: Law of Cosines
    - id: b
      text: Law of Sines
    - id: c
      text: Pythagorean theorem only
    - id: d
      text: Power reduction identity
    answer:
      choiceId: a
    hint: 'The known angle is between the two known sides.

      '
    explanation: |
      This is SAS information, so use the Law of Cosines:

      $$
      c^2=a^2+b^2-2ab\cos C.
      $$

      Related topic: Choosing Law of Cosines for SAS.
  - id: step-we001-3
    title: Set up the missing side
    instruction: 'Match the unknown side with the opposite included angle.

      '
    type: multipleChoice
    prompt: |
      For $a=7$, $b=10$, and $C=48^\circ$, which setup finds $c$?
    choices:
    - id: a
      text: $c^2=7^2+10^2-2(7)(10)\cos 48^\circ$
    - id: b
      text: $c^2=7^2+10^2+2(7)(10)\cos 48^\circ$
    - id: c
      text: $\frac{c}{\sin 48^\circ}=\frac{7}{\sin 10^\circ}$
    - id: d
      text: $c=7+10-48$
    answer:
      choiceId: a
    hint: 'The cosine term is subtracted.

      '
    explanation: |
      Since $C$ is between sides $a$ and $b$, the opposite side is $c$:

      $$
      c^2=7^2+10^2-2(7)(10)\cos 48^\circ.
      $$

      Related topic: Law of Cosines side setup.
  - id: step-we001-4
    title: Choose Law of Cosines for SSS angles
    instruction: |-
      If all three sides are known and you need an angle, use a rearranged Law of Cosines formula.

      ![SSS Triangle](/assessments/trigonometry/sss_triangle.svg)
    type: multipleChoice
    prompt: |
      A triangle has sides $a=6$, $b=8$, and $c=11$. Which formula finds angle $C$?
    choices:
    - id: a
      text: $\cos C=\frac{6^2+8^2-11^2}{2(6)(8)}$
    - id: b
      text: $\sin C=\frac{6^{2}+8^{2}-11^{2}}{2(6)(8)}$
    - id: c
      text: $C=6+8+11$
    - id: d
      text: $\frac{11}{\sin C}=\frac{6}{\sin 6^\circ}$
    answer:
      choiceId: a
    hint: 'Use the rearranged form for $\cos C$.

      '
    explanation: |
      Since $c$ is opposite $C$:

      $$
      \cos C=\frac{a^2+b^2-c^2}{2ab}
      =\frac{6^2+8^2-11^2}{2(6)(8)}.
      $$

      Related topic: Finding angles from SSS with Law of Cosines.
  - id: step-we001-5
    title: Interpret the cosine value
    instruction: 'A negative cosine means the angle is obtuse. This helps you catch
      arithmetic or calculator mistakes.

      '
    type: multipleChoice
    prompt: |
      If $\cos C<0$, what must be true about angle $C$?
    choices:
    - id: a
      text: $C$ is obtuse.
    - id: b
      text: $C$ is acute.
    - id: c
      text: $C=90^\circ$ exactly.
    - id: d
      text: $C$ cannot exist.
    answer:
      choiceId: a
    hint: 'Cosine is negative in Quadrant II, which corresponds to angles between
      $90^\circ$ and $180^\circ$ for triangles.

      '
    explanation: |
      Triangle angles live between $0^\circ$ and $180^\circ$. In that range, negative cosine values occur for obtuse angles.

      Related topic: Interpreting the rearranged Law of Cosines.
  - id: step-we001-6
    title: Know when to switch to Law of Sines
    instruction: 'After Law of Cosines gives one missing side or angle, Law of Sines
      may become easier for the remaining pieces because you now have an opposite
      pair.

      '
    type: multipleChoice
    prompt: |
      After using Law of Cosines in an SAS problem to find side $c$, what new tool often becomes available?
    choices:
    - id: a
      text: Law of Sines, because $c$ and $C$ now form an opposite pair.
    - id: b
      text: Only the Pythagorean theorem.
    - id: c
      text: No other method can be used.
    - id: d
      text: Power reduction identities.
    answer:
      choiceId: a
    hint: 'Once you know $c$ and $C$, you have a complete opposite side-angle pair.

      '
    explanation: |
      A common workflow is: use Law of Cosines to break into the triangle, then use Law of Sines once an opposite pair is known.

      Related topic: Choosing between Law of Cosines and Law of Sines.
