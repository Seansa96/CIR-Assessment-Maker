schemaVersion: 1
id: pwsh-help-flags-concept-lesson
title: "Help System and Flags"
assessmentType: conceptLesson
categoryId: scripting
subcategoryIds:
  - pwsh-help-flags
skills:
  - pwsh-help-flags
modeDefault: practice
randomizeQuestions: false
lesson:
  introduction: |
    PowerShell has one of the most robust, built-in documentation systems of any programming environment. You don't always need Google to figure out how a command works — you just need `Get-Help`.
  sections:
    - id: sec-get-help
      title: "Using Get-Help"
      required: true
      content: |
        The **`Get-Help`** cmdlet is your best friend. Pass it the name of any cmdlet to see its documentation.
        
        `Get-Help Get-ChildItem`
        
        This will show the NAME, SYNOPSIS, SYNTAX, and DESCRIPTION of the cmdlet.
        
        **Important Parameters (Flags) for Get-Help:**
        - `-Examples`: Shows only practical examples of how to use the command. (Highly recommended!)
        - `-Detailed`: Shows detailed parameter descriptions and examples.
        - `-Full`: Shows absolutely everything, including technical parameter attributes.
        - `-Online`: Opens the official Microsoft documentation page for the cmdlet in your default web browser.
      check:
        id: chk-help-1
        type: multipleChoice
        prompt: "If you know what a command does, but you just want to see a quick code snippet of how to format it, which command should you run?"
        choices:
          - id: a
            text: "Get-Help Get-Process -Full"
          - id: b
            text: "Get-Help Get-Process -Examples"
          - id: c
            text: "Get-Help Get-Process -Online"
          - id: d
            text: "Get-Help Get-Process"
        answer:
          choiceId: b
        explanation: |
          The `-Examples` flag is the fastest way to see working code snippets without scrolling through paragraphs of technical description.

    - id: sec-flags
      title: "Cmdlet Parameters (Flags)"
      required: true
      content: |
        Cmdlets behave differently based on the **Parameters** (often called flags or switches) you pass to them. Parameters are prefixed with a dash `-`.
        
        For example, `Get-ChildItem` normally lists files and folders. But if you add the `-Recurse` switch parameter:
        `Get-ChildItem -Recurse`
        It will search the current folder, and all subfolders within it, recursively.
        
        Some parameters require a value to be passed immediately after them. For example:
        `Get-ChildItem -Path C:\Windows -Filter *.exe`
        Here, `-Path` takes `C:\Windows` and `-Filter` takes `*.exe`.
      check:
        id: chk-help-2
        type: multipleChoice
        prompt: "In the command `Get-Service -Name '*network*'`, what is `-Name`?"
        choices:
          - id: a
            text: "A Cmdlet"
          - id: b
            text: "An Alias"
          - id: c
            text: "A Parameter"
          - id: d
            text: "A PSDrive"
        answer:
          choiceId: c
        explanation: |
          `-Name` is a parameter that tells the `Get-Service` cmdlet exactly which services to filter for (in this case, any service with 'network' in its name).
          
    - id: sec-get-command
      title: "Discovering Commands with Get-Command"
      required: true
      content: |
        What if you don't even know the name of the cmdlet you need? You can use **`Get-Command`**.
        
        Because of the Verb-Noun structure, you can use wildcards (`*`) to search!
        - Want to see everything you can do with a Service? `Get-Command -Noun Service`
        - Want to see every command that creates something new? `Get-Command -Verb New`
        - Looking for something related to the network? `Get-Command *net*`
      check:
        id: chk-help-3
        type: multipleChoice
        prompt: "Which command would you use to find a cmdlet that deals with 'Firewall' rules?"
        choices:
          - id: a
            text: "Get-Help Firewall"
          - id: b
            text: "Get-Command *Firewall*"
          - id: c
            text: "Get-ChildItem Firewall"
          - id: d
            text: "Search-Firewall"
        answer:
          choiceId: b
        explanation: |
          `Get-Command *Firewall*` will search all available modules and snap-ins for any cmdlet containing the word Firewall in its name (e.g., `Get-NetFirewallRule`).
