schemaVersion: 1
id: calc2-common-taylor-series-recall
title: Common Taylor and Maclaurin Series Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryIds:
  - taylor-maclaurin
  - power-series
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - calculus-2
  - taylor-maclaurin
  - power-series
  - common-maclaurin-series
  - taylor-series
  - formula-recall
skills:
- Apply calculus-2 concepts
- Apply Taylor and Maclaurin Series
- Apply Power Series and Representations
  - taylor-maclaurin
items:
  - id: taylor-template-visual-sine
    type: recognition
    skills:
      - taylor-maclaurin
    prompt: |
      Use the template sheet as a visual cue.

      ![Common Maclaurin series templates and their pattern cues](/assessments/calc2-infinite-series/taylor-common-series-reference.svg)

      Which standard Maclaurin series has odd powers and alternating signs with factorials in the denominator?
    choices:
      - id: a
        text: '$\sin x$'
      - id: b
        text: '$\cos x$'
      - id: c
        text: '$e^x$'
      - id: d
        text: '$\frac{1}{1-x}$'
    answer:
      choiceId: a
      expected: '$\sin x$'
    explanation: |
      Sine is odd, so it uses odd powers; its Maclaurin signs alternate and the denominators are odd factorials.
    tags:
      - sine-series
      - visual-recognition

  - id: exp-series-symbolic
    type: symbolic
    skills:
      - taylor-maclaurin
    prompt: Write the Maclaurin series for $e^x$.
    answer:
      expectedLatex: '\sum_{n=0}^{\infty}\frac{x^n}{n!}'
      aliases:
        - '1+x+x^2/2!+x^3/3!+\cdots'
    explanation: |
      Every derivative of $e^x$ is $e^x$, and each derivative at $0$ is $1$.
    tags:
      - exponential-series

  - id: sine-series-symbolic
    type: symbolic
    skills:
      - taylor-maclaurin
    prompt: Write the Maclaurin series for $\sin x$.
    answer:
      expectedLatex: '\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{(2n+1)!}'
      aliases:
        - 'x-x^3/3!+x^5/5!-\cdots'
    explanation: |
      Sine is odd, so only odd powers appear, and the signs alternate.
    tags:
      - sine-series

  - id: cosine-series-symbolic
    type: symbolic
    skills:
      - taylor-maclaurin
    prompt: Write the Maclaurin series for $\cos x$.
    answer:
      expectedLatex: '\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n}}{(2n)!}'
      aliases:
        - '1-x^2/2!+x^4/4!-\cdots'
    explanation: |
      Cosine is even, so only even powers appear, and the signs alternate.
    tags:
      - cosine-series

  - id: geometric-series-symbolic
    type: symbolic
    skills:
      - taylor-maclaurin
    prompt: Write the power series for $\frac{1}{1-x}$.
    answer:
      expectedLatex: '\sum_{n=0}^{\infty}x^n'
      aliases:
        - '1+x+x^2+x^3+\cdots'
    explanation: |
      This is the geometric series with first term $1$ and ratio $x$, valid for $|x|<1$.
    tags:
      - geometric-series

  - id: ln-one-plus-x-symbolic
    type: symbolic
    skills:
      - taylor-maclaurin
    prompt: Write the Maclaurin series for $\ln(1+x)$.
    answer:
      expectedLatex: '\sum_{n=1}^{\infty}\frac{(-1)^{n+1}x^n}{n}'
      aliases:
        - 'x-x^2/2+x^3/3-x^4/4+\cdots'
    explanation: |
      This can be built by integrating the geometric series for $\frac{1}{1+x}$.
    tags:
      - logarithm-series

  - id: arctan-series-symbolic
    type: symbolic
    skills:
      - taylor-maclaurin
    prompt: Write the Maclaurin series for $\arctan x$.
    answer:
      expectedLatex: '\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{2n+1}'
      aliases:
        - 'x-x^3/3+x^5/5-\cdots'
    explanation: |
      Integrate the series for $\frac{1}{1+x^2}$ term by term.
    tags:
      - arctangent-series

  - id: exp-radius-flashcard
    type: flashcard
    skills:
      - taylor-maclaurin
    prompt: What is the interval of convergence for the Maclaurin series of $e^x$, $\sin x$, and $\cos x$?
    answer:
      expected: All real numbers.
    explanation: |
      These three standard Maclaurin series converge for every real $x$.
    tags:
      - interval-of-convergence

  - id: geometric-validity-cloze
    type: cloze
    skills:
      - taylor-maclaurin
    prompt: 'The series $\frac{1}{1-x}=\sum x^n$ is valid when $|x|$ is ____ than $1$.' 
    answer:
      expected: less
      aliases:
        - less than
        - '<'
    explanation: |
      The geometric series converges only when the absolute value of the ratio is less than one.
    tags:
      - geometric-series
      - interval-of-convergence

  - id: odd-even-power-cloze
    type: cloze
    skills:
      - taylor-maclaurin
    prompt: 'The Maclaurin series for $\sin x$ uses only ____ powers of $x$.' 
    answer:
      expected: odd
      aliases:
        - odd powers
    explanation: |
      Sine is an odd function, and its Maclaurin expansion reflects that symmetry.
    tags:
      - sine-series

  - id: cos-even-powers-cloze
    type: cloze
    skills:
      - taylor-maclaurin
    prompt: 'The Maclaurin series for $\cos x$ uses only ____ powers of $x$.' 
    answer:
      expected: even
      aliases:
        - even powers
    explanation: |
      Cosine is an even function, and its Maclaurin expansion reflects that symmetry.
    tags:
      - cosine-series

  - id: substitution-series-typed
    type: typed
    skills:
      - taylor-maclaurin
    prompt: What is the fastest way to get a series for $e^{3x}$ from the series for $e^x$?
    answer:
      expected: substitute 3x for x
      aliases:
        - replace x with 3x
        - plug in 3x
    explanation: |
      Use the known series for $e^x$ and replace every $x$ with $3x$.
    tags:
      - series-substitution

  - id: first-omitted-term-cloze
    type: cloze
    skills:
      - taylor-maclaurin
    prompt: 'For a qualifying alternating Taylor series, the error is at most the first ____ term.' 
    answer:
      expected: omitted
      aliases:
        - unused
        - left out
    explanation: |
      Alternating-series error is controlled by the magnitude of the next term after stopping.
    tags:
      - alternating-series-error
