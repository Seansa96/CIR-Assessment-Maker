workedExamples:
- id: l2-sec1
  title: Voltage Divider
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Voltage Divider
    instruction: 'In a series circuit, the voltage divides among the resistors in
      proportion to their resistance: $v_i = V_s (R_i / R_{eq})$.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec2
  title: Current Divider
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Current Divider
    instruction: In a parallel circuit, the current divides among the branches. For
      two resistors, the current through $R_1$ is $i_1 = I_s (R_2 / (R_1 + R_2))$.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
