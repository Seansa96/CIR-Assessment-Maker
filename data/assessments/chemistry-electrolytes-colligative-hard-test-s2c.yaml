questions:
  - { id: q001, type: freeResponse, prompt: 'Equal 100.0 mL portions of 0.300 M Na2SO4 and 0.200 M CaCl2 are mixed. Find [Cl−] and [Na+], assuming complete dissociation and additive volume.', answer: { gradingMode: selfCheck, keyPoints: ['[Cl−] 0.200 M', '[Na+] 0.300 M', 'divide ion moles by 0.2000 L'] }, explanation: 'Solution: Chloride moles are 2(0.200)(0.1000)=0.0400 mol, so [Cl−]=0.0400/0.2000=0.200 M. Sodium moles are 2(0.300)(0.1000)=0.0600 mol, so [Na+]=0.300 M. Why it works: Count ions in each source, add moles of the requested ion, then divide by total volume. Common trap: Using the original 100.0 mL as final volume.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Constructs two dissociation models, balances ion moles, and normalizes by mixed volume.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-mixed-salt-two-ion-analysis, variationAxes: { scenario: mixed salts, unknown: two ion concentrations, constraints: additive volume } }
  - { id: q002, type: freeResponse, prompt: 'A 25.0 mL sample of 0.600 M Al(NO3)3 is diluted to 150.0 mL. Find final total ideal ion concentration.', answer: { gradingMode: selfCheck, keyPoints: ['0.100 M Al(NO3)3', '0.400 M total ions', 'four ions per formula unit'] }, explanation: 'Solution: Final formula-unit molarity is 0.600(25.0/150.0)=0.100 M. Al(NO3)3 forms four ions, so total ideal ion concentration is 4(0.100)=0.400 M. Why it works: Dilution conserves solute moles before dissociation coefficients are applied. Common trap: Multiplying the initial 0.600 M by four before dilution and forgetting volume change.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, representationTransfer], difficultyEvidence: 'Chains a conservation law with dissociation-particle accounting.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: hard-dilution-total-ions, variationAxes: { scenario: dilution, methodBranch: conservation then dissociation, unknown: total ion concentration } }
  - { id: q003, type: freeResponse, prompt: 'Rank 0.080 m AlCl3, 0.090 m CaCl2, and 0.20 m glucose from lowest to highest ideal freezing-point depression.', answer: { gradingMode: selfCheck, keyPoints: ['glucose < CaCl2 < AlCl3', 'effective values 0.20, 0.27, 0.32'] }, explanation: 'Solution: Effective particle molalities are glucose 1(0.20)=0.20, CaCl2 3(0.090)=0.27, and AlCl3 4(0.080)=0.32. Thus glucose < CaCl2 < AlCl3 in freezing-point depression. Why it works: Compare particle molality, not the listed formula-unit molality. Common trap: Choosing glucose as greatest because 0.20 is largest before particle counting.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, errorDiagnosis], difficultyEvidence: 'Transforms three solute formulas to particle measures and rejects direct-concentration ranking.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-three-solution-effective-particle-ranking, variationAxes: { scenario: unequal molalities, unknown: freezing ranking, governingRelation: particle molality } }
  - { id: q004, type: freeResponse, prompt: 'A conductivity diagram for 0.10 M acetic acid shows 18 CH3COOH molecules, one H+ ion, and one CH3COO− ion. Explain why assigning i = 2 exactly is unjustified.', answer: { gradingMode: selfCheck, keyPoints: ['partial ionization', 'mostly molecules', 'actual i between 1 and 2 and composition-dependent'] }, explanation: 'Solution: The diagram shows only partial ionization, so most formula units remain molecules. Its particle factor is greater than 1 but less than 2 for that sample, not exactly 2. Why it works: A weak electrolyte has an equilibrium-dependent fraction of ionized particles. Common trap: Treating the acid formula as proof of complete dissociation.', difficultyDimensions: [representationTransfer, domainCondition, proofJustification], difficultyEvidence: 'Interprets a particle representation, identifies model conditions, and justifies a bounded conclusion.', prerequisiteObjectiveIds: [electrolyte-classification], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: hard-weak-electrolyte-i-bound, variationAxes: { representation: particle diagram, constraints: partial dissociation, unknown: justified factor range } }
  - { id: q005, type: freeResponse, prompt: 'A student writes that 0.150 M MgCl2 has total ion concentration 0.600 M “because charges add to 4.” Diagnose and correct the statement.', answer: { gradingMode: selfCheck, keyPoints: ['incorrect', '0.450 M total ions', 'three particles not charge sum'] }, explanation: 'Solution: MgCl2 gives one Mg2+ and two Cl−, or three particles; total concentration is 3(0.150)=0.450 M. Why it works: Particle count uses the number of ions, whereas charge balance concerns electrical neutrality. Common trap: Treating +2 plus two −1 charges as four particles.', difficultyDimensions: [errorDiagnosis, representationTransfer, proofJustification], difficultyEvidence: 'Audits a false method by separating charge accounting from particle counting.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-charge-sum-error-diagnosis, variationAxes: { scenario: student claim, methodBranch: error diagnosis, unknown: corrected total ion concentration } }
  - { id: q006, type: freeResponse, prompt: 'A semipermeable membrane passes water but not solute. Side A contains 0.15 M glucose; side B contains 0.060 M FeCl3. Predict initial water direction under ideal behavior and justify.', answer: { gradingMode: selfCheck, keyPoints: ['toward side B', '0.24 particle M versus 0.15', 'higher osmotic pressure'] }, explanation: 'Solution: FeCl3 yields four particles, so side B has 4(0.060)=0.24 particle M versus 0.15 particle M on side A. Water initially moves from A to B. Why it works: Solvent moves toward the side with greater effective solute-particle concentration. Common trap: Following formula-unit molarity alone.', difficultyDimensions: [modelOrDerivation, representationTransfer, globalLocalReasoning], difficultyEvidence: 'Builds an osmotic model from dissociation and predicts a system-level transport direction.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-osmosis-direction-effective-concentration, variationAxes: { scenario: membrane, unknown: water direction, governingRelation: effective particle concentration } }
  - { id: q007, type: freeResponse, prompt: 'A solution is 0.300 M in total dissolved ions and contains only fully dissociated K2SO4. Find [K+] and [SO4 2−].', answer: { gradingMode: selfCheck, keyPoints: ['0.200 M K+', '0.100 M sulfate', 'formula-unit molarity 0.100 M'] }, explanation: 'Solution: K2SO4 gives three ions, so its formula-unit molarity is 0.300/3=0.100 M. Therefore [K+]=2(0.100)=0.200 M and [SO4 2−]=0.100 M. Why it works: Work backward from total particles, then apply each formula coefficient. Common trap: Dividing the total concentration by charge magnitudes.', difficultyDimensions: [reverseReasoning, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Reverses particle-count scaling and resolves individual ion concentrations.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-reverse-total-ion-to-components, variationAxes: { givens: total ion concentration, unknown: two component concentrations, methodBranch: reverse reasoning } }
  - { id: q008, type: freeResponse, prompt: 'Compare ideal boiling-point elevation for 0.040 m Al2(SO4)3 and 0.090 m NaCl. State which is greater and show why.', answer: { gradingMode: selfCheck, keyPoints: ['Al2(SO4)3 greater', '0.200 particle m versus 0.180 particle m', 'five versus two particles'] }, explanation: 'Solution: Al2(SO4)3 gives five particles, so 5(0.040)=0.200 particle m; NaCl gives 2(0.090)=0.180 particle m. Al2(SO4)3 gives the greater elevation. Why it works: Ideal boiling-point elevation scales with effective particle molality. Common trap: Ranking by listed molality without counting ions.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, parameterThreshold], difficultyEvidence: 'Converts formula-unit molality to particle molality and resolves a close comparison.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-close-particle-molality-comparison, variationAxes: { scenario: close colligative comparison, constraints: unequal i values, unknown: boiling elevation ranking } }
  - { id: q009, type: freeResponse, prompt: 'Why can 0.10 M HCl be treated as nearly two particles per formula unit in an introductory ideal calculation, while 0.10 M HF cannot?', answer: { gradingMode: selfCheck, keyPoints: ['HCl strong acid nearly complete dissociation', 'HF weak acid partial ionization', 'HF requires equilibrium information'] }, explanation: 'Solution: HCl is a strong acid and is modeled as nearly fully dissociated into H+ and Cl−. HF is weak and only partially ionizes, so its particle count depends on equilibrium. Why it works: Electrolyte strength determines whether complete-dissociation assumptions apply. Common trap: Calling every hydrogen-containing compound a strong acid.', difficultyDimensions: [casePartition, domainCondition, proofJustification], difficultyEvidence: 'Selects between strong and weak electrolyte models and states the condition for each.', prerequisiteObjectiveIds: [electrolyte-classification], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-strong-weak-acid-model-selection, variationAxes: { scenario: acid comparison, methodBranch: strength model selection, unknown: validity of particle assumption } }
  - { id: q010, type: freeResponse, prompt: 'Equal volumes of 0.100 M KCl and 0.300 M CaCl2 are mixed. Find final total ideal ion concentration.', answer: { gradingMode: selfCheck, keyPoints: ['0.550 M', '0.200 mol total ions per liter-equivalent before divide', 'combined volume'] }, explanation: 'Solution: Let each volume be V. KCl contributes 2(0.100V)=0.200V mol ions; CaCl2 contributes 3(0.300V)=0.900V mol ions. Divide 1.100V mol ions by 2V to obtain 0.550 M. Why it works: Add total ion moles from both sources before dividing by combined volume. Common trap: Adding 0.200 M and 0.900 M without halving for the doubled volume.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Creates a variable-volume ion balance and normalizes a mixture.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-mix-total-ions, variationAxes: { scenario: mixed solutions, unknown: total ion concentration, constraints: equal volumes } }
  - { id: q011, type: freeResponse, prompt: 'A diagram has equal numbers of dissolved NaCl formula units and glucose molecules, but the NaCl is fully separated. Explain which solution should conduct more and have greater ideal osmotic pressure.', answer: { gradingMode: selfCheck, keyPoints: ['NaCl for both', 'mobile ions', 'two particles versus one'] }, explanation: 'Solution: NaCl conducts more because it supplies mobile ions and has greater osmotic pressure because it creates two particles per formula unit. Why it works: The same dissociation changes both charge-carrier availability and particle count. Common trap: Assuming conductivity and osmotic pressure are controlled by molecular mass.', difficultyDimensions: [representationTransfer, globalLocalReasoning, modelOrDerivation], difficultyEvidence: 'Uses one particle model to infer two distinct macroscopic properties.', prerequisiteObjectiveIds: [electrolyte-classification], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: hard-dual-property-particle-model, variationAxes: { representation: comparative particle diagram, unknown: two macroscopic predictions, governingRelation: dissociation } }
  - { id: q012, type: freeResponse, prompt: 'A solution contains 0.120 M Ba2+ and arises only from fully dissociated BaCl2. Determine the formula-unit molarity, [Cl−], and total ion concentration.', answer: { gradingMode: selfCheck, keyPoints: ['0.120 M BaCl2', '0.240 M chloride', '0.360 M total ions'] }, explanation: 'Solution: One Ba2+ comes from each BaCl2, so formula-unit molarity is 0.120 M. Then [Cl−]=2(0.120)=0.240 M and total ions =3(0.120)=0.360 M. Why it works: The cation coefficient is one, allowing a direct reverse link to formula concentration. Common trap: Dividing [Ba2+] by two because of its charge.', difficultyDimensions: [reverseReasoning, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Infers formula concentration from one ion then branches to two requested quantities.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-ion-source-three-quantities, variationAxes: { givens: cation concentration, unknown: formula anion total, methodBranch: reverse concentration mapping } }
  - { id: q013, type: freeResponse, prompt: 'Under ideal assumptions, what formula-unit molarity of CaCl2 gives the same total particle concentration as 0.180 M Na2SO4?', answer: { gradingMode: selfCheck, keyPoints: ['0.180 M', 'both produce three ions'] }, explanation: 'Solution: Na2SO4 has 3(0.180)=0.540 particle M. CaCl2 also gives three particles, so its required molarity is 0.540/3=0.180 M. Why it works: Match effective particle concentration, not formula names. Common trap: Matching charges or molar masses instead of ion counts.', difficultyDimensions: [reverseReasoning, representationTransfer, proofJustification], difficultyEvidence: 'Equates two particle models and solves backward for a matching concentration.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-match-particle-concentration, variationAxes: { scenario: equivalent colligative effect, unknown: required molarity, governingRelation: iM equality } }
  - { id: q014, type: freeResponse, prompt: 'A student predicts 0.050 m AlCl3 and 0.200 m glucose have identical freezing-point depression. Assess the claim ideally.', answer: { gradingMode: selfCheck, keyPoints: ['identical ideally', '0.200 effective particle molality each', 'state ideal qualification'] }, explanation: 'Solution: AlCl3 gives 4(0.050)=0.200 particle m, equal to glucose at 1(0.200)=0.200 particle m, so the ideal prediction is equal depression. Why it works: Equal effective particle molality gives equal ideal colligative response. Common trap: Rejecting equality because the formula-unit concentrations differ.', difficultyDimensions: [errorDiagnosis, representationTransfer, domainCondition], difficultyEvidence: 'Tests a claim by calculating effective concentration and stating an ideal-model condition.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-equal-effective-colligative-audit, variationAxes: { scenario: student claim, constraints: ideal behavior, unknown: qualified conclusion } }
  - { id: q015, type: freeResponse, prompt: 'A 0.240 M solution has [NO3−] = 0.480 M and contains only one fully dissociated nitrate salt. Identify a simplest compatible formula and justify.', answer: { gradingMode: selfCheck, keyPoints: ['M(NO3)2 such as Ca(NO3)2', 'two nitrate per formula unit'] }, explanation: 'Solution: Because nitrate concentration is twice formula-unit concentration, the salt must contain two nitrate ions per formula unit, such as Ca(NO3)2. Why it works: The concentration ratio reveals the formula coefficient. Common trap: Choosing NaNO3, which would give equal formula and nitrate concentrations.', difficultyDimensions: [reverseReasoning, representationTransfer, counterexampleOrConstruction], difficultyEvidence: 'Infers a formula pattern from a concentration ratio and constructs a compatible example.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-infer-salt-subscript-from-ion-ratio, variationAxes: { givens: formula and nitrate concentrations, unknown: compatible formula class, methodBranch: reverse stoichiometry } }
  - { id: q016, type: freeResponse, prompt: 'Explain why an insoluble crystal of NaCl has no measurable solution colligative effect until it dissolves, despite being ionic.', answer: { gradingMode: selfCheck, keyPoints: ['particles must be dissolved in solvent', 'solid crystal ions are not dispersed', 'colligative effects depend on solution particles'] }, explanation: 'Solution: A solid crystal’s ions are locked in a lattice rather than dispersed through water; only dissolved particles contribute to solution colligative properties. Why it works: The relevant concentration is in the liquid solution phase. Common trap: Counting ions in the undissolved solid as solute particles.', difficultyDimensions: [domainCondition, globalLocalReasoning, proofJustification], difficultyEvidence: 'Identifies the required phase condition and connects it to macroscopic solution behavior.', prerequisiteObjectiveIds: [electrolyte-classification], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-undissolved-solid-condition, variationAxes: { scenario: undissolved crystal, constraints: phase condition, unknown: effect explanation } }
  - { id: q017, type: freeResponse, prompt: 'Two 50.0 mL samples are mixed: 0.200 M NaCl and 0.100 M AlCl3. Find final [Cl−].', answer: { gradingMode: selfCheck, keyPoints: ['0.250 M chloride', '0.0100 plus 0.0150 mol chloride', '0.1000 L total'] }, explanation: 'Solution: NaCl supplies (0.200)(0.0500)=0.0100 mol Cl−. AlCl3 supplies 3(0.100)(0.0500)=0.0150 mol Cl−. Total chloride is 0.0250 mol in 0.1000 L, or 0.250 M. Why it works: Both salts contribute the common ion, so add its moles before dilution by mixing. Common trap: Averaging the two chloride concentrations without first calculating them.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Builds separate source contributions for a common ion and applies volume mixing.', prerequisiteObjectiveIds: [ion-molarity], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: hard-common-ion-mixing, variationAxes: { scenario: common-ion mixing, unknown: final chloride, constraints: equal volume } }
  - { id: q018, type: freeResponse, prompt: 'Rank 0.10 M HCl, 0.10 M CH3COOH, and 0.10 M glucose by expected conductivity, and state what additional information would be needed for an exact middle ranking.', answer: { gradingMode: selfCheck, keyPoints: ['glucose lowest', 'HCl highest', 'acetic acid in between', 'degree of ionization for exact value'] }, explanation: 'Solution: Glucose is lowest, HCl is highest, and CH3COOH is between because it partially ionizes. An exact conductivity comparison needs the degree of ionization and ionic mobilities. Why it works: Conductivity depends on number and motion of ions, not merely formal concentration. Common trap: Ranking weak acid equal to strong acid.', difficultyDimensions: [casePartition, domainCondition, estimationOrBounds], difficultyEvidence: 'Partitions solutes by dissociation model and identifies information limiting exact comparison.', prerequisiteObjectiveIds: [electrolyte-classification], extensionObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: hard-conductivity-strength-ranking-with-limit, variationAxes: { scenario: acid and molecular comparison, unknown: ranked conductivity, constraints: missing exact ionization } }
  - { id: q019, type: freeResponse, prompt: 'A manufacturer wants an ideal 0.600 particle M antifreeze solution using CaCl2. What CaCl2 molarity is required?', answer: { gradingMode: selfCheck, keyPoints: ['0.200 M', 'three particles per formula unit'] }, explanation: 'Solution: CaCl2 produces three ions, so M = 0.600/3 = 0.200 M. Why it works: Required formula-unit concentration is target particle concentration divided by i. Common trap: Using 0.600 M CaCl2, which would create 1.80 particle M ideally.', difficultyDimensions: [reverseReasoning, auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Starts from a target particle model and solves backward to a formulation concentration.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-design-target-particle-concentration, variationAxes: { scenario: formulation design, unknown: solute molarity, governingRelation: target iM } }
  - { id: q020, type: freeResponse, prompt: 'State one reason real CaCl2 solutions can depart from the ideal i = 3 colligative prediction at higher concentration.', answer: { gradingMode: selfCheck, keyPoints: ['ion interactions or ion pairing', 'effective particles lower than ideal'] }, explanation: 'Solution: Electrostatic ion interactions or ion pairing can make the effective independent-particle count lower than the ideal value. Why it works: The ideal model assumes particles act independently. Common trap: Saying the formula itself changes in water.', difficultyDimensions: [domainCondition, modelOrDerivation, proofJustification], difficultyEvidence: 'States the independence assumption and a physical mechanism that limits it.', prerequisiteObjectiveIds: [colligative-trends], extensionObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: hard-nonideal-ion-interaction-condition, variationAxes: { scenario: nonideal solution, unknown: mechanism of deviation, constraints: higher concentration } }
