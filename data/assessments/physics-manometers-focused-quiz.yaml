- id: physics-manometers-focused-q002
  type: numericResponse
  prompt: An open water manometer has its gas-side surface $0.120\text{ m}$ lower
    than its atmospheric side. Use $\rho=1000\text{ kg/m}^3$ and $g=9.80\text{ m/s}^2$.
    What is the gas gauge pressure in Pa?
  answer:
    value: 1176
    tolerance: 2
  explanation: 'Solution: $p_{\text{gauge}}=\rho gh=(1000)(9.80)(0.120)=1176\text{
    Pa}$.


    Why it works: The lower gas-side surface shows that the gas pressure exceeds atmospheric
    pressure by the hydrostatic difference $\rho gh$.

    '
  difficultyDimensions:
  - modelOrDerivation
  - simplification
  subjectDifficultyTags:
  - gaugePressure
  difficultyEvidence: The sign and hydrostatic pressure difference must both be modeled.
  prerequisiteObjectiveIds:
  - phys1-obj-fluid-pressure
  sourceChunkIds:
  - src-20260720001005-93652b69c4:chunk-1218
  blueprintId: physics-manometers-focused-q002
- id: physics-manometers-focused-q003
  type: multipleChoice
  prompt: In an open manometer, the gas-side liquid surface is higher than the atmospheric-side
    surface. Which statement is correct?
  choices:
  - id: a
    text: The gas has negative gauge pressure and an absolute pressure below atmospheric
      pressure.
  - id: b
    text: The gas has positive gauge pressure because its liquid surface is higher.
    issueSignals:
    - id: pressure-confusion
  - id: c
    text: Gauge pressure and absolute pressure are always equal.
    issueSignals:
    - id: pressure-confusion
  answer:
    choiceId: a
  explanation: 'Solution: The gas has negative gauge pressure and an absolute pressure
    below atmospheric pressure.


    Why it works: The atmospheric side pushes the liquid lower, so atmospheric pressure
    is greater than gas pressure; gauge pressure is therefore negative.


    Why the other choices fail: A higher gas-side surface corresponds to lower, not
    higher, gas pressure, and absolute pressure includes the atmospheric reference
    while gauge pressure does not.

    '
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  - modelOrDerivation
  subjectDifficultyTags:
  - absolutePressure
  difficultyEvidence: A reversed-level scenario requires transferring both the sign
    rule and the pressure reference.
