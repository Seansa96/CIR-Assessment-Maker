questions:
- id: physics-manometers-focused-q001
  type: multipleChoice
  prompt: In a connected liquid at rest, what is true of two points at the same depth
    in the same fluid?
  choices:
  - id: a
    text: They have the same pressure.
  - id: b
    text: The point in the narrower tube always has greater pressure.
    issueSignals:
    - id: pressure-confusion
  - id: c
    text: Their pressures depend only on the total liquid volume.
    issueSignals:
    - id: pressure-confusion
    - id: volume-confusion
  answer:
    choiceId: a
  explanation: 'Solution: They have the same pressure.


    Why it works: Hydrostatic pressure in one connected fluid depends on vertical
    position, so equal-depth points have equal pressure.


    Why the other choices fail: Tube width and total volume do not create a pressure
    difference between same-depth points in a static connected liquid.

    '
  difficultyDimensions:
