- id: q-rat-et-1
  title: Long Division Application
  prompt: |-
    Evaluate the integral $\int \frac{x^2}{x-1} \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{1}{2}x^2 + x + \ln|x-1| + C$
  - id: c2
    text: $x + \ln|x-1| + C$
  - id: c3
    text: $\frac{1}{2}x^2 - x + \ln|x-1| + C$
  answer:
    choiceId: c1
  explanation: |-
    The numerator degree (2) is greater than the denominator degree (1).
    Use long division or rewrite the numerator:
    $x^2 = x^2 - 1 + 1 = (x-1)(x+1) + 1$.
    So $\frac{x^2}{x-1} = x + 1 + \frac{1}{x-1}$.
    Integrate: $\int (x + 1) \, dx + \int \frac{1}{x-1} \, dx = \frac{1}{2}x^2 + x + \ln|x-1| + C$.
  skills:
  - calc2-rational-integration

- id: q-rat-et-2
  title: Basic Partial Fraction Setup
  prompt: |-
    What is the partial fraction decomposition of $\frac{2x}{(x-4)(x+2)}$?
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{4/3}{x-4} + \frac{2/3}{x+2}$
  - id: c2
    text: $\frac{1}{x-4} + \frac{1}{x+2}$
  - id: c3
    text: $\frac{8/3}{x-4} - \frac{4/3}{x+2}$
  answer:
    choiceId: c1
  explanation: |-
    Setup: $\frac{A}{x-4} + \frac{B}{x+2}$.
    $2x = A(x+2) + B(x-4)$.
    Let $x = 4$: $8 = A(6) \implies A = 4/3$.
    Let $x = -2$: $-4 = B(-6) \implies B = 2/3$.
    Result: $\frac{4/3}{x-4} + \frac{2/3}{x+2}$.
  skills:
  - calc2-rational-integration

- id: q-rat-et-3
  title: Integrating Partial Fractions
  prompt: |-
    Evaluate $\int \left( \frac{3}{x+1} - \frac{2}{x-5} \right) \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: $3\ln|x+1| - 2\ln|x-5| + C$
  - id: c2
    text: $\ln|x+1|^3 + \ln|x-5|^2 + C$
  - id: c3
    text: $\frac{3}{(x+1)^2} - \frac{2}{(x-5)^2} + C$
  answer:
    choiceId: c1
  explanation: |-
    The integral of $\frac{k}{x+a}$ is simply $k\ln|x+a|$.
    So the answer is $3\ln|x+1| - 2\ln|x-5| + C$.
  skills:
  - calc2-rational-integration

- id: q-rat-et-4
  title: Identifying Proper vs Improper
  prompt: |-
    Which of the following rational functions requires polynomial long division before partial fraction decomposition?
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{x^3 + 2x - 1}{x^2 + 5x + 6}$
  - id: c2
    text: $\frac{x^2 - 1}{x^3 + 5x^2 + 6x}$
  - id: c3
    text: $\frac{5x + 4}{x^2 - 9}$
  answer:
    choiceId: c1
  explanation: |-
    Long division is required when the degree of the numerator is greater than or equal to the degree of the denominator.
    In choice A, the degree of the numerator is 3 and the denominator is 2. Since $3 > 2$, long division is required.
  skills:
  - calc2-rational-integration

- id: q-rat-et-5
  title: Completing the Square
  prompt: |-
    To integrate $\int \frac{1}{x^2 + 6x + 10} \, dx$, you must first complete the square in the denominator. What does the denominator become?
  type: multipleChoice
  choices:
  - id: c1
    text: $(x + 3)^2 + 1$
  - id: c2
    text: $(x + 6)^2 + 10$
  - id: c3
    text: $(x + 3)^2 - 1$
  answer:
    choiceId: c1
  explanation: |-
    Take half of the $x$ coefficient ($6/2 = 3$) and square it ($9$).
    Rewrite: $(x^2 + 6x + 9) + 1$.
    Factor: $(x + 3)^2 + 1$.
  skills:
  - calc2-rational-integration
