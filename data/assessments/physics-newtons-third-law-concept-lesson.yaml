lesson:
  introduction: |
    Newton's Third Law describes the two-sided nature of every interaction. The challenge
    is not memorizing "equal and opposite," but identifying the two objects and keeping
    their forces on separate free-body diagrams.
  sections:
    - id: interaction-pair
      title: Every interaction produces two forces
      required: true
      content: |
        If object A exerts a force on object B, then B simultaneously exerts a force on A:

        $$
        \vec{F}_{A\to B}=-\vec{F}_{B\to A}.
        $$

        The forces have equal magnitude, opposite direction, the same interaction type,
        and act on different objects.
      media:
        - type: image
          src: /assessments/physics-dynamics/newton-third-law-pair.svg
          alt: Two objects exerting equal and opposite interaction forces on each other.
          caption: Third-law partners act on different objects.
      check:
        id: interaction-pair-check
        type: selectAll
        prompt: Which properties must a Newton's Third Law pair share?
        choices:
          - id: a
            text: Equal magnitude
          - id: b
            text: Opposite direction
          - id: c
            text: The forces act on different objects
          - id: d
            text: The forces cancel on one object's free-body diagram
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: |
          Third-law partners cannot cancel on a single free-body diagram because they act
          on different objects.

          Related topic: interaction notation.

    - id: naming-pairs
      title: Name both objects in the force
      required: true
      content: |
        Use the template "force on ___ by ___." If Earth pulls downward on a book, the
        partner is the book pulling upward on Earth.

        Writing subscripts as $\vec{F}_{\text{source}\to\text{receiver}}$ prevents pairing
        forces merely because they look opposite.
      check:
        id: naming-pairs-check
        type: multipleChoice
        prompt: What is the partner to the gravitational force of Earth on a falling ball?
        choices:
          - id: a
            text: The gravitational force of the ball on Earth
          - id: b
            text: Air resistance on the ball
          - id: c
            text: The ball's acceleration
          - id: d
            text: The ball's weight and normal force
        answer:
          choiceId: a
        explanation: |
          The interaction is gravitational and involves the same two objects with source
          and receiver reversed.

          Related topic: force-pair identification.

    - id: why-pairs-do-not-cancel
      title: Why action-reaction forces do not cancel motion
      required: true
      content: |
        To predict one object's acceleration, sum only forces acting **on that object**.
        The reaction force acts on the other object and belongs on its separate diagram.

        Forces cancel in a net-force equation only when they act on the same chosen system.
      check:
        id: why-pairs-do-not-cancel-check
        type: multipleChoice
        prompt: Why can a person accelerate forward while pushing backward on the ground?
        choices:
          - id: a
            text: The ground exerts a forward static-friction force on the person.
          - id: b
            text: The person's backward force and the ground's forward force cancel on the person.
          - id: c
            text: The person exerts a forward force on themself.
          - id: d
            text: Newton's Third Law does not apply during acceleration.
        answer:
          choiceId: a
        explanation: |
          The person pushes the ground backward; the ground pushes the person forward.
          Only the forward force of the ground acts on the person.

          Related topic: propulsion and static friction.

    - id: unequal-acceleration
      title: Equal forces can produce unequal accelerations
      required: true
      content: |
        Third-law forces have equal magnitude, but

        $$
        a=\frac{F}{m}.
        $$

        If the interacting objects have different masses, the same force magnitude gives
        different acceleration magnitudes.
      check:
        id: unequal-acceleration-check
        type: multipleChoice
        prompt: A truck collides with a small car. During contact, which statement is correct?
        choices:
          - id: a
            text: They exert equal-magnitude forces, but the smaller-mass car has greater acceleration magnitude.
          - id: b
            text: The truck exerts the larger force because it has more mass.
          - id: c
            text: The car exerts no force on the truck.
          - id: d
            text: Equal forces require equal accelerations.
        answer:
          choiceId: a
        explanation: |
          Third Law fixes the force pair. Second Law combines that force with each object's
          mass to determine acceleration.

          Related topic: combining Newton's Second and Third Laws.

    - id: normal-and-weight
      title: Weight and normal force are usually not a Third-Law pair
      required: true
      content: |
        For a book on a table, weight is Earth pulling on the book. The normal force is the
        table pushing on the book. Both act on the book, so they are not partners.

        Their partners are:

        - book pulling gravitationally on Earth,
        - book pushing downward on the table.
      check:
        id: normal-and-weight-check
        type: multipleChoice
        prompt: Why are a book's weight and the table's normal force not a Third-Law pair?
        choices:
          - id: a
            text: Both forces act on the book and come from different interactions.
          - id: b
            text: They never have equal magnitude.
          - id: c
            text: Gravity has no reaction force.
          - id: d
            text: Normal forces do not obey Newton's laws.
        answer:
          choiceId: a
        explanation: |
          A third-law pair must act on different objects and arise from the same interaction.

          Related topic: free-body diagrams versus interaction diagrams.

    - id: system-boundary
      title: Internal pairs and system boundaries
      required: true
      content: |
        If A and B are combined into one system, their mutual third-law forces are internal
        and cancel in the total momentum balance. External forces still determine the
        system momentum change:

        $$
        \sum\vec{F}_{ext}=\frac{d\vec{P}_{system}}{dt}.
        $$
      check:
        id: system-boundary-check
        type: multipleChoice
        prompt: |
          When two interacting carts are treated as one system, their mutual contact
          forces are:
        choices:
          - id: a
            text: Internal forces that cancel in the system force sum
          - id: b
            text: Two external forces that must be added
          - id: c
            text: Absent from the interaction
          - id: d
            text: Unequal because the carts may have different masses
        answer:
          choiceId: a
        explanation: |
          Reversing source and receiver gives equal opposite internal forces. The chosen
          system boundary determines whether a force is internal or external.

          Related topic: system momentum and internal forces.

    - id: third-law-synthesis
      title: Identify a pair reliably
      required: true
      content: |
        A valid Third-Law pair passes three tests:

        1. same two objects,
        2. same interaction type,
        3. source and receiver reversed.
      check:
        id: third-law-synthesis-check
        type: multipleChoice
        prompt: Which pair satisfies all three tests?
        choices:
          - id: a
            text: Rope pulls climber upward; climber pulls rope downward
          - id: b
            text: Earth pulls climber downward; rope pulls climber upward
          - id: c
            text: Rope pulls climber upward; climber accelerates upward
          - id: d
            text: Climber's weight; climber's mass
        answer:
          choiceId: a
        explanation: |
          The same rope-climber interaction is described with source and receiver reversed.

          Related topic: Newton's Third Law pair checklist.
