lesson:
  introduction: |-
    Triangles are the most fundamental polygon in geometry. Every other polygon can be divided into triangles! In this lesson, we will explore how to classify triangles and learn one of the most famous theorems in all of mathematics: The Triangle Angle Sum Theorem.
  sections:
  - id: sec-classification
    title: Classifying Triangles
    required: true
    content: |-
      Triangles can be classified in two different ways: by their **angles** and by their **sides**.
      
      **By Angles:**
      1. **Acute Triangle**: All three angles are acute (less than $90^\circ$).
      2. **Right Triangle**: Has exactly one right angle ($90^\circ$).
      3. **Obtuse Triangle**: Has exactly one obtuse angle (greater than $90^\circ$).
      
      **By Sides:**
      1. **Scalene Triangle**: No sides are congruent (all three have different lengths).
      2. **Isosceles Triangle**: At least two sides are congruent.
      3. **Equilateral Triangle**: All three sides are congruent. (Note: an equilateral triangle is technically a special type of isosceles triangle!).

  - id: sec-angle-sum
    title: The Triangle Angle Sum Theorem
    required: true
    content: |-
      The **Triangle Angle Sum Theorem** states that the sum of the interior angle measures of any triangle is exactly $180^\circ$.
      
      If you have $\triangle ABC$ with interior angles $\angle A$, $\angle B$, and $\angle C$, then:
      $$m\angle A + m\angle B + m\angle C = 180^\circ$$
      
      This powerful theorem allows us to find the measure of a missing angle if we know the other two. For example, if $m\angle A = 50^\circ$ and $m\angle B = 60^\circ$, then $m\angle C$ must be $180^\circ - (50^\circ + 60^\circ) = 70^\circ$.

questions:
- id: q-geom-tri-1
  title: Concept Check - Classification
  prompt: |-
    A triangle has angles measuring $30^\circ$, $60^\circ$, and $90^\circ$. How would you classify this triangle by its angles?
  type: multipleChoice
  choices:
  - id: c1
    text: Acute Triangle
  - id: c2
    text: Right Triangle
  - id: c3
    text: Obtuse Triangle
  answer:
    choiceId: c2
  explanation: |-
    Because the triangle has exactly one $90^\circ$ angle, it is classified as a **Right Triangle**.
  skills:
  - geometry-triangles-basics

- id: q-geom-tri-2
  title: Concept Check - Angle Sum
  prompt: |-
    In $\triangle XYZ$, $m\angle X = 45^\circ$ and $m\angle Y = 100^\circ$. What is the measure of $\angle Z$?
  type: numericResponse
  answer:
    numericValue: 35
    tolerance: 0
  explanation: |-
    According to the Triangle Angle Sum Theorem, the angles must add up to $180^\circ$.
    $$180^\circ - (45^\circ + 100^\circ) = 180^\circ - 145^\circ = 35^\circ$$
  skills:
  - geometry-triangles-basics
