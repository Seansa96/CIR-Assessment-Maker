schemaVersion: 1
id: aops-triangles-olympiad-test
title: Triangles Olympiad Test
description: A contest-level scored assessment emphasizing enumeration, reverse engineering, locus proofs, and extremal structure.
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-triangles
skills:
- Enumerate integer and Pythagorean configurations
- Reverse engineer triangle measurements from center data
- Combine tangent, area, and projection relations
- Prove concurrency and extremal claims from first principles
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags: [art-of-problem-solving, aops-triangles, geometry, olympiad, formal-test, locus-proof, extremal-geometry]
questions:
- id: olympiad-test-q001
  type: multipleChoice
  prompt: How many unordered integer right triangles have perimeter 120?
  choices: [{id: a, text: '1'}, {id: b, text: '2'}, {id: c, text: '3'}, {id: d, text: '4'}]
  answer: {choiceId: c}
  explanation: The triples are $(20,48,52)$, $(24,45,51)$, and $(30,40,50)$.
- id: olympiad-test-q002
  type: multipleChoice
  prompt: Consecutive integers $x-1,x,x+1$ are side lengths of a right triangle. Find its perimeter.
  choices: [{id: a, text: '$9$'}, {id: b, text: '$12$'}, {id: c, text: '$15$'}, {id: d, text: '$18$'}]
  answer: {choiceId: b}
  explanation: $(x-1)^2+x^2=(x+1)^2$ reduces to $x(x-4)=0$, so the positive sides are 3, 4, 5 and perimeter 12.
- id: olympiad-test-q003
  type: multipleChoice
  prompt: How many isosceles integer-sided nondegenerate triangles have perimeter 20?
  choices: [{id: a, text: '2'}, {id: b, text: '3'}, {id: c, text: '4'}, {id: d, text: '5'}]
  answer: {choiceId: c}
  explanation: With unordered sides, they are $(2,9,9)$, $(4,8,8)$, $(6,6,8)$, and $(6,7,7)$.
- id: olympiad-test-q004
  type: multipleChoice
  prompt: A triangle is cut by a segment parallel to its base. The small triangle has one fourth the area of the original. What fraction of each side from the shared vertex lies above the cut?
  choices: [{id: a, text: '$1/4$'}, {id: b, text: '$1/2$'}, {id: c, text: '$2/3$'}, {id: d, text: '$3/4$'}]
  answer: {choiceId: b}
  explanation: The positive linear factor is the square root of the area factor, $\sqrt{1/4}=1/2$.
- id: olympiad-test-q005
  type: multipleChoice
  prompt: An altitude to a right triangle's hypotenuse has length 10, and the whole hypotenuse is 25. What is the smaller hypotenuse segment?
  choices: [{id: a, text: '$4$'}, {id: b, text: '$5$'}, {id: c, text: '$10$'}, {id: d, text: '$20$'}]
  answer: {choiceId: b}
  explanation: The segments satisfy $p+q=25$ and $pq=100$, so they are the roots of $t^2-25t+100=0$, namely 5 and 20.
- id: olympiad-test-q006
  type: multipleChoice
  prompt: 'A right triangle has inradius 4 and circumradius $\frac{41}{2}$. Find its area.'
  choices: [{id: a, text: '$90$'}, {id: b, text: '$164$'}, {id: c, text: '$180$'}, {id: d, text: '$360$'}]
  answer: {choiceId: c}
  explanation: The hypotenuse is 41. Since $r=(a+b-c)/2$, $a+b=49$. Then $49^2=41^2+2ab$ gives $ab=360$, so area is $ab/2=180$.
- id: olympiad-test-q007
  type: multipleChoice
  prompt: An equilateral triangle has inradius 6. What is its circumradius?
  choices: [{id: a, text: '$6$'}, {id: b, text: '$6\sqrt3$'}, {id: c, text: '$12$'}, {id: d, text: '$12\sqrt3$'}]
  answer: {choiceId: c}
  explanation: In an equilateral triangle the common center divides the altitude $2:1$, so the circumradius is twice the inradius.
- id: olympiad-test-q008
  type: multipleChoice
  prompt: An internal angle bisector divides the opposite side in ratio $2:3$. The triangle's two adjacent sides have total length 35. Find the shorter adjacent side.
  choices: [{id: a, text: '$12$'}, {id: b, text: '$14$'}, {id: c, text: '$15$'}, {id: d, text: '$21$'}]
  answer: {choiceId: b}
  explanation: The angle-bisector theorem gives adjacent-side ratio $2:3$; five parts total 35, so the shorter side is 14.
- id: olympiad-test-q009
  type: multipleChoice
  prompt: A cevian divides the opposite side in ratio $2:3$. If the whole triangle has area 75, what is the area of the subtriangle on the shorter base segment?
  choices: [{id: a, text: '$25$'}, {id: b, text: '$30$'}, {id: c, text: '$45$'}, {id: d, text: '$50$'}]
  answer: {choiceId: b}
  explanation: The subtriangles share an altitude, so their areas have ratio $2:3$; the shorter-base region has $2/5$ of 75, or 30.
- id: olympiad-test-q010
  type: multipleChoice
  prompt: A triangle has vertices $(0,0)$, $(12,0)$, and $(0,9)$. What is its centroid?
  choices: [{id: a, text: '$(3,4)$'}, {id: b, text: '$(4,3)$'}, {id: c, text: '$(6,9/2)$'}, {id: d, text: '$(4,4)$'}]
  answer: {choiceId: b}
  explanation: Average the vertex coordinates to obtain $((0+12+0)/3,(0+0+9)/3)=(4,3)$.
- id: olympiad-test-q011
  type: multipleChoice
  prompt: An isosceles triangle has sides 25, 25, and 14. Find its inradius.
  choices: [{id: a, text: '$4$'}, {id: b, text: '$21/4$'}, {id: c, text: '$6$'}, {id: d, text: '$24/5$'}]
  answer: {choiceId: b}
  explanation: The altitude bisects the base into 7 and 7, so its height is 24 and area is 168. Semiperimeter is 32, hence $r=168/32=21/4$.
- id: olympiad-test-q012
  type: multipleChoice
  prompt: A triangle has base 10 and perimeter 30. What is its maximum possible area?
  choices: [{id: a, text: '$25$'}, {id: b, text: '$25\sqrt2$'}, {id: c, text: '$25\sqrt3$'}, {id: d, text: '$50$'}]
  answer: {choiceId: c}
  explanation: The other sides have fixed sum 20; symmetry maximizes altitude when they are both 10, giving an equilateral triangle of area $25\sqrt3$.
- id: olympiad-test-q013
  type: selectAll
  prompt: Which statements are valid counterexample or safeguard principles?
  choices:
  - {id: a, text: Equal perimeters do not imply congruence.}
  - {id: b, text: AAA does not imply congruence.}
  - {id: c, text: SSA can produce two noncongruent triangles.}
  - {id: d, text: Every visually symmetric drawing proves equal sides.}
  answer: {choiceIds: [a, b, c]}
  explanation: Diagram appearance alone supplies no equality theorem.
- id: olympiad-test-q014
  type: selectAll
  prompt: Which conditions are individually sufficient to prove that $AB=AC$?
  choices:
  - {id: a, text: '$\angle B=\angle C$'}
  - {id: b, text: The cevian from $A$ is both a median and angle bisector.}
  - {id: c, text: The cevian from $A$ is both a median and altitude.}
  - {id: d, text: A median is drawn from $A$.}
  answer: {choiceIds: [a, b, c]}
  explanation: The first is the converse isosceles theorem; the next two yield congruent half-triangles. A median alone exists in every triangle.
- id: olympiad-test-q015
  type: freeResponse
  prompt: Prove that the three internal angle bisectors of a nondegenerate triangle are concurrent and that their intersection lies inside the triangle.
  media:
  - type: image
    src: /assessments/aops/aops-triangles-four-centers.svg
    alt: Incenter panel showing three internal angle bisectors meeting at I inside a triangle and an incircle tangent to all sides.
  answer:
    gradingMode: selfCheck
    expected: 'Let the internal bisectors of angles $A$ and $B$ meet at $I$. Each internal bisector lies within its angle, so their intersection is inside the triangle. Because $I$ lies on the bisector of $A$, its perpendicular distances to sides $AB$ and $AC$ are equal. Because it lies on the bisector of $B$, its distances to $BA$ and $BC$ are equal. Hence its distances to $AC$ and $BC$ are equal, so by the converse angle-bisector locus theorem $I$ lies on the internal bisector of angle $C$. Therefore all three internal angle bisectors are concurrent at the interior point $I$.'
    keyPoints:
    - Intersects two internal angle bisectors.
    - Uses equal perpendicular-distance locus facts twice.
    - Transfers equality to the remaining two sides.
    - Invokes the converse locus theorem for the third bisector.
    - Explains why the point is interior.
  explanation: Concurrency follows from transitive equality of distances to the three side lines.
