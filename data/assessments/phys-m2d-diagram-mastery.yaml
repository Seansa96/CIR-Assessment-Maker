questions:
  - id: m2d-diag-q01
    title: Projectile Velocity Vector at Peak
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A diagram shows the parabolic trajectory of a projectile fired from the ground. At the very highest point (the peak) of the trajectory, what should the velocity vector ($\vec{v}$) look like?
    choices:
      - id: a
        text: It should be a horizontal arrow pointing in the direction of motion.
      - id: b
        text: It should be zero (a single point with no arrow).
      - id: c
        text: It should point straight down.
      - id: d
        text: It should point diagonally down and forward.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** At the peak, the vertical component of velocity ($v_y$) is zero. However, the horizontal component ($v_x$) remains constant throughout the flight. Thus, the total velocity vector is purely horizontal.

  - id: m2d-diag-q02
    title: Projectile Acceleration Vector
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] In a diagram of a projectile's flight (ignoring air resistance), arrows are drawn representing the acceleration vector ($\vec{a}$) at various points: just after launch, at the peak, and just before landing. How should these arrows compare?
    choices:
      - id: a
        text: They should all point straight down and be the exact same length.
      - id: b
        text: The arrow should point up at launch, be zero at the peak, and point down before landing.
      - id: c
        text: The arrow should always point tangent to the parabolic path.
      - id: d
        text: The arrow should point down, but be longest at launch and shortest at the peak.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The only force acting on a projectile in free fall is gravity. Therefore, the acceleration is constant ($9.8\text{ m/s}^2$ downwards) everywhere along the path.

  - id: m2d-diag-q03
    title: Vector Addition (Head-to-Tail)
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A diagram shows vector $\vec{A}$ pointing East and vector $\vec{B}$ pointing North. To find $\vec{A} + \vec{B}$ using the head-to-tail method, how should the vectors be arranged, and where does the resultant vector point?
    choices:
      - id: a
        text: Place the tail of $\vec{B}$ at the head of $\vec{A}$. The resultant points from the tail of $\vec{A}$ to the head of $\vec{B}$ (Northeast).
      - id: b
        text: Place both tails together. The resultant points from the head of $\vec{A}$ to the head of $\vec{B}$ (Northwest).
      - id: c
        text: Place the heads together. The resultant points away from the heads.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The head-to-tail method involves chaining the vectors. The resultant is drawn from the very start (tail of first) to the very end (head of last).

  - id: m2d-diag-q04
    title: Vector Subtraction
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A diagram shows two velocity vectors originating from the same point: $\vec{v}_1$ (East) and $\vec{v}_2$ (North). The change in velocity is $\Delta\vec{v} = \vec{v}_2 - \vec{v}_1$. Which arrow correctly represents $\Delta\vec{v}$?
    choices:
      - id: a
        text: An arrow pointing from the head of $\vec{v}_1$ to the head of $\vec{v}_2$ (Northwest).
      - id: b
        text: An arrow pointing from the head of $\vec{v}_2$ to the head of $\vec{v}_1$ (Southeast).
      - id: c
        text: An arrow starting from the origin and pointing Northeast.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** When tails are placed together, the difference vector $\vec{B} - \vec{A}$ points from the head of the subtracted vector ($\vec{A}$) to the head of the other vector ($\vec{B}$).

  - id: m2d-diag-q05
    title: Relative Velocity (Boat crossing a river)
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A river flows East. A boat aims its bow directly North to cross the river. In a vector diagram, the boat's velocity relative to the water ($\vec{v}_{BW}$) points North, and the water's velocity relative to the shore ($\vec{v}_{WS}$) points East. Which direction does the boat's velocity relative to the shore ($\vec{v}_{BS}$) point?
    choices:
      - id: a
        text: Northeast (the diagonal of the rectangle formed by the two vectors).
      - id: b
        text: Northwest.
      - id: c
        text: Directly North, but with a longer vector.
      - id: d
        text: Directly East.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** $\vec{v}_{BS} = \vec{v}_{BW} + \vec{v}_{WS}$. Adding a North vector and an East vector gives a Northeast resultant. The boat drifts downstream as it crosses.

  - id: m2d-diag-q06
    title: Velocity Components on an Incline
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block slides down a $30°$ incline. You set up a coordinate system where the x-axis is parallel to the incline (downwards is $+x$) and the y-axis is perpendicular. How should the velocity vector be drawn in this coordinate system?
    choices:
      - id: a
        text: It lies entirely along the $+x$ axis (no y-component).
      - id: b
        text: It lies entirely along the $-y$ axis.
      - id: c
        text: It has both a positive x-component and a negative y-component.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The advantage of tilting the coordinate system to match the incline is that all motion happens along the x-axis. The block doesn't move into or off of the ramp, so $v_y = 0$.

  - id: m2d-diag-q07
    title: Projectile Path Independence
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A diagram shows two balls. Ball A is dropped from rest, and Ball B is thrown horizontally at $5\text{ m/s}$ from the same height at the same time. Strobe light positions are shown every 0.1 seconds. How do the vertical positions of the two balls compare in the diagram?
    choices:
      - id: a
        text: Ball A and Ball B are at the exact same vertical height at each time interval.
      - id: b
        text: Ball A is always lower than Ball B because it isn't moving horizontally.
      - id: c
        text: Ball B is always lower than Ball A because it travels a longer total path.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Horizontal and vertical motions are independent. Both balls have $v_{yi} = 0$ and experience the same downward acceleration ($g$). Thus, they fall at the exact same rate.

  - id: m2d-diag-q08
    title: Circular Motion Velocity Vector
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] An object moves clockwise in a horizontal circle. When the object is at the Northernmost point of the circle (12 o'clock position), which direction does its velocity vector point?
    choices:
      - id: a
        text: East
      - id: b
        text: West
      - id: c
        text: South
      - id: d
        text: Tangent to the circle, pointing outwards.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Velocity is always tangent to the path. At 12 o'clock, moving clockwise means the object is heading to the right (East).

  - id: m2d-diag-q09
    title: Trajectory of an object dropped from a plane
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A plane flies horizontally at a constant speed and drops a package. If you are standing on the ground watching from the side, what shape does the package's trajectory form in the diagram?
    choices:
      - id: a
        text: A half-parabola curving downwards and forwards.
      - id: b
        text: A straight vertical line downwards.
      - id: c
        text: A straight diagonal line.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The package retains the plane's forward horizontal velocity but accelerates downwards from $v_{yi} = 0$. This creates a half-parabola. (From the pilot's perspective, it looks like it falls straight down).

  - id: m2d-diag-q10
    title: Range of Projectiles at Different Angles
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A diagram shows the trajectories of projectiles launched at the same initial speed but different angles: $30°$, $45°$, and $60°$. Assuming no air resistance, which two trajectories land at the exact same spot?
    choices:
      - id: a
        text: The $30°$ and $60°$ trajectories.
      - id: b
        text: The $45°$ and $60°$ trajectories.
      - id: c
        text: The $30°$ and $45°$ trajectories.
      - id: d
        text: None of them land in the same spot.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Complementary angles (angles that add up to $90°$, like 30 and 60) yield the same horizontal range for a given initial speed on level ground.
