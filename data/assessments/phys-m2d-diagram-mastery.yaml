questions:
- id: m2d-diag-plane-1
  type: multipleChoice
  prompt: '[Diagram Interpretation] A vector triangle shows $\vec{A}$ pointing East,
    $\vec{B}$ pointing North, and $\vec{C}$ acting as the hypotenuse from the tail
    of A to the tip of B. If this represents relative motion, which equation applies?'
  choices:
  - id: a
    text: $\vec{C} = \vec{A} + \vec{B}$
  - id: b
    text: $\vec{B} = \vec{A} + \vec{C}$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Head-to-tail addition means the sum is drawn
    from the first tail to the final head.'
- id: m2d-diag-boat-1
  type: multipleChoice
  prompt: '[Diagram Interpretation] A boat''s velocity relative to water is drawn
    perpendicular to the river''s velocity. The resultant vector $\vec{v}_{boat/ground}$
    points diagonally. Does the boat reach the exact opposite point on the bank?'
  choices:
  - id: a
    text: No, it drifts downstream.
  - id: b
    text: Yes, its heading guarantees it.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** To reach the exact opposite point, the *resultant*
    vector must be perpendicular to the bank, meaning the boat must head *upstream*.'
