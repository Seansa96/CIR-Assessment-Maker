workedExamples:
- id: aops-quadrilaterals-problem-1
  title: A parallelogram diagonal equation
  problem: |
    Parallelogram $ABCD$ has diagonals intersecting at $O$. Along diagonal $AC$, $AO=3x+1$ and $OC=5x-9$. Find $x$, $AO$, and the full length $AC$. Explain why the equation you use is justified.
  steps:
  - id: aops-quadrilaterals-p1-s1
    title: Parse the classification and target segment
    instruction: Record the stated classification before reading equalities from the diagram.
    type: multipleChoice
    prompt: Which given fact authorizes a relationship between $AO$ and $OC$?
    media:
    - type: image
      src: /assessments/aops/aops-quadrilaterals-parallelogram.svg
      alt: Parallelogram ABCD whose diagonals AC and BD intersect at O and bisect one another.
      caption: The matching marks on each diagonal summarize the bisection property proved from the parallelogram hypothesis.
    choices:
    - {id: a, text: '$ABCD$ is stated to be a parallelogram.'}
    - {id: b, text: The diagonals look nearly equal.}
    - {id: c, text: Point $O$ is drawn near the center.}
    - {id: d, text: Every quadrilateral has bisecting diagonals.}
    answer: {choiceId: a}
    explanation: Diagonals bisect one another in every parallelogram; appearance alone supplies no equality.
  - id: aops-quadrilaterals-p1-s2
    title: Translate bisection into an equation
    instruction: Equate the two parts of the same diagonal, not the two full diagonals.
    type: multipleChoice
    prompt: Which equation is correct?
    choices:
    - {id: a, text: '$3x+1=5x-9$'}
    - {id: b, text: '$3x+1+5x-9=0$'}
    - {id: c, text: '$2(3x+1)=5x-9$'}
    - {id: d, text: '$3x+1=2(5x-9)$'}
    answer: {choiceId: a}
    explanation: Bisection gives $AO=OC$, so their two expressions must be equal.
  - id: aops-quadrilaterals-p1-s3
    title: Solve without losing the geometric meaning
    instruction: Isolate $x$ and then return to the segment expressions.
    type: multipleChoice
    prompt: What value of $x$ satisfies the bisection equation?
    choices:
    - {id: a, text: '$4$'}
    - {id: b, text: '$5$'}
    - {id: c, text: '$8$'}
    - {id: d, text: '$10$'}
    answer: {choiceId: b}
    explanation: $3x+1=5x-9$ gives $10=2x$, so $x=5$.
  - id: aops-quadrilaterals-p1-s4
    title: Compute both halves before the whole
    instruction: Substitute $x=5$ into both formulas as an equality check.
    type: multipleChoice
    prompt: What are $AO$ and $OC$?
    choices:
    - {id: a, text: '$AO=16$ and $OC=16$'}
    - {id: b, text: '$AO=14$ and $OC=16$'}
    - {id: c, text: '$AO=16$ and $OC=32$'}
    - {id: d, text: '$AO=32$ and $OC=32$'}
    answer: {choiceId: a}
    explanation: $3(5)+1=16$ and $5(5)-9=16$, confirming the required equality.
  - id: aops-quadrilaterals-p1-s5
    title: Reconstruct and verify the requested diagonal
    instruction: Add adjacent subsegments and state the theorem used.
    type: freeResponse
    prompt: State $AC$ and give a complete verification in the original setting.
    answer:
      gradingMode: selfCheck
      expected: 'Since a parallelogram has diagonals that bisect each other, $AO=OC$. Solving $3x+1=5x-9$ gives $x=5$, and substitution gives $AO=OC=16$. Therefore $AC=AO+OC=16+16=32$ units. The positive equal halves verify both the algebra and the geometric restriction.'
      keyPoints:
      - Names diagonal bisection as the reason for equality.
      - Finds $x=5$.
      - Verifies both half-diagonals equal 16.
      - Adds them to obtain $AC=32$.
    explanation: The final answer is the full diagonal, so stopping at a half-length would not answer the question.
- id: aops-quadrilaterals-problem-2
  title: Rhombus measurements from its diagonals
  problem: |
    A rhombus has diagonals of lengths 10 and 24. Find its side length, area, and perimeter. Justify the right triangle used in the calculation.
  steps:
  - id: aops-quadrilaterals-p2-s1
    title: Identify the diagonal structure
    instruction: Use all relevant rhombus properties before introducing a formula.
    type: multipleChoice
    prompt: What happens at the intersection of the rhombus diagonals?
    media:
    - type: image
      src: /assessments/aops/aops-quadrilaterals-special-types.svg
      alt: Rhombus with four congruent sides and diagonals marked perpendicular at their intersection.
      caption: In a rhombus, the parallelogram property bisects both diagonals and the rhombus specialization makes them perpendicular.
    choices:
    - {id: a, text: They bisect each other at right angles.}
    - {id: b, text: They are congruent but do not bisect.}
    - {id: c, text: One diagonal is always twice the other.}
    - {id: d, text: Nothing is known about their intersection.}
    answer: {choiceId: a}
    explanation: A rhombus is a parallelogram, so the diagonals bisect; rhombus diagonals are also perpendicular.
  - id: aops-quadrilaterals-p2-s2
    title: Form one of four right triangles
    instruction: Halve both full diagonals and use their perpendicular intersection.
    type: multipleChoice
    prompt: What are the two leg lengths in a corner right triangle?
    choices:
    - {id: a, text: '$5$ and $12$'}
    - {id: b, text: '$10$ and $12$'}
    - {id: c, text: '$5$ and $24$'}
    - {id: d, text: '$10$ and $24$'}
    answer: {choiceId: a}
    explanation: 'Bisection halves the diagonals: $10/2=5$ and $24/2=12$.'
  - id: aops-quadrilaterals-p2-s3
    title: Find the side with Pythagoras
    instruction: The rhombus side is the hypotenuse of the right triangle just established.
    type: multipleChoice
    prompt: What is the side length?
    choices:
    - {id: a, text: '$11$'}
    - {id: b, text: '$13$'}
    - {id: c, text: '$17$'}
    - {id: d, text: '$26$'}
    answer: {choiceId: b}
    explanation: $s^2=5^2+12^2=169$, so the positive side length is $s=13$.
  - id: aops-quadrilaterals-p2-s4
    title: Compute area from four right triangles
    instruction: Derive the diagonal-area formula rather than treating it as unexplained memory.
    type: multipleChoice
    prompt: What is the rhombus area?
    choices:
    - {id: a, text: '$60$ square units'}
    - {id: b, text: '$120$ square units'}
    - {id: c, text: '$130$ square units'}
    - {id: d, text: '$240$ square units'}
    answer: {choiceId: b}
    explanation: Four triangles each have area $\tfrac12(5)(12)=30$, so the total is 120; equivalently $K=\tfrac12(10)(24)$.
  - id: aops-quadrilaterals-p2-s5
    title: Finish with perimeter and independent checks
    instruction: Use the four congruent sides and verify both the Pythagorean and area calculations.
    type: freeResponse
    prompt: State the perimeter and provide two concise checks for the complete result.
    answer:
      gradingMode: selfCheck
      expected: 'The perimeter is $4(13)=52$ units. The side check is $5^2+12^2=25+144=169=13^2$. The area check is $4[\tfrac12(5)(12)]=120$ square units, which agrees with $\tfrac12(10)(24)=120$.'
      keyPoints:
      - Finds perimeter 52.
      - Verifies the 5-12-13 right triangle.
      - Verifies area 120 by four triangles.
      - Uses correct linear and square units.
    explanation: Two structurally different area calculations make an arithmetic or interpretation error easier to detect.
- id: aops-quadrilaterals-problem-3
  title: Isosceles trapezoid synthesis
  problem: |
    An isosceles trapezoid has bases 10 and 18 and congruent legs of length 5. Find its height, area, midsegment length, and diagonal length. Explain why the unequal base length can be split evenly at the two ends.
  steps:
  - id: aops-quadrilaterals-p3-s1
    title: Drop altitudes and use symmetry
    instruction: Convert the base difference into two congruent horizontal offsets.
    type: multipleChoice
    prompt: What is the horizontal leg of each corner right triangle?
    media:
    - type: image
      src: /assessments/aops/aops-quadrilaterals-trapezoid.svg
      alt: Isosceles trapezoid with bases 10 and 18, congruent legs 5, perpendicular height 3, and midsegment 14.
      caption: Congruent legs make the two corner right triangles congruent, so they split the base difference equally.
    choices:
    - {id: a, text: '$3$'}
    - {id: b, text: '$4$'}
    - {id: c, text: '$5$'}
    - {id: d, text: '$8$'}
    answer: {choiceId: b}
    explanation: The base difference is $18-10=8$, and symmetry divides it into two offsets of 4.
  - id: aops-quadrilaterals-p3-s2
    title: Find the perpendicular height
    instruction: Use a corner right triangle with hypotenuse 5 and horizontal leg 4.
    type: multipleChoice
    prompt: What is the height?
    choices:
    - {id: a, text: '$3$'}
    - {id: b, text: '$4$'}
    - {id: c, text: '$\sqrt{41}$'}
    - {id: d, text: '$9$'}
    answer: {choiceId: a}
    explanation: $h^2+4^2=5^2$, so $h^2=9$ and the positive height is 3.
  - id: aops-quadrilaterals-p3-s3
    title: Use average width for area
    instruction: Average the bases, then multiply by perpendicular height.
    type: multipleChoice
    prompt: What is the area?
    choices:
    - {id: a, text: '$28$ square units'}
    - {id: b, text: '$42$ square units'}
    - {id: c, text: '$54$ square units'}
    - {id: d, text: '$84$ square units'}
    answer: {choiceId: b}
    explanation: $K=\tfrac12(10+18)(3)=14\cdot3=42$ square units.
  - id: aops-quadrilaterals-p3-s4
    title: Read the midsegment and diagonal run
    instruction: Separate the average-base calculation from the horizontal run of a diagonal.
    type: multipleChoice
    prompt: Which pair correctly gives the midsegment and the horizontal run of a diagonal from a lower vertex to the opposite upper vertex?
    choices:
    - {id: a, text: '$14$ and $14$'}
    - {id: b, text: '$14$ and $10$'}
    - {id: c, text: '$8$ and $14$'}
    - {id: d, text: '$18$ and $10$'}
    answer: {choiceId: a}
    explanation: The midsegment is $(10+18)/2=14$. From a lower endpoint, the diagonal spans the 4-unit offset plus the 10-unit upper base, also 14 horizontally.
  - id: aops-quadrilaterals-p3-s5
    title: Compute the diagonal and verify the full model
    instruction: Apply Pythagoras to horizontal run 14 and height 3, then check every quantity against the original dimensions.
    type: freeResponse
    prompt: State the diagonal length and summarize the verified height, area, and midsegment.
    answer:
      gradingMode: selfCheck
      expected: 'The diagonal is $\sqrt{14^2+3^2}=\sqrt{205}$ units. The corner check is $3^2+4^2=5^2$, so the height 3 is consistent with each leg. The midsegment is $(10+18)/2=14$ units, and the area is $14\cdot3=42$ square units. All lengths are positive and the two 4-unit offsets account for the full base difference of 8.'
      keyPoints:
      - Finds diagonal $\sqrt{205}$.
      - Verifies the 3-4-5 corner triangle.
      - States midsegment 14 and area 42.
      - Checks that the two offsets total the base difference.
    explanation: The final consistency checks connect the right-triangle decomposition back to the original trapezoid rather than leaving isolated calculations.
