- id: aops-quads-we-1
  title: Area of a Trapezoid from 4 Sides
  steps:
  - id: step-1
    title: Slide a leg to create a triangle
    prompt: Draw a line parallel to the side of length 13, starting from the opposite vertex, to partition
      the trapezoid into a parallelogram and a triangle. What are the side lengths of this new triangle?
    difficultyDimensions:
    - Partition the base of 24 using the top base of 10.
    - Identify the sides of the newly formed triangle.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The parallelogram has bases of 10 and sides of 13.
      - The triangle's base is $24 - 10 = 14$.
      - The triangle's sides are 13, 14, and 15.
    explanation: 'Solution:

      Let the trapezoid be $ABCD$ with bases $AB = 10$ and $CD = 24$, and legs $AD = 13$ and $BC = 15$.

      Draw a line from $B$ parallel to $AD$, intersecting $CD$ at $E$.

      The shape $ABED$ is a parallelogram, so $DE = AB = 10$ and $BE = AD = 13$.

      This leaves a triangle, $\triangle BCE$.

      The base of this triangle is $EC = CD - DE = 24 - 10 = 14$.

      The three sides of $\triangle BCE$ are $13, 14$, and $15$.


      Why it works:

      This is the standard construction for solving general trapezoids. It isolates the height of the
      trapezoid into a triangle where all three sides are known.

      '
    instruction: 'Work through this step: Draw a line parallel to the side of length 13, starting from
      the opposite vertex, to partition the trapezoid into a parallelogram and a triangle. What are the
      side lengths of this new triangle?'
    type: freeResponse
  - id: step-2
    title: Find the height of the triangle
    prompt: Use Heron's formula to find the area of the 13-14-15 triangle, then use that area to determine
      its height.
    difficultyDimensions:
    - Compute the semiperimeter (21).
    - Calculate Area = 84.
    - Use $A = \frac{1}{2}bh$ to find $h$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $s = (13+14+15)/2 = 21$.
      - Area $= \sqrt{21(8)(7)(6)} = 84$.
      - $84 = \frac{1}{2}(14)h \implies h = 12$.
    explanation: 'Solution:

      First, find the area of $\triangle BCE$ using Heron''s formula.

      Semiperimeter $s = \frac{13+14+15}{2} = 21$.

      Area $= \sqrt{21(21-13)(21-14)(21-15)} = \sqrt{21(8)(7)(6)} = 84$.

      The area of a triangle is also $\frac{1}{2} \text{base} \times \text{height}$.

      Let the base be $EC = 14$.

      $$84 = \frac{1}{2}(14)h$$

      $$84 = 7h \implies h = 12$$


      Why it works:

      The height of $\triangle BCE$ is exactly the height of the entire trapezoid, because they share
      the same parallel bounding lines.

      '
    instruction: 'Work through this step: Use Heron''s formula to find the area of the 13-14-15 triangle,
      then use that area to determine its height.'
    type: freeResponse
  - id: step-3
    title: Calculate the total area
    prompt: Use the height to find the area of the entire trapezoid.
    difficultyDimensions:
    - Apply the trapezoid area formula $A = \frac{b_1 + b_2}{2} h$.
    - Substitute the bases (10, 24) and height (12).
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $A = \frac{10 + 24}{2} \times 12$.
      - $A = 17 \times 12 = 204$.
    explanation: 'Solution:

      Now that we know the height of the trapezoid is $h = 12$, we can use the standard area formula.

      $$A = \frac{b_1 + b_2}{2} h$$

      $$A = \frac{10 + 24}{2} (12)$$

      $$A = (17)(12) = 204$$


      Why it works:

      Alternatively, you could add the area of the parallelogram ($10 \times 12 = 120$) to the area of
      the triangle ($84$) to get $204$.

      '
    instruction: 'Work through this step: Use the height to find the area of the entire trapezoid.'
    type: freeResponse
  problem: A trapezoid has parallel bases of lengths 10 and 24. The non-parallel sides have lengths 13
    and 15. Compute the area of the trapezoid.
- id: aops-quads-we-2
  title: Cyclic Quadrilateral Diagonals
  steps:
  - id: aops-quads-we-2-step-1
    title: Set up the Law of Cosines twice
    prompt: Let $\theta$ be the angle between sides $a$ and $b$. Express the square of the diagonal $x$
      using the Law of Cosines in the two triangles formed by $x$.
    difficultyDimensions:
    - Apply Law of Cosines to the triangle with sides $a, b$.
    - Apply Law of Cosines to the triangle with sides $c, d$.
    - Use the property that opposite angles are supplementary to relate their cosines.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $x^2 = a^2 + b^2 - 2ab \cos\theta$.
      - $x^2 = c^2 + d^2 - 2cd \cos(180^\circ - \theta)$.
      - Since $\cos(180^\circ - \theta) = -\cos\theta$, the second equation becomes $x^2 = c^2 + d^2 +
        2cd \cos\theta$.
    explanation: 'Solution:

      The diagonal $x$ splits the cyclic quadrilateral into two triangles.

      Triangle 1 has sides $a=3, b=5$ and included angle $\theta$.

      $$x^2 = 3^2 + 5^2 - 2(3)(5)\cos\theta = 34 - 30\cos\theta$$

      Triangle 2 has sides $c=8, d=4$ and included angle $\phi$. Because the quadrilateral is cyclic,
      opposite angles are supplementary, so $\phi = 180^\circ - \theta$.

      $$x^2 = 8^2 + 4^2 - 2(8)(4)\cos(180^\circ - \theta)$$

      Since $\cos(180^\circ - \theta) = -\cos\theta$, this becomes:

      $$x^2 = 80 + 64\cos\theta$$


      Why it works:

      This is the standard algebraic attack for finding diagonals in cyclic quadrilaterals when Ptolemy''s
      alone isn''t enough (because Ptolemy gives the product of the diagonals, not their individual lengths).

      '
    instruction: 'Work through this step: Let $\theta$ be the angle between sides $a$ and $b$. Express
      the square of the diagonal $x$ using the Law of Cosines in the two triangles formed by $x$.'
    type: freeResponse
  - id: aops-quads-we-2-step-2
    title: Solve for the cosine of the angle
    prompt: Equate the two expressions for $x^2$ to find the value of $\cos\theta$.
    difficultyDimensions:
    - Set $34 - 30\cos\theta = 80 + 64\cos\theta$.
    - Isolate $\cos\theta$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $34 - 80 = 64\cos\theta + 30\cos\theta$.
      - $-46 = 94\cos\theta$.
      - $\cos\theta = -\frac{46}{94} = -\frac{23}{47}$.
    explanation: 'Solution:

      Equate the two equations for $x^2$:

      $$34 - 30\cos\theta = 80 + 64\cos\theta$$

      Subtract 34 from both sides and add $30\cos\theta$ to both sides:

      $$-46 = 94\cos\theta$$

      $$\cos\theta = -\frac{46}{94} = -\frac{23}{47}$$


      Why it works:

      A negative cosine simply indicates that the angle $\theta$ is obtuse (greater than $90^\circ$).

      '
    instruction: 'Work through this step: Equate the two expressions for $x^2$ to find the value of $\cos\theta$.'
    type: freeResponse
  - id: aops-quads-we-2-step-3
    title: Compute the diagonal
    prompt: Substitute $\cos\theta$ back into either equation to find $x^2$, then $x$.
    difficultyDimensions:
    - Substitute $-\frac{23}{47}$ into $x^2 = 34 - 30\cos\theta$.
    - Calculate the final fraction.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $x^2 = 34 - 30(-\frac{23}{47}) = 34 + \frac{690}{47}$.
      - $34 = \frac{1598}{47}$.
      - $x^2 = \frac{1598 + 690}{47} = \frac{2288}{47}$.
      - $x = \sqrt{\frac{2288}{47}}$.
    explanation: 'Solution:

      Substitute $\cos\theta$ back into the first equation:

      $$x^2 = 34 - 30\left(-\frac{23}{47}\right)$$

      $$x^2 = 34 + \frac{690}{47}$$

      Find a common denominator: $34 \times 47 = 1598$.

      $$x^2 = \frac{1598 + 690}{47} = \frac{2288}{47}$$

      $$x = \sqrt{\frac{2288}{47}}$$


      Why it works:

      This method works for *any* cyclic quadrilateral. It can be generalized into a beautiful formula
      for the diagonals: $x^2 = \frac{(ac+bd)(ab+cd)}{ad+bc}$.

      '
    instruction: 'Work through this step: Substitute $\cos\theta$ back into either equation to find $x^2$,
      then $x$.'
    type: freeResponse
  problem: A cyclic quadrilateral has sides $a=3, b=5, c=8, d=4$ in that order around the perimeter. Find
    the length of the diagonal $x$ that connects the vertex between $a$ and $d$ to the vertex between
    $b$ and $c$.
- id: aops-quads-we-3
  title: Midpoint Quadrilateral Area
  steps:
  - id: aops-quads-we-3-step-1
    title: Identify the inner shape
    prompt: What theorem governs the shape formed by connecting the midpoints of a quadrilateral?
    difficultyDimensions:
    - Name Varignon's Theorem.
    - Identify the inner shape as a parallelogram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - By Varignon's Theorem, the inner shape is a parallelogram.
    explanation: 'Solution:

      Varignon''s Theorem states that connecting the midpoints of the adjacent sides of *any* quadrilateral
      forms a parallelogram.


      Why it works:

      This is because each side of the inner quadrilateral is a midline to one of the triangles formed
      by the original quadrilateral''s diagonals, making it parallel to (and half the length of) that
      diagonal.

      '
    instruction: 'Work through this step: What theorem governs the shape formed by connecting the midpoints
      of a quadrilateral?'
    type: freeResponse
  - id: aops-quads-we-3-step-2
    title: Determine the area
    prompt: Apply the area property of Varignon's Theorem to find the answer.
    difficultyDimensions:
    - Recall that the Varignon parallelogram has exactly half the area of the original quadrilateral.
    - Divide 120 by 2.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Area $= 120 / 2 = 60$.
    explanation: 'Solution:

      A direct consequence of Varignon''s Theorem is that the area of the inscribed parallelogram is always
      exactly half the area of the original quadrilateral.

      $$\text{Area} = \frac{120}{2} = 60$$


      Why it works:

      The four corner triangles left outside the parallelogram have areas that sum to exactly half the
      total area. This is true regardless of how irregular the original quadrilateral is.

      '
    instruction: 'Work through this step: Apply the area property of Varignon''s Theorem to find the answer.'
    type: freeResponse
  problem: A convex quadrilateral has an area of 120. If you connect the midpoints of its four sides,
    what is the area of the resulting inner quadrilateral?
