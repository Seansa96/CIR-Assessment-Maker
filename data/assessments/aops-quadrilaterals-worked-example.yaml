- id: aops-quadrilaterals-problem-1
  title: 'Direct application: Quadrilaterals'
  problem: 'Original Quadrilaterals problem 1: use the givens to identify trapezoids, parallelograms, rhombi, rectangles, squares, then solve without assuming unstated facts.'
  steps:
  - id: aops-quadrilaterals-p1-s1
    title: Read the givens
    instruction: List the quantities, relationships, and restrictions that control this Quadrilaterals problem.
    type: multipleChoice
    prompt: Which action is required at this stage of the direct application problem?
    choices:
    - id: a
      text: List the quantities, relationships, and restrictions that control this Quadrilaterals problem.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
    answer:
      choiceId: a
    explanation: List the quantities, relationships, and restrictions that control this Quadrilaterals problem.
