workedExamples:
- id: mathematical-literacy-definitions-worked-example-b-example
  title: Use the definition of odd in a sum
  problem: 'Read the claim: If integers a and b are odd, then $a+b$ is even. Identify the definition-driven bridge
    and the final form.'
  steps:
  - id: step-1
    title: Unpack both hypotheses
    type: freeResponse
    prompt: How may odd integers a and b be written?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Write $a=2m+1$ and $b=2n+1$ for integers m and n.
    explanation: |-
      Solution: Write $a=2m+1$ and $b=2n+1$ for integers m and n.
      Why it works: The definition of odd supplies an integer parameter for each odd input.
  - id: step-2
    title: Combine the expressions
    type: freeResponse
    prompt: What form does $a+b$ take after substitution?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $a+b=2(m+n+1)$.
    explanation: |-
      Solution: $a+b=2(m+n+1)$.
      Why it works: Collecting the two even parts and two ones factors out 2.
  - id: step-3
    title: Match the definition
    type: freeResponse
    prompt: Why is the sum even?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $m+n+1$ is an integer, so $a+b$ is two times an integer.
    explanation: |-
      Solution: $m+n+1$ is an integer, so $a+b$ is two times an integer.
      Why it works: This exactly matches the definition of an even integer.
