schemaVersion: 1
id: pwsh-basics-guided-project
title: "Custom Greeting Script"
assessmentType: sandbox
categoryId: scripting
subcategoryIds:
  - pwsh-cmdlets
  - pwsh-string-basics
skills:
  - pwsh-cmdlets
  - pwsh-string-basics
modeDefault: practice
randomizeQuestions: false
sandbox:
  language: pwsh
  image: mcr.microsoft.com/powershell:latest
  initialCommand: 'pwsh -NoExit -Command "Start-Job -FilePath /workspace/.cir/monitor.ps1 | Out-Null"'
  readOnlyFileSystem: false
  instructions: |
    Write a PowerShell script that uses `Get-Date` to get the current date and time.
    Format a greeting using string interpolation that says: `"Hello, the current time is [Time]"` where `[Time]` is the output of `Get-Date`.
    Store this string in a variable called `$Greeting`, and then use `Write-Output` to print the variable to the console.
    
    The environment is pre-configured. When you have correctly formatted the greeting and saved your script, the background monitor will automatically detect it and advance the assessment.
  files:
    - path: greeting.ps1
      readOnly: false
      content: |
        # 1. Use Get-Date to get the current date and time
        $time = 
        
        # 2. Create a $Greeting string using double quotes for interpolation
        $Greeting = 
        
        # 3. Print the $Greeting string
        
    - path: .cir/monitor.ps1
      readOnly: true
      content: |
        while ($true) {
            if (Test-Path "/workspace/greeting.ps1") {
                $output = & /workspace/greeting.ps1 | Out-String
                if ($output -match "Hello, the current time is") {
                    Invoke-RestMethod -Method Post -Uri "$env:CIR_API_URL/api/attempts/$env:CIR_ATTEMPT_ID/sandbox/complete"
                    break
                }
            }
            Start-Sleep -Seconds 3
        }
