guidedProject:
  language: bash
  instructions: Use flexbox on `.container` to center its child `.item` both horizontally and vertically. Assume `.container` has a height of 100vh.
  files:
  - path: style.css
    readOnly: false
    content: ".container {\n  height: 100vh;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n"
  requiredChecks:
  - id: check-exists
    title: Check CSS File
    description: Check that the CSS file was updated.
    expectedOutputContains:
    - OK
    testCode: echo OK
