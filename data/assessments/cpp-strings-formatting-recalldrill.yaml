modeDefault: practice
randomizeQuestions: true
navigation: { learningGoal: recall, activityType: mixedRecallSet, tags: [c++, cpp-strings-formatting, strings, formatting] }
authoring: { visualRequirement: notApplicable, visualRationale: This drill tests direct retrieval of string and stream terminology introduced in the lesson. }
items:
- id: cpp-strings-recall-001
  type: typed
  prompt: Which standard-library type owns a mutable sequence of characters?
  answer: { expected: 'std::string', aliases: [string] }
- id: cpp-strings-recall-002
  type: cloze
  prompt: Valid string indices begin at zero and end at ________.
  answer: { expected: 'size() - 1', aliases: ['size()-1', 'the size minus one'] }
- id: cpp-strings-recall-003
  type: typed
  prompt: Which input operation reads an entire line including spaces?
  answer: { expected: getline, aliases: ['std::getline'] }
- id: cpp-strings-recall-004
  type: cloze
  prompt: A `std::string_view` does not own characters; its underlying storage must remain ________.
  answer: { expected: alive, aliases: [valid] }
- id: cpp-strings-recall-005
  type: typed
  prompt: What stream character is usually left pending after `std::cin >> value`?
  answer: { expected: newline, aliases: ['\n', 'line break'] }
