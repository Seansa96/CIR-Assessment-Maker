glossary:
  introduction: Mode vocabulary for standing sound waves in air columns.
  sections:
  - id: modes-terms
    title: Core terms
    entries:
    - {id: node, term: displacement node, definition: 'A location with zero air displacement; it occurs at a closed tube end.', drills: [{id: node-drill, type: typed, prompt: 'What is a zero-displacement location called?', answer: node}]}
    - {id: antinode, term: displacement antinode, definition: 'A location of maximum air displacement; it occurs at an open end.', drills: [{id: antinode-drill, type: cloze, prompt: 'An open tube end is a displacement {{antinode}}.', answer: antinode}]}
    - {id: normal-mode, term: normal mode, definition: 'An allowed standing-wave pattern satisfying the tube boundaries.', drills: [{id: normal-mode-drill, type: typed, prompt: 'What is an allowed standing-wave pattern called?', answer: normal mode}]}
    - {id: overtone, term: overtone, definition: 'A resonant frequency above the fundamental; its harmonic number depends on tube ends.', drills: [{id: overtone-drill, type: cloze, prompt: 'A resonance above the fundamental is an {{overtone}}.', answer: overtone}]}
