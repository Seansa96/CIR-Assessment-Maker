- id: we002
  title: Aim upstream to land directly across a river
  problem: >
    A river is $240 \text{m}$ wide and flows east at $3.0 \text{m/s}$. A boat can travel at $5.0 \text{m/s}$ relative to the water. The pilot wants to land directly north of the launch point. Find the required heading and the crossing time.
  steps:
  - id: step-we002-1
    title: Impose the no-drift condition
    instruction: >
      Landing directly opposite means the boat's east-west ground component must be zero.
    hint: 
    type: multipleChoice
    prompt: What westward component must the boat have relative to the water?
    choices:
    - id: a
      text: $0 \text{m/s}$
      media: []
      issueSignals: []
    - id: b
      text: $3.0 \text{m/s}$ west
      media: []
      issueSignals: []
    - id: c
      text: $5.0 \text{m/s}$ west
      media: []
      issueSignals: []
    answer:
      choiceId: b
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The eastward current is $+3.0 \text{m/s}$, so the boat needs a $-3.0 \text{m/s}$ westward component. The two horizontal components then sum to zero.


      Why it works: Ground velocity is boat-relative-to-water plus water-relative-to-ground; a zero ground $x$ component prevents downstream drift.

      Why the other choices fail: Choice a leaves the full current unopposed, while choice c would create a net westward ground velocity.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step-we002-2
    title: Find the usable northward component
    instruction: >
      The $5.0 \text{m/s}$ boat speed is the hypotenuse of a velocity triangle with a $3.0 \text{m/s}$ westward leg.
    hint: 
    type: numericResponse
    prompt: What is the boat's northward ground-speed component in $\text{m/s}$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 4
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution:


      $$

      v_N=sqrt{5.0^2-3.0^2}=4.0 \text{m/s}.

      $$


      Why it works: The current has no northward component, so the boat's northward water-relative component is also its northward ground-speed component. The heading is $36.9^circ$ west of north.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step-we002-3
    title: Calculate the crossing time
    instruction: >
      Only the northward ground-speed component carries the boat across the $240 \text{m}$ width.
    hint: 
    type: numericResponse
    prompt: How long does the crossing take, in seconds?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 60
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution:


      $$

      t=\frac{240 \text{m}}{4.0 \text{m/s}}=60 \text{s}.

      $$


      Why it works: Once the east-west component has been canceled, the independent northward component determines progress across the river.
