- id: we001
  title: Find a car's velocity as seen from a truck
  problem: >
    Let east be $+x$ and north be $+y$. A car travels $18 \text{m/s}$ east while a truck travels $24 \text{m/s}$ south. Find the car's velocity relative to the truck: its component form, magnitude, and direction.
  steps:
  - id: step-we001-1
    title: Name the frames before computing
    instruction: >
      Earth is the connecting frame. Write the car's velocity relative to the truck as a subtraction of two Earth-frame velocities.
    hint: 
    type: multipleChoice
    prompt: Which equation has the correct observer order?
    choices:
    - id: a
      text: $\vec v_{C/T}=\vec v_{C/E}-\vec v_{T/E}$
      media: []
      issueSignals: []
    - id: b
      text: $\vec v_{C/T}=\vec v_{T/E}-\vec v_{C/E}$
      media: []
      issueSignals: []
    - id: c
      text: $\vec v_{C/T}=\vec v_{C/E}+\vec v_{T/E}$
      media: []
      issueSignals: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The object named first is the car and the observer is the truck, so subtract the truck's Earth-frame velocity from the car's Earth-frame velocity:


      $$

      \vec v_{C/T}=\vec v_{C/E}-\vec v_{T/E}.

      $$


      Why it works: Changing from Earth to the truck frame means removing the truck's own motion from every Earth-frame velocity.

      Why the other choices fail: Choice b gives the truck relative to the car, while choice c incorrectly adds the observer's motion.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step-we001-2
    title: Subtract components
    instruction: >
      Express east as positive $x$ and north as positive $y$. The car is $(18,0)$ and the southbound truck is $(0,-24)$ in $\text{m/s}$.
    hint: 
    type: numericResponse
    prompt: What is the northward ($y$) component of $\vec v_{C/T}$ in $\text{m/s}$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 24
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Subtract the truck vector:


      $$

      (18,0)-(0,-24)=(18,24) \text{m/s}.

      $$


      The northward component is therefore $24 \text{m/s}$.


      Why it works: Subtracting a negative southward component adds a northward component in the truck's frame.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step-we001-3
    title: Turn the component vector into a speed
    instruction: >
      The relative-velocity components are $18 \text{m/s}$ east and $24 \text{m/s}$ north.
    hint: 
    type: numericResponse
    prompt: What is the magnitude of the car's velocity relative to the truck, in $\text{m/s}$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 30
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Apply the Pythagorean theorem to the perpendicular components:


      $$

      |\vec v_{C/T}|=sqrt{18^2+24^2}=30 \text{m/s}.

      $$


      Why it works: East and north are perpendicular axes, so the component vector forms a right triangle. Its direction is $\tan^{-1}(24/18)=53.1^circ$ north of east.
