  - obj-dsa-graphs-03
  prompt: 'You are writing an AI for a robot solving an unweighted maze. The maze is represented as a
    grid, which you have converted into a graph where each open tile is a vertex connected to its adjacent
    open tiles.


    You need to find the **shortest path** (fewest number of steps) from the start tile to the exit. Which
    traversal algorithm should you use?

    '
  choiceOptions:
  - id: opt-bfs
    text: Breadth-First Search (BFS)
  - id: opt-dfs
    text: Depth-First Search (DFS)
    issueSignals:
    - id: dfs-for-shortest-path
      domains: []
  - id: opt-bst
    text: Binary Search Tree (BST) insertion
    issueSignals:
    - id: confused-graph-tree
      domains: []
  - id: opt-hash
    text: Linear Probing Hash Hash
    issueSignals:
    - id: confused-data-structure
      domains: []
  answer:
    gradingMode: automatic
    correctChoiceId: opt-bfs
  explanation: "Solution:\nYou should use Breadth-First Search (BFS).\n\nWhy it works:\nBFS explores the\
    \ graph layer-by-layer, looking at all nodes 1 step away, then 2 steps away, and so on. Therefore,\
    \ the first time it reaches the exit node, it is guaranteed to have found the shortest possible path\
    \ (in an unweighted graph). \n\nWhy the other choices fail:\n- DFS dives as deep as possible before\
    \ backtracking. While it might find *a* path to the exit, it is not guaranteed to be the *shortest*\
    \ path. It might wind around the entire maze first.\n- BSTs and Hash Tables are data structures for\
    \ storing and looking up data, not algorithms for traversing a network to find a path.\n"
