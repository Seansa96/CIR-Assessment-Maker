modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - recover-terms-from-partial-sums
  prompt: |
    A series has partial sums $S_n=n/(n+1)$. What is $a_n$ for $n\ge2$?
  choices:
  - id: a
    text: $1/[n(n+1)]$
  - id: b
    text: $n/(n+1)$
  - id: c
    text: $1/(n+1)$
  - id: d
    text: $-1/[n(n+1)]$
  answer:
    choiceId: a
  explanation: Compute $a_n=S_n-S_{n-1}=n/(n+1)-(n-1)/n=1/[n(n+1)]$.
- id: q002
  type: multipleChoice
  skills:
  - determine-convergence-from-partial-sums
  prompt: |
    If the partial sums of $\sum a_n$ satisfy $S_n=(-1)^n+1/n$, what
    happens to the series?
  choices:
  - id: a
    text: It diverges because $S_n$ has two cluster points.
  - id: b
    text: It converges to $0$.
  - id: c
    text: It converges absolutely.
  - id: d
    text: It converges to $1$.
  answer:
    choiceId: a
  explanation: The even partial sums approach one and the odd partial sums approach negative one, so no
    partial-sum limit exists.
- id: q003
  type: multipleChoice
  skills:
  - apply-the-cauchy-criterion-for-series
  prompt: |
    Which condition is equivalent to convergence of $\sum a_n$?
  choices:
  - id: a
    text: |-
      For every $\varepsilon>0$, all sufficiently late finite tails satisfy $|\sum_{k=m}^{n}a_k|<\varepsilon$.
  - id: b
    text: |-
      $a_n\to0$.
  - id: c
    text: |-
      $|a_{n+1}-a_n|\to0$.
  - id: d
    text: The terms are bounded.
  answer:
    choiceId: a
  explanation: A finite tail is the difference $S_n-S_{m-1}$, so this is exactly the Cauchy criterion
    for the partial sums.
- id: q004
  type: multipleChoice
  skills:
  - use-linearity-of-convergent-series
  prompt: |
    If $\sum a_n=3$ and $\sum b_n=-2$, what is
    $\sum(4a_n-5b_n)$?
  choices:
  - id: a
    text: $22$
  - id: b
    text: $2$
  - id: c
    text: $-22$
  - id: d
    text: Cannot be determined
  answer:
    choiceId: a
  explanation: Linearity gives $4(3)-5(-2)=22$.
- id: q005
  type: multipleChoice
  skills:
  - analyze-telescoping-boundaries
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+2}\right)$.
  choices:
  - id: a
    text: $3/2$
  - id: b
    text: $1$
  - id: c
    text: $1/2$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: The Nth partial sum leaves $1+1/2-1/(N+1)-1/(N+2)$.
- id: q006
  type: multipleChoice
  skills:
  - choose-direct-comparison-directions
  prompt: |
    Which comparison proves that
    $\sum_{n=1}^{\infty}1/\sqrt{n^2+n}$ diverges?
  choices:
  - id: a
    text: |-
      $1/\sqrt{n^2+n}\ge1/(\sqrt2\,n)$ for $n\ge1$
  - id: b
    text: |-
      $1/\sqrt{n^2+n}\le1/n$
  - id: c
    text: |-
      $1/\sqrt{n^2+n}\le1/\sqrt n$
  - id: d
    text: The terms are positive.
  answer:
    choiceId: a
  explanation: |-
    Since $n^2+n\le2n^2$, the terms dominate a constant multiple of the harmonic series.
- id: q007
  type: multipleChoice
  skills:
  - apply-limit-comparison
  prompt: |
    What is the best benchmark for
    $\sum_{n=1}^{\infty}(5n^2+1)/(n^4+3n)$?
  choices:
  - id: a
    text: |-
      $\sum1/n^2$
  - id: b
    text: |-
      $\sum1/n$
  - id: c
    text: |-
      $\sum1/n^4$
  - id: d
    text: |-
      $\sum(1/2)^n$
  answer:
    choiceId: a
  explanation: The summand is asymptotic to $5/n^2$, producing a finite positive limit-comparison constant.
- id: q008
  type: multipleChoice
  skills:
  - select-the-ratio-test
  prompt: |
    For $\sum n^3/4^n$, what is
    $\lim_{n\to\infty}a_{n+1}/a_n$?
  choices:
  - id: a
    text: $1/4$
  - id: b
    text: $3/4$
  - id: c
    text: $1$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: The ratio is $[(n+1)/n]^3/4$, whose polynomial factor tends to one.
- id: q009
  type: multipleChoice
  skills:
  - apply-the-root-test
  prompt: |
    What does the root test conclude for
    $\sum[(2n+1)/(3n-1)]^n$?
  choices:
  - id: a
    text: Absolute convergence because the root limit is $2/3$.
  - id: b
    text: Divergence because the root limit is $3/2$.
  - id: c
    text: Inconclusive because the root limit is $1$.
  - id: d
    text: Conditional convergence
  answer:
    choiceId: a
  explanation: The nth root removes the exponent and the remaining rational sequence tends to two thirds.
- id: q010
  type: multipleChoice
  skills:
  - use-integral-test-remainder-bounds
  prompt: |
    For $R_N=\sum_{n=N+1}^{\infty}1/n^2$, which bound is correct?
  choices:
  - id: a
    text: |-
      $1/(N+1)\le R_N\le1/N$
  - id: b
    text: |-
      $1/N\le R_N\le1/(N+1)$
  - id: c
    text: $R_N=1/N^2$
  - id: d
    text: |-
      $R_N\ge1$
  answer:
    choiceId: a
  explanation: For decreasing $1/x^2$, integrate from N+1 for the lower bound and from N for the upper
    bound.
- id: q011
  type: multipleChoice
  skills:
  - distinguish-term-and-series-limits
  prompt: |
    If $a_n\to0$, which conclusion about $\sum a_n$ is valid?
  choices:
  - id: a
    text: No convergence conclusion follows without more information.
  - id: b
    text: The series converges.
  - id: c
    text: The series converges absolutely.
  - id: d
    text: The series diverges.
  answer:
    choiceId: a
  explanation: |-
    Both the convergent $\sum1/n^2$ and divergent harmonic series have terms approaching zero.
- id: q012
  type: multipleChoice
  skills:
  - classify-series-under-finite-changes
  prompt: |
    Changing finitely many terms of a convergent series can have which effect?
  choices:
  - id: a
    text: It can change the sum but not convergence.
  - id: b
    text: It can force divergence.
  - id: c
    text: It cannot change the sum.
  - id: d
    text: It always creates absolute convergence.
  answer:
    choiceId: a
  explanation: The unchanged tail retains convergence, while the finite prefix contributes a possibly
    different finite amount.
- id: q013
  type: multipleChoice
  skills:
  - analyze-difference-series
  prompt: |
    If $b_n\to L$, what is
    $\sum_{n=1}^{\infty}(b_n-b_{n+1})$?
  choices:
  - id: a
    text: $b_1-L$
  - id: b
    text: $L-b_1$
  - id: c
    text: $L$
  - id: d
    text: It always diverges.
  answer:
    choiceId: a
  explanation: The Nth partial sum is $b_1-b_{N+1}$, whose limit is $b_1-L$.
- id: q014
  type: multipleChoice
  skills:
  - detect-divergent-telescoping-boundaries
  prompt: |
    Classify $\sum_{n=1}^{\infty}\ln[(n+1)/n]$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: |-
      Convergent to $\ln2$
  - id: c
    text: Convergent to $1$
  - id: d
    text: Conditionally convergent
  answer:
    choiceId: a
  explanation: |-
    The partial sum telescopes in logarithms to $\ln(N+1)$, which is unbounded.
- id: q015
  type: multipleChoice
  skills:
  - classify-parameterized-geometric-series
  prompt: |
    For which real $x$ does
    $\sum_{n=0}^{\infty}[(x-1)/(x+1)]^n$ converge?
  choices:
  - id: a
    text: $x>0$
  - id: b
    text: $x<0$
  - id: c
    text: |-
      $x\ne-1$
  - id: d
    text: $-1<x<1$
  answer:
    choiceId: a
  explanation: The condition $|x-1|<|x+1|$ means x is closer to one than to negative one, equivalently
    x is positive.
