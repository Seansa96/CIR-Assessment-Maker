  prompt: |
    A series has partial sums $S_n=n/(n+1)$. What is $a_n$ for $n\ge2$?
  choices:
  - id: a
    text: $1/[n(n+1)]$
  - id: b
    text: $n/(n+1)$
  - id: c
    text: $1/(n+1)$
  - id: d
    text: $-1/[n(n+1)]$
  answer:
    choiceId: a
  explanation: |-
    Solution: Compute $a_n=S_n-S_{n-1}=n/(n+1)-(n-1)/n=1/[n(n+1)]$. Therefore the answer is $1/[n(n+1)]$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $n/(n+1)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $1/(n+1)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $-1/[n(n+1)]$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
