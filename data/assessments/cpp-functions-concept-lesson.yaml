lesson:
  introduction: >
    Functions allow you to organize code into reusable blocks. This lesson covers\rhow to define functions, the different ways to pass arguments, and\rhow C++ handles overloading and default parameters.
  sections:
  - id: function-basics
    title: Signatures and Definitions
    required: true
    content: >
      A function has a return type, a name, and a parameter list.


      ```cpp

      // Declaration (often in a header file)

      int add(int a, int b);


      // Definition (implementation)

      int add(int a, int b) {
          return a + b;
      }

      ```


      If a function doesn't return anything, its return type is `void`. You must declare a function before you call it.
