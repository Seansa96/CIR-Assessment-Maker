  - id: call-return-flow
    title: Trace Arguments, Parameters, and a Return Value
    required: true
    content: >
      At a call site, expressions are supplied as **arguments**. The function receives them through its **parameters**, performs its body, and may send one result back through `return`.


      ```cpp

      int square(int value) {
          return value * value;
      }


      int result = square(4); // argument 4; parameter value; result 16

      ```


      The parameter name exists only inside that function's scope; it is not a second name for the caller's variable.
    media: []
    check:
      id: call-return-flow-check
      type: multipleChoice
      prompt: In `int result = square(4);`, what is `4`?
      choices:
      - id: a
        text: An argument
        media: []
        issueSignals: []
      - id: b
        text: The return type
        media: []
        issueSignals: []
      - id: c
        text: A namespace
        media: []
        issueSignals: []
      - id: d
