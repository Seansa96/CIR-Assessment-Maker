  - id: declarations-and-definitions
    title: Separate a Function Contract from Its Body
    required: true
    content: >
      A declaration gives code enough information to call a function; a definition supplies the body. Keeping a declaration in a header and the definition in a source file lets several files use the same contract without duplicating its implementation.


      ```cpp

      // score.h

      int square(int value);


      // score.cpp

      int square(int value) { return value * value; }

      ```
    media: []
    check:
      id: declarations-and-definitions-check
      type: multipleChoice
      prompt: Which part actually contains the statements a function executes?
      choices:
      - id: a
        text: The definition
        media: []
        issueSignals: []
