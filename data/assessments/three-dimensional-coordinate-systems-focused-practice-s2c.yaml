questions:
- id: q001
  type: multipleChoice
  prompt: What is the distance from $(1,2,3)$ to $(4,6,3)$?
  choices:
  - id: a
    text: $5$
  - id: b
    text: $7$
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: $25$
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: '$\sqrt{7}$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Use coordinate differences $(3,4,0)$ and the distance formula.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Inequalities and the Real Numbers.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: Which equation is a sphere centered at $(2,-1,0)$ with radius $3$?
  choices:
  - id: a
    text: $(x-2)^2+(y+1)^2+z^2=9
  - id: b
    text: $(x+2)^2+(y-1)^2+z^2=3
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: $(x-2)^2+(y+1)^2+z^2=3
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: $(x+2)^2+(y-1)^2+z^2=9
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Use opposite signs inside squared shifts and square the radius.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Inequalities and the Real Numbers.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: 'What set does $x=4$ describe in $\mathbb R^3$?'
  choices:
  - id: a
    text: A plane parallel to the $yz$-plane
  - id: b
    text: A line parallel to the x-axis
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: A sphere of radius 4
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: The $xy$-plane
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Only x is fixed; y and z remain free.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Inequalities and the Real Numbers.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q004
  type: multipleChoice
  prompt: Which point lies on the $xz$-plane?
  choices:
