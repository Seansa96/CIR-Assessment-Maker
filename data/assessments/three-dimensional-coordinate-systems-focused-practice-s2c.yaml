  explanation: 'Solution: The $xz$-plane has y-coordinate zero.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Inequalities and the Real Numbers.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
