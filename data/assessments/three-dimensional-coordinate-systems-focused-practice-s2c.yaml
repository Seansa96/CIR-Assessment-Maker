  - id: c
    text: $(2,-5,0)$
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: $(0,0,2)$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
