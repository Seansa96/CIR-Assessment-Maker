- id: olympiad-quiz-q025
  type: multipleChoice
  prompt: In a circle, chords $AB$ and $CD$ intersect at $E$. If arc $AC = 40^\circ$ and $\angle AEC =
    75^\circ$, find the measure of arc $BD$.
  choices:
  - id: a
    text: $35^\circ$
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: b
    text: $70^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  - id: c
    text: $110^\circ$
  - id: d
    text: $115^\circ$
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recall the interior intersection angle formula ($\text{angle} = \text{avg of intercepted arcs}$).
  - Set up and solve the algebraic equation for the unknown arc.
  explanation: 'Solution:

    The angle formed by two intersecting chords is the average of the intercepted arcs.

    $$\angle AEC = \frac{\text{arc } AC + \text{arc } BD}{2}$$

    $$75^\circ = \frac{40^\circ + \text{arc } BD}{2}$$

    $$150^\circ = 40^\circ + \text{arc } BD \implies \text{arc } BD = 110^\circ$$


    Why it works:

    Drawing chord $AD$ creates a triangle $AED$ where $\angle AEC$ is the exterior angle to $\angle D$
    (which is half of arc $AC$) and $\angle A$ (which is half of arc $BD$).


    Why the other choices fail:

    - **(A)** $35^\circ$ is $75-40$.

    - **(B)** $70^\circ$ is $2(75-40)$.

    - **(D)** $115^\circ$ is $75+40$.

    '
- id: olympiad-quiz-q029
  type: multipleChoice
  prompt: Secants $PAB$ and $PCD$ are drawn from external point $P$. If $\angle P = 30^\circ$ and the
    major intercepted arc $BD$ is $100^\circ$, find the minor intercepted arc $AC$.
  choices:
  - id: a
    text: $40^\circ$
  - id: b
    text: $70^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  - id: c
    text: $130^\circ$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $160^\circ$
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Recall the exterior intersection angle formula ($\text{angle} = \text{half the difference of intercepted
    arcs}$).
  - Substitute knowns and solve for the unknown minor arc.
  explanation: 'Solution:

    The angle formed by two secants intersecting outside a circle is half the difference of the intercepted
    arcs.

    $$\angle P = \frac{\text{arc } BD - \text{arc } AC}{2}$$

    $$30^\circ = \frac{100^\circ - \text{arc } AC}{2}$$

    $$60^\circ = 100^\circ - \text{arc } AC \implies \text{arc } AC = 40^\circ$$


    Why it works:

    Drawing chord $AD$ creates $\triangle PAD$. The exterior angle $\angle DAB$ (half arc $BD$) equals
    $\angle P$ plus the interior angle $\angle ADC$ (half arc $AC$).


    Why the other choices fail:

    - **(B)** $70^\circ$ is $100-30$.

    - **(C)** $130^\circ$ adds the angles instead of subtracting.

    - **(D)** $160^\circ$ uses sum instead of difference.

    '
- id: olympiad-quiz-q034
  type: multipleChoice
  prompt: A circle has an inscribed $\angle ABC = 35^\circ$. What is the measure of the central angle
    subtending the same arc $AC$?
  choices:
  - id: a
    text: $17.5^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  - id: b
    text: $35^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  - id: c
    text: $70^\circ$
  - id: d
    text: $145^\circ$
    issueSignals:
    - id: angle-measure-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recognize the relationship between an inscribed angle and its intercepted arc.
  - Relate the intercepted arc to the central angle.
  explanation: 'Solution:

    An inscribed angle is half the measure of its intercepted arc.

    $$\text{arc } AC = 2 \times \angle ABC = 2(35^\circ) = 70^\circ$$

    The central angle is equal to the measure of the intercepted arc.

    $$\angle AOC = \text{arc } AC = 70^\circ$$


    Why it works:

    The inscribed angle theorem proves that any angle on the circle is exactly half the central angle
    that subtends the same arc.


    Why the other choices fail:

    - **(A)** $17.5^\circ$ divides by 2 instead of multiplying.

    - **(B)** $35^\circ$ assumes inscribed equals central.

    - **(D)** $145^\circ$ is the supplement of $35^\circ$.

    '
- id: olympiad-quiz-q037
  type: multipleChoice
  prompt: In a circle with center $O$, tangent $PA$ and secant $PBC$ are drawn from point $P$. If $\angle
    APC = 40^\circ$ and $\angle PAB = 25^\circ$, find $\angle C$.
  choices:
  - id: a
    text: $35^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: b
    text: $70^\circ$
    issueSignals:
    - id: theorem-error
      domains: []
  - id: c
    text: $105^\circ$
  - id: d
    text: $140^\circ$
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Use the alternate segment theorem or tangent-chord theorem to find $\angle C$.
  - Apply the triangle angle sum theorem in $\triangle PAC$.
  explanation: 'Solution:

    The angle between a tangent and a chord is half the intercepted arc.

    $\angle PAB = \frac{1}{2} \text{arc } AB = \frac{1}{2}(70^\circ) = 35^\circ$.

    By the alternate segment theorem, the inscribed angle $\angle C$ also equals half the arc, so $\angle
    C = 35^\circ$.

    In $\triangle PAC$, the sum of angles is $180^\circ$:

    $\angle PAC + \angle C + \angle P = 180^\circ$

    $\angle PAC + 35^\circ + 40^\circ = 180^\circ \implies \angle PAC = 180^\circ - 75^\circ = 105^\circ$.


    Why it works:

    The alternate segment theorem states that the angle between a tangent and a chord equals the angle
    in the alternate circular segment. Combined with a basic triangle sum, we can resolve the large angle.


    Why the other choices fail:

    - **(A)** $35^\circ$ is $\angle C$ or $\angle PAB$.

    - **(B)** $70^\circ$ is the arc measure.

    '
- id: olympiad-quiz-q071
  type: multipleChoice
  prompt: A cyclic quadrilateral $ABCD$ has $\angle A = 75^\circ$ and $\angle B = x$. If $\angle C = 3y$
    and $\angle D = 2x$, find $x + y$.
  choices:
  - id: a
    text: $60^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: b
    text: $80^\circ$
    issueSignals:
    - id: algebra-error
      domains: []
  - id: c
    text: $95^\circ$
  - id: d
    text: $105^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recall that opposite angles of a cyclic quadrilateral sum to $180^\circ$.
  - Solve a system of equations for $x$ and $y$.
  explanation: 'Solution:

    Opposite angles in a cyclic quadrilateral are supplementary.

    $\angle A + \angle C = 180^\circ \implies 75^\circ + 3y = 180^\circ \implies 3y = 105^\circ \implies
    y = 35^\circ$.

    $\angle B + \angle D = 180^\circ \implies x + 2x = 180^\circ \implies 3x = 180^\circ \implies x =
    60^\circ$.

    $x + y = 60^\circ + 35^\circ = 95^\circ$.


    Why it works:

    A quadrilateral can be inscribed in a circle if and only if its opposite angles are supplementary.
    This provides two independent linear equations.


    Why the other choices fail:

    - **(A)** $60^\circ$ is just $x$.

    - **(D)** $105^\circ$ is just $3y$.

    '
- id: olympiad-quiz-q027
  type: multipleChoice
  prompt: In a circle, chords $AB$ and $CD$ are parallel. If arc $AB = 100^\circ$ and arc $CD = 60^\circ$,
    what is the measure of arc $AC$?
  choices:
  - id: a
    text: $40^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  - id: b
    text: $80^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  - id: c
    text: $100^\circ$
  - id: d
    text: $160^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recognize that parallel chords intercept congruent arcs between them.
  - Subtract known arcs from $360^\circ$ and divide by 2.
  explanation: 'Solution:

    Parallel chords intercept equal arcs between them, so arc $AC =$ arc $BD$.

    The total circle is $360^\circ$.

    $\text{arc } AB + \text{arc } CD + \text{arc } AC + \text{arc } BD = 360^\circ$

    $100^\circ + 60^\circ + 2(\text{arc } AC) = 360^\circ$

    $160^\circ + 2(\text{arc } AC) = 360^\circ \implies 2(\text{arc } AC) = 200^\circ \implies \text{arc
    } AC = 100^\circ$.


    Why it works:

    Drawing the transversal $AD$ creates alternate interior angles $\angle BAD$ and $\angle ADC$. These
    equal angles subtend equal arcs $BD$ and $AC$.


    Why the other choices fail:

    - **(A)** $40^\circ$ is $100-60$.

    - **(B)** $80^\circ$ is the average of 100 and 60.

    - **(D)** $160^\circ$ is the sum of 100 and 60.

    '
- id: olympiad-quiz-q031
  type: multipleChoice
  prompt: A circle is divided into three arcs in the ratio $2:3:4$. What is the measure of the largest
    inscribed angle in the triangle formed by connecting the three endpoints of these arcs?
  choices:
  - id: a
    text: $40^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: b
    text: $60^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: c
    text: $80^\circ$
  - id: d
    text: $160^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Set up a ratio equation to find the arc measures ($2x+3x+4x=360$).
  - Identify that the largest inscribed angle intercepts the largest arc.
  - Divide the arc measure by 2.
  explanation: 'Solution:

    Let the arcs be $2x$, $3x$, and $4x$.

    $2x + 3x + 4x = 360^\circ \implies 9x = 360^\circ \implies x = 40^\circ$.

    The arcs are $80^\circ, 120^\circ, 160^\circ$.

    The largest inscribed angle intercepts the largest arc ($160^\circ$).

    Angle $= \frac{160^\circ}{2} = 80^\circ$.


    Why it works:

    The inscribed angles of the triangle are exactly half of the arcs they intercept, so the angle ratio
    is also $2:3:4$, summing to $180^\circ$.


    Why the other choices fail:

    - **(A)** $40^\circ$ is the smallest angle ($80/2$).

    - **(B)** $60^\circ$ is the middle angle ($120/2$).

    - **(D)** $160^\circ$ is the central angle, not the inscribed angle.

    '
- id: olympiad-quiz-q040
  type: multipleChoice
  prompt: In $\triangle ABC$, the altitude from $A$ to $BC$ meets the circumcircle at $D$. If $\angle
    B = 65^\circ$, find the measure of the minor arc $BD$.
  choices:
  - id: a
    text: $25^\circ$
    issueSignals:
    - id: theorem-error
      domains: []
  - id: b
    text: $50^\circ$
  - id: c
    text: $65^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: d
    text: $130^\circ$
    issueSignals:
    - id: theorem-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Draw the altitude and find the angles in the resulting right triangles.
  - Use the inscribed angle theorem to double the angle and find the arc.
  explanation: 'Solution:

    Let the altitude meet $BC$ at $H$. In right $\triangle ABH$, $\angle BAH = 90^\circ - \angle B = 90^\circ
    - 65^\circ = 25^\circ$.

    The ray $AH$ extends to $D$ on the circle, so $\angle BAD = 25^\circ$.

    Because $\angle BAD$ is an inscribed angle, it intercepts arc $BD$.

    $\text{arc } BD = 2 \times \angle BAD = 2(25^\circ) = 50^\circ$.


    Why it works:

    The altitude creates a right triangle with the side $AB$. The resulting top angle is an inscribed
    angle sharing an arc with the circle.


    Why the other choices fail:

    - **(A)** $25^\circ$ is the inscribed angle, not the arc.

    - **(D)** $130^\circ$ is arc $AC$ ($2 \times 65^\circ$).

    '
- id: olympiad-quiz-q065
  type: multipleChoice
  prompt: A regular pentagon $ABCDE$ is inscribed in a circle. What is the measure of the angle formed
    by the intersection of diagonals $AD$ and $BD$?
  choices:
  - id: a
    text: $36^\circ$
  - id: b
    text: $72^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: c
    text: $108^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: d
    text: $144^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Compute the arc lengths of a regular polygon.
  - Use inscribed angles for the diagonals.
  explanation: 'Solution:

    A regular pentagon divides the circle into 5 equal arcs, each measuring $360^\circ / 5 = 72^\circ$.

    The angle between diagonals $AD$ and $BD$ is $\angle ADB$.

    Wait, $AD$ and $BD$ intersect at $D$. The angle is just the inscribed angle $\angle ADB$.

    The angle $\angle ADB$ intercepts arc $AB$, which is one of the 5 equal arcs.

    $\text{arc } AB = 72^\circ$.

    $\angle ADB = \frac{72^\circ}{2} = 36^\circ$.


    Why it works:

    Every vertex of a regular $n$-gon inscribed in a circle sends out diagonals that divide the angle
    into $n-2$ equal pieces. For a pentagon, the $108^\circ$ interior angle is divided into three $36^\circ$
    angles.


    Why the other choices fail:

    - **(B)** $72^\circ$ is the central angle / arc measure.

    - **(C)** $108^\circ$ is the interior angle of the pentagon.

    '
- id: olympiad-quiz-q032
  type: multipleChoice
  prompt: In a circle, chord $AB$ has length equal to the radius. What is the measure of the major arc
    $AB$?
  choices:
  - id: a
    text: $60^\circ$
    issueSignals:
    - id: wrong-arc
      domains: []
  - id: b
    text: $120^\circ$
    issueSignals:
    - id: wrong-arc
      domains: []
  - id: c
    text: $300^\circ$
  - id: d
    text: $330^\circ$
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recognize that a chord equal to the radius forms an equilateral triangle with the center.
  - Subtract the minor arc from $360^\circ$.
  explanation: 'Solution:

    Draw radii to $A$ and $B$. The triangle formed by the center and the chord is equilateral because
    all three sides equal the radius.

    Thus, the central angle is $60^\circ$.

    The minor arc $AB$ is $60^\circ$.

    The major arc is $360^\circ - 60^\circ = 300^\circ$.


    Why it works:

    The $60^\circ$ central angle directly subtends a $60^\circ$ minor arc.


    Why the other choices fail:

    - **(A)** $60^\circ$ is the minor arc.

    - **(B)** $120^\circ$ is the sum of two such arcs (inscribed hexagon).

    '
- id: olympiad-quiz-q064
  type: multipleChoice
  prompt: A quadrilateral $ABCD$ is inscribed in a circle. If arc $AB = 80^\circ$, arc $BC = 100^\circ$,
    and arc $CD = 110^\circ$, find $\angle A$.
  choices:
  - id: a
    text: $70^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: b
    text: $85^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  - id: c
    text: $105^\circ$
  - id: d
    text: $110^\circ$
    issueSignals:
    - id: wrong-angle
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Identify which arcs make up the intercepted arc for $\angle A$.
  - Sum the relevant arcs and divide by 2.
  explanation: 'Solution:

    The inscribed angle $\angle A$ intercepts the arc $BCD$, which is arc $BC$ + arc $CD$.

    $\text{arc } BCD = 100^\circ + 110^\circ = 210^\circ$.

    $\angle A = \frac{1}{2} \times 210^\circ = 105^\circ$.


    Why it works:

    The inscribed angle always intercepts the arc exactly opposite to its vertex.


    Why the other choices fail:

    - **(A)** $70^\circ$ is $\angle C$ (intercepts arc $DAB = 70+70$, wait. Arc $DA = 360 - 80 - 100 -
    110 = 70$. Arc $DAB = 70+80=150$. So $\angle C = 75^\circ$).

    - **(B)** $85^\circ$ is $\angle D$ (intercepts arc $ABC = 80+100=180 \implies \angle D = 90^\circ$.
    Wait, $170/2 = 85^\circ$. Yes.)

    '
- id: olympiad-quiz-q026
  type: multipleChoice
  prompt: Tangents $PA$ and $PB$ are drawn to a circle. A third tangent line intersects $PA$ at $C$ and
    $PB$ at $D$, and touches the circle at $E$. If $PA = 15$, what is the perimeter of $\triangle PCD$?
  choices:
  - id: a
    text: $15$
    issueSignals:
    - id: formula-error
      domains: []
  - id: b
    text: $22.5$
    issueSignals:
    - id: formula-error
      domains: []
  - id: c
    text: $30$
  - id: d
    text: $45$
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Apply the two-tangent theorem to three different points ($P, C, D$).
  - Substitute the equal tangent segments into the perimeter sum.
  explanation: 'Solution:

    By the two-tangent theorem, $PA = PB = 15$.

    Also, from point $C$, the tangents to the circle are equal: $CA = CE$.

    From point $D$, the tangents are equal: $DB = DE$.

    The perimeter of $\triangle PCD$ is $PC + CD + DP$.

    Since $CD = CE + ED$, the perimeter is $PC + CE + ED + DP$.

    Substitute $CE = CA$ and $ED = DB$:

    Perimeter $= PC + CA + DB + DP$.

    Notice that $PC + CA = PA$ and $DB + DP = PB$.

    Perimeter $= PA + PB = 15 + 15 = 30$.


    Why it works:

    The segments $CE$ and $ED$ "fold out" to complete the segments $CA$ and $DB$, perfectly conserving
    the total length along the original tangents $PA$ and $PB$.


    Why the other choices fail:

    - **(A)** 15 is just $PA$.

    - **(D)** 45 adds another 15 erroneously.

    '
- id: olympiad-quiz-q036
  type: multipleChoice
  prompt: Two concentric circles have radii 5 and 13. A chord of the larger circle is tangent to the smaller
    circle. What is its length?
  choices:
  - id: a
    text: $8$
    issueSignals:
    - id: wrong-concept
      domains: []
  - id: b
    text: $12$
    issueSignals:
    - id: wrong-segment
      domains: []
  - id: c
    text: $18$
    issueSignals:
    - id: algebra-error
      domains: []
  - id: d
    text: $24$
  answer:
    choiceId: d
  difficultyDimensions:
  - Set up a right triangle using the two radii and the half-chord.
  - Apply the Pythagorean theorem.
  explanation: 'Solution:

    Draw a radius of the small circle to the point of tangency. This radius (length 5) is perpendicular
    to the chord.

    Draw a radius of the large circle to the endpoint of the chord (length 13).

    This forms a right triangle with hypotenuse 13 and leg 5.

    The other leg is half the chord: $\sqrt{13^2 - 5^2} = 12$.

    The full chord length is $2 \times 12 = 24$.


    Why it works:

    The tangent to the inner circle is bisected by the point of tangency because the perpendicular from
    the center bisects any chord.


    Why the other choices fail:

    - **(A)** 8 is $13 - 5$.

    - **(B)** 12 is the half-chord length.

    '
- id: olympiad-quiz-q028
  type: multipleChoice
  prompt: A cyclic hexagon has three consecutive sides of length 3 and three consecutive sides of length
    5. What is the radius of the circumscribed circle?
  choices:
  - id: a
    text: $\frac{7\sqrt{3}}{3}$
  - id: b
    text: $4$
    issueSignals:
    - id: wrong-concept
      domains: []
  - id: c
    text: $\frac{8\sqrt{3}}{3}$
    issueSignals:
    - id: algebra-error
      domains: []
  - id: d
    text: $5$
    issueSignals:
    - id: wrong-concept
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Rearrange the sides of the cyclic hexagon (allowable without changing circumradius).
  - Alternate sides 3, 5, 3, 5, 3, 5 to form equilateral triangles.
  - Compute the radius using the Law of Cosines.
  explanation: 'Solution:

    The circumradius of a cyclic polygon is invariant under the permutation of its side lengths.

    Rearrange the sides to alternate: 3, 5, 3, 5, 3, 5.

    This creates an equilateral triangle with vertices at every other vertex of the hexagon.

    Let the center be $O$. A triangle formed by alternating vertices has sides $x$.

    Using the Law of Cosines on a triangle with sides 3, 5, and $x$ and included angle $120^\circ$ (since
    it''s a regular-like alternating hexagon, the angle inscribed is $120^\circ$).

    Wait, the inscribed angle of a 3-5-3-5-3-5 hexagon is $120^\circ$.

    $x^2 = 3^2 + 5^2 - 2(3)(5)\cos(120^\circ) = 9 + 25 - 30(-0.5) = 34 + 15 = 49$.

    So $x = 7$.

    The equilateral triangle has side 7. Its circumradius (which is the same as the hexagon''s) is $R
    = \frac{x}{\sqrt{3}} = \frac{7}{\sqrt{3}} = \frac{7\sqrt{3}}{3}$.


    Why it works:

    Reordering the sides doesn''t change the central angles they subtend, so the radius stays the same.
    Alternating them creates massive symmetry that trivializes the problem.


    Why the other choices fail:

    - **(B)** 4 is the average of 3 and 5.

    - **(D)** 5 is the largest side.

    '
- id: olympiad-quiz-q030
  type: selectAll
  prompt: Which of the following conditions guarantee that a quadrilateral $ABCD$ is cyclic?
  choices:
  - id: a
    text: $\angle A + \angle C = 180^\circ$
  - id: b
    text: $\angle ABD = \angle ACD$
  - id: c
    text: $\angle A + \angle B = 180^\circ$
    issueSignals:
    - id: theorem-error
      domains: []
  - id: d
    text: The perpendicular bisectors of $AB, BC,$ and $CD$ intersect at a single point.
  answer:
    choiceIds:
    - a
    - b
    - d
  difficultyDimensions:
  - Identify the converse of the inscribed angle theorem.
  - Identify the opposite angle sum theorem.
  - Recognize the circumcenter definition.
  explanation: 'Solution:

    (A), (B), and (D) are all sufficient conditions for a quadrilateral to be cyclic.


    Why it works:

    - (A) Opposite supplementary angles is the classic definition of a cyclic quadrilateral.

    - (B) The converse of "angles subtending the same arc are equal" proves that $A, B, C, D$ lie on the
    same circle.

    - (D) If three perpendicular bisectors meet at a point, that point is equidistant from all four vertices,
    which is the definition of a circumcenter.


    (C) implies that $AD$ is parallel to $BC$ (it''s a trapezoid), which does not guarantee it can be
    inscribed in a circle (unless it''s an isosceles trapezoid).

    '
