questions:
- id: olympiad-quiz-q025
  type: multipleChoice
  prompt: Prove exterior angle theorem.
  choices:
  - id: a
    text: The stated facts are insufficient.
  - id: b
    text: Use the diagram scale to estimate the result.
  - id: c
    text: Apply the converse without checking its hypothesis.
  - id: d
    text: Compare triangle sum with adjacent linear-pair sum
  answer:
    choiceId: d
  explanation: Use a diagram measurement.
- id: olympiad-quiz-q029
  type: multipleChoice
  prompt: Why draw a radius to a point of tangency?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: Apply the converse without checking its hypothesis.
  - id: c
    text: It unlocks perpendicular tangent-radius theorem and isosceles triangles
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: c
  explanation: It always bisects the chord.
- id: olympiad-quiz-q034
  type: multipleChoice
  prompt: An inscribed angle is 35. Find its intercepted arc.
  choices:
  - id: a
    text: 80 degrees
  - id: b
    text: 70 degrees
  - id: c
    text: 35 degrees
  - id: d
    text: 110 degrees
  answer:
    choiceId: b
  explanation: Arc is twice inscribed angle. A common error is 35 degrees.
- id: olympiad-quiz-q037
  type: multipleChoice
  prompt: What auxiliary line often helps prove a circle angle relation?
  choices:
  - id: a
    text: A radius to an endpoint or a chord/diameter creating isosceles triangles
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: Apply the converse without checking its hypothesis.
  answer:
    choiceId: a
  explanation: Any line through the picture.
- id: olympiad-quiz-q071
  type: multipleChoice
  prompt: A triangle uses angles 28 and 67 transferred by parallel lines. Find third.
  choices:
  - id: a
    text: 113 degrees
  - id: b
    text: 95 degrees
  - id: c
    text: 42.5 degrees
  - id: d
    text: 85 degrees
  answer:
    choiceId: d
  explanation: Subtract their sum from 180. A common error is 113 degrees.
- id: olympiad-quiz-q027
  type: multipleChoice
  prompt: Prove opposite angles of cyclic quadrilateral are supplementary.
  choices:
  - id: a
    text: Each is half a pair of arcs totaling 180
  - id: b
    text: Each is half a pair of arcs totaling 370
  - id: c
    text: Each is half a pair of arcs totaling 360
  - id: d
    text: Each is half a pair of arcs totaling 720
  answer:
    choiceId: c
  explanation: Assume all quadrilaterals have this property.
- id: olympiad-quiz-q031
  type: multipleChoice
  prompt: Give counterexample to “equal-looking angles are equal.”
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: A distorted non-scale drawing with unequal measures
  - id: c
    text: A symmetric diagram
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: b
  explanation: Drawings do not determine metric facts. A common error is a symmetric diagram.
- id: olympiad-quiz-q040
  type: multipleChoice
  prompt: What should be checked before applying an inscribed-angle theorem?
  choices:
  - id: a
    text: Vertex is on circle and angle sides are chords/secants intercepting the stated arc
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: Apply the converse without checking its hypothesis.
  answer:
    choiceId: a
  explanation: Only that a circle is drawn.
- id: olympiad-quiz-q065
  type: multipleChoice
  prompt: Prove equal base angles imply equal opposite sides.
  choices:
  - id: a
    text: The stated facts are insufficient.
  - id: b
    text: Use the diagram scale to estimate the result.
  - id: c
    text: Apply the converse without checking its hypothesis.
  - id: d
    text: Use the converse isosceles theorem or contradiction by side-angle order
  answer:
    choiceId: d
  explanation: Use only forward theorem.
- id: olympiad-quiz-q032
  type: multipleChoice
  prompt: A triangle has angles 40,60,80. Extend side at 80-degree vertex. Find exterior angle.
  choices:
  - id: a
    text: 50 degrees
  - id: b
    text: 110 degrees
  - id: c
    text: 100 degrees
  - id: d
    text: 80 degrees
  answer:
    choiceId: c
  explanation: Exterior equals remote 40+60. A common error is 80 degrees.
- id: olympiad-quiz-q064
  type: multipleChoice
  prompt: Prove equal corresponding angles imply two lines are parallel.
  choices:
  - id: a
    text: Apply the converse without checking its hypothesis.
  - id: b
    text: Apply corresponding-angle converse with common transversal
  - id: c
    text: The stated facts are insufficient.
  - id: d
    text: Use the diagram scale to estimate the result.
  answer:
    choiceId: b
  explanation: Assume the desired parallelism.
- id: olympiad-quiz-q026
  type: multipleChoice
  prompt: Prove equal alternate interior angles imply lines parallel.
  choices:
  - id: a
    text: Use the converse parallel-line theorem
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: Apply the converse without checking its hypothesis.
  answer:
    choiceId: a
  explanation: Assume parallelism as a given.
- id: olympiad-quiz-q036
  type: multipleChoice
  prompt: Why is “the arc looks like a semicircle” insufficient?
  choices:
  - id: a
    text: A diameter or 360-degree arc must be given/proved
  - id: b
    text: A diameter or 90-degree arc must be given/proved
  - id: c
    text: A diameter or 190-degree arc must be given/proved
  - id: d
    text: A diameter or 180-degree arc must be given/proved
  answer:
    choiceId: d
  explanation: Arcs are always halves.
- id: olympiad-quiz-q028
  type: multipleChoice
  prompt: Prove radius to tangent point is perpendicular.
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: Apply the converse without checking its hypothesis.
  - id: c
    text: A nonperpendicular line through contact would pass inside circle and meet it twice
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: c
  explanation: Use a visual right-angle guess.
- id: olympiad-quiz-q030
  type: multipleChoice
  prompt: A proof has an angle equality with no cited reason. Is it complete?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: 'No'
  - id: c
    text: Yes if diagram appears clear
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: b
  explanation: Every inference needs a theorem or given. A common error is yes if diagram appears clear.
