questions:
  - id: m2d-lang-q01
    title: '"Fired horizontally"'
    type: multipleChoice
    prompt: |
      A problem states: "A cannonball is fired horizontally from the top of a cliff." What hidden mathematical information does "fired horizontally" give you?
    choices:
      - id: a
        text: The initial vertical velocity is zero ($v_{yi} = 0$).
      - id: b
        text: The initial horizontal velocity is zero ($v_{xi} = 0$).
      - id: c
        text: The acceleration in the x direction is $9.8\text{ m/s}^2$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Horizontally" means parallel to the ground, with an angle of $0°$. Therefore, $\sin(0°) = 0$, meaning the initial velocity has no vertical y-component.

  - id: m2d-lang-q02
    title: '"Hits the ground" or "lands"'
    type: multipleChoice
    prompt: |
      "A projectile is launched from a $50\text{ m}$ tall building and lands on the ground below." If you set the ground as $y = 0$, what does "lands on the ground" tell you?
    choices:
      - id: a
        text: The final y-position is $0$ ($y_f = 0$), so the displacement is $\Delta y = -50\text{ m}$.
      - id: b
        text: The final y-velocity is $0$ ($v_{yf} = 0$).
      - id: c
        text: The final x-velocity is $0$ ($v_{xf} = 0$).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Hitting the ground" gives you the final vertical position constraint. It does NOT mean the final velocity is zero; the kinematic equations describe the motion *just before* impact, where velocity is definitely non-zero!

  - id: m2d-lang-q03
    title: '"Maximum height"'
    type: multipleChoice
    prompt: |
      You need to find the "maximum height" of a baseball hit into the air. What kinematic condition is uniquely true exactly at the maximum height?
    choices:
      - id: a
        text: The vertical velocity is zero ($v_y = 0$).
      - id: b
        text: The horizontal velocity is zero ($v_x = 0$).
      - id: c
        text: The acceleration is zero ($a_y = 0$).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** At the peak of its trajectory, the projectile stops moving up and is about to start moving down. At this exact instant, $v_y = 0$. (Note: $v_x$ is not zero, and $a_y$ is still $-9.8$).

  - id: m2d-lang-q04
    title: '"Range"'
    type: multipleChoice
    prompt: |
      A problem asks for the "range" of a projectile. What physical quantity is it asking for?
    choices:
      - id: a
        text: The total horizontal displacement ($\Delta x$) when the projectile returns to its initial height (or hits the ground).
      - id: b
        text: The total time of flight ($t$).
      - id: c
        text: The maximum vertical height ($\Delta y_\text{max}$).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Range" specifically refers to the horizontal distance traveled.

  - id: m2d-lang-q05
    title: '"Dropped"'
    type: multipleChoice
    prompt: |
      A rescue plane flying horizontally at $100\text{ m/s}$ "drops" a supply crate. What is the initial velocity of the crate?
    choices:
      - id: a
        text: It has a horizontal velocity of $100\text{ m/s}$ and vertical velocity of $0\text{ m/s}$.
      - id: b
        text: Both horizontal and vertical velocities are $0\text{ m/s}$.
      - id: c
        text: It has a vertical velocity of $-100\text{ m/s}$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** An object "dropped" from a moving vehicle retains the velocity of that vehicle at the moment of release. Since the plane was flying horizontally, the crate starts with $v_{xi} = 100\text{ m/s}$ and $v_{yi} = 0$.

  - id: m2d-lang-q06
    title: '"Level ground"'
    type: multipleChoice
    prompt: |
      A golf ball is hit off "level ground." What does this phrase tell you about the start and end of the trajectory?
    choices:
      - id: a
        text: The initial and final y-positions are the same ($\Delta y = 0$).
      - id: b
        text: The initial velocity must be horizontal.
      - id: c
        text: The acceleration is zero.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Level ground" means it lands at the exact same elevation it was launched from. Setting $\Delta y = 0$ is the key constraint to solve for the time of flight.

  - id: m2d-lang-q07
    title: '"Directly above"'
    type: multipleChoice
    prompt: |
      A hunter aims a rifle "directly at" a monkey hanging from a branch. What does this mean for the initial launch angle $\theta$?
    choices:
      - id: a
        text: The angle $\theta$ is determined by the straight line connecting the rifle barrel to the monkey's initial position.
      - id: b
        text: The angle is $0°$.
      - id: c
        text: The angle is $90°$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Aiming "directly at" something means the initial velocity vector points along the line of sight to the target. $\tan\theta = \frac{\Delta y_\text{target}}{\Delta x_\text{target}}$.

  - id: m2d-lang-q08
    title: '"Headwind" vs "Tailwind"'
    type: multipleChoice
    prompt: |
      A plane flies East. It encounters a "headwind." What does this mean for the wind's velocity relative to the ground?
    choices:
      - id: a
        text: The wind is blowing West (opposite to the plane's heading).
      - id: b
        text: The wind is blowing East (same direction as the plane).
      - id: c
        text: The wind is blowing North or South (perpendicular).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** A headwind blows against the front (head) of the vehicle, opposing its motion. A tailwind blows against the back (tail), assisting its motion.

  - id: m2d-lang-q09
    title: '"Air resistance is negligible"'
    type: multipleChoice
    prompt: |
      In 2D kinematics, what does "assume air resistance is negligible" allow you to do mathematically?
    choices:
      - id: a
        text: Set the horizontal acceleration to zero ($a_x = 0$) and vertical acceleration to $-9.8\text{ m/s}^2$.
      - id: b
        text: Set the vertical acceleration to zero ($a_y = 0$).
      - id: c
        text: Assume the object travels in a perfectly straight line.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Without air resistance, there are no forces acting in the horizontal direction, so $v_x$ is perfectly constant ($a_x = 0$). Gravity is the only force, so $a_y = -9.8\text{ m/s}^2$.

  - id: m2d-lang-q10
    title: '"Time of flight"'
    type: multipleChoice
    prompt: |
      You are asked to calculate the "time of flight" for a soccer ball kicked over a level field. Which kinematic direction's equations are almost always used to find this time?
    choices:
      - id: a
        text: The vertical (y) direction equations.
      - id: b
        text: The horizontal (x) direction equations.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The time a projectile spends in the air is entirely dictated by gravity and its vertical motion (how high it goes and how far it has to fall). You almost always use $\Delta y = v_{yi} t + \frac{1}{2}a_y t^2$ to find time.

  - id: m2d-lang-q11
    title: '"Just clears the fence"'
    type: multipleChoice
    prompt: |
      A baseball is hit and "just clears a $3\text{ m}$ high fence located $100\text{ m}$ away." What kinematic coordinates are given for this specific point in the trajectory?
    choices:
      - id: a
        text: At $x = 100\text{ m}$, the height is $y = 3\text{ m}$.
      - id: b
        text: The maximum height is $y = 3\text{ m}$.
      - id: c
        text: At $t = 3\text{ s}$, the range is $x = 100\text{ m}$.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** "Just clears" means the projectile's path passes exactly through that coordinate point in space. It is a boundary condition: when $x = 100$, $y$ must equal $3$.

  - id: m2d-lang-q12
    title: '"Angle of impact"'
    type: multipleChoice
    prompt: |
      A problem asks for the "angle at which the projectile hits the ground." How do you mathematically find this angle?
    choices:
      - id: a
        text: 'Calculate the inverse tangent of the final velocity components: $\theta = \arctan(v_{yf} / v_{xf})$.'
      - id: b
        text: 'Calculate the inverse tangent of the position components: $\theta = \arctan(y_f / x_f)$.'
      - id: c
        text: It is always exactly the negative of the launch angle.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The angle of impact is the direction of the velocity vector just before hitting the ground. You must find the final horizontal and vertical velocity components and use trig to find the angle of that vector.

  - id: m2d-lang-q13
    title: '"Speed" vs "Velocity" at impact'
    type: multipleChoice
    prompt: |
      A problem asks for the "speed of the projectile just before it hits the ground." What must you calculate?
    choices:
      - id: a
        text: 'The magnitude of the final velocity vector: $v = \sqrt{v_{xf}^2 + v_{yf}^2}$.'
      - id: b
        text: Only the final vertical velocity ($v_{yf}$).
      - id: c
        text: Only the final horizontal velocity ($v_{xf}$).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Speed is a scalar, the magnitude of the velocity vector. A projectile has both horizontal and vertical speed when it lands, so you must use the Pythagorean theorem to find the total speed.

  - id: m2d-lang-q14
    title: '"Directly across" a river'
    type: multipleChoice
    prompt: |
      A boat aims to travel "directly across" a river to the opposite shore. What does this mean for its velocity vector relative to the shore ($\vec{v}_{BS}$)?
    choices:
      - id: a
        text: $\vec{v}_{BS}$ must have a component perpendicular to the riverbanks, and its component parallel to the riverbanks must be zero.
      - id: b
        text: The boat must aim its bow straight across, regardless of the current.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** To travel directly across, the *resultant* path relative to the shore must be a straight line across. This means the boat's cross-stream heading must perfectly cancel out the river's downstream current.

  - id: m2d-lang-q15
    title: '"Crosswind"'
    type: multipleChoice
    prompt: |
      An airplane is flying North. It encounters a "crosswind." What does this mean for the wind's direction?
    choices:
      - id: a
        text: The wind is blowing East or West (perpendicular to the plane's intended path).
      - id: b
        text: The wind is blowing North or South.
      - id: c
        text: The wind is blowing downwards.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** A crosswind blows directly across the intended path (perpendicular to the heading).
