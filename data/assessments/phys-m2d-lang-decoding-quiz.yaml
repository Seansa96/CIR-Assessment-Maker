assessmentType: quiz
categoryId: physics-1
subcategoryIds:
- physics-motion-2d
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - translation-only
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
questions:
- id: m2d-lang-rel-1
  type: multipleChoice
  prompt: '[First Three Steps] A river flows due east at 1 m/s. A boat that can travel
    3 m/s in still water is pointed due north. What are the known vectors?'
  choices:
  - id: a
    text: $\vec{v}_{river/ground}$ = 1 m/s East, $\vec{v}_{boat/river}$ = 3 m/s North
  - id: b
    text: $\vec{v}_{boat/ground}$ = 3 m/s North, $\vec{v}_{river/ground}$ = 1 m/s
      East
  - id: c
    text: $\vec{v}_{boat/ground}$ = 3 m/s North, $\vec{v}_{boat/river}$ = 1 m/s East
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Students often confuse ''speed in still water''
    with the final ground speed. ''Still water'' means velocity relative to the medium
    (the river). Thus, $\vec{v}_{boat/river}$ is known, NOT $\vec{v}_{boat/ground}$.'
- id: m2d-lang-rain-1
  type: multipleChoice
  prompt: '[Language Decoding] A person runs at 2 m/s. Rain is falling vertically
    relative to the ground. The person observes the rain hitting them at an angle.
    Identify the target quantity.'
  choices:
  - id: a
    text: The angle of $\vec{v}_{rain/person}$
  - id: b
    text: The magnitude of $\vec{v}_{rain/ground}$
  - id: c
    text: The angle of $\vec{v}_{person/ground}$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** ''Observes the rain hitting them'' implies the
    frame of reference of the person. The requested quantity is the direction of the
    rain relative to the person.'
