lesson:
  introduction: In this lesson, we define the basic variables used to describe rotational
    motion, extending our knowledge of linear kinematics into the rotational domain.
  sections:
  - id: sec-1
    title: Angular Position and Displacement
    content: 'Just as a particle''s position in 1D is given by a coordinate $x$, the
      orientation of a rigid body rotating around a fixed axis is described by its
      **angular position**, $\theta$. It is defined relative to a fixed reference
      line. The **angular displacement** is the change in angular position: $$\Delta\theta
      = \theta_f - \theta_i$$.


      Angular displacement is typically measured in radians (rad), where one full
      revolution is $2\pi$ rad. Counterclockwise rotation is defined as positive,
      while clockwise rotation is negative by convention.'
    media:
    - type: image
      src: /media/physics/animations/rotational-variables.gif
      alt: Animation showing angular displacement theta and arc length s = r theta
      caption: 'Figure 1: Angular position $\theta$ and the relationship to arc length
        $s$.'
    check:
      id: chk-rv-1
      type: multipleChoice
      prompt: If a rigid body rotates clockwise by 90 degrees, what is its angular
        displacement in radians?
      choices:
      - id: a
        text: $\pi/2$ rad
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: $-\pi/2$ rad
      - id: c
        text: $\pi$ rad
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: d
        text: $-\pi$ rad
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        $-\pi/2$ rad


        Why it works:

        Clockwise rotation is defined as negative. $90^\circ$ is equivalent to $\pi/2$
        radians, so the displacement is $-\pi/2$ rad.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Radians and Arc Length
    content: 'Radians connect rotation to linear distance: $s=r\theta$, with $\theta$ in radians.'
    media: []
    check:
      id: chk-rv-5
      type: multipleChoice
      prompt: 'A point 0.50 m from an axis turns through 4.0 rad. What arc length does it travel?'
      choices: [{ id: a, text: '$0.125$ m' }, { id: b, text: '$2.0$ m' }, { id: c, text: '$4.5$ m' }, { id: d, text: '$8.0$ m' }]
      answer: { choiceId: b }
      explanation: 'Solution: $s=r\theta=(0.50)(4.0)=2.0$ m.\n\nWhy it works: A radian is defined by arc length divided by radius.\n\nWhy the other choices fail: They invert, add, or double the required multiplication.'
  - id: sec-4
    title: Period and Frequency
    content: 'Frequency $f$ counts revolutions per second, while period $T$ is time per revolution: $f=1/T$ and $\omega=2\pi f$.'
    media: []
    check:
      id: chk-rv-6
      type: multipleChoice
      prompt: 'A wheel has period 0.25 s. What is its frequency?'
      choices: [{ id: a, text: '$0.25$ Hz' }, { id: b, text: '$2$ Hz' }, { id: c, text: '$4$ Hz' }, { id: d, text: '$8$ Hz' }]
      answer: { choiceId: c }
      explanation: 'Solution: $f=1/T=1/0.25=4$ Hz.\n\nWhy it works: Frequency is the reciprocal of the time for one cycle.\n\nWhy the other choices fail: They retain the period or use an incorrect reciprocal.'
  - id: sec-5
    title: Average Versus Instantaneous Rate
    content: 'Average angular velocity uses a finite interval; instantaneous angular velocity is the derivative at one instant.'
    media: []
    check:
      id: chk-rv-7
      type: multipleChoice
      prompt: 'Which expression gives instantaneous angular velocity?'
      choices: [{ id: a, text: '$\Delta\theta/\Delta t$' }, { id: b, text: '$d\theta/dt$' }, { id: c, text: '$d\omega/dt$' }, { id: d, text: '$r\theta$' }]
      answer: { choiceId: b }
      explanation: 'Solution: $\omega=d\theta/dt$.\n\nWhy it works: A derivative gives the local rate of change.\n\nWhy the other choices fail: The others are average rate, angular acceleration, or arc length.'
  - id: sec-6
    title: Sign Convention
    content: 'Choose a positive rotation direction once and maintain it. In the usual planar convention, counterclockwise is positive.'
    media: []
    check:
      id: chk-rv-8
      type: multipleChoice
      prompt: 'A disk changes from $\theta=1.0$ rad to $\theta=-2.0$ rad. What is $\Delta\theta$?'
      choices: [{ id: a, text: '$3.0$ rad' }, { id: b, text: '$-3.0$ rad' }, { id: c, text: '$-1.0$ rad' }, { id: d, text: '$2.0$ rad' }]
      answer: { choiceId: b }
      explanation: 'Solution: $\Delta\theta=-2.0-1.0=-3.0$ rad.\n\nWhy it works: Displacement is final minus initial position.\n\nWhy the other choices fail: They reverse the subtraction or omit a signed value.'
  - id: sec-7
    title: Linking Linear and Angular Speed
    content: 'A point on a rigid rotating body has tangential speed $v=r\omega$; points farther from the axis move faster at the same $\omega$.'
    media: []
    check:
      id: chk-rv-9
      type: multipleChoice
      prompt: 'Two points on a disk have radii $r$ and $2r$. At equal angular speed, the outer point has what speed?'
      choices: [{ id: a, text: Half as large }, { id: b, text: The same }, { id: c, text: Twice as large }, { id: d, text: Four times as large }]
      answer: { choiceId: c }
      explanation: 'Solution: $v=(2r)\omega=2(r\omega)$.\n\nWhy it works: Tangential speed is proportional to radius.\n\nWhy the other choices fail: They ignore or square the radius relation.'
  - id: sec-2
    title: Angular Velocity
    content: 'The rate at which a body rotates is its **angular velocity**, $\omega$.
      The average angular velocity is the angular displacement divided by the time
      interval: $$\omega_{avg} = \frac{\Delta\theta}{\Delta t}$$.


      The instantaneous angular velocity is the limit as $\Delta t$ approaches zero:
      $$\omega = \frac{d\theta}{dt}$$.


      The SI unit of angular velocity is rad/s. Unlike linear velocity which requires
      specifying a direction in 3D space, angular velocity of a fixed-axis object
      only has two possible directions: positive (counterclockwise) or negative (clockwise).'
    media: []
    check:
      id: chk-rv-2
      type: multipleChoice
      prompt: A ceiling fan makes 2 full revolutions per second. What is its angular
        velocity $\omega$ in rad/s?
      choices:
      - id: a
        text: $2\pi$ rad/s
        issueSignals:
        - id: unit-conversion-error
      - id: b
        text: $4\pi$ rad/s
      - id: c
        text: 2 rad/s
        issueSignals:
        - id: unit-conversion-error
      - id: d
        text: 4 rad/s
        issueSignals:
        - id: unit-conversion-error
      answer:
        choiceId: b
      explanation: 'Solution:

        $4\pi$ rad/s


        Why it works:

        One revolution is $2\pi$ radians. Since it completes 2 revolutions in one
        second, $\omega = 2 \times 2\pi = 4\pi$ rad/s.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
