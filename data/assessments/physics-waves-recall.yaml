items:
- id: r01
  type: typed
  prompt: State a central equation or relationship for Traveling Waves.
  answer:
    expected: v=f\lambda
  explanation: 'Solution: Use $v=f\lambda$. Why it works: one wavelength passes a point each period.'
  tags:
  - physics-traveling-waves
  - equations
- id: r02
  type: typed
  prompt: State a central equation or relationship for Mathematics of Waves.
  answer:
    expected: k=2\pi/\lambda
  explanation: 'Solution: Use $k=2\pi/\lambda$. Why it works: one wavelength corresponds to $2\pi$ radians of spatial phase.'
  tags:
  - physics-wave-mathematics
  - equations
- id: r03
  type: typed
  prompt: State a central equation or relationship for Wave Speed on a Stretched String.
  answer:
    expected: v=\sqrt{T/\mu}
  explanation: 'Solution: Use $v=\sqrt{T/\mu}$. Why it works: tension and linear density determine a string wave speed.'
  tags:
  - physics-stretched-string-wave-speed
  - equations
- id: r04
  type: typed
  prompt: State a central equation or relationship for Interference of Waves.
  answer:
    expected: A_R=A_1+A_2
  explanation: 'Solution: Add wave amplitudes algebraically. Why it works: linear superposition combines displacements.'
  tags:
  - physics-wave-interference
  - equations
- id: r05
  type: typed
  prompt: State a central equation or relationship for Standing Waves and Resonance.
  answer:
    expected: f_n=nv/(2L)
  explanation: 'Solution: Use $f_n=nv/(2L)$. Why it works: fixed-end modes fit integer half-wavelengths.'
  tags:
  - physics-standing-waves-resonance
  - equations
