modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: numericResponse
  skills:
  - average-value
  prompt: 'Find the average value of $f(x) = 3x^2 - 1$ on the interval $[1, 3]$.

    '
  answer:
    value: 12
    tolerance: 0.1
  explanation: '$f_{avg} = \frac{1}{3-1} \int_1^3 (3x^2 - 1)\,dx = \frac{1}{2} [x^3
    - x]_1^3$.

    At $x=3$: $27 - 3 = 24$. At $x=1$: $1 - 1 = 0$.

    $f_{avg} = \frac{1}{2}(24 - 0) = 12$.

    '
- id: q002
  type: multipleChoice
  skills:
  - average-value
  prompt: 'The Mean Value Theorem for Integrals states that there exists a $c \in
    [a, b]$ such that $\int_a^b f(x)\,dx$ is equal to...

    '
  choices:
  - id: a
    text: $f(c)(b-a)$
  - id: b
    text: $f'(c)(b-a)$
  - id: c
    text: $\frac{f(b) - f(a)}{b-a}$
  - id: d
    text: $f_{avg} / (b-a)$
  answer:
    choiceId: a
  explanation: 'The integral (area under curve) is equal to a rectangle of width $(b-a)$
    and height $f(c)$. Thus, $\int_a^b f(x)\,dx = f(c)(b-a)$.

    '
- id: q003
  type: numericResponse
  skills:
  - average-value
  prompt: 'Find the value $c$ such that $f(c) = f_{avg}$ for the function $f(x) =
    \sqrt{x}$ on $[0, 4]$.

    '
  answer:
    value: 1.777
    tolerance: 0.1
  explanation: '$f_{avg} = \frac{1}{4} \int_0^4 x^{1/2}\,dx = \frac{1}{4} [\frac{2}{3}x^{3/2}]_0^4
    = \frac{1}{4} (\frac{2}{3}(8)) = \frac{16}{12} = \frac{4}{3}$.

    Set $f(c) = 4/3 \implies \sqrt{c} = 4/3 \implies c = 16/9 \a\approx 1.777$.

    '
- id: q004
  type: multipleChoice
  skills:
  - average-value
  prompt: 'If an object''s velocity is given by $v(t) = 3t^2$, what does the average
    value of $v(t)$ on $[0, 5]$ represent physically?

    '
  choices:
  - id: a
    text: The average velocity of the object over the 5 seconds.
  - id: b
    text: The total displacement of the object.
  - id: c
    text: The object's acceleration at $t=2.5$.
  - id: d
    text: The distance traveled.
  answer:
    choiceId: a
  explanation: 'The average value of a velocity function yields the average velocity,
    which is exactly $\frac{\text{total displacement}}{\text{time}}$.

    '
- id: q005
  type: numericResponse
  skills:
  - average-value
  prompt: 'Find the average value of $f(x) = e^x$ on $[0, \ln(3)]$.

    '
  answer:
    value: 1.82
    tolerance: 0.01
  explanation: '$f_{avg} = \frac{1}{\ln(3) - 0} \int_0^{\ln(3)} e^x\,dx = \frac{1}{\ln(3)}
    [e^x]_0^{\ln(3)} = \frac{1}{\ln(3)} (3 - 1) = \frac{2}{\ln(3)}$.

    $2 / 1.0986 \a\approx 1.820$.

    '

