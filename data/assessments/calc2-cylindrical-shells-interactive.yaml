schemaVersion: 1
id: calc2-cylindrical-shells-interactive
title: Cylindrical Shells Interactive Exploration
assessmentType: interactiveExploration
categoryId: calculus-2
subcategoryId: cylindrical-shells
subcategoryIds:
  - cylindrical-shells
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: interactiveExploration
  tags:
    - shell-method
    - volume
    - visualization
exploration:
  introduction: |
    The volume of a solid of revolution can be approximated by summing the volumes of many thin cylindrical shells.
    In this exploration, you can adjust the radius $r$ and the height $h$ of a single cylindrical shell to see how its volume $V \approx 2\pi r h \Delta x$ changes.
  sections:
    - id: explore-shell
      title: Explore Shell Dimensions
      required: true
      instruction: |
        Use the sliders to change the radius $r$ and the height $h$ of the cylindrical shell. We assume a constant thickness $\Delta x = 0.1$.
        Notice how increasing the radius linearly increases the volume, just like increasing the height does.
      controls:
        - id: r
          type: slider
          label: Radius r
          min: 1.0
          max: 10.0
          step: 0.5
          defaultValue: '2.0'
        - id: h
          type: slider
          label: Height h
          min: 1.0
          max: 10.0
          step: 0.5
          defaultValue: '5.0'
      views:
        - id: radius-value
          type: readout
          label: Radius r
          expression: r
        - id: height-value
          type: readout
          label: Height h
          expression: h
        - id: volume-value
          type: readout
          label: Approximate Volume (V = 2 * pi * r * h * 0.1)
          expression: 2 * 3.14159 * r * h * 0.1
      check:
        id: explore-shell-check
        type: multipleChoice
        prompt: If you double the radius $r$ and keep the height $h$ the same, what happens to the volume of the thin cylindrical shell?
        choices:
          - id: a
            text: It doubles.
          - id: b
            text: It quadruples.
          - id: c
            text: It stays the same.
          - id: d
            text: It is halved.
        answer:
          choiceId: a
        explanation: |
          The volume formula for a shell is $V \approx 2\pi r h \Delta x$. Since $r$ is not squared (unlike in the disk method), doubling $r$ simply doubles the volume.


