questions:
  - id: m2d-frame-q01
    title: Dropping an object in a moving train
    type: multipleChoice
    prompt: |
      You are standing in a train car moving forward at a constant $30\text{ m/s}$. You drop a coin from your hand. What is the trajectory of the coin as seen by YOU (in the train's frame of reference)?
    choices:
      - id: a
        text: It falls straight down in a vertical line.
      - id: b
        text: It falls in a parabola curving backwards.
      - id: c
        text: It falls in a parabola curving forwards.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** In an inertial (non-accelerating) frame, physics works exactly the same as if you were at rest. Since you drop it from rest relative to you, it falls straight down relative to you.

  - id: m2d-frame-q02
    title: Dropping an object in a moving train (Ground view)
    type: multipleChoice
    prompt: |
      You are standing in a train car moving forward at a constant $30\text{ m/s}$. You drop a coin. What is the trajectory of the coin as seen by a stationary observer standing on the GROUND outside?
    choices:
      - id: a
        text: It falls in a forward-curving half-parabola.
      - id: b
        text: It falls straight down in a vertical line.
      - id: c
        text: It falls in a backward-curving half-parabola.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** To the observer on the ground, the coin already has an initial horizontal velocity of $30\text{ m/s}$ when released. It is a projectile launched horizontally, so it traces a half-parabola.

  - id: m2d-frame-q03
    title: Relative Velocity Equation
    type: multipleChoice
    prompt: |
      Which of the following is the correct vector equation relating the velocity of object A relative to the ground ($\vec{v}_{AG}$), object B relative to the ground ($\vec{v}_{BG}$), and object A relative to object B ($\vec{v}_{AB}$)?
    choices:
      - id: a
        text: $\vec{v}_{AB} = \vec{v}_{AG} - \vec{v}_{BG}$
      - id: b
        text: $\vec{v}_{AB} = \vec{v}_{AG} + \vec{v}_{BG}$
      - id: c
        text: $\vec{v}_{AB} = \vec{v}_{BG} - \vec{v}_{AG}$
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The velocity of A relative to B is the velocity of A minus the velocity of B (in the same frame). $\vec{v}_{AB} = \vec{v}_{AG} - \vec{v}_{BG}$.

  - id: m2d-frame-q04
    title: Subscript addition rule
    type: multipleChoice
    prompt: |
      A dog (D) runs on a moving walkway (W) relative to the Earth (E). To find the velocity of the dog relative to the Earth ($\vec{v}_{DE}$), which vector addition is correct?
    choices:
      - id: a
        text: $\vec{v}_{DE} = \vec{v}_{DW} + \vec{v}_{WE}$
      - id: b
        text: $\vec{v}_{DE} = \vec{v}_{DW} - \vec{v}_{WE}$
      - id: c
        text: $\vec{v}_{DE} = \vec{v}_{WD} + \vec{v}_{WE}$
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The "subscript chain rule" states that adjacent inner subscripts cancel out: $\vec{v}_{DE} = \vec{v}_{D\mathbf{W}} + \vec{v}_{\mathbf{W}E}$.

  - id: m2d-frame-q05
    title: Two cars approaching
    type: numericResponse
    prompt: |
      Car A travels North at $20\text{ m/s}$. Car B travels South at $30\text{ m/s}$. What is the magnitude of the velocity of Car A as measured by the driver in Car B (in m/s)?
    answer:
      value: 50.0
      tolerance: 0.1
    explanation: |
      $\vec{v}_{AB} = \vec{v}_A - \vec{v}_B = (20\text{ North}) - (30\text{ South}) = (20\text{ North}) - (-30\text{ North}) = 50\text{ North}$. The magnitude is $50\text{ m/s}$.

  - id: m2d-frame-q06
    title: Cars passing each other
    type: numericResponse
    prompt: |
      Car A travels East at $25\text{ m/s}$. Car B travels East at $30\text{ m/s}$. What is the magnitude of the velocity of Car B as measured by the driver of Car A (in m/s)?
    answer:
      value: 5.0
      tolerance: 0.1
    explanation: |
      $\vec{v}_{BA} = \vec{v}_B - \vec{v}_A = 30\text{ East} - 25\text{ East} = 5\text{ East}$. The magnitude is $5\text{ m/s}$.

  - id: m2d-frame-q07
    title: Perpendicular Relative Velocity
    type: numericResponse
    prompt: |
      A boat heads due North across a river at $4.0\text{ m/s}$ relative to the water. The river flows due East at $3.0\text{ m/s}$ relative to the shore. What is the magnitude of the boat's velocity relative to the shore (in m/s)?
    answer:
      value: 5.0
      tolerance: 0.1
    explanation: |
      The vectors are perpendicular. Using the Pythagorean theorem: $v = \sqrt{4.0^2 + 3.0^2} = \sqrt{16 + 9} = \sqrt{25} = 5.0\text{ m/s}$.

  - id: m2d-frame-q08
    title: Swimmer crossing a river
    type: multipleChoice
    prompt: |
      A river flows East. To swim straight across the river (so you land at the point on the opposite shore directly North of where you started), which direction must you aim your body?
    choices:
      - id: a
        text: Somewhat Northwest
      - id: b
        text: Directly North
      - id: c
        text: Somewhat Northeast
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** You must aim upstream (West) so that your velocity's Westward component cancels out the river's Eastward current, leaving only the Northward component to carry you across.

  - id: m2d-frame-q09
    title: Rain on a moving car
    type: multipleChoice
    prompt: |
      Rain is falling vertically downwards relative to the ground. If you are driving forward in a car, which direction does the rain appear to be falling from your frame of reference?
    choices:
      - id: a
        text: Diagonally downwards and towards you (hitting the windshield).
      - id: b
        text: Straight downwards.
      - id: c
        text: Diagonally downwards and away from you (hitting the rear window).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** $\vec{v}_\text{rain,car} = \vec{v}_\text{rain,ground} - \vec{v}_\text{car,ground} = \text{Down} - \text{Forward} = \text{Down} + \text{Backward}$. The rain appears to have a backward horizontal component, so it comes at you from the front.

  - id: m2d-frame-q10
    title: Independence of acceleration from frame
    type: multipleChoice
    prompt: |
      Observer A is standing on the sidewalk. Observer B is passing by in a car moving at a constant $20\text{ m/s}$. Both measure the acceleration of a falling apple. How do their measured accelerations compare?
    choices:
      - id: a
        text: They measure the exact same acceleration.
      - id: b
        text: Observer B measures a larger acceleration.
      - id: c
        text: Observer B measures a smaller acceleration.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Acceleration is the derivative of velocity. Since the frames differ by a *constant* velocity, the derivative of that difference is zero. Accelerations are invariant across all inertial reference frames.

  - id: m2d-frame-q11
    title: Reversing the Subscripts
    type: multipleChoice
    prompt: |
      If the velocity of the wind relative to a plane is $\vec{v}_{WP}$, what is the velocity of the plane relative to the wind ($\vec{v}_{PW}$)?
    choices:
      - id: a
        text: $-\vec{v}_{WP}$ (same magnitude, opposite direction)
      - id: b
        text: $\vec{v}_{WP}$ (exactly the same)
      - id: c
        text: $1/\vec{v}_{WP}$
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Swapping the observer and the observed simply reverses the direction of the relative velocity vector. $\vec{v}_{AB} = -\vec{v}_{BA}$.

  - id: m2d-frame-q12
    title: Throwing a ball from a truck
    type: numericResponse
    prompt: |
      You are standing in the back of a pickup truck moving forward at $15\text{ m/s}$. You throw a baseball straight backward (relative to the truck) at $15\text{ m/s}$. What is the velocity of the baseball relative to a stationary observer on the sidewalk (in m/s)?
    answer:
      value: 0.0
      tolerance: 0.1
    explanation: |
      $\vec{v}_\text{ball,ground} = \vec{v}_\text{ball,truck} + \vec{v}_\text{truck,ground} = -15 + 15 = 0$. To the observer on the sidewalk, the ball simply drops straight down to the ground.

  - id: m2d-frame-q13
    title: Acceleration in an accelerating frame
    type: multipleChoice
    prompt: |
      You are in an elevator accelerating UPWARDS at $2.0\text{ m/s}^2$. You drop a pen. In your frame of reference (inside the elevator), what is the magnitude of the pen's downward acceleration? (Use $g = 9.8\text{ m/s}^2$).
    answer:
      choiceId: b
    choices:
      - id: a
        text: $9.8\text{ m/s}^2$
      - id: b
        text: $11.8\text{ m/s}^2$
      - id: c
        text: $7.8\text{ m/s}^2$
    explanation: |
      **Instructor Notes:** The elevator is a non-inertial frame. The floor is accelerating up to meet the pen at $2.0\text{ m/s}^2$, while the pen accelerates down at $9.8\text{ m/s}^2$ relative to Earth. The relative acceleration is $9.8 - (-2.0) = 11.8\text{ m/s}^2$.

  - id: m2d-frame-q14
    title: Moving target
    type: multipleChoice
    prompt: |
      A tank is moving East at $10\text{ m/s}$ and fires a shell. The shell has a muzzle velocity of $500\text{ m/s}$ relative to the tank barrel. If the tank points the barrel directly North, what is the direction of the shell's velocity relative to the ground?
    choices:
      - id: a
        text: Slightly East of North
      - id: b
        text: Directly North
      - id: c
        text: Slightly West of North
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** $\vec{v}_\text{shell,ground} = \vec{v}_\text{shell,tank} + \vec{v}_\text{tank,ground}$. Adding a North vector ($500$) and an East vector ($10$) yields a vector that points mostly North, but slightly East.

  - id: m2d-frame-q15
    title: Wind and Airplane
    type: numericResponse
    prompt: |
      An airplane's airspeed indicator reads $200\text{ m/s}$ (velocity relative to the air). It is heading due North. There is a tailwind blowing due North at $30\text{ m/s}$ relative to the ground. What is the plane's ground speed in m/s?
    answer:
      value: 230.0
      tolerance: 0.1
    explanation: |
      $\vec{v}_\text{plane,ground} = \vec{v}_\text{plane,air} + \vec{v}_\text{air,ground}$. Since both vectors point North, you simply add their magnitudes: $200 + 30 = 230\text{ m/s}$.
