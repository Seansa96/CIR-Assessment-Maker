schemaVersion: 1
id: phys-m2d-frame-id-drill
title: Relative Motion - Frame Identification
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
- physics-motion-2d
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - translation-only
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
- id: m2d-frame-chain-1
  type: multipleChoice
  prompt: '[Translation Chain] Frame A moves relative to B. Frame B moves relative
    to C. To find the velocity of A relative to C, write the vector chain.'
  choices:
  - id: a
    text: $\vec{v}_{A/C} = \vec{v}_{A/B} + \vec{v}_{B/C}$
  - id: b
    text: $\vec{v}_{A/C} = \vec{v}_{A/B} - \vec{v}_{B/C}$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The ''inner'' subscripts must match and cancel
    out. A/B + B/C leaves A/C.'
- id: m2d-frame-inv-1
  type: multipleChoice
  prompt: '[Frame Identification] An airplane (A) feels a wind (W) blowing from the
    North relative to the ground (G). Express the wind velocity vector mathematically.'
  choices:
  - id: a
    text: $\vec{v}_{W/G}$ points South
  - id: b
    text: $\vec{v}_{W/G}$ points North
  - id: c
    text: $\vec{v}_{A/W}$ points North
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** ''Blowing FROM the North'' means the vector
    points South. Students commonly invert meteorological directions.'
