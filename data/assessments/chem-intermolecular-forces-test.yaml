schemaVersion: 1
id: chem-intermolecular-forces-test
title: Intermolecular Forces Comprehensive Test
assessmentType: test
categoryId: chemistry
subcategoryIds:
  - chem-intermolecular-forces
skills:
  - chem-intermolecular-forces
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which of the following substances relies entirely on London dispersion forces for its intermolecular attractions?
    choices:
      - id: a
        text: '$HCl$'
      - id: b
        text: '$NH_3$'
      - id: c
        text: '$CH_4$'
      - id: d
        text: '$CH_3F$'
    answer:
      choiceId: c
    explanation: |
      $CH_4$ is a nonpolar molecule (perfect tetrahedral geometry), so it exhibits only London dispersion forces. $HCl$ and $CH_3F$ have dipole-dipole forces, and $NH_3$ has hydrogen bonding.

  - id: q002
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Identify the predominant intermolecular force in liquid $CH_3OH$ (methanol).
    choices:
      - id: a
        text: Ion-dipole forces
      - id: b
        text: Hydrogen bonding
      - id: c
        text: Dipole-dipole forces
      - id: d
        text: London dispersion forces
    answer:
      choiceId: b
    explanation: |
      Methanol contains an O—H group, which fulfills the requirement for **hydrogen bonding** (H bonded directly to O, N, or F). This is the strongest IMF present.

  - id: q003
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which molecule in each pair has the **higher** boiling point?
      Pair 1: $Br_2$ or $I_2$
      Pair 2: $CH_3CH_2OH$ or $CH_3OCH_3$
    choices:
      - id: a
        text: '$Br_2$ and $CH_3CH_2OH$'
      - id: b
        text: '$Br_2$ and $CH_3OCH_3$'
      - id: c
        text: '$I_2$ and $CH_3CH_2OH$'
      - id: d
        text: '$I_2$ and $CH_3OCH_3$'
    answer:
      choiceId: c
    explanation: |
      Pair 1: $I_2$ is larger and more polarizable than $Br_2$, so it has stronger dispersion forces (higher BP).
      Pair 2: $CH_3CH_2OH$ (ethanol) has hydrogen bonding, whereas $CH_3OCH_3$ (dimethyl ether) has only dipole-dipole forces (higher BP for ethanol).

  - id: q004
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Why does pentane ($CH_3CH_2CH_2CH_2CH_3$) have a higher boiling point than neopentane (2,2-dimethylpropane), even though they have the same chemical formula ($C_5H_{12}$) and molar mass?
    choices:
      - id: a
        text: Pentane is polar, neopentane is nonpolar.
      - id: b
        text: Pentane has hydrogen bonding.
      - id: c
        text: Pentane's linear shape provides a larger surface area for dispersion forces compared to neopentane's compact, spherical shape.
      - id: d
        text: Pentane has stronger covalent bonds.
    answer:
      choiceId: c
    explanation: |
      Both are nonpolar. For isomers with the same mass, the molecule with the more elongated, linear shape has a larger surface area for electron clouds to interact, resulting in stronger London dispersion forces and a higher boiling point.

  - id: q005
    type: selectAll
    skills:
      - chem-intermolecular-forces
    prompt: |
      Select all of the following that would lead to a **decrease** in vapor pressure for a liquid.
    choices:
      - id: a
        text: Decreasing the temperature
      - id: b
        text: Increasing the temperature
      - id: c
        text: Substituting a nonpolar liquid with a highly polar liquid (with H-bonding) of similar mass
      - id: d
        text: Moving the liquid to a high-altitude location
    answer:
      choiceIds:
        - a
        - c
    explanation: |
      Vapor pressure depends on temperature and IMFs. Decreasing temperature lowers the kinetic energy, so fewer molecules escape (VP decreases). Stronger IMFs (polar/H-bonding) hold molecules tighter, so fewer escape (VP decreases). Atmospheric pressure (altitude) affects *boiling point*, but not the vapor pressure of the liquid itself at a given temperature.

  - id: q006
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      What intermolecular force is established when $KCl$ dissolves in water?
    choices:
      - id: a
        text: Hydrogen bonding
      - id: b
        text: Dipole-dipole forces
      - id: c
        text: London dispersion forces
      - id: d
        text: Ion-dipole forces
    answer:
      choiceId: d
    explanation: |
      $KCl$ provides $K^+$ and $Cl^-$ ions. Water is a polar molecule (dipole). The attraction between the ions and the water molecules is an **ion-dipole force**.

  - id: q007
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which of the following compounds has the **weakest** intermolecular forces?
    choices:
      - id: a
        text: '$H_2O$ (liquid)'
      - id: b
        text: '$NH_3$ (gas at room temp)'
      - id: c
        text: '$CH_4$ (gas at room temp)'
      - id: d
        text: '$CH_3OH$ (liquid)'
    answer:
      choiceId: c
    explanation: |
      $CH_4$ is a small, nonpolar molecule with only very weak London dispersion forces. It boils at −161°C. $NH_3$, $H_2O$, and $CH_3OH$ all exhibit hydrogen bonding.

  - id: q008
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      As you move from $HCl$ to $HBr$ to $HI$, the boiling point **increases**. What explains this trend?
    choices:
      - id: a
        text: The dipole-dipole forces increase because electronegativity decreases.
      - id: b
        text: The London dispersion forces increase significantly due to larger, more polarizable electron clouds.
      - id: c
        text: Hydrogen bonding becomes stronger with larger halogens.
      - id: d
        text: The covalent bonds become stronger down the group.
    answer:
      choiceId: b
    explanation: |
      While $HCl$ has the strongest dipole (largest $\Delta EN$), the boiling points actually increase down the group ($HI > HBr > HCl$). This happens because the massive increase in the size of the halogen's electron cloud makes the **London dispersion forces** much stronger in $HI$, overpowering the weaker dipole-dipole forces in $HCl$.

  - id: q009
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      A liquid is placed in a glass graduated cylinder. The meniscus curves **upward** at the edges (concave). This indicates that:
    choices:
      - id: a
        text: The cohesive forces within the liquid are stronger than the adhesive forces to the glass.
      - id: b
        text: The adhesive forces between the liquid and the glass are stronger than the cohesive forces within the liquid.
      - id: c
        text: The liquid has no intermolecular forces.
      - id: d
        text: The glass is nonpolar.
    answer:
      choiceId: b
    explanation: |
      A concave meniscus (like water in glass) forms because the liquid is strongly attracted to the walls of the container (**adhesive forces** > cohesive forces), causing it to creep up the sides. Mercury in glass forms a convex meniscus because its cohesive (metallic) forces are stronger than adhesion to glass.

  - id: q010
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      At room temperature, $F_2$ and $Cl_2$ are gases, but $H_2O$ is a liquid. Why?
    choices:
      - id: a
        text: $H_2O$ has a higher molar mass than $Cl_2$.
      - id: b
        text: $H_2O$ molecules are held together by strong hydrogen bonds, while $F_2$ and $Cl_2$ have only weaker dispersion forces.
      - id: c
        text: $H_2O$ is nonpolar, allowing it to condense more easily.
      - id: d
        text: $F_2$ and $Cl_2$ are held together by hydrogen bonds, which are weak in halogens.
    answer:
      choiceId: b
    explanation: |
      $Cl_2$ actually has a much higher molar mass (71 g/mol) than water (18 g/mol). However, water's extensive **hydrogen bonding** provides exceptionally strong intermolecular attractions, keeping it liquid at room temp, while the nonpolar halogens rely on dispersion forces.

  - id: q011
    type: numericResponse
    skills:
      - chem-intermolecular-forces
    prompt: |
      How many of the following molecules can form hydrogen bonds with themselves?
      $CH_4$, $NH_3$, $HF$, $H_2S$, $CH_3CH_2OH$
    answer:
      value: 3
      tolerance: 0
    explanation: |
      $NH_3$ (N-H), $HF$ (F-H), and $CH_3CH_2OH$ (O-H) can hydrogen bond. $CH_4$ (C-H) and $H_2S$ (S-H) cannot. Total = **3**.

  - id: q012
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which of the following statements about **viscosity** is false?
    choices:
      - id: a
        text: Viscosity generally increases as temperature decreases.
      - id: b
        text: Viscosity increases as intermolecular force strength increases.
      - id: c
        text: Long, chain-like molecules tend to have higher viscosities because they entangle.
      - id: d
        text: Viscosity is the energy required to increase the surface area of a liquid.
    answer:
      choiceId: d
    explanation: |
      Viscosity is a liquid's resistance to flow. The energy required to increase the surface area of a liquid is the definition of **surface tension**, not viscosity.

  - id: q013
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      In a mixture of $NaCl$ dissolved in water, the sodium ion ($Na^+$) is surrounded by water molecules. Which part of the water molecule points toward the sodium ion?
    choices:
      - id: a
        text: The hydrogen atoms, because they carry a partial positive charge.
      - id: b
        text: The oxygen atom, because it carries a partial negative charge.
      - id: c
        text: The oxygen atom, because it carries a partial positive charge.
      - id: d
        text: The water molecules orient randomly.
    answer:
      choiceId: b
    explanation: |
      Opposites attract. The positive $Na^+$ ion attracts the partially negative ($\delta^-$) end of the water molecule, which is the highly electronegative **oxygen atom**.

  - id: q014
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which of the following processes requires overcoming the strongest intermolecular forces?
    choices:
      - id: a
        text: Boiling liquid nitrogen ($N_2$)
      - id: b
        text: Melting solid iodine ($I_2$)
      - id: c
        text: Boiling liquid water ($H_2O$)
      - id: d
        text: Subliming dry ice ($CO_2$)
    answer:
      choiceId: c
    explanation: |
      $N_2$, $I_2$, and $CO_2$ are all nonpolar molecules held together only by London dispersion forces. Water is held together by extensive hydrogen bonding networks, which are significantly stronger than dispersion forces for small molecules (boiling point 100°C).

  - id: q015
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      When a liquid boils, what is actually happening at the molecular level?
    choices:
      - id: a
        text: Covalent bonds are breaking, separating atoms into a gas.
      - id: b
        text: Intermolecular forces are being overcome, allowing intact molecules to enter the gas phase.
      - id: c
        text: The molecules are expanding in size until they become a gas.
      - id: d
        text: Electrons are being stripped from the molecules.
    answer:
      choiceId: b
    explanation: |
      Phase changes (melting, boiling) involve overcoming **intermolecular forces**. The molecules themselves remain intact (e.g., $H_2O(l) \to H_2O(g)$). Covalent bonds are much stronger and are only broken during chemical reactions.
