- id: q006
  type: freeResponse
  prompt: The contour through C is labeled 50. Which equation represents the entire contour? Show the map reading
    or calculation that supports your answer.
  choices: []
  answer:
    gradingMode: selfCheck
    keyPoints:
    - h(x,y)=50.
  explanation: 'Solution: h(x,y)=50.


    Why it works: The contour is the set of all input pairs with height 50: $h(x,y)=50$..'
