questions:
- id: q001
  type: freeResponse
  prompt: A survey marker is halfway between the 220-m and 240-m contours. Estimate its elevation. Show the
    map reading or calculation that supports your answer.
  choices: []
  answer:
    gradingMode: selfCheck
    keyPoints:
    - 230 m.
  explanation: 'Solution: 230 m.


    Why it works: The midpoint interpolation gives $(220+240)/2=230$ m..'
  media:
  - type: image
    src: /media/calculus-3/contour-test-q001.svg
    alt: Original volcanic slope elevation contour map with values 200, 220, 240, 260 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  - errorDiagnosis
  difficultyEvidence: Interprets this distinct map, chooses the relevant level values or spacing, and explains
    an estimate, change, or geometric consequence.
  subjectDifficultyTags:
  - contour-map-interpretation
  issueSignals:
  - id: contour-interpolation-error
  prerequisiteObjectiveIds:
  - calc3-multivariable-representations
  extensionObjectiveIds:
  - calc3-gradient-geometry
- id: q002
  type: freeResponse
  prompt: Points A and B sit on the same 14-degree contour. What is $T(B)-T(A)$? Show the map reading or calculation
    that supports your answer.
  choices: []
  answer:
    gradingMode: selfCheck
    keyPoints:
    - 0°.
  explanation: 'Solution: 0°.


    Why it works: Both points have value 14, so $T(B)-T(A)=14-14=0$..'
  media:
  - type: image
    src: /media/calculus-3/contour-test-q002.svg
    alt: Original reservoir temperature contour map with values 6, 10, 14, 18, 22 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
