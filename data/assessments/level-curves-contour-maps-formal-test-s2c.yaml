- id: q003
  type: freeResponse
  prompt: The same 20-m contour increment is much closer together near which point? What does this imply? Show
    the map reading or calculation that supports your answer.
  choices: []
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Near P; the surface is steeper there.
  explanation: 'Solution: Near P; the surface is steeper there.


    Why it works: Equal contour increments packed near P mean a larger change per unit distance there..'
  media:
  - type: image
    src: /media/calculus-3/contour-test-q003.svg
