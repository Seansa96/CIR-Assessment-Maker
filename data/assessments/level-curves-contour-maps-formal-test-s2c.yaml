- id: q007
  type: freeResponse
  prompt: Both neighboring contour intervals are 10 m. Which marked region has the greater average elevation
    change across the plotted map distance? Show the map reading or calculation that supports your answer.
  choices: []
  answer:
    gradingMode: selfCheck
    keyPoints:
    - P, because the same 10-m rise occurs over less distance.
  explanation: 'Solution: P, because the same 10-m rise occurs over less distance.


    Why it works: Average rate magnitude is $|\Delta h|/\Delta s$; P has the smaller spacing for the same 10-m
    change..'
  media:
