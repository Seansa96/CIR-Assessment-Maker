- id: q005
  type: freeResponse
  prompt: Which statement describes motion along the 1000-millibar contour through P? Show the map reading
    or calculation that supports your answer.
  choices: []
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Pressure stays 1000 millibars along that contour.
  explanation: 'Solution: Pressure stays 1000 millibars along that contour.


    Why it works: Every point on that level curve satisfies $p(x,y)=1000$..'
