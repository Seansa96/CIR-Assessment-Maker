- id: q018
  type: freeResponse
  prompt: At P, neighboring contours differ by 10 units over 2 km; at Q, they differ by 10 units over 8 km.
    Which region has the larger average change magnitude? Show the map reading or calculation that supports
    your answer.
  choices: []
  answer:
