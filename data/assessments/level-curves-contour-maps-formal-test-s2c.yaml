- id: q004
  type: freeResponse
  prompt: A sensor moves from the 20° contour at S to the 40° contour at T. What is the signed change? Show
    the map reading or calculation that supports your answer.
  choices: []
  answer:
    gradingMode: selfCheck
    keyPoints:
    - +20°.
  explanation: 'Solution: +20°.


    Why it works: Signed change is final minus initial: $40-20=+20°$..'
  media:
  - type: image
    src: /media/calculus-3/contour-test-q004.svg
