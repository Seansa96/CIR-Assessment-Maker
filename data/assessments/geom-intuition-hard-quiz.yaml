- id: geom-int-hard-1
  title: Composite Area Integral
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Evaluate the integral $\int_{-4}^{4} (2 + \sqrt{16 - x^2}) \, dx$ using geometry.'
  answer:
    gradingMode: auto
    expected: 16 + (16/2)*\pi
  explanation: The integral splits into $\int_{-4}^{4} 2 \, dx + \int_{-4}^{4} \sqrt{16
    - x^2} \, dx$. The first is a rectangle of area $16$. The second is a semicircle
    of area $\frac{16\pi}{2}$.
