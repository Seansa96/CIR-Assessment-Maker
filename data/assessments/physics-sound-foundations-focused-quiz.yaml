- id: physics-sound-foundations-focused-q001
  type: multipleChoice
  prompt: Why cannot an ordinary sound wave travel through an ideal vacuum?
  choices:
  - { id: a, text: Sound needs material particles to pass the mechanical disturbance along. }
  - { id: b, text: Sound is too low in frequency to enter a vacuum. }
  - { id: c, text: Sound always needs a gravitational field to propagate. }
  answer: { choiceId: a }
  explanation: |
    Solution: Sound needs material particles to pass the mechanical disturbance along.

    Why it works: Sound is a mechanical wave, so a vacuum has no particles that can compress, rarefy, and transfer the disturbance.

    Why the other choices fail: Frequency is not the issue, and sound propagation does not require gravity.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [mechanicalWave]
  difficultyEvidence: The propagation setting is interpreted with the mechanical-wave model.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
