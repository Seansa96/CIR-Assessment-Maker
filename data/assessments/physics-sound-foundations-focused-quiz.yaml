- id: physics-sound-foundations-focused-q002
  type: multipleChoice
  prompt: A loudspeaker changes from a low note to a higher note while remaining in the same room. In the same air, what happens to the sound speed in the basic medium model?
  choices:
  - { id: a, text: It stays approximately the same because the medium has not changed. }
  - { id: b, text: It increases because higher frequency always means higher speed. }
  - { id: c, text: It becomes zero briefly while the frequency changes. }
  answer: { choiceId: a }
  explanation: |
    Solution: It stays approximately the same.

    Why it works: In the basic model, sound speed is determined by properties of the medium; changing the source frequency changes wavelength rather than forcing a different speed in the same air.

    Why the other choices fail: Higher pitch does not by itself make sound travel faster in one unchanged medium, and a smooth frequency change does not stop propagation.
  difficultyDimensions: [errorDiagnosis, modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [mediumSpeed]
  difficultyEvidence: The learner transfers the medium-property model to a source-frequency change.
  prerequisiteObjectiveIds: [phys1-obj-sound-propagation-foundations]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1370]
  blueprintId: physics-sound-foundations-focused-q002
- id: physics-sound-foundations-focused-q003
  type: multipleChoice
  prompt: An ultrasound pulse reaches an interface between two materials with different sound speeds. Which source-supported statement best explains how returning signals can provide information about the interior?
  choices:
  - { id: a, text: Some wave energy can reflect at the interface, and the echo travel time can be used to reason about distance. }
  - { id: b, text: The pulse must be completely absorbed at every interface, so no return signal is possible. }
  - { id: c, text: The sound frequency is destroyed whenever the material changes. }
  answer: { choiceId: a }
  explanation: |
    Solution: Some wave energy can reflect at the interface, and the echo travel time can be used to reason about distance.

    Why it works: A boundary between media can produce reflected and transmitted wave energy. Detecting a returned ultrasound pulse and relating its round-trip time to wave speed supports a qualitative interior-distance inference.

    Why the other choices fail: A boundary need not absorb all energy, and a changed medium does not destroy the source frequency.
  difficultyDimensions: [modelOrDerivation, representationTransfer, errorDiagnosis]
  subjectDifficultyTags: [reflection, ultrasound]
  difficultyEvidence: The learner transfers boundary behavior to an ultrasound echo application and rejects two overgeneralizations.
  prerequisiteObjectiveIds: [phys1-obj-sound-propagation-foundations]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
