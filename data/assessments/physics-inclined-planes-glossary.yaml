glossary:
  introduction: Terms used to resolve and model forces on sloped surfaces.
  sections:
  - id: incline-terms
    title: Incline Force Terms
    entries:
      - { id: downslope-component, term: Downslope gravity component, definition: 'The component $mg\sin\theta$ parallel to an incline.', drills: [{ id: ig1, type: cloze, prompt: 'Downslope gravity component is $mg____$.', answer: { expected: 'sin theta', expectedLatex: '\sin\theta', aliases: [], media: [] }, explanation: 'Solution: $\sin\theta$.\n\nWhy it works: This component is parallel to the slope.' }] }
      - { id: normal-component, term: Normal gravity component, definition: 'The component $mg\cos\theta$ perpendicular to an incline.', drills: [{ id: ig2, type: cloze, prompt: 'Perpendicular gravity component is $mg____$.', answer: { expected: 'cos theta', expectedLatex: '\cos\theta', aliases: [], media: [] }, explanation: 'Solution: $\cos\theta$.\n\nWhy it works: This component presses into the slope.' }] }
      - { id: incline-angle, term: Incline angle, definition: 'The angle between the inclined surface and horizontal.', drills: [{ id: ig3, type: typed, prompt: 'What angle sets the gravity components on a slope?', answer: { expected: 'incline angle', expectedLatex: '\theta', aliases: [theta], media: [] }, explanation: 'Solution: The incline angle.\n\nWhy it works: Components use its sine and cosine.' }] }
      - { id: normal-force, term: Normal force, definition: 'The contact force perpendicular to the inclined surface.', drills: [{ id: ig4, type: typed, prompt: 'What contact force is perpendicular to a slope?', answer: { expected: 'normal force', expectedLatex: 'N', aliases: [normal], media: [] }, explanation: 'Solution: Normal force.\n\nWhy it works: It is perpendicular to the surface.' }] }
