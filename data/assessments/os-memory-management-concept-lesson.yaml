      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Segmentation divides memory by logical units such as code, stack, and data.
      answer:
        choiceId: d
      explanation: 'Segmentation divides memory by logical units such as code, stack, and data. Related topic: Memory Management.

        '
