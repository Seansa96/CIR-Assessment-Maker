lesson:
  introduction: 'This lesson introduces Memory Management through the mental models emphasized by 3 Memory Management. Focus
    on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: no-abstraction-problem
    title: No abstraction problem
    required: true
    content: 'Without memory abstraction, programs can interfere with each other and must know physical placement details.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Raw physical memory is not a safe multiprogramming interface.

      '
    check:
      id: no-abstraction-problem-check
      title: 'Check: No abstraction problem'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **No abstraction problem**?

        '
      choices:
      - id: a
        text: Without memory abstraction, programs can interfere with each other and must know physical placement details.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Without memory abstraction, programs can interfere with each other and must know physical placement details.
        Related topic: Memory Management.

        '
  - id: address-space
    title: Address space
    required: true
    content: 'An address space gives a process a private memory view independent of physical memory layout.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Virtual-looking addresses need translation and protection.

      '
    check:
      id: address-space-check
      title: 'Check: Address space'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Address space**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: An address space gives a process a private memory view independent of physical memory layout.
      answer:
        choiceId: d
      explanation: 'An address space gives a process a private memory view independent of physical memory layout. Related
        topic: Memory Management.

        '
  - id: swapping
    title: Swapping
    required: true
    content: 'Swapping moves process memory between main memory and backing storage to manage limited RAM.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Swapping is coarse compared with demand paging.

      '
    check:
      id: swapping-check
      title: 'Check: Swapping'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Swapping**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Swapping moves process memory between main memory and backing storage to manage limited RAM.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Swapping moves process memory between main memory and backing storage to manage limited RAM. Related topic:
        Memory Management.

        '
  - id: free-memory-management
    title: Free memory management
    required: true
    content: 'The OS tracks free and allocated memory using structures such as bitmaps or free lists.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Fragmentation can make free memory hard to use even when total free space seems large.

      '
    check:
      id: free-memory-management-check
      title: 'Check: Free memory management'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Free memory management**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: The OS tracks free and allocated memory using structures such as bitmaps or free lists.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'The OS tracks free and allocated memory using structures such as bitmaps or free lists. Related topic:
        Memory Management.

        '
  - id: relocation-and-protection
    title: Relocation and protection
    required: true
    content: 'Relocation lets programs run at different memory locations, while protection prevents illegal access.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Relocation without protection is not enough for safe sharing.

      '
    check:
      id: relocation-and-protection-check
      title: 'Check: Relocation and protection'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Relocation and protection**?

        '
      choices:
      - id: a
        text: Relocation lets programs run at different memory locations, while protection prevents illegal access.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Relocation lets programs run at different memory locations, while protection prevents illegal access.
        Related topic: Memory Management.

        '
  - id: segmentation-idea
    title: Segmentation idea
    required: true
    content: 'Segmentation divides memory by logical units such as code, stack, and data.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Segments are logical regions, not fixed-size pages.

      '
    check:
      id: segmentation-idea-check
      title: 'Check: Segmentation idea'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Segmentation idea**?

