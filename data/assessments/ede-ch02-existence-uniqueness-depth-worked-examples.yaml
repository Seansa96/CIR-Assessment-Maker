workedExamples:
- id: we01
  title: Avoid a singular line
  problem: Analyze $y'=(x+y)/(x-y)$ with $y(1)=0$.
  steps:
  - id: we01-s1
    title: Locate discontinuities
    instruction: Inspect $f$ and $f_y$.
    type: freeResponse
    prompt: Find the singular set.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds denominator zero
      - Checks fy
    explanation: |-
      Solution: Both are singular on $x=y$ and continuous away from that line.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Choose a rectangle
    instruction: Place the initial point inside without crossing the singular set.
    type: freeResponse
    prompt: Give one valid rectangle.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Contains point
      - Avoids line
    explanation: |-
      Solution: For example, $1/2<x<3/2$ and $-1/4<y<1/4$ contains $(1,0)$ and has $x-y>0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: State the conclusion
    instruction: Separate local from global claims.
    type: freeResponse
    prompt: Apply the theorem.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Existence
      - Local uniqueness
    explanation: |-
      Solution: A unique solution exists on some open interval containing $x=1$; no global interval is guaranteed.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Existence without a theorem-based uniqueness claim
  problem: Analyze $y'=3y^{2/3}$ with $y(0)=0$.
  steps:
  - id: we02-s1
    title: Check existence
    instruction: Test continuity of $f$.
    type: freeResponse
    prompt: State the existence conclusion.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Checks f
      - States existence
    explanation: |-
      Solution: $f(y)=3y^{2/3}$ is continuous, so at least one local solution exists.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Check the uniqueness hypothesis
    instruction: Differentiate with respect to $y$.
    type: freeResponse
    prompt: Explain why the standard test stops.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Computes fy
      - Does not overclaim
    explanation: |-
      Solution: $f_y=2y^{-1/3}$ is undefined at $y=0$, so the sufficient uniqueness hypothesis fails.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify actual behavior
    instruction: Check two candidates directly.
    type: freeResponse
    prompt: Prove whether uniqueness holds.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Verifies both
      - Concludes nonunique
    explanation: |-
      Solution: Both $y=0$ and $y=x^3$ satisfy the IVP, so uniqueness actually fails.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: A largest uniqueness interval
  problem: Analyze $y'=3y^{2/3}$ with $y(0)=-1$.
  steps:
  - id: we03-s1
    title: Find the initial branch
    instruction: Use the separated family.
    type: freeResponse
    prompt: Find a solution through the data.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds family
      - Uses data
    explanation: |-
      Solution: The family $y=(x-C)^3$ gives $C=1$, so $y=(x-1)^3$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Locate loss of protection
    instruction: Find where the branch reaches the singular state.
    type: freeResponse
    prompt: Determine the first zero.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds x=1
      - Connects theorem
    explanation: |-
      Solution: $y=0$ at $x=1$, where $f_y$ is singular.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Describe continuations
    instruction: Compare immediate continuation with delayed departure.
    type: freeResponse
    prompt: State the largest interval of forced uniqueness.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Largest interval
      - Explains branching
    explanation: |-
      Solution: The IVP is uniquely determined on $(-\infty,1)$; after reaching zero, it may remain zero for a time before following a shifted cubic.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
