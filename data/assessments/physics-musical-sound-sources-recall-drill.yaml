items:
- {id: music-r1, type: cloze, prompt: 'The lowest mode frequency is the {{fundamental}}.', answer: fundamental, explanation: 'Solution: Identify the fundamental. Why it works: it is the lowest allowed standing-wave mode.'}
- {id: music-r2, type: typed, prompt: 'What determines musical pitch most directly?', answer: fundamental frequency, explanation: 'Solution: Use fundamental frequency. Why it works: listeners identify pitch mainly with the lowest periodic frequency.'}
- {id: music-r3, type: cloze, prompt: 'Relative harmonic amplitudes determine {{timbre}}.', answer: timbre, explanation: 'Solution: Identify timbre. Why it works: spectra with different harmonic strengths sound different at the same pitch.'}
- {id: music-r4, type: typed, prompt: 'Which harmonics are emphasized by an ideal closed-open tube?', answer: odd harmonics, explanation: 'Solution: Use odd harmonics. Why it works: its mixed end boundary conditions permit odd multiples.'}
- {id: music-r5, type: cloze, prompt: 'A frequency spectrum plots amplitude versus {{frequency}}.', answer: frequency, explanation: 'Solution: Identify frequency. Why it works: spectral spikes locate the harmonic components.'}
- {id: music-r6, type: typed, prompt: 'What physical structure amplifies selected instrument frequencies?', answer: resonator, explanation: 'Solution: Identify the resonator. Why it works: its allowed modes enhance selected vibrations.'}
