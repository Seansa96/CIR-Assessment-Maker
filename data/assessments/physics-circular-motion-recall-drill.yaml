items:
  - { id: cr1, type: cloze, prompt: 'Centripetal acceleration is $a_r=____/r$.', answer: { expected: 'v squared', expectedLatex: 'v^2', aliases: [], media: [] }, explanation: 'Solution: $v^2$.\n\nWhy it works: $a_r=v^2/r$.', tags: [formula] }
  - { id: cr2, type: typed, prompt: 'What direction is centripetal force?', answer: { expected: inward, expectedLatex: '', aliases: ['toward center'], media: [] }, explanation: 'Solution: Inward.\n\nWhy it works: It provides the radial acceleration.', tags: [direction] }
  - { id: cr3, type: cloze, prompt: 'Centripetal force is $F_c=m____/r$.', answer: { expected: 'v squared', expectedLatex: 'v^2', aliases: [], media: [] }, explanation: 'Solution: $v^2$.\n\nWhy it works: $F_c=mv^2/r$.', tags: [formula] }
  - { id: cr4, type: typed, prompt: 'What force provides circular motion for a car on a flat road?', answer: { expected: 'static friction', expectedLatex: '', aliases: [friction], media: [] }, explanation: 'Solution: Static friction.\n\nWhy it works: It can point horizontally inward.', tags: [applications] }
  - { id: cr5, type: cloze, prompt: 'Tangential acceleration changes ____.', answer: { expected: speed, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Speed.\n\nWhy it works: It acts along the velocity direction.', tags: [components] }
  - { id: cr6, type: typed, prompt: 'In uniform circular motion, what acceleration component is zero?', answer: { expected: 'tangential acceleration', expectedLatex: 'a_t', aliases: [], media: [] }, explanation: 'Solution: Tangential acceleration.\n\nWhy it works: Uniform means constant speed.', tags: [uniform] }
