schemaVersion: 1
id: chemistry-compounds-recall
title: Chemical Nomenclature Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryId: chemistry-compounds
subcategoryIds:
  - chemistry-compounds
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: What suffix is added to a nonmetal's name when it forms a binary anion?
    answer:
      expected: '-ide'
      aliases:
        - ide
        - -ide suffix
  - id: r002
    type: typed
    prompt: >
      In Type II ionic compound naming, what notation is placed after the metal's name
      to indicate its charge?
    answer:
      expected: Roman numeral
      aliases:
        - roman numeral
        - Roman numerals
  - id: r003
    type: typed
    prompt: What is the molecular formula for ammonia?
    answer:
      expected: NH3
  - id: r004
    type: typed
    prompt: What is the molecular formula for water?
    answer:
      expected: H2O
  - id: r005
    type: typed
    prompt: What is the molecular formula for hydrogen peroxide?
    answer:
      expected: H2O2
  - id: r006
    type: typed
    prompt: What prefix is used in molecular compound naming to indicate 5 atoms?
    answer:
      expected: penta-
      aliases:
        - penta
        - pentа
  - id: r007
    type: typed
    prompt: What prefix is used to indicate 4 atoms in molecular compound naming?
    answer:
      expected: tetra-
      aliases:
        - tetra
  - id: r008
    type: typed
    prompt: What is the charge of the sulfate ion (SO4)?
    answer:
      expected: 2-
      aliases:
        - '-2'
        - 2 minus
  - id: r009
    type: typed
    prompt: What is the name of the NO3- ion?
    answer:
      expected: nitrate
  - id: r010
    type: typed
    prompt: What is the name of the OH- ion?
    answer:
      expected: hydroxide
  - id: r011
    type: typed
    prompt: What is the name of the NH4+ ion?
    answer:
      expected: ammonium
  - id: r012
    type: typed
    prompt: What is the charge of the phosphate ion (PO4)?
    answer:
      expected: 3-
      aliases:
        - '-3'
        - 3 minus
  - id: r013
    type: flashcard
    prompt: |
      State the rule for naming a Type I binary ionic compound.
    answer:
      expected: >
        Name the metal cation (element name, no modification), then name the nonmetal anion
        using the element name with the -ide suffix. No Roman numeral or prefix is used.
  - id: r014
    type: typed
    prompt: Which metals require a Roman numeral when naming their compounds?
    answer:
      expected: transition metals
      aliases:
        - variable charge metals
        - metals with variable charge
  - id: r015
    type: typed
    prompt: What is the name of CO2?
    answer:
      expected: carbon dioxide
  - id: r016
    type: typed
    prompt: What is the name of N2O?
    answer:
      expected: dinitrogen monoxide
      aliases:
        - dinitrogen oxide


