- id: q-circle-angles-arcs-quiz-1
  type: multipleChoice
  prompt: 'If an inscribed angle intercepts an arc of 122 degrees, what is the measure of the angle?'
  choices:
  - id: choice-A
    text: '244^\circ'
  - id: choice-B
    text: '122^\circ'
  - id: choice-C
    text: '61^\circ'
  answer:
    choiceId: choice-C
    explanation: 'The inscribed angle is half the intercepted arc: 122/2 = 61.'
  skills:
  - geometry-circle-angles-arcs
