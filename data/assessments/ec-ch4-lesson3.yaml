- id: l3-sec1
  title: Superposition Principle
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Superposition Principle
    instruction: In a linear circuit with multiple independent sources, the voltage
      across (or current through) any element is the algebraic sum of the voltages
      (or currents) produced by each independent source acting alone (with all other
      independent sources turned off).
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l3-sec2
  title: Maximum Power Transfer
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Maximum Power Transfer
    instruction: 'Maximum power is transferred from a circuit to a load resistor $R_L$
      when $R_L$ equals the Thévenin resistance of the circuit: $R_L = R_{Th}$. The
      maximum power is $P_{max} = V_{Th}^2 / (4R_{Th})$.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
