questions:
- id: q001
  type: multipleChoice
  prompt: 'What is the correct name for CuCl2?

    '
  choices:
  - id: a
    text: copper(II) chloride
  - id: b
    text: copper chloride
  - id: c
    text: dicopper dichloride
  - id: d
    text: copper(I) chloride
  answer:

    choiceId: a
  explanation: 'Cu is a transition metal — Type II. 2 Cl− ions → 2− charge → Cu must
    be 2+. Name: copper(II) chloride.

    '
- id: q002
  type: freeResponse
  prompt: 'Name the compound Mn2O7. (Hint: manganese is a transition metal.)

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Mn is a transition metal with variable charge — Type II.
    - 7 oxygen ions (O2−) = 14− total charge. 2 Mn ions must supply 14+, so each Mn
      = 7+ (Mn7+).
    - Name is manganese(VII) oxide.
- id: q003
  type: multipleChoice
  prompt: 'What is the correct formula for calcium phosphate?

    '
  choices:
  - id: a
    text: Ca3(PO4)2
  - id: b
    text: CaPO4
  - id: c
    text: Ca2(PO4)3
  - id: d
    text: Ca3PO4
  answer:

    choiceId: a
  explanation: 'Calcium is Ca2+; phosphate is PO4³−. LCM of 2 and 3 is 6. Need 3 Ca2+
    and 2 PO4³−. Formula: Ca3(PO4)2.

    '
- id: q004
  type: multipleChoice
  prompt: 'Which compound would be classified as a molecular (covalent) compound?

    '
  choices:
  - id: a
    text: SO2
  - id: b
    text: NaCl
  - id: c
    text: MgF2
  - id: d
    text: Al2O3
  answer:

    choiceId: a
  explanation: 'SO2 contains two nonmetals (sulfur and oxygen) — it is molecular.
    The others contain a metal and a nonmetal — they are ionic.

    '
- id: q005
  type: multipleChoice
  prompt: 'What is the name of N2O4?

    '
  choices:
  - id: a
    text: dinitrogen tetroxide
  - id: b
    text: nitrogen tetroxide
  - id: c
    text: dinitrogen(IV) oxide
  - id: d
    text: nitrogen(II) oxide
  answer:

    choiceId: a
  explanation: 'N2O4 is a molecular compound (two nonmetals). Use prefixes: di- for
    2 N, tetra- for 4 O. "Oxide" is the name for oxygen as the second element. Name:
    dinitrogen tetroxide.

    '
- id: q006
  type: freeResponse
  prompt: 'Write the chemical formula for iron(III) oxide.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Iron(III) means Fe3+.
    - Oxide is O2−.
    - LCM of 3 and 2 is 6. Need 2 Fe3+ and 3 O2−.
    - Formula is Fe2O3.
- id: q007
  type: multipleChoice
  prompt: 'Which of the following names is INCORRECT?

    '
  choices:
  - id: a
    text: NaO — sodium monoxide
  - id: b
    text: FeO — iron(II) oxide
  - id: c
    text: KBr — potassium bromide
  - id: d
    text: CaCl2 — calcium chloride
  answer:

    choiceId: a
  explanation: 'Ionic compounds (NaO would be a Type I compound) never use prefixes
    like "mono-". The name would simply be "sodium oxide." Note also that NaO is not
    the correct formula — sodium is Na+ and oxide is O2−, requiring Na2O for balance.

    '
- id: q008
  type: multipleChoice
  prompt: 'What is the name of the compound (NH4)2SO4?

    '
  choices:
  - id: a
    text: ammonium sulfate
  - id: b
    text: ammonium sulfide
  - id: c
    text: ammonium(II) sulfate
  - id: d
    text: nitrogen-hydrogen sulfate
  answer:

    choiceId: a
  explanation: 'NH4+ is the ammonium ion; SO4²− is the sulfate ion. Two ammonium ions
    (2 × 1+) balance one sulfate (2−). Name: ammonium sulfate. No Roman numeral is
    used for ammonium.

    '
- id: q009
  type: freeResponse
  prompt: 'Write the formula for dinitrogen monoxide (commonly known as "laughing
    gas").

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Di- = 2 nitrogen atoms.
    - Mono- = 1 oxygen atom. (For the second element, "mono" IS used.)
    - Formula is N2O.
- id: q010
  type: multipleChoice
  prompt: 'A student names CoBr3 as "cobalt bromide." What is wrong with this name?

    '
  choices:
  - id: a
    text: Cobalt is a transition metal with variable charge; a Roman numeral (III)
      is required.
  - id: b
    text: Bromide is an incorrect anion name; it should be bromine.
  - id: c
    text: Prefixes should be used; the name should be "monocobalt tribromide."
  - id: d
    text: Nothing is wrong — the name is correct.
  answer:

    choiceId: a
  explanation: 'Cobalt is a transition metal. CoBr3 has 3 Br− ions (3− total), so
    Co must be 3+. The correct name is cobalt(III) bromide. The Roman numeral is essential
    for Type II compounds.

    '
- id: q011
  type: multipleChoice
  prompt: 'What is the name of HgCl2? (Mercury is a variable-charge metal; Hg can
    be Hg+ or Hg2+.)

    '
  choices:
  - id: a
    text: mercury(II) chloride
  - id: b
    text: mercury(I) chloride
  - id: c
    text: dimercury dichloride
  - id: d
    text: mercurous chloride
  answer:

    choiceId: a
  explanation: '2 Cl− ions → 2− total. Hg must be 2+. Name: mercury(II) chloride.
    (The old system "mercuric chloride" is no longer preferred in systematic nomenclature.)

    '
- id: q012
  type: freeResponse
  prompt: 'Name the compound Al2(SO4)3.

    '
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Aluminum is a fixed-charge metal (Al3+) — Type I, no Roman numeral.
    - SO4²− is the sulfate polyatomic ion.
    - 'Check: 2 Al3+ (6+) and 3 SO4²− (6−) balance.'
    - Name is aluminum sulfate.
- id: q013
  type: multipleChoice
  prompt: 'What is the correct formula for chromium(VI) oxide?

    '
  choices:
  - id: a
    text: CrO3
  - id: b
    text: Cr2O3
  - id: c
    text: CrO
  - id: d
    text: Cr2O6
  answer:

    choiceId: a
  explanation: 'Cr(VI) = Cr6+; O2−. To balance: need 3 O2− (total 6−) per 1 Cr6+.
    Formula: CrO3. (This is chromium trioxide, a strong oxidizer.)

    '
- id: q014
  type: multipleChoice
  prompt: 'Which statement correctly distinguishes Type I from Type II ionic naming?

    '
  choices:
  - id: a
    text: Type I metals have only one possible charge; Type II metals have variable
      charges and require a Roman numeral.
  - id: b
    text: Type I uses prefixes; Type II does not.
  - id: c
    text: Type II applies to nonmetal compounds; Type I applies to metal compounds.
  - id: d
    text: Type I requires a Roman numeral; Type II uses the -ide suffix.
  answer:

    choiceId: a
  explanation: 'The key distinction is whether the metal has a fixed charge (Type
    I, no Roman numeral needed) or variable charge (Type II, Roman numeral required).
    Both systems use the -ide suffix for binary anions.

    '
- id: q015
  type: multipleChoice
  prompt: 'The compound PCl5 is called phosphorus pentachloride. Why is "penta" used
    for chlorine but not "mono" for phosphorus?

    '
  choices:
  - id: a
    text: The prefix "mono" is omitted for the first element but always used for the
      second.
  - id: b
    text: Chlorine does not follow normal prefix rules.
  - id: c
    text: There is only one phosphorus atom, so no prefix is needed for either element.
  - id: d
    text: Pentachloride is the polyatomic ion name for Cl5.
  answer:

    choiceId: a
  explanation: 'The rule for molecular compounds: "mono-" is dropped for the first
    element when there is only one atom, but must be used for the second element (e.g.,
    CO is carbon monoxide, not monocarbon monoxide).

    '
