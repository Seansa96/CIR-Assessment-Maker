lesson:
  introduction: Forces on an Inclined Plane
  sections:
  - id: sec1
    title: Decomposing Gravity
    required: true
    content: >
      When an object rests on an inclined plane, gravity pulls straight down, but the surface pushes perpendicular to the plane.

      To analyze the forces using Newton's Second Law, it is extremely useful to tilt our coordinate system so that the x-axis runs parallel to the incline, and the y-axis is perpendicular to it.


      By doing this, we must decompose the gravitational force $mg$ into two components:

      1. Parallel to the incline: $mg \sin(\theta)$

      2. Perpendicular to the incline: $mg \cos(\theta)$
    media:
    - type: image
      src: /media/physics/kinematics/inclined-plane-fbd.svg
      alt: Free body diagram of a block on an inclined plane showing normal force, friction, and gravity.
      caption: 'Figure 1: Notice how gravity (red) points straight down, but the Normal force (blue) and Friction (green) align with the tilted surface.'
    check:
      id: q1
      type: multipleChoice
      prompt: If the angle $\theta$ of the incline increases, what happens to the normal force $F_N$?
      choices:
      - id: a
        text: It increases.
        media: []
        issueSignals: []
      - id: b
        text: It decreases.
        media: []
        issueSignals: []
      - id: c
        text: It remains the same.
        media: []
        issueSignals: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        Since the block does not accelerate perpendicular to the plane, $F_N = mg \cos(\theta)$.

        As $\theta$ increases from 0 to 90 degrees, $\cos(\theta)$ decreases, meaning the normal force decreases.


        Why it works:

        The component of gravity pushing the block into the surface relies on the cosine function. A steeper angle means less gravitational force is directed into the surface and more is directed down the incline.


        Why the other choices fail:

        - It increases: The normal force would only increase if the plane were becoming flatter (approaching 0 degrees).

        - It remains the same: The normal force is strictly dependent on the angle and is not a constant value $mg$ unless the surface is perfectly horizontal.
