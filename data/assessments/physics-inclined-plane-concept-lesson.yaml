  - id: sec2
    title: Friction on an Inclined Plane
    required: true
    content: >
      Friction always opposes the direction of relative motion (or intended motion) between the object and the surface.

      Since the normal force on an incline is $F_N = mg \cos(\theta)$, we can express the maximum static friction and the kinetic friction specifically for an inclined plane.


      The kinetic friction force is given by:

      $$

      f_k = \mu_k F_N = \mu_k mg \cos(\theta)

      $$


      As the angle $\theta$ increases, the normal force decreases, which in turn causes the maximum available friction force to decrease. At the same time, the parallel component of gravity ($mg \sin(\theta)$) pulling the object down increases. Eventually, the parallel force overcomes static friction, and the object begins to slide.
    media: []
    check:
      id: q2
      type: multipleChoice
      prompt: For a block sliding down a rough inclined plane, which of the following expressions represents the kinetic friction force?
      choices:
      - id: a
        text: $\mu_k mg \sin(\theta)$
        media: []
        issueSignals: []
      - id: b
        text: $\mu_k mg \cos(\theta)$
        media: []
        issueSignals: []
      - id: c
        text: $\mu_k mg$
        media: []
        issueSignals: []
      - id: d
        text: $mg \cos(\theta) - \mu_k mg$
        media: []
        issueSignals: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        The formula for kinetic friction is $f_k = \mu_k F_N$. On an inclined plane, the normal force is $F_N = mg \cos(\theta)$. Substituting this in yields $f_k = \mu_k mg \cos(\theta)$.


        Why it works:

        Friction is proportional to how hard the surfaces are pressed together (the normal force). By decomposing gravity, we find the perpendicular pressing force is exactly $mg \cos(\theta)$.


        Why the other choices fail:

        - $\mu_k mg \sin(\theta)$: Uses the parallel component of gravity instead of the perpendicular component.

        - $\mu_k mg$: Assumes the normal force is equal to the full weight, which is only true on a horizontal surface.

        - $mg \cos(\theta) - \mu_k mg$: This mixes force components incorrectly and is not a friction equation.
