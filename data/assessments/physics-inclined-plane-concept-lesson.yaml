lesson:
  introduction: Forces on an Inclined Plane
  sections:
  - id: sec1
    title: Decomposing Gravity
    required: true
    content: |
      When an object rests on an inclined plane, gravity pulls straight down, but the surface pushes perpendicular to the plane. 
      To analyze the forces using Newton's Second Law, it is extremely useful to tilt our coordinate system so that the x-axis runs parallel to the incline, and the y-axis is perpendicular to it.
      
      By doing this, we must decompose the gravitational force $mg$ into two components:
      1. Parallel to the incline: $mg \sin(\theta)$
      2. Perpendicular to the incline: $mg \cos(\theta)$
    media:
      - type: image
        src: /media/physics/kinematics/inclined-plane-fbd.svg
        alt: "Free body diagram of a block on an inclined plane showing normal force, friction, and gravity."
        caption: "Figure 1: Notice how gravity (red) points straight down, but the Normal force (blue) and Friction (green) align with the tilted surface."
    views: []
    controls: []
    check:
      id: q1
      type: multipleChoice
      skills:
      - center-of-mass
      - kinematics-1d
      - universal-gravitation
      - friction-applications
      - newtons-laws-dynamics
      prompt: 'If the angle $\theta$ of the incline increases, what happens to the normal force $F_N$?'
      choices:
        - id: a
          text: 'It increases.'
        - id: b
          text: 'It decreases.'
        - id: c
          text: 'It remains the same.'
      answer:
        choiceId: b
      explanation: |
        Solution:
        Since the block does not accelerate perpendicular to the plane, $F_N = mg \cos(\theta)$. 
        As $\theta$ increases from 0 to 90 degrees, $\cos(\theta)$ decreases, meaning the normal force decreases.
        
        Why it works:
        The component of gravity pushing the block into the surface relies on the cosine function. A steeper angle means less gravitational force is directed into the surface and more is directed down the incline.
        
        Why the other choices fail:
        - It increases: The normal force would only increase if the plane were becoming flatter (approaching 0 degrees).
        - It remains the same: The normal force is strictly dependent on the angle and is not a constant value $mg$ unless the surface is perfectly horizontal.
  - id: sec2
    title: Friction on an Inclined Plane
    required: true
    content: |
      Friction always opposes the direction of relative motion (or intended motion) between the object and the surface.
      Since the normal force on an incline is $F_N = mg \cos(\theta)$, we can express the maximum static friction and the kinetic friction specifically for an inclined plane.
      
      The kinetic friction force is given by:
      $$
      f_k = \mu_k F_N = \mu_k mg \cos(\theta)
      $$
      
      As the angle $\theta$ increases, the normal force decreases, which in turn causes the maximum available friction force to decrease. At the same time, the parallel component of gravity ($mg \sin(\theta)$) pulling the object down increases. Eventually, the parallel force overcomes static friction, and the object begins to slide.
    media: []
    views: []
    controls: []
    check:
      id: q2
      type: multipleChoice
      skills:
      - newtons-laws-dynamics
      - friction-applications
      - normal-force
      prompt: 'For a block sliding down a rough inclined plane, which of the following expressions represents the kinetic friction force?'
      choices:
        - id: a
          text: '$\mu_k mg \sin(\theta)$'
        - id: b
          text: '$\mu_k mg \cos(\theta)$'
        - id: c
          text: '$\mu_k mg$'
        - id: d
          text: '$mg \cos(\theta) - \mu_k mg$'
      answer:
        choiceId: b
      explanation: |
        Solution:
        The formula for kinetic friction is $f_k = \mu_k F_N$. On an inclined plane, the normal force is $F_N = mg \cos(\theta)$. Substituting this in yields $f_k = \mu_k mg \cos(\theta)$.
        
        Why it works:
        Friction is proportional to how hard the surfaces are pressed together (the normal force). By decomposing gravity, we find the perpendicular pressing force is exactly $mg \cos(\theta)$.
        
        Why the other choices fail:
        - $\mu_k mg \sin(\theta)$: Uses the parallel component of gravity instead of the perpendicular component.
        - $\mu_k mg$: Assumes the normal force is equal to the full weight, which is only true on a horizontal surface.
        - $mg \cos(\theta) - \mu_k mg$: This mixes force components incorrectly and is not a friction equation.
  - id: sec3
    title: Acceleration Down an Incline
    required: true
    content: |
      We can determine the acceleration of an object on an inclined plane using Newton's Second Law for the axis parallel to the incline.
      
      Let the down-the-incline direction be positive. The forces acting along this axis are the parallel component of gravity (down the incline) and friction (up the incline, opposing motion).
      
      $$
      \Sigma F_{\parallel} = mg \sin(\theta) - f_k = ma
      $$
      
      Substituting the expression for kinetic friction ($f_k = \mu_k mg \cos(\theta)$):
      
      $$
      mg \sin(\theta) - \mu_k mg \cos(\theta) = ma
      $$
      
      Notice that the mass $m$ cancels out of every term! This means the acceleration of a block sliding down a uniform incline is independent of its mass:
      
      $$
      a = g(\sin(\theta) - \mu_k \cos(\theta))
      $$
    media: []
    views: []
    controls: []
    check:
      id: q3
      type: multipleChoice
      skills:
      - newtons-laws-dynamics
      - kinematics-1d
      - friction-applications
      prompt: 'If you place a heavier block made of the exact same material on the same rough inclined plane, how does its acceleration compare to a lighter block?'
      choices:
        - id: a
          text: 'The heavier block accelerates faster.'
        - id: b
          text: 'The heavier block accelerates slower.'
        - id: c
          text: 'They accelerate at the same rate.'
      answer:
        choiceId: c
      explanation: |
        Solution:
        The equation for acceleration is $a = g(\sin(\theta) - \mu_k \cos(\theta))$. Mass cancels out, so both blocks accelerate at the same rate.
        
        Why it works:
        While a heavier block has a greater gravitational force pulling it down the incline, it also experiences a proportionally greater normal force, which creates proportionally greater friction. Furthermore, its greater inertia exactly offsets the increased net force, resulting in the same acceleration.
        
        Why the other choices fail:
        - The heavier block accelerates faster: This incorrectly assumes that the greater downward force dominates without accounting for proportionally greater friction and inertia.
        - The heavier block accelerates slower: This incorrectly assumes increased friction or inertia outweighs the increased gravitational pull.
