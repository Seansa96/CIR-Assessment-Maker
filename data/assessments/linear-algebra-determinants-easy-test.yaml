questions:
  - id: et-det-formula-2x2
    type: multipleChoice
    prompt: |
      Which expression gives $\det \begin{bmatrix} a & b \\ c & d \end{bmatrix}$?
    choices:
      - id: c1
        text: '$ab - cd$'
      - id: c2
        text: '$ac - bd$'
      - id: c3
        text: '$ad - bc$'
      - id: c4
        text: '$a + d - (b + c)$'
    answer:
      choiceId: c3
    explanation: |
      The $2\times2$ determinant formula is $ad - bc$: the product of the main diagonal entries minus the product of the anti-diagonal entries.

  - id: et-row-op-effect
    type: multipleChoice
    prompt: |
      Suppose $\det(A) = 10$. What is $\det(B)$ if $B$ is formed by multiplying one row of $A$ by $-3$?
    choices:
      - id: c1
        text: '10'
      - id: c2
        text: '-30'
      - id: c3
        text: '30'
      - id: c4
        text: '-10'
    answer:
      choiceId: c2
    explanation: |
      Multiplying a single row by $-3$ multiplies the determinant by $-3$. So $\det(B) = -3 \times 10 = -30$.

  - id: et-triangular-compute
    type: numericResponse
    prompt: |
      Compute $\det \begin{bmatrix} -2 & 0 & 0 \\ 5 & 3 & 0 \\ -1 & 7 & -1 \end{bmatrix}$.
    answer:
      value: 6
      tolerance: 0
    explanation: |
      Lower-triangular matrix: $\det = (-2)(3)(-1) = 6$.

  - id: et-invertible-check
    type: multipleChoice
    prompt: |
      Which of the following statements is equivalent to "$A$ is invertible"?
    choices:
      - id: c1
        text: '$\det(A) = 1$'
      - id: c2
        text: '$\det(A) = 0$'
      - id: c3
        text: '$\det(A) \neq 0$'
      - id: c4
        text: '$\det(A) > 0$'
    answer:
      choiceId: c3
    explanation: |
      A square matrix is invertible (nonsingular) if and only if its determinant is **nonzero** — not just positive, and specifically not zero.

  - id: et-cofactor-sign
    type: multipleChoice
    prompt: |
      In the cofactor $C_{ij} = (-1)^{i+j} M_{ij}$, what is the sign of the cofactor $C_{23}$?
    choices:
      - id: c1
        text: 'Positive ($+$)'
      - id: c2
        text: 'Negative ($-$)'
      - id: c3
        text: 'Zero'
      - id: c4
        text: 'It depends on the matrix entries.'
    answer:
      choiceId: c2
    explanation: |
      $C_{23}$: $(-1)^{2+3} = (-1)^5 = -1$. The cofactor sign at position $(2,3)$ is always negative, regardless of the matrix values. The matrix values determine $M_{23}$, but the sign factor is purely positional.
