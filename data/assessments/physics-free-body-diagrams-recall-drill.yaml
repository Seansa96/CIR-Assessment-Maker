items:
  - { id: fr1, type: cloze, prompt: 'A free-body diagram includes ____ forces on the selected system.', answer: { expected: external, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Insert external.\n\nWhy it works: Forces from the surroundings determine the system motion.', tags: [FBD] }
  - { id: fr2, type: typed, prompt: 'What force acts perpendicular to a contact surface?', answer: { expected: 'normal force', expectedLatex: 'N', aliases: [normal], media: [] }, explanation: 'Solution: The normal force.\n\nWhy it works: It is defined perpendicular to the surface.', tags: [contact] }
  - { id: fr3, type: cloze, prompt: 'Weight near Earth has magnitude $mg$ and points ____.', answer: { expected: downward, expectedLatex: '', aliases: ['down'], media: [] }, explanation: 'Solution: Insert downward.\n\nWhy it works: Gravity pulls toward Earth''s center.', tags: [weight] }
  - { id: fr4, type: typed, prompt: 'What force is transmitted along a taut string?', answer: { expected: tension, expectedLatex: 'T', aliases: [], media: [] }, explanation: 'Solution: It is tension.\n\nWhy it works: A taut string pulls along its length.', tags: [tension] }
  - { id: fr5, type: cloze, prompt: 'A chosen ____ separates the system from surroundings.', answer: { expected: boundary, expectedLatex: '', aliases: ['system boundary'], media: [] }, explanation: 'Solution: Insert boundary.\n\nWhy it works: The boundary determines which interactions are external.', tags: [system] }
  - { id: fr6, type: typed, prompt: 'What law relates net force and acceleration?', answer: { expected: 'newtons second law', expectedLatex: '\sum F=ma', aliases: ['Newton''s second law'], media: [] }, explanation: 'Solution: Newton''s second law.\n\nWhy it works: It states $\sum F=ma$.', tags: [law] }
