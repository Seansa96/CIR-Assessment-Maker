lesson:
  introduction: This lesson develops Interference of Waves from a diagram, a mathematical model, and a
    calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      When two or more waves overlap in the same medium, they do not bounce off each other; they pass through each other. The physical principle governing this interaction is the principle of superposition, which dictates that the net displacement of the medium is the sum of the individual displacements.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The most critical quantity in interference is the phase difference $\Delta\phi$ between the two interacting waves. This phase difference can arise from a difference in path length $\Delta x$, a difference in emission time, or an inherent phase shift at the source.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
  - id: s3
    title: Mathematical model
    content: >-
      Mathematically, if $y_1 = A\sin(kx - \omega t)$ and $y_2 = A\sin(kx - \omega t + \Delta\phi)$, the superposition is $y_{\text{net}} = y_1 + y_2$. We assume the waves have identical amplitude and frequency to simplify the analysis of pure interference.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
  - id: s4
    title: Calculus connection
    content: >-
      Using the trigonometric sum-to-product identity $\sin(\alpha) + \sin(\beta) = 2\sin(\frac{\alpha+\beta}{2})\cos(\frac{\alpha-\beta}{2})$, we can add $y_1$ and $y_2$ algebraically.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
  - id: s5
    title: Derivation or justification
    content: >-
      Applying the identity, we derive $y_{\text{net}} = \left[2A \cos\left(\frac{\Delta\phi}{2}\right)\right] \sin\left(kx - \omega t + \frac{\Delta\phi}{2}\right)$. The resulting wave is a sinusoidal traveling wave with the same frequency and speed, but its amplitude is modulated by the factor $2A \cos(\Delta\phi/2)$.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, constructive interference ($\Delta\phi = 0, 2\pi, \dots$) yields a wave with double the amplitude ($2A$). Destructive interference ($\Delta\phi = \pi, 3\pi, \dots$) perfectly flattens the wave to zero amplitude, as the crests of one wave perfectly align with the troughs of the other.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
  - id: s7
    title: Quantitative strategy
    content: >-
      A powerful quantitative strategy is relating path length difference $\Delta x$ to phase difference $\Delta\phi$. Since one full wavelength $\lambda$ corresponds to a phase change of $2\pi$, the proportion is $\frac{\Delta\phi}{2\pi} = \frac{\Delta x}{\lambda}$. Setting $\Delta x = n\lambda$ gives constructive interference; $\Delta x = (n + 0.5)\lambda$ gives destructive.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: Energy is proportional to amplitude squared. In constructive interference, amplitude doubles, so energy quadruples in that region. This doesn't violate conservation of energy because the energy is exactly zero in regions of destructive interference. The energy is simply redistributed spatially.
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
