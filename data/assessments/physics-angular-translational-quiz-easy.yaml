questions:
- id: q1
  type: numericResponse
  prompt: A point on the rim of a $0.5 \text{ m}$ radius wheel has an angular velocity
    of $10 \text{ rad/s}$. What is its tangential speed ($v_t$) in m/s?
  answer:
    value: 5.0
    tolerance: 0.1
  explanation: $v_t = r\omega = 0.5 \times 10 = 5.0 \text{ m/s}$.
