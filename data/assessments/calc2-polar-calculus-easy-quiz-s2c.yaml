authoring: { visualRequirement: required, visualRationale: 'Polar area and length depend on region geometry.', difficultyTier: easy, sourceId: src-20260719182540-a40fdcd443 }
questions:
  - { id: q001, type: multipleChoice, prompt: 'Find the area inside $r=2$ on $0\le\theta\le\pi/2$.', choices: [{ id: a, text: pi }, { id: b, text: 'pi/2' }, { id: c, text: '2pi' }, { id: d, text: 4 }], answer: { choiceId: a }, explanation: 'Solution: One half times integral of 4 from zero to pi/2 equals pi. Why it works: This is a constant-radius sector. Common trap: Omitting the one-half. Why the other choices fail: They use an incorrect sector factor or unit.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Builds and evaluates a constant-radius sector model.' }
  - { id: q002, type: multipleChoice, prompt: 'What is the polar area element?', choices: [{ id: a, text: '$\frac12r^2d\theta$' }, { id: b, text: '$r\,d\theta$' }, { id: c, text: '$r prime\,d\theta$' }, { id: d, text: '$dxdy$' }], answer: { choiceId: a }, explanation: 'Solution: The area element is one half r squared d theta. Why it works: It is the area of a differential sector. Common trap: Using circular arc length. Why the other choices fail: They omit the radius square or describe another differential.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Identifies the sector-area differential.' }
  - { id: q003, type: multipleChoice, prompt: 'For area between two polar curves, use:', choices: [{ id: a, text: '$\frac12\int(r_o^2-r_i^2)d\theta$' }, { id: b, text: '$\int(r_o-r_i)^2d\theta$' }, { id: c, text: '$\int r\,d\theta$' }, { id: d, text: '$\int dy/dx$' }], answer: { choiceId: a }, explanation: 'Solution: Subtract outer and inner sector areas. Why it works: Area is proportional to radius squared. Common trap: Squaring radial thickness. Why the other choices fail: They use incorrect geometric quantities.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Selects annular-sector subtraction.' }
  - { id: q004, type: multipleChoice, prompt: 'Which formula gives polar arc length?', choices: [{ id: a, text: '$\int\sqrt{r^2+(dr/d\theta)^2}\,d\theta$' }, { id: b, text: '$\frac12\int r^2d\theta$' }, { id: c, text: '$\int r d\theta$ always' }, { id: d, text: '$\int ydx$' }], answer: { choiceId: a }, explanation: 'Solution: Polar length includes radius and radial-rate contributions. Why it works: Both turning and radial movement make distance. Common trap: Using the area formula. Why the other choices fail: They omit radial change or measure another quantity.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Identifies the polar path-length model.' }
  - { id: q005, type: multipleChoice, prompt: 'For $r=2\theta$, what is dr/dtheta?', choices: [{ id: a, text: 2 }, { id: b, text: theta }, { id: c, text: '$2\theta^2$' }, { id: d, text: 0 }], answer: { choiceId: a }, explanation: 'Solution: The derivative of 2 theta is 2. Why it works: Radius is linear in theta. Common trap: Repeating the original radius. Why the other choices fail: They are incorrect derivatives.', difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: 'Differentiates a radius function.' }
  - { id: q006, type: multipleChoice, prompt: 'What must be checked in addition to equal-radius solutions for polar intersections?', choices: [{ id: a, text: the pole }, { id: b, text: only maximum radius }, { id: c, text: only slope }, { id: d, text: no other point }], answer: { choiceId: a }, explanation: 'Solution: Check whether each curve passes through the pole. Why it works: The pole has many polar angle names. Common trap: Assuming equality at one theta finds all intersections. Why the other choices fail: They do not address polar-coordinate nonuniqueness.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Adds a pole case to an intersection procedure.' }
  - { id: q007, type: multipleChoice, prompt: 'For a region inside both curves, use which radius?', choices: [{ id: a, text: smaller }, { id: b, text: larger }, { id: c, text: sum }, { id: d, text: difference }], answer: { choiceId: a }, explanation: 'Solution: Points inside both must lie within the smaller radial boundary. Why it works: Both inequalities must hold. Common trap: Using outer-minus-inner. Why the other choices fail: They describe between-curves or unrelated regions.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Translates overlap wording into a radial-boundary choice.' }
  - { id: q008, type: multipleChoice, prompt: '![Polar region](/media/calculus/polar-review-loop-sector.svg) What usually supplies loop bounds?', choices: [{ id: a, text: consecutive zeros of r }, { id: b, text: random sample angles }, { id: c, text: only the maximum radius }, { id: d, text: the Cartesian y-intercept }], answer: { choiceId: a }, explanation: 'Solution: Consecutive relevant zeros place the path at the pole and often bound a loop. Why it works: They identify loop endpoints in the trace. Common trap: Using a full period automatically. Why the other choices fail: They do not reliably delimit a loop.', difficultyDimensions: [domainCondition, representationTransfer], difficultyEvidence: 'Uses a visual loop model and r-zero condition to choose bounds.' }
  - { id: q009, type: freeResponse, prompt: 'Set up the area between r equals 2 and r equals theta on zero to one.', answer: { gradingMode: selfCheck, keyPoints: ['one half integral zero to one', 'four minus theta squared'] }, explanation: 'Solution: $A=\frac12\int_0^1(4-\theta^2)d\theta$. Why it works: On the given interval 2 is outer and theta is inner. Common trap: Squaring 2 minus theta.', difficultyDimensions: [modelOrDerivation, simplification], difficultyEvidence: 'Compares stated radii and forms an annular-sector setup.' }
  - { id: q010, type: multipleChoice, prompt: 'What units does a polar arc length have if r is measured in meters?', choices: [{ id: a, text: meters }, { id: b, text: square meters }, { id: c, text: cubic meters }, { id: d, text: unitless }], answer: { choiceId: a }, explanation: 'Solution: Arc length is a distance, so it has meters. Why it works: The speed-like integrand has distance per radian and d theta is dimensionless. Common trap: Using area units because polar coordinates are involved. Why the other choices fail: They describe other quantities.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Uses units to identify the accumulated geometric quantity.' }
