title: 'Deflection of a Proton Between Parallel Capacitor Plates'
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-electric-charges-fields
modeDefault: practice
randomizeQuestions: false
questions: []
workedExamples:
- id: parallel-plate-deflection-we1
  title: Track a proton through a uniform capacitor field
  problem: |
    A proton enters midway between two horizontal, parallel capacitor plates with an initial velocity purely to the right, $v_{0x}=2.00\times10^6\,\mathrm{m/s}$ and $v_{0y}=0$. The uniform electric field between the plates is $E=4.00\times10^3\,\mathrm{N/C}$ downward. The field region has horizontal length $L=0.100\,\mathrm m$ and the plate separation is $4.00\,\mathrm{cm}$. Use $q_p=+1.60\times10^{-19}\,\mathrm C$ and $m_p=1.67\times10^{-27}\,\mathrm{kg}$. Ignore gravity and edge effects.

    Determine the proton's force and acceleration, its velocity at the exit, its speed immediately after exiting, and the direction of that velocity relative to the $+x$-axis.
  steps:
  - id: parallel-plate-deflection-s1
    title: Establish the force and acceleration
    instruction: |
      Identify the electric field magnitude $E$ and proton charge $q_p$, then calculate the electric force magnitude with $F=|q_p|E$. Use the proton mass $m_p$ and Newton's second law, $a=F/m_p$, to calculate the acceleration magnitude; use the charge sign and field direction to state whether both vectors point upward or downward.
    hint: For a positive charge, the electric force points in the same direction as the electric field. Use $F=|q_p|E$ and $a=F/m_p$ for magnitudes.
    type: multipleChoice
    prompt: |
      Which force-and-acceleration result is correct for the proton?
    choices:
    - id: a
      text: '$F=6.40\times10^{-16}\,\mathrm N$ downward and $a=3.84\times10^{11}\,\mathrm{m/s^2}$ downward'
    - id: b
      text: '$F=6.40\times10^{-16}\,\mathrm N$ upward and $a=3.84\times10^{11}\,\mathrm{m/s^2}$ upward'
      issueSignals: [{ id: physics2-positive-charge-force-reversal, domains: [physics-2] }]
    - id: c
      text: '$F=2.50\times10^{22}\,\mathrm N$ downward and $a=1.50\times10^{49}\,\mathrm{m/s^2}$ downward'
      issueSignals: [{ id: physics2-field-force-division-error, domains: [physics-2] }]
    - id: d
      text: '$F=6.40\times10^{-16}\,\mathrm N$ downward and $a=9.58\times10^{-9}\,\mathrm{m/s^2}$ downward'
      issueSignals: [{ id: physics2-force-mass-ratio-inversion, domains: [physics-2] }]
    answer: { choiceId: a }
    explanation: |
      Solution: The proton has $q_p>0$, so the electric force points downward, along the electric field. Its force magnitude is

      $$
      F=q_pE=(1.60\times10^{-19})(4.00\times10^3)=6.40\times10^{-16}\,\mathrm N.
      $$

      Newton's second law gives

      $$
      a_y=-\frac{F}{m_p}=-\frac{6.40\times10^{-16}}{1.67\times10^{-27}}=-3.83\times10^{11}\,\mathrm{m/s^2},
      $$

      which rounds to $3.84\times10^{11}\,\mathrm{m/s^2}$ downward. Why it works: The field supplies a constant downward force, and dividing that force by the proton mass gives its constant acceleration. Why the other choices fail: b reverses the force for a positive charge; c divides by the field or mass incorrectly and produces impossible scales; d uses $m/F$ rather than $F/m$.
    media:
    - type: image
      src: /media/physics2/parallel-plate-deflection.svg
      alt: Original diagram of a proton entering between positive and negative parallel plates, with downward electric-field arrows and a curved downward path.
      caption: The field, force, and acceleration point downward; the initial velocity points right.
  - id: parallel-plate-deflection-s2
    title: Find the time inside the field
    instruction: |
      Identify the field-region length $L$ and unchanged horizontal speed $v_x$. Use the constant-horizontal-motion relation $L=v_xt$ and solve it for the transit time $t=L/v_x$.
    hint: The electric field changes the vertical motion, but there is no horizontal force, so $v_x$ stays constant.
    type: multipleChoice
    prompt: What time does the proton spend between the plates?
    choices:
    - id: a
      text: '$5.00\times10^{-8}\,\mathrm s$'
    - id: b
      text: '$2.00\times10^{-7}\,\mathrm s$'
      issueSignals: [{ id: physics2-transit-time-reciprocal, domains: [physics-2] }]
    - id: c
      text: '$2.00\times10^5\,\mathrm s$'
      issueSignals: [{ id: physics2-transit-time-unit-conversion, domains: [physics-2] }]
    - id: d
      text: '$1.25\times10^{-8}\,\mathrm s$'
      issueSignals: [{ id: physics2-transit-time-field-factor, domains: [physics-2] }]
    answer: { choiceId: a }
    explanation: |
      Solution: The field region extends $L=0.100\,\mathrm m$ in the $x$ direction. Because the electric force is vertical, $v_x=v_{0x}=2.00\times10^6\,\mathrm{m/s}$ is constant. Therefore,

      $$
      t=\frac{L}{v_x}=\frac{0.100}{2.00\times10^6}=5.00\times10^{-8}\,\mathrm s.
      $$

      Why it works: Horizontal and vertical components can be solved independently; the horizontal component determines when the proton reaches the exit. Why the other choices fail: b uses a reciprocal or an extra factor of four, c ignores the seconds-per-meter relationship, and d divides by an unrelated field factor instead of using $L/v_x$.
  - id: parallel-plate-deflection-s3
    title: Build the exit velocity vector
    instruction: |
      Calculate both exit velocity components: use $v_x=v_{0x}$ because $a_x=0$, and use $v_y=v_{0y}+a_yt$ with the acceleration $a_y$ and transit time $t$ from the previous steps. Then report the signed velocity components.
    hint: Take upward as $+y$, so the downward acceleration from step 1 is negative.
    type: multipleChoice
    prompt: Which velocity vector does the proton have at the instant it leaves the field region?
    choices:
    - id: a
      text: '$\mathbf v_{\mathrm{exit}}=(2.00\times10^6\,\hat i-1.92\times10^4\,\hat j)\,\mathrm{m/s}$'
    - id: b
      text: '$\mathbf v_{\mathrm{exit}}=(1.92\times10^4\,\hat i-2.00\times10^6\,\hat j)\,\mathrm{m/s}$'
      issueSignals: [{ id: physics2-velocity-component-swap, domains: [physics-2] }]
    - id: c
      text: '$\mathbf v_{\mathrm{exit}}=(2.00\times10^6\,\hat i+1.92\times10^4\,\hat j)\,\mathrm{m/s}$'
      issueSignals: [{ id: physics2-vertical-velocity-sign-error, domains: [physics-2] }]
    - id: d
      text: '$\mathbf v_{\mathrm{exit}}=(2.00\times10^6\,\hat i-3.84\times10^{11}\,\hat j)\,\mathrm{m/s}$'
      issueSignals: [{ id: physics2-acceleration-as-velocity-error, domains: [physics-2] }]
    answer: { choiceId: a }
    explanation: |
      Solution: In the horizontal direction, $a_x=0$, so $v_x=v_{0x}=2.00\times10^6\,\mathrm{m/s}$. In the vertical direction,

      $$
      v_y=v_{0y}+a_yt=0+(-3.84\times10^{11})(5.00\times10^{-8})=-1.92\times10^4\,\mathrm{m/s}.
      $$

      Thus the exit velocity has components $v_x=2.00\times10^6\,\mathrm{m/s}$ and $v_y=-1.92\times10^4\,\mathrm{m/s}$. Why it works: The field provides a vertical impulse only, so the horizontal component is unchanged while the vertical component grows downward from zero. Why the other choices fail: b swaps the component roles; c gives a positive vertical component despite downward acceleration; d reports acceleration without multiplying by the time interval.
    media:
    - type: image
      src: /media/physics2/parallel-plate-exit-velocity.svg
      alt: Original right-triangle diagram showing horizontal and downward velocity components and their resultant exit velocity.
      caption: The exit velocity is the vector sum of the unchanged horizontal component and the downward vertical component.
  - id: parallel-plate-deflection-s4
    title: Check the vertical clearance
    instruction: |
      Identify the initial vertical velocity $v_{0y}$, vertical acceleration $a_y$, and transit time $t$. Use $\Delta y=v_{0y}t+\tfrac12a_yt^2$ to calculate the signed vertical displacement, then compare $|\Delta y|$ with the $2.00\,\mathrm{cm}$ clearance from the midpoint to the lower plate.
    hint: Starting from the midpoint means the available downward clearance is $2.00\,\mathrm{cm}$. Use $\Delta y=\tfrac12a_yt^2$ because $v_{0y}=0$.
    type: multipleChoice
    prompt: Which displacement and clearance conclusion is correct?
    choices:
    - id: a
      text: '$\Delta y=-4.80\times10^{-4}\,\mathrm m$; the proton remains between the plates'
    - id: b
      text: '$\Delta y=-1.92\times10^{-2}\,\mathrm m$; the proton strikes the lower plate'
      issueSignals: [{ id: physics2-displacement-time-power-error, domains: [physics-2] }]
    - id: c
      text: '$\Delta y=+4.80\times10^{-4}\,\mathrm m$; the proton moves upward but remains between the plates'
      issueSignals: [{ id: physics2-displacement-direction-error, domains: [physics-2] }]
    - id: d
      text: '$\Delta y=-9.60\times10^{-4}\,\mathrm m$; the proton remains between the plates'
      issueSignals: [{ id: physics2-displacement-half-factor-error, domains: [physics-2] }]
    answer: { choiceId: a }
    explanation: |
      Solution: Measure $y$ upward from the entry line. Since $v_{0y}=0$,

      $$
      \Delta y=\frac12a_yt^2=\frac12(-3.84\times10^{11})(5.00\times10^{-8})^2=-4.80\times10^{-4}\,\mathrm m.
      $$

      The proton starts $2.00\,\mathrm{cm}=2.00\times10^{-2}\,\mathrm m$ above the lower plate, while the downward deflection is only $0.0480\,\mathrm{cm}$. It therefore remains between the plates. Why it works: The clearance check uses the displacement, not the final vertical speed, and the negative sign records downward motion. Why the other choices fail: b treats the time dependence as linear or uses the wrong scale; c reverses the direction; d omits the factor of one-half.
  - id: parallel-plate-deflection-s5
    title: Find the speed just after exit
    instruction: |
      Use the exit components $v_x$ and $v_y$ from Step 3. Apply the Pythagorean magnitude formula $v=\sqrt{v_x^2+v_y^2}$ to calculate the speed at the boundary, then explain why the same speed applies immediately after exit.
    hint: Use $v=\sqrt{v_x^2+v_y^2}$. At the idealized exit boundary, the velocity is continuous even though the electric force ends.
    type: multipleChoice
    prompt: What is the proton's speed immediately after it exits the field?
    choices:
    - id: a
      text: '$2.0009\times10^6\,\mathrm{m/s}$ (about $2.00\times10^6\,\mathrm{m/s}$)'
    - id: b
      text: '$2.0192\times10^6\,\mathrm{m/s}$'
      issueSignals: [{ id: physics2-speed-component-addition, domains: [physics-2] }]
    - id: c
      text: '$1.9808\times10^6\,\mathrm{m/s}$'
      issueSignals: [{ id: physics2-speed-vertical-subtraction, domains: [physics-2] }]
    - id: d
      text: '$3.84\times10^{11}\,\mathrm{m/s}$'
      issueSignals: [{ id: physics2-speed-uses-acceleration, domains: [physics-2] }]
    answer: { choiceId: a }
    explanation: |
      Solution: The exit components are $v_x=2.00\times10^6\,\mathrm{m/s}$ and $v_y=-1.92\times10^4\,\mathrm{m/s}$. The speed is the vector magnitude:

      $$
      v_{\mathrm{exit}}=\sqrt{(2.00\times10^6)^2+(-1.92\times10^4)^2}=2.00092\times10^6\,\mathrm{m/s}.
      $$

      The field stops acting after the boundary, but velocity does not jump; therefore this is also the speed immediately after exit. Why it works: Perpendicular components combine through the Pythagorean theorem, and the small vertical component increases the speed slightly. Why the other choices fail: b adds perpendicular components as scalars; c subtracts them; d confuses acceleration with velocity.
    media:
    - type: image
      src: /media/physics2/parallel-plate-exit-velocity.svg
      alt: Original velocity-component triangle for calculating the proton's resultant speed after leaving the plates.
      caption: Use the component triangle to take the magnitude of the exit velocity.
  - id: parallel-plate-deflection-s6
    title: Determine the direction angle
    instruction: |
      Use the exit components $v_x$ and $v_y$ to calculate the direction angle measured from $+x$. Apply $\tan\theta=|v_y|/v_x$, evaluate $\theta=\tan^{-1}(|v_y|/v_x)$ in degrees, and use the sign of $v_y$ to label the angle as above or below the axis.
    hint: The angle is measured from $+x$, so $\tan\theta=|v_y|/v_x$ and the negative $v_y$ determines that the angle is below the axis.
    type: multipleChoice
    prompt: Which direction best describes the proton's velocity immediately after leaving the plates?
    choices:
    - id: a
      text: '$0.550^\circ$ below the $+x$-axis'
    - id: b
      text: '$0.550^\circ$ above the $+x$-axis'
      issueSignals: [{ id: physics2-angle-sign-reversal, domains: [physics-2] }]
    - id: c
      text: '$89.45^\circ$ below the $+x$-axis'
      issueSignals: [{ id: physics2-angle-reference-complement, domains: [physics-2] }]
    - id: d
      text: '$1.10^\circ$ below the $+x$-axis'
      issueSignals: [{ id: physics2-angle-double-counting, domains: [physics-2] }]
    answer: { choiceId: a }
    explanation: |
      Solution: Relative to the $+x$ direction,

      $$
      \tan\theta=\frac{|v_y|}{v_x}=\frac{1.92\times10^4}{2.00\times10^6}=9.60\times10^{-3},
      $$

      so

      $$
      \theta=\tan^{-1}(9.60\times10^{-3})=0.550^\circ.
      $$

      Because $v_y$ is negative, the direction is $0.550^\circ$ below the $+x$-axis. Outside the plates the proton continues in a straight line at this velocity if other forces remain negligible. Why it works: Tangent compares the perpendicular and parallel velocity components, while the component sign supplies the quadrant/direction. Why the other choices fail: b reverses the signed vertical component; c uses the complementary angle measured from the vertical; d doubles the already-complete component ratio.
    media:
    - type: image
      src: /media/physics2/parallel-plate-exit-velocity.svg
      alt: Original vector triangle labeling the small angle below the positive x-axis and the tangent ratio of velocity components.
      caption: The downward component makes the exit direction slightly below +x.
