glossary:
  introduction: Review the essential terms below. Once you understand them, test your
    knowledge using the recall drills.
  sections:
  - id: sec-physics-torque-recall
    title: Core Terminology
    entries:
    - id: entry-torque
      term: Torque ($\tau$)
      definition: The rotational equivalent of force, a measure of the effectiveness
        of a force in producing rotation. $\vec{\tau} = \vec{r} \times \vec{F}$.
      drills:
      - id: drill-torque-1
        prompt: The rotational equivalent of force is called ________.
        type: typed
        answer:
          expected: torque
    - id: entry-lever-arm
      term: Lever Arm ($r_{\perp}$)
      definition: The perpendicular distance from the axis of rotation to the line
        of action of the force. $\tau = r_{\perp} F$.
      drills:
      - id: drill-lever-arm
        prompt: The perpendicular distance from the pivot to the line of force is
          the ________ arm.
        type: typed
        answer:
          expected: lever
