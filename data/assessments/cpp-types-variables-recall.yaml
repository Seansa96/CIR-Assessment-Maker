schemaVersion: 1
id: cpp-types-variables-recall
title: C++ Types and Variables Recall
assessmentType: recallDrill
categoryId: c++
subcategoryId: c++-types-and-variables
subcategoryIds:
  - c++-types-and-variables
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'Which primitive type holds a single-precision floating point number?'
    answer:
      expected: float
  - id: r002
    type: typed
    prompt: 'Which primitive type is typically used for most decimal numbers?'
    answer:
      expected: double
  - id: r003
    type: typed
    prompt: 'Which keyword deduces a variable''s type from its initializer?'
    answer:
      expected: auto
  - id: r004
    type: typed
    prompt: 'Which keyword marks a variable as read-only after initialization?'
    answer:
      expected: const
  - id: r005
    type: typed
    prompt: 'What operator sends output to std::cout?'
    answer:
      expected: "<<"
      aliases:
        - insertion operator
  - id: r006
    type: typed
    prompt: 'What operator reads input from std::cin?'
    answer:
      expected: ">>"
      aliases:
        - extraction operator
  - id: r007
    type: typed
    prompt: 'Which string function reads an entire line including spaces?'
    answer:
      expected: getline
      aliases:
        - std::getline
        - getline()
  - id: r008
    type: typed
    prompt: 'Which standard header is required for console I/O?'
    answer:
      expected: <iostream>
      aliases:
        - iostream
  - id: r009
    type: typed
    prompt: 'Which primitive type holds a true/false value?'
    answer:
      expected: bool
  - id: r010
    type: typed
    prompt: 'Which standard manipulator inserts a newline and flushes the stream?'
    answer:
      expected: endl
      aliases:
        - std::endl
