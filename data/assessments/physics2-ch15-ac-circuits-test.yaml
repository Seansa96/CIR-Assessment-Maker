questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - multi-step
  prompt: An RLC series circuit has a resistance of $40\text{ }\Omega$, an inductive
    reactance of $60\text{ }\Omega$, and a capacitive reactance of $30\text{ }\Omega$.
    What is the total impedance $Z$ of the circuit (in Ohms)?
  answer:
    numericValue: 50
    tolerance: 0.1
  explanation: 'Solution:

    1) Formula for impedance: $Z = \sqrt{R^2 + (X_L - X_C)^2}$.

    2) Substitute values: $Z = \sqrt{40^2 + (60 - 30)^2}$.

    3) Calculate: $Z = \sqrt{1600 + 30^2} = \sqrt{1600 + 900} = \sqrt{2500} = 50\text{
    }\Omega$.


    Why it works:

    The reactances partially cancel each other out ($180^\circ$ out of phase), and
    their net difference forms a right triangle with the resistance in the complex
    plane.'
