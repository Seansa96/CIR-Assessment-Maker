workedExamples:
- id: we-shm-energy
  title: Deriving and applying Energy in Simple Harmonic Motion
  problem: Use the labeled model to derive and calculate the total energy from $E=\tfrac12 kA^2$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Analyze the system to determine the maximum displacement (amplitude). The problem asks for the total energy of a block-spring system.
    prompt: 'Identify the parameters needed for total energy.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Spring constant $k$ and amplitude $A$.'
    explanation: >-
      The total energy in SHM depends entirely on the spring constant $k$ and the amplitude $A$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the conservation assumption critical to this calculation.
    prompt: 'What energy assumption is made?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Mechanical energy is conserved.'
    explanation: >-
      We assume there are no non-conservative forces like friction, meaning mechanical energy is strictly conserved.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable for this analysis.
    prompt: 'Name the target variable.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Total energy $E$'
    explanation: >-
      We are looking for the total mechanical energy $E$ of the system.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the equation for total mechanical energy in terms of the maximum displacement.
    prompt: 'Write the governing energy relation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'E = \frac{1}{2}kA^2'
    explanation: >-
      At maximum displacement $x=A$, the velocity is zero, so $E = U_{\text{max}} = \frac{1}{2}kA^2$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variable $E$. In this case, the equation $E = \frac{1}{2}kA^2$ is already solved for the target.
    prompt: 'Isolate $E$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'E = \frac{1}{2}kA^2'
    explanation: >-
      The formula is already isolated: $E = \frac{1}{2}kA^2$.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Suppose a spring with $k = 200.0$ N/m is compressed by $A = 0.10$ m. Calculate the total energy $E$.
    prompt: 'Calculate $E$ in Joules.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      value: 0.81
      tolerance: 0.008100000000000001
    explanation: >-
      Substitute the values: $E = \frac{1}{2}(200.0)(0.10)^2 = 100.0(0.01) = 1.0$ J.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Perform a dimensional analysis to verify the units of $\frac{1}{2}kA^2$.
    prompt: 'Check the units.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'N/m * m^2 = N*m = Joules'
    explanation: >-
      The units of $k$ are N/m, and $A^2$ is $\text{m}^2$. Multiplying them gives $\text{N}\cdot\text{m}$, which is equivalent to Joules (J).
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated energy for the system.
    prompt: 'What is the final energy $E$?'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      value: 0.81
      tolerance: 0.008100000000000001
    explanation: >-
      The total energy is $1.0$ J.
