workedExamples:
- id: we-shm-energy
  title: Deriving and applying Energy in Simple Harmonic Motion
  problem: Use the labeled model to derive and calculate the total energy from $E=\tfrac12 kA^2$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Analyze the system to determine the maximum displacement (amplitude). The problem asks for the total energy of a block-spring system.
    prompt: Identify the parameters needed for total energy.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Spring constant $k$ and amplitude $A$.
    explanation: 'Solution: The total energy in SHM depends entirely on the spring constant $k$ and the amplitude $A$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the conservation assumption critical to this calculation.
    prompt: What energy assumption is made?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Mechanical energy is conserved.
    explanation: 'Solution: We assume there are no non-conservative forces like friction, meaning mechanical energy is strictly conserved.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the target variable for this analysis.
    prompt: Name the target variable.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total energy $E$
    explanation: 'Solution: We are looking for the total mechanical energy $E$ of the system.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the equation for total mechanical energy in terms of the maximum displacement.
    prompt: Write the governing energy relation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - E = \frac{1}{2}kA^2
    explanation: 'Solution: At maximum displacement $x=A$, the velocity is zero, so $E = U_{\text{max}} = \frac{1}{2}kA^2$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the target variable $E$. In this case, the equation $E = \frac{1}{2}kA^2$ is already solved for the target.
    prompt: Isolate $E$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - E = \frac{1}{2}kA^2
    explanation: 'Solution: The formula is already isolated: $E = \frac{1}{2}kA^2$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Suppose a spring with $k = 200.0$ N/m is compressed by $A = 0.10$ m. Calculate the total energy $E$.
    prompt: Calculate $E$ in Joules.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      value: 0.81
      tolerance: 0.008100000000000001
    explanation: 'Solution: Substitute the values: $E = \frac{1}{2}(200.0)(0.10)^2 = 100.0(0.01) = 1.0$ J.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Perform a dimensional analysis to verify the units of $\frac{1}{2}kA^2$.
    prompt: Check the units.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - N/m * m^2 = N*m = Joules
    explanation: 'Solution: The units of $k$ are N/m, and $A^2$ is $\text{m}^2$. Multiplying them gives $\text{N}\cdot\text{m}$, which is equivalent to Joules (J).


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated energy for the system.
    prompt: What is the final energy $E$?
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    answer:
      value: 0.81
      tolerance: 0.008100000000000001
    explanation: 'Solution: The total energy is $1.0$ J.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
- id: shm-energy-we002
  title: Kinetic Energy Away From Equilibrium
  problem: A spring with $k=100\ \text{N/m}$ oscillates with amplitude $0.20\ \text{m}$. Find the kinetic energy when its displacement is $0.12\ \text{m}$.
  steps:
  - id: shm-energy-we002-step-1
    title: Calculate total energy
    type: numericResponse
    prompt: What is the total energy in joules?
    answer: {value: 2, tolerance: 0.01}
    explanation: 'Solution: $E=\frac12kA^2=\frac12(100)(0.20)^2=2.0\ \text{J}$. Why it works: at amplitude all energy is spring potential energy.'
  - id: shm-energy-we002-step-2
    title: Subtract the potential energy
    type: numericResponse
    prompt: What is the kinetic energy at $x=0.12\ \text{m}$ in joules?
    answer: {value: 1.28, tolerance: 0.01}
    explanation: 'Solution: $U=\frac12(100)(0.12)^2=0.72\ \text{J}$, so $K=E-U=1.28\ \text{J}$. Why it works: total mechanical energy is conserved in the ideal oscillator.'
