questions:
  - { id: q001, type: freeResponse, prompt: 'A disinfectant is 3.20% m/m NaClO. How many grams NaClO are present in a 425 g bottle? Show the concentration relation and units.', answer: { gradingMode: selfCheck, keyPoints: ['0.0320', '425 g', '13.6 g NaClO'] }, explanation: 'Solution: Convert 3.20% to 0.0320, then multiply: $(0.0320)(425\ \mathrm g)=13.6\ \mathrm g$ NaClO. Why it works: Mass percent is a solute-to-total-solution mass ratio. Common trap: Dividing 425 by 3.20 or reporting 0.136 g.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Converts percent to a decimal, applies a mixture ratio, and retains mass units.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: percent-to-solute-mass, variationAxes: { scenario: commercial disinfectant, unknown: solute mass, constraints: percent by mass } }
  - { id: q002, type: freeResponse, prompt: 'A stream sample contains 18.0 ppb Pb2+. What mass of Pb2+ is present in 2.50 L, assuming dilute-water density? Give micrograms.', answer: { gradingMode: selfCheck, keyPoints: ['18.0 micrograms per liter', '2.50 L', '45.0 micrograms'] }, explanation: 'Solution: In dilute water, 18.0 ppb is approximately $18.0\ \mathrm{\mu g/L}$. Thus $(18.0\ \mathrm{\mu g/L})(2.50\ \mathrm L)=45.0\ \mathrm{\mu g}$. Why it works: ppb maps to micrograms per liter for dilute aqueous samples. Common trap: Calling the result 45.0 mg, which is 1000 times too large.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Transfers ppb to mass-per-volume, multiplies by sample volume, and applies the dilute-water condition.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: ppb-to-sample-mass, variationAxes: { scenario: environmental sample, unknown: trace mass, constraints: dilute-water approximation } }
  - { id: q003, type: freeResponse, prompt: 'Explain why adding 4.00 g KCl to exactly 100.0 mL water does not guarantee a 0.536 M solution, even if that mass is 0.0536 mol.', answer: { gradingMode: selfCheck, keyPoints: ['molarity uses final solution volume', 'solute can change volume', 'dissolve then dilute to 100.0 mL for target'] }, explanation: 'Solution: $0.0536\ \mathrm{mol}/0.1000\ \mathrm L$ would equal 0.536 M only if 100.0 mL were the final solution volume. Adding solid can change volume, so dissolve first and dilute to a 100.0 mL final mark for that target. Why it works: Molarity is defined using solution volume, not starting solvent volume. Common trap: Assuming volumes are additive without a stated condition.', difficultyDimensions: [modelOrDerivation, domainCondition, errorDiagnosis], difficultyEvidence: 'Builds a laboratory model, checks the volume definition, and diagnoses a common preparation error.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: final-volume-error-diagnosis, variationAxes: { scenario: lab preparation, constraints: final versus initial volume, methodBranch: conceptual validation } }
  - { id: q004, type: freeResponse, prompt: 'Design the calculation and laboratory steps to make 175.0 mL of 0.250 M CaCl2 from solid CaCl2 (110.98 g/mol). Give the needed mass.', answer: { gradingMode: selfCheck, keyPoints: ['0.1750 L', '0.04375 mol', '4.86 g', 'dissolve then dilute to mark'] }, explanation: 'Solution: $n=MV=(0.250\ \mathrm{mol/L})(0.1750\ \mathrm L)=0.04375\ \mathrm{mol}$. Then $m=nM_m=(0.04375)(110.98)=4.86\ \mathrm g$. Weigh 4.86 g, dissolve it, and dilute to 175.0 mL final solution. Why it works: The calculation chains target volume to moles to mass; the flask establishes the volume used by molarity. Common trap: Filling with 175.0 mL water before adding salt.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Constructs a target-preparation model, chains two unit conversions, and maps it to lab procedure.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: target-molarity-preparation, variationAxes: { scenario: salt preparation, unknown: mass and procedure, governingRelation: molarity plus molar mass } }
  - { id: q005, type: freeResponse, prompt: 'A student needs 750.0 mL of 0.0800 M CuSO4 from 0.500 M stock. Determine transferred stock volume and explain whether 630.0 mL water should be measured separately.', answer: { gradingMode: selfCheck, keyPoints: ['120.0 mL stock', 'dilute to 750.0 mL final volume', 'do not measure 630.0 mL water separately'] }, explanation: 'Solution: $V_1=M_2V_2/M_1=(0.0800)(750.0)/0.500=120.0\ \mathrm{mL}$. Transfer that stock and add water until final volume is 750.0 mL. Why it works: $M_1V_1=M_2V_2$ conserves solute moles, and final volume—not added-water volume—sets concentration. Common trap: Adding 630.0 mL water, which assumes exact volume additivity.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Solves dilution, constructs final-volume procedure, and rejects an additive-volume shortcut.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: dilution-final-volume, variationAxes: { scenario: stock dilution, unknown: transfer volume, constraints: final-volume calibration } }
  - { id: q006, type: freeResponse, prompt: 'Rank 0.0200% m/m dye, 150 ppm dye, and 0.0000180 mass fraction dye from least to greatest concentration. State each in ppm.', answer: { gradingMode: selfCheck, keyPoints: ['0.0000180 = 18.0 ppm', '150 ppm', '0.0200 percent = 200 ppm', '18 less than 150 less than 200'] }, explanation: 'Solution: A mass fraction of 0.0000180 is 18.0 ppm. $0.0200\%=0.000200$, or 200 ppm. Therefore 18.0 ppm < 150 ppm < 200 ppm. Why it works: A common scale exposes the comparison. Common trap: Reading 0.0200% as 20 ppm instead of 200 ppm.', difficultyDimensions: [representationTransfer, simplification, casePartition], difficultyEvidence: 'Converts three distinct representations to a common scale and orders the results.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: concentration-scale-ranking, variationAxes: { representation: percent ppm fraction, unknown: ordering, methodBranch: common-unit conversion } }
  - { id: q007, type: freeResponse, prompt: 'A 0.150 M Na2SO4 solution is made by dissolving 10.65 g Na2SO4 (142.04 g/mol). Determine the final solution volume required.', answer: { gradingMode: selfCheck, keyPoints: ['0.0750 mol', '0.500 L', '500 mL'] }, explanation: 'Solution: $n=10.65/142.04=0.0750\ \mathrm{mol}$. Then $V=n/M=0.0750/0.150=0.500\ \mathrm L=500\ \mathrm{mL}$. Why it works: Molar mass gives solute amount, then molarity determines the final volume. Common trap: Dividing 0.150 by 0.0750.', difficultyDimensions: [auxiliaryTechnique, representationTransfer, reverseReasoning], difficultyEvidence: 'Works backward from a weighed mass to moles and from target molarity to required volume.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: mass-molarity-to-final-volume, variationAxes: { givens: mass and target molarity, unknown: final volume, methodBranch: reverse preparation } }
  - { id: q008, type: freeResponse, prompt: 'A recipe says 12.0% m/m sucrose. A student combines 18.0 g sucrose with 132.0 g water, then spills 15.0 g of the uniform solution. Does the remaining solution still have 12.0% m/m sucrose? Explain.', answer: { gradingMode: selfCheck, keyPoints: ['yes', 'uniform solution', 'both solute and solution mass removed in same ratio'] }, explanation: 'Solution: Yes. Before spilling, $18.0/(18.0+132.0)=12.0\%$. Removing a uniform portion removes sucrose and solution mass in the same 0.120 ratio, so the remaining composition is unchanged. Why it works: Concentration is an intensive ratio for a homogeneous solution. Common trap: Subtracting 15.0 g from only water or only sucrose.', difficultyDimensions: [globalLocalReasoning, proofJustification, modelOrDerivation], difficultyEvidence: 'Uses homogeneity to transfer a whole-solution ratio to a removed portion and justifies invariance.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: uniform-solution-spill, variationAxes: { scenario: spill, governingRelation: intensive mass fraction, unknown: concentration invariance } }
  - { id: q009, type: freeResponse, prompt: 'A 1.20 M solution is diluted to one third of its original concentration. If 40.0 mL stock is used, find final volume and describe the concentration check.', answer: { gradingMode: selfCheck, keyPoints: ['0.400 M', '120.0 mL final volume', 'threefold volume increase gives one third concentration'] }, explanation: 'Solution: One third of 1.20 M is 0.400 M. $V_2=M_1V_1/M_2=(1.20)(40.0)/0.400=120.0\ \mathrm{mL}$. Why it works: Conserved solute moles require a threefold volume increase for a threefold concentration decrease. Common trap: Using 13.3 mL by reversing the ratio.', difficultyDimensions: [parameterThreshold, auxiliaryTechnique, estimationOrBounds], difficultyEvidence: 'Interprets a verbal ratio, solves dilution algebra, and checks against the expected inverse volume relationship.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: verbal-dilution-ratio, variationAxes: { scenario: stated fractional dilution, unknown: final volume, representation: verbal to equation } }
  - { id: q010, type: freeResponse, prompt: 'A technician reports 0.0500 mol solute in 250.0 mL solution as “0.000200 M.” Diagnose and correct the error.', answer: { gradingMode: selfCheck, keyPoints: ['250.0 mL equals 0.2500 L', '0.200 M', 'mL was treated as L or inverted'] }, explanation: 'Solution: $250.0\ \mathrm{mL}=0.2500\ \mathrm L$, so $M=0.0500/0.2500=0.200\ \mathrm M$. Why it works: Molarity is mol/L. The reported 0.000200 M reflects a milliliter/liter or inverse-operation error. Common trap: Trusting a small answer without checking that 0.050 mol in a quarter liter should be near two tenths molar.', difficultyDimensions: [errorDiagnosis, representationTransfer, estimationOrBounds], difficultyEvidence: 'Finds a unit error, recomputes using liters, and uses magnitude reasoning to validate.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: molarity-unit-error, variationAxes: { scenario: technician report, methodBranch: error diagnosis, unknown: corrected concentration } }
