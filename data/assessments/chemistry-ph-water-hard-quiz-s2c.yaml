- id: q-1
  type: multipleChoice
  prompt: In pure water at 25 °C, which relation is true? Include the stated aqueous condition and classify the model before
    choosing.
  choices:
  - id: a
    text: '[H3O+]=[OH−]=1.0×10−7 M'
    issueSignals: []
  - id: b
    text: '[H3O+]=1 M'
    issueSignals:
    - id: water-autoionization-error
      domains:
      - chemistry
  - id: c
    text: '[OH−]=0'
    issueSignals:
    - id: water-autoionization-error
      domains:
      - chemistry
  - id: d
    text: '[H3O+][OH−]=1'
    issueSignals:
    - id: water-autoionization-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: 'Solution: Choice A ([H3O+]=[OH−]=1.0×10−7 M).


    Why it works: Apply the acid-base definition, equilibrium relation, logarithmic conversion, or stoichiometric ratio named
    by the prompt, then check units and assumptions.


    Why the other choices fail: Choice B ([H3O+]=1 M) makes a model or sign error; choice C ([OH−]=0) uses the wrong condition
    or operation; choice D ([H3O+][OH−]=1) does not follow from the supplied species, values, or titration region.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: 'Autoionization: apply the governing acid-base relation and check the result against the stated condition.'
  prerequisiteObjectiveIds:
  - acid-base-models
  extensionObjectiveIds:
  - acid-base-transfer
