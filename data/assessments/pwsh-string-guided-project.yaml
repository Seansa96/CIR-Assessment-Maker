schemaVersion: 1
id: pwsh-string-guided-project
title: "String Replacer and Extractor"
assessmentType: sandbox
categoryId: scripting
topicId: pwsh-string-methods
skills:
- Apply scripting concepts
- Apply String Methods and Manipulation
navigation:
  learningGoal: apply
  activityType: sandbox
  tags:
  - scripting
  - pwsh-string-methods
modeDefault: practice
randomizeQuestions: false
sandbox:
  language: pwsh
  image: mcr.microsoft.com/powershell:latest
  initialCommand: 'pwsh -NoExit -Command "Start-Job -FilePath /workspace/.cir/monitor.ps1 | Out-Null"'
  readOnlyFileSystem: false
  instructions: |
    Write a PowerShell script that takes a hardcoded string `$Original = "The quick brown fox jumps over the lazy dog"`.
    
    1. Replace the word "fox" with "cat".
    2. Replace the word "dog" with "mouse".
    3. Extract a substring containing only the first 13 characters of the *replaced* string.
    4. Print the final substring using `Write-Output`.
    
    The environment is pre-configured. When you have correctly written and saved your script, the background monitor will automatically detect it and advance the assessment.
  files:
    - path: process.ps1
      readOnly: false
      content: |
        $Original = "The quick brown fox jumps over the lazy dog"
        
        # 1. Replace fox and dog
        $Replaced = 
        
        # 2. Extract the first 13 characters
        $Final = 
        
        # 3. Print the output
        
    - path: .cir/monitor.ps1
      readOnly: true
      content: |
        while ($true) {
            if (Test-Path "/workspace/process.ps1") {
                $output = & /workspace/process.ps1 | Out-String
                if ($output.Trim() -eq "The quick bro") {
                    Invoke-RestMethod -Method Post -Uri "$env:CIR_API_URL/api/attempts/$env:CIR_ATTEMPT_ID/sandbox/complete"
                    break
                }
            }
            Start-Sleep -Seconds 3
        }
