schemaVersion: 1
id: calc2-surface-area-revolution-worked-example
title: Surface Area of Revolution Worked Example
assessmentType: workedExample
categoryId: calculus-2
subcategoryIds:
- arc-length-surface-area
skills:
- surface-area-revolution
modeDefault: practice
randomizeQuestions: false
workedExamples:
- id: surface-area-x-axis
  title: Surface Area around the x-axis
  problem: 'Find the surface area generated by revolving the curve $y = \sqrt{x}$
    from $x = 1$ to $x = 4$ around the x-axis.

    '
  steps:
  - id: step-surface-area-x-axis-1
    title: Find the derivative and square it
    type: freeResponse
    skills:
    - surface-area-revolution
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ y = x^{1/2} $$

      $$ y'' = \frac{1}{2}x^{-1/2} = \frac{1}{2\sqrt{x}} $$

      $$ [y'']^2 = \left( \frac{1}{2\sqrt{x}} \right)^2 = \frac{1}{4x} $$


      The arc length term is $ds = \sqrt{1 + \frac{1}{4x}}\,dx$.

      '
  - id: step-surface-area-x-axis-2
    title: Set up the surface area integral
    type: freeResponse
    skills:
    - surface-area-revolution
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Since we revolve around the x-axis, the radius is $y = \sqrt{x}$.


      $$ S = \int_1^4 2\pi y \, ds = \int_1^4 2\pi \sqrt{x} \sqrt{1 + \frac{1}{4x}}\,dx
      $$

      '
  - id: step-surface-area-x-axis-3
    title: Simplify the integrand
    type: freeResponse
    skills:
    - surface-area-revolution
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'We can combine the square roots!


      $$ \sqrt{x} \sqrt{1 + \frac{1}{4x}} = \sqrt{x \left(1 + \frac{1}{4x}\right)}
      = \sqrt{x + \frac{1}{4}} $$


      So the integral becomes:


      $$ S = 2\pi \int_1^4 \sqrt{x + 0.25}\,dx $$

      '
  - id: step-surface-area-x-axis-4
    title: Evaluate the integral
    type: freeResponse
    skills:
    - surface-area-revolution
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Let $u = x + 0.25$, $du = dx$. Bounds: $x=1 \implies u=1.25$. $x=4
      \implies u=4.25$.


      $$ S = 2\pi \int_{1.25}^{4.25} u^{1/2}\,du = 2\pi \left[ \frac{2}{3}u^{3/2}
      \right]_{1.25}^{4.25} = \frac{4\pi}{3} \left( (4.25)^{3/2} - (1.25)^{3/2} \right)
      $$

      '
  check:
    id: surface-area-x-axis-check
    type: numericResponse
    skills:
    - surface-area-revolution
    prompt: Provide the decimal a\approximation of the final surface area (use $\pi
      \a\approx 3.14159$, 2 decimal places).
    answer:
      value: 30.85
      tolerance: 0.1
    explanation: '$(4.25)^{1.5} \a\approx 8.761$. $(1.25)^{1.5} \a\approx 1.397$. Difference
      $\a\approx 7.364$. $\frac{4\pi}{3}(7.364) \a\approx 30.85$.

      '

