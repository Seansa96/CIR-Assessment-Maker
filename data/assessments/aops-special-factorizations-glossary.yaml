schemaVersion: 1
id: aops-special-factorizations-glossary
title: Special Factorizations Glossary
assessmentType: glossary
categoryId: art-of-problem-solving
topicId: aops-special-factorizations
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: glossary
  tags:
  - art-of-problem-solving
  - aops-special-factorizations
  - identity-vocabulary
  - algebraic-structure
skills:
- Interpret identity, factorization, symmetry, and cancellation terminology
- Recall the conditions attached to algebraic rewrites
glossary:
  introduction: |-
    Special manipulation depends on distinguishing an identity from a conditional equation and a valid cancellation from division by zero. These terms name the structures used to choose and justify a rewrite.
  sections:
  - id: identities-and-factors
    title: Identities and Factor Structure
    required: true
    content: Identities preserve value for every permitted input; factorizations expose products that support cancellation, evaluation, or solving.
    entries:
    - id: identity
      term: Algebraic Identity
      definition: An equality true for every value in the expressions' common domain.
      notation: '$A(x)\equiv B(x)$'
      examples: ['$a^2-b^2=(a-b)(a+b)$ is an identity.']
      aliases: [polynomial identity]
      media: []
      tags: [identity]
      drills:
      - id: identity-drill
        type: flashcard
        prompt: How can a proposed polynomial identity be verified?
        answer:
          expected: Expand or otherwise transform both sides to the same polynomial.
        explanation: Matching coefficients proves equality for every input.
        tags: [identity]
    - id: factorization
      term: Factorization
      definition: A representation of an expression as a product of simpler expressions.
      notation: null
      examples: ['$x^2-9=(x-3)(x+3)$.']
      aliases: [factored form]
      media: []
      tags: [factorization]
      drills:
      - id: factorization-drill
        type: flashcard
        prompt: What operation verifies a factorization?
        answer:
          expected: Multiply or expand the factors.
        explanation: The product must reproduce the original expression exactly.
        tags: [factorization]
    - id: difference-of-squares
      term: Difference of Squares
      definition: A subtraction of two square expressions, factorable as $(a-b)(a+b)$.
      notation: '$a^2-b^2=(a-b)(a+b)$'
      examples: ['$25x^2-4=(5x-2)(5x+2)$.']
      aliases: []
      media: []
      tags: [difference-of-squares]
      drills:
      - id: difference-of-squares-drill
        type: typed
        prompt: Factor $y^2-64$.
        answer:
          expected: '(y-8)(y+8)'
          aliases: ['$(y-8)(y+8)$']
        explanation: Both terms are squares separated by subtraction.
        tags: [difference-of-squares]
    - id: perfect-square-trinomial
      term: Perfect-Square Trinomial
      definition: A trinomial of form $a^2\pm2ab+b^2$, equal to $(a\pm b)^2$.
      notation: '$a^2\pm2ab+b^2$'
      examples: ['$x^2-12x+36=(x-6)^2$.']
      aliases: []
      media: []
      tags: [perfect-square]
      drills:
      - id: perfect-square-drill
        type: typed
        prompt: Complete $x^2+14x+\_\_$ as a perfect square.
        answer:
          expected: '49'
        explanation: The missing term is the square of half of 14.
        tags: [perfect-square]
    - id: sum-of-cubes
      term: Sum of Cubes
      definition: An expression $a^3+b^3$, factorable as $(a+b)(a^2-ab+b^2)$.
      notation: '$a^3+b^3=(a+b)(a^2-ab+b^2)$'
      examples: ['$x^3+8=(x+2)(x^2-2x+4)$.']
      aliases: []
      media: []
      tags: [sum-of-cubes]
      drills:
      - id: sum-of-cubes-drill
        type: flashcard
        prompt: What sign belongs on the middle term of the quadratic factor for a sum of cubes?
        answer:
          expected: A minus sign.
        explanation: Expansion then cancels the mixed cubic terms.
        tags: [sum-of-cubes]
    - id: difference-of-cubes
      term: Difference of Cubes
      definition: An expression $a^3-b^3$, factorable as $(a-b)(a^2+ab+b^2)$.
      notation: '$a^3-b^3=(a-b)(a^2+ab+b^2)$'
      examples: ['$8x^3-1=(2x-1)(4x^2+2x+1)$.']
      aliases: []
      media: []
      tags: [difference-of-cubes]
      drills:
      - id: difference-of-cubes-drill
        type: flashcard
        prompt: What sign belongs on the middle term of the quadratic factor for a difference of cubes?
        answer:
          expected: A plus sign.
        explanation: The signs alternate so the mixed terms cancel.
        tags: [difference-of-cubes]
    - id: factoring-by-grouping
      term: Factoring by Grouping
      definition: Regrouping terms so separate groups expose a common factor, then factoring that shared expression.
      notation: null
      examples: ['$ax+ay+bx+by=(a+b)(x+y)$.']
      aliases: [grouping]
      media: []
      tags: [grouping]
      drills:
      - id: grouping-drill
        type: flashcard
        prompt: What shared binomial appears after grouping $x^3+x^2+2x+2$?
        answer:
          expected: x plus 1.
          aliases: ['$x+1$']
        explanation: $x^2(x+1)+2(x+1)$ exposes the binomial.
        tags: [grouping]
  - id: symmetry-and-legal-transformations
    title: Symmetry and Legal Transformations
    required: true
    content: Symmetry compresses information; restrictions determine whether a simplification remains equivalent to the original expression.
    entries:
    - id: symmetric-expression
      term: Symmetric Expression
      definition: An expression unchanged when specified variables are interchanged.
      notation: null
      examples: ['$a^2+b^2$ and $a^3+b^3$ are symmetric in $a,b$.']
      aliases: []
      media: []
      tags: [symmetry]
      drills:
      - id: symmetric-expression-drill
        type: flashcard
        prompt: Is $a^2-b^2$ symmetric in $a,b$?
        answer:
          expected: No; swapping the variables changes its sign.
        explanation: Symmetry requires the expression to remain unchanged.
        tags: [symmetry]
    - id: elementary-symmetric-data
      term: Sum-and-Product Data
      definition: The pair $s=a+b$ and $p=ab$, which determines every symmetric polynomial in two variables.
      notation: '$s=a+b,\ p=ab$'
      examples: ['$a^2+b^2=s^2-2p$.']
      aliases: [elementary symmetric invariants]
      media: []
      tags: [sum-product]
      drills:
      - id: sum-product-drill
        type: typed
        prompt: If $a+b=8$ and $ab=12$, find $a^2+b^2$.
        answer:
          expected: '40'
        explanation: $8^2-2(12)=40$.
        tags: [sum-product]
    - id: reciprocal-symmetry
      term: Reciprocal Symmetry
      definition: Invariance under replacing a nonzero variable $x$ by $1/x$.
      notation: '$x\mapsto1/x$'
      examples: ['$x^n+x^{-n}$ is reciprocal-symmetric.']
      aliases: []
      media: []
      tags: [reciprocal-symmetry]
      drills:
      - id: reciprocal-symmetry-drill
        type: flashcard
        prompt: What domain restriction accompanies $x+1/x$?
        answer:
          expected: x must be nonzero.
          aliases: ['$x\ne0$']
        explanation: The reciprocal is undefined at zero.
        tags: [reciprocal-symmetry]
    - id: purposeful-zero
      term: Adding Zero Purposefully
      definition: Adding and subtracting the same term to create a useful identity without changing the expression.
      notation: '$E=E+t-t$'
      examples: ['$x^2+6x=x^2+6x+9-9=(x+3)^2-9$.']
      aliases: [add-and-subtract]
      media: []
      tags: [purposeful-zero]
      drills:
      - id: purposeful-zero-drill
        type: typed
        prompt: Which term should be added and subtracted to complete the square in $x^2-10x$?
        answer:
          expected: '25'
        explanation: Square half of $-10$.
        tags: [purposeful-zero]
    - id: cancellation
      term: Cancellation
      definition: Division of a numerator and denominator or both sides of an equation by the same known nonzero factor.
      notation: null
      examples: ['$\frac{(x-1)(x+1)}{x-1}=x+1$ only when $x\ne1$.']
      aliases: []
      media: []
      tags: [cancellation]
      drills:
      - id: cancellation-drill
        type: flashcard
        prompt: What must be checked before cancelling a variable factor?
        answer:
          expected: The factor must be nonzero, or its zero case must be handled separately.
        explanation: Cancellation is division, and division by zero is invalid.
        tags: [cancellation]
    - id: domain-restriction
      term: Domain Restriction
      definition: A condition excluding inputs for which an original expression or operation is undefined.
      notation: null
      examples: ['$x\ne1$ is required by $(x^2-1)/(x-1)$.']
      aliases: [excluded value]
      media: []
      tags: [domain-restriction]
      drills:
      - id: domain-restriction-drill
        type: typed
        prompt: State the excluded value in $(x+2)/(x-4)$.
        answer:
          expected: x cannot equal 4.
          aliases: ['$x\ne4$']
        explanation: The denominator cannot be zero.
        tags: [domain-restriction]
