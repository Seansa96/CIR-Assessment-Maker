schemaVersion: 1
id: calc2-series-test-selection-recall
title: Series Test Selection Recall
assessmentType: recallDrill
categoryId: calculus-2
topicId: convergence-tests
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: recognitionDrill
  tags:
  - calculus-2
  - convergence-tests
  - alternating-series
  - absolute-conditional-convergence
  - series-test-selection
  - recognition-drill
skills:
- Apply calculus-2 concepts
- Apply Convergence Tests
- Apply Alternating Series
- Apply Absolute and Conditional Convergence
  - series-convergence-tests
items:
  - id: convergence-flow-factorial-cue
    type: recognition
    skills:
      - series-convergence-tests
    prompt: |
      Use the decision flow as a visual cue.

      ![Convergence test selection flowchart keyed by structural cues](/assessments/calc2-infinite-series/convergence-test-selection-flow.svg)

      A series contains both factorials and exponential powers. Which test is usually the best first choice?
    choices:
      - id: a
        text: Ratio Test
      - id: b
        text: p-series test
      - id: c
        text: Telescoping pattern
      - id: d
        text: Direct geometric sum formula
    answer:
      choiceId: a
      expected: Ratio Test
    explanation: |
      Factorials and exponential powers often simplify cleanly in the adjacent-term ratio $\left|\frac{a_{n+1}}{a_n}\right|$.
    tags:
      - ratio-test
      - visual-recognition

  - id: divergence-test-gatekeeper
    type: flashcard
    skills:
      - series-convergence-tests
    prompt: What is the first fast rejection check for any series $\sum a_n$?
    answer:
      expected: Check whether $\lim_{n\to\infty}a_n=0$.
    explanation: |
      If the terms do not approach zero, the series diverges immediately. If they do approach zero, another test is still needed.
    tags:
      - divergence-test

  - id: geometric-recognition
    type: recognition
    skills:
      - series-convergence-tests
    prompt: |
      Which test or pattern is the best first choice?

      $$
      \sum_{n=0}^{\infty}5\left(\frac{2}{3}\right)^n
      $$
    choices:
      - id: a
        text: Geometric series
      - id: b
        text: Integral test
      - id: c
        text: Root test
      - id: d
        text: Alternating series test
    answer:
      choiceId: a
      expected: Geometric series
    explanation: |
      The terms match $ar^n$ with $r=\frac23$, so use the geometric series rule.
    tags:
      - geometric-series
      - test-selection

  - id: p-series-cloze
    type: cloze
    skills:
      - series-convergence-tests
    prompt: 'A p-series $\sum\frac{1}{n^p}$ converges when $p$ is ____ than $1$.'
    answer:
      expected: greater
      aliases:
        - greater than
        - '>'
    explanation: |
      The p-series threshold is $p>1$ for convergence and $p\le1$ for divergence.
    tags:
      - p-series

  - id: telescoping-recognition
    type: recognition
    skills:
      - series-convergence-tests
    prompt: |
      Which test or pattern is the best first choice?

      $$
      \sum_{n=1}^{\infty}\left(\frac{1}{n+2}-\frac{1}{n+3}\right)
      $$
    choices:
      - id: a
        text: Telescoping series
      - id: b
        text: Ratio test
      - id: c
        text: Alternating series test
      - id: d
        text: Root test
    answer:
      choiceId: a
      expected: Telescoping series
    explanation: |
      Consecutive denominator shifts suggest that middle terms cancel in the partial sums.
    tags:
      - telescoping-series
      - test-selection

  - id: ratio-test-recognition
    type: recognition
    skills:
      - series-convergence-tests
    prompt: |
      Which test is the best first choice?

      $$
      \sum_{n=1}^{\infty}\frac{4^n}{n!}
      $$
    choices:
      - id: a
        text: Ratio test
      - id: b
        text: p-series test
      - id: c
        text: Direct comparison with $\frac1n$
      - id: d
        text: Alternating series test
    answer:
      choiceId: a
      expected: Ratio test
    explanation: |
      Factorials and exponentials usually simplify cleanly in $\left|\frac{a_{n+1}}{a_n}\right|$.
    tags:
      - ratio-test
      - test-selection

  - id: root-test-recognition
    type: recognition
    skills:
      - series-convergence-tests
    prompt: |
      Which test is the best first choice?

      $$
      \sum_{n=1}^{\infty}\left(\frac{3n+1}{5n-2}\right)^n
      $$
    choices:
      - id: a
        text: Root test
      - id: b
        text: Integral test
      - id: c
        text: Telescoping series
      - id: d
        text: p-series test
    answer:
      choiceId: a
      expected: Root test
    explanation: |
      The entire expression is raised to the $n$th power, so the nth root cancels the main structure.
    tags:
      - root-test
      - test-selection

  - id: limit-comparison-typed
    type: typed
    skills:
      - series-convergence-tests
    prompt: |
      For a rational expression in $n$, what comparison method is often cleaner than forcing an inequality?
    answer:
      expected: limit comparison
      aliases:
        - limit comparison test
        - LCT
    explanation: |
      Limit comparison is usually efficient when dominant powers reveal that two positive series have the same large-$n$ behavior.
    tags:
      - limit-comparison

  - id: integral-test-conditions
    type: cloze
    skills:
      - series-convergence-tests
    prompt: 'The Integral Test usually requires a function that is continuous, positive, and ____.' 
    answer:
      expected: decreasing
      aliases:
        - eventually decreasing
    explanation: |
      The test compares series terms to area under a positive decreasing curve.
    tags:
      - integral-test

  - id: alternating-series-two-conditions
    type: typed
    skills:
      - series-convergence-tests
    prompt: Name the two main conditions for the Alternating Series Test.
    answer:
      expected: decreasing magnitudes and limit zero
      aliases:
        - terms decrease and approach zero
        - magnitudes decrease to zero
    explanation: |
      Alternating signs alone are not enough. The magnitudes must decrease eventually and approach zero.
    tags:
      - alternating-series-test

  - id: absolute-first-flashcard
    type: flashcard
    skills:
      - series-convergence-tests
    prompt: For an alternating series, why should you often check absolute convergence first?
    answer:
      expected: Absolute convergence is stronger; if $\sum |a_n|$ converges, then the original series converges.
    explanation: |
      If the absolute-value series converges, you do not need the Alternating Series Test to rescue the original series.
    tags:
      - absolute-convergence

  - id: ratio-inconclusive-cloze
    type: cloze
    skills:
      - series-convergence-tests
    prompt: 'If the Ratio Test gives $L=1$, the test is ____.' 
    answer:
      expected: inconclusive
    explanation: |
      $L=1$ means the Ratio Test did not decide convergence or divergence. Choose another test.
    tags:
      - ratio-test
      - inconclusive-tests

  - id: dominant-power-recognition
    type: recognition
    skills:
      - series-convergence-tests
    prompt: |
      Which comparison family best matches the dominant behavior?

      $$
      \sum_{n=1}^{\infty}\frac{7n^2+1}{3n^5-4}
      $$
    choices:
      - id: a
        text: '$\sum\frac{1}{n^3}$'
      - id: b
        text: '$\sum\frac{1}{n^5}$'
      - id: c
        text: '$\sum n^3$'
      - id: d
        text: '$\sum\left(\frac13\right)^n$'
    answer:
      choiceId: a
      expected: '$\sum\frac{1}{n^3}$'
    explanation: |
      Dominant terms give $\frac{7n^2}{3n^5}=\frac{7}{3n^3}$, so compare with a convergent p-series with $p=3$.
    tags:
      - limit-comparison
      - dominant-powers
  - id: direct-comparison-convergence-direction
    type: cloze
    skills:
      - series-convergence-tests
    prompt: 'To prove convergence by direct comparison, bound the unknown positive terms ____ a known convergent series.'
    answer:
      expected: below
      aliases:
        - underneath
        - by something larger
    explanation: |
      If $0\le a_n\le b_n$ and $\sum b_n$ converges, then $\sum a_n$ converges.
    tags:
      - direct-comparison
  - id: root-test-inconclusive
    type: typed
    skills:
      - series-convergence-tests
    prompt: What conclusion does the Root Test give when its limit equals one?
    answer:
      expected: inconclusive
      aliases:
        - no conclusion
        - choose another test
    explanation: |
      Like the Ratio Test, the Root Test does not decide the boundary case $L=1$.
    tags:
      - root-test
      - inconclusive-tests
