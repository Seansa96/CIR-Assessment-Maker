questions:
- id: q001
  type: numericResponse
  prompt: |
    A U-tube open to the atmosphere at both ends contains water ($\rho_w = 1000 \text{ kg/m}^3$) and an unknown oil. The oil sits on top of the water in the right arm.
    The interface between the water and the oil is $0.05 \text{ m}$ above the bottom of the U-tube. 
    The top of the water column in the left arm is at a height of $0.20 \text{ m}$ above the bottom of the tube.
    The top of the oil column in the right arm is at a height of $0.22 \text{ m}$ above the bottom of the tube.
    Calculate the density of the unknown oil in $\text{kg/m}^3$.
  answer:
    value: 882.35
    tolerance: 5.0
  explanation: |
    Solution:
    Choose the water-oil interface as the reference level ($h = 0$).
    The height of the water above the interface in the left arm is $h_w = 0.20 - 0.05 = 0.15 \text{ m}$.
    The height of the oil above the interface in the right arm is $h_o = 0.22 - 0.05 = 0.17 \text{ m}$.
    Equating gauge pressures at the interface: $\rho_w g h_w = \rho_o g h_o$
    $\rho_o = \rho_w \frac{h_w}{h_o} = 1000 \left(\frac{0.15}{0.17}\right) \approx 882.35 \text{ kg/m}^3$.
    
    Why it works:
    Since the fluid below the interface is continuous and homogeneous (all water), the pressure at the interface level must be identical in both arms. The atmospheric pressure ($P_0$) pushes on both open ends and cancels out.
  difficultyDimensions:
  - RepresentationTransfer
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: |
    A vertical rectangular dam wall has a width of $50 \text{ m}$. The water behind the dam is $20 \text{ m}$ deep.
    Given $\rho_{water} = 1000 \text{ kg/m}^3$ and $g = 9.8 \text{ m/s}^2$, calculate the total force exerted by the water on the dam in Newtons. 
    (Hint: The pressure increases linearly with depth, so you can use the average gauge pressure).
  answer:
    value: 98000000
    tolerance: 100000
  explanation: |
    Solution:
    The pressure at the surface is $0$ (gauge) and at the bottom is $\rho g H$.
    The average pressure is $P_{avg} = \frac{1}{2}\rho g H = \frac{1}{2}(1000)(9.8)(20) = 98000 \text{ Pa}$.
    The total area of the dam wall exposed to water is $A = \text{width} \times H = 50 \times 20 = 1000 \text{ m}^2$.
    The total force is $F = P_{avg} A = 98000 \times 1000 = 98,000,000 \text{ N}$.
    
    Why it works:
    Because the pressure increases linearly from zero at the surface, the total force is exactly the same as if a uniform average pressure were applied across the entire surface area. This result can also be derived by integrating $dF = P(y) dA = (\rho g y)(W dy)$ from $0$ to $H$.
  difficultyDimensions:
  - RepresentationTransfer
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
