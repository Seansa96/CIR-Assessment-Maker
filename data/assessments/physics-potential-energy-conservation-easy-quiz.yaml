questions:
- id: cons-easy-1
  title: Energy Conservation
  type: numericResponse
  prompt: 'Adapted from OpenStax University Physics.


    A mass is dropped from $4$ m. What is its speed just before impact? (Use $g=9.8$)'
  answer:
    gradingMode: auto
    tolerance: 0.2
    value: 8.85
  explanation: $mgh = 1/2 mv^2 \implies v = \sqrt{2gh} = \sqrt{2(9.8)(4)}$.
