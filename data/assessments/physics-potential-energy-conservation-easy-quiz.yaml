questions:
- id: cons-mixed-1
  title: Free Fall Energy Conservation
  type: numericResponse
  prompt: |
    A $2.0\text{ kg}$ mass is dropped from rest from a height of $20.0\text{ m}$. 
    Assuming air resistance is negligible, what is its speed just before impact? (Use $g = 9.8\text{ m/s}^2$)
  answer:
    gradingMode: auto
    tolerance: 0.2
    value: 19.8
  explanation: |
    The mechanical energy is conserved: $E_i = E_f$.
    Initial energy is purely gravitational potential energy: $U_i = mgh$.
    Final energy is purely kinetic energy: $K_f = \frac{1}{2}mv^2$.
    $mgh = \frac{1}{2}mv^2 \implies v = \sqrt{2gh}$.
    $v = \sqrt{2(9.8)(20.0)} = \sqrt{392} \approx 19.799\text{ m/s}$.
  skills:
  - physics-potential-energy-conservation

- id: cons-mixed-2
  title: Roller Coaster Speed
  type: numericResponse
  prompt: |
    A roller coaster cart starts from rest at the top of a hill $45.0\text{ m}$ above the ground. It rolls down a frictionless track and passes over a smaller hill that is $15.0\text{ m}$ above the ground.
    What is the speed of the cart at the top of the smaller hill? (Use $g = 9.8\text{ m/s}^2$)
  answer:
    gradingMode: auto
    tolerance: 0.2
    value: 24.2
  explanation: |
    By conservation of energy, $E_i = E_f$.
    $U_i + K_i = U_f + K_f$
    $mgh_1 + 0 = mgh_2 + \frac{1}{2}mv_2^2$
    Divide by $m$ and solve for $v_2$:
    $gh_1 - gh_2 = \frac{1}{2}v_2^2 \implies v_2 = \sqrt{2g(h_1 - h_2)}$
    $v_2 = \sqrt{2(9.8)(45.0 - 15.0)} = \sqrt{2(9.8)(30.0)} = \sqrt{588} \approx 24.25\text{ m/s}$.
  skills:
  - physics-potential-energy-conservation

- id: cons-mixed-3
  title: Horizontal Spring Launch
  type: numericResponse
  prompt: |
    A $0.50\text{ kg}$ block is pushed against a horizontal ideal spring with spring constant $k = 400\text{ N/m}$, compressing it by $0.15\text{ m}$. 
    When the block is released from rest, it slides along a frictionless horizontal surface. What is the block's maximum speed (in m/s)?
  answer:
    gradingMode: auto
    tolerance: 0.1
    value: 4.24
  explanation: |
    The maximum speed occurs when all of the elastic potential energy has been converted to kinetic energy.
    $U_{s,i} = K_f \implies \frac{1}{2}kx^2 = \frac{1}{2}mv^2$
    $v = \sqrt{\frac{k}{m}} x$
    $v = \sqrt{\frac{400}{0.50}}(0.15) = \sqrt{800}(0.15) = (28.28)(0.15) \approx 4.24\text{ m/s}$.
  skills:
  - physics-potential-energy-conservation

- id: cons-mixed-4
  title: Pendulum Swing
  type: numericResponse
  prompt: |
    A pendulum bob is released from rest at an angle such that its height is $0.60\text{ m}$ above its lowest point. 
    What is the speed of the bob when it passes through the lowest point of its swing? (Use $g = 9.8\text{ m/s}^2$)
  answer:
    gradingMode: auto
    tolerance: 0.1
    value: 3.43
  explanation: |
    Even though the path is curved, the tension force is always perpendicular to motion and does no work. Mechanical energy is conserved.
    $mgh = \frac{1}{2}mv^2 \implies v = \sqrt{2gh}$
    $v = \sqrt{2(9.8)(0.60)} = \sqrt{11.76} \approx 3.429\text{ m/s}$.
  skills:
  - physics-potential-energy-conservation

- id: cons-mixed-5
  title: Vertical Drop onto a Spring
  type: numericResponse
  prompt: |
    A $2.0\text{ kg}$ block is dropped from a height of $1.5\text{ m}$ above an uncompressed vertical spring with a spring constant $k = 500\text{ N/m}$.
    Assuming negligible air resistance, what is the maximum compression of the spring (in meters)? (Use $g = 9.8\text{ m/s}^2$)
  answer:
    gradingMode: auto
    tolerance: 0.05
    value: 0.385
  explanation: |
    Let $x$ be the maximum compression of the spring. The total distance the block falls is $h + x$.
    The initial energy (at height $h$ above the uncompressed spring) is $E_i = mg(h + x)$, setting the lowest point as $y=0$.
    At maximum compression, the block stops momentarily, so $K_f = 0$. The energy is entirely elastic potential energy: $E_f = \frac{1}{2}kx^2$.
    $mg(h + x) = \frac{1}{2}kx^2$
    $2.0(9.8)(1.5 + x) = \frac{1}{2}(500)x^2$
    $19.6(1.5 + x) = 250x^2$
    $250x^2 - 19.6x - 29.4 = 0$
    Using the quadratic formula: $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$
    $x = \frac{19.6 \pm \sqrt{(-19.6)^2 - 4(250)(-29.4)}}{500} = \frac{19.6 \pm \sqrt{384.16 + 29400}}{500}$
    $x = \frac{19.6 \pm 172.58}{500}$
    Taking the positive root: $x \approx \frac{192.18}{500} \approx 0.384\text{ m}$.
  skills:
  - physics-potential-energy-conservation
