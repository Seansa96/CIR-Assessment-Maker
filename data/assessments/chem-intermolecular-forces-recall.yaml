modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: What are London dispersion forces, and what types of molecules have them?
    answer:
      expected: |
      Weak attractions caused by temporary, instantaneous fluctuations in electron distribution (induced dipoles). **All** atoms and molecules have them. They are the *only* IMF in nonpolar molecules and noble gases.
  - id: item-002
    type: flashcard
    prompt: 'What is polarizability, and how does it relate to molar mass?'
    answer:
      expected: |
      Polarizability is the ease with which an electron cloud can be distorted to create a dipole. It generally **increases with molar mass and size** because larger atoms have more electrons further from the nucleus, held less tightly. Greater polarizability = stronger dispersion forces.
  - id: item-003
    type: flashcard
    prompt: What types of molecules experience dipole-dipole forces?
    answer:
      expected: |
      **Polar molecules** — molecules that have a permanent net dipole moment due to polar bonds and asymmetric geometry. The $\delta^+$ end of one attracts the $\delta^-$ end of another.
  - id: item-004
    type: flashcard
    prompt: What is the strict requirement for a molecule to exhibit hydrogen bonding?
    answer:
      expected: |
      The molecule must have a hydrogen atom **covalently bonded directly to F, O, or N** (the three most electronegative, small atoms). The resulting highly positive H attracts a lone pair on an F, O, or N of an adjacent molecule.
  - id: item-005
    type: flashcard
    prompt: 'Rank the main intermolecular forces from weakest to strongest (for molecules of similar size).'
    answer:
      expected: |
      1. London Dispersion Forces (weakest)
      2. Dipole-Dipole Forces
      3. Hydrogen Bonding
      4. Ion-Dipole Forces (strongest, occurs in mixtures)
  - id: item-006
    type: flashcard
    prompt: As intermolecular force strength increases, what happens to boiling point and melting point?
    answer:
      expected: |
      They **increase**. Stronger attractions mean more thermal energy is required to overcome the forces and pull the molecules apart into the liquid or gas phase.
  - id: item-007
    type: flashcard
    prompt: As intermolecular force strength increases, what happens to vapor pressure?
    answer:
      expected: |
      It **decreases**. Stronger IMFs hold the molecules in the liquid phase more tightly, making it harder for them to escape (evaporate) into the gas phase.
  - id: item-008
    type: flashcard
    prompt: 'What is viscosity, and how do IMFs affect it?'
    answer:
      expected: |
      Viscosity is a liquid's **resistance to flow** (e.g., honey has high viscosity). It **increases** with stronger intermolecular forces and with longer, easily entangled molecular chains.
  - id: item-009
    type: flashcard
    prompt: 'Why is water''s surface tension so high compared to other common liquids?'
    answer:
      expected: |
      Surface tension is the energy required to increase the surface area of a liquid. Water has a high surface tension due to its extensive **hydrogen bonding network**, which pulls surface molecules strongly inward.
  - id: item-010
    type: flashcard
    prompt: 'What is the dominant intermolecular force in liquid nitrogen (N₂)?'
    answer:
      expected: |
      **London dispersion forces**. $N_2$ is a nonpolar, homonuclear diatomic molecule, so it cannot have dipole-dipole or hydrogen bonding forces.

