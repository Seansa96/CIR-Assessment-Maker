workedExamples:
- id: we001
  title: Extract the dominant behavior
  problem: |
    Determine whether

    $$
    \sum_{n=2}^{\infty}\frac{\sqrt{n^4+3n}}{n^3+n\ln n}
    $$

    converges.
  steps:
  - id: adv-series-s001
    title: Dominant size
    instruction: |
      For large $n$, $\sqrt{n^4+3n}\sim n^2$ and $n^3+n\ln n\sim n^3$.
    type: multipleChoice
    prompt: |
      What simple term should this behave like?
    choices:
    - id: a
      text: $1/n$
    - id: b
      text: $1/n^2$
    - id: c
      text: $n$
    - id: d
      text: $(1/2)^n$
    answer:
      choiceId: a
    explanation: |
      The ratio resembles $n^2/n^3=1/n$.
  - id: adv-series-s002
    title: Choose the test
    instruction: |
      The terms are positive and the asymptotic model is the harmonic series.
    type: multipleChoice
    prompt: |
      Which test is cleanest?
    choices:
    - id: a
      text: Alternating Series Test
    - id: b
      text: Limit Comparison Test
    - id: c
      text: Ratio Test only
    - id: d
      text: Telescoping sum
    answer:
      choiceId: b
    explanation: |
      Limit comparison handles messy positive terms with the same long-run size.
  - id: adv-series-s003
    title: Use the reference result
    instruction: |
      Compare with $b_n=1/n$.
    type: multipleChoice
    prompt: |
      If $\lim a_n/(1/n)=1$, what follows?
    choices:
    - id: a
      text: The original converges
    - id: b
      text: The test is inconclusive
    - id: c
      text: The original diverges
    - id: d
      text: The terms are eventually zero
    answer:
      choiceId: c
    explanation: |
      A positive finite limit transfers harmonic divergence to the original series.
  - id: adv-series-s004
    title: Explain the result
    instruction: |
      Name the behavior and the threshold.
    type: freeResponse
    prompt: |
      Write the final convergence reasoning.
    answer:
      expected: |
        The terms are positive and asymptotic to $1/n$. By limit comparison with the divergent harmonic series, the given series diverges.
      gradingMode: selfCheck
      keyPoints:
      - Mentions positive terms
      - Compares to $1/n$
      - Names harmonic divergence
      - States divergence
    explanation: |
      Related topic: asymptotic comparison and p-series thresholds.
