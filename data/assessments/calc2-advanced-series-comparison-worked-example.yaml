workedExamples:
- id: we001
  title: Extract the dominant behavior
  problem: |
    Determine whether

    $$
    \sum_{n=2}^{\infty}\frac{\sqrt{n^4+3n}}{n^3+n\ln n}
    $$

    converges.
  steps:
  - id: adv-series-s001
    title: Dominant size
    instruction: |
      For large $n$, $\sqrt{n^4+3n}\sim n^2$ and $n^3+n\ln n\sim n^3$.
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: integral-test-error
    - id: ratio-test-evaluation-error
    - id: limit-evaluation-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: 'What simple term should this behave like?

      '
    choices:
    - id: a
      text: $1/n$
    - id: b
      text: $1/n^2$
    - id: c
      text: $n$
    - id: d
      text: $(1/2)^n$
    answer:
      choiceId: a
    explanation: |-
      Solution: The ratio resembles $n^2/n^3=1/n$. Therefore the answer is $1/n$.

      Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

      Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.

      Why the other choices fail: $1/n^2$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; $n$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; $(1/2)^n$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors.
  - id: adv-series-s002
    title: Choose the test
    instruction: 'The terms are positive and the asymptotic model is the harmonic series.

      '
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: integral-test-error
    - id: ratio-test-evaluation-error
    - id: limit-evaluation-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: 'Which test is cleanest?

      '
    choices:
    - id: a
      text: Alternating Series Test
    - id: b
      text: Limit Comparison Test
    - id: c
      text: Ratio Test only
    - id: d
      text: Telescoping sum
    answer:
      choiceId: b
    explanation: |-
      Solution: Limit comparison handles messy positive terms with the same long-run size. Therefore the answer is Limit Comparison Test.

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

      Why the other choices fail: Alternating Series Test conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Ratio Test only conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Telescoping sum conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
  - id: adv-series-s003
    title: Use the reference result
    instruction: 'Compare with $b_n=1/n$.

      '
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: integral-test-error
    - id: ratio-test-evaluation-error
    - id: limit-evaluation-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: |
      If $\lim a_n/(1/n)=1$, what follows?
    choices:
    - id: a
      text: The original converges
    - id: b
      text: The test is inconclusive
    - id: c
      text: The original diverges
    - id: d
      text: The terms are eventually zero
    answer:
      choiceId: c
    explanation: 'Solution: A positive finite limit transfers harmonic divergence to the original series. Therefore the answer is The original diverges.


      Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.


      Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.


      Why the other choices fail: The original converges conflicts with this criterion: Direct comparison uses nonnegative terms; The test is inconclusive conflicts with this criterion: Direct comparison uses nonnegative terms; The terms are eventually zero conflicts with this criterion: Direct comparison uses nonnegative terms.'
  - id: adv-series-s004
    title: Explain the result
    instruction: 'Name the behavior and the threshold.

      '
    type: freeResponse
    issueSignals:
    - id: series-test-selection-error
    - id: integral-test-error
    - id: ratio-test-evaluation-error
    - id: limit-evaluation-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: 'Write the final convergence reasoning.

      '
    answer:
      expected: 'The terms are positive and asymptotic to $1/n$. By limit comparison with the divergent harmonic series, the given series diverges.

        '
      gradingMode: selfCheck
      keyPoints:
      - Mentions positive terms
      - Compares to $1/n$
      - Names harmonic divergence
      - States divergence
    explanation: |-
      Solution: Related topic: asymptotic comparison and p-series thresholds. Therefore the answer is The terms are positive and asymptotic to $1/n$. By limit comparison with the divergent harmonic series, the given series diverges.
