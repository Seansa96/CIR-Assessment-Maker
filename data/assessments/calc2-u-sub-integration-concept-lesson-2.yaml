lesson:
  introduction: |-
    When performing $u$-substitution on an indefinite integral, we always substitute $x$ back in at the end. However, when evaluating a **definite integral** (an integral with upper and lower limits), we have a powerful shortcut: we can change the limits of integration!
  sections:
  - id: sec-changing-bounds
    title: Changing the Bounds
    required: true
    content: |-
      Consider the definite integral $\int_{a}^{b} f(g(x)) g'(x) \, dx$. 
      
      The limits $a$ and $b$ are $x$-values (meaning $x=a$ and $x=b$). When we make the substitution $u = g(x)$, the entire integral shifts from "x-world" into "u-world".
      
      Therefore, the limits of integration must also be converted into $u$-values!
      - The new lower limit is $u_1 = g(a)$.
      - The new upper limit is $u_2 = g(b)$.
      
      The integral becomes $\int_{g(a)}^{g(b)} f(u) \, du$.
      
      **The Shortcut:** Because you changed the bounds to be in terms of $u$, you **do not** need to substitute $x$ back in at the end! You can simply evaluate the antiderivative directly at the new $u$-bounds.

  - id: sec-example
    title: A Complete Example
    required: true
    content: |-
      Let's evaluate $\int_{0}^{2} 2x(x^2 + 1)^3 \, dx$.
      
      **1. Substitute:** Let $u = x^2 + 1$. Then $du = 2x \, dx$.
      **2. Change Bounds:** 
         - Lower bound: $x = 0 \implies u = (0)^2 + 1 = 1$.
         - Upper bound: $x = 2 \implies u = (2)^2 + 1 = 5$.
      **3. Rewrite and Integrate:**
         $$\int_{1}^{5} u^3 \, du = \left[ \frac{1}{4}u^4 \right]_{1}^{5}$$
      **4. Evaluate:**
         $$\frac{1}{4}(5)^4 - \frac{1}{4}(1)^4 = \frac{625}{4} - \frac{1}{4} = \frac{624}{4} = 156$$
         
      Notice how we never had to write $(x^2+1)^4$!

questions:
- id: q-calc2-usub2-1
  title: Concept Check - Finding New Bounds
  prompt: |-
    You are evaluating $\int_{1}^{e} \frac{\ln(x)}{x} \, dx$. You choose $u = \ln(x)$. What are the new limits of integration for the $u$-integral?
  type: multipleChoice
  choices:
  - id: c1
    text: From $1$ to $e$
  - id: c2
    text: From $0$ to $1$
  - id: c3
    text: From $\ln(1)$ to $\ln(e^2)$
  answer:
    choiceId: c2
  explanation: |-
    Plug the original $x$-bounds into the $u$ equation: $u = \ln(x)$.
    Lower bound: $u = \ln(1) = 0$.
    Upper bound: $u = \ln(e) = 1$.
    The new limits are from $0$ to $1$.
  skills:
  - calc2-u-sub-integration

- id: q-calc2-usub2-2
  title: Concept Check - The Return to X
  prompt: |-
    True or False: When evaluating a definite integral using $u$-substitution, if you change the limits of integration to be in terms of $u$, you MUST substitute the $x$-expression back in before evaluating using the Fundamental Theorem of Calculus.
  type: multipleChoice
  choices:
  - id: c1
    text: True
  - id: c2
    text: False
  answer:
    choiceId: c2
  explanation: |-
    **False**. The entire purpose of changing the bounds is so that you NEVER have to return to $x$. You simply evaluate the antiderivative directly using the new $u$-bounds.
  skills:
  - calc2-u-sub-integration
