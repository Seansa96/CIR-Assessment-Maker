questions:
- id: q001
  type: multipleChoice
  prompt: What is the tangent plane form at $(a,b,f(a,b))$?
  choices:
  - id: a
    text: $z-f(a,b)=f_x(a,b)(x-a)+f_y(a,b)(y-b)$
  - id: b
    text: $z=f_xx+f_yy$
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: $z=f(a,b)$ only
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: $z=f_x+f_y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: The plane matches the value and both slice slopes.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
