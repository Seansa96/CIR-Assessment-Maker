- id: q004
  type: multipleChoice
  prompt: For $f=x+y$, what is the tangent plane?
  choices:
  - id: a
    text: $z=x+y$
  - id: b
    text: $z=x^2+y^2$
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: $z=0$
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: $z=x-y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: A linear function equals its own tangent plane.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Choice b, ''$z=x^2+y^2$'', does not give ''$z=x+y$'' for ''For $f=x+y$, what is the tangent
