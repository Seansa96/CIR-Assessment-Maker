id: calc-geom-multipart-scenario
title: Application Scenarios
assessmentType: workedExample
categoryId: calculus-2
workedExamples:
- id: reservoir-scenario
  title: Reservoir Volume from Table Data
  problem: 'A reservoir has a depth of 40 meters. The cross-sectional area $A(h)$
    in square meters at various heights $h$ from the bottom is given by a table. We
    will estimate the volume.


    $h=0: A=100$

    $h=10: A=150$

    $h=20: A=220$

    $h=30: A=310$

    $h=40: A=450$'
  steps:
  - id: step-reservoir-scenario-1
    title: Identify the integral
    instruction: Write the integral for the volume.
    type: multipleChoice
    prompt: Which integral represents the total volume of the reservoir?
    choices:
    - id: a
      text: $\int_0^{40} A(h) \, dh$
    - id: b
      text: $\pi \int_0^{40} (A(h))^2 \, dh$
    answer:
      choiceId: a
    explanation: Volume is the integral of the cross-sectional area.
  - id: step-reservoir-scenario-2
    title: Left Riemann Sum
    instruction: Calculate L4
    type: numericResponse
    prompt: Estimate the volume using a Left Riemann Sum with 4 subintervals ($\Delta
      h = 10$).
    answer:
      gradingMode: auto
      tolerance: 0
      value: 7800
    explanation: $10 \times (100 + 150 + 220 + 310) = 7800$
