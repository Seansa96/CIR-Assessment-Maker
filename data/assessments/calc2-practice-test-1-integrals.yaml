  prompt: 'Use substitution to evaluate:


    $$

    \int_0^1 x^2(1-x^3)^5\,dx

    $$

    '
  answer:
    expectedLatex: \frac{1}{18}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Use $u=1-x^3$, so $du=-3x^2\,dx$. The bounds change from $x=0$ to
    $u=1$ and from $x=1$ to $u=0$:


    $$

    -\frac{1}{3}\int_1^0 u^5\,du=\frac{1}{3}\int_0^1 u^5\,du=\frac{1}{18}.

    $$


    Related topic: definite substitution with changed bounds.

    '
