  - practice-test-1-integrals
  prompt: 'Use substitution to evaluate:


    $$

    \int_0^1 \frac{e^x}{1+e^{2x}}\,dx

    $$

    '
  answer:
    expectedLatex: \arctan(e)-\frac{\pi}{4}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Use $u=e^x$, so $du=e^x\,dx$. The bounds become $u=1$ and $u=e$:


    $$

    \int_1^e\frac{1}{1+u^2}\,du=\arctan(e)-\arctan(1).

    $$


    Since $\arctan(1)=\pi/4$, the value is $\arctan(e)-\pi/4$.


    Related topic: definite substitution into inverse tangent.

    '
