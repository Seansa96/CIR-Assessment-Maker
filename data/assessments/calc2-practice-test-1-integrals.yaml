- id: q001
  type: multipleChoice
  issueSignals:
  - id: improper-integral-bounds-error
  - id: p-series-misidentified
  - id: integral-test-error
  - id: limit-evaluation-error
  - id: logarithm-property-misapplied
  - id: domain-range-misidentified
  skills:
  - practice-test-1-integrals
  prompt: 'Concept check: which feature is the strongest signal that an integral is
    likely a substitution problem?

    '
  choices:
  - id: a
    text: The integrand contains a composed expression and a nearby derivative of
      the inside expression.
  - id: b
    text: The integrand contains a product of unrelated functions with no composition.
  - id: c
    text: The denominator factors into repeated linear terms.
  - id: d
    text: The integrand has an infinite interval.
  answer:
    choiceId: a
  explanation: 'Substitution is pattern matching for chain rule reversal. Look for
    an inside expression $g(x)$ and a factor proportional to $g''(x)\,dx$.


    Related topic: substitution pattern recognition. Technique order: identify the
    inside expression, compute its derivative, then adjust constants.

    '
- id: q002
  type: symbolicResponse
  issueSignals:
  - id: improper-integral-bounds-error
  - id: p-series-misidentified
  - id: integral-test-error
  - id: limit-evaluation-error
  - id: logarithm-property-misapplied
  - id: domain-range-misidentified
  skills:
  - practice-test-1-integrals
  prompt: 'Use substitution to evaluate:


    $$

    \int \frac{\cos x}{\sin^2 x+1}\,dx

    $$

    '
  media:
  - type: image
    src: /assessments/practice-test-1-integrals/testprac1.png
    alt: Canvas substitution practice problems.
    caption: Substitution practice source image.
  answer:
    expectedLatex: \arctan(\sin x)+C
    equivalenceMode: derivative
    variables:
    - x
    tolerance: 0
  explanation: 'Use $u=\sin x$, so $du=\cos x\,dx$. The integral becomes


    $$

    \int \frac{1}{u^2+1}\,du=\arctan u+C.

    $$


    Substitute back to get $\arctan(\sin x)+C$.


    Related topic: arctangent substitution form.

    '
- id: q003
  type: symbolicResponse
