  - practice-test-1-integrals
  prompt: 'Use substitution to evaluate:


    $$

    \int \frac{x}{\sqrt{81-x^4}}\,dx

    $$

    '
  answer:
    expectedLatex: \frac{1}{2}\arcsin\left(\frac{x^2}{9}\right)+C
    equivalenceMode: derivative
    variables:
    - x
    tolerance: 0
  explanation: 'Use $u=x^2$, so $du=2x\,dx$. Then


    $$

    \int \frac{x}{\sqrt{81-x^4}}\,dx

    =

    \frac{1}{2}\int\frac{1}{\sqrt{81-u^2}}\,du.

    $$


    The inverse-sine form gives $\frac{1}{2}\arcsin(u/9)+C$.


    Related topic: inverse sine integral pattern.

    '
