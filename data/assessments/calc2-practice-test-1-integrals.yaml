  prompt: 'Use integration by parts to evaluate:


    $$

    \int x\sec^2 x\,dx

    $$

    '
  media:
  - type: image
    src: /assessments/practice-test-1-integrals/testprac2.png
    alt: Canvas integration by parts practice problems.
    caption: Integration by parts practice source image.
  answer:
    expectedLatex: x\tan x+\ln|\cos x|+C
    equivalenceMode: derivative
    variables:
    - x
    tolerance: 0
  explanation: 'Choose $u=x$ and $dv=\sec^2x\,dx$. Then $du=dx$ and $v=\tan x$:


    $$

    \int x\sec^2x\,dx=x\tan x-\int\tan x\,dx.

    $$


    Since $\int\tan x\,dx=-\ln|\cos x|$, the result is $x\tan x+\ln|\cos x|+C$.


    Related topic: LIATE-style integration by parts selection.

    '
