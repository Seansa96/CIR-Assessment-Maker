    equivalenceMode: derivative
    variables:
    - x
    tolerance: 0
  explanation: 'Use $u=\cos x$, so $du=-\sin x\,dx$. The negative sign is the key
    bookkeeping step:


    $$

    -\int e^u\,du=-e^u+C.

    $$


    Related topic: substitution with a negative derivative.

    '
- id: q007
