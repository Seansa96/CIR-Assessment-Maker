schemaVersion: 1
categoryId: "calculus-2"
subcategoryIds:
  - "parametric-curves"
id: test-graphing-assessment
title: Test Graphing Functionality
assessmentType: quiz
questions:
  - id: test-graph-001
    type: graphingResponse
    prompt: Draw a parabola passing through (-2, 0) and (2, 0) with a vertex at (0, -4).
    answer:
      graphingAnswer:
        features:
          - type: ShapeType
            stringValue: parabola
            weight: 1.0
          - type: PassesThrough
            pointValue: { x: -2.0, y: 0.0 }
            tolerance: 0.2
            weight: 1.0
          - type: PassesThrough
            pointValue: { x: 2.0, y: 0.0 }
            tolerance: 0.2
            weight: 1.0
          - type: Vertex
            pointValue: { x: 0.0, y: -4.0 }
            tolerance: 0.2
            weight: 1.0
    explanation: The x-intercepts are at x = -2 and x = 2, and the vertex is at (0, -4).
