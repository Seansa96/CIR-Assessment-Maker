schemaVersion: 1
id: aops-quadrilaterals-glossary
title: Quadrilaterals Glossary
assessmentType: glossary
categoryId: art-of-problem-solving
topicId: aops-quadrilaterals
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: learn
  activityType: glossary
  tags: [art-of-problem-solving, aops-quadrilaterals, geometry, quadrilateral-terminology]
skills:
- Recognize quadrilateral classifications and their defining conditions
- Interpret side, angle, diagonal, and midsegment vocabulary
- Distinguish a theorem from its converse and from a sufficient classification test
glossary:
  introduction: |
    These terms carry proof obligations. Learn each definition together with what it guarantees and what it does not guarantee.
  sections:
  - id: aops-quadrilaterals-terms
    title: Quadrilateral Structure and Classification Terms
    required: true
    content: Use the definitions to translate diagram markings into statements before selecting a theorem.
    entries:
    - id: quadrilateral
      term: Quadrilateral
      definition: A polygon with four sides and four vertices; its four interior angles total $360^\circ$.
      notation: '$ABCD$'
      examples: [A diagonal divides a convex quadrilateral into two triangles.]
      aliases: []
      media: []
      tags: [quadrilateral, aops-quadrilaterals]
      drills:
      - id: quadrilateral-definition-drill
        type: typed
        prompt: What is a four-sided polygon called?
        answer: {expected: quadrilateral, aliases: [four-sided polygon]}
        explanation: A quadrilateral has four sides and four vertices.
        tags: [quadrilateral, aops-quadrilaterals]
    - id: convex-quadrilateral
      term: Convex quadrilateral
      definition: A quadrilateral whose interior angles are all less than $180^\circ$ and whose diagonals lie inside the figure.
      notation: ''
      examples: [Rectangles and ordinary parallelograms are convex.]
      aliases: [convex]
      media: []
      tags: [convexity, aops-quadrilaterals]
      drills:
      - id: convex-quadrilateral-definition-drill
        type: typed
        prompt: What term describes a quadrilateral with both diagonals inside it and no reflex interior angle?
        answer: {expected: convex quadrilateral, aliases: [convex]}
        explanation: Convexity keeps every interior angle below 180 degrees.
        tags: [convexity, aops-quadrilaterals]
    - id: concave-quadrilateral
      term: Concave quadrilateral
      definition: A quadrilateral with one interior reflex angle greater than $180^\circ$; one diagonal lies partly outside it.
      notation: ''
      examples: [A dart-shaped quadrilateral may be concave.]
      aliases: [concave]
      media: []
      tags: [concavity, aops-quadrilaterals]
      drills:
      - id: concave-quadrilateral-definition-drill
        type: typed
        prompt: What term describes a quadrilateral with an interior angle greater than $180^\circ$?
        answer: {expected: concave quadrilateral, aliases: [concave]}
        explanation: The angle greater than 180 degrees is a reflex angle and makes the figure concave.
        tags: [concavity, aops-quadrilaterals]
    - id: diagonal
      term: Diagonal
      definition: A segment joining two nonadjacent vertices of a polygon.
      notation: '$AC$ or $BD$ in $ABCD$'
      examples: [Diagonal $AC$ divides quadrilateral $ABCD$ into two triangles.]
      aliases: []
      media: []
      tags: [diagonal, aops-quadrilaterals]
      drills:
      - id: diagonal-definition-drill
        type: typed
        prompt: What is a segment joining nonadjacent polygon vertices called?
        answer: {expected: diagonal, aliases: []}
        explanation: Adjacent vertices determine a side; nonadjacent vertices determine a diagonal.
        tags: [diagonal, aops-quadrilaterals]
    - id: opposite-sides
      term: Opposite sides
      definition: Two sides of a quadrilateral that share no vertex.
      notation: '$AB$ and $CD$'
      examples: [A parallelogram has two pairs of opposite parallel sides.]
      aliases: []
      media: []
      tags: [opposite-sides, aops-quadrilaterals]
      drills:
      - id: opposite-sides-definition-drill
        type: typed
        prompt: What are two quadrilateral sides with no common endpoint called?
        answer: {expected: opposite sides, aliases: []}
        explanation: Opposite sides do not meet at a vertex.
        tags: [opposite-sides, aops-quadrilaterals]
    - id: consecutive-angles
      term: Consecutive angles
      definition: Two interior angles at endpoints of the same side; in a parallelogram they are supplementary.
      notation: '$\angle A$ and $\angle B$'
      examples: [If one parallelogram angle is $68^\circ$, either consecutive angle is $112^\circ$.]
      aliases: [adjacent angles]
      media: []
      tags: [consecutive-angles, aops-quadrilaterals]
      drills:
      - id: consecutive-angles-definition-drill
        type: typed
        prompt: What are interior angles at the endpoints of the same quadrilateral side called?
        answer: {expected: consecutive angles, aliases: [adjacent angles]}
        explanation: They occur next to one another around the boundary.
        tags: [consecutive-angles, aops-quadrilaterals]
    - id: parallelogram
      term: Parallelogram
      definition: A quadrilateral with both pairs of opposite sides parallel.
      notation: '$AB\parallel CD$ and $BC\parallel AD$'
      examples: [Its opposite sides and angles are congruent, and its diagonals bisect each other.]
      aliases: []
      media: []
      tags: [parallelogram, aops-quadrilaterals]
      drills:
      - id: parallelogram-definition-drill
        type: typed
        prompt: Which quadrilateral has two pairs of opposite parallel sides by definition?
        answer: {expected: parallelogram, aliases: []}
        explanation: Parallelism of both opposite pairs is the defining condition.
        tags: [parallelogram, aops-quadrilaterals]
    - id: rectangle
      term: Rectangle
      definition: A parallelogram with four right angles.
      notation: ''
      examples: [Its diagonals are congruent and bisect each other.]
      aliases: []
      media: []
      tags: [rectangle, aops-quadrilaterals]
      drills:
      - id: rectangle-definition-drill
        type: typed
        prompt: What is a parallelogram with four right angles called?
        answer: {expected: rectangle, aliases: []}
        explanation: Four right angles specialize a parallelogram to a rectangle.
        tags: [rectangle, aops-quadrilaterals]
    - id: rhombus
      term: Rhombus
      definition: A parallelogram with four congruent sides.
      notation: ''
      examples: [Its diagonals are perpendicular and bisect opposite angles.]
      aliases: [rhombi]
      media: []
      tags: [rhombus, aops-quadrilaterals]
      drills:
      - id: rhombus-definition-drill
        type: typed
        prompt: What is a parallelogram with four congruent sides called?
        answer: {expected: rhombus, aliases: [rhombi]}
        explanation: Equal side lengths are the added defining restriction.
        tags: [rhombus, aops-quadrilaterals]
    - id: square
      term: Square
      definition: A parallelogram with four congruent sides and four right angles; equivalently, both a rectangle and a rhombus.
      notation: ''
      examples: [Its diagonals are congruent, perpendicular, and mutually bisecting.]
      aliases: []
      media: []
      tags: [square, aops-quadrilaterals]
      drills:
      - id: square-definition-drill
        type: typed
        prompt: Which quadrilateral is simultaneously a rectangle and a rhombus?
        answer: {expected: square, aliases: []}
        explanation: A square combines the angle and side restrictions of both families.
        tags: [square, aops-quadrilaterals]
    - id: trapezoid
      term: Trapezoid
      definition: Under the inclusive convention, a quadrilateral with at least one pair of opposite parallel sides.
      notation: '$AB\parallel CD$'
      examples: [A parallelogram is a special trapezoid under the inclusive definition.]
      aliases: []
      media: []
      tags: [trapezoid, aops-quadrilaterals]
      drills:
      - id: trapezoid-definition-drill
        type: typed
        prompt: Under the inclusive convention, what quadrilateral has at least one opposite parallel pair?
        answer: {expected: trapezoid, aliases: []}
        explanation: Some sources use exactly one pair, so the convention must be stated.
        tags: [trapezoid, aops-quadrilaterals]
    - id: bases
      term: Bases of a trapezoid
      definition: The designated parallel pair of sides of a trapezoid; a parallelogram permits either opposite pair to be designated as bases.
      notation: '$b_1,b_2$'
      examples: [The area is $\tfrac12(b_1+b_2)h$.]
      aliases: [bases]
      media: []
      tags: [trapezoid-bases, aops-quadrilaterals]
      drills:
      - id: bases-definition-drill
        type: typed
        prompt: What are the parallel sides of a trapezoid called?
        answer: {expected: bases, aliases: [bases of a trapezoid]}
        explanation: The other two sides are its legs.
        tags: [trapezoid-bases, aops-quadrilaterals]
    - id: legs
      term: Legs of a trapezoid
      definition: The two sides not designated as bases; in a non-parallelogram trapezoid, these legs are nonparallel.
      notation: ''
      examples: [An isosceles trapezoid has congruent legs.]
      aliases: [legs]
      media: []
      tags: [trapezoid-legs, aops-quadrilaterals]
      drills:
      - id: legs-definition-drill
        type: typed
        prompt: What are the nonparallel sides of a trapezoid called?
        answer: {expected: legs, aliases: [legs of a trapezoid]}
        explanation: They connect the two parallel bases.
        tags: [trapezoid-legs, aops-quadrilaterals]
    - id: isosceles-trapezoid
      term: Isosceles trapezoid
      definition: In this curriculum, a non-parallelogram trapezoid whose legs are congruent; its base-angle pairs and diagonals are congruent.
      notation: ''
      examples: [Dropping altitudes forms congruent corner right triangles.]
      aliases: []
      media: []
      tags: [isosceles-trapezoid, aops-quadrilaterals]
      drills:
      - id: isosceles-trapezoid-definition-drill
        type: typed
        prompt: What is a trapezoid with congruent legs called?
        answer: {expected: isosceles trapezoid, aliases: []}
        explanation: Equal legs force equal base-angle pairs and equal diagonals.
        tags: [isosceles-trapezoid, aops-quadrilaterals]
    - id: trapezoid-midsegment
      term: Trapezoid midsegment
      definition: The segment joining the midpoints of the legs; it is parallel to both bases and has length $(b_1+b_2)/2$.
      notation: '$m=\tfrac12(b_1+b_2)$'
      examples: [Bases 10 and 18 give midsegment 14.]
      aliases: [median of a trapezoid, midline]
      media: []
      tags: [trapezoid-midsegment, aops-quadrilaterals]
      drills:
      - id: trapezoid-midsegment-definition-drill
        type: typed
        prompt: What segment joins the midpoints of a trapezoid's legs?
        answer: {expected: trapezoid midsegment, aliases: [midsegment, median of a trapezoid, midline]}
        explanation: Its length is the arithmetic mean of the base lengths.
        tags: [trapezoid-midsegment, aops-quadrilaterals]
    - id: kite
      term: Kite
      definition: A quadrilateral with two distinct pairs of adjacent congruent sides.
      notation: ''
      examples: [One kite diagonal perpendicularly bisects the other.]
      aliases: []
      media: []
      tags: [kite, aops-quadrilaterals]
      drills:
      - id: kite-definition-drill
        type: typed
        prompt: What quadrilateral has two pairs of adjacent congruent sides?
        answer: {expected: kite, aliases: []}
        explanation: Adjacent, not opposite, equal-side pairs define a kite.
        tags: [kite, aops-quadrilaterals]
    - id: orthodiagonal
      term: Orthodiagonal quadrilateral
      definition: A quadrilateral whose diagonals are perpendicular; this property alone does not determine a unique family.
      notation: '$AC\perp BD$'
      examples: [Kites and rhombi are orthodiagonal.]
      aliases: [orthodiagonal]
      media: []
      tags: [orthodiagonal, aops-quadrilaterals]
      drills:
      - id: orthodiagonal-definition-drill
        type: typed
        prompt: What term describes a quadrilateral with perpendicular diagonals?
        answer: {expected: orthodiagonal quadrilateral, aliases: [orthodiagonal]}
        explanation: Perpendicular diagonals do not by themselves force a rhombus.
        tags: [orthodiagonal, aops-quadrilaterals]
    - id: converse
      term: Converse
      definition: The statement formed by exchanging a conditional theorem's hypothesis and conclusion; it needs its own proof and may be false.
      notation: '$P\Rightarrow Q$ becomes $Q\Rightarrow P$'
      examples: [Congruent diagonals do not by themselves imply rectangle.]
      aliases: [converse statement]
      media: []
      tags: [converse, aops-quadrilaterals]
      drills:
      - id: converse-definition-drill
        type: typed
        prompt: What is the statement obtained by swapping a theorem's hypothesis and conclusion called?
        answer: {expected: converse, aliases: [converse statement]}
        explanation: A theorem and its converse are logically distinct.
        tags: [converse, aops-quadrilaterals]
    - id: sufficient-condition
      term: Sufficient condition
      definition: A condition that guarantees a conclusion, though it may not be the only way to obtain that conclusion.
      notation: '$P\Rightarrow Q$'
      examples: [Diagonals bisecting each other is sufficient to prove a quadrilateral is a parallelogram.]
      aliases: [sufficient test]
      media: []
      tags: [sufficient-condition, aops-quadrilaterals]
      drills:
      - id: sufficient-condition-definition-drill
        type: typed
        prompt: What is a condition that guarantees a desired conclusion called?
        answer: {expected: sufficient condition, aliases: [sufficient test]}
        explanation: Sufficiency licenses the implication from evidence to conclusion.
        tags: [sufficient-condition, aops-quadrilaterals]
