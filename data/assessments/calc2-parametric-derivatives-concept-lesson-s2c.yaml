  - id: pd-03
    title: 3. Classify horizontal tangents
    required: true
    content: Horizontal means $dy/dt=0$ while $dx/dt\ne0$. The denominator check prevents a zero-over-zero mistake.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Horizontal tangent on a curve
      caption: 
    check:
      id: pd-03-c
      type: multipleChoice
      prompt: Which condition gives a horizontal tangent?
      choices:
      - id: a
        text: $y prime=0,x prime\ne0$
        media: []
        issueSignals: []
      - id: b
        text: $x prime=0,y prime\ne0$
        media: []
        issueSignals: []
      - id: c
        text: both zero
        media: []
        issueSignals: []
      - id: d
        text: both nonzero
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: A slope of zero has zero numerator and nonzero denominator. Why it works: The slope quotient is y-prime over x-prime. Common trap: Interchanging horizontal and vertical tests. Why the other choices fail: They give vertical, indeterminate, or ordinary slopes.'
