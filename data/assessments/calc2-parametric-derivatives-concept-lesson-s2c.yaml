navigation: { learningGoal: learn, activityType: conceptLesson, tags: [calculus-2, parametric-derivatives] }
authoring: { visualRequirement: required, visualRationale: 'Tangent direction and concavity are read from a moving curve.', sourceId: src-20260719182540-a40fdcd443 }
lesson:
  introduction: 'Parametric differentiation compares two rates: vertical change per parameter and horizontal change per parameter.'
  sections:
    - { id: pd-01, title: '1. Form the slope ratio', required: true, content: 'When $dx/dt\ne0$, use $dy/dx=(dy/dt)/(dx/dt)$. Differentiate both components before substituting a parameter value.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed curve with tangent marker }], check: { id: pd-01-c, type: multipleChoice, prompt: 'If $dx/dt=4$ and $dy/dt=-6$, what is $dy/dx$?', choices: [{ id: a, text: '$-3/2$' }, { id: b, text: '$-2/3$' }, { id: c, text: '10' }, { id: d, text: '-10' }], answer: { choiceId: a }, explanation: 'Solution: Divide vertical rate by horizontal rate: negative six over four equals negative three halves. Why it works: Slope is dy per dx. Common trap: Reversing the quotient. Why the other choices fail: They reverse, add, or subtract the rates.' } }
    - { id: pd-02, title: '2. Find the point as well as the slope', required: true, content: 'A tangent line needs $(x(a),y(a))$ and the slope at the same parameter $a$.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Tangent touching a point on a parametric curve }], check: { id: pd-02-c, type: multipleChoice, prompt: 'Which data completes a tangent line after finding its slope?', choices: [{ id: a, text: 'the point at that parameter' }, { id: b, text: 'only the Cartesian locus' }, { id: c, text: 'a new parameter interval' }, { id: d, text: 'the arc length' }], answer: { choiceId: a }, explanation: 'Solution: Use x(a) and y(a) with the slope in point-slope form. Why it works: A nonvertical line is determined by a point and slope. Common trap: Reporting a slope alone. Why the other choices fail: They do not locate the tangent.' } }
    - { id: pd-03, title: '3. Classify horizontal tangents', required: true, content: 'Horizontal means $dy/dt=0$ while $dx/dt\ne0$. The denominator check prevents a zero-over-zero mistake.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Horizontal tangent on a curve }], check: { id: pd-03-c, type: multipleChoice, prompt: 'Which condition gives a horizontal tangent?', choices: [{ id: a, text: '$y prime=0,x prime\ne0$' }, { id: b, text: '$x prime=0,y prime\ne0$' }, { id: c, text: 'both zero' }, { id: d, text: 'both nonzero' }], answer: { choiceId: a }, explanation: 'Solution: A slope of zero has zero numerator and nonzero denominator. Why it works: The slope quotient is y-prime over x-prime. Common trap: Interchanging horizontal and vertical tests. Why the other choices fail: They give vertical, indeterminate, or ordinary slopes.' } }
    - { id: pd-04, title: '4. Classify vertical tangents', required: true, content: 'Vertical means $dx/dt=0$ while $dy/dt\ne0$. The slope is nonzero divided by zero.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Vertical tangent on a curve }], check: { id: pd-04-c, type: multipleChoice, prompt: 'If x-prime is zero and y-prime is 5, the tangent is:', choices: [{ id: a, text: 'vertical' }, { id: b, text: 'horizontal' }, { id: c, text: 'undefined curve' }, { id: d, text: 'slope 5' }], answer: { choiceId: a }, explanation: 'Solution: The slope is five over zero, so the tangent is vertical. Why it works: Horizontal motion stops while vertical motion continues. Common trap: Calling the slope 5. Why the other choices fail: They reverse or misinterpret the rate condition.' } }
    - { id: pd-05, title: '5. Treat simultaneous zeros as a separate case', required: true, content: 'If both component derivatives vanish, the quotient is $0/0$. Simplify, inspect nearby slopes, or use higher derivatives before classifying the point.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Curve with a possible cusp }], check: { id: pd-05-c, type: freeResponse, prompt: 'Why is $x prime=y prime=0$ not enough to declare a horizontal tangent?', answer: { gradingMode: selfCheck, keyPoints: ['zero over zero is indeterminate', 'inspect nearby behavior or simplify'] }, explanation: 'Solution: The slope form is zero over zero, which is indeterminate. Why it works: Neither numerator nor denominator gives a direction by itself. Common trap: Calling every stopped parameter a horizontal tangent.' } }
    - { id: pd-06, title: '6. Differentiate the slope again for concavity', required: true, content: 'Use $d^2y/dx^2=[d(dy/dx)/dt]/(dx/dt)$. It measures how slope changes as x changes.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Concave up and concave down curve segments }], check: { id: pd-06-c, type: multipleChoice, prompt: 'Why divide by x-prime again when finding the second derivative?', choices: [{ id: a, text: 'the first derivative must change per x, not per t' }, { id: b, text: 'to square the slope' }, { id: c, text: 'to find arc length' }, { id: d, text: 'to remove y' }], answer: { choiceId: a }, explanation: 'Solution: Differentiate the slope with respect to t, then convert that rate to change per x. Why it works: The requested derivative is d over dx. Common trap: Stopping after differentiating with respect to t. Why the other choices fail: They describe unrelated operations.' } }
    - { id: pd-07, title: '7. Validate the derivative model', required: true, content: 'Check the point, rate conditions, excluded zero denominators, and the sign of the second derivative before drawing conclusions.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Tangent and concavity diagnostic diagram }], check: { id: pd-07-c, type: freeResponse, prompt: 'Name two checks required after solving for a candidate horizontal tangent parameter.', answer: { gradingMode: selfCheck, keyPoints: ['verify x prime nonzero', 'find point', 'check parameter domain'] }, explanation: 'Solution: Verify x-prime is nonzero and compute the actual point; also respect the parameter domain. Why it works: A candidate numerator root alone may not be a valid horizontal tangent. Common trap: Reporting parameter values instead of points when points are requested.' } }
