  - id: pd-06
    title: 6. Differentiate the slope again for concavity
    required: true
    content: Use $d^2y/dx^2=[d(dy/dx)/dt]/(dx/dt)$. It measures how slope changes as x changes.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Concave up and concave down curve segments
      caption: 
    check:
      id: pd-06-c
      type: multipleChoice
      prompt: Why divide by x-prime again when finding the second derivative?
      choices:
      - id: a
        text: the first derivative must change per x, not per t
        media: []
        issueSignals: []
      - id: b
        text: to square the slope
        media: []
        issueSignals: []
      - id: c
        text: to find arc length
        media: []
        issueSignals: []
      - id: d
        text: to remove y
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Differentiate the slope with respect to t, then convert that rate to change per x. Why it works: The requested derivative is d over dx. Common trap: Stopping after differentiating with respect to t. Why the other choices fail: They describe unrelated operations.'
