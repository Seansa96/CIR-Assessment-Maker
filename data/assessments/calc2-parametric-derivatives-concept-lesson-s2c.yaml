lesson:
  introduction: 'Parametric differentiation compares two rates: vertical change per parameter and horizontal change per parameter.'
  sections:
  - id: pd-01
    title: 1. Form the slope ratio
    required: true
    content: When $dx/dt\ne0$, use $dy/dx=(dy/dt)/(dx/dt)$. Differentiate both components before substituting a parameter value.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Directed curve with tangent marker
      caption: 
    check:
      id: pd-01-c
      type: multipleChoice
      prompt: If $dx/dt=4$ and $dy/dt=-6$, what is $dy/dx$?
      choices:
      - id: a
        text: $-3/2$
        media: []
        issueSignals: []
      - id: b
        text: $-2/3$
        media: []
        issueSignals: []
      - id: c
        text: 10
        media: []
        issueSignals: []
      - id: d
        text: -10
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Divide vertical rate by horizontal rate: negative six over four equals negative three halves. Why it works: Slope is dy per dx. Common trap: Reversing the quotient. Why the other choices fail: They reverse, add, or subtract the rates.'
