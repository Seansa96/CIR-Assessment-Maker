  - id: pd-02
    title: 2. Find the point as well as the slope
    required: true
    content: A tangent line needs $(x(a),y(a))$ and the slope at the same parameter $a$.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Tangent touching a point on a parametric curve
      caption: 
    check:
      id: pd-02-c
      type: multipleChoice
      prompt: Which data completes a tangent line after finding its slope?
      choices:
      - id: a
        text: the point at that parameter
        media: []
        issueSignals: []
      - id: b
        text: only the Cartesian locus
        media: []
        issueSignals: []
      - id: c
        text: a new parameter interval
        media: []
        issueSignals: []
      - id: d
        text: the arc length
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Use x(a) and y(a) with the slope in point-slope form. Why it works: A nonvertical line is determined by a point and slope. Common trap: Reporting a slope alone. Why the other choices fail: They do not locate the tangent.'
