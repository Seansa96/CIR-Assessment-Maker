  - id: pd-04
    title: 4. Classify vertical tangents
    required: true
    content: Vertical means $dx/dt=0$ while $dy/dt\ne0$. The slope is nonzero divided by zero.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Vertical tangent on a curve
      caption: 
    check:
      id: pd-04-c
      type: multipleChoice
      prompt: 'If x-prime is zero and y-prime is 5, the tangent is:'
      choices:
      - id: a
        text: vertical
        media: []
        issueSignals: []
      - id: b
        text: horizontal
        media: []
        issueSignals: []
      - id: c
        text: undefined curve
        media: []
        issueSignals: []
      - id: d
        text: slope 5
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The slope is five over zero, so the tangent is vertical. Why it works: Horizontal motion stops while vertical motion continues. Common trap: Calling the slope 5. Why the other choices fail: They reverse or misinterpret the rate condition.'
