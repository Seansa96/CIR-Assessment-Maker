  - id: pd-05
    title: 5. Treat simultaneous zeros as a separate case
    required: true
    content: If both component derivatives vanish, the quotient is $0/0$. Simplify, inspect nearby slopes, or use higher derivatives before classifying the point.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Curve with a possible cusp
      caption: 
    check:
      id: pd-05-c
      type: freeResponse
      prompt: Why is $x prime=y prime=0$ not enough to declare a horizontal tangent?
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: selfCheck
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints:
        - zero over zero is indeterminate
        - inspect nearby behavior or simplify
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The slope form is zero over zero, which is indeterminate. Why it works: Neither numerator nor denominator gives a direction by itself. Common trap: Calling every stopped parameter a horizontal tangent.'
