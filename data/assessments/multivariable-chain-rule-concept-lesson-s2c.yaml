  - id: s07
    title: Evaluate sensitivities at the current inputs
    required: true
    content: >
      The partial derivatives are not usually constant: they depend on the intermediate input values. First use the requested point to evaluate each partial, then pair it with the rate of that same input. For $f(x,y,z)=xy+z$, the sensitivities are $f_x=y$, $f_y=x$, and $f_z=1$. At $(2,3,4)$, the gradient components are therefore $(3,2,1)$. Pair these in order with the stated rates $(1,-2,5)$ and add the products. Evaluating at the point first prevents substituting the wrong coordinate or matching a partial with another input's rate.
