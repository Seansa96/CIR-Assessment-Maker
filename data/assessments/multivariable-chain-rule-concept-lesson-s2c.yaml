  - id: s04
    title: Extend the path sum to three inputs
    required: true
    content: >
      With three inputs that all depend on $t$, make one contribution for each input:


      $\frac{dw}{dt}=f_xx'+f_yy'+f_zz'.$


      This is a sum of matched pairs: output sensitivity to $x$ times the rate of $x$, and likewise for $y$ and $z$. Keep the signs from both factors, then add. For the check, the contributions are $2(4)=8$, $(-1)(2)=-2$, and $3(-1)=-3$. This procedure scales to any number of inputs: include every changing input exactly once, and do not add a path for a variable that is constant.
