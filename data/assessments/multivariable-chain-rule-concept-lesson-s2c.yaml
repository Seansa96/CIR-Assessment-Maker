  - id: s04
    title: Worked micro-example
    required: true
    content: 'Use the short task If $z=x^2+y^2$, $x=t$, and $y=t^2$, find $dz/dt$ at $t=1$. as a model. First, find partials: What are $z_x$ and $z_y$? The resulting statement is $2x$ and $2y$. This identifies the governing relation and gives a checkable intermediate result.'
