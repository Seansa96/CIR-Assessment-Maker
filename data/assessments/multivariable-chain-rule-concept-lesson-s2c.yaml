lesson:
  introduction: Follow the dependency paths from changing inputs to the output. These checks require calculating
    each partial or path contribution; recommended prerequisites do not restrict access.
  sections:
  - id: s01
    title: Trace each changing input
    required: true
    content: When z=f(x,y) and x,y depend on t, every changing input contributes. For f=x^2+xy at (1,2), with x'=3
      and y'=-1, compute f_x=2x+y=4 and f_y=x=1, then combine the two rates.
    media:
    - type: image
      src: /media/calculus-3/multivariable-chain-rule.svg
      alt: Dependency tree from t through x and y to z, with two path products that contribute to dz/dt.
      caption: Each route from the changing input to z contributes one partial-times-rate term.
    check:
      id: check-01
      type: multipleChoice
      prompt: For these values, what is dz/dt?
      choices:
      - id: a
        text: '11'
        issueSignals: []
      - id: b
        text: '13'
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: '10'
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: '-1'
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: 11


        Why it works: The chain rule gives f_x x''+f_y y''=4(3)+1(-1)=11.


        Why the other choices fail:

        Choice b: This treats y'' as 1 instead of -1.

        Choice c: This evaluates f_y as 2 instead of x=1, giving 4(3)+2(-1).

        Choice d: This swaps the x and y rates: 4(-1)+1(3).'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s02
    title: Read the dependency tree
    required: true
    content: A tree has one branch for each route by which a changing variable reaches the output. Let z=x^2+y^3,
      x=t^2, y=t+1. At t=1, the two path products are 2x(2t) and 3y^2(1).
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: What is dz/dt at t=1?
      choices:
      - id: a
        text: '16'
        issueSignals: []
      - id: b
        text: '12'
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: '20'
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: '26'
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: 16


        Why it works: At t=1, x=1, y=2, so 2x(2t)+3y^2(1)=4+12=16.


        Why the other choices fail:

        Choice b: This omits the x path contribution 2x(2t)=4.

        Choice c: This uses x''=4 instead of x''=2.

        Choice d: This swaps the input rates, using 2(1)+12(2).'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s03
    title: Differentiate with respect to either independent variable
    required: true
    content: If w=x^2+y, x=s+t, and y=st, then w_s=2x x_s+y_s=2x+t. The other partial w_t follows its own path products;
      do not substitute one independent variable's rates for the other's.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: At (s,t)=(1,2), what is w_s?
      choices:
      - id: a
        text: '8'
        issueSignals: []
      - id: b
        text: '6'
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: '14'
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: '-4'
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: 8


        Why it works: At (1,2), x=3, so w_s=2(3)(1)+2=8.


        Why the other choices fail:

        Choice b: This omits y_s=2.

        Choice c: This uses x_s=2 instead of 1, giving 2(3)(2)+2.

        Choice d: This reverses the sign of the x-path contribution, giving -6+2.'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s04
    title: Sum all paths in a three-variable tree
    required: true
    content: For w=f(x,y,z), with x,y,z depending on t, dw/dt=f_x x'+f_y y'+f_z z'. The number of terms comes from
      the distinct input paths, not from the number of symbols in the final expression.
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: If (f_x,f_y,f_z)=(2,-1,3) and (x',y',z')=(4,2,-1), what is dw/dt?
      choices:
      - id: a
        text: '3'
        issueSignals: []
      - id: b
        text: '7'
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: '9'
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: '5'
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: 3


        Why it works: The three path products sum to 2(4)+(-1)(2)+3(-1)=3.


        Why the other choices fail:

        Choice b: This changes the negative y-path term into a positive contribution.

        Choice c: This reverses the sign of the z-path term: 8-2+3.

        Choice d: This omits the y path, leaving 8-3.'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s05
    title: Differentiate an implicit relation
    required: true
    content: An equation F(x,y)=constant defines a dependency even when y is not isolated. Differentiate each term
      with respect to x and use the chain rule whenever a term contains y(x). For x^2+xy+y^2=7, the y-dependent
      terms contribute y+xy' and 2yy'.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: After differentiating x^2+xy+y^2=7, which equation results?
      choices:
      - id: a
        text: 2x+y+xy'+2yy'=0
        issueSignals: []
      - id: b
        text: 2x+xy'+2yy'=0
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: 2x+y+xy'+2y=0
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: 2x+y+xy'+yy'=0
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: 2x+y+xy''+2yy''=0


        Why it works: Differentiate xy by the product rule and y^2 by the chain rule; the constant right side has
        derivative zero.


        Why the other choices fail:

        Choice b: This omits the y term produced by differentiating the x factor in xy.

        Choice c: This treats y'' as 1 when differentiating y^2.

        Choice d: This misses the factor 2 from differentiating y^2.'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s06
    title: Solve the implicit derivative
    required: true
    content: After differentiating, collect every y' term on one side. For the relation above, (x+2y)y'=-(2x+y),
      provided x+2y is nonzero.
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: At (1,2), what is dy/dx?
      choices:
      - id: a
        text: -4/5
        issueSignals: []
      - id: b
        text: 4/5
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: -5/4
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: -1/5
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: -4/5


        Why it works: Substitution gives 5y''=-4, hence y''=-4/5.


        Why the other choices fail:

        Choice b: This loses the negative sign when moving 2x+y across the equality.

        Choice c: This inverts the coefficient ratio.

        Choice d: This substitutes 2x+y=1 instead of 4.'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s07
    title: Keep the evaluation point visible
    required: true
    content: Partial derivatives in a chain rule are evaluated at the current intermediate inputs. When x,y,z depend
      on t, first find their values at the requested t, then evaluate the partial derivatives there before multiplying
      by the rates.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: For f=xy+z at (2,3,4) and rates (1,-2,5), what is df/dt?
      choices:
      - id: a
        text: '4'
        issueSignals: []
      - id: b
        text: '-2'
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: '2'
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: '1'
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: 4


        Why it works: The chain rule gives 3(1)+2(-2)+1(5)=4.


        Why the other choices fail:

        Choice b: This swaps f_x and f_y before multiplying by the stated input rates.

        Choice c: This uses f_y=3 instead of x=2, giving 3-6+5.

        Choice d: This swaps the x and y rates, giving 3(-2)+2(1)+5.'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
  - id: s08
    title: Check the quantity and units
    required: true
    content: The chain rule's output is a scalar rate with respect to the stated independent variable. Its units
      are output units per unit of t. A final check catches swapped rates, missing paths, and a derivative reported
      in the wrong variable.
    media: []
    check:
      id: check-08
      type: multipleChoice
      prompt: If temperature T is in °C, x,y are measured in meters, and x(t),y(t) vary with t in seconds, what
        are the units of dT/dt?
      choices:
      - id: a
        text: °C/s
        issueSignals: []
      - id: b
        text: °C·m/s
        issueSignals:
        - id: chain-rule-missed
      - id: c
        text: m/s
        issueSignals:
        - id: chain-rule-missed
      - id: d
        text: s/°C
        issueSignals:
        - id: chain-rule-missed
      answer:
        choiceId: a
      explanation: 'Solution: °C/s


        Why it works: Each partial has units °C/m and each input rate has units m/s, leaving °C/s after summation.


        Why the other choices fail:

        Choice b: This multiplies by distance instead of using the chain rule''s unit cancellations.

        Choice c: This reports an input speed, not the output rate.

        Choice d: This reverses the derivative''s units.'
      issueSignals:
      - id: chain-rule-missed
      difficultyDimensions:
      - representationTransfer
      - auxiliaryTechnique
