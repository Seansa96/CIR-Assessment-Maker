  - id: s05
    title: Treat an implicit equation as a dependency
    required: true
    content: >
      A relation such as $x^2+xy+y^2=7$ can describe a curve even when solving explicitly for $y$ would be awkward. Locally, regard $y$ as a function $y(x)$ and differentiate both sides with respect to $x$. Use ordinary rules on explicit $x$ factors, and the chain rule on every occurrence of $y(x)$. For example, the product rule gives $\frac{d}{dx}(xy)=y+xy'$, and the chain rule gives $\frac{d}{dx}(y^2)=2yy'$. Also differentiate the explicit $x^2$ term and the constant right side. Then assemble these term-by-term derivatives into one equation equal to zero. The derivative equation records how $y$ must change as $x$ moves along the relation.
