  - id: s08
    title: Check the rate and its units
    required: true
    content: >
      The result is the rate of change of the output with respect to the chosen independent variable. Use dimensions as a check: if an output $Z$ has units $[Z]$, an input $X$ has units $[X]$, and the independent variable $t$ has units $[t]$, then $Z_X$ has units $[Z]/[X]$ while $X'$ has units $[X]/[t]$. Their product has units $[Z]/[t]$. Every path contribution must have the same output-per-time units before the terms can be added. Apply this cancellation to the units in the question; a mismatch often signals that a rate was swapped, a factor was omitted, or the derivative was taken with respect to the wrong variable.
