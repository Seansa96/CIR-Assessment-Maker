    title: Add path contributions
    required: true
    content: The total derivative is the sum of each partial derivative times its corresponding input rate. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
