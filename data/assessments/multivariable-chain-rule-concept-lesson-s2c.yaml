lesson:
  introduction: >
    Before this lesson, you should be comfortable finding ordinary derivatives with the power and product rules, and using the single-variable chain rule. In $y=f(x(t))$, the inner quantity $x$ changes with $t$, so the output rate is $\frac{dy}{dt}=f'(x)\frac{dx}{dt}$. The multivariable version answers the same question when an output depends on several changing inputs: identify every route by which the independent variable can affect the output, find the rate along each route, and add those contributions. We do this because a changing input affects the output according to both how sensitive the output is to that input and how quickly that input is changing.
  sections:
  - id: s01
    title: Start with the single-variable chain rule
    required: true
    content: >
      The single-variable rule multiplies an outer derivative by the rate of its inner input. With two changing inputs, do that once for each input and add the results:


      $\frac{dz}{dt}=f_x\frac{dx}{dt}+f_y\frac{dy}{dt}.$


      Here $f_x$ and $f_y$ measure how sensitive $z$ is to each input at the current point, while $x'=\frac{dx}{dt}$ and $y'=\frac{dy}{dt}$ tell how fast those inputs move as $t$ changes. These rates come from the input functions, not from the current input values. For example, if $x(t)=1+3t$ and $y(t)=2-t$, then at $t=0$ the inputs are $x=1$ and $y=2$, while their rates are $x'=3$ and $y'=-1$. The values locate the point where we evaluate sensitivity; the derivatives tell how the point is moving. For $f=x^2+xy$ at $(x,y)=(1,2)$, first find $f_x=2x+y=4$ and $f_y=x=1$. Then multiply each sensitivity by its matching input rate and add. The two products can reinforce or oppose one another because an input rate may be negative.
    media:
    - type: image
      src: /media/calculus-3/multivariable-chain-rule.svg
      alt: Dependency tree from t through x and y to z, with two path products that contribute to dz/dt.
      caption: Each route from the changing input to z contributes one partial-times-rate term.
