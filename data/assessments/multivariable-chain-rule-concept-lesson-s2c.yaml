  - id: s02
    title: Trace and calculate each path
    required: true
    content: >
      A dependency tree is a bookkeeping tool: draw an arrow from $t$ to each quantity that depends directly on it, then an arrow from each intermediate quantity to the output. Each complete route contributes one product of derivatives. For $z=x^2+y^3$, with $x=t^2$ and $y=t+1$, the routes are $t\to x\to z$ and $t\to y\to z$. Their contributions are $z_xx'=2x(2t)$ and $z_yy'=3y^2(1)$. At the requested value $t=1$, evaluate the intermediate inputs first: $x=1$ and $y=2$. Substitution gives the rate from each route at the same instant. Adding both is necessary because changing $t$ changes both $x$ and $y$.
