  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 1 → Classical Theorems of Differential Calculus if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Track dependencies
    required: true
    content: 'When x and y depend on t, a change in t reaches z through every dependency path. In The Multivariable Chain Rule, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
