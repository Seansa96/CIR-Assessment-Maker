  - id: s03
    title: Choose which independent variable changes
    required: true
    content: >
      Sometimes the intermediate inputs depend on two independent variables, such as $s$ and $t$. To find $w_s$, vary $s$ while holding $t$ fixed; to find $w_t$, vary $t$ while holding $s$ fixed. Apply the chain rule only along the paths that change with the chosen variable. For $w=x^2+y$, $x=s+t$, and $y=st$, the $s$-paths give


      $w_s=w_xx_s+w_yy_s=2x(1)+1(t)=2x+t.$


      At $(s,t)=(1,2)$, first evaluate $x=s+t=3$, then substitute it. Holding the other independent variable fixed matters: $x_s=1$ and $y_s=t$, while the corresponding $t$-rates are different.
