  - id: s06
    title: Isolate the rate you need
    required: true
    content: >
      After differentiating, collect all terms containing $y'$ on one side and factor out $y'$. For this relation, the coefficient of $y'$ is $x+2y$, and the remaining terms move to the other side with their signs reversed. Divide by $x+2y$ only when it is nonzero:


      $y'=-\frac{2x+y}{x+2y}.$


      To use the formula at a point, substitute both coordinates into the numerator and denominator, then simplify the quotient. Isolating $y'$ converts the differentiated relation into the rate of vertical change per unit horizontal change.
