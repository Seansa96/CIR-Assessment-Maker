workedExamples:
- id: we-spring-energy
  title: Calculating Potential Energy
  problem: |
    Let's use the formula $U_s = \frac{1}{2}kx^2$ to calculate the energy stored in a compressed spring.
  steps:
  - id: step-1
    title: Step 1 — Identify the Parameters
    instruction: |
      A spring with constant $k = 400\text{ N/m}$ is compressed by $0.50\text{ m}$ from its relaxed state.
    type: symbolicResponse
    prompt: |
      What is the value of the stretch/compression distance $x$ to plug into the energy formula?
    answer:
      gradingMode: auto
      expectedLatex: 0.5
      equivalenceMode: expression
      tolerance: 0
    explanation: The variable $x$ in the formula is the displacement from the equilibrium (relaxed) position. Here, it is given directly as $0.50\text{ m}$.
  - id: step-2
    title: Step 2 — Compute Energy
    instruction: |
      Plug the values into $U_s = \frac{1}{2}kx^2$.
    type: symbolicResponse
    prompt: |
      What is the total potential energy (in Joules) stored in the compressed spring?
    answer:
      gradingMode: auto
      expectedLatex: 50
      equivalenceMode: expression
      tolerance: 0.1
    explanation: $U_s = \frac{1}{2}(400)(0.50)^2 = 200(0.25) = 50\text{ J}$.
