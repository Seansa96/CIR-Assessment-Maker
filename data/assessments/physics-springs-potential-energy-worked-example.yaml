workedExamples:
  - id: we-spring-energy-numerical
    title: Compressed spring energy
    problem: 'A spring has $k=400$ N/m and is compressed $0.50$ m. Find its stored energy.'
    steps:
      - id: sen-1
        title: Select displacement
        instruction: 'Use displacement from the relaxed position.'
        type: numericResponse
        prompt: 'What magnitude of $x$ should enter the energy formula, in meters?'
        answer: { value: 0.5, tolerance: 0.001 }
        explanation: 'Solution: $x=0.50$ m.\n\nWhy it works: Spring potential energy uses the magnitude of extension or compression from equilibrium.'
      - id: sen-2
        title: Evaluate energy
        instruction: 'Use $U_s=\tfrac12kx^2$.'
        type: numericResponse
        prompt: 'What energy is stored, in joules?'
        answer: { value: 50, tolerance: 0.01 }
        explanation: 'Solution: $U_s=\tfrac12(400)(0.50)^2=50$ J.\n\nWhy it works: Energy is the area under the spring force-versus-extension curve.'
  - id: we-spring-energy-comparison
    title: Comparing two compressions
    problem: 'The same spring is compressed first by $x$ and then by $2x$. Compare the stored energies.'
    steps:
      - id: sec-1
        title: Express both energies
        instruction: 'Write each energy using $U_s=\tfrac12kx^2$.'
        type: symbolicResponse
        prompt: 'What is the energy at compression $2x$ in terms of $k$ and $x$?'
        answer: { gradingMode: auto, expectedLatex: '2 k x^2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $U(2x)=\tfrac12k(2x)^2=2kx^2$.\n\nWhy it works: Squaring the doubled compression produces a factor of four.'
      - id: sec-2
        title: Find the ratio
        instruction: 'Compare the new expression to $U(x)=\tfrac12kx^2$.'
        type: numericResponse
        prompt: 'How many times larger is $U(2x)$ than $U(x)$?'
        answer: { value: 4, tolerance: 0.01 }
        explanation: 'Solution: $[2kx^2]/[\tfrac12kx^2]=4$.\n\nWhy it works: Spring energy scales with the square of displacement.'
