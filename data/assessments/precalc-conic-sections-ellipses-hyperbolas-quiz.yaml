questions:
  - id: q001
    type: freeResponse
    prompt: |
      Analyze and sketch the ellipse.

      $$
      \frac{x^2}{16}+\frac{y^2}{25}=1
      $$

      State its center, orientation, vertices, co-vertices, and foci.
    answer:
      expected: |
        Center: $(0,0)$
        Major axis: vertical
        $a=5$, $b=4$, and $c=\sqrt{25-16}=3$
        Vertices: $(0,\pm5)$
        Co-vertices: $(\pm4,0)$
        Foci: $(0,\pm3)$
      gradingMode: selfCheck
      keyPoints:
        - Assigns $a^2=25$ to the larger denominator.
        - Uses $c^2=a^2-b^2$.
        - Places vertices and foci on the vertical major axis.
    explanation: |
      For an ellipse, the larger denominator identifies the major-axis direction. Here it lies under $y^2$, so the major axis is vertical. Compute $c$ from $c^2=a^2-b^2=25-16=9$.

      Related topic: reading ellipse geometry from standard form.

  - id: q002
    type: freeResponse
    prompt: |
      Analyze and sketch the ellipse.

      $$
      \frac{x^2}{4}+\frac{y^2}{3}=1
      $$

      State its center, orientation, vertices, co-vertices, and foci.
    answer:
      expected: |
        Center: $(0,0)$
        Major axis: horizontal
        $a=2$, $b=\sqrt3$, and $c=1$
        Vertices: $(\pm2,0)$
        Co-vertices: $(0,\pm\sqrt3)$
        Foci: $(\pm1,0)$
      gradingMode: selfCheck
      keyPoints:
        - Uses the larger denominator $4$ for $a^2$.
        - Computes $c^2=4-3=1$.
        - Places all major-axis features horizontally.
    explanation: |
      Because $4>3$ and lies under $x^2$, the ellipse is wider horizontally. The focal distance satisfies $c^2=4-3=1$.

      Related topic: horizontal ellipse standard form.

  - id: q003
    type: freeResponse
    prompt: |
      Put the ellipse in standard form, then state its center, vertices, co-vertices, and foci.

      $$
      x^2+3y^2=9
      $$
    answer:
      expected: |
        Divide by $9$:

        $$
        \frac{x^2}{9}+\frac{y^2}{3}=1.
        $$

        Center: $(0,0)$
        Vertices: $(\pm3,0)$
        Co-vertices: $(0,\pm\sqrt3)$
        Foci: $(\pm\sqrt6,0)$
      gradingMode: selfCheck
      keyPoints:
        - Divides every term by $9$.
        - Uses $a^2=9$, $b^2=3$, and $c^2=6$.
        - Identifies a horizontal major axis.
    explanation: |
      Standard form requires $1$ on the right. Once normalized, the denominator $9$ identifies the major axis and $c^2=a^2-b^2=6$ locates the foci.

      Related topic: normalizing an ellipse equation.

  - id: q004
    type: freeResponse
    prompt: |
      Put the ellipse in standard form, then state its center, vertices, co-vertices, and foci.

      $$
      x^2=4-2y^2
      $$
    answer:
      expected: |
        Rewrite and divide by $4$:

        $$
        x^2+2y^2=4,
        \qquad
        \frac{x^2}{4}+\frac{y^2}{2}=1.
        $$

        Center: $(0,0)$
        Vertices: $(\pm2,0)$
        Co-vertices: $(0,\pm\sqrt2)$
        Foci: $(\pm\sqrt2,0)$
      gradingMode: selfCheck
      keyPoints:
        - Moves the $y^2$ term before normalizing.
        - Uses $a^2=4$, $b^2=2$, and $c^2=2$.
        - Places foci on the horizontal axis.
    explanation: |
      Put both squared terms on the same side and normalize. The equal values $b^2=c^2=2$ are not a contradiction: $b$ measures the semi-minor axis while $c$ measures center-to-focus distance.

      Related topic: converting an ellipse to standard form.

  - id: q005
    type: freeResponse
    prompt: |
      Analyze and sketch the hyperbola.

      $$
      \frac{y^2}{25}-\frac{x^2}{9}=1
      $$

      State its center, vertices, foci, and asymptotes.
    answer:
      expected: |
        Center: $(0,0)$
        The transverse axis is vertical.
        $a=5$, $b=3$, and $c=\sqrt{34}$
        Vertices: $(0,\pm5)$
        Foci: $(0,\pm\sqrt{34})$
        Asymptotes: $y=\pm\frac53x$
      gradingMode: selfCheck
      keyPoints:
        - Uses $c^2=a^2+b^2$ for a hyperbola.
        - Places vertices and foci vertically.
        - Uses asymptote slopes $\pm\frac ab$ for the vertical form.
    explanation: |
      The positive term determines the transverse axis. For a vertical hyperbola, the asymptotes through the center are $y=\pm\frac abx$. Unlike an ellipse, a hyperbola uses $c^2=a^2+b^2$.

      Related topic: vertical hyperbola standard form.

  - id: q006
    type: freeResponse
    prompt: |
      Analyze and sketch the hyperbola.

      $$
      \frac{x^2}{36}-\frac{y^2}{64}=1
      $$

      State its center, vertices, foci, and asymptotes.
    answer:
      expected: |
        Center: $(0,0)$
        The transverse axis is horizontal.
        $a=6$, $b=8$, and $c=10$
        Vertices: $(\pm6,0)$
        Foci: $(\pm10,0)$
        Asymptotes: $y=\pm\frac43x$
      gradingMode: selfCheck
      keyPoints:
        - Reads $a^2=36$ from the positive term.
        - Computes $c^2=36+64=100$.
        - Uses slopes $\pm\frac ba=\pm\frac43$.
    explanation: |
      In a horizontal hyperbola, the positive $x$ term supplies $a^2$. The asymptote rectangle has horizontal half-width $a=6$ and vertical half-height $b=8$, so its diagonals have slopes $\pm\frac86$.

      Related topic: the fundamental rectangle of a hyperbola.

  - id: q007
    type: freeResponse
    prompt: |
      Put the hyperbola in standard form, then state its vertices, foci, and asymptotes.

      $$
      x^2-y^2=100
      $$
    answer:
      expected: |
        Standard form:

        $$
        \frac{x^2}{100}-\frac{y^2}{100}=1.
        $$

        Center: $(0,0)$
        Vertices: $(\pm10,0)$
        Foci: $(\pm10\sqrt2,0)$
        Asymptotes: $y=\pm x$
      gradingMode: selfCheck
      keyPoints:
        - Divides both squared terms by $100$.
        - Uses $a=b=10$ and $c=10\sqrt2$.
        - Recognizes asymptote slopes $\pm1$.
    explanation: |
      Normalize by dividing by $100$. Since $a=b$, the asymptote rectangle is a square and its diagonals have slopes $\pm1$.

      Related topic: rectangular hyperbolas.

  - id: q008
    type: freeResponse
    prompt: |
      Put the hyperbola in standard form, then state its vertices, foci, and asymptotes.

      $$
      y^2-16x^2=16
      $$
    answer:
      expected: |
        Standard form:

        $$
        \frac{y^2}{16}-x^2=1.
        $$

        Center: $(0,0)$
        Vertices: $(0,\pm4)$
        Foci: $(0,\pm\sqrt{17})$
        Asymptotes: $y=\pm4x$
      gradingMode: selfCheck
      keyPoints:
        - Uses $a^2=16$ and $b^2=1$.
        - Places the transverse axis vertically.
        - Uses vertical-form slopes $\pm\frac ab=\pm4$.
    explanation: |
      After division by $16$, the denominator under $x^2$ is implicitly $1$. The positive $y$ term makes the hyperbola vertical.

      Related topic: implicit denominators in conic standard form.

  - id: q009
    type: symbolicResponse
    prompt: |
      Find an equation of the ellipse with foci $(\pm2,0)$ and vertices $(\pm5,0)$.
    answer:
      expectedLatex: '\frac{x^2}{25}+\frac{y^2}{21}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The center is $(0,0)$ and the major axis is horizontal. The vertices give $a=5$ and the foci give $c=2$. Use

      $$
      b^2=a^2-c^2=25-4=21.
      $$

      Therefore

      $$
      \frac{x^2}{25}+\frac{y^2}{21}=1.
      $$

      Related topic: constructing an ellipse from vertices and foci.

  - id: q010
    type: symbolicResponse
    prompt: |
      Find an equation of the hyperbola with vertices $(\pm3,0)$ and foci $(\pm5,0)$.
    answer:
      expectedLatex: '\frac{x^2}{9}-\frac{y^2}{16}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The center is the origin and the transverse axis is horizontal. The vertices give $a=3$ and the foci give $c=5$. For a hyperbola,

      $$
      b^2=c^2-a^2=25-9=16.
      $$

      Thus

      $$
      \frac{x^2}{9}-\frac{y^2}{16}=1.
      $$

      Related topic: constructing a hyperbola from vertices and foci.

  - id: q011
    type: symbolicResponse
    prompt: |
      Find an equation of the hyperbola with vertices $(0,\pm2)$ and foci $(0,\pm5)$.
    answer:
      expectedLatex: '\frac{y^2}{4}-\frac{x^2}{21}=1'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The shared $y$-axis coordinates make the transverse axis vertical. Here $a=2$ and $c=5$, so

      $$
      b^2=c^2-a^2=25-4=21.
      $$

      Therefore

      $$
      \frac{y^2}{4}-\frac{x^2}{21}=1.
      $$

      Related topic: vertical hyperbola construction.
