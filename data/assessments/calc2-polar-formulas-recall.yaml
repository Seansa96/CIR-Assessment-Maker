  - polar-calculus
items:
  - id: polar-to-rectangular-x
    type: cloze
    skills:
      - polar-calculus
    prompt: 'Polar to rectangular: $x=$ ____.' 
    answer:
      expected: r cos theta
      aliases:
        - rcos theta
        - r cosine theta
        - '$r\cos\theta$'
    explanation: |
      The $x$-coordinate is the adjacent side of the triangle, so $x=r\cos\theta$.
    tags:
      - polar-conversion

  - id: polar-to-rectangular-y
    type: cloze
    skills:
      - polar-calculus
    prompt: 'Polar to rectangular: $y=$ ____.' 
    answer:
      expected: r sin theta
      aliases:
        - rsin theta
        - r sine theta
        - '$r\sin\theta$'
    explanation: |
      The $y$-coordinate is the opposite side of the triangle, so $y=r\sin\theta$.
    tags:
      - polar-conversion

  - id: rectangular-radius-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write the rectangular relationship for $r^2$.
    answer:
      expectedLatex: 'r^2=x^2+y^2'
      aliases:
        - 'x^2+y^2=r^2'
    explanation: |
      The radius is the distance from the origin, so the Pythagorean theorem gives $r^2=x^2+y^2$.
    tags:
      - polar-conversion

  - id: tangent-ratio-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write the basic rectangular-to-polar tangent relationship.
    answer:
      expectedLatex: '\tan\theta=\frac{y}{x}'
      aliases:
        - 'tan theta = y/x'
    explanation: |
      Use quadrant information with this relationship because tangent alone does not identify the angle uniquely.
    tags:
      - polar-conversion

  - id: polar-area-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write the area formula for $r=f(\theta)$ from $\theta=a$ to $\theta=b$.
    answer:
      expectedLatex: 'A=\frac12\int_a^b r^2\,d\theta'
      aliases:
        - 'A=1/2 int r^2 dtheta'
    explanation: |
      Polar area comes from circular sector slices.
    tags:
      - polar-area

  - id: polar-between-curves-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write the polar area setup between an outer radius $R$ and inner radius $r$.
    answer:
      expectedLatex: 'A=\frac12\int_a^b\left(R^2-r^2\right)\,d\theta'
      aliases:
        - 'A=1/2 int (R^2-r^2) dtheta'
    explanation: |
      Subtract sector areas, not radii: outer squared minus inner squared.
    tags:
      - polar-area-between-curves

  - id: polar-arc-length-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write the arc length formula for a polar curve $r=f(\theta)$.
    answer:
      expectedLatex: 'L=\int_a^b\sqrt{r^2+\left(\frac{dr}{d\theta}\right)^2}\,d\theta'
      aliases:
        - 'L=int sqrt(r^2+(dr/dtheta)^2) dtheta'
    explanation: |
      This comes from applying parametric arc length to $x=r\cos\theta$ and $y=r\sin\theta$.
    tags:
      - polar-arc-length

  - id: dx-dtheta-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write $\frac{dx}{d\theta}$ for $x=r\cos\theta$.
    answer:
      expectedLatex: '\frac{dx}{d\theta}=r''\cos\theta-r\sin\theta'
      aliases:
        - 'dx/dtheta = r prime cos theta - r sin theta'
    explanation: |
      Use the product rule on $r(\theta)\cos\theta$.
    tags:
      - polar-slope

  - id: dy-dtheta-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write $\frac{dy}{d\theta}$ for $y=r\sin\theta$.
    answer:
      expectedLatex: '\frac{dy}{d\theta}=r''\sin\theta+r\cos\theta'
      aliases:
        - 'dy/dtheta = r prime sin theta + r cos theta'
    explanation: |
      Use the product rule on $r(\theta)\sin\theta$.
    tags:
      - polar-slope

  - id: polar-slope-symbolic
    type: symbolic
    skills:
      - polar-calculus
    prompt: Write the polar slope formula $\frac{dy}{dx}$.
    answer:
      expectedLatex: '\frac{dy}{dx}=\frac{r''\sin\theta+r\cos\theta}{r''\cos\theta-r\sin\theta}'
      aliases:
        - 'dy/dx=(r prime sin theta+r cos theta)/(r prime cos theta-r sin theta)'
    explanation: |
      Polar slope is parametric slope with $\theta$ as the parameter.
    tags:
      - polar-slope

  - id: horizontal-tangent-cloze
    type: cloze
    skills:
      - polar-calculus
    prompt: 'A polar horizontal tangent comes from setting $\frac{dy}{d\theta}$ equal to ____ while checking $\frac{dx}{d\theta}\ne0$.' 
    answer:
      expected: zero
      aliases:
        - 0
    explanation: |
      Horizontal tangents have zero vertical component rate while the horizontal component rate remains nonzero.
    tags:
      - polar-tangents

  - id: vertical-tangent-cloze
    type: cloze
    skills:
      - polar-calculus
    prompt: 'A polar vertical tangent comes from setting $\frac{dx}{d\theta}$ equal to ____ while checking $\frac{dy}{d\theta}\ne0$.' 
    answer:
      expected: zero
      aliases:
        - 0
    explanation: |
      Vertical tangents have zero horizontal component rate while the vertical component rate remains nonzero.
    tags:
      - polar-tangents
