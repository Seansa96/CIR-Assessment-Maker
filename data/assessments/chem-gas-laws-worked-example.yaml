workedExamples:
  - id: we-combined-gas-law
    title: Using the Combined Gas Law
    problem: |
      A sample of nitrogen gas occupies 4.00 L at 25 °C and 1.20 atm. What volume will it occupy at STP (Standard Temperature and Pressure: 0 °C and 1.00 atm)?
    steps:
      - id: s1-convert-t
        title: 'Convert temperatures to Kelvin'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the temperature conversion and continue.
        instruction: |
          Gas law calculations **must** use absolute temperature (Kelvin).
          $T_1 = 25 \text{ °C} + 273.15 = 298.15 \text{ K}$
          $T_2 = 0 \text{ °C} + 273.15 = 273.15 \text{ K}$

      - id: s2-setup-eq
        title: 'Set up the Combined Gas Law'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the setup and continue.
        instruction: |
          $$\frac{P_1 V_1}{T_1} = \frac{P_2 V_2}{T_2}$$
          We need to solve for $V_2$:
          $$V_2 = \frac{P_1 V_1 T_2}{T_1 P_2}$$

      - id: s3-calculate
        title: 'Calculate the final volume'
        type: numericResponse
        answer:
          value: 4.39
          tolerance: 0.05
        prompt: |
          Plug in the values and solve for $V_2$ (in L).
          $P_1 = 1.20$, $V_1 = 4.00$, $T_1 = 298.15$, $P_2 = 1.00$, $T_2 = 273.15$
        instruction: |
          $$V_2 = \frac{(1.20)(4.00)(273.15)}{(298.15)(1.00)} = \frac{1311.12}{298.15} = 4.397 \text{ L}$$
          Rounding to 3 sig figs gives **4.40 L**.

  - id: we-ideal-gas-law
    title: Using the Ideal Gas Law for Molar Mass
    problem: |
      An unknown gas with a mass of 1.45 g occupies a volume of 0.800 L at a pressure of 0.950 atm and a temperature of 298 K. What is the molar mass of the gas? (Use $R = 0.08206 \text{ L}\cdot\text{atm/(mol}\cdot\text{K)}$).
    steps:
      - id: s1-solve-n
        title: 'Solve for moles (n)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the moles calculation and continue.
        instruction: |
          Use $PV = nRT$ to find the number of moles present.
          $$n = \frac{PV}{RT} = \frac{(0.950)(0.800)}{(0.08206)(298)}$$
          $$n = \frac{0.760}{24.45} = 0.03108 \text{ moles}$$

      - id: s2-solve-mm
        title: 'Calculate molar mass'
        type: numericResponse
        answer:
          value: 46.7
          tolerance: 0.5
        prompt: |
          Molar mass ($M$) is defined as grams per mole ($m/n$). Calculate the molar mass of the gas (in g/mol).
        instruction: |
          $$M = \frac{mass}{moles} = \frac{1.45 \text{ g}}{0.03108 \text{ mol}} = 46.65 \text{ g/mol}$$
          Rounding to 3 sig figs, the molar mass is **46.7 g/mol**. (This matches $NO_2$, nitrogen dioxide).

  - id: we-daltons-law
    title: Dalton's Law and Gas Collection over Water
    problem: |
      Hydrogen gas is collected over water at 25 °C. The total pressure of the gas mixture in the collection flask is 755 torr. The vapor pressure of water at 25 °C is 23.8 torr. What is the partial pressure of the dry hydrogen gas?
    steps:
      - id: s1-dalton-calc
        title: 'Apply Dalton''s Law'
        type: numericResponse
        answer:
          value: 731.2
          tolerance: 0.2
        prompt: |
          According to Dalton's Law, $P_{total} = P_{H_2} + P_{H_2O}$. Solve for $P_{H_2}$ (in torr).
        instruction: |
          The gas in the flask is a mixture of hydrogen and water vapor.
          $$P_{total} = P_{H_2} + P_{H_2O}$$
          $$755 = P_{H_2} + 23.8$$
          $$P_{H_2} = 755 - 23.8 = 731.2 \text{ torr}$$
