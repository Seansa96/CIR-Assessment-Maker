questions:
- id: q001
  type: numericResponse
  prompt: 'For the reaction: 4NH3 + 5O2 → 4NO + 6H2O


    How many moles of H2O are produced when 2.00 mol of NH3 reacts with excess O2?

    '
  answer:
    value: 3.0
    tolerance: 0.05
  explanation: 'Mole ratio NH3:H2O = 4:6 = 2:3. n(H2O) = 2.00 × (6/4) = 3.00 mol.

    '
- id: q002
  type: numericResponse
  prompt: 'For the combustion of butane:

    2C4H10 + 13O2 → 8CO2 + 10H2O


    How many grams of CO2 are produced from 29.2 g of C4H10?

    (M(C4H10) = 58.12 g/mol; M(CO2) = 44.01 g/mol)

    '
  answer:
    value: 88.1
    tolerance: 0.5
  explanation: 'n(C4H10) = 29.2/58.12 = 0.5025 mol. Ratio C4H10:CO2 = 2:8 = 1:4. n(CO2)
    = 0.5025 × 4 = 2.010 mol. m(CO2) = 2.010 × 44.01 = 88.46 g ≈ 88.1 g.

    '
- id: q003
  type: multipleChoice
  prompt: 'For the reaction: 2Na + Cl2 → 2NaCl


    A student mixes 4.60 g of Na with 7.09 g of Cl2. Which is the limiting reactant?

    (M(Na) = 22.99 g/mol; M(Cl2) = 70.90 g/mol)

    '
  choices:
  - id: a
    text: Na — 0.200 mol Na produces 0.200 mol NaCl; Cl2 — 0.100 mol Cl2 produces
      0.200 mol NaCl. Neither is limiting.
  - id: b
    text: Cl2 is limiting — it produces fewer moles of NaCl.
  - id: c
    text: Na is limiting — it produces fewer moles of NaCl.
  - id: d
    text: Not enough information to determine.
  answer:

    choiceId: a
  explanation: 'n(Na) = 4.60/22.99 = 0.200 mol → n(NaCl) = 0.200 mol. n(Cl2) = 7.09/70.90
    = 0.100 mol → n(NaCl) = 0.100 × 2 = 0.200 mol. Both produce the same amount of
    NaCl — both reactants are consumed exactly (stoichiometric quantities). Neither
    is limiting.

    '
- id: q004
  type: numericResponse
  prompt: 'For the reaction: Fe2O3 + 3CO → 2Fe + 3CO2


    A student mixes 160. g of Fe2O3 with 84.0 g of CO. Identify the limiting reactant
    and calculate the theoretical yield of Fe in grams.

    (M(Fe2O3) = 159.69, M(CO) = 28.01, M(Fe) = 55.85 g/mol)

    '
  answer:
    value: 112
    tolerance: 2
  explanation: 'n(Fe2O3) = 160/159.69 = 1.002 mol → Fe possible: 1.002 × 2 = 2.004
    mol Fe.

    n(CO) = 84.0/28.01 = 2.999 mol → Fe possible: 2.999 × (2/3) = 1.999 mol Fe.

    CO produces less Fe → CO is limiting. Theoretical yield Fe = 1.999 × 55.85 = 111.7
    g ≈ 112 g.

    '
- id: q005
  type: numericResponse
  prompt: 'A student collects 45.3 g of NaCl from a reaction with a theoretical yield
    of 50.0 g. What is the percent yield?

    '
  answer:
    value: 90.6
    tolerance: 0.5
  explanation: '% yield = (45.3/50.0) × 100% = 90.6%.

    '
- id: q006
  type: multipleChoice
  prompt: 'What does a percent yield greater than 100% indicate?

    '
  choices:
  - id: a
    text: An experimental error — such as an impure product or incomplete drying of
      the sample.
  - id: b
    text: The reaction was more efficient than predicted.
  - id: c
    text: More product was created than atoms were available.
  - id: d
    text: The theoretical yield calculation was wrong.
  answer:

    choiceId: a
  explanation: 'A percent yield above 100% is physically impossible — you cannot create
    matter. It always indicates an experimental error: the product may contain impurities
    (like residual water), the sample was not dried before weighing, or measurements
    were incorrect.

    '
- id: q007
  type: numericResponse
  prompt: 'For the reaction: CH4 + 2O2 → CO2 + 2H2O


    If 64.1 g of CH4 reacts with excess O2,\rhow many grams of H2O are produced?

    (M(CH4) = 16.04 g/mol; M(H2O) = 18.015 g/mol)

    '
  answer:
    value: 144
    tolerance: 2
  explanation: 'n(CH4) = 64.1/16.04 = 3.997 mol. Ratio CH4:H2O = 1:2. n(H2O) = 7.994
    mol. m(H2O) = 7.994 × 18.015 = 144.1 g ≈ 144 g.

    '
- id: q008
  type: multipleChoice
  prompt: 'A student needs 88.0 g of CO2 for an experiment. Using the reaction 2C
    + O2 → 2CO… wait, that''s CO not CO2. Instead, for: C + O2 → CO2,\rhow many grams
    of carbon must be burned?

    (M(C) = 12.011 g/mol, M(CO2) = 44.01 g/mol)

    '
  choices:
  - id: a
    text: 24.0 g of carbon
  - id: b
    text: 12.0 g of carbon
  - id: c
    text: 44.0 g of carbon
  - id: d
    text: 88.0 g of carbon
  answer:

    choiceId: a
  explanation: 'n(CO2) needed = 88.0/44.01 = 2.000 mol. Ratio C:CO2 = 1:1. n(C) =
    2.000 mol. m(C) = 2.000 × 12.011 = 24.0 g.

    '
- id: q009
  type: numericResponse
  prompt: 'For the reaction: 3H2 + N2 → 2NH3


    If 6.00 g of H2 reacts with 28.00 g of N2, what is the theoretical yield of NH3
    in grams?

    (M(H2) = 2.016, M(N2) = 28.01, M(NH3) = 17.031 g/mol)

    '
  answer:
    value: 34.1
    tolerance: 0.5
  explanation: 'n(H2) = 6.00/2.016 = 2.976 mol → n(NH3) from H2 = 2.976 × (2/3) =
    1.984 mol NH3.

    n(N2) = 28.00/28.01 = 0.9996 mol → n(NH3) from N2 = 0.9996 × 2 = 1.999 mol.

    H2 produces less → H2 is limiting. m(NH3) = 1.984 × 17.031 = 33.79 g ≈ 34.1 g.

    '
- id: q010
  type: multipleChoice
  prompt: 'In a stoichiometry problem, why must the equation be balanced before you
    begin calculations?

    '
  choices:
  - id: a
    text: Because the coefficients provide the mole ratios needed to convert between
      reactants and products.
  - id: b
    text: Because balancing changes the formulas so the molar masses are accurate.
  - id: c
    text: Because balancing identifies which compound is the limiting reactant.
  - id: d
    text: Because an unbalanced equation describes a different reaction.
  answer:

    choiceId: a
  explanation: 'The balanced equation gives you the mole ratios (from the coefficients)
    that are essential for converting between moles of different substances. Without
    balance, the ratios are wrong and all calculations fail.

    '
