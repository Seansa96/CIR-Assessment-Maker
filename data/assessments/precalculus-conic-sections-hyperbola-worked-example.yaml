workedExamples:
- id: we-1
  title: 'Worked Example'
  problem: 'Find the standard form and the equations of the asymptotes for the hyperbola $y^2 - 4x^2 - 4y - 24x - 36 = 0$.'
  steps:
  - id: step-1
    title: 'Group terms and factor out leading coefficients'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Group the $y$ terms together and the $x$ terms together, and move the constant to the right side:
      $$ (y^2 - 4y) - (4x^2 + 24x) = 36 $$
      
      Notice that we factored out a negative sign for the $x$ terms! This is a very common place to make a mistake.
      
      Factor out the leading coefficients:
      The $y$ terms have a coefficient of 1, so they stay $(y^2 - 4y)$.
      The $x$ terms have a coefficient of 4, so factor it out:
      $$ (y^2 - 4y) - 4(x^2 + 6x) = 36 $$
  - id: step-2
    title: 'Complete the square'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      For $y^2 - 4y$, take half of $-4$ and square it: $(-2)^2 = 4$. Add this inside the $y$ parenthesis.
      For $x^2 + 6x$, take half of $6$ and square it: $(3)^2 = 9$. Add this inside the $x$ parenthesis.
      
      Now balance the equation. We added $4$ to the left side. We also added $-4(9) = -36$ to the left side!
      
      $$ (y^2 - 4y + \mathbf{4}) - 4(x^2 + 6x + \mathbf{9}) = 36 + \mathbf{4} - \mathbf{36} $$
      
      Simplify both sides:
      $$ (y - 2)^2 - 4(x + 3)^2 = 4 $$
  - id: step-3
    title: 'Divide to get standard form'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Divide the entire equation by 4 to get 1 on the right side:
      
      $$ \frac{(y - 2)^2}{4} - \frac{4(x + 3)^2}{4} = \frac{4}{4} $$
      $$ \frac{(y - 2)^2}{4} - \frac{(x + 3)^2}{1} = 1 $$
      
      This is the standard form of the hyperbola.
  - id: step-4
    title: 'Identify the orientation and center'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Because the positive term is the $y$ term, the transverse axis is **vertical**. The hyperbola opens up and down.
      
      The center is $(h, k) = (-3, 2)$.
  - id: step-5
    title: 'Determine $a$ and $b$'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      The denominator under the $y$ term gives $a^2$:
      $a^2 = 4 \implies a = 2$.
      This is the vertical "rise" of the fundamental rectangle.
      
      The denominator under the $x$ term gives $b^2$:
      $b^2 = 1 \implies b = 1$.
      This is the horizontal "run" of the fundamental rectangle.
  - id: step-6
    title: 'Write the equations of the asymptotes'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      The asymptotes pass through the center $(-3, 2)$ with slopes $m = \pm \frac{\text{rise}}{\text{run}}$.
      
      Here, the rise is $a = 2$ and the run is $b = 1$.
      $$ m = \pm \frac{2}{1} = \pm 2 $$
      
      Using the point-slope form $y - k = m(x - h)$:
      $$ y - 2 = \pm 2(x + 3) $$
      
      These are the equations of the asymptotes.

