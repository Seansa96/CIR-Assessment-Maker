  instructions: |
    In this drill, you will practice applying the box model to a profile card component.
    
    ![Target Preview](/media/css/padding_drill_preview.webp)
    
    **Your Task:**
    1. Give `.card` a padding of 24px on all sides.
    2. Give `.card` a solid 2px border with the color `#4a4a4a`.
    3. Give `.card` a margin of 40px on all sides.
    4. Give `.card-header` a bottom border of 1px solid `#4a4a4a`.
    5. Give `.card-header` a bottom padding of 16px.
    6. Give `.card-header` a bottom margin of 16px.
