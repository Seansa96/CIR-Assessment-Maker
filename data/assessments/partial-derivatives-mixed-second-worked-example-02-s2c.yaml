workedExamples:
- id: example-001
  title: A logarithm of a quadratic expression
  problem: For $h(x,y)=\ln(x^2+y^2)$ on its domain $x^2+y^2>0$, compute $h_{xy}$ and $h_{yx}$ independently.
  steps:
  - id: s001
    title: Find the x partial
    instruction: Compute $h_x$.
    type: freeResponse
    prompt: Compute $h_x$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $h_x=2x/(x^2+y^2)$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $h_x=2x/(x^2+y^2)$.


      Why it works: The logarithm chain rule gives the inside x derivative divided by the positive inside
      quantity.'
  - id: s002
    title: Differentiate in y
    instruction: Use the quotient or reciprocal rule to find $h_{xy}$.
    type: freeResponse
    prompt: Use the quotient or reciprocal rule to find $h_{xy}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $h_{xy}=-4xy/(x^2+y^2)^2$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $h_{xy}=-4xy/(x^2+y^2)^2$.


      Why it works: The numerator 2x is fixed in y; differentiating $(x^2+y^2)^{-1}$ contributes $-2y(x^2+y^2)^{-2}$.'
  - id: s003
    title: Reverse the order
    instruction: Find $h_y$, then compute $h_{yx}$.
    type: freeResponse
    prompt: Find $h_y$, then compute $h_{yx}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $h_y=2y/(x^2+y^2)$
      - $h_{yx}=-4xy/(x^2+y^2)^2$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $h_y=2y/(x^2+y^2)$ and $h_{yx}=-4xy/(x^2+y^2)^2$.


      Why it works: Now 2y is fixed in x, and differentiating the reciprocal denominator contributes $-2x$.'
  - id: s004
    title: Explain domain and equality
    instruction: Why is the origin excluded, and why do the orders agree elsewhere?
    type: freeResponse
    prompt: Why is the origin excluded, and why do the orders agree elsewhere?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The logarithm requires $x^2+y^2>0$
      - The mixed partials are continuous on that punctured domain
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: The origin is excluded because $\ln(0)$ is undefined. At every other point
      both mixed expressions are continuous and equal.


      Why it works: Clairaut applies on neighborhoods contained in the domain; it does not assert derivatives
      at the excluded origin.'
- id: example-002
  title: A product with an exponential composite
  problem: Let $k(x,y)=x^2e^{xy}$. Find $k_{xy}$ and $k_{yx}$ using opposite differentiation orders.
  steps:
  - id: s005
    title: Differentiate first in x
    instruction: Use the product rule to obtain $k_x$.
    type: freeResponse
    prompt: Use the product rule to obtain $k_x$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $k_x=e^{xy}(2x+x^2y)$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $k_x=e^{xy}(2x+x^2y)$.


      Why it works: Differentiate $x^2$ and also differentiate $e^{xy}$, whose x derivative is $ye^{xy}$.'
  - id: s006
    title: Take the y derivative
    instruction: Differentiate the full product in $k_x$ to obtain $k_{xy}$.
    type: freeResponse
    prompt: Differentiate the full product in $k_x$ to obtain $k_{xy}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $k_{xy}=e^{xy}(3x^2+x^3y)$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $k_{xy}=e^{xy}(3x^2+x^3y)$.


      Why it works: The exponential contributes a factor x; differentiating the bracket contributes $x^2$.
      Combine $2x^2+x^3y+x^2$.'
  - id: s007
    title: Reverse the order
    instruction: Find $k_y$, then compute $k_{yx}$.
    type: freeResponse
    prompt: Find $k_y$, then compute $k_{yx}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $k_y=x^3e^{xy}$
      - $k_{yx}=e^{xy}(3x^2+x^3y)$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: $k_y=x^3e^{xy}$ and $k_{yx}=e^{xy}(3x^2+x^3y)$.


      Why it works: Differentiate the product in x: the power contributes $3x^2$ and the exponential contributes
      $x^3y$.'
  - id: s008
    title: Compare the two forms
    instruction: State the equality and the smoothness reason.
    type: freeResponse
    prompt: State the equality and the smoothness reason.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $k_{xy}=k_{yx}=e^{xy}(3x^2+x^3y)$
      - The function is smooth on $\mathbb R^2$
    issueSignals:
    - id: mixed-partial-order
    explanation: 'Solution: Both orders give $e^{xy}(3x^2+x^3y)$.


      Why it works: The exponential-product expression is smooth everywhere, so the mixed partials are
      continuous and Clairaut applies.'
