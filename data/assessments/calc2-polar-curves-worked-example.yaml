workedExamples:
  - id: we-polar-curves-1
    title: Graphing a Polar Curve
    problem: |
      ![The inner-loop limacon r equals one minus two sine theta with its pole crossings marked](/assessments/calc2-parametric-polar/polar-limacon-inner-loop.svg)

      Consider the polar curve given by:

      $$
      r = 1 - 2\sin\theta
      $$

      We will analyze this curve, determine its shape, and find where it passes through the pole (origin).
    steps:
      - id: step-we-polar-1a
        title: Identify the type of curve
        instruction: |
          The equation is of the form $r = a \pm b\sin\theta$ (or cosine). 
          These curves are called **lima\u00e7ons**.
          
          The shape of a lima\u00e7on depends on the ratio $\frac{a}{b}$.
          Here, $a = 1$ and $b = 2$.
        type: multipleChoice
        prompt: 'Since $\frac{a}{b} = \frac{1}{2} < 1$, what type of lima\u00e7on is this?'
        choices:
          - id: c1
            text: 'Lima\u00e7on with an inner loop'
          - id: c2
            text: 'Cardioid (heart-shaped)'
          - id: c3
            text: 'Dimpled lima\u00e7on'
          - id: c4
            text: 'Convex lima\u00e7on'
        answer:
          choiceId: c1
        explanation: |
          Because the ratio $a/b < 1$, the radius $r$ will be negative for some values of $\theta$, which creates an inner loop.
        skills:
          - polar-curves

      - id: step-we-polar-1b
        title: Find when the curve passes through the pole
        instruction: |
          A polar curve passes through the pole when $r = 0$.
          Set $r = 1 - 2\sin\theta = 0$.
          $2\sin\theta = 1 \implies \sin\theta = \frac{1}{2}$.
          
          The solutions for $\theta$ in $[0, 2\pi)$ give the angles at which the curve enters and exits the pole (forming the inner loop).
        type: symbolicResponse
        prompt: 'What is the smallest positive angle $\theta$ where $r = 0$? (Enter your answer in terms of $\pi$)'
        answer:
          expectedLatex: '\frac{\pi}{6}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        explanation: |
          The solutions to $\sin\theta = \frac{1}{2}$ are $\theta = \frac{\pi}{6}$ and $\theta = \frac{5\pi}{6}$.
          The smallest positive angle is $\frac{\pi}{6}$.
        skills:
          - polar-curves

  - id: we-polar-curves-2
    title: Intersections of Polar Curves
    problem: |
      ![The polar circles r equals three sine theta and r equals three cosine theta with their shared points marked](/assessments/calc2-parametric-polar/polar-circle-intersections.svg)

      Find all points of intersection of the polar curves:
      
      $$
      r = 3\sin\theta
      $$
      $$
      r = 3\cos\theta
      $$
      
      for $0 \le \theta < \pi$.
    steps:
      - id: step-we-polar-2a
        title: Set the equations equal to each other
        instruction: |
          To find intersections, first set the $r$-values equal:
          $3\sin\theta = 3\cos\theta$
          $\sin\theta = \cos\theta$
          
          Divide by $\cos\theta$ (assuming $\cos\theta \neq 0$):
          $\tan\theta = 1$
        type: symbolicResponse
        prompt: 'What is the solution for $\theta$ in the interval $0 \le \theta < \pi$?'
        answer:
          expectedLatex: '\frac{\pi}{4}'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        explanation: |
          $\tan\theta = 1$ in the first quadrant gives $\theta = \frac{\pi}{4}$.
          At this angle, $r = 3\sin(\frac{\pi}{4}) = \frac{3\sqrt{2}}{2}$.
          So one intersection point is $(r, \theta) = (\frac{3\sqrt{2}}{2}, \frac{\pi}{4})$.
        skills:
          - polar-curves

      - id: step-we-polar-2b
        title: Check the pole
        instruction: |
          In polar coordinates, the pole is represented by $r=0$, but the angle $\theta$ can be anything!
          Because the pole can be reached at different times (angles) for different curves, setting $r_1 = r_2$ does not always find it.
          
          We must check if both curves pass through the pole.
          For $r = 3\sin\theta$, does it equal $0$ for some $\theta$? Yes, at $\theta = 0$.
          For $r = 3\cos\theta$, does it equal $0$ for some $\theta$? Yes, at $\theta = \frac{\pi}{2}$.
        type: multipleChoice
        prompt: 'Do the curves intersect at the pole?'
        choices:
          - id: c1
            text: 'Yes, because they both have a point where $r = 0$'
          - id: c2
            text: 'No, because they reach $r = 0$ at different angles'
        answer:
          choiceId: c1
        explanation: |
          Yes! The pole is a single physical point in the plane, even though its coordinates $(0, 0)$ and $(0, \pi/2)$ look different. If both curves pass through it, they intersect there.
        skills:
          - polar-curves
