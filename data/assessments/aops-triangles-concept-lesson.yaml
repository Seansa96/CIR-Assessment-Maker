lesson:
  introduction: Learn to solve Triangles problems by recognizing triangle classification, triangle inequality, Pythagorean theorem, congruence, similarity, basic trigonometry, area and justifying each theorem or transformation.
  sections:
  - id: aops-triangles-motivation
    title: What the topic helps you notice
    required: true
    content: Triangles is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are triangle classification, triangle inequality, Pythagorean theorem, congruence, similarity, basic trigonometry, area.
    check:
      id: aops-triangles-motivation-check
      type: multipleChoice
      prompt: In Triangles, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-triangles-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-triangles-definitions-check
      type: multipleChoice
      prompt: In Triangles, what should be checked before applying a method?
