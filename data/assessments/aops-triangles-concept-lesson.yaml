schemaVersion: 1
id: aops-triangles-concept-lesson
title: "Triangles I: Structure, Existence, and Right Triangles"
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-triangles
modeDefault: learn
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [art-of-problem-solving, aops-triangles, aops, geometry, triangle-inequality, pythagorean-theorem]
skills:
- Test whether three lengths form a triangle.
- Classify a triangle from side data.
- Apply and verify the Pythagorean theorem and its converse.
lesson:
  introduction: |
    A triangle is not merely a three-sided drawing. Its side lengths, angle measures, and special structures constrain one another. This lesson builds a reliable first pass: decide whether the figure can exist, classify it, and choose a valid right-triangle theorem.
  sections:
  - id: aops-triangles-purpose
    title: Why triangle structure is useful
    required: true
    content: |
      Triangles are the rigid building blocks of Euclidean geometry. Three compatible side lengths fix a triangle up to congruence, so a marked length or angle can unlock information elsewhere in a diagram. Before calculating, name the target: existence, angle, side, area, or a classification. A formula is useful only after its hypotheses are true.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-structure.svg
      alt: Right triangle ABC with side lengths 5, 12, and 13, and a marked right angle at A.
      caption: A right-angle mark, not the drawing's appearance, licenses the Pythagorean theorem.
    check:
      id: aops-triangles-purpose-check
      type: multipleChoice
      prompt: What feature licenses using the Pythagorean theorem in a triangle problem?
      choices:
      - id: a
        text: A proved or marked right angle.
      - id: b
        text: A triangle that looks tall.
      - id: c
        text: Any three side labels.
      - id: d
        text: A diagram drawn on square paper.
      answer: { choiceId: a }
      explanation: The theorem concerns right triangles; appearance is not a hypothesis.
  - id: aops-triangles-existence
    title: Existence and the triangle inequality
    required: true
    content: |
      Positive lengths $a$, $b$, and $c$ form a nondegenerate triangle exactly when each is less than the sum of the other two. With lengths ordered $a\le b\le c$, it is enough to check $a+b>c$. Equality produces a flattened segment, not a triangle. For a missing side $x$ with known sides $p,q$, the combined restriction is $|p-q|<x<p+q$.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-inequality.svg
      alt: Triangle with sides 5, 8, and x and the strict bound absolute value of 8 minus 5 less than x less than 13.
      caption: The strict lower and upper bounds exclude both flattened endpoint arrangements.
    check:
      id: aops-triangles-existence-check
      type: multipleChoice
      prompt: Which set cannot form a nondegenerate triangle?
      choices:
      - id: a
        text: 4, 7, 12
      - id: b
        text: 5, 5, 8
      - id: c
        text: 6, 8, 10
      - id: d
        text: 9, 9, 9
      answer: { choiceId: a }
      explanation: $4+7=11<12$, so the two shorter sides cannot meet.
  - id: aops-triangles-angle-sum
    title: Interior and exterior angle constraints
    required: true
    content: |
      The interior angles of every Euclidean triangle total $180^\circ$. Extending one side forms an exterior angle equal to the sum of the two remote interior angles. These facts are often more efficient than measuring: label unknown angles, write one equation, and retain the reason for every substitution. In an isosceles triangle, equal sides are opposite equal angles, and the converse is also valid.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-angle-sum.svg
      alt: Triangle ABC with interior angles 48 degrees, 71 degrees, and y, plus exterior angle x at C.
      caption: The interior angles total 180 degrees, while the exterior angle equals the two remote interior angles.
    check:
      id: aops-triangles-angle-sum-check
      type: multipleChoice
      prompt: An exterior angle is $125^\circ$ and one remote interior angle is $54^\circ$. What is the other remote interior angle?
      choices:
      - id: a
        text: '$71^\circ$'
      - id: b
        text: '$54^\circ$'
      - id: c
        text: '$125^\circ$'
      - id: d
        text: '$179^\circ$'
      answer: { choiceId: a }
      explanation: The remote angles sum to the exterior angle, so it is $125-54=71$.
  - id: aops-triangles-pythagoras
    title: Pythagorean theorem and converse
    required: true
    content: |
      In a right triangle, legs $a,b$ and hypotenuse $c$ satisfy $a^2+b^2=c^2$, where $c$ is opposite the right angle and is longest. The converse classifies a triangle from side lengths: after verifying existence and ordering sides, equality means right, $a^2+b^2>c^2$ means acute, and $a^2+b^2<c^2$ means obtuse. The converse does not require an angle drawing.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-structure.svg
      alt: A 5-12-13 right triangle showing legs and hypotenuse.
      caption: Here $5^2+12^2=13^2$; 13 is the hypotenuse because it is opposite the marked right angle.
    check:
      id: aops-triangles-pythagoras-check
      type: multipleChoice
      prompt: How is a triangle with side lengths 5, 6, and 8 classified?
      choices:
      - id: a
        text: Acute
      - id: b
        text: Right
      - id: c
        text: Obtuse
      - id: d
        text: Degenerate
      answer: { choiceId: c }
      explanation: $5^2+6^2=61<64=8^2$, so the angle opposite 8 is obtuse.
  - id: aops-triangles-workflow
    title: A dependable side-data workflow
    required: true
    content: |
      For side-only data, use this order: sort the lengths; test triangle inequality; identify the longest side; compare squared lengths; then calculate only what the classification authorizes. This prevents a common error: applying Pythagoras to a triangle merely because its side lengths are numbers. If a result is a physical length, reject nonpositive candidates and recheck the original givens.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-converse-frame.svg
      alt: Triangular frame with shorter sides 20 and 21 and a longest side that changes from 29 to 30.
      caption: Test existence first, then compare the longest-side square with the other two squares.
    check:
      id: aops-triangles-workflow-check
      type: multipleChoice
      prompt: Which is the best first step before using the Pythagorean converse on three given lengths?
      choices:
      - id: a
        text: Verify triangle inequality and identify the longest side.
      - id: b
        text: Square the first two listed lengths.
      - id: c
        text: Assume the last listed length is the hypotenuse.
      - id: d
        text: Estimate the angles from the diagram.
      answer: { choiceId: a }
      explanation: The converse comparison must use the actual longest side, and the lengths must form a triangle.
  - id: aops-triangles-common-traps
    title: Common traps and counterexamples
    required: true
    content: |
      Do not confuse a converse with its original theorem. “A right triangle satisfies $a^2+b^2=c^2$” and “side equality implies a right triangle” are different statements, though both are true here. Do not use $\sqrt{a^2}=a$ without a nonnegative-length condition; it is $|a|$ algebraically. Do not accept $2,3,5$ as a triangle: equality in the inequality is degenerate.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-converse-frame.svg
      alt: Unmarked triangular frame whose angle type must be proved from its side lengths.
      caption: No right angle is marked, so classification requires the Pythagorean converse comparison.
    check:
      id: aops-triangles-common-traps-check
      type: multipleChoice
      prompt: Why does $2,3,5$ fail as a nondegenerate triangle?
      choices:
      - id: a
        text: The two shorter lengths add exactly to the longest length.
      - id: b
        text: The longest length is odd.
      - id: c
        text: The lengths are not all distinct.
      - id: d
        text: It has no marked right angle.
      answer: { choiceId: a }
      explanation: Equality gives a straight, flattened arrangement rather than positive area.
  - id: aops-triangles-synthesis
    title: "Synthesis: choose, justify, verify"
    required: true
    content: |
      A strong triangle solution ends with the original question: state the classification or requested length, cite the theorem whose conditions were met, and verify the arithmetic. This is especially important in contest problems where a short condition--parallel lines, equal sides, or a right-angle mark--may switch the method from side comparison to similarity or trigonometry. Later Triangle lessons build those methods on this reliable foundation.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-7-24-25.svg
      alt: Right triangle with hypotenuse 25, leg 7, unknown leg, and an explicit right-angle mark.
      caption: The marked hypothesis licenses calculation; substitution and measurement checks complete the solution.
    check:
      id: aops-triangles-synthesis-check
      type: multipleChoice
      prompt: Which conclusion is strongest after finding $6^2+8^2=10^2$ for valid triangle side lengths?
      choices:
      - id: a
        text: The triangle is right because the converse of the Pythagorean theorem applies.
      - id: b
        text: The triangle looks right.
      - id: c
        text: Every triangle with integer sides is right.
      - id: d
        text: The triangle is equilateral.
      answer: { choiceId: a }
      explanation: The equality with the longest side establishes the converse's hypothesis.
