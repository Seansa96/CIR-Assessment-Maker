workedExamples:
- id: we-wave-mathematics
  title: Deriving and applying Mathematics of Waves
  problem: Use the labeled model to derive and calculate the wave number from $k=2\pi/\lambda$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Read the given wave equation: $y(x,t) = 0.2 \sin(4.0x - 20.0t)$. Extract the wave number and angular frequency.
    prompt: 'Identify $k$ and $\omega$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'k = 4.0, \omega = 20.0'
    explanation: >-
      Matching with $A \sin(kx - \omega t)$, we find $k = 4.0$ rad/m and $\omega = 20.0$ rad/s.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about wave direction based on the signs in the argument.
    prompt: 'What is the direction of propagation?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Positive x-direction'
    explanation: >-
      Because the signs of $kx$ and $\omega t$ are opposite, the wave travels in the positive $x$-direction.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variables. We want to find the wavelength $\lambda$ and wave speed $v$.
    prompt: 'Name the targets.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Wavelength \lambda and speed v'
    explanation: >-
      We need to calculate $\lambda$ and $v$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the relationships connecting $k$ to $\lambda$, and $k,\omega$ to $v$.
    prompt: 'Write the governing relations.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: '\lambda = 2\pi/k, v = \omega/k'
    explanation: >-
      $\lambda = \frac{2\pi}{k}$ and $v = \frac{\omega}{k}$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variables. The equations are already isolated.
    prompt: 'Isolate $\lambda$ and $v$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: '\lambda = 2\pi/k, v = \omega/k'
    explanation: >-
      Use the established formulas directly.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Calculate the numerical value of the wave speed $v$.
    prompt: 'Calculate $v$.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      value: 5.0
      tolerance: 0.05
    explanation: >-
      $v = 20.0 / 4.0 = 5.0$ m/s.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of $\omega/k$.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'm/s'
    explanation: >-
      $(\text{rad/s}) / (\text{rad/m}) = \text{m/s}$.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated wave speed.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      value: 5.0
      tolerance: 0.05
    explanation: >-
      The wave speed is $5.0$ m/s.
