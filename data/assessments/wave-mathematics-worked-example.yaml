- id: we-wave-mathematics
  title: Deriving and applying Mathematics of Waves
  problem: Use the labeled model to derive and calculate the wave number from $k=2\pi/\lambda$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: 'Read the given wave equation: $y(x,t) = 0.2 \sin(4.0x - 20.0t)$. Extract the wave number and angular frequency.'
    prompt: Identify $k$ and $\omega$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - k = 4.0, \omega = 20.0
    explanation: 'Solution: Matching with $A \sin(kx - \omega t)$, we find $k = 4.0$ rad/m and $\omega = 20.0$ rad/s.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the assumption about wave direction based on the signs in the argument.
    prompt: What is the direction of propagation?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Positive x-direction
    explanation: 'Solution: Because the signs of $kx$ and $\omega t$ are opposite, the wave travels in the positive $x$-direction.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the target variables. We want to find the wavelength $\lambda$ and wave speed $v$.
    prompt: Name the targets.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Wavelength \lambda and speed v
    explanation: 'Solution: We need to calculate $\lambda$ and $v$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the relationships connecting $k$ to $\lambda$, and $k,\omega$ to $v$.
    prompt: Write the governing relations.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - \lambda = 2\pi/k, v = \omega/k
    explanation: 'Solution: $\lambda = \frac{2\pi}{k}$ and $v = \frac{\omega}{k}$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the target variables. The equations are already isolated.
    prompt: Isolate $\lambda$ and $v$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - \lambda = 2\pi/k, v = \omega/k
    explanation: 'Solution: Use the established formulas directly.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Calculate the numerical value of the wave speed $v$.
    prompt: Calculate $v$.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      value: 5.0
      tolerance: 0.05
    explanation: 'Solution: $v = 20.0 / 4.0 = 5.0$ m/s.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of $\omega/k$.
    prompt: What are the units?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - m/s
    explanation: 'Solution: $(\text{rad/s}) / (\text{rad/m}) = \text{m/s}$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated wave speed.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    answer:
      value: 5.0
      tolerance: 0.05
    explanation: 'Solution: The wave speed is $5.0$ m/s.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
- id: wave-parameters-we002
  title: Extract Wave Parameters From an Equation
  problem: A wave is $y=0.30\sin(4x-20t)$ in SI units. Find its wavelength and propagation speed.
  steps:
  - id: wave-parameters-we002-step-1
    title: Calculate wavelength
    type: numericResponse
    prompt: What is wavelength in meters?
    answer: {value: 1.5708, tolerance: 0.001}
    explanation: 'Solution: $\lambda=2\pi/k=2\pi/4=1.571\ \text{m}$. Why it works: wave number is spatial phase change per meter.'
  - id: wave-parameters-we002-step-2
    title: Calculate propagation speed
    type: numericResponse
    prompt: What is the wave speed in m/s?
    answer: {value: 5, tolerance: 0.01}
    explanation: 'Solution: $v=\omega/k=20/4=5.0\ \text{m/s}$. Why it works: points of constant phase travel at angular frequency divided by wave number.'
