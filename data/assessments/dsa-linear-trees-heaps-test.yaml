- id: q001
  type: multipleChoice
  prompt: A team needs an editor undo history with stable nodes. Which DSA decision should guide its next step?
  choices:
  - id: a
    text: Choose Linked Structures and Memory-Aware Containers based on choosing links only when their update pattern pays for their overhead.
  - id: b
    text: Choose a structure only because its syntax is short.
  - id: c
    text: Ignore memory and input limits.
  - id: d
    text: Hand-implement every library feature first.
  answer:
    choiceId: a
  explanation: The correct choice matches operations and constraints; the alternatives ignore the evidence needed for an engineering decision.
