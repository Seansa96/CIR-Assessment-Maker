    title: Security descriptors
    required: true
    content: 'Windows access control uses security descriptors and access tokens to mediate object access.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Permissions depend on token identity and object policy together.

      '
