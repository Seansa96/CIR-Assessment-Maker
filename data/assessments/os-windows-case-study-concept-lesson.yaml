    title: Subsystem compatibility
    required: true
    content: 'Compatibility layers and subsystems help support different APIs and historical expectations.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Compatibility can constrain design choices.

      '
