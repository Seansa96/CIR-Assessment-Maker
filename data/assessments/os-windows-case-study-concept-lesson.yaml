lesson:
  introduction: 'This lesson introduces Windows Case Study through the mental models emphasized by 11 Windows 8 Case Study.
    Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: windows-design-lens
    title: Windows design lens
    required: true
    content: 'Windows emphasizes object-based kernel structures, compatibility, security descriptors, and broad device/application
      support.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A case study is best read for design tradeoffs, not just product trivia.

      '
    check:
      id: windows-design-lens-check
      title: 'Check: Windows design lens'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Windows design lens**?

        '
      choices:
      - id: a
        text: Windows emphasizes object-based kernel structures, compatibility, security descriptors, and broad device/application
          support.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Windows emphasizes object-based kernel structures, compatibility, security descriptors, and broad device/application
        support. Related topic: Windows Case Study.

        '
  - id: objects-and-handles
    title: Objects and handles
    required: true
    content: 'Windows exposes many kernel-managed resources through object handles.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A handle is a reference with mediated access, not the object itself.

      '
    check:
      id: objects-and-handles-check
      title: 'Check: Objects and handles'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Objects and handles**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Windows exposes many kernel-managed resources through object handles.
      answer:
        choiceId: d
      explanation: 'Windows exposes many kernel-managed resources through object handles. Related topic: Windows Case Study.

        '
  - id: registry
    title: Registry
    required: true
    content: 'The registry stores structured configuration used by the OS and applications.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      The registry is not equivalent to a file system, even though it stores persistent data.

      '
    check:
