questions:
- id: q1
  type: numericResponse
  prompt: A gyroscope has an angular momentum $L$ and is subjected to a gravitational
    torque $\tau$. The precession angular velocity is given by $\Omega = \tau / L$.
    If the torque is $2.0 \text{ N}\cdot\text{m}$ and $L = 10 \text{ kg}\cdot\text{m}^2/\text{s}$,
    what is $\Omega$?
  answer:
    value: 0.2
    tolerance: 0.05
  explanation: $\Omega = 2.0 / 10 = 0.2 \text{ rad/s}$.
