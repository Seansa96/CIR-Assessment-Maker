schemaVersion: 1
id: chemistry-measurements-significant-figures
title: Measurements and Significant Figures
assessmentType: quiz
categoryId: chemistry
subcategoryId: chemistry-measurements
subcategoryIds:
  - chemistry-measurements
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "Which SI base unit measures length?"
    choices:
      - id: a
        text: "meter"
      - id: b
        text: "liter"
      - id: c
        text: "gram"
      - id: d
        text: "kelvin"
    answer: { choiceId: a }
    explanation: |
      The meter is the SI base unit for length.

      Related topic: SI Units
  - id: q002
    type: multipleChoice
    prompt: "Which SI base unit measures mass?"
    choices:
      - id: a
        text: "kilogram"
      - id: b
        text: "meter"
      - id: c
        text: "second"
      - id: d
        text: "mole"
    answer: { choiceId: a }
    explanation: |
      The kilogram is the SI base unit for mass.

      Related topic: SI Base Units
  - id: q003
    type: multipleChoice
    prompt: "Which unit commonly measures volume in chemistry labs?"
    choices:
      - id: a
        text: "liter"
      - id: b
        text: "kelvin"
      - id: c
        text: "newton"
      - id: d
        text: "pascal"
    answer: { choiceId: a }
    explanation: |
      Liters and milliliters are common chemistry volume units.

      Related topic: Volume Units
  - id: q004
    type: multipleChoice
    prompt: "What does precision describe?"
    choices:
      - id: a
        text: "How close repeated measurements are to one another"
      - id: b
        text: "How close a measurement is to the accepted value"
      - id: c
        text: "The number of atoms in a sample"
      - id: d
        text: "The color of a solution"
    answer: { choiceId: a }
    explanation: |
      Precision is about reproducibility among repeated measurements.

      Related topic: Precision
  - id: q005
    type: multipleChoice
    prompt: "What does accuracy describe?"
    choices:
      - id: a
        text: "How close a measurement is to the accepted value"
      - id: b
        text: "How many trials were performed"
      - id: c
        text: "How close repeated values are to each other"
      - id: d
        text: "The number of decimal places only"
    answer: { choiceId: a }
    explanation: |
      Accuracy compares a measurement to the true or accepted value.

      Related topic: Accuracy
  - id: q006
    type: multipleChoice
    prompt: "How many significant figures are in 0.00450?"
    choices:
      - id: a
        text: "3"
      - id: b
        text: "2"
      - id: c
        text: "5"
      - id: d
        text: "1"
    answer: { choiceId: a }
    explanation: |
      Leading zeros are not significant, but the 4, 5, and trailing zero after the decimal are significant.

      Related topic: Significant Figures with Leading Zeros
  - id: q007
    type: multipleChoice
    prompt: "How many significant figures are in 120.0?"
    choices:
      - id: a
        text: "4"
      - id: b
        text: "2"
      - id: c
        text: "3"
      - id: d
        text: "1"
    answer: { choiceId: a }
    explanation: |
      The decimal point shows that the trailing zero is measured and significant.

      Related topic: Significant Trailing Zeros
  - id: q008
    type: multipleChoice
    prompt: "Round 3.456 to three significant figures."
    choices:
      - id: a
        text: "3.46"
      - id: b
        text: "3.45"
      - id: c
        text: "3.456"
      - id: d
        text: "3.5"
    answer: { choiceId: a }
    explanation: |
      The fourth significant digit is 6, so 3.45 rounds up to 3.46.

      Related topic: Rounding Significant Figures
  - id: q009
    type: multipleChoice
    prompt: "For multiplication and division, the answer should have:"
    choices:
      - id: a
        text: "The same number of significant figures as the factor with the fewest significant figures"
      - id: b
        text: "The same number of decimal places as the first number"
      - id: c
        text: "Always four significant figures"
      - id: d
        text: "No units"
    answer: { choiceId: a }
    explanation: |
      Multiplication and division are limited by the least precise significant-figure count.

      Related topic: Sig Figs in Multiplication and Division
  - id: q010
    type: multipleChoice
    prompt: "For addition and subtraction, the answer should be rounded by:"
    choices:
      - id: a
        text: "Decimal places"
      - id: b
        text: "Total significant figures"
      - id: c
        text: "Molar mass"
      - id: d
        text: "Alphabetical order"
    answer: { choiceId: a }
    explanation: |
      Addition and subtraction are limited by the least precise decimal place.

      Related topic: Sig Figs in Addition and Subtraction
  - id: q011
    type: multipleChoice
    prompt: "Which number is written in scientific notation?"
    choices:
      - id: a
        text: "4.2 x 10^3"
      - id: b
        text: "42.0 x 10^2"
      - id: c
        text: "0.42 x 10^4"
      - id: d
        text: "4200"
    answer: { choiceId: a }
    explanation: |
      Scientific notation uses a coefficient from 1 up to but not including 10.

      Related topic: Scientific Notation
  - id: q012
    type: multipleChoice
    prompt: "What is 0.00062 in scientific notation?"
    choices:
      - id: a
        text: "6.2 x 10^-4"
      - id: b
        text: "6.2 x 10^4"
      - id: c
        text: "62 x 10^-4"
      - id: d
        text: "0.62 x 10^-3"
    answer: { choiceId: a }
    explanation: |
      Moving the decimal four places right gives $6.2$, so the exponent is $-4$.

      Related topic: Small Numbers in Scientific Notation
  - id: q013
    type: multipleChoice
    prompt: "Which prefix means one-thousandth?"
    choices:
      - id: a
        text: "milli-"
      - id: b
        text: "kilo-"
      - id: c
        text: "centi-"
      - id: d
        text: "mega-"
    answer: { choiceId: a }
    explanation: |
      Milli- means $10^{-3}$.

      Related topic: Metric Prefixes
  - id: q014
    type: multipleChoice
    prompt: "Which prefix means one thousand?"
    choices:
      - id: a
        text: "kilo-"
      - id: b
        text: "milli-"
      - id: c
        text: "micro-"
      - id: d
        text: "centi-"
    answer: { choiceId: a }
    explanation: |
      Kilo- means $10^3$.

      Related topic: Metric Prefixes
  - id: q015
    type: multipleChoice
    prompt: "Which temperature scale is used most often for gas-law calculations?"
    choices:
      - id: a
        text: "Kelvin"
      - id: b
        text: "Celsius only"
      - id: c
        text: "Fahrenheit only"
      - id: d
        text: "Rankine only"
    answer: { choiceId: a }
    explanation: |
      Kelvin is an absolute temperature scale and is required in many chemistry calculations.

      Related topic: Temperature Units
  - id: q016
    type: multipleChoice
    prompt: "Convert 25 degrees Celsius to Kelvin."
    choices:
      - id: a
        text: "298 K"
      - id: b
        text: "25 K"
      - id: c
        text: "248 K"
      - id: d
        text: "273 K"
    answer: { choiceId: a }
    explanation: |
      Add 273.15 to Celsius: $25+273.15\approx298$ K.

      Related topic: Celsius to Kelvin
  - id: q017
    type: multipleChoice
    prompt: "What is density?"
    choices:
      - id: a
        text: "Mass per unit volume"
      - id: b
        text: "Volume per unit temperature"
      - id: c
        text: "Length per unit mass"
      - id: d
        text: "Energy per mole only"
    answer: { choiceId: a }
    explanation: |
      Density is calculated as $d=m/V$.

      Related topic: Density
  - id: q018
    type: multipleChoice
    prompt: "Which unit could represent density?"
    choices:
      - id: a
        text: "g/mL"
      - id: b
        text: "mL/g"
      - id: c
        text: "g x mL"
      - id: d
        text: "K/g"
    answer: { choiceId: a }
    explanation: |
      Density is mass divided by volume, such as grams per milliliter.

      Related topic: Density Units
  - id: q019
    type: multipleChoice
    prompt: "A measured value is 9.80 g and the accepted value is 10.00 g. The measurement is:"
    choices:
      - id: a
        text: "Close to accurate but slightly low"
      - id: b
        text: "Impossible to evaluate"
      - id: c
        text: "Exactly accurate"
      - id: d
        text: "A unit conversion"
    answer: { choiceId: a }
    explanation: |
      The value is near the accepted value but is below it.

      Related topic: Interpreting Measurement Error
  - id: q020
    type: multipleChoice
    prompt: "Why should units be included with measurements?"
    choices:
      - id: a
        text: "Units define what quantity the number represents"
      - id: b
        text: "Units are optional decoration"
      - id: c
        text: "Units only matter in physics"
      - id: d
        text: "Units replace significant figures"
    answer: { choiceId: a }
    explanation: |
      A number without a unit is often ambiguous or meaningless in chemistry.

      Related topic: Units and Measurement Meaning
