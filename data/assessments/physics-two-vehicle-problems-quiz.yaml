questions:
- id: q001
  type: numericResponse
  prompt: 'A cyclist is $60\ \text{m}$ behind a runner. The cyclist rides at $8\ \text{m/s}$
    and the runner moves at $5\ \text{m/s}$ in the same direction.


    How long does it take the cyclist to catch the runner?

    '
  answer:
    value: 20
    tolerance: 0.001
  explanation: 'Use relative closing speed because both speeds are constant and same-direction:


    $$

    v_{\text{rel}}=8-5=3\ \text{m/s}.

    $$


    Then


    $$

    t=\frac{60}{3}=20\ \text{s}.

    $$


    Related topic: same-direction catch-up with constant velocities. Technique order:
    gap, relative speed, time.

    '
- id: q002
  type: numericResponse
  prompt: 'Two cars are $500\ \text{m}$ apart and drive toward each other. One moves
    at $18\ \text{m/s}$ and the other at $22\ \text{m/s}$.


    How long until they meet?

    '
  answer:
    value: 12.5
    tolerance: 0.001
  explanation: 'Toward-each-other motion uses added closing speed:


    $$

    v_{\text{rel}}=18+22=40\ \text{m/s}.

    $$


    Then


    $$

    t=\frac{500}{40}=12.5\ \text{s}.

    $$


    Related topic: two-vehicle meeting problems. Technique order: total separation,
    closing speed, time.

    '
- id: q003
  type: numericResponse
  prompt: 'Car A starts $40\ \text{m}$ ahead and moves at $10\ \text{m/s}$. Car B
    starts behind it from rest and accelerates at $2.0\ \text{m/s}^2$.


    How long until Car B catches Car A?

    '
  answer:
    value: 14.83
    tolerance: 0.02
  explanation: 'Write positions from Car B''s start:


    $$

    x_A=40+10t,\qquad x_B=\frac{1}{2}(2.0)t^2=t^2.

    $$


    Set equal:


    $$

    t^2=40+10t.

    $$


    The positive root of $t^2-10t-40=0$ is about $14.83\ \text{s}$.


    Related topic: accelerating catch-up. Technique order: position equations, equal-position
    condition, positive root.

    '
- id: q004
  type: numericResponse
  prompt: 'A car moving $25\ \text{m/s}$ passes a stopped motorcycle. The motorcycle
    starts $4.0\ \text{s}$ later from rest and accelerates at $5.0\ \text{m/s}^2$.


    How many seconds after the motorcycle starts does it catch the car?

    '
  answer:
    value: 14.0
    tolerance: 0.02
  explanation: 'Convert the delay into a head start:


    $$

    d_0=25(4.0)=100\ \text{m}.

    $$


    Use time from motorcycle start:


    $$

    x_c=100+25t,\qquad x_m=\frac{1}{2}(5.0)t^2=2.5t^2.

    $$


    Set equal:


    $$

    2.5t^2=100+25t.

    $$


    This becomes $t^2-10t-40=0$, so $t\a\approx14.0\ \text{s}$.


    Related topic: delayed accelerating pursuit. Technique order: delay to distance,
    position equations, solve quadratic.

    '
- id: q005
  type: numericResponse
  prompt: 'Vehicle A starts at $x=0$ with velocity $6\ \text{m/s}$ and acceleration
    $1.0\ \text{m/s}^2$. Vehicle B starts at $x=80\ \text{m}$ and moves at constant
    velocity $10\ \text{m/s}$.


    When does Vehicle A catch Vehicle B?

    '
  answer:
    value: 17.32
    tolerance: 0.02
  explanation: 'Write both positions:


    $$

    x_A=6t+\frac{1}{2}(1.0)t^2=6t+0.5t^2,

    $$


    $$

    x_B=80+10t.

    $$


    Set equal:


    $$

    0.5t^2+6t=80+10t.

    $$


    Rearrange to $t^2-8t-160=0$. The positive root is about $17.32\ \text{s}$.


    Related topic: both initial velocity and acceleration in a catch-up equation.

    '
- id: q006
  type: numericResponse
  prompt: 'Two trains move in the same direction. The faster train is $300\ \text{m}$
    behind and moves at $30\ \text{m/s}$. The slower train moves at $20\ \text{m/s}$.


    How long until the faster train reaches the slower train''s current position?

    '
  answer:
    value: 30
    tolerance: 0.001
  explanation: 'This asks for closing a $300\ \text{m}$ gap, not complete train passing.
    Same-direction relative speed is


    $$

    v_{\text{rel}}=30-20=10\ \text{m/s}.

    $$


    Then


    $$

    t=\frac{300}{10}=30\ \text{s}.

    $$


    Related topic: catch-up versus complete passing distance. Technique order: identify
    what distance must close, then use relative speed.

    '
- id: q007
  type: numericResponse
  prompt: 'Car A starts from rest at a stoplight and accelerates at $3.0\ \text{m/s}^2$.
    At the same instant, Car B passes the light moving at $12\ \text{m/s}$.


    How long until Car A catches Car B?

    '
  answer:
    value: 8
    tolerance: 0.001
  explanation: 'Use the stoplight as the origin:


    $$

    x_A=\frac{1}{2}(3.0)t^2=1.5t^2,\qquad x_B=12t.

    $$


    Set equal:


    $$

    1.5t^2=12t.

    $$


    The nonzero catch time is $t=8\ \text{s}$.


    Related topic: catch-up from same starting position. Technique order: equal positions,
    discard the initial shared time root.

    '
- id: q008
  type: numericResponse
  prompt: 'Two vehicles start $240\ \text{m}$ apart and move toward each other. Vehicle
    A starts from rest and accelerates at $2.0\ \text{m/s}^2$. Vehicle B moves at
    constant speed $12\ \text{m/s}$ toward Vehicle A.


    How long until they meet?

    '
  answer:
    value: 10.39
    tolerance: 0.02
  explanation: 'Use distance closed. Vehicle A closes


    $$

    \frac{1}{2}(2.0)t^2=t^2

    $$


    while Vehicle B closes $12t$. Together:


    $$

    t^2+12t=240.

    $$


    The positive root of $t^2+12t-240=0$ is about $10.39\ \text{s}$.


    Related topic: meeting with one accelerating vehicle. Technique order: sum closed
    distances, solve positive root.

    '
- id: q009
  type: numericResponse
  prompt: 'A delivery van is $150\ \text{m}$ ahead and moving at $15\ \text{m/s}$.
    A car behind it moves at $25\ \text{m/s}$ but waits $3.0\ \text{s}$ before starting
    to chase.


    After the car starts moving,\rhow long does it take to catch the van?

    '
  answer:
    value: 19.5
    tolerance: 0.001
  explanation: 'During the $3.0\ \text{s}$ wait, the van adds


    $$

    15(3.0)=45\ \text{m}

    $$


    to the initial gap, so the new gap is $195\ \text{m}$. After the car starts, relative
    speed is


    $$

    25-15=10\ \text{m/s}.

    $$


    Thus


    $$

    t=\frac{195}{10}=19.5\ \text{s}.

    $$


    Related topic: delayed constant-speed pursuit. Technique order: update gap during
    delay, then close with relative speed.

    '
- id: q010
  type: numericResponse
  prompt: 'Vehicle A starts at $x=0$ and moves with $x_A=5t+2t^2$. Vehicle B starts
    at $x=60\ \text{m}$ and moves with $x_B=60+9t$.


    At what positive time do they have the same position?

    '
  answer:
    value: 6.57
    tolerance: 0.02
  explanation: 'The equation is already in position form. Set positions equal:


    $$

    5t+2t^2=60+9t.

    $$


    Rearrange:


    $$

    2t^2-4t-60=0,

    $$


    or $t^2-2t-30=0$. The positive root is


    $$

    t=1+\sqrt{31}\a\approx6.57\ \text{s}.

    $$


    Related topic: solving from given position functions. Technique order: set functions
    equal, rearrange, choose positive root.

    '
