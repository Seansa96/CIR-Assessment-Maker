questions:
- id: q001
  type: freeResponse
  prompt: 'Give an example in which there are clear distinctions among:


    - distance traveled

    - displacement

    - magnitude of displacement


    Identify each quantity in your example.

    '
  answer:
    expected: 'Example: A person walks 3 m east, then 4 m west.


      Distance traveled = 7 m


      Displacement = -1 m (west)


      Magnitude of displacement = 1 m

      '
    gradingMode: selfCheck
  explanation: 'Distance is the total path length.


    Displacement is the net change in position.


    Magnitude of displacement is the absolute value of displacement.


    Related topic: Distance and Displacement

    '
- id: q002
  type: multipleChoice
  prompt: 'Under what circumstances does distance traveled equal the magnitude of
    displacement?

    '
  choices:
  - id: a
    text: Whenever the object moves at constant speed
  - id: b
    text: Whenever the object moves in a straight line without reversing direction
  - id: c
    text: Whenever acceleration is zero
  - id: d
    text: Whenever velocity is positive
  answer:
    choiceId: b
  explanation: 'Distance and displacement magnitude are equal only when no change
    in direction occurs.


    Related topic: Distance Versus Displacement Magnitude

    '
- id: q003
  type: multipleChoice
  prompt: 'Bacteria often travel large distances while having very small displacements.


    Why?

    '
  choices:
  - id: a
    text: They frequently reverse direction and move randomly.
  - id: b
    text: They travel too slowly to accumulate displacement.
  - id: c
    text: Their acceleration is always zero.
  - id: d
    text: Their velocity is always positive.
  answer:
    choiceId: a
  explanation: 'Random motion causes the total path length to become large while net
    displacement remains small.


    Related topic: Path Length and Net Displacement

    '
- id: q004
  type: freeResponse
  prompt: 'Give an example of a device used to measure time and explain what change
    in the device indicates the passage of time.

    '
  answer:
    expected: 'Example: A clock.


      The movement of the hands or the changing numerical display indicates the passage
      of time.

      '
    gradingMode: selfCheck
  explanation: 'Time-measuring devices track some predictable physical change.


    Related topic: Measurement of Time

    '
- id: q005
  type: multipleChoice
  prompt: 'A car''s odometer measures:

    '
  choices:
  - id: a
    text: Displacement
  - id: b
    text: Average velocity
  - id: c
    text: Distance traveled
  - id: d
    text: Acceleration
  answer:
    choiceId: c
  explanation: 'Odometers accumulate total path length traveled.


    Related topic: Distance Measurement

    '
- id: q006
  type: multipleChoice
  prompt: 'During a certain time interval an object''s average velocity is zero.


    What must be true?

    '
  choices:
  - id: a
    text: Its acceleration was zero.
  - id: b
    text: Its displacement was zero.
  - id: c
    text: Its speed was zero.
  - id: d
    text: It never moved.
  answer:
    choiceId: b
  explanation: 'Average velocity equals displacement divided by time.


    Zero average velocity implies zero displacement.


    Related topic: Average Velocity and Displacement

    '
- id: q007
  type: freeResponse
  prompt: 'Explain the difference between average speed and the magnitude of average
    velocity.


    Give an example illustrating the difference.

    '
  answer:
    expected: 'Average speed depends on total distance traveled.


      Magnitude of average velocity depends on displacement.


      Example: Walk 10 m east and 10 m west.


      Distance = 20 m


      Displacement = 0 m


      Average speed is nonzero while magnitude of average velocity is zero.

      '
    gradingMode: selfCheck
  explanation: 'Distance and displacement are fundamentally different quantities.


    Related topic: Average Speed Versus Average Velocity

    '
- id: q008
  type: multipleChoice
  prompt: 'A car''s speedometer measures:

    '
  choices:
  - id: a
    text: Velocity
  - id: b
    text: Displacement
  - id: c
    text: Speed
  - id: d
    text: Acceleration
  answer:
    choiceId: c
  explanation: 'Speedometers provide magnitude only and do not indicate direction.


    Related topic: Speed as a Scalar Quantity

    '
- id: q009
  type: multipleChoice
  prompt: 'You divide the total distance shown on an odometer by the elapsed travel
    time.


    What quantity have you calculated?

    '
  choices:
  - id: a
    text: Average velocity
  - id: b
    text: Average speed
  - id: c
    text: Instantaneous speed
  - id: d
    text: Displacement
  answer:
    choiceId: b
  explanation: 'Distance divided by time gives average speed.


    Related topic: Average Speed

    '
- id: q010
  type: freeResponse
  prompt: 'How are instantaneous velocity and instantaneous speed related?


    How do they differ?

    '
  answer:
    expected: 'Instantaneous speed is the magnitude of instantaneous velocity.


      Velocity includes direction while speed does not.

      '
    gradingMode: selfCheck
  explanation: 'Speed is a scalar.


    Velocity is a vector.


    Related topic: Instantaneous Speed and Velocity

    '
- id: q011
  type: multipleChoice
  prompt: 'Is it possible for speed to be constant while acceleration is not zero?

    '
  choices:
  - id: a
    text: No, acceleration must always be zero if speed is constant.
  - id: b
    text: Yes, such as during uniform circular motion.
  - id: c
    text: Only when velocity is zero.
  - id: d
    text: Only when displacement is zero.
  answer:
    choiceId: b
  explanation: 'In uniform circular motion, speed remains constant while direction
    changes, producing acceleration.


    Related topic: Acceleration from Changing Direction

    '
- id: q012
  type: freeResponse
  prompt: 'Is it possible for velocity to remain constant while acceleration is not
    zero?


    Explain.

    '
  answer:
    expected: 'No.


      Acceleration is the rate of change of velocity.


      If velocity is constant, acceleration must be zero.

      '
    gradingMode: selfCheck
  explanation: 'Constant velocity implies neither magnitude nor direction is changing.


    Related topic: Constant Velocity and Zero Acceleration

    '
- id: q013
  type: freeResponse
  prompt: 'Give an example in which velocity is zero but acceleration is not zero.

    '
  answer:
    expected: 'Example: A ball thrown straight upward.


      At the highest point, velocity is zero but acceleration due to gravity is still
      downward.

      '
    gradingMode: selfCheck
  explanation: 'Zero velocity does not imply zero acceleration.


    Related topic: Velocity and Acceleration at an Instant

    '
- id: q014
  type: multipleChoice
  prompt: 'A subway train is moving to the left (negative velocity) and comes to a
    stop.


    What is the direction of its acceleration?

    '
  choices:
  - id: a
    text: Left
  - id: b
    text: Zero
  - id: c
    text: Right
  - id: d
    text: Impossible to determine
  answer:
    choiceId: c
  explanation: 'The train''s velocity is becoming less negative.


    Therefore acceleration points to the right (positive direction).


    Related topic: Acceleration Direction from Velocity Change

    '
- id: q015
  type: freeResponse
  prompt: 'In one-dimensional motion, what sign of acceleration reduces:


    1. The magnitude of a negative velocity?

    2. The magnitude of a positive velocity?

    '
  answer:
    expected: 'A positive acceleration reduces the magnitude of a negative velocity.


      A negative acceleration reduces the magnitude of a positive velocity.

      '
    gradingMode: selfCheck
  explanation: 'Acceleration opposite the velocity direction decreases speed.


    Related topic: Acceleration Sign and Speed Changes

    '
- id: q016
  type: multipleChoice
  prompt: 'When solving a one-dimensional constant-acceleration problem using the
    kinematic equations,\rhow many known variables are generally required to determine
    the remaining unknown quantities?

    '
  choices:
  - id: a
    text: One
  - id: b
    text: Two
  - id: c
    text: Three
  - id: d
    text: Four
  answer:
    choiceId: c
  explanation: 'The kinematic equations contain five variables:


    $$

    x,\;v,\;v_0,\;a,\;t

    $$


    If three are known, the remaining two can generally be determined.


    Related topic: Variables in One-Dimensional Kinematics

    '
- id: q017
  type: freeResponse
  prompt: 'Describe two situations in which three known quantities require the use
    of two kinematic equations to determine the remaining unknown quantities.

    '
  answer:
    expected: 'Example 1:

      Known $v_0$, $a$, and $x$.

      Need to find $v$ and $t$.


      Example 2:

      Known $v$, $v_0$, and $t$.

      Need to find $a$ and $x$.

      '
    gradingMode: selfCheck
  explanation: 'Whenever two variables remain unknown, multiple kinematic equations
    are often required.


    Related topic: Choosing Kinematic Equations

    '
- id: q018
  type: multipleChoice
  prompt: 'Ignoring air resistance, what is the acceleration of a rock thrown straight
    upward?

    '
  choices:
  - id: a
    text: Positive on the way up, zero at the top, negative on the way down
  - id: b
    text: Zero everywhere except at the top
  - id: c
    text: Constant downward acceleration throughout the entire motion
  - id: d
    text: Positive throughout the entire motion
  answer:
    choiceId: c
  explanation: 'Gravity acts continuously.


    Near Earth''s surface:


    $$

    a=-9.8\text{ m/s}^2

    $$


    at all points of the motion.


    Related topic: Acceleration Due to Gravity

    '
- id: q019
  type: freeResponse
  prompt: 'An object is thrown straight upward and falls back to Earth.


    Answer the following:


    1. When is its velocity zero?

    2. Does its velocity change direction?

    3. Does its acceleration have the same sign on the way up and on the way down?

    '
  answer:
    expected: 'Velocity is zero only at the highest point.


      Yes, velocity changes direction.


      Yes, acceleration remains negative throughout the motion.

      '
    gradingMode: selfCheck
  explanation: 'Gravity continues to act downward before, during, and after the highest
    point.


    Related topic: Vertical Motion Under Gravity

    '
- id: q020
  type: multipleChoice
  prompt: 'A rock nearly hits a coconut on the way up and later hits it on the way
    down at the same height.


    Ignoring air resistance,\rhow does the speed on the way down compare with the speed
    on the way up at that same height?

    '
  choices:
  - id: a
    text: The speed is greater on the way down
  - id: b
    text: The speed is greater on the way up
  - id: c
    text: The speeds are equal
  - id: d
    text: It depends on the mass of the rock
  answer:
    choiceId: c
  explanation: 'At the same height, conservation of energy implies the same speed
    magnitude.


    The directions differ, but the speeds are equal.


    Related topic: Speed Symmetry in Vertical Motion

    '
- id: q021
  type: multipleChoice
  prompt: 'Assuming the same safe landing speed,\rhow many times higher could a safe
    fall occur on the Moon compared with Earth?


    Use:


    $$

    g_{\text{Moon}}=\frac{1}{6}g_{\text{Earth}}

    $$

    '
  choices:
  - id: a
    text: 2 times
  - id: b
    text: 3 times
  - id: c
    text: 6 times
  - id: d
    text: 12 times
  answer:
    choiceId: c
  explanation: 'Using


    $$

    v^2=2gh

    $$


    for a fixed landing speed,


    $$

    h\propto \frac1g

    $$


    Therefore:


    $$

    h_{\text{Moon}}=6h_{\text{Earth}}

    $$


    Related topic: Gravity and Safe Fall Height

    '
- id: q022
  type: freeResponse
  prompt: 'If an astronaut leaves the ground with the same takeoff speed on Earth
    and on the Moon,\rhow many times higher can she jump on the Moon?


    Explain your reasoning.

    '
  answer:
    expected: 'About six times higher.


      Using


      $$

      v^2=2gh

      $$


      and keeping the takeoff speed fixed,


      height is inversely proportional to gravity.


      Since Moon gravity is one-sixth of Earth''s, the jump height is six times larger.

      '
    gradingMode: selfCheck
  explanation: 'The maximum height satisfies


    $$

    h=\frac{v_0^2}{2g}

    $$


    so reducing gravity by a factor of six increases height by a factor of six.


    Related topic: Maximum Height in Vertical Motion

    '
