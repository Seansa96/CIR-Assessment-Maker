schemaVersion: 1
id: calc2-arc-length-surface-area-concept-lesson-s2c
title: 'Arc Length and Surface Area: Build the Differential Geometry Model'

assessmentType: conceptLesson
categoryId: calculus-2
topicId: arc-length-surface-area
modeDefault: practice
randomizeQuestions: false
skills: [arc-length, surface-area-of-revolution, differential-geometry, integration]
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [calculus-2, arc-length, surface-area] }
authoring: { visualRequirement: required, visualRationale: Both formulas come from a short slanted segment and its swept band. }
lesson:
  introduction: 'Arc length and surface area are not ordinary area formulas. Start with a small slanted segment, then identify how that segment contributes length or sweeps a thin band.'
  sections:
    - { id: a1, title: '1. Approximate a curve with short straight segments', required: true, content: 'Over a tiny horizontal change $dx$, a differentiable curve changes vertically by approximately $dy=f''(x)dx$. The Pythagorean theorem gives $ds=\sqrt{dx^2+dy^2}=\sqrt{1+[f''(x)]^2}\,dx$.', media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Short slanted curve segment decomposed into dx and dy, caption: 'The differential arc length ds is the hypotenuse of a tiny right triangle.' }], check: { id: c1, type: multipleChoice, prompt: 'Which expression approximates the length of a small segment of y=f(x)?', choices: [{ id: a, text: '$\sqrt{1+[f''(x)]^2}\,dx$' }, { id: b, text: '$f(x)dx$' }, { id: c, text: '$\pi[f(x)]^2dx$' }, { id: d, text: '$f''(x)dx$' }], answer: { choiceId: a }, explanation: 'Solution: $ds=\sqrt{1+[f''(x)]^2}dx$. Why it works: Divide the Pythagorean expression $\sqrt{dx^2+dy^2}$ by $dx$ after using $dy=f''(x)dx$. Common trap: $f''(x)dx$ is vertical change, not slanted distance. Why the other choices fail: b is not a distance formula; c is disk area; d omits the horizontal change.' } }
    - { id: a2, title: '2. Accumulate the differential arc length', required: true, content: 'For $y=f(x)$ on $[a,b]$, add the small lengths: $L=\int_a^b\sqrt{1+[f''(x)]^2}\,dx$. The bounds are x-values because the differential is dx.', media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Curve divided into short slanted segments over an x interval, caption: 'Add ds from the first to the last x-location.' }], check: { id: c2, type: multipleChoice, prompt: 'What belongs inside an arc-length integrand for y=f(x)?', choices: [{ id: a, text: '$\sqrt{1+[f''(x)]^2}$' }, { id: b, text: '$f(x)^2$' }, { id: c, text: '$1+f''(x)$' }, { id: d, text: '$\sqrt{f(x)}$' }], answer: { choiceId: a }, explanation: 'Solution: Use $\sqrt{1+[f''(x)]^2}$. Why it works: It comes from a tiny right triangle with legs dx and $f''(x)dx$. Common trap: The derivative is squared before adding 1. Why the other choices fail: b and d use function values; c fails the Pythagorean step.' } }
    - { id: a3, title: '3. A horizontal description uses dy instead', required: true, content: 'If $x=g(y)$ is simpler, then $L=\int_c^d\sqrt{1+[g''(y)]^2}\,dy$. Change the derivative, bounds, and differential together.', media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Slanted segment decomposed using dy and dx, caption: 'The variable of accumulation controls derivative and bounds.' }], check: { id: c3, type: multipleChoice, prompt: 'If the curve is written x=g(y), which derivative enters the dy arc-length formula?', choices: [{ id: a, text: '$g''(y)$' }, { id: b, text: '$f''(x)$' }, { id: c, text: '$g(y)^2$' }, { id: d, text: none }], answer: { choiceId: a }, explanation: 'Solution: Use $g''(y)$. Why it works: The small horizontal change is $dx=g''(y)dy$. Common trap: Do not switch only the differential while keeping an x-derivative. Why the other choices fail: b belongs to a different representation; c omits differentiation; d ignores the slant.' } }
    - { id: a4, title: '4. Surface area is circumference times slanted length', required: true, content: 'Rotating a differential curve segment around the x-axis sweeps a thin band with area $dS=2\pi(\text{radius})ds$. For y=f(x), the radius is $|f(x)|$.', media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Slanted curve segment swept into a narrow surface band about an axis, caption: 'A surface band has circumference times slanted width ds.' }], check: { id: c4, type: multipleChoice, prompt: 'What geometric factor is added when a curve segment is revolved?', choices: [{ id: a, text: circumference $2\pi r$ }, { id: b, text: disk area $\pi r^2$ }, { id: c, text: an extra dx only }, { id: d, text: a constant slope only }], answer: { choiceId: a }, explanation: 'Solution: Multiply ds by $2\pi r$. Why it works: The segment sweeps a narrow band around a circular path. Common trap: $\pi r^2$ is a cross-sectional disk area, not lateral surface. Why the other choices fail: b models volume; c lacks radius; d does not measure a swept band.' } }
    - { id: a5, title: '5. Measure the surface radius from the axis', required: true, content: 'About the x-axis, radius is $|y|$; about $y=k$, radius is $|f(x)-k|$. The curve can cross an axis, so a distance may require absolute value or a partition.', media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Radius from a curve to an offset horizontal axis, caption: 'Surface radius is an axis distance, not automatically a function value.' }], check: { id: c5, type: freeResponse, prompt: 'For rotation of y=f(x) about y=3, write the radius.', answer: { gradingMode: selfCheck, keyPoints: ['$|f(x)-3|$'] }, explanation: 'Solution: Radius is $|f(x)-3|$. Why it works: A distance to a horizontal axis is a vertical coordinate difference. Common trap: f(x) alone assumes y=0.' } }
    - { id: a6, title: '6. Combine the pieces only after labeling them', required: true, content: 'For rotation about the x-axis, $S=2\pi\int_a^b|f(x)|\sqrt{1+[f''(x)]^2}\,dx$. Label radius and ds separately before multiplying; this prevents confusing surface area with disk/washer volume.', media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Surface-area formula mapped to radius and arc-length factors, caption: 'Surface area is radius times differential arc length times circumference constant.' }], check: { id: c6, type: multipleChoice, prompt: 'Which factor distinguishes surface area from arc length alone?', choices: [{ id: a, text: '$2\pi\times$ radius' }, { id: b, text: the derivative under the square root }, { id: c, text: integration bounds }, { id: d, text: the differential dx }], answer: { choiceId: a }, explanation: 'Solution: Surface area adds the circumference factor $2\pi r$. Why it works: Each curve segment becomes a circular band. Common trap: Arc length already contains the square-root factor. Why the other choices fail: b, c, and d occur in arc length as well.' } }
    - { id: a7, title: '7. Check conditions, units, and reasonableness', required: true, content: 'Arc length has length units; surface area has square units. Check the derivative, nonnegative radius, bounds, and whether an algebraic substitution actually makes the square root integrable.', media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Differential segment with a unit check, caption: 'The model must have the requested units before it can be trusted.' }], check: { id: c7, type: freeResponse, prompt: 'State one check that catches a mistaken surface-area setup.', answer: { gradingMode: selfCheck, keyPoints: [radius distance, square units, derivative inside square root, axis labeled] }, explanation: 'Solution: Check the axis-based radius, the derivative inside ds, or the square units. Why it works: Each is an independent feature of the geometry. Common trap: A correct antiderivative cannot repair a surface-area integrand that omitted radius.' } }
