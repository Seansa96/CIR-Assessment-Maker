  - id: a6
    title: 6. Combine the pieces only after labeling them
    required: true
    content: For rotation about the x-axis, $S=2\pi\int_a^b|f(x)|\sqrt{1+[f'(x)]^2}\,dx$. Label radius and ds separately before multiplying; this prevents confusing surface area with disk/washer volume.
    media:
    - type: image
      src: /media/calculus/disk-washer-model.svg
      alt: Surface-area formula mapped to radius and arc-length factors
      caption: Surface area is radius times differential arc length times circumference constant.
    check:
      id: c6
      type: multipleChoice
      prompt: Which factor distinguishes surface area from arc length alone?
      choices:
      - id: a
        text: $2\pi\times$ radius
        media: []
        issueSignals: []
      - id: b
        text: the derivative under the square root
        media: []
        issueSignals: []
      - id: c
        text: integration bounds
        media: []
        issueSignals: []
      - id: d
        text: the differential dx
        media: []
        issueSignals: []
