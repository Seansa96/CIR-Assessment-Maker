lesson:
  introduction: Arc length and surface area are not ordinary area formulas. Start with a small slanted segment, then identify how that segment contributes length or sweeps a thin band.
  sections:
  - id: a1
    title: 1. Approximate a curve with short straight segments
    required: true
    content: Over a tiny horizontal change $dx$, a differentiable curve changes vertically by approximately $dy=f'(x)dx$. The Pythagorean theorem gives $ds=\sqrt{dx^2+dy^2}=\sqrt{1+[f'(x)]^2}\,dx$.
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Short slanted curve segment decomposed into dx and dy
      caption: The differential arc length ds is the hypotenuse of a tiny right triangle.
    check:
      id: c1
      type: multipleChoice
      prompt: Which expression approximates the length of a small segment of y=f(x)?
      choices:
      - id: a
        text: $\sqrt{1+[f'(x)]^2}\,dx$
        media: []
        issueSignals: []
      - id: b
        text: $f(x)dx$
        media: []
        issueSignals: []
      - id: c
        text: $\pi[f(x)]^2dx$
        media: []
        issueSignals: []
      - id: d
        text: $f'(x)dx$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: "Solution: $ds=\\sqrt{1+[f'(x)]^2}dx$. Why it works: Divide the Pythagorean expression $\\sqrt{dx^2+dy^2}$ by $dx$ after using $dy=f'(x)dx$. Common trap: $f'(x)dx$ is vertical change, not slanted distance. Why the other choices fail: b is not a distance formula; c is disk area; d omits the horizontal change."
