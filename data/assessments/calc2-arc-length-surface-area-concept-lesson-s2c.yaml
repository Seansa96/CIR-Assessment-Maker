  - id: a3
    title: 3. A horizontal description uses dy instead
    required: true
    content: If $x=g(y)$ is simpler, then $L=\int_c^d\sqrt{1+[g'(y)]^2}\,dy$. Change the derivative, bounds, and differential together.
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Slanted segment decomposed using dy and dx
      caption: The variable of accumulation controls derivative and bounds.
    check:
      id: c3
      type: multipleChoice
      prompt: If the curve is written x=g(y), which derivative enters the dy arc-length formula?
      choices:
      - id: a
        text: $g'(y)$
        media: []
        issueSignals: []
      - id: b
        text: $f'(x)$
        media: []
        issueSignals: []
      - id: c
        text: $g(y)^2$
        media: []
        issueSignals: []
      - id: d
        text: none
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: "Solution: Use $g'(y)$. Why it works: The small horizontal change is $dx=g'(y)dy$. Common trap: Do not switch only the differential while keeping an x-derivative. Why the other choices fail: b belongs to a different representation; c omits differentiation; d ignores the slant."
