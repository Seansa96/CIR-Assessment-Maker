  - id: a4
    title: 4. Surface area is circumference times slanted length
    required: true
    content: Rotating a differential curve segment around the x-axis sweeps a thin band with area $dS=2\pi(\text{radius})ds$. For y=f(x), the radius is $|f(x)|$.
    media:
    - type: image
      src: /media/calculus/disk-washer-model.svg
      alt: Slanted curve segment swept into a narrow surface band about an axis
      caption: A surface band has circumference times slanted width ds.
    check:
      id: c4
      type: multipleChoice
      prompt: What geometric factor is added when a curve segment is revolved?
      choices:
      - id: a
        text: circumference $2\pi r$
        media: []
        issueSignals: []
      - id: b
        text: disk area $\pi r^2$
        media: []
        issueSignals: []
      - id: c
        text: an extra dx only
        media: []
        issueSignals: []
      - id: d
        text: a constant slope only
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Multiply ds by $2\pi r$. Why it works: The segment sweeps a narrow band around a circular path. Common trap: $\pi r^2$ is a cross-sectional disk area, not lateral surface. Why the other choices fail: b models volume; c lacks radius; d does not measure a swept band.'
