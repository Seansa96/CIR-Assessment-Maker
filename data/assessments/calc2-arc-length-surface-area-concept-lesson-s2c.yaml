  - id: a2
    title: 2. Accumulate the differential arc length
    required: true
    content: "For $y=f(x)$ on $[a,b]$, add the small lengths: $L=\\int_a^b\\sqrt{1+[f'(x)]^2}\\,dx$. The bounds are x-values because the differential is dx."
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Curve divided into short slanted segments over an x interval
      caption: Add ds from the first to the last x-location.
    check:
      id: c2
      type: multipleChoice
      prompt: What belongs inside an arc-length integrand for y=f(x)?
      choices:
      - id: a
        text: $\sqrt{1+[f'(x)]^2}$
        media: []
        issueSignals: []
      - id: b
        text: $f(x)^2$
        media: []
        issueSignals: []
      - id: c
        text: $1+f'(x)$
        media: []
        issueSignals: []
      - id: d
        text: $\sqrt{f(x)}$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: "Solution: Use $\\sqrt{1+[f'(x)]^2}$. Why it works: It comes from a tiny right triangle with legs dx and $f'(x)dx$. Common trap: The derivative is squared before adding 1. Why the other choices fail: b and d use function values; c fails the Pythagorean step."
