  - id: a5
    title: 5. Measure the surface radius from the axis
    required: true
    content: About the x-axis, radius is $|y|$; about $y=k$, radius is $|f(x)-k|$. The curve can cross an axis, so a distance may require absolute value or a partition.
    media:
    - type: image
      src: /media/calculus/disk-washer-model.svg
      alt: Radius from a curve to an offset horizontal axis
      caption: Surface radius is an axis distance, not automatically a function value.
    check:
      id: c5
      type: freeResponse
      prompt: For rotation of y=f(x) about y=3, write the radius.
