items:
- id: drill-bfs-trace
  prompt: 'Consider a simple graph with vertices `A, B, C, D`.

    `A` is connected to `B` and `C`.

    `B` is connected to `D`.

    `C` is not connected to `D`.


    If you start a **Breadth-First Search (BFS)** at `A`, and you explore neighbors in alphabetical order,
    what is the sequence of visited nodes?

    '
  answer: { expected: 'A, B, C, D' }
- id: drill-dfs-trace
  prompt: 'Consider the exact same graph (`A` connected to `B, C`; `B` connected to `D`).


    If you start a **Depth-First Search (DFS)** at `A`, and you explore neighbors in alphabetical order,
    what is the sequence of visited nodes?

    '
  answer: { expected: 'A, B, D, C' }


