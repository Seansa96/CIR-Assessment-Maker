  instructions: |
    In this drill, you will import an external font directly in your CSS.
    
    **Your Task:**
    1. At the very top of your CSS, use `@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');` to load the Roboto font.
    2. In the `body` selector, apply this font using the `font-family` property. Use `'Roboto'` as the primary font, and `sans-serif` as the fallback.
    3. Improve readability by setting the `body`'s `line-height` to `1.6`.
