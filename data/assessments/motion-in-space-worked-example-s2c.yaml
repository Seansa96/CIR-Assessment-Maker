    title: Find velocity
    instruction: 'What is $\mathbf v(t)$?'
    type: multipleChoice
    prompt: 'What is $\mathbf v(t)$?'
    choices:
    - id: a
      text: '$\langle2t,3,0\rangle$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle2t,3,0\rangle$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
