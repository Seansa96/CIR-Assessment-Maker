- id: example-001
  title: Build the representation
  problem: 'A particle has $\mathbf r(t)=\langle t^2,3t,1\rangle$. Find velocity and acceleration at $t=2$.'
  steps:
  - id: s001
    title: Find velocity
    instruction: 'What is $\mathbf v(t)$?'
    type: multipleChoice
    prompt: 'What is $\mathbf v(t)$?'
    choices:
    - id: a
      text: '$\langle2t,3,0\rangle$'
    - id: b
      text: '$\langle2,0,0\rangle$ (answers ''What is $\mathbf a(t)$?'', not ''What is $\mathbf v(t)$?'')'
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: '$\langle4,3,0\rangle$ (answers ''What is $\mathbf v(2)$?'', not ''What is $\mathbf v(t)$?'')'
      issueSignals:
      - id: sign-error
    - id: d
      text: '$13$ (answers ''What is the speed when $\mathbf v(t)=\langle3,4,12\rangle$?'', not ''What is $\mathbf v(t)$?'')'
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle2t,3,0\rangle$

