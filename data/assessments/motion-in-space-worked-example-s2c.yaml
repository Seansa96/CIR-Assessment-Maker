workedExamples:
- id: example-001
  title: Build a projectile model from acceleration
  problem: A projectile starts at the origin with initial velocity $\mathbf v(0)=\langle12,16\rangle$ meters per second. Take $g=10$ m/s$^2$ and positive $y$ upward. Find its position vector and height at $t=2$.
  steps:
  - id: s001
    title: Choose the acceleration
    instruction: Identify the constant acceleration vector.
    hint: Gravity has no horizontal component and points opposite the positive $y$-axis.
    type: symbolicResponse
    prompt: Enter $\mathbf a(t)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle0,-10\rangle
      equivalenceMode: expression
      variables: []
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf a(t)=\langle0,-10\rangle$.


      Why it works: Gravity is downward with magnitude $10$ m/s$^2$ in the stated coordinate system.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: gravity-sign-error
      domains: []
  - id: s002
    title: Integrate to velocity
    instruction: Integrate acceleration before using the initial velocity.
    hint: Integrate each component of $\langle0,-10\rangle$.
    type: symbolicResponse
    prompt: Enter the general velocity vector $\mathbf v(t)$, including a constant vector $\mathbf C$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle0,-10t\rangle+\mathbf C
      equivalenceMode: expression
      variables:
      - t
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf v(t)=\langle0,-10t\rangle+\mathbf C$.


      Why it works: Velocity is an antiderivative of acceleration, so integration introduces a constant vector.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: initial-condition-omitted
      domains: []
  - id: s003
    title: Apply initial velocity
    instruction: Use $\mathbf v(0)=\langle12,16\rangle$.
    hint: At $t=0$, the integrated term is zero.
    type: symbolicResponse
    prompt: Enter $\mathbf v(t)$ after determining $\mathbf C$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle12,16-10t\rangle
      equivalenceMode: expression
      variables:
      - t
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf C=\langle12,16\rangle$, so $\mathbf v(t)=\langle12,16-10t\rangle$.


      Why it works: The initial velocity selects the one velocity function consistent with the physical launch.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: initial-condition-omitted
      domains: []
  - id: s004
    title: Integrate to position
    instruction: Integrate the determined velocity.
    hint: Integrate $12$ and $16-10t$ componentwise.
    type: symbolicResponse
    prompt: Enter the general position vector $\mathbf r(t)$, including a constant vector $\mathbf D$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle12t,16t-5t^2\rangle+\mathbf D
      equivalenceMode: expression
      variables:
      - t
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf r(t)=\langle12t,16t-5t^2\rangle+\mathbf D$.


      Why it works: Position is an antiderivative of velocity, so another constant vector appears.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: parametric-integral-error
      domains: []
  - id: s005
    title: Apply initial position
    instruction: Use $\mathbf r(0)=\langle0,0\rangle$.
    hint: Evaluate the expression from the prior step at zero.
    type: symbolicResponse
    prompt: Enter the final position vector $\mathbf r(t)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle12t,16t-5t^2\rangle
      equivalenceMode: expression
      variables:
      - t
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf D=\langle0,0\rangle$, so $\mathbf r(t)=\langle12t,16t-5t^2\rangle$.


      Why it works: The launch point fixes the position integration constant.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: initial-condition-omitted
      domains: []
  - id: s006
    title: Evaluate and interpret height
    instruction: Evaluate the vertical coordinate at $t=2$.
    hint: Use $y(t)=16t-5t^2$.
    type: numericResponse
    prompt: What is the height $y(2)$, in meters?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 12
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $y(2)=16(2)-5(2)^2=12$ meters.


      Why it works: The second component of the position vector is vertical position in the stated coordinate system.
