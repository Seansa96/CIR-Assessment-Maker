id: chem-describing-gases-recall
title: Describing Gases Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
  - chem-describing-gases
skills:
  - chem-describing-gases
modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: 'What are the five postulates of the Kinetic-Molecular Theory?'
    answer:
      expected: |
      1. Constant, random, straight-line motion
      2. Negligible particle volume
      3. Negligible intermolecular forces
      4. Perfectly elastic collisions
      5. Average kinetic energy $\propto$ Absolute Temperature (Kelvin)
  - id: item-002
    type: flashcard
    prompt: According to the KMT, what causes gas pressure?
    answer:
      expected: |
      The physical **collisions** of gas particles against the walls of their container.
  - id: item-003
    type: flashcard
    prompt: 'Pressure unit conversions: 1 atm = ? torr = ? mm Hg = ? kPa'
    answer:
      expected: |
      1 atm = **760** torr
      1 atm = **760** mm Hg
      1 atm = **101.325** kPa
  - id: item-004
    type: flashcard
    prompt: What happens to a Maxwell-Boltzmann speed distribution curve when temperature increases?
    answer:
      expected: |
      The peak shifts to the **right** (higher average speed) and becomes **broader/flatter** (wider distribution of speeds).
  - id: item-005
    type: flashcard
    prompt: 'What two properties define an "ideal" gas in the KMT?'
    answer:
      expected: |
      1. The particles themselves have **zero volume** (take up no space).
      2. The particles exert **zero intermolecular forces** on each other (no attraction/repulsion).
  - id: item-006
    type: flashcard
    prompt: 'Under what two conditions do real gases deviate most from ideal behavior?'
    answer:
      expected: |
      1. **High Pressure:** Particles are squeezed together, making their volume significant.
      2. **Low Temperature:** Particles move slowly enough for intermolecular attractions to pull them together.
  - id: item-007
    type: flashcard
    prompt: 'What is a perfectly elastic collision?'
    answer:
      expected: |
      A collision in which there is **no net loss of total kinetic energy**. Energy may transfer between colliding particles, but the total remains constant.
  - id: item-008
    type: flashcard
    prompt: 'Two different gases, He and Ne, are in separate containers at 298 K. How do their average kinetic energies compare?'
    answer:
      expected: |
      They are **exactly the same**. Average kinetic energy is solely determined by temperature, regardless of the gas identity or mass.

