- id: arc-length-perfect-square
  title: Arc Length with a Perfect Square Pattern
  problem: |
    Find the arc length of the curve $y = \frac{x^3}{6} + \frac{1}{2x}$ on the interval $[1, 2]$. Identify the algebraic pattern that simplifies the integrand.
  steps:
  - id: find-derivative
    title: Step 1 — Find the derivative
    instruction: Compute $y'$ before substituting it into the arc length formula.
    type: symbolicResponse
    prompt: What is $y'$?
    explanation: |
      **Solution:**
      $\frac{x^2}{2} - \frac{1}{2x^2}$

      **Why it works:**
      The function is $y = \frac{1}{6}x^3 + \frac{1}{2}x^{-1}$.
      Differentiating using the power rule gives $y' = \frac{3}{6}x^2 - \frac{1}{2}x^{-2} = \frac{x^2}{2} - \frac{1}{2x^2}$.
    answer:
      expectedLatex: '\frac{x^2}{2} - \frac{1}{2x^2}'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x]
  - id: apply-pattern
    title: Step 2 — Expand and simplify 1 + (y')^2
    instruction: Calculate the expression inside the square root and recognize the perfect square pattern.
    type: multipleChoice
    prompt: What does $1 + (y')^2$ simplify to?
    explanation: |
      **Solution:**
      $(\frac{x^2}{2} + \frac{1}{2x^2})^2$

      **Why it works:**
      First, square the derivative: $(y')^2 = (\frac{x^2}{2} - \frac{1}{2x^2})^2 = \frac{x^4}{4} - 2(\frac{x^2}{2})(\frac{1}{2x^2}) + \frac{1}{4x^4} = \frac{x^4}{4} - \frac{1}{2} + \frac{1}{4x^4}$.
      Now add 1: $1 + (y')^2 = 1 + \frac{x^4}{4} - \frac{1}{2} + \frac{1}{4x^4} = \frac{x^4}{4} + \frac{1}{2} + \frac{1}{4x^4}$.
      Notice that the sign of the middle term flipped from negative to positive. This means it factors back perfectly into $(\frac{x^2}{2} + \frac{1}{2x^2})^2$.
      This is a highly common pattern in arc length problems!

      **Why the other choices fail:**
      - **$(\frac{x^2}{2} - \frac{1}{2x^2})^2$** fails because adding $1$ changes the middle term to positive, changing the minus to a plus.
      - **$1 + \frac{x^4}{4} - \frac{1}{4x^4}$** fails because the cross-term in the expansion is not zero, and squaring a binomial requires FOIL.
    choices:
    - id: a
      text: '$(\frac{x^2}{2} + \frac{1}{2x^2})^2$'
    - id: b
      text: '$(\frac{x^2}{2} - \frac{1}{2x^2})^2$'
      issueSignals:
        - id: algebraic-simplification-error
    - id: c
      text: '$1 + \frac{x^4}{4} - \frac{1}{4x^4}$'
      issueSignals:
        - id: expression-equation-recognition-error
    answer:
      choiceId: a
  - id: simplify-root
    title: Step 3 — Simplify the square root
    instruction: Take the square root to find $ds$.
    type: symbolicResponse
    prompt: What is the simplified integrand $\sqrt{1 + (y')^2}$?
    explanation: |
      **Solution:**
      $\frac{x^2}{2} + \frac{1}{2x^2}$

      **Why it works:**
      Since $1 + (y')^2 = (\frac{x^2}{2} + \frac{1}{2x^2})^2$, the square root simply cancels the square:
      $\sqrt{1 + (y')^2} = \sqrt{(\frac{x^2}{2} + \frac{1}{2x^2})^2} = \frac{x^2}{2} + \frac{1}{2x^2}$.
      The expression inside the absolute value is always positive for $x \in [1, 2]$, so no absolute value signs are needed.
    answer:
      expectedLatex: '\frac{x^2}{2} + \frac{1}{2x^2}'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x]
  - id: evaluate-arc-length
    title: Step 4 — Evaluate the integral
    instruction: Integrate the simplified expression from $x=1$ to $x=2$.
    type: symbolicResponse
    prompt: Enter the exact arc length.
    explanation: |
      **Solution:**
      $\frac{17}{12}$

      **Why it works:**
      The arc length is $\int_1^2 (\frac{x^2}{2} + \frac{1}{2}x^{-2}) \, dx$.
      The antiderivative is $[\frac{x^3}{6} - \frac{1}{2x}]_1^2$.
      Evaluate at $2$: $\frac{8}{6} - \frac{1}{4} = \frac{4}{3} - \frac{1}{4} = \frac{16-3}{12} = \frac{13}{12}$.
      Evaluate at $1$: $\frac{1}{6} - \frac{1}{2} = \frac{1-3}{6} = -\frac{2}{6} = -\frac{1}{3}$.
      Subtracting gives: $\frac{13}{12} - (-\frac{1}{3}) = \frac{13}{12} + \frac{4}{12} = \frac{17}{12}$.
    answer:
      expectedLatex: '\frac{17}{12}'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: []

- id: surface-area-sphere
  title: Surface Area of a Sphere via Rotation
  problem: |
    Find the surface area generated by rotating the curve $y = \sqrt{R^2 - x^2}$ from $x = -R$ to $x = R$ about the x-axis. Identify the cancellation pattern.
  steps:
  - id: find-ds
    title: Step 1 — Find the arc length differential ds
    instruction: Compute the derivative $y'$ and simplify $1 + (y')^2$.
    type: multipleChoice
    prompt: What does $1 + (y')^2$ simplify to?
    explanation: |
      **Solution:**
      $\frac{R^2}{R^2 - x^2}$

      **Why it works:**
      $y = (R^2 - x^2)^{1/2}$. By the chain rule, $y' = \frac{1}{2}(R^2 - x^2)^{-1/2}(-2x) = \frac{-x}{\sqrt{R^2 - x^2}}$.
      Squaring this gives $(y')^2 = \frac{x^2}{R^2 - x^2}$.
      Add 1: $1 + (y')^2 = \frac{R^2 - x^2}{R^2 - x^2} + \frac{x^2}{R^2 - x^2} = \frac{R^2 - x^2 + x^2}{R^2 - x^2} = \frac{R^2}{R^2 - x^2}$.

      **Why the other choices fail:**
      - **$\frac{R^2 - 2x^2}{R^2 - x^2}$** fails because it incorrectly subtracted $x^2$ instead of adding it when finding a common denominator.
      - **$1 - \frac{x^2}{R^2 - x^2}$** fails because $(y')^2$ is strictly positive, so we must add it to 1.
    choices:
    - id: a
      text: '$\frac{R^2}{R^2 - x^2}$'
    - id: b
      text: '$\frac{R^2 - 2x^2}{R^2 - x^2}$'
      issueSignals:
        - id: algebraic-simplification-error
    - id: c
      text: '$1 - \frac{x^2}{R^2 - x^2}$'
      issueSignals:
        - id: expression-equation-recognition-error
    answer:
      choiceId: a
  - id: setup-surface-integral
    title: Step 2 — Set up the surface area integral
    instruction: Use the formula $SA = \int 2\pi y \, ds$ and substitute $y$ and $ds$.
    type: multipleChoice
    prompt: What happens when you substitute $y$ and $ds$ into the integrand $2\pi y \sqrt{1 + (y')^2}$?
    explanation: |
      **Solution:**
      The variable terms completely cancel, leaving a constant integrand.

      **Why it works:**
      $SA = \int 2\pi y \sqrt{1 + (y')^2} \, dx$.
      Substitute $y = \sqrt{R^2 - x^2}$ and $\sqrt{1 + (y')^2} = \sqrt{\frac{R^2}{R^2 - x^2}} = \frac{R}{\sqrt{R^2 - x^2}}$.
      The integrand becomes $2\pi \sqrt{R^2 - x^2} \frac{R}{\sqrt{R^2 - x^2}}$.
      The square root terms cancel perfectly, leaving just $2\pi R$.

      **Why the other choices fail:**
      - **It results in a rational function requiring trigonometric substitution** fails because the roots cancel out before integration is needed.
      - **It requires Integration by Parts** fails because no products of functions remain after the cancellation.
    choices:
    - id: a
      text: 'The variable terms completely cancel, leaving a constant integrand.'
    - id: b
      text: 'It results in a rational function requiring trigonometric substitution.'
      issueSignals:
        - id: mathematical-translation-error
    - id: c
      text: 'It requires Integration by Parts.'
      issueSignals:
        - id: boundary-condition-failure
    answer:
      choiceId: a
  - id: evaluate-constant
    title: Step 3 — Integrate the constant
    instruction: Compute the integral of the constant over the interval $[-R, R]$.
    type: symbolicResponse
    prompt: Enter the exact surface area.
    explanation: |
      **Solution:**
      $4\pi R^2$

      **Why it works:**
      The integral simplifies to $\int_{-R}^R 2\pi R \, dx$.
      Since $2\pi R$ is a constant with respect to $x$, the integral is $2\pi R [x]_{-R}^R$.
      Evaluate: $2\pi R (R - (-R)) = 2\pi R (2R) = 4\pi R^2$.
      This is the classic geometric formula for the surface area of a sphere!
    answer:
      expectedLatex: '4\pi R^2'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [R, \pi]
  - id: surface-interpret
    title: Step 4 — Interpretation
    instruction: Consider the implications of the constant integrand.
    type: multipleChoice
    prompt: Because the integrand is a constant $2\pi R$, what does this imply about the surface area of horizontal "slices" of the sphere of equal width?
    explanation: |
      **Solution:**
      Slices of equal width have equal surface areas, regardless of their position on the sphere.

      **Why it works:**
      Since the integrand $2\pi R$ doesn't depend on $x$, the area of a slice of width $\Delta x$ is always $2\pi R \Delta x$. A slice near the equator ($x=0$) has the same surface area as a slice near the pole ($x=R$), provided their thicknesses $\Delta x$ are identical! This remarkable fact was discovered by Archimedes.

      **Why the other choices fail:**
      - **The surface area is concentrated near the equator** fails because if it were, the integrand would be larger near $x=0$.
      - **The surface area increases exponentially** fails because the integrand is constant, meaning it increases linearly with respect to width.
    choices:
    - id: a
      text: 'Slices of equal width have equal surface areas, regardless of their position on the sphere.'
    - id: b
      text: 'The surface area is concentrated near the equator.'
      issueSignals:
        - id: mathematical-translation-error
    - id: c
      text: 'The surface area increases exponentially with respect to width.'
      issueSignals:
        - id: boundary-condition-failure
    answer:
      choiceId: a

- id: arc-length-parametric
  title: Arc Length of a Parametric Spiral
  problem: |
    Find the arc length of the parametric curve $x = e^t \cos t$, $y = e^t \sin t$ on the interval $[0, \pi]$. Observe how the exponential function factors out.
  steps:
  - id: compute-parametric-derivatives
    title: Step 1 — Compute derivatives using the product rule
    instruction: Find $\frac{dx}{dt}$ and $\frac{dy}{dt}$.
    type: multipleChoice
    prompt: What are the correct derivatives?
    explanation: |
      **Solution:**
      $dx/dt = e^t(\cos t - \sin t)$ and $dy/dt = e^t(\sin t + \cos t)$

      **Why it works:**
      Use the product rule $(fg)' = f'g + fg'$:
      $\frac{dx}{dt} = \frac{d}{dt}(e^t \cos t) = e^t \cos t + e^t (-\sin t) = e^t(\cos t - \sin t)$.
      $\frac{dy}{dt} = \frac{d}{dt}(e^t \sin t) = e^t \sin t + e^t (\cos t) = e^t(\sin t + \cos t)$.

      **Why the other choices fail:**
      - **$dx/dt = -e^t \sin t$ and $dy/dt = e^t \cos t$** fails because it completely ignores the product rule.
      - **$dx/dt = e^t(\cos t + \sin t)$ and $dy/dt = e^t(\sin t - \cos t)$** fails because of incorrect signs on the trigonometric derivatives.
    choices:
    - id: a
      text: '$dx/dt = e^t(\cos t - \sin t)$ and $dy/dt = e^t(\sin t + \cos t)$'
    - id: b
      text: '$dx/dt = -e^t \sin t$ and $dy/dt = e^t \cos t$'
      issueSignals:
        - id: chain-rule-missed
    - id: c
      text: '$dx/dt = e^t(\cos t + \sin t)$ and $dy/dt = e^t(\sin t - \cos t)$'
      issueSignals:
        - id: algebraic-simplification-error
    answer:
      choiceId: a
  - id: simplify-parametric-squared
    title: Step 2 — Expand and factor $(dx/dt)^2 + (dy/dt)^2$
    instruction: Square the derivatives and add them, utilizing the Pythagorean identity $\cos^2 t + \sin^2 t = 1$.
    type: symbolicResponse
    prompt: What does $(dx/dt)^2 + (dy/dt)^2$ simplify to?
    explanation: |
      **Solution:**
      $2e^{2t}$

      **Why it works:**
      $(dx/dt)^2 = (e^t(\cos t - \sin t))^2 = e^{2t}(\cos^2 t - 2\cos t \sin t + \sin^2 t)$.
      $(dy/dt)^2 = (e^t(\sin t + \cos t))^2 = e^{2t}(\sin^2 t + 2\sin t \cos t + \cos^2 t)$.
      Adding them together:
      The middle terms ($-2\cos t \sin t$ and $+2\sin t \cos t$) cancel out.
      We get $e^{2t}(2\cos^2 t + 2\sin^2 t) = 2e^{2t}(\cos^2 t + \sin^2 t) = 2e^{2t}(1) = 2e^{2t}$.
    answer:
      expectedLatex: '2e^{2t}'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [t, e]
  - id: setup-parametric-integral
    title: Step 3 — Set up the integral
    instruction: Use the parametric arc length formula $L = \int \sqrt{(dx/dt)^2 + (dy/dt)^2} \, dt$.
    type: symbolicResponse
    prompt: Enter the simplified integrand $\sqrt{(dx/dt)^2 + (dy/dt)^2}$.
    explanation: |
      **Solution:**
      $\sqrt{2} e^t$

      **Why it works:**
      We found $(dx/dt)^2 + (dy/dt)^2 = 2e^{2t}$.
      Taking the square root: $\sqrt{2e^{2t}} = \sqrt{2} \sqrt{e^{2t}} = \sqrt{2} e^t$.
    answer:
      expectedLatex: '\sqrt{2} e^t'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [t, e]
  - id: evaluate-parametric-integral
    title: Step 4 — Evaluate the integral
    instruction: Integrate $\sqrt{2} e^t$ from $0$ to $\pi$.
    type: symbolicResponse
    prompt: Enter the exact arc length.
    explanation: |
      **Solution:**
      $\sqrt{2}(e^\pi - 1)$

      **Why it works:**
      The integral is $\int_0^\pi \sqrt{2} e^t \, dt$.
      The antiderivative is $\sqrt{2} e^t$.
      Evaluate at $\pi$: $\sqrt{2} e^\pi$.
      Evaluate at $0$: $\sqrt{2} e^0 = \sqrt{2}$.
      Subtracting gives $\sqrt{2} e^\pi - \sqrt{2} = \sqrt{2}(e^\pi - 1)$.
    answer:
      expectedLatex: '\sqrt{2}(e^\pi - 1)'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [e, \pi]
