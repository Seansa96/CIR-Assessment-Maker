schemaVersion: 1
id: calc2-taylor-maclaurin-olympiad-test
title: Taylor and Maclaurin Series Olympiad Test
assessmentType: test
categoryId: calculus-2
topicId: taylor-maclaurin
skills:
- Derive series from identities and initial-value problems
- Analyze radius, parity, cancellation order, and generalized-binomial coefficients
- Prove finite identities by coefficient extraction
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - taylor-maclaurin
