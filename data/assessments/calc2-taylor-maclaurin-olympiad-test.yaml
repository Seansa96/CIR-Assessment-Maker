modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - extract-imaginary-exponential-coefficients
  prompt: |
    What is the coefficient of $x^7$ in $e^x\sin x$?
  choices:
  - id: a
    text: $-1/630$
  - id: b
    text: $1/630$
  - id: c
    text: $-1/7!$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    The coefficient is $\operatorname{Im}(1+i)^7/7!=-8/5040=-1/630$.
- id: q002
  type: multipleChoice
  skills:
  - recognize-central-binomial-generating-series
  prompt: |
    What is the coefficient of $x^n$ in $(1-4x)^{-1/2}$?
  choices:
  - id: a
    text: |-
      $\binom{2n}{n}$
  - id: b
    text: $4^n$
  - id: c
    text: |-
      $\binom{2n}{n}/4^n$
  - id: d
    text: |-
      $(-1)^n\binom{2n}{n}$
  answer:
    choiceId: a
  explanation: |-
    The identity $(1-z)^{-1/2}=\sum\binom{2n}{n}z^n/4^n$ with $z=4x$ cancels the denominator $4^n$.
- id: q003
  type: multipleChoice
  skills:
  - use-parity-in-inverse-trigonometric-series
  prompt: |
    What is the coefficient of $x^{10}$ in the Maclaurin series for
    $\arcsin x$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: |-
      $\binom{20}{10}/(4^{10}\cdot21)$
  - id: c
    text: $1/10!$
  - id: d
    text: $-1/10$
  answer:
    choiceId: a
  explanation: Arcsine is odd, so its Maclaurin series contains no even-degree powers.
- id: q004
  type: multipleChoice
  skills:
  - evaluate-logarithmic-trigonometric-limits
  prompt: |
    Evaluate $\displaystyle\lim_{x\to0}\frac{\log(\cos x)}{x^2}$.
  choices:
  - id: a
    text: $-1/2$
  - id: b
    text: $1/2$
  - id: c
    text: $-1$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    Since $\cos x=1-x^2/2+O(x^4)$ and $\log(1+u)=u+O(u^2)$, the numerator is $-x^2/2+O(x^4)$.
- id: q005
  type: multipleChoice
  skills:
  - solve-nonlinear-odes-by-series
  prompt: |
    If $y'=y^2$ and $y(0)=1$, what is the coefficient of $x^8$ in
    the Maclaurin series of y?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $1/8!$
  - id: c
    text: $8$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    The local solution is $y=1/(1-x)=\sum_{n\ge0}x^n$.
- id: q006
  type: multipleChoice
  skills:
  - derive-series-from-differential-equations
  prompt: |
    An analytic function satisfies $f'=2f$ and $f(0)=3$. What is its
    Maclaurin coefficient $a_n$?
  choices:
  - id: a
    text: |-
      $3\cdot2^n/n!$
  - id: b
    text: $3^n/n!$
  - id: c
    text: $2n+3$
  - id: d
    text: $3/2^n$
  answer:
    choiceId: a
  explanation: Coefficient matching gives $(n+1)a_{n+1}=2a_n$ starting from $a_0=3$.
- id: q007
  type: multipleChoice
  skills:
  - compose-nonlinear-exponential-series
  prompt: |
    What is the coefficient of $x^3$ in $e^{\sin x}$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1/6$
  - id: c
    text: $-1/6$
  - id: d
    text: $1/3$
  answer:
    choiceId: a
  explanation: |-
    The cubic contribution from $\sin x$ is minus one-sixth, while the cubic contribution from $(\sin x)^3/6$ is plus one-sixth.
- id: q008
  type: multipleChoice
  skills:
  - identify-hyperbolic-series-parity
  prompt: |
    Which is the Maclaurin series for $\cosh x$?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}x^{2n}/(2n)!$
  - id: b
    text: |-
      $\sum x^{2n+1}/(2n+1)!$
  - id: c
    text: |-
      $\sum(-1)^nx^{2n}/(2n)!$
  - id: d
    text: |-
      $\sum x^n/n$
  answer:
    choiceId: a
  explanation: Averaging $e^x$ and $e^{-x}$ cancels odd powers and retains every even power with positive
    sign.
- id: q009
  type: multipleChoice
  skills:
  - compute-generalized-binomial-coefficients
  prompt: |
    What is the coefficient of $x^6$ in $(1+x)^{-1/2}$?
  choices:
  - id: a
    text: $231/1024$
  - id: b
    text: $-231/1024$
  - id: c
    text: $63/256$
  - id: d
    text: $1/64$
  answer:
    choiceId: a
  explanation: |-
    The coefficient is positive for even degree and equals $\binom{12}{6}/4^6=924/4096=231/1024$.
- id: q010
  type: multipleChoice
  skills:
  - find-radii-of-trigonometric-taylor-series
  prompt: |
    What is the radius of the Maclaurin series for $\tan x$?
  choices:
  - id: a
    text: |-
      $\pi/2$
  - id: b
    text: |-
      $\pi$
  - id: c
    text: $1$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: Tangent has its nearest poles where cosine vanishes, at plus and minus pi over two.
- id: q011
  type: multipleChoice
  skills:
  - solve-forced-ode-series
  prompt: |
    The solution of $y'=y+x$ with $y(0)=1$ has a Maclaurin series.
    What is its coefficient of $x^4$?
  choices:
  - id: a
    text: $1/12$
  - id: b
    text: $1/24$
  - id: c
    text: $1/6$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: Solving gives $y=2e^x-x-1$, so every coefficient of degree at least two is $2/n!$.
- id: q012
  type: multipleChoice
  skills:
  - prove-binomial-convolution-identities
  prompt: |
    For $n\ge0$, evaluate
    $\displaystyle\sum_{k=0}^{n}\frac{1}{k!(n-k)!}$.
  choices:
  - id: a
    text: $2^n/n!$
  - id: b
    text: $1/n!$
  - id: c
    text: $n+1$
  - id: d
    text: $2/n!$
  answer:
    choiceId: a
  explanation: The sum is the coefficient of $x^n$ in $e^xe^x=e^{2x}$.
- id: q013
  type: multipleChoice
  skills:
  - derive-trigonometric-series-from-odes
  prompt: |
    If $f''=-f$, $f(0)=1$, and $f'(0)=0$, which coefficient pattern
    follows?
  choices:
  - id: a
    text: $a_{2k}=(-1)^k/(2k)!$ and $a_{2k+1}=0$
  - id: b
    text: $a_n=1/n!$
  - id: c
    text: $a_{2k}=1$ and $a_{2k+1}=-1$
  - id: d
    text: $a_n=(-1)^n/n!$
  answer:
    choiceId: a
  explanation: Matching coefficients yields $a_{n+2}=-a_n/[(n+2)(n+1)]$ with initial values one and zero.
- id: q014
  type: multipleChoice
  skills:
  - find-leading-orders-of-products
  prompt: |
    What is the order of the zero at zero of
    $(e^x-1-x)(\sin x-x)$?
  choices:
  - id: a
    text: $5$
  - id: b
    text: $4$
  - id: c
    text: $3$
  - id: d
    text: $6$
  answer:
    choiceId: a
  explanation: The first factor begins at order two and the second at order three, so their product begins
    at order five.
- id: q015
  type: multipleChoice
  skills:
  - compute-composite-binomial-coefficients
  prompt: |
    What is the coefficient of $x^6$ in $\sqrt{1+x^2}$?
  choices:
  - id: a
    text: $1/16$
  - id: b
    text: $-1/16$
  - id: c
    text: $1/6$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    Use the cubic generalized-binomial coefficient $\binom{1/2}{3}=1/16$ because $(x^2)^3=x^6$.
