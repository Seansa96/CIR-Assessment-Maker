lesson:
  introduction: |
    A **differential equation** is an equation that contains an unknown function and one or more of its derivatives. 

    While algebraic equations ask you to solve for a specific *number* (e.g., $x^2 = 4$), differential equations ask you to solve for a specific *function* (e.g., $y' = y$).

    In this lesson, we will learn how to identify the order of a differential equation, verify solutions, construct direction fields, and understand how differential equations model real-world phenomena like population growth and predator-prey dynamics.
  
  sections:
    - id: order-and-solutions
      title: Order and Verification of Solutions
      required: true
      content: |
        The **order** of a differential equation is the order of the highest derivative that occurs in the equation.
        For example:
        * $y' = 1 + 7x - 4y$ is a **first-order** differential equation because the highest derivative is $y'$.
        * $y'' + 3y' + 12y = 0$ is a **second-order** differential equation because the highest derivative is $y''$.

        A function $f$ is called a **solution** of a differential equation if the equation is satisfied when $y = f(x)$ and its derivatives are substituted into the equation.

        For example, to verify if $y = e^{3x}$ is a solution to $y'' - 9y = 0$:
        1. Find $y' = 3e^{3x}$
        2. Find $y'' = 9e^{3x}$
        3. Substitute: $(9e^{3x}) - 9(e^{3x}) = 0$. Since $0 = 0$, it is a valid solution!

        An **Initial Value Problem (IVP)** is a differential equation combined with an initial condition (like $y(0) = 5$) which allows us to find the specific constant $C$ for a particular solution.
      media: []
      check:
        id: check-order
        type: multipleChoice
        prompt: |
          What is the order of the differential equation: $\frac{d^3y}{dx^3} + \left(\frac{dy}{dx}\right)^4 = \sin x$?
        choices:
          - id: c1
            text: First-order
            issueSignals:
              - id: expression-equation-recognition-error
          - id: c2
            text: Third-order
          - id: c3
            text: Fourth-order
            issueSignals:
              - id: expression-equation-recognition-error
          - id: c4
            text: Seventh-order
            issueSignals:
              - id: algebraic-simplification-error
        answer:
          choiceId: c2
          explanation: |
            **Solution:**
            Third-order.

            **Why it works:**
            The order of a differential equation is the order of the highest derivative that occurs in the equation. In this equation, the terms contain a third derivative, $\frac{d^3y}{dx^3}$, and a first derivative, $\frac{dy}{dx}$. The highest derivative is the third derivative, making it a third-order differential equation.

            **Why the other choices fail:**
            - **First-order** fails because it is the lowest derivative present, but the order is determined by the highest derivative.
            - **Fourth-order** fails because the power of 4 applies to the first derivative. The exponent on a derivative does not define the order of the equation.
            - **Seventh-order** fails because it erroneously adds the highest derivative (3) and the highest exponent (4) together.

    - id: direction-fields
      title: Direction Slope Fields
      required: true
      content: |
        For a first-order differential equation of the form $y' = F(x,y)$, we cannot always find an explicit formula for the solution $y(x)$. However, we can analyze its behavior graphically.
        
        At any point $(x,y)$, the equation tells us the slope $y'$ of the solution curve passing through that point. By drawing short line segments with slope $F(x,y)$ at a dense grid of points, we create a **direction field** (or slope field). 
        
        The solution curves must flow parallel to these line segments. This allows us to sketch solutions to Initial Value Problems by simply "following the current" starting from the initial point.
      media: 
        - type: image
          src: /data/media/slope_field_xy.png
          alt: Direction Field for dy/dx = xy
          caption: Direction Field for dy/dx = xy. Notice how the slopes depend on both x and y.
      check:
        id: check-slope-field
        type: multipleChoice
        prompt: |
          In the slope field for $y' = x/y$, what happens to the slope segments as you approach the x-axis ($y \to 0$)?
        choices:
          - id: c1
            text: The slopes become horizontal (zero slope).
            issueSignals:
              - id: boundary-condition-failure
          - id: c2
            text: The slopes become vertical (undefined slope).
          - id: c3
            text: The slopes become 1 or -1.
            issueSignals:
              - id: mathematical-translation-error
        answer:
          choiceId: c2
          explanation: |
            **Solution:**
            The slopes become vertical (undefined slope).

            **Why it works:**
            The given differential equation is $y' = x/y$. The x-axis is defined by the equation $y = 0$. As we approach the x-axis, $y \to 0$. In the expression $x/y$, as the denominator $y$ approaches $0$, the overall value of the fraction approaches infinity. Therefore, the slope $y'$ approaches infinity, which corresponds to vertical line segments.

            **Why the other choices fail:**
            - **The slopes become horizontal (zero slope)** fails because a horizontal slope corresponds to a slope of $0$, which happens when the numerator $x$ is $0$ (i.e., along the y-axis), not when the denominator is $0$.
            - **The slopes become 1 or -1** fails because this would happen along the lines $y = x$ or $y = -x$, not near the x-axis.

    - id: intro-to-modeling
      title: Introduction to Modeling
      required: true
      content: |
        When a physical situation includes a rate of change, it may be modeled with a differential equation.

        **Exponential Growth:**
        "A population grows at a rate proportional to its size."
        This translates directly to the differential equation: $\frac{dP}{dt} = kP$.
        
        **Logistic Growth:**
        Environments have a carrying capacity $M$. As the population $P$ approaches $M$, the growth rate slows down to 0.
        The Logistic Equation models this: $\frac{dP}{dt} = kP(1 - \frac{P}{M})$.
        If $P$ is small, it acts like exponential growth. If $P \approx M$, the rate approaches $0$.
      media:
        - type: image
          src: /data/media/logistic_curve.png
          alt: Logistic Growth Curve
          caption: Logistic Growth Curve showing the population stabilizing at the carrying capacity M.
        - type: image
          src: /data/media/predator_prey_time.png
          alt: Predator Prey Dynamics over Time
          caption: Lotka-Volterra Predator-Prey Dynamics. Notice how the predator population lags slightly behind the prey population.
      check:
        id: check-modeling
        type: multipleChoice
        prompt: |
          Translate the following sentence into a differential equation: 
          "The rate at which a rumor spreads is proportional to the product of the number of people who have heard it ($y$) and the number of people who have not heard it ($M - y$)."
        choices:
          - id: c1
            text: '$\frac{dy}{dt} = ky(M - y)$'
          - id: c2
            text: '$\frac{dy}{dt} = k(M - y)$'
            issueSignals:
              - id: mathematical-translation-error
          - id: c3
            text: '$\frac{dy}{dt} = \frac{ky}{M-y}$'
            issueSignals:
              - id: mathematical-translation-error
        answer:
          choiceId: c1
          explanation: |
            **Solution:**
            $\frac{dy}{dt} = ky(M - y)$

            **Why it works:**
            Let's break down the sentence:
            - "The rate at which a rumor spreads" translates to the rate of change of the number of people who have heard it over time, which is $\frac{dy}{dt}$.
            - "is proportional to" translates to multiplying by a proportionality constant, $k$.
            - "the product of the number of people who have heard it ($y$) and the number of people who have not heard it ($M - y$)" translates to the mathematical product $y(M - y)$.
            Putting it all together, we get $\frac{dy}{dt} = ky(M - y)$.

            **Why the other choices fail:**
            - **$\frac{dy}{dt} = k(M - y)$** fails because it only states the rate is proportional to the number of people who have not heard it, omitting the dependence on those who have.
            - **$\frac{dy}{dt} = \frac{ky}{M-y}$** fails because it models the rate as proportional to the quotient (ratio) of the two groups, rather than their product.

    - id: model-building-workflow
      title: An Eight-Step Modeling Workflow
      required: true
      content: |
        Build a differential-equation model deliberately:

        1. Define the dependent variable and its units.
        2. Name the independent variable and its units.
        3. Translate “rate of change” into a derivative.
        4. Identify each quantity the rate is proportional to.
        5. Introduce a positive proportionality constant with units that make the equation consistent.
        6. State initial data separately from the differential equation.
        7. Inspect constant solutions and the sign of the derivative for qualitative behavior.
        8. Check that the model’s rate has units of dependent-variable units per time.

        This workflow distinguishes the model equation from its particular solution and makes a slope field meaningful before an exact formula is known.
      media:
        - type: image
          src: /media/calculus-2/differential-equations-method-map.svg
          alt: Diagram showing how to classify a first-order differential equation after a model is constructed.
          caption: After building a model, classify its structure before choosing a solution method.
