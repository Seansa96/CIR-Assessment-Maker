workedExamples:
- id: we01
  title: Dating by radioactive decay
  problem: A sample retains 35% of its original isotope; the half-life is 5730 years.
  steps:
  - id: we01-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Convert half-life to a decay constant.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - negative k
      - units
    explanation: |-
      Solution: $k=-\ln2/5730$ yr$^{-1}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Solve the fraction equation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - fraction
      - logarithm
    explanation: |-
      Solution: $0.35=e^{kt}$ gives $t=\ln(0.35)/k\approx8678$ years.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: State the assumption.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - model assumption
      - positive time
    explanation: |-
      Solution: The age estimate assumes the initial ratio and decay rate were valid and the sample remained closed.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Production and removal
  problem: A tracer obeys $Q'=8-0.2Q$, $Q(0)=10$.
  steps:
  - id: we02-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Find the equilibrium and transient form.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - equilibrium
      - transient
    explanation: |-
      Solution: $Q_*=40$ and $Q=40+Ce^{-0.2t}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Apply the initial value.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - constant
      - solution
    explanation: |-
      Solution: $C=-30$, so $Q=40-30e^{-0.2t}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Verify behavior.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - ODE
      - initial value
      - limit
    explanation: |-
      Solution: $Q'=6e^{-0.2t}=8-0.2Q$, $Q(0)=10$, and $Q\to40$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Continuous versus annual deposits
  problem: Compare continuous deposits at $1200$ dollars/year with $100$ deposited at each month-end, using a stated
    $6\%$ continuous rate for one year.
  steps:
  - id: we03-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Write both models.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - two models
      - timing distinction
    explanation: |-
      Solution: Continuous: $A'=0.06A+1200$. Discrete: sum twelve deposits with their remaining growth times.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Compute the continuous result.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - solution
      - value
    explanation: |-
      Solution: $A_c=20000(e^{0.06}-1)\approx1236.73$ dollars.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Interpret rather than equate them.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - model distinction
      - units
    explanation: |-
      Solution: The monthly model is a geometric sum and differs because deposits do not enter continuously; either comparison must use a declared timing convention.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
