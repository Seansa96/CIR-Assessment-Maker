questions:
  - id: hard-construct-matrix
    type: multipleChoice
    prompt: |
      Let $T: \mathbb{R}^2 \to \mathbb{R}^3$ be a linear transformation such that 
      $T \left( \begin{bmatrix} 1 \\ 0 \end{bmatrix} \right) = \begin{bmatrix} 4 \\ -1 \\ 2 \end{bmatrix}$ and 
      $T \left( \begin{bmatrix} 0 \\ 1 \end{bmatrix} \right) = \begin{bmatrix} 0 \\ 5 \\ -3 \end{bmatrix}$. 
      Find $T \left( \begin{bmatrix} 3 \\ -2 \end{bmatrix} \right)$.
    choices:
      - id: c1
        text: '$\begin{bmatrix} 12 \\ -13 \\ 12 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 12 \\ 7 \\ 0 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 4 \\ 4 \\ -1 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 12 \\ -10 \\ 6 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      By linearity, $T \left( \begin{bmatrix} 3 \\ -2 \end{bmatrix} \right) = 3 T \left( \begin{bmatrix} 1 \\ 0 \end{bmatrix} \right) - 2 T \left( \begin{bmatrix} 0 \\ 1 \end{bmatrix} \right)$.
      This is $3 \begin{bmatrix} 4 \\ -1 \\ 2 \end{bmatrix} - 2 \begin{bmatrix} 0 \\ 5 \\ -3 \end{bmatrix} = \begin{bmatrix} 12 \\ -3 \\ 6 \end{bmatrix} - \begin{bmatrix} 0 \\ 10 \\ -6 \end{bmatrix} = \begin{bmatrix} 12 \\ -13 \\ 12 \end{bmatrix}$.

  - id: hard-one-to-one-parameter
    type: multipleChoice
    prompt: |
      Let $T(\vec{x}) = A\vec{x}$ where $A = \begin{bmatrix} 1 & 2 & 4 \\ 0 & 3 & h \\ 0 & 0 & h-5 \end{bmatrix}$. 
      For what values of $h$ is the transformation $T$ **one-to-one**?
    choices:
      - id: c1
        text: '$h = 5$'
      - id: c2
        text: '$h \neq 5$'
      - id: c3
        text: '$h = 0$'
      - id: c4
        text: '$h \neq 0$'
    answer:
      choiceId: c2
    explanation: |
      A transformation is one-to-one if and only if its standard matrix has a pivot in every column. 
      The matrix $A$ is already in an echelon form. The pivots are on the main diagonal: $1$, $3$, and $h-5$. 
      For there to be a pivot in the third column, the entry $h-5$ must not be zero. Thus, $h \neq 5$. If $h=5$, the third column has no pivot, making $x_3$ a free variable, which ruins one-to-one.

  - id: hard-onto-composition
    type: multipleChoice
    prompt: |
      Let $S: \mathbb{R}^3 \to \mathbb{R}^4$ and $T: \mathbb{R}^4 \to \mathbb{R}^2$ be linear transformations. 
      Consider the composition $T(S(\vec{x}))$. Which of the following statements is ALWAYS true?
    choices:
      - id: c1
        text: 'The composition is a transformation from $\mathbb{R}^3$ to $\mathbb{R}^2$.'
      - id: c2
        text: 'The composition is a transformation from $\mathbb{R}^4$ to $\mathbb{R}^4$.'
      - id: c3
        text: 'The composition must be an onto transformation.'
      - id: c4
        text: 'The composition must be a one-to-one transformation.'
    answer:
      choiceId: c1
    explanation: |
      The input to the composition starts in $\mathbb{R}^3$ (the domain of $S$). $S$ maps it into $\mathbb{R}^4$. Then $T$ takes that vector in $\mathbb{R}^4$ and maps it into $\mathbb{R}^2$. Therefore, the overall composed transformation goes from $\mathbb{R}^3$ to $\mathbb{R}^2$. We cannot guarantee it is onto or one-to-one without knowing the specific matrices.
