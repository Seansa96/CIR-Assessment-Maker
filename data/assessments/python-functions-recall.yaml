schemaVersion: 1
id: python-functions-recall
title: Python Functions Recall
assessmentType: recallDrill
categoryId: python
subcategoryIds:
- python-functions
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What keyword is used to define a function in Python?
  answer:
    expected: def
- id: r002
  type: typed
  prompt: What keyword is used to send a value back from a function to the caller?
  answer:
    expected: return
- id: r003
  type: typed
  prompt: Variables that are defined inside a function and cannot be accessed outside
    of it are said to have ________ scope.
  answer:
    expected: local
- id: r004
  type: typed
  prompt: What prefix allows a function to accept any number of positional arguments,
    packing them into a tuple? (Include the punctuation mark)
  answer:
    expected: '*args'
    aliases:
    - '*'
- id: r005
  type: typed
  prompt: What prefix allows a function to accept any number of keyword arguments,
    packing them into a dictionary? (Include the punctuation mark)
  answer:
    expected: '**kwargs'
    aliases:
    - '**'
- id: r006
  type: typed
  prompt: What keyword is used to create small, anonymous, one-line functions?
  answer:
    expected: lambda
