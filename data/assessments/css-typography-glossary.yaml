schemaVersion: 1
id: css-typography-glossary
title: Web Typography Glossary
assessmentType: glossary
categoryId: css
subcategoryIds:
  - css-typography
modeDefault: study
glossary:
  - id: font-family
    term: font-family
    definition: A prioritized list of font family names and/or generic family names for the selected element (e.g. `Arial, sans-serif`).
  - id: font-weight
    term: font-weight
    definition: Sets the thickness or boldness of the font (e.g. `normal`, `bold`, `400`, `700`).
  - id: line-height
    term: line-height
    definition: Sets the height of a line box. It's commonly used to set the distance between lines of text. Unitless numbers (e.g. `1.5`) are recommended.
  - id: px
    term: px (Pixels)
    definition: An absolute CSS length unit representing a single dot on the screen.
  - id: rem
    term: rem (Root em)
    definition: A relative CSS length unit equal to the computed font-size of the root element (usually `<html>`). If root is 16px, `2rem` is 32px.
  - id: em
    term: em
    definition: A relative CSS length unit equal to the computed font-size of the *parent* element. It cascades and compounds, which can lead to sizing issues if nested deeply.
