lesson:
  introduction: Phase lines motivate the direction analysis, but a second-order autonomous equation evolves in the
    state plane $(y,v)$.
  sections:
  - id: s1
    title: First-order phase lines as a bridge
    required: true
    content: For $y'=f(y)$, zeros of $f$ are equilibria and signs between zeros set one-dimensional arrows. A second-order
      state needs both position and velocity, so one phase line is no longer enough.
    media: []
    check:
      id: q001
      type: multipleChoice
      prompt: Why is $y$ alone insufficient to specify a second-order autonomous state?
      skills:
      - ede-ch04-first-order-applications-autonomous-phase
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-phase
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Second-order initial data include both $y$ and $y'$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Different velocities at the same position produce different motion
      - id: b
        text: The equation has no derivatives
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Every solution is constant
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Time must be complex
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Introduce velocity
    required: true
    content: Set $v=y'$. Then $y''=f(y,y')$ becomes the first-order system $y'=v$, $v'=f(y,v)$ in the phase plane.
    media:
    - type: image
      src: /media/ede/ch04-autonomous-phase-reduction.svg
      alt: A second-order autonomous equation reduced to a first-order phase-plane system and a velocity-versus-position
        equation.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q002
      type: multipleChoice
      prompt: Which system represents $y''=-y$?
      skills:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Velocity is $v=y'$ and acceleration is $v'=y''=-y$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y'=v$, $v'=-y$
      - id: b
        text: $y'=-y$, $v'=v$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y'=v'$, $v=-y$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y'=y$, $v'=-v$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Use $v$ as a function of $y$
    required: true
    content: Where a trajectory can be treated as $v(y)$, the chain rule gives $y''=dv/dt=(dv/dy)(dy/dt)=v,dv/dy$.
      This reduction may lose information at turning points unless branches are tracked.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: What replaces $y''$ when $v=y'$ is treated as a function of $y$?
      skills:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The chain rule multiplies $dv/dy$ by $dy/dt=v$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $v\,dv/dy$
      - id: b
        text: $dv/dy$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $v^2$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $dy/dv$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Phase trajectories
    required: true
    content: A solution maps time to $(y(t),v(t))$. Its tangent vector is $(v,f(y,v))$, so direction requires both
      components rather than the slope of an un-oriented level curve.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: At $(y,v)=(1,-2)$ for $y''=-y$, which way does the state initially move?
      skills:
      - ede-ch04-first-order-applications-autonomous-phase
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-phase
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $(y',v')=(v,-y)=(-2,-1)$, so both coordinates decrease.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Toward smaller $y$ and smaller $v$
      - id: b
        text: Toward larger $y$ and smaller $v$
        issueSignals:
        - id: ede-autonomous-trajectory-direction-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Toward smaller $y$ and larger $v$
        issueSignals:
        - id: ede-autonomous-trajectory-direction-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: It is stationary
        issueSignals:
        - id: ede-autonomous-trajectory-direction-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: Equilibria
    required: true
    content: A phase-plane equilibrium requires $y'=v=0$ and $v'=f(y,0)=0$. Solving only $f(y,0)=0$ can falsely
      include points with nonzero velocity.
    media: []
    check:
      id: q005
      type: multipleChoice
      prompt: Which points are equilibria of $y''=y-y^3$?
      skills:
      - ede-ch04-first-order-applications-autonomous-phase
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-phase
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Both $v=0$ and $y-y^3=0$ are required.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $(y,v)=(-1,0),(0,0),(1,0)$
      - id: b
        text: Every point with $v=0$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Every point with $y=0$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $(1,1)$ only
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Initial data select a curve and direction
    required: true
    content: An initial pair $(y_0,v_0)$ selects a phase trajectory and its orientation. A first integral may identify
      the curve, while the sign of $v_0$ identifies which way it is traversed.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: For $y''=-y$ and $y^2+v^2=4$, what does $(y_0,v_0)=(0,2)$ determine beyond the circle?
      skills:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-autonomous-second-order-energy
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The positive initial velocity fixes the orientation along the selected energy circle.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The initial direction of travel
      - id: b
        text: A different energy level
        issueSignals:
        - id: ede-autonomous-trajectory-direction-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: That the state is an equilibrium
        issueSignals:
        - id: ede-autonomous-trajectory-direction-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: That time stops
        issueSignals:
        - id: ede-autonomous-trajectory-direction-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
