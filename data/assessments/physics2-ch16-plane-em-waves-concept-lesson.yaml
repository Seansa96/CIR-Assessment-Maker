id: physics2-ch16-plane-em-waves-concept-lesson
title: Plane Electromagnetic Waves
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electromagnetic-waves
lesson:
  introduction: This lesson develops the main ideas behind Plane Electromagnetic Waves and connects them
    to the governing physical relationships.
  sections:
  - id: l2-sec1
    title: Wave Properties
    required: true
    content: In an EM wave, the electric and magnetic fields are perpendicular to each other and to the
      direction of propagation (transverse wave). Their magnitudes are related by $E = cB$, where $c$
      is the speed of light.
  - id: l2-sec2
    title: Speed of Light
    required: true
    content: Maxwell's equations predict that EM waves travel in a vacuum at $c = \frac{1}{\sqrt{\mu_0
      \epsilon_0}} \approx 3 \times 10^8\text{ m/s}$. The wave equation is derived directly from the curl
      of the E and B fields.
