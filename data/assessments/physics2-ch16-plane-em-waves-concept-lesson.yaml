lesson:
  introduction: >
    This lesson develops a repeatable way to solve Plane Electromagnetic Waves problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch16-plane-em-waves-s1
    title: Name the model and quantities
    required: true
    content: >
      Plane Electromagnetic Waves uses c = lambda f and E = cB. In the name the model and quantities stage, connect wavelength, frequency, and field amplitudes while preserving perpendicular directions.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Plane Electromagnetic Waves problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch16-plane-em-waves-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Plane Electromagnetic Waves, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use c = lambda f and E = cB after you connect wavelength, frequency, and field amplitudes while preserving perpendicular directions.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Plane Electromagnetic Waves problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-plane-em-waves-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables c = lambda f and E = cB relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-plane-em-waves-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Plane Electromagnetic Waves.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-plane-em-waves-units-error
          domains:
          - physics-2
