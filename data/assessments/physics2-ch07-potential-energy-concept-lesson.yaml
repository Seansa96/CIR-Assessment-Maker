lesson:
  introduction: >
    This lesson develops a repeatable way to solve Potential Energy & Electric Potential problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch07-potential-energy-s1
    title: Name the model and quantities
    required: true
    content: >
      Potential Energy & Electric Potential uses Delta U = q Delta V. In the name the model and quantities stage, identify the moving charge, retain its sign, and relate an energy change to work by the electric field.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Potential Energy & Electric Potential problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch07-potential-energy-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Potential Energy & Electric Potential, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use Delta U = q Delta V after you identify the moving charge, retain its sign, and relate an energy change to work by the electric field.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Potential Energy & Electric Potential problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-potential-energy-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables Delta U = q Delta V relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-potential-energy-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Potential Energy & Electric Potential.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-potential-energy-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Potential Energy & Electric Potential, first identify the moving charge, retain its sign, and relate an energy change to work by the electric field. Then apply Delta U = q Delta V with one consistent coordinate system and solve for the requested quantity.


        Why it works: Delta U = q Delta V connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
