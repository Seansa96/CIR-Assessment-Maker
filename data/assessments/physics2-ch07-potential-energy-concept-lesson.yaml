title: Potential Energy & Electric Potential
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electric-potential
workedExamples:
- id: l1-sec1
  title: Electric Potential Energy
  explanation: The electrostatic force is conservative, so we can define an electric
    potential energy $U$. The change in potential energy when a charge $q$ moves from
    point A to B is $\Delta U = -W_{AB} = -\int_A^B \vec{F} \cdot d\vec{l}$.
- id: l1-sec2
  title: Electric Potential
  explanation: 'Electric potential $V$ is the potential energy per unit charge: $V
    = U/q$. It is measured in Volts (1 V = 1 J/C). The potential difference between
    two points is $\Delta V = -\int_A^B \vec{E} \cdot d\vec{l}$.'
