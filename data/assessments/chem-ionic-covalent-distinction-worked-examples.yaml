- id: example-2
  title: Classify quartz
  problem: Decide whether solid SiO2 is ionic, molecular, or network covalent.
  steps:
  - id: we2-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Silicon and oxygen form an extended connected structure rather than discrete SiO2 molecules.
    explanation: 'Solution: Silicon and oxygen form an extended connected structure rather than discrete SiO2 molecules. Why
      it works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we2-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The atoms are connected by covalent bonds and are not organized as simple Si4+ and O2- ions.
    explanation: 'Solution: The atoms are connected by covalent bonds and are not organized as simple Si4+ and O2- ions. Why
      it works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we2-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Classify quartz as network covalent and explain why its high melting point alone does not make it ionic.
    explanation: 'Solution: Classify quartz as network covalent and explain why its high melting point alone does not make
      it ionic. Why it works: This step follows the topic''s accounting rules and supplies a separate check before the final
      conclusion.'
- id: example-3
  title: Analyze ammonium nitrate
  problem: Classify NH4NO3 even though it contains only nonmetals.
  steps:
  - id: we3-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Recognize NH4+ and NO3- as charged polyatomic units.
    explanation: 'Solution: Recognize NH4+ and NO3- as charged polyatomic units. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: we3-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Covalent bonds hold atoms together within each ion, while opposite ion charges attract between units.
    explanation: 'Solution: Covalent bonds hold atoms together within each ion, while opposite ion charges attract between
      units. Why it works: This step follows the topic''s accounting rules and supplies a separate check before the final
      conclusion.'
  - id: we3-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Classify the compound as ionic overall and reject a composition-only nonmetal shortcut.
    explanation: 'Solution: Classify the compound as ionic overall and reject a composition-only nonmetal shortcut. Why it
      works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
