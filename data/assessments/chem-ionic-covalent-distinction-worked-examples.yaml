    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - NaCl combines a metal and nonmetal and is modeled as Na+ and Cl- in a lattice.
    explanation: 'Solution: NaCl combines a metal and nonmetal and is modeled as Na+ and Cl- in a lattice. Why it works: This
      step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
