questions:
- id: q001
  type: multipleChoice
  prompt: "Look at this class structure:\n\n```csharp\npublic class Monster\n{\n \
    \   public void Roar() { Console.WriteLine(\"RAAAH!\"); }\n}\n\npublic class Troll\
    \ : Monster\n{\n    public override void Roar() { Console.WriteLine(\"Grrr!\"\
    ); }\n}\n```\n\nWhat happens when you compile this code?\n"
  choices:
  - id: a
    text: A compiler error occurs because `Roar()` in `Monster` is not marked as `virtual`.
  - id: b
    text: The code compiles, and a Troll roars "Grrr!".
  - id: c
    text: A compiler error occurs because `Troll` did not call `base.Roar()`.
  - id: d
    text: The code compiles, but a Troll roars "RAAAH!".
  answer:
    choiceId: a
  explanation: 'In C#, methods are non-virtual by default. If a child class wants
    to `override` a method, the parent class MUST explicitly permit it by adding the
    `virtual` (or `abstract`) keyword to the method signature.

    '
- id: q002
  type: multipleChoice
  prompt: 'Which of the following is the correct syntax for a class named `Paladin`
    to inherit from `Hero` and implement the `IHealer` interface?

    '
  choices:
  - id: a
    text: '`public class Paladin : Hero, IHealer`'
  - id: b
    text: '`public class Paladin extends Hero implements IHealer`'
  - id: c
    text: '`public class Paladin (Hero, IHealer)`'
  - id: d
    text: '`public class Paladin : IHealer : Hero`'
  answer:
    choiceId: a
  explanation: 'C# uses a colon `:` for both class inheritance and interface implementation.
    The base class MUST come first, followed by a comma-separated list of any interfaces.
    Option B is Java syntax.

    '
- id: q003
  type: multipleChoice
  prompt: 'You are defining a Property for the player''s level. You want external
    scripts to be able to read the level, but you want to completely prevent external
    scripts from changing the level.


    Which definition is best?

    '
  choices:
  - id: a
    text: '`public int Level { get; private set; }`'
  - id: b
    text: '`public int Level { private get; set; }`'
  - id: c
    text: '`private int Level { get; set; }`'
  - id: d
    text: '`public int Level { get; set; }`'
  answer:
    choiceId: a
  explanation: '`public get` allows anyone to read it. `private set` ensures only
    code *inside* the Player class can change the level.

    '
- id: q004
  type: multipleChoice
  prompt: "What happens if you run this code?\n\n```csharp\npublic interface IEquippable\
    \ { void Equip(); }\n\npublic class Potion { }\n\npublic class Game\n{\n    public\
    \ void Start()\n    {\n        object item = new Potion();\n        if (item is\
    \ IEquippable e)\n        {\n            e.Equip();\n        }\n    }\n}\n```\n"
  choices:
  - id: a
    text: The `if` block is skipped and nothing happens.
  - id: b
    text: A runtime error occurs because `Potion` does not implement `IEquippable`.
  - id: c
    text: '`Equip()` is called on the potion.'
  answer:
    choiceId: a
  explanation: 'The `is` keyword safely checks the type. Since `Potion` does not implement
    `IEquippable`, `item is IEquippable e` evaluates to `false`. The program skips
    the block gracefully without throwing an exception.

    '
