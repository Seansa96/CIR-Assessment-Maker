workedExamples:
  - id: diagonal-line-length
    title: Constant-Speed Line Segment
    problem: 'Find the arc length of $x=3t,y=4t$ on $0\le t\le2$.'
    steps:
      - { id: dll-1, title: 'Differentiate coordinates', instruction: 'Compute the two component rates.', type: multipleChoice, prompt: 'What is the speed?', choices: [{ id: a, text: '5' }, { id: b, text: '7' }, { id: c, text: '1' }, { id: d, text: '25' }], answer: { choiceId: a }, explanation: 'Solution: Speed is $\sqrt{3^2+4^2}=5$. Why it works: It is the magnitude of the velocity vector. Common trap: Adding the components. Why the other choices fail: They add, omit, or square the rates.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
      - { id: dll-2, title: 'Integrate speed', instruction: 'The speed is constant over the interval.', type: numericResponse, prompt: 'What is the arc length?', answer: { value: 10, tolerance: 0.000001 }, explanation: 'Solution: $L=\int_0^25dt=10$. Why it works: Constant speed times parameter duration gives length. Common trap: Reporting speed 5 as total length.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - id: identity-length
    title: Unit-Circle Quarter Arc
    problem: 'Find the length of $x=\cos t,y=\sin t$ on $0\le t\le\pi/2$.'
    steps:
      - { id: il-1, title: 'Build speed from derivatives', instruction: 'Differentiate both trigonometric coordinates.', type: multipleChoice, prompt: 'Which identity simplifies the speed?', choices: [{ id: a, text: '$\sin^2t+\cos^2t=1$' }, { id: b, text: '$\sin t+\cos t=1$' }, { id: c, text: '$\tan t=1$' }, { id: d, text: '$\sin t=\cos t$' }], answer: { choiceId: a }, explanation: 'Solution: Speed is $\sqrt{\sin^2t+\cos^2t}=1$. Why it works: The Pythagorean identity combines derivative squares. Common trap: Adding sine and cosine. Why the other choices fail: They are not general identities.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
      - { id: il-2, title: 'Use one-arc bounds', instruction: 'The interval is one quarter of a unit circle.', type: symbolicResponse, prompt: 'Find the exact length.', answer: { expectedLatex: 'pi/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $L=\int_0^{\pi/2}1dt=\pi/2$. Why it works: The selected parameter interval traces exactly one quarter arc. Common trap: Using a full $2\pi$ interval.' , issueSignals: [{ id: parametric-arc-length-error }, { id: parametric-derivative-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
