- id: im-we001
  title: Derive the impulse-momentum theorem
  problem: Starting from $\sum\vec F=d\vec p/dt$, derive the relationship between net impulse and momentum change.
  steps:
  - id: im1-s1
    title: Multiply by time differential
    instruction: Put the relation in integrable differential form.
    hint: 
    type: freeResponse
    prompt: What relation results after multiplying by $dt$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - $\sum\vec F\,dt=d\vec p$
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $\sum\vec F\,dt=d\vec p$.\n\nWhy it works: Multiplication by $dt$ expresses the infinitesimal momentum change caused during an infinitesimal time.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: im1-s2
    title: Integrate both sides
    instruction: Integrate from initial to final time and momentum.
    hint: 
    type: freeResponse
    prompt: What does the integrated equation become?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - $\int\sum\vec F\,dt=\vec p_f-\vec p_i=\Delta\vec p$
      - $\vec J=\Delta\vec p$
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $\int\sum\vec F\,dt=\vec p_f-\vec p_i=\Delta\vec p$, so $\vec J=\Delta\vec p$.\n\nWhy it works: The time integral of net force is impulse and the momentum integral evaluates to final minus initial momentum.'
