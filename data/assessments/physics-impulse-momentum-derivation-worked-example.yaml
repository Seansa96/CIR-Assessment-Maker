      equivalenceMode: 
      variables: []
      value: -5.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $F=(-2.0)/0.40=-5.0$ N.\n\nWhy it works: The force must point left to produce the negative impulse.'
