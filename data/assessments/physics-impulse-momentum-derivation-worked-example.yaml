- id: im-we002
  title: Use force-time area to stop a cart
  problem: A 0.50 kg cart initially moves right at 4.0 m/s. A constant leftward force acts for 0.40 s and stops it. Find the force.
  steps:
  - id: im2-s1
    title: Find the signed momentum change
    instruction: Choose right as positive.
    hint: 
    type: numericResponse
    prompt: What is $\Delta p=p_f-p_i$ in kg m/s?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: -2.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: "Solution: $\\Delta p=(0.50)(0)-(0.50)(4.0)=-2.0$ kg m/s.\\n\\nWhy it works: Stopping removes the cart's initial positive momentum."
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: im2-s2
    title: Divide impulse by time
    instruction: For constant force, $F\Delta t=\Delta p$.
    hint: 
    type: numericResponse
    prompt: What is the force in N?
    choices: []
    answer:
