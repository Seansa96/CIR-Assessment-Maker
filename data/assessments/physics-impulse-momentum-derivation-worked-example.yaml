workedExamples:
- id: ex-impulse-momentum
  title: Newton's Second Law to Impulse
  problem: |
    We want to prove the impulse-momentum theorem ($\vec J = \Delta \vec p$) starting from Newton's second law. Let's walk through the calculus derivation step-by-step.
  steps:
  - id: step-1
    title: Step 1 — State Newton's Second Law
    instruction: |
      Start with the most fundamental calculus form of Newton's second law for a single particle.
    type: multipleChoice
    prompt: Which of the following is the correct definition of net force?
    choices:
    - id: a
      text: $\vec F_{\text{net}} = m \Delta \vec v / \Delta t$
    - id: b
      text: $\vec F_{\text{net}} = d\vec p / dt$
    - id: c
      text: $\vec F_{\text{net}} = \int \vec p \, dt$
    answer:
      choiceId: b
    explanation: The net force is the instantaneous rate of change of momentum.
  - id: step-2
    title: Step 2 — Separate Variables
    instruction: |
      We want to find the total change over an interval, so we need to separate the differentials. Multiply both sides of $\vec F_{\text{net}} = d\vec p / dt$ by $dt$.
    type: symbolicResponse
    prompt: What is the resulting expression on the left side of the equation? (Write the expression that equals $d\vec p$)
    answer:
      gradingMode: auto
      expectedLatex: \vec{F}_{\text{net}} * dt
      equivalenceMode: expression
      tolerance: 0
    explanation: Multiplying by $dt$ gives $\vec F_{\text{net}} \, dt = d\vec p$. This tells us that a tiny amount of force over a tiny time causes a tiny change in momentum.
  - id: step-3
    title: Step 3 — Integrate
    instruction: |
      Now, integrate both sides. The left side is integrated over time from $t_i$ to $t_f$. The right side is integrated over momentum from $\vec p_i$ to $\vec p_f$.
      The left side integral $\int \vec F_{\text{net}} \, dt$ is defined as the Impulse $\vec J$.
    type: symbolicResponse
    prompt: Evaluate the right side integral $\int d\vec p$ from $\vec p_i$ to $\vec p_f$. What does it equal?
    answer:
      gradingMode: auto
      expectedLatex: \vec{p}_f - \vec{p}_i
      equivalenceMode: expression
      tolerance: 0
    explanation: The integral of $d\vec p$ is simply $\vec p$. Evaluating from initial to final gives $\vec p_f - \vec p_i$, which is exactly $\Delta \vec p$. Thus, $\vec J = \Delta \vec p$.
