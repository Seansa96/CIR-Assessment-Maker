directedProject:
  summary: "Open your local PowerShell terminal and practice executing string methods and regex replacements in real time."
  estimatedTimeMinutes: 15
  resources: []
  phases:
    - id: phase-1-methods
      title: "Practicing Methods"
      steps:
        - id: step-1-chaining
          title: "Chain .NET Methods"
          instruction: |
            1. Open PowerShell.
            2. Define a string variable: `$Text = "   the quick brown fox   "`
            3. Trim it, replace 'fox' with 'DOG', and convert it to uppercase by chaining the methods:
               `$Text.Trim().Replace('fox', 'DOG').ToUpper()`
            4. Verify the output is exactly `"THE QUICK BROWN DOG"`.
          checklist:
            - id: chk-chain
              text: "Successfully chained Trim, Replace, and ToUpper methods"
          resources: []
    - id: phase-2-regex
      title: "Practicing Regex"
      steps:
        - id: step-2-replace
          title: "Regex Replacement"
          instruction: |
            1. Define a dirty string containing numbers and letters: `$Data = "Item123Code456"`
            2. Strip all the digits out using `-replace` and the `\d` regex character class:
               `$Data -replace '\d', ''`
            3. Verify the output is `"ItemCode"`.
          checklist:
            - id: chk-regex
              text: "Used -replace with a regex character class"
          resources: []
