schemaVersion: 1
id: pwsh-basics-recall
title: "PowerShell Basics Recall Drill"
assessmentType: recallDrill
categoryId: scripting
subcategoryIds:
  - pwsh-cmdlets
  - pwsh-navigation
  - pwsh-help-flags
skills:
- Apply scripting concepts
- Apply Cmdlet Structure and Syntax
- Apply General Directory Navigation
- Apply Help System and Flags
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - scripting
  - pwsh-cmdlets
  - pwsh-navigation
  - pwsh-help-flags
modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: 'What is the standard naming convention for all PowerShell cmdlets?'
    answer:
      expected: |
        **Verb-Noun** (e.g., `Get-Process`)
  - id: item-002
    type: flashcard
    prompt: 'What is the full PowerShell cmdlet name for the `cd` alias?'
    answer:
      expected: |
        `Set-Location`
  - id: item-003
    type: flashcard
    prompt: 'What is the full PowerShell cmdlet name for the `ls` or `dir` alias?'
    answer:
      expected: |
        `Get-ChildItem`
  - id: item-004
    type: flashcard
    prompt: 'What command do you run to read the documentation/manual for a specific cmdlet?'
    answer:
      expected: |
        `Get-Help`
  - id: item-005
    type: flashcard
    prompt: 'When using `Get-Help`, what flag do you append to see only code snippets of how to use the command?'
    answer:
      expected: |
        `-Examples`
  - id: item-006
    type: flashcard
    prompt: 'What cmdlet do you use if you want to discover commands based on a keyword or wildcard (e.g., finding all commands with "Network" in the name)?'
    answer:
      expected: |
        `Get-Command` (e.g., `Get-Command *Network*`)
  - id: item-007
    type: flashcard
    prompt: 'How do you tell `Get-ChildItem` to search through all sub-folders?'
    answer:
      expected: |
        Use the `-Recurse` parameter.
  - id: item-008
    type: flashcard
    prompt: 'What is a PSDrive?'
    answer:
      expected: |
        A data store (like the Registry or Environment Variables) that is mapped to look and act like a normal file system drive, allowing you to navigate it with `Set-Location`.
