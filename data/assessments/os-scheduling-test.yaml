- id: q004
  title: Explain Real-time scheduling
  type: freeResponse
  prompt: 'In a short answer, explain why **Real-time scheduling** matters in Scheduling.

    '
  answer:
    expected: 'Real-time scheduling focuses on meeting timing constraints rather than average speed. A complete answer should
      also note that a real-time system is about deadlines, not merely being fast.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Real-time scheduling
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Scheduling. The key is to connect the term to what the OS controls or protects.

    '
