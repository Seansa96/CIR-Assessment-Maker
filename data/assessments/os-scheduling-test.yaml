questions:
- id: q001
  title: Recognize Scheduler goal
  type: multipleChoice
  prompt: 'Which statement best describes **Scheduler goal** in operating systems?

    '
  choices:
  - id: a
    text: A scheduler chooses which runnable work gets CPU time according to goals such as throughput, response time, fairness,
      or deadlines.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'A scheduler chooses which runnable work gets CPU time according to goals such as throughput, response time,
    fairness, or deadlines. The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q002
  title: Recognize Batch scheduling
  type: multipleChoice
  prompt: 'Which statement best describes **Batch scheduling** in operating systems?

    '
  choices:
  - id: a
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: b
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  - id: c
    text: It removes the need for explicit policies, permissions, or resource-management decisions.
  - id: d
    text: Batch systems emphasize throughput and turnaround, often tolerating less interactivity.
  answer:
    choiceId: d
  explanation: 'Batch systems emphasize throughput and turnaround, often tolerating less interactivity. The distractors either
    ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
