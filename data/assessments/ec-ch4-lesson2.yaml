workedExamples:
- id: l2-sec1
  title: Source Transformations
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Source Transformations
    instruction: A voltage source $V_s$ in series with a resistor $R$ can be replaced
      by a current source $I_s = V_s/R$ in parallel with the same resistor $R$, and
      vice-versa.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec2
  title: Thévenin Equivalent
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Thévenin Equivalent
    instruction: Any linear circuit with voltage/current sources and resistors can
      be replaced at a pair of terminals by an equivalent circuit consisting of a
      single voltage source $V_{Th}$ in series with a resistor $R_{Th}$.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec3
  title: Norton Equivalent
  problem: 'Review the following concept:'
  steps:
  - id: step3
    title: Norton Equivalent
    instruction: Any linear circuit can be replaced by an equivalent circuit consisting
      of a single current source $I_N$ in parallel with a resistor $R_N$ (where $R_N
      = R_{Th}$ and $I_N = V_{Th}/R_{Th}$).
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
