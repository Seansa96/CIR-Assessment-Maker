- id: q-40f5ae
  type: multipleChoice
  title: Limaçon Classification (3)
  prompt: What type of limaçon is $r = 5 + 6\cos\theta$?
  choices:
  - id: c1
    text: Limaçon with an inner loop
  - id: c2
    text: Cardioid
  - id: c3
    text: Dimpled limaçon
  - id: c4
    text: Convex limaçon
  answer:
    choiceId: c1
  explanation: Here $a = 5$ and $b = 6$. Since $a/b < 1$, it has an inner loop.
  skills:
  - polar-curves
