- id: q-68da41
  type: symbolicResponse
  title: Polar to Cartesian (1)
  prompt: Convert the polar equation $r = \frac{5}{\sin\theta - \cos\theta}$ into
    a Cartesian equation of the form $y = f(x)$. Find $f(x)$.
  answer:
    expectedLatex: x + 5
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: 'Multiply by the denominator: $r\sin\theta - r\cos\theta = 5 \implies
    y - x = 5 \implies y = x + 5$.'
  skills:
  - polar-curves
