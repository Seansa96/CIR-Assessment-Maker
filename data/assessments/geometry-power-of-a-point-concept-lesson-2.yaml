lesson:
  introduction: |-
    Now that we understand the theoretical definition of the Power of a Point, let's look at how we can use this single concept to solve problems that would otherwise require memorizing multiple different theorems.
  sections:
  - id: sec-solving-unknowns
    title: Using the Constant Power
    required: true
    content: |-
      Because $PA \times PB$ is always equal to the Power of $P$, you can set any two intersecting lines through $P$ equal to each other!
      
      If line 1 intersects the circle at $A$ and $B$, and line 2 intersects the circle at $C$ and $D$, then:
      $$PA \times PB = PC \times PD$$
      
      This is true whether $P$ is inside the circle (chords) or outside the circle (secants). You no longer need to remember "piece times piece" vs "outer times whole"—just remember that the product of the distances from $P$ to the circle is always constant!

  - id: sec-tangent-power
    title: The Tangent Shortcut
    required: true
    content: |-
      If one of the lines through external point $P$ is tangent to the circle at point $T$, the two intersection points $A$ and $B$ merge into a single point $T$.
      
      The power equation becomes $PT \times PT = PT^2$.
      
      This means the **Power of Point $P$ is exactly equal to the square of the tangent segment from $P$**. This provides a lightning-fast way to find the length of a tangent if you know the distance to the center and the radius, using $PT^2 = d^2 - r^2$!

questions:
- id: q-geom-pop2-1
  title: Concept Check - Finding Tangent Length
  prompt: |-
    A point $P$ is $10$ units away from the center of a circle with a radius of $6$. What is the length of the tangent segment drawn from $P$ to the circle?
  type: numericResponse
  answer:
    numericValue: 8
    tolerance: 0
  explanation: |-
    The Power of Point $P$ is $d^2 - r^2 = 10^2 - 6^2 = 100 - 36 = 64$.
    We also know the Power of Point $P$ is equal to the tangent squared ($PT^2$).
    $PT^2 = 64 \implies PT = 8$.
  skills:
  - geometry-power-of-a-point

- id: q-geom-pop2-2
  title: Concept Check - Universal Application
  prompt: |-
    If $P$ is a point inside a circle, and two chords pass through $P$, the equation $PA \times PB = PC \times PD$ is derived from the Power of a Point theorem. The values of $PA \times PB$ and $PC \times PD$ will both be equal to the Power of $P$.
    True or False: The value of $PA \times PB$ will be a positive number.
  type: multipleChoice
  choices:
  - id: c1
    text: True
  - id: c2
    text: False
  answer:
    choiceId: c2
  explanation: |-
    **False**! For a point *inside* the circle, the Power ($d^2 - r^2$) is actually negative because $d < r$. In advanced geometry using *directed* distances, vectors $PA$ and $PB$ point in opposite directions, making their product negative! (Though in basic geometry classes, we just take the absolute value).
  skills:
  - geometry-power-of-a-point
