workedExamples:
- id: mathematical-literacy-proofs-worked-example-b-example
  title: Trace a proof by contrapositive
  problem: 'A proof of “If $n^2$ is even, then n is even” begins: “Assume n is odd.” Identify the proof strategy
    and the required conclusion of that branch.'
  steps:
  - id: step-1
    title: Identify the assumed opposite
    type: freeResponse
    prompt: What is the negation of the desired conclusion?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The opposite conclusion is that n is odd.
    explanation: |-
      Solution: The opposite conclusion is that n is odd.
      Why it works: A contrapositive proof begins by assuming the conclusion fails.
  - id: step-2
    title: Name the target of the branch
    type: freeResponse
    prompt: What must this branch show about $n^2$?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - It must show that $n^2$ is odd.
    explanation: |-
      Solution: It must show that $n^2$ is odd.
      Why it works: This establishes “if n is not even, then $n^2$ is not even.”
  - id: step-3
    title: Connect to the original claim
    type: freeResponse
    prompt: Why does that finish the proof?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - It proves the contrapositive, so the original conditional follows.
    explanation: |-
      Solution: It proves the contrapositive, so the original conditional follows.
      Why it works: A conditional and its contrapositive have the same truth value.
