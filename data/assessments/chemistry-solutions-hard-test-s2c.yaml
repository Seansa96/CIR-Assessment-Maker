questions:
  - { id: q001, type: freeResponse, prompt: 'A 12.5% m/m NaCl solution has density 1.08 g/mL. Find the molarity of NaCl (58.44 g/mol).', answer: { gradingMode: selfCheck, keyPoints: ['108 g solution per 100.0 mL', '13.5 g NaCl', '0.231 mol', '2.31 M'] }, explanation: 'Solution: One hundred milliliters has mass $(1.08\ \mathrm{g/mL})(100.0\ \mathrm{mL})=108\ \mathrm g$; NaCl mass is $0.125(108)=13.5\ \mathrm g$, or $13.5/58.44=0.231\ \mathrm{mol}$. Divide by 0.1000 L: $2.31\ \mathrm M$. Why it works: Density bridges mass-percent data to a solution volume, then molar mass bridges mass to moles. Common trap: Treating 12.5% as molarity.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Combines percent, density, molar mass, and final volume.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-percent-density-to-M, variationAxes: { scenario: dense brine, governingRelation: percent-density-molarity chain, unknown: molarity } }
  - { id: q002, type: freeResponse, prompt: 'A solution contains 0.0800 mol CaCl2 in 400.0 mL. It is split equally into four identical flasks. Find molarity in each flask and justify it.', answer: { gradingMode: selfCheck, keyPoints: ['0.200 M', 'both moles and volume divide by four', 'ratio unchanged'] }, explanation: 'Solution: Original $M=0.0800/0.4000=0.200\ \mathrm M$. Each flask has 0.0200 mol in 0.1000 L, also 0.200 M. Why it works: Molarity is intensive: dividing numerator and denominator by the same factor preserves the ratio. Common trap: Dividing molarity by four.', difficultyDimensions: [globalLocalReasoning, proofJustification, representationTransfer], difficultyEvidence: 'Transfers a global concentration to equal subsamples and justifies ratio invariance.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: hard-split-solution-invariance, variationAxes: { scenario: aliquot split, unknown: aliquot molarity, governingRelation: intensive ratio } }
  - { id: q003, type: freeResponse, prompt: 'Design a 250.0 mL preparation of 0.150 M CuSO4 from 1.50 M stock. State stock volume, final procedure, and why adding 225.0 mL water is not the formal instruction.', answer: { gradingMode: selfCheck, keyPoints: ['25.0 mL stock', 'dilute to 250.0 mL', 'water volume is not guaranteed final-volume difference'] }, explanation: 'Solution: $V_1=(0.150)(250.0)/1.50=25.0\ \mathrm{mL}$. Transfer 25.0 mL stock and dilute to the 250.0 mL mark. Why it works: $M_1V_1=M_2V_2$ conserves solute moles and the mark fixes final solution volume. Common trap: Treating 250.0 minus 25.0 mL as a precisely measured water amount.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Solves dilution and translates it into correct laboratory sequencing.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: hard-dilution-lab-design, variationAxes: { scenario: stock preparation, representation: calculation plus lab protocol, unknown: transfer volume } }
  - { id: q004, type: freeResponse, prompt: 'A label reports 1.20 ppm fluoride. How many micrograms fluoride are in a 0.750 L bottle, and what assumption supports the calculation?', answer: { gradingMode: selfCheck, keyPoints: ['1.20 mg per L', '0.900 mg', '900 micrograms', 'dilute-water approximation'] }, explanation: 'Solution: $1.20\ \mathrm{ppm}\approx1.20\ \mathrm{mg/L}$, giving 0.900 mg in 0.750 L, or 900 micrograms. Why it works: ppm maps to mg/L only under the stated dilute-water approximation. Common trap: Calling 0.900 mg equal to 0.900 micrograms.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Uses ppm conversion, sample-volume scaling, and a stated physical assumption.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-ppm-to-microgram-sample, variationAxes: { scenario: bottled water, unknown: trace mass, constraints: density approximation } }
  - { id: q005, type: freeResponse, prompt: 'A technician mixed 15.0 g solute with 85.0 g water, then evaporated 20.0 g water only. Find the new mass percent and explain why it rises.', answer: { gradingMode: selfCheck, keyPoints: ['80.0 g final solution', '18.75 percent', 'solute mass unchanged'] }, explanation: 'Solution: Final water is 65.0 g, so total solution mass is 80.0 g; mass percent is $(15.0/80.0)100=18.75\%$. Why it works: Evaporation removes solvent but not solute, shrinking the denominator. Common trap: Keeping 100.0 g as final solution mass.', difficultyDimensions: [modelOrDerivation, parameterThreshold, representationTransfer], difficultyEvidence: 'Models selective solvent loss, recomputes mixture mass, and interprets concentration change.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-evaporation-mass-percent, variationAxes: { scenario: evaporation, constraints: solvent-only loss, unknown: new mass percent } }
  - { id: q006, type: freeResponse, prompt: 'Compare 0.0150 M glucose, 1.50 g/L glucose, and 2700 ppm glucose. Molar mass glucose is 180.16 g/mol. Rank by molar concentration.', answer: { gradingMode: selfCheck, keyPoints: ['1.50 g/L = 0.00833 M', '2700 ppm = 2.700 g/L = 0.01499 M', '1.50 g/L lowest', '0.0150 M and 2700 ppm essentially equal'] }, explanation: 'Solution: Convert g/L to M: $1.50/180.16=0.00833\ \mathrm M$. In dilute water 2700 ppm = 2.700 g/L, giving $2.700/180.16=0.01499\ \mathrm M$. Thus 1.50 g/L is lowest; 0.0150 M and 2700 ppm are equal within rounding. Why it works: A common molar scale makes unlike concentration forms comparable. Common trap: Ranking numerical labels without converting units.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, estimationOrBounds], difficultyEvidence: 'Converts three representations to a common scale and recognizes rounding equivalence.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-mixed-concentration-ranking, variationAxes: { representation: molarity g-per-L ppm, unknown: rank, methodBranch: common-scale comparison } }
  - { id: q007, type: freeResponse, prompt: 'A 0.400 M solution is made by dissolving 0.100 mol solute. A student reports final volume 100.0 mL. Diagnose the inconsistency and correct final volume.', answer: { gradingMode: selfCheck, keyPoints: ['0.250 L', '250 mL', '100 mL would be 1.00 M'] }, explanation: 'Solution: $V=n/M=0.100/0.400=0.250\ \mathrm L=250\ \mathrm{mL}$. If volume were 0.1000 L, molarity would be 1.00 M. Why it works: Molarity is moles per liter, so the reported quantities must satisfy that ratio. Common trap: Treating 100.0 mL as 100.0 L.', difficultyDimensions: [errorDiagnosis, reverseReasoning, representationTransfer], difficultyEvidence: 'Checks a reported result against the governing relation and solves backward for a valid volume.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: hard-inconsistent-M-report, variationAxes: { scenario: lab report audit, unknown: corrected volume, methodBranch: reverse validation } }
  - { id: q008, type: freeResponse, prompt: 'A 0.900 M stock is serially diluted: 10.0 mL to 100.0 mL, then 25.0 mL of that solution to 250.0 mL. Find final molarity.', answer: { gradingMode: selfCheck, keyPoints: ['0.0900 M after first', '0.00900 M final'] }, explanation: 'Solution: First dilution is tenfold: 0.0900 M. The second is also tenfold: 0.00900 M. Why it works: Each step conserves solute moles within its own transfer and multiplies dilution factors. Common trap: Adding dilution factors instead of multiplying them.', difficultyDimensions: [auxiliaryTechnique, casePartition, modelOrDerivation], difficultyEvidence: 'Partitions a serial process into two conserved-moles dilution calculations.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: hard-serial-dilution, variationAxes: { scenario: serial dilution, methodBranch: two-stage process, unknown: final concentration } }
  - { id: q009, type: freeResponse, prompt: 'A solution is 4.00% m/m sucrose. What mass water must be added to 50.0 g solution to obtain 2.00% m/m sucrose?', answer: { gradingMode: selfCheck, keyPoints: ['2.00 g sucrose initially', '100.0 g final solution', '50.0 g water added'] }, explanation: 'Solution: Initial sucrose is $0.0400(50.0)=2.00\ \mathrm g$. For this to be 2.00% of final solution, final mass must be $2.00/0.0200=100.0\ \mathrm g$; add 50.0 g water. Why it works: Water changes total mass but leaves solute mass fixed. Common trap: Halving the 50.0 g initial solution mass.', difficultyDimensions: [reverseReasoning, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Finds conserved solute mass then works backward from target fraction to required total mass.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-mass-percent-dilution, variationAxes: { scenario: mass-based dilution, unknown: added water, governingRelation: conserved solute mass } }
  - { id: q010, type: freeResponse, prompt: 'Explain why 0.250 M and 0.250 mol are not interchangeable, then give the moles in 40.0 mL of a 0.250 M solution.', answer: { gradingMode: selfCheck, keyPoints: ['M is concentration', '0.0400 L', '0.0100 mol'] }, explanation: 'Solution: Molarity is mol/L, not an amount. $n=(0.250\ \mathrm{mol/L})(0.0400\ \mathrm L)=0.0100\ \mathrm{mol}$. Why it works: Volume is required to convert concentration to amount. Common trap: Treating a molarity label as if it already states moles.', difficultyDimensions: [representationTransfer, proofJustification, auxiliaryTechnique], difficultyEvidence: 'Distinguishes quantity types, justifies dimensional need, and calculates moles.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: hard-concentration-versus-amount, variationAxes: { representation: unit meaning plus calculation, unknown: amount } }
  - { id: q011, type: freeResponse, prompt: 'A 0.250 M KNO3 solution is prepared by dissolving 5.06 g KNO3 (101.10 g/mol). Find final volume and state the suitable flask-mark volume.', answer: { gradingMode: selfCheck, keyPoints: ['0.0500 mol', '0.200 L', '200 mL'] }, explanation: 'Solution: $n=5.06/101.10=0.0500\ \mathrm{mol}$; $V=0.0500/0.250=0.200\ \mathrm L$, so use a 200 mL final-volume mark. Why it works: Mass becomes moles, then molarity determines final volume. Common trap: Using 0.250 as a volume.', difficultyDimensions: [auxiliaryTechnique, reverseReasoning, representationTransfer], difficultyEvidence: 'Works from weighed solute backward to a volumetric preparation target.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: hard-mass-to-flask-volume, variationAxes: { scenario: choose flask size, unknown: final volume, methodBranch: reverse preparation } }
  - { id: q012, type: freeResponse, prompt: 'A solution contains 600 ppb solute. Express it as ppm and mg/L in dilute water.', answer: { gradingMode: selfCheck, keyPoints: ['0.600 ppm', '0.600 mg/L'] }, explanation: 'Solution: 600 ppb = 0.600 ppm = 0.600 mg/L. Why it works: 1000 ppb equals 1 ppm, and dilute-water ppm approximates mg/L. Common trap: Reporting 600 mg/L.', difficultyDimensions: [representationTransfer, simplification, domainCondition], difficultyEvidence: 'Converts two trace-concentration scales using the aqueous approximation.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-ppb-ppm-mgL, variationAxes: { representation: ppb ppm mg-per-L, unknown: equivalent forms } }
  - { id: q013, type: freeResponse, prompt: 'A student measures 15.0 mL 2.00 M acid then accidentally fills a 500.0 mL flask to 250.0 mL. Find actual molarity and the correction needed.', answer: { gradingMode: selfCheck, keyPoints: ['0.120 M', 'dilute to 500.0 mL', '0.0600 M target after correction'] }, explanation: 'Solution: At 250.0 mL, $M=(2.00)(15.0)/250.0=0.120\ \mathrm M$. Diluting that same solute to 500.0 mL yields 0.0600 M. Why it works: The transferred moles stay fixed while volume changes. Common trap: Adding another 15.0 mL stock instead of adding water.', difficultyDimensions: [errorDiagnosis, modelOrDerivation, parameterThreshold], difficultyEvidence: 'Diagnoses an underfilled flask and compares two final-volume states.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: hard-underfilled-flask, variationAxes: { scenario: lab error, constraints: wrong final volume, unknown: actual and corrected concentration } }
  - { id: q014, type: freeResponse, prompt: 'Determine whether 2.00 g solute in 98.0 g water is more or less concentrated by mass than 0.0150 mass fraction solute. Show both as percent.', answer: { gradingMode: selfCheck, keyPoints: ['2.00 percent', '1.50 percent', 'first more concentrated'] }, explanation: 'Solution: First mixture is $2.00/(2.00+98.0)=0.0200=2.00\%$. The other fraction is 1.50%. Therefore the first is more concentrated. Why it works: A common percent scale permits comparison. Common trap: Calling the first 2.04% by dividing by water only.', difficultyDimensions: [modelOrDerivation, representationTransfer, estimationOrBounds], difficultyEvidence: 'Constructs total mass, normalizes a fraction, and compares on one scale.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-mass-fraction-comparison, variationAxes: { representation: component masses versus fraction, unknown: comparison } }
  - { id: q015, type: freeResponse, prompt: 'A sample is 0.0150 M dye, molar mass 250.0 g/mol. Express its concentration in mg/L and ppm, assuming dilute water.', answer: { gradingMode: selfCheck, keyPoints: ['3.75 g/L', '3750 mg/L', '3750 ppm'] }, explanation: 'Solution: $(0.0150\ \mathrm{mol/L})(250.0\ \mathrm{g/mol})=3.75\ \mathrm{g/L}=3750\ \mathrm{mg/L}\approx3750\ \mathrm{ppm}$. Why it works: Molar mass converts molarity to mass concentration, then dilute-water ppm applies. Common trap: Calling 3.75 g/L equal to 3.75 ppm.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Chains molarity-to-mass concentration with ppm convention.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: hard-M-to-ppm, variationAxes: { representation: molarity to mass concentration to ppm, unknown: trace-scale label } }
  - { id: q016, type: freeResponse, prompt: 'A mixture is made from 25.0 mL 0.200 M NaCl and 75.0 mL water. Find final molarity, assuming volumes add.', answer: { gradingMode: selfCheck, keyPoints: ['0.00500 mol', '0.1000 L final', '0.0500 M'] }, explanation: 'Solution: Initial moles are $(0.200)(0.0250)=0.00500\ \mathrm{mol}$. With stated additive volumes, final volume is 0.1000 L, so $M=0.0500\ \mathrm M$. Why it works: Water adds no NaCl; its only effect is increasing denominator. Common trap: Averaging 0.200 M and zero without accounting for volumes.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Builds a mixing mole balance, uses stated volume assumption, and calculates final concentration.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: hard-mix-stock-water, variationAxes: { scenario: direct mixing, constraints: additive volumes, unknown: final molarity } }
  - { id: q017, type: freeResponse, prompt: 'Explain why a 10.0 ppm sample can be more concentrated than a 0.0050% sample or not; decide by conversion.', answer: { gradingMode: selfCheck, keyPoints: ['0.0050 percent equals 50 ppm', '10 ppm is less concentrated'] }, explanation: 'Solution: $0.0050\%=0.000050$, which is 50 ppm. Therefore 10.0 ppm is less concentrated. Why it works: Percent must be converted before comparison with ppm. Common trap: Comparing 10.0 and 0.0050 as bare numbers.', difficultyDimensions: [representationTransfer, simplification, errorDiagnosis], difficultyEvidence: 'Normalizes unlike concentration units and rejects bare-number comparison.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-percent-ppm-comparison, variationAxes: { representation: percent versus ppm, unknown: comparison, methodBranch: unit normalization } }
  - { id: q018, type: freeResponse, prompt: 'A 2.00 M stock must be diluted to 0.125 M. Derive the final-to-stock volume ratio and interpret it.', answer: { gradingMode: selfCheck, keyPoints: ['V2/V1 equals 16', 'final volume is sixteen times stock volume'] }, explanation: 'Solution: From $M_1V_1=M_2V_2$, $V_2/V_1=M_1/M_2=2.00/0.125=16$. Why it works: With fixed solute moles, concentration and volume are inversely proportional. Common trap: Saying 16 mL without knowing the starting volume.', difficultyDimensions: [modelOrDerivation, reverseReasoning, proofJustification], difficultyEvidence: 'Derives a dimensionless volume ratio from dilution rather than computing one arbitrary volume.', prerequisiteObjectiveIds: [solution-preparation-dilution], extensionObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: hard-dilution-volume-ratio, variationAxes: { unknown: ratio rather than volume, representation: equation derivation } }
  - { id: q019, type: freeResponse, prompt: 'A 100.0 g 6.00% m/m solution is mixed with 50.0 g pure water. Find final mass percent and verify whether it is exactly half.', answer: { gradingMode: selfCheck, keyPoints: ['6.00 g solute', '150.0 g total', '4.00 percent', 'not half'] }, explanation: 'Solution: Solute mass remains 6.00 g; total mass becomes 150.0 g, so concentration is $6.00/150.0=4.00\%$. Why it works: Adding half the original mass of water multiplies total mass by 1.5, not 2. Common trap: Automatically halving any concentration after adding water.', difficultyDimensions: [modelOrDerivation, parameterThreshold, errorDiagnosis], difficultyEvidence: 'Tracks conserved solute, models changed total mass, and rejects an overgeneralized dilution shortcut.', prerequisiteObjectiveIds: [solution-concentration-forms], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: hard-mass-water-addition, variationAxes: { scenario: mass mixing, constraints: non-doubling total mass, unknown: new percent } }
  - { id: q020, type: freeResponse, prompt: 'A solution target is 0.300 M, but a balance mass was calculated using 0.300 mol instead of 0.300 mol/L. Explain the missing datum and give the general correct mass expression.', answer: { gradingMode: selfCheck, keyPoints: ['final volume missing', 'm equals M times V times molar mass', 'volume in liters'] }, explanation: 'Solution: A molarity alone does not determine moles; final volume is required. The correct expression is $m=(M\,V\,M_m)$ with V in liters. Why it works: Molarity is an amount-per-volume ratio, so an amount requires a chosen volume. Common trap: Treating 0.300 M as 0.300 mol.', difficultyDimensions: [proofJustification, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Identifies underdetermination, derives the general preparation equation, and diagnoses unit confusion.', prerequisiteObjectiveIds: [molarity-conversions], extensionObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: hard-molarity-underdetermined-mass, variationAxes: { scenario: calculation audit, unknown: missing datum and general expression, methodBranch: underdetermination } }
