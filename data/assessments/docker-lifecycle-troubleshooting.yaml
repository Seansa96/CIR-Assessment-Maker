questions:
- id: docker-ps-all
  title: Viewing All Containers
  type: multipleChoice
  prompt: "By default, `docker ps` only shows running containers. If a container crashes\
    \ immediately after starting, it will not appear in the standard output. \n\n\
    Which command allows you to view all containers, including those that have stopped\
    \ or crashed?\n"
  choices:
  - id: a
    text: '`docker ps -a`'
  - id: b
    text: '`docker ps --stopped`'
  - id: c
    text: '`docker containers all`'
  - id: d
    text: '`docker status`'
  answer:
    choiceId: a
  explanation: 'The `-a` (or `--all`) flag tells `docker ps` to display all containers,
    regardless of their current status. This is the first step in troubleshooting
    a container that failed to start.

    '
- id: docker-inspect
  title: Inspecting Container Details
  type: multipleChoice
  prompt: 'You have found a crashed container named `my-web` using `docker ps -a`,
    but you need to see the exact exit code, the internal IP address, and the environment
    variables it was launched with.


    Which command provides this detailed JSON output?

    '
  choices:
  - id: a
    text: '`docker inspect my-web`'
  - id: b
    text: '`docker describe my-web`'
  - id: c
    text: '`docker details my-web`'
  - id: d
    text: '`docker info my-web`'
  answer:
    choiceId: a
  explanation: '`docker inspect` returns low-level information on Docker objects in
    JSON format. It is incredibly useful for finding out exactly how a container was
    configured and why it exited (by looking at the `State` object).

    '
- id: docker-logs-stopped
  title: Logs of a Stopped Container
  type: multipleChoice
  prompt: 'Can you view the logs of a container that has already crashed and stopped
    running using `docker logs`?

    '
  choices:
  - id: a
    text: Yes, Docker preserves the STDOUT and STDERR logs of a container until it
      is removed.
  - id: b
    text: No, logs are only available while the container is actively running.
  - id: c
    text: Only if you started the container with the `--preserve-logs` flag.
  - id: d
    text: Yes, but you must restart the container first.
  answer:
    choiceId: a
  explanation: 'Docker captures the standard output (STDOUT) and standard error (STDERR)
    of the main process. These logs are preserved on disk until you explicitly delete
    the container using `docker rm`.

    '
