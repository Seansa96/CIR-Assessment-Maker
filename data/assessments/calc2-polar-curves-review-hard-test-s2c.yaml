questions:
  - { id: q001, type: freeResponse, prompt: 'For $r=1+2\cos\theta$, derive the bounds of the inner loop and explain why those bounds trace it once.', answer: { gradingMode: selfCheck, keyPoints: ['solve one plus two cosine equals zero', 'theta equals two pi over three and four pi over three', 'r negative between roots', 'one traversal'] }, explanation: 'Solution: Set $1+2\cos\theta=0$, giving $\theta=2\pi/3,4\pi/3$. Between them r is negative, so opposite rays form the inner loop; these consecutive zeros bound one traversal. Why it works: Loop endpoints occur at the pole and negative r changes direction. Common trap: Using $0$ to $2\pi$, which includes the outer loop.' , difficultyDimensions: [domainCondition, representationTransfer, modelOrDerivation], difficultyEvidence: 'Solves threshold angles, interprets negative radius, and selects a single-loop interval.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q002, type: freeResponse, prompt: '![Polar loop comparison](/media/calculus/polar-review-loop-sector.svg) Explain how you would decide which curve is outer for the region common to $r=2\cos\theta$ and $r=2\sin\theta$ in the first quadrant.', answer: { gradingMode: selfCheck, keyPoints: ['find equality at pi over four', 'compare sample angles', 'minimum radius gives common region boundary', 'split if outer changes'] }, explanation: 'Solution: Equate the radii at $\pi/4$, then compare on each side. For the common region the smaller nonnegative radius is the boundary: $2\sin\theta$ first and $2\cos\theta$ second. Why it works: A point must lie inside both curves, so radial distance is limited by the smaller curve. Common trap: Applying outer-minus-inner, which describes the region between rather than the overlap.' , difficultyDimensions: [casePartition, modelOrDerivation, representationTransfer], difficultyEvidence: 'Finds a switching intersection, compares radii, and distinguishes overlap from between-curves area.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q003, type: freeResponse, prompt: 'A student uses $\frac12\int_0^{2\pi}(1+\cos\theta)^2d\theta$ for a cardioid and then doubles the result by symmetry. Diagnose the error.', answer: { gradingMode: selfCheck, keyPoints: ['full interval already traces once', 'integral is full area', 'symmetry double counts'] }, explanation: 'Solution: $0\le\theta\le2\pi$ already traces the whole cardioid once, so its polar-area integral is the full area. Doubling it counts every sector twice. Why it works: Symmetry may replace a partial interval, not augment a completed one. Common trap: Using a symmetry multiplier without checking coverage.' , difficultyDimensions: [errorDiagnosis, globalLocalReasoning, modelOrDerivation], difficultyEvidence: 'Audits traversal coverage, symmetry, and the area model.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q004, type: freeResponse, prompt: 'Convert $r=\frac{4}{1-\cos\theta}$ to a Cartesian equation and identify the geometric type.', answer: { gradingMode: selfCheck, keyPoints: ['r minus r cosine equals four', 'sqrt x squared plus y squared minus x equals four', 'parabola after squaring', 'focus/directrix interpretation optional'] }, explanation: 'Solution: Multiply: $r-r\cos\theta=4$, so $\sqrt{x^2+y^2}-x=4$. Squaring gives $y^2=8x+16$, a parabola. Why it works: Replacing r by distance creates a Cartesian conic relation. Common trap: Squaring before isolating the radical, which can hide the needed domain condition.' , difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Transforms a polar equation, isolates a radical, squares, and retains geometric conditions.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q005, type: freeResponse, prompt: 'Set up the area inside $r=2\sin\theta$ and outside $r=1$; justify all angular bounds.', answer: { gradingMode: selfCheck, keyPoints: ['intersections sine theta equals one half', 'pi over six to five pi over six', 'one half integral outer squared minus one'] }, explanation: 'Solution: Intersections satisfy $2\sin\theta=1$, so $\theta=\pi/6,5\pi/6$. The desired area is $\frac12\int_{\pi/6}^{5\pi/6}[(2\sin\theta)^2-1]d\theta$. Why it works: On that interval the circle $2\sin\theta$ lies outside r=1. Common trap: Using all of $0$ to $\pi$ and including points inside the unit circle.' , difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, domainCondition], difficultyEvidence: 'Finds intersections, verifies curve order, and builds an annular-sector model.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q006, type: freeResponse, prompt: 'Explain why a rose $r=\cos(4\theta)$ should not automatically be integrated from $0$ to $2\pi$ when asked for one petal area.', answer: { gradingMode: selfCheck, keyPoints: ['multiple petals retraced', 'zeros bound a petal', 'choose consecutive zeros around desired petal', 'full period counts all petals'] }, explanation: 'Solution: Zeros of $\cos4\theta$ identify endpoints of individual petals; choose the consecutive zeros surrounding one petal. The full interval traces all petals, with possible retracing. Why it works: A polar equation describes both a locus and a timed trace. Common trap: Dividing a full-period integral by the petal count without confirming equal single tracing.' , difficultyDimensions: [globalLocalReasoning, domainCondition, modelOrDerivation], difficultyEvidence: 'Uses zeros, tracing behavior, and multiplicity to isolate a single geometric component.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q007, type: freeResponse, prompt: 'For $r=\theta$ on $0\le\theta\le2\pi$, explain why the curve cannot be treated as a circular sector even though theta is an angle.', answer: { gradingMode: selfCheck, keyPoints: ['radius changes continuously', 'spiral', 'arc length includes r prime', 'area uses variable r squared'] }, explanation: 'Solution: The radius grows with angle, so the trace is a spiral, not an arc of a fixed circle. Its area uses $\frac12\int\theta^2d\theta$ and length uses $\sqrt{\theta^2+1}$. Why it works: Polar formulas permit changing radius, whereas a sector assumes constant radius. Common trap: Applying $A=\frac12r^2\Delta\theta$ with one endpoint radius.' , difficultyDimensions: [representationTransfer, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Classifies the curve, selects variable-radius formulas, and rejects an invalid fixed-radius shortcut.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q008, type: freeResponse, prompt: 'Describe a reliable procedure for finding all intersections of two polar curves, including the pole.', answer: { gradingMode: selfCheck, keyPoints: ['equate radii at common theta', 'solve zeros separately', 'recognize multiple polar names', 'verify Cartesian points'] }, explanation: 'Solution: First solve $r_1(\theta)=r_2(\theta)$ for common-angle intersections. Then separately test whether both curves pass through the pole and check equivalent negative-radius descriptions; verify candidate Cartesian points. Why it works: The pole has many polar coordinates, so equal-radii algebra alone can miss it. Common trap: Assuming an intersection must share the same theta representation.' , difficultyDimensions: [casePartition, representationTransfer, errorDiagnosis], difficultyEvidence: 'Combines algebraic intersections, polar-coordinate nonuniqueness, and Cartesian verification.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q009, type: freeResponse, prompt: 'For $r=2\cos\theta$, compare polar and Cartesian models for finding its enclosed area, and identify the more direct method.', answer: { gradingMode: selfCheck, keyPoints: ['polar half integral zero to pi over two? full circle trace negative as well', 'Cartesian circle center one zero radius one', 'both valid', 'polar direct with suitable trace'] }, explanation: 'Solution: Cartesian form is $(x-1)^2+y^2=1$, so geometry gives area $\pi$. Polar form also works with a single trace, e.g. $-\pi/2\le\theta\le\pi/2$, via $\frac12\int4\cos^2\theta d\theta=\pi$. Why it works: Either representation is valid; the best one exposes the requested quantity with fewer transformations. Common trap: Using $0$ to $2\pi$, which retraces the circle with negative r.' , difficultyDimensions: [representationTransfer, reverseReasoning, globalLocalReasoning], difficultyEvidence: 'Builds two models, compares complexity, and accounts for retracing.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q010, type: freeResponse, prompt: 'Explain how the substitutions $\theta\mapsto-\theta$, $\theta\mapsto\pi-\theta$, and $r\mapsto-r$ correspond to different polar symmetries.', answer: { gradingMode: selfCheck, keyPoints: ['polar axis', 'vertical line or pi over two axis', 'pole with theta unchanged? test conventions', 'state test equation unchanged'] }, explanation: 'Solution: Replacing theta by its negative reflects across the polar axis; replacing theta by $\pi-\theta$ reflects across the vertical axis. Replacing r by -r tests a pole-related symmetry convention when the equation is unchanged. Why it works: Each substitution changes a ray in a specific geometric way. Common trap: Treating all substitutions as equivalent because they can represent the same point in special cases.' , difficultyDimensions: [representationTransfer, identityConstruction, proofJustification], difficultyEvidence: 'Maps algebraic substitutions to distinct reflections and justifies invariance tests.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q011, type: freeResponse, prompt: 'A polar-area setup uses $\frac12\int(r_\text{outer}-r_\text{inner})^2d\theta$. Explain precisely why it is generally wrong and state the correct form.', answer: { gradingMode: selfCheck, keyPoints: ['sector areas subtract', 'outer squared minus inner squared', 'cross term is spurious', 'only special cases coincide'] }, explanation: 'Solution: Sector area is proportional to radius squared, so subtract areas: $\frac12\int(r_o^2-r_i^2)d\theta$. Squaring a difference introduces the false cross term $-2r_or_i$. Why it works: The region is an annular sector, not a sector with radial thickness as radius. Common trap: Confusing a linear thickness with the radial coordinate in the sector formula.' , difficultyDimensions: [errorDiagnosis, modelOrDerivation, identityConstruction], difficultyEvidence: 'Diagnoses an invalid expression through geometric derivation and algebraic expansion.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q012, type: freeResponse, prompt: 'For a limacon whose radius changes sign, describe how you would use a table of sample angles to avoid plotting the inner loop on the wrong side.', answer: { gradingMode: selfCheck, keyPoints: ['record sign of r', 'negative plots theta plus pi', 'include zeros', 'connect in parameter order'] }, explanation: 'Solution: List angles around each zero, compute r including its sign, and plot negative values on the ray $\theta+\pi$. Connect points in increasing parameter order. Why it works: Polar plotting uses signed directed distance. Common trap: Plotting a negative radius on the original ray and erasing the inner loop.' , difficultyDimensions: [representationTransfer, casePartition, errorDiagnosis], difficultyEvidence: 'Uses sign regions, equivalent rays, and sequential tracing to construct a graph.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q013, type: freeResponse, prompt: 'Give a method for deciding whether a polar arc-length integral has a symmetry reduction, and state what must be true before multiplying.', answer: { gradingMode: selfCheck, keyPoints: ['verify geometric symmetry', 'verify interval traces nonoverlapping symmetric pieces', 'speed symmetry', 'do not double retraced path'] }, explanation: 'Solution: Establish symmetry of the curve and speed, select one nonoverlapping symmetric arc, then multiply only if its reflected arc is distinct and completes the desired trace. Why it works: Length counts path traversal; a symmetrical equation can still retrace. Common trap: Doubling from visual symmetry without checking parameter coverage.' , difficultyDimensions: [globalLocalReasoning, proofJustification, domainCondition], difficultyEvidence: 'Combines geometric symmetry, speed invariance, and interval multiplicity.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q014, type: freeResponse, prompt: 'For a point given by negative r, show two ways to convert it to Cartesian coordinates and explain why they agree.', answer: { gradingMode: selfCheck, keyPoints: ['use negative r directly with sine cosine', 'replace by positive radius theta plus pi', 'trig signs reverse', 'same x y'] }, explanation: 'Solution: Compute $x=r\cos\theta,y=r\sin\theta$ directly, or replace it by $(-r,\theta+\pi)$. Since cosine and sine both change sign after adding $\pi$, the products agree. Why it works: These are equivalent polar descriptions. Common trap: Negating r but retaining theta.' , difficultyDimensions: [representationTransfer, identityConstruction, proofJustification], difficultyEvidence: 'Proves coordinate equivalence through two transformations and trig identities.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q015, type: freeResponse, prompt: 'Explain why an algebraic intersection angle may fail to bound the requested polar region.', answer: { gradingMode: selfCheck, keyPoints: ['may be different branches or representation', 'check trace and radius sign', 'sample angle', 'region boundary may switch elsewhere'] }, explanation: 'Solution: An equality can occur on a branch not bordering the chosen region, or the same Cartesian point may have another polar representation. Trace both curves around the candidate and compare radii on neighboring intervals. Why it works: Bounds are determined by boundary ownership, not algebraic equality alone. Common trap: Integrating between the first two roots returned by a solver.' , difficultyDimensions: [casePartition, domainCondition, representationTransfer], difficultyEvidence: 'Tests local boundary behavior around algebraic candidates and accounts for polar nonuniqueness.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q016, type: freeResponse, prompt: 'A radius formula includes $|\cos\theta|$. Explain how that changes graphing and area/length integration compared with $\cos\theta$.', answer: { gradingMode: selfCheck, keyPoints: ['partition at cosine zeros', 'no negative radius', 'reflected lobes become same-side', 'absolute value affects derivative for length'] }, explanation: 'Solution: Partition at cosine zeros. The absolute value prevents negative-r reversal, altering the traced locus; for length, differentiate piecewise or account for the absolute-value derivative. Why it works: Absolute value changes both sign structure and differentiability. Common trap: Reusing the unmodified rose interval and derivative.' , difficultyDimensions: [casePartition, domainCondition, representationTransfer], difficultyEvidence: 'Introduces nondifferentiable sign thresholds and revises both graph and calculus models.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q017, type: freeResponse, prompt: 'Describe how a polar equation can be converted to a parametric Cartesian path and when that representation is useful.', answer: { gradingMode: selfCheck, keyPoints: ['x r theta cos theta', 'y r theta sin theta', 'theta parameter', 'use for tangent or motion interpretation'] }, explanation: 'Solution: Let $x(\theta)=r(\theta)\cos\theta$ and $y(\theta)=r(\theta)\sin\theta$. This turns polar tracing into a parametric curve useful for tangents, velocity-style reasoning, or Cartesian plotting. Why it works: Polar coordinates are components of a directed radius. Common trap: Treating r as independent of theta when differentiating.' , difficultyDimensions: [representationTransfer, auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Builds a new parameterization and identifies a distinct application branch.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q018, type: freeResponse, prompt: 'Give a rigorous checklist for a polar between-curves area problem before evaluating any antiderivative.', answer: { gradingMode: selfCheck, keyPoints: ['graph or sample', 'all intersections including pole', 'choose intended region', 'outer inner or overlap', 'partition switches and trace once'] }, explanation: 'Solution: Sketch/sample both curves; find intersections including the pole; identify the intended region; compare radial order on each interval; partition at switches; confirm each piece is traced once; then use the appropriate squared-radius formula. Why it works: Every model choice occurs before integration. Common trap: Starting algebra with unverified bounds.' , difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Audits all model stages, including pole cases, order changes, and traversal multiplicity.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q019, type: freeResponse, prompt: 'Explain how a numerical plot can mislead about a tiny inner loop and what analytic evidence should replace visual guesswork.', answer: { gradingMode: selfCheck, keyPoints: ['plot resolution', 'solve r equals zero', 'sign chart', 'exact bounds and sample points'] }, explanation: 'Solution: A coarse plot can hide small loops or make crossings appear merged. Solve $r=0$, make a sign chart, sample exact angles, and derive the consecutive-zero bounds analytically. Why it works: Loop structure is controlled by exact sign changes, not pixels. Common trap: Inferring no inner loop because it is not visible at one scale.' , difficultyDimensions: [estimationOrBounds, domainCondition, proofJustification], difficultyEvidence: 'Replaces unreliable visualization with exact thresholds and evidence.' , prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q020, type: freeResponse, prompt: 'Write a complete model-validation checklist for a polar graph, area, or length solution.', answer: { gradingMode: selfCheck, keyPoints: ['coordinate conventions', 'zeros and signs', 'symmetry and trace interval', 'intersections and region order', 'correct formula and units'] }, explanation: 'Solution: Check coordinate conventions; locate zeros/sign intervals; test symmetry and minimal tracing interval; find and verify intersections; select outer/inner or overlap model; write the correct area/length integrand; check units and endpoint behavior. Why it works: Polar errors usually begin with an unverified geometric model rather than an antiderivative. Common trap: Assuming one full angular period is always one traversal.' , difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Requires a global audit across representation, tracing, bounds, and calculus setup.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-mastery] , issueSignals: [{ id: parametric-derivative-error }, { id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
