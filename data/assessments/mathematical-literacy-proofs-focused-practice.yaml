questions:
- id: q001
  type: multipleChoice
  prompt: 'A proof begins: “Let n be even. Then $n=2k$ for some integer k.” What justifies the second sentence?'
  choices:
  - id: a
    text: The definition of an even integer.
  - id: b
    text: The conclusion of the proof.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: A numerical example.
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: The converse of a theorem.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - proofJustification
  - representationTransfer
  difficultyEvidence: Maps a proof line to the definition that licenses it.
  explanation: |-
    Solution: The definition of even says that an even integer has the form $2k$ for some integer k.
    Why it works: The proof is unpacking its stated assumption, not introducing a new theorem.
    Why the other choices fail: None of B through D supplies the definitional link used by the sentence.
- id: q002
  type: multipleChoice
  prompt: 'Read this argument: “Assume x is positive. Since $x>0$, multiplying by 2 gives $2x>0$. Therefore 2x is
    positive.” What is the role of the middle sentence?'
  choices:
  - id: a
    text: It is an inference from the assumption using an order rule.
  - id: b
    text: It is a new assumption with no support.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: It is a counterexample.
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: It is the converse of the conclusion.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - proofJustification
  - representationTransfer
  difficultyEvidence: Identifies a local inference and its governing order-preservation rule.
  explanation: |-
    Solution: The middle sentence follows from $x>0$ by multiplying both sides by the positive number 2.
    Why it works: A positive multiplier preserves an inequality's direction.
    Why the other choices fail: It is supported by the assumption, is not an example, and does not reverse any conditional.
- id: q003
  type: multipleChoice
  prompt: 'A proposed proof says: “n is odd, so $n=2k+1$ for some integer k. Hence $n^2$ is even.” Which reading
    is best?'
  choices:
  - id: a
    text: The first step is justified, but the conclusion needs checking and is false for odd n.
  - id: b
    text: The conclusion follows because every square is even.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: The first step is unjustified because odd numbers cannot be written with k.
    issueSignals:
    - id: definition-error
  - id: d
    text: Checking n=1 would prove the conclusion for all odd n.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - errorDiagnosis
  - proofJustification
  difficultyEvidence: Separates a valid definitional unpacking from an unsupported, false conclusion.
  explanation: |-
    Solution: The definition of odd justifies $n=2k+1$, but $(2k+1)^2$ is odd, not even.
    Why it works: Expanding gives $4k^2+4k+1=2(2k^2+2k)+1$, which has the defining form of an odd integer.
    Why the other choices fail: B states a false rule, C rejects the correct definition, and D treats one example as a universal proof.
- id: q004
  type: multipleChoice
  prompt: A proof has reached “$a=b$.” Its next line says “therefore $a+3=b+3$.” What justification belongs in a
    proof map?
  choices:
  - id: a
    text: Add the same number to both sides of an equality.
  - id: b
    text: Every equal number is positive.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: The converse of equality.
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: A counterexample.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - proofJustification
  - errorDiagnosis
  difficultyEvidence: Names the local algebra rule that turns one equality into the next.
  explanation: |-
    Solution: Add 3 to both sides of the equality.
    Why it works: Equality is preserved when the same quantity is added to both sides.
    Why the other choices fail: B is irrelevant and false in general, while C and D do not justify this algebraic move.
- id: q005
  type: multipleChoice
  prompt: 'A student''s proof begins: ''Assume that $x^2$ is even. We want to show that $x$ is even.'' In the next
    step, they write, ''Since $x$ is even, $x=2k$ for some integer $k$.'' What is the logical flaw?'
  choices:
  - id: a
    text: 'Circular reasoning: the student assumed the conclusion they were trying to prove.'
  - id: b
    text: The student used the wrong definition of an even number.
    issueSignals:
    - id: factual-error
  - id: c
    text: The student should have assumed $x$ is odd to do a proof by contraposition.
    issueSignals:
    - id: applicationStrategy-error
  - id: d
    text: There is no flaw; this is a standard direct proof.
    issueSignals:
    - id: errorDiagnosis-failure
  answer:
    choiceId: a
  issueSignals:
  - id: errorDiagnosis-failure
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Diagnoses begging the question (circular reasoning) in an ostensibly direct proof.
  explanation: |-
    Solution: Circular reasoning: the student assumed the conclusion they were trying to prove.
    Why it works: In a direct proof of $P \implies Q$, you assume $P$ (that $x^2$ is even). The student immediately assumed $Q$ ($x$ is even) to continue their algebra, effectively assuming the very thing they were tasked with proving.
    Why the other choices fail: B is incorrect; $x=2k$ is the correct definition of an even number. C is a valid *alternative* method of proof (contrapositive), but failing to use it is not the logical flaw here. D fails to spot the circularity.
- id: q006
  type: multipleChoice
  prompt: In a mathematical proof, what does the phrase 'without loss of generality' (WLOG) signify?
  choices:
  - id: a
    text: The author is assuming one specific case because the proof for the other cases is identical due to symmetry.
  - id: b
    text: The author is ignoring specific cases that are too difficult to prove.
    issueSignals:
    - id: conventionRecognition-error
  - id: c
    text: The author is generalizing the theorem to apply to a larger class of objects than originally stated.
    issueSignals:
    - id: conventionRecognition-error
  - id: d
    text: The author is skipping the base case of an induction.
    issueSignals:
    - id: conventionRecognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: conventionRecognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Translates the standard mathematical idiom 'WLOG' into its logical purpose of eliminating
    redundant symmetric cases.
  explanation: |-
    Solution: The author is assuming one specific case because the proof for the other cases is identical due to symmetry.
    Why it works: 'WLOG' is used when there are multiple cases (e.g., $x \ge y$ or $y > x$), but the variables are completely symmetric. Proving one case effectively proves the others by simply swapping the variable names, saving space and reducing redundancy.
    Why the other choices fail: B is a logical fallacy (ignoring cases). C confuses the word 'generality' with the act of generalizing a theorem. D is completely unrelated to induction.
- id: q007
  type: multipleChoice
  prompt: A proof correctly establishes that $a^2 - ab = a - b$. In the next step, the author divides both sides
    by $(a - b)$ to conclude $a = 1$. What hidden assumption must be true for this step to be valid?
  choices:
  - id: a
    text: 'It must be true that $a \neq b$.'
  - id: b
    text: It must be true that $a$ and $b$ are integers.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: c
    text: It must be true that $a$ and $b$ are positive.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: The step is unconditionally valid according to the cancellation law.
    issueSignals:
    - id: errorDiagnosis-failure
  answer:
    choiceId: a
  issueSignals:
  - id: errorDiagnosis-failure
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Identifies a division-by-zero vulnerability disguised as an algebraic cancellation step.
  explanation: |-
    Solution: It must be true that $a \\neq b$.
    Why it works: Factoring gives $a(a-b) = 1(a-b)$. Dividing by $(a-b)$ requires $(a-b) \\neq 0$, which means $a \\neq b$. If $a=b$, the equation is $0 = 0$, and $a$ does not have to be 1.
    Why the other choices fail: B and C add arbitrary domain restrictions that don't fix the underlying algebraic vulnerability. D is a dangerous misconception; the cancellation law for multiplication only works for non-zero elements.
- id: q008
  type: multipleChoice
  prompt: What is the primary function of a 'lemma' in mathematical exposition?
  choices:
  - id: a
    text: It is a smaller, intermediate result proven primarily to be used as a stepping stone in the proof of a
      larger theorem.
  - id: b
    text: It is an unprovable assumption taken as foundational truth.
    issueSignals:
    - id: conventionRecognition-error
  - id: c
    text: It is a minor corollary that immediately follows from a major theorem.
    issueSignals:
    - id: conventionRecognition-error
  - id: d
    text: It is a definition introduced halfway through a proof.
    issueSignals:
    - id: conventionRecognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: conventionRecognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Distinguishes between lemmas, corollaries, axioms, and theorems based on their structural
    role in exposition.
  explanation: |-
    Solution: It is a smaller, intermediate result proven primarily to be used as a stepping stone in the proof of a larger theorem.
    Why it works: To prevent a main theorem's proof from becoming unreadably long, authors extract self-contained logical chunks, prove them separately as 'lemmas', and then cite them in the main proof.
    Why the other choices fail: B describes an axiom. C describes a corollary (which comes *after* a theorem, not before). D describes an ad-hoc definition, not a proved result.
- id: q009
  type: multipleChoice
  prompt: |-
    In a proof, an author defines an auxiliary quantity and proves that it lies between two expressions before citing the squeeze theorem. Why is that bounding work included?
  choices:
  - id: a
    text: It supplies the inequalities needed before the squeeze theorem can determine the desired value.
  - id: b
    text: It changes the theorem into a definition so that no justification is needed.
    issueSignals:
    - id: theorem-definition-confusion
  - id: c
    text: It proves the desired value merely because an auxiliary quantity was introduced.
    issueSignals:
    - id: auxiliary-object-overreach
  - id: d
    text: It replaces the need to verify either bound.
    issueSignals:
    - id: missing-condition-check
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - conditionChecking
  difficultyEvidence: Connects the preparatory inequalities in the source proof to the condition required for its cited theorem.
  explanation: |-
    Solution: It supplies the inequalities needed before the squeeze theorem can determine the desired value.
    Why it works: The squeeze theorem is applied only after the target quantity has been placed between appropriate bounds. The auxiliary definition is useful because it makes those bounds available.
    Why the other choices fail: B confuses a theorem with a definition. C treats naming an object as a proof. D ignores the inequalities that make the theorem applicable.
- id: q010
  type: multipleChoice
  prompt: |-
    A passage presents a definition, then states a theorem, then gives a sequence of justified steps ending in the theorem's conclusion. Which description best captures that organization?
  choices:
  - id: a
    text: The definition fixes meaning, and the proof supplies reasons that the stated theorem follows.
  - id: b
    text: The definition itself establishes the theorem without further argument.
    issueSignals:
    - id: definition-proof-confusion
  - id: c
    text: The theorem is only an example and does not need a conclusion.
    issueSignals:
    - id: theorem-example-confusion
  - id: d
    text: The sequence is valid only if every sentence is a new definition.
    issueSignals:
    - id: exposition-role-confusion
  answer:
    choiceId: a
  difficultyDimensions:
  - representationTransfer
  - argumentMapping
  difficultyEvidence: Distinguishes the semantic role of a definition from the justificatory role of a proof in the source's definition-theorem-proof sequence.
  explanation: |-
    Solution: The definition fixes meaning, and the proof supplies reasons that the stated theorem follows.
    Why it works: Definitions say what terms mean; the proof is the chain of justification for the theorem's conclusion.
    Why the other choices fail: B mistakes meaning for evidence. C denies the role of a theorem statement. D erases the distinct roles displayed in mathematical exposition.
