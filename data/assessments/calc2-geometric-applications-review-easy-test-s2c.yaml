authoring: { visualRequirement: required, visualRationale: 'Each item asks the learner to make or inspect a graph, slice, shell, or differential-arc diagram.', difficultyTier: easy }
questions:
  - { id: q001, type: symbolicResponse, prompt: 'Find the area between $y=x$ and $y=x^2$ on $0\le x\le1$.', answer: { expectedLatex: '1/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: On this interval $x\ge x^2$, so $A=\int_0^1(x-x^2)dx=[x^2/2-x^3/3]_0^1=1/6$. Why it works: Geometric area uses top minus bottom. Common trap: Reversing the order gives negative signed accumulation.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Determines curve order and evaluates the resulting polynomial integral.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q002, type: symbolicResponse, prompt: 'Find the area enclosed by $y=x$, $y=2-x$, and the y-axis.', answer: { expectedLatex: '1', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The lines meet at x=1. Area is $\int_0^1[(2-x)-x]dx=\int_0^1(2-2x)dx=1$. Why it works: The descending line is the upper boundary before the intersection. Common trap: The x=1 bound comes from the intersection, not the y-intercept.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Finds an intersection and forms a top-minus-bottom area.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q003, type: symbolicResponse, prompt: 'Use horizontal slices to find the area between $y=x^2$ and $y=x$.', answer: { expectedLatex: '1/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: For $0\le y\le1$, $x=y$ is left and $x=\sqrt y$ is right. $A=\int_0^1(\sqrt y-y)dy=2/3-1/2=1/6$. Why it works: Horizontal width is right minus left. Common trap: Do not keep x-functions in a $dy$ integral without inversion.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Inverts boundaries and changes the area representation to horizontal slices.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q004, type: symbolicResponse, prompt: 'Use disks to rotate $y=x$ on $0\le x\le2$ about the x-axis.', answer: { expectedLatex: '8\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=\pi\int_0^2x^2dx=8\pi/3$. Why it works: A vertical slice is perpendicular to the x-axis and forms a disk of radius x. Common trap: Disk area uses the squared radius.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Builds disk area and applies the power rule.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q005, type: symbolicResponse, prompt: 'Rotate the region between $y=x$ and $y=2$ on $0\le x\le2$ about the x-axis.', answer: { expectedLatex: '16\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=2$, $r=x$, so $V=\pi\int_0^2(4-x^2)dx=16\pi/3$. Why it works: The region has an inner gap to the axis, so each slice is a washer. Common trap: $(2-x)^2$ is not $R^2-r^2$.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Distinguishes washer radii and integrates their squared difference.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q006, type: symbolicResponse, prompt: 'Use shells to rotate the region under $y=4-x$ on $0\le x\le4$ about the y-axis.', answer: { expectedLatex: '64\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^4x(4-x)dx=64\pi/3$. Why it works: A vertical strip parallel to the y-axis has radius x and height $4-x$. Common trap: Shell height is a vertical distance, not a circumference.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Forms circumference times height and integrates a product.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q007, type: symbolicResponse, prompt: 'The base has width $2x$ on $0\le x\le2$. Its perpendicular cross sections are squares. Find the volume.', answer: { expectedLatex: '32/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $A(x)=(2x)^2=4x^2$, so $V=\int_0^24x^2dx=32/3$. Why it works: Volume accumulates cross-sectional area, not width. Common trap: $\int2x\,dx$ has the wrong units for volume.', difficultyDimensions: [modelOrDerivation, simplification], difficultyEvidence: 'Converts width to area and simplifies before integration.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q008, type: symbolicResponse, prompt: 'Use shells to rotate $y=x$ on $0\le x\le1$ about the y-axis.', answer: { expectedLatex: '2\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^1x(x)dx=2\pi/3$. Why it works: Radius and height both equal x. Common trap: $\pi x^2$ is a disk area, not a shell formula.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Uses a direct shell radius-height relation and integrates it.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q009, type: symbolicResponse, prompt: 'Find the arc length of $y=(2/3)x^{3/2}$ from $x=0$ to $x=3$.', answer: { expectedLatex: '14/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=\sqrt x$, so $L=\int_0^3\sqrt{1+x}dx=(2/3)[(1+x)^{3/2}]_0^3=14/3$. Why it works: Arc length accumulates $\sqrt{1+(y'')^2}dx$. Common trap: Do not omit the square root in the differential-length formula.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Differentiates a fractional power and integrates a radical.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q010, type: symbolicResponse, prompt: 'Rotate $y=3-x$ from $x=0$ to $x=3$ about the x-axis. Find the surface area.', answer: { expectedLatex: '9\pi\sqrt{2}', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=-1$, so $S=2\pi\int_0^3(3-x)\sqrt2dx=9\pi\sqrt2$. Why it works: Surface area is circumference times slanted differential length. Common trap: Omitting $\sqrt2$ treats the sloped segment as horizontal.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Builds a variable-radius surface band and uses its slope correction.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q011, type: freeResponse, prompt: 'For the area between $y=x$ and $y=x^2$, explain why vertical slices are simpler than horizontal slices.', answer: { gradingMode: selfCheck, keyPoints: ['vertical uses x minus x squared directly', 'horizontal needs inversion', 'either method gives one sixth'] }, explanation: 'Solution: Vertical slices use the supplied functions directly: $A=\int_0^1(x-x^2)dx$. Horizontal slices require $x=y$ and $x=\sqrt y$ first. Why it works: Choose the representation that makes boundaries and width simplest. Common trap: The direction of slicing is a modeling choice, not a fixed rule.', difficultyDimensions: [representationTransfer, reverseReasoning], difficultyEvidence: 'Compares direct and inverse representations before selecting a method.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q012, type: freeResponse, prompt: 'A student writes $\int_0^1(x^2-x)dx$ for the area between $y=x$ and $y=x^2$. Diagnose and repair the setup.', answer: { gradingMode: selfCheck, keyPoints: ['x is above x squared on zero to one', 'use x minus x squared', 'area is one sixth'] }, explanation: 'Solution: The order is reversed. Use $A=\int_0^1(x-x^2)dx=1/6$. Why it works: Area must be nonnegative, so the upper function is subtracted from the lower only after checking their order. Common trap: A negative integral is signed accumulation, not geometric area.', difficultyDimensions: [errorDiagnosis, modelOrDerivation], difficultyEvidence: 'Uses curve-order reasoning to repair a signed-area error.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q013, type: freeResponse, prompt: 'A student uses $\pi\int_0^2x^2dx$ to rotate the region between $y=x$ and $y=2$ about the x-axis. Explain the missing geometric feature and repair the integral.', answer: { gradingMode: selfCheck, keyPoints: ['missing outer radius two', 'washer not disk', 'pi integral four minus x squared'] }, explanation: 'Solution: The region is between two positive y-values, so it has a hole. Use washers: $V=\pi\int_0^2(2^2-x^2)dx$. Why it works: A disk is valid only when the region reaches the axis. Common trap: Using the lower boundary as the only radius ignores the outside of the region.', difficultyDimensions: [errorDiagnosis, representationTransfer], difficultyEvidence: 'Recognizes an omitted hole and repairs a disk model into a washer model.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q014, type: symbolicResponse, prompt: 'Find the arc length of $y=x$ from $x=0$ to $x=3$.', answer: { expectedLatex: '3\sqrt{2}', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=1$, so $L=\int_0^3\sqrt{2}dx=3\sqrt2$. Why it works: The slope correction is constant for a line. Common trap: The arc length is not 3 because the segment is diagonal.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Transfers a line slope into differential length and evaluates a constant integral.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q015, type: symbolicResponse, prompt: 'Rotate $y=x$ on $0\le x\le1$ about the x-axis. Find the surface area.', answer: { expectedLatex: '\pi\sqrt{2}', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $S=2\pi\int_0^1x\sqrt{1+1^2}dx=2\pi\sqrt2(1/2)=\pi\sqrt2$. Why it works: The radius is x and the slanted-length factor is $\sqrt2$. Common trap: This is surface area, not cone volume, so no squared radius appears.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Separates radius from differential arc length in a surface model.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q016, type: symbolicResponse, prompt: 'Find the area under $y=1-x$ on $0\le x\le1$.', answer: { expectedLatex: '1/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $A=\int_0^1(1-x)dx=[x-x^2/2]_0^1=1/2$. Why it works: The function remains above the x-axis on the given interval. Common trap: If a graph crosses the axis, geometric area needs a sign check or partition.', difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: 'Checks the relevant sign condition and evaluates an accumulation integral.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q017, type: symbolicResponse, prompt: 'Rotate $0\le x\le2$, $0\le y\le3$ about the y-axis using shells.', answer: { expectedLatex: '12\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^2x(3)dx=12\pi$. Why it works: Radius is x and height is the constant 3. Common trap: The rectangular region makes shells of varying circumference even though their height is constant.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Forms a shell model with a constant height and variable radius.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q018, type: symbolicResponse, prompt: 'Use disks to rotate $y=\sqrt{x}$ on $0\le x\le4$ about the x-axis.', answer: { expectedLatex: '8\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=\pi\int_0^4(\sqrt{x})^2dx=\pi\int_0^4x\,dx=8\pi$. Why it works: Squaring the radius cancels the radical. Common trap: Integrating $\sqrt{x}$ itself uses radius rather than disk area.', difficultyDimensions: [simplification, modelOrDerivation], difficultyEvidence: 'Simplifies a radical radius through the disk-area square.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q019, type: symbolicResponse, prompt: 'A solid has semicircular cross sections of diameter 2 along a length of 4. Find its volume.', answer: { expectedLatex: '2\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is 1, so one semicircle has area $\pi/2$. $V=4(\pi/2)=2\pi$. Why it works: Constant cross-section area may be multiplied by its interval length. Common trap: Diameter 2 does not mean radius 2.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Converts a diameter into a radius and applies a cross-section area formula.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
  - { id: q020, type: symbolicResponse, prompt: 'Write the surface-area integral for rotating $y=x^2$ on $0\le x\le1$ about the line $y=2$.', answer: { expectedLatex: '2\pi\int_0^1(2-x^2)\sqrt{1+4x^2}dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: Radius is $2-x^2$ and $y''=2x$, so $S=2\pi\int_0^1(2-x^2)\sqrt{1+4x^2}dx$. Why it works: The radius changes to the distance from the shifted axis; the arc-length factor remains $\sqrt{1+(y'')^2}$. Common trap: Using $x^2$ as radius assumes rotation about the x-axis.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Builds an offset-axis radius while retaining the derivative-based slope correction.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-area-formula-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }]}
