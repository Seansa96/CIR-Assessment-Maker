questions:
- id: q001
  type: selectAll
  prompt: 'Look at this list:

    `loot = ["Gold", "Silver", "Gem", "Sword"]`


    Which of the following are correct ways to get the last item (`"Sword"`)? (Select all that apply)

    '
  choices:
  - id: a
    text: '`loot[3]`'
  - id: b
    text: '`loot[-1]`'
  - id: d
    text: '`loot[4]`'
  answer:
    choiceIds:
      - a
      - b
  explanation: 'Python lists are zero-indexed, so `"Sword"` is at index 3. Python
    also supports negative indexing, where `-1` always refers to the very last element
    in the list.

    '
- id: q002
  type: multipleChoice
  prompt: 'What happens if you try to add a duplicate item to a Set?


    ```python

    unlocked_levels = {1, 2, 3}

    unlocked_levels.add(2)

    ```

    '
  choices:
  - id: a
    text: The set becomes `{1, 2, 3, 2}`.
  - id: b
    text: The set remains `{1, 2, 3}`.
  - id: c
    text: A runtime error is thrown.
  - id: d
    text: The set becomes `{1, 2, 3, True}`.
  answer:
    choiceId: b
  explanation: 'Sets automatically enforce uniqueness. If you `add()` an item that
    is already in the set, Python just ignores the command.

    '
- id: q003
  type: numericResponse
  prompt: 'Trace this dictionary code:


    ```python

    stats = {"hp": 100, "mp": 50}

    stats["hp"] = 120

    stats["str"] = 10


    print(len(stats))

    ```


    What number is printed?

    '
  answer:
    value: 3
    tolerance: 0
  explanation: 'The dictionary started with 2 keys. `stats["hp"] = 120` just updated
    an existing key. `stats["str"] = 10` added a *new* key. The dictionary now has
    3 keys (`"hp"`, `"mp"`, `"str"`).

    '
- id: q004
  type: multipleChoice
  prompt: 'Which list comprehension creates a list of doubled damage values from a
    list called `hits`?

    '
  choices:
  - id: a
    text: '`[h * 2 for h in hits]`'
  - id: b
    text: '`[for h in hits: h * 2]`'
  - id: c
    text: '`[hits * 2]`'
  - id: d
    text: '`[h in hits for h * 2]`'
  answer:
    choiceId: a
  explanation: 'The correct syntax for a list comprehension is `[expression for item
    in list]`. So, `[h * 2 for h in hits]` is correct.

    '
