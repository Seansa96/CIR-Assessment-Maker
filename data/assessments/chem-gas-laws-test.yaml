modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
  - id: q001
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A sample of gas has a volume of 5.00 L at 1.50 atm. If the pressure is increased to 3.00 atm at constant temperature, what is the new volume (in L)?
    answer:
      value: 2.50
      tolerance: 0.05
    explanation: |
      Boyle's Law: $P_1 V_1 = P_2 V_2$
      $(1.50)(5.00) = (3.00) V_2 \implies V_2 = 2.50 \text{ L}$

  - id: q002
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A balloon contains 2.50 L of air at 298 K. If the balloon is placed in a freezer at 250 K (assuming constant pressure), what is the new volume (in L)?
    answer:
      value: 2.10
      tolerance: 0.05
    explanation: |
      Charles's Law: $V_1 / T_1 = V_2 / T_2$
      $2.50 / 298 = V_2 / 250 \implies V_2 = (2.50 \times 250) / 298 = 2.097 \text{ L}$

  - id: q003
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      Under what conditions does a real gas behave most like an ideal gas?
    choices:
      - id: a
        text: High pressure and low temperature
      - id: b
        text: High pressure and high temperature
      - id: c
        text: Low pressure and high temperature
      - id: d
        text: Low pressure and low temperature
    answer:
      choiceId: c
    explanation: |
      Ideal behavior occurs when molecules are far apart (low pressure) and moving too fast for intermolecular forces to trap them (high temperature).

  - id: q004
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      What is the mass (in grams) of $CO_2$ ($M = 44.01$ g/mol) contained in a 5.00 L tank at 2.00 atm and 300 K?
      *(Use $R = 0.08206$ L·atm/mol·K)*
    answer:
      value: 17.9
      tolerance: 0.5
    explanation: |
      $n = PV / RT = (2.00 \times 5.00) / (0.08206 \times 300) = 10.0 / 24.618 = 0.4062 \text{ moles}$
      $\text{Mass} = 0.4062 \text{ mol} \times 44.01 \text{ g/mol} = 17.88 \text{ g}$

  - id: q005
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A gas mixture contains 0.400 moles of He, 0.200 moles of Ne, and 0.400 moles of Ar. If the total pressure is 5.00 atm, what is the partial pressure of Ne (in atm)?
    answer:
      value: 1.00
      tolerance: 0.05
    explanation: |
      Total moles = $0.400 + 0.200 + 0.400 = 1.000 \text{ mol}$
      Mole fraction of Ne ($\chi_{Ne}$) = $0.200 / 1.000 = 0.200$
      Partial pressure = $0.200 \times 5.00 \text{ atm} = 1.00 \text{ atm}$

  - id: q006
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      A sealed, rigid container holds a gas at 300 K and 1.0 atm. If the temperature is raised to 900 K, what happens to the pressure?
    choices:
      - id: a
        text: It drops to 0.33 atm.
      - id: b
        text: It remains 1.0 atm.
      - id: c
        text: It rises to 3.0 atm.
      - id: d
        text: It rises to 9.0 atm.
    answer:
      choiceId: c
    explanation: |
      Gay-Lussac's Law: $P \propto T$ at constant $V, n$. If $T$ triples, $P$ triples.

  - id: q007
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      What volume (in L) does 2.50 moles of an ideal gas occupy at STP?
      *(Recall that 1 mol of ideal gas at STP = 22.4 L)*
    answer:
      value: 56.0
      tolerance: 0.5
    explanation: |
      $2.50 \text{ moles} \times 22.414 \text{ L/mol} = 56.0 \text{ L}$

  - id: q008
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      An unknown gas has a density of 1.25 g/L at STP. What is its molar mass (in g/mol)?
      *(Hint: 1 mole = 22.4 L at STP)*
    answer:
      value: 28.0
      tolerance: 0.5
    explanation: |
      Since 1 mole occupies 22.4 L at STP, the mass of 1 mole (molar mass) is the mass of 22.4 L.
      $1.25 \text{ g/L} \times 22.4 \text{ L/mol} = 28.0 \text{ g/mol}$ (e.g., $N_2$ or $CO$).

  - id: q009
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A 10.0 L flask at 298 K contains a gas at a pressure of 760 torr. How many moles of gas are present?
      *(Use $R = 62.36$ L·torr/mol·K)*
    answer:
      value: 0.409
      tolerance: 0.01
    explanation: |
      $n = PV / RT = (760 \times 10.0) / (62.36 \times 298) = 7600 / 18583 = 0.409 \text{ moles}$
      (Equivalently, using atm: $(1.0 \times 10.0) / (0.08206 \times 298) = 0.409 \text{ moles}$)

  - id: q010
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      Two identical flasks contain $O_2$ and $H_2$ gas separately, both at the exact same temperature and pressure. Which of the following statements is true?
    choices:
      - id: a
        text: Both flasks contain the same number of moles of gas.
      - id: b
        text: The flask with $O_2$ contains more moles because $O_2$ is heavier.
      - id: c
        text: The flask with $H_2$ contains more moles because $H_2$ is smaller.
      - id: d
        text: The $O_2$ flask has a higher pressure because the molecules weigh more.
    answer:
      choiceId: a
    explanation: |
      Avogadro's Law states that equal volumes of gas at the same temperature and pressure contain the **same number of moles** (and molecules), regardless of the gas's mass.

  - id: q011
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A gas collected over water at 20 °C (vapor pressure of water = 17.5 torr) has a total measured pressure of 750.0 torr. What is the pressure of the dry gas (in torr)?
    answer:
      value: 732.5
      tolerance: 0.1
    explanation: |
      $P_{dry} = P_{total} - P_{water} = 750.0 - 17.5 = 732.5 \text{ torr}$.

  - id: q012
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      A sample of gas has a volume of 1.50 L at 25 °C and 1.00 atm. What will its volume (in L) be at 100 °C and 2.00 atm?
    answer:
      value: 0.939
      tolerance: 0.05
    explanation: |
      $T_1 = 298 \text{ K}$, $T_2 = 373 \text{ K}$.
      Combined gas law: $V_2 = P_1 V_1 T_2 / (T_1 P_2)$
      $V_2 = (1.00 \times 1.50 \times 373) / (298 \times 2.00) = 559.5 / 596 = 0.939 \text{ L}$.

  - id: q013
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      According to the Ideal Gas Law ($PV = nRT$), if you plot Volume ($V$) on the y-axis and Temperature ($T$) on the x-axis for a fixed amount of gas at constant pressure, what will the graph look like?
    choices:
      - id: a
        text: A straight horizontal line.
      - id: b
        text: A curved line sloping downward.
      - id: c
        text: A straight line passing through the origin (0,0) if T is in Kelvin.
      - id: d
        text: A straight line with a negative slope.
    answer:
      choiceId: c
    explanation: |
      $V = (\frac{nR}{P})T$. This is a linear equation in the form $y = mx$. The slope is positive, and it passes through the origin (0 volume at 0 Kelvin).

  - id: q014
    type: numericResponse
    skills:
      - chem-gas-laws
    prompt: |
      An evacuated 2.00 L flask is filled with $3.00 \times 10^{23}$ molecules of $N_2$ gas at 300 K. What is the pressure inside the flask in **atm**?
      *(Recall Avogadro's number $N_A = 6.022 \times 10^{23}$ and $R = 0.08206$)*
    answer:
      value: 6.13
      tolerance: 0.1
    explanation: |
      $n = \frac{3.00 \times 10^{23}}{6.022 \times 10^{23}} = 0.498 \text{ moles}$.
      $P = nRT / V = (0.498 \times 0.08206 \times 300) / 2.00 = 12.26 / 2.00 = 6.13 \text{ atm}$.

  - id: q015
    type: multipleChoice
    skills:
      - chem-gas-laws
    prompt: |
      Which of the following describes the relationship between the density of an ideal gas and its temperature (at constant pressure)?
    choices:
      - id: a
        text: Density is directly proportional to temperature.
      - id: b
        text: Density is inversely proportional to temperature.
      - id: c
        text: Density is independent of temperature.
      - id: d
        text: Density is directly proportional to the square of the temperature.
    answer:
      choiceId: b
    explanation: |
      Density $d = m/V$. By Charles's Law, as temperature increases, volume increases. If volume increases while mass remains constant, density must decrease. Thus, they are inversely proportional. (This is why hot air rises!).
