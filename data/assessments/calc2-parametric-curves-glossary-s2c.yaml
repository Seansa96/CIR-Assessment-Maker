glossary:
  introduction: 'Use this map to separate the Cartesian locus from the way a parameter traces it.'
  sections:
    - id: parametric-core
      title: Coordinates, locus, and trace
      required: true
      content: 'A parameter value produces one ordered pair. Eliminating the parameter describes a locus, while the parameter interval and direction describe the trace.'
      entries:
        - id: parameter
          term: Parameter
          definition: An independent variable, usually $t$, that determines both coordinates of a moving point.
          notation: '$x=x(t),\ y=y(t)$'
          examples: ['At a fixed t, evaluate both coordinate rules.']
          aliases: [independent variable]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed parametric curve }]
          tags: [parameter]
          drills: [{ id: parameter-drill, type: cloze, prompt: 'A value of ____ determines both coordinates of a parametric point.', answer: { expected: t, aliases: [parameter] }, explanation: 'Solution: The missing value is the parameter t. Why it works: x and y are evaluated at the same parameter value. Common trap: Giving different parameter values to x and y.' }]
        - id: locus
          term: Cartesian locus
          definition: The set of Cartesian points satisfying the equation obtained after eliminating the parameter.
          notation: '$F(x,y)=0$'
          examples: ['The locus may include points excluded by a parameter restriction.']
          aliases: [path equation]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Curve locus with a directed trace }]
          tags: [elimination]
          drills: [{ id: locus-drill, type: flashcard, prompt: 'What is the Cartesian locus?', answer: { expected: 'set of points after eliminating the parameter', aliases: ['cartesian relation', 'equation after eliminating t'] }, explanation: 'Solution: It is the point set described after eliminating t. Why it works: Elimination relates x and y directly. Common trap: It does not preserve orientation.' }]
        - id: orientation
          term: Orientation
          definition: The direction a parametric point moves as the parameter increases.
          notation: '$t\uparrow$'
          examples: ['Use nearby increasing values of t to determine arrows.']
          aliases: [trace direction]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Arrows show increasing-parameter direction }]
          tags: [direction]
          drills: [{ id: orientation-drill, type: cloze, prompt: 'The direction of travel as t increases is called ____.' , answer: { expected: orientation, aliases: ['trace direction'] }, explanation: 'Solution: The term is orientation. Why it works: It records the ordered traversal of the locus. Common trap: A Cartesian equation alone does not specify it.' }]
        - id: restriction
          term: Parameter restriction
          definition: A domain or interval condition that limits which part of the Cartesian locus is actually traced.
          notation: '$t\in I$'
          examples: ['If x equals t squared, the trace has x at least zero.']
          aliases: [trace interval]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Endpoint-labeled trace }]
          tags: [domain]
          drills: [{ id: restriction-drill, type: cloze, prompt: 'When $x=t^2$ for real t, the Cartesian trace must satisfy $x____0$.' , answer: { expected: 'greater than or equal to', aliases: ['>=', '≥'] }, explanation: 'Solution: x is greater than or equal to zero. Why it works: A real square cannot be negative. Common trap: Drawing an unrestricted line after elimination.' }]
