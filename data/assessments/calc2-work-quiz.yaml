schemaVersion: 1
id: calc2-work-quiz
title: Work Quiz
assessmentType: quiz
categoryId: calculus-2
subcategoryId: work-physics
subcategoryIds:
  - work-physics
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: numericResponse
    prompt: |
      A force of 10 lbs is required to hold a spring stretched 2 feet beyond its natural length.
      How much work (in ft-lbs) is done in stretching it from its natural length to 4 feet beyond its natural length?
    answer:
      value: 40
      tolerance: 0.1
    explanation: |
      $F = kx \implies 10 = k(2) \implies k = 5$.
      $W = \int_0^4 5x\,dx = [\frac{5x^2}{2}]_0^4 = \frac{5(16)}{2} = 40$ ft-lbs.

  - id: q002
    type: numericResponse
    prompt: |
      A 100-ft cable weighing 2 lbs/ft hangs from a winch. How much work is done (in ft-lbs) to wind up the entire cable?
    answer:
      value: 10000
      tolerance: 0.1
    explanation: |
      Consider a slice of cable of length $dy$ at distance $y$ from the top. Its weight is $2 dy$.
      The distance it must be lifted is $y$.
      $W = \int_0^{100} 2y\,dy = [y^2]_0^{100} = 100^2 - 0 = 10000$ ft-lbs.

  - id: q003
    type: multipleChoice
    prompt: |
      A cylindrical tank of radius $R$ and height $H$ is completely full of water (density $\rho$). Set up the integral for the work to pump all water to the top edge.
    choices:
      - id: a
        text: $\int_0^H \rho g \pi R^2 (H-y)\,dy$
      - id: b
        text: $\int_0^H \rho g \pi y^2 (H-y)\,dy$
      - id: c
        text: $\int_0^H \rho g \pi R^2 y\,dy$
      - id: d
        text: $\int_0^H \rho g \pi (H-y)^2 R\,dy$
    answer:
      choiceId: a
    explanation: |
      The cross-section of a cylinder is constant: $A(y) = \pi R^2$. The distance to the top is $H-y$. The integral is $\int \rho g \cdot A(y) \cdot D(y) dy$.

  - id: q004
    type: numericResponse
    prompt: |
      A tank in the shape of a cube with 2m sides is full of water. How much work (in Joules) is required to pump all water to the top edge? (Use $\rho g = 9800$ N/m$^3$).
    answer:
      value: 78400
      tolerance: 0.1
    explanation: |
      Base area $A(y) = 2 \times 2 = 4$.
      $W = \int_0^2 9800(4)(2-y)\,dy = 39200 \int_0^2 (2-y)\,dy = 39200 [2y - y^2/2]_0^2 = 39200 (4 - 2) = 39200(2) = 78400$.

  - id: q005
    type: multipleChoice
    prompt: |
      Which of the following describes why the amount of work required to pump the bottom half of a tank is much greater than the top half?
    choices:
      - id: a
        text: The water at the bottom must be lifted a greater distance $D(y)$ to reach the top.
      - id: b
        text: The water at the bottom is denser due to pressure.
      - id: c
        text: The cross-sectional area is always larger at the bottom.
      - id: d
        text: Gravity is stronger at the bottom of the tank.
    answer:
      choiceId: a
    explanation: |
      Water is incompressible (density is constant). The difference is entirely due to the lift distance $(H-y)$, which is largest when $y$ is near the bottom (0).


