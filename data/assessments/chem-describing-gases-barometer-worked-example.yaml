workedExamples:
  - id: read-mercury-barometer
    title: Read a Mercury Barometer
    problem: |
      A mercury barometer has a mercury-column height of 742 mm. Determine the atmospheric pressure in torr and atm.
    steps:
      - id: relate-column-pressure
        title: Interpret the column height
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: What pressure unit is directly represented by a 742 mm mercury column?
        instruction: |
          A mercury column height in mm is a pressure in mm Hg, which is numerically equal to torr for these conversions.
          Therefore, the atmospheric pressure is 742 torr.
      - id: convert-atm
        title: Convert to atmospheres
        type: numericResponse
        answer:
          value: 0.976
          tolerance: 0.002
        prompt: What is the pressure in atm?
        instruction: |
          $$742\ \text{torr}\left(\frac{1\ \text{atm}}{760\ \text{torr}}\right)=0.976\ \text{atm}$$
  - id: explain-barometer
    title: Explain What a Barometer Measures
    problem: Why does the height of liquid in a barometer change when atmospheric pressure changes?
    steps:
      - id: atmospheric-force
        title: Connect external pressure to column height
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Give a particle-level explanation in one or two sentences.
        instruction: |
          Atmospheric air pushes on the liquid reservoir. Greater atmospheric pressure supports a taller liquid column;
          lower atmospheric pressure supports a shorter column. The space above the liquid column has negligible pressure.
