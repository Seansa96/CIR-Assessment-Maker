questions:
  - id: eq-eigenvector-check
    type: numericResponse
    prompt: |
      Let $A = \begin{bmatrix}1 & 2 \\ 3 & 2\end{bmatrix}$ and $\vec{u} = \begin{bmatrix}2\\3\end{bmatrix}$. 
      $\vec{u}$ is an eigenvector of $A$. What is its corresponding eigenvalue $\lambda$?
    answer:
      value: 4
      tolerance: 0
    explanation: |
      Compute $A\vec{u} = \begin{bmatrix}1 & 2 \\ 3 & 2\end{bmatrix}\begin{bmatrix}2\\3\end{bmatrix} = \begin{bmatrix}1(2)+2(3) \\ 3(2)+2(3)\end{bmatrix} = \begin{bmatrix}8\\12\end{bmatrix}$.
      Notice that $\begin{bmatrix}8\\12\end{bmatrix} = 4\begin{bmatrix}2\\3\end{bmatrix}$. Therefore, the eigenvalue is $\lambda = 4$.

  - id: eq-triangular-eigenvalues
    type: multipleChoice
    prompt: |
      What are the eigenvalues of $A = \begin{bmatrix}5 & 2 & -1 \\ 0 & 3 & 7 \\ 0 & 0 & -2\end{bmatrix}$?
    choices:
      - id: c1
        text: '$0, 3, 5$'
      - id: c2
        text: '$-1, 2, 7$'
      - id: c3
        text: '$5, 3, -2$'
      - id: c4
        text: '$1, 1, 1$'
    answer:
      choiceId: c3
    explanation: |
      For an upper triangular matrix, the eigenvalues are precisely the entries on the main diagonal. The diagonal entries are 5, 3, and -2.

  - id: eq-zero-eigenvector
    type: multipleChoice
    prompt: |
      Which of the following statements about eigenvectors and the zero vector is true?
    choices:
      - id: c1
        text: 'The zero vector is an eigenvector for every matrix.'
      - id: c2
        text: 'The zero vector is never an eigenvector.'
      - id: c3
        text: 'The zero vector is an eigenvector only if $\lambda = 0$.'
      - id: c4
        text: 'The zero vector is an eigenvector only for the identity matrix.'
    answer:
      choiceId: c2
    explanation: |
      By definition, an eigenvector must be a **nonzero** vector. (If the zero vector were allowed, every scalar $\lambda$ would be an eigenvalue since $A\vec{0} = \lambda\vec{0}$ is trivially true for all $\lambda$, making the concept useless).

  - id: eq-char-eq-2x2
    type: multipleChoice
    prompt: |
      What is the characteristic polynomial of $A = \begin{bmatrix}2 & -1 \\ 1 & 4\end{bmatrix}$?
    choices:
      - id: c1
        text: '$\lambda^2 - 6\lambda + 7$'
      - id: c2
        text: '$\lambda^2 - 6\lambda + 9$'
      - id: c3
        text: '$\lambda^2 + 6\lambda - 9$'
      - id: c4
        text: '$\lambda^2 - 2\lambda + 4$'
    answer:
      choiceId: c2
    explanation: |
      $A - \lambda I = \begin{bmatrix}2-\lambda & -1 \\ 1 & 4-\lambda\end{bmatrix}$.
      $\det(A - \lambda I) = (2-\lambda)(4-\lambda) - (-1)(1)$
      $= 8 - 2\lambda - 4\lambda + \lambda^2 + 1 = \lambda^2 - 6\lambda + 9$.
