schemaVersion: 1
id: calc2-arithmetic-series-hard-test
title: Arithmetic Series Hard Test
assessmentType: test
categoryId: calculus-2
topicId: arithmetic-series
skills:
- Recover arithmetic parameters from constraints
- Evaluate weighted, nested, alternating, and modular finite sums
- Apply symmetry, inclusion-exclusion, and integer conditions
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - arithmetic-series
  - hard
  - finite-sum-reasoning
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - solve-arithmetic-series-from-separated-terms
  prompt: |
    An arithmetic sequence satisfies $a_4=13$ and $a_{11}=34$. What is
    $S_{20}$?
  choices:
  - id: a
    text: $650$
  - id: b
    text: $620$
  - id: c
    text: $680$
  - id: d
    text: $470$
  answer:
    choiceId: a
  explanation: Seven steps increase by 21, so d equals three and $a_1=4$; then $a_{20}=61$ and $S_{20}=20(4+61)/2=650$.
- id: q002
  type: multipleChoice
  skills:
  - solve-constrained-arithmetic-triples
  prompt: |
    Three consecutive terms of an increasing arithmetic sequence have sum
    $24$ and product $440$. What is the common difference?
  choices:
  - id: a
    text: $3$
  - id: b
    text: $2$
  - id: c
    text: $4$
  - id: d
    text: $5$
  answer:
    choiceId: a
  explanation: Write the terms as $8-d,8,8+d$; their product is $8(64-d^2)=440$, so $d^2=9$ and increasing
    selects d equals three.
- id: q003
  type: multipleChoice
  skills:
  - sum-multiples-with-inclusion-exclusion
  prompt: |
    What is the sum of all positive integers at most $100$ that are
    divisible by $3$ or $5$?
  choices:
  - id: a
    text: $2418$
  - id: b
    text: $2733$
  - id: c
    text: $1683$
  - id: d
    text: $3150$
  answer:
    choiceId: a
  explanation: Multiples of three sum to 1683, multiples of five to 1050, and multiples of fifteen to
    315; inclusion–exclusion gives 2418.
- id: q004
  type: multipleChoice
  skills:
  - recover-sequences-from-quadratic-partial-sums
  prompt: |
    If $S_n=3n^2-2n$, which pair $(a_1,d)$ describes the arithmetic
    sequence of terms?
  choices:
  - id: a
    text: $(1,6)$
  - id: b
    text: $(3,-2)$
  - id: c
    text: $(1,3)$
  - id: d
    text: $(5,6)$
  answer:
    choiceId: a
  explanation: $a_n=S_n-S_{n-1}=6n-5$, so the first term is one and successive terms differ by six.
- id: q005
  type: multipleChoice
  skills:
  - evaluate-weighted-arithmetic-sums
  prompt: |
    Evaluate $\sum_{k=1}^{10}k(2k-1)$.
  choices:
  - id: a
    text: $715$
  - id: b
    text: $660$
  - id: c
    text: $770$
  - id: d
    text: $385$
  answer:
    choiceId: a
  explanation: |-
    The sum is $2\sum k^2-\sum k=2(385)-55=715$.
- id: q006
  type: multipleChoice
  skills:
  - evaluate-alternating-finite-arithmetic-sums
  prompt: |
    Find $1-4+7-10+\cdots+97-100$.
  choices:
  - id: a
    text: $-51$
  - id: b
    text: $-50$
  - id: c
    text: $51$
  - id: d
    text: $-100$
  answer:
    choiceId: a
  explanation: There are thirty-four terms, forming seventeen pairs, each equal to negative three; the
    sum is negative fifty-one.
- id: q007
  type: multipleChoice
  skills:
  - solve-integer-term-count-constraints
  prompt: |
    The sum $1+2+\cdots+n$ is $1275$. What is n?
  choices:
  - id: a
    text: $50$
  - id: b
    text: $49$
  - id: c
    text: $51$
  - id: d
    text: $25$
  answer:
    choiceId: a
  explanation: Solve $n(n+1)/2=1275$, or $n^2+n-2550=0$, whose positive root is fifty.
- id: q008
  type: multipleChoice
  skills:
  - reason-about-arithmetic-subsequences
  prompt: |
    If $(a_n)$ is arithmetic with $a_1=2$ and $d=5$, what is the common
    difference of $(a_{3n})_{n\ge1}$?
  choices:
  - id: a
    text: $15$
  - id: b
    text: $5$
  - id: c
    text: $10$
  - id: d
    text: $6$
  answer:
    choiceId: a
  explanation: Increasing n by one advances the original index by three positions, accumulating three
    differences of five.
- id: q009
  type: multipleChoice
  skills:
  - use-equal-sum-segments
  prompt: |
    The integers $1,2,\ldots,20$ are split after k so the first block has
    the same sum as the second. Which statement is correct?
  choices:
  - id: a
    text: No integer k works.
  - id: b
    text: $k=14$
  - id: c
    text: $k=15$
  - id: d
    text: $k=10$
  answer:
    choiceId: b
  explanation: |-
    The total is 210, so one block needs sum 105; $14\cdot15/2=105$, hence k equals fourteen.
- id: q010
  type: multipleChoice
  skills:
  - compare-arithmetic-series-averages
  prompt: |
    A 30-term arithmetic series has both its first and last terms increased
    by $4$, with terms remaining arithmetic. How much does its sum increase?
  choices:
  - id: a
    text: $120$
  - id: b
    text: $60$
  - id: c
    text: $240$
  - id: d
    text: $8$
  answer:
    choiceId: a
  explanation: Increasing both endpoints by four increases their average by four, so thirty terms add
    120.
- id: q011
  type: multipleChoice
  skills:
  - solve-digit-arithmetic-progressions
  prompt: |
    The digits of a three-digit number form an increasing arithmetic
    sequence. Their sum is $15$, and reversing the digits increases the
    number by $396$. What is the number?
  choices:
  - id: a
    text: $357$
  - id: b
    text: $246$
  - id: c
    text: $159$
  - id: d
    text: $468$
  answer:
    choiceId: a
  explanation: Write the digits as $5-d,5,5+d$; reversal changes the number by $198d$, so d equals two
    and the number is 357.
- id: q012
  type: multipleChoice
  skills:
  - sum-nested-arithmetic-series
  prompt: |
    Evaluate $\sum_{k=1}^{10}(1+2+\cdots+k)$.
  choices:
  - id: a
    text: $220$
  - id: b
    text: $385$
  - id: c
    text: $55$
  - id: d
    text: $275$
  answer:
    choiceId: a
  explanation: |-
    The kth inner sum is $k(k+1)/2$, so the total is one half of $\sum k^2+\sum k=(385+55)/2=220$.
- id: q013
  type: multipleChoice
  skills:
  - derive-sums-from-average-constraints
  prompt: |
    A 17-term arithmetic sequence has middle term $42$. What is the sum of
    all 17 terms?
  choices:
  - id: a
    text: $714$
  - id: b
    text: $672$
  - id: c
    text: $756$
  - id: d
    text: Cannot be determined
  answer:
    choiceId: a
  explanation: |-
    The middle term equals the average of all terms, so the sum is $17\cdot42=714$.
- id: q014
  type: multipleChoice
  skills:
  - analyze-modular-arithmetic-progressions
  prompt: |
    Find the sum of integers $n$ with $1\le n\le200$ and
    $n\equiv2\pmod7$.
  choices:
  - id: a
    text: $2813$
  - id: b
    text: $2900$
  - id: c
    text: $2716$
  - id: d
    text: $2871$
  answer:
    choiceId: b
  explanation: The progression is 2 through 198 with 29 terms, so its sum is $29(2+198)/2=2900$.
- id: q015
  type: multipleChoice
  skills:
  - prove-equal-distance-term-identities
  prompt: |
    In any arithmetic sequence, which identity holds whenever
    $i+j=r+s$?
  choices:
  - id: a
    text: $a_i+a_j=a_r+a_s$
  - id: b
    text: $a_ia_j=a_ra_s$
  - id: c
    text: $a_i-a_j=a_r-a_s$
  - id: d
    text: $a_i/a_j=a_r/a_s$
  answer:
    choiceId: a
  explanation: Using $a_k=a_1+(k-1)d$, each pair sum depends only on the sum of its indices.
attemptQuestionCount: 15
