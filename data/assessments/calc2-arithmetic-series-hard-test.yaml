- id: q001
  type: multipleChoice
  skills:
  - solve-arithmetic-series-from-separated-terms
  prompt: 'An arithmetic sequence satisfies $a_4=13$ and $a_{11}=34$. What is

    $S_{20}$?

    '
  choices:
  - id: a
    text: $650$
  - id: b
    text: $620$
  - id: c
    text: $680$
  - id: d
    text: $470$
  answer:
    choiceId: a
  explanation: 'Solution: Seven steps increase by 21, so d equals three and $a_1=4$; then $a_{20}=61$ and $S_{20}=20(4+61)/2=650$. Therefore the answer is $650$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


    Why the other choices fail: $620$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $680$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $470$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.'
- id: q002
  type: multipleChoice
  skills:
  - solve-constrained-arithmetic-triples
  prompt: 'Three consecutive terms of an increasing arithmetic sequence have sum

    $24$ and product $440$. What is the common difference?

    '
  choices:
  - id: a
    text: $3$
  - id: b
    text: $2$
  - id: c
    text: $4$
  - id: d
    text: $5$
  answer:
    choiceId: a
  explanation: 'Solution: Write the terms as $8-d,8,8+d$; their product is $8(64-d^2)=440$, so $d^2=9$ and increasing selects d equals three. Therefore the answer is $3$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


