- id: q003
  type: multipleChoice
  skills:
  - sum-multiples-with-inclusion-exclusion
  prompt: 'What is the sum of all positive integers at most $100$ that are

    divisible by $3$ or $5$?

    '
  choices:
  - id: a
    text: $2418$
  - id: b
    text: $2733$
  - id: c
    text: $1683$
  - id: d
    text: $3150$
  answer:
    choiceId: a
  explanation: |-
    Solution: Multiples of three sum to 1683, multiples of five to 1050, and multiples of fifteen to 315; inclusion–exclusion gives 2418. Therefore the answer is $2418$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

