- id: q010
  type: freeResponse
  prompt: What distinguishes an implication from its converse during proof reading?
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - The implication preserves hypothesis-to-conclusion direction; the converse swaps them.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: The implication preserves hypothesis-to-conclusion direction; the converse swaps them.
    Why it works: Swapping direction creates a different statement.
- id: q011
  type: freeResponse
  prompt: A statement has a variable but begins “For every real x.” Is it open?
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - No; the quantifier binds x and gives a truth-valued claim.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: No; the quantifier binds x and gives a truth-valued claim.
    Why it works: Binding removes the free-variable dependence.
