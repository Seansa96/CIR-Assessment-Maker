  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: No; it merely restates an available assumption.
    Why it works: A proof conclusion must follow from a justified chain, not a relabeling.
