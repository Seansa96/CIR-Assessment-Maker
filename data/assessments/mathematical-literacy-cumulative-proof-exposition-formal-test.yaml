questions:
- id: q001
  type: freeResponse
  prompt: A definition says an integer is odd when it equals $2k+1$ for an integer k. What form may be written after
    assuming a is odd?
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - $a=2m+1$ for some integer m.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: $a=2m+1$ for some integer m.
    Why it works: The stated definition supplies the form and preserves the integer parameter.
- id: q002
  type: freeResponse
  prompt: After writing $a=2m+1$ and $b=2n+1$, what form demonstrates that $a+b$ is even?
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - $a+b=2(m+n+1)$.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: $a+b=2(m+n+1)$.
    Why it works: Factoring 2 exhibits the definition of even.
- id: q003
  type: freeResponse
  prompt: A proof starts by assuming the conclusion of “if P then Q” is false. What must it establish next?
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - That the hypothesis is false.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: That the hypothesis is false.
    Why it works: This is the target direction of a contrapositive argument.
- id: q004
  type: freeResponse
  prompt: Why does a proof by contrapositive establish the original conditional?
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - A conditional and its contrapositive have the same truth value.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: A conditional and its contrapositive have the same truth value.
    Why it works: The logical equivalence licenses the proof form.
