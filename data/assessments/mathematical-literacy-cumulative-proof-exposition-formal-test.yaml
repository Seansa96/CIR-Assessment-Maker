  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - It means Q implies P, so the order differs from “if P, then Q.”
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
  - ml-logic
  extensionObjectiveIds:
  - ml-review
  difficultyEvidence: Requires transferring a reading convention across notation, logic, and proof context while
    checking a stated condition.
  explanation: |-
    Solution: It means Q implies P, so the order differs from “if P, then Q.”
    Why it works: Language can encode a conditional direction opposite its visual order.
- id: q017
  type: freeResponse
  prompt: A proof ends with a statement already known as a hypothesis. Is that a new theorem conclusion?
  instruction: Give the requested reading judgment and name the condition, definition, or inference that licenses
    it.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - No; it merely restates an available assumption.
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  prerequisiteObjectiveIds:
  - ml-notation
