  prompt: |
    Find
    $$\lim_{n\to\infty}\prod_{k=2}^{n}\left(1-\frac1{k^2}\right).$$
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $0$
  - id: c
    text: $1$
  - id: d
    text: $2$
  answer:
    choiceId: a
  explanation: |-
    Solution: Factoring gives products of $(k-1)/k$ and $(k+1)/k$, whose finite product is $(n+1)/(2n)$. Therefore the answer is $1/2$.

    Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

    Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

    Why the other choices fail: $0$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $1$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $2$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
