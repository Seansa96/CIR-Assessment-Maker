  prompt: |
    Let $a_1=1$ and $a_{n+1}=1/(2+a_n)$. What is $\lim a_n$?
  choices:
  - id: a
    text: |-
      $\sqrt2-1$
  - id: b
    text: |-
      $-\sqrt2-1$
  - id: c
    text: $1/2$
  - id: d
    text: The limit does not exist.
  answer:
    choiceId: a
  explanation: |-
    Solution: The map sends $[0,1]$ into itself and has derivative magnitude at most $1/4$ there, so iterates converge to the positive solution of $L=1/(2+L)$. Therefore the answer is $\sqrt2-1$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $-\sqrt2-1$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $1/2$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The limit does not exist. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
