questions:
  - id: trace-bubble-up
    type: multipleChoice
    difficultyDimensions: ["Algorithm tracing", "Tree restructuring"]
    subjectDifficultyTags: ["Data-Structures-Heaps"]
    prerequisiteObjectiveIds: ["obj-dsa-heaps-01"]
    prompt: |
      Consider a valid **Min-Heap** represented as a 0-indexed array: `[5, 10, 15, 20, 25]`
      (Root is 5. Children of 5 are 10 and 15. Children of 10 are 20 and 25.)

      You insert the value **8** into this heap. 
      According to the standard heap insertion algorithm (append to the end, then bubble up), what will be the final array representation of the heap after the insertion is fully resolved?
    choiceOptions:
      - id: "opt-correct"
        text: "`[5, 10, 8, 20, 25, 15]`"
      - id: "opt-wrong1"
        text: "`[5, 8, 15, 20, 25, 10]`"
        issueSignals: ["bubbled-wrong-branch"]
      - id: "opt-wrong2"
        text: "`[8, 10, 15, 20, 25, 5]`"
        issueSignals: ["misunderstood-min-heap"]
      - id: "opt-wrong3"
        text: "`[5, 10, 15, 20, 25, 8]`"
        issueSignals: ["forgot-bubble-up"]
    answer:
      gradingMode: automatic
      correctChoiceId: "opt-correct"
    explanation: |
      Solution:
      The correct array is `[5, 10, 8, 20, 25, 15]`.

      Why it works:
      1. **Append:** We first append 8 to the end of the array, so it becomes `[5, 10, 15, 20, 25, 8]`. 
      2. **Identify Parent:** 8 is at index 5. Its parent is at index `(5-1)//2 = 2`. The value at index 2 is 15.
      3. **Compare & Swap:** Because 8 is less than its parent 15 (violating the Min-Heap property), we swap them. The array becomes `[5, 10, 8, 20, 25, 15]`.
      4. **Continue:** 8 is now at index 2. Its new parent is at index `(2-1)//2 = 0`. The value at index 0 is 5.
      5. **Stop:** 8 is not less than 5, so the heap property is satisfied. The bubble-up process stops.

      Why the other choices fail:
      - Appending to the end makes 8 a child of 15, not 10, so it interacts with the right branch.
      - If you skip the bubble-up process, the heap is left invalid.
