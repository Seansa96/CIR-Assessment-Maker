questions:
- id: trace-bubble-up
  type: multipleChoice
  difficultyDimensions:
  - Algorithm tracing
  - Tree restructuring
  subjectDifficultyTags:
  - Data-Structures-Heaps
  prerequisiteObjectiveIds:
  - obj-dsa-heaps-01
  prompt: "Consider a valid **Min-Heap** represented as a 0-indexed array: `[5, 10, 15, 20, 25]`\n(Root\
    \ is 5. Children of 5 are 10 and 15. Children of 10 are 20 and 25.)\n\nYou insert the value **8**\
    \ into this heap. \nAccording to the standard heap insertion algorithm (append to the end, then bubble\
    \ up), what will be the final array representation of the heap after the insertion is fully resolved?\n"
  choices:
  - id: opt-correct
    text: '`[5, 10, 8, 20, 25, 15]`'
  - id: opt-wrong1
    text: '`[5, 8, 15, 20, 25, 10]`'
    issueSignals:
    - id: bubbled-wrong-branch
      domains: []
  - id: opt-wrong2
    text: '`[8, 10, 15, 20, 25, 5]`'
    issueSignals:
    - id: misunderstood-min-heap
      domains: []
  - id: opt-wrong3
    text: '`[5, 10, 15, 20, 25, 8]`'
    issueSignals:
    - id: forgot-bubble-up
      domains: []
  answer:
    gradingMode: automatic
    choiceId: opt-correct
  explanation: "Solution:\nThe correct array is `[5, 10, 8, 20, 25, 15]`.\n\nWhy it works:\n1. **Append:**\
    \ We first append 8 to the end of the array, so it becomes `[5, 10, 15, 20, 25, 8]`. \n2. **Identify\
    \ Parent:** 8 is at index 5. Its parent is at index `(5-1)//2 = 2`. The value at index 2 is 15.\n\
    3. **Compare & Swap:** Because 8 is less than its parent 15 (violating the Min-Heap property), we\
    \ swap them. The array becomes `[5, 10, 8, 20, 25, 15]`.\n4. **Continue:** 8 is now at index 2. Its\
    \ new parent is at index `(2-1)//2 = 0`. The value at index 0 is 5.\n5. **Stop:** 8 is not less than\
    \ 5, so the heap property is satisfied. The bubble-up process stops.\n\nWhy the other choices fail:\n\
    - Appending to the end makes 8 a child of 15, not 10, so it interacts with the right branch.\n- If\
    \ you skip the bubble-up process, the heap is left invalid.\n"
