workedExamples:
  - id: we1
    title: Calculating Acceleration
    difficultyDimensions: []
    context: |
      A block of mass $m$ is placed on an inclined plane that makes an angle $\theta$ with the horizontal. The coefficient of kinetic friction between the block and the plane is $\mu_k$. The block is released from rest and begins to slide down the plane.

      Our goal is to find an expression for the acceleration of the block $a$ down the incline in terms of $g$, $\theta$, and $\mu_k$.
    steps:
      - id: step1
        title: Draw the Free Body Diagram and Assign Axes
        instruction: |
          First, identify all the forces acting on the block:
          - Gravity ($F_g = mg$) pointing straight down.
          - Normal force ($F_N$) pointing perpendicular to the surface.
          - Kinetic friction ($f_k$) pointing up the incline, opposing the sliding motion.

          Next, set up a coordinate system tilted to match the incline. Let the $x$-axis run parallel to the incline (positive pointing down) and the $y$-axis run perpendicular to it (positive pointing away from the surface).
        type: multipleChoice
        skills:
        - free-body-diagram
        - coordinate-axes
        prompt: 'When we tilt the coordinate axes, how do we decompose the gravitational force $F_g$?'
        choices:
          - id: a
            text: 'The $x$-component is $mg \cos(\theta)$ and the $y$-component is $mg \sin(\theta)$.'
          - id: b
            text: 'The $x$-component is $mg \sin(\theta)$ and the $y$-component is $-mg \cos(\theta)$.'
          - id: c
            text: 'The $x$-component is $mg$ and the $y$-component is $0$.'
        answer:
          choiceId: b
        explanation: |
          Solution:
          The $x$-component (parallel to the incline) is $mg \sin(\theta)$ and the $y$-component (perpendicular to the incline, pointing into the surface) is $-mg \cos(\theta)$.

          Why it works:
          Using trigonometry on the triangle formed by the gravitational force vector, the angle $\theta$ of the incline appears between the straight-down vector and the negative $y$-axis. The opposite side is the $x$-component ($\sin$) and the adjacent side is the $y$-component ($\cos$).

          Why the other choices fail:
          - $mg \cos(\theta)$ and $mg \sin(\theta)$ is a common error where the trigonometric functions are swapped.
          - $mg$ and $0$ implies the axes were not tilted and are still horizontal/vertical.
      - id: step2
        title: Apply Newton's Second Law to the Perpendicular Axis
        instruction: |
          Since the block does not accelerate into or out of the incline, the net force in the $y$-direction must be zero:

          $$
          \Sigma F_y = ma_y = 0
          $$

          The forces in the $y$-direction are the normal force ($F_N$) and the perpendicular component of gravity ($-mg \cos(\theta)$).
        type: symbolicResponse
        skills:
        - newtons-laws-dynamics
        - normal-force
        prompt: 'Write an expression for the normal force $F_N$.'
        answer:
          gradingMode: auto
          expectedLatex: 'm*g*\cos(\theta)'
          equivalenceMode: expression
          tolerance: 0
        explanation: |
          Solution:
          $$
          \Sigma F_y = F_N - mg \cos(\theta) = 0
          $$
          Therefore, $F_N = mg \cos(\theta)$.

          Why it works:
          The forces perpendicular to the incline must balance perfectly because the block's motion is restricted entirely to the parallel axis.
      - id: step3
        title: Apply Newton's Second Law to the Parallel Axis
        instruction: |
          Now, we apply Newton's Second Law to the $x$-direction (parallel to the incline). The block accelerates in this direction.

          $$
          \Sigma F_x = ma_x
          $$

          The forces in the positive $x$-direction (down the incline) is the parallel component of gravity. The force in the negative $x$-direction is kinetic friction ($f_k = \mu_k F_N$).
        type: symbolicResponse
        skills:
        - newtons-laws-dynamics
        - friction-applications
        prompt: 'Substitute the expression for $F_N$ into friction, and write an equation for the net force $\Sigma F_x$.'
        answer:
          gradingMode: auto
          expectedLatex: 'm*g*\sin(\theta) - \mu_k*m*g*\cos(\theta)'
          equivalenceMode: expression
          tolerance: 0
        explanation: |
          Solution:
          The forces are gravity pulling down the incline ($mg \sin(\theta)$) and friction pushing up ($-f_k$).
          Substitute $f_k = \mu_k F_N$ and $F_N = mg \cos(\theta)$ to get:
          $$
          \Sigma F_x = mg \sin(\theta) - \mu_k mg \cos(\theta)
          $$

          Why it works:
          We are summing all the forces acting parallel to the surface to find the net force that causes the acceleration.
      - id: step4
        title: Solve for Acceleration
        instruction: |
          We know that $\Sigma F_x = ma$. Let's set our net force expression equal to $ma$ and solve for $a$.

          $$
          mg \sin(\theta) - \mu_k mg \cos(\theta) = ma
          $$
        type: symbolicResponse
        skills:
        - kinematics-1d
        - newtons-laws-dynamics
        prompt: 'Solve for the acceleration $a$.'
        answer:
          gradingMode: auto
          expectedLatex: 'g*(\sin(\theta) - \mu_k*\cos(\theta))'
          equivalenceMode: expression
          tolerance: 0
        explanation: |
          Solution:
          Divide the entire equation by $m$:
          $$
          a = g(\sin(\theta) - \mu_k \cos(\theta))
          $$

          Why it works:
          The mass $m$ is present in every term, so it cancels out. This means the acceleration is independent of the block's mass.

  - id: incline-we002
    title: Pulling a Crate Up an Incline
    context: 'A 10 kg crate is pulled up a frictionless $30^\circ$ incline by a 100 N force parallel to the surface. Find its acceleration.'
    steps:
      - id: iwe5
        title: Find the downslope weight component
        instruction: Resolve gravity parallel to the incline.
        type: numericResponse
        prompt: 'What is the downslope component of weight in newtons?'
        answer: { value: 49, tolerance: 0.01 }
        explanation: 'Solution: $mg\sin30^\circ=(10)(9.8)(0.5)=49$ N.\n\nWhy it works: The parallel component of gravity is $mg\sin\theta$.'
      - id: iwe6
        title: Calculate acceleration
        instruction: Sum forces up the incline and apply Newton''s second law.
        type: numericResponse
        prompt: 'What is the acceleration up the incline in m/s$^2$?'
        answer: { value: 5.1, tolerance: 0.01 }
        explanation: 'Solution: $F_{net}=100-49=51$ N, so $a=51/10=5.1$ m/s$^2$.\n\nWhy it works: The pull exceeds the downslope gravity component.'
