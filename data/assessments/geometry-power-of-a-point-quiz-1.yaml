questions:
- id: q-power-of-a-point-quiz-1
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 6 and 3. The segments of the second are 5 and x. Find x.'
  choices:
  - id: choice-A
    text: '1.8'
  - id: choice-B
    text: '3.6'
  - id: choice-C
    text: '90'
  answer:
    choiceId: choice-B
    explanation: 'Power of a point: 6 * 3 = 5 * x, so x = 18/5 = 3.6.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-2
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 5 and 4. The segments of the second are 6 and x. Find x.'
  choices:
  - id: choice-A
    text: '120'
  - id: choice-B
    text: '1.5'
  - id: choice-C
    text: '3.3'
  answer:
    choiceId: choice-C
    explanation: 'Power of a point: 5 * 4 = 6 * x, so x = 20/6 = 3.3.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-3
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 3 and 3. The segments of the second are 5 and x. Find x.'
  choices:
  - id: choice-A
    text: '45'
  - id: choice-B
    text: '1.2'
  - id: choice-C
    text: '1.8'
  answer:
    choiceId: choice-C
    explanation: 'Power of a point: 3 * 3 = 5 * x, so x = 9/5 = 1.8.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-4
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 6 and 4. The segments of the second are 3 and x. Find x.'
  choices:
  - id: choice-A
    text: '72'
  - id: choice-B
    text: '3.3'
  - id: choice-C
    text: '8'
  answer:
    choiceId: choice-C
    explanation: 'Power of a point: 6 * 4 = 3 * x, so x = 24/3 = 8.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-5
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 6 and 4. The segments of the second are 2 and x. Find x.'
  choices:
  - id: choice-A
    text: '12'
  - id: choice-B
    text: '5.0'
  - id: choice-C
    text: '48'
  answer:
    choiceId: choice-A
    explanation: 'Power of a point: 6 * 4 = 2 * x, so x = 24/2 = 12.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-6
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 2 and 3. The segments of the second are 4 and x. Find x.'
  choices:
  - id: choice-A
    text: '1.5'
  - id: choice-B
    text: '1.2'
  - id: choice-C
    text: '24'
  answer:
    choiceId: choice-A
    explanation: 'Power of a point: 2 * 3 = 4 * x, so x = 6/4 = 1.5.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-7
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 6 and 4. The segments of the second are 6 and x. Find x.'
  choices:
  - id: choice-A
    text: '144'
  - id: choice-B
    text: '1.7'
  - id: choice-C
    text: '4'
  answer:
    choiceId: choice-C
    explanation: 'Power of a point: 6 * 4 = 6 * x, so x = 24/6 = 4.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-8
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 2 and 2. The segments of the second are 4 and x. Find x.'
  choices:
  - id: choice-A
    text: '1'
  - id: choice-B
    text: '1.0'
  - id: choice-C
    text: '16'
  answer:
    choiceId: choice-A
    explanation: 'Power of a point: 2 * 2 = 4 * x, so x = 4/4 = 1.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-9
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The segments of the first chord are 5 and 6. The segments of the second are 6 and x. Find x.'
  choices:
  - id: choice-A
    text: '180'
  - id: choice-B
    text: '1.8'
  - id: choice-C
    text: '5'
  answer:
    choiceId: choice-C
    explanation: 'Power of a point: 5 * 6 = 6 * x, so x = 30/6 = 5.'
  skills:
  - geometry-power-of-a-point
- id: q-power-of-a-point-quiz-graph-10
  type: graphingResponse
  prompt: 'Draw a secant line passing through the external point (-5, 0) and intersecting a circle at (-2, 0) and (2, 0).'
  answer:
    graphingAnswer:
      features:
        - type: ShapeType
          stringValue: line
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: -5.0, y: 0.0 }
          tolerance: 0.2
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: 2.0, y: 0.0 }
          tolerance: 0.2
          weight: 1.0
  explanation: 'The secant line lies on the x-axis, passing through those points.'
  skills:
  - geometry-power-of-a-point
