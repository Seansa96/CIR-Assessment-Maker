schemaVersion: 1
id: ede-ch01-modeling-depth-concept-lesson
title: 'Modeling Depth: From Assumptions to Differential Equations'
assessmentType: conceptLesson
categoryId: elementary-differential-equations-bvp
topicId: ede-ch01-introduction
modeDefault: practice
randomizeQuestions: false
skills:
- ede-ch01-introduction
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - elementary-differential-equations-bvp
  - ede-ch01-introduction
  - s2c-approved
  - supplemental
lesson:
  introduction: A model links a stated mechanism to a rate law, then checks units, assumptions, and useful limits.
  sections:
  - id: s1
    title: The modeling cycle
    required: true
    content: Name the state, state assumptions, translate mechanisms into rates, attach data, analyze the result,
      and compare predictions with observations. A mismatch calls for revised assumptions, not silent parameter
      changes.
    media:
    - type: image
      src: /media/ede/ch01-model-assumption-cycle.svg
      alt: Cycle from state and units through assumptions, a rate law, data comparison, and model revision.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q001
      type: multipleChoice
      prompt: A cooling model repeatedly underpredicts measured temperatures. What is the scientifically appropriate
        next step?
      skills:
      - ede-ch01-introduction-model-types-assumptions
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-model-types-assumptions
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: A persistent model-data mismatch is evidence that assumptions or parameters need review.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Reexamine assumptions such as constant ambient temperature
      - id: b
        text: Declare the measurements impossible
        issueSignals:
        - id: ede-model-assumption-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Delete the initial condition
        issueSignals:
        - id: ede-model-assumption-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Change temperature units without conversion
        issueSignals:
        - id: ede-model-assumption-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: State variables, parameters, and units
    required: true
    content: A state variable changes; a parameter is held fixed within the model. Every term in an equation for
      $Q'$ must have the same amount-per-time units.
    media: []
    check:
      id: q002
      type: numericResponse
      prompt: Water enters at $5$ L/min carrying $0.8$ g/L of dye. Find the dye input rate in g/min.
      skills:
      - ede-ch01-introduction-model-rate-laws
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch01-introduction-model-rate-laws
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $5(0.8)=4$ g/min.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 4.0
        tolerance: 0.0001
  - id: s3
    title: Proportional and limited growth
    required: true
    content: The Malthus law $P'=aP$ assumes a constant per-capita rate. The logistic law $P'=aP(1-P/K)$ introduces
      a limiting level $K$ and reverses the sign above it.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: For $P'=0.3P(1-P/500)$ and $P=600$, what does the model predict?
      skills:
      - ede-ch01-introduction-model-rate-laws
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-model-rate-laws
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $1-600/500<0$, so the rate is negative.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $P$ decreases
      - id: b
        text: $P$ increases exponentially
        issueSignals:
        - id: ede-model-assumption-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $P$ is an equilibrium
        issueSignals:
        - id: ede-model-assumption-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: The derivative has population units
        issueSignals:
        - id: ede-model-assumption-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Balance laws
    required: true
    content: For an amount in a compartment, accumulation equals total inflow minus total outflow. Concentration
      must be expressed as amount divided by the current volume before multiplying by a volumetric flow.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: A well-mixed tank contains $S$ grams in $100$ L and drains at $2$ L/min. What is the salt outflow
        rate?
      skills:
      - ede-ch01-introduction-model-rate-laws
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-model-rate-laws
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The concentration is $S/100$ g/L, so outflow is $2(S/100)=S/50$ g/min.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $S/50$ g/min
      - id: b
        text: $2S$ g/min
        issueSignals:
        - id: ede-unit-consistency-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $S/100$ g/min
        issueSignals:
        - id: ede-unit-consistency-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $50/S$ g/min
        issueSignals:
        - id: ede-unit-consistency-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: Order and required initial data
    required: true
    content: A position model involving acceleration is second order. A typical second-order IVP specifies position
      and velocity at one time, while a first-order scalar IVP specifies one state value.
    media: []
    check:
      id: q005
      type: multipleChoice
      prompt: Which data normally complete $y''=-g$ as an IVP at $t=0$?
      skills:
      - ede-ch01-introduction-model-types-assumptions
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-model-types-assumptions
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: A second-order equation normally requires two initial conditions through the first derivative.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y(0)$ and $y'(0)$
      - id: b
        text: $y(0)$ only
        issueSignals:
        - id: ede-equation-type-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y''(0)$ only
        issueSignals:
        - id: ede-equation-type-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y(0),y'(0),y''(0)$
        issueSignals:
        - id: ede-equation-type-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Scalar equations, systems, ODEs, and PDEs
    required: true
    content: An ODE has ordinary derivatives of functions of one independent variable. A system contains multiple
      coupled unknown functions. A PDE contains partial derivatives of a function of several independent variables.
    media:
    - type: image
      src: /media/ede/ch01-equation-type-atlas.svg
      alt: Comparison of scalar, higher-order, coupled-system, and partial differential equation structures.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q006
      type: multipleChoice
      prompt: How should $P'=P(1-P-Q)$ and $Q'=Q(2-P-Q)$ be classified?
      skills:
      - ede-ch01-introduction-model-types-assumptions
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-model-types-assumptions
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Two time-dependent states are governed by two coupled first-order ordinary differential equations.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: A coupled system of first-order ODEs
      - id: b
        text: One second-order ODE
        issueSignals:
        - id: ede-equation-type-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: A PDE
        issueSignals:
        - id: ede-equation-type-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: An algebraic equation
        issueSignals:
        - id: ede-equation-type-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
