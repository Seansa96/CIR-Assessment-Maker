- id: q004
  title: Explain Containers versus VMs
  type: freeResponse
  prompt: 'In a short answer, explain why **Containers versus VMs** matters in Virtualization and the Cloud.

    '
  answer:
    expected: 'Containers share a kernel while virtual machines generally run separate guest OS kernels. A complete answer
      should also note that containers are lighter but have a different isolation boundary.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Containers versus VMs
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Virtualization and the Cloud. The key is to connect the term to what the OS controls or protects.

    '
