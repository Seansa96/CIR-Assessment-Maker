questions:
- id: q001
  title: Recognize Virtualization goal
  type: multipleChoice
  prompt: 'Which statement best describes **Virtualization goal** in operating systems?

    '
  choices:
  - id: a
    text: Virtualization lets multiple isolated environments share physical hardware while appearing to have their own machine.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'Virtualization lets multiple isolated environments share physical hardware while appearing to have their own
    machine. The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
