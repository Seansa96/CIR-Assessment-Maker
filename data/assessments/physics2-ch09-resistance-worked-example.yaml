workedExamples:
- id: we2
  title: Resistance of a Wire
  steps:
  - id: s1
    prompt: Calculate area and apply the resistance formula.
    explanation: 'Solution:

      1) Radius $r = d/2 = 1.0\text{ mm} = 1.0 \times 10^{-3}\text{ m}$.

      2) Area $A = \pi r^2 = \pi (1.0 \times 10^{-3})^2 = \pi \times 10^{-6}\text{ m}^2 \approx 3.14 \times
      10^{-6}\text{ m}^2$.

      3) $R = \rho \frac{L}{A} = (2.65 \times 10^{-8}) \frac{50}{\pi \times 10^{-6}}$.

      4) $R = \frac{132.5 \times 10^{-8}}{3.14 \times 10^{-6}} \approx 0.422\text{ }\Omega$.


      Why it works:

      Resistance is directly proportional to length (more collisions) and inversely proportional to cross-sectional
      area (more pathways).'
    title: Calculate area and apply the resistance formula.
    instruction: 'Work through this step: Calculate area and apply the resistance formula.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: Find the resistance of a $50\text{ m}$ length of aluminum wire with a diameter of $2.0\text{
    mm}$. The resistivity of aluminum is $2.65 \times 10^{-8}\text{ }\Omega\cdot\text{m}$.
