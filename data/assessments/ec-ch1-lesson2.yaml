workedExamples:
- id: l2-sec1
  title: Power
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Power
    instruction: 'Power ($p$) is the time rate of expending or absorbing energy: $p
      = dw/dt$. It is measured in Watts (W).

      By the chain rule, $p = (dw/dq)(dq/dt) = vi$.

      Passive Sign Convention: If current enters the positive voltage terminal, $p
      = vi$ is the power absorbed. If it''s negative, power is being delivered/supplied.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec2
  title: Energy
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Energy
    instruction: 'Energy ($w$) is the integral of power over time: $w = \int p dt$.

      The total energy in a circuit must balance to zero (Tellegen''s Theorem concept).'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
