questions:
  - id: easy-augmented-matrix-identification
    type: multipleChoice
    prompt: |
      Which of the following represents the augmented matrix for the system below?
      $3x_1 - x_2 = 4$
      $2x_2 = 6$
    choices:
      - id: c1
        text: '$\begin{bmatrix} 3 & -1 & | & 4 \\ 0 & 2 & | & 6 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 3 & -1 & 4 \\ 2 & 0 & 6 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 3 & 4 \\ 2 & 6 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 3 & -1 & | & 4 \\ 2 & 0 & | & 6 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      The variables must line up in columns. The second equation has no $x_1$ term, so its coefficient is $0$.

  - id: easy-row-op-execution
    type: symbolicResponse
    prompt: |
      Apply the row operation $R_1 \leftrightarrow R_2$ (swap row 1 and row 2) to the matrix:
      $\begin{bmatrix} 0 & 1 & 3 \\ 2 & 5 & -1 \end{bmatrix}$
      
      Format your answer as a $2 \times 3$ matrix.
    answer:
      expectedLatex: '\begin{bmatrix} 2 & 5 & -1 \\ 0 & 1 & 3 \end{bmatrix}'
      equivalenceMode: expression
      tolerance: 0
      aliases:
        - '\begin{pmatrix} 2 & 5 & -1 \\ 0 & 1 & 3 \end{pmatrix}'
    explanation: |
      Simply interchange the top and bottom rows.

  - id: easy-rref-identification
    type: selectAll
    prompt: |
      Which of the following matrices are in Reduced Row Echelon Form (RREF)? (Select all that apply)
    choices:
      - id: c1
        text: '$\begin{bmatrix} 1 & 0 & 4 \\ 0 & 1 & -2 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 1 & 2 & 0 \\ 0 & 0 & 1 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 0 & 1 & 2 \\ 1 & 0 & 3 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 1 & 0 & 0 \\ 0 & 2 & 0 \end{bmatrix}$'
    answer:
      choiceIds:
        - c1
        - c2
    explanation: |
      A and B meet all conditions. C has a leading entry in row 2 that is to the left of row 1's leading entry. D has a pivot of 2 in the second row, which violates the "leading 1" condition.

  - id: easy-solution-extraction
    type: multipleChoice
    prompt: |
      An augmented matrix for a system with variables $x_1, x_2$ is reduced to the following RREF:
      $\begin{bmatrix} 1 & 0 & | & 7 \\ 0 & 1 & | & -3 \end{bmatrix}$
      
      What is the solution to the system?
    choices:
      - id: c1
        text: '$x_1 = 7, x_2 = -3$'
      - id: c2
        text: '$x_1 = -3, x_2 = 7$'
      - id: c3
        text: 'There is no solution.'
      - id: c4
        text: 'There are infinitely many solutions.'
    answer:
      choiceId: c1
    explanation: |
      The matrix directly translates to $1x_1 = 7$ and $1x_2 = -3$.

  - id: easy-inconsistent-system
    type: multipleChoice
    prompt: |
      During row reduction, you encounter the following row in an augmented matrix:
      $[0 \ \ 0 \ \ 0 \ \ | \ \ 5]$
      
      What does this indicate about the system of equations?
    choices:
      - id: c1
        text: 'The system has no solution.'
      - id: c2
        text: 'The system has infinitely many solutions.'
      - id: c3
        text: 'One of the variables is equal to 5.'
      - id: c4
        text: 'The variable corresponding to the third column is free.'
    answer:
      choiceId: c1
    explanation: |
      The row corresponds to the equation $0x_1 + 0x_2 + 0x_3 = 5$, which simplifies to $0 = 5$. This is a contradiction, so the system is inconsistent.
