  - id: arr-01
    type: flashcard
    prompt: 'What type of reaction forms an insoluble solid from two aqueous solutions?'
    answer: { expected: precipitation }
    explanation: 'Solution: Precipitation reaction. Why it works: The solid formed is called a precipitate.'
  - id: arr-02
    type: flashcard
    prompt: 'Which equation omits spectator ions?'
    answer: { expected: net ionic equation }
    explanation: 'Solution: Net ionic equation. Why it works: Only the participating species are included.'
