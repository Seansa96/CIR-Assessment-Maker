lesson:
  introduction: This lesson develops Standing Waves and Resonance from a diagram, a mathematical model,
    and a calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      A standing wave is formed when two traveling waves of identical frequency and amplitude move through the same medium in opposite directions. The physical system is typically a confined medium, like a guitar string clamped at both ends or air in a tube, which reflects waves back on themselves.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      Measurable quantities include the length of the medium $L$, the positions of nodes (points of zero displacement) and antinodes (points of maximum displacement), and the resonant frequencies $f_n$ (harmonics) at which standing waves naturally form.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model combines a right-traveling wave $y_1 = A\sin(kx - \omega t)$ and a left-traveling wave $y_2 = A\sin(kx + \omega t)$. Using a trigonometric identity, their superposition is $y(x,t) = [2A\sin(kx)]\cos(\omega t)$.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
  - id: s4
    title: Calculus connection
    content: >-
      Calculus reveals that a standing wave does not propagate energy. The spatial part $\sin(kx)$ and temporal part $\cos(\omega t)$ are separated. The transverse velocity $\frac{\partial y}{\partial t}$ at a node ($kx = n\pi$) is always zero. The wave 'stands' in place, oscillating its amplitude locally.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
  - id: s5
    title: Derivation or justification
    content: >-
      To find the resonant frequencies for a string fixed at both ends, we apply boundary conditions: $y(0,t) = 0$ and $y(L,t) = 0$. The first is satisfied by the sine function. The second requires $\sin(kL) = 0$, meaning $kL = n\pi$. Since $k = 2\pi/\lambda$, we find $L = n\frac{\lambda}{2}$, so $\lambda_n = \frac{2L}{n}$.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, the first harmonic ($n=1$, fundamental) is a single 'football' shape. The second harmonic ($n=2$) has a node in the center. The integer $n$ corresponds exactly to the number of antinodes (loops) on the string.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
  - id: s7
    title: Quantitative strategy
    content: >-
      A key quantitative strategy is using $v = f\lambda$. Substituting $\lambda_n = \frac{2L}{n}$ gives the formula for resonant frequencies: $f_n = n\frac{v}{2L} = n f_1$. Finding the wave speed $v$ from tension and density allows prediction of all natural pitches.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: Only specific, discrete wavelengths can 'fit' the boundary conditions. If an external driver attempts to force the string at a non-resonant frequency, the reflected waves will interfere destructively overall, and no stable standing wave will form.
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
