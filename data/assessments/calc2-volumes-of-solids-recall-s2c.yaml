skills: [disk-method, washer-method, axis-distance]
navigation: { learningGoal: recall, activityType: clozeDrill, tags: [calculus-2, volumes-of-solids, recall] }
authoring: { visualRequirement: required, visualRationale: Recognition requires connecting formulas to a cross-section diagram. }
items:
  - { id: r1, type: cloze, prompt: 'Fill in the washer formula: $A=\pi(R^2-\underline{\hspace{1cm}})$.', answer: { expected: r^2, aliases: ['$r^2$'] }, explanation: 'Solution: The missing term is $r^2$. Why it works: Remove the inner circular area from the outer circular area. Common trap: $R-r$ is a distance, not the removed area.' }
  - { id: r2, type: typed, prompt: 'State the quantity that $R$ and $r$ measure in a disk/washer problem.', answer: { expected: 'distance from the axis of rotation', aliases: [distance to the axis, distance from axis] }, explanation: 'Solution: Each radius is a distance from the rotation axis to a boundary. Why it works: Rotation sweeps that distance into a circle. Common trap: A function value is only a radius when the axis is the relevant coordinate axis.' }
  - { id: r3, type: cloze, prompt: 'A disk is the special washer case $\underline{\hspace{1cm}}$.', answer: { expected: 'r=0', aliases: ['r equals 0', 'inner radius equals zero'] }, explanation: 'Solution: $r=0$. Why it works: There is no hole to subtract. Common trap: The outer radius remains nonzero.' }
  - { id: r4, type: recognition, prompt: 'Which diagram feature signals a washer rather than a disk?', choices: [{ id: a, text: A central hole }, { id: b, text: A finite thickness }, { id: c, text: An x-bound }, { id: d, text: A circular edge }], answer: { choiceId: a }, explanation: 'Solution: Choose a central hole. Why it works: Its inner circular area is removed. Common trap: Both disks and washers have thickness and circular edges. Why the other choices fail: b, c, and d do not distinguish the two cross sections.' }
