questions:
- id: q001
  title: Flywheel rpm energy
  type: numericResponse
  prompt: |-
    A flywheel has $I=1.20\text{ kg}\cdot\text{m}^2$ and rotates at $180\text{ rpm}$. What is $K_{rot}$?
  answer:
    value: 213.2
    tolerance: 1.0
  explanation: |-
    $180\text{ rpm}=3\text{ rev/s}=6\pi\text{ rad/s}$. Then $K=\frac12(1.20)(6\pi)^2\approx213\text{ J}$.
- id: q002
  title: Doubling energy
  type: multipleChoice
  prompt: |-
    If $I$ is constant, by what factor must $\omega$ change to double $K_{rot}$?
  choices:
  - id: a
    text: |-
      $\sqrt2$
  - id: b
    text: |-
      $2$
  - id: c
    text: |-
      $4$
  - id: d
    text: |-
      $1/2$
  answer:
    choiceId: a
  explanation: |-
    $K_{rot}\propto\omega^2$, so doubling energy requires multiplying $\omega$ by $\sqrt2$.
- id: q003
  title: Rolling sphere energy
  type: numericResponse
  prompt: |-
    A $4.0\text{ kg}$ solid sphere rolls at $5.0\text{ m/s}$. What is total kinetic energy?
  answer:
    value: 70.0
    tolerance: 0.5
  explanation: |-
    Solid sphere rolling: $K=\frac7{10}Mv^2=0.7(4)(25)=70\text{ J}$.
- id: q004
  title: Required inertia
  type: numericResponse
  prompt: |-
    A rotor must store $10,000\text{ J}$ at $100\text{ rad/s}$. What $I$ is required?
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: |-
    $I=2K/\omega^2=20000/10000=2.0\text{ kg}\cdot\text{m}^2$.
- id: q005
  title: Hoop to disk rolling ratio
  type: numericResponse
  prompt: |-
    A hoop and solid disk have the same mass and roll at the same speed. What is $K_{hoop}/K_{disk}$?
  answer:
    value: 1.333
    tolerance: 0.02
  explanation: |-
    Hoop $K=Mv^2$; disk $K=\frac34Mv^2$; ratio $=4/3$.
- id: q006
  title: Largest rotational energy
  type: multipleChoice
  prompt: |-
    For equal $M$, $R$, and $\omega$, which has greatest $K_{rot}$?
  choices:
  - id: a
    text: |-
      Thin hoop
  - id: b
    text: |-
      Solid disk
  - id: c
    text: |-
      Solid sphere
  - id: d
    text: |-
      All equal
  answer:
    choiceId: a
  explanation: |-
    The hoop has the largest $I$, so it has the largest $K_{rot}$ at the same $\omega$.
- id: q007
  title: Energy lost slowing
  type: numericResponse
  prompt: |-
    A wheel with $I=3.5$ slows from $12$ to $5\text{ rad/s}$. How much kinetic energy is lost?
  answer:
    value: 208.25
    tolerance: 1.0
  explanation: |-
    $\Delta K=\frac12I(\omega_i^2-\omega_f^2)=1.75(144-25)=208.25\text{ J}$.
- id: q008
  title: Large moment meaning
  type: multipleChoice
  prompt: |-
    A large moment of inertia means an object is harder to:
  choices:
  - id: a
    text: |-
      change in rotational motion about that axis
  - id: b
    text: |-
      lift vertically
  - id: c
    text: |-
      translate on frictionless ground
  - id: d
    text: |-
      measure
  answer:
    choiceId: a
  explanation: |-
    $I$ is rotational inertia: resistance to angular acceleration.
- id: q009
  title: Cylinder down height
  type: numericResponse
  prompt: |-
    A solid cylinder rolls without slipping down a height of $1.8\text{ m}$. What speed does it reach?
  answer:
    value: 4.85
    tolerance: 0.05
  explanation: |-
    $mgh=\frac34mv^2$, so $v=\sqrt{4gh/3}\approx4.85\text{ m/s}$.
- id: q010
  title: Rolling disk omega
  type: numericResponse
  prompt: |-
    A disk of radius $0.30\text{ m}$ rolls at $2.4\text{ m/s}$. What is $\omega$?
  answer:
    value: 8.0
    tolerance: 0.05
  explanation: |-
    $\omega=v/R=2.4/0.30=8.0\text{ rad/s}$.
- id: q011
  title: Combined translational and rotational energy
  type: numericResponse
  prompt: |-
    A $3.0\text{ kg}$ assembly translates at $4.0\text{ m/s}$ while rotating with $I=0.45$ and $\omega=10$. What is total $K$?
  answer:
    value: 46.5
    tolerance: 0.5
  explanation: |-
    $K=\frac12Mv^2+\frac12I\omega^2=24+22.5=46.5\text{ J}$.
- id: q012
  title: Axis dependence
  type: multipleChoice
  prompt: |-
    Why must a moment of inertia specify an axis?
  choices:
  - id: a
    text: |-
      Because $r$ is measured from that axis.
  - id: b
    text: |-
      Because mass changes.
  - id: c
    text: |-
      Because angular speed has no direction.
  - id: d
    text: |-
      Because torque is always zero.
  answer:
    choiceId: a
  explanation: |-
    $I=\sum mr^2$ depends on perpendicular distance from the selected axis.
- id: q013
  title: Compare energies
  type: numericResponse
  prompt: |-
    Object A has $I=2.0$, $\omega=6.0$. Object B has $I=4.0$, $\omega=4.0$. What is $K_A-K_B$?
  answer:
    value: 4.0
    tolerance: 0.1
  explanation: |-
    $K_A=36\text{ J}$ and $K_B=32\text{ J}$, so the difference is $4\text{ J}$.
- id: q014
  title: Flywheel storage
  type: multipleChoice
  prompt: |-
    A flywheel stores energy best when it has:
  choices:
  - id: a
    text: |-
      large $I$ and high $\omega$
  - id: b
    text: |-
      small $I$ and zero $\omega$
  - id: c
    text: |-
      mass close to the axis only
  - id: d
    text: |-
      no radius
  answer:
    choiceId: a
  explanation: |-
    $K_{rot}=\frac12I\omega^2$, so both $I$ and $\omega$ matter.
- id: q015
  title: Disk rotational percentage
  type: numericResponse
  prompt: |-
    For a solid disk rolling without slipping, what percent of total kinetic energy is rotational?
  answer:
    value: 33.33
    tolerance: 0.5
  explanation: |-
    For a disk, $K_{rot}/K_{total}=(1/4)/(3/4)=1/3=33.3\%$.
