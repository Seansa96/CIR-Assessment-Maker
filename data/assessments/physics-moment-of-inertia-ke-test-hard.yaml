questions:
- id: q1
  type: numericResponse
  prompt: A thin ring of mass $M$ and radius $R$ spins at $\omega$. A solid disk of
    the same mass $M$ and radius $R$ spins at $2\omega$. What is the ratio of the
    disk's kinetic energy to the ring's kinetic energy? ($K_{disk} / K_{ring}$)
  answer:
    value: 2.0
    tolerance: 0.1
  explanation: $I_{ring} = MR^2$, $K_{ring} = \frac{1}{2}(MR^2)\omega^2$. $I_{disk}
    = \frac{1}{2}MR^2$, $K_{disk} = \frac{1}{2}(\frac{1}{2}MR^2)(2\omega)^2 = MR^2\omega^2$.
    The ratio is 2.
