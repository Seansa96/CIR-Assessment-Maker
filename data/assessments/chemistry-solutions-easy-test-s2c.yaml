questions:
  - { id: q001, type: freeResponse, prompt: 'Calculate mass percent for 4.50 g NaCl in 145.5 g solution.', answer: { gradingMode: selfCheck, keyPoints: ['4.50 divided by 145.5', 'times 100', '3.09 percent'] }, explanation: 'Solution: $(4.50\ \mathrm g/145.5\ \mathrm g)\times100\%=3.09\%$. Why it works: Mass percent uses solute mass over total solution mass. Common trap: Dividing by an unstated solvent mass.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Selects mass-percent formula and evaluates it with units.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: easy-mass-percent-1, variationAxes: { givens: solute and solution mass, unknown: mass percent } }
  - { id: q002, type: freeResponse, prompt: 'Convert 0.750 mg/L nitrate in dilute water to ppm.', answer: { gradingMode: selfCheck, keyPoints: ['0.750 ppm'] }, explanation: 'Solution: $0.750\ \mathrm{mg/L}\approx0.750\ \mathrm{ppm}$. Why it works: In dilute water ppm is approximately mg/L. Common trap: Multiplying by 1000.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Maps dilute-water mass-per-volume to ppm and applies the density assumption.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: easy-ppm-conversion, variationAxes: { representation: mg-per-L to ppm, scenario: water-quality report } }
  - { id: q003, type: freeResponse, prompt: 'Find moles in 0.625 L of 0.0800 M NaCl.', answer: { gradingMode: selfCheck, keyPoints: ['0.0500 mol'] }, explanation: 'Solution: $n=MV=(0.0800\ \mathrm{mol/L})(0.625\ \mathrm L)=0.0500\ \mathrm{mol}$. Why it works: Multiplying a per-liter quantity by liters leaves moles. Common trap: Dividing M by V.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Rearranges molarity and tracks cancelling units.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: easy-moles-from-MV, variationAxes: { givens: molarity and volume, unknown: moles } }
  - { id: q004, type: freeResponse, prompt: 'Find the molarity of 0.225 mol glucose in 1.50 L solution.', answer: { gradingMode: selfCheck, keyPoints: ['0.150 M'] }, explanation: 'Solution: $M=n/V=0.225\ \mathrm{mol}/1.50\ \mathrm L=0.150\ \mathrm M$. Why it works: Molarity is moles per final liter of solution. Common trap: Multiplying by volume.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Applies the molarity ratio and preserves mol/L units.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: easy-M-from-nV, variationAxes: { givens: moles and volume, unknown: molarity } }
  - { id: q005, type: freeResponse, prompt: 'Find the volume in mL containing 0.0600 mol KBr at 0.300 M.', answer: { gradingMode: selfCheck, keyPoints: ['0.200 L', '200 mL'] }, explanation: 'Solution: $V=n/M=0.0600/0.300=0.200\ \mathrm L=200\ \mathrm{mL}$. Why it works: Rearranged molarity gives volume. Common trap: Reporting 0.200 mL rather than converting liters.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Rearranges molarity and converts final units.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: easy-volume-from-nM, variationAxes: { givens: moles and molarity, unknown: volume } }
  - { id: q006, type: freeResponse, prompt: 'Calculate the grams NaOH needed for 100.0 mL of 0.500 M NaOH. Molar mass is 40.00 g/mol.', answer: { gradingMode: selfCheck, keyPoints: ['0.1000 L', '0.0500 mol', '2.00 g'] }, explanation: 'Solution: $n=(0.500)(0.1000)=0.0500\ \mathrm{mol}$; $m=(0.0500)(40.00)=2.00\ \mathrm g$. Why it works: Target molarity gives moles, then molar mass gives mass. Common trap: Using 100.0 mL as liters.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Chains volume conversion and molarity-to-mass calculation.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: easy-target-solution-mass, variationAxes: { scenario: solution preparation, unknown: solute mass } }
  - { id: q007, type: freeResponse, prompt: 'What volume of 1.50 M stock is required to make 300.0 mL of 0.250 M solution?', answer: { gradingMode: selfCheck, keyPoints: ['50.0 mL'] }, explanation: 'Solution: $V_1=M_2V_2/M_1=(0.250)(300.0)/1.50=50.0\ \mathrm{mL}$. Why it works: Dilution preserves solute moles. Common trap: Reversing the stock and target concentrations.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Identifies stock/final roles and solves conserved-moles dilution relation.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: easy-stock-volume, variationAxes: { scenario: stock dilution, unknown: stock transfer } }
  - { id: q008, type: freeResponse, prompt: 'A 0.600 M solution has final volume doubled with water. Find its new molarity.', answer: { gradingMode: selfCheck, keyPoints: ['0.300 M'] }, explanation: 'Solution: Doubling volume halves concentration: $0.600/2=0.300\ \mathrm M$. Why it works: Solute moles are unchanged while volume doubles. Common trap: Doubling molarity.', difficultyDimensions: [modelOrDerivation, parameterThreshold], difficultyEvidence: 'Uses conserved solute and inverse concentration-volume relationship.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: easy-double-volume, variationAxes: { constraints: doubled volume, unknown: final concentration } }
  - { id: q009, type: freeResponse, prompt: 'Explain in one sentence why a volumetric flask is filled to its mark after dissolving solute.', answer: { gradingMode: selfCheck, keyPoints: ['final solution volume', 'molarity denominator'] }, explanation: 'Solution: Fill after dissolution so the mark fixes the final solution volume used in molarity. Why it works: Dissolving solute can change volume. Common trap: Measuring the target amount of water before adding solute.', difficultyDimensions: [modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Connects laboratory sequence to the formal molarity definition.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: easy-final-volume-explanation, variationAxes: { representation: procedure to definition, methodBranch: error prevention } }
  - { id: q010, type: freeResponse, prompt: 'A solution is 7.50% m/m solute. Find grams solute in 80.0 g solution.', answer: { gradingMode: selfCheck, keyPoints: ['6.00 g'] }, explanation: 'Solution: $0.0750\times80.0\ \mathrm g=6.00\ \mathrm g$. Why it works: A percentage is a fraction of the stated total solution mass. Common trap: Multiplying by 7.50 instead of 0.0750.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts percent to decimal and applies it to total mass.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: easy-percent-to-mass, variationAxes: { givens: percentage and solution mass, unknown: solute mass } }
  - { id: q011, type: freeResponse, prompt: 'A sample contains 3.00 micrograms arsenic in 2.00 L water. Report ppb.', answer: { gradingMode: selfCheck, keyPoints: ['1.50 micrograms per L', '1.50 ppb'] }, explanation: 'Solution: $3.00\ \mathrm{\mu g}/2.00\ \mathrm L=1.50\ \mathrm{\mu g/L}\approx1.50\ \mathrm{ppb}$. Why it works: ppb corresponds approximately to micrograms per liter in dilute water. Common trap: Calling micrograms per liter ppm.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Calculates a mass-per-volume and transfers it to ppb.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: easy-mass-volume-to-ppb, variationAxes: { scenario: trace contaminant, unknown: ppb } }
  - { id: q012, type: freeResponse, prompt: 'Calculate moles of solute in 75.0 mL of 1.20 M solution.', answer: { gradingMode: selfCheck, keyPoints: ['0.0750 L', '0.0900 mol'] }, explanation: 'Solution: $n=(1.20)(0.0750)=0.0900\ \mathrm{mol}$. Why it works: Convert mL to L, then use $n=MV$. Common trap: Obtaining 90.0 mol by failing to convert volume.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts volume and applies molarity.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: easy-short-volume-moles, variationAxes: { givens: small volume and molarity, unknown: moles } }
  - { id: q013, type: freeResponse, prompt: 'Find the final molarity when 20.0 mL of 3.00 M stock is diluted to 250.0 mL.', answer: { gradingMode: selfCheck, keyPoints: ['0.240 M'] }, explanation: 'Solution: $M_2=M_1V_1/V_2=(3.00)(20.0)/250.0=0.240\ \mathrm M$. Why it works: The stock and final solution have equal solute moles. Common trap: Dividing 250.0 by 20.0 in the wrong position.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Uses dilution conservation and solves for the target concentration.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: easy-final-dilution-M, variationAxes: { givens: stock volume concentration final volume, unknown: final molarity } }
  - { id: q014, type: freeResponse, prompt: 'Find molarity for 5.85 g NaCl (58.44 g/mol) in 0.5000 L solution.', answer: { gradingMode: selfCheck, keyPoints: ['0.1001 mol', '0.200 M'] }, explanation: 'Solution: $n=5.85/58.44=0.1001\ \mathrm{mol}$; $M=0.1001/0.5000=0.200\ \mathrm M$. Why it works: Molar mass converts mass to moles before molarity is formed. Common trap: Dividing grams directly by liters.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Chains molar-mass and molarity conversions.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: easy-mass-to-M, variationAxes: { givens: solute mass molar mass final volume, unknown: molarity } }
  - { id: q015, type: freeResponse, prompt: 'A label reads 250 ppm chloride. State the approximate mg/L concentration.', answer: { gradingMode: selfCheck, keyPoints: ['250 mg/L'] }, explanation: 'Solution: $250\ \mathrm{ppm}\approx250\ \mathrm{mg/L}$ in dilute water. Why it works: ppm and mg/L are approximately equivalent under the dilute-water convention. Common trap: Reporting 0.250 mg/L.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Transfers a trace concentration under the stated aqueous approximation.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: easy-ppm-to-mgL, variationAxes: { representation: ppm to mass-per-volume, scenario: label reading } }
  - { id: q016, type: freeResponse, prompt: 'How many grams CaCl2 (110.98 g/mol) are in 0.250 mol?', answer: { gradingMode: selfCheck, keyPoints: ['27.7 g'] }, explanation: 'Solution: $m=(0.250\ \mathrm{mol})(110.98\ \mathrm{g/mol})=27.7\ \mathrm g$. Why it works: Molar mass is grams per mole. Common trap: Dividing by molar mass.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Uses molar-mass unit cancellation to calculate a weighing mass.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: easy-moles-to-mass, variationAxes: { givens: moles and molar mass, unknown: mass } }
  - { id: q017, type: freeResponse, prompt: 'A 0.100 M solution is concentrated by evaporating water until volume is half. Find final molarity, assuming no solute loss.', answer: { gradingMode: selfCheck, keyPoints: ['0.200 M'] }, explanation: 'Solution: Halving the volume doubles concentration, so final molarity is $0.200\ \mathrm M$. Why it works: Solute moles remain while the denominator halves. Common trap: Halving concentration as though solvent were added.', difficultyDimensions: [modelOrDerivation, parameterThreshold], difficultyEvidence: 'Applies inverse concentration-volume relation to evaporation.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: easy-evaporation-concentration, variationAxes: { scenario: evaporation, constraints: no solute loss, unknown: final molarity } }
  - { id: q018, type: freeResponse, prompt: 'Write the units that result from $(0.300\ \mathrm{mol/L})(0.250\ \mathrm L)$.', answer: { gradingMode: selfCheck, keyPoints: ['mol'] }, explanation: 'Solution: Liters cancel, leaving mol. Why it works: Dimensional analysis checks the rearranged molarity calculation. Common trap: Reporting mol/L after multiplying by L.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Uses unit cancellation to justify an equation result.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: easy-molarity-units, variationAxes: { representation: unit algebra, unknown: resulting unit } }
  - { id: q019, type: freeResponse, prompt: 'A solution has 9.00 g solute and total mass 120.0 g. Find mass percent.', answer: { gradingMode: selfCheck, keyPoints: ['7.50 percent'] }, explanation: 'Solution: $(9.00/120.0)\times100\%=7.50\%$. Why it works: The total solution mass is supplied directly. Common trap: Subtracting solute from total and using solvent mass.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Applies supplied total-mixture mass to percentage formula.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: easy-direct-mass-percent, variationAxes: { givens: solute and total mass, unknown: percent } }
  - { id: q020, type: freeResponse, prompt: 'State whether dilution of a solution changes solute moles, solution volume, and molarity.', answer: { gradingMode: selfCheck, keyPoints: ['moles unchanged', 'volume increases', 'molarity decreases'] }, explanation: 'Solution: Dilution leaves solute moles unchanged, increases volume, and decreases molarity. Why it works: Added solvent changes only the denominator in $M=n/V$. Common trap: Saying moles decrease because concentration decreases.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Relates a physical process to all variables in the molarity model.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: easy-dilution-variable-analysis, variationAxes: { scenario: qualitative dilution, unknown: variable changes } }
