questions:
- id: bohr-model-1
  title: Bohr Transitions
  type: multipleChoice
  prompt: 'Adapted from OpenStax College Chemistry 2e.


    An electron in a hydrogen atom transitions from $n=4$ to $n=2$. Does this process
    emit or absorb a photon?'
  choices:
  - id: emit
    text: It emits a photon.
  - id: absorb
    text: It absorbs a photon.
  answer:
    gradingMode: auto
    choiceId: emit
  explanation: Moving from a higher energy level ($n=4$) to a lower one ($n=2$) releases
    energy by emitting a photon.
