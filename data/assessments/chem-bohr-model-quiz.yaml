questions:
  - id: bohr-q01
    title: Fundamental Postulate of the Bohr Model
    type: multipleChoice
    prompt: |
      Which of the following was a revolutionary new idea introduced by Niels Bohr in his 1913 model of the atom?
    choices:
      - id: a
        text: Electrons exist in specific, quantized circular orbits and do not radiate energy while in these stationary states.
      - id: b
        text: The atom contains a small, dense, positively charged nucleus at its center.
      - id: c
        text: Electrons are waves of probability described by complex mathematical wavefunctions.
      - id: d
        text: Atoms are indivisible spheres of uniform positive charge with electrons embedded like plums in a pudding.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Rutherford discovered the nucleus (B), but classical physics predicted that orbiting electrons would constantly radiate energy and spiral into the nucleus. Bohr solved this by postulating that electrons only occupy specific "quantized" orbits where they magically do *not* radiate energy (stationary states). Option C is the later Quantum Mechanical model.

  - id: bohr-q02
    title: Photon Emission
    type: multipleChoice
    prompt: |
      According to the Bohr model, when does an atom emit a photon of light?
    choices:
      - id: a
        text: When an electron transitions from a higher energy level to a lower energy level.
      - id: b
        text: When an electron transitions from a lower energy level to a higher energy level.
      - id: c
        text: When an electron revolves very rapidly around the nucleus in its ground state.
      - id: d
        text: When the nucleus undergoes radioactive decay.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** To go from a high energy state (excited state) to a lower, more stable energy state, the atom must get rid of the excess energy. It does this by spitting out a photon of light exactly equal to the energy difference between the two orbits.

  - id: bohr-q03
    title: Energy of Transitions
    type: multipleChoice
    prompt: |
      Consider the energy levels of a hydrogen atom ($n=1, 2, 3, 4, \dots$). Which of the following electron transitions would emit a photon with the highest energy?
    choices:
      - id: a
        text: $n=2$ to $n=1$
      - id: b
        text: $n=3$ to $n=2$
      - id: c
        text: $n=4$ to $n=3$
      - id: d
        text: $n=5$ to $n=4$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The energy gaps between Bohr orbits get smaller and smaller as $n$ increases. The gap between $n=1$ and $n=2$ is by far the largest single gap in the hydrogen atom. Therefore, dropping from 2 to 1 releases much more energy than dropping from 5 to 4.

  - id: bohr-q04
    title: The Balmer Series
    type: multipleChoice
    prompt: |
      In the hydrogen atom emission spectrum, the visible lines (the Balmer series) are produced by electrons falling from higher levels down to which specific energy level?
    choices:
      - id: a
        text: $n=2$
      - id: b
        text: $n=1$
      - id: c
        text: $n=3$
      - id: d
        text: $n=4$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Transitions down to $n=1$ (Lyman series) release so much energy that the photons are in the invisible Ultraviolet range. Transitions down to $n=3$ (Paschen series) release too little energy and are in the Infrared. Only transitions ending at $n=2$ produce photons in the visible light spectrum.

  - id: bohr-q05
    title: Absorption vs Emission
    type: multipleChoice
    prompt: |
      An electron in a hydrogen atom is currently in the $n=3$ state. If it absorbs a photon of the correct energy, what might happen?
    choices:
      - id: a
        text: It will transition to a higher state, like $n=4$ or $n=5$.
      - id: b
        text: It will transition to a lower state, like $n=2$ or $n=1$.
      - id: c
        text: It will stay at $n=3$ but orbit faster.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Absorption means the atom is taking *in* energy. This extra energy kicks the electron further away from the nucleus, up into a higher-numbered, higher-energy orbit.

  - id: bohr-q06
    title: Calculating Transition Energy
    type: numericResponse
    prompt: |
      The energy of an electron in a hydrogen atom is given by $E_n = -2.18 \times 10^{-18} \text{ J} \left(\frac{1}{n^2}\right)$. 
      What is the energy of the photon emitted when an electron falls from $n=3$ to $n=2$? (Enter the value as a multiple of $10^{-19}$ J, e.g., if it is $3.0 \times 10^{-19}$, just enter 3.0). Round to two decimal places.
    answer:
      value: 3.03
      tolerance: 0.1
    explanation: |
      $E_3 = -2.18 \times 10^{-18} \text{ J} / 9 = -0.242 \times 10^{-18} \text{ J}$.
      $E_2 = -2.18 \times 10^{-18} \text{ J} / 4 = -0.545 \times 10^{-18} \text{ J}$.
      $\Delta E = E_\text{final} - E_\text{initial} = E_2 - E_3 = (-0.545) - (-0.242) = -0.303 \times 10^{-18} \text{ J}$.
      The photon carries away this lost energy, so $E_\text{photon} = +0.303 \times 10^{-18} \text{ J} = 3.03 \times 10^{-19} \text{ J}$.

  - id: bohr-q07
    title: Limitation of the Bohr Model
    type: multipleChoice
    prompt: |
      Why was the Bohr model eventually replaced by the Quantum Mechanical model?
    choices:
      - id: a
        text: It could only accurately predict the emission spectra of single-electron systems (like Hydrogen or $\text{He}^+$). It failed for multi-electron atoms.
      - id: b
        text: It failed to explain why electrons don't fall into the nucleus.
      - id: c
        text: It incorrectly predicted that atoms should constantly emit X-rays.
      - id: d
        text: It was proved that the nucleus does not exist.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Bohr's math perfectly predicted the hydrogen lines. However, as soon as a second electron was introduced (like in Helium), electron-electron repulsions made the math break down. It was a crucial stepping stone, but fundamentally incomplete.

  - id: bohr-q08
    title: Concept of "Quantized"
    type: multipleChoice
    prompt: |
      What does it mean to say that the energy levels in the Bohr model are "quantized"?
    choices:
      - id: a
        text: Electrons can only possess specific, discrete amounts of energy, rather than any continuous value.
      - id: b
        text: The energy of an electron depends on the quantity of neutrons in the nucleus.
      - id: c
        text: Electrons are physical particles rather than waves.
      - id: d
        text: The total energy of the atom must equal the energy of the nucleus.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** "Quantized" means restricted to specific steps or chunks. Just as you can stand on the 1st step or 2nd step of a staircase, but not on step 1.5, an electron can be in orbit $n=1$ or $n=2$, but never in between.

  - id: bohr-q09
    title: Ground State vs Excited State
    type: multipleChoice
    prompt: |
      Which term describes an atom where all electrons are in the lowest possible energy levels available to them?
    choices:
      - id: a
        text: Ground state
      - id: b
        text: Excited state
      - id: c
        text: Ionized state
      - id: d
        text: Quantum state
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The "ground state" is the baseline, lowest-energy configuration of an atom. Any state higher than this (caused by absorbing energy) is called an "excited state".

  - id: bohr-q10
    title: The Rydberg Equation Connection
    type: multipleChoice
    prompt: |
      The Bohr model provided a theoretical physical explanation for which previously discovered empirical formula?
    choices:
      - id: a
        text: The Rydberg equation, which predicted the wavelengths of hydrogen's emission lines.
      - id: b
        text: The Ideal Gas Law ($PV = nRT$).
      - id: c
        text: Einstein's $E = mc^2$.
      - id: d
        text: Newton's Law of Universal Gravitation.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Before Bohr, scientists like Balmer and Rydberg had found a math equation that perfectly predicted the hydrogen lines, but they had no idea *why* it worked. Bohr's model of quantized orbits perfectly derived the Rydberg equation from fundamental physics principles.
