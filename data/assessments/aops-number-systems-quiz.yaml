schemaVersion: 1
id: aops-number-systems-quiz
title: Number Systems Practice Quiz
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-number-systems
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-number-systems
  - classification-practice
  - exact-decimals
skills:
- Classify numbers in the smallest standard set
- Convert between rational decimal and fractional forms
- Apply closure, irrationality, and complex-number definitions
questions:
- id: q001
  type: multipleChoice
  prompt: Under $\mathbb N=\{1,2,3,\ldots\}$, what is the smallest set containing $-7$?
  choices:
  - {id: a, text: '$\mathbb N$'}
  - {id: b, text: '$\mathbb Z$'}
  - {id: c, text: '$\mathbb R\setminus\mathbb Q$'}
  - {id: d, text: '$\mathbb C\setminus\mathbb R$'}
  answer: {choiceId: b}
  explanation: $-7$ is an integer but not a positive natural number.
  skills: [classify-number-sets]
- id: q002
  type: multipleChoice
  prompt: With the same convention, what is the smallest set containing $0$?
  choices:
  - {id: a, text: '$\mathbb N$'}
  - {id: b, text: '$\mathbb Z$'}
  - {id: c, text: '$\mathbb R\setminus\mathbb Q$'}
  - {id: d, text: '$\mathbb C\setminus\mathbb R$'}
  answer: {choiceId: b}
  explanation: Zero is an integer and this convention excludes it from $\mathbb N$.
  skills: [classify-number-sets]
- id: q003
  type: multipleChoice
  prompt: What is the smallest standard set containing $3/8$?
  choices:
  - {id: a, text: '$\mathbb N$'}
  - {id: b, text: '$\mathbb Z$'}
  - {id: c, text: '$\mathbb Q$'}
  - {id: d, text: '$\mathbb R\setminus\mathbb Q$'}
  answer: {choiceId: c}
  explanation: It is a quotient of integers but not an integer.
  skills: [classify-number-sets]
- id: q004
  type: multipleChoice
  prompt: What is the smallest standard set containing $\sqrt{81}$?
  choices:
  - {id: a, text: '$\mathbb N$'}
  - {id: b, text: '$\mathbb Q\setminus\mathbb Z$'}
  - {id: c, text: '$\mathbb R\setminus\mathbb Q$'}
  - {id: d, text: '$\mathbb C\setminus\mathbb R$'}
  answer: {choiceId: a}
  explanation: $\sqrt{81}=9$, a positive counting number.
  skills: [simplify-before-classifying]
- id: q005
  type: multipleChoice
  prompt: What is the smallest standard set containing $\sqrt{12}$?
  choices:
  - {id: a, text: '$\mathbb Z$'}
  - {id: b, text: '$\mathbb Q$'}
  - {id: c, text: '$\mathbb R$'}
  - {id: d, text: '$\mathbb C\setminus\mathbb R$'}
  answer: {choiceId: c}
  explanation: $\sqrt{12}=2\sqrt3$ is irrational but real.
  skills: [classify-square-roots]
- id: q006
  type: multipleChoice
  prompt: Write $0.125$ as a fraction in lowest terms.
  choices:
  - {id: a, text: '$1/8$'}
  - {id: b, text: '$1/5$'}
  - {id: c, text: '$1/4$'}
  - {id: d, text: '$125/10$'}
  answer: {choiceId: a}
  explanation: $0.125=125/1000=1/8$.
  skills: [convert-terminating-decimals]
- id: q007
  type: multipleChoice
  prompt: Convert $0.\overline3$ to a fraction.
  choices:
  - {id: a, text: '$3/10$'}
  - {id: b, text: '$1/3$'}
  - {id: c, text: '$3/11$'}
  - {id: d, text: '$1/9$'}
  answer: {choiceId: b}
  explanation: If $x=0.\overline3$, then $10x-x=3$, so $9x=3$.
  skills: [convert-repeating-decimals]
- id: q008
  type: multipleChoice
  prompt: Which reduced fraction has a terminating decimal expansion?
  choices:
  - {id: a, text: '$7/40$'}
  - {id: b, text: '$5/18$'}
  - {id: c, text: '$4/21$'}
  - {id: d, text: '$11/30$'}
  answer: {choiceId: a}
  explanation: $40=2^3\cdot5$ has no prime factors other than 2 and 5.
  skills: [classify-rational-decimals]
- id: q009
  type: multipleChoice
  prompt: What is the contradiction in the lowest-terms proof that $\sqrt2$ is irrational?
  choices:
  - {id: a, text: The numerator and denominator are both forced even.}
  - {id: b, text: The numerator is larger than the denominator.}
  - {id: c, text: The fraction has a decimal expansion.}
  - {id: d, text: The square root is positive.}
  answer: {choiceId: a}
  explanation: A common factor 2 contradicts the assumption that the fraction was reduced.
  skills: [understand-irrationality-proofs]
- id: q010
  type: multipleChoice
  prompt: Which example disproves closure of irrational numbers under addition?
  choices:
  - {id: a, text: '$\sqrt2+(-\sqrt2)=0$'}
  - {id: b, text: '$1/2+1/3=5/6$'}
  - {id: c, text: '$2+3=5$'}
  - {id: d, text: '$\sqrt2+1$'}
  answer: {choiceId: a}
  explanation: Both inputs are irrational but the result is rational.
  skills: [construct-counterexamples]
- id: q011
  type: multipleChoice
  prompt: Solve $x^2=-25$ in $\mathbb C$.
  choices:
  - {id: a, text: No solutions}
  - {id: b, text: '$x=5$'}
  - {id: c, text: '$x=\pm5$'}
  - {id: d, text: '$x=\pm5i$'}
  answer: {choiceId: d}
  explanation: $(5i)^2=25i^2=-25$, and both signs square to the same value.
  skills: [solve-in-complex-numbers]
- id: q012
  type: multipleChoice
  prompt: What is the complex conjugate of $4-3i$?
  choices:
  - {id: a, text: '$-4+3i$'}
  - {id: b, text: '$4+3i$'}
  - {id: c, text: '$-4-3i$'}
  - {id: d, text: '$3+4i$'}
  answer: {choiceId: b}
  explanation: Conjugation reverses only the imaginary part's sign.
  skills: [identify-complex-conjugates]
- id: q013
  type: selectAll
  prompt: Which numbers are rational?
  choices:
  - {id: a, text: '$0.375$'}
  - {id: b, text: '$0.\overline{12}$'}
  - {id: c, text: '$\sqrt7$'}
  - {id: d, text: '$-11$'}
  answer:
    choiceIds: [a, b, d]
  explanation: Terminating decimals, repeating decimals, and integers are rational; $\sqrt7$ is irrational.
  skills: [recognize-rational-representations]
- id: q014
  type: selectAll
  prompt: Which closure statements are true?
  choices:
  - {id: a, text: Integers are closed under addition.}
  - {id: b, text: Integers are closed under division by any nonzero integer.}
  - {id: c, text: Rationals are closed under multiplication.}
  - {id: d, text: Rationals are closed under division by a nonzero rational.}
  answer:
    choiceIds: [a, c, d]
  explanation: Integer division can produce a noninteger, such as $1/2$.
  skills: [reason-about-closure]
- id: q015
  type: freeResponse
  prompt: Convert $0.\overline{36}$ to a fraction in lowest terms, showing how the repeating tail is eliminated.
  answer:
    gradingMode: selfCheck
    expected: |-
      Let $x=0.\overline{36}$. Then $100x=36.\overline{36}$. Subtracting the first equation gives $99x=36$, so $x=36/99=4/11$.
    keyPoints:
    - Defines a variable equal to the repeating decimal.
    - Multiplies by 100 because the repeating block has two digits.
    - Subtracts aligned repeating tails.
    - Reduces $36/99$ to $4/11$.
  explanation: Matching infinite tails cancel exactly, leaving a linear equation.
  skills: [convert-repeating-decimals]
