- id: q005
  type: freeResponse
  prompt: |-
    A What Numbers Really Are problem has been changed so that the obvious first method no longer applies directly. Explain how you would decide whether **prove irrationality by contradiction** is still legal, and name one condition you would check.
  answer:
    expected: |-
      Check whether the structure still contains lowest terms and whether the constraints needed for prove irrationality by contradiction remain true.
    gradingMode: selfCheck
    keyPoints:
    - Mentions lowest terms.
    - Mentions prove irrationality by contradiction.
    - Checks a condition or edge case.
  explanation: |-
    The purpose is to test method selection. Related topic: What Numbers Really Are; specific technique: prove irrationality by contradiction.
  skills:
  - aops-number-systems
