schemaVersion: 1
id: chemistry-units-test-s2c
title: Dimensional Analysis Test
assessmentType: test
categoryId: chemistry
topicId: chemistry-units
modeDefault: practice
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - chemistry
  - general-chemistry-i
questions:
- id: q1
  type: numericResponse
  prompt: Convert $3.45\ \mathrm{m}$ to centimeters.
  answer:
    value: 345
    tolerance: 3.45
  explanation: 'Solution: $3.45\ \mathrm{m}\times100\ \mathrm{cm}/1\ \mathrm{m}=345\ \mathrm{cm}$.


    Why it works: The conversion factor is oriented so meters cancel.'
  difficultyDimensions:
  - metricPrefix
  - factorOrientation
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q2
  type: numericResponse
  prompt: Convert $0.750\ \mathrm{L}$ to milliliters.
  answer:
    value: 750
    tolerance: 7.5
  explanation: 'Solution: $0.750\ \mathrm{L}\times1000\ \mathrm{mL}/1\ \mathrm{L}=750\ \mathrm{mL}$.


    Why it works: Liters cancel, leaving the requested milliliter unit.'
  difficultyDimensions:
  - metricPrefix
  - factorOrientation
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q3
  type: numericResponse
  prompt: A rectangle is $2.50\ \mathrm{m}$ by $35.0\ \mathrm{cm}$. Find its area in $\mathrm{m^2}$.
  answer:
    value: 0.875
    tolerance: 0.01
  explanation: 'Solution: First convert $35.0\ \mathrm{cm}$ to $0.350\ \mathrm{m}$, then multiply: $2.50(0.350)=0.875\
    \mathrm{m^2}$.


    Why it works: Both lengths must use the same unit before forming an area.'
  difficultyDimensions:
  - compoundUnits
  - areaConversion
  - factorOrientation
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q4
  type: numericResponse
  prompt: Convert $2.00\ \mathrm{cm^3}$ to $\mathrm{mL}$.
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: 'Solution: Because $1\ \mathrm{cm^3}=1\ \mathrm{mL}$, the value is $2.00\ \mathrm{mL}$.


    Why it works: A cubic centimeter and a milliliter are defined as the same volume.'
  difficultyDimensions:
  - volumeEquivalence
  - unitIdentity
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q5
  type: numericResponse
  prompt: How many $\mathrm{cm^3}$ are in $0.250\ \mathrm{m^3}$?
  answer:
    value: 250000
    tolerance: 2500.0
  explanation: 'Solution: $(100\ \mathrm{cm}/1\ \mathrm{m})^3=10^6\ \mathrm{cm^3/m^3}$; $0.250\times10^6=2.50\times10^5$.


    Why it works: Cubing a length conversion cubes the numerical factor.'
  difficultyDimensions:
  - cubedUnits
  - exponentReasoning
  - factorOrientation
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q6
  type: numericResponse
  prompt: A solid has density $7.85\ \mathrm{g/cm^3}$. Find the mass of $4.00\ \mathrm{cm^3}$.
  answer:
    value: 31.4
    tolerance: 0.314
  explanation: 'Solution: $4.00\ \mathrm{cm^3}\times7.85\ \mathrm{g/cm^3}=31.4\ \mathrm{g}$.


    Why it works: The volume unit cancels, leaving mass.'
  difficultyDimensions:
  - densityPipeline
  - unitCancellation
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q7
  type: numericResponse
  prompt: How many moles are in $36.0\ \mathrm{g}$ of water, $M=18.0\ \mathrm{g/mol}$?
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: 'Solution: $36.0\ \mathrm{g}\times1\ \mathrm{mol}/18.0\ \mathrm{g}=2.00\ \mathrm{mol}$.


    Why it works: Molar mass is a conversion factor between grams and moles.'
  difficultyDimensions:
  - moleMassChain
  - factorOrientation
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q8
  type: numericResponse
  prompt: What mass of $\mathrm{CO_2}$ is $0.250\ \mathrm{mol}$ if $M=44.01\ \mathrm{g/mol}$?
  answer:
    value: 11.0
    tolerance: 0.11
  explanation: 'Solution: $0.250\ \mathrm{mol}\times44.01\ \mathrm{g/mol}=11.0025\ \mathrm{g}$, so $11.0\
    \mathrm{g}$.


    Why it works: The mole unit cancels with the denominator of molar mass.'
  difficultyDimensions:
  - moleMassChain
  - unitCancellation
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q9
  type: multipleChoice
  prompt: A student wants grams from $0.500\ \mathrm{mol}$ of a substance with $58.44\ \mathrm{g/mol}$.
    Which factor must multiply the moles?
  choices:
  - id: a
    text: $58.44\ \mathrm{g}/1\ \mathrm{mol}$
    issueSignals: []
  - id: b
    text: $1\ \mathrm{mol}/58.44\ \mathrm{g}$
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: c
    text: $58.44\ \mathrm{mol}/1\ \mathrm{g}$
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: d
    text: $1\ \mathrm{g}/58.44\ \mathrm{mol}$
    issueSignals:
    - id: stoichiometry-ratio-error
  answer:
    choiceId: a
  explanation: 'Solution: Use $58.44\ \mathrm{g}/1\ \mathrm{mol}$ so mol cancels and g remains.


    Why it works: A conversion factor must put the unwanted unit opposite the given unit.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - factorOrientation
  - moleMassChain
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q10
  type: multipleChoice
  prompt: A result is reported as $5.0\ \mathrm{g/mol}$ after starting with grams and multiplying only
    by $\mathrm{mol/g}$. What should the final unit have been?
  choices:
  - id: a
    text: mol
    issueSignals: []
  - id: b
    text: g
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: c
    text: g/mol
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: d
    text: mol/g
    issueSignals:
    - id: stoichiometry-ratio-error
  answer:
    choiceId: a
  explanation: 'Solution: The grams cancel: $\mathrm{g}\times\mathrm{mol/g}=\mathrm{mol}$.


    Why it works: Units reveal whether the selected conversion factors actually reach the target.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - unitCancellation
  - errorDetection
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: stoichiometry-ratio-error
