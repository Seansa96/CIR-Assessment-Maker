workedExamples:
- id: l1-sec1
  title: Magnetic Flux
  explanation: Magnetic flux $\Phi_B$ is the measure of the magnetic field passing
    through a given surface area. $\Phi_B = \int \vec{B} \cdot d\vec{A}$. For a uniform
    field and flat area, $\Phi_B = BA \cos\theta$.
- id: l1-sec2
  title: Faraday's Law
  explanation: 'Faraday discovered that a changing magnetic flux induces an electromotive
    force (EMF) in a circuit. The induced EMF is equal to the negative time rate of
    change of magnetic flux: $\mathcal{E} = -\frac{d\Phi_B}{dt}$. For a coil with
    $N$ turns, $\mathcal{E} = -N \frac{d\Phi_B}{dt}$.'
