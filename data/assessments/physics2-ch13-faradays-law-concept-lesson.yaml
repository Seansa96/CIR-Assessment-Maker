lesson:
  introduction: >
    This lesson develops a repeatable way to solve Faraday's Law of Induction problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch13-faradays-law-s1
    title: Name the model and quantities
    required: true
    content: >
      Faraday's Law of Induction uses emf = -N Delta Phi_B/Delta t. In the name the model and quantities stage, calculate signed flux first and then apply the rate of change and number of turns.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Faraday's Law of Induction problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch13-faradays-law-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Faraday's Law of Induction, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use emf = -N Delta Phi_B/Delta t after you calculate signed flux first and then apply the rate of change and number of turns.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Faraday's Law of Induction problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch13-faradays-law-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables emf = -N Delta Phi_B/Delta t relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch13-faradays-law-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Faraday's Law of Induction.
        media: []
        issueSignals:
        - id: physics2-physics2-ch13-faradays-law-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
