glossary:
  introduction: 'These terms connect nuclear notation and decay to time models, energy, detection, and evidence-based radiation safety.'
  sections:
    - id: nuclides-and-decay
      title: Nuclides and radioactive change
      entries:
        - id: nuclide
          term: nuclide
          definition: 'A nucleus specified by a particular number of protons and neutrons, commonly represented by mass number A and atomic number Z.'
          drills: [{ id: d1, type: flashcard, prompt: 'What two counts uniquely specify a nuclide?', answer: { expected: 'numbers of protons and neutrons', aliases: ['protons and neutrons', 'Z and neutron number'] }, explanation: 'Solution: Its numbers of protons and neutrons. Why it works: Z fixes the element and A−Z fixes the neutron count.' }]
        - id: radionuclide
          term: radionuclide
          definition: 'An unstable nuclide that spontaneously transforms while emitting particles or electromagnetic radiation.'
          drills: [{ id: d2, type: flashcard, prompt: 'What distinguishes a radionuclide from a stable nuclide?', answer: { expected: 'it spontaneously undergoes radioactive decay', aliases: ['it is radioactive', 'it spontaneously decays'] }, explanation: 'Solution: It spontaneously undergoes radioactive decay. Why it works: Nuclear instability produces a probabilistic transformation without an external trigger.' }]
        - id: alpha-particle
          term: alpha particle
          definition: 'A $^4_2He$ nucleus emitted in alpha decay, lowering parent A by four and Z by two.'
          drills: [{ id: d3, type: flashcard, prompt: 'How do A and Z change during alpha emission?', answer: { expected: 'A decreases by 4 and Z decreases by 2', aliases: ['-4 mass number and -2 atomic number'] }, explanation: 'Solution: $\Delta A=-4$ and $\Delta Z=-2$. Why it works: The emitted particle contains two protons and two neutrons.' }]
        - id: beta-minus-particle
          term: beta-minus particle
          definition: 'A high-speed electron emitted when a neutron transforms into a proton, leaving A unchanged and increasing Z by one.'
          drills: [{ id: d4, type: flashcard, prompt: 'How does beta-minus decay change the daughter atomic number?', answer: { expected: 'it increases by 1', aliases: ['Z increases by one', '+1'] }, explanation: 'Solution: Z increases by one while A stays fixed. Why it works: A neutron becomes a proton and the emitted electron carries negative charge away.' }]
        - id: positron
          term: positron
          definition: 'The electron antiparticle, written $^0_{+1}e$, emitted when a proton transforms toward a neutron.'
          drills: [{ id: d5, type: flashcard, prompt: 'How does positron emission change A and Z?', answer: { expected: 'A unchanged and Z decreases by 1', aliases: ['mass number unchanged; atomic number minus one'] }, explanation: 'Solution: A is unchanged and Z decreases by one. Why it works: A proton-to-neutron conversion changes identity without changing the nucleon total.' }]
        - id: electron-capture
          term: electron capture
          definition: 'A process in which the nucleus captures an inner electron, converting a proton toward a neutron so A stays fixed and Z decreases by one.'
          drills: [{ id: d6, type: flashcard, prompt: 'Which daughter-number change does electron capture share with positron emission?', answer: { expected: 'A unchanged and Z decreases by 1', aliases: ['atomic number decreases one; mass number unchanged'] }, explanation: 'Solution: A is unchanged and Z decreases by one. Why it works: Both processes reduce the proton count by one without changing total nucleons.' }]
        - id: gamma-ray
          term: gamma ray
          definition: 'High-energy electromagnetic radiation emitted as an excited nucleus moves to a lower-energy state without changing A or Z.'
          drills: [{ id: d7, type: flashcard, prompt: 'What changes in A and Z during pure gamma emission?', answer: { expected: 'neither changes', aliases: ['A and Z are unchanged', '0 and 0'] }, explanation: 'Solution: Neither A nor Z changes. Why it works: Gamma emission removes excitation energy rather than nucleons or charge.' }]
        - id: half-life
          term: half-life
          definition: 'The time required for half of the radioactive nuclei currently present to decay.'
          drills: [{ id: d8, type: flashcard, prompt: 'What fraction remains after three half-lives?', answer: { expected: 'one eighth', aliases: ['1/8', '0.125'] }, explanation: 'Solution: $1/8$. Why it works: Repeated halving gives $(1/2)^3$.' }]
    - id: kinetics-energy-safety
      title: Decay kinetics, nuclear energy, and radiation evidence
      entries:
        - id: decay-constant
          term: decay constant
          definition: 'The first-order probability-rate constant k for radioactive decay, related to half-life by $t_{1/2}=\ln2/k$.'
          drills: [{ id: d9, type: flashcard, prompt: 'How is half-life related to the decay constant?', answer: { expected: 't1/2 = ln 2 divided by k', aliases: ['t half = 0.693/k', 't1/2=ln2/k'] }, explanation: 'Solution: $t_{1/2}=\ln2/k$. Why it works: Radioactive decay follows a first-order exponential model.' }]
        - id: activity
          term: activity
          definition: 'The rate at which nuclei decay in a sample, measured as disintegrations per unit time.'
          drills: [{ id: d10, type: flashcard, prompt: 'What does radioactive activity count?', answer: { expected: 'nuclear decays per unit time', aliases: ['disintegrations per second', 'decay rate'] }, explanation: 'Solution: Nuclear decays per unit time. Why it works: Activity measures event frequency, not simply sample mass or biological dose.' }]
        - id: mass-defect
          term: mass defect
          definition: 'The positive difference between the summed masses of separated nucleons and the smaller mass of the bound nucleus.'
          drills: [{ id: d11, type: flashcard, prompt: 'Which is more massive: separated nucleons or their bound nucleus?', answer: { expected: 'the separated nucleons', aliases: ['separate protons and neutrons'] }, explanation: 'Solution: The separated nucleons. Why it works: The mass difference corresponds to energy released when the bound state forms.' }]
        - id: binding-energy
          term: binding energy
          definition: 'The energy equivalent of a nucleus’s mass defect and the energy required to separate it completely into nucleons.'
          drills: [{ id: d12, type: flashcard, prompt: 'What physical quantity is related to mass defect by $E=\Delta mc^2$?', answer: { expected: 'binding energy' }, explanation: 'Solution: Binding energy. Why it works: The missing rest mass appears as the energy of nuclear binding.' }]
        - id: fission
          term: nuclear fission
          definition: 'Splitting a heavy nucleus into smaller nuclei, usually with emitted neutrons and energy.'
          drills: [{ id: d13, type: flashcard, prompt: 'Does fission join light nuclei or split a heavy nucleus?', answer: { expected: 'split a heavy nucleus', aliases: ['splits a heavy nucleus'] }, explanation: 'Solution: It splits a heavy nucleus. Why it works: Fission products can be more tightly bound per nucleon than the original very heavy nucleus.' }]
        - id: fusion
          term: nuclear fusion
          definition: 'Joining light nuclei into a heavier nucleus, potentially releasing energy when the product is more tightly bound per nucleon.'
          drills: [{ id: d14, type: flashcard, prompt: 'What nuclear process powers stars by joining light nuclei?', answer: { expected: 'fusion', aliases: ['nuclear fusion'] }, explanation: 'Solution: Nuclear fusion. Why it works: Light nuclei combine into more tightly bound products under extreme conditions.' }]
        - id: dosimeter
          term: dosimeter
          definition: 'A device or material used to monitor accumulated exposure to ionizing radiation.'
          drills: [{ id: d15, type: flashcard, prompt: 'What does a personal dosimeter monitor?', answer: { expected: 'accumulated radiation exposure', aliases: ['radiation exposure', 'ionizing radiation exposure'] }, explanation: 'Solution: Accumulated radiation exposure. Why it works: Its response records interactions over the wear period rather than identifying sample half-life.' }]
        - id: shielding
          term: radiation shielding
          definition: 'Material placed between a radiation source and a target to reduce exposure, selected according to radiation type and energy.'
          drills: [{ id: d16, type: flashcard, prompt: 'Why is shielding material chosen according to radiation type?', answer: { expected: 'different radiation types have different penetration and interactions', aliases: ['penetration differs', 'alpha beta and gamma interact differently'] }, explanation: 'Solution: Radiation types differ in penetration and material interaction. Why it works: Paper can stop alpha, while penetrating gamma generally requires denser shielding.' }]
