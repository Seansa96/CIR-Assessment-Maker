workedExamples:
  - id: we-rms-speed
    title: Calculating Root-Mean-Square Speed
    problem: |
      Calculate the root-mean-square (rms) speed ($u_{rms}$) of Nitrogen gas ($N_2$) molecules at 25 °C.
    steps:
      - id: s1-identify
        title: 'Identify variables and units'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the unit requirements and continue.
        instruction: |
          Formula: $u_{rms} = \sqrt{\frac{3RT}{M}}$
          - $R = 8.314$ J/(mol·K)
          - $T$ must be in Kelvin: $25 \text{ °C} + 273.15 = 298.15 \text{ K}$
          - $M$ must be in **kg/mol**. For $N_2$, $M = 28.02 \text{ g/mol} = 0.02802 \text{ kg/mol}$.

      - id: s2-calculate
        title: 'Calculate the speed'
        type: numericResponse
        answer:
          value: 515
          tolerance: 5
        prompt: |
          Plug the values into the formula and calculate $u_{rms}$ (in m/s).
        instruction: |
          $$u_{rms} = \sqrt{\frac{3(8.314)(298.15)}{0.02802}}$$
          $$u_{rms} = \sqrt{\frac{7436.5}{0.02802}} = \sqrt{265400}$$
          $$u_{rms} \approx 515 \text{ m/s}$$
          *(Over 1,100 mph!)*

  - id: we-grahams-law
    title: Using Graham's Law to Identify an Unknown Gas
    problem: |
      An unknown gas effuses through a pinhole 0.466 times as fast as Oxygen gas ($O_2$) under the same conditions. Identify the molar mass of the unknown gas.
    steps:
      - id: s1-setup
        title: 'Set up Graham''s Law'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the setup and continue.
        instruction: |
          Let gas 1 be the unknown ($unkn$) and gas 2 be Oxygen ($O_2$).
          We are given the ratio: $\frac{r_{unkn}}{r_{O_2}} = 0.466$
          Molar mass of $O_2$ ($M_{O_2}$) = $32.00 \text{ g/mol}$.
          Graham's Law:
          $$\frac{r_{unkn}}{r_{O_2}} = \sqrt{\frac{M_{O_2}}{M_{unkn}}}$$

      - id: s2-solve
        title: 'Solve for the unknown molar mass'
        type: numericResponse
        answer:
          value: 147
          tolerance: 2
        prompt: |
          Substitute the values and solve for $M_{unkn}$ (in g/mol).
        instruction: |
          $$0.466 = \sqrt{\frac{32.00}{M_{unkn}}}$$
          Square both sides:
          $$(0.466)^2 = \frac{32.00}{M_{unkn}}$$
          $$0.217 = \frac{32.00}{M_{unkn}}$$
          $$M_{unkn} = \frac{32.00}{0.217} = 147.5 \text{ g/mol}$$
          (The gas is likely something heavy like $SF_6$, which is $146 \text{ g/mol}$).
