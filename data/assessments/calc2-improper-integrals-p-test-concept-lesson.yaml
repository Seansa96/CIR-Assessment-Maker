lesson:
  introduction: "Improper integrals involve calculating the area under a curve over\
    \ an infinite interval, or where the function approaches infinity. \nTo determine\
    \ if the area is finite (convergence) or infinite (divergence), we evaluate a\
    \ limit.\n\nThe p-test provides a quick way to determine convergence for a common\
    \ family of improper integrals without evaluating the limit manually.\n"
  sections:
  - id: convergence-and-divergence
    title: Convergence and Divergence
    required: true
    content: "An improper integral of the form\n\n$$\n\\int_{a}^{\\infty} f(x)\\,dx\n\
      $$\n\nis evaluated by replacing the infinite bound with a variable $t$, and\
      \ taking the limit as $t$ approaches infinity:\n\n$$\n\\lim_{t \\to \\infty}\
      \ \\int_{a}^{t} f(x)\\,dx.\n$$\n\nIf this limit exists and is a finite number,\
      \ we say the integral **converges**. \nIf the limit does not exist or approaches\
      \ infinity, we say the integral **diverges**.\n"
    check:
      id: convergence-check
      type: multipleChoice
      skills:
      - improper-integrals-p-test
      prompt: 'What does it mean if an improper integral converges?

        '
      choices:
      - id: a
        text: The limit of the integral as the bound approaches infinity is a finite
          number.
      - id: b
        text: The area under the curve is infinite.
      - id: c
        text: The limit of the integral does not exist.
      - id: d
        text: The function crosses the x-axis infinitely many times.
      answer:
        choiceId: a
      explanation: 'Convergence means the accumulated area approaches a specific,
        finite value as the interval grows indefinitely.


        Related topic: limits of integration.

        '
  - id: the-p-test
    title: The P-Test for Integrals
    required: true
    content: "Consider the family of integrals:\n\n$$\n\\int_{1}^{\\infty} \\frac{1}{x^p}\\\
      ,dx,\n$$\n\nwhere $p$ is a real number. \n\nEvaluating this using limits reveals\
      \ a simple rule known as the **p-test**:\n\n1. If **$p > 1$**, the integral\
      \ **converges**. The higher power in the denominator means the function shrinks\
      \ to zero fast enough for the total area to be finite.\n2. If **$p \\le 1$**,\
      \ the integral **diverges**. The function does not shrink fast enough, and the\
      \ accumulated area grows indefinitely.\n"
    check:
      id: p-test-check
      type: multipleChoice
      skills:
      - improper-integrals-p-test
      prompt: 'According to the p-test, does $\int_{1}^{\infty} \frac{1}{x^3}\,dx$
        converge or diverge?

        '
      choices:
      - id: a
        text: It converges because $p = 3$, and $3 > 1$.
      - id: b
        text: It diverges because $p = 3$, and $3 > 1$.
      - id: c
        text: It converges because $p = 3$, and $3 < 1$.
      - id: d
        text: It diverges because $p = 3$, and $3 \le 1$.
      answer:
        choiceId: a
      explanation: 'Here, $p = 3$. Since $3 > 1$, the p-test states that the integral
        converges.


        Related topic: p-test for improper integrals.

        '
  - id: borderline-case
    title: The Borderline Case (p = 1)
    required: true
    content: "The case where $p = 1$ is particularly important:\n\n$$\n\\int_{1}^{\\\
      infty} \\frac{1}{x}\\,dx.\n$$\n\nEvaluating this with limits:\n\n$$\n\\lim_{t\
      \ \\to \\infty} \\int_{1}^{t} \\frac{1}{x}\\,dx = \\lim_{t \\to \\infty} (\\\
      ln t - \\ln 1) = \\infty.\n$$\n\nEven though the function $f(x) = \\frac{1}{x}$\
      \ approaches zero as $x \\to \\infty$, it does not approach zero *fast enough*.\
      \ \nThus, the area is infinite, and the integral **diverges**. The value $p=1$\
      \ serves as the exact threshold between convergence and divergence.\n"
    check:
      id: borderline-case-check
      type: multipleChoice
      skills:
      - improper-integrals-p-test
      prompt: 'Why does $\int_{1}^{\infty} \frac{1}{x}\,dx$ diverge?

        '
      choices:
      - id: a
        text: Because its antiderivative is $\ln x$, which grows without bound as
          $x \to \infty$.
      - id: b
        text: Because the function $\frac{1}{x}$ does not approach zero.
      - id: c
        text: Because the area under the curve is negative.
      - id: d
        text: Because the p-test only applies to $p > 1$.
      answer:
        choiceId: a
      explanation: 'The natural logarithm $\ln x$ approaches infinity as $x$ approaches
        infinity. Thus, the limit is infinite.


        Related topic: harmonic series analog and logarithmic growth.

        '
