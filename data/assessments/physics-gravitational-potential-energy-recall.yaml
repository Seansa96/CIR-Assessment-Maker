items:
  - { id: gr1, type: cloze, prompt: 'Complete near Earth: $\Delta U=mg\Delta____$.', answer: { expected: y, expectedLatex: 'y', aliases: [height], media: [] }, explanation: 'Solution: Insert $y$.\n\nWhy it works: GPE change depends on vertical displacement.', tags: [gpe] }
  - { id: gr2, type: cloze, prompt: 'Complete: $U=-GMm/____$.', answer: { expected: r, expectedLatex: 'r', aliases: [distance], media: [] }, explanation: 'Solution: Insert $r$.\n\nWhy it works: Universal potential energy depends on separation.', tags: [gravity] }
  - { id: gr3, type: typed, prompt: 'What is the SI unit of potential energy?', answer: { expected: joule, expectedLatex: '', aliases: [J, joules], media: [] }, explanation: 'Solution: The unit is joule.\n\nWhy it works: Potential energy is measured in joules.', tags: [units] }
  - { id: gr4, type: typed, prompt: 'What quantity does gravity convert to kinetic energy as an object falls?', answer: { expected: 'gravitational potential energy', expectedLatex: '', aliases: [GPE, potential energy], media: [] }, explanation: 'Solution: It is gravitational potential energy.\n\nWhy it works: Mechanical energy is conserved without drag.', tags: [energy] }
  - { id: gr5, type: cloze, prompt: 'At escape speed, total mechanical energy is ____.', answer: { expected: zero, expectedLatex: '0', aliases: [], media: [] }, explanation: 'Solution: The word is zero.\n\nWhy it works: The object reaches infinity with zero speed.', tags: [escape] }
  - { id: gr6, type: typed, prompt: 'Which way does gravitational potential energy change when an object is raised near Earth?', answer: { expected: increases, expectedLatex: '', aliases: [increase, rises], media: [] }, explanation: 'Solution: It increases.\n\nWhy it works: $\Delta U=mg\Delta y$ is positive for upward displacement.', tags: [gpe] }
