workedExamples:
- id: we-trig-int-1
  title: Integrating Products of Sine and Cosine
  problem: |-
    Evaluate the indefinite integral:
    $$\int \sin^3(x) \cos^2(x) \, dx$$
  steps:
  - id: step-1
    title: Choose a Strategy
    type: freeResponse
    prompt: Summarize why an odd power of sine determines the strategy here.
    answer:
      expected: Since sine has an odd power, save one sine factor and convert the remaining sine power using the Pythagorean identity.
      gradingMode: selfCheck
    instruction: |-
      When evaluating integrals of the form $\int \sin^m(x)\cos^n(x) \, dx$, look at the powers $m$ and $n$.
      
      - If the power of sine is **odd**, peel off one $\sin(x)$ and convert the rest to cosines using $\sin^2(x) = 1 - \cos^2(x)$.
      - If the power of cosine is **odd**, peel off one $\cos(x)$ and convert the rest to sines using $\cos^2(x) = 1 - \sin^2(x)$.
      - If both are even, use half-angle identities.
      
      Here, the power of sine is 3 (odd). We will peel off one $\sin(x)$.
  - id: step-2
    title: Rewrite the Integral
    type: freeResponse
    prompt: Summarize what is rewritten before substitution.
    answer:
      expected: Split off one sine factor and rewrite the remaining sine squared as one minus cosine squared.
      gradingMode: selfCheck
    instruction: |-
      Peel off one $\sin(x)$:
      $$\int \sin^2(x) \cos^2(x) \cdot \sin(x) \, dx$$
      
      Now, use the Pythagorean identity $\sin^2(x) = 1 - \cos^2(x)$ to convert the remaining sines into cosines:
      $$\int (1 - \cos^2(x)) \cos^2(x) \cdot \sin(x) \, dx$$
  - id: step-3
    title: U-Substitution
    type: freeResponse
    prompt: Summarize why $u=\cos(x)$ is compatible with the saved factor.
    answer:
      expected: The saved sine factor becomes negative du when u equals cosine x.
      gradingMode: selfCheck
    instruction: |-
      Let $u = \cos(x)$. 
      Then $du = -\sin(x) \, dx$, which means $-du = \sin(x) \, dx$.
      
      Substitute $u$ and $-du$ into the integral:
      $$-\int (1 - u^2) u^2 \, du$$
  - id: step-4
    title: Expand and Integrate
    type: freeResponse
    prompt: Summarize the algebraic simplification before applying the power rule.
    answer:
      expected: Distribute the powers of u, account for the negative sign, and integrate the resulting polynomial in u.
      gradingMode: selfCheck
    instruction: |-
      Distribute the $u^2$:
      $$-\int (u^2 - u^4) \, du = \int (u^4 - u^2) \, du$$
      
      Integrate using the power rule:
      $$\frac{1}{5}u^5 - \frac{1}{3}u^3 + C$$
  - id: step-5
    title: Substitute Back
    type: freeResponse
    prompt: Summarize the final back-substitution step.
    answer:
      expected: Replace u with cosine x to express the antiderivative in terms of x again.
      gradingMode: selfCheck
    instruction: |-
      Substitute $u = \cos(x)$ back into the expression to get the final answer:
      $$\frac{1}{5}\cos^5(x) - \frac{1}{3}\cos^3(x) + C$$
