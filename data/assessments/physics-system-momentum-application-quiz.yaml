questions:
- id: q-skaters-momentum
  title: Skaters Pushing Off
  type: symbolicResponse
  prompt: |
    Two skaters start at rest on frictionless ice. Skater A has mass $60\text{ kg}$; skater B has mass $80\text{ kg}$ and moves right at $1.5\text{ m/s}$ after they push off. Find skater A's final velocity in m/s.
  answer:
    gradingMode: auto
    expectedLatex: -2.0
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Solution: $0=60v_A+80(1.5)$, so $60v_A=-120$ and $v_A=-2.0\text{ m/s}$.

    Why it works: The push is internal and horizontal external force is negligible, so total momentum remains zero.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  difficultyEvidence: Converts a directional scenario into a signed momentum equation.
