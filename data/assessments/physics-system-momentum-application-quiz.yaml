questions:
- id: q-skaters-momentum
  title: Skaters Pushing Off
  type: symbolicResponse
  prompt: 'Two ice skaters push off each other on a frictionless rink. Skater A ($60\\text{ kg}$) and Skater B ($80\\text{ kg}$) start at rest. \nIf Skater B moves to the right (positive direction) at $1.5\\text{ m/s}$, what is Skater A''s final velocity (in m/s)?\n'
  answer:
    gradingMode: auto
    expectedLatex: -2.0
    equivalenceMode: expression
    tolerance: 0.1
  explanation: 'The pushing force is internal, and with no horizontal friction, $\\vec F_{\\text{ext}} = 0$. \nTotal momentum is conserved: $0 = m_A v_A + m_B v_B$.\n$0 = 60 v_A + 80(1.5) \\implies 60 v_A = -120 \\implies v_A = -2.0\\text{ m/s}$.\n'
