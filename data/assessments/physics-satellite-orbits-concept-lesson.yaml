  - id: keplers-third-law
    title: 2. Orbital Period and Kepler's Third Law
    required: true
    content: >
      The orbital period ($T$) is the time it takes to complete one full orbit. For a circular orbit, the distance traveled is $2\pi r$, and the speed is constant.

      $$ v = \frac{2\pi r}{T} $$

      Substituting our earlier expression for $v$:

      $$ \sqrt{\frac{GM}{r}} = \frac{2\pi r}{T} $$

      Squaring both sides and rearranging yields **Kepler's Third Law** for circular orbits:

      $$ T^2 = \frac{4\pi^2}{GM} r^3 $$

      This shows that the square of the orbital period is directly proportional to the cube of the orbital radius.
    media:
    - type: image
      src: /media/physics/owa/kepler-orbit-laws.svg
      alt: Circular and elliptical orbits showing radius, focus, and equal-area sectors.
      caption: Larger orbital radius corresponds to a longer period through Kepler's third law.
    check:
      id: check-2
      type: multipleChoice
      prompt: >
        If you double the orbital radius of a satellite, what happens to its orbital period?
      choices:
      - id: a
        text: It increases by a factor of 2.
        media: []
        issueSignals: []
      - id: b
        text: It increases by a factor of 4.
        media: []
        issueSignals: []
      - id: c
        text: It increases by a factor of roughly 2.83.
        media: []
        issueSignals: []
      - id: d
        text: It remains the same.
        media: []
        issueSignals: []
      answer:
        choiceId: c
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        It increases by a factor of $2\sqrt{2} \approx 2.83$.


        Why it works:

        Since $T^2 \propto r^3$, if $r$ is doubled, $r^3$ increases by a factor of $2^3 = 8$. Therefore, $T^2$ increases by a factor of 8, meaning $T$ increases by $\sqrt{8} = 2\sqrt{2} \approx 2.83$.


        Why the other choices fail:

        The relationship is not linear ($T \propto r$) or quadratic ($T \propto r^2$). It is a power-law relationship ($T \propto r^{3/2}$).
