lesson:
  introduction: |
    Welcome to the lesson on Satellite Orbits and Kepler's Laws. How do satellites stay in space without falling back to Earth? The answer lies in their immense horizontal speed and the force of gravity acting as a centripetal force. In this lesson, we will explore orbital velocity, orbital period, and Kepler's laws of planetary motion.
  sections:
  - id: intro-circular-orbits
    title: 1. Circular Orbits
    required: true
    content: |
      For an object in a circular orbit, the only force acting on it is the gravitational force between it and the central body. This force provides the necessary centripetal force to keep the object moving in a circle.
      $$ F_g = F_c $$
      $$ \frac{GMm}{r^2} = \frac{mv^2}{r} $$
      By solving for $v$, we find the **orbital velocity**:
      $$ v = \sqrt{\frac{GM}{r}} $$
      Notice that the mass of the satellite ($m$) cancels out. The required speed depends only on the mass of the central body ($M$) and the orbital radius ($r$).
    media:
    - type: image
      src: /media/physics/owa/kepler-orbit-laws.svg
      alt: Circular and elliptical orbits showing radius, focus, and equal-area sectors.
      caption: Orbital radius sets circular speed; an ellipse places the central body at a focus.
    check:
      id: check-1
      type: multipleChoice
      prompt: |
        If a massive satellite and a tiny satellite are placed in the same circular orbit around Earth, how do their required orbital speeds compare?
      choices:
      - id: a
        text: 'The massive satellite requires a higher orbital speed.'
      - id: b
        text: 'The tiny satellite requires a higher orbital speed.'
      - id: c
        text: 'They require the exact same orbital speed.'
      answer:
        choiceId: c
      explanation: |
        Solution:
        They require the exact same orbital speed.
        
        Why it works:
        The equation for orbital velocity $v = \sqrt{GM/r}$ does not contain the mass of the satellite ($m$). Both gravity and the required centripetal force scale proportionally with the satellite's mass, causing it to cancel out.
        
        Why the other choices fail:
        A more massive satellite experiences a stronger gravitational force, but it also has more inertia and thus requires a stronger centripetal force to maintain its circular path. These effects perfectly balance.

  - id: keplers-third-law
    title: 2. Orbital Period and Kepler's Third Law
    required: true
    content: |
      The orbital period ($T$) is the time it takes to complete one full orbit. For a circular orbit, the distance traveled is $2\pi r$, and the speed is constant.
      $$ v = \frac{2\pi r}{T} $$
      Substituting our earlier expression for $v$:
      $$ \sqrt{\frac{GM}{r}} = \frac{2\pi r}{T} $$
      Squaring both sides and rearranging yields **Kepler's Third Law** for circular orbits:
      $$ T^2 = \frac{4\pi^2}{GM} r^3 $$
      This shows that the square of the orbital period is directly proportional to the cube of the orbital radius.
    media:
    - type: image
      src: /media/physics/owa/kepler-orbit-laws.svg
      alt: Circular and elliptical orbits showing radius, focus, and equal-area sectors.
      caption: Larger orbital radius corresponds to a longer period through Kepler's third law.
    check:
      id: check-2
      type: multipleChoice
      prompt: |
        If you double the orbital radius of a satellite, what happens to its orbital period?
      choices:
      - id: a
        text: 'It increases by a factor of 2.'
      - id: b
        text: 'It increases by a factor of 4.'
      - id: c
        text: 'It increases by a factor of roughly 2.83.'
      - id: d
        text: 'It remains the same.'
      answer:
        choiceId: c
      explanation: |
        Solution:
        It increases by a factor of $2\sqrt{2} \approx 2.83$.
        
        Why it works:
        Since $T^2 \propto r^3$, if $r$ is doubled, $r^3$ increases by a factor of $2^3 = 8$. Therefore, $T^2$ increases by a factor of 8, meaning $T$ increases by $\sqrt{8} = 2\sqrt{2} \approx 2.83$.
        
        Why the other choices fail:
        The relationship is not linear ($T \propto r$) or quadratic ($T \propto r^2$). It is a power-law relationship ($T \propto r^{3/2}$).

  - id: keplers-first-second
    title: 3. Kepler's Laws of Planetary Motion
    required: true
    content: |
      Johannes Kepler formulated three empirical laws governing orbital motion:
      1. **The Law of Ellipses**: All planets move in elliptical orbits, with the Sun at one focus. Circular orbits are just a special case of an ellipse where the eccentricity is zero.
      2. **The Law of Equal Areas**: A line drawn from the Sun to any planet sweeps out equal areas in equal time intervals. This implies that a planet moves faster when it is closer to the Sun (perihelion) and slower when it is farther away (aphelion).
      3. **The Law of Harmonies**: As derived above, the ratio of the squares of the periods of any two planets is equal to the ratio of the cubes of their average distances from the Sun.
    media:
    - type: image
      src: /media/physics/owa/kepler-orbit-laws.svg
      alt: Elliptical orbit with central body at a focus and equal-area sectors near perihelion and aphelion.
      caption: Equal-area sectors in equal times require faster motion near the central body.
    check:
      id: check-3
      type: multipleChoice
      prompt: |
        According to Kepler's Second Law, when does a comet moving in a highly elliptical orbit travel the fastest?
      choices:
      - id: a
        text: 'When it is farthest from the Sun.'
      - id: b
        text: 'When it is closest to the Sun.'
      - id: c
        text: 'It travels at a constant speed throughout its orbit.'
      answer:
        choiceId: b
      explanation: |
        Solution:
        When it is closest to the Sun.
        
        Why it works:
        To sweep out equal areas in equal times, the comet must move much faster along its orbital path when its radius vector (distance to the Sun) is short. This also perfectly aligns with the conservation of angular momentum ($L = mvr$).
        
        Why the other choices fail:
        At the farthest point (aphelion), the comet moves the slowest because its radius vector is very long. Circular orbits have constant speed, but highly elliptical orbits do not.
