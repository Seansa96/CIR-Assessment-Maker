  - id: keplers-first-second
    title: 3. Kepler's Laws of Planetary Motion
    required: true
    content: >
      Johannes Kepler formulated three empirical laws governing orbital motion:

      1. **The Law of Ellipses**: All planets move in elliptical orbits, with the Sun at one focus. Circular orbits are just a special case of an ellipse where the eccentricity is zero.

      2. **The Law of Equal Areas**: A line drawn from the Sun to any planet sweeps out equal areas in equal time intervals. This implies that a planet moves faster when it is closer to the Sun (perihelion) and slower when it is farther away (aphelion).

      3. **The Law of Harmonies**: As derived above, the ratio of the squares of the periods of any two planets is equal to the ratio of the cubes of their average distances from the Sun.
    media:
    - type: image
      src: /media/physics/owa/kepler-orbit-laws.svg
      alt: Elliptical orbit with central body at a focus and equal-area sectors near perihelion and aphelion.
      caption: Equal-area sectors in equal times require faster motion near the central body.
    check:
      id: check-3
      type: multipleChoice
      prompt: >
        According to Kepler's Second Law, when does a comet moving in a highly elliptical orbit travel the fastest?
      choices:
      - id: a
        text: When it is farthest from the Sun.
        media: []
        issueSignals: []
      - id: b
        text: When it is closest to the Sun.
        media: []
        issueSignals: []
      - id: c
        text: It travels at a constant speed throughout its orbit.
        media: []
        issueSignals: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        When it is closest to the Sun.


        Why it works:

        To sweep out equal areas in equal times, the comet must move much faster along its orbital path when its radius vector (distance to the Sun) is short. This also perfectly aligns with the conservation of angular momentum ($L = mvr$).


        Why the other choices fail:

        At the farthest point (aphelion), the comet moves the slowest because its radius vector is very long. Circular orbits have constant speed, but highly elliptical orbits do not.
