questions:
- id: q001
  type: multipleChoice
  prompt: 'A polygon has 9 sides. What is the mathematical name for this shape?'
  difficultyDimensions:
  - Recall the prefix for 9 sides.
  - Connect the prefix 'nona-' to the number 9.
  choices:
  - id: a
    text: 'Heptagon'
    issueSignals:
    - 7-sided-confusion
  - id: b
    text: 'Nonagon'
  - id: c
    text: 'Decagon'
    issueSignals:
    - 10-sided-confusion
  - id: d
    text: 'Dodecagon'
    issueSignals:
    - 12-sided-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    A 9-sided polygon is called a nonagon.

    Why it works:
    The prefix "nona-" comes from Latin for ninth, whereas most other common polygon prefixes (like hexa, hepta, octa) come from Greek. Sometimes a 9-sided shape is called an enneagon (Greek prefix), but nonagon is far more common.

    Why the other choices fail:
    - Heptagon = 7 sides.
    - Decagon = 10 sides.
    - Dodecagon = 12 sides.

- id: q002
  type: multipleChoice
  prompt: 'What is the sum of the interior angles of a convex octagon?'
  difficultyDimensions:
  - Identify $n = 8$.
  - Apply the formula: $(n - 2) \times 180^\circ$.
  - Calculate: $6 \times 180 = 1080^\circ$.
  choices:
  - id: a
    text: '$1440^\circ$'
    issueSignals:
    - formula-n-error
  - id: b
    text: '$1080^\circ$'
  - id: c
    text: '$1260^\circ$'
    issueSignals:
    - 9-sided-confusion
  - id: d
    text: '$360^\circ$'
    issueSignals:
    - exterior-sum-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    An octagon has 8 sides ($n=8$).
    The sum of the interior angles is given by the formula:
    $\text{Sum} = (n - 2) \times 180^\circ$
    $\text{Sum} = (8 - 2) \times 180^\circ$
    $\text{Sum} = 6 \times 180^\circ = 1080^\circ$.

    Why it works:
    By drawing all possible diagonals from a single vertex of an octagon, you will perfectly divide the octagon into 6 distinct triangles. Since each triangle holds $180^\circ$, the total is $6 \times 180^\circ$.

    Why the other choices fail:
    - $1440^\circ$ is $8 \times 180^\circ$, forgetting to subtract 2.
    - $1260^\circ$ is the sum for a nonagon (9 sides).
    - $360^\circ$ is the sum of the *exterior* angles.

- id: q003
  type: multipleChoice
  prompt: 'What is the measure of a single exterior angle of a regular hexagon?'
  difficultyDimensions:
  - Identify $n = 6$.
  - Recall the sum of exterior angles is always $360^\circ$.
  - Divide by $n$: $360 / 6 = 60^\circ$.
  choices:
  - id: a
    text: '$120^\circ$'
    issueSignals:
    - interior-angle-confusion
  - id: b
    text: '$60^\circ$'
  - id: c
    text: '$90^\circ$'
    issueSignals:
    - square-confusion
  - id: d
    text: '$72^\circ$'
    issueSignals:
    - pentagon-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    A hexagon has 6 sides ($n=6$).
    The sum of all exterior angles for any convex polygon is $360^\circ$.
    Since the hexagon is regular, all 6 exterior angles are equal.
    $\text{Single exterior angle} = \frac{360^\circ}{6} = 60^\circ$.

    Why it works:
    Imagine walking around the edge of the hexagon. You make 6 equal turns. After the 6th turn, you are facing your original direction, meaning you turned a total of $360^\circ$. Each turn must have been $60^\circ$.

    Why the other choices fail:
    - $120^\circ$ is the measure of a single *interior* angle of a regular hexagon ($180 - 60 = 120$).
    - $90^\circ$ is the exterior angle of a square.
    - $72^\circ$ is the exterior angle of a regular pentagon ($360 / 5$).

- id: q004
  type: multipleChoice
  prompt: 'If a single interior angle of a regular polygon measures $144^\circ$, how many sides does the polygon have?'
  difficultyDimensions:
  - Find the exterior angle: $180 - 144 = 36^\circ$.
  - Use the exterior sum formula: $360 / 36 = 10$.
  choices:
  - id: a
    text: '$8$'
    issueSignals:
    - algebra-error
  - id: b
    text: '$10$'
  - id: c
    text: '$12$'
    issueSignals:
    - division-error
  - id: d
    text: '$9$'
    issueSignals:
    - nonagon-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    **Method 1 (Exterior Angle Shortcut):**
    The interior and exterior angles always form a linear pair (they sum to $180^\circ$).
    Exterior angle = $180^\circ - 144^\circ = 36^\circ$.
    The sum of all exterior angles is always $360^\circ$.
    $n = \frac{360^\circ}{36^\circ} = 10$ sides.

    **Method 2 (Interior Formula):**
    $\frac{(n-2) \times 180}{n} = 144$
    $180n - 360 = 144n$
    $36n = 360 \implies n = 10$.

    Why it works:
    Working with the exterior angles is almost always faster because the sum ($360^\circ$) never changes, completely removing the $n$ variable from the other side of the equation.

    Why the other choices fail:
    - $8$ is an octagon (interior angle $135^\circ$).
    - $12$ is a dodecagon (interior angle $150^\circ$).
    - $9$ is a nonagon (interior angle $140^\circ$).

- id: q005
  type: multipleChoice
  prompt: 'Four of the exterior angles of a convex pentagon measure $80^\circ$, $75^\circ$, $65^\circ$, and $85^\circ$. What is the measure of the fifth exterior angle?'
  difficultyDimensions:
  - Recall the sum of exterior angles of any convex polygon is $360^\circ$.
  - Add the four known angles: $80 + 75 + 65 + 85 = 305^\circ$.
  - Subtract from $360$: $360 - 305 = 55^\circ$.
  choices:
  - id: a
    text: '$55^\circ$'
  - id: b
    text: '$235^\circ$'
    issueSignals:
    - interior-sum-confusion
  - id: c
    text: '$65^\circ$'
    issueSignals:
    - arithmetic-error
  - id: d
    text: '$125^\circ$'
    issueSignals:
    - interior-angle-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    The sum of the exterior angles of ANY convex polygon is $360^\circ$.
    Let $x$ be the fifth exterior angle.
    $80^\circ + 75^\circ + 65^\circ + 85^\circ + x = 360^\circ$
    $305^\circ + x = 360^\circ$
    $x = 55^\circ$.

    Why it works:
    The $360^\circ$ exterior sum rule does not require the polygon to be regular. It works for any convex polygon.

    Why the other choices fail:
    - $235^\circ$ assumes the sum of exterior angles is $540^\circ$ (which is actually the sum of the *interior* angles of a pentagon). $540 - 305 = 235$.
    - $65^\circ$ is just an arithmetic mistake (e.g. $360 - 295$).
    - $125^\circ$ is the interior angle adjacent to the correct $55^\circ$ exterior angle ($180 - 55 = 125$).
