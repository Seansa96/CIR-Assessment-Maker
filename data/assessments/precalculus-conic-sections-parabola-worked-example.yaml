workedExamples:
- id: we-1
  title: 'Worked Example'
  problem: 'Find the vertex, focus, and directrix of the parabola given by $y^2 + 8y - 4x + 28 = 0$.'
  steps:
  - id: step-1
    title: 'Group terms to complete the square'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      The equation has a $y^2$ term but only a linear $x$ term. This tells us it's a parabola that opens horizontally.
      
      We need to keep the $y$ terms on the left side and move the $x$ term and constant to the right side:
      
      $$ y^2 + 8y = 4x - 28 $$
  - id: step-2
    title: 'Complete the square'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Take half of the $y$ coefficient ($8 / 2 = 4$) and square it ($4^2 = 16$).
      Add 16 to *both* sides of the equation:
      
      $$ y^2 + 8y + \mathbf{16} = 4x - 28 + \mathbf{16} $$
      
      Factor the left side and simplify the right side:
      $$ (y + 4)^2 = 4x - 12 $$
  - id: step-3
    title: 'Factor the right side to find standard form'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      To match the standard form $(y - k)^2 = 4p(x - h)$, we must factor out the coefficient of $x$ on the right side.
      
      Factor out the 4:
      $$ (y + 4)^2 = 4(x - 3) $$
      
      This is the standard form of the parabola.
  - id: step-4
    title: 'Identify the vertex'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      From the standard form $(y - k)^2 = 4p(x - h)$, we can immediately identify the vertex $(h, k)$.
      
      Notice the signs:
      $x - 3 \implies h = 3$
      $y + 4 \implies k = -4$
      
      The vertex is $(3, -4)$.
  - id: step-5
    title: 'Find the parameter $p$ and direction of opening'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      The coefficient in front of the $x$ parentheses is $4p$.
      
      $$ 4p = 4 \implies p = 1 $$
      
      Because $p$ is positive and the $y$-term is squared, the parabola opens to the **right**.
  - id: step-6
    title: 'Calculate the focus and directrix'
    type: freeResponse
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Since the parabola opens to the right, the focus is $p$ units to the right of the vertex, and the directrix is a vertical line $p$ units to the left.
      
      - **Focus:** Add $p$ to the $x$-coordinate of the vertex.
        $(h + p, k) = (3 + 1, -4) = (4, -4)$.
        
      - **Directrix:** Subtract $p$ from the $x$-coordinate. The line is $x = h - p$.
        $x = 3 - 1 \implies x = 2$.
        
      **Final Answer:**
      - **Vertex:** $(3, -4)$
      - **Focus:** $(4, -4)$
      - **Directrix:** $x = 2$

