questions:
  - id: ca-geom-b-1
    title: Area with dy Differential
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      Find the exact area of the region enclosed by $x = 2y^2$ and $x = 4 + y^2$.
    answer:
      gradingMode: auto
      expectedLatex: \frac{32}{3}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Intersections: $2y^2 = 4 + y^2 \implies y^2 = 4 \implies y = \pm 2$.
      2. The rightmost curve is $x = 4 + y^2$. The leftmost curve is $x = 2y^2$.
      3. $A = \int_{-2}^2 (4 + y^2 - 2y^2) \, dy = \int_{-2}^2 (4 - y^2) \, dy$.
      4. $A = \left[ 4y - \frac{1}{3}y^3 \right]_{-2}^2 = \left(8 - \frac{8}{3}\right) - \left(-8 + \frac{8}{3}\right) = 16 - \frac{16}{3} = \frac{32}{3}$.

  - id: ca-geom-b-2
    title: Area Integral Setup (dx vs dy)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      Consider the region bounded by $y = \sqrt{x-2}$, the x-axis, and $x = 11$. 
      Which of the following pairs of integrals correctly represent the area of this region using $dx$ and $dy$ respectively?
    choices:
      - id: a
        text: $A_{dx} = \int_2^{11} \sqrt{x-2} \, dx$ and $A_{dy} = \int_0^3 (9 - y^2) \, dy$
      - id: b
        text: $A_{dx} = \int_2^{11} \sqrt{x-2} \, dx$ and $A_{dy} = \int_0^3 (11 - (y^2+2)) \, dy$
      - id: c
        text: Both A and B correctly represent the Area.
      - id: d
        text: $A_{dx} = \int_2^{11} \sqrt{x-2} \, dx$ and $A_{dy} = \int_0^3 (y^2 + 2 - 11) \, dy$
    answer:
      choiceId: b
    explanation: |
      1. With $dx$: Top curve is $\sqrt{x-2}$, bottom is $0$. $x$ goes from 2 to 11. $\int_2^{11} \sqrt{x-2} \, dx$.
      2. With $dy$: Rearrange to $x = y^2 + 2$. At $x=11$, $y=3$. The Right curve is $x=11$, Left curve is $x=y^2+2$.
      3. $\int_0^3 (11 - (y^2+2)) \, dy$.
      Note: Choice A is mathematically equivalent after simplification, but B explicitly shows the "Right - Left" setup requested. (Wait, let's accept B as the most direct translation).

  - id: ca-geom-b-3
    title: Volume by Cross Sections (Semicircles, dy)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = \sqrt{x-2}$, the x-axis, and $x=11$ is the base of a solid where cross sections perpendicular to the y-axis are semicircles. 
      
      Determine the exact volume of the solid.
    answer:
      gradingMode: auto
      expectedLatex: \frac{81\pi}{5}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Slices perpendicular to y-axis $\implies dy$. Base spans from $x = y^2+2$ to $x=11$.
      2. Diameter $d = 11 - (y^2+2) = 9-y^2$. Radius $r = \frac{9-y^2}{2}$.
      3. Area of semicircle $A(y) = \frac{1}{2}\pi r^2 = \frac{\pi}{8}(9-y^2)^2 = \frac{\pi}{8}(81 - 18y^2 + y^4)$.
      4. $V = \frac{\pi}{8} \int_0^3 (81 - 18y^2 + y^4) \, dy = \frac{\pi}{8} \left[ 81y - 6y^3 + \frac{1}{5}y^5 \right]_0^3$.
      5. $V = \frac{\pi}{8} \left( 243 - 162 + \frac{243}{5} \right) = \frac{\pi}{8} \left( 81 + 48.6 \right) = \frac{\pi}{8}(129.6) = 16.2\pi = \frac{81\pi}{5}$.

  - id: ca-geom-b-4
    title: Volume of Revolution (x-axis, dy)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y=x^3$, the x-axis, and $x=2$ is rotated about the x-axis. 
      
      Which integral correctly uses the differential $dy$ to find the volume?
    choices:
      - id: a
        text: $\int_0^8 2\pi y (2 - \sqrt[3]{y}) \, dy$
      - id: b
        text: $\int_0^8 \pi (2^2 - (\sqrt[3]{y})^2) \, dy$
      - id: c
        text: $\int_0^8 2\pi y (\sqrt[3]{y}) \, dy$
      - id: d
        text: $\int_0^2 2\pi x (\sqrt[3]{x}) \, dx$
    answer:
      choiceId: a
    explanation: |
      1. Rotation about x-axis with $dy$ requires the Cylindrical Shells method.
      2. Radius $r = y$. Height $h = x_{right} - x_{left} = 2 - \sqrt[3]{y}$.
      3. $V = \int_0^8 2\pi y (2 - \sqrt[3]{y}) \, dy$.

  - id: ca-geom-b-5
    title: Volume of Revolution (y-axis, dy)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y=x^3$, the x-axis, and $x=2$ is rotated about the y-axis. 
      
      Which integral correctly uses the differential $dy$ to find the volume?
    choices:
      - id: a
        text: $\int_0^8 \pi \left[ 2^2 - (y^{1/3})^2 \right] \, dy$
      - id: b
        text: $\int_0^8 2\pi y (2 - y^{1/3}) \, dy$
      - id: c
        text: $\int_0^8 \pi \left[ (y^{1/3})^2 \right] \, dy$
      - id: d
        text: $\int_0^8 \pi \left[ (2 - y^{1/3})^2 \right] \, dy$
    answer:
      choiceId: a
    explanation: |
      1. Rotation about y-axis with $dy$ requires the Washer method.
      2. Outer radius $R = 2$. Inner radius $r = x_{curve} = y^{1/3}$.
      3. $V = \int_0^8 \pi (R^2 - r^2) \, dy = \int_0^8 \pi [4 - y^{2/3}] \, dy$.

  - id: ca-geom-b-6
    title: Volume of Revolution (Parabola, y-axis, Shells)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = 10x - x^2$ and the x-axis is rotated about the y-axis.
      
      Determine the exact volume of the solid.
    answer:
      gradingMode: auto
      expectedLatex: \frac{5000\pi}{3}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Roots of parabola: $x=0, x=10$.
      2. Rotation about y-axis using $dx$ implies the Shell method.
      3. $V = \int_0^{10} 2\pi x (10x - x^2) \, dx = 2\pi \int_0^{10} (10x^2 - x^3) \, dx$.
      4. $V = 2\pi \left[ \frac{10}{3}x^3 - \frac{1}{4}x^4 \right]_0^{10} = 2\pi \left( \frac{10000}{3} - 2500 \right) = 2\pi \left( \frac{10000}{3} - \frac{7500}{3} \right) = 2\pi \left( \frac{2500}{3} \right) = \frac{5000\pi}{3}$.

  - id: ca-geom-b-7
    title: Volume Setup (Two Curves, x-axis)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = x^2 - 2x + 2$ and $y = 2x - 1$ is rotated about the x-axis.
      
      Which integral expression correctly represents the volume?
    choices:
      - id: a
        text: $\int_1^3 \pi \left[ (2x - 1)^2 - (x^2 - 2x + 2)^2 \right] \, dx$
      - id: b
        text: $\int_1^3 \pi \left[ (2x - 1) - (x^2 - 2x + 2) \right]^2 \, dx$
      - id: c
        text: $\int_1^3 2\pi x \left[ (2x - 1) - (x^2 - 2x + 2) \right] \, dx$
    answer:
      choiceId: a
    explanation: |
      1. Intersections at $x=1, x=3$. Upper curve is $2x-1$.
      2. Rotation about x-axis requires the Washer method.
      3. Outer radius $R = 2x-1$. Inner radius $r = x^2-2x+2$.
      4. $V = \int_1^3 \pi (R^2 - r^2) \, dx$.

  - id: ca-geom-b-8
    title: Volume Setup (Two Curves, Shifted Vertical Axis)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = x^2 - 2x + 2$ and $y = 2x - 1$ is rotated about the line $x = 5$.
      
      Which integral expression correctly represents the volume?
    choices:
      - id: a
        text: $\int_1^3 2\pi (5 - x) \left[ (2x - 1) - (x^2 - 2x + 2) \right] \, dx$
      - id: b
        text: $\int_1^3 2\pi (x - 5) \left[ (2x - 1) - (x^2 - 2x + 2) \right] \, dx$
      - id: c
        text: $\int_1^3 \pi \left[ (5 - (x^2-2x+2))^2 - (5 - (2x-1))^2 \right] \, dx$
    answer:
      choiceId: a
    explanation: |
      1. We use the Shell method for rotation around a vertical axis when integrating with respect to $x$.
      2. The axis of rotation is $x=5$, which is to the right of the region $[1,3]$.
      3. Radius $r = 5 - x$. Height $h = (2x - 1) - (x^2 - 2x + 2)$.
      4. $V = \int_1^3 2\pi (5 - x) h \, dx$.

  - id: ca-geom-b-9
    title: Average Value (Rational Logarithm)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      Determine the exact average value of the function $f(x) = \frac{6x}{x^2 - 25}$ on the interval $[1, 4]$.
    answer:
      gradingMode: auto
      expectedLatex: \ln\left(\frac{3}{8}\right)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. $f_{avg} = \frac{1}{4-1} \int_1^4 \frac{6x}{x^2 - 25} \, dx$.
      2. Let $u = x^2 - 25 \implies du = 2x \, dx$. The integral becomes $3 \int \frac{1}{u} \, du = 3 \ln|x^2 - 25|$.
      3. $f_{avg} = \frac{1}{3} \left[ 3 \ln|x^2 - 25| \right]_1^4 = \ln|16 - 25| - \ln|1 - 25| = \ln|-9| - \ln|-24|$.
      4. $\ln(9) - \ln(24) = \ln(9/24) = \ln(3/8)$.

  - id: ca-geom-b-10
    title: Arc Length Evaluation
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      Determine the exact length of the portion of $y = 4x^{3/2}$ on the interval $\left[ \frac{1}{12}, \frac{2}{9} \right]$.
    answer:
      gradingMode: auto
      expectedLatex: \frac{19}{54}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. $y' = 6x^{1/2} \implies (y')^2 = 36x$.
      2. $L = \int_{1/12}^{2/9} \sqrt{1 + 36x} \, dx$. Let $u = 1+36x \implies du = 36 \, dx$.
      3. $\int u^{1/2} \frac{du}{36} = \frac{1}{36} \left( \frac{2}{3}u^{3/2} \right) = \frac{1}{54} (1+36x)^{3/2}$.
      4. Evaluate bounds: $\frac{1}{54} \left( (1 + 36(2/9))^{3/2} - (1 + 36(1/12))^{3/2} \right)$.
      5. $\frac{1}{54} \left( (1+8)^{3/2} - (1+3)^{3/2} \right) = \frac{1}{54} (9^{3/2} - 4^{3/2}) = \frac{1}{54} (27 - 8) = \frac{19}{54}$.

  - id: ca-geom-b-11
    title: Arc Length of Logarithm (dy)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      Consider the curve defined by $f(x) = \ln(x)$ on the interval $1 \le x \le e^4$. 
      Which integral, using the differential $dy$, represents the length of the portion of the curve?
    choices:
      - id: a
        text: $\int_0^4 \sqrt{1 + e^{2y}} \, dy$
      - id: b
        text: $\int_1^{e^4} \sqrt{1 + e^{2y}} \, dy$
      - id: c
        text: $\int_0^4 \sqrt{1 + e^y} \, dy$
      - id: d
        text: $\int_0^4 \sqrt{1 + \ln(y)^2} \, dy$
    answer:
      choiceId: a
    explanation: |
      1. Convert to $x=f(y)$: $y = \ln x \implies x = e^y$.
      2. Find y-bounds: When $x=1$, $y=0$. When $x=e^4$, $y=4$. Interval is $y \in [0,4]$.
      3. Derivative: $x' = e^y$.
      4. $L = \int_c^d \sqrt{1 + (x')^2} \, dy = \int_0^4 \sqrt{1 + (e^y)^2} \, dy = \int_0^4 \sqrt{1 + e^{2y}} \, dy$.

  - id: ca-geom-b-12
    title: Surface Area Setup (y-axis)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      Consider the object created by revolving $y = \sqrt[3]{3x}$ for $y \in [0, 2]$ about the y-axis. 
      Which integral expression correctly represents the surface area of the object?
    choices:
      - id: a
        text: $\int_0^2 2\pi \left(\frac{y^3}{3}\right) \sqrt{1 + y^4} \, dy$
      - id: b
        text: $\int_0^2 2\pi y \sqrt{1 + y^4} \, dy$
      - id: c
        text: $\int_0^2 2\pi \left(\frac{y^3}{3}\right) \sqrt{1 + (y^2)^2} \, dx$
    answer:
      choiceId: a
    explanation: |
      1. Isolate x: $y^3 = 3x \implies x = \frac{1}{3}y^3$.
      2. Derivative $x' = y^2$.
      3. Surface area about y-axis is $S = \int 2\pi x \sqrt{1+(x')^2} \, dy$.
      4. $S = \int_0^2 2\pi \left(\frac{y^3}{3}\right) \sqrt{1 + y^4} \, dy$.

  - id: ca-geom-b-13
    title: Center of Mass (Mass integral setup)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      Determine the total Area (Mass) integral setup for the region bounded by $y = \frac{1}{2}x$ and $y = \frac{1}{4}x^2 - 2x + 4$.
    choices:
      - id: a
        text: $M = \int_2^8 \left( -\frac{1}{4}x^2 + \frac{5}{2}x - 4 \right) \, dx$
      - id: b
        text: $M = \int_2^8 \left( \frac{1}{4}x^2 - \frac{3}{2}x + 4 \right) \, dx$
      - id: c
        text: $M = \int_0^8 \left( -\frac{1}{4}x^2 + \frac{5}{2}x - 4 \right) \, dx$
    answer:
      choiceId: a
    explanation: |
      1. Intersections: $\frac{1}{2}x = \frac{1}{4}x^2 - 2x + 4 \implies x = \frac{1}{2}x^2 - 4x + 8 \implies \frac{1}{2}x^2 - \frac{9}{2}x + 8 = 0 \implies x^2 - 9x + 16 = 0$. Wait, $1/4x^2 - 5/2x + 4 = 0 \implies x^2 - 10x + 16 = 0 \implies (x-2)(x-8)=0$.
      2. Intersections at $x=2$ and $x=8$.
      3. The line is above the parabola on this interval.
      4. $M = \int_2^8 \left( \frac{1}{2}x - (\frac{1}{4}x^2 - 2x + 4) \right) \, dx = \int_2^8 \left( -\frac{1}{4}x^2 + \frac{5}{2}x - 4 \right) \, dx$.
