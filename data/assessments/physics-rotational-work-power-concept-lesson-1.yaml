lesson:
  introduction: This lesson covers the primary definitions and equations governing
    Rotational Work Power.
  sections:
  - id: sec-1
    title: Defining Rotational Work Power
    content: The physics of Rotational Work Power requires a solid understanding of
      both rotational kinematics and dynamics. The core principles mirror linear mechanics
      but account for radial distribution of mass and rotational axes. For example,
      torque relates to angular acceleration via $\tau = I\alpha$.
    media:
    - type: image
      src: /media/physics/owa/torque-lever.svg
      alt: Lever with a force and perpendicular lever arm.
      caption: Torque times angular displacement determines rotational work.
    check:
      id: chk-physics-rotational-work-power-1
      type: multipleChoice
      prompt: Which of the following best describes a key principle of Rotational
        Work Power?
      choices:
      - id: a
        text: It depends strictly on linear mass alone.
        issueSignals:
        - id: linear-angular-confusion
        - id: inertia-mass-confusion
      - id: b
        text: It involves the relationship between forces, torques, and mass distribution.
      - id: c
        text: It is independent of the axis of rotation.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        It involves the relationship between forces, torques, and mass distribution.


        Why it works:

        Rotational mechanics always heavily relies on mass distribution and torques.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Rotational Work
    content: 'A constant torque parallel to the angular displacement does work $W=\tau\Delta\theta$.'
    media: []
    check: { id: chk-rwp-5, type: multipleChoice, prompt: 'A 4 N m torque turns a wheel 3 rad. What work is done?', choices: [{ id: a, text: '$1.3$ J' }, { id: b, text: '$7$ J' }, { id: c, text: '$12$ J' }, { id: d, text: '$24$ J' }], answer: { choiceId: c }, explanation: 'Solution: $W=\tau\theta=(4)(3)=12$ J.\n\nWhy it works: Rotational work is torque times angular displacement.\n\nWhy the other choices fail: They divide, add, or double instead of multiplying.' }
  - id: sec-4
    title: Rotational Kinetic Energy
    content: 'Rotating bodies store kinetic energy $K_{rot}=\tfrac12I\omega^2$.'
    media: []
    check: { id: chk-rwp-6, type: multipleChoice, prompt: 'If angular speed doubles with fixed inertia, rotational kinetic energy becomes:', choices: [{ id: a, text: half }, { id: b, text: twice }, { id: c, text: four times }, { id: d, text: unchanged }], answer: { choiceId: c }, explanation: 'Solution: It becomes four times as large.\n\nWhy it works: Energy depends on $\omega^2$.\n\nWhy the other choices fail: They treat the square dependence as linear or absent.' }
  - id: sec-5
    title: Instantaneous Power
    content: 'Instantaneous rotational power is $P=\tau\omega$ when torque and angular velocity align.'
    media: []
    check: { id: chk-rwp-7, type: multipleChoice, prompt: 'A shaft has torque 10 N m and angular speed 20 rad/s. What is its power?', choices: [{ id: a, text: '$0.5$ W' }, { id: b, text: '$30$ W' }, { id: c, text: '$200$ W' }, { id: d, text: '$2000$ W' }], answer: { choiceId: c }, explanation: 'Solution: $P=\tau\omega=(10)(20)=200$ W.\n\nWhy it works: Power is torque times angular speed.\n\nWhy the other choices fail: They use addition, division, or an extra factor of ten.' }
  - id: sec-6
    title: Units
    content: 'Torque has units N m, but work and energy have units J; radians are dimensionless in SI formulas.'
    media: []
    check: { id: chk-rwp-8, type: multipleChoice, prompt: 'What is the SI unit of rotational power?', choices: [{ id: a, text: J }, { id: b, text: W }, { id: c, text: N m }, { id: d, text: rad }], answer: { choiceId: b }, explanation: 'Solution: It is watt (W).\n\nWhy it works: Power is energy per time.\n\nWhy the other choices fail: The others are energy, torque, and angle units.' }
  - id: sec-7
    title: Work-Energy Connection
    content: 'Net rotational work changes rotational kinetic energy: $W_{net}=\Delta K_{rot}$.'
    media: []
    check: { id: chk-rwp-9, type: multipleChoice, prompt: 'Positive net rotational work causes rotational kinetic energy to:', choices: [{ id: a, text: decrease }, { id: b, text: remain zero }, { id: c, text: increase }, { id: d, text: become torque }], answer: { choiceId: c }, explanation: 'Solution: It increases.\n\nWhy it works: $W_{net}=\Delta K_{rot}$.\n\nWhy the other choices fail: Positive work gives positive energy change.' }
  - id: sec-2
    title: Mathematical Formulas
    content: The mathematical framework often relies on cross products and integrals.
      Ensuring consistent units (radians for angular measures) is critical. $L = I\omega$
      and $\tau = \vec{r} \times \vec{F}$ are foundational.
    media: []
    check:
      id: chk-physics-rotational-work-power-2
      type: multipleChoice
      prompt: What unit is essential when using rotational kinematic formulas?
      choices:
      - id: a
        text: Degrees
        issueSignals:
        - id: unit-conversion-error
      - id: b
        text: Radians
      - id: c
        text: Revolutions
        issueSignals:
        - id: unit-conversion-error
      answer:
        choiceId: b
      explanation: 'Solution:

        Radians


        Why it works:

        Radians are the natural mathematical unit tying arc length to radius.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
