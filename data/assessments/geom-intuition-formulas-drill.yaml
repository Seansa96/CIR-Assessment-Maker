- id: drill-semicircle-area
  type: symbolic
  prompt: Formula for the area of a semicircle of radius $r$.
  answer:
    expectedLatex: \frac{1}{2}\pi r^2
    aliases:
    - 0.5*pi*r^2
    - pi*r^2/2
- id: drill-triangle-area
  type: symbolic
  prompt: Formula for the area of a triangle with base $b$ and height $h$.
  answer:
    expectedLatex: \frac{1}{2}bh
    aliases:
    - 0.5*b*h
    - bh/2
