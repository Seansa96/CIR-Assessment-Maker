questions:
- id: econf-q01
  title: Aufbau Principle
  type: multipleChoice
  prompt: |-
    An electron is written in 3p while 3s is not full. Which principle explains why this cannot be a ground-state configuration?
  choices:
  - id: a
    text: The Aufbau Principle
    issueSignals: []
  - id: b
    text: Pauli Exclusion Principle
    issueSignals:
    - id: electron-configuration-aufbau-order-error
      domains:
      - chemistry
  - id: c
    text: Hund's Rule
    issueSignals:
    - id: electron-configuration-aufbau-order-error
      domains:
      - chemistry
  - id: d
    text: Heisenberg Uncertainty Principle
    issueSignals:
    - id: electron-configuration-aufbau-order-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Since 3s is not full while 3p already contains an electron, the configuration puts an electron into a higher-energy subshell too early. The relevant principle is Aufbau.

    Why it works: The Aufbau principle fills the lowest-energy available orbital before a higher-energy orbital.

    Why the other choices fail: Pauli concerns duplicate four-quantum-number states; Hund concerns distribution among equal-energy orbitals; Heisenberg describes limits on simultaneous position and momentum.
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: |-
    Reads the subshell sequence in a written configuration, then diagnoses the premature move into 3p while 3s remains available.
- id: econf-q02
  title: Pauli Exclusion Principle
  type: multipleChoice
  prompt: |-
    Why can a single atomic orbital hold a maximum of only two electrons?
  choices:
  - id: a
    text: Because of the Pauli Exclusion Principle, which states that no two electrons in an atom can have the same four
      quantum numbers.
    issueSignals: []
  - id: b
    text: Because of Hund's Rule, which states that electrons must pair up.
    issueSignals:
    - id: electron-configuration-pauli-exclusion-error
      domains:
      - chemistry
  - id: c
    text: Because electrons repel each other so strongly that a third would be ejected.
    issueSignals:
    - id: electron-configuration-pauli-exclusion-error
      domains:
      - chemistry
  - id: d
    text: Because orbitals are physically too small to fit more than two electrons.
    issueSignals:
    - id: electron-configuration-pauli-exclusion-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Electrons in one orbital share n, l, and ml. Only two distinct spin values are available, so a third electron would repeat all four quantum numbers.

    Why it works: The Pauli exclusion principle forbids two electrons in an atom from having the same complete set of four quantum numbers.

    Why the other choices fail: Hund’s rule describes equal-energy orbital filling, not orbital capacity; electron repulsion is not the capacity rule; an orbital is a probability state, not a physical container with a size limit.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  difficultyEvidence: |-
    Holds three quantum numbers fixed for electrons in one orbital and applies Pauli to determine whether a third unique spin state exists.
- id: econf-q03
  title: Hund's Rule
  type: multipleChoice
  prompt: |-
    When filling the three degenerate $2p$ orbitals with three electrons (e.g., in a Nitrogen atom), how are they arranged?
  choices:
  - id: a
    text: One electron goes into each of the three $p$ orbitals, all with parallel (same) spins.
    issueSignals: []
  - id: b
    text: Two electrons pair up in the first $p$ orbital, and one goes into the second $p$ orbital.
    issueSignals:
    - id: electron-configuration-hunds-rule-error
      domains:
      - chemistry
  - id: c
    text: All three electrons squeeze into the first $p$ orbital.
    issueSignals:
    - id: electron-configuration-hunds-rule-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Place one electron in each of the three equal-energy 2p orbitals before pairing any of them.

    Why it works: Hund’s rule minimizes repulsion in degenerate orbitals by maximizing unpaired, parallel-spin electrons before pairing.

    Why the other choices fail: Pairing two electrons while the third p orbital is empty violates Hund’s rule; placing all three in one orbital violates the two-electron orbital limit.
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: |-
    Maps three electrons onto three degenerate orbitals, distinguishing Hund distribution from premature pairing and the Pauli capacity limit.
- id: econf-q04
  title: Identifying an Element
  type: multipleChoice
  prompt: |-
    Which neutral element has the ground-state electron configuration $1s^2 2s^2 2p^6 3s^2 3p^4$?
  choices:
  - id: a
    text: Sulfur (S)
    issueSignals: []
  - id: b
    text: Oxygen (O)
    issueSignals:
    - id: electron-configuration-electron-count-error
      domains:
      - chemistry
  - id: c
    text: Phosphorus (P)
    issueSignals:
    - id: electron-configuration-electron-count-error
      domains:
      - chemistry
  - id: d
    text: Chlorine (Cl)
    issueSignals:
    - id: electron-configuration-electron-count-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Add the superscripts: 2+2+6+2+4=16 electrons. A neutral atom with 16 electrons has atomic number 16, sulfur.

    Why it works: For a neutral atom, electron count equals proton count and therefore equals atomic number.

    Why the other choices fail: Oxygen has 8 electrons, phosphorus has 15, and chlorine has 17; none matches the sum of the configuration.
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  difficultyEvidence: |-
    Adds the subshell superscripts and translates the total electron count into the matching neutral element atomic number.
- id: econf-q05
  title: Noble Gas Notation
  type: multipleChoice
  prompt: |-
    What is the correct noble gas core notation for Calcium (Ca, atomic number 20)?
  choices:
  - id: a
    text: $[\text{Ar}]\, 4s^2$
    issueSignals: []
  - id: b
    text: $[\text{Ne}]\, 3s^2 3p^6 4s^2$
    issueSignals:
    - id: electron-configuration-noble-gas-core-error
      domains:
      - chemistry
  - id: c
    text: $[\text{Kr}]\, 4s^2$
    issueSignals:
    - id: electron-configuration-noble-gas-core-error
      domains:
      - chemistry
  - id: d
    text: $[\text{Ar}]\, 3d^2$
    issueSignals:
    - id: electron-configuration-noble-gas-core-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: The preceding noble gas is argon with 18 electrons. Calcium has 20, leaving two electrons, and the next subshell is 4s.

    Why it works: Noble-gas notation replaces a complete inner-shell configuration and writes the remaining electrons after the bracketed core.

    Why the other choices fail: Neon requires listing the filled 3s and 3p core; krypton has more electrons than calcium; 3d is not the next subshell for calcium.
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  difficultyEvidence: |-
    Selects the preceding noble-gas core from calcium’s atomic number and places the remaining two electrons in the next subshell.
- id: econf-q06
  title: Transition Metal Exceptions
  type: multipleChoice
  prompt: |-
    The expected electron configuration for Copper (Cu) is $[\text{Ar}]\, 4s^2 3d^9$. However, its actual ground-state configuration is an exception to the rules. What is it?
  choices:
  - id: a
    text: $[\text{Ar}]\, 4s^1 3d^{10}$
    issueSignals: []
  - id: b
    text: $[\text{Ar}]\, 3d^{11}$
    issueSignals:
    - id: electron-configuration-transition-metal-exception-error
      domains:
      - chemistry
  - id: c
    text: $[\text{Ar}]\, 4s^2 3d^9$ (It is not an exception)
    issueSignals:
    - id: electron-configuration-transition-metal-exception-error
      domains:
      - chemistry
  - id: d
    text: $[\text{Kr}]\, 4s^1 3d^{10}$
    issueSignals:
    - id: electron-configuration-transition-metal-exception-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Move one 4s electron into 3d. Copper’s ground-state configuration is [Ar] 4s^1 3d^10.

    Why it works: Copper is a known configuration exception; the resulting full 3d subshell is lower in energy than the simple Aufbau prediction for this atom.

    Why the other choices fail: 3d^11 exceeds d capacity; the unadjusted 4s^2 3d^9 is the prediction the prompt identifies as exceptional; krypton is a later noble-gas core and would overcount electrons.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  difficultyEvidence: |-
    Compares copper’s predicted and observed fillings, then transfers one electron while preserving total count and completing 3d.
- id: econf-q07
  title: Valence Electrons from Configuration
  type: numericResponse
  prompt: |-
    Consider the electron configuration of Arsenic (As): $[\text{Ar}]\, 4s^2 3d^{10} 4p^3$. How many **valence electrons** does Arsenic have?
  answer:
    value: 5
    tolerance: 0
  explanation: |-
    Solution: The largest principal number is n=4. Count 4s^2 and 4p^3: 2+3=5 valence electrons.

    Why it works: Main-group valence electrons occupy the outermost principal energy level; the 3d electrons have n=3 and are not in the highest shell.
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  difficultyEvidence: |-
    Identifies the largest principal number, then sums the s and p occupancies in that shell while excluding lower-n d electrons.
- id: econf-q08
  title: Ion Configurations
  type: multipleChoice
  prompt: |-
    When transition metals like Iron (Fe, $[\text{Ar}]\, 4s^2 3d^6$) form cations, from which subshell are the electrons removed FIRST?
  choices:
  - id: a
    text: The $4s$ subshell
    issueSignals: []
  - id: b
    text: The $3d$ subshell
    issueSignals:
    - id: electron-configuration-cation-removal-error
      domains:
      - chemistry
  - id: c
    text: The $3p$ subshell
    issueSignals:
    - id: electron-configuration-cation-removal-error
      domains:
      - chemistry
  - id: d
    text: Whichever has the most electrons
    issueSignals:
    - id: electron-configuration-cation-removal-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Compare the principal numbers: 4s has n=4 and 3d has n=3. Remove from 4s first; losing both gives Fe2+ as [Ar] 3d^6.

    Why it works: For transition-metal cations, electrons are removed from the highest principal shell before lower-n d electrons.

    Why the other choices fail: Removing 3d first ignores the larger n of 4s; 3p is part of the argon core; electron removal is not determined by which subshell has more electrons.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: |-
    Applies the transition-metal ionization rule by comparing principal numbers of occupied 4s and 3d subshells.
- id: econf-q09
  title: Excited State Identification
  type: multipleChoice
  prompt: |-
    Which of the following electron configurations represents an atom in an **excited state**?
  choices:
  - id: a
    text: $1s^2 2s^2 2p^6 3s^1 3p^1$
    issueSignals: []
  - id: b
    text: $1s^2 2s^2 2p^6 3s^2$
    issueSignals:
    - id: electron-configuration-excited-state-error
      domains:
      - chemistry
  - id: c
    text: $1s^2 2s^2 2p^6$
    issueSignals:
    - id: electron-configuration-excited-state-error
      domains:
      - chemistry
  - id: d
    text: $[\text{Ar}]\, 4s^2 3d^5$
    issueSignals:
    - id: electron-configuration-excited-state-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Configuration A has 3p occupied while 3s is not full. The electron has been promoted above an available lower-energy state, so A is excited.

    Why it works: A ground-state configuration follows Aufbau filling; an electron in a higher subshell before a lower one is complete indicates excitation.

    Why the other choices fail: B and C fill all lower-energy subshells before stopping; D is a ground-state configuration of manganese using the argon core.
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: |-
    Checks 3s and 3p occupancy against Aufbau, then distinguishes excitation from ground states with other electron counts.
- id: econf-q10
  title: Paramagnetism
  type: multipleChoice
  prompt: |-
    An element is considered paramagnetic (attracted to a magnetic field) if it has unpaired electrons. Looking at the orbital blocks, which group of elements is guaranteed to be diamagnetic (not attracted) in their ground state?
  choices:
  - id: a
    text: The noble gases (Group 18), because their valence shells are filled and their electrons are paired.
    issueSignals: []
  - id: b
    text: The alkali metals (Group 1), because they only have one s-electron.
    issueSignals:
    - id: electron-configuration-pairing-magnetism-error
      domains:
      - chemistry
  - id: c
    text: The halogens (Group 17), because they are one electron short of an octet.
    issueSignals:
    - id: electron-configuration-pairing-magnetism-error
      domains:
      - chemistry
  - id: d
    text: Transition metals, because they have large d-orbitals.
    issueSignals:
    - id: electron-configuration-pairing-magnetism-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: |-
    Solution: Noble gases have filled valence subshells; their s and p orbitals contain paired electrons, leaving no unpaired electron.

    Why it works: Diamagnetism corresponds to all electrons being paired. Helium has a filled $1s^2$ shell; the other noble gases have filled $ns^2 np^6$ valence shells.

    Why the other choices fail: Group 1 has one valence s electron; Group 17 has one unpaired p electron; transition metals commonly have partially filled d subshells.
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  difficultyEvidence: |-
    Connects periodic-group valence patterns to orbital pairing, then uses unpaired-electron count to classify magnetic behavior.
