questions:
  - id: econf-q01
    title: Aufbau Principle
    type: multipleChoice
    prompt: |
      Which rule or principle states that electrons will fill the lowest energy orbitals available before filling higher energy orbitals?
    choices:
      - id: a
        text: The Aufbau Principle
      - id: b
        text: Pauli Exclusion Principle
      - id: c
        text: Hund's Rule
      - id: d
        text: Heisenberg Uncertainty Principle
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The Aufbau principle (from the German word for "building up") dictates the filling order of orbitals (1s, 2s, 2p, 3s, etc.) from lowest to highest energy.

  - id: econf-q02
    title: Pauli Exclusion Principle
    type: multipleChoice
    prompt: |
      Why can a single atomic orbital hold a maximum of only two electrons?
    choices:
      - id: a
        text: Because of the Pauli Exclusion Principle, which states that no two electrons in an atom can have the same four quantum numbers.
      - id: b
        text: Because of Hund's Rule, which states that electrons must pair up.
      - id: c
        text: Because electrons repel each other so strongly that a third would be ejected.
      - id: d
        text: Because orbitals are physically too small to fit more than two electrons.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The Pauli Exclusion Principle requires that every electron in an atom has a unique set of quantum numbers. If two electrons are in the same orbital (same $n, l, m_l$), they must have opposite spins ($m_s = +1/2, -1/2$). A third electron would have to duplicate one of those spins, which is forbidden.

  - id: econf-q03
    title: Hund's Rule
    type: multipleChoice
    prompt: |
      When filling the three degenerate $2p$ orbitals with three electrons (e.g., in a Nitrogen atom), how are they arranged?
    choices:
      - id: a
        text: One electron goes into each of the three $p$ orbitals, all with parallel (same) spins.
      - id: b
        text: Two electrons pair up in the first $p$ orbital, and one goes into the second $p$ orbital.
      - id: c
        text: All three electrons squeeze into the first $p$ orbital.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Hund's Rule states that for degenerate orbitals (like the three $p$ orbitals), the lowest energy configuration maximizes the number of unpaired electrons with parallel spins. This minimizes electron-electron repulsion.

  - id: econf-q04
    title: Identifying an Element
    type: multipleChoice
    prompt: |
      Which neutral element has the ground-state electron configuration $1s^2 2s^2 2p^6 3s^2 3p^4$?
    choices:
      - id: a
        text: Sulfur (S)
      - id: b
        text: Oxygen (O)
      - id: c
        text: Phosphorus (P)
      - id: d
        text: Chlorine (Cl)
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Add up the superscripts (electrons): $2 + 2 + 6 + 2 + 4 = 16$. In a neutral atom, 16 electrons means 16 protons, which corresponds to Sulfur (atomic number 16).

  - id: econf-q05
    title: Noble Gas Notation
    type: multipleChoice
    prompt: |
      What is the correct noble gas core notation for Calcium (Ca, atomic number 20)?
    choices:
      - id: a
        text: $[\text{Ar}]\, 4s^2$
      - id: b
        text: $[\text{Ne}]\, 3s^2 3p^6 4s^2$
      - id: c
        text: $[\text{Kr}]\, 4s^2$
      - id: d
        text: $[\text{Ar}]\, 3d^2$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The preceding noble gas to Calcium is Argon (Ar, atomic number 18). Argon accounts for the first 18 electrons ($1s^2 2s^2 2p^6 3s^2 3p^6$). Calcium has 20, so the remaining two go into the $4s$ orbital.

  - id: econf-q06
    title: Transition Metal Exceptions
    type: multipleChoice
    prompt: |
      The expected electron configuration for Copper (Cu) is $[\text{Ar}]\, 4s^2 3d^9$. However, its actual ground-state configuration is an exception to the rules. What is it?
    choices:
      - id: a
        text: $[\text{Ar}]\, 4s^1 3d^{10}$
      - id: b
        text: $[\text{Ar}]\, 3d^{11}$
      - id: c
        text: $[\text{Ar}]\, 4s^2 3d^9$ (It is not an exception)
      - id: d
        text: $[\text{Kr}]\, 4s^1 3d^{10}$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** A completely full d-subshell ($d^{10}$) is particularly stable. Copper promotes one electron from the $4s$ orbital to the $3d$ orbital to achieve this extra stability, resulting in $4s^1 3d^{10}$. (Chromium does a similar thing to achieve a half-filled $d^5$ shell).

  - id: econf-q07
    title: Valence Electrons from Configuration
    type: numericResponse
    prompt: |
      Consider the electron configuration of Arsenic (As): $[\text{Ar}]\, 4s^2 3d^{10} 4p^3$. How many **valence electrons** does Arsenic have?
    answer:
      value: 5
      tolerance: 0
    explanation: |
      Valence electrons are the electrons in the outermost principal energy level (highest $n$). Here, the highest level is $n=4$. The $4s$ orbital has 2, and the $4p$ orbital has 3. Total valence electrons = $2 + 3 = 5$. The $3d$ electrons are inner core electrons.

  - id: econf-q08
    title: Ion Configurations
    type: multipleChoice
    prompt: |
      When transition metals like Iron (Fe, $[\text{Ar}]\, 4s^2 3d^6$) form cations, from which subshell are the electrons removed FIRST?
    choices:
      - id: a
        text: The $4s$ subshell
      - id: b
        text: The $3d$ subshell
      - id: c
        text: The $3p$ subshell
      - id: d
        text: Whichever has the most electrons
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Even though the $4s$ orbital fills *before* the $3d$ orbital, it is also the outermost shell (highest principal quantum number, $n=4$). Therefore, electrons are always removed from the $s$ orbital first when ionizing transition metals. $\text{Fe}^{2+}$ is $[\text{Ar}]\, 3d^6$.

  - id: econf-q09
    title: Excited State Identification
    type: multipleChoice
    prompt: |
      Which of the following electron configurations represents an atom in an **excited state**?
    choices:
      - id: a
        text: $1s^2 2s^2 2p^6 3s^1 3p^1$
      - id: b
        text: $1s^2 2s^2 2p^6 3s^2$
      - id: c
        text: $1s^2 2s^2 2p^6$
      - id: d
        text: $[\text{Ar}]\, 4s^2 3d^5$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** In configuration A, the $3s$ orbital only has 1 electron, but the higher-energy $3p$ orbital already contains an electron. The Aufbau principle was violated, meaning an electron absorbed energy and jumped from $3s$ to $3p$.

  - id: econf-q10
    title: Paramagnetism
    type: multipleChoice
    prompt: |
      An element is considered paramagnetic (attracted to a magnetic field) if it has unpaired electrons. Looking at the orbital blocks, which group of elements is guaranteed to be diamagnetic (not attracted) in their ground state?
    choices:
      - id: a
        text: The noble gases (Group 18), because all their p-orbitals are completely filled and paired.
      - id: b
        text: The alkali metals (Group 1), because they only have one s-electron.
      - id: c
        text: The halogens (Group 17), because they are one electron short of an octet.
      - id: d
        text: Transition metals, because they have large d-orbitals.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Diamagnetic means all electrons are paired. Noble gases end in $p^6$, meaning all three p-orbitals have 2 electrons each. There are no unpaired electrons, so they are diamagnetic. Groups with odd numbers of valence electrons (like Group 1 and 17) will always have at least one unpaired electron.
