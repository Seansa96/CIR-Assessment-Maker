modeDefault: study
randomizeQuestions: false
authoring:
  visualRequirement: required
  visualRationale: One integrated diagram connects local shape, dipole vectors, and intermolecular structure.
  sourceId: src-20260720035703-91ea51b0d8
lesson:
  introduction: Water is a useful integration case because its local VSEPR geometry controls dipole addition, and its polarity
    enables an intermolecular network with observable bulk consequences.
  sections:
  - id: sec1
    title: Bent local geometry
    required: true
    content: Oxygen has two O-H bonding domains and two lone pairs. Four total domains are tetrahedral, but the two atom positions
      form a bent molecular geometry. Lone-pair repulsion compresses the H-O-H angle below the 109.5-degree ideal to about
      104.5 degrees.
    media:
    - type: image
      src: /media/chemistry/water-molecule.svg
      alt: Water molecule showing two lone pairs
      bent O-H bonds: null
      a 104.5-degree angle: null
      and a net dipole toward oxygen.: null
      caption: Electron geometry
      molecular geometry: null
      and dipole addition describe different features of the same molecule.: null
    check:
      id: q1
      type: multipleChoice
      prompt: Why is the H-O-H angle smaller than the ideal tetrahedral angle?
      choices:
      - id: a
        text: Hydrogen atoms are smaller than oxygen.
        issueSignals:
        - id: chemistry-water-structure-property-error
      - id: b
        text: Two oxygen lone pairs repel the bonding domains strongly.
        issueSignals: []
      - id: c
        text: Intermolecular hydrogen bonds create the local electron geometry.
        issueSignals:
        - id: chemistry-water-structure-property-error
      answer:
        choiceId: b
      explanation: 'Solution: The oxygen lone pairs compress the H-O-H angle. Why it works: Lone-pair domains repel adjacent
        bonding domains strongly within the molecule. Why the other choices fail: Atomic size is not the VSEPR cause; intermolecular
        attractions do not define the local domain count.'
  - id: sec2
    title: Shape controls dipole addition
    required: true
    content: Each O-H bond is polar toward oxygen. Because the two bond dipoles meet at a bent angle, their vector sum is
      nonzero. Geometry therefore makes water polar; a hypothetical linear arrangement of equal O-H dipoles would cancel.
    check:
      id: polarity-check
      type: multipleChoice
      prompt: If two identical O-H bond dipoles were arranged exactly 180 degrees apart, what would their vector sum be?
      choices:
      - id: a
        text: Zero
        issueSignals: []
      - id: b
        text: Twice one bond dipole in the oxygen direction
        issueSignals:
        - id: chemistry-water-structure-property-error
      - id: c
        text: Unrelated to geometry
        issueSignals:
        - id: chemistry-water-structure-property-error
      answer:
        choiceId: a
      explanation: 'Solution: Their vector sum would be zero. Why it works: Equal vectors pointing in opposite directions
        cancel. Why the other choices fail: Addition requires aligned vectors, and molecular polarity depends on both bond
        polarity and geometry.'
  - id: sec3
    title: Molecular polarity enables hydrogen bonding
    required: true
    content: A hydrogen covalently bonded to oxygen is strongly partial-positive, while neighboring oxygen lone pairs are
      partial-negative interaction sites. Their attraction is an intermolecular hydrogen bond, distinct from the stronger
      intramolecular O-H covalent bond.
    check:
      id: h-bond-check
      type: selectAll
      prompt: Which pure substances can form conventional hydrogen bonds between their own molecules?
      choices:
      - id: a
        text: $NH_3$
        issueSignals: []
      - id: b
        text: $CH_4$
        issueSignals:
        - id: chemistry-water-structure-property-error
      - id: c
        text: $HF$
        issueSignals: []
      - id: d
        text: $H_2S$
        issueSignals:
        - id: chemistry-water-structure-property-error
      answer:
        choiceIds:
        - a
        - c
      explanation: 'Solution: Select $NH_3$ and $HF$. Why it works: Their molecules contain H directly bonded to N or F and
        an appropriate lone-pair acceptor. Why the other choices fail: C-H and S-H bonds do not produce the conventional strong
        N/O/F hydrogen-bond pattern used here.'
  - id: sec4
    title: A network changes bulk behavior
    required: true
    content: Hydrogen bonds raise the energy needed to separate water molecules. In ice, an open hydrogen-bonded structure
      places molecules farther apart on average than in liquid water, so the solid is less dense. These are collective intermolecular
      effects, not changes in atomic mass or covalent-bond identity.
    check:
      id: properties-check
      type: multipleChoice
      prompt: What directly explains why ice is less dense than liquid water?
      choices:
      - id: a
        text: Oxygen loses mass during freezing.
        issueSignals:
        - id: chemistry-water-structure-property-error
      - id: b
        text: Hydrogen bonding stabilizes a more open solid structure.
        issueSignals: []
      - id: c
        text: The O-H covalent bonds break completely.
        issueSignals:
        - id: chemistry-water-structure-property-error
      - id: d
        text: Air is required inside every crystal.
        issueSignals:
        - id: chemistry-water-structure-property-error
      answer:
        choiceId: b
      explanation: 'Solution: Ice has a more open hydrogen-bonded structure. Why it works: Greater average molecular spacing
        increases volume for the same mass. Why the other choices fail: Atomic mass does not change, O-H bonds remain, and
        trapped air is not the molecular cause.'
