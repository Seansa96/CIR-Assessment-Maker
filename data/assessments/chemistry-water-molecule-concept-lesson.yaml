lesson:
  introduction: |
    Water ($H_2O$) is arguably the most important molecule on Earth. Its unique physical and chemical properties—from its ability to dissolve ions to the fact that ice floats—all stem directly from its 3D molecular geometry and the nature of its covalent bonds.
  sections:
    - id: sec1
      title: The VSEPR Model and Water
      required: true
      content: |
        The Valence Shell Electron Pair Repulsion (VSEPR) theory predicts the geometry of individual molecules based on the number of electron pairs surrounding their central atoms.
        
        In a water molecule ($H_2O$), the central Oxygen atom has **four** regions of electron density:
        * Two bonding pairs (covalent bonds with the Hydrogen atoms).
        * Two lone (non-bonding) pairs of electrons.
        
        While the *electron-pair geometry* is tetrahedral, the massive repulsion from the two lone pairs pushes the Hydrogen atoms closer together, resulting in a **bent** molecular geometry. The ideal tetrahedral angle is 109.5°, but in water, it compresses to roughly **104.5°**.
      media:
        - type: image
          src: /media/chemistry/water-molecule.svg
          alt: "A water molecule showing the Oxygen atom bonded to two Hydrogen atoms with a bond angle of 104.5 degrees."
          caption: "Figure 1: The bent molecular geometry of H2O."
      check:
        id: q1
        type: multipleChoice
        skills:
        - special-chemical-names
        - electron-configurations
        prompt: "Why is the bond angle in a water molecule less than the ideal tetrahedral angle of 109.5°?"
        choices:
          - id: a
            text: "Because Hydrogen atoms are smaller than Oxygen atoms."
          - id: b
            text: "Because the two lone pairs of electrons on Oxygen exert greater repulsion than the bonding pairs."
          - id: c
            text: "Because it forms hydrogen bonds with other water molecules."
        answer:
          choiceId: b
        explanation: |
          According to VSEPR theory, lone pairs of electrons take up more space around the central atom and exert a stronger repulsive force on the bonding pairs, forcing them closer together and decreasing the bond angle.

    - id: sec2
      title: Polarity and Dipole Moment
      required: true
      content: |
        Oxygen is highly electronegative (EN = 3.5), while Hydrogen is much less so (EN = 2.1). Therefore, the O-H covalent bonds are highly **polar**; the oxygen pulls the shared electrons tightly toward itself.
        
        Because the molecule is *bent* (asymmetrical), these two individual bond dipoles do not cancel each other out. Instead, they add together to create a massive **net dipole moment** across the entire molecule. 
        
        The oxygen side of the molecule carries a significant partial negative charge ($\delta^-$), and the hydrogen side carries a partial positive charge ($\delta^+$). This extreme polarity is why water is the "universal solvent," capable of ripping ionic crystals like $NaCl$ apart via ion-dipole interactions.
      check:
        id: polarity-check
        type: multipleChoice
        skills:
        - special-chemical-names
        prompt: If the water molecule were perfectly linear (H-O-H angle of 180°) instead of bent, what would be the result?
        choices:
          - id: a
            text: The O-H bonds would become nonpolar.
          - id: b
            text: The molecule would become a nonpolar molecule with a net dipole of zero.
          - id: c
            text: The molecule would become even more polar.
          - id: d
            text: Oxygen would lose its valence electrons.
        answer:
          choiceId: b
        explanation: |
          If water were linear, the two polar O-H bond dipoles would point in exactly opposite directions and cancel each other out perfectly (just like in $CO_2$). The molecule would be nonpolar, and life as we know it would not exist!

    - id: sec3
      title: Hydrogen Bonding
      required: true
      content: |
        Because the O-H bond is so polar, the highly exposed, positively charged hydrogen nucleus is strongly attracted to the lone pairs on the oxygen atom of a *neighboring* water molecule.
        
        This exceptionally strong intermolecular force is called a **hydrogen bond**. (Note: Despite the name, it is an *intermolecular force* between molecules, not an actual covalent bond *within* a molecule).
        
        Hydrogen bonding only occurs when Hydrogen is directly covalently bonded to a small, highly electronegative atom: **Fluorine, Oxygen, or Nitrogen (F, O, N)**.
      check:
        id: h-bond-check
        type: selectAll
        skills:
        - atomic-structure
        - special-chemical-names
        - covalent-compounds-naming
        prompt: In which of the following pure substances would hydrogen bonding occur? Select all that apply.
        choices:
          - id: a
            text: $NH_3$ (Ammonia)
          - id: b
            text: $CH_4$ (Methane)
          - id: c
            text: $HF$ (Hydrofluoric acid)
          - id: d
            text: $H_2S$ (Hydrogen sulfide)
        answer:
          choiceIds:
            - a
            - c
        explanation: |
          Hydrogen bonding requires H to be covalently bonded to F, O, or N. This is true for $NH_3$ (N-H) and $HF$ (H-F). In Methane, Carbon is not electronegative enough. In $H_2S$, Sulfur is too large and not electronegative enough to support hydrogen bonding.

    - id: sec4
      title: Unique Physical Properties
      required: true
      content: |
        The extensive network of hydrogen bonds between water molecules gives water several highly unusual physical properties:

        1. **High Specific Heat Capacity:** It takes a massive amount of energy to heat water because the energy must first break the hydrogen bonds before the molecules can move faster. This stabilizes Earth's climate and our body temperatures.
        2. **High Boiling Point:** Compared to similar-sized molecules (like $H_2S$, which is a gas at room temp), water's boiling point (100°C) is extraordinarily high due to the energy needed to vaporize it.
        3. **Density of Ice:** In most substances, the solid phase is denser than the liquid phase. In water, as it freezes, the hydrogen bonds lock into a rigid, open hexagonal lattice. This pushes the molecules *further apart* than in liquid water, making ice less dense than liquid water (which is why ice floats).
      check:
        id: properties-check
        type: multipleChoice
        skills:
        - special-chemical-names
        - elemental-states
        prompt: What is the direct molecular cause of ice being less dense than liquid water?
        choices:
          - id: a
            text: The mass of the oxygen atom decreases when it freezes.
          - id: b
            text: Hydrogen bonds lock the molecules into a rigid, open lattice structure.
          - id: c
            text: The O-H covalent bonds lengthen in the cold.
          - id: d
            text: Air gets trapped inside the solid ice crystals.
        answer:
          choiceId: b
        explanation: |
          As water freezes, the molecules slow down enough for the hydrogen bonds to form a stable, open hexagonal crystal structure. This open structure takes up more volume than the disorganized, closely packed liquid phase, resulting in a lower density.
