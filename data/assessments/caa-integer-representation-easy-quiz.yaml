questions:
- id: q001
  title: Unsigned Max
  type: numericResponse
  prompt: What is the maximum unsigned value in 5 bits?
  answer:
    value: 31
    tolerance: 0
  explanation: '`2^5 - 1 = 31`.'
- id: q002
  title: Signed Minimum
  type: numericResponse
  prompt: What is the minimum signed two's-complement value in 6 bits?
  answer:
    value: -32
    tolerance: 0
  explanation: The minimum is `-2^(6-1) = -32`.
- id: q003
  title: Extension Rule
  type: multipleChoice
  prompt: Which rule preserves a negative signed value while widening it?
  choices:
  - id: a
    text: Sign extension
  - id: b
    text: Zero extension
  - id: c
    text: Bit reversal
  - id: d
    text: XOR extension
  answer:
    choiceId: a
  explanation: Sign extension copies the high sign bit.
- id: q004
  title: Unsigned Decode
  type: numericResponse
  prompt: What is the unsigned value of `1101`?
  answer:
    value: 13
    tolerance: 0
  explanation: '`8 + 4 + 1 = 13`.'
- id: q005
  title: Signed Decode
  type: numericResponse
  prompt: What is the signed 4-bit two's-complement value of `1101`?
  answer:
    value: -3
    tolerance: 0
  explanation: '`13 - 16 = -3`.'
- id: q006
  title: Same Pattern
  type: multipleChoice
  prompt: Why can a byte be both a mask and an integer?
  choices:
  - id: a
    text: The operation supplies the interpretation.
  - id: b
    text: Masks are not made of bits.
  - id: c
    text: Integers cannot use all bits.
  - id: d
    text: Only decimal values are stored.
  answer:
    choiceId: a
  explanation: Bits are raw representation; operations define meaning.
- id: q007
  title: Word Size
  type: freeResponse
  prompt: Explain why `~0` depends on word size.
  answer:
    expected: Complement flips every bit in the fixed-width word, so the resulting pattern has as many ones as the chosen word size.
    gradingMode: selfCheck
    keyPoints:
    - Complement flips bits
    - Fixed width
    - Result changes with word size
  explanation: There is no infinite hardware word in the operation.
- id: q008
  title: Modulo Model
  type: multipleChoice
  prompt: Unsigned 8-bit arithmetic wraps modulo what value?
  choices:
  - id: a
    text: '256'
  - id: b
    text: '255'
  - id: c
    text: '128'
  - id: d
    text: '8'
  answer:
    choiceId: a
  explanation: There are 256 distinct byte patterns.
