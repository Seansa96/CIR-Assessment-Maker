workedExamples:
- id: beam-cable-example
  title: Find the cable force on a horizontal beam
  problem: |
    A uniform horizontal beam is $4.0\text{ m}$ long and weighs $200\text{ N}$. It is hinged at the left end. A $300\text{ N}$ load hangs from the right end, and a vertical cable supports the beam $3.0\text{ m}$ from the hinge. Find the cable tension and the vertical hinge force.

    ![Beam with hinge, cable, beam weight, and load](/media/physics/owa/static-beam-equilibrium.svg)
  steps:
  - id: fbd
    title: Draw the beam free-body diagram
    instruction: The beam is the system. Include the upward cable force, the vertical hinge force, the beam's weight at its center ($2.0\text{ m}$), and the load at $4.0\text{ m}$.
    type: multipleChoice
    prompt: Which force has zero torque about the hinge?
    choices:
    - { id: a, text: the cable tension }
    - { id: b, text: the beam weight }
    - { id: c, text: the hinge force }
    answer: { choiceId: c }
    explanation: |
      Solution: The hinge force has zero torque about the hinge.

      Why it works: Its line of action passes through the chosen pivot, so its perpendicular lever arm is zero.

      Why the other choices fail: The cable, beam weight, and load act at nonzero distances from the hinge.
  - id: torque-balance
    title: Balance torques about the hinge
    instruction: Take counterclockwise torque as positive. The cable lifts at $3.0\text{ m}$; the weights rotate the beam clockwise.
    type: numericResponse
    prompt: What cable tension in N follows from $\sum\tau_{\text{hinge}}=0$?
    answer: { value: 533.3333333, tolerance: 0.6 }
    explanation: |
      Solution: $T(3.0)-(200)(2.0)-(300)(4.0)=0$, so $T=1600/3=533.3\text{ N}$.

      Why it works: Each vertical force is perpendicular to the horizontal beam, so its torque magnitude is force times its horizontal distance from the hinge.
  - id: force-balance
    title: Balance vertical forces
    instruction: After torque balance gives the cable tension, use $\sum F_y=0$ for the vertical hinge force $H_y$.
    type: numericResponse
    prompt: What is the vertical hinge force in N, with upward positive?
    answer: { value: -33.3333333, tolerance: 0.6 }
    explanation: |
      Solution: $H_y+533.3-200-300=0$, so $H_y=-33.3\text{ N}$.

      Why it works: The cable alone supplies slightly more upward force than the two weights, so the hinge must push downward to make the net vertical force zero.
  - id: interpret
    title: Interpret the support reaction
    instruction: 'A negative result is not automatically impossible: a hinge can exert either upward or downward vertical force.'
    type: multipleChoice
    prompt: What does the negative hinge-force result mean?
    choices:
    - { id: a, text: The hinge force is downward on the beam. }
    - { id: b, text: The beam cannot be in equilibrium. }
    - { id: c, text: The cable has negative tension. }
    answer: { choiceId: a }
    explanation: |
      Solution: The hinge force is downward on the beam.

      Why it works: The sign is relative to the chosen upward-positive direction; it is consistent with both force and torque balance.

      Why the other choices fail: The cable tension is positive, and the two equilibrium equations are satisfied.
