workedExamples:
  - id: we-mass-to-volume
    title: Solid Reactant to Gas Volume (Non-STP)
    problem: |
      Sodium azide ($NaN_3$) is used in automobile airbags. It decomposes rapidly to form sodium metal and nitrogen gas:
      $$2 NaN_3(s) \to 2 Na(s) + 3 N_2(g)$$
      If an airbag contains 130.0 g of $NaN_3$ ($M = 65.01$ g/mol), what volume of $N_2$ gas will be produced at 25.0 °C and 1.15 atm?
    steps:
      - id: s1-mass-to-moles
        title: 'Convert mass to moles'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the moles calculation and continue.
        instruction: |
          First, find the moles of the reactant, $NaN_3$.
          $$\text{Moles } NaN_3 = \frac{130.0 \text{ g}}{65.01 \text{ g/mol}} = 2.000 \text{ moles } NaN_3$$

      - id: s2-stoichiometry
        title: 'Use mole ratio to find moles of gas'
        type: numericResponse
        answer:
          value: 3.00
          tolerance: 0.05
        prompt: |
          Using the balanced equation ($2 NaN_3 \to 3 N_2$), calculate the moles of $N_2$ produced.
        instruction: |
          $$2.000 \text{ mol } NaN_3 \times \frac{3 \text{ mol } N_2}{2 \text{ mol } NaN_3} = 3.000 \text{ moles } N_2$$

      - id: s3-ideal-gas
        title: 'Calculate gas volume using PV=nRT'
        type: numericResponse
        answer:
          value: 63.8
          tolerance: 0.5
        prompt: |
          Now you know $n = 3.000$ mol. $P = 1.15$ atm. $T = 25.0 \text{ °C} = 298.15 \text{ K}$.
          Calculate the volume (in L) using $V = \frac{nRT}{P}$ (where $R = 0.08206$).
        instruction: |
          $$V = \frac{3.000 \times 0.08206 \times 298.15}{1.15}$$
          $$V = \frac{73.40}{1.15} = 63.83 \text{ L}$$
          Rounding to 3 significant figures, the volume is **63.8 L**.

  - id: we-volume-to-volume
    title: Gas Volume to Gas Volume (Constant P and T)
    problem: |
      Propane burns in oxygen according to the following equation:
      $$C_3H_8(g) + 5 O_2(g) \to 3 CO_2(g) + 4 H_2O(g)$$
      If you burn 4.50 L of propane gas ($C_3H_8$), what volume of carbon dioxide ($CO_2$) gas is produced? Assume both gases are measured at the exact same temperature and pressure.
    steps:
      - id: s1-vol-ratio
        title: 'Apply Gay-Lussac''s law of combining volumes'
        type: numericResponse
        answer:
          value: 13.5
          tolerance: 0.1
        prompt: |
          Because P and T are constant, the volume ratio is identical to the mole ratio. Calculate the volume of $CO_2$ (in L).
        instruction: |
          From the equation, $1 \text{ L}$ of $C_3H_8$ produces $3 \text{ L}$ of $CO_2$.
          $$4.50 \text{ L } C_3H_8 \times \frac{3 \text{ L } CO_2}{1 \text{ L } C_3H_8} = 13.5 \text{ L } CO_2$$
