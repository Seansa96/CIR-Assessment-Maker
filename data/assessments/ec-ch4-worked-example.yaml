schemaVersion: 1
id: ec-ch4-worked-example
title: 'Worked Example: Node-Voltage Analysis'
assessmentType: workedExample
categoryId: electronics-and-circuits
subcategoryIds:
- ec-techniques-analysis
workedExamples:
- id: we1
  title: Solving a Two-Node Circuit
  steps:
  - id: step1
    prompt: Write the KCL equation at Node 1.
    instruction: $-2 + v_1/10 + v_1/40 = 0$
    title: Write the KCL equation at Node 1.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  - id: step2
    prompt: Solve for $v_1$.
    instruction: $v_1(4/40 + 1/40) = 2 \implies v_1(5/40) = 2 \implies v_1/8 = 2 \implies
      v_1 = 16\text{ V}$.
    title: Solve for $v_1$.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: 'Find the node voltage $v_1$ in a circuit where a 2A current source feeds
    node 1, which has two parallel branches to ground: a $10\Omega$ resistor and a
    $40\Omega$ resistor.'
