lesson:
  introduction: "An **infinite series** is the sum of the terms of an infinite sequence.\
    \ \nIt is denoted by $\\sum_{n=1}^\\infty a_n = a_1 + a_2 + a_3 + \\dots$\nHow\
    \ can adding infinitely many things yield a finite number? The same way you can\
    \ walk to a door by first walking half the distance, then half the remaining distance,\
    \ and so on.\n"
  sections:
  - id: partial-sums
    title: Partial Sums
    required: true
    content: 'To define the sum of an infinite series, we look at its **sequence of
      partial sums**, $S_n$.

      $S_1 = a_1$

      $S_2 = a_1 + a_2$

      $S_3 = a_1 + a_2 + a_3$


      If the sequence of partial sums converges to a limit $S$ (i.e., $\lim_{n \to
      \infty} S_n = S$), then the infinite series **converges** to $S$. If the limit
      does not exist, the series **diverges**.

      '
    check:
      id: partial-sums-check
      type: multipleChoice
      skills:
      - series-intro
      prompt: If the sequence of partial sums for a series is $S_n = \frac{5n}{n+2}$,
        what is the sum of the infinite series?
      choices:
      - id: a
        text: 5
      - id: b
        text: 2.5
      - id: c
        text: It diverges
      - id: d
        text: 0
      answer:
        choiceId: a
      explanation: 'The sum of the infinite series is exactly the limit of $S_n$ as
        $n \to \infty$. The limit of $\frac{5n}{n+2}$ is 5.

        '
  - id: geometric-series
    title: Geometric Series
    required: true
    content: 'A **Geometric Series** has a constant ratio $r$ between successive terms:
      $\sum_{n=0}^\infty a r^n$.

      For example: $3 + \frac{3}{2} + \frac{3}{4} + \frac{3}{8} \dots$ ($a=3$, $r=1/2$).


      **Convergence Rule:**

      - If $|r| < 1$, the series converges to $S = \frac{a}{1 - r}$.

      - If $|r| \ge 1$, the series diverges.

      '
    check:
      id: geometric-series-check
      type: numericResponse
      skills:
      - series-intro
      prompt: What is the sum of the series $4 + 2 + 1 + 0.5 + \dots$?
      answer:
        value: 8
        tolerance: 0.1
      explanation: 'This is a geometric series with $a = 4$ and $r = 1/2$. The sum
        is $\frac{4}{1 - 1/2} = \frac{4}{1/2} = 8$.

        '
  - id: divergence-test
    title: The Test for Divergence (nth Term Test)
    required: true
    content: 'For an infinite sum to have any chance of converging, the individual
      terms you are adding *must* eventually shrink to zero.


      **Test for Divergence:** If $\lim_{n \to \infty} a_n \ne 0$, then the series
      $\sum a_n$ **diverges**.


      *Warning:* The converse is FALSE! If $\lim a_n = 0$, the series *might* converge,
      or it *might* diverge. You cannot use this test to prove convergence.

      '
    check:
      id: divergence-test-check
      type: multipleChoice
      skills:
      - series-intro
      prompt: What does the Test for Divergence say about the series $\sum_{n=1}^\infty
        \frac{n}{n+1}$?
      choices:
      - id: a
        text: It diverges because the terms approach 1, not 0.
      - id: b
        text: It converges because the terms approach 1.
      - id: c
        text: The test is inconclusive because the terms approach 0.
      - id: d
        text: It converges because the terms get smaller.
      answer:
        choiceId: a
      explanation: '$\lim \frac{n}{n+1} = 1 \ne 0$. Because you are eventually just
        adding $1+1+1+1\dots$ forever, the sum will go to infinity. It diverges.

        '
  - id: p-series
    title: p-Series and the Harmonic Series
    required: true
    content: 'A **p-Series** is a series of the form $\sum_{n=1}^\infty \frac{1}{n^p}$.


      **Convergence Rule:**

      - Converges if $p > 1$.

      - Diverges if $p \le 1$.


      A famous example is the **Harmonic Series** when $p=1$: $\sum \frac{1}{n} =
      1 + \frac{1}{2} + \frac{1}{3} + \dots$

      Even though the terms go to zero ($\lim 1/n = 0$), the Harmonic Series **diverges**!
      It grows infinitely, just very slowly.

      '
    check:
      id: p-series-check
      type: multipleChoice
      skills:
      - series-intro
      prompt: Does the series $\sum_{n=1}^\infty \frac{1}{\sqrt{n}}$ converge or diverge?
      choices:
      - id: a
        text: Diverges because $p = 1/2$, which is $\le 1$.
      - id: b
        text: Converges because $p = 1/2$, which is $> 0$.
      - id: c
        text: Converges because the terms approach 0.
      answer:
        choiceId: a
      explanation: '$\frac{1}{\sqrt{n}} = \frac{1}{n^{1/2}}$. Here $p = 0.5$. Since
        $p \le 1$, the series diverges.

        '

