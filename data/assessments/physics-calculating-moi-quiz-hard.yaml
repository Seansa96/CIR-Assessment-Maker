questions:
- id: q001
  title: Rod plus endpoint masses
  type: numericResponse
  prompt: A $2.0\text{ kg}$, $2.0\text{ m}$ rod rotates about its center. A $0.50\text{
    kg}$ mass is attached to each end. What is total $I$?
  answer:
    value: 1.667
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    Rod $I=0.667$; endpoint masses add $1.0$; total $1.667$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q002
  title: Offset disk
  type: numericResponse
  prompt: A solid disk has $M=8.0\text{ kg}$ and $R=0.50\text{ m}$. Find $I$ about
    a parallel axis $0.30\text{ m}$ from center.
  answer:
    value: 1.72
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I_{cm}=1.0$ and $Md^2=0.72$, total $1.72$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q003
  title: Disk with hole
  type: numericResponse
  prompt: A disk has $I_{full}=4.00$. A hole of mass $1.0\text{ kg}$, radius $0.20\text{
    m}$ is centered $0.40\text{ m}$ from the axis. What is remaining $I$?
  answer:
    value: 3.82
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    Hole $I=\frac12mr^2+md^2=0.18$; remaining $I=4.00-0.18=3.82$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q004
  title: Perpendicular axis theorem
  type: numericResponse
  prompt: A lamina has $I_x=3.0$ and $I_y=5.0$. What is $I_z$?
  answer:
    value: 8.0
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    For a planar lamina, $I_z=I_x+I_y=8.0$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q005
  title: Off-center rod axis
  type: numericResponse
  prompt: A $4.0\text{ kg}$, $3.0\text{ m}$ rod rotates about an axis $0.50\text{
    m}$ from center. What is $I$?
  answer:
    value: 4.0
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I_{cm}=3.0$ and $Md^2=1.0$, so $I=4.0$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q006
  title: Three point masses
  type: numericResponse
  prompt: Masses are at radii $0.50$, $0.40$, and $1.0\text{ m}$ with masses $2.0$,
    $3.0$, and $1.0\text{ kg}$. What is total $I$?
  answer:
    value: 1.98
    tolerance: 0.02
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I=2(0.5)^2+3(0.4)^2+1(1)^2=1.98$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q007
  title: Parallel-axis condition
  type: multipleChoice
  prompt: When may you use $I=I_{cm}+Md^2$?
  choices:
  - id: a
    text: When the new axis is parallel to the center-of-mass axis.
  - id: b
    text: Whenever axes cross.
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: Only for point masses.
    issueSignals:
    - id: inertia-mass-confusion
  - id: d
    text: Only when $d=0$.
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    When the new axis is parallel to the center-of-mass axis.


    Why it works:

    The theorem shifts to a parallel axis.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q008
  title: Scaling
  type: numericResponse
  prompt: A similar object has triple the radius and double the mass. By what factor
    does $I$ increase?
  answer:
    value: 18.0
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I\propto MR^2$, so factor $=2(3^2)=18$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q009
  title: Cutout sign
  type: multipleChoice
  prompt: 'A cutout should be treated as:'
  choices:
  - id: a
    text: negative moment of inertia contribution
  - id: b
    text: extra rim mass
    issueSignals:
    - id: inertia-mass-confusion
  - id: c
    text: zero radius
    issueSignals:
    - id: lever-arm-confusion
  - id: d
    text: a power term
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    negative moment of inertia contribution


    Why it works:

    Removed material is subtracted from the full object''s $I$.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q010
  title: Rod axis difference
  type: numericResponse
  prompt: A $1.5\text{ kg}$, $4.0\text{ m}$ rod rotates about center or end. How much
    larger is the end-axis $I$?
  answer:
    value: 6.0
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $I_{end}=8.0$ and $I_{center}=2.0$, difference $6.0$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
