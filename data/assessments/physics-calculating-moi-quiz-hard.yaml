questions:
- id: q1
  type: numericResponse
  prompt: A uniform rod of mass $M=3.0 \text{ kg}$ and length $L=2.0 \text{ m}$ has
    $I_{cm} = \frac{1}{12}ML^2$. Using the Parallel-Axis Theorem, what is $I$ about
    an axis through its end?
  answer:
    value: 4.0
    tolerance: 0.1
  explanation: $I_{end} = I_{cm} + Md^2 = \frac{1}{12}ML^2 + M(L/2)^2 = \frac{1}{3}ML^2
    = \frac{1}{3}(3.0)(4.0) = 4.0 \text{ kg}\cdot\text{m}^2$.
