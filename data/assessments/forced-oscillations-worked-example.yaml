workedExamples:
- id: we-forced-oscillations
  title: Deriving and applying Forced Oscillations
  problem: Use the labeled model to derive and calculate the natural angular frequency from $\omega_0=\sqrt{k/m}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Identify the external driving force in the system.
    prompt: Identify the driving force parameter.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Driving force amplitude F_0
    explanation: 'Solution: The system is subjected to a periodic force with amplitude $F_0$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the assumption about the system's state.
    prompt: What state is assumed?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Steady-state motion.
    explanation: 'Solution: We assume enough time has passed that transient motions have decayed, leaving only the steady-state.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the target variable to maximize.
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Resonance frequency
    explanation: 'Solution: We want to find the resonance frequency $\omega$ that maximizes amplitude $A$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the amplitude equation for a forced oscillator.
    prompt: Write the amplitude relation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - A = F_0 / \sqrt{...}
    explanation: 'Solution: $A = \frac{F_0}{\sqrt{m^2(\omega_0^2 - \omega^2)^2 + b^2\omega^2}}$


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the condition for resonance (assuming small $b$).
    prompt: When is $A$ maximized?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - \omega = \sqrt{k/m}
    explanation: 'Solution: Amplitude is maximized when the term $(\omega_0^2 - \omega^2)^2$ is zero, meaning $\omega = \omega_0 = \sqrt{k/m}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Given $m = 0.10$ kg and $k = 100$ N/m, calculate the resonant driving frequency in rad/s.
    prompt: Calculate $\omega_0$.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      value: 3.0
      tolerance: 0.03
    explanation: 'Solution: $\omega_0 = \sqrt{100 / 0.10} = \sqrt{1000} \approx 31.6$ rad/s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of $\sqrt{k/m}$.
    prompt: What are the units?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - rad/s
    explanation: 'Solution: $\sqrt{(\text{N/m})/\text{kg}} = \sqrt{\text{s}^{-2}} = \text{rad/s}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the resonant frequency.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    answer:
      value: 3.0
      tolerance: 0.03
    explanation: 'Solution: The resonant angular frequency is $31.6$ rad/s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
- id: forced-resonance-we002
  title: Natural Frequency of a Driven Spring
  problem: A $0.50\ \text{kg}$ mass is attached to a spring with $k=200\ \text{N/m}$. For light damping, find the driving angular frequency that produces resonance.
  steps:
  - id: forced-resonance-we002-step-1
    title: Calculate the natural frequency
    instruction: Evaluate $\omega_0=\sqrt{k/m}$ with the given spring constant and mass.
    type: numericResponse
    prompt: Calculate $\omega_0=\sqrt{k/m}$ in $\text{rad/s}$.
    answer: {value: 20, tolerance: 0.05}
    explanation: 'Solution: $\omega_0=\sqrt{200/0.50}=20\ \text{rad/s}$. Why it works: a mass-spring oscillator has natural angular frequency $\sqrt{k/m}$.'
  - id: forced-resonance-we002-step-2
    title: Choose the resonant driving frequency
    instruction: For light damping, set the driving frequency equal to the natural frequency.
    type: numericResponse
    prompt: For light damping, what driving angular frequency should be used for resonance?
    answer: {value: 20, tolerance: 0.05}
    explanation: 'Solution: Choose $\omega\approx\omega_0=20\ \text{rad/s}$. Why it works: lightly damped resonance occurs near the natural frequency.'
