questions:
- id: q001
  type: multipleChoice
  prompt: If two paths toward $(0,0)$ give 1 and -1, what follows?
  choices:
  - id: a
    text: The limit does not exist
  - id: b
    text: The limit is 0
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: The limit is 1
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: The limit is -1
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: A common limit cannot have two values.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: Which statement is required for continuity at $(a,b)$?
  choices:
  - id: a
    text: '$\lim_{(x,y)\to(a,b)}f(x,y)=f(a,b)$'
  - id: b
    text: Only $f(a,b)$ exists
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: Only one path has a limit
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: The graph is flat
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Continuity matches the limit and the assigned value.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
