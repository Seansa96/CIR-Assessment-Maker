items:
  - { id: fsr1, type: cloze, prompt: 'Complete: $P=F/\underline{\hspace{0.7cm}}$.', answer: { expected: A, expectedLatex: 'A', aliases: [area], media: [] }, explanation: 'Solution: Insert $A$.\n\nWhy it works: Pressure is force divided by area.', tags: [pressure] }
  - { id: fsr2, type: cloze, prompt: 'Complete: $p_g=\rho g\underline{\hspace{0.7cm}}$.', answer: { expected: h, expectedLatex: 'h', aliases: [depth], media: [] }, explanation: 'Solution: Insert $h$.\n\nWhy it works: Gauge pressure is hydrostatic depth pressure.', tags: [hydrostatic] }
  - { id: fsr3, type: typed, prompt: 'What is the SI unit of pressure?', answer: { expected: pascal, expectedLatex: '', aliases: [Pa, pascals], media: [] }, explanation: 'Solution: The unit is pascal.\n\nWhy it works: One pascal equals one newton per square meter.', tags: [units] }
  - { id: fsr4, type: typed, prompt: 'What principle describes pressure transmission in a hydraulic lift?', answer: { expected: 'Pascal principle', expectedLatex: '', aliases: ['Pascal''s principle'], media: [] }, explanation: 'Solution: It is Pascal''s principle.\n\nWhy it works: Enclosed fluid transmits applied pressure.', tags: [hydraulic] }
  - { id: fsr5, type: cloze, prompt: 'In a connected static fluid, equal ____ means equal pressure.', answer: { expected: depth, expectedLatex: '', aliases: [height], media: [] }, explanation: 'Solution: Insert depth.\n\nWhy it works: Pressure depends only on vertical depth in a uniform static fluid.', tags: [manometer] }
  - { id: fsr6, type: typed, prompt: 'Which side of a U-tube has greater pressure: the side with lower or higher liquid level?', answer: { expected: lower, expectedLatex: '', aliases: ['lower level'], media: [] }, explanation: 'Solution: The lower side has greater pressure.\n\nWhy it works: Greater pressure pushes the liquid down.', tags: [manometer] }
