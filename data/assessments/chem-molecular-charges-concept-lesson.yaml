lesson:
  introduction: Build a reliable model of formal charges and resonance by separating electron accounting, particle representation,
    and observable evidence.
  sections:
  - id: sec-formal-charge
    title: Calculate formal charge
    required: true
    content: Formal charge equals valence electrons minus nonbonding electrons minus one-half of bonding electrons.
    check:
      id: chk-sec-formal-charge
      type: multipleChoice
      prompt: Which statement correctly applies the idea of calculate formal charge?
      choices:
      - id: a
        text: Oxygen with one bond and three lone pairs has formal charge 1-.
        issueSignals: []
      - id: b
        text: Oxygen with one bond and three lone pairs has formal charge 1+.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Oxygen with one bond and three lone pairs has formal charge 1-. Why it works: Formal charge
        equals valence electrons minus nonbonding electrons minus one-half of bonding electrons. Why the other choices fail:
        The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-formal-resonance-map.svg
      alt: Instructional workflow for formal charges and resonance showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: sec-charge-sum
    title: Verify the charge sum
    required: true
    content: Atomic formal charges must add to the molecule or ion's stated net charge.
    check:
      id: chk-sec-charge-sum
      type: multipleChoice
      prompt: Which statement correctly applies the idea of verify the charge sum?
      choices:
      - id: a
        text: Formal charges in nitrate must sum to 1-.
        issueSignals: []
      - id: b
        text: Every atom in a polyatomic ion must carry the full ion charge.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Formal charges in nitrate must sum to 1-. Why it works: Atomic formal charges must add to the
        molecule or ion''s stated net charge. Why the other choices fail: The other statements either reverse the relevant
        electron or charge accounting or apply a structural model outside its stated scope.'
  - id: sec-best-lewis
    title: Compare candidate contributors
    required: true
    content: Prefer complete shells, small formal-charge magnitudes, and negative charge on more electronegative atoms when
      other constraints are comparable.
    check:
      id: chk-sec-best-lewis
      type: multipleChoice
      prompt: Which statement correctly applies the idea of compare candidate contributors?
      choices:
      - id: a
        text: A structure with minimized charge separation is usually favored.
        issueSignals: []
      - id: b
        text: The contributor with the greatest number of formal charges is always dominant.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: A structure with minimized charge separation is usually favored. Why it works: Prefer complete
        shells, small formal-charge magnitudes, and negative charge on more electronegative atoms when other constraints are
        comparable. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
  - id: sec-resonance-structures
    title: Generate resonance contributors
    required: true
    content: Resonance contributors keep atom positions fixed and move only electrons, bonds, or lone pairs.
    check:
      id: chk-sec-resonance-structures
      type: multipleChoice
      prompt: Which statement correctly applies the idea of generate resonance contributors?
      choices:
      - id: a
        text: Equivalent nitrate contributors differ in which oxygen has the double bond.
        issueSignals: []
      - id: b
        text: Resonance moves an oxygen atom to a new attachment point.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Equivalent nitrate contributors differ in which oxygen has the double bond. Why it works: Resonance
        contributors keep atom positions fixed and move only electrons, bonds, or lone pairs. Why the other choices fail:
        The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
  - id: sec-resonance-hybrid
    title: Interpret the hybrid
    required: true
    content: The real electron distribution is delocalized; a molecule does not alternate back and forth among contributor
      drawings.
    check:
      id: chk-sec-resonance-hybrid
      type: multipleChoice
      prompt: Which statement correctly applies the idea of interpret the hybrid?
      choices:
      - id: a
        text: Equivalent nitrate N-O bonds have equal intermediate character.
        issueSignals: []
      - id: b
        text: A nitrate ion contains one permanently short and two permanently long N-O bonds.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Equivalent nitrate N-O bonds have equal intermediate character. Why it works: The real electron
        distribution is delocalized; a molecule does not alternate back and forth among contributor drawings. Why the other
        choices fail: The other statements either reverse the relevant electron or charge accounting or apply a structural
        model outside its stated scope.'
  - id: sec-fractional-order
    title: Determine fractional bond order
    required: true
    content: For equivalent bonds, average the localized bond orders represented across equivalent contributors.
    check:
      id: chk-sec-fractional-order
      type: multipleChoice
      prompt: Which statement correctly applies the idea of determine fractional bond order?
      choices:
      - id: a
        text: Three equivalent nitrate N-O bonds have average order 4/3.
        issueSignals: []
      - id: b
        text: Every resonance bond must have integer bond order in the actual ion.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-formal-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Three equivalent nitrate N-O bonds have average order 4/3. Why it works: For equivalent bonds,
        average the localized bond orders represented across equivalent contributors. Why the other choices fail: The other
        statements either reverse the relevant electron or charge accounting or apply a structural model outside its stated
        scope.'
