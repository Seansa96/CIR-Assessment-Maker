lesson:
  introduction: |
    When we draw a Lewis structure, we distribute electrons according to certain rules — but for many molecules, more than one valid Lewis structure can be drawn. **Formal charges** help us judge which structure is most realistic, and **resonance** explains molecules that cannot be accurately described by a single Lewis structure.
  sections:
    - id: sec-formal-charge
      title: Calculating Formal Charge
      required: true
      content: |
        **Formal charge** is a bookkeeping device that tracks how electrons in a Lewis structure are "assigned" to individual atoms. It does *not* represent actual charge on an atom, but it helps us pick the most reasonable Lewis structure.

        The formal charge on any atom is:

        $$
        \text{FC} = (\text{valence electrons}) - (\text{lone pair electrons}) - \frac{1}{2}(\text{bonding electrons})
        $$

        Or equivalently:

        $$
        \text{FC} = V - L - \frac{B}{2}
        $$

        where $V$ = valence electrons of the free atom, $L$ = lone pair electrons on the atom, $B$ = bonding electrons shared with other atoms.

        **Example — Oxygen in water ($H_2O$):**
        - $V = 6$ (oxygen is in Group 16)
        - $L = 4$ (two lone pairs)
        - $B = 4$ (two bonding pairs, 4 electrons)
        - $\text{FC} = 6 - 4 - \frac{4}{2} = 6 - 4 - 2 = 0$

        An atom's formal charge is zero when it holds the same number of electrons it would as a free atom.
      check:
        id: chk-fc-1
        type: numericResponse
        prompt: |
          Calculate the formal charge on the **nitrogen atom** in the ammonium ion ($NH_4^+$). Nitrogen forms 4 bonds and has **no lone pairs**.

          Use: $\text{FC} = V - L - B/2$, where $V = 5$ for nitrogen.
        answer:
          value: 1
          tolerance: 0
        explanation: |
          $V = 5$, $L = 0$ (no lone pairs), $B = 8$ (four N—H bonds, 8 electrons).

          $$\text{FC} = 5 - 0 - \frac{8}{2} = 5 - 0 - 4 = +1$$

          Nitrogen in $NH_4^+$ carries a formal charge of $+1$. This is consistent with the overall $+1$ charge of the ion.

    - id: sec-best-lewis
      title: Choosing the Best Lewis Structure
      required: true
      content: |
        For molecules where multiple valid Lewis structures can be drawn, formal charges guide us to the **best** (most realistic) structure. The rules for selecting it:

        1. **Minimize formal charges.** Prefer the structure where all atoms have formal charges as close to zero as possible.
        2. **Negative formal charges belong on electronegative atoms.** If a negative formal charge must exist, it should sit on the most electronegative atom (e.g., F, O, N), not on a metal or less electronegative nonmetal.
        3. **Do not place the same sign of formal charge on adjacent atoms.** Adjacent positive–positive or negative–negative formal charges are destabilizing.

        **Example — $CO_2$:**

        Structure A: O=C=O (each O has FC = 0, C has FC = 0) ← **preferred**

        Structure B: O−C≡O (left O has FC = −1, C has FC = +1) ← less preferred (nonzero charges)

        Structure A wins because all formal charges are zero.
      check:
        id: chk-fc-2
        type: multipleChoice
        prompt: |
          Two Lewis structures for $SO_2$ are proposed. Structure A has S with a formal charge of $+1$ and one O with $-1$ (double bond to the other O). Structure B has all formal charges equal to zero. Which should be preferred?
        choices:
          - id: a
            text: Structure A, because separating charges creates a larger dipole moment
          - id: b
            text: Structure B, because minimizing formal charges leads to the most realistic structure
          - id: c
            text: Structure A, because sulfur should always carry a positive charge
          - id: d
            text: Neither; both are equally valid
        answer:
          choiceId: b
        explanation: |
          The preferred Lewis structure minimizes formal charges. Structure B, with all atoms at formal charge zero, is more realistic because it distributes electrons without imposing artificial charge separation. However, note that both structures contribute to the true picture via resonance.

    - id: sec-resonance-structures
      title: Resonance Structures
      required: true
      content: |
        Some molecules or ions cannot be described accurately by *one* Lewis structure. When two or more valid Lewis structures differ only in the **positions of electrons** (not atoms), they are called **resonance structures**.

        **Example — Ozone ($O_3$):**

        $$
        \ddot{O}\text{—}O\text{=}O \quad \longleftrightarrow \quad O\text{=}O\text{—}\ddot{O}
        $$

        In the left structure, the single bond is on the right; in the right structure, it is on the left. Both are valid. The double-headed arrow ($\longleftrightarrow$) indicates these are resonance structures, **not** an equilibrium between two real molecules.

        **Example — Carbonate ion ($CO_3^{2-}$):**
        Three equivalent resonance structures exist; the double bond "moves" to each of the three C—O positions in turn.

        Key point: resonance structures are **not** different molecules oscillating back and forth. They are different mathematical descriptions of the *same* electron distribution.
      check:
        id: chk-fc-3
        type: multipleChoice
        prompt: |
          The nitrate ion ($NO_3^-$) has three resonance structures. What does this tell us about the N—O bond lengths in the actual ion?
        choices:
          - id: a
            text: One N—O bond is a double bond (shorter) and two are single bonds (longer)
          - id: b
            text: All three N—O bonds are identical in length, intermediate between a single and double bond
          - id: c
            text: The ion rapidly switches between structures, so bond lengths fluctuate
          - id: d
            text: All bonds become single bonds because the ion gains electrons
        answer:
          choiceId: b
        explanation: |
          In the actual $NO_3^-$ ion, all three N—O bonds are **equivalent** — experimentally measured at the same length, intermediate between a single bond and a double bond. This is the signature of resonance: the true molecule is a hybrid, not one of the individual resonance structures.

    - id: sec-resonance-hybrid
      title: The Resonance Hybrid
      required: true
      content: |
        The true structure of a molecule that has resonance structures is called the **resonance hybrid** — a weighted average of all contributing resonance structures.

        Visualizing it: draw the resonance hybrid by showing *all* bonds as equal in strength/length. For $O_3$, instead of one single and one double bond, both O—O bonds are identical (bond order = 1.5).

        For $CO_3^{2-}$ with three equivalent resonance structures, each C—O bond has bond order:

        $$
        \text{Bond order} = \frac{\text{total bonds in all structures}}{\text{number of structures}} = \frac{1 + 1 + 2}{3} = \frac{4}{3} \approx 1.33
        $$

        **Practical rule:** The more equivalent resonance structures a molecule has, and the more structures share the electron density, the **more stable** the molecule tends to be (resonance stabilization).

        Benzene ($C_6H_6$) is the classic example: six equivalent resonance structures give it exceptional stability — it does not react like a typical alkene.
      check:
        id: chk-fc-4
        type: multipleChoice
        prompt: |
          The formate ion ($HCO_2^-$) has two equivalent resonance structures, each with one C—O single bond and one C=O double bond. What is the bond order of each C—O bond in the resonance hybrid?
        choices:
          - id: a
            text: '1.0'
          - id: b
            text: '1.5'
          - id: c
            text: '2.0'
          - id: d
            text: '0.5'
        answer:
          choiceId: b
        explanation: |
          With two resonance structures, one contributing a single bond (order 1) and the other a double bond (order 2) to each C—O position:

          $$\text{Bond order} = \frac{1 + 2}{2} = 1.5$$

          Both C—O bonds in formate are identical, with a bond order of 1.5 — shorter than a pure single bond but longer than a pure double bond.
