questions:
- id: vol-adv-1-equilateral-triangle
  title: Cross Section - Equilateral Triangle
  type: symbolicResponse
  skills:
  - volumes-complex
  prompt: 'The base of a solid is the region bounded by $y = \\sqrt{x}$, the $x$-axis, and $x = 4$. \nCross sections perpendicular to the $x$-axis are equilateral triangles. \nWhat is the volume of this solid? (Enter the exact numerical coefficient of $\\sqrt{3}$).\n(Hint: The area of an equilateral triangle with side length $s$ is $A = \\frac{\\sqrt{3}}{4}s^2$).\n'
  answer:
    gradingMode: auto
    expectedLatex: 2
    equivalenceMode: expression
    tolerance: 0
  explanation: 'The side length $s$ of the triangle is the distance from the x-axis to the curve, so $s = \sqrt{x}$. The area of the cross section is $A(x) = \frac{\sqrt{3}}{4}(\sqrt{x})^2 = \frac{\sqrt{3}}{4}x$. Integrating from $0$ to $4$: $V = \int_0^4 \frac{\sqrt{3}}{4}x \, dx = \frac{\sqrt{3}}{4} [\frac{x^2}{2}]_0^4 = \frac{\sqrt{3}}{4}(8) = 2\sqrt{3}$. Thus the coefficient is $2$.'
- id: vol-adv-2-square-cross
  title: Cross Section - Squares
  type: symbolicResponse
  skills:
  - volumes-complex
  prompt: 'The base of a solid is the region bounded by the circle $x^2 + y^2 = 1$. \nCross sections perpendicular to the $x$-axis are squares. \nCalculate the exact volume of this solid.\n'
  answer:
    gradingMode: auto
    expectedLatex: 16/3
    equivalenceMode: expression
    tolerance: 0.01
  explanation: The side length $s$ of the square spans from the bottom of the circle to the top, so $s = 2y = 2\sqrt{1 - x^2}$. The area is $A(x) = s^2 = 4(1 - x^2)$. The volume is $V = \int_{-1}^1 4(1 - x^2) \, dx = 4 [x - \frac{x^3}{3}]_{-1}^1 = 4( (1 - 1/3) - (-1 + 1/3) ) = 4(4/3) = 16/3$.
- id: vol-adv-3-gabriels-horn-vol
  title: Gabriel's Horn - Volume
  type: symbolicResponse
  skills:
  - volumes-complex
  prompt: 'Consider the solid of revolution formed by rotating the region under $y = \\frac{1}{x}$ on the interval $[1, \\infty)$ about the $x$-axis. \nCalculate the exact volume of this solid. (Use $\\pi$ as approximately $3.14159$ if needed, but the exact symbolic answer is expected).\n'
  answer:
    gradingMode: auto
    expectedLatex: \pi
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Using the disk method: $V = \int_1^\infty \pi (\frac{1}{x})^2 \, dx = \pi \int_1^\infty x^{-2} \, dx = \pi \lim_{b\to\infty} [-\frac{1}{x}]_1^b = \pi(0 - (-1)) = \pi$.'
- id: vol-adv-4-gabriels-horn-surface
  title: Gabriel's Horn - Surface Area
  type: multipleChoice
  skills:
  - volumes-complex
  prompt: 'Consider the same solid of revolution (Gabriel''s Horn) formed by rotating $y = \\frac{1}{x}$ on $[1, \\infty)$ about the $x$-axis. \nWe just found its volume is finite ($\\pi$). What is its surface area?\n'
  choices:
  - id: a
    text: The surface area is also finite, equal to $2\pi$.
  - id: b
    text: The surface area is infinite.
  - id: c
    text: The surface area is exactly $\pi$.
  answer:
    choiceId: b
  explanation: The surface area integral is $\int_1^\infty 2\pi (\frac{1}{x}) \sqrt{1 + (-\frac{1}{x^2})^2} \, dx$. Since $\sqrt{1 + \dots} > 1$, the integrand is strictly greater than $\frac{2\pi}{x}$. Since $\int_1^\infty \frac{1}{x} \, dx$ diverges, the surface area must diverge by the Comparison Test. It is infinite!
- id: vol-adv-5-washer-vs-shell
  title: Method Selection
  type: multipleChoice
  skills:
  - volumes-complex
  prompt: 'You want to find the volume generated by rotating the region bounded by $y = 3x - x^3$ and the $x$-axis on $[0, \\sqrt{3}]$ about the $y$-axis. \nWhich method allows you to evaluate this volume analytically using a single integral without having to solve a cubic equation for $x$?\n'
  choices:
  - id: a
    text: The Washer/Disk Method (integrating with respect to $y$)
  - id: b
    text: The Cylindrical Shell Method (integrating with respect to $x$)
  - id: c
    text: Both methods are equally easy to set up and evaluate.
  answer:
    choiceId: b
  explanation: To use washers, you would integrate with respect to $y$. You would need to express the boundaries as $x = f(y)$, requiring you to solve $y = 3x - x^3$ for $x$, which is incredibly difficult analytically. Cylindrical shells use vertical slices, integrating with respect to $x$, allowing you to leave the function as $y(x)$ and easily evaluate $\int 2\pi x (3x - x^3) \, dx$.
- id: vol-adv-6-pauls-notes-y-axis-ring
  title: Ring Method - Integrating with respect to y
  type: symbolicResponse
  skills:
  - volumes-complex
  prompt: |
    Find the exact volume of the solid obtained by rotating the region bounded by $y = \frac{1}{x^2}$, $y = 9$, $x = -2$, and $x = -\frac{1}{3}$ about the $y$-axis.
    *(Use the method of rings).*
  answer:
    gradingMode: auto
    expectedLatex: \pi(35 - \ln 36)
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    To use the ring method rotating around the $y$-axis, we must integrate with respect to $y$.
    We need to solve the curve for $x$: $y = \frac{1}{x^2} \implies x^2 = \frac{1}{y} \implies x = \pm\frac{1}{\sqrt{y}}$.
    Since our region is in the second quadrant ($x$ between $-2$ and $-1/3$), we use $x = -\frac{1}{\sqrt{y}}$.

    The boundaries for $y$: The top is $y = 9$. The bottom is where $x = -2$ intersects the curve $y = \frac{1}{(-2)^2} = \frac{1}{4}$.
    The outer radius $R$ is the distance from the $y$-axis to the far left curve $x = -2$, so $R = |-2| = 2$.
    The inner radius $r$ is the distance from the $y$-axis to the inner curve $x = -1/\sqrt{y}$, so $r = |-1/\sqrt{y}| = \frac{1}{\sqrt{y}}$.

    Volume $V = \pi \int_{1/4}^9 \left( (2)^2 - \left(\frac{1}{\sqrt{y}}\right)^2 \right) \, dy = \pi \int_{1/4}^9 \left( 4 - \frac{1}{y} \right) \, dy$
    $V = \pi \left[ 4y - \ln|y| \right]_{1/4}^9 = \pi \left( (36 - \ln 9) - (1 - \ln(1/4)) \right) = \pi(35 - \ln 9 - \ln 4) = \pi(35 - \ln 36)$.
- id: vol-adv-7-pauls-notes-y-axis-parabola
  title: Ring Method - Parabola along y-axis
  type: symbolicResponse
  skills:
  - volumes-complex
  prompt: |
    Find the exact volume of the solid obtained by rotating the region bounded by $x = (y - 3)^2$ and $x = 16$ about the $y$-axis.
  answer:
    gradingMode: auto
    expectedLatex: 8192\pi/5
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    First find the intersection points to get the limits of integration for $y$:
    $(y - 3)^2 = 16 \implies y - 3 = \pm 4 \implies y = 7$ and $y = -1$.

    Rotating about the $y$-axis, the outer radius $R$ is the vertical line $x = 16$.
    The inner radius $r$ is the parabola $x = (y - 3)^2$.

    Volume $V = \pi \int_{-1}^7 \left( (16)^2 - ((y - 3)^2)^2 \right) \, dy = \pi \int_{-1}^7 \left( 256 - (y - 3)^4 \right) \, dy$
    Let $u = y - 3$, so $du = dy$. The limits become $u = -4$ to $u = 4$.
    $V = \pi \int_{-4}^4 \left( 256 - u^4 \right) \, du = \pi \left[ 256u - \frac{u^5}{5} \right]_{-4}^4$
    By symmetry, this is $2\pi \int_0^4 (256 - u^4) \, du = 2\pi \left( 256(4) - \frac{1024}{5} \right) = 2\pi \left( 1024 - \frac{1024}{5} \right) = 2\pi \left( \frac{4096}{5} \right) = \frac{8192\pi}{5}$.
- id: vol-adv-8-pauls-notes-x-axis-quadratics
  title: Washer Method - Intersecting Curves
  type: symbolicResponse
  skills:
  - volumes-complex
  prompt: |
    Find the exact volume of the solid obtained by rotating the region bounded by $y = x^2 - 2x + 4$ and $y = x + 14$ about the $x$-axis.
  answer:
    gradingMode: auto
    expectedLatex: 18179\pi/15
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Intersection points:
    $x^2 - 2x + 4 = x + 14 \implies x^2 - 3x - 10 = 0 \implies (x - 5)(x + 2) = 0 \implies x = -2, 5$.

    The upper curve (outer radius $R$) is the line $y = x + 14$. The lower curve (inner radius $r$) is the parabola $y = x^2 - 2x + 4$.

    Volume $V = \pi \int_{-2}^5 \left( (x + 14)^2 - (x^2 - 2x + 4)^2 \right) \, dx$
    $(x + 14)^2 = x^2 + 28x + 196$
    $(x^2 - 2x + 4)^2 = x^4 - 4x^3 + 12x^2 - 16x + 16$
    Difference: $(x^2 + 28x + 196) - (x^4 - 4x^3 + 12x^2 - 16x + 16) = -x^4 + 4x^3 - 11x^2 + 44x + 180$

    $V = \pi \int_{-2}^5 (-x^4 + 4x^3 - 11x^2 + 44x + 180) \, dx$
    $V = \pi \left[ -\frac{x^5}{5} + x^4 - \frac{11x^3}{3} + 22x^2 + 180x \right]_{-2}^5$
    Evaluating at 5: $-\frac{625}{5} + 625 - \frac{1375}{3} + 550 + 900 = \frac{2975}{3}$
    Evaluating at -2: $\frac{32}{5} + 16 + \frac{88}{3} + 88 - 360 = -\frac{3304}{15}$
    $V = \pi \left( \frac{14875}{15} - (-\frac{3304}{15}) \right) = \frac{18179\pi}{15}$

