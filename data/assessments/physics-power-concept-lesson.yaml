sections:
- id: average-power
  title: Average Power
  content: "While work tells you *how much* energy was transferred, it tells you nothing\
    \ about *how long* the transfer took. \n\n**Power ($P$)** is the rate at which\
    \ work is done (or energy is transferred) with respect to time.\n\n$$ P_{avg}\
    \ = \\frac{W}{\\Delta t} = \\frac{\\Delta E}{\\Delta t} $$\n\n* **Units:** Joules\
    \ per second (J/s), which is called a **Watt (W)**.\n* $1 \\text{ W} = 1 \\text{\
    \ J/s}$\n* Note: Engine power is often measured in\rhorsepower (hp). $1 \\text{\
    \ hp} \\a\approx 746 \\text{ W}$.\n"
- id: instantaneous-power
  title: Instantaneous Power
  content: 'In calculus terms, the instantaneous power is the derivative of work with
    respect to time:

    $$ P = \frac{dW}{dt} $$


    Since $dW = \vec{F} \cdot d\vec{r}$, we can divide both sides by $dt$ to find
    a very useful alternative equation for instantaneous power:

    $$ P = \vec{F} \cdot \frac{d\vec{r}}{dt} = \vec{F} \cdot \vec{v} $$


    This means that the instantaneous power delivered by a force $\vec{F}$ on a particle
    moving with velocity $\vec{v}$ is the dot product of the force and the velocity
    vectors.

    '
lesson:
  introduction: Power
  sections:
  - id: sec-q001
    title: A motor applies a constant upward force of $500$ N to lift a load at a
      constant steady velocity of $2.0$ m/s. What is the power output of the motor?
    content: |
      A motor applies a constant upward force of $500$ N to lift a load at a constant steady velocity of $2.0$ m/s. What is the power output of the motor?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: 1000 W
      - id: b
        text: 250 W
      - id: c
        text: 500 W
      - id: d
        text: 0 W
      answer:
        choiceId: a
      explanation: |
        Since the force and velocity are constant and in the same direction, we can use the dot product formula: $P = \vec{F} \cdot \vec{v} = F v \cos(0^\circ) = (500)(2.0) = 1000$ W.
