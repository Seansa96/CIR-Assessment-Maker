workedExamples:
- id: follow-two-input-paths
  title: Follow two input paths
  problem: If z=x^2+2y^2, x=t, and y=t^2, find dz/dt at t=1.
  steps:
  - id: e22-s01
    type: multipleChoice
    prompt: What are z_x and z_y?
    choices:
    - id: a
      text: 2x and 4y
      issueSignals: []
    - id: b
      text: 2t and 4t^2
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: x^2 and 2y^2
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: 2x and 2y
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: 2x and 4y


      Why it works: Holding the other input fixed gives z_x=2x and z_y=4y.


      Why the other choices fail:

      Choice b: These are the input expressions, not the partial derivatives of z.

      Choice c: These are the original terms, not their derivatives.

      Choice d: This drops the coefficient 2 when differentiating 2y^2.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Find the partial derivatives
    instruction: What are z_x and z_y?
    media:
    - type: image
      src: /media/calculus-3/multivariable-chain-rule.svg
      alt: Dependency tree for the chain rule worked example.
      caption: The total rate combines both dependency paths.
  - id: e22-s02
    type: multipleChoice
    prompt: What are dx/dt and dy/dt?
    choices:
    - id: a
      text: 1 and 2t
      issueSignals: []
    - id: b
      text: 2t and 4t
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: 1 and t
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: 0 and 2t
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: 1 and 2t


      Why it works: Differentiate x=t and y=t^2 separately: dx/dt=1 and dy/dt=2t.


      Why the other choices fail:

      Choice b: These incorrectly apply the power rule to x=t and y=t^2.

      Choice c: This misses the factor 2 in d(t^2)/dt.

      Choice d: This treats x=t as constant.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Find the input rates
    instruction: What are dx/dt and dy/dt?
  - id: e22-s03
    type: multipleChoice
    prompt: What is dz/dt at t=1?
    choices:
    - id: a
      text: '18'
      issueSignals: []
    - id: b
      text: '16'
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: '12'
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: '10'
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: 18


      Why it works: At t=1, x=1,y=1, so z''=2(1)(1)+4(1)(2)=2+16=18.


      Why the other choices fail:

      Choice b: This omits the x-path contribution 2x(1)=2.

      Choice c: This pairs the x partial with y'' and the y partial with x''.

      Choice d: This uses y''=1 instead of 2, giving 2+8.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Combine and evaluate
    instruction: What is dz/dt at t=1?
- id: differentiate-an-implicit-relation
  title: Differentiate an implicit relation
  problem: The curve x^2+xy+y^2=7 passes through (1,2). Find dy/dx there.
  steps:
  - id: e34-s01
    type: multipleChoice
    prompt: Which differentiated equation is correct?
    choices:
    - id: a
      text: 2x+y+xy'+2yy'=0
      issueSignals: []
    - id: b
      text: 2x+xy'+2yy'=0
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: 2x+y+xy'+2y=0
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: 2x+y+x+y'=0
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: 2x+y+xy''+2yy''=0


      Why it works: Use the product rule on xy and chain rule on y^2, with derivative of 7 equal to zero.


      Why the other choices fail:

      Choice b: This omits the y term from differentiating xy.

      Choice c: This treats y as constant in y^2.

      Choice d: This applies neither the product rule nor the chain rule to y^2.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Differentiate each term
    instruction: Which differentiated equation is correct?
  - id: e34-s02
    type: multipleChoice
    prompt: Which equation isolates the derivative terms?
    choices:
    - id: a
      text: (x+2y)y'=-(2x+y)
      issueSignals: []
    - id: b
      text: (x+2y)y'=2x+y
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: (x+2y)y'=-(2x-y)
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: (x+2y)y'=-(x+2y)
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: (x+2y)y''=-(2x+y)


      Why it works: Move 2x+y to the right and factor y'' from xy''+2yy''.


      Why the other choices fail:

      Choice b: This moves the non-y'' terms without changing their signs.

      Choice c: This changes the sign of the y term in 2x+y.

      Choice d: This collects coefficients but replaces the remaining terms by the wrong expression.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Collect the y' terms
    instruction: Which equation isolates the derivative terms?
  - id: e34-s03
    type: multipleChoice
    prompt: What equation remains at (1,2)?
    choices:
    - id: a
      text: 5y'=-4
      issueSignals: []
    - id: b
      text: 5y'=4
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: 4y'=-5
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: 5y'=-5
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: 5y''=-4


      Why it works: x+2y=5 and -(2x+y)=-4 at the point.


      Why the other choices fail:

      Choice b: This loses the negative sign on the right side.

      Choice c: This swaps the coefficient and right-hand side.

      Choice d: This evaluates 2x+y as 5 instead of 4.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Substitute the point
    instruction: What equation remains at (1,2)?
  - id: e34-s04
    type: multipleChoice
    prompt: What is dy/dx at (1,2)?
    choices:
    - id: a
      text: -4/5
      issueSignals: []
    - id: b
      text: 4/5
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: -5/4
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: '-4'
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: -4/5


      Why it works: Divide both sides of 5y''=-4 by 5.


      Why the other choices fail:

      Choice b: This drops the negative sign.

      Choice c: This inverts the ratio.

      Choice d: This stops before dividing by the coefficient 5.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Solve for the slope
    instruction: What is dy/dx at (1,2)?
- id: differentiate-through-a-two-variable-tree
  title: Differentiate through a two-variable tree
  problem: Let w=xy+z, x=u+v, y=u-v, and z=uv. Find (w_u,w_v) at (u,v)=(2,1).
  steps:
  - id: e41-s01
    type: multipleChoice
    prompt: What are (x,y,z) at (2,1)?
    choices:
    - id: a
      text: (3,1,2)
      issueSignals: []
    - id: b
      text: (3,1,1)
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: (1,3,2)
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: (3,1,3)
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: (3,1,2)


      Why it works: Substitution gives x=3,y=1,z=2.


      Why the other choices fail:

      Choice b: This substitutes z=u-v instead of z=uv.

      Choice c: This swaps x=u+v and y=u-v.

      Choice d: This evaluates uv as 3 instead of 2.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Evaluate the intermediate variables
    instruction: What are (x,y,z) at (2,1)?
  - id: e41-s02
    type: multipleChoice
    prompt: What are (w_x,w_y,w_z) at (3,1,2)?
    choices:
    - id: a
      text: (1,3,1)
      issueSignals: []
    - id: b
      text: (3,1,2)
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: (1,3,0)
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: (1,2,1)
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: (1,3,1)


      Why it works: For w=xy+z, the outer partials are y,x,1.


      Why the other choices fail:

      Choice b: This reports the intermediate inputs instead of differentiating w.

      Choice c: This incorrectly treats z as absent from w.

      Choice d: This substitutes z for x in w_y=x.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Find the outer partials
    instruction: What are (w_x,w_y,w_z) at (3,1,2)?
  - id: e41-s03
    type: multipleChoice
    prompt: What is w_u at (2,1)?
    choices:
    - id: a
      text: '5'
      issueSignals: []
    - id: b
      text: '4'
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: '1'
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: '7'
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: 5


      Why it works: w_u=w_x(1)+w_y(1)+w_z(1)=1+3+1=5.


      Why the other choices fail:

      Choice b: This omits the z path contribution z_u=1.

      Choice c: This keeps only w_x x_u.

      Choice d: This uses w_x=x instead of w_x=y.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Sum paths to u
    instruction: What is w_u at (2,1)?
  - id: e41-s04
    type: multipleChoice
    prompt: What is w_v at (2,1)?
    choices:
    - id: a
      text: '0'
      issueSignals: []
    - id: b
      text: '6'
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: '3'
      issueSignals:
      - id: chain-rule-missed
    - id: d
      text: '-2'
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    explanation: 'Solution: 0


      Why it works: w_v=w_x(1)+w_y(-1)+w_z(2)=1-3+2=0.


      Why the other choices fail:

      Choice b: This uses y_v=1 instead of -1: 1+3+2.

      Choice c: This keeps the x and z paths but drops the y path.

      Choice d: This omits the z path contribution z_v=u=2.'
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Sum paths to v
    instruction: What is w_v at (2,1)?
