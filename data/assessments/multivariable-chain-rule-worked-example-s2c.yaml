      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
      Calculus.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s003
    title: Combine at t=1
    instruction: What is dz/dt?
    type: multipleChoice
    prompt: What is dz/dt?
