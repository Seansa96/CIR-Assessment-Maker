workedExamples:
- id: example-001
  title: Build the representation
  problem: If $z=x^2+y^2$, $x=t$, and $y=t^2$, find $dz/dt$ at $t=1$.
  steps:
  - id: s001
    title: Find partials
    instruction: What are $z_x$ and $z_y$?
    type: multipleChoice
    prompt: What are $z_x$ and $z_y$?
    choices:
    - id: a
      text: $2x$ and $2y$
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $2x$ and $2y$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
      Calculus.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s002
    title: Find component rates
    instruction: What are dx/dt and dy/dt?
    type: multipleChoice
    prompt: What are dx/dt and dy/dt?
    choices:
