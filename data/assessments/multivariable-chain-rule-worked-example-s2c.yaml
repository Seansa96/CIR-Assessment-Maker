    title: Find partials
    instruction: What are $z_x$ and $z_y$?
    type: multipleChoice
    prompt: What are $z_x$ and $z_y$?
    choices:
    - id: a
      text: $2x$ and $2y$
    - id: b
      text: 1 and $2t$ (answers 'What are dx/dt and dy/dt?', not 'What are $z_x$ and $z_y$?')
      issueSignals:
      - id: chain-rule-missed
    - id: c
      text: 6 (answers 'What is dz/dt?', not 'What are $z_x$ and $z_y$?')
      issueSignals:
      - id: sign-error
    - id: d
      text: $dz/dt=f_x dx/dt+f_y dy/dt$ (answers 'If $z=f(x,y)$ and x,y depend on t, which formula is correct?', not 'What
        are $z_x$ and $z_y$?')
      issueSignals:
      - id: chain-rule-missed
    answer:
      choiceId: a
    issueSignals:
    - id: chain-rule-missed
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
