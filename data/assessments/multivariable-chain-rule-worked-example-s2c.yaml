  - id: e22-s01
    title: Find the partial derivatives
    instruction: What are z_x and z_y?
    hint: 
    type: multipleChoice
    prompt: What are z_x and z_y?
    choices:
    - id: a
      text: 2x and 4y
      media: []
      issueSignals: []
    - id: b
      text: 2t and 4t^2
      media: []
      issueSignals:
      - id: chain-rule-missed
        domains: []
    - id: c
      text: x^2 and 2y^2
      media: []
      issueSignals:
      - id: chain-rule-missed
        domains: []
    - id: d
      text: 2x and 2y
      media: []
      issueSignals:
      - id: chain-rule-missed
        domains: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
