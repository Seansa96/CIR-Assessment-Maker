schemaVersion: 1
id: aops-angle-chasing-concept-lesson
title: 'Angle Chasing I: Lines, Triangles, and Parallels'
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-angle-chasing
modeDefault: learn
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - art-of-problem-solving
  - aops-angle-chasing
  - aops-volume-1
  - geometry
  - proof
skills:
- Maintain a reason ledger for angle relations.
- Combine intersection, triangle, parallel-line, and isosceles facts.
- Validate a multi-step chase without relying on scale.
lesson:
  introduction: Angle chasing is controlled information propagation. Build a short chain of justified equalities and sums, and never treat visual appearance as a theorem.
  sections:
  - id: aops-angle-ledger
    title: Angle chasing is a reason ledger
    required: true
    content: Mark only stated givens, then attach a reason to every new angle. The atomic moves are vertical angles equal, a linear pair sums to $180^\circ$, angles around a point sum to $360^\circ$, and triangle angles sum to $180^\circ$. A chase is valid because of this chain, not because the drawing resembles a familiar configuration.
    media:
    - type: image
      src: /assessments/aops/aops-angle-triangle.svg
      alt: Triangle with two known angles and a marked exterior target.
      caption: Each transferred or computed angle needs a named reason.
    check:
      id: aops-angle-ledger-check
      type: multipleChoice
      prompt: Which note belongs in a valid reason ledger?
      choices:
      - id: a
        text: $x=48^\circ+67^\circ$ by the exterior-angle theorem.
      - id: b
        text: $x$ looks obtuse.
      - id: c
        text: $x$ is about $120^\circ$ from the drawing.
      - id: d
        text: $x$ equals the longest side.
      answer:
        choiceId: a
      explanation: The note states both the relation and its justification.
  - id: aops-angle-intersections
    title: 'Intersections: vertical angles and linear pairs'
    required: true
    content: Opposite angles formed by two intersecting lines are vertical and equal. Adjacent angles whose noncommon sides form a line are a linear pair and sum to $180^\circ$. Decide whether the target is opposite or adjacent before choosing equality or supplementation.
    media:
    - type: image
      src: /assessments/aops/aops-angle-lines.svg
      alt: Two parallel lines crossed by a transversal with marked interior angles.
      caption: At each intersection, location determines whether angles are equal or supplementary.
    check:
      id: aops-angle-intersections-check
      type: multipleChoice
      prompt: One angle at an intersection is $73^\circ$. What is an adjacent angle?
      choices:
      - id: a
        text: $107^\circ$
      - id: b
        text: $73^\circ$
      - id: c
        text: $17^\circ$
      - id: d
        text: $287^\circ$
      answer:
        choiceId: a
      explanation: Adjacent linear-pair angles sum to $180^\circ$.
  - id: aops-angle-triangle-sum
    title: Triangles and exterior angles
    required: true
    content: Triangle interior angles total $180^\circ$. An exterior angle formed by extending one side equals the sum of the two remote interior angles; this follows by combining triangle sum with a linear pair. The remote angles are the two not adjacent to the exterior angle.
    media:
    - type: image
      src: /assessments/aops/aops-angle-triangle.svg
      alt: Triangle ABC with remote interior angles 48 and 67 degrees and exterior angle x at C.
      caption: The exterior target equals the two marked remote interior angles.
    check:
      id: aops-angle-triangle-sum-check
      type: multipleChoice
      prompt: For the shown values, what is $x$?
      choices:
      - id: a
        text: $115^\circ$
      - id: b
        text: $65^\circ$
      - id: c
        text: $67^\circ$
      - id: d
        text: $180^\circ$
      answer:
        choiceId: a
      explanation: $x=48^\circ+67^\circ=115^\circ$.
  - id: aops-angle-parallels
    title: Parallel lines transfer angles
    required: true
    content: When parallel lines are cut by a transversal, corresponding and alternate interior angles are equal, while same-side interior angles are supplementary. These conclusions require an explicit parallel marking or a proved parallel relationship. Position names are safer than memorized letter shapes when a diagram is rotated.
    media:
    - type: image
      src: /assessments/aops/aops-angle-lines.svg
      alt: Parallel lines l and m with a 62 degree angle alternate interior to x.
      caption: The arrow marks supply the parallel hypothesis.
    check:
      id: aops-angle-parallels-check
      type: multipleChoice
      prompt: In the marked diagram, what is $x$?
      choices:
      - id: a
        text: $62^\circ$
      - id: b
        text: $118^\circ$
      - id: c
        text: $28^\circ$
      - id: d
        text: Not enough information
      answer:
        choiceId: a
      explanation: Alternate interior angles between parallel lines are equal.
  - id: aops-angle-isosceles
    title: Equal sides transfer to equal angles
    required: true
    content: 'In an isosceles triangle, equal sides face equal angles. The converse also holds: equal angles face equal sides. Mark which sides or angles are given equal before using the theorem. If a segment bisects the vertex angle of an isosceles triangle, congruent subtriangles often make it also a median and altitude.'
    media:
    - type: image
      src: /assessments/aops/aops-angle-isosceles.svg
      alt: Isosceles triangle ABC with AB equal AC and the 40 degree vertex angle bisected by AD.
      caption: Equal sides and a bisected vertex angle create congruent halves.
    check:
      id: aops-angle-isosceles-check
      type: multipleChoice
      prompt: If the vertex angle is $40^\circ$, what is each base angle?
      choices:
      - id: a
        text: $70^\circ$
      - id: b
        text: $40^\circ$
      - id: c
        text: $80^\circ$
      - id: d
        text: $140^\circ$
      answer:
        choiceId: a
      explanation: The equal base angles share the remaining $140^\circ$.
  - id: aops-angle-direction
    title: Work forward and backward
    required: true
    content: 'Forward work propagates known values. Backward work asks which equality or sum would determine the target. Meet in the middle: if the target is an exterior angle, seek its remote interiors; if it lies on a transversal, seek a transferable mate. Avoid computing every visible angle when only a short route is relevant.'
    media:
    - type: image
      src: /assessments/aops/aops-angle-lines.svg
      alt: A target angle x positioned across a transversal from a known 62 degree angle.
      caption: Backward analysis identifies the exact transferable mate of x.
    check:
      id: aops-angle-direction-check
      type: multipleChoice
      prompt: What is the best backward question for target $x$ on a transversal?
      choices:
      - id: a
        text: Which corresponding or alternate angle is linked to $x$?
      - id: b
        text: How many angles can I label?
      - id: c
        text: Does $x$ look acute?
      - id: d
        text: Can I ignore the parallel marks?
      answer:
        choiceId: a
      explanation: The target's position determines the useful relation.
  - id: aops-angle-validation
    title: Validate the chase
    required: true
    content: Check that triangle totals are $180^\circ$, angles around a point total $360^\circ$, and every angle measure lies between $0^\circ$ and $180^\circ$ unless a reflex angle is explicitly requested. Most importantly, audit every use of a converse and every parallel-line transfer for its missing hypothesis.
    media:
    - type: image
      src: /assessments/aops/aops-angle-triangle.svg
      alt: Triangle and exterior angle configuration used to check an angle sum.
      caption: A final sum check catches arithmetic and orientation errors.
    check:
      id: aops-angle-validation-check
      type: multipleChoice
      prompt: A chase gives triangle angles $48^\circ$, $67^\circ$, and $75^\circ$. What does the check reveal?
      choices:
      - id: a
        text: The result is invalid because the sum is $190^\circ$.
      - id: b
        text: The triangle is isosceles.
      - id: c
        text: The result is valid.
      - id: d
        text: The exterior angle is $75^\circ$.
      answer:
        choiceId: a
      explanation: Interior angles of a triangle must sum to $180^\circ$.
