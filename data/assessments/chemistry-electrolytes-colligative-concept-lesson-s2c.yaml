    - type: image
      src: /media/chemistry/electrolyte-particle-model.svg
      alt: Strong-electrolyte ion diagram
      caption: Strong electrolytes have mostly separated ions.
    check:
      id: ec-02-c
      type: multipleChoice
      prompt: Which is a strong electrolyte in water?
      choices:
      - id: a
        text: KNO3
