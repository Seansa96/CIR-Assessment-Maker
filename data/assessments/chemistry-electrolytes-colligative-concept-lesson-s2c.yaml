      explanation: 'Solution: Each formula unit supplies three nitrate ions, so $[NO_3^-]=3(0.150)=0.450\ \mathrm M$. Why it works: The subscript 3 is the ion stoichiometric coefficient. Common trap: Reporting the formula-unit concentration unchanged.'
