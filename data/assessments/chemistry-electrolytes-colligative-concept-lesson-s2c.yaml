        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Mobile ions carry charge, so a solution conducts when ions are present. Why it works: Conductivity requires charged particles that move through solution. Why the other choices fail: Mass, color, and size alone do not supply charge carriers.'
