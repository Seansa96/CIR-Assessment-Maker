  - id: ec-03
    title: 3. Distinguish weak and nonelectrolytes
    required: true
    content: A weak electrolyte partially ionizes, so both molecules and ions occur. A nonelectrolyte may dissolve well but remains neutral; solubility and conductivity are different ideas.
    media:
    - type: image
      src: /media/chemistry/electrolyte-particle-model.svg
      alt: Weak and nonelectrolyte particle diagram
      caption: A weak electrolyte has some ions; a nonelectrolyte has none.
    check:
      id: ec-03-c
      type: multipleChoice
      prompt: Why can sugar dissolve without conducting?
      choices:
      - id: a
        text: It remains neutral molecules.
        media: []
        issueSignals: []
      - id: b
        text: Water cannot dissolve it.
        media: []
        issueSignals: []
      - id: c
        text: It forms only cations.
        media: []
        issueSignals: []
      - id: d
        text: It always precipitates.
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Sugar molecules are solvated but do not form ions. Why it works: Conductivity needs charged particles, not merely dissolved particles. Why the other choices fail: Sugar can dissolve; it forms neither ions nor precipitate under ordinary conditions.'
