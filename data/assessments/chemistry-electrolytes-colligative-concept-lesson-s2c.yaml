  - id: ec-04
    title: 4. Use formula subscripts to find ion molarity
    required: true
    content: For complete dissociation, a formula subscript becomes a stoichiometric multiplier. For 0.20 M CaCl2, [Ca2+] = 0.20 M and [Cl−] = 0.40 M.
    media:
    - type: image
      src: /media/chemistry/electrolyte-particle-model.svg
      alt: Calcium chloride particle model
      caption: One CaCl2 unit yields one calcium ion and two chloride ions.
    check:
      id: ec-04-c
      type: numericResponse
      prompt: Find [NO3−] in 0.150 M Al(NO3)3, assuming complete dissociation.
