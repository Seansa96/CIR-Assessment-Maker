  - id: ec-06
    title: 6. Predict the direction of each property change
    required: true
    content: Compared with pure solvent, nonvolatile solute lowers freezing point, raises boiling point, and creates osmotic pressure. These are directional predictions, not necessarily numerical calculations in this course block.
    media:
    - type: image
      src: /media/chemistry/electrolyte-particle-model.svg
      alt: Particle model for colligative effects
      caption: Solute particles change phase-equilibrium behavior.
    check:
      id: ec-06-c
      type: multipleChoice
      prompt: Adding a nonvolatile solute to water changes its boiling point how?
      choices:
      - id: a
        text: It increases.
