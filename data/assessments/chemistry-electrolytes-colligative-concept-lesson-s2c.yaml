lesson:
  introduction: A dissolved substance can be present as intact neutral molecules, separated ions, or a mixture of both. Count the dissolved particles before predicting conductivity or colligative trends.
  sections:
  - id: ec-01
    title: 1. Separate dissolving from ionizing
    required: true
    content: Dissolving places particles in solvent. Dissociation separates an ionic compound into its existing ions; ionization forms ions from a molecular compound. Both can produce electrolyte solutions.
    media:
    - type: image
      src: /media/chemistry/electrolyte-particle-model.svg
      alt: Particle models of strong weak and nonelectrolytes
      caption: Electrical behavior follows the ions actually present.
    check:
      id: ec-01-c
      type: multipleChoice
      prompt: Which change makes a solution conduct?
      choices:
      - id: a
        text: mobile ions appear
        media: []
        issueSignals: []
      - id: b
        text: solvent becomes heavier'
        media: []
        issueSignals: []
      - id: c
        text: solute color changes'
        media: []
        issueSignals: []
      - id: d
        text: molecules become larger'
        media: []
        issueSignals: []
