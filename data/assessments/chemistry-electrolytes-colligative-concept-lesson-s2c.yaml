title: Electrolytes, Ion Concentration, and Colligative Properties
assessmentType: conceptLesson
categoryId: chemistry
topicId: chemistry-electrolytes-colligative
modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [chemistry, electrolytes, ions, colligative-properties] }
authoring: { visualRequirement: required, visualRationale: 'Electrolyte strength and colligative effects depend on particle-level representations.', sourceId: src-20260720035703-91ea51b0d8 }
lesson:
  introduction: 'A dissolved substance can be present as intact neutral molecules, separated ions, or a mixture of both. Count the dissolved particles before predicting conductivity or colligative trends.'
  sections:
    - { id: ec-01, title: '1. Separate dissolving from ionizing', content: 'Dissolving places particles in solvent. Dissociation separates an ionic compound into its existing ions; ionization forms ions from a molecular compound. Both can produce electrolyte solutions.', media: [{ type: image, src: /media/chemistry/electrolyte-particle-model.svg, alt: Particle models of strong weak and nonelectrolytes, caption: Electrical behavior follows the ions actually present. }], check: { id: ec-01-c, type: multipleChoice, prompt: 'Which change makes a solution conduct?', choices: [{ id: a, text: 'mobile ions appear' }, { id: b, text: solvent becomes heavier' }, { id: c, text: solute color changes' }, { id: d, text: molecules become larger' }], answer: { choiceId: a }, explanation: 'Solution: Mobile ions carry charge, so a solution conducts when ions are present. Why it works: Conductivity requires charged particles that move through solution. Why the other choices fail: Mass, color, and size alone do not supply charge carriers.' } }
    - { id: ec-02, title: '2. Classify strong electrolytes', content: 'Soluble ionic compounds, strong acids, and strong bases produce ions essentially completely in water. Their particle diagram contains separated cations and anions.', media: [{ type: image, src: /media/chemistry/electrolyte-particle-model.svg, alt: Strong-electrolyte ion diagram, caption: Strong electrolytes have mostly separated ions. }], check: { id: ec-02-c, type: multipleChoice, prompt: 'Which is a strong electrolyte in water?', choices: [{ id: a, text: 'KNO3' }, { id: b, text: 'C2H5OH' }, { id: c, text: 'sucrose' }, { id: d, text: 'CH3COOH' }], answer: { choiceId: a }, explanation: 'Solution: KNO3 is a soluble ionic compound and dissociates completely. Why it works: Soluble salts provide mobile ions. Why the other choices fail: Ethanol and sucrose remain neutral molecules; acetic acid ionizes only partially.' } }
    - { id: ec-03, title: '3. Distinguish weak and nonelectrolytes', content: 'A weak electrolyte partially ionizes, so both molecules and ions occur. A nonelectrolyte may dissolve well but remains neutral; solubility and conductivity are different ideas.', media: [{ type: image, src: /media/chemistry/electrolyte-particle-model.svg, alt: Weak and nonelectrolyte particle diagram, caption: A weak electrolyte has some ions; a nonelectrolyte has none. }], check: { id: ec-03-c, type: multipleChoice, prompt: 'Why can sugar dissolve without conducting?', choices: [{ id: a, text: 'It remains neutral molecules.' }, { id: b, text: 'Water cannot dissolve it.' }, { id: c, text: 'It forms only cations.' }, { id: d, text: 'It always precipitates.' }], answer: { choiceId: a }, explanation: 'Solution: Sugar molecules are solvated but do not form ions. Why it works: Conductivity needs charged particles, not merely dissolved particles. Why the other choices fail: Sugar can dissolve; it forms neither ions nor precipitate under ordinary conditions.' } }
    - { id: ec-04, title: '4. Use formula subscripts to find ion molarity', content: 'For complete dissociation, a formula subscript becomes a stoichiometric multiplier. For 0.20 M CaCl2, [Ca2+] = 0.20 M and [Cl−] = 0.40 M.', media: [{ type: image, src: /media/chemistry/electrolyte-particle-model.svg, alt: Calcium chloride particle model, caption: One CaCl2 unit yields one calcium ion and two chloride ions. }], check: { id: ec-04-c, type: numericResponse, prompt: 'Find [NO3−] in 0.150 M Al(NO3)3, assuming complete dissociation.', answer: { value: 0.45, tolerance: 0.001 }, explanation: 'Solution: Each formula unit supplies three nitrate ions, so $[NO_3^-]=3(0.150)=0.450\ \mathrm M$. Why it works: The subscript 3 is the ion stoichiometric coefficient. Common trap: Reporting the formula-unit concentration unchanged.' } }
    - { id: ec-05, title: '5. Count particles for colligative trends', content: 'Colligative properties depend primarily on the number of dissolved particles. At comparable concentration, a solute that produces more particles has a larger freezing-point decrease, boiling-point increase, and osmotic pressure.', media: [{ type: image, src: /media/chemistry/electrolyte-particle-model.svg, alt: Particle-count comparison, caption: More dissolved particles means a larger colligative effect. }], check: { id: ec-05-c, type: multipleChoice, prompt: 'Which 0.10 M solution has the greatest ideal particle count?', choices: [{ id: a, text: 'AlCl3' }, { id: b, text: 'NaCl' }, { id: c, text: 'glucose' }, { id: d, text: 'water' }], answer: { choiceId: a }, explanation: 'Solution: Ideal AlCl3 yields one Al3+ and three Cl− ions, four particles per formula unit. Why it works: More particles create a larger colligative effect. Why the other choices fail: NaCl yields two, glucose one, and pure water has no added solute particles.' } }
    - { id: ec-06, title: '6. Predict the direction of each property change', content: 'Compared with pure solvent, nonvolatile solute lowers freezing point, raises boiling point, and creates osmotic pressure. These are directional predictions, not necessarily numerical calculations in this course block.', media: [{ type: image, src: /media/chemistry/electrolyte-particle-model.svg, alt: Particle model for colligative effects, caption: Solute particles change phase-equilibrium behavior. }], check: { id: ec-06-c, type: multipleChoice, prompt: 'Adding a nonvolatile solute to water changes its boiling point how?', choices: [{ id: a, text: 'It increases.' }, { id: b, text: 'It decreases.' }, { id: c, text: 'It becomes zero.' }, { id: d, text: 'It is unrelated to particle count.' }], answer: { choiceId: a }, explanation: 'Solution: The boiling point increases. Why it works: Dissolved particles lower solvent vapor pressure, so more heating is needed to boil. Why the other choices fail: b reverses the trend; c is impossible; d ignores the colligative mechanism.' } }
    - { id: ec-07, title: '7. Check the dissociation assumptions', content: 'Use ion multipliers only when the problem states complete dissociation or the solute is a strong electrolyte. Weak acids/bases require an equilibrium model; nonelectrolytes contribute molecules but no ions.', media: [{ type: image, src: /media/chemistry/electrolyte-particle-model.svg, alt: Strong weak and nonelectrolyte comparison, caption: The correct particle model depends on dissociation extent. }], check: { id: ec-07-c, type: multipleChoice, prompt: 'Why is [H+] not automatically equal to the stated concentration of HF?', choices: [{ id: a, text: 'HF is a weak acid and only partially ionizes.' }, { id: b, text: 'HF is insoluble.' }, { id: c, text: 'Hydrogen has no charge.' }, { id: d, text: 'All acids have zero ions.' }], answer: { choiceId: a }, explanation: 'Solution: HF establishes partial ionization, so its hydrogen-ion concentration is not simply its formal concentration. Why it works: Weak electrolyte particle counts require an equilibrium qualification. Why the other choices fail: HF can dissolve; hydrogen ions are charged; acids do produce ions.' } }
