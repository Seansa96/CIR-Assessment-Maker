  - id: ec-05
    title: 5. Count particles for colligative trends
    required: true
    content: Colligative properties depend primarily on the number of dissolved particles. At comparable concentration, a solute that produces more particles has a larger freezing-point decrease, boiling-point increase, and osmotic pressure.
    media:
    - type: image
      src: /media/chemistry/electrolyte-particle-model.svg
      alt: Particle-count comparison
      caption: More dissolved particles means a larger colligative effect.
    check:
      id: ec-05-c
      type: multipleChoice
      prompt: Which 0.10 M solution has the greatest ideal particle count?
      choices:
      - id: a
        text: AlCl3
        media: []
        issueSignals: []
      - id: b
        text: NaCl
        media: []
        issueSignals: []
      - id: c
        text: glucose
        media: []
        issueSignals: []
      - id: d
        text: water
        media: []
        issueSignals: []
