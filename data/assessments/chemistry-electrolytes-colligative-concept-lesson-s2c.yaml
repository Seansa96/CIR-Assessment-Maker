        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Ideal AlCl3 yields one Al3+ and three Cl− ions, four particles per formula unit. Why it works: More particles create a larger colligative effect. Why the other choices fail: NaCl yields two, glucose one, and pure water has no added solute particles.'
