  - id: ec-07
    title: 7. Check the dissociation assumptions
    required: true
    content: Use ion multipliers only when the problem states complete dissociation or the solute is a strong electrolyte. Weak acids/bases require an equilibrium model; nonelectrolytes contribute molecules but no ions.
    media:
    - type: image
      src: /media/chemistry/electrolyte-particle-model.svg
      alt: Strong weak and nonelectrolyte comparison
      caption: The correct particle model depends on dissociation extent.
