lesson:
  introduction: 'This lesson introduces Virtualization and the Cloud through the mental models emphasized by 7 Virtualization
    and the Cloud. Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: virtualization-goal
    title: Virtualization goal
    required: true
    content: 'Virtualization lets multiple isolated environments share physical hardware while appearing to have their own
      machine.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Virtualization is about isolation and abstraction, not only convenience.

      '
    check:
      id: virtualization-goal-check
      title: 'Check: Virtualization goal'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Virtualization goal**?

        '
      choices:
      - id: a
        text: Virtualization lets multiple isolated environments share physical hardware while appearing to have their own
          machine.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Virtualization lets multiple isolated environments share physical hardware while appearing to have their
        own machine. Related topic: Virtualization and the Cloud.

        '
  - id: hypervisor
    title: Hypervisor
    required: true
    content: 'A hypervisor manages virtual machines and mediates access to CPU, memory, and I/O.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A hypervisor sits below guest OSes, not inside each ordinary application.

      '
    check:
      id: hypervisor-check
      title: 'Check: Hypervisor'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Hypervisor**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: A hypervisor manages virtual machines and mediates access to CPU, memory, and I/O.
      answer:
        choiceId: d
      explanation: 'A hypervisor manages virtual machines and mediates access to CPU, memory, and I/O. Related topic: Virtualization
        and the Cloud.

        '
  - id: trap-and-emulate
    title: Trap and emulate
    required: true
    content: 'Privileged guest operations may be trapped and emulated or otherwise handled safely by the virtualization layer.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Not every instruction can be handled identically on all hardware.

      '
    check:
      id: trap-and-emulate-check
      title: 'Check: Trap and emulate'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Trap and emulate**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Privileged guest operations may be trapped and emulated or otherwise handled safely by the virtualization layer.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Privileged guest operations may be trapped and emulated or otherwise handled safely by the virtualization
        layer. Related topic: Virtualization and the Cloud.

        '
  - id: containers-versus-vms
    title: Containers versus VMs
    required: true
    content: 'Containers share a kernel while virtual machines generally run separate guest OS kernels.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Containers are lighter but have a different isolation boundary.

      '
    check:
      id: containers-versus-vms-check
      title: 'Check: Containers versus VMs'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Containers versus VMs**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Containers share a kernel while virtual machines generally run separate guest OS kernels.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Containers share a kernel while virtual machines generally run separate guest OS kernels. Related topic:
        Virtualization and the Cloud.

        '
  - id: cloud-abstraction
    title: Cloud abstraction
    required: true
    content: 'Cloud platforms package compute, storage, and networking as provisioned resources with elastic management.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Cloud is not magic hardware; it is managed virtualization plus operational tooling.

      '
    check:
      id: cloud-abstraction-check
      title: 'Check: Cloud abstraction'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Cloud abstraction**?

        '
      choices:
      - id: a
        text: Cloud platforms package compute, storage, and networking as provisioned resources with elastic management.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Cloud platforms package compute, storage, and networking as provisioned resources with elastic management.
        Related topic: Virtualization and the Cloud.

        '
  - id: isolation-tradeoff
    title: Isolation tradeoff
    required: true
    content: 'Stronger isolation often costs overhead, while lighter isolation may require more trust in the shared kernel.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Performance and isolation must be reasoned together.

      '
    check:
      id: isolation-tradeoff-check
      title: 'Check: Isolation tradeoff'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Isolation tradeoff**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Stronger isolation often costs overhead, while lighter isolation may require more trust in the shared kernel.
      answer:
        choiceId: d
      explanation: 'Stronger isolation often costs overhead, while lighter isolation may require more trust in the shared
        kernel. Related topic: Virtualization and the Cloud.

        '
