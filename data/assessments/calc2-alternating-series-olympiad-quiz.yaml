    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Telescoping
  answer:
    choiceId: a
  explanation: |-
    Solution: The magnitudes decrease to zero, while $\arctan(1/n)/(1/n)\to1$, so their absolute sum is harmonic-order. Therefore the answer is Conditionally convergent.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Absolutely convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Telescoping conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
