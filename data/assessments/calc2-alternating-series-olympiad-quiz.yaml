- id: q001
  type: multipleChoice
  skills:
  - distinguish-absolute-from-alternating-convergence
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n(n+1)}$.
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent
  - id: d
    text: The alternating-series test is inconclusive
  answer:
    choiceId: a
  explanation: |-
    Solution: The absolute terms are bounded by $1/n^2$, so the signed series has the stronger absolute convergence property. Therefore the answer is Absolutely convergent.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Conditionally convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; The alternating-series test is inconclusive conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q002
  type: multipleChoice
  skills:
  - analyze-radical-difference-series
  prompt: |
    Determine the strongest classification of
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\left(\sqrt{n+1}-\sqrt n\right).$$
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Divergent because its absolute series telescopes
  answer:
    choiceId: a
  explanation: |-
    Solution: The magnitudes decrease to zero after rationalization, while their unsigned partial sum is $\sqrt{N+1}-1$, which diverges. Therefore the answer is Conditionally convergent.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Absolutely convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent by the term test conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent because its absolute series telescopes conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q003
  type: multipleChoice
  skills:
  - classify-parameterized-alternating-series
  prompt: |
    For which real $\alpha$ is
    $\sum_{n=1}^{\infty}(-1)^{n-1}n^\alpha/(n+1)$ conditionally convergent?
  choices:
  - id: a
    text: |-
      $0\le\alpha<1$
  - id: b
    text: |-
      $\alpha<0$
  - id: c
    text: |-
      $\alpha\ge1$
  - id: d
    text: |-
      $-1<\alpha<0$
  answer:
    choiceId: a
  explanation: |-
    Solution: Signed convergence holds for $\alpha<1$ because the magnitudes eventually decrease to zero; absolute convergence holds exactly for $\alpha<0$. Therefore the answer is $0\le\alpha<1$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\alpha<0$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\alpha\ge1$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $-1<\alpha<0$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q004
  type: multipleChoice
  skills:
  - analyze-logarithmic-parameter-series
  prompt: |
    For what $p$ is
    $\sum_{n=2}^{\infty}(-1)^n/[n(\ln n)^p]$ conditionally convergent?
  choices:
  - id: a
    text: |-
      $p\le1$
  - id: b
    text: $p>1$
  - id: c
    text: $p>0$ only
  - id: d
    text: No real $p$
  answer:
    choiceId: a
  explanation: |-
    Solution: For every real p the magnitudes eventually decrease to zero, but the positive logarithmic p-series converges only for p greater than one. Therefore the answer is $p\le1$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $p>1$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $p>0$ only conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; No real $p$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q005
  type: multipleChoice
  skills:
  - pair-alternating-series
  prompt: 'Pair consecutive terms of the alternating harmonic series. Which positive

    series results?

    '
  choices:
  - id: a
    text: |-
      $\sum_{k=1}^{\infty}1/[(2k-1)(2k)]$
  - id: b
    text: |-
      $\sum_{k=1}^{\infty}1/(2k)$
  - id: c
    text: |-
      $\sum_{k=1}^{\infty}1/k^2$
  - id: d
    text: |-
      $\sum_{k=1}^{\infty}1/(2k-1)$
  answer:
    choiceId: a
  explanation: |-
    Solution: Each pair is $1/(2k-1)-1/(2k)=1/[(2k-1)(2k)]$. Therefore the answer is $\sum_{k=1}^{\infty}1/[(2k-1)(2k)]$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\sum_{k=1}^{\infty}1/(2k)$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum_{k=1}^{\infty}1/k^2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum_{k=1}^{\infty}1/(2k-1)$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q006
  type: multipleChoice
  skills:
  - infer-remainder-sign-and-size
  prompt: |
    Let $S_N=\sum_{n=1}^{N}(-1)^{n-1}/n$. Which statement is true for
    every even $N$?
  choices:
  - id: a
    text: |-
      $0<\ln2-S_N<1/(N+1)$
  - id: b
    text: |-
      $0<S_N-\ln2<1/(N+1)$
  - id: c
    text: |-
      $|\ln2-S_N|>1/(N+1)$
  - id: d
    text: |-
      $S_N=\ln2$
  answer:
    choiceId: a
  explanation: |-
    Solution: Even partial sums lie below the limit, and the remainder magnitude is smaller than the next positive term. Therefore the answer is $0<\ln2-S_N<1/(N+1)$.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: $0<S_N-\ln2<1/(N+1)$ conflicts with this criterion: Direct comparison uses nonnegative terms; $|\ln2-S_N|>1/(N+1)$ conflicts with this criterion: Direct comparison uses nonnegative terms; $S_N=\ln2$ conflicts with this criterion: Direct comparison uses nonnegative terms.
- id: q007
  type: multipleChoice
  skills:
  - apply-small-angle-asymptotics
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^{n-1}\arctan(1/n)$.
