schemaVersion: 1
id: calc2-alternating-series-olympiad-quiz
title: Alternating Series Olympiad Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: alternating-series
skills:
- Analyze nonstandard and parameterized alternating magnitudes
- Transform paired series and justify preserved sums
- Use rigorous remainder, Abel, and Dirichlet reasoning
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - alternating-series
  - olympiad
  - cancellation
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - distinguish-absolute-from-alternating-convergence
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n(n+1)}$.
  choices:
  - id: a
    text: Absolutely convergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Divergent
  - id: d
    text: The alternating-series test is inconclusive
  answer:
    choiceId: a
  explanation: The absolute terms are bounded by $1/n^2$, so the signed series has the stronger absolute
    convergence property.
- id: q002
  type: multipleChoice
  skills:
  - analyze-radical-difference-series
  prompt: |
    Determine the strongest classification of
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\left(\sqrt{n+1}-\sqrt n\right).$$
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Divergent because its absolute series telescopes
  answer:
    choiceId: a
  explanation: |-
    The magnitudes decrease to zero after rationalization, while their unsigned partial sum is $\sqrt{N+1}-1$, which diverges.
- id: q003
  type: multipleChoice
  skills:
  - classify-parameterized-alternating-series
  prompt: |
    For which real $\alpha$ is
    $\sum_{n=1}^{\infty}(-1)^{n-1}n^\alpha/(n+1)$ conditionally convergent?
  choices:
  - id: a
    text: |-
      $0\le\alpha<1$
  - id: b
    text: |-
      $\alpha<0$
  - id: c
    text: |-
      $\alpha\ge1$
  - id: d
    text: |-
      $-1<\alpha<0$
  answer:
    choiceId: a
  explanation: |-
    Signed convergence holds for $\alpha<1$ because the magnitudes eventually decrease to zero; absolute convergence holds exactly for $\alpha<0$.
- id: q004
  type: multipleChoice
  skills:
  - analyze-logarithmic-parameter-series
  prompt: |
    For what $p$ is
    $\sum_{n=2}^{\infty}(-1)^n/[n(\ln n)^p]$ conditionally convergent?
  choices:
  - id: a
    text: |-
      $p\le1$
  - id: b
    text: $p>1$
  - id: c
    text: $p>0$ only
  - id: d
    text: No real $p$
  answer:
    choiceId: a
  explanation: For every real p the magnitudes eventually decrease to zero, but the positive logarithmic
    p-series converges only for p greater than one.
- id: q005
  type: multipleChoice
  skills:
  - pair-alternating-series
  prompt: |
    Pair consecutive terms of the alternating harmonic series. Which positive
    series results?
  choices:
  - id: a
    text: |-
      $\sum_{k=1}^{\infty}1/[(2k-1)(2k)]$
  - id: b
    text: |-
      $\sum_{k=1}^{\infty}1/(2k)$
  - id: c
    text: |-
      $\sum_{k=1}^{\infty}1/k^2$
  - id: d
    text: |-
      $\sum_{k=1}^{\infty}1/(2k-1)$
  answer:
    choiceId: a
  explanation: Each pair is $1/(2k-1)-1/(2k)=1/[(2k-1)(2k)]$.
- id: q006
  type: multipleChoice
  skills:
  - infer-remainder-sign-and-size
  prompt: |
    Let $S_N=\sum_{n=1}^{N}(-1)^{n-1}/n$. Which statement is true for
    every even $N$?
  choices:
  - id: a
    text: |-
      $0<\ln2-S_N<1/(N+1)$
  - id: b
    text: |-
      $0<S_N-\ln2<1/(N+1)$
  - id: c
    text: |-
      $|\ln2-S_N|>1/(N+1)$
  - id: d
    text: |-
      $S_N=\ln2$
  answer:
    choiceId: a
  explanation: Even partial sums lie below the limit, and the remainder magnitude is smaller than the
    next positive term.
- id: q007
  type: multipleChoice
  skills:
  - apply-small-angle-asymptotics
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^{n-1}\arctan(1/n)$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Telescoping
  answer:
    choiceId: a
  explanation: |-
    The magnitudes decrease to zero, while $\arctan(1/n)/(1/n)\to1$, so their absolute sum is harmonic-order.
- id: q008
  type: multipleChoice
  skills:
  - detect-absolute-convergence-from-cancellation-order
  prompt: |
    How does $\sum_{n=1}^{\infty}(-1)^n[1-\cos(1/n)]$ converge?
  choices:
  - id: a
    text: Absolutely
  - id: b
    text: Conditionally
  - id: c
    text: It diverges by the term test.
  - id: d
    text: The alternating-series test is the only available argument.
  answer:
    choiceId: a
  explanation: |-
    Since $1-\cos x\sim x^2/2$, the absolute terms are comparable to $1/(2n^2)$.
- id: q009
  type: multipleChoice
  skills:
  - use-abel-summation-limits
  prompt: |
    For $0\le x<1$, let $F(x)=\sum_{n=0}^{\infty}(-1)^nx^n$. What is
    $\lim_{x\to1^-}F(x)$?
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $0$
  - id: c
    text: $1$
  - id: d
    text: The limit diverges.
  answer:
    choiceId: a
  explanation: Inside its convergence interval the geometric sum is $1/(1+x)$, whose left boundary limit
    is one half.
- id: q010
  type: multipleChoice
  skills:
  - apply-dirichlets-test
  prompt: |
    Let $c_n$ repeat $1,-2,1$. What is the strongest classification of
    $\sum_{n=1}^{\infty}c_n/n$?
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent because signs do not alternate one by one
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: The coefficient partial sums are bounded because each period sums to zero, so Dirichlet
    applies; the absolute terms dominate a positive-density harmonic subseries.
- id: q011
  type: multipleChoice
  skills:
  - reason-from-convex-magnitudes
  prompt: |
    Suppose $b_n>0$ decreases to zero. Why does grouping
    $(b_1-b_2)+(b_3-b_4)+\cdots$ preserve the alternating-series sum?
  choices:
  - id: a
    text: The grouped partial sums are the even partial sums of the original series.
  - id: b
    text: Every grouped term equals zero.
  - id: c
    text: The original series is absolutely convergent.
  - id: d
    text: Grouping is an arbitrary rearrangement.
  answer:
    choiceId: a
  explanation: The Nth grouped sum equals the original partial sum through index $2N$, and that subsequence
    approaches the same limit.
- id: q012
  type: multipleChoice
  skills:
  - evaluate-remainder-thresholds-with-logarithms
  prompt: |
    For $\sum_{n=2}^{\infty}(-1)^n/[n\ln n]$, which condition exactly
    guarantees $|R_N|<10^{-4}$ by the alternating estimate?
  choices:
  - id: a
    text: |-
      $(N+1)\ln(N+1)>10^4$
  - id: b
    text: |-
      $N\ln N\ge10^4$
  - id: c
    text: |-
      $(N+1)\ln N<10^4$
  - id: d
    text: $N>10^4$ is necessary and sufficient
  answer:
    choiceId: a
  explanation: |-
    The bound uses the first omitted magnitude $1/[(N+1)\ln(N+1)]$ and the requested inequality is strict.
- id: q013
  type: multipleChoice
  skills:
  - analyze-perturbed-alternating-magnitudes
  prompt: |
    Classify
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\left(\frac1n+\frac1{n^2}\right).$$
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Telescoping
  answer:
    choiceId: a
  explanation: It is the sum of a conditional alternating harmonic series and an absolutely convergent
    signed p-series; absolute values remain at least harmonic-order.
- id: q014
  type: multipleChoice
  skills:
  - test-monotonicity-hypotheses
  prompt: |
    A signed series has terms $a_n=(-1)^nb_n$ with $b_n\to0$, but $b_n$
    is not eventually decreasing. Which conclusion is logically valid?
  choices:
  - id: a
    text: The alternating-series test is inconclusive; another argument may still prove convergence.
  - id: b
    text: The series must diverge.
  - id: c
    text: The series must converge absolutely.
  - id: d
    text: The term test proves convergence.
  answer:
    choiceId: a
  explanation: Failure of a sufficient theorem's monotonicity hypothesis removes that theorem, not the
    possibility of convergence by Dirichlet, grouping, or another method.
- id: q015
  type: multipleChoice
  skills:
  - compare-error-bounds-after-pairing
  prompt: |
    Why can pairing consecutive terms accelerate numerical approximation of
    the alternating harmonic series?
  choices:
  - id: a
    text: The paired terms are $1/[(2k-1)(2k)]$, of order $1/k^2$.
  - id: b
    text: Pairing changes its sum to zero.
  - id: c
    text: The original terms become geometric.
  - id: d
    text: Pairing makes the series finite.
  answer:
    choiceId: a
  explanation: Cancellation within each pair converts harmonic-order magnitudes to quadratic-order positive
    terms while preserving even partial sums.
