lesson:
  introduction: This lesson builds an acid-base model from definitions through equations, calculations, and verification.
  sections:
  - id: sec-1
    title: Autoionization
    required: true
    content: 'Water can transfer a proton between molecules: 2H2O ⇌ H3O+ + OH−. At equilibrium Kw=[H3O+][OH−].'
    media:
    - type: image
      src: /media/chemistry/chemistry-ph-water-model.svg
      alt: Original diagram supporting autoionization.
      caption: 
    check:
      id: chk-1
      type: multipleChoice
      prompt: In pure water at 25 °C, which relation is true?
      choices:
      - id: a
        text: '[H3O+]=[OH−]=1.0×10−7 M'
        media: []
        issueSignals: []
      - id: b
        text: '[H3O+]=1 M'
        media: []
        issueSignals:
        - id: water-autoionization-error
          domains:
          - chemistry
      - id: c
        text: '[OH−]=0'
        media: []
        issueSignals:
        - id: water-autoionization-error
          domains:
          - chemistry
      - id: d
        text: '[H3O+][OH−]=1'
        media: []
        issueSignals:
        - id: water-autoionization-error
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Choice A ([H3O+]=[OH−]=1.0×10−7 M).


        Why it works: For the Autoionization check, identify the governing acid-base relation in the prompt, apply it to the stated species or values, and verify charge, units, or model scope.


        Why the other choices fail: Choice B ([H3O+]=1 M) uses the wrong model or operation; choice C ([OH−]=0) ignores a stated condition; choice D ([H3O+][OH−]=1) substitutes an irrelevant shortcut.
