workedExamples:
- id: we-shm-circular-motion
  title: Deriving and applying Comparing SHM and Circular Motion
  problem: Use the labeled model to derive and calculate the maximum speed from $v_{max}=A\omega$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Draw a reference circle of radius $A$ and place a particle at angle $\theta$.
    prompt: 'Identify the radius.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Radius corresponds to amplitude $A$.'
    explanation: >-
      The radius represents the amplitude $A$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about the angular velocity.
    prompt: 'What is assumed about $\omega$?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Angular velocity is constant.'
    explanation: >-
      Uniform circular motion requires $\omega$ to be constant.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable for the projection.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Position $x(t)$'
    explanation: >-
      We are looking for the $x$-position as a function of time.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the trigonometric relation for the $x$-coordinate.
    prompt: 'Write the projection equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'x(t) = A\cos(\omega t)'
    explanation: >-
      From geometry, $x = A\cos(\theta)$. Since $\theta = \omega t$, we have $x(t) = A\cos(\omega t)$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the velocity by applying the derivative.
    prompt: 'Isolate the velocity $v_x$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'v_x = -A\omega\sin(\omega t)'
    explanation: >-
      Take the derivative: $v_x = -A\omega\sin(\omega t)$.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Calculate maximum velocity for $A = 2.0$ m, $\omega = 3.14$ rad/s.
    prompt: 'Calculate maximum velocity.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: >-
      $v_{\text{max}} = A\omega = 2.0 \times 3.14 = 6.28$ m/s.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of $A\omega$.
    prompt: 'What are the units of $v_{	ext{max}}$?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'm/s'
    explanation: >-
      Meters times radians per second is m/s.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated maximum velocity.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: >-
      The maximum velocity is $6.28$ m/s.
