workedExamples:
- id: we-shm-circular-motion
  title: Deriving and applying Comparing SHM and Circular Motion
  problem: Use the labeled model to derive and calculate the maximum speed from $v_{max}=A\omega$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Draw a reference circle of radius $A$ and place a particle at angle $\theta$.
    prompt: Identify the radius.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Radius corresponds to amplitude $A$.
    explanation: 'Solution: The radius represents the amplitude $A$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the assumption about the angular velocity.
    prompt: What is assumed about $\omega$?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Angular velocity is constant.
    explanation: 'Solution: Uniform circular motion requires $\omega$ to be constant.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the target variable for the projection.
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Position $x(t)$
    explanation: 'Solution: We are looking for the $x$-position as a function of time.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the trigonometric relation for the $x$-coordinate.
    prompt: Write the projection equation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - x(t) = A\cos(\omega t)
    explanation: 'Solution: From geometry, $x = A\cos(\theta)$. Since $\theta = \omega t$, we have $x(t) = A\cos(\omega t)$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the velocity by applying the derivative.
    prompt: Isolate the velocity $v_x$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v_x = -A\omega\sin(\omega t)
    explanation: 'Solution: Take the derivative: $v_x = -A\omega\sin(\omega t)$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Calculate maximum velocity for $A = 2.0$ m, $\omega = 3.14$ rad/s.
    prompt: Calculate maximum velocity.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: 'Solution: $v_{\text{max}} = A\omega = 2.0 \times 3.14 = 6.28$ m/s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of $A\omega$.
    prompt: "What are the units of $v_{\text{max}}$?"
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - m/s
    explanation: 'Solution: Meters times radians per second is m/s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated maximum velocity.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: 'Solution: The maximum velocity is $6.28$ m/s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
- id: shm-phase-we002
  title: Position and Speed From a Reference Circle
  problem: An SHM particle has amplitude $0.40\ \text{m}$ and angular frequency $5.0\ \text{rad/s}$. At phase $\theta=\pi/2$, find its displacement and speed.
  steps:
  - id: shm-phase-we002-step-1
    title: Find the displacement
    instruction: 'Complete this step.'
    type: numericResponse
    prompt: What is $x=A\cos\theta$ in meters?
    answer: {value: 0, tolerance: 0.001}
    explanation: 'Solution: $x=0.40\cos(\pi/2)=0$. Why it works: the horizontal projection of the reference particle is zero at a quarter turn.'
  - id: shm-phase-we002-step-2
    title: Find the speed
    instruction: 'Complete this step.'
    type: numericResponse
    prompt: What is the speed in $\text{m/s}$ at this phase?
    answer: {value: 2, tolerance: 0.01}
    explanation: 'Solution: $|v|=A\omega|\sin\theta|=(0.40)(5.0)=2.0\ \text{m/s}$. Why it works: speed is maximum at equilibrium.'
