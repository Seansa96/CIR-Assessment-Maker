  - id: step4
    title: Write the governing relation
    instruction: Derive the maximum speed for the Comparing SHM and Circular Motion model. Project $\vec
      r=A(\cos\omega t,\sin\omega t)$ onto one axis; two differentiations give $x''=-\omega^2x$.
    prompt: 'Complete derivation step 4: Write the governing relation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: A correct derivation step using $v_{max}=A\omega.
    explanation: Project $\vec r=A(\cos\omega t,\sin\omega t)$ onto one axis; two differentiations give
      $x''=-\omega^2x$. This is step 4 of the derivation.
