questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{4n^2+1}{2n^2+5}
      $$
    choices:
      - id: a
        text: nth-term test; the terms do not approach 0, so it diverges.
      - id: b
        text: Ratio test; the limit is less than 1.
      - id: c
        text: Alternating series test; the terms decrease.
      - id: d
        text: Root test; the root limit is 0.
    answer:
      choiceId: a
    explanation: |
      Always check whether terms go to $0$ when the term has an obvious nonzero limit. Here the terms approach $2$.
  - id: q002
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{3^n}{5^n}
      $$
    choices:
      - id: a
        text: Geometric series test; it converges because $|r|<1$.
      - id: b
        text: p-series test; it diverges.
      - id: c
        text: Integral test; it diverges.
      - id: d
        text: Alternating series test; it converges conditionally.
    answer:
      choiceId: a
    explanation: |
      The term is $\left(\frac35\right)^n$, a geometric pattern with ratio magnitude less than $1$.
  - id: q003
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac1{n^{4/3}}
      $$
    choices:
      - id: a
        text: p-series test; it converges because $p>1$.
      - id: b
        text: nth-term test; it diverges.
      - id: c
        text: Alternating series test; it converges conditionally.
      - id: d
        text: Ratio test; it diverges.
    answer:
      choiceId: a
    explanation: |
      This is exactly a p-series with $p=\frac43>1$.
  - id: q004
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{n+2}{n^2+1}
      $$
    choices:
      - id: a
        text: Limit comparison with $\frac1n$; it diverges.
      - id: b
        text: Comparison with $\frac1{n^2}$; it converges.
      - id: c
        text: Ratio test; it converges.
      - id: d
        text: Alternating series test; it converges.
    answer:
      choiceId: a
    explanation: |
      The dominant behavior is $\frac{n}{n^2}=\frac1n$, so compare with the harmonic series.
  - id: q005
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{n^2}{n^4+3}
      $$
    choices:
      - id: a
        text: Limit comparison with $\frac1{n^2}$; it converges.
      - id: b
        text: Limit comparison with $\frac1n$; it diverges.
      - id: c
        text: nth-term test; it diverges.
      - id: d
        text: Alternating series test; it converges conditionally.
    answer:
      choiceId: a
    explanation: |
      The leading behavior is $\frac{n^2}{n^4}=\frac1{n^2}$, a convergent p-series.
  - id: q006
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n+4}
      $$
    choices:
      - id: a
        text: Alternating series test; it converges conditionally.
      - id: b
        text: p-series test; it converges absolutely.
      - id: c
        text: nth-term test; it diverges.
      - id: d
        text: Geometric series test; it diverges.
    answer:
      choiceId: a
    explanation: |
      The positive magnitudes $\frac1{n+4}$ decrease to $0$, so the alternating series converges. Its absolute-value series behaves like harmonic, so not absolutely.
  - id: q007
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{n!}{4^n}
      $$
    choices:
      - id: a
        text: Ratio test; it diverges.
      - id: b
        text: p-series test; it converges.
      - id: c
        text: Alternating series test; it converges conditionally.
      - id: d
        text: Telescoping; it converges.
    answer:
      choiceId: a
    explanation: |
      Factorials are ratio-test signals. The ratio is $\frac{n+1}{4}$, eventually greater than $1$.
  - id: q008
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\left(\frac{2n+1}{3n+4}\right)^n
      $$
    choices:
      - id: a
        text: Root test; it converges.
      - id: b
        text: p-series test; it diverges.
      - id: c
        text: nth-term test; it diverges.
      - id: d
        text: Telescoping; it converges.
    answer:
      choiceId: a
    explanation: |
      The $n$th root removes the exponent and gives $\frac{2n+1}{3n+4}\to\frac23<1$.
  - id: q009
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+3}\right)
      $$
    choices:
      - id: a
        text: Telescoping; it converges.
      - id: b
        text: nth-term test; it diverges.
      - id: c
        text: Ratio test; it diverges.
      - id: d
        text: Alternating series test; it converges conditionally.
    answer:
      choiceId: a
    explanation: |
      Terms cancel after writing several partial sums. Only a finite beginning block and a vanishing tail remain.
  - id: q010
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=2}^{\infty}\frac1{n(\ln n)^3}
      $$
    choices:
      - id: a
        text: Integral test; it converges.
      - id: b
        text: nth-term test; it diverges.
      - id: c
        text: Geometric series test; it converges.
      - id: d
        text: Alternating series test; it converges conditionally.
    answer:
      choiceId: a
    explanation: |
      The logarithmic integral pattern $\sum \frac1{n(\ln n)^p}$ converges when $p>1$.
  - id: q011
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{\sin^2 n}{n^2}
      $$
    choices:
      - id: a
        text: Direct comparison with $\frac1{n^2}$; it converges.
      - id: b
        text: nth-term test; it diverges.
      - id: c
        text: Limit comparison with $\frac1n$; it diverges.
      - id: d
        text: Alternating series test; it converges conditionally.
    answer:
      choiceId: a
    explanation: |
      Since $0\le \sin^2 n\le 1$, the terms are bounded above by $\frac1{n^2}$.
  - id: q012
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{1}{\sqrt n+1}
      $$
    choices:
      - id: a
        text: Comparison with $\frac1{\sqrt n}$; it diverges.
      - id: b
        text: Comparison with $\frac1{n^2}$; it converges.
      - id: c
        text: Ratio test; it converges.
      - id: d
        text: Telescoping; it converges.
    answer:
      choiceId: a
    explanation: |
      The terms behave like $\frac1{\sqrt n}$, a divergent p-series with $p=\frac12$.
  - id: q013
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{(-1)^n n}{n^2+1}
      $$
    choices:
      - id: a
        text: Alternating series test; it converges conditionally.
      - id: b
        text: Direct comparison; it converges absolutely.
      - id: c
        text: nth-term test; it diverges.
      - id: d
        text: Root test; it diverges.
    answer:
      choiceId: a
    explanation: |
      The magnitudes behave like $\frac1n$, decrease eventually, and approach $0$. The absolute-value series diverges like harmonic, so convergence is conditional.
  - id: q014
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{7^n}{n^2 8^n}
      $$
    choices:
      - id: a
        text: Ratio test or geometric comparison; it converges.
      - id: b
        text: p-series test; it diverges.
      - id: c
        text: nth-term test; it diverges.
      - id: d
        text: Alternating series test; it converges conditionally.
    answer:
      choiceId: a
    explanation: |
      The geometric factor $\left(\frac78\right)^n$ forces convergence; the extra $n^2$ only helps.
  - id: q015
    type: multipleChoice
    prompt: |
      Which test or tool is the best first move?

      $$
      \sum_{n=1}^{\infty}\frac{1-\cos(1/n)}{1}
      $$
    choices:
      - id: a
        text: Use the small-angle approximation or limit comparison with $\frac1{n^2}$; it converges.
      - id: b
        text: Compare with $\frac1n$; it diverges.
      - id: c
        text: nth-term test; it diverges.
      - id: d
        text: Alternating series test; it converges conditionally.
    answer:
      choiceId: a
    explanation: |
      Since $1-\cos x\sim \frac{x^2}{2}$ near $0$, the terms behave like $\frac1{2n^2}$.
