questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Evaluate the integral using the substitution \(u=6x\).

      $$
      \int \cos(6x)\,dx
      $$

    choices:
      - id: a
        text: "\\(\\frac{1}{6}\\sin(6x)+C\\)"
      - id: b
        text: "\\(6\\sin(6x)+C\\)"
      - id: c
        text: "\\(-\\frac{1}{6}\\sin(6x)+C\\)"
      - id: d
        text: "\\(\\sin(x)+C\\)"

    answer:
      choiceId: a

    explanation: |
      Let \(u=6x\), so \(du=6dx\) and \(dx=\frac{1}{6}du\).

      $$
      \int \cos(6x)\,dx=\frac{1}{6}\int \cos(u)\,du
      =\frac{1}{6}\sin(u)+C
      $$

      Substitute back:

      $$
      \frac{1}{6}\sin(6x)+C
      $$

      Related topic: U-Substitution with Linear Inner Functions

  - id: q002
    type: multipleChoice
    prompt: |
      Evaluate the integral using the substitution \(u=x^3+6\).

      $$
      \int x^2\sqrt{x^3+6}\,dx
      $$

    choices:
      - id: a
        text: "\\(\\frac{2}{9}(x^3+6)^{3/2}+C\\)"
      - id: b
        text: "\\(\\frac{2}{3}(x^3+6)^{3/2}+C\\)"
      - id: c
        text: "\\(3(x^3+6)^{3/2}+C\\)"
      - id: d
        text: "\\(\\frac{1}{3}(x^3+6)^{1/2}+C\\)"

    answer:
      choiceId: a

    explanation: |
      Let \(u=x^3+6\), so \(du=3x^2dx\).

      Therefore:

      $$
      x^2dx=\frac{1}{3}du
      $$

      Then:

      $$
      \int x^2\sqrt{x^3+6}\,dx
      =
      \frac{1}{3}\int u^{1/2}\,du
      =
      \frac{1}{3}\cdot \frac{2}{3}u^{3/2}+C
      $$

      So:

      $$
      \frac{2}{9}(x^3+6)^{3/2}+C
      $$

      Related topic: U-Substitution with Power Functions

  - id: q003
    type: numericResponse
    prompt: |
      Evaluate the coefficient in front of the final antiderivative.

      $$
      \int \sin^3(\theta)\cos(\theta)\,d\theta
      $$

      The answer has the form:

      $$
      k\sin^4(\theta)+C
      $$

      What is \(k\)?

    answer:
      value: 0.25
      tolerance: 0.0001

    explanation: |
      Let \(u=\sin(\theta)\), so \(du=\cos(\theta)d\theta\).

      $$
      \int \sin^3(\theta)\cos(\theta)\,d\theta
      =
      \int u^3\,du
      =
      \frac{u^4}{4}+C
      $$

      Therefore:

      $$
      \frac{1}{4}\sin^4(\theta)+C
      $$

      So \(k=\frac{1}{4}=0.25\).

      Related topic: Trigonometric U-Substitution

  - id: q004
    type: multipleChoice
    prompt: |
      Evaluate the indefinite integral.

      $$
      \int \sin(t)\sqrt{1+\cos(t)}\,dt
      $$

    choices:
      - id: a
        text: "\\(-\\frac{2}{3}(1+\\cos(t))^{3/2}+C\\)"
      - id: b
        text: "\\(\\frac{2}{3}(1+\\cos(t))^{3/2}+C\\)"
      - id: c
        text: "\\(-2(1+\\cos(t))^{1/2}+C\\)"
      - id: d
        text: "\\(\\frac{1}{2}(1+\\cos(t))^{3/2}+C\\)"

    answer:
      choiceId: a

    explanation: |
      Let:

      $$
      u=1+\cos(t)
      $$

      Then:

      $$
      du=-\sin(t)\,dt
      $$

      So:

      $$
      \int \sin(t)\sqrt{1+\cos(t)}\,dt
      =
      -\int u^{1/2}\,du
      =
      -\frac{2}{3}u^{3/2}+C
      $$

      Substitute back:

      $$
      -\frac{2}{3}(1+\cos(t))^{3/2}+C
      $$

      Related topic: U-Substitution with Trigonometric Derivatives

  - id: q005
    type: multipleChoice
    prompt: |
      Evaluate the indefinite integral.

      $$
      \int \frac{e^u}{(4-e^u)^2}\,du
      $$

    choices:
      - id: a
        text: "\\(\\frac{1}{4-e^u}+C\\)"
      - id: b
        text: "\\(-\\frac{1}{4-e^u}+C\\)"
      - id: c
        text: "\\(\\ln|4-e^u|+C\\)"
      - id: d
        text: "\\((4-e^u)^{-2}+C\\)"

    answer:
      choiceId: a

    explanation: |
      Let:

      $$
      v=4-e^u
      $$

      Then:

      $$
      dv=-e^u\,du
      $$

      So:

      $$
      \int \frac{e^u}{(4-e^u)^2}\,du
      =
      -\int v^{-2}\,dv
      =
      v^{-1}+C
      $$

      Therefore:

      $$
      \frac{1}{4-e^u}+C
      $$

      Related topic: U-Substitution with Exponential Functions

  - id: q006
    type: numericResponse
    prompt: |
      Evaluate the coefficient in front of the final antiderivative.

      $$
      \int e^x\sqrt{44+e^x}\,dx
      $$

      The answer has the form:

      $$
      k(44+e^x)^{3/2}+C
      $$

      What is \(k\)?

    answer:
      value: 0.6667
      tolerance: 0.001

    explanation: |
      Let:

      $$
      u=44+e^x
      $$

      Then:

      $$
      du=e^x\,dx
      $$

      So:

      $$
      \int e^x\sqrt{44+e^x}\,dx
      =
      \int u^{1/2}\,du
      =
      \frac{2}{3}u^{3/2}+C
      $$

      Therefore \(k=\frac{2}{3}\approx 0.6667\).

      Related topic: U-Substitution with Exponential Inner Functions

  - id: q007
    type: numericResponse
    prompt: |
      Evaluate the definite integral.

      $$
      \int_0^1 3\cos\left(\frac{\pi t}{2}\right)\,dt
      $$

      Give a decimal approximation.

    answer:
      value: 1.9099
      tolerance: 0.001

    explanation: |
      Let:

      $$
      u=\frac{\pi t}{2}
      $$

      Then:

      $$
      du=\frac{\pi}{2}dt
      $$

      The antiderivative is:

      $$
      \frac{6}{\pi}\sin\left(\frac{\pi t}{2}\right)
      $$

      Evaluate from \(0\) to \(1\):

      $$
      \frac{6}{\pi}\sin\left(\frac{\pi}{2}\right)-0
      =
      \frac{6}{\pi}
      \approx 1.9099
      $$

      Related topic: Definite Integrals with Linear U-Substitution

  - id: q008
    type: numericResponse
    prompt: |
      Evaluate the definite integral.

      $$
      \int_e^{e^9}\frac{dx}{x\sqrt{\ln(x)}}
      $$

    answer:
      value: 4
      tolerance: 0.0001

    explanation: |
      Let:

      $$
      u=\ln(x)
      $$

      Then:

      $$
      du=\frac{1}{x}dx
      $$

      Change the bounds:

      $$
      x=e \Rightarrow u=1
      $$

      $$
      x=e^9 \Rightarrow u=9
      $$

      Therefore:

      $$
      \int_1^9 u^{-1/2}\,du
      =
      2u^{1/2}\Big|_1^9
      =
      2(3)-2(1)=4
      $$

      Related topic: Definite Integrals with Logarithmic Substitution

  - id: q009
    type: numericResponse
    prompt: |
      If \(f\) is continuous and

      $$
      \int_0^4 f(x)\,dx=16
      $$

      evaluate:

      $$
      \int_0^2 f(2x)\,dx
      $$

    answer:
      value: 8
      tolerance: 0.0001

    explanation: |
      Let:

      $$
      u=2x
      $$

      Then:

      $$
      du=2dx
      $$

      so:

      $$
      dx=\frac{1}{2}du
      $$

      Change the bounds:

      $$
      x=0 \Rightarrow u=0
      $$

      $$
      x=2 \Rightarrow u=4
      $$

      Therefore:

      $$
      \int_0^2 f(2x)\,dx
      =
      \frac{1}{2}\int_0^4 f(u)\,du
      =
      \frac{1}{2}(16)=8
      $$

      Related topic: Change of Variables in Definite Integrals
