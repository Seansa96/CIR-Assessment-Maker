lesson:
  introduction: Learn to solve Power of a Point problems by recognizing power of a point, secants, tangents, circle products and justifying each theorem or transformation.
  sections:
  - id: aops-power-of-a-point-motivation
    title: What the topic helps you notice
    required: true
    content: Power of a Point is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are power of a point, secants, tangents, circle products.
    check:
      id: aops-power-of-a-point-motivation-check
      type: multipleChoice
      prompt: In Power of a Point, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-power-of-a-point-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-power-of-a-point-definitions-check
      type: multipleChoice
      prompt: In Power of a Point, what should be checked before applying a method?
      choices:
