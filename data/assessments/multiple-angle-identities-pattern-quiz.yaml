schemaVersion: 1
id: multiple-angle-identities-pattern-quiz
title: Multiple Angle Identities Pattern Quiz
assessmentType: quiz
categoryId: trigonometry
subcategoryIds:
- trig-multiple-angle
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  prompt: 'Which identity is correct for $\sin(2x)$?

    '
  choices:
  - id: a
    text: $2\sin x\cos x$
  - id: b
    text: $\sin^2 x-\cos^2 x$
  - id: c
    text: $2\cos^2 x-1$
  - id: d
    text: $1-2\sin^2 x$
  answer:
    choiceId: a
  explanation: 'Related topic: sine double-angle identity. Derive it from $\sin(x+x)$.'
- id: q002
  type: multipleChoice
  prompt: 'Which expression is a valid form of $\cos(2x)$?

    '
  choices:
  - id: a
    text: $2\cos^2 x-1$
  - id: b
    text: $2\sin x\cos x$
  - id: c
    text: $3\sin x-4\sin^3 x$
  - id: d
    text: $4\cos^3 x-3\cos x$
  answer:
    choiceId: a
  explanation: 'Related topic: cosine double-angle forms. Other valid forms include
    $\cos^2 x-\sin^2 x$ and $1-2\sin^2 x$.'
- id: q003
  type: multipleChoice
  prompt: 'If you see $1-2\sin^2 x$, what should you recognize?

    '
  choices:
  - id: a
    text: $\cos(2x)$
  - id: b
    text: $\sin(2x)$
  - id: c
    text: $\sin(3x)$
  - id: d
    text: $\tan(2x)$
  answer:
    choiceId: a
  explanation: 'Related topic: choosing cosine double-angle forms. Match sine squared
    with $1-2\sin^2 x$.'
- id: q004
  type: multipleChoice
  prompt: 'Which identity is correct for $\sin(3x)$?

    '
  choices:
  - id: a
    text: $3\sin x-4\sin^3 x$
  - id: b
    text: $4\sin^3 x-3\sin x$
  - id: c
    text: $4\cos^3 x-3\cos x$
  - id: d
    text: $2\sin x\cos x$
  answer:
    choiceId: a
  explanation: 'Related topic: sine triple-angle identity. It is especially useful
    when a cubic sine pattern appears.'
- id: q005
  type: multipleChoice
  prompt: 'Which identity is correct for $\cos(3x)$?

    '
  choices:
  - id: a
    text: $4\cos^3 x-3\cos x$
  - id: b
    text: $3\cos x-4\cos^3 x$
  - id: c
    text: $3\sin x-4\sin^3 x$
  - id: d
    text: $\cos^2 x-\sin^2 x$
  answer:
    choiceId: a
  explanation: 'Related topic: cosine triple-angle identity. The cosine version starts
    with the cubic term.'
- id: q006
  type: multipleChoice
  prompt: 'What is the most efficient rewrite for $\sin x\cos x$?

    '
  choices:
  - id: a
    text: $\frac{1}{2}\sin(2x)$
  - id: b
    text: $\cos(2x)$
  - id: c
    text: $\sin(3x)$
  - id: d
    text: $1-\cos(2x)$
  answer:
    choiceId: a
  explanation: 'Related topic: product-to-double-angle conversion. Start from $\sin(2x)=2\sin
    x\cos x$ and divide by 2.'
- id: q007
  type: multipleChoice
  prompt: 'Which expression is equivalent to $2\cos^2 x-1$?

    '
  choices:
  - id: a
    text: $\cos(2x)$
  - id: b
    text: $\sin(2x)$
  - id: c
    text: $\sin^2 x$
  - id: d
    text: $\tan(2x)$
  answer:
    choiceId: a
  explanation: 'Related topic: cosine double-angle identity. This form is best when
    the expression is already written with cosine squared.'
- id: q008
  type: multipleChoice
  prompt: What should you review if you want to understand where double-angle identities
    come from?
  choices:
  - id: a
    text: Angle sum identities
  - id: b
    text: Polynomial long division
  - id: c
    text: Completing the square
  - id: d
    text: Partial fractions
  answer:
    choiceId: a
  explanation: 'Related topic: angle sum formulas. Double-angle identities come from
    setting the two angles equal in sum identities, such as $\sin(x+x)$ and $\cos(x+x)$.'
