questions:
  - { id: q001, type: multipleChoice, prompt: 'For $x=t^2,y=t^3$, what is $dy/dx$ at $t=2$?', choices: [{ id: a, text: 3 }, { id: b, text: '3/2' }, { id: c, text: 6 }, { id: d, text: 12 }], answer: { choiceId: a }, explanation: 'Solution: $dy/dx=3t^2/(2t)=3t/2$, so at 2 it is 3. Why it works: Divide component derivatives. Common trap: Using dy/dt alone. Why the other choices fail: They omit division or use the wrong parameter substitution.', difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: 'Forms and simplifies the parametric slope ratio.' }
  - { id: q002, type: multipleChoice, prompt: 'Which condition is horizontal?', choices: [{ id: a, text: '$dy/dt=0,dx/dt\ne0$' }, { id: b, text: '$dx/dt=0,dy/dt\ne0$' }, { id: c, text: 'both zero' }, { id: d, text: 'both nonzero' }], answer: { choiceId: a }, explanation: 'Solution: Horizontal slope is zero, so the numerator is zero and denominator nonzero. Why it works: Slope is dy/dt over dx/dt. Common trap: Reversing vertical and horizontal. Why the other choices fail: They give vertical, indeterminate, or ordinary slope.', difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: 'Maps a slope property to quotient numerator/denominator conditions.' }
  - { id: q003, type: multipleChoice, prompt: 'For $x=t^3-3t,y=t^2$, which t-value gives a horizontal tangent?', choices: [{ id: a, text: 0 }, { id: b, text: 1 }, { id: c, text: -1 }, { id: d, text: 2 }], answer: { choiceId: a }, explanation: 'Solution: y-prime equals 2t, so t equals 0; x-prime is negative 3 there, so it is valid. Why it works: Check both component rates. Common trap: Listing roots of x-prime instead. Why the other choices fail: They do not make y-prime zero.', difficultyDimensions: [auxiliaryTechnique, domainCondition], difficultyEvidence: 'Solves the numerator condition and checks the denominator.' }
  - { id: q004, type: multipleChoice, prompt: 'For $x=t^3-3t,y=t^2$, which values give vertical tangents?', choices: [{ id: a, text: '$t=\pm1$' }, { id: b, text: '$t=0$' }, { id: c, text: '$t=\pm\sqrt3$' }, { id: d, text: none }], answer: { choiceId: a }, explanation: 'Solution: x-prime equals 3(t squared minus 1), giving plus or minus 1; y-prime is nonzero at both. Why it works: Vertical uses x-prime zero. Common trap: Forgetting to test y-prime. Why the other choices fail: They solve the wrong condition or do not satisfy it.', difficultyDimensions: [auxiliaryTechnique, domainCondition], difficultyEvidence: 'Solves the denominator condition and verifies a nonzero numerator.' }
  - { id: q005, type: multipleChoice, prompt: 'If both component derivatives vanish, the slope quotient is:', choices: [{ id: a, text: indeterminate }, { id: b, text: zero }, { id: c, text: vertical }, { id: d, text: one }], answer: { choiceId: a }, explanation: 'Solution: It is zero over zero, which is indeterminate. Why it works: More local analysis is required. Common trap: Calling it horizontal. Why the other choices fail: None follows from zero over zero alone.', difficultyDimensions: [domainCondition, errorDiagnosis], difficultyEvidence: 'Recognizes an indeterminate form and rejects an automatic classification.' }
  - { id: q006, type: multipleChoice, prompt: 'After finding $d(dy/dx)/dt$, what do you divide by to get $d^2y/dx^2$?', choices: [{ id: a, text: '$dx/dt$' }, { id: b, text: '$dy/dt$' }, { id: c, text: '$dy/dx$' }, { id: d, text: t }], answer: { choiceId: a }, explanation: 'Solution: Divide by dx/dt. Why it works: Convert slope change per t into slope change per x. Common trap: Stopping at a t-derivative. Why the other choices fail: They do not apply the chain rule conversion.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Converts a parameter derivative to an x derivative.' }
  - { id: q007, type: multipleChoice, prompt: 'If $d^2y/dx^2<0$, the curve is:', choices: [{ id: a, text: concave down }, { id: b, text: concave up }, { id: c, text: vertical }, { id: d, text: horizontal }], answer: { choiceId: a }, explanation: 'Solution: Negative second derivative means slopes decrease as x increases, so concave down. Why it works: Concavity follows the sign of the second derivative. Common trap: Confusing slope sign with concavity. Why the other choices fail: They use unrelated first-derivative conditions.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Maps derivative sign to geometric curvature.' }
  - { id: q008, type: multipleChoice, prompt: 'At t equals a, what two pieces are needed for a nonvertical tangent line?', choices: [{ id: a, text: 'point and slope' }, { id: b, text: 'arc length and area' }, { id: c, text: 'two parameter intervals' }, { id: d, text: 'only slope' }], answer: { choiceId: a }, explanation: 'Solution: Evaluate the point and slope, then use point-slope form. Why it works: A line is fixed by one point and slope. Common trap: Giving only dy/dx. Why the other choices fail: They do not determine the tangent line.', difficultyDimensions: [modelOrDerivation, proofJustification], difficultyEvidence: 'Identifies the geometric data required to define a line.' }
  - { id: q009, type: freeResponse, prompt: 'For $x=2t,y=t^2$, find $d^2y/dx^2$.', answer: { gradingMode: selfCheck, keyPoints: ['dy dx equals t', 'derivative with respect to t equals one', 'divide by two gives one half'] }, explanation: 'Solution: dy/dx equals 2t over 2 equals t; differentiate to get 1 and divide by dx/dt equals 2, yielding one half. Why it works: The second derivative requires the second chain-rule division. Common trap: Reporting 1.', difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: 'Forms slope, differentiates it, and converts the resulting rate.' }
  - { id: q010, type: multipleChoice, prompt: '![Tangent trace](/media/calculus/parametric-review-trace.svg) A curve has x-prime positive and y-prime negative. Its tangent slope is:', choices: [{ id: a, text: negative }, { id: b, text: positive }, { id: c, text: zero }, { id: d, text: undefined }], answer: { choiceId: a }, explanation: 'Solution: A negative vertical rate divided by positive horizontal rate is negative. Why it works: Signs of component rates determine slope sign. Common trap: Looking only at one component. Why the other choices fail: They require different sign or zero conditions.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Interprets component-rate signs as a tangent direction.' }
