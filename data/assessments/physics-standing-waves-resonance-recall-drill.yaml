items:
- {id: stand-r1, type: cloze, prompt: 'Fixed-string wavelengths are $\lambda_n={{2L/n}}$.', answer: '2L/n', explanation: 'Solution: Use $\lambda_n=2L/n$. Why it works: n half-wavelengths fit in a string fixed at both ends.'}
- {id: stand-r2, type: typed, prompt: 'What condition occurs at both ends of a fixed string?', answer: node, explanation: 'Solution: A node. Why it works: fixed ends cannot move.'}
- {id: stand-r3, type: cloze, prompt: 'Fixed-string frequencies are $f_n={{nv/(2L)}}$.', answer: 'nv/(2L)', explanation: 'Solution: Use $f_n=nv/(2L)$. Why it works: combine $v=f\lambda$ with allowed wavelengths.'}
- {id: stand-r4, type: typed, prompt: 'How many antinodes are in the third harmonic of a fixed string?', answer: 3, explanation: 'Solution: Three. Why it works: harmonic number equals number of loops.'}
- {id: stand-r5, type: cloze, prompt: 'A standing wave forms from two equal waves traveling in {{opposite directions}}.', answer: opposite directions, explanation: 'Solution: Identify opposite directions. Why it works: their superposition produces fixed interference locations.'}
- {id: stand-r6, type: typed, prompt: 'Does an ideal standing wave carry net energy along the string?', answer: no, explanation: 'Solution: No. Why it works: equal opposite traveling-wave energy flows cancel.'}
