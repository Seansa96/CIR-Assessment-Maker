workedExamples:
  - id: we-parallel-forces
    title: Distributing the Load
    problem: |
      When two springs are in parallel, how does the total force distribute between them? Let's find out.
    steps:
      - id: step-1
        title: Step 1 — Common Extension
        instruction: |
          Two springs with constants $k_1$ and $k_2$ are in parallel and stretched by a total displacement $x$.
        type: multipleChoice
        prompt: |
          What is the displacement of the first spring ($x_1$) compared to the total displacement ($x$)?
        choices:
          - id: a
            text: '$x_1 = x$'
          - id: b
            text: '$x_1 = x / 2$'
          - id: c
            text: '$x_1 = k_1 x$'
        answer:
          choiceId: a
        explanation: 'Parallel springs always share the exact same extension. Both stretch by $x$.'
      - id: step-2
        title: Step 2 — Individual Force
        instruction: |
          Knowing that the first spring stretches by $x$, we can find the force it carries.
        type: symbolicResponse
        prompt: |
          Using Hooke's Law, what is the force $F_1$ carried by the first spring?
        answer:
          gradingMode: auto
          expectedLatex: k_1*x
          equivalenceMode: expression
          tolerance: 0
        explanation: 'The force in any spring is its constant times its stretch: $F_1 = k_1 x$. The stiffer spring (larger $k$) will carry more of the total load!'
