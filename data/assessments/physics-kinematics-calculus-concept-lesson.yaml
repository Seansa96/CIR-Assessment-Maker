sections:
- id: position-velocity-acceleration
  title: Connecting Position, Velocity, and Acceleration
  content: 'In introductory physics, we often deal with constant acceleration where
    algebraic kinematic equations apply. However, in Calculus-based physics, we use
    derivatives and integrals to describe motion under *varying* acceleration.


    **1. Velocity as a Derivative**

    Velocity $\vec{v}(t)$ is the rate of change of position $\vec{x}(t)$ with respect
    to time:

    $$ \vec{v}(t) = \frac{d\vec{x}}{dt} $$


    **2. Acceleration as a Derivative**

    Acceleration $\vec{a}(t)$ is the rate of change of velocity with respect to time,
    or the second derivative of position:

    $$ \vec{a}(t) = \frac{d\vec{v}}{dt} = \frac{d^2\vec{x}}{dt^2} $$


    **3. Going Backwards: Integration**

    If we know acceleration, we can find the change in velocity by integrating with
    respect to time:

    $$ \Delta \vec{v} = \vec{v}(t) - \vec{v}(0) = \int_0^t \vec{a}(t) \, dt $$

    And position from velocity:

    $$ \Delta \vec{x} = \vec{x}(t) - \vec{x}(0) = \int_0^t \vec{v}(t) \, dt $$

    '
- id: visual-relationships
  title: Graphical Relationships
  content: 'Graphically, the derivative represents the **slope** of the tangent line,
    and the integral represents the **area under the curve**.


    * The slope of the position-time graph is velocity.

    * The slope of the velocity-time graph is acceleration.

    * The area under the acceleration-time graph is the change in velocity.

    * The area under the velocity-time graph is the change in position (displacement).


    ![Position, Velocity, and Acceleration vs Time](/media/physics/pva-calculus-graph.png)


    In the graph above, notice\rhow the position graph is a cubic function, making
    velocity a parabola (quadratic), and acceleration a straight line (linear). At
    the peaks and valleys of the position graph (where the slope is zero), the velocity
    graph crosses the x-axis ($v=0$).

    '
lesson:
  introduction: Kinematics and Calculus Concepts
  sections:
  - id: sec-q001
    title: If the position of a particle is given by $x(t) = 4t^3 - 2t + 5$, what
      is the expression for its acceleration?
    content: |
      If the position of a particle is given by $x(t) = 4t^3 - 2t + 5$, what is the expression for its acceleration?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: $12t^2 - 2$
      - id: b
        text: $24t$
      - id: c
        text: $4t^2 - 2$
      - id: d
        text: $12t$
      answer:
        choiceId: b
      explanation: |
        Take the first derivative to find velocity: $v(t) = \frac{dx}{dt} = 12t^2 - 2$.
        Take the second derivative to find acceleration: $a(t) = \frac{dv}{dt} = 24t$.
