sections:
- id: position-velocity-acceleration
  title: Connecting Position, Velocity, and Acceleration
  content: 'In introductory physics, we often deal with constant acceleration where
    algebraic kinematic equations apply. However, in Calculus-based physics, we use
    derivatives and integrals to describe motion under *varying* acceleration.


    **1. Velocity as a Derivative**

    Velocity $\vec{v}(t)$ is the rate of change of position $\vec{x}(t)$ with respect
    to time:

    $$ \vec{v}(t) = \frac{d\vec{x}}{dt} $$


    **2. Acceleration as a Derivative**

    Acceleration $\vec{a}(t)$ is the rate of change of velocity with respect to time,
    or the second derivative of position:

    $$ \vec{a}(t) = \frac{d\vec{v}}{dt} = \frac{d^2\vec{x}}{dt^2} $$


    **3. Going Backwards: Integration**

    If we know acceleration, we can find the change in velocity by integrating with
    respect to time:

    $$ \Delta \vec{v} = \vec{v}(t) - \vec{v}(0) = \int_0^t \vec{a}(t) \, dt $$

    And position from velocity:

    $$ \Delta \vec{x} = \vec{x}(t) - \vec{x}(0) = \int_0^t \vec{v}(t) \, dt $$

    '
- id: visual-relationships
  title: Graphical Relationships
  content: 'Graphically, the derivative represents the **slope** of the tangent line,
    and the integral represents the **area under the curve**.


    * The slope of the position-time graph is velocity.

    * The slope of the velocity-time graph is acceleration.

    * The area under the acceleration-time graph is the change in velocity.

    * The area under the velocity-time graph is the change in position (displacement).


    ![Position, Velocity, and Acceleration vs Time](/media/physics/pva-calculus-graph.png)


    In the graph above, notice\rhow the position graph is a cubic function, making
    velocity a parabola (quadratic), and acceleration a straight line (linear). At
    the peaks and valleys of the position graph (where the slope is zero), the velocity
    graph crosses the x-axis ($v=0$).

    '
lesson:
  introduction: Kinematics and Calculus Concepts
  sections:
  - id: sec-q001
    title: If the position of a particle is given by $x(t) = 4t^3 - 2t + 5$, what
      is the expression for its acceleration?
    content: |
      If the position of a particle is given by $x(t) = 4t^3 - 2t + 5$, what is the expression for its acceleration?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: $12t^2 - 2$
      - id: b
        text: $24t$
      - id: c
        text: $4t^2 - 2$
      - id: d
        text: $12t$
      answer:
        choiceId: b
      explanation: |
        Solution: Differentiate position once to get $v(t)=12t^2-2$, then
        differentiate again to get $a(t)=24t$.

        Why it works: Acceleration is the time derivative of velocity and the
        second time derivative of position.

        Why the other choices fail: Choice a is velocity; choices c and d use
        incorrect power-rule derivatives.
  - id: sec-position
    title: Position and displacement
    required: true
    content: 'Position is a signed coordinate. Displacement is $\Delta x=x_f-x_i$, not total path length.'
    media: []
    check:
      id: check-position
      type: multipleChoice
      prompt: 'An object moves from $x=3$ m to $x=-2$ m. What is its displacement?'
      choices: [{ id: a, text: '$-5$ m' }, { id: b, text: '$5$ m east' }, { id: c, text: '$1$ m' }]
      answer: { choiceId: a }
      explanation: 'Solution: $\Delta x=-2-3=-5$ m.\n\nWhy it works: Displacement is final position minus initial position.\n\nWhy the other choices fail: Choice b has the wrong direction; choice c adds positions instead of subtracting.'
  - id: sec-average-velocity
    title: Average velocity from a secant slope
    required: true
    content: 'Average velocity is $\Delta x/\Delta t$, the slope joining two points on a position-time graph.'
    media: []
    check:
      id: check-average-velocity
      type: multipleChoice
      prompt: 'A cart changes position by 12 m in 3 s. What is its average velocity?'
      choices: [{ id: a, text: '$4$ m/s' }, { id: b, text: '$36$ m/s' }, { id: c, text: '$0.25$ m/s' }]
      answer: { choiceId: a }
      explanation: 'Solution: $v_{avg}=12/3=4$ m/s.\n\nWhy it works: Average velocity is displacement divided by elapsed time.\n\nWhy the other choices fail: Choice b multiplies; choice c divides in the wrong order.'
  - id: sec-instantaneous-velocity
    title: Instantaneous velocity as a derivative
    required: true
    content: 'At one instant, velocity is $v(t)=dx/dt$, the tangent slope of position versus time.'
    media: []
    check:
      id: check-instantaneous-velocity
      type: multipleChoice
      prompt: 'If $x(t)=t^2+3t$, what is $v(2)$?'
      choices: [{ id: a, text: '$7$ m/s' }, { id: b, text: '$10$ m/s' }, { id: c, text: '$4$ m/s' }]
      answer: { choiceId: a }
      explanation: 'Solution: $v(t)=2t+3$, so $v(2)=7$ m/s.\n\nWhy it works: Velocity is the derivative of position.\n\nWhy the other choices fail: Choice b evaluates position; choice c omits the constant derivative.'
  - id: sec-acceleration
    title: Acceleration is change of velocity
    required: true
    content: 'Acceleration is $a=dv/dt$; its sign records how the signed velocity changes, not simply whether an object slows down.'
    media: []
    check:
      id: check-acceleration
      type: multipleChoice
      prompt: 'A westbound object has negative velocity and its speed decreases. What sign is its acceleration?'
      choices: [{ id: a, text: Positive }, { id: b, text: Negative }, { id: c, text: Zero }]
      answer: { choiceId: a }
      explanation: 'Solution: Its velocity becomes less negative, so acceleration is positive.\n\nWhy it works: Acceleration is the signed rate of change of velocity.\n\nWhy the other choices fail: Negative acceleration would make westward speed increase; zero would keep velocity constant.'
  - id: sec-area-velocity
    title: Velocity graph area gives displacement
    required: true
    content: 'The signed area under a velocity-time graph equals displacement: $\Delta x=\int v(t)dt$.'
    media: []
    check:
      id: check-area-velocity
      type: multipleChoice
      prompt: 'A velocity is 5 m/s for 4 s. What is the displacement?'
      choices: [{ id: a, text: '$20$ m' }, { id: b, text: '$1.25$ m' }, { id: c, text: '$9$ m' }]
      answer: { choiceId: a }
      explanation: 'Solution: The rectangular area is $(5\text{ m/s})(4\text{ s})=20$ m.\n\nWhy it works: Area under velocity versus time has units of displacement.\n\nWhy the other choices fail: Choice b divides instead of multiplying; choice c adds unrelated values.'
  - id: sec-area-acceleration
    title: Acceleration graph area gives velocity change
    required: true
    content: 'The signed area under an acceleration-time graph is $\Delta v=\int a(t)dt$; use an initial condition to find velocity.'
    media: []
    check:
      id: check-area-acceleration
      type: multipleChoice
      prompt: 'An object has $a=2$ m/s$^2$ for 3 s and starts at 1 m/s. What is final velocity?'
      choices: [{ id: a, text: '$7$ m/s' }, { id: b, text: '$6$ m/s' }, { id: c, text: '$1$ m/s' }]
      answer: { choiceId: a }
      explanation: 'Solution: $\Delta v=(2)(3)=6$ m/s, so $v_f=1+6=7$ m/s.\n\nWhy it works: Integrating acceleration gives velocity change, then the initial velocity is added.\n\nWhy the other choices fail: Choice b omits the initial velocity; choice c ignores acceleration.'
