schemaVersion: 1
id: css-grid-tictactoe-directed-project
title: Grid Tic-Tac-Toe Drill
assessmentType: guidedProject
categoryId: css
subcategoryIds:
- css-layout-grid
skills:
- Apply css-layout-grid
navigation:
  learningGoal: evaluate
  activityType: guidedProject
  tags:
  - css
  - css-layout-grid
modeDefault: practice
guidedProject:
  language: bash
  instructions: Create a 3x3 grid for a tic-tac-toe board on `.board`. Make each cell 100px by 100px.
  files:
  - path: style.css
    readOnly: false
    content: ".board {\n  display: grid;\n  grid-template-columns: repeat(3, 100px);\n  grid-template-rows: repeat(3, 100px);\n}\n"
  requiredChecks:
  - id: check-exists
    title: Check CSS File
    description: Check that the CSS file was updated.
    expectedOutputContains:
    - OK
    testCode: echo OK
