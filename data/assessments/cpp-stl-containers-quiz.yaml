modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which container is generally the best choice for storing a sequence of elements when you only need to add or remove elements from the end?
    choices:
      - id: a
        text: '`std::vector`'
      - id: b
        text: '`std::list`'
      - id: c
        text: '`std::deque`'
      - id: d
        text: '`std::array`'
    answer:
      choiceId: a
    explanation: |
      `std::vector` offers contiguous memory caching and fast `push_back`.

  - id: q002
    type: multipleChoice
    prompt: |
      How does a `std::deque` differ internally from a `std::vector`?
    choices:
      - id: a
        text: 'A `deque` allocates memory in multiple chunks rather than one single continuous block.'
      - id: b
        text: 'A `deque` does not support random access via the `[]` operator.'
      - id: c
        text: 'A `deque` stores elements as a linked list of pointers.'
      - id: d
        text: 'A `deque` has a fixed size.'
    answer:
      choiceId: a
    explanation: |
      This chunked allocation allows a `deque` to grow at the front and back without shifting all existing elements.

  - id: q003
    type: multipleChoice
    prompt: |
      Why is `insert()` on a `std::vector` slower than `insert()` on a `std::list` (assuming you already have an iterator to the insertion point)?
    choices:
      - id: a
        text: 'Because `std::vector` must shift all subsequent elements over to make room.'
      - id: b
        text: 'Because `std::list` is stored in cache.'
      - id: c
        text: 'Because `std::vector` must re-allocate the entire array on every insert.'
      - id: d
        text: 'Actually, `std::vector` is always faster than `std::list`.'
    answer:
      choiceId: a
    explanation: |
      In a linked list, inserting only requires updating a few pointers. In a vector, memory must be physically shifted.

  - id: q004
    type: code
    prompt: |
      Write a function named `sumVector` that takes a `const std::vector<int>&` and returns the sum of its elements as an `int`.
    language: cpp
    functionName: sumVector
    starterCode: |
      #include <vector>
      
      int sumVector(const std::vector<int>& vec) {
          int sum = 0;
          // Your code here
          return sum;
      }
    tests:
      - input: "{1, 2, 3}"
        expected: "6"
      - input: "{}"
        expected: "0"
      - input: "{-5, 5, 10}"
        expected: "10"
    answer: {}
    explanation: |
      You can use a range-based for loop: `for (int x : vec) { sum += x; }`.


