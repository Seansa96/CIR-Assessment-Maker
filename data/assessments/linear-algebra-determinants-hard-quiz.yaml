questions:
  - id: hq-det-of-product
    type: numericResponse
    prompt: |
      Let $A$ and $B$ be $3 \times 3$ matrices with $\det(A) = 4$ and $\det(B) = -3$.
      Compute $\det(A^2 B^T)$.
    answer:
      value: -48
      tolerance: 0
    explanation: |
      Using the product rule and transpose property:
      $\det(A^2 B^T) = \det(A^2) \cdot \det(B^T) = [\det(A)]^2 \cdot \det(B) = 4^2 \cdot (-3) = 16 \cdot (-3) = -48$.

  - id: hq-cofactor-expansion
    type: numericResponse
    prompt: |
      Compute $\det \begin{bmatrix} 3 & 0 & 0 \\ -1 & 4 & 0 \\ 2 & -5 & 2 \end{bmatrix}$ using the most efficient method.
    answer:
      value: 24
      tolerance: 0
    explanation: |
      This is a **lower-triangular** matrix. The determinant equals the product of the diagonal entries:
      $\det = 3 \times 4 \times 2 = 24$.
      There is no need for cofactor expansion — recognizing the triangular structure saves significant work.

  - id: hq-cramer-invertibility
    type: multipleChoice
    prompt: |
      Let $A = \begin{bmatrix} k & 2 \\ 6 & k \end{bmatrix}$. For what values of $k$ is the system $A\vec{x} = \vec{b}$ guaranteed to have a **unique solution** for any $\vec{b}$?
    choices:
      - id: c1
        text: '$k = \pm\sqrt{12}$'
      - id: c2
        text: '$k \neq \pm\sqrt{12}$'
      - id: c3
        text: 'All values of $k$.'
      - id: c4
        text: '$k = 0$'
    answer:
      choiceId: c2
    explanation: |
      The system has a unique solution iff $A$ is invertible iff $\det(A) \neq 0$.
      $\det(A) = k^2 - 12$. Setting $k^2 - 12 = 0$ gives $k = \pm\sqrt{12} = \pm 2\sqrt{3}$.
      So for $k \neq \pm\sqrt{12}$, the determinant is nonzero and the system has a unique solution.
