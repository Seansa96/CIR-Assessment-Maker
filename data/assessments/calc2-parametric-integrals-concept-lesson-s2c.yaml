topicId: parametric-integrals
modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [calculus-2, parametric-integrals] }
authoring: { visualRequirement: required, visualRationale: 'Area orientation, differential path length, and tracing bounds are spatial.', sourceId: src-20260719182540-a40fdcd443 }
lesson:
  introduction: 'A parameter can describe a moving boundary or path. The integral must match the path’s direction, speed, and one intended traversal.'
  sections:
    - { id: pi-01, title: '1. Translate dx into a parameter differential', required: true, content: 'Because $dx=(dx/dt)dt$, an area-under-curve model becomes $\int y(t)x prime(t)dt$. The parameter bounds must describe the intended segment.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed parametric arch with endpoints }], check: { id: pi-01-c, type: multipleChoice, prompt: 'For $x=t^2$, what replaces dx?', choices: [{ id: a, text: '$2t\,dt$' }, { id: b, text: '$t^2\,dt$' }, { id: c, text: '$dt$' }, { id: d, text: '$2\,dt$' }], answer: { choiceId: a }, explanation: 'Solution: Differentiate x: dx/dt equals 2t, so dx equals 2t dt. Why it works: The differential changes variables through the chain rule. Common trap: Reusing x itself as dx. Why the other choices fail: They omit or miscompute the derivative.' } }
    - { id: pi-02, title: '2. Keep signed area and geometric area distinct', required: true, content: 'The integral $\int y\,dx$ is signed and depends on orientation. Use the appropriate sign convention, partition sign changes, and avoid counting a closed boundary twice.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed trace emphasizing orientation }], check: { id: pi-02-c, type: multipleChoice, prompt: 'Why can reversing a parameter interval change the sign of $\int y\,dx$?', choices: [{ id: a, text: 'dx changes orientation' }, { id: b, text: 'the curve disappears' }, { id: c, text: 'arc length becomes negative' }, { id: d, text: 'the parameter is invalid' }], answer: { choiceId: a }, explanation: 'Solution: Reversing limits reverses directed accumulation. Why it works: dx carries the path orientation. Common trap: Treating signed line integrals as automatically geometric area. Why the other choices fail: The locus remains; arc length is nonnegative; the parameter remains valid.' } }
    - { id: pi-03, title: '3. Derive the parametric arc-length element', required: true, content: 'A tiny displacement has components $dx=x prime(t)dt$ and $dy=y prime(t)dt$, so $ds=\sqrt{(x prime)^2+(y prime)^2}\,dt$.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Curve with a small displacement and tangent }], check: { id: pi-03-c, type: multipleChoice, prompt: 'Which expression is parametric speed?', choices: [{ id: a, text: '$\sqrt{(dx/dt)^2+(dy/dt)^2}$' }, { id: b, text: '$dy/dx$' }, { id: c, text: '$x+y$' }, { id: d, text: '$dx/dt+dy/dt$' }], answer: { choiceId: a }, explanation: 'Solution: Speed is the magnitude of the velocity vector. Why it works: Pythagorean distance combines horizontal and vertical rates. Common trap: Adding signed component rates. Why the other choices fail: They are slope, position sum, or a non-geometric rate sum.' } }
    - { id: pi-04, title: '4. Simplify the full speed expression', required: true, content: 'Use identities and the parameter interval before integrating. For example, $\sqrt{t^2}=|t|$, which is t only on intervals where t is nonnegative.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Parametric curve labeled with parameter interval }], check: { id: pi-04-c, type: multipleChoice, prompt: 'On $-1\le t\le1$, $\sqrt{t^2}$ equals:', choices: [{ id: a, text: '$|t|$' }, { id: b, text: 't' }, { id: c, text: '$t^2$' }, { id: d, text: 'one' }], answer: { choiceId: a }, explanation: 'Solution: The square root is nonnegative, so it is absolute t. Why it works: Squaring removes sign, but the square root restores magnitude. Common trap: Replacing it by t across a negative interval. Why the other choices fail: They fail on negative t or change degree.' } }
    - { id: pi-05, title: '5. Choose bounds that trace exactly once', required: true, content: 'Use zeros, endpoints, crossings, and periodicity to select one arch, loop, or closed boundary. A longer interval can duplicate a path and double a line integral or length.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: One directed arch with marked endpoints }], check: { id: pi-05-c, type: freeResponse, prompt: 'What two things should you verify before calling a parameter interval one loop?', answer: { gradingMode: selfCheck, keyPoints: ['starts and ends at same intended point or loop bounds', 'no retracing', 'orientation or nearby points'] }, explanation: 'Solution: Verify the intended endpoint/crossing conditions and that no subpath is retraced; inspect direction if orientation matters. Why it works: A locus can be traversed multiple times. Common trap: Using every full trig period by habit.' } }
    - { id: pi-06, title: '6. Use closed-curve area with orientation', required: true, content: 'For a simple closed curve traced counterclockwise once, $A=-\int y\,dx$ is a convenient area formula. Reverse orientation changes the sign of the integral.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Closed directed curve area convention }], check: { id: pi-06-c, type: multipleChoice, prompt: 'What must be checked before using a closed-curve area formula?', choices: [{ id: a, text: 'one traversal and orientation' }, { id: b, text: 'only the radius' }, { id: c, text: 'only the slope' }, { id: d, text: 'only the y-intercept' }], answer: { choiceId: a }, explanation: 'Solution: Check that the interval traces the boundary once and identify its direction. Why it works: The formula is directed. Common trap: Doubling an already complete integral. Why the other choices fail: They do not validate the path.' } }
    - { id: pi-07, title: '7. Validate area and length models separately', required: true, content: 'Area uses a boundary or vertical-distance model; length uses speed. Check bounds, orientation, units, and whether the result should be nonnegative before evaluating.', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Path model and area model distinguished }], check: { id: pi-07-c, type: freeResponse, prompt: 'Name one model check unique to area and one unique to arc length.', answer: { gradingMode: selfCheck, keyPoints: ['area orientation or boundary order', 'arc length speed and nonnegative units'] }, explanation: 'Solution: Area needs an orientation/boundary-order check; arc length needs the speed magnitude and nonnegative length check. Why it works: They accumulate different geometric quantities. Common trap: Using slope as an arc-length integrand.' } }
