  - id: pi-05
    title: 5. Choose bounds that trace exactly once
    required: true
    content: Use zeros, endpoints, crossings, and periodicity to select one arch, loop, or closed boundary. A longer interval can duplicate a path and double a line integral or length.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: One directed arch with marked endpoints
      caption: 
    check:
      id: pi-05-c
      type: freeResponse
      prompt: What two things should you verify before calling a parameter interval one loop?
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: selfCheck
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints:
        - starts and ends at same intended point or loop bounds
        - no retracing
        - orientation or nearby points
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Verify the intended endpoint/crossing conditions and that no subpath is retraced; inspect direction if orientation matters. Why it works: A locus can be traversed multiple times. Common trap: Using every full trig period by habit.'
