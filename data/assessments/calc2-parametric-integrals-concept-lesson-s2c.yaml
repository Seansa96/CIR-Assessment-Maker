lesson:
  introduction: A parameter can describe a moving boundary or path. The integral must match the path’s direction, speed, and one intended traversal.
  sections:
  - id: pi-01
    title: 1. Translate dx into a parameter differential
    required: true
    content: Because $dx=(dx/dt)dt$, an area-under-curve model becomes $\int y(t)x prime(t)dt$. The parameter bounds must describe the intended segment.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Directed parametric arch with endpoints
      caption: 
    check:
      id: pi-01-c
      type: multipleChoice
      prompt: For $x=t^2$, what replaces dx?
      choices:
      - id: a
        text: $2t\,dt$
        media: []
        issueSignals: []
      - id: b
        text: $t^2\,dt$
        media: []
        issueSignals: []
      - id: c
        text: $dt$
        media: []
        issueSignals: []
      - id: d
        text: $2\,dt$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Differentiate x: dx/dt equals 2t, so dx equals 2t dt. Why it works: The differential changes variables through the chain rule. Common trap: Reusing x itself as dx. Why the other choices fail: They omit or miscompute the derivative.'
