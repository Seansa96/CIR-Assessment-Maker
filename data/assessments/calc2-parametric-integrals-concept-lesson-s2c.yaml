        - arc length speed and nonnegative units
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Area needs an orientation/boundary-order check; arc length needs the speed magnitude and nonnegative length check. Why it works: They accumulate different geometric quantities. Common trap: Using slope as an arc-length integrand.'
