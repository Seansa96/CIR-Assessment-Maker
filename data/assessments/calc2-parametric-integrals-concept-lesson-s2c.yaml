        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Check that the interval traces the boundary once and identify its direction. Why it works: The formula is directed. Common trap: Doubling an already complete integral. Why the other choices fail: They do not validate the path.'
