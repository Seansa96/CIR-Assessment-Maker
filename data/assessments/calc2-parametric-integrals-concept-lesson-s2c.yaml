  - id: pi-07
    title: 7. Validate area and length models separately
    required: true
    content: Area uses a boundary or vertical-distance model; length uses speed. Check bounds, orientation, units, and whether the result should be nonnegative before evaluating.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Path model and area model distinguished
      caption: 
