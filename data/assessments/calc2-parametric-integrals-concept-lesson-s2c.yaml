  - id: pi-03
    title: 3. Derive the parametric arc-length element
    required: true
    content: A tiny displacement has components $dx=x prime(t)dt$ and $dy=y prime(t)dt$, so $ds=\sqrt{(x prime)^2+(y prime)^2}\,dt$.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Curve with a small displacement and tangent
      caption: 
    check:
      id: pi-03-c
      type: multipleChoice
      prompt: Which expression is parametric speed?
      choices:
      - id: a
        text: $\sqrt{(dx/dt)^2+(dy/dt)^2}$
        media: []
        issueSignals: []
      - id: b
        text: $dy/dx$
        media: []
        issueSignals: []
      - id: c
        text: $x+y$
        media: []
        issueSignals: []
      - id: d
        text: $dx/dt+dy/dt$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Speed is the magnitude of the velocity vector. Why it works: Pythagorean distance combines horizontal and vertical rates. Common trap: Adding signed component rates. Why the other choices fail: They are slope, position sum, or a non-geometric rate sum.'
