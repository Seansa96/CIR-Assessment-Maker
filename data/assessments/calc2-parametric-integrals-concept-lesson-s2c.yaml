  - id: pi-04
    title: 4. Simplify the full speed expression
    required: true
    content: Use identities and the parameter interval before integrating. For example, $\sqrt{t^2}=|t|$, which is t only on intervals where t is nonnegative.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Parametric curve labeled with parameter interval
      caption: 
    check:
      id: pi-04-c
      type: multipleChoice
      prompt: 'On $-1\le t\le1$, $\sqrt{t^2}$ equals:'
      choices:
      - id: a
        text: $|t|$
        media: []
        issueSignals: []
      - id: b
        text: t
        media: []
        issueSignals: []
      - id: c
        text: $t^2$
        media: []
        issueSignals: []
      - id: d
        text: one
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The square root is nonnegative, so it is absolute t. Why it works: Squaring removes sign, but the square root restores magnitude. Common trap: Replacing it by t across a negative interval. Why the other choices fail: They fail on negative t or change degree.'
