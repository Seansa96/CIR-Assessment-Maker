  - id: pi-06
    title: 6. Use closed-curve area with orientation
    required: true
    content: For a simple closed curve traced counterclockwise once, $A=-\int y\,dx$ is a convenient area formula. Reverse orientation changes the sign of the integral.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Closed directed curve area convention
      caption: 
    check:
