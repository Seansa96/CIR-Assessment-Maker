  - id: pi-02
    title: 2. Keep signed area and geometric area distinct
    required: true
    content: The integral $\int y\,dx$ is signed and depends on orientation. Use the appropriate sign convention, partition sign changes, and avoid counting a closed boundary twice.
    media:
    - type: image
      src: /media/calculus/parametric-review-trace.svg
      alt: Directed trace emphasizing orientation
      caption: 
    check:
      id: pi-02-c
      type: multipleChoice
      prompt: Why can reversing a parameter interval change the sign of $\int y\,dx$?
      choices:
      - id: a
        text: dx changes orientation
        media: []
        issueSignals: []
      - id: b
        text: the curve disappears
        media: []
        issueSignals: []
      - id: c
        text: arc length becomes negative
        media: []
        issueSignals: []
      - id: d
        text: the parameter is invalid
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Reversing limits reverses directed accumulation. Why it works: dx carries the path orientation. Common trap: Treating signed line integrals as automatically geometric area. Why the other choices fail: The locus remains; arc length is nonnegative; the parameter remains valid.'
