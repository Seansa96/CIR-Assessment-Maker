workedExamples:
- id: aops-proportions-problem-1
  title: Combining two ratios with a shared term
  problem: |-
    Positive quantities satisfy $p:q=2:3$ and $q:r=4:5$. If $p+q+r=140$, find $p$, $q$, and $r$.
  steps:
  - id: aops-proportions-p1-s1
    title: Identify why direct concatenation fails
    instruction: |-
      The first ratio uses 3 parts for $q$, while the second uses 4 parts for the same quantity. Writing $2:3:5$ would silently treat those unequal part counts as equal.
    type: multipleChoice
    prompt: What must be matched before the ratios can be combined?
    choices:
    - id: a
      text: The part count representing $q$
    - id: b
      text: The values of $p$ and $r$
    - id: c
      text: The sum 2+5 only
    - id: d
      text: Nothing; $2:3:5$ is already valid.
    answer:
      choiceId: a
    explanation: The common quantity must have the same scaled part count in both ratios.
  - id: aops-proportions-p1-s2
    title: Scale both ratios to a common q
    instruction: |-
      The least common multiple of 3 and 4 is 12. Multiply $2:3$ by 4 and $4:5$ by 3:

      $$p:q=8:12,\qquad q:r=12:15.$$

      Therefore $p:q:r=8:12:15$.
    type: multipleChoice
    prompt: Which combined ratio is in simplest whole-number form?
    choices:
    - id: a
      text: '$2:3:5$'
    - id: b
      text: '$8:12:15$'
    - id: c
      text: '$6:12:20$'
    - id: d
      text: '$8:3:15$'
    answer:
      choiceId: b
    explanation: Both representations now assign 12 parts to $q$.
  - id: aops-proportions-p1-s3
    title: Convert the total into a value per part
    instruction: |-
      The combined ratio has $8+12+15=35$ parts. Since the total is 140, each part represents

      $$140/35=4.$$
    type: multipleChoice
    prompt: How much does one ratio part represent?
    choices:
    - id: a
      text: '2'
    - id: b
      text: '4'
    - id: c
      text: '5'
    - id: d
      text: '35'
    answer:
      choiceId: b
    explanation: The total amount is distributed across 35 equal ratio parts.
  - id: aops-proportions-p1-s4
    title: Recover each quantity
    instruction: |-
      Multiply each part count by 4:

      $$p=32,\qquad q=48,\qquad r=60.$$
    type: multipleChoice
    prompt: Which ordered triple is correct?
    choices:
    - id: a
      text: '$(32,48,60)$'
    - id: b
      text: '$(8,12,15)$'
    - id: c
      text: '$(40,40,60)$'
    - id: d
      text: '$(28,42,70)$'
    answer:
      choiceId: a
    explanation: Scale the combined ratio by the common value 4 per part.
  - id: aops-proportions-p1-s5
    title: Verify the original ratios and total
    instruction: |-
      The total is $32+48+60=140$. Also $32:48=2:3$ and $48:60=4:5$. Checking both original ratios prevents an incorrect combined ratio from passing unnoticed.
    type: multipleChoice
    prompt: Which checks are necessary?
    choices:
    - id: a
      text: Both original ratios and the stated total
    - id: b
      text: Only the total
    - id: c
      text: Only $p:q$
    - id: d
      text: Only that the numbers are positive
    answer:
      choiceId: a
    explanation: A valid answer must satisfy every original relationship.
- id: aops-proportions-problem-2
  title: Discount and tax use different baselines
  problem: |-
    A $120 item is discounted by 20%. A 10% sales tax is then applied to the discounted price. Find the final price and the overall percent change from the original.
  steps:
  - id: aops-proportions-p2-s1
    title: Translate the discount into a factor
    instruction: |-
      A 20% discount leaves 80% of the original price, so the discount factor is $0.80$.
    type: multipleChoice
    prompt: What price remains after the discount?
    choices:
    - id: a
      text: '$96'
    - id: b
      text: '$100'
    - id: c
      text: '$102'
    - id: d
      text: '$24'
    answer:
      choiceId: a
    explanation: $120(0.80)=96$.
  - id: aops-proportions-p2-s2
    title: Apply tax to the new baseline
    instruction: |-
      The tax is based on the discounted price of $96, not the original $120. A 10% increase multiplies by $1.10$.
    type: multipleChoice
    prompt: Which expression gives the final price?
    choices:
    - id: a
      text: '$120(0.80)(1.10)$'
    - id: b
      text: '$120-0.20+0.10$'
    - id: c
      text: '$120(0.90)$'
    - id: d
      text: '$120(1.10)-20$'
    answer:
      choiceId: a
    explanation: Successive percentage changes multiply their factors in order.
  - id: aops-proportions-p2-s3
    title: Compute the final price
    instruction: |-
      Calculate

      $$96(1.10)=105.60.$$

      Equivalently, the combined factor is $0.80(1.10)=0.88$ and $120(0.88)=105.60$.
    type: multipleChoice
    prompt: What is the final price?
    choices:
    - id: a
      text: '$100.80'
    - id: b
      text: '$105.60'
    - id: c
      text: '$108.00'
    - id: d
      text: '$110.00'
    answer:
      choiceId: b
    explanation: Ten percent of 96 is 9.60, which is added to 96.
  - id: aops-proportions-p2-s4
    title: Compare with the original baseline
    instruction: |-
      The final price is $105.60/$120$ $=0.88$ of the original. Therefore it is 12% lower than the original price.
    type: multipleChoice
    prompt: What is the overall percent change?
    choices:
    - id: a
      text: 10% decrease
    - id: b
      text: 12% decrease
    - id: c
      text: 12% increase
    - id: d
      text: 30% decrease
    answer:
      choiceId: b
    explanation: The combined factor 0.88 leaves 88%, a decrease of 12%.
  - id: aops-proportions-p2-s5
    title: Explain why percentages do not subtract
    instruction: |-
      Subtracting $20\%-10\%=10\%$ would assume both percentages use the same baseline. The discount uses $120, while the tax uses $96. Multiplicative factors preserve the changing baseline correctly.
    type: multipleChoice
    prompt: Why is the net change not a 10% decrease?
    choices:
    - id: a
      text: The tax is calculated from the discounted price, so the percentage bases differ.
    - id: b
      text: Tax percentages are always doubled.
    - id: c
      text: Discounts cannot be expressed as factors.
    - id: d
      text: The original price is irrelevant.
    answer:
      choiceId: a
    explanation: Percentages combine additively only when they reference the same base amount.
- id: aops-proportions-problem-3
  title: A changed classroom ratio
  problem: |-
    A class initially has girls to boys in the ratio $5:4$. After 6 girls leave, the ratio becomes $7:6$. Find the original numbers of girls and boys.
  steps:
  - id: aops-proportions-p3-s1
    title: Parameterize the original ratio
    instruction: |-
      Write the original counts as $5k$ girls and $4k$ boys for a positive scale factor $k$. Because the counts are whole numbers and the ratio is in simplest form, $k$ will be a positive integer.
    type: multipleChoice
    prompt: Which expressions represent the original counts?
    choices:
    - id: a
      text: '$5k$ girls and $4k$ boys'
    - id: b
      text: '$5+k$ girls and $4+k$ boys'
    - id: c
      text: '$5k$ girls and $k/4$ boys'
    - id: d
      text: 5 girls and 4 boys only
    answer:
      choiceId: a
    explanation: Scaling both ratio parts by the same factor preserves the ratio.
  - id: aops-proportions-p3-s2
    title: Translate the changed condition
    instruction: |-
      Six girls leave, so the new counts are $5k-6$ girls and $4k$ boys. The new ratio gives

      $$\frac{5k-6}{4k}=\frac76.$$
    type: multipleChoice
    prompt: Why does the boys count remain $4k$?
    choices:
    - id: a
      text: The problem states that only girls leave.
    - id: b
      text: Ratios never change boy counts.
    - id: c
      text: Six boys also leave implicitly.
    - id: d
      text: The boys count must equal 4.
    answer:
      choiceId: a
    explanation: Translate exactly the stated population change.
  - id: aops-proportions-p3-s3
    title: Solve the proportion
    instruction: |-
      Since $k>0$, the denominator is nonzero. Cross multiplication gives

      $$6(5k-6)=7(4k),$$

      so $30k-36=28k$ and $2k=36$. Thus $k=18$.
    type: multipleChoice
    prompt: What is the scale factor $k$?
    choices:
    - id: a
      text: '6'
    - id: b
      text: '12'
    - id: c
      text: '18'
    - id: d
      text: '36'
    answer:
      choiceId: c
    explanation: The difference between $30k$ and $28k$ balances the constant 36.
  - id: aops-proportions-p3-s4
    title: Recover the original class counts
    instruction: |-
      The original class had

      $$5(18)=90\text{ girls},\qquad4(18)=72\text{ boys}.$$

      The original class size was 162.
    type: multipleChoice
    prompt: What were the original counts?
    choices:
    - id: a
      text: 90 girls and 72 boys
    - id: b
      text: 72 girls and 90 boys
    - id: c
      text: 84 girls and 72 boys
    - id: d
      text: 35 girls and 28 boys
    answer:
      choiceId: a
    explanation: Multiply both original ratio parts by $k=18$.
  - id: aops-proportions-p3-s5
    title: Verify both ratios after the count change
    instruction: |-
      Originally, $90:72=5:4$. After 6 girls leave, $84:72=7:6$. Counts are positive integers, and only the stated group changed.
    type: multipleChoice
    prompt: Which new ratio verifies the result?
    choices:
    - id: a
      text: '$84:72=7:6$'
    - id: b
      text: '$90:66=7:6$'
    - id: c
      text: '$96:72=7:6$'
    - id: d
      text: '$84:66=5:4$'
    answer:
      choiceId: a
    explanation: Subtract 6 from the girls count only, then reduce the resulting ratio.
