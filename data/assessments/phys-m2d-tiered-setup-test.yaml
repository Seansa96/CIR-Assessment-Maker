schemaVersion: 1
id: phys-m2d-tiered-setup-test
title: Relative Motion - Tiered Setup Test
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-motion-2d
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - translation-only
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 20
questions:
- id: m2d-test-t1-1
  type: multipleChoice
  prompt: '[Tier 1: Direct] Set up the equation for a plane flying East at $V$ through
    a wind blowing North at $W$. Find the ground speed magnitude $v_g$.'
  choices:
  - id: a
    text: $v_g = \sqrt{V^2 + W^2}$
  - id: b
    text: $v_g = V + W$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Direct Pythagorean theorem setup for perpendicular
    vectors.'
- id: m2d-test-t2-1
  type: multipleChoice
  prompt: '[Tier 2: Disguised] Set up the equation for the heading angle $\theta$
    (relative to the bank) a boat must take to cross a river straight across. Boat
    speed is $V_b$, river speed is $V_r$.'
  choices:
  - id: a
    text: $\cos(\theta) = V_r / V_b$
  - id: b
    text: $\tan(\theta) = V_r / V_b$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The resultant must be perpendicular to the bank,
    meaning the upstream component of the boat''s velocity ($V_b \cos\theta$) must
    perfectly cancel the river velocity ($V_r$).'
- id: m2d-test-t3-1
  type: multipleChoice
  prompt: '[Tier 3: Exam-Style] Two cars approach an intersection. Car A moves North
    at $v_A$. Car B moves East at $v_B$. Set up the vector $\vec{v}_{A/B}$.'
  choices:
  - id: a
    text: $v_A \hat{j} - v_B \hat{i}$
  - id: b
    text: $v_A \hat{j} + v_B \hat{i}$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** $\vec{v}_{A/B} = \vec{v}_A - \vec{v}_B$. This
    is subtraction of vectors in a shared frame (ground).'
- id: m2d-test-t4-1
  type: multipleChoice
  prompt: '[Tier 4: Novel] A passenger on a train moving at $V$ throws a ball forward
    at $v$. The train is accelerating at $a$. Set up the acceleration of the ball
    relative to the ground while it is in the air.'
  choices:
  - id: a
    text: $\vec{a}_{ball/ground} = -g \hat{j}$
  - id: b
    text: $\vec{a}_{ball/ground} = a \hat{i} - g \hat{j}$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Once the ball leaves the hand, it is no longer
    interacting with the train. Its only acceleration is gravity. Frame translation
    applies to velocity, but acceleration requires an interacting force!'
