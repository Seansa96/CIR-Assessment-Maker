modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
  - id: m2d-tier-q01
    title: Level 1 - Initial Velocity Components
    type: symbolicResponse
    prompt: |
      A projectile is launched with an initial speed $v_0$ at an angle $\theta$ above the horizontal. Enter the expression for its initial vertical velocity $v_{yi}$.
    answer:
      expectedLatex: v_0*\sin(\theta)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      In a standard coordinate system where the launch angle is measured from the horizontal x-axis, the vertical component is the opposite side of the velocity triangle. So, $v_{yi} = v_0\sin\theta$.

  - id: m2d-tier-q02
    title: Level 1 - Horizontal Velocity Component
    type: symbolicResponse
    prompt: |
      For the same projectile (initial speed $v_0$, angle $\theta$), enter the expression for its initial horizontal velocity $v_{xi}$.
    answer:
      expectedLatex: v_0*\cos(\theta)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The horizontal component is the adjacent side of the velocity triangle. So, $v_{xi} = v_0\cos\theta$.

  - id: m2d-tier-q03
    title: Level 2 - Time to Peak
    type: symbolicResponse
    prompt: |
      Assuming the projectile is launched from ground level, enter the expression for the time $t_\text{peak}$ it takes to reach its maximum height. Use $g$ for the magnitude of gravitational acceleration (so $g$ is a positive number).
    answer:
      expectedLatex: v_0*\sin(\theta)/g
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      At the peak, $v_{yf} = 0$.
      Using $v_{yf} = v_{yi} - gt$, we get $0 = v_0\sin\theta - gt$.
      Solving for $t$: $t_\text{peak} = \frac{v_0\sin\theta}{g}$.

  - id: m2d-tier-q04
    title: Level 3 - Total Time of Flight (Level Ground)
    type: symbolicResponse
    prompt: |
      For a projectile launched from and landing on level ground, enter the expression for the total time of flight $t_\text{total}$. Use $v_0$, $\theta$, and $g$.
    answer:
      expectedLatex: 2*v_0*\sin(\theta)/g
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      For a symmetric trajectory on level ground, the total time is twice the time to the peak.
      $t_\text{total} = 2 \times t_\text{peak} = \frac{2v_0\sin\theta}{g}$.

  - id: m2d-tier-q05
    title: Level 3 - Range Formula
    type: symbolicResponse
    prompt: |
      Using the total time of flight ($t = \frac{2v_0\sin\theta}{g}$), enter the expression for the horizontal range $R$ of the projectile on level ground.
    answer:
      expectedLatex: 2*v_0^2*\sin(\theta)*\cos(\theta)/g
      aliases:
        - v_0^2*\sin(2*\theta)/g
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Horizontal range is $R = v_{xi} t$.
      $R = (v_0\cos\theta) \left( \frac{2v_0\sin\theta}{g} \right) = \frac{2v_0^2\sin\theta\cos\theta}{g}$.
      This is often simplified using the double angle identity to $R = \frac{v_0^2\sin(2\theta)}{g}$.

  - id: m2d-tier-q06
    title: Level 2 - Maximum Height Formula
    type: symbolicResponse
    prompt: |
      Enter the expression for the maximum vertical height $H$ reached by a projectile launched from the ground with speed $v_0$ at angle $\theta$. Use $g$ for gravity.
    answer:
      expectedLatex: (v_0*\sin(\theta))^2/(2*g)
      aliases:
        - v_0^2*\sin(\theta)^2/(2*g)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Use the time-independent equation: $v_{yf}^2 = v_{yi}^2 - 2g\Delta y$.
      At the peak, $v_{yf} = 0$.
      $0 = (v_0\sin\theta)^2 - 2gH$.
      Solving for $H$: $H = \frac{(v_0\sin\theta)^2}{2g}$.

  - id: m2d-tier-q07
    title: Level 1 - Horizontal Launch Initial Conditions
    type: symbolicResponse
    prompt: |
      A ball is thrown *horizontally* from a roof of height $H$ with speed $v_0$. What is the expression for its initial vertical velocity $v_{yi}$?
    answer:
      expectedLatex: 0
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      "Horizontal" means angle is 0. Since there is no vertical component, $v_{yi} = 0$.

  - id: m2d-tier-q08
    title: Level 2 - Time of Flight (Horizontal Launch)
    type: symbolicResponse
    prompt: |
      For the ball thrown horizontally from height $H$ (so $v_{yi} = 0$), enter the expression for the time $t$ it takes to hit the ground below. Use $g$ for gravity.
    answer:
      expectedLatex: \sqrt{2*H/g}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Use $\Delta y = v_{yi}t - \frac{1}{2}gt^2$.
      Displacement is $-H$, initial velocity is $0$.
      $-H = 0 - \frac{1}{2}gt^2$.
      $t^2 = \frac{2H}{g} \implies t = \sqrt{\frac{2H}{g}}$.

  - id: m2d-tier-q09
    title: Level 3 - Range of Horizontal Launch
    type: symbolicResponse
    prompt: |
      Using the time of flight $t = \sqrt{2H/g}$, enter the expression for the horizontal distance $x$ the ball travels before hitting the ground. The initial horizontal speed is $v_0$.
    answer:
      expectedLatex: v_0*\sqrt{2*H/g}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Horizontal distance is $x = v_{xi} t$.
      $x = v_0 \sqrt{\frac{2H}{g}}$.

  - id: m2d-tier-q10
    title: Level 1 - Trajectory Equation Setup
    type: symbolicResponse
    prompt: |
      In deriving the trajectory equation $y(x)$ for a projectile launched from the origin, you first solve the x-equation ($x = v_0\cos(\theta) t$) for time $t$. Enter this expression for $t$.
    answer:
      expectedLatex: x/(v_0*\cos(\theta))
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      $x = v_0\cos(\theta) t \implies t = \frac{x}{v_0\cos\theta}$.

  - id: m2d-tier-q11
    title: Level 3 - Trajectory Equation Substitution
    type: symbolicResponse
    prompt: |
      Substitute the expression for time $t = \frac{x}{v_0\cos\theta}$ into the y-equation $y = v_0\sin(\theta)t - \frac{1}{2}gt^2$ to find the expression for the trajectory $y(x)$. Do not simplify.
    answer:
      expectedLatex: v_0*\sin(\theta)*(x/(v_0*\cos(\theta))) - (1/2)*g*(x/(v_0*\cos(\theta)))^2
      aliases:
        - x*\tan(\theta) - g*x^2/(2*v_0^2*\cos(\theta)^2)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Substitute $t$:
      $y = v_0\sin\theta \left( \frac{x}{v_0\cos\theta} \right) - \frac{1}{2}g \left( \frac{x}{v_0\cos\theta} \right)^2$.
      This simplifies to the standard trajectory equation: $y = x\tan\theta - \frac{gx^2}{2v_0^2\cos^2\theta}$.

  - id: m2d-tier-q12
    title: Level 2 - Relative Velocity Setup
    type: symbolicResponse
    prompt: |
      Boat A is moving with velocity vector $\vec{v}_A$, and Boat B is moving with velocity vector $\vec{v}_B$. Write the expression for the velocity of Boat A relative to Boat B, $\vec{v}_{AB}$.
    answer:
      expectedLatex: \vec{v}_A - \vec{v}_B
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Relative velocity is always the velocity of the object minus the velocity of the observer frame. $\vec{v}_{AB} = \vec{v}_A - \vec{v}_B$.

  - id: m2d-tier-q13
    title: Level 2 - Perpendicular Crossing Time
    type: symbolicResponse
    prompt: |
      A river has width $D$. A boat aims straight across (perpendicular to the banks) with speed $v_b$ relative to the water. The river flows with speed $v_r$ relative to the shore. What is the expression for the time $t$ it takes to cross the river?
    answer:
      expectedLatex: D/v_b
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Because horizontal and vertical motions are independent, the downstream flow $v_r$ does not affect the time to cross. Only the cross-stream velocity $v_b$ and distance $D$ matter.
      $t = \frac{D}{v_b}$.

  - id: m2d-tier-q14
    title: Level 3 - Perpendicular Crossing Drift
    type: symbolicResponse
    prompt: |
      Using the time $t = D/v_b$ from the previous question, what is the expression for the distance downstream $L$ that the boat drifts before reaching the opposite shore?
    answer:
      expectedLatex: v_r*(D/v_b)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The downstream drift is determined entirely by the river's speed $v_r$ acting over the time of the crossing $t$.
      $L = v_r t = v_r \left( \frac{D}{v_b} \right)$.

  - id: m2d-tier-q15
    title: Level 3 - Aiming Upstream
    type: symbolicResponse
    prompt: |
      A river flows East with speed $v_r$. A boat with speed $v_b$ (where $v_b > v_r$) wants to travel directly North across the river. Enter the expression for the angle $\theta$ (measured West of North) that the boat must aim its bow. Use the $\arcsin$ function.
    answer:
      expectedLatex: \arcsin(v_r/v_b)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      To travel straight North, the boat's Westward velocity component must perfectly cancel the river's Eastward velocity.
      The boat's Westward component is $v_b \sin\theta$.
      $v_b \sin\theta = v_r \implies \sin\theta = \frac{v_r}{v_b} \implies \theta = \arcsin\left(\frac{v_r}{v_b}\right)$.
