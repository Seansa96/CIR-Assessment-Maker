- id: q001
  type: multipleChoice
  prompt: |-
    An original Three Dimensional Geometry problem variant is designed to test **planes**. Which solution strategy is most appropriate? The variant includes an extra condition, so be careful not to overgeneralize.
  choices:
  - id: a
    text: Use draw cross sections after checking the relevant constraints.
  - id: b
    text: Assume the answer from a visually similar problem still applies.
  - id: c
    text: Ignore the distinction between necessary and sufficient conditions.
  - id: d
    text: Try arithmetic first and decide the structure only after the answer appears.
  answer:
    choiceId: a
  explanation: |-
    This mirrors the difficulty of a chapter problem archetype: recognize planes, choose draw cross sections, and verify the constraints before computing. The harder version adds a condition that must be tested, not ignored.
  skills:
  - aops-three-dimensional-geometry
