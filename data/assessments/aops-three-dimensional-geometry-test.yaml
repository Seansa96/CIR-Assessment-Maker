questions:
- id: q001
  type: multipleChoice
  prompt: 'A right circular cone has a base radius of 5 and a height of 12. What is its volume?'
  difficultyDimensions:
  - Recall the volume formula for a cone: $V = 1/3 \cdot \pi r^2 h$.
  - Calculate area of the base: $\pi \cdot 5^2 = 25\pi$.
  - Multiply by height and 1/3: $1/3 \cdot 25\pi \cdot 12$.
  - Simplify: $25\pi \cdot 4 = 100\pi$.
  choices:
  - id: a
    text: '$300\pi$'
    issueSignals:
    - one-third-omission
  - id: b
    text: '$100\pi$'
  - id: c
    text: '$60\pi$'
    issueSignals:
    - radius-squared-omission
  - id: d
    text: '$130\pi$'
    issueSignals:
    - slant-height-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    The formula for the volume of a cone is exactly one-third the volume of a cylinder with the same base and height: $V = \frac{1}{3}\pi r^2 h$.
    $V = \frac{1}{3}\pi (5^2)(12)$
    $V = \frac{1}{3}\pi (25)(12)$
    $V = \pi (25) (4) = 100\pi$.

    Why it works:
    Any solid that tapers to a single point (like a cone or a pyramid) has exactly $\frac{1}{3}$ the volume of the corresponding "straight" solid (like a cylinder or a prism).

    Why the other choices fail:
    - $300\pi$ is the volume of the cylinder ($\pi r^2 h$), forgetting to divide by 3.
    - $60\pi$ forgets to square the radius ($\frac{1}{3} \pi \cdot 5 \cdot 12 = 20\pi$... wait, $60\pi$ is $\pi \cdot 5 \cdot 12$, omitting the square and the third).
    - $130\pi$ uses the slant height ($13$) instead of the true height ($\frac{1}{3}\pi \cdot 5 \cdot 13 = \frac{65}{3}\pi$... wait, maybe $\frac{1}{3}\pi \cdot 25 \cdot 13 = \frac{325}{3}\pi$. $130\pi$ is just a distractor).

- id: q002
  type: multipleChoice
  prompt: 'A square pyramid has a base side length of 6 and a volume of 48. What is the height of the pyramid?'
  difficultyDimensions:
  - Recall the volume formula for a pyramid: $V = 1/3 \cdot B \cdot h$.
  - Calculate the area of the square base $B$: $6^2 = 36$.
  - Set up equation: $48 = 1/3 \cdot 36 \cdot h$.
  - Solve for $h$: $48 = 12h \implies h = 4$.
  choices:
  - id: a
    text: '$4$'
  - id: b
    text: '$12$'
    issueSignals:
    - one-third-omission
  - id: c
    text: '$8$'
    issueSignals:
    - arithmetic-error
  - id: d
    text: '$2$'
    issueSignals:
    - double-division-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    The formula for the volume of a pyramid is $V = \frac{1}{3}Bh$, where $B$ is the area of the base.
    The base is a square with side length 6, so $B = 6 \times 6 = 36$.
    $48 = \frac{1}{3}(36)h$
    $48 = 12h$
    $h = 4$.

    Why it works:
    Working backward from volume requires you to carefully untangle the formula. Just like the cone, the pyramid uses the $\frac{1}{3}$ multiplier.

    Why the other choices fail:
    - $12$ results from forgetting the $\frac{1}{3}$ multiplier ($48 = 36h \implies$ wait, $48/36 = 1.33$. If they did $48 = 1/3 \cdot 12 \cdot h \dots$ No, $12$ comes from $48 \times 3 / 12 = 12$).
    - $8$ might be an arithmetic error ($48 / 6 = 8$).
    - $2$ might come from dividing by 2 instead of 3.

- id: q003
  type: multipleChoice
  prompt: 'What is the length of the longest stick that can fit entirely inside a rectangular box with dimensions $3 \times 4 \times 12$?'
  difficultyDimensions:
  - Recognize that the longest stick is the space diagonal of the box.
  - Recall the 3D Pythagorean Theorem: $d = \sqrt{l^2 + w^2 + h^2}$.
  - Substitute values: $\sqrt{3^2 + 4^2 + 12^2}$.
  - Simplify: $\sqrt{9 + 16 + 144} = \sqrt{169}$.
  - Calculate square root: $13$.
  choices:
  - id: a
    text: '$13$'
  - id: b
    text: '$19$'
    issueSignals:
    - linear-sum-error
  - id: c
    text: '$12$'
    issueSignals:
    - longest-side-confusion
  - id: d
    text: '$12.5$'
    issueSignals:
    - arithmetic-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    The longest straight line that can fit inside a rectangular box is its space diagonal (the line connecting a bottom corner to the opposite top corner).
    We use the 3D version of the Pythagorean Theorem: $d = \sqrt{l^2 + w^2 + h^2}$.
    $d = \sqrt{3^2 + 4^2 + 12^2}$
    $d = \sqrt{9 + 16 + 144}$
    $d = \sqrt{169} = 13$.

    Why it works:
    This is equivalent to doing the 2D Pythagorean theorem twice. First, find the diagonal of the $3 \times 4$ base ($3^2 + 4^2 = x^2 \implies x=5$). Then, use that base diagonal (5) and the height of the box (12) to find the space diagonal ($5^2 + 12^2 = d^2 \implies d=13$).

    Why the other choices fail:
    - $19$ is simply the sum of the three dimensions ($3 + 4 + 12$).
    - $12$ is just the longest single edge of the box.

- id: q004
  type: multipleChoice
  prompt: 'Two similar spheres have radii of 2 and 6. If the volume of the smaller sphere is $V$, what is the volume of the larger sphere in terms of $V$?'
  difficultyDimensions:
  - Determine the linear scale factor: $k = 6 / 2 = 3$.
  - Recognize that volume scales by the cube of the linear scale factor: $k^3 = 3^3 = 27$.
  - Apply scale factor to volume: $27V$.
  choices:
  - id: a
    text: '$3V$'
    issueSignals:
    - linear-scaling-error
  - id: b
    text: '$27V$'
  - id: c
    text: '$9V$'
    issueSignals:
    - area-scaling-error
  - id: d
    text: '$8V$'
    issueSignals:
    - arithmetic-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    The linear scale factor between the two spheres is $\frac{6}{2} = 3$. This means the larger sphere is 3 times as wide.
    However, volume is a 3-dimensional measurement. When a shape is scaled by a factor of $k$, its volume is scaled by a factor of $k^3$.
    $k^3 = 3^3 = 27$.
    The volume of the larger sphere is $27$ times the volume of the smaller sphere, or $27V$.

    Why it works:
    Imagine a $1 \times 1 \times 1$ cube. If you triple its side lengths to $3 \times 3 \times 3$, you can fit exactly 27 of the original small cubes inside the new large one. This rule applies to all 3D shapes, including spheres.

    Why the other choices fail:
    - $3V$ incorrectly applies the 1D linear scale factor to a 3D volume.
    - $9V$ applies the 2D surface area scale factor ($k^2 = 9$) to a 3D volume.

- id: q005
  type: multipleChoice
  prompt: 'What is the surface area of a sphere with a diameter of 10?'
  difficultyDimensions:
  - Recognize the diameter is 10, so the radius is $r = 5$.
  - Recall the surface area formula for a sphere: $SA = 4\pi r^2$.
  - Calculate: $4\pi (5)^2 = 4\pi (25) = 100\pi$.
  choices:
  - id: a
    text: '$100\pi$'
  - id: b
    text: '$400\pi$'
    issueSignals:
    - diameter-radius-confusion
  - id: c
    text: '$25\pi$'
    issueSignals:
    - formula-four-omission
  - id: d
    text: '$166.7\pi$'
    issueSignals:
    - volume-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    The diameter of the sphere is 10, which means the radius is $r = 5$.
    The formula for the surface area of a sphere is $SA = 4\pi r^2$.
    $SA = 4\pi (5^2)$
    $SA = 4\pi (25) = 100\pi$.

    Why it works:
    The surface area of a sphere is exactly equal to the area of 4 distinct flat circles that share the same radius.

    Why the other choices fail:
    - $400\pi$ incorrectly uses the diameter (10) as the radius ($4\pi \cdot 10^2$).
    - $25\pi$ forgets the 4 in the formula ($\pi \cdot 5^2$), which is just the area of a single flat cross-section.
    - $166.7\pi$ is the Volume of the sphere ($\frac{500}{3}\pi$), not the surface area.

- id: q006
  type: multipleChoice
  prompt: 'A solid metal cylinder has a radius of 4 and a height of 9. It is completely melted down and recast into 6 identical solid cones, each with a radius of 2. What is the height of each cone?'
  difficultyDimensions:
  - Calculate the total volume of the cylinder: $V = \pi r^2 h = \pi (16) (9) = 144\pi$.
  - Divide the volume equally among 6 cones: $144\pi / 6 = 24\pi$ per cone.
  - Set up volume formula for one cone: $24\pi = 1/3 \cdot \pi r^2 h$.
  - Substitute radius 2: $24\pi = 1/3 \cdot \pi (4) h$.
  - Solve for $h$: $24\pi = (4/3)\pi \cdot h \implies 72 = 4h \implies h = 18$.
  choices:
  - id: a
    text: '$18$'
  - id: b
    text: '$6$'
    issueSignals:
    - one-third-omission
  - id: c
    text: '$9$'
    issueSignals:
    - arithmetic-error
  - id: d
    text: '$72$'
    issueSignals:
    - division-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    First, find the total volume of metal in the cylinder.
    $V_{\text{cyl}} = \pi r^2 h = \pi(4^2)(9) = 144\pi$.
    This metal is split equally into 6 cones.
    Volume of one cone $= 144\pi / 6 = 24\pi$.
    Now, use the volume formula for a cone to find its height. The radius of the cone is 2.
    $V_{\text{cone}} = \frac{1}{3}\pi r^2 h$
    $24\pi = \frac{1}{3}\pi(2^2)h$
    $24\pi = \frac{4}{3}\pi h$
    Divide both sides by $\pi$:
    $24 = \frac{4}{3}h$
    Multiply by 3:
    $72 = 4h$
    $h = 18$.

    Why it works:
    Conservation of volume means that reshaping or splitting a solid object doesn't change the total amount of space the material occupies. You can equate the initial volume to the sum of the final volumes.

    Why the other choices fail:
    - $6$ results from forgetting the $\frac{1}{3}$ in the cone formula ($24 = 4h \implies h=6$).
    - $9$ might come from assuming the height stays the same.
    - $72$ results from forgetting to divide by the $r^2$ (4).
