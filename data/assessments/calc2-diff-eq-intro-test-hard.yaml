schemaVersion: 1
id: calc2-diff-eq-intro-test-hard
title: Modeling Differential Equations Test — Hard
assessmentType: test
categoryId: calculus-2
topicId: diff-eq-intro-modeling
modeDefault: practice
randomizeQuestions: true
skills: [construct nonlinear models, analyze equilibria, verify solutions]
navigation: { learningGoal: evaluate, activityType: formalTest, tags: [calculus-2, differential-equations, modeling] }
questions:
- id: q001
  type: symbolicResponse
  skills: [construct nonlinear models]
  prompt: A population $P$ has carrying capacity $M$ and logistic growth constant $k$. Enter $dP/dt$.
  answer: { expectedLatex: 'k*P*(1-P/M)', equivalenceMode: expression, tolerance: 0.000001, variables: [k, P, M], explanation: Logistic growth combines proportional growth with the remaining-capacity factor. }
- id: q002
  type: numericResponse
  skills: [analyze equilibria]
  prompt: For $P'=0.2P(100-P)$, what is the positive equilibrium?
  answer: { value: 100, tolerance: 0.001 }
  explanation: The factor $100-P$ vanishes at the carrying capacity.
- id: q003
  type: numericResponse
  skills: [analyze equilibria]
  prompt: For $P'=0.2P(100-P)$, evaluate $P'$ when $P=120$.
  answer: { value: -480, tolerance: 0.001 }
  explanation: Above carrying capacity, the factor $100-P$ is negative.
- id: q004
  type: symbolicResponse
  skills: [verify solutions]
  prompt: Enter the derivative of $y=3\sin(2x)$.
  answer: { expectedLatex: '6*cos(2x)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: Apply the chain rule to $\sin(2x)$. }
- id: q005
  type: numericResponse
  skills: [interpret slope fields]
  prompt: For $y'=y-x^2$, find the slope at $(3,5)$.
  answer: { value: -4, tolerance: 0.001 }
  explanation: $5-3^2=-4$.
