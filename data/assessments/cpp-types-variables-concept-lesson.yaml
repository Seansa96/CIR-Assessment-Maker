lesson:
  introduction: 'C++ is a strongly-typed language, meaning every variable has a specific
    type that determines its size and the operations it supports. This lesson covers
    primitive types, `const`, `auto`, and basic console I/O using `<iostream>`.

    '
  sections:
  - id: primitive-types
    title: Primitive Types
    required: true
    content: 'C++ offers several primitive types for numbers, characters, and booleans:


      - `int`: Standard integer (usually 32 bits).

      - `long long`: Larger integer (usually 64 bits).

      - `float`: Single-precision floating-point number.

      - `double`: Double-precision floating-point number (preferred for most decimals).

      - `bool`: Boolean value (`true` or `false`).

      - `char`: Single ASCII character (e.g., `''A''`).


      Variables are declared with their type followed by their name:


      ```cpp

      int age = 25;

      double price = 19.99;

      bool isStudent = false;

      char grade = ''A'';

      ```

      '
    check:
      id: primitive-types-check
      type: multipleChoice
      prompt: Which type is best suited for storing a person's weight in kilograms
        (e.g., 68.5)?
      choices:
      - id: a
        text: '`double`'
      - id: b
        text: '`int`'
      - id: c
        text: '`bool`'
      - id: d
        text: '`char`'
      answer:
        choiceId: a
      explanation: '`double` is used for floating-point (decimal) numbers. `int` truncates
        the decimal part.

        '
  - id: const-and-auto
    title: Const and Auto
    required: true
    content: 'Use the `const` keyword when a variable''s value should never change
      after initialization:


      ```cpp

      const double PI = 3.14159;

      // PI = 3.14; // Error: cannot assign to a const variable

      ```


      The `auto` keyword tells the compiler to deduce the variable''s type from its
      initializer. This is useful when the type is obvious or very long to type out:


      ```cpp

      auto count = 10;       // Deduced as int

      auto price = 9.99;     // Deduced as double

      const auto MAX = 100;  // Deduced as const int

      ```

      '
    check:
      id: const-and-auto-check
      type: selectAll
      prompt: Which of the following statements are true about `const` and `auto`?
      choices:
      - id: a
        text: A `const` variable must be initialized when it is declared.
      - id: b
        text: The type of an `auto` variable is determined at compile time.
      - id: c
        text: An `auto` variable can change its type later in the program.
      - id: d
        text: A `const` variable's value cannot be modified after initialization.
      answer:
        choiceIds:
        - a
        - b
        - d
      explanation: '`auto` infers the type once at compile time. C++ is statically
        typed, so the type of an `auto` variable never changes.

        '
  - id: basic-input-output
    title: Basic Console I/O
    required: true
    content: "C++ uses the `<iostream>` library for console input and output. The\
      \ standard output stream is `std::cout`, and the standard input stream is `std::cin`.\n\
      \nUse the insertion operator `<<` to send data to `cout`, and the extraction\
      \ operator `>>` to read data from `cin`.\n\n```cpp\n#include <iostream>\n#include\
      \ <string>\n\nusing namespace std;\n\nint main() {\n    int age;\n    cout <<\
      \ \"Enter your age: \";\n    cin >> age;\n    \n    cout << \"You are \" <<\
      \ age << \" years old.\" << endl;\n    return 0;\n}\n```\n\n`endl` inserts a\
      \ newline and flushes the stream. You can also use `\\n` inside strings for\
      \ a newline.\n"
    check:
      id: basic-input-output-check
      type: multipleChoice
      prompt: What is the correct way to read an integer into the variable `score`?
      choices:
      - id: a
        text: '`cin >> score;`'
      - id: b
        text: '`cin << score;`'
      - id: c
        text: '`cout >> score;`'
      - id: d
        text: '`cout << score;`'
      answer:
        choiceId: a
      explanation: '`cin >>` extracts input from the standard input stream into the
        variable.

        '
  - id: strings
    title: Strings
    required: true
    content: "The `std::string` type represents a sequence of characters. It is part\
      \ of the `<string>` library.\n\n```cpp\n#include <string>\n#include <iostream>\n\
      using namespace std;\n\nint main() {\n    string firstName = \"Alice\";\n  \
      \  string lastName = \"Smith\";\n    string fullName = firstName + \" \" + lastName;\n\
      \    \n    cout << fullName << \"\\n\";\n    return 0;\n}\n```\n\nNotice that\
      \ `+` concatenates strings. When reading a string with `cin >>`, it only reads\
      \ up to the first whitespace. To read a whole line, use `getline(cin, myString)`.\n"
    check:
      id: strings-check
      type: multipleChoice
      prompt: If a user enters `"John Doe"` when prompted, what does `cin >> name;`
        store in the string `name`?
      choices:
      - id: a
        text: '"John"'
      - id: b
        text: '"John Doe"'
      - id: c
        text: '"Doe"'
      - id: d
        text: An error occurs
      answer:
        choiceId: a
      explanation: '`cin >>` stops reading at the first whitespace. To read `"John
        Doe"`, use `getline(cin, name);`.

        '
