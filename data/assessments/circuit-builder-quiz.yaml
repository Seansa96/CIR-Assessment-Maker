schemaVersion: 1
id: circuit-builder-quiz
title: Circuit Builder Challenges Quiz
assessmentType: quiz
categoryId: electronics-and-circuits
subcategoryId: ec-series-circuits
subcategoryIds:
  - ec-series-circuits
  - ec-parallel-circuits
modeDefault: practice
randomizeQuestions: false
questions:
  - id: q001
    type: circuit
    prompt: |
      Build a simple series circuit connecting a **battery** and **two resistors** in a single loop.
    circuitQuestion:
      schemaVersion: 1
      catalogVersion: 1
      interactionMode: build
      paletteSymbolIds:
        - resistor
        - battery
        - junction
      editableProperties:
        - rotation
      diagram:
        width: 500
        height: 350
        components:
          - id: V1
            symbolId: battery
            x: 100
            y: 180
            rotation: 270
            value: 9V
            label: V1
          - id: R1
            symbolId: resistor
            x: 260
            y: 100
            rotation: 0
            value: 100
            label: R1
          - id: R2
            symbolId: resistor
            x: 260
            y: 260
            rotation: 0
            value: 200
            label: R2
        nodes: []
        wires:
          - id: w1
            sourceId: V1.p1
            targetId: R1.p1
          - id: w2
            sourceId: R1.p2
            targetId: R2.p1
          - id: w3
            sourceId: R2.p2
            targetId: V1.p2
    answer:
      circuitAnswer:
        topology:
          requiredComponents:
            - symbolId: resistor
              count: 2
            - symbolId: battery
              count: 1
          connectionMode: singleSeriesLoop
    explanation: |
      In a series circuit, all components are connected end-to-end to form a single path for current flow.
