lesson:
  introduction: >
    This lesson develops a repeatable way to solve Capacitors & Geometry problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch08-capacitors-geometry-s1
    title: Name the model and quantities
    required: true
    content: >
      Capacitors & Geometry uses C = epsilon A/d. In the name the model and quantities stage, identify geometry, use the correct area and separation, and test how a dimension change scales capacitance.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Capacitors & Geometry problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch08-capacitors-geometry-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Capacitors & Geometry, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use C = epsilon A/d after you identify geometry, use the correct area and separation, and test how a dimension change scales capacitance.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Capacitors & Geometry problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch08-capacitors-geometry-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables C = epsilon A/d relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch08-capacitors-geometry-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Capacitors & Geometry.
        media: []
        issueSignals:
        - id: physics2-physics2-ch08-capacitors-geometry-units-error
          domains:
          - physics-2
      answer:
