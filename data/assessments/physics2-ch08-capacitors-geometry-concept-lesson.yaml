workedExamples:
- id: l1-sec1
  title: Definition of Capacitance
  explanation: 'A capacitor consists of two isolated conductors carrying equal and
    opposite charges $\pm Q$. The capacitance $C$ is defined as the ratio of the charge
    on either conductor to the magnitude of the potential difference $V$ between them:
    $C = \frac{Q}{V}$. The unit is the Farad (F).'
- id: l1-sec2
  title: Parallel-Plate Capacitor
  explanation: For two parallel conducting plates of area $A$ separated by distance
    $d$, the capacitance is $C = \frac{\epsilon_0 A}{d}$. Capacitance depends only
    on the geometry of the conductors and not on the charge or potential.
