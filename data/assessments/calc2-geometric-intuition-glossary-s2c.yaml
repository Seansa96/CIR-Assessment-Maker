schemaVersion: 1
id: calc2-geometric-intuition-glossary-s2c
title: Geometric Integration Glossary and Slice Map
assessmentType: glossary
categoryId: calculus-2
topicId: geometric-intuition
modeDefault: practice
randomizeQuestions: false
skills: [geometric-modeling, representative-slice, unit-analysis]
navigation:
  learningGoal: learn
  activityType: glossary
  tags: [calculus-2, geometric-intuition, formulas, visual-recognition]
authoring:
  visualRequirement: required
  visualRationale: Learners must recognize slice height, thickness, and the orientation-dependent boundary difference.
glossary:
  introduction: 'Use this map to name the pieces of an integral model before evaluating it.'
  sections:
    - id: slice-terms
      title: Slice model vocabulary
      required: true
      content: 'Every geometric integral can be checked by identifying a measurement, a thickness, and an interval of accumulation.'
      entries:
        - id: representative-slice
          term: Representative slice
          definition: A typical thin piece of the region or solid whose measurement can be expressed in terms of one variable.
          notation: '$\text{contribution}=\text{measurement}\times\text{thickness}$'
          examples: ['A vertical area slice has height times $dx$.', 'A volume slice has cross-sectional area times $dx$.']
          aliases: [infinitesimal slice]
          media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Highlighted vertical representative slice between two curves }]
          tags: [slice, model]
          drills:
            - id: representative-slice-drill
              type: cloze
              prompt: 'A geometric integral begins by describing one representative ____.'
              answer: { expected: slice, aliases: [piece] }
              explanation: 'Solution: The missing term is slice. Why it works: The integral accumulates copies of a representative thin piece. Common trap: A formula without a slice measurement has not yet modeled the geometry.'
        - id: thickness
          term: Slice thickness
          definition: 'The small width of a slice: $dx$ for vertical slices or $dy$ for horizontal slices.'
          notation: '$dx$ or $dy$'
          examples: ['Thickness is perpendicular to the slice height or length.']
          aliases: [differential width]
          media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Width of highlighted vertical slice labelled dx }]
          tags: [dx, dy]
          drills:
            - id: thickness-drill
              type: cloze
              prompt: 'A vertical slice has thickness ____.'
              answer: { expected: '$dx$', aliases: [dx] }
              explanation: 'Solution: The missing differential is $dx$. Why it works: A vertical slice is indexed by changes in x. Common trap: Its height is a y-difference, but its thickness is not $dy$.'
        - id: top-minus-bottom
          term: Top minus bottom
          definition: The vertical-slice height obtained by subtracting the lower curve from the upper curve at the same x-value.
          notation: '$f_{\mathrm{top}}(x)-f_{\mathrm{bottom}}(x)$'
          examples: ['Use this form only where the same curve stays on top.']
          aliases: [vertical slice height]
          media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Vertical slice labelled upper curve minus lower curve }]
          tags: [vertical, area]
          drills:
            - id: top-bottom-drill
              type: flashcard
              prompt: 'What difference gives the height of a vertical area slice?'
              answer: { expected: 'top minus bottom', aliases: ['upper minus lower', 'f top minus f bottom'] }
              explanation: 'Solution: The expression is top minus bottom. Why it works: The slice measures a positive vertical distance. Common trap: Bottom minus top reverses its sign.'
        - id: right-minus-left
          term: Right minus left
          definition: The horizontal-slice length obtained by subtracting the left boundary from the right boundary at the same y-value.
          notation: '$x_{\mathrm{right}}(y)-x_{\mathrm{left}}(y)$'
          examples: ['Use horizontal slices when this description avoids an unnecessary partition.']
          aliases: [horizontal slice length]
          media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Slice-model diagram used to contrast horizontal right minus left measurement }]
          tags: [horizontal, dy]
          drills:
            - id: right-left-drill
              type: cloze
              prompt: 'A horizontal slice is measured as ____ minus ____.'
              answer: { expected: 'right; left', aliases: ['right,left'] }
              explanation: 'Solution: The order is right, then left. Why it works: Horizontal distance is a change in x-coordinate. Common trap: $dy$ names thickness, not the boundary difference.'
        - id: signed-accumulation
          term: Signed accumulation
          definition: The value of a definite integral, where contributions below the reference axis carry negative sign.
          notation: '$\int_a^b f(x)\,dx$'
          examples: ['Equal positive and negative signed areas can cancel.']
          aliases: [net accumulation]
          media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Slice model for interpreting positive and negative contributions }]
          tags: [definite-integral, sign]
          drills:
            - id: signed-drill
              type: typed
              prompt: 'What kind of accumulation does an ordinary definite integral record when the graph crosses the axis?'
              answer: { expected: signed, aliases: ['signed accumulation', 'net signed accumulation'] }
              explanation: 'Solution: It records signed accumulation. Why it works: Contributions below the reference axis have negative sign. Common trap: Geometric area is nonnegative and may require splitting or absolute values.'
        - id: unit-check
          term: Unit check
          definition: A dimensional test of whether the slice measurement times thickness has the units of the requested quantity.
          notation: '$[\text{measurement}]\,[dx]$'
          examples: ['length times length gives area', 'area times length gives volume']
          aliases: [dimensional analysis]
          media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Representative slice emphasizing measurement multiplied by thickness }]
          tags: [units, validation]
          drills:
            - id: unit-check-drill
              type: flashcard
              prompt: 'What units should cross-sectional area times thickness produce?'
              answer: { expected: volume, aliases: ['cubic units', 'cubic length'] }
              explanation: 'Solution: The result is volume. Why it works: Area has square-length units and thickness contributes one more length. Common trap: Reporting square units omits the thickness factor.'
