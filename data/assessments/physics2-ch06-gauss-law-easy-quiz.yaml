  prompt: A point charge $+Q$ is placed at the center of an uncharged, hollow, conducting spherical shell.
    What is the net charge on the OUTER surface of the shell?
  explanation: 'Solution:

    The charge $+Q$ induces a charge $-Q$ on the inner surface. Since the shell is uncharged, the outer
    surface must have a charge $+Q$ to maintain neutrality.


    Why it works:

    Inside the conductor, the field is zero. A Gaussian surface inside the shell material must enclose
    zero net charge, so $Q_{inner} = -Q$. Charge conservation requires $Q_{outer} + Q_{inner} = 0$, so
    $Q_{outer} = +Q$.

    Why the other choices fail: $-Q$ is on the inner surface. Zero violates charge conservation. The radius
    does not affect the total induced charge.'
  choices:
  - id: a
    text: $+Q$
  - id: b
    text: $-Q$
  - id: c
    text: Zero
  - id: d
    text: Depends on the inner radius
  answer:
    choiceId: a
