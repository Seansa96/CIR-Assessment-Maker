  explanation: 'Solution: Total flux is q/epsilon0 and symmetry shares it equally across six faces.


    Why it works: The centered charge makes all faces equivalent.


    Why the other choices fail: Full flux belongs to the whole cube; the other fraction or zero violates symmetry/Gauss’s
    law.'
