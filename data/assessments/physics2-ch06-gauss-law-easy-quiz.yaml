- id: q002
  type: multipleChoice
  skills:
  - physics2-ch06-gauss-law-gauss-law-concept
  prompt: E=200 N/C, A=0.050 m^2, and field is 60 degrees from outward normal. Flux?
  choices:
  - id: a
    text: 5.0 N m^2/C
  - id: b
    text: 10 N m^2/C
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: '0'
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: -5.0 N m^2/C
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: Phi=EA cos(60)=5.0 N m^2/C.


    Why it works: The angle is measured from the area normal.


    Why the other choices fail: Using the plane angle gives 10; zero or negative contradicts the acute normal angle.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
