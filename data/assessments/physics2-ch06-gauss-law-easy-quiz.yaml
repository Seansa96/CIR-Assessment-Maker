- id: q006
  type: multipleChoice
  skills:
  - physics2-ch06-gauss-law-gauss-law-concept
  prompt: Field magnitude at r from an infinite line with density lambda?
  choices:
  - id: a
    text: '|lambda|/(2 pi epsilon0 r)'
  - id: b
    text: '|lambda|/(4 pi epsilon0 r^2)'
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: '|lambda|/(2 epsilon0)'
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: '|lambda| r/(2 pi epsilon0)'
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: Gauss’s law on a cylinder gives E(2 pi r L)=|lambda|L/epsilon0.


    Why it works: The cylindrical area grows linearly with r, so E scales as 1/r.


    Why the other choices fail: The options use point-charge, sheet, or increasing-with-r behavior.'
