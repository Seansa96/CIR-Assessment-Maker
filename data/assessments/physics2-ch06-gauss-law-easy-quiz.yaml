- id: q003
  type: multipleChoice
  skills:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  prompt: 'A closed surface encloses -3.0 nC. Its net flux is:'
  choices:
  - id: a
    text: +3.0e-9/epsilon0
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: -3.0 epsilon0
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: zero net flux through the closed surface
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: -3.0e-9/epsilon0
  answer:
    choiceId: d
  explanation: 'Solution: Gauss’s law gives Phi=Qenc/epsilon0.


    Why it works: The sign follows enclosed net charge.


    Why the other choices fail: The distractors reverse sign, multiply by epsilon0, or ignore nonzero enclosed charge.'
  difficultyDimensions:
