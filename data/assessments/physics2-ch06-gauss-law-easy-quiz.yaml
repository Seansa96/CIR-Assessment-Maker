- id: q004
  type: multipleChoice
  skills:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  prompt: 'A charge lies outside a closed surface. Its contribution to net flux is:'
  choices:
  - id: a
    text: -q/epsilon0
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: depends on surface radius
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: zero
  - id: d
    text: +q/epsilon0
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: c
  explanation: 'Solution: An external charge contributes zero net closed-surface flux.


    Why it works: It can create local field, but Gauss’s law counts enclosed net charge.


    Why the other choices fail: The nonzero choices incorrectly treat external charge as enclosed.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
