- id: q005
  type: multipleChoice
  skills:
  - physics2-ch06-gauss-law-electric-flux
  prompt: Best Gaussian surface for an infinite line charge?
  choices:
  - id: a
    text: flat disk
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: coaxial cylinder
  - id: c
    text: centered sphere
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: cube with line at corner
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: b
  explanation: 'Solution: A coaxial cylinder matches cylindrical symmetry.


    Why it works: E is constant on its curved side and parallel to end caps.


    Why the other choices fail: The other surfaces do not make the flux integral uniform.'
  difficultyDimensions:
