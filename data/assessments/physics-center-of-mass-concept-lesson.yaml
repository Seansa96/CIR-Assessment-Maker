  - id: velocity
    title: 5. Relate center-of-mass velocity to total momentum
    required: true
    content: >
      Differentiating the mass-weighted position gives

      $$\vec v_{\mathrm{com}}=\frac{\sum_i m_i\vec v_i}{M}=\frac{\vec P_{\mathrm{total}}}{M}.$$

      Equal masses moving with equal speeds in opposite directions have zero total momentum and therefore a stationary center of mass.
    media: []
    check:
      id: com-c005
      type: multipleChoice
      prompt: Two equal masses move at $+5.0$ m/s and $-5.0$ m/s on the x-axis. What is $v_{\mathrm{com},x}$?
      choices:
      - id: a
        text: $-5.0$ m/s
        media: []
        issueSignals:
        - id: selected-one-particle
          domains:
          - physics-1
      - id: b
        text: $0$ m/s
        media: []
        issueSignals: []
      - id: c
        text: $+5.0$ m/s
        media: []
        issueSignals:
        - id: selected-one-particle
          domains:
          - physics-1
      - id: d
        text: $10.0$ m/s
        media: []
        issueSignals:
        - id: velocity-addition-error
          domains:
          - physics-1
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The momenta cancel, so $v_{\mathrm{com},x}=[m(5.0)+m(-5.0)]/(2m)=0$ m/s.


        Why it works: Total momentum, not the speed of one particle, determines center-of-mass velocity.


        Why the other choices fail: Choices a and c select one particle, while d adds speeds without accounting for opposite directions.
