glossary: 
lesson:
  introduction: A center of mass is a mass-weighted location for an extended system. It lets us predict the motion of a complicated object by tracking one point while still respecting the chosen system boundary.
  sections:
  - id: system
    title: 1. Choose the system before naming forces
    required: true
    content: >
      A **system** is the collection of objects whose overall motion you will describe. Forces between pieces of that system are internal; forces from outside it are external. For the whole system, internal forces occur in equal-and-opposite pairs, so they do not change the system's total momentum.
    media: []
    check:
      id: com-c001
      type: multipleChoice
      prompt: A firework is defined as the system just before it bursts. Which force is internal to that system?
      choices:
      - id: a
        text: The force of one fragment on another
        media: []
        issueSignals: []
      - id: b
        text: Earth's gravitational force on the firework
        media: []
        issueSignals:
        - id: internal-external-confusion
          domains:
          - physics-1
      - id: c
        text: Air resistance from the surrounding air
        media: []
        issueSignals:
        - id: internal-external-confusion
          domains:
          - physics-1
      - id: d
        text: The normal force from a launch rail
        media: []
        issueSignals:
        - id: system-boundary-error
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The interaction of two fragments is internal because both fragments belong to the selected firework system.


        Why it works: Internal forces pair within one system; forces from Earth, air, or a rail originate outside it.


        Why the other choices fail: Choices b, c, and d name agents outside the selected firework system.
