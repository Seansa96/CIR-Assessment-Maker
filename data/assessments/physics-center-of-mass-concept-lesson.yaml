  - id: strategy
    title: 7. Use a repeatable calculation and check
    required: true
    content: >
      A reliable workflow is: define the system and coordinate axes; list each mass and position; find $M$; calculate each weighted component; then check units and location. A center of mass should have position units and, for positive masses, each component should fall within the corresponding coordinate range.
    media: []
    check:
      id: com-c007
      type: multipleChoice
      prompt: Which result is the strongest warning that a positive-mass one-dimensional calculation needs checking?
      choices:
      - id: a
        text: The result is between the smallest and largest x positions
        media: []
        issueSignals:
        - id: valid-range-misread
          domains:
          - physics-1
      - id: b
        text: The result has units of meters
        media: []
        issueSignals:
        - id: units-check-misread
          domains:
          - physics-1
      - id: c
        text: The result is outside the range of all listed x positions
        media: []
        issueSignals: []
      - id: d
        text: The result is closer to a heavier mass
        media: []
        issueSignals:
        - id: weighted-average-misread
          domains:
          - physics-1
      answer:
        choiceId: c
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: A center of mass outside every listed coordinate is a warning for a system of positive point masses.


        Why it works: A positive mass-weighted average is bounded by the smallest and largest values being averaged.


        Why the other choices fail: Choices a, b, and d are all expected consistency checks for a valid mass-weighted position.
