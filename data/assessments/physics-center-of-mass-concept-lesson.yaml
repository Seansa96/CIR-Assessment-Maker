  - id: one-d
    title: 3. Calculate a one-dimensional center of mass
    required: true
    content: >
      Along one axis, calculate

      $$x_{\mathrm{com}}=\frac{\sum_i m_i x_i}{\sum_i m_i}.$$

      Use signed coordinates and divide by **total mass**, not the number of objects. The result should lie between the leftmost and rightmost masses for positive masses.
    media: []
    check:
      id: com-c003
      type: multipleChoice
      prompt: A 2.0 kg cart is at $x=0$ m and a 4.0 kg cart is at $x=6.0$ m. What is $x_{\mathrm{com}}$?
      choices:
      - id: a
        text: $2.0$ m
        media: []
        issueSignals:
        - id: unweighted-average
          domains:
          - physics-1
      - id: b
        text: $3.0$ m
        media: []
        issueSignals:
        - id: unweighted-average
          domains:
          - physics-1
      - id: c
        text: $4.0$ m
        media: []
        issueSignals: []
      - id: d
        text: $6.0$ m
        media: []
        issueSignals:
        - id: heaviest-position-only
          domains:
          - physics-1
      answer:
        choiceId: c
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $x_{\mathrm{com}}=[(2.0)(0)+(4.0)(6.0)]/(2.0+4.0)=4.0$ m.


        Why it works: The mass at 6.0 m contributes twice the position-weighted mass of the 2.0 kg cart, pulling the average toward it.


        Why the other choices fail: Choices a and b ignore the correct weighting, while d ignores the 2.0 kg cart entirely.
      media: []
