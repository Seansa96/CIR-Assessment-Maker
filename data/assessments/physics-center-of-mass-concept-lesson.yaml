  - id: components
    title: 4. Resolve a two-dimensional center of mass by components
    required: true
    content: >
      Position is a vector, so calculate each component independently:

      $$x_{\mathrm{com}}=\frac{\sum_i m_i x_i}{M},\qquad y_{\mathrm{com}}=\frac{\sum_i m_i y_i}{M}.$$

      Do not average distances from the origin. First declare axes, then make separate mass-weighted sums for $x$ and $y$.
    media: []
    check:
      id: com-c004
      type: multipleChoice
      prompt: What is the correct first step for a two-dimensional center-of-mass calculation?
      choices:
      - id: a
        text: Choose axes and list each mass with its x and y coordinates
        media: []
        issueSignals: []
      - id: b
        text: Average all radial distances from the origin
        media: []
        issueSignals:
        - id: radial-distance-confusion
          domains:
          - physics-1
      - id: c
        text: Use only the heaviest particle's coordinates
        media: []
        issueSignals:
        - id: heaviest-position-only
          domains:
          - physics-1
      - id: d
        text: Add x coordinates to y coordinates before weighting
        media: []
        issueSignals:
        - id: component-mixing
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Define a coordinate system and tabulate every mass with both coordinates.


        Why it works: The x and y components are separate mass-weighted averages in the same coordinate system.


        Why the other choices fail: Choices b and d mix different vector information, and c discards masses that contribute to the average.
