  - id: acceleration
    title: 6. Apply Newton's second law to the whole system
    required: true
    content: >
      For a fixed-mass system,

      $$\sum\vec F_{\mathrm{ext}}=M\vec a_{\mathrm{com}}.$$

      An explosion can scatter the pieces in very different ways, but its internal forces cannot change the center-of-mass trajectory. Gravity and any other external forces still do.
    media: []
    check:
      id: com-c006
      type: multipleChoice
      prompt: Ignoring air resistance, a projectile explodes in midair. What happens to the center of mass immediately after the explosion?
      choices:
      - id: a
        text: It continues the same projectile trajectory
        media: []
        issueSignals: []
      - id: b
        text: It follows the largest fragment
        media: []
        issueSignals:
        - id: largest-fragment-confusion
          domains:
          - physics-1
      - id: c
        text: It stops because momentum is divided among fragments
        media: []
        issueSignals:
        - id: internal-force-net-effect
          domains:
          - physics-1
      - id: d
        text: It accelerates in the explosion direction
        media: []
        issueSignals:
        - id: internal-force-net-effect
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The center of mass continues the trajectory set by gravity as though the object had not exploded.


        Why it works: The explosion forces are internal, so the net external force remains gravity alone.


        Why the other choices fail: Choices b, c, and d attribute a whole-system effect to internal interactions or to one fragment.
