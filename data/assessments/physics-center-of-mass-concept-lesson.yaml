  - id: meaning
    title: 2. Interpret center of mass as a weighted location
    required: true
    content: >
      The center of mass is not necessarily a material point. It is the location obtained by weighting each position by its mass. A heavier piece pulls the center of mass closer to itself, and a hollow symmetric object can have its center of mass in empty space.
    media: []
    check:
      id: com-c002
      type: multipleChoice
      prompt: Where is the center of mass of a uniform hollow ring?
      choices:
      - id: a
        text: At its geometric center, even though no material is there
        media: []
        issueSignals: []
      - id: b
        text: At the lowest point of the ring
        media: []
        issueSignals:
        - id: center-must-contain-mass
          domains:
          - physics-1
      - id: c
        text: At the heaviest point
        media: []
        issueSignals:
        - id: uniform-symmetry-missed
          domains:
          - physics-1
      - id: d
        text: Nowhere, because the ring is hollow
        media: []
        issueSignals:
        - id: center-must-contain-mass
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: auto
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The center of mass is at the geometric center of the uniform ring.


        Why it works: Symmetry places equal mass at opposite positions, so all mass-weighted offsets cancel.


        Why the other choices fail: Choices b and c break the ring's symmetry, and choice d incorrectly assumes a center of mass must contain matter.
