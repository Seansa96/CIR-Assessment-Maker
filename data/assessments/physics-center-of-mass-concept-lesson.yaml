lesson:
  introduction: Center of Mass
  sections:
  - id: sec-q001
    title: What is the Center of Mass?
    content: |
      **What is the Center of Mass?**

      When a gymnast flips through the air, their arms and legs trace out complicated paths. However, there is one specific point on their body that moves in a perfect, simple parabola, just as if they were a single point particle. This magical point is called the **Center of Mass (COM)**.

      For a system of discrete particles along the $x$-axis, the center of mass is the mass-weighted average of their positions:

      $$
      x_{\text{com}} = \frac{m_1x_1 + m_2x_2 + \dots}{m_1 + m_2 + \dots} = \frac{1}{M}\sum m_i x_i
      $$

      Where $M$ is the total mass of the system.

      Suppose you have a $2.0\ \text{kg}$ mass at $x = 0$ and a $4.0\ \text{kg}$ mass at $x = 6.0\ \text{m}$. Where is the center of mass of this two-particle system?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: $x = 2.0\ \text{m}$
      - id: c2
        text: $x = 3.0\ \text{m}$
      - id: c3
        text: $x = 4.0\ \text{m}$
      - id: c4
        text: $x = 6.0\ \text{m}$
      answer:
        choiceId: c3
        gradingMode: auto
      explanation: |
        Using the formula:
        $$x_{\text{com}} = \frac{(2.0)(0) + (4.0)(6.0)}{2.0 + 4.0} = \frac{0 + 24.0}{6.0} = 4.0\ \text{m}$$
        Notice that the COM is closer to the heavier mass ($4.0\ \text{kg}$), which makes intuitive sense.
  - id: sec-q002
    title: Velocity of the Center of Mass
    content: |
      **Velocity of the Center of Mass**

      Just as we averaged positions to find $x_{\text{com}}$, we can average velocities to find the velocity of the center of mass, $v_{\text{com}}$:

      $$
      v_{\text{com}} = \frac{m_1v_1 + m_2v_2 + \dots}{M}
      $$

      Does this numerator look familiar? It is simply the total momentum of the system, $P_{\text{total}}$! Therefore, we can rewrite this as:

      $$
      P_{\text{total}} = Mv_{\text{com}}
      $$

      If two equal masses ($2.0\ \text{kg}$ each) are moving toward each other at $5.0\ \text{m/s}$, what is the velocity of their center of mass?
    check:
      id: check-q002
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: $5.0\ \text{m/s}$
      - id: c2
        text: $10.0\ \text{m/s}$
      - id: c3
        text: $0\ \text{m/s}$
      - id: c4
        text: $-5.0\ \text{m/s}$
      answer:
        choiceId: c3
        gradingMode: auto
      explanation: |
        Let one mass move in the positive direction ($v_1 = 5.0$) and the other in the negative direction ($v_2 = -5.0$).
        $$v_{\text{com}} = \frac{(2.0)(5.0) + (2.0)(-5.0)}{4.0} = \frac{10 - 10}{4.0} = 0\ \text{m/s}$$
        The center of mass is stationary exactly between them.
  - id: sec-q003
    title: Newton's Second Law for a System
    content: |
      **Newton's Second Law for a System**

      By taking the derivative of momentum, we find that the net external force on a system dictates the acceleration of the center of mass:

      $$
      \sum \vec{F}_{\text{ext}} = M\vec{a}_{\text{com}}
      $$

      This is a profound statement. It means internal forces (like an explosion pushing pieces apart, or tension between two blocks) have **zero effect** on the motion of the center of mass.

      An artillery shell is fired in a parabolic arc. At the peak of its trajectory, an internal explosive charge detonates, blowing it into two pieces. One piece falls straight down. Ignoring air resistance, what path does the center of mass of the two pieces follow?
    check:
      id: check-q003
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: It falls straight down with the first piece.
      - id: c2
        text: It stops moving\rhorizontally.
      - id: c3
        text: It continues along the exact same parabolic arc as if no explosion occurred.
      answer:
        choiceId: c3
        gradingMode: auto
      explanation: |
        Since the explosion is caused by internal forces, $\sum \vec{F}_{\text{ext}}$ is entirely unchanged (it's still just gravity). Therefore, $\vec{a}_{\text{com}}$ remains exactly $9.8\ \text{m/s}^2$ downward. The center of mass continues its perfect parabola, utterly unaware that the shell has exploded. If one piece falls straight down, the other piece must be thrust forward extra fast to keep the average position (the COM) on the parabola!
