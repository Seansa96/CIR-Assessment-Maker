- id: q001
  type: multipleChoice
  prompt: What is div F for F=<x^2,0,z>?
  choices:
  - id: a
    text: 2x+1
  - id: b
    text: 2x+z
    issueSignals:
    - id: curl-divergence-component-error
  - id: c
    text: <2x,0,1>
    issueSignals:
    - id: curl-divergence-component-error
  - id: d
    text: 0 (answers 'For f=x^2+y^2, what is f(1,2)-f(0,0)?', not 'What is div F for F=<x^2,0,z>?')
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: curl-divergence-component-error
  difficultyDimensions: &id001
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Take Px=2x, Qy=0, and Rz=1.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Partial Derivatives.

    Why the other choices fail: Choice b, ''2x+z'', does not give ''2x+1'' for ''What is div F for F=<x^2,0,z>?''. It substitutes
    a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''<2x,0,1>'', does not give ''2x+1'' for ''What is div F for F=<x^2,0,z>?''. It substitutes a different result,
    representation, or condition for the one the prompt specifies.

    Choice d, ''0'', does not give ''2x+1'' for ''What is div F for F=<x^2,0,z>?''. It substitutes a different result, representation,
    or condition for the one the prompt specifies.'
