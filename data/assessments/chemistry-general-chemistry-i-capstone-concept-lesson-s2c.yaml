lesson:
  introduction: 'General Chemistry I problems become manageable when the representation changes are explicit: formula, balanced equation, mole amount, concentration, energy, or particle model.'
  sections:
    - id: representation-path
      title: Start from conserved quantities
      content: |
        A balanced chemical equation conserves atoms. Its coefficients are mole ratios, not mass ratios. For a quantitative reaction problem, write a path with units at every arrow:

        $$\text{given quantity}\rightarrow\text{moles}\rightarrow\text{mole ratio}\rightarrow\text{requested quantity}. $$

        Before calculating, identify whether a second reactant can limit the process and whether the requested answer needs a significant-figure decision.
      check:
        id: representation-path-check
        type: multipleChoice
        prompt: 'Which quantity is supplied directly by a balanced-equation coefficient?'
        choices:
          - { id: a, text: 'A mole ratio between species', issueSignals: [] }
          - { id: b, text: 'A mass ratio in grams', issueSignals: [{ id: chemistry-coefficient-mass-confusion }] }
          - { id: c, text: 'A reaction temperature', issueSignals: [{ id: chemistry-equation-condition-confusion }] }
        answer: { choiceId: a }
        explanation: 'Solution: Choose a. Why it works: Coefficients count formula units and therefore compare mole amounts. Why the other choices fail: b confuses molar ratios with masses; c is not encoded by a balanced equation.'
    - id: model-selection
      title: Match the model to the question
      content: |
        Aqueous-reaction questions require particle and solubility reasoning: identify ions, decide which product is insoluble, then cancel spectator ions. Gas questions usually require absolute temperature and a pressure-volume-mole relationship. Energy questions require a sign convention and a system boundary.

        Use a molecular-structure explanation only after finding the Lewis structure, electron geometry, and molecular geometry. Bond polarity alone does not establish molecular polarity.
      check:
        id: model-selection-check
        type: multipleChoice
        prompt: 'A problem asks for the heat absorbed by water after a reaction. Which starting model is most direct?'
        choices:
          - { id: a, text: '$q=mc\Delta T$ for the water', issueSignals: [] }
          - { id: b, text: 'A solubility-rule table only', issueSignals: [{ id: chemistry-model-selection-error }] }
          - { id: c, text: 'An electron-configuration diagram only', issueSignals: [{ id: chemistry-model-selection-error }] }
        answer: { choiceId: a }
        explanation: 'Solution: Choose a. Why it works: The water mass, specific heat, and temperature change determine its heat transfer. Why the other choices fail: b addresses precipitation; c addresses electron arrangement rather than calorimetry.'
