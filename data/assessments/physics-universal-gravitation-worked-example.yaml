- id: we001
  title: Measuring g at the Earth's surface
  problem: |
    Earth's mass is $M_E = 5.97 \times 10^{24}\text{ kg}$ and its average radius is $R_E = 6.37 \times 10^6\text{ m}$. Using the universal gravitational constant $G = 6.674 \times 10^{-11}\text{ N}\cdot\text{m}^2/\text{kg}^2$, calculate the expected acceleration due to gravity $g$ for a small mass $m$ resting on the surface.
  steps:
  - id: step-1
    title: Set up the force equivalence
    instruction: |
      We start by equating the local weight of the object to the universal gravitational force exerted by the Earth.

      $$ F_{\text{weight}} = F_{\text{gravity}} $$
      $$ mg = G \frac{m M_E}{R_E^2} $$
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution: The force of gravity provides the weight of the object.

      Why it works: By Newton's second law, the force pulling the mass down is what we call its weight ($mg$). According to Newton's law of universal gravitation, this exact same force is generated by the interaction between the mass $m$ and the Earth's mass $M_E$.
  - id: step-2
    title: Isolate g
    instruction: |
      Notice that the test mass $m$ appears on both sides of the equation. We can divide both sides by $m$.

      $$ g = G \frac{M_E}{R_E^2} $$
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution: Cancel $m$ from both sides.

      Why it works: This shows a profound truth of gravity: the acceleration $g$ a body experiences near Earth is completely independent of the body's own mass!
  - id: step-3
    title: Calculate the value
    instruction: |
      Plug in the known constants:

      $$ g = (6.674 \times 10^{-11}) \frac{5.97 \times 10^{24}}{(6.37 \times 10^6)^2} $$
      $$ g \approx (6.674 \times 10^{-11}) \frac{5.97 \times 10^{24}}{4.0577 \times 10^{13}} $$
      $$ g \approx 9.82\text{ m/s}^2 $$
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution: Carefully executing the scientific notation arithmetic yields $9.82\text{ m/s}^2$.

      Why it works: Standard gravity is defined as $9.80665\text{ m/s}^2$. Our calculated value is slightly higher ($9.82$) because we assumed a perfectly spherical non-rotating Earth. The Earth's rotation (centrifugal effect) and equatorial bulge slightly reduce the effective surface $g$ at the equator.

- id: we002
  title: Force between two masses
  problem: |
    Two $10$ kg masses are separated center-to-center by $2.0$ m. Use $G=6.67\times10^{-11}$ SI units to find their gravitational-force magnitude.
  steps:
  - id: step-4
    title: Set up universal gravitation
    instruction: Substitute both masses and their center-to-center separation into Newton's law.
    type: symbolicResponse
    prompt: Write the force expression before evaluating.
    answer: { gradingMode: auto, expectedLatex: 'G(10)(10)/(2^2)', equivalenceMode: expression, tolerance: 0 }
    explanation: |
      Solution: $F=G(10)(10)/(2.0)^2$.

      Why it works: Newton's law multiplies the masses and divides by separation squared.
  - id: step-5
    title: Evaluate the force
    instruction: Compute the small attractive force magnitude.
    type: numericResponse
    prompt: What is the force in newtons?
    answer: { value: 1.6675e-9, tolerance: 1e-12 }
    explanation: |
      Solution: $F=(6.67\times10^{-11})(100)/4=1.67\times10^{-9}$ N.

      Why it works: Ordinary-size masses exert a very small gravitational force on each other.
