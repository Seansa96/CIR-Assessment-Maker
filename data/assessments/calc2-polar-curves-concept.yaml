lesson:
  introduction: 'Polar graphs are built by letting the radius $r$ change as the angle
    $\theta$ changes.


    The fastest way to graph common polar equations is not to make a huge table. First
    identify the family, then use symmetry, zeros, maximum radius, and sign changes
    to predict the shape.'
  sections:
  - id: graphing-workflow
    title: Graphing Workflow
    required: true
    content: 'A practical polar graphing routine is:


      1. Identify the equation family.

      2. Check symmetry by testing $\theta$, $-\theta$, $\pi-\theta$, or $\theta+\pi$.

      3. Find where $r=0$; these are pole crossings.

      4. Find maximum and minimum radius values.

      5. Remember that negative $r$ plots in the opposite direction.


      Useful conversion facts:


      $$

      x=r\cos\theta,\qquad y=r\sin\theta,\qquad r^2=x^2+y^2

      $$


      A negative radius does not mean the point disappears. The point $(-r,\theta)$
      is the same Cartesian point as $(r,\theta+\pi)$.'
    check:
      id: graphing-workflow-check
      type: multipleChoice
      prompt: What does a negative value of $r$ mean when graphing a polar curve?
      choices:
      - id: a
        text: Plot the positive distance in the opposite direction from the angle.
      - id: b
        text: Ignore the point because radius cannot be negative.
      - id: c
        text: Reflect the whole graph across the $x$-axis.
      - id: d
        text: Convert the equation into rectangular form before plotting anything.
      answer:
        choiceId: a
      explanation: 'A negative radius points opposite the terminal side of the angle.
        That is why negative $r$ values can create inner loops and repeated-looking
        traces.


        Related topic: Negative radius in polar coordinates.'
  - id: polar-circles
    title: Circles
    required: true
    content: 'Three common circle patterns appear constantly:


      $$

      r=a

      $$


      is a circle centered at the pole with radius $a$.


      $$

      r=2a\cos\theta

      $$


      is a circle centered on the polar axis. In rectangular form it becomes


      $$

      x^2+y^2=2ax.

      $$


      $$

      r=2a\sin\theta

      $$


      is a circle centered on the vertical axis. In rectangular form it becomes


      $$

      x^2+y^2=2ay.

      $$


      ![Common polar circle equations](/assessments/calc2-parametric-polar/polar-circles.svg)'
    check:
      id: polar-circles-check
      type: multipleChoice
      prompt: What kind of graph is $r=6\cos\theta$?
      choices:
      - id: a
        text: A circle centered on the positive $x$-axis.
      - id: b
        text: A circle centered at the pole.
      - id: c
        text: A cardioid opening right.
      - id: d
        text: A rose curve with 6 petals.
      answer:
        choiceId: a
      explanation: '$r=6\cos\theta$ matches $r=2a\cos\theta$, so $2a=6$ and $a=3$.
        It is a circle centered at $(3,0)$ with radius $3$.


        Related topic: Polar circle equations.'
  - id: cardioids
    title: Cardioids
    required: true
    content: 'Cardioids are the heart-shaped special case of a limaçon:


      $$

      r=a\pm a\cos\theta,\qquad r=a\pm a\sin\theta

      $$


      The cosine forms open left or right. The sine forms open up or down.


      - $r=a+a\cos\theta$ opens right.

      - $r=a-a\cos\theta$ opens left.

      - $r=a+a\sin\theta$ opens up.

      - $r=a-a\sin\theta$ opens down.


      ![Four cardioid orientations](/assessments/calc2-parametric-polar/polar-cardioids.svg)'
    check:
      id: cardioids-check
      type: multipleChoice
      prompt: Which equation gives a cardioid opening left?
      choices:
      - id: a
        text: $r=3-3\cos\theta$
      - id: b
        text: $r=3+3\cos\theta$
      - id: c
        text: $r=3+3\sin\theta$
      - id: d
        text: $r=3-3\sin\theta$
      answer:
        choiceId: a
      explanation: 'A negative cosine cardioid, $r=a-a\cos\theta$, opens left because
        its largest radius occurs when $\cos\theta=-1$.


        Related topic: Cardioid orientation.'
  - id: limaçons
    title: limaçons
    required: true
    content: 'limaçons have the form


      $$

      r=a\pm b\cos\theta,\qquad r=a\pm b\sin\theta.

      $$


      Their shape depends on the ratio $\frac{a}{b}$:


      - $\frac{a}{b}<1$: inner loop.

      - $\frac{a}{b}=1$: cardioid.

      - $1<\frac{a}{b}<2$: dimpled limaçon.

      - $\frac{a}{b}\ge 2$: convex limaçon.


      Cosine limaçons point horizontally. Sine limaçons point vertically. The plus/minus
      sign tells where the bulge or loop points.


      ![Inner-loop, dimpled, and convex limacons](/assessments/calc2-parametric-polar/polar-limacons.svg)'
    check:
      id: limaçons-check
      type: multipleChoice
      prompt: The polar equation $r=2+5\cos\theta$ has what kind of limaçon shape?
      choices:
      - id: a
        text: Inner loop
      - id: b
        text: Cardioid
      - id: c
        text: Dimpled limaçon
      - id: d
        text: Convex limaçon
      answer:
        choiceId: a
      explanation: 'Here $\frac{a}{b}=\frac{2}{5}<1$, so the graph has an inner loop.


        Related topic: limaçon shape classification.'
  - id: rose-curves
    title: Rose Curves
    required: true
    content: 'Rose curves have the form


      $$

      r=a\cos(n\theta)\qquad\text{or}\qquad r=a\sin(n\theta).

      $$


      The coefficient $a$ controls petal length. The integer $n$ controls petal count:


      - If $n$ is odd, the rose has $n$ petals.

      - If $n$ is even, the rose has $2n$ petals.


      Cosine roses usually place a petal on the polar axis. Sine roses are rotated
      relative to cosine roses.


      ![Odd and even rose curves](/assessments/calc2-parametric-polar/polar-roses.svg)'
    check:
      id: rose-curves-check
      type: multipleChoice
      prompt: How many petals does $r=4\sin(6\theta)$ have?
      choices:
      - id: a
        text: '6'
      - id: b
        text: '8'
      - id: c
        text: '12'
      - id: d
        text: '24'
      answer:
        choiceId: c
      explanation: 'Since $n=6$ is even, the rose has $2n=12$ petals.


        Related topic: Rose curve petal counts.'
  - id: polar-conics
    title: Polar Conic Sections
    required: true
    content: 'A conic section with a focus at the pole often appears in the form


      $$

      r=\frac{ed}{1\pm e\cos\theta}

      $$


      or


      $$

      r=\frac{ed}{1\pm e\sin\theta}.

      $$


      The value $e$ is the eccentricity:


      - $0<e<1$: ellipse.

      - $e=1$: parabola.

      - $e>1$: hyperbola.


      The cosine forms are oriented horizontally because the directrix is vertical.
      The sine forms are oriented vertically because the directrix is horizontal.


      ![Polar conics by eccentricity](/assessments/calc2-parametric-polar/polar-conics.svg)'
    check:
      id: polar-conics-check
      type: multipleChoice
      prompt: The equation $r=\frac{6}{1+1.5\cos\theta}$ represents which conic type?
      choices:
      - id: a
        text: Ellipse
      - id: b
        text: Parabola
      - id: c
        text: Hyperbola
      - id: d
        text: Circle centered at the pole
      answer:
        choiceId: c
      explanation: 'The eccentricity is $e=1.5$. Since $e>1$, the conic is a hyperbola.


        Related topic: Polar conics and eccentricity.'
  - id: graph-recognition-summary
    title: Recognition Summary
    required: true
    content: 'Use this quick recognition table:


      | Equation pattern | Graph family |

      | --- | --- |

      | $r=a$ | Circle centered at the pole |

      | $r=2a\cos\theta$ or $r=2a\sin\theta$ | Circle through the pole |

      | $r=a\pm a\cos\theta$, $r=a\pm a\sin\theta$ | Cardioid |

      | $r=a\pm b\cos\theta$, $r=a\pm b\sin\theta$ | limaçon |

      | $r=a\cos(n\theta)$, $r=a\sin(n\theta)$ | Rose |

      | $r=\frac{ed}{1\pm e\cos\theta}$ or $r=\frac{ed}{1\pm e\sin\theta}$ | Conic
      |


      When stuck, ask:


      - Does it contain only a constant? Circle.

      - Does it contain one sine or cosine term added to a constant? limaçon/cardioid.

      - Does the angle get multiplied by $n$ inside trig? Rose.

      - Is there a fraction with $1\pm e\cos\theta$ or $1\pm e\sin\theta$ in the denominator?
      Conic.'
    check:
      id: graph-recognition-summary-check
      type: selectAll
      prompt: Which equations are limaçon or cardioid forms?
      choices:
      - id: a
        text: $r=3+2\sin\theta$
      - id: b
        text: $r=4-4\cos\theta$
      - id: c
        text: $r=5\cos(3\theta)$
      - id: d
        text: $r=\frac{2}{1+0.5\cos\theta}$
      answer:
        choiceIds:
        - a
        - b
      explanation: 'limaçons and cardioids have the form $r=a\pm b\sin\theta$ or $r=a\pm
        b\cos\theta$. Choice B is the cardioid case because $a=b$.


        Related topic: Polar graph family recognition.'
  - id: negative-r-pitfall
    title: 'Pitfall: Negative r values'
    content: 'In polar coordinates, $r$ represents the directed distance from the
      pole. If $r$ is negative, you move in the **opposite direction** of the angle
      $\theta$.


      For example, the point $(-3, \pi/4)$ is plotted by facing the $\pi/4$ direction,
      but walking *backwards* 3 units, landing in the third quadrant at the same location
      as $(3, 5\pi/4)$.'
    check:
      id: negative-r-check
      type: multipleChoice
      prompt: Which of the following points is equivalent to $(-5, \pi/3)$?
      choices:
      - id: a
        text: $(5, 4\pi/3)$
      - id: b
        text: $(5, -\pi/3)$
      - id: c
        text: $(-5, 4\pi/3)$
      answer:
        choiceId: a
      explanation: A negative $r$ flips the point through the origin, which is equivalent
        to adding $\pi$ to the angle. $\pi/3 + \pi = 4\pi/3$.
