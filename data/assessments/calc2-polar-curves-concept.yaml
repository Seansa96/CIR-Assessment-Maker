lesson:
  introduction: |-
    By writing $r$ as a function of $\theta$, we can create beautiful, symmetric curves such as circles, cardioids, and roses.
  sections:
  - id: intro-polar-curves
    title: Polar Rose Curves
    content: |-
      Polar curves are formed when $r$ is a function of $\theta$.

      ![Polar Rose](/assessments/calc2-parametric-polar/polar_rose_demo.svg)
    check:
      id: intro-polar-curves-check
      type: multipleChoice
      prompt: |-
        Consider the rose curve $r=\cos(2\theta)$. How many petals does this rose have?
      choices:
      - id: a
        text: 2 petals
      - id: b
        text: 4 petals
      - id: c
        text: 8 petals
      answer:
        choiceId: b
      explanation: |-
        For rose curves $r=a\cos(n\theta)$, if $n$ is even, the curve has $2n$ petals. Since $n=2$, it has 4 petals.
