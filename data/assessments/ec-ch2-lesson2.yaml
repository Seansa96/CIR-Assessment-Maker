workedExamples:
- id: l2-sec1
  title: Resistance
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Resistance
    instruction: Resistance ($R$) represents the capacity of materials to impede the
      flow of current. The unit is the Ohm ($\Omega$). Conductance ($G$) is the reciprocal
      of resistance, measured in Siemens (S). $G = 1/R$.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec2
  title: Ohm's Law
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Ohm's Law
    instruction: 'Ohm''s law states that the voltage across a resistor is directly
      proportional to the current flowing through it: $v = iR$. If current enters
      the positive terminal, $v=iR$; if it enters the negative terminal, $v=-iR$.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec3
  title: Power in a Resistor
  problem: 'Review the following concept:'
  steps:
  - id: step3
    title: Power in a Resistor
    instruction: Power absorbed by a resistor can be calculated using $p = vi$, $p
      = i^2R$, or $p = v^2/R$. A resistor always absorbs power, so $p$ is always positive.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
