  instructions: |
    Welcome back to the Portfolio Capstone!
    
    In this step, we will implement a global reset and start spacing out our architecture using padding and margins.
    
    ![Target Preview](/media/css/portfolio_spacing_preview.webp)
    
    **Your Task:**
    1. Use the universal selector (`*`) to set `box-sizing: border-box`, and reset `margin` and `padding` to 0.
    2. Add padding to `.site-header`: `1.5rem` top and bottom, `2rem` left and right.
    3. Add padding to `.main-nav`: `0` top and bottom, `1rem` left and right.
    4. Add padding to `.nav-link`: `0.5rem` top and bottom, `1rem` left and right.
    5. Add horizontal spacing between links: Give `.nav-link` a margin of `0` top and bottom, and `0.25rem` left and right.
