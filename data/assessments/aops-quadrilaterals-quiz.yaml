schemaVersion: 1
id: aops-quadrilaterals-quiz
title: Quadrilaterals Quiz
description: Fifteen questions check direct calculation, classification, theorem conditions, and one short derivation.
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-quadrilaterals
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags: [art-of-problem-solving, aops-quadrilaterals, geometry, parallelograms, trapezoids]
skills:
- Compute quadrilateral angles, diagonal lengths, areas, and midsegments
- Apply parallelogram and special-quadrilateral properties
- Select sufficient classification tests and reject invalid converses
questions:
- id: q001
  type: multipleChoice
  prompt: A convex quadrilateral has angles $85^\circ$, $92^\circ$, $103^\circ$, and $x^\circ$. Find $x$.
  choices:
  - {id: a, text: '$70^\circ$'}
  - {id: b, text: '$80^\circ$'}
  - {id: c, text: '$90^\circ$'}
  - {id: d, text: '$100^\circ$'}
  answer: {choiceId: b}
  explanation: Quadrilateral angles total $360^\circ$, so $x=360-(85+92+103)=80$.
- id: q002
  type: multipleChoice
  prompt: One angle of a parallelogram is $68^\circ$. What is either consecutive angle?
  choices:
  - {id: a, text: '$68^\circ$'}
  - {id: b, text: '$102^\circ$'}
  - {id: c, text: '$112^\circ$'}
  - {id: d, text: '$122^\circ$'}
  answer: {choiceId: c}
  explanation: Consecutive parallelogram angles are supplementary, so the measure is $180-68=112$ degrees.
- id: q003
  type: multipleChoice
  prompt: Opposite sides of a parallelogram have lengths $4x-3$ and $2x+11$. What is their common length?
  choices:
  - {id: a, text: '$7$'}
  - {id: b, text: '$18$'}
  - {id: c, text: '$25$'}
  - {id: d, text: '$36$'}
  answer: {choiceId: c}
  explanation: Set $4x-3=2x+11$ to obtain $x=7$, then either expression gives 25.
- id: q004
  type: multipleChoice
  prompt: In parallelogram $ABCD$, diagonals meet at $O$ and $AO=9$. What is $AC$?
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-parallelogram.svg
    alt: Parallelogram ABCD with diagonals bisecting each other at O.
    caption: Use the equality of the two halves of diagonal AC.
  choices:
  - {id: a, text: '$9$'}
  - {id: b, text: '$18$'}
  - {id: c, text: '$27$'}
  - {id: d, text: '$36$'}
  answer: {choiceId: b}
  explanation: $AO=OC=9$, so $AC=18$.
- id: q005
  type: multipleChoice
  prompt: A rectangle has a diagonal of length 26. Its diagonals meet at $O$. What is the distance from $O$ to any vertex?
  choices:
  - {id: a, text: '$6.5$'}
  - {id: b, text: '$13$'}
  - {id: c, text: '$26$'}
  - {id: d, text: '$52$'}
  answer: {choiceId: b}
  explanation: Rectangle diagonals are congruent and bisect one another, so all four vertex-to-intersection segments have length 13.
- id: q006
  type: multipleChoice
  prompt: A rhombus has diagonals 6 and 8. What are its side length and area?
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-special-types.svg
    alt: Rhombus with perpendicular bisecting diagonals and four congruent sides.
    caption: Half-diagonals form the legs of a right triangle whose hypotenuse is a side.
  choices:
  - {id: a, text: Side 5 and area 24}
  - {id: b, text: Side 7 and area 24}
  - {id: c, text: Side 5 and area 48}
  - {id: d, text: Side 10 and area 48}
  answer: {choiceId: a}
  explanation: Half-diagonals 3 and 4 give side 5; area is $\tfrac12(6)(8)=24$.
- id: q007
  type: multipleChoice
  prompt: A trapezoid has bases 7 and 15. What is its midsegment length?
  choices:
  - {id: a, text: '$4$'}
  - {id: b, text: '$8$'}
  - {id: c, text: '$11$'}
  - {id: d, text: '$22$'}
  answer: {choiceId: c}
  explanation: 'The midsegment is the average of the bases: $(7+15)/2=11$.'
- id: q008
  type: multipleChoice
  prompt: A trapezoid has bases 12 and 20 and perpendicular height 5. What is its area?
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-trapezoid.svg
    alt: Trapezoid showing two parallel bases, perpendicular height, and an average-length midsegment.
    caption: Area equals average base length times perpendicular height.
  choices:
  - {id: a, text: '$40$'}
  - {id: b, text: '$64$'}
  - {id: c, text: '$80$'}
  - {id: d, text: '$160$'}
  answer: {choiceId: c}
  explanation: $K=\tfrac12(12+20)(5)=16\cdot5=80$.
- id: q009
  type: multipleChoice
  prompt: A base angle of an isosceles trapezoid is $67^\circ$. What is a consecutive angle on the same leg?
  choices:
  - {id: a, text: '$67^\circ$'}
  - {id: b, text: '$103^\circ$'}
  - {id: c, text: '$113^\circ$'}
  - {id: d, text: '$123^\circ$'}
  answer: {choiceId: c}
  explanation: 'The bases are parallel, so same-side interior angles along a leg are supplementary: $180-67=113$.'
- id: q010
  type: multipleChoice
  prompt: Which classification statement is always true?
  choices:
  - {id: a, text: Every rhombus is a square.}
  - {id: b, text: Every square is a rectangle.}
  - {id: c, text: Every rectangle is a rhombus.}
  - {id: d, text: Every kite is a parallelogram.}
  answer: {choiceId: b}
  explanation: A square has four right angles, so it meets the rectangle definition.
- id: q011
  type: multipleChoice
  prompt: Which fact alone proves that a quadrilateral is a parallelogram?
  choices:
  - {id: a, text: Its diagonals bisect each other.}
  - {id: b, text: Its diagonals are congruent.}
  - {id: c, text: Its diagonals are perpendicular.}
  - {id: d, text: One pair of opposite sides is congruent.}
  answer: {choiceId: a}
  explanation: Mutual diagonal bisection is a sufficient parallelogram test; the other single facts allow counterexamples.
- id: q012
  type: multipleChoice
  prompt: Which figure disproves the claim that every quadrilateral with perpendicular diagonals is a rhombus?
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-counterexamples.svg
    alt: Non-rhombus kite with perpendicular diagonals beside a non-rectangle isosceles trapezoid with congruent diagonals.
    caption: The left-hand figure supplies the requested counterexample.
  choices:
  - {id: a, text: A non-rhombus kite}
  - {id: b, text: A square}
  - {id: c, text: An equilateral triangle}
  - {id: d, text: A regular pentagon}
  answer: {choiceId: a}
  explanation: A kite can have perpendicular diagonals without having four equal sides or parallelogram status.
- id: q013
  type: selectAll
  prompt: Which properties hold for every parallelogram? Select all that apply.
  choices:
  - {id: a, text: Opposite sides are congruent.}
  - {id: b, text: Opposite angles are congruent.}
  - {id: c, text: Diagonals bisect each other.}
  - {id: d, text: Diagonals are perpendicular.}
  answer: {choiceIds: [a, b, c]}
  explanation: Perpendicular diagonals specialize a parallelogram to a rhombus; they are not universal.
- id: q014
  type: selectAll
  prompt: Which conditions are each sufficient by themselves to prove a quadrilateral is a parallelogram? Select all that apply.
  choices:
  - {id: a, text: Both pairs of opposite sides are congruent.}
  - {id: b, text: One pair of opposite sides is both parallel and congruent.}
  - {id: c, text: The diagonals bisect each other.}
  - {id: d, text: The diagonals are congruent.}
  answer: {choiceIds: [a, b, c]}
  explanation: Congruent diagonals also occur in non-parallelogram isosceles trapezoids.
- id: q015
  type: freeResponse
  prompt: Derive the $360^\circ$ interior-angle sum of a convex quadrilateral by drawing one diagonal. Do not cite the quadrilateral formula as an unexplained fact.
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-angle-sum.svg
    alt: Convex quadrilateral divided by one diagonal into two triangles.
    caption: Account for every split corner-angle piece in the two triangles.
  answer:
    gradingMode: selfCheck
    expected: 'A diagonal partitions the convex quadrilateral into two triangles. The three angles of each triangle total $180^\circ$, so all angle pieces in the two triangles total $180^\circ+180^\circ=360^\circ$. At the diagonal endpoints, the two pieces recombine into the original quadrilateral angles, so the four interior angles total $360^\circ$.'
    keyPoints:
    - Draws or names one diagonal.
    - Identifies two triangles.
    - Adds two triangle-angle sums.
    - Explains that split endpoint angles recombine.
  explanation: The diagonal construction proves the formula from the triangle angle-sum theorem.
