questions:
- id: q001
  type: multipleChoice
  prompt: 'Three of the interior angles of a quadrilateral measure $85^\circ$, $110^\circ$, and $75^\circ$. What is the measure of the fourth angle?'
  difficultyDimensions:
  - Recall the sum of interior angles of a quadrilateral is $360^\circ$.
  - Calculate the sum of the three known angles: $85 + 110 + 75 = 270^\circ$.
  - Subtract from $360$: $360 - 270 = 90^\circ$.
  choices:
  - id: a
    text: '$90^\circ$'
  - id: b
    text: '$105^\circ$'
    issueSignals:
    - sum-calculation-error
  - id: c
    text: '$270^\circ$'
    issueSignals:
    - interior-exterior-confusion
  - id: d
    text: '$180^\circ$'
    issueSignals:
    - triangle-sum-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    The sum of the interior angles of any quadrilateral is $360^\circ$.
    Let $x$ be the fourth angle.
    $85^\circ + 110^\circ + 75^\circ + x = 360^\circ$
    $270^\circ + x = 360^\circ$
    $x = 90^\circ$.

    Why it works:
    Any quadrilateral can be split into two triangles by drawing a single diagonal. Since each triangle contains $180^\circ$, the total interior angle sum is $2 \times 180^\circ = 360^\circ$.

    Why the other choices fail:
    - $105^\circ$ is a subtraction error (e.g., $375 - 270$).
    - $270^\circ$ is the sum of the three known angles, not the missing angle.
    - $180^\circ$ incorrectly assumes the angles of a quadrilateral sum to something else, or is just a guess based on triangles.

- id: q002
  type: multipleChoice
  prompt: 'In parallelogram $PQRS$, the measure of angle $P$ is $62^\circ$. What is the measure of angle $Q$, which is consecutive (adjacent) to angle $P$?'
  difficultyDimensions:
  - Recall that consecutive angles in a parallelogram are supplementary.
  - Set up equation: $m\angle Q = 180 - 62$.
  - Calculate: $118^\circ$.
  choices:
  - id: a
    text: '$62^\circ$'
    issueSignals:
    - opposite-consecutive-confusion
  - id: b
    text: '$118^\circ$'
  - id: c
    text: '$28^\circ$'
    issueSignals:
    - complementary-confusion
  - id: d
    text: '$298^\circ$'
    issueSignals:
    - total-sum-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    In any parallelogram, consecutive angles (angles next to each other) are supplementary, meaning they add up to $180^\circ$.
    $m\angle P + m\angle Q = 180^\circ$
    $62^\circ + m\angle Q = 180^\circ$
    $m\angle Q = 118^\circ$.

    Why it works:
    Because opposite sides of a parallelogram are parallel, consecutive angles act as same-side interior angles cut by a transversal. Therefore, they must sum to $180^\circ$.

    Why the other choices fail:
    - $62^\circ$ would be the measure of angle $R$, the angle *opposite* to $P$.
    - $28^\circ$ incorrectly assumes the angles are complementary ($90 - 62$).
    - $298^\circ$ incorrectly subtracts from $360^\circ$ ($360 - 62$).

- id: q003
  type: multipleChoice
  prompt: 'Which of the following is ALWAYS a property of a rhombus, but NOT always a property of a rectangle?'
  difficultyDimensions:
  - Analyze properties of rhombi (all sides equal, diagonals perpendicular, diagonals bisect angles).
  - Analyze properties of rectangles (all angles $90^\circ$, diagonals are equal length).
  - Identify the distinguishing property (perpendicular diagonals).
  choices:
  - id: a
    text: 'The diagonals bisect each other.'
    issueSignals:
    - parallelogram-property-confusion
  - id: b
    text: 'The diagonals are perpendicular.'
  - id: c
    text: 'The diagonals are equal in length.'
    issueSignals:
    - rectangle-property-confusion
  - id: d
    text: 'Opposite angles are equal.'
    issueSignals:
    - parallelogram-property-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    Let's check each property:
    - Diagonals bisect each other: True for BOTH (since both are parallelograms).
    - Diagonals are equal in length: True for rectangles, but NOT necessarily true for rhombi.
    - Opposite angles are equal: True for BOTH (since both are parallelograms).
    - Diagonals are perpendicular: True for rhombi, but NOT necessarily true for rectangles.

    Why it works:
    A rhombus is defined by having 4 equal sides. This symmetry forces its diagonals to cross exactly at $90^\circ$. A rectangle is defined by having 4 equal angles ($90^\circ$), which forces its diagonals to be exactly the same length.

    Why the other choices fail:
    - The other choices are either shared properties (because both are parallelograms) or belong exclusively to the rectangle.

- id: q004
  type: multipleChoice
  prompt: 'A quadrilateral has exactly one pair of parallel sides. The non-parallel sides are equal in length. What is the most specific name for this shape?'
  difficultyDimensions:
  - Identify "exactly one pair of parallel sides" as a trapezoid.
  - Identify "non-parallel sides are equal" as isosceles.
  - Combine to form "isosceles trapezoid".
  choices:
  - id: a
    text: 'Parallelogram'
    issueSignals:
    - two-pairs-assumption
  - id: b
    text: 'Rhombus'
    issueSignals:
    - all-sides-assumption
  - id: c
    text: 'Isosceles Trapezoid'
  - id: d
    text: 'Kite'
    issueSignals:
    - adjacent-sides-assumption
  answer:
    choiceId: c
  explanation: |
    Solution:
    A quadrilateral with exactly one pair of parallel sides is a trapezoid. The parallel sides are called the bases, and the non-parallel sides are called the legs.
    Because the problem states the non-parallel sides (the legs) are equal in length, it is specifically an isosceles trapezoid.

    Why it works:
    This is the standard classification definition. It mirrors an isosceles triangle, where if you cut off the top of an isosceles triangle with a line parallel to the base, you are left with an isosceles trapezoid.

    Why the other choices fail:
    - A parallelogram has TWO pairs of parallel sides.
    - A rhombus has TWO pairs of parallel sides and all four sides are equal.
    - A kite has two pairs of equal adjacent sides, but NO pairs of parallel sides.

- id: q005
  type: multipleChoice
  prompt: 'In rectangle $ABCD$, the diagonals intersect at point $E$. If $AE = 3x + 2$ and $BD = 10x - 12$, what is the value of $x$?'
  difficultyDimensions:
  - Recall that diagonals of a rectangle are equal ($AC = BD$) and bisect each other (so $AC = 2 \cdot AE$).
  - Set up equation: $2(3x + 2) = 10x - 12$.
  - Solve for $x$: $6x + 4 = 10x - 12 \implies 4x = 16 \implies x = 4$.
  choices:
  - id: a
    text: '$4$'
  - id: b
    text: '$2$'
    issueSignals:
    - half-diagonal-error
  - id: c
    text: '$3.5$'
    issueSignals:
    - arithmetic-error
  - id: d
    text: '$7$'
    issueSignals:
    - algebra-sign-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    In a rectangle, the diagonals are equal in length ($AC = BD$) and they bisect each other (meaning they cut each other in half).
    Since $AE$ is half of diagonal $AC$, the full length of $AC$ is $2(3x + 2)$.
    Because $AC = BD$:
    $2(3x + 2) = 10x - 12$
    $6x + 4 = 10x - 12$
    Subtract $6x$ from both sides: $4 = 4x - 12$
    Add 12 to both sides: $16 = 4x$
    $x = 4$.

    Why it works:
    Always make sure the two segments you are equating actually represent the same thing. $AE$ is a half-diagonal, while $BD$ is a full diagonal. You must either double the half-diagonal or halve the full diagonal before setting them equal.

    Why the other choices fail:
    - $2$ comes from incorrectly setting the half-diagonal equal to the full diagonal: $3x + 2 = 10x - 12 \implies 7x = 14 \implies x = 2$.
    - $3.5$ might come from an arithmetic mistake.
    - $7$ might come from an algebraic sign error, like $10x + 6x$ instead of $10x - 6x$.
