schemaVersion: 1
id: calc2-series-fundamentals-hard-test
title: Series Fundamentals Hard Test
assessmentType: test
categoryId: calculus-2
topicId: series-fundamentals
skills:
- Recover terms and remainders from partial-sum data
- Apply Cauchy, tail, grouping, and linearity principles
- Distinguish boundedness, convergence, and absolute convergence
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - series-fundamentals
  - hard
  - partial-sums
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - recover-series-terms-from-partial-sums
  prompt: |
    A series has partial sums $S_n=3-2^{-n}$. What is $a_n$ for $n\ge2$?
  choices:
  - id: a
    text: $2^{-n}$
  - id: b
    text: $-2^{-n}$
  - id: c
    text: $3-2^{-n}$
  - id: d
    text: $2^{1-n}$
  answer:
    choiceId: a
  explanation: $a_n=S_n-S_{n-1}=(3-2^{-n})-(3-2^{1-n})=2^{-n}$.
- id: q002
  type: multipleChoice
  skills:
  - interpret-remainders
  prompt: |
    If $S_n=5-3/(n+2)$, what is the exact remainder $R_n=S-S_n$?
  choices:
  - id: a
    text: $3/(n+2)$
  - id: b
    text: $5-3/(n+2)$
  - id: c
    text: $3/n$
  - id: d
    text: $-3/(n+2)$
  answer:
    choiceId: a
  explanation: The partial sums approach five, so $R_n=5-[5-3/(n+2)]$.
- id: q003
  type: multipleChoice
  skills:
  - use-tail-invariance
  prompt: |
    A convergent series has its first ten terms replaced. What is guaranteed?
  choices:
  - id: a
    text: It still converges, but generally to a different sum.
  - id: b
    text: It diverges.
  - id: c
    text: Its sum is unchanged.
  - id: d
    text: It becomes absolutely convergent.
  answer:
    choiceId: a
  explanation: The unchanged tail converges; only the finite prefix contribution changes.
- id: q004
  type: multipleChoice
  skills:
  - apply-the-cauchy-criterion
  prompt: |
    Which property is equivalent to convergence of $\sum a_n$?
  choices:
  - id: a
    text: |-
      Every sufficiently late finite tail $\sum_{k=m}^{n}a_k$ has arbitrarily small magnitude.
  - id: b
    text: |-
      $a_n\to0$.
  - id: c
    text: The terms are bounded.
  - id: d
    text: Adjacent terms become arbitrarily close.
  answer:
    choiceId: a
  explanation: A finite tail equals the difference of two partial sums, so the statement is precisely
    their Cauchy criterion.
- id: q005
  type: multipleChoice
  skills:
  - evaluate-shifted-geometric-series
  prompt: |
    Evaluate $\sum_{n=3}^{\infty}5(2/3)^n$.
  choices:
  - id: a
    text: $40/9$
  - id: b
    text: $5$
  - id: c
    text: $10/9$
  - id: d
    text: $15$
  answer:
    choiceId: a
  explanation: The first included term is $5(8/27)=40/27$, and division by $1-2/3$ gives $40/9$.
- id: q006
  type: multipleChoice
  skills:
  - convert-repeating-decimals-to-series
  prompt: |
    What fraction equals $0.\overline{27}$?
  choices:
  - id: a
    text: $3/11$
  - id: b
    text: $27/100$
  - id: c
    text: $27/90$
  - id: d
    text: $2/7$
  answer:
    choiceId: a
  explanation: |-
    The series is $(27/100)\sum_{k=0}^{\infty}(1/100)^k=27/99=3/11$.
- id: q007
  type: multipleChoice
  skills:
  - evaluate-general-telescoping-series
  prompt: |
    If $b_n\to4$ and $b_1=9$, what is
    $\sum_{n=1}^{\infty}(b_n-b_{n+1})$?
  choices:
  - id: a
    text: $5$
  - id: b
    text: $13$
  - id: c
    text: $-5$
  - id: d
    text: $4$
  answer:
    choiceId: a
  explanation: The Nth partial sum is $b_1-b_{N+1}$, which approaches nine minus four.
- id: q008
  type: multipleChoice
  skills:
  - reason-about-bounded-partial-sums
  prompt: |
    Does boundedness of the partial sums guarantee series convergence?
  choices:
  - id: a
    text: |-
      No; $\sum(-1)^n$ has bounded oscillating partial sums.
  - id: b
    text: Yes, by monotone convergence.
  - id: c
    text: Yes, because bounded terms approach zero.
  - id: d
    text: No, but only for unbounded terms.
  answer:
    choiceId: a
  explanation: Bounded sequences need not have limits unless another property such as monotonicity is
    present.
- id: q009
  type: multipleChoice
  skills:
  - use-nonnegative-partial-sum-monotonicity
  prompt: |
    Suppose $a_n\ge0$ and all partial sums satisfy $S_n\le12$. What follows?
  choices:
  - id: a
    text: The series converges to a value at most $12$.
  - id: b
    text: The series diverges because terms are positive.
  - id: c
    text: The sum equals $12$ exactly.
  - id: d
    text: The terms are eventually zero.
  answer:
    choiceId: a
  explanation: Nonnegative terms make partial sums monotone increasing, and the upper bound gives convergence.
- id: q010
  type: multipleChoice
  skills:
  - apply-linearity-with-convergence-hypotheses
  prompt: |
    If $\sum a_n=A$ and $\sum b_n=B$ both converge, what is
    $\sum(a_n-b_n)$?
  choices:
  - id: a
    text: $A-B$
  - id: b
    text: $A+B$
  - id: c
    text: It must diverge.
  - id: d
    text: It equals zero.
  answer:
    choiceId: a
  explanation: Finite partial-sum linearity passes to the two existing limits.
- id: q011
  type: multipleChoice
  skills:
  - distinguish-grouping-and-rearrangement
  prompt: |
    A convergent series is grouped into finite consecutive blocks without
    changing order. What is guaranteed?
  choices:
  - id: a
    text: The grouped series has the same sum.
  - id: b
    text: It becomes absolutely convergent.
  - id: c
    text: Its sum can become arbitrary.
  - id: d
    text: It must diverge.
  answer:
    choiceId: a
  explanation: Group-boundary partial sums form a subsequence of the original convergent partial sums.
- id: q012
  type: multipleChoice
  skills:
  - analyze-combinations-of-divergent-series
  prompt: |
    Two series $\sum a_n$ and $\sum b_n$ both diverge. Must
    $\sum(a_n-b_n)$ diverge?
  choices:
  - id: a
    text: No; taking $a_n=b_n=1/n$ makes the difference series zero.
  - id: b
    text: Yes, divergence is preserved by subtraction.
  - id: c
    text: Yes, unless terms alternate.
  - id: d
    text: No, because every difference series converges.
  answer:
    choiceId: a
  explanation: Divergent component sums cannot be subtracted as infinities, while termwise cancellation
    may be exact.
- id: q013
  type: multipleChoice
  skills:
  - interpret-index-shifts
  prompt: |
    If $\sum_{n=0}^{\infty}a_n=S$, what is
    $\sum_{n=1}^{\infty}a_n$?
  choices:
  - id: a
    text: $S-a_0$
  - id: b
    text: $S-a_1$
  - id: c
    text: $S$
  - id: d
    text: $S+a_0$
  answer:
    choiceId: a
  explanation: Removing the initial finite term subtracts exactly $a_0$ from the total.
- id: q014
  type: multipleChoice
  skills:
  - derive-terms-from-remainders
  prompt: |
    If $R_n=\sum_{k=n+1}^{\infty}a_k$, which identity is correct?
  choices:
  - id: a
    text: $a_{n+1}=R_n-R_{n+1}$
  - id: b
    text: $a_{n+1}=R_{n+1}-R_n$
  - id: c
    text: $a_n=R_n$
  - id: d
    text: $R_n+R_{n+1}=0$
  answer:
    choiceId: a
  explanation: The tail R_n consists of the first omitted term plus the next tail.
- id: q015
  type: multipleChoice
  skills:
  - use-absolute-convergence-for-tail-control
  prompt: |
    If $\sum|a_n|$ converges, why must $\sum a_n$ satisfy the Cauchy
    criterion?
  choices:
  - id: a
    text: Every signed tail is bounded in magnitude by the corresponding absolute tail.
  - id: b
    text: Every term is positive.
  - id: c
    text: The partial sums are constant.
  - id: d
    text: Absolute convergence makes all terms zero eventually.
  answer:
    choiceId: a
  explanation: |-
    The triangle inequality gives $|\sum_{k=m}^{n}a_k|\le\sum_{k=m}^{n}|a_k|$, and absolute tails become arbitrarily small.
