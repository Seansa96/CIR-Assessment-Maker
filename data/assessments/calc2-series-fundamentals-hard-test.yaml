  prompt: |
    A series has partial sums $S_n=3-2^{-n}$. What is $a_n$ for $n\ge2$?
  choices:
  - id: a
    text: $2^{-n}$
  - id: b
    text: $-2^{-n}$
  - id: c
    text: $3-2^{-n}$
  - id: d
    text: $2^{1-n}$
  answer:
    choiceId: a
  explanation: |-
    Solution: $a_n=S_n-S_{n-1}=(3-2^{-n})-(3-2^{1-n})=2^{-n}$. Therefore the answer is $2^{-n}$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $-2^{-n}$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $3-2^{-n}$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $2^{1-n}$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
