items:
- {id: speeds-r1, type: cloze, prompt: 'In a fluid, $v={{\sqrt{B/\rho}}}$.', answer: '\sqrt{B/\rho}', explanation: 'Solution: Use $v=\sqrt{B/\rho}$. Why it works: stiffness increases speed while density increases inertia.'}
- {id: speeds-r2, type: typed, prompt: 'Does sound speed in an ideal gas depend on frequency?', answer: no, explanation: 'Solution: No. Why it works: medium properties and temperature set the ideal-gas sound speed.'}
- {id: speeds-r3, type: cloze, prompt: 'Ideal-gas sound speed uses absolute temperature in {{kelvin}}.', answer: kelvin, explanation: 'Solution: Use kelvin. Why it works: the thermodynamic square-root formula requires absolute temperature.'}
- {id: speeds-r4, type: typed, prompt: 'What is the approximate sound speed in air at 20 degrees Celsius in m/s?', answer: 343, explanation: 'Solution: About $343\ \text{m/s}$. Why it works: $331+0.6(20)=343$.'}
- {id: speeds-r5, type: cloze, prompt: 'For air, $v\approx{{331+0.6T_C}}$ in m/s.', answer: '331+0.6T_C', explanation: 'Solution: Use the Celsius approximation. Why it works: it approximates the ideal-gas temperature dependence near ordinary conditions.'}
- {id: speeds-r6, type: typed, prompt: 'In what state of matter does sound generally travel fastest?', answer: solids, explanation: 'Solution: In solids. Why it works: their high stiffness typically outweighs their increased density.'}
