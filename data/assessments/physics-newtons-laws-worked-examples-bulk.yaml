workedExamples:
- id: we-newton-1
  title: Deriving Force from Momentum
  problem: By definition, force is the rate of change of momentum. Derive $F=ma$ starting
    from $F = \frac{dp}{dt}$ for a constant mass.
  steps:
  - id: step-we-newton-1-1
    title: Momentum definition
    instruction: What is momentum?
    type: symbolicResponse
    prompt: Enter the formula for momentum $p$.
    answer:
      gradingMode: auto
      expectedLatex: mv
      equivalenceMode: expression
      tolerance: 0
    explanation: |-
      Solution:
      Momentum is defined as the product of mass and velocity: $p=mv$.

      Why it works:
      This definition connects the rate-of-change form of Newton's second law to a quantity whose time derivative can be evaluated.
  - id: step-we-newton-1-2
    title: Derivative
    instruction: Differentiate with respect to time.
    type: symbolicResponse
    prompt: Evaluate $\frac{d}{dt}(mv)$ assuming $m$ is constant.
    answer:
      gradingMode: auto
      aliases:
      - ma
      expectedLatex: m\frac{dv}{dt}
      equivalenceMode: expression
      tolerance: 0
    explanation: |-
      Solution:
      Because mass is constant, $\frac{d}{dt}(mv)=m\frac{dv}{dt}=ma$.

      Why it works:
      A constant factor may be taken outside a derivative, and $dv/dt$ is acceleration. Thus $F=dp/dt$ reduces to $F=ma$ for constant mass.
- id: newton-laws-bulk-we002
  title: Net Force From Perpendicular Components
  problem: |-
    A $4.0\ \text{kg}$ cart experiences forces of $12\ \text{N}$ east and $5\ \text{N}$ north. Determine the magnitude and direction of its acceleration.
  steps:
  - id: newton-laws-bulk-we002-step-1
    title: Find the net-force magnitude
    type: numericResponse
    prompt: What is the magnitude of the net force in newtons?
    answer:
      value: 13
      tolerance: 0.01
    explanation: |-
      Solution:
      Perpendicular components give $F_{net}=\sqrt{12^2+5^2}=13\ \text{N}$.

      Why it works:
      The east and north forces are perpendicular vector components, so their resultant magnitude follows the Pythagorean theorem.
  - id: newton-laws-bulk-we002-step-2
    title: Apply Newton's second law
    type: numericResponse
    prompt: What is the magnitude of the cart's acceleration in $\text{m/s}^2$?
    answer:
      value: 3.25
      tolerance: 0.01
    explanation: |-
      Solution:
      Use $a=F_{net}/m=13/4.0=3.25\ \text{m/s}^2$; its direction is $\tan^{-1}(5/12)=22.6^\circ$ north of east.

      Why it works:
      Acceleration points in the direction of the net force, and Newton's second law scales that vector by the inverse of the mass.
