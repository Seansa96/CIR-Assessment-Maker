title: Newton's Laws Worked Examples (Bulk)
assessmentType: workedExample
categoryId: physics-1
workedExamples:
- id: we-newton-1
  title: Deriving Force from Momentum
  problem: By definition, force is the rate of change of momentum. Derive $F=ma$ starting
    from $F = \frac{dp}{dt}$ for a constant mass.
  steps:
  - id: step-we-newton-1-1
    title: Momentum definition
    instruction: What is momentum?
    type: symbolicResponse
    prompt: Enter the formula for momentum $p$.
    answer:
      gradingMode: auto
      expectedLatex: mv
      equivalenceMode: expression
      tolerance: 0
  - id: step-we-newton-1-2
    title: Derivative
    instruction: Differentiate with respect to time.
    type: symbolicResponse
    prompt: Evaluate $\frac{d}{dt}(mv)$ assuming $m$ is constant.
    answer:
      gradingMode: auto
      aliases:
      - ma
      expectedLatex: m\frac{dv}{dt}
      equivalenceMode: expression
      tolerance: 0
    explanation: $\frac{d}{dt}(mv) = m\frac{dv}{dt} = ma$.
