workedExamples:
- id: we-doppler-effect
  title: Deriving and applying The Doppler Effect
  problem: Use the labeled model to derive and calculate the observed frequency from $f'=f(v+v_o)/(v-v_s)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the speeds of the source, observer, and the speed of sound in the medium.
    prompt: 'Identify the velocities.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Speeds v, v_s, v_o'
    explanation: >-
      Extract $v$, $v_s$, and $v_o$ from the problem text.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the direction of motion relative to each other to determine the signs in the equation.
    prompt: 'Determine the signs.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Toward (+) or Away (-)'
    explanation: >-
      Identify if the source and observer are moving toward or away from each other.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want the frequency heard by the observer.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Observed frequency f_o'
    explanation: >-
      We are solving for $f_o$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the general Doppler effect equation.
    prompt: 'Write the equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_o = f_s (v \pm v_o) / (v \mp v_s)'
    explanation: >-
      $f_o = f_s \left( \frac{v \pm v_o}{v \mp v_s} \right)$
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate $f_o$ and insert the correct signs for an observer moving toward a stationary source.
    prompt: 'Set up the signs.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_o = f_s (v + v_o) / v'
    explanation: >-
      Observer moves toward (use $+v_o$), source is stationary ($v_s = 0$). So, $f_o = f_s \left( \frac{v + v_o}{v} \right)$.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $f_s = 500$ Hz, $v = 340$ m/s, and $v_o = 34$ m/s, calculate $f_o$.
    prompt: 'Calculate $f_o$.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      value: 340.0
      tolerance: 3.4
    explanation: >-
      $f_o = 500 \left( \frac{340 + 34}{340} \right) = 500 \left( \frac{374}{340} \right) = 500(1.1) = 550$ Hz.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check if the result makes physical sense.
    prompt: 'Does the frequency increase as expected?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Yes, frequency increased.'
    explanation: >-
      Motion toward the source must increase the observed frequency. $550$ Hz > $500$ Hz, so it is logically sound.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated observed frequency.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      value: 340.0
      tolerance: 3.4
    explanation: >-
      The observed frequency is $550$ Hz.
