- id: we-doppler-effect
  title: Deriving and applying The Doppler Effect
  problem: Use the labeled model to derive and calculate the observed frequency from $f'=f(v+v_o)/(v-v_s)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the speeds of the source, observer, and the speed of sound in the medium.
    prompt: 'Identify the velocities.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$v$', '$v_s$', '$v_o$']
    explanation: |
      Solution: Identify the medium speed $v$, source speed $v_s$, and observer speed $v_o$.

      Why it works: These variables determine the wavelength and wavefront-encounter rate in the Doppler model.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the direction of motion relative to each other to determine the signs in the equation.
    prompt: 'Determine the signs.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: [toward, away, sign convention]
    explanation: |
      Solution: Determine whether each motion is toward or away before selecting the signs.

      Why it works: Direction decides whether wavefront spacing or encounter rate increases or decreases.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want the frequency heard by the observer.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$f_o$', observed frequency]
    explanation: |
      Solution: The target is the observed frequency $f_o$.

      Why it works: The problem asks for the frequency heard by the observer, not the emitted frequency.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the general Doppler effect equation.
    prompt: 'Write the equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$f_o=f_s(v\pm v_o)/(v\mp v_s)$']
    explanation: |
      Solution: Use $f_o=f_s(v\pm v_o)/(v\mp v_s)$.

      Why it works: Observer motion changes the numerator and source motion changes the wavelength-related denominator.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate $f_o$ and insert the correct signs for an observer moving toward a stationary source.
    prompt: 'Set up the signs.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: ['$f_o=f_s(v+v_o)/v$', '$v_s=0$']
    explanation: |
      Solution: With the observer approaching and source stationary, use $f_o=f_s(v+v_o)/v$.

      Why it works: Approaching observer motion increases the wavefront encounter rate, while $v_s=0$ removes the source-speed term.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $f_s = 500$ Hz, $v = 340$ m/s, and $v_o = 34$ m/s, calculate $f_o$.
    prompt: 'Calculate $f_o$.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      value: 550.0
      tolerance: 2.0
    explanation: |
      Solution: $f_o=500[(340+34)/340]=500(1.1)=550$ Hz.

      Why it works: The approaching observer encounters wavefronts 10% more frequently than a stationary observer.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check if the result makes physical sense.
    prompt: 'Does the frequency increase as expected?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints: [yes, '550 Hz is greater than 500 Hz']
    explanation: |
      Solution: Yes; $550$ Hz is greater than the emitted $500$ Hz.

      Why it works: Approaching the source raises observed frequency, so the direction and numerical result agree.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated observed frequency.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/doppler-effect.svg
      alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
      caption: The Doppler Effect model diagram.
    answer:
      value: 550.0
      tolerance: 2.0
    explanation: |
      Solution: The observed frequency is $550$ Hz.

      Why it works: It follows from the correctly signed moving-observer Doppler relation evaluated in the preceding step.
- id: doppler-source-we002
  title: Moving Source Toward a Stationary Listener
  problem: A $600\ \text{Hz}$ siren moves toward a stationary listener at $20\ \text{m/s}$. Take the speed of sound as $340\ \text{m/s}$. Find the observed frequency.
  steps:
  - id: doppler-source-we002-step-1
    title: Choose the moving-source relation
    instruction: Select the Doppler equation for a moving source approaching a stationary observer.
    type: symbolicResponse
    prompt: Write the observed-frequency relation for a stationary observer and approaching source.
    answer: {expectedLatex: 'f_o=f_s\frac{v}{v-v_s}', equivalenceMode: expression, tolerance: 0}
    explanation: 'Solution: Use $f_o=f_s v/(v-v_s)$. Why it works: an approaching source shortens the wavelength, producing a smaller denominator and a higher observed frequency.'
  - id: doppler-source-we002-step-2
    title: Calculate the observed frequency
    instruction: Substitute the emitted frequency, sound speed, and source speed into the Doppler relation.
    type: numericResponse
    prompt: Calculate the observed frequency in hertz.
    answer: {value: 637.5, tolerance: 0.5}
    explanation: 'Solution: $f_o=600(340)/(340-20)=637.5\ \text{Hz}$. Why it works: the source moves toward the listener, so the result must exceed the emitted $600\ \text{Hz}$.'
