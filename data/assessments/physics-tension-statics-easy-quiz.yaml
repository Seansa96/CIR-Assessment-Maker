- prompt: A 20 kg chandelier hangs from a single vertical cable. Using $g = 9.8\text{
    m/s}^2$, what is the tension in the cable (in N)?
  type: numericResponse
  answer:
    value: 196.0
    tolerance: 0.5
  explanation: Since it is at rest, $T = mg = 20(9.8) = 196.0$ N.
