questions:
  - id: t-easy-q01
    title: Single Vertical String
    type: numericResponse
    prompt: |
      A 20 kg chandelier hangs at rest from a single vertical cable attached to the ceiling. Using $g = 9.8\text{ m/s}^2$, what is the tension in the cable (in Newtons)?
    answer:
      value: 196.0
      tolerance: 1.0
    explanation: |
      Since the chandelier is at rest, the acceleration is zero. Newton's second law gives:
      $$T - mg = 0 \implies T = mg = 20(9.8) = 196\text{ N}$$
      The cable must exactly support the chandelier's weight. The tension equals the weight — no more, no less.

  - id: t-easy-q02
    title: Tension While Lifting Upward
    type: numericResponse
    prompt: |
      A rope is used to lift a 50 kg box upward with an acceleration of $2.3\text{ m/s}^2$. Using $g = 9.8\text{ m/s}^2$, what is the tension in the rope (in Newtons)?
    answer:
      value: 605.0
      tolerance: 1.0
    explanation: |
      Taking upward as positive, Newton's second law for the box:
      $$T - mg = ma \implies T = m(g + a) = 50(9.8 + 2.3) = 50(12.1) = 605\text{ N}$$
      The tension must support the weight ($490\text{ N}$) **and** provide the extra $ma = 50(2.3) = 115\text{ N}$ upward push. Both contributions are upward, so they add.

  - id: t-easy-q03
    title: Tension While Descending
    type: numericResponse
    prompt: |
      The same 50 kg box is now being **lowered slowly** with a downward acceleration of $0.75\text{ m/s}^2$. Using $g = 9.8\text{ m/s}^2$, what is the tension in the rope (in Newtons)?
    answer:
      value: 452.5
      tolerance: 1.0
    explanation: |
      With upward as positive, the box has $a_y = -0.75\text{ m/s}^2$ (downward):
      $$T - mg = m(-0.75) \implies T = m(g - 0.75) = 50(9.8 - 0.75) = 50(9.05) = 452.5\text{ N}$$
      The tension is **less** than the weight ($490\text{ N}$) because gravity partially drives the downward acceleration. The rope doesn't need to pull as hard.

  - id: t-easy-q04
    title: Two Strings — Complementary Angles
    type: numericResponse
    prompt: |
      A 6 kg mass hangs from a knot supported by two strings.
      - String 1 makes $\theta_1 = 40°$ above horizontal on the left.
      - String 2 makes $\theta_2 = 50°$ above horizontal on the right.

      Using $g = 9.8\text{ m/s}^2$ and the formula $T_2 = \dfrac{mg\cos\theta_1}{\sin(\theta_1+\theta_2)}$, what is $T_2$ (the tension in the 50° string) in Newtons? Round to one decimal place.

      ![Two-string static equilibrium](/C:/Users/SeanS/.gemini/antigravity-ide/brain/0c2da531-34dd-4854-a79c-4be0015d19b7/hanging_mass_2d_tension_diagram_1782669640115.png)
    answer:
      value: 45.0
      tolerance: 0.5
    explanation: |
      Since $\theta_1 + \theta_2 = 40° + 50° = 90°$, we get $\sin(90°) = 1$. The formula simplifies beautifully:
      $$T_2 = mg\cos\theta_1 = 6(9.8)\cos 40° = 58.8(0.766) = 45.0\text{ N}$$
      When the two angles add to $90°$, the tensions simply become $T_1 = mg\cos\theta_2$ and $T_2 = mg\cos\theta_1$.

  - id: t-easy-q05
    title: Symmetric Two-String Suspension
    type: numericResponse
    prompt: |
      A 12 kg decorative sign hangs symmetrically from two strings, each making an angle of $45°$ above the horizontal. Using $g = 9.8\text{ m/s}^2$, what is the tension in each string (in Newtons)? Round to one decimal place.
    answer:
      value: 83.1
      tolerance: 0.5
    explanation: |
      By symmetry, both strings have equal tension $T$. The vertical equilibrium equation:
      $$2T\sin 45° = mg \implies T = \frac{mg}{2\sin 45°} = \frac{12(9.8)}{2(0.7071)} = \frac{117.6}{1.4142} \approx 83.1\text{ N}$$
      Each string provides half the vertical support. The $\sin 45° = \sqrt{2}/2$ appears because only the vertical component of each tension contributes to supporting the weight.

  - id: t-easy-q06
    title: Wall-Attached String
    type: numericResponse
    prompt: |
      A 5 kg painting is hung by two strings at a knot. One string runs **horizontally** to a hook on the wall. The second string connects to the ceiling at $\theta_2 = 60°$ above horizontal. Using $g = 9.8\text{ m/s}^2$, what is the tension in the **wall string** (in Newtons)? Round to one decimal place.
    answer:
      value: 28.3
      tolerance: 0.5
    explanation: |
      The wall string is horizontal ($\theta_1 = 0°$) and can contribute **no vertical force**. So the ceiling string alone must support the full weight vertically:
      $$T_{\text{ceiling}}\sin 60° = mg \implies T_{\text{ceiling}} = \frac{5(9.8)}{0.866} = 56.6\text{ N}$$
      The horizontal balance then gives the wall string:
      $$T_{\text{wall}} = T_{\text{ceiling}}\cos 60° = 56.6(0.5) = 28.3\text{ N}$$
      Alternatively, $T_{\text{wall}} = mg\cot 60° = mg/\sqrt{3} \approx 28.3\text{ N}$.

  - id: t-easy-q07
    title: 'Conceptual: Why Does Upward Acceleration Increase Tension?'
    type: multipleChoice
    prompt: |
      A box hangs from a rope. When the rope is used to accelerate the box **upward**, the tension in the rope is greater than the box's weight. Which of the following correctly explains why?
    choices:
      - id: a
        text: 'The weight of the box increases because gravity becomes stronger when the box moves upward.'
      - id: b
        text: 'The rope must provide two things simultaneously: enough force to cancel gravity ($mg$ upward) AND an additional net upward force ($ma$) to accelerate the box. These requirements add together.'
      - id: c
        text: 'The tension equals the weight times the acceleration, so more acceleration always means more tension regardless of direction.'
      - id: d
        text: 'Kinetic energy stored in the rope increases its tension during upward motion.'
    answer:
      choiceId: b
    explanation: |
      Newton's second law: $T - mg = ma$ (upward positive). Rearranging: $T = mg + ma$.

      The two terms have a clear physical meaning:
      - $mg$: the force needed to counteract gravity and prevent free fall.
      - $ma$: the additional force needed to produce the upward acceleration on top of zero.

      Both require upward rope force, so they add. The rope must do both jobs at once.

  - id: t-easy-q08
    title: 'Conceptual: What Happens as Strings Become More Horizontal?'
    type: multipleChoice
    prompt: |
      Two strings support a hanging mass. You slowly rotate both strings to make them more and more horizontal (decreasing both angles toward $0°$) while keeping the mass constant. What happens to the tension in each string?
    choices:
      - id: a
        text: 'Tension decreases because the strings are getting longer.'
      - id: b
        text: 'Tension stays the same since the mass has not changed.'
      - id: c
        text: 'Tension increases without bound — approaching infinity as the strings become perfectly horizontal.'
      - id: d
        text: 'Tension decreases because horizontal strings are more efficient at supporting weight.'
    answer:
      choiceId: c
    explanation: |
      For a symmetric setup, $T = mg/(2\sin\theta)$. As $\theta \to 0°$, $\sin\theta \to 0$, so $T \to \infty$.

      The reason: a nearly horizontal string has a tiny vertical component. Even if the string tension is enormous, only a fraction ($T\sin\theta$) acts upward to support the weight. To keep $T\sin\theta = mg/2$ constant as $\sin\theta \to 0$, the tension $T$ must grow without limit.

      **Practical consequence:** This is why cables, power lines, and bridges must sag — a perfectly taut horizontal cable could never support any load, regardless of how strong the material is.

  - id: t-easy-q09
    title: 'Conceptual: Which String Has Greater Tension?'
    type: multipleChoice
    prompt: |
      A mass $m$ hangs from a knot. **String 1** makes $\theta_1 = 30°$ above horizontal on the left. **String 2** makes $\theta_2 = 60°$ above horizontal on the right. Which string has greater tension, and why?

      ![Two-string static equilibrium](/C:/Users/SeanS/.gemini/antigravity-ide/brain/0c2da531-34dd-4854-a79c-4be0015d19b7/hanging_mass_2d_tension_diagram_1782669640115.png)
    choices:
      - id: a
        text: 'String 1 ($30°$), because the shallower angle requires a much larger horizontal force to maintain balance.'
      - id: b
        text: 'String 2 ($60°$), because $T_2 = mg\cos\theta_1/\sin(\theta_1+\theta_2)$ and $\cos 30° > \cos 60°$.'
      - id: c
        text: 'They are equal since both strings share the load and the knot is in equilibrium.'
      - id: d
        text: 'String 1 ($30°$), because it must compensate for String 2 being too steep to provide much horizontal force.'
    answer:
      choiceId: b
    explanation: |
      Using $\sin(\theta_1+\theta_2) = \sin(90°) = 1$:
      $$T_1 = mg\cos\theta_2 = mg\cos 60° = 0.5\,mg$$
      $$T_2 = mg\cos\theta_1 = mg\cos 30° \approx 0.866\,mg$$

      **String 2 (the steeper one) carries more tension.** Note the cross-over: $T_1$ depends on $\cos\theta_2$ (the OTHER string's angle). The steeper string is more efficient at providing vertical support, so it takes on a larger share of the load. The shallower string primarily provides horizontal balance.

  - id: t-easy-q10
    title: 'Conceptual: Tension During Free Fall'
    type: multipleChoice
    prompt: |
      A 10 kg box is attached to a rope. The box and the rope are both in **free fall** (the rope is attached above, but the support above has released — everything is falling freely). What is the tension in the rope?
    choices:
      - id: a
        text: '$mg = 98\text{ N}$ — the rope still carries the full weight of the box.'
      - id: b
        text: '$mg/2 = 49\text{ N}$ — the rope shares the load with gravity.'
      - id: c
        text: '$0\text{ N}$ — there is no tension in the rope during free fall.'
      - id: d
        text: '$2mg = 196\text{ N}$ — the tension doubles to decelerate the fall.'
    answer:
      choiceId: c
    explanation: |
      In free fall, the entire system (box + rope) accelerates downward at $g$. Taking upward as positive, $a_y = -g$:
      $$T - mg = ma_y = m(-g) \implies T = mg - mg = 0$$

      The tension is zero. Physically: the rope and the box are falling at the same rate with the same acceleration. There is no relative pulling force between them — the rope is completely slack. This is the principle of weightlessness: in free fall (and in orbit!), all apparent tension and normal forces vanish.

  - id: t-easy-q11
    title: 'Conceptual: Constant Velocity Lowering'
    type: multipleChoice
    prompt: |
      A crane operator lowers a 500 kg steel beam at a **constant velocity** (no acceleration). What is the tension in the crane's cable? Use $g = 9.8\text{ m/s}^2$.
    choices:
      - id: a
        text: '0 N — since the beam is moving downward, the cable must be slack.'
      - id: b
        text: '$4900\text{ N}$ — equal to the beam''s weight, since constant velocity means zero net force.'
      - id: c
        text: 'Greater than $4900\text{ N}$ — the cable must fight gravity to keep it from accelerating.'
      - id: d
        text: 'Less than $4900\text{ N}$ — since the beam is moving, gravity does the work, not the cable.'
    answer:
      choiceId: b
    explanation: |
      Constant velocity means zero acceleration ($a = 0$). From $T - mg = ma = 0$:
      $$T = mg = 500(9.8) = 4900\text{ N}$$

      This is Newton's first law in action: an object moving at constant velocity has zero net force. The cable tension exactly balances the weight, even though the beam is in motion. **Direction of motion does not affect the equilibrium equation** — only the acceleration does.

  - id: t-easy-q12
    title: 'Conceptual: Explain the Sign of Acceleration'
    type: freeResponse
    prompt: |
      A 30 kg crate hangs from a rope. Describe in your own words what tension you would expect in each of the following three scenarios, and explain **why** in each case the tension is greater than, less than, or equal to the weight $mg = 294\text{ N}$:

      (a) The crate is being accelerated **upward** at $3\text{ m/s}^2$.
      (b) The crate is hanging **at rest** (not moving at all).
      (c) The crate is being **lowered** at an accelerating rate of $1.5\text{ m/s}^2$ downward.
    answer:
      gradingMode: selfCheck
      keyPoints:
        - '(a) T = m(g+a) = 30(9.8+3) = 30(12.8) = 384 N > mg. The rope must support gravity AND provide extra upward push to accelerate the crate.'
        - '(b) T = mg = 294 N. Zero acceleration means zero net force, so tension exactly equals weight.'
        - '(c) T = m(g-a) = 30(9.8-1.5) = 30(8.3) = 249 N < mg. Gravity partially drives the downward acceleration, so the rope does not need to work as hard. The net downward force mg - T = ma provides the downward acceleration.'
        - 'In all three cases, the single formula T - mg = ma_y handles everything. The sign of a_y (positive up, negative down) automatically produces the correct result.'
    explanation: |
      (a) $T = m(g+a) = 30(12.8) = 384\text{ N}$ — greater than weight.
      (b) $T = mg = 294\text{ N}$ — equal to weight.
      (c) $T = m(g-a) = 30(8.3) = 249\text{ N}$ — less than weight.

      The master equation $T - mg = ma_y$ handles all three with one formula. The physical story: whenever the net force needs to be upward (accelerating up or decelerating downward), tension exceeds weight. When net force is downward (decelerating upward or accelerating down), tension is less than weight.
