questions:
  - id: q1
    type: multipleChoice
    prompt: 'Which equation correctly balances $MnO_4^-+Fe^{2+}\rightarrow Mn^{2+}+Fe^{3+}$ in acidic solution?'
    choices:
      - { id: a, text: '$MnO_4^-+8H^++5Fe^{2+}\rightarrow Mn^{2+}+4H_2O+5Fe^{3+}$', issueSignals: [] }
      - { id: b, text: '$MnO_4^-+4H^++Fe^{2+}\rightarrow Mn^{2+}+2H_2O+Fe^{3+}$', issueSignals: [{ id: chemistry-electrochem-electron-balance-error }] }
      - { id: c, text: '$MnO_4^-+8H^++5Fe^{3+}\rightarrow Mn^{2+}+4H_2O+5Fe^{2+}$', issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. It conserves Mn, O, H, Fe, and charge +17 on both sides. Why it works: Five iron oxidation electrons cancel the five required by permanganate reduction. Why the other choices fail: b does not balance atoms or electron transfer; c reverses the iron half-reaction.'
    difficultyDimensions: [massBalance, chargeBalance, mediumSelection]
    difficultyEvidence: 'Audits atoms, charge, and acidic-medium species simultaneously.'
    prerequisiteObjectiveIds: [chemistry-reactions]
    extensionObjectiveIds: [chem-electrochem-cells]
    issueSignals: [{ id: chemistry-electrochem-electron-balance-error }, { id: chemistry-electrochem-oxidation-reduction-reversed }]
  - id: q2
    type: selectAll
    prompt: 'For $2Al+3Cu^{2+}\rightarrow2Al^{3+}+3Cu$, select every correct statement.'
    choices:
      - { id: a, text: 'Al is oxidized.', issueSignals: [] }
      - { id: b, text: '$Cu^{2+}$ is the oxidizing agent.', issueSignals: [] }
      - { id: c, text: 'Al is the oxidizing agent.', issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }] }
      - { id: d, text: '$Cu^{2+}$ loses electrons.', issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }] }
    answer: { choiceIds: [a, b] }
    explanation: 'Solution: Select a and b. Al loses six total electrons and $Cu^{2+}$ gains them. Why it works: The electron donor is oxidized and is the reducing agent; the acceptor is reduced and is the oxidizing agent. Why the other choices fail: c assigns the opposite agent role; d reverses the copper electron change.'
    difficultyDimensions: [oxidationState, electronTransfer, agentClassification]
    difficultyEvidence: 'Tracks both species through oxidation-number and agent-role changes.'
    prerequisiteObjectiveIds: [chemistry-reactions]
    extensionObjectiveIds: [chem-electrochem-cells]
    issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }]
  - id: q3
    type: multipleChoice
    prompt: 'A galvanic cell oxidizes Fe to $Fe^{2+}$ and reduces $Ag^+$ to Ag. Which notation and electron direction are correct?'
    media: [{ type: image, src: /media/chemistry/electrochemistry-galvanic-cell.svg, alt: Generic galvanic cell with anode left, cathode right, and electron flow through the wire., caption: Translate reaction roles into notation and flow. }]
    choices:
      - { id: a, text: '$Fe|Fe^{2+}||Ag^+|Ag$; electrons flow Fe to Ag', issueSignals: [] }
      - { id: b, text: '$Ag|Ag^+||Fe^{2+}|Fe$; electrons flow Fe to Ag', issueSignals: [{ id: chemistry-electrochem-cell-notation-error }] }
      - { id: c, text: '$Fe|Fe^{2+}||Ag^+|Ag$; electrons flow Ag to Fe', issueSignals: [{ id: chemistry-electrochem-flow-direction-reversed }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. Fe oxidation belongs on the left and Ag reduction on the right; electrons leave Fe. Why it works: Conventional notation runs anode-to-cathode from left to right. Why the other choices fail: b reverses half-cell order; c reverses electron flow.'
    difficultyDimensions: [cellNotation, electrodeAssignment, directionReasoning]
    difficultyEvidence: 'Combines a net reaction, symbolic notation, and circuit direction.'
    prerequisiteObjectiveIds: [chem-electrochem-redox]
    extensionObjectiveIds: [chem-electrochem-potential]
    issueSignals: [{ id: chemistry-electrochem-cell-notation-error }, { id: chemistry-electrochem-flow-direction-reversed }]
  - id: q4
    type: numericResponse
    prompt: 'A standard cell reduces $Br_2$ at the cathode, $E^\circ_{red}=+1.07\ \mathrm{V}$, and oxidizes $Fe^{2+}$ using the $Fe^{3+}/Fe^{2+}$ reduction potential $+0.77\ \mathrm{V}$. Find $E^\circ_{cell}$ in volts.'
    answer: { value: 0.30, tolerance: 0.002 }
    explanation: 'Solution: $E^\circ_{cell}=1.07-0.77=0.30\ \mathrm{V}$. Why it works: Use cathode reduction potential minus the listed anode reduction potential.'
    difficultyDimensions: [electrodeSelection, formulaApplication, signInterpretation]
    difficultyEvidence: 'Uses a reduction table for an oxidation half-cell without manually negating twice.'
    prerequisiteObjectiveIds: [chem-electrochem-cells]
    extensionObjectiveIds: [chem-electrochem-nonstandard]
    issueSignals: [{ id: chemistry-electrochem-potential-calculation-error }]
  - id: q5
    type: numericResponse
    prompt: 'For a reaction transferring $n=2$ electrons with $E^\circ_{cell}=0.460\ \mathrm{V}$, calculate $\Delta G^\circ$ in $\mathrm{kJ\,mol^{-1}}$. Use $F=96485\ \mathrm{C\,mol^{-1}}$.'
    answer: { value: -88.8, tolerance: 0.2 }
    explanation: 'Solution: $\Delta G^\circ=-nFE^\circ=-(2)(96485)(0.460)=-88766\ \mathrm{J\,mol^{-1}}=-88.8\ \mathrm{kJ\,mol^{-1}}$. Why it works: Positive cell potential corresponds to negative free energy for the reaction as written.'
    difficultyDimensions: [electronCount, energyConversion, unitConversion]
    difficultyEvidence: 'Combines electron stoichiometry, electrochemical work, sign, and joule conversion.'
    prerequisiteObjectiveIds: [chem-electrochem-redox]
    extensionObjectiveIds: [chemistry-equilibrium]
    issueSignals: [{ id: chemistry-electrochem-spontaneity-sign-error }]
  - id: q6
    type: numericResponse
    prompt: 'At 25 C, a cell has $E^\circ=1.100\ \mathrm{V}$, $n=2$, and $Q=100$. Use $E=E^\circ-(0.05916/n)\log Q$ to find E in volts.'
    answer: { value: 1.041, tolerance: 0.002 }
    explanation: 'Solution: $\log(100)=2$, so $E=1.100-(0.05916/2)(2)=1.04084\ \mathrm{V}\approx1.041\ \mathrm{V}$. Why it works: A product-heavy Q greater than one lowers the forward cell potential.'
    difficultyDimensions: [quotientConstruction, logarithm, potentialCorrection]
    difficultyEvidence: 'Evaluates a logarithmic composition correction and interprets its direction.'
    prerequisiteObjectiveIds: [chemistry-equilibrium]
    extensionObjectiveIds: [chem-electrochem-electrolysis]
    issueSignals: [{ id: chemistry-electrochem-nernst-direction-error }]
  - id: q7
    type: multipleChoice
    prompt: 'When a reversible cell reaction reaches equilibrium at fixed temperature, which statement is correct?'
    choices:
      - { id: a, text: '$E=0$ and $Q=K$', issueSignals: [] }
      - { id: b, text: '$E=E^\circ$ and $Q=0$', issueSignals: [{ id: chemistry-electrochem-nernst-direction-error }] }
      - { id: c, text: '$E>0$ and $Q>K$ indefinitely', issueSignals: [{ id: chemistry-electrochem-spontaneity-sign-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: $E=0$ and $Q=K$. Why it works: Equilibrium has no net driving force or maximum electrical work. Why the other choices fail: b confuses equilibrium with standard composition; c claims persistent driving force at equilibrium.'
    difficultyDimensions: [equilibriumCondition, potentialLimit, quotientInterpretation]
    difficultyEvidence: 'Connects electrochemical potential with the equilibrium quotient condition.'
    prerequisiteObjectiveIds: [chemistry-equilibrium]
    extensionObjectiveIds: [chem-electrochem-electrolysis]
    issueSignals: [{ id: chemistry-electrochem-nernst-direction-error }, { id: chemistry-electrochem-spontaneity-sign-error }]
  - id: q8
    type: numericResponse
    prompt: 'Silver plates by $Ag^++e^-\rightarrow Ag$. A current of $1.75\ \mathrm{A}$ flows for $20.0\ \mathrm{min}$. Find deposited mass in grams using $F=96485\ \mathrm{C\,mol^{-1}}$ and $M_{Ag}=107.868\ \mathrm{g\,mol^{-1}}$.'
    answer: { value: 2.35, tolerance: 0.02 }
    explanation: 'Solution: $q=(1.75)(1200)=2100\ \mathrm{C}$; $n(e^-)=2100/96485=0.02177\ \mathrm{mol}$. The 1:1 half-reaction gives $m=(0.02177)(107.868)=2.35\ \mathrm{g}$. Why it works: Charge converts to electron amount before metal stoichiometry and molar mass.'
    difficultyDimensions: [chargeCalculation, faradayConversion, ionStoichiometry]
    difficultyEvidence: 'Carries current-time data through Faraday and one-electron deposition.'
    prerequisiteObjectiveIds: [chemistry-stoichiometry]
    extensionObjectiveIds: [chem-electrochem-cells]
    issueSignals: [{ id: chemistry-electrochem-faraday-stoichiometry-error }]
  - id: q9
    type: numericResponse
    prompt: 'Aluminum plates by $Al^{3+}+3e^-\rightarrow Al$. How many minutes are required to deposit $2.70\ \mathrm{g}$ Al at $5.00\ \mathrm{A}$? Use $F=96485\ \mathrm{C\,mol^{-1}}$ and $M_{Al}=26.982\ \mathrm{g\,mol^{-1}}$.'
    answer: { value: 96.6, tolerance: 0.4 }
    explanation: 'Solution: $n(Al)=2.70/26.982=0.1001\ \mathrm{mol}$, so $n(e^-)=0.3002\ \mathrm{mol}$ and $q=28968\ \mathrm{C}$. Then $t=q/I=5794\ \mathrm{s}=96.6\ \mathrm{min}$. Why it works: Working backward requires three electron moles per aluminum mole before converting charge to time.'
    difficultyDimensions: [massToMoles, electronStoichiometry, timeCalculation]
    difficultyEvidence: 'Reverses the electrolysis chain from desired mass to operating time.'
    prerequisiteObjectiveIds: [chemistry-stoichiometry]
    extensionObjectiveIds: [chem-electrochem-cells]
    issueSignals: [{ id: chemistry-electrochem-faraday-stoichiometry-error }]
  - id: q10
    type: multipleChoice
    prompt: 'A magnesium block is electrically connected to an underground iron pipe. Why can the magnesium protect the iron from corrosion?'
    choices:
      - { id: a, text: 'Magnesium oxidizes preferentially and supplies electrons to the iron.', issueSignals: [] }
      - { id: b, text: 'Magnesium forces iron to become the anode and oxidize faster.', issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }] }
      - { id: c, text: 'Magnesium prevents all ion movement in the soil.', issueSignals: [{ id: chemistry-electrochem-flow-direction-reversed }] }
    answer: { choiceId: a }
    explanation: 'Solution: Magnesium acts as the sacrificial anode. Why it works: Its preferential oxidation keeps the iron relatively cathodic. Why the other choices fail: b reverses the protection roles; c invents an ion-blocking mechanism.'
    difficultyDimensions: [corrosionModel, electrodeRole, protectionStrategy]
    difficultyEvidence: 'Transfers electrode-role reasoning to a practical corrosion system.'
    prerequisiteObjectiveIds: [chem-electrochem-redox]
    extensionObjectiveIds: [chem-electrochem-electrolysis]
    issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }, { id: chemistry-electrochem-flow-direction-reversed }]
  - id: q11
    type: selectAll
    prompt: 'Select every correct statement about a rechargeable battery.'
    choices:
      - { id: a, text: 'During discharge it operates galvanically through a spontaneous cell reaction.', issueSignals: [] }
      - { id: b, text: 'During charging an external source drives the reverse chemical direction.', issueSignals: [] }
      - { id: c, text: 'Reduction occurs at the anode in both operating modes.', issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }] }
      - { id: d, text: 'Recharging creates electrons rather than transferring them.', issueSignals: [{ id: chemistry-electrochem-electron-balance-error }] }
    answer: { choiceIds: [a, b] }
    explanation: 'Solution: Select a and b. Discharge produces electrical work; charging consumes it to reverse the chemistry. Why it works: The device switches chemical direction while each instantaneous anode remains the oxidation site. Why the other choices fail: c violates electrode definitions; d violates charge conservation.'
    difficultyDimensions: [batteryModel, energyConversion, processDirection]
    difficultyEvidence: 'Compares discharge and recharge while retaining reaction-based electrode definitions.'
    prerequisiteObjectiveIds: [chem-electrochem-cells]
    extensionObjectiveIds: [chem-electrochem-electrolysis]
    issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }, { id: chemistry-electrochem-electron-balance-error }]
  - id: q12
    type: multipleChoice
    prompt: 'A cell reaction is reversed while describing the same physical composition. Which transformation is thermodynamically consistent?'
    choices:
      - { id: a, text: '$E_{reverse}=-E_{forward}$ and $Q_{reverse}=1/Q_{forward}$', issueSignals: [] }
      - { id: b, text: '$E_{reverse}=E_{forward}$ and $Q_{reverse}=Q_{forward}$', issueSignals: [{ id: chemistry-electrochem-spontaneity-sign-error }] }
      - { id: c, text: '$E_{reverse}=2E_{forward}$ and $Q_{reverse}=Q_{forward}^2$', issueSignals: [{ id: chemistry-electrochem-potential-calculation-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: Reversing the reaction changes the potential sign and inverts Q. Why it works: The reverse chemical driving force is equal in magnitude and opposite in direction, and products/reactants swap in the quotient. Why the other choices fail: b ignores reversal; c incorrectly scales an intensive potential and invents quotient powers.'
    difficultyDimensions: [reactionReversal, quotientInversion, potentialSign]
    difficultyEvidence: 'Coordinates reaction notation, quotient algebra, and potential direction.'
    prerequisiteObjectiveIds: [chemistry-equilibrium]
    extensionObjectiveIds: [chem-electrochem-electrolysis]
    issueSignals: [{ id: chemistry-electrochem-spontaneity-sign-error }, { id: chemistry-electrochem-potential-calculation-error }]
