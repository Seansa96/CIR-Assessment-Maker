questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch03-modeling
  prompt: A First Law of Thermodynamics situation emphasizes system and state. Define the system and sign convention,
    state when $\\Delta U = Q - W$ applies, and construct a written solution that includes the relation, units,
    assumptions, and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $\\Delta U = Q - W$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The First Law of Thermodynamics model of energy accounting for thermodynamic systems is reliable
    only when its relation, conditions, and interpretation are kept together.'
  difficultyDimensions: &id001
  - modelOrDerivation
  - proofJustification
  - representationTransfer
  subjectDifficultyTags:
