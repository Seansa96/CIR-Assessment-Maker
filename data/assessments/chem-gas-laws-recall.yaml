modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: 'What is Boyle''s Law (formula and definition)?'
    answer:
      expected: |
        $P_1 V_1 = P_2 V_2$

        At constant temperature and moles, pressure and volume are **inversely proportional**.
  - id: item-002
    type: flashcard
    prompt: 'What is Charles''s Law (formula and definition)?'
    answer:
      expected: |
        $\frac{V_1}{T_1} = \frac{V_2}{T_2}$

        At constant pressure and moles, volume and absolute temperature (Kelvin) are **directly proportional**.
  - id: item-003
    type: flashcard
    prompt: 'What is Avogadro''s Law (formula and definition)?'
    answer:
      expected: |
        $\frac{V_1}{n_1} = \frac{V_2}{n_2}$

        At constant pressure and temperature, volume and the number of moles are **directly proportional**.
  - id: item-004
    type: flashcard
    prompt: 'What is the formula for the Combined Gas Law?'
    answer:
      expected: |
        $$\frac{P_1 V_1}{T_1} = \frac{P_2 V_2}{T_2}$$
  - id: item-005
    type: flashcard
    prompt: 'What is the formula for the Ideal Gas Law?'
    answer:
      expected: |
        $$PV = nRT$$
  - id: item-006
    type: flashcard
    prompt: 'What are the two common values for the ideal gas constant $R$ (with units)?'
    answer:
      expected: |
        - $R = 0.08206 \frac{\text{L}\cdot\text{atm}}{\text{mol}\cdot\text{K}}$ (when P is in atm)
        - $R = 62.36 \frac{\text{L}\cdot\text{torr}}{\text{mol}\cdot\text{K}}$ (when P is in torr or mmHg)
  - id: item-007
    type: flashcard
    prompt: 'What is Dalton''s Law of Partial Pressures?'
    answer:
      expected: |
        The total pressure of a mixture of gases is equal to the sum of the partial pressures of the individual gases:
        $P_{total} = P_1 + P_2 + \dots$
  - id: item-008
    type: flashcard
    prompt: 'How do you calculate the partial pressure of a gas if you know its mole fraction and the total pressure?'
    answer:
      expected: |
        Partial Pressure = Mole Fraction × Total Pressure
        $$P_A = \chi_A \times P_{total}$$
  - id: item-009
    type: flashcard
    prompt: 'What are the exact values of Standard Temperature and Pressure (STP)?'
    answer:
      expected: |
        - **Temperature:** 0 °C (273.15 K)
        - **Pressure:** 1.00 atm
  - id: item-010
    type: flashcard
    prompt: 'When collecting a gas over water, how do you find the pressure of the dry gas?'
    answer:
      expected: |
        Subtract the vapor pressure of water at that temperature from the total pressure measured in the flask:
        $P_{dry gas} = P_{total} - P_{H_2O}$
