lesson:
  introduction: Learn to solve Statistics and Probability problems by recognizing mean, median, mode, range, probability, casework, odds, expected value and justifying each theorem or transformation.
  sections:
  - id: aops-statistics-probability-motivation
    title: What the topic helps you notice
    required: true
    content: Statistics and Probability is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are mean, median, mode, range, probability, casework, odds, expected value.
    check:
      id: aops-statistics-probability-motivation-check
      type: multipleChoice
      prompt: In Statistics and Probability, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-statistics-probability-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-statistics-probability-definitions-check
      type: multipleChoice
      prompt: In Statistics and Probability, what should be checked before applying a method?
      choices:
