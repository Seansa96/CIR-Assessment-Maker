lesson:
  sections:
  - id: section-central-tendency
    title: Measures of Central Tendency
    content: 'Statistics often seeks to summarize a large dataset with a single representative number.
      The three most common measures are:


      1. **Mean (Average):** The sum of all values divided by the number of values. It is highly sensitive
      to outliers.

      2. **Median:** The middle value when the data is sorted in ascending order. (If there is an even
      number of values, it''s the average of the two middle values). It is resistant to outliers.

      3. **Mode:** The value that appears most frequently. A dataset can have one mode, multiple modes,
      or no mode.

      '
    check:
      type: multipleChoice
      prompt: 'Consider the dataset: $\{3, 7, 7, 10, 18\}$. What is the difference between the mean and
        the median?'
      choices:
      - id: a
        text: '2'
      - id: b
        text: '9'
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: '7'
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: '0'
        issueSignals:
        - id: algebra-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - 'Calculate the mean: $(3+7+7+10+18)/5$.'
      - 'Identify the median: 7.0'
      - Subtract the median from the mean.
      explanation: 'Solution:

        First, calculate the mean. The sum is $3 + 7 + 7 + 10 + 18 = 45$.

        Since there are 5 numbers, the mean is $45 / 5 = 9$.

        Next, find the median. The dataset is already sorted: $3, 7, 7, 10, 18$. The middle (3rd) value
        is 7.

        The difference between the mean and the median is $9 - 7 = 2$.


        Why it works:

        The large outlier (18) pulls the mean significantly higher than the median, which remains anchored
        to the physical center of the data points.

        '
      id: section-central-tendency-check
    required: true
  - id: section-theoretical-probability
    title: Theoretical Probability
    content: 'If all outcomes in a sample space are equally likely, the probability of an event $E$ occurring
      is:

      $$P(E) = \frac{\text{Number of Favorable Outcomes}}{\text{Total Number of Possible Outcomes}}$$


      Because of this definition, probability problems are almost always just two counting problems stacked
      on top of each other. You must count the total universe of possibilities (the denominator), and
      then count the specific scenarios you want (the numerator).


      Probabilities are always between 0 (impossible) and 1 (certain).

      '
    check:
      type: multipleChoice
      prompt: A bag contains 5 red marbles and 3 blue marbles. If you draw two marbles at random without
        replacement, what is the probability that both are red?
      choices:
      - id: a
        text: 5/14
      - id: b
        text: 25/64
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: 5/8
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: 10/28
        issueSignals:
        - id: formula-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Identify the total number of ways to draw 2 marbles from 8.
      - Identify the number of ways to draw 2 red marbles from 5.
      - Divide and simplify the fraction.
      explanation: 'Solution:

        Method 1 (Combinatorics):

        Total outcomes: $\binom{8}{2} = \frac{8 \times 7}{2} = 28$.

        Favorable outcomes (choosing 2 reds from the 5 available): $\binom{5}{2} = \frac{5 \times 4}{2}
        = 10$.

        Probability = $\frac{10}{28} = \frac{5}{14}$.


        Method 2 (Sequential Probability):

        Probability of first being red: $\frac{5}{8}$.

        Probability of second being red (given the first was red): $\frac{4}{7}$.

        Total Probability = $\frac{5}{8} \times \frac{4}{7} = \frac{20}{56} = \frac{5}{14}$.


        Why it works:

        Both methods are perfectly equivalent. Sequential probability is often faster for simple draws,
        but combinatorics is far safer when order doesn''t matter and draws are complex.

        '
      id: section-theoretical-probability-check
    required: true
  - id: section-independent-dependent
    title: Independent and Dependent Events
    content: 'Two events $A$ and $B$ are **independent** if the outcome of $A$ has no effect on the probability
      of $B$. For independent events:

      $$P(A \text{ and } B) = P(A) \times P(B)$$


      If the outcome of $A$ *does* affect the probability of $B$ (like drawing marbles without replacement),
      they are **dependent**. We must use conditional probability, denoted $P(B|A)$, which reads "the
      probability of $B$ given that $A$ has occurred":

      $$P(A \text{ and } B) = P(A) \times P(B|A)$$

      '
    check:
      type: multipleChoice
      prompt: You roll a standard 6-sided die and flip a fair coin. What is the probability of rolling
        a prime number AND flipping Heads?
      choices:
      - id: a
        text: 1/4
      - id: b
        text: 1/2
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: 1/3
        issueSignals:
        - id: algebra-error
          domains: []
      - id: d
        text: 1/6
        issueSignals:
        - id: formula-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Recognize the events are independent.
      - Calculate the probability of a prime (2, 3, 5).
      - Calculate the probability of Heads.
      - Multiply the probabilities.
      explanation: 'Solution:

        Rolling a die and flipping a coin are completely independent events.

        The primes on a 6-sided die are 2, 3, and 5. So $P(\text{Prime}) = \frac{3}{6} = \frac{1}{2}$.

        The probability of getting Heads is $P(\text{Heads}) = \frac{1}{2}$.

        Since they are independent, we multiply:

        $$P(\text{Prime and Heads}) = \frac{1}{2} \times \frac{1}{2} = \frac{1}{4}$$


        Why it works:

        If you listed all 12 possible outcomes (1H, 1T, 2H, 2T, etc.), exactly 3 of them satisfy the condition
        (2H, 3H, 5H). $3/12 = 1/4$.

        '
      id: section-independent-dependent-check
    required: true
  - id: section-expected-value
    title: Expected Value
    content: 'The **expected value** $E(X)$ of a random variable is the long-run average value of its
      outcomes. It is the probability-weighted sum of all possible values.


      If a game has outcomes $x_1, x_2, \dots, x_n$ with probabilities $p_1, p_2, \dots, p_n$, then:

      $$E(X) = (x_1 \cdot p_1) + (x_2 \cdot p_2) + \dots + (x_n \cdot p_n)$$


      If a casino game costs $\$5$ to play, and the expected value of your winnings is $\$4$, your net
      expected value is $-\$1$. Over thousands of games, you will average a loss of $\$1$ per game.

      '
    check:
      type: multipleChoice
      prompt: You play a game where you roll a 6-sided die. If you roll a 6, you win $\$12$. If you roll
        an odd number, you win $\$2$. Otherwise (if you roll a 2 or 4), you win nothing. What is your
        expected winnings?
      choices:
      - id: a
        text: $\$3.00$
      - id: b
        text: $\$4.67$
        issueSignals:
        - id: algebra-error
          domains: []
      - id: c
        text: $\$2.50$
        issueSignals:
        - id: formula-error
          domains: []
      - id: d
        text: $\$14.00$
        issueSignals:
        - id: wrong-concept
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - List the outcomes and their probabilities.
      - Calculate $(12 \times 1/6) + (2 \times 3/6) + (0 \times 2/6)$.
      explanation: 'Solution:

        Let''s list the outcomes and probabilities:

        - Roll a 6 (Probability $\frac{1}{6}$): Win $\$12$.

        - Roll 1, 3, or 5 (Probability $\frac{3}{6}$): Win $\$2$.

        - Roll 2 or 4 (Probability $\frac{2}{6}$): Win $\$0$.


        The expected value is:

        $$E(X) = \left(12 \times \frac{1}{6}\right) + \left(2 \times \frac{3}{6}\right) + \left(0 \times
        \frac{2}{6}\right)$$

        $$E(X) = 2 + 1 + 0 = 3$$

        Your expected winnings are $\$3.00$.


        Why it works:

        If you played 6 times, you would statistically roll one 6 (winning $\$12$) and three odds (winning
        $\$6$ total), for a total of $\$18$. Averaged over the 6 games, you win $18/6 = \$3$ per game.

        '
      id: section-expected-value-check
    required: true
  - id: section-geometric-probability
    title: Geometric Probability
    content: 'Not all sample spaces are discrete lists of items. If a random point is chosen in a continuous
      region, the probability that it falls into a specific sub-region is the ratio of their geometric
      measures (length, area, or volume).


      $$P = \frac{\text{Area of Favorable Region}}{\text{Total Area of Region}}$$


      This often requires graphing equations on the coordinate plane to visualize the favorable area.

      '
    check:
      type: multipleChoice
      prompt: A point $(x, y)$ is randomly chosen inside a square with vertices $(0,0), (4,0), (4,4),
        \text{and } (0,4)$. What is the probability that $y < x$?
      choices:
      - id: a
        text: 1/2
      - id: b
        text: 1/4
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: 1/3
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: 3/4
        issueSignals:
        - id: wrong-concept
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Graph the square (Area = 16).
      - Graph the line $y = x$ and shade the region $y < x$.
      - Calculate the area of the shaded triangle (Area = 8).
      - Divide the areas.
      explanation: 'Solution:

        The total region is a $4 \times 4$ square, so the Total Area = 16.

        The condition is $y < x$. If we draw the line $y = x$, it is the main diagonal of the square,
        perfectly cutting it in half.

        The region $y < x$ represents the area *below* the diagonal. This is a right triangle with a base
        of 4 and height of 4.

        Favorable Area = $\frac{1}{2}(4)(4) = 8$.

        Probability = $\frac{8}{16} = \frac{1}{2}$.


        Why it works:

        Because the diagonal acts as a line of symmetry, exactly half the points in the square have $y
        < x$ and the other half have $y > x$ (the points strictly on $y=x$ have an area of 0, so they
        don''t affect continuous probability).

        '
      id: section-geometric-probability-check
    required: true
  introduction: This lesson develops the key ideas in Statistics and Probability.
