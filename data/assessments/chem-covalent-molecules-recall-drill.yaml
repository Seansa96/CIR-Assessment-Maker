- id: r001
  type: typed
  prompt: Define orbital overlap and name the representation in which it is used.
  answer:
    expected: The interpenetration of atomic-orbital regions that concentrates bonding electron density between nuclei.
    aliases:
    - orbital overlap
  explanation: 'Solution: The interpenetration of atomic-orbital regions that concentrates bonding electron density between
    nuclei. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r002
  type: typed
  prompt: What does sigma bond tell you to count or distinguish?
  answer:
    expected: A bond with electron density concentrated along the internuclear axis.
    aliases:
    - sigma bond
  explanation: 'Solution: A bond with electron density concentrated along the internuclear axis. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r003
  type: typed
  prompt: State one condition that must be checked when using pi bond.
  answer:
    expected: A bond with electron density in regions on opposite sides of the internuclear axis.
    aliases:
    - pi bond
  explanation: 'Solution: A bond with electron density in regions on opposite sides of the internuclear axis. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
