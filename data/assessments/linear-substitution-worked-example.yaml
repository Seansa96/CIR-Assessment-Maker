workedExamples:
- id: we001
  title: Solving an integral with linear substitution
  problem: Evaluate $\int 2(3x+1)^4\,dx$.
  steps:
  - id: step-we001-1
    title: Check direct integration
    instruction: Before substituting, decide whether the integrand is already in a
      simple antiderivative form.
    type: multipleChoice
    prompt: Can this integral be handled cleanly by direct integration without rewriting
      the inner expression?
    choices:
    - id: true
      text: 'Yes'
    - id: false
      text: 'No'
    answer:
      choiceId: false
    hint: Look for a composed expression and ask whether its derivative also appears
      as a constant factor.
    explanation: The factor $(3x+1)^4$ is a composition. Because the derivative of
      $3x+1$ is the constant $3$, substitution is the cleaner bookkeeping move.
  - id: step-we001-2
    title: Define the substitution
    instruction: Choose $u$ to be the inner expression whose derivative is present
      up to a constant factor.
    type: freeResponse
    prompt: What should $u$ equal?
    answer:
      expected: $u=3x+1$
      gradingMode: selfCheck
    hint: Use the expression inside the fourth power.
    explanation: Set $u=3x+1$. Then $du=3\,dx$, so $dx=\frac{du}{3}$.
  - id: step-we001-3
    title: Rewrite the integral
    instruction: Replace the inner expression and adjust the constant from $dx=\frac{du}{3}$.
    type: symbolicResponse
    prompt: After substitution, what integral should be evaluated?
    answer:
      expectedLatex: \frac{2}{3}\int u^4\,du
      equivalenceMode: expression
      variables:
      - u
      tolerance: 0
    hint: The outside coefficient $2$ remains, and $dx$ contributes a factor of $\frac{1}{3}$.
    explanation: The integral becomes $\int 2u^4\frac{du}{3}=\frac{2}{3}\int u^4\,du$.
  - id: step-we001-4
    title: Substitute back
    instruction: Find the antiderivative in terms of $u$, then replace $u$ with $3x+1$.
    type: symbolicResponse
    prompt: What is the final antiderivative?
    answer:
      expectedLatex: \frac{2}{15}(3x+1)^5+C
      equivalenceMode: derivative
      variables:
      - x
      tolerance: 0
    hint: Use the power rule on $u^4$, then replace $u$.
    explanation: $\frac{2}{3}\int u^4\,du=\frac{2}{15}u^5+C$, so the antiderivative
      is $\frac{2}{15}(3x+1)^5+C$.
