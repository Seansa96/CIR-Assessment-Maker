lesson:
  introduction: Learn to solve Angles problems by recognizing lines and rays, angle measurement, parallel-line angles, circle angles, proof burden and justifying each theorem or transformation.
  sections:
  - id: aops-angles-motivation
    title: What the topic helps you notice
    required: true
    content: Angles is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are lines and rays, angle measurement, parallel-line angles, circle angles, proof burden.
    check:
      id: aops-angles-motivation-check
      type: multipleChoice
      prompt: In Angles, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-angles-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-angles-definitions-check
      type: multipleChoice
      prompt: In Angles, what should be checked before applying a method?
