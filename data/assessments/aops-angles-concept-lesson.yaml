schemaVersion: 1
id: aops-angles-concept-lesson
title: Angles Concept Lesson
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-angles
modeDefault: learn
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [art-of-problem-solving, aops-angles, angle-measure, parallel-lines, circle-angles, geometry]
skills:
- Build angle equations from lines, turns, triangles, and parallelism
- Distinguish central, inscribed, interior-chord, exterior-secant, and tangent-chord angles
- Use converses only after establishing their hypotheses
- Record a reason for every equality or supplementary relation
lesson:
  introduction: |-
    Angle solving is a constraint system, not visual estimation. Straight lines, full turns, parallel markers, triangle sums, and intercepted arcs each create exact equations. The decisive skill is identifying the vertex and the marked hypotheses before selecting a theorem, then maintaining a reason ledger so every propagated measure can be checked.
  sections:
  - id: angle-objects-and-measure
    title: Rays create angles; units measure rotation
    required: true
    content: |-
      A ray has one endpoint and a direction. Two rays sharing an endpoint form an angle, and their common endpoint is the vertex. A full turn is $360^\circ$ or $2\pi$ radians, so

      $$180^\circ=\pi\text{ radians},\qquad \theta^\circ=\frac{\theta\pi}{180}\text{ radians}.$$

      Ordinary elementary angle measures are nonnegative and normally between $0^\circ$ and $360^\circ$. A diagram may be distorted; labels and markings, not apparent size, determine the measure.
    media:
    - {type: image, src: /assessments/aops/aops-angle-lines.svg, alt: Two marked parallel lines crossed by a transversal, with one 62-degree angle and a target angle.}
    check:
      id: angle-objects-and-measure-check
      type: multipleChoice
      prompt: Convert $150^\circ$ to radians.
      choices:
      - {id: a, text: '$5\pi/6$'}
      - {id: b, text: '$3\pi/5$'}
      - {id: c, text: '$5\pi/3$'}
      - {id: d, text: '$150\pi$'}
      answer: {choiceId: a}
      explanation: Multiply by $\pi/180$ and reduce $150/180$ to $5/6$.
  - id: point-and-line-relations
    title: Vertical angles, linear pairs, and full turns
    required: true
    content: |-
      When two lines intersect, opposite vertical angles are equal. Adjacent angles whose noncommon sides form a line make a linear pair and sum to $180^\circ$. All angles around one point sum to $360^\circ$.

      These relations have different conclusions. “Adjacent” alone does not imply supplementary, and equal angles need not be vertical. Name the geometric condition before writing the equation. If one intersection angle is $62^\circ$, its vertical angle is $62^\circ$ and each adjacent linear-pair angle is $118^\circ$.
    media:
    - {type: image, src: /assessments/aops/aops-angle-lines.svg, alt: Transversal intersections where vertical and adjacent angle relations can be identified.}
    check:
      id: point-and-line-relations-check
      type: multipleChoice
      prompt: Two intersecting lines create one angle of $137^\circ$. What is either adjacent angle?
      choices:
      - {id: a, text: '$43^\circ$'}
      - {id: b, text: '$137^\circ$'}
      - {id: c, text: '$180^\circ$'}
      - {id: d, text: '$223^\circ$'}
      answer: {choiceId: a}
      explanation: Adjacent angles form a linear pair, so subtract from $180^\circ$.
  - id: parallel-lines-and-converses
    title: A transversal transfers angle information across parallel lines
    required: true
    content: |-
      If a transversal crosses parallel lines, corresponding angles are equal, alternate interior angles are equal, and same-side interior angles are supplementary. The parallel markers are a hypothesis; without them, the relationships are not guaranteed.

      The converses are equally useful for proof. If a transversal creates equal corresponding angles, equal alternate interior angles, or supplementary same-side interior angles, the two lines are parallel. The chosen pair must occupy the named positions relative to the same transversal.
    media:
    - {type: image, src: /assessments/aops/aops-angle-lines.svg, alt: Parallel lines l and m cut by transversal t, with 62 degrees and x in alternate-interior positions.}
    check:
      id: parallel-lines-and-converses-check
      type: multipleChoice
      prompt: In the diagram, why must $x=62^\circ$?
      choices:
      - {id: a, text: They are alternate interior angles formed by a transversal of parallel lines.}
      - {id: b, text: Every pair of acute angles is equal.}
      - {id: c, text: They are adjacent on one line.}
      - {id: d, text: The picture appears symmetric.}
      answer: {choiceId: a}
      explanation: The position and parallel markings license the equality.
  - id: triangle-sum-and-exterior-angle
    title: Triangle sums turn an exterior angle into two remote angles
    required: true
    content: |-
      Interior angles of a triangle sum to $180^\circ$. Extending one side creates an exterior angle supplementary to the adjacent interior angle. Combining the two equations proves the exterior-angle theorem:

      $$E=A+B,$$

      where $A,B$ are the two remote interior angles. In an isosceles triangle, equal sides face equal angles; this is an additional invariant, not a consequence of how the drawing looks.
    media:
    - {type: image, src: /assessments/aops/aops-angle-triangle.svg, alt: Triangle ABC with remote interior angles 48 and 67 degrees and exterior angle x at C.}
    check:
      id: triangle-exterior-angle-check
      type: multipleChoice
      prompt: In the diagram, what is exterior angle $x$?
      choices:
      - {id: a, text: '$65^\circ$'}
      - {id: b, text: '$67^\circ$'}
      - {id: c, text: '$115^\circ$'}
      - {id: d, text: '$180^\circ$'}
      answer: {choiceId: c}
      explanation: The exterior angle equals $48^\circ+67^\circ=115^\circ$.
  - id: central-and-inscribed-angles
    title: Vertex location distinguishes central from inscribed angles
    required: true
    content: |-
      A central angle has its vertex at the circle center and equals the measure of its intercepted arc. An inscribed angle has its vertex on the circle and equals half the measure of its intercepted arc. Therefore, when they intercept the same arc,

      $$m\angle AOB=2m\angle ACB.$$

      An inscribed angle subtending a diameter intercepts a $180^\circ$ semicircle and is therefore $90^\circ$. Always name the intercepted arc; using the wrong arc can replace a minor angle with a reflex one.
    media:
    - {type: image, src: /assessments/aops/aops-angle-circle.svg, alt: Central angle AOB marked 104 degrees and inscribed angle ACB marked x intercepting the same arc AB.}
    check:
      id: central-and-inscribed-angles-check
      type: multipleChoice
      prompt: In the diagram, find $x$.
      choices:
      - {id: a, text: '$26^\circ$'}
      - {id: b, text: '$52^\circ$'}
      - {id: c, text: '$104^\circ$'}
      - {id: d, text: '$208^\circ$'}
      answer: {choiceId: b}
      explanation: The inscribed angle is half the central angle intercepting the same arc.
  - id: other-circle-angle-configurations
    title: Inside uses a sum; outside uses a difference
    required: true
    content: |-
      Circle-angle formulas depend on the vertex:

      - two chords intersecting inside: half the sum of the intercepted arcs;
      - two secants, a secant and tangent, or two tangents meeting outside: half the difference of far and near arcs;
      - tangent with a chord at the circle: half the intercepted arc, equal to an inscribed angle intercepting that arc.

      The tangent-chord theorem explains why the marked tangent angle in the cyclic diagram equals $\angle ADB$. It is invalid to use the exterior difference formula at a vertex on or inside the circle.
    media:
    - {type: image, src: /assessments/aops/aops-angle-cyclic-tangent.svg, alt: Cyclic quadrilateral ABCD with a tangent at A and inscribed angle ADB marked 38 degrees.}
    check:
      id: other-circle-angle-configurations-check
      type: multipleChoice
      prompt: In the tangent-chord diagram, what is the marked tangent angle $y$?
      choices:
      - {id: a, text: '$19^\circ$'}
      - {id: b, text: '$38^\circ$'}
      - {id: c, text: '$76^\circ$'}
      - {id: d, text: '$142^\circ$'}
      answer: {choiceId: b}
      explanation: The tangent-chord angle and $\angle ADB$ intercept the same chord $AB$.
  - id: reason-ledger-and-proof-obligations
    title: Build a reason ledger and guard every converse
    required: true
    content: |-
      A reliable chase alternates facts and reasons: mark a given, write the equation it licenses, solve only enough to reach a new angle, and record why the new angle is equal or supplementary. Useful checkpoints are triangle sum, straight line, full turn, parallel-line position, and circle-vertex location.

      Common failures are assuming lines are parallel, treating a chord as a diameter, using an inscribed-angle formula at an interior vertex, or inferring equal sides from equal-looking sides. A converse is a separate theorem: state the observed relationship and confirm its exact positional hypotheses before concluding parallelism, tangency, or cyclicity.
    media:
    - {type: image, src: /assessments/aops/aops-angle-isosceles.svg, alt: Isosceles triangle with equal-side marks and a bisected 40-degree vertex angle.}
    check:
      id: reason-ledger-and-proof-obligations-check
      type: multipleChoice
      prompt: Which fact, by itself, is sufficient to prove two lines parallel when cut by one transversal?
      choices:
      - {id: a, text: A pair of corresponding angles is equal.}
      - {id: b, text: One angle appears acute.}
      - {id: c, text: The lines do not meet within the drawing.}
      - {id: d, text: Two unrelated angles sum to $180^\circ$.}
      answer: {choiceId: a}
      explanation: The corresponding-angle converse applies to the correctly positioned pair.
