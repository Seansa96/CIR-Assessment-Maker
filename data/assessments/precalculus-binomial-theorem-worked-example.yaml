- id: we001
  title: Build an expansion from a visual pattern
  problem: >
    Expand $(x-2)^5$. Use the coefficient row and exponent map before simplifying.


    ![Pascal's triangle with row five highlighted](/assessments/precalc-binomial/pascal-triangle.svg)
  steps:
  - id: step001
    title: Select the coefficient row
    instruction: The exponent is $5$, so read row $5$ of Pascal's triangle.
    hint: 
    type: multipleChoice
    prompt: Which coefficients should be used?
    choices:
    - id: a
      text: $1,5,10,10,5,1$
      media: []
      issueSignals: []
    - id: b
      text: $1,4,6,4,1$
      media: []
      issueSignals:
      - id: exponent-rule-misapplied
        domains: []
    - id: c
      text: $1,1,1,1,1,1$
      media: []
      issueSignals:
      - id: expression-equation-recognition-error
        domains: []
    - id: d
      text: $5,10,10,5$
      media: []
      issueSignals:
      - id: algebraic-simplification-error
        domains: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The row is $1,5,10,10,5,1$.


      Why it works: Row number and binomial exponent agree.


      Why the other choices fail: They belong to a different power or omit endpoints.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step002
    title: Keep the negative term intact
    instruction: Treat the expression as $(x+(-2))^5$.
    hint: 
    type: symbolicResponse
    prompt: Write the term with $x^3$ before simplifying its number.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 10x^3(-2)^2
      equivalenceMode: expression
      variables:
      - x
      value: 
      tolerance: 0
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The $x^3$ term is $\binom52x^3(-2)^2=10x^3(-2)^2$.


      Why it works: The powers are $x^{5-k}$ and $(-2)^k$; $5-k=3$ gives $k=2$.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step003
    title: Simplify and verify
    instruction: Simplify each term while preserving the alternating sign pattern.
    hint: 
    type: symbolicResponse
    prompt: Expand $(x-2)^5$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: x^5-10x^4+40x^3-80x^2+80x-32
      equivalenceMode: expression
      variables:
      - x
      value: 
      tolerance: 0
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The expansion is $x^5-10x^4+40x^3-80x^2+80x-32$.


      Why it works: Odd powers of $-2$ are negative, even powers are positive, and the coefficient row controls magnitude.
