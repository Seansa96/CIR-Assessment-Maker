- id: we002
  title: Extract a coefficient without full expansion
  problem: >
    Find the coefficient of $x^4$ in $(2x+3)^7$.


    ![Coefficient extraction workflow](/assessments/precalc-binomial/coefficient-flow.svg)
  steps:
  - id: step004
    title: Match the requested exponent
    instruction: The general term is $\binom7k(2x)^{7-k}3^k$.
    hint: 
    type: multipleChoice
    prompt: Which value of $k$ produces $x^4$?
    choices:
    - id: a
      text: $k=3$
      media: []
      issueSignals: []
    - id: b
      text: $k=4$
      media: []
      issueSignals:
      - id: exponent-rule-misapplied
        domains: []
    - id: c
      text: $k=7$
      media: []
      issueSignals:
      - id: expression-equation-recognition-error
        domains: []
    - id: d
      text: $k=2$
      media: []
      issueSignals:
      - id: algebraic-simplification-error
        domains: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Solve $7-k=4$, giving $k=3$.


      Why it works: Only $(2x)^{7-k}$ contributes a power of $x$.


      Why the other choices fail: Their first-factor exponent is not four.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: step005
    title: Evaluate just the chosen term
    instruction: Substitute $k=3$ rather than expanding eight terms.
    hint: 
    type: numericResponse
    prompt: What is the coefficient of $x^4$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 15120
      tolerance: 0
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\binom73 2^4 3^3=35\cdot16\cdot27=15120$.


      Why it works: The coefficient combines the binomial count, the numeric part of $(2x)^4$, and $3^3$.
