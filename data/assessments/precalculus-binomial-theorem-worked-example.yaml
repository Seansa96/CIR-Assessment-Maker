schemaVersion: 1
id: precalculus-binomial-theorem-worked-example
title: Binomial Theorem Practical Worked Example
assessmentType: workedExample
categoryId: precalculus
subcategoryIds:
- precalc-binomial
modeDefault: practice
randomizeQuestions: false
workedExamples:
- id: we001
  title: Expanding and extracting terms efficiently
  problem: 'Use the binomial theorem to expand or extract a term without multiplying
    many factors by hand.


    Main example:


    $$

    (2x-3)^4

    $$

    '
  steps:
  - id: step-we001-1
    title: Recall the theorem structure
    instruction: 'The binomial theorem expands powers of two-term expressions.

      '
    type: symbolicResponse
    prompt: |
      Write the general term of $(a+b)^n$ using $k$.
    answer:
      expectedLatex: \binom{n}{k}a^{n-k}b^k
      equivalenceMode: expression
      variables:
      - n
      - k
      - a
      - b
      tolerance: 0
    hint: 'The power on $a$ decreases while the power on $b$ increases.

      '
    explanation: |
      The general term is

      $$
      \binom{n}{k}a^{n-k}b^k.
      $$

      Related topic: binomial theorem general term.
  - id: step-we001-2
    title: Identify a and b
    instruction: 'Treat the sign as part of the second term.

      '
    type: multipleChoice
    prompt: |
      For $(2x-3)^4$, what should be used for $a$ and $b$?
    choices:
    - id: a
      text: $a=2x$, $b=-3$
    - id: b
      text: $a=2$, $b=3$
    - id: c
      text: $a=x$, $b=3$
    - id: d
      text: $a=2x$, $b=3$ only
    answer:
      choiceId: a
    explanation: |
      The expression is $(2x+(-3))^4$, so the negative sign belongs to $b$.

      Related topic: signed binomial terms.
  - id: step-we001-3
    title: Find one practical term
    instruction: 'Use the general term instead of expanding everything.

      '
    type: symbolicResponse
    prompt: |
      Find the $x^2$ term in:

      $$
      (2x-3)^4
      $$
    answer:
      expectedLatex: 216x^2
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0
    hint: 'The $x^2$ term happens when $(2x)^{4-k}$ has power $2$.

      '
    explanation: |
      Need $4-k=2$, so $k=2$:

      $$
      \binom{4}{2}(2x)^2(-3)^2=6\cdot4x^2\cdot9=216x^2.
      $$

      Related topic: coefficient extraction with binomial theorem.
  - id: step-we001-4
    title: Expand the full expression
    instruction: 'Use the coefficient row $1,4,6,4,1$ for fourth powers.

      '
    type: symbolicResponse
    prompt: |
      Expand:

      $$
      (2x-3)^4
      $$
    answer:
      expectedLatex: 16x^4-96x^3+216x^2-216x+81
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0
    explanation: |
      Use the fourth row coefficients $1,4,6,4,1$ with powers of $2x$ descending and powers of $-3$ ascending:

      $$
      16x^4-96x^3+216x^2-216x+81.
      $$

      Related topic: full binomial expansion.
  - id: step-we001-5
    title: Recognize when not to fully expand
    instruction: 'Practical use often means finding one coefficient.

      '
    type: multipleChoice
    prompt: |
      If a problem asks only for the coefficient of $x^5$ in $(1+2x)^8$, what should you do?
    choices:
    - id: a
      text: Use the general term and solve for the needed power.
    - id: b
      text: Always multiply eight binomials by hand.
    - id: c
      text: Use synthetic division.
    - id: d
      text: Use partial fractions.
    answer:
      choiceId: a
    explanation: |
      The general term is faster and less error-prone when only one coefficient is needed.

      Related topic: targeted coefficient extraction.
