questions:
- id: q001
  type: numericResponse
  prompt: |
    Calculate the work required to move a $1000 \text{ kg}$ payload from a circular orbit of radius $2R$ to a circular orbit of radius $3R$ around a planet. 
    Use $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$, planet mass $M = 5.97 \times 10^{24} \text{ kg}$, and $R = 6.37 \times 10^6 \text{ m}$.
    Enter your answer in Joules.
  answer:
    value: 5210000000
    tolerance: 10000000
  explanation: |
    Solution:
    The total energy of an object in a circular orbit is $E = -G\frac{Mm}{2r}$.
    Work $W = \Delta E = E_f - E_i = -G\frac{Mm}{2(3R)} - \left(-G\frac{Mm}{2(2R)}\right) = G\frac{Mm}{2R}\left(\frac{1}{2} - \frac{1}{3}\right) = G\frac{Mm}{12R}$.
    $W = \frac{(6.67 \times 10^{-11})(5.97 \times 10^{24})(1000)}{12(6.37 \times 10^6)} \approx 5.21 \times 10^9 \text{ J}$.
    
    Why it works:
    The total mechanical energy in a circular orbit is half the potential energy. The work done by the thrusters equals the change in this total mechanical energy.
  difficultyDimensions:
  - IdentityConstruction
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: |
    Three identical asteroids, each of mass $M = 2.0 \times 10^{13} \text{ kg}$, are positioned at the vertices of an equilateral triangle with side length $d = 1.5 \times 10^{11} \text{ m}$.
    What is the total gravitational potential energy of this 3-body system? Use $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$.
    Enter your answer in Joules.
  answer:
    value: -533.6
    tolerance: 0.1
  explanation: |
    Solution:
    A 3-body system has 3 unique pairs: $U_{total} = U_{12} + U_{13} + U_{23}$.
    Since the masses and distances are equal, $U_{total} = 3 \left( -G\frac{M^2}{d} \right)$.
    $U_{total} = -3 \frac{(6.67 \times 10^{-11})(2.0 \times 10^{13})^2}{1.5 \times 10^{11}} = -533.6 \text{ J}$.
    
    Why it works:
    The total potential energy of a multi-body system is the scalar sum of the potential energies of all possible distinct pairs of masses.
  difficultyDimensions:
  - IdentityConstruction
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
