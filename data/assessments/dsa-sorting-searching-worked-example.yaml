workedExamples:
- id: we001
  title: Trace a Sorting, Searching, and Selection decision
  problem: 'Work through a realistic case: finding a record in a sorted desktop index. Select an approach, preserve its invariant, and explain the tradeoff.'
  steps:
  - title: Recognize the workload
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: 'Which requirement matters most in this scenario: finding a record in a sorted desktop index?'
    choices:
    - id: a
      text: The access pattern and bound
    - id: b
      text: The name of the structure
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: The access pattern and bound. The trace follows the module invariant and workload.
    id: step-1
  - title: Protect the invariant
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: What must the update preserve?
    choices:
    - id: a
      text: binary search maintains a range that still could contain the target
    - id: b
      text: Only the output formatting
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: binary search maintains a range that still could contain the target. The trace follows the module invariant and workload.
    id: step-2
  - title: Choose the implementation
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: Which implementation action fits Sorting, Searching, and Selection?
    choices:
    - id: a
      text: binary search on a sorted list
    - id: b
      text: Scan unrelated data repeatedly
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: binary search on a sorted list. The trace follows the module invariant and workload.
    id: step-3
