- id: quick-direct-representation
  title: 'Direct representation: substitute once'
  problem: >
    Find a power-series representation for


    $$

    \frac{1}{1-3x}.

    $$


    Use this repeatable route: template, substitute, state the condition.


    ![Map of geometric-series operations: substitute, differentiate, and integrate](/assessments/calc2-infinite-series/power-series-operations-map.svg)
  steps:
  - id: direct-template
    title: 1. Name the template
    instruction: Start from the geometric identity; do not expand the target directly.
    hint: 
    type: freeResponse
    prompt: What parent identity matches $1/(1-3x)$, and what is $u$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - Use $\frac{1}{1-u}=\sum_{n=0}^{\infty}u^n$.
      - Set $u=3x$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Use $$\frac{1}{1-u}=\sum_{n=0}^{\infty}u^n$$ with $u=3x$.


      Why it works: The denominator $1-3x$ has the exact geometric form $1-u$.
    media:
    - type: image
      src: /assessments/calc2-infinite-series/power-series-operations-map.svg
      alt: Flow map showing the geometric series transformed by substitution, differentiation, and integration.
