  - id: direct-series
    title: 2. Substitute in every term
    instruction: Replace $u$ by $3x$ before simplifying.
    hint: 
    type: freeResponse
    prompt: Write the resulting power series and its condition.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - \frac{1}{1-3x}=\sum_{n=0}^{\infty}(3x)^n=\sum_{n=0}^{\infty}3^n x^n.
      - The condition is $|3x|<1$, so $|x|<1/3$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $$\frac{1}{1-3x}=\sum_{n=0}^{\infty}3^n x^n,\qquad |x|<\frac13.$$


      Why it works: Substitution changes both the term $u^n$ and the template condition $|u|<1$.
