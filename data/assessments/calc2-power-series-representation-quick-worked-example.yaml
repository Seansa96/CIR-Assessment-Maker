- id: quick-differentiate-representation
  title: 'Representation by differentiation: differentiate, then repair the sign'
  problem: >
    Find a power-series representation for


    $$

    \frac{1}{(1-x)^2}.

    $$


    Use this repeatable route: parent series, differentiate, repair the target.
  steps:
  - id: diff-start
    title: 1. Write the parent series
    instruction: Choose the geometric identity whose derivative produces the target denominator.
    hint: 
    type: freeResponse
    prompt: Write the parent identity and its interval.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - \frac{1}{1-x}=\sum_{n=0}^{\infty}x^n.
      - It holds for $|x|<1$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $$\frac{1}{1-x}=\sum_{n=0}^{\infty}x^n,\qquad |x|<1.$$


      Why it works: Differentiating $(1-x)^{-1}$ creates the desired squared denominator.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: diff-operate
    title: 2. Differentiate both sides
    instruction: Differentiate each term; the constant term disappears.
    hint: 
    type: freeResponse
    prompt: What identity results after differentiation?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - \frac{1}{(1-x)^2}=\sum_{n=1}^{\infty}n x^{n-1}.
      - The radius remains $1$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $$\frac{1}{(1-x)^2}=\sum_{n=1}^{\infty}n x^{n-1}.\quad |x|<1$$


      Why it works: The chain-rule signs cancel: $d(1-x)^{-1}/dx=(1-x)^{-2}$, while $d(x^n)/dx=nx^{n-1}$.
