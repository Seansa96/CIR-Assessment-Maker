- id: quick-integrate-representation
  title: 'Representation by integration: integrate, then set the constant'
  problem: >
    Find a power-series representation for


    $$

    \ln(1+x).

    $$


    Use this repeatable route: alternating parent series, integrate, set $C$.
  steps:
  - id: int-start
    title: 1. Build the parent series
    instruction: Use the geometric template with a negative input.
    hint: 
    type: freeResponse
    prompt: Write the series for $1/(1+x)$ and its interval.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - \frac{1}{1+x}=\sum_{n=0}^{\infty}(-1)^n x^n.
      - It holds for $|x|<1$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $$\frac{1}{1+x}=\sum_{n=0}^{\infty}(-1)^n x^n,\qquad |x|<1.$$


      Why it works: Set $u=-x$ in $1/(1-u)=\sum u^n$.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: int-operate
    title: 2. Integrate every term
    instruction: Increase the exponent and divide by the new exponent.
    hint: 
    type: freeResponse
    prompt: Write the integrated series before choosing $C$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - \ln(1+x)=\sum_{n=0}^{\infty}\frac{(-1)^n x^{n+1}}{n+1}+C.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $$\ln(1+x)=\sum_{n=0}^{\infty}\frac{(-1)^n x^{n+1}}{n+1}+C.$$


      Why it works: Integrating $x^n$ produces $x^{n+1}/(n+1)$ term by term.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: int-constant
    title: 3. Set $C$ and state the result
    instruction: Use the value at $x=0$, then write the compact final form.
    hint: 
    type: freeResponse
    prompt: What is $C$, and what final series should you use?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - $C=0$ because $\ln(1)=0$.
      - \ln(1+x)=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}x^n}{n}$ for $-1<x\leq1$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $$C=0,\qquad \ln(1+x)=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}x^n}{n},\quad -1<x\leq1.$$


      Why it works: At $x=0$, both the logarithm and every positive-power series term are zero; the endpoint behavior is then checked from the resulting alternating harmonic series.
