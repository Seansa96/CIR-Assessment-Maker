lesson:
  introduction: |-
    Just like we had shortcuts for proving triangles congruent (SSS, SAS, etc.), we have shortcuts for proving triangles are similar. We don't need to check all three angles and all three sides!
  sections:
  - id: sec-aa
    title: AA (Angle-Angle) Similarity
    required: true
    content: |-
      The most common shortcut for proving similarity is the **AA Similarity Postulate**:
      If two angles of one triangle are congruent to two angles of another triangle, then the two triangles are similar.
      
      Why only two angles? Because of the Triangle Angle Sum Theorem ($180^\circ$). If two angles match, the third angle is mathematically forced to match as well! Once all three angles match, the triangles are guaranteed to be the exact same shape (similar).

  - id: sec-sss-sas-sim
    title: SSS and SAS Similarity
    required: true
    content: |-
      **SSS (Side-Side-Side) Similarity Theorem**:
      If the measures of the corresponding sides of two triangles are proportional, then the triangles are similar. 
      (e.g., $\frac{AB}{DE} = \frac{BC}{EF} = \frac{AC}{DF}$)
      
      **SAS (Side-Angle-Side) Similarity Theorem**:
      If the measures of two sides of a triangle are proportional to the measures of two corresponding sides of another triangle, AND their included angles are congruent, then the triangles are similar.

questions:
- id: q-geom-sim2-1
  title: Concept Check - AA Similarity
  prompt: |-
    $\triangle ABC$ has angles measuring $40^\circ$ and $80^\circ$. $\triangle DEF$ has angles measuring $80^\circ$ and $60^\circ$. Are these triangles similar?
  type: multipleChoice
  choices:
  - id: c1
    text: Yes, by AA Similarity
  - id: c2
    text: No, they do not have two matching angles
  answer:
    choiceId: c1
  explanation: |-
    Let's find the missing third angle of $\triangle ABC$. $180^\circ - (40^\circ + 80^\circ) = 60^\circ$. 
    So the angles of $\triangle ABC$ are $40^\circ, 60^\circ, 80^\circ$.
    The angles of $\triangle DEF$ are $40^\circ, 60^\circ, 80^\circ$ (since $180 - (80+60) = 40$).
    They have matching angles! Therefore, they are similar by the AA Similarity Postulate.
  skills:
  - geometry-triangle-similarity

- id: q-geom-sim2-2
  title: Concept Check - SAS vs SSS Similarity
  prompt: |-
    You are given the lengths of all three sides of two triangles, but none of the angles. Which similarity theorem should you try to use to prove they are similar?
  type: multipleChoice
  choices:
  - id: c1
    text: AA Similarity
  - id: c2
    text: SAS Similarity
  - id: c3
    text: SSS Similarity
  answer:
    choiceId: c3
  explanation: |-
    Because you are only given the lengths of the sides and no angles, you must check if all three pairs of sides share the same proportional ratio using the **SSS Similarity Theorem**.
  skills:
  - geometry-triangle-similarity
