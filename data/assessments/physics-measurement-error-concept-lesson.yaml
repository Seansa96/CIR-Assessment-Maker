        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: A measurement is a best estimate.\n\nWhy it works: Instruments have finite resolution.\n\nWhy the other choices fail: Exactness is not guaranteed by a measurement.'
