    title: Best estimate
    required: true
    content: A reported value is a best estimate, not an exact claim.
    media: []
    check:
      id: me1
      type: multipleChoice
      prompt: What does a measurement report?
      choices:
      - id: a
        text: A best estimate
        media: []
        issueSignals: []
      - id: b
        text: An exact value
        media: []
        issueSignals:
        - id: measurement-exactness
          domains:
          - physics-1
