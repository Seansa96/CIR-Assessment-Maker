questions:
- id: q1
  type: numericResponse
  prompt: A flywheel has a moment of inertia of $4.0 \text{ kg}\cdot\text{m}^2$ and
    spins at $5.0 \text{ rad/s}$. What is its rotational kinetic energy?
  answer:
    value: 50.0
    tolerance: 1.0
  explanation: $K = \frac{1}{2}I\omega^2 = 0.5(4.0)(25) = 50 \text{ J}$.
