questions:
- id: q001
  type: numericResponse
  prompt: A flywheel has moment of inertia 4.0 kg m^2 and angular speed 5.0 rad/s.
    Find rotational kinetic energy in J.
  answer:
    value: 50
    tolerance: 0.5
  explanation: 'Solution: $K=0.5I omega^2=0.5(4.0)(5.0)^2=50$ J.


    Why it works: Rotational kinetic energy depends on moment of inertia and squared
    angular speed.

    '
  difficultyDimensions:
  - modelOrDerivation
  - simplification
- id: q002
  type: numericResponse
  prompt: A rotor has rotational kinetic energy 160 J at angular speed 8.0 rad/s.
    Find its moment of inertia in kg m^2.
  answer:
    value: 5
    tolerance: 0.05
  explanation: 'Solution: $I=2K/omega^2=320/64=5.0$ kg m^2.


    Why it works: Rearranging the rotational-energy equation isolates moment of inertia.

    '
  difficultyDimensions:
  - reverseReasoning
  - modelOrDerivation
- id: q003
  type: numericResponse
  prompt: A rotor has moment of inertia 5.0 kg m^2 and rotational kinetic energy 90
    J. Find angular speed in rad/s.
  answer:
    value: 6
    tolerance: 0.05
  explanation: 'Solution: $omega=sqrt(2K/I)=sqrt(180/5)=6.0$ rad/s.


    Why it works: Solving the energy relation for angular speed requires the positive
    physical root.

    '
  difficultyDimensions:
  - reverseReasoning
  - modelOrDerivation
- id: q004
  type: multipleChoice
  prompt: A hoop and a solid disk have equal mass and radius. Which has the greater
    moment of inertia about its center?
  choices:
  - id: a
    text: hoop
  - id: b
    text: disk
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: equal
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution: The hoop has the greater moment of inertia.


    Why it works: More of the hoop''s mass lies farther from the rotation axis.


    Why the other choices fail: Interior disk mass is closer to the axis, so it does
    not produce the same inertia.

    '
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
- id: q005
  type: numericResponse
  prompt: A 2.0 kg hoop rolls without slipping at 3.0 m/s. Find its total kinetic
    energy in J.
  answer:
    value: 18
    tolerance: 0.2
  explanation: 'Solution: For a hoop, translational and rotational energies are each
    $0.5Mv^2=9$ J, so total energy is 18 J.


    Why it works: Rolling combines translation of the center of mass with rotation
    about the center.

    '
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q006
  type: multipleChoice
  prompt: Which is the SI unit of moment of inertia?
  choices:
  - id: a
    text: kg m^2
  - id: b
    text: kg m/s
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: N m
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution: The unit is kg m^2.


    Why it works: Moment of inertia has the form mass times distance squared.


    Why the other choices fail: The other units describe momentum and torque.

    '
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
- id: q007
  type: numericResponse
  prompt: A solid disk has mass 6.0 kg, radius 0.40 m, and angular speed 10 rad/s.
    Find rotational kinetic energy in J.
  answer:
    value: 24
    tolerance: 0.3
  explanation: 'Solution: $I=0.5MR^2=0.48$ kg m^2 and $K=0.5(0.48)(10)^2=24$ J.


    Why it works: The disk''s mass distribution determines its moment of inertia before
    the energy calculation.

    '
  difficultyDimensions:
  - modelOrDerivation
  - auxiliaryTechnique
- id: q008
  type: multipleChoice
  prompt: At fixed angular speed, mass is moved farther from an axis. What happens
    to rotational kinetic energy?
  choices:
  - id: a
    text: it increases
  - id: b
    text: it decreases
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: it stays zero
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution: It increases.


    Why it works: Moving mass outward increases moment of inertia, and $K=0.5I omega^2$
    at fixed angular speed.


    Why the other choices fail: Neither decreased inertia nor zero energy follows
    from moving the mass outward.

    '
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
- id: q009
  type: numericResponse
  prompt: A solid cylinder has mass 3.0 kg, radius 0.20 m, and angular speed 12 rad/s.
    Find rotational kinetic energy in J.
  answer:
    value: 4.32
    tolerance: 0.05
  explanation: 'Solution: $I=0.5MR^2=0.060$ kg m^2, then $K=0.5(0.060)(12)^2=4.32$
    J.


    Why it works: A solid cylinder and disk share the same central-axis inertia form.

    '
  difficultyDimensions:
  - modelOrDerivation
  - auxiliaryTechnique
- id: q010
  type: numericResponse
  prompt: A rolling solid sphere has total kinetic energy 70 J. What rotational-energy
    fraction gives its rotational kinetic energy in J?
  answer:
    value: 20
    tolerance: 0.3
  explanation: 'Solution: A solid sphere has rotational fraction $2/7$, so $Krot=(2/7)(70)=20$
    J.


    Why it works: Its rolling energy splits according to the sphere''s moment of inertia.

    '
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
