lesson:
  introduction: Learn to solve Inequalities problems by recognizing linear inequalities, quadratic inequalities, absolute value inequalities, trivial inequalities and justifying each theorem or transformation.
  sections:
  - id: aops-inequalities-motivation
    title: What the topic helps you notice
    required: true
    content: Inequalities is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are linear inequalities, quadratic inequalities, absolute value inequalities, trivial inequalities.
    check:
      id: aops-inequalities-motivation-check
      type: multipleChoice
      prompt: In Inequalities, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-inequalities-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-inequalities-definitions-check
      type: multipleChoice
      prompt: In Inequalities, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-inequalities-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: track sign changes, test intervals, convert distance statements. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-inequalities-recognition-check
      type: multipleChoice
      prompt: In Inequalities, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-inequalities-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-inequalities-method-check
      type: multipleChoice
      prompt: In Inequalities, what should be checked before applying a method?
      choices:
