questions:
- id: q1
  type: multipleChoice
  prompt: 'If you double the angular velocity of a spinning body, its rotational kinetic
    energy increases by a factor of:'
  choices:
  - id: c1
    content: '2'
  - id: c2
    content: '4'
  - id: c3
    content: '8'
  - id: c4
    content: It remains the same.
  answer:
    choiceId: c2
  explanation: $K \propto \omega^2$, so doubling $\omega$ quadruples $K$.
