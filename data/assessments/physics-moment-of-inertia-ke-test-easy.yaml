questions:
- id: q001
  title: Rotational kinetic energy from $I$ and $\omega$
  type: numericResponse
  prompt: |-
    A flywheel has $I=4.0\text{ kg}\cdot\text{m}^2$ and spins at $5.0\text{ rad/s}$. What is its rotational kinetic energy in joules?
  answer:
    value: 50.0
    tolerance: 0.5
  explanation: |-
    $K_{rot}=\frac12I\omega^2=\frac12(4.0)(5.0)^2=50\text{ J}$.
- id: q002
  title: Solve for moment of inertia
  type: numericResponse
  prompt: |-
    A rotor has $K_{rot}=160\text{ J}$ when $\omega=8.0\text{ rad/s}$. What is $I$?
  answer:
    value: 5.0
    tolerance: 0.05
  explanation: |-
    $I=\frac{2K}{\omega^2}=\frac{320}{64}=5.0\text{ kg}\cdot\text{m}^2$.
- id: q003
  title: Solve for angular speed
  type: numericResponse
  prompt: |-
    A rotor has $I=5.0\text{ kg}\cdot\text{m}^2$ and $K_{rot}=90\text{ J}$. What is $\omega$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $\omega=\sqrt{2K/I}=\sqrt{180/5}=6.0\text{ rad/s}$.
- id: q004
  title: Rolling hoop total energy
  type: numericResponse
  prompt: |-
    A $2.0\text{ kg}$ hoop rolls without slipping at $3.0\text{ m/s}$. What is its total kinetic energy?
  answer:
    value: 18.0
    tolerance: 0.2
  explanation: |-
    For a hoop, $K_{rot}=\frac12Mv^2=9\text{ J}$ and $K_{trans}=9\text{ J}$, so $K=18\text{ J}$.
- id: q005
  title: Compare disk and hoop inertia
  type: multipleChoice
  prompt: |-
    A solid disk and a hoop have the same mass and radius. Which has larger $I$ about its central axis?
  choices:
  - id: a
    text: |-
      The hoop, because more mass is farther from the axis.
  - id: b
    text: |-
      The disk, because it has material throughout the interior.
  - id: c
    text: |-
      They are equal.
  - id: d
    text: |-
      Neither has $I$ unless it is spinning.
  answer:
    choiceId: a
  explanation: |-
    Moment of inertia depends on mass distribution. The hoop puts more mass far from the axis.
- id: q006
  title: Moment of inertia units
  type: multipleChoice
  prompt: |-
    Which unit is appropriate for moment of inertia?
  choices:
  - id: a
    text: |-
      $\text{kg}\cdot\text{m}^2$
  - id: b
    text: |-
      $\text{kg}\cdot\text{m/s}$
  - id: c
    text: |-
      $\text{N}\cdot\text{m}$
  - id: d
    text: |-
      $\text{J/s}$
  answer:
    choiceId: a
  explanation: |-
    $I$ has the structure $mr^2$, so its units are $\text{kg}\cdot\text{m}^2$.
- id: q007
  title: Solid sphere rotational fraction
  type: numericResponse
  prompt: |-
    For a solid sphere rolling without slipping, what fraction of total kinetic energy is rotational?
  answer:
    value: 0.2857
    tolerance: 0.01
  explanation: |-
    For a solid sphere, $K_{rot}=\frac15Mv^2$ and $K_{total}=\frac7{10}Mv^2$, so the fraction is $2/7\approx0.286$.
- id: q008
  title: Solid disk rotational energy
  type: numericResponse
  prompt: |-
    A solid disk has $M=6.0\text{ kg}$, $R=0.40\text{ m}$, and $\omega=10\text{ rad/s}$. What is $K_{rot}$?
  answer:
    value: 24.0
    tolerance: 0.3
  explanation: |-
    $I=\frac12MR^2=0.48$, so $K=\frac12(0.48)(10)^2=24\text{ J}$.
- id: q009
  title: Mass moved outward
  type: multipleChoice
  prompt: |-
    At the same angular speed, what happens to rotational kinetic energy when mass is moved farther from the axis?
  choices:
  - id: a
    text: |-
      It increases because $I$ increases.
  - id: b
    text: |-
      It decreases because $I$ decreases.
  - id: c
    text: |-
      It stays the same.
  - id: d
    text: |-
      It becomes zero.
  answer:
    choiceId: a
  explanation: |-
    At fixed $\omega$, $K_{rot}=\frac12I\omega^2$. Larger $I$ means larger energy.
- id: q010
  title: Cylinder rotational energy
  type: numericResponse
  prompt: |-
    A solid cylinder has $M=3.0\text{ kg}$, $R=0.20\text{ m}$, and $\omega=12\text{ rad/s}$. What is $K_{rot}$?
  answer:
    value: 4.32
    tolerance: 0.05
  explanation: |-
    $I=\frac12MR^2=0.060$, so $K=\frac12(0.060)(12)^2=4.32\text{ J}$.
- id: q011
  title: Rolling disk total energy
  type: numericResponse
  prompt: |-
    A $4.0\text{ kg}$ solid disk rolls without slipping at $5.0\text{ m/s}$. What is its total kinetic energy?
  answer:
    value: 75.0
    tolerance: 0.5
  explanation: |-
    For a disk, $K_{total}=\frac34Mv^2=\frac34(4)(25)=75\text{ J}$.
- id: q012
  title: Why rolling objects differ
  type: multipleChoice
  prompt: |-
    Why can two rolling objects with equal mass and speed have different total kinetic energies?
  choices:
  - id: a
    text: |-
      Their moments of inertia can differ.
  - id: b
    text: |-
      Their translational kinetic energies must differ.
  - id: c
    text: |-
      Gravity changes the formula.
  - id: d
    text: |-
      Radius never matters.
  answer:
    choiceId: a
  explanation: |-
    Rolling energy includes rotational kinetic energy, which depends on $I$.
- id: q013
  title: Energy change
  type: numericResponse
  prompt: |-
    A wheel with $I=2.0$ speeds up from $3.0$ to $6.0\text{ rad/s}$. What is $\Delta K_{rot}$?
  answer:
    value: 27.0
    tolerance: 0.2
  explanation: |-
    $\Delta K=\frac12I(\omega_f^2-\omega_i^2)=1(36-9)=27\text{ J}$.
- id: q014
  title: Angular speed after work
  type: numericResponse
  prompt: |-
    A motor adds $45\text{ J}$ to a wheel with $I=2.5\text{ kg}\cdot\text{m}^2$ initially at rest. What $\omega$ results?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $45=\frac12(2.5)\omega^2$, so $\omega=6.0\text{ rad/s}$.
- id: q015
  title: Rolling condition
  type: multipleChoice
  prompt: |-
    For rolling without slipping, which relationship connects $v$ and $\omega$?
  choices:
  - id: a
    text: |-
      $v=\omega R$
  - id: b
    text: |-
      $v=\alpha R$
  - id: c
    text: |-
      $K=I\omega$
  - id: d
    text: |-
      $I=MR$
  answer:
    choiceId: a
  explanation: |-
    Rolling without slipping requires $v=\omega R$.
