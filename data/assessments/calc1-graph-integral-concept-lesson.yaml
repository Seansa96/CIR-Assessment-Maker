lesson:
  introduction: |
    This lesson links derivative signs to graph shape and introduces integrals as signed accumulation from increasingly fine sums.
  sections:
  - id: first-second-derivative
    title: First and second derivatives
    required: true
    content: |
      $f'(x)$ controls increasing and decreasing behavior. $f''(x)$ controls concavity. Sign changes, not merely zeros, carry the classification.
    check:
      id: first-second-derivative-check
      type: selectAll
      prompt: |
        Which statements are reliable?
      choices:
      - id: a
        text: $f'>0$ suggests increasing.
      - id: b
        text: $f''>0$ suggests concave up.
      - id: c
        text: Every zero of $f''$ is automatically an inflection point.
      - id: d
        text: A sign change in $f'$ can classify a local extremum.
      answer:
        choiceIds:
        - a
        - b
        - d
      explanation: |
        Inflection requires actual concavity change; a zero alone is only a candidate.
  - id: riemann-sums
    title: Riemann sums
    required: true
    content: |
      A Riemann sum partitions an interval, samples function values, and adds rectangle contributions. Refining the partition leads to the definite integral when the function is integrable.
    check:
      id: riemann-sums-check
      type: multipleChoice
      prompt: |
        For $n$ equal pieces on $[a,b]$, what is $\Delta x$?
      choices:
      - id: a
        text: $\frac{b-a}{n}$
      - id: b
        text: $b-a+n$
      - id: c
        text: $n/(b-a)$
      - id: d
        text: $f(b)-f(a)$
      answer:
        choiceId: a
      explanation: |
        The interval length is divided into $n$ equal widths.
  - id: signed-area
    title: Signed area
    required: true
    content: |
      The definite integral counts area above the axis positively and area below the axis negatively. Total geometric area requires splitting or absolute value.
    check:
      id: signed-area-check
      type: multipleChoice
      prompt: |
        If $f(x)<0$ on an interval, how does that portion contribute to $\int f(x)\,dx$?
      choices:
      - id: a
        text: Negatively
      - id: b
        text: Positively
      - id: c
        text: It is ignored
      - id: d
        text: It becomes zero automatically
      answer:
        choiceId: a
      explanation: |
        Definite integrals measure signed accumulation.
