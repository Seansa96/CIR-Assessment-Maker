lesson:
  introduction: |-
    A **tangent** is a line that perfectly skims the edge of a circle, touching it at exactly one point (the point of tangency). Tangents have very special properties when interacting with radii and secants!
  sections:
  - id: sec-tangent-radius
    title: Tangents and Radii
    required: true
    content: |-
      The most important property of a tangent line is how it interacts with the center of the circle.
      
      **Tangent-Radius Theorem**: A line is tangent to a circle if and only if it is **perpendicular** to the radius drawn to the point of tangency.
      
      This means that whenever a tangent touches a circle, the angle formed by the tangent and the radius at that exact spot is a perfect $90^\circ$ angle. This property is incredibly useful because it allows us to form right triangles and use the Pythagorean Theorem!

  - id: sec-tangent-secant
    title: Tangent-Secant and Two-Tangent Theorems
    required: true
    content: |-
      What happens when a tangent intersects a secant outside the circle?
      
      **Tangent-Secant Theorem**: The product of the outer piece and whole piece of the secant equals the *square* of the tangent segment.
      $$\text{Tangent}^2 = \text{Outer} \times \text{Whole}$$
      (Notice how this is just the "Outer $\times$ Whole" rule from the previous lesson, but for a tangent, the "Outer" and the "Whole" are the exact same thing!)
      
      **Two-Tangent Theorem**: If two tangent segments are drawn to a circle from the exact same external point, those two tangent segments must be exactly equal in length.
      If tangents from external point $P$ touch the circle at $A$ and $B$, then $PA = PB$.

questions:
- id: q-geom-cst2-1
  title: Concept Check - Tangent-Secant Rule
  prompt: |-
    A secant and a tangent intersect at point $P$ outside a circle. The secant has an outer piece of $4$ and a whole length of $9$. What is the length of the tangent segment?
  type: numericResponse
  answer:
    numericValue: 6
    tolerance: 0
  explanation: |-
    $\text{Tangent}^2 = \text{Outer} \times \text{Whole}$
    $$T^2 = 4 \times 9$$
    $$T^2 = 36 \implies T = 6$$
  skills:
  - geometry-circle-chords-secants-tangents

- id: q-geom-cst2-2
  title: Concept Check - Tangents and Radii
  prompt: |-
    A tangent line touches a circle at point $A$. The center of the circle is point $O$, and the radius is $5$. A point $P$ lies on the tangent line such that the distance from $A$ to $P$ is $12$. What is the distance from the center $O$ to point $P$?
  type: numericResponse
  answer:
    numericValue: 13
    tolerance: 0
  explanation: |-
    The tangent line is perpendicular to the radius $OA$ at point $A$. This forms a right triangle $\triangle OAP$ where $OA = 5$ and $AP = 12$. The distance from $O$ to $P$ is the hypotenuse.
    Using the Pythagorean Theorem: $5^2 + 12^2 = c^2 \implies 25 + 144 = 169 \implies c = 13$.
  skills:
  - geometry-circle-chords-secants-tangents
