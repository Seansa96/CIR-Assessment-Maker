workedExamples:
- id: we01
  title: A circle as an implicit integral curve
  problem: Use $x^2+y^2=25$ with $y'=-x/y$ and initial point $(3,4)$.
  steps:
  - id: we01-s1
    title: Verify implicitly
    instruction: Differentiate the relation.
    type: freeResponse
    prompt: Show that its branches satisfy the ODE.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Implicit differentiation
      - Notes restriction
    explanation: |-
      Solution: $2x+2yy'=0$ gives $y'=-x/y$ wherever $y\ne0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Select the branch
    instruction: Use the sign of the initial value.
    type: freeResponse
    prompt: Write the explicit branch.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Chooses upper branch
      - Contains initial point
    explanation: |-
      Solution: $y=\sqrt{25-x^2}$ because the point has positive $y$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: State the interval
    instruction: Locate endpoints where the ODE fails.
    type: freeResponse
    prompt: Give the maximal IVP interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Open interval
      - Checks ODE domain
    explanation: |-
      Solution: $(-5,5)$; at the endpoints $y=0$ and $-x/y$ is undefined.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Build a local direction field
  problem: For $y'=x-y$, analyze slopes near the points $(0,1)$, $(1,1)$, and $(2,1)$.
  steps:
  - id: we02-s1
    title: Compute sample slopes
    instruction: Evaluate $f=x-y$ at each point.
    type: freeResponse
    prompt: List the three slopes.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Evaluates field
      - Keeps point order
    explanation: |-
      Solution: The slopes are $-1,0,1$, respectively.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Locate zero slopes
    instruction: Solve the slope-zero condition.
    type: freeResponse
    prompt: Find the horizontal-segment curve.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Solves condition
      - Identifies line
    explanation: |-
      Solution: $x-y=0$, so field segments are horizontal on $y=x$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Trace qualitatively
    instruction: Compare points above and below the zero-slope line.
    type: freeResponse
    prompt: Describe the local curve behavior.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Sign regions
      - Connects to curves
    explanation: |-
      Solution: Above $y=x$ slopes are negative; below it slopes are positive, so traced curves turn where they meet the line.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: A vertical tangent in parametric form
  problem: Compare $y'=x/y$ with $dx/dt=y$, $dy/dt=x$.
  steps:
  - id: we03-s1
    title: Recover the quotient
    instruction: Divide parametric rates where allowed.
    type: freeResponse
    prompt: Compute $dy/dx$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Uses quotient
      - States restriction
    explanation: |-
      Solution: $dy/dx=(dy/dt)/(dx/dt)=x/y$ when $y\ne0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Find the curve family
    instruction: Differentiate a conserved expression.
    type: freeResponse
    prompt: Show that $y^2-x^2$ is constant.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Differentiates invariant
      - Finds constant
    explanation: |-
      Solution: $d(y^2-x^2)/dt=2yx-2xy=0$, so $y^2-x^2=C$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Interpret $y=0$
    instruction: Evaluate the parametric vector there.
    type: freeResponse
    prompt: Explain the apparent singularity.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Evaluates vector
      - Identifies vertical tangent
    explanation: |-
      Solution: At $(x,0)$ with $x\ne0$, $dx/dt=0$ and $dy/dt=x$, so the curve has a vertical tangent although $dy/dx$ is undefined.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
