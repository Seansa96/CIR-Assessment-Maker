- id: l1-sec1
  title: The International System of Units
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: The International System of Units
    instruction: Electrical engineering is a quantitative discipline. We use the SI
      unit system. Important base units include the meter (length), kilogram (mass),
      second (time), ampere (electric current), kelvin (temperature), and candela
      (luminous intensity). Derived units include the coulomb (charge), volt (voltage),
      ohm (resistance), and watt (power).
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l1-sec2
  title: Voltage and Current
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Voltage and Current
    instruction: 'Current ($i$) is the rate of charge flow: $i = dq/dt$. It is measured
      in Amperes (A).

      Voltage ($v$) is the energy required to move a unit charge through an element:
      $v = dw/dq$. It is measured in Volts (V).

      An ideal basic circuit element has two terminals and is described completely
      by its voltage and current.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
