questions:
- id: q001
  type: freeResponse
  skills:
  - applied-integration
  - olympiad-problem-solving
  prompt: A random variable has density $f(x)=2x/9$ on $0\le x\le 3$. Find $P(X\le 3/2)$.
  answer:
    gradingMode: selfCheck
    expected: $1/4$.
    keyPoints:
    - 'Matches the reference result: $1/4$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: 'Integrate the density: $P(X\le 3/2)=\int_0^{3/2}2x/9dx=1/4$. The density is not itself a probability at a point.'
