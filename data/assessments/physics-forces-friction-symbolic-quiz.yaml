questions:
- id: forces-sym-static-wall
  title: Static Friction on a Wall
  type: symbolicResponse
  prompt: 'A block of mass $m$ is pushed against a vertical wall with a horizontal force $F$. What is the minimum coefficient of static friction $\mu_s$ required to keep the block from falling? (Let gravity be $g$).'
  answer:
    gradingMode: auto
    expectedLatex: (m*g)/F
    equivalenceMode: expression
    tolerance: 0
  explanation: 'The normal force is $N = F$. The maximum force of static friction is $f_s = \mu_s N = \mu_s F$. For the block not to fall, $f_s$ must equal gravity ($mg$). Therefore, $\mu_s F = mg$, so $\mu_s = mg/F$.'
- id: forces-sym-fluid-drag
  title: Terminal Velocity in Fluid
  type: symbolicResponse
  prompt: 'A sphere of radius $r$ falls through a fluid with viscosity $\eta$. According to Stokes'' law, the drag force is $6\pi\eta r v$. What is its terminal velocity $v_t$ if its effective mass (actual mass minus buoyant equivalent mass) is $M$?'
  answer:
    gradingMode: auto
    expectedLatex: (M*g)/(6*\pi*\eta*r)
    equivalenceMode: expression
    tolerance: 0
  explanation: 'At terminal velocity, the drag force equals the effective weight: $6\pi\eta r v_t = Mg$. Solving for $v_t$ gives $v_t = (Mg)/(6\pi\eta r)$.'
- id: forces-sym-atwood-tension
  title: Tension in an Atwood Machine
  type: symbolicResponse
  prompt: 'Two masses $m_1$ and $m_2$ (where $m_2 > m_1$) are hung over a massless, frictionless pulley. What is the tension $T$ in the string?'
  answer:
    gradingMode: auto
    expectedLatex: (2*m_1*m_2*g)/(m_1+m_2)
    equivalenceMode: expression
    tolerance: 0
  explanation: 'The acceleration is $a = g(m_2 - m_1)/(m_1 + m_2)$. Using Newton''s second law for $m_1$: $T - m_1 g = m_1 a$. Substituting $a$ yields $T = 2 m_1 m_2 g / (m_1 + m_2)$.'
- id: forces-sym-incline-friction
  title: Friction on an Incline
  type: symbolicResponse
  prompt: 'A block of mass $m$ slides down a rough incline of angle $\theta$ at a constant velocity. What is the coefficient of kinetic friction $\mu_k$?'
  answer:
    gradingMode: auto
    expectedLatex: \tan(\theta)
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Constant velocity means net force is zero. The component of gravity down the incline is $mg\sin\theta$. The friction force is $\mu_k mg\cos\theta$. Setting them equal gives $mg\sin\theta = \mu_k mg\cos\theta$, so $\mu_k = \sin\theta / \cos\theta = \tan\theta$.'
