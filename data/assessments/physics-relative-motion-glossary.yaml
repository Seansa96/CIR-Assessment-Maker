glossary:
  introduction: Use the frame labels before substituting numbers. Each term below identifies a relation, a component, or a condition that controls relative-motion calculations.
  sections:
  - id: frames-and-components
    title: Frames, components, and course correction
    required: true
    content: A velocity is always the motion of one object as measured from a stated observer. Use signed components to make the observer change and any route constraint explicit.
    entries:
    - id: relative-velocity
      term: Relative velocity
      definition: The velocity of one object as measured by a specified observer.
      notation: $\vec v_{A/B}$
      examples:
      - The car velocity relative to a truck is $\vec v_{C/T}$.
      aliases: []
      media: []
      tags:
      - reference-frame
      drills:
      - id: relative-velocity-cloze
        type: cloze
        prompt: In $\vec v_{A/B}$, object $A$ is measured relative to the ____ $B$.
        answer:
          expected: observer
          expectedLatex: ''
          aliases:
          - reference frame
          media: []
          choiceId: 
        explanation: >
          Solution: The missing word is “observer.”


          Why it works: The denominator in $\vec v_{A/B}$ names the frame from which A is measured.
        tags:
        - reference-frame
        skills: []
        choices: []
    - id: connecting-frame
      term: Connecting frame
      definition: A common reference frame used to relate two moving observers, often Earth or the ground.
      notation: $\vec v_{A/B}=\vec v_{A/E}-\vec v_{B/E}$
      examples:
      - Earth can connect a car and a truck velocity.
      aliases:
      - common reference frame
      media: []
      tags:
      - reference-frame
      drills:
      - id: connecting-frame-cloze
        type: cloze
        prompt: In $\vec v_{A/B}=\vec v_{A/E}-\vec v_{B/E}$, $E$ is the ____ frame.
        answer:
          expected: connecting
          expectedLatex: ''
          aliases:
          - common reference
          media: []
          choiceId: 
        explanation: >
          Solution: $E$ is the connecting frame.


          Why it works: Both velocities are first expressed relative to the same frame before the observer velocity is subtracted.
        tags:
        - reference-frame
        skills: []
        choices: []
    - id: signed-component
      term: Signed component
      definition: The scalar projection of a vector on a declared axis, including its positive or negative direction.
      notation: $v_x, v_y$
      examples:
      - With north positive y, a southward 6 m/s velocity has $v_y=-6$ m/s.
      aliases: []
      media: []
      tags:
      - components
      drills:
      - id: signed-component-cloze
        type: cloze
        prompt: If north is positive y, a southward velocity has a ____ y component.
        answer:
          expected: negative
          expectedLatex: ''
          aliases:
          - minus
          - '-'
          media: []
          choiceId: 
        explanation: >
          Solution: The component is negative.


          Why it works: A component's sign is set by its direction relative to the chosen positive axis.
        tags:
        - components
        skills: []
        choices: []
    - id: zero-drift-condition
      term: Zero-drift condition
      definition: The requirement that a ground-velocity component perpendicular to the desired route equals zero.
      notation: $v_{ground,x}=0$
      examples:
      - A boat cancels an eastward current with an equal westward water-relative component.
      aliases:
      - course-correction constraint
      media: []
      tags:
      - course-correction
      drills:
      - id: zero-drift-cloze
        type: cloze
        prompt: To land directly across a river, the unwanted ground component must equal ____.
        answer:
          expected: 0
          expectedLatex: 0
          aliases:
          - zero
          media: []
          choiceId: 
        explanation: >
          Solution: Set the unwanted component equal to $0$.


          Why it works: A zero cross-track ground velocity prevents downstream or sideways drift.
        tags:
        - course-correction
        skills: []
        choices: []
