workedExamples:
- id: example-001
  title: Build the representation
  problem: For $f(x,y)=x^2y+3y^2$, find $f_x$ and $f_y$.
  steps:
  - id: s001
    title: Differentiate in x
    instruction: What is $f_x$?
    type: multipleChoice
    prompt: What is $f_x$?
    choices:
    - id: a
      text: $2xy$
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: product-rule-misapplied
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: product-rule-misapplied
    answer:
      choiceId: a
    issueSignals:
    - id: product-rule-misapplied
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $2xy$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
      Calculus.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
