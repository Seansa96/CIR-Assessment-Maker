  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Double Integrals if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Boundary becomes region
    required: true
    content: "Green's Theorem relates a planar closed-curve integral to a double integral over its interior. In Green's Theorem, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object."
