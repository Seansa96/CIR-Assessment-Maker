lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Double Integrals if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Boundary becomes region
    required: true
    content: "Green's Theorem relates a planar closed-curve integral to a double integral over its interior. In Green's Theorem, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object."
    media:
    - type: image
      src: /media/calculus-3/greens-theorem.svg
      alt: Original green's theorem reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What kind of curve is used in Green's Theorem?
      choices:
      - id: a
        text: a closed plane curve
        media: []
        issueSignals: []
      - id: b
        text: counterclockwise (answers 'What is positive orientation?', not 'What kind of curve is used in Green's Theorem?')
        media: []
        issueSignals:
        - id: greens-theorem-orientation-error
          domains: []
      - id: c
        text: the interior region (answers 'What region is used on the right side?', not 'What kind of curve is used in Green's Theorem?')
        media: []
        issueSignals:
        - id: greens-theorem-orientation-error
          domains: []
      - id: d
        text: Green's Theorem (answers 'What theorem connects a boundary and a double integral?', not 'What kind of curve is used in Green's Theorem?')
        media: []
        issueSignals:
        - id: greens-theorem-orientation-error
          domains: []
      answer:
