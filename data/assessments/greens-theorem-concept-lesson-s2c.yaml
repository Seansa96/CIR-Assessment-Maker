  - id: s02
    title: Positive orientation is counterclockwise
    required: true
    content: Traverse a positively oriented boundary so the region remains on the left. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
