workedExamples:
- id: aops-complex-numbers-problem-1
  title: Standard form and a large power of i
  problem: |-
    Write the following expression in standard form:

    $$
    (2-3i)^2+i^{2026}.
    $$
  steps:
  - id: aops-complex-numbers-p1-s1
    title: Separate the two structures
    instruction: |-
      The expression combines a binomial square and a large power of $i$. Expand the square with distributivity, but handle the isolated power using the period-four cycle. Keeping the methods separate reduces sign mistakes.
    type: multipleChoice
    prompt: Which plan matches the structure?
    choices:
    - id: a
      text: Expand $(2-3i)^2$ and reduce 2026 modulo 4.
    - id: b
      text: Add 2026 to the exponent 2.
    - id: c
      text: Replace every occurrence of $i$ by $-1$.
    - id: d
      text: Take the modulus of both terms.
    answer:
      choiceId: a
    explanation: The binomial and the isolated power require different, standard operations.
  - id: aops-complex-numbers-p1-s2
    title: Expand the binomial completely
    instruction: |-
      Use $(a+b)^2=a^2+2ab+b^2$:

      $$
      (2-3i)^2=4-12i+9i^2.
      $$

      The middle term $-12i$ is essential; squaring the terms separately would omit it.
    type: multipleChoice
    prompt: Which expansion is correct before simplifying $i^2$?
    choices:
    - id: a
      text: '$4+9i^2$'
    - id: b
      text: '$4-12i+9i^2$'
    - id: c
      text: '$4-6i+9i^2$'
    - id: d
      text: '$4+12i-9i^2$'
    answer:
      choiceId: b
    explanation: Twice the product of 2 and $-3i$ is $-12i$.
  - id: aops-complex-numbers-p1-s3
    title: Use the defining relation
    instruction: |-
      Substitute $i^2=-1$:

      $$
      4-12i+9i^2=4-12i-9=-5-12i.
      $$
    type: multipleChoice
    prompt: What is $(2-3i)^2$ in standard form?
    choices:
    - id: a
      text: '$13-12i$'
    - id: b
      text: '$-5-12i$'
    - id: c
      text: '$-5+12i$'
    - id: d
      text: '$4-12i$'
    answer:
      choiceId: b
    explanation: The $9i^2$ term contributes $-9$ to the real component.
  - id: aops-complex-numbers-p1-s4
    title: Reduce the large exponent modulo four
    instruction: |-
      Since $2026=4(506)+2$,

      $$i^{2026}=i^2=-1.$$

      Add this real number to the expanded square:

      $$(-5-12i)+(-1)=-6-12i.$$
    type: multipleChoice
    prompt: What remainder controls $i^{2026}$?
    choices:
    - id: a
      text: '0'
    - id: b
      text: '1'
    - id: c
      text: '2'
    - id: d
      text: '3'
    answer:
      choiceId: c
    explanation: The cycle has period four, and remainder 2 corresponds to $i^2=-1$.
  - id: aops-complex-numbers-p1-s5
    title: Check standard form and components
    instruction: |-
      The result $-6-12i$ has one real component and one imaginary component, so it is in standard form. A component check confirms that adding $-1$ changed only the real part of $-5-12i$.
    type: multipleChoice
    prompt: What are the real and imaginary parts of the final result?
    choices:
    - id: a
      text: Real part $-6$, imaginary part $-12$
    - id: b
      text: Real part $-6$, imaginary part $-12i$
    - id: c
      text: Real part $-12$, imaginary part $-6$
    - id: d
      text: Real part 6, imaginary part 12
    answer:
      choiceId: a
    explanation: In $a+bi$, the imaginary part is the real coefficient $b$, not the term $bi$.
- id: aops-complex-numbers-problem-2
  title: Dividing with a conjugate
  problem: |-
    Write the quotient in standard form:

    $$
    \frac{8+6i}{2-i}.
    $$
  steps:
  - id: aops-complex-numbers-p2-s1
    title: Identify the denominator conjugate
    instruction: |-
      The conjugate of $2-i$ is $2+i$. Multiplying numerator and denominator by the same nonzero number preserves the quotient, while the denominator becomes real.
    type: multipleChoice
    prompt: Which form of 1 should be used?
    choices:
    - id: a
      text: '$\dfrac{2+i}{2+i}$'
    - id: b
      text: '$\dfrac{2-i}{2-i}$'
    - id: c
      text: '$\dfrac{8-6i}{8-6i}$'
    - id: d
      text: '$\dfrac{i}{i}$'
    answer:
      choiceId: a
    explanation: Use the conjugate of the denominator, changing only its imaginary sign.
  - id: aops-complex-numbers-p2-s2
    title: Make the denominator real
    instruction: |-
      Compute the conjugate product:

      $$(2-i)(2+i)=2^2+1^2=5.$$

      The cross terms cancel, and $-i^2$ contributes $+1$.
    type: multipleChoice
    prompt: What is the new denominator?
    choices:
    - id: a
      text: '$3$'
    - id: b
      text: '$4$'
    - id: c
      text: '$5$'
    - id: d
      text: '$4+i$'
    answer:
      choiceId: c
    explanation: A number times its conjugate equals the sum of the squares of its components.
  - id: aops-complex-numbers-p2-s3
    title: Expand the numerator
    instruction: |-
      Distribute carefully:

      $$
      (8+6i)(2+i)=16+8i+12i+6i^2=10+20i.
      $$

      The real part is $16-6=10$, and the imaginary terms combine to $20i$.
    type: multipleChoice
    prompt: Which numerator is correct after using $i^2=-1$?
    choices:
    - id: a
      text: '$22+20i$'
    - id: b
      text: '$10+20i$'
    - id: c
      text: '$10+14i$'
    - id: d
      text: '$16+26i$'
    answer:
      choiceId: b
    explanation: The last product is $6i^2=-6$.
  - id: aops-complex-numbers-p2-s4
    title: Divide both components by the real denominator
    instruction: |-
      Now divide by 5:

      $$
      \frac{10+20i}{5}=2+4i.
      $$

      Because the denominator is real, divide both the real and imaginary components by it.
    type: multipleChoice
    prompt: What is the quotient in standard form?
    choices:
    - id: a
      text: '$2+4i$'
    - id: b
      text: '$2+20i$'
    - id: c
      text: '$10+4i$'
    - id: d
      text: '$\frac25+\frac45i$'
    answer:
      choiceId: a
    explanation: Divide each numerator component by 5.
  - id: aops-complex-numbers-p2-s5
    title: Verify by reversing the division
    instruction: |-
      Multiply the proposed quotient by the original denominator:

      $$
      (2+4i)(2-i)=4-2i+8i-4i^2=8+6i.
      $$

      This recovers the original numerator, verifying the quotient.
    type: multipleChoice
    prompt: What is the strongest direct verification of a proposed quotient $q=w/v$?
    choices:
    - id: a
      text: Check that $qv=w$.
    - id: b
      text: Check that $q+w=v$.
    - id: c
      text: Compare only the real parts.
    - id: d
      text: Take the conjugate of $q$.
    answer:
      choiceId: a
    explanation: Multiplication by the divisor reverses division.
- id: aops-complex-numbers-problem-3
  title: Finding every square root of a nonreal number
  problem: |-
    Find all complex numbers $z$ satisfying

    $$z^2=8i.$$
  steps:
  - id: aops-complex-numbers-p3-s1
    title: Introduce real component variables
    instruction: |-
      Write $z=a+bi$ with real $a,b$. This standard form lets us convert complex equality into two real equations.
    type: multipleChoice
    prompt: Why introduce both $a$ and $b$?
    choices:
    - id: a
      text: A general complex number has independent real and imaginary components.
    - id: b
      text: Every complex number is purely imaginary.
    - id: c
      text: The variables force $z$ to be positive.
    - id: d
      text: The equation has no real coefficients.
    answer:
      choiceId: a
    explanation: Standard form represents every complex candidate without prematurely discarding a component.
  - id: aops-complex-numbers-p3-s2
    title: Expand and compare components
    instruction: |-
      Squaring gives

      $$
      (a+bi)^2=(a^2-b^2)+2abi.
      $$

      Since $8i=0+8i$, equality requires

      $$a^2-b^2=0,\qquad 2ab=8.$$
    type: multipleChoice
    prompt: Which system is correct?
    choices:
    - id: a
      text: '$a^2+b^2=8$ and $2ab=0$'
    - id: b
      text: '$a^2-b^2=0$ and $2ab=8$'
    - id: c
      text: '$a+b=0$ and $ab=8$'
    - id: d
      text: '$a^2-b^2=8$ and $2ab=0$'
    answer:
      choiceId: b
    explanation: Match the real component to 0 and the imaginary coefficient to 8.
  - id: aops-complex-numbers-p3-s3
    title: Split the real-component equation into cases
    instruction: |-
      Factor $a^2-b^2=0$:

      $$(a-b)(a+b)=0.$$

      Therefore either $a=b$ or $a=-b$. Both cases must be tested against $2ab=8$.
    type: multipleChoice
    prompt: What follows from $a^2=b^2$ for real $a,b$?
    choices:
    - id: a
      text: '$a=b$ only'
    - id: b
      text: '$a=-b$ only'
    - id: c
      text: '$a=b$ or $a=-b$'
    - id: d
      text: '$a=b=0$'
    answer:
      choiceId: c
    explanation: Equal squares allow equal or opposite real values.
  - id: aops-complex-numbers-p3-s4
    title: Solve the admissible case
    instruction: |-
      If $a=b$, then $2ab=2a^2=8$, so $a^2=4$ and $a=b=2$ or $a=b=-2$. If $a=-b$, then $2ab=-2a^2\le0$, so it cannot equal 8.

      The candidates are $2+2i$ and $-2-2i$.
    type: multipleChoice
    prompt: Why does the case $a=-b$ fail?
    choices:
    - id: a
      text: It makes $2ab=-2a^2$, which cannot be positive 8.
    - id: b
      text: It makes both components zero.
    - id: c
      text: Opposite components are not complex numbers.
    - id: d
      text: It violates $i^2=-1$.
    answer:
      choiceId: a
    explanation: For real $a$, the quantity $-2a^2$ is nonpositive.
  - id: aops-complex-numbers-p3-s5
    title: Verify both roots and completeness
    instruction: |-
      Directly square one candidate:

      $$(2+2i)^2=4+8i+4i^2=8i.$$

      Negating a square root does not change its square, so $(-2-2i)^2=8i$ as well. The component system exhausted both cases from $a^2-b^2=0$, so no roots were omitted.
    type: multipleChoice
    prompt: Which statement completes the solution argument?
    choices:
    - id: a
      text: Both candidates verify, and the component cases cover every $a+bi$.
    - id: b
      text: One verified candidate is enough to prove uniqueness.
    - id: c
      text: Every complex number squares to $8i$.
    - id: d
      text: Only the root with positive real part should be kept.
    answer:
      choiceId: a
    explanation: Verification establishes validity, while the exhaustive component cases establish completeness.
