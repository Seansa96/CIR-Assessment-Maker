  prompt: 'Show that $\int_0^1[1/(x\sqrt{1-x})]dx$ diverges, even though the singularity at x=1 alone is integrable.'
  answer: { gradingMode: selfCheck, checkModel: 'It diverges because near zero the integrand is at least 1/x, so comparison with the divergent endpoint harmonic form applies.' }
  explanation: 'Split at a convenient interior point. On the left portion, square root of one minus x is at most one, so the integrand is at least 1/x; the zero-endpoint singularity decides divergence despite the mild other endpoint.'
  difficultyDimensions: [casePartition, proofJustification, errorDiagnosis]
  difficultyEvidence: Separates competing endpoint behaviors, constructs a local lower comparison, and rejects the inference that one integrable singularity decides the whole integral.
  prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate, calc2-improper-classify-by-comparison]
