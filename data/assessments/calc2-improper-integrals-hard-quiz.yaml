  prompt: 'For which p does $\int_0^1x^p/(1-x)^{1/2}\,dx$ converge? Analyze both endpoint behaviors.'
  answer: { gradingMode: selfCheck, checkModel: 'It converges for p>-1.' }
  explanation: 'Near x equals one, the denominator creates an exponent one-half singularity, which is integrable. Near zero the integrand behaves like x to p, and the endpoint p-test requires p>-1.'
  difficultyDimensions: [casePartition, parameterThreshold, representationTransfer]
  difficultyEvidence: Separates two endpoint regimes, identifies different local benchmark powers, and solves the only restrictive exponent condition.
  prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate, calc2-improper-classify-by-comparison]
