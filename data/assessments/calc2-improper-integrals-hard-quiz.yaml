  prompt: 'Determine whether $\int_0^1\ln(1/x)/\sqrt{x}\,dx$ converges. Use a substitution that makes the endpoint behavior visible.'
  answer: { gradingMode: selfCheck, checkModel: 'It converges; with x=u squared it becomes an integral proportional to u times ln(1/u), which is finite near zero.' }
  explanation: 'Set x equal to u squared so dx equals 2u du and the square-root singularity cancels. The transformed integrand is -4u ln u, whose antiderivative has a finite zero-endpoint limit.'
  difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, domainCondition]
  difficultyEvidence: Chooses a non-obvious substitution, derives the transformed differential, and checks the resulting endpoint limit.
  prerequisiteObjectiveIds: [calc2-u-substitution, calc2-improper-split-and-evaluate]
