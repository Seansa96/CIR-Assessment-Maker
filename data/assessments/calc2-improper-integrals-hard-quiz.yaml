  prompt: 'Construct a positive function f on [1,infinity) that is smaller than 1/x eventually but whose improper integral still diverges.'
  answer: { gradingMode: selfCheck, checkModel: 'For example f(x)=1/[x ln x] for x at least 2; its integral diverges after u=ln x.' }
  explanation: 'The comparison direction matters: being smaller than a divergent benchmark proves nothing. The logarithmic example is strictly smaller than 1/x for large x, yet its transformed integral is the divergent 1/u tail.'
  difficultyDimensions: [counterexampleOrConstruction, reverseReasoning, errorDiagnosis]
  difficultyEvidence: Works backward from a failed inference, constructs a logarithmic counterexample, and proves its divergence by a second method.
  extensionObjectiveIds: [calc2-logarithmic-integrals]
