  prompt: 'For real p, classify $\int_1^\infty x^p/(1+x^3)\,dx$.'
  answer: { gradingMode: selfCheck, checkModel: 'Converges for p<2 and diverges for p at least 2.' }
  explanation: 'At infinity the integrand is asymptotic to x to the p minus three. The tail p-test requires p minus three to be less than negative one, giving p<2; at p=2 the integrand is harmonic-size.'
  difficultyDimensions: [simplification, parameterThreshold, representationTransfer]
  difficultyEvidence: Extracts asymptotic power behavior, solves an exponent inequality, and treats the boundary as a distinct p-test case.
  prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison, calc2-limit-comparison]
