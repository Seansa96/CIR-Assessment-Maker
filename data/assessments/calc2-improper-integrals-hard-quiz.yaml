  prompt: 'Determine whether $\int_0^\infty xe^{-x}\,dx$ converges and evaluate it.'
  answer: { gradingMode: selfCheck, checkModel: 'It converges and equals 1.' }
  explanation: 'There is no problem at zero; only the infinite tail is improper. Integration by parts gives $[-xe^{-x}-e^{-x}]_0^\infty$, and exponential decay forces the upper expression to zero.'
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition]
  difficultyEvidence: Identifies the only defective boundary, chains integration by parts with an exponential limit, and evaluates the finite endpoint separately.
  prerequisiteObjectiveIds: [calc2-integration-by-parts, calc2-improper-identify-and-limit]
