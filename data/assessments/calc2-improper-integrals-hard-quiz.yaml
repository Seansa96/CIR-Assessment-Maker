  prompt: 'Classify $\int_2^\infty1/[x(\ln x)^p]dx$ for all real p.'
  answer: { gradingMode: selfCheck, checkModel: 'Converges for p>1 and diverges for p at most 1.' }
  explanation: 'With u equal to ln x, the tail becomes integral of u to the negative p. The transformed p-test has its usual infinite-tail threshold p>1, so the logarithmic factor controls the boundary.'
  difficultyDimensions: [auxiliaryTechnique, parameterThreshold, representationTransfer]
  difficultyEvidence: Transforms a logarithmic boundary form, transfers to a standard p-test, and partitions the parameter range at its threshold.
  prerequisiteObjectiveIds: [calc2-u-substitution, calc2-improper-classify-by-comparison]
