  prompt: 'Prove that $\int_1^\infty\sin x/x^2\,dx$ converges absolutely without trying to find its exact value.'
  answer: { gradingMode: selfCheck, checkModel: 'Since absolute value of sin x is at most 1, absolute value of sin x divided by x squared is at most 1/x squared; comparison proves absolute convergence.' }
  explanation: 'Take absolute values first. The bounded sine factor becomes irrelevant under the estimate, and the remaining x to the negative two tail is convergent, which proves the stronger absolute conclusion.'
  difficultyDimensions: [representationTransfer, proofJustification, auxiliaryTechnique]
  difficultyEvidence: Changes to an absolute-value problem, constructs a uniform bound, and invokes comparison to prove a stronger convergence mode.
  prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison]
