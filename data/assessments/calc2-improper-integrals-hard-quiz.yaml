  prompt: 'Use limit comparison to classify $\int_1^\infty(5x^3-2)/(x^5+x+1)\,dx$.'
  answer: { gradingMode: selfCheck, checkModel: 'It converges; the integrand is asymptotic to 5/x squared.' }
  explanation: 'Divide by the benchmark 1/x squared. The ratio equals x squared times the integrand and tends to 5, a positive finite constant, so it has the same convergent behavior as the p equals two tail.'
  difficultyDimensions: [simplification, representationTransfer, proofJustification]
  difficultyEvidence: Selects a leading-term benchmark, forms a limit-comparison ratio, and infers the convergence classification from its positive finite limit.
  prerequisiteObjectiveIds: [calc2-limit-comparison]
