  prompt: 'Explain why $\int_{-1}^1 1/x\,dx$ diverges as an ordinary improper integral even though its symmetric principal value is zero.'
  answer: { gradingMode: selfCheck, checkModel: 'The left and right one-sided integrals each diverge; ordinary convergence requires both finite independently. Symmetric cancellation defines only a principal value.' }
  explanation: 'Split at zero. The logarithmic antiderivative tends to negative infinity on the left and positive infinity on the right, so neither component is finite; pairing the cutoffs changes the definition.'
  difficultyDimensions: [casePartition, errorDiagnosis, proofJustification]
  difficultyEvidence: Splits at an interior singularity, diagnoses a misleading cancellation argument, and contrasts two different limiting definitions.
  prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate]
