lesson:
  introduction: |-
    We've learned how to find the area of a "slice of pie" (a sector). Now, we will look at two related measurements: finding the physical length of the crust (Arc Length) and finding the area of just the tip of the slice (a Segment).
  sections:
  - id: sec-arc-length
    title: Arc Length
    required: true
    content: |-
      Don't confuse the *measure* of an arc (which is in degrees) with the **arc length** (which is a physical distance, like centimeters or inches). 
      
      Arc length is simply a fraction of the circle's total circumference!
      
      Just like we did for sector area, we take the fraction of the circle $\frac{x}{360}$ and multiply it by the circumference $2\pi r$.
      
      **Arc Length Formula**:
      $$\text{Arc Length} = \frac{x}{360} \times 2\pi r$$

  - id: sec-segment-area
    title: Area of a Segment
    required: true
    content: |-
      A **segment of a circle** (not to be confused with a line segment) is the region bounded by an arc and the chord connecting the endpoints of that arc. It looks like the curved edge of the pizza slice if you cut the pointy tip off.
      
      To find the area of a segment, you use a combination of circle area and triangle area.
      
      **Segment Area Method**:
      1. Find the area of the entire sector (the whole pizza slice).
      2. Find the area of the triangle formed by the two radii and the chord (the pointy tip).
      3. Subtract the triangle's area from the sector's area!
      
      $$\text{Area of Segment} = \text{Area of Sector} - \text{Area of Triangle}$$

questions:
- id: q-geom-area-sec2-1
  title: Concept Check - Arc Length vs Arc Measure
  prompt: |-
    Two concentric circles (one small, one large) share the same center. You draw an angle of $60^\circ$ from the center, which cuts an arc on both circles. Which of the following is true?
  type: multipleChoice
  choices:
  - id: c1
    text: The two arcs have the same arc length, but different degree measures.
  - id: c2
    text: The two arcs have the same degree measure, but different arc lengths.
  - id: c3
    text: Both the degree measures and the arc lengths are exactly the same.
  answer:
    choiceId: c2
  explanation: |-
    Because they share the same central angle of $60^\circ$, both arcs have a **degree measure** of $60^\circ$. However, because the outer circle has a much larger circumference, that $60^\circ$ slice has a much longer physical **arc length**!
  skills:
  - geometry-circle-area-sectors-segments

- id: q-geom-area-sec2-2
  title: Concept Check - Segment Area Strategy
  prompt: |-
    If you want to find the area of a segment bounded by a $90^\circ$ arc in a circle of radius $r$, what shape are you subtracting from the sector?
  type: multipleChoice
  choices:
  - id: c1
    text: An equilateral triangle
  - id: c2
    text: A right triangle
  - id: c3
    text: A smaller sector
  answer:
    choiceId: c2
  explanation: |-
    The segment area is found by subtracting the triangle formed by the radii and the chord from the total sector area. Because the central angle is $90^\circ$, the two radii form a **right triangle**!
  skills:
  - geometry-circle-area-sectors-segments
