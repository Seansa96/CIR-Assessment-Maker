questions:
- id: q001
  type: multipleChoice
  prompt: 'Solve $2(x+1)-3=5x-6$.'
  choices:
  - id: a
    text: '$x=\frac53$'
  - id: b
    text: '$x=-\frac53$'
  - id: c
    text: '$x=3$'
  - id: d
    text: '$x=1$'
  answer:
    choiceId: a
  explanation: The equation simplifies to $2x-1=5x-6$, then $5=3x$.
- id: q002
  type: multipleChoice
  prompt: 'Solve $|x-4|=7$.'
  choices:
  - id: a
    text: '$x=11$ only'
  - id: b
    text: '$x=-3$ only'
  - id: c
    text: '$x=11$ or $x=-3$'
  - id: d
    text: '$x=3$ or $x=-11$'
  answer:
    choiceId: c
  explanation: The two branches are $x-4=7$ and $x-4=-7$.
- id: q003
  type: multipleChoice
  prompt: 'Classify $(a-1)x=a^2-1$ for real $a$.'
  choices:
  - id: a
    text: '$x=a+1$ for every $a$'
  - id: b
    text: '$x=a+1$ for $a\ne1$; every real $x$ for $a=1$'
  - id: c
    text: '$x=a-1$ for $a\ne1$; no solution for $a=1$'
  - id: d
    text: No solution for every $a$
  answer:
    choiceId: b
  explanation: Factor $a^2-1=(a-1)(a+1)$. At $a=1$, the equation is $0=0$ rather than a legal cancellation.
- id: q004
  type: multipleChoice
  prompt: 'For which $a$ does $(a-1)x=a+1$ have no solution?'
  choices:
  - id: a
    text: '$a=-1$'
  - id: b
    text: '$a=0$'
  - id: c
    text: '$a=1$'
  - id: d
    text: It never has no solution.
  answer:
    choiceId: c
  explanation: At $a=1$, the equation becomes $0=2$.
- id: q005
  type: multipleChoice
  prompt: 'Solve $\dfrac{x}{2}+\dfrac{y}{3}=4$ and $x+y=9$.'
  choices:
  - id: a
    text: '$(x,y)=(3,6)$'
  - id: b
    text: '$(x,y)=(6,3)$'
  - id: c
    text: '$(x,y)=(4,5)$'
  - id: d
    text: '$(x,y)=(5,4)$'
  answer:
    choiceId: b
  explanation: Multiplying the first equation by 6 gives $3x+2y=24$; subtracting twice $x+y=9$ gives $x=6$.
- id: q006
  type: multipleChoice
  prompt: 'Classify the system $x+y=4$ and $2x+2y=11$.'
  choices:
  - id: a
    text: One solution
  - id: b
    text: No solution
  - id: c
    text: Infinitely many solutions
  - id: d
    text: The classification depends on $x$.
  answer:
    choiceId: b
  explanation: Doubling the first equation gives $2x+2y=8$, which contradicts the second equation.
- id: q007
  type: multipleChoice
  prompt: 'Find the intersection of $y=2x+1$ and $y=7-x$.'
  choices:
  - id: a
    text: '$(1,3)$'
  - id: b
    text: '$(2,5)$'
  - id: c
    text: '$(3,4)$'
  - id: d
    text: '$(5,2)$'
  answer:
    choiceId: b
  explanation: |-
    Set the two expressions for $y$ equal: $2x+1=7-x$, giving $x=2$ and $y=5$.
- id: q008
  type: multipleChoice
  prompt: 'A theater sells 23 tickets. Adult tickets cost $12 and child tickets cost $7. Total revenue is $221. How many of each were sold?'
  choices:
  - id: a
    text: 12 adult and 11 child tickets
  - id: b
    text: 11 adult and 12 child tickets
  - id: c
    text: 14 adult and 9 child tickets
  - id: d
    text: 10 adult and 13 child tickets
  answer:
    choiceId: a
  explanation: With $a+c=23$ and $12a+7c=221$, substitution gives $a=12$ and $c=11$.
- id: q009
  type: multipleChoice
  prompt: 'Two consecutive odd integers sum to 64. What are they?'
  choices:
  - id: a
    text: 30 and 34
  - id: b
    text: 31 and 33
  - id: c
    text: 32 and 32
  - id: d
    text: 29 and 35
  answer:
    choiceId: b
  explanation: Let the integers be $n$ and $n+2$; then $2n+2=64$ gives $n=31$.
- id: q010
  type: multipleChoice
  prompt: 'A cyclist rides for 3 hours, partly at 12 mph and partly at 18 mph, covering 48 miles. How long is spent at 18 mph?'
  choices:
  - id: a
    text: 1 hour
  - id: b
    text: 2 hours
  - id: c
    text: 2.5 hours
  - id: d
    text: 3 hours
  answer:
    choiceId: b
  explanation: If $t$ is time at 18 mph, then $18t+12(3-t)=48$, giving $t=2$.
- id: q011
  type: multipleChoice
  prompt: 'Classify the system $kx+y=2$ and $x+y=2$.'
  choices:
  - id: a
    text: One solution $(0,2)$ for $k\ne1$; infinitely many solutions for $k=1$
  - id: b
    text: No solution for $k=1$
  - id: c
    text: One solution $(2,0)$ for every $k$
  - id: d
    text: Infinitely many solutions for every $k$
  answer:
    choiceId: a
  explanation: Subtracting equations gives $(k-1)x=0$. When $k\ne1$, $x=0,y=2$; at $k=1$, the equations coincide.
- id: q012
  type: multipleChoice
  prompt: 'Solve $x(x-5)=2x$ without discarding the zero case.'
  choices:
  - id: a
    text: '$x=7$ only'
  - id: b
    text: '$x=0$ only'
  - id: c
    text: '$x=0$ or $x=7$'
  - id: d
    text: '$x=0$ or $x=5$'
  answer:
    choiceId: c
  explanation: Move all terms to obtain $x(x-7)=0$, then apply the zero-product property.
- id: q013
  type: selectAll
  prompt: 'Which ordered pairs satisfy both $2x+y=7$ and $x-y=2$?'
  choices:
  - id: a
    text: '$(3,1)$'
  - id: b
    text: '$(2,3)$'
  - id: c
    text: '$(4,-1)$'
  - id: d
    text: '$(1,5)$'
  answer:
    choiceIds:
    - a
  explanation: Only $(3,1)$ gives 7 in the first equation and 2 in the second.
- id: q014
  type: selectAll
  prompt: 'Select every statement that correctly describes equation solving.'
  choices:
  - id: a
    text: Adding the same expression to both sides preserves the solution set.
  - id: b
    text: Dividing by a variable expression requires checking its zero case.
  - id: c
    text: A true identity after simplification means no solution.
  - id: d
    text: A candidate from a model must satisfy the original context.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: A true identity ordinarily gives every value in the domain, not no solution.
- id: q015
  type: freeResponse
  prompt: |-
    Prove that an equation simplifying to $ax=b$ has at most one real solution when $a\ne0$. Explain why the condition $a\ne0$ is necessary.
  answer:
    gradingMode: selfCheck
    expected: |-
      Since $a\ne0$, division by $a$ is reversible and gives the unique candidate $x=b/a$. If two values solved the equation, both would equal $b/a$, so they would be the same. The condition is necessary because when $a=0$, the equation becomes either $0=b$ with no solution if $b\ne0$, or $0=0$ with infinitely many solutions if $b=0$.
    keyPoints:
    - Uses reversible division by nonzero $a$.
    - Establishes uniqueness of $b/a$.
    - Explains both possible classifications when $a=0$.
  explanation: The coefficient restriction separates the unique-solution case from identities and contradictions.
