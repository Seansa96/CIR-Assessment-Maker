directedProject:
  summary: >-
    Write three small programs that isolate conditional logic. You will
    practice if, else if, else, comparison operators, and the logical
    operators && and ||.
  estimatedTimeMinutes: 10
  resources: []
  phases:
    - id: phase-1-positive-negative
      title: "Positive, Negative, or Zero"
      steps:
        - id: step-1-sign
          title: "Check the Sign of a Number"
          instruction: |
            Create a new C++ console project named `IfElseDrill`.

            Write a program that reads an integer and classifies it:

            ```cpp
            #include <iostream>
            using namespace std;

            int main() {
                int number;
                cout << "Enter an integer: ";
                cin >> number;

                if (number > 0) {
                    cout << number << " is positive." << endl;
                } else if (number < 0) {
                    cout << number << " is negative." << endl;
                } else {
                    cout << number << " is zero." << endl;
                }

                return 0;
            }
            ```

            Build and test with three values: a positive number, a negative number,
            and zero. Make sure each branch executes.
          checklist:
            - id: chk-positive
              text: "Tested with a positive number"
            - id: chk-negative
              text: "Tested with a negative number"
            - id: chk-zero
              text: "Tested with zero"
          resources: []

    - id: phase-2-grades
      title: "Letter Grade Classifier"
      steps:
        - id: step-2-grades
          title: "Classify a Test Score"
          instruction: |
            Replace your `main()` with a program that converts a numeric score
            to a letter grade using chained `if/else if`:

            ```cpp
            int main() {
                int score;
                cout << "Enter your test score (0-100): ";
                cin >> score;

                if (score >= 90) {
                    cout << "Grade: A" << endl;
                } else if (score >= 80) {
                    cout << "Grade: B" << endl;
                } else if (score >= 70) {
                    cout << "Grade: C" << endl;
                } else if (score >= 60) {
                    cout << "Grade: D" << endl;
                } else {
                    cout << "Grade: F" << endl;
                }

                return 0;
            }
            ```

            Test with boundary values: 90, 89, 80, 79, 70, 69, 60, 59, 100, 0.

            **Key insight:** The order matters. Because we check `>= 90` first,
            a score of 95 matches immediately and skips all later checks. If we
            checked `>= 60` first, every passing score would get a D.
          notesPrompt: "What grade does 90 get? What about 89?"
          checklist:
            - id: chk-boundaries
              text: "Tested boundary values (90, 89, 80, 79, etc.)"
            - id: chk-order
              text: "Understood why the order of conditions matters"
          resources: []

    - id: phase-3-logical
      title: "Logical Operators"
      steps:
        - id: step-3-voting
          title: "Voting Eligibility Check"
          instruction: |
            Replace your `main()` with a program that checks voting eligibility
            using logical operators `&&` (and) and `||` (or):

            ```cpp
            int main() {
                int age;
                char citizenInput;
                bool isCitizen;

                cout << "Enter your age: ";
                cin >> age;
                cout << "Are you a citizen? (y/n): ";
                cin >> citizenInput;

                isCitizen = (citizenInput == 'y' || citizenInput == 'Y');

                if (age >= 18 && isCitizen) {
                    cout << "You are eligible to vote." << endl;
                } else if (age < 18 && isCitizen) {
                    cout << "You are a citizen but too young to vote." << endl;
                } else if (age >= 18 && !isCitizen) {
                    cout << "You are old enough but not a citizen." << endl;
                } else {
                    cout << "You are neither old enough nor a citizen." << endl;
                }

                return 0;
            }
            ```

            Reference:
            - `&&` means AND — both conditions must be true
            - `||` means OR — at least one condition must be true
            - `!` means NOT — inverts true/false

            Test all four cases:
            1. Age 25, citizen → eligible
            2. Age 15, citizen → too young
            3. Age 25, not citizen → not a citizen
            4. Age 15, not citizen → neither
          checklist:
            - id: chk-and
              text: "Used && to combine two conditions"
            - id: chk-or
              text: "Used || to accept both 'y' and 'Y'"
            - id: chk-not
              text: "Used ! to invert a boolean"
            - id: chk-all-cases
              text: "Tested all four eligibility cases"
          resources: []
