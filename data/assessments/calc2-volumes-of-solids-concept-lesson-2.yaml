lesson:
  introduction: |-
    We learned how to find the volume of a solid of revolution (like a vase or a bowl) by adding up an infinite number of flat disks. But what if the solid isn't round? What if it's a pyramid, or a wedge? We can use the same principle with **Known Cross Sections**.
  sections:
  - id: sec-general-volume
    title: The General Volume Formula
    required: true
    content: |-
      The idea behind finding any volume using calculus is to take a 3D object and slice it into infinitely thin, 2D pieces. 
      
      If we know the **Area** of that 2D slice at any given point $x$, which we call $A(x)$, we can simply integrate (add up) all those areas across the entire length of the solid!
      
      **General Volume Formula**:
      $$V = \int_{a}^{b} A(x) \, dx$$
      
      For a solid of revolution, the slice is always a circle, so $A(x) = \pi r^2$. But this formula is much more powerful than that!

  - id: sec-cross-sections
    title: Known Cross Sections
    required: true
    content: |-
      Suppose you have a solid whose base lies flat on the $xy$-plane, bounded by some curves (e.g., a circle $x^2 + y^2 = 4$).
      
      Now, imagine taking a knife and slicing perpendicular to the x-axis. As you look at the slice you just cut, you see a specific shape sticking up out of the plane—like a square, an equilateral triangle, or a semicircle.
      
      To find the volume:
      1. Find the length of the "base" of the slice on the $xy$-plane (usually "Top Curve - Bottom Curve"). Let's call this length $s$.
      2. Write the Area formula $A(x)$ for the specific shape of the slice in terms of $s$.
         - Square: $A(x) = s^2$
         - Semicircle: $A(x) = \frac{1}{2} \pi (\frac{s}{2})^2 = \frac{\pi}{8} s^2$
         - Equilateral Triangle: $A(x) = \frac{\sqrt{3}}{4} s^2$
      3. Integrate $A(x)$ from the far left to the far right of the base region!

questions:
- id: q-calc2-vol2-1
  title: Concept Check - The General Formula
  prompt: |-
    Why does integrating an Area function $A(x)$ give you Volume?
  type: multipleChoice
  choices:
  - id: c1
    text: Because Area is squared, so integrating it makes it cubed.
  - id: c2
    text: Because the integral multiplies the 2D Area $A(x)$ by an infinitely thin 1D thickness $dx$, resulting in an infinitely thin 3D slice of volume. Adding them all up gives the total volume.
  - id: c3
    text: Because $A(x)$ represents the height of the solid.
  answer:
    choiceId: c2
  explanation: |-
    Volume is $\text{Area} \times \text{Thickness}$. In the integral $\int A(x) \, dx$, $A(x)$ is the 2D Area, and the differential $dx$ represents an infinitely small width or thickness. The integral symbol $\int$ means "sum up all these tiny 3D slices."
  skills:
  - calc2-volumes-of-solids

- id: q-calc2-vol2-2
  title: Concept Check - Cross Section Area
  prompt: |-
    The base of a solid is the region bounded by $y = \sqrt{x}$, $y = 0$, and $x = 4$. Cross sections perpendicular to the x-axis are **squares**. What is the Area function $A(x)$ you would integrate to find the volume?
  type: multipleChoice
  choices:
  - id: c1
    text: $A(x) = \sqrt{x}$
  - id: c2
    text: $A(x) = x$
  - id: c3
    text: $A(x) = x^2$
  - id: c4
    text: $A(x) = \pi x$
  answer:
    choiceId: c2
  explanation: |-
    The side length $s$ of the square slice is the distance from the top curve to the bottom curve: $s = \sqrt{x} - 0 = \sqrt{x}$.
    The area of a square is $s^2$.
    $A(x) = (\sqrt{x})^2 = x$.
    To find the total volume, you would just calculate $\int_{0}^{4} x \, dx$.
  skills:
  - calc2-volumes-of-solids
