items:
- id: r001
  type: typed
  prompt: 'What relation does $a\in A$ express?'
  answer:
    expected: a is an element of A
    aliases:
    - a is in A
    - membership
  explanation: |-
    Solution: It says that a is an element of A.
    Why it works: The symbol $\in$ is the membership relation between an object and a set.
- id: r002
  type: typed
  prompt: 'In $\{x\in\mathbb Z:x>0\}$, what values may x take before the condition $x>0$ is applied?'
  answer:
    expected: integers
    aliases:
    - all integers
    - integer values
  explanation: |-
    Solution: x may initially be any integer.
    Why it works: $x\in\mathbb Z$ supplies the domain of possible values before the second condition narrows it.
- id: r003
  type: typed
  prompt: 'What does $B\subseteq A$ assert about B and A?'
  answer:
    expected: every element of B is in A
    aliases:
    - B is contained in A
    - B is a subset of A
  explanation: |-
    Solution: Every element of B is in A.
    Why it works: A subset relation compares two sets by containment, rather than asking whether one object is an element.
- id: r004
  type: typed
  prompt: What does $|A|$ mean when A is a set?
  answer:
    expected: cardinality
    aliases:
    - the cardinality of A
    - the number of elements in A
    - number of elements
  explanation: |-
    Solution: It is the cardinality of A, or the number of elements in A.
    Why it works: For a set, vertical bars count its elements; their meaning differs from absolute value because the context is a set.
- id: r005
  type: typed
  prompt: Why say a set-builder expression aloud before testing a candidate?
  answer:
    expected: to preserve its domain and condition
    aliases:
    - to keep its domain and condition
    - to check the domain and condition
  explanation: |-
    Solution: Say it aloud to preserve its domain and condition.
    Why it works: A set-builder expression combines an output rule with restrictions on the permitted parameter values.
