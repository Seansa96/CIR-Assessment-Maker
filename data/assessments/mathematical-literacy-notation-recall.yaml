items:
  - id: r001
    type: typed
    prompt: What relation does $a\in A$ express?
    answer: { expected: 'a is an element of A', aliases: ['a is in A', 'membership'] }
    explanation: |
      Solution: It says that a is an element of A.
      Why it works: The symbol $\in$ is the membership relation between an object and a set.
  - id: r002
    type: typed
    prompt: In $\{x\in\mathbb Z:x>0\}$, what values may x take before the condition $x>0$ is applied?
    answer: { expected: integers, aliases: ['all integers', 'integer values'] }
    explanation: |
      Solution: x may initially be any integer.
      Why it works: $x\in\mathbb Z$ supplies the domain of possible values before the second condition narrows it.
  - id: r003
    type: typed
    prompt: What does $B\subseteq A$ assert about B and A?
    answer: { expected: 'every element of B is in A', aliases: ['B is contained in A', 'B is a subset of A'] }
    explanation: |
      Solution: Every element of B is in A.
      Why it works: A subset relation compares two sets by containment, rather than asking whether one object is an element.
  - id: r004
    type: typed
    prompt: In $f:A\to B$, what is A called?
    answer: { expected: domain, aliases: ['the domain'] }
    explanation: |
      Solution: A is the domain.
      Why it works: The arrow notation names a function whose permitted inputs come from A and whose outputs lie in B.
