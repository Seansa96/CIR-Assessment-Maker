- id: ex-spring-energy
  title: Hooke's Law to Potential Energy
  problem: |
    Let's derive the formula for spring potential energy ($U_s = \frac{1}{2}kx^2$) by calculating the work done by a spring obeying Hooke's Law.
  steps:
  - id: step-1
    title: Step 1 — Hooke's Law
    instruction: |
      Start with Hooke's law for an ideal spring, where $x=0$ is the equilibrium position.
    type: multipleChoice
    prompt: Which of the following correctly represents the force exerted by an ideal spring?
    choices:
    - id: a
      text: $F_s = kx$
    - id: b
      text: $F_s = -kx$
    - id: c
      text: $F_s = \frac{1}{2}kx^2$
    answer:
      choiceId: b
    explanation: |
      Solution: $F_s=-kx$.

      Why it works: The spring force is restoring, opposite the signed displacement from equilibrium.
  - id: step-2
    title: Step 2 — Integrate Work
    instruction: |
      We now integrate this force from an initial position $x_i$ to a final position $x_f$ to find the work done by the spring.
      $W_s = \int_{x_i}^{x_f} (-kx) \, dx$
    type: symbolicResponse
    prompt: Evaluate the integral. What is the resulting expression for $W_s$?
    answer:
      gradingMode: auto
      expectedLatex: -(\frac{1}{2}kx_f^2 - \frac{1}{2}kx_i^2)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Solution: $W_s=-\tfrac12kx_f^2+\tfrac12kx_i^2=-[\tfrac12kx_f^2-\tfrac12kx_i^2]$.

      Why it works: Integrating the linear restoring force gives a quadratic expression.
  - id: step-3
    title: Step 3 — Define Potential Energy
    instruction: |
      We see that the work done by the spring depends only on the start and end points, not the path taken. This makes it a conservative force. We define potential energy such that $W_s = -\Delta U_s$.
    type: symbolicResponse
    prompt: Comparing $-(\frac{1}{2}kx_f^2 - \frac{1}{2}kx_i^2)$ to $-(U_{s,f} - U_{s,i})$, what is the formula for $U_s$ at any position $x$?
    answer:
      gradingMode: auto
      expectedLatex: \frac{1}{2}kx^2
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Solution: $U_s=\tfrac12kx^2$ relative to $U_s=0$ at $x=0$.

      Why it works: This definition makes spring work equal to $-\Delta U_s$.

- id: ex-spring-energy-numeric
  title: Convert Spring Energy to Speed
  problem: A 0.50 kg glider is released from rest with an ideal spring of $k=200$ N/m compressed 0.10 m on a frictionless horizontal track. Find the glider's speed when the spring reaches equilibrium.
  steps:
  - id: spring-numeric-1
    title: Calculate initial spring energy
    instruction: Use $U_s=\tfrac12kx^2$.
    type: numericResponse
    prompt: What is the initial spring energy in J?
    choices: []
    answer: { value: 1.0, tolerance: 0.001 }
    explanation: |
      Solution: $U_s=\tfrac12(200)(0.10)^2=1.0$ J.

      Why it works: Compression stores positive elastic potential energy.
  - id: spring-numeric-2
    title: Convert energy to kinetic energy
    instruction: At equilibrium the spring potential energy is zero.
    type: numericResponse
    prompt: What is the glider speed in m/s?
    choices: []
    answer: { value: 2.0, tolerance: 0.001 }
    explanation: |
      Solution: $1.0=\tfrac12(0.50)v^2$, so $v=2.0$ m/s.

      Why it works: Mechanical energy is conserved on the frictionless track.
