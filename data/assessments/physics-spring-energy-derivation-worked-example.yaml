workedExamples:
- id: ex-spring-energy
  title: Hooke's Law to Potential Energy
  problem: |
    Let's derive the formula for spring potential energy ($U_s = \frac{1}{2}kx^2$) by calculating the work done by a spring obeying Hooke's Law.
  steps:
  - id: step-1
    title: Step 1 — Hooke's Law
    instruction: |
      Start with Hooke's law for an ideal spring, where $x=0$ is the equilibrium position.
    type: multipleChoice
    prompt: Which of the following correctly represents the force exerted by an ideal spring?
    choices:
    - id: a
      text: $F_s = kx$
    - id: b
      text: $F_s = -kx$
    - id: c
      text: $F_s = \frac{1}{2}kx^2$
    answer:
      choiceId: b
    explanation: The negative sign is crucial! It means the spring always pulls or pushes in the *opposite* direction of the displacement $x$.
  - id: step-2
    title: Step 2 — Integrate Work
    instruction: |
      We now integrate this force from an initial position $x_i$ to a final position $x_f$ to find the work done by the spring.
      $W_s = \int_{x_i}^{x_f} (-kx) \, dx$
    type: symbolicResponse
    prompt: Evaluate the integral. What is the resulting expression for $W_s$?
    answer:
      gradingMode: auto
      expectedLatex: -(\frac{1}{2}kx_f^2 - \frac{1}{2}kx_i^2)
      equivalenceMode: expression
      tolerance: 0
    explanation: The antiderivative of $-kx$ is $-\frac{1}{2}kx^2$. Evaluating this from $x_i$ to $x_f$ gives $-\frac{1}{2}kx_f^2 - (-\frac{1}{2}kx_i^2) = -(\frac{1}{2}kx_f^2 - \frac{1}{2}kx_i^2)$.
  - id: step-3
    title: Step 3 — Define Potential Energy
    instruction: |
      We see that the work done by the spring depends only on the start and end points, not the path taken. This makes it a conservative force. We define potential energy such that $W_s = -\Delta U_s$.
    type: symbolicResponse
    prompt: Comparing $-(\frac{1}{2}kx_f^2 - \frac{1}{2}kx_i^2)$ to $-(U_{s,f} - U_{s,i})$, what is the formula for $U_s$ at any position $x$?
    answer:
      gradingMode: auto
      expectedLatex: \frac{1}{2}kx^2
      equivalenceMode: expression
      tolerance: 0
    explanation: By matching the terms, we define $U_s = \frac{1}{2}kx^2$. This energy is always positive!
