questions:
- id: vol-cyl-pauls-1-inverse-x
  title: Cylindrical Shells - Inverse Function
  type: symbolicResponse
  prompt: |
    *(Source: Paul's Online Math Notes)*

    Use the method of cylinders to determine the exact volume of the solid obtained by rotating the region bounded by $y = \frac{1}{x}$, $y = \frac{1}{3}$ and $x = \frac{1}{2}$ about the $y$-axis.
  answer:
    gradingMode: auto
    expectedLatex: 25\pi/12
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Using cylindrical shells around the $y$-axis means integrating with respect to $x$.
    The radius of each shell is $r = x$.
    The height of each shell is the difference between the upper curve and lower curve.
    First, find the intersection of $y = \frac{1}{x}$ and $y = \frac{1}{3} \implies x = 3$.
    So the integration limits are $x = \frac{1}{2}$ to $x = 3$.
    On this interval, $\frac{1}{x} \ge \frac{1}{3}$, so $h = \frac{1}{x} - \frac{1}{3}$.

    $V = \int_{1/2}^3 2\pi r h \, dx = 2\pi \int_{1/2}^3 x \left(\frac{1}{x} - \frac{1}{3}\right) \, dx = 2\pi \int_{1/2}^3 \left(1 - \frac{x}{3}\right) \, dx$
    $V = 2\pi \left[ x - \frac{x^2}{6} \right]_{1/2}^3$
    Evaluating at $3$: $3 - \frac{9}{6} = 3 - \frac{3}{2} = \frac{3}{2}$
    Evaluating at $1/2$: $\frac{1}{2} - \frac{1/4}{6} = \frac{1}{2} - \frac{1}{24} = \frac{11}{24}$
    $V = 2\pi \left( \frac{3}{2} - \frac{11}{24} \right) = 2\pi \left( \frac{36}{24} - \frac{11}{24} \right) = 2\pi \left( \frac{25}{24} \right) = \frac{25\pi}{12}$.
- id: vol-cyl-pauls-2-parabola-line
  title: Cylindrical Shells - Parabola and Line
  type: symbolicResponse
  prompt: |
    *(Source: Paul's Online Math Notes)*

    Use the method of cylinders to determine the exact volume of the solid obtained by rotating the region bounded by $y = x^2 - 6x + 11$ and $y = 6$ about the $y$-axis.
  answer:
    gradingMode: auto
    expectedLatex: 64\pi
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Find the intersection points: $x^2 - 6x + 11 = 6 \implies x^2 - 6x + 5 = 0 \implies (x - 1)(x - 5) = 0 \implies x = 1, 5$.
    Using cylindrical shells around the $y$-axis means integrating with respect to $x$.
    The radius is $r = x$.
    The height is the difference between the line $y = 6$ (upper) and the parabola $y = x^2 - 6x + 11$ (lower).
    $h = 6 - (x^2 - 6x + 11) = -x^2 + 6x - 5$.

    $V = \int_1^5 2\pi x (-x^2 + 6x - 5) \, dx = 2\pi \int_1^5 (-x^3 + 6x^2 - 5x) \, dx$
    $V = 2\pi \left[ -\frac{x^4}{4} + 2x^3 - \frac{5x^2}{2} \right]_1^5$
    Evaluating at $5$: $-\frac{625}{4} + 250 - \frac{125}{2} = -\frac{625}{4} + \frac{1000}{4} - \frac{250}{4} = \frac{125}{4}$
    Evaluating at $1$: $-\frac{1}{4} + 2 - \frac{5}{2} = -\frac{1}{4} + \frac{8}{4} - \frac{10}{4} = -\frac{3}{4}$
    $V = 2\pi \left( \frac{125}{4} - (-\frac{3}{4}) \right) = 2\pi \left( \frac{128}{4} \right) = 2\pi(32) = 64\pi$.
- id: vol-cyl-pauls-3-shifted-axis
  title: Cylindrical Shells - Shifted Axis of Rotation
  type: symbolicResponse
  prompt: |
    *(Source: Paul's Online Math Notes)*

    Use the method of cylinders to determine the exact volume of the solid obtained by rotating the region bounded by $y = -x^2 - 10x + 6$ and $y = 2x + 26$ about the line $x = 2$.
  answer:
    gradingMode: auto
    expectedLatex: 4096\pi/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Find the intersection points: $-x^2 - 10x + 6 = 2x + 26 \implies x^2 + 12x + 20 = 0 \implies (x + 10)(x + 2) = 0 \implies x = -10, -2$.
    Using cylindrical shells around the vertical line $x = 2$, we integrate with respect to $x$.
    Since the region ($x$ from $-10$ to $-2$) lies entirely to the left of the axis of rotation $x = 2$, the radius is $r = 2 - x$.
    The height is the difference between the parabola (upper curve) and the line (lower curve):
    $h = (-x^2 - 10x + 6) - (2x + 26) = -x^2 - 12x - 20$.

    $V = \int_{-10}^{-2} 2\pi (2 - x)(-x^2 - 12x - 20) \, dx$
    Expand the integrand: $(2 - x)(-x^2 - 12x - 20) = -2x^2 - 24x - 40 + x^3 + 12x^2 + 20x = x^3 + 10x^2 - 4x - 40$.
    $V = 2\pi \int_{-10}^{-2} (x^3 + 10x^2 - 4x - 40) \, dx = 2\pi \left[ \frac{x^4}{4} + \frac{10x^3}{3} - 2x^2 - 40x \right]_{-10}^{-2}$
    Evaluating at $-2$: $\frac{16}{4} + \frac{-80}{3} - 8 + 80 = 4 - \frac{80}{3} + 72 = 76 - \frac{80}{3} = \frac{228 - 80}{3} = \frac{148}{3}$
    Evaluating at $-10$: $\frac{10000}{4} + \frac{-10000}{3} - 200 + 400 = 2500 - \frac{10000}{3} + 200 = 2700 - \frac{10000}{3} = \frac{8100 - 10000}{3} = -\frac{1900}{3}$
    $V = 2\pi \left( \frac{148}{3} - \left(-\frac{1900}{3}\right) \right) = 2\pi \left( \frac{2048}{3} \right) = \frac{4096\pi}{3}$.
