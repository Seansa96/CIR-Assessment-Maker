questions:
- id: q001
  type: multipleChoice
  prompt: 'When 6.0 g of carbon burns completely in oxygen, 22.0 g of CO2 is produced.
    How many grams of oxygen reacted?

    '
  choices:
  - id: a
    text: 16.0 g
  - id: b
    text: 22.0 g
  - id: c
    text: 6.0 g
  - id: d
    text: 28.0 g
  answer:

    choiceId: a
  explanation: 'By the Law of Conservation of Mass: mass O2 = mass CO2 - mass C =
    22.0 - 6.0 = 16.0 g.

    '
- id: q002
  type: multipleChoice
  prompt: 'A chemist prepares water from hydrogen and oxygen in a lab on Earth. A
    different chemist prepares water from hydrogen and oxygen on the International
    Space Station. How do the mass ratios of H to O compare in the two samples?

    '
  choices:
  - id: a
    text: They are identical; water always has the same composition.
  - id: b
    text: The ratio differs because of different gravitational conditions.
  - id: c
    text: The space sample has more hydrogen because of microgravity.
  - id: d
    text: The ratio depends on the purity of the reagents.
  answer:

    choiceId: a
  explanation: 'The Law of Definite Proportions: a compound always has the same mass
    ratio of its elements, regardless of where or\rhow it is made. Water is always
    11.2% H and 88.8% O by mass.

    '
- id: q003
  type: multipleChoice
  prompt: 'Two compounds of sulfur and fluorine are analyzed:

    - Compound 1: 32 g of S combined with 38 g of F

    - Compound 2: 32 g of S combined with 76 g of F


    What whole-number ratio does this represent?

    '
  choices:
  - id: a
    text: '1:2'
  - id: b
    text: '2:3'
  - id: c
    text: '3:4'
  - id: d
    text: '1:3'
  answer:

    choiceId: a
  explanation: '76 g / 38 g = 2:1. For a fixed mass of sulfur, the fluorine masses
    are in a 1:2 ratio, illustrating the Law of Multiple Proportions.

    '
- id: q004
  type: multipleChoice
  prompt: 'Which postulate of Dalton''s Atomic Theory was found to be incorrect as
    a strict statement?

    '
  choices:
  - id: a
    text: All atoms of a given element are identical in mass.
  - id: b
    text: Compounds form when atoms combine in fixed ratios.
  - id: c
    text: Atoms are rearranged, not destroyed, in chemical reactions.
  - id: d
    text: All matter is made of atoms.
  answer:

    choiceId: a
  explanation: 'Isotopes disprove the strict version of this postulate — atoms of
    the same element can have different masses. All the other postulates are still
    considered valid for chemistry.

    '
- id: q005
  type: numericResponse
  prompt: 'An atom of ${}^{238}_{92}\text{U}$ (uranium) is the most common isotope
    of uranium. How many neutrons does this atom contain?

    '
  answer:
    value: 146
    tolerance: 0
  explanation: 'Neutrons = A - Z = 238 - 92 = 146.

    '
- id: q006
  type: numericResponse
  prompt: 'Chlorine has two stable isotopes: Cl-35 (75.77% abundant, mass = 34.969
    amu) and Cl-37 (24.23% abundant, mass = 36.966 amu). Calculate the weighted average
    atomic mass of chlorine (in amu, to 2 decimal places).

    '
  answer:
    value: 35.45
    tolerance: 0.02
  explanation: 'Average mass = (0.7577 × 34.969) + (0.2423 × 36.966) = 26.496 + 8.957
    = 35.45 amu. This matches the periodic table value.

    '
- id: q007
  type: multipleChoice
  prompt: 'Which of the following best describes the relationship between the atomic
    number and the element?

    '
  choices:
  - id: a
    text: The atomic number (Z) uniquely identifies an element; changing Z changes
      the element.
  - id: b
    text: The mass number (A) uniquely identifies an element.
  - id: c
    text: Both Z and A must be specified to identify an element.
  - id: d
    text: The number of electrons uniquely identifies an element.
  answer:

    choiceId: a
  explanation: 'The atomic number Z (number of protons) is the defining property of
    an element. Changing the number of protons changes the element. Isotopes can change
    A without changing identity; ions change electron count without changing identity.

    '
- id: q008
  type: multipleChoice
  prompt: 'How many electrons does the Ca2+ ion have? (Calcium has atomic number 20.)

    '
  choices:
  - id: a
    text: '18'
  - id: b
    text: '20'
  - id: c
    text: '22'
  - id: d
    text: '40'
  answer:

    choiceId: a
  explanation: 'Ca2+ has lost 2 electrons from the neutral Ca atom (which has 20 electrons).
    20 - 2 = 18 electrons. Note that Ca2+ is isoelectronic with the noble gas argon.

    '
- id: q009
  type: multipleChoice
  prompt: 'A student says "I heated the iron and it gained mass because the atoms
    got bigger." Which fundamental law disproves this reasoning?

    '
  choices:
  - id: a
    text: Law of Conservation of Mass — iron gained mass by reacting with oxygen in
      the air.
  - id: b
    text: Law of Definite Proportions — iron atoms don't change size.
  - id: c
    text: Law of Multiple Proportions — atoms cannot expand.
  - id: d
    text: Dalton's first postulate — atoms are indivisible.
  answer:

    choiceId: a
  explanation: 'When iron is heated in air, it reacts with O2 to form iron oxide (rust).
    The iron doesn''t get bigger — it gains mass by combining with oxygen from the
    environment, consistent with conservation of mass.

    '
- id: q010
  type: multipleChoice
  prompt: 'Nitrogen-14 and Nitrogen-15 are both isotopes of nitrogen. Which statement
    is correct?

    '
  choices:
  - id: a
    text: Both have 7 protons but N-14 has 7 neutrons and N-15 has 8 neutrons.
  - id: b
    text: N-14 has 14 protons and N-15 has 15 protons.
  - id: c
    text: They have different chemical properties because of the mass difference.
  - id: d
    text: Both have 7 neutrons but different proton counts.
  answer:

    choiceId: a
  explanation: 'Both are nitrogen (Z = 7), so both have 7 protons. N-14: mass number
    14, so 14 - 7 = 7 neutrons. N-15: 15 - 7 = 8 neutrons. They are chemically identical
    because they have the same electron configuration.

    '
- id: q011
  type: selectAll
  prompt: 'Which of the following are correctly described? Select all that apply.

    '
  choices:
  - id: a
    text: Protons have a +1 charge and are located in the nucleus.
  - id: b
    text: Electrons have a mass of a\approximately 1 amu.
  - id: c
    text: Neutrons have no charge and are located in the nucleus.
  - id: d
    text: The mass of an electron is negligible compared to a proton.
  answer:

    choiceIds:
    - a
    - c
    - d
  explanation: 'Protons (+1, in nucleus) and neutrons (neutral, in nucleus) are correct.
    Electrons have negligible mass (~0.00055 amu), so (d) is correct. (b) is wrong
    — electrons do NOT have a mass of ~1 amu; that is the mass of protons and neutrons.

    '
- id: q012
  type: multipleChoice
  prompt: 'Which particle, if added to an atom, changes the element to a different
    element?

    '
  choices:
  - id: a
    text: A proton
  - id: b
    text: A neutron
  - id: c
    text: An electron
  - id: d
    text: Adding a neutron and an electron together
  answer:

    choiceId: a
  explanation: 'Adding a proton changes the atomic number Z, which defines the element
    — you have a different element. Adding a neutron creates an isotope (same element,
    different mass number). Adding an electron creates an anion (same element, different
    charge).

    '
