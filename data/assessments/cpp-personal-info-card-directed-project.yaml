directedProject:
  summary: >-
    Build an interactive program that collects personal information from the
    user and displays it in a neatly formatted card. You will practice using
    string variables, getline for multi-word input, and formatted console output.
  estimatedTimeMinutes: 25
  resources: []
  phases:
    - id: phase-1-setup
      title: "Project Setup and Variables"
      steps:
        - id: step-1-create
          title: "Create the Project and Declare Variables"
          instruction: |
            Create a new C++ console project named `InfoCard`.

            Start your program by including the necessary headers and declaring
            variables for the user's information:

            ```cpp
            #include <iostream>
            #include <string>
            using namespace std;

            int main() {
                string name;
                int age;
                string city;
                string hobby;

                // We will fill in the rest in the next steps.
                return 0;
            }
            ```

            Build to make sure it compiles.
          checklist:
            - id: chk-project
              text: "Created project with four declared variables"
            - id: chk-compiles
              text: "Program compiles without errors"
          resources: []

    - id: phase-2-input
      title: "Collecting User Input"
      steps:
        - id: step-2-cin-name
          title: "Read the User's Name with getline"
          instruction: |
            Add code to prompt the user for their full name. Because names can have
            spaces (e.g. "John Smith"), you need to use `getline` instead of `cin >>`:

            ```cpp
            cout << "Enter your full name: ";
            getline(cin, name);
            ```

            `getline(cin, name)` reads the entire line including spaces, until the
            user presses Enter.

            Build and test — type a name with a space to verify it captures the
            full name.
          checklist:
            - id: chk-getline
              text: "Used getline to read a full name with spaces"
          resources: []

        - id: step-3-remaining
          title: "Read Age, City, and Hobby"
          instruction: |
            Add prompts for the remaining information:

            ```cpp
            cout << "Enter your age: ";
            cin >> age;
            cin.ignore(); // Clear the leftover newline from cin

            cout << "Enter your city: ";
            getline(cin, city);

            cout << "Enter your favorite hobby: ";
            getline(cin, hobby);
            ```

            **Important:** After using `cin >>` for an integer, you must call
            `cin.ignore()` before the next `getline`. Otherwise `getline` will
            read the leftover newline character and appear to skip the input.

            Build and test. Enter values for all four prompts.
          notesPrompt: "What happens if you remove cin.ignore()? Try it and note the behavior."
          checklist:
            - id: chk-age
              text: "Program reads age as an integer"
            - id: chk-ignore
              text: "Used cin.ignore() between cin >> and getline"
            - id: chk-all-inputs
              text: "All four values are captured correctly"
          resources: []

    - id: phase-3-display
      title: "Formatting the Info Card"
      steps:
        - id: step-4-simple
          title: "Print a Simple Card"
          instruction: |
            After reading all inputs, print a formatted info card. Start with a simple
            version:

            ```cpp
            cout << endl;
            cout << "=============================" << endl;
            cout << "     Personal Info Card       " << endl;
            cout << "=============================" << endl;
            cout << " Name:    " << name << endl;
            cout << " Age:     " << age << endl;
            cout << " City:    " << city << endl;
            cout << " Hobby:   " << hobby << endl;
            cout << "=============================" << endl;
            ```

            Build and run. Your card should look neat and aligned.
          checklist:
            - id: chk-card
              text: "Info card displays with all four values"
            - id: chk-aligned
              text: "Card appears neatly formatted with labels aligned"
          resources: []

        - id: step-5-fancy
          title: "Make the Card Fancier (Optional)"
          instruction: |
            Try upgrading the card with box-drawing characters. Copy-paste these
            characters or use the approximations shown:

            ```cpp
            cout << "+=============================+" << endl;
            cout << "|     Personal Info Card       |" << endl;
            cout << "+-----------------------------+" << endl;
            cout << "| Name:    " << name << endl;
            cout << "| Age:     " << age << endl;
            cout << "| City:    " << city << endl;
            cout << "| Hobby:   " << hobby << endl;
            cout << "+=============================+" << endl;
            ```

            Experiment with different border characters and spacing until you like
            the look. The goal is to get comfortable formatting output.
          checklist:
            - id: chk-fancy
              text: "Improved the visual formatting of the card"
          resources: []

    - id: phase-4-goodbye
      title: "Final Touches"
      steps:
        - id: step-6-goodbye
          title: "Add a Goodbye Message"
          instruction: |
            At the end of your program, add a personalized goodbye message that uses
            the name variable:

            ```cpp
            cout << endl;
            cout << "Thanks for using the Info Card, " << name << "!" << endl;
            cout << "Have a great day in " << city << "!" << endl;
            ```

            Build, run, and do a final test with your actual information.

            **Reflection:** You just built your first real interactive C++ program.
            You used `string`, `int`, `cin >>`, `getline`, `cin.ignore()`, and
            formatted `cout` output — all in one program.
          notesPrompt: "What was the trickiest part of this project?"
          checklist:
            - id: chk-goodbye
              text: "Program ends with a personalized goodbye message"
            - id: chk-complete
              text: "Final test run completed successfully"
          resources: []
