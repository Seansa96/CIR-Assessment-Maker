schemaVersion: 1
id: cpp-stl-containers-recall
title: C++ STL Containers Recall
assessmentType: recallDrill
categoryId: c++
subcategoryId: c++-standard-library
subcategoryIds:
  - c++-standard-library
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'Which container acts like a dynamic, resizable array?'
    answer:
      expected: vector
      aliases:
        - std::vector
  - id: r002
    type: typed
    prompt: 'Which container allows fast insertion at both the front and the back?'
    answer:
      expected: deque
      aliases:
        - std::deque
  - id: r003
    type: typed
    prompt: 'Which container uses non-contiguous nodes connected by pointers?'
    answer:
      expected: list
      aliases:
        - std::list
  - id: r004
    type: typed
    prompt: 'What method adds an element to the end of a `std::vector`?'
    answer:
      expected: push_back
      aliases:
        - push_back()
  - id: r005
    type: flashcard
    prompt: 'Why is `std::list` unable to use the `[]` operator for access?'
    answer:
      expected: Because elements are not stored contiguously, making direct mathematical indexing impossible.


