  - id: s03
    title: Trigonometry and radians
    required: true
    content: Radians, exact trigonometric values, and signs by quadrant recur in vectors and coordinate changes.
    media: []
    check:
      id: s03-check
      type: multipleChoice
      prompt: Why are radians especially important when preparing for Calc 3?
      choices:
      - id: a
        text: They connect angle measures to trigonometric values and coordinate changes used in calculus.
        media: []
        issueSignals: []
      - id: b
        text: They make every trigonometric value positive.
        media: []
        issueSignals:
        - id: unit-circle-evaluation-error
          domains: []
      - id: c
        text: They eliminate the need to consider quadrants.
        media: []
        issueSignals:
        - id: unit-circle-evaluation-error
          domains: []
      - id: d
        text: They are interchangeable with degrees without conversion.
        media: []
        issueSignals:
        - id: unit-circle-evaluation-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Use radians and unit-circle signs to interpret trigonometric coordinates and changes of coordinates.


        Why it works: Calculus formulas use radian measure, while quadrant information determines the signs of sine and cosine components.


        Why the other choices fail: Radian measure does not change signs, remove quadrants, or make degree conversion unnecessary.
