  - id: s04
    title: Polar coordinates
    required: true
    content: 'A polar point uses radius and angle: $x=r\cos\theta$ and $y=r\sin\theta$. This is useful for circular regions in multiple integrals.'
    media:
    - type: image
      src: /media/calculus-3/readiness-unit-circle-polar.svg
      alt: Original unit-circle diagram showing a polar point at angle theta with coordinates cosine theta and sine theta.
      caption: 
    check:
      id: s04-check
      type: multipleChoice
      prompt: Which relation converts a polar point with radius r and angle theta to its x-coordinate?
      choices:
      - id: a
        text: $x=r\cos\theta$
        media: []
        issueSignals: []
      - id: b
        text: $x=r\sin\theta$
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      - id: c
        text: $x=\theta\cos r$
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      - id: d
        text: $x=r/\theta$
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Resolve the radius horizontally: $x=r\cos\theta$.


        Why it works: Cosine gives the horizontal component of a radius at angle $\theta$; sine gives the vertical component.


        Why the other choices fail: The alternatives swap components, exchange the roles of radius and angle, or use a relation unrelated to coordinate resolution.
