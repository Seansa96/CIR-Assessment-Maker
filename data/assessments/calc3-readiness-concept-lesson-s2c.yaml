  - id: s02
    title: Algebra and functions
    required: true
    content: Simplify expressions while preserving domain restrictions and interpreting formulas as functions.
    media: []
    check:
      id: s02-check
      type: multipleChoice
      prompt: Before simplifying an expression for a later Calc 3 calculation, what must remain visible?
      choices:
      - id: a
        text: Domain restrictions and the quantities represented by the expression.
        media: []
        issueSignals: []
      - id: b
        text: Only the shortest-looking algebraic form.
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: c
        text: A restriction can be discarded once terms cancel.
        media: []
        issueSignals:
        - id: domain-range-misidentified
          domains: []
      - id: d
        text: Formulas need not be interpreted as functions.
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Carry forward the domain and the meaning of each quantity while simplifying.


        Why it works: Algebraic equivalence can hold only on a restricted domain, and Calc 3 models depend on interpreting expressions as functions.


        Why the other choices fail: Brevity, cancellation, or symbol manipulation alone does not preserve the conditions under which a formula applies.
