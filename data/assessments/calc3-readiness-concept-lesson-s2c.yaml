  - id: s05
    title: Parametric notation
    required: true
    content: 'A shared parameter labels a moving point: $(x(t),y(t))$ gives both coordinates at the same value of $t$ and orders the path.'
    media:
    - type: image
      src: /media/calculus-3/readiness-parametric-coordinate.svg
      alt: Original coordinate graph of a parametric path with points marked at t equals zero, one, and two.
      caption: 
    check:
      id: s05-check
      type: multipleChoice
      prompt: In $(x(t),y(t))$, what does using the same value of t for both coordinates accomplish?
      choices:
      - id: a
        text: It identifies one point on the path and its position in the parameter order.
        media: []
        issueSignals: []
      - id: b
        text: It allows x and y to use unrelated times.
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: c
        text: It removes the direction of travel from the curve.
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: d
        text: It makes the curve a polar equation.
        media: []
        issueSignals:
        - id: polar-rectangular-conversion-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Evaluate both coordinate functions at the same parameter value to locate the associated point.


        Why it works: The shared parameter coordinates the two components and orders positions along the parametric path.


        Why the other choices fail: Independent times, no direction, and polar notation describe different ideas from a parametric curve.
