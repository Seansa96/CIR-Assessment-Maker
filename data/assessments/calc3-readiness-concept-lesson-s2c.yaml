  - id: s07
    title: Definite integrals and the FTC
    required: true
    content: Multiple integration accumulates quantities over a region, extending antiderivatives, endpoint subtraction, and the Fundamental Theorem of Calculus.
    media: []
    check:
      id: s07-check
      type: multipleChoice
      prompt: What does the Fundamental Theorem of Calculus contribute when evaluating a definite integral?
      choices:
      - id: a
        text: Evaluate an antiderivative at the upper bound minus the lower bound.
        media: []
        issueSignals: []
      - id: b
        text: Multiply the integrand by both bounds.
        media: []
        issueSignals:
        - id: order-of-operations-error
          domains: []
      - id: c
        text: Use the lower endpoint only.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      - id: d
        text: Omit the bounds after finding an antiderivative.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Find an antiderivative and compute its value at the upper limit minus its value at the lower limit.


        Why it works: Definite integration measures accumulated change over an interval, which the Fundamental Theorem connects to endpoint evaluation.


        Why the other choices fail: The alternatives misuse bounds or stop before converting an antiderivative into the requested accumulated quantity.
