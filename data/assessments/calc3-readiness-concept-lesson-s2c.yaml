lesson:
  introduction: |
    Calculus 3 uses several earlier tools in new combinations. This orientation is a map, not a gate: you may start any Calc 3 track regardless of the results of the readiness check. Use the feedback to decide what is worth refreshing alongside your class.
  sections:
    - id: s01
      title: Treat readiness as a map
      content: |
        The readiness sequence samples six skill families that recur in spatial vectors, multivariable derivatives, and multiple integration. A miss points to one existing topic path; it does not lock any Calc 3 topic.
    - id: s02
      title: Algebra and functions
      content: |
        You will simplify expressions, preserve domain restrictions, and interpret formulas as functions. If these feel rusty, review Calculus 1 → Inequalities and the Real Numbers or Calculus 1 → Sets, Sequences, and Functions.
    - id: s03
      title: Trigonometry and radians
      content: |
        Angles in calculus are normally measured in radians. Exact sine and cosine values, signs by quadrant, and right-triangle relationships will reappear in vectors and coordinate changes. Review Trigonometry → Right Triangle Trigonometry or Trigonometry → Unit Circle Trigonometry when needed.
    - id: s04
      title: Polar coordinates
      content: |
        A polar point uses radius and angle: $x=r\cos\theta$ and $y=r\sin\theta$. This representation becomes especially useful for circular regions in double and triple integrals. If conversion is unfamiliar, revisit Trigonometry → Polar Coordinates.
      media:
      - path: /media/calculus-3/readiness-unit-circle-polar.svg
        alt: Original unit-circle diagram showing a polar point at angle theta with coordinates cosine theta and sine theta.
    - id: s05
      title: Parametric notation
      content: |
        A parameter labels a moving point. For example, $(x(t),y(t))$ means both coordinates are evaluated at the same value of $t$; increasing $t$ can give the curve an orientation. Review Calculus 2 → Parametric Curves if this notation needs a refresh.
      media:
      - path: /media/calculus-3/readiness-parametric-coordinate.svg
        alt: Original coordinate graph of a parametric path with points marked at t equals zero, one, and two.
    - id: s06
      title: Differentiation
      content: |
        Calc 3 differentiates component functions and repeatedly applies power, product, and chain rules. A mistaken derivative can derail a gradient or motion calculation. Review Calculus 1 → The Derivative or Calculus 1 → Classical Theorems of Differential Calculus.
    - id: s07
      title: Definite integrals and the FTC
      content: |
        Multiple integration extends the same core idea: accumulate quantities over a region and evaluate with appropriate bounds. Be comfortable with antiderivatives, endpoint subtraction, and the Fundamental Theorem of Calculus. Review Calculus 1 → Riemann Integration, Calculus 2 → U-Sub Integration, or Calculus 2 → Integration Techniques.
    - id: s08
      title: Use diagnostic feedback deliberately
      content: |
        Each recall or mastery item names a Subject → Topic destination when a prerequisite skill is involved. Open that subject through the existing picker, choose the named topic, and return whenever you are ready. Completion of this sequence records useful evidence only; it never prevents entry into Spatial Vectors and Motion, Multivariable Derivatives and Optimization, or Multiple Integration and Coordinate Systems.
