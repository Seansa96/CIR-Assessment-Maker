  - id: s06
    title: Differentiation
    required: true
    content: Component functions use familiar power, product, and chain rules; an incorrect derivative can derail a gradient or motion calculation.
    media: []
    check:
      id: s06-check
      type: multipleChoice
      prompt: Which earlier differentiation skill is needed when a Calc 3 component is $\sin(3t)$?
      choices:
      - id: a
        text: Apply the chain rule and include the derivative of the inner expression.
        media: []
        issueSignals: []
      - id: b
        text: Differentiate sine but omit the factor 3.
        media: []
        issueSignals:
        - id: chain-rule-missed
          domains: []
      - id: c
        text: Treat the parameter as a constant in every component.
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: d
        text: Replace derivatives with endpoint subtraction.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Differentiate the outer sine and multiply by the derivative of $3t$.


        Why it works: Component functions in vector and motion models follow the same chain rule used in one-variable calculus.


        Why the other choices fail: Omitting the inner derivative, freezing the variable, or using an integral procedure gives the wrong operation.
