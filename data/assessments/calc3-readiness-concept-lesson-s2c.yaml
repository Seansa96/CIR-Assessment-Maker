lesson:
  introduction: >
    Calculus 3 uses several earlier tools in new combinations. This orientation is a map, not a gate: use its feedback to decide what is worth refreshing alongside your class.
  sections:
  - id: s01
    title: Treat readiness as a map
    required: true
    content: A miss identifies one skill family worth refreshing; it never locks any Calc 3 topic.
    media: []
    check:
      id: s01-check
      type: multipleChoice
      prompt: What is the intended use of a readiness result in this sequence?
      choices:
      - id: a
        text: Identify a skill worth refreshing while continuing into Calc 3.
        media: []
        issueSignals: []
      - id: b
        text: Block access to every Calc 3 topic until all items are correct.
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: c
        text: Assign a permanent grade for the entire course.
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: d
        text: Replace the need to study vectors and multivariable calculus.
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Treat a miss as evidence for a focused review path, then continue with the Calc 3 activity.


        Why it works: Readiness is diagnostic evidence, not a prerequisite gate; it helps select a useful refresher without changing curriculum access.


        Why the other choices fail: The remaining choices incorrectly turn a diagnostic into a gate, a course grade, or a substitute for the Calc 3 curriculum.
