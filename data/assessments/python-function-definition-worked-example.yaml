schemaVersion: 1
id: python-function-definition-worked-example
title: Python Function Definition Worked Example
assessmentType: workedExample
categoryId: python
subcategoryIds:
  - python-functions
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Defining and calling a basic Python function
    problem: "Define a Python function named `greet_student` that accepts a student's name and returns a greeting string."
    steps:
      - id: s001
        title: Identify the function header
        instruction: "A Python function definition begins with a keyword, a function name, parentheses, and a colon."
        type: multipleChoice
        prompt: "Which line correctly starts a Python function named `greet_student` with one parameter named `name`?"
        choices:
          - id: a
            text: "`def greet_student(name):`"
          - id: b
            text: "`function greet_student(name):`"
          - id: c
            text: "`def greet_student[name]`"
          - id: d
            text: "`greet_student def name:`"
        answer:
          { choiceId: a }
        hint: "Python uses `def`, parentheses around parameters, and a colon."
        explanation: |
          The correct function header is `def greet_student(name):`. The keyword `def` tells Python a function is being defined, `greet_student` is the function name, `name` is the parameter, and the colon starts the function block.

          Related topic: Python function headers and the `def` keyword.

          Read further: Review Python function definition syntax, especially `def`, parameter lists, and the required colon.
      - id: s002
        title: Understand the parameter
        instruction: "A parameter is a local name that receives a value when the function is called."
        type: multipleChoice
        prompt: "In `def greet_student(name):`, what is `name`?"
        choices:
          - id: a
            text: "A parameter that receives an argument when the function is called."
          - id: b
            text: "The value returned by the function."
          - id: c
            text: "The keyword that creates the function."
          - id: d
            text: "A built-in Python command."
        answer:
          choiceId: a
        hint: "It is the placeholder used inside the function body."
        explanation: |
          `name` is a parameter. When the function is called, an argument such as `"Maya"` is assigned to `name` inside that function call.

          Related topic: Parameters versus arguments.

          Read further: Study how function parameters receive argument values and how parameter names are local to the function.
      - id: s003
        title: Create the function body
        instruction: "The function body must be indented under the function header."
        type: multipleChoice
        prompt: "Which body line correctly returns a greeting using the parameter `name`?"
        choices:
          - id: a
            text: "`    return \"Hello, \" + name`"
          - id: b
            text: "`return \"Hello, \" + name` with no indentation"
          - id: c
            text: "`    def \"Hello, \" + name`"
          - id: d
            text: "`    parameter \"Hello, \" + name`"
        answer:
          choiceId: a
        hint: "Inside a function, the body is indented and `return` sends a value back."
        explanation: |
          A function body in Python must be indented. `return "Hello, " + name` creates the greeting string and sends it back to the caller.

          Related topic: Function body indentation and return statements.

          Read further: Review Python indentation rules and the difference between calculating a value and returning it.
      - id: s004
        title: Distinguish return from print
        instruction: "Returning a value and printing a value are not the same behavior."
        type: multipleChoice
        prompt: "Why should this function use `return` instead of only `print`?"
        choices:
          - id: a
            text: "`return` gives the greeting back to the code that called the function."
          - id: b
            text: "`print` is not allowed inside functions."
          - id: c
            text: "`return` displays text on the screen automatically."
          - id: d
            text: "`print` creates a parameter."
        answer:
          choiceId: a
        hint: "Think about whether later code can reuse the value."
        explanation: |
          `return` makes the function produce a value that other code can store, compare, or use. `print` only displays output and does not give the caller that value.

          Related topic: Return values versus printed output.

          Read further: Practice predicting the difference between functions that return values and functions that only print messages.
      - id: s005
        title: Complete and call the function
        instruction: "Put the definition together and identify how the function is called."
        type: multipleChoice
        prompt: |
          Given this function:

          ```python
          def greet_student(name):
              return "Hello, " + name
          ```

          Which call evaluates to `"Hello, Maya"`?
        choices:
          - id: a
            text: "`greet_student(\"Maya\")`"
          - id: b
            text: "`greet_student()`"
          - id: c
            text: "`def greet_student(\"Maya\")`"
          - id: d
            text: "`return greet_student`"
        answer:
          choiceId: a
        hint: "A call uses the function name followed by parentheses containing argument values."
        explanation: |
          `greet_student("Maya")` calls the function and passes `"Maya"` as the argument for the `name` parameter. The returned value is `"Hello, Maya"`.

          Related topic: Calling functions with arguments.

          Read further: Review the difference between defining a function, calling a function, and using the value a function returns.
