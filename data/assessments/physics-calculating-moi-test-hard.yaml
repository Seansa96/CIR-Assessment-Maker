schemaVersion: 1
id: physics-calculating-moi-test-hard
title: 'Test (Hard): Calculating Moment of Inertia'
description: Rigorous exam covering Calculating Moment of Inertia.
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-calculating-moi
skills:
- physics-calculating-moi
- moment-of-inertia
- moment-of-inertia-calculation
modeDefault: exam
randomizeQuestions: true
questions:
- id: q001
  title: Rod plus endpoint masses
  type: numericResponse
  prompt: |-
    A $2.0\text{ kg}$, $2.0\text{ m}$ rod rotates about its center. A $0.50\text{ kg}$ mass is attached to each end. What is total $I$?
  answer:
    value: 1.667
    tolerance: 0.02
  explanation: |-
    Rod $I=0.667$; endpoint masses add $1.0$; total $1.667$.
- id: q002
  title: Offset disk
  type: numericResponse
  prompt: |-
    A solid disk has $M=8.0\text{ kg}$ and $R=0.50\text{ m}$. Find $I$ about a parallel axis $0.30\text{ m}$ from center.
  answer:
    value: 1.72
    tolerance: 0.02
  explanation: |-
    $I_{cm}=1.0$ and $Md^2=0.72$, total $1.72$.
- id: q003
  title: Disk with hole
  type: numericResponse
  prompt: |-
    A disk has $I_{full}=4.00$. A hole of mass $1.0\text{ kg}$, radius $0.20\text{ m}$ is centered $0.40\text{ m}$ from the axis. What is remaining $I$?
  answer:
    value: 3.82
    tolerance: 0.02
  explanation: |-
    Hole $I=\frac12mr^2+md^2=0.18$; remaining $I=4.00-0.18=3.82$.
- id: q004
  title: Perpendicular axis theorem
  type: numericResponse
  prompt: |-
    A lamina has $I_x=3.0$ and $I_y=5.0$. What is $I_z$?
  answer:
    value: 8.0
    tolerance: 0.05
  explanation: |-
    For a planar lamina, $I_z=I_x+I_y=8.0$.
- id: q005
  title: Off-center rod axis
  type: numericResponse
  prompt: |-
    A $4.0\text{ kg}$, $3.0\text{ m}$ rod rotates about an axis $0.50\text{ m}$ from center. What is $I$?
  answer:
    value: 4.0
    tolerance: 0.05
  explanation: |-
    $I_{cm}=3.0$ and $Md^2=1.0$, so $I=4.0$.
- id: q006
  title: Three point masses
  type: numericResponse
  prompt: |-
    Masses are at radii $0.50$, $0.40$, and $1.0\text{ m}$ with masses $2.0$, $3.0$, and $1.0\text{ kg}$. What is total $I$?
  answer:
    value: 1.98
    tolerance: 0.02
  explanation: |-
    $I=2(0.5)^2+3(0.4)^2+1(1)^2=1.98$.
- id: q007
  title: Parallel-axis condition
  type: multipleChoice
  prompt: |-
    When may you use $I=I_{cm}+Md^2$?
  choices:
  - id: a
    text: |-
      When the new axis is parallel to the center-of-mass axis.
  - id: b
    text: |-
      Whenever axes cross.
  - id: c
    text: |-
      Only for point masses.
  - id: d
    text: |-
      Only when $d=0$.
  answer:
    choiceId: a
  explanation: |-
    The theorem shifts to a parallel axis.
- id: q008
  title: Scaling
  type: numericResponse
  prompt: |-
    A similar object has triple the radius and double the mass. By what factor does $I$ increase?
  answer:
    value: 18.0
    tolerance: 0.1
  explanation: |-
    $I\propto MR^2$, so factor $=2(3^2)=18$.
- id: q009
  title: Cutout sign
  type: multipleChoice
  prompt: |-
    A cutout should be treated as:
  choices:
  - id: a
    text: |-
      negative moment of inertia contribution
  - id: b
    text: |-
      extra rim mass
  - id: c
    text: |-
      zero radius
  - id: d
    text: |-
      a power term
  answer:
    choiceId: a
  explanation: |-
    Removed material is subtracted from the full object's $I$.
- id: q010
  title: Rod axis difference
  type: numericResponse
  prompt: |-
    A $1.5\text{ kg}$, $4.0\text{ m}$ rod rotates about center or end. How much larger is the end-axis $I$?
  answer:
    value: 6.0
    tolerance: 0.1
  explanation: |-
    $I_{end}=8.0$ and $I_{center}=2.0$, difference $6.0$.
- id: q011
  title: Two coaxial disks
  type: numericResponse
  prompt: |-
    Disk A: $M=2.0$, $R=0.30$. Disk B: $M=4.0$, $R=0.20$. What is total central $I$?
  answer:
    value: 0.17
    tolerance: 0.005
  explanation: |-
    $I=\frac12(2)(0.30)^2+\frac12(4)(0.20)^2=0.17$.
- id: q012
  title: Largest contribution
  type: multipleChoice
  prompt: |-
    Which contributes most to $I$?
  choices:
  - id: a
    text: |-
      $1\text{ kg}$ at $4\text{ m}$
  - id: b
    text: |-
      $4\text{ kg}$ at $1\text{ m}$
  - id: c
    text: |-
      $2\text{ kg}$ at $2\text{ m}$
  - id: d
    text: |-
      $8\text{ kg}$ at $0.5\text{ m}$
  answer:
    choiceId: a
  explanation: |-
    Compare $mr^2$: $16$, $4$, $8$, $2$.
- id: q013
  title: Hoop tangent axis
  type: numericResponse
  prompt: |-
    A hoop has $M=3.0\text{ kg}$ and $R=0.40\text{ m}$. What is $I$ about a tangent parallel axis?
  answer:
    value: 0.96
    tolerance: 0.02
  explanation: |-
    Central $I=MR^2=0.48$; tangent shift adds $MR^2=0.48$; total $0.96$.
- id: q014
  title: Sphere tangent axis
  type: numericResponse
  prompt: |-
    A solid sphere has $M=5.0\text{ kg}$ and $R=0.30\text{ m}$. What is $I$ about a tangent axis?
  answer:
    value: 0.63
    tolerance: 0.02
  explanation: |-
    $I_{cm}=0.18$ and $MR^2=0.45$, total $0.63$.
- id: q015
  title: Axis direction
  type: multipleChoice
  prompt: |-
    For a non-symmetric object, changing axis direction through the same point can:
  choices:
  - id: a
    text: |-
      change $I$ because distances to the axis change
  - id: b
    text: |-
      never change $I$
  - id: c
    text: |-
      change mass
  - id: d
    text: |-
      make $I$ dimensionless
  answer:
    choiceId: a
  explanation: |-
    $I$ depends on perpendicular distances to the selected axis.
