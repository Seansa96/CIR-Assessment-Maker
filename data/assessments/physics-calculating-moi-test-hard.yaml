questions:
- id: q1
  type: numericResponse
  prompt: A nonuniform rod of length $L = 1.0 \text{ m}$ lies along the x-axis from
    $x=0$ to $x=1$. Its linear mass density is $\lambda(x) = 2.0x$. What is its moment
    of inertia about the y-axis ($x=0$)?
  answer:
    value: 0.5
    tolerance: 0.05
  explanation: $I = \int r^2 dm = \int_0^1 x^2 (2.0x dx) = \int_0^1 2.0x^3 dx = [0.5x^4]_0^1
    = 0.5 \text{ kg}\cdot\text{m}^2$.
