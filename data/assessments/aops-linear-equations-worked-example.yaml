workedExamples:
- id: aops-linear-equations-problem-1
  title: Clearing fractions without changing the equation
  problem: |-
    Solve and verify

    $$
    \frac{2x-1}{3}-\frac{x+2}{4}=\frac56.
    $$
  steps:
  - id: aops-linear-equations-p1-s1
    title: Choose a common multiplier
    instruction: |-
      The denominators are 3, 4, and 6, whose least common multiple is 12. Multiplying the entire equation by 12 clears every numerical denominator while preserving equivalence.
    type: multipleChoice
    prompt: Which multiplier clears all denominators in one step?
    choices:
    - id: a
      text: '6'
    - id: b
      text: '12'
    - id: c
      text: '18'
    - id: d
      text: '24 only'
    answer:
      choiceId: b
    explanation: Twelve is divisible by 3, 4, and 6.
  - id: aops-linear-equations-p1-s2
    title: Distribute the multiplier to every term
    instruction: |-
      Multiplication by 12 gives

      $$4(2x-1)-3(x+2)=10.$$

      The subtraction before the second fraction remains attached to the whole numerator $x+2$.
    type: multipleChoice
    prompt: Which cleared equation is correct?
    choices:
    - id: a
      text: '$4(2x-1)-3(x+2)=10$'
    - id: b
      text: '$4(2x-1)-(x+2)=5$'
    - id: c
      text: '$12(2x-1)-12(x+2)=10$'
    - id: d
      text: '$4(2x-1)-3x+2=10$'
    answer:
      choiceId: a
    explanation: Each term receives 12 divided by its own denominator, and parentheses preserve the second numerator.
  - id: aops-linear-equations-p1-s3
    title: Expand and collect like terms
    instruction: |-
      Distribute carefully:

      $$8x-4-3x-6=10.$$

      Combining like terms gives $5x-10=10$, and adding 10 to both sides gives $5x=20$.
    type: multipleChoice
    prompt: What equation remains after expansion and collection?
    choices:
    - id: a
      text: '$5x-10=10$'
    - id: b
      text: '$11x-2=10$'
    - id: c
      text: '$5x+2=10$'
    - id: d
      text: '$8x-3x+2=10$'
    answer:
      choiceId: a
    explanation: The outer subtraction changes both terms in $3(x+2)$.
  - id: aops-linear-equations-p1-s4
    title: Isolate the variable reversibly
    instruction: |-
      Divide $5x=20$ by the known nonzero number 5:

      $$x=4.$$
    type: multipleChoice
    prompt: Which operation completes the isolation?
    choices:
    - id: a
      text: Divide both sides by 5.
    - id: b
      text: Subtract 5 from the left side only.
    - id: c
      text: Multiply both sides by zero.
    - id: d
      text: Divide both sides by $x$.
    answer:
      choiceId: a
    explanation: Division by the nonzero coefficient 5 preserves equivalence.
  - id: aops-linear-equations-p1-s5
    title: Verify in the original fractional equation
    instruction: |-
      Substitute $x=4$:

      $$
      \frac{8-1}{3}-\frac{4+2}{4}=\frac73-\frac32=\frac{14-9}{6}=\frac56.
      $$

      The original left side equals the original right side, so $x=4$ is verified.
    type: multipleChoice
    prompt: Why check the original rather than only $5x=20$?
    choices:
    - id: a
      text: It checks the denominator-clearing and distribution steps as well as the final arithmetic.
    - id: b
      text: The simplified equation has no relationship to the original.
    - id: c
      text: Verification changes the solution.
    - id: d
      text: Fractions cannot be solved algebraically.
    answer:
      choiceId: a
    explanation: A candidate can satisfy a later line even if an earlier transformation contained an arithmetic error.
- id: aops-linear-equations-problem-2
  title: Modeling a trip with two rates
  problem: |-
    A vehicle travels 120 miles in 2 hours. It drives part of the trip at 50 miles per hour and the rest at 70 miles per hour. How long does it travel at each speed?
  steps:
  - id: aops-linear-equations-p2-s1
    title: Define time variables with units
    instruction: |-
      Let $t_{50}$ be the hours traveled at 50 mph and $t_{70}$ the hours at 70 mph. The variables represent times, not distances, because the problem asks for time at each speed.
    type: multipleChoice
    prompt: Which definitions align with the requested quantities?
    choices:
    - id: a
      text: '$t_{50}$ and $t_{70}$ are the hours at the two speeds.'
    - id: b
      text: '$t_{50}$ and $t_{70}$ are the two speeds.'
    - id: c
      text: '$t_{50}$ is total distance and $t_{70}$ is total time.'
    - id: d
      text: Both variables are measured in miles.
    answer:
      choiceId: a
    explanation: Clear variables and units make the model interpretable.
  - id: aops-linear-equations-p2-s2
    title: Translate the total time and distance
    instruction: |-
      The total time equation is

      $$t_{50}+t_{70}=2.$$

      Since distance equals rate times time, the total distance equation is

      $$50t_{50}+70t_{70}=120.$$
    type: multipleChoice
    prompt: Why are the terms $50t_{50}$ and $70t_{70}$ distances?
    choices:
    - id: a
      text: Miles per hour multiplied by hours gives miles.
    - id: b
      text: Speeds and times should always be added.
    - id: c
      text: The subscripts are distances.
    - id: d
      text: Dividing speed by time gives distance.
    answer:
      choiceId: a
    explanation: The units cancel hours and leave miles.
  - id: aops-linear-equations-p2-s3
    title: Eliminate one variable
    instruction: |-
      Multiply the time equation by 50:

      $$50t_{50}+50t_{70}=100.$$

      Subtract this from the distance equation to obtain $20t_{70}=20$, hence $t_{70}=1$ hour.
    type: multipleChoice
    prompt: What does subtraction eliminate?
    choices:
    - id: a
      text: '$t_{50}$'
    - id: b
      text: '$t_{70}$'
    - id: c
      text: Both variables
    - id: d
      text: The total distance
    answer:
      choiceId: a
    explanation: Both equations have the same $50t_{50}$ term after scaling.
  - id: aops-linear-equations-p2-s4
    title: Recover the remaining time
    instruction: |-
      Substitute $t_{70}=1$ into $t_{50}+t_{70}=2$:

      $$t_{50}+1=2,$$

      so $t_{50}=1$ hour.
    type: multipleChoice
    prompt: What is the ordered pair $(t_{50},t_{70})$?
    choices:
    - id: a
      text: '$(1,1)$'
    - id: b
      text: '$(2,0)$'
    - id: c
      text: '$(0,2)$'
    - id: d
      text: '$(50,70)$'
    answer:
      choiceId: a
    explanation: The two one-hour segments total two hours.
  - id: aops-linear-equations-p2-s5
    title: Verify time, distance, and context
    instruction: |-
      The times are nonnegative and sum to 2. The traveled distance is

      $$50(1)+70(1)=120\text{ miles}.$$

      Both original conditions and the physical restrictions are satisfied.
    type: multipleChoice
    prompt: Which check would be insufficient by itself?
    choices:
    - id: a
      text: Checking only that the times sum to 2, without checking distance
    - id: b
      text: Checking both equations and nonnegative times
    - id: c
      text: Recomputing both segment distances
    - id: d
      text: Confirming the units are hours and miles
    answer:
      choiceId: a
    explanation: A system solution must satisfy every equation, not just one.
- id: aops-linear-equations-problem-3
  title: A parameter changes the number of solutions
  problem: |-
    For every real value of $k$, classify the solutions of

    $$
    (k-2)x=k-2.
    $$
  steps:
  - id: aops-linear-equations-p3-s1
    title: Identify the tempting but conditional cancellation
    instruction: |-
      Cancelling $k-2$ would mean dividing both sides by $k-2$. That step is legal only when $k-2\ne0$, so the parameter value $k=2$ must be separated before division.
    type: multipleChoice
    prompt: Which value requires its own case?
    choices:
    - id: a
      text: '$k=0$'
    - id: b
      text: '$k=1$'
    - id: c
      text: '$k=2$'
    - id: d
      text: Every value makes the divisor zero.
    answer:
      choiceId: c
    explanation: The prospective divisor $k-2$ vanishes exactly at $k=2$.
  - id: aops-linear-equations-p3-s2
    title: Solve the nonzero-coefficient case
    instruction: |-
      If $k\ne2$, divide by the nonzero number $k-2$:

      $$x=1.$$

      Thus every parameter value other than 2 produces exactly one solution.
    type: multipleChoice
    prompt: What is the solution when $k\ne2$?
    choices:
    - id: a
      text: '$x=k-2$'
    - id: b
      text: '$x=1$'
    - id: c
      text: '$x=0$'
    - id: d
      text: No solution
    answer:
      choiceId: b
    explanation: The identical nonzero factor cancels from both sides.
  - id: aops-linear-equations-p3-s3
    title: Substitute the exceptional parameter
    instruction: |-
      At $k=2$, the equation becomes

      $$0\cdot x=0,$$

      or $0=0$. This statement is true for every real $x$.
    type: multipleChoice
    prompt: How is the $k=2$ case classified?
    choices:
    - id: a
      text: One solution, $x=0$
    - id: b
      text: No solution
    - id: c
      text: Infinitely many solutions
    - id: d
      text: One solution, $x=1$
    answer:
      choiceId: c
    explanation: The resulting identity imposes no restriction on $x$.
  - id: aops-linear-equations-p3-s4
    title: State the classification without hiding a case
    instruction: |-
      The complete answer is:

      - if $k\ne2$, the unique solution is $x=1$;
      - if $k=2$, every real $x$ is a solution.

      A parameter classification is incomplete unless each exceptional value and its solution set are stated.
    type: multipleChoice
    prompt: Which answer is complete?
    choices:
    - id: a
      text: '$x=1$'
    - id: b
      text: '$x=1$ unless $k=2$, when every real $x$ works'
    - id: c
      text: '$k=2$ only'
    - id: d
      text: There are always infinitely many solutions.
    answer:
      choiceId: b
    explanation: It reports both the ordinary and exceptional parameter cases.
  - id: aops-linear-equations-p3-s5
    title: Contrast identity with contradiction
    instruction: |-
      If the right side had instead been 6, the exceptional case of $(k-2)x=6$ at $k=2$ would become $0=6$, giving no solution. Whether a zero coefficient yields none or infinitely many depends on the remaining constant statement.
    type: multipleChoice
    prompt: 'At $k=2$, how is $(k-2)x=6$ classified?'
    choices:
    - id: a
      text: One solution
    - id: b
      text: Infinitely many solutions
    - id: c
      text: No solution
    - id: d
      text: The equation remains unsimplified.
    answer:
      choiceId: c
    explanation: Substitution gives the contradiction $0=6$.
