workedExamples:
- id: basic-vertical
  title: Area using Vertical Slices
  problem: 'Find the area of the region enclosed by the parabola $y = 2 - x^2$ and
    the line $y = -x$.

    '
  steps:
  - id: step-basic-vertical-1
    title: Find the points of intersection
    type: freeResponse
    skills:
    - area-between-curves
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Set the two equations equal to each other to find where the curves
      intersect.


      $$

      2 - x^2 = -x

      $$


      $$

      x^2 - x - 2 = 0

      $$


      Factoring gives $(x-2)(x+1) = 0$, so the intersection points are $x = -1$ and
      $x = 2$.

      '
  - id: step-basic-vertical-2
    title: Identify the top and bottom curves
    type: freeResponse
    skills:
    - area-between-curves
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Pick a test point between $x = -1$ and $x = 2$, such as $x = 0$.


      Top curve: $y = 2 - (0)^2 = 2$

      Bottom curve: $y = -0 = 0$


      So the parabola $y = 2 - x^2$ is the upper curve, and the line $y = -x$ is the
      lower curve.

      '
  - id: step-basic-vertical-3
    title: Set up and evaluate the integral
    type: freeResponse
    skills:
    - area-between-curves
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Integrate the difference (top - bottom) from $-1$ to $2$.


      $$

      A = \int_{-1}^2 [(2 - x^2) - (-x)]\,dx = \int_{-1}^2 (2 - x^2 + x)\,dx

      $$


      Evaluate the antiderivative:


      $$

      \left[ 2x - \frac{x^3}{3} + \frac{x^2}{2} \right]_{-1}^2

      $$


      At $x=2$: $4 - 8/3 + 2 = 6 - 8/3 = 10/3$.

      At $x=-1$: $-2 - (-1/3) + 1/2 = -2 + 1/3 + 1/2 = -7/6$.


      $$

      A = \frac{10}{3} - \left(-\frac{7}{6}\right) = \frac{20}{6} + \frac{7}{6} =
      \frac{27}{6} = \frac{9}{2} = 4.5

      $$

      '
  check:
    id: basic-vertical-check
    type: numericResponse
    skills:
    - area-between-curves
    prompt: What would the limits of integration be if we wanted only the area in
      the first quadrant ($x \ge 0$, $y \ge 0$)? Provide the upper limit.
    answer:
      value: 1.414
      tolerance: 0.1
    explanation: 'In the first quadrant, the bounded region stops where the parabola
      hits the x-axis, which is $2 - x^2 = 0 \implies x = \sqrt{2} \a\approx 1.414$.

      '
- id: basic-horizontal
  title: Area using Horizontal Slices
  problem: 'Find the area of the region bounded by $x = y^2 - 4y$ and $x = 2y - y^2$.

    '
  steps:
  - id: step-basic-horizontal-1
    title: Find the points of intersection
    type: freeResponse
    skills:
    - area-between-curves
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Set the equations equal to each other to solve for $y$.


      $$

      y^2 - 4y = 2y - y^2

      $$


      $$

      2y^2 - 6y = 0 \implies 2y(y - 3) = 0

      $$


      The intersection points are $y = 0$ and $y = 3$.

      '
  - id: step-basic-horizontal-2
    title: Identify the right and left curves
    type: freeResponse
    skills:
    - area-between-curves
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Pick a test point between $y = 0$ and $y = 3$, such as $y = 1$.


      Curve 1: $x = 1^2 - 4(1) = -3$

      Curve 2: $x = 2(1) - 1^2 = 1$


      So $x = 2y - y^2$ is on the right, and $x = y^2 - 4y$ is on the left.

      '
  - id: step-basic-horizontal-3
    title: Set up and evaluate the integral
    type: freeResponse
    skills:
    - area-between-curves
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Integrate the difference (right - left) from $0$ to $3$.


      $$

      A = \int_0^3 [(2y - y^2) - (y^2 - 4y)]\,dy = \int_0^3 (6y - 2y^2)\,dy

      $$


      Evaluate the antiderivative:


      $$

      \left[ 3y^2 - \frac{2y^3}{3} \right]_0^3 = \left( 3(9) - \frac{2(27)}{3} \right)
      - 0 = 27 - 18 = 9

      $$

      '
  check:
    id: basic-horizontal-check
    type: multipleChoice
    skills:
    - area-between-curves
    prompt: Why was it much better to integrate with respect to $y$ for this problem?
    choices:
    - id: a
      text: Because expressing the curves as functions of $x$ (e.g., $y = f(x)$) would
        require splitting the region into multiple parts and using square roots.
    - id: b
      text: Because the x-axis is a\rhorizontal line.
    - id: c
      text: Because the area would be negative otherwise.
    - id: d
      text: Because $y^2$ cannot be integrated with respect to $x$.
    answer:
      choiceId: a
    explanation: '$x = y^2 - 4y$ is a sideways parabola. Solving it for $y$ gives
      $y = 2 \pm \sqrt{x+4}$, which makes vertical slicing very messy!

      '
