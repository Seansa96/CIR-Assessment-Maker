questions:
- id: q001
  type: multipleChoice
  prompt: Which item has a definite truth value as written?
  choices:
  - id: a
    text: Every polynomial of degree $n$ has at most $n$ roots.
  - id: b
    text: The polynomial has at most $n$ roots.
    issueSignals:
    - id: unbound-reference
  - id: c
    text: Factor the polynomial.
    issueSignals:
    - id: command-for-statement
  - id: d
    text: How many roots does the polynomial have?
    issueSignals:
    - id: question-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: unbound-reference
  difficultyDimensions:
  - structuralRecognition
  - quantifierScope
  - errorDiagnosis
  difficultyEvidence: Distinguishes a universally framed assertion from context-dependent language and nonassertions.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: The universally framed polynomial claim has a definite truth value.

    Why it works: “Every” binds the variable and makes a single claim over a stated class of polynomials.

    Why the other choices fail: B lacks a specified polynomial and degree context, C is an instruction, and D is
    a question.'
- id: q002
  type: multipleChoice
  prompt: Let $P(x)$ mean “$x$ is a multiple of $6$.” Which sentence is an open sentence?
  choices:
  - id: a
    text: $P(x)$.
  - id: b
    text: For every integer $x$, $P(x)$ implies $x$ is even.
    issueSignals:
    - id: quantified-claim-called-open
  - id: c
    text: $6$ is a multiple of $6$.
    issueSignals:
    - id: fixed-value-claim-called-open
  - id: d
    text: Let $x=6$.
    issueSignals:
    - id: command-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: quantified-claim-called-open
  difficultyDimensions:
  - representationTransfer
  - quantifierScope
  - errorDiagnosis
  difficultyEvidence: Requires interpreting symbolic predicate notation and contrasting unbound, bound, fixed, and
    imperative forms.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $P(x)$ is open because its truth still depends on the value assigned to $x$.

    Why it works: The predicate names a property but does not bind its variable.

    Why the other choices fail: B binds $x$ universally, C has a fixed true value, and D gives a command rather
    than an assertion.'
- id: q003
  type: multipleChoice
  prompt: A textbook writes $R$ for “The function $f(x)=x^2$ is continuous.” What can a later proof validly do?
  choices:
  - id: a
    text: Refer to the same claim simply as $R$.
  - id: b
    text: Treat $R$ as proof that every function is continuous.
    issueSignals:
    - id: label-for-generalization
  - id: c
    text: Treat $R$ as the numerical value of $f(2)$.
    issueSignals:
    - id: statement-value-confused
  - id: d
    text: Treat $R$ as an instruction to square $x$.
    issueSignals:
    - id: statement-operation-confused
  answer:
    choiceId: a
  issueSignals:
  - id: statement-value-confused
  difficultyDimensions:
  - representationTransfer
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Tests the distinction between a statement label, a function value, and an operation.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: A proof may use $R$ as shorthand for the designated continuity statement.

    Why it works: Naming a statement supports concise logical discussion without changing the statement itself.

    Why the other choices fail: B makes an unsupported generalization, C changes a claim into a value, and D changes
    it into a command.'
- id: q004
  type: multipleChoice
  prompt: Why can “$x$ is even” be true for $x=4$ and false for $x=7$ without being a contradiction?
  choices:
  - id: a
    text: It is an open sentence whose truth depends on the assigned value of $x$.
  - id: b
    text: Every open sentence is both true and false at once.
    issueSignals:
    - id: assignment-dependence-misread
  - id: c
    text: Evenness changes meaning between integers.
    issueSignals:
    - id: property-meaning-changed
  - id: d
    text: The symbol $x$ always means both 4 and 7.
    issueSignals:
    - id: variable-identity-confused
  answer:
    choiceId: a
  issueSignals:
  - id: assignment-dependence-misread
  difficultyDimensions:
  - definitionApplication
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Requires applying the open-sentence definition to two contrasting substitutions without confusing
    contexts.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: The sentence is open, so its truth is evaluated after assigning a value to $x$.

    Why it works: Substitution produces different completed statements: $4$ is even and $7$ is not even.

    Why the other choices fail: B mistakes context-dependent truth for simultaneous contradiction, while C and D
    misstate the roles of properties and variables.'
- id: q005
  type: multipleChoice
  prompt: Which revision turns the open sentence “x is a multiple of 3” into a statement that is true?
  choices:
  - id: a
    text: For every integer x, if x is a multiple of 3, then x is divisible by 3.
  - id: b
    text: For every integer x, x is a multiple of 3.
    issueSignals:
    - id: universal-claim-overgeneralized
  - id: c
    text: Let x be a multiple of 3.
    issueSignals:
    - id: declaration-for-assertion-confused
  - id: d
    text: Is x a multiple of 3?
    issueSignals:
    - id: question-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: universal-claim-overgeneralized
  difficultyDimensions:
  - quantifierScope
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Repairs an open sentence while preserving a true relation between a property and its consequence.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: A is a true quantified conditional.

    Why it works: It binds x over the integers and states the definitional consequence of being a multiple of 3.

    Why the other choices fail: B makes every integer a multiple of 3, C only gives an instruction, and D remains
    a question.'
- id: q006
  type: multipleChoice
  prompt: A proof labels the claim “7 is prime” by P. Which inference is legitimate if P is false?
  choices:
  - id: a
    text: The labelled claim is false; the letter P still refers to that same claim.
  - id: b
    text: P must instead name the number 7.
    issueSignals:
    - id: statement-value-confused
  - id: c
    text: P becomes an open sentence after being false.
    issueSignals:
    - id: truth-status-open-sentence-confused
  - id: d
    text: A false claim cannot be given a label.
    issueSignals:
    - id: false-statement-unnameable
  answer:
    choiceId: a
  issueSignals:
  - id: statement-value-confused
  difficultyDimensions:
  - structuralRecognition
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Separates the truth status of a labelled statement from the metalinguistic role of its label.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: P continues to name the false statement “7 is prime.”

    Why it works: Labels abbreviate claims; they do not change a claim''s truth value or grammatical type.

    Why the other choices fail: B changes a proposition into a number, C confuses false with unbound, and D rejects
    valid notation.'
- id: q007
  type: multipleChoice
  prompt: Which line can be assigned a truth value without first choosing a value for x?
  choices:
  - id: a
    text: For every real x, x+x=2x.
  - id: b
    text: x+x=2x.
    issueSignals:
    - id: open-sentence-missed
  - id: c
    text: Simplify x+x.
    issueSignals:
    - id: command-for-statement
  - id: d
    text: What is x+x?
    issueSignals:
    - id: question-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: open-sentence-missed
  difficultyDimensions:
  - quantifierScope
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Distinguishes a quantified identity from its visually similar unbound open sentence.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: A is truth-evaluable because it quantifies x over the real numbers.

    Why it works: The universal quantifier binds the variable while retaining the identity for every allowed value.

    Why the other choices fail: B leaves x free, C commands a calculation, and D asks for one.'
- id: q008
  type: multipleChoice
  prompt: A text calls the true claim “0 is an integer” R. Which sentence uses R as a statement rather than as a
    number?
  choices:
  - id: a
    text: If R, then the set of integers is nonempty.
  - id: b
    text: R+1=2.
    issueSignals:
    - id: statement-treated-as-number
  - id: c
    text: R is the remainder after division.
    issueSignals:
    - id: label-referent-replaced
  - id: d
    text: Compute R.
    issueSignals:
    - id: statement-treated-as-command-input
  answer:
    choiceId: a
  issueSignals:
  - id: statement-treated-as-number
  difficultyDimensions:
  - representationTransfer
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Transfers a letter-label convention into a conditional while rejecting numerical and operational
    reinterpretations.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: A uses R as the truth-bearing claim it names.

    Why it works: A statement label can occupy the statement position of a conditional.

    Why the other choices fail: B and C replace a proposition with a numeric object, while D treats it as an operation
    target.'
- id: q009
  type: multipleChoice
  prompt: Which claim is false but still a mathematical statement as written?
  choices:
  - id: a
    text: Every real number is positive.
  - id: b
    text: x is positive.
    issueSignals:
    - id: open-sentence-missed
  - id: c
    text: Make x positive.
    issueSignals:
    - id: command-for-statement
  - id: d
    text: Is x positive?
    issueSignals:
    - id: question-for-statement
  answer:
    choiceId: a
  issueSignals:
  - id: open-sentence-missed
  difficultyDimensions:
  - structuralRecognition
  - errorDiagnosis
  - counterexampleOrConstruction
  difficultyEvidence: Requires separating truth status from statement status and recognizing a counterexample to
    a quantified claim.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: A is false, but it is a statement.

    Why it works: It asserts a definite universal claim; 0 supplies a counterexample.

    Why the other choices fail: B depends on x, C is an instruction, and D is a question.'
- id: q010
  type: multipleChoice
  prompt: Why is “For every integer n, n is even or n is odd” not made ambiguous by the variable n?
  choices:
  - id: a
    text: The quantifier fixes both the domain and the claim to be checked for each integer.
  - id: b
    text: A variable has one permanently assigned value in every statement.
    issueSignals:
    - id: variable-fixed-value-confused
  - id: c
    text: A sentence is a statement only when no variables appear.
    issueSignals:
    - id: variable-statement-confused
  - id: d
    text: The word “or” removes the need to state a domain.
    issueSignals:
    - id: connective-for-domain-substituted
  answer:
    choiceId: a
  issueSignals:
  - id: variable-statement-confused
  difficultyDimensions:
  - quantifierScope
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Evaluates how quantification removes dependence on an arbitrary symbol while preserving a
    disjunctive claim.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: The universal quantifier binds n over the integers.

    Why it works: The sentence has a fixed meaning and truth value even though its claim applies to many possible
    values.

    Why the other choices fail: B invents one fixed assignment, C denies quantified mathematics, and D confuses
    a connective with a domain declaration.'
