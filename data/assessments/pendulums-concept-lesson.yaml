lesson:
  introduction: This lesson develops Pendulums from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: For **Pendulums**, start from the model $T=2\pi\sqrt{L/g}$. This step connects the physical
      picture to the physical system and assumptions. State assumptions, track SI units, and explain what
      a limiting case means before calculating.
