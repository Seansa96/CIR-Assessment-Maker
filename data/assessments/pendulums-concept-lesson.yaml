lesson:
  introduction: This lesson develops Pendulums from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      A simple pendulum consists of a point mass $m$ (the bob) attached to a massless, inextensible string of length $L$. It is suspended from a pivot point and allowed to swing in a vertical plane under the influence of gravity.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s1, type: multipleChoice, prompt: 'What idealization defines a simple pendulum?', choices: [{id: a, text: 'A point mass on a light string'}, {id: b, text: 'A constant force'}, {id: c, text: 'Mass only'}, {id: d, text: 'No model'}], answer: {choiceId: a}, explanation: 'This follows from the small-angle pendulum model.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The measurable quantities are the length of the string $L$, the mass of the bob $m$, the acceleration due to gravity $g$, and the angular displacement $\theta$ from the vertical equilibrium position.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s2, type: multipleChoice, prompt: 'Which length affects simple-pendulum period?', choices: [{id: a, text: '$L$'}, {id: b, text: 'A constant force'}, {id: c, text: 'Mass only'}, {id: d, text: 'No model'}], answer: {choiceId: a}, explanation: 'This follows from the small-angle pendulum model.'}
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model relies on analyzing the forces on the bob. The tension in the string and gravity act on the mass. The component of gravity tangent to the circular path provides the restoring force: $F_{\text{net}} = -mg\sin\theta$. Here, the negative sign indicates it points back toward $\theta = 0$.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s3, type: multipleChoice, prompt: 'What is the tangential restoring force?', choices: [{id: a, text: '$-mg\sin\theta$'}, {id: b, text: 'A constant force'}, {id: c, text: 'Mass only'}, {id: d, text: 'No model'}], answer: {choiceId: a}, explanation: 'This follows from the small-angle pendulum model.'}
  - id: s4
    title: Calculus connection
    content: >-
      To connect this to our SHM equations, we use the small-angle approximation: for $\theta \ll 1$ radian, $\sin\theta \approx \theta$. Thus, $F_{\text{net}} \approx -mg\theta$. Since arc length $s = L\theta$, we can write $F_{\text{net}} = -\frac{mg}{L}s$. This is exactly Hooke's Law form ($F = -ks$) with an effective spring constant $k_{\text{eff}} = \frac{mg}{L}$.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s4, type: multipleChoice, prompt: 'Which approximation produces the SHM model?', choices: [{id: a, text: '$\sin\theta\approx\theta$'}, {id: b, text: 'A constant force'}, {id: c, text: 'Mass only'}, {id: d, text: 'No model'}], answer: {choiceId: a}, explanation: 'This follows from the small-angle pendulum model.'}
  - id: s5
    title: Derivation or justification
    content: >-
      By substituting $k_{\text{eff}}$ into the SHM period formula $T = 2\pi\sqrt{\frac{m}{k_{\text{eff}}}}$, we get $T = 2\pi\sqrt{\frac{m}{mg/L}}$. The mass $m$ cancels out entirely, yielding the famous period equation for a simple pendulum: $T = 2\pi\sqrt{\frac{L}{g}}$.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s5, type: multipleChoice, prompt: 'What is the small-angle simple-pendulum period?', choices: [{id: a, text: '$T=2\pi\sqrt{L/g}$'}, {id: b, text: 'A constant force'}, {id: c, text: 'Mass only'}, {id: d, text: 'No model'}], answer: {choiceId: a}, explanation: 'This follows from the small-angle pendulum model.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, the angular displacement $\theta(t)$ follows a sinusoidal curve over time, just like the linear displacement of a mass on a spring. However, this is only perfectly true for very small swing amplitudes.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s6, type: multipleChoice, prompt: 'How does small-angle displacement vary in time?', choices: [{id: a, text: 'Sinusoidal for small angles'}, {id: b, text: 'A constant force'}, {id: c, text: 'Mass only'}, {id: d, text: 'No model'}], answer: {choiceId: a}, explanation: 'This follows from the small-angle pendulum model.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A key quantitative strategy for a physical (rigid body) pendulum is to use torque instead of force: $\tau = -mgd\sin\theta = I\alpha$. Using the small angle approximation yields $T = 2\pi\sqrt{\frac{I}{mgd}}$, where $I$ is the moment of inertia and $d$ is the distance from pivot to center of mass.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s7, type: multipleChoice, prompt: 'What quantity is used for a physical pendulum?', choices: [{id: a, text: 'Torque'}, {id: b, text: 'A constant force'}, {id: c, text: 'Mass only'}, {id: d, text: 'No model'}], answer: {choiceId: a}, explanation: 'This follows from the small-angle pendulum model.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: Note that the period $T$ is completely independent of the mass $m$ (a consequence of the equivalence principle). If length $L$ increases, $T$ increases. If placed on a planet with higher gravity $g$, $T$ decreases. Units: $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$.
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    check: {id: pend-s8, type: multipleChoice, prompt: 'Does simple-pendulum period depend on bob mass?', choices: [{id: a, text: 'No'}, {id: b, text: 'Directly'}, {id: c, text: 'Inversely'}, {id: d, text: 'Only at high gravity'}], answer: {choiceId: a}, explanation: 'Mass cancels from the small-angle period derivation.'}
