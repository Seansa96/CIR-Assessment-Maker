items:
  - id: r-subspace-test-1
    type: flashcard
    prompt: |
      State the three conditions of the Subspace Test.
    answer:
      expected: |
        A subset $H$ of $V$ is a subspace if and only if:
        1. $\vec{0} \in H$ (contains the zero vector).
        2. $H$ is closed under addition ($\vec{u}+\vec{v} \in H$ for all $\vec{u},\vec{v} \in H$).
        3. $H$ is closed under scalar multiplication ($c\vec{v} \in H$ for all $\vec{v} \in H$ and scalars $c$).

  - id: r-subspace-test-2
    type: cloze
    prompt: |
      A subset $H$ is a subspace if and only if it contains the {{zero vector}} and is closed under {{addition}} and {{scalar multiplication}}.
    answer:
      expected: 'zero vector, addition, scalar multiplication'

  - id: r-col-space-def
    type: flashcard
    prompt: |
      What is the column space of a matrix $A$, and what space does it live in?
    answer:
      expected: |
        $\text{Col}(A)$ is the set of all linear combinations of the columns of $A$. For an $m \times n$ matrix $A$, it is a subspace of $\mathbb{R}^m$.

  - id: r-null-space-def
    type: flashcard
    prompt: |
      What is the null space of a matrix $A$, and what space does it live in?
    answer:
      expected: |
        $\text{Nul}(A)$ is the set of all solutions $\vec{x}$ to $A\vec{x} = \vec{0}$. For an $m \times n$ matrix $A$, it is a subspace of $\mathbb{R}^n$.

  - id: r-col-basis
    type: flashcard
    prompt: |
      To find a basis for $\text{Col}(A)$, which columns do you use?
    answer:
      expected: |
        The pivot columns of the **original** matrix $A$ (not the row-reduced form). Row operations change the columns themselves but preserve which columns are linearly independent.

  - id: r-null-basis
    type: flashcard
    prompt: |
      To find a basis for $\text{Nul}(A)$, what process do you use?
    answer:
      expected: |
        Row reduce $[A | \vec{0}]$ to RREF, express basic (pivot) variables in terms of free variables, and write the general solution in parametric vector form. Each free variable contributes one basis vector to $\text{Nul}(A)$.

  - id: r-col-space-consistency
    type: cloze
    prompt: |
      The equation $A\vec{x} = \vec{b}$ is consistent if and only if $\vec{b}$ is in {{Col(A)}}.
    answer:
      expected: 'Col(A)'

  - id: r-row-space-def
    type: flashcard
    prompt: |
      What is the row space of a matrix $A$?
    answer:
      expected: |
        $\text{Row}(A)$ is the set of all linear combinations of the **rows** of $A$. It is a subspace of $\mathbb{R}^n$ (where $n$ is the number of columns). A basis for $\text{Row}(A)$ is given by the nonzero rows of any row echelon form of $A$.
