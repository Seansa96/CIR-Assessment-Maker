questions:
- id: q001
  type: multipleChoice
  prompt: 'You are given the theorem: ''If $f$ is differentiable on $[a,b]$, then $f$ is continuous on $[a,b]$''.
    You encounter a function $g$ that is NOT continuous on $[a,b]$. What is the most direct valid application of
    the theorem here?'
  choices:
  - id: a
    text: You can conclude that $g$ is NOT differentiable on $[a,b]$ by using the contrapositive of the theorem.
  - id: b
    text: The theorem does not apply because $g$ fails the conclusion.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: You can conclude that $g$ is differentiable because it is an exception.
    issueSignals:
    - id: mathematical-role-confusion
  - id: d
    text: You can conclude that $g$ is NOT differentiable by using the inverse of the theorem.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - applicationStrategy
  - logicalEquivalence
  - errorDiagnosis
  difficultyEvidence: Applies the contrapositive of a theorem ($\neg Q \implies \neg P$) to deduce the falsity of
    a hypothesis.
  explanation: 'Solution: You can conclude that $g$ is NOT differentiable on $[a,b]$ by using the contrapositive
    of the theorem.

    Why it works: The theorem is $P \\implies Q$. The contrapositive $\\neg Q \\implies \\neg P$ is logically equivalent.
    Since you know $\\neg Q$ ($g$ is not continuous), you can perfectly deduce $\\neg P$ ($g$ is not differentiable).

    Why the other choices fail: B is wrong because the contrapositive *is* a valid application. C is nonsense. D
    uses the wrong terminology; the inverse is $\\neg P \\implies \\neg Q$, which is not logically equivalent to
    the theorem.'
  prerequisiteObjectiveIds:
  - ml-structures-02
- id: q002
  type: multipleChoice
  prompt: 'A theorem states: ''Every polynomial of odd degree with real coefficients has at least one real root.''
    Which of the following is an INCORRECT application of this theorem?'
  choices:
  - id: a
    text: Using the theorem to find the exact numerical value of the root for $f(x) = x^3 - x + 1$.
  - id: b
    text: Concluding that $g(x) = x^5 + 2x^2 + 7$ has a real root, without calculating it.
    issueSignals:
    - id: applicationStrategy-error
  - id: c
    text: Naming the guaranteed root 'c' and writing $f(c) = 0$ in a proof.
    issueSignals:
    - id: applicationStrategy-error
  - id: d
    text: Applying the theorem to $h(x) = 5x^7 - 3$.
    issueSignals:
    - id: applicationStrategy-error
  answer:
    choiceId: a
  issueSignals:
  - id: applicationStrategy-error
  difficultyDimensions:
  - conceptualUnderstanding
  - applicationStrategy
  - errorDiagnosis
  difficultyEvidence: Distinguishes between a pure existence theorem (which guarantees a root) and a constructive
    algorithm (which finds the root).
  explanation: 'Solution: Using the theorem to find the exact numerical value of the root for $f(x) = x^3 - x +
    1$.

    Why it works: This is a pure existence theorem. It tells you a root exists (''at least one''), but it provides
    absolutely no formula or method for finding what that root actually is.

    Why the other choices fail: B is the exact intended use of the theorem. C is valid existential instantiation.
    D is a valid application because $h(x)$ is an odd-degree polynomial with real coefficients.'
  prerequisiteObjectiveIds:
  - ml-structures-02
- id: q003
  type: multipleChoice
  prompt: 'Consider the theorem: ''If $a$ and $b$ are integers and $p$ is prime, and $p$ divides $ab$, then $p$
    divides $a$ or $p$ divides $b$.'' If you know $7$ divides $14x$, what can you logically conclude using ONLY
    this theorem?'
  choices:
  - id: a
    text: $7$ divides $14$ or $7$ divides $x$.
  - id: b
    text: $7$ divides $x$.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: $7$ divides $14$ and $7$ divides $x$.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: You cannot conclude anything because $x$ might not be an integer.
    issueSignals:
    - id: domainCondition-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - applicationStrategy
  - representationTransfer
  - logicalEquivalence
  difficultyEvidence: Applies a theorem strictly as stated, resisting the urge to simplify the disjunctive conclusion
    using outside knowledge.
  explanation: 'Solution: $7$ divides $14$ or $7$ divides $x$.

    Why it works: The theorem guarantees the conclusion $P \\lor Q$. You instantiate $p=7$, $a=14$, $b=x$. The strict
    logical output of the theorem is exactly the disjunction: $7$ divides $14$ or $7$ divides $x$. (While outside
    arithmetic tells us $7|14$ is true, the *theorem itself* only outputs the ''or'' statement).

    Why the other choices fail: B attempts to force the ''or'' to resolve to the unknown variable, which isn''t
    guaranteed. C incorrectly changes the ''or'' to an ''and''. D adds a pedantic constraint; in this context, $x$
    is assumed to be part of the algebraic ring of integers, though strictly checking domains is good practice,
    A is the direct mechanical output.'
  prerequisiteObjectiveIds:
  - ml-structures-02
- id: q004
  type: multipleChoice
  prompt: 'A student writes: ''Since the function is continuous, Rolle''s Theorem tells us there is a point where
    the derivative is zero.'' What is the most critical flaw in this application?'
  choices:
  - id: a
    text: The student failed to verify the other hypotheses, such as differentiability and equal endpoints.
  - id: b
    text: The student applied the theorem backward (the converse).
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: Rolle's Theorem guarantees the derivative is positive, not zero.
    issueSignals:
    - id: factual-error
  - id: d
    text: The student should have used the contrapositive.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - errorDiagnosis
  - applicationStrategy
  - domainCondition
  difficultyEvidence: Diagnoses a flawed application of a multi-hypothesis theorem caused by omitting necessary
    conditions.
  explanation: 'Solution: The student failed to verify the other hypotheses, such as differentiability and equal
    endpoints.

    Why it works: Rolle''s Theorem requires three hypotheses: continuity on a closed interval, differentiability
    on the open interval, and equal function values at the endpoints ($f(a)=f(b)$). The student only checked continuity,
    meaning the theorem''s trigger was not fully satisfied.

    Why the other choices fail: B is incorrect; they are trying to apply the direct theorem, just poorly. C is factually
    wrong about Rolle''s Theorem. D is irrelevant; they want to prove the direct conclusion, so the contrapositive
    doesn''t help here.'
  prerequisiteObjectiveIds:
  - ml-structures-02
- id: q005
  type: multipleChoice
  prompt: A theorem begins “Let x be an integer. If x is divisible by 4, then x is even.” Which information is setup
    rather than the theorem's hypothesis?
  choices:
  - id: a
    text: x is an integer.
  - id: b
    text: x is divisible by 4.
    issueSignals:
    - id: hypothesis-setup-confused
  - id: c
    text: x is even.
    issueSignals:
    - id: conclusion-called-setup
  - id: d
    text: The theorem is false.
    issueSignals:
    - id: truth-status-invented
  answer:
    choiceId: a
  issueSignals:
  - id: hypothesis-setup-confused
  difficultyDimensions:
  - structuralRecognition
  - conditionChecking
  - errorDiagnosis
  difficultyEvidence: Separates a declaration establishing the universe of discourse from the conditional condition
    that triggers the conclusion.
  prerequisiteObjectiveIds:
  - ml-structures-02
  explanation: 'Solution: “x is an integer” sets the context for the theorem.

    Why it works: The conditional hypothesis is divisibility by 4; the setup identifies the kind of object to which
    the statement applies.

    Why the other choices fail: B is the condition, C is the result, and D makes an unsupported truth judgment.'
- id: q006
  type: multipleChoice
  prompt: A theorem states “P if and only if Q.” A proposed proof has established P. What conclusion is immediately
    licensed?
  choices:
  - id: a
    text: Q.
  - id: b
    text: Not Q.
    issueSignals:
    - id: biconditional-conclusion-negated
  - id: c
    text: Neither P nor Q.
    issueSignals:
    - id: biconditional-denied
  - id: d
    text: Only that Q might be true.
    issueSignals:
    - id: biconditional-weakened
  answer:
    choiceId: a
  issueSignals:
  - id: biconditional-weakened
  difficultyDimensions:
  - representationTransfer
  - reverseReasoning
  - conditionChecking
  difficultyEvidence: Applies the forward direction contained in a biconditional after identifying which side has
    been proved.
  prerequisiteObjectiveIds:
  - ml-structures-02
  explanation: 'Solution: Q follows from P.

    Why it works: An if-and-only-if statement contains the conditional P implies Q as one of its two directions.

    Why the other choices fail: B negates the result, C contradicts the given P, and D weakens a theorem into speculation.'
- id: q007
  type: multipleChoice
  prompt: A proposition is true but is introduced mainly to support a later theorem. Which label best describes
    that role?
  choices:
  - id: a
    text: Lemma.
  - id: b
    text: Corollary.
    issueSignals:
    - id: lemma-corollary-confused
  - id: c
    text: Definition.
    issueSignals:
    - id: lemma-definition-confused
  - id: d
    text: Counterexample.
    issueSignals:
    - id: theorem-role-confused
  answer:
    choiceId: a
  issueSignals:
  - id: lemma-corollary-confused
  difficultyDimensions:
  - structuralRecognition
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Identifies the proof-support function of a named result and distinguishes it from a consequence
    or terminology.
  prerequisiteObjectiveIds:
  - ml-structures-02
  explanation: 'Solution: A lemma is used principally to help prove another theorem.

    Why it works: Its role is intermediate support in an argument, regardless of the result''s standalone truth.

    Why the other choices fail: A corollary follows from a result, a definition names a concept, and a counterexample
    refutes a claim.'
- id: q008
  type: multipleChoice
  prompt: A theorem has hypothesis “a sequence is bounded and monotonic.” A sequence is bounded but not monotonic. What follows about using the theorem?
  choices:
  - id: a
    text: The theorem cannot yet be applied because one stated hypothesis is missing.
  - id: b
    text: The theorem applies because boundedness is the more important condition.
    issueSignals:
    - id: partial-hypothesis-treated-as-sufficient
  - id: c
    text: The theorem's conclusion is false.
    issueSignals:
    - id: failed-application-called-counterexample
  - id: d
    text: The converse of the theorem has been proved.
    issueSignals:
    - id: converse-inferred-from-missing-hypothesis
  answer:
    choiceId: a
  issueSignals:
  - id: partial-hypothesis-treated-as-sufficient
  difficultyDimensions:
  - conditionChecking
  - errorDiagnosis
  - reverseReasoning
  difficultyEvidence: Checks a conjunction of hypotheses and distinguishes inapplicability from a refutation of the theorem.
  prerequisiteObjectiveIds:
  - ml-structures-02
  explanation: |-
    Solution: The missing monotonicity condition prevents this application.
    Why it works: Every hypothesis joined by “and” must be established before the conclusion is licensed.
    Why the other choices fail: B drops a condition, C mistakes an unlicensed use for a counterexample, and D is unrelated.
- id: q009
  type: multipleChoice
  prompt: A theorem is not conditional; it states a fact about a particular object. Which conclusion about its form is justified?
  choices:
  - id: a
    text: It need not be rewritten as an if-then statement to count as a theorem.
  - id: b
    text: It cannot be proved because it has no hypothesis.
    issueSignals:
    - id: nonconditional-theorem-unprovable
  - id: c
    text: It is automatically a definition.
    issueSignals:
    - id: theorem-definition-confused
  - id: d
    text: It is necessarily a counterexample.
    issueSignals:
    - id: theorem-role-confused
  answer:
    choiceId: a
  issueSignals:
  - id: nonconditional-theorem-unprovable
  difficultyDimensions:
  - structuralRecognition
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Distinguishes the common conditional form of theorems from the separate concept of a theorem.
  prerequisiteObjectiveIds:
  - ml-structures-02
  explanation: |-
    Solution: A theorem may state a fact without conditional form.
    Why it works: The defining feature is a true proved mathematical statement, not a required grammar pattern.
    Why the other choices fail: B confuses form with provability, C changes a result into terminology, and D changes its logical role.
- id: q010
  type: multipleChoice
  prompt: A proof has established a theorem T. A later result follows immediately by applying T with verified hypotheses. What should the later result be called?
  choices:
  - id: a
    text: A corollary of T.
  - id: b
    text: The converse of T.
    issueSignals:
    - id: corollary-converse-confused
  - id: c
    text: A definition of T.
    issueSignals:
    - id: corollary-definition-confused
  - id: d
    text: A counterexample to T.
    issueSignals:
    - id: corollary-counterexample-confused
  answer:
    choiceId: a
  issueSignals:
  - id: corollary-converse-confused
  difficultyDimensions:
  - structuralRecognition
  - conditionChecking
  - errorDiagnosis
  difficultyEvidence: Classifies a result from its dependency relation to an established theorem and verified hypotheses.
  prerequisiteObjectiveIds:
  - ml-structures-02
  explanation: |-
    Solution: The immediate consequence is a corollary.
    Why it works: A corollary follows directly from a theorem or proposition rather than reversing or refuting it.
    Why the other choices fail: B reverses T, C is terminology, and D would contradict T rather than follow from it.
