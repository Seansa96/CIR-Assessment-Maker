questions:
- id: q001
  type: multipleChoice
  prompt: 'You are given the theorem: ''If $f$ is differentiable on $[a,b]$, then $f$ is continuous on $[a,b]$''.
    You encounter a function $g$ that is NOT continuous on $[a,b]$. What is the most direct valid application of
    the theorem here?'
  choices:
  - id: a
    text: You can conclude that $g$ is NOT differentiable on $[a,b]$ by using the contrapositive of the theorem.
  - id: b
    text: The theorem does not apply because $g$ fails the conclusion.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: You can conclude that $g$ is differentiable because it is an exception.
    issueSignals:
    - id: mathematical-role-confusion
  - id: d
    text: You can conclude that $g$ is NOT differentiable by using the inverse of the theorem.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - applicationStrategy
  - logicalEquivalence
  - errorDiagnosis
  difficultyEvidence: 'Applies the contrapositive of a theorem ($\neg Q \implies \neg P$) to deduce the falsity
    of a hypothesis.'
  explanation: |-
    Solution: You can conclude that $g$ is NOT differentiable on $[a,b]$ by using the contrapositive of the theorem.
    Why it works: The theorem is $P \\implies Q$. The contrapositive $\\neg Q \\implies \\neg P$ is logically equivalent. Since you know $\\neg Q$ ($g$ is not continuous), you can perfectly deduce $\\neg P$ ($g$ is not differentiable).
    Why the other choices fail: B is wrong because the contrapositive *is* a valid application. C is nonsense. D uses the wrong terminology; the inverse is $\\neg P \\implies \\neg Q$, which is not logically equivalent to the theorem.
- id: q002
  type: multipleChoice
  prompt: 'A theorem states: ''Every polynomial of odd degree with real coefficients has at least one real root.''
    Which of the following is an INCORRECT application of this theorem?'
  choices:
  - id: a
    text: Using the theorem to find the exact numerical value of the root for $f(x) = x^3 - x + 1$.
  - id: b
    text: Concluding that $g(x) = x^5 + 2x^2 + 7$ has a real root, without calculating it.
    issueSignals:
    - id: applicationStrategy-error
  - id: c
    text: Naming the guaranteed root 'c' and writing $f(c) = 0$ in a proof.
    issueSignals:
    - id: applicationStrategy-error
  - id: d
    text: Applying the theorem to $h(x) = 5x^7 - 3$.
    issueSignals:
    - id: applicationStrategy-error
  answer:
    choiceId: a
  issueSignals:
  - id: applicationStrategy-error
  difficultyDimensions:
  - conceptualUnderstanding
  - applicationStrategy
  - errorDiagnosis
  difficultyEvidence: Distinguishes between a pure existence theorem (which guarantees a root) and a constructive
    algorithm (which finds the root).
  explanation: |-
    Solution: Using the theorem to find the exact numerical value of the root for $f(x) = x^3 - x + 1$.
    Why it works: This is a pure existence theorem. It tells you a root exists ('at least one'), but it provides absolutely no formula or method for finding what that root actually is.
    Why the other choices fail: B is the exact intended use of the theorem. C is valid existential instantiation. D is a valid application because $h(x)$ is an odd-degree polynomial with real coefficients.
- id: q003
  type: multipleChoice
  prompt: 'Consider the theorem: ''If $a$ and $b$ are integers and $p$ is prime, and $p$ divides $ab$, then $p$
    divides $a$ or $p$ divides $b$.'' If you know $7$ divides $14x$, what can you logically conclude using ONLY
    this theorem?'
  choices:
  - id: a
    text: $7$ divides $14$ or $7$ divides $x$.
  - id: b
    text: $7$ divides $x$.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: $7$ divides $14$ and $7$ divides $x$.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: You cannot conclude anything because $x$ might not be an integer.
    issueSignals:
    - id: domainCondition-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - applicationStrategy
  - representationTransfer
  - logicalEquivalence
  difficultyEvidence: Applies a theorem strictly as stated, resisting the urge to simplify the disjunctive conclusion
    using outside knowledge.
  explanation: |-
    Solution: $7$ divides $14$ or $7$ divides $x$.
    Why it works: The theorem guarantees the conclusion $P \\lor Q$. You instantiate $p=7$, $a=14$, $b=x$. The strict logical output of the theorem is exactly the disjunction: $7$ divides $14$ or $7$ divides $x$. (While outside arithmetic tells us $7|14$ is true, the *theorem itself* only outputs the 'or' statement).
    Why the other choices fail: B attempts to force the 'or' to resolve to the unknown variable, which isn't guaranteed. C incorrectly changes the 'or' to an 'and'. D adds a pedantic constraint; in this context, $x$ is assumed to be part of the algebraic ring of integers, though strictly checking domains is good practice, A is the direct mechanical output.
- id: q004
  type: multipleChoice
  prompt: 'A student writes: ''Since the function is continuous, Rolle''s Theorem tells us there is a point where
    the derivative is zero.'' What is the most critical flaw in this application?'
  choices:
  - id: a
    text: The student failed to verify the other hypotheses, such as differentiability and equal endpoints.
  - id: b
    text: The student applied the theorem backward (the converse).
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: Rolle's Theorem guarantees the derivative is positive, not zero.
    issueSignals:
    - id: factual-error
  - id: d
    text: The student should have used the contrapositive.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - errorDiagnosis
  - applicationStrategy
  - domainCondition
  difficultyEvidence: Diagnoses a flawed application of a multi-hypothesis theorem caused by omitting necessary
    conditions.
  explanation: |-
    Solution: The student failed to verify the other hypotheses, such as differentiability and equal endpoints.
    Why it works: Rolle's Theorem requires three hypotheses: continuity on a closed interval, differentiability on the open interval, and equal function values at the endpoints ($f(a)=f(b)$). The student only checked continuity, meaning the theorem's trigger was not fully satisfied.
    Why the other choices fail: B is incorrect; they are trying to apply the direct theorem, just poorly. C is factually wrong about Rolle's Theorem. D is irrelevant; they want to prove the direct conclusion, so the contrapositive doesn't help here.
