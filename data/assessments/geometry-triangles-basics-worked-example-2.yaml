workedExamples:
- id: we-geom-tri-2
  title: Finding Base Angles
  steps:
  - id: step-1
    title: Identify the property of base angles
    type: multipleChoice
    choices:
    - id: c1
      text: They are complementary.
    - id: c2
      text: They are congruent (equal in measure).
    answer:
      choiceId: c2
    explanation: The base angles opposite the equal sides are congruent.
    instruction: Consider the following question to advance.
    prompt: According to the Isosceles Triangle Theorem, what is true about the base
      angles?
  - id: step-2
    title: Set up the equation
    type: multipleChoice
    choices:
    - id: c1
      text: |-
        $x + 40 = 180$
    - id: c2
      text: |-
        $2x + 40 = 180$
    answer:
      choiceId: c2
    explanation: Since there are two equal base angles, their sum plus the vertex
      angle equals 180.
    instruction: Consider the following question to advance.
    prompt: |-
      If we let the base angles be $x$, which equation is correct?
  - id: step-3
    title: Solve for x
    type: numericResponse
    answer:
      value: 70.0
      tolerance: 0.0
    explanation: |-
      $2x = 140$, so $x = 70^\circ$.
    instruction: Consider the following question to advance.
    prompt: |-
      Solve the equation $2x + 40 = 180$ for $x$.
  problem: |-
    In an isosceles triangle, the vertex angle measures $40^\circ$. What is the measure of one of the base angles?
