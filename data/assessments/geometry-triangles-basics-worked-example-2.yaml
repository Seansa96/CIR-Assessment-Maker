  - id: parallel-angle-chase
    title: |
      Angle Chase With a Parallel Segment
    problem: |
      ![Angle Chase With a Parallel Segment diagram](/assessments/geometry/triangles/geometry-triangles-basics-worked-example-2-parallel-angle-chase.svg)
      
      In triangle $ABC$, segment $DE$ is parallel to $BC$. The angle at $A$ is $46^\circ$, and the angle at $D$ in the smaller triangle is $62^\circ$. Find angle $C$ of the large triangle.
    steps:
      - id: parallel-angle-chase-step-1
        title: |
          Identify the governing idea
        instruction: |
          Start by deciding which theorem, formula, or geometric structure controls the problem.
        type: multipleChoice
        prompt: |
          Which idea should drive the solution?
        choices:
          - id: a
            text: |
              Triangle angle sum and corresponding angles
          - id: b
            text: |
              Pythagorean theorem
          - id: c
            text: |
              Triangle inequality only
          - id: d
            text: |
              A visual estimate without proof
        answer:
          choiceId: a
        explanation: |
          The controlling idea is Triangle angle sum and corresponding angles. It matches the given information and gives a reliable path.
      - id: parallel-angle-chase-step-2
