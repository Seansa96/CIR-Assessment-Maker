        title: |
          Find the key result
        instruction: |
          Now use the selected method to get the main intermediate or final value.
        type: multipleChoice
        prompt: |
          Which key result is correct?
        choices:
          - id: a
            text: |
              $72^\circ$
          - id: b
            text: |
              Not enough information
          - id: c
            text: |
              Use the largest number as the answer
          - id: d
            text: |
              The drawing alone determines it
        answer:
          choiceId: a
        explanation: |
          The third angle in the small triangle is $180-46-62=72$. Because $DE\parallel BC$, that angle corresponds to angle $C$.
