          - id: c
            text: |
              A different theorem is required after solving.
          - id: d
            text: |
              The diagram contradicts the computation.
        answer:
          choiceId: a
        explanation: |
          The third angle in the small triangle is $180-46-62=72$. Because $DE\parallel BC$, that angle corresponds to angle $C$.
      - id: parallel-angle-chase-step-5
