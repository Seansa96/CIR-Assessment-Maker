workedExamples:
  - id: classify-sides-angles
    title: |
      Classifying a Triangle From Side Lengths
    problem: |
      ![Classifying a Triangle From Side Lengths diagram](/assessments/geometry/triangles/geometry-triangles-basics-worked-example-2-classify-sides-angles.svg)
      
      A triangle has side lengths $9$, $9$, and $14$. Classify it by sides and by angles.
    steps:
      - id: classify-sides-angles-step-1
        title: |
          Identify the governing idea
        instruction: |
          Start by deciding which theorem, formula, or geometric structure controls the problem.
        type: multipleChoice
        prompt: |
          Which idea should drive the solution?
        choices:
          - id: a
            text: |
              Side classification plus converse of the Pythagorean theorem
          - id: b
            text: |
              Pythagorean theorem
          - id: c
            text: |
              Triangle inequality only
          - id: d
            text: |
              A visual estimate without proof
        answer:
          choiceId: a
        explanation: |
          The controlling idea is Side classification plus converse of the Pythagorean theorem. It matches the given information and gives a reliable path.
      - id: classify-sides-angles-step-2
        title: |
          Separate useful facts from noise
        instruction: |
          Before solving, identify the facts that justify the theorem or formula instead of grabbing a random equation.
        type: selectAll
        prompt: |
          Which statements support the solution?
        choices:
          - id: a
            text: |
              The given information matches Side classification plus converse of the Pythagorean theorem.
          - id: b
            text: |
              The diagram should be labeled before computing.
          - id: c
            text: |
              The final answer can be guessed from the drawing alone.
          - id: d
            text: |
              A different theorem should be used even if its conditions are missing.
        answer:
          choiceIds:
            - a
            - b
        explanation: |
          The correct statements connect the givens to the chosen method. The others either skip justification or apply a theorem without its required conditions.
      - id: classify-sides-angles-step-3
        title: |
          Find the key result
        instruction: |
          Now use the selected method to get the main intermediate or final value.
        type: multipleChoice
        prompt: |
          Which key result is correct?
        choices:
          - id: a
            text: |
              isosceles and obtuse
          - id: b
            text: |
              Not enough information
          - id: c
            text: |
              Use the largest number as the answer
          - id: d
            text: |
              The drawing alone determines it
        answer:
          choiceId: a
        explanation: |
          The sides $9$ and $9$ make it isosceles. Since $14^2=196>9^2+9^2=162$, the triangle is obtuse.
      - id: classify-sides-angles-step-4
        title: |
          Choose the final conclusion
        instruction: |
          Use the key result to answer the original question clearly.
        type: multipleChoice
        prompt: |
          Which conclusion follows?
        choices:
          - id: a
            text: |
              The triangle is isosceles and obtuse.
          - id: b
            text: |
              The result cannot be determined.
          - id: c
            text: |
              A different theorem is required after solving.
          - id: d
            text: |
              The diagram contradicts the computation.
        answer:
          choiceId: a
        explanation: |
          The sides $9$ and $9$ make it isosceles. Since $14^2=196>9^2+9^2=162$, the triangle is obtuse.
      - id: classify-sides-angles-step-5
        title: |
          Explain the complete path
        instruction: |
          Finish by explaining the reasoning in your own words. This is the step that turns a calculation into reusable geometry knowledge.
        type: freeResponse
        prompt: |
          Write a short final explanation of the solution.
        answer:
          expected: |
            The sides $9$ and $9$ make it isosceles. Since $14^2=196>9^2+9^2=162$, the triangle is obtuse.
          gradingMode: selfCheck
          keyPoints:
            - |
              Name the exact theorem or formula.
            - |
              Show how the givens satisfy that method.
            - |
              State the final result with units or classification where appropriate.
        explanation: |
          The sides $9$ and $9$ make it isosceles. Since $14^2=196>9^2+9^2=162$, the triangle is obtuse.
          
          Related topic: Triangle Basics.
  - id: coordinate-equilateral
    title: |
      Coordinate Triangle Classification
    problem: |
      ![Coordinate Triangle Classification diagram](/assessments/geometry/triangles/geometry-triangles-basics-worked-example-2-coordinate-equilateral.svg)
      
      Points $A(0,0)$, $B(6,0)$, and $C(3,3\sqrt3)$ form a triangle. Classify the triangle by side length.
    steps:
      - id: coordinate-equilateral-step-1
        title: |
          Identify the governing idea
        instruction: |
          Start by deciding which theorem, formula, or geometric structure controls the problem.
        type: multipleChoice
        prompt: |
          Which idea should drive the solution?
        choices:
          - id: a
            text: |
              Distance formula for coordinate geometry
          - id: b
            text: |
              Pythagorean theorem
          - id: c
            text: |
              Triangle inequality only
          - id: d
            text: |
              A visual estimate without proof
        answer:
          choiceId: a
