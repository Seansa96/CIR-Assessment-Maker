schemaVersion: 1
id: phys-fric-force-id-drill
title: Friction - Force Identification Drill
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
  - physics-friction
navigation:
  learningGoal: recall
  activityType: formalTest
  tags:
    - force-identification
    - friction
modeDefault: recall
randomizeQuestions: true
attemptQuestionCount: 15
questions:
  - id: fric-id-q01
    title: Identify the force
    type: multipleChoice
    prompt: |
      What specific force prevents a heavy box from sliding down a ramp when it is placed there at rest?
    choices:
      - id: a
        text: Kinetic friction
      - id: b
        text: Static friction
      - id: c
        text: Normal force
      - id: d
        text: Tension
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Static friction acts to prevent motion between two surfaces in contact that are not slipping relative to each other.

  - id: fric-id-q02
    title: Source of Normal Force
    type: multipleChoice
    prompt: |
      In the context of friction ($f = \mu N$), what physical interaction generates the normal force $N$ between a block and a table?
    choices:
      - id: a
        text: The gravitational attraction between the block and the Earth.
      - id: b
        text: The electromagnetic repulsion between the electron clouds of the block's bottom surface and the table's top surface.
      - id: c
        text: The air pressure pushing down on the block.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Normal forces are fundamentally electromagnetic. The electron clouds of the two surfaces repel each other strongly when pushed together, preventing the objects from passing through each other.

  - id: fric-id-q03
    title: Coefficient meaning
    type: multipleChoice
    prompt: |
      What does the coefficient of kinetic friction ($\mu_k$) represent?
    choices:
      - id: a
        text: The amount of force in Newtons required to keep an object moving.
      - id: b
        text: A dimensionless ratio of the kinetic friction force to the normal force between two surfaces.
      - id: c
        text: The angle at which an object will start to slide.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** $\mu_k = f_k / N$. It is a property of the two interacting surfaces, expressing how much friction you get per unit of normal force. It has no units.

  - id: fric-id-q04
    title: Rolling Friction
    type: multipleChoice
    prompt: |
      When a car tire rolls on dry pavement without skidding, what type of friction acts between the bottom of the tire and the road to propel the car forward?
    choices:
      - id: a
        text: Kinetic friction
      - id: b
        text: Static friction
      - id: c
        text: No friction is needed to move forward.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Because the contact patch of the rolling tire is momentarily at rest relative to the road, it is *static* friction that pushes the car forward (the engine forces the tire to try to spin backwards against the road, and static friction opposes this).

  - id: fric-id-q05
    title: Identify the normal force components
    type: multipleChoice
    prompt: |
      A block of mass $m$ is pushed against a vertical wall with a horizontal force $F$. What is the normal force $N$ equal to in this situation?
    choices:
      - id: a
        text: $mg$
      - id: b
        text: $F$
      - id: c
        text: $F - mg$
      - id: d
        text: $F + mg$
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** The wall is vertical, so the normal force is horizontal (perpendicular to the wall). It perfectly balances the horizontal push $F$. Gravity is vertical and has no effect on the normal force here.

  - id: fric-id-q06
    title: Kinetic Friction Direction
    type: multipleChoice
    prompt: |
      A puck slides perfectly North across a sheet of ice. In what direction does the kinetic friction force on the puck point?
    choices:
      - id: a
        text: North
      - id: b
        text: South
      - id: c
        text: Down
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Kinetic friction always opposes the direction of slipping. If slipping North, friction points South.

  - id: fric-id-q07
    title: Static Friction Direction (Car accelerating)
    type: multipleChoice
    prompt: |
      A rear-wheel drive car accelerates forward on a flat road. In what direction does the static friction force act on the REAR tires?
    choices:
      - id: a
        text: Forward
      - id: b
        text: Backward
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The rear wheels are powered and try to spin, pushing the ground backwards. By Newton's Third Law, the ground pushes the tires (and the car) FORWARD. This is static friction.

  - id: fric-id-q08
    title: Static Friction Direction (Car braking)
    type: multipleChoice
    prompt: |
      A car is moving forward but hitting the brakes to slow down (without skidding). In what direction does the static friction force act on the tires?
    choices:
      - id: a
        text: Forward
      - id: b
        text: Backward
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** When braking, the tires resist rotating forward, effectively pushing forward on the ground. The ground pushes backward on the tires via static friction, slowing the car.

  - id: fric-id-q09
    title: Independence of Surface Area
    type: multipleChoice
    prompt: |
      According to the standard Coulomb model of dry friction, what happens to the force of kinetic friction if you flip a rectangular block from its widest side to its narrowest side (keeping normal force the same)?
    choices:
      - id: a
        text: Friction increases because the pressure is higher.
      - id: b
        text: Friction decreases because the contact area is smaller.
      - id: c
        text: Friction stays the same.
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** The formula $f_k = \mu_k N$ does not include area. The standard model states friction is independent of apparent contact area.

  - id: fric-id-q10
    title: Maximum Static Friction Limit
    type: multipleChoice
    prompt: |
      You push a heavy fridge with $100\text{ N}$ of force, but it doesn't move. The maximum possible static friction is calculated to be $300\text{ N}$. What is the actual static friction force acting right now?
    choices:
      - id: a
        text: $300\text{ N}$
      - id: b
        text: $100\text{ N}$
      - id: c
        text: $200\text{ N}$
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** Static friction is a "smart" force; it matches the applied force exactly up to its maximum limit. If it were $300\text{ N}$, the fridge would accelerate backward into you! It is exactly $100\text{ N}$.

  - id: fric-id-q11
    title: Identify Internal vs External Friction
    type: multipleChoice
    prompt: |
      Two blocks, A and B, are stacked on a table. Block B is pulled to the right. Consider the system of (Block A + Block B) together. Which friction force is considered an INTERNAL force to this system?
    choices:
      - id: a
        text: The friction between Block B and the table.
      - id: b
        text: The friction between Block A and Block B.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** An internal force acts between two parts of the defined system. Since both A and B are in the system, the friction between them is an internal force.

  - id: fric-id-q12
    title: Air Resistance
    type: multipleChoice
    prompt: |
      Air resistance (drag) is often compared to friction. Unlike dry kinetic friction, air resistance heavily depends on which variable?
    choices:
      - id: a
        text: Mass
      - id: b
        text: Normal force
      - id: c
        text: Velocity
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** Fluid drag depends strongly on the velocity of the object (often $v$ or $v^2$), whereas standard dry kinetic friction is treated as velocity-independent.

  - id: fric-id-q13
    title: Normal Force on Incline
    type: multipleChoice
    prompt: |
      On an inclined plane of angle $\theta$, what trigonometric function is used to calculate the normal force from gravity ($mg$)?
    choices:
      - id: a
        text: $\sin\theta$
      - id: b
        text: $\cos\theta$
      - id: c
        text: $\tan\theta$
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** The component of gravity perpendicular to the surface is $mg\cos\theta$, so $N = mg\cos\theta$ (assuming no other vertical forces relative to the ramp).

  - id: fric-id-q14
    title: Force causing a turn
    type: multipleChoice
    prompt: |
      A car drives in a circle at a constant speed on a flat parking lot. What force points towards the center of the circle to cause this centripetal acceleration?
    choices:
      - id: a
        text: Normal force
      - id: b
        text: Kinetic friction
      - id: c
        text: Static friction
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** The tires are not slipping sideways. The turning of the wheels creates a static friction force directed laterally inwards towards the center of the turn.

  - id: fric-id-q15
    title: Friction and Heat
    type: multipleChoice
    prompt: |
      When a block slides across a table and stops due to kinetic friction, what happens to its initial kinetic energy?
    choices:
      - id: a
        text: It is destroyed.
      - id: b
        text: It is converted primarily into potential energy.
      - id: c
        text: It is dissipated primarily as thermal energy (heat) in the block and the table.
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** Kinetic friction is a non-conservative force that does negative work, converting macroscopic kinetic energy into random microscopic kinetic energy (thermal energy/heat).
