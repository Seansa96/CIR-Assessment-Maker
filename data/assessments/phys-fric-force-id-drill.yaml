schemaVersion: 1
id: phys-fric-force-id-drill
title: Friction - Force Identification
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
- physics-friction
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - translation-only
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
- id: fric-frame-dir-1
  type: multipleChoice
  prompt: '[Force Identification] A car accelerates forward. What force is pushing
    the car forward?'
  choices:
  - id: a
    text: Static friction from the road pushing forward on the tires.
  - id: b
    text: The engine pushing the car.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The tires attempt to slide backwards relative
    to the road. Static friction opposes this by pushing the tires FORWARD.'
- id: fric-frame-stack-1
  type: multipleChoice
  prompt: '[Force Identification] Block A sits on Block B. You pull Block B to the
    right, and Block A moves with it without slipping. What force accelerates Block
    A?'
  choices:
  - id: a
    text: Static friction from Block B pointing to the right.
  - id: b
    text: Static friction from Block B pointing to the left.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** A tends to stay at rest (relative to the ground).
    Relative to B, A tends to slide left. Friction opposes this relative slipping
    by pushing A to the right.'
