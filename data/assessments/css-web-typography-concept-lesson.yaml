schemaVersion: 1
id: css-web-typography-concept-lesson
title: Modern Web Typography
assessmentType: conceptLesson
categoryId: css
subcategoryIds:
  - css-typography
modeDefault: study
sections:
  - id: relative-units
    title: Relative vs Absolute Sizing
    content: |
      While sizing fonts in `px` (pixels) is intuitive, it ignores a user's browser preferences. If a visually impaired user increases their default browser font size, `px` values override it, breaking accessibility.
      
      **Best Practice**: Use `rem` for font sizing. 
      `1rem` equals the root font size (default 16px). `1.5rem` = 24px. If a user changes their base font to 20px, your `1.5rem` gracefully scales to 30px!
  - id: line-height
    title: Line Height and Readability
    content: |
      Text without breathing room is difficult to read.
      
      **Best Practice**: Use a unitless `line-height` for body text, typically between `1.4` and `1.6`. A unitless value scales relative to the current font size dynamically.
  - id: custom-fonts
    title: Web Fonts (Google Fonts)
    content: |
      You are not limited to the fonts installed on a user's machine (Arial, Times New Roman).
      You can link external fonts using `<link>` tags in HTML or `@import` in CSS.
      
      Always provide a "fallback" font stack in case the external font fails to load:
      `font-family: 'Inter', Helvetica, Arial, sans-serif;`
lesson:
  introduction: Web Typography Basics
  sections:
    - id: sec-q1
      title: Check Your Understanding
      content: Review relative units.
      check:
        id: check-q1
        type: multipleChoice
        prompt: "Why is `rem` preferred over `em` for setting global font sizes?"
        choices:
          - id: a
            text: `rem` calculates size based on the root element, preventing the compounding math issues that happen when nesting `em` units.
          - id: b
            text: `rem` is faster for the browser to render.
          - id: c
            text: `rem` is automatically converted to pixels by older browsers.
        answer:
          choiceId: a
        explanation: |
          `em` is relative to its parent. If you have a list inside a list inside a list, and each sets `font-size: 1.2em`, the text will exponentially grow! `rem` avoids this by always looking at the root `<html>` size.
