items:
  - id: drill-inorder-trace
    prompt: |
      Consider a Binary Tree with a root node `B`. 
      `B` has a left child `A` and a right child `C`.
      None of the children have any children of their own.
      
      What is the output sequence of an **in-order** traversal (Left, Node, Right) of this tree?
    answer: "A, B, C"
  
  - id: drill-preorder-trace
    prompt: |
      Consider the same Binary Tree (Root `B`, left child `A`, right child `C`).
      
      What is the output sequence of a **pre-order** traversal (Node, Left, Right)?
    answer: "B, A, C"
