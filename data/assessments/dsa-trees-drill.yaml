items:
- id: drill-inorder-trace
  prompt: "Consider a Binary Tree with a root node `B`. \n`B` has a left child `A` and a right child `C`.\n\
    None of the children have any children of their own.\n\nWhat is the output sequence of an **in-order**\
    \ traversal (Left, Node, Right) of this tree?\n"
  answer: { expected: 'A, B, C' }
- id: drill-preorder-trace
  prompt: 'Consider the same Binary Tree (Root `B`, left child `A`, right child `C`).


    What is the output sequence of a **pre-order** traversal (Node, Left, Right)?

    '
  answer: { expected: 'B, A, C' }


