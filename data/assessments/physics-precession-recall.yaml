glossary:
  introduction: Review the essential terms below. Once you understand them, test your
    knowledge using the recall drills.
  sections:
  - id: sec-physics-precession-recall
    title: Core Terminology
    entries:
    - id: entry-precession
      term: Precession
      definition: The gradual change or "wobble" in the orientation of the rotational
        axis of a spinning body, caused by an external torque.
      drills:
      - id: drill-precession-1
        prompt: The gradual rotation of a spinning object's axis due to an applied
          torque is called ________.
        type: typed
        answer:
          expected: precession
    - id: entry-precession-rate
      term: Precession Angular Velocity ($\Omega$)
      definition: The angular velocity at which the rotational axis sweeps out a cone.
        For a gyroscope, $\Omega = \frac{mgr}{I\omega}$.
      drills:
      - id: drill-precession-rate
        prompt: The precession angular velocity of a gyroscope is inversely proportional
          to its spin angular ________.
        type: typed
        answer:
          expected: velocity
