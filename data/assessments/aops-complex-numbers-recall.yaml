schemaVersion: 1
id: aops-complex-numbers-recall
title: Complex Numbers Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-complex-numbers
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - art-of-problem-solving
  - aops-complex-numbers
  - complex-vocabulary
skills:
- Recall standard form, power-cycle, conjugate, and modulus facts
- Recognize componentwise equality and division checks
items:
- id: imaginary-unit-definition
  type: typed
  prompt: Complete the defining equation $i^2=$ ____.
  answer:
    expected: '-1'
    aliases: [negative one]
  explanation: This definition extends the real number system.
  tags: [imaginary-unit]
- id: standard-form-recall
  type: typed
  prompt: State the standard algebraic form of a complex number.
  answer:
    expected: a+bi
    aliases: ['$a+bi$']
  explanation: Both coefficients are real.
  tags: [standard-form]
- id: complex-zero-recall
  type: flashcard
  prompt: When does $a+bi$ equal zero?
  answer:
    expected: Exactly when a=0 and b=0.
  explanation: Complex equality is componentwise.
  tags: [complex-equality]
- id: imaginary-part-recall
  type: typed
  prompt: What is the imaginary part of $7-4i$?
  answer:
    expected: '-4'
    aliases: [negative four]
  explanation: The imaginary part is the real coefficient of $i$.
  tags: [imaginary-part]
- id: power-cycle-recall
  type: flashcard
  prompt: List $i^0,i^1,i^2,i^3$ in order.
  answer:
    expected: 1, i, -1, -i
  explanation: The sequence repeats every four powers.
  tags: [powers-of-i]
- id: conjugate-recall
  type: typed
  prompt: Give the conjugate of $a+bi$.
  answer:
    expected: a-bi
    aliases: ['$a-bi$']
  explanation: Reverse only the imaginary sign.
  tags: [conjugate]
- id: conjugate-product-recall
  type: typed
  prompt: Complete $(a+bi)(a-bi)=$ ____.
  answer:
    expected: a^2+b^2
    aliases: ['$a^2+b^2$']
  explanation: Cross terms cancel and $i^2=-1$.
  tags: [conjugate]
- id: modulus-recall
  type: typed
  prompt: State $|a+bi|$.
  answer:
    expected: sqrt(a^2+b^2)
    aliases: ['$\sqrt{a^2+b^2}$']
  explanation: Modulus is distance in the complex plane.
  tags: [modulus]
- id: division-method-recall
  type: flashcard
  prompt: What should multiply the numerator and denominator when dividing by $c+di$?
  answer:
    expected: The conjugate c-di divided by itself.
  explanation: This makes the denominator $c^2+d^2$ real.
  tags: [complex-division]
- id: quotient-verification-recall
  type: flashcard
  prompt: How can a proposed quotient $q=w/v$ be verified?
  answer:
    expected: Multiply q by v and check that the result equals w.
  explanation: Multiplication reverses division.
  tags: [verification]
- id: square-root-pair-recall
  type: flashcard
  prompt: If nonzero $z$ satisfies $z^2=w$, what other number has square $w$?
  answer:
    expected: '-z'
    aliases: [the opposite of z, negative z]
  explanation: $(-z)^2=z^2$.
  tags: [complex-square-root]
- id: component-system-recall
  type: flashcard
  prompt: What equations follow from $(a+bi)^2=u+vi$?
  answer:
    expected: a^2-b^2=u and 2ab=v.
  explanation: Expand the square and compare real and imaginary components.
  tags: [complex-equations]
