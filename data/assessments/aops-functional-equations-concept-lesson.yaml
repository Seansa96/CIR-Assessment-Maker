lesson:
  introduction: Learn to solve Functional Equations problems by recognizing special inputs, injectivity, and functional structure and justifying each theorem or transformation.
  sections:
  - id: aops-functional-equations-motivation
    title: What the topic helps you notice
    required: true
    content: Functional Equations is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are special inputs, injectivity, and functional structure.
    check:
      id: aops-functional-equations-motivation-check
      type: multipleChoice
      prompt: In Functional Equations, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-functional-equations-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-functional-equations-definitions-check
      type: multipleChoice
      prompt: In Functional Equations, what should be checked before applying a method?
