questions:
- id: hard-q001
  type: numericResponse
  prompt: A point on the edge of a wheel of radius $R = 0.3\text{ m}$ has an angular
    velocity of $\omega = 4.0\text{ rad/s}$. What is its tangential velocity?
  answer:
    value: 1.2000000000000002
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $v = R\omega = 0.3(4.0) = 1.2000000000000002$ m/s.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
