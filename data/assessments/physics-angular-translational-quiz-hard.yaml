questions:
- id: q1
  type: numericResponse
  prompt: A disk of radius $0.2 \text{ m}$ starts from rest and accelerates at $3.0
    \text{ rad/s}^2$. What is the magnitude of the total linear acceleration of a
    point on the rim at $t = 2.0 \text{ s}$?
  answer:
    value: 7.22
    tolerance: 0.1
  explanation: $\omega(2) = 6 \text{ rad/s}$. $a_t = r\alpha = 0.6 \text{ m/s}^2$.
    $a_r = r\omega^2 = 0.2(36) = 7.2 \text{ m/s}^2$. $a = \sqrt{0.6^2 + 7.2^2} \approx
    7.22 \text{ m/s}^2$.
