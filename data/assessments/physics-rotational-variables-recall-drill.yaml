items:
  - { id: rvrd1, type: cloze, prompt: 'Angular velocity is $\omega=d____/dt$.', answer: { expected: theta, expectedLatex: '\theta', aliases: ['angular position'], media: [] }, explanation: 'Solution: Insert $\theta$.\n\nWhy it works: Angular velocity is the time derivative of angular position.', tags: [definition] }
  - { id: rvrd2, type: typed, prompt: 'What is the SI unit of angular velocity?', answer: { expected: 'rad/s', expectedLatex: '\mathrm{rad/s}', aliases: ['radians per second'], media: [] }, explanation: 'Solution: It is rad/s.\n\nWhy it works: Angular position changes in radians per second.', tags: [units] }
  - { id: rvrd3, type: cloze, prompt: 'One complete revolution equals ____ radians.', answer: { expected: '2pi', expectedLatex: '2\pi', aliases: ['2 pi'], media: [] }, explanation: 'Solution: Insert $2\pi$.\n\nWhy it works: A full circle subtends $2\pi$ radians.', tags: [units] }
  - { id: rvrd4, type: typed, prompt: 'Which rule gives the direction of an angular-velocity vector?', answer: { expected: 'right hand rule', expectedLatex: '', aliases: ['right-hand rule'], media: [] }, explanation: 'Solution: It is the right-hand rule.\n\nWhy it works: Thumb direction gives the rotation axis.', tags: [vectors] }
  - { id: rvrd5, type: cloze, prompt: 'Tangential speed is $v=r____$.', answer: { expected: omega, expectedLatex: '\omega', aliases: ['angular velocity'], media: [] }, explanation: 'Solution: Insert $\omega$.\n\nWhy it works: $v=r\omega$ links rotation to rim speed.', tags: [linear-link] }
  - { id: rvrd6, type: typed, prompt: 'What is angular acceleration the time derivative of?', answer: { expected: 'angular velocity', expectedLatex: '\omega', aliases: [omega], media: [] }, explanation: 'Solution: It is angular velocity.\n\nWhy it works: $\alpha=d\omega/dt$.', tags: [definition] }
