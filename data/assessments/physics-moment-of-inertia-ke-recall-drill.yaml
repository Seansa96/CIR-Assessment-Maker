items:
  - { id: ikr1, type: cloze, prompt: 'Rotational kinetic energy is $K=\tfrac12 I____^2$.', answer: { expected: omega, expectedLatex: '\omega', aliases: ['angular velocity'], media: [] }, explanation: 'Solution: Insert $\omega$.\n\nWhy it works: Rotational energy depends on angular-speed squared.', tags: [energy] }
  - { id: ikr2, type: typed, prompt: 'What are the SI units of moment of inertia?', answer: { expected: 'kilogram meter squared', expectedLatex: '\mathrm{kg\,m^2}', aliases: ['kg m2'], media: [] }, explanation: 'Solution: They are kg m$^2$.\n\nWhy it works: $I=\sum mr^2$.', tags: [units] }
  - { id: ikr3, type: cloze, prompt: 'A hoop about its center has $I=____R^2$.', answer: { expected: M, expectedLatex: 'M', aliases: [mass], media: [] }, explanation: 'Solution: Insert $M$.\n\nWhy it works: A hoop''s mass lies at radius $R$.', tags: [shapes] }
  - { id: ikr4, type: typed, prompt: 'What quantity is the rotational analogue of mass?', answer: { expected: 'moment of inertia', expectedLatex: 'I', aliases: [inertia], media: [] }, explanation: 'Solution: It is moment of inertia.\n\nWhy it works: It resists angular acceleration.', tags: [analogy] }
  - { id: ikr5, type: cloze, prompt: 'Mass farther from the axis gives ____ moment of inertia.', answer: { expected: larger, expectedLatex: '', aliases: [greater], media: [] }, explanation: 'Solution: Insert larger.\n\nWhy it works: Contributions scale with radius squared.', tags: [distribution] }
  - { id: ikr6, type: typed, prompt: 'What two kinetic-energy terms occur in rolling?', answer: { expected: 'translational and rotational', expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: They are translational and rotational.\n\nWhy it works: The object moves and spins.', tags: [rolling] }
