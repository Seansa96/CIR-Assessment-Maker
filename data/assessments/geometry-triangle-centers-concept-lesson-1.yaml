lesson:
  introduction: |-
    Unlike a circle, which only has one center, a triangle has many different "centers" depending on what geometric properties you are looking at. In this lesson, we will explore the Circumcenter and the Incenter.
  sections:
  - id: sec-circumcenter
    title: The Circumcenter
    required: true
    content: |-
      The **Circumcenter** is the point where the three **perpendicular bisectors** of the sides of a triangle intersect.
      
      A perpendicular bisector is a line that cuts a side exactly in half at a $90^\circ$ angle. 
      
      The circumcenter has a very special property: it is **equidistant from all three vertices** of the triangle. Because of this, it is the center of the **circumscribed circle** (the circle that passes perfectly through all three corners of the triangle).
      
      Depending on the triangle, the circumcenter can be inside (acute), on the hypotenuse (right), or outside (obtuse) the triangle!

  - id: sec-incenter
    title: The Incenter
    required: true
    content: |-
      The **Incenter** is the point where the three **angle bisectors** of the triangle intersect.
      
      An angle bisector is a line that cuts an angle exactly in half.
      
      The incenter has its own special property: it is **equidistant from all three sides** of the triangle. This makes it the center of the **inscribed circle** (the largest circle that fits completely inside the triangle, perfectly touching all three sides).
      
      Unlike the circumcenter, the incenter is *always* inside the triangle, regardless of the triangle's shape.

questions:
- id: q-geom-cent-1
  title: Concept Check - The Circumcenter
  prompt: |-
    Which set of lines intersect to form the circumcenter of a triangle?
  type: multipleChoice
  choices:
  - id: c1
    text: Angle bisectors
  - id: c2
    text: Medians
  - id: c3
    text: Altitudes
  - id: c4
    text: Perpendicular bisectors
  answer:
    choiceId: c4
  explanation: |-
    The circumcenter is formed by the intersection of the **perpendicular bisectors** of the sides.
  skills:
  - geometry-triangle-centers

- id: q-geom-cent-2
  title: Concept Check - Equidistant Properties
  prompt: |-
    Which center is equidistant from all three **sides** of the triangle?
  type: multipleChoice
  choices:
  - id: c1
    text: Circumcenter
  - id: c2
    text: Incenter
  answer:
    choiceId: c2
  explanation: |-
    The **incenter** is equidistant from the sides, which is why it can be used to draw the inscribed circle. The circumcenter is equidistant from the *vertices*.
  skills:
  - geometry-triangle-centers
