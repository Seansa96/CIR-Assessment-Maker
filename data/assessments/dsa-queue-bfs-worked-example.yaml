schemaVersion: 1
id: dsa-queue-bfs-worked-example
title: Queue Breadth-First Search Worked Example
assessmentType: workedExample
categoryId: dsa
subcategoryId: dsa-complexity
subcategoryIds:
  - dsa-stacks-queues
