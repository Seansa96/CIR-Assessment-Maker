glossary:
  introduction: Energy relationships for an ideal mass-spring oscillator.
  sections:
  - id: shm-energy-terms
    title: Core terms
    entries:
    - {id: total-energy, term: total mechanical energy, definition: 'The constant sum $E=K+U=\frac12kA^2$ for ideal SHM.', drills: [{id: total-energy-drill, type: typed, prompt: 'What is the total energy of an ideal spring oscillator at amplitude A?', answer: {expected: 'one-half k A squared'}}]}
    - {id: elastic-pe, term: elastic potential energy, definition: 'Spring energy $U=\frac12kx^2$.', drills: [{id: elastic-pe-drill, type: cloze, prompt: 'Spring potential energy is $U={{\frac12kx^2}}$.', answer: {expected: '\frac12kx^2'}}]}
    - {id: kinetic-energy, term: kinetic energy, definition: 'Motion energy $K=\frac12mv^2$.', drills: [{id: kinetic-energy-drill, type: typed, prompt: 'Where is kinetic energy maximum in SHM?', answer: {expected: equilibrium}}]}
    - {id: turning-point, term: turning point, definition: 'A maximum-displacement location where velocity and kinetic energy are zero.', drills: [{id: turning-point-drill, type: cloze, prompt: 'At a {{turning point}}, velocity is zero.', answer: {expected: turning point}}]}
