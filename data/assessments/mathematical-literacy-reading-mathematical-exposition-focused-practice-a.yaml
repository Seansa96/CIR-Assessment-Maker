questions:
- id: q001
  type: multipleChoice
  prompt: Which annotation correctly reads 'If a number is divisible by 4, then it is even'?
  choices:
  - id: a
    text: The hypothesis is divisibility by 4; the conclusion is evenness.
  - id: b
    text: The hypothesis is evenness; the conclusion is divisibility by 4.
    issueSignals:
    - id: reversed-implication
  - id: c
    text: Both directions are automatically proved.
    issueSignals:
    - id: reversed-implication
  - id: d
    text: The statement is a definition.
    issueSignals:
    - id: reversed-implication
  answer:
    choiceId: a
  issueSignals:
  - id: reversed-implication
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: 'Solution: The hypothesis is divisibility by 4; the conclusion is evenness.

    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.

    Why the other choices fail: Each distractor changes the claim''s role, scope, or evidentiary standard.'
- id: q002
  type: multipleChoice
  prompt: Which sentence is the correct negation of 'Every member of a set S has property P'?
  choices:
  - id: a
    text: At least one member of S does not have property P.
  - id: b
    text: Every member of S lacks property P.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: At least one member of S has property P.
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: The set S is empty.
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: 'Solution: At least one member of S does not have property P.

    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.

    Why the other choices fail: Each distractor changes the claim''s role, scope, or evidentiary standard.'
- id: q003
  type: multipleChoice
  prompt: A text gives one value that satisfies a definition. What has it established?
  choices:
  - id: a
    text: An example, not a proof that every value satisfies the claim.
  - id: b
    text: A proof of every related theorem.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: A counterexample to the definition.
    issueSignals:
    - id: example-as-proof
  - id: d
    text: A converse implication.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: 'Solution: An example, not a proof that every value satisfies the claim.

    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.

    Why the other choices fail: Each distractor changes the claim''s role, scope, or evidentiary standard.'
- id: q004
  type: multipleChoice
  prompt: A proof says 'therefore' after introducing a new claim with no cited reason. What should a careful reader
    do?
  choices:
  - id: a
    text: Ask which definition, hypothesis, or earlier result licenses the step.
  - id: b
    text: Accept it because mathematical prose is concise.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: Treat the new claim as a definition.
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: Reverse the preceding implication.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: 'Solution: Ask which definition, hypothesis, or earlier result licenses the step.

    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.

    Why the other choices fail: Each distractor changes the claim''s role, scope, or evidentiary standard.'
- id: q005
  type: multipleChoice
  prompt: In a definition-theorem-proof passage, what is the primary role of the definition?
  choices:
  - id: a
    text: It fixes the exact meaning of a term used in the later statement and proof.
  - id: b
    text: It establishes the theorem without argument.
    issueSignals:
    - id: definition-proof-confusion
  - id: c
    text: It is the final conclusion of the proof.
    issueSignals:
    - id: role-order-confusion
  - id: d
    text: It replaces every hypothesis.
    issueSignals:
    - id: hypothesis-erasure
  answer:
    choiceId: a
  difficultyDimensions:
  - conventionRecognition
  - argumentMapping
  difficultyEvidence: Distinguishes the meaning-setting role of a definition from proof and theorem roles.
  explanation: 'Solution: It fixes the exact meaning of a term used in the later statement and proof.

    Why it works: Definitions establish vocabulary; they do not by themselves demonstrate a claim.

    Why the other choices fail: B mistakes meaning for evidence, C misorders the passage, and D discards conditions.'
- id: q006
  type: multipleChoice
  prompt: Why does the source-style proof establish inequalities before invoking the squeeze theorem?
  choices:
  - id: a
    text: The inequalities are the conditions that make the theorem applicable.
  - id: b
    text: Naming the theorem makes bounds unnecessary.
    issueSignals:
    - id: citation-without-conditions
  - id: c
    text: An auxiliary quantity proves any result automatically.
    issueSignals:
    - id: auxiliary-object-overreach
  - id: d
    text: Inequalities are definitions rather than evidence.
    issueSignals:
    - id: inequality-role-confusion
  answer:
    choiceId: a
  difficultyDimensions:
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Links displayed bounds to the cited theorem's use.
  explanation: 'Solution: The inequalities are the conditions that make the theorem applicable.

    Why it works: The theorem''s conclusion depends on the bounding relationship already established.

    Why the other choices fail: B skips conditions, C gives a name magical force, and D misclassifies evidence.'
- id: q007
  type: multipleChoice
  prompt: Which sentence belongs immediately after a proof has verified every condition of a cited theorem?
  choices:
  - id: a
    text: By that theorem
    the stated conclusion follows.: null
  - id: b
    text: Therefore the conditions were never needed.
    issueSignals:
    - id: condition-dismissal
  - id: c
    text: Define the conclusion again.
    issueSignals:
    - id: definition-as-conclusion
  - id: d
    text: Start an unrelated example.
    issueSignals:
    - id: relevance-break
  answer:
    choiceId: a
  difficultyDimensions:
  - sequencing
  - argumentMapping
  difficultyEvidence: Identifies the warranted transition from verified conditions to a theorem conclusion.
  explanation: 'Solution: By that theorem, the stated conclusion follows.

    Why it works: It explicitly connects established hypotheses to the cited result.

    Why the other choices fail: B rejects the warrant, C repeats terminology, and D breaks the proof chain.'
- id: q008
  type: multipleChoice
  prompt: A paragraph introduces an auxiliary quantity before bounding it. What should a reader expect that quantity
    to do?
  choices:
  - id: a
    text: Help express the relationships needed for a later justified inference.
  - id: b
    text: Change the theorem into a definition.
    issueSignals:
    - id: theorem-definition-confusion
  - id: c
    text: Eliminate the need to check the bounds.
    issueSignals:
    - id: missing-condition-check
  - id: d
    text: Serve only as decorative notation.
    issueSignals:
    - id: notation-dismissal
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - relevanceFiltering
  difficultyEvidence: Interprets an auxiliary construction by its later role in the proof chain.
  explanation: 'Solution: Help express the relationships needed for a later justified inference.

    Why it works: Auxiliary objects make a necessary relation available for proof.

    Why the other choices fail: B and C alter logical roles; D ignores its demonstrated use.'
- id: q009
  type: multipleChoice
  prompt: Which order best represents the exposition displayed in the approved passage?
  choices:
  - id: a
    text: Define terms; state a claim; justify steps; mark the conclusion.
  - id: b
    text: Mark a conclusion; invent terms; look for a claim.
    issueSignals:
    - id: reverse-exposition-order
  - id: c
    text: State definitions repeatedly without proving anything.
    issueSignals:
    - id: definition-only-exposition
  - id: d
    text: Cite a theorem before identifying its needed conditions.
    issueSignals:
    - id: condition-after-citation
  answer:
    choiceId: a
  difficultyDimensions:
  - sequencing
  - conventionRecognition
  difficultyEvidence: Reconstructs definition-theorem-proof organization from the source passage.
  explanation: 'Solution: Define terms; state a claim; justify steps; mark the conclusion.

    Why it works: This preserves the semantic and logical dependencies of exposition.

    Why the other choices fail: Each alternative reverses or omits a required role.'
- id: q010
  type: multipleChoice
  prompt: What makes the final conclusion of a mathematical proof more than an unsupported assertion?
  choices:
  - id: a
    text: Earlier justified steps connect the stated hypotheses to that exact conclusion.
  - id: b
    text: It appears at the end of the paragraph.
    issueSignals:
    - id: position-as-proof
  - id: c
    text: It repeats a definition.
    issueSignals:
    - id: definition-as-evidence
  - id: d
    text: It uses more symbols than earlier lines.
    issueSignals:
    - id: symbol-counting-error
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - justificationEvaluation
  difficultyEvidence: Distinguishes a proof-supported conclusion from a merely positioned or formatted assertion.
  explanation: 'Solution: Earlier justified steps connect the stated hypotheses to that exact conclusion.

    Why it works: A conclusion is warranted by the chain leading to it, not by formatting.

    Why the other choices fail: Position, repetition, and notation density provide no logical warrant.'
