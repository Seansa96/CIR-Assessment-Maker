  - id: conversion
    title: Unit conversion factors
    required: true
    content: Multiply by a conversion factor equal to one so unwanted units cancel.
    media: []
    check:
      id: mu5
      type: multipleChoice
      prompt: Which factor converts centimeters to meters?
      choices:
      - id: a
        text: $1\text{ m}/100\text{ cm}$
        media: []
        issueSignals: []
      - id: b
        text: $100\text{ m}/1\text{ cm}$
        media: []
        issueSignals:
