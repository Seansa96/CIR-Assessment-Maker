        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Units check the physical type of each result.\n\nWhy it works: Dimensional consistency can expose an invalid operation or conversion.\n\nWhy the other choices fail: Units help diagnose errors but cannot guarantee every number is correct.'
