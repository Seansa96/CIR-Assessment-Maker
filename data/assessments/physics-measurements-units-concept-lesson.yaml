        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $3.0\text{ km}=3.0\times10^3\text{ m}=3000\text{ m}$.\n\nWhy it works: kilo denotes $10^3$.\n\nWhy the other choices fail: Choice b reverses the conversion direction.'
