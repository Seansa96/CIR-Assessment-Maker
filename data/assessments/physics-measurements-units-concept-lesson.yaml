  - id: significant
    title: Report sensible precision
    required: true
    content: Keep units throughout and round only at the end to precision supported by the measured inputs.
    media: []
    check:
      id: mu7
      type: multipleChoice
      prompt: Why should units remain in intermediate calculations?
      choices:
      - id: a
        text: They reveal whether the calculation has the intended physical type.
        media: []
        issueSignals: []
      - id: b
        text: They make all numerical errors impossible.
        media: []
        issueSignals:
        - id: units-overclaimed
          domains:
          - physics-1
