        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $\Delta x/\Delta t$ has dimensions $L/T$.\n\nWhy it works: Velocity is displacement per time.\n\nWhy the other choices fail: Multiplication gives $LT$, not velocity.'
