  - id: prefixes
    title: Metric prefixes
    required: true
    content: 'Prefixes encode powers of ten: kilo means $10^3$, centi $10^{-2}$, and milli $10^{-3}$.'
    media: []
    check:
      id: mu4
      type: multipleChoice
      prompt: How many meters are in 3.0 km?
      choices:
      - id: a
        text: $3000$ m
        media: []
        issueSignals: []
      - id: b
        text: $0.003$ m
        media: []
        issueSignals:
        - id: metric-prefix-direction-error
          domains:
          - physics-1
      answer:
        choiceId: a
