  - id: dimensions
    title: Dimensions test equations
    required: true
    content: Dimensions describe a quantity type, such as $[v]=LT^{-1}$, and must match on both sides of a physical equation.
    media: []
    check:
      id: mu6
      type: multipleChoice
      prompt: Which expression has dimensions of velocity?
      choices:
      - id: a
        text: $\Delta x/\Delta t$
        media: []
        issueSignals: []
      - id: b
        text: $\Delta x\Delta t$
        media: []
        issueSignals:
