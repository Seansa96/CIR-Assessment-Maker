lesson:
  introduction: Physics calculations are meaningful only when quantities, units, scale, and dimensional structure are kept visible from the givens through the conclusion.
  sections:
  - id: quantities
    title: Physical quantities
    required: true
    content: A physical quantity is reported as a number multiplied by a unit.
    media: []
    check:
      id: mu1
      type: multipleChoice
      prompt: Which is a physical quantity?
      choices:
      - id: a
        text: $3.0$ m
        media: []
        issueSignals: []
      - id: b
        text: $3.0$ only
        media: []
        issueSignals:
        - id: unit-omitted
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $3.0$ m is a physical quantity.\n\nWhy it works: It states a magnitude and a unit.\n\nWhy the other choices fail: A bare number does not identify what is measured.'
