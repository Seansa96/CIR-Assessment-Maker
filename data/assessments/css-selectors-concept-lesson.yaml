schemaVersion: 1
id: css-selectors-concept-lesson
title: CSS Selectors Basics
assessmentType: conceptLesson
categoryId: css
subcategoryIds:
- css-selectors-specificity
modeDefault: learn
lesson:
  introduction: Introduction to CSS Selectors Basics.
  sections:
  - id: sec1
    title: Basic Selectors
    content: CSS selectors are used to 'find' (or select) the HTML elements you want to style. The most common are type (tag), class (.), and ID (#) selectors.
    check:
      id: c1
      type: multipleChoice
      prompt: Which selector targets an element by its ID?
      choices:
      - id: a
        text: .header
      - id: b
        text: '#header'
      - id: c
        text: header
      answer:
        choiceId: b
