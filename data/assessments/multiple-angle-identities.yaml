schemaVersion: 1
id: multiple-angle-identities
title: Multiple Angle Identities
assessmentType: quiz
categoryId: trigonometry
subcategoryIds:
  - trig-double-half-angle
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "Which is the double-angle identity for sine?"
    choices:
      - id: a
        text: '\(\sin2x=2\sin x\cos x\)'
      - id: b
        text: '\(\sin2x=2\sin x\)'
      - id: c
        text: '\(\sin2x=\sin^2x+\cos^2x\)'
      - id: d
        text: '\(\sin2x=\cos^2x-\sin^2x\)'
    answer:
      choiceId: a
    explanation: |
      The sine double-angle identity comes from applying the sine addition formula to \(x+x\).

      Related topic: Sine Double-Angle Identity
  - id: q002
    type: multipleChoice
    prompt: "Which is a valid double-angle identity for cosine?"
    choices:
      - id: a
        text: '\(\cos2x=\cos^2x-\sin^2x\)'
      - id: b
        text: '\(\cos2x=2\cos x\)'
      - id: c
        text: '\(\cos2x=\sin x+\cos x\)'
      - id: d
        text: '\(\cos2x=2\sin x\cos x\)'
    answer:
      choiceId: a
    explanation: |
      Cosine has several equivalent double-angle forms; \(\cos^2x-\sin^2x\) is the base form.

      Related topic: Cosine Double-Angle Identity
  - id: q003
    type: multipleChoice
    prompt: 'Which is another valid form of \(\cos2x\)?'
    choices:
      - id: a
        text: '\(2\cos^2x-1\)'
      - id: b
        text: '\(2\sin^2x+1\)'
      - id: c
        text: '\(1+2\cos^2x\)'
      - id: d
        text: '\(2\sin x\cos x\)'
    answer:
      choiceId: a
    explanation: |
      Using \(\sin^2x=1-\cos^2x\) changes \(\cos^2x-\sin^2x\) into \(2\cos^2x-1\).

      Related topic: Alternate Cosine Double-Angle Forms
  - id: q004
    type: multipleChoice
    prompt: 'Which is another valid form of \(\cos2x\)?'
    choices:
      - id: a
        text: '\(1-2\sin^2x\)'
      - id: b
        text: '\(1+2\sin^2x\)'
      - id: c
        text: '\(2\sin^2x-1\)'
      - id: d
        text: '\(\sin^2x+\cos^2x\)'
    answer:
      choiceId: a
    explanation: |
      Replacing \(\cos^2x\) with \(1-\sin^2x\) gives \(1-2\sin^2x\).

      Related topic: Cosine Double-Angle Rewriting
  - id: q005
    type: multipleChoice
    prompt: "Which is the double-angle identity for tangent?"
    choices:
      - id: a
        text: '\(\tan2x=\frac{2\tan x}{1-\tan^2x}\)'
      - id: b
        text: '\(\tan2x=2\tan x\)'
      - id: c
        text: '\(\tan2x=\frac{1-\tan^2x}{2\tan x}\)'
      - id: d
        text: '\(\tan2x=\frac{\tan x}{1+\tan^2x}\)'
    answer:
      choiceId: a
    explanation: |
      Tangent double angle follows from the tangent addition formula with \(A=B=x\).

      Related topic: Tangent Double-Angle Identity
  - id: q006
    type: multipleChoice
    prompt: 'If \(\sin x=\frac{3}{5}\) and \(\cos x=\frac{4}{5}\), what is \(\sin2x\)?'
    choices:
      - id: a
        text: '\(\frac{24}{25}\)'
      - id: b
        text: '\(\frac{7}{10}\)'
      - id: c
        text: '\(\frac{12}{25}\)'
      - id: d
        text: '\(\frac{1}{25}\)'
    answer:
      choiceId: a
    explanation: |
      \(\sin2x=2\sin x\cos x=2(3/5)(4/5)=24/25\).

      Related topic: Evaluating Sine Double Angle
  - id: q007
    type: multipleChoice
    prompt: 'If \(\cos x=\frac{3}{5}\) and \(\sin x=\frac{4}{5}\), what is \(\cos2x\)?'
    choices:
      - id: a
        text: '\(-\frac{7}{25}\)'
      - id: b
        text: '\(\frac{7}{25}\)'
      - id: c
        text: '\(\frac{24}{25}\)'
      - id: d
        text: '\(1\)'
    answer:
      choiceId: a
    explanation: |
      \(\cos2x=\cos^2x-\sin^2x=9/25-16/25=-7/25\).

      Related topic: Evaluating Cosine Double Angle
  - id: q008
    type: multipleChoice
    prompt: 'Which identity rewrites \(\sin^2x\) using a double angle?'
    choices:
      - id: a
        text: '\(\sin^2x=\frac{1-\cos2x}{2}\)'
      - id: b
        text: '\(\sin^2x=\frac{1+\cos2x}{2}\)'
      - id: c
        text: '\(\sin^2x=1-\cos2x\)'
      - id: d
        text: '\(\sin^2x=2\sin x\cos x\)'
    answer:
      choiceId: a
    explanation: |
      This power-reduction identity comes from rearranging \(\cos2x=1-2\sin^2x\).

      Related topic: Power-Reduction Identities
  - id: q009
    type: multipleChoice
    prompt: 'Which identity rewrites \(\cos^2x\) using a double angle?'
    choices:
      - id: a
        text: '\(\cos^2x=\frac{1+\cos2x}{2}\)'
      - id: b
        text: '\(\cos^2x=\frac{1-\cos2x}{2}\)'
      - id: c
        text: '\(\cos^2x=1+\cos2x\)'
      - id: d
        text: '\(\cos^2x=2\sin x\cos x\)'
    answer:
      choiceId: a
    explanation: |
      Rearranging \(\cos2x=2\cos^2x-1\) gives \(\cos^2x=(1+\cos2x)/2\).

      Related topic: Power-Reduction for Cosine
  - id: q010
    type: multipleChoice
    prompt: 'Which is the half-angle identity for \(\sin(x/2)\)?'
    choices:
      - id: a
        text: '\(\sin\frac{x}{2}=\pm\sqrt{\frac{1-\cos x}{2}}\)'
      - id: b
        text: '\(\sin\frac{x}{2}=\pm\sqrt{\frac{1+\cos x}{2}}\)'
      - id: c
        text: '\(\sin\frac{x}{2}=2\sin x\cos x\)'
      - id: d
        text: '\(\sin\frac{x}{2}=1-\cos x\)'
    answer:
      choiceId: a
    explanation: |
      The sign depends on the quadrant of \(x/2\).

      Related topic: Sine Half-Angle Identity
  - id: q011
    type: multipleChoice
    prompt: 'Which is the half-angle identity for \(\cos(x/2)\)?'
    choices:
      - id: a
        text: '\(\cos\frac{x}{2}=\pm\sqrt{\frac{1+\cos x}{2}}\)'
      - id: b
        text: '\(\cos\frac{x}{2}=\pm\sqrt{\frac{1-\cos x}{2}}\)'
      - id: c
        text: '\(\cos\frac{x}{2}=2\cos^2x-1\)'
      - id: d
        text: '\(\cos\frac{x}{2}=1+\sin x\)'
    answer:
      choiceId: a
    explanation: |
      Cosine half-angle uses the \(1+\cos x\) expression under the radical.

      Related topic: Cosine Half-Angle Identity
  - id: q012
    type: multipleChoice
    prompt: 'Which identity is useful for rewriting \(\sin^2x\cos^2x\)?'
    choices:
      - id: a
        text: '\(\sin2x=2\sin x\cos x\)'
      - id: b
        text: '\(\cos2x=\sin x+\cos x\)'
      - id: c
        text: '\(\tan2x=2\tan x\)'
      - id: d
        text: '\(\sin(x/2)=2\sin x\)'
    answer:
      choiceId: a
    explanation: |
      Since \(\sin x\cos x=\frac12\sin2x\), products of sine and cosine can often be simplified.

      Related topic: Product Rewriting with Double Angles
  - id: q013
    type: multipleChoice
    prompt: 'Which identity gives \(\sin3x\)?'
    choices:
      - id: a
        text: '\(\sin3x=3\sin x-4\sin^3x\)'
      - id: b
        text: '\(\sin3x=3\sin x+4\sin^3x\)'
      - id: c
        text: '\(\sin3x=\sin x+\sin2x\)'
      - id: d
        text: '\(\sin3x=4\cos^3x-3\cos x\)'
    answer:
      choiceId: a
    explanation: |
      The triple-angle identity for sine is \(3\sin x-4\sin^3x\).

      Related topic: Sine Triple-Angle Identity
  - id: q014
    type: multipleChoice
    prompt: 'Which identity gives \(\cos3x\)?'
    choices:
      - id: a
        text: '\(\cos3x=4\cos^3x-3\cos x\)'
      - id: b
        text: '\(\cos3x=3\cos x-4\cos^3x\)'
      - id: c
        text: '\(\cos3x=\cos x+\cos2x\)'
      - id: d
        text: '\(\cos3x=3\sin x-4\sin^3x\)'
    answer:
      choiceId: a
    explanation: |
      The triple-angle identity for cosine is \(4\cos^3x-3\cos x\).

      Related topic: Cosine Triple-Angle Identity
  - id: q015
    type: multipleChoice
    prompt: "Why are multiple-angle identities useful?"
    choices:
      - id: a
        text: "They rewrite trig expressions with different angle sizes"
      - id: b
        text: "They only convert degrees to radians"
      - id: c
        text: "They remove all variables"
      - id: d
        text: "They apply only to right triangles"
    answer:
      choiceId: a
    explanation: |
      Multiple-angle identities help transform expressions like \(2x\), \(x/2\), or \(3x\) into forms involving simpler trig functions of \(x\).

      Related topic: Purpose of Multiple-Angle Identities
