lesson:
  introduction: Relate the kind of deformation to stress, strain, and the appropriate elastic modulus.
  sections:
    - { id: e1, title: Stress, content: 'Normal stress is force per cross-sectional area: $\sigma=F/A$.', check: { id: ec1, type: multipleChoice, prompt: 'The SI unit of stress is:', choices: [{ id: a, text: 'pascal' }, { id: b, text: 'joule' }], answer: { choiceId: a }, explanation: 'Solution: Stress is measured in pascals.\n\nWhy it works: $\mathrm{N/m^2}$ is a pascal.\n\nWhy the other choices fail: A joule measures energy, not force per area.' } }
    - { id: e2, title: Strain, content: 'Axial strain is fractional length change: $\epsilon=\Delta L/L$.', check: { id: ec2, type: multipleChoice, prompt: 'Strain has what unit?', choices: [{ id: a, text: 'no unit' }, { id: b, text: 'newton' }], answer: { choiceId: a }, explanation: 'Solution: Strain is dimensionless.\n\nWhy it works: It is a ratio of two lengths.\n\nWhy the other choices fail: A newton is a force unit.' } }
    - { id: e3, title: Young''s modulus, content: 'For axial elastic deformation, $Y=\sigma/\epsilon=FL/(A\Delta L)$.', check: { id: ec3, type: multipleChoice, prompt: 'Which deformation uses Young''s modulus?', choices: [{ id: a, text: 'Stretching a rod' }, { id: b, text: 'Uniform volume compression' }], answer: { choiceId: a }, explanation: 'Solution: Stretching a rod uses Young''s modulus.\n\nWhy it works: Young''s modulus relates normal stress to axial strain.\n\nWhy the other choices fail: Uniform volume change is described by bulk modulus.' } }
    - { id: e4, title: Tension and compression, content: 'Tension lengthens a material and compression shortens it; both are axial deformations.', check: { id: ec4, type: multipleChoice, prompt: 'A column supporting a load is primarily in:', choices: [{ id: a, text: 'compression' }, { id: b, text: 'tension' }], answer: { choiceId: a }, explanation: 'Solution: The column is in compression.\n\nWhy it works: The load pushes inward on its ends.\n\nWhy the other choices fail: Tension pulls outward and lengthens an object.' } }
    - { id: e5, title: Bulk modulus, content: 'Bulk modulus relates a pressure change to fractional volume change: $B=-\Delta p/(\Delta V/V)$.', check: { id: ec5, type: multipleChoice, prompt: 'Bulk modulus applies chiefly to changes in:', choices: [{ id: a, text: 'volume' }, { id: b, text: 'length only' }], answer: { choiceId: a }, explanation: 'Solution: It applies to volume change.\n\nWhy it works: Pressure acts uniformly rather than along one axis.\n\nWhy the other choices fail: Axial length change is modeled by Young''s modulus.' } }
    - { id: e6, title: Shear modulus, content: 'Shear stress acts parallel to a face and changes shape.', check: { id: ec6, type: multipleChoice, prompt: 'A force parallel to the top face of a block produces:', choices: [{ id: a, text: 'shear deformation' }, { id: b, text: 'pure volume compression' }], answer: { choiceId: a }, explanation: 'Solution: It produces shear deformation.\n\nWhy it works: Parallel forces distort shape.\n\nWhy the other choices fail: Volume compression results from pressure acting in all directions.' } }
    - { id: e7, title: Elastic limit, content: 'Linear modulus relations apply only while the material returns approximately to its original shape after unloading.', check: { id: ec7, type: multipleChoice, prompt: 'Beyond the elastic limit, a material may:', choices: [{ id: a, text: 'deform permanently' }, { id: b, text: 'always return exactly to original shape' }], answer: { choiceId: a }, explanation: 'Solution: It may deform permanently.\n\nWhy it works: Yielding is no longer elastic behavior.\n\nWhy the other choices fail: Perfect recovery is the definition of the elastic range.' } }
