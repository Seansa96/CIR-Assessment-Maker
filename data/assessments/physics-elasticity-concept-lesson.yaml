sections:
- id: intro
  title: Introduction to Elasticity
  content: |
    When a force is applied to a solid object, it can stretch, compress, or shear. The study of **Elasticity** examines how materials deform under stress and how they return to their original shape when the stress is removed.
    
    A seminal example is a column or rod under compression or tension. By understanding how forces distribute over a cross-sectional area, we can predict exactly how much a material will yield.
lesson:
  introduction: 'Welcome to the concept lesson on Elasticity and Properties of Matter.'
  sections:
  - id: section-1
    title: Stress, Strain, and Young's Modulus
    content: |
      **Stress ($\sigma$)** is the internal force per unit area that causes deformation:
      $$ \sigma = \frac{F}{A} $$
      where $F$ is the applied force and $A$ is the cross-sectional area.

      **Strain ($\epsilon$)** is the fractional deformation resulting from the stress:
      $$ \epsilon = \frac{\Delta L}{L} $$
      where $\Delta L$ is the change in length and $L$ is the original length.

      **Young's Modulus ($Y$)** is a material constant representing its stiffness in the linear elastic region (Hooke's Law):
      $$ Y = \frac{\text{Stress}}{\text{Strain}} = \frac{F/A}{\Delta L/L} $$
    media:
    - type: image
      src: /media/physics/owa/elastic-moduli-comparison.svg
      alt: Diagram comparing tension, compression, shear, and uniform pressure deformations.
      caption: Different loading patterns require different elastic moduli.
    check:
      id: check-1
      type: multipleChoice
      prompt: 'If you double the force $F$ applied to a metal rod (remaining in the elastic limit), what happens to its Young''s Modulus?'
      choices:
      - id: a
        text: 'It doubles.'
      - id: b
        text: 'It halves.'
      - id: c
        text: 'It remains the same.'
      - id: d
        text: 'It quadruples.'
      answer:
        choiceId: c
      explanation: |
        Solution:
        Young's Modulus is a constant property of the specific material (like steel or brass), not a property of the applied force. 
        
        Why it works: As the stress doubles, the strain ($\Delta L/L$) also doubles proportionally. Their ratio, which is Young's Modulus, remains unchanged.
        
        Why the other choices fail: They assume the modulus is dependent on the external load, confusing a material property with a geometric or applied variable.
  - id: section-2
    title: Tension and compression are axial deformations
    content: |
      A rod in **tension** lengthens when forces pull outward at its ends; a rod in **compression** shortens when forces push inward. For sufficiently small deformation, both cases use Young's modulus:

      $$
      Y = \frac{F L}{A\Delta L}.
      $$

      Use the magnitude of $\Delta L$ for a requested amount of stretch or shortening, then state the direction in words. The equilibrium force can be nonzero inside a loaded object even when its center of mass does not accelerate.
  - id: section-3
    title: Bulk modulus describes volume change
    content: |
      Uniform pressure can change an object's volume without selecting one preferred direction. The **bulk modulus** is

      $$
      B=-\frac{\Delta p}{\Delta V/V}.
      $$

      The minus sign records that increasing pressure normally decreases volume. Liquids resist volume change strongly, which is why they can transmit pressure effectively in a hydraulic system.
  - id: section-4
    title: Shear modulus describes shape change
    content: |
      A **shear** force acts parallel to a face and changes shape rather than primarily changing length or volume. The **shear modulus** compares shear stress with shear strain. A solid such as steel can resist shear; an ideal fluid cannot sustain a static shear stress and flows instead.
  - id: section-5
    title: Choose the modulus from the deformation
    content: |
      First identify what changes: length, volume, or shape. Use Young's modulus for axial stretch/compression, bulk modulus for pressure-driven volume change, and shear modulus for sideways distortion. Material tables list different values because these are distinct responses, not interchangeable names for one stiffness.
  - id: section-6
    title: Elastic behavior has a limited range
    content: |
      The linear formulas are models for an elastic range: after the load is removed, the object returns approximately to its original dimensions. Beyond an elastic limit, a material can deform permanently or fail. Do not extend a small-deformation modulus calculation to a situation that the prompt identifies as yielding, cracking, or plastically deforming.
  - id: section-7
    title: Link material properties to wave speed
    content: |
      Stiffer materials generally transmit disturbances more quickly, while greater density increases inertia and tends to reduce wave speed. This prepares the later sound-speed models in solids and fluids: an elastic property supplies the restoring effect and density supplies the inertial effect.
