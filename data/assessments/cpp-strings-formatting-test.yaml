attemptQuestionCount: 19
questions:
- sourceFamilyId: cpp-fsf-string-004
  skills:
  - select-longest-token
  type: multipleChoice
  prompt: |-
    Words are maximal ASCII-letter runs and ties keep the first. What is returned for `one, three! seven`?
  choices:
  - id: a
    text: '`one`'
  - id: b
    text: '`three`'
  - id: c
    text: '`seven`'
  - id: d
    text: '`three!`'
  answer:
    choiceId: b
  explanation: |-
    `three` and `seven` both have length five, so strict improvement preserves the first.
  id: q001
- sourceFamilyId: cpp-fsf-string-014
  skills:
  - parse-embedded-integers
  type: multipleChoice
  prompt: |-
    What sum is produced from `v2 has 10 fixes and 003 tests` when maximal digit runs are integers?
  choices:
  - id: a
    text: '15'
  - id: b
    text: '18'
  - id: c
    text: '210003'
  - id: d
    text: '6'
  answer:
    choiceId: a
  explanation: |-
    The parsed runs are 2, 10, and 3, whose sum is 15.
  id: q002
- sourceFamilyId: cpp-fsf-string-015
  skills:
  - format-integers-as-english
  type: multipleChoice
  prompt: |-
    Why is an integer-to-English formatter naturally decomposed into groups below one thousand?
  choices:
  - id: a
    text: Every three decimal digits reuse the same hundreds/tens/ones rules
  - id: b
    text: C++ strings have a three-byte limit
  - id: c
    text: English never names zero
  - id: d
    text: It avoids all lookup tables
  answer:
    choiceId: a
  explanation: |-
    Million, thousand, and units groups share one sub-thousand formatter plus a scale name.
  id: q003
- sourceFamilyId: cpp-fsf-string-016
  skills:
  - find-common-prefix
  type: multipleChoice
  prompt: |-
    Which condition must be checked before reading `word[length]` during a vertical prefix scan?
  choices:
  - id: a
    text: '`length < word.size()`'
  - id: b
    text: '`word.size() < words.size()`'
  - id: c
    text: '`length != 0`'
  - id: d
    text: '`word[length] != ''\0''` only'
  answer:
    choiceId: a
  explanation: |-
    A shorter word may end before the current prefix position, so the index must be bounded first.
  id: q004
- sourceFamilyId: cpp-fsf-string-018
  skills:
  - find-longest-valid-parentheses
  type: multipleChoice
  prompt: |-
    In the unmatched-index stack method, what does the initial sentinel `-1` represent?
  choices:
  - id: a
    text: A fake opening parenthesis
  - id: b
    text: The boundary immediately before a valid prefix beginning at zero
  - id: c
    text: The number of pairs
  - id: d
    text: An invalid character
  answer:
    choiceId: b
  explanation: |-
    Distance from the sentinel to a closing index gives a valid prefix length.
  id: q005
- sourceFamilyId: cpp-fsf-string-023
  skills:
  - compute-character-set-union
  type: multipleChoice
  prompt: |-
    Two strings have 6 and 5 distinct bytes, with 3 shared. How many distinct bytes are in their union?
  choices:
  - id: a
    text: '8'
  - id: b
    text: '11'
  - id: c
    text: '3'
  - id: d
    text: '14'
  answer:
    choiceId: a
  explanation: |-
    Union size is 6 + 5 - 3 = 8.
  id: q006
- sourceFamilyId: cpp-fsf-string-024
  skills:
  - count-duplicated-character-values
  type: multipleChoice
  prompt: |-
    What is `duplicate_byte_count("aaaaabbc")`?
  choices:
  - id: a
    text: '2'
  - id: b
    text: '5'
  - id: c
    text: '6'
  - id: d
    text: '1'
  answer:
    choiceId: a
  explanation: |-
    Only byte values `a` and `b` occur at least twice; multiplicity beyond two does not add another value.
  id: q007
- sourceFamilyId: cpp-fsf-string-026
  skills:
  - validate-title-case
  type: multipleChoice
  prompt: |-
    Under the rule “uppercase first letter, lowercase remaining letters,” which input passes?
  choices:
  - id: a
    text: '`The Quick Brown Fox.`'
  - id: b
    text: '`The quick Brown Fox.`'
  - id: c
    text: '`NASA Mission`'
  - id: d
    text: '`123`'
  answer:
    choiceId: a
  explanation: |-
    Every letter run in the first option follows the required case pattern and at least one word exists.
  id: q008
- sourceFamilyId: cpp-fsf-string-027
  skills:
  - split-camel-case
  type: multipleChoice
  prompt: |-
    What should lower-to-upper boundary splitting do with `XMLParser`?
  choices:
  - id: a
    text: '`X M L Parser`'
  - id: b
    text: '`XML Parser`'
  - id: c
    text: '`XMLParser`'
  - id: d
    text: '`XM LParser`'
  answer:
    choiceId: c
  explanation: |-
    The `P` follows uppercase `L`, not a lowercase byte, so this specific contract inserts no space.
  id: q009
- sourceFamilyId: cpp-fsf-string-028
  skills:
  - extract-first-matches
  type: multipleChoice
  prompt: |-
    When should `first_vowels(text, count)` return `nullopt`?
  choices:
  - id: a
    text: Whenever more vowels exist than requested
  - id: b
    text: When fewer vowels exist than requested
  - id: c
    text: Whenever count is zero
  - id: d
    text: When the first byte is a consonant
  answer:
    choiceId: b
  explanation: |-
    Failure represents insufficient matching data, not unused extra vowels.
  id: q010
- sourceFamilyId: cpp-fsf-string-029
  skills:
  - format-decimal-thousands
  type: multipleChoice
  prompt: |-
    Why is `std::to_string(value)` safer than first taking `abs(value)` in a signed thousands formatter?
  choices:
  - id: a
    text: It handles the most-negative signed value without overflowing its positive counterpart
  - id: b
    text: It sorts digits
  - id: c
    text: It removes the sign
  - id: d
    text: It changes the locale
  answer:
    choiceId: a
  explanation: |-
    The positive magnitude of the minimum signed value is not representable in the same signed type.
  id: q011
- sourceFamilyId: cpp-fsf-string-031
  skills:
  - validate-uniform-letter-case
  type: selectAll
  prompt: |-
    Which inputs satisfy the nonempty, letters-only, uniform-case contract? Select all that apply.
  choices:
  - id: a
    text: '`ABC`'
  - id: b
    text: '`abc`'
  - id: c
    text: '`Abc`'
  - id: d
    text: '`ABC1`'
  answer:
    choiceIds:
    - a
    - b
  explanation: |-
    All-uppercase and all-lowercase letter strings pass; mixed case and nonletters fail.
  id: q012
- sourceFamilyId: cpp-fsf-string-033
  skills:
  - test-multiset-containment
  type: multipleChoice
  prompt: |-
    Why does a set give the wrong answer for `can_construct_from("a", "aa")`?
  choices:
  - id: a
    text: It ignores case
  - id: b
    text: It records membership but not the number of available copies
  - id: c
    text: It preserves order
  - id: d
    text: It cannot store `a`
  answer:
    choiceId: b
  explanation: |-
    Constructibility is multiset containment, so multiplicity must be consumed.
  id: q013
- sourceFamilyId: cpp-fsf-string-034
  skills:
  - remove-first-substring
  type: multipleChoice
  prompt: |-
    What must happen before calling `erase(pos, target.size())`?
  choices:
  - id: a
    text: Verify `pos != npos`
  - id: b
    text: Sort the string
  - id: c
    text: Append the target
  - id: d
    text: Convert the target to uppercase
  answer:
    choiceId: a
  explanation: |-
    Passing `npos` as an erase position is out of range.
  id: q014
- sourceFamilyId: cpp-fsf-string-035
  skills:
  - transform-odd-length-words
  type: multipleChoice
  prompt: |-
    Why must punctuation be excluded before testing a word's length parity?
  choices:
  - id: a
    text: Including it can change odd to even or even to odd
  - id: b
    text: Punctuation is always uppercase
  - id: c
    text: It prevents iteration
  - id: d
    text: It forces a file read
  answer:
    choiceId: a
  explanation: |-
    The word definition controls the interval length and therefore the reversal decision.
  id: q015
- sourceFamilyId: cpp-fsf-string-038
  skills:
  - remove-matching-characters
  type: multipleChoice
  prompt: |-
    After `std::remove`, why is `erase` still required?
  choices:
  - id: a
    text: '`remove` returns a logical end but does not shrink the string'
  - id: b
    text: '`remove` deletes the entire string'
  - id: c
    text: '`erase` sorts retained bytes'
  - id: d
    text: '`erase` changes case'
  answer:
    choiceId: a
  explanation: |-
    The obsolete tail remains physically present until the container erases it.
  id: q016
- sourceFamilyId: cpp-fsf-string-039
  skills:
  - validate-character-uniqueness
  type: multipleChoice
  prompt: |-
    Why should a byte be converted to `unsigned char` before indexing a 256-entry table?
  choices:
  - id: a
    text: Plain `char` may be negative
  - id: b
    text: Unsigned values are alphabetic
  - id: c
    text: It makes the table dynamic
  - id: d
    text: It removes duplicates
  answer:
    choiceId: a
  explanation: |-
    On implementations with signed `char`, high-bit bytes otherwise produce negative indices.
  id: q017
- sourceFamilyId: cpp-fsf-string-040
  skills:
  - select-by-parallel-string-mask
  type: multipleChoice
  prompt: |-
    What does `select_where_first_is_lower("Java", "jscript")` return?
  choices:
  - id: a
    text: '`Java`'
  - id: b
    text: '`jav`'
  - id: c
    text: '`scr`'
  - id: d
    text: '`jsc`'
  answer:
    choiceId: c
  explanation: |-
    Lowercase mask positions 1, 2, and 3 select `s`, `c`, and `r` from the value string.
  id: q018
- sourceFamilyId: cpp-fsf-string-042
  skills:
  - alternate-letter-case
  type: multipleChoice
  prompt: |-
    What should `alternating_ascii_case("A-BC")` return when punctuation does not advance the pattern?
  choices:
  - id: a
    text: '`a-bC`'
  - id: b
    text: '`a-Bc`'
  - id: c
    text: '`A-bC`'
  - id: d
    text: '`a-bc`'
  answer:
    choiceId: b
  explanation: |-
    Letters receive lower, upper, lower in sequence; the hyphen is preserved and does not toggle state.
  id: q019
