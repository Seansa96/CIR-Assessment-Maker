workedExamples:
  - id: polar-cardioid-horizontal-tangent-solving
    title: Horizontal tangents when theta is not given
    problem: |
      Find the ordinary horizontal tangent points on the polar curve

      $$
      r=1+\cos\theta
      $$

      for

      $$
      0\le\theta<2\pi.
      $$

      The important point: you are not given $\theta$. You solve for the $\theta$-values that make the horizontal tangent condition true.
    steps:
      - id: cardioid-horizontal-step-1-model
        title: Identify the correct tangent condition
        instruction: |
          A polar curve is treated as

          $$
          x=r\cos\theta,
          \qquad
          y=r\sin\theta.
          $$

          A horizontal tangent means $\frac{dy}{d\theta}=0$ while $\frac{dx}{d\theta}\ne0$.
        type: multipleChoice
        prompt: Which equation should be solved first for horizontal tangent candidates?
        choices:
          - id: numerator
            text: '$r''\sin\theta+r\cos\theta=0$'
          - id: denominator
            text: '$r''\cos\theta-r\sin\theta=0$'
          - id: radius
            text: '$r=0$'
          - id: slope-one
            text: '$r''=1$'
        answer:
          choiceId: numerator
        hint: Horizontal means the vertical component rate is zero.
        explanation: |
          The numerator of the polar slope formula is $\frac{dy}{d\theta}$. That is the expression we set equal to zero for horizontal tangent candidates.

          Related topic: polar slope from parametric derivatives.

      - id: cardioid-horizontal-step-2-derivative
        title: Differentiate the radius
        instruction: |
          The curve is

          $$
          r=1+\cos\theta.
          $$

          The derivative of the constant is zero, and the derivative of $\cos\theta$ is $-\sin\theta$.
        type: symbolicResponse
        prompt: Find $r'(\theta)$.
        answer:
          expectedLatex: '-\sin\theta'
          equivalenceMode: expression
          variables:
            - theta
          tolerance: 0.000001
        hint: Differentiate $1+\cos\theta$ with respect to $\theta$.
        explanation: |
          $r'=-\sin\theta$. This derivative controls how the radius changes as the ray sweeps around the pole.

      - id: cardioid-horizontal-step-3-substitute
        title: Build the horizontal equation
        instruction: |
          Substitute $r=1+\cos\theta$ and $r'=-\sin\theta$ into

          $$
          r'\sin\theta+r\cos\theta=0.
          $$

          This gives

          $$
          (-\sin\theta)\sin\theta+(1+\cos\theta)\cos\theta=0.
          $$
        type: multipleChoice
        prompt: Which simplified equation is equivalent to the horizontal tangent condition?
        choices:
          - id: correct
            text: '$2\cos^2\theta+\cos\theta-1=0$'
          - id: sign-error
            text: '$2\cos^2\theta-\cos\theta-1=0$'
          - id: missing-term
            text: '$\cos^2\theta-\sin^2\theta=0$'
          - id: denominator
            text: '$-\sin\theta(1+2\cos\theta)=0$'
        answer:
          choiceId: correct
        hint: Use $\sin^2\theta=1-\cos^2\theta$.
        explanation: |
          Starting from

          $$
          -\sin^2\theta+\cos\theta+\cos^2\theta=0,
          $$

          replace $\sin^2\theta$ with $1-\cos^2\theta$:

          $$
          -(1-\cos^2\theta)+\cos\theta+\cos^2\theta=0.
          $$

          So

          $$
          2\cos^2\theta+\cos\theta-1=0.
          $$

      - id: cardioid-horizontal-step-4-solve
        title: Solve for theta
        instruction: |
          Factor the equation:

          $$
          2\cos^2\theta+\cos\theta-1=0.
          $$

          Treat $\cos\theta$ like the variable:

          $$
          (2\cos\theta-1)(\cos\theta+1)=0.
          $$
        type: selectAll
        prompt: Which $\theta$-values in $0\le\theta<2\pi$ solve this equation?
        choices:
          - id: pi-third
            text: '$\theta=\frac{\pi}{3}$'
          - id: five-pi-third
            text: '$\theta=\frac{5\pi}{3}$'
          - id: pi
            text: '$\theta=\pi$'
          - id: zero
            text: '$\theta=0$'
        answer:
          choiceIds:
            - pi-third
            - five-pi-third
            - pi
        hint: Solve $\cos\theta=\frac12$ and $\cos\theta=-1$ on the given interval.
        explanation: |
          $\cos\theta=\frac12$ gives $\theta=\frac{\pi}{3}$ and $\theta=\frac{5\pi}{3}$. Also, $\cos\theta=-1$ gives $\theta=\pi$.

          These are candidates. They still need the denominator check.

      - id: cardioid-horizontal-step-5-denominator-check
        title: Reject the singular candidate
        instruction: |
          The denominator is

          $$
          r'\cos\theta-r\sin\theta
          =
          -\sin\theta\cos\theta-(1+\cos\theta)\sin\theta
          =
          -\sin\theta(1+2\cos\theta).
          $$

          A horizontal tangent requires this expression to be nonzero.
        type: multipleChoice
        prompt: Which candidate must be rejected from the ordinary horizontal tangent list?
        choices:
          - id: pi
            text: '$\theta=\pi$'
          - id: pi-third
            text: '$\theta=\frac{\pi}{3}$'
          - id: five-pi-third
            text: '$\theta=\frac{5\pi}{3}$'
          - id: none
            text: None of the candidates.
        answer:
          choiceId: pi
        hint: At $\theta=\pi$, both the numerator and denominator become zero.
        explanation: |
          At $\theta=\pi$, the curve is at the pole because $r=1+\cos\pi=0$, and the denominator is also zero. The ordinary slope test gives $0/0$, so this is not accepted as an ordinary horizontal tangent without separate singular-point analysis.

      - id: cardioid-horizontal-step-6-points
        title: Convert the accepted angles to points
        instruction: |
          The accepted angles are

          $$
          \theta=\frac{\pi}{3},
          \qquad
          \theta=\frac{5\pi}{3}.
          $$

          For both angles, $r=1+\frac12=\frac32$. Convert using

          $$
          x=r\cos\theta,
          \qquad
          y=r\sin\theta.
          $$
        type: freeResponse
        prompt: State the two horizontal tangent points.
        answer:
          expected: The points are $(3/4, 3\sqrt{3}/4)$ and $(3/4, -3\sqrt{3}/4)$.
          gradingMode: selfCheck
          keyPoints:
            - Use only the accepted angles $\theta=\pi/3$ and $\theta=5\pi/3$.
            - Compute $r=3/2$ at both accepted angles.
            - Convert with $x=r\cos\theta$ and $y=r\sin\theta$.
        hint: Multiply $\frac32$ by the sine and cosine values at $\frac{\pi}{3}$ and $\frac{5\pi}{3}$.
        explanation: |
          At $\theta=\frac{\pi}{3}$,

          $$
          (x,y)=\left(\frac32\cdot\frac12,\frac32\cdot\frac{\sqrt3}{2}\right)
          =
          \left(\frac34,\frac{3\sqrt3}{4}\right).
          $$

          At $\theta=\frac{5\pi}{3}$,

          $$
          (x,y)=\left(\frac34,-\frac{3\sqrt3}{4}\right).
          $$

          Related topics: polar-to-Cartesian conversion and singular tangent checks.

  - id: polar-cardioid-bounded-horizontal-vertical
    title: Horizontal and vertical tangents on a given interval
    problem: |
      Find the point $(x,y)$ at which the polar curve

      $$
      r=1-\sin\theta
      $$

      for

      $$
      -\frac{\pi}{4}\le\theta\le\frac{\pi}{4}
      $$

      has a horizontal tangent line and a vertical tangent line.
    steps:
      - id: bounded-cardioid-step-1-interval
        title: Use the given interval
        instruction: |
          This problem gives a specific interval. That means all candidate $\theta$-values must be checked against

          $$
          -\frac{\pi}{4}\le\theta\le\frac{\pi}{4}.
          $$

          You do not choose a random angle, and you do not automatically use $0\le\theta<2\pi$ when the prompt has already supplied bounds.
        type: multipleChoice
        prompt: What role does the interval play in this problem?
        choices:
          - id: restrict
            text: It restricts which solved $\theta$-values are accepted.
          - id: random
            text: It tells you to choose any angle inside the interval.
          - id: ignore
            text: It should be ignored because polar curves always use $0\le\theta<2\pi$.
          - id: convert
            text: It replaces the need to compute $r'$.
        answer:
          choiceId: restrict
        explanation: |
          The tangent equations may produce several candidates, but only candidates inside the given interval belong to this problem.

      - id: bounded-cardioid-step-2-derivative
        title: Differentiate and name both component rates
        instruction: |
          For

          $$
          r=1-\sin\theta,
          $$

          the derivative is

          $$
          r'=-\cos\theta.
          $$

          The horizontal equation uses

          $$
          N=r'\sin\theta+r\cos\theta,
          $$

          and the vertical equation uses

          $$
          D=r'\cos\theta-r\sin\theta.
          $$
        type: multipleChoice
        prompt: Which pair gives the correct numerator and denominator expressions before simplification?
        choices:
          - id: correct
            text: '$N=(-\cos\theta)\sin\theta+(1-\sin\theta)\cos\theta$, $D=(-\cos\theta)\cos\theta-(1-\sin\theta)\sin\theta$'
          - id: swapped
            text: '$N=(-\cos\theta)\cos\theta-(1-\sin\theta)\sin\theta$, $D=(-\cos\theta)\sin\theta+(1-\sin\theta)\cos\theta$'
          - id: missing-r
            text: '$N=-\cos\theta\sin\theta$, $D=-\cos^2\theta$'
          - id: wrong-derivative
            text: '$N=(\cos\theta)\sin\theta+(1-\sin\theta)\cos\theta$, $D=(\cos\theta)\cos\theta-(1-\sin\theta)\sin\theta$'
        answer:
          choiceId: correct
        explanation: |
          The slope formula is

          $$
          \frac{dy}{dx}=\frac{r'\sin\theta+r\cos\theta}{r'\cos\theta-r\sin\theta}.
          $$

          The main bookkeeping task is placing $r$ and $r'$ in the correct locations.

      - id: bounded-cardioid-step-3-horizontal
        title: Solve the horizontal equation
        instruction: |
          Simplify the numerator:

          $$
          N=(-\cos\theta)\sin\theta+(1-\sin\theta)\cos\theta
          =
          \cos\theta(1-2\sin\theta).
          $$

          Horizontal candidates satisfy

          $$
          \cos\theta(1-2\sin\theta)=0.
          $$
        type: multipleChoice
        prompt: Which horizontal candidate lies in the interval $-\frac{\pi}{4}\le\theta\le\frac{\pi}{4}$?
        choices:
          - id: pi-six
            text: '$\theta=\frac{\pi}{6}$'
          - id: pi-two
            text: '$\theta=\frac{\pi}{2}$'
          - id: negative-pi-six
            text: '$\theta=-\frac{\pi}{6}$'
          - id: none
            text: No candidate lies in the interval.
        answer:
          choiceId: pi-six
        hint: In this interval, $\cos\theta$ is not zero, so solve $\sin\theta=\frac12$.
        explanation: |
          The equation gives $\cos\theta=0$ or $\sin\theta=\frac12$. The first option is outside the interval. The second gives

          $$
          \theta=\frac{\pi}{6},
          $$

          which is inside the interval.

      - id: bounded-cardioid-step-4-vertical
        title: Solve the vertical equation
        instruction: |
          Simplify the denominator:

          $$
          D=(-\cos\theta)\cos\theta-(1-\sin\theta)\sin\theta.
          $$

          Using $\cos^2\theta=1-\sin^2\theta$:

          $$
          D
          =
          -1-\sin\theta+2\sin^2\theta.
          $$

          Set $D=0$:

          $$
          2\sin^2\theta-\sin\theta-1=0.
          $$
        type: multipleChoice
        prompt: Which vertical candidate lies in the interval?
        choices:
          - id: negative-pi-six
            text: '$\theta=-\frac{\pi}{6}$'
          - id: pi-two
            text: '$\theta=\frac{\pi}{2}$'
          - id: pi-six
            text: '$\theta=\frac{\pi}{6}$'
          - id: negative-pi-two
            text: '$\theta=-\frac{\pi}{2}$'
        answer:
          choiceId: negative-pi-six
        hint: Factor as $(2\sin\theta+1)(\sin\theta-1)=0$.
        explanation: |
          Factoring gives

          $$
          (2\sin\theta+1)(\sin\theta-1)=0.
          $$

          The candidate $\sin\theta=1$ is outside the interval. The candidate $\sin\theta=-\frac12$ gives

          $$
          \theta=-\frac{\pi}{6}.
          $$

      - id: bounded-cardioid-step-5-points
        title: Convert both accepted angles to points
        instruction: |
          For the horizontal tangent, use $\theta=\frac{\pi}{6}$:

          $$
          r=1-\frac12=\frac12.
          $$

          For the vertical tangent, use $\theta=-\frac{\pi}{6}$:

          $$
          r=1-\left(-\frac12\right)=\frac32.
          $$
        type: selectAll
        prompt: Which point statements are correct?
        choices:
          - id: horizontal-point
            text: 'The horizontal tangent point is $\left(\frac{\sqrt3}{4},\frac14\right)$.'
          - id: vertical-point
            text: 'The vertical tangent point is $\left(\frac{3\sqrt3}{4},-\frac34\right)$.'
          - id: swapped
            text: 'The horizontal tangent point is $\left(\frac{3\sqrt3}{4},-\frac34\right)$.'
          - id: ignore-r
            text: 'Both points are found from $(\cos\theta,\sin\theta)$ without multiplying by $r$.'
        answer:
          choiceIds:
            - horizontal-point
            - vertical-point
        explanation: |
          Horizontal point:

          $$
          \left(\frac12\cos\frac{\pi}{6},\frac12\sin\frac{\pi}{6}\right)
          =
          \left(\frac{\sqrt3}{4},\frac14\right).
          $$

          Vertical point:

          $$
          \left(\frac32\cos\left(-\frac{\pi}{6}\right),\frac32\sin\left(-\frac{\pi}{6}\right)\right)
          =
          \left(\frac{3\sqrt3}{4},-\frac34\right).
          $$

          Related topics: bounded polar tracing intervals and tangent classification.

  - id: polar-circle-duplicate-candidate-management
    title: Full-sweep candidates and duplicate points
    problem: |
      Find the ordinary horizontal and vertical tangent points on the polar curve

      $$
      r=2\cos\theta
      $$

      using the full sweep

      $$
      0\le\theta<2\pi.
      $$

      This curve is a circle. The full sweep produces duplicate polar representations, so the final task is to identify unique physical points.
    steps:
      - id: circle-duplicates-step-1-why-full-sweep
        title: Understand why duplicates can appear
        instruction: |
          The interval $0\le\theta<2\pi$ is a safe full angular sweep. However, polar coordinates are not unique:

          $$
          (r,\theta)
          \quad\text{and}\quad
          (-r,\theta+\pi)
          $$

          can describe the same point. So this workflow may generate repeated physical locations.
        type: multipleChoice
        prompt: What should you do if the same physical point appears from two different polar candidates?
        choices:
          - id: remove-duplicate
            text: Keep one copy of the point in the final answer.
          - id: keep-both
            text: Always list both because the angles are different.
          - id: reject-negative
            text: Reject every candidate where $r$ is negative.
          - id: restart
            text: Restart with a random angle.
        answer:
          choiceId: remove-duplicate
        explanation: |
          If the final answer asks for points, the physical point matters. Different polar pairs may still represent one location.

      - id: circle-duplicates-step-2-components
        title: Compute the component rates
        instruction: |
          For

          $$
          r=2\cos\theta,
          $$

          we have

          $$
          r'=-2\sin\theta.
          $$

          Substitute into the component rates:

          $$
          N=r'\sin\theta+r\cos\theta,
          \qquad
          D=r'\cos\theta-r\sin\theta.
          $$
        type: multipleChoice
        prompt: Which simplified component-rate pair is correct?
        choices:
          - id: correct
            text: '$N=2\cos(2\theta)$ and $D=-2\sin(2\theta)$'
          - id: swapped
            text: '$N=-2\sin(2\theta)$ and $D=2\cos(2\theta)$'
          - id: both-cos
            text: '$N=2\cos(2\theta)$ and $D=2\cos(2\theta)$'
          - id: no-double
            text: '$N=2\cos\theta$ and $D=-2\sin\theta$'
        answer:
          choiceId: correct
        explanation: |
          The numerator is

          $$
          -2\sin^2\theta+2\cos^2\theta=2\cos(2\theta),
          $$

          and the denominator is

          $$
          -2\sin\theta\cos\theta-2\cos\theta\sin\theta=-2\sin(2\theta).
          $$

      - id: circle-duplicates-step-3-horizontal
        title: Find horizontal candidates and unique points
        instruction: |
          Horizontal candidates satisfy

          $$
          2\cos(2\theta)=0.
          $$

          On $0\le\theta<2\pi$, this gives

          $$
          \theta=\frac{\pi}{4},\frac{3\pi}{4},\frac{5\pi}{4},\frac{7\pi}{4}.
          $$

          The denominator is nonzero at each candidate, so they are ordinary horizontal candidates. Now convert to points and remove duplicates.
        type: selectAll
        prompt: Which unique horizontal tangent points occur on the curve?
        choices:
          - id: top
            text: '$(1,1)$'
          - id: bottom
            text: '$(1,-1)$'
          - id: right
            text: '$(2,0)$'
          - id: pole
            text: '$(0,0)$'
        answer:
          choiceIds:
            - top
            - bottom
        hint: Convert with $x=r\cos\theta$ and $y=r\sin\theta$ at all four candidates.
        explanation: |
          The four polar candidates collapse to two unique points:

          $$
          (1,1)
          \qquad\text{and}\qquad
          (1,-1).
          $$

          These are the top and bottom of the circle $x^2+y^2=2x$.

      - id: circle-duplicates-step-4-vertical
        title: Find vertical candidates and unique points
        instruction: |
          Vertical candidates satisfy

          $$
          -2\sin(2\theta)=0.
          $$

          On $0\le\theta<2\pi$, this gives

          $$
          \theta=0,\frac{\pi}{2},\pi,\frac{3\pi}{2}.
          $$

          The numerator is nonzero at each candidate, so they are ordinary vertical candidates.
        type: selectAll
        prompt: Which unique vertical tangent points occur on the curve?
        choices:
          - id: right
            text: '$(2,0)$'
          - id: pole
            text: '$(0,0)$'
          - id: top
            text: '$(1,1)$'
          - id: bottom
            text: '$(1,-1)$'
        answer:
          choiceIds:
            - right
            - pole
        explanation: |
          At $\theta=0$ and $\theta=\pi$, the curve gives the same physical point $(2,0)$. At $\theta=\frac{\pi}{2}$ and $\theta=\frac{3\pi}{2}$, it gives the pole $(0,0)$.

          These are the left and right sides of the circle $x^2+y^2=2x$.

      - id: circle-duplicates-step-5-synthesis
        title: State the reusable workflow
        instruction: |
          This example shows the complete workflow:

          1. Use the problem's interval, or a full sweep if no interval is supplied.
          2. Solve the numerator for horizontal candidates.
          3. Solve the denominator for vertical candidates.
          4. Check that the other component rate is nonzero.
          5. Convert candidates to points.
          6. Remove duplicate physical points if the interval retraces the curve.
        type: freeResponse
        prompt: In your own words, explain why solving for $\theta$ is the central action in polar tangent problems.
        answer:
          expected: In a polar tangent problem, $\theta$ is the parameter. Horizontal and vertical tangent conditions become equations in $\theta$, so the tangent locations come from solving those equations, checking the other component rate, and converting accepted angles into points.
          gradingMode: selfCheck
          keyPoints:
            - Identify $\theta$ as the parameter/unknown.
            - Mention solving $dy/d\theta=0$ for horizontal tangents.
            - Mention solving $dx/d\theta=0$ for vertical tangents.
            - Mention checking the other component rate and converting to points.
            - Mention duplicate polar representations when a full sweep retraces points.
        hint: Compare the process to solving $y'=0$ for $x$ in a Cartesian horizontal tangent problem.
        explanation: |
          Polar tangents are parametric tangent problems. The curve is traced as $\theta$ changes, so tangent locations come from the $\theta$-values that make the component rates behave horizontally or vertically.

          Related topics: polar tracing intervals, equivalent polar points, and parametric derivative classification.
