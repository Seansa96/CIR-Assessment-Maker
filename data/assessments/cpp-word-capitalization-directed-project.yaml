directedProject:
  summary: Build a capitalization utility, then harden its word-boundary policy for realistic text.
  estimatedTimeMinutes: 45
  outcomes:
  - Implement the word-boundary-case-conversion family from a precise contract.
  - Explain the invariant and complexity of the implementation.
  - Adapt the base solution to changed requirements without breaking edge cases.
  environment:
    name: Local C++20 console project
    platform:
    - windows
    - linux
    - macos
    toolVersion: C++20
    requiredAccounts: []
    prerequisites:
    - Functions
    - loops
    - standard library containers
    installLinks: []
  resources: []
  phases:
  - id: phase-1-contract-and-approach
    title: Understand the contract and approach
    required: true
    goal: Translate the problem into an invariant before coding.
    steps:
    - id: step-1-problem-contract
      title: Read the canonical problem
      instruction: |
        Source family: `cpp-fsf-string-003`

        Implement `std::string capitalize_words(std::string text)` for
        ASCII text whose words are separated by one space. Capitalize the first
        character of each nonempty word and preserve the remaining characters.
        Example: `cpp string exercises` becomes `Cpp String Exercises`.
      expectedObservation: Requires detecting the first letter and every letter following a space.
      checklist:
      - id: contract-input-output
        text: I can state the exact input, output, and edge-case policy.
      - id: contract-complexity
        text: I identified which operations determine the time and space cost.
      resources: []
    - id: step-2-approach
      title: Plan the implementation
      instruction: |
        Use this approach before opening the sample solution:

        1. Represent whether the next non-space character begins a word with one Boolean.
        2. Reset that state at a separator and consume it when the first character is processed.
        3. Cast through unsigned char before calling a cctype conversion function.
        4. Keep boundary recognition separate from case conversion so each policy can change independently.

        Write a short trace for one nontrivial input.
      expectedObservation: Maintain a word-start flag, reset it at spaces, and uppercase the next non-space
        byte safely.
      checklist:
      - id: approach-invariant
        text: My trace preserves the stated invariant at every step.
      resources: []
  - id: phase-2-reference-and-build
    title: Study the example and build your version
    required: true
    goal: Connect the approach to complete, compilable C++.
    steps:
    - id: step-3-example-solution
      title: Trace the example solution
      instruction: |
        `at_start` is true exactly when the next non-space character begins a
        word. Casting to `unsigned char` before `std::toupper` avoids undefined
        behavior for negative `char` values.

        ```cpp
        #include <cctype>
        #include <string>

        std::string capitalize_words(std::string text) {
            bool at_start = true;
            for (char& ch : text) {
                if (ch == ' ') {
                    at_start = true;
                } else if (at_start) {
                    ch = static_cast<char>(
                        std::toupper(static_cast<unsigned char>(ch)));
                    at_start = false;
                }
            }
            return text;
        }
        ```

        Trace this solution against every representative case before writing your own version. The sample is a reference, not starter code.
      expectedObservation: Maintain a word-start flag, reset it at spaces, and uppercase the next non-space
        byte safely.
      checklist:
      - id: solution-explained
        text: I can explain every branch, loop, and edge-case decision.
      - id: trap-avoided
        text: 'I can explain why this trap is wrong: Uppercasing `text[i + 1]` after every space without
          checking that the index exists.'
      resources: []
    - id: step-4-build
      title: Implement independently
      instruction: |
        Create `main.cpp` and implement the canonical contract without copying the reference. Add the representative cases from the bank plus at least three edge cases.
      files:
      - path: main.cpp
        purpose: Learner implementation and tests
        suggestedContent: |
          // Implement the required function here.
          // Keep main() small and use it only for your own test cases.

          int main() {
              return 0;
          }
        readOnly: false
      checklist:
      - id: build-compiles
        text: The program compiles with C++20 warnings enabled.
      - id: build-tests
        text: Representative and edge cases pass.
      troubleshooting:
      - problem: Output differs only at an edge case.
        suggestion: Uppercasing `text[i + 1]` after every space without checking that the index exists.
      resources: []
  - id: phase-3-variants
    title: Implement changed-condition variants
    required: true
    goal: Generalize the family instead of memorizing one solution.
    steps:
    - id: step-5-variants
      title: Complete the family variants
      instruction: |
        Extend the program with these variants:

        1. Generalize the function so any ASCII whitespace starts a word, while preserving every delimiter byte.
        2. Add a punctuation-aware mode in which a letter after `-` or `'` does not automatically begin a new word.
        3. Add tests for empty input, leading and repeated spaces, one-letter words, and already-capitalized text.

        Keep each behavior in a separately testable function.
      checklist:
      - id: variants-distinct
        text: Each variant changes behavior or constraints, not only sample data.
      - id: variants-regression
        text: The original canonical tests still pass.
      notesPrompt: Which part of the original invariant survived every variant, and which part had to
        change?
      resources: []
