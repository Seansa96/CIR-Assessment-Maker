- id: q001
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A tensioned cable vibrates with wavelength 18.52 m when driven at 79.0 Hz.
    What is the wave speed in m/s?
  answer:
    value: 1463.08
    tolerance: 0.05
  explanation: v = lambda * f = 18.52 * 79.0 = 1463.08 m/s.
- id: q002
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: An ocean swell propagates with a wavelength of 12.14 m passing a buoy at
    98.1 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.5176
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 12.14 = 0.5176 rad/m.
