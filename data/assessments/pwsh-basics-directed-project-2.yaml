questionCount: 0
guidedProject: null
directedProject:
  summary: "In this project, you will practice using `Get-Command` and `Get-Help` on your local machine to discover cmdlets you've never used before."
  estimatedTimeMinutes: 15
  resources: []
  phases:
    - id: phase-1-discovery
      title: "Discovering Commands"
      steps:
        - id: step-1-find-net
          title: "Find Network Commands"
          instruction: |
            1. Open PowerShell.
            2. You want to see what cmdlets are available for interacting with network adapters. Run `Get-Command -Noun *NetAdapter*`.
            3. Pick one cmdlet from the list (e.g., `Get-NetAdapter`) that looks interesting to you.
          checklist:
            - id: chk-net
              text: "Used Get-Command to find network-related cmdlets"
          resources: []
    - id: phase-2-learning
      title: "Learning How to Use Them"
      steps:
        - id: step-2-read-help
          title: "Read the Manual"
          instruction: |
            1. Run `Get-Help <YourChosenCmdlet> -Examples` (e.g., `Get-Help Get-NetAdapter -Examples`).
            2. Read through the examples to understand what parameters it expects.
            3. Run the cmdlet on your machine without any destructive parameters (stick to 'Get' verbs!). Note the object-oriented output.
          checklist:
            - id: chk-help
              text: "Successfully queried examples for a newly discovered cmdlet"
            - id: chk-run
              text: "Executed a non-destructive cmdlet to observe its output"
          resources: []
