questions:
- sourceFamilyId: cpp-fsf-file-012
  skills:
  - normalize-caesar-shifts
  type: multipleChoice
  prompt: |-
    Which expression normalizes any integer shift into `0..25`?
  choices:
  - id: a
    text: '`((shift % 26) + 26) % 26`'
  - id: b
    text: '`shift / 26`'
  - id: c
    text: '`shift & 26`'
  - id: d
    text: '`26 - shift`'
  answer:
    choiceId: a
  explanation: |-
    The second modulo handles both large and negative inputs.
  id: q001
- sourceFamilyId: cpp-fsf-file-012
  skills:
  - trace-caesar-encryption
  type: multipleChoice
  prompt: |-
    With shift 3, what does `Az-z!` encrypt to?
  choices:
  - id: a
    text: '`Dc-c!`'
  - id: b
    text: '`Cz-b!`'
  - id: c
    text: '`Da-a!`'
  - id: d
    text: '`Dc-c$`'
  answer:
    choiceId: a
  explanation: |-
    Both cases wrap independently and punctuation remains unchanged.
  id: q002
- sourceFamilyId: cpp-fsf-file-012
  skills:
  - preserve-caesar-nonletters
  type: multipleChoice
  prompt: |-
    Which bytes should a letter-only Caesar cipher leave unchanged?
  choices:
  - id: a
    text: Digits, punctuation, whitespace, and line endings
  - id: b
    text: Lowercase letters
  - id: c
    text: Uppercase letters
  - id: d
    text: Only null bytes
  answer:
    choiceId: a
  explanation: |-
    The transform applies only to ASCII letter ranges.
  id: q003
- sourceFamilyId: cpp-fsf-file-012
  skills:
  - verify-caesar-file-output
  type: selectAll
  prompt: |-
    Which checks are required before reporting successful file encryption? Select all that apply.
  choices:
  - id: a
    text: The source did not enter `bad()`
  - id: b
    text: The destination remains healthy after flush
  - id: c
    text: The shift is positive
  - id: d
    text: The file contains at least one letter
  answer:
    choiceIds:
    - a
    - b
  explanation: |-
    I/O health determines success; zero/negative shifts and letter-free files remain valid.
  id: q004
- sourceFamilyId: cpp-fsf-file-012
  skills:
  - stream-caesar-files
  type: multipleChoice
  prompt: |-
    What memory advantage comes from transforming one byte at a time?
  choices:
  - id: a
    text: Auxiliary memory remains constant
  - id: b
    text: Time becomes constant
  - id: c
    text: The output needs no file
  - id: d
    text: Modulo is avoided
  answer:
    choiceId: a
  explanation: |-
    The algorithm does not retain the entire file.
  id: q005
- sourceFamilyId: cpp-fsf-file-013
  skills:
  - invert-caesar-shifts
  type: multipleChoice
  prompt: |-
    How is decryption related to encryption modulo 26?
  choices:
  - id: a
    text: Use the additive inverse of the encryption shift
  - id: b
    text: Use the same positive direction twice
  - id: c
    text: Reverse the file bytes
  - id: d
    text: Toggle letter case
  answer:
    choiceId: a
  explanation: |-
    Adding `-shift` modulo 26 undoes adding `shift`.
  id: q006
- sourceFamilyId: cpp-fsf-file-013
  skills:
  - avoid-negative-remainders
  type: multipleChoice
  prompt: |-
    Why normalize before applying a negative decryption shift in C++?
  choices:
  - id: a
    text: The `%` result can remain negative
  - id: b
    text: Modulo works only on strings
  - id: c
    text: Letters are unsigned
  - id: d
    text: It closes the stream
  answer:
    choiceId: a
  explanation: |-
    A negative remainder can produce a byte before the alphabet base.
  id: q007
- sourceFamilyId: cpp-fsf-file-013
  skills:
  - verify-caesar-round-trip
  type: multipleChoice
  prompt: |-
    Which property is the strongest basic verification?
  choices:
  - id: a
    text: Decrypting encrypted bytes with the same shift restores every original byte
  - id: b
    text: Encrypted size is nonzero
  - id: c
    text: Output contains uppercase letters
  - id: d
    text: The destination path differs in length
  answer:
    choiceId: a
  explanation: |-
    The round trip tests both wrap directions and preservation of nonletters.
  id: q008
- sourceFamilyId: cpp-fsf-file-013
  skills:
  - detect-wrong-caesar-key
  type: multipleChoice
  prompt: |-
    Text encrypted with shift 5 is decrypted with shift 4. What is expected for letters?
  choices:
  - id: a
    text: They remain shifted forward by 1
  - id: b
    text: They are fully restored
  - id: c
    text: They reverse order
  - id: d
    text: They all become `A`
  answer:
    choiceId: a
  explanation: |-
    Net transformation is +5 - 4 = +1 modulo 26.
  id: q009
- sourceFamilyId: cpp-fsf-file-013
  skills:
  - preserve-caesar-case
  type: multipleChoice
  prompt: |-
    How should encrypted lowercase input be decrypted?
  choices:
  - id: a
    text: Back to lowercase
  - id: b
    text: Always uppercase
  - id: c
    text: As punctuation
  - id: d
    text: Case is unspecified
  answer:
    choiceId: a
  explanation: |-
    Lowercase and uppercase alphabets are transformed in separate ranges.
  id: q010
- sourceFamilyId: cpp-fsf-file-014
  skills:
  - state-csv-dialect
  type: multipleChoice
  prompt: |-
    Why must the simple CSV task explicitly say quotes have no special meaning?
  choices:
  - id: a
    text: A full CSV parser must otherwise handle quoted commas and escaped quotes
  - id: b
    text: Quotes cannot be stored in strings
  - id: c
    text: Commas are whitespace
  - id: d
    text: It makes every row rectangular
  answer:
    choiceId: a
  explanation: |-
    The limitation prevents a naive comma split from claiming complete CSV support.
  id: q011
- sourceFamilyId: cpp-fsf-file-014
  skills:
  - preserve-empty-csv-fields
  type: multipleChoice
  prompt: |-
    How many fields are in the simple CSV row `a,,c,`?
  choices:
  - id: a
    text: '2'
  - id: b
    text: '3'
  - id: c
    text: '4'
  - id: d
    text: '5'
  answer:
    choiceId: c
  explanation: |-
    The adjacent commas create an empty middle field and the trailing comma creates an empty final field.
  id: q012
- sourceFamilyId: cpp-fsf-file-014
  skills:
  - compute-table-widths
  type: multipleChoice
  prompt: |-
    Why does aligned output require parsing all rows before rendering?
  choices:
  - id: a
    text: Each column width depends on the longest field anywhere in that column
  - id: b
    text: Output streams cannot write early
  - id: c
    text: Rows must be alphabetically sorted
  - id: d
    text: Commas have unknown byte values
  answer:
    choiceId: a
  explanation: |-
    A later field may increase the padding needed by earlier rows.
  id: q013
- sourceFamilyId: cpp-fsf-file-014
  skills:
  - understand-setw
  type: multipleChoice
  prompt: |-
    What is important about `std::setw` when printing several fields?
  choices:
  - id: a
    text: It applies only to the next formatted field
  - id: b
    text: It permanently changes every stream
  - id: c
    text: It changes the file encoding
  - id: d
    text: It removes empty strings
  answer:
    choiceId: a
  explanation: |-
    Width must be supplied again for each padded column.
  id: q014
- sourceFamilyId: cpp-fsf-file-014
  skills:
  - reject-ragged-csv
  type: multipleChoice
  prompt: |-
    What should the specified rectangular-table function do when one row has fewer fields?
  choices:
  - id: a
    text: Return `nullopt`
  - id: b
    text: Silently invent values
  - id: c
    text: Drop the row
  - id: d
    text: Merge it with the next row
  answer:
    choiceId: a
  explanation: |-
    Inconsistent column counts violate the declared input contract.
  id: q015
- sourceFamilyId: cpp-fsf-file-015
  skills:
  - validate-complete-number-tokens
  type: multipleChoice
  prompt: |-
    Why must parsing `12x` check how many characters `std::stod` consumed?
  choices:
  - id: a
    text: Without the check it may accept the numeric prefix 12
  - id: b
    text: It prevents all integers
  - id: c
    text: It converts the token to hexadecimal
  - id: d
    text: It detects file size
  answer:
    choiceId: a
  explanation: |-
    Complete-token validation rejects trailing junk.
  id: q016
- sourceFamilyId: cpp-fsf-file-015
  skills:
  - ignore-invalid-number-tokens
  type: multipleChoice
  prompt: |-
    What average results from `10 20 bad 30` when invalid tokens are ignored?
  choices:
  - id: a
    text: '15'
  - id: b
    text: '20'
  - id: c
    text: '30'
  - id: d
    text: No result
  answer:
    choiceId: b
  explanation: |-
    The three valid values sum to 60 and divide by a valid count of three.
  id: q017
- sourceFamilyId: cpp-fsf-file-015
  skills:
  - distinguish-zero-average
  type: multipleChoice
  prompt: |-
    Why return `optional<double>` rather than using zero for “no valid numbers”?
  choices:
  - id: a
    text: A legitimate collection can have average zero
  - id: b
    text: Zero is not a double
  - id: c
    text: Optional performs file I/O
  - id: d
    text: It rounds every value
  answer:
    choiceId: a
  explanation: |-
    Absence and a computed numeric zero are different outcomes.
  id: q018
- sourceFamilyId: cpp-fsf-file-015
  skills:
  - reduce-average-roundoff
  type: multipleChoice
  prompt: |-
    Why accumulate into `long double` before converting the final mean to `double`?
  choices:
  - id: a
    text: It can reduce intermediate rounding error
  - id: b
    text: It rejects negative values
  - id: c
    text: It makes parsing case-insensitive
  - id: d
    text: It counts tokens automatically
  answer:
    choiceId: a
  explanation: |-
    Wider intermediate precision can retain more information across many additions.
  id: q019
- sourceFamilyId: cpp-fsf-file-015
  skills:
  - handle-number-stream-failures
  type: multipleChoice
  prompt: |-
    After token extraction ends, which condition distinguishes an I/O failure from normal EOF?
  choices:
  - id: a
    text: '`input.bad()`'
  - id: b
    text: '`input.eof()`'
  - id: c
    text: '`count > 0`'
  - id: d
    text: '`token.empty()`'
  answer:
    choiceId: a
  explanation: |-
    Normal EOF is expected, whereas bad state reports a serious read error.
  id: q020
