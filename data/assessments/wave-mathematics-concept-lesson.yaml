  - id: s-wm-09
    title: Spatial, temporal, and phase shifts
    required: true
    content: Replacing $x$ by $x-x_0$ shifts a pattern right by $x_0$, while replacing $t$ by $t-t_0$ delays its time history. Both effects can be represented by the phase constant $\phi$, with the phase determined modulo $2\pi$. A boundary condition at a driven endpoint selects the phase and may also select the traveling direction. Always test a proposed shift by evaluating the function at the stated $x$ and $t$ rather than relying on a memorized sign.
