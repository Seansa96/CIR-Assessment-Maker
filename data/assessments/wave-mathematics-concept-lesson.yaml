lesson:
  introduction: This lesson develops Mathematics of Waves from a diagram, a mathematical model, and a
    calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      When a continuous harmonic oscillator drives a medium, it generates a sinusoidal wave. The physical picture is a series of continuous, periodic crests and troughs moving through space. Each particle in the medium undergoes simple harmonic motion as the wave passes.
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s1, type: multipleChoice, prompt: 'What does a harmonic oscillator generate in a medium?', choices: [{id: a, text: 'A sinusoidal wave'}, {id: b, text: 'A constant position'}, {id: c, text: 'A random phase'}, {id: d, text: 'No oscillation'}], answer: {choiceId: a}, explanation: 'This follows from the sinusoidal traveling-wave equation.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      To mathematically describe both spatial and temporal variation compactly, we define the wave number $k = \frac{2\pi}{\lambda}$ (in rad/m) and the angular frequency $\omega = \frac{2\pi}{T}$ (in rad/s).
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s2, type: multipleChoice, prompt: 'What defines wave number?', choices: [{id: a, text: '$k=2\pi/\lambda$'}, {id: b, text: 'A constant position'}, {id: c, text: 'A random phase'}, {id: d, text: 'No oscillation'}], answer: {choiceId: a}, explanation: 'This follows from the sinusoidal traveling-wave equation.'}
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model for a 1D sinusoidal wave traveling in the positive $x$-direction is $y(x,t) = A \sin(kx - \omega t + \phi)$, where $A$ is amplitude and $\phi$ is the initial phase constant. The argument $(kx - \omega t)$ tracks the phase of the wave.
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s3, type: multipleChoice, prompt: 'What models a positive-x sinusoidal wave?', choices: [{id: a, text: '$A\sin(kx-\omega t+\phi)$'}, {id: b, text: 'A constant position'}, {id: c, text: 'A random phase'}, {id: d, text: 'No oscillation'}], answer: {choiceId: a}, explanation: 'This follows from the sinusoidal traveling-wave equation.'}
  - id: s4
    title: Calculus connection
    content: >-
      Using calculus, the transverse velocity of a particle in the medium is $v_y = \frac{\partial y}{\partial t} = -\omega A \cos(kx - \omega t + \phi)$. The transverse acceleration is $a_y = \frac{\partial^2 y}{\partial t^2} = -\omega^2 y$. Note that transverse particle speed $v_y$ is distinct from the wave propagation speed $v$.
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s4, type: multipleChoice, prompt: 'What is transverse particle velocity?', choices: [{id: a, text: '$-\omega A\cos(\cdots)$'}, {id: b, text: 'A constant position'}, {id: c, text: 'A random phase'}, {id: d, text: 'No oscillation'}], answer: {choiceId: a}, explanation: 'This follows from the sinusoidal traveling-wave equation.'}
  - id: s5
    title: Derivation or justification
    content: >-
      To find the wave propagation speed $v$, we track a point of constant phase (like a crest). If $kx - \omega t = \text{constant}$, we take the time derivative: $k \frac{dx}{dt} - \omega = 0$. Since $v = \frac{dx}{dt}$, we derive $v = \frac{\omega}{k}$. This exactly matches $v = \frac{2\pi f}{2\pi / \lambda} = f\lambda$.
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s5, type: multipleChoice, prompt: 'What is phase propagation speed?', choices: [{id: a, text: '$v=\omega/k$'}, {id: b, text: 'A constant position'}, {id: c, text: 'A random phase'}, {id: d, text: 'No oscillation'}], answer: {choiceId: a}, explanation: 'This follows from the sinusoidal traveling-wave equation.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, the function $y(x,t)$ is a surface in 3D $(x, t, y)$ space. Slicing it at a constant $t$ gives a sine wave in $x$ with spatial period $\lambda$. Slicing it at a constant $x$ gives a sine wave in $t$ with temporal period $T$.
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s6, type: multipleChoice, prompt: 'How can a wave surface be sliced?', choices: [{id: a, text: 'Spatial and temporal sine slices'}, {id: b, text: 'A constant position'}, {id: c, text: 'A random phase'}, {id: d, text: 'No oscillation'}], answer: {choiceId: a}, explanation: 'This follows from the sinusoidal traveling-wave equation.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A standard quantitative strategy is pattern matching. Given an equation like $y = 0.5 \sin(3x - 12t)$, directly read off the amplitude ($0.5$ m), wave number ($k = 3$ rad/m), and angular frequency ($\omega = 12$ rad/s), then calculate $\lambda = 2\pi/3$ and $v = 12/3 = 4$ m/s.
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s7, type: multipleChoice, prompt: 'What parameters can be read from a wave equation?', choices: [{id: a, text: 'Read A, k, and omega'}, {id: b, text: 'A constant position'}, {id: c, text: 'A random phase'}, {id: d, text: 'No oscillation'}], answer: {choiceId: a}, explanation: 'This follows from the sinusoidal traveling-wave equation.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: The negative sign in $(kx - \omega t)$ dictates motion in the $+x$ direction. A positive sign $(kx + \omega t)$ dictates motion in the $-x$ direction. The dimensions check out: $kx$ is $(\text{rad/m})\cdot\text{m} = \text{rad}$, and $\omega t$ is $(\text{rad/s})\cdot\text{s} = \text{rad}$.
    media:
    - type: image
      src: /media/physics/owa/wave-mathematics.svg
      alt: Labeled original schematic for Mathematics of Waves used for quantitative analysis.
      caption: Mathematics of Waves model diagram.
    check: {id: wm-s8, type: multipleChoice, prompt: 'Which sign indicates motion in the positive x direction?', choices: [{id: a, text: '$kx-\omega t$'}, {id: b, text: '$kx+\omega t$'}, {id: c, text: '$\omega/k$'}, {id: d, text: '$A^2$'}], answer: {choiceId: a}, explanation: 'A constant phase in $kx-\omega t$ moves toward increasing x.'}
