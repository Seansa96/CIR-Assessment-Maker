  - id: s-wm-03
    title: Constructing the wave number $k$
    required: true
    content: A sinusoidal cycle advances through $2\pi$ radians while the pattern advances one wavelength. Dividing phase change by distance gives $k=2\pi/\lambda$, measured in radians per meter. Similarly, temporal phase advances by $2\pi$ every period, so $\omega=2\pi/T=2\pi f$ in radians per second. At $t=0$, a right-moving sinusoid can be written $y(x)=A\sin(kx)$, and $kx$ is dimensionless because radians are the phase unit.
