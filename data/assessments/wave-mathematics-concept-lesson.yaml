  - id: s-wm-07
    title: Second partial derivatives and the linear wave equation
    required: true
    content: 'For $y=A\sin(kx-\omega t+\phi)$, two spatial derivatives produce $\partial^2y/\partial x^2=-k^2y$, while two time derivatives produce $\partial^2y/\partial t^2=-\omega^2y$. Eliminating the common displacement gives $\partial^2y/\partial x^2=(k^2/\omega^2)\partial^2y/\partial t^2=(1/v^2)\partial^2y/\partial t^2$ with $v=\omega/k$. The equation is linear because sums of solutions remain solutions. Crucially, sinusoidal waves are not the only solutions: any twice-differentiable $f(x\pm vt)$ satisfies the same PDE.'
