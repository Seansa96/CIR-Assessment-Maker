  - id: s-wm-02
    title: Snapshot and history graphs
    required: true
    content: A snapshot graph plots displacement $y$ against position $x$ at one fixed time, so one repeated crest-to-crest distance is $\lambda$. A history graph plots $y$ against time at one fixed position, so one full repeat is the period $T$. The amplitude is the distance from equilibrium to a crest on either graph. Linking the views, a pattern moves a distance $v\Delta t$ during a time interval, which gives $v=\lambda/T$.
