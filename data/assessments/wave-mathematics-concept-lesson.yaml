  - id: s-wm-08
    title: General traveling-wave form and constant-phase reasoning
    required: true
    content: Let $y=f(x-vt)$. If $f_1$ and $f_2$ denote the first and second derivatives of the profile function, the chain rule gives $y_x=f_1$, $y_t=-vf_1$, $y_{xx}=f_2$, and $y_{tt}=v^2f_2$, so the wave equation follows identically. Holding a phase value $kx-\omega t=C$ gives $dx/dt=\omega/k$, a second route to the propagation speed. A cosine is not a different kind of wave from a sine; it is the same family with a phase offset. Initial conditions select the offset and direction, while the general traveling-wave form allows non-sinusoidal pulses.
    media:
    - type: image
      src: /media/physics/owa/wave-pde-verification.svg
      alt: Original translating profile illustrating the general f of x minus vt solution family.
      caption: 
