  - id: s-wm-05
    title: Reading parameters from a wave function
    required: true
    content: Read amplitude from the coefficient outside the sinusoid, $k$ from the coefficient of $x$, and $\omega$ from the coefficient of $t$. Then compute $\lambda=2\pi/k$, $T=2\pi/\omega$, $f=\omega/(2\pi)$, and $v=\omega/k$. A constant inside the phase is $\phi$ and is measured in radians. For example, $0.12\sin(4x-24t+\pi/6)$ has amplitude $0.12\,\text{m}$, $k=4\,\text{rad/m}$, $\omega=24\,\text{rad/s}$, $\lambda=\pi/2\,\text{m}$, $T=\pi/12\,\text{s}$, $f=12/\pi\,\text{Hz}$, $v=6\,\text{m/s}$, and phase $\pi/6$.
