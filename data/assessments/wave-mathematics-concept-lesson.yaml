  - id: s-wm-06
    title: 'First partial derivatives: transverse velocity and acceleration'
    required: true
    content: At a fixed location $x$, differentiate the displacement with respect to time to obtain the transverse particle velocity $v_y=\partial y/\partial t=-A\omega\cos(kx-\omega t+\phi)$. The cosine appears because differentiating sine shifts phase by a quarter cycle, so velocity is in quadrature with displacement. Differentiating once more gives $a_y=\partial^2y/\partial t^2=-A\omega^2\sin(\cdots)=-\omega^2y$, the signature of simple harmonic motion. This particle velocity is not the propagation speed $v$ of the wave pattern; their maxima are $A\omega$ and $v$ is determined by $\omega/k$.
