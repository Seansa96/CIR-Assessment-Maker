lesson:
  introduction: This lesson develops the linear wave equation from physical wave descriptions through sinusoidal parameters, phase, partial derivatives, general traveling-wave solutions, and verification.
  sections:
  - id: s-wm-01
    title: Physical setup and wave types
    required: true
    content: A mechanical wave is a disturbance whose pattern travels through a material medium; an electromagnetic wave is an oscillation of fields that can travel through vacuum. In a transverse wave, the medium oscillates perpendicular to the direction of propagation, while in a longitudinal wave the oscillation is parallel. The equilibrium position is the undisturbed location, and amplitude $A$ is the maximum displacement from it. Wavelength $\lambda$ is the spatial repeat distance, period $T$ is the time for one cycle, frequency is $f=1/T$, and propagation speed is $v=f\lambda$ in meters per second.
