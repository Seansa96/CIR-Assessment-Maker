  - id: s-wm-04
    title: The full sinusoidal wave function
    required: true
    content: For a sinusoidal pattern traveling in the positive $x$ direction, use $y=A\sin(kx-\omega t+\phi)$. A plus sign before $\omega t$ gives negative-$x$ travel. The phase $\Phi=kx-\omega t+\phi$ is the argument that identifies the state of the cycle, and $\phi$ sets the initial state at the origin. Sine and cosine describe the same oscillation with a quarter-cycle phase offset because $\cos\theta=\sin(\theta+\pi/2)$.
