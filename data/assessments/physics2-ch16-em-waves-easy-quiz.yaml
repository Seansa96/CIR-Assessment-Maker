- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: Which of Maxwell's Equations asserts that there are no magnetic monopoles?
  explanation: 'Solution:

    Gauss''s Law for Magnetism states that $\oint \vec{B} \cdot d\vec{A} = 0$.


    Why it works:

    This equation implies that magnetic field lines never start or end; they form continuous loops, so isolated
    magnetic charges (monopoles) do not exist.

    Why the other choices fail: Faraday relates E to changing B. Ampere relates B to current and changing E. Gauss
    for E relates E to electric charge.'
  choices:
  - id: a
    text: Gauss's Law for Magnetism
  - id: b
    text: Faraday's Law
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Ampere-Maxwell Law
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Gauss's Law for Electricity
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
