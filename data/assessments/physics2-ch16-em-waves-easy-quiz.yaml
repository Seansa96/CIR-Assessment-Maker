  prompt: Which of Maxwell's Equations asserts that there are no magnetic monopoles?
  options:
  - id: a
    text: Gauss's Law for Magnetism
    isCorrect: true
  - id: b
    text: Faraday's Law
    isCorrect: false
  - id: c
    text: Ampere-Maxwell Law
    isCorrect: false
  - id: d
    text: Gauss's Law for Electricity
    isCorrect: false
  explanation: 'Solution:

    Gauss''s Law for Magnetism states that $\oint \vec{B} \cdot d\vec{A} = 0$.


    Why it works:

    This equation implies that magnetic field lines never start or end; they form
    continuous loops, so isolated magnetic charges (monopoles) do not exist.

    Why the other choices fail: Faraday relates E to changing B. Ampere relates B
    to current and changing E. Gauss for E relates E to electric charge.'
