lesson:
  introduction: >
    This lesson develops a repeatable way to solve Energy in a Magnetic Field problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch14-magnetic-energy-s1
    title: Name the model and quantities
    required: true
    content: >
      Energy in a Magnetic Field uses U = 1/2 L I^2. In the name the model and quantities stage, calculate stored energy from inductance and current, then compare how doubling current changes it.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Energy in a Magnetic Field problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch14-magnetic-energy-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Energy in a Magnetic Field, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use U = 1/2 L I^2 after you calculate stored energy from inductance and current, then compare how doubling current changes it.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Energy in a Magnetic Field problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-magnetic-energy-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables U = 1/2 L I^2 relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-magnetic-energy-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Energy in a Magnetic Field.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-magnetic-energy-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Energy in a Magnetic Field, first calculate stored energy from inductance and current, then compare how doubling current changes it. Then apply U = 1/2 L I^2 with one consistent coordinate system and solve for the requested quantity.


        Why it works: U = 1/2 L I^2 connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
