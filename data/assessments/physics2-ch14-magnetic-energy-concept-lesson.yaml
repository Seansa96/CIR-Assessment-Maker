id: physics2-ch14-magnetic-energy-concept-lesson
title: Energy in a Magnetic Field
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-inductance
workedExamples:
- id: l2-sec1
  title: Stored Energy
  explanation: 'Establishing a current in an inductor requires work against the induced
    EMF. This work is stored as potential energy in the magnetic field: $U = \frac{1}{2}
    L i^2$.'
- id: l2-sec2
  title: Energy Density
  explanation: The energy density (energy per unit volume) of a magnetic field is
    $u_B = \frac{B^2}{2\mu_0}$.
