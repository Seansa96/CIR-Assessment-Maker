- id: q004
  title: Explain Page fault
  type: freeResponse
  prompt: 'In a short answer, explain why **Page fault** matters in Virtual Memory.

    '
  answer:
    expected: 'A page fault occurs when a needed virtual page is not currently accessible as required. A complete answer should
      also note that the OS must determine whether the access is valid before loading data.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Page fault
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Virtual Memory. The key is to connect the term to what the OS controls or protects.

    '
