questions:
- id: q001
  title: Recognize Paging
  type: multipleChoice
  prompt: 'Which statement best describes **Paging** in operating systems?

    '
  choices:
  - id: a
    text: Paging divides virtual and physical memory into fixed-size units so pages can be mapped independently.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'Paging divides virtual and physical memory into fixed-size units so pages can be mapped independently. The
    distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
