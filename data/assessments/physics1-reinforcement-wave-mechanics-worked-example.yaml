workedExamples:
- id: reinforcement-wave-we1
  title: Read a traveling wave
  problem: A wave is described by $y(x,t)=0.020\sin(4\pi x-80\pi t)$, with SI units.
  steps:
  - id: reinforcement-wave-we1-s1
    title: Determine propagation direction
    instruction: Inspect the sign between the space and time phase terms.
    hint: A form $f(x-vt)$ travels toward positive $x$.
    type: multipleChoice
    prompt: In which direction does the wave travel?
    choices:
    - { id: a, text: 'Toward positive $x$' }
    - { id: b, text: 'Toward negative $x$', issueSignals: [{ id: physics1-wave-direction-sign, domains: [physics-1] }] }
    - { id: c, text: 'It is a standing wave', issueSignals: [{ id: physics1-wave-standing-misread, domains: [physics-1] }] }
    - { id: d, text: 'It does not propagate because the amplitude is fixed', issueSignals: [{ id: physics1-wave-amplitude-direction, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: The phase is $4\pi(x-20t)$, so the wave travels toward positive $x$. Why it works: Constant phase requires $x-20t$ to remain fixed. Why the other choices fail: A plus sign gives negative travel, and a single traveling-wave phase is not a standing wave.'
  - id: reinforcement-wave-we1-s2
    title: Calculate speed and wavelength
    instruction: Extract $k$ and $\omega$, then use $v=\omega/k$ and $\lambda=2\pi/k$.
    hint: Here $k=4\pi$ and $\omega=80\pi$.
    type: multipleChoice
    prompt: Which pair is correct?
    choices:
    - { id: a, text: '$v=20\,\mathrm{m/s}$ and $\lambda=0.50\,\mathrm m$' }
    - { id: b, text: '$v=320\pi^2\,\mathrm{m/s}$ and $\lambda=4\pi\,\mathrm m$', issueSignals: [{ id: physics1-wave-coefficient-misuse, domains: [physics-1] }] }
    - { id: c, text: '$v=0.05\,\mathrm{m/s}$ and $\lambda=2\,\mathrm m$', issueSignals: [{ id: physics1-wave-ratio-inversion, domains: [physics-1] }] }
    - { id: d, text: '$v=80\pi\,\mathrm{m/s}$ and $\lambda=4\pi\,\mathrm m$', issueSignals: [{ id: physics1-wave-wavenumber-omission, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $v=\omega/k=20\,\mathrm{m/s}$ and $\lambda=2\pi/(4\pi)=0.50\,\mathrm m$. Why it works: The spatial coefficient sets wavelength while the ratio of temporal to spatial coefficients sets speed. Why the other choices fail: misuse coefficients or invert the ratio.'
- id: reinforcement-wave-we2
  title: Fixed-end standing wave
  problem: A string of length $L=1.20\,\mathrm m$ is fixed at both ends and supports its fundamental mode.
  steps:
  - id: reinforcement-wave-we2-s1
    title: Apply the boundary condition
    instruction: Place nodes at both fixed ends and identify the fundamental shape.
    hint: The fundamental has one half-wavelength across the string.
    type: multipleChoice
    prompt: Which wavelength satisfies the fundamental boundary condition?
    choices:
    - { id: a, text: '$\lambda=2L=2.40\,\mathrm m$' }
    - { id: b, text: '$\lambda=L=1.20\,\mathrm m$', issueSignals: [{ id: physics1-wave-fundamental-halfwave, domains: [physics-1] }] }
    - { id: c, text: '$\lambda=4L=4.80\,\mathrm m$', issueSignals: [{ id: physics1-wave-fundamental-factor, domains: [physics-1] }] }
    - { id: d, text: '$\lambda=L/2=0.60\,\mathrm m$', issueSignals: [{ id: physics1-wave-fundamental-mode-order, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: The fundamental fits half a wavelength in $L$, so $L=\lambda/2$ and $\lambda=2L$. Why it works: Nodes occur at both ends of the single arch. Why the other choices fail: place the wrong number of half-wavelengths in the string.'
  - id: reinforcement-wave-we2-s2
    title: Find the fundamental frequency
    instruction: Use the wave speed and the fundamental wavelength.
    hint: Take the string wave speed to be $v=60\,\mathrm{m/s}$.
    type: multipleChoice
    prompt: What is the fundamental frequency?
    choices:
    - { id: a, text: '$25\,\mathrm{Hz}$' }
    - { id: b, text: '$50\,\mathrm{Hz}$', issueSignals: [{ id: physics1-wave-frequency-length-error, domains: [physics-1] }] }
    - { id: c, text: '$72\,\mathrm{Hz}$', issueSignals: [{ id: physics1-wave-frequency-product-error, domains: [physics-1] }] }
    - { id: d, text: '$0.020\,\mathrm{Hz}$', issueSignals: [{ id: physics1-wave-frequency-inversion, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $f=v/\lambda=60/2.40=25\,\mathrm{Hz}$. Why it works: The wave completes one cycle over its wavelength in the time set by the speed. Why the other choices fail: use $L$ incorrectly, multiply instead of divide, or invert the physical ratio.'
