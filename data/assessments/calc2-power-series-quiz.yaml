questions:
- id: q001
  type: numericResponse
  prompt: 'Find the Radius of Convergence $R$ for the power series $\sum_{n=1}^\infty
    \frac{x^n}{n!}$.

    *(Enter 9999 if the radius is infinity)*

    '
  answer:
    value: 9999
    tolerance: 0.1
  explanation: '$L = \lim \left| \frac{x^{n+1}}{(n+1)!} \cdot \frac{n!}{x^n} \right|
    = \lim \left| \frac{x}{n+1} \right| = 0$.

    Since $L = 0$ for ANY value of $x$, it is always less than 1. Thus, the series
    converges for all real numbers. $R = \infty$.

    '
- id: q002
  type: numericResponse
  prompt: 'Find the Radius of Convergence $R$ for the power series $\sum_{n=1}^\infty
    n! x^n$.

    *(Enter 9999 if the radius is infinity)*

    '
  answer:
    value: 0
    tolerance: 0.01
  explanation: '$L = \lim \left| \frac{(n+1)! x^{n+1}}{n! x^n} \right| = \lim |(n+1)x|
    = \infty$ (unless $x=0$).

    Since it only converges when $x=0$, the radius is 0.

    '
- id: q003
  type: multipleChoice
  prompt: 'Find the interval of convergence for $\sum_{n=1}^\infty \frac{(x-2)^n}{3^n
    \sqrt{n}}$.

    '
  choices:
  - id: a
    text: $[-1, 5)$
  - id: b
    text: $(-1, 5)$
  - id: c
    text: $[-1, 5]$
  - id: d
    text: $(-1, 5]$
  answer:
    choiceId: a
  explanation: 'Ratio Test: $\lim \left| \frac{(x-2)^{n+1}}{3^{n+1}\sqrt{n+1}} \cdot
    \frac{3^n\sqrt{n}}{(x-2)^n} \right| = \left| \frac{x-2}{3} \right|$.

    Require $|x-2| < 3 \implies -3 < x-2 < 3 \implies -1 < x < 5$.

    Test $x=5$: $\sum \frac{3^n}{3^n\sqrt{n}} = \sum \frac{1}{\sqrt{n}}$ (p-series
    $p=1/2$, diverges).

    Test $x=-1$: $\sum \frac{(-3)^n}{3^n\sqrt{n}} = \sum \frac{(-1)^n}{\sqrt{n}}$
    (AST, converges).

    Interval is $[-1, 5)$.

    '
- id: q004
  type: multipleChoice
  prompt: 'Write the function $f(x) = \frac{x^2}{1+x}$ as a power series.

    '
  choices:
  - id: a
    text: $\sum_{n=0}^\infty (-1)^n x^{n+2}$
  - id: b
    text: $\sum_{n=0}^\infty x^{n+2}$
  - id: c
    text: $\sum_{n=0}^\infty (-1)^n x^{2n}$
  - id: d
    text: $\sum_{n=0}^\infty (-1)^n x^{n+1}$
  answer:
    choiceId: a
  explanation: '$f(x) = x^2 \cdot \frac{1}{1 - (-x)}$.

    The fraction is a geometric series with $a=1, r=-x$: $\sum (-x)^n = \sum (-1)^n
    x^n$.

    Multiply by $x^2$: $x^2 \sum (-1)^n x^n = \sum (-1)^n x^{n+2}$.

    '
- id: q005
  type: multipleChoice
  prompt: 'If $\frac{1}{1-x} = \sum_{n=0}^\infty x^n$ for $|x| < 1$, what is the power
    series for $\ln(1-x)$?

    *(Hint: Integrate both sides).*

    '
  choices:
  - id: a
    text: $-\sum_{n=0}^\infty \frac{x^{n+1}}{n+1}$
  - id: b
    text: $\sum_{n=0}^\infty \frac{x^{n+1}}{n+1}$
  - id: c
    text: $-\sum_{n=0}^\infty n x^{n-1}$
  - id: d
    text: $\sum_{n=0}^\infty (-1)^n \frac{x^{n+1}}{n+1}$
  answer:
    choiceId: a
  explanation: '$\int \frac{1}{1-x} dx = -\ln(1-x)$.

    Integrate the right side: $\int (\sum x^n) dx = \sum \frac{x^{n+1}}{n+1}$.

    So $-\ln(1-x) = \sum \frac{x^{n+1}}{n+1} \implies \ln(1-x) = -\sum \frac{x^{n+1}}{n+1}$.

    '
