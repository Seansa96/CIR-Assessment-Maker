  type: numericResponse
  skills:
  - power-series
  blueprintId: calc2-power-series-radius-interval
  prompt: Find the radius of convergence for the series $\sum_{n=1}^{\infty} \frac{x^n}{n!}$.
  answer:
    value: 999.0
    tolerance: 1.0
  explanation: Wait, e^x has infinite radius.
