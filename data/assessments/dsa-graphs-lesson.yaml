questions:
  - id: intro-graphs
    type: freeResponse
    prompt: |
      **Vertices and Edges**

      A **Graph** is the most general data structure we've seen. While a Tree is limited to a strict parent-child hierarchy with no cycles, a Graph has no such limits. It is a collection of **Vertices** (or nodes) connected by **Edges** (lines).
      
      Graphs are used to model real-world networks: social networks (people and friendships), road networks (cities and highways), or computer networks (routers and cables).
      
      Edges can be **directed** (like a one-way street, or a Twitter follow) or **undirected** (like a two-way street, or a Facebook friendship). They can also be **weighted** (having a cost, like the distance in miles between cities).

      One common way to represent a graph in code is using an **Adjacency List**. In Python, this is typically a dictionary where each key is a vertex, and the value is a list of its neighboring vertices.

      If you have an *undirected* graph where Vertex A is connected to Vertex B, and you represent it using an Adjacency List dictionary, what must be true about the lists for both `A` and `B`?
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution:
      The list for `A` must contain `B`, and the list for `B` must contain `A`.

      Why it works:
      Because the edge is undirected, the relationship goes both ways. In an adjacency list representation, an undirected edge requires two entries: one showing that A can reach B, and one showing that B can reach A.
