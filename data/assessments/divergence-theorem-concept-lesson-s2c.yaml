  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Triple Integrals if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Closed-surface flux becomes volume accumulation
    required: true
    content: 'The Divergence Theorem relates outward flux through a closed surface to a triple integral of divergence. In The Divergence Theorem, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
