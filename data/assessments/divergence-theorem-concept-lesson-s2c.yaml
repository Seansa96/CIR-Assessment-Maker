  - id: s02
    title: Outward is the positive convention
    required: true
    content: The theorem requires the boundary surface of a solid with its outward orientation. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
