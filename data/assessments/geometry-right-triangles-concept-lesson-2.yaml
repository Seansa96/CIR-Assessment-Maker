lesson:
  introduction: |-
    While the Pythagorean Theorem works for all right triangles, there are two specific types of right triangles that appear so frequently in geometry and trigonometry that we memorize their side ratios. These are called **Special Right Triangles**.
  sections:
  - id: sec-45-45-90
    title: 45-45-90 Triangles
    required: true
    content: |-
      A **45-45-90 triangle** is an isosceles right triangle. It is formed by cutting a square in half along its diagonal.
      
      Because the base angles are equal ($45^\circ$), the two legs are equal in length. Let's call the length of each leg $x$.
      Using the Pythagorean Theorem: $x^2 + x^2 = \text{hypotenuse}^2 \implies 2x^2 = h^2 \implies h = x\sqrt{2}$.
      
      **The Rule**: In a $45^\circ-45^\circ-90^\circ$ triangle, the ratio of the side lengths is:
      $$x : x : x\sqrt{2}$$
      (Leg : Leg : Hypotenuse)

  - id: sec-30-60-90
    title: 30-60-90 Triangles
    required: true
    content: |-
      A **30-60-90 triangle** is formed by cutting an equilateral triangle in half along its altitude.
      
      If the short leg (across from the $30^\circ$ angle) has length $x$, then the hypotenuse (which is the original side length of the equilateral triangle) is twice as long: $2x$.
      Using the Pythagorean Theorem to find the long leg ($L$): $x^2 + L^2 = (2x)^2 \implies L^2 = 4x^2 - x^2 = 3x^2 \implies L = x\sqrt{3}$.
      
      **The Rule**: In a $30^\circ-60^\circ-90^\circ$ triangle, the ratio of the side lengths is:
      $$x : x\sqrt{3} : 2x$$
      (Short Leg : Long Leg : Hypotenuse)

questions:
- id: q-geom-rt2-1
  title: Concept Check - 45-45-90 Triangle
  prompt: |-
    The diagonal of a square is $10\sqrt{2}$ units long. What is the length of one side of the square?
  type: numericResponse
  answer:
    numericValue: 10
    tolerance: 0
  explanation: |-
    The diagonal of a square forms two 45-45-90 triangles. The diagonal is the hypotenuse. The hypotenuse is $x\sqrt{2}$. If the hypotenuse is $10\sqrt{2}$, then the leg $x$ (the side of the square) must be $10$.
  skills:
  - geometry-right-triangles

- id: q-geom-rt2-2
  title: Concept Check - 30-60-90 Triangle
  prompt: |-
    In a 30-60-90 triangle, the hypotenuse is 12 units long. What is the length of the short leg (the side opposite the $30^\circ$ angle)?
  type: numericResponse
  answer:
    numericValue: 6
    tolerance: 0
  explanation: |-
    The ratio of the short leg to the hypotenuse is $x : 2x$. If the hypotenuse ($2x$) is 12, then the short leg ($x$) must be $12 / 2 = 6$.
  skills:
  - geometry-right-triangles
