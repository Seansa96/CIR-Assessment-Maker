schemaVersion: 1
id: linear-algebra-eigenvalues-recall
title: Eigenvalues and Eigenvectors Recall Drill
assessmentType: recallDrill
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-eigenvalues-eigenvectors
modeDefault: practice
randomizeQuestions: true
skills:
  - eigenvalues
  - eigenvectors
  - characteristic-equation
  - eigenspace
items:
  - id: r-eigen-def
    type: flashcard
    prompt: |
      State the algebraic definition of an eigenvector and an eigenvalue.
    answer:
      expected: |
        An eigenvector of an $n \times n$ matrix $A$ is a nonzero vector $\vec{x}$ such that $A\vec{x} = \lambda\vec{x}$ for some scalar $\lambda$. The scalar $\lambda$ is called an eigenvalue.

  - id: r-eigenvector-nonzero
    type: cloze
    prompt: |
      By definition, an eigenvector must be a {{nonzero}} vector.
    answer:
      expected: 'nonzero'

  - id: r-char-eq-def
    type: flashcard
    prompt: |
      What is the characteristic equation of a matrix $A$?
    answer:
      expected: '$\det(A - \lambda I) = 0$'

  - id: r-eigenspace-def
    type: flashcard
    prompt: |
      What is the eigenspace of a matrix $A$ corresponding to an eigenvalue $\lambda$?
    answer:
      expected: |
        The eigenspace is the set of all solutions to $(A - \lambda I)\vec{x} = \vec{0}$, which is exactly $\text{Nul}(A - \lambda I)$. It consists of the zero vector and all eigenvectors corresponding to $\lambda$.

  - id: r-triangular-eigenvalues
    type: flashcard
    prompt: |
      How do you find the eigenvalues of a triangular matrix (upper, lower, or diagonal)?
    answer:
      expected: 'The eigenvalues are simply the entries on its main diagonal.'

  - id: r-zero-eigenvalue
    type: flashcard
    prompt: |
      What does it mean if $\lambda = 0$ is an eigenvalue of $A$?
    answer:
      expected: |
        It means there is a nonzero vector $\vec{x}$ such that $A\vec{x} = \vec{0}$. This means $\text{Nul}(A)$ is nontrivial, so the matrix $A$ is **not invertible**.

  - id: r-invertibility-det-lambda
    type: cloze
    prompt: |
      To find eigenvalues, we set $\det(A - \lambda I) = 0$ because we want the matrix $(A - \lambda I)$ to be {{not invertible}}.
    answer:
      expected: 'not invertible'
