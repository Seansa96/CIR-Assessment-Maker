  type: symbolicResponse
  prompt: |
    Three identical masses $m$ are placed at the vertices of an equilateral triangle of side length $a$. 
    
    What is the magnitude of the net gravitational force on any one of the masses due to the other two? Express your answer in terms of $G$, $m$, and $a$.
  answer:
    expectedLatex: '\sqrt{3} \frac{G m^2}{a^2}'
    equivalenceMode: expression
    variables:
      - G
      - m
      - a
    tolerance: 0.0001
  explanation: |
    Solution:
    Let's find the force on the top mass. The other two masses exert gravitational forces on it along the sides of the triangle.
    The magnitude of the force from each of the other two masses is $F = G \frac{m^2}{a^2}$.
    
    Why it works:
    These two force vectors are separated by an angle of $60^\circ$ (the interior angle of the equilateral triangle). 
    We can add them using vector superposition. By symmetry, the horizontal components cancel out, and the vertical components add up.
    Alternatively, use the law of cosines for vector addition:
    $$ F_{\text{net}} = \sqrt{F^2 + F^2 + 2(F)(F) \cos(60^\circ)} $$
    $$ F_{\text{net}} = \sqrt{2F^2 + 2F^2 (0.5)} = \sqrt{3F^2} = \sqrt{3} F $$
    
    Substitute $F$ back in:
    $$ F_{\text{net}} = \sqrt{3} \frac{G m^2}{a^2} $$
