questions:
- id: q-work-energy-variable
  title: Work from a Variable Force
  type: symbolicResponse
  prompt: "A $2.0\\text{ kg}$ object moving in 1D experiences a net force $F(v) = -k v$, where $k = 4.0\\text{ N}\\cdot\\text{s/m}$. \nCalculate the net work (in Joules) done on the object as it slows from $5.0\\text{ m/s}$ to $2.0\\text{ m/s}$.\n"
  answer:
    gradingMode: auto
    expectedLatex: -21
    equivalenceMode: expression
    tolerance: 0.1
  explanation: "By the universal work-energy theorem, $W_{\\text{net}} = \\Delta K = \\frac{1}{2}m v_f^2 - \\frac{1}{2}m v_i^2$. \n$W_{\\text{net}} = \\frac{1}{2}(2.0)(2.0)^2 - \\frac{1}{2}(2.0)(5.0)^2 = 4.0 - 25.0 = -21\\text{ J}$. \n(We don't need to integrate the force expression if we already know initial and final speeds!).\n"
