questions:
- id: q-work-energy-variable
  title: Work from a Variable Force
  type: symbolicResponse
  prompt: |
    A $2.0\text{ kg}$ object moving in 1D experiences a net force $F(v) = -k v$, where $k = 4.0\text{ N}\cdot\text{s/m}$. 
    Calculate the net work (in Joules) done on the object as it slows from $5.0\text{ m/s}$ to $2.0\text{ m/s}$.
  answer:
    gradingMode: auto
    expectedLatex: -21
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    By the universal work-energy theorem, $W_{\text{net}} = \Delta K = \frac{1}{2}m v_f^2 - \frac{1}{2}m v_i^2$. 
    $W_{\text{net}} = \frac{1}{2}(2.0)(2.0)^2 - \frac{1}{2}(2.0)(5.0)^2 = 4.0 - 25.0 = -21\text{ J}$. 
    (We don't need to integrate the force expression if we already know initial and final speeds!).
  skills:
  - physics-work-energy
- id: q-work-energy-constant-force
  title: Final Speed from Constant Force
  type: symbolicResponse
  prompt: |
    A horizontal force of $15\text{ N}$ pushes a $3.0\text{ kg}$ block across a frictionless horizontal surface for a distance of $4.0\text{ m}$. If the block starts from rest, what is its final speed (in m/s)?
  answer:
    gradingMode: auto
    expectedLatex: \sqrt{40}
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    First, find the work done by the net force (which is just the applied force, since there's no friction): 
    $W_{\text{net}} = F \cdot d = (15)(4.0) = 60\text{ J}$.
    By the Work-Energy Theorem, $W_{\text{net}} = \Delta K = K_f - K_i$.
    Since it starts from rest, $K_i = 0$, so $K_f = 60\text{ J}$.
    $\frac{1}{2} m v_f^2 = 60 \implies \frac{1}{2}(3.0) v_f^2 = 60 \implies 1.5 v_f^2 = 60 \implies v_f^2 = 40$.
    $v_f = \sqrt{40} \approx 6.32\text{ m/s}$.
  skills:
  - physics-work-energy
- id: q-work-energy-stopping-force
  title: Average Stopping Force
  type: symbolicResponse
  prompt: |
    A $1200\text{ kg}$ car traveling at $20\text{ m/s}$ slams on its brakes and skids to a stop over a distance of $50\text{ m}$. What is the magnitude of the average braking force (in Newtons) exerted on the car?
  answer:
    gradingMode: auto
    expectedLatex: 4800
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Find the initial kinetic energy: $K_i = \frac{1}{2} m v_i^2 = \frac{1}{2}(1200)(20)^2 = 600(400) = 240,000\text{ J}$.
    The final kinetic energy is $K_f = 0\text{ J}$.
    The change in kinetic energy is $\Delta K = -240,000\text{ J}$.
    By the Work-Energy Theorem, $W_{\text{net}} = \Delta K \implies F_{\text{avg}} d = -240,000$.
    Since the force opposes motion, $W = -F_{\text{avg}} d$.
    $-F_{\text{avg}} (50) = -240,000 \implies F_{\text{avg}} = 4800\text{ N}$.
  skills:
  - physics-work-energy
