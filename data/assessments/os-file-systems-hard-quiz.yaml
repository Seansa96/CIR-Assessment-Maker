questions:
- id: q001
  title: Apply File abstraction
  type: multipleChoice
  prompt: A system design discussion mentions **File abstraction**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Metadata and access rules are part of the abstraction.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Metadata and access rules are part of the abstraction. This is why File abstraction matters in File Systems.
