lesson:
  introduction: This deeper lesson expands Windows Case Study from Chapter 11 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: object-manager
    title: Object manager
    required: true
    content: 'Windows represents many kernel-managed resources as objects accessed through handles.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Windows Case Study, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: object-manager-deep-check
      title: 'Check: Object manager'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Object manager**?
      choices:
      - id: a
        text: A handle is a mediated reference, not the object itself.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'A handle is a mediated reference, not the object itself. Related topic: Windows Case Study.'
    media:
    - type: image
      src: /assessments/operating-systems/case-studies/windows-handle-object-manager.svg
      alt: Windows handle routed through the object manager to kernel objects.
      caption: A handle is a mediated reference to an object manager resource.
