authoring:
  visualRequirement: required
  visualRationale: Boundary behavior depends on the incident, reflected, and transmitted pulse geometry.
lesson:
  introduction: A pulse is one disturbance; at a boundary, the pulse can reflect, transmit, or do both.
  sections:
  - id: pulse
    title: Separate a pulse from a periodic wave
    content: |
      A pulse is a single localized disturbance that travels through a medium. A periodic wave repeats in time and space. Both transport energy without carrying the medium permanently along with the disturbance.
    media:
    - type: image
      src: /media/physics/owa/wave-boundaries.svg
      alt: Incident pulse approaching fixed and free string boundaries with reflected pulses shown.
      caption: Boundary constraints determine whether a reflected string pulse inverts.
  - id: direction
    title: Read direction from a wave function
    content: |
      In $y(x,t)=f(x-vt)$, a fixed feature occurs where $x-vt$ is constant, so it moves in the positive $x$ direction. In $f(x+vt)$ it moves in the negative direction. This is a horizontal shift of the whole pattern, not motion of one particle across the string.
  - id: fixed
    title: Analyze a fixed boundary
    content: |
      At a fixed end, the displacement must remain zero. A crest arriving at that boundary reflects as a trough: the reflected pulse is inverted relative to the incident pulse.
  - id: free
    title: Analyze a free boundary
    content: |
      At a free end, the end can move. A crest reflects as a crest, so the reflected pulse is not inverted. The different result follows from the different boundary constraint, not from a different wave speed.
  - id: transmission
    title: Allow for reflection and transmission
    content: |
      At a boundary between media, some wave energy can reflect and some can transmit. A change in medium can change wave speed and wavelength; the source fixes frequency for a driven wave.
  - id: energy
    title: Distinguish energy from power
    content: |
      Wave energy is the amount transferred. Wave power is the rate of transfer, $P=\Delta E/\Delta t$. For a sinusoidal string wave, greater amplitude and frequency increase the rate at which energy is carried.
  - id: check
    title: Use boundary behavior as a model check
    content: |
      Before calculating, state the boundary and predict inversion or no inversion. Then check that a fixed end has zero displacement and that a free end has no transverse support force in the idealized model.
