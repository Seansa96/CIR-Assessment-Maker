modeDefault: exam
randomizeQuestions: true
questions:
- id: q001
  title: Perpendicular torque
  type: numericResponse
  prompt: A $40\text{ N}$ force is applied perpendicular $0.30\text{ m}$ from a pivot.
    What torque is produced?
  answer:
    value: 12.0
    tolerance: 0.1
  explanation: 'Solution: $\tau=rF=0.30(40)=12$ N m.


    Why it works: A perpendicular force has a lever arm equal to its radius.

    '
  difficultyDimensions:
  - modelOrDerivation
  - unitAnalysis
- id: q002
  title: Angled torque
  type: numericResponse
  prompt: A $100\text{ N}$ force is applied $0.50\text{ m}$ from a pivot at $30^\circ$.
    What torque is produced?
  answer:
    value: 25.0
    tolerance: 0.3
  explanation: 'Solution: $\tau=rF\sin\theta=0.50(100)\sin30^\circ=25$ N m.


    Why it works: Only the perpendicular component of an angled force creates torque.

    '
  difficultyDimensions:
  - modelOrDerivation
  - trigonometricModel
- id: q003
  title: Maximum angle
  type: multipleChoice
  prompt: For fixed $r$ and $F$, what angle gives maximum torque?
  choices:
  - id: a
    text: $90^\circ$
  - id: b
    text: $0^\circ$
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: $30^\circ$
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: $180^\circ$
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution: $90^\circ$.


    Why it works: $\sin\theta$ is largest at $90^\circ$.


    Why the other choices fail: The sine is zero at 0 and 180 degrees and smaller
    at 30 degrees.

    '
  difficultyDimensions:
  - modelOrDerivation
  - optimization
- id: q004
  title: Lever arm
  type: numericResponse
  prompt: A $60\text{ N}$ force has a perpendicular lever arm of $0.25\text{ m}$.
    What is the torque?
  answer:
    value: 15.0
    tolerance: 0.1
  explanation: 'Solution: $\tau=Fr_\perp=60(0.25)=15$ N m.


    Why it works: Torque equals force times perpendicular lever arm.

    '
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q005
  title: Zero torque
  type: multipleChoice
  prompt: Which force produces zero torque about a pivot?
  choices:
  - id: a
    text: A force whose line of action passes through the pivot.
  - id: b
    text: A perpendicular force far from the pivot.
    issueSignals:
    - id: torque-force-confusion
    - id: trigonometry-error
  - id: c
    text: A tangential force.
    issueSignals:
    - id: linear-angular-confusion
    - id: torque-force-confusion
  - id: d
    text: A force with a long lever arm.
    issueSignals:
    - id: torque-force-confusion
    - id: lever-arm-confusion
  answer:
    choiceId: a
  explanation: 'Solution: A force whose line of action passes through the pivot.


    Why it works: Its perpendicular lever arm is zero.


    Why the other choices fail: Each other option places a force away from the pivot
    with a nonzero lever arm.

    '
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
- id: q006
  title: Net torque sign
  type: numericResponse
  prompt: A $10\text{ N}\cdot\text{m}$ CCW torque and $4\text{ N}\cdot\text{m}$ CW
    torque act. Taking CCW positive, what is net torque?
  answer:
    value: 6.0
    tolerance: 0.1
  explanation: 'Solution: $\tau_{net}=10-4=6$ N m.


    Why it works: Clockwise torque is negative under the stated convention.

    '
  difficultyDimensions:
  - signConvention
  - modelOrDerivation
- id: q007
  title: Force from torque
  type: numericResponse
  prompt: A required torque is $18\text{ N}\cdot\text{m}$ from a perpendicular force
    at $0.60\text{ m}$. What force is needed?
  answer:
    value: 30.0
    tolerance: 0.2
  explanation: 'Solution: $F=\tau/r=18/0.60=30$ N.


    Why it works: Rearranging the perpendicular torque relation isolates the required
    force.

    '
  difficultyDimensions:
  - reverseReasoning
  - modelOrDerivation
- id: q008
  title: CCW convention
  type: multipleChoice
  prompt: 'In many 2D torque problems, counterclockwise torque is chosen as:'
  choices:
  - id: a
    text: positive
  - id: b
    text: negative
    issueSignals:
    - id: sign-error
  - id: c
    text: zero
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: undefined
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution: Positive.


    Why it works: Counterclockwise is the common positive convention for planar torque.


    Why the other choices fail: Negative, zero, and undefined do not match that explicitly
    chosen convention.

    '
  difficultyDimensions:
  - signConvention
  - retrieval
- id: q009
  title: Seesaw balance
  type: numericResponse
  prompt: A $200\text{ N}$ child sits $1.5\text{ m}$ left of a pivot. A $300\text{
    N}$ child sits right. How far right to balance?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: 'Solution: $200(1.5)=300x$, so $x=1.0$ m.


    Why it works: Balance requires equal and opposite torques about the pivot.

    '
  difficultyDimensions:
  - modelOrDerivation
  - reverseReasoning
- id: q010
  title: Lever arm definition
  type: multipleChoice
  prompt: 'The lever arm is:'
  choices:
  - id: a
    text: perpendicular distance from pivot to force line of action
  - id: b
    text: total object length
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: mass times radius squared
    issueSignals:
    - id: inertia-mass-confusion
    - id: lever-arm-confusion
  - id: d
    text: angle swept out
    issueSignals:
    - id: trigonometry-error
  answer:
    choiceId: a
  explanation: 'Solution: Perpendicular distance from pivot to force line of action.


    Why it works: This distance is the lever arm in $\tau=Fr_\perp$.


    Why the other choices fail: Object length, moment of inertia, and swept angle
    are different rotational quantities.

    '
  difficultyDimensions:
  - retrieval
  - representationTransfer
- id: q011
  title: Door torque
  type: numericResponse
  prompt: A $25\text{ N}$ force is applied perpendicular to a door $0.80\text{ m}$
    from the hinge. What torque acts?
  answer:
    value: 20.0
    tolerance: 0.1
  explanation: 'Solution: $\tau=0.80(25)=20$ N m.


    Why it works: The push is perpendicular to the door radius from its hinge.

    '
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q012
  title: Sixty degree force
  type: numericResponse
  prompt: A $50\text{ N}$ force acts $0.40\text{ m}$ from a pivot at $60^\circ$. What
    torque is produced?
  answer:
    value: 17.32
    tolerance: 0.1
  explanation: 'Solution: $\tau=0.40(50)\sin60^\circ=17.32$ N m.


    Why it works: The sine factor selects the force component perpendicular to the
    radius.

    '
  difficultyDimensions:
  - trigonometricModel
  - modelOrDerivation
- id: q013
  title: Torque units
  type: multipleChoice
  prompt: Which unit is torque commonly expressed in?
  choices:
  - id: a
    text: $\text{N}\cdot\text{m}$
  - id: b
    text: $\text{J/s}$
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: $\text{kg}\cdot\text{m}^2$
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: $\text{m/s}^2$
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution: N m.


    Why it works: Torque is force times perpendicular distance.


    Why the other choices fail: J/s is power, kg m$^2$ is moment-of-inertia units,
    and m/s$^2$ is acceleration.

    '
  difficultyDimensions:
  - unitAnalysis
  - retrieval
- id: q014
  title: Two forces about pivot
  type: numericResponse
  prompt: A $15\text{ N}$ force acts down $0.40\text{ m}$ left of a pivot and a $10\text{
    N}$ force acts down $0.50\text{ m}$ right. Taking CCW positive, what is net torque?
  answer:
    value: 1.0
    tolerance: 0.1
  explanation: 'Solution: Left force gives $+6$ N m and right force gives $-5$ N m,
    so net torque is $+1$ N m.


    Why it works: The two force positions produce opposite rotation senses and are
    summed using the CCW-positive convention.

    '
  difficultyDimensions:
  - signConvention
  - representationTransfer
- id: q015
  title: Increase torque
  type: multipleChoice
  prompt: Which change increases torque most?
  choices:
  - id: a
    text: Apply force farther from pivot and more perpendicular.
  - id: b
    text: Move force closer.
    issueSignals:
    - id: torque-force-confusion
  - id: c
    text: Aim through pivot.
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: Reduce lever arm to zero.
    issueSignals:
    - id: lever-arm-confusion
  answer:
    choiceId: a
  explanation: 'Solution: Apply force farther from the pivot and more perpendicular.


    Why it works: Torque grows with lever arm and the perpendicular component of force.


    Why the other choices fail: Moving closer, aiming through the pivot, or zeroing
    the lever arm reduces torque.

    '
  difficultyDimensions:
  - optimization
  - modelOrDerivation
