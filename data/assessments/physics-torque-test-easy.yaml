schemaVersion: 1
id: physics-torque-test-easy
title: 'Test (Easy): Torque'
description: Fundamental exam covering Torque.
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-torque
skills:
- Apply Torque
- physics-torque
- torque
- lever-arm
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - physics-1
  - physics-torque
modeDefault: exam
randomizeQuestions: true
questions:
- id: q001
  title: Perpendicular torque
  type: numericResponse
  prompt: |-
    A $40\text{ N}$ force is applied perpendicular $0.30\text{ m}$ from a pivot. What torque is produced?
  answer:
    value: 12.0
    tolerance: 0.1
  explanation: |-
    $\tau=rF=0.30(40)=12\text{ N}\cdot\text{m}$.
- id: q002
  title: Angled torque
  type: numericResponse
  prompt: |-
    A $100\text{ N}$ force is applied $0.50\text{ m}$ from a pivot at $30^\circ$. What torque is produced?
  answer:
    value: 25.0
    tolerance: 0.3
  explanation: |-
    $\tau=rF\sin\theta=0.50(100)\sin30^\circ=25$.
- id: q003
  title: Maximum angle
  type: multipleChoice
  prompt: |-
    For fixed $r$ and $F$, what angle gives maximum torque?
  choices:
  - id: a
    text: |-
      $90^\circ$
  - id: b
    text: |-
      $0^\circ$
  - id: c
    text: |-
      $30^\circ$
  - id: d
    text: |-
      $180^\circ$
  answer:
    choiceId: a
  explanation: |-
    $\sin\theta$ is largest at $90^\circ$.
- id: q004
  title: Lever arm
  type: numericResponse
  prompt: |-
    A $60\text{ N}$ force has a perpendicular lever arm of $0.25\text{ m}$. What is the torque?
  answer:
    value: 15.0
    tolerance: 0.1
  explanation: |-
    $\tau=Fr_\perp=60(0.25)=15$.
- id: q005
  title: Zero torque
  type: multipleChoice
  prompt: |-
    Which force produces zero torque about a pivot?
  choices:
  - id: a
    text: |-
      A force whose line of action passes through the pivot.
  - id: b
    text: |-
      A perpendicular force far from the pivot.
  - id: c
    text: |-
      A tangential force.
  - id: d
    text: |-
      A force with a long lever arm.
  answer:
    choiceId: a
  explanation: |-
    The lever arm is zero when the line of action passes through the pivot.
- id: q006
  title: Net torque sign
  type: numericResponse
  prompt: |-
    A $10\text{ N}\cdot\text{m}$ CCW torque and $4\text{ N}\cdot\text{m}$ CW torque act. Taking CCW positive, what is net torque?
  answer:
    value: 6.0
    tolerance: 0.1
  explanation: |-
    $\tau_{net}=10-4=6\text{ N}\cdot\text{m}$.
- id: q007
  title: Force from torque
  type: numericResponse
  prompt: |-
    A required torque is $18\text{ N}\cdot\text{m}$ from a perpendicular force at $0.60\text{ m}$. What force is needed?
  answer:
    value: 30.0
    tolerance: 0.2
  explanation: |-
    $F=\tau/r=18/0.60=30\text{ N}$.
- id: q008
  title: CCW convention
  type: multipleChoice
  prompt: |-
    In many 2D torque problems, counterclockwise torque is chosen as:
  choices:
  - id: a
    text: |-
      positive
  - id: b
    text: |-
      negative
  - id: c
    text: |-
      zero
  - id: d
    text: |-
      undefined
  answer:
    choiceId: a
  explanation: |-
    This is a standard sign convention.
- id: q009
  title: Seesaw balance
  type: numericResponse
  prompt: |-
    A $200\text{ N}$ child sits $1.5\text{ m}$ left of a pivot. A $300\text{ N}$ child sits right. How far right to balance?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: |-
    $200(1.5)=300x$, so $x=1.0\text{ m}$.
- id: q010
  title: Lever arm definition
  type: multipleChoice
  prompt: |-
    The lever arm is:
  choices:
  - id: a
    text: |-
      perpendicular distance from pivot to force line of action
  - id: b
    text: |-
      total object length
  - id: c
    text: |-
      mass times radius squared
  - id: d
    text: |-
      angle swept out
  answer:
    choiceId: a
  explanation: |-
    Torque can be computed as force times perpendicular lever arm.
- id: q011
  title: Door torque
  type: numericResponse
  prompt: |-
    A $25\text{ N}$ force is applied perpendicular to a door $0.80\text{ m}$ from the hinge. What torque acts?
  answer:
    value: 20.0
    tolerance: 0.1
  explanation: |-
    $\tau=0.80(25)=20\text{ N}\cdot\text{m}$.
- id: q012
  title: Sixty degree force
  type: numericResponse
  prompt: |-
    A $50\text{ N}$ force acts $0.40\text{ m}$ from a pivot at $60^\circ$. What torque is produced?
  answer:
    value: 17.32
    tolerance: 0.1
  explanation: |-
    $\tau=0.40(50)\sin60^\circ=17.3$.
- id: q013
  title: Torque units
  type: multipleChoice
  prompt: |-
    Which unit is torque commonly expressed in?
  choices:
  - id: a
    text: |-
      $\text{N}\cdot\text{m}$
  - id: b
    text: |-
      $\text{J/s}$
  - id: c
    text: |-
      $\text{kg}\cdot\text{m}^2$
  - id: d
    text: |-
      $\text{m/s}^2$
  answer:
    choiceId: a
  explanation: |-
    Torque has force times distance units.
- id: q014
  title: Two forces about pivot
  type: numericResponse
  prompt: |-
    A $15\text{ N}$ force acts down $0.40\text{ m}$ left of a pivot and a $10\text{ N}$ force acts down $0.50\text{ m}$ right. Taking CCW positive, what is net torque?
  answer:
    value: 1.0
    tolerance: 0.1
  explanation: |-
    Left force: $+6$; right force: $-5$; net $+1\text{ N}\cdot\text{m}$.
- id: q015
  title: Increase torque
  type: multipleChoice
  prompt: |-
    Which change increases torque most?
  choices:
  - id: a
    text: |-
      Apply force farther from pivot and more perpendicular.
  - id: b
    text: |-
      Move force closer.
  - id: c
    text: |-
      Aim through pivot.
  - id: d
    text: |-
      Reduce lever arm to zero.
  answer:
    choiceId: a
  explanation: |-
    Torque grows with distance and perpendicular force component.
