subcategoryIds:
- physics-torque
modeDefault: exam
randomizeQuestions: true
questions:
- id: q1
  type: multipleChoice
  prompt: Which of the following forces produces zero torque about the origin?
  choices:
  - id: c1
    content: A force applied perpendicularly to the position vector.
  - id: c2
    content: A force applied radially inward toward the origin.
  - id: c3
    content: A tangential force at the rim of a wheel.
  answer:
    choiceId: c2
  explanation: A radial force has a zero lever arm (the angle between $\vec{r}$ and
    $\vec{F}$ is $180^\circ$, so $\sin(180^\circ) = 0$).
