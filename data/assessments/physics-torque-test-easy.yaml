schemaVersion: 1
id: physics-torque-test-easy
title: 'Test (Easy): Torque'
description: Fundamental exam covering Torque.
assessmentType: test
categoryId: physics-1
topicId: physics-torque
skills:
- Apply Torque
- physics-torque
- torque
