- id: example-1
  title: Determine magnesium ion charge
  problem: Predict magnesium's common monatomic ion and verify its electron count.
  steps:
  - id: we1-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Magnesium has two valence electrons outside a neon core.
    explanation: 'Solution: Magnesium has two valence electrons outside a neon core. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: we1-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Losing those two electrons gives 12 protons and 10 electrons, so the charge is 2+.
    explanation: 'Solution: Losing those two electrons gives 12 protons and 10 electrons, so the charge is 2+. Why it works:
      This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we1-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Write Mg2+ and verify that it is isoelectronic with neon.
    explanation: 'Solution: Write Mg2+ and verify that it is isoelectronic with neon. Why it works: This step follows the
      topic''s accounting rules and supplies a separate check before the final conclusion.'
- id: example-2
  title: Determine nitride ion charge
  problem: Predict the common ion formed by nitrogen.
  steps:
  - id: we2-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Nitrogen has five valence electrons and needs three more to reach an octet.
    explanation: 'Solution: Nitrogen has five valence electrons and needs three more to reach an octet. Why it works: This
      step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we2-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Gaining three electrons gives three more electrons than protons, so the charge is 3-.
    explanation: 'Solution: Gaining three electrons gives three more electrons than protons, so the charge is 3-. Why it works:
      This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we2-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Write N3- and verify that the resulting ten-electron count matches neon.
    explanation: 'Solution: Write N3- and verify that the resulting ten-electron count matches neon. Why it works: This step
      follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
