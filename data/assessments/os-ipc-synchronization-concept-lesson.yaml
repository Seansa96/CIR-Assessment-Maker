lesson:
  introduction: 'This lesson introduces IPC and Synchronization through the mental models emphasized by 2.3 Interprocess Communication.
    Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: race-condition
    title: Race condition
    required: true
    content: 'A race condition occurs when correctness depends on the timing of unsynchronized concurrent actions.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Races are not solved by hoping one thread is usually faster.

      '
    check:
      id: race-condition-check
      title: 'Check: Race condition'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Race condition**?

        '
      choices:
      - id: a
        text: A race condition occurs when correctness depends on the timing of unsynchronized concurrent actions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A race condition occurs when correctness depends on the timing of unsynchronized concurrent actions. Related
        topic: IPC and Synchronization.

        '
  - id: critical-region
    title: Critical region
    required: true
    content: 'A critical region is code that touches shared state and must not be executed concurrently by conflicting actors.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Only protecting some accesses still leaves a race.

      '
    check:
      id: critical-region-check
      title: 'Check: Critical region'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Critical region**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: A critical region is code that touches shared state and must not be executed concurrently by conflicting actors.
      answer:
        choiceId: d
      explanation: 'A critical region is code that touches shared state and must not be executed concurrently by conflicting
        actors. Related topic: IPC and Synchronization.

        '
  - id: mutual-exclusion
    title: Mutual exclusion
    required: true
    content: 'Mutual exclusion ensures only one actor enters a critical region at a time.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Mutual exclusion is a tool, not a full correctness proof.

      '
    check:
      id: mutual-exclusion-check
      title: 'Check: Mutual exclusion'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Mutual exclusion**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Mutual exclusion ensures only one actor enters a critical region at a time.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Mutual exclusion ensures only one actor enters a critical region at a time. Related topic: IPC and Synchronization.

        '
  - id: semaphore
    title: Semaphore
    required: true
    content: 'A semaphore coordinates access through an integer count changed by atomic operations.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A semaphore is not the same as a mutex, though it can sometimes act like one.

      '
    check:
      id: semaphore-check
      title: 'Check: Semaphore'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Semaphore**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: A semaphore coordinates access through an integer count changed by atomic operations.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'A semaphore coordinates access through an integer count changed by atomic operations. Related topic: IPC
        and Synchronization.

        '
  - id: monitor
    title: Monitor
    required: true
    content: 'A monitor packages shared data with procedures and condition synchronization.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Condition variables require careful waiting and signaling discipline.

      '
    check:
      id: monitor-check
      title: 'Check: Monitor'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Monitor**?

        '
      choices:
      - id: a
        text: A monitor packages shared data with procedures and condition synchronization.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A monitor packages shared data with procedures and condition synchronization. Related topic: IPC and Synchronization.

        '
  - id: message-passing
    title: Message passing
    required: true
    content: 'Message passing coordinates processes by sending data instead of sharing memory directly.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Message passing can still block and still requires protocol design.

      '
    check:
      id: message-passing-check
      title: 'Check: Message passing'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Message passing**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Message passing coordinates processes by sending data instead of sharing memory directly.
      answer:
        choiceId: d
      explanation: 'Message passing coordinates processes by sending data instead of sharing memory directly. Related topic:
        IPC and Synchronization.

        '
