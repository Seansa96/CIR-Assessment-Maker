  prompt: |
    Which exact value is represented by $0.999\ldots$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $0.9$
  - id: c
    text: $9/11$
  - id: d
    text: A number infinitesimally below $1$
  answer:
    choiceId: a
  explanation: |-
    Solution: The place values form $0.9\sum_{k=0}^{\infty}(0.1)^k=0.9/(1-0.1)=1$. Therefore the answer is $1$.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: $0.9$ conflicts with this criterion: Direct comparison uses nonnegative terms; $9/11$ conflicts with this criterion: Direct comparison uses nonnegative terms; A number infinitesimally below $1$ conflicts with this criterion: Direct comparison uses nonnegative terms.
