schemaVersion: 1
id: calc2-geometric-telescoping-series-olympiad-test
title: Geometric and Telescoping Series Olympiad Test
assessmentType: test
categoryId: calculus-2
topicId: geometric-telescoping-series
skills:
- Evaluate shifted and weighted geometric series
- Derive telescoping sums and products from exact identities
- Track surviving boundary terms and test their limits
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - geometric-telescoping-series
  - olympiad
  - exact-summation
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - decompose-rational-telescoping-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=3}^{\infty}\frac1{n^2-4}$.
  choices:
  - id: a
    text: $25/48$
  - id: b
    text: $1/4$
  - id: c
    text: $5/12$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: |-
    Write the summand as $\tfrac14[1/(n-2)-1/(n+2)]$; the four initial reciprocal terms survive and sum to $25/12$ before multiplication by one fourth.
- id: q002
  type: multipleChoice
  skills:
  - interpret-repeating-decimals-as-series
  prompt: |
    Which exact value is represented by $0.999\ldots$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $0.9$
  - id: c
    text: $9/11$
  - id: d
    text: A number infinitesimally below $1$
  answer:
    choiceId: a
  explanation: |-
    The place values form $0.9\sum_{k=0}^{\infty}(0.1)^k=0.9/(1-0.1)=1$.
- id: q003
  type: multipleChoice
  skills:
  - normalize-geometric-series
  prompt: |
    Find $\displaystyle\sum_{n=1}^{\infty}\frac{4^{n+1}}{5^n}$.
  choices:
  - id: a
    text: $16$
  - id: b
    text: $20$
  - id: c
    text: $4$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: |-
    The series is $4\sum_{n=1}^{\infty}(4/5)^n=4[(4/5)/(1/5)]=16$.
- id: q004
  type: multipleChoice
  skills:
  - analyze-telescoping-divergence
  prompt: |
    What happens to $\displaystyle\sum_{n=1}^{\infty}\ln(1+1/n)$?
  choices:
  - id: a
    text: |-
      It diverges to $+\infty$.
  - id: b
    text: |-
      It converges to $\ln2$.
  - id: c
    text: It converges to $1$.
  - id: d
    text: It oscillates.
  answer:
    choiceId: a
  explanation: |-
    Each term is $\ln(n+1)-\ln n$, so the Nth partial sum is $\ln(N+1)$.
- id: q005
  type: multipleChoice
  skills:
  - discover-factorial-telescoping
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{n}{(n+1)!}$.
  choices:
  - id: a
    text: $1$
  - id: b
    text: $e-1$
  - id: c
    text: $1/2$
  - id: d
    text: $e$
  answer:
    choiceId: a
  explanation: Since $n/(n+1)!=1/n!-1/(n+1)!$, the finite sum leaves $1-1/(N+1)!$.
- id: q006
  type: multipleChoice
  skills:
  - telescope-arithmetic-progressions
  prompt: |
    Compute $\displaystyle\sum_{n=1}^{\infty}\frac1{(2n-1)(2n+1)}$.
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $1$
  - id: c
    text: $1/4$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: The summand is one half of $1/(2n-1)-1/(2n+1)$, leaving one half in the limit.
- id: q007
  type: multipleChoice
  skills:
  - split-combined-geometric-series
  prompt: |
    Find $\displaystyle\sum_{n=1}^{\infty}\frac{3^n-2^n}{6^n}$.
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $3/2$
  - id: c
    text: $1/6$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: |-
    Split into $\sum(1/2)^n-\sum(1/3)^n=1-1/2$.
- id: q008
  type: multipleChoice
  skills:
  - factor-and-telescope-rational-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac1{n^2+3n+2}$.
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $1$
  - id: c
    text: $3/2$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: Factoring as $(n+1)(n+2)$ yields $1/(n+1)-1/(n+2)$.
- id: q009
  type: multipleChoice
  skills:
  - evaluate-telescoping-products
  prompt: |
    Determine $\displaystyle\prod_{n=2}^{\infty}(1-1/n^2)$.
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $0$
  - id: c
    text: $1$
  - id: d
    text: $2$
  answer:
    choiceId: a
  explanation: |-
    The Nth product factors into $\prod(n-1)/n$ and $\prod(n+1)/n$, giving $(N+1)/(2N)$.
- id: q010
  type: multipleChoice
  skills:
  - recognize-difference-of-squares-terms
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{2n+1}{n^2(n+1)^2}$.
  choices:
  - id: a
    text: $1$
  - id: b
    text: $1/2$
  - id: c
    text: $2$
  - id: d
    text: |-
      $\pi^2/6$
  answer:
    choiceId: a
  explanation: The summand equals $1/n^2-1/(n+1)^2$, leaving the initial value one.
- id: q011
  type: multipleChoice
  skills:
  - convert-log-sums-to-products
  prompt: |
    Find $\displaystyle\sum_{n=2}^{\infty}\ln(1-1/n^2)$.
  choices:
  - id: a
    text: |-
      $-\ln2$
  - id: b
    text: |-
      $\ln2$
  - id: c
    text: $-1/2$
  - id: d
    text: |-
      Diverges to $-\infty$
  answer:
    choiceId: a
  explanation: |-
    The Nth sum is the logarithm of the corresponding product, which tends to $\ln(1/2)$.
- id: q012
  type: multipleChoice
  skills:
  - differentiate-geometric-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{n}{2^n}$.
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: $4$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: |-
    Differentiating $\sum x^n=1/(1-x)$ gives $\sum nx^n=x/(1-x)^2$; at $x=1/2$ this is two.
- id: q013
  type: multipleChoice
  skills:
  - discover-inverse-trigonometric-telescoping
  prompt: |
    Evaluate
    $$\sum_{n=1}^{\infty}\arctan\left(\frac1{n^2+n+1}\right).$$
  choices:
  - id: a
    text: |-
      $\pi/4$
  - id: b
    text: |-
      $\pi/2$
  - id: c
    text: $1$
  - id: d
    text: |-
      $\pi/6$
  answer:
    choiceId: a
  explanation: |-
    The summand is $\arctan(n+1)-\arctan n$ because the tangent of that difference is $1/(n^2+n+1)$; the boundary tends to $\pi/2-\pi/4$.
- id: q014
  type: multipleChoice
  skills:
  - telescope-three-factor-rational-series
  prompt: |
    Compute $\displaystyle\sum_{n=1}^{\infty}\frac1{n(n+1)(n+2)}$.
  choices:
  - id: a
    text: $1/4$
  - id: b
    text: $1/2$
  - id: c
    text: $1$
  - id: d
    text: $1/6$
  answer:
    choiceId: a
  explanation: The summand is one half of $1/[n(n+1)]-1/[(n+1)(n+2)]$, leaving one half of one half.
- id: q015
  type: multipleChoice
  skills:
  - evaluate-arithmetic-geometric-series
  prompt: |
    Find $\displaystyle\sum_{n=0}^{\infty}\frac{n+1}{3^n}$.
  choices:
  - id: a
    text: $9/4$
  - id: b
    text: $3/2$
  - id: c
    text: $3$
  - id: d
    text: $2$
  answer:
    choiceId: a
  explanation: |-
    With $r=1/3$, the sum $\sum(n+1)r^n$ equals $1/(1-r)^2=9/4$.
attemptQuestionCount: 15
