- id: q_gt_11
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=3}^\\infty \frac{1}{n^2 - 4}$."
  answer:
    gradingMode: selfCheck
    checkModel: 25/48
  explanation: "Partial fractions: $\frac{1}{4}(\frac{1}{n-2} - \frac{1}{n+2})$. Telescopes leaving $1/4(1 + 1/2 + 1/3 + 1/4) = 25/48$."
- id: q_gt_12
  type: freeResponse
  prompt: |-
    What is the sum of $0.999\dots$ represented as a geometric series?
  answer:
    gradingMode: selfCheck
    checkModel: '1'
  explanation: |-
    $a=0.9$, $r=0.1$. Sum = $0.9/(1-0.1) = 0.9/0.9 = 1$.
- id: q_gt_13
  type: freeResponse
  prompt: "Calculate $\\sum_{n=1}^\\infty \frac{4^{n+1}}{5^n}$."
  answer:
    gradingMode: selfCheck
    checkModel: '16'
  explanation: "Rewrite as $4 \\cdot (4/5)^n$. Sum is $4 \\cdot \frac{4/5}{1 - 4/5} = 4 \\cdot 4 = 16$."
- id: q_gt_14
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=1}^\\infty \\ln\\left(1 + \frac{1}{n}\right)$."
  answer:
    gradingMode: selfCheck
    checkModel: Diverges
  explanation: "Rewrite as $\\sum \\ln(\frac{n+1}{n}) = \\sum (\\ln(n+1) - \\ln(n))$. Telescopes to $\\ln(\\infty)$, which diverges."
- id: q_gt_15
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=1}^\\infty \frac{n}{(n+1)!}$."
  answer:
    gradingMode: selfCheck
    checkModel: '1'
  explanation: "Notice $\frac{n}{(n+1)!} = \frac{n+1-1}{(n+1)!} = \frac{1}{n!} - \frac{1}{(n+1)!}$. Telescopes to $1/1! = 1$."
- id: q_gt_16
  type: freeResponse
  prompt: "Find the sum of $\\sum_{n=1}^\\infty \frac{1}{(2n-1)(2n+1)}$."
  answer:
    gradingMode: selfCheck
    checkModel: 1/2
  explanation: "Partial fractions: $\frac{1}{2}(\frac{1}{2n-1} - \frac{1}{2n+1})$. Telescopes to $1/2(1) = 1/2$."
- id: q_gt_17
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=1}^\\infty \frac{3^n - 2^n}{6^n}$."
  answer:
    gradingMode: selfCheck
    checkModel: 1/2
  explanation: "Split: $\\sum (1/2)^n - \\sum (1/3)^n = \frac{1/2}{1/2} - \frac{1/3}{2/3} = 1 - 1/2 = 1/2$."
- id: q_gt_18
  type: freeResponse
  prompt: "Determine $\\sum_{n=1}^\\infty \frac{1}{n^2+3n+2}$."
  answer:
    gradingMode: selfCheck
    checkModel: 1/2
  explanation: "Factor denom: $(n+1)(n+2)$. Partial fractions: $\frac{1}{n+1} - \frac{1}{n+2}$. Telescopes to $1/2$."
- id: q_gt_19
  type: freeResponse
  prompt: "Evaluate the telescoping product $\\prod_{n=2}^\\infty (1 - \frac{1}{n^2})$."
  answer:
    gradingMode: selfCheck
    checkModel: 1/2
  explanation: "Rewrite as $\frac{(n-1)(n+1)}{n^2}$. Writing out terms shows massive cancellation, leaving $\frac{1}{2} \\cdot \frac{\\infty}{\\infty}$, rigorously evaluates to $1/2$."
- id: q_gt_20
  type: freeResponse
  prompt: "Find $\\sum_{n=1}^\\infty \frac{2n+1}{n^2(n+1)^2}$."
  answer:
    gradingMode: selfCheck
    checkModel: '1'
  explanation: "Rewrite as $\frac{1}{n^2} - \frac{1}{(n+1)^2}$. Telescopes to $1/1^2 = 1$."
- id: q_gt_21
  type: freeResponse
  prompt: "Evaluate $\\sum_{n=2}^\\infty \\ln(1 - \frac{1}{n^2})$."
  answer:
    gradingMode: selfCheck
    checkModel: |-
      $-\ln(2)$
  explanation: |-
    This is the logarithm of the product evaluated previously. $\ln(1/2) = -\ln(2)$.
