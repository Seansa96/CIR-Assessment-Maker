  prompt: |
    Find $\displaystyle\sum_{n=1}^{\infty}\frac{4^{n+1}}{5^n}$.
  choices:
  - id: a
    text: $16$
  - id: b
    text: $20$
  - id: c
    text: $4$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: |-
    Solution: The series is $4\sum_{n=1}^{\infty}(4/5)^n=4[(4/5)/(1/5)]=16$. Therefore the answer is $16$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $20$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $4$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Diverges conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
