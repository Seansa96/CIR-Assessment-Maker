  prompt: |
    Evaluate $\displaystyle\sum_{n=3}^{\infty}\frac1{n^2-4}$.
  choices:
  - id: a
    text: $25/48$
  - id: b
    text: $1/4$
  - id: c
    text: $5/12$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: |-
    Solution: Write the summand as $\tfrac14[1/(n-2)-1/(n+2)]$; the four initial reciprocal terms survive and sum to $25/12$ before multiplication by one fourth. Therefore the answer is $25/48$.

    Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

    Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.

    Why the other choices fail: $1/4$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; $5/12$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; Diverges conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors.
