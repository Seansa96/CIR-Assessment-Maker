lesson:
  introduction: |-
    Not every special quadrilateral is a parallelogram. In this lesson, we will look at two other important families of quadrilaterals: Trapezoids and Kites.
  sections:
  - id: sec-trapezoids
    title: Trapezoids
    required: true
    content: |-
      A **trapezoid** is a quadrilateral with exactly ONE pair of parallel sides. 
      The parallel sides are called the **bases**, and the non-parallel sides are called the **legs**.
      
      An **Isosceles Trapezoid** is a special type of trapezoid where the two non-parallel legs are equal in length. Because of this symmetry, it gains two special properties:
      1. Both pairs of base angles are equal.
      2. The diagonals are equal in length.
      
      The **Midsegment of a Trapezoid** is the line connecting the midpoints of the two legs. It is parallel to the bases, and its length is the average of the two bases: $\text{Midsegment} = \frac{B_1 + B_2}{2}$.

  - id: sec-kites
    title: Kites
    required: true
    content: |-
      A **kite** is a quadrilateral with two distinct pairs of consecutive, equal-length sides. (Think of a traditional flying kite).
      
      Unlike a parallelogram, the opposite sides are NOT equal. The equal sides are next to each other.
      
      Kites have very interesting properties regarding their diagonals:
      1. The diagonals intersect at exactly a $90^\circ$ angle (they are perpendicular).
      2. Only ONE diagonal is bisected (cut in half). The diagonal connecting the non-equal angles cuts the other diagonal in half.
      3. Only ONE pair of opposite angles is equal (the angles between the non-equal sides).

questions:
- id: q-geom-quad2-1
  title: Concept Check - Trapezoid Midsegment
  prompt: |-
    A trapezoid has a top base of length $10$ and a bottom base of length $24$. What is the length of its midsegment?
  type: numericResponse
  answer:
    numericValue: 17
    tolerance: 0
  explanation: |-
    The midsegment is the average of the two bases.
    $$\text{Midsegment} = \frac{10 + 24}{2} = \frac{34}{2} = 17$$
  skills:
  - geometry-quadrilaterals-basics

- id: q-geom-quad2-2
  title: Concept Check - Kite Diagonals
  prompt: |-
    Which special property do the diagonals of a kite share with the diagonals of a rhombus and a square?
  type: multipleChoice
  choices:
  - id: c1
    text: They are equal in length
  - id: c2
    text: They both bisect each other
  - id: c3
    text: They are perpendicular ($90^\circ$)
  answer:
    choiceId: c3
  explanation: |-
    The diagonals of a kite intersect at a $90^\circ$ angle. This perpendicular property is shared with the rhombus and the square!
  skills:
  - geometry-quadrilaterals-basics
