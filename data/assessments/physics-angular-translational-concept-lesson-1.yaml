lesson:
  introduction: Every point on a rotating rigid body moves in a circle. We can explicitly
    relate the linear (translational) variables of a specific point to the angular
    variables of the entire body.
  sections:
  - id: sec-1
    title: Position and Velocity
    content: 'Consider a point at a distance $r$ from the axis of rotation. The distance
      $s$ it travels along its circular arc is related to the angular displacement
      by $s = r\theta$ (with $\theta$ in radians).


      Taking the time derivative yields the relationship between the linear (tangential)
      velocity $v$ of the point and the angular velocity $\omega$ of the body: $$v
      = \frac{ds}{dt} = r\frac{d\theta}{dt} = r\omega$$

      Points further from the axis (larger $r$) move faster linearly, even though
      every point on the rigid body has the exact same angular velocity $\omega$.'
    media: []
    check:
      id: chk-at-1
      type: multipleChoice
      prompt: Two bugs, A and B, sit on a spinning record. Bug A is twice as far from
        the center as Bug B. How do their tangential speeds compare?
      choices:
      - id: a
        text: Bug A moves twice as fast as Bug B.
      - id: b
        text: Bug B moves twice as fast as Bug A.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: c
        text: They move at the exact same tangential speed.
        issueSignals:
        - id: linear-angular-confusion
      - id: d
        text: Bug A moves four times as fast as Bug B.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: a
      explanation: 'Solution:

        Bug A moves twice as fast as Bug B.


        Why it works:

        Since $v = r\omega$ and both bugs share the same $\omega$, Bug A''s velocity
        is proportional to its larger radius. Because $r_A = 2r_B$, $v_A = 2v_B$.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Tangential Speed
    content: 'Tangential speed is $v=r\omega$; all points share $\omega$ but not $v$.'
    media: []
    check: { id: chk-at-5, type: multipleChoice, prompt: 'At $\omega=6$ rad/s, what is the tangential speed at $r=0.50$ m?', choices: [{ id: a, text: '$3$ m/s' }, { id: b, text: '$6$ m/s' }, { id: c, text: '$12$ m/s' }, { id: d, text: '$0.083$ m/s' }], answer: { choiceId: a }, explanation: 'Solution: $v=r\omega=(0.50)(6)=3$ m/s.\n\nWhy it works: Tangential speed scales with radius.\n\nWhy the other choices fail: They omit, double, or invert the radius factor.' }
  - id: sec-4
    title: Tangential Acceleration
    content: 'Changing angular speed produces tangential acceleration $a_t=r\alpha$.'
    media: []
    check: { id: chk-at-6, type: multipleChoice, prompt: 'A rim at $r=2$ m has $\alpha=3$ rad/s$^2$. What is $a_t$?', choices: [{ id: a, text: '$1.5$ m/s$^2$' }, { id: b, text: '$5$ m/s$^2$' }, { id: c, text: '$6$ m/s$^2$' }, { id: d, text: '$12$ m/s$^2$' }], answer: { choiceId: c }, explanation: 'Solution: $a_t=r\alpha=6$ m/s$^2$.\n\nWhy it works: Angular acceleration changes tangential velocity.\n\nWhy the other choices fail: They use an incorrect radius operation.' }
  - id: sec-5
    title: Radial Acceleration
    content: 'Circular motion requires inward radial acceleration $a_r=v^2/r=r\omega^2$ even at constant speed.'
    media: []
    check: { id: chk-at-7, type: multipleChoice, prompt: 'At constant nonzero angular speed, tangential acceleration is:', choices: [{ id: a, text: positive }, { id: b, text: negative }, { id: c, text: zero }, { id: d, text: radial }], answer: { choiceId: c }, explanation: 'Solution: It is zero.\n\nWhy it works: $a_t=r\alpha$ and constant angular speed has $\alpha=0$.\n\nWhy the other choices fail: Radial acceleration can remain nonzero but is a different component.' }
  - id: sec-6
    title: Direction Components
    content: 'Tangential acceleration is tangent to the path; radial acceleration points toward the axis, so they are perpendicular.'
    media: []
    check: { id: chk-at-8, type: multipleChoice, prompt: 'Radial acceleration points:', choices: [{ id: a, text: forward }, { id: b, text: away from axis }, { id: c, text: toward axis }, { id: d, text: opposite angular velocity }], answer: { choiceId: c }, explanation: 'Solution: It points toward the axis.\n\nWhy it works: It continually turns the velocity vector inward.\n\nWhy the other choices fail: Radial acceleration is not tangential or outward.' }
  - id: sec-7
    title: Total Acceleration
    content: 'When both components exist, $a=\sqrt{a_t^2+a_r^2}$ because the components are perpendicular.'
    media: []
    check: { id: chk-at-9, type: multipleChoice, prompt: 'If $a_t=5$ and $a_r=12$ m/s$^2$, total acceleration is:', choices: [{ id: a, text: '$7$' }, { id: b, text: '$13$' }, { id: c, text: '$17$' }, { id: d, text: '$60$' }], answer: { choiceId: b }, explanation: 'Solution: $a=\sqrt{5^2+12^2}=13$ m/s$^2$.\n\nWhy it works: Use the perpendicular-component Pythagorean relation.\n\nWhy the other choices fail: They subtract, add, or multiply components.' }
  - id: sec-2
    title: Tangential and Radial Acceleration
    content: 'A point on a rotating body can have two components of linear acceleration.
      If the rotation is speeding up or slowing down ($\alpha \neq 0$), the point
      has a **tangential acceleration** $a_t$ parallel to its velocity: $$a_t = \frac{dv}{dt}
      = r\frac{d\omega}{dt} = r\alpha$$


      Because the point is moving in a circle, it *always* has a **radial (centripetal)
      acceleration** $a_r$ pointing toward the axis of rotation, changing the direction
      of the velocity vector: $$a_r = \frac{v^2}{r} = \frac{(r\omega)^2}{r} = r\omega^2$$'
    media: []
    check:
      id: chk-at-2
      type: multipleChoice
      prompt: If a rigid body is rotating at a constant, non-zero angular velocity
        ($\alpha = 0$), what kind of linear acceleration does a point on the edge
        experience?
      choices:
      - id: a
        text: Only tangential acceleration.
        issueSignals:
        - id: linear-angular-confusion
      - id: b
        text: Only radial (centripetal) acceleration.
      - id: c
        text: Both tangential and radial acceleration.
        issueSignals:
        - id: linear-angular-confusion
      - id: d
        text: Zero acceleration.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Only radial (centripetal) acceleration.


        Why it works:

        Because $\alpha = 0$, the tangential acceleration $a_t = r\alpha = 0$. However,
        because it is moving in a circle, it must have a radial acceleration $a_r
        = r\omega^2$ to continuously change the direction of its velocity.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
