lesson:
  introduction: We now apply Newtons Second Law Rotation to complex, multi-body physical
    systems.
  sections:
  - id: sec-1
    title: Complex Systems
    content: When applying Newtons Second Law Rotation to systems with multiple interconnected
      moving parts, conservation laws become our most powerful tools. If net external
      torque is zero, angular momentum is conserved.
    media:
    - type: image
      src: /media/physics/owa/torque-lever.svg
      alt: Lever with a perpendicular force and a labeled lever arm.
      caption: Changing the lever arm changes torque without changing the force.
    check:
      id: chk-physics-newtons-second-law-rotation-3
      type: multipleChoice
      prompt: When can you assume angular momentum is conserved?
      choices:
      - id: a
        text: Always.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Only when the object is isolated from gravity.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: c
        text: When the net external torque is zero.
      answer:
        choiceId: c
      explanation: 'Solution:

        When the net external torque is zero.


        Why it works:

        $\tau_{net} = dL/dt$. If $\tau_{net} = 0$, then $dL/dt = 0$, meaning $L$ is
        constant.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Coupled Translation and Rotation
    content: 'Strings and rolling constraints can connect linear acceleration to angular acceleration through $a=R\alpha$.'
    media: []
    check: { id: chk-nslr-10, type: multipleChoice, prompt: 'For a string unwinding without slip, linear acceleration equals:', choices: [{ id: a, text: '$R\alpha$' }, { id: b, text: '$R/\alpha$' }, { id: c, text: '$I\alpha$' }, { id: d, text: '$\tau\omega$' }], answer: { choiceId: a }, explanation: 'Solution: $a=R\alpha$.\n\nWhy it works: Arc length $s=R\theta$ differentiates twice.\n\nWhy the other choices fail: They are an inverse or dynamics/power relations.' }
  - id: sec-4
    title: Free-Body Diagrams
    content: 'Use a free-body diagram to identify forces and then calculate their torque about the selected axis.'
    media: []
    check: { id: chk-nslr-11, type: multipleChoice, prompt: 'What must be identified before summing torques?', choices: [{ id: a, text: rotation axis }, { id: b, text: final answer }, { id: c, text: color of object }, { id: d, text: time only }], answer: { choiceId: a }, explanation: 'Solution: Identify the rotation axis.\n\nWhy it works: Torque depends on lever arm from that axis.\n\nWhy the other choices fail: Without an axis, torque arms are undefined.' }
  - id: sec-5
    title: Pulley Tension
    content: 'In a massive pulley system, tension creates pulley torque and may differ across the pulley.'
    media: []
    check: { id: chk-nslr-12, type: multipleChoice, prompt: 'A pulley with nonzero inertia needs what to angularly accelerate?', choices: [{ id: a, text: net torque }, { id: b, text: zero tension }, { id: c, text: zero mass }, { id: d, text: equal forces only }], answer: { choiceId: a }, explanation: 'Solution: It needs net torque.\n\nWhy it works: $\tau_{net}=I\alpha$.\n\nWhy the other choices fail: Inertia prevents acceleration without torque.' }
  - id: sec-6
    title: Energy Check
    content: 'Energy methods provide an independent check: lost potential energy can become translational plus rotational kinetic energy.'
    media: []
    check: { id: chk-nslr-13, type: multipleChoice, prompt: 'A falling mass rotates a pulley. Its potential energy can become:', choices: [{ id: a, text: translational and rotational kinetic energy }, { id: b, text: torque only }, { id: c, text: mass only }, { id: d, text: no energy }], answer: { choiceId: a }, explanation: 'Solution: It becomes both kinetic-energy forms.\n\nWhy it works: The mass moves while the pulley spins.\n\nWhy the other choices fail: Torque is not stored energy.' }
  - id: sec-7
    title: Model Assumptions
    content: 'State whether strings are massless, axes frictionless, and contact is no-slip before applying equations.'
    media: []
    check: { id: chk-nslr-14, type: multipleChoice, prompt: 'A no-slip pulley assumption supplies which relation?', choices: [{ id: a, text: '$a=R\alpha$' }, { id: b, text: '$F=ma$ only' }, { id: c, text: '$P=\tau\omega$ only' }, { id: d, text: '$L=0$' }], answer: { choiceId: a }, explanation: 'Solution: $a=R\alpha$.\n\nWhy it works: The string and rim share tangential motion.\n\nWhy the other choices fail: They are unrelated or incomplete conditions.' }
  - id: sec-2
    title: Problem Solving Strategy
    content: '1. Identify the system and the axis of rotation.

      2. Draw a free-body diagram.

      3. Determine all torques and forces.

      4. Apply Newton''s Second Law for rotation and translation simultaneously.'
    media: []
    check:
      id: chk-physics-newtons-second-law-rotation-4
      type: multipleChoice
      prompt: What is the first step in solving a complex rotational dynamics problem?
      choices:
      - id: a
        text: Pick an arbitrary equation.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Identify the system and the axis of rotation.
      - id: c
        text: Plug in all known numbers immediately.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Identify the system and the axis of rotation.


        Why it works:

        A clear understanding of the system boundary and the pivot axis is required
        before any equations can be written.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
