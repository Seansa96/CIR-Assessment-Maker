- id: q-int-hq-1
  title: Cylindrical Shells Intuition
  prompt: |-
    When using the method of cylindrical shells to find the volume of a solid of revolution, the term $2\pi r \cdot h \cdot dr$ represents the volume of a single shell. What does $2\pi r$ represent geometrically?
  type: multipleChoice
  choices:
  - id: c1
    text: The cross-sectional area of the shell
  - id: c2
    text: The circumference of the unwrapped shell
  - id: c3
    text: The height of the bounding curve
  - id: c4
    text: The total volume of the shell
  answer:
    choiceId: c2
  explanation: |-
    If you take a cylindrical shell and cut it open to lay it flat, it forms a rectangular slab. The length of this slab is the circumference of the original shell, which is $2\pi r$. The height is $h$, and the thickness is $dr$.
  skills:
  - geometric-intuition

- id: q-int-hq-2
  title: Cross Sections vs Revolution
  prompt: |-
    A solid has a circular base. Slices taken perpendicular to the x-axis are squares. Is this a solid of revolution?
  type: multipleChoice
  choices:
  - id: c1
    text: Yes, it is formed by revolving a square around the x-axis.
  - id: c2
    text: Yes, it is formed by revolving a circle around the y-axis.
  - id: c3
    text: No, solids of revolution always have circular cross sections when sliced perpendicular to the axis of revolution.
  answer:
    choiceId: c3
  explanation: |-
    Any solid formed by revolving a 2D region around an axis must have circular cross-sections (disks or washers) when sliced perpendicular to the axis of revolution. Since this solid has square cross-sections, it cannot be a solid of revolution.
  skills:
  - geometric-intuition

- id: q-int-hq-3
  title: Accumulation of Density
  prompt: |-
    Suppose a thin rod of length $L$ has a variable density $\rho(x)$. The integral $\int_0^L \rho(x)\,dx$ computes the total mass. What does the term $\rho(x)\,dx$ represent?
  type: multipleChoice
  choices:
  - id: c1
    text: The mass of an infinitesimally small slice of the rod at position $x$.
  - id: c2
    text: The total density of the rod.
  - id: c3
    text: The average mass of the rod.
  answer:
    choiceId: c1
  explanation: |-
    Density $\rho(x)$ is mass per unit length. Multiplying the density at point $x$ by an infinitesimally small length $dx$ gives the infinitesimally small mass $dm$ of that slice. The integral sums these small masses to find the total mass.
  skills:
  - geometric-intuition
