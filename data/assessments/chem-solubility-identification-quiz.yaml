# Part 1: Compound Identification (Soluble or Insoluble)
- id: sol-id-1
  title: Solubility of Silver Compounds
  type: multipleChoice
  prompt: |
    Based on solubility rules, which of the following silver compounds is **soluble** in water?
  choices:
  - id: a
    text: $AgNO_3$
  - id: b
    text: $AgCl$
  - id: c
    text: $Ag_2S$
  - id: d
    text: $Ag_2CO_3$
  answer:
    choiceId: a
  explanation: |
    All nitrates ($NO_3^-$) are soluble in water with no exceptions. Therefore, silver nitrate ($AgNO_3$) is soluble. Silver halides, sulfides, and carbonates are generally insoluble.
  skills:
  - solubility-rules
- id: sol-id-2
  title: Identifying an Insoluble Sulfate
  type: multipleChoice
  prompt: |
    Most sulfate ($SO_4^{2-}$) salts are soluble. Which of the following sulfates is an **exception** and is insoluble in water?
  choices:
  - id: a
    text: $Na_2SO_4$
  - id: b
    text: $MgSO_4$
  - id: c
    text: $BaSO_4$
  - id: d
    text: $CuSO_4$
  answer:
    choiceId: c
  explanation: |
    The exceptions for sulfate solubility include Barium ($Ba^{2+}$), Strontium ($Sr^{2+}$), Calcium ($Ca^{2+}$), Lead ($Pb^{2+}$), and Silver ($Ag^+$). Thus, Barium sulfate ($BaSO_4$) is insoluble.
  skills:
  - solubility-rules
- id: sol-id-3
  title: Soluble Hydroxides
  type: multipleChoice
  prompt: |
    Hydroxides ($OH^-$) are typically insoluble. Which of the following hydroxides will dissolve in water?
  choices:
  - id: a
    text: $Fe(OH)_3$
  - id: b
    text: $Al(OH)_3$
  - id: c
    text: $KOH$
  - id: d
    text: $Cu(OH)_2$
  answer:
    choiceId: c
  explanation: |
    Hydroxides are insoluble except for those containing Group 1 alkali metals (like $K^+$), Ammonium ($NH_4^+$), and the heavier Group 2 metals ($Ca^{2+}$, $Sr^{2+}$, $Ba^{2+}$). Potassium hydroxide ($KOH$) is fully soluble.
  skills:
  - solubility-rules
- id: sol-id-4
  title: Identifying a Soluble Carbonate
  type: multipleChoice
  prompt: |
    Which of the following carbonate ($CO_3^{2-}$) salts is **soluble** in water?
  choices:
  - id: a
    text: $CaCO_3$
  - id: b
    text: $(NH_4)_2CO_3$
  - id: c
    text: $MgCO_3$
  - id: d
    text: $FeCO_3$
  answer:
    choiceId: b
  explanation: |
    Carbonates are generally insoluble. The only major exceptions are compounds containing Group 1 metals or the ammonium ion ($NH_4^+$). Thus, ammonium carbonate is soluble.
  skills:
  - solubility-rules
- id: sol-id-5
  title: Heavy Metal Halides
  type: multipleChoice
  prompt: |
    Which of the following halide compounds is **insoluble** in water?
  choices:
  - id: a
    text: $NaCl$
  - id: b
    text: $PbCl_2$
  - id: c
    text: $KBr$
  - id: d
    text: $CaI_2$
  answer:
    choiceId: b
  explanation: |
    Most chlorides, bromides, and iodides are soluble. The exceptions are salts containing $Ag^+$, $Pb^{2+}$, and $Hg_2^{2+}$. Therefore, lead(II) chloride ($PbCl_2$) is insoluble.
  skills:
  - solubility-rules

# Part 2: Predicting if a Precipitate Forms (Yes/No scenarios)
- id: sol-pred-1
  title: Predicting Precipitation (Nitrates and Chlorides)
  type: multipleChoice
  prompt: |
    Will a precipitate form when aqueous solutions of sodium chloride ($NaCl$) and potassium nitrate ($KNO_3$) are mixed?
  choices:
  - id: a
    text: Yes
  - id: b
    text: No
  answer:
    choiceId: b
  explanation: |
    The possible products from a double replacement reaction are $NaNO_3$ and $KCl$. Both of these are composed of Group 1 metals, making them completely soluble. No precipitate will form.
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-pred-2
  title: Predicting Precipitation (Silver Halide)
  type: multipleChoice
  prompt: |
    Will a precipitate form when aqueous solutions of silver nitrate ($AgNO_3$) and sodium bromide ($NaBr$) are mixed?
  choices:
  - id: a
    text: Yes
  - id: b
    text: No
  answer:
    choiceId: a
  explanation: |
    The possible products are sodium nitrate ($NaNO_3$, soluble) and silver bromide ($AgBr$). Silver halides are insoluble, so $AgBr(s)$ will precipitate.
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-pred-3
  title: Predicting Precipitation (Barium Sulfate)
  type: multipleChoice
  prompt: |
    Will a precipitate form when aqueous solutions of barium chloride ($BaCl_2$) and sodium sulfate ($Na_2SO_4$) are mixed?
  choices:
  - id: a
    text: Yes
  - id: b
    text: No
  answer:
    choiceId: a
  explanation: |
    The products are sodium chloride ($NaCl$, soluble) and barium sulfate ($BaSO_4$). Barium sulfate is a classic exception to the sulfate solubility rule and is highly insoluble, forming a precipitate.
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-pred-4
  title: Predicting Precipitation (Two Soluble Products)
  type: multipleChoice
  prompt: |
    Will a precipitate form when aqueous solutions of lithium sulfide ($Li_2S$) and ammonium chloride ($NH_4Cl$) are mixed?
  choices:
  - id: a
    text: Yes
  - id: b
    text: No
  answer:
    choiceId: b
  explanation: |
    The products would be lithium chloride ($LiCl$) and ammonium sulfide ($(NH_4)_2S$). Because both products contain either a Group 1 metal ($Li^+$) or the ammonium ion ($NH_4^+$), they are both completely soluble. No precipitate forms.
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-pred-5
  title: Predicting Precipitation (Transition Metal Hydroxide)
  type: multipleChoice
  prompt: |
    Will a precipitate form when aqueous solutions of copper(II) sulfate ($CuSO_4$) and sodium hydroxide ($NaOH$) are mixed?
  choices:
  - id: a
    text: Yes
  - id: b
    text: No
  answer:
    choiceId: a
  explanation: |
    The products are sodium sulfate ($Na_2SO_4$, soluble) and copper(II) hydroxide ($Cu(OH)_2$). Most hydroxides, including transition metal hydroxides, are insoluble, so $Cu(OH)_2$ will precipitate as a solid.
  skills:
  - solubility-rules
  - chemical-reactions-equations

# Part 3: Identifying the Specific Precipitate
- id: sol-id-precip-1
  title: Identifying the Precipitate (Carbonates)
  type: multipleChoice
  prompt: |
    When aqueous solutions of calcium chloride ($CaCl_2$) and sodium carbonate ($Na_2CO_3$) are mixed, a precipitate forms. What is the chemical formula of the precipitate?
  choices:
  - id: a
    text: $NaCl$
  - id: b
    text: $CaCO_3$
  - id: c
    text: $Na_2Cl_2$
  - id: d
    text: $CaNa_2$
  answer:
    choiceId: b
  explanation: |
    The double replacement products are $NaCl$ and $CaCO_3$. All sodium salts are soluble, but most carbonates are insoluble. Therefore, the precipitate is calcium carbonate ($CaCO_3$).
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-id-precip-2
  title: Identifying the Precipitate (Lead Halide)
  type: multipleChoice
  prompt: |
    When aqueous solutions of lead(II) nitrate ($Pb(NO_3)_2$) and potassium iodide ($KI$) are mixed, a bright yellow solid precipitates. What is the precipitate?
  choices:
  - id: a
    text: $KNO_3$
  - id: b
    text: $PbI$
  - id: c
    text: $PbI_2$
  - id: d
    text: $K_2(NO_3)_2$
  answer:
    choiceId: c
  explanation: |
    The products are $KNO_3$ (soluble) and lead(II) iodide. Because the lead ion is $Pb^{2+}$ and the iodide ion is $I^-$, the correct formula for the precipitate is $PbI_2$.
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-id-precip-3
  title: Identifying the Precipitate (Iron Hydroxide)
  type: multipleChoice
  prompt: |
    Aqueous solutions of iron(III) chloride ($FeCl_3$) and potassium hydroxide ($KOH$) are mixed. What is the identity of the precipitate?
  choices:
  - id: a
    text: $KCl$
  - id: b
    text: $Fe(OH)_3$
  - id: c
    text: $FeOH$
  - id: d
    text: $K_3Cl$
  answer:
    choiceId: b
  explanation: |
    The products are $KCl$ (soluble) and iron(III) hydroxide. Since the iron ion is $Fe^{3+}$ and hydroxide is $OH^-$, the precipitate is $Fe(OH)_3$.
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-id-precip-4
  title: Identifying the Precipitate (Silver Sulfate)
  type: multipleChoice
  prompt: |
    Aqueous solutions of silver nitrate ($AgNO_3$) and sodium sulfate ($Na_2SO_4$) are mixed. What is the identity of the precipitate?
  choices:
  - id: a
    text: $Ag_2SO_4$
  - id: b
    text: $AgSO_4$
  - id: c
    text: $NaNO_3$
  - id: d
    text: $Na_2NO_3$
  answer:
    choiceId: a
  explanation: |
    The products are sodium nitrate ($NaNO_3$, soluble) and silver sulfate. Since silver is $Ag^+$ and sulfate is $SO_4^{2-}$, the formula for the precipitate is $Ag_2SO_4$, which is an exception to the sulfate solubility rule.
  skills:
  - solubility-rules
  - chemical-reactions-equations
- id: sol-id-precip-5
  title: Identifying the Precipitate (Strontium Sulfate)
  type: multipleChoice
  prompt: |
    Which precipitate forms when aqueous solutions of strontium bromide ($SrBr_2$) and lithium sulfate ($Li_2SO_4$) are mixed?
  choices:
  - id: a
    text: $LiBr$
  - id: b
    text: $SrSO_4$
  - id: c
    text: $Sr_2SO_4$
  - id: d
    text: No precipitate forms
  answer:
    choiceId: b
  explanation: |
    The products are lithium bromide ($LiBr$, a soluble Group 1 salt) and strontium sulfate. Strontium is a Group 2 metal ($Sr^{2+}$) and is one of the exceptions for sulfate solubility. Thus, $SrSO_4$ is the precipitate.
  skills:
  - solubility-rules
  - chemical-reactions-equations
