workedExamples:
- id: mathematical-literacy-review-worked-example-b-example
  title: Review a quantified conditional
  problem: 'Read: “For every integer n, if n is divisible by 4, then n is even.” Separate its scope, conditional
    direction, and a valid check.'
  steps:
  - id: step-1
    title: Read the scope
    type: freeResponse
    prompt: Which objects does the statement quantify over?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - It quantifies over every integer n.
    explanation: |-
      Solution: It quantifies over every integer n.
      Why it works: The universal quantifier fixes the domain of the claim.
  - id: step-2
    title: Read the direction
    type: freeResponse
    prompt: What condition implies what conclusion?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Divisibility by 4 implies evenness.
    explanation: |-
      Solution: Divisibility by 4 implies evenness.
      Why it works: The hypothesis is divisibility by 4 and the conclusion is evenness.
  - id: step-3
    title: Verify the structural reason
    type: freeResponse
    prompt: Why does divisibility by 4 imply evenness?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - If $n=4k$, then $n=2(2k)$, so n is two times an integer.
    explanation: |-
      Solution: If $n=4k$, then $n=2(2k)$, so n is two times an integer.
      Why it works: Rewriting the hypothesis in the definition of even gives the warranted conclusion.
