questions:
  - id: test-easy-vector-arithmetic
    type: multipleChoice
    prompt: |
      Given $\vec{u} = \begin{bmatrix} 1 \\ 4 \end{bmatrix}$ and $\vec{v} = \begin{bmatrix} 3 \\ -2 \end{bmatrix}$, calculate $\vec{u} - 2\vec{v}$.
    choices:
      - id: c1
        text: '$\begin{bmatrix} -5 \\ 8 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 7 \\ 0 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} -5 \\ 0 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} -2 \\ 8 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      $2\vec{v} = \begin{bmatrix} 6 \\ -4 \end{bmatrix}$. Subtracting this from $\vec{u}$ gives $\begin{bmatrix} 1-6 \\ 4-(-4) \end{bmatrix} = \begin{bmatrix} -5 \\ 8 \end{bmatrix}$.

  - id: test-easy-linear-combination-def
    type: selectAll
    prompt: |
      If $\vec{y}$ is a linear combination of $\vec{v}_1, \vec{v}_2, \vec{v}_3$, which of the following could be the expression for $\vec{y}$? (Select all that apply)
    choices:
      - id: c1
        text: '$\vec{y} = 2\vec{v}_1 - \vec{v}_2 + 0.5\vec{v}_3$'
      - id: c2
        text: '$\vec{y} = \vec{v}_1$'
      - id: c3
        text: '$\vec{y} = \vec{0}$'
      - id: c4
        text: '$\vec{y} = \vec{v}_1 \vec{v}_2 + \vec{v}_3$'
    answer:
      choiceIds:
        - c1
        - c2
        - c3
    explanation: |
      A linear combination only involves adding vectors that have been scaled by constants. Options A, B (weights 1,0,0) and C (weights 0,0,0) are all valid. Vectors cannot be multiplied together in this way.

  - id: test-easy-matrix-dimensions
    type: multipleChoice
    prompt: |
      Matrix $A$ is $5 \times 2$. Matrix $B$ is $2 \times 5$. What are the dimensions of $BA$?
    choices:
      - id: c1
        text: '$2 \times 2$'
      - id: c2
        text: '$5 \times 5$'
      - id: c3
        text: '$5 \times 2$'
      - id: c4
        text: 'Undefined'
    answer:
      choiceId: c1
    explanation: |
      The product $BA$ means multiplying a $(2 \times 5)$ by a $(5 \times 2)$. The inner dimensions (5) match, so the result is $(2 \times 2)$.

  - id: test-easy-matrix-vector-calc
    type: multipleChoice
    prompt: |
      Compute $\begin{bmatrix} 1 & 0 & -2 \\ 3 & 1 & 4 \end{bmatrix} \begin{bmatrix} 2 \\ -1 \\ 1 \end{bmatrix}$.
    choices:
      - id: c1
        text: '$\begin{bmatrix} 0 \\ 9 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 4 \\ 9 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 0 \\ 8 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 2 & 0 & -2 \\ 6 & -1 & 4 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      Row 1: $(1)(2) + (0)(-1) + (-2)(1) = 2 + 0 - 2 = 0$.
      Row 2: $(3)(2) + (1)(-1) + (4)(1) = 6 - 1 + 4 = 9$.

  - id: test-easy-matrix-addition-prop
    type: multipleChoice
    prompt: |
      Matrix addition is commutative. This means that for any two matrices $A$ and $B$ of the same dimension:
    choices:
      - id: c1
        text: '$A + B = B + A$'
      - id: c2
        text: '$A + B = 0$'
      - id: c3
        text: '$(A+B)+C = A+(B+C)$'
      - id: c4
        text: '$A - B = B - A$'
    answer:
      choiceId: c1
    explanation: |
      Commutativity means the order of the operands does not change the result. $(A+B)+C = A+(B+C)$ is the associative property.

  - id: test-easy-matrix-transpose-def
    type: multipleChoice
    prompt: |
      If $A = \begin{bmatrix} 1 & 2 \\ 3 & 4 \\ 5 & 6 \end{bmatrix}$, what is $A^T$?
    choices:
      - id: c1
        text: '$\begin{bmatrix} 1 & 3 & 5 \\ 2 & 4 & 6 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 5 & 6 \\ 3 & 4 \\ 1 & 2 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 2 & 1 \\ 4 & 3 \\ 6 & 5 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 1 & 4 \\ 3 & 6 \\ 5 & 2 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      The transpose swaps rows and columns. The first row $[1 \ 2]$ becomes the first column, etc.

  - id: test-easy-zero-matrix-product
    type: multipleChoice
    prompt: |
      If $A$ is a $3 \times 3$ matrix and $0_{3 \times 3}$ is the $3 \times 3$ zero matrix, what is $A \cdot 0_{3 \times 3}$?
    choices:
      - id: c1
        text: '$0_{3 \times 3}$'
      - id: c2
        text: '$A$'
      - id: c3
        text: 'Undefined'
      - id: c4
        text: 'The Identity Matrix $I$'
    answer:
      choiceId: c1
    explanation: |
      Multiplying any matrix by the appropriately sized zero matrix results in the zero matrix.
