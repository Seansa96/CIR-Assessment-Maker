workedExamples:
- id: we01
  title: A line family and its envelope
  problem: Analyze $y=cx-c^2$.
  steps:
  - id: we01-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Eliminate the parameter locally.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - differentiate
      - eliminate c
    explanation: |-
      Solution: $y'=c$, hence $y=xy'-(y')^2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Find the envelope.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - stationary parameter
      - envelope
    explanation: |-
      Solution: $x-2c=0$ gives $c=x/2$ and envelope $y=x^2/4$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Verify tangency.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - same point
      - same slope
    explanation: |-
      Solution: At $x=2c$, the envelope slope $x/2=c$ equals the line slope, so each line is tangent there.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: A fixed tangent intercept
  problem: Find curves whose tangent always meets the x-axis at fixed $a$.
  steps:
  - id: we02-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Translate the geometry.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - intercept
      - slope equation
    explanation: |-
      Solution: Point-slope form at the intercept gives $y'=y/(x-a)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Solve the ODE.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - separation
      - family
    explanation: |-
      Solution: $dy/y=dx/(x-a)$, so $y=C(x-a)$ on intervals not crossing $a$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Check the geometry.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - substitution
      - geometric check
    explanation: |-
      Solution: Each solution is itself a line through $(a,0)$, so every tangent has the required intercept.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Circles and radial trajectories
  problem: Find trajectories orthogonal to $x^2+y^2=c^2$.
  steps:
  - id: we03-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Find the circle slope.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - differentiate
      - regular region
    explanation: |-
      Solution: Differentiation gives $y'=-x/y$ where $y\ne0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Use the negative reciprocal.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - perpendicular slope
      - ODE
    explanation: |-
      Solution: Orthogonal curves satisfy $y'=y/x$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Integrate and interpret.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - family
      - axis warning
      - field interpretation
    explanation: |-
      Solution: $dy/y=dx/x$ gives $y=Cx$, radial lines that cross concentric circles normally; axis cases are included geometrically.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
