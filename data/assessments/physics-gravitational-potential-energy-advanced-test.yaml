questions:
- id: q001
  type: numericResponse
  prompt: |
    A projectile is fired vertically upward from the surface of Earth with an initial speed equal to exactly half of Earth's escape velocity ($v_0 = 0.5 v_{esc}$).
    Ignoring air resistance and Earth's rotation, calculate the maximum distance from the center of the Earth the projectile will reach, expressed as a multiple of Earth's radius $R$.
    (Enter the numeric coefficient of $R$).
  answer:
    value: 1.333
    tolerance: 0.05
  explanation: |
    Solution:
    $E_i = E_f \implies \frac{1}{2}m(0.5 v_{esc})^2 - G\frac{Mm}{R} = 0 - G\frac{Mm}{r_{max}}$
    Since $v_{esc} = \sqrt{2GM/R}$, $v_{esc}^2 = 2GM/R$.
    Substitute into the kinetic energy term:
    $\frac{1}{2}m(0.25 \times \frac{2GM}{R}) = 0.25 \frac{GMm}{R} = \frac{1}{4} \frac{GMm}{R}$.
    So, $\frac{1}{4} \frac{GMm}{R} - \frac{GMm}{R} = -\frac{GMm}{r_{max}}$
    $-\frac{3}{4} \frac{GMm}{R} = -\frac{GMm}{r_{max}}$
    $r_{max} = \frac{4}{3} R \approx 1.333 R$.
    
    Why it works:
    By writing the initial velocity in terms of the escape velocity, the kinetic energy term simplifies nicely into a fraction of the initial potential energy, making the algebraic solution straightforward.
  difficultyDimensions:
  - RepresentationTransfer
  - IdentityConstruction
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    Two stars of mass $M$ and $2M$ are initially at rest, separated by a distance $d$. 
    They are released and fall toward each other under mutual gravity. 
    Write an expression for the speed $v_1$ of the lighter star (mass $M$) at the instant when the separation between the stars is $d/2$.
    Use `G`, `M`, and `d`.
  answer:
    expectedLatex: \sqrt{\frac{8GM}{3d}}
    equivalenceMode: expression
    variables: [G, M, d]
    tolerance: 0.00001
    keyPoints:
    - sqrt(8GM / (3d))
  explanation: |
    Solution:
    $v_1 = \sqrt{\frac{8GM}{3d}}$
    
    Why it works:
    Conservation of momentum: Initially at rest, so $p_i = 0$. Thus $Mv_1 = 2Mv_2 \implies v_2 = v_1/2$.
    Conservation of energy: $E_i = E_f$.
    $0 - G\frac{M(2M)}{d} = \frac{1}{2}Mv_1^2 + \frac{1}{2}(2M)v_2^2 - G\frac{M(2M)}{d/2}$
    $- \frac{2GM^2}{d} = \frac{1}{2}Mv_1^2 + M(v_1/2)^2 - \frac{4GM^2}{d}$
    Bring potential energy to one side:
    $\frac{4GM^2}{d} - \frac{2GM^2}{d} = \frac{1}{2}Mv_1^2 + \frac{1}{4}Mv_1^2$
    $\frac{2GM^2}{d} = \frac{3}{4}Mv_1^2$
    $v_1^2 = \frac{8GM^2}{3Md} = \frac{8GM}{3d}$
    Wait, let's re-verify:
    $-2G M^2 / d = 1/2 M v_1^2 + 1/2 (2M) (v_1 / 2)^2 - 4G M^2 / d$
    $2G M^2 / d = 1/2 M v_1^2 + 1/4 M v_1^2 = 3/4 M v_1^2$
    $v_1 = \sqrt{8GM / (3d)}$.
    
    Ah, I need to correct my expected output in the explanation! $v_1 = \sqrt{\frac{8GM}{3d}}$.
    Because $\frac{2GM}{d} \times \frac{4}{3} = \frac{8GM}{3d}$.
    Let's ensure the solution block matches this.
