workedExamples:
- id: we001
  title: Analyze shape, then accumulate
  problem: |
    Analyze $f(x)=x^3-3x^2+2$, then build a right-endpoint Riemann sum for $\int_0^2(x+1)\,dx$.
  steps:
  - id: graph-riemann-s001
    title: Critical points
    instruction: |
      Differentiate $x^3-3x^2+2$ and factor.
    type: symbolicResponse
    prompt: |
      What is $f'(x)$?
    answer:
      expectedLatex: 3x^2-6x
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0.000001
    explanation: |
      $f'(x)=3x(x-2)$, so $0$ and $2$ are critical points.
  - id: graph-riemann-s002
    title: Concavity
    instruction: |
      Differentiate again.
    type: symbolicResponse
    prompt: |
      What is $f''(x)$?
    answer:
      expectedLatex: 6x-6
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0.000001
    explanation: |
      $f''(x)=6x-6$, so concavity changes at $x=1$.
  - id: graph-riemann-s003
    title: Riemann width
    instruction: |
      For $n$ equal pieces on $[0,2]$, compute the width.
    type: symbolicResponse
    prompt: |
      What is $\Delta x$?
    answer:
      expectedLatex: 2/n
      equivalenceMode: expression
      variables:
      - n
      tolerance: 0.000001
    explanation: |
      $\Delta x=(2-0)/n=2/n$.
  - id: graph-riemann-s004
    title: Exact integral
    instruction: |
      After understanding the accumulation, use an antiderivative.
    type: numericResponse
    prompt: |
      What is $\int_0^2(x+1)\,dx$?
    answer:
      value: 4
      tolerance: 0.000001
    explanation: |
      $[x^2/2+x]_0^2=4$.
