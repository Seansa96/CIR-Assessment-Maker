questions:
  - id: eq-compute-dot-product
    type: numericResponse
    prompt: |
      Compute $\vec{u} \cdot \vec{v}$ where $\vec{u} = \begin{bmatrix}2\\-1\\4\end{bmatrix}$ and $\vec{v} = \begin{bmatrix}3\\5\\-1\end{bmatrix}$.
    answer:
      value: -3
      tolerance: 0
    explanation: |
      $\vec{u}\cdot\vec{v} = (2)(3)+(-1)(5)+(4)(-1) = 6-5-4 = -3$.

  - id: eq-norm
    type: numericResponse
    prompt: |
      Find $\|\vec{v}\|$ where $\vec{v} = \begin{bmatrix}3\\-4\end{bmatrix}$.
    answer:
      value: 5
      tolerance: 0
    explanation: |
      $\|\vec{v}\| = \sqrt{3^2+(-4)^2} = \sqrt{9+16} = \sqrt{25} = 5$.

  - id: eq-projection-1d
    type: multipleChoice
    prompt: |
      Find $\text{proj}_{\vec{u}}\vec{y}$ where $\vec{y} = \begin{bmatrix}4\\3\end{bmatrix}$ and $\vec{u} = \begin{bmatrix}2\\0\end{bmatrix}$.
    choices:
      - id: c1
        text: '$\begin{bmatrix}4\\0\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}2\\3\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}4\\3\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}2\\0\end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      $\frac{\vec{y}\cdot\vec{u}}{\vec{u}\cdot\vec{u}}\vec{u} = \frac{(4)(2)+(3)(0)}{4+0}\begin{bmatrix}2\\0\end{bmatrix} = \frac{8}{4}\begin{bmatrix}2\\0\end{bmatrix} = 2\begin{bmatrix}2\\0\end{bmatrix} = \begin{bmatrix}4\\0\end{bmatrix}$.

  - id: eq-orthogonal-set
    type: multipleChoice
    prompt: |
      Which of the following is an orthogonal set in $\mathbb{R}^3$?
    choices:
      - id: c1
        text: '$\left\{ \begin{bmatrix}1\\0\\0\end{bmatrix},\ \begin{bmatrix}0\\1\\0\end{bmatrix},\ \begin{bmatrix}0\\0\\1\end{bmatrix} \right\}$'
      - id: c2
        text: '$\left\{ \begin{bmatrix}1\\1\\0\end{bmatrix},\ \begin{bmatrix}0\\1\\1\end{bmatrix} \right\}$'
      - id: c3
        text: '$\left\{ \begin{bmatrix}1\\2\\3\end{bmatrix},\ \begin{bmatrix}1\\-1\\1\end{bmatrix} \right\}$'
      - id: c4
        text: '$\left\{ \begin{bmatrix}3\\0\\1\end{bmatrix},\ \begin{bmatrix}0\\2\\1\end{bmatrix} \right\}$'
    answer:
      choiceId: c1
    explanation: |
      The standard basis vectors $\{\vec{e}_1, \vec{e}_2, \vec{e}_3\}$ are mutually perpendicular (in fact, orthonormal). Checking option B: $(1)(0)+(1)(1)+(0)(1) = 1 \neq 0$. Option C: $(1)(1)+(2)(-1)+(3)(1) = 1-2+3 = 2 \neq 0$. Option D: $(3)(0)+(0)(2)+(1)(1) = 1 \neq 0$.
