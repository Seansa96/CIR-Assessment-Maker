workedExamples:
- id: we01
  title: Potential at the center of a square charge array
  problem: A square of side 0.200 m has corner charges +2.0 nC, +2.0 nC, -1.0 nC, and -1.0 nC. Find the electric
    potential at its center and the potential energy of a -3.0 nC test charge placed there.
  steps:
  - id: 01-distance
    title: What is the distance from the center to any corn
    instruction: What is the distance from the center to any corner?
    prompt: What is the distance from the center to any corner?
    type: numericResponse
    choices: []
    answer:
      value: 0.141421
      tolerance: 0.0002
    explanation: 'Solution: r=a/sqrt(2)=0.1414 m.


      Why it works: All four corners are equidistant from the center.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-electric-potential
  - id: 01-potential
    title: Find the net potential at the center.
    instruction: Find the net potential at the center.
    prompt: Find the net potential at the center.
    type: numericResponse
    choices: []
    answer:
      value: 127.1
      tolerance: 0.3
    explanation: 'Solution: V=k(sum q_i)/r = (8.99e9)(2.0e-9)/0.1414=127 V.


      Why it works: Potential is a scalar, so the signed source charges add before division by the common distance.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-electric-potential
  - id: 01-energy
    title: Find the test charge’s potential energy at the c
    instruction: Find the test charge’s potential energy at the center.
    prompt: Find the test charge’s potential energy at the center.
    type: numericResponse
    choices: []
    answer:
      value: -3.81e-07
      tolerance: 2.0e-09
    explanation: 'Solution: U=qV=(-3.0e-9)(127)=-3.81e-7 J.


      Why it works: The negative test charge makes U negative at positive V.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-electric-potential
  skills:
  - physics2-electric-potential
- id: we02
  title: Potential from two unequal point charges
  problem: At P, a +3.0 nC charge is 0.400 m away and a -2.0 nC charge is 0.200 m away. Find V(P), then the
    potential energy of a +4.0 nC charge placed there.
  steps:
  - id: 02-contributions
    title: Compute the separate signed potential contributi
    instruction: Compute the separate signed potential contributions.
    prompt: Compute the separate signed potential contributions.
    type: numericResponse
    choices: []
    answer:
      value: 67.4
      tolerance: 0.3
    explanation: 'Solution: V_1=+67.4 V and V_2=-89.9 V.


      Why it works: Each point-charge contribution is kq/r, with the source-charge sign retained.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-electric-potential
  - id: 02-net-potential
    title: Find the net potential.
    instruction: Find the net potential.
    prompt: Find the net potential.
    type: numericResponse
    choices: []
    answer:
      value: -22.5
      tolerance: 0.2
    explanation: 'Solution: V_net=67.4-89.9=-22.5 V.


      Why it works: Scalar potentials add algebraically.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-electric-potential
  - id: 02-test-energy
    title: Find the test charge’s potential energy.
    instruction: Find the test charge’s potential energy.
    prompt: Find the test charge’s potential energy.
    type: numericResponse
    choices: []
    answer:
      value: -9.0e-08
      tolerance: 1.0e-09
    explanation: 'Solution: U=qV=(4.0e-9)(-22.5)=-9.0e-8 J.


      Why it works: The sign is set by the product of positive test charge and negative potential.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-electric-potential
  skills:
  - physics2-electric-potential
