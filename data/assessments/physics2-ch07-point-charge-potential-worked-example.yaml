id: physics2-ch07-point-charge-potential-worked-example
title: Potential of a Point Charge Array
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-electric-potential
workedExamples:
- id: we1
  title: Two charges on the x-axis
  prompt: A charge $q_1 = +2.0\text{ }\mu\text{C}$ is at $x = -1.0\text{ m}$, and
    $q_2 = -4.0\text{ }\mu\text{C}$ is at $x = +1.0\text{ m}$. Find the total electric
    potential at the origin ($x=0$).
  steps:
  - id: s1
    prompt: Sum the individual potentials.
    explanation: 'Solution:

      1) Use $V = V_1 + V_2 = k \frac{q_1}{r_1} + k \frac{q_2}{r_2}$.

      2) Distance $r_1 = 1.0\text{ m}$ and $r_2 = 1.0\text{ m}$.

      3) $V = (9 \times 10^9) \left( \frac{2 \times 10^{-6}}{1} + \frac{-4 \times
      10^{-6}}{1} \right)$.

      4) $V = (9 \times 10^9) (-2 \times 10^{-6}) = -18 \times 10^3 = -18000\text{
      V}$.


      Why it works:

      Electric potential is a scalar quantity, so we simply add the values algebraically,
      keeping the signs of the charges.'
