glossary:
  introduction: Core terms for the small-angle model of simple and physical pendulums.
  sections:
  - id: pendulum-terms
    title: Core terms
    entries:
    - {id: simple-pendulum, term: simple pendulum, definition: 'A point mass on a massless inextensible string swinging in a vertical plane.', drills: [{id: simple-pendulum-drill, type: typed, prompt: 'What idealized system is a point mass on a light string?', answer: simple pendulum}]}
    - {id: small-angle, term: small-angle approximation, definition: 'The approximation $\sin\theta\approx\theta$ for small angular displacements in radians.', drills: [{id: small-angle-drill, type: cloze, prompt: 'For small angles, $\sin\theta\approx{{\theta}}$.', answer: '\theta'}]}
    - {id: period, term: period, definition: 'The time for one complete oscillation; for a simple pendulum $T=2\pi\sqrt{L/g}$.', drills: [{id: period-drill, type: typed, prompt: 'What symbol represents the period?', answer: T}]}
    - {id: physical-pendulum, term: physical pendulum, definition: 'A rigid body oscillating about a pivot, with period depending on moment of inertia and center-of-mass distance.', drills: [{id: physical-pendulum-drill, type: cloze, prompt: 'A rigid object oscillating about a pivot is a {{physical pendulum}}.', answer: physical pendulum}]}
