questions:
- id: q001
  type: multipleChoice
  prompt: A text defines an integer n to be even when $n=2k$ for some integer k. If n is even, which fact may you
    immediately use?
  choices:
  - id: a
    text: There is an integer k with $n=2k$.
  - id: b
    text: n is prime.
    issueSignals:
    - id: definition-error
  - id: c
    text: n is positive.
    issueSignals:
    - id: definition-error
  - id: d
    text: n is divisible by 4.
    issueSignals:
    - id: definition-error
  answer:
    choiceId: a
  issueSignals:
  - id: definition-error
  difficultyDimensions:
  - representationTransfer
  - proofJustification
  difficultyEvidence: Unpacks a definition into the precise fact it licenses without importing stronger properties.
  explanation: |-
    Solution: There exists an integer k such that $n=2k$.
    Why it works: That is exactly what the definition of even supplies.
    Why the other choices fail: Even integers need not be prime, positive, or divisible by 4.
- id: q002
  type: multipleChoice
  prompt: A theorem says, “If $f$ is continuous at a, then $f$ is bounded on some interval around a.” What must
    be checked before using its conclusion?
  choices:
  - id: a
    text: That f is continuous at a.
  - id: b
    text: That f has a graph.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: That a is an integer.
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: That f is bounded everywhere.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - proofJustification
  - domainCondition
  difficultyEvidence: Identifies the theorem hypothesis and avoids using a stronger conclusion than stated.
  explanation: |-
    Solution: Check that f is continuous at a.
    Why it works: A conditional theorem grants its conclusion only when its hypothesis has been established.
    Why the other choices fail: B and C are irrelevant, while D is a stronger claim than the theorem concludes.
- id: q003
  type: multipleChoice
  prompt: 'A student checks that $2^2\ge2$, $3^2\ge3$, and $4^2\ge4$, then says “therefore $n^2\ge n$ for every
    positive integer n.” What is missing?'
  choices:
  - id: a
    text: A general argument covering every positive integer.
  - id: b
    text: One more numerical example.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: A definition of squaring.
    issueSignals:
    - id: example-as-proof
  - id: d
    text: A counterexample proving the claim false.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - proofJustification
  - errorDiagnosis
  difficultyEvidence: Distinguishes evidence from several examples from proof of a universal statement.
  explanation: |-
    Solution: The student needs a general argument that handles arbitrary positive n.
    Why it works: Finite examples illustrate a universal claim but do not cover all its cases.
    Why the other choices fail: B still leaves infinitely many cases unchecked, C is already understood, and D would serve a different purpose.
- id: q004
  type: multipleChoice
  prompt: Which is a counterexample to “Every integer is even”?
  choices:
  - id: a
    text: The integer 3.
  - id: b
    text: The number $1/2$.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: 'The set $\{3\}$.'
    issueSignals:
    - id: example-as-proof
  - id: d
    text: The fact that 2 is even.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Requires a case inside the claim's domain that violates its stated property.
  explanation: |-
    Solution: 3 is an integer and it is not even.
    Why it works: One permitted object that violates a universal statement refutes it.
    Why the other choices fail: B and C are outside the relevant domain, while D confirms rather than contradicts the claim.
- id: q005
  type: multipleChoice
  prompt: When reading a mathematical text, how do you fundamentally distinguish a definition from a theorem?
  choices:
  - id: a
    text: A definition declares the meaning of a new term and cannot be proven, while a theorem makes a claim that
      requires a proof.
  - id: b
    text: A definition is always an 'if and only if' statement, while a theorem is always an 'if-then' statement.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: c
    text: Definitions are used to solve problems, while theorems are used to prove other theorems.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: A theorem is universally true, but a definition only applies to specific examples.
    issueSignals:
    - id: mathematical-structure-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - logicalEquivalence
  difficultyEvidence: Distinguishes between declarative nomenclature (definitions) and provable logical consequences
    (theorems).
  explanation: |-
    Solution: A definition declares the meaning of a new term and cannot be proven, while a theorem makes a claim that requires a proof.
    Why it works: Definitions establish vocabulary and the exact conditions required to use a term. They are agreements, not truths. Theorems assert logical consequences that follow from definitions and axioms, and therefore must be justified.
    Why the other choices fail: B is incorrect because theorems can also be biconditional ('if and only if'). C is too restrictive; definitions are heavily used in proofs. D misunderstands that definitions define universally applicable classes.
- id: q006
  type: multipleChoice
  prompt: A student finds an object that satisfies the hypothesis of a proposed theorem, but fails to satisfy its
    conclusion. What is the status of this object?
  choices:
  - id: a
    text: It is a counterexample that disproves the proposed theorem entirely.
  - id: b
    text: It is an exception, meaning the theorem is true except for this specific case.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: It proves that the hypothesis is too broad and must be rewritten.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: It shows that the converse of the theorem is false.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  - truthTableApplication
  difficultyEvidence: Applies the definition of a counterexample to a universally quantified conditional statement.
  explanation: |-
    Solution: It is a counterexample that disproves the proposed theorem entirely.
    Why it works: A theorem of the form 'For all $x$, if $P(x)$ then $Q(x)$' claims that *every* object satisfying the hypothesis $P$ must also satisfy the conclusion $Q$. A single object where $P$ is true but $Q$ is false proves the universal claim is false.
    Why the other choices fail: B treats mathematics like empirical science where 'exceptions' exist; in math, an exception breaks the theorem. C blames the hypothesis rather than concluding the theorem itself is false. D incorrectly analyzes the converse, which involves $Q$ being true and $P$ being false.
- id: q007
  type: multipleChoice
  prompt: In the theorem 'If a sequence of real numbers is bounded and monotonic, then it converges', what is the
    role of the phrase 'of real numbers'?
  choices:
  - id: a
    text: It specifies the domain or universe of discourse for the objects being considered.
  - id: b
    text: It is part of the conclusion, asserting that the limit must be a real number.
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: It is the primary hypothesis, with bounded and monotonic being secondary.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: It is a definition embedded within the theorem.
    issueSignals:
    - id: mathematical-structure-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Isolates the domain declaration from the logical hypotheses in a mathematical sentence.
  explanation: |-
    Solution: It specifies the domain or universe of discourse for the objects being considered.
    Why it works: Before applying conditions (bounded, monotonic), the theorem establishes the type of objects it applies to: sequences whose terms are real numbers. This sets the universal quantifier's domain.
    Why the other choices fail: B misplaces the domain declaration into the conclusion. C invents a hierarchy of hypotheses that doesn't exist logically. D confuses a domain constraint with a formal definition.
- id: q008
  type: multipleChoice
  prompt: What is the primary pedagogical purpose of providing an example immediately after a complex mathematical
    definition?
  choices:
  - id: a
    text: To prove that the set of objects satisfying the definition is not empty, and to ground the abstract conditions.
  - id: b
    text: To serve as the base case for future proofs by induction.
    issueSignals:
    - id: mathematical-role-confusion
  - id: c
    text: To replace the formal definition with an easier, intuitive concept.
    issueSignals:
    - id: mathematical-role-confusion
  - id: d
    text: To prove that the definition is logically consistent.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-role-confusion
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Identifies the structural role of examples in mathematical exposition.
  explanation: |-
    Solution: To prove that the set of objects satisfying the definition is not empty, and to ground the abstract conditions.
    Why it works: Definitions can inadvertently describe empty sets (e.g., 'a prime number divisible by 4'). An immediate example proves the definition actually describes something that exists, while helping the reader parse the formal conditions.
    Why the other choices fail: B arbitrarily restricts examples to inductive proofs. C falsely suggests examples can replace formal definitions. D is incorrect because an example doesn't prove full logical consistency of the abstract theory, only non-emptiness.
- id: q009
  type: multipleChoice
  prompt: If an integer n is defined to be even when n=2k for some integer k, which fact verifies that 14 is even?
  choices:
  - id: a
    text: $14=2(7)$ and 7 is an integer.
  - id: b
    text: 14 is greater than 2.
    issueSignals:
    - id: magnitude-for-definition-substituted
  - id: c
    text: 14 has two digits.
    issueSignals:
    - id: superficial-pattern-for-definition
  - id: d
    text: 14 can be divided by 7.
    issueSignals:
    - id: wrong-factorization-criterion
  answer:
    choiceId: a
  issueSignals:
  - id: wrong-factorization-criterion
  difficultyDimensions:
  - definitionApplication
  - representationTransfer
  difficultyEvidence: Matches a concrete integer to the existential factorization required by the definition.
  explanation: |-
    Solution: Use k=7 to write $14=2k$.
    Why it works: The definition asks for an integer witness k, and 7 supplies one.
    Why the other choices fail: B and C are irrelevant properties, while D gives a factorization that does not establish a factor of 2.
- id: q010
  type: multipleChoice
  prompt: Which conclusion follows from the definition that an odd integer has the form $2k+1$ for an integer k?
  choices:
  - id: a
    text: If $m=2(4)+1$, then m is odd.
  - id: b
    text: If m is odd, then m must equal 9.
    issueSignals:
    - id: existential-witness-made-unique
  - id: c
    text: Every integer of the form $2k$ is odd.
    issueSignals:
    - id: even-odd-form-confused
  - id: d
    text: An integer is odd only when its decimal form ends in 1.
    issueSignals:
    - id: base-ten-pattern-for-definition
  answer:
    choiceId: a
  issueSignals:
  - id: even-odd-form-confused
  difficultyDimensions:
  - definitionApplication
  - representationTransfer
  difficultyEvidence: Applies the biconditional force of a definition written in conditional wording to a supplied witness form.
  explanation: |-
    Solution: $m=2(4)+1$ has the defining odd form.
    Why it works: Any integer equal to twice an integer plus one is odd by definition.
    Why the other choices fail: B makes one example unique, C uses the even form, and D substitutes a base-ten pattern for the definition.
