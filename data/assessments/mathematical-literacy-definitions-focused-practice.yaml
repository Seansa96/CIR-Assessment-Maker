questions:
  - id: q001
    type: multipleChoice
    prompt: A text defines an integer n to be even when $n=2k$ for some integer k. If n is even, which fact may you immediately use?
    choices:
      - { id: a, text: 'There is an integer k with $n=2k$.' }
      - { id: b, text: 'n is prime.', issueSignals: [{ id: definition-error }] }
      - { id: c, text: 'n is positive.', issueSignals: [{ id: definition-error }] }
      - { id: d, text: 'n is divisible by 4.', issueSignals: [{ id: definition-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: definition-error }]
    difficultyDimensions: [representationTransfer, proofJustification]
    difficultyEvidence: Unpacks a definition into the precise fact it licenses without importing stronger properties.
    explanation: |
      Solution: There exists an integer k such that $n=2k$.
      Why it works: That is exactly what the definition of even supplies.
      Why the other choices fail: Even integers need not be prime, positive, or divisible by 4.
  - id: q002
    type: multipleChoice
    prompt: A theorem says, “If $f$ is continuous at a, then $f$ is bounded on some interval around a.” What must be checked before using its conclusion?
    choices:
      - { id: a, text: 'That f is continuous at a.' }
      - { id: b, text: 'That f has a graph.', issueSignals: [{ id: unjustified-inference }] }
      - { id: c, text: 'That a is an integer.', issueSignals: [{ id: unjustified-inference }] }
      - { id: d, text: 'That f is bounded everywhere.', issueSignals: [{ id: unjustified-inference }] }
    answer: { choiceId: a }
    issueSignals: [{ id: unjustified-inference }]
    difficultyDimensions: [proofJustification, domainCondition]
    difficultyEvidence: Identifies the theorem hypothesis and avoids using a stronger conclusion than stated.
    explanation: |
      Solution: Check that f is continuous at a.
      Why it works: A conditional theorem grants its conclusion only when its hypothesis has been established.
      Why the other choices fail: B and C are irrelevant, while D is a stronger claim than the theorem concludes.
  - id: q003
    type: multipleChoice
    prompt: A student checks that $2^2\ge2$, $3^2\ge3$, and $4^2\ge4$, then says “therefore $n^2\ge n$ for every positive integer n.” What is missing?
    choices:
      - { id: a, text: 'A general argument covering every positive integer.' }
      - { id: b, text: 'One more numerical example.', issueSignals: [{ id: example-as-proof }] }
      - { id: c, text: 'A definition of squaring.', issueSignals: [{ id: example-as-proof }] }
      - { id: d, text: 'A counterexample proving the claim false.', issueSignals: [{ id: example-as-proof }] }
    answer: { choiceId: a }
    issueSignals: [{ id: example-as-proof }]
    difficultyDimensions: [proofJustification, errorDiagnosis]
    difficultyEvidence: Distinguishes evidence from several examples from proof of a universal statement.
    explanation: |
      Solution: The student needs a general argument that handles arbitrary positive n.
      Why it works: Finite examples illustrate a universal claim but do not cover all its cases.
      Why the other choices fail: B still leaves infinitely many cases unchecked, C is already understood, and D would serve a different purpose.
  - id: q004
    type: multipleChoice
    prompt: Which is a counterexample to “Every integer is even”?
    choices:
      - { id: a, text: 'The integer 3.' }
      - { id: b, text: 'The number $1/2$.', issueSignals: [{ id: example-as-proof }] }
      - { id: c, text: 'The set $\{3\}$.', issueSignals: [{ id: example-as-proof }] }
      - { id: d, text: 'The fact that 2 is even.', issueSignals: [{ id: example-as-proof }] }
    answer: { choiceId: a }
    issueSignals: [{ id: example-as-proof }]
    difficultyDimensions: [domainCondition, errorDiagnosis]
    difficultyEvidence: Requires a case inside the claim's domain that violates its stated property.
    explanation: |
      Solution: 3 is an integer and it is not even.
      Why it works: One permitted object that violates a universal statement refutes it.
      Why the other choices fail: B and C are outside the relevant domain, while D confirms rather than contradicts the claim.
