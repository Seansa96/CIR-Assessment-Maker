schemaVersion: 1
id: aops-complex-numbers-test
title: Complex Numbers Chapter Test
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-complex-numbers
modeDefault: scored
randomizeQuestions: true
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - art-of-problem-solving
  - aops-complex-numbers
  - complex-equations
  - complex-division
  - complex-proof
skills:
- Carry out multi-step complex arithmetic accurately
- Solve complex equations using conjugates and components
- Use modulus and conjugate structure in arguments
- Prove statements from standard form
questions:
- id: q001
  type: multipleChoice
  prompt: 'Evaluate $i^{2027}$.'
  choices:
  - id: a
    text: '$1$'
  - id: b
    text: '$i$'
  - id: c
    text: '$-1$'
  - id: d
    text: '$-i$'
  answer:
    choiceId: d
  explanation: The exponent leaves remainder 3 modulo 4, and $i^3=-i$.
- id: q002
  type: multipleChoice
  prompt: 'Compute $(4+i)(4-i)(2+i)$.'
  choices:
  - id: a
    text: '$34+17i$'
  - id: b
    text: '$30+17i$'
  - id: c
    text: '$17+34i$'
  - id: d
    text: '$34-17i$'
  answer:
    choiceId: a
  explanation: |-
    Collapse the conjugate pair first: $(4+i)(4-i)=17$.
- id: q003
  type: multipleChoice
  prompt: 'Write $(1-i)^3$ in standard form.'
  choices:
  - id: a
    text: '$-2-2i$'
  - id: b
    text: '$2-2i$'
  - id: c
    text: '$-2+2i$'
  - id: d
    text: '$2+2i$'
  answer:
    choiceId: a
  explanation: $(1-i)^2=-2i$, and $-2i(1-i)=-2-2i$.
- id: q004
  type: multipleChoice
  prompt: 'If $z=1+i$, what is $z^4$?'
  choices:
  - id: a
    text: '$4$'
  - id: b
    text: '$-4$'
  - id: c
    text: '$4i$'
  - id: d
    text: '$-4i$'
  answer:
    choiceId: b
  explanation: $z^2=2i$, so $z^4=(2i)^2=-4$.
- id: q005
  type: multipleChoice
  prompt: 'Simplify $\dfrac{3+4i}{1-2i}$.'
  choices:
  - id: a
    text: '$-1+2i$'
  - id: b
    text: '$1-2i$'
  - id: c
    text: '$\dfrac{11+2i}{5}$'
  - id: d
    text: '$-1-2i$'
  answer:
    choiceId: a
  explanation: Multiplication by $1+2i$ gives numerator $-5+10i$ and denominator 5.
- id: q006
  type: multipleChoice
  prompt: 'For real $x$, solve $(x+2i)(x-2i)=13$.'
  choices:
  - id: a
    text: '$x=3$ only'
  - id: b
    text: '$x=-3$ only'
  - id: c
    text: '$x=\pm3$'
  - id: d
    text: '$x=\pm\sqrt{17}$'
  answer:
    choiceId: c
  explanation: The conjugate product is $x^2+4$, so $x^2=9$.
- id: q007
  type: multipleChoice
  prompt: 'A complex number $z$ has $|z|=5$ and real part 4. What are the possible imaginary parts?'
  choices:
  - id: a
    text: '$3$ only'
  - id: b
    text: '$-3$ only'
  - id: c
    text: '$\pm3$'
  - id: d
    text: '$\pm\sqrt{41}$'
  answer:
    choiceId: c
  explanation: If $z=4+bi$, then $25=16+b^2$, so $b=\pm3$.
- id: q008
  type: multipleChoice
  prompt: 'Let $z=5+bi$, where $b$ is real. When does $z+\overline z=10$?'
  choices:
  - id: a
    text: Only when $b=0$
  - id: b
    text: Only when $b=5$
  - id: c
    text: For every real $b$
  - id: d
    text: For no real $b$
  answer:
    choiceId: c
  explanation: The imaginary components cancel, leaving $5+5=10$ for every real $b$.
- id: q009
  type: multipleChoice
  prompt: 'Find every solution of $z^2=8+6i$.'
  choices:
  - id: a
    text: '$z=3+i$ only'
  - id: b
    text: '$z=\pm(3+i)$'
  - id: c
    text: '$z=\pm(3-i)$'
  - id: d
    text: '$z=8+6i$'
  answer:
    choiceId: b
  explanation: $(3+i)^2=9+6i+i^2=8+6i$, and the opposite number has the same square.
- id: q010
  type: multipleChoice
  prompt: 'Solve $\dfrac{z}{1+i}=2-i$.'
  choices:
  - id: a
    text: '$z=1+i$'
  - id: b
    text: '$z=3+i$'
  - id: c
    text: '$z=3-i$'
  - id: d
    text: '$z=1-3i$'
  answer:
    choiceId: b
  explanation: |-
    Multiply by $1+i$: $(2-i)(1+i)=3+i$.
- id: q011
  type: multipleChoice
  prompt: 'Evaluate $i+i^2+i^3+\cdots+i^{100}$.'
  choices:
  - id: a
    text: '$0$'
  - id: b
    text: '$1$'
  - id: c
    text: '$-1$'
  - id: d
    text: '$25i$'
  answer:
    choiceId: a
  explanation: Each consecutive block $i+i^2+i^3+i^4$ sums to zero, and there are 25 blocks.
- id: q012
  type: multipleChoice
  prompt: 'A student writes $(a+bi)^2=a^2+b^2i$. Which correction is complete?'
  choices:
  - id: a
    text: 'The correct form is $a^2-b^2+2abi$.'
  - id: b
    text: 'The correct form is $a^2+b^2+abi$.'
  - id: c
    text: 'Only the sign before $b^2i$ needs changing.'
  - id: d
    text: The original expression is correct.
  answer:
    choiceId: a
  explanation: The binomial square needs the middle term, and $b^2i^2=-b^2$ is real.
- id: q013
  type: selectAll
  prompt: 'Select every statement that holds for all complex $z,w$.'
  choices:
  - id: a
    text: '$\overline{z+w}=\overline z+\overline w$.'
  - id: b
    text: '$z\overline z=|z|^2$.'
  - id: c
    text: '$z=\overline z$ for every complex $z$.'
  - id: d
    text: '$|zw|=|z||w|$.'
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: A number equals its conjugate only when its imaginary part is zero.
- id: q014
  type: selectAll
  prompt: 'Which conditions are equivalent to $a+bi=0$ for real $a,b$?'
  choices:
  - id: a
    text: '$a=0$ and $b=0$'
  - id: b
    text: '$|a+bi|=0$'
  - id: c
    text: '$a+b=0$'
  - id: d
    text: '$(a+bi)(a-bi)=0$'
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: The conjugate product is $a^2+b^2$, which vanishes exactly when both real components vanish.
- id: q015
  type: freeResponse
  prompt: |-
    Let $z=a+bi$ with real $a,b$. Prove that $z+\overline z$ is real and $z-\overline z$ is purely imaginary. State both expressions explicitly.
  answer:
    gradingMode: selfCheck
    expected: |-
      Since $\overline z=a-bi$, addition gives $z+\overline z=2a$, which is real. Subtraction gives $z-\overline z=2bi$, whose real part is zero, so it is purely imaginary.
    keyPoints:
    - Writes the conjugate as $a-bi$.
    - Obtains $z+\overline z=2a$.
    - Obtains $z-\overline z=2bi$ and interprets its components.
  explanation: Conjugation preserves the real component and reverses the imaginary component.
