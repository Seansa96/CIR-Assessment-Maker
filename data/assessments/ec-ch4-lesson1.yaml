- id: l1-sec1
  title: Node-Voltage Method
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Node-Voltage Method
    instruction: The Node-Voltage method uses Kirchhoff's Current Law (KCL) to create
      a system of equations where the unknown variables are the voltages at the essential
      nodes of the circuit relative to a reference node.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l1-sec2
  title: Mesh-Current Method
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Mesh-Current Method
    instruction: The Mesh-Current method uses Kirchhoff's Voltage Law (KVL) to create
      a system of equations where the unknown variables are the currents flowing in
      the independent meshes (loops that don't contain other loops) of a planar circuit.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
