items:
- id: alkali-reactivity
  type: flashcard
  prompt: 'What is the key reactivity pattern for alkali metals?

    '
  answer:
    expected: They are very reactive metals, react strongly with water, and usually
      form 1+ ions.
  explanation: 'Alkali metals have one valence electron. Losing that electron gives
    a stable cation, which explains their common 1+ charge and high reactivity.

    '
  tags:
  - group-properties
  - group-1a
- id: alkaline-earth-reactivity
  type: cloze
  prompt: 'Complete:


    Alkaline earth metals are reactive metals that usually form ____ ions.

    '
  answer:
    expected: 2+
    aliases:
    - 2
  explanation: 'Group 2A metals have two valence electrons and usually lose both to
    form 2+ cations.

    '
  tags:
  - group-properties
  - group-2a
- id: boron-group-property
  type: flashcard
  prompt: 'What is the most important introductory ionic naming fact about the boron
    group?

    '
  answer:
    expected: Aluminum is the key fixed-charge metal and commonly forms Al3+.
  explanation: 'Group 3A contains both metalloids and metals, but for basic ionic
    naming, aluminum''s fixed 3+ charge is the most important pattern.

    '
  tags:
  - group-properties
  - group-3a
- id: carbon-group-property
  type: cloze
  prompt: 'Complete:


    The carbon group is not a clean fixed-charge ionic group because carbon and silicon
    are often ____ while tin and lead can have variable charges.

    '
  answer:
    expected: covalent
  explanation: 'Carbon and silicon most often form covalent networks or molecules.
    Tin and lead are metals but often need Roman numerals because they can form more
    than one cation.

    '
  tags:
  - group-properties
  - group-4a
- id: pnictogen-property
  type: flashcard
  prompt: 'What charge pattern is most important for Group 5A nonmetals in simple
    ionic compounds?

    '
  answer:
    expected: They often form 3- anions, such as nitride and phosphide.
  explanation: 'Group 5A nonmetals can gain three electrons to complete an octet,
    producing ions such as N3- and P3-.

    '
  tags:
  - group-properties
  - group-5a
- id: chalcogen-property
  type: cloze
  prompt: 'Complete:


    Chalcogens such as oxygen and sulfur commonly form ____ anions in binary ionic
    compounds.

    '
  answer:
    expected: 2-
    aliases:
    - -2
  explanation: 'Group 6A nonmetals have six valence electrons and commonly gain two
    electrons, forming ions such as oxide and sulfide.

    '
  tags:
  - group-properties
  - group-6a
- id: halogen-property
  type: flashcard
  prompt: 'Why are halogens especially important for binary ionic compound naming?

    '
  answer:
    expected: They commonly form 1- anions and their ion names end in -ide, such as
      chloride and bromide.
  explanation: 'Halogens have seven valence electrons, so gaining one electron gives
    a stable 1- anion. Metal halides are some of the most common binary ionic compounds.

    '
  tags:
  - group-properties
  - group-7a
- id: noble-gas-property
  type: cloze
  prompt: 'Complete:


    Noble gases are relatively unreactive because they have ____ valence shells.

    '
  answer:
    expected: full
    aliases:
    - filled
    - complete
  explanation: 'A filled valence shell is low-energy and stable, so noble gases do
    not usually need to gain or lose electrons.

    '
  tags:
  - group-properties
  - group-8a
- id: metal-vs-nonmetal-ions
  type: typed
  prompt: 'In one sentence, describe the usual ion pattern for main-group metals versus
    main-group nonmetals.

    '
  answer:
    expected: Main-group metals usually lose electrons to form cations, while main-group
      nonmetals usually gain electrons to form anions.
  explanation: 'This is the pattern behind fixed-charge ionic naming: metals form
    positive ions and nonmetals form negative ions.

    '
  tags:
  - group-properties
  - common-ions
- id: fixed-charge-pattern
  type: cloze
  prompt: 'Complete:


    For many representative elements, the A-group number helps predict the number
    of ____ electrons.

    '
  answer:
    expected: valence
  explanation: 'Group 1A has one valence electron, Group 2A has two, and so on through
    Group 8A. Valence electrons explain common ion charges and reactivity patterns.

    '
  tags:
  - group-properties
  - periodic-trends
- id: type-one-naming-link
  type: flashcard
  prompt: 'Why are Group 1A, Group 2A, and aluminum especially useful for Type I binary
    ionic naming?

    '
  answer:
    expected: They have predictable fixed charges, so no Roman numeral is needed.
  explanation: 'Group 1A metals are 1+, Group 2A metals are 2+, and aluminum is commonly
    3+. Fixed-charge cations make Type I naming direct.

    '
  tags:
  - group-properties
  - ionic-naming
- id: type-two-naming-link
  type: flashcard
  prompt: 'Why do transition metals, tin, and lead often require Roman numerals?

    '
  answer:
    expected: They can form more than one cation charge, so the compound name must
      state the charge.
  explanation: 'Roman numerals identify the metal cation charge. For example, iron(II)
    and iron(III) are different ions and produce different formulas.

    '
  tags:
  - group-properties
  - ionic-naming
