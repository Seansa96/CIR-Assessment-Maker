- id: q001
  type: numericResponse
  skills:
  - physics-shock-waves
  prompt: Use the Shock Waves diagram and the model $\sin\theta=v/v_s$. A calibrated scenario scales the
    reference values by 1.1. Determine the Mach angle. Give a numerical answer.
  answer:
    value: 33.0
    tolerance: 0.33
  explanation: Apply $\sin\theta=v/v_s$ consistently to the scaled scenario; the requested Mach angle
    is 33.
  media:
  - type: image
    src: /media/physics/owa/shock-waves.svg
    alt: Labeled original schematic for Shock Waves used for quantitative analysis.
    caption: Shock Waves model diagram.
