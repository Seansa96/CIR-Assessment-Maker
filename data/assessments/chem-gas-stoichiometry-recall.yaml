items:
  - id: item-001
    type: flashcard
    prompt: 'What are the exact conditions for STP (Standard Temperature and Pressure)?'
    answer:
      expected: |
        - Temperature: **0 °C (273.15 K)**
        - Pressure: **1.00 atm**
  - id: item-002
    type: flashcard
    prompt: 'What is the molar volume of an ideal gas at STP?'
    answer:
      expected: |
        **22.4 Liters per mole** (22.4 L/mol)
  - id: item-003
    type: flashcard
    prompt: 'Can you use the 22.4 L/mol conversion factor for a gas at 25 °C?'
    answer:
      expected: |
        **No.** The 22.4 L/mol shortcut only works at exactly 0 °C (STP). For 25 °C, you must use the Ideal Gas Law ($PV = nRT$).
  - id: item-004
    type: flashcard
    prompt: 'How do you convert the volume of a gas into moles if the gas is NOT at STP?'
    answer:
      expected: |
        Use the Ideal Gas Law: rearrange $PV = nRT$ to solve for $n$ ($n = \frac{PV}{RT}$).
  - id: item-005
    type: flashcard
    prompt: 'In a chemical equation where all reactants and products are gases, what is the shortcut for finding the volume of a product given the volume of a reactant (at constant T and P)?'
    answer:
      expected: |
        The **mole ratio** (from the balanced equation coefficients) is exactly equal to the **volume ratio**. You can use the coefficients directly to convert liters to liters.
  - id: item-006
    type: flashcard
    prompt: 'If a stoichiometry problem involves gas collected over water, what must you do before applying $PV = nRT$?'
    answer:
      expected: |
        Subtract the vapor pressure of water from the total pressure to find the pressure of the **dry gas** ($P_{gas} = P_{total} - P_{H_2O}$).
