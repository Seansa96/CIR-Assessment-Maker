glossary:
  introduction: Terms for frequency changes caused by source and observer motion through a medium.
  sections:
  - id: doppler-terms
    title: Core terms
    entries:
    - {id: observed-frequency, term: observed frequency, definition: 'The frequency $f_o$ measured by an observer.', drills: [{id: observed-frequency-drill, type: typed, prompt: 'What symbol denotes observed frequency?', answer: {expected: f_o}}]}
    - {id: source-frequency, term: source frequency, definition: 'The emitted frequency $f_s$ of the source.', drills: [{id: source-frequency-drill, type: cloze, prompt: 'The emitted frequency is the {{source frequency}}.', answer: {expected: source frequency}}]}
    - {id: moving-observer, term: moving observer effect, definition: 'Observer motion changes the rate at which existing wavefronts are encountered.', drills: [{id: moving-observer-drill, type: typed, prompt: 'Does an observer moving toward a source hear a higher or lower frequency?', answer: {expected: higher}}]}
    - {id: moving-source, term: moving source effect, definition: 'Source motion compresses wavefront spacing ahead of it and stretches spacing behind it.', drills: [{id: moving-source-drill, type: cloze, prompt: 'A source moving toward an observer {{compresses}} wavefronts ahead of it.', answer: {expected: compresses}}]}
