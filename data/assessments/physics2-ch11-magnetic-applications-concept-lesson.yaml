schemaVersion: 1
id: physics2-ch11-magnetic-applications-concept-lesson
title: Applications of Magnetic Fields
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-magnetic-forces-fields
lesson:
  introduction: This lesson develops the main ideas behind Applications of Magnetic Fields and connects
    them to the governing physical relationships.
  sections:
  - id: l3-sec1
    title: Velocity Selector
    required: true
    content: 'By crossing an electric field and a magnetic field, particles experience both forces: $\vec{F}
      = q(\vec{E} + \vec{v} \times \vec{B})$. If the forces balance, the particle travels straight at
      a specific velocity $v = E/B$.'
  - id: l3-sec2
    title: Mass Spectrometer
    required: true
    content: After passing through a velocity selector, ions enter a region with only a magnetic field.
      They travel in a semicircle with radius $r = \frac{mv}{qB}$. Measuring $r$ determines the mass-to-charge
      ratio.
