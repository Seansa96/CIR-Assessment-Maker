glossary:
  introduction: 'Vocabulary for electrolytes and colligative properties.'
  sections:
    - id: electrolyte-terms
      title: Electrolyte particle vocabulary
      entries:
        - id: entry-strong-electrolyte
          term: strong electrolyte
          definition: 'Solute that produces ions essentially completely in solution.'
          drills:
            - { id: eg-01, type: cloze, prompt: 'A strong electrolyte dissociates ___ in water.', answer: { expected: completely }, explanation: 'Solution: The blank is completely. Why it works: Strong electrolytes produce ions essentially fully.' }
        - id: entry-weak-electrolyte
          term: weak electrolyte
          definition: 'Solute that only partially forms ions in solution.'
          drills:
            - { id: eg-03, type: flashcard, prompt: 'Does a weak electrolyte completely dissociate?', answer: { expected: no }, explanation: 'Solution: No, it only partially dissociates. Why it works: Weak electrolytes remain mostly as molecules.' }
        - id: entry-nonelectrolyte
          term: nonelectrolyte
          definition: 'Solute that dissolves as neutral molecules and does not produce ions.'
          drills:
            - { id: eg-04, type: flashcard, prompt: 'Does a nonelectrolyte produce ions?', answer: { expected: no }, explanation: 'Solution: No, it dissolves as neutral molecules. Why it works: There is no dissociation.' }
        - id: entry-dissociation
          term: dissociation
          definition: 'Separation of ions from an ionic compound in solution.'
          drills:
            - { id: eg-05, type: flashcard, prompt: 'What is dissociation?', answer: { expected: Separation of ions }, explanation: 'Solution: Separation of ions from an ionic compound. Why it works: Ions physically separate.' }
        - id: entry-ion-molarity
          term: ion molarity
          definition: 'Concentration of a particular ion, found from solution molarity times its dissociation coefficient.'
          drills:
            - { id: eg-02, type: cloze, prompt: 'In 0.20 M CaCl2, the chloride concentration is ___ M.', answer: { expected: 0.40 }, explanation: 'Solution: The blank is 0.40. Why it works: Each formula unit yields two chloride ions.' }
    - id: colligative-terms
      title: Colligative-property cues
      entries:
        - id: entry-colligative
          term: colligative property
          definition: 'A solution property governed primarily by the number of dissolved particles.'
          drills:
            - { id: eg-06, type: flashcard, prompt: 'What primarily governs a colligative property?', answer: { expected: number of dissolved particles }, explanation: 'Solution: Number of dissolved particles. Why it works: It depends on quantity, not identity.' }
        - id: entry-fp-depression
          term: freezing-point depression
          definition: 'Lower freezing temperature of a solution compared with pure solvent.'
          drills:
            - { id: eg-07, type: flashcard, prompt: 'What happens to freezing point when solute is added?', answer: { expected: it lowers }, explanation: 'Solution: It lowers. Why it works: Solute particles disrupt crystallization.' }
        - id: entry-bp-elevation
          term: boiling-point elevation
          definition: 'Higher boiling temperature of a solution compared with pure solvent.'
          drills:
            - { id: eg-08, type: flashcard, prompt: 'What happens to boiling point when solute is added?', answer: { expected: it increases }, explanation: 'Solution: It increases. Why it works: Solute particles lower vapor pressure.' }
        - id: entry-osmotic
          term: osmotic pressure
          definition: 'Pressure associated with solvent movement through a semipermeable barrier toward greater dissolved-particle concentration.'
          drills:
            - { id: eg-09, type: flashcard, prompt: 'What is osmotic pressure?', answer: { expected: Pressure associated with solvent movement }, explanation: 'Solution: Pressure associated with solvent movement toward higher concentration. Why it works: Solvent moves to dilute the solute.' }
