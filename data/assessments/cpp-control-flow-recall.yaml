schemaVersion: 1
id: cpp-control-flow-recall
title: C++ Control Flow Recall
assessmentType: recallDrill
categoryId: c++
subcategoryIds:
- c++-execution-flow
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: Which keyword skips the rest of the current loop iteration?
  answer:
    expected: continue
- id: r002
  type: typed
  prompt: Which keyword exits a loop or switch statement immediately?
  answer:
    expected: break
- id: r003
  type: flashcard
  prompt: What happens if you omit the `break` statement in a `switch` case?
  answer:
    expected: Execution "falls through" to the next case.
- id: r004
  type: typed
  prompt: Which loop always executes its body at least once?
  answer:
    expected: do-while
    aliases:
    - do while
    - do
- id: r005
  type: typed
  prompt: What logical operator is used for "AND"?
  answer:
    expected: '&&'
    aliases:
    - and
- id: r006
  type: typed
  prompt: What logical operator is used for "OR"?
  answer:
    expected: '||'
    aliases:
    - or
- id: r007
  type: flashcard
  prompt: In a `for (int i = 0; i < 5; i++)` loop, when does `i++` execute?
  answer:
    expected: At the end of each iteration.
- id: r008
  type: typed
  prompt: Which `switch` label catches any values not matched by the other cases?
  answer:
    expected: default
    aliases:
    - 'default:'
