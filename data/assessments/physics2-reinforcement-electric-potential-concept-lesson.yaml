lesson:
  introduction: >-
    Electric potential is scalar energy per charge. This lesson reinforces algebraic addition, the relation $\mathbf E=-\nabla V$,
    and the work-energy connection $\Delta U=q\Delta V$.
  sections:
  - id: physics2-reinforcement-potential-s1
    title: Add scalar potentials
    required: true
    content: Point-charge potentials add algebraically, including their signs. Unlike electric field, potential does not require vector components.
    check:
      id: physics2-reinforcement-potential-s1-check
      type: multipleChoice
      prompt: At a point, two equal charges $+Q$ are each distance $r$ away. What is the total potential?
      choices:
      - { id: a, text: '$2kQ/r$' }
      - { id: b, text: '$0$ because the field vectors may cancel', issueSignals: [{ id: physics2-potential-field-confusion, domains: [physics-2] }] }
      - { id: c, text: '$kQ/r^2$', issueSignals: [{ id: physics2-potential-power-error, domains: [physics-2] }] }
      - { id: d, text: '$kQ/(2r)$', issueSignals: [{ id: physics2-potential-superposition-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: Each source contributes $kQ/r$ and potential is scalar, so the total is $2kQ/r$.
        Why it works: Scalar contributions add with sign but without directional components.
        Why the other choices fail: b imports field cancellation, c uses field scaling, and d divides instead of adding.
    difficultyDimensions: [representation, superposition]
    difficultyEvidence: Distinguishes scalar potential addition from vector field addition.
  - id: physics2-reinforcement-potential-s2
    title: Read the field from potential slope
    required: true
    content: In one dimension, $E_x=-dV/dx$. The field points toward decreasing potential.
    check:
      id: physics2-reinforcement-potential-s2-check
      type: multipleChoice
      prompt: If $V$ decreases as $x$ increases, what is the sign of $E_x$?
      choices:
      - { id: a, text: 'Positive, because $dV/dx<0$ makes $-dV/dx>0$' }
      - { id: b, text: 'Negative, because the field points toward lower potential', issueSignals: [{ id: physics2-potential-gradient-sign-error, domains: [physics-2] }] }
      - { id: c, text: 'Zero, because potential is scalar', issueSignals: [{ id: physics2-potential-scalar-field-error, domains: [physics-2] }] }
      - { id: d, text: 'Undefined unless a test charge is present', issueSignals: [{ id: physics2-potential-field-definition-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: A decreasing potential has $dV/dx<0$, so $E_x=-dV/dx>0$.
        Why it works: The minus sign makes the field point in the direction of decreasing potential.
        Why the other choices fail: b reports the slope rather than the negative slope, c confuses scalar potential with vector field, and d confuses field with force.
    difficultyDimensions: [derivation, sign]
    difficultyEvidence: Applies the gradient relation with a sign interpretation.
  - id: physics2-reinforcement-potential-s3
    title: Connect potential difference to energy
    required: true
    content: For a charge moved between two points, $\Delta U=q\Delta V$. The sign of $q$ matters.
    check:
      id: physics2-reinforcement-potential-s3-check
      type: multipleChoice
      prompt: A positive charge moves through a potential drop of $20\,\mathrm V$. What happens to its potential energy?
      choices:
      - { id: a, text: 'It decreases by $20q$' }
      - { id: b, text: 'It increases by $20q$', issueSignals: [{ id: physics2-potential-energy-sign-error, domains: [physics-2] }] }
      - { id: c, text: 'It is unchanged because voltage is not energy', issueSignals: [{ id: physics2-potential-energy-confusion, domains: [physics-2] }] }
      - { id: d, text: 'It decreases by $20/q$', issueSignals: [{ id: physics2-potential-energy-units-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: A drop means $\Delta V=-20\,\mathrm V$, so $\Delta U=q\Delta V=-20q$.
        Why it works: Positive charge loses electric potential energy when moving to lower potential.
        Why the other choices fail: b reverses the sign, c denies the energy relation, and d divides by charge.
    difficultyDimensions: [calculation, sign]
    difficultyEvidence: Translates a verbal potential drop into signed energy change.
  - id: physics2-reinforcement-potential-s4
    title: Interpret equipotential motion
    required: true
    content: Moving along an equipotential gives $\Delta V=0$ and therefore zero electric work. The field is perpendicular to an equipotential surface.
    check:
      id: physics2-reinforcement-potential-s4-check
      type: multipleChoice
      prompt: What is true for a charge moved along an equipotential surface?
      choices:
      - { id: a, text: 'The electric work is zero because $\Delta V=0$' }
      - { id: b, text: 'The electric field must be tangent to the path', issueSignals: [{ id: physics2-equipotential-direction-error, domains: [physics-2] }] }
      - { id: c, text: 'The potential energy changes by $qV$', issueSignals: [{ id: physics2-equipotential-energy-error, domains: [physics-2] }] }
      - { id: d, text: 'The charge must accelerate along the surface', issueSignals: [{ id: physics2-equipotential-force-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: Along an equipotential, $\Delta V=0$, so $W_{field}=-\Delta U=-q\Delta V=0$.
        Why it works: The field is normal to the surface and has no component along the motion.
        Why the other choices fail: b reverses the geometry, c uses a nonzero difference, and d adds an unsupported dynamical claim.
    difficultyDimensions: [representation, energy]
    difficultyEvidence: Combines equipotential geometry with the work-energy relation.
