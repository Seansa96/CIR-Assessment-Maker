lesson:
  introduction: This lesson develops Speed of Sound from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      The speed at which a sound wave propagates depends entirely on the mechanical properties of the medium, not on the frequency or amplitude of the sound. The physical system can be modeled as a series of masses (density) connected by springs (elasticity).
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s1, type: multipleChoice, prompt: 'What determines sound speed?', choices: [{id: a, text: 'Mechanical properties of the medium'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'Amplitude alone'}, {id: d, text: 'No material property'}], answer: {choiceId: a}, explanation: 'This follows from the mechanical-wave speed model.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The measurable quantities governing speed are the medium's restoring force (bulk modulus $B$ for fluids, Young's modulus $Y$ for solids) and its inertial property (mass density $\rho$). For ideal gases, temperature $T$ is the primary measurable proxy.
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s2, type: multipleChoice, prompt: 'Which material properties govern sound speed?', choices: [{id: a, text: 'Elasticity and density'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'Amplitude alone'}, {id: d, text: 'No material property'}], answer: {choiceId: a}, explanation: 'This follows from the mechanical-wave speed model.'}
  - id: s3
    title: Mathematical model
    content: >-
      The universal mathematical model for mechanical wave speed is $v = \sqrt{\frac{\text{Elastic Property}}{\text{Inertial Property}}}$. For a fluid, $v = \sqrt{\frac{B}{\rho}}$. For a solid rod, $v = \sqrt{\frac{Y}{\rho}}$.
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s3, type: multipleChoice, prompt: 'What is sound speed in a fluid?', choices: [{id: a, text: '$v=\sqrt{B/\rho}$'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'Amplitude alone'}, {id: d, text: 'No material property'}], answer: {choiceId: a}, explanation: 'This follows from the mechanical-wave speed model.'}
  - id: s4
    title: Calculus connection
    content: >-
      Using thermodynamics and calculus, we recognize that sound travels so fast that heat cannot transfer between compressions and rarefactions; the process is adiabatic. Thus, for an ideal gas, the adiabatic bulk modulus is $B = \gamma P$, where $\gamma$ is the heat capacity ratio.
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s4, type: multipleChoice, prompt: 'What thermodynamic condition applies to sound compressions?', choices: [{id: a, text: 'Adiabatic'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'Amplitude alone'}, {id: d, text: 'No material property'}], answer: {choiceId: a}, explanation: 'This follows from the mechanical-wave speed model.'}
  - id: s5
    title: Derivation or justification
    content: >-
      Substituting $B = \gamma P$ and using the ideal gas law $P = \frac{\rho R T}{M}$, we derive $v = \sqrt{\frac{\gamma R T}{M}}$. This proves that in an ideal gas, the speed of sound depends only on the absolute temperature $T$ (since $\gamma, R, M$ are constants for a specific gas).
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s5, type: multipleChoice, prompt: 'What ideal-gas formula gives sound speed?', choices: [{id: a, text: '$v=\sqrt{\gamma RT/M}$'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'Amplitude alone'}, {id: d, text: 'No material property'}], answer: {choiceId: a}, explanation: 'This follows from the mechanical-wave speed model.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, plotting the speed of sound in air versus absolute temperature yields a square-root curve. However, for everyday temperatures in Celsius ($T_c$), a linear approximation is often used: $v \approx 331 \text{ m/s} + 0.6 T_c$.
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s6, type: multipleChoice, prompt: 'What is speed versus absolute temperature like?', choices: [{id: a, text: 'A square-root temperature curve'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'Amplitude alone'}, {id: d, text: 'No material property'}], answer: {choiceId: a}, explanation: 'This follows from the mechanical-wave speed model.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A key quantitative strategy is ensuring absolute temperature (Kelvin) is used in the square root formula. For air at $20^\circ$C ($293$K), $v = 331 \sqrt{293/273} \approx 343$ m/s, the standard value for speed of sound.
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s7, type: multipleChoice, prompt: 'What temperature unit is required in the exact gas formula?', choices: [{id: a, text: 'Kelvin'}, {id: b, text: 'Frequency alone'}, {id: c, text: 'Amplitude alone'}, {id: d, text: 'No material property'}], answer: {choiceId: a}, explanation: 'This follows from the mechanical-wave speed model.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: Sound travels faster in solids than liquids, and faster in liquids than gases, because the elastic moduli ($Y, B$) increase drastically in denser states, overpowering the increase in density $\rho$. Units: $\sqrt{\text{Pa} / (\text{kg/m}^3)} = \text{m/s}$.
    media:
    - type: image
      src: /media/physics/owa/speed-of-sound.svg
      alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
      caption: Speed of Sound model diagram.
    check: {id: speeds-s8, type: multipleChoice, prompt: 'Which state generally carries sound fastest?', choices: [{id: a, text: 'Solid'}, {id: b, text: 'Gas'}, {id: c, text: 'Vacuum'}, {id: d, text: 'All equally'}], answer: {choiceId: a}, explanation: 'High stiffness in solids generally produces the greatest sound speed.'}
