workedExamples:
- id: aops-geom-potpourri-we-1
  title: Ptolemy's Theorem in a Rectangle
  steps:
  - id: step-1
    title: Identify the cyclic quadrilateral
    prompt: Identify the four points that form a cyclic quadrilateral and determine the lengths of its
      sides and diagonals.
    difficultyDimensions:
    - Recognize that $A, B, C, P$ lie on the same circle.
    - Determine the side lengths of the cyclic quadrilateral $PABC$.
    - Identify the diagonals.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The points $P, A, B, C$ are on the circle, forming cyclic quadrilateral $PABC$.
      - 'Sides: $PA = 2$, $AB = 8$, $BC = 6$. We need to find $PC$.'
      - 'Diagonals: $PB = 4$ and $AC$.'
    explanation: 'Solution:

      Since $P$ is on the circumcircle of rectangle $ABCD$, the points $P, A, B, C$ all lie on the same
      circle.

      Thus, $PABC$ is a cyclic quadrilateral.

      Its vertices in order around the circle are $P, A, B, C$.

      The side lengths are $PA=2, AB=8, BC=6$, and the unknown side is $PC$.

      The diagonals of this quadrilateral are $PB$ (which is 4) and $AC$.


      Why it works:

      Any subset of four points on a circle forms a cyclic quadrilateral, allowing the immediate application
      of Ptolemy''s Theorem.

      '
    instruction: 'Work through this step: Identify the four points that form a cyclic quadrilateral and
      determine the lengths of its sides and diagonals.'
    type: freeResponse
  - id: step-2
    title: Calculate the missing diagonal
    prompt: Use the properties of the rectangle to find the length of the diagonal $AC$.
    difficultyDimensions:
    - Recognize that $AC$ is the diagonal of the rectangle.
    - Apply the Pythagorean theorem to $\triangle ABC$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\triangle ABC$ is a right triangle with legs 8 and 6.
      - $AC = \sqrt{8^2 + 6^2} = \sqrt{100} = 10$.
    explanation: 'Solution:

      $AC$ is a diagonal of the rectangle $ABCD$.

      Because $\triangle ABC$ is a right triangle with legs $AB=8$ and $BC=6$, we use the Pythagorean
      theorem:

      $AC = \sqrt{8^2 + 6^2} = \sqrt{64 + 36} = \sqrt{100} = 10$.


      Why it works:

      A rectangle''s diagonal is the hypotenuse of the right triangle formed by its sides. This gives
      us the exact length needed for Ptolemy''s equation.

      '
    instruction: 'Work through this step: Use the properties of the rectangle to find the length of the
      diagonal $AC$.'
    type: freeResponse
  - id: step-3
    title: Apply Ptolemy's Theorem
    prompt: Set up Ptolemy's equation for cyclic quadrilateral $PABC$ and solve for $PC$.
    difficultyDimensions:
    - 'Write Ptolemy''s equation: $(PA \cdot BC) + (AB \cdot PC) = PB \cdot AC$.'
    - Substitute the known values and isolate $PC$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $(2 \cdot 6) + (8 \cdot PC) = 4 \cdot 10$.
      - $12 + 8PC = 40$.
      - $8PC = 28 \implies PC = 3.5$.
    explanation: 'Solution:

      By Ptolemy''s Theorem on $PABC$, the sum of the products of the opposite sides equals the product
      of the diagonals:

      $$(PA \cdot BC) + (AB \cdot PC) = PB \cdot AC$$

      $$(2 \cdot 6) + (8 \cdot PC) = 4 \cdot 10$$

      $$12 + 8PC = 40$$

      $$8PC = 28$$

      $$PC = \frac{28}{8} = \frac{7}{2} = 3.5$$


      Why it works:

      Ptolemy''s theorem elegantly links all six segments between four concyclic points into a single
      linear equation, avoiding the need for complex trigonometry or auxiliary lines.

      '
    instruction: 'Work through this step: Set up Ptolemy''s equation for cyclic quadrilateral $PABC$ and
      solve for $PC$.'
    type: freeResponse
  problem: A rectangle $ABCD$ has side lengths $AB = 8$ and $BC = 6$. An internal point $P$ lies on the
    circumcircle of the rectangle such that $P$ is on the minor arc $AB$. If $PA = 2$ and $PB = 4$, find
    the length of $PC$.
- id: aops-geom-potpourri-we-2
  title: Stewart's Theorem for a Median
  steps:
  - id: aops-geom-potpourri-we-2-step-1
    title: Identify the cevian and base segments
    prompt: Identify the variables required for Stewart's Theorem ($a, b, c, m, n$) given that $AM$ is
      a median.
    difficultyDimensions:
    - Recognize that a median bisects the opposite side.
    - Assign the lengths to $a, b, c, m, n$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The side $BC$ is $a = 9$.
      - The median $AM$ cuts $BC$ into two equal segments, so $m = 4.5$ and $n = 4.5$.
      - The adjacent sides are $c = 7$ and $b = 12$.
    explanation: 'Solution:

      We will use Stewart''s Theorem on cevian $d = AM$.

      The side $BC$ is $a = 9$.

      Because $M$ is the midpoint of $BC$, the segments are $m = BM = 4.5$ and $n = MC = 4.5$.

      The adjacent side to $m$ is $c = AB = 7$.

      The adjacent side to $n$ is $b = AC = 12$.


      Why it works:

      Stewart''s Theorem requires knowing the lengths of the two segments created on the base. A median
      by definition splits the base perfectly in half.

      '
    instruction: 'Work through this step: Identify the variables required for Stewart''s Theorem ($a,
      b, c, m, n$) given that $AM$ is a median.'
    type: freeResponse
  - id: aops-geom-potpourri-we-2-step-2
    title: Apply Stewart's Theorem
    prompt: Substitute the values into Stewart's Theorem to find the square of the median's length.
    difficultyDimensions:
    - Substitute into $a(d^2 + mn) = b^2m + c^2n$.
    - Factor out the common $m$ and $n$ since $m=n=4.5$.
    - Solve for $d^2$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $9(d^2 + 4.5^2) = 12^2(4.5) + 7^2(4.5)$.
      - 'Divide the entire equation by 4.5: $2(d^2 + 20.25) = 144 + 49 = 193$.'
      - $2d^2 + 40.5 = 193 \implies 2d^2 = 152.5$.
      - $d^2 = 76.25$.
    explanation: 'Solution:

      Stewart''s Theorem is: $a(d^2 + mn) = b^2m + c^2n$.

      Substitute the values:

      $$9(d^2 + (4.5)(4.5)) = 12^2(4.5) + 7^2(4.5)$$

      To make the arithmetic easier, divide both sides by 4.5 (since $9 = 2 \times 4.5$):

      $$2(d^2 + 20.25) = 144 + 49$$

      $$2d^2 + 40.5 = 193$$

      $$2d^2 = 152.5$$

      $$d^2 = 76.25$$


      Why it works:

      When $m=n$, Stewart''s Theorem simplifies to Apollonius''s Theorem: $b^2 + c^2 = 2(m^2 + d^2)$.
      This is a massive algebraic shortcut for medians.

      '
    instruction: 'Work through this step: Substitute the values into Stewart''s Theorem to find the square
      of the median''s length.'
    type: freeResponse
  - id: aops-geom-potpourri-we-2-step-3
    title: Determine the final length
    prompt: Extract the square root to find $d = AM$.
    difficultyDimensions:
    - Take the square root of $76.25$.
    - Optionally express it as a simplified radical.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $d = \sqrt{76.25} = \sqrt{\frac{305}{4}} = \frac{\sqrt{305}}{2}$.
    explanation: 'Solution:

      We have $d^2 = 76.25$.

      To write this as a clean fraction: $76.25 = \frac{305}{4}$.

      Taking the square root:

      $$d = \sqrt{\frac{305}{4}} = \frac{\sqrt{305}}{2}$$


      Why it works:

      Fractions are often preferred over decimals in Olympiad math because they easily reveal if a radical
      can be simplified further (305 is $5 \times 61$, so it cannot).

      '
    instruction: 'Work through this step: Extract the square root to find $d = AM$.'
    type: freeResponse
  problem: In $\triangle ABC$, $AB = 7$, $BC = 9$, and $AC = 12$. A median is drawn from $A$ to the midpoint
    $M$ of $BC$. Find the length of the median $AM$.
- id: aops-geom-potpourri-we-3
  title: Mass Point Geometry
  steps:
  - id: aops-geom-potpourri-we-3-step-1
    title: Balance the first seesaw
    prompt: Assign masses to vertices $B$ and $C$ such that the seesaw on side $BC$ balances at fulcrum
      $D$.
    difficultyDimensions:
    - Use the ratio $BD:DC = 2:5$.
    - Assign masses inversely proportional to the lengths.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $m_B \cdot 2 = m_C \cdot 5$.
      - Let $m_B = 5$ and $m_C = 2$.
    explanation: 'Solution:

      We want to balance the seesaw $BC$ at fulcrum $D$.

      The distances are $BD = 2$ units and $DC = 5$ units.

      The balance equation is $m_B \cdot 2 = m_C \cdot 5$.

      The simplest integer masses that satisfy this are $m_B = 5$ and $m_C = 2$.


      Why it works:

      The mass must be heavier on the side closer to the fulcrum. This is the fundamental physics principle
      of torque.

      '
    instruction: 'Work through this step: Assign masses to vertices $B$ and $C$ such that the seesaw on
      side $BC$ balances at fulcrum $D$.'
    type: freeResponse
  - id: aops-geom-potpourri-we-3-step-2
    title: Balance the second seesaw
    prompt: Use the mass at $C$ to balance the seesaw on side $AC$ at fulcrum $E$. Find the required mass
      at $A$.
    difficultyDimensions:
    - Use the ratio $CE:EA = 1:3$.
    - Substitute $m_C = 2$ into the balance equation for $AC$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $m_C \cdot CE = m_A \cdot EA$.
      - $2 \cdot 1 = m_A \cdot 3$.
      - $m_A = \frac{2}{3}$.
    explanation: 'Solution:

      We have fixed $m_C = 2$.

      Now balance the seesaw $AC$ at fulcrum $E$. The given ratio is $CE:EA = 1:3$.

      The balance equation is $m_C \cdot 1 = m_A \cdot 3$.

      $$2 \cdot 1 = m_A \cdot 3 \implies m_A = \frac{2}{3}$$


      Why it works:

      Once one mass is chosen (in step 1), it locks the entire system into place. The mass at $A$ must
      perfectly counterbalance $C$ across $E$.

      '
    instruction: 'Work through this step: Use the mass at $C$ to balance the seesaw on side $AC$ at fulcrum
      $E$. Find the required mass at $A$.'
    type: freeResponse
  - id: aops-geom-potpourri-we-3-step-3
    title: Clear fractions
    prompt: Multiply all masses by a constant to clear the fraction for $m_A$.
    difficultyDimensions:
    - Multiply $m_A, m_B, m_C$ by 3.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - New $m_A = 3 \cdot \frac{2}{3} = 2$.
      - New $m_B = 3 \cdot 5 = 15$.
      - New $m_C = 3 \cdot 2 = 6$.
    explanation: 'Solution:

      To avoid working with fractions, multiply every mass in the system by 3.

      $m_A = \frac{2}{3} \times 3 = 2$.

      $m_B = 5 \times 3 = 15$.

      $m_C = 2 \times 3 = 6$.

      (Let''s double check: $BC$ balances because $15 \cdot 2 = 6 \cdot 5 = 30$. $AC$ balances because
      $6 \cdot 1 = 2 \cdot 3 = 6$. Perfect.)


      Why it works:

      Mass ratios are invariant under uniform scaling, just like geometric ratios.

      '
    instruction: 'Work through this step: Multiply all masses by a constant to clear the fraction for
      $m_A$.'
    type: freeResponse
  - id: step-4
    title: Compute the internal cevian ratio
    prompt: Find the combined mass at fulcrum $D$, then balance the seesaw on the cevian $AD$ at the center
      of mass $P$.
    difficultyDimensions:
    - Calculate $m_D = m_B + m_C$.
    - Set up the balance equation $m_A \cdot AP = m_D \cdot PD$.
    - Solve for the ratio $AP/PD$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $m_D = m_B + m_C = 15 + 6 = 21$.
      - The seesaw $AD$ balances at $P$.
      - $m_A \cdot AP = m_D \cdot PD \implies 2 \cdot AP = 21 \cdot PD$.
      - $AP:PD = 21:2$.
    explanation: 'Solution:

      The fulcrum $D$ supports the combined mass of $B$ and $C$.

      $$m_D = m_B + m_C = 15 + 6 = 21$$

      Now view the cevian $AD$ as a seesaw balancing at the global center of mass $P$.

      The mass at $A$ is 2, and the mass at $D$ is 21.

      The balance equation is:

      $$m_A \cdot AP = m_D \cdot PD$$

      $$2 \cdot AP = 21 \cdot PD$$

      Dividing to find the ratio gives:

      $$\frac{AP}{PD} = \frac{21}{2}$$

      The ratio $AP:PD$ is $21:2$.


      Why it works:

      The center of mass $P$ perfectly balances the entire triangle. By collapsing $B$ and $C$ into their
      local center of mass $D$, we reduce a 2D problem into a simple 1D seesaw on the line $AD$.

      '
    instruction: 'Work through this step: Find the combined mass at fulcrum $D$, then balance the seesaw
      on the cevian $AD$ at the center of mass $P$.'
    type: freeResponse
  problem: In $\triangle ABC$, point $D$ lies on $BC$ such that $BD:DC = 2:5$. Point $E$ lies on $AC$
    such that $CE:EA = 1:3$. The cevians $AD$ and $BE$ intersect at $P$. Find the ratio $AP:PD$.
