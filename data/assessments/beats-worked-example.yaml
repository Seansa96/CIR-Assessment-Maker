workedExamples:
- id: we-beats
  title: Deriving and applying Beats
  problem: Use the labeled model to derive and calculate the beat frequency from $f_b=|f_1-f_2|$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the two source frequencies from the problem statement.
    prompt: 'Identify the frequencies.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Frequencies f_1 and f_2'
    explanation: >-
      We are given two tuning forks with frequencies $f_1$ and $f_2$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about how the waves interact at the observer's ear.
    prompt: 'What is assumed?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Linear superposition.'
    explanation: >-
      We assume linear superposition of the two waves in time.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Beat frequency f_{\text{beat}}'
    explanation: >-
      We want to calculate the beat frequency $f_{\text{beat}}$ heard by the observer.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the formula for the beat frequency.
    prompt: 'Write the governing equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_{\text{beat}} = |f_1 - f_2|'
    explanation: >-
      $f_{\text{beat}} = |f_1 - f_2|$
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variable (it is already isolated).
    prompt: 'Isolate the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_{\text{beat}} = |f_1 - f_2|'
    explanation: >-
      The equation is ready to use.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $f_1 = 440$ Hz and $f_2 = 443$ Hz, calculate the beat frequency.
    prompt: 'Calculate the beat frequency.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      value: 6.0
      tolerance: 0.06
    explanation: >-
      $f_{\text{beat}} = |440 - 443| = |-3| = 3$ Hz.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of the subtraction.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Hz'
    explanation: >-
      Hertz minus Hertz equals Hertz.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated beat frequency.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      value: 6.0
      tolerance: 0.06
    explanation: >-
      The beat frequency is $3$ Hz (or 3 beats per second).
