    title: Read the diagram
    instruction: Derive the beat frequency for the Beats model. Use the established relation $f_b=|f_1-f_2|$
      and preserve units while moving toward the beat frequency.
    prompt: 'Complete derivation step 1: Read the diagram.'
    type: freeResponse
    media:
