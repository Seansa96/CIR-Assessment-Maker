workedExamples:
- id: we-beats
  title: Deriving and applying Beats
  problem: Use the labeled model to derive and calculate the beat frequency from $f_b=|f_1-f_2|$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the two source frequencies from the problem statement.
    prompt: 'Identify the frequencies.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Identify $f_1$ and $f_2$ as the two source frequencies. Why it works: beats require two superposed waves with nearby frequencies.'
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about how the waves interact at the observer's ear.
    prompt: 'What is assumed?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: State the assumption of linear superposition. Why it works: the observed displacement is the sum of the two wave displacements.'
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: The target is $f_{\text{beat}}$. Why it works: this quantity measures the loudness-pulse rate heard by the observer.'
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the formula for the beat frequency.
    prompt: 'Write the governing equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Write $f_{\text{beat}}=|f_1-f_2|$. Why it works: amplitude repeats at the absolute difference of the two source frequencies.'
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variable (it is already isolated).
    prompt: 'Isolate the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: $f_{\text{beat}}$ is already isolated. Why it works: evaluating the absolute difference directly yields a nonnegative rate.'
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $f_1 = 440$ Hz and $f_2 = 443$ Hz, calculate the beat frequency.
    prompt: 'Calculate the beat frequency.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      value: 3.0
      tolerance: 0.06
    explanation: 'Solution: $|440-443|=3\ \text{Hz}$. Why it works: only the magnitude of the source-frequency difference matters.'
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of the subtraction.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: The result has units of hertz. Why it works: subtracting two frequencies leaves a frequency.'
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated beat frequency.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    answer:
      value: 3.0
      tolerance: 0.06
    explanation: 'Solution: State $f_{\text{beat}}=3\ \text{Hz}$. Why it works: three envelope maxima occur per second for a $3\ \text{Hz}$ difference.'
- id: we-beats-tuning
  title: Using a beat rate to tune a string
  problem: A reference fork is $512\ \text{Hz}$ and a string produces $509\ \text{Hz}$. Find the beat frequency and state whether the string is high or low relative to the fork.
  steps:
  - id: beats-tuning-step-1
    title: Calculate the beat rate
    instruction: Take the absolute difference of the two source frequencies.
    type: numericResponse
    prompt: What beat frequency is heard in hertz?
    answer: {value: 3, tolerance: 0.01}
    explanation: 'Solution: $|512-509|=3\ \text{Hz}$. Why it works: the absolute difference gives the number of amplitude pulses per second.'
  - id: beats-tuning-step-2
    title: Compare the source frequencies
    instruction: Compare the string frequency directly to the reference fork frequency.
    type: multipleChoice
    prompt: Is the string frequency high or low relative to the fork?
    choices: [{id: a, text: Low}, {id: b, text: High}, {id: c, text: Equal}, {id: d, text: Cannot be determined}]
    answer: {choiceId: a}
    explanation: 'Solution: The string is low because $509<512$. Why it works: direct comparison determines the sign that the absolute-difference formula omits. Why the other choices fail: high reverses the inequality, equal would give no beats, and both frequencies are given.'
