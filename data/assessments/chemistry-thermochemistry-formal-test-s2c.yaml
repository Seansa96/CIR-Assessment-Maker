questions:
- id: q1
  type: numericResponse
  prompt: A 50.0 g metal sample absorbs 950 J and warms by 10.0 °C. Find its specific heat in J/(g·°C).
  answer:
    value: 1.9
    tolerance: 0.019
  explanation: 'Solution: $c=q/(m\Delta T)=950/(50.0\times10.0)=1.90$.


    Why it works: Specific heat is heat per gram per degree of temperature change.'
  difficultyDimensions:
  - calorimetry
  - variableIsolation
  - units
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: calorimetry-calculation-error
- id: q2
  type: multipleChoice
  prompt: A reaction warms its surroundings. What sign does $q_{rxn}$ have?
  choices:
  - id: a
    text: negative
    issueSignals: []
  - id: b
    text: positive
    issueSignals:
    - id: enthalpy-sign-error
  - id: c
    text: zero
    issueSignals:
    - id: enthalpy-sign-error
  - id: d
    text: It depends only on mass
    issueSignals:
    - id: enthalpy-sign-error
  answer:
    choiceId: a
  explanation: 'Solution: If surroundings gain heat, the reaction loses it, so $q_{rxn}<0$.


    Why it works: Heat conservation assigns equal magnitudes and opposite signs to reaction and surroundings.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - systemSurroundings
  - enthalpySign
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: enthalpy-sign-error
- id: q3
  type: numericResponse
  prompt: Combustion of 1.00 mol ethanol releases 1367 kJ. How much heat is released by 0.250 mol?
  answer:
    value: -341.75
    tolerance: 3.4175
  explanation: 'Solution: $(0.250)(-1367)=-341.75\ \mathrm{kJ}$, or $-342\ \mathrm{kJ}$.


    Why it works: Reaction enthalpy scales with the amount reacted.'
  difficultyDimensions:
  - reactionStoichiometry
  - enthalpySign
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: enthalpy-sign-error
- id: q4
  type: numericResponse
  prompt: If $\mathrm{A\rightarrow B}$ has $\Delta H=+125\ \mathrm{kJ}$, what is $\Delta H$ for $\mathrm{2B\rightarrow2A}$?
  answer:
    value: -250
    tolerance: 2.5
  explanation: 'Solution: Reversal gives $-125$ kJ; doubling the equation gives $-250$ kJ.


    Why it works: Reverse changes sign and scaling changes magnitude.'
  difficultyDimensions:
  - hessLaw
  - reversal
  - scaling
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: hess-law-misapplied
- id: q5
  type: numericResponse
  prompt: 'Use formation enthalpies (kJ/mol): NO₂ = +33.2, NO = +90.3, O₂ = 0. Find $\Delta H^\circ$ for
    $\mathrm{2NO_2\rightarrow2NO+O_2}$.'
  answer:
    value: 114.2
    tolerance: 1.1420000000000001
  explanation: 'Solution: Products: $2(90.3)+0=180.6$; reactants: $2(33.2)=66.4$; difference $=114.2$
    kJ.


    Why it works: Use products minus reactants after applying coefficients.'
  difficultyDimensions:
  - formationEnthalpy
  - stoichiometricCoefficients
  - subtraction
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: hess-law-misapplied
- id: q6
  type: numericResponse
  prompt: A calorimeter water bath gains 3.25 kJ. What is $q_{rxn}$ in kJ?
  answer:
    value: -3.25
    tolerance: 0.0325
  explanation: 'Solution: $q_{rxn}=-q_{water}=-3.25\ \mathrm{kJ}$.


    Why it works: The reaction and calorimeter exchange energy with opposite signs.'
  difficultyDimensions:
  - calorimetry
  - enthalpySign
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: enthalpy-sign-error
- id: q7
  type: multipleChoice
  prompt: Which operation is valid in a Hess’s-law calculation?
  choices:
  - id: a
    text: Multiply both an equation and its ΔH by the same coefficient
    issueSignals: []
  - id: b
    text: Change a coefficient without changing ΔH
    issueSignals:
    - id: hess-law-misapplied
  - id: c
    text: Cancel a species appearing on the same side twice
    issueSignals:
    - id: hess-law-misapplied
  - id: d
    text: Add equations but average their ΔH values
    issueSignals:
    - id: hess-law-misapplied
  answer:
    choiceId: a
  explanation: 'Solution: Scaling the whole reaction scales the enthalpy by the same factor.


    Why it works: The other operations violate the equation/enthalpy bookkeeping needed for an additive
    pathway.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - hessLaw
  - equationManipulation
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: hess-law-misapplied
- id: q8
  type: numericResponse
  prompt: How much heat is absorbed by 125 g water warmed from 18.0 to 24.0 °C? Use 4.184 J/(g·°C).
  answer:
    value: 3138
    tolerance: 31.38
  explanation: 'Solution: $q=(125)(4.184)(6.0)=3138\ \mathrm{J}$, reported as $3.1\times10^3\ \mathrm{J}$.


    Why it works: Water’s heat depends on its mass, specific heat, and temperature change.'
  difficultyDimensions:
  - calorimetry
  - significantFigures
  - units
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: calorimetry-calculation-error
- id: q9
  type: numericResponse
  prompt: For $\mathrm{N_2+3H_2\rightarrow2NH_3}$, $\Delta H=-92.4\ \mathrm{kJ}$ as written. Find heat
    for producing 5.00 mol NH₃.
  answer:
    value: -231
    tolerance: 2.31
  explanation: 'Solution: $5.00\ \mathrm{mol}\times(-92.4\ \mathrm{kJ}/2\ \mathrm{mol})=-231\ \mathrm{kJ}$.


    Why it works: The listed ΔH corresponds to the equation’s 2 mol NH₃ coefficient.'
  difficultyDimensions:
  - reactionStoichiometry
  - balancedEquation
  - enthalpySign
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: enthalpy-sign-error
- id: q10
  type: multipleChoice
  prompt: Why is $\Delta H_f^\circ$ for $\mathrm{O_2(g)}$ zero?
  choices:
  - id: a
    text: It is oxygen’s standard-state elemental form
    issueSignals: []
  - id: b
    text: Oxygen contains no energy
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: c
    text: All gases have zero formation enthalpy
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: d
    text: It has no bonds
    issueSignals:
    - id: stoichiometry-ratio-error
  answer:
    choiceId: a
  explanation: 'Solution: The convention assigns zero formation enthalpy to an element in its standard
    state.


    Why it works: The other statements confuse a reference convention with physical energy or bonding.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - formationEnthalpy
  - standardStates
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: stoichiometry-ratio-error
