questions:
  - id: easy-vector-addition
    type: multipleChoice
    prompt: |
      If $\vec{u} = \begin{bmatrix} 2 \\ -1 \\ 3 \end{bmatrix}$ and $\vec{v} = \begin{bmatrix} 0 \\ 4 \\ -2 \end{bmatrix}$, what is $\vec{u} + \vec{v}$?
    choices:
      - id: c1
        text: '$\begin{bmatrix} 2 \\ 3 \\ 1 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 2 \\ 5 \\ 5 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 0 \\ -4 \\ -6 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 2 \\ 3 \\ 5 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      Add the corresponding entries: $2+0 = 2$, $-1+4 = 3$, and $3+(-2) = 1$.

  - id: easy-scalar-multiplication
    type: symbolicResponse
    prompt: |
      If $\vec{v} = \begin{bmatrix} 4 \\ -3 \end{bmatrix}$, calculate $-2\vec{v}$.
      
      Format your answer as a column matrix, e.g., `[-8, 6]`.
    answer:
      expectedLatex: '\begin{bmatrix} -8 \\ 6 \end{bmatrix}'
      equivalenceMode: expression
      tolerance: 0
      aliases:
        - '\begin{pmatrix} -8 \\ 6 \end{pmatrix}'
    explanation: |
      Multiply each entry by $-2$: $(-2) \cdot 4 = -8$ and $(-2) \cdot (-3) = 6$.

  - id: easy-matrix-mult-dimensions
    type: multipleChoice
    prompt: |
      Let $A$ be a $4 \times 3$ matrix and let $B$ be a $3 \times 7$ matrix. What are the dimensions of the product matrix $AB$?
    choices:
      - id: c1
        text: '$4 \times 7$'
      - id: c2
        text: '$3 \times 3$'
      - id: c3
        text: '$7 \times 4$'
      - id: c4
        text: 'The product is undefined.'
    answer:
      choiceId: c1
    explanation: |
      The inner dimensions ($3$) match, so the product is defined. The resulting matrix takes the outer dimensions, which is $4 \times 7$.

  - id: easy-matrix-vector-product
    type: multipleChoice
    prompt: |
      Compute the matrix-vector product:
      
      $$
      \begin{bmatrix} 2 & -1 \\ 3 & 4 \end{bmatrix} \begin{bmatrix} 1 \\ -2 \end{bmatrix}
      $$
    choices:
      - id: c1
        text: '$\begin{bmatrix} 4 \\ -5 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 0 \\ 11 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 2 & 2 \\ 3 & -8 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 4 \\ -2 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      Using the row-column rule:
      Top entry: $(2)(1) + (-1)(-2) = 2 + 2 = 4$.
      Bottom entry: $(3)(1) + (4)(-2) = 3 - 8 = -5$.

  - id: easy-linear-combination-concept
    type: selectAll
    prompt: |
      Which of the following expressions represent a linear combination of the vectors $\vec{v}_1$ and $\vec{v}_2$? (Select all that apply)
    choices:
      - id: c1
        text: '$3\vec{v}_1 - 2\vec{v}_2$'
      - id: c2
        text: '$\vec{v}_1 + \vec{v}_2$'
      - id: c3
        text: '$0\vec{v}_1 + 0\vec{v}_2$'
      - id: c4
        text: '$\vec{v}_1 \cdot \vec{v}_2$'
    answer:
      choiceIds:
        - c1
        - c2
        - c3
    explanation: |
      A linear combination must be in the form $c_1\vec{v}_1 + c_2\vec{v}_2$ where $c_1$ and $c_2$ are scalars. $3\vec{v}_1 - 2\vec{v}_2$, $\vec{v}_1 + \vec{v}_2$, and even the zero vector are all valid combinations.

  - id: easy-matrix-addition
    type: symbolicResponse
    prompt: |
      Compute $A + B$ if:
      
      $A = \begin{bmatrix} 1 & 0 \\ -2 & 5 \end{bmatrix}$
      
      $B = \begin{bmatrix} -1 & 3 \\ 4 & 2 \end{bmatrix}$
      
      (Provide your answer as a $2 \times 2$ matrix).
    answer:
      expectedLatex: '\begin{bmatrix} 0 & 3 \\ 2 & 7 \end{bmatrix}'
      equivalenceMode: expression
      tolerance: 0
      aliases:
        - '\begin{pmatrix} 0 & 3 \\ 2 & 7 \end{pmatrix}'
    explanation: |
      Add corresponding entries. Top left: $1 + (-1) = 0$. Top right: $0 + 3 = 3$. Bottom left: $-2 + 4 = 2$. Bottom right: $5 + 2 = 7$.

  - id: easy-identity-matrix
    type: multipleChoice
    prompt: |
      Let $I$ be the $3 \times 3$ identity matrix. If $\vec{x} = \begin{bmatrix} 4 \\ -7 \\ 2 \end{bmatrix}$, what is $I\vec{x}$?
    choices:
      - id: c1
        text: '$\begin{bmatrix} 4 \\ -7 \\ 2 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 0 \\ 0 \\ 0 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 1 \\ 1 \\ 1 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 12 \\ -21 \\ 6 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      Multiplying any vector $\vec{x}$ by the appropriate identity matrix returns the vector $\vec{x}$ unchanged.

  - id: easy-matrix-vector-weights
    type: multipleChoice
    prompt: |
      When expanding the matrix-vector product $A\vec{x}$ into a linear combination, what acts as the weights?
    choices:
      - id: c1
        text: 'The entries of the vector $\vec{x}$.'
      - id: c2
        text: 'The rows of the matrix $A$.'
      - id: c3
        text: 'The columns of the matrix $A$.'
      - id: c4
        text: 'The dimensions of the matrix $A$.'
    answer:
      choiceId: c1
    explanation: |
      $A\vec{x} = x_1\vec{a}_1 + x_2\vec{a}_2 + \dots + x_n\vec{a}_n$. The entries of $\vec{x}$ are the weights applied to the columns of $A$.
