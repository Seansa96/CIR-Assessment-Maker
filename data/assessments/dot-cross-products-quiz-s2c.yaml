  explanation: >
    Solution: $\cos\theta=12/(3\cdot8)=1/2$, so $\theta=60^\circ$.


    Why it works: The dot-product angle formula divides alignment by the product of vector magnitudes.


    Why the other choices fail: b uses the complementary angle; c would require a zero dot product; d would require parallel vectors.
