- id: q006
  type: multipleChoice
  prompt: If $\mathbf u\cdot\mathbf v=12$, $|\mathbf u|=3$, and $|\mathbf v|=8$, what is the angle between them?
  choices:
  - id: a
    text: $60^\circ$
