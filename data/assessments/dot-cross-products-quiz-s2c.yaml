- id: q001
  type: multipleChoice
  prompt: Compute $\langle1,2,-1\rangle\cdot\langle3,0,4\rangle$.
  choices:
  - id: a
    text: $-1$
    media: []
    issueSignals: []
  - id: b
    text: $7$
    media: []
    issueSignals:
    - id: dot-product-computation-error
      domains: []
  - id: c
    text: $\langle3,0,-4\rangle$
    media: []
    issueSignals:
    - id: scalar-vector-confusion
      domains: []
  - id: d
    text: $11$
    media: []
    issueSignals:
    - id: dot-product-computation-error
      domains: []
  answer:
