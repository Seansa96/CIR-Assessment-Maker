  explanation: >
    Solution: Choose $\mathbf u\cdot\mathbf v=0$.


    Why it works: $\mathbf u\cdot\mathbf v=|\mathbf u||\mathbf v|\cos\theta$, and nonzero lengths make zero correspond to a right angle.


    Why the other choices fail: b identifies parallel inputs; c does not determine an angle; d makes vectors opposite, not perpendicular.
