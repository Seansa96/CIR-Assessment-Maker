  explanation: >
    Solution: $1(3)+2(0)+(-1)(4)=-1$.


    Why it works: A dot product adds products of corresponding components.


    Why the other choices fail: b loses the negative product; c is componentwise multiplication, not a dot product; d adds entries instead of multiplying pairs.
