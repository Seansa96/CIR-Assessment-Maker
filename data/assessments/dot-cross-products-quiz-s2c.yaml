  explanation: >
    Solution: $\mathbf i\times\mathbf k=-\mathbf j$.


    Why it works: $\mathbf k\times\mathbf i=\mathbf j$, so reversing that order negates the result.


    Why the other choices fail: b misses the reversal; c is an input direction; d applies the parallel-vector case.
