questions:
- id: q001
  title: Apply Virtual machine boundary
  type: multipleChoice
  prompt: A system design discussion mentions **Virtual machine boundary**. Which conclusion is most defensible?
  choices:
  - id: a
    text: The guest sees a machine abstraction.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: The guest sees a machine abstraction. This is why Virtual machine boundary matters in Virtualization and the Cloud.
