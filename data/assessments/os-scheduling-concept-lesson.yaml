        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Real-time scheduling focuses on meeting timing constraints rather than average speed.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Real-time scheduling focuses on meeting timing constraints rather than average speed. Related topic: Scheduling.

        '
  - id: policy-versus-mechanism
    title: Policy versus mechanism
    required: true
    content: 'Scheduling mechanisms enable switching; policies decide who runs next.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Changing policy should not require rewriting all low-level switching machinery.

      '
    check:
      id: policy-versus-mechanism-check
      title: 'Check: Policy versus mechanism'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Policy versus mechanism**?

