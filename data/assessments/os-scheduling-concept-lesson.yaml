  - id: thread-scheduling
    title: Thread scheduling
    required: true
    content: 'Thread scheduling depends on whether threads are visible to the kernel and how user runtimes cooperate.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      User-level thread scheduling can conflict with kernel-level CPU allocation.

