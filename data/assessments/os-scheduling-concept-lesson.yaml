lesson:
  introduction: 'This lesson introduces Scheduling through the mental models emphasized by 2.4 Scheduling. Focus on what the
    OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: scheduler-goal
    title: Scheduler goal
    required: true
    content: 'A scheduler chooses which runnable work gets CPU time according to goals such as throughput, response time,
      fairness, or deadlines.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      There is no single best schedule without knowing the workload goal.

      '
    check:
      id: scheduler-goal-check
      title: 'Check: Scheduler goal'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Scheduler goal**?

        '
      choices:
      - id: a
        text: A scheduler chooses which runnable work gets CPU time according to goals such as throughput, response time,
          fairness, or deadlines.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A scheduler chooses which runnable work gets CPU time according to goals such as throughput, response
        time, fairness, or deadlines. Related topic: Scheduling.

        '
  - id: batch-scheduling
    title: Batch scheduling
    required: true
    content: 'Batch systems emphasize throughput and turnaround, often tolerating less interactivity.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Optimizing throughput can conflict with short response times.

      '
    check:
      id: batch-scheduling-check
      title: 'Check: Batch scheduling'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Batch scheduling**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Batch systems emphasize throughput and turnaround, often tolerating less interactivity.
      answer:
        choiceId: d
      explanation: 'Batch systems emphasize throughput and turnaround, often tolerating less interactivity. Related topic:
        Scheduling.

        '
  - id: interactive-scheduling
    title: Interactive scheduling
    required: true
    content: 'Interactive systems prioritize responsiveness so users perceive progress quickly.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Responsiveness may require preemption.

      '
    check:
      id: interactive-scheduling-check
      title: 'Check: Interactive scheduling'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Interactive scheduling**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Interactive systems prioritize responsiveness so users perceive progress quickly.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Interactive systems prioritize responsiveness so users perceive progress quickly. Related topic: Scheduling.

        '
  - id: real-time-scheduling
    title: Real-time scheduling
    required: true
    content: 'Real-time scheduling focuses on meeting timing constraints rather than average speed.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A real-time system is about deadlines, not merely being fast.

      '
    check:
      id: real-time-scheduling-check
      title: 'Check: Real-time scheduling'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Real-time scheduling**?

