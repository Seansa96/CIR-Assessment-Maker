schemaVersion: 1
id: calc1-limits-continuity-concept-lesson
title: Limits and Continuity Concept Lesson
assessmentType: conceptLesson
categoryId: calculus-1
subcategoryIds:
- calc1-limits-functions
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - limits
  - continuity
  - one-sided-limits
  - epsilon-delta
lesson:
  introduction: |
    Limits describe controlled nearby behavior. Continuity adds the demand that the actual function value agrees with that nearby behavior.
  sections:
  - id: near-not-at
    title: Near the point, not necessarily at it
    required: true
    content: |
      A limit asks what $f(x)$ approaches as $x$ approaches $a$. The value $f(a)$ can be missing or different without automatically changing the limit.
    check:
      id: near-not-at-check
      type: multipleChoice
      prompt: |
        A removable hole most directly means what?
      choices:
      - id: a
        text: The limit may exist while the function value is missing or wrong.
      - id: b
        text: The nearby outputs vanish.
      - id: c
        text: The derivative must be zero.
      - id: d
        text: The domain is all real numbers.
      answer:
        choiceId: a
      explanation: |
        A removable hole changes the point value, not necessarily the nearby trend.
  - id: epsilon-delta
    title: Epsilon-delta control
    required: true
    content: |
      $\lim_{x\to a}f(x)=L$ means every output tolerance $\varepsilon>0$ can be guaranteed by choosing a suitable input tolerance $\delta>0$.
    check:
      id: epsilon-delta-check
      type: multipleChoice
      prompt: |
        In the definition of limit, what does $\delta$ control?
      choices:
      - id: a
        text: How close $x$ is to $a$
      - id: b
        text: How close $f(x)$ is to $L$
      - id: c
        text: The final answer only
      - id: d
        text: The graph scale
      answer:
        choiceId: a
      explanation: |
        $\delta$ controls the input distance. $\varepsilon$ is the required output distance.
  - id: continuity
    title: Continuity test
    required: true
    content: |
      Continuity at $a$ requires $f(a)$ exists, $\lim_{x\to a}f(x)$ exists, and the two values are equal.
    check:
      id: continuity-check
      type: selectAll
      prompt: |
        Which conditions are required for continuity at $a$?
      choices:
      - id: a
        text: $f(a)$ exists
      - id: b
        text: $\lim_{x\to a}f(x)$ exists
      - id: c
        text: $f(a)=\lim_{x\to a}f(x)$
      - id: d
        text: $f'(a)$ exists
      answer:
        choiceIds:
        - a
        - b
        - c
      explanation: |
        Differentiability is stronger than continuity and is not part of the basic continuity test.
