id: calc2-average-value-worked-example
title: Average Value of a Function Worked Examples
assessmentType: workedExample
categoryId: calculus-2
subcategoryId: average-value
subcategoryIds:
  - average-value
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: trig-average
    title: Average Value and finding 'c'
    problem: |
      Find the average value of $f(x) = 3\sin(x)$ on the interval $[0, \pi]$.
      Then, find all values $c$ in the interval such that $f(c) = f_{avg}$.
    steps:
      - id: use-formula
        title: Apply the average value formula
        content: |
          $$ f_{avg} = \frac{1}{\pi - 0} \int_0^\pi 3\sin(x)\,dx $$
          
          $$ = \frac{3}{\pi} \int_0^\pi \sin(x)\,dx $$
      - id: integrate
        title: Evaluate the integral
        content: |
          $$ \frac{3}{\pi} [-\cos(x)]_0^\pi $$
          
          $$ = \frac{3}{\pi} (-\cos(\pi) - (-\cos(0))) $$
          
          Since $\cos(\pi) = -1$ and $\cos(0) = 1$:
          $$ = \frac{3}{\pi} (-(-1) + 1) = \frac{3}{\pi} (1 + 1) = \frac{6}{\pi} $$
          
          So, $f_{avg} = \frac{6}{\pi} \approx 1.91$.
      - id: find-c
        title: Find 'c'
        content: |
          Set $f(c) = f_{avg}$.
          
          $$ 3\sin(c) = \frac{6}{\pi} $$
          
          $$ \sin(c) = \frac{2}{\pi} $$
          
          Take the inverse sine:
          $$ c = \arcsin(2/\pi) $$
          
          Using a calculator, $c \approx 0.69$ radians.
          Because sine is symmetric around $\pi/2$ on the interval $[0, \pi]$, there is a second solution:
          $c_2 = \pi - \arcsin(2/\pi) \approx 3.14 - 0.69 = 2.45$ radians.
    check:
      id: trig-average-check
      type: numericResponse
      prompt: What is the primary decimal value of $c = \arcsin(2/\pi)$? (Calculate to 2 decimal places in radians).
      answer:
        value: 0.69
        tolerance: 0.02
      explanation: |
        $2 / 3.14159 \approx 0.6366$. $\arcsin(0.6366) \approx 0.690$ radians.
