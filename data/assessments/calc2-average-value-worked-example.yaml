workedExamples:
- id: trig-average
  title: Average Value and finding 'c'
  problem: 'Find the average value of $f(x) = 3\sin(x)$ on the interval $[0, \pi]$.

    Then, find all values $c$ in the interval such that $f(c) = f_{avg}$.

    '
  steps:
  - id: step-trig-average-1
    title: Apply the average value formula
    type: freeResponse
    skills:
    - average-value
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ f_{avg} = \frac{1}{\pi - 0} \int_0^\pi 3\sin(x)\,dx $$


      $$ = \frac{3}{\pi} \int_0^\pi \sin(x)\,dx $$

      '
  - id: step-trig-average-2
    title: Evaluate the integral
    type: freeResponse
    skills:
    - average-value
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ \frac{3}{\pi} [-\cos(x)]_0^\pi $$


      $$ = \frac{3}{\pi} (-\cos(\pi) - (-\cos(0))) $$


      Since $\cos(\pi) = -1$ and $\cos(0) = 1$:

      $$ = \frac{3}{\pi} (-(-1) + 1) = \frac{3}{\pi} (1 + 1) = \frac{6}{\pi} $$


      So, $f_{avg} = \frac{6}{\pi} \a\approx 1.91$.

      '
  - id: step-trig-average-3
    title: Find 'c'
    type: freeResponse
    skills:
    - average-value
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Set $f(c) = f_{avg}$.


      $$ 3\sin(c) = \frac{6}{\pi} $$


      $$ \sin(c) = \frac{2}{\pi} $$


      Take the inverse sine:

      $$ c = \arcsin(2/\pi) $$


      Using a calculator, $c \a\approx 0.69$ radians.

      Because sine is symmetric around $\pi/2$ on the interval $[0, \pi]$, there is
      a second solution:

      $c_2 = \pi - \arcsin(2/\pi) \a\approx 3.14 - 0.69 = 2.45$ radians.

      '
  check:
    id: trig-average-check
    type: numericResponse
    skills:
    - average-value
    prompt: What is the primary decimal value of $c = \arcsin(2/\pi)$? (Calculate
      to 2 decimal places in radians).
    answer:
      value: 0.69
      tolerance: 0.02
    explanation: '$2 / 3.14159 \a\approx 0.6366$. $\arcsin(0.6366) \a\approx 0.690$ radians.

      '

