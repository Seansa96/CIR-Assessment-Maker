directedProject:
  summary: Copy arbitrary bytes without newline translation and verify both sides of the transfer.
  estimatedTimeMinutes: 45
  outcomes:
  - Implement the binary-safe-file-copy family from a precise contract.
  - Explain the invariant and complexity of the implementation.
  - Adapt the base solution to changed requirements without breaking edge cases.
  environment:
    name: Local C++20 console project
    platform:
    - windows
    - linux
    - macos
    toolVersion: C++20
    requiredAccounts: []
    prerequisites:
    - Functions
    - loops
    - standard library containers
    installLinks: []
  resources: []
  phases:
  - id: phase-1-contract-and-approach
    title: Understand the contract and approach
    required: true
    goal: Translate the problem into an invariant before coding.
    steps:
    - id: step-1-problem-contract
      title: Read the canonical problem
      instruction: |
        Source family: `cpp-fsf-file-005`

        Implement `bool copy_file_bytes(const std::filesystem::path& source,
        const std::filesystem::path& destination)`. Copy the source byte-for-byte
        into a newly created or truncated destination. Return false if either
        file cannot be opened or if reading, writing, or flushing fails. Assume
        the two paths do not identify the same file.
      expectedObservation: Requires exact byte copying and checking both source and destination stream
        states.
      checklist:
      - id: contract-input-output
        text: I can state the exact input, output, and edge-case policy.
      - id: contract-complexity
        text: I identified which operations determine the time and space cost.
      resources: []
    - id: step-2-approach
      title: Plan the implementation
      instruction: |
        Use this approach before opening the sample solution:

        1. Open both streams in binary mode and truncate only the destination.
        2. Stream the source buffer into the destination instead of reading the entire file.
        3. Flush the destination and check source and destination states.
        4. Keep same-file detection as an explicit precondition or add a filesystem equivalence check.

        Write a short trace for one nontrivial input.
      expectedObservation: Open source and destination in binary mode, stream the source buffer into the
        destination, flush, and require healthy input and output states.
      checklist:
      - id: approach-invariant
        text: My trace preserves the stated invariant at every step.
      resources: []
  - id: phase-2-reference-and-build
    title: Study the example and build your version
    required: true
    goal: Connect the approach to complete, compilable C++.
    steps:
    - id: step-3-example-solution
      title: Trace the example solution
      instruction: |
        Binary mode prevents text newline translation. Sending the input stream
        buffer to the output streams the content without first storing the whole
        file. Both sides are checked because either reading or writing may fail.

        ```cpp
        #include <filesystem>
        #include <fstream>

        bool copy_file_bytes(const std::filesystem::path& source,
                             const std::filesystem::path& destination) {
            std::ifstream input(source, std::ios::binary);
            if (!input) return false;
            std::ofstream output(destination,
                                 std::ios::binary | std::ios::trunc);
            if (!output) return false;
            output << input.rdbuf();
            output.flush();
            return !input.bad() && static_cast<bool>(output);
        }
        ```

        Trace this solution against every representative case before writing your own version. The sample is a reference, not starter code.
      expectedObservation: Open source and destination in binary mode, stream the source buffer into the
        destination, flush, and require healthy input and output states.
      checklist:
      - id: solution-explained
        text: I can explain every branch, loop, and edge-case decision.
      - id: trap-avoided
        text: 'I can explain why this trap is wrong: Comparing only file sizes afterward; equal sizes
          do not prove equal contents or a successful copy.'
      resources: []
    - id: step-4-build
      title: Implement independently
      instruction: |
        Create `main.cpp` and implement the canonical contract without copying the reference. Add the representative cases from the bank plus at least three edge cases.
      files:
      - path: main.cpp
        purpose: Learner implementation and tests
        suggestedContent: |
          // Implement the required function here.
          // Keep main() small and use it only for your own test cases.

          int main() {
              return 0;
          }
        readOnly: false
      checklist:
      - id: build-compiles
        text: The program compiles with C++20 warnings enabled.
      - id: build-tests
        text: Representative and edge cases pass.
      troubleshooting:
      - problem: Output differs only at an edge case.
        suggestion: Comparing only file sizes afterward; equal sizes do not prove equal contents or a
          successful copy.
      resources: []
  - id: phase-3-variants
    title: Implement changed-condition variants
    required: true
    goal: Generalize the family instead of memorizing one solution.
    steps:
    - id: step-5-variants
      title: Complete the family variants
      instruction: |
        Extend the program with these variants:

        1. Copy in explicit fixed-size blocks and report total bytes transferred.
        2. Reject equivalent source and destination paths with `std::filesystem::equivalent`.
        3. Verify the result with a byte-by-byte comparison rather than file size alone.

        Keep each behavior in a separately testable function.
      checklist:
      - id: variants-distinct
        text: Each variant changes behavior or constraints, not only sample data.
      - id: variants-regression
        text: The original canonical tests still pass.
      notesPrompt: Which part of the original invariant survived every variant, and which part had to
        change?
      resources: []
