workedExamples:
  - id: ssa-trap
    title: |
      Recognizing the SSA Trap
    problem: |
      ![Recognizing the SSA Trap diagram](/assessments/geometry/triangles/geometry-triangle-congruence-worked-example-2-ssa-trap.svg)
      
      Two triangles have two corresponding sides and a non-included angle marked equal. No right angle is given. Is this enough to prove congruence?
    steps:
      - id: ssa-trap-step-1
        title: |
          Identify the governing idea
        instruction: |
          Start by deciding which theorem, formula, or geometric structure controls the problem.
        type: multipleChoice
        prompt: |
          Which idea should drive the solution?
        choices:
          - id: a
            text: |
              SSA is not a general congruence theorem
          - id: b
            text: |
              Pythagorean theorem
          - id: c
            text: |
              Triangle inequality only
          - id: d
            text: |
              A visual estimate without proof
        answer:
          choiceId: a
        explanation: |
          The controlling idea is SSA is not a general congruence theorem. It matches the given information and gives a reliable path.
      - id: ssa-trap-step-2
        title: |
          Separate useful facts from noise
        instruction: |
          Before solving, identify the facts that justify the theorem or formula instead of grabbing a random equation.
        type: selectAll
        prompt: |
          Which statements support the solution?
        choices:
          - id: a
            text: |
              The given information matches SSA is not a general congruence theorem.
          - id: b
            text: |
              The diagram should be labeled before computing.
          - id: c
            text: |
              The final answer can be guessed from the drawing alone.
          - id: d
            text: |
              A different theorem should be used even if its conditions are missing.
        answer:
          choiceIds:
            - a
            - b
        explanation: |
          The correct statements connect the givens to the chosen method. The others either skip justification or apply a theorem without its required conditions.
      - id: ssa-trap-step-3
        title: |
          Find the key result
        instruction: |
          Now use the selected method to get the main intermediate or final value.
        type: multipleChoice
        prompt: |
          Which key result is correct?
        choices:
          - id: a
            text: |
              not enough information
          - id: b
            text: |
              Not enough information
          - id: c
            text: |
              Use the largest number as the answer
          - id: d
            text: |
              The drawing alone determines it
        answer:
          choiceId: a
        explanation: |
          SSA is ambiguous because the non-included angle can allow two different triangles. It becomes HL only when right-triangle conditions are present.
      - id: ssa-trap-step-4
        title: |
          Choose the final conclusion
        instruction: |
          Use the key result to answer the original question clearly.
        type: multipleChoice
        prompt: |
          Which conclusion follows?
        choices:
          - id: a
            text: |
              SSA does not generally prove congruence.
          - id: b
            text: |
              The result cannot be determined.
          - id: c
            text: |
              A different theorem is required after solving.
          - id: d
            text: |
              The diagram contradicts the computation.
        answer:
          choiceId: a
        explanation: |
          SSA is ambiguous because the non-included angle can allow two different triangles. It becomes HL only when right-triangle conditions are present.
      - id: ssa-trap-step-5
        title: |
          Explain the complete path
        instruction: |
          Finish by explaining the reasoning in your own words. This is the step that turns a calculation into reusable geometry knowledge.
        type: freeResponse
        prompt: |
          Write a short final explanation of the solution.
        answer:
          expected: |
            SSA is ambiguous because the non-included angle can allow two different triangles. It becomes HL only when right-triangle conditions are present.
          gradingMode: selfCheck
          keyPoints:
            - |
              Name the exact theorem or formula.
            - |
              Show how the givens satisfy that method.
            - |
              State the final result with units or classification where appropriate.
        explanation: |
          SSA is ambiguous because the non-included angle can allow two different triangles. It becomes HL only when right-triangle conditions are present.
          
          Related topic: Triangle Congruence.
  - id: overlapping-shared-side
    title: |
      Overlapping Triangles With a Shared Side
    problem: |
      ![Overlapping Triangles With a Shared Side diagram](/assessments/geometry/triangles/geometry-triangle-congruence-worked-example-2-overlapping-shared-side.svg)
      
      Triangles $ABD$ and $CBD$ share side $BD$. Given $AB=CB$ and $AD=CD$, prove the triangles congruent and identify what CPCTC can justify afterward.
    steps:
      - id: overlapping-shared-side-step-1
        title: |
          Identify the governing idea
        instruction: |
          Start by deciding which theorem, formula, or geometric structure controls the problem.
        type: multipleChoice
        prompt: |
          Which idea should drive the solution?
        choices:
          - id: a
            text: |
              SSS with reflexive shared side
          - id: b
            text: |
              Pythagorean theorem
          - id: c
            text: |
              Triangle inequality only
          - id: d
            text: |
              A visual estimate without proof
        answer:
          choiceId: a
        explanation: |
          The controlling idea is SSS with reflexive shared side. It matches the given information and gives a reliable path.
      - id: overlapping-shared-side-step-2
        title: |
          Separate useful facts from noise
        instruction: |
          Before solving, identify the facts that justify the theorem or formula instead of grabbing a random equation.
        type: selectAll
        prompt: |
          Which statements support the solution?
        choices:
          - id: a
            text: |
              The given information matches SSS with reflexive shared side.
          - id: b
            text: |
              The diagram should be labeled before computing.
          - id: c
            text: |
              The final answer can be guessed from the drawing alone.
          - id: d
            text: |
              A different theorem should be used even if its conditions are missing.
        answer:
          choiceIds:
            - a
            - b
        explanation: |
          The correct statements connect the givens to the chosen method. The others either skip justification or apply a theorem without its required conditions.
      - id: overlapping-shared-side-step-3
        title: |
          Find the key result
        instruction: |
          Now use the selected method to get the main intermediate or final value.
        type: multipleChoice
        prompt: |
          Which key result is correct?
        choices:
          - id: a
            text: |
              $BD=BD$
          - id: b
            text: |
              Not enough information
          - id: c
            text: |
              Use the largest number as the answer
          - id: d
            text: |
              The drawing alone determines it
        answer:
          choiceId: a
        explanation: |
          The three side pairs are $AB=CB$, $AD=CD$, and $BD=BD$. The shared side is valid by the reflexive property.
      - id: overlapping-shared-side-step-4
        title: |
          Choose the final conclusion
        instruction: |
