lesson:
  introduction: This deeper lesson expands Scheduling from Chapter 2 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: scheduling-goals
    title: Scheduling goals
    required: true
    content: 'A scheduler may optimize throughput, response time, fairness, deadline success, or CPU utilization depending on workload.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Scheduling, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: scheduling-goals-deep-check
      title: 'Check: Scheduling goals'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Scheduling goals**?
      choices:
      - id: a
        text: There is no single best scheduler without a goal.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'There is no single best scheduler without a goal. Related topic: Scheduling.'
    media:
    - type: image
      src: /assessments/operating-systems/scheduling/round-robin-timeslice.svg
      alt: Round-robin time slices rotating several processes through the CPU.
      caption: Time slicing can improve responsiveness by rotating CPU access.
  - id: batch-policies
    title: Batch policies
    required: true
    content: 'Batch scheduling often emphasizes throughput and turnaround, so shortest-job-style ideas can help when job lengths are known or estimated.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Scheduling, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: batch-policies-deep-check
      title: 'Check: Batch policies'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Batch policies**?
      choices:
      - id: a
        text: Batch scheduling cares less about immediate interaction.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Batch scheduling cares less about immediate interaction. Related topic: Scheduling.'
  - id: interactive-policies
    title: Interactive policies
    required: true
    content: 'Interactive systems use preemption, time slices, and priority adjustments to keep users seeing progress.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Scheduling, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: interactive-policies-deep-check
      title: 'Check: Interactive policies'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Interactive policies**?
      choices:
      - id: a
        text: Responsiveness can conflict with raw throughput.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Responsiveness can conflict with raw throughput. Related topic: Scheduling.'
    media:
    - type: image
      src: /assessments/operating-systems/scheduling/scheduler-queues.svg
      alt: Ready, running, and blocked queues with transitions for preemption and wakeup.
      caption: Schedulers move work among ready, running, and blocked states.
  - id: real-time
    title: Real-time scheduling
    required: true
    content: 'Real-time systems care about meeting deadlines; fast average behavior is not enough.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Scheduling, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: real-time-deep-check
      title: 'Check: Real-time scheduling'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Real-time scheduling**?
      choices:
      - id: a
        text: Real-time means deadline-aware, not just fast.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Real-time means deadline-aware, not just fast. Related topic: Scheduling.'
  - id: affinity-and-threads
    title: Thread scheduling details
    required: true
    content: 'Thread visibility and processor affinity affect how well scheduling decisions preserve cache locality and parallelism.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Scheduling, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: affinity-and-threads-deep-check
      title: 'Check: Thread scheduling details'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Thread scheduling details**?
      choices:
      - id: a
        text: Moving work can balance load but hurt locality.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Moving work can balance load but hurt locality. Related topic: Scheduling.'
