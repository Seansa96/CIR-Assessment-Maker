workedExamples:
- id: we-torque-1
  title: Stepped Pulley
  problem: A stepped pulley consists of two concentric cylinders of radii $R_1 = 0.5
    \text{ m}$ (outer) and $R_2 = 0.2 \text{ m}$ (inner). Two forces, $T_1 = 100 \text{
    N}$ and $T_2 = 150 \text{ N}$, are applied tangentially as shown. Calculate the
    net torque.
  steps:
  - id: we-torque-1-step1
    title: 'Step 1: Torque Vector Analysis'
    instruction: Identify the direction of the torque produced by each force. Assume
      counterclockwise is positive.
    prompt: What is the net torque $\tau_{net}$?
    type: numericResponse
    media:
    - type: image
      src: /media/physics/worked-examples/torque-pulley-fbd.png
      alt: Free body diagram of a stepped pulley with two forces T1 and T2.
      caption: Stepped pulley free body diagram.
    answer:
      value: 20
      tolerance: 1
    explanation: |
      Solution: $\tau_1=(100)(0.5)=+50$ N m and $\tau_2=-(150)(0.2)=-30$ N m, so $\tau_{net}=20$ N m.

      Why it works: Tangential forces create torque equal to force times radius, and the stated counterclockwise sign convention determines the algebraic sum.
