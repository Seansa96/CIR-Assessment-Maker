schemaVersion: 1
id: physics-torque-worked-example
title: 'Worked Example: Torque FBD'
description: Calculating net torque on a stepped pulley.
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
- physics-torque
workedExamples:
- id: we-torque-1
  title: Stepped Pulley
  problem: A stepped pulley consists of two concentric cylinders of radii $R_1 = 0.5
    \text{ m}$ (outer) and $R_2 = 0.2 \text{ m}$ (inner). Two forces, $T_1 = 100 \text{
    N}$ and $T_2 = 150 \text{ N}$, are applied tangentially as shown. Calculate the
    net torque.
  steps:
  - id: we-torque-1-step1
    title: 'Step 1: Torque Vector Analysis'
    instruction: Identify the direction of the torque produced by each force. Assume
      counterclockwise is positive.
    prompt: What is the net torque $\tau_{net}$?
    type: numericResponse
    media:
    - type: image
      src: /media/physics/worked-examples/torque-pulley-fbd.png
      alt: Free body diagram of a stepped pulley with two forces T1 and T2.
      caption: Stepped pulley free body diagram.
    answer:
      value: 20
      tolerance: 1
    explanation: '$$T_1 \text{ acts at the bottom of the outer radius, producing a
      counterclockwise (positive) torque: } \tau_1 = T_1 R_1 = 100 \times 0.5 = 50
      \text{ N}\cdot\text{m}$$ $$T_2 \text{ acts at the bottom of the inner radius
      on the left side, producing a clockwise (negative) torque: } \tau_2 = -T_2 R_2
      = -150 \times 0.2 = -30 \text{ N}\cdot\text{m}$$ $$\tau_{net} = 50 - 30 = 20
      \text{ N}\cdot\text{m}$$'
