questions:
- id: area-easy-1
  title: Area Between Parabolas
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the area of the region bounded by $y = 4x^2$ and $y = 4$.'
  answer:
    gradingMode: auto
    expectedLatex: (4/3)*4
    equivalenceMode: expression
    tolerance: 0
  explanation: Intersections at $x=-1, 1$. $\int_{-1}^1 (4 - 4x^2) \, dx = \frac{16}{3}$.
