schemaVersion: 1
id: cpp-basics-glossary
title: C++ Basics Glossary
assessmentType: glossary
categoryId: c++
topicId: c++-basics
modeDefault: practice
navigation:
  learningGoal: learn
  activityType: glossary
  tags: [c++, c++-basics, program-structure, build-output]
authoring:
  visualRequirement: notApplicable
  visualRationale: This reference defines code and build vocabulary; the associated concept lesson provides the build-flow visual.
glossary:
  introduction: Use this reference to identify the parts of a first C++ program and the stages that turn it into a runnable executable.
  sections:
  - id: program-and-build-terms
    title: Program and build vocabulary
    entries:
    - id: cpp-main-entry
      term: '`main`'
      definition: The entry-point function of a hosted C++ program. Execution begins in its body.
      drills:
      - id: cpp-main-entry-cloze
        type: typed
        prompt: The normal entry-point function of a hosted C++ program is ________.
        answer: { expected: main }
    - id: cpp-header
      term: Header
      definition: A file included with `#include` that makes declarations available to the source file, such as `<iostream>` for stream I/O.
      drills:
      - id: cpp-header-cloze
        type: typed
        prompt: The header that declares `std::cout` is ________.
        answer: { expected: '<iostream>', aliases: [iostream] }
    - id: cpp-namespace
      term: Namespace qualification
      definition: A prefix such as `std::` that identifies the namespace owning a name and prevents accidental name collisions.
      drills:
      - id: cpp-namespace-cloze
        type: typed
        prompt: In `std::cout`, `std` is the ________.
        answer: { expected: namespace }
    - id: cpp-compiler-linker
      term: Compiler and linker
      definition: The compiler translates source into object code; the linker combines translated pieces and required libraries into an executable.
      drills:
      - id: cpp-linker-cloze
        type: typed
        prompt: The build stage that combines object code and libraries is the ________.
        answer: { expected: linker }
