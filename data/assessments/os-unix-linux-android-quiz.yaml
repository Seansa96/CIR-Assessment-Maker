- id: q004
  title: Explain Permissions
  type: freeResponse
  prompt: 'In a short answer, explain why **Permissions** matters in UNIX, Linux, and Android.

    '
  answer:
    expected: 'UNIX permissions model access by owner, group, and others with read, write, and execute bits. A complete answer
      should also note that execute on a directory means traversal, not running the directory.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Permissions
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: UNIX, Linux, and Android. The key is to connect the term to what the OS controls or protects.

    '
