workedExamples:
- id: we001
  title: Classify a piecewise function at a point
  problem: |
    Let

    $$
    f(x)=\begin{cases}
    x+1, & x<2,\\
    5, & x=2,\\
    3x-3, & x>2.
    \end{cases}
    $$

    Determine whether $f$ is continuous at $x=2$ and classify any discontinuity.
  steps:
  - id: lim-cont-s001
    title: Left-hand limit
    instruction: |
      Use the branch for $x<2$.
    type: numericResponse
    prompt: |
      What is $\lim_{x\to2^-}f(x)$?
    answer:
      value: 3
      tolerance: 0.000001
    explanation: |
      The left branch is $x+1$, so the left-hand limit is $3$.
  - id: lim-cont-s002
    title: Right-hand limit
    instruction: |
      Use the branch for $x>2$.
    type: numericResponse
    prompt: |
      What is $\lim_{x\to2^+}f(x)$?
    answer:
      value: 3
      tolerance: 0.000001
    explanation: |
      The right branch is $3x-3$, so the right-hand limit is $3$.
  - id: lim-cont-s003
    title: Point value
    instruction: |
      The middle line gives the actual value at the point.
    type: numericResponse
    prompt: |
      What is $f(2)$?
    answer:
      value: 5
      tolerance: 0.000001
    explanation: |
      The function value is declared to be $5$.
  - id: lim-cont-s004
    title: Classification
    instruction: |
      The two-sided limit exists and equals $3$, but the point value is $5$.
    type: multipleChoice
    prompt: |
      What kind of discontinuity occurs?
    choices:
    - id: a
      text: Removable discontinuity
    - id: b
      text: Jump discontinuity
    - id: c
      text: Infinite discontinuity
    - id: d
      text: No discontinuity
    answer:
      choiceId: a
    explanation: |
      Redefining $f(2)$ as $3$ would repair continuity, so the discontinuity is removable.
