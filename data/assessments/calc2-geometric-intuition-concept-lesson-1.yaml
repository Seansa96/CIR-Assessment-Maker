lesson:
  introduction: |-
    Calculus is not just about moving symbols around on a page—it's a deeply geometric subject. To master Calculus 2, you must develop a strong **geometric intuition** for what integration actually *does*: it accumulates infinitesimally small pieces.
  sections:
  - id: sec-riemann
    title: From Rectangles to Continuous Slices
    required: true
    content: |-
      In Calculus 1, you learned that the integral $\int f(x)\,dx$ computes the area under a curve. But geometrically, what does $f(x)\,dx$ represent?
      
      Think of $dx$ as the extremely tiny (infinitesimal) width of a rectangle. The height of that rectangle is the function's value, $f(x)$. The area of that single microscopic rectangle is:
      $$\text{Area} = \text{height} \times \text{width} = f(x)\,dx$$
      
      The integral symbol $\int$ is an elongated "S" that stands for "Sum". It simply sweeps across the interval and adds up the areas of all these tiny rectangles:
      $$\text{Total Area} = \int (\text{Area of one slice}) = \int f(x)\,dx$$

  - id: sec-3d-slicing
    title: Extending to 3D Slicing
    required: true
    content: |-
      This geometric intuition—that an integral is just an infinite sum of tiny slices—is the key to unlocking Calculus 2. We don't just accumulate 2D rectangles anymore. 
      
      What if we want to find the volume of a 3D solid? Instead of rectangles, we slice the solid into incredibly thin 3D slabs (like slicing a loaf of bread). If the area of the face of the slice is $A(x)$, and the thickness is $dx$, the volume of that single slice is:
      $$dV = A(x)\,dx$$
      
      To find the total volume, we just sum up the slices:
      $$V = \int dV = \int A(x)\,dx$$
      
      If you can visualize the shape of the slice and write down a formula for its area, the integral handles the rest.

questions:
- id: q-geom-int-1
  title: Concept Check - The Meaning of dx
  prompt: |-
    In the integral $\int A(x)\,dx$ for calculating volume, what geometric feature does the $dx$ term represent?
  type: multipleChoice
  choices:
  - id: c1
    text: The area of the slice
  - id: c2
    text: The infinitesimally small thickness of the slice
  - id: c3
    text: The total volume of the solid
  answer:
    choiceId: c2
  explanation: |-
    The $dx$ (or $dy$) always represents the infinitesimally small dimension—in this case, the **thickness** of the 3D slice. When you multiply the cross-sectional area $A(x)$ by the thickness $dx$, you get the tiny volume $dV$.
  skills:
  - geometric-intuition

- id: q-geom-int-2
  title: Concept Check - The Integral Symbol
  prompt: |-
    The integral symbol $\int$ acts as a continuous version of which discrete mathematical operation?
  type: multipleChoice
  choices:
  - id: c1
    text: Subtraction ($-$)
  - id: c2
    text: Division ($\div$)
  - id: c3
    text: Summation ($\Sigma$)
  answer:
    choiceId: c3
  explanation: |-
    The integral symbol is an elongated "S" for "Sum". It performs a continuous **summation** of infinitely many infinitesimally small pieces.
  skills:
  - geometric-intuition
