questions:
- id: q1
  type: numericResponse
  prompt: A solid uniform sphere ($I = \frac{2}{5}MR^2$) rolls without slipping. What
    percentage of its total kinetic energy is rotational kinetic energy?
  answer:
    value: 28.57
    tolerance: 1.0
  explanation: $K_{tot} = \frac{1}{2}Mv^2 + \frac{1}{2}(\frac{2}{5}MR^2)(v/R)^2 =
    \frac{1}{2}Mv^2 + \frac{1}{5}Mv^2 = \frac{7}{10}Mv^2$. $K_{rot} = \frac{1}{5}Mv^2$.
    Fraction = $(1/5) / (7/10) = 2/7 \approx 28.57\%$.
