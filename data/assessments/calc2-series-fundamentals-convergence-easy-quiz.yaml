questions:
- id: q001
  type: multipleChoice
  prompt: |
    Does the series converge or diverge?

    $$
    \sum_{n=1}^{\infty}\frac1n
    $$
  choices:
  - id: a
    text: Diverges; harmonic series
  - id: b
    text: Converges; geometric series
  - id: c
    text: Converges absolutely
  - id: d
    text: Diverges by oscillation
  answer:
    choiceId: a
  explanation: |-
    Solution: This is the harmonic series, which diverges even though its terms approach $0$. Therefore the answer is Diverges; harmonic series.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: Converges; geometric series conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Converges absolutely conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Diverges by oscillation conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
