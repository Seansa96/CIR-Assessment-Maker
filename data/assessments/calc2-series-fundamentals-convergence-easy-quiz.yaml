questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac1n
      $$
    choices:
      - id: a
        text: Diverges; harmonic series
      - id: b
        text: Converges; geometric series
      - id: c
        text: Converges absolutely
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      This is the harmonic series, which diverges even though its terms approach $0$.
  - id: q002
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac1{n^2}
      $$
    choices:
      - id: a
        text: Converges; p-series with $p>1$
      - id: b
        text: Diverges; harmonic series
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      This is a p-series with $p=2$. A p-series converges when $p>1$.
  - id: q003
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=0}^{\infty}\left(\frac12\right)^n
      $$
    choices:
      - id: a
        text: Converges; geometric ratio has absolute value less than 1
      - id: b
        text: Diverges; geometric ratio is greater than 1
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Diverges by comparison to the harmonic series
    answer:
      choiceId: a
    explanation: |
      A geometric series $\sum r^n$ converges when $|r|<1$. Here $r=\frac12$.
  - id: q004
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=0}^{\infty}\left(\frac32\right)^n
      $$
    choices:
      - id: a
        text: Diverges; geometric ratio has absolute value greater than 1
      - id: b
        text: Converges; geometric series
      - id: c
        text: Converges conditionally
      - id: d
        text: Converges by p-series test
    answer:
      choiceId: a
    explanation: |
      The ratio is $\frac32$, so the terms do not approach $0$. The series diverges.
  - id: q005
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{n}{n+1}
      $$
    choices:
      - id: a
        text: Diverges by the nth-term test
      - id: b
        text: Converges by comparison to $\frac1{n^2}$
      - id: c
        text: Converges conditionally
      - id: d
        text: Converges as a telescoping series
    answer:
      choiceId: a
    explanation: |
      The terms approach $1$, not $0$. If terms fail to approach $0$, the infinite series must diverge.
  - id: q006
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{(-1)^n}{n}
      $$
    choices:
      - id: a
        text: Converges conditionally by the alternating series test
      - id: b
        text: Converges absolutely by p-series
      - id: c
        text: Diverges by harmonic series
      - id: d
        text: Diverges because signs alternate
    answer:
      choiceId: a
    explanation: |
      The alternating harmonic series converges by the alternating series test, but the absolute-value series is harmonic and diverges.
  - id: q007
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac1{\sqrt n}
      $$
    choices:
      - id: a
        text: Diverges; p-series with $p\le 1$
      - id: b
        text: Converges; p-series with $p>1$
      - id: c
        text: Converges by ratio test
      - id: d
        text: Converges by telescoping
    answer:
      choiceId: a
    explanation: |
      This is $\sum \frac1{n^{1/2}}$, a p-series with $p=\frac12\le 1$, so it diverges.
  - id: q008
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac1{n(n+1)}
      $$
    choices:
      - id: a
        text: Converges; it telescopes
      - id: b
        text: Diverges; harmonic series
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Diverges by comparison to $n$
    answer:
      choiceId: a
    explanation: |
      Since $\frac1{n(n+1)}=\frac1n-\frac1{n+1}$, the partial sums telescope and approach a finite value.
  - id: q009
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{n}{2^n}
      $$
    choices:
      - id: a
        text: Converges by the ratio test
      - id: b
        text: Diverges by nth-term test
      - id: c
        text: Diverges like harmonic
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Exponential growth in the denominator beats the linear numerator. The ratio test gives a limit of $\frac12<1$.
  - id: q010
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=0}^{\infty}\frac{2^n}{n!}
      $$
    choices:
      - id: a
        text: Converges by the ratio test
      - id: b
        text: Diverges by nth-term test
      - id: c
        text: Diverges as a p-series
      - id: d
        text: Diverges by comparison to $2^n$
    answer:
      choiceId: a
    explanation: |
      The ratio of consecutive terms is $\frac{2}{n+1}\to 0$, so the series converges.
  - id: q011
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{n!}{10^n}
      $$
    choices:
      - id: a
        text: Diverges by the ratio test
      - id: b
        text: Converges by the ratio test
      - id: c
        text: Converges by p-series
      - id: d
        text: Converges conditionally
    answer:
      choiceId: a
    explanation: |
      The ratio is $\frac{a_{n+1}}{a_n}=\frac{n+1}{10}$, which grows beyond $1$. The terms eventually grow instead of going to $0$.
  - id: q012
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=2}^{\infty}\frac1{n\ln n}
      $$
    choices:
      - id: a
        text: Diverges by the integral test
      - id: b
        text: Converges by p-series
      - id: c
        text: Converges by geometric comparison
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The integral of $\frac1{x\ln x}$ grows like $\ln(\ln x)$, so it diverges.
  - id: q013
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=2}^{\infty}\frac1{n(\ln n)^2}
      $$
    choices:
      - id: a
        text: Converges by the integral test
      - id: b
        text: Diverges like harmonic
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Diverges by ratio test
    answer:
      choiceId: a
    explanation: |
      For $\sum \frac1{n(\ln n)^p}$, the series converges when $p>1$. Here $p=2$.
  - id: q014
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}\frac{\cos n}{n^2}
      $$
    choices:
      - id: a
        text: Converges absolutely by comparison to $\frac1{n^2}$
      - id: b
        text: Diverges because $\cos n$ oscillates
      - id: c
        text: Diverges by nth-term test
      - id: d
        text: Converges conditionally only
    answer:
      choiceId: a
    explanation: |
      Since $|\cos n|\le 1$, $\left|\frac{\cos n}{n^2}\right|\le\frac1{n^2}$, and $\sum \frac1{n^2}$ converges.
  - id: q015
    type: multipleChoice
    prompt: |
      Does the series converge or diverge?

      $$
      \sum_{n=1}^{\infty}(-1)^n
      $$
    choices:
      - id: a
        text: Diverges by the nth-term test
      - id: b
        text: Converges conditionally
      - id: c
        text: Converges absolutely
      - id: d
        text: Converges to 0
    answer:
      choiceId: a
    explanation: |
      The terms $(-1)^n$ do not approach $0$, so the series diverges.
