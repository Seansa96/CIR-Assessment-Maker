- id: q005
  type: multipleChoice
  prompt: |
    Does the series converge or diverge?

    $$
    \sum_{n=1}^{\infty}\frac{n}{n+1}
    $$
  choices:
  - id: a
    text: Diverges by the nth-term test
  - id: b
    text: |-
      Converges by comparison to $\frac1{n^2}$
  - id: c
    text: Converges conditionally
  - id: d
    text: Converges as a telescoping series
  answer:
    choiceId: a
  explanation: |-
    Solution: The terms approach $1$, not $0$. If terms fail to approach $0$, the infinite series must diverge. Therefore the answer is Diverges by the nth-term test.

    Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

    Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

    Why the other choices fail: Converges by comparison to $\frac1{n^2}$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; Converges conditionally conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; Converges as a telescoping series conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
