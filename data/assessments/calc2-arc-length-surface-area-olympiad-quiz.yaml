questions:
- id: q001
  type: freeResponse
  skills:
  - arc-length-surface-area
  - olympiad-problem-solving
  prompt: Find the arc length of $y=\frac23x^{3/2}$ from $x=0$ to $x=3$.
  answer:
    gradingMode: selfCheck
    expected: $\frac23\left((1+3)^{3/2}-1\right)$.
    keyPoints:
    - 'Matches the reference result: $\frac23\left((1+3)^{3/2}-1\right)$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: Here $y'=\sqrt{x}$, so $ds=\sqrt{1+x}dx$. Integrating from 0 to $3$ gives the stated length.
