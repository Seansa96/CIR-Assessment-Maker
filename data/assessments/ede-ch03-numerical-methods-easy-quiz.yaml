- id: q007
  type: multipleChoice
  skills:
  - ede-ch03-numerical-methods-runge-kutta
  prompt: How many stage slopes appear in classical RK4?
  choices:
  - id: a
    text: Four.
  - id: b
    text: One.
    issueSignals:
    - id: ede-rk4-weighting-error
      domains: *id001
  - id: c
    text: Two.
    issueSignals:
    - id: ede-rk4-weighting-error
      domains: *id001
  - id: d
    text: Eight.
    issueSignals:
    - id: ede-rk4-weighting-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Four.

    Why it works: RK4 evaluates four prescribed stage states and combines their slopes with weights $1,2,2,1$.

    Why the other choices fail: The distractors misplace a stage, discard a slope, or replace the $1,2,2,1$ weighted combination.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-runge-kutta
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q008
  type: numericResponse
  skills:
  - ede-ch03-numerical-methods-euler-updates
  prompt: For $y'=y$, $y(0)=2$, Euler with $h=0.25$ gives what $y_1$?
  answer:
    value: 2.5
    tolerance: 0.01
  explanation: |-
    Solution: $y_1=2+0.25(2)=2.50$.

    Why it works: Euler advances from the known current mesh state by multiplying its right-hand-side slope by the step size.
