questions:
- id: q001
  type: numericResponse
  skills:
  - ede-ch03-numerical-methods-euler-updates
  prompt: Use Euler for $y'=x+y$, $y(0)=1$, $h=0.2$. Find $y_1$.
  answer:
    value: 1.2
    tolerance: 0.01
  explanation: |-
    Solution: $y_1=1+0.2(0+1)=1.20$.

    Why it works: Euler advances from the known current mesh state by multiplying its right-hand-side slope by the step size.
  difficultyDimensions:
  - modelOrDerivation
  - estimationOrBounds
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-euler-updates
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q002
  type: multipleChoice
  skills:
  - ede-ch03-numerical-methods-euler-updates
  prompt: For Euler’s method, which value is evaluated at the current mesh point?
  choices:
  - id: a
    text: The slope $f(x_n,y_n)$.
  - id: b
    text: The exact future value $y(x_{n+1})$.
    issueSignals:
    - id: ede-numerical-current-state-error
      domains: &id001
      - elementary-differential-equations-bvp
  - id: c
    text: Only the independent variable $x_{n+1}$.
    issueSignals:
    - id: ede-numerical-current-state-error
      domains: *id001
  - id: d
    text: A slope from a different IVP.
    issueSignals:
    - id: ede-numerical-current-state-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The slope $f(x_n,y_n)$.

    Why it works: Euler advances from the known current mesh state by multiplying its right-hand-side slope by the step size.

    Why the other choices fail: The distractors use a future or unrelated state, omit the step-size update, or substitute information Euler does not require.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-euler-updates
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q003
  type: numericResponse
  skills:
  - ede-ch03-numerical-methods-euler-updates
  prompt: For $y'=y$, $y(0)=1$, Euler with $h=0.1$ gives what estimate for $y(0.2)$?
  answer:
    value: 1.21
    tolerance: 0.01
  explanation: |-
    Solution: $y_1=1.1$ and $y_2=1.1+0.1(1.1)=1.21$.

    Why it works: Euler advances from the known current mesh state by multiplying its right-hand-side slope by the step size.
  difficultyDimensions:
  - modelOrDerivation
  - estimationOrBounds
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-euler-updates
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q004
  type: multipleChoice
  skills:
  - ede-ch03-numerical-methods-error-step-size
  prompt: Which statement correctly describes global error?
  choices:
  - id: a
    text: It is the difference between a computed value and the exact value after accumulated steps.
  - id: b
    text: It is only the slope at the starting point.
    issueSignals:
    - id: ede-numerical-local-global-error
      domains: *id001
  - id: c
    text: It vanishes whenever $h$ is nonzero.
    issueSignals:
    - id: ede-numerical-local-global-error
      domains: *id001
  - id: d
    text: It is the same thing as an initial condition.
    issueSignals:
    - id: ede-numerical-local-global-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: It is the difference between a computed value and the exact value after accumulated steps.

    Why it works: The claim compares an approximation and reference at the same point while distinguishing one-step error from accumulated error.

    Why the other choices fail: The distractors confuse a slope or initial datum with error, compare unlike endpoints, or reverse the refinement evidence.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-error-step-size
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q005
  type: numericResponse
  skills:
  - ede-ch03-numerical-methods-improved-euler
  prompt: For $y'=x+y$, $y(0)=1$, improved Euler with $h=0.2$ gives what one-step estimate?
  answer:
    value: 1.24
    tolerance: 0.01
  explanation: |-
    Solution: Predict $1.2$, then average slopes $1$ and $1.4$: $1+0.2(1.2)=1.24$.

    Why it works: The corrected update uses a predictor or midpoint stage to represent how the slope changes across the step.
  difficultyDimensions:
  - modelOrDerivation
  - estimationOrBounds
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-improved-euler
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
