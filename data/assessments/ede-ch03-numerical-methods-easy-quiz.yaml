- id: q009
  type: multipleChoice
  skills:
  - ede-ch03-numerical-methods-method-comparison
  prompt: A reference solution is used primarily to do what?
  choices:
  - id: a
    text: Estimate the error of a numerical approximation.
  - id: b
    text: Change the IVP.
    issueSignals:
    - id: ede-numerical-reference-error
      domains: *id001
  - id: c
    text: Eliminate the step size.
    issueSignals:
    - id: ede-numerical-reference-error
      domains: *id001
  - id: d
    text: Replace all computed values with slopes.
    issueSignals:
    - id: ede-numerical-reference-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Estimate the error of a numerical approximation.

    Why it works: A fair method comparison fixes the IVP and endpoint, then considers both reference error and right-hand-side evaluation cost.

    Why the other choices fail: The distractors compare unlike tasks or ignore either endpoint accuracy or the number of slope evaluations.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch03-numerical-methods-method-comparison
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
