items:
- id: drill-ll-access
  prompt: What is the worst-case time complexity of accessing the $i$-th element in a singly linked list?
  answer: { expected: 'O(n)' }
- id: drill-ll-insert-head
  prompt: What is the worst-case time complexity of inserting a new node at the head (beginning) of a
    linked list?
  answer: { expected: 'O(1)' }
- id: drill-ll-delete-tail
  prompt: What is the worst-case time complexity of deleting the tail (last node) of a singly linked list,
    assuming you only have a pointer to the head?
  answer: { expected: 'O(n)' }


