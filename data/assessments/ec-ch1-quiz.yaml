schemaVersion: 1
id: ec-ch1-quiz
title: Circuit Variables Quiz
assessmentType: quiz
categoryId: electronics-and-circuits
topicId: ec-circuit-variables
skills:
- Apply ec-circuit-variables
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - electronics-and-circuits
  - ec-circuit-variables
modeDefault: practice
questions:
- id: q001
  type: multipleChoice
  prompt: Which of the following is the SI unit for electric charge?
  explanation: Charge is measured in Coulombs.
  choices:
  - id: a
    text: Coulomb
  - id: b
    text: Ampere
  - id: c
    text: Volt
  - id: d
    text: Watt
  answer:
    choiceId: a
- id: q002
  type: multipleChoice
  prompt: 'Under the passive sign convention, if $p = -15\text{ W}$, the element is:'
  explanation: Negative absorbed power means the element is supplying/delivering power.
  choices:
  - id: a
    text: Delivering power to the circuit
  - id: b
    text: Absorbing power from the circuit
  - id: c
    text: Dissipating heat
  - id: d
    text: Storing energy
  answer:
    choiceId: a
- id: q003
  type: multipleChoice
  prompt: 'Current is defined as the time derivative of:'
  explanation: $i = dq/dt$
  choices:
  - id: a
    text: Charge
  - id: b
    text: Voltage
  - id: c
    text: Energy
  - id: d
    text: Power
  answer:
    choiceId: a
- id: q004
  type: multipleChoice
  prompt: 'Voltage is defined as the derivative of energy with respect to:'
  explanation: $v = dw/dq$
  choices:
  - id: a
    text: Charge
  - id: b
    text: Time
  - id: c
    text: Current
  - id: d
    text: Power
  answer:
    choiceId: a
- id: q005
  type: multipleChoice
  prompt: Which of the following is an ideal basic circuit element property?
  explanation: An ideal basic element has two terminals and cannot be subdivided.
  choices:
  - id: a
    text: It has exactly two terminals.
  - id: b
    text: It can be subdivided into smaller components.
  - id: c
    text: It does not obey Kirchhoff's laws.
  - id: d
    text: It always dissipates power.
  answer:
    choiceId: a
- id: q006
  type: multipleChoice
  prompt: If $10\text{ J}$ of energy is required to move $2\text{ C}$ of charge through
    an element, what is the voltage?
  explanation: $v = dw/dq = 10 / 2 = 5\text{ V}$
  choices:
  - id: a
    text: $5\text{ V}$
  - id: b
    text: $20\text{ V}$
  - id: c
    text: $10\text{ V}$
  - id: d
    text: $2\text{ V}$
  answer:
    choiceId: a
- id: q007
  type: multipleChoice
  prompt: What is the integral of power over time?
  explanation: $w = \int p dt$
  choices:
  - id: a
    text: Energy
  - id: b
    text: Current
  - id: c
    text: Voltage
  - id: d
    text: Charge
  answer:
    choiceId: a
- id: q008
  type: multipleChoice
  prompt: 'In SI units, $1\text{ W}$ is equal to:'
  explanation: Power is Joules per second.
  choices:
  - id: a
    text: $1\text{ J/s}$
  - id: b
    text: $1\text{ V/s}$
  - id: c
    text: $1\text{ A/s}$
  - id: d
    text: $1\text{ C/s}$
  answer:
    choiceId: a
- id: q009
  type: multipleChoice
  prompt: 'In an isolated circuit, the sum of all power absorbed by all elements must
    equal:'
  explanation: This is Tellegen's Theorem or power balancing.
  choices:
  - id: a
    text: Zero
  - id: b
    text: Infinity
  - id: c
    text: The power of the source
  - id: d
    text: The resistance
  answer:
    choiceId: a
- id: q010
  type: multipleChoice
  prompt: 'If current $i$ leaves the positive terminal of an element, and $p = vi$,
    the passive sign convention tells us this $p$ represents:'
  explanation: If current leaves positive, $p=vi$ is delivered power. If it enters
    positive, $p=vi$ is absorbed power.
  choices:
  - id: a
    text: Power delivered by the element
  - id: b
    text: Power absorbed by the element
  - id: c
    text: Energy stored
  - id: d
    text: Reactive power
  answer:
    choiceId: a
