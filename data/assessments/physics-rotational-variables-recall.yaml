glossary:
  introduction: Review the essential terms below. Once you understand them, test your
    knowledge using the recall drills.
  sections:
  - id: sec-physics-rotational-variables-recall
    title: Core Terminology
    entries:
    - id: entry-angular-position
      term: Angular Position ($\theta$)
      definition: The angle a body has rotated from a reference line, typically measured
        in radians. $\theta = \frac{s}{r}$.
      drills:
      - id: drill-angular-position
        prompt: What is the SI unit for angular position?
        type: typed
        answer:
          expected: radian
    - id: entry-angular-velocity
      term: Angular Velocity ($\omega$)
      definition: The rate of change of angular position with respect to time. $\omega
        = \frac{d\theta}{dt}$.
      drills:
      - id: drill-angular-velocity
        prompt: The rate of change of angular position is called angular ________.
        type: typed
        answer:
          expected: velocity
    - id: entry-angular-acceleration
      term: Angular Acceleration ($\alpha$)
      definition: The rate of change of angular velocity with respect to time. $\alpha
        = \frac{d\omega}{dt}$.
      drills:
      - id: drill-angular-acceleration
        prompt: What is the variable symbol typically used for angular acceleration?
        type: typed
        answer:
          expected: \alpha
