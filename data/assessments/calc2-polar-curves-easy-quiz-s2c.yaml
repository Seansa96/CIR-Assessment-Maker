questions:
  - { id: q001, type: multipleChoice, prompt: 'Convert $(2,\pi/2)$ to Cartesian coordinates.', choices: [{ id: a, text: '$(0,2)$' }, { id: b, text: '$(2,0)$' }, { id: c, text: '$(-2,0)$' }, { id: d, text: '$(0,-2)$' }], answer: { choiceId: a }, explanation: 'Solution: x equals 2 cosine pi/2 equals 0 and y equals 2 sine pi/2 equals 2. Why it works: Cosine gives x and sine gives y. Common trap: Swapping components. Why the other choices fail: They use a different axis direction.', difficultyDimensions: [representationTransfer, identityConstruction], difficultyEvidence: 'Resolves a polar ray into exact Cartesian components.' }
  - { id: q002, type: multipleChoice, prompt: 'Which is equivalent to $(2,0)$?', choices: [{ id: a, text: '$(-2,\pi)$' }, { id: b, text: '$(-2,0)$' }, { id: c, text: '$(2,\pi)$' }, { id: d, text: '$(0,2)$' }], answer: { choiceId: a }, explanation: 'Solution: Reverse radius and add pi to the angle. Why it works: Negative radius uses the opposite ray. Common trap: Negating only r. Why the other choices fail: They locate a different point or misuse coordinate order.', difficultyDimensions: [representationTransfer, identityConstruction], difficultyEvidence: 'Applies negative-radius equivalence.' }
  - { id: q003, type: multipleChoice, prompt: 'What Cartesian equation comes from $r=4\cos\theta$?', choices: [{ id: a, text: '$(x-2)^2+y^2=4$' }, { id: b, text: '$x^2+y^2=16$' }, { id: c, text: '$(x+2)^2+y^2=4$' }, { id: d, text: '$x^2+(y-2)^2=4$' }], answer: { choiceId: a }, explanation: 'Solution: $r^2=4r\cos\theta$ gives $x^2+y^2=4x$, then complete the square. Why it works: r cosine theta equals x. Common trap: Centering the circle at the pole. Why the other choices fail: They have wrong center or radius.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Converts polar identities and completes a square.' }
  - { id: q004, type: multipleChoice, prompt: 'How many petals does $r=\sin(3\theta)$ have?', choices: [{ id: a, text: 3 }, { id: b, text: 6 }, { id: c, text: 1 }, { id: d, text: 9 }], answer: { choiceId: a }, explanation: 'Solution: Odd n gives n petals, so three. Why it works: Negative r supplies opposite-ray portions during tracing. Common trap: Always doubling n. Why the other choices fail: They use the wrong parity rule.', difficultyDimensions: [identityConstruction, representationTransfer], difficultyEvidence: 'Applies parity-based rose recognition.' }
  - { id: q005, type: multipleChoice, prompt: 'What does $r=0$ represent?', choices: [{ id: a, text: the pole }, { id: b, text: the polar axis }, { id: c, text: a unit circle }, { id: d, text: an undefined point }], answer: { choiceId: a }, explanation: 'Solution: Zero radius has zero distance from the pole. Why it works: r measures directed distance. Common trap: Treating it as an invalid coordinate. Why the other choices fail: None has radius zero.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Interprets the radius value geometrically.' }
  - { id: q006, type: multipleChoice, prompt: 'Which curve has an inner loop?', choices: [{ id: a, text: '$r=1+2\cos\theta$' }, { id: b, text: '$r=2\cos\theta$' }, { id: c, text: '$r=2$' }, { id: d, text: '$r=\theta$' }], answer: { choiceId: a }, explanation: 'Solution: Here absolute b exceeds absolute a, so r becomes negative and creates an inner loop. Why it works: Negative-radius intervals reverse rays. Common trap: Calling it a cardioid. Why the other choices fail: Their forms are circle or spiral-like, not an inner-loop limacon.', difficultyDimensions: [domainCondition, representationTransfer], difficultyEvidence: 'Uses coefficient comparison to infer a radius sign change and graph type.' }
  - { id: q007, type: multipleChoice, prompt: 'What substitution tests polar-axis symmetry?', choices: [{ id: a, text: '$\theta\mapsto-\theta$' }, { id: b, text: '$r\mapsto0$' }, { id: c, text: '$\theta\mapsto0$' }, { id: d, text: '$r\mapsto\theta$' }], answer: { choiceId: a }, explanation: 'Solution: Replace theta by negative theta. Why it works: This reflects rays over the polar axis. Common trap: Negating r. Why the other choices fail: They do not enact the reflection test.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Maps a geometric reflection to an equation substitution.' }
  - { id: q008, type: multipleChoice, prompt: '![Polar loop](/media/calculus/polar-review-loop-sector.svg) What plotting rule creates the inner loop?', choices: [{ id: a, text: 'plot negative r on the opposite ray' }, { id: b, text: 'ignore negative r' }, { id: c, text: 'square r first' }, { id: d, text: 'hold theta fixed' }], answer: { choiceId: a }, explanation: 'Solution: Negative radius reverses the ray by pi. Why it works: Directed distance includes sign. Common trap: Drawing negative values on the same ray. Why the other choices fail: They erase or distort the trace.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Uses a diagram and signed-radius rule to select a trace method.' }
  - { id: q009, type: freeResponse, prompt: 'Convert $(-3,3)$ to polar coordinates with positive radius.', answer: { gradingMode: selfCheck, keyPoints: ['three square root two', 'three pi over four'] }, explanation: 'Solution: Radius is $\sqrt{18}=3\sqrt2$ and quadrant II gives angle $3\pi/4$. Why it works: Radius is distance from the pole and angle must match the quadrant. Common trap: Using reference angle pi/4 without a quadrant correction.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Computes distance and applies quadrant selection.' }
  - { id: q010, type: multipleChoice, prompt: 'For $r=2\sin\theta$, where is the circle center?', choices: [{ id: a, text: '$(0,1)$' }, { id: b, text: '$(1,0)$' }, { id: c, text: '$(0,2)$' }, { id: d, text: '$(2,0)$' }], answer: { choiceId: a }, explanation: 'Solution: $r^2=2r\sin\theta$ becomes $x^2+y^2=2y$, or $x^2+(y-1)^2=1$. Why it works: r sine theta equals y. Common trap: Using the cosine-circle center. Why the other choices fail: They mishandle completion of the square or sine/cosine orientation.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Converts a polar circle and reads its completed-square center.' }
