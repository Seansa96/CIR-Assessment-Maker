questions:
  - id: vol-mix-1
    type: multipleChoice
    skills:
    - volumes-mixed
    prompt: |
      Find the volume of the solid generated by revolving the region bounded by $y = \sqrt{x}$, $y = 2$, and $x = 0$ about the $y$-axis.
    choices:
      - id: a
        text: '$\frac{32\pi}{5}$'
      - id: b
        text: '$\frac{16\pi}{3}$'
      - id: c
        text: '$\frac{8\pi}{3}$'
      - id: d
        text: '$\frac{32\pi}{3}$'
    answer:
      choiceId: a
    explanation: |
      **Method 1: Disks (dy)**
      The region is bounded on the left by $x=0$ and on the right by $x = y^2$. The limits are $y=0$ to $y=2$.
      Revolving around the $y$-axis, the slices are\rhorizontal ($\perp$ to axis).
      $V = \pi \int_0^2 R(y)^2 \, dy = \pi \int_0^2 (y^2)^2 \, dy = \pi \int_0^2 y^4 \, dy$
      $V = \pi [\frac{1}{5}y^5]_0^2 = \frac{32\pi}{5}$.
      
      **Method 2: Shells (dx)**
      The region is bounded by top $y=2$, bottom $y=\sqrt{x}$, from $x=0$ to $x=4$.
      Revolving around $y$-axis, slices are vertical ($\parallel$ to axis).
      $V = 2\pi \int_0^4 r(x)h(x) \, dx = 2\pi \int_0^4 x(2 - \sqrt{x}) \, dx = 2\pi \int_0^4 (2x - x^{3/2}) \, dx$
      $V = 2\pi [x^2 - \frac{2}{5}x^{5/2}]_0^4 = 2\pi (16 - \frac{2}{5}(32)) = 2\pi (16 - \frac{64}{5}) = 2\pi (\frac{80-64}{5}) = \frac{32\pi}{5}$.
      
      Both methods yield $\frac{32\pi}{5}$.

  - id: vol-mix-2
    type: multipleChoice
    skills:
    - volumes-mixed
    prompt: |
      Set up the integral for the volume of the solid whose base is the region bounded by $x^2 + y^2 = 4$, and whose cross sections perpendicular to the $x$-axis are equilateral triangles.
    choices:
      - id: a
        text: '$\sqrt{3} \int_{-2}^2 (4 - x^2) \, dx$'
      - id: b
        text: '$\frac{\sqrt{3}}{4} \int_{-2}^2 (4 - x^2) \, dx$'
      - id: c
        text: '$\frac{\sqrt{3}}{4} \int_{-2}^2 \sqrt{4 - x^2} \, dx$'
      - id: d
        text: '$\sqrt{3} \int_{-2}^2 (4 - x^2)^2 \, dx$'
    answer:
      choiceId: a
    explanation: |
      The base is a circle of radius 2.
      Cross sections are perpendicular to the $x$-axis, so we integrate with respect to $x$ from $x = -2$ to $x = 2$.
      
      The length of the base of each triangle $s$ stretches from the bottom of the circle $y = -\sqrt{4-x^2}$ to the top $y = \sqrt{4-x^2}$.
      $s = \sqrt{4-x^2} - (-\sqrt{4-x^2}) = 2\sqrt{4-x^2}$.
      
      The area of an equilateral triangle with side $s$ is $A = \frac{\sqrt{3}}{4} s^2$.
      $A(x) = \frac{\sqrt{3}}{4} (2\sqrt{4-x^2})^2 = \frac{\sqrt{3}}{4} (4(4 - x^2)) = \sqrt{3}(4 - x^2)$.
      
      The volume is $V = \int_{-2}^2 A(x) \, dx = \sqrt{3} \int_{-2}^2 (4 - x^2) \, dx$.
      
      *Common Error Trap:* Choice B incorrectly forgets to square the $2$ when squaring the side length, leaving the $1/4$ uncancelled.

  - id: vol-mix-3
    type: multipleChoice
    skills:
    - volumes-mixed
    prompt: |
      The region bounded by $y = \sec(x)$, $y=0$, $x=0$, and $x=\pi/4$ is revolved about the $x$-axis. Find the volume.
    choices:
      - id: a
        text: '$\pi$'
      - id: b
        text: '$\frac{\pi}{4}$'
      - id: c
        text: '$\pi \sqrt{2}$'
      - id: d
        text: '$2\pi$'
    answer:
      choiceId: a
    explanation: |
      Revolving around the $x$-axis using vertical slices $\implies$ Disks.
      
      $V = \pi \int_0^{\pi/4} R(x)^2 \, dx$
      $V = \pi \int_0^{\pi/4} \sec^2(x) \, dx$
      
      The antiderivative of $\sec^2(x)$ is $\tan(x)$.
      $V = \pi [\tan(x)]_0^{\pi/4} = \pi (\tan(\pi/4) - \tan(0)) = \pi (1 - 0) = \pi$.

  - id: vol-mix-4
    type: selectAll
    skills:
    - volumes-mixed
    prompt: |
      Which of the following integrals correctly set up the volume of the solid generated by revolving the region bounded by $y=e^x$, $x=0$, $y=3$ about the line $x=-2$? (Select all that apply)
    choices:
      - id: a
        text: '$2\pi \int_0^{\ln(3)} (x+2)(3-e^x) \, dx$'
      - id: b
        text: '$\pi \int_1^3 [(\ln(y) + 2)^2 - 2^2] \, dy$'
      - id: c
        text: '$2\pi \int_0^{\ln(3)} (x-2)(e^x-3) \, dx$'
    answer:
      choiceIds:
        - a
        - b
    explanation: |
      Let's analyze the region: bounded by $y=e^x$ (bottom), $y=3$ (top), $x=0$ (left boundary, $y=1$). Intersection of $y=e^x$ and $y=3$ is $x=\ln(3)$.
      
      **Method 1: Shells (dx)**
      Vertical slices, revolving around $x=-2$ (vertical).
      Radius $r(x) = x - (-2) = x + 2$.
      Height $h(x) = \text{Top} - \text{Bottom} = 3 - e^x$.
      Bounds: $x=0$ to $x=\ln(3)$.
      $V = 2\pi \int_0^{\ln(3)} (x+2)(3-e^x) \, dx$.
      
      **Method 2: Washers (dy)**
      Horizontal slices, revolving around $x=-2$ (vertical).
      Rewrite equations: $x = \ln(y)$. Left boundary is $x=0$.
      Outer radius $R(y)$: Distance from $x=-2$ to furthest curve $x=\ln(y)$. $R(y) = \ln(y) - (-2) = \ln(y) + 2$.
      Inner radius $r(y)$: Distance from $x=-2$ to closest curve $x=0$. $r(y) = 0 - (-2) = 2$.
      Bounds: $y=1$ (since $e^0=1$) to $y=3$.
      $V = \pi \int_1^3 [(\ln(y) + 2)^2 - 2^2] \, dy$.
      
      Therefore, both setups are correct.

  - id: vol-mix-5
    type: multipleChoice
    skills:
    - volumes-mixed
    prompt: |
      Find the volume of the solid whose base is the unit circle $x^2 + y^2 = 1$ and whose cross sections perpendicular to the $y$-axis are squares.
    choices:
      - id: a
        text: '$\frac{8}{3}$'
      - id: b
        text: '$\frac{16}{3}$'
      - id: c
        text: '$\frac{4\pi}{3}$'
      - id: d
        text: '$2$'
    answer:
      choiceId: b
    explanation: |
      The base is $x^2 + y^2 = 1$.
      Cross sections are perpendicular to the $y$-axis, so we integrate with respect to $y$ from $-1$ to $1$.
      
      The side of the square $s$ stretches from the left boundary $x = -\sqrt{1-y^2}$ to the right boundary $x = \sqrt{1-y^2}$.
      $s = \sqrt{1-y^2} - (-\sqrt{1-y^2}) = 2\sqrt{1-y^2}$.
      
      The area of a square is $A = s^2$.
      $A(y) = (2\sqrt{1-y^2})^2 = 4(1 - y^2)$.
      
      The volume is:
      $V = \int_{-1}^1 A(y) \, dy = 4 \int_{-1}^1 (1 - y^2) \, dy$.
      Using symmetry (even function):
      $V = 8 \int_0^1 (1 - y^2) \, dy = 8 [y - \frac{1}{3}y^3]_0^1 = 8(1 - \frac{1}{3}) = 8(\frac{2}{3}) = \frac{16}{3}$.
