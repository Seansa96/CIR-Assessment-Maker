  - id: exponent-rule-misapplied
    domains: []
  choices: []
- id: r002
  type: typed
  prompt: Factor $x^2-9$.
  answer:
    expected: (x-3)(x+3)
    expectedLatex: 
    aliases:
    - (x+3)(x-3)
    media: []
    choiceId: 
  explanation: >
    Solution: Use the difference of squares: $x^2-9=(x-3)(x+3)$.

    Why it works: $a^2-b^2=(a-b)(a+b)$ because expanding the factors cancels the cross terms and leaves $a^2-b^2$. Here $a=x$ and $b=3$, so the factors reconstruct the original expression.
  tags: []
  skills: []
  issueSignals:
  - id: algebraic-simplification-error
    domains: []
  choices: []
- id: r003
  type: typed
  prompt: Write $60^\circ$ in radians.
  answer:
    expected: pi/3
    expectedLatex: 
    aliases:
    - $\pi/3$
    - Ï€/3
    media: []
    choiceId: 
  explanation: >
    Solution: $60^\circ\cdot\frac{\pi}{180^\circ}=\frac{\pi}{3}$.

    Why it works: Radian conversion scales degrees by $\pi/180$. Review path: Trigonometry â†’ Unit Circle Trigonometry.
