- id: r009
  type: typed
  prompt: Differentiate $x^3$.
  answer:
    expected: 3x^2
    expectedLatex: 
    aliases:
    - $3x^2$
    media: []
    choiceId: 
  explanation: >
    Solution: $\frac{d}{dx}x^3=3x^2$.

    Why it works: The power rule multiplies by the exponent and lowers it by one: $d(x^n)/dx=nx^{n-1}$. With $n=3$, this gives $3x^2$, which is the component-rule pattern used again in Calc 3.
  tags: []
  skills: []
  issueSignals:
  - id: power-rule-error
    domains: []
  choices: []
- id: r010
  type: typed
  prompt: Differentiate $\sin(2x)$.
  answer:
    expected: 2cos(2x)
    expectedLatex: 
