- id: r001
  type: typed
  prompt: Simplify $x^3x^2$.
  answer:
    expected: x^5
    expectedLatex: 
    aliases:
    - x5
    media: []
    choiceId: 
  explanation: >
    Solution: Add the exponents to get $x^{3+2}=x^5$.

    Why it works: Powers with the same nonzero base multiply by adding exponents. Review path: Calculus 1 â†’ Inequalities and the Real Numbers.
  tags: []
  skills: []
