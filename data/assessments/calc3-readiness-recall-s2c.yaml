items:
  - id: r001
    type: typed
    prompt: Simplify $x^3x^2$.
    answer: { expected: 'x^5', aliases: ['x5'] }
    issueSignals: [{ id: exponent-rule-misapplied }]
    explanation: |
      Solution: Add the exponents to get $x^{3+2}=x^5$.
      Why it works: Powers with the same nonzero base multiply by adding exponents. Review path: Calculus 1 â†’ Inequalities and the Real Numbers.
  - id: r002
    type: typed
    prompt: Factor $x^2-9$.
    answer: { expected: '(x-3)(x+3)', aliases: ['(x+3)(x-3)'] }
    issueSignals: [{ id: algebraic-simplification-error }]
    explanation: |
      Solution: Use the difference of squares: $x^2-9=(x-3)(x+3)$.
      Why it works: $a^2-b^2=(a-b)(a+b)$. Review path: Calculus 1 â†’ Sets, Sequences, and Functions.
  - id: r003
    type: typed
    prompt: Write $60^\circ$ in radians.
    answer: { expected: 'pi/3', aliases: ['$\pi/3$', 'Ï€/3'] }
    issueSignals: [{ id: unit-circle-evaluation-error }]
    explanation: |
      Solution: $60^\circ\cdot\frac{\pi}{180^\circ}=\frac{\pi}{3}$.
      Why it works: Radian conversion scales degrees by $\pi/180$. Review path: Trigonometry â†’ Unit Circle Trigonometry.
  - id: r004
    type: typed
    prompt: Give the exact value of $\cos(\pi/3)$.
    answer: { expected: '1/2', aliases: ['$1/2$', '0.5'] }
    issueSignals: [{ id: unit-circle-evaluation-error }]
    explanation: |
      Solution: $\cos(\pi/3)=\frac12$.
      Why it works: Cosine is the horizontal coordinate on the unit circle. Review path: Trigonometry â†’ Unit Circle Trigonometry.
  - id: r005
    type: typed
    prompt: Convert polar point $(2,\pi/2)$ to rectangular coordinates.
    answer: { expected: '(0,2)', aliases: ['(0, 2)'] }
    issueSignals: [{ id: polar-rectangular-conversion-error }]
    explanation: |
      Solution: $x=2\cos(\pi/2)=0$ and $y=2\sin(\pi/2)=2$.
      Why it works: Polar coordinates resolve into horizontal and vertical components. Review path: Trigonometry â†’ Polar Coordinates.
  - id: r006
    type: typed
    prompt: In polar coordinates, what does $r$ represent?
    answer: { expected: 'distance from the origin', aliases: ['radius', 'radial distance'] }
    issueSignals: [{ id: polar-rectangular-conversion-error }]
    explanation: |
      Solution: $r$ is the signed radial distance from the origin.
      Why it works: The angle selects a direction while $r$ scales distance along that direction. Review path: Trigonometry â†’ Polar Coordinates.
  - id: r007
    type: typed
    prompt: If $x=t^2$ and $y=t+1$, find $(x,y)$ when $t=2$.
    answer: { expected: '(4,3)', aliases: ['(4, 3)'] }
    issueSignals: [{ id: mathematical-translation-error }]
    explanation: |
      Solution: Substitute $t=2$ into both coordinates to get $(4,3)$.
      Why it works: A parameter value determines every coordinate simultaneously. Review path: Calculus 2 â†’ Parametric Curves.
  - id: r008
    type: typed
    prompt: What determines the direction of travel on a parametric curve?
    answer: { expected: 'increasing t', aliases: ['the direction of increasing t', 'increasing parameter'] }
    issueSignals: [{ id: mathematical-translation-error }]
    explanation: |
      Solution: Travel follows the curve as $t$ increases.
      Why it works: The parameter supplies order as well as location. Review path: Calculus 2 â†’ Parametric Curves.
  - id: r009
    type: typed
    prompt: Differentiate $x^3$.
    answer: { expected: '3x^2', aliases: ['$3x^2$'] }
    issueSignals: [{ id: power-rule-error }]
    explanation: |
      Solution: $\frac{d}{dx}x^3=3x^2$.
      Why it works: The power rule multiplies by the exponent and lowers it by one. Review path: Calculus 1 â†’ The Derivative.
  - id: r010
    type: typed
    prompt: Differentiate $\sin(2x)$.
    answer: { expected: '2cos(2x)', aliases: ['$2\cos(2x)$'] }
    issueSignals: [{ id: chain-rule-missed }]
    explanation: |
      Solution: $\frac{d}{dx}\sin(2x)=2\cos(2x)$.
      Why it works: The chain rule includes the derivative of the inner expression $2x$. Review path: Calculus 1 â†’ Classical Theorems of Differential Calculus.
  - id: r011
    type: typed
    prompt: Evaluate $\int_0^3 x^2\,dx$.
    answer: { expected: '9', aliases: ['$9$'] }
    issueSignals: [{ id: power-rule-error }]
    explanation: |
      Solution: $[x^3/3]_0^3=9$.
      Why it works: A definite integral is evaluated by upper endpoint minus lower endpoint after finding an antiderivative. Review path: Calculus 1 â†’ Riemann Integration.
  - id: r012
    type: typed
    prompt: Find $\frac{d}{dx}\int_0^x t^2\,dt$.
    answer: { expected: 'x^2', aliases: ['$x^2$'] }
    issueSignals: [{ id: expression-equation-recognition-error }]
    explanation: |
      Solution: The derivative is $x^2$.
      Why it works: The Fundamental Theorem of Calculus differentiates an accumulation integral with upper limit $x$. Review path: Calculus 1 â†’ Riemann Integration.
