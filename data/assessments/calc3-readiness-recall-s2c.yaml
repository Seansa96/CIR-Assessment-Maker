- id: r004
  type: typed
  prompt: Give the exact value of $\cos(\pi/3)$.
  answer:
    expected: 1/2
    expectedLatex: 
    aliases:
    - $1/2$
    - 0.5
    media: []
    choiceId: 
  explanation: >
    Solution: $\cos(\pi/3)=\frac12$.

    Why it works: Cosine is the horizontal coordinate on the unit circle. At angle $\pi/3$, the reference triangle has adjacent-to-hypotenuse ratio $1/2$, and the first-quadrant sign is positive.
  tags: []
  skills: []
