  explanation: >
    Solution: $x=2\cos(\pi/2)=0$ and $y=2\sin(\pi/2)=2$.

    Why it works: Polar coordinates resolve into horizontal and vertical components. Review path: Trigonometry â†’ Polar Coordinates.
