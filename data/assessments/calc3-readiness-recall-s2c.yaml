    media: []
    choiceId: 
  explanation: >
    Solution: $\frac{d}{dx}\sin(2x)=2\cos(2x)$.

    Why it works: The chain rule includes the derivative of the inner expression $2x$. Review path: Calculus 1 â†’ Classical Theorems of Differential Calculus.
