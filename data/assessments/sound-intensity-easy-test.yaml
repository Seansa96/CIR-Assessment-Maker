questions:
- id: q001
  type: numericResponse
  skills:
  - physics-sound-intensity
  prompt: Use the Sound Intensity diagram and the model $I=P/(4\pi r^2)$. A calibrated scenario scales
    the reference values by 1.1. Determine the intensity. Give a numerical answer.
  answer:
    value: 1.1
    tolerance: 0.011000000000000001
  explanation: Apply $I=P/(4\pi r^2)$ consistently to the scaled scenario; the requested intensity is
    1.1.
  media:
  - type: image
    src: /media/physics/owa/sound-intensity.svg
    alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
    caption: Sound Intensity model diagram.
