questions:
- id: q001
  type: freeResponse
  skills:
  - geometric-intuition
  - olympiad-problem-solving
  prompt: A region has horizontal cross-sections that are squares. At height $y$ for $0\le y\le 3$, the side length is $y$. Find its volume.
  answer:
    gradingMode: selfCheck
    expected: $\frac{27}{3}$.
    keyPoints:
    - 'Matches the reference result: $\frac{27}{3}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: A slice has area $A(y)=y^2$, so the volume is $\int_0^3y^2\,dy=27/3$. The cross-section formula, not a planar area formula, controls the calculation.
