questions:
- id: q001
  type: numericResponse
  prompt: A population obeys $P'=kP$ and doubles every $8$ years. Find $k$ in inverse years.
  skills:
  - ede-ch04-first-order-applications-growth-decay
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-growth-decay
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 0.0866434
    tolerance: 0.0001
  explanation: |-
    Solution: $2=e^{8k}$, so $k=\ln2/8\approx0.0866434$ yr$^{-1}$.

    Why it works: The doubling condition determines the proportional-rate constant independently of the initial population.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch05-linear-second-order-equations-curriculum
- id: q002
  type: numericResponse
  prompt: A radioactive tracer has half-life $6$ hours and begins with $80$ mg. How many milligrams remain after
    $15$ hours?
  skills:
  - ede-ch04-first-order-applications-growth-decay
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-growth-decay
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 14.1421
    tolerance: 0.001
  explanation: |-
    Solution: $Q=80(1/2)^{15/6}=80(1/2)^{2.5}\approx14.1421$ mg.

    Why it works: The elapsed time is measured in half-life units.
- id: q003
  type: symbolicResponse
  prompt: Solve $Q'=18-0.3Q$, $Q(0)=10$.
  skills:
  - ede-ch04-first-order-applications-growth-decay
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-growth-decay
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: 60-50e^{-0.3t}
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.0001
  explanation: |-
    Solution: The equilibrium is $60$ and $Q=60+Ce^{-0.3t}$; $Q(0)=10$ gives $C=-50$.

    Why it works: The transient decays while the solution approaches the input-removal balance.
- id: q004
  type: symbolicResponse
  prompt: 'At a reset time $t=0$, a sensor is $50^\circ$C and is moved into a $10^\circ$C room. If $T''=-0.2(T-10)$,
    find $T(t)$.'
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-cooling-mixing
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: 10+40e^{-0.2t}
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.0001
  explanation: |-
    Solution: The initial excess is $40$, giving $T=10+40e^{-0.2t}$.

    Why it works: The new ambient temperature defines the shifted equilibrium for the reset IVP.
- id: q005
  type: multipleChoice
  prompt: A tank starts with 100 L. Brine enters at 5 L/min with concentration 2 g/L, and mixture leaves at 3 L/min.
    Which salt equation is correct?
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-cooling-mixing
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $Q'=10-3Q/(100+2t)$
  - id: b
    text: $Q'=10-3Q/100$
    issueSignals:
    - id: ede-mixing-volume-error
      domains: &id001
      - elementary-differential-equations-bvp
  - id: c
    text: $Q'=2-3Q/(100+2t)$
    issueSignals:
    - id: ede-mixing-concentration-error
      domains: *id001
  - id: d
    text: $Q'=10+3Q/(100+2t)$
    issueSignals:
    - id: ede-mixing-balance-sign-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $V(t)=100+2t$ and $Q'=5(2)-3Q/V(t)$.

    Why it works: Unequal flows change the volume, and output is flow times the current well-mixed concentration.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch05-linear-second-order-equations-curriculum
- id: q006
  type: numericResponse
  prompt: A 100-L tank contains 20 g of salt. Pure water enters and mixture leaves at 4 L/min. How many grams remain
    after 10 min?
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-cooling-mixing
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 13.4064
    tolerance: 0.001
  explanation: |-
    Solution: $Q'=-(4/100)Q$, so $Q=20e^{-0.04t}$ and $Q(10)=20e^{-0.4}\approx13.4064$ g.

    Why it works: The constant-volume outflow removes four percent of the current salt per minute.
- id: q007
  type: multipleChoice
  prompt: Take downward as positive for a falling $2$-kg object with linear resistance $0.5v$ and $g=9.8$. Which
    equation is correct?
  skills:
  - ede-ch04-first-order-applications-mechanics
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-mechanics
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $2v'=19.6-0.5v$
  - id: b
    text: $2v'=19.6+0.5v$
    issueSignals:
    - id: ede-resistance-direction-error
      domains: *id001
  - id: c
    text: $v'=2(9.8)-0.5v$
    issueSignals:
    - id: ede-mechanics-mass-error
      domains: *id001
  - id: d
    text: $2v'=-19.6-0.5v$
    issueSignals:
    - id: ede-growth-decay-sign-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $2v'=mg-bv=19.6-0.5v$.

    Why it works: Resistance opposes positive downward velocity, while gravity acts in the chosen positive direction.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q008
  type: numericResponse
  prompt: For the falling object governed by $2v'=19.6-0.5v$, find the terminal speed in m/s.
  skills:
  - ede-ch04-first-order-applications-mechanics
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-mechanics
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 39.2
    tolerance: 0.0001
  explanation: |-
    Solution: Set $v'=0$: $19.6-0.5v_T=0$, so $v_T=39.2$ m/s.

    Why it works: Terminal velocity is the equilibrium of the velocity equation.
- id: q009
  type: multipleChoice
  prompt: For $y'=y(y-1)(2-y)$, how is the equilibrium $y=1$ classified?
  skills:
  - ede-ch04-first-order-applications-autonomous-phase
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-autonomous-phase
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: Unstable, because nearby arrows point away on both sides.
  - id: b
    text: Stable, because every zero of $f$ is stable.
    issueSignals:
    - id: ede-autonomous-stability-error
      domains: *id001
  - id: c
    text: Semistable, because the factors are linear.
    issueSignals:
    - id: ede-autonomous-stability-error
      domains: *id001
  - id: d
    text: Not an equilibrium.
    issueSignals:
    - id: ede-equilibrium-limiting-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $y=1$ is unstable.

    Why it works: The rate is negative just below $1$ and positive just above it, so both sides move away.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q010
  type: symbolicResponse
  prompt: The family $y=cx^3$ has slope $3y/x$. Orthogonal trajectories satisfy $y'=-x/(3y)$. Enter the left side
    of their implicit family in the form $F(x,y)=C$.
  skills:
  - ede-ch04-first-order-applications-curves
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-curves
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: x^2+3y^2
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.0001
  explanation: |-
    Solution: $3y\,dy=-x\,dx$ gives $3y^2/2=-x^2/2+C$, hence $x^2+3y^2=C$.

    Why it works: The negative reciprocal slope is separated and integrated to obtain the perpendicular family.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch05-linear-second-order-equations-curriculum
- id: q011
  type: multipleChoice
  prompt: A tank model predicts a negative amount after a long simulation. What should be checked before accepting
    it?
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-cooling-mixing
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: Check the balance signs, volume domain, assumptions, and whether the solution was used beyond its valid
      interval.
  - id: b
    text: Accept it because differential equations may produce any sign.
    issueSignals:
    - id: ede-model-assumption-error
      domains: *id001
  - id: c
    text: Delete the initial condition.
    issueSignals:
    - id: ede-condition-ignored
      domains: *id001
  - id: d
    text: Reverse every rate term automatically.
    issueSignals:
    - id: ede-mixing-balance-sign-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Audit the model, domain, and physical assumptions before accepting a negative amount.

    Why it works: A mass amount should remain nonnegative; a negative prediction signals a setup, domain, or applicability problem.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch05-linear-second-order-equations-curriculum
- id: q012
  type: multipleChoice
  prompt: A proposed orthogonal trajectory has the same nonzero slope as the given family at an intersection. What
    conclusion is justified?
  skills:
  - ede-ch04-first-order-applications-curves
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-curves
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: It is not orthogonal there because the slopes should be negative reciprocals.
  - id: b
    text: It is orthogonal because the slopes agree.
    issueSignals:
    - id: ede-orthogonal-slope-error
      domains: *id001
  - id: c
    text: Every intersection is automatically perpendicular.
    issueSignals:
    - id: ede-orthogonal-slope-error
      domains: *id001
  - id: d
    text: Slope information cannot test orthogonality.
    issueSignals:
    - id: ede-method-selection-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The proposed curve is not orthogonal at that intersection.

    Why it works: Equal nonzero slopes indicate tangency, whereas perpendicular slopes have product $-1$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch05-linear-second-order-equations-curriculum
