questions:
  - id: vols-method-1-y-axis-shell
    type: multipleChoice
    skills:
    - volumes-method-selection
    prompt: |
      You need to find the volume of the solid generated by revolving the region bounded by $y = \sin(x^2)$, the $x$-axis, $x = 0$, and $x = \sqrt{\pi}$ around the $y$-axis. Which method MUST be used, and what is the correct integral?
    choices:
      - id: a
        text: 'Disks: $\pi \int_0^{\sqrt{\pi}} \sin^2(x^2) \, dx$'
      - id: b
        text: 'Shells: $2\pi \int_0^{\sqrt{\pi}} x \sin(x^2) \, dx$'
      - id: c
        text: 'Washers: $\pi \int_0^1 (\pi - rcsin(y)) \, dy$'
      - id: d
        text: 'Shells: $2\pi \int_0^{\sqrt{\pi}} x^2 \sin(x) \, dx$'
    answer:
      choiceId: b
    explanation: |
      Let's analyze the region. It's given in terms of $x$, and the bounds are $x=0$ to $x=\sqrt{\pi}$.
      
      We are revolving around the $y$-axis (a vertical line).
      - If we use **Disks/Washers**, our slices are\rhorizontal ($\perp$ to the $y$-axis), so we must integrate with respect to $y$. This means we'd have to solve $y = \sin(x^2)$ for $x$. $x = \pm\sqrt{rcsin(y)}$, which creates an extremely difficult or impossible integral to solve analytically.
      - If we use **Cylindrical Shells**, our slices are vertical ($\parallel$ to the $y$-axis), so we integrate with respect to $x$. This avoids solving for $x$.
      
      The Shell formula is $V = \int 2\pi r(x) h(x) \, dx$.
      Here, the radius is the distance from the slice at $x$ to the $y$-axis ($x=0$), so $r(x) = x$.
      The height is the top function minus the bottom function: $h(x) = \sin(x^2) - 0 = \sin(x^2)$.
      
      $$V = \int_0^{\sqrt{\pi}} 2\pi x \sin(x^2) \, dx$$
      
      Notice that this integral can be easily solved using $u$-substitution with $u = x^2, du = 2x \, dx$.

  - id: vols-method-2-shifted-axis-washer
    type: multipleChoice
    skills:
    - volumes-method-selection
    prompt: |
      Set up the integral for the volume of the solid obtained by rotating the region bounded by $y = x^2$ and $y = 2x$ about the line $y = 5$.
    choices:
      - id: a
        text: '$\pi \int_0^2 [(5 - x^2)^2 - (5 - 2x)^2] \, dx$'
      - id: b
        text: '$\pi \int_0^2 [(2x)^2 - (x^2)^2] \, dx$'
      - id: c
        text: '$\pi \int_0^2 [(5 - 2x)^2 - (5 - x^2)^2] \, dx$'
      - id: d
        text: '$2\pi \int_0^2 (5 - x)(2x - x^2) \, dx$'
    answer:
      choiceId: a
    explanation: |
      First, find the intersection points: $x^2 = 2x \implies x(x - 2) = 0 \implies x = 0, 2$.
      On $[0, 2]$, $2x \ge x^2$ (so $y=2x$ is the "top" curve and $y=x^2$ is the "bottom").
      
      We are revolving about the\rhorizontal line $y=5$. Since the axis is\rhorizontal and our functions are $y=f(x)$, we slice vertically ($\perp$ to axis). This means we use the **Washer Method** ($dx$).
      
      The formula is $V = \pi \int [R(x)^2 - r(x)^2] \, dx$.
      The axis of revolution is $y=5$. Both curves are below this axis.
      The **outer radius** $R(x)$ is the distance from the axis down to the *furthest* curve (the bottom curve $y=x^2$).
      $R(x) = 5 - x^2$.
      
      The **inner radius** $r(x)$ is the distance from the axis down to the *closest* curve (the top curve $y=2x$).
      $r(x) = 5 - 2x$.
      
      Therefore, the setup is:
      $$V = \pi \int_0^2 [(5 - x^2)^2 - (5 - 2x)^2] \, dx$$
      
      *Common Error Trap:* Choice C reverses the radii, which would result in a negative volume. Choice D attempts to use the Shell method but incorrectly uses $5-x$ for the radius (which would be for revolution around $x=5$).

  - id: vols-method-3-shifted-axis-shell
    type: multipleChoice
    skills:
    - volumes-method-selection
    prompt: |
      Set up the integral for the volume of the solid obtained by rotating the region bounded by $y = x^2$ and $y = 2x$ about the line $x = -1$.
    choices:
      - id: a
        text: '$2\pi \int_0^2 (x - 1)(2x - x^2) \, dx$'
      - id: b
        text: '$2\pi \int_0^2 (x + 1)(2x - x^2) \, dx$'
      - id: c
        text: '$2\pi \int_0^2 (x + 1)(x^2 - 2x) \, dx$'
      - id: d
        text: '$\pi \int_0^2 [(x + 1)(2x) - (x + 1)(x^2)] \, dx$'
    answer:
      choiceId: b
    explanation: |
      First, intersection points are $x=0$ and $x=2$. On $[0,2]$, $y=2x$ is above $y=x^2$.
      
      We are revolving about the vertical line $x = -1$. Because our functions are $y=f(x)$, vertical slices are parallel to the axis of revolution. This dictates the **Cylindrical Shells** method ($dx$).
      
      Formula: $V = \int 2\pi r(x) h(x) \, dx$.
      
      **Radius $r(x)$:** The distance from a slice at $x$ to the axis $x = -1$. Since $x \ge 0$, the slice is to the right of the axis.
      $r(x) = x - (-1) = x + 1$.
      
      **Height $h(x)$:** Top curve minus bottom curve.
      $h(x) = 2x - x^2$.
      
      Putting it together:
      $$V = 2\pi \int_0^2 (x + 1)(2x - x^2) \, dx$$
      
      *Common Error Trap:* Choice A uses $x-1$ which would be for an axis at $x=1$ if the region were $x>1$. Choice C reverses the height, yielding a negative volume. Choice D inappropriately mixes the disk/washer constant $\pi$ with the shell components.

  - id: vols-method-4-which-is-better
    type: multipleChoice
    skills:
    - volumes-method-selection
    prompt: |
      The region bounded by $x = y^3 - 4y^2 + 3y$ and the $y$-axis is revolved about the $x$-axis. Which method avoids the need to solve a cubic equation for $y$?
    choices:
      - id: a
        text: 'Cylindrical Shells'
      - id: b
        text: 'Disks/Washers'
      - id: c
        text: 'Both require solving the cubic.'
      - id: d
        text: 'Neither, integration by parts is required.'
    answer:
      choiceId: a
    explanation: |
      The boundary function is given as $x = f(y)$. 
      The axis of revolution is the $x$-axis (a\rhorizontal line).
      
      - **Disks/Washers** slice $\perp$ to the axis. For a\rhorizontal axis, this requires vertical slices, so we must integrate with respect to $x$. This would force us to solve $x = y^3 - 4y^2 + 3y$ for $y$ in terms of $x$, which is incredibly difficult for a cubic.
      - **Cylindrical Shells** slice $\parallel$ to the axis. For a\rhorizontal axis, this requires\rhorizontal slices, meaning we integrate with respect to $y$. This allows us to use the function exactly as given: $h(y) = y^3 - 4y^2 + 3y$.
      
      Thus, Cylindrical Shells is the superior method here.
