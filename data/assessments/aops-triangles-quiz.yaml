schemaVersion: 1
id: aops-triangles-quiz
title: Triangles Easy Quiz
description: Check foundational triangle existence, classification, congruence, similarity, centers, trigonometry, and area.
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-triangles
skills:
- Apply triangle inequality and angle sums
- Compute and classify with the Pythagorean theorem and converse
- Recognize congruence and similarity relationships
- Identify triangle centers and select area formulas
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags: [art-of-problem-solving, aops-triangles, geometry, easy, triangle-inequality, congruence, similarity, triangle-centers, triangle-area]
questions:
- id: q001
  type: multipleChoice
  prompt: Sides 5, 8, and integer $x$ form a nondegenerate triangle. How many values of $x$ are possible?
  media:
  - type: image
    src: /assessments/aops/aops-triangles-inequality.svg
    alt: Triangle with side lengths 5, 8, and x and a strict inequality reminder.
  choices: [{id: a, text: '8'}, {id: b, text: '9'}, {id: c, text: '10'}, {id: d, text: '11'}]
  answer: {choiceId: b}
  explanation: $3<x<13$, so $x$ can be any integer from 4 through 12, giving 9 values.
- id: q002
  type: multipleChoice
  prompt: A triangle has angles $46^\circ$, $59^\circ$, and $x^\circ$. Find $x$.
  choices: [{id: a, text: '$65^\circ$'}, {id: b, text: '$75^\circ$'}, {id: c, text: '$85^\circ$'}, {id: d, text: '$105^\circ$'}]
  answer: {choiceId: b}
  explanation: $x=180-46-59=75$ degrees.
- id: q003
  type: multipleChoice
  prompt: A triangle exterior angle has remote interior angles $38^\circ$ and $74^\circ$. Find the exterior angle.
  choices: [{id: a, text: '$36^\circ$'}, {id: b, text: '$68^\circ$'}, {id: c, text: '$112^\circ$'}, {id: d, text: '$142^\circ$'}]
  answer: {choiceId: c}
  explanation: The exterior angle equals the remote interior sum, $38+74=112$ degrees.
- id: q004
  type: multipleChoice
  prompt: A right triangle has legs 8 and 15. What is its hypotenuse?
  choices: [{id: a, text: '$17$'}, {id: b, text: '$19$'}, {id: c, text: '$21$'}, {id: d, text: '$23$'}]
  answer: {choiceId: a}
  explanation: $8^2+15^2=64+225=289=17^2$.
- id: q005
  type: multipleChoice
  prompt: Classify a triangle with sides 7, 8, and 12 by its angles.
  choices: [{id: a, text: Acute}, {id: b, text: Right}, {id: c, text: Obtuse}, {id: d, text: Degenerate}]
  answer: {choiceId: c}
  explanation: The triangle exists, and $12^2=144>7^2+8^2=113$, so it is obtuse.
- id: q006
  type: multipleChoice
  prompt: Which congruence criterion is encoded by the three side-mark pairs?
  media:
  - type: image
    src: /assessments/aops/aops-triangles-congruence.svg
    alt: Two triangles with one-, two-, and three-tick corresponding side pairs.
  choices: [{id: a, text: SSS}, {id: b, text: SAS}, {id: c, text: ASA}, {id: d, text: AA}]
  answer: {choiceId: a}
  explanation: All three corresponding side pairs are marked equal, which is SSS congruence.
- id: q007
  type: multipleChoice
  prompt: 'Given $\triangle ABC\sim\triangle DEF$, which side corresponds to $BC$?'
  choices: [{id: a, text: '$DE$'}, {id: b, text: '$DF$'}, {id: c, text: '$EF$'}, {id: d, text: '$AB$'}]
  answer: {choiceId: c}
  explanation: The order gives $B\leftrightarrow E$ and $C\leftrightarrow F$.
- id: q008
  type: multipleChoice
  prompt: The small-to-large similarity ratio is $3:5$. A small corresponding side is 12. Find the large side.
  choices: [{id: a, text: '$15$'}, {id: b, text: '$18$'}, {id: c, text: '$20$'}, {id: d, text: '$24$'}]
  answer: {choiceId: c}
  explanation: $12/L=3/5$, so $L=20$.
- id: q009
  type: multipleChoice
  prompt: Similar triangles have small-to-large length ratio $2:3$. What is their area ratio?
  choices: [{id: a, text: '$2:3$'}, {id: b, text: '$4:6$'}, {id: c, text: '$4:9$'}, {id: d, text: '$8:27$'}]
  answer: {choiceId: c}
  explanation: Area uses the square of the length ratio, so $2^2:3^2=4:9$.
- id: q010
  type: multipleChoice
  prompt: 'In the diagram, $DE\parallel BC$, $AD=4$, $AB=10$, and $DE=6$. Find $BC$.'
  media:
  - type: image
    src: /assessments/aops/aops-triangles-similarity.svg
    alt: Triangle ABC with parallel segment DE creating smaller similar triangle ADE.
  choices: [{id: a, text: '$12$'}, {id: b, text: '$15$'}, {id: c, text: '$18$'}, {id: d, text: '$24$'}]
  answer: {choiceId: b}
  explanation: AA similarity gives $4/10=6/BC$, so $BC=15$.
- id: q011
  type: multipleChoice
  prompt: Which center is equidistant from all three side lines of a triangle?
  choices: [{id: a, text: Incenter}, {id: b, text: Circumcenter}, {id: c, text: Centroid}, {id: d, text: Orthocenter}]
  answer: {choiceId: a}
  explanation: The incenter is the intersection of internal angle bisectors and centers the incircle.
- id: q012
  type: multipleChoice
  prompt: Find the area of a triangle with base 14 and perpendicular height 9.
  choices: [{id: a, text: '$23$'}, {id: b, text: '$63$'}, {id: c, text: '$126$'}, {id: d, text: '$252$'}]
  answer: {choiceId: b}
  explanation: $K=\tfrac12(14)(9)=63$ square units.
- id: q013
  type: selectAll
  prompt: Which are valid triangle congruence criteria under their standard hypotheses?
  choices:
  - {id: a, text: SSS}
  - {id: b, text: SAS with the included angle}
  - {id: c, text: AAA}
  - {id: d, text: HL for right triangles}
  answer: {choiceIds: [a, b, d]}
  explanation: AAA proves only similarity; SSS, included-angle SAS, and right-triangle HL prove congruence.
- id: q014
  type: selectAll
  prompt: Which formula-and-data matches are valid?
  choices:
  - {id: a, text: '$K=\tfrac12bh$ with a perpendicular height $h$.'}
  - {id: b, text: '$K=\tfrac12ab\sin C$ with $C$ included between $a$ and $b$.'}
  - {id: c, text: Heron formula after three side lengths pass triangle inequality.}
  - {id: d, text: '$K=rs$ with $s$ equal to the full perimeter.'}
  answer: {choiceIds: [a, b, c]}
  explanation: In $K=rs$, $s$ is semiperimeter, not full perimeter.
- id: q015
  type: freeResponse
  prompt: Derive $K=rs$ for a triangle with inradius $r$ and semiperimeter $s$.
  media:
  - type: image
    src: /assessments/aops/aops-triangles-area-methods.svg
    alt: Triangle with incircle, inradius r, and side labels a, b, and c.
  answer:
    gradingMode: selfCheck
    expected: 'Join the incenter to all three vertices. This partitions the triangle into three smaller triangles with bases $a,b,c$ and common perpendicular height $r$. Their total area is $\tfrac12ar+\tfrac12br+\tfrac12cr=\tfrac12r(a+b+c)=rs$ because $s=(a+b+c)/2$.'
    keyPoints:
    - Partitions the triangle using the incenter.
    - Uses the inradius as each perpendicular height.
    - Sums the three base-height areas.
    - Replaces half the perimeter by $s$.
  explanation: The formula is the sum of three base-height areas, not an independent mnemonic.
