questions:
- id: q001
  type: multipleChoice
  prompt: 'A right triangle has legs of length 5 and 12. What is the length of the hypotenuse?'
  difficultyDimensions:
  - Identify $a=5, b=12$ and set up $5^2 + 12^2 = c^2$.
  - Calculate $25 + 144 = 169$.
  - Take the square root: $c = 13$.
  choices:
  - id: a
    text: '13'
  - id: b
    text: '17'
    issueSignals:
    - sum-instead-of-squares
  - id: c
    text: '169'
    issueSignals:
    - square-root-omission
  - id: d
    text: '10.9'
    issueSignals:
    - subtraction-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    Using the Pythagorean theorem ($a^2 + b^2 = c^2$):
    $5^2 + 12^2 = c^2$
    $25 + 144 = c^2$
    $169 = c^2$
    $c = 13$.

    Why it works:
    The hypotenuse is the longest side, and its square is always the sum of the squares of the other two sides. The set (5, 12, 13) is a famous Pythagorean triple that is highly worth memorizing.

    Why the other choices fail:
    - 17 is just the sum of the legs ($5 + 12$), violating the triangle inequality (the third side must be strictly less than the sum of the other two).
    - 169 is $c^2$, forgetting to take the square root.
    - 10.9 is $\sqrt{144 - 25} = \sqrt{119}$, which is the calculation if 12 was the hypotenuse and you were finding a missing leg.

- id: q002
  type: multipleChoice
  prompt: 'In a right triangle, the hypotenuse is 25 and one leg is 24. What is the length of the other leg?'
  difficultyDimensions:
  - Set up equation: $x^2 + 24^2 = 25^2$.
  - Calculate $x^2 + 576 = 625$.
  - Subtract: $x^2 = 49$.
  - Take the square root: $x = 7$.
  choices:
  - id: a
    text: '34.6'
    issueSignals:
    - hypotenuse-addition-error
  - id: b
    text: '49'
    issueSignals:
    - square-root-omission
  - id: c
    text: '7'
  - id: d
    text: '1'
    issueSignals:
    - linear-difference-error
  answer:
    choiceId: c
  explanation: |
    Solution:
    Let $x$ be the missing leg.
    $x^2 + 24^2 = 25^2$
    $x^2 + 576 = 625$
    $x^2 = 625 - 576$
    $x^2 = 49$
    $x = 7$.

    Why it works:
    When finding a leg, you must subtract the square of the known leg from the square of the hypotenuse. The set (7, 24, 25) is another common Pythagorean triple.

    Why the other choices fail:
    - 34.6 is $\sqrt{24^2 + 25^2} = \sqrt{1201}$. This incorrectly treats 25 as a leg rather than the hypotenuse.
    - 49 is $x^2$, forgetting to take the square root.
    - 1 is $25 - 24$, failing to square the numbers before subtracting.

- id: q003
  type: multipleChoice
  prompt: 'In a $45^\circ-45^\circ-90^\circ$ right triangle, the length of a leg is $8\sqrt{2}$. What is the length of the hypotenuse?'
  difficultyDimensions:
  - 'Recall the ratio of sides is $1 : 1 : \sqrt{2}$.'
  - 'Multiply the leg length by $\sqrt{2}$: $(8\sqrt{2})(\sqrt{2})$.'
  - Simplify: $8 \times 2 = 16$.
  choices:
  - id: a
    text: '16'
  - id: b
    text: '8'
    issueSignals:
    - ratio-division-error
  - id: c
    text: '$16\sqrt{2}$'
    issueSignals:
    - root-multiplication-error
  - id: d
    text: '12'
    issueSignals:
    - arithmetic-error
  answer:
    choiceId: a
  explanation: |
    Solution:
    In an isosceles right triangle ($45^\circ-45^\circ-90^\circ$), the hypotenuse is exactly $\sqrt{2}$ times the length of a leg.
    Hypotenuse = $\text{leg} \times \sqrt{2}$
    Hypotenuse = $(8\sqrt{2}) \times \sqrt{2}$
    Hypotenuse = $8 \times (\sqrt{2} \times \sqrt{2}) = 8 \times 2 = 16$.

    Why it works:
    This comes directly from the Pythagorean theorem: $x^2 + x^2 = c^2 \implies 2x^2 = c^2 \implies c = x\sqrt{2}$.

    Why the other choices fail:
    - 8 comes from dividing the leg by $\sqrt{2}$ instead of multiplying. That would be the answer if $8\sqrt{2}$ was the hypotenuse.
    - $16\sqrt{2}$ comes from incorrectly multiplying $(8\sqrt{2})(\sqrt{2}) = 16\sqrt{2}$.
    - 12 is a random arithmetic guess.

- id: q004
  type: multipleChoice
  prompt: 'In a $30^\circ-60^\circ-90^\circ$ right triangle, the hypotenuse has length 10. What is the length of the side opposite the $60^\circ$ angle?'
  difficultyDimensions:
  - 'Recall the ratio of sides is $1 : \sqrt{3} : 2$.'
  - 'Find the shortest side (opposite the $30^\circ$ angle) by dividing the hypotenuse by 2: $10 / 2 = 5$.'
  - 'Multiply the shortest side by $\sqrt{3}$ to find the middle side: $5\sqrt{3}$.'
  choices:
  - id: a
    text: '$5$'
    issueSignals:
    - shortest-side-confusion
  - id: b
    text: '$5\sqrt{3}$'
  - id: c
    text: '$10\sqrt{3}$'
    issueSignals:
    - hypotenuse-multiplier-error
  - id: d
    text: '$\frac{10\sqrt{3}}{3}$'
    issueSignals:
    - longer-leg-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    The sides of a $30^\circ-60^\circ-90^\circ$ triangle are in the ratio $1 : \sqrt{3} : 2$.
    The hypotenuse corresponds to the "2" in the ratio.
    The side opposite the $30^\circ$ angle is half the hypotenuse: $10 / 2 = 5$.
    The side opposite the $60^\circ$ angle is the short leg multiplied by $\sqrt{3}$: $5\sqrt{3}$.

    Why it works:
    Always find the shortest leg first (opposite the $30^\circ$ angle). It acts as the "base unit" for the other two sides. Multiply it by 2 to get the hypotenuse, and multiply it by $\sqrt{3}$ to get the long leg.

    Why the other choices fail:
    - $5$ is the length of the side opposite the $30^\circ$ angle (the shortest leg).
    - $10\sqrt{3}$ incorrectly multiplies the *hypotenuse* by $\sqrt{3}$.
    - $\frac{10\sqrt{3}}{3}$ is what the short leg would be if 10 was the *long leg* (divide by $\sqrt{3}$).

- id: q005
  type: multipleChoice
  prompt: 'Which of the following sets of three lengths CANNOT form a valid triangle?'
  difficultyDimensions:
  - Recall the Triangle Inequality Theorem: The sum of any two sides must be strictly greater than the third side.
  - Test the small sides against the largest side: $a + b > c$.
  - Evaluate sets: $3+4 > 5$ (Yes), $5+12 > 13$ (Yes), $7+8 > 14$ (Yes), $2+4 = 6$ (No, not strictly greater).
  choices:
  - id: a
    text: '3, 4, 5'
  - id: b
    text: '7, 8, 14'
  - id: c
    text: '2, 4, 6'
    issueSignals:
    - inequality-equality-confusion
  - id: d
    text: '10, 10, 19'
  answer:
    choiceId: c
  explanation: |
    Solution:
    The Triangle Inequality Theorem states that for any three side lengths to form a triangle, the sum of the two shorter sides must be **strictly greater** than the longest side.
    Let's test the choices:
    - $3 + 4 = 7 > 5$ (Valid)
    - $7 + 8 = 15 > 14$ (Valid)
    - $10 + 10 = 20 > 19$ (Valid)
    - $2 + 4 = 6$, which is NOT greater than 6. (Invalid)

    Why it works:
    If the two shorter sides sum to exactly the length of the longest side, they will lie completely flat on top of the long side when joined, forming a degenerate straight line rather than a triangle.

    Why the other choices fail:
    - 3, 4, 5 forms a valid right triangle.
    - 7, 8, 14 forms a valid obtuse triangle.
    - 10, 10, 19 forms a valid isosceles triangle.
    The question asks which set CANNOT form a triangle.
