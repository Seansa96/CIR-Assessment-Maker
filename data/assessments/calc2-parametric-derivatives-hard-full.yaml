questions:
- id: q-ead78c
  type: symbolicResponse
  title: Second Derivative (1)
  prompt: Find $\frac{d^2y}{dx^2}$ in terms of $t$ for $x = t^4$, $y = t^2$.
  answer:
    expectedLatex: ((2/4)*(2-4)*t^(1-4))/((4)*t^(4-1))
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.0001
  explanation: $\frac{dy}{dx} = \frac{2t}{4t^{4-1}} = \frac{2}{4} t^{-2}$. Taking
    derivative with respect to $t$ gives $\frac{2(2-4)}{4} t^{-3}$. Dividing by $dx/dt
    = 4t^{4-1}$ yields the final result.
  skills:
  - parametric-derivatives
- id: q-7de7db
  type: numericResponse
  title: Horizontal Tangent (2)
  prompt: At what $t > 0$ does the curve $x = 3t^3$, $y = t^2 - 3t$ have a horizontal
    tangent?
  answer:
    value: 1.5
    tolerance: 0.01
  explanation: Horizontal tangent occurs when $\frac{dy}{dt} = 0$. $2t - 3 = 0 \implies
    t = 1.5$.
  skills:
  - parametric-derivatives
