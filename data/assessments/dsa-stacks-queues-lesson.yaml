questions:
- id: intro-stacks-queues
  type: freeResponse
  prompt: "**Stacks and Queues**\n\n![Stack and Queue Diagram](/media/dsa/stack-queue-fifo-lifo.svg)\n\
    \nUnlike Arrays and Linked Lists, which allow you to insert or delete elements anywhere, **Stacks**\
    \ and **Queues** are *restricted access* data structures. They restrict *where* you can add and remove\
    \ data, which enforces a specific processing order.\n\nA **Stack** follows the **LIFO (Last In, First\
    \ Out)** principle. Think of a stack of plates: you add to the top (push), and you remove from the\
    \ top (pop). The last plate added is the first one removed.\n\nA **Queue** follows the **FIFO (First\
    \ In, First Out)** principle. Think of a line at a grocery store: you join at the back (enqueue),\
    \ and the person at the front is served first (dequeue). \n\nBecause they only operate on the ends,\
    \ all core operations (push, pop, enqueue, dequeue) can be implemented to run in $O(1)$ time using\
    \ either arrays or linked lists under the hood.\n\nSuppose you are writing a program to implement\
    \ a \"Undo\" feature for a text editor. Which data structure (Stack or Queue) should you use to store\
    \ the user's actions, and why?\n"
  answer:
    gradingMode: selfCheck
  explanation: 'Solution:

    You should use a Stack.


    Why it works:

    An "Undo" feature needs to reverse the *most recent* action first. This perfectly matches the LIFO
    (Last In, First Out) principle of a Stack. A Queue would undo the *oldest* action first, which is
    not how "Undo" works.

    '
