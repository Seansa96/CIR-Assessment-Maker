workedExamples:
- id: we001
  title: Two Blocks on a Frictionless Surface
  problem: "Two blocks, $m_1 = 2.0$ kg and $m_2 = 3.0$ kg, are in contact on a frictionless\
    \\rhorizontal surface. A\rhorizontal force of $F = 15$ N is applied to $m_1$ pushing\
    \ it towards $m_2$. \n\nWhat is the acceleration of the two blocks, and what is\
    \ the contact force between them?\n"
  steps:
  - id: step-we001-1
    title: Treat both blocks as a single system to find the overall acceleration.
    instruction: 'Since the blocks move together, their acceleration $a$ is the same.
      The total mass is $M = m_1 + m_2 = 2.0 + 3.0 = 5.0$ kg.

      The net force on the system is the applied force $F = 15$ N.


      $$ a = \frac{F}{M} = \frac{15}{5.0} = 3.0 \text{ m/s}^2 $$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
  - id: step-we001-2
    title: Draw a free-body diagram for $m_2$ to find the contact force.
    instruction: 'The only\rhorizontal force acting on $m_2$ is the contact force (normal
      force) $F_c$ exerted by $m_1$.


      Applying Newton''s Second Law to $m_2$ alone:

      $$ \sum F_{x, m2} = F_c = m_2 a $$


      $$ F_c = (3.0 \text{ kg})(3.0 \text{ m/s}^2) = 9.0 \text{ N} $$


      *Alternative Check:* Applying Newton''s Second Law to $m_1$ alone:

      $$ \sum F_{x, m1} = F - F_c = m_1 a $$

      $$ 15 - F_c = (2.0)(3.0) \implies 15 - F_c = 6.0 \implies F_c = 9.0 \text{ N}
      $$

      The results match!

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
