questions:
- id: q1
  type: numericResponse
  prompt: A $1.0 \text{ kg}$ mass is dropped onto the edge of a horizontal disk ($M=2.0
    \text{ kg}, R=0.5 \text{ m}, I=\frac{1}{2}MR^2$) spinning at $6.0 \text{ rad/s}$.
    The mass sticks. What is the new angular velocity?
  answer:
    value: 3.0
    tolerance: 0.1
  explanation: $I_{initial} = 0.5(2.0)(0.25) = 0.25$. $L = I\omega = 0.25(6) = 1.5$.
    $I_{final} = 0.25 + mR^2 = 0.25 + 1(0.25) = 0.50$. $\omega_f = 1.5/0.50=3.0 \text{
    rad/s}$.
