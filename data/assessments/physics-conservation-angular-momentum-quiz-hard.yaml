questions:
- id: q1
  type: numericResponse
  prompt: A $1.0 \text{ kg}$ mass is dropped onto the edge of a horizontal disk ($M=2.0
    \text{ kg}, R=0.5 \text{ m}, I=\frac{1}{2}MR^2$) spinning at $6.0 \text{ rad/s}$.
    The mass sticks. What is the new angular velocity?
  answer:
    value: 3.0
    tolerance: 0.1
  difficultyDimensions: [modelOrDerivation, representationTransfer, casePartition]
  subjectDifficultyTags: [inelastic-rotational-coupling, moment-of-inertia]
  difficultyEvidence: Separates initial and final moments of inertia for a sticking event and applies angular-momentum conservation.
  prerequisiteObjectiveIds: [phys1-obj-fixed-axis-rotation]
  extensionObjectiveIds: [phys1-obj-fixed-axis-rotation]
  explanation: |
    Solution: The disk initially has

    $$
    I_D=\frac12MR^2=\frac12(2.0)(0.50)^2=0.25\ \text{kg}\cdot\text{m}^2.
    $$

    Its initial angular momentum is $L_i=I_D\omega_i=0.25(6.0)=1.50\ \text{kg}\cdot\text{m}^2/\text{s}$. After the mass sticks at the rim,

    $$
    I_f=I_D+mR^2=0.25+(1.0)(0.50)^2=0.50\ \text{kg}\cdot\text{m}^2.
    $$

    Therefore $L_i=I_f\omega_f$, so $\omega_f=1.50/0.50=3.0\ \text{rad/s}$.

    Why it works: About the disk axis, the sticking interaction is internal to the disk-plus-mass system and external torque is negligible, so angular momentum—not kinetic energy—is conserved.
