schemaVersion: 1
id: chem-aqueous-solutions-solubility-rules-recall
title: Solubility Rules Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
- chem-aqueous-solutions
skills:
- Apply Aqueous Solutions
- chem-aqueous-solutions
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - chemistry
  - chem-aqueous-solutions
modeDefault: practice
items:
- id: sr-group1
  type: typed
  skills:
  - solubility-rules
  prompt: "Salts containing Group 1 alkali metals (like $Li^+$, $Na^+$, $K^+$) are always _______."
  answer:
    expected: "soluble"
- id: sr-ammonium
  type: flashcard
  skills:
  - solubility-rules
  prompt: "Are ammonium ($NH_4^+$) salts soluble or insoluble in water?"
  answer:
    expectedLatex: "Soluble"
- id: sr-nitrates
  type: typed
  skills:
  - solubility-rules
  prompt: "Are all Nitrate ($NO_3^-$) salts soluble or insoluble in water?"
  answer:
    expected: "soluble"
- id: sr-acetates
  type: flashcard
  skills:
  - solubility-rules
  prompt: "Are acetate ($CH_3COO^-$ or $C_2H_3O_2^-$) salts generally soluble or insoluble?"
  answer:
    expectedLatex: "Soluble"
- id: sr-halides-general
  type: typed
  skills:
  - solubility-rules
  prompt: "Most halide salts ($Cl^-$, $Br^-$, $I^-$) are generally _______."
  answer:
    expected: "soluble"
- id: sr-halides-exceptions
  type: flashcard
  skills:
  - solubility-rules
  prompt: "Name the three heavy metal cations that form insoluble halide salts (the exceptions to the halide solubility rule)."
  answer:
    expectedLatex: "Silver ($Ag^+$), Lead ($Pb^{2+}$), and Mercury(I) ($Hg_2^{2+}$)"
- id: sr-silver-chloride
  type: typed
  skills:
  - solubility-rules
  prompt: "Based on the rules for halides, is Silver Chloride ($AgCl$) soluble or insoluble?"
  answer:
    expected: "insoluble"
- id: sr-sulfates-general
  type: typed
  skills:
  - solubility-rules
  prompt: "Most sulfate ($SO_4^{2-}$) salts are generally _______."
  answer:
    expected: "soluble"
- id: sr-sulfates-exceptions
  type: flashcard
  skills:
  - solubility-rules
  prompt: "What are the common exceptions that form insoluble sulfate salts?"
  answer:
    expectedLatex: "Barium ($Ba^{2+}$), Strontium ($Sr^{2+}$), Calcium ($Ca^{2+}$), Lead ($Pb^{2+}$), and Silver ($Ag^+$)."
- id: sr-hydroxides-general
  type: typed
  skills:
  - solubility-rules
  prompt: "Most hydroxide ($OH^-$) salts are generally _______."
  answer:
    expected: "insoluble"
- id: sr-hydroxides-exceptions
  type: flashcard
  skills:
  - solubility-rules
  prompt: "What cations form soluble (or slightly soluble) hydroxides, ignoring Group 1 and Ammonium?"
  answer:
    expectedLatex: "Heavier alkaline earth metals: Calcium ($Ca^{2+}$), Strontium ($Sr^{2+}$), and Barium ($Ba^{2+}$)."
- id: sr-sulfides
  type: flashcard
  skills:
  - solubility-rules
  prompt: "Are most sulfide ($S^{2-}$) salts soluble or insoluble? (Ignore Group 1, Group 2, and Ammonium)"
  answer:
    expectedLatex: "Insoluble"
- id: sr-carbonates
  type: typed
  skills:
  - solubility-rules
  prompt: "Most carbonates ($CO_3^{2-}$) are insoluble. However, a carbonate salt is soluble if the cation is Ammonium or a _______ metal."
  answer:
    expected: "group 1"
    aliases:
    - alkali
- id: sr-phosphates
  type: typed
  skills:
  - solubility-rules
  prompt: "Are most phosphate ($PO_4^{3-}$) salts soluble or insoluble in water?"
  answer:
    expected: "insoluble"
