    check:
      id: physics2-ch05-coulombs-law-s1-check
      type: multipleChoice
      prompt: Two charges $q_1=+2\,\mu\mathrm C$ and $q_2=-3\,\mu\mathrm C$ are separated by $r$. Which direction is the force on $q_2$?
      choices:
      - id: a
        text: away from $q_1$
        media: []
        issueSignals:
        - id: sign-error
          domains: []
      - id: b
        text: toward $q_1$
        media: []
        issueSignals: []
      - id: c
        text: perpendicular to the line
        media: []
        issueSignals:
        - id: vector-component-resolution-error
          domains: []
      - id: d
        text: zero
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      answer:
        choiceId: b
        choiceIds: []
