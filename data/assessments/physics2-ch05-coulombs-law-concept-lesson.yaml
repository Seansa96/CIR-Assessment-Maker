  - id: physics2-ch05-coulombs-law-s3
    title: Inverse-square scaling
    required: true
    content: Holding charges fixed, doubling separation changes force by $(1/2)^2$, so $F$ becomes one-fourth. This is a geometric dilution law, not a linear proportionality. Check the exponent before calculating.
