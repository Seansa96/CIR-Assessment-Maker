lesson:
  introduction: >
    This lesson develops a repeatable way to solve Coulomb's Law & Superposition problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch05-coulombs-law-s1
    title: Name the model and quantities
    required: true
    content: >
      Coulomb's Law & Superposition uses F = k q_1 q_2/r^2. In the name the model and quantities stage, convert charge units, determine attraction or repulsion, then add force vectors component by component.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Coulomb's Law & Superposition problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch05-coulombs-law-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Coulomb's Law & Superposition, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use F = k q_1 q_2/r^2 after you convert charge units, determine attraction or repulsion, then add force vectors component by component.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Coulomb's Law & Superposition problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch05-coulombs-law-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables F = k q_1 q_2/r^2 relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch05-coulombs-law-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Coulomb's Law & Superposition.
        media: []
        issueSignals:
        - id: physics2-physics2-ch05-coulombs-law-units-error
          domains:
          - physics-2
