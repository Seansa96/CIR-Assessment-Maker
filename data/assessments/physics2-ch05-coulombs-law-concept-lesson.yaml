schemaVersion: 1
id: physics2-ch05-coulombs-law-concept-lesson
title: Coulomb's Law & Superposition
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electric-charges-fields
lesson:
  introduction: This lesson develops the main ideas behind Coulomb's Law & Superposition and connects
    them to the governing physical relationships.
  sections:
  - id: l1-sec1
    title: Electric Charge
    required: true
    content: 'Electric charge is a fundamental property of matter. It comes in two types: positive and
      negative. Like charges repel, and opposite charges attract. Charge is quantized (in multiples of
      $e$) and conserved in isolated systems.'
  - id: l1-sec2
    title: Coulomb's Law
    required: true
    content: 'The electrostatic force between two point charges is proportional to the product of their
      charges and inversely proportional to the square of the distance between them. In vector form:

      $$\vec{F}_{12} = k \frac{q_1 q_2}{r^2} \hat{r}_{12}$$

      where $k = 8.99 \times 10^9 \text{ N m}^2/\text{C}^2$.'
  - id: l1-sec3
    title: Superposition Principle
    required: true
    content: 'When more than two charges are present, the net force on any one charge is the vector sum
      of the individual forces exerted by all other charges:

      $$\vec{F}_{net} = \sum_{i} \vec{F}_{i}$$'
