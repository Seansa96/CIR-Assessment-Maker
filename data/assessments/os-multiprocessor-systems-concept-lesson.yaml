lesson:
  introduction: 'This lesson introduces Multiple Processor Systems through the mental models emphasized by 8 Multiple Processor
    Systems. Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: parallel-hardware
    title: Parallel hardware
    required: true
    content: 'Multiprocessor systems run work on more than one CPU or core, creating opportunities and coordination costs.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      More processors do not automatically mean proportional speedup.

      '
    check:
      id: parallel-hardware-check
      title: 'Check: Parallel hardware'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Parallel hardware**?

        '
      choices:
      - id: a
        text: Multiprocessor systems run work on more than one CPU or core, creating opportunities and coordination costs.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Multiprocessor systems run work on more than one CPU or core, creating opportunities and coordination
        costs. Related topic: Multiple Processor Systems.

        '
  - id: shared-memory
    title: Shared memory
    required: true
    content: 'Shared-memory multiprocessors let processors access a common address space.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Shared memory increases communication ease but makes synchronization essential.

      '
    check:
      id: shared-memory-check
      title: 'Check: Shared memory'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Shared memory**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Shared-memory multiprocessors let processors access a common address space.
      answer:
        choiceId: d
      explanation: 'Shared-memory multiprocessors let processors access a common address space. Related topic: Multiple Processor
        Systems.

        '
  - id: cache-coherence
    title: Cache coherence
    required: true
    content: 'Cache coherence keeps processors from seeing incompatible cached values for shared memory.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Coherence is not the same as correct locking.

      '
    check:
      id: cache-coherence-check
      title: 'Check: Cache coherence'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Cache coherence**?

        '
      choices:
