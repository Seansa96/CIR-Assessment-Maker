        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Cache coherence keeps processors from seeing incompatible cached values for shared memory.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Cache coherence keeps processors from seeing incompatible cached values for shared memory. Related topic:
        Multiple Processor Systems.

        '
  - id: multiprocessor-scheduling
    title: Multiprocessor scheduling
    required: true
    content: 'The scheduler must consider processor affinity, load balancing, and cache effects.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Moving a task can balance load but disrupt cache locality.

      '
    check:
      id: multiprocessor-scheduling-check
      title: 'Check: Multiprocessor scheduling'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Multiprocessor scheduling**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: The scheduler must consider processor affinity, load balancing, and cache effects.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'The scheduler must consider processor affinity, load balancing, and cache effects. Related topic: Multiple
        Processor Systems.

        '
  - id: scalability
    title: Scalability
    required: true
    content: 'A design scales when added processors continue to improve useful throughput.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Global locks can destroy scalability.

      '
    check:
      id: scalability-check
      title: 'Check: Scalability'
