  - id: distributed-systems-contrast
    title: Distributed systems contrast
    required: true
    content: 'Distributed systems communicate across machines and often lack shared memory.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Network delay and partial failure change the design problem.

      '
