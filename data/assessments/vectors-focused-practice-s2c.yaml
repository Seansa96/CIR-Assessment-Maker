questions:
- id: q001
  type: multipleChoice
  prompt: 'Compute $\langle2,-1,3\rangle-\langle1,4,-2\rangle$.'
  choices:
  - id: a
    text: '$\langle1,-5,5\rangle$'
  - id: b
    text: '$\langle3,3,1\rangle$'
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: '$\langle1,3,-5\rangle$'
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: '$\langle-1,5,-5\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Subtract corresponding components.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: 'What is $|\langle2,1,2\rangle|$?'
  choices:
  - id: a
    text: $3$
  - id: b
    text: $5$
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: $9$
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: '$\sqrt5$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Use $\sqrt{2^2+1^2+2^2}$.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: 'Which is a unit vector in the direction of $\langle3,0,4\rangle$?'
  choices:
  - id: a
    text: '$\langle3/5,0,4/5\rangle$'
  - id: b
    text: '$\langle3,0,4\rangle$'
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: '$\langle4/5,0,3/5\rangle$'
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: '$\langle3/4,0,4/3\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Divide every component by magnitude 5.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q004
  type: multipleChoice
  prompt: Which quantity is a vector?
  choices:
  - id: a
    text: A displacement of 5 meters east
  - id: b
    text: A temperature of 5 degrees
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: A mass of 5 kilograms
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: A time of 5 seconds
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: A vector needs both magnitude and direction.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
