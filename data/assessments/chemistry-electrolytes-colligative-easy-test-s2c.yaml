questions:
  - { id: q001, type: freeResponse, prompt: 'Classify NaNO3 as strong electrolyte, weak electrolyte, or nonelectrolyte.', answer: { gradingMode: selfCheck, keyPoints: ['strong electrolyte', 'soluble ionic compound'] }, explanation: 'Solution: NaNO3 is a strong electrolyte. Why it works: A soluble ionic salt separates into mobile Na+ and NO3− ions in water. Common trap: Calling it weak because nitrate is a polyatomic ion.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Classifies formula notation using ionic-solubility behavior.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: easy-classify-soluble-salt, variationAxes: { givens: ionic formula, unknown: electrolyte class } }
  - { id: q002, type: freeResponse, prompt: 'Classify glucose, C6H12O6, dissolved in water.', answer: { gradingMode: selfCheck, keyPoints: ['nonelectrolyte', 'molecular solute remains molecules'] }, explanation: 'Solution: Glucose is a nonelectrolyte. Why it works: It dissolves as neutral molecules rather than producing ions. Common trap: Assuming every dissolved substance conducts.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Transfers molecular formula to particle behavior and classification.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: easy-classify-molecular-solute, variationAxes: { givens: molecular solute, unknown: electrolyte class } }
  - { id: q003, type: freeResponse, prompt: 'Write the ions produced by one formula unit of CaCl2 in water.', answer: { gradingMode: selfCheck, keyPoints: ['Ca2+', '2 Cl−'] }, explanation: 'Solution: CaCl2 → Ca2+ + 2Cl−. Why it works: The subscripts preserve atom count and the ions retain their standard charges. Common trap: Writing one chloride ion.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts formula subscripts into a balanced dissociation statement.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: easy-write-cacl2-ions, variationAxes: { representation: formula to ions, unknown: dissociation products } }
  - { id: q004, type: freeResponse, prompt: 'Find [Na+] in 0.125 M Na2SO4, assuming complete dissociation.', answer: { gradingMode: selfCheck, keyPoints: ['0.250 M', 'two sodium ions'] }, explanation: 'Solution: [Na+] = 2(0.125 M) = 0.250 M. Why it works: Each formula unit supplies two sodium ions. Common trap: Using sulfate charge instead of the sodium subscript.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Applies a dissociation coefficient to formula-unit molarity.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: easy-cation-molarity, variationAxes: { givens: salt molarity, unknown: cation concentration } }
  - { id: q005, type: freeResponse, prompt: 'Find [SO4 2−] in 0.125 M Na2SO4.', answer: { gradingMode: selfCheck, keyPoints: ['0.125 M', 'one sulfate per formula unit'] }, explanation: 'Solution: [SO4 2−] = 1(0.125 M) = 0.125 M. Why it works: There is one sulfate ion in each formula unit. Common trap: Multiplying by the ionic charge.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Distinguishes formula coefficient from ionic charge in concentration accounting.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: easy-anion-molarity, variationAxes: { givens: salt molarity, unknown: anion concentration } }
  - { id: q006, type: freeResponse, prompt: 'How many total ions are produced ideally by one formula unit of Al2(SO4)3?', answer: { gradingMode: selfCheck, keyPoints: ['5 ions', '2 aluminum plus 3 sulfate'] }, explanation: 'Solution: Al2(SO4)3 gives 2 Al3+ and 3 SO4 2−, for 5 ions total. Why it works: Add formula subscripts after dissociation. Common trap: Adding charge magnitudes rather than particles.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Builds a particle count from a compound formula.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: easy-total-ion-count, variationAxes: { representation: formula to particle count, unknown: total ions } }
  - { id: q007, type: freeResponse, prompt: 'Rank equal-molar aqueous glucose, NaCl, and CaCl2 from lowest to highest ideal boiling-point elevation.', answer: { gradingMode: selfCheck, keyPoints: ['glucose < NaCl < CaCl2', '1, 2, 3 particles'] }, explanation: 'Solution: glucose < NaCl < CaCl2 because they make 1, 2, and 3 particles per formula unit ideally. Why it works: Boiling-point elevation increases with particle concentration. Common trap: Ranking by molecular mass.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Maps three dissociation patterns to a colligative-property ranking.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: easy-colligative-threeway-ranking, variationAxes: { scenario: equal molarity, unknown: boiling trend } }
  - { id: q008, type: freeResponse, prompt: 'At equal concentration, which has the lower freezing point: NaCl(aq) or glucose(aq)?', answer: { gradingMode: selfCheck, keyPoints: ['NaCl', 'more particles', 'greater freezing-point depression'] }, explanation: 'Solution: NaCl(aq) has the lower freezing point. Why it works: It produces two ions per unit while glucose remains one molecule. Common trap: Thinking a salt raises freezing point.', difficultyDimensions: [representationTransfer, globalLocalReasoning], difficultyEvidence: 'Uses microscopic particle count to predict a bulk phase-change trend.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: easy-freezing-depression-choice, variationAxes: { unknown: freezing-point comparison, governingRelation: particle count } }
  - { id: q009, type: freeResponse, prompt: 'State why distilled water has much lower electrical conductivity than 0.10 M KCl.', answer: { gradingMode: selfCheck, keyPoints: ['KCl provides mobile ions', 'distilled water has very few ions'] }, explanation: 'Solution: KCl dissociates into mobile K+ and Cl− ions, whereas distilled water contains very few charge carriers. Why it works: Electrical current in solution is carried by moving ions. Common trap: Explaining conductivity by molecule size.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Connects microscopic charge carriers with measured conductivity.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: easy-conductivity-carriers, variationAxes: { scenario: conductivity comparison, representation: particles to measurement } }
  - { id: q010, type: freeResponse, prompt: 'Find total ideal ion concentration in 0.0500 M Mg(NO3)2.', answer: { gradingMode: selfCheck, keyPoints: ['0.150 M total ions', 'three ions per formula unit'] }, explanation: 'Solution: Mg(NO3)2 yields one Mg2+ and two NO3−, so total ions = 3(0.0500 M) = 0.150 M. Why it works: Total ion concentration uses particle count, not charge sum. Common trap: Counting nitrate as one ion total.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Counts ions and scales formula-unit molarity.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: easy-total-ion-concentration, variationAxes: { givens: salt molarity, unknown: total ion concentration } }
  - { id: q011, type: freeResponse, prompt: 'A weak electrolyte solution contains mostly neutral molecules and a few ions. Predict its conductivity relative to an equal-concentration strong electrolyte.', answer: { gradingMode: selfCheck, keyPoints: ['lower conductivity', 'fewer mobile ions'] }, explanation: 'Solution: Its conductivity is lower because only a fraction of solute particles are ions. Why it works: Partial ionization supplies fewer charge carriers. Common trap: Calling it nonconducting because it is weak.', difficultyDimensions: [representationTransfer, globalLocalReasoning], difficultyEvidence: 'Interprets particle composition and predicts a macroscopic property.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: easy-weak-conductivity, variationAxes: { representation: particle mixture, unknown: conductivity comparison } }
  - { id: q012, type: freeResponse, prompt: 'Find [Cl−] in 0.0800 M FeCl3.', answer: { gradingMode: selfCheck, keyPoints: ['0.240 M'] }, explanation: 'Solution: [Cl−] = 3(0.0800 M) = 0.240 M. Why it works: The formula contains three chloride ions per formula unit. Common trap: Multiplying by the iron charge.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Uses the anion coefficient rather than charge as concentration multiplier.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: easy-chloride-from-fecl3, variationAxes: { givens: trichloride salt, unknown: chloride concentration } }
  - { id: q013, type: freeResponse, prompt: 'Which solution has greater ideal osmotic pressure: 0.20 M glucose or 0.10 M CaCl2?', answer: { gradingMode: selfCheck, keyPoints: ['0.20 M glucose', '0.20 particle molarity versus 0.30'] }, explanation: 'Solution: 0.10 M CaCl2 has greater ideal osmotic pressure because it gives 3(0.10)=0.30 particle molarity, exceeding glucose at 0.20. Why it works: Osmotic pressure follows effective particle concentration. Common trap: Comparing only formula-unit molarity.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Converts unlike solutes to effective particle concentrations before comparison.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: easy-osmotic-effective-concentration, variationAxes: { scenario: unequal molarity comparison, unknown: osmotic ranking } }
  - { id: q014, type: freeResponse, prompt: 'Correct this statement: “A 2+ ion counts as two dissolved particles.”', answer: { gradingMode: selfCheck, keyPoints: ['false', 'one ion is one particle', 'charge is not particle count'] }, explanation: 'Solution: The statement is false: one Mg2+ ion is one particle with charge +2. Why it works: Particle count and charge magnitude are different quantities. Common trap: Adding charge magnitudes to find van’t Hoff particle count.', difficultyDimensions: [errorDiagnosis, representationTransfer], difficultyEvidence: 'Separates charge notation from particle-count representation.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: easy-charge-versus-particle, variationAxes: { scenario: error claim, unknown: corrected principle } }
  - { id: q015, type: freeResponse, prompt: 'For ideal 0.100 M K3PO4, find [K+].', answer: { gradingMode: selfCheck, keyPoints: ['0.300 M'] }, explanation: 'Solution: [K+] = 3(0.100 M) = 0.300 M. Why it works: Three potassium ions occur per formula unit. Common trap: Dividing by three because potassium has a +1 charge.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Reads formula stoichiometry and applies it to concentration.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0443], reasoningSignature: easy-potassium-from-phosphate, variationAxes: { givens: tripotassium salt, unknown: cation concentration } }
  - { id: q016, type: freeResponse, prompt: 'Explain why adding solute to pure water can change its freezing point even though the solute does not become ice.', answer: { gradingMode: selfCheck, keyPoints: ['dissolved particles disrupt solvent freezing equilibrium', 'freezing point decreases'] }, explanation: 'Solution: Dissolved particles alter the solvent’s liquid-solid equilibrium, so a lower temperature is required to freeze the solution. Why it works: Freezing-point depression is a colligative effect of dissolved particles. Common trap: Saying solute particles must enter the ice crystal.', difficultyDimensions: [modelOrDerivation, globalLocalReasoning], difficultyEvidence: 'Links particle-level solute presence to phase-equilibrium behavior.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: easy-freezing-mechanism, variationAxes: { scenario: conceptual freezing, unknown: causal explanation } }
  - { id: q017, type: freeResponse, prompt: 'A 0.200 M NaCl solution is diluted to twice its volume. Find final [Na+].', answer: { gradingMode: selfCheck, keyPoints: ['0.100 M NaCl final', '0.100 M Na+'] }, explanation: 'Solution: Doubling volume halves NaCl molarity to 0.100 M; one Na+ per formula unit gives [Na+] = 0.100 M. Why it works: First conserve solute during dilution, then use ion stoichiometry. Common trap: Halving sodium ions a second time.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Chains dilution behavior with ion concentration accounting.', prerequisiteObjectiveIds: [ion-molarity], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: easy-diluted-sodium, variationAxes: { scenario: dilution, methodBranch: dilution then dissociation } }
  - { id: q018, type: freeResponse, prompt: 'At equal molality, which produces more particles ideally: AlCl3 or MgCl2?', answer: { gradingMode: selfCheck, keyPoints: ['AlCl3', 'four particles versus three'] }, explanation: 'Solution: AlCl3 produces four ions, while MgCl2 produces three, so AlCl3 produces more particles. Why it works: Formula subscripts determine ideal dissociation count. Common trap: Comparing cation charges only.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Constructs and compares two dissociation particle models.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: easy-salt-particle-compare, variationAxes: { scenario: equal molality salts, unknown: particle ranking } }
  - { id: q019, type: freeResponse, prompt: 'A solution conducts brightly in a simple conductivity tester. What particle-level observation supports identifying it as a strong electrolyte?', answer: { gradingMode: selfCheck, keyPoints: ['mostly or entirely separated ions', 'few neutral solute particles'] }, explanation: 'Solution: A strong electrolyte should be represented by mostly separated cations and anions. Why it works: Complete dissociation provides many mobile charge carriers. Common trap: Looking for large molecules rather than ions.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: 'Connects an observation to the particle evidence needed for classification.', prerequisiteObjectiveIds: [electrolyte-classification], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0396], reasoningSignature: easy-strong-particle-evidence, variationAxes: { scenario: conductivity tester, unknown: supporting particle evidence } }
  - { id: q020, type: freeResponse, prompt: 'State the ideal van’t Hoff particle count i for Ba(NO3)2.', answer: { gradingMode: selfCheck, keyPoints: ['3', 'one barium plus two nitrate ions'] }, explanation: 'Solution: i = 3 because Ba(NO3)2 gives Ba2+ + 2NO3−. Why it works: i is the ideal number of particles formed per formula unit. Common trap: Using the sum of charges, 4.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts formula notation into ideal particle factor.', prerequisiteObjectiveIds: [colligative-trends], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0400], reasoningSignature: easy-vant-hoff-count, variationAxes: { representation: formula to i factor, unknown: particle factor } }
