glossary:
  introduction: Use each definition together with its equation-based example; retrieve the term from meaning rather
    than spelling cues.
  sections:
  - id: core
    title: Core vocabulary
    required: true
    content: Definitions, examples, and retrieval prompts for this chapter.
    entries:
    - id: t01
      term: linear first-order equation
      definition: An equation expressible as $y'+p(x)y=q(x)$.
      examples:
      - $y'+(2/x)y=x$ is linear on intervals avoiding zero.
      aliases: &id001 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t01-d
        type: typed
        prompt: What class has the standard form $y'+p(x)y=q(x)$?
        answer:
          expected: linear first-order equation
          aliases: *id001
          media: []
        explanation: |-
          Solution: linear first-order equation

          Why it works: An equation expressible as $y'+p(x)y=q(x)$.
    - id: t02
      term: complementary solution
      definition: The general solution of the associated homogeneous linear equation $y'+p(x)y=0$.
      examples:
      - $Ce^{-2x}$ is complementary to a particular solution of $y'+2y=6$.
      aliases: &id002 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t02-d
        type: typed
        prompt: What term names the homogeneous part added to a particular linear solution?
        answer:
          expected: complementary solution
          aliases: *id002
          media: []
        explanation: |-
          Solution: complementary solution

          Why it works: The general solution of the associated homogeneous linear equation $y'+p(x)y=0$.
    - id: t03
      term: integrating factor
      definition: A nonzero multiplier that converts an equation into an exact or directly integrable form.
      examples:
      - Multiplying $y'+2y=6$ by $e^{2x}$ creates $(e^{2x}y)'$.
      aliases: &id003 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t03-d
        type: typed
        prompt: What term names the multiplier that creates a product derivative or exact equation?
        answer:
          expected: integrating factor
          aliases: *id003
          media: []
        explanation: |-
          Solution: integrating factor

          Why it works: A nonzero multiplier that converts an equation into an exact or directly integrable form.
    - id: t04
      term: separable equation
      definition: 'A first-order equation writable as $g(y)\,dy=f(x)\,dx$ after algebra.'
      examples:
      - '$y''=xy$ becomes $dy/y=x\,dx$ away from $y=0$.'
      aliases: &id004 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t04-d
        type: typed
        prompt: What class permits all $y$ factors and $x$ factors to be placed on opposite sides?
        answer:
          expected: separable equation
          aliases: *id004
          media: []
        explanation: |-
          Solution: separable equation

          Why it works: A first-order equation writable as $g(y)\,dy=f(x)\,dx$ after algebra.
    - id: t05
      term: implicit solution
      definition: A relation $F(x,y)=C$ that satisfies the equation without isolating $y$.
      examples:
      - '$y+\ln|y-1|=x^2+C$ may be left as a relation.'
      aliases: &id005 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t05-d
        type: typed
        prompt: What solution form leaves the variables together in a relation?
        answer:
          expected: implicit solution
          aliases: *id005
          media: []
        explanation: |-
          Solution: implicit solution

          Why it works: A relation $F(x,y)=C$ that satisfies the equation without isolating $y$.
    - id: t06
      term: equilibrium solution
      definition: A constant solution obtained from a zero of the autonomous rate function.
      examples:
      - $y=0$ is retained before dividing by $y$ in $y'=xy$.
      aliases: &id006
      - steady-state solution
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t06-d
        type: typed
        prompt: What term names a constant solution that can be lost during division?
        answer:
          expected: equilibrium solution
          aliases: *id006
          media: []
        explanation: |-
          Solution: equilibrium solution

          Why it works: A constant solution obtained from a zero of the autonomous rate function.
    - id: t07
      term: existence
      definition: The property that at least one solution passes through the specified initial point locally.
      examples:
      - Continuity of $f$ near $(x_0,y_0)$ is a standard sufficient condition.
      aliases: &id007 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t07-d
        type: typed
        prompt: What property says at least one local IVP solution is present?
        answer:
          expected: existence
          aliases: *id007
          media: []
        explanation: |-
          Solution: existence

          Why it works: The property that at least one solution passes through the specified initial point locally.
    - id: t08
      term: uniqueness
      definition: The property that no more than one local solution passes through the specified initial point.
      examples:
      - Continuity of both $f$ and $f_y$ is a standard sufficient test.
      aliases: &id008 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t08-d
        type: typed
        prompt: What property rules out two distinct local solutions through the same initial point?
        answer:
          expected: uniqueness
          aliases: *id008
          media: []
        explanation: |-
          Solution: uniqueness

          Why it works: The property that no more than one local solution passes through the specified initial point.
    - id: t09
      term: Bernoulli equation
      definition: |-
        A nonlinear equation $y'+p(x)y=q(x)y^n$ with $n
        e0,1$ that becomes linear after a power substitution.
      examples:
      - For exponent $3$, use $v=y^{-2}$.
      aliases: &id009 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t09-d
        type: typed
        prompt: What class is linearized by $v=y^{1-n}$?
        answer:
          expected: Bernoulli equation
          aliases: *id009
          media: []
        explanation: |-
          Solution: Bernoulli equation

          Why it works: A nonlinear equation $y'+p(x)y=q(x)y^n$ with $n
          e0,1$ that becomes linear after a power substitution.
    - id: t10
      term: homogeneous nonlinear equation
      definition: A first-order equation expressible as $y'=F(y/x)$ and reduced by $v=y/x$.
      examples:
      - $y'=1+y/x$ uses $y=vx$.
      aliases: &id010 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t10-d
        type: typed
        prompt: What class is recognized by dependence on the ratio $y/x$?
        answer:
          expected: homogeneous nonlinear equation
          aliases: *id010
          media: []
        explanation: |-
          Solution: homogeneous nonlinear equation

          Why it works: A first-order equation expressible as $y'=F(y/x)$ and reduced by $v=y/x$.
    - id: t11
      term: exact equation
      definition: 'An equation $M\,dx+N\,dy=0$ for which $M_y=N_x$ on the region.'
      examples:
      - $(2xy+1)dx+(x^2+3y^2)dy=0$ passes the cross-partial test.
      aliases: &id011 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t11-d
        type: typed
        prompt: What class is identified by equality of the cross partial derivatives?
        answer:
          expected: exact equation
          aliases: *id011
          media: []
        explanation: |-
          Solution: exact equation

          Why it works: An equation $M\,dx+N\,dy=0$ for which $M_y=N_x$ on the region.
    - id: t12
      term: potential function
      definition: 'A scalar function $\Phi$ satisfying $\Phi_x=M$ and $\Phi_y=N$ for an exact equation.'
      examples:
      - 'The curves $\Phi(x,y)=C$ give the implicit solution.'
      aliases: &id012 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t12-d
        type: typed
        prompt: What term names the function whose level curves solve an exact equation?
        answer:
          expected: potential function
          aliases: *id012
          media: []
        explanation: |-
          Solution: potential function

          Why it works: A scalar function $\Phi$ satisfying $\Phi_x=M$ and $\Phi_y=N$ for an exact equation.
    - id: t13
      term: integrating factor of x
      definition: 'A multiplier $\mu(x)$ determined by a diagnostic ratio depending only on $x$.'
      examples:
      - 'If $(M_y-N_x)/N=r(x)$, use $e^{\int r(x)dx}$.'
      aliases: &id013
      - integrating factor depending on x
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t13-d
        type: typed
        prompt: What kind of multiplier is supported when the exactness diagnostic depends only on the independent
          variable?
        answer:
          expected: integrating factor of x
          aliases: *id013
          media: []
        explanation: |-
          Solution: integrating factor of x

          Why it works: A multiplier $\mu(x)$ determined by a diagnostic ratio depending only on $x$.
    - id: t14
      term: integrating factor of y
      definition: 'A multiplier $\mu(y)$ determined by a diagnostic ratio depending only on $y$.'
      examples:
      - 'If $(N_x-M_y)/M=s(y)$, use $e^{\int s(y)dy}$.'
      aliases: &id014
      - integrating factor depending on y
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t14-d
        type: typed
        prompt: What kind of multiplier is supported when the diagnostic depends only on the dependent variable?
        answer:
          expected: integrating factor of y
          aliases: *id014
          media: []
        explanation: |-
          Solution: integrating factor of y

          Why it works: A multiplier $\mu(y)$ determined by a diagnostic ratio depending only on $y$.
    - id: t15
      term: initial-value problem
      definition: A differential equation paired with a value such as $y(x_0)=y_0$ that selects a solution.
      examples:
      - $y'+y=0$, $y(0)=2$ selects $2e^{-x}$.
      aliases: &id015
      - IVP
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t15-d
        type: typed
        prompt: What term names an equation together with starting data?
        answer:
          expected: initial-value problem
          aliases: *id015
          media: []
        explanation: |-
          Solution: initial-value problem

          Why it works: A differential equation paired with a value such as $y(x_0)=y_0$ that selects a solution.
    - id: t16
      term: valid interval
      definition: A connected interval containing the initial point on which coefficients, transformations, and
        the solution remain valid.
      examples:
      - For a coefficient $1/x$ and $x_0=2$, the interval cannot cross zero.
      aliases: &id016
      - interval of validity
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t16-d
        type: typed
        prompt: What term names the connected domain on which all method assumptions and the solution hold?
        answer:
          expected: valid interval
          aliases: *id016
          media: []
        explanation: |-
          Solution: valid interval

          Why it works: A connected interval containing the initial point on which coefficients, transformations, and the solution remain valid.
    - id: t17
      term: standard linear form
      definition: The normalized form $y'+p(x)y=q(x)$ obtained after making the coefficient of $y'$ equal to one.
      examples:
      - Divide $xy'+2y=x^2$ by $x$ on an interval avoiding zero.
      aliases: &id017 []
      media: []
      tags:
      - ede-ch02-first-order-equations
      drills:
      - id: t17-d
        type: typed
        prompt: What term names the normalized form used before constructing a linear integrating factor?
        answer:
          expected: standard linear form
          aliases: *id017
          media: []
        explanation: |-
          Solution: standard linear form

          Why it works: The normalized form $y'+p(x)y=q(x)$ obtained after making the coefficient of $y'$ equal to one.
