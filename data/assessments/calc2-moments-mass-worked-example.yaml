workedExamples:
- id: 1d-rod
  title: Center of Mass of a 1D Rod with Variable Density
  problem: 'A rod of length 2 meters lies on the x-axis from $x=0$ to $x=2$. Its linear
    density is given by $\rho(x) = 1 + 2x$ kg/m. Find the center of mass $\b\bar{x}$.

    '
  steps:
  - id: step-1d-rod-1
    title: Find the total mass
    type: freeResponse
    skills:
    - moments-mass
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ m = \int_0^2 \rho(x)\,dx = \int_0^2 (1 + 2x)\,dx $$

      $$ m = \left[ x + x^2 \right]_0^2 = 2 + 4 = 6 \text{ kg} $$

      '
  - id: step-1d-rod-2
    title: Find the moment M
    type: freeResponse
    skills:
    - moments-mass
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ M = \int_0^2 x \rho(x)\,dx = \int_0^2 x(1 + 2x)\,dx = \int_0^2
      (x + 2x^2)\,dx $$

      $$ M = \left[ \frac{x^2}{2} + \frac{2x^3}{3} \right]_0^2 = \frac{4}{2} + \frac{16}{3}
      = 2 + \frac{16}{3} = \frac{22}{3} $$

      '
  - id: step-1d-rod-3
    title: Find the center of mass
    type: freeResponse
    skills:
    - moments-mass
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ \b\bar{x} = \frac{M}{m} = \frac{22/3}{6} = \frac{22}{18} = \frac{11}{9}
      \a\approx 1.22 \text{ m} $$


      Notice that the center of mass is slightly to the right of the middle ($x=1$),
      because the density increases as $x$ increases!

      '
  check:
    id: 1d-rod-check
    type: numericResponse
    skills:
    - moments-mass
    prompt: What would the mass $m$ be if the density was just $\rho(x) = x^2$?
    answer:
      value: 2.666
      tolerance: 0.1
    explanation: '$m = \int_0^2 x^2 dx = [x^3/3]_0^2 = 8/3 \a\approx 2.666$.

      '
- id: 2d-centroid
  title: Centroid of a Planar Region
  problem: 'Find the centroid $(\b\bar{x}, \b\bar{y})$ of the region bounded by $y = \sqrt{x}$
    and $y = x^2$.

    '
  steps:
  - id: step-2d-centroid-1
    title: Find the Area
    type: freeResponse
    skills:
    - moments-mass
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'The curves intersect at $x=0$ and $x=1$. On $[0, 1]$, $\sqrt{x}
      > x^2$.


      $$ A = \int_0^1 (\sqrt{x} - x^2)\,dx = \left[ \frac{2}{3}x^{3/2} - \frac{x^3}{3}
      \right]_0^1 = \frac{2}{3} - \frac{1}{3} = \frac{1}{3} $$

      '
  - id: step-2d-centroid-2
    title: Find My (Moment about y-axis)
    type: freeResponse
    skills:
    - moments-mass
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ M_y = \int_0^1 x(\sqrt{x} - x^2)\,dx = \int_0^1 (x^{3/2} - x^3)\,dx
      $$

      $$ M_y = \left[ \frac{2}{5}x^{5/2} - \frac{x^4}{4} \right]_0^1 = \frac{2}{5}
      - \frac{1}{4} = \frac{8}{20} - \frac{5}{20} = \frac{3}{20} $$

      '
  - id: step-2d-centroid-3
    title: Find Mx (Moment about x-axis)
    type: freeResponse
    skills:
    - moments-mass
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ M_x = \frac{1}{2} \int_0^1 \left( (\sqrt{x})^2 - (x^2)^2 \right)\,dx
      = \frac{1}{2} \int_0^1 (x - x^4)\,dx $$

      $$ M_x = \frac{1}{2} \left[ \frac{x^2}{2} - \frac{x^5}{5} \right]_0^1 = \frac{1}{2}
      \left( \frac{1}{2} - \frac{1}{5} \right) = \frac{1}{2} \left( \frac{3}{10} \right)
      = \frac{3}{20} $$

      '
  - id: step-2d-centroid-4
    title: Find centroid coordinates
    type: freeResponse
    skills:
    - moments-mass
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ \b\bar{x} = \frac{M_y}{A} = \frac{3/20}{1/3} = \frac{9}{20} = 0.45
      $$

      $$ \b\bar{y} = \frac{M_x}{A} = \frac{3/20}{1/3} = \frac{9}{20} = 0.45 $$


      Centroid is $(0.45, 0.45)$.

      '
  check:
    id: 2d-centroid-check
    type: multipleChoice
    skills:
    - moments-mass
    prompt: Was it necessary to calculate $\b\bar{y}$ from scratch for this specific
      problem?
    choices:
    - id: a
      text: No, because the region bounded by $y=\sqrt{x}$ and $y=x^2$ is perfectly
        symmetric across the line $y=x$.
    - id: b
      text: Yes, $\b\bar{x}$ and $\b\bar{y}$ are never the same unless calculated individually.
    - id: c
      text: No, because the limits of integration were $0$ and $1$.
    answer:
      choiceId: a
    explanation: 'Because the two functions are inverses of each other, the area is
      symmetric across $y=x$. This means $\b\bar{x}$ must equal $\b\bar{y}$. Recognizing
      symmetry can save a lot of work!

      '
