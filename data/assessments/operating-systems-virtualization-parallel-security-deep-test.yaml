questions:
- id: q001
  title: 'Virtualization and the Cloud: Virtual machine boundary'
  type: multipleChoice
  prompt: In a design review, which statement best applies **Virtual machine boundary**?
  choices:
  - id: a
    text: The guest sees a machine abstraction.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'The guest sees a machine abstraction. Related topic: Virtualization and the Cloud.'
