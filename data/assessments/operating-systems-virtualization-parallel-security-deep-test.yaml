- id: q010
  title: Virtualization and the Cloud Tradeoff
  type: freeResponse
  prompt: Explain one tradeoff in Virtualization and the Cloud using a concrete OS mechanism.
  answer:
    expected: A strong answer names a mechanism in Virtualization and the Cloud, identifies the resource or boundary it controls, and explains what benefit is gained and what cost or risk appears.
    gradingMode: selfCheck
    keyPoints:
    - Names mechanism
    - Identifies resource or boundary
    - Explains benefit
    - Explains cost or risk
  explanation: OS design is tradeoff-heavy; Virtualization and the Cloud should be explained through mechanism and consequence.
