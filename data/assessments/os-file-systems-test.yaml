questions:
- id: q001
  title: Recognize File abstraction
  type: multipleChoice
  prompt: 'Which statement best describes **File abstraction** in operating systems?

    '
  choices:
  - id: a
    text: A file abstracts persistent data behind names, attributes, operations, and access rules.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'A file abstracts persistent data behind names, attributes, operations, and access rules. The distractors either
    ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q002
  title: Recognize Directory hierarchy
  type: multipleChoice
  prompt: 'Which statement best describes **Directory hierarchy** in operating systems?

    '
  choices:
