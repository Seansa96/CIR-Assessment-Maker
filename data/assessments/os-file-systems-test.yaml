    '
- id: q004
  title: Explain Directory implementation
  type: freeResponse
  prompt: 'In a short answer, explain why **Directory implementation** matters in File Systems.

    '
  answer:
    expected: 'Directories are data structures mapping names to file metadata references. A complete answer should also note
      that a directory entry is not necessarily the entire file metadata.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Directory implementation
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: File Systems. The key is to connect the term to what the OS controls or protects.

    '
