  - id: b
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  - id: c
    text: It removes the need for explicit policies, permissions, or resource-management decisions.
  - id: d
    text: Directories organize file names into a navigable namespace.
  answer:
    choiceId: d
  explanation: 'Directories organize file names into a navigable namespace. The distractors either ignore the OS boundary
    or confuse a design tradeoff with a universal rule.

    '
- id: q003
  title: Recognize File allocation
  type: multipleChoice
  prompt: 'Which statement best describes **File allocation** in operating systems?

    '
  choices:
