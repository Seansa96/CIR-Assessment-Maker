questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Look at this method:
      
      ```csharp
      public void DoubleDamage(ref int damage)
      {
          damage = damage * 2;
      }
      ```
      
      And the caller:
      ```csharp
      int baseAtk = 15;
      DoubleDamage(ref baseAtk);
      ```
      
      What is the value of `baseAtk` after the method executes?
    choices:
      - id: a
        text: '`15`'
      - id: b
        text: '`30`'
      - id: c
        text: 'A compiler error occurs because `DoubleDamage` is `void` and cannot modify variables.'
      - id: d
        text: 'An error occurs because you cannot pass variables starting with `ref`.'
    answer:
      choiceId: b
    explanation: |
      Because we used `ref`, we passed a reference to the actual `baseAtk` variable. When the method multiplied `damage` by 2, it directly modified `baseAtk`, changing it to 30.

  - id: q002
    type: multipleChoice
    prompt: |
      You want to create a method that calculates the total cost of items and returns that number. Which signature is correct?
    choices:
      - id: a
        text: '`public void GetTotalCost(int price, int quantity)`'
      - id: b
        text: '`public int GetTotalCost(int price, int quantity)`'
      - id: c
        text: '`public return GetTotalCost(int price, int quantity)`'
      - id: d
        text: '`public GetTotalCost(int price, int quantity) -> int`'
    answer:
      choiceId: b
    explanation: |
      The return type (`int`) must be specified right before the method name. Option A uses `void` (returns nothing). Option D uses Python/Rust style typing.

  - id: q003
    type: multipleChoice
    prompt: |
      Examine the following code:
      
      ```csharp
      public void Defend() { Console.WriteLine("Defending!"); }
      public void Defend(string shieldType) { Console.WriteLine($"Defending with {shieldType}!"); }
      public int Defend() { return 5; }
      ```
      
      Why will this code cause a compiler error?
    choices:
      - id: a
        text: The first and second methods have the same name.
      - id: b
        text: The first and third methods have the exact same parameters (none).
      - id: c
        text: The second method takes a string instead of an int.
      - id: d
        text: You cannot use `Console.WriteLine` inside overloaded methods.
    answer:
      choiceId: b
    explanation: |
      You cannot overload a method simply by changing its return type (from `void` to `int`). The compiler looks at the method name and parameters. Because both the first and third methods take zero arguments, the compiler doesn't know which one to call if you type `Defend()`.

  - id: q004
    type: numericResponse
    prompt: |
      Trace this TryParse block:
      
      ```csharp
      int gold = 50;
      string input = "20";
      
      if (int.TryParse(input, out int parsedInput))
      {
          gold += parsedInput;
      }
      else
      {
          gold -= 10;
      }
      ```
      
      What is the final value of `gold`?
    answer:
      value: 70
      tolerance: 0
    explanation: |
      `"20"` is successfully parsed into the integer `20`. `TryParse` returns `true`, and `parsedInput` is set to `20`. The `if` block executes, adding 20 to the 50 gold. The total is `70`.
