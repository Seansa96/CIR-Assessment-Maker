schemaVersion: 1
id: python-basic-file-io-worked-example
title: Python Basic File I/O Worked Example
assessmentType: workedExample
categoryId: python
subcategoryIds:
- python-file-io
modeDefault: practice
randomizeQuestions: false
workedExamples:
- id: we001
  title: Reading text from a file safely
  problem: Plan\rhow to open a text file, read its contents, and make sure the file
    is closed.
  steps:
  - id: step-we001-1
    title: Identify the file path
    instruction: File I/O starts with knowing which file should be opened.
    type: multipleChoice
    prompt: Which value usually tells `open()` which file to read?
    choices:
    - id: a
      text: A file path string, such as `'notes.txt'`.
    - id: b
      text: The final line of the file.
    - id: c
      text: The number of characters in the file.
    - id: d
      text: The Python version.
    answer:
      choiceId: a
    hint: The path is the address of the file.
    explanation: |
      `open()` needs a path so Python knows which file to access.

      Related topic: File paths; choose the path first, then choose the mode such as read or write.
  - id: step-we001-2
    title: Choose read mode
    instruction: The file mode controls whether you read, write, append, or create
      data.
    type: multipleChoice
    prompt: Which mode opens an existing file for reading text?
    choices:
    - id: a
      text: '`''r''`'
    - id: b
      text: '`''w''`'
    - id: c
      text: '`''a''`'
    - id: d
      text: '`''x''`'
    answer:
      choiceId: a
    hint: Think `r` for read.
    explanation: |
      Mode `'r'` opens a file for reading. Mode `'w'` writes and can overwrite existing contents, while `'a'` appends.

      Related topic: File modes; match the mode to the intended operation before touching the file.
  - id: step-we001-3
    title: Use a context manager
    instruction: Python's `with` statement is the usual way to ensure a file is closed
      automatically.
    type: multipleChoice
    prompt: Why is `with open(path, 'r') as file:` usually preferred?
    choices:
    - id: a
      text: It automatically closes the file when the block ends.
    - id: b
      text: It prevents the file from being read.
    - id: c
      text: It changes the file path.
    - id: d
      text: It turns text into a socket.
    answer:
      choiceId: a
    hint: The key benefit is cleanup.
    explanation: |
      A context manager closes the file when execution leaves the `with` block, even if an error occurs inside the block.

      Related topic: Context managers; use `with` for resources that need cleanup, such as files.
  - id: step-we001-4
    title: Read the contents
    instruction: Inside the `with` block, call a method on the file object.
    type: selectAll
    prompt: Which are common ways to read from a file object?
    choices:
    - id: a
      text: '`file.read()`'
    - id: b
      text: '`file.readline()`'
    - id: c
      text: '`file.readlines()`'
    - id: d
      text: '`file.socket()`'
    answer:
      choiceIds:
      - a
      - b
      - c
    hint: Reading methods usually include the word `read`.
    explanation: |
      `read()` gets the whole file as one string, `readline()` gets one line, and `readlines()` gets a list of lines.

      Related topic: File read methods; choose whole-file, one-line, or line-list reading based on what the next step needs.
  - id: step-we001-5
    title: Assemble the pattern
    instruction: Now write the safe read pattern.
    type: freeResponse
    prompt: |
      Write or describe the standard pattern for opening `path` in read mode and storing the whole file text in a variable named `contents`.
    answer:
      expected: 'Use `with open(path, ''r'') as file:` and inside the block assign
        `contents = file.read()`.

        '
      gradingMode: selfCheck
      keyPoints:
      - Use `with open(...) as file:`.
      - Use read mode `'r'`.
      - Call `file.read()` inside the block.
      - Store the returned string in `contents`.
    hint: The line inside the block should call `file.read()`.
    explanation: |
      The core pattern is:

      ```python
      with open(path, 'r') as file:
          contents = file.read()
      ```

      Related topic: Safe file reading; open the path with read mode, read inside the context manager, and let `with` close the file.
