  introduction: Mass and Weight
  sections:
  - id: sec-q001
    title: An astronaut has a mass of 80 kg on Earth. What is his mass on the Moon,
      where gravity is about $1/6$th that of Earth?
    content: |
      An astronaut has a mass of 80 kg on Earth. What is his mass on the Moon, where gravity is about $1/6$th that of Earth?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: 80 kg
      - id: b
        text: 13.3 kg
      - id: c
        text: 480 kg
      - id: d
        text: 0 kg
      answer:
        choiceId: a
      explanation: |
        Mass is an intrinsic property that represents the amount of matter (inertia). It does not depend on the local gravitational field. His weight changes, but his mass remains 80 kg.
