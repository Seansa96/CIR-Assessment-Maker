sections:
- id: mass
  title: Mass
  content: '**Mass ($m$)** is a fundamental property of an object. It represents the
    amount of matter in the object, but in the context of Newton''s Laws, it represents
    **inertia** — the object''s resistance to a change in its state of motion.


    * **Units:** Kilograms (kg)

    * **Properties:** Mass is a scalar quantity. It does not change regardless of
    the object''s location in the universe (assuming non-relativistic speeds). A 10
    kg block on Earth is also 10 kg on the Moon.

    '
- id: weight
  title: Weight
  content: '**Weight ($W$ or $F_g$)** is the force exerted on an object due to gravity.
    Because it is a force, it depends on the local gravitational field $g$.


    $$ W = m g $$


    * **Units:** Newtons (N)

    * **Properties:** Weight is a vector quantity, always pointing toward the center
    of the massive body creating the gravity (usually straight "down"). Since $g$
    varies by location (e.g., $g \a\approx 9.8$ m/s² on Earth but $g \a\approx 1.6$ m/s²
    on the Moon), an object''s weight changes depending on where it is, even though
    its mass remains constant.

    '
- id: apparent-weight
  title: Apparent Weight
  content: '**Apparent Weight** is the magnitude of the normal force (or tension)
    supporting an object. When you stand on a scale, it measures the normal force
    pushing up on you, not your true weight.


    If you are accelerating upward (like in an elevator starting to go up), the normal
    force must be *greater* than your true weight to provide the net upward force,
    making you feel "heavier".

    $$ F_{net} = N - mg = ma \implies N = m(g+a) $$


    If you are in free-fall, the normal force is zero, making your apparent weight
    zero (weightlessness), even though gravity is still pulling on your mass!

    '
lesson:
  introduction: Mass and Weight
  sections:
  - id: sec-q001
    title: An astronaut has a mass of 80 kg on Earth. What is his mass on the Moon,
      where gravity is about $1/6$th that of Earth?
    content: |
      An astronaut has a mass of 80 kg on Earth. What is his mass on the Moon, where gravity is about $1/6$th that of Earth?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: 80 kg
      - id: b
        text: 13.3 kg
      - id: c
        text: 480 kg
      - id: d
        text: 0 kg
      answer:
        choiceId: a
      explanation: |
        Mass is an intrinsic property that represents the amount of matter (inertia). It does not depend on the local gravitational field. His weight changes, but his mass remains 80 kg.
  - id: mw2
    title: Weight Is a Force
    content: 'Weight is gravitational force, $W=mg$, and is measured in newtons.'
    media: []
    check: { id: mwc2, type: multipleChoice, prompt: 'What units measure weight?', choices: [{ id: a, text: newtons }, { id: b, text: kilograms }, { id: c, text: meters }, { id: d, text: seconds }], answer: { choiceId: a }, explanation: 'Solution: Newtons.\n\nWhy it works: Weight is a force.\n\nWhy the other choices fail: Kilograms measure mass, not force.' }
  - id: mw3
    title: Mass Versus Weight
    content: 'Mass stays constant between locations, while weight changes whenever local gravitational field strength changes.'
    media: []
    check: { id: mwc3, type: multipleChoice, prompt: 'On the Moon, an astronaut''s mass is:', choices: [{ id: a, text: unchanged }, { id: b, text: one sixth }, { id: c, text: zero }, { id: d, text: six times larger }], answer: { choiceId: a }, explanation: 'Solution: Unchanged.\n\nWhy it works: Mass is intrinsic.\n\nWhy the other choices fail: Only weight scales with local gravity.' }
  - id: mw4
    title: Gravitational Field Strength
    content: 'Near Earth, $g\approx9.8\ \mathrm{m/s^2}$, so a mass $m$ has weight $mg$.'
    media: []
    check: { id: mwc4, type: multipleChoice, prompt: 'What is the weight of a 2.0 kg object near Earth?', choices: [{ id: a, text: '$19.6$ N' }, { id: b, text: '$2.0$ N' }, { id: c, text: '$9.8$ N' }, { id: d, text: '$4.9$ N' }], answer: { choiceId: a }, explanation: 'Solution: $W=mg=2.0(9.8)=19.6$ N.\n\nWhy it works: Weight is mass times field strength.\n\nWhy the other choices fail: They omit mass or use the wrong operation.' }
  - id: mw5
    title: Apparent Weight
    content: 'A scale measures normal force, called apparent weight, rather than gravitational force directly.'
    media: []
    check: { id: mwc5, type: multipleChoice, prompt: 'A bathroom scale measures:', choices: [{ id: a, text: normal force }, { id: b, text: mass directly }, { id: c, text: gravity only }, { id: d, text: velocity }], answer: { choiceId: a }, explanation: 'Solution: Normal force.\n\nWhy it works: The scale pushes upward on the person.\n\nWhy the other choices fail: It infers mass or weight through that contact force.' }
  - id: mw6
    title: Elevator Acceleration
    content: 'With upward positive, $N-mg=ma$, so upward acceleration makes apparent weight greater than true weight.'
    media: []
    check: { id: mwc6, type: multipleChoice, prompt: 'An upward-accelerating elevator makes apparent weight:', choices: [{ id: a, text: greater }, { id: b, text: smaller }, { id: c, text: zero always }, { id: d, text: massless }], answer: { choiceId: a }, explanation: 'Solution: Greater.\n\nWhy it works: The normal force must exceed weight to accelerate upward.\n\nWhy the other choices fail: Lower normal force corresponds to downward acceleration.' }
  - id: mw7
    title: Free Fall
    content: 'In free fall, normal force is zero, so apparent weight is zero even though gravity still acts.'
    media: []
    check: { id: mwc7, type: multipleChoice, prompt: 'In ideal free fall, apparent weight is:', choices: [{ id: a, text: zero }, { id: b, text: $mg$ }, { id: c, text: negative mass }, { id: d, text: infinite }], answer: { choiceId: a }, explanation: 'Solution: Zero.\n\nWhy it works: There is no supporting normal force.\n\nWhy the other choices fail: Gravity remains, but scales measure support force.' }
