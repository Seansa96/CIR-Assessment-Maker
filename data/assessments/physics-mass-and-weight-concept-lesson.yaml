sections:
- id: mass
  title: Mass
  content: '**Mass ($m$)** is a fundamental property of an object. It represents the
    amount of matter in the object, but in the context of Newton''s Laws, it represents
    **inertia** — the object''s resistance to a change in its state of motion.


    * **Units:** Kilograms (kg)

    * **Properties:** Mass is a scalar quantity. It does not change regardless of
    the object''s location in the universe (assuming non-relativistic speeds). A 10
    kg block on Earth is also 10 kg on the Moon.

    '
- id: weight
  title: Weight
  content: '**Weight ($W$ or $F_g$)** is the force exerted on an object due to gravity.
    Because it is a force, it depends on the local gravitational field $g$.


    $$ W = m g $$


    * **Units:** Newtons (N)

    * **Properties:** Weight is a vector quantity, always pointing toward the center
    of the massive body creating the gravity (usually straight "down"). Since $g$
    varies by location (e.g., $g \a\approx 9.8$ m/s² on Earth but $g \a\approx 1.6$ m/s²
    on the Moon), an object''s weight changes depending on where it is, even though
    its mass remains constant.

    '
- id: apparent-weight
  title: Apparent Weight
  content: '**Apparent Weight** is the magnitude of the normal force (or tension)
    supporting an object. When you stand on a scale, it measures the normal force
    pushing up on you, not your true weight.


    If you are accelerating upward (like in an elevator starting to go up), the normal
    force must be *greater* than your true weight to provide the net upward force,
    making you feel "heavier".

    $$ F_{net} = N - mg = ma \implies N = m(g+a) $$


    If you are in free-fall, the normal force is zero, making your apparent weight
    zero (weightlessness), even though gravity is still pulling on your mass!

    '
