  prompt: The projected motion of a point on a wheel has angular frequency 8.00 rad/s. What is its period in seconds?
  answer:
    value: 0.785398
    tolerance: 0.0079
  explanation: 'Solution: One revolution corresponds to one SHM cycle, so $T=2\pi/\omega$.


