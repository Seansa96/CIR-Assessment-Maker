  prompt: A rotating marker completes 90.0 revolutions each minute. What is the angular frequency of its projected SHM in rad/s?
  answer:
    value: 9.424778
    tolerance: 0.0943
  explanation: 'Solution: Convert to $f=90.0/60.0$ Hz and use $\omega=2\pi f$.


