navigation: { learningGoal: learn, activityType: glossary, tags: [chemistry, chem-molecular-shapes] }
authoring: { visualRequirement: required, visualRationale: 'Geometry terms are tied to the visual atlas and positional maps.', sourceId: src-20260720035703-91ea51b0d8 }
glossary:
  introduction: 'Use these terms to keep domain counting, spatial arrangement, and atoms-only naming separate.'
  sections:
    - id: foundations
      title: Domain and naming foundations
      entries:
        - { id: electron-domain, term: electron domain, definition: 'One bond direction or one lone pair around the selected atom.', drills: [{ id: d1, type: flashcard, prompt: 'How many domains does one double bond contribute?', answer: { expected: 'one', aliases: ['1', 'one domain'] }, explanation: 'Solution: One domain. Why it works: A multiple bond occupies one direction around the center.' }] }
        - { id: bonding-domain, term: bonding domain, definition: 'A region of electron density connecting the selected atom to another atom.', drills: [{ id: d2, type: flashcard, prompt: 'What central feature creates a bonding domain?', answer: { expected: 'a bond to another atom', aliases: ['a bond direction'] }, explanation: 'Solution: A bond to another atom. Why it works: VSEPR counts the direction as one region.' }] }
        - { id: lone-pair-domain, term: lone-pair domain, definition: 'A nonbonding electron pair localized on the selected atom and counted in electron geometry.', drills: [{ id: d3, type: flashcard, prompt: 'Is a central lone pair included in electron-domain geometry?', answer: { expected: 'yes' }, explanation: 'Solution: Yes. Why it works: Electron geometry includes every central domain.' }] }
        - { id: electron-geometry, term: electron-domain geometry, definition: 'The arrangement of all bonding and lone-pair domains around a selected atom.', drills: [{ id: d4, type: flashcard, prompt: 'Which geometry name includes lone-pair positions?', answer: { expected: 'electron-domain geometry', aliases: ['electron geometry'] }, explanation: 'Solution: Electron-domain geometry. Why it works: It describes all regions, not only atoms.' }] }
        - { id: molecular-geometry, term: molecular geometry, definition: 'The arrangement of bonded atom positions around a selected atom, omitting lone-pair positions.', drills: [{ id: d5, type: flashcard, prompt: 'Which positions are omitted from a molecular-geometry name?', answer: { expected: 'lone-pair positions', aliases: ['lone pairs'] }, explanation: 'Solution: Lone-pair positions. Why it works: Molecular geometry names atoms only.' }] }
        - { id: axe-notation, term: AXE notation, definition: 'A local notation in which A is the center, X counts bonded atoms, and E counts central lone pairs.', drills: [{ id: d6, type: flashcard, prompt: 'What does E count in AXE notation?', answer: { expected: 'central lone pairs', aliases: ['lone pairs on the central atom'] }, explanation: 'Solution: Central lone pairs. Why it works: X and E separate atom and nonbonding positions.' }] }
    - id: geometry-families
      title: Geometry families and positions
      entries:
        - { id: linear, term: linear geometry, definition: 'A two-direction arrangement with an ideal angle of 180 degrees.', drills: [{ id: d7, type: flashcard, prompt: 'What ideal angle belongs to a linear arrangement?', answer: { expected: '180 degrees', aliases: ['180'] }, explanation: 'Solution: 180 degrees. Why it works: The two directions are opposite.' }] }
        - { id: trigonal-planar, term: trigonal-planar geometry, definition: 'A three-domain planar arrangement with ideal 120-degree separations.', drills: [{ id: d8, type: flashcard, prompt: 'How many domains define trigonal planar?', answer: { expected: 'three', aliases: ['3'] }, explanation: 'Solution: Three. Why it works: Three equal planar directions minimize repulsion.' }] }
        - { id: tetrahedral, term: tetrahedral geometry, definition: 'A four-domain three-dimensional arrangement with ideal angles near 109.5 degrees.', drills: [{ id: d9, type: flashcard, prompt: 'What ideal angle belongs to a tetrahedral arrangement?', answer: { expected: '109.5 degrees', aliases: ['109.5'] }, explanation: 'Solution: 109.5 degrees. Why it works: Four directions point toward tetrahedron vertices.' }] }
        - { id: trigonal-bipyramidal, term: trigonal-bipyramidal geometry, definition: 'A five-domain arrangement with three equatorial and two axial sites.', drills: [{ id: d10, type: flashcard, prompt: 'How many axial and equatorial sites are present?', answer: { expected: 'two axial and three equatorial', aliases: ['2 axial 3 equatorial'] }, explanation: 'Solution: Two axial and three equatorial. Why it works: The equatorial sites form a plane and the axial sites lie above and below it.' }] }
        - { id: axial, term: axial position, definition: 'One of two opposite sites perpendicular to the equatorial plane in a trigonal bipyramid.', drills: [{ id: d11, type: flashcard, prompt: 'How many 90-degree interactions does an axial site have?', answer: { expected: 'three', aliases: ['3'] }, explanation: 'Solution: Three. Why it works: Each axial site is perpendicular to all three equatorial sites.' }] }
        - { id: equatorial, term: equatorial position, definition: 'One of three coplanar sites separated by 120 degrees in a trigonal bipyramid.', drills: [{ id: d12, type: flashcard, prompt: 'Why does a lone pair favor an equatorial site?', answer: { expected: 'it has fewer 90-degree interactions', aliases: ['two rather than three 90-degree interactions'] }, explanation: 'Solution: It has fewer 90-degree interactions. Why it works: Reduced close repulsion stabilizes the larger lone-pair domain.' }] }
        - { id: octahedral, term: octahedral geometry, definition: 'A six-domain arrangement with adjacent sites at 90 degrees and opposite sites at 180 degrees.', drills: [{ id: d13, type: flashcard, prompt: 'How many domains define an octahedral arrangement?', answer: { expected: 'six', aliases: ['6'] }, explanation: 'Solution: Six. Why it works: Six directions point toward octahedron vertices.' }] }
        - { id: square-planar, term: square-planar geometry, definition: 'The AX4E2 molecular geometry left by two opposite lone pairs in an octahedral arrangement.', drills: [{ id: d14, type: flashcard, prompt: 'Which AXE pattern commonly gives square planar?', answer: { expected: 'AX4E2', aliases: ['AX₄E₂'] }, explanation: 'Solution: AX$_4$E$_2$. Why it works: Two opposite lone pairs leave four coplanar atom sites.' }] }
    - id: reasoning
      title: Refinement and transfer
      entries:
        - { id: bond-angle-distortion, term: bond-angle distortion, definition: 'A departure from ideal angles caused by unequal domain repulsions.', drills: [{ id: d15, type: flashcard, prompt: 'What usually happens to adjacent bond angles as central lone pairs are added?', answer: { expected: 'they decrease', aliases: ['they compress', 'become smaller'] }, explanation: 'Solution: They usually decrease. Why it works: Lone-pair domains repel adjacent bonding domains strongly.' }] }
        - { id: local-geometry, term: local geometry, definition: 'The VSEPR geometry determined around one selected atom in a multicenter molecule.', drills: [{ id: d16, type: flashcard, prompt: 'How is a multicenter molecule analyzed with VSEPR?', answer: { expected: 'one center at a time', aliases: ['analyze each local center separately'] }, explanation: 'Solution: One center at a time. Why it works: Each center has its own domain inventory.' }] }
