glossary:
  introduction: |-
    These terms describe both the parts of exponent and logarithm notation and the restrictions that make transformations valid. Learn each term together with its mathematical consequence.
  sections:
  - id: exponent-and-radical-terms
    title: Exponent and Radical Terms
    required: true
    content: |-
      Exponent notation records repeated multiplication and its consistent extensions. Radical notation represents roots, with sign conventions that matter when variables may be negative.
    entries:
    - id: exponent
      term: Exponent
      definition: |-
        The number indicating a power. For a positive integer $n$, the exponent in $a^n$ records that $a$ is used as a factor $n$ times. Zero, negative, and rational exponents extend this meaning while preserving the exponent laws.
      notation: '$a^n$'
      examples:
      - 'In $5^3$, the exponent 3 records three factors of 5.'
      aliases:
      - power
      media: []
      tags: [exponent, exponent-laws]
      drills:
      - id: exponent-meaning-drill
        type: typed
        prompt: In $7^4$, what is the name of the number 4?
        answer:
          expected: exponent
          aliases: [power]
        explanation: The exponent specifies the power to which the base is raised.
        tags: [exponent]
    - id: base
      term: Base
      definition: |-
        The quantity being raised to a power. Exponent product and quotient laws combine powers only when their bases are the same.
      notation: '$a$ in $a^n$'
      examples:
      - 'Rewriting 8 and 4 with the common base 2 makes their powers comparable.'
      aliases: []
      media: []
      tags: [base, common-base]
      drills:
      - id: base-recognition-drill
        type: typed
        prompt: In $3^{2x+1}$, what is the base?
        answer:
          expected: '3'
          aliases: [three]
        explanation: The entire exponent is $2x+1$, while 3 is the base.
        tags: [base]
    - id: negative-exponent
      term: Negative Exponent
      definition: |-
        An exponent that denotes a reciprocal: for $a\ne0$, $a^{-n}=1/a^n$. The negative sign belongs to the exponent and does not make the value negative.
      notation: '$a^{-n}$'
      examples:
      - '$2^{-3}=1/8$.'
      aliases: [reciprocal exponent]
      media: []
      tags: [negative-exponent, reciprocal]
      drills:
      - id: negative-exponent-drill
        type: symbolic
        prompt: Rewrite $x^{-5}$ without a negative exponent.
        answer:
          expectedLatex: '\frac{1}{x^5}'
          aliases: ['\frac{1}{x^5}']
        explanation: A negative exponent moves the power across the fraction bar.
        tags: [negative-exponent]
    - id: rational-exponent
      term: Rational Exponent
      definition: |-
        An exponent of the form $p/q$. The denominator $q$ specifies a $q$th root and the numerator $p$ specifies a power. Over the reals, an even root requires a nonnegative radicand.
      notation: '$a^{p/q}$'
      examples:
      - '$16^{3/4}=(\sqrt[4]{16})^3=8$.'
      aliases: [fractional exponent]
      media: []
      tags: [rational-exponent, fractional-exponent]
      drills:
      - id: rational-exponent-drill
        type: typed
        prompt: In $a^{3/5}$, which operation is indicated by the denominator 5?
        answer:
          expected: fifth root
          aliases: [take the fifth root, 5th root]
        explanation: The denominator of a rational exponent determines the root index.
        tags: [rational-exponent]
    - id: radicand-and-index
      term: Radicand and Index
      definition: |-
        In $\sqrt[n]{r}$, the radicand $r$ is the quantity under the radical sign and the index $n$ states which root is taken. A missing index means square root.
      notation: '$\sqrt[n]{r}$'
      examples:
      - 'In $\sqrt[3]{10}$, 10 is the radicand and 3 is the index.'
      aliases: [root index]
      media: []
      tags: [radicand, index, radical]
      drills:
      - id: radicand-index-drill
        type: typed
        prompt: What is the radicand in $\sqrt[4]{x+7}$?
        answer:
          expected: x+7
          aliases: ['$x+7$']
        explanation: The full expression under the radical bar is the radicand.
        tags: [radicand]
    - id: principal-square-root
      term: Principal Square Root
      definition: |-
        The nonnegative square root selected by the symbol $\sqrt{\phantom{x}}$. Consequently, $\sqrt{x^2}=|x|$ for real $x$.
      notation: '$\sqrt{x}$'
      examples:
      - '$\sqrt{(-6)^2}=6$, not $-6$.'
      aliases: [principal root]
      media: []
      tags: [principal-root, absolute-value]
      drills:
      - id: principal-root-drill
        type: symbolic
        prompt: Simplify $\sqrt{t^2}$ for real $t$.
        answer:
          expectedLatex: '\lvert t\rvert'
          aliases: ['\lvert t\rvert']
        explanation: The principal square root cannot be negative.
        tags: [principal-root]
    - id: conjugate
      term: Conjugate
      definition: |-
        For a binomial $u+v$, the conjugate is $u-v$, and conversely. Their product $u^2-v^2$ cancels the cross terms, which is useful for rationalizing radical denominators.
      notation: '$u+v\leftrightarrow u-v$'
      examples:
      - 'The conjugate of $3+\sqrt5$ is $3-\sqrt5$.'
      aliases: [binomial conjugate]
      media: []
      tags: [conjugate, rationalization]
      drills:
      - id: conjugate-drill
        type: symbolic
        prompt: Give the conjugate of $2-\sqrt7$.
        answer:
          expectedLatex: '2+\sqrt7'
          aliases: ['$2+\sqrt7$']
        explanation: Change the sign between the two terms.
        tags: [conjugate]
  - id: logarithm-and-solution-terms
    title: Logarithm and Solution Terms
    required: true
    content: |-
      A logarithm is an inverse-exponent statement. Its base and argument restrictions must be checked before applying logarithm laws or accepting solutions.
    entries:
    - id: logarithm
      term: Logarithm
      definition: |-
        The exponent required to produce a positive number from a valid base. The equation $\log_bx=y$ is equivalent to $b^y=x$, where $b>0$, $b\ne1$, and $x>0$.
      notation: '$\log_bx$'
      examples:
      - '$\log_2 32=5$ because $2^5=32$.'
      aliases: [log]
      media: []
      tags: [logarithm, inverse-operation]
      drills:
      - id: logarithm-definition-drill
        type: typed
        prompt: Rewrite $\log_3 81=4$ as an exponential equation.
        answer:
          expected: 3^4=81
          aliases: ['$3^4=81$']
        explanation: A logarithm states which exponent on the base produces the argument.
        tags: [logarithm]
    - id: logarithm-argument
      term: Logarithm Argument
      definition: |-
        The expression whose logarithm is taken. In real-number work, every logarithm argument must be strictly positive.
      notation: '$x$ in $\log_bx$'
      examples:
      - 'In $\log_5(2x-1)$, the argument is $2x-1$, so the domain requires $x>1/2$.'
      aliases: [argument]
      media: []
      tags: [logarithm-argument, domain]
      drills:
      - id: logarithm-argument-drill
        type: typed
        prompt: What inequality must hold for $\log_7(x-4)$ to be real?
        answer:
          expected: x>4
          aliases: ['$x>4$', 'x - 4 > 0']
        explanation: The argument $x-4$ must be positive.
        tags: [logarithm-argument]
    - id: change-of-base
      term: Change of Base
      definition: |-
        A formula that rewrites a logarithm using another valid logarithm base: $\log_bx=\log_kx/\log_kb$. It is useful when a calculator or known values support only another base.
      notation: '$\log_bx=\frac{\log_kx}{\log_kb}$'
      examples:
      - '$\log_4 7=\ln7/\ln4$.'
      aliases: [change-of-base formula]
      media: []
      tags: [change-of-base, logarithm]
      drills:
      - id: change-of-base-drill
        type: symbolic
        prompt: Rewrite $\log_5 11$ using natural logarithms.
        answer:
          expectedLatex: '\frac{\ln 11}{\ln 5}'
          aliases: ['\frac{\ln 11}{\ln 5}']
        explanation: Put the logarithm of the argument over the logarithm of the original base.
        tags: [change-of-base]
    - id: extraneous-solution
      term: Extraneous Solution
      definition: |-
        A candidate created by a nonreversible transformation, such as squaring, that does not satisfy the original equation or its domain.
      notation: null
      examples:
      - 'Squaring $\sqrt{x+5}=x-1$ produces $x=-1$ as a candidate, but it fails the original equation.'
      aliases: [extraneous root]
      media: []
      tags: [extraneous-solution, verification]
      drills:
      - id: extraneous-solution-drill
        type: typed
        prompt: What must be done with candidates obtained after squaring an equation?
        answer:
          expected: check them in the original equation
          aliases: [verify in the original equation, substitute into the original equation]
        explanation: Squaring may introduce candidates that were not solutions of the original equation.
        tags: [extraneous-solution]
