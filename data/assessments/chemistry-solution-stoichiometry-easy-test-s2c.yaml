questions:
  - { id: q001, type: freeResponse, prompt: 'Find moles in 250.0 mL of 0.120 M NaCl.', answer: { gradingMode: selfCheck, keyPoints: ['0.2500 L', '0.0300 mol'] }, explanation: 'Solution: n=MV=(0.120)(0.2500)=0.0300 mol. Why it works: mol/L times L gives mol. Common trap: Using 250.0 as liters.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Converts volume then applies molarity.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-MV-1, variationAxes: { givens: M and mL, unknown: moles } }
  - { id: q002, type: freeResponse, prompt: 'Find moles in 75.0 mL of 0.500 M KBr.', answer: { gradingMode: selfCheck, keyPoints: ['0.0750 L', '0.0375 mol'] }, explanation: 'Solution: n=(0.500)(0.0750)=0.0375 mol. Why it works: Convert mL to L before using n=MV. Common trap: Reporting 37.5 mol.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Uses unit conversion and molarity relation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-MV-2, variationAxes: { givens: M and mL, unknown: moles } }
  - { id: q003, type: freeResponse, prompt: 'For Ag+ + Cl−→AgCl(s), find AgCl moles from 0.0250 mol Ag+ with excess chloride.', answer: { gradingMode: selfCheck, keyPoints: ['0.0250 mol'] }, explanation: 'Solution: 0.0250 mol AgCl forms. Why it works: The net ionic coefficients are 1:1. Common trap: Multiplying by silver charge.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Reads 1:1 equation ratio.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-agcl-1to1, variationAxes: { scenario: silver precipitation, unknown: product moles } }
  - { id: q004, type: freeResponse, prompt: 'For Pb2+ + 2I−→PbI2(s), how many moles PbI2 form from 0.0600 mol I− with excess Pb2+?', answer: { gradingMode: selfCheck, keyPoints: ['0.0300 mol', 'divide by 2'] }, explanation: 'Solution: 0.0600 mol I−×(1 mol PbI2/2 mol I−)=0.0300 mol PbI2. Why it works: Two iodides are required per product unit. Common trap: Treating the equation as 1:1.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Applies a non-1:1 mole ratio.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-lead-iodide-ratio, variationAxes: { scenario: lead iodide, unknown: product moles } }
  - { id: q005, type: freeResponse, prompt: 'Find mass of 0.0200 mol AgCl using 143.32 g/mol.', answer: { gradingMode: selfCheck, keyPoints: ['2.87 g'] }, explanation: 'Solution: m=(0.0200)(143.32)=2.87 g. Why it works: Molar mass converts product moles to grams. Common trap: Dividing by molar mass.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Applies molar-mass conversion.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-product-mass, variationAxes: { givens: moles and molar mass, unknown: mass } }
  - { id: q006, type: freeResponse, prompt: 'Find moles Ba2+ in 50.0 mL 0.300 M BaCl2.', answer: { gradingMode: selfCheck, keyPoints: ['0.0150 mol Ba2+'] }, explanation: 'Solution: BaCl2 moles=(0.0500)(0.300)=0.0150 mol, and one Ba2+ occurs per formula unit. Why it works: The cation coefficient is one. Common trap: Multiplying by two chlorides.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Connects formula-unit moles to cation moles.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-barium-ion, variationAxes: { scenario: salt solution, unknown: cation moles } }
  - { id: q007, type: freeResponse, prompt: 'For Ca2+ + CO3 2−→CaCO3(s), which limits: 0.0100 mol Ca2+ or 0.0120 mol carbonate?', answer: { gradingMode: selfCheck, keyPoints: ['Ca2+'] }, explanation: 'Solution: Ca2+ limits because the ratio is 1:1 and it has fewer moles. Why it works: Compare moles against the balanced coefficients. Common trap: Comparing charge values.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Uses 1:1 stoichiometry to classify limiting reactant.', prerequisiteObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-test-stoich-limit-1to1, variationAxes: { scenario: carbonate precipitation, unknown: limiting reactant } }
  - { id: q008, type: freeResponse, prompt: 'For Fe3+ + 3OH−→Fe(OH)3(s), which limits: 0.0100 mol Fe3+ or 0.0200 mol OH−?', answer: { gradingMode: selfCheck, keyPoints: ['OH−', '0.0300 mol needed for all Fe3+'] }, explanation: 'Solution: OH− limits: 0.0100 mol Fe3+ needs 0.0300 mol OH−, but only 0.0200 mol is supplied. Why it works: Apply the 3:1 coefficient. Common trap: Choosing Fe3+ because its number is smaller.', difficultyDimensions: [auxiliaryTechnique, casePartition], difficultyEvidence: 'Uses a non-1:1 requirement to choose limiting branch.', prerequisiteObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-test-stoich-limit-3to1, variationAxes: { scenario: hydroxide precipitation, unknown: limiting reactant } }
  - { id: q009, type: freeResponse, prompt: 'From 0.0180 mol Ca2+ and excess carbonate, find moles CaCO3.', answer: { gradingMode: selfCheck, keyPoints: ['0.0180 mol'] }, explanation: 'Solution: 0.0180 mol CaCO3 forms. Why it works: Ca2+ and carbonate react 1:1. Common trap: Doubling due to the ion charges.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Maps cation moles to precipitate at 1:1.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-caco3-yield, variationAxes: { scenario: excess carbonate, unknown: product moles } }
  - { id: q010, type: freeResponse, prompt: 'What volume of 0.200 M NaCl contains 0.0500 mol NaCl?', answer: { gradingMode: selfCheck, keyPoints: ['0.250 L', '250 mL'] }, explanation: 'Solution: V=n/M=0.0500/0.200=0.250 L=250 mL. Why it works: Rearranged molarity gives solution volume. Common trap: Reporting 0.250 mL.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Rearranges molarity and converts final units.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-volume-from-moles, variationAxes: { givens: moles and M, unknown: volume } }
  - { id: q011, type: freeResponse, prompt: 'Find grams BaSO4 from 0.0100 mol using 233.39 g/mol.', answer: { gradingMode: selfCheck, keyPoints: ['2.33 g'] }, explanation: 'Solution: m=(0.0100)(233.39)=2.33 g. Why it works: Molar mass is grams per mole. Common trap: Reporting 0.0233 g.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Converts precipitate mole amount to mass.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-baso4-mass, variationAxes: { scenario: barium sulfate, unknown: mass } }
  - { id: q012, type: freeResponse, prompt: 'State the mole-map order for finding grams of a precipitate from molarity and volume.', answer: { gradingMode: selfCheck, keyPoints: ['mL to L', 'M to moles reactant', 'mole ratio to product', 'molar mass to grams'] }, explanation: 'Solution: Convert mL to L, use M×V for reactant moles, use the balanced ratio for product moles, then multiply by product molar mass. Why it works: Each arrow changes a specific quantity with units that cancel. Common trap: Applying molar mass before the equation ratio.', difficultyDimensions: [modelOrDerivation, proofJustification], difficultyEvidence: 'States ordered conversion procedure and unit role.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-map-recall, variationAxes: { scenario: process planning, unknown: ordered method } }
  - { id: q013, type: freeResponse, prompt: 'A reaction has 0.0200 mol limiting reactant and 1:1 product ratio. Find product moles.', answer: { gradingMode: selfCheck, keyPoints: ['0.0200 mol'] }, explanation: 'Solution: Product moles are 0.0200 mol. Why it works: A 1:1 coefficient ratio transfers the limiting moles unchanged. Common trap: Adding excess-reactant moles.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Applies limiting branch and direct equation ratio.', prerequisiteObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-test-stoich-generic-limit-yield, variationAxes: { scenario: limiting concept, unknown: product moles } }
  - { id: q014, type: freeResponse, prompt: 'If 0.0300 mol Ag+ reacts with 0.0500 mol Cl−, how many moles Cl− remain?', answer: { gradingMode: selfCheck, keyPoints: ['0.0200 mol Cl−'] }, explanation: 'Solution: The 1:1 reaction consumes 0.0300 mol Cl−, leaving 0.0500−0.0300=0.0200 mol. Why it works: Ag+ is limiting and chloride is excess. Common trap: Subtracting in the opposite direction.', difficultyDimensions: [casePartition, auxiliaryTechnique], difficultyEvidence: 'Identifies excess branch and subtracts consumed amount.', prerequisiteObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-test-stoich-excess-subtraction, variationAxes: { scenario: excess chloride, unknown: remaining moles } }
  - { id: q015, type: freeResponse, prompt: 'Why must a balanced equation be used before a mole ratio?', answer: { gradingMode: selfCheck, keyPoints: ['coefficients give mole relationship', 'conserve atoms'] }, explanation: 'Solution: Balance first because coefficients are the mole conversion factors and conserve atoms. Why it works: An unbalanced equation gives a false amount relationship. Common trap: Using formula subscripts as reaction coefficients.', difficultyDimensions: [proofJustification, errorDiagnosis], difficultyEvidence: 'Justifies procedural requirement using conservation and ratio meaning.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-why-balance, variationAxes: { scenario: procedure rationale, unknown: justification } }
  - { id: q016, type: freeResponse, prompt: 'Find moles OH− in 100.0 mL 0.250 M NaOH.', answer: { gradingMode: selfCheck, keyPoints: ['0.0250 mol OH−'] }, explanation: 'Solution: NaOH moles=(0.1000)(0.250)=0.0250 mol, and one OH− occurs per formula unit. Why it works: Strong NaOH supplies one hydroxide per unit. Common trap: Dividing by one hundred twice.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Converts solution amount to reactive ion moles.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-hydroxide-moles, variationAxes: { scenario: base solution, unknown: hydroxide moles } }
  - { id: q017, type: freeResponse, prompt: 'For 2Al3+ + 3SO4 2−→Al2(SO4)3, find product moles from 0.0600 mol Al3+ with excess sulfate.', answer: { gradingMode: selfCheck, keyPoints: ['0.0300 mol', '1 mol product per 2 mol Al3+'] }, explanation: 'Solution: 0.0600×(1/2)=0.0300 mol Al2(SO4)3. Why it works: Two aluminum ions form one formula unit. Common trap: Treating it as 1:1.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Applies a coefficient-based non-1:1 ratio.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-test-stoich-aluminum-sulfate-ratio, variationAxes: { scenario: multivalent ion product, unknown: product moles } }
  - { id: q018, type: freeResponse, prompt: 'A precipitate is dried and has mass lower than theoretical. Name one routine cause.', answer: { gradingMode: selfCheck, keyPoints: ['incomplete reaction', 'product loss during transfer/filtration', 'not fully collected'] }, explanation: 'Solution: A lower mass can result from incomplete reaction or product loss during transfer or filtration. Why it works: Theoretical yield assumes complete conversion and recovery. Common trap: Saying low mass proves the molar mass changed.', difficultyDimensions: [modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Relates yield discrepancy to procedural assumptions.', prerequisiteObjectiveIds: [quantitative-analysis], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-test-stoich-low-yield-cause, variationAxes: { scenario: experiment result, unknown: cause } }
  - { id: q019, type: freeResponse, prompt: 'What is the limiting reactant?', answer: { gradingMode: selfCheck, keyPoints: ['reactant consumed first', 'sets maximum product'] }, explanation: 'Solution: It is the reactant consumed first, which sets the maximum product amount. Why it works: Once it is gone, the reaction cannot continue. Common trap: Defining it as the reactant with the smallest mass.', difficultyDimensions: [modelOrDerivation, casePartition], difficultyEvidence: 'Defines limiting role through reaction progression and product bound.', prerequisiteObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-test-stoich-limiting-definition, variationAxes: { scenario: concept recognition, unknown: definition } }
  - { id: q020, type: freeResponse, prompt: 'State why titration is not needed to calculate precipitate mass when both reacting solution concentrations and volumes are given.', answer: { gradingMode: selfCheck, keyPoints: ['M and V already give moles', 'use balanced stoichiometry', 'no endpoint measurement needed'] }, explanation: 'Solution: The supplied molarity and volume already determine reactant moles, so a balanced mole map gives precipitate mass without an endpoint measurement. Why it works: Titration is a method for finding an unknown amount, not an extra required step when it is given. Common trap: Calling every solution stoichiometry problem a titration.', difficultyDimensions: [casePartition, proofJustification], difficultyEvidence: 'Separates a general mole-map calculation from titration-specific measurement purpose.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0464], reasoningSignature: easy-test-stoich-not-titration, variationAxes: { scenario: scope distinction, unknown: method rationale } }
