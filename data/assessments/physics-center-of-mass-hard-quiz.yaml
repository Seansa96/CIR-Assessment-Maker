questions:
- id: com-hard-1
  title: Center of Mass Integral
  type: symbolicResponse
  prompt: 'Adapted from OpenStax University Physics.


    A rod of length $L$ has linear mass density $\lambda(x) = 1x$. Find the center
    of mass $x_{cm}$.'
  answer:
    gradingMode: auto
    expected: 2/3*L
  explanation: $M = \int_0^L 1x dx = 1L^2/2$. $x_{cm} = \frac{1}{M} \int_0^L 1x^2
    dx = \frac{2}{1L^2} \frac{1L^3}{3} = \frac{2L}{3}$.
