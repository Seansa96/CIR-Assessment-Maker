  explanation: >
    Solution: The coefficient is $\binom85-3\binom84+3\binom83-\binom82=56-210+168-28=-14$.


    Why it works: Multiply by collecting all pairs of exponents that total five.


    Why the other choices fail: They lose the alternating signs or omit terms from the convolution.


    Prerequisites: Be fluent with binomial coefficients and polynomial multiplication.


    Further study: Connect coefficient extraction to generating functions.
