workedExamples:
- id: we-damped-oscillations
  title: Deriving and applying Damped Oscillations
  problem: Use the labeled model to derive and calculate the amplitude from $A=A_0e^{-bt}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the damping component in the system diagram (such as a dashpot or a fluid vat).
    prompt: 'Identify the new parameter.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      gradingMode: selfCheck
    explanation: >-
      Solution: The new parameter is the damping constant $b$.

      Why it works: In the linear viscous model, $b$ sets the size of the velocity-dependent damping force $-bv$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about the nature of the damping force.
    prompt: 'How is the damping force modeled?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      gradingMode: selfCheck
    explanation: >-
      Solution: Model the damping force as $F_{\text{damp}}=-bv$.

      Why it works: The minus sign makes the force oppose the velocity, and $b$ controls its strength in the linear-drag approximation.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want to find the condition for critical damping.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      gradingMode: selfCheck
    explanation: >-
      Solution: The target is the critical damping coefficient $b_c$.

      Why it works: Critical damping separates oscillatory underdamped motion from non-oscillatory overdamped return.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the full differential equation for damped motion.
    prompt: 'Write the equation of motion.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      gradingMode: selfCheck
    explanation: >-
      Solution: $m\frac{d^2x}{dt^2}+b\frac{dx}{dt}+kx=0$.

      Why it works: Newton's second law combines inertial, velocity-dependent damping, and spring restoring terms for free damped motion.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the critical damping condition from the characteristic equation root term $\sqrt{(b/2m)^2 - k/m}$.
    prompt: 'Isolate $b_c$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      gradingMode: selfCheck
    explanation: >-
      Solution: Set the characteristic-root discriminant to zero: $(b/2m)^2=k/m$, so $b_c=2\sqrt{mk}$.

      Why it works: A repeated characteristic root is the boundary between oscillatory and non-oscillatory solutions.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $m = 2.0$ kg and $k = 50.0$ N/m, calculate the critical damping constant $b_c$.
    prompt: 'Calculate $b_c$.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      value: 20
      tolerance: 0.03
    explanation: >-
      Solution: $b_c=2\sqrt{(2.0\text{ kg})(50.0\text{ N/m})}=2\sqrt{100}=20.0\text{ kg/s}$.

      Why it works: Substitution into $b_c=2\sqrt{mk}$ gives the critical coefficient for this mass-spring system.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of $\sqrt{mk}$.
    prompt: 'What are the units of $b$?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      gradingMode: selfCheck
    explanation: >-
      Solution: The units are $\text{kg/s}$.

      Why it works: $\sqrt{\text{kg}\cdot\text{N/m}}=\sqrt{\text{kg}^2/\text{s}^2}=\text{kg/s}$, so the factor of two does not change the unit.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated critical damping constant.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/damped-oscillations.svg
      alt: Labeled original schematic for Damped Oscillations used for quantitative analysis.
      caption: Damped Oscillations model diagram.
    answer:
      value: 20
      tolerance: 0.03
    explanation: >-
      Solution: The critical damping constant is $20.0\text{ kg/s}$.

      Why it works: This agrees with the calculation from $b_c=2\sqrt{mk}$ and has the correct damping-coefficient units.
- id: damped-amplitude-we002
  title: Amplitude After Damping
  problem: An underdamped oscillator has initial amplitude $0.20\ \text{m}$, mass $1.0\ \text{kg}$, and damping constant $0.40\ \text{kg/s}$. Find its amplitude after $5.0\ \text{s}$ using $A=A_0e^{-bt/(2m)}$.
  steps:
  - id: damped-amplitude-we002-step-1
    title: Evaluate the exponent
    type: numericResponse
    prompt: What is the dimensionless exponent $-bt/(2m)$?
    answer: {value: -1, tolerance: 0.01}
    explanation: 'Solution: $-bt/(2m)=-(0.40)(5.0)/(2\cdot1.0)=-1.0$. Why it works: the units of $bt/m$ cancel, as required for an exponential argument.'
  - id: damped-amplitude-we002-step-2
    title: Calculate the amplitude
    type: numericResponse
    prompt: What is the amplitude after $5.0\ \text{s}$ in meters?
    answer: {value: 0.0736, tolerance: 0.0005}
    explanation: 'Solution: $A=(0.20)e^{-1}=0.0736\ \text{m}$. Why it works: viscous damping reduces the amplitude by an exponential factor less than one for positive time.'
