    title: Core terms
    entries:
    - {id: superposition, term: superposition, definition: 'The principle that overlapping wave displacements add algebraically.', drills: [{id: superposition-drill, type: typed, prompt: 'What principle says overlapping displacements add?', answer: {expected: superposition}}]}
    - {id: constructive, term: constructive interference, definition: 'Interference in which displacements reinforce.', drills: [{id: constructive-drill, type: cloze, prompt: 'Same-sign displacements produce {{constructive interference}}.', answer: {expected: constructive interference}}]}
    - {id: destructive, term: destructive interference, definition: 'Interference in which opposite displacements reduce or cancel.', drills: [{id: destructive-drill, type: typed, prompt: 'What interference occurs for equal opposite displacements?', answer: {expected: destructive interference}}]}
