schemaVersion: 1
id: aops-angle-chasing-circle-mixed-concept-lesson
title: 'Angle Chasing II: Circle and Mixed Proof Chases'
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-angle-chasing
modeDefault: learn
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - art-of-problem-solving
  - aops-angle-chasing
  - aops-volume-1
  - geometry
  - proof
skills:
- Relate central angles, arcs, and inscribed angles.
- Use cyclic and tangent-chord conditions in both calculation and proof.
- Plan mixed line-and-circle chases.
lesson:
  introduction: Circle configurations add arc conversion, cyclic quadrilaterals, tangent-chord angles, and purposeful auxiliary radii to the reason ledger.
  sections:
  - id: aops-angle2-central
    title: Central angles match their intercepted arcs
    required: true
    content: A central angle has its vertex at the center, so its degree measure equals the measure of its intercepted arc. Identify the vertex before using this one-to-one relation; an angle whose vertex lies on the circle follows a different rule.
    media:
    - type: image
      src: /assessments/aops/aops-angle-circle.svg
      alt: Central angle AOB of 104 degrees and inscribed angle ACB intercepting arc AB.
      caption: The central angle and minor arc AB both measure 104 degrees.
    check:
      id: aops-angle2-central-check
      type: multipleChoice
      prompt: What is the measure of minor arc $AB$?
      choices:
      - id: a
        text: $104^\circ$
      - id: b
        text: $52^\circ$
      - id: c
        text: $208^\circ$
      - id: d
        text: $256^\circ$
      answer:
        choiceId: a
      explanation: A central angle has the same measure as its intercepted arc.
  - id: aops-angle2-inscribed
    title: Inscribed angles are half their arcs
    required: true
    content: An inscribed angle has vertex on the circle and sides that are chords. Its measure is half the intercepted arc. Thus inscribed angles intercepting the same arc are equal. Be precise about which arc lies inside the angle; using the other arc changes the result.
    media:
    - type: image
      src: /assessments/aops/aops-angle-circle.svg
      alt: Inscribed angle ACB marked x intercepting the same 104 degree arc as central angle AOB.
      caption: The inscribed angle is half the central angle over the same arc.
    check:
      id: aops-angle2-inscribed-check
      type: multipleChoice
      prompt: What is $x$ in the diagram?
      choices:
      - id: a
        text: $52^\circ$
      - id: b
        text: $104^\circ$
      - id: c
        text: $156^\circ$
      - id: d
        text: $208^\circ$
      answer:
        choiceId: a
      explanation: $x=104^\circ/2=52^\circ$.
  - id: aops-angle2-cyclic
    title: Opposite angles in a cyclic quadrilateral
    required: true
    content: If all four vertices lie on one circle, opposite angles of the quadrilateral are supplementary. Each opposite pair intercepts arcs that together make the full circle, so their half-arc measures total $180^\circ$. The converse can prove concyclicity when a pair of opposite angles is supplementary.
    media:
    - type: image
      src: /assessments/aops/aops-angle-cyclic-tangent.svg
      alt: Quadrilateral ABCD inscribed in a circle with all vertices visibly on the circumference.
      caption: Concyclicity, not the shape's appearance, permits the supplementary conclusion.
    check:
      id: aops-angle2-cyclic-check
      type: multipleChoice
      prompt: If angle $A=112^\circ$, what is opposite angle $C$?
      choices:
      - id: a
        text: $68^\circ$
      - id: b
        text: $112^\circ$
      - id: c
        text: $78^\circ$
      - id: d
        text: $248^\circ$
      answer:
        choiceId: a
      explanation: Opposite angles of a cyclic quadrilateral sum to $180^\circ$.
  - id: aops-angle2-tangent-chord
    title: A tangent-chord angle matches an inscribed angle
    required: true
    content: The angle between a tangent at $A$ and chord $AB$ equals any inscribed angle intercepting chord $AB$ on the opposite arc. A reliable proof draws radius $OA$, uses $OA$ perpendicular to the tangent, then relates the isosceles central triangle to the relevant arc. Do not use this theorem when the line is a secant.
    media:
    - type: image
      src: /assessments/aops/aops-angle-cyclic-tangent.svg
      alt: Tangent at A, chord AB, and inscribed angle ADB of 38 degrees intercepting chord AB.
      caption: Both marked angles are tied to the same chord AB.
    check:
      id: aops-angle2-tangent-chord-check
      type: multipleChoice
      prompt: What is tangent-chord angle $y$?
      choices:
      - id: a
        text: $38^\circ$
      - id: b
        text: $52^\circ$
      - id: c
        text: $76^\circ$
      - id: d
        text: $142^\circ$
      answer:
        choiceId: a
      explanation: The tangent-chord theorem equates it to inscribed angle $ADB$.
  - id: aops-angle2-radius
    title: Draw a radius to unlock circle angles
    required: true
    content: When a tangent or chord is present, a radius can expose a right angle or an isosceles triangle. Draw to a tangency point for perpendicularity; draw to chord endpoints for equal sides. State the intended result before adding the line, because an arbitrary radius may not connect to the target.
    media:
    - type: image
      src: /assessments/aops/aops-angle-cyclic-tangent.svg
      alt: Circle configuration containing a tangent at A and chord AB.
      caption: Radius OA would create a justified right angle with the tangent.
    check:
      id: aops-angle2-radius-check
      type: multipleChoice
      prompt: Which construction directly uses the tangent at $A$?
      choices:
      - id: a
        text: Draw radius $OA$.
      - id: b
        text: Draw any diameter not through $A$.
      - id: c
        text: Assume $AB$ passes through the center.
      - id: d
        text: Reflect the tangent without justification.
      answer:
        choiceId: a
      explanation: The contact radius is perpendicular to the tangent.
  - id: aops-angle2-mixed
    title: Combine line and circle moves
    required: true
    content: 'A mixed chase often follows this order: use parallel or isosceles facts to obtain one inscribed angle, convert it to an arc, and transfer that arc to another inscribed or tangent-chord angle. Record the intermediate arc explicitly so the factor of two is not lost.'
    media:
    - type: image
      src: /assessments/aops/aops-angle-circle.svg
      alt: Central and inscribed angles sharing the marked arc AB.
      caption: Writing the arc measure makes the central-versus-inscribed factor visible.
    check:
      id: aops-angle2-mixed-check
      type: multipleChoice
      prompt: An inscribed angle intercepting arc $AB$ is $37^\circ$. What central angle intercepts the same arc?
      choices:
      - id: a
        text: $74^\circ$
      - id: b
        text: $18.5^\circ$
      - id: c
        text: $37^\circ$
      - id: d
        text: $143^\circ$
      answer:
        choiceId: a
      explanation: The arc and central angle are twice the inscribed angle.
  - id: aops-angle2-proof
    title: Converse checks and proof closure
    required: true
    content: Circle angle theorems are conditional. Confirm vertex location, intercepted arc, tangency, or concyclicity before applying one. To close a proof, restate the target relation and cite the final theorem. Numerical agreement alone does not prove that an unmarked quadrilateral is cyclic.
    media:
    - type: image
      src: /assessments/aops/aops-angle-cyclic-tangent.svg
      alt: Marked cyclic quadrilateral and tangent configuration.
      caption: The circle and contact markings carry hypotheses that the proof must name.
    check:
      id: aops-angle2-proof-check
      type: multipleChoice
      prompt: Which condition can prove four points concyclic?
      choices:
      - id: a
        text: A pair of opposite quadrilateral angles sums to $180^\circ$.
      - id: b
        text: Two adjacent angles are unequal.
      - id: c
        text: One diagonal looks like a diameter.
      - id: d
        text: Two sides appear parallel.
      answer:
        choiceId: a
      explanation: The converse of the cyclic-quadrilateral theorem establishes concyclicity.
