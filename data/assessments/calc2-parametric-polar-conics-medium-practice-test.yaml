questions:
- id: q001
  title: 'Part 1: Sketch a Parametric Curve'
  type: freeResponse
  prompt: |-
    Sketch the parametric curve given by $x=t^2-2t$, $y=t+1$ for $-1 \le t \le 3$. Indicate the direction of motion as $t$ increases.
  answer:
    gradingMode: selfCheck
    expected: |
      The sketch should be a right-opening parabola passing through $(3,0)$, $(0,1)$, $(-1,2)$, $(0,3)$, and $(3,4)$, traced in that order as $t$ increases.
    keyPoints:
    - Plot several parameter values from $-1$ to $3$.
    - Recognize the right-opening parabola structure from $x=t^2-2t$.
    - Mark direction toward $(3,4)$ as $t$ increases.
  explanation: |-
    Substitute integer values of $t$ from $-1$ to $3$ into the equations:

    *   $t = -1 \implies x = (-1)^2-2(-1) = 3,\ y = -1+1 = 0$. Point: $(3, 0)$
    *   $t = 0 \implies x = 0,\ y = 1$. Point: $(0, 1)$
    *   $t = 1 \implies x = -1,\ y = 2$. Point: $(-1, 2)$
    *   $t = 2 \implies x = 0,\ y = 3$. Point: $(0, 3)$
    *   $t = 3 \implies x = 3,\ y = 4$. Point: $(3, 4)$

    Plot these points and draw a smooth curve (a parabola opening to the right) connecting them. Draw arrows on the curve pointing towards $(3,4)$ to indicate the direction of increasing $t$.
