- id: q003
  title: 'Part 1: Identify Parametric Curve'
  type: multipleChoice
  prompt: |-
    Which of the following sets of parametric equations describes a line segment starting at $(2, 5)$ at $t=0$ and ending at $(-1, 1)$ at $t=1$?
  choices:
  - id: c1
    text: x = 2 - 3t, y = 5 - 4t
  - id: c2
    text: x = -1 + 3t, y = 1 + 4t
  - id: c3
    text: x = 2 - t, y = 5 - t
  - id: c4
    text: x = -1 - 3t, y = 1 - 4t
  answer:
    choiceId: c1
  explanation: |-
    The point at $t=0$ must be $(2, 5)$ and the point at $t=1$ must be $(-1, 1)$.

    Testing the first option $x=2-3t,\ y=5-4t$:
    *   For $t=0$: $x=2-3(0)=2$ and $y=5-4(0)=5$. The point is $(2,5)$.
    *   For $t=1$: $x=2-3(1)=-1$ and $y=5-4(1)=1$. The point is $(-1,1)$.

    This perfectly matches the given conditions.
- id: q004
  title: 'Part 1: Tangent Line of Parametric Curve'
  type: symbolicResponse
  prompt: |-
    Find the slope of the tangent line to the curve $x=t\sin t,\ y=t\cos t$ at $t=\pi$.
  answer:
    expectedLatex: '\frac{1}{\pi}'
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
  explanation: |-
    The formula for the slope of a parametric curve is:
    $$\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$$

    First, find the derivatives using the product rule:
    $$\frac{dx}{dt} = \sin t + t\cos t$$
    $$\frac{dy}{dt} = \cos t - t\sin t$$

    Evaluate at $t=\pi$:
    $$\frac{dx}{dt}\Big|_{t=\pi} = \sin\pi + \pi\cos\pi = 0 + \pi(-1) = -\pi$$
    $$\frac{dy}{dt}\Big|_{t=\pi} = \cos\pi - \pi\sin\pi = -1 - \pi(0) = -1$$

    So, the slope is $m = \frac{-1}{-\pi} = \frac{1}{\pi}$.
- id: q005
  title: 'Part 1: Concavity of Parametric Curve'
  type: multipleChoice
  prompt: |-
    Determine the concavity of the curve $x=t^2,\ y=\ln t$ at $t=1$.
  choices:
  - id: c1
    text: Concave Up
  - id: c2
    text: Concave Down
  - id: c3
    text: Neither (Inflection Point)
  answer:
    choiceId: c2
  explanation: |-
    The formula for the second derivative of a parametric curve is:
    $$\frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{dx/dt}$$

    First, find $\frac{dy}{dx}$:
    $$\frac{dx}{dt} = 2t$$
    $$\frac{dy}{dt} = \frac{1}{t}$$
    $$\frac{dy}{dx} = \frac{1/t}{2t} = \frac{1}{2t^2}$$

    Next, find the derivative of $\frac{dy}{dx}$ with respect to $t$:
    $$\frac{d}{dt}\left(\frac{dy}{dx}\right) = \frac{d}{dt}\left(\frac{1}{2}t^{-2}\right) = -t^{-3} = -\frac{1}{t^3}$$

    Now, find the second derivative:
    $$\frac{d^2y}{dx^2} = \frac{-1/t^3}{2t} = -\frac{1}{2t^4}$$

    Evaluate at $t=1$:
    $$\frac{d^2y}{dx^2}\Big|_{t=1} = -\frac{1}{2(1)^4} = -\frac{1}{2} < 0$$

    Since the second derivative is negative, the curve is concave down at $t=1$.
- id: q006
  title: 'Part 1: Horizontal and Vertical Tangents'
  type: freeResponse
  prompt: |-
    Find all values of $t$ where the curve $x=t^3-3t^2,\ y=t^3-12t$ has a horizontal or vertical tangent.
  answer:
    gradingMode: selfCheck
    expected: |
      Horizontal tangent: $t=-2$. Vertical tangent: $t=0$. The candidate $t=2$ is singular because both derivatives vanish.
    keyPoints:
    - Use $\frac{dy}{dt}=0$ for horizontal tangent candidates.
    - Use $\frac{dx}{dt}=0$ for vertical tangent candidates.
    - Check the other derivative at each candidate.
  explanation: |-
    First, find the derivatives:
    $$\frac{dx}{dt} = 3t^2 - 6t$$
    $$\frac{dy}{dt} = 3t^2 - 12$$

    The condition for a horizontal tangent is $\frac{dy}{dt}=0$ and $\frac{dx}{dt} \ne 0$:
    $$3t^2 - 12 = 0 \implies t^2 = 4 \implies t = 2, t = -2$$
    Check $\frac{dx}{dt}$ at $t=2$: $3(2)^2 - 6(2) = 12 - 12 = 0$. Since $\frac{dx}{dt}=0$ here, this requires limits and might be a cusp.
    Check $\frac{dx}{dt}$ at $t=-2$: $3(-2)^2 - 6(-2) = 12 + 12 = 24 \ne 0$.
    So, there is a horizontal tangent at $t = -2$.

    The condition for a vertical tangent is $\frac{dx}{dt}=0$ and $\frac{dy}{dt} \ne 0$:
    $$3t^2 - 6t = 0 \implies 3t(t - 2) = 0 \implies t = 0, t = 2$$
    Check $\frac{dy}{dt}$ at $t=0$: $3(0)^2 - 12 = -12 \ne 0$.
    So, there is a vertical tangent at $t = 0$. (At $t=2$, it's a singularity).
- id: q007
  title: 'Part 1: Sketch a Polar Curve'
  type: graphingResponse
  prompt: |-
    Sketch the polar curve $\theta=\frac{\pi}{4}$.
  answer:
    graphingAnswer:
      features:
        - type: ShapeType
          stringValue: line
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: 0.0, y: 0.0 }
          tolerance: 0.2
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: 2.0, y: 2.0 }
          tolerance: 0.2
          weight: 1.0
        - type: PassesThrough
          pointValue: { x: -2.0, y: -2.0 }
          tolerance: 0.2
          weight: 1.0
  explanation: |-
    The polar curve $\theta=\frac{\pi}{4}$ describes all points that have an angle of $\frac{\pi}{4}$ from the positive $x$-axis, regardless of the radius $r$. Since $r$ can be positive or negative, it forms a full line passing through the origin at a $45^\circ$ angle.

    This forms the line $y=x$.
- id: q008
  title: 'Part 1: Identify Polar Curve'
  type: multipleChoice
  prompt: |-
    Which of the following is the equation for a limaçon with an inner loop?
  choices:
  - id: c1
    text: '$r=1+2\cos\theta$'
  - id: c2
    text: '$r=2+\cos\theta$'
  - id: c3
    text: '$r=2\cos\theta$'
  - id: c4
    text: '$r=2+2\cos\theta$'
  answer:
    choiceId: c1
  explanation: |
    A limaçon has the general form $r = a \pm b\cos\theta$ or $r = a \pm b\sin\theta$.
    
    The shape depends on the ratio $\frac{a}{b}$:
    - If $\frac{a}{b} < 1$, it has an inner loop.
    - If $\frac{a}{b} = 1$, it is a cardioid.
    - If $1 < \frac{a}{b} < 2$, it is dimpled.
    - If $\frac{a}{b} \ge 2$, it is convex.

    For $r=1+2\cos\theta$, we have $a=1, b=2$, so $\frac{a}{b} = \frac{1}{2} < 1$, which means it has an inner loop.
- id: q009
  title: 'Part 1: Tangent Line of Polar Curve'
  type: symbolicResponse
  prompt: |-
    Find the slope of the tangent line to the polar curve $r=2\cos\theta$ at $\theta=\frac{\pi}{4}$.
  answer:
    expectedLatex: '0'
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
  explanation: |-
    The formula for the slope of a polar curve is:
    $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$$

    Given $r = 2\cos\theta$, its derivative is $r' = -2\sin\theta$.
    Evaluate at $\theta = \frac{\pi}{4}$:
    $$r = 2\cos\left(\frac{\pi}{4}\right) = \sqrt{2}$$
    $$r' = -2\sin\left(\frac{\pi}{4}\right) = -\sqrt{2}$$

    Substitute into the slope formula:
    $$\frac{dy}{dx} = \frac{(-\sqrt{2})\left(\frac{\sqrt{2}}{2}\right) + (\sqrt{2})\left(\frac{\sqrt{2}}{2}\right)}{(-\sqrt{2})\left(\frac{\sqrt{2}}{2}\right) - (\sqrt{2})\left(\frac{\sqrt{2}}{2}\right)} = \frac{-1 + 1}{-1 - 1} = \frac{0}{-2} = 0$$
- id: q010
  title: 'Part 1: Horizontal Tangents of Polar Curve'
  type: freeResponse
  prompt: |-
    Find all values of $\theta$ in $[0, \pi)$ where the polar curve $r=2\sin\theta$ has a horizontal tangent.
  answer:
    gradingMode: selfCheck
    expected: |
      Horizontal tangents occur at $\theta=0$ and $\theta=\frac{\pi}{2}$ on $[0,\pi)$.
    keyPoints:
    - Use the polar slope numerator $r'\sin\theta+r\cos\theta$.
    - For $r=2\sin\theta$, reduce the equation to $\sin\theta\cos\theta=0$.
    - Check the denominator so the tangent is actually horizontal.
  explanation: |-
    The formula for the slope of a polar curve is:
    $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$$

    For a horizontal tangent, set the numerator of $\frac{dy}{dx}$ equal to zero:
    $$\frac{dy}{d\theta} = r'\sin\theta + r\cos\theta = 0$$

    Given $r=2\sin\theta$, we have $r'=2\cos\theta$:
    $$(2\cos\theta)\sin\theta + (2\sin\theta)\cos\theta = 0$$
    $$4\sin\theta\cos\theta = 0$$
    $$2\sin(2\theta) = 0$$

    Solve for $2\theta$:
    $$2\theta = 0, \pi, 2\pi, \ldots$$
    $$\theta = 0, \frac{\pi}{2}$$

    At $\theta=0$, $r=0$. This is the pole. We must check the denominator: $r'\cos\theta - r\sin\theta = 2(1) - 0 = 2 \ne 0$. Thus the tangent is horizontal.
    At $\theta=\frac{\pi}{2}$, denominator is $0(0) - 2(1) = -2 \ne 0$. Thus the tangent is horizontal.
    So horizontal tangents occur at $\theta = 0$ and $\theta = \frac{\pi}{2}$.
- id: q011
  title: 'Part 1: Simple Area of a Polar Curve'
  type: symbolicResponse
  prompt: |-
    Set up the integral for the area of one petal of the region bounded by the polar curve $r=4\sin(2\theta)$. Do not evaluate.
  answer:
    expectedLatex: '\frac{1}{2}\int_{0}^{\frac{\pi}{2}}(4\sin(2\theta))^2\,d\theta'
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
  explanation: |-
    The formula for polar area is:
    $$A = \frac{1}{2}\int_{\alpha}^{\beta} r^2 \,d\theta$$

    The curve $r=4\sin(2\theta)$ is a rose with 4 petals. One petal is traced as $2\theta$ goes from $0$ to $\pi$, which means $\theta$ goes from $0$ to $\frac{\pi}{2}$.

    The integral is:
    $$A = \frac{1}{2}\int_{0}^{\frac{\pi}{2}} (4\sin(2\theta))^2 \,d\theta$$
- id: q012
  title: 'Part 1: Identify Conic Section'
  type: multipleChoice
  prompt: |-
    Identify the type of conic section represented by the equation $4x^2 + 9y^2 - 16x + 18y - 11 = 0$.
  choices:
  - id: c1
    text: Ellipse
  - id: c2
    text: Parabola
  - id: c3
    text: Circle
  - id: c4
    text: Hyperbola
  answer:
    choiceId: c1
  explanation: |-
    Since both $x^2$ and $y^2$ are present, have the same sign (both positive), and have different coefficients (4 and 9), the equation represents an ellipse.
- id: q013
  title: 'Part 1: Write Conic Equation'
  type: symbolicResponse
  prompt: |-
    Write the standard equation of an ellipse with center $(0,0)$, vertices at $(\pm 5, 0)$, and co-vertices at $(0, \pm 3)$.
  answer:
    expectedLatex: '\frac{x^2}{25}+\frac{y^2}{9}=1'
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.000001
  explanation: |-
    The standard equation of an ellipse centered at the origin with horizontal major axis is:
    $$\frac{x^2}{a^2} + \frac{y^2}{b^2} = 1$$

    The vertices are at $(\pm 5, 0)$, so $a = 5$.
    The co-vertices are at $(0, \pm 3)$, so $b = 3$.

    Substitute these into the formula:
    $$\frac{x^2}{5^2} + \frac{y^2}{3^2} = 1$$
    $$\frac{x^2}{25} + \frac{y^2}{9} = 1$$
- id: q014
  title: 'Part 2: Parametric Arc Length'
  type: freeResponse
  prompt: |-
    Find the arc length of the parametric curve $x=\cos t + t\sin t,\ y=\sin t - t\cos t$ for $0 \le t \le \pi$.

    Provide the setup integral and the final decimal answer rounded to 3 decimal places.
  answer:
    gradingMode: selfCheck
    expected: |
      $$L=\int_0^\pi\sqrt{(t\cos t)^2+(t\sin t)^2}\,dt=\int_0^\pi t\,dt=\frac{\pi^2}{2}\approx4.935.$$
    keyPoints:
    - Use parametric arc length.
    - Compute $x'(t)=t\cos t$ and $y'(t)=t\sin t$.
    - Use $\sin^2t+\cos^2t=1$ to simplify the integrand.
  explanation: |-
    The formula for parametric arc length is:
    $$L = \int_a^b \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \,dt$$

    Derivatives:
    $$\frac{dx}{dt} = -\sin t + (\sin t + t\cos t) = t\cos t$$
    $$\frac{dy}{dt} = \cos t - (\cos t - t\sin t) = t\sin t$$

    Setup integral:
    $$L = \int_0^{\pi} \sqrt{(t\cos t)^2 + (t\sin t)^2} \,dt = \int_0^{\pi} \sqrt{t^2\cos^2 t + t^2\sin^2 t} \,dt$$
    $$L = \int_0^{\pi} \sqrt{t^2(\cos^2 t + \sin^2 t)} \,dt = \int_0^{\pi} \sqrt{t^2} \,dt = \int_0^{\pi} t \,dt$$

    Evaluate:
    $$L = \left[ \frac{1}{2}t^2 \right]_0^{\pi} = \frac{\pi^2}{2} \approx 4.935$$
- id: q015
  title: 'Part 2: Polar Arc Length'
  type: freeResponse
  prompt: |-
    Find the arc length of the polar curve $r=2\sec\theta$ for $0 \le \theta \le \frac{\pi}{4}$.

    Provide the setup integral and the final decimal answer.
  answer:
    gradingMode: selfCheck
    expected: |
      $$L=\int_0^{\pi/4}\sqrt{(2\sec\theta)^2+(2\sec\theta\tan\theta)^2}\,d\theta=2.$$
    keyPoints:
    - Use polar arc length.
    - Compute $r'=2\sec\theta\tan\theta$.
    - Use $1+\tan^2\theta=\sec^2\theta$ to simplify to $2\sec^2\theta$.
  explanation: |-
    The formula for polar arc length is:
    $$L = \int_{\alpha}^{\beta} \sqrt{r^2 + \left(\frac{dr}{d\theta}\right)^2} \,d\theta$$

    Derivative:
    $$r' = 2\sec\theta\tan\theta$$

    Setup integral:
    $$L = \int_0^{\frac{\pi}{4}} \sqrt{(2\sec\theta)^2 + (2\sec\theta\tan\theta)^2} \,d\theta$$
    $$L = \int_0^{\frac{\pi}{4}} \sqrt{4\sec^2\theta + 4\sec^2\theta\tan^2\theta} \,d\theta = \int_0^{\frac{\pi}{4}} \sqrt{4\sec^2\theta(1+\tan^2\theta)} \,d\theta$$
    $$L = \int_0^{\frac{\pi}{4}} \sqrt{4\sec^4\theta} \,d\theta = \int_0^{\frac{\pi}{4}} 2\sec^2\theta \,d\theta$$

    Evaluate:
    $$L = [2\tan\theta]_0^{\frac{\pi}{4}} = 2\tan\left(\frac{\pi}{4}\right) - 2\tan(0) = 2(1) - 0 = 2$$
- id: q016
  title: 'Part 2: Parametric Area'
  type: freeResponse
  prompt: |-
    Find the area under one arch of the cycloid parametric curve $x=t-\sin t,\ y=1-\cos t$ from $t=0$ to $t=2\pi$.

    Provide the setup integral and the final decimal answer rounded to 3 decimal places.
  answer:
    gradingMode: selfCheck
    expected: |
      $$A=\int_0^{2\pi}(1-\cos t)^2\,dt=3\pi\approx9.425.$$
    keyPoints:
    - Use parametric area $A=\int y(t)x'(t)\,dt$.
    - Compute $x'(t)=1-\cos t$.
    - Apply the power-reduction identity for $\cos^2t$ when evaluating.
  explanation: |-
    The formula for parametric area under a curve is:
    $$A = \int_a^b y(t)x'(t) \,dt$$

    Derivative of $x$:
    $$x'(t) = 1-\cos t$$

    Setup integral:
    $$A = \int_0^{2\pi} (1-\cos t)(1-\cos t) \,dt = \int_0^{2\pi} (1 - 2\cos t + \cos^2 t) \,dt$$

    Evaluate:
    $$A = \int_0^{2\pi} \left(1 - 2\cos t + \frac{1+\cos(2t)}{2}\right) \,dt = \int_0^{2\pi} \left(\frac{3}{2} - 2\cos t + \frac{1}{2}\cos(2t)\right) \,dt$$
    $$A = \left[ \frac{3}{2}t - 2\sin t + \frac{1}{4}\sin(2t) \right]_0^{2\pi} = \frac{3}{2}(2\pi) - 0 + 0 = 3\pi \approx 9.425$$
- id: q017
  title: 'Part 2: Polar Area'
  type: freeResponse
  prompt: |-
    Find the area of the inner loop of the limaçon $r=1+2\cos\theta$.

    Provide the setup integral and the final decimal answer rounded to 3 decimal places.
  answer:
    gradingMode: selfCheck
    expected: |
      $$A=\frac12\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)^2\,d\theta\approx0.544.$$
    keyPoints:
    - Find inner-loop bounds from $1+2\cos\theta=0$.
    - Use polar area $A=\frac12\int r^2\,d\theta$.
    - Integrate from $\frac{2\pi}{3}$ to $\frac{4\pi}{3}$.
  explanation: |-
    The formula for polar area is:
    $$A = \frac{1}{2}\int_{\alpha}^{\beta} r^2 \,d\theta$$

    The inner loop occurs when $r \le 0$. Find the $\theta$ values where $r=0$:
    $$1+2\cos\theta = 0 \implies \cos\theta = -\frac{1}{2}$$
    The angles are $\alpha = \frac{2\pi}{3}$ and $\beta = \frac{4\pi}{3}$.

    Setup integral:
    $$A = \frac{1}{2}\int_{\frac{2\pi}{3}}^{\frac{4\pi}{3}} (1+2\cos\theta)^2 \,d\theta$$

    Evaluate:
    $$A = \frac{1}{2}\int_{\frac{2\pi}{3}}^{\frac{4\pi}{3}} (1 + 4\cos\theta + 4\cos^2\theta) \,d\theta$$
    $$A = \frac{1}{2}\int_{\frac{2\pi}{3}}^{\frac{4\pi}{3}} \left(1 + 4\cos\theta + 2(1+\cos(2\theta))\right) \,d\theta = \frac{1}{2}\int_{\frac{2\pi}{3}}^{\frac{4\pi}{3}} (3 + 4\cos\theta + 2\cos(2\theta)) \,d\theta$$
    $$A = \frac{1}{2} \left[ 3\theta + 4\sin\theta + \sin(2\theta) \right]_{\frac{2\pi}{3}}^{\frac{4\pi}{3}}$$
    Evaluating the bounds yields $A \approx 0.544$.
