- id: newton-easy-1
  title: Force Calculation
  type: numericResponse
  prompt: 'Adapted from OpenStax University Physics.


    A mass of $8$ kg accelerates at $8$ m/s$^2$. What is the net force in Newtons?'
  answer:
    gradingMode: auto
    expected: 64
    tolerance: 0.1
  explanation: $F = ma = 8 \times 8 = 64$ N.
