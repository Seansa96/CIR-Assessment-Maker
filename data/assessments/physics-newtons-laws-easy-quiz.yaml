questions:
  - id: nl-easy-q01
    title: Net Force Calculation (1D)
    type: numericResponse
    prompt: |
      A $10\text{ kg}$ block is pushed to the right with a force of $45\text{ N}$ and to the left with a force of $20\text{ N}$. What is the magnitude of the block's acceleration in m/s²?
    answer:
      value: 2.5
      tolerance: 0.1
    explanation: |
      Net force: $F_\text{net} = 45\text{ N (right)} - 20\text{ N (left)} = 25\text{ N (right)}$.
      Newton's Second Law: $a = \frac{F_\text{net}}{m} = \frac{25}{10} = 2.5\text{ m/s}^2$.

  - id: nl-easy-q02
    title: Finding Mass from F=ma
    type: numericResponse
    prompt: |
      A net force of $120\text{ N}$ causes an object to accelerate at $4.0\text{ m/s}^2$. What is the object's mass in kg?
    answer:
      value: 30.0
      tolerance: 0.1
    explanation: |
      $F_\text{net} = ma \implies m = \frac{F_\text{net}}{a} = \frac{120}{4.0} = 30\text{ kg}$.

  - id: nl-easy-q03
    title: Newton's First Law (Inertia)
    type: multipleChoice
    prompt: |
      A spacecraft is cruising through deep space (far from any planets or stars) at a constant velocity of $500\text{ m/s}$. The engines are turned off. According to Newton's First Law, what will happen to the spacecraft?
    choices:
      - id: a
        text: It will gradually slow down and eventually come to a stop because no force is pushing it.
      - id: b
        text: It will continue moving at $500\text{ m/s}$ in a straight line forever, unless acted upon by an outside force.
      - id: c
        text: It will immediately stop as soon as the engines are turned off.
      - id: d
        text: It will move in a circular path.
    answer:
      choiceId: b
    explanation: |
      Newton's First Law (Law of Inertia) states that an object in motion stays in motion with the same speed and in the same direction unless acted upon by a net external force. In deep space with no friction or gravity, it coasts indefinitely.

  - id: nl-easy-q04
    title: Mass vs Weight on the Moon
    type: numericResponse
    prompt: |
      An astronaut has a mass of $80\text{ kg}$ on Earth. They travel to the Moon, where gravity is exactly $1/6$ that of Earth ($g_\text{moon} = 1.63\text{ m/s}^2$). What is the astronaut's **mass** on the Moon in kg?
    answer:
      value: 80.0
      tolerance: 0.1
    explanation: |
      **Mass** is an intrinsic property measuring the amount of matter (and inertia). It does not change with location or gravity. The astronaut's mass is still $80\text{ kg}$. (Their *weight*, however, would be $1/6$ of their Earth weight).

  - id: nl-easy-q05
    title: Weight Calculation
    type: numericResponse
    prompt: |
      What is the weight (in Newtons) of a $5.0\text{ kg}$ bag of flour on Earth? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 49.0
      tolerance: 0.1
    explanation: |
      Weight is the gravitational force acting on an object: $W = mg$.
      $$W = 5.0 \times 9.8 = 49\text{ N}$$

  - id: nl-easy-q06
    title: Elevator at Constant Velocity
    type: numericResponse
    prompt: |
      A $60\text{ kg}$ person stands on a scale in an elevator. The elevator is moving **upwards** at a constant velocity of $3.0\text{ m/s}$. Using $g = 9.8\text{ m/s}^2$, what does the scale read (in Newtons)?
    answer:
      value: 588.0
      tolerance: 1.0
    explanation: |
      Constant velocity means the acceleration is zero, so the net force is zero.
      The upward normal force from the scale must exactly balance the downward force of gravity.
      $N = mg = 60(9.8) = 588\text{ N}$.

  - id: nl-easy-q07
    title: Elevator Accelerating Upwards
    type: numericResponse
    prompt: |
      A $60\text{ kg}$ person stands on a scale in an elevator. The elevator accelerates **upwards** at $2.0\text{ m/s}^2$. Using $g = 9.8\text{ m/s}^2$, what does the scale read (in Newtons)?
    answer:
      value: 708.0
      tolerance: 1.0
    explanation: |
      Newton's Second Law for the person: $\sum F_y = N - mg = ma$.
      $N = m(g + a) = 60(9.8 + 2.0) = 60(11.8) = 708\text{ N}$.
      The person feels "heavier" because the scale must push harder to accelerate them upward.

  - id: nl-easy-q08
    title: Newton's Third Law (Action-Reaction)
    type: multipleChoice
    prompt: |
      A heavy truck collides head-on with a small passenger car. During the collision, how does the force exerted by the truck on the car compare to the force exerted by the car on the truck?
    choices:
      - id: a
        text: The truck exerts a much larger force on the car because it has more mass.
      - id: b
        text: The car exerts a much larger force on the truck.
      - id: c
        text: Both vehicles exert exactly the same amount of force on each other.
      - id: d
        text: The truck exerts a larger force only if it was moving faster than the car.
    answer:
      choiceId: c
    explanation: |
      Newton's Third Law states that for every action force, there is an equal and opposite reaction force. The forces are identical in magnitude ($F_\text{truck on car} = -F_\text{car on truck}$). The car sustains more damage and acceleration because it has much less mass ($a = F/m$), not because the force on it is larger.

  - id: nl-easy-q09
    title: Zero Net Force
    type: multipleChoice
    prompt: |
      An object is experiencing a net force of zero. Which of the following statements must be true?
    choices:
      - id: a
        text: The object must be stationary.
      - id: b
        text: The object's velocity must be constant (which could be zero).
      - id: c
        text: There are no forces acting on the object at all.
      - id: d
        text: The object must be moving in a straight line at a constant non-zero speed.
    answer:
      choiceId: b
    explanation: |
      If $F_\text{net} = 0$, then $a = 0$. Zero acceleration means the velocity does not change. The object could be at rest, or it could be moving at a constant speed in a straight line. (Choice C is incorrect because multiple forces can act on an object and cancel out, like a book resting on a table).

  - id: nl-easy-q10
    title: Two Forces at Right Angles
    type: numericResponse
    prompt: |
      A $2.0\text{ kg}$ object is subjected to two perpendicular forces: $3.0\text{ N}$ North and $4.0\text{ N}$ East. What is the magnitude of the object's acceleration in m/s²?
    answer:
      value: 2.5
      tolerance: 0.1
    explanation: |
      Find the magnitude of the net force using the Pythagorean theorem:
      $F_\text{net} = \sqrt{3.0^2 + 4.0^2} = \sqrt{9 + 16} = \sqrt{25} = 5.0\text{ N}$.
      Acceleration $a = \frac{F_\text{net}}{m} = \frac{5.0}{2.0} = 2.5\text{ m/s}^2$.

  - id: nl-easy-q11
    title: Determining Force from Kinematics
    type: numericResponse
    prompt: |
      A $1500\text{ kg}$ car accelerates from rest to $20\text{ m/s}$ in $5.0\text{ seconds}$. Assuming a constant acceleration, what is the net force acting on the car in Newtons?
    answer:
      value: 6000.0
      tolerance: 10.0
    explanation: |
      First find acceleration: $a = \frac{\Delta v}{\Delta t} = \frac{20 - 0}{5.0} = 4.0\text{ m/s}^2$.
      Then apply Newton's Second Law: $F_\text{net} = ma = 1500(4.0) = 6000\text{ N}$.

  - id: nl-easy-q12
    title: Direction of Net Force
    type: multipleChoice
    prompt: |
      A skydiver is falling downwards through the air and is **slowing down** after opening her parachute. What is the direction of the net force acting on her?
    choices:
      - id: a
        text: Downwards, because she is moving downwards.
      - id: b
        text: Upwards, because she is decelerating.
      - id: c
        text: Zero, because the parachute is fully deployed.
      - id: d
        text: Sideways, depending on the wind.
    answer:
      choiceId: b
    explanation: |
      Since she is moving downwards but slowing down, her acceleration vector must point in the opposite direction of her motion (upwards). By Newton's Second Law ($\vec{F}_\text{net} = m\vec{a}$), the net force must be in the same direction as the acceleration: **upwards**. This means the upward drag force from the parachute is greater than her downward weight.

  - id: nl-easy-q13
    title: Normal Force on a Flat Surface
    type: numericResponse
    prompt: |
      A $25\text{ kg}$ television sits at rest on a horizontal table. What is the magnitude of the normal force exerted by the table on the television? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 245.0
      tolerance: 1.0
    explanation: |
      Since the TV is at rest on a flat surface, the normal force exactly balances gravity.
      $N = mg = 25(9.8) = 245\text{ N}$.

  - id: nl-easy-q14
    title: Newton's Third Law (Action-Reaction Pair)
    type: multipleChoice
    prompt: |
      A book rests on a table. The Earth pulls down on the book with a gravitational force (its weight). According to Newton's Third Law, what is the reaction force to the Earth pulling down on the book?
    choices:
      - id: a
        text: The table pushing up on the book (Normal force).
      - id: b
        text: The book pushing down on the table.
      - id: c
        text: The book pulling up on the Earth.
      - id: d
        text: Gravity has no reaction force because it is a non-contact force.
    answer:
      choiceId: c
    explanation: |
      Action-reaction pairs always involve the same two objects interacting. 
      Action: Earth pulls book down.
      Reaction: Book pulls Earth up.
      (The normal force is NOT the reaction to gravity; it is the reaction to the book pushing down on the table).

  - id: nl-easy-q15
    title: Multiple Pushes
    type: numericResponse
    prompt: |
      Three people are pushing a stalled $1200\text{ kg}$ car horizontally. Person A pushes with $200\text{ N}$ North, Person B pushes with $150\text{ N}$ North, and Person C pushes with $50\text{ N}$ South. What is the car's acceleration in m/s²?
    answer:
      value: 0.25
      tolerance: 0.05
    explanation: |
      Define North as positive.
      $F_\text{net} = 200 + 150 - 50 = 300\text{ N (North)}$.
      $a = \frac{F_\text{net}}{m} = \frac{300}{1200} = 0.25\text{ m/s}^2$.
