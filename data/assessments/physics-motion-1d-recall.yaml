- id: k1-r001
  type: cloze
  prompt: 'Complete: $v(t)=\underline{\hspace{1cm}}$.'
  answer:
    expected: dx/dt
    expectedLatex: \frac{dx}{dt}
    aliases:
    - derivative of x
    media: []
    choiceId: 
  explanation: 'Solution: $v=dx/dt$.\n\nWhy it works: Velocity is the time derivative of position.'
  tags:
  - derivative
  skills: []
  choices: []
- id: k1-r002
  type: cloze
  prompt: 'Complete: $a(t)=\underline{\hspace{1cm}}$.'
  answer:
    expected: dv/dt
    expectedLatex: \frac{dv}{dt}
    aliases:
    - derivative of v
    media: []
    choiceId: 
  explanation: 'Solution: $a=dv/dt$.\n\nWhy it works: Acceleration is the time derivative of velocity.'
  tags:
  - derivative
  skills: []
  choices: []
- id: k1-r003
  type: typed
  prompt: What does the signed area under a velocity-time graph represent?
  answer:
    expected: displacement
    expectedLatex: ''
    aliases:
    - change in position
    media: []
    choiceId: 
  explanation: 'Solution: It represents displacement.\n\nWhy it works: Integrating velocity over time gives $\Delta x$.'
  tags:
  - integral
  skills: []
  choices: []
- id: k1-r004
  type: cloze
  prompt: 'Complete: $\Delta x=x_f\;\underline{\hspace{0.8cm}}\;x_i$.'
  answer:
    expected: '-'
    expectedLatex: '-'
    aliases:
    - minus
    - subtract
    media: []
    choiceId: 
  explanation: 'Solution: Insert a minus sign.\n\nWhy it works: Displacement is final position minus initial position.'
  tags:
  - position
  skills: []
  choices: []
- id: k1-r005
  type: typed
  prompt: On a position-time graph, what does the tangent slope represent?
  answer:
    expected: instantaneous velocity
    expectedLatex: ''
    aliases:
    - velocity
    media: []
    choiceId: 
  explanation: 'Solution: It represents instantaneous velocity.\n\nWhy it works: The derivative of position is the tangent slope and equals velocity.'
  tags:
  - graph
  skills: []
  choices: []
- id: k1-r006
  type: cloze
  prompt: With east positive, a westward velocity component is ____.
  answer:
