questions:
- id: q001
  type: freeResponse
  skills:
  - volumes-of-solids
  - olympiad-problem-solving
  prompt: Rotate the region under $y=3-x$ for $0\le x\le 3$ about the $x$-axis. Find the volume.
  answer:
    gradingMode: selfCheck
    expected: $\frac{\pi 27}{3}$.
    keyPoints:
    - 'Matches the reference result: $\frac{\pi 27}{3}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: Washers have radius $3-x$, hence $V=\pi\int_0^3(3-x)^2dx=\pi 27/3$.
