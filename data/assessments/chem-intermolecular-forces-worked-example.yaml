modeDefault: study
workedExamples:
  - id: we-identify-imf
    title: Identifying the Strongest Intermolecular Force
    problem: |
      For each of the following substances, identify the *dominant* (strongest) intermolecular force present in a pure sample: $Ne$, $CH_3Cl$, $HF$, $CBr_4$.
    steps:
      - id: s1-ne
        title: 'Neon (Ne)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the dominant IMF for Ne and continue.
        instruction: |
          **Substance:** $Ne$ (Neon)

          **Analysis:** Neon is a single atom (a noble gas). It is perfectly spherical and nonpolar.

          **Forces present:** Only **London dispersion forces**.

      - id: s2-ch3cl
        title: 'Chloromethane (CH₃Cl)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the dominant IMF for CH₃Cl and continue.
        instruction: |
          **Substance:** $CH_3Cl$

          **Analysis:** The molecule is tetrahedral but asymmetric (three C—H bonds, one C—Cl bond). It is a **polar** molecule. The H atoms are attached to C, not to N, O, or F, so it cannot hydrogen bond.

          **Forces present:** London dispersion + Dipole-dipole.

          **Dominant force:** **Dipole-dipole forces**.

      - id: s3-hf
        title: 'Hydrogen Fluoride (HF)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the dominant IMF for HF and continue.
        instruction: |
          **Substance:** $HF$

          **Analysis:** The molecule has a highly polar bond between H and F (the most electronegative element). Since H is directly covalently bonded to F, it satisfies the strict requirement for hydrogen bonding.

          **Forces present:** London dispersion + Dipole-dipole + Hydrogen bonding.

          **Dominant force:** **Hydrogen bonding**.

      - id: s4-cbr4
        title: 'Carbon Tetrabromide (CBr₄)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the dominant IMF for CBr₄ and continue.
        instruction: |
          **Substance:** $CBr_4$

          **Analysis:** Although the C—Br bond is slightly polar, the tetrahedral geometry is perfectly symmetric. The four bond dipoles cancel out exactly, making $CBr_4$ a **nonpolar** molecule.

          **Forces present:** Only **London dispersion forces**. (Note: because Br is large, these dispersion forces are actually quite strong, making $CBr_4$ a solid at room temperature.)

  - id: we-ranking-bp
    title: Ranking Boiling Points
    problem: |
      Arrange the following compounds in order of **increasing boiling point**:
      $CH_4$, $CH_3CH_2OH$, $C_3H_8$, $CH_3OCH_3$ (dimethyl ether).
    steps:
      - id: s5-assess-imfs
        title: Assess the IMFs of each molecule
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the IMF analysis and continue.
        instruction: |
          1. **$CH_4$ (Methane, ~16 g/mol):** Nonpolar. Only very weak London dispersion forces.
          2. **$C_3H_8$ (Propane, ~44 g/mol):** Nonpolar. Only London dispersion forces, but stronger than $CH_4$ due to higher molar mass/more electrons.
          3. **$CH_3OCH_3$ (Dimethyl ether, ~46 g/mol):** Bent geometry around O makes it polar. Dominant force: **Dipole-dipole**. (No H is attached directly to O, so no H-bonding).
          4. **$CH_3CH_2OH$ (Ethanol, ~46 g/mol):** Polar, and has an —OH group. Dominant force: **Hydrogen bonding**.

      - id: s6-compare-similar-mass
        title: Compare molecules with similar mass
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the mass comparison and continue.
        instruction: |
          Notice that propane ($C_3H_8$), dimethyl ether ($CH_3OCH_3$), and ethanol ($CH_3CH_2OH$) all have similar molar masses (44–46 g/mol). This means their London dispersion forces are roughly equal.

          We can rank them purely by the *type* of additional IMFs they possess:
          Nonpolar (dispersion only) < Polar (dipole-dipole) < H-bonding

      - id: s7-final-ranking
        title: Final BP Ranking
        type: multipleChoice
        answer:
          choiceId: c
        prompt: |
          Based on the analysis, which is the correct ranking from lowest to highest boiling point?
        choices:
          - id: a
            text: '$CH_4 < CH_3OCH_3 < C_3H_8 < CH_3CH_2OH$'
          - id: b
            text: '$C_3H_8 < CH_4 < CH_3OCH_3 < CH_3CH_2OH$'
          - id: c
            text: '$CH_4 < C_3H_8 < CH_3OCH_3 < CH_3CH_2OH$'
          - id: d
            text: '$CH_3CH_2OH < CH_3OCH_3 < C_3H_8 < CH_4$'
        instruction: |
          Ranking from weakest to strongest IMFs (lowest to highest BP):
          1. **$CH_4$**: Weakest dispersion (smallest)
          2. **$C_3H_8$**: Stronger dispersion (larger mass)
          3. **$CH_3OCH_3$**: Dipole-dipole (polar, similar mass to propane)
          4. **$CH_3CH_2OH$**: Hydrogen bonding (strongest IMF of the group)

          **Result:** $CH_4$ (−161°C) < $C_3H_8$ (−42°C) < $CH_3OCH_3$ (−24°C) < $CH_3CH_2OH$ (78°C).
