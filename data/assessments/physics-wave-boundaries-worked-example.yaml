    - id: b
      text: $0.30\ \text{m}$
      media: []
      issueSignals: []
    - id: c
      text: $-0.30\ \text{m}$
      media: []
      issueSignals: []
    - id: d
      text: $0.15\ \text{m}$
      media: []
      issueSignals: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: The endpoint displacement is zero. Why it works: equal opposite pulses cancel at the fixed boundary. Why the other choices fail: nonzero choices violate the fixed-end constraint.'
