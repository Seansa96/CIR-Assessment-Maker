- id: pulse-boundary-comparison
  title: Compare two reflected string pulses
  problem: >
    An upward pulse travels rightward along a taut string. In trial A, the string is attached to a rigid wall. In trial B, it passes through a light ring that can move vertically on a frictionless pole.


    ![Pulse reflection at fixed and free boundaries](/media/physics/owa/wave-boundaries.svg)


    Predict the reflected pulse in each trial and explain the boundary conditions.
  steps:
  - id: identify-fixed
    title: Identify the fixed-end constraint
    instruction: A wall holds the endpoint at one position, so the endpoint displacement must remain zero while the pulse arrives and reflects.
    hint: 
    type: multipleChoice
    prompt: 'At a fixed boundary, an incident upward crest reflects as a:'
    choices:
    - id: a
      text: upward crest
      media: []
      issueSignals: []
    - id: b
      text: downward trough
      media: []
      issueSignals: []
    answer:
      choiceId: b
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The reflected pulse is a downward trough.


      Why it works: The reflected displacement must cancel the incident displacement at the fixed endpoint, producing inversion.


      Why the other choices fail: An upright reflection would add displacement at the wall and violate the fixed-end condition.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: identify-free
    title: Identify the free-end constraint
    instruction: The ring can move vertically. The ideal free end has no transverse support force that requires its displacement to stay zero.
    hint: 
    type: multipleChoice
    prompt: 'At a free boundary, an incident upward crest reflects as a:'
    choices:
    - id: a
      text: upward crest
      media: []
      issueSignals: []
    - id: b
      text: downward trough
      media: []
      issueSignals: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: The reflected pulse remains an upward crest.


      Why it works: A free end can move with the incident disturbance, so the reflected pulse is in phase rather than inverted.


      Why the other choices fail: Inversion belongs to the fixed-end constraint, not to every reflection.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: compare-speed
    title: Separate reflection from wave speed
    instruction: The boundary changes the reflected pulse's phase relation. It does not by itself change the wave speed on the same uniform string.
    hint: 
    type: multipleChoice
    prompt: Which property differs between these ideal reflected pulses?
    choices:
    - id: a
      text: phase relative to the incident pulse
      media: []
      issueSignals: []
    - id: b
      text: the string's wave speed everywhere
      media: []
      issueSignals: []
    - id: c
      text: the source frequency before reflection
      media: []
      issueSignals: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Their phase relation differs.


      Why it works: Fixed and free constraints determine inversion; the string's tension and linear density set its wave speed.


      Why the other choices fail: Neither boundary changes the already-driven source frequency or the uniform-string speed by itself.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: transmission
    title: Extend the model to a medium boundary
    instruction: A joint between two strings is not a perfectly fixed or perfectly free end. Some incident energy can reflect and some can transmit into the second string.
    hint: 
    type: multipleChoice
    prompt: At a boundary between two different strings, which statement is most accurate?
    choices:
    - id: a
      text: All wave energy must reflect.
      media: []
      issueSignals: []
    - id: b
      text: Reflection and transmission can both occur.
      media: []
      issueSignals: []
    - id: c
      text: A boundary eliminates the wave's frequency.
      media: []
      issueSignals: []
    answer:
      choiceId: b
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Reflection and transmission can both occur.


      Why it works: A medium boundary can split the incident wave energy between reflected and transmitted disturbances.


      Why the other choices fail: Perfect reflection is only a limiting case, and the driving frequency is not eliminated by a boundary.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
- id: boundary-inversion-we002
  title: Pulse Reflection at a Fixed End
  problem: An upward pulse of amplitude $0.15\ \text{m}$ reaches a fixed end. State the reflected pulse amplitude using upward as positive.
  steps:
  - id: boundary-inversion-we002-step-1
    title: Apply the fixed-end condition
    instruction: A fixed end inverts the reflected pulse, so reverse the sign of the amplitude.
    hint: 
    type: numericResponse
    prompt: What is the reflected pulse amplitude in meters?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: -0.15
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: The reflected amplitude is $-0.15\ \text{m}$. Why it works: a fixed boundary must have zero displacement, so the reflected pulse is inverted.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: boundary-inversion-we002-step-2
    title: Identify the interference at the end
    instruction: Add the incident and reflected displacements at the fixed endpoint when they fully overlap.
    hint: 
    type: multipleChoice
    prompt: When incident and reflected pulses fully overlap at the fixed endpoint, what is the endpoint displacement?
    choices:
    - id: a
      text: Zero
      media: []
