workedExamples:
- id: we-cam-1
  title: Figure Skater Spin
  problem: A figure skater is spinning at $2.0 \text{ rev/s}$ with her arms extended.
    Her moment of inertia is $2.5 \text{ kg}\cdot\text{m}^2$. She pulls her arms in,
    reducing her moment of inertia to $1.0 \text{ kg}\cdot\text{m}^2$.
  steps:
  - id: we-cam-1-step1
    title: 'Step 1: Conservation Equation'
    instruction: Since no external torque acts, $I_1\omega_1 = I_2\omega_2$. Calculate
      the new angular velocity in rev/s.
    prompt: What is her new spin rate?
    type: numericResponse
    answer:
      value: 5.0
      tolerance: 0.1
    explanation: |
      Solution:

      $$
      \omega_2=\frac{I_1}{I_2}\omega_1
      =\frac{2.5}{1.0}(2.0)=5.0\ \text{rev/s}.
      $$

      Why it works: With negligible external torque, $I_1\omega_1=I_2\omega_2$. Reducing the moment of inertia requires a larger angular velocity to preserve angular momentum.
  - id: we-cam-1-step2
    title: 'Step 2: Change in Kinetic Energy'
    instruction: Calculate the ratio of the final kinetic energy to the initial kinetic
      energy.
    prompt: What is $K_f / K_i$?
    type: numericResponse
    answer:
      value: 2.5
      tolerance: 0.1
    explanation: |
      Solution:

      $$
      K_i=\frac12I_1\omega_1^2,\qquad
      K_f=\frac12I_2\left(\frac{I_1}{I_2}\omega_1\right)^2
      =\frac{I_1}{I_2}K_i.
      $$

      Therefore,

      $$
      \frac{K_f}{K_i}=\frac{2.5}{1.0}=2.5.
      $$

      Why it works: Angular momentum is conserved, but rotational kinetic energy need not be. The skater does work while pulling her arms inward, increasing the kinetic energy.

- id: cal-we002
  title: Skater Inertia Change
  problem: 'A skater has $I_i=4.0\ \mathrm{kg\,m^2}$ and $\omega_i=2.0$ rad/s. She pulls inward to $I_f=1.0\ \mathrm{kg\,m^2}$ with negligible external torque. Find final angular speed.'
  steps:
  - id: calwe3
    title: Calculate initial angular momentum
    instruction: Use $L_i=I_i\omega_i$.
    type: numericResponse
    prompt: What is initial angular momentum?
    answer: { value: 8, tolerance: 0.01 }
    explanation: 'Solution: $L_i=(4.0)(2.0)=8.0$ kg m$^2$/s.\n\nWhy it works: Fixed-axis angular momentum is $I\omega$.'
  - id: calwe4
    title: Apply conservation
    instruction: Set $I_i\omega_i=I_f\omega_f$.
    type: numericResponse
    prompt: What is final angular speed in rad/s?
    answer: { value: 8, tolerance: 0.01 }
    explanation: 'Solution: $\omega_f=8.0/1.0=8.0$ rad/s.\n\nWhy it works: With no external torque, angular momentum remains constant.'
