lesson:
  introduction: This lesson develops Sound Waves from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      Sound waves are mechanical, longitudinal waves that propagate through a medium (gas, liquid, or solid). In a gas, the physical system involves regions of compression (high pressure/density) and rarefaction (low pressure/density) created by an oscillating source.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s1-check, type: multipleChoice, prompt: 'Which relation is central to sound waves?', choices: [{id: a, text: '$v=f\\lambda$'}, {id: b, text: '$v=f/\\lambda$'}, {id: c, text: '$v=0$'}, {id: d, text: 'No medium is needed'}], answer: {choiceId: a}, explanation: 'Wave speed equals frequency times wavelength.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The primary measurable quantities are displacement $s$ of the medium's particles from equilibrium, and the gauge pressure $\Delta P$, which is the variation in pressure above or below the ambient pressure.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s2-check, type: multipleChoice, prompt: 'Which relation is central to sound waves?', choices: [{id: a, text: '$v=f\\lambda$'}, {id: b, text: '$v=f/\\lambda$'}, {id: c, text: '$v=0$'}, {id: d, text: 'No medium is needed'}], answer: {choiceId: a}, explanation: 'Wave speed equals frequency times wavelength.'}
  - id: s3
    title: Mathematical model
    content: >-
      Mathematically, if the displacement of particles is given by a cosine function $s(x,t) = s_{\text{max}} \cos(kx - \omega t)$, the resulting pressure variation is a sine function: $\Delta P(x,t) = \Delta P_{\text{max}} \sin(kx - \omega t)$.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s3-check, type: multipleChoice, prompt: 'Which relation is central to sound waves?', choices: [{id: a, text: '$v=f\\lambda$'}, {id: b, text: '$v=f/\\lambda$'}, {id: c, text: '$v=0$'}, {id: d, text: 'No medium is needed'}], answer: {choiceId: a}, explanation: 'Wave speed equals frequency times wavelength.'}
  - id: s4
    title: Calculus connection
    content: >-
      Calculus connects displacement and pressure via the bulk modulus $B$ of the fluid: $\Delta P = -B \frac{\partial s}{\partial x}$. Differentiating the cosine displacement function yields the sine pressure function, showing that pressure is exactly $90^\circ$ out of phase with displacement.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s4-check, type: multipleChoice, prompt: 'Which relation is central to sound waves?', choices: [{id: a, text: '$v=f\\lambda$'}, {id: b, text: '$v=f/\\lambda$'}, {id: c, text: '$v=0$'}, {id: d, text: 'No medium is needed'}], answer: {choiceId: a}, explanation: 'Wave speed equals frequency times wavelength.'}
  - id: s5
    title: Derivation or justification
    content: >-
      By substituting the derivative into the bulk modulus equation, we can derive the maximum pressure amplitude: $\Delta P_{\text{max}} = B k s_{\text{max}}$. Since $v = \sqrt{B/\rho}$ and $v = \omega/k$, this is often rewritten as $\Delta P_{\text{max}} = \rho v \omega s_{\text{max}}$.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s5-check, type: multipleChoice, prompt: 'Which relation is central to sound waves?', choices: [{id: a, text: '$v=f\\lambda$'}, {id: b, text: '$v=f/\\lambda$'}, {id: c, text: '$v=0$'}, {id: d, text: 'No medium is needed'}], answer: {choiceId: a}, explanation: 'Wave speed equals frequency times wavelength.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, when displacement $s=0$ (particles are in their equilibrium positions but moving fast), the pressure variation $\Delta P$ is at a maximum or minimum, because particles are crowding into or spreading away from that location.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s6-check, type: multipleChoice, prompt: 'Which relation is central to sound waves?', choices: [{id: a, text: '$v=f\\lambda$'}, {id: b, text: '$v=f/\\lambda$'}, {id: c, text: '$v=0$'}, {id: d, text: 'No medium is needed'}], answer: {choiceId: a}, explanation: 'Wave speed equals frequency times wavelength.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A quantitative strategy when dealing with sound is to recognize whether a sensor (like a microphone or ear) is responding to displacement or pressure. Human ears respond to pressure variations $\Delta P$, not direct displacement $s$.
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s7-check, type: multipleChoice, prompt: 'Which relation is central to sound waves?', choices: [{id: a, text: '$v=f\\lambda$'}, {id: b, text: '$v=f/\\lambda$'}, {id: c, text: '$v=0$'}, {id: d, text: 'No medium is needed'}], answer: {choiceId: a}, explanation: 'Wave speed equals frequency times wavelength.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: Sound cannot travel in a vacuum because there are no particles to displace (density $\rho = 0$). Units check: $\Delta P_{\text{max}}$ yields $\text{kg/m}^3 \cdot \text{m/s} \cdot \text{rad/s} \cdot \text{m} = \text{kg/(m}\cdot\text{s}^2)$, which is Pascals (Pa).
    media:
    - type: image
      src: /media/physics/owa/sound-waves.svg
      alt: Labeled original schematic for Sound Waves used for quantitative analysis.
      caption: Sound Waves model diagram.
    check: {id: sound-waves-s8-check, type: multipleChoice, prompt: 'When sound enters a new medium, what remains fixed by the source?', choices: [{id: a, text: 'Frequency'}, {id: b, text: 'Wave speed'}, {id: c, text: 'Wavelength'}, {id: d, text: 'Intensity'}], answer: {choiceId: a}, explanation: 'Source frequency is preserved at a medium boundary.'}
