items:
  - { id: r1, type: typed, prompt: 'State the VSEPR domain-counting rule for a multiple bond.', answer: { expected: 'it counts as one electron domain', aliases: ['one domain', '1 domain'] }, explanation: 'Solution: A multiple bond counts as one domain. Why it works: It occupies one direction around the selected atom.' }
  - { id: r2, type: typed, prompt: 'Name the electron geometry for three total domains.', answer: { expected: 'trigonal planar' }, explanation: 'Solution: Trigonal planar. Why it works: Three domains spread in one plane near 120 degrees.' }
  - { id: r3, type: typed, prompt: 'Name the molecular geometry of AX2E.', answer: { expected: 'bent', aliases: ['angular'] }, explanation: 'Solution: Bent. Why it works: Three domains are trigonal planar, but only two atom positions are named.' }
  - { id: r4, type: typed, prompt: 'Give the electron and molecular geometries of AX3E.', answer: { expected: 'tetrahedral and trigonal pyramidal', aliases: ['tetrahedral; trigonal pyramidal'] }, explanation: 'Solution: Tetrahedral electron geometry and trigonal-pyramidal molecular geometry. Why it works: Four total domains include one lone pair.' }
  - { id: r5, type: typed, prompt: 'State the ideal tetrahedral angle.', answer: { expected: '109.5 degrees', aliases: ['109.5'] }, explanation: 'Solution: 109.5 degrees. Why it works: Four equivalent directions maximize separation tetrahedrally.' }
  - { id: r6, type: typed, prompt: 'Why do lone pairs commonly compress adjacent bond angles?', answer: { expected: 'they repel bonding domains more strongly', aliases: ['lone pairs occupy more angular space'] }, explanation: 'Solution: Lone-pair domains repel bonding domains more strongly. Why it works: Their electron density is localized near one nucleus rather than shared between two.' }
  - { id: r7, type: typed, prompt: 'Name the five-domain electron geometry.', answer: { expected: 'trigonal bipyramidal' }, explanation: 'Solution: Trigonal bipyramidal. Why it works: Five directions form three equatorial and two axial sites.' }
  - { id: r8, type: typed, prompt: 'Where does the first lone pair go in a trigonal bipyramid?', answer: { expected: 'an equatorial position', aliases: ['equatorial'] }, explanation: 'Solution: An equatorial position. Why it works: It has two rather than three 90-degree interactions.' }
  - { id: r9, type: typed, prompt: 'Name the molecular geometry of AX3E2.', answer: { expected: 'T-shaped', aliases: ['t shaped'] }, explanation: 'Solution: T-shaped. Why it works: Two equatorial lone pairs leave two axial atoms and one equatorial atom.' }
  - { id: r10, type: typed, prompt: 'Name the electron geometry and molecular geometry of AX4E2.', answer: { expected: 'octahedral and square planar', aliases: ['octahedral; square planar'] }, explanation: 'Solution: Octahedral and square planar. Why it works: Two opposite lone pairs are omitted from the six-domain arrangement.' }
  - { id: r11, type: typed, prompt: 'Which atom is analyzed for an A-B-C bond angle?', answer: { expected: 'B', aliases: ['the middle atom', 'the angle vertex'] }, explanation: 'Solution: B, the middle atom. Why it works: Its local domains define the angle at the vertex.' }
  - { id: r12, type: typed, prompt: 'State the VSEPR rule for a molecule with several central atoms.', answer: { expected: 'analyze each center separately', aliases: ['one center at a time', 'use local geometries'] }, explanation: 'Solution: Analyze each center separately. Why it works: A molecule can contain several distinct local domain inventories.' }
