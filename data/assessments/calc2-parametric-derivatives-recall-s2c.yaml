items:
  - { id: q001, type: cloze, prompt: 'For parametric functions, $dy/dx$ equals ____ divided by ____.', answer: { expected: 'dy dt; dx dt', aliases: ['dy/dt; dx/dt'] }, explanation: 'Solution: dy/dt over dx/dt. Why it works: Slope is vertical rate per horizontal rate. Common trap: Inverting the ratio.' }
  - { id: q002, type: typed, prompt: 'State the derivative condition for a horizontal tangent.', answer: { expected: 'dy dt zero dx dt nonzero', aliases: ['dy/dt=0 and dx/dt not equal to 0'] }, explanation: 'Solution: dy/dt equals zero while dx/dt is nonzero. Why it works: This makes slope zero. Common trap: Ignoring the denominator condition.' }
  - { id: q003, type: typed, prompt: 'State the derivative condition for a vertical tangent.', answer: { expected: 'dx dt zero dy dt nonzero', aliases: ['dx/dt=0 and dy/dt not equal to 0'] }, explanation: 'Solution: dx/dt equals zero while dy/dt is nonzero. Why it works: This makes slope undefined. Common trap: Swapping the horizontal condition.' }
  - { id: q004, type: cloze, prompt: 'If both component derivatives are zero, the slope form is ____ over ____ and needs further analysis.', answer: { expected: 'zero; zero', aliases: ['0;0', '0/0'] }, explanation: 'Solution: The form is zero over zero. Why it works: It is indeterminate rather than automatically horizontal or vertical. Common trap: Assigning it slope zero.' }
  - { id: q005, type: recognition, prompt: 'The highlighted line in the diagram is tangent to the curve. Which component-rate condition makes it vertical?', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Curve and tangent line }], choices: [{ id: a, text: 'x-prime equals zero and y-prime is nonzero' }, { id: b, text: 'y-prime equals zero and x-prime is nonzero' }], answer: { choiceId: a, expected: 'x prime zero y prime nonzero', aliases: ['dx/dt=0 dy/dt nonzero'] }, explanation: 'Solution: The first condition is vertical. Why it works: Horizontal position is momentarily fixed while vertical position changes. Common trap: Treating the visual line as a horizontal-tangent example.' }
