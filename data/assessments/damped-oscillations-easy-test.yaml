- id: q009
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A mass of 5.93 kg is attached to a horizontal spring with constant 406.6
    N/m on a frictionless table. Calculate the angular frequency in rad/s.
  answer:
    value: 8.2805
    tolerance: 0.05
  explanation: |
    Solution: $\omega=\sqrt{k/m}=\sqrt{406.6/5.93}=8.2805\text{ rad/s}$.

    Why it works: Stiffness divided by mass determines the squared angular frequency.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Evaluates the angular-frequency relation.
- id: q010
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: In a microgravity experiment, a 7.04 kg sample oscillates on a spring of
    stiffness 215.6 N/m. What is the period of oscillation in seconds?
  answer:
    value: 1.1354
    tolerance: 0.05
  explanation: |
    Solution: $T=2\pi\sqrt{m/k}=2\pi\sqrt{7.04/215.6}=1.1354\text{ s}$.

    Why it works: Gravity does not appear in the ideal horizontal spring period, so the same relation applies in microgravity.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  difficultyEvidence: Transfers the spring-period model to a microgravity setting.
