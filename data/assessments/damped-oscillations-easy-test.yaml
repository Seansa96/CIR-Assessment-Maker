questions:
- id: q001
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A mass of 8.49 kg is attached to a horizontal spring with constant 305.8
    N/m on a frictionless table. If the amplitude is 0.368 m, what is the maximum
    speed in m/s?
  answer:
    value: 2.2086
    tolerance: 0.05
  explanation: |
    Solution: $v_{\max}=A\sqrt{k/m}=(0.368)\sqrt{305.8/8.49}=2.2086\text{ m/s}$.

    Why it works: In ideal spring motion, maximum speed is amplitude times angular frequency.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Evaluates the spring-mass speed model.
- id: q002
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: An industrial suspension system features a spring of 271.0 N/m supporting
    a load of 9.78 kg. What is the period of oscillation in seconds?
  answer:
    value: 1.1936
    tolerance: 0.05
  explanation: |
    Solution: $T=2\pi\sqrt{m/k}=2\pi\sqrt{9.78/271.0}=1.1936\text{ s}$.

    Why it works: The ideal mass-spring period depends on inertia and stiffness.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Evaluates the spring-mass period model.
- id: q003
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: An industrial suspension system features a spring of 117.5 N/m supporting
    a load of 4.05 kg. Calculate the angular frequency in rad/s.
  answer:
    value: 5.3863
    tolerance: 0.05
  explanation: |
    Solution: $\omega=\sqrt{k/m}=\sqrt{117.5/4.05}=5.3863\text{ rad/s}$.

    Why it works: Angular frequency follows from the ratio of stiffness to mass.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Evaluates the spring-mass frequency model.
- id: q004
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A 2.37 kg sensor is oscillating on a delicate tether with effective stiffness
    25.7 N/m. Calculate the angular frequency in rad/s.
  answer:
    value: 3.293
    tolerance: 0.05
  explanation: |
    Solution: $\omega=\sqrt{k/m}=\sqrt{25.7/2.37}=3.2930\text{ rad/s}$.

    Why it works: Effective stiffness supplies the restoring part of the spring-mass model.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Maps the tether description to an effective spring model.
- id: q005
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A mass of 3.62 kg is attached to a horizontal spring with constant 338.4
    N/m on a frictionless table. What is the period of oscillation in seconds?
  answer:
    value: 0.6499
    tolerance: 0.05
  explanation: |
    Solution: $T=2\pi\sqrt{m/k}=2\pi\sqrt{3.62/338.4}=0.6499\text{ s}$.

    Why it works: The spring-mass period is $2\pi\sqrt{m/k}$.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Evaluates the period relation.
- id: q006
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A 1.11 kg sensor is oscillating on a delicate tether with effective stiffness
