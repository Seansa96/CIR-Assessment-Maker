- id: q007
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: An industrial suspension system features a spring of 187.2 N/m supporting
    a load of 8.87 kg. If the amplitude is 0.355 m, what is the maximum speed in m/s?
  answer:
    value: 1.6309
    tolerance: 0.05
  explanation: |
    Solution: $v_{\max}=A\sqrt{k/m}=(0.355)\sqrt{187.2/8.87}=1.6309\text{ m/s}$.

    Why it works: Maximum speed occurs at equilibrium and equals $A\omega$ for ideal simple harmonic motion.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: Combines the amplitude and frequency relations.
- id: q008
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A vehicle's strut of 268.6 N/m supports a quarter of the car's mass, which
