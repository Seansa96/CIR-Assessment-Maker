questions:
- id: q001
  type: multipleChoice
  prompt: Which annotation correctly reads 'If a number is divisible by 4, then it is even'?
  choices:
  - id: a
    text: The hypothesis is divisibility by 4; the conclusion is evenness.
  - id: b
    text: The hypothesis is evenness; the conclusion is divisibility by 4.
    issueSignals:
    - id: reversed-implication
  - id: c
    text: Both directions are automatically proved.
    issueSignals:
    - id: reversed-implication
  - id: d
    text: The statement is a definition.
    issueSignals:
    - id: reversed-implication
  answer:
    choiceId: a
  issueSignals:
  - id: reversed-implication
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: The hypothesis is divisibility by 4; the conclusion is evenness.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
- id: q005
  type: multipleChoice
  prompt: For “If P, then Q,” which statement is the contrapositive used in a contrapositive proof?
  choices:
  - id: a
    text: If not Q, then not P.
  - id: b
    text: If Q, then P.
    issueSignals: [{id: converse-confusion}]
  - id: c
    text: If not P, then not Q.
    issueSignals: [{id: inverse-confusion}]
  - id: d
    text: If P, then not Q.
    issueSignals: [{id: conclusion-negation-error}]
  answer: {choiceId: a}
  difficultyDimensions: [representationTransfer, conditionChecking]
  difficultyEvidence: Distinguishes the equivalent contrapositive from the converse and inverse.
  explanation: |-
    Solution: If not Q, then not P.
    Why it works: This is the logically equivalent conditional described in the packet.
    Why the other choices fail: B is the converse, C the inverse, and D negates only the conclusion.
- id: q006
  type: multipleChoice
  prompt: A contrapositive proof of “If P, then Q” should begin by assuming which statement?
  choices:
  - id: a
    text: Not Q.
  - id: b
    text: The original hypothesis $P$.
    issueSignals: [{id: direct-proof-assumption}]
  - id: c
    text: The original conclusion $Q$.
    issueSignals: [{id: conclusion-assumption}]
  - id: d
    text: Not P.
    issueSignals: [{id: inverse-assumption}]
  answer: {choiceId: a}
  difficultyDimensions: [argumentMapping, conditionChecking]
  difficultyEvidence: Identifies the opening assumption in the reviewed contrapositive outline.
  explanation: |-
    Solution: Not Q.
    Why it works: The method proves “if not Q, then not P.”
    Why the other choices fail: B begins a direct proof; C and D are not the contrapositive hypothesis.
- id: q007
  type: multipleChoice
  prompt: After assuming not Q in a contrapositive proof of “If P, then Q,” what must be derived?
  choices:
  - id: a
    text: Not P.
  - id: b
    text: The original hypothesis $P$ rather than its negation.
    issueSignals: [{id: contradiction-target-error}]
  - id: c
    text: The original conclusion $Q$ rather than the required negation.
    issueSignals: [{id: circular-conclusion}]
  - id: d
    text: A converse statement.
    issueSignals: [{id: converse-confusion}]
  answer: {choiceId: a}
  difficultyDimensions: [argumentMapping, representationTransfer]
  difficultyEvidence: Tracks the correct endpoint of the packet's contrapositive proof outline.
  explanation: |-
    Solution: Not P.
    Why it works: That completes the conditional “if not Q, then not P.”
    Why the other choices fail: B and C reverse the intended direction; D changes the theorem.
- id: q008
  type: multipleChoice
  prompt: Why is proving “If Q, then P” not generally a proof of “If P, then Q”?
  choices:
  - id: a
    text: It is the converse, rather than the logically equivalent contrapositive.
  - id: b
    text: It has too many negations.
    issueSignals: [{id: negation-counting-error}]
  - id: c
    text: Every conditional is automatically reversible.
    issueSignals: [{id: conditional-reversibility-error}]
  - id: d
    text: It is a definition instead of a statement.
    issueSignals: [{id: role-confusion}]
  answer: {choiceId: a}
  difficultyDimensions: [conventionRecognition, representationTransfer]
  difficultyEvidence: Uses the packet's converse-versus-contrapositive distinction.
  explanation: |-
    Solution: It is the converse, rather than the logically equivalent contrapositive.
    Why it works: Only the contrapositive preserves the original conditional's truth conditions.
    Why the other choices fail: B is irrelevant, C is false, and D misclassifies the statement.
- id: q009
  type: multipleChoice
  prompt: In the parity example, why must an algebraic step be justified before the conclusion is stated?
  choices:
  - id: a
    text: Each step must provide a valid link from the assumption to the claimed conclusion.
  - id: b
    text: Algebraic symbols make any conclusion valid.
    issueSignals: [{id: symbol-authority-error}]
  - id: c
    text: The conclusion may be stated before the calculation is checked.
    issueSignals: [{id: conclusion-before-justification}]
  - id: d
    text: Definitions never matter in parity arguments.
    issueSignals: [{id: definition-dismissal}]
  answer: {choiceId: a}
  difficultyDimensions: [argumentMapping, conditionChecking]
  difficultyEvidence: Applies the reviewed requirement that parity proof steps be licensed by definitions or algebra.
  explanation: |-
    Solution: Each step must provide a valid link from the assumption to the claimed conclusion.
    Why it works: The packet requires definitions or algebra to justify each inference.
    Why the other choices fail: B grants symbols unwarranted force, C reverses proof order, and D rejects needed definitions.
- id: q010
  type: multipleChoice
  prompt: Which proof plan directly proves “If P, then Q” rather than its contrapositive?
  choices:
  - id: a
    text: Assume P and derive Q through justified steps.
  - id: b
    text: Assume not Q and derive not P.
    issueSignals: [{id: method-label-confusion}]
  - id: c
    text: Assume Q and derive P.
    issueSignals: [{id: converse-proof}]
  - id: d
    text: Assume not P and derive not Q.
    issueSignals: [{id: inverse-proof}]
  answer: {choiceId: a}
  difficultyDimensions: [argumentMapping, methodSelection]
  difficultyEvidence: Contrasts the direct proof plan with contrapositive, converse, and inverse patterns.
  explanation: |-
    Solution: Assume P and derive Q through justified steps.
    Why it works: Direct proof begins from the original hypothesis and reaches its conclusion.
    Why the other choices fail: B is contrapositive; C proves a converse; D proves an inverse.
- id: q002
  type: multipleChoice
  prompt: Which sentence is the correct negation of 'Every member of a set S has property P'?
  choices:
  - id: a
    text: At least one member of S does not have property P.
  - id: b
    text: Every member of S lacks property P.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: At least one member of S has property P.
    issueSignals:
    - id: quantifier-scope-error
  - id: d
    text: The set S is empty.
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: At least one member of S does not have property P.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
- id: q003
  type: multipleChoice
  prompt: A text gives one value that satisfies a definition. What has it established?
  choices:
  - id: a
    text: An example, not a proof that every value satisfies the claim.
  - id: b
    text: A proof of every related theorem.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: A counterexample to the definition.
    issueSignals:
    - id: example-as-proof
  - id: d
    text: A converse implication.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: An example, not a proof that every value satisfies the claim.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
- id: q004
  type: multipleChoice
  prompt: A proof says 'therefore' after introducing a new claim with no cited reason. What should a careful reader
    do?
  choices:
  - id: a
    text: Ask which definition, hypothesis, or earlier result licenses the step.
  - id: b
    text: Accept it because mathematical prose is concise.
    issueSignals:
    - id: unjustified-inference
  - id: c
    text: Treat the new claim as a definition.
    issueSignals:
    - id: unjustified-inference
  - id: d
    text: Reverse the preceding implication.
    issueSignals:
    - id: unjustified-inference
  answer:
    choiceId: a
  issueSignals:
  - id: unjustified-inference
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: Requires interpreting a claim's role and rejecting a specific reading error.
  explanation: |-
    Solution: Ask which definition, hypothesis, or earlier result licenses the step.
    Why it works: Careful mathematical reading preserves logical direction, scope, and stated reasons.
    Why the other choices fail: Each distractor changes the claim's role, scope, or evidentiary standard.
