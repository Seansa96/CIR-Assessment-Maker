    - type: image
      src: /assessments/operating-systems/design/mechanism-policy-split.svg
      alt: Mechanism and policy split with context switch versus scheduling rule example.
      caption: Mechanism provides operations; policy chooses behavior.
  - id: evolution
    title: Evolution and compatibility
    required: true
    content: 'Operating systems survive by evolving while preserving enough compatibility for existing programs and users.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
