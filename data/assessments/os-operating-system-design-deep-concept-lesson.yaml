    - type: image
      src: /assessments/operating-systems/design/kernel-structures-comparison.svg
      alt: Monolithic, microkernel, and layered kernel structures compared side by side.
      caption: Kernel structure choices trade call speed, isolation, and reasoning boundaries.
  - id: performance
    title: Performance techniques
    required: true
    content: 'Caching, batching, fast paths, locality, and avoiding copies improve speed but complicate correctness.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: performance-deep-check
      title: 'Check: Performance techniques'
      type: multipleChoice
