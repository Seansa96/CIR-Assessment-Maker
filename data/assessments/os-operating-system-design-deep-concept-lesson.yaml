lesson:
  introduction: This deeper lesson expands Operating System Design from Chapter 12 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: requirements
    title: Design requirements
    required: true
    content: 'OS design balances reliability, security, compatibility, performance, portability, and maintainability.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: requirements-deep-check
      title: 'Check: Design requirements'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Design requirements**?
      choices:
      - id: a
        text: Optimizing one goal can stress another.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Optimizing one goal can stress another. Related topic: Operating System Design.'
  - id: abstraction
    title: Abstraction choice
    required: true
    content: 'A good abstraction hides accidental hardware complexity while exposing the control programs actually need.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: abstraction-deep-check
      title: 'Check: Abstraction choice'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Abstraction choice**?
      choices:
      - id: a
        text: Too much hiding can block performance.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Too much hiding can block performance. Related topic: Operating System Design.'
  - id: modularity
    title: Modularity
    required: true
    content: 'Module boundaries reduce reasoning load but can impose overhead when communication crosses them too often.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Design, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: modularity-deep-check
      title: 'Check: Modularity'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Modularity**?
      choices:
      - id: a
        text: Boundaries are design tools with costs.
      - id: b
