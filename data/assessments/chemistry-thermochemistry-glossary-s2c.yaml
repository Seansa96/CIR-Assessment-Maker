glossary:
  introduction: Use these terms to make quantitative chemistry decisions precisely.
  sections:
  - id: terms
    title: Core terms
    entries:
    - id: e1
      term: system
      definition: The portion selected for study.
      drills:
      - id: d1
        type: flashcard
        prompt: Define system.
        answer:
          expected: portion selected for study
        explanation: 'Solution: portion selected for study. Why it works: The portion selected for study.'
    - id: e2
      term: surroundings
      definition: Everything outside the system.
      drills:
      - id: d2
        type: flashcard
        prompt: Define surroundings.
        answer:
          expected: everything outside the system
        explanation: 'Solution: everything outside the system. Why it works: Everything outside the system.'
    - id: e3
      term: calorimetry
      definition: Heat measurement using temperature change.
      drills:
      - id: d3
        type: flashcard
        prompt: Define calorimetry.
        answer:
          expected: heat measurement
        explanation: 'Solution: heat measurement. Why it works: Heat measurement using temperature change.'
    - id: e4
      term: enthalpy
      definition: Heat change at constant pressure.
      drills:
      - id: d4
        type: flashcard
        prompt: Define enthalpy.
        answer:
          expected: heat change at constant pressure
        explanation: 'Solution: heat change at constant pressure. Why it works: Heat change at constant pressure.'
    - id: e5
      term: Hess's law
      definition: Overall enthalpy is the sum of pathway enthalpies.
      drills:
      - id: d5
        type: flashcard
        prompt: Define Hess's law.
        answer:
          expected: pathway enthalpies add
        explanation: 'Solution: pathway enthalpies add. Why it works: Overall enthalpy is the sum of pathway enthalpies.'
    - id: e6
      term: formation enthalpy
      definition: Enthalpy for forming one mole from elements in standard states.
      drills:
      - id: d6
        type: flashcard
        prompt: Define formation enthalpy.
        answer:
          expected: formation from elements
        explanation: 'Solution: formation from elements. Why it works: Enthalpy for forming one mole from elements in standard
          states.'
