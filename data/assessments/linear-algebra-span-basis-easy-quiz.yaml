questions:
  - id: easy-span-def
    type: multipleChoice
    prompt: |
      What is the span of a single non-zero vector $\vec{v}$ in $\mathbb{R}^3$?
    choices:
      - id: c1
        text: 'A point'
      - id: c2
        text: 'A line passing through the origin'
      - id: c3
        text: 'A plane passing through the origin'
      - id: c4
        text: 'The entire $\mathbb{R}^3$ space'
    answer:
      choiceId: c2
    explanation: |
      The span of a single vector consists of all scalar multiples $c\vec{v}$, which traces out a line through the origin.

  - id: easy-indep-check
    type: multipleChoice
    prompt: |
      Are the vectors $\vec{v}_1 = \begin{bmatrix} 2 \\ 4 \end{bmatrix}$ and $\vec{v}_2 = \begin{bmatrix} 1 \\ 2 \end{bmatrix}$ linearly independent?
    choices:
      - id: c1
        text: 'Yes, because neither vector is the zero vector.'
      - id: c2
        text: 'Yes, because they point in the same direction.'
      - id: c3
        text: 'No, because $\vec{v}_1$ is a scalar multiple of $\vec{v}_2$.'
      - id: c4
        text: 'No, because they span $\mathbb{R}^2$.'
    answer:
      choiceId: c3
    explanation: |
      Notice that $\vec{v}_1 = 2\vec{v}_2$. Because one is a scalar multiple of the other, they are linearly dependent.

  - id: easy-basis-def
    type: multipleChoice
    prompt: |
      Which two properties are required for a set of vectors to form a **basis** for a vector space?
    choices:
      - id: c1
        text: 'They must be orthogonal and span the space.'
      - id: c2
        text: 'They must be linearly independent and span the space.'
      - id: c3
        text: 'They must contain the zero vector and be linearly independent.'
      - id: c4
        text: 'They must be scalar multiples of each other and span the space.'
    answer:
      choiceId: c2
    explanation: |
      A basis must span the vector space (cover it entirely) and be linearly independent (have no redundancies).

  - id: easy-rank-nullity
    type: multipleChoice
    prompt: |
      If a $3 \times 5$ matrix $A$ has a rank of $2$, what is the dimension of its null space (the nullity of $A$)?
    choices:
      - id: c1
        text: '$1$'
      - id: c2
        text: '$2$'
      - id: c3
        text: '$3$'
      - id: c4
        text: '$5$'
    answer:
      choiceId: c3
    explanation: |
      The Rank-Nullity Theorem states that $\text{Rank} + \text{Nullity} = n$ (the number of columns). Here, $n = 5$. Since Rank is $2$, Nullity must be $3$.

  - id: easy-col-space-basis
    type: multipleChoice
    prompt: |
      To find a basis for the column space of a matrix $A$, you row reduce $A$ to an echelon form $U$. Which columns of $A$ form the basis?
    choices:
      - id: c1
        text: 'The pivot columns of $U$.'
      - id: c2
        text: 'The pivot columns of the original matrix $A$.'
      - id: c3
        text: 'The free variable columns of the original matrix $A$.'
      - id: c4
        text: 'Any set of linearly independent columns.'
    answer:
      choiceId: c2
    explanation: |
      You use the echelon form $U$ to identify *which* columns are pivot columns, but you must select those corresponding columns from the **original** matrix $A$ to form the basis.
