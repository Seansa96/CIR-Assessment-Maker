glossary:
  introduction: Review the essential terms below. Once you understand them, test your
    knowledge using the recall drills.
  sections:
  - id: sec-physics-rolling-motion-recall
    title: Core Terminology
    entries:
    - id: entry-rolling-without-slipping
      term: Rolling Without Slipping
      definition: A condition where the point of contact of a rolling object has zero
        instantaneous velocity relative to the surface. $v_{cm} = R\omega$.
      drills:
      - id: drill-no-slip
        prompt: For rolling without slipping, $v_{cm}$ is equal to the radius times
          angular ________.
        type: typed
        answer:
          expected: velocity
    - id: entry-rolling-ke
      term: Kinetic Energy of Rolling
      definition: 'The total kinetic energy is the sum of translational and rotational
        kinetic energies: $K = \frac{1}{2}mv_{cm}^2 + \frac{1}{2}I_{cm}\omega^2$.'
      drills:
      - id: drill-rolling-ke
        prompt: The total kinetic energy of a rolling body contains both a translational
          and a ________ term.
        type: typed
        answer:
          expected: rotational
