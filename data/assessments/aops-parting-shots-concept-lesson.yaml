lesson:
  introduction: Learn to solve Parting Shots problems by recognizing mixed strategy, problem selection, algebra-geometry-combinatorics blend, contest review and justifying each theorem or transformation.
  sections:
  - id: aops-parting-shots-motivation
    title: What the topic helps you notice
    required: true
    content: Parting Shots is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are mixed strategy, problem selection, algebra-geometry-combinatorics blend, contest review.
    check:
      id: aops-parting-shots-motivation-check
      type: multipleChoice
      prompt: In Parting Shots, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-parting-shots-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-parting-shots-definitions-check
      type: multipleChoice
      prompt: In Parting Shots, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-parting-shots-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: classify the problem first, choose a starting representation, check for hidden constraints. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-parting-shots-recognition-check
      type: multipleChoice
      prompt: In Parting Shots, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-parting-shots-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-parting-shots-method-check
      type: multipleChoice
      prompt: In Parting Shots, what should be checked before applying a method?
