      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-parting-shots-mini-example
    title: A small original example
    required: true
    content: Try a small case first, then generalize. Substitute the result back into the original condition instead of checking only an intermediate expression.
    check:
      id: aops-parting-shots-mini-example-check
      type: multipleChoice
      prompt: In Parting Shots, what should be checked before applying a method?
