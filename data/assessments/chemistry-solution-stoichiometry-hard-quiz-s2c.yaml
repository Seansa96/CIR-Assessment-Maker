questions:
  - { id: q001, type: freeResponse, prompt: '50.0 mL of 0.200 M AgNO3 reacts with 80.0 mL of 0.100 M NaCl. Find the limiting reagent and mass AgCl formed (143.32 g/mol).', answer: { gradingMode: selfCheck, keyPoints: ['Cl− limiting: 0.00800 mol', '0.00800 mol AgCl', '1.15 g AgCl'] }, explanation: 'Solution: Ag+ moles=0.0500×0.200=0.0100 mol; Cl− moles=0.0800×0.100=0.00800 mol, so chloride limits. AgCl moles are 0.00800; mass=0.00800×143.32=1.15 g. Why it works: Convert both solutions to reacting-ion moles, compare the 1:1 requirement, then convert limiting product moles to mass. Common trap: Calling Ag+ limiting because its concentration is only 0.200 M without considering volume.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, casePartition], difficultyEvidence: 'Builds two solution mole paths, selects a limiting branch, and converts product to mass.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-stoich-agcl-limiting-mass, variationAxes: { scenario: unequal-volume precipitation, unknown: limiting reagent and mass, methodBranch: limiting yield } }
  - { id: q002, type: freeResponse, prompt: 'How many grams BaSO4 (233.39 g/mol) form from 35.0 mL 0.400 M BaCl2 and excess Na2SO4?', answer: { gradingMode: selfCheck, keyPoints: ['0.0140 mol Ba2+', '0.0140 mol BaSO4', '3.27 g'] }, explanation: 'Solution: Ba2+ moles=(0.0350 L)(0.400 M)=0.0140 mol. The 1:1 net ionic ratio gives 0.0140 mol BaSO4; mass=0.0140×233.39=3.27 g. Why it works: Excess sulfate makes barium the sole limiting source, and the equation is 1:1. Common trap: Multiplying by two chloride ions.', difficultyDimensions: [auxiliaryTechnique, representationTransfer, modelOrDerivation], difficultyEvidence: 'Chains volume conversion, net-ion ratio, and molar-mass conversion.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-stoich-baso4-mass-from-MV, variationAxes: { scenario: excess-reactant yield, unknown: precipitate mass, methodBranch: mole-to-mass } }
  - { id: q003, type: freeResponse, prompt: '100.0 mL 0.150 M CaCl2 is mixed with 125.0 mL 0.200 M Na2CO3. Find limiting ion and moles CaCO3 formed.', answer: { gradingMode: selfCheck, keyPoints: ['Ca2+ 0.0150 mol limiting', 'carbonate 0.0250 mol excess', '0.0150 mol CaCO3'] }, explanation: 'Solution: Ca2+=0.1000×0.150=0.0150 mol; CO3 2−=0.1250×0.200=0.0250 mol. The equation is 1:1, so Ca2+ limits and produces 0.0150 mol CaCO3. Why it works: Compare reactive-ion moles, not formula masses or volumes. Common trap: Choosing carbonate because it appears with a 2− charge.', difficultyDimensions: [modelOrDerivation, casePartition, representationTransfer], difficultyEvidence: 'Extracts reacting ions, compares stoichiometric quantities, and maps to precipitate amount.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-stoich-caco3-limiting-ion, variationAxes: { scenario: mixed salts, unknown: limiting ion and product moles, methodBranch: ion-based comparison } }
  - { id: q004, type: freeResponse, prompt: 'A student uses 25.0 mL directly in n=MV for 0.300 M AgNO3 and reports 7.50 mol Ag+. Diagnose and correct.', answer: { gradingMode: selfCheck, keyPoints: ['must use 0.0250 L', '0.00750 mol Ag+', 'mL-to-L error'] }, explanation: 'Solution: Convert 25.0 mL to 0.0250 L, then n=(0.300)(0.0250)=0.00750 mol. Why it works: Molarity has liters in its denominator, so mL must be converted. Common trap: Treating a numerical volume value as unit-free.', difficultyDimensions: [errorDiagnosis, representationTransfer, proofJustification], difficultyEvidence: 'Audits unit mismatch, repairs conversion, and justifies dimensional consistency.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-stoich-mL-unit-error, variationAxes: { scenario: student error, unknown: corrected amount and rationale, methodBranch: unit diagnosis } }
  - { id: q005, type: freeResponse, prompt: 'What volume of 0.250 M NaOH supplies exactly enough OH− to precipitate all Fe3+ from 40.0 mL 0.150 M Fe(NO3)3?', answer: { gradingMode: selfCheck, keyPoints: ['0.00600 mol Fe3+', '0.0180 mol OH−', '0.0720 L or 72.0 mL NaOH'] }, explanation: 'Solution: Fe3+ moles=0.0400×0.150=0.00600 mol. Fe3++3OH−→Fe(OH)3, so OH− needed=0.0180 mol. V=n/M=0.0180/0.250=0.0720 L=72.0 mL. Why it works: The 3:1 coefficient is applied after finding Fe3+ moles. Common trap: Using a 1:1 ratio or failing to convert liters to milliliters.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Builds a multistep mole map with a 3:1 stoichiometric branch and reverse volume calculation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-stoich-required-base-volume, variationAxes: { scenario: precipitating Fe hydroxide, unknown: required solution volume, governingRelation: 3:1 ratio } }
  - { id: q006, type: freeResponse, prompt: 'When 60.0 mL 0.100 M Pb(NO3)2 and 40.0 mL 0.400 M KI react, identify the excess reactant and moles excess after reaction.', answer: { gradingMode: selfCheck, keyPoints: ['Pb2+ 0.00600 mol', 'I− 0.0160 mol', 'I− excess 0.00400 mol after using 0.0120'] }, explanation: 'Solution: Pb2+=0.0600×0.100=0.00600 mol and I−=0.0400×0.400=0.0160 mol. Pb2++2I−→PbI2 requires 0.0120 mol I−, leaving 0.00400 mol I− excess. Why it works: The coefficient converts limiting Pb2+ into amount of iodide consumed. Common trap: Subtracting Pb2+ moles directly from iodide moles.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, casePartition], difficultyEvidence: 'Compares reagents using non-1:1 ratio and calculates remaining excess amount.', prerequisiteObjectiveIds: [limiting-solution-reagent], extensionObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-stoich-excess-iodide-remaining, variationAxes: { scenario: lead iodide precipitation, unknown: excess identity and remaining moles, methodBranch: non-1:1 limiting } }
  - { id: q007, type: freeResponse, prompt: 'A 0.0100 mol sample of Ca2+ yields only 1.80 g CaCO3 (100.09 g/mol). Calculate percent yield, assuming carbonate is excess.', answer: { gradingMode: selfCheck, keyPoints: ['theoretical 1.00 g', 'reported actual exceeds theory', '180 percent and indicates inconsistent data'] }, explanation: 'Solution: Theoretical CaCO3 is 0.0100×100.09=1.00 g. Percent yield=1.80/1.00×100=180%, which is physically inconsistent for a pure isolated product and signals wet/impure product or bad data. Why it works: Actual yield is compared to stoichiometric maximum. Common trap: Accepting a yield above 100% as ordinary.', difficultyDimensions: [modelOrDerivation, errorDiagnosis, domainCondition], difficultyEvidence: 'Computes theoretical yield, evaluates a physical bound, and diagnoses an impossible result.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [quantitative-analysis], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: hard-stoich-impossible-percent-yield, variationAxes: { scenario: yield report, unknown: percent and data diagnosis, constraints: physical maximum } }
  - { id: q008, type: freeResponse, prompt: 'A solution contains 0.0400 mol Na2CO3. What minimum moles CaCl2 are needed to precipitate all carbonate, and why is molarity alone insufficient?', answer: { gradingMode: selfCheck, keyPoints: ['0.0400 mol CaCl2', '1:1 Ca2+ to carbonate', 'volume/concentration needed to find solution amount'] }, explanation: 'Solution: 0.0400 mol CaCl2 supplies 0.0400 mol Ca2+, matching carbonate 1:1. Molarity alone cannot give an amount without volume because n=MV. Why it works: Stoichiometry links moles, while concentration becomes moles only with volume. Common trap: Reporting 0.0400 M as the required answer.', difficultyDimensions: [reverseReasoning, modelOrDerivation, domainCondition], difficultyEvidence: 'Works backward through a net equation and identifies missing information for a concentration request.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-stoich-moles-versus-molarity-condition, variationAxes: { scenario: design requirement, unknown: required moles and data limitation, methodBranch: reverse stoichiometry } }
  - { id: q009, type: freeResponse, prompt: 'Compare two routes to make AgCl: 0.0500 L of 0.300 M AgNO3 with excess chloride, or 0.200 L of 0.0600 M AgNO3 with excess chloride. Which produces more AgCl?', answer: { gradingMode: selfCheck, keyPoints: ['first route 0.0150 mol', 'second route 0.0120 mol', 'first produces more'] }, explanation: 'Solution: Route 1 gives 0.0500×0.300=0.0150 mol Ag+, hence AgCl. Route 2 gives 0.200×0.0600=0.0120 mol. Route 1 produces more. Why it works: Compare moles, not volume or concentration separately. Common trap: Choosing the larger volume without multiplying by molarity.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, errorDiagnosis], difficultyEvidence: 'Converts competing concentration-volume representations to the common mole basis and rejects single-variable comparison.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [quantitative-analysis], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: hard-stoich-compare-two-routes, variationAxes: { scenario: competing preparations, unknown: larger yield, representation: M-volume to moles } }
  - { id: q010, type: freeResponse, prompt: 'Explain why titration endpoint calculations are not included in this topic’s mole map, despite using M×V and coefficients.', answer: { gradingMode: selfCheck, keyPoints: ['titration needs endpoint/equivalence interpretation', 'reserved for titration topic', 'general mole map is shared prerequisite'] }, explanation: 'Solution: Titrations use the same mole map, but also require endpoint/equivalence and measurement-model reasoning; those are practiced in the dedicated titration topic. Why it works: A shared equation does not make two procedural contexts identical. Common trap: Treating any acid-base M×V calculation as a complete titration analysis.', difficultyDimensions: [casePartition, domainCondition, proofJustification], difficultyEvidence: 'Distinguishes a shared quantitative tool from the additional modeling requirements of a different application.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], extensionObjectiveIds: [titration-stoichiometry], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0464], reasoningSignature: hard-stoich-titration-scope-boundary, variationAxes: { scenario: curriculum scope, unknown: distinction rationale, constraints: endpoint model } }
