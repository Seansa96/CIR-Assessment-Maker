lesson:
  introduction: 'While sequences are *lists* of numbers, **Series** are *sums* of
    sequences.

    Before diving into infinite series, let''s explore finite sums, specifically **Arithmetic
    Series**.

    '
  sections:
  - id: definition
    title: Arithmetic Sequences and Series
    required: true
    content: 'An **arithmetic sequence** is a sequence where the difference between
      consecutive terms is constant. This difference is called $d$.

      For example: $3, 7, 11, 15, \dots$ ($d = 4$).


      The formula for the $n$-th term is:

      $$ a_n = a_1 + (n-1)d $$


      An **arithmetic series** is the sum of the terms of an arithmetic sequence:

      $$ S_n = a_1 + a_2 + a_3 + \dots + a_n $$

      '
    check:
      id: definition-check
      type: numericResponse
      skills:
      - arithmetic-series
      prompt: If $a_1 = 5$ and $d = -2$, what is the 10th term ($a_{10}$)?
      answer:
        value: -13
        tolerance: 0.1
      explanation: '$a_{10} = 5 + (10-1)(-2) = 5 + 9(-2) = 5 - 18 = -13$.

        '
  - id: sum-formula
    title: Gauss's Sum Formula
    required: true
    content: 'Legend says that when young Carl Friedrich Gauss was told to add the
      numbers from 1 to 100, he quickly realized that pairing them ($1+100, 2+99,
      3+98\dots$) always yielded 101. Since there are 50 pairs, the sum is $50 \times
      101 = 5050$.


      This leads to the general formula for the sum of a finite arithmetic series:


      $$ S_n = \frac{n}{2}(a_1 + a_n) $$


      Where $n$ is the number of terms, $a_1$ is the first term, and $a_n$ is the
      last term.

      If you don''t know the last term, substitute $a_n = a_1 + (n-1)d$:


      $$ S_n = \frac{n}{2} [2a_1 + (n-1)d] $$

      '
    check:
      id: sum-formula-check
      type: numericResponse
      skills:
      - arithmetic-series
      prompt: What is the sum of the first 20 positive even integers ($2, 4, 6\dots
        40$)?
      answer:
        value: 420
        tolerance: 0.1
      explanation: '$n=20$, $a_1=2$, $a_{20}=40$.

        $S_{20} = \frac{20}{2} (2 + 40) = 10 \times 42 = 420$.

        '
  - id: divergence
    title: Infinite Arithmetic Series
    required: true
    content: 'What happens if you try to add infinitely many terms of an arithmetic
      sequence?


      $$ \sum_{n=1}^\infty (a_1 + (n-1)d) $$


      Unless $a_1 = 0$ and $d = 0$ (which is just summing $0 + 0 + 0 \dots$), an infinite
      arithmetic series will **always diverge** to $+\infty$ or $-\infty$.

      This is because the terms do not shrink to 0. To have any\rhope of an infinite
      sum converging, the individual terms must approach 0.

      '
    check:
      id: divergence-check
      type: multipleChoice
      skills:
      - arithmetic-series
      prompt: Does the infinite arithmetic series $10 + 5 + 0 - 5 - 10 \dots$ converge
        or diverge?
      choices:
      - id: a
        text: Diverges to $-\infty$
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 10
      - id: d
        text: Diverges to $\infty$
      answer:
        choiceId: a
      explanation: 'Even though it passes through 0, the terms keep getting more and
        more negative indefinitely. The sum will plummet to $-\infty$.

        '
