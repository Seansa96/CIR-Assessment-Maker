lesson:
  introduction: Sound is a longitudinal pressure wave. This lesson connects compression/rarefaction, spherical spreading, decibels, harmonics, and Doppler frequency shifts.
  sections:
  - id: physics1-reinforcement-acoustics-s1
    title: Interpret the medium motion
    required: true
    content: 'Sound in air is longitudinal: particles oscillate parallel to propagation. Compressions have higher pressure and rarefactions lower pressure.'
    check:
      id: physics1-reinforcement-acoustics-s1-check
      type: multipleChoice
      prompt: What distinguishes a compression in a sound wave?
      choices:
      - { id: a, text: 'A region of relatively high pressure and particle crowding' }
      - { id: b, text: 'A region where particles move permanently forward', issueSignals: [{ id: physics1-sound-medium-drift-error, domains: [physics-1] }] }
      - { id: c, text: 'A transverse crest in air', issueSignals: [{ id: physics1-sound-transverse-error, domains: [physics-1] }] }
      - { id: d, text: 'A vacuum between wavefronts', issueSignals: [{ id: physics1-sound-rarefaction-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: A compression is a high-pressure crowded region. Why it works: Sound particles oscillate locally rather than drifting with the wave. Why the other choices fail: Sound in air is longitudinal, not a transverse crest or vacuum pattern.'
    difficultyDimensions: [representation, modelDefinition]
    difficultyEvidence: Interprets a pressure-wave diagram physically.
  - id: physics1-reinforcement-acoustics-s2
    title: Apply inverse-square spreading
    required: true
    content: For an isotropic source of fixed acoustic power, $I=P/(4\pi r^2)$. Intensity is power per area, not power itself.
    check:
      id: physics1-reinforcement-acoustics-s2-check
      type: multipleChoice
      prompt: If distance from an isotropic source triples, what happens to intensity?
      choices:
      - { id: a, text: 'It becomes one-ninth as large' }
      - { id: b, text: 'It becomes one-third as large', issueSignals: [{ id: physics1-sound-distance-power-error, domains: [physics-1] }] }
      - { id: c, text: 'It becomes three times as large', issueSignals: [{ id: physics1-sound-spreading-direction-error, domains: [physics-1] }] }
      - { id: d, text: 'It is unchanged because source power is fixed', issueSignals: [{ id: physics1-sound-intensity-power-confusion, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Spherical area grows as $r^2$, so tripling $r$ reduces $I$ by $3^2=9$. Why it works: Fixed power spreads over a larger sphere. Why the other choices fail: They use linear scaling or confuse total power with intensity.'
    difficultyDimensions: [scaling, modelSelection]
    difficultyEvidence: Applies geometric spreading to a distance change.
  - id: physics1-reinforcement-acoustics-s3
    title: Read decibels
    required: true
    content: Sound level is $\beta=10\log_{10}(I/I_0)$. A $10\,\mathrm{dB}$ increase corresponds to ten times the intensity.
    check:
      id: physics1-reinforcement-acoustics-s3-check
      type: multipleChoice
      prompt: What intensity ratio corresponds to a $20\,\mathrm{dB}$ increase?
      choices:
      - { id: a, text: '$100$' }
      - { id: b, text: '$20$', issueSignals: [{ id: physics1-decibel-linear-error, domains: [physics-1] }] }
      - { id: c, text: '$10$', issueSignals: [{ id: physics1-decibel-factor-error, domains: [physics-1] }] }
      - { id: d, text: '$2$', issueSignals: [{ id: physics1-decibel-log-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: $20=10\log_{10}(I_2/I_1)$ gives $I_2/I_1=10^2=100$. Why it works: Decibels encode multiplicative intensity ratios logarithmically. Why the other choices fail: They treat dB as a direct linear difference or use only one tenfold step.'
    difficultyDimensions: [logarithm, scaling]
    difficultyEvidence: Converts a logarithmic level difference to a ratio.
  - id: physics1-reinforcement-acoustics-s4
    title: Predict Doppler direction
    required: true
    content: Relative motion changes wavefront arrival rate. Approaching motion raises observed frequency; receding motion lowers it.
    check:
      id: physics1-reinforcement-acoustics-s4-check
      type: multipleChoice
      prompt: A listener moves toward a stationary source. What does the listener hear?
      choices:
      - { id: a, text: 'A higher frequency, because wavefronts arrive more often' }
      - { id: b, text: 'A lower frequency, because the listener moves into the waves', issueSignals: [{ id: physics1-doppler-direction-error, domains: [physics-1] }] }
      - { id: c, text: 'The source emits a higher frequency', issueSignals: [{ id: physics1-doppler-source-observer-error, domains: [physics-1] }] }
      - { id: d, text: 'Only loudness changes; frequency cannot change', issueSignals: [{ id: physics1-doppler-frequency-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Moving toward the source increases wavefront arrival rate, so observed frequency rises. Why it works: Doppler shift is an arrival-rate effect. Why the other choices fail: They reverse approach/recession, assign motion to the source, or confuse pitch with loudness.'
    difficultyDimensions: [qualitativePrediction, modelDefinition]
    difficultyEvidence: Predicts frequency from observer motion without confusing source frequency.
