lesson:
  introduction: |
    Polar area uses thin angular wedges instead of vertical rectangles.

    Rectangular area often starts from:

    $$
    A=\int y\,dx.
    $$

    Polar area starts from the area of a sector. That is why the formula involves $r^2$ and a factor of $\frac12$.
  sections:
    - id: sector-origin
      title: The Formula Comes from Sector Area
      required: true
      content: |
        A circular sector with radius $r$ and small angle width $\Delta\theta$ has area approximately:

        $$
        \Delta A\approx \frac12 r^2\Delta\theta.
        $$

        On a polar curve $r=f(\theta)$, the radius changes with angle. So the exact area from $\theta=\alpha$ to $\theta=\beta$ is:

        $$
        A=\frac12\int_{\alpha}^{\beta}[f(\theta)]^2\,d\theta.
        $$

        ![Polar Area](/assessments/calc2-parametric-polar/polar_area_demo.svg)
      check:
        id: sector-origin-check
        type: multipleChoice
        prompt: Why does the polar area formula contain $\frac12 r^2$?
        choices:
          - id: a
            text: Because each small piece is modeled as a circular sector.
          - id: b
            text: Because polar curves always form triangles.
          - id: c
            text: Because $r$ is the same thing as arc length.
          - id: d
            text: Because $d\theta$ must be squared.
        answer:
          choiceId: a
        explanation: |
          Polar area is built from sector slices. A sector has area $\frac12 r^2\theta$, so the infinitesimal area is $\frac12 r^2\,d\theta$.

    - id: squaring-radius
      title: Why Negative Radius Still Gives Positive Area
      required: true
      content: |
        The formula uses $r^2$, so a negative radius still contributes positive area.

        This is important because some polar curves trace loops using negative $r$ values. The negative sign changes direction, but the wedge area still has size:

        $$
        \frac12 r^2\,d\theta.
        $$

        Do not remove angles only because $r$ is negative. Instead, decide whether that part of the trace belongs to the region.
      check:
        id: squaring-radius-check
        type: multipleChoice
        prompt: In polar area, what happens when $r<0$ on part of the interval?
        choices:
          - id: a
            text: The area contribution can still be positive because the formula uses $r^2$.
          - id: b
            text: The whole integral is invalid.
          - id: c
            text: You must replace $r$ with $0$.
          - id: d
            text: The curve switches to rectangular coordinates automatically.
        answer:
          choiceId: a
        explanation: |
          Negative $r$ affects how the curve is traced, but the sector area depends on squared distance.

    - id: choosing-bounds
      title: Bounds Come from the Region, Not Habit
      required: true
      content: |
        The hardest part of polar area is usually not integration. It is choosing the angle bounds.

        Use these questions:

        1. What part of the curve bounds the requested region?
        2. Where does that part start and stop?
        3. Does the curve pass through the pole at the endpoints?
        4. Does the interval trace the region once or multiple times?

        For one petal of a rose curve, solve $r=0$ to find adjacent pole crossings. For a full limacon or cardioid, a full interval such as $0\le\theta\le2\pi$ is often appropriate.

        ![One rose petal highlighted between adjacent pole crossings](/assessments/calc2-parametric-polar/polar-rose-petal-bounds.svg)
      check:
        id: choosing-bounds-check
        type: multipleChoice
        prompt: To find bounds for one petal of $r=\sin(3\theta)$, what equation should you solve first?
        choices:
          - id: a
            text: '$\sin(3\theta)=0$'
          - id: b
            text: '$\sin(3\theta)=1$'
          - id: c
            text: '$3\theta=1$'
          - id: d
            text: '$\theta=2\pi$ only'
        answer:
          choiceId: a
        explanation: |
          Petals often start and end at the pole. Setting $r=0$ finds the angles where the curve passes through the pole.

    - id: duplicate-tracing
      title: Avoid Counting the Same Region Twice
      required: true
      content: |
        Some polar curves trace the same physical region more than once over $0\le\theta\le2\pi$.

        Common warning signs:

        - rose curves,
        - loops that return to the pole,
        - equations with repeated symmetry,
        - intervals longer than needed for the requested region.

        If the problem asks for one petal, one loop, or one enclosed region, use the smallest interval that traces that requested piece exactly once.

        ![Polar cardioid full-trace bounds showing a complete enclosed region](/assessments/calc2-parametric-polar/polar-area-cardioid-bounds.svg)
      check:
        id: duplicate-tracing-check
        type: multipleChoice
        prompt: Why can using $0\le\theta\le2\pi$ be wrong for a one-petal rose area problem?
        choices:
          - id: a
            text: It may trace several petals instead of the one requested petal.
          - id: b
            text: Rose curves cannot be integrated.
          - id: c
            text: The formula only works on intervals shorter than $\frac{\pi}{4}$.
          - id: d
            text: The radius must be constant.
        answer:
          choiceId: a
        explanation: |
          The formula is fine, but the bounds must match the requested region. A full sweep can include multiple repeated petals.

    - id: between-polar-curves
      title: Area Between Polar Curves
      required: true
      content: |
        For area between polar curves, subtract sector areas:

        $$
        A=\frac12\int_{\alpha}^{\beta}\left(r_{\text{outer}}^2-r_{\text{inner}}^2\right)\,d\theta.
        $$

        Notice the order:

        $$
        r_{\text{outer}}^2-r_{\text{inner}}^2,
        $$

        not

        $$
        (r_{\text{outer}}-r_{\text{inner}})^2.
        $$

        To find bounds, solve intersections:

        $$
        r_1(\theta)=r_2(\theta),
        $$

        then verify on the graph which radius is outer on the interval.

        ![Region inside a larger polar circle and outside a smaller polar circle](/assessments/calc2-parametric-polar/polar-circle-outside-inner-bounds.svg)
      check:
        id: between-polar-curves-check
        type: multipleChoice
        prompt: Which expression correctly represents the polar area between an outer radius $R(\theta)$ and inner radius $r(\theta)$?
        choices:
          - id: a
            text: '$\frac12\int_{\alpha}^{\beta}\left(R(\theta)^2-r(\theta)^2\right)\,d\theta$'
          - id: b
            text: '$\frac12\int_{\alpha}^{\beta}\left(R(\theta)-r(\theta)\right)^2\,d\theta$'
          - id: c
            text: '$\int_{\alpha}^{\beta}\left(R(\theta)-r(\theta)\right)\,d\theta$'
          - id: d
            text: '$\int_{\alpha}^{\beta}R(\theta)r(\theta)\,d\theta$'
        answer:
          choiceId: a
        explanation: |
          Each curve contributes a sector area. The region between them is outer sector area minus inner sector area.

    - id: polar-area-workflow
      title: Polar Area Workflow
      required: true
      content: |
        Use this order:

        1. Sketch or identify the curve family.
        2. Decide the requested region.
        3. Find start and stop angles by solving pole crossings or intersections.
        4. Check whether the interval traces the region once.
        5. Use $\frac12\int r^2\,d\theta$ for one curve.
        6. Use $\frac12\int(R^2-r^2)\,d\theta$ between curves.
        7. Interpret the result as geometric area, so it should be nonnegative.
      check:
        id: polar-area-workflow-check
        type: selectAll
        prompt: Which checks belong in a careful polar area workflow?
        choices:
          - id: a
            text: Confirm the interval traces the requested region once.
          - id: b
            text: Identify whether one curve or two curves bound the region.
          - id: c
            text: Use $R^2-r^2$ for area between curves.
          - id: d
            text: Always integrate from $0$ to $2\pi$ no matter what is requested.
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: |
          Bounds and tracing matter as much as the formula. A full $0$ to $2\pi$ sweep is useful often, but it is not automatic.
