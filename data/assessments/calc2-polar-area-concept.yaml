lesson:
  introduction: To find the area bounded by polar curves, we slice the region into
    infinitesimally small wedges (sectors) rather than vertical rectangles.
  sections:
  - id: intro-polar-area
    title: Polar Area Formula
    content: |-
      To find the area enclosed by a polar curve, we integrate over sectors of a circle.

      ![Polar Area](/assessments/calc2-parametric-polar/polar_area_demo.svg)
    check:
      id: intro-polar-area-check
      type: multipleChoice
      prompt: |-
        What is the formula for the area bounded by the curve $r=f(\theta)$ between $\theta=\alpha$ and $\theta=\beta$?
      choices:
      - id: a
        text: |-
          $\int_{\alpha}^{\beta} r \, d\theta$
      - id: b
        text: |-
          $\int_{\alpha}^{\beta} r^2 \, d\theta$
      - id: c
        text: |-
          $\frac{1}{2} \int_{\alpha}^{\beta} [f(\theta)]^2 \, d\theta$
      answer:
        choiceId: c
      explanation: |-
        The area of a circular sector is $\frac{1}{2}r^2\Delta\theta$, leading to the integral $\frac{1}{2} \int_{\alpha}^{\beta} r^2 \, d\theta$.
