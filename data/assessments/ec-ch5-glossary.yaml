schemaVersion: 1
id: ec-ch5-glossary
title: Operational Amplifier Glossary
assessmentType: glossary
categoryId: electronics-and-circuits
subcategoryIds:
- ec-operational-amplifier
glossary:
  sections:
  - id: ch5-terms
    title: Terms
    required: true
    entries:
    - id: inverting-amplifier
      term: Inverting Amplifier
      definition: An op-amp circuit that produces an amplified output signal that
        is 180 degrees out of phase with the input.
      drills:
      - id: inverting-amplifier-drill
        type: typed
        prompt: What is the theoretical input resistance of an ideal op-amp?
        answer:
          expected: infinity
          aliases:
          - infinite
    - id: non-inverting-amplifier
      term: Non-inverting Amplifier
      definition: An op-amp circuit that produces an amplified output signal that
        is in phase with the input.
      drills:
      - id: non-inverting-amplifier-drill
        type: typed
        prompt: What is the condition called when the voltage difference between input
          terminals is zero?
        answer:
          expected: virtual short
    - id: virtual-short
      term: Virtual Short
      definition: The condition where the voltage difference between the two input
        terminals of an ideal op-amp with negative feedback is practically zero.
      drills:
      - id: virtual-short-drill
        type: typed
        prompt: What op-amp circuit produces an output that is out of phase with the
          input?
        answer:
          expected: inverting amplifier
    - id: common-mode-rejection
      term: Common-Mode Rejection
      definition: The ability of a difference amplifier to reject signals that are
        common to both inputs.
      drills:
      - id: common-mode-rejection-drill
        type: typed
        prompt: What is the theoretical input resistance of an ideal op-amp?
        answer:
          expected: infinity
          aliases:
          - infinite
  introduction: Review these terms carefully.
