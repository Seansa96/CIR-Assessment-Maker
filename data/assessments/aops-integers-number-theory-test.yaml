questions:
- id: q001
  type: multipleChoice
  prompt: 'Find $\gcd(252,198)$.'
  choices:
  - id: a
    text: '6'
  - id: b
    text: '12'
  - id: c
    text: '18'
  - id: d
    text: '54'
  answer:
    choiceId: c
  explanation: Euclid gives $252-198=54$, $198\equiv36\pmod{54}$, and $54\equiv18\pmod{36}$.
- id: q002
  type: multipleChoice
  prompt: 'Find the least positive integer divisible by 12, 15, and 18.'
  choices:
  - id: a
    text: '90'
  - id: b
    text: '120'
  - id: c
    text: '180'
  - id: d
    text: '3240'
  answer:
    choiceId: c
  explanation: The required maximum prime powers are $2^2\cdot3^2\cdot5=180$.
- id: q003
  type: multipleChoice
  prompt: 'How many positive divisors does $2^3\cdot3^3\cdot5\cdot7$ have?'
  choices:
  - id: a
    text: '16'
  - id: b
    text: '32'
  - id: c
    text: '48'
  - id: d
    text: '64'
  answer:
    choiceId: d
  explanation: The count is $(3+1)(3+1)(1+1)(1+1)=64$.
- id: q004
  type: multipleChoice
  prompt: 'Write 47 in base 2.'
  choices:
  - id: a
    text: '$101011_2$'
  - id: b
    text: '$101101_2$'
  - id: c
    text: '$101111_2$'
  - id: d
    text: '$111111_2$'
  answer:
    choiceId: c
  explanation: $47=32+8+4+2+1$.
- id: q005
  type: multipleChoice
  prompt: 'Write 100 in base 5.'
  choices:
  - id: a
    text: '$100_5$'
  - id: b
    text: '$200_5$'
  - id: c
    text: '$400_5$'
  - id: d
    text: '$1000_5$'
  answer:
    choiceId: c
  explanation: One hundred equals $4\cdot25$, so its base-5 digits are 400.
- id: q006
  type: multipleChoice
  prompt: 'Convert $2A_{16}$ to base ten, where $A$ represents 10.'
  choices:
  - id: a
    text: '32'
  - id: b
    text: '36'
  - id: c
    text: '42'
  - id: d
    text: '52'
  answer:
    choiceId: c
  explanation: The value is $2(16)+10=42$.
- id: q007
  type: multipleChoice
  prompt: 'What are the last two digits of $11^{20}$?'
  choices:
  - id: a
    text: '01'
  - id: b
    text: '11'
  - id: c
    text: '21'
  - id: d
    text: '41'
  answer:
    choiceId: a
  explanation: Modulo 100, $(1+10)^{20}\equiv1+200\equiv1$.
- id: q008
  type: multipleChoice
  prompt: 'Find the remainder when $5^{37}+3^{37}$ is divided by 4.'
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: '2'
  - id: d
    text: '3'
  answer:
    choiceId: a
  explanation: Modulo 4, $5^{37}\equiv1$ and $3^{37}\equiv(-1)^{37}=-1$.
- id: q009
  type: multipleChoice
  prompt: 'Find the smallest positive integer that leaves remainder 2 modulo 5 and remainder 3 modulo 4.'
  choices:
  - id: a
    text: '7'
  - id: b
    text: '12'
  - id: c
    text: '17'
  - id: d
    text: '23'
  answer:
    choiceId: a
  explanation: Numbers congruent to 2 modulo 5 begin $2,7,12,\ldots$, and 7 is congruent to 3 modulo 4.
- id: q010
  type: multipleChoice
  prompt: 'How many trailing zeros does $50!$ have in base ten?'
  choices:
  - id: a
    text: '10'
  - id: b
    text: '11'
  - id: c
    text: '12'
  - id: d
    text: '14'
  answer:
    choiceId: c
  explanation: |-
    Count factors of 5: $\lfloor50/5\rfloor+\lfloor50/25\rfloor=10+2=12$.
- id: q011
  type: multipleChoice
  prompt: 'Can an integer square leave remainder 2 modulo 4?'
  choices:
  - id: a
    text: Yes, for every even integer
  - id: b
    text: Yes, for every odd integer
  - id: c
    text: No; squares modulo 4 are only 0 or 1
  - id: d
    text: Only when the integer is prime
  answer:
    choiceId: c
  explanation: Squaring residues 0, 1, 2, and 3 modulo 4 produces only 0 or 1.
- id: q012
  type: multipleChoice
  prompt: 'Find the remainder of $1+2+\cdots+100$ modulo 9.'
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: '4'
  - id: d
    text: '8'
  answer:
    choiceId: b
  explanation: The sum is 5050, and $5050=9(561)+1$.
- id: q013
  type: selectAll
  prompt: 'Which digits can be the units digit of a perfect square?'
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: '4'
  - id: d
    text: '8'
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: Squaring the ten possible units digits yields $0,1,4,5,6,9$; 8 is impossible.
- id: q014
  type: selectAll
  prompt: 'Which transformations are always valid when $a\equiv b\pmod m$?'
  choices:
  - id: a
    text: '$a+c\equiv b+c\pmod m$ for every integer $c$'
  - id: b
    text: '$ac\equiv bc\pmod m$ for every integer $c$'
  - id: c
    text: '$a^2\equiv b^2\pmod m$'
  - id: d
    text: Cancel every common nonzero factor regardless of the modulus.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: Cancellation requires an invertible factor and therefore is not automatic.
- id: q015
  type: freeResponse
  prompt: |-
    Prove that consecutive integers $n$ and $n+1$ are coprime for every integer $n$.
  answer:
    gradingMode: selfCheck
    expected: |-
      Let $d$ be any common positive divisor of $n$ and $n+1$. Then $d$ divides their difference $(n+1)-n=1$. The only positive divisor of 1 is 1, so every common positive divisor is 1 and therefore $\gcd(n,n+1)=1$.
    keyPoints:
    - Introduces an arbitrary common divisor.
    - Uses the fact that a common divisor divides the difference.
    - Concludes that the gcd is 1.
  explanation: The difference property converts a claim about two arbitrary integers into divisibility of 1.
