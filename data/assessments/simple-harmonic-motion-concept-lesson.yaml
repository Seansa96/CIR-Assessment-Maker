lesson:
  introduction: This lesson develops Simple Harmonic Motion from a diagram, a mathematical model, and
    a calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      Simple harmonic motion (SHM) occurs when a restoring force is directly proportional to the displacement from equilibrium and acts in the opposite direction. A classic physical system is a mass $m$ attached to an ideal spring with spring constant $k$, sliding on a frictionless horizontal surface. We assume air resistance and internal friction are negligible.
    media:
    - type: image
      src: /media/physics/owa/shm-mass-spring-states.svg
      alt: Original mass-spring schematic showing negative amplitude, equilibrium, positive amplitude, and restoring-force directions.
      caption: Turning points and equilibrium identify the physical state before any calculation.
    check: {id: shm-s1, type: multipleChoice, prompt: 'What condition defines SHM?', choices: [{id: a, text: 'A restoring force proportional to displacement'}, {id: b, text: 'Amplitude only'}, {id: c, text: 'Constant velocity'}, {id: d, text: 'No force'}], answer: {choiceId: a}, explanation: 'This follows from the ideal mass-spring SHM model.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      Key measurable quantities include the amplitude $A$ (maximum displacement from equilibrium), period $T$ (time for one complete cycle), and frequency $f$ (cycles per second). The angular frequency $\omega$ is related to frequency by $\omega = 2\pi f$.
    media:
    - type: image
      src: /media/physics/owa/shm-mass-spring-states.svg
      alt: Original mass-spring schematic labeled with amplitude and equilibrium position.
      caption: Amplitude is the maximum distance from equilibrium, not the total travel distance.
    check: {id: shm-s2, type: multipleChoice, prompt: 'What is maximum displacement from equilibrium called?', choices: [{id: a, text: 'Amplitude'}, {id: b, text: 'Amplitude only'}, {id: c, text: 'Constant velocity'}, {id: d, text: 'No force'}], answer: {choiceId: a}, explanation: 'This follows from the ideal mass-spring SHM model.'}
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model governing the restoring force is Hooke's Law: $F_{\text{net}} = -kx$. The negative sign indicates that the force always points toward the equilibrium position ($x=0$). By Newton's second law, $F_{\text{net}} = ma$, so $-kx = ma$.
    media:
    - type: image
      src: /media/physics/owa/shm-mass-spring-states.svg
      alt: Original mass-spring schematic showing restoring force pointing toward equilibrium on either side.
      caption: The restoring force reverses direction when the displacement reverses.
    check: {id: shm-s3, type: multipleChoice, prompt: 'What spring-force relation points toward equilibrium?', choices: [{id: a, text: '$F=-kx$'}, {id: b, text: 'Amplitude only'}, {id: c, text: 'Constant velocity'}, {id: d, text: 'No force'}], answer: {choiceId: a}, explanation: 'This follows from the ideal mass-spring SHM model.'}
  - id: s4
    title: Calculus connection
    content: >-
      Using calculus, acceleration is the second time derivative of position, $a = \frac{d^2x}{dt^2}$. Substituting this into our force equation yields $-kx = m\frac{d^2x}{dt^2}$, which rearranges to $\frac{d^2x}{dt^2} + \frac{k}{m}x = 0$. This is a second-order linear ordinary differential equation characteristic of SHM.
    media:
    - type: image
      src: /media/physics/owa/shm-phase-graphs.svg
      alt: Original aligned graphs of position velocity and acceleration over one period of simple harmonic motion.
      caption: The second derivative of position is opposite in sign to position.
    check: {id: shm-s4, type: multipleChoice, prompt: 'What equation results from Newtons law and acceleration?', choices: [{id: a, text: 'A second-order differential equation'}, {id: b, text: 'Amplitude only'}, {id: c, text: 'Constant velocity'}, {id: d, text: 'No force'}], answer: {choiceId: a}, explanation: 'This follows from the ideal mass-spring SHM model.'}
  - id: s5
    title: Derivation or justification
    content: >-
      To solve the differential equation, we propose a solution of the form $x(t) = A\cos(\omega t + \phi)$. Differentiating twice gives $\frac{d^2x}{dt^2} = -\omega^2 A\cos(\omega t + \phi) = -\omega^2 x$. Substituting back, we find $-\omega^2 x + \frac{k}{m}x = 0$, requiring $\omega = \sqrt{\frac{k}{m}}$. Since $T = \frac{2\pi}{\omega}$, we derive $T = 2\pi\sqrt{\frac{m}{k}}$.
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map linking mass and spring constant to angular frequency and period.
      caption: The mass and spring constant set angular frequency and period; amplitude does not.
    check: {id: shm-s5, type: multipleChoice, prompt: 'What is angular frequency for a mass-spring oscillator?', choices: [{id: a, text: '$\omega=\sqrt{k/m}$'}, {id: b, text: 'Amplitude only'}, {id: c, text: 'Constant velocity'}, {id: d, text: 'No force'}], answer: {choiceId: a}, explanation: 'This follows from the ideal mass-spring SHM model.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, position $x(t)$ is a cosine curve. Velocity $v(t)$, being the derivative of position, is a negative sine curve, shifted by $\pi/2$ phase. Acceleration $a(t)$ is a negative cosine curve, showing that acceleration is always exactly out of phase with position.
    media:
    - type: image
      src: /media/physics/owa/shm-phase-graphs.svg
      alt: Original aligned graphs of position velocity and acceleration over one period of simple harmonic motion.
      caption: Velocity is zero at turning points and largest in magnitude at equilibrium.
    check: {id: shm-s6, type: multipleChoice, prompt: 'What phase relationship does SHM acceleration have to position?', choices: [{id: a, text: 'Acceleration is opposite position'}, {id: b, text: 'Amplitude only'}, {id: c, text: 'Constant velocity'}, {id: d, text: 'No force'}], answer: {choiceId: a}, explanation: 'This follows from the ideal mass-spring SHM model.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      When solving for the period, carefully identify the mass $m$ and the effective spring constant $k$. Ensure both are in SI units (kg for mass, N/m for spring constant). Then apply the derived formula $T = 2\pi\sqrt{\frac{m}{k}}$ directly.
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map for period angular frequency maximum speed and maximum acceleration in a mass-spring oscillator.
      caption: Use amplitude only when the requested quantity is a maximum speed or acceleration.
    check: {id: shm-s7, type: multipleChoice, prompt: 'Which quantities determine a mass-spring period?', choices: [{id: a, text: 'Mass and spring constant'}, {id: b, text: 'Amplitude only'}, {id: c, text: 'Constant velocity'}, {id: d, text: 'No force'}], answer: {choiceId: a}, explanation: 'This follows from the ideal mass-spring SHM model.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Consider the limiting behavior: as mass $m$ increases, the system's inertia increases, resulting in a longer period $T$ (slower oscillations). As the spring constant $k$ increases, the restoring force becomes stiffer, resulting in a shorter period $T$ (faster oscillations). The units under the radical are $\frac{\text{kg}}{\text{N/m}} = \frac{\text{kg}}{\text{kg}\cdot\text{m/s}^2 / \text{m}} = \text{s}^2$, giving seconds for $T$.
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map showing how mass stiffness and amplitude affect common simple harmonic motion quantities.
      caption: A heavier mass increases the period; a stiffer spring decreases it.
    check: {id: shm-s8, type: multipleChoice, prompt: 'What happens to period if spring stiffness increases?', choices: [{id: a, text: 'It decreases'}, {id: b, text: 'It increases'}, {id: c, text: 'It is unchanged'}, {id: d, text: 'It becomes zero'}], answer: {choiceId: a}, explanation: 'Period is proportional to $1/\sqrt{k}$.'}
