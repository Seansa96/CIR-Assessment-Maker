- id: we-moi-ke-1
  title: Flywheel Energy Storage
  problem: A solid steel cylinder acting as a flywheel has a mass of $500 \text{ kg}$
    and a radius of $1.2 \text{ m}$. It spins at $4000 \text{ rev/min}$. Calculate
    its rotational kinetic energy.
  steps:
  - id: we-moi-ke-1-step1
    title: 'Step 1: Calculate MOI'
    instruction: Find the moment of inertia $I$.
    prompt: What is $I$?
    type: numericResponse
    answer:
      value: 360
      tolerance: 1
    explanation: |
      Solution: $I=\tfrac12MR^2=\tfrac12(500)(1.2)^2=360$ kg m$^2$.

      Why it works: A uniform solid cylinder has $I=\tfrac12MR^2$ about its central axis.
  - id: we-moi-ke-1-step2
    title: 'Step 2: Convert Angular Velocity'
    instruction: Convert $4000 \text{ rev/min}$ to rad/s.
    prompt: What is $\omega$ in rad/s?
    type: numericResponse
    answer:
      value: 418.88
      tolerance: 1
    explanation: |
      Solution: $\omega=4000(2\pi/60)=418.88$ rad/s.

      Why it works: Each revolution is $2\pi$ radians and each minute contains 60 seconds.
  - id: we-moi-ke-1-step3
    title: 'Step 3: Rotational Kinetic Energy'
    instruction: Use $K_{rot} = \frac{1}{2}I\omega^2$.
    prompt: What is $K_{rot}$ in Joules?
    type: numericResponse
    answer:
      value: 31580000
      tolerance: 100000
    explanation: |
      Solution: $K_{rot}=\tfrac12(360)(418.88)^2\approx3.16\times10^7$ J.

      Why it works: Rotational kinetic energy is one-half the moment of inertia times angular speed squared.

- id: moi-ke-we002
  title: Rotational Energy of a Hoop
  problem: 'A hoop has $I=0.80\ \mathrm{kg\,m^2}$ and spins at $10\ \mathrm{rad/s}$. Find its rotational kinetic energy.'
  steps:
  - id: ikwe4
    title: Calculate rotational kinetic energy
    instruction: Use $K_{rot}=\tfrac12I\omega^2$.
    prompt: 'What is the rotational kinetic energy in joules?'
    type: numericResponse
    answer: { value: 40, tolerance: 0.01 }
    explanation: 'Solution: $K=\tfrac12(0.80)(10)^2=40\ \mathrm{J}$.\n\nWhy it works: Rotational kinetic energy is one half inertia times angular speed squared.'
  - id: ikwe5
    title: Compare doubled speed
    instruction: Double the angular speed while keeping inertia constant.
    prompt: 'What energy would the hoop have at 20 rad/s?'
    type: numericResponse
    answer: { value: 160, tolerance: 0.01 }
    explanation: 'Solution: $K=\tfrac12(0.80)(20)^2=160\ \mathrm{J}$.\n\nWhy it works: Doubling angular speed quadruples energy.'
