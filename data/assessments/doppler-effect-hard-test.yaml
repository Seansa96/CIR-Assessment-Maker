questions:
- id: q001
  type: numericResponse
  prompt: Sound speed is 343 m/s. A 500 Hz source moves toward a stationary listener at 20 m/s. Using $f_{obs}=fv/(v-v_s)$, find the observed frequency in Hz.
  answer: { value: 530.96, tolerance: 0.7 }
  explanation: |
    Solution: $f_{obs}=500(343)/(343-20)=530.96$ Hz.

    Why it works: A source approaching the listener compresses the wavelength in front of it, represented by the smaller denominator.
  difficultyDimensions: [modelOrDerivation, signConvention, unitAnalysis]
  subjectDifficultyTags: [movingSource]
  difficultyEvidence: The source direction must be encoded in the denominator before the frequency calculation.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]
  media: [{ type: image, src: /media/physics/owa/doppler-effect.svg, alt: Original schematic of approaching source and listener, caption: Doppler direction model. }]
- id: q002
  type: numericResponse
  prompt: Sound speed is 343 m/s. A stationary 440 Hz source is observed by a listener moving toward it at 15 m/s. Using $f_{obs}=f(v+v_o)/v$, find the observed frequency in Hz.
  answer: { value: 459.24, tolerance: 0.6 }
  explanation: |
    Solution: $f_{obs}=440(343+15)/343=459.24$ Hz.

    Why it works: The moving observer encounters wavefronts more often; the observer velocity increases the numerator while the source still sets the wavelength.
  difficultyDimensions: [modelOrDerivation, representationTransfer, comparison]
  subjectDifficultyTags: [movingObserver]
  difficultyEvidence: This item requires choosing the moving-observer form rather than incorrectly modifying the source denominator.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]
  media: [{ type: image, src: /media/physics/owa/doppler-effect.svg, alt: Original schematic of approaching source and listener, caption: Doppler direction model. }]
- id: q003
  type: numericResponse
  prompt: Sound speed is 343 m/s. A 600 Hz source moves away from a stationary listener at 30 m/s. What observed frequency in Hz follows from $f_{obs}=fv/(v+v_s)$?
  answer: { value: 552.02, tolerance: 0.7 }
  explanation: |
    Solution: $f_{obs}=600(343)/(343+30)=552.01$ Hz.

    Why it works: A receding source spreads successive wavefronts farther apart, so the wavelength rises and the listener measures a lower frequency.
  difficultyDimensions: [signConvention, modelOrDerivation, qualitativeCheck]
  subjectDifficultyTags: [recedingSource]
  difficultyEvidence: The learner selects the receding-source sign and verifies that the resulting frequency is lower than the emitted frequency.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]
  media: [{ type: image, src: /media/physics/owa/doppler-effect.svg, alt: Original schematic of approaching source and listener, caption: Doppler direction model. }]
- id: q004
  type: numericResponse
  prompt: Sound speed is 343 m/s. A stationary 512 Hz source is observed by a listener moving away at 18 m/s. What observed frequency in Hz follows from $f_{obs}=f(v-v_o)/v$?
  answer: { value: 485.13, tolerance: 0.7 }
  explanation: |
    Solution: $f_{obs}=512(343-18)/343=485.13$ Hz.

    Why it works: Moving away causes the observer to meet fewer wavefronts per second, so the observer-speed term reduces the numerator.
  difficultyDimensions: [signConvention, modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [recedingObserver]
  difficultyEvidence: The direction is translated into a negative observer contribution without altering the source frequency or sound speed.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]
- id: q005
  type: numericResponse
  prompt: A stationary listener hears 550 Hz from a 500 Hz source moving toward them. Sound speed is 343 m/s. What source speed in m/s follows from $550=500(343)/(343-v_s)$?
  answer: { value: 31.18, tolerance: 0.2 }
  explanation: |
    Solution: Rearranging gives $343-v_s=500(343)/550=311.82$, so $v_s=31.18$ m/s.

    Why it works: The observed higher pitch fixes the approach sign; algebra then isolates the source speed from the Doppler denominator.
  difficultyDimensions: [reverseReasoning, multiStep, signConvention]
  subjectDifficultyTags: [solveForSourceSpeed]
  difficultyEvidence: An observed effect is used to infer motion, requiring algebraic inversion and a physical direction check.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]
- id: q006
  type: multipleChoice
  prompt: A source and an observer move directly toward one another through still air. Which statement is correct?
  choices:
  - { id: a, text: Both motions increase the observed frequency relative to the emitted frequency. }
  - { id: b, text: Source motion has no effect if the observer moves. }
  - { id: c, text: Observer motion changes the sound speed in the air. }
  - { id: d, text: Both motions must lower the observed frequency. }
  answer: { choiceId: a }
  explanation: |
    Solution: Both motions increase the observed frequency relative to the emitted frequency.

    Why it works: An approaching source shortens the wavelength ahead of it, while an approaching observer encounters those wavefronts faster.

    Why the other choices fail: The two effects are distinct and both matter; neither changes the sound speed of still air, and approaching motion raises rather than lowers the observed frequency.
  difficultyDimensions: [modelComparison, representationTransfer, errorDiagnosis]
  subjectDifficultyTags: [combinedMotion]
  difficultyEvidence: Two different physical mechanisms must be combined and contrasted with common direction misconceptions.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]
- id: q007
  type: symbolicResponse
  prompt: Starting from $f_{obs}=f(v+v_o)/(v-v_s)$, solve for the emitted frequency $f$.
  answer:
    expectedLatex: 'f_obs*(v-v_s)/(v+v_o)'
    equivalenceMode: expression
    tolerance: 0.000001
    variables: [f_obs, v, v_s, v_o]
  explanation: |
    Solution: Multiply by $(v-v_s)$ and divide by $(v+v_o)$: $f=f_{obs}(v-v_s)/(v+v_o)$.

    Why it works: These operations undo the denominator and numerator factors while preserving the direction conventions already encoded in the model.
  difficultyDimensions: [symbolicManipulation, reverseReasoning, domainCondition]
  subjectDifficultyTags: [dopplerAlgebra]
  difficultyEvidence: The model is algebraically inverted while retaining the nonzero denominator and direction-sensitive variables.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]
- id: q008
  type: multipleChoice
  prompt: A listener reports a lower frequency while the sound speed in the medium remains unchanged. Which motion pattern could produce this result?
  choices:
  - { id: a, text: The source moves away from the listener. }
  - { id: b, text: The source moves toward the listener. }
  - { id: c, text: The listener moves toward a stationary source. }
  - { id: d, text: Both source and listener move toward one another. }
  answer: { choiceId: a }
  explanation: |
    Solution: The source moves away from the listener.

    Why it works: Receding source motion increases the spacing of wavefronts reaching the listener, which lowers the received frequency.

    Why the other choices fail: Each listed approaching pattern increases how frequently the listener receives wavefronts and therefore raises the observed frequency.
  difficultyDimensions: [reverseReasoning, qualitativeCheck, representationTransfer]
  subjectDifficultyTags: [directionInference]
  difficultyEvidence: The direction of motion is inferred from a frequency observation without a numerical calculation.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-doppler-effect]

