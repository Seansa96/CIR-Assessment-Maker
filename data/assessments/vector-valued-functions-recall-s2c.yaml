    text: $\mathbf r'(t)=\mathbf0$ for every $t$
    media: []
    issueSignals: 
  - id: b
    text: $\mathbf r(t)=\mathbf r'(t)$
    media: []
    issueSignals: 
  - id: c
    text: $|\mathbf r'(t)|=|\mathbf r(t)|$
    media: []
    issueSignals: 
  - id: d
    text: $\mathbf r'(t)\cdot\mathbf r(t)=0$
    media: []
    issueSignals: 
