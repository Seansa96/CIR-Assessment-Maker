items:
- id: r001
  type: typed
  prompt: What is the name for the three real-valued functions $f$, $g$, and $h$ in $\mathbf r(t)=\langle f(t),g(t),h(t)\rangle$?
  answer:
    expected: component functions
    expectedLatex: 
    aliases:
    - components
    - component functions of r
    media: []
    choiceId: 
  explanation: >
    Solution: They are the component functions.

    Why it works: Each one supplies one coordinate of the vector output.
  tags: []
  skills: []
  issueSignals:
  - id: scalar-vector-confusion
    domains: []
  choices: []
- id: r002
  type: cloze
  prompt: 'Complete the unit-tangent formula: $\mathbf T(t)=\underline{\hspace{2cm}}$.'
  answer:
    expected: r prime of t divided by magnitude r prime of t
    expectedLatex: 
    aliases:
    - r'(t)/|r'(t)|
    - \mathbf r'(t)/|\mathbf r'(t)|
    media: []
    choiceId: 
  explanation: >
    Solution: $\mathbf T(t)=\frac{\mathbf r'(t)}{|\mathbf r'(t)|}$.

    Why it works: A nonzero tangent vector is normalized by dividing by its magnitude.
  tags: []
  skills: []
  issueSignals:
  - id: unit-tangent-normalization-error
    domains: []
  choices: []
- id: r003
  type: recognition
  prompt: Which statement defines the domain of a vector-valued function?
  answer:
    expected: common domain
    expectedLatex: 
    aliases:
    - intersection of component domains
    media: []
    choiceId: b
  explanation: >
    Solution: Choose the intersection of component domains.

    Why it works: All three components must be defined to form one vector output.

    Why the other choices fail: a admits values where a component is missing. c ignores restrictions. d confuses domain with normalization.
  tags: []
  skills: []
  issueSignals:
  - id: domain-condition-error
    domains: []
  choices:
  - id: a
    text: The union of the component domains
    media: []
    issueSignals: 
  - id: b
    text: The intersection of the component domains
    media: []
    issueSignals: 
  - id: c
    text: All real values of $t$ by definition
    media: []
    issueSignals: 
  - id: d
    text: Only values for which the magnitude is one
    media: []
    issueSignals: 
- id: r004
  type: recognition
  prompt: Which vector is the derivative of a position vector and supplies tangent direction when nonzero?
  answer:
    expected: r prime
    expectedLatex: 
    aliases:
    - r'(t)
    - velocity vector
    media: []
    choiceId: a
  explanation: >
    Solution: Choose $\mathbf r'(t)$.

    Why it works: The derivative is the limiting secant direction and therefore tangent to the curve.

    Why the other choices fail: b is position. c is speed, a scalar. d is an antiderivative rather than instantaneous change.
  tags: []
  skills: []
  issueSignals:
  - id: tangent-vector-role-error
    domains: []
  choices:
  - id: a
    text: $\mathbf r'(t)$
    media: []
    issueSignals: 
  - id: b
    text: $\mathbf r(t)$
    media: []
    issueSignals: 
  - id: c
    text: $|\mathbf r'(t)|$
    media: []
    issueSignals: 
  - id: d
    text: $\int\mathbf r(t)\,dt$
    media: []
    issueSignals: 
- id: r005
  type: recognition
  prompt: Which rule is valid for a definite vector integral?
  answer:
    expected: componentwise integration
    expectedLatex: 
    aliases:
    - integrate each component
    media: []
    choiceId: c
  explanation: >
    Solution: Integrate each component and assemble the resulting vector.

    Why it works: Vector integration is defined from componentwise Riemann sums.

    Why the other choices fail: a loses vector coordinates. b discards information. d is an unrelated vector operation.
  tags: []
  skills: []
  issueSignals:
  - id: parametric-integral-error
    domains: []
  choices:
  - id: a
    text: Add the components first and integrate one scalar
    media: []
    issueSignals: 
  - id: b
    text: Integrate only the component with the largest magnitude
    media: []
    issueSignals: 
  - id: c
    text: Integrate each component and assemble a vector
    media: []
    issueSignals: 
  - id: d
    text: Replace the integral by a cross product
    media: []
    issueSignals: 
- id: r006
  type: recognition
  prompt: If $|\mathbf r(t)|$ is constant, what relation follows?
  answer:
    expected: r prime dot r equals zero
    expectedLatex: 
    aliases:
    - r'(t) dot r(t) = 0
    media: []
    choiceId: d
  explanation: >
    Solution: Choose $\mathbf r'(t)\cdot\mathbf r(t)=0$.

    Why it works: Differentiating $\mathbf r(t)\cdot\mathbf r(t)=|\mathbf r(t)|^2$, a constant, gives $2\mathbf r'(t)\cdot\mathbf r(t)=0$.

    Why the other choices fail: a need not hold on a sphere. b equates different geometric vectors. c has no consequence from constant position magnitude.
  tags: []
  skills: []
  issueSignals:
  - id: tangent-vector-role-error
    domains: []
  choices:
