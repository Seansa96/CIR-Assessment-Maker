directedProject:
  summary: Preserve existing file bytes while adding caller-controlled journal entries.
  estimatedTimeMinutes: 45
  outcomes:
  - Implement the append-mode-write family from a precise contract.
  - Explain the invariant and complexity of the implementation.
  - Adapt the base solution to changed requirements without breaking edge cases.
  environment:
    name: Local C++20 console project
    platform:
    - windows
    - linux
    - macos
    toolVersion: C++20
    requiredAccounts: []
    prerequisites:
    - Functions
    - loops
    - standard library containers
    installLinks: []
  resources: []
  phases:
  - id: phase-1-contract-and-approach
    title: Understand the contract and approach
    required: true
    goal: Translate the problem into an invariant before coding.
    steps:
    - id: step-1-problem-contract
      title: Read the canonical problem
      instruction: |
        Source family: `cpp-fsf-file-007`

        Implement `bool append_file_bytes(const std::filesystem::path& path,
        std::string_view data)`. Append `data` exactly as supplied in binary
        mode, creating the file if it does not exist. Do not insert a newline
        automatically. Return false if opening, writing, or flushing fails.
      expectedObservation: Requires explicit append mode and exact ownership of newline insertion.
      checklist:
      - id: contract-input-output
        text: I can state the exact input, output, and edge-case policy.
      - id: contract-complexity
        text: I identified which operations determine the time and space cost.
      resources: []
    - id: step-2-approach
      title: Plan the implementation
      instruction: |
        Use this approach before opening the sample solution:

        1. Open with `std::ios::app` so every write targets the end.
        2. Write the supplied view by size to preserve embedded null bytes.
        3. Make newline insertion part of the caller-visible contract rather than a hidden side effect.
        4. Flush and check the stream before reporting success.

        Write a short trace for one nontrivial input.
      expectedObservation: Open with binary append semantics, write the complete view by length, flush,
        and report the final stream state.
      checklist:
      - id: approach-invariant
        text: My trace preserves the stated invariant at every step.
      resources: []
  - id: phase-2-reference-and-build
    title: Study the example and build your version
    required: true
    goal: Connect the approach to complete, compilable C++.
    steps:
    - id: step-3-example-solution
      title: Trace the example solution
      instruction: |
        `std::ios::app` positions every write at the end, preserving earlier
        content. The function writes the view's explicit size, so embedded null
        bytes and the caller's exact newline choice are retained.

        ```cpp
        #include <filesystem>
        #include <fstream>
        #include <string_view>

        bool append_file_bytes(const std::filesystem::path& path,
                               std::string_view data) {
            std::ofstream output(path, std::ios::binary | std::ios::app);
            if (!output) return false;
            output.write(data.data(),
                         static_cast<std::streamsize>(data.size()));
            output.flush();
            return static_cast<bool>(output);
        }
        ```

        Trace this solution against every representative case before writing your own version. The sample is a reference, not starter code.
      expectedObservation: Open with binary append semantics, write the complete view by length, flush,
        and report the final stream state.
      checklist:
      - id: solution-explained
        text: I can explain every branch, loop, and edge-case decision.
      - id: trap-avoided
        text: 'I can explain why this trap is wrong: Opening with the default output mode, which truncates
          the existing file before writing.'
      resources: []
    - id: step-4-build
      title: Implement independently
      instruction: |
        Create `main.cpp` and implement the canonical contract without copying the reference. Add the representative cases from the bank plus at least three edge cases.
      files:
      - path: main.cpp
        purpose: Learner implementation and tests
        suggestedContent: |
          // Implement the required function here.
          // Keep main() small and use it only for your own test cases.

          int main() {
              return 0;
          }
        readOnly: false
      checklist:
      - id: build-compiles
        text: The program compiles with C++20 warnings enabled.
      - id: build-tests
        text: Representative and edge cases pass.
      troubleshooting:
      - problem: Output differs only at an edge case.
        suggestion: Opening with the default output mode, which truncates the existing file before writing.
      resources: []
  - id: phase-3-variants
    title: Implement changed-condition variants
    required: true
    goal: Generalize the family instead of memorizing one solution.
    steps:
    - id: step-5-variants
      title: Complete the family variants
      instruction: |
        Extend the program with these variants:

        1. Add `append_line` that inserts exactly one newline before a new entry when required.
        2. Prefix entries with a supplied timestamp and severity field.
        3. Reopen the file and verify that the old prefix is unchanged and the new suffix is exact.

        Keep each behavior in a separately testable function.
      checklist:
      - id: variants-distinct
        text: Each variant changes behavior or constraints, not only sample data.
      - id: variants-regression
        text: The original canonical tests still pass.
      notesPrompt: Which part of the original invariant survived every variant, and which part had to
        change?
      resources: []
