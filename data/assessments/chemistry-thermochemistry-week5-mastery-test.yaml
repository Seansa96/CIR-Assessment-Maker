modeDefault: scored
randomizeQuestions: true
attemptQuestionCount: 12
questions:
  - id: q001
    type: numericResponse
    prompt: A 75.0 g metal sample with $c=0.385\ \text{J/(g}\cdot{}^\circ\text{C)}$ absorbs 578 J. What is its temperature increase in $^\circ$C?
    answer:
      value: 20
      tolerance: 0.1
    explanation: |
      $$\Delta T=\frac{578}{(75.0)(0.385)}=20.0^\circ\text{C}$$
  - id: q002
    type: numericResponse
    prompt: A 180.0 g material warms by $15.0^\circ\text{C}$ after absorbing 3.24 kJ. Find its specific heat in J/(g$\cdot{}^\circ$C).
    answer:
      value: 1.2
      tolerance: 0.01
    explanation: |
      $$c=\frac{3240}{(180.0)(15.0)}=1.20\ \text{J/(g}\cdot{}^\circ\text{C)}$$
  - id: q003
    type: numericResponse
    prompt: |
      $$2\text{SO}_2(g)+\text{O}_2(g)\rightarrow2\text{SO}_3(g)\qquad\Delta H=-198\ \text{kJ}$$

      Find $q_{\text{rxn}}$ in kJ when 1.50 mol of $\text{SO}_3$ forms.
    answer:
      value: -148.5
      tolerance: 0.5
    explanation: |
      $$1.50\ \text{mol SO}_3\left(\frac{-198\ \text{kJ}}{2\ \text{mol SO}_3}\right)=-148.5\ \text{kJ}$$
  - id: q004
    type: multipleChoice
    prompt: Which energy transfer describes an exothermic reaction?
    choices:
      - id: a
        text: Heat enters the system and $\Delta H>0$.
      - id: b
        text: Heat leaves the system and $\Delta H<0$.
      - id: c
        text: Heat enters the system and $\Delta H<0$.
      - id: d
        text: No heat crosses the system boundary.
    answer:
      choiceId: b
    explanation: Exothermic reactions release heat from the system, producing a negative enthalpy change.
  - id: q005
    type: numericResponse
    prompt: An object has $C=48.0\ \text{J}/^\circ\text{C}$ and cools by $18.0^\circ\text{C}$. What is $q$ in J for the object?
    answer:
      value: -864
      tolerance: 1
    explanation: |
      $$q=C\Delta T=(48.0)(-18.0)=-864\ \text{J}$$
  - id: q006
    type: multipleChoice
    prompt: Why must the equation be balanced before using a listed reaction enthalpy?
    choices:
      - id: a
        text: Enthalpy is tied to the stoichiometric amounts in the balanced equation.
      - id: b
        text: Balancing makes all reactions exothermic.
      - id: c
        text: Only balanced equations contain products.
      - id: d
        text: The mass of every substance must be identical.
    answer:
      choiceId: a
    explanation: The stated $\Delta H$ applies to the mole quantities represented by the balanced coefficients.
  - id: q007
    type: numericResponse
    prompt: A 40.0 g sample absorbs 360 J and its temperature rises by $12.0^\circ\text{C}$. What is $c$ in J/(g$\cdot{}^\circ$C)?
    answer:
      value: 0.75
      tolerance: 0.01
    explanation: |
      $$c=\frac{360}{(40.0)(12.0)}=0.750\ \text{J/(g}\cdot{}^\circ\text{C)}$$
  - id: q008
    type: numericResponse
    prompt: |
      Formation of 1.00 mol of $\text{CO}_2$ has $\Delta H=-394\ \text{kJ/mol}$.
      How much heat in kJ is released when 8.80 g of $\text{CO}_2$ forms? Use $M=44.0\ \text{g/mol}$.
    answer:
      value: -78.8
      tolerance: 0.3
    explanation: |
      $$8.80\ \text{g}\left(\frac{1\ \text{mol}}{44.0\ \text{g}}\right)\left(\frac{-394\ \text{kJ}}{1\ \text{mol}}\right)=-78.8\ \text{kJ}$$
  - id: q009
    type: multipleChoice
    prompt: A reaction vessel releases heat. What happens to the enthalpy of the reaction system relative to its surroundings?
    choices:
      - id: a
        text: The system gains heat from the surroundings.
      - id: b
        text: The system loses heat and the surroundings gain that energy.
      - id: c
        text: Both system and surroundings lose energy.
      - id: d
        text: Energy is destroyed by the reaction.
    answer:
      choiceId: b
    explanation: 'Energy is conserved: heat released by the system is gained by the surroundings.'
  - id: q010
    type: numericResponse
    prompt: How many J are required to warm 30.0 g of a substance with $c=2.00\ \text{J/(g}\cdot{}^\circ\text{C)}$ by $25.0^\circ\text{C}$?
    answer:
      value: 1500
      tolerance: 2
    explanation: |
      $$q=(30.0)(2.00)(25.0)=1500\ \text{J}$$
  - id: q011
    type: multipleChoice
    prompt: If every coefficient in a thermochemical equation is doubled, what happens to $\Delta H$?
    choices:
      - id: a
        text: It is halved.
      - id: b
        text: It is unchanged.
      - id: c
        text: Its magnitude doubles while its sign stays the same.
      - id: d
        text: It becomes zero.
    answer:
      choiceId: c
    explanation: Enthalpy is extensive, so scaling the reaction amount scales $\Delta H$ by the same factor.
  - id: q012
    type: numericResponse
    prompt: A 120.0 g sample of water loses 1.00 kJ of heat. What is its temperature change in $^\circ$C? Use $c=4.184\ \text{J/(g}\cdot{}^\circ\text{C)}$.
    answer:
      value: -1.99
      tolerance: 0.03
    explanation: |
      $$\Delta T=\frac{-1000}{(120.0)(4.184)}=-1.99^\circ\text{C}$$
