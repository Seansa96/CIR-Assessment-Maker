questions:
- id: q001
  type: freeResponse
  prompt: '**Dropping a Ball**


    A $2.0\ \text{kg}$ ball is dropped from rest from a height of $5.0\ \text{m}$.


    Using energy conservation, find its speed just before it hits the ground. (Use
    $g = 9.8\ \text{m/s}^2$).

    '
  answer:
    expected: '$9.9\ \text{m/s}$. Set $mgh = \frac{1}{2}mv^2$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Initial energy is entirely gravitational potential energy ($mgh$).
    - Final energy is entirely kinetic energy ($\frac{1}{2}mv^2$).
    - Mass cancels out.
    - $v = \sqrt{2gh}$.
  explanation: 'By conservation of mechanical energy:

    $$E_i = E_f$$

    $$U_i + K_i = U_f + K_f$$

    $$mgh + 0 = 0 + \frac{1}{2}mv^2$$


    The mass $m$ cancels out:

    $$gh = \frac{1}{2}v^2$$

    $$v = \sqrt{2gh} = \sqrt{2(9.8)(5.0)} = \sqrt{98} \a\approx 9.9\ \text{m/s}$$

    '
- id: q002
  type: freeResponse
  prompt: "**Spring Launch**\n\nA block of mass $m = 0.50\\ \\text{kg}$ is pushed\
    \ against a\rhorizontal spring with spring constant $k = 200\\ \\text{N/m}$, compressing\
    \ it by $x = 0.20\\ \\text{m}$. The block is released from rest. \n\nIf the surface\
    \ is frictionless, what is the block's maximum speed?\n"
  answer:
    expected: '$4.0\ \text{m/s}$. Set $\frac{1}{2}kx^2 = \frac{1}{2}mv^2$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Initial energy is entirely elastic potential energy ($\frac{1}{2}kx^2$).
    - Final energy is entirely kinetic energy ($\frac{1}{2}mv^2$).
    - Set them equal and solve for $v$.
  explanation: 'The system is isolated and frictionless, so mechanical energy is conserved:

    $$E_i = E_f$$

    $$\frac{1}{2}kx^2 = \frac{1}{2}mv^2$$


    Solving for $v$:

    $$v = \sqrt{\frac{k}{m}}x = \sqrt{\frac{200}{0.50}}(0.20) = \sqrt{400}(0.20) =
    20(0.20) = 4.0\ \text{m/s}$$

    '
- id: q003
  type: freeResponse
  prompt: '**Pendulum Swing**


    A pendulum bob is released from rest at an angle such that it is $0.80\ \text{m}$
    higher than its lowest point.


    What is its speed when it passes through the lowest point? (Use $g = 9.8\ \text{m/s}^2$).

    '
  answer:
    expected: '$3.96\ \text{m/s}$. Set $mgh = \frac{1}{2}mv^2$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Tension does no work because it is always perpendicular to motion.
    - Initial energy is $mgh$ where $h=0.80$.
    - Final energy is $\frac{1}{2}mv^2$.
  explanation: 'Even though the path is curved, the only force doing work is gravity
    (tension is perpendicular to the velocity, so it does zero work). Mechanical energy
    is conserved.


    $$mgh = \frac{1}{2}mv^2$$

    $$v = \sqrt{2gh} = \sqrt{2(9.8)(0.80)} = \sqrt{15.68} \a\approx 3.96\ \text{m/s}$$

    '
- id: q004
  type: freeResponse
  prompt: "**Friction on a Ramp**\n\nA $1.0\\ \\text{kg}$ block starts from rest at\
    \ the top of a $3.0\\ \\text{m}$ high ramp. When it reaches the bottom, its speed\
    \ is $6.0\\ \\text{m/s}$. \n\nHow much work was done by non-conservative forces\
    \ (friction and air resistance) during the slide? (Use $g = 9.8\\ \\text{m/s}^2$).\n"
  answer:
    expected: '$-11.4\ \text{J}$. $W_{nc} = E_f - E_i = 18 - 29.4$.

      '
    gradingMode: selfCheck
    keyPoints:
    - 'Use the generalized work-energy theorem: $W_{nc} = \Delta E = E_f - E_i$.'
    - $E_i = mgh = 1(9.8)(3) = 29.4\ \text{J}$.
    - $E_f = \frac{1}{2}mv^2 = 0.5(1)(36) = 18.0\ \text{J}$.
    - $W_{nc} = 18.0 - 29.4$.
  explanation: 'Because friction is present, mechanical energy is not conserved. We
    use the modified energy equation:

    $$E_i + W_{nc} = E_f$$

    $$W_{nc} = E_f - E_i$$


    Calculate the initial energy (all potential):

    $$E_i = U_i = mgh = (1.0)(9.8)(3.0) = 29.4\ \text{J}$$


    Calculate the final energy (all kinetic):

    $$E_f = K_f = \frac{1}{2}mv^2 = \frac{1}{2}(1.0)(6.0)^2 = 18.0\ \text{J}$$


    The work done by non-conservative forces is:

    $$W_{nc} = 18.0 - 29.4 = -11.4\ \text{J}$$


    The negative sign indicates that friction removed mechanical energy from the system,
    converting it to thermal energy.

    '
