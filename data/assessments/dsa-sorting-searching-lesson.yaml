questions:
  - id: intro-search
    type: freeResponse
    prompt: |
      **Searching Data**

      When searching an array for a specific value, the simplest approach is a **Linear Search**: check the first element, then the second, and so on until you find the target or reach the end. Because you might have to check every element, Linear Search has a worst-case time complexity of $O(N)$.

      However, if the array is already **sorted**, you can use **Binary Search**. Binary Search starts by checking the middle element. If the target is smaller, you discard the upper half of the array. If it's larger, you discard the lower half. This repeatedly halves the search space until the target is found.
      
      Halving the search space means Binary Search has a worst-case time complexity of $O(\log_2 N)$, which is incredibly fast for large datasets.

      If Binary Search is so much faster, why don't we always use it instead of Linear Search?
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution:
      Binary search requires the data to be sorted first. If the data is unsorted, you must sort it before applying binary search.

      Why it works:
      Sorting an array takes at least $O(N \log N)$ time. If you only need to search the array once, sorting it first ($O(N \log N) + O(\log N)$) is actually slower than just doing a single linear search ($O(N)$). Binary search pays off when you need to perform *many* searches on the same dataset.
