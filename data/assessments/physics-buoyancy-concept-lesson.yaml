  - id: apparent-weight
    title: 3. Apparent Weight
    required: true
    content: >
      When an object is completely submerged in a fluid, the upward buoyant force counteracts some of the downward force of gravity. This makes the object feel lighter.


      The **apparent weight** ($W_{app}$) is the net downward force when measured in the fluid (such as the tension in a string holding the object underwater):

      $$ W_{app} = W_{true} - F_B $$

      $$ W_{app} = mg - \rho_{fluid} V_{sub} g $$
    media: []
    check:
      id: check-3
      type: numericResponse
      prompt: >
        A rock has a true weight of $100 \text{ N}$ in air. When suspended from a spring scale and completely submerged in water, the buoyant force pushing up on the rock is $30 \text{ N}$.

        What is the apparent weight of the rock (the reading on the scale) in Newtons?
      choices: []
      answer:
        choiceId:
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value: 70
        tolerance: 0.1
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >
        Solution:

        $W_{app} = W_{true} - F_B = 100 - 30 = 70 \text{ N}$.


        Why it works:

        The spring scale measures the tension required to support the rock. Since the water pushes up with $30 \text{ N}$, the scale only needs to pull up with the remaining $70 \text{ N}$ to balance the $100 \text{ N}$ gravitational force.
