  - id: floating-vs-sinking
    title: 2. Floating vs Sinking
    required: true
    content: >
      An object's tendency to float or sink depends on the relationship between its density ($\rho_{obj}$) and the fluid's density ($\rho_{fluid}$).


      If an object is completely submerged, its volume is $V_{sub} = V_{obj}$.

      - **Weight of object**: $W = \rho_{obj} V_{obj} g$

      - **Buoyant force**: $F_B = \rho_{fluid} V_{obj} g$


      Comparing these forces:

      - **If $\rho_{obj} > \rho_{fluid}$**, then $W > F_B$, and the object **sinks**.

      - **If $\rho_{obj} < \rho_{fluid}$**, then $W < F_B$ when fully submerged. The object accelerates upward and breaks the surface. It will come to rest partially submerged, such that $F_B = W$.

      - **If $\rho_{obj} = \rho_{fluid}$**, it is **neutrally buoyant** and can hover at any depth.
    media: []
    check:
      id: check-2
      type: multipleChoice
      prompt: >
        A steel ship floats on the ocean, even though solid steel is much denser than water. How is this possible according to Archimedes' Principle?
      choices:
      - id: a
        text: The salt in the ocean makes the water dense enough to support solid steel.
        media: []
        issueSignals:
        - id: fluid-density-confusion
          domains: []
      - id: b
        text: The ship’s hull encloses a large volume of air, making the average density of the entire ship less than that of water.
        media: []
        issueSignals: []
      - id: c
        text: Archimedes’ Principle does not apply to objects on the surface.
        media: []
        issueSignals:
        - id: buoyancy-surface-confusion
          domains: []
        - id: principle-misapplied
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: >
        Solution:

        The ship’s hull encloses a large volume of air, making the average density of the entire ship less than that of water.


        Why it works:

        An object floats if its *overall average density* is less than the fluid. By shaping the steel into a hollow hull containing mostly air, the ship’s total volume is vastly increased while keeping the mass relatively low, dropping its average density below that of seawater.


        Why the other choices fail:

        While seawater is slightly denser than freshwater, solid steel is still roughly 7.5 times denser than seawater and would sink immediately without a hollow hull. Archimedes' principle applies to all objects in a fluid.
