workedExamples:
  - id: we-hanging-mass-elevator
    title: Apparent Weight of a Hanging Mass
    problem: |-
      A mass $m$ is hung from a spring scale attached to the ceiling of an elevator.

      First, using **Newton's Second Law**, derive a symbolic expression for the tension $T$ in the scale (the apparent weight) if the elevator is accelerating upwards with acceleration $a$.

      Then, calculate the tension $T$ if $m = 8.0 \text{ kg}$, the elevator is accelerating upwards at $a = 2.0 \text{ m/s}^2$, and $g = 9.8 \text{ m/s}^2$.
    steps:
      - id: step-we-hanging-mass-elevator-1
        title: Draw the Free Body Diagram (FBD)
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        explanation: |-
          Solution:
          Isolate the hanging mass. Its free-body diagram has an upward tension force $T$ and a downward gravitational force $mg$; choose upward as positive.

          Why it works:
          Newton's second law applies to one object at a time, so identifying every external force and the positive direction fixes the signs used in the force equation.
        instruction: |-
          The first step in any Newton's Laws problem is to isolate the object of interest and identify all the forces acting on it.

          For the hanging mass $m$, there are exactly two forces:
          1.  **Tension ($T$):** The upward force exerted by the spring scale on the mass. This is what the scale reads as the "apparent weight".
          2.  **Gravity ($mg$):** The downward force exerted by the Earth on the mass.

          We choose a coordinate system. Let's define the **upward direction as positive** ($+y$).
          Since the elevator is accelerating upwards, the acceleration vector $\vec{a}$ is also in the $+y$ direction.
      - id: step-we-hanging-mass-elevator-2
        title: Apply Newton's Second Law Symbolically
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        explanation: |-
          Solution:
          With upward positive, write $T-mg=ma$ and solve to obtain $T=m(g+a)$.

          Why it works:
          The net upward force is tension minus weight. A positive upward acceleration requires the tension to exceed the weight.
        instruction: |-
          Newton's Second Law states that the net force acting on an object is equal to its mass times its acceleration:
          $$\sum F_y = ma_y$$

          Looking at our FBD, we sum the forces in the $y$-direction. Tension $T$ points up (positive), and gravity $mg$ points down (negative):
          $$T - mg = ma$$

          To find the tension $T$, we simply isolate it on one side of the equation:
          $$T = mg + ma$$
          $$T = m(g + a)$$

          This symbolic result is highly informative. It tells us that when the elevator accelerates upwards ($a > 0$), the tension $T$ is greater than the actual weight $mg$. The spring scale must not only support the object's weight but also provide the extra force needed to accelerate it upwards.
      - id: step-we-hanging-mass-elevator-3
        title: Substitute Numerical Values
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        explanation: |-
          Solution:
          Substitute $m=8.0\ \text{kg}$, $g=9.8\ \text{m/s}^2$, and $a=2.0\ \text{m/s}^2$ into $T=m(g+a)$ to get $94.4\ \text{N}$.

          Why it works:
          The units reduce to newtons, and the answer is larger than $mg$ because the scale also accelerates the mass upward.
        instruction: |-
          Now we use our derived formula to compute the specific numerical answer.

          Given values:
          $m = 8.0 \text{ kg}$
          $a = 2.0 \text{ m/s}^2$
          $g = 9.8 \text{ m/s}^2$

          Substitute these into our symbolic equation:
          $$T = 8.0(9.8 + 2.0)$$
          $$T = 8.0(11.8)$$
          $$T = 94.4 \text{ N}$$

          The scale will read a tension of $94.4 \text{ N}$. Notice that this is larger than the object's actual resting weight of $78.4 \text{ N}$ ($8.0 \times 9.8$).
  - id: hanging-mass-we002
    title: Elevator Accelerating Downward
    problem: |-
      A $5.0\ \text{kg}$ toolbox hangs from a scale in an elevator accelerating downward at $1.6\ \text{m/s}^2$. Find the scale reading. Use $g=9.8\ \text{m/s}^2$.
    steps:
      - id: hanging-mass-we002-step-1
        title: Set the force equation
        instruction: 'Complete this step.'
        type: symbolicResponse
        prompt: With upward positive, write Newton's second-law equation for the toolbox.
        answer:
          expectedLatex: 'T-mg=-ma'
          equivalenceMode: expression
          tolerance: 0
        explanation: |-
          Solution:
          The downward acceleration is $-a$, so the vertical force equation is $T-mg=-ma$.

          Why it works:
          Tension is positive and weight is negative in the chosen coordinate system; the acceleration sign must match the stated direction.
      - id: hanging-mass-we002-step-2
        title: Calculate the scale reading
        instruction: 'Complete this step.'
        type: numericResponse
        prompt: Calculate $T$ in newtons.
        answer:
          value: 41.0
          tolerance: 0.1
        explanation: |-
          Solution:
          Solve $T=m(g-a)$ and evaluate $T=5.0(9.8-1.6)=41.0\ \text{N}$.

          Why it works:
          During downward acceleration, the scale needs less upward force than at rest, so the apparent weight is less than $mg$.
