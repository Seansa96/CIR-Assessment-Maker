questions:
- id: q001
  type: numericResponse
  prompt: |
    A block of wood of mass $5.0 \text{ kg}$ and density $600 \text{ kg/m}^3$ is held completely underwater ($\rho_{water} = 1000 \text{ kg/m}^3$) by a string tied to the bottom of a tank.
    Calculate the tension in the string in Newtons. Use $g = 9.8 \text{ m/s}^2$.
  answer:
    value: 32.67
    tolerance: 0.1
  explanation: |
    Solution:
    First, find the volume of the block: $V = \frac{m_{wood}}{\rho_{wood}} = \frac{5.0}{600} = 0.008333 \text{ m}^3$.
    Next, find the weight: $W = mg = 5.0 \times 9.8 = 49.0 \text{ N}$.
    Next, find the buoyant force: $F_B = \rho_{water} V g = 1000 \times 0.008333 \times 9.8 = 81.667 \text{ N}$.
    Since the block is in equilibrium, the upward forces equal the downward forces:
    $F_B = W + T$
    $T = F_B - W = 81.667 - 49.0 = 32.667 \text{ N}$.
    
    Why it works:
    The wood is less dense than water, so the buoyant force is greater than its weight. Left alone, it would float to the surface. To keep it completely submerged, the string must pull down with a tension that exactly cancels the excess buoyant force.
  difficultyDimensions:
  - RepresentationTransfer
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: |
    A hot air balloon has a total volume of $2500 \text{ m}^3$. The density of the surrounding cool atmospheric air is $1.2 \text{ kg/m}^3$ and the density of the hot air inside the balloon is $0.9 \text{ kg/m}^3$. 
    Assuming the balloon fabric and basket have a combined mass of $200 \text{ kg}$, calculate the net vertical force acting on the entire system in Newtons. Use $g = 9.8 \text{ m/s}^2$.
  answer:
    value: 5390
    tolerance: 10
  explanation: |
    Solution:
    First, calculate the total downward force (weight of hot air + weight of fabric/basket):
    $m_{hot\_air} = \rho_{hot} V = (0.9)(2500) = 2250 \text{ kg}$.
    $W_{total} = (m_{hot\_air} + m_{fabric}) g = (2250 + 200) \times 9.8 = 2450 \times 9.8 = 24010 \text{ N}$.
    Next, calculate the upward buoyant force (weight of displaced cool air):
    $F_B = \rho_{cool} V g = (1.2)(2500)(9.8) = 3000 \times 9.8 = 29400 \text{ N}$.
    The net vertical force is $F_{net} = F_B - W_{total} = 29400 - 24010 = 5390 \text{ N}$.
    
    Why it works:
    A hot air balloon operates on Archimedes' Principle just like a submarine. The hot air is treated as part of the object's total mass. Because the displaced cool air weighs more than the hot air plus the basket, the net force is upward.
  difficultyDimensions:
  - RepresentationTransfer
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
