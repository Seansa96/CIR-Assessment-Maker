questions:
- id: q001
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int 4x(2x^2+1)^5\,dx$?
  choices:
  - id: a
    text: U-substitution
  - id: b
    text: Integration by parts
  - id: c
    text: Trig substitution
  - id: d
    text: Partial fractions
  answer:
    choiceId: a
  explanation: 'The inside is $2x^2+1$ and its derivative $4x$ is present. Related
    topic: U-substitution; look for inside plus derivative.'
- id: q002
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int x\ln x\,dx$?
  choices:
  - id: a
    text: Integration by parts
  - id: b
    text: Trig substitution
  - id: c
    text: Partial fractions
  - id: d
    text: Direct power rule only
  answer:
    choiceId: a
  explanation: 'This is a product where $\ln x$ becomes simpler when differentiated.
    Related topic: Integration by parts; choose $u=\ln x$ or use LIATE.'
- id: q003
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int \frac{5}{x^2-9}\,dx$?
  choices:
  - id: a
    text: Partial fractions
  - id: b
    text: U-substitution
  - id: c
    text: Integration by parts
  - id: d
    text: Tabular parts
  answer:
    choiceId: a
  explanation: '$x^2-9=(x-3)(x+3)$, so decompose the rational function. Related topic:
    Partial fractions; factor the denominator first.'
- id: q004
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int \sqrt{25-x^2}\,dx$?
  choices:
  - id: a
    text: Trig substitution with $x=5\sin\theta$
  - id: b
    text: Partial fractions
  - id: c
    text: U-substitution with $u=25-x^2$
  - id: d
    text: Polynomial long division
  answer:
    choiceId: a
  explanation: 'The radical has $a^2-x^2$. Related topic: Trig substitution; use sine
    for $a^2-x^2$.'
- id: q005
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int \frac{x}{x^2+4}\,dx$?
  choices:
  - id: a
    text: U-substitution
  - id: b
    text: Trig substitution
  - id: c
    text: Integration by parts
  - id: d
    text: Power reduction
  answer:
    choiceId: a
  explanation: 'The numerator is proportional to the derivative of the denominator.
    Related topic: U-substitution; constants can be adjusted.'
- id: q006
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int x^2 e^x\,dx$?
  choices:
  - id: a
    text: Repeated integration by parts
  - id: b
    text: Trig substitution
  - id: c
    text: Partial fractions
  - id: d
    text: Completing the square
  answer:
    choiceId: a
  explanation: 'The polynomial factor simplifies after repeated differentiation. Related
    topic: Tabular integration by parts.'
- id: q007
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int \frac{x^2+1}{x-1}\,dx$?
  choices:
  - id: a
    text: Polynomial division first
  - id: b
    text: Trig substitution first
  - id: c
    text: Cyclic integration by parts
  - id: d
    text: Power reduction
  answer:
    choiceId: a
  explanation: 'The rational function is improper because the numerator degree is
    at least the denominator degree. Related topic: Rational integration; divide before
    decomposing.'
- id: q008
  type: multipleChoice
  prompt: What is the most efficient strategy for $\int e^x\sin x\,dx$?
  choices:
  - id: a
    text: Cyclic integration by parts
  - id: b
    text: U-substitution
  - id: c
    text: Partial fractions
  - id: d
    text: Trig substitution
  answer:
    choiceId: a
  explanation: 'Exponential times trig cycles back to the original integral after
    two parts steps. Related topic: Cyclic integration by parts; solve algebraically
    for the original integral.'
