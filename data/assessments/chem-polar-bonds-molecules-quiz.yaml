questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Electronegativity generally **increases** as you move:
    choices:
      - id: a
        text: Down a group and to the right across a period
      - id: b
        text: Up a group and to the left across a period
      - id: c
        text: Up a group and to the right across a period
      - id: d
        text: Down a group and to the left across a period
    answer:
      choiceId: c
    explanation: |
      Electronegativity increases going **up** a group (smaller atom, nucleus closer to bonding electrons) and going **right** across a period (increasing nuclear charge, better attraction for electrons). Fluorine (top right, Group 17) has the highest EN = 4.0.

  - id: q002
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      In a polar covalent bond between atoms A and B, where does the partial negative charge ($\delta^-$) appear?
    choices:
      - id: a
        text: On the less electronegative atom (A), which loses electrons
      - id: b
        text: On the more electronegative atom (B), which pulls electrons toward itself
      - id: c
        text: Equally on both atoms, as a shared charge
      - id: d
        text: Only in the region between the two atoms
    answer:
      choiceId: b
    explanation: |
      The more electronegative atom pulls the shared electrons closer, acquiring a partial negative charge ($\delta^-$). The less electronegative atom is left electron-poor with a partial positive charge ($\delta^+$).

  - id: q003
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Which of the following is a **nonpolar covalent bond**?
    choices:
      - id: a
        text: 'H—F ($\Delta$EN = 1.9)'
      - id: b
        text: 'O—H ($\Delta$EN = 1.4)'
      - id: c
        text: 'C—C ($\Delta$EN = 0)'
      - id: d
        text: 'N—H ($\Delta$EN = 0.9)'
    answer:
      choiceId: c
    explanation: |
      A C—C bond connects two identical atoms with $\Delta EN = 0$. The shared electrons are attracted equally by both nuclei, resulting in a completely **nonpolar covalent bond**. All the other bonds have $\Delta EN > 0.4$ and are polar covalent.

  - id: q004
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      $CCl_4$ has four polar C—Cl bonds. Yet the molecule has **zero net dipole moment**. The reason is:
    choices:
      - id: a
        text: The C—Cl bonds cancel each other's polarity because chlorine is too large
      - id: b
        text: The perfect tetrahedral symmetry makes the four C—Cl dipoles point symmetrically outward and cancel as vectors
      - id: c
        text: The carbon's formal charge of zero cancels the bond dipoles
      - id: d
        text: C—Cl bonds are ionic rather than covalent at this bond length
    answer:
      choiceId: b
    explanation: |
      In the perfect tetrahedral arrangement of $CCl_4$, the four C—Cl bond dipoles point symmetrically toward the four corners of a tetrahedron. Their vector sum is exactly zero. Molecular polarity requires both polar bonds **and** an asymmetric arrangement — $CCl_4$ fails the second condition.

  - id: q005
    type: selectAll
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Select all molecules that are **polar** (net dipole moment ≠ 0).
    choices:
      - id: a
        text: '$H_2O$ (bent geometry)'
      - id: b
        text: '$SF_6$ (octahedral, all S—F bonds)'
      - id: c
        text: '$CHCl_3$ (tetrahedral, one C—H and three C—Cl)'
      - id: d
        text: '$N_2$ (linear, homonuclear)'
    answer:
      choiceIds:
        - a
        - c
    explanation: |
      **$H_2O$**: bent + polar O—H bonds → dipoles don't cancel → **polar** ✓

      **$SF_6$**: perfect octahedral symmetry, all 6 S—F bonds identical → dipoles cancel → nonpolar ✗

      **$CHCl_3$**: tetrahedral but **asymmetric** (one C—H ≠ three C—Cl) → dipoles don't cancel → **polar** ✓

      **$N_2$**: homonuclear, $\Delta$EN = 0, no bond dipoles → nonpolar ✗

  - id: q006
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Which of the following correctly orders the molecules from **least polar** to **most polar**?

      H—H ($\Delta$EN = 0); H—Cl ($\Delta$EN = 0.9); H—F ($\Delta$EN = 1.9)
    choices:
      - id: a
        text: 'H—H < H—F < H—Cl'
      - id: b
        text: 'H—F < H—Cl < H—H'
      - id: c
        text: 'H—H < H—Cl < H—F'
      - id: d
        text: 'H—Cl < H—H < H—F'
    answer:
      choiceId: c
    explanation: |
      Bond polarity increases with $\Delta EN$: H—H ($\Delta EN = 0$) is completely nonpolar; H—Cl (0.9) is moderately polar; H—F (1.9) is the most polar hydrogen-halide bond. Order: H—H < H—Cl < H—F.

  - id: q007
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      The principle "like dissolves like" refers to:
    choices:
      - id: a
        text: Polar solvents dissolve polar and ionic solutes; nonpolar solvents dissolve nonpolar solutes
      - id: b
        text: Large molecules dissolve large molecules; small molecules dissolve small molecules
      - id: c
        text: Acids dissolve in acidic solutions; bases dissolve in basic solutions
      - id: d
        text: Solid solutes dissolve only in solid solvents
    answer:
      choiceId: a
    explanation: |
      "Like dissolves like" is a polarity rule: **polar** solvents (e.g., water) dissolve **polar** and **ionic** solutes through ion-dipole and dipole-dipole interactions; **nonpolar** solvents (e.g., hexane) dissolve **nonpolar** solutes through London dispersion forces. Mixing polar and nonpolar substances results in immiscibility.

  - id: q008
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Is $BF_3$ polar or nonpolar? (B—F bonds are polar; $\Delta EN \approx 2.0$)
    choices:
      - id: a
        text: Polar, because B—F bonds are strongly polar
      - id: b
        text: Nonpolar, because the trigonal planar geometry causes the three B—F bond dipoles to cancel
      - id: c
        text: Polar, because B has an incomplete octet
      - id: d
        text: Nonpolar, because B—F bonds are actually ionic
    answer:
      choiceId: b
    explanation: |
      $BF_3$ is trigonal planar (AX₃E₀) — all three B—F bond dipoles are equal and separated by 120°. In a symmetric trigonal planar arrangement, the three vectors cancel exactly (the resultant is zero). $BF_3$ is **nonpolar** despite its very polar bonds.

  - id: q009
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      In the dipole moment convention, the dipole arrow points:
    choices:
      - id: a
        text: 'From the negative end ($\delta^-$) toward the positive end ($\delta^+$)'
      - id: b
        text: 'From the positive end ($\delta^+$) toward the negative end ($\delta^-$)'
      - id: c
        text: 'Perpendicular to the bond axis'
      - id: d
        text: 'Away from both atoms toward the surrounding space'
    answer:
      choiceId: b
    explanation: |
      The standard convention (used in Brown/LeMay and most general chemistry texts) draws the dipole arrow from the partial positive end ($\delta^+$) pointing **toward** the partial negative end ($\delta^-$). The arrow points in the direction electrons are shifted — toward the more electronegative atom.

  - id: q010
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      Consider $NF_3$ and $BF_3$ — both have 3 bonds to fluorine. $NF_3$ is **polar** but $BF_3$ is **nonpolar**. The key difference is:
    choices:
      - id: a
        text: '$NF_3$ has more polar bonds because N is more electronegative than B'
      - id: b
        text: '$NF_3$ has a lone pair on N (AX₃E₁, trigonal pyramidal) that breaks symmetry; $BF_3$ has no lone pair (AX₃E₀, trigonal planar) and bond dipoles cancel'
      - id: c
        text: '$NF_3$ contains hydrogen atoms that make it polar'
      - id: d
        text: '$BF_3$ is ionic and therefore not counted as having dipole moments'
    answer:
      choiceId: b
    explanation: |
      $NF_3$: N has 3 bonds + 1 lone pair → AX₃E₁ → **trigonal pyramidal** → bond dipoles + lone pair do not cancel → **polar** ($\mu \approx 0.24$ D).

      $BF_3$: B has 3 bonds + no lone pairs → AX₃E₀ → **trigonal planar** → three equal bond dipoles cancel by symmetry → **nonpolar** ($\mu = 0$).

      This is the clearest demonstration that **molecular geometry** (which depends on lone pairs) determines whether bond dipoles cancel.

  - id: q011
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      A student claims that "any molecule with polar bonds must be polar." Which molecule **disproves** this claim?
    choices:
      - id: a
        text: '$HCl$ (polar bond, linear, no central lone pairs)'
      - id: b
        text: '$H_2O$ (polar bonds, bent)'
      - id: c
        text: '$CO_2$ (polar bonds, linear, dipoles cancel)'
      - id: d
        text: '$NH_3$ (polar bonds, trigonal pyramidal)'
    answer:
      choiceId: c
    explanation: |
      $CO_2$ has two polar C=O bonds but is **nonpolar overall** because its linear geometry causes the two equal and opposite bond dipoles to cancel exactly. This directly disproves the claim that polar bonds guarantee a polar molecule.

  - id: q012
    type: multipleChoice
    skills:
      - chem-polar-bonds-molecules
    prompt: |
      The **electronegativity difference** ($\Delta EN$) between two bonded atoms is 2.5. How would this bond most accurately be classified?
    choices:
      - id: a
        text: Nonpolar covalent ($\Delta EN < 0.4$)
      - id: b
        text: Polar covalent ($0.4 \leq \Delta EN < 2.0$)
      - id: c
        text: Ionic ($\Delta EN \geq 2.0$)
      - id: d
        text: Metallic
    answer:
      choiceId: c
    explanation: |
      A $\Delta EN$ of 2.5 exceeds the approximate threshold of 2.0 for ionic character. The bond would be classified as **ionic** — the electron density is so unequal that the bond involves essentially complete electron transfer rather than sharing.
