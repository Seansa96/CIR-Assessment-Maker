sections:
- id: sec-1
  title: Power of a Point
  content: Power of a Point is a fundamental theorem relating lengths of secants,
    chords, and tangents drawn to a circle from a point.
  check:
    id: check-1
    type: multipleChoice
    prompt: If two chords AB and CD intersect at P, which relationship is true?
    options:
    - id: a
      text: AP*PB = CP*PD
    - id: b
      text: AP+PB = CP+PD
    answer:
      choiceId: a
- id: sec-2
  title: Cyclic Quadrilaterals
  content: A quadrilateral is cyclic if its opposite angles sum to 180 degrees.
  check:
    id: check-2
    type: multipleChoice
    prompt: What is the condition for a quadrilateral to be cyclic?
    options:
    - id: a
      text: Opposite angles sum to 180
    - id: b
      text: All sides are equal
    answer:
      choiceId: a
