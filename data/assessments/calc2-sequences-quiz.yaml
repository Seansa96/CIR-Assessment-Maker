questions:
- id: q001
  type: numericResponse
  skills:
  - sequences
  prompt: |
    Find the limit of the sequence $a_n = \frac{5n^3 - 2n}{4n^3 + n^2 - 1}$ as $n \to \infty$.
  answer:
    value: 1.25
    tolerance: 0.01
  explanation: |
    The highest power of $n$ is $n^3$. Dividing numerator and denominator by $n^3$ leaves $5/4 = 1.25$.
- id: q002
  type: multipleChoice
  skills:
  - sequences
  prompt: |
    Does the sequence $a_n = \frac{\cos(n \pi)}{n}$ converge or diverge?
  choices:
  - id: a
    text: Converges to 0
  - id: b
    text: Diverges by oscillation
  - id: c
    text: Diverges to infinity
  - id: d
    text: Converges to 1
  answer:
    choiceId: a
  explanation: |
    $\cos(n\pi)$ simply alternates between $1$ and $-1$. So the sequence is alternating: $1/2, -1/3, 1/4 \dots$
    Since the denominator $n$ grows to infinity, the terms get crushed to 0 (Squeeze Theorem).
- id: q003
  type: multipleChoice
  skills:
  - sequences
  prompt: |
    Consider $a_n = \frac{e^n}{n^2}$. As $n \to \infty$, what happens to $a_n$?
  choices:
  - id: a
    text: |-
      It diverges to $\infty$
  - id: b
    text: It converges to 0
  - id: c
    text: |-
      It converges to $e/2$
  - id: d
    text: It diverges by oscillation
  answer:
    choiceId: a
  explanation: |
    By L'HÃ´pital's rule (applied twice), the exponential function $e^n$ grows much faster than any polynomial $n^2$. Thus, the numerator overpowers the denominator and the sequence diverges to infinity.
- id: q004
  type: numericResponse
  skills:
  - sequences
  prompt: |
    Evaluate the limit of $a_n = \ln(3n + 1) - \ln(n + 5)$ as $n \to \infty$.
    Provide the exact decimal value to 3 places.
  answer:
    value: 1.099
    tolerance: 0.01
  explanation: |
    Use logarithm properties: $\ln(3n+1) - \ln(n+5) = \ln\left(\frac{3n+1}{n+5}\right)$.
    As $n \to \infty$, $\frac{3n+1}{n+5} \to 3$.
    So the sequence converges to $\ln(3) \a\approx 1.0986$.
- id: q005
  type: multipleChoice
  skills:
  - sequences
  prompt: |
    A sequence is defined recursively by $a_1 = 2$, and $a_{n+1} = \frac{1}{3}a_n$.
    What kind of sequence is this?
  choices:
  - id: a
    text: A geometric sequence that converges to 0
  - id: b
    text: An arithmetic sequence that converges to 0
  - id: c
    text: A geometric sequence that diverges
  - id: d
    text: A Fibonacci sequence
  answer:
    choiceId: a
  explanation: |
    Each term is $1/3$ of the previous term. This makes it a geometric sequence. Since $|1/3| < 1$, the terms get smaller and smaller, converging to 0.
- id: q_seq_0
  type: multipleChoice
  prompt: 'Determine the limit of the sequence $a_n = \frac{3n^2 - 1}{4n^2 + n}$ as $n \to \infty$.'
  answer:
    choiceId: b
  explanation: |-
    Divide numerator and denominator by $n^2$ to see the limit is the ratio of leading coefficients.
  choices:
  - id: a
    text: '0'
  - id: b
    text: 3/4
  - id: c
    text: '3'
  - id: d
    text: Does not exist
- id: q_seq_1
  type: multipleChoice
  prompt: 'Does the sequence $b_n = (-1)^n \frac{n}{n+1}$ converge?'
  answer:
    choiceId: d
  explanation: The terms alternate between values near 1 and values near -1. Since it doesn't approach a single value, it diverges.
  choices:
  - id: a
    text: Converges to 1
  - id: b
    text: Converges to -1
  - id: c
    text: Converges to 0
  - id: d
    text: Diverges
- id: q_seq_2
  type: multipleChoice
  prompt: |-
    Find the limit of the sequence $c_n = \sqrt{n^2+n} - n$.
  answer:
    choiceId: b
  explanation: 'Multiply by the conjugate: $\frac{n}{\sqrt{n^2+n} + n}$, which approaches 1/2.'
  choices:
  - id: a
    text: '0'
  - id: b
    text: 1/2
  - id: c
    text: '1'
  - id: d
    text: Infinity
- id: q_seq_3
  type: multipleChoice
  prompt: 'Let $a_n = \frac{\sin(n)}{n}$. What is its limit?'
  answer:
    choiceId: a
  explanation: |-
    Since $-1 \le \sin(n) \le 1$, apply the Squeeze Theorem to see it converges to 0.
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: Does not exist
  - id: d
    text: Infinity
- id: q_seq_4
  type: multipleChoice
  prompt: 'Determine if $a_n = (1 + \frac{2}{n})^n$ converges.'
  answer:
    choiceId: a
  explanation: |-
    This is a standard limit definition related to $e^x$, where $x=2$.
  choices:
  - id: a
    text: |-
      Converges to $e^2$
  - id: b
    text: |-
      Converges to $e$
  - id: c
    text: Converges to 1
  - id: d
    text: Diverges
- id: q_seq_5
  type: multipleChoice
  prompt: 'Find the limit of $x_n = n^{1/n}$ as $n \to \infty$.'
  answer:
    choiceId: b
  explanation: 'Take the natural log: $\ln(x_n) = \frac{\ln(n)}{n}$. By L''Hopital''s rule, this approaches 0, so $x_n \to e^0 = 1$.'
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: e
  - id: d
    text: Infinity
- id: q_seq_6
  type: multipleChoice
  prompt: 'Consider the recursive sequence $a_1 = 1$, $a_{n+1} = \frac{1}{2}(a_n + \frac{2}{a_n})$. What is its limit?'
  answer:
    choiceId: b
  explanation: 'If it converges to L, then $L = \frac{1}{2}(L + 2/L)$, giving $L^2 = 2$.'
  choices:
  - id: a
    text: '1'
  - id: b
    text: |-
      $\sqrt{2}$
  - id: c
    text: '2'
  - id: d
    text: Infinity
- id: q_seq_7
  type: multipleChoice
  prompt: 'Evaluate the limit of $d_n = \frac{\ln(n^2)}{n}$.'
  answer:
    choiceId: a
  explanation: 'This is $\frac{2\ln(n)}{n}$, which goes to 0 by L''Hopital''s Rule.'
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: '2'
  - id: d
    text: Infinity
- id: q_seq_8
  type: multipleChoice
  prompt: 'What is the limit of $a_n = \frac{n!}{n^n}$?'
  answer:
    choiceId: a
  explanation: |-
    For large $n$, $n^n$ grows much faster than $n!$, so the ratio approaches 0.
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: e
  - id: d
    text: Infinity
- id: q_seq_9
  type: multipleChoice
  prompt: 'Determine the limit of $a_n = \arctan(n)$.'
  answer:
    choiceId: c
  explanation: 'As $n \to \infty$, the arctangent function asymptotically approaches $\pi/2$.'
  choices:
  - id: a
    text: '0'
  - id: b
    text: |-
      $\pi/4$
  - id: c
    text: |-
      $\pi/2$
  - id: d
    text: |-
      $\pi$
