- id: q004
  type: numericResponse
  skills:
  - sequences
  prompt: |
    Evaluate the limit of $a_n = \ln(3n + 1) - \ln(n + 5)$ as $n \to \infty$.
    Provide the exact decimal value to 3 places.
  answer:
    value: 1.099
    tolerance: 0.01
  explanation: |-
    Solution: Use logarithm properties: $\ln(3n+1) - \ln(n+5) = \ln\left(\frac{3n+1}{n+5}\right)$.
    As $n \to \infty$, $\frac{3n+1}{n+5} \to 3$.
    So the sequence converges to $\ln(3) \a\approx 1.0986$.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.
- id: q005
  type: multipleChoice
  skills:
  - sequences
  prompt: |
    A sequence is defined recursively by $a_1 = 2$, and $a_{n+1} = \frac{1}{3}a_n$.
    What kind of sequence is this?
  choices:
  - id: a
    text: A geometric sequence that converges to 0
  - id: b
    text: An arithmetic sequence that converges to 0
  - id: c
    text: A geometric sequence that diverges
  - id: d
    text: A Fibonacci sequence
  answer:
    choiceId: a
  explanation: 'Solution: Each term is $1/3$ of the previous term. This makes it a geometric sequence. Since $|1/3| < 1$, the terms get smaller and smaller, converging to 0. Therefore the answer is A geometric sequence that converges to 0.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


    Why the other choices fail: An arithmetic sequence that converges to 0 conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; A geometric sequence that diverges conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; A Fibonacci sequence conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.'
