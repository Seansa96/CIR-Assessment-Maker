- id: q001
  type: numericResponse
  skills:
  - sequences
  prompt: |
    Find the limit of the sequence $a_n = \frac{5n^3 - 2n}{4n^3 + n^2 - 1}$ as $n \to \infty$.
  answer:
    value: 1.25
    tolerance: 0.01
  explanation: 'Solution: The highest power of $n$ is $n^3$. Dividing numerator and denominator by $n^3$ leaves $5/4 = 1.25$.


    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.'
- id: q002
  type: multipleChoice
  skills:
  - sequences
  prompt: |
    Does the sequence $a_n = \frac{\cos(n \pi)}{n}$ converge or diverge?
  choices:
  - id: a
    text: Converges to 0
  - id: b
    text: Diverges by oscillation
  - id: c
    text: Diverges to infinity
  - id: d
    text: Converges to 1
  answer:
    choiceId: a
  explanation: |-
    Solution: $\cos(n\pi)$ simply alternates between $1$ and $-1$. So the sequence is alternating: $1/2, -1/3, 1/4 \dots$
    Since the denominator $n$ grows to infinity, the terms get crushed to 0 (Squeeze Theorem). Therefore the answer is Converges to 0.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

    Why the other choices fail: Diverges by oscillation conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; Diverges to infinity conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; Converges to 1 conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
