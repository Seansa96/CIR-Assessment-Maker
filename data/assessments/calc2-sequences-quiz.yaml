schemaVersion: 1
id: calc2-sequences-quiz
title: Sequences Quiz
assessmentType: quiz
categoryId: calculus-2
subcategoryIds:
- sequences-series
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: numericResponse
  prompt: 'Find the limit of the sequence $a_n = \frac{5n^3 - 2n}{4n^3 + n^2 - 1}$
    as $n \to \infty$.

    '
  answer:
    value: 1.25
    tolerance: 0.01
  explanation: 'The highest power of $n$ is $n^3$. Dividing numerator and denominator
    by $n^3$ leaves $5/4 = 1.25$.

    '
- id: q002
  type: multipleChoice
  prompt: 'Does the sequence $a_n = \frac{\cos(n \pi)}{n}$ converge or diverge?

    '
  choices:
  - id: a
    text: Converges to 0
  - id: b
    text: Diverges by oscillation
  - id: c
    text: Diverges to infinity
  - id: d
    text: Converges to 1
  answer:
    choiceId: a
  explanation: '$\cos(n\pi)$ simply alternates between $1$ and $-1$. So the sequence
    is alternating: $1/2, -1/3, 1/4 \dots$

    Since the denominator $n$ grows to infinity, the terms get crushed to 0 (Squeeze
    Theorem).

    '
- id: q003
  type: multipleChoice
  prompt: 'Consider $a_n = \frac{e^n}{n^2}$. As $n \to \infty$, what happens to $a_n$?

    '
  choices:
  - id: a
    text: It diverges to $\infty$
  - id: b
    text: It converges to 0
  - id: c
    text: It converges to $e/2$
  - id: d
    text: It diverges by oscillation
  answer:
    choiceId: a
  explanation: 'By L''Hôpital''s rule (applied twice), the exponential function $e^n$
    grows much faster than any polynomial $n^2$. Thus, the numerator overpowers the
    denominator and the sequence diverges to infinity.

    '
- id: q004
  type: numericResponse
  prompt: 'Evaluate the limit of $a_n = \ln(3n + 1) - \ln(n + 5)$ as $n \to \infty$.

    Provide the exact decimal value to 3 places.

    '
  answer:
    value: 1.099
    tolerance: 0.01
  explanation: 'Use logarithm properties: $\ln(3n+1) - \ln(n+5) = \ln\left(\frac{3n+1}{n+5}\right)$.

    As $n \to \infty$, $\frac{3n+1}{n+5} \to 3$.

    So the sequence converges to $\ln(3) \a\approx 1.0986$.

    '
- id: q005
  type: multipleChoice
  prompt: 'A sequence is defined recursively by $a_1 = 2$, and $a_{n+1} = \frac{1}{3}a_n$.

    What kind of sequence is this?

    '
  choices:
  - id: a
    text: A geometric sequence that converges to 0
  - id: b
    text: An arithmetic sequence that converges to 0
  - id: c
    text: A geometric sequence that diverges
  - id: d
    text: A Fibonacci sequence
  answer:
    choiceId: a
  explanation: 'Each term is $1/3$ of the previous term. This makes it a geometric
    sequence. Since $|1/3| < 1$, the terms get smaller and smaller, converging to
    0.

    '
