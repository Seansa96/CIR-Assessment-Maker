questions:
- id: easy-q001
  type: numericResponse
  prompt: Net torque 10 N m acts on a wheel with moment of inertia 2.0 kg m^2. Find angular acceleration in rad/s^2.
  answer: { value: 5, tolerance: 0.1 }
  explanation: |
    Solution: $alpha=tau/I=10/2.0=5.0$ rad/s^2.

    Why it works: Net torque is the rotational analog of net force, producing angular acceleration according to inertia.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: easy-q002
  type: numericResponse
  prompt: A wheel has moment of inertia 4.0 kg m^2 and angular acceleration 3.0 rad/s^2. Find net torque in N m.
  answer: { value: 12, tolerance: 0.1 }
  explanation: |
    Solution: $tau=I alpha=(4.0)(3.0)=12$ N m.

    Why it works: Rearranging rotational Newton's second law isolates net torque.
  difficultyDimensions: [reverseReasoning, modelOrDerivation]
- id: easy-q003
  type: multipleChoice
  prompt: Two objects have equal net torque. Which has the greater angular acceleration?
  choices: [{ id: a, text: the one with smaller moment of inertia }, { id: b, text: the one with larger moment of inertia }, { id: c, text: both always have zero acceleration }]
  answer: { choiceId: a }
  explanation: |
    Solution: The object with smaller moment of inertia has greater angular acceleration.

    Why it works: $alpha=tau/I$, so inertia resists angular acceleration.

    Why the other choices fail: Larger inertia reduces acceleration, and nonzero net torque need not give zero acceleration.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: easy-q004
  type: numericResponse
  prompt: 'Two torques act on a disk: 14 N m counterclockwise and 5 N m clockwise. The disk has I=3.0 kg m^2. Find angular acceleration in rad/s^2, taking counterclockwise positive.'
  answer: { value: 3, tolerance: 0.1 }
  explanation: |
    Solution: Net torque is $14-5=9$ N m, so $alpha=9/3.0=3.0$ rad/s^2.

    Why it works: Signed torques sum before rotational Newton's second law is applied.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: easy-q005
  type: symbolicResponse
  prompt: A tangential force F acts at radius R on a solid disk of mass M and radius R. Derive its angular acceleration.
  answer: { expectedLatex: '2F/(M R)', equivalenceMode: expression, variables: [F, M, R], tolerance: 0.001 }
  explanation: |
    Solution: $tau=FR$ and $I=0.5MR^2$, so $alpha=tau/I=2F/(MR)$.

    Why it works: Tangential force supplies torque, while the disk's mass distribution supplies inertia.
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
- id: easy-q006
  type: multipleChoice
  prompt: If the line of action of a force passes through a wheel's axis, what angular acceleration does that force produce about the axis by itself?
  choices: [{ id: a, text: zero }, { id: b, text: maximum }, { id: c, text: infinite }]
  answer: { choiceId: a }
  explanation: |
    Solution: It produces zero angular acceleration about that axis.

    Why it works: The force has zero lever arm and therefore zero torque.

    Why the other choices fail: No torque is available to produce rotational acceleration.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: easy-q007
  type: numericResponse
  prompt: A 0.50 kg point mass is fixed 0.40 m from a light axle. A tangential 6.0 N force acts on it. Find angular acceleration in rad/s^2.
  answer: { value: 30, tolerance: 0.3 }
  explanation: |
    Solution: $tau=FR=2.4$ N m and $I=mR^2=0.080$ kg m^2, so $alpha=2.4/0.080=30$ rad/s^2.

    Why it works: The force torque and the point mass's moment of inertia are both measured about the axle.
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
- id: easy-q008
  type: numericResponse
  prompt: A disk with I=2.0 kg m^2 has constant net torque 8.0 N m for 3.0 s and starts from rest. Find final angular velocity in rad/s.
  answer: { value: 12, tolerance: 0.2 }
  explanation: |
    Solution: $alpha=8.0/2.0=4.0$ rad/s^2, then $omega=alpha t=4.0(3.0)=12$ rad/s.

    Why it works: Rotational dynamics finds angular acceleration, and constant-acceleration kinematics finds the resulting angular velocity.
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
