questions:
- id: q1
  type: numericResponse
  prompt: A net torque of $20 \text{ N}\cdot\text{m}$ acts on a wheel with $I = 5.0
    \text{ kg}\cdot\text{m}^2$. What is its angular acceleration?
  answer:
    value: 4.0
    tolerance: 0.5
  explanation: $\alpha = \tau / I = 20 / 5.0 = 4.0 \text{ rad/s}^2$.
