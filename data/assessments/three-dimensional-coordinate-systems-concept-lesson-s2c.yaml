  - id: s03
    title: Equations describe sets
    required: true
    content: A fixed coordinate such as $z=c$ describes a plane parallel to the $xy$-plane; sphere equations encode a center and radius. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
