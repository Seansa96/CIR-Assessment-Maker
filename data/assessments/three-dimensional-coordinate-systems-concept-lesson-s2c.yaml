lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 1 → Inequalities and the Real Numbers if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Coordinates locate a point
    required: true
    content: 'A point $(x,y,z)$ is located by three signed coordinate displacements. Keep the coordinate order fixed. In Three-Dimensional Coordinate Systems, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
    media:
    - type: image
      src: /media/calculus-3/3d-coordinates.svg
      alt: Original three-dimensional coordinate systems reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What is the midpoint of $(1,2,3)$ and $(3,4,5)$?
      choices:
      - id: a
        text: (2,3,4)
        media: []
        issueSignals: []
      - id: b
        text: xy-plane (answers 'What plane has equation $z=0$?', not 'What is the midpoint of $(1,2,3)$ and $(3,4,5)$?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: c
        text: 4 (answers 'What is the radius of $(x-1)^2+(y+2)^2+(z-3)^2=16$?', not 'What is the midpoint of $(1,2,3)$ and $(3,4,5)$?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: d
        text: z (answers 'Which coordinate measures distance from the $xy$-plane?', not 'What is the midpoint of $(1,2,3)$ and $(3,4,5)$?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      answer:
