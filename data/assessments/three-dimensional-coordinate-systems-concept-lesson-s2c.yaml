      explanation: >-
        Solution: The correct response is (2,3,4).

        Why it works: A point $(x,y,z)$ is located by three signed coordinate displacements. Keep the coordinate order fixed.

        Why the other choices fail: Choice b gives a response to the related question 'What plane has equation $z=0$?', rather than to 'What is the midpoint of $(1,2,3)$ and $(3,4,5)$?'.

        Choice c gives a response to the related question 'What is the radius of $(x-1)^2+(y+2)^2+(z-3)^2=16$?', rather than to 'What is the midpoint of $(1,2,3)$ and $(3,4,5)$?'.

        Choice d gives a response to the related question 'Which coordinate measures distance from the $xy$-plane?', rather than to 'What is the midpoint of $(1,2,3)$ and $(3,4,5)$?'.
