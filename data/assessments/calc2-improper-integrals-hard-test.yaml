- id: q-imp-ht-1
  title: Integration by Parts with Infinity
  prompt: |-
    Evaluate the improper integral $\int_{1}^{\infty} x e^{-x} \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: $2/e$
  - id: c2
    text: $1/e$
  - id: c3
    text: Diverges
  - id: c4
    text: $0$
  answer:
    choiceId: c1
  explanation: |-
    Use Integration by Parts. Let $u = x, dv = e^{-x} \, dx$. Then $du = dx, v = -e^{-x}$.
    $\int x e^{-x} \, dx = -x e^{-x} - \int -e^{-x} \, dx = -x e^{-x} - e^{-x}$.
    Evaluate from $1$ to $t$: $[-t e^{-t} - e^{-t}] - [-(1)e^{-1} - e^{-1}]$.
    $[-t e^{-t} - e^{-t}] - [-2/e]$.
    As $t \to \infty$, $e^{-t} \to 0$. By L'Hopital's rule, $t e^{-t} = \frac{t}{e^t} \to 0$.
    Result: $0 - 0 - (-2/e) = 2/e$.
  skills:
  - calc2-improper-integrals

- id: q-imp-ht-2
  title: Doubly Infinite with Trig
  prompt: |-
    Does $\int_{-\infty}^{\infty} \frac{1}{1+x^2} \, dx$ converge? If so, to what value?
  type: multipleChoice
  choices:
  - id: c1
    text: Converges to $\pi$
  - id: c2
    text: Converges to $\pi/2$
  - id: c3
    text: Diverges
  answer:
    choiceId: c1
  explanation: |-
    Split at $0$. Antiderivative is $\arctan(x)$.
    $\int_{0}^{\infty} = \lim_{t \to \infty} [\arctan(t) - \arctan(0)] = \pi/2 - 0 = \pi/2$.
    $\int_{-\infty}^{0} = \lim_{t \to -\infty} [\arctan(0) - \arctan(t)] = 0 - (-\pi/2) = \pi/2$.
    Total: $\pi/2 + \pi/2 = \pi$.
  skills:
  - calc2-improper-integrals

- id: q-imp-ht-3
  title: Hidden Discontinuity
  prompt: |-
    Evaluate $\int_{0}^{3} \frac{1}{x-1} \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: Diverges
  - id: c2
    text: $\ln(2)$
  - id: c3
    text: $\ln(2) - \ln(-1)$
  answer:
    choiceId: c1
  explanation: |-
    The function has an infinite discontinuity at $x=1$, which is inside the interval $[0, 3]$.
    Split at $x=1$: $\int_{0}^{1} + \int_{1}^{3}$.
    The right half is $\lim_{t \to 1^+} \int_{t}^{3} \frac{1}{x-1} \, dx = \lim_{t \to 1^+} [\ln|3-1| - \ln|t-1|]$.
    As $t \to 1^+$, $\ln|t-1| \to -\infty$. So the right half diverges.
    Since one half diverges, the entire integral diverges. (You cannot just blindly plug in bounds, or you'd get $\ln|2| - \ln|-1| = \ln(2)$, which is incorrect!).
  skills:
  - calc2-improper-integrals

- id: q-imp-ht-4
  title: Limit Comparison Test
  prompt: |-
    Use the Limit Comparison Test to determine the convergence of $\int_{1}^{\infty} \frac{1}{x + e^x} \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: Converges (Compare to $\frac{1}{e^x}$)
  - id: c2
    text: Diverges (Compare to $\frac{1}{x}$)
  answer:
    choiceId: c1
  explanation: |-
    For large $x$, $e^x$ dominates $x$, so the function behaves like $\frac{1}{e^x} = e^{-x}$.
    $\int_{1}^{\infty} e^{-x} \, dx$ converges.
    By the Limit Comparison Test (or Direct Comparison Test, since $\frac{1}{x+e^x} < \frac{1}{e^x}$), the integral converges.
  skills:
  - calc2-improper-integrals

- id: q-imp-ht-5
  title: P-Test for Discontinuities
  prompt: |-
    For what values of $p$ does the Type 2 improper integral $\int_{0}^{1} \frac{1}{x^p} \, dx$ converge?
  type: multipleChoice
  choices:
  - id: c1
    text: $p < 1$
  - id: c2
    text: $p > 1$
  - id: c3
    text: $p \ge 1$
  answer:
    choiceId: c1
  explanation: |-
    This is the "reverse" of the infinite bound p-test!
    Evaluate $\int_{0}^{1} x^{-p} \, dx$.
    If $p \neq 1$, antiderivative is $\frac{x^{-p+1}}{-p+1}$.
    Evaluate at $1$: $\frac{1}{1-p}$.
    Evaluate at $t \to 0^+$: $\frac{t^{1-p}}{1-p}$.
    For this to not be infinite, the exponent $(1-p)$ must be positive.
    So $1-p > 0 \implies 1 > p$.
    Thus, it converges only for $p < 1$. (For example, $1/\sqrt{x}$ converges, but $1/x^2$ diverges at $x=0$).
  skills:
  - calc2-improper-integrals
