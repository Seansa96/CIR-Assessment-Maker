authoring: { visualRequirement: notApplicable, visualRationale: Every item requires the learner to construct the relevant local model or limit argument from symbolic data., difficultyTier: hard }
questions:
- { id: q001, type: freeResponse, prompt: 'For real p, classify $\int_1^\infty x^p/(1+x^3)dx$.', answer: { gradingMode: selfCheck, checkModel: 'Converges iff p<2.' }, explanation: 'The integrand has tail behavior x to the p minus three. Requiring that exponent below negative one gives p<2, with p=2 the harmonic boundary.', difficultyDimensions: [simplification, parameterThreshold, representationTransfer], difficultyEvidence: asymptotic simplification plus threshold inequality and boundary check, prerequisiteObjectiveIds: [calc2-limit-comparison] }
- { id: q002, type: freeResponse, prompt: 'For real p, classify $\int_0^1 x^p/(1+x)dx$.', answer: { gradingMode: selfCheck, checkModel: 'Converges iff p>-1.' }, explanation: 'Near zero the denominator tends to one, so the integrand behaves like x to p. The endpoint integral of x to p is finite precisely for p greater than negative one.', difficultyDimensions: [simplification, parameterThreshold, domainCondition], difficultyEvidence: local endpoint model with translated p threshold, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q003, type: freeResponse, prompt: 'Classify $\int_2^\infty1/[x(\ln x)^p]dx$ for all p.', answer: { gradingMode: selfCheck, checkModel: 'Convergent iff p>1.' }, explanation: 'The substitution u equals ln x converts the problem to the ordinary u to the negative p tail. The transformed p-test supplies the exact threshold.', difficultyDimensions: [auxiliaryTechnique, parameterThreshold, representationTransfer], difficultyEvidence: substitution, transformed p-test, and parameter partition, prerequisiteObjectiveIds: [calc2-u-substitution, calc2-improper-classify-by-comparison] }
- { id: q004, type: freeResponse, prompt: 'Classify $\int_0^{1/2}1/[x(\ln x)^2]dx$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent.' }, explanation: 'Let u equal negative ln x. The lower endpoint becomes u to infinity and the integral is a u to the negative two tail, which is finite.', difficultyDimensions: [auxiliaryTechnique, representationTransfer, domainCondition], difficultyEvidence: reverses endpoint orientation under a logarithmic substitution, prerequisiteObjectiveIds: [calc2-u-substitution] }
- { id: q005, type: freeResponse, prompt: 'Prove $\int_1^\infty\sin x/x^2dx$ converges absolutely.', answer: { gradingMode: selfCheck, checkModel: 'Use $|\sin x|/x^2\le1/x^2$.' }, explanation: 'After absolute values, the bounded oscillatory factor is no larger than one. Direct comparison with the finite p equals two tail proves absolute convergence.', difficultyDimensions: [representationTransfer, proofJustification, auxiliaryTechnique], difficultyEvidence: absolute-value transformation and comparison proof, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q006, type: freeResponse, prompt: 'Explain why $\int_{-1}^11/x dx$ diverges ordinarily despite principal value zero.', answer: { gradingMode: selfCheck, checkModel: 'The two one-sided limits diverge separately.' }, explanation: 'Splitting at zero produces logarithmic limits of opposite infinite sign. Ordinary improper convergence requires both finite, while principal-value cancellation imposes a different coupled cutoff.', difficultyDimensions: [casePartition, errorDiagnosis, proofJustification], difficultyEvidence: split-limit definition and comparison with another limiting process, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q007, type: freeResponse, prompt: 'Classify $\int_0^1x^p/(1-x)^{1/2}dx$ for real p.', answer: { gradingMode: selfCheck, checkModel: 'Convergent iff p>-1.' }, explanation: 'The singularity at one is already integrable because its exponent is one-half. Near zero, x to p supplies the only restriction p greater than negative one.', difficultyDimensions: [casePartition, parameterThreshold, representationTransfer], difficultyEvidence: analyzes two endpoints and selects restrictive local threshold, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q008, type: freeResponse, prompt: 'Classify $\int_0^1dx/[x^p(1-x)^q]$ for real p and q.', answer: { gradingMode: selfCheck, checkModel: 'Convergent iff p<1 and q<1.' }, explanation: 'Split at an interior point. Near zero use x to negative p, and near one use (1-x) to negative q; both endpoint limits must be finite.', difficultyDimensions: [casePartition, parameterThreshold, modelOrDerivation], difficultyEvidence: constructs two local models and combines their independent conditions, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q009, type: freeResponse, prompt: 'Use limit comparison on $\int_1^\infty(7x^4+x)/(2x^6-1)dx$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent; it is asymptotic to 7/(2x^2).' }, explanation: 'The leading-degree difference is two. Multiplying by x squared leaves a limit 7/2, so it shares the finite p equals two tail behavior.', difficultyDimensions: [simplification, representationTransfer, proofJustification], difficultyEvidence: leading-term model and finite positive ratio proof, prerequisiteObjectiveIds: [calc2-limit-comparison] }
- { id: q010, type: freeResponse, prompt: 'Evaluate $\int_0^\infty xe^{-x}dx$.', answer: { gradingMode: selfCheck, checkModel: '$1$.' }, explanation: 'The tail is the only improper boundary. Integration by parts gives a boundary expression whose exponential factors vanish at infinity and yield one at zero.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: tail setup plus integration by parts and exponential limit, prerequisiteObjectiveIds: [calc2-integration-by-parts] }
- { id: q011, type: freeResponse, prompt: 'Classify $\int_1^\infty \arctan(x)/x^pdx$ for real p.', answer: { gradingMode: selfCheck, checkModel: 'Convergent iff p>1.' }, explanation: 'Arctan x tends to pi over two, a positive finite constant. Limit comparison with x to negative p reduces the integral to the standard tail p-test.', difficultyDimensions: [representationTransfer, parameterThreshold, proofJustification], difficultyEvidence: nonzero limiting factor and threshold transfer, prerequisiteObjectiveIds: [calc2-limit-comparison] }
- { id: q012, type: freeResponse, prompt: 'Construct a positive f smaller than 1/x eventually whose tail integral diverges.', answer: { gradingMode: selfCheck, checkModel: 'f(x)=1/[x\ln x] for x at least 2.' }, explanation: 'This function is eventually below 1/x, but the substitution u equals ln x produces the divergent 1/u tail. It disproves a reversed comparison inference.', difficultyDimensions: [counterexampleOrConstruction, reverseReasoning, errorDiagnosis], difficultyEvidence: designs a counterexample from a failed comparison claim, extensionObjectiveIds: [calc2-logarithmic-integrals] }
- { id: q013, type: freeResponse, prompt: 'Classify $\int_0^1\ln(1/x)/\sqrt{x}dx$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent, with value 4.' }, explanation: 'Set x equal to u squared. The integral becomes negative four integral of u ln u from zero to one, which is finite and evaluates to four.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, domainCondition], difficultyEvidence: cancellation substitution and endpoint-limit evaluation, prerequisiteObjectiveIds: [calc2-u-substitution] }
- { id: q014, type: freeResponse, prompt: 'Prove $\int_1^\infty(1-\cos x)/x^2dx$ converges.', answer: { gradingMode: selfCheck, checkModel: 'Use 0 less than or equal to 1-cos x less than or equal to 2.' }, explanation: 'The integrand is nonnegative and bounded above by 2/x squared. Direct comparison gives convergence without requiring an antiderivative.', difficultyDimensions: [representationTransfer, proofJustification, estimationOrBounds], difficultyEvidence: bounded numerator estimate plus comparison proof, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q015, type: freeResponse, prompt: 'Classify $\int_0^\infty dx/(1+x^p)$ for real p.', answer: { gradingMode: selfCheck, checkModel: 'Convergent iff p>1.' }, explanation: 'There is no zero-endpoint problem because the denominator tends to one. At infinity the integrand behaves like x to negative p, giving the p greater than one condition.', difficultyDimensions: [casePartition, parameterThreshold, simplification], difficultyEvidence: separately checks finite and infinite endpoints, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q016, type: freeResponse, prompt: 'Classify $\int_0^\infty dx/[\sqrt{x}(1+x)]$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent.' }, explanation: 'Near zero it behaves like x to negative one-half, and at infinity like x to negative three-halves. Both local p-test conditions are satisfied.', difficultyDimensions: [casePartition, representationTransfer, proofJustification], difficultyEvidence: builds two distinct local comparisons, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q017, type: freeResponse, prompt: 'Evaluate $\int_0^\infty1/(1+x^2)dx$.', answer: { gradingMode: selfCheck, checkModel: '$\pi/2$.' }, explanation: 'Only the upper endpoint is improper. The antiderivative arctan x tends to pi over two, while its value at zero is zero.', difficultyDimensions: [modelOrDerivation, domainCondition, auxiliaryTechnique], difficultyEvidence: tail cutoff with inverse-trigonometric limit, prerequisiteObjectiveIds: [calc2-improper-identify-and-limit] }
- { id: q018, type: freeResponse, prompt: 'Show $\int_0^1dx/[x\sqrt{1-x}]$ diverges.', answer: { gradingMode: selfCheck, checkModel: 'Near zero it is at least 1/x.' }, explanation: 'On the interval from zero to one-half, square root of one minus x is at most one, so the integrand dominates 1/x. The zero-endpoint harmonic form diverges.', difficultyDimensions: [casePartition, proofJustification, errorDiagnosis], difficultyEvidence: local lower comparison overrides an integrable second endpoint, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q019, type: freeResponse, prompt: 'For which p does $\int_1^\infty (\ln x)^p/x^2dx$ converge?', answer: { gradingMode: selfCheck, checkModel: 'For every real p.' }, explanation: 'With u equal to ln x, dx/x squared becomes e to negative u du. Any finite power of u times exponential decay is integrable on the resulting tail.', difficultyDimensions: [auxiliaryTechnique, representationTransfer, globalLocalReasoning], difficultyEvidence: logarithmic substitution exposes exponential domination, extensionObjectiveIds: [calc2-exponential-decay] }
- { id: q020, type: freeResponse, prompt: 'Explain why convergence of $\int_0^1 f$ and $\int_1^\infty f$ is sufficient for convergence of $\int_0^\infty f$.', answer: { gradingMode: selfCheck, checkModel: 'The defining tail integral is the sum of two finite pieces after splitting at 1.' }, explanation: 'The finite split point produces independent definitions. Add the finite proper or improper left piece to the finite right-tail limit to obtain the full improper integral.', difficultyDimensions: [modelOrDerivation, proofJustification, representationTransfer], difficultyEvidence: constructs a split representation and proves closure under finite sums, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
