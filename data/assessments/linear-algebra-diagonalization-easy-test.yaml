schemaVersion: 1
id: linear-algebra-diagonalization-easy-test
title: Diagonalization Standard Test
assessmentType: test
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-diagonalization
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 5
skills:
  - diagonalization
  - eigen-decomposition
  - matrix-powers
questions:
  - id: et-diag-equation
    type: multipleChoice
    prompt: |
      Which of the following equations correctly defines the diagonalization of a matrix $A$?
    choices:
      - id: c1
        text: '$A = D P D^{-1}$'
      - id: c2
        text: '$A = P D P^{-1}$'
      - id: c3
        text: '$A = P^{-1} D P$'
      - id: c4
        text: '$D = P A P^{-1}$'
    answer:
      choiceId: c2
    explanation: |
      The standard diagonalization factorization is $A = PDP^{-1}$, where $D$ is a diagonal matrix and $P$ is an invertible matrix. (Note: Option D is mathematically equivalent but usually we refer to the decomposition of $A$).

  - id: et-p-matrix-contents
    type: multipleChoice
    prompt: |
      In the diagonalization $A = PDP^{-1}$, what must the columns of the matrix $P$ be?
    choices:
      - id: c1
        text: 'The eigenvalues of $A$.'
      - id: c2
        text: 'The eigenvectors of $A$.'
      - id: c3
        text: 'The columns of $A$.'
      - id: c4
        text: 'The pivot columns of $D$.'
    answer:
      choiceId: c2
    explanation: |
      The columns of $P$ are exactly the eigenvectors of $A$. They must be ordered to match the corresponding eigenvalues in $D$.

  - id: et-d-matrix-contents
    type: multipleChoice
    prompt: |
      In the diagonalization $A = PDP^{-1}$, what does the main diagonal of the matrix $D$ contain?
    choices:
      - id: c1
        text: 'The eigenvalues of $A$.'
      - id: c2
        text: 'The eigenvectors of $A$.'
      - id: c3
        text: '1s (it is the identity matrix).'
      - id: c4
        text: 'The determinant of $A$.'
    answer:
      choiceId: c1
    explanation: |
      The matrix $D$ is a diagonal matrix whose main diagonal entries are the eigenvalues of $A$.

  - id: et-p-invertibility
    type: multipleChoice
    prompt: |
      For the factorization $A = PDP^{-1}$ to be valid, the matrix $P$ must be invertible. What does this require of the eigenvectors of $A$?
    choices:
      - id: c1
        text: 'They must all be mutually orthogonal.'
      - id: c2
        text: 'They must all be the same vector.'
      - id: c3
        text: 'They must be linearly independent.'
      - id: c4
        text: 'They must all be unit vectors (length 1).'
    answer:
      choiceId: c3
    explanation: |
      A square matrix is invertible if and only if its columns are linearly independent. Since the columns of $P$ are the eigenvectors, those eigenvectors must form a linearly independent set.

  - id: et-distinct-shortcut
    type: multipleChoice
    prompt: |
      If an $n \times n$ matrix $A$ has $n$ distinct eigenvalues, what can be guaranteed?
    choices:
      - id: c1
        text: '$A$ is diagonalizable.'
      - id: c2
        text: '$A$ is invertible.'
      - id: c3
        text: '$A$ is the identity matrix.'
      - id: c4
        text: '$A$ cannot be diagonalized.'
    answer:
      choiceId: c1
    explanation: |
      Eigenvectors corresponding to distinct eigenvalues are always linearly independent. If there are $n$ distinct eigenvalues, there will be $n$ linearly independent eigenvectors, making $P$ invertible and guaranteeing that $A$ is diagonalizable.
