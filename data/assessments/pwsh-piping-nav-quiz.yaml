schemaVersion: 1
id: pwsh-piping-nav-quiz
title: "Piping and Advanced Navigation Quiz"
assessmentType: quiz
categoryId: scripting
subcategoryIds:
  - pwsh-object-pipeline
  - pwsh-symbolic-links
  - pwsh-aliases-keybinds
skills:
- Apply scripting concepts
- Apply The Object Pipeline and Filtering
- Apply Symbolic Links and Junctions
- Apply Aliases and Keybinds
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - scripting
  - pwsh-object-pipeline
  - pwsh-symbolic-links
  - pwsh-aliases-keybinds
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 8
questions:
  - id: q001
    type: multipleChoice
    skills:
      - pwsh-object-pipeline
    prompt: |
      What makes the PowerShell pipeline fundamentally different from Bash?
    choices:
      - id: a
        text: It uses the `>` character instead of `|`.
      - id: b
        text: It passes rich Objects with properties, rather than plain text strings.
      - id: c
        text: It cannot be used to filter data.
      - id: d
        text: It is slower and less memory efficient.
    answer:
      choiceId: b
    explanation: |
      PowerShell is object-oriented. Passing objects eliminates the need to use regex or string parsing to extract data.

  - id: q002
    type: multipleChoice
    skills:
      - pwsh-object-pipeline
    prompt: |
      Which cmdlet allows you to choose specific properties (columns) to pass down the pipeline?
    choices:
      - id: a
        text: '`Where-Object`'
      - id: b
        text: '`Choose-Object`'
      - id: c
        text: '`Select-Object`'
      - id: d
        text: '`Filter-Object`'
    answer:
      choiceId: c
    explanation: |
      `Select-Object` trims objects down to only the properties you request, or limits the number of objects returned.

  - id: q003
    type: multipleChoice
    skills:
      - pwsh-object-pipeline
    prompt: |
      If you want to save pipeline output into a structured comma-separated file, which cmdlet do you pipe into?
    choices:
      - id: a
        text: '`Export-Csv`'
      - id: b
        text: '`Out-File`'
      - id: c
        text: '`Write-Csv`'
      - id: d
        text: '`Format-Table`'
    answer:
      choiceId: a
    explanation: |
      `Export-Csv` natively understands objects and creates a perfect CSV file using their properties as columns.

  - id: q004
    type: multipleChoice
    skills:
      - pwsh-symbolic-links
    prompt: |
      How does a Symbolic Link differ from a `.lnk` shortcut?
    choices:
      - id: a
        text: A symlink can only link to files on the same drive.
      - id: b
        text: A symlink is resolved at the filesystem level, so all applications and terminals treat it as the actual target.
      - id: c
        text: A symlink requires a specialized viewer to open.
      - id: d
        text: There is no difference.
    answer:
      choiceId: b
    explanation: |
      Symlinks are invisible to applications; the OS silently redirects the read/write operations to the real target.

  - id: q005
    type: multipleChoice
    skills:
      - pwsh-symbolic-links
    prompt: |
      Which PowerShell cmdlet is used to create a new symbolic link?
    choices:
      - id: a
        text: '`New-Link`'
      - id: b
        text: '`Create-Symlink`'
      - id: c
        text: '`New-Item`'
      - id: d
        text: '`Set-Alias`'
    answer:
      choiceId: c
    explanation: |
      `New-Item` with `-ItemType SymbolicLink` is the correct method.

  - id: q006
    type: multipleChoice
    skills:
      - pwsh-aliases-keybinds
    prompt: |
      If you create an alias using `Set-Alias`, how long does it last?
    choices:
      - id: a
        text: Forever, it is permanently written to the registry.
      - id: b
        text: Only until you close the current PowerShell terminal session.
      - id: c
        text: Until you reboot the computer.
      - id: d
        text: For exactly 24 hours.
    answer:
      choiceId: b
    explanation: |
      Aliases created manually are session-bound. To make them permanent, they must be added to your `$PROFILE`.

  - id: q007
    type: multipleChoice
    skills:
      - pwsh-aliases-keybinds
    prompt: |
      What does the automatic variable `$PROFILE` contain?
    choices:
      - id: a
        text: The path to the script that runs automatically whenever PowerShell starts.
      - id: b
        text: Your Active Directory username.
      - id: c
        text: The configuration for your network adapter.
      - id: d
        text: A list of all available aliases.
    answer:
      choiceId: a
    explanation: |
      `$PROFILE` points to your personal startup script where you define permanent aliases and configurations.

  - id: q008
    type: multipleChoice
    skills:
      - pwsh-aliases-keybinds
    prompt: |
      Which module is responsible for providing syntax highlighting and custom keybindings in modern PowerShell?
    choices:
      - id: a
        text: '`PSReadLine`'
      - id: b
        text: '`PSTerminal`'
      - id: c
        text: '`PowerShell-UI`'
      - id: d
        text: '`PSProfile`'
    answer:
      choiceId: a
    explanation: |
      `PSReadLine` is the standard module for enhancing the console experience.
