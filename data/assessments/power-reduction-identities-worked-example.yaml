workedExamples:
- id: we001
  title: Recognizing when and\rhow to reduce trigonometric powers
  problem: 'Learn when to replace powers like $\sin^2 x$ and $\cos^2 x$ with identities
    involving $\cos(2x)$.

    '
  steps:
  - id: step-we001-1
    title: Recognize the trigger
    instruction: Power reduction is useful when a squared trig function is hard to
      integrate, average, or compare directly.
    type: selectAll
    prompt: Which expressions are natural candidates for power reduction?
    choices:
    - id: a
      text: $\sin^2 x$
    - id: b
      text: $\cos^2 x$
    - id: c
      text: $\sin^4 x$
    - id: d
      text: $\sin x+\cos x$
    answer:
      choiceIds:
      - a
      - b
      - c
    hint: Look for even powers of sine or cosine.
    explanation: |
      Power reduction targets even powers, especially $\sin^2 x$ and $\cos^2 x$. Higher even powers such as $\sin^4 x$ can often be reduced by applying the identities more than once.

      Related topic: power reduction identities. Action step: scan for even powers before expanding or guessing.
  - id: step-we001-2
    title: Connect to double angle
    instruction: Power reduction identities come from rearranging double-angle identities.
    type: multipleChoice
    prompt: |
      Which double-angle identity gives $\sin^2 x=\frac{1-\cos(2x)}{2}$ after rearranging?
    choices:
    - id: a
      text: $\cos(2x)=1-2\sin^2 x$
    - id: b
      text: $\sin(2x)=2\sin x\cos x$
    - id: c
      text: $\cos(2x)=\cos^2 x-\sin^2 x$
    - id: d
      text: $\tan(2x)=\frac{2\tan x}{1-\tan^2 x}$
    answer:
      choiceId: a
    hint: Solve the identity for $\sin^2 x$.
    explanation: |
      From $\cos(2x)=1-2\sin^2 x$, move terms and divide by 2:

      $\sin^2 x=\frac{1-\cos(2x)}{2}$.

      Related topic: double-angle to power-reduction conversion. Lookup: "derive power reduction identities."
  - id: step-we001-3
    title: Choose the sine identity
    instruction: Use the identity that matches the squared function you actually see.
    type: multipleChoice
    prompt: |
      What should replace $\sin^2 x$?
    choices:
    - id: a
      text: $\frac{1-\cos(2x)}{2}$
    - id: b
      text: $\frac{1+\cos(2x)}{2}$
    - id: c
      text: $2\sin x\cos x$
    - id: d
      text: $1+\tan^2 x$
    answer:
      choiceId: a
    hint: Sine squared pairs with the minus sign.
    explanation: |
      $\sin^2 x=\frac{1-\cos(2x)}{2}$.

      Related topic: sine power reduction. Action step: memorize the sign pattern by checking $x=0$: $\sin^2(0)=0$, so the numerator must become $1-1=0$.
  - id: step-we001-4
    title: Choose the cosine identity
    instruction: Cosine squared has the companion identity with the plus sign.
    type: multipleChoice
    prompt: |
      What should replace $\cos^2 x$?
    choices:
    - id: a
      text: $\frac{1+\cos(2x)}{2}$
    - id: b
      text: $\frac{1-\cos(2x)}{2}$
    - id: c
      text: $2\sin x\cos x$
    - id: d
      text: $\sin^2 x-1$
    answer:
      choiceId: a
    hint: Cosine squared equals 1 when x is 0.
    explanation: |
      $\cos^2 x=\frac{1+\cos(2x)}{2}$.

      Related topic: cosine power reduction. Action step: test the identity at $x=0$ to remember the sign.
  - id: step-we001-5
    title: Apply it to an integral
    instruction: Power reduction turns a squared trig integral into a constant term
      plus a simple cosine integral.
    type: multipleChoice
    prompt: |
      What is the best first rewrite for $\int \sin^2 x\,dx$?
    choices:
    - id: a
      text: $\int \frac{1-\cos(2x)}{2}\,dx$
    - id: b
      text: $\int 2\sin x\cos x\,dx$
    - id: c
      text: $\int \frac{1+\cos(2x)}{2}\,dx$
    - id: d
      text: $\int \tan^2 x\,dx$
    answer:
      choiceId: a
    hint: Replace exactly the squared sine term.
    explanation: |
      The rewrite is $\int \frac{1-\cos(2x)}{2}\,dx$, which separates into a linear term and a sine term after integration.

      Related topic: integrating even powers of trig functions. Lookup: "integral of sin squared using power reduction."
  - id: step-we001-6
    title: Reduce a fourth power
    instruction: Higher even powers are usually handled by first turning them into
      squared expressions.
    type: multipleChoice
    prompt: |
      What is a good first step for rewriting $\sin^4 x$?
    choices:
    - id: a
      text: Rewrite it as $(\sin^2 x)^2$, then substitute the power reduction identity
        for $\sin^2 x$
    - id: b
      text: Replace it with $\sin(4x)$
    - id: c
      text: Cancel one sine factor
    - id: d
      text: Treat it as $\cos^4 x$
    answer:
      choiceId: a
    hint: Power reduction is usually applied to squared pieces.
    explanation: |
      $\sin^4 x=(\sin^2 x)^2$, so replace $\sin^2 x$ with $\frac{1-\cos(2x)}{2}$ and simplify from there.

      Related topic: repeated power reduction. Action step: reduce one squared layer at a time.
  - id: step-we001-7
    title: Summarize the decision rule
    instruction: Capture the structural cue and the lookup path.
    type: freeResponse
    prompt: When should you use power reduction, and what identities should you look
      up first?
    answer:
      expected: Use power reduction when even powers of sine or cosine make an expression
        hard to integrate or simplify. Look up the identities for sin squared and
        cos squared in terms of cos(2x), then apply them repeatedly for higher even
        powers.
      gradingMode: selfCheck
      keyPoints:
      - Look for even powers of sine or cosine.
      - Use $\sin^2 x=(1-\cos(2x))/2$.
      - Use $\cos^2 x=(1+\cos(2x))/2$.
      - For fourth powers or higher, reduce squared layers repeatedly.
    hint: 'Think: even trig power, double-angle identity, reduce the power.'
    explanation: |
      Power reduction is a structural tool: it replaces a difficult even power with lower-power terms involving a double angle.

      Related topic: power reduction identities. Quick lookup phrase: "sin squared cos squared power reduction identities."
