questions:
- id: q001
  type: freeResponse
  skills:
  - sum-higher-order-telescoping-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{1}{n(n+1)(n+2)}$.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Write the term as one-half times $[1/(n(n+1))-1/((n+1)(n+2))]$ and telescope.
  explanation: Write the term as one-half times $[1/(n(n+1))-1/((n+1)(n+2))]$ and telescope.
  difficultyDimensions: &id001
  - identityConstruction
  - auxiliaryTechnique
  - modelOrDerivation
  - globalLocalReasoning
  - proofJustification
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  extensionObjectiveIds:
  - calc2-obj-finals-series-and-representations
- id: q002
  type: freeResponse
  skills:
  - derive-weighted-geometric-sums
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}n/2^n$.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      From $\sum nx^n=x/(1-x)^2$, substitute x equals one-half.
  explanation: |-
    From $\sum nx^n=x/(1-x)^2$, substitute x equals one-half.
  difficultyDimensions: *id001
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  extensionObjectiveIds:
  - calc2-obj-finals-series-and-representations
- id: q003
  type: freeResponse
  skills:
  - derive-second-moment-geometric-sums
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}n^2/2^n$.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      Use $\sum n^2x^n=x(1+x)/(1-x)^3$ and set x equal to one-half.
  explanation: |-
    Use $\sum n^2x^n=x(1+x)/(1-x)^3$ and set x equal to one-half.
  difficultyDimensions: *id001
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  extensionObjectiveIds:
  - calc2-obj-finals-series-and-representations
- id: q004
  type: freeResponse
  skills:
  - use-small-angle-asymptotics
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}\sin(1/n)$.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      The ratio $\sin(1/n)/(1/n)$ tends to one, so the positive series has harmonic behavior.
  explanation: |-
    The ratio $\sin(1/n)/(1/n)$ tends to one, so the positive series has harmonic behavior.
  difficultyDimensions: *id001
  difficultyEvidence: The problem requires selecting a representation, carrying out the governing calculus method, and checking the condition that makes the result valid.
  extensionObjectiveIds:
  - calc2-obj-finals-series-and-representations
- id: q005
  type: freeResponse
  skills:
  - use-quadratic-small-angle-asymptotics
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}[1-\cos(1/n)]$.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - |-
      Since $1-\cos u\sim u^2/2$, the terms are asymptotic to $1/(2n^2)$.
  explanation: |-
    Since $1-\cos u\sim u^2/2$, the terms are asymptotic to $1/(2n^2)$.
