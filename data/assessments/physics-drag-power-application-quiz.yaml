questions:
- id: q-drag-power-loss
  title: Rate of Energy Loss
  type: symbolicResponse
  prompt: |
    A $10\text{ kg}$ object is falling downward at $5.0\text{ m/s}$ and experiencing a linear drag force with coefficient $b = 3.0\text{ kg/s}$.
    What is the instantaneous rate at which mechanical energy is being lost to the air (in Watts)? (Write your answer as a negative number to indicate loss).
  answer:
    gradingMode: auto
    expectedLatex: -75
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    The rate of change of mechanical energy is $\frac{dE_{\text{mech}}}{dt} = -bv^2$.
    $\frac{dE_{\text{mech}}}{dt} = -(3.0)(5.0)^2 = -(3.0)(25) = -75\text{ W}$.
    (Gravity does not contribute to a loss in mechanical energy because it is a conservative force!).
  skills:
  - physics-work-energy
- id: q-power-constant-force
  title: Power from a Constant Applied Force
  type: symbolicResponse
  prompt: |
    An elevator motor pulls a $500\text{ kg}$ elevator upward at a constant speed of $2.0\text{ m/s}$. 
    Assuming $g = 10\text{ m/s}^2$ and ignoring friction, what is the power output of the motor (in Watts)?
  answer:
    gradingMode: auto
    expectedLatex: 10000
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Since the elevator moves at a constant speed, the net force is zero. Thus, the upward force provided by the motor equals the downward force of gravity.
    $F_{\text{motor}} = mg = (500\text{ kg})(10\text{ m/s}^2) = 5000\text{ N}$.
    Instantaneous power is $P = \vec{F} \cdot \vec{v}$. Since both force and velocity point upward, $P = F v = (5000\text{ N})(2.0\text{ m/s}) = 10,000\text{ W}$.
  skills:
  - physics-work-energy
- id: q-power-dot-product
  title: Power as a Dot Product
  type: symbolicResponse
  prompt: |
    At a certain instant, a particle is moving with a velocity vector $\vec{v} = (3\hat{i} - 2\hat{j})\text{ m/s}$. It is subject to a net force $\vec{F} = (4\hat{i} + 5\hat{j})\text{ N}$.
    What is the instantaneous power (in Watts) delivered by this net force?
  answer:
    gradingMode: auto
    expectedLatex: 2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Instantaneous power is the dot product of force and velocity: $P = \vec{F} \cdot \vec{v}$.
    $P = (F_x)(v_x) + (F_y)(v_y) = (4)(3) + (5)(-2) = 12 - 10 = 2\text{ W}$.
  skills:
  - physics-work-energy
