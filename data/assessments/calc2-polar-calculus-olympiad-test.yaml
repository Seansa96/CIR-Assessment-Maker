- id: q001
  type: freeResponse
  skills:
  - polar-calculus
  - olympiad-problem-solving
  prompt: Find the area enclosed by the polar circle $r=5\sin\theta$.
  answer:
    gradingMode: selfCheck
    expected: $\frac{\pi 25}4$.
    keyPoints:
    - 'Matches the reference result: $\frac{\pi 25}4$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: 'Trace it for $0\le\theta\le\pi$: $A=\frac12\int_0^\pi 25\sin^2\theta d\theta=\pi25/4$.'
