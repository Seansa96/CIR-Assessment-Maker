questions:
- id: q001
  type: multipleChoice
  prompt: 'For $\mathbf r(t)=\langle t^2,3t,1\rangle$, what is $\mathbf v(t)$?'
  choices:
  - id: a
    text: '$\langle2t,3,0\rangle$'
  - id: b
    text: '$\langle t,3,1\rangle$'
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: '$\langle2,3,0\rangle$'
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: '$\langle t^2,3t,1\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Velocity is the derivative of position.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: 'What is the speed when $\mathbf v(t)=\langle3,4,12\rangle$?'
  choices:
  - id: a
    text: $13$
  - id: b
    text: $19$
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: '$\langle3,4,12\rangle$'
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: $169$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Speed is $\sqrt{3^2+4^2+12^2}$.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: 'If $\mathbf a(t)=\langle2,0,0\rangle$, which is a possible velocity?'
  choices:
  - id: a
    text: '$\langle2t+C, D, E\rangle$'
  - id: b
    text: '$\langle t^2,0,0\rangle$'
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: '$\langle2,0,0\rangle$'
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: '$\langle2t,0,0\rangle$ only'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Integrating acceleration introduces a constant vector.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q004
  type: multipleChoice
  prompt: Which statement distinguishes velocity from speed?
  choices:
  - id: a
    text: Velocity has direction; speed is its magnitude.
  - id: b
    text: Speed has direction; velocity is scalar.
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: They are always equal.
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: Velocity is the integral of speed.
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Magnitude removes direction from velocity.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
