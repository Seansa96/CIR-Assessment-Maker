questions:
- id: q001
  type: multipleChoice
  prompt: 'For $\mathbf r(t)=\langle t^2,3t,1\rangle$, what is $\mathbf v(t)$?'
  choices:
  - id: a
    text: '$\langle2t,3,0\rangle$'
  - id: b
    text: '$\langle t,3,1\rangle$'
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: '$\langle2,3,0\rangle$'
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: '$\langle t^2,3t,1\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Velocity is the derivative of position.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → The Derivative.

    Why the other choices fail: Choice b, ''$\langle t,3,1\rangle$'', does not give ''$\langle2t,3,0\rangle$'' for ''For $\mathbf
    r(t)=\langle t^2,3t,1\rangle$, what is $\mathbf v(t)$?''. It substitutes a different result, representation, or condition
    for the one the prompt specifies.

    Choice c, ''$\langle2,3,0\rangle$'', does not give ''$\langle2t,3,0\rangle$'' for ''For $\mathbf r(t)=\langle t^2,3t,1\rangle$,
    what is $\mathbf v(t)$?''. It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice d, ''$\langle t^2,3t,1\rangle$'', does not give ''$\langle2t,3,0\rangle$'' for ''For $\mathbf r(t)=\langle t^2,3t,1\rangle$,
    what is $\mathbf v(t)$?''. It substitutes a different result, representation, or condition for the one the prompt specifies.'
