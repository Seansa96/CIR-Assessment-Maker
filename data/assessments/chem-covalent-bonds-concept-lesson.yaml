lesson:
  introduction: Build a reliable model of covalent bonding by separating electron accounting, particle representation, and
    observable evidence.
  sections:
  - id: shared-density
    title: Interpret shared electron density
    required: true
    content: A covalent bond concentrates electron density between nuclei. In a Lewis model, one shared pair is represented
      by two dots or one line and is counted toward both atoms' valence shells.
    check:
      id: chk-shared-density
      type: multipleChoice
      prompt: Which statement correctly applies the idea of interpret shared electron density?
      choices:
      - id: a
        text: The H-H bond contains one shared pair between the nuclei.
        issueSignals: []
      - id: b
        text: Each hydrogen permanently transfers one electron to the other.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: A bond line represents one proton shared by both atoms.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: The H-H bond contains one shared pair between the nuclei. Why it works: A covalent bond concentrates
        electron density between nuclei. In a Lewis model, one shared pair is represented by two dots or one line and is counted
        toward both atoms'' valence shells. Why the other choices fail: The other statements either reverse the relevant electron
        or charge accounting or apply a structural model outside its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-shared-pair-map.svg
      alt: Instructional workflow for covalent bonding showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: single-bond
    title: Recognize single bonds
    required: true
    content: A single bond contains one shared pair and has bond order one. Additional nonbonding valence electrons remain
      as lone pairs on the appropriate atoms.
    check:
      id: chk-single-bond
      type: multipleChoice
      prompt: Which statement correctly applies the idea of recognize single bonds?
      choices:
      - id: a
        text: A Cl-Cl single bond is one shared pair plus three lone pairs on each chlorine.
        issueSignals: []
      - id: b
        text: A Cl-Cl single bond contains three shared pairs.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: Chlorine loses every lone pair when it forms one bond.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: A Cl-Cl single bond is one shared pair plus three lone pairs on each chlorine. Why it works:
        A single bond contains one shared pair and has bond order one. Additional nonbonding valence electrons remain as lone
        pairs on the appropriate atoms. Why the other choices fail: The other statements either reverse the relevant electron
        or charge accounting or apply a structural model outside its stated scope.'
  - id: multiple-bonds
    title: Recognize multiple bonds
    required: true
    content: When one shared pair does not complete the needed valence shells, atoms may share two or three pairs. A double
      bond has order two and a triple bond has order three.
    check:
      id: chk-multiple-bonds
      type: multipleChoice
      prompt: Which statement correctly applies the idea of recognize multiple bonds?
      choices:
      - id: a
        text: The N2 triple bond contains three shared pairs.
        issueSignals: []
      - id: b
        text: A double bond contains one shared pair drawn with two lines.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: Bond order counts the atoms rather than shared pairs.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: The N2 triple bond contains three shared pairs. Why it works: When one shared pair does not
        complete the needed valence shells, atoms may share two or three pairs. A double bond has order two and a triple bond
        has order three. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
  - id: bond-order-trends
    title: Relate order, length, and strength
    required: true
    content: For the same atom pair, increasing bond order generally shortens and strengthens the bond because more shared
      density lies between the nuclei.
    check:
      id: chk-bond-order-trends
      type: multipleChoice
      prompt: Which statement correctly applies the idea of relate order, length, and strength?
      choices:
      - id: a
        text: A C=C bond is generally shorter and stronger than a C-C bond.
        issueSignals: []
      - id: b
        text: A C=C bond is longer because it contains more electrons.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: Bond order has no relationship to length or strength.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: A C=C bond is generally shorter and stronger than a C-C bond. Why it works: For the same atom
        pair, increasing bond order generally shortens and strengthens the bond because more shared density lies between the
        nuclei. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
  - id: lone-pairs
    title: Keep lone pairs in the electron inventory
    required: true
    content: Bond lines show shared pairs only. Remaining valence electrons must be placed as lone pairs so the total count
      and expected shells are satisfied.
    check:
      id: chk-lone-pairs
      type: multipleChoice
      prompt: Which statement correctly applies the idea of keep lone pairs in the electron inventory?
      choices:
      - id: a
        text: Water has two O-H bonding pairs and two lone pairs on oxygen.
        issueSignals: []
      - id: b
        text: Water's four electron pairs are all shared between oxygen and hydrogen.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: Hydrogen carries two lone pairs in water.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: Water has two O-H bonding pairs and two lone pairs on oxygen. Why it works: Bond lines show
        shared pairs only. Remaining valence electrons must be placed as lone pairs so the total count and expected shells
        are satisfied. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
  - id: model-limits
    title: State the model's limits
    required: true
    content: A localized Lewis structure is excellent electron bookkeeping but does not display orbital shape, exact electron
      density, resonance averaging, or a molecule's full three-dimensional geometry.
    check:
      id: chk-model-limits
      type: multipleChoice
      prompt: Which statement correctly applies the idea of state the model's limits?
      choices:
      - id: a
        text: A Lewis structure needs other models to predict three-dimensional shape.
        issueSignals: []
      - id: b
        text: A Lewis structure is a measured photograph of stationary electrons.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      - id: c
        text: Every bond must be purely ionic or purely covalent in a Lewis drawing.
        issueSignals:
        - id: chemistry-bonding-covalent-pair-error
      answer:
        choiceId: a
      explanation: 'Solution: A Lewis structure needs other models to predict three-dimensional shape. Why it works: A localized
        Lewis structure is excellent electron bookkeeping but does not display orbital shape, exact electron density, resonance
        averaging, or a molecule''s full three-dimensional geometry. Why the other choices fail: The other statements either
        reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
