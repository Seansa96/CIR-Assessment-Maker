glossary:
  introduction: Terms for geometry and speeds in a supersonic shock wave.
  sections:
  - id: shock-terms
    title: Core terms
    entries:
    - {id: mach-number, term: Mach number, definition: 'The speed ratio $M=v_s/v$.', drills: [{id: mach-number-drill, type: typed, prompt: 'What is the speed ratio $v_s/v$ called?', answer: {expected: Mach number}}]}
    - {id: mach-cone, term: Mach cone, definition: 'The conical shock-wave surface behind a supersonic source.', drills: [{id: mach-cone-drill, type: cloze, prompt: 'The conical wavefront behind a supersonic source is the {{Mach cone}}.', answer: {expected: Mach cone}}]}
    - {id: supersonic, term: supersonic, definition: 'Moving faster than the local wave speed, so $M>1$.', drills: [{id: supersonic-drill, type: typed, prompt: 'What does supersonic mean?', answer: {expected: faster than sound}}]}
    - {id: mach-angle, term: Mach angle, definition: 'The cone half-angle satisfying $\sin\theta=v/v_s=1/M$.', drills: [{id: mach-angle-drill, type: cloze, prompt: 'Mach angle obeys $\sin\theta={{1/M}}$.', answer: {expected: '1/M'}}]}
