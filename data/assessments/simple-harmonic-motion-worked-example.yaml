workedExamples:
- id: we-simple-harmonic-motion
  title: Deriving and applying Simple Harmonic Motion
  problem: Use the labeled model to derive and calculate the period from $T=2\pi\sqrt{m/k}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Identify the components of the physical system from the diagram. You should see a mass block attached to a spring on a horizontal track.
    prompt: Identify the mass $m$ and the spring constant $k$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-mass-spring-states.svg
      alt: Original mass-spring schematic with equilibrium, amplitude, and restoring-force directions.
      caption: Identify the oscillator and its equilibrium before choosing a relation.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Mass $m$ and spring constant $k$ are the primary parameters.
    explanation: 'Solution: The diagram shows an oscillating system where a mass $m$ is displaced from equilibrium by a spring with stiffness $k$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the simplifying assumptions necessary to model this as simple harmonic motion.
    prompt: List the key assumptions.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-mass-spring-states.svg
      alt: Original mass-spring schematic showing the ideal horizontal model.
      caption: The horizontal idealization makes the spring the only horizontal force.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Ideal massless spring, no friction, no air resistance.
    explanation: 'Solution: We assume the spring is ideal (massless and perfectly obeys Hooke''s Law) and that the surface is completely frictionless with no air drag.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the quantity we want to determine in this derivation.
    prompt: Name the target variable.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original map of simple harmonic motion quantities and their relations.
      caption: The requested quantity determines which branch of the map to follow.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Period $T$
    explanation: 'Solution: The problem asks us to derive and calculate the period of oscillation, denoted as $T$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write down the governing physical principles. Start by equating Newton's Second Law with Hooke's Law.
    prompt: Write the equation of motion.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-mass-spring-states.svg
      alt: Original mass-spring schematic showing the restoring force toward equilibrium.
      caption: Hooke's law supplies the horizontal net force.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - ma = -kx
    explanation: 'Solution: The net force is the spring force, so $F_{\text{net}} = -kx$. By Newton''s Second Law, $F_{\text{net}} = ma$, leading to $ma = -kx$ or $m\frac{d^2x}{dt^2} = -kx$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the angular frequency $\omega$ and use it to find the period $T$. Remember that for SHM, $a = -\omega^2 x$.
    prompt: Isolate the period $T$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original map linking mass and spring constant to angular frequency and period.
      caption: First obtain angular frequency, then invert it for the period.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - T = 2\pi\sqrt{m/k}
    explanation: 'Solution: From $a = -\frac{k}{m}x$, we identify $\omega^2 = \frac{k}{m}$, so $\omega = \sqrt{\frac{k}{m}}$. Since $T = \frac{2\pi}{\omega}$, substituting gives $T = 2\pi\sqrt{\frac{m}{k}}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Suppose the system has a mass of $m = 0.50$ kg and a spring constant $k = 50.0$ N/m. Calculate the period $T$.
    prompt: Calculate $T$ in seconds.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original map linking mass and spring constant to period.
      caption: The values of mass and stiffness select the period branch.
    answer:
      value: 0.628
      tolerance: 0.05
    explanation: 'Solution: Substitute the values: $T = 2\pi\sqrt{\frac{0.50}{50.0}} = 2\pi\sqrt{0.01} = 2\pi(0.1) \approx 0.6283$ s.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Perform a dimensional analysis to verify that your derived equation $T = 2\pi\sqrt{m/k}$ produces units of time.
    prompt: Check the units under the square root.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original map of the period relation for a mass-spring oscillator.
      caption: Dimensional analysis checks that the period relation returns seconds.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - \sqrt{kg / (kg/s^2)} = s
    explanation: 'Solution: The unit of mass is kg, and the unit of spring constant is N/m, which expands to $\text{kg}\cdot\text{m/s}^2/\text{m} = \text{kg/s}^2$. Thus $\sqrt{\text{kg}/(\text{kg/s}^2)} = \sqrt{\text{s}^2} = \text{s}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated period for the given system.
    prompt: What is the final period $T$?
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original map of simple harmonic motion quantities and their relations.
      caption: The final period follows from the calculated angular frequency.
    answer:
      value: 0.628
      tolerance: 0.05
    explanation: 'Solution: The final period is $0.6283$ seconds.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
- id: we-shm-maximum-speed
  title: From a mass-spring model to angular frequency and maximum speed
  problem: A $2.00\,\text{kg}$ block oscillates on a horizontal spring with $k=200\,\text{N/m}$ and amplitude $A=0.150\,\text{m}$. Find $\omega$, $T$, and $v_{\max}$.
  steps:
  - id: speed-step1
    title: Read the physical state
    instruction: The diagram identifies a horizontal ideal spring, so $m$, $k$, and $A$ refer to one mass-spring oscillator.
    prompt: Which given quantity measures the maximum displacement from equilibrium?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-mass-spring-states.svg
      alt: Original mass-spring schematic labeling amplitude as the maximum displacement from equilibrium.
      caption: The block travels between $-A$ and $+A$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The amplitude A = 0.150 m.
    explanation: 'Solution: Amplitude is measured from equilibrium to either turning point.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: speed-step2
    title: Choose the first relation
    instruction: The mass and spring constant determine angular frequency. Amplitude is not used in this first calculation.
    prompt: Write the relation for angular frequency.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map linking mass and spring constant to angular frequency.
      caption: Follow the $m,k \rightarrow \omega$ branch first.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - \omega = \sqrt{k/m}
    explanation: 'Solution: For an ideal mass-spring oscillator, $\omega=\sqrt{k/m}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: speed-step3
    title: Calculate angular frequency
    instruction: Substitute $k=200\,\text{N/m}$ and $m=2.00\,\text{kg}$.
    prompt: Calculate $\omega$ in rad/s.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map for angular frequency in a mass-spring oscillator.
      caption: $\omega=\sqrt{200/2.00}$.
    answer:
      value: 10
      tolerance: 0.01
    explanation: 'Solution: $\omega=\sqrt{200/2.00}=10.0\,\text{rad/s}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: speed-step4
    title: Connect frequency to period
    instruction: Period is one complete cycle, so it is obtained by inverting angular frequency with the factor $2\pi$.
    prompt: Calculate $T$ in seconds.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map linking angular frequency to period.
      caption: $T=2\pi/\omega$.
    answer:
      value: 0.6283
      tolerance: 0.01
    explanation: 'Solution: $T=2\pi/10.0=0.628\,\text{s}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: speed-step5
    title: Identify the speed state
    instruction: The phase graph shows that the block moves fastest as it crosses equilibrium, not at either turning point.
    prompt: At what position is the speed maximum?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-phase-graphs.svg
      alt: Original position velocity and acceleration graphs showing maximum speed at equilibrium.
      caption: At $x=0$, the velocity curve has its largest magnitude.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - At equilibrium, x = 0.
    explanation: 'Solution: At turning points velocity is zero; at equilibrium the spring force and acceleration are zero but speed is maximum.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: speed-step6
    title: Use amplitude for maximum speed
    instruction: Now use the supplied amplitude with the angular frequency from step 3.
    prompt: Write the relation for maximum speed.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map linking amplitude and angular frequency to maximum speed.
      caption: Amplitude enters when finding the maximum speed.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v_{max} = A\omega
    explanation: 'Solution: The magnitude of the velocity amplitude is $A\omega$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: speed-step7
    title: Calculate maximum speed
    instruction: Multiply the amplitude $0.150\,\text{m}$ by $\omega=10.0\,\text{rad/s}$.
    prompt: Calculate $v_{\max}$ in m/s.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original calculation map for maximum speed in simple harmonic motion.
      caption: $v_{\max}=0.150(10.0)$.
    answer:
      value: 1.5
      tolerance: 0.01
    explanation: 'Solution: $v_{\max}=A\omega=(0.150)(10.0)=1.50\,\text{m/s}$.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: speed-step8
    title: Check the result against the motion
    instruction: Explain why the amplitude changes maximum speed but not the period of this ideal oscillator.
    prompt: State which quantities change when A is doubled while m and k stay fixed.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shm-quantity-map.svg
      alt: Original map showing that angular frequency and period depend on mass and spring constant, while maximum speed also depends on amplitude.
      caption: Period and angular frequency follow the $m,k$ branch; maximum speed follows the $A,\omega$ branch.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v_max doubles; omega and T remain unchanged.
    explanation: 'Solution: $v_{\max}=A\omega$ is proportional to amplitude, whereas $\omega=\sqrt{k/m}$ and $T=2\pi\sqrt{m/k}$ are not.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
