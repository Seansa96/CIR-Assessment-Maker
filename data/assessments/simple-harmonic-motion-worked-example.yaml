workedExamples:
- id: we-simple-harmonic-motion
  title: Deriving and applying Simple Harmonic Motion
  problem: Use the labeled model to derive and calculate the period from $T=2\pi\sqrt{m/k}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the components of the physical system from the diagram. You should see a mass block attached to a spring on a horizontal track.
    prompt: 'Identify the mass $m$ and the spring constant $k$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Mass $m$ and spring constant $k$ are the primary parameters.'
    explanation: >-
      The diagram shows an oscillating system where a mass $m$ is displaced from equilibrium by a spring with stiffness $k$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the simplifying assumptions necessary to model this as simple harmonic motion.
    prompt: 'List the key assumptions.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Ideal massless spring, no friction, no air resistance.'
    explanation: >-
      We assume the spring is ideal (massless and perfectly obeys Hooke's Law) and that the surface is completely frictionless with no air drag.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the quantity we want to determine in this derivation.
    prompt: 'Name the target variable.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Period $T$'
    explanation: >-
      The problem asks us to derive and calculate the period of oscillation, denoted as $T$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write down the governing physical principles. Start by equating Newton's Second Law with Hooke's Law.
    prompt: 'Write the equation of motion.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'ma = -kx'
    explanation: >-
      The net force is the spring force, so $F_{\text{net}} = -kx$. By Newton's Second Law, $F_{\text{net}} = ma$, leading to $ma = -kx$ or $m\frac{d^2x}{dt^2} = -kx$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the angular frequency $\omega$ and use it to find the period $T$. Remember that for SHM, $a = -\omega^2 x$.
    prompt: 'Isolate the period $T$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'T = 2\pi\sqrt{m/k}'
    explanation: >-
      From $a = -\frac{k}{m}x$, we identify $\omega^2 = \frac{k}{m}$, so $\omega = \sqrt{\frac{k}{m}}$. Since $T = \frac{2\pi}{\omega}$, substituting gives $T = 2\pi\sqrt{\frac{m}{k}}$.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Suppose the system has a mass of $m = 0.50$ kg and a spring constant $k = 50.0$ N/m. Calculate the period $T$.
    prompt: 'Calculate $T$ in seconds.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      value: 3.141593
      tolerance: 0.031415926535897934
    explanation: >-
      Substitute the values: $T = 2\pi\sqrt{\frac{0.50}{50.0}} = 2\pi\sqrt{0.01} = 2\pi(0.1) \approx 0.6283$ s.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Perform a dimensional analysis to verify that your derived equation $T = 2\pi\sqrt{m/k}$ produces units of time.
    prompt: 'Check the units under the square root.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      gradingMode: selfCheck
      expected: '\sqrt{kg / (kg/s^2)} = s'
    explanation: >-
      The unit of mass is kg, and the unit of spring constant is N/m, which expands to $\text{kg}\cdot\text{m/s}^2/\text{m} = \text{kg/s}^2$. Thus $\sqrt{\text{kg}/(\text{kg/s}^2)} = \sqrt{\text{s}^2} = \text{s}$.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated period for the given system.
    prompt: 'What is the final period $T$?'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/simple-harmonic-motion.svg
      alt: Labeled original schematic for Simple Harmonic Motion used for quantitative analysis.
      caption: Simple Harmonic Motion model diagram.
    answer:
      value: 3.141593
      tolerance: 0.031415926535897934
    explanation: >-
      The final period is $0.6283$ seconds.
