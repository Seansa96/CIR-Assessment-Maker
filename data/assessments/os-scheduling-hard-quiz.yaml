questions:
- id: q001
  title: Apply Scheduling goals
  type: multipleChoice
  prompt: A system design discussion mentions **Scheduling goals**. Which conclusion is most defensible?
  choices:
  - id: a
    text: There is no single best scheduler without a goal.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: There is no single best scheduler without a goal. This is why Scheduling goals matters in Scheduling.
