schemaVersion: 1
id: integration-by-parts-applications
title: Integration by Parts Applications
assessmentType: quiz
categoryId: calculus-2
subcategoryIds:
  - integration-techniques
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "Which formula is the standard integration by parts formula?"
    choices:
      - id: a
        text: '\(\int u\,dv=uv-\int v\,du\)'
      - id: b
        text: '\(\int u\,dv=uv+\int v\,du\)'
      - id: c
        text: '\(\int u\,dv=u+v+C\)'
      - id: d
        text: '\(\int u\,dv=\frac{du}{dv}\)'
    answer:
      choiceId: a
    explanation: |
      Integration by parts reverses the product rule and subtracts the remaining integral.

      Related topic: Integration by Parts Formula

  - id: q002
    type: multipleChoice
    prompt: "For \\(\\int x e^x\\,dx\\), which choice of \\(u\\) is usually best?"
    choices:
      - id: a
        text: '\(u=x\)'
      - id: b
        text: '\(u=e^x\)'
      - id: c
        text: '\(u=dx\)'
      - id: d
        text: '\(u=xe^x\)'
    answer:
      choiceId: a
    explanation: |
      Choosing \(u=x\) makes \(du=dx\), which simplifies the algebraic factor.

      Related topic: Choosing \(u\) in Integration by Parts

  - id: q003
    type: multipleChoice
    prompt: "Evaluate \\(\\int x e^x\\,dx\\)."
    choices:
      - id: a
        text: '\(xe^x-e^x+C\)'
      - id: b
        text: '\(xe^x+e^x+C\)'
      - id: c
        text: '\(e^x+C\)'
      - id: d
        text: '\(x^2e^x+C\)'
    answer:
      choiceId: a
    explanation: |
      Let \(u=x\), \(dv=e^x dx\). Then \(du=dx\), \(v=e^x\), so the result is \(xe^x-\int e^x dx=xe^x-e^x+C\).

      Related topic: Integration by Parts with Exponential Functions

  - id: q004
    type: multipleChoice
    prompt: "Evaluate \\(\\int x\\cos x\\,dx\\)."
    choices:
      - id: a
        text: '\(x\sin x+\cos x+C\)'
      - id: b
        text: '\(x\sin x-\cos x+C\)'
      - id: c
        text: '\(-x\cos x+\sin x+C\)'
      - id: d
        text: '\(\sin x+C\)'
    answer:
      choiceId: a
    explanation: |
      Let \(u=x\), \(dv=\cos x\,dx\). Then \(v=\sin x\), giving \(x\sin x-\int\sin x\,dx=x\sin x+\cos x+C\).

      Related topic: Integration by Parts with Trigonometric Functions

  - id: q005
    type: multipleChoice
    prompt: "Which integral is a classic case for choosing \\(u=\\ln x\\)?"
    choices:
      - id: a
        text: '\(\int \ln x\,dx\)'
      - id: b
        text: '\(\int e^x\,dx\)'
      - id: c
        text: '\(\int \cos x\,dx\)'
      - id: d
        text: '\(\int x^2\,dx\)'
    answer:
      choiceId: a
    explanation: |
      Treat \(\int \ln x\,dx\) as \(\int \ln x\cdot1\,dx\), then let \(u=\ln x\).

      Related topic: Integration by Parts for Logarithms

  - id: q006
    type: multipleChoice
    prompt: "Evaluate \\(\\int \\ln x\\,dx\\)."
    choices:
      - id: a
        text: '\(x\ln x-x+C\)'
      - id: b
        text: '\(\frac{1}{x}+C\)'
      - id: c
        text: '\(x\ln x+x+C\)'
      - id: d
        text: '\((\ln x)^2+C\)'
    answer:
      choiceId: a
    explanation: |
      Let \(u=\ln x\), \(dv=dx\). Then \(du=dx/x\), \(v=x\), so \(x\ln x-\int1\,dx=x\ln x-x+C\).

      Related topic: Integrating Logarithms by Parts

  - id: q007
    type: multipleChoice
    prompt: "Which integral is especially well suited for the tabular method?"
    choices:
      - id: a
        text: '\(\int x^3e^x\,dx\)'
      - id: b
        text: '\(\int \frac{1}{x}\,dx\)'
      - id: c
        text: '\(\int e^{x^2}\,dx\)'
      - id: d
        text: '\(\int \sin(x^2)\,dx\)'
    answer:
      choiceId: a
    explanation: |
      The tabular method works well because repeated derivatives of \(x^3\) eventually reach zero while \(e^x\) integrates easily.

      Related topic: Tabular Integration by Parts

  - id: q008
    type: multipleChoice
    prompt: "Which integral often requires integrating by parts twice and solving for the original integral?"
    choices:
      - id: a
        text: '\(\int e^x\cos x\,dx\)'
      - id: b
        text: '\(\int x^2\,dx\)'
      - id: c
        text: '\(\int \frac{1}{x}\,dx\)'
      - id: d
        text: '\(\int \sqrt{x}\,dx\)'
    answer:
      choiceId: a
    explanation: |
      Applying parts twice brings back the original integral, so you solve algebraically for it.

      Related topic: Cyclic Integration by Parts

  - id: q009
    type: multipleChoice
    prompt: "Evaluate \\(\\int_0^1 x e^x\\,dx\\)."
    choices:
      - id: a
        text: "1"
      - id: b
        text: '\(e\)'
      - id: c
        text: '\(e-1\)'
      - id: d
        text: "0"
    answer:
      choiceId: a
    explanation: |
      An antiderivative is \(xe^x-e^x\). Evaluating from 0 to 1 gives \((e-e)-(-1)=1\).

      Related topic: Definite Integrals by Parts

  - id: q010
    type: multipleChoice
    prompt: "When using integration by parts, what should usually happen to the chosen \\(u\\) after differentiating?"
    choices:
      - id: a
        text: "It should become simpler"
      - id: b
        text: "It should become harder"
      - id: c
        text: "It must become zero immediately"
      - id: d
        text: 'It must equal \(dv\)'
    answer:
      choiceId: a
    explanation: |
      A good \(u\) choice usually simplifies when differentiated, making the remaining integral easier.

      Related topic: Strategy for Choosing \(u\)

  - id: q011
    type: multipleChoice
    prompt: "Evaluate \\(\\int x^2e^x\\,dx\\)."
    choices:
      - id: a
        text: '\(e^x(x^2-2x+2)+C\)'
      - id: b
        text: '\(e^x(x^2+2x+2)+C\)'
      - id: c
        text: '\(x^2e^x+C\)'
      - id: d
        text: '\(2xe^x+C\)'
    answer:
      choiceId: a
    explanation: |
      Repeated integration by parts gives \(x^2e^x-2xe^x+2e^x+C=e^x(x^2-2x+2)+C\).

      Related topic: Repeated Integration by Parts

  - id: q012
    type: multipleChoice
    prompt: "Evaluate \\(\\int x^2\\sin x\\,dx\\)."
    choices:
      - id: a
        text: '\(-x^2\cos x+2x\sin x+2\cos x+C\)'
      - id: b
        text: '\(x^2\cos x-2x\sin x+C\)'
      - id: c
        text: '\(-x^2\sin x+2x\cos x+C\)'
      - id: d
        text: '\(2x\sin x+C\)'
    answer:
      choiceId: a
    explanation: |
      Apply parts twice, reducing \(x^2\) to \(2x\) and then to a constant.

      Related topic: Repeated Integration by Parts with Trig Functions

  - id: q013
    type: multipleChoice
    prompt: "Which choice best describes when tabular integration is efficient?"
    choices:
      - id: a
        text: "A polynomial factor eventually differentiates to zero"
      - id: b
        text: "Both factors get more complicated forever"
      - id: c
        text: "No product is present"
      - id: d
        text: "The integrand is a simple power of x only"
    answer:
      choiceId: a
    explanation: |
      Tabular integration organizes repeated parts when one factor terminates after repeated differentiation.

      Related topic: When to Use Tabular Integration

  - id: q014
    type: multipleChoice
    prompt: "Evaluate \\(\\int x\\ln x\\,dx\\)."
    choices:
      - id: a
        text: '\(\frac{x^2}{2}\ln x-\frac{x^2}{4}+C\)'
      - id: b
        text: '\(x\ln x-x+C\)'
      - id: c
        text: '\(\frac{x^2}{2}\ln x+\frac{x^2}{2}+C\)'
      - id: d
        text: '\(\ln x+C\)'
    answer:
      choiceId: a
    explanation: |
      Let \(u=\ln x\), \(dv=x\,dx\). Then \(v=x^2/2\), so subtract \(\int x/2\,dx=x^2/4\).

      Related topic: Integration by Parts with Algebraic and Logarithmic Factors

  - id: q015
    type: multipleChoice
    prompt: "For \\(\\int x^4e^x\\,dx\\), which method is recommended?"
    choices:
      - id: a
        text: "Tabular integration by parts"
      - id: b
        text: "Partial fractions"
      - id: c
        text: "Trigonometric substitution"
      - id: d
        text: "Completing the square"
    answer:
      choiceId: a
    explanation: |
      A high-degree polynomial times \(e^x\) is ideal for tabular parts because the polynomial differentiates to zero.

      Related topic: Tabular Method for Polynomial-Exponential Products

  - id: q016
    type: numericResponse
    prompt: "For \\(\\int x e^{2x}\\,dx\\), the antiderivative can be written \\(e^{2x}(ax+b)+C\\). What is \\(a\\)?"
    answer:
      value: 0.5
      tolerance: 0.0001
    explanation: |
      Integration by parts gives \(\frac{x e^{2x}}{2}-\frac{e^{2x}}{4}=e^{2x}\left(\frac{x}{2}-\frac14\right)+C\), so \(a=1/2\).

      Related topic: Integration by Parts with Linear-Exponential Products

  - id: q017
    type: freeResponse
    prompt: "Why does \\(\\int e^x\\sin x\\,dx\\) often require integrating by parts twice and solving for the original integral?"
    answer:
      expected: |
        After applying integration by parts twice, the original integral appears again.
        You then move that copy to the other side and solve algebraically.
      gradingMode: selfCheck
    explanation: |
      Products of exponentials and sine/cosine cycle back to the original form after repeated parts.

      Related topic: Cyclic Integration by Parts

  - id: q018
    type: freeResponse
    prompt: "Describe why \\(\\int x^3\\cos x\\,dx\\) is a good candidate for the tabular method."
    answer:
      expected: |
        The polynomial \(x^3\) becomes simpler each time it is differentiated and eventually reaches zero.
        The trigonometric factor can be integrated repeatedly.
      gradingMode: selfCheck
    explanation: |
      Tabular parts is efficient when repeated integration by parts would follow a predictable derivative/integral table.

      Related topic: Tabular Integration with Polynomial-Trigonometric Products

  - id: q019
    type: numericResponse
    prompt: "Evaluate \\(\\int_0^1 \\ln x\\,dx\\)."
    answer:
      value: -1
      tolerance: 0.0001
    explanation: |
      An antiderivative is \(x\ln x-x\). The limit as \(x\to0^+\) of \(x\ln x\) is 0, so the value is \(-1\).

      Related topic: Definite Integration by Parts with Logarithms

  - id: q020
    type: numericResponse
    prompt: "For \\(\\int e^x\\cos x\\,dx=\\frac{e^x}{2}(\\sin x+\\cos x)+C\\), what is the denominator coefficient?"
    answer:
      value: 2
      tolerance: 0.0001
    explanation: |
      Integrating by parts twice and solving for the original integral gives the factor \(1/2\).

      Related topic: Solving Cyclic Integration by Parts Results
