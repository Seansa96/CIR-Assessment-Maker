- id: q011
  type: symbolicResponse
  skills:
  - physics2-ch07-electric-potential-equipotentials
  prompt: Give the far-field axial potential of a dipole with moment p at distance r. Enter the leading dependence,
    omitting constants.
  answer:
    expectedLatex: p/r^2
    equivalenceMode: simplify
    variables:
    - p
    - r
    tolerance: 1.0e-06
  explanation: 'Solution: V_axis≈kp/r^2; it falls as 1/r^2.


    Why it works: The dipole’s opposite charges cancel the monopole 1/r term.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-equipotentials
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-field-from-potential
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-equipotentials
- id: q012
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-electrostatics-applications
  prompt: Why must an electric-field line meet an equipotential surface perpendicularly?
  answer:
    choiceId: a
  explanation: 'Solution: Along an equipotential, dV=0; therefore E dot dl=0 for every tangent displacement.


    Why it works: The field is normal to level surfaces of potential.


    Why the other choices fail: The other options misstate scalar potential, field-line geometry, or surface definition.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-electrostatics-applications
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-equipotentials
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-electrostatics-applications
  choices:
  - id: a
    text: A tangential E component would change V along the surface.
  - id: b
    text: Potential is a vector parallel to E.
    issueSignals:
