- id: q007
  type: freeResponse
  skills:
  - physics2-ch07-electric-potential-potential-energy
  prompt: Two equal opposite charges are at (+a,0) and (-a,0). Describe V and E on their perpendicular bisector.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - V=0 by scalar cancellation
    - E is nonzero and points from + toward - across the bisector.
  explanation: 'Solution: V=0 by scalar cancellation; E is nonzero and points from + toward - across the bisector.


    Why it works: Potential is scalar while field is vector; cancellation rules differ.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-energy
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-electrostatics-applications
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-potential-energy
- id: q008
  type: freeResponse
  skills:
  - physics2-ch07-electric-potential-potential-difference
  prompt: Equipotential lines for 20 V intervals are 0.02 m apart in region A and 0.08 m in B. Compare field magnitudes.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - E_A≈1000 V/m
    - E_B≈250 V/m
    - A is four times stronger.
  explanation: 'Solution: E_A≈1000 V/m; E_B≈250 V/m; A is four times stronger.


    Why it works: Field magnitude is potential change per perpendicular distance.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-difference
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
