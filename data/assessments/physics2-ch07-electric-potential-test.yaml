questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - spatial-reasoning
  prompt: The electric potential in a certain region is given by $V(x, y, z) = 5x^2
    - 3y + z$. What is the x-component of the electric field at $x = 2\text{ m}$ (in
    V/m)?
  answer:
    numericValue: -20
    tolerance: 0.01
  explanation: 'Solution:

    1) Use the relation $E_x = -\frac{\partial V}{\partial x}$.

    2) Calculate the partial derivative: $\frac{\partial V}{\partial x} = 10x$.

    3) Substitute $x = 2$: $E_x = -10(2) = -20\text{ V/m}$.


    Why it works:

    The electric field is the negative gradient of the potential.'
