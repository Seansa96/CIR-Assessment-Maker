- id: q009
  type: selectAll
  skills:
  - physics2-ch07-electric-potential-potential-calculation
  prompt: A constant C is added to V everywhere. Select all unchanged quantities.
  answer:
    choiceIds:
    - a
    - b
  explanation: 'Solution: The gradient and differences remove an additive constant; absolute V and reference-dependent
    U shift.


    Why it works: Electrostatic predictions depend on spatial variation and potential differences.


    The unselected statements either ignore the stated constraint or apply the wrong relation.'
