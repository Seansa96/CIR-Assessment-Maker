questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch07-electric-potential-potential-energy
  prompt: Move a -3.0 nC charge from 2 V to 8 V. Find delta U and field work.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - delta U=-1.8e-8 J
    - W_field=+1.8e-8 J.
  explanation: 'Solution: delta U=-1.8e-8 J; W_field=+1.8e-8 J.


    Why it works: delta U=q delta V and conservative field work is -delta U.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-energy
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-electrostatics-applications
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-potential-energy
- id: q002
  type: numericResponse
  skills:
  - physics2-ch07-electric-potential-potential-difference
  prompt: Find V 0.50 m from +6.0 nC with zero at infinity. Enter V in volts.
  answer:
    value: 108.0
    tolerance: 1.0
  explanation: 'Solution: V=108 V.


    Why it works: Point-charge potential is kQ/r and is a signed scalar.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-difference
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-potential-energy
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-potential-difference
- id: q003
  type: numericResponse
  skills:
  - physics2-ch07-electric-potential-potential-calculation
  prompt: At P, +2 nC is 0.10 m away and -5 nC is 0.20 m away. Enter net potential in volts.
  answer:
    value: -44.95
    tolerance: 0.5
  explanation: 'Solution: V=k[(2e-9)/0.10-(5e-9)/0.20]=-44.95 V.


    Why it works: Potential contributions add algebraically, not as vectors.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-calculation
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-potential-difference
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-potential-calculation
- id: q004
  type: numericResponse
  skills:
  - physics2-ch07-electric-potential-field-from-potential
  prompt: For V(x)=3x^2-4x V, enter E_x at x=2 m in V/m.
  answer:
    value: -8.0
    tolerance: 0.1
  explanation: 'Solution: E_x=-(6x-4)=-8 V/m.


    Why it works: Electric field is the negative derivative of potential.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-field-from-potential
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-potential-calculation
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-field-from-potential
- id: q005
  type: numericResponse
  skills:
  - physics2-ch07-electric-potential-equipotentials
  prompt: A uniform field of 250 V/m points +x. Enter delta V for 0.40 m displacement along +x in volts.
  answer:
    value: -100.0
    tolerance: 1.0
  explanation: 'Solution: Delta V=-100 V.


    Why it works: The line integral gives a negative potential change along the field.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-equipotentials
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-field-from-potential
  extensionObjectiveIds:
  - physics2-ch07-electric-potential-equipotentials
- id: q006
  type: freeResponse
  skills:
  - physics2-ch07-electric-potential-electrostatics-applications
  prompt: A charge moves between equipotentials 12 V and 12 V. Find field work for q=2 microC.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - W_field=0 J.
  explanation: 'Solution: W_field=0 J.


    Why it works: Work depends on endpoint potential difference.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-electrostatics-applications
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
