- id: q010
  type: numericResponse
  skills:
  - physics2-ch07-electric-potential-field-from-potential
  prompt: An electron starts from rest and moves through a 120 V drop. Enter its gain in kinetic energy in joules.
  answer:
    value: 1.92e-17
    tolerance: 3.0e-19
  explanation: 'Solution: Delta K=120 eV=1.92e-17 J.


    Why it works: For an electron, q delta V is the potential-energy change; energy conservation gives opposite
    kinetic-energy change.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
