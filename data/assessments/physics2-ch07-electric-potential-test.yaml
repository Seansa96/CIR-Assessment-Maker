questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch07-modeling
  prompt: A Electric Potential situation emphasizes potential energy. Define the system and sign convention, state
    when $V=-\\int \\mathbf{E}\\cdot d\\mathbf{l}$ applies, and construct a written solution that includes the relation,
    units, assumptions, and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $V=-\\int \\mathbf{E}\\cdot d\\mathbf{l}$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Electric Potential model of energy and potential fields is reliable only when its relation,
    conditions, and interpretation are kept together.'
