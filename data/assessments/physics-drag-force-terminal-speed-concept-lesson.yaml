sections:
- id: drag-force
  title: Drag Force
  content: 'When an object moves through a fluid (like air or water), the fluid exerts
    a resistive force on the object called the **drag force** ($F_D$). This force
    always acts opposite to the direction of motion.


    For relatively fast-moving macroscopic objects in air, the drag force is often
    modeled as being proportional to the *square* of the speed:

    $$ F_D = \frac{1}{2} C \rho A v^2 $$

    * $C$ = drag coefficient (depends on shape)

    * $\rho$ = density of the fluid

    * $A$ = cross-sectional area

    * $v$ = speed of the object


    For simplicity, we sometimes write this as $F_D = k v^2$ (or $F_D = bv$ for very
    slow-moving or tiny objects).

    '
- id: terminal-speed
  title: Terminal Speed
  content: 'Consider an object falling from the sky. Initially, its speed is $v=0$,
    so the drag force is zero. It accelerates downward due to gravity at $9.8$ m/s².


    As its speed increases, the upward drag force $F_D$ also increases. This reduces
    the net downward force, so the downward acceleration decreases.


    Eventually, the object reaches a speed where the upward drag force exactly equals
    the downward force of gravity:

    $$ F_D = F_g \implies \frac{1}{2} C \rho A v_t^2 = mg $$


    At this point, the net force is zero, so acceleration is zero. The object no longer
    speeds up. It has reached its **terminal speed** ($v_t$).


    $$ v_t = \sqrt{\frac{2mg}{C \rho A}} $$

    '
- id: graphical-representation
  title: Velocity vs. Time Graph
  content: 'The graph of velocity vs. time for an object falling with air resistance
    shows an initial steep slope (representing $g$), which gradually flattens out
    as the velocity asymptotically approaches the terminal speed $v_t$.


    ![Terminal Velocity Graph](/media/physics/terminal-velocity-graph.svg)

    '
lesson:
  introduction: Drag Force and Terminal Speed
  sections:
  - id: sec-q001
    title: A skydiver is falling at terminal speed. What is the net force acting on
      the skydiver?
    content: |
      A skydiver is falling at terminal speed. What is the net force acting on the skydiver?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: Zero
      - id: b
        text: Upward, equal to the drag force
      - id: c
        text: Downward, equal to the skydiver's weight
      - id: d
        text: Downward, equal to the weight minus the drag force
      answer:
        choiceId: a
      explanation: |
        "Terminal speed" means the speed is constant (acceleration is zero). According to Newton's Second Law ($\sum F = ma$), if acceleration is zero, the net force must be zero. The upward drag force exactly balances the downward gravitational force.
  - id: dt2
    title: Drag Direction
    content: 'Drag force always opposes an object''s motion through a fluid.'
    media: []
    check: { id: dtc2, type: multipleChoice, prompt: 'For a falling object, drag points:', choices: [{ id: a, text: upward }, { id: b, text: downward }, { id: c, text: inward }, { id: d, text: nowhere }], answer: { choiceId: a }, explanation: 'Solution: Upward.\n\nWhy it works: Drag opposes the downward motion.\n\nWhy the other choices fail: Gravity, not drag, points downward.' }
  - id: dt3
    title: Speed Dependence
    content: 'A common high-speed model is $F_D=kv^2$, so drag grows quickly as speed increases.'
    media: []
    check: { id: dtc3, type: multipleChoice, prompt: 'If quadratic-drag speed doubles, drag force becomes:', choices: [{ id: a, text: four times }, { id: b, text: two times }, { id: c, text: half }, { id: d, text: unchanged }], answer: { choiceId: a }, explanation: 'Solution: Four times.\n\nWhy it works: Drag is proportional to $v^2$.\n\nWhy the other choices fail: They treat the square relation as linear.' }
  - id: dt4
    title: Net Force During Falling
    content: 'Before terminal speed, weight exceeds drag, so the falling object accelerates downward.'
    media: []
    check: { id: dtc4, type: multipleChoice, prompt: 'Before terminal speed, net force on a falling object is:', choices: [{ id: a, text: downward }, { id: b, text: upward }, { id: c, text: zero }, { id: d, text: horizontal }], answer: { choiceId: a }, explanation: 'Solution: Downward.\n\nWhy it works: Weight is larger than drag.\n\nWhy the other choices fail: Equal forces occur only at terminal speed.' }
  - id: dt5
    title: Terminal Condition
    content: 'At terminal speed, drag equals weight and acceleration is zero, although velocity is nonzero.'
    media: []
    check: { id: dtc5, type: multipleChoice, prompt: 'At terminal speed, acceleration is:', choices: [{ id: a, text: zero }, { id: b, text: $g$ }, { id: c, text: upward }, { id: d, text: infinite }], answer: { choiceId: a }, explanation: 'Solution: Zero.\n\nWhy it works: Net force is zero.\n\nWhy the other choices fail: The object continues at constant velocity.' }
  - id: dt6
    title: Factors Affecting Terminal Speed
    content: 'Greater mass tends to increase terminal speed; larger area or drag coefficient tends to decrease it.'
    media: []
    check: { id: dtc6, type: multipleChoice, prompt: 'A parachute lowers terminal speed mainly by increasing:', choices: [{ id: a, text: area and drag }, { id: b, text: mass only }, { id: c, text: gravity to zero }, { id: d, text: inertia to zero }], answer: { choiceId: a }, explanation: 'Solution: Area and drag.\n\nWhy it works: Larger area increases resistive force at a given speed.\n\nWhy the other choices fail: A parachute does not remove gravity or mass.' }
  - id: dt7
    title: Velocity-Time Graph
    content: 'A falling object''s velocity-time graph approaches a horizontal terminal-speed asymptote as drag increases.'
    media: []
    check: { id: dtc7, type: multipleChoice, prompt: 'A horizontal segment on a velocity-time graph indicates:', choices: [{ id: a, text: constant velocity }, { id: b, text: increasing acceleration }, { id: c, text: zero time }, { id: d, text: increasing mass }], answer: { choiceId: a }, explanation: 'Solution: Constant velocity.\n\nWhy it works: Slope is acceleration, and horizontal slope is zero.\n\nWhy the other choices fail: Terminal speed has nonzero velocity but zero acceleration.' }
