sections:
- id: drag-force
  title: Drag Force
  content: 'When an object moves through a fluid (like air or water), the fluid exerts
    a resistive force on the object called the **drag force** ($F_D$). This force
    always acts opposite to the direction of motion.


    For relatively fast-moving macroscopic objects in air, the drag force is often
    modeled as being proportional to the *square* of the speed:

    $$ F_D = \frac{1}{2} C \rho A v^2 $$

    * $C$ = drag coefficient (depends on shape)

    * $\rho$ = density of the fluid

    * $A$ = cross-sectional area

    * $v$ = speed of the object


    For simplicity, we sometimes write this as $F_D = k v^2$ (or $F_D = bv$ for very
    slow-moving or tiny objects).

    '
- id: terminal-speed
  title: Terminal Speed
  content: 'Consider an object falling from the sky. Initially, its speed is $v=0$,
    so the drag force is zero. It accelerates downward due to gravity at $9.8$ m/s².


    As its speed increases, the upward drag force $F_D$ also increases. This reduces
    the net downward force, so the downward acceleration decreases.


    Eventually, the object reaches a speed where the upward drag force exactly equals
    the downward force of gravity:

    $$ F_D = F_g \implies \frac{1}{2} C \rho A v_t^2 = mg $$


    At this point, the net force is zero, so acceleration is zero. The object no longer
    speeds up. It has reached its **terminal speed** ($v_t$).


    $$ v_t = \sqrt{\frac{2mg}{C \rho A}} $$

    '
- id: graphical-representation
  title: Velocity vs. Time Graph
  content: 'The graph of velocity vs. time for an object falling with air resistance
    shows an initial steep slope (representing $g$), which gradually flattens out
    as the velocity asymptotically approaches the terminal speed $v_t$.


    ![Terminal Velocity Graph](/media/physics/terminal-velocity-graph.svg)

    '
lesson:
  introduction: Drag Force and Terminal Speed
  sections:
  - id: sec-q001
    title: A skydiver is falling at terminal speed. What is the net force acting on
      the skydiver?
    content: |
      A skydiver is falling at terminal speed. What is the net force acting on the skydiver?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: Zero
      - id: b
        text: Upward, equal to the drag force
      - id: c
        text: Downward, equal to the skydiver's weight
      - id: d
        text: Downward, equal to the weight minus the drag force
      answer:
        choiceId: a
      explanation: |
        "Terminal speed" means the speed is constant (acceleration is zero). According to Newton's Second Law ($\sum F = ma$), if acceleration is zero, the net force must be zero. The upward drag force exactly balances the downward gravitational force.
