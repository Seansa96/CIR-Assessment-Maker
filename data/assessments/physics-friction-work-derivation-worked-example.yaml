workedExamples:
- id: ex-friction-work
  title: Nonconservative Work by Friction
  problem: |
    Let's derive the work done by kinetic friction ($W_f = -f_k d$) over a straight-line distance $d$.
  steps:
  - id: step-1
    title: Step 1 — Vector Dot Product
    instruction: |
      Start with the work dot product $dW = \vec f_k \cdot d\vec r$.
      Kinetic friction always points exactly opposite to the microscopic displacement $d\vec r$.
    type: multipleChoice
    prompt: What is the angle $\theta$ between the kinetic friction vector and the displacement vector?
    choices:
    - id: a
      text: $0^\circ$
    - id: b
      text: $90^\circ$
    - id: c
      text: $180^\circ$
    answer:
      choiceId: c
    explanation: Friction opposes motion, so it points perfectly opposite to displacement ($180^\circ$). The cosine of $180^\circ$ is $-1$.
  - id: step-2
    title: Step 2 — Integration
    instruction: |
      Because $\cos(180^\circ) = -1$, the dot product becomes $dW = -f_k \, |d\vec r| = -f_k \, ds$.
      We integrate this from $s=0$ to $s=d$. Since the normal force is constant, $f_k = \mu_k N$ is constant.
    type: symbolicResponse
    prompt: Evaluate the integral $\int_0^d -f_k \, ds$. What is $W_f$?
    answer:
      gradingMode: auto
      expectedLatex: -f_k d
      equivalenceMode: expression
      tolerance: 0
    explanation: Pulling $-f_k$ out of the integral leaves $\int ds = d$. So $W_f = -f_k d$. This negative work drains mechanical energy from the system.
