        Solution: During name the model and quantities for Energy and Momentum of EM Waves, first use perpendicular field directions to find energy-flow direction and evaluate the Poynting magnitude. Then apply S = (1/mu_0) E cross B with one consistent coordinate system and solve for the requested quantity.


        Why it works: S = (1/mu_0) E cross B connects the named physical quantities only after their signs, directions, and constraints are defined.


