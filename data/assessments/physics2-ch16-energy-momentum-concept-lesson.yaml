lesson:
  introduction: >
    This lesson develops a repeatable way to solve Energy and Momentum of EM Waves problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch16-energy-momentum-s1
    title: Name the model and quantities
    required: true
    content: >
      Energy and Momentum of EM Waves uses S = (1/mu_0) E cross B. In the name the model and quantities stage, use perpendicular field directions to find energy-flow direction and evaluate the Poynting magnitude.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Energy and Momentum of EM Waves problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch16-energy-momentum-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Energy and Momentum of EM Waves, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use S = (1/mu_0) E cross B after you use perpendicular field directions to find energy-flow direction and evaluate the Poynting magnitude.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Energy and Momentum of EM Waves problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-energy-momentum-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables S = (1/mu_0) E cross B relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-energy-momentum-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Energy and Momentum of EM Waves.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-energy-momentum-units-error
          domains:
          - physics-2
