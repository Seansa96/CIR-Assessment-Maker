id: physics2-ch16-energy-momentum-concept-lesson
title: Energy and Momentum of EM Waves
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electromagnetic-waves
workedExamples:
- id: l3-sec1
  title: Poynting Vector
  explanation: 'The rate of energy transport per unit area (intensity) is described
    by the Poynting vector: $\vec{S} = \frac{1}{\mu_0} \vec{E} \times \vec{B}$. The
    time-averaged intensity is $I = \frac{1}{2c\mu_0} E_{max}^2$.'
- id: l3-sec2
  title: Radiation Pressure
  explanation: EM waves carry momentum. When they strike a surface, they exert radiation
    pressure. For complete absorption, $P = I/c$. For complete reflection, $P = 2I/c$.
