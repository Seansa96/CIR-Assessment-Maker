questions:
- id: q001
  type: multipleChoice
  prompt: 'What is the logical negation of the formal definition of limits: $\forall \epsilon > 0, \exists \delta
    > 0, \forall x \ (0 < |x - c| < \delta \implies |f(x) - L| < \epsilon)$?'
  choices:
  - id: a
    text: '$\exists \epsilon > 0, \forall \delta > 0, \exists x \ (0 < |x - c| < \delta \land |f(x) - L| \ge \epsilon)$'
  - id: b
    text: '$\exists \epsilon \le 0, \forall \delta \le 0, \exists x \ (0 < |x - c| < \delta \implies |f(x) - L|
      \ge \epsilon)$'
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: '$\exists \epsilon > 0, \forall \delta > 0, \exists x \ (0 < |x - c| < \delta \implies |f(x) - L| \ge
      \epsilon)$'
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: '$\exists \epsilon > 0, \exists \delta > 0, \exists x \ (0 < |x - c| < \delta \land |f(x) - L| \ge \epsilon)$'
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  - errorDiagnosis
  difficultyEvidence: Sequentially negates three nested quantifiers and correctly negates the inner implication
    into a conjunction.
  explanation: |-
    Solution: $\\exists \\epsilon > 0, \\forall \\delta > 0, \\exists x \\ (0 < |x - c| < \\delta \\land |f(x) - L| \\ge \\epsilon)$
    Why it works: Negating the statement flips each quantifier ($\\forall \\to \\exists$, $\\exists \\to \\forall$). The domain conditions ($> 0$) remain unchanged. Finally, the implication $P \\implies Q$ is negated to $P \\land \\neg Q$.
    Why the other choices fail: B incorrectly negates the domain bounds (e.g., changing $>0$ to $\\le 0$). C fails to negate the implication into a conjunction. D fails to flip the $\\exists \\delta$ quantifier.
- id: q002
  type: multipleChoice
  prompt: 'Consider the statement $\neg (\forall x \in A, \exists y \in B, P(x, y))$. Which of the following is
    logically equivalent?'
  choices:
  - id: a
    text: '$\exists x \in A, \forall y \in B, \neg P(x, y)$'
  - id: b
    text: '$\exists x \notin A, \forall y \notin B, \neg P(x, y)$'
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: '$\forall x \in A, \exists y \in B, \neg P(x, y)$'
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: '$\exists x \in A, \exists y \in B, \neg P(x, y)$'
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  - logicalEquivalence
  difficultyEvidence: Applies generalized De Morgan's laws for quantifiers, recognizing that domain constraints
    are not negated.
  explanation: |-
    Solution: $\\exists x \\in A, \\forall y \\in B, \\neg P(x, y)$
    Why it works: Pushing the negation inward flips the universal quantifier to an existential one and vice-versa, and finally negates the predicate $P$. The domains ($x \\in A, y \\in B$) specify what we are quantifying over and are not negated.
    Why the other choices fail: B incorrectly negates the domains of the variables. C fails to flip the quantifiers. D incorrectly changes both quantifiers to existential.
- id: q003
  type: multipleChoice
  prompt: A student proposes that the negation of 'For every integer $n$, if $n$ is prime then $n$ is odd' is 'There
    exists an integer $n$ such that $n$ is not prime and $n$ is odd'. What is the error?
  choices:
  - id: a
    text: The student negated the hypothesis and kept the conclusion, instead of keeping the hypothesis and negating
      the conclusion.
  - id: b
    text: The student changed the universal quantifier to an existential quantifier.
    issueSignals:
    - id: errorDiagnosis
  - id: c
    text: The student should have written 'If $n$ is not prime, then $n$ is not odd'.
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: The original statement is false, so it cannot be negated.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: errorDiagnosis
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - logicalNegation
  difficultyEvidence: Diagnoses a specific failure mode in negating a universally quantified implication.
  explanation: |-
    Solution: The student negated the hypothesis and kept the conclusion, instead of keeping the hypothesis and negating the conclusion.
    Why it works: The negation of $\\forall n (P(n) \\implies Q(n))$ is $\\exists n (P(n) \\land \\neg Q(n))$. The student wrote $\\exists n (\\neg P(n) \\land Q(n))$. They should have written 'There exists an integer $n$ such that $n$ is prime and $n$ is not odd'.
    Why the other choices fail: B points to an action the student *correctly* performed. C suggests the student should have formed the inverse, which is not the negation. D misunderstands logic; any statement can be negated regardless of its truth value.
- id: q004
  type: multipleChoice
  prompt: 'Translate the formal statement $\forall x \ (S(x) \implies \exists y \ (T(y) \land R(x,y)))$ into plain
    English. Let $S(x)$ mean ''$x$ is a student'', $T(y)$ mean ''$y$ is a teacher'', and $R(x,y)$ mean ''$x$ respects
    $y$''.'
  choices:
  - id: a
    text: Every student respects at least one teacher.
  - id: b
    text: There is a teacher who is respected by every student.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: Every student is respected by at least one teacher.
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: If someone is a teacher, they respect at least one student.
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - representationTransfer
  - quantifierScope
  - errorDiagnosis
  difficultyEvidence: Translates nested quantifiers combined with an implication into natural mathematical English
    without losing dependency order.
  explanation: |-
    Solution: Every student respects at least one teacher.
    Why it works: '$\\forall x (S(x) \\implies ...)$' translates to 'For every student...'. The inner part '$\\exists y (T(y) \\land R(x,y))$' translates to 'there is a teacher such that the student respects the teacher'. Combined, this is 'Every student respects at least one teacher'.
    Why the other choices fail: B swaps the quantifier order ($\\exists y \\forall x$). C reverses the relation $R(x,y)$ (teacher respects student). D swaps the roles of student and teacher in the main implication.
