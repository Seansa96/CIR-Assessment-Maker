questions:
- id: q001
  type: multipleChoice
  prompt: 'What is the logical negation of the formal definition of limits: $\forall \epsilon > 0, \exists \delta
    > 0, \forall x \ (0 < |x - c| < \delta \implies |f(x) - L| < \epsilon)$?'
  choices:
  - id: a
    text: $\exists \epsilon > 0, \forall \delta > 0, \exists x \ (0 < |x - c| < \delta \land |f(x) - L| \ge \epsilon)$
  - id: b
    text: $\exists \epsilon \le 0, \forall \delta \le 0, \exists x \ (0 < |x - c| < \delta \implies |f(x) - L| \ge
      \epsilon)$
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: $\exists \epsilon > 0, \forall \delta > 0, \exists x \ (0 < |x - c| < \delta \implies |f(x) - L| \ge \epsilon)$
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: $\exists \epsilon > 0, \exists \delta > 0, \exists x \ (0 < |x - c| < \delta \land |f(x) - L| \ge \epsilon)$
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  - errorDiagnosis
  difficultyEvidence: Sequentially negates three nested quantifiers and correctly negates the inner implication
    into a conjunction.
  explanation: 'Solution: $\\exists \\epsilon > 0, \\forall \\delta > 0, \\exists x \\ (0 < |x - c| < \\delta \\land
    |f(x) - L| \\ge \\epsilon)$

    Why it works: Negating the statement flips each quantifier ($\\forall \\to \\exists$, $\\exists \\to \\forall$).
    The domain conditions ($> 0$) remain unchanged. Finally, the implication $P \\implies Q$ is negated to $P \\land
    \\neg Q$.

    Why the other choices fail: B incorrectly negates the domain bounds (e.g., changing $>0$ to $\\le 0$). C fails
    to negate the implication into a conjunction. D fails to flip the $\\exists \\delta$ quantifier.'
  prerequisiteObjectiveIds:
  - ml-logic-02
- id: q002
  type: multipleChoice
  prompt: Consider the statement $\neg (\forall x \in A, \exists y \in B, P(x, y))$. Which of the following is logically
    equivalent?
  choices:
  - id: a
    text: $\exists x \in A, \forall y \in B, \neg P(x, y)$
  - id: b
    text: $\exists x \notin A, \forall y \notin B, \neg P(x, y)$
    issueSignals:
    - id: logical-negation-error
  - id: c
    text: $\forall x \in A, \exists y \in B, \neg P(x, y)$
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: $\exists x \in A, \exists y \in B, \neg P(x, y)$
    issueSignals:
    - id: quantifier-scope-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-negation-error
  difficultyDimensions:
  - representationTransfer
  - logicalNegation
  - logicalEquivalence
  difficultyEvidence: Applies generalized De Morgan's laws for quantifiers, recognizing that domain constraints
    are not negated.
  explanation: 'Solution: $\\exists x \\in A, \\forall y \\in B, \\neg P(x, y)$

    Why it works: Pushing the negation inward flips the universal quantifier to an existential one and vice-versa,
    and finally negates the predicate $P$. The domains ($x \\in A, y \\in B$) specify what we are quantifying over
    and are not negated.

    Why the other choices fail: B incorrectly negates the domains of the variables. C fails to flip the quantifiers.
    D incorrectly changes both quantifiers to existential.'
  prerequisiteObjectiveIds:
  - ml-logic-02
- id: q003
  type: multipleChoice
  prompt: A student proposes that the negation of 'For every integer $n$, if $n$ is prime then $n$ is odd' is 'There
    exists an integer $n$ such that $n$ is not prime and $n$ is odd'. What is the error?
  choices:
  - id: a
    text: The student negated the hypothesis and kept the conclusion, instead of keeping the hypothesis and negating
      the conclusion.
  - id: b
    text: The student changed the universal quantifier to an existential quantifier.
    issueSignals:
    - id: errorDiagnosis
  - id: c
    text: The student should have written 'If $n$ is not prime, then $n$ is not odd'.
    issueSignals:
    - id: logical-negation-error
  - id: d
    text: The original statement is false, so it cannot be negated.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: errorDiagnosis
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - logicalNegation
  difficultyEvidence: Diagnoses a specific failure mode in negating a universally quantified implication.
  explanation: 'Solution: The student negated the hypothesis and kept the conclusion, instead of keeping the hypothesis
    and negating the conclusion.

    Why it works: The negation of $\\forall n (P(n) \\implies Q(n))$ is $\\exists n (P(n) \\land \\neg Q(n))$. The
    student wrote $\\exists n (\\neg P(n) \\land Q(n))$. They should have written ''There exists an integer $n$
    such that $n$ is prime and $n$ is not odd''.

    Why the other choices fail: B points to an action the student *correctly* performed. C suggests the student
    should have formed the inverse, which is not the negation. D misunderstands logic; any statement can be negated
    regardless of its truth value.'
  prerequisiteObjectiveIds:
  - ml-logic-02
- id: q004
  type: multipleChoice
  prompt: Translate the formal statement $\forall x \ (S(x) \implies \exists y \ (T(y) \land R(x,y)))$ into plain
    English. Let $S(x)$ mean '$x$ is a student', $T(y)$ mean '$y$ is a teacher', and $R(x,y)$ mean '$x$ respects
    $y$'.
  choices:
  - id: a
    text: Every student respects at least one teacher.
  - id: b
    text: There is a teacher who is respected by every student.
    issueSignals:
    - id: quantifier-scope-error
  - id: c
    text: Every student is respected by at least one teacher.
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: If someone is a teacher, they respect at least one student.
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-scope-error
  difficultyDimensions:
  - representationTransfer
  - quantifierScope
  - errorDiagnosis
  difficultyEvidence: Translates nested quantifiers combined with an implication into natural mathematical English
    without losing dependency order.
  explanation: 'Solution: Every student respects at least one teacher.

    Why it works: ''$\\forall x (S(x) \\implies ...)$'' translates to ''For every student...''. The inner part ''$\\exists
    y (T(y) \\land R(x,y))$'' translates to ''there is a teacher such that the student respects the teacher''. Combined,
    this is ''Every student respects at least one teacher''.

    Why the other choices fail: B swaps the quantifier order ($\\exists y \\forall x$). C reverses the relation
    $R(x,y)$ (teacher respects student). D swaps the roles of student and teacher in the main implication.'
  prerequisiteObjectiveIds:
  - ml-logic-02
- id: q005
  type: multipleChoice
  prompt: Let P mean “n is divisible by 2” and Q mean “n is divisible by 3.” Which statement negates “P and Q”?
  choices:
  - id: a
    text: n is not divisible by 2 or n is not divisible by 3.
  - id: b
    text: n is not divisible by 2 and n is not divisible by 3.
    issueSignals:
    - id: demorgan-connector-error
  - id: c
    text: n is divisible by 2 or n is divisible by 3.
    issueSignals:
    - id: predicates-not-negated
  - id: d
    text: n is prime and not divisible by 2 or 3.
    issueSignals:
    - id: unsupported-condition-added
  answer:
    choiceId: a
  issueSignals:
  - id: demorgan-connector-error
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  - reverseReasoning
  difficultyEvidence: Applies De Morgan's law to a concrete conjunction while preserving the meaning of both component
    predicates.
  prerequisiteObjectiveIds:
  - ml-logic-02
  explanation: 'Solution: The negation is “not P or not Q.”

    Why it works: A conjunction fails as soon as either required component fails.

    Why the other choices fail: B keeps the connector, C leaves both predicates positive, and D adds a new property.'
- id: q006
  type: multipleChoice
  prompt: Let P mean “a is positive” and Q mean “b is positive.” Which is equivalent to not (P or Q)?
  choices:
  - id: a
    text: a is not positive and b is not positive.
  - id: b
    text: a is not positive or b is not positive.
    issueSignals:
    - id: demorgan-connector-error
  - id: c
    text: a is positive and b is positive.
    issueSignals:
    - id: predicates-not-negated
  - id: d
    text: a and b have opposite signs.
    issueSignals:
    - id: informal-restatement-overreach
  answer:
    choiceId: a
  issueSignals:
  - id: demorgan-connector-error
  difficultyDimensions:
  - representationTransfer
  - reverseReasoning
  - errorDiagnosis
  difficultyEvidence: Reverses a disjunction under negation and distinguishes the resulting conjunction from an
    informal sign claim.
  prerequisiteObjectiveIds:
  - ml-logic-02
  explanation: 'Solution: Neither P nor Q holds, so both a and b are not positive.

    Why it works: De Morgan''s law changes “not (P or Q)” to “not P and not Q.”

    Why the other choices fail: B retains or, C removes the outer negation, and D allows one positive number.'
- id: q007
  type: multipleChoice
  prompt: Which sentence correctly translates “Every integer has an integer greater than it”?
  choices:
  - id: a
    text: $\forall n\in\mathbb Z\;\exists m\in\mathbb Z\;(m>n)$
  - id: b
    text: $\exists m\in\mathbb Z\;\forall n\in\mathbb Z\;(m>n)$
    issueSignals:
    - id: quantifier-order-reversed
  - id: c
    text: $\forall n\in\mathbb Z\;\forall m\in\mathbb Z\;(m>n)$
    issueSignals:
    - id: existential-replaced-by-universal
  - id: d
    text: $\exists n\in\mathbb Z\;\exists m\in\mathbb Z\;(m>n)$
    issueSignals:
    - id: universal-weakened-to-existential
  answer:
    choiceId: a
  issueSignals:
  - id: quantifier-order-reversed
  difficultyDimensions:
  - quantifierScope
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Preserves the dependency of the greater integer on each chosen input integer.
  prerequisiteObjectiveIds:
  - ml-logic-02
  explanation: 'Solution: Use “for every n, there exists m” with m greater than n.

    Why it works: A different m may be selected after each n is given.

    Why the other choices fail: B demands an impossible largest integer, C makes every pair ordered the same way,
    and D proves only one pair exists.'
- id: q008
  type: multipleChoice
  prompt: What is the negation of “For every integer n, if n is even, then n+1 is odd”?
  choices:
  - id: a
    text: There exists an integer n that is even and whose n+1 is not odd.
  - id: b
    text: There exists an integer n that is not even and whose n+1 is odd.
    issueSignals:
    - id: implication-negation-hypothesis-negated
  - id: c
    text: Every even integer has an n+1 that is not odd.
    issueSignals:
    - id: universal-negation-overstated
  - id: d
    text: There exists an integer n such that n+1 is odd.
    issueSignals:
    - id: hypothesis-dropped-in-negation
  answer:
    choiceId: a
  issueSignals:
  - id: implication-negation-hypothesis-negated
  difficultyDimensions:
  - quantifierScope
  - reverseReasoning
  - errorDiagnosis
  difficultyEvidence: Negates a universal conditional by retaining the hypothesis and denying the conclusion for
    one counterexample.
  prerequisiteObjectiveIds:
  - ml-logic-02
  explanation: 'Solution: A supplies an even integer for which the claimed conclusion fails.

    Why it works: The negation of “for all n, P implies Q” is “there exists n with P and not Q.”

    Why the other choices fail: B negates P, C keeps the universal quantifier, and D omits the necessary hypothesis.'
- id: q009
  type: multipleChoice
  prompt: Which situation makes the conditional “If n is divisible by 4, then n is even” false?
  choices:
  - id: a
    text: n is divisible by 4 but n is not even.
  - id: b
    text: n is not divisible by 4 but n is even.
    issueSignals:
    - id: converse-counterexample-confused
  - id: c
    text: n is divisible by 4 and n is even.
    issueSignals:
    - id: conditional-satisfied-called-false
  - id: d
    text: n is not divisible by 4 and n is not even.
    issueSignals:
    - id: false-hypothesis-called-counterexample
  answer:
    choiceId: a
  issueSignals:
  - id: conditional-truth-table-error
  difficultyDimensions:
  - definitionApplication
  - errorDiagnosis
  - reverseReasoning
  difficultyEvidence: Applies the unique false conditional case to distinguish a direct counterexample from an irrelevant
    converse case.
  prerequisiteObjectiveIds:
  - ml-logic-02
  explanation: 'Solution: A is the only form that would refute the conditional.

    Why it works: A conditional is false exactly when its hypothesis is true and conclusion false.

    Why the other choices fail: B has a false hypothesis, C satisfies the claim, and D also lacks the hypothesis.'
- id: q010
  type: multipleChoice
  prompt: Which claim is the converse of “If a number is prime, then it has exactly two positive divisors”?
  choices:
  - id: a
    text: If a number has exactly two positive divisors, then it is prime.
  - id: b
    text: If a number is not prime, then it does not have exactly two positive divisors.
    issueSignals:
    - id: contrapositive-called-converse
  - id: c
    text: If a number is prime, then it does not have exactly two positive divisors.
    issueSignals:
    - id: conclusion-negated-without-reversal
  - id: d
    text: Every number with two divisors is even.
    issueSignals:
    - id: predicate-replaced
  answer:
    choiceId: a
  issueSignals:
  - id: contrapositive-called-converse
  difficultyDimensions:
  - representationTransfer
  - reverseReasoning
  - errorDiagnosis
  difficultyEvidence: Reverses the hypothesis and conclusion without applying the separate negation operation used
    for a contrapositive.
  prerequisiteObjectiveIds:
  - ml-logic-02
  explanation: 'Solution: The converse reverses the two clauses.

    Why it works: The original has prime as hypothesis and two divisors as conclusion; the converse swaps their
    positions.

    Why the other choices fail: B is the contrapositive, C changes only truth polarity, and D replaces the theorem''s
    property.'
