  prompt: |
    The sequence $a_n=H_n-\ln n$ converges to Euler's constant $\gamma$.
    Which related series therefore converges to $\gamma$?
  choices:
  - id: a
    text: |-
      $1+\sum_{n=2}^{\infty}[1/n-\ln(1+1/(n-1))]$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}1/n$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}\ln(1+1/n)$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}(H_n-\ln n)$
  answer:
    choiceId: a
  explanation: |-
    Solution: The Nth partial sum of the first expression is $H_N-\ln N$, since the logarithms telescope. Therefore the answer is $1+\sum_{n=2}^{\infty}[1/n-\ln(1+1/(n-1))]$.

    Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

    Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

    Why the other choices fail: $\sum_{n=1}^{\infty}1/n$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $\sum_{n=1}^{\infty}\ln(1+1/n)$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $\sum_{n=1}^{\infty}(H_n-\ln n)$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
