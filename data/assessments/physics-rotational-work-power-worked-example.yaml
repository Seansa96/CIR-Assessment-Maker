workedExamples:
- id: we-rot-work-1
  title: Motor Output Power
  problem: An electric motor delivers a constant torque of $50 \text{ N}\cdot\text{m}$
    to a drive shaft. The shaft accelerates from rest to $120 \text{ rad/s}$ in $4.0
    \text{ s}$. Calculate the total work done by the motor and the average power.
  steps:
  - id: we-rot-work-1-step1
    title: 'Step 1: Calculate Displacement'
    instruction: Find the angular displacement $\theta$ during the acceleration.
    prompt: What is $\theta$ in radians?
    type: numericResponse
    answer:
      value: 240
      tolerance: 1
    explanation: |
      Solution: $\alpha=120/4=30$ rad/s$^2$, then $\theta=\tfrac12\alpha t^2=\tfrac12(30)(4)^2=240$ rad.

      Why it works: Uniform angular acceleration from rest gives angular displacement from the rotational constant-acceleration relation.
  - id: we-rot-work-1-step2
    title: 'Step 2: Work and Power'
    instruction: Calculate $W = \tau \theta$ and $P_{avg} = \frac{W}{t}$.
    prompt: What is the average power in Watts?
    type: numericResponse
    answer:
      value: 3000
      tolerance: 1
    explanation: |
      Solution: $W=\tau\theta=(50)(240)=12000$ J and $P_{avg}=W/t=12000/4=3000$ W.

      Why it works: Constant torque does work through angular displacement, and average power is work per elapsed time.

- id: rotational-work-power-we002
  title: Power at a Given Speed
  problem: 'A winch delivers $30\ \mathrm{N\,m}$ of torque while turning at $8.0\ \mathrm{rad/s}$. Find its output power.'
  steps:
  - id: rwpwe3
    title: Apply rotational power
    instruction: Use $P=\tau\omega$.
    prompt: 'What output power does the winch deliver in watts?'
    type: numericResponse
    answer: { value: 240, tolerance: 0.01 }
    explanation: 'Solution: $P=\tau\omega=(30)(8.0)=240\ \mathrm{W}$.\n\nWhy it works: Torque times angular speed is instantaneous rotational power.'
  - id: rwpwe4
    title: Find delivered energy
    instruction: Assume this power is constant for 15 s.
    prompt: 'How much energy is delivered in joules?'
    type: numericResponse
    answer: { value: 3600, tolerance: 0.1 }
    explanation: 'Solution: $E=Pt=(240)(15)=3600\ \mathrm{J}$.\n\nWhy it works: Constant power transfers energy at a fixed rate.'
