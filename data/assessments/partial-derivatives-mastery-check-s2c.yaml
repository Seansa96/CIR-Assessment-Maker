    text: $2xy$
  - id: b
    text: Skip directly to a final answer
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: Use an unrelated theorem
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: Reverse the givens
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
