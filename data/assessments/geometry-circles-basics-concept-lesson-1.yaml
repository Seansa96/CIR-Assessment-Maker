lesson:
  introduction: |-
    A circle is the set of all points in a plane that are at a given distance from a given point, the center. In this lesson, we will identify the fundamental parts of a circle.
  sections:
  - id: sec-radius-diameter
    title: Radius and Diameter
    required: true
    content: |-
      The **center** is the point exactly in the middle of a circle. A circle is usually named by its center (e.g., Circle $O$).
      
      A **radius** is a line segment from the center to any point on the edge of the circle. Plural is *radii*. All radii of the same circle are congruent.
      
      A **diameter** is a line segment that passes through the center and has both endpoints on the circle. It is exactly twice the length of the radius ($d = 2r$).

  - id: sec-chord-circumference
    title: Chords and Circumference
    required: true
    content: |-
      A **chord** is a line segment whose endpoints lie on the circle. Note that a diameter is just a special type of chord—it is the longest possible chord in any circle!
      
      The **circumference** is the total distance around the outside edge of the circle (the perimeter of the circle). The ratio of the circumference to the diameter of *any* circle is exactly $\pi$ (pi, approximately $3.14159$).
      
      Because $C/d = \pi$, we get the famous formula for circumference:
      $$C = \pi d \quad \text{or} \quad C = 2\pi r$$

questions:
- id: q-geom-circ-1
  title: Concept Check - Longest Chord
  prompt: |-
    What is the longest possible chord in a circle?
  type: multipleChoice
  choices:
  - id: c1
    text: The radius
  - id: c2
    text: The diameter
  - id: c3
    text: A tangent
  - id: c4
    text: A secant
  answer:
    choiceId: c2
  explanation: |-
    A **diameter** is a chord because both of its endpoints touch the circle. Because it passes perfectly through the center, it represents the maximum width of the circle, making it the longest possible chord.
  skills:
  - geometry-circles-basics

- id: q-geom-circ-2
  title: Concept Check - Circumference
  prompt: |-
    A circle has a radius of $5$ meters. What is its circumference?
  type: multipleChoice
  choices:
  - id: c1
    text: $5\pi$ meters
  - id: c2
    text: $10\pi$ meters
  - id: c3
    text: $25\pi$ meters
  answer:
    choiceId: c2
  explanation: |-
    The formula for circumference is $C = 2\pi r$.
    $$C = 2\pi(5) = 10\pi$$
  skills:
  - geometry-circles-basics
