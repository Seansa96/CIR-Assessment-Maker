questions:
- id: q001
  type: multipleChoice
  prompt: 'Which of the following defines a pure virtual function?

    '
  choices:
  - id: a
    text: '`virtual void calculate() = 0;`'
  - id: b
    text: '`void calculate() virtual = 0;`'
  - id: c
    text: '`pure virtual void calculate();`'
  - id: d
    text: '`virtual void calculate() {}`'
  answer:
    choiceId: a
  explanation: 'The `= 0` at the end of the declaration indicates that the function
    is pure virtual.

    '
- id: q002
  type: multipleChoice
  prompt: 'What happens if a class contains at least one pure virtual function?

    '
  choices:
  - id: a
    text: It becomes an abstract class and cannot be instantiated.
  - id: b
    text: It is considered a concrete class.
  - id: c
    text: It will fail to compile unless a destructor is provided.
  - id: d
    text: All of its member variables become private.
  answer:
    choiceId: a
  explanation: 'Abstract classes serve as interfaces or partial implementations and
    cannot be used to create objects directly.

    '
- id: q003
  type: multipleChoice
  prompt: 'You are overloading the equality operator `==` as a member function for
    a `Rectangle` class. Which signature is correct?

    '
  choices:
  - id: a
    text: '`bool operator==(const Rectangle& other) const;`'
  - id: b
    text: '`void operator==(Rectangle other);`'
  - id: c
    text: '`Rectangle operator==(const Rectangle& other);`'
  - id: d
    text: '`bool operator==(Rectangle a, Rectangle b);`'
  answer:
    choiceId: a
  explanation: 'Equality returns a `bool`, takes the other object as a `const` reference,
    and should be marked `const` since it doesn''t modify the object.

    '
- id: q004
  type: multipleChoice
  prompt: 'Why does overloading the stream insertion operator (`<<`) typically return
    `std::ostream&`?

    '
  choices:
  - id: a
    text: To allow chaining of multiple insertions like `cout << a << b;`.
  - id: b
    text: To prevent memory leaks.
  - id: c
    text: Because `std::cout` requires a return value to flush the buffer.
  - id: d
    text: Because it is a requirement of the `friend` keyword.
  answer:
    choiceId: a
  explanation: 'By returning the stream reference, the result of `cout << a` is `cout`,
    which can then be used by `<< b`.

    '
