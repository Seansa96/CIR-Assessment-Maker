modeDefault: practice
randomizeQuestions: false
lesson:
  introduction: |
    A Lewis structure tells you which atoms are connected. VSEPR turns that two-dimensional bookkeeping into a defensible three-dimensional prediction. The important habit is to make two names in order: first the arrangement of **all electron domains**, then the arrangement of **atoms only**.
  sections:
    - id: domain-count
      title: 'Step 1: Count electron domains at the center'
      required: true
      content: |
        An **electron domain** is one region of electron density around the central atom. Count one domain for each lone pair and one domain for each bond direction.

        A single, double, or triple bond still counts as **one** domain. Its order changes electron density and can affect an angle, but it does not add extra directions around the central atom.

        For example, the central carbon in $CO_2$ has two domains because its two C=O bonds point in two directions. The central sulfur in $SO_2$ has three domains: two S–O bond directions and one lone pair.
      media:
        - type: image
          src: /media/chemistry/vsepr-domain-workflow.svg
          alt: A VSEPR flow diagram showing that each bond direction and lone pair becomes one electron domain around the selected central atom.
          caption: Start at the atom whose shape is being named; do not count lone pairs on terminal atoms.
      check:
        id: chk-domain-count
        type: numericResponse
        prompt: 'Around the central carbon in $CO_2$, how many electron domains are present?'
        answer:
          value: 2
          tolerance: 0
        explanation: Each C=O double bond is one domain, so the central carbon has two domains.

    - id: electron-domain-geometry
      title: 'Step 2: Place every domain as far apart as possible'
      required: true
      content: |
        Electron domains repel one another. The least-crowded arrangements provide the starting geometry:

        | Domains | Electron-domain geometry | Ideal directions |
        |---|---|---|
        | 2 | linear | 180° |
        | 3 | trigonal planar | 120° |
        | 4 | tetrahedral | 109.5° |
        | 5 | trigonal bipyramidal | 90°, 120°, 180° |
        | 6 | octahedral | 90°, 180° |

        This is the **electron-domain geometry**. It includes bonding domains and lone-pair domains. It is not yet necessarily the molecular geometry.
      check:
        id: chk-electron-domain
        type: multipleChoice
        prompt: 'A central atom has five total electron domains. What is its electron-domain geometry?'
        choices:
          - id: a
            text: Tetrahedral
          - id: b
            text: Trigonal bipyramidal
          - id: c
            text: Square planar
          - id: d
            text: Octahedral
        answer:
          choiceId: b
        explanation: Five domains occupy a trigonal-bipyramidal electron-domain arrangement.

    - id: molecular-geometry
      title: 'Step 3: Name only the atom positions'
      required: true
      content: |
        **Molecular geometry** ignores the positions occupied by lone pairs. This distinction prevents a common error: ammonia has a tetrahedral electron-domain geometry, but its three hydrogen atoms form a trigonal pyramidal molecular geometry.

        In AXE notation, $A$ is the center, $X$ counts bonded atoms, and $E$ counts lone pairs on the center. Thus $NH_3$ is AX$_3$E: four total domains, but only three atom positions.

        The same subtraction produces other useful pairs: AX$_2$E is bent from a trigonal-planar starting arrangement, and AX$_2$E$_2$ is bent from a tetrahedral starting arrangement.
      media:
        - type: image
          src: /media/chemistry/vsepr-four-domain-family.svg
          alt: Comparison of methane, ammonia, and water showing the same four-domain starting arrangement and different molecular geometry after lone pairs are ignored.
          caption: Lone pairs occupy positions in the electron-domain arrangement but do not appear in the molecular-geometry name.
      check:
        id: chk-geometry-name
        type: multipleChoice
        prompt: 'Which pair correctly describes $NH_3$ around nitrogen?'
        choices:
          - id: a
            text: Linear electron-domain geometry; trigonal planar molecular geometry
          - id: b
            text: Tetrahedral electron-domain geometry; trigonal pyramidal molecular geometry
          - id: c
            text: Tetrahedral electron-domain geometry; tetrahedral molecular geometry
          - id: d
            text: Trigonal planar electron-domain geometry; bent molecular geometry
        answer:
          choiceId: b
        explanation: Nitrogen has three bonds and one lone pair. All four domains are tetrahedral, while the three atom positions are trigonal pyramidal.

    - id: two-three-domain-cases
      title: 'Step 4: Use the two- and three-domain families'
      required: true
      content: |
        With two domains, AX$_2$ has a linear electron-domain and molecular geometry. $CO_2$ is a useful reminder that a double bond is still one domain, so O=C=O is linear with an ideal 180° angle.

        With three domains, AX$_3$ is trigonal planar when all three positions hold atoms, as in $BF_3$. AX$_2$E is bent because one of the three positions is a lone pair, as in $SO_2$ or $O_3$.

        Do not call $SO_2$ trigonal planar merely because its three domains are trigonal planar. Its **electron-domain** geometry is trigonal planar; its **molecular** geometry is bent.
      check:
        id: chk-three-domain
        type: multipleChoice
        prompt: 'The central oxygen in ozone has two bonding domains and one lone pair. What is its molecular geometry?'
        choices:
          - id: a
            text: Linear
          - id: b
            text: Bent
          - id: c
            text: Trigonal planar
          - id: d
            text: Tetrahedral
        answer:
          choiceId: b
        explanation: Three total domains make a trigonal-planar electron-domain geometry, but AX$_2$E has a bent molecular geometry.

    - id: four-domain-cases
      title: 'Step 5: Use the four-domain family and refine angles'
      required: true
      content: |
        Four domains begin tetrahedrally. The familiar sequence is AX$_4$ tetrahedral, AX$_3$E trigonal pyramidal, and AX$_2$E$_2$ bent.

        The ideal tetrahedral angle is 109.5°. Lone pairs occupy more angular space than bonding domains, so they push neighboring bonds closer together. That explains the qualitative pattern $CH_4$ (109.5°), $NH_3$ (about 107°), and $H_2O$ (about 104.5°).

        Treat those values as model-based benchmarks, not universal values for every molecule with the same AXE label. For example, $H_2S$ is bent, but its experimental H–S–H angle is much closer to 92° than to water's angle.
      media:
        - type: image
          src: /media/chemistry/vsepr-four-domain-family.svg
          alt: Diagram comparing four-domain methane, ammonia, and water and showing progressive bond-angle compression from lone pairs.
          caption: The lone-pair count predicts the direction of the angle change; it does not license one exact angle for every element.
      check:
        id: chk-four-domain
        type: multipleChoice
        prompt: 'Which central-atom description gives a bent molecular geometry from a four-domain arrangement?'
        choices:
          - id: a
            text: AX$_4$
          - id: b
            text: AX$_3$E
          - id: c
            text: AX$_2$E$_2$
          - id: d
            text: AX$_2$
        answer:
          choiceId: c
        explanation: AX$_2$E$_2$ has four total domains but only two atom positions, giving a bent molecular geometry.

    - id: five-six-domain-cases
      title: 'Step 6: Handle five and six domains by position'
      required: true
      content: |
        Five domains make a trigonal bipyramid with two **axial** and three **equatorial** positions. An axial position has three 90° interactions; an equatorial position has two. A lone pair therefore prefers an equatorial position because that creates fewer close interactions.

        That positional rule explains AX$_4$E seesaw ($SF_4$), AX$_3$E$_2$ T-shaped ($ClF_3$), and AX$_2$E$_3$ linear ($XeF_2$). For six domains, all octahedral positions are equivalent; two lone pairs take opposite positions, leaving AX$_4$E$_2$ square planar ($XeF_4$).

        VSEPR is a geometric model. It can describe five- and six-domain main-group examples without relying on the outdated shortcut that expanded octets are caused by filling $d$ orbitals.
      media:
        - type: image
          src: /media/chemistry/vsepr-five-six-domain-map.svg
          alt: Diagram of axial and equatorial positions in a trigonal bipyramid and equivalent positions in an octahedron.
          caption: In a trigonal bipyramid, put a lone pair equatorial before naming the remaining atom positions.
      check:
        id: chk-five-domain
        type: multipleChoice
        prompt: 'Why does a lone pair in a trigonal-bipyramidal arrangement favor an equatorial site?'
        choices:
          - id: a
            text: It has no 90° interactions.
          - id: b
            text: It has two 90° interactions instead of the axial site's three.
          - id: c
            text: It makes every bond angle 120°.
          - id: d
            text: It converts the electron-domain geometry to octahedral.
        answer:
          choiceId: b
        explanation: Equatorial sites have fewer 90° interactions, so a more strongly repelling lone-pair domain is less crowded there.

    - id: angle-reasoning
      title: 'Step 7: Predict an angle with a stated level of precision'
      required: true
      content: |
        To estimate an angle $A$–$B$–$C$, analyze the **middle atom** $B$. Count its domains, choose the ideal angle from the electron-domain geometry, and then ask whether lone pairs or multiple bonds should change it.

        Lone pairs tend to compress adjacent bond angles. Multiple bonds count as one domain, but their higher electron density can also push neighboring domains away. Therefore a VSEPR answer is often best expressed as “near 120°,” “less than 109.5°,” or “near 90°,” unless measurements are supplied.

        This approach distinguishes a defensible prediction from an invented exact value.
      check:
        id: chk-angle-reasoning
        type: multipleChoice
        prompt: 'For an H–O–C angle, which atom determines the VSEPR starting angle?'
        choices:
          - id: a
            text: H, because it appears first
          - id: b
            text: O, because it is the middle atom
          - id: c
            text: C, because it usually forms more bonds
          - id: d
            text: All three atoms equally
        answer:
          choiceId: b
        explanation: The middle atom is the vertex of the angle. Count domains around O, then refine the tetrahedral ideal for its lone pairs.

    - id: multi-center-transfer
      title: 'Step 8: Repeat the workflow at every local center'
      required: true
      content: |
        Larger molecules can have several local geometries. Analyze one central atom at a time instead of assigning one shape to an entire formula.

        In $CH_3COOH$, the methyl carbon has four bonding domains and is tetrahedral. The carbonyl carbon has three domains, because C=O is one domain, and is trigonal planar. The hydroxyl oxygen has two bonding domains plus two lone pairs, so it has tetrahedral electron-domain geometry and bent molecular geometry.

        The transferable checklist is: identify the local center, draw or inspect its Lewis environment, count domains, name both geometries, then state only the angle precision the model supports.
      media:
        - type: image
          src: /media/chemistry/vsepr-domain-workflow.svg
          alt: VSEPR workflow diagram emphasizing that domain counting begins at one selected central atom.
          caption: A multi-center molecule is several local VSEPR problems, not one global geometry label.
      check:
        id: chk-multicenter
        type: selectAll
        prompt: 'In $CH_3COOH$, which local geometry statements are correct? Select all that apply.'
        choices:
          - id: a
            text: The methyl carbon is tetrahedral.
          - id: b
            text: The carbonyl carbon is trigonal planar.
          - id: c
            text: The hydroxyl oxygen has a bent molecular geometry.
          - id: d
            text: The whole molecule has one electron-domain geometry.
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: Each local center has its own domain count and geometry; a multi-center molecule does not have one single VSEPR label.
