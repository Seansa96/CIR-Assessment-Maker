      explanation: 'Solution: Ozone is bent at its central oxygen. Why it works: AX$_2$E has three total domains but only two atom positions. Why the other choices fail: Linear ignores the lone pair; trigonal planar names all three domains rather than atoms only; tetrahedral requires four domains.'
