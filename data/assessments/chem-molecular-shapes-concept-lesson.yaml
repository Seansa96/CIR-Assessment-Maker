lesson:
  introduction: A Lewis structure supplies the electron inventory. VSEPR turns that inventory into a local three-dimensional prediction by counting domains, arranging all domains, and then naming only the atom positions.
  sections:
  - id: domain-count
    title: 'Step 1: Count electron domains at the selected center'
    required: true
    content: Each bond direction counts as one domain, whether the bond is single, double, or triple. Each lone pair on the selected central atom also counts once. Do not count lone pairs on terminal atoms.
    media:
    - type: image
      src: /media/chemistry/vsepr-domain-workflow.svg
      alt: Four-stage VSEPR workflow from Lewis structure through domain counting to both geometry names.
      caption: Count directions and central lone pairs before naming a shape.
    check:
      id: chk-domain-count
      type: numericResponse
      prompt: Around the central carbon in $CO_2$, how many electron domains are present?
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 2
        tolerance: 0
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Carbon has 2 electron domains. Why it works: Each C=O bond points in one direction and counts as one domain; bond order does not create an extra direction.'
