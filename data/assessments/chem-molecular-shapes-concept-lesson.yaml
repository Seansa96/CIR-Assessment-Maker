  - id: multi-center-transfer
    title: 'Step 8: Repeat the workflow at every local center'
    required: true
    content: A larger molecule does not have one global VSEPR label. Select one center at a time, count its local domains, name both geometries, and repeat. In acetic acid, the methyl carbon is tetrahedral, the carbonyl carbon is trigonal planar, and the hydroxyl oxygen is bent.
    media:
    - type: image
      src: /media/chemistry/vsepr-multicenter-map.svg
      alt: Acetic acid structural map with separate geometry callouts at the methyl carbon
      caption: Treat a multicenter molecule as several local VSEPR problems.
    check:
      id: chk-multicenter
      type: selectAll
      prompt: In $CH_3COOH$, which local molecular-geometry statements are correct?
      choices:
      - id: a
        text: The methyl carbon is tetrahedral.
        media: []
        issueSignals: []
      - id: b
        text: The carbonyl carbon is trigonal planar.
        media: []
        issueSignals: []
      - id: c
        text: The hydroxyl oxygen is bent.
        media: []
        issueSignals: []
      - id: d
        text: The entire molecule has one electron-domain geometry.
        media: []
        issueSignals:
        - id: chemistry-vsepr-multicenter-error
          domains: []
      answer:
        choiceId: 
        choiceIds:
        - a
        - b
        - c
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Select a, b, and c. Why it works: The three centers have four, three, and four local domains respectively, with the oxygen carrying two lone pairs. Why the other choices fail: d assigns one global label even though VSEPR geometry is defined around a selected center.'
