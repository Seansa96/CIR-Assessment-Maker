  - id: five-six-domain-cases
    title: 'Step 6: Position lone pairs in five and six domains'
    required: true
    content: In a trigonal bipyramid, an equatorial site has two 90-degree interactions while an axial site has three, so lone pairs occupy equatorial sites first. In an octahedron all sites are initially equivalent; two lone pairs minimize repulsion by occupying opposite positions.
    media:
    - type: image
      src: /media/chemistry/vsepr-five-six-domain-map.svg
      alt: Spatial overview of axial and equatorial positions in five domains and opposite positions in six domains.
      caption: Position lone pairs before naming the remaining atoms.
    - type: image
      src: /media/chemistry/vsepr-five-domain-family.svg
      alt: Five-domain family showing seesaw
      caption: Equatorial lone-pair placement generates the five-domain molecular family.
    - type: image
      src: /media/chemistry/vsepr-six-domain-family.svg
      alt: Six-domain family showing octahedral
      caption: Opposite lone pairs leave a square plane in AX4E2.
    check:
      id: chk-five-domain
      type: multipleChoice
      prompt: Why does a lone pair in a trigonal-bipyramidal arrangement favor an equatorial site?
      choices:
      - id: a
        text: It has no 90-degree interactions.
        media: []
        issueSignals:
        - id: chemistry-vsepr-lone-pair-position-error
          domains: []
      - id: b
        text: It has two 90-degree interactions instead of three.
        media: []
        issueSignals: []
      - id: c
        text: It makes every angle 120 degrees.
        media: []
        issueSignals:
        - id: chemistry-vsepr-lone-pair-position-error
          domains: []
      - id: d
        text: It converts the arrangement to octahedral.
        media: []
        issueSignals:
        - id: chemistry-vsepr-geometry-name-confusion
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: "Solution: An equatorial site has two 90-degree interactions instead of an axial site's three. Why it works: The larger lone-pair domain is most stable where close interactions are fewer. Why the other choices fail: Equatorial sites still have two 90-degree interactions; not every angle becomes 120 degrees; occupying a site does not change the five-domain family."
