  - id: angle-reasoning
    title: 'Step 7: State only the angle precision the model supports'
    required: true
    content: For an angle A-B-C, analyze the middle atom B. Start from its ideal electron-domain angle, then predict qualitative compression or expansion from lone pairs and unequal bond-domain density. Do not invent an exact measured value.
    media:
    - type: image
      src: /media/chemistry/vsepr-angle-distortion.svg
      alt: Bond-angle reasoning diagram centered on the middle atom and showing qualitative distortion arrows.
      caption: Use the ideal as a reference and report a defensible trend.
    check:
      id: chk-angle-reasoning
      type: multipleChoice
      prompt: For an H-O-C angle, which atom determines the VSEPR starting angle?
      choices:
      - id: a
        text: H, because it appears first
        media: []
        issueSignals:
        - id: chemistry-vsepr-angle-distortion-error
          domains: []
      - id: b
        text: O, because it is the angle vertex
        media: []
        issueSignals: []
      - id: c
        text: C, because it usually forms more bonds
        media: []
        issueSignals:
        - id: chemistry-vsepr-angle-distortion-error
          domains: []
      - id: d
        text: All three atoms equally
        media: []
        issueSignals:
        - id: chemistry-vsepr-angle-distortion-error
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Analyze oxygen. Why it works: The middle atom is the angle vertex, so its local domains determine the starting geometry. Why the other choices fail: Formula order and typical bonding capacity do not define the angle vertex; VSEPR is local rather than an equal three-atom count.'
