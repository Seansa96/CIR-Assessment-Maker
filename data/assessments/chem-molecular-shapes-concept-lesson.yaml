  - id: molecular-geometry
    title: 'Step 3: Name only atom positions'
    required: true
    content: 'Molecular geometry omits lone-pair positions. In AXE notation, A is the center, X counts bonded atoms, and E counts central lone pairs. Thus $NH_3$ is AX$_3$E: tetrahedral electron-domain geometry but trigonal-pyramidal molecular geometry.'
    media:
    - type: image
      src: /media/chemistry/vsepr-four-domain-family.svg
      alt: Perspective comparison of methane
      caption: Replacing atom positions with lone pairs changes the molecular name.
    check:
      id: chk-geometry-name
      type: multipleChoice
      prompt: Which pair correctly describes $NH_3$ around nitrogen?
      choices:
      - id: a
        text: Trigonal-pyramidal electron geometry; tetrahedral molecular geometry
        media: []
        issueSignals:
        - id: chemistry-vsepr-geometry-name-confusion
          domains: []
      - id: b
        text: Tetrahedral electron geometry; trigonal-pyramidal molecular geometry
        media: []
        issueSignals: []
      - id: c
        text: Tetrahedral electron geometry; tetrahedral molecular geometry
        media: []
        issueSignals:
        - id: chemistry-vsepr-geometry-name-confusion
          domains: []
      - id: d
        text: Trigonal-planar electron geometry; bent molecular geometry
        media: []
        issueSignals:
        - id: chemistry-vsepr-domain-count-error
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The electron geometry is tetrahedral and the molecular geometry is trigonal pyramidal. Why it works: Three N-H bonds plus one lone pair make four domains, but only three atom positions are named. Why the other choices fail: a reverses the two labels; c includes the lone-pair position in the molecular name; d uses only three total domains.'
