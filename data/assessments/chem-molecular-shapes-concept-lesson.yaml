lesson:
  introduction: |
    The **Valence Shell Electron Pair Repulsion (VSEPR) model** predicts the three-dimensional shape of a molecule from its Lewis structure. The core idea is simple: electron pairs — whether in bonds or as lone pairs — repel each other and arrange themselves as far apart as possible. From this one principle, we can predict the geometry of virtually every main-group molecule.
  sections:
    - id: sec-vsepr-basics
      title: VSEPR Theory and Electron Domains
      required: true
      content: |
        **Electron domain** (also called an electron group): any region of electron density around a central atom — a single bond, double bond, triple bond, or lone pair each counts as *one* electron domain.

        The key insight: **electron domains repel each other and maximize their separation.** This is why we can predict geometry purely by counting domains.

        **AXₙEₘ notation:**
        - A = central atom
        - X = bonding partner (each counts as one domain)
        - E = lone pair on central atom
        - n = number of bonding domains; m = number of lone pair domains

        The **electron-pair geometry** describes the arrangement of all electron domains (bonding + lone pairs). The **molecular geometry** describes the arrangement of *atoms only* (ignoring lone pairs). These two are the same only when $m = 0$.

        **Lone pairs vs bonding pairs:** Lone pairs are held by only one nucleus (higher repulsion) and take up more angular space. This compresses bond angles below the ideal electron-pair geometry angle.
      media:
        - type: image
          src: /media/chemistry/covalent-bonding/chem-vsepr-geometry-chart.png
          alt: Reference chart of all major VSEPR molecular geometries showing AXnEm notation, shape names, and bond angles.
          caption: "VSEPR geometry summary: electron-pair geometry determines the starting arrangement; lone pairs push bonding pairs closer, giving the observed molecular shape."
      check:
        id: chk-vsepr-1
        type: multipleChoice
        prompt: |
          A central atom has 4 electron domains: 3 bonding pairs and 1 lone pair. Using AXₙEₘ notation, this is:
        choices:
          - id: a
            text: AX4E0 — tetrahedral molecular geometry
          - id: b
            text: AX3E1 — trigonal pyramidal molecular geometry
          - id: c
            text: AX3E0 — trigonal planar molecular geometry
          - id: d
            text: AX2E2 — bent molecular geometry
        answer:
          choiceId: b
        explanation: |
          3 bonding + 1 lone pair = AX₃E₁. The electron-pair geometry is tetrahedral (4 domains), but with one position occupied by a lone pair, the molecular geometry — defined by atom positions only — is **trigonal pyramidal**. Ammonia ($NH_3$) is the textbook example.

    - id: sec-2-3-domains
      title: Two and Three Electron Domains
      required: true
      content: |
        **2 electron domains (AX₂E₀):**
        - Electron-pair geometry: **linear**
        - Molecular geometry: **linear**
        - Bond angle: **180°**
        - Example: $CO_2$ (2 double bonds count as 2 domains), $BeCl_2$

        **3 electron domains:**

        | Type | Geometry | Bond Angle | Example |
        |---|---|---|---|
        | AX₃E₀ | Trigonal planar | 120° | $BF_3$, $SO_3$ |
        | AX₂E₁ | Bent | ~117° | $SO_2$ (lone pair on S compresses angle) |

        Note: $SO_2$ has a lone pair on S plus two S—O bonds (one single, one double in Lewis terms, but equivalent in the resonance hybrid). The lone pair compresses the O—S—O angle to about 119°, slightly less than the ideal 120°.
      check:
        id: chk-vsepr-2
        type: multipleChoice
        prompt: |
          What is the molecular geometry of $BF_3$?
        choices:
          - id: a
            text: Trigonal pyramidal (3 bonds + 1 lone pair)
          - id: b
            text: Trigonal planar (3 bonds + 0 lone pairs)
          - id: c
            text: Bent (2 bonds + 1 lone pair)
          - id: d
            text: Linear (2 bonds + 0 lone pairs)
        answer:
          choiceId: b
        explanation: |
          Boron in $BF_3$ forms 3 bonds and has **no lone pairs** (it has an incomplete octet of only 6 electrons). With 3 bonding domains and 0 lone pairs (AX₃E₀), the electron-pair geometry and molecular geometry are both **trigonal planar**, with 120° F—B—F angles.

    - id: sec-4-domains
      title: Four Electron Domains
      required: true
      content: |
        Four electron domains arrange in a **tetrahedral** electron-pair geometry. The molecular geometry depends on how many domains are lone pairs:

        | Type | Molecular Geometry | Bond Angle | Example |
        |---|---|---|---|
        | AX₄E₀ | Tetrahedral | 109.5° | $CH_4$, $CCl_4$ |
        | AX₃E₁ | Trigonal pyramidal | ~107° | $NH_3$, $PCl_3$ |
        | AX₂E₂ | Bent | ~104.5° | $H_2O$, $H_2S$ |

        The progressive decrease in bond angle (109.5° → 107° → 104.5°) reflects the increasing repulsion from lone pairs. Each additional lone pair compresses the bonding pairs slightly more.

        **Water ($H_2O$):** O has 2 bonds + 2 lone pairs = AX₂E₂ → bent, 104.5°. This bent shape gives water its polar character and extraordinary hydrogen-bonding ability.

        **Methane ($CH_4$):** C has 4 bonds + 0 lone pairs = AX₄E₀ → perfect tetrahedral, 109.5°.
      check:
        id: chk-vsepr-3
        type: multipleChoice
        prompt: |
          Predict the molecular geometry and approximate bond angle for $H_2S$.
        choices:
          - id: a
            text: Linear, 180°
          - id: b
            text: Trigonal pyramidal, ~107°
          - id: c
            text: Bent, ~104.5°
          - id: d
            text: Tetrahedral, 109.5°
        answer:
          choiceId: c
        explanation: |
          S in $H_2S$ has 2 S—H bonds + 2 lone pairs = AX₂E₂ (same type as water). The electron-pair geometry is tetrahedral but the molecular geometry is **bent**, with a bond angle close to 104.5°. (The actual H—S—H angle, ~92°, is slightly less than water's because S is larger and its lone pairs are diffuser, but the VSEPR prediction of "bent" is correct.)

    - id: sec-5-6-domains
      title: Five and Six Electron Domains (Expanded Octets)
      required: true
      content: |
        These geometries apply only to Period 3+ central atoms with expanded octets.

        **Five electron domains (trigonal bipyramidal electron-pair geometry):**

        The five domains are *not* all equivalent — there are **axial** positions (90° from equatorial) and **equatorial** positions (120° from each other). Lone pairs always occupy equatorial positions (more space, less repulsion).

        | Type | Molecular Geometry | Example |
        |---|---|---|
        | AX₅E₀ | Trigonal bipyramidal | $PCl_5$, $PF_5$ |
        | AX₄E₁ | Seesaw | $SF_4$ |
        | AX₃E₂ | T-shaped | $ClF_3$ |
        | AX₂E₃ | Linear | $XeF_2$ |

        **Six electron domains (octahedral electron-pair geometry):**

        All six positions are equivalent. If two lone pairs exist, they go **opposite** each other (180° apart) to minimize repulsion.

        | Type | Molecular Geometry | Example |
        |---|---|---|
        | AX₆E₀ | Octahedral | $SF_6$ |
        | AX₅E₁ | Square pyramidal | $BrF_5$ |
        | AX₄E₂ | Square planar | $XeF_4$ |
      check:
        id: chk-vsepr-4
        type: selectAll
        prompt: |
          Which of the following molecules have a **linear** molecular geometry? Select all that apply.
        choices:
          - id: a
            text: '$CO_2$ (AX₂E₀)'
          - id: b
            text: '$XeF_2$ (AX₂E₃)'
          - id: c
            text: '$H_2O$ (AX₂E₂)'
          - id: d
            text: '$BeCl_2$ (AX₂E₀)'
        answer:
          choiceIds:
            - a
            - b
            - d
        explanation: |
          **Linear geometry** occurs when all electron domains point along a single axis: AX₂E₀ ($CO_2$, $BeCl_2$ — 2 bonding domains, no lone pairs) and AX₂E₃ ($XeF_2$ — lone pairs occupy equatorial positions, leaving 2 axial F atoms in a linear arrangement). Water (AX₂E₂) is **bent** because its lone pairs are not in opposing positions.

    - id: sec-vsepr-summary
      title: Applying VSEPR — The Workflow
      required: true
      content: |
        A fast workflow for any VSEPR problem:

        1. **Draw the Lewis structure** of the molecule or ion.
        2. **Count electron domains** on the central atom (each bond — single, double, or triple — is 1 domain; each lone pair is 1 domain).
        3. **Identify the AXₙEₘ type** and look up the electron-pair geometry.
        4. **Determine molecular geometry** by considering only atom positions (ignore lone pairs in naming the shape).
        5. **Estimate bond angles**, reducing from ideal if lone pairs are present.

        **Practice problem — $ClF_3$:**
        1. Lewis structure: Cl is central, 3 Cl—F bonds, 2 lone pairs on Cl.
        2. Domains: 3 bonding + 2 lone pairs = 5 domains.
        3. AX₃E₂; electron-pair geometry: trigonal bipyramidal.
        4. Lone pairs occupy equatorial sites. Three F atoms fill: 2 equatorial + 1 axial (wait — actually 1 equatorial + 2 axial positions). Molecular geometry: **T-shaped**.
        5. Bond angles: F(axial)—Cl—F(equatorial) ≈ 87° (compressed by lone pairs).
      check:
        id: chk-vsepr-5
        type: multipleChoice
        prompt: |
          Predict the molecular geometry of $XeF_4$.
        choices:
          - id: a
            text: Octahedral
          - id: b
            text: Square pyramidal
          - id: c
            text: Square planar
          - id: d
            text: Tetrahedral
        answer:
          choiceId: c
        explanation: |
          Xe in $XeF_4$: 4 Xe—F bonds + 2 lone pairs = 6 electron domains → AX₄E₂ → octahedral electron-pair geometry. The two lone pairs occupy opposite (180°) axial positions, leaving 4 F atoms in a square plane around Xe. Molecular geometry: **square planar**.
