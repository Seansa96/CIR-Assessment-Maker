  - id: electron-domain-geometry
    title: 'Step 2: Arrange every domain'
    required: true
    content: Two through six domains begin linear, trigonal planar, tetrahedral, trigonal bipyramidal, and octahedral, respectively. These electron-domain names include positions occupied by lone pairs.
    media:
    - type: image
      src: /media/chemistry/vsepr-geometry-atlas.svg
      alt: Perspective atlas of the two-through-six-domain electron geometries and their ideal angles.
      caption: The total domain count fixes the starting arrangement.
    check:
      id: chk-electron-domain
      type: multipleChoice
      prompt: A central atom has five total electron domains. What is its electron-domain geometry?
      choices:
      - id: a
        text: Tetrahedral
        media: []
        issueSignals:
        - id: chemistry-vsepr-domain-count-error
          domains: []
      - id: b
        text: Trigonal bipyramidal
        media: []
        issueSignals: []
      - id: c
        text: Square planar
        media: []
        issueSignals:
        - id: chemistry-vsepr-geometry-name-confusion
          domains: []
      - id: d
        text: Octahedral
        media: []
        issueSignals:
        - id: chemistry-vsepr-domain-count-error
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Five domains give a trigonal-bipyramidal electron-domain geometry. Why it works: VSEPR assigns the starting arrangement from the total domain count. Why the other choices fail: Tetrahedral uses four domains; square planar is an atoms-only shape derived from six domains; octahedral uses six domains.'
