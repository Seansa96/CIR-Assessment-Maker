  - id: two-three-domain-cases
    title: 'Step 4: Use the two- and three-domain families'
    required: true
    content: 'AX$_2$ is linear at 180 degrees. Three domains are trigonal planar at an ideal 120 degrees: AX$_3$ is trigonal planar, while AX$_2$E is bent. Resonance does not change the number of bond directions.'
    media:
    - type: image
      src: /media/chemistry/vsepr-geometry-atlas.svg
      alt: Linear and trigonal-planar families with atom and lone-pair positions distinguished.
      caption: A lone pair can change the atoms-only name without changing the starting family.
    check:
      id: chk-three-domain
      type: multipleChoice
      prompt: The central oxygen in ozone has two bonding domains and one lone pair. What is its molecular geometry?
      choices:
      - id: a
        text: Linear
        media: []
        issueSignals:
        - id: chemistry-vsepr-domain-count-error
          domains: []
      - id: b
        text: Bent
        media: []
        issueSignals: []
      - id: c
        text: Trigonal planar
        media: []
        issueSignals:
        - id: chemistry-vsepr-geometry-name-confusion
          domains: []
      - id: d
        text: Tetrahedral
        media: []
        issueSignals:
        - id: chemistry-vsepr-domain-count-error
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
