  - id: four-domain-cases
    title: 'Step 5: Use the four-domain family and refine angles'
    required: true
    content: 'Four domains begin tetrahedrally: AX$_4$ is tetrahedral, AX$_3$E is trigonal pyramidal, and AX$_2$E$_2$ is bent. Lone-pair repulsion usually compresses adjacent bond angles below the 109.5-degree ideal.'
    media:
    - type: image
      src: /media/chemistry/vsepr-angle-distortion.svg
      alt: Comparison of ideal tetrahedral angles with progressive compression caused by one and two lone pairs.
      caption: VSEPR predicts the direction of distortion
    check:
      id: chk-four-domain
      type: multipleChoice
      prompt: Which central-atom description gives a bent molecular geometry from a four-domain arrangement?
      choices:
      - id: a
        text: AX$_4$
        media: []
        issueSignals:
        - id: chemistry-vsepr-geometry-name-confusion
          domains: []
      - id: b
        text: AX$_3$E
        media: []
        issueSignals:
        - id: chemistry-vsepr-geometry-name-confusion
          domains: []
      - id: c
        text: AX$_2$E$_2$
        media: []
        issueSignals: []
      - id: d
        text: AX$_2$
        media: []
        issueSignals:
        - id: chemistry-vsepr-domain-count-error
          domains: []
      answer:
        choiceId: c
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: AX$_2$E$_2$ is bent. Why it works: Four total domains are tetrahedral, while the two bonded atoms define a bent molecular geometry. Why the other choices fail: AX$_4$ is tetrahedral; AX$_3$E is trigonal pyramidal; AX$_2$ has only two domains and is linear.'
