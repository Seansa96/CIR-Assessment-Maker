questions:
- id: q001
  type: numericResponse
  prompt: An open-open pipe is 0.75 m long. Its second harmonic is 453 Hz. What sound speed in m/s is implied?
  answer: { value: 339.75, tolerance: 1 }
  explanation: |
    Solution: For an open-open pipe, $f_n=nv/(2L)$; therefore $v=2Lf_n/n=2(0.75)(453)/2=339.75$ m/s.

    Why it works: The second harmonic fixes two half wavelengths in the pipe, allowing wave speed to be inferred from a measured mode.
  difficultyDimensions: [reverseReasoning, modelOrDerivation, representationTransfer]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q002
  type: numericResponse
  prompt: A closed-open pipe has fundamental frequency 150 Hz. What is its next allowed resonant frequency in Hz?
  answer: { value: 450, tolerance: 0.5 }
  explanation: |
    Solution: Closed-open pipes allow odd harmonics, so the next mode is the third: $f_3=3(150)=450$ Hz.

    Why it works: The mixed boundary conditions allow 1st, 3rd, 5th, and higher odd harmonics rather than every integer harmonic.
  difficultyDimensions: [modelSelection, patternInference, representationTransfer]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q003
  type: multipleChoice
  prompt: A pipe displays resonances at 120 Hz, 240 Hz, and 360 Hz. Under an ideal air-column model, which pipe type is most consistent with that sequence?
  choices:
  - { id: a, text: Open at both ends }
  - { id: b, text: Closed at one end and open at the other }
  - { id: c, text: A pipe with no boundary conditions }
  - { id: d, text: A pipe that cannot form a standing wave }
  answer: { choiceId: a }
  explanation: |
    Solution: Open at both ends.

    Why it works: Consecutive integer multiples of the fundamental are the open-open pattern.

    Why the other choices fail: A closed-open pipe omits even harmonics, and the other descriptions cannot explain discrete resonances.
  difficultyDimensions: [patternInference, modelComparison, errorDiagnosis]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q004
  type: numericResponse
  prompt: A closed-open pipe 0.50 m long resonates at its fifth harmonic. Taking sound speed as 340 m/s, what is that frequency in Hz?
  answer: { value: 850, tolerance: 1 }
  explanation: |
    Solution: $f_1=v/(4L)=340/[4(0.50)]=170$ Hz. The fifth harmonic is $5f_1=850$ Hz.

    Why it works: The fifth mode is an allowed odd harmonic in a closed-open column and shares the same boundary conditions as the fundamental.
  difficultyDimensions: [multiStep, modelSelection, domainCondition]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]

