schemaVersion: 1
id: chemistry-kinetics-easy-quiz-s2c
title: Chemical Kinetics Easy Quiz
assessmentType: quiz
categoryId: chemistry
topicId: chemistry-kinetics
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [chemistry, kinetics, easy] }
authoring: { visualRequirement: required, visualRationale: 'Rate data and an energy profile support quantitative and pathway reasoning.', difficultyTier: easy, sourceId: src-20260720035703-91ea51b0d8 }
questions:
  - id: q1
    type: numericResponse
    prompt: 'A reactant falls from $0.74$ M to $0.50$ M in $12.0$ s. Find its positive average disappearance rate in $\mathrm{M\,s^{-1}}$.'
    answer: { value: 0.02, tolerance: 0.0001 }
    explanation: 'Solution: $-(0.50-0.74)/12.0=0.020\ \mathrm{M\,s^{-1}}$. Why it works: Reactant loss is reported as a positive disappearance rate.'
    difficultyDimensions: [quantitativeReasoning, signConvention]
    difficultyEvidence: 'Computes a finite difference and applies the reactant sign convention.'
    issueSignals: [{ id: chemistry-rate-sign-error }, { id: chemistry-rate-time-omission }]
  - id: q2
    type: multipleChoice
    prompt: 'For $3X\rightarrow2Y$, X disappears at $0.090\ \mathrm{M\,s^{-1}}$. What is the formation rate of Y?'
    choices:
      - { id: a, text: '$0.060\ \mathrm{M\,s^{-1}}$', issueSignals: [] }
      - { id: b, text: '$0.090\ \mathrm{M\,s^{-1}}$', issueSignals: [{ id: chemistry-stoichiometry-ignored }] }
      - { id: c, text: '$0.135\ \mathrm{M\,s^{-1}}$', issueSignals: [{ id: chemistry-coefficient-ratio-reversed }] }
    answer: { choiceId: a }
    explanation: 'Solution: $0.090(2/3)=0.060\ \mathrm{M\,s^{-1}}$. Why it works: Product formation follows the 2:3 coefficient ratio. Why the other choices fail: b ignores coefficients; c applies the ratio backward.'
    difficultyDimensions: [stoichiometricTranslation, quantitativeReasoning]
    difficultyEvidence: 'Converts a reactant rate to a different product coefficient.'
    issueSignals: [{ id: chemistry-stoichiometry-ignored }, { id: chemistry-coefficient-ratio-reversed }]
  - id: q3
    type: multipleChoice
    prompt: 'In two trials, doubling [C] while all other concentrations remain fixed doubles the initial rate. What is the order in C?'
    choices:
      - { id: a, text: zero order, issueSignals: [{ id: chemistry-rate-law-factor-misread }] }
      - { id: b, text: first order, issueSignals: [] }
      - { id: c, text: second order, issueSignals: [{ id: chemistry-rate-law-factor-misread }] }
    answer: { choiceId: b }
    explanation: 'Solution: First order. Why it works: The rate factor equals $2^m$, so $2=2^1$. Why the other choices fail: zero order predicts no change; second order predicts a factor of four.'
    difficultyDimensions: [dataInterpretation, exponentReasoning]
    difficultyEvidence: 'Relates a controlled factor change to an experimental exponent.'
    issueSignals: [{ id: chemistry-rate-law-factor-misread }]
  - id: q4
    type: numericResponse
    prompt: 'For $rate=k[D]^2$ with $k=0.80\ \mathrm{M^{-1}s^{-1}}$ and $[D]=0.50\ \mathrm{M}$, find the rate in $\mathrm{M\,s^{-1}}$.'
    answer: { value: 0.2, tolerance: 0.001 }
    explanation: 'Solution: $0.80(0.50)^2=0.200\ \mathrm{M\,s^{-1}}$. Why it works: Substitute concentration with its experimental exponent.'
    difficultyDimensions: [rateLawSubstitution, units]
    difficultyEvidence: 'Uses a second-order concentration factor and rate-constant units.'
    issueSignals: [{ id: chemistry-rate-law-exponent-omitted }]
  - id: q5
    type: numericResponse
    prompt: 'A first-order process has $k=0.3465\ \mathrm{h^{-1}}$. Find its half-life in hours.'
    answer: { value: 2.0, tolerance: 0.01 }
    explanation: 'Solution: $t_{1/2}=0.693/0.3465=2.00\ \mathrm{h}$. Why it works: First-order half-life depends only on k.'
    difficultyDimensions: [formulaSelection, units]
    difficultyEvidence: 'Selects the order-specific half-life formula and preserves time units.'
    issueSignals: [{ id: chemistry-half-life-model-misapplied }]
  - id: q6
    type: multipleChoice
    prompt: 'Which change most directly raises collision frequency in a gas reaction at the same temperature?'
    choices:
      - { id: a, text: increase reactant concentration, issueSignals: [] }
      - { id: b, text: add an inert label to a molecule, issueSignals: [{ id: chemistry-collision-model-confusion }] }
      - { id: c, text: lower reactant concentration, issueSignals: [{ id: chemistry-concentration-direction-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: Increase reactant concentration. Why it works: More particles per volume collide more often. Why the other choices fail: b does not increase encounter frequency; c reduces it.'
    difficultyDimensions: [molecularModel, causalReasoning]
    difficultyEvidence: 'Distinguishes collision frequency from activation-energy effects.'
    issueSignals: [{ id: chemistry-collision-model-confusion }, { id: chemistry-concentration-direction-error }]
  - id: q7
    type: multipleChoice
    prompt: 'What does a catalyst do to a reaction-coordinate diagram?'
    choices:
      - { id: a, text: provides a lower activation-energy pathway, issueSignals: [] }
      - { id: b, text: makes reactants have lower enthalpy, issueSignals: [{ id: chemistry-catalyst-state-function-confusion }] }
      - { id: c, text: increases the equilibrium constant at fixed temperature, issueSignals: [{ id: chemistry-kinetics-equilibrium-confusion }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. Why it works: A catalyst changes pathway barrier, not the initial and final state energies. Why the other choices fail: b changes a state energy; c confuses rate with equilibrium position.'
    difficultyDimensions: [diagramInterpretation, mechanismReasoning]
    difficultyEvidence: 'Separates pathway activation energy from thermodynamic quantities.'
    issueSignals: [{ id: chemistry-catalyst-state-function-confusion }, { id: chemistry-kinetics-equilibrium-confusion }]
  - id: q8
    type: multipleChoice
    prompt: 'Which species is an intermediate in a mechanism?'
    choices:
      - { id: a, text: a species produced in one step and consumed in a later step, issueSignals: [] }
      - { id: b, text: a reactant that appears in the net equation, issueSignals: [{ id: chemistry-mechanism-species-confusion }] }
      - { id: c, text: a substance regenerated unchanged, issueSignals: [{ id: chemistry-catalyst-intermediate-confusion }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. Why it works: Such a species cancels when elementary steps are summed. Why the other choices fail: b remains a net reactant; c defines a catalyst.'
    difficultyDimensions: [mechanismBookkeeping, definitionDiscrimination]
    difficultyEvidence: 'Classifies mechanism species by their appearance across steps.'
    issueSignals: [{ id: chemistry-mechanism-species-confusion }, { id: chemistry-catalyst-intermediate-confusion }]
  - id: q9
    type: multipleChoice
    prompt: 'A plot of $\ln[A]$ versus time is a straight line. Which model is supported?'
    choices:
      - { id: a, text: first-order kinetics, issueSignals: [] }
      - { id: b, text: zero-order kinetics, issueSignals: [{ id: chemistry-integrated-rate-plot-confusion }] }
      - { id: c, text: a catalyst is present, issueSignals: [{ id: chemistry-graph-mechanism-overreach }] }
    answer: { choiceId: a }
    explanation: 'Solution: First-order kinetics. Why it works: The integrated first-order law is linear in $\ln[A]$ and time. Why the other choices fail: b uses [A] versus time; c cannot be inferred from this plot alone.'
    difficultyDimensions: [graphInterpretation, modelSelection]
    difficultyEvidence: 'Matches a transformed concentration graph to the correct integrated law.'
    issueSignals: [{ id: chemistry-integrated-rate-plot-confusion }, { id: chemistry-graph-mechanism-overreach }]
  - id: q10
    type: selectAll
    prompt: 'Select all statements that can increase a typical reaction rate.'
    choices:
      - { id: a, text: raise temperature, issueSignals: [] }
      - { id: b, text: use a catalyst, issueSignals: [] }
      - { id: c, text: lower concentration of every reactant, issueSignals: [{ id: chemistry-concentration-direction-error }] }
      - { id: d, text: increase surface area of a solid reactant, issueSignals: [] }
    answer: { choiceIds: [a, b, d] }
    explanation: 'Solution: Select a, b, and d. Why it works: They increase successful-collision frequency or lower the barrier. Why the other choices fail: c normally reduces collision frequency.'
    difficultyDimensions: [multiConditionReasoning, molecularModel]
    difficultyEvidence: 'Evaluates several distinct rate controls in one context.'
    issueSignals: [{ id: chemistry-concentration-direction-error }]
