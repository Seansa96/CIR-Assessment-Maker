workedExamples:
- id: we-vol-1
  title: Disk Method Example
  problem: Find the volume of the solid generated by rotating $y = \sqrt{x}$ around
    the x-axis from $x=0$ to $x=4$.
  steps:
  - id: step-we-vol-1-1
    title: Identify radius
    instruction: What is $r(x)$?
    type: symbolicResponse
    prompt: Enter $r(x)$.
    answer:
      gradingMode: auto
      expectedLatex: \sqrt{x}
      equivalenceMode: expression
      tolerance: 0
  - id: step-we-vol-1-2
    title: Integrate
    instruction: Evaluate $\pi \int_0^4 r(x)^2 \, dx$.
    type: symbolicResponse
    prompt: Enter the volume.
    answer:
      gradingMode: auto
      expectedLatex: 8\pi
      equivalenceMode: expression
      tolerance: 0
    explanation: $\pi \int_0^4 x \, dx = \pi [x^2/2]_0^4 = 8\pi$.
