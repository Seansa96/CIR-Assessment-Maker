- id: q001
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: An industrial suspension system features a spring of 442.7 N/m supporting
    a load of 0.84 kg. If the amplitude is 0.277 m, what is the maximum speed in m/s?
  answer:
    value: 6.3591
    tolerance: 0.05
  explanation: v_max = A*omega = 0.277 * sqrt(442.7/0.84) = 6.3591 m/s.
- id: q002
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: A vehicle's strut of 373.2 N/m supports a quarter of the car's mass, which
    is 2.69 kg. What is the period of oscillation in seconds?
  answer:
    value: 0.5334
    tolerance: 0.05
  explanation: T = 2*pi*sqrt(m/k) = 2*pi*sqrt(2.69/373.2) = 0.5334 s.
