questions:
- id: q001
  title: Recognize I/O stack
  type: multipleChoice
  prompt: 'Which statement best describes **I/O stack** in operating systems?

    '
  choices:
  - id: a
    text: I/O moves through applications, system calls, device-independent OS layers, drivers, controllers, and devices.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'I/O moves through applications, system calls, device-independent OS layers, drivers, controllers, and devices.
    The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q002
  title: Recognize Interrupts
  type: multipleChoice
  prompt: 'Which statement best describes **Interrupts** in operating systems?

    '
  choices:
  - id: a
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: b
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  - id: c
    text: It removes the need for explicit policies, permissions, or resource-management decisions.
  - id: d
    text: Interrupts let devices notify the CPU that attention is needed.
  answer:
    choiceId: d
  explanation: 'Interrupts let devices notify the CPU that attention is needed. The distractors either ignore the OS boundary
    or confuse a design tradeoff with a universal rule.

    '
