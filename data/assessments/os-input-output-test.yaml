  title: Explain Interrupts
  type: freeResponse
  prompt: 'In a short answer, explain why **Interrupts** matters in Input and Output.

    '
  answer:
    expected: 'Interrupts let devices notify the CPU that attention is needed. A complete answer should also note that interrupt-driven
