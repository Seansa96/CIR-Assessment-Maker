- id: q004
  title: Explain Device drivers
  type: freeResponse
  prompt: 'In a short answer, explain why **Device drivers** matters in Input and Output.

    '
  answer:
    expected: 'Drivers translate general OS requests into device-specific commands. A complete answer should also note that
      a driver bug can compromise kernel reliability.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Device drivers
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Input and Output. The key is to connect the term to what the OS controls or protects.

    '
