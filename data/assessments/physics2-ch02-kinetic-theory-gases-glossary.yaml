{"schemaVersion": 1, "id": "physics2-ch02-kinetic-theory-gases-glossary", "title": "Kinetic Theory of Gases Glossary", "assessmentType": "glossary", "categoryId": "physics-2", "topicId": "physics2-kinetic-theory-gases", "modeDefault": "practice", "randomizeQuestions": false, "skills": ["physics2-kinetic-theory-gases"], "navigation": {"learningGoal": "learn", "activityType": "glossary", "tags": ["physics-2", "physics2-kinetic-theory-gases", "s2c-reviewed"]}, "glossary": {"introduction": "Vocabulary for modeling, calculation, and interpretation.", "sections": [{"id": "terms", "title": "Core terms", "required": true, "content": "Use definitions to distinguish quantities, processes, and assumptions.", "entries": [{"id": "t01", "term": "ideal gas", "definition": "A theoretical gas composed of randomly moving point particles that only undergo elastic collisions.", "drills": [{"id": "t01-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with ideal gas.", "answer": {"expected": "ideal gas"}, explanation: "Solution:\nAn ideal gas simplifies real gas behavior by ignoring intermolecular forces and particle volume.\n\nWhy it works:\nThis approximation holds well for real gases at high temperatures and low pressures."}]}, {"id": "t02", "term": "mole", "definition": "The SI unit for amount of substance, containing exactly Avogadro's number of elementary entities.", "drills": [{"id": "t02-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with mole.", "answer": {"expected": "mole"}, explanation: "Solution:\nA mole represents a specific number of particles.\n\nWhy it works:\nIt allows macroscopic measurements to be directly related to the number of microscopic particles."}]}, {"id": "t03", "term": "Avogadro constant", "definition": "The number of constituent particles in one mole of a substance ($6.022 \\times 10^{23}\\text{ mol}^{-1}$).", "drills": [{"id": "t03-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with Avogadro constant.", "answer": {"expected": "Avogadro constant"}, explanation: "Solution:\nAvogadro's constant links moles to particle count.\n\nWhy it works:\nIt provides the conversion factor between atomic mass units and grams."}]}, {"id": "t04", "term": "Boltzmann constant", "definition": "A physical constant linking the average kinetic energy of particles in a gas with its thermodynamic temperature.", "drills": [{"id": "t04-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with Boltzmann constant.", "answer": {"expected": "Boltzmann constant"}, explanation: "Solution:\nThe Boltzmann constant ($k_B$) relates temperature to molecular energy.\n\nWhy it works:\nIt is equivalent to the ideal gas constant divided by Avogadro's constant ($R/N_A$)."}]}, {"id": "t05", "term": "absolute temperature", "definition": "Temperature measured from absolute zero, directly proportional to average translational kinetic energy.", "drills": [{"id": "t05-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with absolute temperature.", "answer": {"expected": "absolute temperature"}, explanation: "Solution:\nAbsolute temperature is proportional to molecular kinetic energy.\n\nWhy it works:\nAt 0 K, classical translational molecular motion ceases entirely."}]}, {"id": "t06", "term": "rms speed", "definition": "The square root of the mean of the squares of the speeds of gas particles.", "drills": [{"id": "t06-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with rms speed.", "answer": {"expected": "rms speed"}, explanation: "Solution:\nThe root-mean-square speed represents a typical particle speed.\n\nWhy it works:\nIt is directly related to the average kinetic energy and temperature by $v_{rms} = \\sqrt{3kT/m}$."}]}, {"id": "t07", "term": "mean free path", "definition": "The average distance a particle travels between collisions with other particles.", "drills": [{"id": "t07-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with mean free path.", "answer": {"expected": "mean
free path"}, explanation: "Solution:\nMean free path describes collision frequency.\n\nWhy it works:\nIt depends inversely on the size of the particles and their number density."}]}, {"id": "t08", "term": "equipartition", "definition": "A theorem stating that energy is shared equally among all accessible degrees of freedom.", "drills": [{"id": "t08-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with equipartition.", "answer": {"expected": "equipartition"}, explanation: "Solution:\nThe equipartition theorem distributes $\\frac{1}{2}kT$ of energy to each degree of freedom.\n\nWhy it works:\nIn thermal equilibrium, collisions randomize energy across all available modes (translation, rotation)."}]}, {"id": "t09", "term": "translational energy", "definition": "The kinetic energy associated with the linear motion of the center of mass of a particle.", "drills": [{"id": "t09-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with translational energy.", "answer": {"expected": "translational energy"}, explanation: "Solution:\nTranslational energy is $\\frac{3}{2}kT$ for any gas.\n\nWhy it works:\nThere are exactly three spatial dimensions (degrees of freedom) for linear motion."}]}, {"id": "t10", "term": "heat capacity", "definition": "The amount of heat required to raise the temperature of a specific object by 1 K.", "drills": [{"id": "t10-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with heat capacity.", "answer": {"expected": "heat capacity"}, explanation: "Solution:\nHeat capacity applies to an entire object rather than per unit mass.\n\nWhy it works:\nIt is the product of the object's mass and its specific heat."}]}, {"id": "t11", "term": "molar heat capacity", "definition": "The heat required to raise the temperature of one mole of a substance by 1 K.", "drills": [{"id": "t11-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with molar heat capacity.", "answer": {"expected": "molar heat capacity"}, explanation: "Solution:\nMolar heat capacity standardizes heat capacity by moles instead of mass.\n\nWhy it works:\nFor ideal gases, it depends on whether the process is at constant volume ($C_V$) or pressure ($C_P$)."}]}, {"id": "t12", "term": "Maxwell distribution", "definition": "The probability distribution of particle speeds in an ideal gas at thermal equilibrium.", "drills": [{"id": "t12-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with Maxwell distribution.", "answer": {"expected": "Maxwell distribution"}, explanation: "Solution:\nThe Maxwell-Boltzmann distribution shows the spread of molecular speeds.\n\nWhy it works:\nStatistical mechanics predicts this bell-like curve with a long tail at higher speeds."}]}, {"id": "t13", "term": "pressure", "definition": "The force exerted per unit area by gas particles colliding with the walls of their container.", "drills": [{"id": "t13-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with pressure.", "answer": {"expected": "pressure"}, explanation: "Solution:\nPressure results from microscopic collisions.\n\nWhy it works:\nEach collision imparts a change in momentum to the wall, generating a macroscopic force."}]}, {"id": "t14", "term": "number density", "definition": "The number of particles per unit volume in a gas ($N/V$).", "drills": [{"id": "t14-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with number density.", "answer": {"expected": "number density"}, explanation: "Solution:\nNumber density describes how crowded the particles are.\n\nWhy it works:\nIt is directly related to pressure and temperature via $P = n_V kT$."}]}, {"id": "t15", "term": "internal energy", "definition": "The total energy contained within a thermodynamic system, including kinetic and potential energy.", "drills": [{"id": "t15-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with internal energy.", "answer": {"expected": "internal energy"}, explanation: "Solution:\nInternal energy is the
sum of all microscopic energies.\n\nWhy it works:\nFor an ideal gas, internal energy depends only on temperature and the number of particles."}]}]}]}}
