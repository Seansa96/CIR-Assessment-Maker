questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - vector-components
  prompt: A $2.0\text{ }\mu\text{C}$ charge is at the origin and a $-3.0\text{ }\mu\text{C}$ charge is
    at $x=4.0\text{ m}$. What is the magnitude of the electric force on the $2.0\text{ }\mu\text{C}$ charge
    (in milliNewtons)? (Use $k=9.0 \times 10^9$).
  answer:
    tolerance: 0.05
    value: 3.375
  explanation: 'Solution:

    1) Use Coulomb''s Law: $F = k \frac{|q_1 q_2|}{r^2}$.

    2) Substitute values: $F = (9.0 \times 10^9) \frac{(2.0 \times 10^{-6})(3.0 \times 10^{-6})}{(4.0)^2}$.

    3) Calculate: $F = 9.0 \times \frac{6.0}{16.0} \times 10^{-3} = 3.375 \times 10^{-3}\text{ N} = 3.375\text{
    mN}$.


    Why it works:

    The charges interact via the inverse-square electrostatic force.'
