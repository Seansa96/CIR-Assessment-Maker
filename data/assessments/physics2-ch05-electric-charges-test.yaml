- id: q001
  type: freeResponse
  skills:
  - physics2-ch05-modeling
  prompt: A Electric Charges and Fields situation emphasizes charge and conservation. Define the system and sign
    convention, state when $\\mathbf{E}=kq\\hat{r}/r^2$ applies, and construct a written solution that includes
    the relation, units, assumptions, and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $\\mathbf{E}=kq\\hat{r}/r^2$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Electric Charges and Fields model of charge, force, and electric-field models is reliable
    only when its relation, conditions, and interpretation are kept together.'
  difficultyDimensions: &id001
  - modelOrDerivation
  - proofJustification
  - representationTransfer
