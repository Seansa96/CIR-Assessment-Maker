questions:
- id: q001
  type: numericResponse
  skills:
  - physics2-ch05-electric-charges-fields-electric-charge
  prompt: Two charges +5.0 nC and -2.0 nC are separated by 0.30 m. Enter the force magnitude in N.
  answer:
    value: 1.0e-06
    tolerance: 1.0e-08
  explanation: 'Solution: F=1.0e-6 N; the force on +5.0 nC points toward the negative charge.


    Why it works: Coulomb’s law gives magnitude while opposite signs determine attraction.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-electric-charge
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-dipoles
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-charge
- id: q002
  type: numericResponse
  skills:
  - physics2-ch05-electric-charges-fields-charging-induction
  prompt: A +3.0 nC source is at the origin. Enter the magnitude of E at x=-0.20 m in N/C.
  answer:
    value: 674.0
    tolerance: 2.0
  explanation: 'Solution: E=674 N/C toward -x.


    Why it works: A positive point charge produces an outward radial field.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-charging-induction
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-charge
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-charging-induction
- id: q003
  type: numericResponse
  skills:
  - physics2-ch05-electric-charges-fields-coulomb-law
  prompt: At P, source fields are (4,-3) N/C and (-1,5) N/C. Enter the magnitude of the net field in N/C.
  answer:
    value: 3.61
    tolerance: 0.02
  explanation: 'Solution: E_net=(3,2) N/C; magnitude=sqrt(13)=3.61 N/C.


    Why it works: Superposition adds signed components before computing magnitude.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-coulomb-law
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-charging-induction
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-coulomb-law
- id: q004
  type: freeResponse
  skills:
  - physics2-ch05-electric-charges-fields-electric-field
  prompt: A uniform line charge has lambda=2.0 microC/m. Write dq for an element dx and set up the field integral
    at perpendicular distance a.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - dq=lambda dx
    - dE=k dq/r^2, with only the perpendicular component retained by symmetry.
  explanation: 'Solution: dq=lambda dx; dE=k dq/r^2, with only the perpendicular component retained by symmetry.


    Why it works: The continuous distribution is assembled from point-charge contributions.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-electric-field
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-coulomb-law
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-field
- id: q005
  type: freeResponse
  skills:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  prompt: A positive rod is brought near two touching neutral conducting spheres; the spheres are separated while
    the rod remains. State the final net signs and total charge.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - The near sphere is negative, the far sphere positive, and their combined charge remains zero.
  explanation: 'Solution: The near sphere is negative, the far sphere positive, and their combined charge remains
    zero.


    Why it works: Induction separates mobile charge without creating net charge.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-field
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
- id: q006
  type: numericResponse
  skills:
  - physics2-ch05-electric-charges-fields-field-lines
  prompt: A uniformly charged ring has total charge Q and radius R. Enter the axial field at its center in N/C.
  answer:
    value: 0.0
    tolerance: 1.0e-09
  explanation: 'Solution: E_z=kQz/(z^2+R^2)^(3/2); E_z(0)=0.


    Why it works: Transverse components cancel and axial components add.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-field-lines
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-field-lines
- id: q007
  type: freeResponse
  skills:
  - physics2-ch05-electric-charges-fields-dipoles
  prompt: For a finite rod on x from -L/2 to L/2 with uniform lambda, write the axial-field integral at point (0,a).
  answer:
    gradingMode: selfCheck
    keyPoints:
    - E_y=integral[-L/2,L/2] k lambda a dx/(x^2+a^2)^(3/2).
  explanation: 'Solution: E_y=integral[-L/2,L/2] k lambda a dx/(x^2+a^2)^(3/2).


    Why it works: Pairwise symmetry cancels horizontal components; the vertical projection remains.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-dipoles
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-field-lines
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-dipoles
- id: q008
  type: symbolicResponse
  skills:
  - physics2-ch05-electric-charges-fields-electric-charge
  prompt: A dipole has charges -q at x=-a and +q at x=+a. Enter the x-component of its dipole moment.
  answer:
    expectedLatex: 2*a*q
    equivalenceMode: simplify
    variables:
    - a
    - q
    tolerance: 1.0e-06
  explanation: 'Solution: p=2aq in the +x direction.


    Why it works: Dipole moment is charge magnitude times displacement from negative to positive.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-electric-charge
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-dipoles
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-charge
- id: q009
  type: freeResponse
  skills:
  - physics2-ch05-electric-charges-fields-charging-induction
  prompt: A dipole moment p makes angle 30 degrees with a uniform field E. Give torque magnitude and potential energy.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - tau=pE/2
    - U=-pE cos(30 degrees)=-sqrt(3)pE/2.
  explanation: 'Solution: tau=pE/2; U=-pE cos(30 degrees)=-sqrt(3)pE/2.


    Why it works: Torque uses pE sin(theta); energy uses -p dot E.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-charging-induction
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-charge
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-charging-induction
- id: q010
  type: freeResponse
  skills:
  - physics2-ch05-electric-charges-fields-coulomb-law
  prompt: Explain why two electric-field lines cannot cross and what denser spacing indicates.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Crossing would assign two E directions at one point
    - denser lines indicate stronger field.
  explanation: 'Solution: Crossing would assign two E directions at one point; denser lines indicate stronger field.


    Why it works: Field is a single-valued vector field.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-coulomb-law
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-charging-induction
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-coulomb-law
- id: q011
  type: multipleChoice
  skills:
  - physics2-ch05-electric-charges-fields-electric-field
  prompt: For r much larger than the dipole separation, how does the axial dipole field scale with r?
  answer:
    choiceId: c
  explanation: 'Solution: The net charge is zero, so the monopole 1/r^2 field cancels; the leading dipole field
    scales as 1/r^3.


    Why it works: The far-field expansion removes the monopole term and leaves the dipole term.


    Why the other choices fail: The inverse-square option is point-charge behavior; inverse-linear and constant
    options have no dipole far-field basis.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-electric-field
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-coulomb-law
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-field
  choices:
  - id: a
    text: 1/r
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: 1/r^2
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: 1/r^3
  - id: d
    text: constant
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
- id: q012
  type: selectAll
  skills:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  prompt: A test charge is doubled while source charges stay fixed. Select every statement that remains true.
  answer:
    choiceIds:
    - a
    - b
  explanation: 'Solution: E depends on source charges, so it is unchanged; F=qE doubles with the test charge.


    Why it works: The field is defined independently of the charge used to probe it.


    The unselected statements either ignore the stated constraint or apply the wrong relation.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch05-electric-charges-fields-electric-field
  extensionObjectiveIds:
  - physics2-ch05-electric-charges-fields-continuous-charge-fields
  choices:
  - id: a
    text: The electric field is unchanged.
  - id: b
    text: The force on the test charge doubles.
  - id: c
    text: The source electric field doubles.
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: The electric-field direction reverses.
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
