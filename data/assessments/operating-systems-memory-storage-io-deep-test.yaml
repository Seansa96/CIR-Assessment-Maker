questions:
- id: q001
  title: 'Memory Management: Address space abstraction'
  type: multipleChoice
  prompt: In a design review, which statement best applies **Address space abstraction**?
  choices:
  - id: a
    text: Virtual addresses require translation and protection.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'Virtual addresses require translation and protection. Related topic: Memory Management.'
