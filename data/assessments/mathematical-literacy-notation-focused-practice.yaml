questions:
- id: q001
  type: multipleChoice
  prompt: 'Let $A=\{1,\{2\}\}$. Which statement is true?'
  choices:
  - id: a
    text: '$\{2\}\in A$'
  - id: b
    text: '$2\in A$'
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: '$\{1,2\}\subseteq A$'
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: '$\{\{2\}\}\subseteq A$'
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Distinguishes an element from a nested set and separates membership from containment.
  explanation: |-
    Solution: $\{2\}$ is explicitly one element of A, so $\{2\}\in A$.
    Why it works: Membership asks whether the whole object appears as an element in the set.
    Why the other choices fail: B removes the braces, C contains 2 which is not an element of A, and D would require $\{2\}$ itself to be a set inside A.
- id: q002
  type: multipleChoice
  prompt: 'Which plain-language reading matches $\{x\in\mathbb Z:x^2<9\}$?'
  choices:
  - id: a
    text: The integers whose squares are less than 9.
  - id: b
    text: All real numbers less than 9.
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: The square of every integer less than 9.
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: Integers greater than 9.
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: Requires separating the declared domain from the condition on the expression.
  explanation: |-
    Solution: It is the set of integers x for which $x^2<9$.
    Why it works: The part $x\in\mathbb Z$ sets the domain, and the part after the colon supplies the condition.
    Why the other choices fail: B changes the domain, C changes the collected object, and D reverses the inequality.
- id: q003
  type: multipleChoice
  prompt: 'In $f:\mathbb R\to\mathbb R$ with $f(x)=x^2$, what does the first $\mathbb R$ identify?'
  choices:
  - id: a
    text: The domain, or permitted inputs.
  - id: b
    text: The range of values actually produced.
    issueSignals:
    - id: expression-equation-recognition-error
  - id: c
    text: The exponent on x.
    issueSignals:
    - id: expression-equation-recognition-error
  - id: d
    text: A claim that f is one-to-one.
    issueSignals:
    - id: expression-equation-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: expression-equation-recognition-error
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Interprets function-arrow notation while separating domain, codomain, and range.
  explanation: |-
    Solution: The first $\mathbb R$ is the domain.
    Why it works: In $f:A\to B$, A names the allowed inputs and B names the codomain.
    Why the other choices fail: B confuses codomain with range, while C and D are unrelated to arrow notation.
- id: q004
  type: multipleChoice
  prompt: 'If $B=\{1,2\}$ and $A=\{1,2,3\}$, which statement is justified?'
  choices:
  - id: a
    text: '$B\subseteq A$'
  - id: b
    text: '$A\subseteq B$'
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: '$A\in B$'
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: '$3\in B$'
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Checks every element for a containment claim and rejects reversed direction.
  explanation: |-
    Solution: Every element of B, namely 1 and 2, belongs to A.
    Why it works: $B\subseteq A$ requires all elements of B to occur in A.
    Why the other choices fail: B reverses containment, C asks membership of an entire set without evidence, and D is false.
- id: q005
  type: multipleChoice
  prompt: 'Let $E=\{2n:n\in\mathbb{Z}\}$. Which value is an element of $E$?'
  choices:
  - id: a
    text: '$-6$, because $-6=2(-3)$ and $-3\in\mathbb{Z}$.'
  - id: b
    text: $-3$, because every integer belongs to $E$.
    issueSignals:
    - id: set-builder-condition-ignored
  - id: c
    text: $1$, because it is twice a positive half-integer.
    issueSignals:
    - id: domain-condition-ignored
  - id: d
    text: '$\frac{3}{2}$, because it can be written using an integer numerator.'
    issueSignals:
    - id: expression-condition-confused
  answer:
    choiceId: a
  issueSignals:
  - id: set-builder-condition-ignored
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Tests the expression-and-rule roles in set-builder notation and the integer-domain restriction.
  explanation: |-
    Solution: $-6\in E$ because $-6=2(-3)$ for the integer $-3$.
    Why it works: The expression $2n$ supplies elements only when the rule $n\in\mathbb{Z}$ is met. Every such output is an even integer.
    Why the other choices fail: B ignores the factor of $2$. C uses a non-integer parameter, and D does not have the form $2n$ for an integer $n$.
- id: q006
  type: multipleChoice
  prompt: 'Which description correctly distinguishes $\mathbb{R}\times(\mathbb{N}\times\mathbb{Z})$ from $\mathbb{R}\times\mathbb{N}\times\mathbb{Z}$?'
  choices:
  - id: a
    text: The first has ordered-pair elements whose second entry is an ordered pair; the second has ordered triples.
  - id: b
    text: They are equal because parentheses never affect a Cartesian product.
    issueSignals:
    - id: ordered-structure-flattened
  - id: c
    text: The first contains only real numbers, while the second contains only integers.
    issueSignals:
    - id: factor-types-confused
  - id: d
    text: The first is a product of numbers and the second is a product of sets.
    issueSignals:
    - id: operation-type-confused
  answer:
    choiceId: a
  issueSignals:
  - id: ordered-structure-flattened
  difficultyDimensions:
  - structuralRecognition
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Requires preserving nesting in a product rather than treating all product notation as associative.
  explanation: |-
    Solution: $\mathbb{R}\times(\mathbb{N}\times\mathbb{Z})$ consists of pairs $(r,(n,z))$, whereas $\mathbb{R}\times\mathbb{N}\times\mathbb{Z}$ consists of triples $(r,n,z)$.
    Why it works: Cartesian-product notation records the order and grouping of entries. Parentheses change the shape of each element.
    Why the other choices fail: B erases that grouping. C misstates the factors, and D mistakes a set construction for ordinary multiplication.
- id: q007
  type: multipleChoice
  prompt: 'In $X=\{x\in\mathbb{Z}:x^2<10\}$, which part is the rule that filters possible elements?'
  choices:
  - id: a
    text: $x^2<10$
  - id: b
    text: $x$
    issueSignals:
    - id: expression-rule-confused
  - id: c
    text: '$\mathbb{Z}$ alone'
    issueSignals:
    - id: domain-rule-confused
  - id: d
    text: The braces alone
    issueSignals:
    - id: notation-role-confused
  answer:
    choiceId: a
  issueSignals:
  - id: expression-rule-confused
  difficultyDimensions:
  - representationTransfer
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Separates the ambient domain from the predicate in a novel set-builder statement.
  explanation: |-
    Solution: The condition $x^2<10$ is the filtering rule.
    Why it works: $x\in\mathbb{Z}$ identifies the candidate domain, while the expression after the colon decides which candidate integers enter $X$.
    Why the other choices fail: B is the element variable, C is only the domain, and D merely marks that a set is being described.
- id: q008
  type: multipleChoice
  prompt: 'Let $A=\{\varnothing\}$. Which statement is true?'
  choices:
  - id: a
    text: '$|A|=1$ and $\varnothing\in A$.'
  - id: b
    text: $|A|=0$ because its listed object has no elements.
    issueSignals:
    - id: container-content-confused
  - id: c
    text: '$\varnothing=A$ because both display the empty-set symbol.'
    issueSignals:
    - id: element-set-confused
  - id: d
    text: '$A\not\subseteq A$ because the empty set cannot be an element.'
    issueSignals:
    - id: subset-reflexivity-missed
  answer:
    choiceId: a
  issueSignals:
  - id: container-content-confused
  difficultyDimensions:
  - structuralRecognition
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Requires tracking the difference between an empty set and a set whose sole element is the
    empty set.
  explanation: |-
    Solution: $A$ has one element, namely $\varnothing$, so $|A|=1$ and $\varnothing\in A$.
    Why it works: Cardinality counts objects in the outer set, not objects inside its member.
    Why the other choices fail: B and C collapse the container with its member. D is false because every set, including $A$, is a subset of itself.
- id: q009
  type: multipleChoice
  prompt: 'Let $S=\{x\in\mathbb R:x\geq0\}$. Which claim is justified?'
  choices:
  - id: a
    text: '$0\in S$.'
  - id: b
    text: '$-1\in S$ because it is real.'
    issueSignals:
    - id: set-builder-condition-ignored
  - id: c
    text: $S$ contains only positive numbers.
    issueSignals:
    - id: domain-condition-ignored
  - id: d
    text: '$x\geq0$ declares the domain.'
    issueSignals:
    - id: expression-condition-confused
  answer:
    choiceId: a
  issueSignals:
  - id: set-builder-condition-ignored
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: Separates the real-number domain from the nonnegative filtering condition.
  explanation: |-
    Solution: $0\in S$.
    Why it works: Zero is real and satisfies $0\geq0$.
    Why the other choices fail: B ignores the inequality, C excludes the allowed boundary value zero, and D mistakes the filtering condition for the domain.
- id: q010
  type: multipleChoice
  prompt: 'If $g:\mathbb N\to\mathbb Z$, which statement is guaranteed by the arrow notation?'
  choices:
  - id: a
    text: Every permitted input is a natural number and every output lies in the integers.
  - id: b
    text: Every integer occurs as an output.
    issueSignals:
    - id: domain-rule-confused
  - id: c
    text: Negative integers may be used as inputs.
    issueSignals:
    - id: domain-rule-confused
  - id: d
    text: g is automatically one-to-one.
    issueSignals:
    - id: notation-role-confused
  answer:
    choiceId: a
  issueSignals:
  - id: domain-rule-confused
  difficultyDimensions:
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Distinguishes the input domain and output codomain from range and injectivity claims.
  explanation: |-
    Solution: The inputs are natural numbers and the outputs are integers.
    Why it works: In $g:A\to B$, A is the permitted input set and B is the codomain.
    Why the other choices fail: B confuses codomain with attained range, C changes the domain, and D adds an unstated one-to-one property.
