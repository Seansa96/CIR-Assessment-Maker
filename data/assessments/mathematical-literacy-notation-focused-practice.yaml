questions:
  - id: q001
    type: multipleChoice
    prompt: Let $A=\{1,\{2\}\}$. Which statement is true?
    choices:
      - { id: a, text: '$\{2\}\in A$' }
      - { id: b, text: '$2\in A$', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: c, text: '$\{1,2\}\subseteq A$', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: d, text: '$\{\{2\}\}\subseteq A$', issueSignals: [{ id: mathematical-translation-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: mathematical-translation-error }]
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    difficultyEvidence: Distinguishes an element from a nested set and separates membership from containment.
    explanation: |
      Solution: $\{2\}$ is explicitly one element of A, so $\{2\}\in A$.
      Why it works: Membership asks whether the whole object appears as an element in the set.
      Why the other choices fail: B removes the braces, C contains 2 which is not an element of A, and D would require $\{2\}$ itself to be a set inside A.
  - id: q002
    type: multipleChoice
    prompt: Which plain-language reading matches $\{x\in\mathbb Z:x^2<9\}$?
    choices:
      - { id: a, text: 'The integers whose squares are less than 9.' }
      - { id: b, text: 'All real numbers less than 9.', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: c, text: 'The square of every integer less than 9.', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: d, text: 'Integers greater than 9.', issueSignals: [{ id: mathematical-translation-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: mathematical-translation-error }]
    difficultyDimensions: [representationTransfer, domainCondition]
    difficultyEvidence: Requires separating the declared domain from the condition on the expression.
    explanation: |
      Solution: It is the set of integers x for which $x^2<9$.
      Why it works: The part $x\in\mathbb Z$ sets the domain, and the part after the colon supplies the condition.
      Why the other choices fail: B changes the domain, C changes the collected object, and D reverses the inequality.
  - id: q003
    type: multipleChoice
    prompt: In $f:\mathbb R\to\mathbb R$ with $f(x)=x^2$, what does the first $\mathbb R$ identify?
    choices:
      - { id: a, text: 'The domain, or permitted inputs.' }
      - { id: b, text: 'The range of values actually produced.', issueSignals: [{ id: expression-equation-recognition-error }] }
      - { id: c, text: 'The exponent on x.', issueSignals: [{ id: expression-equation-recognition-error }] }
      - { id: d, text: 'A claim that f is one-to-one.', issueSignals: [{ id: expression-equation-recognition-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: expression-equation-recognition-error }]
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    difficultyEvidence: Interprets function-arrow notation while separating domain, codomain, and range.
    explanation: |
      Solution: The first $\mathbb R$ is the domain.
      Why it works: In $f:A\to B$, A names the allowed inputs and B names the codomain.
      Why the other choices fail: B confuses codomain with range, while C and D are unrelated to arrow notation.
  - id: q004
    type: multipleChoice
    prompt: If $B=\{1,2\}$ and $A=\{1,2,3\}$, which statement is justified?
    choices:
      - { id: a, text: '$B\subseteq A$' }
      - { id: b, text: '$A\subseteq B$', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: c, text: '$A\in B$', issueSignals: [{ id: mathematical-translation-error }] }
      - { id: d, text: '$3\in B$', issueSignals: [{ id: mathematical-translation-error }] }
    answer: { choiceId: a }
    issueSignals: [{ id: mathematical-translation-error }]
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    difficultyEvidence: Checks every element for a containment claim and rejects reversed direction.
    explanation: |
      Solution: Every element of B, namely 1 and 2, belongs to A.
      Why it works: $B\subseteq A$ requires all elements of B to occur in A.
      Why the other choices fail: B reverses containment, C asks membership of an entire set without evidence, and D is false.
