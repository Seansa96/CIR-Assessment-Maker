lesson:
  introduction: |-
    When multiple angles are put together, they often form special relationships. Recognizing these relationships is crucial for solving geometry problems and writing proofs.
  sections:
  - id: sec-adjacent
    title: Adjacent Angles
    required: true
    content: |-
      **Adjacent angles** are two angles that lie in the same plane, share a common vertex and a common side, but have no common interior points.
      
      Think of them as "next-door neighbors" that share a wall.

  - id: sec-comp-supp
    title: Complementary and Supplementary Angles
    required: true
    content: |-
      Two angles are **complementary** if the sum of their measures is exactly $90^\circ$. Each angle is the complement of the other. For example, a $30^\circ$ angle and a $60^\circ$ angle are complementary.
      
      Two angles are **supplementary** if the sum of their measures is exactly $180^\circ$. Each angle is the supplement of the other. For example, a $100^\circ$ angle and an $80^\circ$ angle are supplementary.
      
      A common mnemonic: **C**omplementary makes a **C**orner ($90^\circ$), and **S**upplementary makes a **S**traight line ($180^\circ$).

  - id: sec-vertical
    title: Vertical Angles and Linear Pairs
    required: true
    content: |-
      A **linear pair** is a pair of adjacent angles whose noncommon sides are opposite rays. Because the noncommon sides form a straight line, the angles in a linear pair are always supplementary (they sum to $180^\circ$).
      
      When two lines intersect, they form four angles. The angles that are opposite each other are called **vertical angles**. 
      
      **The Vertical Angles Theorem**: Vertical angles are always congruent (they have the exact same measure). If two intersecting lines form angles $1, 2, 3$, and $4$ in a circle, $\angle 1$ and $\angle 3$ are vertical and congruent, and $\angle 2$ and $\angle 4$ are vertical and congruent.

      Compare the four diagrams below. Adjacent angles share a side, complementary and supplementary relationships depend on the sum of their measures, and intersecting lines create both congruent vertical angles and supplementary linear pairs.

      ![Examples of adjacent, complementary, supplementary, vertical, and linear-pair angle relationships](/assessments/geometry/angle-pair-relationship-examples.svg)

questions:
- id: q-geom-pla2-1
  title: Concept Check - Finding the Supplement
  prompt: |-
    If an angle measures $115^\circ$, what is the measure of its supplement?
  type: numericResponse
  answer:
    numericValue: 65
    tolerance: 0
  explanation: |-
    Supplementary angles sum to $180^\circ$.
    $$180^\circ - 115^\circ = 65^\circ$$
  skills:
  - geometry-points-lines-angles

- id: q-geom-pla2-2
  title: Concept Check - Vertical Angles
  prompt: |-
    Two intersecting lines form vertical angles $\angle 1$ and $\angle 2$. If $m\angle 1 = 40^\circ$, what is $m\angle 2$?
  type: numericResponse
  answer:
    numericValue: 40
    tolerance: 0
  explanation: |-
    The Vertical Angles Theorem states that vertical angles are always congruent. Therefore, $m\angle 2$ is exactly the same as $m\angle 1$, which is $40^\circ$.
  skills:
  - geometry-points-lines-angles
