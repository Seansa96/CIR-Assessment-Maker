schemaVersion: 1
id: aops-angles-glossary
title: Angles Glossary
assessmentType: glossary
categoryId: art-of-problem-solving
topicId: aops-angles
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: glossary
  tags: [art-of-problem-solving, aops-angles, angle-vocabulary, circle-angle-vocabulary, geometry]
skills:
- Interpret line, triangle, parallel-line, and circle-angle terminology
- Match angle names to exact theorem hypotheses
- Distinguish a theorem from its converse
glossary:
  introduction: |-
    Angle names encode theorem conditions. The vocabulary below identifies the vertex, position, and intercepted object that make an equality or supplementary relation valid.
  sections:
  - id: angle-and-line-language
    title: Angle and Line Language
    required: true
    content: Basic objects and positional relationships determine which equations may be written.
    entries:
    - id: ray
      term: Ray
      definition: Part of a line beginning at one endpoint and extending indefinitely in one direction.
      notation: '$\overrightarrow{AB}$'
      examples: ['$\overrightarrow{AB}$ begins at $A$ and passes through $B$.']
      aliases: []
      media: []
      tags: [ray]
      drills:
      - id: ray-drill
        type: flashcard
        prompt: Which letter names the endpoint of $\overrightarrow{AB}$?
        answer: {expected: A}
        explanation: The first letter names the endpoint.
        tags: [ray]
    - id: angle-vertex
      term: Angle Vertex
      definition: The common endpoint of the two rays forming an angle.
      notation: '$\angle ABC$ has vertex $B$'
      examples: ['In $\angle ABC$, rays $BA$ and $BC$ meet at $B$.']
      aliases: [vertex]
      media: []
      tags: [angle-vertex]
      drills:
      - id: angle-vertex-drill
        type: typed
        prompt: What is the vertex of $\angle PQR$?
        answer: {expected: Q}
        explanation: The middle letter names the vertex.
        tags: [angle-vertex]
    - id: degree
      term: Degree
      definition: An angle unit in which one full turn is $360$ degrees.
      notation: '$^\circ$'
      examples: ['$90^\circ$ is one quarter turn.']
      aliases: []
      media: []
      tags: [degree]
      drills:
      - id: degree-drill
        type: typed
        prompt: How many degrees are in a straight angle?
        answer: {expected: '180'}
        explanation: A straight angle is half of a full turn.
        tags: [degree]
    - id: radian
      term: Radian
      definition: An angle unit in which one full turn is $2\pi$ radians.
      notation: '$\text{rad}$'
      examples: ['$\pi/2$ radians equals $90^\circ$.']
      aliases: []
      media: []
      tags: [radian]
      drills:
      - id: radian-drill
        type: typed
        prompt: How many radians are in a straight angle?
        answer:
          expected: pi
          aliases: ['$\pi$']
        explanation: A straight angle is half of $2\pi$.
        tags: [radian]
    - id: vertical-angles
      term: Vertical Angles
      definition: Opposite, nonadjacent angles formed by two intersecting lines; they are equal.
      notation: null
      examples: ['If one intersection angle is $74^\circ$, its vertical angle is $74^\circ$.']
      aliases: [vertically opposite angles]
      media: []
      tags: [vertical-angles]
      drills:
      - id: vertical-angles-drill
        type: flashcard
        prompt: What relationship holds between vertical angles?
        answer: {expected: They are equal.}
        explanation: Each is supplementary to the same adjacent angle.
        tags: [vertical-angles]
    - id: linear-pair
      term: Linear Pair
      definition: Adjacent angles whose noncommon sides are opposite rays; their measures sum to $180^\circ$.
      notation: null
      examples: ['$62^\circ$ and $118^\circ$ form a linear pair.']
      aliases: []
      media: []
      tags: [linear-pair]
      drills:
      - id: linear-pair-drill
        type: flashcard
        prompt: What extra condition beyond adjacency makes two angles a linear pair?
        answer: {expected: Their noncommon sides are opposite rays and form a straight line.}
        explanation: Adjacent angles alone need not sum to $180^\circ$.
        tags: [linear-pair]
    - id: transversal
      term: Transversal
      definition: A line intersecting two or more other lines at distinct points.
      notation: null
      examples: ['Line $t$ crosses parallel lines $l,m$.']
      aliases: []
      media: []
      tags: [transversal]
      drills:
      - id: transversal-drill
        type: flashcard
        prompt: What object creates corresponding and alternate-interior angle positions?
        answer: {expected: A transversal crossing the two lines.}
        explanation: The positions are defined relative to its intersections.
        tags: [transversal]
    - id: corresponding-angles
      term: Corresponding Angles
      definition: Angles in the same relative corner at two intersections of a transversal; they are equal when the lines are parallel.
      notation: null
      examples: []
      aliases: []
      media: []
      tags: [corresponding-angles]
      drills:
      - id: corresponding-angles-drill
        type: flashcard
        prompt: What conclusion follows when corresponding angles are equal?
        answer: {expected: By the converse theorem, the two lines are parallel.}
        explanation: The angles must be corresponding relative to one transversal.
        tags: [corresponding-angles]
    - id: alternate-interior-angles
      term: Alternate Interior Angles
      definition: Interior angles on opposite sides of a transversal; they are equal when the crossed lines are parallel.
      notation: null
      examples: ['The $62^\circ$ angle and $x$ in the line diagram are alternate interior.']
      aliases: []
      media: []
      tags: [alternate-interior]
      drills:
      - id: alternate-interior-drill
        type: flashcard
        prompt: What relationship holds for alternate interior angles of parallel lines?
        answer: {expected: They are equal.}
        explanation: Both the position and parallel hypothesis matter.
        tags: [alternate-interior]
    - id: same-side-interior-angles
      term: Same-Side Interior Angles
      definition: Interior angles on the same side of a transversal; they are supplementary when the crossed lines are parallel.
      notation: null
      examples: []
      aliases: [consecutive interior angles]
      media: []
      tags: [same-side-interior]
      drills:
      - id: same-side-interior-drill
        type: typed
        prompt: What sum do same-side interior angles have for parallel lines?
        answer: {expected: '180'}
        explanation: They are supplementary.
        tags: [same-side-interior]
    - id: exterior-angle
      term: Triangle Exterior Angle
      definition: An angle formed by one triangle side and the extension of an adjacent side; it equals the sum of the two remote interior angles.
      notation: null
      examples: ['$48^\circ+67^\circ=115^\circ$ in the triangle diagram.']
      aliases: []
      media: []
      tags: [exterior-angle]
      drills:
      - id: exterior-angle-drill
        type: flashcard
        prompt: Which triangle angles sum to an exterior angle?
        answer: {expected: The two remote interior angles.}
        explanation: The adjacent interior angle instead forms a linear pair with it.
        tags: [exterior-angle]
  - id: circle-angle-language
    title: Circle-Angle Language
    required: true
    content: Circle formulas are selected by vertex location and the intercepted arcs.
    entries:
    - id: intercepted-arc
      term: Intercepted Arc
      definition: The arc lying between the two points where an angle's sides meet a circle.
      notation: '$\widehat{AB}$'
      examples: ['$\angle AOB$ and $\angle ACB$ can intercept the same arc $AB$.']
      aliases: []
      media: []
      tags: [intercepted-arc]
      drills:
      - id: intercepted-arc-drill
        type: flashcard
        prompt: Why must the intercepted arc be identified before applying a circle-angle theorem?
        answer: {expected: The angle formula uses the measure of the specific arc cut off by its sides.}
        explanation: Minor and major arcs produce different measures.
        tags: [intercepted-arc]
    - id: central-angle
      term: Central Angle
      definition: An angle whose vertex is the center of a circle; its measure equals its intercepted arc.
      notation: '$\angle AOB$'
      examples: []
      aliases: []
      media: []
      tags: [central-angle]
      drills:
      - id: central-angle-drill
        type: flashcard
        prompt: Where is the vertex of a central angle?
        answer: {expected: At the circle center.}
        explanation: Vertex location distinguishes it from an inscribed angle.
        tags: [central-angle]
    - id: inscribed-angle
      term: Inscribed Angle
      definition: An angle whose vertex lies on a circle and whose sides are chords; its measure is half its intercepted arc.
      notation: '$\angle ACB$'
      examples: ['An inscribed angle intercepting a diameter is $90^\circ$.']
      aliases: []
      media: []
      tags: [inscribed-angle]
      drills:
      - id: inscribed-angle-drill
        type: flashcard
        prompt: How does an inscribed angle compare with a central angle intercepting the same arc?
        answer: {expected: It is half the central angle.}
        explanation: Equivalently, the central angle is twice the inscribed angle.
        tags: [inscribed-angle]
    - id: tangent-chord-angle
      term: Tangent-Chord Angle
      definition: An angle formed by a tangent and a chord at the tangency point; it equals half its intercepted arc.
      notation: null
      examples: ['It equals an inscribed angle intercepting the same chord.']
      aliases: [alternate segment angle]
      media: []
      tags: [tangent-chord]
      drills:
      - id: tangent-chord-drill
        type: flashcard
        prompt: What circle object must one side of a tangent-chord angle be?
        answer: {expected: A tangent at the angle's vertex.}
        explanation: A secant or ordinary chord changes the configuration.
        tags: [tangent-chord]
    - id: converse
      term: Converse
      definition: The statement formed by exchanging a theorem's hypothesis and conclusion; it requires its own proof.
      notation: null
      examples: ['Equal corresponding angles can prove lines parallel.']
      aliases: [converse theorem]
      media: []
      tags: [converse]
      drills:
      - id: converse-drill
        type: flashcard
        prompt: Why can a theorem not automatically justify its converse?
        answer: {expected: Reversing a valid implication may be false unless separately proved.}
        explanation: Geometry uses specific established converses.
        tags: [converse]
