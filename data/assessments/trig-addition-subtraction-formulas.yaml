questions:
- id: q001
  type: multipleChoice
  prompt: Which is the correct sine addition formula?
  choices:
  - id: a
    text: $\sin(A+B)=\sin A\cos B+\cos A\sin B$
  - id: b
    text: $\sin(A+B)=\sin A\sin B+\cos A\cos B$
  - id: c
    text: $\sin(A+B)=\sin A+\sin B$
  - id: d
    text: $\sin(A+B)=\cos A\cos B-\sin A\sin B$
  answer:
    choiceId: a
  explanation: 'Sine of a sum combines sine-cosine and cosine-sine terms.


    Related topic: Sine Addition Formula

    '
- id: q002
  type: multipleChoice
  prompt: Which is the correct cosine addition formula?
  choices:
  - id: a
    text: $\cos(A+B)=\cos A\cos B-\sin A\sin B$
  - id: b
    text: $\cos(A+B)=\cos A\cos B+\sin A\sin B$
  - id: c
    text: $\cos(A+B)=\cos A+\cos B$
  - id: d
    text: $\cos(A+B)=\sin A\cos B+\cos A\sin B$
  answer:
    choiceId: a
  explanation: 'Cosine of a sum uses the product of cosines minus the product of sines.


    Related topic: Cosine Addition Formula

    '
- id: q003
  type: multipleChoice
  prompt: Which is the correct sine subtraction formula?
  choices:
  - id: a
    text: $\sin(A-B)=\sin A\cos B-\cos A\sin B$
  - id: b
    text: $\sin(A-B)=\sin A\cos B+\cos A\sin B$
  - id: c
    text: $\sin(A-B)=\cos A\cos B+\sin A\sin B$
  - id: d
    text: $\sin(A-B)=\sin A-\sin B$
  answer:
    choiceId: a
  explanation: 'Changing from addition to subtraction changes the sign between the
    two sine formula terms.


    Related topic: Sine Difference Formula

    '
- id: q004
  type: multipleChoice
  prompt: Which is the correct cosine subtraction formula?
  choices:
  - id: a
    text: $\cos(A-B)=\cos A\cos B+\sin A\sin B$
  - id: b
    text: $\cos(A-B)=\cos A\cos B-\sin A\sin B$
  - id: c
    text: $\cos(A-B)=\sin A\cos B-\cos A\sin B$
  - id: d
    text: $\cos(A-B)=\cos A-\cos B$
  answer:
    choiceId: a
  explanation: 'Cosine subtraction has a plus sign between the cosine-cosine and sine-sine
    products.


    Related topic: Cosine Difference Formula

    '
- id: q005
  type: multipleChoice
  prompt: Which formula should you use to find $\sin75^\circ$ exactly?
  choices:
  - id: a
    text: $\sin(45^\circ+30^\circ)$
  - id: b
    text: $\cos(45^\circ+30^\circ)$
  - id: c
    text: $\sin(90^\circ-75^\circ)$
  - id: d
    text: $\tan(45^\circ+30^\circ)$
  answer:
    choiceId: a
  explanation: 'Since $75^\circ=45^\circ+30^\circ$, the sine addition formula is the
    direct tool.


    Related topic: Exact Values with Sum Formulas

    '
- id: q006
  type: multipleChoice
  prompt: Evaluate $\cos(60^\circ+30^\circ)$.
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: $\frac12$
  - id: d
    text: $\frac{\sqrt3}{2}$
  answer:
    choiceId: a
  explanation: '$60^\circ+30^\circ=90^\circ$, and $\cos90^\circ=0$.


    Related topic: Applying Angle Addition

    '
- id: q007
  type: multipleChoice
  prompt: Which expression equals $\cos15^\circ$?
  choices:
  - id: a
    text: $\cos45^\circ\cos30^\circ+\sin45^\circ\sin30^\circ$
  - id: b
    text: $\cos45^\circ\cos30^\circ-\sin45^\circ\sin30^\circ$
  - id: c
    text: $\sin45^\circ\cos30^\circ+\cos45^\circ\sin30^\circ$
  - id: d
    text: $\cos45^\circ+\cos30^\circ$
  answer:
    choiceId: a
  explanation: 'Since $15^\circ=45^\circ-30^\circ$, use $\cos(A-B)$, which has a plus
    sign.


    Related topic: Exact Values with Difference Formulas

    '
- id: q008
  type: multipleChoice
  prompt: Which formula is correct for tangent addition?
  choices:
  - id: a
    text: $\tan(A+B)=\frac{\tan A+\tan B}{1-\tan A\tan B}$
  - id: b
    text: $\tan(A+B)=\tan A+\tan B$
  - id: c
    text: $\tan(A+B)=\frac{\tan A-\tan B}{1+\tan A\tan B}$
  - id: d
    text: $\tan(A+B)=\frac{1-\tan A\tan B}{\tan A+\tan B}$
  answer:
    choiceId: a
  explanation: 'Tangent addition has the sum of tangents in the numerator and $1-\tan
    A\tan B$ in the denominator.


    Related topic: Tangent Addition Formula

    '
- id: q009
  type: multipleChoice
  prompt: Which formula is correct for tangent subtraction?
  choices:
  - id: a
    text: $\tan(A-B)=\frac{\tan A-\tan B}{1+\tan A\tan B}$
  - id: b
    text: $\tan(A-B)=\frac{\tan A+\tan B}{1-\tan A\tan B}$
  - id: c
    text: $\tan(A-B)=\tan A-\tan B$
  - id: d
    text: $\tan(A-B)=\frac{1+\tan A\tan B}{\tan A-\tan B}$
  answer:
    choiceId: a
  explanation: 'Tangent subtraction uses a difference in the numerator and a plus
    sign in the denominator.


    Related topic: Tangent Difference Formula

    '
- id: q010
  type: multipleChoice
  prompt: What common mistake do the addition formulas help avoid?
  choices:
  - id: a
    text: Assuming trig functions distribute over addition
  - id: b
    text: Using radians instead of degrees
  - id: c
    text: Drawing right triangles
  - id: d
    text: Using exact values
  answer:
    choiceId: a
  explanation: 'In general, $\sin(A+B)\ne\sin A+\sin B$ and $\cos(A+B)\ne\cos A+\cos
    B$.


    Related topic: Common Mistakes with Angle Formulas

    '
