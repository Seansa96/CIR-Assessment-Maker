- id: img-convtest-022
  concept: Ratio Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{n^5}{e^n}$.
  explanation: |-
    Solution: Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges. Therefore the answer is Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges.. Therefore the answer is Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges.. Therefore the answer is Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges.. Therefore the answer is Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges.. Therefore the answer is Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges..

    Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

    Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.
