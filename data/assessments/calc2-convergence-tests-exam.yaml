  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n n}{n^2+1}$.
  explanation: |-
    Solution: $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges. Therefore the answer is $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges.. Therefore the answer is $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges.. Therefore the answer is $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges.. Therefore the answer is $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges.. Therefore the answer is $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges..

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

