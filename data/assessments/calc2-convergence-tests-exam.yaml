questions:
- id: img-convtest-021-v1
  concept: Absolute Convergence
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{(-1)^n \arctan(n^2)}{n^3}$.
  explanation: |-
    $|a_n| < \pi/(2n^3)$. Absolutely converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $|a_n| < \pi/(2n^3)$. Absolutely converges.
- id: img-convtest-022
  concept: Ratio Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{n^5}{e^n}$.
  explanation: |-
    Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Ratio: $\frac{(n+1)^5}{e^{n+1}} \cdot \frac{e^n}{n^5} = \frac{(n+1)^5}{en^5} \to 1/e < 1$. Converges.
- id: img-convtest-005-v2
  concept: Ratio Test
  source: Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{(2n)!}{n^{2n}}$.
  explanation: |-
    Ratio: $\frac{(2n+2)(2n+1)}{n^2(1+1/n)^{2n}} \sim \frac{4}{e^2} < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Ratio: $\frac{(2n+2)(2n+1)}{n^2(1+1/n)^{2n}} \sim \frac{4}{e^2} < 1$. Converges.
- id: img-convtest-031
  concept: Series Properties
  source: Tests For Convergence/pset_7.png
  prompt: |-
    True/False: If $\sum a_n$ and $\sum b_n$ both diverge, then $\sum (a_n+b_n)$ diverges.
  explanation: |-
    False. Example: $a_n = 1/n$, $b_n = -1/n$. Both diverge, but $\sum (a_n+b_n) = 0$.
  type: multipleChoice
  choices:
  - id: 'true'
    text: 'True'
  - id: 'false'
    text: 'False'
  answer:
    choiceId: 'false'
- id: img-convtest-024-v2
  concept: Direct Comparison Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{2^n \cos^{2n} \theta}{n}$.
  explanation: |
    Converges for $\theta\in(\pi/4,\pi/2]$, where $2\cos^2\theta<1$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |
      Converges for $\theta\in(\pi/4,\pi/2]$, where $2\cos^2\theta<1$.
- id: img-convtest-029-v3
  concept: Root Test
  source: Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum (-1)^n \left(\frac{n+1}{3n-2}\right)^n$.
  explanation: |-
    Absolutely converges (root test: $1/3<1$).
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Absolutely converges (root test: $1/3<1$).
- id: img-convtest-023-v3
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{\sqrt{n^2+n}}$.
  explanation: |-
    AST: converges. Conditionally converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      AST: converges. Conditionally converges.
- id: img-convtest-025-v1
  concept: Direct Comparison Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{1}{n^{4/3}+2}$.
  explanation: |-
    LCT with $1/n^{4/3}$. Converges ($p=4/3>1$).
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      LCT with $1/n^{4/3}$. Converges ($p=4/3>1$).
- id: img-convtest-029-v2
  concept: Root Test
  source: Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \left(\frac{n^2+1}{2n^2-1}\right)^n$.
  explanation: |-
    Root: $1/2 < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Root: $1/2 < 1$. Converges.
- id: img-convtest-002-v3
  concept: Ratio Test
  source: Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{3^{2n}}{(2n)!}$.
  explanation: |-
    Ratio: $9/((2n+2)(2n+1)) \to 0 < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Ratio: $9/((2n+2)(2n+1)) \to 0 < 1$. Converges.
- id: img-convtest-019-v2
  concept: Root Test
  source: Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{n^n}{(-3)^n}$.
  explanation: |
    The root-test limit is $n/3\to\infty$, so the series diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |
      The root-test limit is $n/3\to\infty$, so the series diverges.
- id: img-convtest-033
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{1}{n^{1+1/n}}$.
  explanation: |-
    $n^{1+1/n} = n \cdot n^{1/n} \sim n \cdot e^{(\ln n)/n} \sim n$. LCT with $1/n$: $\to 1$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $n^{1+1/n} = n \cdot n^{1/n} \sim n \cdot e^{(\ln n)/n} \sim n$. LCT with $1/n$: $\to 1$. Diverges.
- id: img-convtest-031-v1
  concept: Series Properties
  source: Tests For Convergence/pset_7.png
  prompt: |-
    True/False: If $\sum a_n$ converges and $\sum b_n$ diverges, then $\sum (a_n+b_n)$ diverges.
  explanation: |-
    True. If it converged, $\sum b_n = \sum (a_n+b_n) - \sum a_n$ would converge (contradiction).
  type: multipleChoice
  choices:
  - id: 'true'
    text: 'True'
  - id: 'false'
    text: 'False'
  answer:
    choiceId: 'true'
- id: img-convtest-036
  concept: Alternating Series Test
  source: Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{(-1)^n n^2}{n^3+1}$.
  explanation: |-
    $b_n = n^2/(n^3+1) \to 0$, decreasing (eventually). AST: converges. Absolute: $\sim 1/n$: diverges. Conditionally converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $b_n = n^2/(n^3+1) \to 0$, decreasing (eventually). AST: converges. Absolute: $\sim 1/n$: diverges. Conditionally converges.
- id: img-convtest-036-v2
  concept: Alternating Series Test
  source: Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{(-1)^n n^4}{n^5+1}$.
  explanation: |-
    AST: converges. Absolute diverges. Conditionally converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      AST: converges. Absolute diverges. Conditionally converges.
- id: img-convtest-005-v3
  concept: Ratio Test
  source: Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{n!}{(2n)^n}$.
  explanation: |-
    Ratio: $\frac{n+1}{2(n+1)(1+1/n)^n} \to 1/2e < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Ratio: $\frac{n+1}{2(n+1)(1+1/n)^n} \to 1/2e < 1$. Converges.
- id: img-convtest-001-v1
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_1.png
  prompt: |-
    Test $\sum \frac{n^4}{n^5+2}$.
  explanation: |-
    LCT with $1/n$: limit $= 1 > 0$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      LCT with $1/n$: limit $= 1 > 0$. Diverges.
- id: img-convtest-009
  concept: Alternating Series Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n n}{n^2+1}$.
  explanation: |-
    $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $b_n = n/(n^2+1)$, decreasing to 0. AST: converges. Absolute: LCT with $1/n$: diverges. Conditionally converges.
- id: img-convtest-004-v3
  concept: Direct Comparison Test
  source: Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{n}{2^n+1}$.
  explanation: |-
    Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges.
- id: img-convtest-028-v3
  concept: Alternating Series Test
  source: Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \frac{(-1)^n}{\ln n - n}$.
  explanation: |-
    Same as $-1$ times $\sum (-1)^n/(n-\ln n)$. Conditionally converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Same as $-1$ times $\sum (-1)^n/(n-\ln n)$. Conditionally converges.
- id: img-convtest-005-v1
  concept: Ratio Test
  source: Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{(n+1)!}{n^n}$.
  explanation: |-
    Ratio: $\frac{n+2}{(n+1)(1+1/n)^n} \to \infty$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Ratio: $\frac{n+2}{(n+1)(1+1/n)^n} \to \infty$. Diverges.
- id: img-convtest-022-v1
  concept: Ratio Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{n^3}{2^n}$.
  explanation: |-
    Ratio test: $1/2 < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Ratio test: $1/2 < 1$. Converges.
- id: img-convtest-013
  concept: Ratio Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{n^n}{(2n)!}$.
  explanation: |-
    Ratio: $\frac{(n+1)^{n+1}}{(2n+2)!} \cdot \frac{(2n)!}{n^n} = \frac{(n+1)^{n+1}}{(2n+2)(2n+1)n^n} \sim \frac{en}{4n^2} = \frac{e}{4n} \to 0 < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Ratio: $\frac{(n+1)^{n+1}}{(2n+2)!} \cdot \frac{(2n)!}{n^n} = \frac{(n+1)^{n+1}}{(2n+2)(2n+1)n^n} \sim \frac{en}{4n^2} = \frac{e}{4n} \to 0 < 1$. Converges.
- id: img-convtest-004-v2
  concept: Direct Comparison Test
  source: Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{1}{2^n-1}$.
  explanation: |-
    LCT with $1/2^n$: limit is $1 > 0$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      LCT with $1/2^n$: limit is $1 > 0$. Converges.
- id: img-convtest-018
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{\sin(1/n)}{n}$.
  explanation: |-
    $\sin(1/n) \sim 1/n$ for large $n$. LCT with $1/n^2$: $\lim n^2 \sin(1/n)/n = \lim n\sin(1/n) = 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $\sin(1/n) \sim 1/n$ for large $n$. LCT with $1/n^2$: $\lim n^2 \sin(1/n)/n = \lim n\sin(1/n) = 1$. Converges.
