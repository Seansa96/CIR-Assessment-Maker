- id: img-convtest-031
  concept: Series Properties
  source: Tests For Convergence/pset_7.png
  prompt: |-
    True/False: If $\sum a_n$ and $\sum b_n$ both diverge, then $\sum (a_n+b_n)$ diverges.
  explanation: |-
    Solution: False. Example: $a_n = 1/n$, $b_n = -1/n$. Both diverge, but $\sum (a_n+b_n) = 0$. Therefore the answer is False.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: True conflicts with this criterion: Direct comparison uses nonnegative terms.
