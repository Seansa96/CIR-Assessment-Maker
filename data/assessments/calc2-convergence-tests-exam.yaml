- id: img-convtest-004-v3
  concept: Direct Comparison Test
  source: Tests For Convergence/pset_2.png
  prompt: |-
    Test $\sum \frac{n}{2^n+1}$.
  explanation: |-
    Solution: Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges. Therefore the answer is Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges.. Therefore the answer is Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges.. Therefore the answer is Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges.. Therefore the answer is Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges.. Therefore the answer is Comparison: $n/(2^n+1) < n/2^n$. Ratio test on $n/2^n$ gives $1/2 < 1$. Converges..

    Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

    Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.
