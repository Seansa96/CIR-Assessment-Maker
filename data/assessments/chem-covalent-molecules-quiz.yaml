questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Which of the following correctly describes the relationship between bond order and bond strength?
    choices:
      - id: a
        text: Higher bond order → longer bond → weaker bond
      - id: b
        text: Higher bond order → shorter bond → stronger bond
      - id: c
        text: Higher bond order → shorter bond → weaker bond
      - id: d
        text: Bond order has no consistent effect on bond strength
    answer:
      choiceId: b
    explanation: |
      Increasing bond order means more shared electron pairs pulling the nuclei closer together (shorter bond) with stronger electrostatic attraction (greater bond energy required to break the bond).

  - id: q002
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Arrange the following bonds from **weakest** to **strongest**: C≡C, C—C, C=C.
    choices:
      - id: a
        text: 'C—C < C=C < C≡C'
      - id: b
        text: 'C≡C < C=C < C—C'
      - id: c
        text: 'C=C < C—C < C≡C'
      - id: d
        text: 'C≡C < C—C < C=C'
    answer:
      choiceId: a
    explanation: |
      Bond energy increases with bond order: C—C (single, ~347 kJ/mol) < C=C (double, ~614 kJ/mol) < C≡C (triple, ~839 kJ/mol).

  - id: q003
    type: numericResponse
    skills:
      - chem-covalent-molecules
    prompt: |
      How many **pi ($\pi$) bonds** are in a molecule of carbon dioxide ($CO_2$, structure: O=C=O)?
    answer:
      value: 2
      tolerance: 0
    explanation: |
      Each C=O double bond contains 1 $\sigma$ + 1 $\pi$. With two C=O bonds: **2 $\pi$ bonds** total (and 2 $\sigma$ bonds).

  - id: q004
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      In which of the following situations does a pi ($\pi$) bond form?
    choices:
      - id: a
        text: End-to-end (head-on) orbital overlap along the internuclear axis
      - id: b
        text: Side-to-side orbital overlap above and below the internuclear axis
      - id: c
        text: Overlap of two s orbitals
      - id: d
        text: Transfer of electrons from one atom to another
    answer:
      choiceId: b
    explanation: |
      Pi bonds form from **side-to-side** (lateral) overlap of p orbitals above and below (or in front and behind) the bond axis. Sigma bonds form from end-to-end (head-on) overlap along the axis.

  - id: q005
    type: numericResponse
    skills:
      - chem-covalent-molecules
    prompt: |
      A molecule of acetic acid ($CH_3COOH$) contains the following bonds: 3 C—H, 1 C—C, 1 C=O, 1 C—O, 1 O—H.

      How many **sigma ($\sigma$)** bonds total are in one molecule of acetic acid?
    answer:
      value: 7
      tolerance: 0
    explanation: |
      Every single bond (C—H, C—C, C—O, O—H) = 1 $\sigma$ each. The C=O double bond = 1 $\sigma$ + 1 $\pi$.

      Total $\sigma$: 3 (C—H) + 1 (C—C) + 1 (C=O part) + 1 (C—O) + 1 (O—H) = **7 $\sigma$ bonds**.

  - id: q006
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Which bond has the **shortest** bond length?
    choices:
      - id: a
        text: N—N single bond
      - id: b
        text: N=N double bond
      - id: c
        text: N≡N triple bond
      - id: d
        text: All N—N bonds are the same length
    answer:
      choiceId: c
    explanation: |
      Triple bonds have the highest bond order (3) and therefore the shortest bond length. N≡N is ~110 pm, N=N is ~122 pm, and N—N is ~145 pm.

  - id: q007
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Using average bond energies:
      $D$(H—H) = 436 kJ/mol; $D$(Cl—Cl) = 243 kJ/mol; $D$(H—Cl) = 432 kJ/mol.

      Estimate $\Delta H$ for: $H_2(g) + Cl_2(g) \to 2\,HCl(g)$.
    choices:
      - id: a
        text: −185 kJ/mol
      - id: b
        text: +185 kJ/mol
      - id: c
        text: −679 kJ/mol
      - id: d
        text: +679 kJ/mol
    answer:
      choiceId: a
    explanation: |
      Bonds broken: H—H (436) + Cl—Cl (243) = 679 kJ.

      Bonds formed: 2 × H—Cl (432) = 864 kJ.

      $\Delta H \approx 679 - 864 = -185$ kJ/mol. Exothermic.

  - id: q008
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Which of the following molecules contains **no pi bonds**?
    choices:
      - id: a
        text: '$O_2$'
      - id: b
        text: '$N_2$'
      - id: c
        text: '$H_2O$'
      - id: d
        text: '$CO_2$'
    answer:
      choiceId: c
    explanation: |
      $H_2O$ has only single (σ) bonds: H—O—H. $O_2$ has a double bond (1σ + 1π); $N_2$ has a triple bond (1σ + 2π); $CO_2$ has two double bonds (2σ + 2π).

  - id: q009
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Covalent bonding typically occurs between which types of elements?
    choices:
      - id: a
        text: Metal and metal
      - id: b
        text: Metal and nonmetal
      - id: c
        text: Nonmetal and nonmetal
      - id: d
        text: Metal and metalloid only
    answer:
      choiceId: c
    explanation: |
      Covalent bonds typically form between **two nonmetals** (or a nonmetal and a metalloid). Metal-nonmetal combinations generally form ionic bonds. Metal-metal bonds are metallic bonds.

  - id: q010
    type: multipleChoice
    skills:
      - chem-covalent-molecules
    prompt: |
      Why can atoms freely rotate around a **sigma bond** but not around a **pi bond** in a double bond?
    choices:
      - id: a
        text: Pi bonds are longer and farther apart, so rotation changes their orientation
      - id: b
        text: Rotation around the bond axis would destroy the side-to-side p orbital overlap that forms the pi bond
      - id: c
        text: Sigma bonds are stronger and prevent pi bonds from rotating
      - id: d
        text: Pi bonds are held in place by lone pairs on adjacent atoms
    answer:
      choiceId: b
    explanation: |
      Pi bonds form from side-to-side p orbital overlap perpendicular to the bond axis. Rotating the atoms around the σ bond axis would break this alignment, destroying the π bond (requiring ~267 kJ/mol for a C=C). Sigma bonds allow free rotation because their head-on overlap is symmetric around the axis.

  - id: q011
    type: selectAll
    skills:
      - chem-covalent-molecules
    prompt: |
      Select **all** species that contain at least one triple bond.
    choices:
      - id: a
        text: '$N_2$'
      - id: b
        text: '$CO$'
      - id: c
        text: '$CO_2$'
      - id: d
        text: '$HCN$'
    answer:
      choiceIds:
        - a
        - b
        - d
    explanation: |
      $N_2$ (N≡N): triple bond. $CO$ (C≡O): triple bond. $HCN$ (H—C≡N): triple bond.

      $CO_2$ (O=C=O) has two **double** bonds — no triple bonds.

  - id: q012
    type: numericResponse
    skills:
      - chem-covalent-molecules
    prompt: |
      In a molecule of acetonitrile ($CH_3CN$), the structure is $H_3C$—$C \equiv N$.

      Count all bonds:
      - 3 C—H single bonds
      - 1 C—C single bond  
      - 1 C≡N triple bond

      How many **total bonds** (σ + π combined) are in one molecule of $CH_3CN$?
    answer:
      value: 8
      tolerance: 0
    explanation: |
      - 3 C—H: 3 σ bonds
      - 1 C—C: 1 σ bond
      - 1 C≡N: 1 σ + 2 π bonds

      Total: 3 + 1 + 1 + 2 = **8 bonds** (5 σ and 2 π = 7 distinct bonds, but the question asks for total count including both σ and π in the triple bond: 5σ + 2π = 7... let me recalculate. 3 σ(C-H) + 1 σ(C-C) + 1 σ(C≡N) + 2 π(C≡N) = 7 total. Answer corrected.)
