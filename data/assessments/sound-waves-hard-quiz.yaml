- id: q001
  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: On a day when the air temperature is 9.4 degrees Celsius... A tuning fork
    emits a 379.4 Hz tone. What is the wavelength of the sound wave in meters?
  answer:
    value: 0.8873
    tolerance: 0.05
  explanation: lambda = v/f = 336.64 / 379.4 = 0.8873 m.
- id: q002
  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: In a desert environment with an air temperature of 5.9 C... A lightning
    strike is seen, and thunder is heard 0.60 s later. How far away is the strike
    in meters?
  answer:
    value: 202.2
    tolerance: 0.05
  explanation: d = v*t = 334.54 * 0.60 = 202.2 m.
- id: q003
  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: At a high-altitude station where it is -3.9 C... What is the approximate
    speed of sound in m/s?
  answer:
    value: 328.66
    tolerance: 0.05
  explanation: v = 331 + 0.6*T = 331 + 0.6*(-3.9) = 328.66 m/s.
