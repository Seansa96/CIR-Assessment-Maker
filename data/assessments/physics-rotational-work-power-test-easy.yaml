questions:
- id: q1
  type: multipleChoice
  prompt: 'According to the Work-Energy Theorem for rotation, the net work done on
    a rigid body rotating about a fixed axis equals its change in:'
  choices:
  - id: c1
    content: Rotational kinetic energy
  - id: c2
    content: Angular momentum
  - id: c3
    content: Moment of inertia
  answer:
    choiceId: c1
  explanation: $W_{net} = \Delta K_{rot}$.
