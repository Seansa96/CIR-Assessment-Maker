modeDefault: exam
randomizeQuestions: true
questions:
- id: q001
  title: Work by torque
  type: numericResponse
  prompt: |-
    A constant torque of $12\text{ N}\cdot\text{m}$ turns a wheel through $5.0\text{ rad}$. How much work is done?
  answer:
    value: 60.0
    tolerance: 0.3
  explanation: |-
    $W=\tau\Delta\theta=12(5)=60\text{ J}$.
- id: q002
  title: Power from torque
  type: numericResponse
  prompt: |-
    A motor applies $8.0\text{ N}\cdot\text{m}$ at $20\text{ rad/s}$. What power is delivered?
  answer:
    value: 160.0
    tolerance: 1.0
  explanation: |-
    $P=\tau\omega=8(20)=160\text{ W}$.
- id: q003
  title: Torque from power
  type: numericResponse
  prompt: |-
    A motor outputs $300\text{ W}$ at $15\text{ rad/s}$. What torque does it provide?
  answer:
    value: 20.0
    tolerance: 0.2
  explanation: |-
    $\tau=P/\omega=300/15=20\text{ N}\cdot\text{m}$.
- id: q004
  title: Angle from work
  type: numericResponse
  prompt: |-
    A torque of $6.0\text{ N}\cdot\text{m}$ does $42\text{ J}$ of work. Through what angle did it act?
  answer:
    value: 7.0
    tolerance: 0.05
  explanation: |-
    $\Delta\theta=W/\tau=42/6=7\text{ rad}$.
- id: q005
  title: Negative work
  type: multipleChoice
  prompt: |-
    A braking torque opposite angular displacement does:
  choices:
  - id: a
    text: |-
      negative work
  - id: b
    text: |-
      positive work
  - id: c
    text: |-
      zero work always
  - id: d
    text: |-
      work with units of watts
  answer:
    choiceId: a
  explanation: |-
    Opposing torque removes rotational kinetic energy.
- id: q006
  title: Work-energy
  type: numericResponse
  prompt: |-
    A wheel with $I=2.0$ starts from rest. How much work is needed to reach $6.0\text{ rad/s}$?
  answer:
    value: 36.0
    tolerance: 0.2
  explanation: |-
    $W=\Delta K=\frac12(2)(6^2)=36\text{ J}$.
- id: q007
  title: Power at rpm
  type: numericResponse
  prompt: |-
    A shaft delivers $10\text{ N}\cdot\text{m}$ at $120\text{ rpm}$. What power is delivered?
  answer:
    value: 125.7
    tolerance: 1.0
  explanation: |-
    $120\text{ rpm}=4\pi\text{ rad/s}$, so $P=10(4\pi)=126\text{ W}$.
- id: q008
  title: Rotational work analog
  type: multipleChoice
  prompt: |-
    The rotational analog of $W=Fd$ is:
  choices:
  - id: a
    text: |-
      $W=\tau\Delta\theta$
  - id: b
    text: |-
      $W=I\omega$
  - id: c
    text: |-
      $W=\tau/\omega$
  - id: d
    text: |-
      $W=\alpha t$
  answer:
    choiceId: a
  explanation: |-
    Force becomes torque and displacement becomes angular displacement.
- id: q009
  title: Average power
  type: numericResponse
  prompt: |-
    A motor does $900\text{ J}$ in $30\text{ s}$. What is average power?
  answer:
    value: 30.0
    tolerance: 0.2
  explanation: |-
    $P=W/t=900/30=30\text{ W}$.
- id: q010
  title: Energy from torque
  type: numericResponse
  prompt: |-
    A torque of $5\text{ N}\cdot\text{m}$ acts through $12\text{ rad}$. What is $\Delta K$ if no energy is lost?
  answer:
    value: 60.0
    tolerance: 0.3
  explanation: |-
    $\Delta K=W=\tau\theta=5(12)=60\text{ J}$.
- id: q011
  title: Final speed from work
  type: numericResponse
  prompt: |-
    A wheel with $I=4.0$ starts from rest and receives $200\text{ J}$ of work. What $\omega$ results?
  answer:
    value: 10.0
    tolerance: 0.05
  explanation: |-
    $200=\frac12(4)\omega^2$, so $\omega=10$.
- id: q012
  title: Power meaning
  type: multipleChoice
  prompt: |-
    In $P=\tau\omega$, high power can come from:
  choices:
  - id: a
    text: |-
      large torque, large angular speed, or both
  - id: b
    text: |-
      large mass only
  - id: c
    text: |-
      small radius only
  - id: d
    text: |-
      zero angular speed
  answer:
    choiceId: a
  explanation: |-
    Rotational power is the product of torque and angular speed.
- id: q013
  title: Braking work
  type: numericResponse
  prompt: |-
    A brake applies $-4.0\text{ N}\cdot\text{m}$ through $10\text{ rad}$. What work is done?
  answer:
    value: -40.0
    tolerance: 0.3
  explanation: |-
    $W=(-4)(10)=-40\text{ J}$.
- id: q014
  title: Torque for work
  type: numericResponse
  prompt: |-
    What constant torque is needed to do $150\text{ J}$ through $25\text{ rad}$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $\tau=W/\theta=150/25=6.0$.
- id: q015
  title: Power units
  type: multipleChoice
  prompt: |-
    Which unit measures rotational power?
  choices:
  - id: a
    text: |-
      watts
  - id: b
    text: |-
      newton-meters
  - id: c
    text: |-
      radians
  - id: d
    text: |-
      kilogram-meters squared
  answer:
    choiceId: a
  explanation: |-
    Power is energy per time, measured in watts.
