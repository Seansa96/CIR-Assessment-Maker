lesson:
  introduction: We now define how angular velocity changes over time and discuss how
    rotational variables can be treated as vectors using the Right-Hand Rule.
  sections:
  - id: sec-1
    title: Angular Acceleration
    content: 'When the angular velocity of a rigid body changes, it undergoes **angular
      acceleration**, $\alpha$. The average angular acceleration is: $$\alpha_{avg}
      = \frac{\Delta\omega}{\Delta t}$$.


      The instantaneous angular acceleration is the derivative of angular velocity
      with respect to time: $$\alpha = \frac{d\omega}{dt} = \frac{d^2\theta}{dt^2}$$.


      Its units are rad/s$^2$. If $\omega$ and $\alpha$ have the same sign, the body''s
      rotation is speeding up. If they have opposite signs, it is slowing down.'
    media: []
    check:
      id: chk-rv-3
      type: multipleChoice
      prompt: A turntable is rotating counterclockwise and slowing down. What are
        the signs of its angular velocity $\omega$ and angular acceleration $\alpha$?
      choices:
      - id: a
        text: Both are positive.
      - id: b
        text: Both are negative.
      - id: c
        text: $\omega$ is positive, $\alpha$ is negative.
      - id: d
        text: $\omega$ is negative, $\alpha$ is positive.
      answer:
        choiceId: c
      explanation: Since it rotates counterclockwise, $\omega$ is positive. Because
        it is slowing down, the acceleration $\alpha$ must oppose the velocity, meaning
        $\alpha$ is negative.
  - id: sec-2
    title: Rotational Variables as Vectors
    content: 'Angular velocity and acceleration are actually vector quantities. For
      a body rotating around a fixed axis, the direction of $\vec{\omega}$ is given
      by the **Right-Hand Rule**: if you curl the fingers of your right hand in the
      direction of rotation, your extended thumb points in the direction of the angular
      velocity vector.


      Angular acceleration $\vec{\alpha}$ points in the same direction as $d\vec{\omega}/dt$.
      If the rotation is speeding up, $\vec{\alpha}$ points in the same direction
      as $\vec{\omega}$; if slowing down, they are anti-parallel.'
    media: []
    check:
      id: chk-rv-4
      type: multipleChoice
      prompt: A top spins clockwise as viewed from above. According to the right-hand
        rule, which way does its angular velocity vector point?
      choices:
      - id: a
        text: Upwards, away from the floor.
      - id: b
        text: Downwards, into the floor.
      - id: c
        text: Tangential to the spinning top.
      - id: d
        text: Radially outward from the axis.
      answer:
        choiceId: b
      explanation: If you curl the fingers of your right hand clockwise (as seen from
        above), your thumb points downwards into the floor.
