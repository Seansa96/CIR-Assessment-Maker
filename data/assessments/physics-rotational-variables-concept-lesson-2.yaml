lesson:
  introduction: We now define how angular velocity changes over time and discuss how
    rotational variables can be treated as vectors using the Right-Hand Rule.
  sections:
  - id: sec-1
    title: Angular Acceleration
    content: 'When the angular velocity of a rigid body changes, it undergoes **angular
      acceleration**, $\alpha$. The average angular acceleration is: $$\alpha_{avg}
      = \frac{\Delta\omega}{\Delta t}$$.


      The instantaneous angular acceleration is the derivative of angular velocity
      with respect to time: $$\alpha = \frac{d\omega}{dt} = \frac{d^2\theta}{dt^2}$$.


      Its units are rad/s$^2$. If $\omega$ and $\alpha$ have the same sign, the body''s
      rotation is speeding up. If they have opposite signs, it is slowing down.'
    media:
    - type: image
      src: /media/physics/owa/rotational-variables.svg
      alt: Wheel showing angular displacement, angular velocity, and tangential speed.
      caption: Angular and tangential variables are connected by the wheel radius.
    check:
      id: chk-rv-3
      type: multipleChoice
      prompt: A turntable is rotating counterclockwise and slowing down. What are
        the signs of its angular velocity $\omega$ and angular acceleration $\alpha$?
      choices:
      - id: a
        text: Both are positive.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Both are negative.
        issueSignals:
        - id: sign-error
      - id: c
        text: $\omega$ is positive, $\alpha$ is negative.
      - id: d
        text: $\omega$ is negative, $\alpha$ is positive.
        issueSignals:
        - id: sign-error
      answer:
        choiceId: c
      explanation: 'Solution:

        $\omega$ is positive, $\alpha$ is negative.


        Why it works:

        Since it rotates counterclockwise, $\omega$ is positive. Because it is slowing
        down, the acceleration $\alpha$ must oppose the velocity, meaning $\alpha$
        is negative.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Units of Angular Acceleration
    content: 'Angular acceleration measures the change in angular velocity per time, with SI unit rad/s$^2$.'
    media: []
    check:
      id: chk-rv-10
      type: multipleChoice
      prompt: 'What are the SI units of angular acceleration?'
      choices: [{ id: a, text: rad }, { id: b, text: rad/s }, { id: c, text: rad/s$^2$ }, { id: d, text: m/s$^2$ }]
      answer: { choiceId: c }
      explanation: 'Solution: The units are rad/s$^2$.\n\nWhy it works: $\alpha=d\omega/dt$ adds one inverse second to rad/s.\n\nWhy the other choices fail: They are position, velocity, or linear acceleration units.'
  - id: sec-4
    title: Speeding Up and Slowing Down
    content: 'In one-dimensional rotation, matching signs of $\omega$ and $\alpha$ mean the magnitude of rotation rate increases.'
    media: []
    check:
      id: chk-rv-11
      type: multipleChoice
      prompt: 'A wheel has $\omega=-5$ rad/s and $\alpha=-2$ rad/s$^2$. It is:'
      choices: [{ id: a, text: speeding up clockwise }, { id: b, text: slowing down clockwise }, { id: c, text: speeding up counterclockwise }, { id: d, text: at rest }]
      answer: { choiceId: a }
      explanation: 'Solution: It is speeding up clockwise.\n\nWhy it works: Both negative signs correspond to clockwise rotation and increasing magnitude.\n\nWhy the other choices fail: They confuse sign with magnitude change.'
  - id: sec-5
    title: Axis Direction
    content: 'The right-hand rule assigns the axis direction: curl fingers with rotation, and the thumb gives $\vec\omega$.'
    media: []
    check:
      id: chk-rv-12
      type: multipleChoice
      prompt: 'Viewed from above, a disk rotates counterclockwise. Its angular velocity vector points:'
      choices: [{ id: a, text: up }, { id: b, text: down }, { id: c, text: tangentially }, { id: d, text: radially outward }]
      answer: { choiceId: a }
      explanation: 'Solution: It points up.\n\nWhy it works: Curling right-hand fingers counterclockwise leaves the thumb upward.\n\nWhy the other choices fail: Angular velocity points along the axis, not along the rim.'
  - id: sec-6
    title: Derivative Chain
    content: 'The rotational kinematics derivatives form a chain: $\theta\rightarrow\omega=d\theta/dt\rightarrow\alpha=d\omega/dt$.'
    media: []
    check:
      id: chk-rv-13
      type: multipleChoice
      prompt: 'If $\omega(t)=3t^2$, what is $\alpha(t)$?'
      choices: [{ id: a, text: '$3t$' }, { id: b, text: '$6t$' }, { id: c, text: '$6t^2$' }, { id: d, text: '$t^3$' }]
      answer: { choiceId: b }
      explanation: 'Solution: $\alpha=d(3t^2)/dt=6t$.\n\nWhy it works: Angular acceleration is the derivative of angular velocity.\n\nWhy the other choices fail: They differentiate incompletely or apply the wrong power rule.'
  - id: sec-7
    title: Vector Changes
    content: 'For fixed-axis rotation, the vector direction can be fixed while its magnitude changes; the sign convention tracks whether the change aligns or opposes $\vec\omega$.'
    media: []
    check:
      id: chk-rv-14
      type: multipleChoice
      prompt: 'A counterclockwise wheel slows down. Which statement is correct?'
      choices: [{ id: a, text: '$\vec\alpha$ is parallel to $\vec\omega$' }, { id: b, text: '$\vec\alpha$ is antiparallel to $\vec\omega$' }, { id: c, text: Both vectors are zero }, { id: d, text: Angular acceleration is tangential }]
      answer: { choiceId: b }
      explanation: 'Solution: $\vec\alpha$ is antiparallel to $\vec\omega$.\n\nWhy it works: An opposing angular acceleration reduces angular-speed magnitude.\n\nWhy the other choices fail: Parallel acceleration speeds it up; angular vectors lie on the axis.'
  - id: sec-2
    title: Rotational Variables as Vectors
    content: 'Angular velocity and acceleration are actually vector quantities. For
      a body rotating around a fixed axis, the direction of $\vec{\omega}$ is given
      by the **Right-Hand Rule**: if you curl the fingers of your right hand in the
      direction of rotation, your extended thumb points in the direction of the angular
      velocity vector.


      Angular acceleration $\vec{\alpha}$ points in the same direction as $d\vec{\omega}/dt$.
      If the rotation is speeding up, $\vec{\alpha}$ points in the same direction
      as $\vec{\omega}$; if slowing down, they are anti-parallel.'
    media: []
    check:
      id: chk-rv-4
      type: multipleChoice
      prompt: A top spins clockwise as viewed from above. According to the right-hand
        rule, which way does its angular velocity vector point?
      choices:
      - id: a
        text: Upwards, away from the floor.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Downwards, into the floor.
      - id: c
        text: Tangential to the spinning top.
        issueSignals:
        - id: linear-angular-confusion
      - id: d
        text: Radially outward from the axis.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Downwards, into the floor.


        Why it works:

        If you curl the fingers of your right hand clockwise (as seen from above),
        your thumb points downwards into the floor.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
