- id: we-sequences-series-2
  title: Derive a telescoping partial-sum formula
  problem: |
    For
    $$\sum_{n=1}^{\infty}\frac1{n(n+1)},$$
    find a formula for $S_N$, determine the infinite sum, and express the remainder $R_N$.
  steps:
  - id: step-sequences-series-2-1
    title: Decompose the term
    instruction: |
      Partial fractions give
      $$\frac1{n(n+1)}=\frac1n-\frac1{n+1}.$$
      This form reveals cancellation between consecutive terms.
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: Which identity is correct?
    choices:
    - id: a
      text: $1/[n(n+1)]=1/n-1/(n+1)$
    - id: b
      text: $1/[n(n+1)]=1/n+1/(n+1)$
    - id: c
      text: $1/[n(n+1)]=n-(n+1)$
    - id: d
      text: $1/[n(n+1)]=1/n^2-1/(n+1)^2$
    answer:
      choiceId: a
    explanation: |-
      Solution: Combining the right side produces $[(n+1)-n]/[n(n+1)]$. Therefore the answer is $1/[n(n+1)]=1/n-1/(n+1)$.

      Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

      Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

      Why the other choices fail: $1/[n(n+1)]=1/n+1/(n+1)$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $1/[n(n+1)]=n-(n+1)$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $1/[n(n+1)]=1/n^2-1/(n+1)^2$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
  - id: step-sequences-series-2-2
    title: Expand the finite sum
    instruction: |
      Keep $N$ finite while canceling:
      $$S_N=\left(1-\frac12\right)+\left(\frac12-\frac13\right)+\cdots+
      \left(\frac1N-\frac1{N+1}\right)=1-\frac1{N+1}.$$
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: Which terms survive the cancellation?
    choices:
    - id: a
      text: $1$ and $-1/(N+1)$
    - id: b
      text: $1/N$ and $1/(N+1)$
    - id: c
      text: Only $1/N$
    - id: d
      text: No terms
    answer:
      choiceId: a
    explanation: |-
      Solution: Every intermediate reciprocal appears once positively and once negatively. Therefore the answer is $1$ and $-1/(N+1)$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $1/N$ and $1/(N+1)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Only $1/N$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; No terms conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-sequences-series-2-3
    title: Take the partial-sum limit
    instruction: |
      Since $1/(N+1)\to0$,
      $$\sum_{n=1}^{\infty}\frac1{n(n+1)}
      =\lim_{N\to\infty}S_N=1.$$
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: What proves convergence here?
    choices:
    - id: a
      text: The partial sums approach the finite limit $1$.
    - id: b
      text: The individual terms approach $0$.
    - id: c
      text: Every term is positive.
    - id: d
      text: The first term equals $1/2$.
    answer:
      choiceId: a
    explanation: |-
      Solution: The exact partial-sum formula supplies the limit required by the definition of a convergent series. Therefore the answer is The partial sums approach the finite limit $1$.. Therefore the answer is The partial sums approach the finite limit $1$.. Therefore the answer is The partial sums approach the finite limit $1$..

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: The individual terms approach $0$. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Every term is positive. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The first term equals $1/2$. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-sequences-series-2-4
    title: Identify the tail exactly
    instruction: |
      The remainder after $N$ terms is
      $$R_N=S-S_N=1-\left(1-\frac1{N+1}\right)=\frac1{N+1}.$$
      In this example the truncation error is known exactly, not merely bounded.
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: What is the error after summing the first $99$ terms?
    choices:
    - id: a
      text: $1/100$
    - id: b
      text: $1/99$
    - id: c
      text: $99/100$
    - id: d
      text: $0$
    answer:
      choiceId: a
    explanation: 'Solution: Substitute $N=99$ into $R_N=1/(N+1)$. Therefore the answer is $1/100$.


      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.


      Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.


      Why the other choices fail: $1/99$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; $99/100$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; $0$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.'
