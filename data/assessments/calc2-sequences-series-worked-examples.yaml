- id: we-sequences-series-1
  title: A convergent sequence can produce a divergent series
  problem: |
    Compare the convergence of the sequence $a_n=1/n$ with the convergence of
    the series $\sum_{n=1}^{\infty}1/n$. Explain why the two answers differ.
  steps:
  - id: step-sequences-series-1-1
    title: Analyze the sequence
    instruction: |
      For the sequence, only the individual term matters:
      $\lim_{n\to\infty}1/n=0$. Thus $(a_n)$ converges to $0$.
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: |-
      What object is being evaluated by $\lim_{n\to\infty}a_n$?
    choices:
    - id: a
      text: The sequence of terms
    - id: b
      text: The sequence of partial sums
    - id: c
      text: The sum of the first infinitely many terms
    - id: d
      text: The remainder after $n$ terms
    answer:
      choiceId: a
    explanation: |-
      Solution: A term limit determines sequence convergence and is only a necessary condition for series convergence. Therefore the answer is The sequence of terms.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: The sequence of partial sums conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The sum of the first infinitely many terms conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The remainder after $n$ terms conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-sequences-series-1-2
    title: Write the series partial sums
    instruction: |
      The harmonic series is governed by
      $$S_N=1+\frac12+\frac13+\cdots+\frac1N.$$
      Its convergence asks whether the new sequence $(S_N)$ has a finite limit.
    type: multipleChoice
    issueSignals:
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: Which limit would define the sum of the harmonic series if it existed?
    choices:
    - id: a
      text: |-
        $\lim_{N\to\infty}S_N$
    - id: b
      text: |-
        $\lim_{n\to\infty}1/n$
    - id: c
      text: |-
        $\lim_{N\to\infty}(S_N-S_{N-1})/N$
    - id: d
      text: $S_1$
    answer:
      choiceId: a
    explanation: |-
      Solution: An infinite series is defined as a limit of finite partial sums. Therefore the answer is $\lim_{N\to\infty}S_N$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

