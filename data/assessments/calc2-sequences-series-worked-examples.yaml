  - id: step-sequences-series-1-3
    title: Show the partial sums are unbounded
    instruction: |
      Group terms after the first:
      $$S_{2^m}=1+\frac12+
      \left(\frac13+\frac14\right)+\cdots+
      \left(\frac1{2^{m-1}+1}+\cdots+\frac1{2^m}\right).$$
      The $j$th displayed block has $2^{j-1}$ terms, each at least $1/2^j$,
