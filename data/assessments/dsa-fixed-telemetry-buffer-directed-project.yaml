schemaVersion: 1
id: dsa-fixed-telemetry-buffer-directed-project
title: Fixed Telemetry Buffer
assessmentType: directedProject
categoryId: dsa
subcategoryIds:
- dsa-range-resource-techniques
modeDefault: practice
randomizeQuestions: false
directedProject:
  summary: Implement a fixed-capacity C++ ring buffer. Explain head/tail indices, overwrite policy, capacity, and why no per-event allocation occurs.
  estimatedTimeMinutes: 45
  phases:
  - id: design
    title: Design the invariant
    steps:
    - id: design-workload
      title: State the workload
      instruction: Write the required operations, input bound, and failure behavior.
      checklist:
      - id: operations
        text: Lists dominant operations and constraints.
  - id: implement
    title: Implement and test
    steps:
    - id: implement-core
      title: Build the core operation
      instruction: Implement a fixed-capacity C++ ring buffer. Explain head/tail indices, overwrite policy, capacity, and why no per-event allocation occurs.
      checklist:
      - id: boundaries
        text: Tests empty, one-item, and full or cyclic boundaries.
      - id: tradeoff
        text: Explains when a standard library or framework is preferable.
