questions:
- id: q001
  type: numericResponse
  prompt: A string fixed at both ends has length 1.20 m. What is the wavelength of its fundamental standing-wave mode in m?
  answer: { value: 2.4, tolerance: 0.03 }
  explanation: |
    Solution: The fundamental has half a wavelength in the string, so $lambda=2L=2.40$ m.

    Why it works: Fixed ends are nodes, and the lowest mode contains one antinode between them.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: q002
  type: numericResponse
  prompt: A string fixed at both ends has wave speed 120 m/s and length 1.50 m. Find its fundamental frequency in Hz.
  answer: { value: 40, tolerance: 0.5 }
  explanation: |
    Solution: $f1=v/(2L)=120/(2(1.50))=40$ Hz.

    Why it works: The fundamental wavelength is twice the string length.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q003
  type: numericResponse
  prompt: A string has fundamental frequency 50 Hz. What is its third-harmonic frequency in Hz?
  answer: { value: 150, tolerance: 0.5 }
  explanation: |
    Solution: $f3=3f1=3(50)=150$ Hz.

    Why it works: For a uniform string fixed at both ends, harmonics are integer multiples of the fundamental.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q004
  type: multipleChoice
  prompt: Which location on a standing wave has zero displacement at all times?
  choices: [{ id: a, text: node }, { id: b, text: antinode }, { id: c, text: crest }]
  answer: { choiceId: a }
  explanation: |
    Solution: A node has zero displacement at all times.

    Why it works: Oppositely traveling waves cancel there continuously.

    Why the other choices fail: Antinodes have maximum motion, and a crest is an instantaneous feature of a traveling wave.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: q005
  type: multipleChoice
  prompt: Why does a driven string respond most strongly at one of its resonant frequencies?
  choices: [{ id: a, text: successive pushes add energy in phase }, { id: b, text: the string stops having tension }, { id: c, text: wave speed becomes infinite }]
  answer: { choiceId: a }
  explanation: |
    Solution: Successive pushes add energy in phase.

    Why it works: The drive reinforces the allowed standing-wave pattern instead of cancelling it.

    Why the other choices fail: Tension and finite wave speed remain properties of the string.
  difficultyDimensions: [representationTransfer, modelOrDerivation]

