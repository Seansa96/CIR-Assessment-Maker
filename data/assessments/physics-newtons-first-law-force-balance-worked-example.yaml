workedExamples:
- id: we001
  title: Finding a third force that balances two forces
  problem: 'Newton''s First Law says an object remains at rest or moves with constant
    velocity when the net external force is zero. In force-vector problems, "balance
    the forces" means choose an additional force so the vector sum becomes $\vec{0}$.


    Problem 1: Two forces


    $$

    \vec{F}_1=\frac{75.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}

    $$


    and


    $$

    \vec{F}_2=\frac{150.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}

    $$


    act on an object. Find the third force $\vec{F}_3$ needed to balance the first
    two forces.


    Problem 2: Two forces $\vec{A}=(40\hat{i}+30\hat{j})\ \text{N}$ and $\vec{B}=(-10\hat{i}+20\hat{j})\
    \text{N}$ act on an object. Find the balancing force $\vec{C}$.

    '
  steps:
  - id: step-we001-1
    title: Meaning of balance
    instruction: 'Start by translating "balance" into a force equation.

      '
    type: multipleChoice
    prompt: |
      If $\vec{F}_3$ balances $\vec{F}_1$ and $\vec{F}_2$, what must be true?
    choices:
    - id: a
      text: $\vec{F}_1+\vec{F}_2+\vec{F}_3=\vec{0}$
    - id: b
      text: $\vec{F}_1+\vec{F}_2=\vec{F}_3$
    - id: c
      text: $|\vec{F}_3|=0$
    - id: d
      text: $\vec{F}_1-\vec{F}_2=\vec{0}$
    answer:
      choiceId: a
    hint: 'Newton''s First Law equilibrium means zero net force.

      '
    explanation: |
      Balance means the net force is zero:

      $$
      \sum \vec{F}=\vec{0}.
      $$

      Therefore

      $$
      \vec{F}_1+\vec{F}_2+\vec{F}_3=\vec{0}.
      $$

      Related topic: Newton's First Law and translational equilibrium. Strengthen the link between "balanced forces," "zero net force," and "no acceleration."
  - id: step-we001-2
    title: Isolate the balancing force
    instruction: 'Once the equilibrium equation is written, solve it for the unknown
      force.

      '
    type: multipleChoice
    prompt: |
      Which expression correctly isolates $\vec{F}_3$?
    choices:
    - id: a
      text: $\vec{F}_3=-(\vec{F}_1+\vec{F}_2)$
    - id: b
      text: $\vec{F}_3=\vec{F}_1+\vec{F}_2$
    - id: c
      text: $\vec{F}_3=\vec{F}_1-\vec{F}_2$
    - id: d
      text: $\vec{F}_3=\vec{0}$
    answer:
      choiceId: a
    explanation: |
      From

      $$
      \vec{F}_1+\vec{F}_2+\vec{F}_3=\vec{0},
      $$

      subtract the known forces from both sides:

      $$
      \vec{F}_3=-(\vec{F}_1+\vec{F}_2).
      $$

      Related topic: additive inverse of a vector. The balancing force is equal in magnitude and opposite in direction to the resultant of the known forces.
  - id: step-we001-3
    title: Add like vector directions
    instruction: 'In Problem 1, both forces point in the same unit-vector direction
      $(\hat{i}-\hat{j})$.

      '
    type: multipleChoice
    prompt: |
      What is $\vec{F}_1+\vec{F}_2$?
    choices:
    - id: a
      text: $\frac{225.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}$
    - id: b
      text: $\frac{75.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}$
    - id: c
      text: $\frac{225.0}{\sqrt{2}}(\hat{i}+\hat{j})\ \text{N}$
    - id: d
      text: $\frac{75.0}{\sqrt{2}}(\hat{i}+\hat{j})\ \text{N}$
    answer:
      choiceId: a
    explanation: |
      Since both forces are scalar multiples of the same vector direction, add the scalar coefficients:

      $$
      \frac{75.0}{\sqrt{2}}+\frac{150.0}{\sqrt{2}}=\frac{225.0}{\sqrt{2}}.
      $$

      So

      $$
      \vec{F}_1+\vec{F}_2=\frac{225.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}.
      $$

      Related topic: factoring common vector directions. This is the same idea as combining like terms in algebra.
  - id: step-we001-4
    title: Choose the balancing direction
    instruction: 'The third force must cancel the resultant from the first two forces.

      '
    type: multipleChoice
    prompt: |
      Which force balances Problem 1?
    choices:
    - id: a
      text: $-\frac{225.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}$
    - id: b
      text: $\frac{225.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}$
    - id: c
      text: $-\frac{225.0}{\sqrt{2}}(\hat{i}+\hat{j})\ \text{N}$
    - id: d
      text: $\frac{75.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}$
    answer:
      choiceId: a
    hint: 'The balancing force is the negative of the known resultant.

      '
    explanation: |
      The balancing force is

      $$
      \vec{F}_3=-(\vec{F}_1+\vec{F}_2)
      =-\frac{225.0}{\sqrt{2}}(\hat{i}-\hat{j})\ \text{N}.
      $$

      Equivalently,

      $$
      \vec{F}_3=-\frac{225.0}{\sqrt{2}}\hat{i}+\frac{225.0}{\sqrt{2}}\hat{j}\ \text{N}.
      $$

      Related topic: vector equilibrium. If you need to strengthen this, review component addition and the idea of an equal-and-opposite equilibrant force.
  - id: step-we001-5
    title: Interpret magnitude and direction
    instruction: 'The expression $(\hat{i}-\hat{j})/\sqrt{2}$ is a unit direction,
      so the scalar coefficient gives the magnitude.

      '
    type: multipleChoice
    prompt: |
      What is the magnitude of the balancing force in Problem 1?
    choices:
    - id: a
      text: $225.0\ \text{N}$
    - id: b
      text: $\frac{225.0}{\sqrt{2}}\ \text{N}$
    - id: c
      text: $75.0\ \text{N}$
    - id: d
      text: $150.0\ \text{N}$
    answer:
      choiceId: a
    explanation: |
      The vector

      $$
      \frac{1}{\sqrt{2}}(\hat{i}-\hat{j})
      $$

      has magnitude $1$. Therefore $\frac{225.0}{\sqrt{2}}(\hat{i}-\hat{j})$ has magnitude $225.0\ \text{N}$.

      Related topic: unit vectors and normalized directions. Review why $(1,-1)$ has magnitude $\sqrt{2}$.
  - id: step-we001-6
    title: Problem 2 sum components
    instruction: 'Now use the same equilibrium idea on a problem where the forces
      are already expanded into components.

      '
    type: multipleChoice
    prompt: |
      For $\vec{A}=(40\hat{i}+30\hat{j})\ \text{N}$ and $\vec{B}=(-10\hat{i}+20\hat{j})\ \text{N}$, what is $\vec{A}+\vec{B}$?
    choices:
    - id: a
      text: $(30\hat{i}+50\hat{j})\ \text{N}$
    - id: b
      text: $(50\hat{i}+10\hat{j})\ \text{N}$
    - id: c
      text: $(-30\hat{i}-50\hat{j})\ \text{N}$
    - id: d
      text: $(40\hat{i}+20\hat{j})\ \text{N}$
    answer:
      choiceId: a
    explanation: |
      Add matching components:

      $$
      A_x+B_x=40+(-10)=30,
      $$

      and

      $$
      A_y+B_y=30+20=50.
      $$

      So the known resultant is

      $$
      \vec{A}+\vec{B}=(30\hat{i}+50\hat{j})\ \text{N}.
      $$

      Related topic: component-by-component vector addition. Always combine $\hat{i}$ with $\hat{i}$ and $\hat{j}$ with $\hat{j}$.
  - id: step-we001-7
    title: Problem 2 balancing force
    instruction: 'Find the force that makes the net force zero.

      '
    type: multipleChoice
    prompt: |
      What balancing force $\vec{C}$ is required?
    choices:
    - id: a
      text: $\vec{C}=(-30\hat{i}-50\hat{j})\ \text{N}$
    - id: b
      text: $\vec{C}=(30\hat{i}+50\hat{j})\ \text{N}$
    - id: c
      text: $\vec{C}=(-50\hat{i}-10\hat{j})\ \text{N}$
    - id: d
      text: $\vec{C}=(10\hat{i}-20\hat{j})\ \text{N}$
    answer:
      choiceId: a
    explanation: |
      The balancing force is the negative of the resultant:

      $$
      \vec{C}=-(\vec{A}+\vec{B})=-(30\hat{i}+50\hat{j}).
      $$

      Therefore

      $$
      \vec{C}=(-30\hat{i}-50\hat{j})\ \text{N}.
      $$

      Related topic: equilibrant vectors. The technique order is add all known forces first, then reverse the resultant.
  - id: step-we001-8
    title: Finish the check
    instruction: 'The best way to verify an equilibrium answer is to add all forces
      and check that the components become zero.

      '
    type: multipleChoice
    prompt: |
      Which expression correctly verifies the answer for Problem 2?
    choices:
    - id: a
      text: $(40\hat{i}+30\hat{j})+(-10\hat{i}+20\hat{j})+(-30\hat{i}-50\hat{j})=\vec{0}$
    - id: b
      text: $(40\hat{i}+30\hat{j})+(-10\hat{i}+20\hat{j})=(0\hat{i}+0\hat{j})$
    - id: c
      text: $(-30\hat{i}-50\hat{j})=(40\hat{i}+30\hat{j})$
    - id: d
      text: $(40\hat{i}+30\hat{j})-(-10\hat{i}+20\hat{j})=\vec{0}$
    answer:
      choiceId: a
    explanation: |
      Check the sum:

      $$
      (40-10-30)\hat{i}+(30+20-50)\hat{j}=0\hat{i}+0\hat{j}.
      $$

      That confirms zero net force.

      Related topic: checking equilibrium by component sums. This is the safest final check for Newton's First Law force-balance problems.
