  - id: s03
    title: Magnitude and direction
    required: true
    content: Magnitude comes from the distance formula; a unit vector has magnitude one and records direction alone. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
