  - id: s07
    title: Normalize a concrete vector
    required: true
    content: Before normalizing, compute magnitude accurately. Then multiply by the reciprocal of that magnitude and verify the result has length one.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: What is $|\langle2,-1,2\rangle|$?
      choices:
      - id: a
        text: 3
        media: []
        issueSignals: []
      - id: b
        text: 9
        media: []
        issueSignals:
        - id: magnitude-formula-error
          domains: []
      - id: c
        text: $\sqrt{5}$
        media: []
        issueSignals:
        - id: magnitude-formula-error
          domains: []
      - id: d
        text: $\langle2/3,-1/3,2/3\rangle$
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $|\langle2,-1,2\rangle|=\sqrt{2^2+(-1)^2+2^2}=\sqrt9=3$.


        Why it works: Magnitude is the square root of the sum of the squared components.


        Why the other choices fail: Choice b omits the square root. Choice c omits a squared component. Choice d is the normalized vector, not its magnitude.
