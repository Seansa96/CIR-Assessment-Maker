  - id: s03
    title: Separate direction from length
    required: true
    content: A unit vector has magnitude one, so it records direction without preserving the original length. Normalize a nonzero vector by dividing it by its magnitude.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: What is a unit vector?
      choices:
      - id: a
        text: a vector with magnitude 1
        media: []
        issueSignals: []
      - id: b
        text: any vector parallel to a coordinate axis
        media: []
        issueSignals:
        - id: unit-vector-definition-error
          domains: []
      - id: c
        text: a vector with magnitude 0
        media: []
        issueSignals:
        - id: unit-vector-definition-error
          domains: []
      - id: d
        text: a vector whose components add to 1
        media: []
        issueSignals:
        - id: unit-vector-definition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: A unit vector is a vector with magnitude 1.


        Why it works: Dividing a nonzero vector by its magnitude keeps its direction and changes its length to one.


        Why the other choices fail: Choice b can have any length. Choice c is the zero vector, which has no direction for normalization. Choice d confuses a component sum with length.
