  - id: s04
    title: Scale every component
    required: true
    content: Scalar multiplication changes a vector's length and may reverse its direction. Multiply each component by the scalar.
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: Find $2\langle1,-2,3\rangle$.
      choices:
      - id: a
        text: $\langle2,-4,6\rangle$
        media: []
        issueSignals: []
      - id: b
        text: $\langle2,-2,3\rangle$
        media: []
        issueSignals:
        - id: scalar-multiplication-error
          domains: []
      - id: c
        text: $\langle-2,4,-6\rangle$
        media: []
        issueSignals:
        - id: sign-error
          domains: []
      - id: d
        text: $\langle3,-4,5\rangle$
        media: []
        issueSignals:
        - id: scalar-multiplication-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $2\langle1,-2,3\rangle=\langle2(1),2(-2),2(3)\rangle=\langle2,-4,6\rangle$.


        Why it works: A scalar multiplies every component of a vector.


        Why the other choices fail: Choice b scales only one component. Choice c uses multiplication by $-2$. Choice d adds unrelated component values.
