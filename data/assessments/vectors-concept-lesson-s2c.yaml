  - id: s02
    title: Measure a vector's magnitude
    required: true
    content: 'The magnitude of $\langle a,b,c\rangle$ is its spatial distance from the origin: $\sqrt{a^2+b^2+c^2}$. Magnitude is a nonnegative scalar.'
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: Find $|\langle3,4,0\rangle|$.
      choices:
      - id: a
        text: 5
        media: []
        issueSignals: []
      - id: b
        text: 7
        media: []
        issueSignals:
        - id: magnitude-formula-error
          domains: []
      - id: c
        text: 25
        media: []
        issueSignals:
        - id: magnitude-formula-error
          domains: []
      - id: d
        text: $\sqrt{7}$
        media: []
        issueSignals:
        - id: magnitude-formula-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $|\langle3,4,0\rangle|=\sqrt{3^2+4^2+0^2}=\sqrt{25}=5$.


        Why it works: The magnitude formula is the three-dimensional distance formula from the origin.


        Why the other choices fail: Choice b adds components instead of their squares. Choice c stops before taking the square root. Choice d uses the wrong sum of squares.
