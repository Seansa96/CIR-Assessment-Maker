  - id: s02
    title: Components drive operations
    required: true
    content: Add, subtract, and scale vectors component by component. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
