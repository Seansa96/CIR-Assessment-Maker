          domains: []
      - id: c
        text: $\langle0,0,1\rangle$
        media: []
        issueSignals:
        - id: basis-vector-confusion
          domains: []
      - id: d
        text: $\langle1,1,1\rangle$
        media: []
        issueSignals:
        - id: basis-vector-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $\mathbf i=\langle1,0,0\rangle$.


        Why it works: $\mathbf i$ is the unit vector in the positive x-direction.


        Why the other choices fail: Choices b and c are $\mathbf j$ and $\mathbf k$. Choice d points diagonally and is not a standard basis vector.
