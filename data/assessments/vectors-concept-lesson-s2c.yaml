lesson:
  introduction: Vectors describe directed displacement. Work component by component, then check whether your result is a scalar or a vector and whether its direction is reasonable.
  sections:
  - id: s01
    title: Add component by component
    required: true
    content: A vector can be translated without changing it. To add vectors, add corresponding components; do not add their magnitudes or mix coordinate positions.
    media:
    - type: image
      src: /media/calculus-3/vectors.svg
      alt: Coordinate-space diagram showing two component vectors
      caption: Vector addition combines matching components.
    check:
      id: check-01
      type: multipleChoice
      prompt: Find $\langle1,2,3\rangle+\langle2,-1,0\rangle$.
      choices:
      - id: a
        text: $\langle3,1,3\rangle$
        media: []
        issueSignals: []
      - id: b
        text: $\langle3,-3,3\rangle$
        media: []
        issueSignals:
        - id: vector-component-resolution-error
          domains: []
      - id: c
        text: the scalar 5
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      - id: d
        text: $\langle1,1,3\rangle$
        media: []
        issueSignals:
        - id: vector-component-resolution-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Add corresponding components: $\langle1+2,2+(-1),3+0\rangle=\langle3,1,3\rangle$.


        Why it works: Vector addition preserves coordinate roles: x-components combine with x-components, and likewise for y and z.


        Why the other choices fail: Choice b subtracts the y-components. Choice c is a scalar, not the requested vector. Choice d leaves the x-component uncombined.
