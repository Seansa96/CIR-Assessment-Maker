  - id: s05
    title: Use the standard basis
    required: true
    content: The standard basis vectors point along the coordinate axes. They let us write a vector by its x-, y-, and z-components.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: What is $\mathbf i$ in three dimensions?
      choices:
