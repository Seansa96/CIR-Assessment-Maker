  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Trigonometry → Right Triangle Trigonometry if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Vectors are displacements
    required: true
    content: 'A vector records magnitude and direction, independent of where it is drawn. In Vectors in Space, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
