  - id: s06
    title: Reverse direction deliberately
    required: true
    content: Multiplying by a negative scalar reverses direction. Multiplying by $-1$ preserves magnitude while pointing exactly opposite.
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: What operation reverses a vector's direction without changing its magnitude?
      choices:
      - id: a
        text: multiplication by $-1$
        media: []
        issueSignals: []
      - id: b
        text: multiplication by $0$
        media: []
        issueSignals:
        - id: direction-scaling-error
          domains: []
      - id: c
        text: division by its magnitude
        media: []
        issueSignals:
        - id: direction-scaling-error
          domains: []
      - id: d
        text: multiplication by $1$
        media: []
        issueSignals:
        - id: direction-scaling-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Multiply the vector by $-1$.


        Why it works: Negating every component gives the opposite direction with the same magnitude.


        Why the other choices fail: Choice b produces the zero vector. Choice c normalizes but does not reverse direction. Choice d leaves the vector unchanged.
