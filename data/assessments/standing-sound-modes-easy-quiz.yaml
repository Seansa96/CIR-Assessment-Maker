  type: numericResponse
  skills:
  - physics-standing-sound-modes
  prompt: Use the Normal Modes of a Standing Sound Wave diagram and the model $f_n=nv/(2L)$. A calibrated
    scenario scales the reference values by 1.1. Determine the tube mode frequency. Give a numerical answer.
  answer:
    value: 187.0
    tolerance: 1.8700000000000003
  explanation: Apply $f_n=nv/(2L)$ consistently to the scaled scenario; the requested tube mode frequency
    is 187.
