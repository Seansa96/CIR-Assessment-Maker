questions:
- id: q001
  type: numericResponse
  prompt: An open-open air column is 0.85 m long. Take sound speed as 340 m/s. What is its fundamental frequency in Hz?
  answer: { value: 200, tolerance: 0.4 }
  explanation: |
    Solution: $f_1=v/(2L)=340/[2(0.85)]=200$ Hz.

    Why it works: An open-open column has half a wavelength in its fundamental mode.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q002
  type: numericResponse
  prompt: A closed-open air column is 0.85 m long. Take sound speed as 340 m/s. What is its fundamental frequency in Hz?
  answer: { value: 100, tolerance: 0.3 }
  explanation: |
    Solution: $f_1=v/(4L)=340/[4(0.85)]=100$ Hz.

    Why it works: A closed-open column has one-quarter wavelength in its fundamental mode.
  difficultyDimensions: [modelComparison, modelOrDerivation]
- id: q003
  type: multipleChoice
  prompt: At the closed end of a closed-open air column, the displacement pattern has which feature?
  choices:
  - { id: a, text: A displacement node }
  - { id: b, text: A displacement antinode }
  - { id: c, text: No standing-wave pattern }
  - { id: d, text: Equal displacement at all times }
  answer: { choiceId: a }
  explanation: |
    Solution: A displacement node.

    Why it works: Air at the rigid closed boundary cannot oscillate longitudinally through the wall.

    Why the other choices fail: An open end is associated with a displacement antinode; the other options contradict the boundary constraint.
  difficultyDimensions: [representationTransfer, retrieval]
- id: q004
  type: multipleChoice
  prompt: Which harmonic sequence is allowed for an ideal closed-open air column?
  choices:
  - { id: a, text: 'Odd harmonics only: 1st, 3rd, 5th, ...' }
  - { id: b, text: 'Even harmonics only: 2nd, 4th, 6th, ...' }
  - { id: c, text: Every harmonic with no restriction }
  - { id: d, text: No resonant frequencies }
  answer: { choiceId: a }
  explanation: |
    Solution: Odd harmonics only: 1st, 3rd, 5th, ...

    Why it works: The node-antinode boundary pair fits odd numbers of quarter wavelengths.

    Why the other choices fail: Even harmonic patterns do not satisfy both different end conditions, while the column does support resonance.
  difficultyDimensions: [modelComparison, representationTransfer]
