glossary:
  introduction: |
    Study these terms before working with parametric curves. The main habit is to separate the path itself from the way the path is traced as the parameter changes.

    ![Reference grid of parametric standard forms for lines, line segments, circles, ellipses, function traces, and hyperbolas](/assessments/calc2-parametric-polar/parametric-standard-forms-reference.svg)
  sections:
    - id: parametric-foundations
      title: Parametric Foundations
      required: true
      content: |
        Parametric equations describe a curve using component functions. Instead of writing $y$ directly as a function of $x$, you describe both coordinates using a parameter.
      entries:
        - id: parameter
          term: Parameter
          definition: |
            The input variable, often $t$, that controls both coordinate functions.
          notation: '$x=f(t),\quad y=g(t)$'
          examples:
            - In $x=t^2$, $y=t+1$, the parameter is $t$.
          aliases: [parametric input]
          tags: [parameter, parametric-curves]
          drills:
            - id: parameter-cloze
              type: cloze
              prompt: 'In $x=f(t)$ and $y=g(t)$, the variable $t$ is called the ____.' 
              answer:
                expected: parameter
              explanation: The parameter drives both coordinate functions.
              tags: [parameter, parametric-curves]

        - id: trace
          term: Trace
          definition: |
            The geometric path produced by the parametric equations over the chosen parameter interval.
          notation: '$\{(x(t),y(t)):a\le t\le b\}$'
          examples:
            - The same circle can be traced clockwise or counterclockwise by changing the component functions.
          aliases: [path]
          tags: [trace, parametric-curves]
          drills:
            - id: trace-flashcard
              type: flashcard
              prompt: What is the trace of a parametric curve?
              answer:
                expected: The set of points traced by the parametric equations over the parameter interval.
              explanation: The trace is the path; orientation describes how that path is traveled.
              tags: [trace, parametric-curves]

        - id: orientation
          term: Orientation
          definition: |
            The direction in which the curve is traced as the parameter increases.
          notation: '$t\nearrow$'
          examples:
            - $x=\cos t$, $y=\sin t$ traces the unit circle counterclockwise as $t$ increases from $0$ to $2\pi$.
          aliases: [trace direction]
          tags: [orientation, parametric-curves]
          drills:
            - id: orientation-typed
              type: typed
              prompt: What term describes the direction a parametric curve is traveled as $t$ increases?
              answer:
                expected: orientation
                aliases: [trace direction, direction]
              explanation: Orientation matters for area, motion, and interpretation.
              tags: [orientation, parametric-curves]

        - id: eliminating-the-parameter
          term: Eliminating the Parameter
          definition: |
            Rewriting parametric equations as a rectangular relationship between $x$ and $y$.
          notation: '$x=f(t),\ y=g(t)\Rightarrow F(x,y)=0$'
          examples:
            - From $x=3\cos t$, $y=2\sin t$, use $\cos^2t+\sin^2t=1$ to get $\frac{x^2}{9}+\frac{y^2}{4}=1$.
          aliases: [parameter elimination]
          tags: [parameter-elimination, parametric-curves]
          drills:
            - id: eliminating-parameter-recognition
              type: recognition
              prompt: Which identity is most useful for eliminating $t$ from $x=4\cos t$, $y=5\sin t$?
              choices:
                - id: a
                  text: '$\sin^2t+\cos^2t=1$'
                - id: b
                  text: '$\tan^2t+1=\sec^2t$'
                - id: c
                  text: '$a^2+b^2=c^2$'
                - id: d
                  text: '$e^{a+b}=e^ae^b$'
              answer:
                choiceId: a
                expected: '$\sin^2t+\cos^2t=1$'
              explanation: Normalize $x$ and $y$ by their coefficients, then square and add.
              tags: [parameter-elimination, trig-parametric-forms]

    - id: calculus-with-parametric-curves
      title: Calculus with Parametric Curves
      required: true
      content: |
        Parametric calculus uses component rates. Slope, speed, length, and area are all built from $x(t)$ and $y(t)$.
      entries:
        - id: parametric-slope
          term: Parametric Slope
          definition: |
            The Cartesian slope of a parametric curve, found by dividing vertical rate by horizontal rate.
          notation: '$\frac{dy}{dx}=\frac{dy/dt}{dx/dt}$'
          examples:
            - If $\frac{dy}{dt}=6$ and $\frac{dx}{dt}=2$, then $\frac{dy}{dx}=3$.
          aliases: [dy dx parametric]
          tags: [parametric-derivatives, slope]
          drills:
            - id: parametric-slope-symbolic
              type: symbolic
              prompt: Write the formula for $\frac{dy}{dx}$ for a parametric curve.
              answer:
                expectedLatex: '\frac{dy/dt}{dx/dt}'
                aliases:
                  - '(dy/dt)/(dx/dt)'
              explanation: Slope is vertical rate divided by horizontal rate.
              tags: [parametric-derivatives, slope]

        - id: horizontal-vertical-parametric-tangents
          term: Horizontal and Vertical Parametric Tangents
          definition: |
            A horizontal tangent occurs when $\frac{dy}{dt}=0$ and $\frac{dx}{dt}\ne0$. A vertical tangent occurs when $\frac{dx}{dt}=0$ and $\frac{dy}{dt}\ne0$.
          notation: '$dy/dt=0$ horizontal; $dx/dt=0$ vertical'
          examples:
            - If $dy/dt=0$ but $dx/dt=4$, the tangent is horizontal.
          aliases: [parametric tangent conditions]
          tags: [parametric-derivatives, tangent-lines]
          drills:
            - id: parametric-tangent-cloze
              type: cloze
              prompt: 'A vertical tangent usually occurs when $\frac{dx}{dt}=0$ and $\frac{dy}{dt}$ is not ____.' 
              answer:
                expected: zero
                aliases: [0]
              explanation: If both component rates are zero, the ordinary slope test is inconclusive.
              tags: [parametric-derivatives, tangent-lines]

        - id: parametric-speed
          term: Speed
          definition: |
            The magnitude of velocity for a parametric motion.
          notation: '$\sqrt{(x''(t))^2+(y''(t))^2}$'
          examples:
            - Speed is the integrand used for parametric arc length.
          aliases: [velocity magnitude]
          tags: [parametric-integrals, speed]
          drills:
            - id: parametric-speed-recognition
              type: recognition
              prompt: What quantity is $\sqrt{(x'(t))^2+(y'(t))^2}$?
              choices:
                - id: a
                  text: Speed
                - id: b
                  text: Signed area
                - id: c
                  text: Curvature only
                - id: d
                  text: The parameter interval
              answer:
                choiceId: a
                expected: Speed
              explanation: Speed is the length of the velocity vector.
              tags: [parametric-integrals, speed]

        - id: parametric-arc-length
          term: Parametric Arc Length
          definition: |
            The distance traveled along a parametric curve over a parameter interval.
          notation: '$L=\int_a^b\sqrt{(x''(t))^2+(y''(t))^2}\,dt$'
          examples:
            - Use this when the curve is represented by $x(t)$ and $y(t)$ rather than $y=f(x)$.
          aliases: [parametric length]
          tags: [parametric-integrals, arc-length]
          drills:
            - id: parametric-arc-length-flashcard
              type: flashcard
              prompt: What is parametric arc length measuring?
              answer:
                expected: The distance traveled along the curve over the parameter interval.
              explanation: It accumulates speed with respect to the parameter.
              tags: [parametric-integrals, arc-length]

        - id: parametric-area
          term: Parametric Area
          definition: |
            Signed area accumulated by replacing $dx$ with $x'(t)\,dt$.
          notation: '$A=\int y(t)x''(t)\,dt$'
          examples:
            - If the curve moves left, $x'(t)<0$, so the signed area may be negative.
          aliases: [area using y dx]
          tags: [parametric-integrals, area]
          drills:
            - id: parametric-area-cloze
              type: cloze
              prompt: 'In parametric area, $dx$ becomes $x''(t)\,____$.' 
              answer:
                expected: dt
              explanation: Since $x=x(t)$, a small change in $x$ is $dx=x'(t)\,dt$.
              tags: [parametric-integrals, area]

        - id: cusp
          term: Cusp or Singular Point
          definition: |
            A point where the ordinary parametric slope test may fail, often because both component rates vanish.
          notation: '$x''(t)=0,\quad y''(t)=0$'
          examples:
            - If both $dx/dt$ and $dy/dt$ are zero, $\frac{dy/dx}{ }$ is not decided by simple division.
          aliases: [singular point]
          tags: [parametric-derivatives, cusps]
          drills:
            - id: cusp-flashcard
              type: flashcard
              prompt: Why is a point with $dx/dt=0$ and $dy/dt=0$ special?
              answer:
                expected: The ordinary slope formula gives an indeterminate form, so the tangent behavior needs separate analysis.
              explanation: It may be a cusp, a stop-and-turn point, or another singular behavior.
              tags: [parametric-derivatives, cusps]
