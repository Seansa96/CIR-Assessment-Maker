workedExamples:
- id: aops-polygons-we-1
  title: 'Area of a Regular Octagon'
  prompt: 'A regular octagon has a side length of 2. Compute its area.'
  steps:
  - id: step-1
    title: Enclose the octagon in a square
    prompt: Instead of using the apothem, extend the alternating sides of the regular octagon to form a bounding square. What are the corner shapes that are left out of the square?
    difficultyDimensions:
    - Determine the exterior angle of the octagon.
    - Identify the four corner shapes as right isosceles triangles.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The exterior angle of a regular octagon is $360^\circ / 8 = 45^\circ$.
      - The corners are $45-45-90$ right triangles.
    explanation: |
      Solution:
      The exterior angle of a regular octagon is $\frac{360^\circ}{8} = 45^\circ$.
      If we extend the vertical and horizontal sides of the octagon, they meet at $90^\circ$ angles, forming a large bounding square.
      The four corners of this square (outside the octagon) are right triangles with base angles of $45^\circ$ (matching the exterior angles of the octagon). Thus, they are $45-45-90$ right isosceles triangles.

      Why it works:
      Decomposing or bounding a regular polygon using the grid (vertical/horizontal lines) is often much faster than using trigonometry to find the apothem.
  - id: step-2
    title: Compute the legs of the corner triangles
    prompt: Use the hypotenuse of these corner triangles (which is a side of the octagon) to find their leg lengths.
    difficultyDimensions:
    - Set the hypotenuse to 2.
    - Divide by $\sqrt{2}$ to find the legs.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Hypotenuse $= 2$.
      - Leg $= \frac{2}{\sqrt{2}} = \sqrt{2}$.
    explanation: |
      Solution:
      The hypotenuse of each $45-45-90$ corner triangle is exactly one slanted side of the octagon, which has length 2.
      In a $45-45-90$ triangle, the hypotenuse is $\sqrt{2}$ times the leg.
      $$\text{Leg} = \frac{2}{\sqrt{2}} = \sqrt{2}$$

      Why it works:
      The special right triangle ratios provide exact radical lengths without needing sine or cosine.
  - id: step-3
    title: Find the area of the bounding square
    prompt: Calculate the side length of the bounding square and its total area.
    difficultyDimensions:
    - Sum the two legs and the horizontal/vertical side of the octagon.
    - Square this total length.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Side of square $= \sqrt{2} + 2 + \sqrt{2} = 2 + 2\sqrt{2}$.
      - Area of square $= (2 + 2\sqrt{2})^2 = 4 + 8\sqrt{2} + 8 = 12 + 8\sqrt{2}$.
    explanation: |
      Solution:
      The side of the bounding square consists of a leg from the left corner triangle, the top horizontal side of the octagon, and a leg from the right corner triangle.
      $$\text{Side} = \sqrt{2} + 2 + \sqrt{2} = 2 + 2\sqrt{2}$$
      The total area of the bounding square is:
      $$(2 + 2\sqrt{2})^2 = 2^2 + 2(2)(2\sqrt{2}) + (2\sqrt{2})^2$$
      $$= 4 + 8\sqrt{2} + 8 = 12 + 8\sqrt{2}$$

      Why it works:
      The square perfectly circumscribes the octagon, giving us an upper bound on the area.
  - id: step-4
    title: Subtract the corner triangles
    prompt: Subtract the total area of the four corner triangles from the square's area to find the octagon's area.
    difficultyDimensions:
    - Compute the area of one corner triangle.
    - Multiply by 4 and subtract.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Area of one corner triangle $= \frac{1}{2}(\sqrt{2})(\sqrt{2}) = 1$.
      - Four corners $= 4$.
      - Octagon area $= 12 + 8\sqrt{2} - 4 = 8 + 8\sqrt{2}$.
    explanation: |
      Solution:
      The area of one $45-45-90$ corner triangle with legs $\sqrt{2}$ is:
      $$\text{Area} = \frac{1}{2} (\sqrt{2})(\sqrt{2}) = \frac{1}{2}(2) = 1$$
      There are four such corners, so their total area is 4.
      Subtracting this from the bounding square's area gives the area of the regular octagon:
      $$\text{Octagon Area} = (12 + 8\sqrt{2}) - 4 = 8 + 8\sqrt{2}$$

      Why it works:
      Conservation of area. We found the area of a large, easy shape and subtracted the four pieces that didn't belong to the octagon.

- id: aops-polygons-we-2
  title: 'Angles of a Regular Polygon'
  prompt: 'Three consecutive vertices of a regular polygon are $A, B$, and $C$. If $\angle BAC = 15^\circ$, how many sides does the polygon have?'
  steps:
  - id: step-1
    title: Analyze the triangle formed by three vertices
    prompt: What kind of triangle is $\triangle ABC$? Determine its angles.
    difficultyDimensions:
    - Recognize that consecutive sides of a regular polygon are equal.
    - Identify $\triangle ABC$ as isosceles.
    - Calculate the vertex angle $\angle B$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AB$ and $BC$ are consecutive sides, so $AB = BC$.
      - $\triangle ABC$ is isosceles, so $\angle BCA = \angle BAC = 15^\circ$.
      - $\angle B = 180^\circ - 15^\circ - 15^\circ = 150^\circ$.
    explanation: |
      Solution:
      Because the polygon is regular, all its sides are equal in length.
      Thus, the consecutive sides $AB$ and $BC$ are equal: $AB = BC$.
      This makes $\triangle ABC$ an isosceles triangle.
      The base angles must be equal, so $\angle BCA = \angle BAC = 15^\circ$.
      The sum of the angles in a triangle is $180^\circ$, so the vertex angle at $B$ is:
      $$\angle B = 180^\circ - 15^\circ - 15^\circ = 150^\circ$$

      Why it works:
      The angle $\angle B$ is precisely an interior angle of the regular polygon!
  - id: step-2
    title: Determine the number of sides
    prompt: Use the interior (or exterior) angle to find the number of sides $n$.
    difficultyDimensions:
    - Calculate the exterior angle.
    - Divide $360^\circ$ by the exterior angle.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The interior angle is $150^\circ$.
      - The exterior angle is $180^\circ - 150^\circ = 30^\circ$.
      - $n = \frac{360^\circ}{30^\circ} = 12$.
    explanation: |
      Solution:
      We found that the interior angle of the regular polygon is $150^\circ$.
      The exterior angle is the supplement: $180^\circ - 150^\circ = 30^\circ$.
      Since the sum of the exterior angles of any convex polygon is $360^\circ$, the number of sides $n$ is:
      $$n = \frac{360^\circ}{30^\circ} = 12$$
      The polygon is a dodecagon (12 sides).

      Why it works:
      Working with the exterior angle is computationally much simpler than setting up $\frac{180(n-2)}{n} = 150$ and solving the algebraic equation for $n$.

- id: aops-polygons-we-3
  title: 'Intersecting Diagonals'
  prompt: 'In a convex heptagon (7 sides), no three diagonals intersect at the exact same internal point. How many internal intersection points of diagonals are there?'
  steps:
  - id: step-1
    title: Map an intersection to vertices
    prompt: How many vertices are required to define two diagonals that intersect inside the polygon?
    difficultyDimensions:
    - Realize that an intersection requires 2 lines.
    - Realize that 2 lines require 4 endpoints on the perimeter.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - An intersection is formed by the crossing of two diagonals.
      - Two diagonals are defined by exactly 4 unique vertices on the polygon.
    explanation: |
      Solution:
      An internal intersection point is created when two diagonals cross.
      Two diagonals have a total of 4 endpoints. Because they are diagonals of a convex polygon, all 4 of these endpoints are vertices of the polygon.
      
      Why it works:
      We are transforming a geometry problem about internal points into a combinatorics problem about selecting vertices on the boundary.
  - id: step-2
    title: Prove a 1-to-1 correspondence
    prompt: If you choose any 4 vertices of the convex polygon, how many internal intersection points do their diagonals create?
    difficultyDimensions:
    - Recognize that 4 vertices form a convex quadrilateral.
    - Identify that a convex quadrilateral has exactly 1 internal diagonal intersection.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Four vertices form a convex quadrilateral.
      - A convex quadrilateral has exactly two diagonals, which intersect exactly once inside the quadrilateral.
    explanation: |
      Solution:
      If you select any 4 vertices of the convex heptagon and connect them, they form a convex quadrilateral.
      A convex quadrilateral has exactly two diagonals.
      Because the polygon is convex, these two diagonals will *always* intersect exactly once in the interior.
      Therefore, every group of 4 vertices produces exactly 1 internal intersection point.

      Why it works:
      The condition that "no three diagonals intersect at the same point" guarantees that no intersection point is counted twice by different sets of 4 vertices. There is a perfect 1-to-1 mapping between groups of 4 vertices and internal intersections.
  - id: step-3
    title: Calculate the combinations
    prompt: Calculate the number of ways to choose 4 vertices from the 7 vertices of the heptagon.
    difficultyDimensions:
    - Set up the combination $\binom{7}{4}$.
    - Evaluate the binomial coefficient.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\binom{7}{4} = \frac{7!}{4!3!}$.
      - $\frac{7 \times 6 \times 5}{3 \times 2 \times 1} = 35$.
      - There are 35 internal intersection points.
    explanation: |
      Solution:
      Since every set of 4 vertices creates exactly 1 internal intersection, we just need to count how many ways we can choose 4 vertices out of the 7.
      $$\binom{7}{4} = \frac{7 \times 6 \times 5 \times 4}{4 \times 3 \times 2 \times 1}$$
      The 4s cancel, and $3 \times 2 = 6$, which cancels the 6 in the numerator.
      $$7 \times 5 = 35$$
      There are exactly 35 internal intersection points.

      Why it works:
      This is a beautiful example of how Olympiad geometry often blends seamlessly into combinatorics. We didn't have to draw a single line to count 35 points perfectly.
