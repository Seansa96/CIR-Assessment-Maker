questions:
- id: q001
  type: numericResponse
  prompt: "A small boat floats in a freshwater lake ($\\rho = 1000 \\text{ kg/m}^3$)\
    \ and displaces $2.5 \\text{ m}^3$ of water. \nWhat is the total mass of the boat\
    \ (including cargo) in kg?\n"
  answer:
    value: 2500
    tolerance: 10
  explanation: 'Solution:

    Because the boat is floating, its weight equals the buoyant force: $m g = \rho_{water}
    V_{sub} g$.

    The $g$ cancels, leaving $m = \rho_{water} V_{sub} = 1000 \times 2.5 = 2500 \text{
    kg}$.


    Why it works:

    According to the law of flotation (a consequence of Archimedes'' Principle), a
    floating object displaces its own mass in fluid. Therefore, measuring the displaced
    volume of water directly tells you the mass of the boat.

    '
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: 'A completely solid, incompressible iron anchor is dropped into the ocean
    and sinks to the bottom. As it sinks deeper and deeper into the ocean (assuming
    the density of seawater is perfectly uniform), what happens to the buoyant force
    acting on the anchor?

    '
  choices:
  - id: a
    text: The buoyant force increases as the depth (and hydrostatic pressure) increases.
    issueSignals:
    - id: depth-pressure-buoyancy-confusion
  - id: b
    text: The buoyant force decreases because the anchor is moving further from the
      surface.
    issueSignals:
    - id: depth-pressure-buoyancy-confusion
  - id: c
    text: The buoyant force remains exactly the same.
  answer:
    choiceId: c
  explanation: 'Solution:

    The buoyant force remains exactly the same.


    Why it works:

    The buoyant force is strictly equal to the weight of the displaced fluid ($F_B
    = \rho V_{sub} g$). Since the anchor is incompressible, its volume $V_{sub}$ does
    not change. Since the fluid density $\rho$ is assumed uniform, the buoyant force
    is constant regardless of depth or ambient pressure.


    Why the other choices fail:

    While hydrostatic pressure does increase with depth, it pushes inward from all
    sides equally, so the *difference* in pressure between the top and bottom of the
    anchor remains exactly the same.

    '
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
