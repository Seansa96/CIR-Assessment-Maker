    check:
      id: cpp-strings-formatting-check-5
      type: multipleChoice
      prompt: Why can `getline` immediately after `std::cin >> number` return an empty string?
      choices:
      - id: a
        text: The extraction left the newline waiting in the stream
        media: []
        issueSignals: []
      - id: b
        text: Strings cannot be empty
        media: []
        issueSignals: []
      - id: c
        text: '`getline` only reads integers'
        media: []
        issueSignals: []
      - id: d
        text: '`std::cin` deletes strings'
        media: []
        issueSignals: []
