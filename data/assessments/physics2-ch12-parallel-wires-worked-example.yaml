- id: we1
  title: Force per unit length
  steps:
  - id: s1
    prompt: Calculate the force per unit length.
    explanation: 'Solution:

      1) Use the formula $\frac{F}{L} = \frac{\mu_0 I_1 I_2}{2\pi r}$.

      2) Substitute values: $\frac{F}{L} = \frac{(4\pi \times 10^{-7})(5.0)(8.0)}{2\pi (0.1)}$.

      3) Calculate: $\frac{F}{L} = (2 \times 10^{-7})(400) = 8.0 \times 10^{-5}\text{ N/m}$.

      4) Direction: Since the currents are in the same direction, they attract.


      Why it works:

      One wire creates a magnetic field $B$ at the location of the second wire, and the second wire experiences
      a Lorentz force $I \vec{L} \times \vec{B}$ in that field.'
    title: Calculate the force per unit length.
    instruction: 'Work through this step: Calculate the force per unit length.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: Two long, straight parallel wires separated by $0.1\text{ m}$ carry currents of $5.0\text{
    A}$ and $8.0\text{ A}$ in the same direction. Find the magnitude and direction of the force per unit
    length between them.
