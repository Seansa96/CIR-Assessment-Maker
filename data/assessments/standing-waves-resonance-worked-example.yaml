workedExamples:
- id: we-standing-waves-resonance
  title: Deriving and applying Standing Waves and Resonance
  problem: Use the labeled model to derive and calculate the mode frequency from $f_n=nv/(2L)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Read the diagram to determine the number of antinodes (loops).
    prompt: Identify the harmonic number $n$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Harmonic number $n$
    explanation: 'Solution: The number of ''loops'' between the two fixed nodes gives the harmonic number $n$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the boundary conditions for a string fixed at both ends.
    prompt: What are the boundary conditions?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Nodes at both ends.
    explanation: 'Solution: The displacement at $x=0$ and $x=L$ must be zero at all times.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: 'Identify the target: we want to calculate the fundamental frequency $f_1$.'
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Fundamental frequency $f_1$
    explanation: 'Solution: We are looking for $f_1$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the relation between the $n$-th harmonic frequency and the fundamental frequency.
    prompt: Write the governing relation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - f_n = n f_1
    explanation: 'Solution: $f_n = n f_1$\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the fundamental frequency $f_1$.
    prompt: Isolate $f_1$.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - f_1 = f_n / n
    explanation: 'Solution: $f_1 = \frac{f_n}{n}$\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Given that the 3rd harmonic ($n=3$) has a frequency of $150$ Hz, calculate $f_1$.
    prompt: Calculate $f_1$.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      value: 50.0
      tolerance: 0.5
    explanation: 'Solution: $f_1 = 150 / 3 = 50$ Hz.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of the frequency division.
    prompt: What are the units?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Hz
    explanation: 'Solution: Hertz divided by a dimensionless integer yields Hertz.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated fundamental frequency.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      value: 50.0
      tolerance: 0.5
    explanation: 'Solution: The fundamental frequency is $50$ Hz.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
- id: standing-harmonic-we002
  title: Third Harmonic of a Fixed String
  problem: A fixed string has length $1.20\ \text{m}$ and wave speed $120\ \text{m/s}$. Find its third-harmonic frequency.
  steps:
  - id: standing-harmonic-we002-step-1
    title: Write the harmonic formula
    type: symbolicResponse
    prompt: Write the frequency formula for the nth fixed-string harmonic.
    answer: {expectedLatex: 'f_n=\frac{nv}{2L}', equivalenceMode: expression, tolerance: 0}
    explanation: 'Solution: Use $f_n=nv/(2L)$. Why it works: a fixed string fits n half-wavelengths in its length.'
  - id: standing-harmonic-we002-step-2
    title: Calculate the third harmonic
    type: numericResponse
    prompt: Calculate $f_3$ in hertz.
    answer: {value: 150, tolerance: 0.1}
    explanation: 'Solution: $f_3=3(120)/(2\cdot1.20)=150\ \text{Hz}$. Why it works: each harmonic is an integer multiple of the fundamental.'
