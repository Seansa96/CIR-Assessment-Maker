workedExamples:
- id: we-standing-waves-resonance
  title: Deriving and applying Standing Waves and Resonance
  problem: Use the labeled model to derive and calculate the mode frequency from $f_n=nv/(2L)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Read the diagram to determine the number of antinodes (loops).
    prompt: 'Identify the harmonic number $n$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Harmonic number $n$'
    explanation: >-
      The number of 'loops' between the two fixed nodes gives the harmonic number $n$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the boundary conditions for a string fixed at both ends.
    prompt: 'What are the boundary conditions?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Nodes at both ends.'
    explanation: >-
      The displacement at $x=0$ and $x=L$ must be zero at all times.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want to calculate the fundamental frequency $f_1$.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Fundamental frequency $f_1$'
    explanation: >-
      We are looking for $f_1$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the relation between the $n$-th harmonic frequency and the fundamental frequency.
    prompt: 'Write the governing relation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_n = n f_1'
    explanation: >-
      $f_n = n f_1$
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the fundamental frequency $f_1$.
    prompt: 'Isolate $f_1$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'f_1 = f_n / n'
    explanation: >-
      $f_1 = \frac{f_n}{n}$
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given that the 3rd harmonic ($n=3$) has a frequency of $150$ Hz, calculate $f_1$.
    prompt: 'Calculate $f_1$.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      value: 3.0
      tolerance: 0.03
    explanation: >-
      $f_1 = 150 / 3 = 50$ Hz.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of the frequency division.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Hz'
    explanation: >-
      Hertz divided by a dimensionless integer yields Hertz.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated fundamental frequency.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/standing-waves-resonance.svg
      alt: Labeled original schematic for Standing Waves and Resonance used for quantitative analysis.
      caption: Standing Waves and Resonance model diagram.
    answer:
      value: 3.0
      tolerance: 0.03
    explanation: >-
      The fundamental frequency is $50$ Hz.
