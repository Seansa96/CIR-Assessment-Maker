questions:
- id: q001
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-expansion
  prompt: Find the coefficient of the $x^3$ term in the Maclaurin series for $f(x) = e^{2x}$.
  answer:
    value: 1.333
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: Maclaurin series for $e^u$ is $1 + u + u^2/2! + u^3/3!$. Let $u=2x$, so the $x^3$ term is $(2x)^3/6 = 8x^3/6 = (4/3)x^3$. Coefficient is 4/3 = 1.333. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q002
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-evaluation
  prompt: Evaluate the infinite sum $\sum_{n=0}^{\infty} \frac{3^n}{n!}$.
  answer:
    value: 20.08
    tolerance: 0.1
    gradingMode: selfCheck
  explanation: This matches the Maclaurin series for $e^x = \sum \frac{x^n}{n!}$ evaluated at $x=3$. Thus the sum is $e^3 \approx 20.085$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q003
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-expansion
  prompt: Find the coefficient of $x^2$ in the Maclaurin series for $f(x) = x \sin(x)$.
  answer:
    value: 1.0
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: Maclaurin series for $\sin x$ is $x - x^3/3! + ...$ Multiplying by $x$ gives $x^2 - x^4/3! + ...$. The coefficient of $x^2$ is 1. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: q004
  type: freeResponse
  skills:
  - taylor-maclaurin
  blueprintId: calc2-taylor-maclaurin-evaluation
  prompt: Evaluate the infinite sum $\sum_{n=0}^{\infty} \frac{(-1)^n \pi^{2n+1}}{2^{2n+1} (2n+1)!}$.
  answer:
    value: 1.0
    tolerance: 0.01
    gradingMode: selfCheck
  explanation: This matches the Maclaurin series for $\sin(x) = \sum_{n=0}^{\infty} \frac{(-1)^n x^{2n+1}}{(2n+1)!}$ evaluated at $x = \pi/2$. Thus the sum is $\sin(\pi/2) = 1$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
