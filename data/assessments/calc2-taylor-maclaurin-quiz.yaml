questions:
- id: q001
  type: multipleChoice
  skills:
  - taylor-maclaurin
  prompt: 'Find the Maclaurin series for $f(x) = \sin(2x)$.

    '
  choices:
  - id: a
    text: $\sum_{n=0}^\infty \frac{(-1)^n 2^{2n+1} x^{2n+1}}{(2n+1)!}$
  - id: b
    text: $\sum_{n=0}^\infty \frac{(-1)^n 2 x^{2n+1}}{(2n+1)!}$
  - id: c
    text: $\sum_{n=0}^\infty \frac{(-1)^n (2x)^{2n+1}}{n!}$
  - id: d
    text: $\sum_{n=0}^\infty \frac{(-1)^n 2^{n} x^{n}}{(2n)!}$
  answer:
    choiceId: a
  explanation: 'Take the known series for $\sin u = \sum \frac{(-1)^n u^{2n+1}}{(2n+1)!}$
    and substitute $u = 2x$.

    The $(2x)^{2n+1}$ term expands to $2^{2n+1} x^{2n+1}$.

    '
- id: q002
  type: numericResponse
  skills:
  - taylor-maclaurin
  prompt: 'What is the 3rd degree Taylor polynomial (up to the $x^3$ term) for $f(x)
    = e^x$ centered at $a = 0$, evaluated at $x = 1$?

    *(Give the exact decimal value)*

    '
  answer:
    value: 2.666
    tolerance: 0.01
  explanation: 'The polynomial is $1 + x + \frac{x^2}{2} + \frac{x^3}{6}$.

    At $x=1$: $1 + 1 + 1/2 + 1/6 = 2 + 3/6 + 1/6 = 2 + 4/6 = 2 + 2/3 \a\approx 2.666$.

    (Notice\rhow close this is to the true value of $e \a\approx 2.718$!)

    '
- id: q003
  type: numericResponse
  skills:
  - taylor-maclaurin
  prompt: 'If $f(x) = \sum_{n=0}^\infty \frac{f^{(n)}(2)}{n!} (x-2)^n$, and you are
    given that the series is $5 - 3(x-2) + 7(x-2)^2 - 4(x-2)^3 \dots$

    What is the value of the second derivative $f''''(2)$?

    '
  answer:
    value: 14
    tolerance: 0.1
  explanation: 'The coefficient of $(x-2)^2$ is 7.

    By the Taylor formula, $c_2 = \frac{f''''(2)}{2!}$.

    So $7 = \frac{f''''(2)}{2} \implies f''''(2) = 14$.

    '
- id: q004
  type: multipleChoice
  skills:
  - taylor-maclaurin
  prompt: 'Use Maclaurin series to find $\lim_{x \to 0} \frac{\sin x - x}{x^3}$.

    '
  choices:
  - id: a
    text: $-1/6$
  - id: b
    text: $0$
  - id: c
    text: $1/6$
  - id: d
    text: $-\infty$
  answer:
    choiceId: a
  explanation: '$\sin x = x - \frac{x^3}{3!} + \frac{x^5}{5!} \dots$

    $\sin x - x = -\frac{x^3}{6} + \frac{x^5}{120} \dots$

    Divide by $x^3$: $-1/6 + \frac{x^2}{120} \dots$

    As $x \to 0$, the limit is $-1/6$.

    '
- id: q005
  type: multipleChoice
  skills:
  - taylor-maclaurin
  prompt: 'Find the Taylor series for $f(x) = 1/x$ centered at $a = 1$.

    '
  choices:
  - id: a
    text: $\sum_{n=0}^\infty (-1)^n (x-1)^n$
  - id: b
    text: $\sum_{n=0}^\infty (x-1)^n$
  - id: c
    text: $\sum_{n=0}^\infty (-1)^n \frac{(x-1)^n}{n!}$
  - id: d
    text: $\sum_{n=0}^\infty \frac{(x-1)^n}{n}$
  answer:
    choiceId: a
  explanation: 'Rewrite $1/x$ as $1 / (1 - (-(x-1)))$.

    This is a geometric series with $a=1, r=-(x-1)$.

    The sum is $\sum (-(x-1))^n = \sum (-1)^n (x-1)^n$.

    (You could also derive it: $f^{(n)}(1) = (-1)^n n!$, so $c_n = (-1)^n n! / n!
    = (-1)^n$).

    '
