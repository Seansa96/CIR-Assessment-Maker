- id: q004
  type: freeResponse
  prompt: Evaluate the infinite sum $\sum_{n=0}^{\infty} \frac{(-1)^n \pi^{2n+1}}{2^{2n+1} (2n+1)!}$.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
