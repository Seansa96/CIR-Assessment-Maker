- id: q002
  type: freeResponse
  prompt: Evaluate the infinite sum $\sum_{n=0}^{\infty} \frac{3^n}{n!}$.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 20.079999999999998
    tolerance: 0.1
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: This matches the Maclaurin series for $e^x = \sum \frac{x^n}{n!}$ evaluated at $x=3$. Thus the sum is $e^3 \approx 20.085$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.


    Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.


    Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.
