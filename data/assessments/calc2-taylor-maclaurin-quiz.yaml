  explanation: >-
    Solution: This matches the Maclaurin series for $\sin(x) = \sum_{n=0}^{\infty} \frac{(-1)^n x^{2n+1}}{(2n+1)!}$ evaluated at $x = \pi/2$. Thus the sum is $\sin(\pi/2) = 1$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.


