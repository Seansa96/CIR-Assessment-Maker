questions:
- id: q001
  type: multipleChoice
  skills:
  - taylor-maclaurin
  prompt: |
    Find the Maclaurin series for $f(x) = \sin(2x)$.
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^\infty \frac{(-1)^n 2^{2n+1} x^{2n+1}}{(2n+1)!}$
  - id: b
    text: |-
      $\sum_{n=0}^\infty \frac{(-1)^n 2 x^{2n+1}}{(2n+1)!}$
  - id: c
    text: |-
      $\sum_{n=0}^\infty \frac{(-1)^n (2x)^{2n+1}}{n!}$
  - id: d
    text: |-
      $\sum_{n=0}^\infty \frac{(-1)^n 2^{n} x^{n}}{(2n)!}$
  answer:
    choiceId: a
  explanation: |
    Take the known series for $\sin u = \sum \frac{(-1)^n u^{2n+1}}{(2n+1)!}$ and substitute $u = 2x$.
    The $(2x)^{2n+1}$ term expands to $2^{2n+1} x^{2n+1}$.
- id: q002
  type: numericResponse
  skills:
  - taylor-maclaurin
  prompt: |
    What is the 3rd degree Taylor polynomial (up to the $x^3$ term) for $f(x) = e^x$ centered at $a = 0$, evaluated at $x = 1$?
    *(Give the exact decimal value)*
  answer:
    value: 2.666
    tolerance: 0.01
  explanation: |
    The polynomial is $1 + x + \frac{x^2}{2} + \frac{x^3}{6}$.
    At $x=1$: $1 + 1 + 1/2 + 1/6 = 2 + 3/6 + 1/6 = 2 + 4/6 = 2 + 2/3 \a\approx 2.666$.
    (Notice\rhow close this is to the true value of $e \a\approx 2.718$!)
- id: q003
  type: numericResponse
  skills:
  - taylor-maclaurin
  prompt: |
    If $f(x) = \sum_{n=0}^\infty \frac{f^{(n)}(2)}{n!} (x-2)^n$, and you are given that the series is $5 - 3(x-2) + 7(x-2)^2 - 4(x-2)^3 \dots$
    What is the value of the second derivative $f''(2)$?
  answer:
    value: 14
    tolerance: 0.1
  explanation: |
    The coefficient of $(x-2)^2$ is 7.
    By the Taylor formula, $c_2 = \frac{f''(2)}{2!}$.
    So $7 = \frac{f''(2)}{2} \implies f''(2) = 14$.
- id: q004
  type: multipleChoice
  skills:
  - taylor-maclaurin
  prompt: |
    Use Maclaurin series to find $\lim_{x \to 0} \frac{\sin x - x}{x^3}$.
  choices:
  - id: a
    text: |-
      $-1/6$
  - id: b
    text: |-
      $0$
  - id: c
    text: |-
      $1/6$
  - id: d
    text: |-
      $-\infty$
  answer:
    choiceId: a
  explanation: |
    $\sin x = x - \frac{x^3}{3!} + \frac{x^5}{5!} \dots$
    $\sin x - x = -\frac{x^3}{6} + \frac{x^5}{120} \dots$
    Divide by $x^3$: $-1/6 + \frac{x^2}{120} \dots$
    As $x \to 0$, the limit is $-1/6$.
- id: q005
  type: multipleChoice
  skills:
  - taylor-maclaurin
  prompt: |
    Find the Taylor series for $f(x) = 1/x$ centered at $a = 1$.
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^\infty (-1)^n (x-1)^n$
  - id: b
    text: |-
      $\sum_{n=0}^\infty (x-1)^n$
  - id: c
    text: |-
      $\sum_{n=0}^\infty (-1)^n \frac{(x-1)^n}{n!}$
  - id: d
    text: |-
      $\sum_{n=0}^\infty \frac{(x-1)^n}{n}$
  answer:
    choiceId: a
  explanation: |
    Rewrite $1/x$ as $1 / (1 - (-(x-1)))$.
    This is a geometric series with $a=1, r=-(x-1)$.
    The sum is $\sum (-(x-1))^n = \sum (-1)^n (x-1)^n$.
    (You could also derive it: $f^{(n)}(1) = (-1)^n n!$, so $c_n = (-1)^n n! / n! = (-1)^n$).
- id: q_taylor_0
  type: multipleChoice
  prompt: |-
    What is the Maclaurin series for $e^x$?
  answer:
    choiceId: a
  explanation: |-
    The derivative of $e^x$ is always $e^x$, giving coefficients of $1/n!$.
  choices:
  - id: a
    text: |-
      $\sum x^n / n!$
  - id: b
    text: |-
      $\sum (-1)^n x^{2n} / (2n)!$
  - id: c
    text: |-
      $\sum (-1)^n x^{2n+1} / (2n+1)!$
  - id: d
    text: |-
      $\sum x^n / n$
- id: q_taylor_1
  type: multipleChoice
  prompt: |-
    Find the coefficient of $x^3$ in the Maclaurin series of $\sin(2x)$.
  answer:
    choiceId: b
  explanation: |-
    The series is $2x - (2x)^3/3! + \dots$. The cubic term is $-8x^3/6 = -4/3 x^3$.
  choices:
  - id: a
    text: |-
      $-8/3$
  - id: b
    text: |-
      $-4/3$
  - id: c
    text: |-
      $8/3$
  - id: d
    text: |-
      $4/3$
- id: q_taylor_2
  type: multipleChoice
  prompt: |-
    What is the Taylor series for $1/(1-x)$ centered at $x=0$?
  answer:
    choiceId: a
  explanation: |-
    This is the fundamental geometric series expansion for $|x| < 1$.
  choices:
  - id: a
    text: |-
      $\sum x^n$
  - id: b
    text: |-
      $\sum (-x)^n$
  - id: c
    text: |-
      $\sum x^n/n!$
  - id: d
    text: |-
      $\sum (-1)^n x^n/n$
- id: q_taylor_3
  type: multipleChoice
  prompt: 'Use a Maclaurin series to evaluate $\lim_{x \to 0} \frac{e^x - 1 - x}{x^2}$.'
  answer:
    choiceId: b
  explanation: |-
    Expand $e^x = 1 + x + x^2/2 + \dots$. The numerator becomes $x^2/2 + O(x^3)$. Dividing by $x^2$ leaves $1/2$.
  choices:
  - id: a
    text: '0'
  - id: b
    text: 1/2
  - id: c
    text: '1'
  - id: d
    text: Infinity
- id: q_taylor_4
  type: multipleChoice
  prompt: |-
    What is the radius of convergence for the Maclaurin series of $e^x$?
  answer:
    choiceId: d
  explanation: |-
    Applying the ratio test yields a limit of 0 for all $x$, so the series converges everywhere.
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: e
  - id: d
    text: |-
      $\infty$
- id: q_taylor_5
  type: multipleChoice
  prompt: |-
    Find the Maclaurin series for $\cos(x^2)$.
  answer:
    choiceId: b
  explanation: |-
    Substitute $x^2$ into the standard series for $\cos(x) = \sum (-1)^n x^{2n}/(2n)!$.
  choices:
  - id: a
    text: |-
      $\sum (-1)^n x^{2n}/(2n)!$
  - id: b
    text: |-
      $\sum (-1)^n x^{4n}/(2n)!$
  - id: c
    text: |-
      $\sum x^{4n}/(4n)!$
  - id: d
    text: |-
      $\sum (-1)^n x^{4n}/n!$
- id: q_taylor_6
  type: multipleChoice
  prompt: |-
    What is the first non-zero term of the Maclaurin series for $\ln(1+x)$?
  answer:
    choiceId: b
  explanation: |-
    The series begins $x - x^2/2 + x^3/3 - \dots$
  choices:
  - id: a
    text: '1'
  - id: b
    text: |-
      $x$
  - id: c
    text: |-
      $-x$
  - id: d
    text: |-
      $x^2/2$
- id: q_taylor_7
  type: multipleChoice
  prompt: |-
    Determine the coefficient of $x^4$ in the Maclaurin series for $e^{-x^2}$.
  answer:
    choiceId: a
  explanation: |-
    Substitute $-x^2$ into $e^u = 1 + u + u^2/2!$. The quadratic term $u^2/2$ becomes $(-x^2)^2/2 = x^4/2$.
  choices:
  - id: a
    text: 1/2
  - id: b
    text: -1/2
  - id: c
    text: 1/24
  - id: d
    text: -1/24
- id: q_taylor_8
  type: multipleChoice
  prompt: |-
    Which function has the Maclaurin series $\sum_{n=0}^\infty (-1)^n x^{2n+1} / (2n+1)!$?
  answer:
    choiceId: a
  explanation: This is the standard alternating series for sine, consisting of only odd powers.
  choices:
  - id: a
    text: |-
      $\sin(x)$
  - id: b
    text: |-
      $\cos(x)$
  - id: c
    text: |-
      $\sinh(x)$
  - id: d
    text: '$\arctan(x)$'
- id: q_taylor_9
  type: multipleChoice
  prompt: |-
    Use a series to approximate $\int_0^1 \sin(x^2) dx$ using the first term.
  answer:
    choiceId: c
  explanation: '$\sin(x^2) \approx x^2$. Integrating $x^2$ from 0 to 1 gives $1/3$.'
  choices:
  - id: a
    text: '1'
  - id: b
    text: 1/2
  - id: c
    text: 1/3
  - id: d
    text: 1/4
