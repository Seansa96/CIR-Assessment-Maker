- id: q015
  type: freeResponse
  prompt: Find the coefficient of $x^2$ in the Maclaurin series for $f(x) = x \sin(x)$.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 1
    tolerance: 0.01
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: Maclaurin series for $\sin x$ is $x - x^3/3! + ...$ Multiplying by $x$ gives $x^2 - x^4/3! + ...$. The coefficient of $x^2$ is 1. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.


    Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.


    Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.
