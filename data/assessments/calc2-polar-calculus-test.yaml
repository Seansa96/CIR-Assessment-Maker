questions:
  - id: q-polar-calc-test-1
    type: numericResponse
    title: Area Shared by Two Curves
    prompt: |
      Find the area of the region common to the interiors of the polar curves:
      
      $$
      r = 3\cos\theta
      $$
      $$
      r = 3\sin\theta
      $$
      
      Provide your answer as a decimal rounded to 3 decimal places.
    answer:
      value: 1.284
      tolerance: 0.005
    explanation: |
      The curves intersect where $3\cos\theta = 3\sin\theta \implies \tan\theta = 1 \implies \theta = \frac{\pi}{4}$.
      The region shared by both lies between the pole and the intersection point. 
      From $\theta = 0$ to $\theta = \frac{\pi}{4}$, the bounding curve is $r = 3\sin\theta$.
      From $\theta = \frac{\pi}{4}$ to $\theta = \frac{\pi}{2}$, the bounding curve is $r = 3\cos\theta$.
      
      $A = \frac{1}{2} \int_0^{\pi/4} (3\sin\theta)^2 d\theta + \frac{1}{2} \int_{\pi/4}^{\pi/2} (3\cos\theta)^2 d\theta$
      
      By symmetry, the two pieces have equal area.
      $A = 2 \times \frac{1}{2} \int_0^{\pi/4} 9\sin^2\theta d\theta = 9 \int_0^{\pi/4} \frac{1 - \cos(2\theta)}{2} d\theta$
      $A = \frac{9}{2} \left[ \theta - \frac{1}{2}\sin(2\theta) \right]_0^{\pi/4}$
      $A = \frac{9}{2} \left( \frac{\pi}{4} - \frac{1}{2}(1) \right) = \frac{9\pi}{8} - \frac{9}{4}$.
      
      Evaluating numerically:
      $9\pi/8 \approx 3.53429$
      $9/4 = 2.25$
      $3.53429 - 2.25 = 1.28429 \approx 1.284$.
    skills:
      - polar-calculus

  - id: q-polar-calc-test-2
    type: symbolicResponse
    title: Horizontal Tangent of a Polar Curve
    prompt: |
      Find the angles $\theta$ in $[0, 2\pi)$ where the cardioid $r = 1 + \sin\theta$ has a horizontal tangent.
      
      A horizontal tangent occurs where $\frac{dy}{d\theta} = 0$ and $\frac{dx}{d\theta} \neq 0$.
      What is the sum of these angles? (Enter your answer in terms of $\pi$)
    answer:
      expectedLatex: '\frac{7\pi}{2}'
      equivalenceMode: expression
      variables: []
      tolerance: 0.000001
    explanation: |
      For horizontal tangents, we need $\frac{dy}{d\theta} = 0$.
      $y = r\sin\theta = (1 + \sin\theta)\sin\theta = \sin\theta + \sin^2\theta$.
      $\frac{dy}{d\theta} = \cos\theta + 2\sin\theta\cos\theta = \cos\theta(1 + 2\sin\theta)$.
      
      Set $\frac{dy}{d\theta} = 0$:
      $\cos\theta = 0$ or $1 + 2\sin\theta = 0$.
      In $[0, \pi]$:
      $\cos\theta = 0 \implies \theta = \frac{\pi}{2}$.
      $1 + 2\sin\theta = 0 \implies \sin\theta = -\frac{1}{2}$. There are no solutions in $[0, \pi]$.
      
      Wait, are there any other points? $\theta = \frac{\pi}{2}$ is the only one in $[0, \pi]$. 
      Wait! Does the cardioid have a horizontal tangent at $\theta = \frac{3\pi}{2}$? 
      At $\theta = 3\pi/2$, $r = 0$, the pole. We would need to check $\frac{dx}{d\theta}$.
      Let's re-read the interval: $[0, \pi]$. The only solution is $\pi/2$.
      But wait, a cardioid $r = 1 + \sin\theta$ has a dimple/cusp at the pole $\theta = 3\pi/2$. 
      The only horizontal tangents are at $\pi/2$, $7\pi/6$, and $11\pi/6$. 
      In $[0, \pi]$, the only angle is $\pi/2$.
      So the sum is just $\frac{\pi}{2}$.
      
      Let me ask the question differently: What is the sum of ALL angles in $[0, 2\pi)$ where there is a horizontal tangent?
      The angles are $\pi/2$, $7\pi/6$, $11\pi/6$. 
      Sum: $\frac{3\pi}{6} + \frac{7\pi}{6} + \frac{11\pi}{6} = \frac{21\pi}{6} = \frac{7\pi}{2}$.
      I will change the prompt to ask for the sum over $[0, 2\pi)$.
      Let's write expectedLatex: `\frac{7\pi}{2}`.
    skills:
      - polar-calculus

  - id: q-polar-calc-test-3
    type: numericResponse
    title: Arc Length of a Logarithmic Spiral
    prompt: |
      Find the arc length of the logarithmic spiral:
      
      $$
      r = e^{\theta}
      $$
      
      from $\theta = 0$ to $\theta = \pi$.
      Provide your answer rounded to 3 decimal places.
    answer:
      value: 31.312
      tolerance: 0.005
    explanation: |
      The arc length formula in polar coordinates is:
      $L = \int_{a}^{b} \sqrt{r^2 + \left(\frac{dr}{d\theta}\right)^2} d\theta$
      
      $r = e^{\theta}$
      $\frac{dr}{d\theta} = e^{\theta}$
      
      $r^2 + \left(\frac{dr}{d\theta}\right)^2 = e^{2\theta} + e^{2\theta} = 2e^{2\theta}$
      
      $L = \int_0^{\pi} \sqrt{2e^{2\theta}} d\theta = \int_0^{\pi} \sqrt{2} e^{\theta} d\theta = \sqrt{2} [e^{\theta}]_0^{\pi} = \sqrt{2}(e^{\pi} - 1)$.
      
      $\sqrt{2}(e^{\pi} - 1) \approx 1.4142 \times (23.1407 - 1) = 31.312$.
    skills:
      - polar-calculus
