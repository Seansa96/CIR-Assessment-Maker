questions:
- id: q001
  type: multipleChoice
  prompt: A medication amount $A(t)$ receives a constant infusion of $5$ mg/h and is removed at rate $0.2A$ mg/h.
    Which rate law is correct?
  skills:
  - ede-ch01-introduction-model-rate-laws
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch01-introduction-model-rate-laws
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $A'=5-0.2A$
  - id: b
    text: $A'=5+0.2A$
    issueSignals:
    - id: ede-model-balance-sign-error
      domains: &id001
      - elementary-differential-equations-bvp
  - id: c
    text: $A'=0.2-5A$
    issueSignals:
    - id: ede-dependent-variable-error
      domains: *id001
  - id: d
    text: $A=5-0.2A'$
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $A'=5-0.2A$.

    Why it works: Net change equals input minus removal, and both terms have amount-per-time units.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch01-introduction-model-rate-laws
  extensionObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
- id: q002
  type: selectAll
  prompt: Select every correct statement about $y^{(4)}+x(y'')^3=y$.
  skills:
  - ede-ch01-introduction-classify-solutions
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-classify-solutions
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: It is fourth order.
  - id: b
    text: The exponent $3$ on $y''$ does not determine the order.
  - id: c
    text: It is third order.
    issueSignals:
    - id: ede-order-classification-error
      domains: *id001
  - id: d
    text: $x$ is necessarily the dependent variable.
    issueSignals:
    - id: ede-dependent-variable-error
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
  explanation: |-
    Solution: The equation is fourth order, and derivative powers do not set order.

    Why it works: Order is controlled by $y^{(4)}$, while $y$ is the unknown dependent function.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
- id: q003
  type: multipleChoice
  prompt: Which statement correctly describes $y^2+x^2=C$?
  skills:
  - ede-ch01-introduction-classify-solutions
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-classify-solutions
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: It is an implicit one-parameter family that can have multiple local branches.
  - id: b
    text: It is one explicit solution for all real $x$.
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  - id: c
    text: It is an IVP because it contains $C$.
    issueSignals:
    - id: ede-condition-ignored
      domains: *id001
  - id: d
    text: It has no dependent variable.
    issueSignals:
    - id: ede-dependent-variable-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: It is an implicit one-parameter family.

    Why it works: The constant produces a family, while $y$ is not isolated and may have two branches.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q004
  type: symbolicResponse
  prompt: Solve the IVP $y'=2t+3$, $y(1)=4$. Enter $y(t)$.
  skills:
  - ede-ch01-introduction-initial-value-validity
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch01-introduction-initial-value-validity
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: t^2+3t
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.0001
  explanation: |-
    Solution: $y=t^2+3t+C$ and $4=1+3+C$, so $C=0$.

    Why it works: Differentiation gives $2t+3$ and substitution at $t=1$ gives $4$.
- id: q005
  type: multipleChoice
  prompt: The ODE is $y'=1/(x^2-4)$ and an initial condition is imposed at $x=3$. Which maximal interval can contain
    the solution?
  skills:
  - ede-ch01-introduction-initial-value-validity
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-initial-value-validity
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: '$(2,\infty)$'
  - id: b
    text: $(-2,2)$
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  - id: c
    text: '$(-\infty,-2)$'
    issueSignals:
    - id: ede-condition-ignored
      domains: *id001
  - id: d
    text: '$(-\infty,\infty)$'
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The interval is $(2,\infty)$.

    Why it works: The singularities are $-2$ and $2$, and the connected interval must contain $3$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q006
  type: numericResponse
  prompt: For $y'=y-x^2$, what is the slope at $(-2,5)$?
  skills:
  - ede-ch01-introduction-direction-fields
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch01-introduction-direction-fields
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 1
    tolerance: 0
  explanation: |-
    Solution: The slope is $5-(-2)^2=1$.

    Why it works: Substituting the point into the right-hand side gives the local segment slope.
- id: q007
  type: selectAll
  prompt: For $y'=y(2-y)$, select every correct qualitative statement.
  skills:
  - ede-ch01-introduction-direction-fields
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-direction-fields
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: $y=0$ is an equilibrium.
  - id: b
    text: $y=2$ is an equilibrium.
  - id: c
    text: A solution with $0<y<2$ initially rises.
  - id: d
    text: A solution with $y>2$ initially rises.
    issueSignals:
    - id: ede-direction-field-sign-error
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: |-
    Solution: The first three statements are correct.

    Why it works: The rate vanishes at $0$ and $2$, is positive between them, and is negative above $2$.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
- id: q008
  type: multipleChoice
  prompt: A curve in the field for $y'=-y$ starts at $(0,-3)$. What is its initial behavior?
  skills:
  - ede-ch01-introduction-direction-fields
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-direction-fields
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: It rises because $-(-3)>0$.
  - id: b
    text: It falls because the initial $y$ is negative.
    issueSignals:
    - id: ede-direction-field-sign-error
      domains: *id001
  - id: c
    text: It is an equilibrium.
    issueSignals:
    - id: ede-equilibrium-solution-missed
      domains: *id001
  - id: d
    text: Its slope is $-3$.
    issueSignals:
    - id: ede-direction-field-sign-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: It initially rises with slope $3$.

    Why it works: The field slope is $-y$, which equals $3$ at the initial point.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q009
  type: multipleChoice
  prompt: Which expression is an explicit branch of $x^2+y^2=16$?
  skills:
  - ede-ch01-introduction-classify-solutions
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-classify-solutions
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: '$y=\sqrt{16-x^2}$'
  - id: b
    text: $x^2+y^2=16$
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  - id: c
    text: $y'=2x$
    issueSignals:
    - id: ede-method-selection-error
      domains: *id001
  - id: d
    text: $y(0)=4$
    issueSignals:
    - id: ede-condition-ignored
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $y=\sqrt{16-x^2}$ is one explicit branch.

    Why it works: It isolates $y$ as a single-valued function on its domain.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q010
  type: symbolicResponse
  prompt: The family $y=Ce^{-2x}$ satisfies $y'=-2y$. Use $y(0)=5$ to enter the particular solution.
  skills:
  - ede-ch01-introduction-initial-value-validity
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch01-introduction-initial-value-validity
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: 5e^{-2x}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: |-
    Solution: $5=C e^0$ gives $C=5$, so $y=5e^{-2x}$.

    Why it works: The initial condition selects one member, and differentiating gives $-2y$.
- id: q011
  type: multipleChoice
  prompt: A reservoir volume $V(t)$ begins at 100 L, receives 7 L/min, and drains 4 L/min. Which IVP and conclusion
    are both correct?
  skills:
  - ede-ch01-introduction-model-rate-laws
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch01-introduction-model-rate-laws
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $V'=3$, $V(0)=100$, so $V$ increases linearly.
  - id: b
    text: $V'=11$, $V(0)=100$, so $V$ increases exponentially.
    issueSignals:
    - id: ede-model-balance-sign-error
      domains: *id001
  - id: c
    text: $V'=-3$, $V(0)=100$, so $V$ decreases.
    issueSignals:
    - id: ede-model-balance-sign-error
      domains: *id001
  - id: d
    text: $V'=3V$, so the flow depends on current volume.
    issueSignals:
    - id: ede-model-rate-unit-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $V'=7-4=3$ with $V(0)=100$, so $V=100+3t$.

    Why it works: A constant net volumetric flow produces a constant derivative and therefore a linear solution.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch01-introduction-model-rate-laws
  extensionObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
- id: q012
  type: selectAll
  prompt: For $y'=y/(x-1)$ with $y(0)=2$, select every conclusion justified before solving.
  skills:
  - ede-ch01-introduction-initial-value-validity
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch01-introduction-initial-value-validity
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: The validity interval containing the initial point cannot cross $x=1$.
  - id: b
    text: The direction-field slope at $(0,2)$ is $-2$.
  - id: c
    text: $y=0$ is an equilibrium solution.
  - id: d
    text: 'The maximal interval containing $0$ is $(1,\infty)$.'
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: |-
    Solution: The first three conclusions are justified.

    Why it works: The equation is singular at $1$, its slope at $(0,2)$ is $2/(-1)$, and its numerator vanishes along $y=0$.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
  prerequisiteObjectiveIds:
  - ede-ch01-introduction-initial-value-validity
  extensionObjectiveIds:
  - ede-ch03-numerical-methods-euler-updates
