questions:
- id: q001
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: A 0.500-kg glider is attached to a horizontal spring with spring constant 200 N/m. It is free to oscillate without friction. What is its period in seconds?
  answer: { value: 0.314159, tolerance: 0.0032 }
  explanation: For a mass–spring oscillator, $T=2\pi\sqrt{m/k}=2\pi\sqrt{0.500/200}$.
- id: q002
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: A 0.200-kg block on a frictionless table completes 25 oscillations in 10.0 s. Determine the spring constant in N/m.
  answer: { value: 49.3480, tolerance: 0.50 }
  explanation: The period is $T=10.0/25=0.400$ s, so $k=4\pi^2m/T^2$.
- id: q003
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: The position of a cart is $x=(0.0800\,\mathrm{m})\cos(6.00t)$. What is the angular frequency in rad/s?
  answer: { value: 6.0, tolerance: 0.06 }
  explanation: In $x=A\cos(\omega t+\phi)$, the coefficient of $t$ is $\omega$.
- id: q004
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: A spring exerts a restoring force of 3.60 N on a block displaced 0.120 m to the right of equilibrium. What is the magnitude of the spring constant in N/m?
  answer: { value: 30.0, tolerance: 0.30 }
  explanation: Hooke’s law gives $|F|=k|x|$, so $k=3.60/0.120$.
- id: q005
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: A mass on a spring has amplitude 0.150 m and angular frequency 4.00 rad/s. What is its maximum speed in m/s?
  answer: { value: 0.6, tolerance: 0.006 }
  explanation: 'The greatest speed occurs at equilibrium: $v_{\max}=A\omega$.'
- id: q006
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: A 0.300-kg block oscillates on a spring with $k=48.0\,\mathrm{N/m}$. At one instant its displacement is $+0.0500\,\mathrm{m}$. Find its acceleration in m/s², including its sign.
  answer: { value: -8.0, tolerance: 0.08 }
  explanation: 'The acceleration is directed toward equilibrium: $a=-(k/m)x$.'
- id: q007
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: A tuning-fork prong makes 512 complete oscillations each second. What is the period of one oscillation in seconds?
  answer: { value: 0.001953125, tolerance: 0.00002 }
  explanation: 'Frequency and period are reciprocal: $T=1/f$.'
- id: q008
  type: numericResponse
  skills: [physics-simple-harmonic-motion]
  prompt: A block oscillates between $x=-0.0600\,\mathrm{m}$ and $x=+0.0600\,\mathrm{m}$. How far does it travel during one complete cycle, in meters?
  answer: { value: 0.24, tolerance: 0.0024 }
  explanation: In one cycle it travels from one extreme to the other and back, a distance $4A$.
- id: q009
  type: symbolicResponse
  skills: [physics-simple-harmonic-motion]
  prompt: Starting with Hooke’s law $F=-kx$, solve symbolically for the displacement $x$.
  answer: { expectedLatex: '-F/k', equivalenceMode: expression, tolerance: '0.000001', variables: [F, k] }
  explanation: Divide both sides of $F=-kx$ by $-k$.
- id: q010
  type: symbolicResponse
  skills: [physics-simple-harmonic-motion]
  prompt: For a mass–spring oscillator, $\omega^2=k/m$. Solve symbolically for $k$.
  answer: { expectedLatex: 'm*omega^2', equivalenceMode: expression, tolerance: '0.000001', variables: [m, omega, k] }
  explanation: Multiply both sides of $\omega^2=k/m$ by $m$.
