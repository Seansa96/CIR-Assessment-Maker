authoring: { visualRequirement: required, visualRationale: Definitions identify parts of a differential curve segment and its swept surface. }
glossary:
  introduction: 'These terms tie each formula factor back to a short slanted curve segment.'
  sections:
    - id: terms
      title: Differential geometry vocabulary
      required: true
      content: 'Arc length accumulates slanted segments; surface area multiplies those segments by a circumference.'
      entries:
        - id: differential-arc-length
          term: Differential arc length
          definition: 'The length of a tiny curve segment: $ds=\sqrt{1+[f''(x)]^2}\,dx$ for y=f(x).'
          notation: '$ds=\sqrt{1+[f''(x)]^2}\,dx$'
          examples: ['It is the hypotenuse built from dx and dy.']
          aliases: [arc-length element]
          media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Short slanted differential segment with dx and dy legs }]
          tags: [arc-length, ds]
          drills:
            - { id: g1, type: cloze, prompt: 'For y=f(x), $ds=\sqrt{1+____}\,dx$.', answer: { expected: '[f''(x)]^2', aliases: ['f prime squared', "f'(x)^2"] }, explanation: 'Solution: The missing part is $[f''(x)]^2$. Why it works: The slope supplies $dy/dx$ in the Pythagorean relationship. Common trap: Do not use f(x) in place of its derivative.' }
        - id: surface-band
          term: Surface band
          definition: 'The narrow lateral strip swept when a differential curve segment rotates around an axis.'
          notation: '$dS=2\pi r\,ds$'
          examples: ['Its area is circumference times slanted width.']
          aliases: [lateral band]
          media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Thin surface band swept by a slanted segment }]
          tags: [surface-area, revolution]
          drills:
            - { id: g2, type: flashcard, prompt: 'What formula gives differential surface area?', answer: { expected: '$2\pi r\,ds$', aliases: ['2 pi r ds'] }, explanation: 'Solution: $dS=2\pi r\,ds$. Why it works: The band has circular circumference and slanted width. Common trap: $\pi r^2$ is a disk area, not lateral surface.' }
