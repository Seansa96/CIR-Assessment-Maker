questions:
- id: q001
  type: multipleChoice
  prompt: 'What is $\nabla(x^2+y^2)$?'
  choices:
  - id: a
    text: '$\langle2x,2y\rangle$'
  - id: b
    text: '$\langle x,y\rangle$'
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: $x^2+y^2$
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: '$\langle2,2\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Take each first partial derivative.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

    Why the other choices fail: Choice b, ''$\langle x,y\rangle$'', does not give ''$\langle2x,2y\rangle$'' for ''What is
    $\nabla(x^2+y^2)$?''. It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''$x^2+y^2$'', does not give ''$\langle2x,2y\rangle$'' for ''What is $\nabla(x^2+y^2)$?''. It substitutes a
    different result, representation, or condition for the one the prompt specifies.

    Choice d, ''$\langle2,2\rangle$'', does not give ''$\langle2x,2y\rangle$'' for ''What is $\nabla(x^2+y^2)$?''. It substitutes
    a different result, representation, or condition for the one the prompt specifies.'
