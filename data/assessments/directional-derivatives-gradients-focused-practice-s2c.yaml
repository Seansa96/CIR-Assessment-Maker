questions:
- id: q001
  type: multipleChoice
  prompt: 'What is $\nabla(x^2+y^2)$?'
  choices:
  - id: a
    text: '$\langle2x,2y\rangle$'
  - id: b
    text: '$\langle x,y\rangle$'
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: $x^2+y^2$
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: '$\langle2,2\rangle$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Take each first partial derivative.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: Why normalize a direction vector?
  choices:
  - id: a
    text: To measure change per unit distance
  - id: b
    text: To make the gradient zero
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: To remove coordinates
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: To avoid partial derivatives
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Directional derivatives are rates along unit distance.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q003
  type: multipleChoice
  prompt: Which direction gives maximum increase?
  choices:
  - id: a
    text: The gradient direction
  - id: b
    text: The negative gradient
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: Any level-curve tangent
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: The zero vector
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: The gradient points steepest uphill.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q004
  type: multipleChoice
  prompt: 'What is $D_{\mathbf u}f$?'
  choices:
  - id: a
    text: '$\nabla f\cdot\mathbf u$ for unit u'
  - id: b
    text: $f_x+f_y$
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: $|f|$
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: '$\mathbf u\times\nabla f$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: The dot product extracts the component of gradient along u.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
