schemaVersion: 1
id: physics-angular-momentum-concept-test
title: Angular Momentum Concept Test
assessmentType: test
categoryId: physics-1
topicId: physics-comprehensive-review
modeDefault: evaluate
randomizeQuestions: true
questions:
  - id: am-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students often fail to recognize that linear motion can have angular momentum."
    prerequisiteObjectiveIds: [physics-angular-momentum]
    extensionObjectiveIds: [physics-angular-momentum]
    prompt: |
      A particle moves in a straight line at a constant velocity. Does it have angular momentum relative to a given origin $O$?
    choices:
      - id: a
        text: 'No, because it is not rotating or moving in a curve.'
      - id: b
        text: 'Yes, unless the straight line passes directly through the origin $O$.'
      - id: c
        text: 'Yes, it always has a constant non-zero angular momentum regardless of the origin.'
      - id: d
        text: 'No, angular momentum is only defined for rigid bodies.'
    answer:
      choiceId: b
    explanation: |
        Solution: Angular momentum for a point particle is $\vec{L} = \vec{r} \times \vec{p}$.
        
        Why it works: As long as the position vector $\vec{r}$ and the momentum vector $\vec{p}$ are not parallel, their cross product is non-zero. If the line of motion passes through $O$, $\vec{r}$ and $\vec{p}$ are parallel, so $\vec{L} = 0$. Otherwise, $\vec{L}$ is non-zero and constant.
        
        Why the other choices fail: Rotation is not required to have angular momentum relative to an external point; it just requires a "lever arm" distance (impact parameter).

  - id: am-q02
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding when angular momentum is conserved."
    prerequisiteObjectiveIds: [physics-conservation-angular-momentum]
    extensionObjectiveIds: [physics-conservation-angular-momentum]
    prompt: |
      Under what condition is the total angular momentum of a system conserved?
    choices:
      - id: a
        text: 'When the net external force on the system is zero.'
      - id: b
        text: 'When the net external torque on the system is zero.'
      - id: c
        text: 'When the system''s moment of inertia remains constant.'
      - id: d
        text: 'When there is no internal friction within the system.'
    answer:
      choiceId: b
    explanation: |
        Solution: Newton's Second Law for rotation is $\vec{\tau}_{net,ext} = d\vec{L}/dt$.
        
        Why it works: If the net external torque is zero ($\vec{\tau}_{net,ext} = 0$), then the derivative of angular momentum is zero, meaning $\vec{L}$ is constant (conserved).
        
        Why the other choices fail: Net force relates to linear momentum. Moment of inertia can change (e.g., an ice skater pulling in their arms) while angular momentum remains conserved. Internal friction does not change total angular momentum.

  - id: am-q03
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Ice skater conservation effect."
    prerequisiteObjectiveIds: [physics-conservation-angular-momentum]
    extensionObjectiveIds: [physics-conservation-angular-momentum]
    prompt: |
      An ice skater is spinning with their arms extended. When they pull their arms in close to their body, their angular velocity increases. Why does this happen?
    choices:
      - id: a
        text: 'Their angular momentum increases.'
      - id: b
        text: 'Their moment of inertia decreases while angular momentum is conserved.'
      - id: c
        text: 'They exert a net external torque on themselves by pulling their arms.'
      - id: d
        text: 'Their rotational kinetic energy is conserved.'
    answer:
      choiceId: b
    explanation: |
        Solution: The skater is an isolated system with no external torques in the vertical direction.
        
        Why it works: Angular momentum $L = I\omega$ is conserved. Pulling the arms in reduces the moment of inertia $I$ (mass is closer to the axis). To keep $L$ constant, $\omega$ must increase proportionally.
        
        Why the other choices fail: Angular momentum does not increase. An internal force cannot create an external torque. Rotational kinetic energy actually *increases* because the skater does work to pull their arms in.

  - id: am-q04
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Kinetic energy change in angular momentum conservation."
    prerequisiteObjectiveIds: [physics-conservation-angular-momentum]
    extensionObjectiveIds: [physics-moment-of-inertia-ke]
    prompt: |
      When a spinning figure skater pulls their arms in to spin faster, what happens to their rotational kinetic energy?
    choices:
      - id: a
        text: 'It decreases.'
      - id: b
        text: 'It increases.'
      - id: c
        text: 'It remains constant.'
      - id: d
        text: 'It becomes zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: Rotational kinetic energy is $K = L^2 / (2I)$.
        
        Why it works: Angular momentum $L$ is conserved, but the moment of inertia $I$ decreases. Since $I$ is in the denominator, $K$ must increase. This extra energy comes from the biological work the skater does pulling their arms inward against centrifugal effects.
        
        Why the other choices fail: Constant $K$ only occurs if both $I$ and $\omega$ are unchanged (or change in a way that doesn't conserve $L$, which isn't the case here).

  - id: am-q05
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Direction of angular momentum."
    prerequisiteObjectiveIds: [physics-angular-momentum]
    extensionObjectiveIds: [physics-angular-momentum]
    prompt: |
      A bicycle wheel is spinning upright, rolling forward (away from you). Using the right-hand rule, in what direction does its angular momentum vector point?
    choices:
      - id: a
        text: 'Forward, in the direction of motion.'
      - id: b
        text: 'Backward, toward you.'
      - id: c
        text: 'To your left.'
      - id: d
        text: 'To your right.'
    answer:
      choiceId: c
    explanation: |
        Solution: Angular momentum $\vec{L} = I\vec{\omega}$.
        
        Why it works: Curl the fingers of your right hand in the direction the tire is spinning (forward and down over the front, back and up over the rear). Your thumb will point to the left.
        
        Why the other choices fail: Angular momentum is an axial vector perpendicular to the plane of rotation, so it cannot point forward or backward.

  - id: am-q06
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Angular momentum of a system of objects."
    prerequisiteObjectiveIds: [physics-conservation-angular-momentum]
    extensionObjectiveIds: [physics-conservation-angular-momentum]
    prompt: |
      A child runs tangentially to the edge of a stationary merry-go-round and jumps on. During this process, what is conserved for the child-merry-go-round system?
    choices:
      - id: a
        text: 'Only kinetic energy.'
      - id: b
        text: 'Only linear momentum.'
      - id: c
        text: 'Only angular momentum.'
      - id: d
        text: 'Both linear and angular momentum.'
    answer:
      choiceId: c
    explanation: |
        Solution: The merry-go-round is fixed to an axle attached to the Earth.
        
        Why it works: The axle exerts external forces to keep the merry-go-round in place, so linear momentum is not conserved. However, the axle exerts zero torque (since lever arm is zero), so angular momentum *is* conserved. The collision is inelastic, so kinetic energy is lost.
        
        Why the other choices fail: Linear momentum is destroyed by the axle force. Kinetic energy is lost in the inelastic "collision" of jumping on.

  - id: am-q07
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding rolling without slipping."
    prerequisiteObjectiveIds: [physics-rolling-motion]
    extensionObjectiveIds: [physics-rolling-motion]
    prompt: |
      A wheel rolls without slipping along a flat surface. What is the velocity of the point on the wheel that is instantaneously in contact with the ground, relative to the ground?
    choices:
      - id: a
        text: 'It is moving forward at the speed of the center of mass ($v_{cm}$).'
      - id: b
        text: 'It is moving backward at $v_{cm}$.'
      - id: c
        text: 'It is instantaneously zero.'
      - id: d
        text: 'It is moving forward at $2v_{cm}$.'
    answer:
      choiceId: c
    explanation: |
        Solution: "Rolling without slipping" means there is no relative motion between the contact point and the surface.
        
        Why it works: The translational velocity of the wheel forward exactly cancels the backward tangential velocity of the rim due to rotation ($v = r\omega$). The contact point is instantaneously at rest.
        
        Why the other choices fail: If it were moving forward or backward, the wheel would be skidding or slipping. The top of the wheel moves at $2v_{cm}$.

  - id: am-q08
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Kinetic energy of a rolling object."
    prerequisiteObjectiveIds: [physics-rolling-motion]
    extensionObjectiveIds: [physics-rolling-motion]
    prompt: |
      A solid sphere and a block of equal mass are released from rest at the top of an incline. The block slides without friction, while the sphere rolls without slipping. Which reaches the bottom with more translational kinetic energy?
    choices:
      - id: a
        text: 'The rolling sphere.'
      - id: b
        text: 'The sliding block.'
      - id: c
        text: 'They have the same translational kinetic energy.'
      - id: d
        text: 'It depends on the radius of the sphere.'
    answer:
      choiceId: b
    explanation: |
        Solution: Both start with the same potential energy ($mgh$).
        
        Why it works: The sliding block converts all its potential energy into translational kinetic energy ($\frac{1}{2}mv^2$). The rolling sphere must split its energy between translational ($\frac{1}{2}mv^2$) and rotational ($\frac{1}{2}I\omega^2$) kinetic energy. Thus, the sphere has less translational kinetic energy and moves slower.
        
        Why the other choices fail: The sphere cannot have more translational KE because some energy is locked in rotation.

  - id: am-q09
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding gyroscopic precession."
    prerequisiteObjectiveIds: [physics-precession]
    extensionObjectiveIds: [physics-precession]
    prompt: |
      A spinning gyroscope is supported at one end of its axis. Instead of falling over due to gravity, it rotates slowly around the support point in a horizontal circle. What is this phenomenon called?
    choices:
      - id: a
        text: 'Nutation'
      - id: b
        text: 'Centripetal acceleration'
      - id: c
        text: 'Precession'
      - id: d
        text: 'Conservation of angular momentum'
    answer:
      choiceId: c
    explanation: |
        Solution: The torque from gravity causes the angular momentum vector to change direction continuously, rather than changing its magnitude.
        
        Why it works: This continuous change in the direction of the spin axis is called precession ($\vec{\tau} = d\vec{L}/dt$).
        
        Why the other choices fail: Nutation is a small "nodding" motion superimposed on precession. Conservation of angular momentum is why it *resists* changing magnitude, but precession is the name of the motion caused by the external torque.

  - id: am-q10
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Torque and angular momentum vector relationship."
    prerequisiteObjectiveIds: [physics-angular-momentum]
    extensionObjectiveIds: [physics-precession]
    prompt: |
      If a net external torque is applied to a spinning object, how does the object's angular momentum vector change?
    choices:
      - id: a
        text: 'It changes in the direction of the applied torque.'
      - id: b
        text: 'It changes in a direction perpendicular to the applied torque.'
      - id: c
        text: 'It only changes its magnitude, not its direction.'
      - id: d
        text: 'It rotates to point directly opposite the applied torque.'
    answer:
      choiceId: a
    explanation: |
        Solution: Newton's Second Law for rotation in vector form is $\vec{\tau} = d\vec{L}/dt$.
        
        Why it works: The change in angular momentum ($d\vec{L}$) must be in the exact same direction as the applied net torque ($\vec{\tau}$).
        
        Why the other choices fail: If the torque is perpendicular to the existing $\vec{L}$, then $\vec{L}$ changes direction (precession). But the *change* ($d\vec{L}$) is parallel to $\vec{\tau}$.

  - id: am-q11
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Identifying static friction in rolling."
    prerequisiteObjectiveIds: [physics-rolling-motion]
    extensionObjectiveIds: [physics-rolling-motion]
    prompt: |
      For an object rolling down an incline without slipping, what force provides the torque necessary to rotationally accelerate the object?
    choices:
      - id: a
        text: 'Gravity'
      - id: b
        text: 'The normal force'
      - id: c
        text: 'Static friction'
      - id: d
        text: 'Kinetic friction'
    answer:
      choiceId: c
    explanation: |
        Solution: Torque is force times lever arm ($\tau = r F_\perp$).
        
        Why it works: Gravity acts at the center of mass (zero lever arm). Normal force acts through the center of mass (zero lever arm). Friction acts at the rim (lever arm $R$) and is static because there is no slipping at the contact point. This static friction provides the torque $\tau = R \times F_s$.
        
        Why the other choices fail: Gravity and normal force don't create torque about the center of mass. Kinetic friction only happens if slipping occurs.

  - id: am-q12
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Conservation of angular momentum in collisions."
    prerequisiteObjectiveIds: [physics-conservation-angular-momentum]
    extensionObjectiveIds: [physics-conservation-angular-momentum]
    prompt: |
      A rotating disk drops onto another identical disk that is initially at rest. They rub against each other and eventually rotate together. How does the final angular velocity compare to the initial angular velocity of the first disk?
    choices:
      - id: a
        text: 'It is the same.'
      - id: b
        text: 'It is exactly half.'
      - id: c
        text: 'It is exactly double.'
      - id: d
        text: 'It is zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: This is an inelastic rotational collision where angular momentum is conserved.
        
        Why it works: $L_{initial} = I\omega_0$. The final state has both disks rotating together, so $I_{final} = 2I$. By conservation, $I\omega_0 = 2I\omega_f \implies \omega_f = \omega_0 / 2$.
        
        Why the other choices fail: Kinetic energy is lost to friction, but angular momentum is conserved. Doubling would violate conservation laws.

  - id: am-q13
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Cross product dependencies."
    prerequisiteObjectiveIds: [physics-angular-momentum]
    extensionObjectiveIds: [physics-angular-momentum]
    prompt: |
      The angular momentum of a point particle relative to an origin is maximized when its velocity vector is:
    choices:
      - id: a
        text: 'Parallel to its position vector.'
      - id: b
        text: 'Perpendicular to its position vector.'
      - id: c
        text: 'Directed toward the origin.'
      - id: d
        text: 'Directed away from the origin.'
    answer:
      choiceId: b
    explanation: |
        Solution: Angular momentum magnitude is $L = r p \sin\theta$.
        
        Why it works: The function $\sin\theta$ is maximized when the angle $\theta$ between the position vector $\vec{r}$ and the momentum vector $\vec{p}$ (or velocity $\vec{v}$) is $90^\circ$ (perpendicular).
        
        Why the other choices fail: If they are parallel or anti-parallel (directed toward/away from origin), $\sin\theta = 0$ and $L = 0$.

  - id: am-q14
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Shape effects on rolling races."
    prerequisiteObjectiveIds: [physics-rolling-motion]
    extensionObjectiveIds: [physics-rolling-motion]
    prompt: |
      A solid sphere, a solid cylinder, and a hollow hoop (all with different masses and radii) are released from rest at the top of an incline. Which one reaches the bottom first?
    choices:
      - id: a
        text: 'The solid sphere.'
      - id: b
        text: 'The solid cylinder.'
      - id: c
        text: 'The hollow hoop.'
      - id: d
        text: 'They all tie because gravity accelerates them equally.'
    answer:
      choiceId: a
    explanation: |
        Solution: The object with the smallest fraction of its energy locked in rotation will have the highest translational speed. This depends on the geometric factor $c$ in $I = cMR^2$.
        
        Why it works: $c = 2/5 = 0.4$ for the sphere, $1/2 = 0.5$ for the cylinder, and $1$ for the hoop. Mass and radius cancel out in the energy equations. The sphere has the lowest $c$, so it converts more potential energy into translational kinetic energy and wins the race.
        
        Why the other choices fail: They do not tie because they have different distributions of mass, which require different fractions of energy to rotate.

  - id: am-q15
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Work done by friction in rolling."
    prerequisiteObjectiveIds: [physics-rolling-motion]
    extensionObjectiveIds: [physics-rolling-motion]
    prompt: |
      For an object rolling down an incline without slipping, how much mechanical work is done by the force of static friction?
    choices:
      - id: a
        text: 'Positive work.'
      - id: b
        text: 'Negative work.'
      - id: c
        text: 'Zero work.'
      - id: d
        text: 'It depends on the mass.'
    answer:
      choiceId: c
    explanation: |
        Solution: Work is force times displacement of the point of application.
        
        Why it works: In rolling without slipping, the instantaneous velocity of the contact point is exactly zero. Because the point of application of the friction force does not move while the force is applied, the static friction does zero macroscopic work and dissipates no mechanical energy.
        
        Why the other choices fail: Kinetic friction would do negative work, but there is no slipping.

  - id: am-q16
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Planetary orbits and angular momentum."
    prerequisiteObjectiveIds: [physics-conservation-angular-momentum]
    extensionObjectiveIds: [physics-conservation-angular-momentum]
    prompt: |
      A planet orbits a star in an elliptical path. As the planet moves closer to the star (from aphelion to perihelion), what happens to its angular momentum relative to the star?
    choices:
      - id: a
        text: 'It increases.'
      - id: b
        text: 'It decreases.'
      - id: c
        text: 'It remains constant.'
      - id: d
        text: 'It becomes zero.'
    answer:
      choiceId: c
    explanation: |
        Solution: Gravity is a central force, meaning it always points directly toward the star (the origin).
        
        Why it works: Because the force vector $\vec{F}$ is parallel to the position vector $\vec{r}$, the cross product $\vec{\tau} = \vec{r} \times \vec{F}$ is zero. With no external torque, angular momentum is strictly conserved.
        
        Why the other choices fail: Its linear speed increases (to keep $L = mvr_\perp$ constant as $r$ decreases), but its angular momentum does not change.

  - id: am-q17
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding precession direction."
    prerequisiteObjectiveIds: [physics-precession]
    extensionObjectiveIds: [physics-precession]
    prompt: |
      A bicycle wheel is spinning upright on an axle supported by a string at one end. If the spin direction of the wheel is reversed, what happens to its precession?
    choices:
      - id: a
        text: 'The precession stops.'
      - id: b
        text: 'The precession direction reverses.'
      - id: c
        text: 'The precession speed increases.'
      - id: d
        text: 'The precession is unaffected.'
    answer:
      choiceId: b
    explanation: |
        Solution: Precession is given by $\vec{\Omega} = \vec{\tau} / L$ (simplified magnitude) and direction is governed by $d\vec{L} = \vec{\tau} dt$.
        
        Why it works: Reversing the spin reverses the initial angular momentum vector $\vec{L}$. Since the gravitational torque $\vec{\tau}$ is unchanged, the new $d\vec{L}$ acts on a reversed $\vec{L}$, causing the wheel to sweep out a circle in the opposite direction.
        
        Why the other choices fail: The torque is unchanged, so it won't stop. Magnitude of $L$ is unchanged, so speed is unchanged.

  - id: am-q18
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Conservation vs Non-conservation in interacting systems."
    prerequisiteObjectiveIds: [physics-conservation-angular-momentum]
    extensionObjectiveIds: [physics-conservation-angular-momentum]
    prompt: |
      A person sits on a freely rotating stool holding a spinning bicycle wheel. The person flips the wheel upside down. What happens?
    choices:
      - id: a
        text: 'The person remains stationary because the wheel''s angular momentum is internal.'
      - id: b
        text: 'The person begins to rotate in the original direction of the wheel''s spin.'
      - id: c
        text: 'The person begins to rotate in the opposite direction of the wheel''s original spin.'
      - id: d
        text: 'The stool falls over.'
    answer:
      choiceId: b
    explanation: |
        Solution: The system (person + stool + wheel) is isolated from external vertical torques.
        
        Why it works: Initial angular momentum is $L_{up}$ (from the wheel). Flipping it makes the wheel's angular momentum $-L_{up}$. To conserve the total $L_{up}$, the person/stool must acquire $+2L_{up}$. This means the person rotates in the *original* direction of the wheel.
        
        Why the other choices fail: Angular momentum must be conserved. The person must rotate to counteract the change in the wheel's vector.

  - id: am-q19
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Angular momentum of a rigid body."
    prerequisiteObjectiveIds: [physics-angular-momentum]
    extensionObjectiveIds: [physics-angular-momentum]
    prompt: |
      For a rigid body rotating symmetrically about a fixed axis, how are the angular momentum vector $\vec{L}$ and the angular velocity vector $\vec{\omega}$ related?
    choices:
      - id: a
        text: 'They are always perpendicular.'
      - id: b
        text: 'They are always parallel and point in the same direction.'
      - id: c
        text: 'They point in opposite directions.'
      - id: d
        text: 'They are unrelated.'
    answer:
      choiceId: b
    explanation: |
        Solution: For a rigid body rotating around an axis of symmetry, $\vec{L} = I\vec{\omega}$.
        
        Why it works: Since $I$ (moment of inertia) is a positive scalar, the vector $\vec{L}$ must be a positive scalar multiple of $\vec{\omega}$. They are parallel and point the same way.
        
        Why the other choices fail: This simple parallel relationship only holds for axes of symmetry (or principal axes). For asymmetrical rotation, they might not be parallel, but they are never perpendicular or opposite.

  - id: am-q20
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Work and kinetic energy in rolling."
    prerequisiteObjectiveIds: [physics-rolling-motion]
    extensionObjectiveIds: [physics-rolling-motion]
    prompt: |
      Two identical cylinders are released from rest on a hill. Cylinder X slides down a completely frictionless path. Cylinder Y rolls down a parallel path with sufficient friction to prevent slipping. Which cylinder reaches the bottom with the greatest center-of-mass speed?
    choices:
      - id: a
        text: 'Cylinder X'
      - id: b
        text: 'Cylinder Y'
      - id: c
        text: 'They reach the bottom with the same speed.'
      - id: d
        text: 'It cannot be determined.'
    answer:
      choiceId: a
    explanation: |
        Solution: Both cylinders convert the same gravitational potential energy into kinetic energy.
        
        Why it works: Cylinder X does not rotate, so all potential energy becomes translational kinetic energy ($\frac{1}{2}mv^2$). Cylinder Y must use some of its energy to rotate ($\frac{1}{2}I\omega^2$), leaving less energy for translation, so it moves slower.
        
        Why the other choices fail: Rolling implies energy is diverted into rotation, reducing translational speed compared to pure sliding.
