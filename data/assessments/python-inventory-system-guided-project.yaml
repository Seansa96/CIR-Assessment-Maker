guidedProject:
  language: python
  instructions: |
    Build a Dictionary-based Inventory Manager.

    You will implement a simple class (we provide the skeleton) that uses a dictionary to track items and their quantities.

    Required project behavior:

    - Implement the methods in `inventory.py`.
    - The `Inventory` class has an `items` dictionary. Keys are item names (strings), values are quantities (ints).
    - `add_item(self, name, quantity)`: Add the given quantity to the item. If it doesn't exist, create it.
    - `remove_item(self, name, quantity)`: Subtract the quantity. If the quantity reaches 0 or below, remove the item from the dictionary entirely using `del`. If the item doesn't exist, do nothing.
    - `get_quantity(self, name)`: Return the quantity of the item. Return 0 if the item is not in the dictionary.
    - `total_items(self)`: Return the sum of ALL quantities in the inventory (e.g., 2 potions + 1 sword = 3 total).

    The automated tests will simulate adding and removing loot.

  requiredChecks:
    - id: compile-check
      title: Compile
      description: Compiles correctly.
      expectedOutputContains:
        - "OK"
