    - path: run_checks.py
      readOnly: true
      content: |
        import unittest
        from inventory import Inventory

        class TestInventory(unittest.TestCase):
            def test_add_and_get(self):
                inv = Inventory()
                inv.add_item("Potion", 2)
                self.assertEqual(inv.get_quantity("Potion"), 2)
                inv.add_item("Potion", 3)
                self.assertEqual(inv.get_quantity("Potion"), 5)
                self.assertEqual(inv.get_quantity("Sword"), 0)

            def test_remove_item(self):
                inv = Inventory()
                inv.add_item("Potion", 5)
                inv.remove_item("Potion", 2)
                self.assertEqual(inv.get_quantity("Potion"), 3)
                
                # Drop to 0 or below should delete it
                inv.remove_item("Potion", 5)
                self.assertEqual(inv.get_quantity("Potion"), 0)
                self.assertNotIn("Potion", inv.items)
                
                # Removing non-existent shouldn't crash
                inv.remove_item("Sword", 1)

            def test_total_items(self):
                inv = Inventory()
                self.assertEqual(inv.total_items(), 0)
                inv.add_item("Potion", 3)
                inv.add_item("Sword", 1)
                inv.add_item("Shield", 1)
                self.assertEqual(inv.total_items(), 5)

        if __name__ == '__main__':
            unittest.main(verbosity=2)


