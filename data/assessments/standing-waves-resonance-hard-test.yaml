- id: q001
  type: numericResponse
  skills:
  - physics-standing-waves-resonance
  prompt: Use the Standing Waves and Resonance diagram and the model $f_n=nv/(2L)$. A calibrated scenario
    scales the reference values by 1.1. Determine the mode frequency. Give a numerical answer.
  answer:
    value: 3.3
    tolerance: 0.033
  explanation: Apply $f_n=nv/(2L)$ consistently to the scaled scenario; the requested mode frequency is
    3.3.
