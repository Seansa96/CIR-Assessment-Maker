  - { id: sr1, type: cloze, prompt: 'Complete: $v=\sqrt{GM/____}$.', answer: { expected: r, expectedLatex: 'r', aliases: [radius], media: [] }, explanation: 'Solution: Insert $r$.\n\nWhy it works: Circular-orbit speed depends on radius.', tags: [speed] }
  - { id: sr2, type: cloze, prompt: 'Complete Kepler''s law: $T^2\propto r^____$.', answer: { expected: 3, expectedLatex: '3', aliases: [cubed], media: [] }, explanation: 'Solution: Insert 3.\n\nWhy it works: Period squared scales with orbital radius cubed.', tags: [period] }
  - { id: sr3, type: typed, prompt: 'Where is the central body located in an elliptical orbit?', answer: { expected: focus, expectedLatex: '', aliases: ['one focus'], media: [] }, explanation: 'Solution: It is at a focus.\n\nWhy it works: This is Kepler''s first law.', tags: [kepler] }
  - { id: sr4, type: typed, prompt: 'What force provides centripetal force in a satellite orbit?', answer: { expected: gravity, expectedLatex: '', aliases: ['gravitational force'], media: [] }, explanation: 'Solution: The force is gravity.\n\nWhy it works: Gravity points inward.', tags: [gravity] }
  - { id: sr5, type: cloze, prompt: 'A satellite''s orbital radius is measured from the planet''s ____.', answer: { expected: center, expectedLatex: '', aliases: ['centre'], media: [] }, explanation: 'Solution: Insert center.\n\nWhy it works: Radius is a center-to-satellite distance.', tags: [radius] }
  - { id: sr6, type: typed, prompt: 'At which point of an elliptical solar orbit is speed greatest?', answer: { expected: perihelion, expectedLatex: '', aliases: ['closest approach'], media: [] }, explanation: 'Solution: The point is perihelion.\n\nWhy it works: Equal areas in equal times require fastest motion when closest.', tags: [kepler] }
