items:
- id: beats-r1
  type: cloze
  prompt: The beat frequency is $f_{beat}={{|f_1-f_2|}}$.
  answer: '|f_1-f_2|'
  explanation: 'Solution: Take the absolute difference of the source frequencies. Why it works: loudness repeats regardless of which source has the higher frequency.'
- id: beats-r2
  type: typed
  prompt: What beat frequency results from $256\ \text{Hz}$ and $260\ \text{Hz}$ tones?
  answer: '4 Hz'
  explanation: 'Solution: $|256-260|=4\ \text{Hz}$. Why it works: the frequency difference sets the envelope repetition rate.'
- id: beats-r3
  type: cloze
  prompt: In beats, the slowly varying change in amplitude is called the {{envelope}}.
  answer: envelope
  explanation: 'Solution: Name the outer amplitude curve the envelope. Why it works: it bounds the fast oscillations and shows constructive and destructive interference.'
- id: beats-r4
  type: typed
  prompt: If two tones have identical frequency, what is their beat frequency?
  answer: '0 Hz'
  explanation: 'Solution: $|f-f|=0$. Why it works: identical-frequency waves do not produce a changing interference envelope.'
- id: beats-r5
  type: cloze
  prompt: Beats depend on wave {{superposition}}.
  answer: superposition
  explanation: 'Solution: Identify superposition. Why it works: the observed displacement is the sum of both sound-wave displacements.'
- id: beats-r6
  type: typed
  prompt: For equal-amplitude nearby tones, what source-frequency combination gives the fast carrier-like oscillation?
  answer: average frequency
  explanation: 'Solution: Use $(f_1+f_2)/2$, the average frequency. Why it works: the sum-to-product identity separates a fast average-frequency factor from a slow envelope factor.'
