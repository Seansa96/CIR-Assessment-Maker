  - id: s03
    title: Forms serve different tasks
    required: true
    content: Vector and parametric forms trace lines; scalar forms make plane tests and distances convenient. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
