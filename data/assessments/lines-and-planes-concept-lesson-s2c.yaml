  - id: s04
    title: Build a scalar plane equation
    required: true
    content: For normal $\langle a,b,c\rangle$ through $(x_0,y_0,z_0)$, expand $a(x-x_0)+b(y-y_0)+c(z-z_0)=0$. The coefficients of $x,y,z$ are the normal vector components.
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: Which equation is the plane through $(1,0,-2)$ with normal $\langle2,-1,3\rangle$?
      choices:
      - id: a
        text: $2(x-1)-y+3(z+2)=0$
        media: []
        issueSignals: []
      - id: b
        text: $2(x+1)-y+3(z-2)=0$
        media: []
        issueSignals:
        - id: point-normal-sign-error
          domains: []
      - id: c
        text: $x-2y+3z=0$
        media: []
        issueSignals:
        - id: normal-component-placement-error
          domains: []
      - id: d
        text: $\langle x,y,z\rangle=\langle1,0,-2\rangle+t\langle2,-1,3\rangle$
        media: []
        issueSignals:
        - id: line-plane-role-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Substitute the point and normal into $a(x-x_0)+b(y-y_0)+c(z-z_0)=0$ to get $2(x-1)-y+3(z+2)=0$.

        Why it works: The normal coefficients multiply the displacement from the specified point.

        Why the other choices fail: b reverses both point-subtraction signs. c changes the normal components and omits the given point. d parameterizes a line in the normal direction, not the plane.
