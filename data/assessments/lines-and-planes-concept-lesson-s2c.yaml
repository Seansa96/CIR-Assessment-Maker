  - id: s02
    title: Read a vector equation coordinate by coordinate
    required: true
    content: Expanding $\mathbf r=\langle x_0,y_0,z_0\rangle+t\langle a,b,c\rangle$ gives $x=x_0+at$, $y=y_0+bt$, and $z=z_0+ct$. Matching coordinates preserves the direction vector's components.
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: For $\mathbf r=\langle1,-2,4\rangle+t\langle3,0,-1\rangle$, what is the $z$-coordinate?
      choices:
      - id: a
        text: $z=4-t$
        media: []
        issueSignals: []
      - id: b
        text: $z=4+t$
        media: []
        issueSignals:
        - id: line-parameterization-error
          domains: []
      - id: c
        text: $z=-1+4t$
        media: []
        issueSignals:
        - id: line-parameterization-error
          domains: []
      - id: d
        text: $z=4-3t$
        media: []
        issueSignals:
        - id: line-parameterization-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $z=4+t(-1)=4-t$.

        Why it works: The third coordinate uses the third component of the base point and the third component of the direction vector.

        Why the other choices fail: b loses the negative direction component. c swaps the base and direction roles. d incorrectly uses the x-direction component.
