  - id: s03
    title: A plane uses a normal vector
    required: true
    content: A plane through $\mathbf r_0$ with normal $\mathbf n$ consists of points $\mathbf r$ satisfying $\mathbf n\cdot(\mathbf r-\mathbf r_0)=0$. The displacement from the known point must be perpendicular to $\mathbf n$.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: What does a normal vector to a plane tell you?
      choices:
      - id: a
        text: It is perpendicular to every direction lying in the plane
        media: []
        issueSignals: []
      - id: b
        text: It lies along every line in the plane
        media: []
        issueSignals:
        - id: line-plane-role-confusion
          domains: []
      - id: c
        text: It gives a point on the plane by itself
        media: []
        issueSignals:
        - id: plane-data-insufficiency
          domains: []
      - id: d
        text: It is always a unit vector
        media: []
        issueSignals:
        - id: normal-scaling-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: A plane normal is perpendicular to every vector lying in the plane.

        Why it works: The dot product $\mathbf n\cdot(\mathbf r-\mathbf r_0)=0$ expresses that perpendicularity.

        Why the other choices fail: b describes an in-plane direction, not a normal. c omits the point needed to locate the plane. d is false because any nonzero scalar multiple is also normal.
