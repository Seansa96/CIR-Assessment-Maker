glossary: 
lesson:
  introduction: Lines use a point and a direction; planes use a point and a normal. Keep the geometric role of every vector visible as you translate among vector, parametric, and scalar equations.
  sections:
  - id: s01
    title: A line starts at a point and follows a direction
    required: true
    content: A line through $\mathbf r_0$ parallel to $\mathbf v$ has vector equation $\mathbf r=\mathbf r_0+t\mathbf v$. The parameter $t$ scales the direction vector, so $t=0$ returns the given point.
    media:
    - type: image
      src: /media/calculus-3/lines-planes.svg
      alt: Coordinate-space diagram of a line through a point with a direction vector and a plane with a normal vector.
      caption: Lines use direction vectors; planes use normal vectors.
    check:
      id: check-01
      type: multipleChoice
      prompt: Which data is sufficient to specify a line in space?
      choices:
      - id: a
        text: A point on the line and a nonzero direction vector
        media: []
        issueSignals: []
      - id: b
        text: A point on the line and a normal vector
        media: []
        issueSignals:
        - id: line-plane-role-confusion
          domains: []
      - id: c
        text: Two parallel normal vectors with no point
        media: []
        issueSignals:
        - id: line-data-insufficiency
          domains: []
      - id: d
        text: Only the line's distance from the origin
        media: []
        issueSignals:
        - id: line-data-insufficiency
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Choose a point on the line and a nonzero direction vector.

        Why it works: $\mathbf r=\mathbf r_0+t\mathbf v$ begins at $\mathbf r_0$ and moves in direction $\mathbf v$.

        Why the other choices fail: b assigns a plane's normal-vector role to a line. c gives directions but never locates a particular line. d does not determine either a point or direction.
