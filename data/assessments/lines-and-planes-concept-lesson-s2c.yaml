  - id: s05
    title: Parallel planes have parallel normals
    required: true
    content: Planes are parallel exactly when their normal vectors are scalar multiples. Distinct parallel planes need different constants after being written with the same normal coefficients.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: Which plane is parallel to $2x-y+3z=5$?
      choices:
      - id: a
        text: $4x-2y+6z=1$
        media: []
        issueSignals: []
      - id: b
        text: $2x+y+3z=1$
        media: []
        issueSignals:
        - id: parallel-normal-comparison-error
          domains: []
      - id: c
        text: $x-2y+3z=1$
        media: []
        issueSignals:
        - id: parallel-normal-comparison-error
          domains: []
      - id: d
        text: $2x-y+3z=5$
        media: []
        issueSignals:
        - id: coincident-plane-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $4x-2y+6z=1$ has normal $\langle4,-2,6\rangle=2\langle2,-1,3\rangle$.

        Why it works: Scalar-multiple normal vectors give parallel planes; the different constant makes this plane distinct.

        Why the other choices fail: b and c alter one normal component, so their normals are not parallel. d is the same plane, not a distinct parallel plane.
