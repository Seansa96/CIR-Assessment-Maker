        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Use $\mathbf r=\mathbf r_0+t\mathbf v$.

        Why it works: It explicitly separates a known base point $\mathbf r_0$ from the direction vector $\mathbf v$.

        Why the other choices fail: b and c are plane equations organized around a normal. d is a distance formula and does not describe a line.
