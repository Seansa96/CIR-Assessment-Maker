        text: a point and direction vector
        media: []
        issueSignals: []
      - id: b
        text: a point and normal vector (answers 'What data defines a plane?', not 'What data defines a line in space?')
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: c
        text: is perpendicular to the plane (answers 'What does a plane normal vector do?', not 'What data defines a line in space?')
        media: []
        issueSignals:
        - id: mathematical-translation-error
          domains: []
      - id: d
        text: 1+2t (answers 'For $\mathbf r=\langle1,2,3\rangle+t\langle2,0,-1\rangle$, what is x?', not 'What data defines a line in space?')
        media: []
