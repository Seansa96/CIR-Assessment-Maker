  - id: s06
    title: A point-plane distance measures a normal projection
    required: true
    content: For plane $ax+by+cz=d$, the distance from $(x_0,y_0,z_0)$ is $\frac{|ax_0+by_0+cz_0-d|}{\sqrt{a^2+b^2+c^2}}$. The denominator normalizes the plane normal's length.
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: What does the denominator $\sqrt{a^2+b^2+c^2}$ do in the point-to-plane distance formula?
      choices:
      - id: a
        text: It divides by the length of the plane's normal vector
        media: []
        issueSignals: []
      - id: b
        text: It finds the distance from the point to the origin
        media: []
        issueSignals:
        - id: point-plane-distance-error
          domains: []
      - id: c
        text: It computes the length of an in-plane direction vector
        media: []
        issueSignals:
        - id: point-plane-distance-error
          domains: []
      - id: d
        text: It makes the signed numerator positive
        media: []
        issueSignals:
        - id: point-plane-distance-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: It divides by $|\langle a,b,c\rangle|$, the normal vector's length.

        Why it works: The numerator is a normal-direction displacement scaled by the normal, so division converts it to geometric distance.

        Why the other choices fail: b uses the wrong reference point. c uses a direction the formula does not contain. d is the role of the absolute value in the numerator.
