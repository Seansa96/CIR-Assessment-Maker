  - id: s02
    title: Planes need a point and normal
    required: true
    content: A plane equation states that displacement from a known point is perpendicular to its normal. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
