  - id: s07
    title: Choose a form that answers the question
    required: true
    content: Vector and parametric forms make line points and directions transparent. Scalar plane form makes normal coefficients, parallelism, and point-to-plane distance convenient. Translate forms only when it reveals the requested feature.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: Which representation most directly displays the direction of a line through a known point?
      choices:
      - id: a
        text: $\mathbf r=\mathbf r_0+t\mathbf v$
        media: []
        issueSignals: []
      - id: b
        text: $ax+by+cz=d$
        media: []
        issueSignals:
        - id: line-plane-role-confusion
          domains: []
      - id: c
        text: $\mathbf n\cdot(\mathbf r-\mathbf r_0)=0$
        media: []
        issueSignals:
        - id: line-plane-role-confusion
          domains: []
      - id: d
        text: $\frac{|ax_0+by_0+cz_0-d|}{\sqrt{a^2+b^2+c^2}}$
        media: []
        issueSignals:
        - id: representation-selection-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
