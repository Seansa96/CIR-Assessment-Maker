lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 2 → Parametric Curves if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Lines need a point and direction
    required: true
    content: 'A vector equation starts at a known point and adds any scalar multiple of a direction vector. In Lines and Planes in Space, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
