  - id: physics2-ch05-continuous-charge-s4
    title: Work a representative case
    required: true
    content: >
      Continuous Charge Distributions uses dE = k dq/r^2. In the work a representative case stage, write dq from a charge density, use symmetry to remove cancelling components, and integrate the remaining component.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.


      Example: for a uniformly charged rod with $\lambda=2.0\,\mu\mathrm{C/m}$ from $x=0$ to $0.40\,\mathrm{m}$, find the field at a point $a=0.20\,\mathrm{m}$ beyond its left end. Write $dq=\lambda\,dx$ and $dE=k\lambda\,dx/(a+x)^2$; all elements point left. Thus $E=k\lambda\int_0^{0.40}dx/(a+x)^2=k\lambda(1/a-1/(a+0.40))=6.0\times10^4\,\mathrm{N/C}$ left. The $1/r^2$ kernel and the direction must be included before integrating.
