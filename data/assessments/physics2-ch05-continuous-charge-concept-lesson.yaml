id: physics2-ch05-continuous-charge-concept-lesson
title: Continuous Charge Distributions
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electric-charges-fields
lesson:
  introduction: This lesson develops the main ideas behind Continuous Charge Distributions and connects
    them to the governing physical relationships.
  sections:
  - id: l3-sec1
    title: Charge Densities
    required: true
    content: 'For continuous objects, we use charge densities: linear ($\lambda = \frac{dq}{dL}$), surface
      ($\sigma = \frac{dq}{dA}$), and volume ($\rho = \frac{dq}{dV}$).'
  - id: l3-sec2
    title: Integration for Electric Fields
    required: true
    content: 'The total electric field from a continuous body is found by integrating the differential
      fields $d\vec{E}$ from each infinitesimal charge element $dq$:

      $$\vec{E} = \int d\vec{E} = \int k \frac{dq}{r^2} \hat{r}$$'
