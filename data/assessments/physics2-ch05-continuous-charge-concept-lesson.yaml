lesson:
  introduction: >
    This lesson develops a repeatable way to solve Continuous Charge Distributions problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch05-continuous-charge-s1
    title: Name the model and quantities
    required: true
    content: >
      Continuous Charge Distributions uses dE = k dq/r^2. In the name the model and quantities stage, write dq from a charge density, use symmetry to remove cancelling components, and integrate the remaining component.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Continuous Charge Distributions problems.
      caption: Identify quantities, directions, and a verification check before calculating.
