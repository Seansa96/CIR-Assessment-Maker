questions:
- id: q001
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: An industrial suspension system features a spring of 191.1 N/m supporting
    a load of 8.8 kg. If the amplitude is 0.225 m, what is the maximum speed in m/s?
  answer:
    value: 1.0485
    tolerance: 0.05
  explanation: v_max = A*omega = 0.225 * sqrt(191.1/8.8) = 1.0485 m/s.
- id: q002
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: In a microgravity experiment, a 8.6 kg sample oscillates on a spring of
    stiffness 119.0 N/m. Calculate the angular frequency in rad/s.
  answer:
    value: 3.7198
    tolerance: 0.05
  explanation: omega = sqrt(k/m) = sqrt(119.0/8.6) = 3.7198 rad/s.
- id: q003
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: A 8.2 kg sensor is oscillating on a delicate tether with effective stiffness
    378.1 N/m. What is the period of oscillation in seconds?
  answer:
    value: 0.9253
    tolerance: 0.05
  explanation: T = 2*pi*sqrt(m/k) = 2*pi*sqrt(8.2/378.1) = 0.9253 s.
- id: q004
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: A mass of 7.09 kg is attached to a horizontal spring with constant 284.8
    N/m on a frictionless table. Calculate the angular frequency in rad/s.
  answer:
    value: 6.3379
    tolerance: 0.05
  explanation: omega = sqrt(k/m) = sqrt(284.8/7.09) = 6.3379 rad/s.
