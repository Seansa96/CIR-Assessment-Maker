schemaVersion: 1
id: circuit-basics-quiz
title: Circuit Basics and Measurements Quiz
assessmentType: quiz
categoryId: electronics-and-circuits
subcategoryId: ec-series-circuits
subcategoryIds:
  - ec-measurement
  - ec-ohms-law
modeDefault: practice
randomizeQuestions: false
questions:
  - id: q001
    type: circuit
    prompt: |
      In the simple circuit below, **select** the resistor $R_1$ that controls the current.
    circuitQuestion:
      schemaVersion: 1
      catalogVersion: 1
      interactionMode: select
      paletteSymbolIds: []
      editableProperties: []
      diagram:
        width: 400
        height: 250
        components:
          - id: R1
            symbolId: resistor
            x: 240
            y: 120
            rotation: 90
            value: '220'
            label: R1
          - id: V1
            symbolId: battery
            x: 100
            y: 120
            rotation: 270
            value: 5V
            tolerance: 0
            label: V1
        nodes: []
        wires:
          - id: w1
            sourceId: V1.p1
            targetId: R1.p1
          - id: w2
            sourceId: R1.p2
            targetId: V1.p2
    answer:
      circuitAnswer:
        selectedTargetIds:
          - R1
    explanation: |
      $R_1$ is the resistor component. Resistors restrict current flow and are represented by a zigzag symbol in ANSI schematic format.

  - id: q002
    type: circuit
    prompt: |
      Place a **voltmeter** to measure the voltage drop across the resistor $R_1$.
    circuitQuestion:
      schemaVersion: 1
      catalogVersion: 1
      interactionMode: meterPlacement
      paletteSymbolIds: []
      editableProperties: []
      diagram:
        width: 400
        height: 250
        components:
          - id: R1
            symbolId: resistor
            x: 240
            y: 120
            rotation: 90
            value: '220'
            label: R1
          - id: V1
            symbolId: battery
            x: 100
            y: 120
            rotation: 270
            value: 5V
            tolerance: 0
            label: V1
        nodes: []
        wires:
          - id: w1
            sourceId: V1.p1
            targetId: R1.p1
          - id: w2
            sourceId: R1.p2
            targetId: V1.p2
    answer:
      circuitAnswer:
        meterPlacement:
          meterType: voltmeter
          targetNodeIds:
            - R1.p1
            - R1.p2
          requirePolarity: false
    explanation: |
      A voltmeter must be placed in parallel (across) the component of interest ($R_1$ terminals `R1.p1` and `R1.p2`).

  - id: q003
    type: circuit
    prompt: |
      Determine the resistor's resistance value using Ohm's Law ($I = V/R$) if the battery is $10\text{ V}$ and current is $2\text{ A}$. **Click the resistor** and enter the numerical resistance value.
    circuitQuestion:
      schemaVersion: 1
      catalogVersion: 1
      interactionMode: valueEntry
      paletteSymbolIds: []
      editableProperties:
        - value
      diagram:
        width: 400
        height: 250
        components:
          - id: R1
            symbolId: resistor
            x: 240
            y: 120
            rotation: 90
            value: '?'
            label: R1
          - id: V1
            symbolId: battery
            x: 100
            y: 120
            rotation: 270
            value: 10V
            tolerance: 0
            label: V1
        nodes: []
        wires:
          - id: w1
            sourceId: V1.p1
            targetId: R1.p1
          - id: w2
            sourceId: R1.p2
            targetId: V1.p2
    answer:
      circuitAnswer:
        expectedValues:
          R1:
            mode: numeric
            numericValue: 5
            numericTolerance: 0.1
    explanation: |
      Using Ohm's Law:
      $$R = \frac{V}{I} = \frac{10\text{ V}}{2\text{ A}} = 5\ \Omega$$
