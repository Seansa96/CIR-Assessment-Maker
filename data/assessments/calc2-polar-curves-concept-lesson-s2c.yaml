lesson:
  introduction: Polar coordinates locate a point by directed distance r along a ray at angle theta. A graph is built by tracing that directed radius as theta changes.
  sections:
  - id: pcv-01
    title: 1. Resolve a polar point into Cartesian components
    required: true
    content: Use $x=r\cos\theta$ and $y=r\sin\theta$. The angle chooses a ray and r chooses directed distance.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Polar rays and a curve loop
      caption: 
    check:
      id: pcv-01-c
      type: multipleChoice
      prompt: What is x for $(r,\theta)=(2,\pi/3)$?
      choices:
      - id: a
        text: -1
        media: []
        issueSignals: []
      - id: b
        text: $\sqrt3$
        media: []
        issueSignals: []
      - id: c
        text: 1
        media: []
        issueSignals: []
      - id: d
        text: -2
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: x equals 2 cosine pi over 3 equals negative 1. Why it works: Cosine supplies the horizontal component. Common trap: Using sine for x. Why the other choices fail: They are y, a sign error, or an unprojected radius.'
