  - id: pcv-03
    title: 3. Trace negative radii on the opposite ray
    required: true
    content: When r becomes negative, plot the point on angle theta plus pi. This behavior creates inner loops and petals rather than invalid points.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Limacon inner loop formed by negative radius
      caption: 
    check:
      id: pcv-03-c
      type: multipleChoice
      prompt: If r is negative at an angle theta, where is the point plotted?
      choices:
      - id: a
        text: on the opposite ray
        media: []
        issueSignals: []
      - id: b
        text: at the pole
        media: []
        issueSignals: []
      - id: c
        text: on the same ray with zero distance
        media: []
        issueSignals: []
      - id: d
        text: it is undefined
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: A negative radius reverses the ray. Why it works: $(r,\theta)$ equals $(-r,\theta+\pi)$ after sign reversal. Common trap: Discarding negative values. Why the other choices fail: Negative r remains a valid directed distance.'
