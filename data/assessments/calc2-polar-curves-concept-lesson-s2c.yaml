  - id: pcv-05
    title: 5. Recognize common graph families
    required: true
    content: Forms such as $r=a\cos\theta$ make circles, $r=a+b\cos\theta$ make limacons/cardioids, and $r=a\cos(n\theta)$ make roses.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Polar curve family sketch
      caption: 
    check:
      id: pcv-05-c
      type: multipleChoice
      prompt: What family is $r=1+2\cos\theta$?
      choices:
      - id: a
        text: limacon with inner loop
        media: []
        issueSignals: []
      - id: b
        text: line
        media: []
        issueSignals: []
      - id: c
        text: circle at origin
        media: []
        issueSignals: []
      - id: d
        text: parabola
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: In a plus b cosine, absolute b greater than absolute a produces an inner loop. Why it works: The radius changes sign. Common trap: Calling every such curve a cardioid. Why the other choices fail: Their forms are different.'
