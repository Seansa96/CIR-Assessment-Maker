  - id: pcv-04
    title: 4. Test symmetry by changing the equation
    required: true
    content: Replace theta by negative theta for polar-axis symmetry and use the appropriate reflected-angle test for vertical-axis symmetry. An unchanged equation supports the symmetry.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Symmetric polar curve and axes
      caption: 
    check:
      id: pcv-04-c
      type: multipleChoice
      prompt: Why is $r=2\cos\theta$ symmetric about the polar axis?
      choices:
      - id: a
        text: cosine negative theta equals cosine theta
        media: []
        issueSignals: []
      - id: b
        text: sine negative theta equals sine theta
        media: []
        issueSignals: []
      - id: c
        text: r is always zero
        media: []
        issueSignals: []
      - id: d
        text: all polar curves are symmetric
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Replacing theta with negative theta leaves cosine unchanged. Why it works: This substitution reflects across the polar axis. Common trap: Assuming symmetry from appearance alone. Why the other choices fail: Sine changes sign; r is not zero; curves need not be symmetric.'
