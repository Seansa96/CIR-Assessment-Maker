  - id: pcv-02
    title: 2. Use equivalent polar names
    required: true
    content: The same point can be written as $(r,\theta+2\pi k)$ or $(-r,\theta+(2k+1)\pi)$. Negative r reverses the ray.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Opposite polar rays through the pole
      caption: 
    check:
      id: pcv-02-c
      type: multipleChoice
      prompt: Which pair is equivalent to $(3,0)$?
      choices:
      - id: a
        text: $(-3,\pi)$
        media: []
        issueSignals: []
      - id: b
        text: $(-3,0)$
        media: []
        issueSignals: []
      - id: c
        text: $(3,\pi)$
        media: []
        issueSignals: []
      - id: d
        text: $(0,3)$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Reverse the radius and add pi to the angle. Why it works: The opposite ray with negative distance reaches the same point. Common trap: Negating r without rotating the ray. Why the other choices fail: They point to a different Cartesian location or are not polar coordinates.'
