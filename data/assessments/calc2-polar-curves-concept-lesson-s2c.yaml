  - id: pcv-06
    title: 6. Find loop and petal endpoints from r equals zero
    required: true
    content: Zeros of r place the point at the pole. Consecutive relevant zeros frequently bound one petal or an inner loop.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Inner-loop endpoints at the pole
      caption: 
    check:
      id: pcv-06-c
      type: freeResponse
      prompt: Why are zeros of r useful for graphing a polar loop?
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: selfCheck
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints:
        - point is pole
        - can mark loop endpoints
        - sign change identifies opposite-ray tracing
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: At r equals zero the path reaches the pole; consecutive zeros can delimit a loop, and the sign between them describes tracing. Why it works: Radius controls distance from the pole. Common trap: Treating zeros as ordinary x-axis intercepts.'
