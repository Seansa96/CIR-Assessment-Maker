glossary:
  introduction: |
    Power and Taylor series rely on a compact vocabulary: center, radius, interval, endpoint, polynomial, series, and remainder. Learn these terms before practicing expansions.

    ![Common Maclaurin series templates and their pattern cues](/assessments/calc2-infinite-series/taylor-common-series-reference.svg)
  sections:
    - id: power-series-terms
      title: Power Series Terms
      required: true
      content: |
        A power series is an infinite sum that behaves like an infinite polynomial on its interval of convergence.
      entries:
        - id: power-series
          term: Power Series
          definition: |
            A series of powers of $x-a$ with coefficients.
          notation: '$\sum_{n=0}^{\infty}c_n(x-a)^n$'
          examples:
            - '$\sum_{n=0}^{\infty}\frac{(x-2)^n}{n!}$ is centered at $2$.'
          aliases: [infinite polynomial]
          tags: [power-series]
          drills:
            - id: power-series-symbolic
              type: symbolic
              prompt: Write the general form of a power series centered at $a$.
              answer:
                expectedLatex: '\sum_{n=0}^{\infty}c_n(x-a)^n'
                aliases:
                  - 'sum c_n (x-a)^n'
              explanation: The expression uses powers of the distance from the center.
              tags: [power-series, center]

        - id: center
          term: Center
          definition: |
            The value $a$ in $(x-a)$ around which the power series is built.
          notation: '$a$ in $\sum c_n(x-a)^n$'
          examples:
            - $\sum c_n(x+3)^n$ is centered at $-3$.
          aliases: [series center]
          tags: [center, power-series]
          drills:
            - id: center-cloze
              type: cloze
              prompt: 'The series $\sum c_n(x-5)^n$ is centered at $x=____$.' 
              answer:
                expected: 5
              explanation: The form is $(x-a)$, so $a=5$.
              tags: [center, power-series]

        - id: radius-of-convergence
          term: Radius of Convergence
          definition: |
            The distance from the center within which the power series converges automatically.
          notation: '$|x-a|<R$'
          examples:
            - If $a=2$ and $R=3$, the interior interval is $-1<x<5$.
          aliases: [radius]
          tags: [radius-of-convergence, power-series]
          drills:
            - id: radius-flashcard
              type: flashcard
              prompt: What does the radius of convergence measure?
              answer:
                expected: The distance from the center over which a power series converges automatically.
              explanation: Endpoints at exactly that distance still need separate tests.
              tags: [radius-of-convergence, power-series]

        - id: interval-of-convergence
          term: Interval of Convergence
          definition: |
            The complete set of $x$-values where the power series converges, including endpoint decisions.
          notation: '$(a-R,a+R)$ with endpoint tests'
          examples:
            - A series may have interval $[-2,2)$ after endpoint testing.
          aliases: [IOC]
          tags: [interval-of-convergence, endpoint-tests]
          drills:
            - id: interval-convergence-cloze
              type: cloze
              prompt: 'The interval of convergence includes endpoint decisions, while the ____ only gives distance from the center.' 
              answer:
                expected: radius
                aliases: [radius of convergence]
              explanation: Radius tells distance; interval notation records which endpoints are included.
              tags: [interval-of-convergence, endpoint-tests]

        - id: endpoint-test
          term: Endpoint Test
          definition: |
            The separate convergence test performed after substituting each endpoint into the original power series.
          notation: '$x=a-R,\quad x=a+R$'
          examples:
            - One endpoint might become harmonic while the other becomes alternating harmonic.
          aliases: [endpoint checking]
          tags: [endpoint-tests, power-series]
          drills:
            - id: endpoint-test-typed
              type: typed
              prompt: What must be done to each endpoint after finding the radius of convergence?
              answer:
                expected: test it separately
                aliases:
                  - endpoint test
                  - test the endpoint
              explanation: The ratio test usually becomes inconclusive at endpoints.
              tags: [endpoint-tests, power-series]

    - id: taylor-series-terms
      title: Taylor and Maclaurin Terms
      required: true
      content: |
        Taylor language distinguishes the infinite representation from finite approximations and error estimates.
      entries:
        - id: taylor-series
          term: Taylor Series
          definition: |
            A power series whose coefficients are built from derivatives at a center.
          notation: '$\sum_{n=0}^{\infty}\frac{f^{(n)}(a)}{n!}(x-a)^n$'
          examples:
            - Taylor series centered at $a=1$ use derivatives evaluated at $1$.
          aliases: [Taylor expansion]
          tags: [taylor-series]
          drills:
            - id: taylor-series-symbolic
              type: symbolic
              prompt: Write the general Taylor series for $f(x)$ centered at $a$.
              answer:
                expectedLatex: '\sum_{n=0}^{\infty}\frac{f^{(n)}(a)}{n!}(x-a)^n'
                aliases:
                  - 'sum f^(n)(a)/n! (x-a)^n'
              explanation: Taylor coefficients match derivative values at the center.
              tags: [taylor-series]

        - id: maclaurin-series
          term: Maclaurin Series
          definition: |
            A Taylor series centered at $0$.
          notation: '$\sum_{n=0}^{\infty}\frac{f^{(n)}(0)}{n!}x^n$'
          examples:
            - The Maclaurin series for $e^x$ is $\sum\frac{x^n}{n!}$.
          aliases: [Taylor series at zero]
          tags: [maclaurin-series]
          drills:
            - id: maclaurin-cloze
              type: cloze
              prompt: 'A Maclaurin series is a Taylor series centered at ____.' 
              answer:
                expected: 0
                aliases: [zero]
              explanation: Maclaurin is the special center-zero case.
              tags: [maclaurin-series]

        - id: taylor-polynomial
          term: Taylor Polynomial
          definition: |
            A finite Taylor approximation that stops after a chosen degree.
          notation: '$T_N(x)=\sum_{n=0}^{N}\frac{f^{(n)}(a)}{n!}(x-a)^n$'
          examples:
            - $1+x+\frac{x^2}{2}$ is a second-degree Maclaurin polynomial for $e^x$.
          aliases: [Taylor approximation]
          tags: [taylor-polynomial, approximation]
          drills:
            - id: taylor-polynomial-flashcard
              type: flashcard
              prompt: What is the difference between a Taylor polynomial and a Taylor series?
              answer:
                expected: A Taylor polynomial has finitely many terms; a Taylor series has infinitely many terms.
              explanation: Polynomials are used for finite approximations.
              tags: [taylor-polynomial, approximation]

        - id: remainder
          term: Remainder
          definition: |
            The error term left after approximating a function with a Taylor polynomial.
          notation: '$R_N(x)=f(x)-T_N(x)$'
          examples:
            - A bound on $R_N(x)$ tells how accurate the approximation is.
          aliases: [error term]
          tags: [remainder, approximation-error]
          drills:
            - id: remainder-cloze
              type: cloze
              prompt: 'The Taylor remainder measures the ____ left after using a Taylor polynomial.' 
              answer:
                expected: error
                aliases: [approximation error]
              explanation: The remainder is the part of the function not captured by the finite polynomial.
              tags: [remainder, approximation-error]

        - id: lagrange-remainder
          term: Lagrange Remainder
          definition: |
            A Taylor error estimate using a bound on the next derivative.
          notation: '$|R_N(x)|\le\frac{M}{(N+1)!}|x-a|^{N+1}$'
          examples:
            - Use it when the Taylor series is not a simple alternating series or when a derivative bound is requested.
          aliases: [Lagrange error bound]
          tags: [lagrange-remainder, approximation-error]
          drills:
            - id: lagrange-remainder-recognition
              type: recognition
              prompt: What information does the Lagrange remainder usually require?
              choices:
                - id: a
                  text: A bound on a later derivative.
                - id: b
                  text: A polar graph.
                - id: c
                  text: A partial fraction decomposition.
                - id: d
                  text: A rose petal count.
              answer:
                choiceId: a
                expected: A bound on a later derivative.
              explanation: The Lagrange bound controls the next derivative over the interval.
              tags: [lagrange-remainder, approximation-error]

        - id: alternating-series-error
          term: Alternating Series Error Bound
          definition: |
            For a qualifying alternating series, the error after stopping is at most the magnitude of the first omitted term.
          notation: '$|R_N|\le b_{N+1}$'
          examples:
            - This is often the easiest error bound for sine, cosine, and arctangent approximations.
          aliases: [first omitted term bound]
          tags: [alternating-series-error, approximation-error]
          drills:
            - id: alternating-error-cloze
              type: cloze
              prompt: 'For a qualifying alternating series, the error is at most the first ____ term.' 
              answer:
                expected: omitted
                aliases: [unused, left out]
              explanation: Alternating errors are controlled by the next term when magnitudes decrease to zero.
              tags: [alternating-series-error, approximation-error]
