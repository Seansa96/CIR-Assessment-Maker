lesson:
  introduction: |-
    If you push a block north with 5 pounds of force, and your friend pushes the same block east with 5 pounds of force, which way does the block move? We can answer this using the geometry of vectors.
  sections:
  - id: sec-vector-addition
    title: Adding Vectors Geometrically
    required: true
    content: |-
      In physics, a force is a vector. When multiple forces act on an object at the same time, we add those vectors together to find the **resultant vector** (the net effect).
      
      To add vectors geometrically, we use the **Head-to-Tail Method**:
      1. Draw the first vector $\vec{u}$.
      2. Draw the second vector $\vec{v}$, placing its tail exactly on the head of $\vec{u}$.
      3. Draw a new vector from the very beginning (the tail of $\vec{u}$) to the very end (the head of $\vec{v}$). This new vector is the sum, $\vec{u} + \vec{v}$.
      
      Algebraically, this is incredibly simple! You just add the $x$-components together and the $y$-components together.
      If $\vec{u} = \langle 3, 4 \rangle$ and $\vec{v} = \langle 1, -2 \rangle$, then $\vec{u} + \vec{v} = \langle 3+1, 4-2 \rangle = \langle 4, 2 \rangle$.

  - id: sec-magnitude
    title: Finding the Magnitude
    required: true
    content: |-
      Once you have the resultant vector in component form $\langle x, y \rangle$, you often want to know its total strength or distance.
      
      The **magnitude** of a vector is its length. Because the $x$ and $y$ components form a right triangle with the vector as the hypotenuse, we simply use the Pythagorean Theorem/Distance Formula!
      
      $$\text{Magnitude} = \|\vec{v}\| = \sqrt{x^2 + y^2}$$

questions:
- id: q-geom-phys2-1
  title: Concept Check - Algebraic Vector Addition
  prompt: |-
    Two forces act on an object. Force A is represented by $\vec{F_1} = \langle 10, -5 \rangle$. Force B is represented by $\vec{F_2} = \langle -3, 12 \rangle$. What is the resultant net force vector?
  type: multipleChoice
  choices:
  - id: c1
    text: $\langle 13, -17 \rangle$
  - id: c2
    text: $\langle 7, 7 \rangle$
  - id: c3
    text: $\langle -30, -60 \rangle$
  answer:
    choiceId: c2
  explanation: |-
    To find the resultant force, add the $x$ components and the $y$ components.
    $x$: $10 + (-3) = 7$
    $y$: $-5 + 12 = 7$
    The resultant vector is $\langle 7, 7 \rangle$.
  skills:
  - geometry-physics-applications

- id: q-geom-phys2-2
  title: Concept Check - Finding Magnitude
  prompt: |-
    An airplane is flying with a velocity vector of $\vec{v} = \langle 300, 400 \rangle$ miles per hour. What is the actual speed (magnitude) of the airplane?
  type: numericResponse
  answer:
    numericValue: 500
    tolerance: 0
  explanation: |-
    Use the Pythagorean Theorem to find the magnitude: $\|\vec{v}\| = \sqrt{x^2 + y^2}$.
    $\|\vec{v}\| = \sqrt{300^2 + 400^2} = \sqrt{90000 + 160000} = \sqrt{250000} = 500$.
    The airplane is flying at $500$ mph.
  skills:
  - geometry-physics-applications
