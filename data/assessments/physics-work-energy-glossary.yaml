glossary:
  introduction: These terms distinguish force, displacement, energy transfer, and rates of energy transfer.
  sections:
  - id: work-energy-terms
    title: Work, energy, and power terms
    required: true
    content: Use direction and units to decide which relation applies.
    entries:
    - id: work
      term: Work
      definition: Energy transferred by a force through a displacement.
      notation: $W=\vec F\cdot\Delta\vec r$
      examples:
      - A perpendicular force does zero work.
      aliases: []
      media: []
      tags:
      - work
      drills:
      - id: work-cloze
        type: cloze
        prompt: For a constant force, $W=Fd\cos\underline{\hspace{0.5cm}}$.
        answer:
          expected: theta
          expectedLatex: \\theta
          aliases:
          - angle
          media: []
          choiceId: 
        explanation: 'Solution: Insert $\theta$.\n\nWhy it works: Work uses the force component parallel to displacement.'
        tags:
        - work
        skills: []
        choices: []
    - id: kinetic-energy
      term: Kinetic energy
      definition: Energy associated with motion.
      notation: $K=\tfrac12mv^2$
      examples:
      - Doubling speed quadruples kinetic energy.
      aliases: []
      media: []
      tags:
      - energy
      drills:
      - id: kinetic-cloze
        type: cloze
        prompt: Kinetic energy is proportional to speed ____.
        answer:
          expected: squared
          expectedLatex: ''
          aliases:
          - to the second power
          media: []
          choiceId: 
        explanation: 'Solution: The word is "squared."\n\nWhy it works: $K=\tfrac12mv^2$.'
        tags:
        - energy
        skills: []
        choices: []
    - id: work-energy-theorem
      term: Work-energy theorem
      definition: Net work equals change in kinetic energy.
      notation: $W_{net}=\Delta K$
      examples:
      - Positive net work increases speed.
      aliases: []
      media: []
      tags:
      - theorem
      drills:
      - id: theorem-cloze
        type: cloze
        prompt: 'Complete: $W_{net}=\Delta____$.'
        answer:
          expected: K
          expectedLatex: K
          aliases:
          - kinetic energy
          media: []
          choiceId: 
        explanation: 'Solution: Insert $K$.\n\nWhy it works: Net work changes kinetic energy.'
        tags:
        - theorem
        skills: []
        choices: []
    - id: power
      term: Power
      definition: Rate of doing work or transferring energy.
      notation: $P=dW/dt=\vec F\cdot\vec v$
      examples:
      - A watt is one joule per second.
      aliases: []
      media: []
      tags:
      - power
      drills:
      - id: power-cloze
        type: cloze
        prompt: One watt equals one ____ per second.
        answer:
          expected: joule
          expectedLatex: ''
          aliases:
          - J
          media: []
          choiceId: 
        explanation: 'Solution: The missing word is "joule."\n\nWhy it works: Power measures energy transfer rate.'
        tags:
        - power
        skills: []
        choices: []
