schemaVersion: 1
id: calc2-cylindrical-shells-worked-examples-s2c
title: 'Cylindrical Shells: Standard and Offset-Axis Worked Examples'

assessmentType: workedExample
categoryId: calculus-2
topicId: cylindrical-shells
modeDefault: practice
randomizeQuestions: false
skills: [shell-method, radius-modeling, definite-integrals]
navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [calculus-2, cylindrical-shells, volume] }
authoring: { visualRequirement: required, visualRationale: Radius and height must be identified from a physical shell before algebra begins. }
workedExamples:
  - id: standard-shell
    title: 'Standard shell: region under a line about the y-axis'
    problem: 'Rotate the region under $y=4-x$ above the x-axis on $0\le x\le4$ about the y-axis. Find its exact volume using shells.'
    media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Vertical shell strip with radius x and height 4 minus x }]
    steps:
      - { id: standard-s1, title: Label one shell, instruction: 'Separate radius from height before multiplying shell factors.', prompt: 'Identify the parallel strip, its radius, and its height.', type: freeResponse, answer: { gradingMode: selfCheck, keyPoints: [vertical strip, 'radius x', 'height 4-x'] }, explanation: 'Solution: A vertical strip is parallel to the y-axis; its radius is x and its height is $(4-x)-0=4-x$. Why it works: The strip rolls around the y-axis. Common trap: Radius is horizontal distance; height is vertical length.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
      - { id: standard-s2, title: Build the shell integral, instruction: 'Multiply circumference, height, and thickness over the x-interval.', prompt: 'Write the shell integral.', type: symbolicResponse, answer: { gradingMode: auto, expectedLatex: '2\pi\int_0^4 x(4-x)\,dx', equivalenceMode: expression, tolerance: 0, variables: [x] }, explanation: 'Solution: $V=2\pi\int_0^4x(4-x)dx$. Why it works: $2\pi x$ is circumference, $4-x$ is height, and $dx$ is thickness. Common trap: Do not replace circumference with $\pi x^2$.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
      - { id: standard-s3, title: Simplify the product, instruction: 'Expand only after every geometric factor has been identified.', prompt: 'Simplify the integrand before integrating.', type: symbolicResponse, answer: { gradingMode: auto, expectedLatex: '4x-x^2', equivalenceMode: expression, tolerance: 0, variables: [x] }, explanation: 'Solution: $x(4-x)=4x-x^2$. Why it works: Distributing prepares a term-by-term antiderivative. Common trap: Keep the negative sign on $x^2$.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
      - { id: standard-s4, title: Evaluate the shell volume, instruction: 'Apply the power rule and retain the outside circumference constant.', prompt: 'Evaluate the volume.', type: symbolicResponse, answer: { gradingMode: auto, expectedLatex: '64\pi/3', equivalenceMode: expression, tolerance: 0, variables: [] }, explanation: 'Solution: $V=2\pi[2x^2-x^3/3]_0^4=2\pi(32-64/3)=64\pi/3$. Why it works: The units are cubic because circumference times height times thickness is length cubed. Common trap: Do not lose the outside $2\pi$.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - id: offset-shell
    title: 'Offset-axis shell: region about x=3'
    problem: 'Rotate the rectangle $0\le x\le2$, $0\le y\le5$ about the line $x=3$. Find its exact volume using shells.'
    media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Vertical strip whose radius is measured to an offset vertical axis }]
    steps:
      - { id: offset-s1, title: Measure from the offset axis, instruction: 'Use the distance to x=3 rather than the distance to the y-axis.', prompt: 'Write the radius and height of a vertical shell.', type: freeResponse, answer: { gradingMode: selfCheck, keyPoints: ['radius 3-x', 'height 5'] }, explanation: 'Solution: The axis lies to the right, so radius is $3-x$ on $[0,2]$ and height is 5. Why it works: Each strip is left of x=3 and extends from y=0 to y=5. Common trap: x would measure distance to the y-axis, not to x=3.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
      - { id: offset-s2, title: Accumulate offset shells, instruction: 'Keep the shifted radius in the circumference factor.', prompt: 'Write the shell integral.', type: symbolicResponse, answer: { gradingMode: auto, expectedLatex: '2\pi\int_0^2(3-x)5\,dx', equivalenceMode: expression, tolerance: 0, variables: [x] }, explanation: 'Solution: $V=2\pi\int_0^2(3-x)(5)dx$. Why it works: Circumference is $2\pi(3-x)$ and the shell height is 5. Common trap: The axis itself is not an integration bound here.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
      - { id: offset-s3, title: Evaluate and check the radius, instruction: 'Evaluate while checking that the radius is positive across the stated interval.', prompt: 'Evaluate the volume.', type: symbolicResponse, answer: { gradingMode: auto, expectedLatex: '40\pi', equivalenceMode: expression, tolerance: 0, variables: [] }, explanation: 'Solution: $V=10\pi[3x-x^2/2]_0^2=10\pi(6-2)=40\pi$. Why it works: The radius remains positive across the whole interval. Common trap: A sign change in $3-x$ would require splitting or absolute values if the interval crossed x=3.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
