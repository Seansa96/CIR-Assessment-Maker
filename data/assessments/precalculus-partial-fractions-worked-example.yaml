schemaVersion: 1
id: precalculus-partial-fractions-worked-example
title: Partial Fraction Decomposition Worked Example
assessmentType: workedExample
categoryId: precalculus
subcategoryIds:
  - precalc-rational
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Decomposing rational expressions into partial fractions
    problem: |
      Decompose rational expressions into simpler pieces. For example:

      $$
      \frac{5x+7}{(x+1)(x+2)}.
      $$

      The goal is to recognize denominator structure, choose the correct template, clear denominators, and solve for the constants.
    steps:
      - id: s001
        title: Check whether the expression is proper
        instruction: "Partial fraction decomposition starts cleanly when the numerator degree is less than the denominator degree."
        type: multipleChoice
        prompt: 'Is $\frac{5x+7}{(x+1)(x+2)}$ proper?'
        choices:
          - id: a
            text: 'Yes, because the numerator degree is $1$ and the denominator degree is $2$.'
          - id: b
            text: 'No, because the numerator has two terms.'
          - id: c
            text: 'No, because the denominator is factored.'
          - id: d
            text: 'Yes, because every rational expression is proper.'
        answer:
          choiceId: a
        hint: "Compare degrees, not the number of terms."
        explanation: |
          The numerator has degree $1$. The denominator has degree $2$. Since $1<2$, the rational expression is proper.

          Related topic: Proper rational expressions. If the numerator degree is too large, use polynomial division first.

      - id: s002
        title: Choose the template for distinct linear factors
        instruction: "Each distinct linear factor gets its own constant numerator."
        type: multipleChoice
        prompt: 'Which decomposition template matches $\frac{5x+7}{(x+1)(x+2)}$?'
        choices:
          - id: a
            text: '$\frac{A}{x+1}+\frac{B}{x+2}$'
          - id: b
            text: '$\frac{Ax+B}{(x+1)(x+2)}$'
          - id: c
            text: '$\frac{A}{(x+1)^2}+\frac{B}{(x+2)^2}$'
          - id: d
            text: '$A(x+1)+B(x+2)$'
        answer:
          choiceId: a
        hint: "Distinct linear factors get constants over each factor."
        explanation: |
          The denominator has two different linear factors, so use

          $$
          \frac{5x+7}{(x+1)(x+2)}=\frac{A}{x+1}+\frac{B}{x+2}.
          $$

          Related topic: Partial fraction templates for distinct linear factors.

      - id: s003
        title: Clear denominators
        instruction: "Multiply both sides by the full denominator to turn the equation into a polynomial identity."
        type: multipleChoice
        prompt: "After clearing denominators, which equation should you solve?"
        choices:
          - id: a
            text: '$5x+7=A(x+2)+B(x+1)$'
          - id: b
            text: '$5x+7=A(x+1)+B(x+2)$'
          - id: c
            text: '$5x+7=A+B$'
          - id: d
            text: '$5x+7=AB(x+1)(x+2)$'
        answer:
          choiceId: a
        hint: "The denominator under $A$ cancels the matching factor and leaves the other factor."
        explanation: |
          Multiplying by $(x+1)(x+2)$ gives

          $$
          5x+7=A(x+2)+B(x+1).
          $$

          Related topic: Clearing denominators in partial fractions.

      - id: s004
        title: Solve using convenient x-values
        instruction: "Substitute values that make one factor zero to isolate a constant."
        type: multipleChoice
        prompt: "Using $5x+7=A(x+2)+B(x+1)$, what are $A$ and $B$?"
        choices:
          - id: a
            text: '$A=2$, $B=3$'
          - id: b
            text: '$A=3$, $B=2$'
          - id: c
            text: '$A=-2$, $B=3$'
          - id: d
            text: '$A=5$, $B=7$'
        answer:
          choiceId: a
        hint: "Try $x=-2$ and $x=-1$."
        explanation: |
          At $x=-2$, $5(-2)+7=-3=B(-1)$, so $B=3$. At $x=-1$, $5(-1)+7=2=A(1)$, so $A=2$.

          Related topic: Cover-up style substitution for distinct linear factors.

      - id: s005
        title: Handle repeated linear factors
        instruction: "Repeated factors require every power up to the repeated power."
        type: multipleChoice
        prompt: 'Which template matches $\frac{3x+1}{(x-2)^2}$?'
        choices:
          - id: a
            text: '$\frac{A}{x-2}+\frac{B}{(x-2)^2}$'
          - id: b
            text: '$\frac{A}{(x-2)^2}$ only'
          - id: c
            text: '$\frac{Ax+B}{(x-2)^2}$ only'
          - id: d
            text: '$A(x-2)+B(x-2)^2$'
        answer:
          choiceId: a
        hint: "Repeated linear factor means include first power and second power."
        explanation: |
          For $(x-2)^2$, include both

          $$
          \frac{A}{x-2}+\frac{B}{(x-2)^2}.
          $$

          Related topic: Repeated linear factors.

      - id: s006
        title: Handle irreducible quadratic factors
        instruction: "A quadratic factor that does not factor over the reals gets a linear numerator."
        type: multipleChoice
        prompt: 'Which template matches $\frac{x+4}{(x-1)(x^2+9)}$?'
        choices:
          - id: a
            text: '$\frac{A}{x-1}+\frac{Bx+C}{x^2+9}$'
          - id: b
            text: '$\frac{A}{x-1}+\frac{B}{x^2+9}$'
          - id: c
            text: '$\frac{Ax+B}{x-1}+\frac{C}{x^2+9}$'
          - id: d
            text: '$A(x-1)+B(x^2+9)$'
        answer:
          choiceId: a
        hint: "An irreducible quadratic needs a numerator one degree lower than the quadratic."
        explanation: |
          The linear factor gets a constant numerator. The irreducible quadratic gets a linear numerator:

          $$
          \frac{A}{x-1}+\frac{Bx+C}{x^2+9}.
          $$

          Related topic: Partial fraction templates for irreducible quadratics.

