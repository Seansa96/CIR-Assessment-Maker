questions:
- id: circ-easy-1
  title: Centripetal Acceleration
  type: numericResponse
  prompt: 'Adapted from OpenStax University Physics.


    A car travels at $2$ m/s around a curve of radius $9$ m. Calculate its centripetal
    acceleration.'
  answer:
    gradingMode: auto
    expected: 0.44
    tolerance: 0.1
  explanation: $a_c = v^2/r = 2^2/9 = 0.4444444444444444$ m/s$^2$.
