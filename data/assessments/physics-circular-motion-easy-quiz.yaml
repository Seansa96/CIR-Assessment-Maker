questions:
  - id: circ-easy-q01
    title: Centripetal Acceleration Calculation
    type: numericResponse
    prompt: |
      A car travels at a constant speed of $15\text{ m/s}$ around a circular track with a radius of $50\text{ m}$. What is the magnitude of the car's centripetal acceleration in m/s²?
    answer:
      value: 4.5
      tolerance: 0.1
    explanation: |
      Centripetal acceleration is $a_c = \frac{v^2}{r}$.
      $$a_c = \frac{15^2}{50} = \frac{225}{50} = 4.5\text{ m/s}^2$$

  - id: circ-easy-q02
    title: Centripetal Force Calculation
    type: numericResponse
    prompt: |
      A $2.0\text{ kg}$ ball attached to a string is swung in a horizontal circle with a radius of $1.5\text{ m}$ at a speed of $6.0\text{ m/s}$. Assuming the string is horizontal, what is the tension in the string in Newtons?
    answer:
      value: 48.0
      tolerance: 0.5
    explanation: |
      The tension provides the centripetal force: $F_c = \frac{mv^2}{r}$.
      $$F_c = \frac{2.0 \times 6.0^2}{1.5} = \frac{2.0 \times 36}{1.5} = \frac{72}{1.5} = 48\text{ N}$$

  - id: circ-easy-q03
    title: Identify the Centripetal Force
    type: multipleChoice
    prompt: |
      When a car safely navigates a flat, unbanked circular curve on a road, what physical force acts as the centripetal force keeping it in the circle?
    choices:
      - id: a
        text: Gravity
      - id: b
        text: Normal force
      - id: c
        text: Static friction between the tires and the road
      - id: d
        text: Kinetic friction between the tires and the road
    answer:
      choiceId: c
    explanation: |
      The car's tires grip the road without sliding (slipping sideways), so **static friction** provides the necessary inward force. If the car were sliding (skidding), it would be kinetic friction, but for safe navigation, it is static friction.

  - id: circ-easy-q04
    title: Direction of Acceleration
    type: multipleChoice
    prompt: |
      An object moves at a constant speed in a circular path. Which statement correctly describes its acceleration?
    choices:
      - id: a
        text: The acceleration is zero because the speed is constant.
      - id: b
        text: The acceleration points tangent to the circular path.
      - id: c
        text: The acceleration points toward the center of the circular path.
      - id: d
        text: The acceleration points outward, away from the center.
    answer:
      choiceId: c
    explanation: |
      Even though speed is constant, the **velocity vector's direction** is constantly changing. This change in direction requires an acceleration pointing toward the center of the circle, called centripetal ("center-seeking") acceleration.

  - id: circ-easy-q05
    title: Speed from Period and Radius
    type: numericResponse
    prompt: |
      A child on a merry-go-round sits $3.0\text{ m}$ from the center. The merry-go-round completes one full revolution every $4.0\text{ seconds}$. What is the child's speed in m/s? Round to one decimal place.
    answer:
      value: 4.7
      tolerance: 0.2
    explanation: |
      Speed $v = \frac{\text{distance}}{\text{time}} = \frac{2\pi r}{T}$.
      $$v = \frac{2\pi(3.0)}{4.0} = \frac{6\pi}{4.0} = 1.5\pi \approx 4.71\text{ m/s}$$

  - id: circ-easy-q06
    title: Doubling the Speed
    type: multipleChoice
    prompt: |
      An object is undergoing uniform circular motion. If its speed is **doubled** while keeping the radius of the path constant, what happens to the required centripetal force?
    choices:
      - id: a
        text: It remains the same.
      - id: b
        text: It doubles (increases by a factor of 2).
      - id: c
        text: It quadruples (increases by a factor of 4).
      - id: d
        text: It is halved.
    answer:
      choiceId: c
    explanation: |
      Centripetal force is $F_c = m\frac{v^2}{r}$.
      Since velocity $v$ is squared, doubling the speed increases the force by a factor of $2^2 = 4$.

  - id: circ-easy-q07
    title: Radius and Acceleration
    type: numericResponse
    prompt: |
      Two cars, A and B, travel at the same speed of $20\text{ m/s}$. Car A takes a tight curve of radius $40\text{ m}$, and Car B takes a wider curve of radius $80\text{ m}$. What is the ratio of their centripetal accelerations ($a_A / a_B$)?
    answer:
      value: 2.0
      tolerance: 0.1
    explanation: |
      $a_A = \frac{v^2}{r_A} = \frac{400}{40} = 10\text{ m/s}^2$
      $a_B = \frac{v^2}{r_B} = \frac{400}{80} = 5\text{ m/s}^2$
      Ratio $a_A / a_B = 10 / 5 = 2$.
      Alternatively, since $a_c \propto 1/r$, half the radius means double the acceleration.

  - id: circ-easy-q08
    title: Finding Radius from Force
    type: numericResponse
    prompt: |
      A $1.5\text{ kg}$ object experiences a centripetal force of $30\text{ N}$ while moving at $4.0\text{ m/s}$ in a circle. What is the radius of the circle in meters?
    answer:
      value: 0.8
      tolerance: 0.05
    explanation: |
      $F_c = \frac{mv^2}{r} \implies r = \frac{mv^2}{F_c}$
      $$r = \frac{1.5(4.0^2)}{30} = \frac{1.5(16)}{30} = \frac{24}{30} = 0.8\text{ m}$$

  - id: circ-easy-q09
    title: Orbital Speed of a Satellite (Given Acceleration)
    type: numericResponse
    prompt: |
      A satellite is in a circular orbit around Earth at an altitude where the acceleration due to gravity is exactly $8.0\text{ m/s}^2$. If the distance from the center of the Earth to the satellite is $7.2 \times 10^6\text{ m}$, what is the orbital speed of the satellite in m/s?
    answer:
      value: 7589.0
      tolerance: 100.0
    explanation: |
      Gravity provides the centripetal acceleration: $g = a_c = \frac{v^2}{r}$.
      $$v = \sqrt{rg} = \sqrt{(7.2 \times 10^6)(8.0)} = \sqrt{57.6 \times 10^6} \approx 7589.5\text{ m/s}$$

  - id: circ-easy-q10
    title: Finding Velocity from Force and Radius
    type: numericResponse
    prompt: |
      A $1200\text{ kg}$ car is rounding a curve of radius $60\text{ m}$. The maximum static friction force the tires can exert before slipping is $4500\text{ N}$. What is the maximum speed the car can have without slipping, in m/s?
    answer:
      value: 15.0
      tolerance: 0.1
    explanation: |
      $f_{s,\max} = \frac{mv^2}{r} \implies v = \sqrt{\frac{f_{s,\max} r}{m}}$
      $$v = \sqrt{\frac{4500 \times 60}{1200}} = \sqrt{\frac{270000}{1200}} = \sqrt{225} = 15\text{ m/s}$$

  - id: circ-easy-q11
    title: Is Centrifugal Force Real?
    type: multipleChoice
    prompt: |
      When you are in a car taking a sharp left turn, you feel pushed to the right against the door. What is the standard physics explanation for this feeling?
    choices:
      - id: a
        text: A "centrifugal force" pushes you outward from the center of the curve.
      - id: b
        text: Your body's inertia tends to keep you moving in a straight line, and the car door must push you to the left to make you turn.
      - id: c
        text: Gravity pulls sideways when cornering.
      - id: d
        text: The normal force from the seat is pushing you outward.
    answer:
      choiceId: b
    explanation: |
      Newton's First Law states an object in motion tends to stay in motion in a straight line. As the car turns left, your body wants to go straight. The car moves into your path, and the door pushes you inward (centripetal force). There is no actual outward force acting on you; the "centrifugal" feeling is just inertia in an accelerating reference frame.

  - id: circ-easy-q12
    title: Frequency and Acceleration
    type: numericResponse
    prompt: |
      A small mass on a string revolves in a horizontal circle of radius $0.5\text{ m}$ at a frequency of $2.0\text{ revolutions per second (Hz)}$. What is its centripetal acceleration in m/s²? Use $\pi \approx 3.1416$. Round to one decimal place.
    answer:
      value: 79.0
      tolerance: 1.0
    explanation: |
      Frequency $f = 2.0\text{ Hz}$. Angular velocity $\omega = 2\pi f = 2\pi(2.0) = 4\pi\text{ rad/s}$.
      $a_c = \omega^2 r = (4\pi)^2 (0.5) = 16\pi^2 (0.5) = 8\pi^2$.
      $8 \times (3.14159)^2 \approx 8 \times 9.87 = 78.96\text{ m/s}^2$.

  - id: circ-easy-q13
    title: Unbanked Curve Maximum Speed Formula
    type: symbolicResponse
    prompt: |
      A car of mass $m$ takes an unbanked circular curve of radius $r$. The coefficient of static friction is $\mu_s$. Enter the expression for the maximum safe speed $v$. Use $g$ for gravity.
    answer:
      expectedLatex: \sqrt{\mu_s*g*r}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The maximum static friction provides the centripetal force.
      $$f_{s,\max} = \frac{mv^2}{r}$$
      $$\mu_s mg = \frac{mv^2}{r} \implies v^2 = \mu_s g r \implies v = \sqrt{\mu_s g r}$$

  - id: circ-easy-q14
    title: Artificial Gravity in a Space Station
    type: numericResponse
    prompt: |
      A rotating space station with a radius of $100\text{ m}$ is designed to simulate Earth's gravity ($g = 9.8\text{ m/s}^2$) at its outer rim. What must be the tangential speed of the outer rim in m/s? Round to one decimal place.
    answer:
      value: 31.3
      tolerance: 0.2
    explanation: |
      The centripetal acceleration must equal $g$.
      $a_c = \frac{v^2}{r} = 9.8 \implies v^2 = 9.8 \times 100 = 980$.
      $v = \sqrt{980} \approx 31.305\text{ m/s}$.

  - id: circ-easy-q15
    title: Change in Velocity Vector
    type: multipleChoice
    prompt: |
      A particle moves halfway around a circle of radius $R$ at a constant speed $v$ (from the North point to the South point). What is the magnitude of the **change in its velocity** vector, $|\Delta\vec{v}|$?
    choices:
      - id: a
        text: $0$
      - id: b
        text: $v$
      - id: c
        text: $2v$
      - id: d
        text: $\pi v$
    answer:
      choiceId: c
    explanation: |
      Velocity is a vector. At the North point (moving clockwise), $\vec{v}_i = +v\hat{i}$ (East). At the South point, $\vec{v}_f = -v\hat{i}$ (West).
      The change in velocity is $\Delta\vec{v} = \vec{v}_f - \vec{v}_i = (-v\hat{i}) - (+v\hat{i}) = -2v\hat{i}$.
      The magnitude is $|-2v| = 2v$.
