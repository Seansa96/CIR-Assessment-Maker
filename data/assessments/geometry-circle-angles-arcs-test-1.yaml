questions:
- id: q-circle-angles-arcs-test-1
  type: multipleChoice
  prompt: 'Two secants intersect inside a circle. The intercepted arcs are 96 degrees and 40 degrees. What is the angle formed?'
  choices:
  - id: choice-A
    text: '136^\circ'
  - id: choice-B
    text: '56^\circ'
  - id: choice-C
    text: '68^\circ'
  answer:
    choiceId: choice-C
    explanation: 'The angle is half the sum of the arcs: (96 + 40)/2 = 68.'
  skills:
  - geometry-circle-angles-arcs
