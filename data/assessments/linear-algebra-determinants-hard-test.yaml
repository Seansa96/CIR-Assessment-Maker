questions:
  - id: ht-det-by-row-reduction
    type: numericResponse
    prompt: |
      Use row reduction to compute $\det(A)$ where
      $$A = \begin{bmatrix} 2 & 1 & 0 \\ -1 & 3 & 2 \\ 4 & -2 & 5 \end{bmatrix}$$
    answer:
      value: 51
      tolerance: 0
    explanation: |
      Expanding along row 1: $\det A = a_{11}C_{11} + a_{12}C_{12} + a_{13}C_{13}$.

      $C_{11} = (+1)\det\begin{bmatrix}3&2\\-2&5\end{bmatrix} = 15 - (-4) = 19$.

      $C_{12} = (-1)\det\begin{bmatrix}-1&2\\4&5\end{bmatrix} = -((-5) - 8) = -(-13) = 13$.

      $C_{13} = (+1)\det\begin{bmatrix}-1&3\\4&-2\end{bmatrix} = (-1)(-2) - (3)(4) = 2 - 12 = -10$.

      $\det A = 2(19) + 1(13) + 0(-10) = 38 + 13 = 51$.

  - id: ht-det-product-inverse
    type: numericResponse
    prompt: |
      Suppose $A$ is a $4 \times 4$ matrix with $\det(A) = -2$. Compute $\det(3A^{-1})$.
    answer:
      value: -40.5
      tolerance: 0.01
    explanation: |
      $\det(A^{-1}) = \frac{1}{\det(A)} = \frac{1}{-2} = -\frac{1}{2}$.
      $\det(3A^{-1}) = 3^4 \cdot \det(A^{-1}) = 81 \cdot \left(-\frac{1}{2}\right) = -\frac{81}{2} = -40.5$.

  - id: ht-area-scaling
    type: multipleChoice
    prompt: |
      Let $T: \mathbb{R}^2 \to \mathbb{R}^2$ be the linear transformation defined by the matrix $A = \begin{bmatrix} 3 & 1 \\ 2 & 4 \end{bmatrix}$.
      If a region $S$ in $\mathbb{R}^2$ has area 7, what is the area of $T(S)$?
    choices:
      - id: c1
        text: '7'
      - id: c2
        text: '14'
      - id: c3
        text: '70'
      - id: c4
        text: '140'
    answer:
      choiceId: c3
    explanation: |
      A linear transformation scales all areas by $|\det(A)|$.
      $\det(A) = (3)(4) - (1)(2) = 12 - 2 = 10$.
      Area of $T(S) = |\det(A)| \times \text{Area}(S) = 10 \times 7 = 70$.
