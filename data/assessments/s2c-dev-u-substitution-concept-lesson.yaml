schemaVersion: 1
id: s2c-dev-u-substitution-concept-lesson
title: 'S2C Development: U-Substitution Concept Lesson'
assessmentType: conceptLesson
categoryId: s2c-dev
topicId: s2c-u-substitution-trial
skills: [recognize-composite-structure, transform-differentials, change-definite-bounds]
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [s2c-dev, source-grounded-trial, u-substitution]
modeDefault: practice
randomizeQuestions: false
authoring:
  visualRequirement: required
  visualRationale: The change of variables is best understood as a mapped flow from an x-integrand to a u-integrand.
lesson:
  introduction: This development-only lesson tests an eight-step, source-grounded U-substitution flow. It uses original prose and media; the source supplied the conceptual sequence.
  sections:
  - id: sec-01
    title: Read the integrand as a chain-rule pattern
    required: true
    content: U-substitution reverses the chain rule. Look for an inner expression together with its derivative, possibly multiplied by a constant.
    media:
    - type: image
      src: /media/calculus/u-substitution-flow.svg
      alt: A three-stage diagram matching an inner function and its derivative, changing variables, then integrating and substituting back.
      caption: The substitution must replace both the inner expression and its differential.
    check:
      id: check-01
      type: multipleChoice
      prompt: 'In $\int 6x\,e^{3x^2}\,dx$, which choice makes the chain-rule pair explicit?'
      choices:
      - { id: a, text: '$u=3x^2$, so $du=6x\,dx$' }
      - { id: b, text: '$u=6x$, so $du=6\,dx$' }
      - { id: c, text: '$u=e^{3x^2}$, so $du=e^{3x^2}\,dx$' }
      answer: { choiceId: a }
  - id: sec-02
    title: Choose the expression that simplifies the whole integrand
    required: true
    content: A useful substitution removes nesting. Choosing a visible factor is not enough unless the remaining factors can also be written in u.
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: 'Which substitution is most useful for $\int x\sqrt{x^2+4}\,dx$?'
      choices:
      - { id: a, text: '$u=x$' }
      - { id: b, text: '$u=x^2+4$' }
      - { id: c, text: '$u=\sqrt{x^2+4}$ only' }
      answer: { choiceId: b }
  - id: sec-03
    title: Carry the differential with the substitution
    required: true
    content: Write du immediately. If the differential is present up to a constant factor, solve for the needed factor before replacing anything.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: 'For $u=5x-1$, what replacement is correct in an integral?'
      choices:
      - { id: a, text: '$dx=5\,du$' }
      - { id: b, text: '$dx=du/5$' }
      - { id: c, text: '$dx=du-1$' }
      answer: { choiceId: b }
  - id: sec-04
    title: Remove every x before integrating in u
    required: true
    content: After the change of variables, the integral is either entirely in u or the substitution is incomplete. This quick audit prevents mixed-variable errors.
    media:
    - type: image
      src: /media/calculus/u-substitution-flow.svg
      alt: The middle stage of a change-of-variable flow showing an integral entirely in u.
      caption: Stop and repair the setup if any x remains after substitution.
    check:
      id: check-04
      type: multipleChoice
      prompt: 'Which transformed integral is valid after $u=x^2+1$ in $\int x(x^2+1)^4\,dx$?'
      choices:
      - { id: a, text: '$\int u^4\,du$' }
      - { id: b, text: '$\frac12\int u^4\,du$' }
      - { id: c, text: '$\frac12\int x u^4\,du$' }
      answer: { choiceId: b }
  - id: sec-05
    title: Return to x for an indefinite integral
    required: true
    content: An indefinite antiderivative should end in the original variable. Add the constant once, after integrating the transformed expression.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: 'After finding $u^3/3+C$ with $u=\sin x$, what final form is correct?'
      choices:
      - { id: a, text: '$\sin^3(x)/3+C$' }
      - { id: b, text: '$x^3/3+C$' }
      - { id: c, text: '$u^3/3+x$' }
      answer: { choiceId: a }
  - id: sec-06
    title: Change bounds for a definite integral
    required: true
    content: For a definite integral, convert both x-bounds to u-bounds and finish in u. Do not change bounds and then substitute back again.
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: 'With $u=x^2+1$, what are the u-bounds for $x=0$ to $x=2$?'
      choices:
      - { id: a, text: '$0$ to $2$' }
      - { id: b, text: '$1$ to $5$' }
      - { id: c, text: '$1$ to $4$' }
      answer: { choiceId: b }
  - id: sec-07
    title: Know when substitution is not the first tool
    required: true
    content: A product such as $x e^x$ has no inner-function derivative pair. Integration by parts, rather than substitution, is the natural next method.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: 'Why is $\int xe^x\,dx$ not an immediate U-substitution problem?'
      choices:
      - { id: a, text: 'Neither factor is the derivative of a useful inner expression for the other.' }
      - { id: b, text: 'Exponential functions cannot be integrated.' }
      - { id: c, text: 'The integrand has too many variables.' }
      answer: { choiceId: a }
  - id: sec-08
    title: Verify by differentiating
    required: true
    content: Differentiate the final expression. The chain-rule factor is the fastest check that a constant factor was not lost.
    media: []
    check:
      id: check-08
      type: multipleChoice
      prompt: 'Which derivative verifies $\int 2x\cos(x^2)\,dx=\sin(x^2)+C$?'
      choices:
      - { id: a, text: '$\cos(x^2)$' }
      - { id: b, text: '$2x\cos(x^2)$' }
      - { id: c, text: '$2\sin x$' }
      answer: { choiceId: b }
