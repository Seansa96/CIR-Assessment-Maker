title: Acoustics and Sound Glossary
assessmentType: glossary
categoryId: physics-1
topicId: physics-acoustics
skills: [physics-sound, physics-acoustics]
navigation:
  learningGoal: learn
  activityType: glossary
  tags: [physics-1, physics-acoustics, needs-expansion]
# REVIEW_NOTE: Merged from eight thin topics:
#   physics-sound-waves, physics-speed-of-sound, physics-sound-intensity,
#   physics-standing-sound-modes, physics-musical-sound-sources,
#   physics-beats, physics-doppler-effect, physics-shock-waves.
# Needs a proper conceptLesson, workedExample, quiz, and test to complete the curriculum stack.
glossary:
  introduction: >
    Core language for sound as a longitudinal pressure wave, including its speed, intensity,
    resonant tube modes, musical pitch, beat frequency, the Doppler shift, and Mach-cone shock waves.
  sections:
  - id: sound-wave-terms
    title: Sound Wave Basics
    entries:
    - id: compression
      term: compression
      definition: A region of increased pressure and density in a longitudinal wave.
      drills:
      - {id: compression-drill, type: typed, prompt: 'What high-pressure region occurs in a sound wave?', answer: {expected: compression}}
    - id: rarefaction
      term: rarefaction
      definition: A region of decreased pressure and density in a longitudinal wave.
      drills:
      - {id: rarefaction-drill, type: cloze, prompt: 'A low-pressure region in a sound wave is a {{rarefaction}}.', answer: {expected: rarefaction}}
    - id: longitudinal-wave
      term: longitudinal wave
      definition: A wave whose material displacement is parallel to propagation.
      drills:
      - {id: longitudinal-drill, type: typed, prompt: 'What type of wave has displacement parallel to travel?', answer: {expected: longitudinal wave}}
  - id: speed-of-sound-terms
    title: Speed of Sound
    entries:
    - id: bulk-modulus
      term: bulk modulus
      definition: 'The stiffness coefficient $B$ relating pressure change to fractional volume change; $v=\sqrt{B/\rho}$ in a fluid.'
      drills:
      - {id: bulk-modulus-drill, type: cloze, prompt: 'Sound speed in a fluid is $v={{\sqrt{B/\rho}}}$.', answer: {expected: '\sqrt{B/\rho}'}}
    - id: temperature-dependence
      term: temperature dependence
      definition: 'In air at temperature $T$ (Celsius) approximately $v\approx331+0.6T$ m/s.'
      drills:
      - {id: temp-dep-drill, type: typed, prompt: 'Does increasing air temperature increase or decrease the speed of sound?', answer: {expected: increase}}
  - id: intensity-terms
    title: Sound Intensity
    entries:
    - id: intensity
      term: intensity
      definition: 'Power per unit area; $I=P/A$, SI unit W/m².'
      drills:
      - {id: intensity-drill, type: cloze, prompt: 'Intensity is $I={{P/A}}$, power per unit area.', answer: {expected: 'P/A'}}
    - id: inverse-square
      term: inverse-square law
      definition: 'For an isotropic source, $I=P/(4\pi r^2)$ decreases as $1/r^2$ with distance.'
      drills:
      - {id: inverse-square-drill, type: typed, prompt: 'If distance doubles, by what factor does point-source intensity change?', answer: {expected: 'decreases by factor 4 (one quarter)'}}
    - id: decibel
      term: decibel
      definition: 'Logarithmic intensity level $\beta=10\log_{10}(I/I_0)$ with $I_0=10^{-12}$ W/m².'
      drills:
      - {id: decibel-drill, type: cloze, prompt: 'The decibel level is $\beta={{10\log_{10}(I/I_0)}}$.', answer: {expected: '10\log_{10}(I/I_0)'}}
  - id: resonant-tube-terms
    title: Resonant Tubes and Musical Sound
    entries:
    - id: open-open-tube
      term: open-open tube harmonics
      definition: 'Both ends are antinodes; frequencies $f_n=nv/(2L)$ for $n=1,2,3,\ldots$'
      drills:
      - {id: open-open-drill, type: cloze, prompt: 'Open-open tube frequencies are $f_n={{nv/(2L)}}$.', answer: {expected: 'nv/(2L)'}}
    - id: open-closed-tube
      term: open-closed tube harmonics
      definition: 'Closed end is a node, open end an antinode; only odd harmonics: $f_n=nv/(4L)$, $n=1,3,5,\ldots$'
      drills:
      - {id: open-closed-drill, type: cloze, prompt: 'An open-closed tube supports only {{odd}} harmonics.', answer: {expected: odd}}
    - id: displacement-node
      term: displacement node at closed end
      definition: 'Air molecules cannot move perpendicular to a rigid wall, making closed ends displacement nodes.'
      drills:
      - {id: displacement-node-drill, type: typed, prompt: 'What displacement feature is at a closed end of a resonant tube?', answer: {expected: node}}
    - id: fundamental
      term: fundamental frequency
      definition: 'The lowest-frequency resonant mode of a system; all higher harmonics are integer multiples of it.'
      drills:
      - {id: fundamental-drill, type: cloze, prompt: 'The lowest mode frequency is the {{fundamental}}.', answer: {expected: fundamental}}
    - id: pitch
      term: pitch
      definition: The perceptual correlate of frequency; higher frequency produces higher pitch.
      drills:
      - {id: pitch-drill, type: typed, prompt: 'What physical property most directly determines musical pitch?', answer: {expected: frequency}}
  - id: beats-terms
    title: Beats
    entries:
    - id: beat-frequency
      term: beat frequency
      definition: 'Amplitude-modulation rate when two slightly different frequencies superpose: $f_\text{beat}=|f_1-f_2|$.'
      drills:
      - {id: beat-freq-drill, type: cloze, prompt: 'Beat frequency is $f_\text{beat}={{|f_1-f_2|}}$.', answer: {expected: '|f_1-f_2|'}}
  - id: doppler-terms
    title: Doppler Effect
    entries:
    - id: doppler-formula
      term: Doppler formula
      definition: 'Observed frequency when source and observer move: $f_o=f_s\frac{v\pm v_o}{v\mp v_s}$; upper signs for approach.'
      drills:
      - {id: doppler-drill, type: typed, prompt: 'Does an approaching source raise or lower the observed frequency?', answer: {expected: raise}}
    - id: doppler-blueshift
      term: approach blueshift
      definition: 'When source approaches, wavefronts bunch up: observed frequency is higher than emitted frequency.'
      drills:
      - {id: blueshift-drill, type: cloze, prompt: 'An approaching source produces a {{higher}} observed frequency.', answer: {expected: higher}}
  - id: shock-wave-terms
    title: Shock Waves
    entries:
    - id: mach-number
      term: Mach number
      definition: 'Ratio of source speed to wave speed: $M=v_s/v$.'
      drills:
      - {id: mach-drill, type: cloze, prompt: 'Mach number is $M={{v_s/v}}$.', answer: {expected: 'v_s/v'}}
    - id: mach-cone
      term: Mach cone
      definition: 'The V-shaped wavefront envelope when a source exceeds the wave speed ($M>1$); half-angle $\sin\theta=1/M$.'
      drills:
      - {id: mach-cone-drill, type: typed, prompt: 'What condition is required for a Mach cone to form?', answer: {expected: 'source speed exceeds sound speed (M > 1)'}}
