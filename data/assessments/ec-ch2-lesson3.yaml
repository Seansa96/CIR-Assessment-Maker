workedExamples:
- id: l3-sec1
  title: Nodes, Paths, Branches, and Loops
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Nodes, Paths, Branches, and Loops
    instruction: A node is a point where two or more circuit elements join. A loop
      is a closed path. A branch is a path that connects two nodes.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l3-sec2
  title: Kirchhoff's Current Law (KCL)
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Kirchhoff's Current Law (KCL)
    instruction: 'The algebraic sum of all currents entering any node in a circuit
      is zero: $\sum i_{in} = 0$. This is based on the conservation of charge.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l3-sec3
  title: Kirchhoff's Voltage Law (KVL)
  problem: 'Review the following concept:'
  steps:
  - id: step3
    title: Kirchhoff's Voltage Law (KVL)
    instruction: 'The algebraic sum of all voltages around any closed path (loop)
      in a circuit is zero: $\sum v = 0$. This is based on the conservation of energy.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
