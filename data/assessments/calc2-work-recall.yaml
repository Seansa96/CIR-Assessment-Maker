  prompt: What is the formula for Hooke's Law?
  answer:
    expected: F = kx
    aliases:
    - kx
    - F(x)=kx
- id: r002
  type: flashcard
  skills:
  - work
  prompt: When setting up a spring work integral, what does 'x' represent?
  answer:
    expected: The distance the spring is stretched or compressed beyond its natural
      length.
- id: r003
  type: typed
  skills:
  - work
  prompt: In the metric system, what is the standard unit of Work?
  answer:
    expected: Joules
    aliases:
    - Joule
    - J
- id: r004
  type: typed
  skills:
  - work
  prompt: For a pumping problem, weight density is equal to mass density multiplied
    by what?
  answer:
    expected: gravity
    aliases:
    - g
    - 9.8
    - acceleration due to gravity
- id: r005
  type: flashcard
  skills:
  - work
  prompt: If a slice of water is at height $y$, and the tank's top is at height $H$,
    what is the distance lifted?
  answer:
    expected: $H - y$
