lesson:
  introduction: A common application of these relationships is in systems of connected
    wheels, gears, or pulleys linked by belts or chains.
  sections:
  - id: sec-1
    title: Coupled Wheels and Belts
    content: 'When two wheels of different radii are connected by a belt (that does
      not slip), the tangential speed $v$ of the belt is the same everywhere. Therefore,
      the tangential speed at the rim of wheel 1 must equal the tangential speed at
      the rim of wheel 2: $$v_1 = v_2 \implies R_1\omega_1 = R_2\omega_2$$


      Similarly, their tangential accelerations must match: $$R_1\alpha_1 = R_2\alpha_2$$

      This principle is how gearboxes and bicycle chains convert high angular velocities
      into lower ones with higher torque, or vice versa.'
    media: []
    check:
      id: chk-at-3
      type: multipleChoice
      prompt: Wheel A ($R_A = 10\text{ cm}$) drives Wheel B ($R_B = 5\text{ cm}$)
        via a non-slipping belt. If Wheel A rotates at 20 rad/s, what is the angular
        velocity of Wheel B?
      choices:
      - id: a
        text: 10 rad/s
        issueSignals:
        - id: unit-conversion-error
      - id: b
        text: 20 rad/s
        issueSignals:
        - id: unit-conversion-error
      - id: c
        text: 40 rad/s
      - id: d
        text: 80 rad/s
        issueSignals:
        - id: unit-conversion-error
      answer:
        choiceId: c
      explanation: 'Solution:

        40 rad/s


        Why it works:

        Since $R_A \omega_A = R_B \omega_B$, we have $(10)(20) = (5)(\omega_B)$. Solving
        for $\omega_B$ gives $200 / 5 = 40$ rad/s. The smaller wheel must spin faster
        to keep up with the belt.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: No-Slip Belts
    content: 'A no-slip belt has equal rim speeds: $R_1\omega_1=R_2\omega_2$.'
    media: []
    check: { id: chk-at-10, type: multipleChoice, prompt: 'A 0.20 m pulley drives a 0.40 m pulley. The larger pulley turns at what fraction of the smaller speed?', choices: [{ id: a, text: one half }, { id: b, text: one }, { id: c, text: two }, { id: d, text: four }], answer: { choiceId: a }, explanation: 'Solution: It turns at one half the angular speed.\n\nWhy it works: Equal rim speed gives inverse angular-speed-radius relation.\n\nWhy the other choices fail: They assume equal angular speeds or reverse the ratio.' }
  - id: sec-4
    title: Gear Direction
    content: 'Meshed external gears rotate in opposite directions, while a belt can preserve or reverse direction depending on its routing.'
    media: []
    check: { id: chk-at-11, type: multipleChoice, prompt: 'Two externally meshed gears rotate in:', choices: [{ id: a, text: same direction }, { id: b, text: opposite directions }, { id: c, text: no direction }, { id: d, text: radial directions }], answer: { choiceId: b }, explanation: 'Solution: They rotate in opposite directions.\n\nWhy it works: Contacting rim velocities must match.\n\nWhy the other choices fail: Equal speed at contact does not mean equal rotation direction.' }
  - id: sec-5
    title: Angular Acceleration Ratios
    content: 'No-slip coupling also gives $R_1\alpha_1=R_2\alpha_2$.'
    media: []
    check: { id: chk-at-12, type: multipleChoice, prompt: 'For equal-radius coupled wheels, angular accelerations are:', choices: [{ id: a, text: equal magnitude }, { id: b, text: unrelated }, { id: c, text: zero }, { id: d, text: radius squared }], answer: { choiceId: a }, explanation: 'Solution: They have equal magnitude.\n\nWhy it works: Equal radii and equal tangential acceleration require equal $\alpha$.\n\nWhy the other choices fail: The belt imposes a kinematic constraint.' }
  - id: sec-6
    title: Rolling Constraint
    content: 'For a wheel rolling without slipping, center speed obeys $v_{cm}=R\omega$.'
    media: []
    check: { id: chk-at-13, type: multipleChoice, prompt: 'A rolling wheel has radius 0.25 m and speed 5.0 m/s. Its angular speed is:', choices: [{ id: a, text: '$1.25$ rad/s' }, { id: b, text: '$5$ rad/s' }, { id: c, text: '$20$ rad/s' }, { id: d, text: '$25$ rad/s' }], answer: { choiceId: c }, explanation: 'Solution: $\omega=v/R=5.0/0.25=20$ rad/s.\n\nWhy it works: No-slip rolling matches center translation to rim rotation.\n\nWhy the other choices fail: They multiply or use an incorrect radius factor.' }
  - id: sec-7
    title: Choosing Relations
    content: 'Use $v=r\omega$ for speed, $a_t=r\alpha$ for rate changes, and $a_r=r\omega^2$ for turning.'
    media: []
    check: { id: chk-at-14, type: multipleChoice, prompt: 'Which relation gives centripetal acceleration from angular speed?', choices: [{ id: a, text: '$r\alpha$' }, { id: b, text: '$r\omega^2$' }, { id: c, text: '$r\theta$' }, { id: d, text: '$\tau\omega$' }], answer: { choiceId: b }, explanation: 'Solution: $a_r=r\omega^2$.\n\nWhy it works: Circular motion requires inward acceleration proportional to angular-speed squared.\n\nWhy the other choices fail: The alternatives give tangential acceleration, arc length, or power.' }
  - id: sec-2
    title: Total Linear Acceleration
    content: 'For a point on a rotating body experiencing angular acceleration, the
      total linear acceleration vector $\vec{a}$ is the vector sum of its tangential
      and radial components: $$\vec{a} = \vec{a}_t + \vec{a}_r$$

      Since $\vec{a}_t$ and $\vec{a}_r$ are always perpendicular, the magnitude of
      the total acceleration is found using the Pythagorean theorem: $$a = \sqrt{a_t^2
      + a_r^2} = \sqrt{(r\alpha)^2 + (r\omega^2)^2}$$'
    media: []
    check:
      id: chk-at-4
      type: multipleChoice
      prompt: At a specific instant, a point on a disk has $a_t = 3 \text{ m/s}^2$
        and $a_r = 4 \text{ m/s}^2$. What is the magnitude of its total linear acceleration?
      choices:
      - id: a
        text: $1 \text{ m/s}^2$
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: $5 \text{ m/s}^2$
      - id: c
        text: $7 \text{ m/s}^2$
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: d
        text: $12 \text{ m/s}^2$
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        $5 \text{ m/s}^2$


        Why it works:

        Because tangential and radial accelerations are perpendicular, $a = \sqrt{3^2
        + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5 \text{ m/s}^2$.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
