sections:
- id: kinetic-energy
  title: Kinetic Energy
  content: '**Kinetic Energy ($K$)** is the energy of motion. An object that has motion
    - whether it is vertical or\rhorizontal motion - has kinetic energy.


    The kinetic energy of an object of mass $m$ moving at speed $v$ is given by:

    $$ K = \frac{1}{2} m v^2 $$


    * **Units:** Like work, kinetic energy is measured in Joules (J).

    * **Properties:** It is a scalar quantity. Because it depends on $v^2$, kinetic
    energy is always positive (or zero if the object is at rest). A car moving at
    $20$ m/s North has the exact same kinetic energy as a car moving $20$ m/s South.

    '
- id: velocity-vs-speed
  title: Dependence on Speed
  content: 'Notice that $K \propto v^2$. This means that doubling your speed does
    not double your kinetic energy; it *quadruples* it!


    This has profound real-world consequences, such as in car accidents: a crash at
    60 mph involves four times as much kinetic energy to dissipate as a crash at 30
    mph, not twice as much.

    '
lesson:
  introduction: Kinetic Energy
  sections:
  - id: sec-q001
    title: Object A has mass $m$ and speed $v$. Object B has mass $2m$ and speed $v/2$.
      How does the kinetic energy of Object B ($K_B$) compare to the kinetic energy
      of Object A ($K_A$)?
    content: |
      Object A has mass $m$ and speed $v$. Object B has mass $2m$ and speed $v/2$. How does the kinetic energy of Object B ($K_B$) compare to the kinetic energy of Object A ($K_A$)?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: $K_B = K_A$
      - id: b
        text: $K_B = \frac{1}{2} K_A$
      - id: c
        text: $K_B = 2 K_A$
      - id: d
        text: $K_B = \frac{1}{4} K_A$
      answer:
        choiceId: b
      explanation: |
        Solution: $K_B=\tfrac12(2m)(v/2)^2=\tfrac12K_A$.

        Why it works: Mass changes linearly but speed changes quadratically.

        Why the other choices fail: They do not apply the square to the speed ratio.
  - { id: ke2, title: Mass dependence, content: 'At fixed speed, kinetic energy is proportional to mass.', check: { id: ke-c2, type: multipleChoice, prompt: 'At the same speed, which has twice the kinetic energy?', choices: [{ id: a, text: 'An object with twice the mass', issueSignals: [] }, { id: b, text: 'An object with half the mass', issueSignals: [{ id: mass-proportionality, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: Twice the mass gives twice $K$.\n\nWhy it works: $K=\tfrac12mv^2$ is linear in $m$.\n\nWhy the other choices fail: Half the mass halves, not doubles, kinetic energy.' } }
  - { id: ke3, title: Speed dependence, content: 'At fixed mass, kinetic energy is proportional to $v^2$.', check: { id: ke-c3, type: multipleChoice, prompt: 'If speed doubles, kinetic energy changes by what factor?', choices: [{ id: a, text: '4', issueSignals: [] }, { id: b, text: '2', issueSignals: [{ id: missed-square, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: It increases by $2^2=4$.\n\nWhy it works: Speed is squared in kinetic energy.\n\nWhy the other choices fail: Factor 2 ignores the square.' } }
  - { id: ke4, title: Scalar quantity, content: 'Kinetic energy is scalar: opposite velocities with equal speed have equal kinetic energy.', check: { id: ke-c4, type: multipleChoice, prompt: 'Two equal cars travel at equal speeds in opposite directions. How do their kinetic energies compare?', choices: [{ id: a, text: 'They are equal', issueSignals: [] }, { id: b, text: 'They have opposite signs', issueSignals: [{ id: scalar-vector-confusion, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: They are equal.\n\nWhy it works: Squared speed removes direction.\n\nWhy the other choices fail: Kinetic energy is not a vector.' } }
  - { id: ke5, title: Rest condition, content: 'At rest, $v=0$ and kinetic energy is zero.', check: { id: ke-c5, type: multipleChoice, prompt: 'What is kinetic energy of an object at rest?', choices: [{ id: a, text: '$0$ J', issueSignals: [] }, { id: b, text: 'Negative', issueSignals: [{ id: negative-kinetic-energy, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: $K=0$ J.\n\nWhy it works: $v=0$ in $K=\tfrac12mv^2$.\n\nWhy the other choices fail: Classical kinetic energy cannot be negative.' } }
  - { id: ke6, title: Calculate kinetic energy, content: 'Substitute mass in kg and speed in m/s to obtain joules.', check: { id: ke-c6, type: multipleChoice, prompt: 'What is $K$ for a 2 kg object at 3 m/s?', choices: [{ id: a, text: '$9$ J', issueSignals: [] }, { id: b, text: '$6$ J', issueSignals: [{ id: missed-half-factor, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: $K=\tfrac12(2)(3)^2=9$ J.\n\nWhy it works: Apply the formula with squared speed.\n\nWhy the other choices fail: Six joules does not include the squared speed correctly.' } }
  - { id: ke7, title: Connect kinetic energy and work, content: 'Net work changes kinetic energy through $W_{net}=\Delta K$.', check: { id: ke-c7, type: multipleChoice, prompt: 'Positive net work on an object does what to its kinetic energy?', choices: [{ id: a, text: 'Increases it', issueSignals: [] }, { id: b, text: 'Always makes it zero', issueSignals: [{ id: work-energy-sign, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: It increases kinetic energy.\n\nWhy it works: Positive $W_{net}$ means positive $\Delta K$.\n\nWhy the other choices fail: Zero kinetic energy occurs only if the object is at rest.' } }
