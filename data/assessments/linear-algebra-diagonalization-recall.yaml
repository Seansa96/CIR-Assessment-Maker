schemaVersion: 1
id: linear-algebra-diagonalization-recall
title: Diagonalization Recall Drill
assessmentType: recallDrill
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-diagonalization
modeDefault: practice
randomizeQuestions: true
skills:
  - diagonalization
  - eigen-decomposition
  - matrix-powers
items:
  - id: r-diag-eq
    type: flashcard
    prompt: |
      What is the matrix factorization equation that defines a diagonalizable matrix $A$?
    answer:
      expected: '$A = PDP^{-1}$, where $D$ is a diagonal matrix and $P$ is invertible.'

  - id: r-p-matrix-columns
    type: cloze
    prompt: |
      In the diagonalization $A = PDP^{-1}$, the columns of the matrix $P$ are the {{eigenvectors}} of $A$.
    answer:
      expected: 'eigenvectors'

  - id: r-d-matrix-entries
    type: flashcard
    prompt: |
      In the diagonalization $A = PDP^{-1}$, what are the entries on the main diagonal of $D$?
    answer:
      expected: 'The eigenvalues of $A$.'

  - id: r-matrix-power-formula
    type: flashcard
    prompt: |
      If a matrix is factored as $A = PDP^{-1}$, what is the formula for the matrix power $A^k$?
    answer:
      expected: '$A^k = PD^kP^{-1}$'

  - id: r-diag-theorem
    type: flashcard
    prompt: |
      According to the Diagonalization Theorem, an $n \times n$ matrix $A$ is diagonalizable if and only if it has what?
    answer:
      expected: '$n$ linearly independent eigenvectors.'

  - id: r-distinct-eigenvalues
    type: flashcard
    prompt: |
      If an $n \times n$ matrix has $n$ distinct (different) eigenvalues, what can we automatically conclude about the matrix?
    answer:
      expected: |
        It is diagonalizable. (Because $n$ distinct eigenvalues guarantee $n$ linearly independent eigenvectors).

  - id: r-pd-ap-verify
    type: flashcard
    prompt: |
      To verify a diagonalization factorization without computing an inverse, what equivalent matrix equation should you check?
    answer:
      expected: '$AP = PD$'
