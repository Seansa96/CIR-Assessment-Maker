# REVIEW_NOTE: Merged from four thin topics (physics-traveling-waves, physics-wave-mathematics,
# physics-stretched-string-wave-speed, physics-standing-waves-resonance).
# Needs a proper conceptLesson, workedExample, quiz, and test to complete the curriculum stack.
glossary:
  introduction: >
    Core language and mathematical tools for mechanical traveling and standing waves on strings,
    including the wave equation, wave speed on a stretched string, and resonant modes.
  sections:
  - id: traveling-wave-terms
    title: Traveling Waves
    entries:
    - id: transverse-wave
      term: transverse wave
      definition: A wave whose displacement is perpendicular to the direction of propagation.
      drills:
      - {id: transverse-drill, type: typed, prompt: 'What type of wave travels along a plucked string?', answer: {expected: transverse wave}}
    - id: wavelength
      term: wavelength
      definition: 'The spatial period $\lambda$; the distance over which the wave shape repeats.'
      drills:
      - {id: wavelength-drill, type: cloze, prompt: 'The distance for one complete wave cycle is the {{wavelength}}.', answer: {expected: wavelength}}
    - id: wave-speed-relation
      term: wave speed relation
      definition: 'Connects wavelength, frequency, and speed: $v=f\lambda$.'
      drills:
      - {id: wave-speed-rel-drill, type: cloze, prompt: 'Wave speed, frequency, and wavelength satisfy $v={{f\lambda}}$.', answer: {expected: 'f\lambda'}}
    - id: wave-number
      term: wave number
      definition: 'Spatial frequency $k=2\pi/\lambda$, with SI units rad/m.'
      drills:
      - {id: wave-number-drill, type: typed, prompt: 'What symbol is the wave number and how does it relate to wavelength?', answer: {expected: 'k = 2*pi / lambda'}}
  - id: wave-math-terms
    title: Mathematics of Waves
    entries:
    - id: wave-function
      term: wave function
      definition: 'The displacement field; a positive-x traveling wave is $y=A\sin(kx-\omega t+\phi)$.'
      drills:
      - {id: wave-function-drill, type: cloze, prompt: 'A positive-x traveling wave has form $y=A\sin({{kx-\omega t+\phi}})$.', answer: {expected: 'kx-\omega t+\phi'}}
    - id: angular-frequency-wave
      term: angular frequency
      definition: 'Temporal rate $\omega=2\pi f$, related to wave number by $\omega=vk$.'
      drills:
      - {id: omega-drill, type: typed, prompt: 'How is angular frequency $\omega$ related to ordinary frequency $f$?', answer: {expected: 'omega = 2*pi*f'}}
    - id: phase-velocity
      term: phase velocity
      definition: 'Speed at which a crest moves: $v=\omega/k$.'
      drills:
      - {id: phase-velocity-drill, type: cloze, prompt: 'Phase velocity is $v={{\omega/k}}$.', answer: {expected: '\omega/k'}}
  - id: string-speed-terms
    title: Wave Speed on a Stretched String
    entries:
    - id: linear-density
      term: linear mass density
      definition: 'Mass per unit length $\mu=m/L$, with SI units kg/m.'
      drills:
      - {id: linear-density-drill, type: cloze, prompt: 'Linear density is $\mu={{m/L}}$.', answer: {expected: 'm/L'}}
    - id: tension
      term: tension
      definition: 'The pulling force $F_T$ that provides the transverse restoring effect.'
      drills:
      - {id: tension-drill, type: cloze, prompt: 'String-wave speed increases with {{tension}}.', answer: {expected: tension}}
    - id: string-wave-speed
      term: string wave speed
      definition: 'Speed of a transverse wave on a stretched string: $v=\sqrt{F_T/\mu}$.'
      drills:
      - {id: string-wave-speed-drill, type: cloze, prompt: 'String wave speed is $v={{\sqrt{F_T/\mu}}}$.', answer: {expected: '\sqrt{F_T/\mu}'}}
  - id: standing-wave-terms
    title: Standing Waves and Resonance
    entries:
    - id: node
      term: node
      definition: A location with zero displacement in a standing wave.
      drills:
      - {id: node-drill, type: typed, prompt: 'What is a zero-displacement location in a standing wave?', answer: {expected: node}}
    - id: antinode
      term: antinode
      definition: A location of maximum displacement in a standing wave.
      drills:
      - {id: antinode-drill, type: cloze, prompt: 'Maximum displacement occurs at an {{antinode}}.', answer: {expected: antinode}}
    - id: resonance-string
      term: resonance
      definition: Large response when driving frequency matches an allowed natural frequency of the string.
      drills:
      - {id: resonance-string-drill, type: typed, prompt: 'What is excitation at a natural frequency called?', answer: {expected: resonance}}
    - id: harmonic
      term: harmonic
      definition: 'An allowed mode with integer number $n$ of half-wavelengths in a fixed-fixed string.'
      drills:
      - {id: harmonic-drill, type: cloze, prompt: 'An allowed integer mode is a {{harmonic}}.', answer: {expected: harmonic}}
