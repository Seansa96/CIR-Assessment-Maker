- id: aops-areas-we-1
  title: 'Area via Bounding Box and Subtraction'
  prompt: 'A triangle $ABC$ has vertices at $A(1, 4)$, $B(5, 7)$, and $C(6, 2)$. Compute the area of $\triangle ABC$ without using the Shoelace Theorem.'
  steps:
  - id: step-1
    title: Construct the bounding box
    prompt: Identify the minimum and maximum $x$ and $y$ coordinates of the vertices to determine the dimensions of the smallest rectangle that completely encloses the triangle with sides parallel to the axes.
    difficultyDimensions:
    - Identify the bounding coordinates.
    - Compute the width and height of the rectangle.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Min $x=1$, Max $x=6 \implies$ width $= 5$.
      - Min $y=2$, Max $y=7 \implies$ height $= 5$.
      - Bounding box area $= 5 \times 5 = 25$.
    explanation: |
      Solution:
      Look at the coordinates: $A(1, 4)$, $B(5, 7)$, $C(6, 2)$.
      The $x$-coordinates range from 1 to 6. Thus, the bounding box has a width of $6 - 1 = 5$.
      The $y$-coordinates range from 2 to 7. Thus, the bounding box has a height of $7 - 2 = 5$.
      The bounding box is a $5 \times 5$ square with an area of 25.

      Why it works:
      The bounding box method encloses the irregular triangle in a simple shape, turning a difficult area problem into subtracting three simple right triangles.
  - id: step-2
    title: Identify the three outer right triangles
    prompt: Find the leg lengths and areas of the three right triangles formed between the bounding box and the sides of $\triangle ABC$.
    difficultyDimensions:
    - Use the coordinate differences to find the legs.
    - Apply the triangle area formula $\frac{1}{2}bh$ to each.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Top-left triangle (above $AB$): legs 4 and 3. Area $= 6$.
      - Right triangle (right of $BC$): legs 1 and 5. Area $= 2.5$.
      - Bottom triangle (below $AC$): legs 5 and 2. Area $= 5$.
    explanation: |
      Solution:
      The three corner right triangles are formed by the differences in coordinates:
      1. Between $A(1, 4)$ and $B(5, 7)$: The horizontal distance is $5-1=4$ and the vertical distance is $7-4=3$. Area $= \frac{1}{2}(4)(3) = 6$.
      2. Between $B(5, 7)$ and $C(6, 2)$: The horizontal distance is $6-5=1$ and the vertical distance is $7-2=5$. Area $= \frac{1}{2}(1)(5) = 2.5$.
      3. Between $A(1, 4)$ and $C(6, 2)$: The horizontal distance is $6-1=5$ and the vertical distance is $4-2=2$. Area $= \frac{1}{2}(5)(2) = 5$.

      Why it works:
      Because the bounding box's sides are parallel to the axes, the vertical and horizontal distances between vertices perfectly form the perpendicular legs of right triangles.
  - id: step-3
    title: Subtract to find the final area
    prompt: Subtract the combined area of the three outer right triangles from the area of the bounding box to find the area of $\triangle ABC$.
    difficultyDimensions:
    - Sum the outer areas correctly.
    - Subtract from the total area.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Outer sum $= 6 + 2.5 + 5 = 13.5$.
      - Area $= 25 - 13.5 = 11.5$.
    explanation: |
      Solution:
      The sum of the three right triangles' areas is $6 + 2.5 + 5 = 13.5$.
      Subtracting this from the area of the $5 \times 5$ bounding box:
      Area of $\triangle ABC = 25 - 13.5 = 11.5$.

      Why it works:
      The bounding box is perfectly partitioned into $\triangle ABC$ and the three right triangles. Conservation of area dictates that subtracting the known pieces leaves exactly the desired area.

- id: aops-areas-we-2
  title: 'Ratios and Cevians'
  prompt: 'In $\triangle ABC$, point $D$ lies on $BC$ such that $BD:DC = 1:2$, and point $E$ lies on $AD$ such that $AE:ED = 3:4$. If the area of $\triangle ABC$ is 70, find the area of $\triangle ABE$.'
  steps:
  - id: step-1
    title: Split the main triangle along the first cevian
    prompt: Use the ratio of the bases on $BC$ to find the area of $\triangle ABD$.
    difficultyDimensions:
    - Recognize that $\triangle ABD$ and $\triangle ADC$ share an altitude from $A$.
    - Apply the proportional base ratio to the total area.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The ratio $BD:DC = 1:2$ means $BD$ is $1/3$ of the total base $BC$.
      - $\text{Area}(\triangle ABD) = \frac{1}{3} \times 70 = \frac{70}{3}$.
    explanation: |
      Solution:
      Because $D$ lies on $BC$, the triangles $\triangle ABD$ and $\triangle ADC$ share the same altitude dropped from vertex $A$.
      Therefore, their areas are proportional to their bases.
      The ratio $BD:DC$ is $1:2$, meaning the total base is $1+2=3$ parts. $BD$ is $\frac{1}{3}$ of the total base $BC$.
      $\text{Area}(\triangle ABD) = \frac{1}{3} \text{Area}(\triangle ABC) = \frac{1}{3}(70) = \frac{70}{3}$.

      Why it works:
      The formula for area is $\frac{1}{2}bh$. Since both inner triangles have the exact same $h$, the area strictly follows the ratio of the bases.
  - id: step-2
    title: Split the sub-triangle along the second cevian
    prompt: Now look at $\triangle ABD$. Use the ratio of the bases on $AD$ to find the area of $\triangle ABE$.
    difficultyDimensions:
    - Recognize that $\triangle ABE$ and $\triangle EBD$ share an altitude from $B$.
    - Apply the proportional base ratio to the sub-triangle's area.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AE:ED = 3:4$ means $AE$ is $3/7$ of the segment $AD$.
      - $\text{Area}(\triangle ABE) = \frac{3}{7} \times \text{Area}(\triangle ABD)$.
      - $\text{Area}(\triangle ABE) = \frac{3}{7} \times \frac{70}{3} = 10$.
    explanation: |
      Solution:
      Focus on $\triangle ABD$. The line segment $BE$ splits it into $\triangle ABE$ and $\triangle EBD$.
      Because $A, E, D$ are collinear, these two triangles share an altitude dropped from vertex $B$.
      Their areas are proportional to their bases $AE$ and $ED$.
      The ratio $AE:ED = 3:4$, meaning the total segment $AD$ is $3+4=7$ parts. $AE$ is $\frac{3}{7}$ of the total base $AD$.
      $\text{Area}(\triangle ABE) = \frac{3}{7} \text{Area}(\triangle ABD) = \frac{3}{7} \left(\frac{70}{3}\right)$.
      The 3s cancel, and $\frac{70}{7} = 10$.
      The area of $\triangle ABE$ is 10.

      Why it works:
      The "same base, same altitude" principle can be chained indefinitely. We just rotated our perspective so that $AD$ became the new base and $B$ became the new apex.

- id: aops-areas-we-3
  title: 'Heron''s Formula'
  prompt: 'A triangle has side lengths of 10, 17, and 21. Compute its area.'
  steps:
  - id: step-1
    title: Calculate the semiperimeter
    prompt: Find the semiperimeter $s$ of the triangle.
    difficultyDimensions:
    - Sum the three side lengths.
    - Divide by 2.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Perimeter $= 10 + 17 + 21 = 48$.
      - Semiperimeter $s = 48 / 2 = 24$.
    explanation: |
      Solution:
      The perimeter of the triangle is the sum of its sides:
      $10 + 17 + 21 = 48$.
      The semiperimeter $s$ is half of the perimeter:
      $s = \frac{48}{2} = 24$.

      Why it works:
      Heron's Formula requires the semiperimeter as its foundational variable.
  - id: step-2
    title: Apply Heron's Formula
    prompt: Plug the semiperimeter and the three side lengths into Heron's Formula to find the area.
    difficultyDimensions:
    - Substitute the values into $A = \sqrt{s(s-a)(s-b)(s-c)}$.
    - Compute the differences and multiply.
    - Extract the square root cleanly by factoring.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $s-a = 24-10 = 14$.
      - $s-b = 24-17 = 7$.
      - $s-c = 24-21 = 3$.
      - $A = \sqrt{24 \times 14 \times 7 \times 3}$.
      - $A = \sqrt{7056} = 84$.
    explanation: |
      Solution:
      Heron's Formula is $A = \sqrt{s(s-a)(s-b)(s-c)}$.
      Substitute $s = 24$, $a = 10$, $b = 17$, and $c = 21$:
      $A = \sqrt{24(24 - 10)(24 - 17)(24 - 21)}$
      $A = \sqrt{24(14)(7)(3)}$
      Instead of multiplying everything out, factor the terms to find perfect squares:
      $24 = 8 \times 3 = 2^3 \times 3$
      $14 = 2 \times 7$
      $7 = 7$
      $3 = 3$
      Combining these: $2^3 \times 3 \times 2 \times 7 \times 7 \times 3 = 2^4 \times 3^2 \times 7^2$.
      Take the square root of each term: $2^2 \times 3 \times 7 = 4 \times 3 \times 7 = 84$.
      The area of the triangle is 84.

      Why it works:
      By breaking the numbers into their prime factorizations, the square root can be taken rapidly without needing to calculate or memorize the square root of 7056.
