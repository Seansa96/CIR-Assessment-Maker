items:
  - { id: sr-01, type: cloze, prompt: 'Complete: $M=\frac{\text{moles solute}}{\text{___ solution}}$.', answer: { expected: liters of }, explanation: 'Solution: The phrase is liters of. Why it works: Molarity is mol/L of final solution.' }
  - { id: sr-02, type: cloze, prompt: 'Complete the dilution relation: $M_1V_1=___$.', answer: { expected: M_2V_2 }, explanation: 'Solution: The missing expression is $M_2V_2$. Why it works: Dilution conserves solute moles.' }
  - { id: sr-03, type: typed, prompt: 'State the approximate dilute-water meaning of ppm.', answer: { expected: mg per L }, explanation: 'Solution: ppm is approximately mg/L. Why it works: One liter of dilute water has mass near one kilogram.' }
  - { id: sr-04, type: typed, prompt: 'State the approximate dilute-water meaning of ppb.', answer: { expected: micrograms per L }, explanation: 'Solution: ppb is approximately micrograms/L. Why it works: It is one thousandth of a ppm.' }
  - { id: sr-05, type: cloze, prompt: 'In a volumetric flask, fill to the mark only after the solute has ___.', answer: { expected: dissolved }, explanation: 'Solution: The blank is dissolved. Why it works: The mark sets final solution volume.' }
  - { id: sr-06, type: typed, prompt: 'Give the equation connecting mass, moles, and molar mass.', answer: { expected: moles equals mass divided by molar mass }, explanation: 'Solution: $n=m/M_m$. Why it works: Molar mass converts grams to moles.' }
  - { id: sr-07, type: cloze, prompt: 'Mass percent uses mass of solute divided by mass of the total ___.', answer: { expected: solution }, explanation: 'Solution: The blank is solution. Why it works: Solute plus solvent makes the denominator.' }
