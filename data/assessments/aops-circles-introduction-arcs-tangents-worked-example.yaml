- id: aops-circles-at-we-1
  title: Chord distance from the center
  steps:
  - id: aops-circles-at-we-1-s1
    title: Apply the Perpendicular Bisector Theorem and identify the right triangle
    prompt: State why $OM$ bisects $AB$, then identify the right triangle created and its three sides.
    difficultyDimensions:
    - 'Recall: a perpendicular from the center to a chord bisects the chord.'
    - Compute the half-chord $AM = AB/2$.
    - Identify triangle $OMA$ as a right triangle with hypotenuse $OA = 13$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The Perpendicular Bisector Theorem gives $AM = AB/2 = 5$.
      - Right triangle $OMA$ has legs $OM$ and $AM = 5$, and hypotenuse $OA = 13$ (a radius).
    explanation: 'Solution:

      A fundamental theorem states: *the perpendicular from the center of a circle to a chord bisects
      the chord.* Since $OM \perp AB$, point $M$ is the midpoint of $AB$:

      $$AM = \frac{AB}{2} = \frac{10}{2} = 5$$

      The segment $OM$ is perpendicular to $AB$, so triangle $OMA$ has a right angle at $M$. The hypotenuse
      is the radius $OA = 13$.


      Why it works:

      This theorem is proved by noting that $OA = OB$ (both are radii). Point $O$ is equidistant from
      $A$ and $B$, so it lies on the perpendicular bisector of $AB$. Any point equidistant from the endpoints
      of a segment lies on its perpendicular bisector — a fundamental property of circles.

      '
    instruction: 'Work through this step: State why $OM$ bisects $AB$, then identify the right triangle
      created and its three sides.'
    type: freeResponse
  - id: aops-circles-at-we-1-s2
    title: Solve the Pythagorean equation for OM
    prompt: Apply the Pythagorean theorem to right triangle $OMA$ and solve for $OM$.
    difficultyDimensions:
    - Write $OM^2 + AM^2 = OA^2$.
    - Substitute $AM = 5$ and $OA = 13$.
    - Isolate $OM^2$ and take the positive root.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $OM^2 + 5^2 = 13^2$.
      - $OM^2 = 169 - 25 = 144$.
      - $OM = 12$.
    explanation: 'Solution:

      In right triangle $OMA$ (right angle at $M$):

      $$OM^2 + AM^2 = OA^2$$

      $$OM^2 + 5^2 = 13^2$$

      $$OM^2 = 169 - 25 = 144$$

      $$OM = 12$$


      Why it works:

      $OA$ is the hypotenuse (opposite the right angle at $M$), so we always subtract the leg squared
      from the hypotenuse squared to isolate the other leg. Reversing this (computing $5^2 + 13^2$) would
      give a number larger than 169, producing an impossible chord length.

      '
    instruction: 'Work through this step: Apply the Pythagorean theorem to right triangle $OMA$ and solve
      for $OM$.'
    type: freeResponse
  - id: aops-circles-at-we-1-s3
    title: Verify via the 5-12-13 Pythagorean triple and the geometric bound
    prompt: Confirm the result using the known Pythagorean triple and verify that $OM < r$ (the chord
      lies inside the circle).
    difficultyDimensions:
    - Recognize 5-12-13 as a Pythagorean triple.
    - Verify $OM = 12 < r = 13$ (the chord is not a diameter).
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $5^2 + 12^2 = 25 + 144 = 169 = 13^2$ ✓ (5-12-13 triple).
      - $OM = 12 < 13 = r$ ✓. The chord is at distance 12 from the center, inside the circle.
    explanation: 'Solution:

      **Pythagorean triple check:** $5^2 + 12^2 = 25 + 144 = 169 = 13^2$ ✓.

      The triple 5-12-13 is a scaled version of the primitive 5-12-13 triple (in this case it is the primitive
      itself).

      **Geometric bound:** The distance from the center to a chord must satisfy $0 \leq OM < r$. When
      $OM = 0$, the chord is a diameter ($AB = 2r$). When $OM \to r$, the chord shrinks to zero length.
      Since $OM = 12 < 13 = r$, the answer is geometrically consistent.


      Why it works:

      Recognizing common Pythagorean triples (3-4-5, 5-12-13, 8-15-17, 7-24-25) dramatically speeds up
      problems in circle geometry, since the perpendicular-from-center construction almost always creates
      a right triangle involving the radius.

      '
    instruction: 'Work through this step: Confirm the result using the known Pythagorean triple and verify
      that $OM < r$ (the chord lies inside the circle).'
    type: freeResponse
  problem: A circle has radius 13. Chord $AB$ has length 10, and $OM$ is the perpendicular from the center
    $O$ to chord $AB$. Find $OM$.
- id: aops-circles-at-we-2
  title: Tangent length from an external point
  steps:
  - id: aops-circles-at-we-2-s1
    title: Establish the right angle and identify the triangle
    prompt: State the Radius-Tangent Perpendicularity theorem, identify the right angle, and name the
      hypotenuse of the resulting right triangle.
    difficultyDimensions:
    - State that a radius drawn to a tangency point is perpendicular to the tangent.
    - Identify the right angle as $\angle OTP = 90°$.
    - Identify the hypotenuse as $OP = 17$ (the side opposite the right angle).
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $OT \perp PT$, so $\angle OTP = 90°$.
      - Right triangle $OTP$ has legs $OT = 8$ and $PT$, and hypotenuse $OP = 17$.
    explanation: 'Solution:

      A fundamental theorem: *a radius drawn to a point of tangency is perpendicular to the tangent line.*
      Therefore $OT \perp PT$, creating $\angle OTP = 90°$.

      Triangle $OTP$ is a right triangle. The hypotenuse is the side opposite the right angle at $T$,
      which is $OP = 17$.

      The legs are $OT = 8$ (a radius) and $PT$ (the unknown tangent length).


      Why it works:

      The perpendicularity of a radius to its tangent is the key structural fact about tangent lines to
      circles. It converts every "find the tangent length" problem into a simple Pythagorean theorem application.

      '
    instruction: 'Work through this step: State the Radius-Tangent Perpendicularity theorem, identify
      the right angle, and name the hypotenuse of the resulting right triangle.'
    type: freeResponse
  - id: aops-circles-at-we-2-s2
    title: Solve for the tangent length
    prompt: Apply the Pythagorean theorem and solve for $PT$.
    difficultyDimensions:
    - Write $OT^2 + PT^2 = OP^2$.
    - Substitute and solve.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $8^2 + PT^2 = 17^2$.
      - $PT^2 = 289 - 64 = 225$.
      - $PT = 15$.
    explanation: 'Solution:

      In right triangle $OTP$ (right angle at $T$):

      $$OT^2 + PT^2 = OP^2$$

      $$64 + PT^2 = 289$$

      $$PT^2 = 225$$

      $$PT = 15$$


      Why it works:

      The hypotenuse $OP = 17$ is always longer than either leg. Since $OP$ is the full distance from
      the external point to the center, and $OT = 8$ is the radius, the tangent length $PT = 15$ must
      be strictly less than 17. Our answer $15 < 17$ ✓.

      '
    instruction: 'Work through this step: Apply the Pythagorean theorem and solve for $PT$.'
    type: freeResponse
  - id: aops-circles-at-we-2-s3
    title: Verify with the 8-15-17 triple and the equal-tangents theorem
    prompt: Confirm the result using the Pythagorean triple and state what the equal-tangents theorem
      says about a second tangent from $P$.
    difficultyDimensions:
    - Verify $8^2 + 15^2 = 17^2$.
    - State that two tangent segments from the same external point are equal.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $8^2 + 15^2 = 64 + 225 = 289 = 17^2$ ✓ (8-15-17 triple).
      - If $PT'$ is a second tangent from $P$ to the circle, then $PT' = PT = 15$.
    explanation: 'Solution:

      **Pythagorean triple check:** $8^2 + 15^2 = 64 + 225 = 289 = 17^2$ ✓.

      **Equal tangents:** If a second tangent $PT''$ is drawn from the same external point $P$ to the
      same circle, the two tangent lengths are always equal: $PT'' = PT = 15$. This follows from the congruence
      of triangles $OTP$ and $OT''P$ by the hypotenuse-leg theorem ($OP$ is a shared hypotenuse and $OT
      = OT'' = 8$).


      Why it works:

      The equal-tangents theorem is extremely useful in competition problems: it means that if you know
      one tangent from an external point, you immediately know the other. It is also the engine behind
      the formula for the incircle radius in triangles ($r = K/s$).

      '
    instruction: 'Work through this step: Confirm the result using the Pythagorean triple and state what
      the equal-tangents theorem says about a second tangent from $P$.'
    type: freeResponse
  problem: From external point $P$, segment $PT$ is tangent to a circle of radius 8 at point $T$. If $OP
    = 17$, find $PT$.
- id: aops-circles-at-we-3
  title: Equal tangents and the supplementary angle
  steps:
  - id: aops-circles-at-we-3-s1
    title: Establish the right angles and form the quadrilateral
    prompt: Draw radii $OA$ and $OB$. State the two right angles they create and set up the angle-sum
      equation for quadrilateral $OAPB$.
    difficultyDimensions:
    - State $\angle OAP = \angle OBP = 90°$ (radius perpendicular to tangent).
    - Sum the four interior angles of quadrilateral $OAPB$ to $360°$.
    - Write the equation $90° + \angle APB + 90° + \angle AOB = 360°$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\angle OAP = \angle OBP = 90°$ by the radius-tangent theorem.
      - 'Quadrilateral equation: $90° + 50° + 90° + \angle AOB = 360°$.'''
    explanation: 'Solution:

      Drawing radii $OA$ and $OB$ to the tangency points creates right angles at each contact point: $\angle
      OAP = \angle OBP = 90°$.

      The four vertices $O$, $A$, $P$, $B$ form a quadrilateral. The interior angles of any quadrilateral
      sum to $360°$:

      $$\angle AOB + \angle OAP + \angle APB + \angle OBP = 360°$$

      $$\angle AOB + 90° + 50° + 90° = 360°$$


      Why it works:

      The quadrilateral approach avoids needing any specific formula about tangent angles. Instead, it
      uses only the two foundational facts: (1) radius $\perp$ tangent, and (2) the interior angles of
      a quadrilateral sum to $360°$.

      '
    instruction: 'Work through this step: Draw radii $OA$ and $OB$. State the two right angles they create
      and set up the angle-sum equation for quadrilateral $OAPB$.'
    type: freeResponse
  - id: aops-circles-at-we-3-s2
    title: Solve for the central angle AOB
    prompt: Use the angle-sum equation from step 1 to find $\angle AOB$.
    difficultyDimensions:
    - Simplify $\angle AOB + 230° = 360°$.
    - Solve for $\angle AOB$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\angle AOB = 360° - 230° = 130°$.
    explanation: 'Solution:

      $$\angle AOB + 90° + 50° + 90° = 360°$$

      $$\angle AOB + 230° = 360°$$

      $$\angle AOB = 130°$$


      Why it works:

      The sum $90° + 50° + 90° = 230°$ accounts for the three known angles of the quadrilateral. Subtracting
      from $360°$ gives the fourth angle.

      '
    instruction: 'Work through this step: Use the angle-sum equation from step 1 to find $\angle AOB$.'
    type: freeResponse
  - id: aops-circles-at-we-3-s3
    title: Find the minor arc and verify the supplementary relationship
    prompt: State the minor arc measure and verify that $\angle APB$ and $\angle AOB$ are supplementary.
    difficultyDimensions:
    - Minor arc $AB$ = central angle $\angle AOB = 130°$.
    - Check $\angle APB + \angle AOB = 50° + 130° = 180°$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Minor arc $AB = 130°$ (a central angle equals its intercepted arc).
      - $\angle APB + \angle AOB = 50° + 130° = 180°$ ✓. They are supplementary.
    explanation: 'Solution:

      **Minor arc:** A central angle equals the measure of its intercepted arc. The central angle $\angle
      AOB = 130°$, so the minor arc $AB$ measures $130°$.

      **Supplementary check:** $\angle APB + \angle AOB = 50° + 130° = 180°$.


      Why it works:

      This supplementary relationship ($\angle APB + \angle AOB = 180°$) is actually a theorem about two-tangent
      angles from an external point — and we proved it from scratch using only the quadrilateral method.
      The theorem states it directly: the external tangent angle and the central angle are always supplementary.
      We can generalize: if $\angle APB = \theta$, then $\angle AOB = 180° - \theta$.

      '
    instruction: 'Work through this step: State the minor arc measure and verify that $\angle APB$ and
      $\angle AOB$ are supplementary.'
    type: freeResponse
  problem: Tangents $PA$ and $PB$ touch a circle centered at $O$ at points $A$ and $B$ respectively. If
    $\angle APB = 50°$, find $\angle AOB$ and the minor arc $AB$.
- id: aops-circles-at-we-4
  title: Two chords intersecting inside a circle
  steps:
  - id: aops-circles-at-we-4-s1
    title: Apply the Intersecting Chords Theorem
    prompt: State the Intersecting Chords Theorem and use it to find $ED$.
    difficultyDimensions:
    - 'State the theorem: if two chords intersect at $E$ inside a circle, then $AE \cdot EC = BE \cdot
      ED$.'
    - Substitute $AE = 4$, $EC = 9$, $BE = 6$ and solve for $ED$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AE \cdot EC = BE \cdot ED$.
      - $4 \times 9 = 6 \times ED$.
      - $ED = 36/6 = 6$.
    explanation: 'Solution:

      The **Intersecting Chords Theorem** states: when two chords intersect at a point inside a circle,
      the product of the two segments of one chord equals the product of the two segments of the other
      chord.

      $$AE \cdot EC = BE \cdot ED$$

      Substituting the given values:

      $$4 \times 9 = 6 \times ED$$

      $$36 = 6 \cdot ED$$

      $$ED = 6$$


      Why it works:

      The theorem arises from similar triangles. Triangles $AEB$ and $DEC$ are similar (by AA: they share
      vertical angles at $E$, and inscribed angles $\angle A$ and $\angle D$ intercept the same arc $BD$).
      The similarity ratio gives $AE/BE = CE/DE$, which rearranges to $AE \cdot DE = BE \cdot CE$.

      '
    instruction: 'Work through this step: State the Intersecting Chords Theorem and use it to find $ED$.'
    type: freeResponse
  - id: aops-circles-at-we-4-s2
    title: Find the full length of chord BD
    prompt: Add the two segments of chord $BD$ to find its total length.
    difficultyDimensions:
    - $BD = BE + ED$.
    - Substitute $BE = 6$ and $ED = 6$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $BD = BE + ED = 6 + 6 = 12$.
    explanation: 'Solution:

      Chord $BD$ is divided by the intersection point $E$ into two segments: $BE = 6$ and $ED = 6$.

      The full chord length is:

      $$BD = BE + ED = 6 + 6 = 12$$


      Why it works:

      It is a coincidence in this problem that $BE = ED = 6$, which means $E$ is the midpoint of chord
      $BD$. This would only happen if chord $BD$ passed through the center (i.e., $BD$ is a diameter),
      *or* if chord $AC$ is perpendicular to $BD$. The problem data happens to produce this symmetric
      result.

      '
    instruction: 'Work through this step: Add the two segments of chord $BD$ to find its total length.'
    type: freeResponse
  - id: aops-circles-at-we-4-s3
    title: Compute the length of chord AC and verify the power of the point
    prompt: Find the full length of chord $AC$. Then verify that the "power of the point" $E$ is consistent
      for both chords.
    difficultyDimensions:
    - $AC = AE + EC = 4 + 9$.
    - Power of the point $E = AE \cdot EC = BE \cdot ED$.
    - Verify $4 \times 9 = 6 \times 6$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AC = 4 + 9 = 13$.
      - 'Power of point $E$: $AE \cdot EC = 36$ and $BE \cdot ED = 36$ ✓.'
    explanation: 'Solution:

      The full length of chord $AC$:

      $$AC = AE + EC = 4 + 9 = 13$$

      **Power of the point verification:** The "power of a point" is a single value associated with any
      interior point $E$, defined as $r^2 - OE^2$ where $O$ is the center and $r$ is the radius. For an
      interior point, the power equals $AE \cdot EC$ for *any* chord through $E$.

      $$AE \cdot EC = 4 \times 9 = 36$$

      $$BE \cdot ED = 6 \times 6 = 36 \checkmark$$

      Both chords produce the same product 36, confirming our answer.


      Why it works:

      The Power of a Point theorem unifies the Intersecting Chords Theorem (for interior points), the
      Secant-Secant Theorem (for exterior points), and the Secant-Tangent Theorem (when one line is tangent).
      In all cases, the product of signed distances to the circle along any line through the point is
      constant — a powerful invariant.

      '
    instruction: 'Work through this step: Find the full length of chord $AC$. Then verify that the "power
      of the point" $E$ is consistent for both chords.'
    type: freeResponse
  problem: Chords $AC$ and $BD$ intersect at point $E$ inside a circle. Given $AE = 4$, $EC = 9$, and
    $BE = 6$, find $ED$ and the full length of chord $BD$.
