workedExamples:
- id: aops-circles-introduction-arcs-tangents-worked-example-problem-1
  title: Chord distance from the center
  problem: A circle has radius 13. Chord $AB$ has length 10, and $OM$ is perpendicular to $AB$. Find $OM$.
  steps:
  - id: aops-circles-introduction-arcs-tangents-worked-example-p1-s1
    title: Use the chord theorem
    instruction: Perpendicular $OM$ from the center bisects chord $AB$.
    type: multipleChoice
    prompt: What is $AM$?
    choices:
    - id: a
      text: '5'
    - id: b
      text: '10'
    - id: c
      text: '13'
    - id: d
      text: '26'
    answer:
      choiceId: a
    explanation: $AM=AB/2=5$.
    media:
    - type: image
      src: /assessments/aops/aops-circles-chord.svg
      alt: Circle with radius OM perpendicular to chord AB and midpoint marks at M.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p1-s2
    title: Build a right triangle
    instruction: Triangle $OMA$ is right at $M$, with hypotenuse $OA=13$.
    type: multipleChoice
    prompt: Which equation applies?
    choices:
    - id: a
      text: $OM^2+5^2=13^2$
    - id: b
      text: $OM+5=13$
    - id: c
      text: $OM^2+13^2=5^2$
    - id: d
      text: $2OM=13$
    answer:
      choiceId: a
    explanation: The radius is the hypotenuse.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p1-s3
    title: Solve
    instruction: Subtract $25$ and take the positive square root.
    type: multipleChoice
    prompt: What is $OM$?
    choices:
    - id: a
      text: '12'
    - id: b
      text: '8'
    - id: c
      text: '14'
    - id: d
      text: '144'
    answer:
      choiceId: a
    explanation: $OM^2=144$, so distance $OM=12$.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p1-s4
    title: Check the geometry
    instruction: A center-to-chord distance must be shorter than the radius.
    type: multipleChoice
    prompt: Which comparison holds?
    choices:
    - id: a
      text: $12<13$
    - id: b
      text: $12>13$
    - id: c
      text: $12=13$
    - id: d
      text: $12<5$
    answer:
      choiceId: a
    explanation: The computed leg is shorter than the hypotenuse.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p1-s5
    title: Conclude
    instruction: State the requested length.
    type: multipleChoice
    prompt: What is the final conclusion?
    choices:
    - id: a
      text: $OM=12$
    - id: b
      text: $AB=12$
    - id: c
      text: $OA=12$
    - id: d
      text: $AM=12$
    answer:
      choiceId: a
    explanation: The center is 12 units from the chord.
- id: aops-circles-introduction-arcs-tangents-worked-example-problem-2
  title: Tangent length
  problem: From external point $P$, segment $PT$ is tangent to a radius-8 circle at $T$. If $OP=17$, find $PT$.
  steps:
  - id: aops-circles-introduction-arcs-tangents-worked-example-p2-s1
    title: Name the right angle
    instruction: A contact radius is perpendicular to its tangent.
    type: multipleChoice
    prompt: Which angle is $90^\circ$?
    choices:
    - id: a
      text: '$\angle OTP$'
    - id: b
      text: '$\angle OPT$'
    - id: c
      text: '$\angle TOP$'
    - id: d
      text: Every angle shown
    answer:
      choiceId: a
    explanation: $OT\perp PT$.
    media:
    - type: image
      src: /assessments/aops/aops-circles-tangent.svg
      alt: Circle centered O with tangent PT and right angle at T.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p2-s2
    title: Set the equation
    instruction: Use hypotenuse $OP=17$ and leg $OT=8$.
    type: multipleChoice
    prompt: Which equation is correct?
    choices:
    - id: a
      text: $PT^2+8^2=17^2$
    - id: b
      text: $PT^2+17^2=8^2$
    - id: c
      text: $PT+8=17$
    - id: d
      text: $2PT=25$
    answer:
      choiceId: a
    explanation: The side opposite the right angle is $OP$.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p2-s3
    title: Evaluate
    instruction: Compute $17^2-8^2$.
    type: multipleChoice
    prompt: What is $PT^2$?
    choices:
    - id: a
      text: '225'
    - id: b
      text: '153'
    - id: c
      text: '289'
    - id: d
      text: '81'
    answer:
      choiceId: a
    explanation: $289-64=225$.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p2-s4
    title: Choose the root
    instruction: A geometric length is positive.
    type: multipleChoice
    prompt: What is $PT$?
    choices:
    - id: a
      text: '15'
    - id: b
      text: $-15$
    - id: c
      text: '225'
    - id: d
      text: '9'
    answer:
      choiceId: a
    explanation: $\sqrt{225}=15$.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p2-s5
    title: Verify
    instruction: Check the Pythagorean triple.
    type: multipleChoice
    prompt: Which equality verifies the result?
    choices:
    - id: a
      text: $8^2+15^2=17^2$
    - id: b
      text: $8+15=17$
    - id: c
      text: $15^2+17^2=8^2$
    - id: d
      text: $8\cdot15=17^2$
    answer:
      choiceId: a
    explanation: $64+225=289$.
- id: aops-circles-introduction-arcs-tangents-worked-example-problem-3
  title: Equal tangents and an angle
  problem: 'Tangents $PA$ and $PB$ touch a circle centered at $O$. If $\angle APB=50^\circ$, find $\angle AOB$.'
  steps:
  - id: aops-circles-introduction-arcs-tangents-worked-example-p3-s1
    title: Add the radii
    instruction: Draw $OA$ and $OB$ to the two tangency points.
    type: multipleChoice
    prompt: What angles are created?
    choices:
    - id: a
      text: '$\angle OAP=\angle OBP=90^\circ$'
    - id: b
      text: Both are $50^\circ$
    - id: c
      text: Both are $25^\circ$
    - id: d
      text: No fixed angles
    answer:
      choiceId: a
    explanation: Each contact radius is perpendicular to its tangent.
    media:
    - type: image
      src: /assessments/aops/aops-circles-tangent.svg
      alt: Tangent-radius construction from an external point, used twice for two contact points.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p3-s2
    title: Recognize the quadrilateral
    instruction: Quadrilateral $OAPB$ has angle sum $360^\circ$.
    type: multipleChoice
    prompt: Which equation uses all four angles?
    choices:
    - id: a
      text: '$90+50+90+\angle AOB=360$'
    - id: b
      text: '$50+\angle AOB=180$'
    - id: c
      text: '$2\angle AOB=50$'
    - id: d
      text: '$90+90=\angle AOB$'
    answer:
      choiceId: a
    explanation: Use the two right angles and the given angle at P.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p3-s3
    title: Solve
    instruction: Subtract the known angles from $360^\circ$.
    type: multipleChoice
    prompt: 'What is $\angle AOB$?'
    choices:
    - id: a
      text: $130^\circ$
    - id: b
      text: $50^\circ$
    - id: c
      text: $230^\circ$
    - id: d
      text: $310^\circ$
    answer:
      choiceId: a
    explanation: $360-230=130$.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p3-s4
    title: Relate arcs
    instruction: The central angle determines minor arc $AB$.
    type: multipleChoice
    prompt: What is the minor arc measure?
    choices:
    - id: a
      text: $130^\circ$
    - id: b
      text: $65^\circ$
    - id: c
      text: $230^\circ$
    - id: d
      text: $50^\circ$
    answer:
      choiceId: a
    explanation: A central angle equals its intercepted minor arc.
  - id: aops-circles-introduction-arcs-tangents-worked-example-p3-s5
    title: Check
    instruction: For two tangents, the external angle and minor central angle are supplementary.
    type: multipleChoice
    prompt: Which check holds?
    choices:
    - id: a
      text: $50+130=180$
    - id: b
      text: $50=130$
    - id: c
      text: $2(50)=130$
    - id: d
      text: $360-50=130$
    answer:
      choiceId: a
    explanation: The known tangent-angle relation confirms the result.
