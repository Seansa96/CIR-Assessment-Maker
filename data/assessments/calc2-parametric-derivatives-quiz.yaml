questions:
  - id: q-param-deriv-quiz-1
    type: multipleChoice
    title: First Derivative Formula
    prompt: |
      If a curve is defined parametrically by $x = f(t)$ and $y = g(t)$, which of the following is the correct formula for $\frac{dy}{dx}$?
    choices:
      - id: c1
        text: '$\frac{g''(t)}{f''(t)}$'
      - id: c2
        text: '$\frac{f''(t)}{g''(t)}$'
      - id: c3
        text: '$g''(t) \cdot f''(t)$'
      - id: c4
        text: '$f''(g(t)) \cdot g''(t)$'
    answer:
      choiceId: c1
    explanation: |
      By the chain rule, $\frac{dy}{dt} = \frac{dy}{dx} \cdot \frac{dx}{dt}$. 
      Therefore, $\frac{dy}{dx} = \frac{\frac{dy}{dt}}{\frac{dx}{dt}} = \frac{g'(t)}{f'(t)}$, provided $f'(t) \neq 0$.
    skills:
      - parametric-derivatives

  - id: q-param-deriv-quiz-2
    type: symbolicResponse
    title: Calculating First Derivative
    prompt: |
      Find $\frac{dy}{dx}$ for the parametric curve given by $x = t^2 + 1$ and $y = 3t^3 - t$.
      
      Express your answer in terms of $t$.
    answer:
      expectedLatex: '\frac{9t^2 - 1}{2t}'
      equivalenceMode: expression
      variables:
        - t
      tolerance: 0.000001
    explanation: |
      First, compute the derivatives with respect to $t$:
      $\frac{dx}{dt} = 2t$
      $\frac{dy}{dt} = 9t^2 - 1$
      
      Then divide them:
      $\frac{dy}{dx} = \frac{\frac{dy}{dt}}{\frac{dx}{dt}} = \frac{9t^2 - 1}{2t}$.
    skills:
      - parametric-derivatives

  - id: q-param-deriv-quiz-3
    type: numericResponse
    title: Finding Horizontal Tangents
    prompt: |
      Find the $t$-value where the curve $x = 2t - t^2$, $y = t^2 - 4t + 3$ has a horizontal tangent.
    answer:
      value: 2
      tolerance: 0.000001
    explanation: |
      A horizontal tangent occurs where $\frac{dy}{dt} = 0$ (and $\frac{dx}{dt} \neq 0$).
      $\frac{dy}{dt} = 2t - 4$.
      Setting this to $0$ gives $2t = 4 \implies t = 2$.
      Check $\frac{dx}{dt} = 2 - 2t$. At $t=2$, $\frac{dx}{dt} = -2 \neq 0$.
      Thus, there is a horizontal tangent at $t = 2$.
    skills:
      - parametric-derivatives

  - id: q-param-deriv-quiz-4
    type: multipleChoice
    title: Second Derivative Formula
    prompt: |
      What is the correct formula for finding the second derivative $\frac{d^2y}{dx^2}$ of a parametric curve?
    choices:
      - id: c1
        text: '$\frac{\frac{d}{dt} \left( \frac{dy}{dx} \right)}{\frac{dx}{dt}}$'
      - id: c2
        text: '$\frac{y''''(t)}{x''''(t)}$'
      - id: c3
        text: '$\frac{\frac{d^2y}{dt^2}}{\frac{d^2x}{dt^2}}$'
      - id: c4
        text: '$\frac{d}{dt} \left( \frac{dy}{dx} \right)$'
    answer:
      choiceId: c1
    explanation: |
      The second derivative with respect to $x$ is the derivative of $\frac{dy}{dx}$ with respect to $x$. 
      Using the chain rule, $\frac{d}{dx} = \frac{1}{\frac{dx}{dt}} \frac{d}{dt}$.
      Thus, $\frac{d^2y}{dx^2} = \frac{\frac{d}{dt} \left( \frac{dy}{dx} \right)}{\frac{dx}{dt}}$. 
      It is *not* simply the quotient of the second derivatives with respect to $t$.
    skills:
      - parametric-derivatives
