skills:
- caa-encodings-error-correction
questions:
- id: q001
  title: Representation Contract
  type: multipleChoice
  prompt: What should you establish first in a encodings, checksums, and error correction problem?
  choices:
  - id: a
    text: Word width and interpretation
  - id: b
    text: Only the final decimal value
  - id: c
    text: Only the programming language brand
  - id: d
    text: The monitor refresh rate
  answer:
    choiceId: a
  explanation: Bit-level algorithms are representation-sensitive.
- id: q002
  title: Popcount Warmup
  type: numericResponse
  prompt: How many set bits are in `0b11001010`?
  answer:
    value: 4
    tolerance: 0
  explanation: There are four 1 bits.
- id: q003
  title: Mask Purpose
  type: multipleChoice
  prompt: Why do masks help low-level algorithms?
  choices:
  - id: a
    text: They select or protect specific bits.
  - id: b
    text: They remove all edge cases.
  - id: c
    text: They make values decimal.
  - id: d
    text: They disable overflow.
  answer:
    choiceId: a
  explanation: A mask marks the bits to keep, set, clear, toggle, or test.
- id: q004
  title: Boundary Pattern
  type: multipleChoice
  prompt: Which input often deserves special attention?
  choices:
  - id: a
    text: Zero
  - id: b
    text: A random ordinary input only
  - id: c
    text: A comment line
  - id: d
    text: A filename
  answer:
    choiceId: a
  explanation: Zero often breaks assumptions about set bits or division-like operations.
- id: q005
  title: Explain an invariant
  type: freeResponse
  prompt: In your own words, what is an invariant in a bit algorithm?
  answer:
    expected: It is the property that remains true after each transformation and explains why the algorithm is still computing the desired result.
    gradingMode: selfCheck
    keyPoints:
    - Property remains true
    - Transformation
    - Correctness
  explanation: Invariants turn tricks into understandable algorithms.
- id: q006
  title: Power-of-Two Check
  type: multipleChoice
  prompt: Why does a positive power of two have a special bit pattern?
  choices:
  - id: a
    text: It has exactly one set bit.
  - id: b
    text: It has no bits.
  - id: c
    text: It has every bit set.
  - id: d
    text: It must be odd.
  answer:
    choiceId: a
  explanation: Powers of two are single-bit masks.
- id: q007
  title: Low Mask
  type: numericResponse
  prompt: What is `(1 << 3) - 1` in decimal?
  answer:
    value: 7
    tolerance: 0
  explanation: Three low bits set gives binary `111`, which is 7.
- id: q008
  title: Edge Cases
  type: freeResponse
  prompt: Name two edge cases you would test for encodings, checksums, and error correction.
  answer:
    expected: Good answers include zero, all-ones values, exact powers of two, sign boundaries, maximum values, or maximum shift counts.
    gradingMode: selfCheck
    keyPoints:
    - Two valid edge cases
    - Relevant to bit-level arithmetic
  explanation: Edge cases depend on the operation, but these patterns recur across the category.
