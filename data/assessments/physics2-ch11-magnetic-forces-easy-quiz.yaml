- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: An electron is moving due east in a uniform magnetic field that points due north. What is the direction
    of the magnetic force on the electron?
  explanation: 'Solution:

    1) Use the right-hand rule for $\vec{v} \times \vec{B}$: fingers point East, curl toward North. Thumb points
    Upward.

    2) The electron has a negative charge, so flip the result to Downward.


    Why it works:

    The cross product $\vec{v} \times \vec{B}$ gives the direction for a positive charge. The negative sign of the
    electron''s charge reverses the force direction.

    Why the other choices fail: Upward forgets the negative charge. West or South would mean the force is not perpendicular
    to $\vec{B}$.'
  choices:
  - id: a
    text: Downward (into the ground)
  - id: b
    text: Upward (away from the ground)
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: West
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: South
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
- id: q002
  type: multipleChoice
  skills:
  - physics2-ch11-modeling
  prompt: When analyzing force on a charge in Magnetic Forces and Fields, which first step makes use of $F=qvB\\sin\\theta$
    physically meaningful?
  choices:
  - id: a
    text: Define the system, identify the relevant quantities and directions, then check the relation's assumptions.
  - id: b
    text: Substitute every listed number before deciding what quantity the equation represents.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Ignore units because the formula supplies the correct dimension automatically.
    issueSignals:
    - id: physics2-units-error
      domains:
      - physics-2
  - id: d
    text: Treat directed quantities as positive regardless of the selected convention.
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: Define the model before substituting values and then check units, direction, and the stated
    condition.


    Why it works: F=qvB\\sin\\theta relates defined physical quantities in the magnetic force on moving charge and
    current model; it is not a number-matching rule.


    Why the other choices fail: The alternatives skip model selection, dimensional analysis, or the sign convention
    that gives the result physical meaning.'
