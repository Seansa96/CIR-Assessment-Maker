questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: An electron is moving due east in a uniform magnetic field that points due north. What is the
    direction of the magnetic force on the electron?
  explanation: 'Solution:

    1) Use the right-hand rule for $\vec{v} \times \vec{B}$: fingers point East, curl toward North. Thumb
    points Upward.

    2) The electron has a negative charge, so flip the result to Downward.


    Why it works:

    The cross product $\vec{v} \times \vec{B}$ gives the direction for a positive charge. The negative
    sign of the electron''s charge reverses the force direction.

    Why the other choices fail: Upward forgets the negative charge. West or South would mean the force
    is not perpendicular to $\vec{B}$.'
  choices:
  - id: a
    text: Downward (into the ground)
  - id: b
    text: Upward (away from the ground)
  - id: c
    text: West
  - id: d
    text: South
  answer:
    choiceId: a
