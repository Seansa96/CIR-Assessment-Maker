- id: q-int-ht-1
  title: The Theorem of Pappus
  prompt: |-
    The Second Theorem of Pappus states that the volume of a solid of revolution generated by revolving a 2D region about an external axis is equal to the area of the region multiplied by what?
  type: multipleChoice
  choices:
  - id: c1
    text: The distance from the centroid to the axis of revolution.
  - id: c2
    text: The circumference of the circle traced by the centroid of the region.
  - id: c3
    text: The length of the boundary of the region.
  - id: c4
    text: The maximum distance from the axis of revolution.
  answer:
    choiceId: c2
  explanation: |-
    The Second Theorem of Pappus asserts that $V = A \cdot (2\pi \bar{r})$, where $A$ is the area of the region and $2\pi \bar{r}$ is the distance traveled by the centroid of the region during the revolution (the circumference of its path).
  skills:
  - geometric-intuition

- id: q-int-ht-2
  title: Slicing Non-Standard Solids
  prompt: |-
    A solid's base is the region bounded by $y = \sqrt{x}$, $y = 0$, and $x = 4$. Slices taken perpendicular to the x-axis are equilateral triangles. What is the area $A(x)$ of a single slice at position $x$?
  type: multipleChoice
  choices:
  - id: c1
    text: $A(x) = \frac{1}{2} x$
  - id: c2
    text: $A(x) = \frac{\sqrt{3}}{4} x$
  - id: c3
    text: $A(x) = x$
  - id: c4
    text: $A(x) = \frac{\sqrt{3}}{2} \sqrt{x}$
  answer:
    choiceId: c2
  explanation: |-
    The base of the triangle is the distance from $y=0$ to $y=\sqrt{x}$, so the side length $s = \sqrt{x}$. The area of an equilateral triangle is $\frac{\sqrt{3}}{4} s^2$. Substituting $s$, we get $A(x) = \frac{\sqrt{3}}{4} (\sqrt{x})^2 = \frac{\sqrt{3}}{4} x$.
  skills:
  - geometric-intuition

- id: q-int-ht-3
  title: Density on a Disk
  prompt: |-
    A flat circular disk of radius $R$ has a radial density function $\rho(r) = k r^2$. Which integral correctly sums the total mass of the disk by slicing it into concentric rings (annuli)?
  type: multipleChoice
  choices:
  - id: c1
    text: $\int_0^R k r^2 \,dr$
  - id: c2
    text: $\int_0^R k r^2 (\pi r^2) \,dr$
  - id: c3
    text: $\int_0^R k r^2 (2\pi r) \,dr$
  answer:
    choiceId: c3
  explanation: |-
    To find the mass using concentric rings, the area of a single thin ring of radius $r$ and thickness $dr$ is its circumference times its thickness: $dA = 2\pi r \,dr$. The small mass $dm$ is density times area: $dm = \rho(r) dA = (k r^2)(2\pi r \,dr)$. The total mass is the integral of this expression from $0$ to $R$.
  skills:
  - geometric-intuition
