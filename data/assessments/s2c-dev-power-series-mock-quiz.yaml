  blueprintId: calc2-power-series-radius-interval
  prompt: Find the radius of convergence for the series $\sum_{n=1}^{\infty} \frac{(x-2)^n}{n
    \cdot 3^n}$.
  answer:
    value: 3.0
    tolerance: 0.01
  explanation: 'Apply the Ratio Test: $\lim_{n\to\infty} |\frac{(x-2)^{n+1}}{(n+1)3^{n+1}}
    \frac{n3^n}{(x-2)^n}| = \frac{|x-2|}{3}$. For convergence, $\frac{|x-2|}{3} <
    1$, meaning $|x-2| < 3$. The radius is 3.'
- id: q002
