  blueprintId: calc2-power-series-radius-interval
  prompt: Find the radius of convergence for $\sum_{n=0}^{\infty} \frac{n!(x+1)^n}{2^n}$.
  answer:
    value: 0.0
    tolerance: 0.01
  explanation: 'Apply the Ratio Test: $\lim_{n\to\infty} \frac{(n+1)!|x+1|^{n+1}}{2^{n+1}}
    \frac{2^n}{n!|x+1|^n} = \lim_{n\to\infty} \frac{(n+1)|x+1|}{2}$. This goes to
    infinity for any $x \neq -1$, so radius is 0.'
