questions:
  - id: pt-trend-q01
    title: Effective Nuclear Charge
    type: multipleChoice
    prompt: |
      As you move from left to right across a period (row) on the periodic table, what happens to the effective nuclear charge ($Z_\text{eff}$) felt by the valence electrons, and why?
    choices:
      - id: a
        text: It increases, because the number of protons in the nucleus increases while the number of inner shielding electrons remains constant.
      - id: b
        text: It decreases, because the added electrons repel each other more strongly.
      - id: c
        text: It remains constant, because protons and electrons are added at the same rate.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** This is the key concept behind horizontal trends. Across a period, you add protons to the nucleus (increasing raw charge), but the new electrons are added to the *same* valence shell, so they don't shield each other very well. The net pull from the nucleus ($Z_\text{eff}$) gets stronger.

  - id: pt-trend-q02
    title: Atomic Radius Trend (Across a Period)
    type: multipleChoice
    prompt: |
      How does atomic radius change as you move from left to right across a period, and what is the primary reason?
    choices:
      - id: a
        text: It decreases, because the increasing effective nuclear charge pulls the valence electrons closer to the nucleus.
      - id: b
        text: It increases, because more electrons are added, taking up more space.
      - id: c
        text: It increases, because the mass of the atom is increasing.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Even though the atom is gaining mass and particles, it actually shrinks in volume. The stronger effective nuclear charge ($Z_\text{eff}$) acts like a stronger magnet, pulling the entire electron cloud tighter and closer.

  - id: pt-trend-q03
    title: Atomic Radius Trend (Down a Group)
    type: multipleChoice
    prompt: |
      How does atomic radius change as you move down a group (column) on the periodic table?
    choices:
      - id: a
        text: It increases, because each step down adds a new principal energy level (electron shell) further from the nucleus.
      - id: b
        text: It decreases, because the massive increase in protons pulls the electrons in very tightly.
      - id: c
        text: It remains roughly the same within a group.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Going down a group, $n$ increases (e.g., $2s \to 3s \to 4s$). Even though the nucleus gets much stronger, the inner electron shells provide massive "shielding", and the outermost electrons are physically located in larger, higher-energy orbitals.

  - id: pt-trend-q04
    title: First Ionization Energy Definition
    type: multipleChoice
    prompt: |
      What is the definition of "first ionization energy"?
    choices:
      - id: a
        text: The energy required to remove the most loosely held electron from a neutral atom in the gaseous state.
      - id: b
        text: The energy released when a neutral atom gains an electron.
      - id: c
        text: The energy required to remove all valence electrons from an atom.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Ionization energy is the energy cost to rip an electron away. It is always a positive value (endothermic). The "first" IE refers specifically to removing just one electron to form a $+1$ ion.

  - id: pt-trend-q05
    title: Ionization Energy Trend
    type: multipleChoice
    prompt: |
      Which element has a higher first ionization energy: Sodium (Na) or Chlorine (Cl)? Why?
    choices:
      - id: a
        text: Chlorine (Cl), because it has a higher effective nuclear charge and a smaller radius, holding its electrons much more tightly.
      - id: b
        text: Sodium (Na), because it wants to lose an electron to become stable.
      - id: c
        text: Sodium (Na), because it is a larger atom.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Do not anthropomorphize atoms ("wants to lose"). It's pure electrostatics: Chlorine's nucleus pulls much harder on its valence shell (higher $Z_\text{eff}$), making it physically much harder to rip an electron away. Hence, higher IE.

  - id: pt-trend-q06
    title: Electronegativity Definition
    type: multipleChoice
    prompt: |
      How does electronegativity differ from electron affinity?
    choices:
      - id: a
        text: Electronegativity is a relative measure of an atom's ability to attract shared electrons *within a chemical bond*. Electron affinity is the actual energy change when a free atom gains an electron.
      - id: b
        text: They are two names for the exact same physical property.
      - id: c
        text: Electronegativity applies only to metals, while electron affinity applies to nonmetals.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Electronegativity (usually on the Pauling scale of 0.7 to 4.0) only makes sense in the context of a molecule. It dictates who "wins the tug-of-war" for shared electrons in a bond.

  - id: pt-trend-q07
    title: Most Electronegative Element
    type: multipleChoice
    prompt: |
      Which element on the periodic table has the highest electronegativity?
    choices:
      - id: a
        text: Fluorine (F)
      - id: b
        text: Francium (Fr)
      - id: c
        text: Helium (He)
      - id: d
        text: Oxygen (O)
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Electronegativity increases up and to the right. Noble gases (like He) generally do not form bonds, so they are often excluded from the scale. Fluorine (top right of the halogens) is the undisputed king of electronegativity with a Pauling value of 4.0.

  - id: pt-trend-q08
    title: Successive Ionization Energies
    type: multipleChoice
    prompt: |
      Consider the successive ionization energies for Magnesium: 
      1st IE = $738\text{ kJ/mol}$
      2nd IE = $1451\text{ kJ/mol}$
      3rd IE = $7733\text{ kJ/mol}$
      Why is there such a massive jump between the 2nd and 3rd ionization energies?
    choices:
      - id: a
        text: The 3rd electron must be removed from a stable, inner-core noble gas configuration, which requires vastly more energy.
      - id: b
        text: The atom becomes completely unstable and breaks apart.
      - id: c
        text: The 3rd electron is located closer to the nucleus because it is in a d-orbital.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Mg is in Group 2, so it has 2 valence electrons. Removing them (1st and 2nd IE) is relatively easy. Once removed, Mg is $\text{Mg}^{2+}$ and has the electron configuration of Neon. Trying to remove a 3rd electron means breaking into this tightly-held, complete core shell, causing a huge energy spike.

  - id: pt-trend-q09
    title: Cation vs Anion Size
    type: multipleChoice
    prompt: |
      Rank the following species in order of increasing size (smallest to largest radius): $\text{O}$, $\text{O}^{2-}$, $\text{F}^-$. (Note: $\text{O}^{2-}$ and $\text{F}^-}$ are isoelectronic, both having 10 electrons).
    choices:
      - id: a
        text: $\text{O} < \text{F}^- < \text{O}^{2-}$
      - id: b
        text: $\text{O}^{2-} < \text{F}^- < \text{O}$
      - id: c
        text: $\text{F}^- < \text{O} < \text{O}^{2-}$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** 
      1. Neutral O is smallest because anions are always larger than their parent atoms (due to increased electron-electron repulsion pushing the cloud outward).
      2. Between $\text{F}^-}$ (9 protons, 10 e-) and $\text{O}^{2-}$ (8 protons, 10 e-), Fluorine has more protons. Its stronger nucleus pulls the same 10 electrons in tighter. Thus, $\text{F}^-$ is smaller than $\text{O}^{2-}$.

  - id: pt-trend-q10
    title: Reactivity of Metals
    type: multipleChoice
    prompt: |
      For the alkali metals (Group 1), why does chemical reactivity increase as you move down the group (e.g., Potassium is more reactive in water than Sodium)?
    choices:
      - id: a
        text: The valence electron is further from the nucleus and more shielded, making it easier to lose (lower ionization energy).
      - id: b
        text: The atoms become smaller and more compact, making them more energetic.
      - id: c
        text: The electronegativity increases down the group.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Metals react by losing electrons. The easier it is to lose an electron, the more reactive the metal is. Because atomic radius increases and ionization energy decreases down a group, Francium is vastly more reactive than Lithium.
