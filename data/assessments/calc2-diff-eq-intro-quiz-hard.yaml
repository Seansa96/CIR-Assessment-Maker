title: Modeling Differential Equations Quiz — Hard
assessmentType: quiz
categoryId: calculus-2
topicId: diff-eq-intro-modeling
modeDefault: practice
randomizeQuestions: true
skills: [verify differential-equation solutions, construct models, interpret equilibrium behavior]
navigation:
  learningGoal: practice
