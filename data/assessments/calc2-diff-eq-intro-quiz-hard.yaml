  tags: [calculus-2, differential-equations, modeling]
questions:
- id: q001
  type: symbolicResponse
  skills: [verify differential-equation solutions]
  prompt: For $y=Ce^{x^2/2}$, enter $y'$ in terms of $C$ and $x$.
  answer: { expectedLatex: 'C*x*e^(x^2/2)', equivalenceMode: expression, tolerance: 0.000001, variables: [C, x], explanation: Apply the chain rule to the exponent $x^2/2$. }
- id: q002
  type: numericResponse
  skills: [interpret equilibrium behavior]
  prompt: For $y'=y(10-y)$, evaluate $y'$ when $y=4$.
  answer: { value: 24, tolerance: 0.001 }
  explanation: 'Substitute $y=4$: $4(10-4)=24$.'
- id: q003
  type: symbolicResponse
  skills: [construct models]
  prompt: A quantity decreases at a rate proportional to its current amount. Enter its differential equation using positive constant $r$.
  answer: { expectedLatex: '-r*y', equivalenceMode: expression, tolerance: 0.000001, variables: [r, y], explanation: Decrease supplies the negative sign. }
- id: q004
  type: numericResponse
  skills: [interpret slope fields]
  prompt: A solution of $y'=x^2-y$ passes through $(2,5)$. What is its initial slope?
  answer: { value: -1, tolerance: 0.001 }
  explanation: $2^2-5=-1$.
- id: q005
  type: numericResponse
  skills: [classify differential equations]
  prompt: What is the order of $(y'')^2+y'=x$?
  answer: { value: 2, tolerance: 0.001 }
  explanation: The highest derivative is $y''$; its exponent does not change order.
