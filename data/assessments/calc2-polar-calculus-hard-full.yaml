questions:
- id: q-c74f72
  type: numericResponse
  title: Area Between Curves (1)
  prompt: Find the area of one petal of $r = 3\sin(3\theta)$.
  answer:
    value: 2.3561944875000003
    tolerance: 0.05
  explanation: One petal goes from $\theta=0$ to $\pi/3$. Area is $\frac{1}{2} \int_0^{\pi/3}
    9\sin^2(3\theta) d\theta$. Evaluating gives $\frac{9\pi}{12}$.
  skills:
  - polar-calculus
- id: q-95d76d
  type: multipleChoice
  title: Tangent to Polar (2)
  prompt: Which formula gives the slope of the tangent line $\frac{dy}{dx}$ to a polar
    curve $r = f(\theta)$?
  choices:
  - id: c1
    text: $\frac{{f'(\theta)\sin\theta + f(\theta)\cos\theta}}{{f'(\theta)\cos\theta
      - f(\theta)\sin\theta}}$
  - id: c2
    text: $\frac{{f'(\theta)\cos\theta - f(\theta)\sin\theta}}{{f'(\theta)\sin\theta
      + f(\theta)\cos\theta}}$
  - id: c3
    text: $\frac{{f'(\theta)}}{{f(\theta)}}$
  - id: c4
    text: $\frac{{r\cos\theta}}{{r\sin\theta}}$
  answer:
    choiceId: c1
  explanation: Using $y = r\sin\theta$ and $x = r\cos\theta$, the chain rule gives
    $\frac{dy/d\theta}{dx/d\theta}$.
  skills:
  - polar-calculus
