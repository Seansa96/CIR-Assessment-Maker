questions:
- sourceFamilyId: cpp-fsf-string-001
  skills:
  - reverse-string-content
  type: multipleChoice
  prompt: |-
    Which standard-library call reverses every byte in a mutable `std::string text`?
  choices:
  - id: a
    text: '`std::reverse(text.begin(), text.end());`'
  - id: b
    text: '`std::sort(text.begin(), text.end());`'
  - id: c
    text: '`text.erase(text.begin());`'
  - id: d
    text: '`std::rotate(text.begin(), text.end(), text.begin());`'
  answer:
    choiceId: a
  explanation: |-
    `std::reverse` operates on the complete half-open range and runs in linear time.
  id: q001
- sourceFamilyId: cpp-fsf-string-002
  skills:
  - transform-ascii-letters
  type: multipleChoice
  prompt: |-
    The successor transform must preserve case and wrap alphabet endpoints. What should `Zaz-9` become?
  choices:
  - id: a
    text: '`Aba-9`'
  - id: b
    text: '`[b{-9`'
  - id: c
    text: '`Aba-0`'
  - id: d
    text: '`Zba-9`'
  answer:
    choiceId: a
  explanation: |-
    `Z` wraps to `A`, `a` advances to `b`, `z` wraps to `a`, and nonletters remain unchanged.
  id: q002
- sourceFamilyId: cpp-fsf-string-005
  skills:
  - sort-string-characters
  type: multipleChoice
  prompt: |-
    Given the lowercase-only contract, what does sorting `baba` with `std::sort` produce?
  choices:
  - id: a
    text: '`abab`'
  - id: b
    text: '`aabb`'
  - id: c
    text: '`bbaa`'
  - id: d
    text: '`baba`'
  answer:
    choiceId: b
  explanation: |-
    Lowercase ASCII byte order is alphabetic, so both `a` values precede both `b` values.
  id: q003
- sourceFamilyId: cpp-fsf-string-006
  skills:
  - scan-fixed-distance-patterns
  type: multipleChoice
  prompt: |-
    If exactly two characters must occur between `e` and `g`, what index offset should the scan compare?
  choices:
  - id: a
    text: '1'
  - id: b
    text: '2'
  - id: c
    text: '3'
  - id: d
    text: '4'
  answer:
    choiceId: c
  explanation: |-
    Positions `i` and `i + 3` have two intervening positions.
  id: q004
- sourceFamilyId: cpp-fsf-string-007
  skills:
  - count-vowels
  type: multipleChoice
  prompt: |-
    Under a case-insensitive `a e i o u` policy, how many vowels are in `USA rhythm`?
  choices:
  - id: a
    text: '2'
  - id: b
    text: '3'
  - id: c
    text: '4'
  - id: d
    text: '5'
  answer:
    choiceId: b
  explanation: |-
    `U` and `A` are vowels and `rhythm` contributes none because `y` is excluded.
  id: q005
- sourceFamilyId: cpp-fsf-string-008
  skills:
  - count-whitespace-delimited-words
  type: multipleChoice
  prompt: |-
    Which event should increment a maximal-nonwhitespace word counter?
  choices:
  - id: a
    text: Every whitespace byte
  - id: b
    text: Every nonwhitespace byte
  - id: c
    text: A transition from whitespace to nonwhitespace
  - id: d
    text: A transition from nonwhitespace to whitespace only
  answer:
    choiceId: c
  explanation: |-
    Counting entry transitions handles leading, trailing, and repeated whitespace without empty tokens.
  id: q006
- sourceFamilyId: cpp-fsf-string-009
  skills:
  - compare-character-frequencies
  type: multipleChoice
  prompt: |-
    What should `equal_occurrences("xyz", 'a', 'b')` return?
  choices:
  - id: a
    text: false, because neither appears
  - id: b
    text: true, because both counts are zero
  - id: c
    text: false, because the string is nonempty
  - id: d
    text: The result is undefined
  answer:
    choiceId: b
  explanation: |-
    The contract compares counts, and zero equals zero.
  id: q007
- sourceFamilyId: cpp-fsf-string-010
  skills:
  - recognize-palindromes
  type: multipleChoice
  prompt: |-
    With exact case-sensitive comparison, which input is a palindrome?
  choices:
  - id: a
    text: '`Madam`'
  - id: b
    text: '`race car`'
  - id: c
    text: '`level`'
  - id: d
    text: '`abca`'
  answer:
    choiceId: c
  explanation: |-
    `level` matches at every symmetric pair; case and spaces invalidate the other near-palindromes.
  id: q008
- sourceFamilyId: cpp-fsf-string-013
  skills:
  - toggle-letter-case
  type: multipleChoice
  prompt: |-
    Why should case toggling use `if ... else if` rather than two independent case tests?
  choices:
  - id: a
    text: To sort letters first
  - id: b
    text: To avoid converting a letter and immediately converting it back
  - id: c
    text: To remove punctuation
  - id: d
    text: To allocate the output
  answer:
    choiceId: b
  explanation: |-
    After a lowercase letter is uppercased, a second independent uppercase test could undo the change.
  id: q009
- sourceFamilyId: cpp-fsf-string-021
  skills:
  - recognize-subsequences
  type: selectAll
  prompt: |-
    Which strings are subsequences of `apple`? Select all that apply.
  choices:
  - id: a
    text: '`apl`'
  - id: b
    text: '`ppe`'
  - id: c
    text: '`ale`'
  - id: d
    text: '`pae`'
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: |-
    The first three preserve left-to-right order; `pae` asks for `a` after the initial `p`, which is impossible.
  id: q010
- sourceFamilyId: cpp-fsf-string-022
  skills:
  - filter-special-characters
  type: multipleChoice
  prompt: |-
    Which positive predicate implements “keep letters, digits, and whitespace”?
  choices:
  - id: a
    text: '`isalnum(u) || isspace(u)`'
  - id: b
    text: '`ispunct(u)`'
  - id: c
    text: '`isalpha(u) && isdigit(u)`'
  - id: d
    text: '`!isspace(u)`'
  answer:
    choiceId: a
  explanation: |-
    A byte is retained when it belongs to either the alphanumeric or whitespace category.
  id: q011
- sourceFamilyId: cpp-fsf-string-025
  skills:
  - find-longest-run
  type: multipleChoice
  prompt: |-
    Where should a longest-ones scan update its maximum so a run ending at the last byte is counted?
  choices:
  - id: a
    text: Only when a zero is read
  - id: b
    text: Whenever a one extends the current run
  - id: c
    text: Only after the loop if input ends in zero
  - id: d
    text: Before resetting the input
  answer:
    choiceId: b
  explanation: |-
    Updating at each extension records terminal runs without a special flush.
  id: q012
- sourceFamilyId: cpp-fsf-string-030
  skills:
  - detect-missing-sequence-letter
  type: multipleChoice
  prompt: |-
    Under the one-gap precondition, what does `missing_lowercase_letter("abdef")` return?
  choices:
  - id: a
    text: '`b`'
  - id: b
    text: '`c`'
  - id: c
    text: '`d`'
  - id: d
    text: no value
  answer:
    choiceId: b
  explanation: |-
    The first failed successor relation is `b` followed by `d`, so `c` is missing.
  id: q013
- sourceFamilyId: cpp-fsf-string-036
  skills:
  - detect-adjacent-equality
  type: multipleChoice
  prompt: |-
    Why is a frequency table the wrong primary structure for detecting adjacent identical letters?
  choices:
  - id: a
    text: It cannot count letters
  - id: b
    text: It discards occurrence positions and adjacency
  - id: c
    text: It is always exponential
  - id: d
    text: It changes character case
  answer:
    choiceId: b
  explanation: |-
    A letter may repeat far apart; adjacency requires comparing neighboring positions.
  id: q014
- sourceFamilyId: cpp-fsf-string-037
  skills:
  - count-specific-characters
  type: multipleChoice
  prompt: |-
    What is the result of counting lowercase `'a'` in `"Aa a"` under an exact case-sensitive contract?
  choices:
  - id: a
    text: '1'
  - id: b
    text: '2'
  - id: c
    text: '3'
  - id: d
    text: '4'
  answer:
    choiceId: b
  explanation: |-
    The lowercase target occurs at indices 1 and 3; uppercase `A` is different.
  id: q015
