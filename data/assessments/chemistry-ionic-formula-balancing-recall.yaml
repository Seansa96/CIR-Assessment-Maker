items:
- id: formula-sodium-chloride
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by sodium (Na+) and chloride (Cl-)?'
  answer:
    expected: NaCl
  explanation: 'Since Na has a 1+ charge and Cl has a 1- charge, they balance in a 1:1 ratio.'
- id: formula-magnesium-chloride
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by magnesium (Mg2+) and chloride (Cl-)?'
  answer:
    expected: MgCl2
  explanation: 'Magnesium has a 2+ charge, so two chloride ions (1-) are needed to balance it.'
- id: formula-aluminum-chloride
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by aluminum (Al3+) and chloride (Cl-)?'
  answer:
    expected: AlCl3
  explanation: 'Aluminum has a 3+ charge, so three chloride ions (1-) are needed to balance it.'
- id: formula-sodium-oxide
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by sodium (Na+) and oxide (O2-)?'
  answer:
    expected: Na2O
  explanation: 'Oxide has a 2- charge, so two sodium ions (1+) are needed to balance it.'
- id: formula-magnesium-oxide
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by magnesium (Mg2+) and oxide (O2-)?'
  answer:
    expected: MgO
  explanation: 'Mg2+ and O2- have equal but opposite charges, so they balance in a 1:1 ratio.'
- id: formula-aluminum-oxide
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by aluminum (Al3+) and oxide (O2-)?'
  answer:
    expected: Al2O3
  explanation: 'The lowest common multiple of 3 and 2 is 6. Two Al3+ give 6+, and three O2- give 6-.'
- id: formula-calcium-nitride
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by calcium (Ca2+) and nitride (N3-)?'
  answer:
    expected: Ca3N2
  explanation: 'The lowest common multiple of 2 and 3 is 6. Three Ca2+ give 6+, and two N3- give 6-.'
- id: formula-potassium-sulfide
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by potassium (K+) and sulfide (S2-)?'
  answer:
    expected: K2S
  explanation: 'Sulfide has a 2- charge, so two potassium ions (1+) are needed.'
- id: formula-aluminum-nitride
  type: typed
  prompt: 'What is the correct chemical formula for the ionic compound formed by aluminum (Al3+) and nitride (N3-)?'
  answer:
    expected: AlN
  explanation: 'Al3+ and N3- have equal but opposite charges, so they balance in a 1:1 ratio.'
- id: formula-overall-charge
  type: cloze
  prompt: "Complete:\n\nIn a valid ionic compound formula, the total positive charge and total negative charge must balance to equal ____."
  answer:
    expected: "zero"
    aliases:
    - "0"
  explanation: "Ionic compounds are electrically neutral overall."
