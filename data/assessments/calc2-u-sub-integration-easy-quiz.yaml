title: U-Substitution Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: u-sub-integration
skills: [recognize-composite-structure, choose-substitution, transform-differentials, change-definite-bounds]
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags: [calculus-2, u-sub-integration, easy]
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
authoring:
  visualRequirement: notApplicable
  visualRationale: The assessment checks notation and routine symbolic transformations, for which a diagram does not materially improve the task.
  difficultyTier: easy
questions:
- id: q001
  type: multipleChoice
  prompt: 'For $\int 4x\cos(2x^2)\,dx$, choose u.'
  choices: [{ id: a, text: '$u=2x^2$' }, { id: b, text: '$u=4x$' }, { id: c, text: '$u=\cos(2x^2)$' }, { id: d, text: '$u=x$' }]
  answer: { choiceId: a }
  explanation: The inner expression is $2x^2$, whose derivative is $4x$.
- id: q002
  type: multipleChoice
  prompt: 'If $u=x^3-5$, which differential is correct?'
  choices: [{ id: a, text: '$du=x^2\,dx$' }, { id: b, text: '$du=3x^2\,dx$' }, { id: c, text: '$du=3x\,dx$' }, { id: d, text: '$du=dx-5$' }]
  answer: { choiceId: b }
  explanation: Differentiate $x^3-5$.
- id: q003
  type: multipleChoice
  prompt: 'What does $\int 2x(x^2+1)^3\,dx$ become when $u=x^2+1$?'
  choices: [{ id: a, text: '$\int u^3\,du$' }, { id: b, text: '$\int 2u^3\,du$' }, { id: c, text: '$\int xu^3\,du$' }, { id: d, text: '$\int u^2\,du$' }]
  answer: { choiceId: a }
  explanation: Here $du=2x\,dx$ exactly.
- id: q004
  type: multipleChoice
  prompt: 'Evaluate $\int 2x e^{x^2}\,dx$.'
  choices: [{ id: a, text: '$e^{x^2}+C$' }, { id: b, text: '$2e^{x^2}+C$' }, { id: c, text: '$xe^{x^2}+C$' }, { id: d, text: '$e^x+C$' }]
  answer: { choiceId: a }
  explanation: Let $u=x^2$.
- id: q005
  type: multipleChoice
  prompt: 'For $\int \cos(5x)\,dx$, what constant factor accompanies $u=5x$?'
  choices: [{ id: a, text: '$1/5$' }, { id: b, text: '$5$' }, { id: c, text: '$1/25$' }, { id: d, text: '$0$' }]
  answer: { choiceId: a }
  explanation: $du=5\,dx$, so $dx=du/5$.
- id: q006
  type: multipleChoice
  prompt: 'With $u=x^2$, what u-bounds replace $x=1$ and $x=3$?'
  choices: [{ id: a, text: '$1$ to $3$' }, { id: b, text: '$0$ to $9$' }, { id: c, text: '$1$ to $9$' }, { id: d, text: '$2$ to $6$' }]
  answer: { choiceId: c }
  explanation: Substitute each original endpoint into $u=x^2$.
- id: q007
  type: multipleChoice
  prompt: 'Which integral is best suited to immediate u-substitution?'
  choices: [{ id: a, text: '$\int xe^x\,dx$' }, { id: b, text: '$\int 3x^2\sqrt{x^3+1}\,dx$' }, { id: c, text: '$\int \ln x\,dx$' }, { id: d, text: '$\int x\sin x\,dx$' }]
  answer: { choiceId: b }
  explanation: The derivative of $x^3+1$ is $3x^2$.
- id: q008
  type: multipleChoice
  prompt: 'After integrating in u for an indefinite integral, what must you do?'
  choices: [{ id: a, text: 'Replace u with the original x-expression and add C.' }, { id: b, text: 'Keep u in the final answer.' }, { id: c, text: 'Change x-bounds.' }, { id: d, text: 'Differentiate u again.' }]
  answer: { choiceId: a }
  explanation: An indefinite antiderivative must be written in the original variable.
- id: q009
  type: multipleChoice
  prompt: 'Evaluate $\int \frac{1}{x+2}\,dx$ using $u=x+2$.'
  choices: [{ id: a, text: '$\ln|x+2|+C$' }, { id: b, text: '$1/(x+2)+C$' }, { id: c, text: '$\ln|x|+2+C$' }, { id: d, text: '$x+2+C$' }]
  answer: { choiceId: a }
  explanation: The transformed integral is $\int du/u$.
- id: q010
  type: multipleChoice
  prompt: 'Which derivative checks $\frac13\sin(3x)+C$?'
  choices: [{ id: a, text: '$\cos(3x)$' }, { id: b, text: '$\sin(3x)$' }, { id: c, text: '$3\cos x$' }, { id: d, text: '$\frac13\cos x$' }]
  answer: { choiceId: a }
  explanation: Chain rule multiplies by 3 and cancels the one-third.
