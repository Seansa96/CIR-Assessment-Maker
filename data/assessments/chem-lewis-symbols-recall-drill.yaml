items:
- id: r001
  type: typed
  prompt: Define valence electron and name the representation in which it is used.
  answer:
    expected: An electron in the occupied outer shell that can participate in bonding or ion formation.
    aliases:
    - valence electron
  explanation: 'Solution: An electron in the occupied outer shell that can participate in bonding or ion formation. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r002
  type: typed
  prompt: What does Lewis symbol tell you to count or distinguish?
  answer:
    expected: An element symbol surrounded by dots that represent its valence electrons.
    aliases:
    - Lewis symbol
  explanation: 'Solution: An element symbol surrounded by dots that represent its valence electrons. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r003
  type: typed
  prompt: State one condition that must be checked when using octet rule.
  answer:
    expected: The useful main-group pattern in which atoms gain, lose, or share electrons to approach eight valence electrons.
    aliases:
    - octet rule
  explanation: 'Solution: The useful main-group pattern in which atoms gain, lose, or share electrons to approach eight valence
    electrons. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r004
  type: typed
  prompt: Connect electron pair to an observable or particle-level consequence.
  answer:
    expected: Two electrons occupying one Lewis-symbol side or one localized bonding or lone-pair region.
    aliases:
    - electron pair
  explanation: 'Solution: Two electrons occupying one Lewis-symbol side or one localized bonding or lone-pair region. Why
    it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r005
  type: typed
  prompt: Define unpaired electron and name the representation in which it is used.
  answer:
    expected: A valence electron shown alone on one side of a Lewis symbol.
    aliases:
    - unpaired electron
  explanation: 'Solution: A valence electron shown alone on one side of a Lewis symbol. Why it works: The definition identifies
    the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r006
  type: typed
  prompt: What does lone pair tell you to count or distinguish?
  answer:
    expected: A localized pair of valence electrons not shared between two atoms.
    aliases:
    - lone pair
  explanation: 'Solution: A localized pair of valence electrons not shared between two atoms. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r007
  type: typed
  prompt: State one condition that must be checked when using bonding pair.
  answer:
    expected: A pair of electrons shared between two bonded atoms.
    aliases:
    - bonding pair
  explanation: 'Solution: A pair of electrons shared between two bonded atoms. Why it works: The definition identifies the
    exact model feature needed before applying a rule or drawing a conclusion.'
- id: r008
  type: typed
  prompt: Connect main-group element to an observable or particle-level consequence.
  answer:
    expected: An element in the s or p blocks for which group position commonly predicts valence-electron count.
    aliases:
    - main-group element
  explanation: 'Solution: An element in the s or p blocks for which group position commonly predicts valence-electron count.
    Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r009
  type: typed
  prompt: Define noble-gas configuration and name the representation in which it is used.
  answer:
    expected: A filled main-group valence shell matching the electron count of a nearby noble gas.
    aliases:
    - noble-gas configuration
  explanation: 'Solution: A filled main-group valence shell matching the electron count of a nearby noble gas. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r010
  type: typed
  prompt: What does Lewis ion symbol tell you to count or distinguish?
  answer:
    expected: A bracketed Lewis symbol with the ion charge written outside the brackets.
    aliases:
    - Lewis ion symbol
  explanation: 'Solution: A bracketed Lewis symbol with the ion charge written outside the brackets. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r011
  type: typed
  prompt: State one condition that must be checked when using cation.
  answer:
    expected: A positively charged species formed when the number of electrons is less than the number of protons.
    aliases:
    - cation
  explanation: 'Solution: A positively charged species formed when the number of electrons is less than the number of protons.
    Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r012
  type: typed
  prompt: Connect anion to an observable or particle-level consequence.
  answer:
    expected: A negatively charged species formed when the number of electrons exceeds the number of protons.
    aliases:
    - anion
  explanation: 'Solution: A negatively charged species formed when the number of electrons exceeds the number of protons.
    Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
