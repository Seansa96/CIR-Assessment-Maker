schemaVersion: 1
id: chem-molecular-shapes-vsepr-test
title: VSEPR and Molecular Geometry Test
assessmentType: test
categoryId: chemistry
topicId: chem-molecular-shapes
modeDefault: exam
randomizeQuestions: true
attemptQuestionCount: 12
navigation: { learningGoal: evaluate, activityType: formalTest, tags: [chemistry, chem-molecular-shapes, test] }
authoring: { visualRequirement: required, visualRationale: 'Transfer items require spatial interpretation across multiple geometry families.', difficultyTier: mixed, sourceId: src-20260720035703-91ea51b0d8 }
questions:
  - id: q001
    type: multipleChoice
    prompt: 'The central nitrogen in $NO_2^-$ has two N-O directions and one lone pair. Which complete classification is correct?'
    choices: [{ id: a, text: 'AX2E; trigonal-planar electron geometry; bent molecular geometry', issueSignals: [] }, { id: b, text: 'AX2; linear electron and molecular geometry', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: c, text: 'AX3; trigonal-planar molecular geometry', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Choose AX$_2$E, trigonal-planar electron geometry, and bent molecular geometry. Why it works: Two bond directions plus one lone pair give three domains and two atom positions. Why the other choices fail: b omits the lone pair; c counts the lone pair as a bonded atom.'
    difficultyDimensions: [LewisEnvironment, AXEClassification, dualGeometryNaming]
    difficultyEvidence: 'Coordinates local inventory, notation, and two geometry labels.'
    prerequisiteObjectiveIds: [chem-vsepr-count-domains]
    extensionObjectiveIds: [chem-vsepr-refine-angles]
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q002
    type: selectAll
    prompt: 'Select every molecule whose central atom has tetrahedral electron geometry but a non-tetrahedral molecular geometry.'
    choices: [{ id: a, text: '$NH_3$', issueSignals: [] }, { id: b, text: '$H_2O$', issueSignals: [] }, { id: c, text: '$CH_4$', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: d, text: '$BF_3$', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceIds: [a, b] }
    explanation: 'Solution: Select $NH_3$ and $H_2O$. Why it works: Both have four total domains and at least one lone pair, changing the atoms-only name. Why the other choices fail: $CH_4$ remains tetrahedral molecularly; $BF_3$ has three domains.'
    difficultyDimensions: [multiAnswerClassification, lonePairInventory, geometryComparison]
    difficultyEvidence: 'Filters four molecules using both domain and molecular labels.'
    prerequisiteObjectiveIds: [chem-vsepr-distinguish-geometries]
    extensionObjectiveIds: [chem-vsepr-refine-angles]
    issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }, { id: chemistry-vsepr-domain-count-error }]
  - id: q003
    type: multipleChoice
    prompt: '$SF_4$ is AX$_4$E. Which lone-pair placement and molecular geometry are expected?'
    media: [{ type: image, src: /media/chemistry/vsepr-five-domain-family.svg, alt: Five-domain family with axial and equatorial positions., caption: Minimize 90-degree lone-pair interactions first. }]
    choices: [{ id: a, text: 'Equatorial lone pair; seesaw', issueSignals: [] }, { id: b, text: 'Axial lone pair; square planar', issueSignals: [{ id: chemistry-vsepr-lone-pair-position-error }] }, { id: c, text: 'Equatorial lone pair; T-shaped', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }]
    answer: { choiceId: a }
    explanation: 'Solution: The lone pair is equatorial and the atoms form a seesaw. Why it works: Equatorial placement minimizes close interactions, leaving two axial and two equatorial atoms. Why the other choices fail: b uses unfavorable placement and a six-domain shape; c is AX$_3$E$_2$.'
    difficultyDimensions: [AXEInterpretation, positionalOptimization, shapeDerivation]
    difficultyEvidence: 'Uses an unfamiliar five-domain occupancy to derive shape.'
    prerequisiteObjectiveIds: [chem-vsepr-position-five-six]
    extensionObjectiveIds: [chem-vsepr-refine-angles]
    issueSignals: [{ id: chemistry-vsepr-lone-pair-position-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q004
    type: multipleChoice
    prompt: '$BrF_5$ has five Br-F bonds and one bromine lone pair. Which pair is correct?'
    media: [{ type: image, src: /media/chemistry/vsepr-six-domain-family.svg, alt: Six-domain family including square-pyramidal and square-planar shapes., caption: Remove one atom position for the lone pair. }]
    choices: [{ id: a, text: 'Octahedral electron geometry; square-pyramidal molecular geometry', issueSignals: [] }, { id: b, text: 'Trigonal-bipyramidal electron geometry; seesaw molecular geometry', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: c, text: 'Octahedral electron geometry; square-planar molecular geometry', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Octahedral and square pyramidal. Why it works: Six total domains include five atom sites and one omitted lone-pair site. Why the other choices fail: b counts only five domains; c removes two atom positions instead of one.'
    difficultyDimensions: [domainTotal, sixDomainFamily, atomsOnlyNaming]
    difficultyEvidence: 'Distinguishes adjacent members of the octahedral family.'
    prerequisiteObjectiveIds: [chem-vsepr-position-five-six]
    extensionObjectiveIds: [chem-vsepr-local-centers]
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q005
    type: numericResponse
    prompt: 'A selected center has three bonding domains and two lone-pair domains. How many total electron domains must be placed before naming its molecular geometry?'
    answer: { value: 5, tolerance: 0 }
    explanation: 'Solution: $3+2=5$ domains. Why it works: Electron geometry counts both bonded directions and central lone pairs before any positions are omitted.'
    difficultyDimensions: [inventoryTranslation, domainArithmetic, workflowOrdering]
    difficultyEvidence: 'Extracts and combines domain types before classification.'
    prerequisiteObjectiveIds: [chem-vsepr-count-domains]
    extensionObjectiveIds: [chem-vsepr-position-five-six]
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }]
  - id: q006
    type: multipleChoice
    prompt: 'In trigonal-bipyramidal $PCl_5$, which ideal angle occurs between two different equatorial bonds?'
    choices: [{ id: a, text: '90 degrees', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }, { id: b, text: '109.5 degrees', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }, { id: c, text: '120 degrees', issueSignals: [] }, { id: d, text: '180 degrees only', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }]
    answer: { choiceId: c }
    explanation: 'Solution: Two equatorial bonds are ideally 120 degrees apart. Why it works: Three equatorial directions divide a plane evenly. Why the other choices fail: 90 degrees is axial-equatorial; 109.5 belongs to tetrahedral; 180 degrees is axial-axial.'
    difficultyDimensions: [positionIdentification, angleSelection, geometryFamily]
    difficultyEvidence: 'Selects one of several angle types within a nonuniform geometry.'
    prerequisiteObjectiveIds: [chem-vsepr-position-five-six]
    extensionObjectiveIds: [chem-vsepr-refine-angles]
    issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }]
  - id: q007
    type: multipleChoice
    prompt: 'A trigonal-planar center has one double-bond domain and two single-bond domains. Which angle trend is most defensible?'
    choices: [{ id: a, text: 'The angle between the single bonds is somewhat less than 120 degrees.', issueSignals: [] }, { id: b, text: 'Every angle must remain exactly 120 degrees.', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }, { id: c, text: 'The center becomes tetrahedral because a double bond counts twice.', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Predict the single-bond angle to be somewhat less than 120 degrees. Why it works: The denser multiple-bond domain expands adjacent angles. Why the other choices fail: b ignores unequal repulsion; c miscounts bond order as spatial directions.'
    difficultyDimensions: [idealReference, unequalDomainRepulsion, qualitativePrediction]
    difficultyEvidence: 'Refines an ideal geometry without inventing an exact value.'
    prerequisiteObjectiveIds: [chem-vsepr-refine-angles]
    extensionObjectiveIds: [chem-vsepr-local-centers]
    issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }, { id: chemistry-vsepr-domain-count-error }]
  - id: q008
    type: selectAll
    prompt: 'For an octahedral AX$_4$E$_2$ center, select every correct statement.'
    choices: [{ id: a, text: 'The lone pairs minimize repulsion by occupying opposite sites.', issueSignals: [] }, { id: b, text: 'The molecular geometry is square planar.', issueSignals: [] }, { id: c, text: 'The electron-domain geometry is square planar.', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: d, text: 'The four atom positions include 90- and 180-degree angles.', issueSignals: [] }]
    answer: { choiceIds: [a, b, d] }
    explanation: 'Solution: Select a, b, and d. Why it works: Opposite lone pairs leave a square of atoms with adjacent and opposite relations. Why the other choices fail: c substitutes the molecular name for the six-domain electron geometry.'
    difficultyDimensions: [multiConditionReasoning, lonePairSeparation, angleTopology]
    difficultyEvidence: 'Coordinates position, naming, and angle evidence.'
    prerequisiteObjectiveIds: [chem-vsepr-position-five-six]
    extensionObjectiveIds: [chem-vsepr-local-centers]
    issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }]
  - id: q009
    type: multipleChoice
    prompt: 'In formaldehyde, $H_2C=O$, what geometry and angle description best applies at carbon?'
    choices: [{ id: a, text: 'Trigonal planar; near 120 degrees with possible distortion', issueSignals: [] }, { id: b, text: 'Tetrahedral; exactly 109.5 degrees because carbon forms four bond lines', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: c, text: 'Linear; 180 degrees because C=O is a double bond', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Carbon is trigonal planar with angles near 120 degrees. Why it works: Two C-H directions and one C=O direction give three domains; the unequal double-bond domain can distort the ideal. Why the other choices fail: b counts bond lines instead of directions; c lets bond order force the wrong family.'
    difficultyDimensions: [structuralParsing, multipleBondCounting, precisionJudgment]
    difficultyEvidence: 'Converts a condensed structure into geometry and qualified angle language.'
    prerequisiteObjectiveIds: [chem-vsepr-count-domains]
    extensionObjectiveIds: [chem-vsepr-refine-angles]
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }]
  - id: q010
    type: multipleChoice
    prompt: 'Which statement correctly compares $XeF_2$ and $ClF_3$?'
    choices: [{ id: a, text: 'Both have five-domain electron geometry; XeF2 is linear and ClF3 is T-shaped.', issueSignals: [] }, { id: b, text: 'XeF2 is tetrahedral and ClF3 is trigonal planar.', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: c, text: 'Both have the same molecular geometry because both have lone pairs.', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Both begin trigonal bipyramidally; $XeF_2$ is linear and $ClF_3$ is T-shaped. Why it works: Their AX$_2$E$_3$ and AX$_3$E$_2$ occupancies leave different atom sites. Why the other choices fail: b uses wrong domain families; c ignores the different X-to-E split.'
    difficultyDimensions: [crossMoleculeComparison, AXEOccupancy, derivedShape]
    difficultyEvidence: 'Holds electron geometry constant while comparing two molecular outcomes.'
    prerequisiteObjectiveIds: [chem-vsepr-position-five-six]
    extensionObjectiveIds: [chem-vsepr-distinguish-geometries]
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q011
    type: multipleChoice
    prompt: 'A student assigns one geometry to all of $CH_3NH_2$. What is the best correction?'
    media: [{ type: image, src: /media/chemistry/vsepr-multicenter-map.svg, alt: Multicenter workflow emphasizing separate domain counts at neighboring atoms., caption: Select one center before counting. }]
    choices: [{ id: a, text: 'Analyze carbon and nitrogen separately because each has its own local domains.', issueSignals: [] }, { id: b, text: 'Average the carbon and nitrogen domain counts.', issueSignals: [{ id: chemistry-vsepr-multicenter-error }] }, { id: c, text: 'Use only the geometry around the heavier atom.', issueSignals: [{ id: chemistry-vsepr-multicenter-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Analyze carbon and nitrogen separately. Why it works: Carbon is locally tetrahedral, while nitrogen has tetrahedral electron geometry and trigonal-pyramidal molecular geometry. Why the other choices fail: Averaging or choosing one atom destroys the local definition of VSEPR geometry.'
    difficultyDimensions: [multicenterRecognition, localInventory, communicationCorrection]
    difficultyEvidence: 'Repairs a global-label misconception using two local analyses.'
    prerequisiteObjectiveIds: [chem-vsepr-local-centers]
    extensionObjectiveIds: [chem-polar-bonds-molecules]
    issueSignals: [{ id: chemistry-vsepr-multicenter-error }]
  - id: q012
    type: selectAll
    prompt: 'Select every claim that VSEPR alone can support without experimental angle data.'
    choices: [{ id: a, text: 'The electron-domain family from a valid local domain count.', issueSignals: [] }, { id: b, text: 'A qualitative direction of angle distortion from a lone pair.', issueSignals: [] }, { id: c, text: 'One exact measured angle for every molecule with the same AXE label.', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }, { id: d, text: 'The atoms-only molecular-geometry name.', issueSignals: [] }]
    answer: { choiceIds: [a, b, d] }
    explanation: 'Solution: Select a, b, and d. Why it works: VSEPR predicts domain arrangement, molecular shape, and qualitative distortion. Why the other choices fail: c overstates the model by assigning one exact measurement across chemically different molecules.'
    difficultyDimensions: [modelScope, evidenceQualification, multiAnswerEvaluation]
    difficultyEvidence: 'Distinguishes supported structural predictions from an overprecise claim.'
    prerequisiteObjectiveIds: [chem-vsepr-refine-angles]
    extensionObjectiveIds: [chem-polar-bonds-molecules]
    issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }]
