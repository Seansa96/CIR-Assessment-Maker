lesson:
  introduction: While we often treat torque as a scalar with a $\pm$ sign in 2D problems,
    torque is fundamentally a 3D vector quantity.
  sections:
  - id: sec-1
    title: Torque as a Cross Product
    content: 'Formally, torque is defined as the cross product of the position vector
      $\vec{r}$ (pointing from the pivot to the point of force application) and the
      force vector $\vec{F}$:


      $$\vec{\tau} = \vec{r} \times \vec{F}$$


      The direction of $\vec{\tau}$ is determined by the right-hand rule: point your
      fingers in the direction of $\vec{r}$, curl them toward $\vec{F}$, and your
      thumb points in the direction of $\vec{\tau}$. Because it''s a cross product,
      $\vec{\tau}$ is always perpendicular to the plane formed by $\vec{r}$ and $\vec{F}$.'
    media:
    - type: image
      src: /media/physics/owa/torque-lever.svg
      alt: Lever with a force and perpendicular lever arm.
      caption: Only the force component perpendicular to the lever arm produces torque.
    check:
      id: chk-tq-3
      type: multipleChoice
      prompt: If the position vector $\vec{r}$ points in the $+x$ direction and the
        force vector $\vec{F}$ points in the $+y$ direction, what is the direction
        of the torque vector $\vec{\tau}$?
      choices:
      - id: a
        text: $-x$ direction
        issueSignals:
        - id: sign-error
      - id: b
        text: $+z$ direction
      - id: c
        text: $-z$ direction
        issueSignals:
        - id: sign-error
      - id: d
        text: $+y$ direction
        issueSignals:
        - id: sign-error
      answer:
        choiceId: b
      explanation: 'Solution:

        $+z$ direction


        Why it works:

        Using the right-hand rule or the cross product basis vectors ($\hat{i} \times
        \hat{j} = \hat{k}$), pointing fingers along $+x$ and curling toward $+y$ yields
        a thumb pointing in the $+z$ direction.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-2
    title: Significance of Vector Torque
    content: For a door swinging on its hinges, $\vec{r}$ and $\vec{F}$ lie in the
      horizontal plane. The resulting torque vector points vertically (along the axis
      of the hinges). The fact that torque points along the axis of rotation is critical
      when predicting the behavior of complex 3D systems like gyroscopes, where the
      application of a torque causes the angular velocity vector to shift.
    media: []
    check:
      id: chk-tq-4
      type: multipleChoice
      prompt: Which of the following is true regarding the vector cross product $\vec{r}
        \times \vec{F}$?
      choices:
      - id: a
        text: $\vec{r} \times \vec{F} = \vec{F} \times \vec{r}$
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: The cross product is maximized when $\vec{r}$ and $\vec{F}$ are parallel.
        issueSignals:
        - id: trigonometry-error
      - id: c
        text: $\vec{r} \times \vec{F} = -(\vec{F} \times \vec{r})$
      - id: d
        text: The result is a scalar quantity.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: c
      explanation: 'Solution:

        $\vec{r} \times \vec{F} = -(\vec{F} \times \vec{r})$


        Why it works:

        The cross product is anti-commutative. Reversing the order of the vectors
        in a cross product reverses the direction of the resulting vector according
        to the right-hand rule.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
