lesson:
  introduction: While we often treat torque as a scalar with a $\pm$ sign in 2D problems,
    torque is fundamentally a 3D vector quantity.
  sections:
  - id: sec-1
    title: Torque as a Cross Product
    content: 'Formally, torque is defined as the cross product of the position vector
      $\vec{r}$ (pointing from the pivot to the point of force application) and the
      force vector $\vec{F}$:


      $$\vec{\tau} = \vec{r} \times \vec{F}$$


      The direction of $\vec{\tau}$ is determined by the right-hand rule: point your
      fingers in the direction of $\vec{r}$, curl them toward $\vec{F}$, and your
      thumb points in the direction of $\vec{\tau}$. Because it''s a cross product,
      $\vec{\tau}$ is always perpendicular to the plane formed by $\vec{r}$ and $\vec{F}$.'
    media:
    - type: image
      src: /media/physics/owa/torque-lever.svg
      alt: Lever with a force and perpendicular lever arm.
      caption: Only the force component perpendicular to the lever arm produces torque.
    check:
      id: chk-tq-3
      type: multipleChoice
      prompt: If the position vector $\vec{r}$ points in the $+x$ direction and the
        force vector $\vec{F}$ points in the $+y$ direction, what is the direction
        of the torque vector $\vec{\tau}$?
      choices:
      - id: a
        text: $-x$ direction
        issueSignals:
        - id: sign-error
      - id: b
        text: $+z$ direction
      - id: c
        text: $-z$ direction
        issueSignals:
        - id: sign-error
      - id: d
        text: $+y$ direction
        issueSignals:
        - id: sign-error
      answer:
        choiceId: b
      explanation: 'Solution:

        $+z$ direction


        Why it works:

        Using the right-hand rule or the cross product basis vectors ($\hat{i} \times
        \hat{j} = \hat{k}$), pointing fingers along $+x$ and curling toward $+y$ yields
        a thumb pointing in the $+z$ direction.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Right-Hand Rule
    content: 'Curl right-hand fingers from $\vec r$ to $\vec F$; the thumb gives torque direction.'
    media: []
    check: { id: chk-tq-10, type: multipleChoice, prompt: 'For $+y\times+x$, torque points:', choices: [{ id: a, text: '$+z$' }, { id: b, text: '$-z$' }, { id: c, text: '$+x$' }, { id: d, text: '$+y$' }], answer: { choiceId: b }, explanation: 'Solution: It points $-z$.\n\nWhy it works: $\hat j\times\hat i=-\hat k$.\n\nWhy the other choices fail: Cross-product order fixes direction.' }
  - id: sec-4
    title: Cross-Product Magnitude
    content: 'Torque magnitude is the cross-product magnitude $rF\sin\phi$.'
    media: []
    check: { id: chk-tq-11, type: multipleChoice, prompt: 'Parallel $\vec r$ and $\vec F$ produce:', choices: [{ id: a, text: maximum torque }, { id: b, text: zero torque }, { id: c, text: negative torque only }, { id: d, text: scalar torque }], answer: { choiceId: b }, explanation: 'Solution: Zero torque.\n\nWhy it works: $\sin0=0$.\n\nWhy the other choices fail: No perpendicular force component exists.' }
  - id: sec-5
    title: Axis Choice
    content: 'Choose an axis that simplifies unknown forces; forces through that axis then have zero torque.'
    media: []
    check: { id: chk-tq-12, type: multipleChoice, prompt: 'Choosing a pivot at an unknown hinge force makes its torque:', choices: [{ id: a, text: unknown }, { id: b, text: zero }, { id: c, text: maximum }, { id: d, text: energy }], answer: { choiceId: b }, explanation: 'Solution: It is zero.\n\nWhy it works: The hinge force acts at the chosen axis.\n\nWhy the other choices fail: Its lever arm vanishes.' }
  - id: sec-6
    title: Couple Torques
    content: 'A couple is two equal, opposite forces separated by distance; it produces rotation without net force.'
    media: []
    check: { id: chk-tq-13, type: multipleChoice, prompt: 'A force couple has net force:', choices: [{ id: a, text: nonzero }, { id: b, text: zero }, { id: c, text: equal to torque }, { id: d, text: infinite }], answer: { choiceId: b }, explanation: 'Solution: It is zero.\n\nWhy it works: Equal opposite forces cancel translationally.\n\nWhy the other choices fail: Their separation still produces nonzero torque.' }
  - id: sec-7
    title: Torque and Angular Acceleration
    content: 'Net torque and angular acceleration align through $\sum\tau=I\alpha$ for a fixed axis.'
    media: []
    check: { id: chk-tq-14, type: multipleChoice, prompt: 'With positive net torque and positive inertia, angular acceleration is:', choices: [{ id: a, text: positive }, { id: b, text: negative }, { id: c, text: zero always }, { id: d, text: unrelated }], answer: { choiceId: a }, explanation: 'Solution: It is positive.\n\nWhy it works: $\alpha=\tau_{net}/I$.\n\nWhy the other choices fail: Positive inertia cannot reverse the torque sign.' }
  - id: sec-2
    title: Significance of Vector Torque
    content: For a door swinging on its hinges, $\vec{r}$ and $\vec{F}$ lie in the
      horizontal plane. The resulting torque vector points vertically (along the axis
      of the hinges). The fact that torque points along the axis of rotation is critical
      when predicting the behavior of complex 3D systems like gyroscopes, where the
      application of a torque causes the angular velocity vector to shift.
    media: []
    check:
      id: chk-tq-4
      type: multipleChoice
      prompt: Which of the following is true regarding the vector cross product $\vec{r}
        \times \vec{F}$?
      choices:
      - id: a
        text: $\vec{r} \times \vec{F} = \vec{F} \times \vec{r}$
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: The cross product is maximized when $\vec{r}$ and $\vec{F}$ are parallel.
        issueSignals:
        - id: trigonometry-error
      - id: c
        text: $\vec{r} \times \vec{F} = -(\vec{F} \times \vec{r})$
      - id: d
        text: The result is a scalar quantity.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: c
      explanation: 'Solution:

        $\vec{r} \times \vec{F} = -(\vec{F} \times \vec{r})$


        Why it works:

        The cross product is anti-commutative. Reversing the order of the vectors
        in a cross product reverses the direction of the resulting vector according
        to the right-hand rule.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
