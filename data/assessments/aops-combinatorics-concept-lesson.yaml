lesson:
  introduction: Learn to solve Combinatorics problems by recognizing bijections, double counting, and extremal arguments and justifying each theorem or transformation.
  sections:
  - id: aops-combinatorics-motivation
    title: What the topic helps you notice
    required: true
    content: Combinatorics is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are bijections, double counting, and extremal arguments.
    check:
      id: aops-combinatorics-motivation-check
      type: multipleChoice
      prompt: In Combinatorics, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-combinatorics-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-combinatorics-definitions-check
      type: multipleChoice
      prompt: In Combinatorics, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-combinatorics-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: bijections, double counting, and extremal arguments. Record the givens, unknown, and any restriction before selecting a method.'
