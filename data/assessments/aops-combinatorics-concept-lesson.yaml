  - id: aops-combinatorics-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-combinatorics-method-check
      type: multipleChoice
      prompt: In Combinatorics, what should be checked before applying a method?
