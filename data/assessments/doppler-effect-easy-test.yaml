questions:
- id: q001
  type: numericResponse
  skills:
  - physics-doppler-effect
  prompt: Use the The Doppler Effect diagram and the model $f'=f(v+v_o)/(v-v_s)$. A calibrated scenario
    scales the reference values by 1.1. Determine the observed frequency. Give a numerical answer.
  answer:
    value: 374.0
    tolerance: 3.7400000000000007
  explanation: Apply $f'=f(v+v_o)/(v-v_s)$ consistently to the scaled scenario; the requested observed
    frequency is 374.
  media:
  - type: image
    src: /media/physics/owa/doppler-effect.svg
    alt: Labeled original schematic for The Doppler Effect used for quantitative analysis.
    caption: The Doppler Effect model diagram.
