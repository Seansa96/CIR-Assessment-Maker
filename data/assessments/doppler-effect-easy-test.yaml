- id: q014
  type: symbolicResponse
  skills:
  - physics-doppler-effect
  prompt: Starting from $f'=f(v+v_o)/(v-v_s)$ for The Doppler Effect, solve symbolically for the requested
    model variable. Enter an equivalent expression.
  answer:
    expectedLatex: f_prime*(v-v_s)/(v+v_o)
    equivalenceMode: expression
    tolerance: '0.000001'
    variables:
    - T
    - pi
    - E
    - k
    - A
    - v
    - lambda
    - m
    - L
    - n
    - f_n
    - r
    - I
    - f_1
    - f_2
    - theta
    - v_s
    - v_o
    - f_prime
    - A_0
    - t
    - mu
  explanation: Rearrange $f'=f(v+v_o)/(v-v_s)$ algebraically while preserving its physical variables.
