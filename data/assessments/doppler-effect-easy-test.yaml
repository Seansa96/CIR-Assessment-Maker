questions:
- id: q001
  type: multipleChoice
  prompt: 'A stationary listener hears a source moving toward them. Compared with the emitted frequency, the observed frequency is:'
  choices: [{ id: a, text: higher }, { id: b, text: lower }, { id: c, text: unchanged }]
  answer: { choiceId: a }
  explanation: |
    Solution: The observed frequency is higher.

    Why it works: Successive wavefronts are compressed in front of an approaching source.

    Why the other choices fail: Lower frequency applies to recession, while unchanged frequency requires no relative radial motion.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
- id: q002
  type: numericResponse
  prompt: Sound speed is 340 m/s. A stationary 500 Hz source is approached by an observer at 20 m/s. Find observed frequency in Hz using fprime=f(v+vo)/v.
  answer: { value: 529.411765, tolerance: 1 }
  explanation: |
    Solution: $fprime=500(340+20)/340=529.4$ Hz.

    Why it works: Observer motion toward the source increases the rate at which wavefronts arrive.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q003
  type: numericResponse
  prompt: Sound speed is 340 m/s. A 500 Hz source approaches a stationary observer at 20 m/s. Find observed frequency in Hz using fprime=fv/(v-vs).
  answer: { value: 531.25, tolerance: 1 }
  explanation: |
    Solution: $fprime=500(340)/(340-20)=531.25$ Hz.

    Why it works: An approaching source reduces the wavelength in front of it while sound speed in the medium remains fixed.
  difficultyDimensions: [modelOrDerivation, simplification]
- id: q004
  type: multipleChoice
  prompt: 'A listener moves away from a stationary siren in still air. Which quantity changes for the listener?'
  choices: [{ id: a, text: observed frequency }, { id: b, text: wave speed in the air }, { id: c, text: source emission frequency }]
  answer: { choiceId: a }
  explanation: |
    Solution: The observed frequency changes.

    Why it works: Relative motion changes the wavefront arrival rate, not the medium's wave speed or the source's emitted frequency.

    Why the other choices fail: Air properties set sound speed, and the stationary source continues to emit the same frequency.
  difficultyDimensions: [representationTransfer, errorDiagnosis]
- id: q005
  type: numericResponse
  prompt: A 600 Hz source and an observer both move toward one another through still air. Take v=340 m/s, observer speed 10 m/s, and source speed 20 m/s. Find observed frequency in Hz.
  answer: { value: 656.25, tolerance: 1 }
  explanation: |
    Solution: $fprime=600(340+10)/(340-20)=656.25$ Hz.

    Why it works: Observer motion raises the numerator and source motion toward the observer lowers the denominator.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
- id: q006
  type: symbolicResponse
  prompt: Starting from fprime=f(v+vo)/(v-vs), solve for the emitted frequency f.
  answer: { expectedLatex: 'f_prime*(v-v_s)/(v+v_o)', equivalenceMode: expression, variables: [f_prime, v, v_s, v_o], tolerance: 0.000001 }
  explanation: |
    Solution: $f=fprime(v-vs)/(v+vo)$.

    Why it works: Multiply by the denominator and divide by the observer-motion factor to isolate f.
  difficultyDimensions: [reverseReasoning, modelOrDerivation]

