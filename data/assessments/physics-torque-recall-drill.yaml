items:
  - { id: tr1, type: cloze, prompt: 'Torque magnitude is $\tau=rF\sin____$.', answer: { expected: phi, expectedLatex: '\phi', aliases: [angle], media: [] }, explanation: 'Solution: Insert $\phi$.\n\nWhy it works: The sine selects the perpendicular force component.', tags: [formula] }
  - { id: tr2, type: typed, prompt: 'What is the SI unit of torque?', answer: { expected: 'newton meter', expectedLatex: '\mathrm{N\,m}', aliases: ['N m'], media: [] }, explanation: 'Solution: It is N m.\n\nWhy it works: Torque is force times lever arm.', tags: [units] }
  - { id: tr3, type: cloze, prompt: 'Maximum torque occurs when force is ____ to the lever arm.', answer: { expected: perpendicular, expectedLatex: '', aliases: ['at 90 degrees'], media: [] }, explanation: 'Solution: Insert perpendicular.\n\nWhy it works: The sine factor is one at $90^\circ$.', tags: [geometry] }
  - { id: tr4, type: typed, prompt: 'What condition defines rotational equilibrium?', answer: { expected: 'net torque zero', expectedLatex: '\sum\tau=0', aliases: ['sum torque equals zero'], media: [] }, explanation: 'Solution: Net torque is zero.\n\nWhy it works: Then angular acceleration is zero.', tags: [equilibrium] }
  - { id: tr5, type: cloze, prompt: 'Torque vector is $\vec r\times\vec____$.', answer: { expected: F, expectedLatex: '\vec F', aliases: [force], media: [] }, explanation: 'Solution: Insert $\vec F$.\n\nWhy it works: Torque is the position-force cross product.', tags: [vectors] }
  - { id: tr6, type: typed, prompt: 'Which rule determines cross-product direction?', answer: { expected: 'right hand rule', expectedLatex: '', aliases: ['right-hand rule'], media: [] }, explanation: 'Solution: It is the right-hand rule.\n\nWhy it works: Thumb direction gives the vector result.', tags: [vectors] }
