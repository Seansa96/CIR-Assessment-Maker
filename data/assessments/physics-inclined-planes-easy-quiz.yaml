questions:
  - id: ip-easy-q01
    title: Parallel Component of Gravity
    type: multipleChoice
    difficultyDimensions:
      - conceptual
      - representation
    prompt: |
      A block of mass $m$ rests on a frictionless inclined plane that makes an angle $\theta$ with the horizontal. Which expression represents the component of gravity pulling the block **down the incline**?
    choices:
      - id: a
        text: '$mg \cos(\theta)$'
      - id: b
        text: '$mg \sin(\theta)$'
      - id: c
        text: '$mg \tan(\theta)$'
      - id: d
        text: '$mg$'
    answer:
      choiceId: b
    explanation: |
      Solution:
      The component of gravity parallel to the incline is $mg \sin(\theta)$.
      
      Why it works:
      When we tilt our coordinate axes to align with the incline, the angle $\theta$ of the incline is the angle between the downward gravity vector and the perpendicular axis. Therefore, the parallel component corresponds to the opposite side of the right triangle formed, which uses the sine function.
      
      Why the other choices fail:
      - $mg \cos(\theta)$: This represents the component of gravity perpendicular to the surface.
      - $mg \tan(\theta)$: This is not a component of gravity.
      - $mg$: This is the full magnitude of gravity, straight down, not its component along the incline.

  - id: ip-easy-q02
    title: Calculating Normal Force
    type: numericResponse
    difficultyDimensions:
      - computational
      - conceptual
    prompt: |
      A $10.0\text{ kg}$ box sits on a ramp angled at $30^\circ$ to the horizontal. Using $g = 9.8\text{ m/s}^2$ and assuming no other forces act perpendicular to the ramp, calculate the magnitude of the normal force on the box in Newtons. Round to one decimal place.
    answer:
      value: 84.9
      tolerance: 0.5
    explanation: |
      Solution:
      The normal force balances the perpendicular component of gravity.
      $$F_N = mg \cos(\theta)$$
      $$F_N = (10.0)(9.8) \cos(30^\circ) = 98 \times 0.866 = 84.868\text{ N} \approx 84.9\text{ N}$$
      
      Why it works:
      Because the box isn't accelerating into or out of the ramp, the net force in the perpendicular direction is zero. Thus, $F_N$ must equal the component of gravity pressing the box into the ramp, $mg \cos(\theta)$.

  - id: ip-easy-q03
    title: Acceleration on a Frictionless Incline
    type: numericResponse
    difficultyDimensions:
      - computational
      - synthesis
    prompt: |
      A sled slides down a frictionless, snow-covered hill angled at $15^\circ$. Using $g = 9.8\text{ m/s}^2$, calculate its acceleration down the hill in $\text{m/s}^2$. Round to two decimal places.
    answer:
      value: 2.54
      tolerance: 0.05
    explanation: |
      Solution:
      Since there is no friction, the only force acting along the incline is the parallel component of gravity.
      $$F_\text{net} = mg \sin(\theta) = ma$$
      $$a = g \sin(\theta) = (9.8) \sin(15^\circ) = (9.8)(0.2588) \approx 2.54\text{ m/s}^2$$
      
      Why it works:
      Applying Newton's Second Law to the axis parallel to the incline allows us to divide out the mass, revealing that the acceleration solely depends on gravity and the angle of the hill.
