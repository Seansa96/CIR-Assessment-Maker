questions:
  - id: q001
    type: multipleChoice
    prompt: |
      What will the following code output?
      
      ```python
      def multiply_damage(damage, multiplier=2):
          return damage * multiplier
          
      result = multiply_damage(10, 3)
      print(result)
      ```
    choices:
      - id: a
        text: '`20`'
      - id: b
        text: '`30`'
      - id: c
        text: '`10`'
      - id: d
        text: An error, because you can't overwrite a default parameter.
    answer:
      choiceId: b
    explanation: |
      The default `multiplier` is `2`. However, we explicitly passed `3` when calling the function (`multiply_damage(10, 3)`), which overrides the default. `10 * 3 = 30`.

  - id: q002
    type: multipleChoice
    prompt: |
      What is the scope of the `current_hp` variable?
      
      ```python
      max_hp = 100
      
      def heal_player(amount):
          current_hp = 50
          new_hp = current_hp + amount
          return new_hp
      ```
    choices:
      - id: a
        text: Global scope (can be accessed anywhere).
      - id: b
        text: Local scope (can only be accessed inside `heal_player`).
      - id: c
        text: Enclosing scope.
      - id: d
        text: Built-in scope.
    answer:
      choiceId: b
    explanation: |
      Because `current_hp` is defined inside the function body, it belongs to the function's local scope. `max_hp`, on the other hand, is in the global scope.

  - id: q003
    type: multipleChoice
    prompt: |
      Look at this code:
      
      ```python
      def get_loot():
          print("You found a sword!")
          return "Iron Sword"
          print("You also found a shield!")
          
      item = get_loot()
      ```
      
      What happens to the second print statement?
    choices:
      - id: a
        text: It prints "You also found a shield!" to the console.
      - id: b
        text: It returns "You also found a shield!" as a string.
      - id: c
        text: It is completely ignored.
      - id: d
        text: It causes a syntax error.
    answer:
      choiceId: c
    explanation: |
      When Python executes a `return` statement, it immediately exits the function. Any code located below the `return` in that block is unreachable and ignored.

  - id: q004
    type: numericResponse
    prompt: |
      Trace this function call:
      
      ```python
      def calculate_stats(strength, agility, intellect):
          power = strength * 2
          speed = agility + 5
          return power + speed + intellect
          
      final_score = calculate_stats(intellect=10, agility=5, strength=8)
      ```
      
      What is the value of `final_score`?
    answer:
      value: 36
      tolerance: 0
    explanation: |
      Because we used keyword arguments, the order doesn't matter. `strength=8` means power is 16. `agility=5` means speed is 10. The sum is `16 + 10 + 10 = 36`.
