questions:
- id: q001
  type: multipleChoice
  prompt: "What will the following code output?\n\n```python\ndef multiply_damage(damage,\
    \ multiplier=2):\n    return damage * multiplier\n    \nresult = multiply_damage(10,\
    \ 3)\nprint(result)\n```\n"
  choices:
  - id: a
    text: '`20`'
  - id: b
    text: '`30`'
  - id: c
    text: '`10`'
  - id: d
    text: An error, because you can't overwrite a default parameter.
  answer:
    choiceId: b
  explanation: 'The default `multiplier` is `2`. However, we explicitly passed `3`
    when calling the function (`multiply_damage(10, 3)`), which overrides the default.
    `10 * 3 = 30`.

    '
- id: q002
  type: multipleChoice
  prompt: "What is the scope of the `current_hp` variable?\n\n```python\nmax_hp =\
    \ 100\n\ndef heal_player(amount):\n    current_hp = 50\n    new_hp = current_hp\
    \ + amount\n    return new_hp\n```\n"
  choices:
  - id: a
    text: Global scope (can be accessed anywhere).
  - id: b
    text: Local scope (can only be accessed inside `heal_player`).
  - id: c
    text: Enclosing scope.
  - id: d
    text: Built-in scope.
  answer:
    choiceId: b
  explanation: 'Because `current_hp` is defined inside the function body, it belongs
    to the function''s local scope. `max_hp`, on the other hand, is in the global
    scope.

    '
- id: q003
  type: multipleChoice
  prompt: "Look at this code:\n\n```python\ndef get_loot():\n    print(\"You found\
    \ a sword!\")\n    return \"Iron Sword\"\n    print(\"You also found a shield!\"\
    )\n    \nitem = get_loot()\n```\n\nWhat happens to the second print statement?\n"
  choices:
  - id: a
    text: It prints "You also found a shield!" to the console.
  - id: b
    text: It returns "You also found a shield!" as a string.
  - id: c
    text: It is completely ignored.
  - id: d
    text: It causes a syntax error.
  answer:
    choiceId: c
  explanation: 'When Python executes a `return` statement, it immediately exits the
    function. Any code located below the `return` in that block is unreachable and
    ignored.

    '
- id: q004
  type: numericResponse
  prompt: "Trace this function call:\n\n```python\ndef calculate_stats(strength, agility,\
    \ intellect):\n    power = strength * 2\n    speed = agility + 5\n    return power\
    \ + speed + intellect\n    \nfinal_score = calculate_stats(intellect=10, agility=5,\
    \ strength=8)\n```\n\nWhat is the value of `final_score`?\n"
  answer:
    value: 36
    tolerance: 0
  explanation: 'Because we used keyword arguments, the order doesn''t matter. `strength=8`
    means power is 16. `agility=5` means speed is 10. The sum is `16 + 10 + 10 = 36`.

    '
