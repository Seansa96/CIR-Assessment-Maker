id: physics2-ch13-motional-emf-concept-lesson
title: Motional EMF
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electromagnetic-induction
lesson:
  introduction: This lesson develops the main ideas behind Motional EMF and connects them to the governing
    physical relationships.
  sections:
  - id: l3-sec1
    title: Conductor Moving in a B-field
    required: true
    content: 'When a conductor of length $l$ moves with velocity $v$ perpendicular to a uniform magnetic
      field $B$, free charges experience a magnetic force $F_B = qvB$. This causes charges to separate
      until the electric force balances the magnetic force, creating a motional EMF: $\mathcal{E} = Bvl$.'
  - id: l3-sec2
    title: Induced Electric Fields
    required: true
    content: A changing magnetic field induces a non-conservative electric field. Faraday's Law can be
      generalized as $\oint \vec{E} \cdot d\vec{l} = -\frac{d\Phi_B}{dt}$.
