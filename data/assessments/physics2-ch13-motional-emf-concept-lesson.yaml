lesson:
  introduction: >
    This lesson develops a repeatable way to solve Motional EMF problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch13-motional-emf-s1
    title: Name the model and quantities
    required: true
    content: >
      Motional EMF uses emf = B L v. In the name the model and quantities stage, identify the conductor length perpendicular to both motion and field, then determine polarity from magnetic force.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Motional EMF problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch13-motional-emf-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Motional EMF, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use emf = B L v after you identify the conductor length perpendicular to both motion and field, then determine polarity from magnetic force.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Motional EMF problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch13-motional-emf-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables emf = B L v relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch13-motional-emf-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Motional EMF.
        media: []
        issueSignals:
        - id: physics2-physics2-ch13-motional-emf-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Motional EMF, first identify the conductor length perpendicular to both motion and field, then determine polarity from magnetic force. Then apply emf = B L v with one consistent coordinate system and solve for the requested quantity.


        Why it works: emf = B L v connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
