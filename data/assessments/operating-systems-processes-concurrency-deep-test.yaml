questions:
- id: q001
  title: 'Processes and Threads: Process context'
  type: multipleChoice
  prompt: In a design review, which statement best applies **Process context**?
  choices:
  - id: a
    text: A process is more than a program file.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'A process is more than a program file. Related topic: Processes and Threads.'
