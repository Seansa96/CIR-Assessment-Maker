- id: q001
  type: multipleChoice
  skills:
  - identify-power-series-centers
  prompt: |
    What is the center of $\sum_{n=0}^{\infty}c_n(x-4)^n$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $-4$
  - id: c
    text: $4$
  - id: d
    text: $c_n$
  answer:
    choiceId: c
  explanation: 'Solution: Standard form uses powers of $x-a$, so $a=4$. Therefore the answer is $4$.


    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


    Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


    Why the other choices fail: $0$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $-4$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $c_n$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner reads the series structure and simplifies it into the requested coefficient, center, or standard representation.
- id: q002
  type: multipleChoice
  skills:
  - evaluate-power-series-at-centers
  prompt: |
    If $f(x)=\sum_{n=0}^{\infty}c_n(x-a)^n$, what is $f(a)$?
  choices:
  - id: a
    text: $c_0$
  - id: b
    text: $c_1$
  - id: c
    text: $0$
  - id: d
    text: |-
      $\sum c_n$
  answer:
    choiceId: a
  explanation: |-
    Solution: At $x=a$, every positive power vanishes and the zeroth-power term remains. Therefore the answer is $c_0$.

    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.

    Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.

    Why the other choices fail: $c_1$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $0$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $\sum c_n$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.
