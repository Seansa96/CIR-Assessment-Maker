- id: q003
  type: multipleChoice
  prompt: >
    What is the radius of convergence of

    $$\sum_{n=0}^{\infty}\frac{(x-1)^n}{5^n}?$$
  choices:
  - id: a
    text: $1$
    media: []
    issueSignals: []
  - id: b
    text: $5$
    media: []
    issueSignals: []
  - id: c
    text: $1/5$
    media: []
    issueSignals: []
  - id: d
    text: $\infty$
    media: []
    issueSignals: []
  answer:
    choiceId: b
    choiceIds: []
    expected: 
    gradingMode: 
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: It is geometric with ratio $(x-1)/5$, so convergence requires $|x-1|<5$. Therefore the answer is $5$.


    Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.


    Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.


    Why the other choices fail: $1$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $1/5$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $\infty$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
