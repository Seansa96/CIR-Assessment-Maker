schemaVersion: 1
id: calc2-power-series-easy-quiz
title: Power Series Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: power-series
skills:
- Identify centers, coefficients, radii, and intervals
- Test endpoints independently
- Transform and differentiate power-series representations
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - power-series
  - easy
  - radius-of-convergence
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - identify-power-series-centers
  prompt: 'What is the center of $\sum_{n=0}^{\infty}c_n(x-4)^n$?

    '
  choices:
  - id: a
    text: $0$
  - id: b
    text: $-4$
  - id: c
    text: $4$
  - id: d
    text: $c_n$
  answer:
    choiceId: c
  explanation: Standard form uses powers of $x-a$, so $a=4$.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner reads the series structure and simplifies it into the requested coefficient, center, or standard representation.
- id: q002
  type: multipleChoice
  skills:
  - evaluate-power-series-at-centers
  prompt: 'If $f(x)=\sum_{n=0}^{\infty}c_n(x-a)^n$, what is $f(a)$?

    '
  choices:
  - id: a
    text: $c_0$
  - id: b
    text: $c_1$
  - id: c
    text: $0$
  - id: d
    text: $\sum c_n$
  answer:
    choiceId: a
  explanation: At $x=a$, every positive power vanishes and the zeroth-power term remains.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner reads the series structure and simplifies it into the requested coefficient, center, or standard representation.
- id: q003
  type: multipleChoice
  skills:
  - find-radii-with-ratio-tests
  prompt: 'What is the radius of convergence of

    $$\sum_{n=0}^{\infty}\frac{(x-1)^n}{5^n}?$$

    '
  choices:
  - id: a
    text: $1$
  - id: b
    text: $5$
  - id: c
    text: $1/5$
  - id: d
    text: $\infty$
  answer:
    choiceId: b
  explanation: It is geometric with ratio $(x-1)/5$, so convergence requires $|x-1|<5$.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner reads the series structure and simplifies it into the requested coefficient, center, or standard representation.
- id: q004
  type: multipleChoice
  skills:
  - convert-radius-to-interval
  prompt: 'Which open interval is described by $|x+2|<3$?

    '
  choices:
  - id: a
    text: $(-5,1)$
  - id: b
    text: $(-3,3)$
  - id: c
    text: $(-1,5)$
  - id: d
    text: $(-2,3)$
  answer:
    choiceId: a
  explanation: Solve $-3<x+2<3$ and subtract two to obtain $-5<x<1$.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The learner translates series notation into an interval condition and distinguishes the automatic interior result from a boundary decision.
- id: q005
  type: multipleChoice
  skills:
  - test-power-series-endpoints
  prompt: 'Find the interval of convergence of

    $$\sum_{n=1}^{\infty}\frac{(x+2)^n}{n3^n}.$$

    '
  choices:
  - id: a
    text: $[-5,1)$
  - id: b
    text: $(-5,1)$
  - id: c
    text: $(-5,1]$
  - id: d
    text: $[-5,1]$
  answer:
    choiceId: a
  explanation: The radius is three; $x=-5$ gives the alternating harmonic series, while $x=1$ gives the divergent harmonic series.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The learner translates series notation into an interval condition and distinguishes the automatic interior result from a boundary decision.
- id: q006
  type: multipleChoice
  skills:
  - recognize-geometric-function-representations
  prompt: 'For $|x|<1$, what function is represented by

    $\sum_{n=0}^{\infty}x^n$?

    '
  choices:
  - id: a
    text: $1/(1-x)$
  - id: b
    text: $1/(1+x)$
  - id: c
    text: $e^x$
  - id: d
    text: $\ln(1+x)$
  answer:
    choiceId: a
  explanation: A geometric series with first term one and ratio $x$ sums to $1/(1-x)$.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner reads the series structure and simplifies it into the requested coefficient, center, or standard representation.
- id: q007
  type: multipleChoice
  skills:
  - transform-power-series-by-substitution
  prompt: 'Which series represents $1/(1-x^2)$ for $|x|<1$?

    '
  choices:
  - id: a
    text: $\sum_{n=0}^{\infty}x^{2n}$
  - id: b
    text: $\sum_{n=0}^{\infty}x^n$
  - id: c
    text: $\sum_{n=0}^{\infty}(-1)^nx^{2n}$
  - id: d
    text: $\sum_{n=1}^{\infty}2nx^{n-1}$
  answer:
    choiceId: a
  explanation: Substitute $u=x^2$ into $1/(1-u)=\sum u^n$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: The learner identifies a known representation and selects the indicated substitution or termwise calculus operation.
- id: q008
  type: multipleChoice
  skills:
  - differentiate-power-series
  prompt: 'Inside its radius, what is the derivative of

    $\sum_{n=0}^{\infty}c_n(x-a)^n$?

    '
  choices:
  - id: a
    text: $\sum_{n=1}^{\infty}nc_n(x-a)^{n-1}$
  - id: b
    text: $\sum_{n=0}^{\infty}c_n(x-a)^{n+1}/(n+1)$
  - id: c
    text: $\sum_{n=0}^{\infty}nc_n(x-a)^n$
  - id: d
    text: $\sum_{n=1}^{\infty}c_n$
  answer:
    choiceId: a
  explanation: The ordinary power rule applies termwise, and the constant term disappears.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: The learner identifies a known representation and selects the indicated substitution or termwise calculus operation.
- id: q009
  type: multipleChoice
  skills:
  - integrate-power-series
  prompt: 'Which expression is an antiderivative of

    $\sum_{n=0}^{\infty}c_n(x-a)^n$ inside its radius?

    '
  choices:
  - id: a
    text: $C+\sum_{n=0}^{\infty}c_n(x-a)^{n+1}/(n+1)$
  - id: b
    text: $\sum_{n=1}^{\infty}nc_n(x-a)^{n-1}$
  - id: c
    text: $C+\sum c_n(x-a)^n$
  - id: d
    text: $\sum c_n/(x-a)$
  answer:
    choiceId: a
  explanation: Increase each exponent by one, divide by the new exponent, and add the integration constant.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: The learner identifies a known representation and selects the indicated substitution or termwise calculus operation.
- id: q010
  type: multipleChoice
  skills:
  - sum-differentiated-geometric-series
  prompt: 'For $|x|<1$, what is $\sum_{n=1}^{\infty}nx^n$?

    '
  choices:
  - id: a
    text: $x/(1-x)^2$
  - id: b
    text: $1/(1-x)^2$
  - id: c
    text: $x/(1-x)$
  - id: d
    text: $-\ln(1-x)$
  answer:
    choiceId: a
  explanation: Differentiate $\sum x^n=1/(1-x)$ to get $\sum nx^{n-1}$, then multiply by $x$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: The learner identifies a known representation and selects the indicated substitution or termwise calculus operation.
- id: q011
  type: multipleChoice
  skills:
  - understand-radius-preservation
  prompt: 'A power series has radius $R=6$. What radius does its derivative series have?

    '
  choices:
  - id: a
    text: $6$
  - id: b
    text: $3$
  - id: c
    text: $12$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: Differentiation changes coefficients by polynomial factors but preserves the radius of convergence.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The learner translates series notation into an interval condition and distinguishes the automatic interior result from a boundary decision.
- id: q012
  type: multipleChoice
  skills:
  - classify-endpoint-convergence
  prompt: 'At an endpoint, a power series becomes $\sum(-1)^n/n$. How does it

    converge there?

    '
  choices:
  - id: a
    text: Conditionally
  - id: b
    text: Absolutely
  - id: c
    text: It diverges by the term test.
  - id: d
    text: Geometrically
  answer:
    choiceId: a
  explanation: Alternating harmonic convergence holds, while the absolute harmonic series diverges.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The learner translates series notation into an interval condition and distinguishes the automatic interior result from a boundary decision.
- id: q013
  type: multipleChoice
  skills:
  - interpret-radius-behavior
  prompt: 'A power series centered at $a$ has radius $R>0$. Which statement is true?

    '
  choices:
  - id: a
    text: It converges absolutely for $|x-a|<R$ and diverges for $|x-a|>R$.
  - id: b
    text: It converges at every point with $|x-a|\le R$.
  - id: c
    text: It diverges throughout $|x-a|<R$.
  - id: d
    text: It has the same sum at every interior point.
  answer:
    choiceId: a
  explanation: The radius theorem settles the interior and exterior, leaving only boundary points for separate tests.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The learner translates series notation into an interval condition and distinguishes the automatic interior result from a boundary decision.
- id: q014
  type: multipleChoice
  skills:
  - extract-power-series-coefficients
  prompt: 'In $\sum_{n=0}^{\infty}(-1)^nx^{2n}$, what is the coefficient of $x^6$?

    '
  choices:
  - id: a
    text: $-1$
  - id: b
    text: $1$
  - id: c
    text: $0$
  - id: d
    text: $6$
  answer:
    choiceId: a
  explanation: The exponent $2n=6$ gives $n=3$, whose coefficient is $(-1)^3=-1$.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner reads the series structure and simplifies it into the requested coefficient, center, or standard representation.
- id: q015
  type: multipleChoice
  skills:
  - apply-root-radius-formulas
  prompt: 'If $\lim_{n\to\infty}|c_n|^{1/n}=2$, what is the radius of

    $\sum c_n(x-a)^n$?

    '
  choices:
  - id: a
    text: $1/2$
  - id: b
    text: $2$
  - id: c
    text: $1$
  - id: d
    text: $\infty$
  answer:
    choiceId: a
  explanation: The root-test limit is $2|x-a|$, so convergence requires $|x-a|<1/2$.
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  difficultyEvidence: The learner translates series notation into an interval condition and distinguishes the automatic interior result from a boundary decision.
attemptQuestionCount: 10
authoring:
  visualRequirement: notApplicable
  visualRationale: These routine recognition checks use algebraic notation; the instructional diagrams remain in the concept lesson and worked example.
  difficultyTier: easy
