sections:
  - id: what-is-containerization
    title: What is Containerization?
    content: |
      Containerization is a lightweight form of virtualization. Instead of virtualizing the entire hardware stack (as a Virtual Machine does), containerization virtualizes the operating system level.
      
      A **container** is an isolated, runnable instance of an application, packaged with all of its dependencies, libraries, and configuration files. It shares the host's operating system kernel but runs as an isolated process.

  - id: benefits
    title: Benefits of Containers
    content: |
      Containers provide several significant advantages:
      
      1. **Portability:** "It works on my machine" is a thing of the past. Since a container includes all its dependencies, it will run exactly the same way on a developer's laptop, a testing server, or a production cloud environment.
      2. **Efficiency:** Containers are incredibly lightweight. Unlike Virtual Machines, they do not require a full guest operating system, meaning they start almost instantly and consume much less RAM and CPU.
      3. **Isolation:** Each container has its own isolated filesystem, network, and process space. If one container crashes, it doesn't take down the others.

  - id: images-vs-containers
    title: Images vs. Containers
    content: |
      It is critical to distinguish between an **image** and a **container**.
      
      * **Image:** A read-only template or blueprint. It contains the application code, libraries, and runtime needed to run the software. It is static.
      * **Container:** A running instance of an image. It is dynamic and has a read-write layer on top of the image. You can start, stop, delete, and inspect containers.

questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which of the following is the primary difference between a container and a virtual machine?
    choices:
      - id: a
        text: A container virtualizes the hardware, while a VM virtualizes the operating system.
      - id: b
        text: A container shares the host's OS kernel, while a VM requires a full guest operating system.
      - id: c
        text: Containers are only used for web servers, while VMs can run databases.
      - id: d
        text: Virtual machines start faster than containers.
    answer:
      choiceId: b
    explanation: |
      Containers are lightweight because they share the host OS kernel and do not require the overhead of a full guest OS, making them start faster and use fewer resources than VMs.

  - id: q002
    type: multipleChoice
    prompt: |
      What is a Docker image?
    choices:
      - id: a
        text: A running process that executes application code.
      - id: b
        text: A physical server that hosts containers.
      - id: c
        text: A read-only template or blueprint that contains the application and its dependencies.
      - id: d
        text: A network configuration for connecting multiple containers.
    answer:
      choiceId: c
    explanation: |
      An image is the static blueprint from which dynamic containers are created.

  - id: q003
    type: freeResponse
    prompt: |
      Explain in your own words why container portability is a major benefit for software development.
    answer:
      expected: |
        Containers package the application and all its dependencies together, ensuring that the software runs identically across different environments, from a developer's local machine to production servers.
      gradingMode: selfCheck
    explanation: |
      Portability eliminates "it works on my machine" issues by standardizing the execution environment regardless of the underlying infrastructure.


