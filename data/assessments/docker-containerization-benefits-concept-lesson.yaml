  sections:
  - id: sec-q001
    title: Which of the following is the primary difference between a container and
      a virtual machine?
    content: |
      Which of the following is the primary difference between a container and a virtual machine?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: A container virtualizes the hardware, while a VM virtualizes the operating
          system.
      - id: b
        text: A container shares the\rhost's OS kernel, while a VM requires a full
          guest operating system.
      - id: c
        text: Containers are only used for web servers, while VMs can run databases.
      - id: d
        text: Virtual machines start faster than containers.
      answer:
        choiceId: b
      explanation: |
        Containers are lightweight because they share the\rhost OS kernel and do not require the overhead of a full guest OS, making them start faster and use fewer resources than VMs.
  - id: sec-q002
    title: What is a Docker image?
    content: |
      What is a Docker image?
    check:
      id: check-q002
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: A running process that executes application code.
      - id: b
        text: A physical server that\rhosts containers.
      - id: c
        text: A read-only template or blueprint that contains the application and
          its dependencies.
      - id: d
        text: A network configuration for connecting multiple containers.
      answer:
        choiceId: c
      explanation: |
        An image is the static blueprint from which dynamic containers are created.
