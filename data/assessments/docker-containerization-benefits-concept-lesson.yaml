sections:
- id: what-is-containerization
  title: What is Containerization?
  content: 'Containerization is a lightweight form of virtualization. Instead of virtualizing
    the entire hardware stack (as a Virtual Machine does), containerization virtualizes
    the operating system level.


    A **container** is an isolated, runnable instance of an application, packaged
    with all of its dependencies, libraries, and configuration files. It shares the
   \rhost''s operating system kernel but runs as an isolated process.

    '
- id: benefits
  title: Benefits of Containers
  content: 'Containers provide several significant advantages:


    1. **Portability:** "It works on my machine" is a thing of the past. Since a container
    includes all its dependencies, it will run exactly the same way on a developer''s
    laptop, a testing server, or a production cloud environment.

    2. **Efficiency:** Containers are incredibly lightweight. Unlike Virtual Machines,
    they do not require a full guest operating system, meaning they start almost instantly
    and consume much less RAM and CPU.

    3. **Isolation:** Each container has its own isolated filesystem, network, and
    process space. If one container crashes, it doesn''t take down the others.

    '
- id: images-vs-containers
  title: Images vs. Containers
  content: 'It is critical to distinguish between an **image** and a **container**.


    * **Image:** A read-only template or blueprint. It contains the application code,
    libraries, and runtime needed to run the software. It is static.

    * **Container:** A running instance of an image. It is dynamic and has a read-write
    layer on top of the image. You can start, stop, delete, and inspect containers.

    '
