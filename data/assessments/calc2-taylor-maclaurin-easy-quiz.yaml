schemaVersion: 1
id: calc2-taylor-maclaurin-easy-quiz
title: Taylor and Maclaurin Series Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: taylor-maclaurin
skills:
- Construct Taylor coefficients and polynomials
- Transform known series by substitution, differentiation, and integration
- Determine radii, endpoints, and function-equality conditions
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - taylor-maclaurin
  - easy
  - series-representations
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - identify-taylor-coefficients
  prompt: |
    What is the coefficient of $(x-a)^n$ in the Taylor series of $f$ about $a$?
  choices:
  - id: a
    text: $f^{(n)}(a)/n!$
  - id: b
    text: $f(a)/n$
  - id: c
    text: $f^{(n)}(x)$
  - id: d
    text: $n!f(a)$
  answer:
    choiceId: a
  explanation: Repeated differentiation at the center isolates the nth coefficient as $f^{(n)}(a)/n!$.
- id: q002
  type: multipleChoice
  skills:
  - distinguish-taylor-and-maclaurin-series
  prompt: |
    A Maclaurin series is a Taylor series centered at which value?
  choices:
  - id: a
    text: $a=0$
  - id: b
    text: $a=1$
  - id: c
    text: $a=e$
  - id: d
    text: |-
      $a=\infty$
  answer:
    choiceId: a
  explanation: “Maclaurin” is the conventional name for the Taylor expansion about zero.
- id: q003
  type: multipleChoice
  skills:
  - construct-exponential-series
  prompt: |
    Which Maclaurin series represents $e^x$?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}x^n/n!$
  - id: b
    text: |-
      $\sum_{n=0}^{\infty}(-1)^nx^n$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}x^n/n$
  - id: d
    text: |-
      $\sum_{n=0}^{\infty}n!x^n$
  answer:
    choiceId: a
  explanation: Every derivative of $e^x$ equals $e^x$ and evaluates to one at zero.
- id: q004
  type: multipleChoice
  skills:
  - recognize-sine-series
  prompt: |
    Which are the first four nonzero Maclaurin terms for $\sin x$?
  choices:
  - id: a
    text: $x-x^3/3!+x^5/5!-x^7/7!$
  - id: b
    text: $1-x^2/2!+x^4/4!-x^6/6!$
  - id: c
    text: $x+x^2+x^3+x^4$
  - id: d
    text: $1+x+x^2/2!+x^3/3!$
  answer:
    choiceId: a
  explanation: The sine derivative cycle vanishes at even orders and alternates signs at odd orders.
- id: q005
  type: multipleChoice
  skills:
  - form-taylor-polynomials
  prompt: |
    What is the degree-four Maclaurin polynomial for $\cos x$?
  choices:
  - id: a
    text: $1-x^2/2!+x^4/4!$
  - id: b
    text: $x-x^3/3!$
  - id: c
    text: $1+x+x^2/2!+x^3/3!+x^4/4!$
  - id: d
    text: $1-x+x^2-x^3+x^4$
  answer:
    choiceId: a
  explanation: Cosine has nonzero even-order coefficients with alternating signs.
- id: q006
  type: multipleChoice
  skills:
  - use-geometric-series-as-a-source
  prompt: |
    For which $x$ is
    $$\frac1{1-x}=\sum_{n=0}^{\infty}x^n$$
    valid?
  choices:
  - id: a
    text: $|x|<1$
  - id: b
    text: |-
      $|x|\le1$
  - id: c
    text: $x>1$
  - id: d
    text: All real $x$
  answer:
    choiceId: a
  explanation: It is a geometric series with ratio $x$, which converges precisely when the ratio magnitude
    is below one.
- id: q007
  type: multipleChoice
  skills:
  - transform-known-series-by-substitution
  prompt: |
    Which series represents $1/(1+x)$ for $|x|<1$?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}(-1)^nx^n$
  - id: b
    text: |-
      $\sum_{n=0}^{\infty}x^n$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}x^n/n$
  - id: d
    text: |-
      $\sum_{n=0}^{\infty}x^{2n}$
  answer:
    choiceId: a
  explanation: |-
    Replace $x$ by $-x$ in $1/(1-x)=\sum x^n$.
- id: q008
  type: multipleChoice
  skills:
  - differentiate-power-series
  prompt: |
    Differentiating $\sum_{n=0}^{\infty}x^n=1/(1-x)$ gives which identity?
  choices:
  - id: a
    text: |-
      $\sum_{n=1}^{\infty}nx^{n-1}=1/(1-x)^2$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}x^{n-1}=1/(1-x)$
  - id: c
    text: |-
      $\sum_{n=0}^{\infty}nx^n=1/(1-x)$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}x^n/n=\ln(1-x)$
  answer:
    choiceId: a
  explanation: Differentiate each $x^n$ to $nx^{n-1}$ and the rational function to $(1-x)^{-2}$.
- id: q009
  type: multipleChoice
  skills:
  - integrate-power-series
  prompt: |
    Which series equals $\ln(1+x)$ for $|x|<1$?
  choices:
  - id: a
    text: |-
      $\sum_{n=1}^{\infty}(-1)^{n-1}x^n/n$
  - id: b
    text: |-
      $\sum_{n=0}^{\infty}x^n$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}nx^{n-1}$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}x^n/n!$
  answer:
    choiceId: a
  explanation: |-
    Integrate $1/(1+x)=\sum(-1)^nx^n$ from zero to $x$, using $\ln1=0$.
- id: q010
  type: multipleChoice
  skills:
  - track-radii-under-calculus-operations
  prompt: |
    What happens to the radius of convergence when a power series is
    differentiated term by term?
  choices:
  - id: a
    text: The radius stays the same.
  - id: b
    text: The radius always becomes zero.
  - id: c
    text: The radius doubles.
  - id: d
    text: The radius becomes infinite.
  answer:
    choiceId: a
  explanation: Differentiation changes coefficients by polynomial factors, which do not alter their exponential
    growth rate.
- id: q011
  type: multipleChoice
  skills:
  - test-power-series-endpoints
  prompt: |
    After finding a finite radius $R$, what must be done at $x=a\pm R$?
  choices:
  - id: a
    text: Substitute each endpoint and test the resulting numerical series separately.
  - id: b
    text: Include both endpoints automatically.
  - id: c
    text: Exclude both endpoints automatically.
  - id: d
    text: Differentiate until the endpoints disappear.
  answer:
    choiceId: a
  explanation: Boundary points make the radius test inconclusive and can have different convergence behavior.
- id: q012
  type: multipleChoice
  skills:
  - build-shifted-taylor-polynomials
  prompt: |
    What is the degree-two Taylor polynomial for $\ln x$ centered at $a=1$?
  choices:
  - id: a
    text: $(x-1)-(x-1)^2/2$
  - id: b
    text: $1+x-x^2/2$
  - id: c
    text: $x+x^2/2$
  - id: d
    text: |-
      $\ln1+(x-1)+(x-1)^2/2$
  answer:
    choiceId: a
  explanation: At one, $f(1)=0$, $f'(1)=1$, and $f''(1)=-1$, giving the stated coefficients.
- id: q013
  type: multipleChoice
  skills:
  - evaluate-taylor-approximations
  prompt: |
    Using $T_2(x)=1+x+x^2/2$, approximate $e^{0.2}$.
  choices:
  - id: a
    text: $1.22$
  - id: b
    text: $1.2$
  - id: c
    text: $1.02$
  - id: d
    text: $0.22$
  answer:
    choiceId: a
  explanation: Substitute $0.2$ to get $1+0.2+0.04/2=1.22$.
- id: q014
  type: multipleChoice
  skills:
  - distinguish-formal-series-from-function-equality
  prompt: |
    What must happen for the Taylor series of $f$ at $a$ to equal $f(x)$ at
    a particular $x$?
  choices:
  - id: a
    text: The Taylor remainder $R_n(x)$ must tend to zero.
  - id: b
    text: All derivatives must be positive.
  - id: c
    text: The polynomial degree must remain fixed.
  - id: d
    text: $x$ must equal zero.
  answer:
    choiceId: a
  explanation: Taylor's formula is $f(x)=T_n(x)+R_n(x)$, so equality with the infinite coefficient series
    requires the remainder to vanish.
- id: q015
  type: multipleChoice
  skills:
  - transform-exponential-series
  prompt: |
    Which Maclaurin series represents $e^{-2x}$?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}(-2)^nx^n/n!$
  - id: b
    text: |-
      $\sum_{n=0}^{\infty}2^nx^n$
  - id: c
    text: |-
      $\sum_{n=0}^{\infty}(-1)^nx^n$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}x^n/(2n)!$
  answer:
    choiceId: a
  explanation: |-
    Substitute $u=-2x$ into $e^u=\sum u^n/n!$.
attemptQuestionCount: 15
