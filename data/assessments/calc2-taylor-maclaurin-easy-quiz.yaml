  - id: c
    text: |-
      $\sum_{n=1}^{\infty}x^n/n$
  - id: d
    text: |-
      $\sum_{n=0}^{\infty}n!x^n$
  answer:
    choiceId: a
  explanation: |-
    Solution: Every derivative of $e^x$ equals $e^x$ and evaluates to one at zero. Therefore the answer is $\sum_{n=0}^{\infty}x^n/n!$.

    Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.

