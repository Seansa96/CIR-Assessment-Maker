  prompt: |
    Which are the first four nonzero Maclaurin terms for $\sin x$?
  choices:
  - id: a
    text: $x-x^3/3!+x^5/5!-x^7/7!$
  - id: b
    text: $1-x^2/2!+x^4/4!-x^6/6!$
  - id: c
    text: $x+x^2+x^3+x^4$
  - id: d
    text: $1+x+x^2/2!+x^3/3!$
  answer:
    choiceId: a
  explanation: |-
    Solution: The sine derivative cycle vanishes at even orders and alternates signs at odd orders. Therefore the answer is $x-x^3/3!+x^5/5!-x^7/7!$.

    Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.

