- id: q001
  type: multipleChoice
  skills:
  - identify-taylor-coefficients
  prompt: 'What is the coefficient of $(x-a)^n$ in the Taylor series of $f$ about $a$?

    '
  choices:
  - id: a
    text: $f^{(n)}(a)/n!$
  - id: b
    text: $f(a)/n$
  - id: c
    text: $f^{(n)}(x)$
  - id: d
    text: $n!f(a)$
  answer:
    choiceId: a
  explanation: |-
    Solution: Repeated differentiation at the center isolates the nth coefficient as $f^{(n)}(a)/n!$. Therefore the answer is $f^{(n)}(a)/n!$.

    Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.

    Common trap: Do not confuse the derivative value with its Taylor coefficient; the factorial belongs in every coefficient, including the constant term where $0!=1$.

    Why the other choices fail: $f(a)/n$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $f^{(n)}(x)$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $n!f(a)$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$.
  difficultyDimensions:
  - representationTransfer
  - simplification
  difficultyEvidence: The learner reads the series structure and simplifies it into the requested coefficient, center, or standard representation.
