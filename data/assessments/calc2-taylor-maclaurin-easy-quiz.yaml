  - id: c
    text: $a=e$
  - id: d
    text: |-
      $a=\infty$
  answer:
    choiceId: a
  explanation: |-
    Solution: “Maclaurin” is the conventional name for the Taylor expansion about zero. Therefore the answer is $a=0$.

    Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.

    Common trap: Do not confuse the derivative value with its Taylor coefficient; the factorial belongs in every coefficient, including the constant term where $0!=1$.

    Why the other choices fail: $a=1$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $a=e$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $a=\infty$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$.
