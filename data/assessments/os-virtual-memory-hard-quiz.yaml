questions:
- id: q001
  title: Apply Paging model
  type: multipleChoice
  prompt: A system design discussion mentions **Paging model**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Pages and frames are same-size units.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Pages and frames are same-size units. This is why Paging model matters in Virtual Memory.
