workedExamples:
  - id: polar-coordinate-representation-main
    title: Converting Points, Equivalent Names, and Equations
    problem: |
      Work through three related polar-coordinate tasks:

      1. Convert a polar point to rectangular coordinates.
      2. Rewrite a point using an equivalent polar representation with negative radius.
      3. Convert a polar equation into rectangular form.

      ![Polar coordinate point with radius, angle, and equivalent negative-radius representation](/assessments/calc2-parametric-polar/polar-coordinate-representation-map.svg)
    steps:
      - id: polar-rep-step-001
        title: Identify the coordinate bridge
        instruction: |
          Every polar point $(r,\theta)$ can be converted to rectangular form using component projection:

          $$
          x=r\cos\theta,\qquad y=r\sin\theta.
          $$

          These formulas come from resolving the radius into horizontal and vertical components.
        type: multipleChoice
        prompt: Which formulas convert from polar to rectangular coordinates?
        choices:
          - id: a
            text: '$x=r\cos\theta,\ y=r\sin\theta$'
          - id: b
            text: '$x=r\sin\theta,\ y=r\cos\theta$'
          - id: c
            text: '$x=r+\theta,\ y=r-\theta$'
          - id: d
            text: '$x=\tan\theta,\ y=r^2$'
        answer:
          choiceId: a
        explanation: |
          The $x$-coordinate is adjacent to $\theta$ and the $y$-coordinate is opposite $\theta$.

      - id: polar-rep-step-002
        title: Convert the point $(6,\frac{\pi}{3})$
        instruction: |
          Use:

          $$
          \cos\frac{\pi}{3}=\frac12,\qquad
          \sin\frac{\pi}{3}=\frac{\sqrt3}{2}.
          $$

          Then:

          $$
          x=6\cdot\frac12=3,
          \qquad
          y=6\cdot\frac{\sqrt3}{2}=3\sqrt3.
          $$
        type: multipleChoice
        prompt: What rectangular point is represented by $(6,\frac{\pi}{3})$?
        choices:
          - id: a
            text: '$(3,3\sqrt3)$'
          - id: b
            text: '$(3\sqrt3,3)$'
          - id: c
            text: '$(6,3)$'
          - id: d
            text: '$(-3,-3\sqrt3)$'
        answer:
          choiceId: a
        explanation: |
          The horizontal component is $3$ and the vertical component is $3\sqrt3$.

      - id: polar-rep-step-003
        title: Understand negative radius
        instruction: |
          A negative radius means:

          1. Face the angle $\theta$.
          2. Move backward through the pole.

          Equivalently:

          $$
          (r,\theta)=(-r,\theta+\pi).
          $$
        type: multipleChoice
        prompt: Which point names the same physical point as $(6,\frac{\pi}{3})$ using negative radius?
        choices:
          - id: a
            text: '$(-6,\frac{4\pi}{3})$'
          - id: b
            text: '$(-6,\frac{\pi}{3})$'
          - id: c
            text: '$(6,\frac{4\pi}{3})$'
          - id: d
            text: '$(-3,\frac{\pi}{6})$'
        answer:
          choiceId: a
        explanation: |
          Add $\pi$ to the angle and flip the radius sign: $(6,\frac{\pi}{3})=(-6,\frac{4\pi}{3})$.

      - id: polar-rep-step-004
        title: Add a full rotation
        instruction: |
          Polar angles repeat every full turn:

          $$
          (r,\theta)=(r,\theta+2\pi k)
          $$

          for any integer $k$.
        type: multipleChoice
        prompt: Which point also represents $(6,\frac{\pi}{3})$?
        choices:
          - id: a
            text: '$(6,\frac{7\pi}{3})$'
          - id: b
            text: '$(6,\frac{2\pi}{3})$'
          - id: c
            text: '$(-6,\frac{7\pi}{3})$'
          - id: d
            text: '$(3,\frac{7\pi}{3})$'
        answer:
          choiceId: a
        explanation: |
          $\frac{7\pi}{3}=\frac{\pi}{3}+2\pi$, so it points in the same direction with the same radius.

      - id: polar-rep-step-005
        title: Reverse convert rectangular to polar
        instruction: |
          For a rectangular point $(x,y)$:

          $$
          r^2=x^2+y^2,
          \qquad
          \tan\theta=\frac{y}{x}.
          $$

          For $(3,3\sqrt3)$:

          $$
          r^2=9+27=36,
          \quad r=6.
          $$
        type: numericResponse
        prompt: What positive radius does $(3,3\sqrt3)$ have?
        answer:
          value: 6
          tolerance: 0.000001
        explanation: |
          The radius is the distance from the origin: $\sqrt{3^2+(3\sqrt3)^2}=6$.

      - id: polar-rep-step-006
        title: Convert the angle carefully
        instruction: |
          For $(3,3\sqrt3)$:

          $$
          \tan\theta=\frac{3\sqrt3}{3}=\sqrt3.
          $$

          Since the point is in Quadrant I, the angle is:

          $$
          \theta=\frac{\pi}{3}.
          $$
        type: multipleChoice
        prompt: Why is the angle $\frac{\pi}{3}$ instead of $\frac{4\pi}{3}$ for the positive-radius representation?
        choices:
          - id: a
            text: The point is in Quadrant I, so the positive-radius angle is in Quadrant I.
          - id: b
            text: Tangent can never be positive in Quadrant III.
          - id: c
            text: Positive radius always means $\theta=0$.
          - id: d
            text: The radius must equal the angle.
        answer:
          choiceId: a
        explanation: |
          Tangent alone does not determine the quadrant. The signs of $x$ and $y$ do.

      - id: polar-rep-step-007
        title: Start equation conversion
        instruction: |
          Now convert the polar equation:

          $$
          r=4\sin\theta.
          $$

          The useful move is to multiply by $r$:

          $$
          r^2=4r\sin\theta.
          $$
        type: multipleChoice
        prompt: Why multiply by $r$ before converting?
        choices:
          - id: a
            text: It creates $r^2$ and $r\sin\theta$, which convert cleanly.
          - id: b
            text: It changes sine into cosine.
          - id: c
            text: It removes the need for algebra.
          - id: d
            text: It proves the graph is a line.
        answer:
          choiceId: a
        explanation: |
          $r^2=x^2+y^2$ and $r\sin\theta=y$.

      - id: polar-rep-step-008
        title: Substitute rectangular expressions
        instruction: |
          From

          $$
          r^2=4r\sin\theta,
          $$

          use:

          $$
          r^2=x^2+y^2,
          \qquad
          r\sin\theta=y.
          $$
        type: multipleChoice
        prompt: What rectangular equation comes from $r^2=4r\sin\theta$?
        choices:
          - id: a
            text: '$x^2+y^2=4y$'
          - id: b
            text: '$x^2+y^2=4x$'
          - id: c
            text: '$x+y=4$'
          - id: d
            text: '$x^2-y^2=4y$'
        answer:
          choiceId: a
        explanation: |
          Replace $r^2$ with $x^2+y^2$ and $r\sin\theta$ with $y$.

      - id: polar-rep-step-009
        title: Complete the square
        instruction: |
          Convert:

          $$
          x^2+y^2=4y
          $$

          to standard circle form:

          $$
          x^2+y^2-4y=0.
          $$

          Complete the square in $y$:

          $$
          y^2-4y=(y-2)^2-4.
          $$
        type: multipleChoice
        prompt: What is the standard form of $x^2+y^2=4y$?
        choices:
          - id: a
            text: '$x^2+(y-2)^2=4$'
          - id: b
            text: '$(x-2)^2+y^2=4$'
          - id: c
            text: '$x^2+(y+2)^2=4$'
          - id: d
            text: '$x^2+y^2=2$'
        answer:
          choiceId: a
        explanation: |
          Completing the square gives a circle centered at $(0,2)$ with radius $2$.

      - id: polar-rep-step-010
        title: Interpret the converted curve
        instruction: |
          The equation

          $$
          x^2+(y-2)^2=4
          $$

          is a circle centered at $(0,2)$ with radius $2$. It passes through the origin because its center is two units above the origin and its radius is two.
        type: multipleChoice
        prompt: What kind of curve is $r=4\sin\theta$?
        choices:
          - id: a
            text: A circle centered at $(0,2)$ with radius $2$.
          - id: b
            text: A circle centered at $(2,0)$ with radius $2$.
          - id: c
            text: A cardioid.
          - id: d
            text: A rose curve.
        answer:
          choiceId: a
        explanation: |
          The sine term places the circle on the vertical axis.

      - id: polar-rep-step-011
        title: Generalize the strategy
        instruction: |
          For conversion problems, choose the identity that creates the cleanest rectangular expression:

          - $r^2=x^2+y^2$
          - $r\cos\theta=x$
          - $r\sin\theta=y$
          - $\tan\theta=\frac{y}{x}$

          If an equation has a bare $\sin\theta$ or $\cos\theta$, multiplying by $r$ is often the key move.
        type: selectAll
        prompt: Which expressions convert directly to rectangular variables?
        choices:
          - id: a
            text: '$r^2$'
          - id: b
            text: '$r\cos\theta$'
          - id: c
            text: '$r\sin\theta$'
          - id: d
            text: '$\theta+r$'
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: |
          These become $x^2+y^2$, $x$, and $y$ respectively.

      - id: polar-rep-step-012
        title: Final summary
        instruction: |
          The key ideas are:

          - Polar points can have many names.
          - Negative radius moves opposite the angle.
          - Rectangular conversion uses component formulas.
          - Equation conversion often works by creating $r^2$, $r\cos\theta$, or $r\sin\theta$.
        type: multipleChoice
        prompt: What is the most important warning when converting rectangular points to polar form?
        choices:
          - id: a
            text: Check the quadrant; tangent alone does not determine the angle.
          - id: b
            text: Always use a negative radius.
          - id: c
            text: Never use the Pythagorean theorem.
          - id: d
            text: The radius is always the same as the angle.
        answer:
          choiceId: a
        explanation: |
          Since tangent repeats every $\pi$, quadrant information is essential.
