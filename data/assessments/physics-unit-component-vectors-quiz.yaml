questions:
- id: q001
  type: multipleChoice
  prompt: Which ordered triple matches $4\hat{i}-6\hat{j}+2\hat{k}$?
  choices:
  - id: a
    text: $(4,-6,2)$
  - id: b
    text: $(-4,6,-2)$
  - id: c
    text: $(4,6,2)$
  - id: d
    text: $(2,-6,4)$
  answer:
    choiceId: a
  explanation: 'Read the coefficients of $\hat{i}$, $\hat{j}$, and $\hat{k}$ in order.
    The exact technique is component identification: $\hat{i}\to x$, $\hat{j}\to y$,
    and $\hat{k}\to z$.

    '
- id: q002
  type: multipleChoice
  prompt: If $\vec{A}=2\hat{i}+3\hat{j}$ and $\vec{B}=-5\hat{i}+\hat{j}$, what is
    $\vec{A}+\vec{B}$?
  choices:
  - id: a
    text: $-3\hat{i}+4\hat{j}$
  - id: b
    text: $7\hat{i}+2\hat{j}$
  - id: c
    text: $-3\hat{i}+2\hat{j}$
  - id: d
    text: $3\hat{i}-4\hat{j}$
  answer:
    choiceId: a
  explanation: 'Add like components: $(2,3)+(-5,1)=(-3,4)$. The exact choice is componentwise
    vector addition.

    '
- id: q003
  type: multipleChoice
  prompt: If $\vec{A}=7\hat{i}-2\hat{j}$ and $\vec{B}=3\hat{i}+4\hat{j}$, what is
    $\vec{A}-\vec{B}$?
  choices:
  - id: a
    text: $4\hat{i}-6\hat{j}$
  - id: b
    text: $10\hat{i}+2\hat{j}$
  - id: c
    text: $4\hat{i}+2\hat{j}$
  - id: d
    text: $-4\hat{i}+6\hat{j}$
  answer:
    choiceId: a
  explanation: 'Subtract component by component: $(7,-2)-(3,4)=(4,-6)$. The exact
    technique is subtracting the opposite vector.

    '
- id: q004
  type: multipleChoice
  prompt: If $\vec{C}=-2\hat{i}+5\hat{j}-\hat{k}$, what is $-3\vec{C}$?
  choices:
  - id: a
    text: $6\hat{i}-15\hat{j}+3\hat{k}$
  - id: b
    text: $-6\hat{i}+15\hat{j}-3\hat{k}$
  - id: c
    text: $6\hat{i}+15\hat{j}+3\hat{k}$
  - id: d
    text: $-5\hat{i}+2\hat{j}-3\hat{k}$
  answer:
    choiceId: a
  explanation: 'Multiply every component by $-3$. The exact technique is scalar multiplication
    of a vector.

    '
- id: q005
  type: multipleChoice
  prompt: For $\vec{A}=(1,-4,2)$ and $\vec{B}=(3,0,-5)$, what is $2\vec{A}+\vec{B}$?
  choices:
  - id: a
    text: $(5,-8,-1)$
  - id: b
    text: $(5,-4,-3)$
  - id: c
    text: $(7,-8,-6)$
  - id: d
    text: $(-1,-8,9)$
  answer:
    choiceId: a
  explanation: 'First scale: $2\vec{A}=(2,-8,4)$. Then add $\vec{B}$ to get $(5,-8,-1)$.
    The exact technique is a linear combination of component vectors.

    '
- id: q006
  type: selectAll
  prompt: Which statements are true about $\hat{i}$, $\hat{j}$, and $\hat{k}$?
  choices:
  - id: a
    text: $\hat{i}$ points along the $x$-axis.
  - id: b
    text: $\hat{j}$ points along the $y$-axis.
  - id: c
    text: $\hat{k}$ points along the $z$-axis.
  - id: d
    text: They all point in the same direction.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: 'The exact concept is the standard Cartesian unit basis. Each unit
    vector marks one perpendicular coordinate direction.

    '
- id: q007
  type: multipleChoice
  prompt: A position changes from $\vec{r}_i=-3\hat{i}+2\hat{j}$ m to $\vec{r}_f=4\hat{i}-5\hat{j}$
    m. What is $\Delta\vec{r}$?
  choices:
  - id: a
    text: $7\hat{i}-7\hat{j}$ m
  - id: b
    text: $\hat{i}-3\hat{j}$ m
  - id: c
    text: $-7\hat{i}+7\hat{j}$ m
  - id: d
    text: $-12\hat{i}-10\hat{j}$ m
  answer:
    choiceId: a
  explanation: 'Use final minus initial: $(4,-5)-(-3,2)=(7,-7)$. The exact technique
    is displacement from position vectors.

    '
- id: q008
  type: multipleChoice
  prompt: Which expression correctly combines only like vector components?
  choices:
  - id: a
    text: $(2\hat{i}+3\hat{j})+(4\hat{i}-\hat{j})=6\hat{i}+2\hat{j}$
  - id: b
    text: $(2\hat{i}+3\hat{j})+(4\hat{i}-\hat{j})=9\hat{i}$
  - id: c
    text: $(2\hat{i}+3\hat{j})+(4\hat{i}-\hat{j})=5\hat{j}$
  - id: d
    text: $(2\hat{i}+3\hat{j})+(4\hat{i}-\hat{j})=6\hat{j}+2\hat{i}$
  answer:
    choiceId: a
  explanation: 'The exact technique is like-component collection: $2\hat{i}+4\hat{i}=6\hat{i}$
    and $3\hat{j}-\hat{j}=2\hat{j}$.

    '
