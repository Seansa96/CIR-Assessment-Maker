  prompt: "**In-Order Traversal**\n\nWrite a Python function `inorder_traversal(root)` that takes the\
    \ root of a Binary Tree and returns a list containing the values of the nodes visited in an **in-order**\
    \ traversal (Left, Node, Right).\n\n```python\nclass TreeNode:\n    def __init__(self, value):\n \
    \       self.value = value\n        self.left = None\n        self.right = None\n        \ndef inorder_traversal(root):\n\
    \    # Your code here\n    pass\n```\n"
  answer:
    gradingMode: automatic
    codeLanguage: python
    testCases:
    - input: 'root = TreeNode(10)

        root.left = TreeNode(5)

        root.right = TreeNode(15)

        inorder_traversal(root)

        '
      expectedOutput: '[5, 10, 15]'
    - input: inorder_traversal(None)
      expectedOutput: '[]'
    - input: 'root = TreeNode(1)

        root.right = TreeNode(2)

        root.right.left = TreeNode(3)

        inorder_traversal(root)

        '
      expectedOutput: '[1, 3, 2]'
  explanation: "Solution:\n```python\ndef inorder_traversal(root):\n    if root is None:\n        return\
    \ []\n        \n    left_vals = inorder_traversal(root.left)\n    right_vals = inorder_traversal(root.right)\n\
    \    \n    return left_vals + [root.value] + right_vals\n```\n*(Note: You can also use a helper function\
    \ that appends to a shared list).*\n\nWhy it works:\nThe base case returns an empty list if the node\
    \ is `None`. The recursive step first gathers all values from the left subtree (`left_vals`), then\
    \ takes the current node's value (`[root.value]`), and finally gathers all values from the right subtree\
    \ (`right_vals`). It concatenates them in that exact order: Left -> Node -> Right.\n"
