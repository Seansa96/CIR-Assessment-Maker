schemaVersion: 1
id: ec-ch5-quiz
title: Operational Amplifier Quiz
assessmentType: quiz
categoryId: electronics-and-circuits
subcategoryIds:
- ec-operational-amplifier
modeDefault: practice
questions:
- id: q001
  type: multipleChoice
  prompt: Which of the following is an assumption of an ideal operational amplifier?
  explanation: An ideal op-amp has infinite open-loop gain and infinite input resistance.
  choices:
  - id: a
    text: Infinite open-loop gain
  - id: b
    text: Zero input resistance
  - id: c
    text: Zero bandwidth
  - id: d
    text: Infinite output resistance
  answer:
    choiceId: a
- id: q002
  type: multipleChoice
  prompt: In an ideal op-amp with negative feedback, what is the current entering
    the inverting terminal?
  explanation: The ideal assumption is that $i_- = i_+ = 0$.
  choices:
  - id: a
    text: Zero
  - id: b
    text: Infinite
  - id: c
    text: Same as the output current
  - id: d
    text: Equal to the supply current
  answer:
    choiceId: a
