  # -- Period 1 --------------------------------------------------------------
  - id: an-001-name
    type: flashcard
    prompt: 'What is the name and symbol of element #1?'
    answer:
      expected: Hydrogen (H)
      aliases: [H, hydrogen]
    explanation: Hydrogen (H), atomic number 1. Period 1, Group 1A. The lightest element.
    tags: [period-1, atomic-number]

  - id: an-001-number
    type: cloze
    prompt: 'Hydrogen has the atomic number ____.'
    answer:
      expected: '1'
    explanation: Hydrogen is element #1 — one proton in its nucleus.
    tags: [period-1, atomic-number]

  - id: an-002-name
    type: flashcard
    prompt: 'What is the name and symbol of element #2?'
    answer:
      expected: Helium (He)
      aliases: [He, helium]
    explanation: Helium (He), atomic number 2. Period 1, Group 8A. First noble gas.
    tags: [period-1, atomic-number]

  - id: an-002-number
    type: cloze
    prompt: 'Helium has the atomic number ____.'
    answer:
      expected: '2'
    explanation: Helium has 2 protons. It has a full 1s2 shell, making it the first noble gas.
    tags: [period-1, atomic-number]

