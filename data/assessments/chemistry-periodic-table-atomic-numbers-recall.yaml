  # -- Summary drills ---------------------------------------------------------
  - id: an-d-block-start
    type: cloze
    prompt: 'The d-block (transition metals) of Period 4 begins at atomic number ____ (Scandium).'
    answer:
      expected: '21'
    explanation: >-
      After calcium (20), the 3d subshell begins filling at Sc (21), starting the first
      row of transition metals which runs from Sc (21) through Zn (30).
    tags: [d-block, period-4, atomic-number]

  - id: an-iron-copper-zinc
    type: typed
    prompt: 'Give the atomic numbers of iron, copper, and zinc.'
    answer:
      expected: Fe = 26, Cu = 29, Zn = 30
      aliases: [iron 26, copper 29, zinc 30, 26 29 30]
    explanation: >-
      Iron (Fe) = 26, Copper (Cu) = 29, Zinc (Zn) = 30. These three are among the most
      commonly tested transition metals in introductory chemistry.
    tags: [period-4, d-block, atomic-number]

  - id: an-noble-gases-40
    type: typed
    prompt: 'List the noble gases found in elements 1–40 with their atomic numbers.'
    answer:
      expected: He (2), Ne (10), Ar (18), Kr (36)
      aliases: [helium 2, neon 10, argon 18, krypton 36]
    explanation: >-
      Noble gases in elements 1-40: He (2), Ne (10), Ar (18), Kr (36). Each closes a
      period with a filled valence shell.
    tags: [group-8a, noble-gases, atomic-number]

  - id: an-halogens-40
    type: typed
    prompt: 'List the halogens found in elements 1–40 with their atomic numbers.'
    answer:
      expected: F (9), Cl (17), Br (35)
      aliases: [fluorine 9, chlorine 17, bromine 35]
    explanation: >-
      Halogens in elements 1-40: F (9), Cl (17), Br (35). Each sits one column to the
      left of the corresponding noble gas in their period.
    tags: [group-7a, halogens, atomic-number]

  - id: an-alkali-metals-40
    type: typed
    prompt: 'List the alkali metals (Group 1A) found in elements 1–40 with their atomic numbers.'
    answer:
      expected: H (1), Li (3), Na (11), K (19), Rb (37)
      aliases: [hydrogen 1, lithium 3, sodium 11, potassium 19, rubidium 37]
    explanation: >-
      Group 1A metals in elements 1-40: H (1) — the special nonmetal, Li (3), Na (11),
      K (19), Rb (37). Each loses one electron to form a 1+ ion.
    tags: [group-1a, alkali-metals, atomic-number]

  - id: an-alkaline-earth-40
    type: typed
    prompt: 'List the alkaline earth metals (Group 2A) found in elements 1–40 with their atomic numbers.'
    answer:
      expected: Be (4), Mg (12), Ca (20), Sr (38)
      aliases: [beryllium 4, magnesium 12, calcium 20, strontium 38]
    explanation: >-
      Group 2A in elements 1-40: Be (4), Mg (12), Ca (20), Sr (38). Each forms a 2+ ion.
    tags: [group-2a, alkaline-earth, atomic-number]
