workedExamples:
- id: we-nslr-1
  title: Mass on a Pulley
  problem: A block of mass $m = 2.0 \text{ kg}$ hangs from a string wrapped around
    a uniform solid cylinder pulley of mass $M = 4.0 \text{ kg}$ and radius $R = 0.1
    \text{ m}$. The system is released from rest. Find the downward acceleration of
    the block.
  steps:
  - id: we-nslr-1-step1
    title: 'Step 1: FBD and Equations'
    instruction: Write Newton's Second Law for the block (translation) and the pulley
      (rotation). Let downward be positive for the block.
    prompt: Write the two force/torque equations.
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'Translation: $mg - T = ma$'
      - 'Rotation: $TR = I\alpha$'
      - 'MOI: $I = \frac{1}{2}MR^2$'
    explanation: |
      Solution: Write $mg-T=ma$ for the block and $TR=I\alpha$ for the pulley.

      Why it works: The same string tension produces translation of the block and torque on the pulley.
  - id: we-nslr-1-step2
    title: 'Step 2: Kinematic Constraint'
    instruction: Substitute the no-slip condition $a = \alpha R$ into the rotational
      equation to find $T$ in terms of $a$.
    prompt: What is $T$?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $TR = (\frac{1}{2}MR^2)(a/R)$
      - $T = \frac{1}{2}Ma$
    explanation: |
      Solution: Substitute $I=\tfrac12MR^2$ and $\alpha=a/R$ into $TR=I\alpha$ to obtain $T=\tfrac12Ma$.

      Why it works: The no-slip condition converts the pulley’s angular acceleration into the block’s linear acceleration.
  - id: we-nslr-1-step3
    title: 'Step 3: Solve for a'
    instruction: Substitute $T$ back into the translational equation and solve for
      $a$. Use $g=9.8$.
    prompt: What is $a$ in $\text{m/s}^2$?
    type: numericResponse
    answer:
      value: 4.9
      tolerance: 0.1
    explanation: |
      Solution: $mg-\tfrac12Ma=ma$, so $a=mg/(m+\tfrac12M)=2(9.8)/(2+2)=4.9$ m/s$^2$.

      Why it works: The block’s gravitational drive is shared between linear acceleration and accelerating the pulley's rotation.
