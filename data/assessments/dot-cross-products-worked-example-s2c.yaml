workedExamples:
- id: example-001
  title: Build and verify a normal vector
  problem: Let $\mathbf u=\langle1,0,1\rangle$ and $\mathbf v=\langle0,2,1\rangle$. Find a normal vector to their plane and verify it.
  steps:
  - id: s001
    title: Choose the operation
    instruction: A normal must be perpendicular to both spanning vectors.
    hint: A dot product is a scalar; choose the operation that returns a perpendicular vector.
    type: multipleChoice
    prompt: Which operation should produce the normal vector?
    choices:
    - id: a
      text: cross product
      media: []
      issueSignals: []
    - id: b
      text: dot product
      media: []
      issueSignals: []
    - id: c
      text: vector addition
      media: []
      issueSignals: []
    - id: d
      text: scalar multiplication
      media: []
      issueSignals: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: Use the cross product. Why it works: $\mathbf u\times\mathbf v$ is perpendicular to both inputs. Why the other choices fail: b is scalar; c stays in the plane; d only rescales an input.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: s002
    title: Set up the determinant
    instruction: Put the standard basis vectors in the first row, then the components of $\mathbf u$ and $\mathbf v$.
    hint: Preserve the order $\mathbf u\times\mathbf v$.
    type: multipleChoice
    prompt: Which determinant represents $\mathbf u\times\mathbf v$?
    choices:
    - id: a
      text: $\begin{vmatrix}\mathbf i&\mathbf j&\mathbf k\\1&0&1\\0&2&1\end{vmatrix}$
      media: []
      issueSignals: []
    - id: b
      text: $\begin{vmatrix}\mathbf i&\mathbf j&\mathbf k\\0&2&1\\1&0&1\end{vmatrix}$
      media: []
      issueSignals: []
    - id: c
      text: $\begin{vmatrix}1&0&1\\0&2&1\end{vmatrix}$
      media: []
      issueSignals: []
    - id: d
      text: $\begin{vmatrix}\mathbf i&\mathbf j&\mathbf k\\1&0&1\\0&1&2\end{vmatrix}$
      media: []
      issueSignals: []
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: Choose the determinant with $\mathbf u$ as the second row and $\mathbf v$ as the third. Why it works: This preserves the requested order. Why the other choices fail: b reverses order; c omits the basis row; d changes $\mathbf v$.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: s003
    title: Compute the x-component
    instruction: Use the $\mathbf i$ cofactor $0(1)-1(2)$.
    hint: The x-component is the determinant of the last two columns.
    type: numericResponse
    prompt: What is the x-component of $\mathbf u\times\mathbf v$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
