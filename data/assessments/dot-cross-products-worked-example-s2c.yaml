workedExamples:
- id: example-001
  title: Build the representation
  problem: 'Find a normal vector to the plane containing $\langle1,0,1\rangle$ and $\langle0,2,1\rangle$.'
  steps:
  - id: s001
    title: Select the operation
    instruction: What operation produces a normal?
    type: multipleChoice
    prompt: What operation produces a normal?
    choices:
    - id: a
      text: cross product
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: trigonometric-identity-misapplied
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: trigonometric-identity-misapplied
    answer:
      choiceId: a
    issueSignals:
    - id: trigonometric-identity-misapplied
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: cross product

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s002
    title: Compute components
    instruction: 'What is $\langle1,0,1\rangle\times\langle0,2,1\rangle$?'
    type: multipleChoice
    prompt: 'What is $\langle1,0,1\rangle\times\langle0,2,1\rangle$?'
    choices:
    - id: a
      text: '$\langle-2,-1,2\rangle$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: trigonometric-identity-misapplied
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: trigonometric-identity-misapplied
    answer:
      choiceId: a
    issueSignals:
    - id: trigonometric-identity-misapplied
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle-2,-1,2\rangle$

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s003
    title: Interpret
    instruction: Why is the result useful?
    type: multipleChoice
    prompt: Why is the result useful?
    choices:
    - id: a
      text: It is perpendicular to both spanning vectors.
    - id: b
      text: Use an unrelated formula.
      issueSignals:
