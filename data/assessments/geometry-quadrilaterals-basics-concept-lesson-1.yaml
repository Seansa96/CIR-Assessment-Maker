lesson:
  introduction: |-
    A quadrilateral is any polygon with exactly four sides. However, when we force those sides or angles to follow certain rules (like being parallel or equal), we create special quadrilaterals that fit into a strict hierarchy.
  sections:
  - id: sec-parallelograms
    title: Parallelograms
    required: true
    content: |-
      The most important family of quadrilaterals is the **Parallelogram**. A parallelogram is defined as a quadrilateral where both pairs of opposite sides are parallel.
      
      Because the sides are parallel, several other properties are guaranteed to be true:
      1. Opposite sides are equal in length (congruent).
      2. Opposite angles are equal in measure (congruent).
      3. Consecutive angles are supplementary (they add up to $180^\circ$).
      4. The two diagonals bisect each other (cut each other perfectly in half).

  - id: sec-hierarchy
    title: Rectangles, Rhombi, and Squares
    required: true
    content: |-
      As we add more rules, we move down the hierarchy:
      
      - **Rectangle**: A parallelogram with four right angles ($90^\circ$). Because it is a parallelogram, it keeps all parallelogram rules, plus its diagonals are equal in length.
      - **Rhombus**: A parallelogram with four equal sides. It keeps all parallelogram rules, plus its diagonals are perpendicular ($90^\circ$) to each other and bisect the angles.
      - **Square**: A square is the ultimate quadrilateral. It is a rectangle AND a rhombus. Therefore, it has four right angles, four equal sides, and its diagonals are equal, perpendicular, and bisect each other!

questions:
- id: q-geom-quad-1
  title: Concept Check - Parallelogram Diagonals
  prompt: |-
    In parallelogram $ABCD$, the diagonals intersect at point $E$. If the distance from $A$ to $E$ is $7$, what is the distance from $A$ to $C$?
  type: numericResponse
  answer:
    numericValue: 14
    tolerance: 0
  explanation: |-
    In a parallelogram, the diagonals bisect each other. This means point $E$ is the exact midpoint of diagonal $AC$. If $AE$ is $7$, then $EC$ is also $7$, making the entire diagonal $14$.
  skills:
  - geometry-quadrilaterals-basics

- id: q-geom-quad-2
  title: Concept Check - The Hierarchy
  prompt: |-
    True or False: Every rectangle is a square.
  type: multipleChoice
  choices:
  - id: c1
    text: True
  - id: c2
    text: False
  answer:
    choiceId: c2
  explanation: |-
    **False**. A square is a type of rectangle (because a square has four right angles), but a rectangle is NOT always a square (because a rectangle does not have to have four equal sides). The hierarchy flows from Square up to Rectangle, not the other way around.
  skills:
  - geometry-quadrilaterals-basics
