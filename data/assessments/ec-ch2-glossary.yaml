glossary:
  sections:
  - id: ch2-terms
    title: Terms
    required: true
    entries:
    - id: ideal-voltage-source
      term: Ideal Voltage Source
      definition: A circuit element that maintains a prescribed voltage across its
        terminals regardless of current.
      drills:
      - id: ideal-voltage-source-drill
        prompt: What maintains a prescribed voltage regardless of current?
        answer:
          expected: Ideal Voltage Source
        type: typed
    - id: ideal-current-source
      term: Ideal Current Source
      definition: A circuit element that maintains a prescribed current regardless
        of voltage.
      drills:
      - id: ideal-current-source-drill
        prompt: What is the point where two or more elements join?
        answer:
          expected: Node
        type: typed
    - id: dependent-source
      term: Dependent Source
      definition: A source whose voltage or current depends on a variable elsewhere
        in the circuit.
      drills:
      - id: dependent-source-drill
        prompt: What law states the sum of voltages in a loop is zero?
        answer:
          expected: Kirchhoff's Voltage Law (KVL)
        type: typed
    - id: ohms-law
      term: Ohm's Law
      definition: The mathematical relationship $v = iR$.
      drills:
      - id: ohms-law-drill
        prompt: What represents the mathematical relationship $v=iR$?
        answer:
          expected: Ohm's Law
        type: typed
    - id: node
      term: Node
      definition: A point where two or more circuit elements join.
      drills:
      - id: node-drill
        prompt: What law states the sum of currents at a node is zero?
        answer:
          expected: Kirchhoff's Current Law (KCL)
        type: typed
    - id: loop
      term: Loop
      definition: A closed path in a circuit.
      drills:
      - id: loop-drill
        prompt: What maintains a prescribed voltage regardless of current?
        answer:
          expected: Ideal Voltage Source
        type: typed
    - id: kirchhoffs-current-law-kcl
      term: Kirchhoff's Current Law (KCL)
      definition: The algebraic sum of all currents at any node is zero.
      drills:
      - id: kirchhoffs-current-law-kcl-drill
        prompt: What is the point where two or more elements join?
        answer:
          expected: Node
        type: typed
    - id: kirchhoffs-voltage-law-kvl
      term: Kirchhoff's Voltage Law (KVL)
      definition: The algebraic sum of all voltages around any closed path is zero.
      drills:
      - id: kirchhoffs-voltage-law-kvl-drill
        prompt: What law states the sum of voltages in a loop is zero?
        answer:
          expected: Kirchhoff's Voltage Law (KVL)
        type: typed
  introduction: Review these terms carefully.
