lesson:
  introduction: >
    This lesson develops a repeatable way to solve Electrical Energy & Power problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch09-electrical-power-s1
    title: Name the model and quantities
    required: true
    content: >
      Electrical Energy & Power uses P = IV = I^2R = V^2/R. In the name the model and quantities stage, select the equivalent power form whose known quantities match the circuit branch.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Electrical Energy & Power problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch09-electrical-power-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Electrical Energy & Power, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use P = IV = I^2R = V^2/R after you select the equivalent power form whose known quantities match the circuit branch.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Electrical Energy & Power problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-electrical-power-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables P = IV = I^2R = V^2/R relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-electrical-power-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Electrical Energy & Power.
        media: []
        issueSignals:
        - id: physics2-physics2-ch09-electrical-power-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
