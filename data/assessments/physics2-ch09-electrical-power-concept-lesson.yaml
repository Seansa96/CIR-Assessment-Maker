- id: l3-sec1
  title: Power in Circuits
  explanation: The rate at which electrical energy is transferred to a circuit component
    is $P = IV$. For a resistor obeying Ohm's Law, this can be written as $P = I^2R
    = \frac{V^2}{R}$.
