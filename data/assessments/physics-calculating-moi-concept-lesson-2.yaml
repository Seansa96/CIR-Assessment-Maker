lesson:
  introduction: We now apply Calculating Moi to complex, multi-body physical systems.
  sections:
  - id: sec-1
    title: Complex Systems
    content: When applying Calculating Moi to systems with multiple interconnected
      moving parts, conservation laws become our most powerful tools. If net external
      torque is zero, angular momentum is conserved.
    media: []
    check:
      id: chk-physics-calculating-moi-3
      type: multipleChoice
      prompt: When can you assume angular momentum is conserved?
      choices:
      - id: a
        text: Always.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Only when the object is isolated from gravity.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: c
        text: When the net external torque is zero.
      answer:
        choiceId: c
      explanation: 'Solution:

        When the net external torque is zero.


        Why it works:

        $\tau_{net} = dL/dt$. If $\tau_{net} = 0$, then $dL/dt = 0$, meaning $L$ is
        constant.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-2
    title: Problem Solving Strategy
    content: '1. Identify the system and the axis of rotation.

      2. Draw a free-body diagram.

      3. Determine all torques and forces.

      4. Apply Newton''s Second Law for rotation and translation simultaneously.'
    media: []
    check:
      id: chk-physics-calculating-moi-4
      type: multipleChoice
      prompt: What is the first step in solving a complex rotational dynamics problem?
      choices:
      - id: a
        text: Pick an arbitrary equation.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Identify the system and the axis of rotation.
      - id: c
        text: Plug in all known numbers immediately.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Identify the system and the axis of rotation.


        Why it works:

        A clear understanding of the system boundary and the pivot axis is required
        before any equations can be written.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
