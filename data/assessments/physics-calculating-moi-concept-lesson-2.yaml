lesson:
  introduction: We now apply Calculating Moi to complex, multi-body physical systems.
  sections:
  - id: sec-1
    title: Complex Systems
    content: When applying Calculating Moi to systems with multiple interconnected
      moving parts, conservation laws become our most powerful tools. If net external
      torque is zero, angular momentum is conserved.
    media: []
    check:
      id: chk-physics-calculating-moi-3
      type: multipleChoice
      prompt: When can you assume angular momentum is conserved?
      choices:
      - id: a
        text: Always.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Only when the object is isolated from gravity.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: c
        text: When the net external torque is zero.
      answer:
        choiceId: c
      explanation: 'Solution:

        When the net external torque is zero.


        Why it works:

        $\tau_{net} = dL/dt$. If $\tau_{net} = 0$, then $dL/dt = 0$, meaning $L$ is
        constant.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Continuous Distributions
    content: 'For continuous mass, replace the sum with $I=\int r^2\,dm$.'
    media: []
    check: { id: chk-cmoi-10, type: multipleChoice, prompt: 'What operation replaces a sum for continuous mass?', choices: [{ id: a, text: derivative }, { id: b, text: integral }, { id: c, text: cross product }, { id: d, text: division only }], answer: { choiceId: b }, explanation: 'Solution: Use an integral.\n\nWhy it works: Continuous mass is assembled from infinitesimal elements.\n\nWhy the other choices fail: They do not sum distributed contributions.' }
  - id: sec-4
    title: Choose a Mass Element
    content: 'Express $dm$ from a linear, surface, or volume density appropriate to the geometry.'
    media: []
    check: { id: chk-cmoi-11, type: multipleChoice, prompt: 'For a uniform thin rod, $dm$ is commonly:', choices: [{ id: a, text: '$\lambda dx$' }, { id: b, text: '$Mdx^2$' }, { id: c, text: '$Id\theta$' }, { id: d, text: '$\tau dr$' }], answer: { choiceId: a }, explanation: 'Solution: $dm=\lambda dx$.\n\nWhy it works: Linear density is mass per length.\n\nWhy the other choices fail: They have incompatible units or quantities.' }
  - id: sec-5
    title: Symmetry
    content: 'Symmetry locates center-of-mass axes and can make cross terms cancel in an inertia derivation.'
    media: []
    check: { id: chk-cmoi-12, type: multipleChoice, prompt: 'Symmetry is especially useful for locating:', choices: [{ id: a, text: center of mass }, { id: b, text: temperature }, { id: c, text: charge only }, { id: d, text: time }], answer: { choiceId: a }, explanation: 'Solution: Center of mass.\n\nWhy it works: Symmetric mass distributions balance about their symmetry center.\n\nWhy the other choices fail: They are unrelated to mass geometry.' }
  - id: sec-6
    title: Axis Labels
    content: 'State the axis in words and on a diagram before selecting or deriving an inertia formula.'
    media: []
    check: { id: chk-cmoi-13, type: multipleChoice, prompt: 'Why must an inertia axis be specified?', choices: [{ id: a, text: inertia depends on axis }, { id: b, text: mass changes }, { id: c, text: units vanish }, { id: d, text: torque is zero }], answer: { choiceId: a }, explanation: 'Solution: Inertia depends on axis.\n\nWhy it works: Distances to the axis enter $\sum mr^2$.\n\nWhy the other choices fail: Mass and units are not changed by a label.' }
  - id: sec-7
    title: Verification
    content: 'Check limits, symmetry, units, and whether moving mass outward increases the result.'
    media: []
    check: { id: chk-cmoi-14, type: multipleChoice, prompt: 'A useful inertia sanity check is that moving mass outward should:', choices: [{ id: a, text: increase inertia }, { id: b, text: decrease inertia always }, { id: c, text: leave inertia unchanged }, { id: d, text: remove units }], answer: { choiceId: a }, explanation: 'Solution: It increases inertia.\n\nWhy it works: Contributions contain $r^2$.\n\nWhy the other choices fail: They contradict the radius-squared weighting.' }
  - id: sec-2
    title: Problem Solving Strategy
    content: '1. Identify the system and the axis of rotation.

      2. Draw a free-body diagram.

      3. Determine all torques and forces.

      4. Apply Newton''s Second Law for rotation and translation simultaneously.'
    media: []
    check:
      id: chk-physics-calculating-moi-4
      type: multipleChoice
      prompt: What is the first step in solving a complex rotational dynamics problem?
      choices:
      - id: a
        text: Pick an arbitrary equation.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Identify the system and the axis of rotation.
      - id: c
        text: Plug in all known numbers immediately.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Identify the system and the axis of rotation.


        Why it works:

        A clear understanding of the system boundary and the pivot axis is required
        before any equations can be written.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
