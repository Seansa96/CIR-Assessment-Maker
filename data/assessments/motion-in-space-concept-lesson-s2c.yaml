  - id: s05
    title: Initial conditions
    required: true
    content: Integrating acceleration gives velocity and then position. Initial velocity and initial position determine the two constant vectors.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: Why are initial conditions needed when acceleration is integrated twice?
      choices:
      - id: a
        text: Each integration introduces an unknown constant vector.
        media: []
        issueSignals: []
      - id: b
        text: Acceleration has no units.
        media: []
        issueSignals:
        - id: units-role-confusion
          domains: []
      - id: c
        text: The speed must be constant.
        media: []
        issueSignals:
        - id: acceleration-speed-confusion
          domains: []
      - id: d
        text: A cross product has two possible directions.
        media: []
        issueSignals:
        - id: operation-selection-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
