  - id: s02
    title: Velocity is tangent
    required: true
    content: Instantaneous velocity is $\mathbf v(t)=\mathbf r'(t)$, a tangent vector pointing in the direction of motion.
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: If $\mathbf r(t)=\langle t^2,3t,\sin t\rangle$, which vector is $\mathbf v(t)$?
      choices:
      - id: a
        text: $\langle2t,3,\cos t\rangle$
        media: []
        issueSignals: []
      - id: b
        text: $\langle t^2,3t,\sin t\rangle$
        media: []
        issueSignals:
        - id: position-velocity-confusion
          domains: []
      - id: c
        text: $\langle2,0,-\sin t\rangle$
        media: []
        issueSignals:
        - id: derivative-order-error
          domains: []
      - id: d
        text: $\sqrt{t^4+9+\sin^2t}$
        media: []
        issueSignals:
        - id: vector-scalar-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Differentiate componentwise to obtain $\langle2t,3,\cos t\rangle$.


        Why it works: The derivative of a vector function is the vector of component derivatives.


        Why the other choices fail: b is position, c is a second derivative, and d is a scalar.
      media: []
