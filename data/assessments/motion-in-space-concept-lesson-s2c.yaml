  - id: s06
    title: Projectile acceleration
    required: true
    content: With positive $y$ upward and no air resistance, gravity gives $\mathbf a=\langle0,-g\rangle$.
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: Which acceleration models a projectile under gravity with positive $y$ upward?
