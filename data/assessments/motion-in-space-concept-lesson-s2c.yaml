  - id: s03
    title: Speed is scalar
    required: true
    content: Speed is $|\mathbf v(t)|=|\mathbf r'(t)|$, a nonnegative scalar.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: A particle has $\mathbf v(2)=\langle-3,4,0\rangle$. What is its speed?
      choices:
      - id: a
        text: $5$
        media: []
        issueSignals: []
      - id: b
        text: $\langle-3,4,0\rangle$
        media: []
        issueSignals:
        - id: vector-scalar-confusion
          domains: []
      - id: c
        text: $-5$
        media: []
        issueSignals:
        - id: speed-sign-error
          domains: []
      - id: d
        text: $7$
        media: []
        issueSignals:
        - id: magnitude-formula-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $|\mathbf v(2)|=\sqrt{(-3)^2+4^2}=5$.


        Why it works: Speed is the Euclidean magnitude of velocity.


        Why the other choices fail: b is a vector, c gives magnitude a sign, and d adds components.
