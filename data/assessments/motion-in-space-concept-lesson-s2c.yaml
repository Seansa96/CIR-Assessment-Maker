lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 1 → The Derivative if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Position determines motion
    required: true
    content: 'A position vector locates an object; its derivative is velocity and its second derivative is acceleration. In Motion in Space, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
    media:
    - type: image
      src: /media/calculus-3/motion.svg
      alt: Original motion in space reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What is velocity in terms of position?
      choices:
      - id: a
        text: r'(t)
        media: []
        issueSignals: []
      - id: b
        text: v'(t) (answers 'What is acceleration in terms of velocity?', not 'What is velocity in terms of position?')
        media: []
        issueSignals:
        - id: chain-rule-missed
          domains: []
      - id: c
        text: magnitude of velocity (answers 'What is speed?', not 'What is velocity in terms of position?')
        media: []
        issueSignals:
        - id: chain-rule-missed
          domains: []
      - id: d
        text: 5 (answers 'If $\mathbf v=\langle3,4,0\rangle$, what is speed?', not 'What is velocity in terms of position?')
        media: []
        issueSignals:
        - id: chain-rule-missed
          domains: []
      answer:
        choiceId: a
