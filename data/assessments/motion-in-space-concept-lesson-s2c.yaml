          domains: []
      - id: c
        text: $\langle0,g\rangle$
        media: []
        issueSignals:
        - id: gravity-sign-error
          domains: []
      - id: d
        text: $\langle v_0\cos\alpha,v_0\sin\alpha\rangle$
        media: []
        issueSignals:
        - id: velocity-acceleration-confusion
          domains: []
