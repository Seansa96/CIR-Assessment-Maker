  - id: s07
    title: Tangential and normal components
    required: true
    content: In $\mathbf a=a_T\mathbf T+a_N\mathbf N$, $a_T=dv/dt$ changes speed and $a_N=\kappa v^2$ changes direction.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: During uniform circular motion, which statement is true?
      choices:
      - id: a
        text: $a_T=0$ and acceleration is normal to the path.
        media: []
        issueSignals: []
      - id: b
        text: $a_N=0$ because speed is constant.
        media: []
        issueSignals:
        - id: normal-acceleration-confusion
          domains: []
      - id: c
        text: Acceleration is tangent because velocity is tangent.
        media: []
        issueSignals:
        - id: tangent-normal-role-confusion
          domains: []
      - id: d
        text: Acceleration is zero because speed is constant.
        media: []
        issueSignals:
        - id: constant-speed-acceleration-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $a_T=0$, while the acceleration is inward along the normal direction.


        Why it works: Direction change changes velocity even when speed stays fixed.


        Why the other choices fail: b, c, and d omit the inward acceleration that turns velocity.
