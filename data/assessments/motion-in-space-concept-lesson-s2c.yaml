lesson:
  introduction: Motion begins with position. Its first derivative describes instantaneous motion; its second derivative describes how motion changes.
  sections:
  - id: s01
    title: Average velocity
    required: true
    content: For position $\mathbf r(t)$, average velocity over $[t,t+h]$ is $[\mathbf r(t+h)-\mathbf r(t)]/h$.
    media:
    - type: image
      src: /media/calculus-3/motion.svg
      alt: A curved path with position
      caption: The three vectors have distinct roles in motion.
    check:
      id: check-01
      type: multipleChoice
      prompt: Which expression is average velocity from $t$ to $t+h$?
      choices:
      - id: a
        text: $[\mathbf r(t+h)-\mathbf r(t)]/h$
        media: []
        issueSignals: []
      - id: b
        text: $\mathbf r(t+h)-\mathbf r(t)$
        media: []
        issueSignals:
        - id: time-interval-omitted
          domains: []
      - id: c
        text: $\mathbf r'(t+h)-\mathbf r'(t)$
        media: []
        issueSignals:
        - id: displacement-velocity-confusion
          domains: []
      - id: d
        text: $|\mathbf r(t)|$
        media: []
        issueSignals:
        - id: position-magnitude-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Divide displacement $\mathbf r(t+h)-\mathbf r(t)$ by elapsed time $h$.


        Why it works: Velocity is a rate of change of position.


        Why the other choices fail: b is displacement, c compares derivatives, and d is a position magnitude.
