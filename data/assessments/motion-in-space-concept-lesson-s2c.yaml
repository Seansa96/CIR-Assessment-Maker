  - id: s04
    title: Acceleration
    required: true
    content: Acceleration is $\mathbf a(t)=\mathbf v'(t)=\mathbf r''(t)$; it changes velocity.
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: If $\mathbf v(t)=\langle t^2,4,-2t\rangle$, what is $\mathbf a(t)$?
      choices:
      - id: a
        text: $\langle2t,0,-2\rangle$
        media: []
        issueSignals: []
      - id: b
        text: $\langle t^2,4,-2t\rangle$
        media: []
        issueSignals:
        - id: velocity-acceleration-confusion
          domains: []
      - id: c
        text: $\langle2,0,0\rangle$
        media: []
        issueSignals:
        - id: derivative-order-error
          domains: []
      - id: d
        text: $\sqrt{t^4+16+4t^2}$
        media: []
        issueSignals:
        - id: vector-scalar-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
