schemaVersion: 1
id: law-of-sines
title: Law of Sines
assessmentType: quiz
categoryId: trigonometry
subcategoryIds:
  - law-of-sines
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "Which formula states the Law of Sines?"
    choices:
      - id: a
        text: '\frac{a}{\sin A}=\frac{b}{\sin B}=\frac{c}{\sin C}'
      - id: b
        text: 'c^2=a^2+b^2-2ab\cos C'
      - id: c
        text: '\sin(A+B)=\sin A\cos B+\cos A\sin B'
      - id: d
        text: 'a^2+b^2=c^2'
    answer:
      choiceId: a
    explanation: |
      The Law of Sines compares each side length with the sine of its opposite angle.

      Related topic: Law of Sines Formula
  - id: q002
    type: multipleChoice
    prompt: "When is the Law of Sines usually useful?"
    choices:
      - id: a
        text: "When a side-angle opposite pair is known"
      - id: b
        text: "Only when all three sides are known"
      - id: c
        text: "Only for right triangles"
      - id: d
        text: "Only when no angles are known"
    answer:
      choiceId: a
    explanation: |
      The Law of Sines requires at least one matching side and opposite angle pair to build a proportion.

      Related topic: Identifying Side-Angle Opposite Pairs
  - id: q003
    type: multipleChoice
    prompt: "A triangle has A=40 degrees, B=70 degrees, and side a=8. Which setup can find side b?"
    choices:
      - id: a
        text: '\frac{b}{\sin70^\circ}=\frac{8}{\sin40^\circ}'
      - id: b
        text: 'b^2=8^2+70^2-2(8)(70)\cos40^\circ'
      - id: c
        text: '\frac{b}{70}=\frac{8}{40}'
      - id: d
        text: 'b=8\sin40^\circ'
    answer:
      choiceId: a
    explanation: |
      Side $b$ is opposite angle $B=70^\circ$, and side $a=8$ is opposite angle $A=40^\circ$.

      Related topic: Solving ASA/AAS Triangles
  - id: q004
    type: multipleChoice
    prompt: "If A=30 degrees, a=5, and b=8, what kind of Law of Sines case is this?"
    choices:
      - id: a
        text: "SSA, possibly ambiguous"
      - id: b
        text: "SSS"
      - id: c
        text: "SAS"
      - id: d
        text: "A right triangle only"
    answer:
      choiceId: a
    explanation: |
      Two sides and a non-included angle form SSA, where zero, one, or two triangles may be possible.

      Related topic: Ambiguous Case of Law of Sines
  - id: q005
    type: multipleChoice
    prompt: "Which equation could find angle B if side b and a full opposite pair A/a are known?"
    choices:
      - id: a
        text: '\frac{\sin B}{b}=\frac{\sin A}{a}'
      - id: b
        text: 'B=A+b-a'
      - id: c
        text: '\cos B=\frac{a^2+c^2-b^2}{2ac}'
      - id: d
        text: '\sin B=ab'
    answer:
      choiceId: a
    explanation: |
      The Law of Sines can be written with sines over sides or sides over sines as long as opposite pairs match.

      Related topic: Finding Angles with Law of Sines
  - id: q006
    type: multipleChoice
    prompt: "Which information is enough to use Law of Sines immediately?"
    choices:
      - id: a
        text: "A=50 degrees, a=12, B=80 degrees"
      - id: b
        text: "a=5, b=7, c=9"
      - id: c
        text: "a=5, b=7, included angle C=40 degrees"
      - id: d
        text: "Only A=40 degrees"
    answer:
      choiceId: a
    explanation: |
      A known opposite pair $A$ and $a$ plus another angle lets you set up a Law of Sines proportion.

      Related topic: Law of Sines Given AAS/ASA
  - id: q007
    type: multipleChoice
    prompt: "If two angles of a triangle are 45 degrees and 65 degrees, what should you do before using Law of Sines for the third side?"
    choices:
      - id: a
        text: "Find the third angle using 180 degrees"
      - id: b
        text: "Square all side lengths"
      - id: c
        text: "Use cosine first"
      - id: d
        text: "Assume it is a right triangle"
    answer:
      choiceId: a
    explanation: |
      The angles of a triangle sum to $180^\circ$, and Law of Sines pairs each side with its opposite angle.

      Related topic: Triangle Angle Sum Before Law of Sines
  - id: q008
    type: multipleChoice
    prompt: "In Law of Sines, side a must be paired with which angle?"
    choices:
      - id: a
        text: "Angle A"
      - id: b
        text: "Angle B"
      - id: c
        text: "Angle C"
      - id: d
        text: "Any angle"
    answer:
      choiceId: a
    explanation: |
      Standard triangle notation pairs lowercase side names with the opposite uppercase angle names.

      Related topic: Opposite Side-Angle Notation
  - id: q009
    type: multipleChoice
    prompt: "Which situation is better for Law of Cosines than Law of Sines?"
    choices:
      - id: a
        text: "Three sides are known"
      - id: b
        text: "Two angles and one side are known"
      - id: c
        text: "A side-angle opposite pair is known"
      - id: d
        text: "AAS information is given"
    answer:
      choiceId: a
    explanation: |
      With SSS information, no opposite side-angle pair is known, so Law of Cosines is the natural starting point.

      Related topic: Choosing Between Law of Sines and Law of Cosines
  - id: q010
    type: multipleChoice
    prompt: 'If $\sin B=\frac{1}{2}$ in an SSA triangle, why should you be cautious?'
    choices:
      - id: a
        text: "There may be two possible angles with that sine value"
      - id: b
        text: "Sine values cannot be fractions"
      - id: c
        text: "The triangle must be impossible"
      - id: d
        text: "Law of Sines never finds angles"
    answer:
      choiceId: a
    explanation: |
      In SSA cases, an acute angle and its supplement can have the same sine, creating the ambiguous case.

      Related topic: Ambiguous SSA Case
