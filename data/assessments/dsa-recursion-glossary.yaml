glossary:
  sections:
    - title: "Core Concepts"
      entries:
        - term: "Recursion"
          definition: "A problem-solving strategy and programming technique where a function calls itself to solve a smaller instance of the same problem."
        - term: "Base Case"
          definition: "The branch of a recursive function that does not make a recursive call, used to terminate the recursion."
        - term: "Recursive Case"
          definition: "The branch of a recursive function that breaks the problem into a smaller sub-problem and makes a call to itself."
        - term: "Call Stack"
          definition: "The internal memory structure used by a computer program to keep track of active subroutines (like recursive function calls) and their local variables before they return."
