workedExamples:
- id: we01
  title: Falling with linear resistance
  problem: Solve $v'=9.8-0.5v$, $v(0)=0$, with downward positive.
  steps:
  - id: we01-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Identify equilibrium and rate.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - terminal speed
      - rate
    explanation: |-
      Solution: $v_T=9.8/0.5=19.6$ m/s and the transient rate is $0.5$ s$^{-1}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Solve the IVP.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - solution
      - initial value
    explanation: |-
      Solution: $v(t)=19.6(1-e^{-0.5t})$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Verify direction and limit.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - ODE
      - sign
      - limit
    explanation: |-
      Solution: $v'=9.8e^{-0.5t}=9.8-0.5v$, $v\ge0$, and $v\to19.6$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Upward quadratic-drag branch
  problem: Solve $v'=-(1+v^2)$, $v(0)=1$, until the apex.
  steps:
  - id: we02-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Separate on the upward branch.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - branch
      - separation
    explanation: |-
      Solution: $dv/(1+v^2)=-dt$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Apply initial data.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - integration
      - constant
    explanation: |-
      Solution: $\arctan v=\pi/4-t$, so $v=\tan(\pi/4-t)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Locate the branch endpoint.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - apex
      - valid interval
    explanation: |-
      Solution: The first $v=0$ occurs at $t=\pi/4$; the upward formula is used on $0\le t\le\pi/4$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Escape-speed derivation
  problem: A particle is launched radially from $r_0$ under $r''=-GM/r^2$.
  steps:
  - id: we03-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Reduce using velocity as a function of radius.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - chain rule
      - reduction
    explanation: |-
      Solution: $v,dv/dr=-GM/r^2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Integrate from initial data.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - integral
      - constant
    explanation: |-
      Solution: $\frac12(v^2-v_0^2)=GM(1/r-1/r_0)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Apply the escape condition.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - infinite-radius limit
      - threshold
    explanation: |-
      Solution: At threshold $v\to0$ as $r\to\infty$, giving $v_0=\sqrt{2GM/r_0}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
