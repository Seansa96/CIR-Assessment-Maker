questions:
- id: q1
  type: numericResponse
  prompt: A centrifuge accelerates from $20 \text{ rad/s}$ to $40 \text{ rad/s}$ while
    undergoing $150 \text{ rad}$ of angular displacement. What is its angular acceleration?
  answer:
    value: 4.0
    tolerance: 0.5
  explanation: $\omega_f^2 = \omega_0^2 + 2\alpha\theta \implies 1600 = 400 + 300\alpha
    \implies \alpha = 1200 / 300 = 4.0 \text{ rad/s}^2$.
