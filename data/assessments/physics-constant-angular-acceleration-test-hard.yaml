questions:
- id: q001
  title: Spin-up from rpm
  type: numericResponse
  prompt: |-
    A motor speeds a disk from $120\text{ rpm}$ to $600\text{ rpm}$ in $8.0\text{ s}$. What is $\alpha$?
  answer:
    value: 6.283
    tolerance: 0.03
  explanation: |-
    $120\text{ rpm}=4\pi$ and $600\text{ rpm}=20\pi\text{ rad/s}$, so $\alpha=2\pi$.
- id: q002
  title: Revolutions during spin-up
  type: numericResponse
  prompt: |-
    A wheel starts from rest and reaches $30\text{ rad/s}$ in $10\text{ s}$. How many revolutions occur?
  answer:
    value: 23.87
    tolerance: 0.1
  explanation: |-
    $\theta=15(10)=150\text{ rad}$, so revolutions $=150/(2\pi)=23.9$.
- id: q003
  title: Braking alpha
  type: numericResponse
  prompt: |-
    A wheel at $40\text{ rad/s}$ stops after $20$ revolutions. What is $\alpha$?
  answer:
    value: -6.366
    tolerance: 0.05
  explanation: |-
    $20\text{ rev}=40\pi\text{ rad}$. $0=40^2+2\alpha(40\pi)$, so $\alpha=-6.37$.
- id: q004
  title: Two-phase motion
  type: numericResponse
  prompt: |-
    A rotor starts at $5\text{ rad/s}$, accelerates at $2\text{ rad/s}^2$ for $6\text{ s}$, then continues at final speed for $4\text{ s}$. What total angle is covered?
  answer:
    value: 134.0
    tolerance: 0.5
  explanation: |-
    First phase $\theta_1=66\text{ rad}$ and $\omega_f=17\text{ rad/s}$. Second phase $\theta_2=68\text{ rad}$. Total $134\text{ rad}$.
- id: q005
  title: Same sign
  type: multipleChoice
  prompt: |-
    If $\omega_i$ and $\alpha$ are both positive, then:
  choices:
  - id: a
    text: |-
      angular speed increases
  - id: b
    text: |-
      the wheel must slow
  - id: c
    text: |-
      the wheel reverses immediately
  - id: d
    text: |-
      angular displacement must be negative
  answer:
    choiceId: a
  explanation: |-
    Same signs mean speeding up.
- id: q006
  title: Quadratic time
  type: numericResponse
  prompt: |-
    A wheel starts at $4\text{ rad/s}$ with $\alpha=2\text{ rad/s}^2$. How long to rotate $60\text{ rad}$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $60=4t+t^2$, giving positive root $t=6\text{ s}$.
- id: q007
  title: Find initial speed
  type: numericResponse
  prompt: |-
    A wheel rotates $80\text{ rad}$ in $5.0\text{ s}$ while $\alpha=4.0\text{ rad/s}^2$. What was $\omega_i$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $80=5\omega_i+50$, so $\omega_i=6\text{ rad/s}$.
- id: q008
  title: Reverse stopping point
  type: numericResponse
  prompt: |-
    A wheel has $\omega_i=10\text{ rad/s}$ and $\alpha=-4\text{ rad/s}^2$. What angular displacement occurs before it first stops?
  answer:
    value: 12.5
    tolerance: 0.05
  explanation: |-
    $0=10^2+2(-4)\theta$, so $\theta=12.5\text{ rad}$.
- id: q009
  title: Angle between speeds
  type: numericResponse
  prompt: |-
    A rotor speeds from $8$ to $20\text{ rad/s}$ with $\alpha=3\text{ rad/s}^2$. Through what angle?
  answer:
    value: 56.0
    tolerance: 0.2
  explanation: |-
    $\theta=(400-64)/6=56\text{ rad}$.
- id: q010
  title: Radians
  type: multipleChoice
  prompt: |-
    Why use radians in rotational kinematics?
  choices:
  - id: a
    text: |-
      Radians connect arc length by $s=r\theta$.
  - id: b
    text: |-
      Degrees make torque zero.
  - id: c
    text: |-
      Radians only matter when $\alpha=0$.
  - id: d
    text: |-
      No conversion is ever needed.
  answer:
    choiceId: a
  explanation: |-
    Radians preserve the direct connection between angular and linear measures.
- id: q011
  title: Signed alpha
  type: numericResponse
  prompt: |-
    $\omega$ changes linearly from $-6$ to $10\text{ rad/s}$ in $8\text{ s}$. What is $\alpha$?
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: |-
    $\alpha=(10-(-6))/8=2.0\text{ rad/s}^2$.
- id: q012
  title: Signed displacement
  type: numericResponse
  prompt: |-
    $\omega_i=-12\text{ rad/s}$ and $\alpha=3\text{ rad/s}^2$ for $6\text{ s}$. What is $\theta$?
  answer:
    value: -18.0
    tolerance: 0.1
  explanation: |-
    $\theta=-12(6)+\frac12(3)(36)=-18\text{ rad}$.
- id: q013
  title: Final signed speed
  type: numericResponse
  prompt: |-
    $\omega_i=-12\text{ rad/s}$ and $\alpha=3\text{ rad/s}^2$ for $6\text{ s}$. What is $\omega_f$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $\omega_f=-12+3(6)=6\text{ rad/s}$.
- id: q014
  title: Revolutions braking
  type: numericResponse
  prompt: |-
    A wheel slows from $50$ to $10\text{ rad/s}$ in $8\text{ s}$. How many revolutions does it make?
  answer:
    value: 38.2
    tolerance: 0.2
  explanation: |-
    $\theta=30(8)=240\text{ rad}$, or $240/(2\pi)=38.2$ revolutions.
- id: q015
  title: Acceleration from angle and time
  type: numericResponse
  prompt: |-
    A rotor starts at $7\text{ rad/s}$ and turns $95\text{ rad}$ in $10\text{ s}$. What is $\alpha$?
  answer:
    value: 0.5
    tolerance: 0.02
  explanation: |-
    $95=70+50\alpha$, so $\alpha=0.50\text{ rad/s}^2$.
