questions:
- id: q1
  type: numericResponse
  prompt: A toy gyroscope has a mass of $0.1 \text{ kg}$, its center of mass is $0.05
    \text{ m}$ from the pivot, and it spins at $100 \text{ rad/s}$. If its moment
    of inertia is $2.0 \times 10^{-4} \text{ kg}\cdot\text{m}^2$, what is its precession
    rate in rad/s? ($g=9.8 \text{ m/s}^2$)
  answer:
    value: 2.45
    tolerance: 0.1
  explanation: $\Omega = \frac{mgR}{I\omega} = \frac{0.1(9.8)(0.05)}{2 \times 10^{-4}
    (100)} = \frac{0.049}{0.02} = 2.45 \text{ rad/s}$.
