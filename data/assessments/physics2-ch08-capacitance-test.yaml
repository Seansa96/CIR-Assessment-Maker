- id: q010
  type: freeResponse
  skills:
  - physics2-ch08-capacitance-dielectric-model
  prompt: A dielectric of kappa=3 is inserted in an isolated capacitor. Compare C, Q, V, and U with original values.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - C triples
    - Q fixed
    - V and U become one third.
  explanation: 'Solution: C triples; Q fixed; V and U become one third.


    Why it works: Fixed charge makes V=Q/C and U=Q^2/(2C).'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
