- id: q001
  type: freeResponse
  skills:
  - physics2-ch08-modeling
  prompt: A Capacitance situation emphasizes capacitance definition. Define the system and sign convention, state
    when $C=Q/V$ applies, and construct a written solution that includes the relation, units, assumptions, and a
    limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $C=Q/V$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Capacitance model of charge storage and electric energy is reliable only when its relation,
    conditions, and interpretation are kept together.'
