questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - multi-step
  prompt: A $4.0\text{ }\mu\text{F}$ capacitor is charged to $12\text{ V}$ and then
    disconnected from the battery. A dielectric with $\kappa = 3.0$ is then inserted,
    completely filling the space between the plates. What is the new potential difference
    across the plates (in Volts)?
  answer:
    numericValue: 4.0
    tolerance: 0.1
  explanation: 'Solution:

    1) Disconnecting the battery means the charge $Q$ is constant.

    2) Initial charge: $Q = C_0 V_0$.

    3) New capacitance: $C = \kappa C_0 = 3 C_0$.

    4) New voltage: $V = \frac{Q}{C} = \frac{C_0 V_0}{3 C_0} = \frac{V_0}{3}$.

    5) Calculate: $V = 12 / 3 = 4.0\text{ V}$.


    Why it works:

    The dielectric increases the capacitance, meaning the same amount of charge now
    requires less voltage.'
