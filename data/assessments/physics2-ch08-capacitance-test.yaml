- id: q012
  type: symbolicResponse
  skills:
  - physics2-ch08-capacitance-capacitor-combinations
  prompt: Express capacitor energy U using charge Q and capacitance C.
  answer:
    expectedLatex: Q^2/(2*C)
    equivalenceMode: simplify
    variables:
    - Q
    - C
    tolerance: 1.0e-06
  explanation: 'Solution: Substitute V=Q/C to obtain U=Q^2/(2C).


    Why it works: The equivalent energy forms follow from the capacitance definition.'
