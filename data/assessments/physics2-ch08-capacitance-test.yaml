- id: q009
  type: selectAll
  skills:
  - physics2-ch08-capacitance-dielectrics
  prompt: Select the correct ideal rules for capacitor combinations.
  answer:
    choiceIds:
    - a
    - b
  explanation: 'Solution: Series branches share charge and their voltage drops add; parallel branches share voltage
    and their charges add.


    Why it works: The connection constraints determine the equivalent-capacitance rules.


    The unselected statements either ignore the stated constraint or apply the wrong relation.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch08-capacitance-dielectrics
