- id: q008
  type: freeResponse
  skills:
  - physics2-ch08-capacitance-capacitor-energy
  prompt: A 2 microF and 4 microF series pair is across 12 V. Find common charge and individual voltage drops.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Ceq=4/3 microF
    - Q=16 microC
    - V2=8 V, V4=4 V.
  explanation: 'Solution: Ceq=4/3 microF; Q=16 microC; V2=8 V, V4=4 V.


    Why it works: Series charge is common and voltage divides inversely with capacitance.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch08-capacitance-capacitor-energy
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
