- id: q007
  type: numericResponse
  skills:
  - physics2-ch08-capacitance-capacitor-combinations
  prompt: A coaxial capacitor has L=0.50 m, a=1 mm, b=2 mm. Enter C in farads.
  answer:
    value: 4.01e-11
    tolerance: 3.0e-13
  explanation: 'Solution: C=2 pi epsilon0 L/ln(2)=4.01e-11 F.


    Why it works: The radial field integrates to a logarithmic potential difference.'
  difficultyDimensions:
