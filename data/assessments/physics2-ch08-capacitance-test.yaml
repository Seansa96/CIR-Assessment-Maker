- id: q004
  type: numericResponse
  skills:
  - physics2-ch08-capacitance-dielectrics
  prompt: A plate capacitor has area 0.020 m^2 and gap 1.0 mm. Enter vacuum capacitance in farads.
  answer:
    value: 1.77e-10
    tolerance: 1.0e-12
  explanation: 'Solution: C=epsilon0 A/d=1.77e-10 F.


    Why it works: The parallel-plate model is C=epsilon0 A/d.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
