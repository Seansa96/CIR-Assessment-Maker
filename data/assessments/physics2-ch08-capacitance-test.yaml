questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch08-capacitance-capacitance-definition
  prompt: A 4 microF capacitor is charged to 12 V. Find Q and stored energy.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Q=48 microC
    - U=2.88e-4 J.
  explanation: 'Solution: Q=48 microC; U=2.88e-4 J.


    Why it works: Q=CV and U=half CV squared.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
