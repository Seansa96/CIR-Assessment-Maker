- id: q005
  type: numericResponse
  skills:
  - physics2-ch08-capacitance-dielectric-model
  prompt: An isolated capacitor has Q=12 microC and C doubles from 3 to 6 microF. Enter new voltage in V.
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: 'Solution: V=2 V; U=12 microJ.


    Why it works: Q stays fixed after disconnect; V=Q/C and U=Q^2/(2C).'
  difficultyDimensions:
