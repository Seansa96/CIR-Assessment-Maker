- id: q002
  type: numericResponse
  skills:
  - physics2-ch08-capacitance-capacitor-combinations
  prompt: Find equivalent capacitance of 6 and 3 microF capacitors in series, in microF.
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: 'Solution: Ceq=2 microF.


    Why it works: Reciprocals add for series capacitors.'
