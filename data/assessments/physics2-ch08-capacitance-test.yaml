- id: q011
  type: multipleChoice
  skills:
  - physics2-ch08-capacitance-capacitance-definition
  prompt: An ideal battery stays connected while a dielectric is inserted. Which quantity remains fixed?
  answer:
    choiceId: a
  explanation: 'Solution: The battery fixes V; C, Q, and U increase as the dielectric raises capacitance.


    Why it works: The battery maintains the terminal potential difference.


    Why the other choices fail: The other quantities depend on capacitance and therefore change.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
