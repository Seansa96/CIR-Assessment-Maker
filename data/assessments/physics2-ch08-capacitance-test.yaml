  extensionObjectiveIds:
  - physics2-ch08-capacitance-dielectrics
  choices:
  - id: a
    text: Series capacitors carry equal charge magnitude.
  - id: b
    text: Parallel capacitors share the same voltage.
  - id: c
    text: Series equivalent capacitance is the sum.
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
