- id: q006
  type: numericResponse
  skills:
  - physics2-ch08-capacitance-capacitance-definition
  prompt: A battery holds V=4 V while C rises from 2 to 6 microF. Enter new charge in microC.
  answer:
    value: 24.0
    tolerance: 0.1
  explanation: 'Solution: Q=40 microC; U=200 microJ.


    Why it works: V is fixed by the battery; Q=CV and U=half CV squared.'
