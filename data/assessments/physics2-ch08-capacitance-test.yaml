- id: q003
  type: numericResponse
  skills:
  - physics2-ch08-capacitance-capacitor-energy
  prompt: Find equivalent capacitance of 6 and 3 microF capacitors in parallel, in microF.
  answer:
    value: 9.0
    tolerance: 0.02
  explanation: 'Solution: Ceq=9 microF.


    Why it works: Capacitances add in parallel at common voltage.'
