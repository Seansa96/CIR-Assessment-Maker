schemaVersion: 1
id: chemistry-binary-ionic-type-i-naming-quiz
title: Binary Ionic Compounds Type I Naming Quiz
assessmentType: quiz
categoryId: chemistry
subcategoryIds:
  - chemistry-compounds
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      What is the correct name for NaCl?
    choices:
      - id: a
        text: sodium chloride
      - id: b
        text: sodium chlorine
      - id: c
        text: sodium(I) chloride
      - id: d
        text: monosodium monochloride
    answer:
      choiceId: a
    explanation: |
      Sodium is a fixed-charge Group 1A metal, so no Roman numeral is used. Chlorine becomes chloride. The name is sodium chloride.

  - id: q002
    type: multipleChoice
    prompt: |
      What is the correct name for MgO?
    choices:
      - id: a
        text: magnesium oxide
      - id: b
        text: magnesium oxygen
      - id: c
        text: magnesium(II) oxide
      - id: d
        text: monomagnesium monoxide
    answer:
      choiceId: a
    explanation: |
      Magnesium is a fixed-charge Group 2A metal and oxygen becomes oxide. Type I ionic names do not use prefixes or Roman numerals.

  - id: q003
    type: multipleChoice
    prompt: |
      What is the correct formula for calcium bromide?
    choices:
      - id: a
        text: CaBr2
      - id: b
        text: Ca2Br
      - id: c
        text: CaBr
      - id: d
        text: Ca2Br2
    answer:
      choiceId: a
    explanation: |
      Calcium forms Ca2+ and bromide is Br-. Two bromide ions are needed to balance one calcium ion, giving CaBr2.

  - id: q004
    type: multipleChoice
    prompt: |
      What is the correct name for Al2O3?
    choices:
      - id: a
        text: aluminum oxide
      - id: b
        text: dialuminum trioxide
      - id: c
        text: aluminum(III) oxide
      - id: d
        text: aluminum oxygen
    answer:
      choiceId: a
    explanation: |
      Aluminum is treated as a fixed-charge 3+ metal in Type I naming. Oxygen becomes oxide. Do not use molecular prefixes for ionic compounds.

  - id: q005
    type: multipleChoice
    prompt: |
      What is the correct formula for potassium sulfide?
    choices:
      - id: a
        text: K2S
      - id: b
        text: KS
      - id: c
        text: KS2
      - id: d
        text: K2S2
    answer:
      choiceId: a
    explanation: |
      Potassium forms K+ and sulfide is S2-. Two potassium ions balance one sulfide ion, so the formula is K2S.

  - id: q006
    type: multipleChoice
    prompt: |
      What is the correct name for Li3N?
    choices:
      - id: a
        text: lithium nitride
      - id: b
        text: trilithium nitrogen
      - id: c
        text: lithium nitrate
      - id: d
        text: lithium(III) nitride
    answer:
      choiceId: a
    explanation: |
      Lithium forms Li+ and nitrogen as a binary anion becomes nitride, N3-. Li3N is lithium nitride. Nitrate would be a polyatomic ion, not this binary compound.

  - id: q007
    type: multipleChoice
    prompt: |
      What is the correct formula for barium chloride?
    choices:
      - id: a
        text: BaCl2
      - id: b
        text: Ba2Cl
      - id: c
        text: BaCl
      - id: d
        text: Ba2Cl2
    answer:
      choiceId: a
    explanation: |
      Barium forms Ba2+ and chloride forms Cl-. Two chloride ions are required to balance one barium ion.

  - id: q008
    type: multipleChoice
    prompt: |
      What is the correct name for SrF2?
    choices:
      - id: a
        text: strontium fluoride
      - id: b
        text: strontium fluorine
      - id: c
        text: strontium difluoride
      - id: d
        text: strontium(II) fluoride
    answer:
      choiceId: a
    explanation: |
      Strontium is a fixed-charge Group 2A metal. Fluorine becomes fluoride. The subscript 2 is not named with a prefix in ionic nomenclature.

  - id: q009
    type: multipleChoice
    prompt: |
      What is the correct formula for aluminum phosphide?
    choices:
      - id: a
        text: AlP
      - id: b
        text: Al3P
      - id: c
        text: AlP3
      - id: d
        text: Al2P3
    answer:
      choiceId: a
    explanation: |
      Aluminum is Al3+ and phosphide is P3-. The charges cancel in a 1:1 ratio, giving AlP.

  - id: q010
    type: multipleChoice
    prompt: |
      What is the correct name for Ca3P2?
    choices:
      - id: a
        text: calcium phosphide
      - id: b
        text: calcium phosphorus
      - id: c
        text: calcium phosphate
      - id: d
        text: tricalcium diphosphide
    answer:
      choiceId: a
    explanation: |
      Calcium forms Ca2+ and phosphorus becomes phosphide, P3-. The charge balance produces Ca3P2, named calcium phosphide.

  - id: q011
    type: multipleChoice
    prompt: |
      What is the correct formula for sodium oxide?
    choices:
      - id: a
        text: Na2O
      - id: b
        text: NaO
      - id: c
        text: NaO2
      - id: d
        text: Na2O2
    answer:
      choiceId: a
    explanation: |
      Sodium is Na+ and oxide is O2-. Two sodium ions are needed for one oxide ion, giving Na2O.

  - id: q012
    type: multipleChoice
    prompt: |
      What is the correct name for BeI2?
    choices:
      - id: a
        text: beryllium iodide
      - id: b
        text: beryllium iodine
      - id: c
        text: beryllium diiodide
      - id: d
        text: beryllium(II) iodide
    answer:
      choiceId: a
    explanation: |
      Beryllium is a fixed-charge Group 2A metal and iodine becomes iodide. Type I names do not need Roman numerals.

  - id: q013
    type: multipleChoice
    prompt: |
      What is the correct formula for cesium nitride?
    choices:
      - id: a
        text: Cs3N
      - id: b
        text: CsN
      - id: c
        text: CsN3
      - id: d
        text: Cs2N3
    answer:
      choiceId: a
    explanation: |
      Cesium is Cs+ and nitride is N3-. Three cesium ions balance one nitride ion, giving Cs3N.

  - id: q014
    type: multipleChoice
    prompt: |
      What is the correct name for Rb2Se?
    choices:
      - id: a
        text: rubidium selenide
      - id: b
        text: rubidium selenium
      - id: c
        text: dirubidium selenide
      - id: d
        text: rubidium(II) selenide
    answer:
      choiceId: a
    explanation: |
      Rubidium is a Group 1A metal with a fixed 1+ charge. Selenium becomes selenide, Se2-. The name is rubidium selenide.

  - id: q015
    type: multipleChoice
    prompt: |
      What is the correct formula for aluminum sulfide?
    choices:
      - id: a
        text: Al2S3
      - id: b
        text: AlS
      - id: c
        text: Al3S2
      - id: d
        text: Al2S
    answer:
      choiceId: a
    explanation: |
      Aluminum is Al3+ and sulfide is S2-. The least common charge balance is two aluminum ions and three sulfide ions, giving Al2S3.
