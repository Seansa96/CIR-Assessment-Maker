questions:
  - id: type1-q01
    title: Definition of Type I Metals
    type: multipleChoice
    prompt: |
      In chemical nomenclature, what defines a "Type I" metal?
    choices:
      - id: a
        text: It is a metal that only forms one possible cation (it has an invariant charge).
      - id: b
        text: It is a metal that can form multiple different cations with different charges.
      - id: c
        text: It is a metal found exclusively in Group 1 of the periodic table.
      - id: d
        text: It is a metal that bonds covalently with nonmetals.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Type I metals (like Group 1, Group 2, Aluminum, Zinc, Silver) always have the exact same charge when they form compounds. Because the charge is predictable and unchanging, we do not need to specify it with Roman numerals in the name.

  - id: type1-q02
    title: Naming the Anion
    type: multipleChoice
    prompt: |
      When naming a binary ionic compound, how is the name of the nonmetal (the anion) modified?
    choices:
      - id: a
        text: The ending of the element's name is dropped and replaced with "-ide".
      - id: b
        text: The word "ion" is added to the end of the element's name.
      - id: c
        text: The prefix "mono-" is added to the front of the element's name.
      - id: d
        text: The name of the nonmetal is not changed at all.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** In binary ionic compounds, the cation keeps its elemental name, but the anion takes the suffix "-ide". For example, Chlorine becomes Chloride, Oxygen becomes Oxide, Nitrogen becomes Nitride.

  - id: type1-q03
    title: Why No Prefixes?
    type: multipleChoice
    prompt: |
      Why is the compound $\text{MgCl}_2$ named "Magnesium chloride" rather than "Magnesium dichloride"?
    choices:
      - id: a
        text: Because Magnesium is a Type I metal with a fixed $+2$ charge, so it will always combine with exactly two $-1$ Chloride ions to balance. Prefixes are redundant and strictly forbidden in ionic naming.
      - id: b
        text: Because "di-" is only used for molecular compounds containing oxygen.
      - id: c
        text: Because the number 2 is implied by the fact that Magnesium is in Group 2.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Ionic compounds must be electrically neutral. Since Mg is always $+2$ and Cl is always $-1$, the only possible formula is $\text{MgCl}_2$. Thus, we don't need Greek prefixes (mono, di, tri) to specify how many atoms there are; the charges dictate the ratio automatically.

  - id: type1-q04
    title: Determining Subscripts from Charges
    type: multipleChoice
    prompt: |
      When writing the formula for Aluminum oxide, what mathematical process guarantees the compound is electrically neutral?
    choices:
      - id: a
        text: Finding the lowest common multiple of the Aluminum charge ($+3$) and Oxide charge ($-2$), which is 6. This requires 2 Al atoms and 3 O atoms ($\text{Al}_2\text{O}_3$).
      - id: b
        text: Just adding one of each atom until the charges cancel out.
      - id: c
        text: Using the criss-cross method without reducing the subscripts, yielding $\text{Al}_2\text{O}_3$.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The total positive charge must exactly equal the total negative charge. Two $\text{Al}^{3+}$ ions give $+6$, and three $\text{O}^{2-}$ ions give $-6$. The net charge is zero. The formula is $\text{Al}_2\text{O}_3$.

  - id: type1-q05
    title: Identifying Non-Type I Metals
    type: multipleChoice
    prompt: |
      Which of the following compounds is **NOT** a Type I binary ionic compound and would therefore require a Roman numeral in its name?
    choices:
      - id: a
        text: $\text{CuO}$
      - id: b
        text: $\text{BaCl}_2$
      - id: c
        text: $\text{Ag}_2\text{S}$
      - id: d
        text: $\text{Li}_3\text{N}$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Barium (Group 2), Silver (always $+1$), and Lithium (Group 1) are all Type I metals with invariant charges. Copper (Cu) is a transition metal that can be $+1$ or $+2$, so it is a Type II metal and requires a Roman numeral. $\text{CuO}$ is Copper(II) oxide.

  - id: type1-q06
    title: Understanding "Binary"
    type: multipleChoice
    prompt: |
      What does the word "binary" mean in the context of binary ionic compounds?
    choices:
      - id: a
        text: The compound consists of exactly two different elements (one metal and one nonmetal).
      - id: b
        text: The compound consists of exactly two atoms total.
      - id: c
        text: The compound has a net charge of $+2$ or $-2$.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Binary means two elements. $\text{NaCl}$ is binary. $\text{Al}_2\text{O}_3$ is binary (only Al and O are present, even though there are 5 atoms total). Compounds with polyatomic ions like $\text{NaNO}_3$ contain three elements and are not binary.

  - id: type1-q07
    title: Silver and Zinc Exceptions
    type: multipleChoice
    prompt: |
      Silver (Ag) and Zinc (Zn) are located in the transition metal block. Why do we NOT use Roman numerals when naming their compounds (e.g., we say Zinc oxide, not Zinc(II) oxide)?
    choices:
      - id: a
        text: Because they are exceptions that have invariant charges. Zinc is always $+2$ and Silver is always $+1$.
      - id: b
        text: Because they are too light to be considered true transition metals.
      - id: c
        text: Because they act as nonmetals when bonding.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Even though they are in the d-block, Zn always forms a $+2$ ion and Ag always forms a $+1$ ion. Because they only ever have one charge state, there is no ambiguity, and no Roman numeral is needed. They are treated as Type I metals.

  - id: type1-q08
    title: The Criss-Cross Method Pitfall
    type: multipleChoice
    prompt: |
      A student tries to write the formula for Calcium oxide using the criss-cross method. Calcium is $+2$ and Oxygen is $-2$. They write $\text{Ca}_2\text{O}_2$. What did they do wrong?
    choices:
      - id: a
        text: Ionic formulas must always be expressed as the lowest whole-number empirical ratio. The correct formula is $\text{CaO}$.
      - id: b
        text: They switched the cation and anion order.
      - id: c
        text: They should have added the charges to get zero, meaning no subscripts are needed.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Ionic compounds form continuous 3D lattices, so their chemical formulas only represent the lowest ratio of ions in the lattice (the empirical formula). Since the ratio is 2:2, it must be simplified to 1:1, giving $\text{CaO}$.

  - id: type1-q09
    title: Correct Naming Format
    type: multipleChoice
    prompt: |
      Which of the following is the perfectly formatted name for $\text{K}_3\text{P}$?
    choices:
      - id: a
        text: Potassium phosphide
      - id: b
        text: Potassium(I) phosphide
      - id: c
        text: Tripotassium phosphide
      - id: d
        text: Potassium phosphorus
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** 
      - No Roman numerals, because K is Group 1 (always $+1$). 
      - No prefixes ("tri"), because it's ionic. 
      - The nonmetal ending must change to "-ide". 
      Thus, "Potassium phosphide".

  - id: type1-q10
    title: Evaluating a Formula
    type: numericResponse
    prompt: |
      In the compound Gallium sulfide, Gallium (Ga) is a Group 13 metal with a $+3$ charge, and Sulfur (S) is a Group 16 nonmetal with a $-2$ charge. How many **total atoms** are present in one formula unit of Gallium sulfide?
    answer:
      value: 5
      tolerance: 0
    explanation: |
      To balance $\text{Ga}^{3+}$ and $\text{S}^{2-}$, we need a total charge of $\pm 6$. 
      We need two $\text{Ga}^{3+}$ (total $+6$) and three $\text{S}^{2-}$ (total $-6$). 
      The formula is $\text{Ga}_2\text{S}_3$. 
      Total atoms $= 2 + 3 = 5$.
