questions:
- id: q1-keq-parallel
  title: Equivalent Spring Constant
  type: symbolicResponse
  prompt: |
    Two springs with constants $k_1$ and $k_2$ are connected in parallel side-by-side. What is their equivalent spring constant $k_{eq}$?
  answer:
    gradingMode: auto
    expectedLatex: k_1 + k_2
    equivalenceMode: expression
    tolerance: 0
  explanation: For parallel springs, their forces add up for the same displacement, so $k_{eq} = k_1 + k_2$.
- id: q2-series-force
  title: Springs in Series
  type: multipleChoice
  prompt: |
    When two springs of different spring constants are connected end-to-end (in series) and pulled from the ends, which of the following must be true?
  choices:
  - id: a
    text: They share the same extension.
  - id: b
    text: They carry the same force.
  - id: c
    text: The stiffer spring carries more force.
  answer:
    choiceId: b
  explanation: By Newton's third law (and assuming massless springs), the tension must be uniform throughout the series connection, meaning they carry the exact same force.
- id: q3-fbd
  title: Free-Body Diagram
  type: multipleChoice
  prompt: |
    A block of mass $m$ hangs in static equilibrium from a vertical spring. Which of the following correctly describes the free-body diagram of the block?
  choices:
  - id: a
    text: Gravity points downwards, normal force points upwards.
  - id: b
    text: Gravity points downwards, spring force points upwards.
  - id: c
    text: Gravity points downwards, tension points upwards, spring force points upwards.
  answer:
    choiceId: b
  explanation: The only macroscopic forces acting on the hanging block are gravity (pulling down) and the restoring force of the spring (pulling up).
- id: q4-equilibrium
  title: Static Equilibrium
  type: symbolicResponse
  prompt: |
    A mass $m$ hangs in static equilibrium from a vertical spring of constant $k$. What is the stretch $\Delta y$ of the spring from its natural length? (Use $g$ for acceleration due to gravity).
  answer:
    gradingMode: auto
    expectedLatex: (m*g)/k
    equivalenceMode: expression
    tolerance: 0
  explanation: From $\sum F = 0$, we have $k\Delta y - mg = 0 \implies \Delta y = \frac{mg}{k}$.
- id: q5-force-each
  title: Force in Parallel Springs
  type: symbolicResponse
  prompt: |
    Two springs with constants $k_1$ and $k_2$ are connected in parallel. They are stretched together by a total distance $x$. What is the force carried by the *first* spring?
  answer:
    gradingMode: auto
    expectedLatex: k_1*x
    equivalenceMode: expression
    tolerance: 0
  explanation: Parallel springs share the exact same extension $x$. The force in the first spring is simply $F_1 = k_1 x$.
- id: q6-extension-series
  title: Extension in Series Springs
  type: symbolicResponse
  prompt: |
    Two springs in series with constants $k_1$ and $k_2$ support a hanging mass $m$. What is the stretch of the first spring ($x_1$)?
  answer:
    gradingMode: auto
    expectedLatex: (m*g)/k_1
    equivalenceMode: expression
    tolerance: 0
  explanation: In series, both springs experience the full force $mg$. Thus, the first spring stretches by an amount $x_1 = \frac{mg}{k_1}$.
- id: q7-energy-stored
  title: Energy Stored
  type: symbolicResponse
  prompt: |
    A spring with constant $k = 100\text{ N/m}$ is compressed by $0.20\text{ m}$. How much potential energy (in Joules) is stored in the spring?
  answer:
    gradingMode: auto
    expectedLatex: 2.0
    equivalenceMode: expression
    tolerance: 0.1
  explanation: $U_s = \frac{1}{2}kx^2 = \frac{1}{2}(100)(0.20)^2 = 50(0.04) = 2.0\text{ J}$.
- id: q8-work-done
  title: Work Done by a Spring
  type: symbolicResponse
  prompt: |
    A spring with $k = 50\text{ N/m}$ is stretched from its equilibrium position to $x = 0.40\text{ m}$. Calculate the work (in Joules) done *by the spring* during this stretch.
  answer:
    gradingMode: auto
    expectedLatex: -4.0
    equivalenceMode: expression
    tolerance: 0.1
  explanation: Work done by a conservative force is $W_s = -\Delta U_s = -(\frac{1}{2}(50)(0.40)^2 - 0) = -4.0\text{ J}$. The spring pulls backwards while being stretched forwards.
- id: q9-energy-combine
  title: Spring Energy and Gravity
  type: symbolicResponse
  prompt: |
    A block of mass $m$ compresses a vertical spring (constant $k$) by a distance $d$ downwards from equilibrium. It is released from rest. What is the maximum height $h$ the block reaches above its release point? (Assume no drag).
  answer:
    gradingMode: auto
    expectedLatex: (k*d^2)/(2*m*g)
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Using conservation of energy: the initial spring potential energy $\frac{1}{2}kd^2$ converts entirely into gravitational potential energy $mgh$. Thus $h = \frac{kd^2}{2mg}$.'
- id: q10-stiffness
  title: Why Series Springs are Softer
  type: multipleChoice
  prompt: |
    Why is the equivalent spring constant for two identical springs connected in series *less* than that of a single spring?
  choices:
  - id: a
    text: Because for a given applied force, the total stretch is doubled, meaning it is easier to pull.
  - id: b
    text: Because the forces in each spring cancel each other out.
  - id: c
    text: Because the applied force is divided in half between the two springs.
  answer:
    choiceId: a
  explanation: In series, both springs feel the full applied force and both stretch. The total stretch is the sum of the individual stretches, making the system stretch more for the same force (hence a lower stiffness $k_{eq}$).
