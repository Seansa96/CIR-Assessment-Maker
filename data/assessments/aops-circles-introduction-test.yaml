questions:
- id: q001
  type: multipleChoice
  prompt: 'Points $A$, $B$, and $C$ lie on a circle with center $O$. If the central angle $\angle AOC$ measures $84^\circ$, what is the measure of the inscribed angle $\angle ABC$?'
  difficultyDimensions:
  - Identify that the central angle equals the intercepted arc: $m\widehat{AC} = 84^\circ$.
  - Apply the Inscribed Angle Theorem: $m\angle ABC = \frac{1}{2}m\widehat{AC}$.
  - Calculate: $84 / 2 = 42^\circ$.
  choices:
  - id: a
    text: '$42^\circ$'
  - id: b
    text: '$84^\circ$'
    issueSignals:
    - inscribed-central-confusion
  - id: c
    text: '$168^\circ$'
    issueSignals:
    - double-instead-of-half
  - id: d
    text: '$96^\circ$'
    issueSignals:
    - supplementary-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    The central angle $\angle AOC$ intercepts arc $AC$. The measure of an arc is equal to its central angle, so $m\widehat{AC} = 84^\circ$.
    The inscribed angle $\angle ABC$ also intercepts arc $AC$.
    The Inscribed Angle Theorem states that an inscribed angle is exactly half the measure of its intercepted arc.
    $m\angle ABC = \frac{1}{2}(84^\circ) = 42^\circ$.

    Why it works:
    If you pull the vertex of a central angle all the way back to the opposite edge of the circle (turning it into an inscribed angle), the angle becomes narrower. Mathematically, it becomes exactly half as wide.

    Why the other choices fail:
    - $84^\circ$ assumes the inscribed angle is equal to the central angle.
    - $168^\circ$ incorrectly doubles the central angle instead of halving it.
    - $96^\circ$ is the supplement to $84^\circ$ ($180 - 84$).

- id: q002
  type: multipleChoice
  prompt: 'A chord is 24 cm long and its midpoint is 5 cm from the center of the circle. What is the radius of the circle?'
  difficultyDimensions:
  - Recognize that the perpendicular from the center bisects the chord (creating a right triangle with leg $24/2 = 12$).
  - Identify the other leg as the distance from center: 5.
  - Use the Pythagorean theorem to find the hypotenuse (radius): $5^2 + 12^2 = r^2$.
  - Calculate $r = 13$.
  choices:
  - id: a
    text: '$13\text{ cm}$'
  - id: b
    text: '$24.5\text{ cm}$'
    issueSignals:
    - full-chord-pythagorean-error
  - id: c
    text: '$17\text{ cm}$'
    issueSignals:
    - linear-sum-error
  - id: d
    text: '$10.9\text{ cm}$'
    issueSignals:
    - hypotenuse-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    The line segment from the center to the midpoint of a chord is always perpendicular to the chord.
    This creates a right triangle where:
    - One leg is the distance from the center ($5\text{ cm}$).
    - The other leg is *half* the chord ($24 / 2 = 12\text{ cm}$).
    - The hypotenuse is the radius ($r$).
    Using the Pythagorean theorem: $5^2 + 12^2 = r^2$
    $25 + 144 = r^2$
    $169 = r^2 \implies r = 13\text{ cm}$.

    Why it works:
    Any chord, its distance to the center, and the radius form a right triangle. Remembering to cut the chord in half is the only trick to these problems.

    Why the other choices fail:
    - $24.5\text{ cm}$ comes from using the full chord length as a leg: $\sqrt{5^2 + 24^2} = \sqrt{601} \approx 24.5$.
    - $17\text{ cm}$ is just $5 + 12$.
    - $10.9\text{ cm}$ assumes 12 is the hypotenuse: $\sqrt{144 - 25} \approx 10.9$.

- id: q003
  type: multipleChoice
  prompt: 'Line $PT$ is tangent to a circle at point $T$. Point $O$ is the center of the circle. If the radius is 8 and the distance from $P$ to the center $O$ is 17, what is the length of the tangent segment $PT$?'
  difficultyDimensions:
  - Recall that a tangent line is perpendicular to the radius at the point of tangency (forming right $\triangle PTO$).
  - Identify $OT = 8$ (leg) and $PO = 17$ (hypotenuse).
  - Use the Pythagorean theorem to find the other leg $PT$: $8^2 + PT^2 = 17^2$.
  - Calculate: $64 + PT^2 = 289 \implies PT^2 = 225 \implies PT = 15$.
  choices:
  - id: a
    text: '$18.8$'
    issueSignals:
    - hypotenuse-addition-error
  - id: b
    text: '$15$'
  - id: c
    text: '$25$'
    issueSignals:
    - linear-sum-error
  - id: d
    text: '$9$'
    issueSignals:
    - subtraction-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    A radius drawn to a point of tangency is always perpendicular to the tangent line. This makes $\triangle PTO$ a right triangle with the right angle at $T$.
    The hypotenuse is the segment $PO$ from the external point to the center.
    $OT^2 + PT^2 = PO^2$
    $8^2 + PT^2 = 17^2$
    $64 + PT^2 = 289$
    $PT^2 = 225$
    $PT = 15$.

    Why it works:
    The shortest distance from the center to the tangent line is the radius, meaning it drops at a perfect $90^\circ$ angle. The segment from the external point to the center ($PO$) must cross through the empty space outside the circle, making it the longest side (the hypotenuse). 

    Why the other choices fail:
    - $18.8$ comes from incorrectly adding the squares: $\sqrt{8^2 + 17^2} = \sqrt{353} \approx 18.8$. This assumes $PT$ is the hypotenuse.
    - $25$ is the linear sum $8 + 17$.
    - $9$ is the straight subtraction $17 - 8$.

- id: q004
  type: multipleChoice
  prompt: 'Two tangent segments are drawn to a circle from an external point $A$. If the measure of the angle formed by the two tangents is $50^\circ$, what is the measure of the central angle intercepted by the minor arc between the two points of tangency?'
  difficultyDimensions:
  - Visualize the quadrilateral formed by the external point, the two points of tangency, and the center.
  - Identify that the two tangent angles are $90^\circ$ each.
  - Use the sum of angles in a quadrilateral ($360^\circ$): $90 + 90 + 50 + x = 360$.
  - Calculate $x = 180 - 50 = 130^\circ$.
  choices:
  - id: a
    text: '$130^\circ$'
  - id: b
    text: '$50^\circ$'
    issueSignals:
    - angle-equality-assumption
  - id: c
    text: '$40^\circ$'
    issueSignals:
    - complementary-confusion
  - id: d
    text: '$65^\circ$'
    issueSignals:
    - half-angle-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    Let the points of tangency be $B$ and $C$, and the center be $O$.
    The radii $OB$ and $OC$ are perpendicular to the tangents, so $\angle OBA$ and $\angle OCA$ are both $90^\circ$.
    In quadrilateral $ABOC$, the sum of the interior angles is $360^\circ$:
    $m\angle A + m\angle B + m\angle C + m\angle O = 360^\circ$
    $50^\circ + 90^\circ + 90^\circ + m\angle O = 360^\circ$
    $230^\circ + m\angle O = 360^\circ$
    $m\angle O = 130^\circ$.

    Why it works:
    Because the two tangent angles always sum to $180^\circ$ ($90+90$), the external angle and the central angle must *always* be supplementary (sum to $180^\circ$). $180 - 50 = 130^\circ$.

    Why the other choices fail:
    - $50^\circ$ assumes the central angle is equal to the external angle.
    - $40^\circ$ assumes the angles are complementary ($90 - 50 = 40$).
    - $65^\circ$ is half of $130^\circ$, which would be the measure of an *inscribed* angle intercepting that arc.

- id: q005
  type: multipleChoice
  prompt: 'A circle is inscribed perfectly inside a square with a side length of 10. What is the area of the region inside the square but OUTSIDE the circle?'
  difficultyDimensions:
  - Find area of square: $10^2 = 100$.
  - Identify radius of circle: diameter is 10, so $r = 5$.
  - Find area of circle: $\pi(5)^2 = 25\pi$.
  - Subtract: $100 - 25\pi$.
  choices:
  - id: a
    text: '$100 - 100\pi$'
    issueSignals:
    - diameter-as-radius
  - id: b
    text: '$100 - 25\pi$'
  - id: c
    text: '$25\pi$'
    issueSignals:
    - area-confusion
  - id: d
    text: '$100 - 5\pi$'
    issueSignals:
    - circumference-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    The area of the shaded region is the Area of the Square minus the Area of the Circle.
    The area of the square is $s^2 = 10^2 = 100$.
    Because the circle touches the edges of the square, the diameter of the circle is equal to the side length of the square ($d=10$). Thus, the radius is $r = 5$.
    The area of the circle is $\pi r^2 = \pi(5)^2 = 25\pi$.
    The remaining area is $100 - 25\pi$.

    Why it works:
    Subtracting areas is the standard way to find the area of complex geometric regions. Always ensure you halve the side length of the square to get the radius of an inscribed circle.

    Why the other choices fail:
    - $100 - 100\pi$ incorrectly uses the full side length (10) as the radius of the circle. (Note: $100\pi \approx 314$, which is larger than the square itself, so this yields a negative area!).
    - $25\pi$ is the area of the circle, not the region outside it.
    - $100 - 5\pi$ fails to square the radius for the circle area.

- id: q006
  type: multipleChoice
  prompt: 'A wheel has a radius of 14 inches. Approximately how far does the wheel travel if it completes exactly 5 full revolutions? (Use $\pi \approx 22/7$)'
  difficultyDimensions:
  - Identify that one revolution = one circumference.
  - Calculate circumference: $C = 2\pi r = 2(22/7)(14) = 88$.
  - Multiply by 5 revolutions: $88 \times 5 = 440$.
  choices:
  - id: a
    text: '$220\text{ inches}$'
    issueSignals:
    - half-circumference-error
  - id: b
    text: '$440\text{ inches}$'
  - id: c
    text: '$3080\text{ inches}$'
    issueSignals:
    - area-revolution-confusion
  - id: d
    text: '$70\text{ inches}$'
    issueSignals:
    - revolution-radius-multiplication
  answer:
    choiceId: b
  explanation: |
    Solution:
    The distance traveled in one full revolution is exactly equal to the circumference of the wheel.
    $C = 2\pi r = 2 \left(\frac{22}{7}\right) (14)$
    $C = 2 \times 22 \times 2 = 88\text{ inches}$.
    Since the wheel completes 5 revolutions, the total distance is:
    $5 \times 88 = 440\text{ inches}$.

    Why it works:
    Imagine painting the outside edge of the tire with wet paint. If you roll it exactly one full rotation forward, the paint streak left on the ground will be a straight line exactly equal to the perimeter (circumference) of the tire.

    Why the other choices fail:
    - $220\text{ inches}$ is $5 \times \pi r$ ($5 \times 44$), forgetting the $2$ in $2\pi r$.
    - $3080\text{ inches}$ uses the *area* formula instead of circumference ($5 \times \pi(14)^2 = 5 \times 616 = 3080$).
    - $70\text{ inches}$ is just $5 \times 14$ (revolutions times radius).
