schemaVersion: 1
id: aops-circles-introduction-test
title: 'Circles: Easy Test'
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-circles-introduction
modeDefault: scored
randomizeQuestions: true
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags: [art-of-problem-solving, aops-circles-introduction, aops-volume-1, circles, easy, geometry]
skills:
- Connect circle measurements through radius
- Apply arc, sector, scaling, tangent, and chord theorems
- Justify diagram conclusions from marked hypotheses
questions:
- id: easy-test-q034
  type: multipleChoice
  prompt: A disk has area $49\pi$. What is its radius?
  choices:
  - {id: a, text: '$7$'}
  - {id: b, text: '$14$'}
  - {id: c, text: '$49$'}
  - {id: d, text: '$98$'}
  answer: {choiceId: a}
  explanation: $\pi r^2=49\pi$ gives positive radius $r=7$.
- id: easy-test-q014
  type: multipleChoice
  prompt: A circular garden has circumference $18\pi$ meters. What is its area?
  choices:
  - {id: a, text: '$18\pi\text{ m}^2$'}
  - {id: b, text: '$36\pi\text{ m}^2$'}
  - {id: c, text: '$81\pi\text{ m}^2$'}
  - {id: d, text: '$324\pi\text{ m}^2$'}
  answer: {choiceId: c}
  explanation: $2\pi r=18\pi$ gives $r=9$, then $A=81\pi$.
- id: easy-test-q024
  type: multipleChoice
  prompt: Find the arc length cut off by a $60^\circ$ central angle in a radius-9 circle.
  choices:
  - {id: a, text: '$3\pi$'}
  - {id: b, text: '$6\pi$'}
  - {id: c, text: '$9\pi$'}
  - {id: d, text: '$18\pi$'}
  answer: {choiceId: a}
  explanation: One sixth of circumference $18\pi$ is $3\pi$.
- id: easy-test-q004
  type: multipleChoice
  prompt: Find the area of a $150^\circ$ sector in a radius-12 circle.
  media:
  - {type: image, src: /assessments/aops/aops-circles-sector.svg, alt: Circle with a marked central sector illustrating the angle-to-area fraction.}
  choices:
  - {id: a, text: '$24\pi$'}
  - {id: b, text: '$50\pi$'}
  - {id: c, text: '$60\pi$'}
  - {id: d, text: '$90\pi$'}
  answer: {choiceId: c}
  explanation: $(150/360)(144\pi)=60\pi$.
- id: easy-test-q044
  type: multipleChoice
  prompt: A $90^\circ$ sector is removed from a radius-8 disk. What area remains?
  choices:
  - {id: a, text: '$16\pi$'}
  - {id: b, text: '$32\pi$'}
  - {id: c, text: '$48\pi$'}
  - {id: d, text: '$64\pi$'}
  answer: {choiceId: c}
  explanation: Three quarters of $64\pi$ is $48\pi$.
- id: easy-test-q035
  type: multipleChoice
  prompt: A radius-10 wheel makes three complete turns without slipping. How far does it travel?
  choices:
  - {id: a, text: '$20\pi$'}
  - {id: b, text: '$30\pi$'}
  - {id: c, text: '$60\pi$'}
  - {id: d, text: '$100\pi$'}
  answer: {choiceId: c}
  explanation: One turn travels $20\pi$; three travel $60\pi$.
- id: easy-test-q015
  type: multipleChoice
  prompt: A circular display's radius is scaled by $3/2$. Its original area is $80$. What is the new area?
  media:
  - {type: image, src: /assessments/aops/aops-circles-scaling.svg, alt: Two circles illustrating that area scales by the square of the radius factor.}
  choices:
  - {id: a, text: '$120$'}
  - {id: b, text: '$160$'}
  - {id: c, text: '$180$'}
  - {id: d, text: '$240$'}
  answer: {choiceId: c}
  explanation: |-
    Multiply by $(3/2)^2=9/4$: $80(9/4)=180$.
- id: easy-test-q025
  type: multipleChoice
  prompt: $OP=13$, circle radius $OT=5$, and $PT$ is tangent at $T$. Find $PT$.
  media:
  - {type: image, src: /assessments/aops/aops-circles-tangent.svg, alt: Right triangle OPT formed by a radius and tangent at T.}
  choices:
  - {id: a, text: '$8$'}
  - {id: b, text: '$10$'}
  - {id: c, text: '$12$'}
  - {id: d, text: '$18$'}
  answer: {choiceId: c}
  explanation: $OT\perp PT$, so $PT=\sqrt{13^2-5^2}=12$.
- id: easy-test-q005
  type: multipleChoice
  prompt: A radius-10 circle has a chord of length $16$. The perpendicular from the center meets it at $M$. Find the center-to-chord distance.
  media:
  - {type: image, src: /assessments/aops/aops-circles-chord.svg, alt: Perpendicular OM from circle center O to chord AB at midpoint M.}
  choices:
  - {id: a, text: '$4$'}
  - {id: b, text: '$6$'}
  - {id: c, text: '$8$'}
  - {id: d, text: '$12$'}
  answer: {choiceId: b}
  explanation: The half-chord is $8$, so $OM^2+8^2=10^2$ and $OM=6$.
- id: easy-test-q045
  type: multipleChoice
  prompt: Tangents from $P$ have lengths $PA=3x+2$ and $PB=5x-6$. Find $x$.
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$4$'}
  - {id: c, text: '$6$'}
  - {id: d, text: '$8$'}
  answer: {choiceId: b}
  explanation: Equal tangent lengths give $3x+2=5x-6$, hence $x=4$; both lengths are $14>0$.
- id: easy-test-q036
  type: multipleChoice
  prompt: Two tangents from $P$ touch at $A,B$, and $\angle APB=40^\circ$. Find minor central angle $\angle AOB$.
  choices:
  - {id: a, text: '$40^\circ$'}
  - {id: b, text: '$90^\circ$'}
  - {id: c, text: '$140^\circ$'}
  - {id: d, text: '$320^\circ$'}
  answer: {choiceId: c}
  explanation: The two right angles at tangency make $\angle AOB+\angle APB=180^\circ$.
- id: easy-test-q016
  type: multipleChoice
  prompt: What is the greatest possible chord length in a circle of radius $11$?
  choices:
  - {id: a, text: '$11$'}
  - {id: b, text: '$22$'}
  - {id: c, text: '$33$'}
  - {id: d, text: '$121$'}
  answer: {choiceId: b}
  explanation: The longest chord is a diameter of length $2r=22$.
- id: easy-test-q026
  type: selectAll
  prompt: Which conditions are sufficient to conclude that a line is tangent to a circle at $T$?
  choices:
  - {id: a, text: The line passes through circle point $T$ and is perpendicular to radius $OT$.}
  - {id: b, text: The line passes through the center.}
  - {id: c, text: The line meets the circle at exactly one point $T$.}
  - {id: d, text: The line contains a chord with two endpoints.}
  answer:
    choiceIds: [a, c]
  explanation: Perpendicularity at a circle point is the tangent converse; meeting the circle at exactly one point is the definition.
- id: easy-test-q006
  type: selectAll
  prompt: Which verification checks are appropriate for a circle measurement answer?
  choices:
  - {id: a, text: A proper sector area is less than the whole disk area.}
  - {id: b, text: An arc length uses square units.}
  - {id: c, text: Doubling radius doubles circumference.}
  - {id: d, text: Doubling radius quadruples area.}
  answer:
    choiceIds: [a, c, d]
  explanation: Arc length uses linear units; the other statements are valid bounds or scale checks.
- id: easy-test-q046
  type: freeResponse
  prompt: Prove that a perpendicular from the center of a circle to a chord bisects the chord.
  media:
  - {type: image, src: /assessments/aops/aops-circles-chord.svg, alt: Circle centered at O with OM perpendicular to chord AB at M.}
  answer:
    gradingMode: selfCheck
    expected: |-
      Join $O$ to chord endpoints $A$ and $B$. Radii $OA$ and $OB$ are equal, $OM$ is common, and $\angle OMA=\angle OMB=90^\circ$. The right triangles $\triangle OMA$ and $\triangle OMB$ are congruent by hypotenuse-leg, so corresponding segments $AM$ and $MB$ are equal. Thus $M$ bisects $AB$.
    keyPoints:
    - Draws radii to both chord endpoints.
    - Uses equal radii and the common perpendicular segment.
    - Establishes congruence of the two right triangles.
    - Concludes $AM=MB$.
  explanation: The chord theorem follows from congruence, not from the diagram's appearance.
