schemaVersion: 1
id: chemistry-aqueous-solutions-recall
title: Aqueous Solutions and Molarity Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryId: chemistry-solutions
subcategoryIds:
  - chemistry-solutions
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: What unit is defined as moles of solute per liter of solution?
    answer:
      expected: molarity
      aliases:
        - M
  - id: r002
    type: typed
    prompt: >
      A substance that completely dissociates into ions in aqueous solution is called a what?
    answer:
      expected: strong electrolyte
      aliases:
        - strong
  - id: r003
    type: typed
    prompt: >
      What term describes a substance that dissolves in water but does not produce ions?
    answer:
      expected: nonelectrolyte
      aliases:
        - non-electrolyte
  - id: r004
    type: flashcard
    prompt: What is the rule of thumb for predicting solubility based on polarity?
    answer:
      expected: '"Like dissolves like." Polar solutes dissolve in polar solvents, and nonpolar solutes dissolve in nonpolar solvents.'
  - id: r005
    type: typed
    prompt: What equation is used to calculate the concentration after a dilution?
    answer:
      expected: M1V1 = M2V2
      aliases:
        - m1v1=m2v2
        - M1 * V1 = M2 * V2
        - c1v1 = c2v2
  - id: r006
    type: typed
    prompt: >
      Are most molecular compounds (like sugar or ethanol) electrolytes or nonelectrolytes?
    answer:
      expected: nonelectrolytes
      aliases:
        - non-electrolytes
  - id: r007
    type: flashcard
    prompt: Explain the process of hydration when NaCl dissolves in water.
    answer:
      expected: The polar water molecules orient themselves so the partially negative oxygen atoms face the Na+ ions, and the partially positive hydrogen atoms face the Cl- ions. The water molecules pull the ions apart and surround them.
  - id: r008
    type: typed
    prompt: >
      Is hydrofluoric acid (HF) a strong or weak electrolyte?
    answer:
      expected: weak electrolyte
      aliases:
        - weak
  - id: r009
    type: typed
    prompt: How many strong acids are there?
    answer:
      expected: '6'
      aliases:
        - six
  - id: r010
    type: typed
    prompt: >
      If you dissolve 0.5 moles of solute in enough water to make 1 liter of solution, what is the molarity?
    answer:
      expected: 0.5 M
      aliases:
        - 0.5
        - 0.5M


