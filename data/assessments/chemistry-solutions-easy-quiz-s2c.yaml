questions:
  - { id: q001, type: multipleChoice, prompt: 'Which expression defines mass percent?', choices: [{ id: a, text: '$m_{solute}/m_{solution}\times100\%$' }, { id: b, text: '$m_{solute}/V_{solution}$' }, { id: c, text: '$n_{solute}/m_{solvent}$' }, { id: d, text: '$V_{solute}/m_{solution}$' }], answer: { choiceId: a }, explanation: 'Solution: Mass percent is $m_{solute}/m_{solution}\times100\%$. Why it works: Both masses describe the same final mixture. Why the other choices fail: b is a mass concentration, c mixes moles and mass, and d is not mass percent.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Selects the concentration form and identifies the correct total-mixture denominator.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: mass-percent-definition, variationAxes: { scenario: formula recognition, representation: symbolic definition } }
  - { id: q002, type: multipleChoice, prompt: 'For dilute water, 35 micrograms solute per liter is approximately which concentration?', choices: [{ id: a, text: '35 ppb' }, { id: b, text: '35 ppm' }, { id: c, text: '0.035 ppb' }, { id: d, text: '35%' }], answer: { choiceId: a }, explanation: 'Solution: $35\ \mathrm{\mu g/L}$ is approximately 35 ppb. Why it works: In dilute water, ppb corresponds approximately to micrograms per liter. Why the other choices fail: b is milligrams per liter; c is a thousand times too small; d is vastly larger.', difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Transfers a trace-mass unit to the appropriate concentration scale.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: ppb-unit-recognition, variationAxes: { scenario: drinking-water trace amount, unknown: concentration label } }
  - { id: q003, type: multipleChoice, prompt: 'A solution contains 15.0 g solute and 135.0 g water. What denominator belongs in its mass-percent calculation?', choices: [{ id: a, text: '150.0 g solution' }, { id: b, text: '135.0 g water' }, { id: c, text: '15.0 g solute' }, { id: d, text: '120.0 g solution' }], answer: { choiceId: a }, explanation: 'Solution: The final solution mass is $15.0+135.0=150.0\ \mathrm g$. Why it works: Mass percent compares solute to all components of the mixture. Why the other choices fail: b omits solute; c is only the numerator; d subtracts instead of adds.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Constructs total solution mass before selecting a concentration denominator.', prerequisiteObjectiveIds: [solution-concentration-forms], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0441], reasoningSignature: mass-percent-denominator, variationAxes: { scenario: component masses, constraints: total-mass construction } }
  - { id: q004, type: multipleChoice, prompt: 'Which statement about a 0.250 M solution is correct?', choices: [{ id: a, text: 'It contains 0.250 mol solute per liter of solution.' }, { id: b, text: 'It contains 0.250 g solute per liter of solvent.' }, { id: c, text: 'It contains 0.250 mol solvent per liter of solute.' }, { id: d, text: 'It must have 0.250 L total volume.' }], answer: { choiceId: a }, explanation: 'Solution: 0.250 M means 0.250 mol solute/L solution. Why it works: This is the definition of molarity. Why the other choices fail: b uses grams and solvent, c reverses roles, and d confuses a ratio with a required sample size.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Interprets both numerator and denominator units in a molarity label.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: molarity-meaning, variationAxes: { scenario: unit interpretation, unknown: verbal definition } }
  - { id: q005, type: multipleChoice, prompt: 'What is the first operation when 19.6 g KCl is used to find molarity?', choices: [{ id: a, text: 'Convert grams KCl to moles KCl.' }, { id: b, text: 'Multiply grams by solution volume.' }, { id: c, text: 'Apply the dilution equation.' }, { id: d, text: 'Divide volume by molar mass.' }], answer: { choiceId: a }, explanation: 'Solution: Divide the given mass by KCl molar mass to obtain moles. Why it works: Molarity is mol/L, so grams must become moles first. Why the other choices fail: b does not form molarity; c needs a stock and target; d combines unrelated quantities.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Selects the molar-mass conversion required before applying molarity.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: mass-to-molarity-path, variationAxes: { scenario: weighed salt, methodBranch: molar-mass conversion } }
  - { id: q006, type: multipleChoice, prompt: 'Which procedure correctly makes 100.0 mL of a specified molarity?', choices: [{ id: a, text: 'Dissolve calculated solute, then dilute to 100.0 mL final solution.' }, { id: b, text: 'Measure 100.0 mL water, then add any mass of solute.' }, { id: c, text: 'Add solute until the water reaches 100.0 mL.' }, { id: d, text: 'Use 100.0 g water because liters and grams are identical.' }], answer: { choiceId: a }, explanation: 'Solution: Weigh the calculated solute, dissolve it, and fill a volumetric flask to 100.0 mL. Why it works: Molarity uses final solution volume. Why the other choices fail: b and c do not control final volume; d confuses mass with volume.', difficultyDimensions: [modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Distinguishes final-volume laboratory procedure from common water-volume errors.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: volumetric-preparation, variationAxes: { scenario: volumetric flask, representation: laboratory workflow } }
  - { id: q007, type: multipleChoice, prompt: 'During a dilution, which quantity remains unchanged?', choices: [{ id: a, text: 'Moles of solute' }, { id: b, text: 'Solution volume' }, { id: c, text: 'Molarity' }, { id: d, text: 'Solvent amount' }], answer: { choiceId: a }, explanation: 'Solution: Moles of solute remain unchanged. Why it works: Dilution adds solvent without adding or removing solute. Why the other choices fail: Volume rises, molarity falls, and solvent amount rises.', difficultyDimensions: [modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Uses a conservation model to identify what dilution changes and preserves.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0448], reasoningSignature: dilution-conservation, variationAxes: { scenario: dilution process, governingRelation: conserved solute moles } }
  - { id: q008, type: multipleChoice, prompt: '![Known-molarity preparation](/media/chemistry/solution-concentration-lab.svg) Which labeled stage sets the molarity denominator?', choices: [{ id: a, text: 'Stage 3: dilute to the calibration mark' }, { id: b, text: 'Stage 1: weigh solute' }, { id: c, text: 'the mass balance only' }, { id: d, text: 'none; molarity has no volume' }], answer: { choiceId: a }, explanation: 'Solution: Stage 3 sets the final solution volume at the calibration mark. Why it works: Molarity is moles divided by final liters of solution. Why the other choices fail: b controls moles, not volume; c does not set a volume; d contradicts mol/L.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Maps a laboratory diagram to the volume in the molarity definition.', prerequisiteObjectiveIds: [solution-preparation-dilution], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0447], reasoningSignature: visual-final-volume, variationAxes: { representation: lab diagram, unknown: model variable } }
  - { id: q009, type: numericResponse, prompt: 'Find the molarity of 0.150 mol NaNO3 in 300.0 mL solution.', answer: { value: 0.5, tolerance: 0.001 }, explanation: 'Solution: Convert $300.0\ \mathrm{mL}$ to $0.3000\ \mathrm L$. Then $M=n/V=0.150/0.3000=0.500\ \mathrm M$. Why it works: Molarity is moles per liter. Common trap: Dividing by 300.0 as if it were liters.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts volume units and applies the molarity relation.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: moles-volume-to-molarity, variationAxes: { givens: moles and volume, unknown: molarity } }
  - { id: q010, type: numericResponse, prompt: 'What volume in mL of 2.00 M NaOH is needed for 0.100 mol NaOH?', answer: { value: 50.0, tolerance: 0.05 }, explanation: 'Solution: $V=n/M=0.100\ \mathrm{mol}/(2.00\ \mathrm{mol/L})=0.0500\ \mathrm L=50.0\ \mathrm{mL}$. Why it works: Rearranging $M=n/V$ solves for volume. Common trap: Reporting 0.0500 mL without converting liters.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Rearranges molarity and converts the calculated liter quantity to requested milliliters.', prerequisiteObjectiveIds: [molarity-conversions], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0446], reasoningSignature: moles-molarity-to-volume, variationAxes: { givens: moles and molarity, unknown: volume } }
