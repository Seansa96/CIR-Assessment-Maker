workedExamples:
  - id: carbon-dioxide
    title: Draw Carbon Dioxide, $\text{CO}_2$
    problem: |
      On paper, draw the complete Lewis structure of $\text{CO}_2$. Include all lone pairs and bonds.
    steps:
      - id: co2-count-electrons
        title: Count valence electrons
        type: numericResponse
        answer:
          value: 16
          tolerance: 0
        prompt: How many valence electrons must be placed?
        instruction: Carbon contributes 4 valence electrons and two oxygens contribute $2(6)$, for 16 total.
      - id: co2-draw-and-check
        title: Draw, then compare
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Draw your structure before revealing the check.
        instruction: |
          Use the skeleton O—C—O. After completing octets on oxygen, convert one lone pair on each oxygen into a bond.
          The final structure is O=C=O, with two lone pairs on each oxygen and no lone pairs on carbon. Every atom has an octet and all formal charges are zero.
  - id: ammonia
    title: Draw Ammonia, $\text{NH}_3$
    problem: |
      On paper, draw the complete Lewis structure of $\text{NH}_3$.
    steps:
      - id: nh3-count-electrons
        title: Count valence electrons
        type: numericResponse
        answer:
          value: 8
          tolerance: 0
        prompt: How many valence electrons must be placed?
        instruction: Nitrogen contributes 5 valence electrons and the three hydrogens contribute 3, for 8 total.
      - id: nh3-draw-and-check
        title: Draw, then compare
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Draw your structure before revealing the check.
        instruction: |
          Put nitrogen in the center with three single N—H bonds. The remaining two electrons form one lone pair on nitrogen.
          Hydrogen follows the duet rule; nitrogen has an octet.
  - id: carbonate
    title: Draw the Carbonate Ion, $\text{CO}_3^{2-}$
    problem: |
      On paper, draw one valid Lewis resonance structure for $\text{CO}_3^{2-}$. Include brackets and the overall charge.
    steps:
      - id: carbonate-count-electrons
        title: Count valence electrons including charge
        type: numericResponse
        answer:
          value: 24
          tolerance: 0
        prompt: How many valence electrons must be placed?
        instruction: 'Carbon contributes 4, oxygen contributes $3(6)=18$, and the $2-$ charge adds 2 more: 24 total.'
      - id: carbonate-draw-and-check
        title: Draw, then compare
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Draw one resonance contributor before revealing the check.
        instruction: |
          Use one C=O bond and two C—O single bonds. Each singly bonded oxygen carries a $-1$ formal charge, for the overall $2-$ charge.
          The double bond can be placed to any one of the three oxygens, giving three equivalent resonance contributors.
  - id: sulfur-hexafluoride
    title: Draw an Expanded-Octet Structure, $\text{SF}_6$
    problem: |
      On paper, draw the Lewis structure of $\text{SF}_6$ and identify the octet exception.
    steps:
      - id: sf6-count-electrons
        title: Count valence electrons
        type: numericResponse
        answer:
          value: 48
          tolerance: 0
        prompt: How many valence electrons must be placed?
        instruction: Sulfur provides 6 and six fluorines provide $6(7)=42$, for 48 total.
      - id: sf6-draw-and-check
        title: Draw, then compare
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Draw the structure and identify which atom exceeds an octet.
        instruction: |
          Sulfur is central with six single S—F bonds. Each fluorine has three lone pairs. Sulfur has 12 electrons around it,
          an allowed expanded octet for a period-3 central atom; all formal charges are zero.
