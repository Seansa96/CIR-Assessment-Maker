schemaVersion: 1
id: pwsh-string-guided-project-3
title: "The Regex Validator"
assessmentType: sandbox
categoryId: scripting
subcategoryIds:
  - pwsh-regex
sandbox:
  language: pwsh
  image: mcr.microsoft.com/powershell:latest
  initialCommand: 'pwsh -NoExit -Command "Start-Job -FilePath /workspace/.cir/monitor.ps1 | Out-Null"'
  readOnlyFileSystem: false
  instructions: |
    Welcome to the Regex Validator!
    
    You need to write a simple validation script `validate.ps1` that uses PowerShell's native regex operator to check if an identification code is valid.
    
    A valid identification code must consist of exactly 3 digits followed by exactly 2 uppercase letters (e.g., `123AB`, `999ZZ`).
    
    **Requirements:**
    1. Define the variable `$Code = "456XY"`.
    2. Write a boolean check using the `-cmatch` operator (because it must be strictly case-sensitive uppercase letters!) to validate the code.
    3. The regex pattern should enforce the start (`^`) and end (`$`) of the string, e.g., `^\d{3}[A-Z]{2}$`.
    4. Output the boolean result (`True` or `False`) to the console.
    
    The environment is pre-configured. The background monitor will run your script, and if it correctly outputs True, it will automatically advance the assessment.
  files:
    - path: validate.ps1
      readOnly: false
      content: |
        $Code = "456XY"
        
        # Write your case-sensitive regex validation below and output the result
        
    - path: .cir/monitor.ps1
      readOnly: true
      content: |
        while ($true) {
            if (Test-Path "/workspace/validate.ps1") {
                $output = & /workspace/validate.ps1 | Out-String
                if ($output -match "True") {
                    Invoke-RestMethod -Method Post -Uri "$env:CIR_API_URL/api/attempts/$env:CIR_ATTEMPT_ID/sandbox/complete"
                    break
                }
            }
            Start-Sleep -Seconds 3
        }
