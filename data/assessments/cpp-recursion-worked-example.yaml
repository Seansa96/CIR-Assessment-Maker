workedExamples:
- id: recursion-factorial
  title: Recursive Factorial
  problem: 'Write a recursive function to compute the factorial of a non-negative
    integer `n` (n!).

    Remember that 0! = 1, and n! = n * (n-1)!.

    '
  steps:
  - id: step-recursion-factorial-1
    title: Define the base case
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "Every recursive function needs a stopping condition, called the\
      \ base case, to prevent infinite loops (which cause stack overflow errors).\n\
      \n```cpp\nint factorial(int n) {\n    if (n <= 1) {\n        return 1;\n   \
      \ }\n```\nIf `n` is 0 or 1, we immediately return 1.\n"
  - id: step-recursion-factorial-2
    title: Define the recursive step
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "If we haven't hit the base case, we call the function itself with\
      \ a smaller input.\n\n```cpp\n    return n * factorial(n - 1);\n}\n```\nThis\
      \ perfectly matches the mathematical definition: `n! = n * (n-1)!`.\n"
  - id: step-recursion-factorial-3
    title: Trace the call stack
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'If we call `factorial(3)`, the execution looks like this:

      1. `factorial(3)` calls `3 * factorial(2)`

      2. `factorial(2)` calls `2 * factorial(1)`

      3. `factorial(1)` hits the base case and returns `1`

      4. `factorial(2)` computes `2 * 1` and returns `2`

      5. `factorial(3)` computes `3 * 2` and returns `6`


      The final result is 6.

      '
  check:
    id: recursion-check
    type: multipleChoice
    prompt: What happens if you forget to include a base case in a recursive function?
    choices:
    - id: a
      text: The function calls itself endlessly until the program crashes with a stack
        overflow.
    - id: b
      text: The compiler will refuse to compile the program.
    - id: c
      text: The function returns 0 immediately.
    - id: d
      text: The program runs perfectly but is slower.
    answer:
      choiceId: a
    explanation: 'Without a base case, recursion has no stopping point, leading to
      an infinite series of function calls that exhaust the call stack.

      '
