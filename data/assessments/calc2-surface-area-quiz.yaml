questions:
- id: q001
  type: multipleChoice
  skills:
  - surface-area
  prompt: 'Set up the integral for the surface area of the solid obtained by revolving
    $y = x^3$ on $[0, 2]$ about the **x-axis**.

    '
  choices:
  - id: a
    text: $2\pi \int_0^2 x^3 \sqrt{1 + 9x^4}\,dx$
  - id: b
    text: $2\pi \int_0^2 x \sqrt{1 + 9x^4}\,dx$
  - id: c
    text: $2\pi \int_0^2 x^3 \sqrt{1 + 3x^2}\,dx$
  - id: d
    text: $2\pi \int_0^2 (x^3)^2 \,dx$
  answer:
    choiceId: a
  explanation: 'Revolving around the x-axis, the radius is $y = x^3$. The derivative
    is $3x^2$, so $1 + (y'')^2 = 1 + 9x^4$. $S = \int 2\pi y ds$.

    '
- id: q002
  type: multipleChoice
  skills:
  - surface-area
  prompt: 'Set up the integral for the surface area of the solid obtained by revolving
    $y = x^3$ on $[0, 2]$ about the **y-axis**.

    '
  choices:
  - id: a
    text: $2\pi \int_0^2 x \sqrt{1 + 9x^4}\,dx$
  - id: b
    text: $2\pi \int_0^2 x^3 \sqrt{1 + 9x^4}\,dx$
  - id: c
    text: $2\pi \int_0^2 y \sqrt{1 + 9y^4}\,dy$
  - id: d
    text: $2\pi \int_0^2 x^2 \sqrt{1 + x^6}\,dx$
  answer:
    choiceId: a
  explanation: 'Revolving around the y-axis, the radius is $x$. So the integral is
    $2\pi \int x ds = 2\pi \int x \sqrt{1 + 9x^4}\,dx$.

    '
- id: q003
  type: numericResponse
  skills:
  - surface-area
  prompt: 'Compute the surface area of the sphere formed by revolving the semicircle
    $y = \sqrt{1 - x^2}$ from $x = -1$ to $x = 1$ around the x-axis.

    Provide the exact decimal value using $\pi \a\approx 3.14159$ to 2 decimal places.

    '
  answer:
    value: 12.57
    tolerance: 0.1
  explanation: '$y'' = \frac{1}{2}(1-x^2)^{-1/2}(-2x) = \frac{-x}{\sqrt{1-x^2}}$.

    $1 + (y'')^2 = 1 + \frac{x^2}{1-x^2} = \frac{1-x^2+x^2}{1-x^2} = \frac{1}{1-x^2}$.

    $ds = \frac{1}{\sqrt{1-x^2}}\,dx$.

    $S = \int_{-1}^1 2\pi \sqrt{1-x^2} \frac{1}{\sqrt{1-x^2}}\,dx = \int_{-1}^1 2\pi
    \,dx = 2\pi(2) = 4\pi \a\approx 12.566$.

    '
- id: q004
  type: multipleChoice
  skills:
  - surface-area
  prompt: 'Which formula should you use if you are given $x = g(y)$, revolving around
    the y-axis, and integrating with respect to $y$?

    '
  choices:
  - id: a
    text: $\int 2\pi \cdot g(y) \sqrt{1 + [g'(y)]^2}\,dy$
  - id: b
    text: $\int 2\pi \cdot y \sqrt{1 + [g'(y)]^2}\,dy$
  - id: c
    text: $\int 2\pi \cdot x \sqrt{1 + [g'(x)]^2}\,dx$
  answer:
    choiceId: a
  explanation: 'Revolving around the y-axis, the radius is $x$. Since $x = g(y)$,
    the radius is $g(y)$. The $ds$ term in terms of $y$ is $\sqrt{1 + [g''(y)]^2}dy$.

    '
- id: q005
  type: multipleChoice
  skills:
  - surface-area
  prompt: 'True or False: The surface area of a solid of revolution is exactly equal
    to the derivative of its volume.

    '
  choices:
  - id: a
    text: 'False'
  - id: b
    text: 'True'
  answer:
    choiceId: a
  explanation: 'False. While $dV = A(x)dx$, there is no general rule that the surface
    area integral is the derivative of the volume integral, because the surface area
    relies on arc length $ds = \sqrt{1+(y'')^2} dx$, which is fundamentally different
    from volume slices. (A famous exception is a sphere where $V = \frac{4}{3}\pi
    r^3$ and $S = 4\pi r^2$, but this is related to the radius, not the axis coordinate).

    '

