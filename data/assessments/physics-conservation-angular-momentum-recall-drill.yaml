items:
  - { id: cr1, type: cloze, prompt: 'With zero net external torque, angular momentum is ____.', answer: { expected: conserved, expectedLatex: '', aliases: [constant], media: [] }, explanation: 'Solution: Insert conserved.\n\nWhy it works: Zero torque gives no change in $L$.', tags: [conservation] }
  - { id: cr2, type: cloze, prompt: 'Complete conservation equation: $L_i=____$.', answer: { expected: L_f, expectedLatex: 'L_f', aliases: [final angular momentum], media: [] }, explanation: 'Solution: Insert $L_f$.\n\nWhy it works: Total angular momentum is conserved.', tags: [equation] }
  - { id: cr3, type: typed, prompt: 'When a skater pulls arms inward, does angular speed increase or decrease?', answer: { expected: increase, expectedLatex: '', aliases: [increases], media: [] }, explanation: 'Solution: It increases.\n\nWhy it works: Moment of inertia decreases while $L$ is conserved.', tags: [inertia] }
  - { id: cr4, type: typed, prompt: 'What external quantity must be negligible for angular momentum conservation?', answer: { expected: torque, expectedLatex: '', aliases: ['external torque'], media: [] }, explanation: 'Solution: It is torque.\n\nWhy it works: External torque changes angular momentum.', tags: [torque] }
  - { id: cr5, type: cloze, prompt: 'A contracting star spins ____ if angular momentum is conserved.', answer: { expected: faster, expectedLatex: '', aliases: [more rapidly], media: [] }, explanation: 'Solution: Insert faster.\n\nWhy it works: Contraction lowers moment of inertia.', tags: [applications] }
  - { id: cr6, type: typed, prompt: 'Are internal torques able to change total angular momentum of an isolated system?', answer: { expected: no, expectedLatex: '', aliases: [false], media: [] }, explanation: 'Solution: The answer is no.\n\nWhy it works: Internal torques cancel in system total.', tags: [system] }
