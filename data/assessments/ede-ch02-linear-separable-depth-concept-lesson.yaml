lesson:
  introduction: Linear and separable equations are families of related structures, not isolated recipes.
  sections:
  - id: s1
    title: Normalize before classifying
    required: true
    content: Divide by the leading coefficient only on an interval where it is nonzero. The normalized coefficients
      and their continuity determine the interval on which the linear theorem applies.
    media: []
    check:
      id: q001
      type: multipleChoice
      prompt: Normalize $xy'+2y=x^3$ on $x>0$.
      skills:
      - ede-ch02-first-order-equations-linear-ivps
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-linear-ivps
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Dividing every term by $x$ gives $y'+(2/x)y=x^2$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y'+(2/x)y=x^2$
      - id: b
        text: $y'+2y=x^2$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y'+(2/x)y=x^3$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $xy'+2y=x^2$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Complementary solutions
    required: true
    content: The complementary equation $y'+p(x)y=0$ has nonzero solutions $y_1=Ce^{-\int p dx}$. Differences of
      two solutions of the same nonhomogeneous equation solve this complementary equation.
    media: []
    check:
      id: q002
      type: multipleChoice
      prompt: 'A nonzero complementary solution for $y''+(3/x)y=0$ on $x>0$ is:'
      skills:
      - ede-ch02-first-order-equations-linear-ivps
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-linear-ivps
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $e^{-\int3/x dx}=e^{-3\ln x}=x^{-3}$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $x^{-3}$
      - id: b
        text: $x^3$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $e^{-3/x}$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $3\ln x$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Variation of parameters
    required: true
    content: Writing $y=u y_1$ uses a known complementary solution to cancel the homogeneous terms, leaving an equation
      for the varying coefficient $u$.
    media:
    - type: image
      src: /media/ede/ch02-linear-variation-parameters.svg
      alt: Relationship among a complementary solution, variation of parameters, and its reciprocal integrating
        factor.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q003
      type: multipleChoice
      prompt: If $y_1=e^{-x}$ solves $y'+y=0$, what substitution starts variation of parameters for $y'+y=f(x)$?
      skills:
      - ede-ch02-first-order-equations-linear-ivps
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-linear-ivps
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Use the product of the unknown varying parameter and the known complementary solution.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y=u(x)e^{-x}$
      - id: b
        text: $y=u(x)+e^{-x}$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y=e^{-u(x)}$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y=u'(x)e^x$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Integrating factors and complementary solutions
    required: true
    content: A nonzero complementary solution $y_1$ and an integrating factor satisfy $\mu=1/y_1$ up to a nonzero
      constant. Both viewpoints create a product derivative.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: If $y_1=x^{-2}$ is a complementary solution on $x>0$, which integrating factor matches it?
      skills:
      - ede-ch02-first-order-equations-linear-ivps
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-linear-ivps
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The reciprocal $1/y_1=x^2$ is an integrating factor.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $x^2$
      - id: b
        text: $x^{-2}$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $e^{x^{-2}}$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $2x$
        issueSignals:
        - id: ede-complementary-solution-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: Implicit separable solutions
    required: true
    content: After $dy/h(y)=g(x)dx$, integration may naturally produce an implicit relation. Isolating $y$ is optional
      unless an IVP or interpretation requires a branch.
    media: []
    check:
      id: q005
      type: multipleChoice
      prompt: After integration gives $y+\ln|y-1|=x^2+C$, what is the correct next statement?
      skills:
      - ede-ch02-first-order-equations-separable-equilibria
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-separable-equilibria
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Implicit solution relations are valid when differentiation recovers the ODE on an appropriate branch.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: It is an acceptable implicit solution relation where defined
      - id: b
        text: It is invalid unless $y$ is isolated
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Drop the logarithm absolute value
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Set $C=0$ without data
        issueSignals:
        - id: ede-implicit-branch-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Equilibria, branches, and blow-up
    required: true
    content: Dividing by a factor of $y$ can discard equilibrium solutions. An explicit nonconstant branch may also
      end at a finite point where its denominator vanishes even though the separated integral was algebraically
      valid.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: For $y'=y(y-2)$, which solutions must be recorded before division?
      skills:
      - ede-ch02-first-order-equations-separable-equilibria
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-separable-equilibria
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Both zeros of the autonomous rate give equilibrium solutions.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y=0$ and $y=2$
      - id: b
        text: $y=x$ only
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y=-2$ only
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: No constant solutions
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
