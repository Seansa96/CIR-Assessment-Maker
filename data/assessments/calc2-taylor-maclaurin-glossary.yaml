skills: [construct-taylor-coefficients, recognize-standard-maclaurin-series]
glossary:
  introduction: |
    Taylor language separates an infinite representation from its finite polynomial approximation and identifies the center controlling every coefficient.

    ![A visual comparison of Taylor polynomials near their center](/assessments/calc2-infinite-series/taylor-polynomial-imitation-sinx.svg)
  sections:
    - id: taylor-terms
      title: Taylor construction terms
      required: true
      content: A Taylor series records derivative data at one center; a Maclaurin series uses center zero.
      entries:
        - id: taylor-coefficient
          term: Taylor coefficient
          definition: The coefficient of $(x-a)^n$, found from the nth derivative at the center divided by $n!$.
          notation: '$f^{(n)}(a)/n!$'
          drills:
            - id: coefficient-cloze
              type: cloze
              prompt: 'The denominator in the nth Taylor coefficient is ____.'
              answer: { expected: 'n!' }
              explanation: Dividing by $n!$ compensates for repeated differentiation of $(x-a)^n$.
        - id: maclaurin
          term: Maclaurin series
          definition: A Taylor series whose center is zero.
          notation: '$\sum f^{(n)}(0)x^n/n!$'
          drills:
            - id: maclaurin-cloze
              type: cloze
              prompt: 'A Maclaurin series is centered at ____.'
              answer: { expected: '0', aliases: [zero] }
              explanation: Maclaurin is the name for the center-zero case.
        - id: remainder
          term: Remainder
          definition: The difference between the function and a chosen finite Taylor polynomial.
          notation: '$R_N(x)=f(x)-T_N(x)$'
          drills:
            - id: remainder-typed
              type: typed
              prompt: What does a Taylor remainder measure?
              answer: { expected: approximation error, aliases: [the error] }
              explanation: It is the portion of the function not captured by the finite polynomial.
