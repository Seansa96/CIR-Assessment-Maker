lesson:
  introduction: Instead of describing a point by its x and y coordinates on a rectangular
    grid, we can describe it by its distance from the origin and its angle from the
    positive x-axis.
  sections:
  - id: intro-polar
    title: Polar and Cartesian Conversions
    content: |-
      Polar coordinates represent points using a radius $r$ and an angle $\theta$ from the positive x-axis.

      ![Polar Coordinates](/assessments/calc2-parametric-polar/polar_coordinate_demo.svg)
    check:
      id: intro-polar-check
      type: multipleChoice
      prompt: What are the correct conversion formulas from polar to Cartesian coordinates?
      choices:
      - id: a
        text: |-
          $x=r\sin(\theta)$, $y=r\cos(\theta)$
      - id: b
        text: |-
          $x=r\cos(\theta)$, $y=r\sin(\theta)$
      - id: c
        text: |-
          $x=r^2\cos(\theta)$, $y=r^2\sin(\theta)$
      answer:
        choiceId: b
      explanation: |-
        Using right-triangle trigonometry, the adjacent side $x = r\cos(\theta)$ and the opposite side $y = r\sin(\theta)$.
