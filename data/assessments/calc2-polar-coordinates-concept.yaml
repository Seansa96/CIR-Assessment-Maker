lesson:
  introduction: |
    Polar coordinates describe a point by a distance and a direction instead of by horizontal and vertical displacement.

    Rectangular coordinates ask:

    $$
    \text{How far right and how far up?}
    $$

    Polar coordinates ask:

    $$
    \text{What angle do I face, and how far do I travel?}
    $$

    That change of viewpoint is why polar coordinates are so useful for circular, rotating, looping, and radial shapes.
  sections:
    - id: polar-point-meaning
      title: What $(r,\theta)$ Means
      required: true
      content: |
        A polar point $(r,\theta)$ has two pieces:

        - $r$ is the signed distance from the pole, which is the origin.
        - $\theta$ is the angle measured from the positive $x$-axis.

        If $r>0$, move in the direction of $\theta$.

        If $r<0$, face the direction of $\theta$, then move backward through the pole. This places the point on the opposite ray.

        ![Polar Coordinates](/assessments/calc2-parametric-polar/polar_coordinate_demo.svg)
      check:
        id: polar-point-meaning-check
        type: multipleChoice
        prompt: What does the coordinate $(-3,\theta)$ mean geometrically?
        choices:
          - id: a
            text: Face angle $\theta$, then move 3 units in the opposite direction.
          - id: b
            text: Move 3 units clockwise from the positive $x$-axis.
          - id: c
            text: Move 3 units in the direction of $\theta$ and then reflect over the $x$-axis.
          - id: d
            text: The point is invalid because polar radius cannot be negative.
        answer:
          choiceId: a
        explanation: |
          A negative radius does not make the point invalid. It means the point lies on the ray opposite the direction named by $\theta$.

          Related topic: signed polar radius.

    - id: conversion-triangle
      title: The Conversion Triangle
      required: true
      content: |
        The basic conversion formulas come from the right triangle formed by the point, the origin, and the $x$-axis.

        Since $r$ is the hypotenuse:

        $$
        x=r\cos\theta,
        \qquad
        y=r\sin\theta.
        $$

        Going from rectangular to polar uses:

        $$
        r^2=x^2+y^2,
        \qquad
        \tan\theta=\frac{y}{x}.
        $$

        The tangent formula needs quadrant checking because tangent alone does not identify the quadrant.

        ![Right triangle showing x equals r cosine theta and y equals r sine theta](/assessments/calc2-parametric-polar/polar-conversion-triangle-components.svg)
      check:
        id: conversion-triangle-check
        type: multipleChoice
        prompt: Which pair correctly converts from polar to rectangular coordinates?
        choices:
          - id: a
            text: '$x=r\cos\theta$, $y=r\sin\theta$'
          - id: b
            text: '$x=r\sin\theta$, $y=r\cos\theta$'
          - id: c
            text: '$x=r^2\cos\theta$, $y=r^2\sin\theta$'
          - id: d
            text: '$x=\tan\theta$, $y=r^2$'
        answer:
          choiceId: a
        explanation: |
          The $x$-coordinate is adjacent to $\theta$, so $x=r\cos\theta$. The $y$-coordinate is opposite $\theta$, so $y=r\sin\theta$.

    - id: multiple-representations
      title: One Point Has Many Polar Names
      required: true
      content: |
        Rectangular coordinates usually name a point one way. Polar coordinates can name the same point many ways.

        For example:

        $$
        (r,\theta),
        \quad
        (r,\theta+2\pi),
        \quad
        (-r,\theta+\pi)
        $$

        all represent the same physical point.

        This matters in calculus problems because the same point may be reached at different angles. When a problem asks for points, convert accepted angles to $(x,y)$ and remove duplicate physical locations.

        ![Polar point with equivalent positive and negative radius names](/assessments/calc2-parametric-polar/polar-coordinate-representation-map.svg)
      check:
        id: multiple-representations-check
        type: multipleChoice
        prompt: Which polar coordinate names the same point as $(4,\frac{\pi}{6})$?
        choices:
          - id: a
            text: '$(-4,\frac{7\pi}{6})$'
          - id: b
            text: '$(4,\frac{7\pi}{6})$'
          - id: c
            text: '$(-4,\frac{\pi}{6})$'
          - id: d
            text: '$(4,-\frac{5\pi}{6})$'
        answer:
          choiceId: a
        explanation: |
          Adding $\pi$ to the angle points in the opposite direction. Using a negative radius then moves backward, landing on the original point.

    - id: converting-equations
      title: Converting Equations Without Losing Meaning
      required: true
      content: |
        Polar equations often become rectangular equations by using:

        $$
        x=r\cos\theta,
        \qquad
        y=r\sin\theta,
        \qquad
        r^2=x^2+y^2.
        $$

        A common move is to multiply by $r$ first. For example:

        $$
        r=4\cos\theta
        $$

        becomes:

        $$
        r^2=4r\cos\theta.
        $$

        Then convert:

        $$
        x^2+y^2=4x.
        $$

        Completing the square shows this is a circle:

        $$
        (x-2)^2+y^2=4.
        $$

        ![Polar equation r equals four cosine theta converted into a rectangular circle](/assessments/calc2-parametric-polar/polar-r4cos-cartesian-circle.svg)
      check:
        id: converting-equations-check
        type: multipleChoice
        prompt: Why is multiplying by $r$ often useful before converting a polar equation?
        choices:
          - id: a
            text: It creates $r^2$, $r\cos\theta$, or $r\sin\theta$, which convert cleanly to rectangular expressions.
          - id: b
            text: It removes the need to check quadrants.
          - id: c
            text: It guarantees the graph is a line.
          - id: d
            text: It changes every polar equation into a polynomial of degree one.
        answer:
          choiceId: a
        explanation: |
          The expressions $r^2$, $r\cos\theta$, and $r\sin\theta$ convert directly to $x^2+y^2$, $x$, and $y$.

    - id: polar-symmetry
      title: Symmetry Tests Are Pattern Clues
      required: true
      content: |
        Polar symmetry helps you predict and check a graph.

        Common tests:

        - Replace $\theta$ with $-\theta$ to test symmetry across the polar axis.
        - Replace $\theta$ with $\pi-\theta$ to test symmetry across the vertical axis.
        - Replace $r$ with $-r$ or $\theta$ with $\theta+\pi$ to test symmetry about the pole.

        These tests are not just formal tricks. They ask whether the equation is unchanged when the point is reflected in a particular polar way.

        ![Polar symmetry tests for the polar axis, vertical axis, and pole](/assessments/calc2-parametric-polar/polar-symmetry-tests-map.svg)
      check:
        id: polar-symmetry-check
        type: multipleChoice
        prompt: If replacing $\theta$ with $-\theta$ leaves a polar equation unchanged, what symmetry is suggested?
        choices:
          - id: a
            text: Symmetry across the polar axis.
          - id: b
            text: Symmetry across the line $\theta=\frac{\pi}{2}$.
          - id: c
            text: No symmetry is possible.
          - id: d
            text: The curve must be a rose.
        answer:
          choiceId: a
        explanation: |
          The substitution $\theta\mapsto-\theta$ reflects angles across the polar axis, which is the positive $x$-axis.

    - id: why-polar
      title: Why Use Polar Coordinates?
      required: true
      content: |
        Polar coordinates are useful when distance from a center depends naturally on direction.

        Examples:

        - circles centered near the origin,
        - cardioids and limacons,
        - rose curves,
        - spirals,
        - regions swept out by rotating rays,
        - problems where area is built from angular wedges.

        The guiding question is:

        $$
        \text{Would this shape be easier to describe by radius as a function of angle?}
        $$

        If yes, polar coordinates may turn a complicated rectangular equation into a simple radial rule.
      check:
        id: why-polar-check
        type: selectAll
        prompt: Which situations usually suggest polar coordinates?
        choices:
          - id: a
            text: A region is naturally swept out by rotating rays.
          - id: b
            text: The radius from the origin changes with angle in a simple pattern.
          - id: c
            text: The graph is a straight horizontal line with no radial structure.
          - id: d
            text: The shape has loops or petals around the origin.
        answer:
          choiceIds:
            - a
            - b
            - d
        explanation: |
          Polar coordinates shine when angular motion and distance from the origin are central to the shape.
