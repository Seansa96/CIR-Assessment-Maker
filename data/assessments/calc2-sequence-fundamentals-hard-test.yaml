schemaVersion: 1
id: calc2-sequence-fundamentals-hard-test
title: Sequence Fundamentals Hard Test
assessmentType: test
categoryId: calculus-2
topicId: sequence-fundamentals
skills:
- Evaluate algebraic, oscillatory, exponential, and finite-sum limits
- Prove recurrence convergence with bounds and fixed points
- Use subsequences, Cauchy reasoning, and counterexamples
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - sequence-fundamentals
  - hard
  - limit-reasoning
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - evaluate-rational-sequence-limits
  prompt: |
    Evaluate $\displaystyle\lim_{n\to\infty}\frac{(n+1)^2-n^2}{3n+5}$.
  choices:
  - id: a
    text: $2/3$
  - id: b
    text: $0$
  - id: c
    text: $1/3$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: Expanding the numerator gives $2n+1$, and the ratio of leading coefficients is $2/3$.
- id: q002
  type: multipleChoice
  skills:
  - apply-the-squeeze-theorem
  prompt: |
    What is $\displaystyle\lim_{n\to\infty}\frac{n\sin n}{n^2+1}$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: Does not exist
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: Its absolute value is at most $n/(n^2+1)$, which tends to zero.
- id: q003
  type: multipleChoice
  skills:
  - prove-monotone-bounded-convergence
  prompt: |
    Let $a_1=0$ and $a_{n+1}=(a_n+3)/2$. Which description is correct?
  choices:
  - id: a
    text: $a_n$ increases to $3$.
  - id: b
    text: $a_n$ decreases to $0$.
  - id: c
    text: $a_n$ increases without bound.
  - id: d
    text: $a_n$ alternates around $3$.
  answer:
    choiceId: a
  explanation: If $a_n<3$, then $a_n<a_{n+1}<3$; induction and the fixed-point equation give the limit
    three.
- id: q004
  type: multipleChoice
  skills:
  - classify-geometric-sequences
  prompt: |
    Determine the limit of $a_n=5(-3/4)^n$.
  choices:
  - id: a
    text: $0$
  - id: b
    text: $5$
  - id: c
    text: Does not exist
  - id: d
    text: |-
      $-\infty$
  answer:
    choiceId: a
  explanation: Although signs alternate, the magnitude is $5(3/4)^n$, which tends to zero.
- id: q005
  type: multipleChoice
  skills:
  - analyze-subsequences
  prompt: |
    What are the limits of the even and odd subsequences of
    $a_n=(-1)^n+1/n$?
  choices:
  - id: a
    text: $1$ and $-1$, respectively
  - id: b
    text: $-1$ and $1$, respectively
  - id: c
    text: Both are $0$
  - id: d
    text: Neither exists
  answer:
    choiceId: a
  explanation: At even indices the sign term is one; at odd indices it is negative one, while the reciprocal
    perturbation vanishes.
- id: q006
  type: multipleChoice
  skills:
  - distinguish-boundedness-and-convergence
  prompt: |
    Which additional condition, together with boundedness, guarantees that a
    real sequence converges?
  choices:
  - id: a
    text: Monotonicity
  - id: b
    text: Infinitely many positive terms
  - id: c
    text: Distinct terms
  - id: d
    text: A bounded first difference
  answer:
    choiceId: a
  explanation: The monotone convergence theorem states that a bounded monotone sequence converges.
- id: q007
  type: multipleChoice
  skills:
  - evaluate-nth-root-limits
  prompt: |
    Find $\displaystyle\lim_{n\to\infty}n^{1/n}$.
  choices:
  - id: a
    text: $1$
  - id: b
    text: $e$
  - id: c
    text: $0$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: |-
    The logarithm is $(\ln n)/n\to0$, so exponentiation gives $e^0=1$.
- id: q008
  type: multipleChoice
  skills:
  - compare-factorial-and-exponential-growth
  prompt: |
    What is $\displaystyle\lim_{n\to\infty}\frac{4^n}{n!}$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: $4$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: The consecutive ratio is $4/(n+1)$, eventually bounded by a fixed number below one.
- id: q009
  type: multipleChoice
  skills:
  - recognize-riemann-sum-limits
  prompt: |
    Evaluate $\displaystyle\lim_{n\to\infty}\frac1{n^3}\sum_{k=1}^{n}k^2$.
  choices:
  - id: a
    text: $1/3$
  - id: b
    text: $1/2$
  - id: c
    text: $1$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: |-
    Rewrite the expression as $(1/n)\sum(k/n)^2$, a Riemann sum for $\int_0^1x^2\,dx$.
- id: q010
  type: multipleChoice
  skills:
  - apply-the-cauchy-criterion
  prompt: |
    Which condition is the Cauchy criterion for a real sequence $(a_n)$?
  choices:
  - id: a
    text: |-
      For every $\varepsilon>0$, sufficiently large $m,n$ satisfy $|a_m-a_n|<\varepsilon$.
  - id: b
    text: |-
      $a_{n+1}-a_n\to0$.
  - id: c
    text: |-
      $|a_n|\le1$ eventually.
  - id: d
    text: Some subsequence converges.
  answer:
    choiceId: a
  explanation: Convergence in the complete real line is equivalent to uniform closeness of every pair
    in a sufficiently late tail.
- id: q011
  type: multipleChoice
  skills:
  - evaluate-logarithmic-growth-limits
  prompt: |
    Determine $\displaystyle\lim_{n\to\infty}\frac{\ln n}{\sqrt n}$.
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: |-
      $+\infty$
  - id: d
    text: Does not exist
  answer:
    choiceId: a
  explanation: |-
    Any positive power dominates a logarithm; equivalently, l'Hôpital on the continuous analogue gives $(1/x)/(1/(2\sqrt x))=2/\sqrt x\to0$.
- id: q012
  type: multipleChoice
  skills:
  - evaluate-radical-difference-limits
  prompt: |
    Find $\displaystyle\lim_{n\to\infty}\left(\sqrt{n^2+4n}-n\right)$.
  choices:
  - id: a
    text: $2$
  - id: b
    text: $0$
  - id: c
    text: $4$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: |-
    The conjugate gives $4n/(\sqrt{n^2+4n}+n)$, and division by $n$ yields a denominator tending to two.
- id: q013
  type: multipleChoice
  skills:
  - reason-about-subsequence-implications
  prompt: |
    A sequence has one subsequence converging to $2$ and another converging
    to $5$. What follows?
  choices:
  - id: a
    text: The original sequence diverges.
  - id: b
    text: The original sequence converges to $7/2$.
  - id: c
    text: The original sequence converges to $2$.
  - id: d
    text: The sequence is unbounded.
  answer:
    choiceId: a
  explanation: Every subsequence of a convergent sequence must share the full sequence's unique limit.
- id: q014
  type: multipleChoice
  skills:
  - solve-linear-recurrences
  prompt: |
    Let $a_1=10$ and $a_{n+1}=(2a_n+3)/5$. What is $\lim a_n$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $3/5$
  - id: c
    text: $10$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: The fixed point is one and $a_{n+1}-1=(2/5)(a_n-1)$, so the error tends geometrically to
    zero.
- id: q015
  type: multipleChoice
  skills:
  - use-eventual-properties
  prompt: |
    If a convergent sequence has its first one million terms replaced by
    arbitrary real values, what happens?
  choices:
  - id: a
    text: It retains the same limit.
  - id: b
    text: It necessarily diverges.
  - id: c
    text: Its limit becomes the average replacement value.
  - id: d
    text: It converges only if replacements are bounded by one.
  answer:
    choiceId: a
  explanation: The modified sequence has exactly the same tail as the original, and the definition of
    limit ignores every finite prefix.
