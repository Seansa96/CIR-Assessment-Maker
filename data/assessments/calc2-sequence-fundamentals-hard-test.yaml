  prompt: |
    Evaluate $\displaystyle\lim_{n\to\infty}\frac{(n+1)^2-n^2}{3n+5}$.
  choices:
  - id: a
    text: $2/3$
  - id: b
    text: $0$
  - id: c
    text: $1/3$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: a
  explanation: |-
    Solution: Expanding the numerator gives $2n+1$, and the ratio of leading coefficients is $2/3$. Therefore the answer is $2/3$.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

    Why the other choices fail: $0$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $1/3$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $+\infty$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
