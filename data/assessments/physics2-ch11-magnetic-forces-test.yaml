questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch11-modeling
  prompt: A Magnetic Forces and Fields situation emphasizes magnetic-field direction. Define the system and sign
    convention, state when $F=qvB\\sin\\theta$ applies, and construct a written solution that includes the relation,
    units, assumptions, and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $F=qvB\\sin\\theta$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Magnetic Forces and Fields model of magnetic force on moving charge and current is reliable
    only when its relation, conditions, and interpretation are kept together.'
  difficultyDimensions: &id001
  - modelOrDerivation
  - proofJustification
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch11-modeling
  difficultyEvidence: Requires a multi-step written model, transfer from a verbal situation to a governing relation,
    and justification of conditions and limiting behavior.
