attemptQuestionCount: 1
questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - spatial-reasoning
  prompt: A proton moves with a speed of $5.0 \times 10^5\text{ m/s}$ through a magnetic field of $1.2\text{
    T}$. The velocity vector makes an angle of $30^\circ$ with the magnetic field vector. What is the
    magnitude of the magnetic force on the proton (in femtoNewtons, $1\text{ fN} = 10^{-15}\text{ N}$)?
    (Use $e = 1.6 \times 10^{-19}\text{ C}$).
  answer:
    tolerance: 0.5
    value: 48.0
  explanation: "Solution:\n1) Magnitude of force: $F_B = |q|vB \\sin\\theta$.\n2) Substitute values: $F_B\
    \ = (1.6 \\times 10^{-19})(5.0 \\times 10^5)(1.2) \\sin(30^\\circ)$.\n3) $F_B = (1.6 \\times 10^{-19})(5.0\
    \ \\times 10^5)(1.2)(0.5)$.\n4) $F_B = 4.8 \\times 10^{-14}\\text{ N} = 48.0 \times 10^{-15}\\text{\
    \ N} = 48.0\\text{ fN}$.\n\nWhy it works:\nThe magnetic force depends only on the component of velocity\
    \ perpendicular to the magnetic field."
