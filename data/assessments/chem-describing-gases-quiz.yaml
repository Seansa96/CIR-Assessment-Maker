questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      Which of the following is **not** a postulate of the Kinetic-Molecular Theory (KMT) of ideal gases?
    choices:
      - id: a
        text: Gas particles are in constant, random motion.
      - id: b
        text: The volume of the gas particles is negligible compared to the volume of the container.
      - id: c
        text: Gas particles exert strong intermolecular attractive forces on each other.
      - id: d
        text: Collisions between gas particles are perfectly elastic.
    answer:
      choiceId: c
    explanation: |
      The KMT explicitly assumes that there are **no attractive or repulsive forces** (intermolecular forces) between ideal gas particles.

  - id: q002
    type: numericResponse
    skills:
      - chem-describing-gases
    prompt: |
      A weather balloon records an atmospheric pressure of **0.850 atm**. What is this pressure expressed in **torr**?

      (1 atm = 760 torr)
    answer:
      value: 646
      tolerance: 1
    explanation: |
      $$0.850 \text{ atm} \times \frac{760 \text{ torr}}{1 \text{ atm}} = 646 \text{ torr}$$

  - id: q003
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      According to the KMT, how is the pressure of a gas on the walls of its container generated?
    choices:
      - id: a
        text: By the repulsion between the gas particles and the wall material.
      - id: b
        text: By the collisions of the gas molecules with the container walls.
      - id: c
        text: By the expansion of the gas molecules as they heat up.
      - id: d
        text: By the gravitational pull of the earth on the gas molecules.
    answer:
      choiceId: b
    explanation: |
      Pressure is force per unit area. This force is generated by the physical **collisions** of moving gas particles transferring momentum to the container walls.

  - id: q004
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      If the Kelvin temperature of a gas sample is doubled, what happens to the average kinetic energy of the gas particles?
    choices:
      - id: a
        text: It doubles.
      - id: b
        text: It quadruples.
      - id: c
        text: It increases by a factor of 1.41 (the square root of 2).
      - id: d
        text: It remains constant.
    answer:
      choiceId: a
    explanation: |
      Average kinetic energy is **directly proportional** to the absolute (Kelvin) temperature. If $T$ doubles, $KE_{avg}$ doubles.

  - id: q005
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      When analyzing a Maxwell-Boltzmann speed distribution graph, what effect does **decreasing** the temperature have on the curve?
    choices:
      - id: a
        text: The peak shifts to the right and becomes broader.
      - id: b
        text: The peak shifts to the left and becomes taller and narrower.
      - id: c
        text: The peak shifts to the right and becomes taller.
      - id: d
        text: The curve shape does not change; it only shifts up.
    answer:
      choiceId: b
    explanation: |
      Decreasing the temperature lowers the average speed (shifting the peak to the **left**). Because there is less thermal energy spreading the speeds out, a larger fraction of molecules moves near this lower average, making the peak **taller and narrower**.

  - id: q006
    type: numericResponse
    skills:
      - chem-describing-gases
    prompt: |
      A pressure gauge reads **1520 mm Hg**. Convert this pressure to **atm**.

      (1 atm = 760 mm Hg)
    answer:
      value: 2
      tolerance: 0
    explanation: |
      $$1520 \text{ mm Hg} \times \frac{1 \text{ atm}}{760 \text{ mm Hg}} = 2 \text{ atm}$$

  - id: q007
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      Under what conditions do real gases deviate most significantly from ideal gas behavior?
    choices:
      - id: a
        text: High temperature and low pressure
      - id: b
        text: High temperature and high pressure
      - id: c
        text: Low temperature and high pressure
      - id: d
        text: Low temperature and low pressure
    answer:
      choiceId: c
    explanation: |
      Real gases deviate from ideality when they are compressed close together (**high pressure**, meaning particle volume is no longer negligible) and when they move slowly enough for intermolecular forces to take hold (**low temperature**).

  - id: q008
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      Which of the following describes a perfectly elastic collision?
    choices:
      - id: a
        text: A collision where some kinetic energy is converted into heat.
      - id: b
        text: A collision where the particles stick together afterward.
      - id: c
        text: A collision in which there is no net loss of total kinetic energy.
      - id: d
        text: A collision that causes the gas particles to break into smaller fragments.
    answer:
      choiceId: c
    explanation: |
      An elastic collision is one in which the total kinetic energy before the collision equals the total kinetic energy after the collision. Energy may be transferred between particles, but none is lost.

  - id: q009
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      Why does the Kinetic-Molecular Theory state that the volume of the gas particles themselves is negligible?
    choices:
      - id: a
        text: Because gas particles are actually made of photons, which have no mass or volume.
      - id: b
        text: Because the distances between gas particles are immensely large compared to the size of the particles themselves.
      - id: c
        text: Because gas particles shrink when they collide.
      - id: d
        text: Because gases can only exist in very small containers.
    answer:
      choiceId: b
    explanation: |
      In a typical gas at normal pressures, the distance between particles is roughly 10 times the diameter of the particles. This means the empty space makes up >99.9% of the total volume, allowing us to mathematically ignore the volume of the particles themselves.

  - id: q010
    type: multipleChoice
    skills:
      - chem-describing-gases
    prompt: |
      Consider two samples of ideal gas: Helium ($He$) at 300 K, and Argon ($Ar$) at 300 K. How do their average kinetic energies compare?
    choices:
      - id: a
        text: Helium has a higher average kinetic energy because it is lighter.
      - id: b
        text: Argon has a higher average kinetic energy because it is heavier.
      - id: c
        text: Both gases have the exact same average kinetic energy because they are at the same temperature.
      - id: d
        text: It is impossible to tell without knowing the pressure.
    answer:
      choiceId: c
    explanation: |
      According to the KMT, average kinetic energy depends **only on temperature**, regardless of the identity or mass of the gas. Since both are at 300 K, their average kinetic energies are identical. (Helium molecules will be moving *faster* on average to achieve that same kinetic energy, but the energy itself is equal).
