schemaVersion: 1
id: aops-angles-recall
title: Angles Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-angles
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags: [art-of-problem-solving, aops-angles, angle-theorem-recall, geometry]
skills:
- Recall line, triangle, parallel-line, and circle-angle relations
- Match each relation to its positional hypothesis
items:
- id: full-turn
  type: flashcard
  prompt: How many degrees and radians are in a full turn?
  answer:
    expected: 360 degrees and 2 pi radians.
    aliases: ['$360^\circ$ and $2\pi$']
  explanation: Degree and radian measures describe the same rotation.
  tags: [angle-measure]
- id: straight-angle
  type: flashcard
  prompt: What is the measure of a straight angle?
  answer:
    expected: 180 degrees or pi radians.
  explanation: It is half a full turn.
  tags: [angle-measure]
- id: vertical-relation
  type: flashcard
  prompt: What relation holds between vertical angles?
  answer: {expected: They are equal.}
  explanation: They are opposite angles at one intersection.
  tags: [vertical-angles]
- id: linear-pair-relation
  type: flashcard
  prompt: What sum does a linear pair have?
  answer: {expected: 180 degrees.}
  explanation: The noncommon sides form a straight line.
  tags: [linear-pair]
- id: corresponding-relation
  type: flashcard
  prompt: What relation holds between corresponding angles when the lines are parallel?
  answer: {expected: They are equal.}
  explanation: The pair occupies matching corners at the transversal intersections.
  tags: [corresponding-angles]
- id: alternate-interior-relation
  type: flashcard
  prompt: What relation holds between alternate interior angles of parallel lines?
  answer: {expected: They are equal.}
  explanation: They lie inside the lines on opposite sides of the transversal.
  tags: [alternate-interior]
- id: same-side-relation
  type: flashcard
  prompt: What relation holds between same-side interior angles of parallel lines?
  answer: {expected: They are supplementary.}
  explanation: Their measures sum to $180^\circ$.
  tags: [same-side-interior]
- id: triangle-sum
  type: flashcard
  prompt: What is the sum of a triangle's interior angles?
  answer: {expected: 180 degrees.}
  explanation: This invariant supports the exterior-angle theorem.
  tags: [triangle-sum]
- id: exterior-angle-rule
  type: flashcard
  prompt: State the triangle exterior-angle theorem.
  answer: {expected: An exterior angle equals the sum of the two remote interior angles.}
  explanation: It follows from triangle sum and a linear pair.
  tags: [exterior-angle]
- id: central-angle-rule
  type: flashcard
  prompt: How does a central angle compare with its intercepted arc?
  answer: {expected: Their degree measures are equal.}
  explanation: The vertex is at the center.
  tags: [central-angle]
- id: inscribed-angle-rule
  type: flashcard
  prompt: How does an inscribed angle compare with its intercepted arc?
  answer: {expected: It is half the arc measure.}
  explanation: Its vertex lies on the circle.
  tags: [inscribed-angle]
- id: diameter-inscribed-rule
  type: flashcard
  prompt: What is an inscribed angle that subtends a diameter?
  answer: {expected: 90 degrees.}
  explanation: It intercepts a $180^\circ$ semicircle.
  tags: [inscribed-angle]
- id: interior-chord-rule
  type: flashcard
  prompt: What arc operation is used for two chords intersecting inside a circle?
  answer: {expected: Half the sum of the intercepted arcs.}
  explanation: An interior vertex uses a sum.
  tags: [interior-chord-angle]
- id: exterior-secant-rule
  type: flashcard
  prompt: What arc operation is used for two secants meeting outside a circle?
  answer: {expected: Half the difference of the far and near intercepted arcs.}
  explanation: An exterior vertex uses a difference.
  tags: [exterior-secant-angle]
- id: tangent-chord-rule
  type: flashcard
  prompt: How is a tangent-chord angle measured?
  answer: {expected: Half its intercepted arc, equal to an inscribed angle intercepting the same chord.}
  explanation: Its vertex lies on the circle at the tangency point.
  tags: [tangent-chord]
