      explanation: >-
        Solution: Holding y fixed makes 5y² the coefficient of x, so the derivative is 5y².


        Why it works: The x derivative of Cx is C when C is fixed.


        Why the other choices fail:

        Choice b: b differentiates y as though it changed.

        Choice c: c leaves x in the result.

        Choice d: d incorrectly treats the entire expression as constant.
