  - id: s03
    title: Apply familiar derivative rules
    required: true
    content: For f=x²−3xy+2y²−4x+5y−12, fₓ=2x−3y−4. The y-only terms contribute zero. Reversing the operation gives fᵧ=−3x+4y+5.
