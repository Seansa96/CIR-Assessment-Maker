        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The derivative units are meters of height divided by meters of horizontal displacement, or m/m.


        Why it works: A partial derivative is an output rate with respect to the named input.


        Why the other choices fail:

        Choice b: b multiplies units instead of dividing.

        Choice c: c omits the input-distance denominator.

        Choice d: d mistakes a scalar slope for a vector.
