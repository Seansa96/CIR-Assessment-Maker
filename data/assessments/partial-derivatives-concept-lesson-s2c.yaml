  - id: s03
    title: Higher partials measure change
    required: true
    content: Second partials differentiate a first partial and support later local classification. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
