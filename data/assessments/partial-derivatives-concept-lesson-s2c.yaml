      id: check-03
      type: multipleChoice
      prompt: For that f, what is fᵧ?
      choices:
      - id: a
        text: −3x+4y+5
        media: []
        issueSignals: []
      - id: b
        text: 2x−3y−4
        media: []
        issueSignals:
