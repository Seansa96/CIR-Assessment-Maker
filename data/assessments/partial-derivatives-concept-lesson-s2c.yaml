  - id: s08
    title: How a partial differs from an ordinary derivative
    required: true
    content: 'For a one-variable function, f′(a) is the tangent slope of its graph at x=a. For a surface f(x,y), there is no single slope unless you also name a direction. Choose the x direction by freezing y=b; then g(x)=f(x,b) is an ordinary one-variable function and g′(a)=fₓ(a,b). Choose the y direction by freezing x=a; its slope is fᵧ(a,b). A partial is not a new kind of one-variable differentiation rule: it is the familiar derivative applied after selecting a coordinate slice. The surface can rise in one slice and fall in another at the same point.'
    media: []
    check:
      id: check-08
      type: multipleChoice
      prompt: For z=f(x,y), what is the geometric meaning of fₓ(a,b)?
      choices:
      - id: a
        text: The ordinary derivative at x=a of the slice g(x)=f(x,b)
        media: []
        issueSignals: []
      - id: b
        text: The slope of every path through the surface point
        media: []
        issueSignals: []
      - id: c
        text: The height f(a,b)
        media: []
        issueSignals: []
      - id: d
        text: A derivative that changes x and y at the same time
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Fix y=b and define g(x)=f(x,b); then g′(a)=fₓ(a,b).


        Why it works: The limit for g′(a) is [f(a+h,b)−f(a,b)]/h, exactly the x partial difference quotient. An ordinary derivative takes the slope of a curve; a partial selects one curve from the surface first.


        Why the other choices fail:

        Choice b: A general path may change x and y together and has a direction-dependent rate.

        Choice c: f(a,b) is the surface height, not a tangent slope.

        Choice d: A partial holds y fixed; changing both inputs describes a different rate.
