lesson:
  introduction: 'A partial derivative answers a direct question: if one input changes and the others stay fixed, how quickly does the output change? Ordinary derivative rules do the calculation; the surface picture gives the meaning.'
  sections:
  - id: s01
    title: Hold one input fixed
    required: true
    content: 'The left panel shows an ordinary derivative: for the one-input curve y=f(x), f′(a) is the tangent slope at x=a. The right panel shows a two-input surface z=f(x,y). Fix y=b and the surface becomes the one-input slice g(x)=f(x,b); its tangent slope is g′(a)=fₓ(a,b). Fix x=a instead and the other slice has slope fᵧ(a,b). A partial derivative is therefore an ordinary derivative applied to one coordinate slice, while the surface has more than one independent direction to examine.'
    media:
    - type: image
      src: /media/calculus-3/partial-derivatives.svg
      alt: 'Side-by-side graph: an ordinary one-input curve with tangent slope f prime at a; and a two-input surface with x- and y-coordinate slices through one point, whose tangent slopes are f sub x and f sub y.'
      caption: The ordinary derivative measures slope along its curve. A surface has multiple coordinate slices, and each partial is the ordinary slope along one selected slice.
    check:
      id: check-01
      type: multipleChoice
      prompt: Which slice gives fₓ(a,b)?
      choices:
      - id: a
        text: y=b while x changes
        media: []
        issueSignals: []
      - id: b
        text: x=a while y changes
        media: []
        issueSignals:
        - id: held-variable-confusion
          domains: []
      - id: c
        text: both inputs change
        media: []
        issueSignals:
        - id: held-variable-confusion
          domains: []
      - id: d
        text: the horizontal contour
        media: []
        issueSignals:
        - id: held-variable-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The x-slice is the vertical trace y=b, so its curve changes x only.


        Why it works: On the left panel, ordinary f′(a) is a slope on one curve. On the right, fₓ(a,b) is the derivative of g(x)=f(x,b) at a.


        Why the other choices fail:

        Choice b: b changes y instead.

        Choice c: c changes two coordinates.

        Choice d: d is a level curve, not the vertical x-slice.
