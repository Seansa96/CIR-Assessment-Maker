  - id: s07
    title: Track higher-order notation
    required: true
    content: A first partial is itself a function, so differentiate it again. fₓᵧ means take fₓ and then differentiate that result in y. Clairaut guarantees the mixed orders match when the mixed second partials are continuous near the point; the condition matters.
