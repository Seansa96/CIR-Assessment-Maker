      explanation: >-
        Solution: Differentiate each term in y: x² contributes 0, −3xy contributes −3x, 2y² contributes 4y, and 5y contributes 5.


        Why it works: The requested y partial changes y while x stays fixed.


        Why the other choices fail:

        Choice b: b is the x partial.

        Choice c: c reverses the derivative of 5y.

        Choice d: d differentiates x² instead of holding it constant.
