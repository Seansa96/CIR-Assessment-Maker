  - id: s06
    title: Use the chain rule inside a partial
    required: true
    content: For g=sin(x²y−2x+4), differentiate the sine and multiply by the inside derivative in the requested variable. In gᵧ, x is fixed, so the inside derivative is x² and gᵧ=x²cos(x²y−2x+4). In gₓ it is 2xy−2.
