  - id: s02
    title: Translate notation into an action
    required: true
    content: 'The operator ∂/∂x means change x, freeze every other independent variable, and use ordinary derivative rules. A frozen variable stays in the algebra as a coefficient: ∂(x²y)/∂x=2xy because y remains.'
