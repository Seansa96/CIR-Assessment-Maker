  - id: s05
    title: Interpret units and sign
    required: true
    content: A partial is output change per change in the named input. If f is temperature in °C and x is measured in meters, fₓ has units °C/m. A negative value means the output decreases as x increases locally with the other input fixed. It is a scalar slope, not the height or a vector.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: If f is height in meters and x is distance in meters, what are the units of fₓ?
      choices:
      - id: a
        text: m/m
        media: []
        issueSignals: []
      - id: b
        text: m²
        media: []
        issueSignals:
        - id: held-variable-confusion
          domains: []
      - id: c
        text: m
        media: []
        issueSignals:
        - id: held-variable-confusion
          domains: []
      - id: d
        text: a vector
        media: []
        issueSignals:
        - id: held-variable-confusion
          domains: []
