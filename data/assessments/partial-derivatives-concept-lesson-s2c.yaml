  - id: s04
    title: The limit creates an instantaneous rate
    required: true
    content: For fₓ(a,b), compare f(a+h,b) with f(a,b), divide the output change by h, then let h→0. The second coordinate remains b. This is an ordinary derivative along one vertical slice; the y definition swaps the roles.
