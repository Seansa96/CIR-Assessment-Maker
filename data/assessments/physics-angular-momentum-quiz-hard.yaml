questions:
- id: q1
  type: numericResponse
  prompt: A $2.0 \text{ kg}$ particle moves parallel to the x-axis at $y=3.0 \text{
    m}$ with a constant speed of $5.0 \text{ m/s}$ in the +x direction. What is the
    magnitude of its angular momentum about the origin?
  answer:
    value: 30.0
    tolerance: 1.0
  difficultyDimensions: [modelOrDerivation, representationTransfer, domainCondition]
  subjectDifficultyTags: [particle-angular-momentum, perpendicular-distance]
  difficultyEvidence: Identifies the perpendicular lever arm for a particle whose position and velocity are not parallel.
  prerequisiteObjectiveIds: [phys1-obj-fixed-axis-rotation]
  extensionObjectiveIds: [phys1-obj-fixed-axis-rotation]
  explanation: |
    Solution: The distance from the origin to the line of motion is the perpendicular distance $r_\perp=3.0\ \text{m}$. Thus

    $$
    L=mvr_\perp=(2.0)(5.0)(3.0)=30\ \text{kg}\cdot\text{m}^2/\text{s}.
    $$

    Why it works: The magnitude of a cross product is $L=|\vec r\times\vec p|=mvr_\perp$; only the component of position perpendicular to the momentum contributes.
