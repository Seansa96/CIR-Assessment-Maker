glossary:
  introduction: 'Vocabulary for aqueous reactions.'
  sections:
    - id: reaction-terms
      title: Reaction Vocabulary
      entries:
        - id: entry-precipitate
          term: precipitate
          definition: 'An insoluble solid that emerges from a liquid solution.'
          drills:
            - { id: arg-02, type: flashcard, prompt: 'What is a precipitate?', answer: { expected: An insoluble solid }, explanation: 'Solution: An insoluble solid. Why it works: It falls out of solution.' }
        - id: entry-spectator
          term: spectator ions
          definition: 'Ions that are present in solution but do not participate in a chemical reaction.'
          drills:
            - { id: arg-01, type: cloze, prompt: 'Ions that do not participate in the reaction are called ___ ions.', answer: { expected: spectator }, explanation: 'Solution: The blank is spectator. Why it works: They just watch the reaction happen.' }
        - id: entry-complete-ionic
          term: complete ionic equation
          definition: 'An equation that shows all soluble strong electrolytes as individual ions.'
          drills:
            - { id: arg-03, type: flashcard, prompt: 'What does a complete ionic equation show?', answer: { expected: all soluble strong electrolytes as ions }, explanation: 'Solution: All soluble strong electrolytes as ions. Why it works: It represents reality in solution.' }
        - id: entry-net-ionic
          term: net ionic equation
          definition: 'An equation that includes only the species that are actually involved in the reaction.'
          drills:
            - { id: arg-04, type: flashcard, prompt: 'What is omitted in a net ionic equation?', answer: { expected: spectator ions }, explanation: 'Solution: Spectator ions are omitted. Why it works: Only reacting species are included.' }
