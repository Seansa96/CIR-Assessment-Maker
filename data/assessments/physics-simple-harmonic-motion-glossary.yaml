glossary:
  introduction: Core quantities and defining relationships for ideal mass-spring SHM.
  sections:
  - id: shm-terms
    title: Core terms
    entries:
    - {id: restoring-force, term: restoring force, definition: 'A force directed toward equilibrium; in a spring $F=-kx$.', drills: [{id: restoring-force-drill, type: typed, prompt: 'What force relation defines an ideal spring restoring force?', answer: '-kx'}]}
    - {id: amplitude, term: amplitude, definition: 'Maximum displacement from equilibrium.', drills: [{id: amplitude-drill, type: cloze, prompt: 'Maximum displacement is called {{amplitude}}.', answer: amplitude}]}
    - {id: angular-frequency, term: angular frequency, definition: 'Oscillation rate $\omega=\sqrt{k/m}$ for a mass-spring oscillator.', drills: [{id: angular-frequency-drill, type: typed, prompt: 'What is $\omega$ for a mass m on spring k?', answer: 'sqrt(k/m)'}]}
    - {id: phase-constant, term: phase constant, definition: 'The initial phase $\phi$ in $x=A\cos(\omega t+\phi)$.', drills: [{id: phase-constant-drill, type: cloze, prompt: 'The initial offset angle is the {{phase constant}}.', answer: phase constant}]}
