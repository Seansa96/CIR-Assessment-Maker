questions:
- id: q-work-integral
  title: Integrating a Polynomial Force
  type: symbolicResponse
  prompt: |
    A force acting on a particle is given by $F(x) = 3x^2 - 12$ (in Newtons). 
    Compute the total net work (in Joules) done by this force as the particle moves from $x = 0$ to $x = 3\text{ m}$.
  answer:
    gradingMode: auto
    expectedLatex: -9
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Integrate the force function from $x=0$ to $x=3$: 
    $W = \int_0^3 (3x^2 - 12) dx = [x^3 - 12x]_0^3$.
    Evaluating at the bounds: $(3^3 - 12(3)) - 0 = 27 - 36 = -9\text{ J}$.
  skills:
  - physics-work-energy
- id: q-work-integral-trig
  title: Integrating a Trigonometric Force
  type: symbolicResponse
  prompt: |
    A particle experiences a variable force along the x-axis given by $F(x) = 10 \sin(x)$ (where $x$ is in meters and $F$ is in Newtons). How much work is done (in Joules) by this force as the particle moves from $x = 0$ to $x = \pi$ meters?
  answer:
    gradingMode: auto
    expectedLatex: 20
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Work is the integral of force with respect to position:
    $W = \int_{0}^{\pi} 10 \sin(x) dx$.
    The antiderivative of $\sin(x)$ is $-\cos(x)$.
    $W = [-10 \cos(x)]_{0}^{\pi} = (-10 \cos(\pi)) - (-10 \cos(0)) = (-10)(-1) - (-10)(1) = 10 + 10 = 20\text{ J}$.
  skills:
  - physics-work-energy
- id: q-work-graphical
  title: Work from a Force-Position Graph
  type: multipleChoice
  prompt: |
    A particle is subject to a force $F_x$ that varies with position $x$. The graph of $F_x$ vs $x$ is a straight line starting at $F_x = 0$ N at $x = 0$ m, and linearly increasing to $F_x = 20$ N at $x = 5$ m.
    What is the work done on the particle as it moves from $x = 0$ to $x = 5$ m?
  choices:
  - id: a
    text: 100 J
  - id: b
    text: 50 J
  - id: c
    text: 20 J
  - id: d
    text: 25 J
  answer:
    choiceId: b
  explanation: |
    The work done by a variable force in 1D is the area under the force vs. position graph.
    The graph forms a triangle with base $b = 5\text{ m}$ and height $h = 20\text{ N}$.
    The area is $W = \frac{1}{2} b h = \frac{1}{2}(5)(20) = 50\text{ J}$.
  skills:
  - physics-work-energy
