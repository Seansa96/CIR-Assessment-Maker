questions:
- id: q-work-integral
  title: Integrating a Polynomial Force
  type: symbolicResponse
  prompt: "A force acting on a particle is given by $F(x) = 3x^2 - 12$ (in Newtons). \nCompute the total net work (in Joules) done by this force as the particle moves from $x = 0$ to $x = 3\\text{ m}$.\n"
  answer:
    gradingMode: auto
    expectedLatex: -9
    equivalenceMode: expression
    tolerance: 0.1
  explanation: "Integrate the force function from $x=0$ to $x=3$: \n$W = \\int_0^3 (3x^2 - 12) dx = [x^3 - 12x]_0^3$.\nEvaluating at the bounds: $(3^3 - 12(3)) - 0 = 27 - 36 = -9\\text{ J}$.\n"
