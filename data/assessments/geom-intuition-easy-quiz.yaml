- id: geom-int-easy-3
  title: Evaluate Integral via Geometry
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Evaluate the integral $\int_{-8}^{8} \sqrt{64 - x^2} \, dx$ by interpreting it
    in terms of areas.'
  answer:
    gradingMode: auto
    expected: (64/2)*\pi
    acceptedForms:
    - 64\pi/2
    - 0.5*64*\pi
  explanation: The graph is the upper semicircle of radius $r=8$. The area is $\frac{1}{2}\pi
    r^2 = \frac{64\pi}{2}$.
