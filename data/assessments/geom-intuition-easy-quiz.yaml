questions:
- id: geom-int-easy-1
  title: Evaluate Integral via Geometry
  type: numericResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Evaluate the integral $\int_0^{3} (3x) \, dx$ using geometric formulas.'
  answer:
    gradingMode: auto
    expected: 13.5
    tolerance: 0
  explanation: The region is a right triangle with base $b=3$ and height $h=9$. Area
    is $\frac{1}{2}bh = 13.5$.
