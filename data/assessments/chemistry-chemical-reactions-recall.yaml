schemaVersion: 1
id: chemistry-chemical-reactions-recall
title: Chemical Reactions Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
- chemistry-reactions
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What type of reaction involves the formation of an insoluble solid from
    two aqueous solutions?
  answer:
    expected: precipitation
    aliases:
    - precipitation reaction
- id: r002
  type: typed
  prompt: 'What is the name for the insoluble solid formed in a precipitation reaction?

    '
  answer:
    expected: precipitate
- id: r003
  type: typed
  prompt: 'According to solubility rules, are most nitrate (NO3-) salts soluble or
    insoluble?

    '
  answer:
    expected: soluble
- id: r004
  type: typed
  prompt: 'An acid-base neutralization reaction between an Arrhenius acid and base
    typically produces a salt and what other compound?

    '
  answer:
    expected: water
    aliases:
    - H2O
- id: r005
  type: typed
  prompt: 'What type of reaction involves the transfer of electrons from one substance
    to another?

    '
  answer:
    expected: redox
    aliases:
    - oxidation-reduction
    - redox reaction
    - oxidation reduction
- id: r006
  type: flashcard
  prompt: What does the mnemonic "OIL RIG" stand for in redox chemistry?
  answer:
    expected: Oxidation Is Loss (of electrons), Reduction Is Gain (of electrons).
- id: r007
  type: typed
  prompt: 'In a redox reaction, the substance that gains electrons is said to be what?

    '
  answer:
    expected: reduced
- id: r008
  type: typed
  prompt: 'In a redox reaction, the substance that loses electrons is said to be what?

    '
  answer:
    expected: oxidized
- id: r009
  type: typed
  prompt: 'What is the name for ions that appear in exactly the same form on both
    sides of a complete ionic equation?

    '
  answer:
    expected: spectator ions
    aliases:
    - spectator
- id: r010
  type: typed
  prompt: 'What type of equation shows only the species that actually participate
    in the chemical change, with spectator ions removed?

    '
  answer:
    expected: net ionic equation
    aliases:
    - net ionic
- id: r011
  type: typed
  prompt: 'If a substance causes another substance to be reduced (and is itself oxidized
    in the process), it is called the what agent?

    '
  answer:
    expected: reducing agent
    aliases:
    - reducing
- id: r012
  type: typed
  prompt: 'The oxidation state of any element in its pure, standard state (like O2
    or solid Na) is what?

    '
  answer:
    expected: '0'
    aliases:
    - zero
