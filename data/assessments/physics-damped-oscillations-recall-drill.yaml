items:
- {id: damp-r1, type: cloze, prompt: 'Linear viscous damping is modeled by $F_{damp}={{-bv}}$.', answer: '-bv', explanation: 'Solution: Write $F_{damp}=-bv$. Why it works: the negative sign makes the force oppose velocity.'}
- {id: damp-r2, type: typed, prompt: 'What damping regime still oscillates while its amplitude decreases?', answer: underdamped, explanation: 'Solution: Identify underdamped motion. Why it works: damping is present but insufficient to prevent repeated equilibrium crossings.'}
- {id: damp-r3, type: cloze, prompt: 'Critical damping occurs when $b={{2\sqrt{mk}}}$.', answer: '2\sqrt{mk}', explanation: 'Solution: Use $b_c=2\sqrt{mk}$. Why it works: this makes the characteristic-equation discriminant zero.'}
- {id: damp-r4, type: typed, prompt: 'What is the SI unit of $b$ in $F=-bv$?', answer: 'kg/s', explanation: 'Solution: $b$ has units $\text{kg/s}$. Why it works: multiplying by velocity gives $\text{kg}\cdot\text{m}/\text{s}^2$, a newton.'}
- {id: damp-r5, type: cloze, prompt: 'The amplitude in an underdamped oscillator decreases {{exponentially}}.', answer: exponentially, explanation: 'Solution: Identify exponential decay. Why it works: the amplitude contains an exponential factor in time.'}
- {id: damp-r6, type: typed, prompt: 'Which regime returns to equilibrium without oscillating and as rapidly as possible?', answer: critical damping, explanation: 'Solution: Identify critical damping. Why it works: it is the boundary between underdamped and overdamped response.'}
