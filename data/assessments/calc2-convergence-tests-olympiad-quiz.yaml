  prompt: |
    For which p does
    $\sum_{n=3}^{\infty}1/[n\ln n(\ln\ln n)^p]$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>0$
  - id: d
    text: Every real p
  answer:
    choiceId: a
  explanation: |-
    Solution: Successive substitutions u equals ln x and v equals ln u reduce the integral to $\int v^{-p}\,dv$. Therefore the answer is $p>1$.

    Why it works: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$. The integral and series then have the same convergence behavior.

    Common trap: An antiderivative by itself is not enough; positivity and eventual decrease are required hypotheses.

    Why the other choices fail: $p\ge1$ conflicts with this criterion: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$; $p>0$ conflicts with this criterion: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$; Every real p conflicts with this criterion: The Integral Test compares the positive tail $a_n=f(n)$ with the improper integral of a continuous, positive, eventually decreasing function $f$.
