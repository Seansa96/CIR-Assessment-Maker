  prompt: |
    Classify $\sum_{n=2}^{\infty}\exp[-\sqrt{\ln n}]$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: Convergent
  - id: c
    text: Conditionally convergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    Solution: Condensation produces $2^k\exp[-\sqrt{k\ln2}]$, whose terms grow rather than approach zero. Therefore the answer is Divergent.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Conditionally convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Geometric conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
