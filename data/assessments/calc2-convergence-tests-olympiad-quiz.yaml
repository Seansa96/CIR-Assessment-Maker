  prompt: |
    Suppose $\sum a_n$ converges and $(b_n)$ is monotone and bounded. Which
    theorem guarantees convergence of $\sum a_nb_n$?
  choices:
  - id: a
    text: Abel's test
  - id: b
    text: The term test
  - id: c
    text: The p-series test
  - id: d
    text: Cauchy condensation
  answer:
    choiceId: a
  explanation: |-
    Solution: A bounded monotone sequence has a finite limit, and Abel's test controls the product series using partial summation. Therefore the answer is Abel's test.

    Why it works: Match the positive tail to $\sum 1/n^p$. Its threshold is strict: it converges only when $p>1$ and diverges for $p\le1$.

    Common trap: The harmonic boundary $p=1$ diverges, so replacing $p>1$ with $p\ge1$ changes the conclusion.

