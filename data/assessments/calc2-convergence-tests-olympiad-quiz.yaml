questions:
- id: q001
  type: multipleChoice
  skills:
  - classify-iterated-log-series
  prompt: |
    For which p does
    $\sum_{n=3}^{\infty}1/[n\ln n(\ln\ln n)^p]$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>0$
  - id: d
    text: Every real p
  answer:
    choiceId: a
  explanation: |-
    Successive substitutions u equals ln x and v equals ln u reduce the integral to $\int v^{-p}\,dv$.
- id: q002
  type: multipleChoice
  skills:
  - apply-condensation-to-slow-decay
  prompt: |
    Classify $\sum_{n=2}^{\infty}\exp[-\sqrt{\ln n}]$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: Convergent
  - id: c
    text: Conditionally convergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    Condensation produces $2^k\exp[-\sqrt{k\ln2}]$, whose terms grow rather than approach zero.
- id: q003
  type: multipleChoice
  skills:
  - apply-integral-tests-to-stretched-exponentials
  prompt: |
    How does $\sum_{n=1}^{\infty}e^{-\sqrt n}$ behave?
  choices:
  - id: a
    text: It converges.
  - id: b
    text: It diverges because the decay is not geometric in n.
  - id: c
    text: It is conditional.
  - id: d
    text: Its terms approach one.
  answer:
    choiceId: a
  explanation: |-
    With u equal to square root x, $\int_1^\infty e^{-\sqrt x}dx=\int_1^\infty2ue^{-u}du$, which is finite.
- id: q004
  type: multipleChoice
  skills:
  - simplify-variable-exponent-series
  prompt: |
    Classify $\sum_{n=2}^{\infty}n^{-1-1/\ln n}$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: Convergent
  - id: c
    text: Conditional
  - id: d
    text: The term test is inconclusive and no comparison exists.
  answer:
    choiceId: a
  explanation: |-
    $n^{-1/\ln n}=e^{-1}$ exactly, so the series is a constant multiple of the harmonic series.
- id: q005
  type: multipleChoice
  skills:
  - analyze-variable-p-series
  prompt: |
    Classify $\sum_{n=3}^{\infty}n^{-1-1/\sqrt{\ln n}}$.
  choices:
  - id: a
    text: Convergent
  - id: b
    text: Divergent
  - id: c
    text: Conditionally convergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    The term is $e^{-\sqrt{\ln n}}/n$; setting t equal to square root ln x makes the integral $\int2te^{-t}dt$, which is finite.
- id: q006
  type: multipleChoice
  skills:
  - apply-root-tests-to-n-dependent-bases
  prompt: |
    How does $\sum_{n=1}^{\infty}(1+1/n)^{-n^2}$ converge?
  choices:
  - id: a
    text: Absolutely, because the root limit is $e^{-1}$.
  - id: b
    text: It diverges because the base approaches one.
  - id: c
    text: Conditionally
  - id: d
    text: The root limit is one.
  answer:
    choiceId: a
  explanation: |-
    The nth root is $(1+1/n)^{-n}\to e^{-1}<1$.
- id: q007
  type: multipleChoice
  skills:
  - apply-term-tests-to-n-dependent-powers
  prompt: |
    What happens to $\sum_{n=2}^{\infty}(1-1/n)^n$?
  choices:
  - id: a
    text: It diverges because the terms approach $e^{-1}$.
  - id: b
    text: It converges geometrically.
  - id: c
    text: It converges to $e^{-1}$.
  - id: d
    text: It is conditional.
  answer:
    choiceId: a
  explanation: The familiar binomial-exponential limit is nonzero, so the necessary term condition fails.
- id: q008
  type: multipleChoice
  skills:
  - analyze-canceling-radical-terms
  prompt: |
    Classify $\sum_{n=1}^{\infty}(\sqrt{n^2+1}-n)$.
  choices:
  - id: a
    text: Divergent by limit comparison with $1/n$
  - id: b
    text: Convergent by comparison with $1/n^2$
  - id: c
    text: Conditional
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: |-
    Rationalization gives $1/[\sqrt{n^2+1}+n]\sim1/(2n)$.
- id: q009
  type: multipleChoice
  skills:
  - analyze-leading-term-cancellation
  prompt: |
    Classify $\sum_{n=1}^{\infty}[n\ln(1+1/n)-1]$.
  choices:
  - id: a
    text: |-
      It diverges to $-\infty$ with harmonic-order terms.
  - id: b
    text: It converges absolutely.
  - id: c
    text: It converges conditionally.
  - id: d
    text: Its terms do not approach zero.
  answer:
    choiceId: a
  explanation: |-
    Expansion gives $n\ln(1+1/n)-1=-1/(2n)+O(1/n^2)$.
- id: q010
  type: multipleChoice
  skills:
  - detect-second-order-convergence
  prompt: |
    How does
    $\sum_{n=1}^{\infty}[\ln(1+1/n)-1/(n+1)]$ behave?
  choices:
  - id: a
    text: It converges.
  - id: b
    text: It diverges harmonically.
  - id: c
    text: It is conditional.
  - id: d
    text: Its terms approach a nonzero limit.
  answer:
    choiceId: a
  explanation: Both quantities have leading term $1/n$, and their difference is $1/(2n^2)+O(1/n^3)$.
- id: q011
  type: multipleChoice
  skills:
  - apply-abels-test
  prompt: |
    Suppose $\sum a_n$ converges and $(b_n)$ is monotone and bounded. Which
    theorem guarantees convergence of $\sum a_nb_n$?
  choices:
  - id: a
    text: Abel's test
  - id: b
    text: The term test
  - id: c
    text: The p-series test
  - id: d
    text: Cauchy condensation
  answer:
    choiceId: a
  explanation: A bounded monotone sequence has a finite limit, and Abel's test controls the product series
    using partial summation.
- id: q012
  type: multipleChoice
  skills:
  - apply-dirichlets-test-to-periodic-weights
  prompt: |
    Let $c_n$ repeat $2,-1,-1$. Why does $\sum c_n/\sqrt n$ converge?
  choices:
  - id: a
    text: |-
      The partial sums of $c_n$ are bounded and $1/\sqrt n\downarrow0$.
  - id: b
    text: It converges absolutely by the p-series test.
  - id: c
    text: |-
      $c_n\to0$.
  - id: d
    text: It is geometric.
  answer:
    choiceId: a
  explanation: Each coefficient period sums to zero, supplying the bounded-partial-sum condition in Dirichlet's
    test.
- id: q013
  type: multipleChoice
  skills:
  - interpret-raabe-test-boundaries
  prompt: |
    For $a_n=1/[n(\ln n)^2]$, the Raabe expression
    $n(a_n/a_{n+1}-1)$ tends to $1$. What does Raabe's test alone conclude?
  choices:
  - id: a
    text: Nothing; the boundary value is inconclusive.
  - id: b
    text: Convergence
  - id: c
    text: Divergence
  - id: d
    text: Conditional convergence
  answer:
    choiceId: a
  explanation: Raabe decides convergence above one and divergence below one; this convergent logarithmic
    series lies exactly at its inconclusive boundary.
- id: q014
  type: multipleChoice
  skills:
  - compare-superpolynomial-decay
  prompt: |
    Classify $\sum_{n=2}^{\infty}e^{-(\ln n)^2}$.
  choices:
  - id: a
    text: Convergent
  - id: b
    text: Divergent
  - id: c
    text: Conditional
  - id: d
    text: Geometric with constant ratio
  answer:
    choiceId: a
  explanation: |-
    The term equals $n^{-\ln n}$ and is eventually smaller than $1/n^2$.
- id: q015
  type: multipleChoice
  skills:
  - use-equivalent-term-comparisons
  prompt: |
    For real p, when does $\sum_{n=1}^{\infty}\sin(1/n^p)$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: $p>0$
  - id: c
    text: |-
      $p\ge1$
  - id: d
    text: Every real p
  answer:
    choiceId: a
  explanation: |-
    For positive p, $\sin(1/n^p)\sim1/n^p$; at nonpositive p the terms do not approach zero in general, and the p-series threshold is greater than one.
