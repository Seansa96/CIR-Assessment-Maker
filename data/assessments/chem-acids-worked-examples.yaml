workedExamples:
- id: ex-1
  title: Identify a Bronsted acid and conjugate base
  problem: For HCl + H2O -> H3O+ + Cl-, identify the proton donor, acceptor, and conjugate partners.
  steps:
  - id: st-1
    title: Set up the governing relation
    instruction: Identify the model and write the equation before substituting.
    type: freeResponse
    prompt: What equation or relation should be written first?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Use the topic-specific governing equation and preserve units or species.
    explanation: 'Solution: Write the governing relation. Why it works: It connects the given quantities to the requested
      result.'
  - id: st-2
    title: Evaluate the relation
    instruction: Carry out the algebra or stoichiometric mapping.
    type: freeResponse
    prompt: What intermediate calculation produces the target?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - sqrt(Ka C)=1.0e-3 M
    explanation: 'Solution: sqrt(Ka C)=1.0e-3 M. Why it works: The intermediate step follows directly from the balanced relation.'
  - id: st-3
    title: Verify
    instruction: Check units, charge, sign, or limiting behavior.
    type: freeResponse
    prompt: What independent check supports the result?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 1 percent ionization
    explanation: 'Solution: 1 percent ionization. Why it works: A verification check catches model or arithmetic errors.'
- id: ex-2
  title: Compare concentration and strength
  problem: Explain why a dilute strong acid and concentrated weak acid cannot be ranked by concentration alone.
  steps:
  - id: st-1
    title: Identify the changed condition
    instruction: State what differs from the first problem.
    type: freeResponse
    prompt: Which condition changes the method branch?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The species, coefficient, equilibrium constant, pH input, or endpoint condition changes.
    explanation: 'Solution: Name the changed condition. Why it works: Transfer requires identifying which given controls the
      method.'
  - id: st-2
    title: Apply the method
    instruction: Reuse only the valid steps from the first example.
    type: freeResponse
    prompt: What method should be applied after the condition check?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Apply the governing acid-base equation with the new condition.
    explanation: 'Solution: Apply the governing equation. Why it works: The model remains stable while the data branch changes.'
  - id: st-3
    title: Check the conclusion
    instruction: Test the result against charge, units, scale, or endpoint behavior.
    type: freeResponse
    prompt: What final sanity check is required?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Confirm units and that the acid-base direction or scale matches the prompt.
    explanation: 'Solution: Check units and direction. Why it works: The physical interpretation must agree with the computed
      result.'
