lesson:
  introduction: Learn to solve Operations and Relations problems by recognizing custom operations, operation properties, relations and justifying each theorem or transformation.
  sections:
  - id: aops-operations-relations-motivation
    title: What the topic helps you notice
    required: true
    content: Operations and Relations is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are custom operations, operation properties, relations.
    check:
      id: aops-operations-relations-motivation-check
      type: multipleChoice
      prompt: In Operations and Relations, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-operations-relations-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-operations-relations-definitions-check
      type: multipleChoice
      prompt: In Operations and Relations, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-operations-relations-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: follow definitions exactly, test commutativity and associativity, separate operation from ordinary multiplication. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-operations-relations-recognition-check
      type: multipleChoice
      prompt: In Operations and Relations, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-operations-relations-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-operations-relations-method-check
      type: multipleChoice
      prompt: In Operations and Relations, what should be checked before applying a method?
