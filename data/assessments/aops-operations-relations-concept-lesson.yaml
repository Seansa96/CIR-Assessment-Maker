  - id: aops-operations-relations-mini-example
    title: A small original example
    required: true
    content: Try a small case first, then generalize. Substitute the result back into the original condition instead of checking only an intermediate expression.
    check:
      id: aops-operations-relations-mini-example-check
      type: multipleChoice
      prompt: In Operations and Relations, what should be checked before applying a method?
