schemaVersion: 1
id: aops-special-factorizations-quiz
title: Special Factorizations Practice Quiz
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-special-factorizations
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-special-factorizations
  - identity-practice
  - symmetric-expressions
skills:
- Apply square and cube factorizations
- Evaluate symmetric and reciprocal expressions
- Factor by grouping and preserve cancellation restrictions
questions:
- id: q001
  type: multipleChoice
  prompt: Factor $x^2-81$.
  choices:
  - {id: a, text: '$(x-9)(x+9)$'}
  - {id: b, text: '$(x-81)(x+1)$'}
  - {id: c, text: '$(x-9)^2$'}
  - {id: d, text: '$(x+9)^2$'}
  answer: {choiceId: a}
  explanation: This is the difference of squares $x^2-9^2$.
  skills: [factor-differences-of-squares]
- id: q002
  type: multipleChoice
  prompt: Factor $8a^3-27$.
  choices:
  - {id: a, text: '$(2a-3)(4a^2+6a+9)$'}
  - {id: b, text: '$(2a-3)(4a^2-6a+9)$'}
  - {id: c, text: '$(2a+3)(4a^2-6a+9)$'}
  - {id: d, text: '$(8a-27)(a^2+1)$'}
  answer: {choiceId: a}
  explanation: Apply $u^3-v^3=(u-v)(u^2+uv+v^2)$ with $u=2a,v=3$.
  skills: [factor-differences-of-cubes]
- id: q003
  type: multipleChoice
  prompt: Factor $x^3+125$.
  choices:
  - {id: a, text: '$(x+5)(x^2-5x+25)$'}
  - {id: b, text: '$(x+5)(x^2+5x+25)$'}
  - {id: c, text: '$(x-5)(x^2+5x+25)$'}
  - {id: d, text: '$(x+5)^3$'}
  answer: {choiceId: a}
  explanation: A sum of cubes uses the opposite sign in the quadratic factor's middle term.
  skills: [factor-sums-of-cubes]
- id: q004
  type: multipleChoice
  prompt: Evaluate $51^2-49^2$ using structure.
  choices:
  - {id: a, text: '$100$'}
  - {id: b, text: '$200$'}
  - {id: c, text: '$400$'}
  - {id: d, text: '$5200$'}
  answer: {choiceId: b}
  explanation: $(51-49)(51+49)=2\cdot100=200$.
  skills: [evaluate-with-identities]
- id: q005
  type: multipleChoice
  prompt: Which expression equals $x^2-12x+36$?
  choices:
  - {id: a, text: '$(x-6)^2$'}
  - {id: b, text: '$(x+6)^2$'}
  - {id: c, text: '$(x-18)(x+2)$'}
  - {id: d, text: '$(x-12)^2$'}
  answer: {choiceId: a}
  explanation: The middle term is $-2(6)x$ and the constant is $6^2$.
  skills: [recognize-perfect-squares]
- id: q006
  type: multipleChoice
  prompt: If $a+b=10$ and $ab=21$, find $a^2+b^2$.
  choices:
  - {id: a, text: '$42$'}
  - {id: b, text: '$58$'}
  - {id: c, text: '$79$'}
  - {id: d, text: '$100$'}
  answer: {choiceId: b}
  explanation: $a^2+b^2=(a+b)^2-2ab=100-42=58$.
  skills: [use-sum-product-invariants]
- id: q007
  type: multipleChoice
  prompt: A nonzero $x$ satisfies $x+1/x=5$. Find $x^2+1/x^2$.
  choices:
  - {id: a, text: '$21$'}
  - {id: b, text: '$23$'}
  - {id: c, text: '$25$'}
  - {id: d, text: '$27$'}
  answer: {choiceId: b}
  explanation: Squaring gives the target plus $2$ equal to $25$.
  skills: [build-reciprocal-powers]
- id: q008
  type: multipleChoice
  prompt: Factor $a^4-16$ completely over the real numbers.
  choices:
  - {id: a, text: '$(a-2)(a+2)(a^2+4)$'}
  - {id: b, text: '$(a^2-4)^2$'}
  - {id: c, text: '$(a-4)(a+4)$'}
  - {id: d, text: '$(a^2-2)(a^2+8)$'}
  answer: {choiceId: a}
  explanation: $a^4-16=(a^2-4)(a^2+4)=(a-2)(a+2)(a^2+4)$.
  skills: [factor-repeated-differences-of-squares]
- id: q009
  type: multipleChoice
  prompt: Factor $ax+ay+bx+by$.
  choices:
  - {id: a, text: '$(a+b)(x+y)$'}
  - {id: b, text: '$(a+x)(b+y)$'}
  - {id: c, text: '$(ab)(x+y)$'}
  - {id: d, text: '$(a+y)(b+x)$'}
  answer: {choiceId: a}
  explanation: Group as $a(x+y)+b(x+y)$ and factor the shared binomial.
  skills: [factor-by-grouping]
- id: q010
  type: multipleChoice
  prompt: Evaluate $99^2$ using a nearby square.
  choices:
  - {id: a, text: '$9701$'}
  - {id: b, text: '$9801$'}
  - {id: c, text: '$9901$'}
  - {id: d, text: '$10001$'}
  answer: {choiceId: b}
  explanation: $(100-1)^2=10000-200+1=9801$.
  skills: [evaluate-near-squares]
- id: q011
  type: multipleChoice
  prompt: For $x\ne1$, simplify $(x^2-1)/(x-1)$.
  choices:
  - {id: a, text: '$x-1$'}
  - {id: b, text: '$x+1$'}
  - {id: c, text: '$x^2+1$'}
  - {id: d, text: '$1$'}
  answer: {choiceId: b}
  explanation: Factor the numerator as $(x-1)(x+1)$, then cancel using the stated restriction.
  skills: [cancel-with-domain-restrictions]
- id: q012
  type: multipleChoice
  prompt: Why is $(a+b)(a-b)$ not a factorization of $a^2+b^2$?
  choices:
  - {id: a, text: 'It expands to $a^2-b^2$, not $a^2+b^2$.'}
  - {id: b, text: 'Binomials cannot be multiplied.'}
  - {id: c, text: 'The factors have different degrees.'}
  - {id: d, text: 'It works only when $a=b$.'}
  answer: {choiceId: a}
  explanation: Conjugate binomials cancel their mixed terms and subtract the second square.
  skills: [verify-identities-by-expansion]
- id: q013
  type: selectAll
  prompt: Which identities hold for all real $a,b$?
  choices:
  - {id: a, text: '$a^2-b^2=(a-b)(a+b)$'}
  - {id: b, text: '$a^3+b^3=(a+b)(a^2-ab+b^2)$'}
  - {id: c, text: '$a^2+b^2=(a+b)(a-b)$'}
  - {id: d, text: '$a^3-b^3=(a-b)(a^2+ab+b^2)$'}
  answer:
    choiceIds: [a, b, d]
  explanation: Choice c expands to a difference, not a sum, of squares.
  skills: [recognize-polynomial-identities]
- id: q014
  type: selectAll
  prompt: Which simplifications require a nonzero condition or a separate zero case?
  choices:
  - {id: a, text: 'Cancelling $x-2$ from a numerator and denominator.'}
  - {id: b, text: 'Dividing both sides of an equation by $x$.'}
  - {id: c, text: 'Expanding $(x+3)^2$.'}
  - {id: d, text: 'Multiplying $x+1/x=4$ by $x$.'}
  answer:
    choiceIds: [a, b, d]
  explanation: Each selected operation divides by, or begins with division by, a variable expression; its nonzero condition matters.
  skills: [preserve-domain-restrictions]
- id: q015
  type: freeResponse
  prompt: Verify the identity $a^3+b^3=(a+b)(a^2-ab+b^2)$ by expansion and explain why the mixed terms disappear.
  answer:
    gradingMode: selfCheck
    expected: |-
      Expanding gives
      $$(a+b)(a^2-ab+b^2)=a^3-a^2b+ab^2+a^2b-ab^2+b^3=a^3+b^3.$$
      The terms $-a^2b$ and $+a^2b$ cancel, as do $+ab^2$ and $-ab^2$.
    keyPoints:
    - Distributes both terms of $a+b$.
    - Shows both pairs of mixed terms.
    - Concludes that only $a^3+b^3$ remains.
  explanation: Expansion proves the factorization for every value of $a,b$.
  skills: [verify-identities-by-expansion]
