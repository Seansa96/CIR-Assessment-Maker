questions:
- id: q-319335
  type: numericResponse
  title: Area Under Curve (1)
  prompt: Find the area under the parametric curve $x = t$, $y = 4t^2$ from $t=0$
    to $t=1$.
  answer:
    value: 1.3333333333333333
    tolerance: 0.01
  explanation: Area $= \int y dx = \int_{0}^{1} 4t^2 (1) dt = 4/3$.
  skills:
  - parametric-integrals
