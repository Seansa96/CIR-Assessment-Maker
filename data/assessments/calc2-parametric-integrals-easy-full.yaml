- id: q-760fc4
  type: symbolicResponse
  title: Arc Length Setup (4)
  prompt: Set up the integrand (inside the integral over $t$) for the arc length of
    the curve $x = 5t^2$, $y = 5t^3$.
  answer:
    expectedLatex: \sqrt{(10t)^2 + (15t^2)^2}
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.0001
  explanation: $\frac{dx}{dt} = 10t$ and $\frac{dy}{dt} = 15t^2$. Integrand is $\sqrt{(dx/dt)^2
    + (dy/dt)^2}$.
  skills:
  - parametric-integrals
