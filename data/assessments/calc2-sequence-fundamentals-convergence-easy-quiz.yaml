  prompt: |
    Decide whether the sequence converges or diverges.

    $$
    a_n=\frac{1}{n}
    $$
  choices:
  - id: a
    text: Converges to 0
  - id: b
    text: Converges to 1
  - id: c
    text: Diverges to infinity
  - id: d
    text: Diverges by oscillation
  answer:
    choiceId: a
  explanation: |-
    Solution: As $n$ grows, the denominator grows without bound while the numerator stays fixed. Therefore $\frac1n\to 0$. Therefore the answer is Converges to 0.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

    Why the other choices fail: Converges to 1 conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; Diverges to infinity conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; Diverges by oscillation conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
