  prompt: |
    Decide whether the sequence converges or diverges.

    $$
    a_n=\frac{(-1)^n}{n}
    $$
  choices:
  - id: a
    text: Converges to 0
  - id: b
    text: Diverges by oscillation
  - id: c
    text: Converges to 1
  - id: d
    text: Diverges to infinity
  answer:
    choiceId: a
  explanation: |-
    Solution: The sign oscillates, but the magnitude is bounded by $\frac1n$, which goes to $0$. By squeezing, the sequence converges to $0$. Therefore the answer is Converges to 0.

    Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.

    Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.

    Why the other choices fail: Diverges by oscillation conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; Converges to 1 conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; Diverges to infinity conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.
