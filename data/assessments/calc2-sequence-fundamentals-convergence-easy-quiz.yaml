questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{1}{n}
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Converges to 1
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      As $n$ grows, the denominator grows without bound while the numerator stays fixed. Therefore $\frac1n\to 0$.
  - id: q002
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{2n+1}{n+3}
      $$
    choices:
      - id: a
        text: Converges to 2
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Divide by $n$. The lower-order terms vanish, leaving $\frac{2}{1}=2$.
  - id: q003
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{n}{n+1}
      $$
    choices:
      - id: a
        text: Converges to 1
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The numerator and denominator have the same leading degree, so the limit is the ratio of leading coefficients, $1$.
  - id: q004
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=(-1)^n
      $$
    choices:
      - id: a
        text: Diverges by oscillation
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      The terms alternate between $1$ and $-1$. Since those two subsequences approach different values, the sequence has no limit.
  - id: q005
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{(-1)^n}{n}
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Diverges by oscillation
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      The sign oscillates, but the magnitude is bounded by $\frac1n$, which goes to $0$. By squeezing, the sequence converges to $0$.
  - id: q006
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{\sqrt{n}}{n+1}
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Converges to 1
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The denominator grows like $n$, while the numerator grows like $n^{1/2}$. The denominator wins, so the ratio goes to $0$.
  - id: q007
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=3+\frac{2}{n}
      $$
    choices:
      - id: a
        text: Converges to 3
      - id: b
        text: Converges to 2
      - id: c
        text: Converges to 0
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      Since $\frac2n\to 0$, the constant part remains and $a_n\to 3$.
  - id: q008
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\ln(n)
      $$
    choices:
      - id: a
        text: Diverges to infinity
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The logarithm grows slowly, but it still grows without bound. Therefore $\ln(n)\to\infty$.
  - id: q009
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\left(\frac{5}{6}\right)^n
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Converges to 1
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      A geometric sequence $r^n$ with $|r|<1$ converges to $0$.
  - id: q010
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\left(\frac{6}{5}\right)^n
      $$
    choices:
      - id: a
        text: Diverges to infinity
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      A geometric sequence $r^n$ with $r>1$ grows without bound.
  - id: q011
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{\sin n}{n}
      $$
    choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Diverges by oscillation
      - id: c
        text: Diverges to infinity
      - id: d
        text: Converges to 1
    answer:
      choiceId: a
    explanation: |
      Since $-1\le \sin n\le 1$, we have $-\frac1n\le \frac{\sin n}{n}\le \frac1n$. Both bounds go to $0$, so the sequence converges to $0$ by the Squeeze Theorem.
  - id: q012
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\cos(n)
      $$
    choices:
      - id: a
        text: Diverges by oscillation
      - id: b
        text: Converges to 0
      - id: c
        text: Converges to 1
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      The values of $\cos(n)$ keep oscillating and do not settle toward a single number.
  - id: q013
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{n^2}{3n^2+1}
      $$
    choices:
      - id: a
        text: '$\text{Converges to }\frac13$'
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      The highest power in the numerator and denominator is $n^2$, so the limit is the ratio of leading coefficients, $\frac13$.
  - id: q014
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=\frac{n}{\sqrt{n^2+4}}
      $$
    choices:
      - id: a
        text: Converges to 1
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges to infinity
      - id: d
        text: Diverges by oscillation
    answer:
      choiceId: a
    explanation: |
      Factor $n^2$ inside the square root: $\sqrt{n^2+4}=n\sqrt{1+4/n^2}$. The ratio becomes $\frac{1}{\sqrt{1+4/n^2}}\to 1$.
  - id: q015
    type: multipleChoice
    prompt: |
      Decide whether the sequence converges or diverges.

      $$
      a_n=1+\frac{(-1)^n}{n}
      $$
    choices:
      - id: a
        text: Converges to 1
      - id: b
        text: Converges to 0
      - id: c
        text: Diverges by oscillation
      - id: d
        text: Diverges to infinity
    answer:
      choiceId: a
    explanation: |
      The oscillating correction $\frac{(-1)^n}{n}$ shrinks to $0$, so the sequence converges to $1$.
