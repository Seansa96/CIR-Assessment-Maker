workedExamples:
  - id: we001
    title: Building a Character Creation Prompt
    problem: |
      We are building the first step of our Game Score Tracker: a prompt that asks for the player's name and their starting level, and then outputs a formatted character sheet.
    steps:
      - id: s001
        title: Gathering String Input
        instruction: |
          First, we prompt for the player's name. We want the prompt and the typing cursor to be on the same line.
        type: multipleChoice
        prompt: |
          Which code achieves this?
        choices:
          - id: a
            text: |
              `Console.WriteLine("Enter name: ");`
              `string name = Console.ReadLine();`
          - id: b
            text: |
              `Console.Write("Enter name: ");`
              `string name = Console.ReadLine();`
          - id: c
            text: |
              `string name = Console.Write("Enter name: ");`
        answer:
          choiceId: b
        explanation: |
          `Console.Write` leaves the cursor on the same line, which looks better for input prompts. `Console.ReadLine()` is then used to capture what the user types.

      - id: s002
        title: Gathering Numeric Input
        instruction: |
          Next, we ask for their starting level.
        type: multipleChoice
        prompt: |
          Which code correctly asks for the level and stores it as an integer?
        choices:
          - id: a
            text: |
              `Console.Write("Enter starting level: ");`
              `int level = int.Parse(Console.ReadLine());`
          - id: b
            text: |
              `Console.Write("Enter starting level: ");`
              `int level = Console.ReadLine();`
          - id: c
            text: |
              `int level = int.Parse(Console.Write("Enter starting level: "));`
        answer:
          choiceId: a
        explanation: |
          `Console.ReadLine()` gets the string input, and `int.Parse()` converts it to an integer. 

      - id: s003
        title: String Interpolation
        instruction: |
          Finally, we print a confirmation message using string interpolation.
        type: multipleChoice
        prompt: |
          Which statement correctly uses C# string interpolation?
        choices:
          - id: a
            text: '`Console.WriteLine($"Welcome {name}, you are level {level}!");`'
          - id: b
            text: '`Console.WriteLine("Welcome {name}, you are level {level}!");`'
          - id: c
            text: '`Console.WriteLine(f"Welcome {name}, you are level {level}!");`'
        answer:
          choiceId: a
        explanation: |
          C# uses the `$` symbol for string interpolation. The `f` prefix is used in Python.

      - id: s004
        title: Variable Updates
        instruction: |
          Let's say the player immediately gains a level.
        type: numericResponse
        prompt: |
          Trace this code:
          ```csharp
          int level = 5;
          level = level + 1;
          Console.WriteLine(level);
          ```
          What number is printed?
        answer:
          value: 6
          tolerance: 0
        explanation: |
          The code takes the current value of `level` (5), adds 1 to it, and assigns the result (6) back into the `level` variable.


