schemaVersion: 1
id: linear-algebra-inner-product-recall
title: Inner Product Spaces Recall Drill
assessmentType: recallDrill
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-inner-product-spaces
modeDefault: practice
randomizeQuestions: true
skills:
  - inner-product-axioms
  - general-orthogonality
  - cauchy-schwarz
items:
  - id: r-four-axioms
    type: flashcard
    prompt: |
      What are the four axioms that define an inner product on a vector space?
    answer:
      expected: 'Symmetry, Additivity, Homogeneity, and Positivity.'

  - id: r-positivity-axiom
    type: flashcard
    prompt: |
      State the Positivity axiom for an inner product $\langle \vec{u}, \vec{v} \rangle$.
    answer:
      expected: '$\langle \vec{u}, \vec{u} \rangle \geq 0$ for all $\vec{u}$, and $\langle \vec{u}, \vec{u} \rangle = 0$ if and only if $\vec{u} = \vec{0}$.'

  - id: r-length-def
    type: flashcard
    prompt: |
      How is the length (or norm) $\|\vec{u}\|$ defined in any inner product space?
    answer:
      expected: '$\|\vec{u}\| = \sqrt{\langle \vec{u}, \vec{u} \rangle}$'

  - id: r-distance-def
    type: flashcard
    prompt: |
      How is the distance between two vectors $\vec{u}$ and $\vec{v}$ defined in an inner product space?
    answer:
      expected: '$\text{dist}(\vec{u}, \vec{v}) = \|\vec{u} - \vec{v}\| = \sqrt{\langle \vec{u} - \vec{v}, \vec{u} - \vec{v} \rangle}$'

  - id: r-orthogonality-def
    type: flashcard
    prompt: |
      When are two vectors $\vec{u}$ and $\vec{v}$ considered orthogonal in a general inner product space?
    answer:
      expected: 'When their inner product is zero: $\langle \vec{u}, \vec{v} \rangle = 0$.'

  - id: r-cauchy-schwarz
    type: flashcard
    prompt: |
      State the Cauchy-Schwarz Inequality.
    answer:
      expected: '$|\langle \vec{u}, \vec{v} \rangle| \leq \|\vec{u}\| \|\vec{v}\|$'
