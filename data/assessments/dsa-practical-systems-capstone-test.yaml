- id: q001
  type: multipleChoice
  prompt: A team needs a web endpoint that must remain responsive as a table grows. Which DSA decision should guide its next step?
  choices:
  - id: a
    text: Choose Complexity and Tradeoffs based on predicting cost from input growth.
  - id: b
    text: Choose a structure only because its syntax is short.
  - id: c
    text: Ignore memory and input limits.
  - id: d
    text: Hand-implement every library feature first.
  answer:
    choiceId: a
  explanation: The correct choice matches operations and constraints; the alternatives ignore the evidence needed for an engineering decision.
