workedExamples:
  - id: cycloid-one-arch-area-example
    title: Area Under One Arch of a Cycloid
    problem: |
      ![One arch of a cycloid with the enclosed area shaded](/assessments/calc2-parametric-polar/parametric-review-cycloid-one-arch-area.svg)

      Find the area under one arch of the cycloid parametric curve

      $$
      x=t-\sin t,\qquad y=1-\cos t,
      $$

      from $t=0$ to $t=2\pi$.

      Provide the setup integral and the final decimal answer rounded to three decimal places.
    steps:
      - id: cycloid-arch-area-step-1
        title: Choose the parametric area formula
        instruction: |
          Area under a parametric curve is still:

          $$
          A=\int y\,dx.
          $$

          Since $x$ is controlled by $t$, replace $dx$ with $\frac{dx}{dt}\,dt$.
        type: multipleChoice
        issueSignals:
        - id: parametric-arc-length-error
        - id: parametric-derivative-error
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: pythagorean-theorem-misapplied
        - id: trigonometric-identity-misapplied
        prompt: Which setup form should be used?
        choices:
          - id: a
            text: '$A=\int_0^{2\pi} y(t)\frac{dx}{dt}\,dt$'
          - id: b
            text: '$A=\int_0^{2\pi} x(t)\frac{dy}{dt}\,dt$'
          - id: c
            text: '$A=\int_0^{2\pi} x(t)y(t)\,dt$'
          - id: d
            text: '$A=\int_0^{2\pi}\frac{dy/dt}{dx/dt}\,dt$'
        answer:
          choiceId: a
        explanation: |
          Solution: For area under a parametric curve:

          $$
          A=\int y\,dx=\int_a^b y(t)x'(t)\,dt.
          $$

          Why it works: The factor $x'(t)dt$ is the horizontal differential $dx$. Common trap: The slope $dy/dx$ is not an area differential.
      - id: cycloid-arch-area-step-2
        title: Compute the horizontal rate
        instruction: |
          The area formula needs $x'(t)$, not the slope $\frac{dy}{dx}$.
        type: symbolicResponse
        issueSignals:
        - id: parametric-arc-length-error
        - id: parametric-derivative-error
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: pythagorean-theorem-misapplied
        - id: trigonometric-identity-misapplied
        prompt: 'For $x=t-\sin t$, what is $\frac{dx}{dt}$?'
        answer:
          expectedLatex: '1-\cos t'
          equivalenceMode: expression
          variables:
            - t
          tolerance: 0.000001
        explanation: |
          Solution: Differentiate $x=t-\sin t$:

          $$
          \frac{dx}{dt}=1-\cos t.
          $$

          Why it works: The derivative of negative sine is negative cosine. Common trap: Using the slope rather than the horizontal rate.
      - id: cycloid-arch-area-step-3
        title: Build the setup integral
        instruction: |
          Here:

          $$
          y(t)=1-\cos t
          $$

          and:

          $$
          x'(t)=1-\cos t.
          $$
        type: multipleChoice
        issueSignals:
        - id: parametric-arc-length-error
        - id: parametric-derivative-error
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: pythagorean-theorem-misapplied
        - id: trigonometric-identity-misapplied
        prompt: Which integral gives the area under one arch?
        choices:
          - id: a
            text: '$\int_0^{2\pi}(1-\cos t)^2\,dt$'
          - id: b
            text: '$\int_0^{2\pi}(t-\sin t)(1-\cos t)\,dt$'
          - id: c
            text: '$\int_0^{2\pi}(1-\cos t)\sin t\,dt$'
          - id: d
            text: '$\int_0^{2\pi}(t-\sin t)^2\,dt$'
        answer:
          choiceId: a
        explanation: |
          Solution: Substitute into $A=\int y(t)x'(t)\,dt$:

          $$
          A=\int_0^{2\pi}(1-\cos t)(1-\cos t)\,dt
          =
          \int_0^{2\pi}(1-\cos t)^2\,dt.
          $$

          Why it works: Both the height and horizontal rate equal $1-\cos t$. Common trap: Using x(t) in place of x-prime(t).
      - id: cycloid-arch-area-step-4
        title: Evaluate the integral
        instruction: |
          Expand the square:

          $$
          (1-\cos t)^2=1-2\cos t+\cos^2 t.
          $$

          Over a full period, the cosine term integrates to $0$, and

          $$
          \int_0^{2\pi}\cos^2t\,dt=\pi.
          $$
        type: multipleChoice
        issueSignals:
        - id: parametric-arc-length-error
        - id: parametric-derivative-error
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: pythagorean-theorem-misapplied
        - id: trigonometric-identity-misapplied
        prompt: What exact area does the integral produce?
        choices:
          - id: a
            text: '$3\pi$'
          - id: b
            text: '$2\pi$'
          - id: c
            text: '$\pi$'
          - id: d
            text: '$4\pi$'
        answer:
          choiceId: a
        explanation: |
          Solution: Evaluate:

          $$
          \int_0^{2\pi}(1-\cos t)^2\,dt
          =
          \int_0^{2\pi}1\,dt
          -2\int_0^{2\pi}\cos t\,dt
          +\int_0^{2\pi}\cos^2t\,dt.
          $$

          This is:

          $$
          2\pi+0+\pi=3\pi.
          $$

          Why it works: The full-period cosine integral vanishes and the cosine-squared integral is pi. Common trap: Dropping the cosine-squared term.
      - id: cycloid-arch-area-step-5
        title: Round the decimal answer
        instruction: |
          The prompt asks for the final decimal answer rounded to three decimal places.
        type: numericResponse
        issueSignals:
        - id: parametric-arc-length-error
        - id: parametric-derivative-error
        - id: algebraic-simplification-error
        - id: chain-rule-missed
        - id: pythagorean-theorem-misapplied
        - id: trigonometric-identity-misapplied
        prompt: 'What is $3\pi$ rounded to three decimal places?'
        answer:
          value: 9.425
          tolerance: 0.001
        explanation: |
          Solution: Since $3\pi\approx 9.42477796$, the rounded value is:

          $$
          \boxed{9.425}.
          $$

          Full answer:

          $$
          \boxed{A=\int_0^{2\pi}(1-\cos t)^2\,dt=3\pi\approx9.425.}
          $$

          Why it works: The exact result is rounded only at the final step. Common trap: Rounding intermediate values before evaluating the full model.
