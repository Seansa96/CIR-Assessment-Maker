glossary:
  introduction: Terms for oscillators that lose energy through velocity-dependent damping.
  sections:
  - id: damping-terms
    title: Core terms
    entries:
    - id: damping-constant
      term: damping constant
      definition: The coefficient $b$ in $F_{damp}=-bv$, with SI units $\text{kg/s}$.
      drills: [{id: damping-constant-drill, type: typed, prompt: 'What symbol names the linear damping constant?', answer: b}]
    - id: underdamped
      term: underdamped
      definition: A regime in which the system continues to oscillate while its amplitude decays.
      drills: [{id: underdamped-drill, type: cloze, prompt: 'An oscillator with decaying amplitude that still crosses equilibrium is {{underdamped}}.', answer: underdamped}]
    - id: critical-damping
      term: critical damping
      definition: The boundary damping level that returns a system to equilibrium as quickly as possible without oscillating.
      drills: [{id: critical-damping-drill, type: typed, prompt: 'What damping regime returns to equilibrium fastest without oscillating?', answer: critical damping}]
    - id: exponential-envelope
      term: exponential envelope
      definition: The decreasing curve $A_0e^{-bt/(2m)}$ that bounds an underdamped displacement.
      drills: [{id: exponential-envelope-drill, type: cloze, prompt: 'The amplitude of an underdamped oscillator follows an {{exponential envelope}}.', answer: exponential envelope}]
