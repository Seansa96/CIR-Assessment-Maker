- id: q001
  type: freeResponse
  skills:
  - physics2-ch01-modeling
  prompt: A Temperature and Heat situation emphasizes thermal equilibrium. Define the system and sign convention,
    state when $Q = mc\\Delta T$ applies, and construct a written solution that includes the relation, units, assumptions,
    and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $Q = mc\\Delta T$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Temperature and Heat model of thermal energy and temperature is reliable only when its relation,
    conditions, and interpretation are kept together.'
