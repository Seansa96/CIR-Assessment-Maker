workedExamples:
- id: mathematical-literacy-reading-mathematical-exposition-worked-example-b-example
  title: Map a definition-to-theorem passage
  problem: A passage defines a property, assumes an object has that property, and then invokes a theorem. Identify
    the distinct roles before accepting the conclusion.
  steps:
  - id: step-1
    title: Locate the definition
    type: freeResponse
    prompt: What role does the first sentence play?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - It fixes the meaning of the property being used.
    explanation: |-
      Solution: It fixes the meaning of the property being used.
      Why it works: Definitions establish terminology rather than proving a new claim.
  - id: step-2
    title: Locate the hypothesis
    type: freeResponse
    prompt: What role does the assumption play?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - It supplies the condition required for the later theorem use.
    explanation: |-
      Solution: It supplies the condition required for the later theorem use.
      Why it works: A hypothesis is information available within the argument.
  - id: step-3
    title: Locate the theorem conclusion
    type: freeResponse
    prompt: What must be checked before accepting the final sentence?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Check that the theorem’s stated hypotheses match the defined property and assumption.
    explanation: |-
      Solution: Check that the theorem’s stated hypotheses match the defined property and assumption.
      Why it works: A conclusion is licensed only when the cited theorem applies to the established conditions.
