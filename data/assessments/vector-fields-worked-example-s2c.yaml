      text: <1,-2> (answers 'For F(x,y)=<y,-x>, what is F(2,1)?', not 'What replaces x and y?')
      issueSignals:
      - id: vector-field-interpretation-error
    - id: c
      text: A radial outward field (answers 'Which field pattern represents arrows pointing away from the origin?', not 'What
        replaces x and y?')
      issueSignals:
      - id: sign-error
    - id: d
      text: <2,4> (answers 'For f(x,y)=x^2+y^2, what is the gradient at (1,2)?', not 'What replaces x and y?')
