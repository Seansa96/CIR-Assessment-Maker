lesson:
  introduction: 'As your game grows, you don''t want to copy and paste the same damage
    calculation code 50 times. You wrap it in a function.


    A function is a reusable block of code that takes inputs (parameters), performs
    an action, and returns an output.

    '
  sections:
  - id: defining-functions
    title: Defining and Calling Functions
    required: true
    content: "Use the `def` keyword to create a function. Everything indented beneath\
      \ it is the function's body.\n\n```python\ndef display_welcome_message():\n\
      \    print(\"Welcome to the Dungeon!\")\n    print(\"Prepare your weapons.\"\
      )\n    \n# Calling the function\ndisplay_welcome_message()\n```\n\nThe code\
      \ inside the function does NOT run until the function is explicitly called.\n"
    check:
      id: defining-functions-check
      type: multipleChoice
      prompt: "Why doesn't this code print anything?\n\n```python\ndef spawn_enemy():\n\
        \    print(\"A wild slime appears!\")\n```\n"
      choices:
      - id: a
        text: Because the print statement is indented.
      - id: b
        text: Because the function is defined, but never called.
      - id: c
        text: Because `def` prevents output to the console.
      answer:
        choiceId: b
      explanation: 'Defining a function just saves the instructions for later. You
        must call it using `spawn_enemy()` for the code inside to actually run.

        '
  - id: parameters-and-arguments
    title: Parameters and Arguments
    required: true
    content: "Parameters act as variables inside the function that receive data when\
      \ the function is called. The actual data you pass in is called an argument.\n\
      \n```python\ndef deal_damage(target, amount):\n    print(f\"You hit the {target}\
      \ for {amount} damage!\")\n    \ndeal_damage(\"Goblin\", 15)\ndeal_damage(\"\
      Dragon\", 50)\n```\n\nYou can also provide **default values**. If the caller\
      \ doesn't provide that argument, the default is used.\n\n```python\ndef heal(amount,\
      \ is_critical=False):\n    if is_critical:\n        amount *= 2\n    print(f\"\
      Healed for {amount} HP.\")\n    \nheal(20)         # Healed for 20 HP.\nheal(20,\
      \ True)   # Healed for 40 HP.\n```\n"
    check:
      id: parameters-and-arguments-check
      type: multipleChoice
      prompt: "Given the function:\n\n```python\ndef cast_spell(spell_name, mana_cost=10):\n\
        \    print(f\"Casting {spell_name} for {mana_cost} MP.\")\n```\n\nWhich of\
        \ the following is a valid way to call it?\n"
      choices:
      - id: a
        text: '`cast_spell("Fireball")`'
      - id: b
        text: '`cast_spell("Heal", 25)`'
      - id: c
        text: '`cast_spell(spell_name="Ice Bolt", mana_cost=15)`'
      - id: d
        text: All of the above are valid.
      answer:
        choiceId: d
      explanation: 'A uses the default mana_cost. B overrides the default. C uses
        keyword arguments, which is also perfectly valid and often makes code easier
        to read.

        '
  - id: return-values
    title: Return Values
    required: true
    content: "Functions often need to give data *back* to the rest of the program\
      \ using the `return` keyword.\n\nWhen Python hits a `return` statement, the\
      \ function immediately stops running, and passes the value back.\n\n```python\n\
      def calculate_damage(base_attack, defense):\n    damage = base_attack - (defense\
      \ / 2)\n    if damage < 1:\n        return 1\n    return damage\n\n# Store the\
      \ returned value in a variable\nactual_damage = calculate_damage(50, 20)\nprint(f\"\
      Dealt {actual_damage} damage.\")\n```\n"
    check:
      id: return-values-check
      type: multipleChoice
      prompt: 'What happens when a function hits a `return` statement?

        '
      choices:
      - id: a
        text: The function pauses, waits for input, and then continues.
      - id: b
        text: The function continues executing the remaining lines of code in its
          body.
      - id: c
        text: The function immediately stops executing and passes the value back to
          the caller.
      - id: d
        text: The program crashes if a variable wasn't ready to receive it.
      answer:
        choiceId: c
      explanation: '`return` instantly exits the function. Any code written beneath
        a `return` statement that gets executed will be ignored.

        '
  - id: args-and-kwargs
    title: '*args and **kwargs'
    required: true
    content: "Sometimes you don't know exactly\rhow many arguments a function will\
      \ receive.\n\n- `*args` lets you pass a variable number of positional arguments\
      \ (they are packed into a tuple).\n- `**kwargs` lets you pass a variable number\
      \ of keyword arguments (they are packed into a dictionary).\n\n```python\ndef\
      \ calculate_total_gold(*gold_pouches):\n    total = 0\n    for pouch in gold_pouches:\n\
      \        total += pouch\n    return total\n    \nprint(calculate_total_gold(10,\
      \ 25, 5)) # Outputs 40\n```\n"
    check:
      id: args-and-kwargs-check
      type: multipleChoice
      prompt: 'If you define a function `def print_inventory(**items):`, what type
        of object is `items` inside the function?

        '
      choices:
      - id: a
        text: list
      - id: b
        text: tuple
      - id: c
        text: dict
      - id: d
        text: set
      answer:
        choiceId: c
      explanation: '`**kwargs` (keyword arguments) are packed into a dictionary (`dict`),
        where the argument names become the keys and their assigned values become
        the dictionary values.

        '
