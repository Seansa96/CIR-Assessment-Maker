workedExamples:
- id: we01
  title: Field of a point charge
  problem: A point charge $Q$ sits at the center of a spherical Gaussian surface of radius $r$. Determine the field.
  steps:
  - id: we1-s1
    title: Use spherical symmetry
    instruction: Select the surface and identify the angle between field and area vector.
    hint: The field is radial everywhere on the centered sphere.
    type: multipleChoice
    prompt: Which statement about the centered spherical surface is correct?
    choices:
    - { id: a, text: $E$ is constant on the sphere and parallel to each outward $d\mathbf A$ }
    - { id: b, text: $E$ is constant but tangent to the sphere, issueSignals: [{ id: physics2-gauss-spherical-angle-error, domains: [physics-2] }] }
    - { id: c, text: $E$ varies with angle because the surface has area, issueSignals: [{ id: physics2-gauss-symmetry-error, domains: [physics-2] }] }
    - { id: d, text: The area vectors all point toward the center, issueSignals: [{ id: physics2-gauss-normal-direction-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: A centered point charge produces radial field; on a sphere of fixed radius its magnitude is constant and parallel to outward $d\mathbf A$.
      Why it works: Spherical symmetry makes the flux integral $E(4\pi r^2)$.
      Why the other choices fail: The field is not tangent, does not vary with angle, and closed-surface normals point outward.
  - id: we1-s2
    title: Apply Gauss's law
    instruction: Write flux and enclosed charge.
    hint: The sphere encloses $Q$ and has area $4\pi r^2$.
    type: multipleChoice
    prompt: Which equation is the correct starting point?
    choices:
    - { id: a, text: '$E(4\pi r^2)=Q/\epsilon_0$' }
    - { id: b, text: '$E(2\pi r)=Q/\epsilon_0$', issueSignals: [{ id: physics2-gauss-area-geometry-error, domains: [physics-2] }] }
    - { id: c, text: '$E(4\pi r^2)=Q\epsilon_0$', issueSignals: [{ id: physics2-gauss-constant-placement-error, domains: [physics-2] }] }
    - { id: d, text: '$E(4\pi r^2)=0$ because the surface encloses no field source area', issueSignals: [{ id: physics2-gauss-flux-zero-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: Flux is $E$ times sphere area $4\pi r^2$ and enclosed charge is $Q$, so the first equation follows.
      Why it works: The field is normal and constant over the entire sphere.
      Why the other choices fail: They use circumference, invert $\epsilon_0$, or confuse field source with surface area.
  - id: we1-s3
    title: Solve and check the limit
    instruction: Isolate $E$ and compare with Coulomb's law.
    hint: Positive $Q$ points outward; negative $Q$ points inward.
    type: multipleChoice
    prompt: Which result is correct?
    choices:
    - { id: a, text: '$E=Q/(4\pi\epsilon_0r^2)$ radially outward for $Q>0$' }
    - { id: b, text: '$E=Q/(4\pi\epsilon_0r)$, radially outward for $Q>0$', issueSignals: [{ id: physics2-gauss-spherical-scaling-error, domains: [physics-2] }] }
    - { id: c, text: '$E=4\pi\epsilon_0Q/r^2$', issueSignals: [{ id: physics2-gauss-constant-placement-error, domains: [physics-2] }] }
    - { id: d, text: '$E=Q/(2\pi\epsilon_0r^2)$', issueSignals: [{ id: physics2-gauss-sphere-area-factor-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: Solving gives $E=Q/(4\pi\epsilon_0r^2)$, which is Coulomb's law and has the correct inverse-square limit.
      Why it works: Spherical area grows as $r^2$, so fixed enclosed charge produces inverse-square field.
      Why the other choices fail: They use linear scaling, invert the constant, or miscount the sphere's area.
- id: we02
  title: Field of a uniformly charged spherical shell
  problem: A thin spherical shell of radius $R$ has total charge $Q$. Compare the field at $r<R$ and $r>R$.
  steps:
  - id: we2-s1
    title: Count enclosed charge inside
    instruction: Choose a Gaussian sphere with $r<R$.
    hint: The shell itself lies at radius $R$.
    type: multipleChoice
    prompt: What charge is enclosed by a Gaussian sphere with $r<R$?
    choices:
    - { id: a, text: '$0$' }
    - { id: b, text: '$Q$', issueSignals: [{ id: physics2-gauss-shell-radius-error, domains: [physics-2] }] }
    - { id: c, text: '$Qr^2/R^2$', issueSignals: [{ id: physics2-gauss-charge-density-error, domains: [physics-2] }] }
    - { id: d, text: '$Q/(4\pi R^2)$', issueSignals: [{ id: physics2-gauss-units-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: The inner Gaussian sphere contains no part of the shell, so $Q_{enc}=0$.
      Why it works: Gauss's law counts charge enclosed by the chosen surface, not charge at a larger radius.
      Why the other choices fail: They include the shell or confuse total charge with surface charge density.
  - id: we2-s2
    title: Solve the inside region
    instruction: Use the zero enclosed charge result.
    hint: Spherical symmetry still makes $E$ constant on the Gaussian sphere.
    type: multipleChoice
    prompt: What is the field for $r<R$?
    choices:
    - { id: a, text: '$E=0$' }
    - { id: b, text: '$E=Q/(4\pi\epsilon_0r^2)$', issueSignals: [{ id: physics2-gauss-shell-inside-error, domains: [physics-2] }] }
    - { id: c, text: '$E=Q/(4\pi\epsilon_0R^2)$', issueSignals: [{ id: physics2-gauss-boundary-error, domains: [physics-2] }] }
    - { id: d, text: '$E=Qr/(4\pi\epsilon_0R^3)$', issueSignals: [{ id: physics2-gauss-inside-scaling-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: $E(4\pi r^2)=0$, hence $E=0$ throughout the interior.
      Why it works: The symmetric Gaussian surface encloses no charge.
      Why the other choices fail: They apply the outside point-charge result or invent an interior dependence.
  - id: we2-s3
    title: Solve the outside region
    instruction: Choose a Gaussian sphere with $r>R$ and include the entire shell charge.
    hint: Outside, the shell behaves like a point charge at its center.
    type: multipleChoice
    prompt: Which outside result and interpretation are correct?
    choices:
    - { id: a, text: '$E=Q/(4\pi\epsilon_0r^2)$; the shell acts like a point charge $Q$' }
    - { id: b, text: '$E=Q/(4\pi\epsilon_0R^2)$; the field stays fixed outside', issueSignals: [{ id: physics2-gauss-outside-scaling-error, domains: [physics-2] }] }
    - { id: c, text: '$E=0$ because the shell has no volume charge', issueSignals: [{ id: physics2-gauss-shell-charge-error, domains: [physics-2] }] }
    - { id: d, text: '$E=Q/(2\pi\epsilon_0r^2)$ because only half the shell contributes', issueSignals: [{ id: physics2-gauss-sphere-area-factor-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: For $r>R$, $Q_{enc}=Q$, so Gauss's law gives $E=Q/(4\pi\epsilon_0r^2)$.
      Why it works: Spherical symmetry makes the external field identical to that of a centered point charge.
      Why the other choices fail: The field is not fixed at the surface value, shell charge is still enclosed, and the sphere area is $4\pi r^2$.
