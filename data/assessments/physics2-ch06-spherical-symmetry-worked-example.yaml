schemaVersion: 1
id: physics2-ch06-spherical-symmetry-worked-example
title: 'Gauss''s Law: Spherical Symmetry'
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-gauss-law
workedExamples:
- id: we1
  title: Field of a Uniformly Charged Solid Sphere
  prompt: A solid non-conducting sphere of radius $R$ has a total charge $Q$ uniformly
    distributed throughout its volume. Find the electric field inside ($r < R$) and
    outside ($r > R$) the sphere.
  steps:
  - id: s1
    prompt: Find the field outside the sphere.
    explanation: 'Solution:

      1) Choose a spherical Gaussian surface of radius $r > R$ concentric with the
      charge.

      2) By symmetry, $\vec{E}$ is radial and constant in magnitude over the surface,
      so $\oint \vec{E} \cdot d\vec{A} = E (4\pi r^2)$.

      3) The enclosed charge is $Q$.

      4) Apply Gauss''s Law: $E (4\pi r^2) = \frac{Q}{\epsilon_0} \implies E = \frac{1}{4\pi
      \epsilon_0} \frac{Q}{r^2}$.


      Why it works:

      Outside any spherically symmetric charge distribution, the field behaves as
      if all the charge were concentrated at the center.'
  - id: s2
    prompt: Find the field inside the sphere.
    explanation: 'Solution:

      1) Choose a spherical Gaussian surface of radius $r < R$.

      2) Flux is again $E (4\pi r^2)$.

      3) The enclosed charge is proportional to the volume: $q_{enc} = Q \frac{\frac{4}{3}\pi
      r^3}{\frac{4}{3}\pi R^3} = Q \frac{r^3}{R^3}$.

      4) Apply Gauss''s Law: $E (4\pi r^2) = \frac{Q \frac{r^3}{R^3}}{\epsilon_0}
      \implies E = \frac{1}{4\pi \epsilon_0} \frac{Q r}{R^3}$.


      Why it works:

      The charge outside the Gaussian sphere contributes nothing to the net field
      inside, so only the fraction of charge inside $r$ matters.'
