items:
- id: r001
  type: typed
  prompt: Define valence electron and name the representation in which it is used.
  answer:
    expected: An electron in the occupied outer shell that can participate in bonding or ion formation.
    aliases:
    - valence electron
  explanation: 'Solution: An electron in the occupied outer shell that can participate in bonding or ion formation. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r002
  type: typed
  prompt: What does Lewis structure tell you to count or distinguish?
  answer:
    expected: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges.
    aliases:
    - Lewis structure
  explanation: 'Solution: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r003
  type: typed
  prompt: State one condition that must be checked when using formal charge.
  answer:
    expected: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding electrons.
    aliases:
    - formal charge
  explanation: 'Solution: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding
    electrons. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r004
  type: typed
  prompt: Connect formal-charge sum to an observable or particle-level consequence.
  answer:
    expected: The requirement that all atomic formal charges add to the species' net charge.
    aliases:
    - formal-charge sum
  explanation: 'Solution: The requirement that all atomic formal charges add to the species'' net charge. Why it works: The
    definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r005
  type: typed
  prompt: Define resonance contributor and name the representation in which it is used.
  answer:
    expected: One of two or more valid Lewis structures with the same atom arrangement but different electron placement.
    aliases:
    - resonance contributor
  explanation: 'Solution: One of two or more valid Lewis structures with the same atom arrangement but different electron
    placement. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r006
  type: typed
  prompt: What does resonance hybrid tell you to count or distinguish?
  answer:
    expected: The actual delocalized structure represented collectively by its resonance contributors.
    aliases:
    - resonance hybrid
  explanation: 'Solution: The actual delocalized structure represented collectively by its resonance contributors. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r007
  type: typed
  prompt: State one condition that must be checked when using delocalization.
  answer:
    expected: Distribution of bonding or charge over more than one localized atom pair or position.
    aliases:
    - delocalization
  explanation: 'Solution: Distribution of bonding or charge over more than one localized atom pair or position. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r008
  type: typed
  prompt: Connect central atom to an observable or particle-level consequence.
  answer:
    expected: The atom connected to multiple surrounding atoms in a Lewis or geometry analysis.
    aliases:
    - central atom
  explanation: 'Solution: The atom connected to multiple surrounding atoms in a Lewis or geometry analysis. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r009
  type: typed
  prompt: Define molecular geometry and name the representation in which it is used.
  answer:
    expected: The three-dimensional arrangement of bonded atom positions around a selected center.
    aliases:
    - molecular geometry
  explanation: 'Solution: The three-dimensional arrangement of bonded atom positions around a selected center. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r010
  type: typed
  prompt: What does local polarity tell you to count or distinguish?
  answer:
    expected: Unequal electron sharing in a particular bond or local structural region.
    aliases:
    - local polarity
  explanation: 'Solution: Unequal electron sharing in a particular bond or local structural region. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r011
  type: typed
  prompt: State one condition that must be checked when using bond dipole.
  answer:
    expected: A vector pointing toward the more electronegative end of a polar bond.
    aliases:
    - bond dipole
  explanation: 'Solution: A vector pointing toward the more electronegative end of a polar bond. Why it works: The definition
    identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r012
  type: typed
  prompt: Connect vector sum to an observable or particle-level consequence.
  answer:
    expected: The magnitude and direction obtained by adding all component vectors with their spatial orientations.
    aliases:
    - vector sum
  explanation: 'Solution: The magnitude and direction obtained by adding all component vectors with their spatial orientations.
    Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
