- id: notes-rational-binomial
  title: Degree-4 polynomial for $x^2/\sqrt{9+x}$
  problem: Find a degree-4 polynomial that approximates $x^2/\sqrt{9+x}$ about zero.
  steps:
  - id: notes-rational-binomial-final
    title: Factor nine and truncate after the usable power
    instruction: Write $(9+x)^{-1/2}=\frac13(1+x/9)^{-1/2}$ and use the binomial coefficients through $x^2$, because the outer $x^2$ shifts powers by two.
    hint: 
    type: freeResponse
    prompt: Write the degree-4 Taylor polynomial.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - $T_4(x)=\frac{x^2}{3}-\frac{x^3}{54}+\frac{x^4}{648}$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Using $(1+u)^{-1/2}=1-\frac12u+\frac38u^2+\cdots$,


      $$\frac{x^2}{\sqrt{9+x}}=\frac{x^2}{3}\left(1-\frac{x}{18}+\frac{x^2}{216}+\cdots\right)

      =\frac{x^2}{3}-\frac{x^3}{54}+\frac{x^4}{648}+\cdots.$$


      Why it works: The prefactor $x^2$ means that terms through $u^2$ produce exactly the powers through degree four.
