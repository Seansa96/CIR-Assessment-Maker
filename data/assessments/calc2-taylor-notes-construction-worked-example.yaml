- id: notes-x2-log-substitution
  title: Build $x^2\ln(1+x^3)$ from a known series
  problem: Find a power-series representation for $x^2\ln(1+x^3)$ and state its interval of convergence.
  steps:
  - id: notes-x2-log-final
    title: Substitute before multiplying by the outer factor
    instruction: Start with $\ln(1+u)=\sum_{n=1}^{\infty}(-1)^{n-1}u^n/n$ for $-1<u\le1$, use $u=x^3$, then multiply by $x^2$.
    hint: 
    type: freeResponse
    prompt: Write the resulting series and interval.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - $x^2\ln(1+x^3)=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}x^{3n+2}}{n}$.
      - 'Interval: $(-1,1]$.'
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution:


      $$x^2\ln(1+x^3)=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}x^{3n+2}}{n}.$$


      The condition is $-1<x^3\le1$, equivalent to $-1<x\le1$.


      Why it works: Substitution changes every $u^n$ to $x^{3n}$, and multiplying by $x^2$ adds $2$ to each exponent. Endpoint behavior comes from the original logarithm series.
