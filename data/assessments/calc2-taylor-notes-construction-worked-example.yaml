- id: notes-euler-identity
  title: Euler’s identity from the exponential series
  problem: Assuming $i^2=-1$, use a series to show $e^{ix}=\cos x+i\sin x$.
  steps:
  - id: notes-euler-final
    title: Separate even and odd powers of $i$
    instruction: Substitute $ix$ into the exponential series and group the even and odd indices.
    hint: 
    type: freeResponse
    prompt: Show the two grouped series and the final identity.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - $e^{ix}=\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n}}{(2n)!}+i\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{(2n+1)!}$.
      - $e^{ix}=\cos x+i\sin x$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution:


      $$e^{ix}=1+ix-\frac{x^2}{2!}-i\frac{x^3}{3!}+\frac{x^4}{4!}+\cdots

      =\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n}}{(2n)!}+i\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{(2n+1)!}.$$


      These are the Maclaurin series for $\cos x$ and $\sin x$, respectively.


      Why it works: Even powers satisfy $i^{2n}=(-1)^n$; odd powers satisfy $i^{2n+1}=i(-1)^n$.
