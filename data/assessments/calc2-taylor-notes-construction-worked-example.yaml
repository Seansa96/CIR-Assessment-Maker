- id: notes-sqrt-centered-nine
  title: Three Taylor terms for $\sqrt{x}$ about $9$
  problem: Find the first three Taylor terms for $\sqrt{x}$ about $a=9$, then use them to approximate $\sqrt{10}$.
  steps:
  - id: notes-sqrt-final
    title: Match value, slope, and curvature at nine
    instruction: Use $f(x)=x^{1/2}$, $f(9)=3$, $f'(9)=1/6$, and $f''(9)=-1/108$.
    hint: 
    type: freeResponse
    prompt: Write $T_2(x)$ and the resulting approximation to $\sqrt{10}$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - '$T_2(x)=3+\frac{x-9}{6}-\frac{(x-9)^2}{216}$.'
      - '$\sqrt{10}\approx3+\frac16-\frac1{216}=\frac{683}{216}\approx3.16204$.'
      circuitAnswer: 
      graphingAnswer: 
    explanation: |
      Solution:

      $$T_2(x)=3+\frac16(x-9)+\frac{-1/108}{2}(x-9)^2

      =3+\frac{x-9}{6}-\frac{(x-9)^2}{216}.$$

      Hence $\sqrt{10}\approx T_2(10)=\frac{683}{216}\approx3.16204$.

      Why it works:
      A degree-$2$ Taylor polynomial matches the function value, first derivative, and second derivative at the nearby center $9$.
