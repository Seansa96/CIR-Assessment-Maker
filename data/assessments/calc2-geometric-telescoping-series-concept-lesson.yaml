lesson:
  introduction: |
    Geometric and telescoping series are the first two infinite-series patterns worth learning deeply because they are not just convergence tests. They often let you find the actual sum.

    The main habit is structural recognition:

    - geometric series repeat by multiplying by the same ratio,
    - telescoping series cancel after expanding partial sums,
    - both are understood through the sequence of partial sums.
  sections:
    - id: geometric-partial-sums
      title: Partial sums reveal the behavior
      required: true
      content: |
        ![Partial sums for geometric series with ratios that converge, oscillate, and diverge](/assessments/calc2-infinite-series/geometric-partial-sums.svg)

        A series is an infinite sum, but we study it through finite snapshots:

        $$
        S_n=a_1+a_2+\cdots+a_n.
        $$

        If the partial sums $S_n$ settle toward a finite number, the series converges. If the partial sums grow without bound or fail to settle, the series diverges.

        For a geometric series, the ratio $r$ controls this behavior.
      check:
        id: geometric-partial-sums-check
        type: multipleChoice
        issueSignals:
        - id: geometric-series-convergence-error
        - id: algebraic-simplification-error
        - id: series-test-selection-error
        - id: fraction-arithmetic-error
        - id: exponent-rule-misapplied
        - id: limit-evaluation-error
        prompt: What does it mean for an infinite series to converge?
        choices:
          - id: a
            text: Its sequence of partial sums approaches a finite limit.
          - id: b
            text: Its individual terms eventually become negative.
          - id: c
            text: Its first term is smaller than its second term.
          - id: d
            text: It contains a variable.
        answer:
          choiceId: a
        explanation: |
          A series converges when the partial sums approach a finite value. The individual terms must approach $0$, but that alone is not enough.

          Related topic: convergence as a limit of partial sums.
    - id: geometric-ratio-rule
      title: The geometric ratio rule
      required: true
      content: |
        A geometric series has the form:

        $$
        \sum_{n=0}^{\infty} ar^n
        =
        a+ar+ar^2+ar^3+\cdots.
        $$

        Each term is multiplied by the same common ratio $r$ to get the next term. The series converges exactly when:

        $$
        |r|<1.
        $$

        If $|r|\ge1$, the terms do not shrink toward $0$ fast enough for the partial sums to settle.
      check:
        id: geometric-ratio-rule-check
        type: multipleChoice
        issueSignals:
        - id: geometric-series-convergence-error
        - id: algebraic-simplification-error
        - id: series-test-selection-error
        - id: fraction-arithmetic-error
        - id: exponent-rule-misapplied
        - id: limit-evaluation-error
        prompt: Which geometric series converges?
        choices:
          - id: a
            text: '$5\sum_{n=0}^{\infty}\left(\frac{2}{3}\right)^n$'
          - id: b
            text: '$\sum_{n=0}^{\infty}2^n$'
          - id: c
            text: '$\sum_{n=0}^{\infty}(-3)^n$'
          - id: d
            text: '$7\sum_{n=0}^{\infty}1^n$'
        answer:
          choiceId: a
        explanation: |
          The first series has common ratio $r=\frac{2}{3}$, so $|r|<1$. The other ratios have absolute value at least $1$, so they diverge.

          Related topic: geometric series convergence.
    - id: geometric-sum-formula
      title: Finding the actual sum
      required: true
      content: |
        When a geometric series converges, its infinite sum is:

        $$
        \sum_{n=0}^{\infty} ar^n=\frac{a}{1-r}.
        $$

        The numerator is the first term. The denominator measures how much is left after one ratio step.

        This formula only applies after checking $|r|<1$.
      check:
        id: geometric-sum-formula-check
        type: numericResponse
        issueSignals:
        - id: geometric-series-convergence-error
        - id: algebraic-simplification-error
        - id: series-test-selection-error
        - id: fraction-arithmetic-error
        - id: exponent-rule-misapplied
        - id: limit-evaluation-error
        prompt: What is the sum of $6+3+\frac{3}{2}+\frac{3}{4}+\cdots$?
        answer:
          value: 12
          tolerance: 0
        explanation: |
          The first term is $a=6$ and the common ratio is $r=\frac12$. Since $|r|<1$,

          $$
          \frac{a}{1-r}
          =
          \frac{6}{1-\frac12}
          =
          12.
          $$

          Related topic: evaluating a geometric series.
    - id: telescoping-cancellation
      title: Telescoping series cancel in partial sums
      required: true
      content: |
        ![A telescoping sum showing adjacent terms canceling and only endpoints remaining](/assessments/calc2-infinite-series/telescoping-cancellation.svg)

        A telescoping series is built so that most interior terms cancel after writing out several partial sums.

        Example:

        $$
        \sum_{n=1}^{\infty}\left(\frac{1}{n}-\frac{1}{n+1}\right).
        $$

        The partial sum is:

        $$
        S_N=\left(1-\frac12\right)+\left(\frac12-\frac13\right)+\cdots+\left(\frac1N-\frac{1}{N+1}\right)
        =
        1-\frac{1}{N+1}.
        $$

        Then take the limit as $N\to\infty$.
      check:
        id: telescoping-cancellation-check
        type: multipleChoice
        issueSignals:
        - id: geometric-series-convergence-error
        - id: algebraic-simplification-error
        - id: series-test-selection-error
        - id: fraction-arithmetic-error
        - id: exponent-rule-misapplied
        - id: limit-evaluation-error
        prompt: After telescoping, what usually remains in a partial sum?
        choices:
          - id: a
            text: Boundary terms from the beginning and end of the partial sum.
          - id: b
            text: Every original term unchanged.
          - id: c
            text: Only factorial terms.
          - id: d
            text: Only negative terms.
        answer:
          choiceId: a
        explanation: |
          Telescoping works because interior terms cancel. The final limit is controlled by the surviving boundary terms.

          Related topic: telescoping partial sums.
    - id: pattern-choice
      title: Choosing between geometric and telescoping
      required: true
      content: |
        Use a geometric pattern when the terms repeat by multiplication:

        $$
        a,\ ar,\ ar^2,\ ar^3,\ldots
        $$

        Use a telescoping pattern when the term can be rewritten as a difference:

        $$
        b_n-b_{n+1}.
        $$

        A series can sometimes require algebra before the pattern is visible, especially partial fractions:

        $$
        \frac{1}{n(n+1)}=\frac{1}{n}-\frac{1}{n+1}.
        $$
      check:
        id: pattern-choice-check
        type: selectAll
        issueSignals:
        - id: geometric-series-convergence-error
        - id: algebraic-simplification-error
        - id: series-test-selection-error
        - id: fraction-arithmetic-error
        - id: exponent-rule-misapplied
        - id: limit-evaluation-error
        prompt: Which are signs that a series may telescope?
        choices:
          - id: a
            text: A rational term like $\frac{1}{n(n+1)}$ that can split into partial fractions.
          - id: b
            text: Terms that look like $b_n-b_{n+1}$.
          - id: c
            text: A constant common ratio between every pair of adjacent terms.
          - id: d
            text: Cancellation appears when several terms are written out.
        answer:
          choiceIds: [a, b, d]
        explanation: |
          Telescoping is a cancellation pattern. A constant common ratio points to geometric series instead.

          Related topic: recognizing series structure before choosing a method.
