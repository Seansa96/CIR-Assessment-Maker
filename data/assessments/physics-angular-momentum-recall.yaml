glossary:
  introduction: Review the essential terms below. Once you understand them, test your
    knowledge using the recall drills.
  sections:
  - id: sec-physics-angular-momentum-recall
    title: Core Terminology
    entries:
    - id: entry-angular-momentum-particle
      term: Angular Momentum of a Particle ($\vec{L}$)
      definition: The cross product of a particle's position vector and linear momentum
        vector. $\vec{L} = \vec{r} \times \vec{p}$.
      drills:
      - id: drill-ang-mom
        prompt: The angular momentum of a particle is the cross product of its position
          vector and its linear ________ vector.
        type: typed
        answer:
          expected: momentum
    - id: entry-angular-momentum-rigid
      term: Angular Momentum of a Rigid Body
      definition: For a rigid body rotating about a fixed symmetry axis, $L = I\omega$.
      drills:
      - id: drill-ang-mom-rigid
        prompt: For a rigid body rotating about a fixed axis, angular momentum $L$
          equals $I$ times ________.
        type: typed
        answer:
          expected: \omega
