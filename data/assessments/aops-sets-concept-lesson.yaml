      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-sets-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: translate notation, use inclusion-exclusion, count subsets by size. Record the givens, unknown, and any restriction before selecting a method.'
