lesson:
  introduction: >
    Electric flux measures signed electric-field flow through an oriented surface. Use the area vector, project the field,
    integrate when needed, and check units and limiting cases.
  sections:
  - id: physics2-ch06-electric-flux-s1
    title: Interpret the area vector
    required: true
    content: A flat surface has an area vector normal to the surface; a closed surface uses outward normals. Flux is the dot product $\mathbf E\cdot\mathbf A$.
    check:
      id: physics2-ch06-electric-flux-s1-check
      type: multipleChoice
      prompt: A uniform field $\mathbf E=E\hat{x}$ crosses area $A$ whose normal is $-\hat{x}$. What is the flux?
      choices:
      - { id: a, text: '$+EA$', issueSignals: [{ id: physics2-flux-sign-error, domains: [physics-2] }] }
      - { id: b, text: '$-EA$ (negative flux relative to the chosen normal)' }
      - { id: c, text: '$0$', issueSignals: [{ id: physics2-flux-perpendicular-error, domains: [physics-2] }] }
      - { id: d, text: '$E/A$', issueSignals: [{ id: physics2-flux-units-error, domains: [physics-2] }] }
      answer: { choiceId: b }
      explanation: >
        Solution: The angle between $\mathbf E$ and $-\hat{x}$ is $180^\circ$, so $\Phi_E=EA\cos180^\circ=-EA$.
        Why it works: The dot product uses the oriented area vector, not unsigned area.
        Why the other choices fail: a loses the orientation sign, c is the perpendicular case, and d has wrong units.
    difficultyDimensions: [representation, sign]
    difficultyEvidence: Requires a signed dot product.
  - id: physics2-ch06-electric-flux-s2
    title: Project the field
    required: true
    content: For a uniform field and planar surface, $\Phi_E=EA\cos\theta$, where $\theta$ is measured from the area vector.
    check:
      id: physics2-ch06-electric-flux-s2-check
      type: multipleChoice
      prompt: A $4.0\,\mathrm{m^2}$ surface has $E=30\,\mathrm{N/C}$ and its normal is $60^\circ$ from the field. What is the flux?
      choices:
      - { id: a, text: '$60\,\mathrm{N\,m^2/C}$' }
      - { id: b, text: '$120\,\mathrm{N\,m^2/C}$', issueSignals: [{ id: physics2-flux-area-error, domains: [physics-2] }] }
      - { id: c, text: '$15\,\mathrm{N\,m^2/C}$', issueSignals: [{ id: physics2-flux-angle-error, domains: [physics-2] }] }
      - { id: d, text: '$0\,\mathrm{N\,m^2/C}$', issueSignals: [{ id: physics2-flux-perpendicular-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >
        Solution: $\Phi_E=(30)(4.0)\cos60^\circ=60\,\mathrm{N\,m^2/C}$.
        Why it works: Only the field component normal to the surface contributes.
        Why the other choices fail: a omits the projection, c uses the wrong projection, and d treats $60^\circ$ as perpendicular.
    difficultyDimensions: [calculation, representation]
    difficultyEvidence: Requires the correct angle and area factor.
  - id: physics2-ch06-electric-flux-s3
    title: Know when to integrate
    required: true
    content: Start with $\Phi_E=\int_S\mathbf E\cdot d\mathbf A$. Factor out $E$ only after symmetry proves it is constant over the chosen surface.
    check:
      id: physics2-ch06-electric-flux-s3-check
      type: multipleChoice
      prompt: A radial field crosses a centered spherical surface. Which setup is justified?
      choices:
      - { id: a, text: '$\Phi_E=E(r)4\pi r^2$ because the field is constant everywhere', issueSignals: [{ id: physics2-flux-uniformity-error, domains: [physics-2] }] }
      - { id: b, text: '$\Phi_E=\int_S\mathbf E\cdot d\mathbf A$, then use symmetry to obtain $E(r)4\pi r^2$' }
      - { id: c, text: '$\Phi_E=\int_S E(r)dA$ and flux is always positive', issueSignals: [{ id: physics2-flux-sign-error, domains: [physics-2] }] }
      - { id: d, text: '$\Phi_E=E(r)/(4\pi r^2)$', issueSignals: [{ id: physics2-flux-area-error, domains: [physics-2] }] }
      answer: { choiceId: b }
      explanation: >
        Solution: Write the dot-product integral first; spherical symmetry makes $E(r)$ and the angle constant, giving $E(r)4\pi r^2$.
        Why it works: Symmetry justifies the reduction after the geometry is checked.
        Why the other choices fail: a assumes uniformity, c discards orientation, and d divides instead of integrating area.
    difficultyDimensions: [modelOrDerivation, symmetry]
    difficultyEvidence: Distinguishes definition from a symmetry shortcut.
  - id: physics2-ch06-electric-flux-s4
    title: Sum a closed surface
    required: true
    content: A closed surface sums outward flux through every patch. A uniform field through a cube has equal entering and leaving contributions.
    check:
      id: physics2-ch06-electric-flux-s4-check
      type: multipleChoice
      prompt: A uniform field $E\hat{x}$ passes through a cube. What is the net flux?
      choices:
      - { id: a, text: '$6EA$', issueSignals: [{ id: physics2-flux-open-surface-error, domains: [physics-2] }] }
      - { id: b, text: '$EA$', issueSignals: [{ id: physics2-flux-face-count-error, domains: [physics-2] }] }
      - { id: c, text: '$0$ net flux through the closed cube' }
      - { id: d, text: '$-EA$', issueSignals: [{ id: physics2-flux-sign-error, domains: [physics-2] }] }
      answer: { choiceId: c }
      explanation: >
        Solution: The $+x$ face gives $+EA$, the $-x$ face gives $-EA$, and the other faces give zero; the sum is zero.
        Why it works: Uniform field lines entering a closed cube also leave it.
        Why the other choices fail: They count only one sign, all faces, or unsigned flow.
    difficultyDimensions: [symmetry, sign]
    difficultyEvidence: Requires an oriented sum over a closed surface.
  - id: physics2-ch06-electric-flux-s5
    title: Check units and limits
    required: true
    content: Flux has units $\mathrm{N\,m^2/C}$. It vanishes for a field parallel to the surface and changes sign when the normal reverses.
    check:
      id: physics2-ch06-electric-flux-s5-check
      type: multipleChoice
      prompt: Which result passes both a unit check and the parallel-surface limit?
      choices:
      - { id: a, text: '$\Phi_E=EA\cos\theta$, with units $\mathrm{N\,m^2/C}$ and zero at $\theta=90^\circ$' }
      - { id: b, text: '$\Phi_E=E/A$, with reciprocal-area units and zero at $\theta=0^\circ$', issueSignals: [{ id: physics2-flux-units-error, domains: [physics-2] }] }
      - { id: c, text: '$\Phi_E=EA\sin\theta$, maximum at $90^\circ$', issueSignals: [{ id: physics2-flux-angle-error, domains: [physics-2] }] }
      - { id: d, text: '$\Phi_E=E+A$', issueSignals: [{ id: physics2-flux-units-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >
        Solution: The dot product gives $EA\cos\theta$ and a surface parallel to the field has normal angle $90^\circ$.
        Why it works: Dimensions and limiting cases test both algebra and geometry.
        Why the other choices fail: b has wrong units, c uses the wrong angle dependence, and d adds unlike quantities.
    difficultyDimensions: [errorDiagnosis, limitingCase]
    difficultyEvidence: Combines dimensional and geometric checks.
