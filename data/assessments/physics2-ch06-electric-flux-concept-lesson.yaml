workedExamples:
- id: l1-sec1
  title: Concept of Flux
  explanation: Electric flux $\Phi_E$ measures the amount of electric field passing
    through a surface. It depends on the field strength, the surface area, and the
    angle between the field lines and the surface normal.
- id: l1-sec2
  title: Flux Formula
  explanation: 'For a uniform electric field $\vec{E}$ and a flat surface with area
    vector $\vec{A}$, the flux is $\Phi_E = \vec{E} \cdot \vec{A} = E A \cos \theta$.
    For a non-uniform field or curved surface, we integrate: $\Phi_E = \int \vec{E}
    \cdot d\vec{A}$.'
