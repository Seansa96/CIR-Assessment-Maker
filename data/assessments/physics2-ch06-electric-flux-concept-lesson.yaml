lesson:
  introduction: >
    This lesson develops a repeatable way to solve Electric Flux problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch06-electric-flux-s1
    title: Name the model and quantities
    required: true
    content: >
      Electric Flux uses Phi_E = integral(E dot dA). In the name the model and quantities stage, choose the surface normal, project the field onto that normal, and keep the sign.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Electric Flux problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch06-electric-flux-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Electric Flux, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use Phi_E = integral(E dot dA) after you choose the surface normal, project the field onto that normal, and keep the sign.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Electric Flux problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch06-electric-flux-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables Phi_E = integral(E dot dA) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch06-electric-flux-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Electric Flux.
        media: []
        issueSignals:
        - id: physics2-physics2-ch06-electric-flux-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Electric Flux, first choose the surface normal, project the field onto that normal, and keep the sign. Then apply Phi_E = integral(E dot dA) with one consistent coordinate system and solve for the requested quantity.


        Why it works: Phi_E = integral(E dot dA) connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
