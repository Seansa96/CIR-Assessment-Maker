schemaVersion: 1
id: physics-angular-momentum-test-easy
title: 'Test (Easy): Angular Momentum'
description: Fundamental exam covering Angular Momentum.
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-angular-momentum
modeDefault: exam
randomizeQuestions: true
questions:
- id: q1
  type: multipleChoice
  prompt: 'The angular momentum $\vec{L}$ of a particle is defined as:'
  choices:
  - id: c1
    content: $\vec{r} \times \vec{p}$
  - id: c2
    content: $\vec{p} \times \vec{r}$
  - id: c3
    content: $m\vec{v}$
  answer:
    choiceId: c1
  explanation: Angular momentum is the cross product of the position vector and the
    linear momentum vector.
