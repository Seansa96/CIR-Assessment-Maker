questions:
- id: q001
  type: code
  prompt: 'Write a C++ function named `resizeArray` that receives an old dynamic array
    pointer, the number of values to copy, and a new capacity.


    It should allocate a new integer array with `newCapacity` slots, copy the first
    `oldSize` values into it, delete the old array with `delete[]`, and return the
    new pointer.


    Submit both complete function definitions shown in the starter code. Do not write
    `main()`, do not print output, and do not call the functions yourself. The runner
    will call `resizeArrayCase` automatically so it can verify pointer behavior safely.

    '
  language: cpp
  functionName: resizeArrayCase
  starterCode: "int* resizeArray(int* oldData, int oldSize, int newCapacity)\n{\n\
    \    // Allocate a larger array, copy oldSize values, delete oldData, and return\
    \ the new array.\n    return nullptr;\n}\n\nstring resizeArrayCase(int caseId)\n\
    {\n    if (caseId == 1) {\n        int* values = new int[2]{4, 7};\n        int*\
    \ resized = resizeArray(values, 2, 4);\n        bool ok = resized != nullptr &&\
    \ resized[0] == 4 && resized[1] == 7;\n        delete[] resized;\n        return\
    \ ok ? \"COPY_OK\" : \"COPY_FAIL\";\n    }\n\n    if (caseId == 2) {\n       \
    \ int* values = new int[1]{9};\n        int* resized = resizeArray(values, 1,\
    \ 3);\n        bool ok = resized != nullptr && resized[0] == 9;\n        delete[]\
    \ resized;\n        return ok ? \"GROW_OK\" : \"GROW_FAIL\";\n    }\n\n    if\
    \ (caseId == 3) {\n        int* resized = resizeArray(nullptr, 0, 2);\n      \
    \  bool ok = resized != nullptr;\n        if (resized != nullptr) {\n        \
    \    resized[0] = 11;\n        }\n        delete[] resized;\n        return ok\
    \ ? \"NULL_OK\" : \"NULL_FAIL\";\n    }\n\n    int* values = new int[2]{1, 2};\n\
    \    int* resized = resizeArray(values, 0, 5);\n    bool ok = resized != nullptr;\n\
    \    delete[] resized;\n    return ok ? \"ZERO_SIZE_OK\" : \"ZERO_SIZE_FAIL\"\
    ;\n}\n"
  tests:
  - input: '1'
    expected: COPY_OK
  - input: '2'
    expected: GROW_OK
  - input: '3'
    expected: NULL_OK
  - input: '4'
    expected: ZERO_SIZE_OK
  answer: {}
  explanation: 'A correct `resizeArray` allocates `int* newData = new int[newCapacity];`,
    copies indexes `0` through `oldSize - 1`, calls `delete[] oldData;`, and returns
    `newData`.


    Related topic: manual resize sequence. This is the core operation that `IntBuffer::push`
    will need when the buffer is full.

    '
