questions:
- id: q1
  type: numericResponse
  prompt: A system consists of three $2.0 \text{ kg}$ point masses located at $(1.0\text{m},
    0)$, $(0, 2.0\text{m})$, and $(-1.0\text{m}, 0)$. What is the moment of inertia
    about the y-axis?
  answer:
    value: 4.0
    tolerance: 0.5
  explanation: $I_y = \sum m x^2 = 2.0(1.0)^2 + 2.0(0)^2 + 2.0(-1.0)^2 = 4.0 \text{
    kg}\cdot\text{m}^2$.
