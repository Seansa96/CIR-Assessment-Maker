questions:
- id: q001
  title: Flywheel rpm energy
  type: numericResponse
  prompt: |-
    A flywheel has $I=1.20\text{ kg}\cdot\text{m}^2$ and rotates at $180\text{ rpm}$. What is $K_{rot}$?
  answer:
    value: 213.2
    tolerance: 1.0
  explanation: |
    Solution: $180$ rpm is $6\pi$ rad/s. Thus $K_{rot}=\tfrac12(1.20)(6\pi)^2=213.2$ J.

    Why it works: Rotational kinetic energy depends on moment of inertia and the square of angular speed.
  difficultyDimensions: [unitConversion, modelOrDerivation, unitAnalysis]
  subjectDifficultyTags: [rotationalKineticEnergy]
  difficultyEvidence: The rate conversion is required before applying an energy model with squared angular speed.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q002
  title: Doubling energy
  type: multipleChoice
  prompt: |-
    If $I$ is constant, by what factor must $\omega$ change to double $K_{rot}$?
  choices:
  - id: a
    text: |-
      $\sqrt2$
  - id: b
    text: |-
      $2$
  - id: c
    text: |-
      $4$
  - id: d
    text: |-
      $1/2$
  answer:
    choiceId: a
  explanation: |
    Solution: The factor is $\sqrt2$.

    Why it works: With $I$ fixed, $K_{rot}\propto\omega^2$; therefore $(\omega_f/\omega_i)^2=2$.

    Why the other choices fail: A factor of 2 would quadruple energy, 4 would multiply it by 16, and 1/2 would reduce it.
  difficultyDimensions: [reverseReasoning, symbolicManipulation, qualitativeCheck]
  subjectDifficultyTags: [energyScaling]
  difficultyEvidence: The squared dependence is reasoned backward from an energy factor to a speed factor.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q003
  title: Rolling sphere energy
  type: numericResponse
  prompt: |-
    A $4.0\text{ kg}$ solid sphere rolls at $5.0\text{ m/s}$. What is total kinetic energy?
  answer:
    value: 70.0
    tolerance: 0.5
  explanation: |
    Solution: For a solid sphere, $K=\tfrac7{10}Mv^2=0.7(4.0)(5.0)^2=70$ J.

    Why it works: Rolling without slipping combines translational and rotational energy, with the sphere's moment-of-inertia ratio producing the $7/10$ coefficient.
  difficultyDimensions: [modelSelection, representationTransfer, multiStep]
  subjectDifficultyTags: [rollingEnergy]
  difficultyEvidence: The rolling-body model must replace a translation-only kinetic-energy calculation.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q004
  title: Required inertia
  type: numericResponse
  prompt: |-
    A rotor must store $10,000\text{ J}$ at $100\text{ rad/s}$. What $I$ is required?
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: |
    Solution: $I=2K/\omega^2=2(10000)/(100)^2=2.0$ kg m^2.

    Why it works: Solving $K_{rot}=\tfrac12I\omega^2$ for inertia gives the required rotational mass distribution for the target energy.
  difficultyDimensions: [reverseReasoning, modelOrDerivation, unitAnalysis]
  subjectDifficultyTags: [inertiaDesign]
  difficultyEvidence: A rotational-energy relation is inverted to determine a design parameter.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q005
  title: Hoop to disk rolling ratio
  type: numericResponse
  prompt: |-
    A hoop and solid disk have the same mass and roll at the same speed. What is $K_{hoop}/K_{disk}$?
  answer:
    value: 1.333
    tolerance: 0.02
  explanation: |
    Solution: $K_{hoop}=Mv^2$ and $K_{disk}=\tfrac34Mv^2$, so $K_{hoop}/K_{disk}=4/3=1.333$.

    Why it works: At the same rolling speed, the hoop retains more rotational energy because more of its mass lies farther from its axis.
  difficultyDimensions: [modelComparison, simplification, representationTransfer]
  subjectDifficultyTags: [shapeDependence]
  difficultyEvidence: Two rolling-energy models must be compared by cancelling common mass and speed factors.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q006
  title: Largest rotational energy
  type: multipleChoice
  prompt: |-
    For equal $M$, $R$, and $\omega$, which has greatest $K_{rot}$?
  choices:
  - id: a
    text: |-
      Thin hoop
  - id: b
    text: |-
      Solid disk
  - id: c
    text: |-
      Solid sphere
  - id: d
    text: |-
      All equal
  answer:
    choiceId: a
  explanation: |
    Solution: Thin hoop.

    Why it works: Equal $M$, $R$, and $\omega$ leave $K_{rot}=\tfrac12I\omega^2$ controlled by $I$; a hoop has the largest listed moment of inertia.

    Why the other choices fail: A disk and sphere place more mass nearer the axis, lowering $I$; equal dimensions do not make all moments of inertia equal.
  difficultyDimensions: [modelComparison, representationTransfer, errorDiagnosis]
  subjectDifficultyTags: [momentOfInertia]
  difficultyEvidence: Geometric mass distribution is connected to a qualitative energy comparison.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q007
  title: Energy lost slowing
  type: numericResponse
  prompt: |-
    A wheel with $I=3.5$ slows from $12$ to $5\text{ rad/s}$. How much kinetic energy is lost?
  answer:
    value: 208.25
    tolerance: 1.0
  explanation: |
    Solution: Energy lost is $\tfrac12I(\omega_i^2-\omega_f^2)=1.75(144-25)=208.25$ J.

    Why it works: The difference of the initial and final rotational kinetic energies is the energy removed while the wheel slows.
  difficultyDimensions: [signConvention, multiStep, modelOrDerivation]
  subjectDifficultyTags: [energyChange]
  difficultyEvidence: A positive energy-loss quantity is obtained by interpreting the order of a kinetic-energy decrease.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q008
  title: Large moment meaning
  type: multipleChoice
  prompt: |-
    A large moment of inertia means an object is harder to:
  choices:
  - id: a
    text: |-
      change in rotational motion about that axis
  - id: b
    text: |-
      lift vertically
  - id: c
    text: |-
      translate on frictionless ground
  - id: d
    text: |-
      measure
  answer:
    choiceId: a
  explanation: |
    Solution: Change in rotational motion about that axis.

    Why it works: Moment of inertia measures resistance to angular acceleration about a specified axis, analogous to mass in linear dynamics.

    Why the other choices fail: It does not directly govern lifting, straight-line motion on a frictionless surface, or ease of measurement.
  difficultyDimensions: [analogyTransfer, errorDiagnosis, modelOrDerivation]
  subjectDifficultyTags: [rotationalInertia]
  difficultyEvidence: The rotational analogue of linear inertia is applied to distinguish axis-dependent rotational behavior from unrelated effects.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q009
  title: Cylinder down height
  type: numericResponse
  prompt: |-
    A solid cylinder rolls without slipping down a height of $1.8\text{ m}$. What speed does it reach?
  answer:
    value: 4.85
    tolerance: 0.05
  explanation: |
    Solution: For a rolling solid cylinder, $mgh=\tfrac34mv^2$. Thus $v=\sqrt{4(9.8)(1.8)/3}=4.85$ m/s.

    Why it works: Gravitational potential energy becomes both translation and rotation, and the no-slip condition links the two motions.
  difficultyDimensions: [modelSelection, multiStep, domainCondition]
  subjectDifficultyTags: [rollingEnergyConservation]
  difficultyEvidence: Energy conservation is combined with the specific solid-cylinder rolling model and its no-slip condition.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
- id: q010
  title: Rolling disk omega
  type: numericResponse
  prompt: |-
    A disk of radius $0.30\text{ m}$ rolls at $2.4\text{ m/s}$. What is $\omega$?
  answer:
    value: 8.0
    tolerance: 0.05
  explanation: |
    Solution: $\omega=v/R=2.4/0.30=8.0$ rad/s.

    Why it works: Rolling without slipping makes the center-of-mass speed equal to radius times angular speed.
  difficultyDimensions: [modelOrDerivation, unitAnalysis, domainCondition]
  subjectDifficultyTags: [rollingConstraint]
  difficultyEvidence: The rolling constraint is selected and checked as the condition that permits a direct linear-to-angular conversion.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-moment-of-inertia-ke]
