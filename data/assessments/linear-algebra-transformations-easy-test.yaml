questions:
  - id: test-easy-linear-definition
    type: multipleChoice
    prompt: |
      Let $T: \mathbb{R}^n \to \mathbb{R}^m$ be a linear transformation. Which of the following equations must hold true for any scalar $c$ and vector $\vec{u}$?
    choices:
      - id: c1
        text: '$T(c\vec{u}) = T(c)T(\vec{u})$'
      - id: c2
        text: '$T(c\vec{u}) = cT(\vec{u})$'
      - id: c3
        text: '$T(c\vec{u}) = c + T(\vec{u})$'
      - id: c4
        text: '$T(c\vec{u}) = T(\vec{u})^c$'
    answer:
      choiceId: c2

  - id: test-easy-standard-matrix-columns
    type: multipleChoice
    prompt: |
      The standard matrix $A$ for a linear transformation $T: \mathbb{R}^n \to \mathbb{R}^m$ is constructed by evaluating $T$ on which vectors?
    choices:
      - id: c1
        text: 'Any $n$ linearly independent vectors in $\mathbb{R}^n$.'
      - id: c2
        text: 'The standard basis vectors $\vec{e}_1, \vec{e}_2, \dots, \vec{e}_n$.'
      - id: c3
        text: 'The standard basis vectors $\vec{e}_1, \vec{e}_2, \dots, \vec{e}_m$.'
      - id: c4
        text: 'The columns of the identity matrix in $\mathbb{R}^m$.'
    answer:
      choiceId: c2

  - id: test-easy-onto-pivots
    type: multipleChoice
    prompt: |
      If a linear transformation $T: \mathbb{R}^3 \to \mathbb{R}^3$ is **onto** $\mathbb{R}^3$, what must be true about its $3 \times 3$ standard matrix $A$?
    choices:
      - id: c1
        text: 'It has a pivot in every column.'
      - id: c2
        text: 'It has a pivot in every row.'
      - id: c3
        text: 'It has exactly 3 pivots.'
      - id: c4
        text: 'All of the above.'
    answer:
      choiceId: c4

  - id: test-easy-one-to-one-kernel
    type: multipleChoice
    prompt: |
      A linear transformation is one-to-one if and only if its kernel (null space) contains:
    choices:
      - id: c1
        text: 'Only the zero vector.'
      - id: c2
        text: 'At least one non-zero vector.'
      - id: c3
        text: 'All vectors in the domain.'
      - id: c4
        text: 'No vectors at all.'
    answer:
      choiceId: c1

  - id: test-easy-transformation-dimensions
    type: multipleChoice
    prompt: |
      If a linear transformation $T$ has a standard matrix of size $6 \times 4$, what are the domain and codomain of $T$?
    choices:
      - id: c1
        text: 'Domain is $\mathbb{R}^6$, Codomain is $\mathbb{R}^4$.'
      - id: c2
        text: 'Domain is $\mathbb{R}^4$, Codomain is $\mathbb{R}^6$.'
      - id: c3
        text: 'Domain is $\mathbb{R}^{24}$, Codomain is $\mathbb{R}^{24}$.'
      - id: c4
        text: 'They cannot be determined without knowing the entries of the matrix.'
    answer:
      choiceId: c2
