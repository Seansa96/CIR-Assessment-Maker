items:
- id: com-r001
  type: cloze
  prompt: 'Complete: $x_{\mathrm{com}}=\frac{\sum_i m_i x_i}{\underline{\hspace{1cm}}}$.'
  answer:
    expected: M
    expectedLatex: M
    aliases:
    - total mass
    media: []
    choiceId: 
  explanation: 'Solution: The denominator is $M$.\n\nWhy it works: $M=\sum_i m_i$ is the total mass of the system.'
  tags:
  - weighted-average
  skills: []
  issueSignals: []
  choices: []
- id: com-r002
  type: cloze
  prompt: A 3 kg mass at $x=-2$ m contributes $m x=\underline{\hspace{1cm}}$ kg m to the numerator.
  answer:
    expected: -6
    expectedLatex: -6
    aliases:
    - −6
    media: []
    choiceId: 
  explanation: 'Solution: $(3\ \mathrm{kg})(-2\ \mathrm{m})=-6\ \mathrm{kg\,m}$.\n\nWhy it works: Signed coordinates are retained in the mass-position product.'
  tags:
  - signed-coordinate
  skills: []
  issueSignals: []
  choices: []
- id: com-r003
  type: cloze
  prompt: 'Complete: $\vec v_{\mathrm{com}}=\vec P_{\mathrm{total}}/\underline{\hspace{1cm}}$.'
  answer:
    expected: M
    expectedLatex: M
    aliases:
    - total mass
    media: []
    choiceId: 
  explanation: 'Solution: Divide total momentum by $M$.\n\nWhy it works: Center-of-mass velocity is the mass-weighted average of particle velocities.'
  tags:
  - momentum
  skills: []
  issueSignals: []
  choices: []
- id: com-r004
  type: cloze
  prompt: For the whole selected system, internal force pairs sum to $\underline{\hspace{1cm}}$.
  answer:
    expected: 0
    expectedLatex: 0
    aliases:
    - zero
    media: []
    choiceId: 
  explanation: 'Solution: They sum to $0$.\n\nWhy it works: Each internal interaction has an equal-and-opposite partner inside the system.'
  tags:
  - system-boundary
  skills: []
  issueSignals: []
  choices: []
- id: com-r005
  type: typed
  prompt: What two quantities must be calculated separately for a two-dimensional center of mass?
  answer:
    expected: x and y components
    expectedLatex: ''
    aliases:
    - x and y
    - the x and y coordinates
    - x-component and y-component
    media: []
    choiceId: 
  explanation: 'Solution: Calculate the x and y components separately.\n\nWhy it works: Position is a vector, so each coordinate uses its own mass-weighted average.'
  tags:
  - components
  skills: []
  issueSignals: []
  choices: []
- id: com-r006
  type: typed
  prompt: For a projectile system with negligible air resistance, which external force sets the center-of-mass acceleration?
  answer:
    expected: gravity
    expectedLatex: ''
    aliases:
    - gravitational force
    - weight
    media: []
    choiceId: 
  explanation: 'Solution: Gravity sets the acceleration.\n\nWhy it works: It is the remaining external force on the projectile system.'
  tags:
  - external-force
