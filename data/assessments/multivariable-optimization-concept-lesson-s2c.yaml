  - id: s03
    title: Constraints change the condition
    required: true
    content: Lagrange multipliers seek points where the objective gradient is parallel to the constraint gradient. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
