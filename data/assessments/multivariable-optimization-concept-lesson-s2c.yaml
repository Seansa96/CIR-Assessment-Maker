  - id: s02
    title: Second partials classify locally
    required: true
    content: The discriminant combines second partials to identify many local maxima, minima, and saddles. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
