      explanation: >-
        Solution: The correct response is fx=0 and fy=0.

        Why it works: Interior extrema occur where both first partial derivatives vanish or fail to exist.

        Why the other choices fail: Choice b gives a response to the related question 'What does D=fxx fyy-fxy^2 classify?', rather than to 'What equations identify an interior critical point?'.

        Choice c gives a response to the related question 'What does D<0 indicate?', rather than to 'What equations identify an interior critical point?'.

        Choice d gives a response to the related question 'What condition is used for Lagrange multipliers?', rather than to 'What equations identify an interior critical point?'.
