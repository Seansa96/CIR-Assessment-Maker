  - id: s04
    title: Worked micro-example
    required: true
    content: 'Use the short task Find the constrained extrema of $f(x,y)=x+y$ subject to $x^2+y^2=1$. as a model. First, set gradient relation: What equation is required? The resulting statement is $\langle1,1\rangle=\lambda\langle2x,2y\rangle$. This identifies the governing relation and gives a checkable intermediate result.'
