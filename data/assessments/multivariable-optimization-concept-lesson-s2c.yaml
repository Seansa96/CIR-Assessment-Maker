    - type: image
      src: /media/calculus-3/multivariable-optimization.svg
      alt: Original multivariable optimization and lagrange multipliers reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What equations identify an interior critical point?
      choices:
      - id: a
        text: fx=0 and fy=0
        media: []
        issueSignals: []
      - id: b
        text: local behavior at a critical point (answers 'What does D=fxx fyy-fxy^2 classify?', not 'What equations identify an interior critical point?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: c
        text: saddle point (answers 'What does D<0 indicate?', not 'What equations identify an interior critical point?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: d
        text: gradient f equals lambda gradient g (answers 'What condition is used for Lagrange multipliers?', not 'What equations identify an interior critical point?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
