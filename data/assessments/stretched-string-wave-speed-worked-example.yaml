workedExamples:
- id: we-stretched-string-wave-speed
  title: Deriving and applying Wave Speed on a Stretched String
  problem: Use the labeled model to derive and calculate the string-wave speed from $v=\sqrt{T/\mu}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the parameters of the string from the diagram. A string of mass $m$ and length $L$ is pulled taut by a tension $F_T$.
    prompt: 'Identify the parameters.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Mass $m$, length $L$, tension $F_T$'
    explanation: >-
      The problem provides the total mass $m$, total length $L$, and tension $F_T$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State assumptions regarding the string.
    prompt: 'What is assumed about the string?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Uniform linear mass density.'
    explanation: >-
      We assume the string has a uniform linear mass density $\mu$ along its entire length.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Wave speed $v$'
    explanation: >-
      We want to calculate the wave propagation speed $v$ on the string.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the relation for wave speed on a stretched string.
    prompt: 'Write the governing equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'v = \sqrt{F_T / \mu}'
    explanation: >-
      $v = \sqrt{F_T / \mu}$ where $\mu = m/L$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Express the wave speed entirely in terms of the given variables $F_T, m, L$.
    prompt: 'Isolate $v$ in given terms.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'v = \sqrt{F_T L / m}'
    explanation: >-
      Substitute $\mu = m/L$ to get $v = \sqrt{\frac{F_T L}{m}}$.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $F_T = 100.0$ N, string mass $m = 0.050$ kg, and length $L = 2.0$ m, calculate the speed $v$.
    prompt: 'Calculate wave speed.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      value: 63.2
      tolerance: 0.5
    explanation: >-
      $v = \sqrt{\frac{100.0 \times 2.0}{0.050}} = \sqrt{\frac{200}{0.05}} = \sqrt{4000} \approx 63.2$ m/s.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of $\sqrt{F_T L / m}$.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'm/s'
    explanation: >-
      $\sqrt{(\text{N}\cdot\text{m})/\text{kg}} = \sqrt{(\text{kg}\cdot\text{m}^2/\text{s}^2)/\text{kg}} = \text{m/s}$.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated wave speed.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      value: 63.2
      tolerance: 0.5
    explanation: >-
      The wave speed is $63.2$ m/s.
