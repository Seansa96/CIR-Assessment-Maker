workedExamples:
- id: we-stretched-string-wave-speed
  title: Deriving and applying Wave Speed on a Stretched String
  problem: Use the labeled model to derive and calculate the string-wave speed from $v=\sqrt{T/\mu}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Identify the parameters of the string from the diagram. A string of mass $m$ and length $L$ is pulled taut by a tension $F_T$.
    prompt: Identify the parameters.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Mass $m$, length $L$, tension $F_T$
    explanation: 'Solution: The problem provides the total mass $m$, total length $L$, and tension $F_T$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State assumptions regarding the string.
    prompt: What is assumed about the string?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Uniform linear mass density.
    explanation: 'Solution: We assume the string has a uniform linear mass density $\mu$ along its entire length.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the target variable.
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Wave speed $v$
    explanation: 'Solution: We want to calculate the wave propagation speed $v$ on the string.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the relation for wave speed on a stretched string.
    prompt: Write the governing equation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v = \sqrt{F_T / \mu}
    explanation: 'Solution: $v = \sqrt{F_T / \mu}$ where $\mu = m/L$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Express the wave speed entirely in terms of the given variables $F_T, m, L$.
    prompt: Isolate $v$ in given terms.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v = \sqrt{F_T L / m}
    explanation: 'Solution: Substitute $\mu = m/L$ to get $v = \sqrt{\frac{F_T L}{m}}$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Given $F_T = 100.0$ N, string mass $m = 0.050$ kg, and length $L = 2.0$ m, calculate the speed $v$.
    prompt: Calculate wave speed.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      value: 63.2
      tolerance: 0.5
    explanation: 'Solution: $v = \sqrt{\frac{100.0 \times 2.0}{0.050}} = \sqrt{\frac{200}{0.05}} = \sqrt{4000} \approx 63.2$ m/s.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of $\sqrt{F_T L / m}$.
    prompt: What are the units?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - m/s
    explanation: 'Solution: $\sqrt{(\text{N}\cdot\text{m})/\text{kg}} = \sqrt{(\text{kg}\cdot\text{m}^2/\text{s}^2)/\text{kg}} = \text{m/s}$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated wave speed.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/stretched-string-wave-speed.svg
      alt: Labeled original schematic for Wave Speed on a Stretched String used for quantitative analysis.
      caption: Wave Speed on a Stretched String model diagram.
    answer:
      value: 63.2
      tolerance: 0.5
    explanation: 'Solution: The wave speed is $63.2$ m/s.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
