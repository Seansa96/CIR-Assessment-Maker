  prompt: 'Suppose $S_n=n/(n+1)$ for every n. Which description of the associated

    series is correct?

    '
  choices:
  - id: a
    text: |-
      $a_1=1/2$, $a_n=1/[n(n+1)]$ for $n\ge2$, and the sum is $1$
  - id: b
    text: $a_n=n/(n+1)$ and the sum is $1$
  - id: c
    text: $a_n=1/(n+1)$ and the series diverges
  - id: d
    text: $a_n=-1/[n(n+1)]$ and the sum is $0$
  answer:
    choiceId: a
  explanation: |-
    Solution: The first term equals S one, later terms are adjacent differences, and the partial-sum limit is one. Therefore the answer is $a_1=1/2$, $a_n=1/[n(n+1)]$ for $n\ge2$, and the sum is $1$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

