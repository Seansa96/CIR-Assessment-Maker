    choiceId: a
  explanation: 'Solution: Half of a long initial list of partial sums are zero and half are one, so the Cesàro means approach one half even though ordinary convergence fails. Therefore the answer is $1/2$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


