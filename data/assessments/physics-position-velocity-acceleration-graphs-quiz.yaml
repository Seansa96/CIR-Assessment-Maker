    choices:
      - id: a
        text: "Matching velocity and acceleration"
        media:
          - type: image
            src: /assessments/physics-graphs/set-c-velocity.svg
            alt: Set C velocity jumps from negative to positive and is undefined at the corner
          - type: image
            src: /assessments/physics-graphs/set-c-acceleration.svg
            alt: Set C acceleration is zero except undefined at the corner
      - id: b
        text: "Smooth parabolic pair"
        media:
          - type: image
            src: /assessments/physics-graphs/set-a-velocity.svg
            alt: Set A increasing velocity graph
          - type: image
            src: /assessments/physics-graphs/set-a-acceleration.svg
            alt: Set A positive acceleration graph
