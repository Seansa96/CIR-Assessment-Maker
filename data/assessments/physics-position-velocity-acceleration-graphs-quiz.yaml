schemaVersion: 1
id: physics-position-velocity-acceleration-graphs-quiz
title: Position, Velocity, and Acceleration Graph Matching Quiz
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
  - physics-motion-1d
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: "Given the position graph, choose the matching velocity and acceleration graphs."
    media:
      - type: image
        src: /assessments/physics-graphs/set-a-position.svg
        alt: Set A concave-up parabolic position graph
    choices:
      - id: a
        text: "Matching velocity and acceleration"
        media:
          - type: image
            src: /assessments/physics-graphs/set-a-velocity.svg
            alt: Set A increasing linear velocity graph
          - type: image
            src: /assessments/physics-graphs/set-a-acceleration.svg
            alt: Set A positive constant acceleration graph
      - id: b
        text: "Velocity and acceleration from a straight-line position"
        media:
          - type: image
            src: /assessments/physics-graphs/set-g-velocity.svg
            alt: Set G positive constant velocity graph
          - type: image
            src: /assessments/physics-graphs/set-g-acceleration.svg
            alt: Set G zero acceleration graph
      - id: c
        text: "Velocity and acceleration from a concave-down position"
        media:
          - type: image
            src: /assessments/physics-graphs/set-h-velocity.svg
            alt: Set H decreasing linear velocity graph
          - type: image
            src: /assessments/physics-graphs/set-h-acceleration.svg
            alt: Set H negative constant acceleration graph
      - id: d
        text: "Velocity and acceleration from a cornered position"
        media:
          - type: image
            src: /assessments/physics-graphs/set-c-velocity.svg
            alt: Set C step velocity graph
          - type: image
            src: /assessments/physics-graphs/set-c-acceleration.svg
            alt: Set C zero acceleration with undefined corner
    answer:
      choiceId: a
    explanation: "The position graph is a concave-up parabola, so velocity is an increasing line and acceleration is positive constant. Related topic: quadratic position under constant acceleration."

