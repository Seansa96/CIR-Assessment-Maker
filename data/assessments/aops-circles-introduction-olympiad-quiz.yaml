questions:
- id: olympiad-quiz-q131
  type: multipleChoice
  prompt: Tangents $PA,PB$ are drawn to a circle with center $O$. If $OP=2r$, where $r$ is the radius, find $\angle APB$.
  media:
  - {type: image, src: /assessments/aops/aops-circles-tangent.svg, alt: Radius to a tangent point forming a right triangle with the center and external point.}
  choices:
  - {id: a, text: '$30^\circ$'}
  - {id: b, text: '$60^\circ$'}
  - {id: c, text: '$90^\circ$'}
  - {id: d, text: '$120^\circ$'}
  answer: {choiceId: b}
  explanation: In right triangle $OAP$, $OA/OP=1/2$, so $\angle OPA=30^\circ$. Congruence makes $OP$ bisect $\angle APB$, giving $60^\circ$.
- id: olympiad-quiz-q111
  type: multipleChoice
  prompt: A radius-10 circle contains parallel chords of lengths $12$ and $16$ on opposite sides of the center. Find the distance between the chords.
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$8$'}
  - {id: c, text: '$14$'}
  - {id: d, text: '$20$'}
  answer: {choiceId: c}
  explanation: Their center distances are $\sqrt{100-6^2}=8$ and $\sqrt{100-8^2}=6$; opposite sides make the separation $14$.
- id: olympiad-quiz-q141
  type: multipleChoice
  prompt: A square of side $10$ is inscribed in a circle. Find the circle's area.
  choices:
  - {id: a, text: '$25\pi$'}
  - {id: b, text: '$50\pi$'}
  - {id: c, text: '$100\pi$'}
  - {id: d, text: '$200\pi$'}
  answer: {choiceId: b}
  explanation: The square diagonal $10\sqrt2$ is the diameter, so $r=5\sqrt2$ and area is $50\pi$.
- id: olympiad-quiz-q121
  type: multipleChoice
  prompt: A circle is inscribed in a square of side $10$. What fraction of the square's area lies inside the circle?
  choices:
  - {id: a, text: '$\pi/8$'}
  - {id: b, text: '$\pi/4$'}
  - {id: c, text: '$\pi/2$'}
  - {id: d, text: '$4/\pi$'}
  answer: {choiceId: b}
  explanation: The radius is $5$, so the area ratio is $25\pi/100=\pi/4$.
- id: olympiad-quiz-q101
  type: multipleChoice
  prompt: Two radius-6 circles have centers $6$ units apart. Find the length of their common chord.
  choices:
  - {id: a, text: '$3\sqrt3$'}
  - {id: b, text: '$6$'}
  - {id: c, text: '$6\sqrt3$'}
  - {id: d, text: '$12$'}
  answer: {choiceId: c}
  explanation: The common chord is perpendicular to and bisects the center segment. Its half-length is $\sqrt{6^2-3^2}=3\sqrt3$.
- id: olympiad-quiz-q132
  type: multipleChoice
  prompt: For a nonzero central angle, a sector's numerical area equals its arc length when measured in compatible units. What is the circle's radius?
  choices:
  - {id: a, text: '$1$'}
  - {id: b, text: '$2$'}
  - {id: c, text: '$\pi$'}
  - {id: d, text: '$4$'}
  answer: {choiceId: b}
  explanation: Cancelling the common angular fraction from $\pi r^2$ and $2\pi r$ gives $r=2$ for positive radius.
- id: olympiad-quiz-q112
  type: multipleChoice
  prompt: An annulus has the same area as its inner disk. If the inner radius is $r$, what is the outer radius?
  choices:
  - {id: a, text: '$\sqrt2r$'}
  - {id: b, text: '$2r$'}
  - {id: c, text: '$3r/2$'}
  - {id: d, text: '$r^2$'}
  answer: {choiceId: a}
  explanation: $\pi(R^2-r^2)=\pi r^2$ gives $R^2=2r^2$.
- id: olympiad-quiz-q142
  type: multipleChoice
  prompt: A chord of a radius-10 circle has length $10$. Find the area of the minor circular segment cut off by the chord.
  choices:
  - {id: a, text: '$50\pi/3-25\sqrt3$'}
  - {id: b, text: '$50\pi/3+25\sqrt3$'}
  - {id: c, text: '$25\pi-50$'}
  - {id: d, text: '$100\pi/3$'}
  answer: {choiceId: a}
  explanation: The radii and chord form an equilateral triangle, so subtract triangle area $25\sqrt3$ from the $60^\circ$ sector area $50\pi/3$.
- id: olympiad-quiz-q122
  type: multipleChoice
  prompt: In right triangle $OPT$, $PT$ is tangent to a radius-5 circle and $OP=13$. Find the triangle's perimeter.
  choices:
  - {id: a, text: '$25$'}
  - {id: b, text: '$30$'}
  - {id: c, text: '$36$'}
  - {id: d, text: '$42$'}
  answer: {choiceId: b}
  explanation: $PT=12$ by the $5$-$12$-$13$ triangle, so perimeter is $5+12+13=30$.
- id: olympiad-quiz-q102
  type: multipleChoice
  prompt: Tangents $PA,PB$ have length $6$ and form $\angle APB=60^\circ$. Find the circle's radius.
  choices:
  - {id: a, text: '$2\sqrt3$'}
  - {id: b, text: '$3$'}
  - {id: c, text: '$3\sqrt3$'}
  - {id: d, text: '$6\sqrt3$'}
  answer: {choiceId: a}
  explanation: $OP$ bisects the tangent angle, so right triangle $OAP$ is $30$-$60$-$90$. Since $AP=r\sqrt3=6$, $r=2\sqrt3$.
- id: olympiad-quiz-q133
  type: multipleChoice
  prompt: A circle centered at the origin passes through $A=(3,4)$. Which equation is the tangent line at $A$?
  choices:
  - {id: a, text: '$3x+4y=25$'}
  - {id: b, text: '$4x+3y=25$'}
  - {id: c, text: '$3x-4y=0$'}
  - {id: d, text: '$x+y=7$'}
  answer: {choiceId: a}
  explanation: Radius vector $(3,4)$ is normal to the tangent, and the line through $(3,4)$ is $3x+4y=25$.
- id: olympiad-quiz-q113
  type: multipleChoice
  prompt: A circle of radius $r$ is inscribed in a square. What is the square's perimeter?
  choices:
  - {id: a, text: '$2r$'}
  - {id: b, text: '$4r$'}
  - {id: c, text: '$8r$'}
  - {id: d, text: '$4\pi r$'}
  answer: {choiceId: c}
  explanation: The square side equals the circle diameter $2r$, so perimeter is $8r$.
- id: olympiad-quiz-q143
  type: selectAll
  prompt: Which conclusions follow when two distinct circles of equal radius intersect at $A$ and $B$?
  choices:
  - {id: a, text: The line joining the centers is perpendicular to $AB$.}
  - {id: b, text: The line joining the centers bisects $AB$.}
  - {id: c, text: '$A$ and $B$ are equidistant from both centers.'}
  - {id: d, text: The center distance must equal the radius.}
  answer:
    choiceIds: [a, b, c]
  explanation: The four equal radii form a kite; the center distance can vary from above zero to below twice the radius.
- id: olympiad-quiz-q123
  type: selectAll
  prompt: Which statements can be proved using only the triangle inequality and equal radii?
  choices:
  - {id: a, text: Every chord has length at most the diameter.}
  - {id: b, text: A chord reaches diameter length exactly when it passes through the center.}
  - {id: c, text: Every chord is perpendicular to a radius.}
  - {id: d, text: A diameter is a longest chord.}
  answer:
    choiceIds: [a, b, d]
  explanation: For chord $AB$, $AB\le AO+OB=2r$, with equality exactly when $O$ lies on $AB$.
- id: olympiad-quiz-q103
  type: freeResponse
  prompt: Prove that the common chord of two intersecting circles is perpendicular to the line joining their centers and is bisected by that line.
  answer:
    gradingMode: selfCheck
    expected: |-
      Let the circles have centers $O_1,O_2$ and common points $A,B$. Since $O_1A=O_1B$ and $O_2A=O_2B$, both centers are equidistant from $A,B$. Therefore both lie on the perpendicular bisector of $AB$. The line $O_1O_2$ is that perpendicular bisector, so it is perpendicular to $AB$ and passes through its midpoint.
    keyPoints:
    - Uses equal radii from each center to $A,B$.
    - Recognizes the locus of points equidistant from $A,B$.
    - Places both centers on the perpendicular bisector.
    - Concludes perpendicularity and bisection.
  explanation: The proof converts equal-radius facts into a perpendicular-bisector locus.
