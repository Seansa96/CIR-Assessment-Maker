- id: q001
  type: freeResponse
  skills:
  - physics2-ch10-modeling
  prompt: A Direct-Current Circuits situation emphasizes circuit variables. Define the system and sign convention,
    state when $\\sum I=0$ applies, and construct a written solution that includes the relation, units, assumptions,
    and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $\\sum I=0$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Direct-Current Circuits model of network constraints in DC circuits is reliable only when
    its relation, conditions, and interpretation are kept together.'
