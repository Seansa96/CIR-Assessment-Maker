questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - multi-step
  prompt: A fully charged capacitor with capacitance $2.0\text{ }\mu\text{F}$ is discharged through a
    $4.0\text{ k}\Omega$ resistor. How long does it take for the charge to drop to $36.8\%$ of its initial
    value (in milliseconds)?
  answer:
    tolerance: 0.1
    value: 8.0
  explanation: 'Solution:

    1) Dropping to $1/e \approx 36.8\%$ happens exactly at $t = \tau$.

    2) $\tau = RC$.

    3) $R = 4.0 \times 10^3\text{ }\Omega$, $C = 2.0 \times 10^{-6}\text{ F}$.

    4) $\tau = (4.0 \times 10^3)(2.0 \times 10^{-6}) = 8.0 \times 10^{-3}\text{ s} = 8.0\text{ ms}$.


    Why it works:

    The time constant of an RC circuit dictates the exponential decay rate. At one time constant, $e^{-1}
    \approx 0.368$.'
