workedExamples:
  - id: ss-we-1
    title: Molarity to Moles to Requested Quantity
    problem: 'How many grams of AgCl (143.32 g/mol) will precipitate if 50.0 mL of 0.200 M AgNO3 reacts with excess NaCl?'
    steps:
      - { id: ssw-01, title: Find moles of AgNO3, instruction: 'Calculate the moles of the given reactant.', type: numericResponse, prompt: 'How many moles of AgNO3 are present?', answer: { value: 0.010, tolerance: 0.0001 }, explanation: 'Solution: 0.0500 L * 0.200 mol/L = 0.0100 mol. Why it works: Moles = Volume * Molarity. Common trap: Forgetting to convert mL to L.' }
      - { id: ssw-02, title: Use stoichiometric ratio, instruction: 'Convert moles of reactant to moles of product.', type: numericResponse, prompt: 'How many moles of AgCl form?', answer: { value: 0.010, tolerance: 0.0001 }, explanation: 'Solution: 0.0100 mol. Why it works: The reaction is 1:1. AgNO3 + NaCl -> AgCl + NaNO3. Common trap: Using the wrong ratio.' }
      - { id: ssw-03, title: Convert to mass, instruction: 'Calculate the mass of the precipitate.', type: numericResponse, prompt: 'What is the mass of AgCl in grams?', answer: { value: 1.43, tolerance: 0.01 }, explanation: 'Solution: 0.0100 mol * 143.32 g/mol = 1.433 g. Why it works: Mass = Moles * Molar Mass. Common trap: Dividing by molar mass instead.' }
  - id: ss-we-2
    title: Solution Limiting Reactant
    problem: 'What is the maximum mass of BaSO4 (233.39 g/mol) that can form when 40.0 mL of 0.150 M BaCl2 is mixed with 60.0 mL of 0.120 M Na2SO4?'
    steps:
      - { id: ssw-04, title: Calculate moles of BaCl2, instruction: 'Find the moles of the first reactant.', type: numericResponse, prompt: 'How many moles of BaCl2 are available?', answer: { value: 0.006, tolerance: 0.0001 }, explanation: 'Solution: 0.0400 L * 0.150 mol/L = 0.00600 mol BaCl2. Why it works: Moles = Volume * Molarity.' }
      - { id: ssw-05, title: Calculate moles of Na2SO4, instruction: 'Find the moles of the second reactant.', type: numericResponse, prompt: 'How many moles of Na2SO4 are available?', answer: { value: 0.0072, tolerance: 0.0001 }, explanation: 'Solution: 0.0600 L * 0.120 mol/L = 0.00720 mol Na2SO4. Why it works: Moles = Volume * Molarity.' }
      - { id: ssw-06, title: Identify limiting reactant and yield, instruction: 'Determine which reactant limits the product and calculate mass.', type: numericResponse, prompt: 'What mass of BaSO4 is formed in grams?', answer: { value: 1.40, tolerance: 0.02 }, explanation: 'Solution: BaCl2 limits (0.00600 mol < 0.00720 mol) in a 1:1 reaction. Yield = 0.00600 mol * 233.39 g/mol = 1.40 g. Why it works: The smaller number of moles determines the maximum product. Common trap: Just adding the moles together.' }
  - id: ss-we-3
    title: Finding Concentration of Excess Ion
    problem: 'After the reaction in the previous problem is complete, what is the concentration of the excess sulfate ion?'
    steps:
      - { id: ssw-07, title: Find excess moles, instruction: 'Calculate the remaining moles of sulfate.', type: numericResponse, prompt: 'How many moles of sulfate remain unreacted?', answer: { value: 0.0012, tolerance: 0.0001 }, explanation: 'Solution: 0.00720 - 0.00600 = 0.00120 mol. Why it works: Subtract reacted moles from initial moles.' }
      - { id: ssw-08, title: Calculate total volume, instruction: 'Find the new volume of the mixture.', type: numericResponse, prompt: 'What is the total volume of the solution in L?', answer: { value: 0.100, tolerance: 0.001 }, explanation: 'Solution: 40.0 mL + 60.0 mL = 100.0 mL = 0.100 L. Why it works: Volumes are additive in dilute solutions. Common trap: Using only one of the original volumes.' }
      - { id: ssw-09, title: Calculate final concentration, instruction: 'Determine the new molarity.', type: numericResponse, prompt: 'What is the molarity of sulfate?', answer: { value: 0.012, tolerance: 0.001 }, explanation: 'Solution: 0.00120 mol / 0.100 L = 0.0120 M. Why it works: Molarity = moles / total volume. Common trap: Forgetting to use the total volume.' }
