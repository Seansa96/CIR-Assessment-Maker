    text: '3'
  - id: b
    text: Skip directly to a final answer
    issueSignals:
    - id: vector-component-resolution-error
  - id: c
    text: Use an unrelated theorem
    issueSignals:
    - id: vector-component-resolution-error
  - id: d
    text: Reverse the givens
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: vector-component-resolution-error
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Find magnitude is the first step because it identifies the governing representation.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Right Triangle Trigonometry.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
