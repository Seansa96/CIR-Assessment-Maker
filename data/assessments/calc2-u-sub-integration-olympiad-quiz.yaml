- id: q001
  type: freeResponse
  skills:
  - u-sub-integration
  - olympiad-problem-solving
  prompt: Evaluate $\int_0^1 \frac{6x}{x^2+3}\,dx$.
  answer:
    gradingMode: selfCheck
    expected: $3\ln\!\left(1+\frac1{3}\right)$.
    keyPoints:
    - 'Matches the reference result: $3\ln\!\left(1+\frac1{3}\right)$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: Let $u=x^2+3$, so $du=2x\,dx$. The bounds become $3$ and $4$, giving $3\int_3^4du/u=3\ln((k+1)/3)$.
