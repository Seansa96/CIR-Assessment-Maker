schemaVersion: 1
id: physics-work-kinetic-energy-recall
title: Work and Kinetic Energy Recall Drill
assessmentType: recallDrill
categoryId: physics-1
subcategoryIds:
- physics-work-energy
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What is the SI unit of Work and Energy?
  answer:
    expected: Joule
    aliases:
    - J
    - joules
- id: r002
  type: flashcard
  prompt: State the Work-Kinetic Energy Theorem.
  answer:
    expected: The net work done on an object by all forces equals the change in the
      object's kinetic energy ($W_{net} = \Delta K$).
- id: r003
  type: flashcard
  prompt: How do you calculate work from a Force vs. Position graph?
  answer:
    expected: Work is the area under the curve of the Force vs. Position graph ($W
      = \int F dx$).
- id: r004
  type: typed
  prompt: What is the equation for kinetic energy?
  answer:
    expected: 1/2*m*v^2
    aliases:
    - 1/2mv^2
    - 0.5*m*v^2
    - (1/2)mv^2
- id: r005
  type: flashcard
  prompt: What is the definition of power, and what is its equation in terms of force
    and velocity?
  answer:
    expected: Power is the rate at which work is done. $P = dW/dt$ or $P = \vec{F}
      \cdot \vec{v}$.
- id: r006
  type: typed
  prompt: If a force is applied perpendicular to the direction of motion,\rhow much
    work does it do?
  answer:
    expected: 0
    aliases:
    - zero
    - 0 J
    - zero joules
