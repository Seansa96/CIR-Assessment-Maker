id: physics2-ch15-ac-circuits-glossary
title: AC Circuits Glossary
assessmentType: glossary
categoryId: physics-2
topicId: physics2-ac-circuits
glossary:
  introduction: Core terms for AC circuits.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of impedance and transformers.
    entries:
    - id: t1
      term: Impedance (Z)
      definition: The total opposition to current flow in an AC circuit, measured
        in Ohms.
    - id: t2
      term: Resonance
      definition: The condition in an RLC circuit where inductive and capacitive reactances
        are equal, leading to minimum impedance.
    - id: t3
      term: Power Factor
      definition: The cosine of the phase angle ($\cos\phi$), representing the ratio
        of real power to apparent power.
