items:
- id: param-first-deriv
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    For a parametric curve defined by $x=f(t)$ and $y=g(t)$, what is the formula for the first derivative $\frac{dy}{dx}$?
  answer:
    expected: |
      $$
      \frac{dy}{dx} = \frac{\frac{dy}{dt}}{\frac{dx}{dt}}
      $$
  explanation: |
    This follows from the chain rule: $\frac{dy}{dt} = \frac{dy}{dx} \cdot \frac{dx}{dt}$.

- id: param-second-deriv
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    For a parametric curve defined by $x=f(t)$ and $y=g(t)$, what is the formula for the second derivative $\frac{d^2y}{dx^2}$?
  answer:
    expected: |
      $$
      \frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}}
      $$
  explanation: |
    You differentiate the first derivative with respect to $t$, and then divide by $\frac{dx}{dt}$ again.

- id: param-horizontal-tangent
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    For a smooth parametric curve $x(t), y(t)$, what is the condition for a **horizontal tangent**?
  answer:
    expected: |
      $$
      \frac{dy}{dt} = 0 \text{ and } \frac{dx}{dt} \neq 0
      $$
  explanation: |
    The tangent is horizontal when the vertical rate of change is zero but the curve is still moving horizontally.

- id: param-vertical-tangent
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    For a smooth parametric curve $x(t), y(t)$, what is the condition for a **vertical tangent**?
  answer:
    expected: |
      $$
      \frac{dx}{dt} = 0 \text{ and } \frac{dy}{dt} \neq 0
      $$
  explanation: |
    The tangent is vertical when the horizontal rate of change is zero but the curve is still moving vertically.

- id: param-arc-length
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    What is the formula for the **arc length** $L$ of a parametric curve $x(t), y(t)$ from $t=\alpha$ to $t=\beta$?
  answer:
    expected: |
      $$
      L = \int_{\alpha}^{\beta} \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \, dt
      $$

- id: param-speed
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    If $x(t)$ and $y(t)$ represent the position of a particle at time $t$, what is the formula for the **speed** of the particle?
  answer:
    expected: |
      $$
      \text{Speed} = \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2}
      $$
  explanation: |
    Speed is the magnitude of the velocity vector $\langle x'(t), y'(t) \rangle$.

- id: param-surface-area-x
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    What is the formula for the **surface area** generated by revolving a parametric curve $x(t), y(t)$ (where $y(t) \geq 0$) about the **x-axis** from $t=\alpha$ to $t=\beta$?
  answer:
    expected: |
      $$
      S = \int_{\alpha}^{\beta} 2\pi y(t) \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \, dt
      $$

- id: param-surface-area-y
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    What is the formula for the **surface area** generated by revolving a parametric curve $x(t), y(t)$ (where $x(t) \geq 0$) about the **y-axis** from $t=\alpha$ to $t=\beta$?
  answer:
    expected: |
      $$
      S = \int_{\alpha}^{\beta} 2\pi x(t) \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \, dt
      $$

- id: param-circle
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    What are the standard parametric equations for a **circle** of radius $r$ centered at the origin, oriented counterclockwise?
  answer:
    expected: |
      $$
      x = r\cos(t), \quad y = r\sin(t)
      $$
      for $0 \leq t \leq 2\pi$.

- id: param-ellipse
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    What are the standard parametric equations for an **ellipse** $\frac{x^2}{a^2} + \frac{y^2}{b^2} = 1$?
  answer:
    expected: |
      $$
      x = a\cos(t), \quad y = b\sin(t)
      $$
      for $0 \leq t \leq 2\pi$.

- id: param-line-segment
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    What is the standard parameterization for a **line segment** starting at $(x_0, y_0)$ and ending at $(x_1, y_1)$ for $0 \leq t \leq 1$?
  answer:
    expected: |
      $$
      x = x_0 + (x_1 - x_0)t, \quad y = y_0 + (y_1 - y_0)t
      $$

- id: param-eliminate-parameter
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    If $x = t + 1$ and $y = t^2$, what is the Cartesian equation (in terms of $x$ and $y$) after eliminating the parameter?
  answer:
    expected: |
      $$
      y = (x - 1)^2
      $$
  explanation: |
    Solve for $t$: $t = x - 1$. Substitute into $y$: $y = (x - 1)^2$.

- id: param-concavity
  type: flashcard
  skills:
  - parametric-curves-basics
  prompt: |
    ![Visual Aid](/assessments/calc2-parametric-polar/parametric_curves_demo.svg)

    For a parametric curve, what determines whether it is **concave up**?
  answer:
    expected: |
      The curve is concave up when the second derivative $\frac{d^2y}{dx^2} > 0$.
