- id: molecular-formula-determination
  title: Complete Molecular Formula Determination
  problem: '**Problem A: First Unknown Compound**

    A compound contains 85.6% carbon and 14.4% hydrogen by mass. Its molar mass is determined by mass spectrometry to be 84.2 g/mol. Find the molecular formula.


    **Problem B: Second Unknown Compound**

    A different compound contains 92.3% carbon and 7.7% hydrogen by mass. Its molar mass is determined to be 78.1 g/mol. Find the molecular formula.


    (C = 12.011, H = 1.008 g/mol)

    '
  steps:
  - id: step-molecular-formula-determination-1
    title: 'Problem A: Step 1 — Find the empirical formula'
    type: symbolicResponse
    answer:
      expectedLatex: C*H^2
      equivalenceMode: expression
      tolerance: 0
    prompt: Enter the empirical formula for Problem A using element symbols and multiplication.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Assume 100 g, convert each percentage to moles, and reduce the ratio.
  - id: step-molecular-formula-determination-2
    title: 'Problem A: Step 2 — Find the molecular formula'
    type: symbolicResponse
    answer:
      expectedLatex: C^6*H^12
      equivalenceMode: expression
      tolerance: 0
    prompt: Enter the molecular formula for Problem A using element symbols and multiplication.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Divide the given molar mass by the empirical-formula mass, then multiply all empirical subscripts by that integer.
  - id: step-molecular-formula-determination-3
    title: 'Problem B: Step 1 — Find the empirical formula'
    type: symbolicResponse
    answer:
      expectedLatex: C*H
      equivalenceMode: expression
      tolerance: 0
    prompt: Enter the empirical formula for Problem B using element symbols and multiplication.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Assume 100 g, convert each element to moles, and reduce the ratio.
  - id: step-molecular-formula-determination-4
    title: 'Problem B: Step 2 — Find the molecular formula'
    type: symbolicResponse
    answer:
      expectedLatex: C^6*H^6
      equivalenceMode: expression
      tolerance: 0
    prompt: Enter the molecular formula for Problem B using element symbols and multiplication.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use the molar-mass-to-empirical-formula-mass multiplier on both subscripts.
  check:
    id: molecular-check
    type: symbolicResponse
    prompt: Enter the molecular formula using element symbols and multiplication.
    answer:
      expectedLatex: C^6*H^6
      equivalenceMode: expression
      tolerance: 0
    hint: Find the empirical formula first, then use the molar-mass multiplier.
    explanation: 'Solution:

      Convert the percentages to the 1:1 empirical ratio, find the empirical-formula mass, and use the molar-mass multiplier to scale both subscripts.


      Why it works:

      The molecular formula is an integer multiple of the empirical formula.'
