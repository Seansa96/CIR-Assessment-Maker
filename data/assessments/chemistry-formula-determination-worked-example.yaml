  check:
    id: combustion-check
    type: multipleChoice
    prompt: 'The empirical formula CH2O is also the empirical formula of acetic acid (C2H4O2), glycolaldehyde (C2H4O2), and glucose (C6H12O6). What additional piece of data do you need to distinguish between them?

      '
    choices:
    - id: a
      text: The molar mass of the compound.
    - id: b
      text: The density of the compound.
      issueSignals:
      - id: molar-mass-calculation-error
        domains:
        - chemistry
    - id: c
      text: The color of the compound.
      issueSignals:
      - id: molar-mass-calculation-error
        domains:
        - chemistry
    - id: d
      text: The boiling point of the compound.
      issueSignals:
      - id: molar-mass-calculation-error
        domains:
        - chemistry
    answer:
      choiceId: a
    explanation: 'Solution:

      Solution:

      Solution:

      Solution:

      The molar mass allows you to calculate the multiplier n = M(compound) / M(empirical), which gives the molecular formula. Density, color, and boiling point do not provide this information directly.


      Why it works:

      Conservation of atoms links combustion products to the original compound; mole ratios reveal the simplest formula.


      Why the other choices fail:

      They either reverse the stoichiometric comparison, ignore coefficients, or name a product instead of a reactant.


