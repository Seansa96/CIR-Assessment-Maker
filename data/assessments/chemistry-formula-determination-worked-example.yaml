- id: empirical-from-combustion
  title: Empirical Formula from Combustion Analysis
  problem: |
    **Problem A: Small Sample**
    A 1.000 g sample of an organic compound (containing only C, H, and O) is burned in excess oxygen. The combustion produces 1.466 g of CO2 and 0.600 g of H2O. Determine the empirical formula.

    **Problem B: Scaled Sample**
    A 10.000 g sample of the same compound is burned in excess oxygen. The combustion produces 14.66 g of CO2 and 6.00 g of H2O. Determine the empirical formula.

    Use: C = 12.011, H = 1.008, O = 15.999 g/mol.
  steps:
  - id: step-empirical-from-combustion-1
    title: 'Problem A: Step 1 — Find grams of C from CO2'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'All carbon in the sample ends up in CO2.


      $$

      g\text{ C} = 1.466 \text{ g CO}_2 \times \frac{12.011 \text{ g C}}{44.009 \text{
      g CO}_2} = 0.4000 \text{ g C}

      $$

      '
  - id: step-empirical-from-combustion-2
    title: 'Problem A: Step 2 — Find grams of H from H2O'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'All hydrogen ends up in H2O.


      $$

      g\text{ H} = 0.600 \text{ g H}_2\text{O} \times \frac{2(1.008) \text{ g H}}{18.015
      \text{ g H}_2\text{O}} = 0.0671 \text{ g H}

      $$

      '
  - id: step-empirical-from-combustion-3
    title: 'Problem A: Step 3 — Find grams of O by difference'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      g\text{ O} = 1.000 - 0.4000 - 0.0671 = 0.5329 \text{ g O}

      $$

      '
  - id: step-empirical-from-combustion-4
    title: 'Problem A: Step 4 — Convert all masses to moles'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      n_C = \frac{0.4000}{12.011} = 0.03330 \text{ mol}

      $$

      $$

      n_H = \frac{0.0671}{1.008} = 0.06657 \text{ mol}

      $$

      $$

      n_O = \frac{0.5329}{15.999} = 0.03331 \text{ mol}

      $$

      '
  - id: step-empirical-from-combustion-5
    title: 'Problem A: Step 5 — Divide by smallest mole value'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Smallest value: 0.03330 mol (C and O are essentially equal)

      $$
      C: \frac{0.03330}{0.03330} = 1.000 \approx 1
      $$
      $$
      H: \frac{0.06657}{0.03330} = 1.999 \approx 2
      $$
      $$
      O: \frac{0.03331}{0.03330} = 1.000 \approx 1
      $$

      **Empirical formula: CH2O**

      ![Visual representation of small sample combustion analysis](/media/placeholders/combustion-empirical-small.svg)
  - id: step-empirical-from-combustion-6
    title: 'Problem B: Step 1 — Find grams of C from CO2'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      All carbon in the sample ends up in CO2.
      $$
      g\text{ C} = 14.66 \text{ g CO}_2 \times \frac{12.011 \text{ g C}}{44.009 \text{ g CO}_2} = 4.000 \text{ g C}
      $$
  - id: step-empirical-from-combustion-7
    title: 'Problem B: Step 2 — Find grams of H from H2O'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      All hydrogen ends up in H2O.
      $$
      g\text{ H} = 6.00 \text{ g H}_2\text{O} \times \frac{2(1.008) \text{ g H}}{18.015 \text{ g H}_2\text{O}} = 0.671 \text{ g H}
      $$
  - id: step-empirical-from-combustion-8
    title: 'Problem B: Step 3 — Find grams of O by difference'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      g\text{ O} = 10.000 - 4.000 - 0.671 = 5.329 \text{ g O}
      $$
  - id: step-empirical-from-combustion-9
    title: 'Problem B: Step 4 — Convert all masses to moles'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      n_C = \frac{4.000}{12.011} = 0.3330 \text{ mol}
      $$
      $$
      n_H = \frac{0.671}{1.008} = 0.6657 \text{ mol}
      $$
      $$
      n_O = \frac{5.329}{15.999} = 0.3331 \text{ mol}
      $$
  - id: step-empirical-from-combustion-10
    title: 'Problem B: Step 5 — Divide by smallest mole value'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Smallest value: 0.3330 mol (C and O are essentially equal)

      $$
      C: \frac{0.3330}{0.3330} = 1.000 \approx 1
      $$
      $$
      H: \frac{0.6657}{0.3330} = 1.999 \approx 2
      $$
      $$
      O: \frac{0.3331}{0.3330} = 1.000 \approx 1
      $$

      **Empirical formula: CH2O**

      ![Visual representation of scaled sample combustion analysis](/media/placeholders/combustion-empirical-scaled.svg)
  check:
    id: combustion-check
    type: multipleChoice
    prompt: 'The empirical formula CH2O is also the empirical formula of acetic acid
      (C2H4O2), glycolaldehyde (C2H4O2), and glucose (C6H12O6). What additional piece
      of data do you need to distinguish between them?

      '
    choices:
    - id: a
      text: The molar mass of the compound.
    - id: b
      text: The density of the compound.
    - id: c
      text: The color of the compound.
    - id: d
      text: The boiling point of the compound.
    answer:

      choiceId: a
    explanation: 'The molar mass allows you to calculate the multiplier n = M(compound)
      / M(empirical), which gives the molecular formula. Density, color, and boiling
      point do not provide this information directly.

      '
- id: molecular-formula-determination
  title: Complete Molecular Formula Determination
  problem: |
    **Problem A: First Unknown Compound**
    A compound contains 85.6% carbon and 14.4% hydrogen by mass. Its molar mass is determined by mass spectrometry to be 84.2 g/mol. Find the molecular formula.

    **Problem B: Second Unknown Compound**
    A different compound contains 92.3% carbon and 7.7% hydrogen by mass. Its molar mass is determined to be 78.1 g/mol. Find the molecular formula.

    (C = 12.011, H = 1.008 g/mol)
  steps:
  - id: step-molecular-formula-determination-1
    title: 'Problem A: Step 1 — Find the empirical formula'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Assume 100 g → 85.6 g C, 14.4 g H.


      $$

      n_C = \frac{85.6}{12.011} = 7.127 \text{ mol}

      $$

      $$

      n_H = \frac{14.4}{1.008} = 14.29 \text{ mol}

      $$


      Ratio: H/C = 14.29 / 7.127 = 2.005 ≈ 2


      Empirical formula: **CH2**

      '
  - id: step-molecular-formula-determination-2
    title: 'Problem A: Step 2 — Find the molecular formula'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      EFM of CH2 = 12.011 + 2(1.008) = 14.027 g/mol

      $$
      n = \frac{84.2 \text{ g/mol}}{14.027 \text{ g/mol}} = 6.00 \approx 6
      $$

      Molecular formula: **(CH2)6 = C6H12**

      This is cyclohexane — a ring of 6 carbon atoms, each bonded to 2 hydrogen atoms.

      ![Visual representation of first compound structure](/media/placeholders/formula-molecular-first.svg)
  - id: step-molecular-formula-determination-3
    title: 'Problem B: Step 1 — Find the empirical formula'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      Assume 100 g → 92.3 g C, 7.7 g H.

      $$
      n_C = \frac{92.3}{12.011} = 7.685 \text{ mol}
      $$
      $$
      n_H = \frac{7.7}{1.008} = 7.639 \text{ mol}
      $$

      Ratio: C/H = 7.685 / 7.639 = 1.006 \approx 1

      Empirical formula: **CH**
  - id: step-molecular-formula-determination-4
    title: 'Problem B: Step 2 — Find the molecular formula'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      EFM of CH = 12.011 + 1.008 = 13.019 g/mol

      $$
      n = \frac{78.1 \text{ g/mol}}{13.019 \text{ g/mol}} = 6.00 \approx 6
      $$

      Molecular formula: **(CH)6 = C6H6**

      This is benzene — a ring of 6 carbon atoms, each bonded to 1 hydrogen atom.

      ![Visual representation of second compound structure](/media/placeholders/formula-molecular-second.svg)
  check:
    id: molecular-check
    type: freeResponse
    prompt: 'A compound is 92.3% C and 7.7% H by mass. Its molar mass is 78 g/mol.
      What is the molecular formula?

      (C = 12.011, H = 1.008 g/mol)

      '
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 92.3 g C / 12.011 = 7.685 mol C; 7.7 g H / 1.008 = 7.639 mol H.
      - 'Ratio: C/H ≈ 1:1 → empirical formula CH.'
      - EFM(CH) = 12.011 + 1.008 = 13.019 g/mol.
      - n = 78 / 13.019 ≈ 6.
      - 'Molecular formula: (CH)6 = C6H6 (benzene).'
