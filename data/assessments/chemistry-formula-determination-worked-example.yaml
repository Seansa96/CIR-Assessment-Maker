- id: empirical-from-combustion
  title: Empirical Formula from Combustion Analysis
  problem: '**Problem A: Small Sample**

    A 1.000 g sample of an organic compound (containing only C, H, and O) is burned in excess oxygen. The combustion produces 1.466 g of CO2 and 0.600 g of H2O. Determine the empirical formula.


    **Problem B: Scaled Sample**

    A 10.000 g sample of the same compound is burned in excess oxygen. The combustion produces 14.66 g of CO2 and 6.00 g of H2O. Determine the empirical formula.


    Use: C = 12.011, H = 1.008, O = 15.999 g/mol.

    '
  steps:
  - id: step-empirical-from-combustion-1
    title: 'Problem A: Step 1 — Find grams of C from CO2'
    type: numericResponse
    answer:
      value: 0.4
      tolerance: 0.0002
    prompt: For Problem A, what mass of C, in grams, is represented by 1.466 g CO2? Enter four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use the carbon mass fraction in CO2.
  - id: step-empirical-from-combustion-2
    title: 'Problem A: Step 2 — Find grams of H from H2O'
    type: numericResponse
    answer:
      value: 0.0671
      tolerance: 0.0001
    prompt: For Problem A, what mass of H, in grams, is represented by 0.600 g H2O? Enter three significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use the hydrogen mass fraction in H2O.
  - id: step-empirical-from-combustion-3
    title: 'Problem A: Step 3 — Find grams of O by difference'
    type: numericResponse
    answer:
      value: 0.5329
      tolerance: 0.00026645000000000005
    prompt: For Problem A, what mass of O, in grams, remains by difference? Enter four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Subtract the C and H masses from the original sample mass.
  - id: step-empirical-from-combustion-4
    title: 'Problem A: Step 4 — Convert all masses to moles'
    type: numericResponse
    answer:
      value: 0.06657
      tolerance: 0.0001
    prompt: For Problem A, how many moles of H are present? Enter four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Divide the hydrogen mass from the preceding step by H's molar mass.
  - id: step-empirical-from-combustion-5
    title: 'Problem A: Step 5 — Divide by smallest mole value'
    type: symbolicResponse
    answer:
      expectedLatex: C*H^2*O
      equivalenceMode: expression
      tolerance: 0
    prompt: Enter Problem A's empirical formula using element symbols and multiplication (for example, C*H^2*O).
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Divide every element's mole amount by the smallest amount and use the resulting whole-number ratio.
  - id: step-empirical-from-combustion-6
    title: 'Problem B: Step 1 — Find grams of C from CO2'
