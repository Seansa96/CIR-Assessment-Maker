topicId: volumes-of-solids
modeDefault: practice
randomizeQuestions: false
skills: [cross-sectional-area, disk-method, washer-method, axis-distance]
navigation: { learningGoal: learn, activityType: glossary, tags: [calculus-2, volumes-of-solids, disks, washers] }
authoring: { visualRequirement: required, visualRationale: The vocabulary names geometric parts of a sliced solid. }
glossary:
  introduction: 'Use these names to turn a rotated region into a cross-sectional-area model before evaluating an integral.'
  sections:
    - id: terms
      title: Core cross-section vocabulary
      required: true
      content: 'The axis determines radii; radius labels determine whether a cross section is a disk or a washer.'
      entries:
        - id: cross-sectional-area
          term: Cross-sectional area
          definition: 'The area $A(x)$ or $A(y)$ of one face obtained by cutting a solid perpendicular to the accumulation direction.'
          notation: '$dV=A(x)\,dx$'
          examples: ['Area times thickness produces a volume contribution.']
          aliases: [slice area]
          media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Thin circular cross section through a solid }]
          tags: [volume, cross-section]
          drills:
            - { id: g1, type: cloze, prompt: 'For perpendicular slices with area $A(x)$, complete: $dV=A(x)\,\underline{\hspace{1.5cm}}$.', answer: { expected: 'dx', aliases: ['$dx$'] }, explanation: 'Solution: $dV=A(x)\,dx$. Why it works: A cross-sectional area multiplied by an infinitesimal thickness has cubic units. Common trap: Area alone is not volume.' }
        - id: disk
          term: Disk
          definition: 'A circular cross section with no central hole: $A=\pi R^2$.'
          notation: '$r=0$'
          examples: ['A region reaching the axis can create disks.']
          aliases: [solid circle]
          media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Filled disk cross section }]
          tags: [disk, rotation]
          drills:
            - { id: g2, type: flashcard, prompt: 'What is the defining condition of a disk?', answer: { expected: 'Its inner radius is zero.', aliases: ['r equals zero', 'r=0'] }, explanation: 'Solution: A disk has $r=0$. Why it works: Then $\pi(R^2-r^2)=\pi R^2$. Common trap: Zero outer radius would collapse the cross section.' }
        - id: washer
          term: Washer
          definition: 'An annular cross section with an outer radius $R$ and inner radius $r$: $A=\pi(R^2-r^2)$.'
          notation: '$\pi(R^2-r^2)$'
          examples: ['A gap between the axis and region creates a washer.']
          aliases: [annulus]
          media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Washer cross section with central hole }]
          tags: [washer, rotation]
          drills:
            - { id: g3, type: cloze, prompt: 'A washer cross-sectional area is $\pi(____^2-r^2)$.', answer: { expected: R, aliases: [outer radius, outer] }, explanation: 'Solution: The missing symbol is $R$, the outer radius. Why it works: A washer is outer circular area minus inner circular area. Common trap: Do not square $R-r$.' }
