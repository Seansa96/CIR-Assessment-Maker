questions:
- type: multipleChoice
  prompt: A team is working on telemetry on a low-memory device. What should it identify first?
  choices:
  - id: a
    text: The dominant operation and resource constraint
  - id: b
    text: The shortest implementation
  - id: c
    text: The newest algorithm
  - id: d
    text: The largest possible class hierarchy
  answer:
    choiceId: a
  explanation: The dominant operation and resource constraint. This follows the module's purpose and tradeoffs.
  id: q001
- type: multipleChoice
  prompt: What is the purpose of an invariant?
  choices:
  - id: a
    text: To state what every valid update must preserve
  - id: b
    text: To replace tests
  - id: c
    text: To remove memory limits
  - id: d
    text: To guarantee O(1) cost
  answer:
    choiceId: a
  explanation: To state what every valid update must preserve. This follows the module's purpose and tradeoffs.
  id: q002
- type: multipleChoice
  prompt: Which activity is most closely associated with Range, Bit, and Resource-Constrained Techniques?
  choices:
  - id: a
    text: a fixed C++ ring buffer
  - id: b
    text: Ignoring input order
  - id: c
    text: Allocating without bounds
  - id: d
    text: Replacing every library call
  answer:
    choiceId: a
  explanation: a fixed C++ ring buffer. This follows the module's purpose and tradeoffs.
  id: q003
- type: multipleChoice
  prompt: A representative operation is O(1). What should you still do before optimizing production code?
  choices:
  - id: a
    text: Measure with production-shaped inputs
  - id: b
    text: Assume elapsed time is fixed
  - id: c
    text: Ignore memory allocation
  - id: d
    text: Replace every loop with recursion
  answer:
    choiceId: a
  explanation: Measure with production-shaped inputs. This follows the module's purpose and tradeoffs.
  id: q004
- type: multipleChoice
  prompt: Which test is essential after a structural update?
  choices:
  - id: a
    text: Empty and one-item boundary cases
  - id: b
    text: Only a syntax check
  - id: c
    text: Only a million-item input
  - id: d
    text: Only the happy path
  answer:
    choiceId: a
  explanation: Empty and one-item boundary cases. This follows the module's purpose and tradeoffs.
  id: q005
- type: multipleChoice
  prompt: Which statement is the module's key invariant?
  choices:
  - id: a
    text: a fixed-capacity structure never writes outside its reserved storage
  - id: b
    text: Every operation is free
  - id: c
    text: All inputs are already sorted
  - id: d
    text: No state ever changes
  answer:
    choiceId: a
  explanation: a fixed-capacity structure never writes outside its reserved storage. This follows the module's purpose and tradeoffs.
  id: q006
- type: multipleChoice
  prompt: When should a built-in or library structure be preferred?
  choices:
  - id: a
    text: When it provides the required semantics and constraints without specialized needs
  - id: b
    text: Never; hand code is always faster
  - id: c
    text: Only in prototypes
  - id: d
    text: Only for one-element inputs
  answer:
    choiceId: a
  explanation: When it provides the required semantics and constraints without specialized needs. This follows the module's purpose and tradeoffs.
  id: q007
- type: multipleChoice
  prompt: Which factor can make asymptotically equal approaches differ?
  choices:
  - id: a
    text: Allocation and cache locality
  - id: b
    text: The number of comments
  - id: c
    text: Alphabetical variable names
  - id: d
    text: Whether a function is short
  answer:
    choiceId: a
  explanation: Allocation and cache locality. This follows the module's purpose and tradeoffs.
  id: q008
- type: multipleChoice
  prompt: What belongs in a structure-selection note?
  choices:
  - id: a
    text: Input bounds, required operations, memory budget, and failure behavior
  - id: b
    text: Only a Big-O label
  - id: c
    text: Only a code snippet
  - id: d
    text: Only a library name
  answer:
    choiceId: a
  explanation: Input bounds, required operations, memory budget, and failure behavior. This follows the module's purpose and tradeoffs.
  id: q009
- type: multipleChoice
  prompt: What is the primary learning goal of this module?
  choices:
  - id: a
    text: trading generality for bounded memory and fast aggregate queries
  - id: b
    text: Memorizing every API
  - id: c
    text: Avoiding all mutation
  - id: d
    text: Using a single universal container
  answer:
    choiceId: a
  explanation: trading generality for bounded memory and fast aggregate queries. This follows the module's purpose and tradeoffs.
  id: q010
- type: multipleChoice
  prompt: Which response is safest when an assumption is violated?
  choices:
  - id: a
    text: Define and test the failure behavior explicitly
  - id: b
    text: Silently discard every error
  - id: c
    text: Assume the input changes
  - id: d
    text: Make the operation recursive
  answer:
    choiceId: a
  explanation: Define and test the failure behavior explicitly. This follows the module's purpose and tradeoffs.
  id: q011
- type: multipleChoice
  prompt: What is a sound reason to hand-implement a structure?
  choices:
  - id: a
    text: A clear learning, memory, or latency requirement
  - id: b
    text: The code must be longer
  - id: c
    text: A library type exists
  - id: d
    text: No tests are available
  answer:
    choiceId: a
  explanation: A clear learning, memory, or latency requirement. This follows the module's purpose and tradeoffs.
  id: q012
