questions:
  - id: hard-matrix-unknown-entries
    type: multipleChoice
    prompt: |
      Let $A = \begin{bmatrix} 2 & x \\ y & -1 \end{bmatrix}$ and $B = \begin{bmatrix} 1 & 3 \\ 0 & 2 \end{bmatrix}$. 
      
      If $AB = \begin{bmatrix} 2 & 14 \\ 3 & 7 \end{bmatrix}$, what are the values of $x$ and $y$?
    choices:
      - id: c1
        text: '$x = 4, y = 3$'
      - id: c2
        text: '$x = 3, y = 4$'
      - id: c3
        text: '$x = 4, y = -3$'
      - id: c4
        text: '$x = -4, y = 3$'
    answer:
      choiceId: c1
    explanation: |
      Compute $AB$ symbolically: 
      Top right entry is $(2)(3) + (x)(2) = 6 + 2x$. Since this equals $14$, $6 + 2x = 14 \implies x = 4$.
      Bottom left entry is $(y)(1) + (-1)(0) = y$. Since this equals $3$, $y = 3$.

  - id: hard-matrix-algebra-expansion
    type: multipleChoice
    prompt: |
      If $A$ and $B$ are $n \times n$ matrices, which of the following is the correct expansion of $(A + B)^2$?
    choices:
      - id: c1
        text: '$A^2 + AB + BA + B^2$'
      - id: c2
        text: '$A^2 + 2AB + B^2$'
      - id: c3
        text: '$A^2 + B^2$'
      - id: c4
        text: '$A^2 - AB + BA - B^2$'
    answer:
      choiceId: c1
    explanation: |
      $(A+B)(A+B) = A(A+B) + B(A+B) = A^2 + AB + BA + B^2$. Because matrix multiplication is not commutative, $AB$ and $BA$ cannot be combined into $2AB$.

  - id: hard-matrix-vector-zero-logic
    type: multipleChoice
    prompt: |
      Let $A$ be a $3 \times 3$ matrix and let $\vec{x}$ be a non-zero vector such that $A\vec{x} = \vec{0}$. What does this conceptually imply about the columns of $A$?
    choices:
      - id: c1
        text: 'The columns of $A$ can be combined to form the zero vector using weights that are not all zero.'
      - id: c2
        text: 'The columns of $A$ are all the zero vector.'
      - id: c3
        text: 'The matrix $A$ must be the identity matrix.'
      - id: c4
        text: 'The vector $\vec{x}$ must be orthogonal to all columns of $A$.'
    answer:
      choiceId: c1
    explanation: |
      $A\vec{x}$ is a linear combination of the columns of $A$. If $\vec{x}$ is non-zero, it provides non-zero weights that combine the columns to yield $\vec{0}$. This is the definition of linear dependence among the columns.

  - id: hard-matrix-transpose-product
    type: multipleChoice
    prompt: |
      If $A$ is a $3 \times 4$ matrix and $B$ is a $4 \times 5$ matrix, what are the dimensions of the matrix $B^TA^T$?
    choices:
      - id: c1
        text: '$5 \times 3$'
      - id: c2
        text: '$3 \times 5$'
      - id: c3
        text: '$4 \times 4$'
      - id: c4
        text: 'The product $B^TA^T$ is undefined.'
    answer:
      choiceId: c1
    explanation: |
      $B^T$ is $5 \times 4$ and $A^T$ is $4 \times 3$. The product $(5 \times 4)(4 \times 3)$ is defined and results in a $5 \times 3$ matrix. This matches $(AB)^T$, where $AB$ is $3 \times 5$, so $(AB)^T$ is $5 \times 3$.

  - id: hard-linear-combo-solve
    type: multipleChoice
    prompt: |
      Let $\vec{u} = \begin{bmatrix} 1 \\ 2 \end{bmatrix}$ and $\vec{v} = \begin{bmatrix} -1 \\ 1 \end{bmatrix}$. 
      
      Find scalars $c_1$ and $c_2$ such that $c_1\vec{u} + c_2\vec{v} = \begin{bmatrix} 3 \\ 0 \end{bmatrix}$.
    choices:
      - id: c1
        text: '$c_1 = 1, c_2 = -2$'
      - id: c2
        text: '$c_1 = 2, c_2 = -1$'
      - id: c3
        text: '$c_1 = -1, c_2 = 2$'
      - id: c4
        text: '$c_1 = 3, c_2 = 0$'
    answer:
      choiceId: c1
    explanation: |
      We need $1c_1 - 1c_2 = 3$ and $2c_1 + 1c_2 = 0$. From the second equation, $c_2 = -2c_1$. Substituting into the first gives $c_1 - (-2c_1) = 3 \implies 3c_1 = 3 \implies c_1 = 1$. Then $c_2 = -2(1) = -2$.

  - id: hard-vector-geometric-inequality
    type: multipleChoice
    prompt: |
      Which mathematical property guarantees that the length of $\vec{u} + \vec{v}$ is less than or equal to the length of $\vec{u}$ plus the length of $\vec{v}$?
    choices:
      - id: c1
        text: 'The Triangle Inequality'
      - id: c2
        text: 'The Cauchy-Schwarz Inequality'
      - id: c3
        text: 'The Pythagorean Theorem'
      - id: c4
        text: 'Linear Independence'
    answer:
      choiceId: c1
    explanation: |
      Geometrically, vectors $\vec{u}$, $\vec{v}$, and $\vec{u}+\vec{v}$ form a triangle. The length of any one side of a triangle must be less than or equal to the sum of the lengths of the other two sides.

  - id: hard-matrix-commute-diagonal
    type: multipleChoice
    prompt: |
      Let $D = \begin{bmatrix} 2 & 0 \\ 0 & 3 \end{bmatrix}$. If $A = \begin{bmatrix} a & b \\ c & d \end{bmatrix}$, under what condition does $AD = DA$?
    choices:
      - id: c1
        text: '$b = 0$ and $c = 0$'
      - id: c2
        text: '$a = d$'
      - id: c3
        text: '$a = 2$ and $d = 3$'
      - id: c4
        text: '$D$ must be the identity matrix.'
    answer:
      choiceId: c1
    explanation: |
      Compute $AD = \begin{bmatrix} 2a & 3b \\ 2c & 3d \end{bmatrix}$ and $DA = \begin{bmatrix} 2a & 2b \\ 3c & 3d \end{bmatrix}$. Setting them equal gives $3b = 2b \implies b=0$ and $2c = 3c \implies c=0$. Thus $A$ must be a diagonal matrix.

  - id: hard-vector-scaling-inverse
    type: multipleChoice
    prompt: |
      If $A\vec{x} = \vec{b}$, and we define a new vector $\vec{y} = 3\vec{x}$, what is the result of $A\vec{y}$?
    choices:
      - id: c1
        text: '$3\vec{b}$'
      - id: c2
        text: '$\frac{1}{3}\vec{b}$'
      - id: c3
        text: '$\vec{b} + 3$'
      - id: c4
        text: 'Cannot be determined without knowing $A$.'
    answer:
      choiceId: c1
    explanation: |
      Because matrix multiplication is linear: $A(3\vec{x}) = 3(A\vec{x}) = 3\vec{b}$.
