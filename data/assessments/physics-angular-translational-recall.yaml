glossary:
  introduction: Review the essential terms below. Once you understand them, test your
    knowledge using the recall drills.
  sections:
  - id: sec-physics-angular-translational-recall
    title: Core Terminology
    entries:
    - id: entry-tangential-velocity
      term: Tangential Velocity ($v_t$)
      definition: The linear velocity of a point on a rotating body, directed tangent
        to its circular path. $v_t = r\omega$.
      drills:
      - id: drill-tangential-v
        prompt: The tangential velocity of a point is equal to the product of its
          radial distance $r$ and its angular ________.
        type: typed
        answer:
          expected: velocity
    - id: entry-tangential-acceleration
      term: Tangential Acceleration ($a_t$)
      definition: The rate of change of tangential speed. $a_t = r\alpha$.
      drills:
      - id: drill-tangential-a
        prompt: Tangential acceleration is defined as $a_t = r$ times ________.
        type: typed
        answer:
          expected: \alpha
    - id: entry-centripetal-acceleration-rot
      term: Radial (Centripetal) Acceleration ($a_r$)
      definition: The acceleration directed toward the center of the circular path,
        responsible for changing the direction of the velocity vector. $a_r = r\omega^2$.
      drills:
      - id: drill-centripetal-a
        prompt: In terms of $\omega$, the radial acceleration is $a_r = r$ times ________.
        type: typed
        answer:
          expected: \omega^2
