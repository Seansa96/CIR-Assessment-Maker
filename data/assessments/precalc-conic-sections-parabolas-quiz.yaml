questions:
  - id: q001
    type: freeResponse
    prompt: |
      Analyze and sketch the parabola.

      $$
      x^2=8y
      $$

      State its vertex, focus, directrix, axis, and direction of opening.
    answer:
      expected: |
        Standard form: $x^2=4py$ with $p=2$.

        Vertex: $(0,0)$
        Focus: $(0,2)$
        Directrix: $y=-2$
        Axis: $x=0$
        The parabola opens upward.
      gradingMode: selfCheck
      keyPoints:
        - Identifies $4p=8$ and therefore $p=2$.
        - Gives vertex $(0,0)$ and focus $(0,2)$.
        - Gives directrix $y=-2$.
        - Shows an upward-opening sketch symmetric about $x=0$.
    explanation: |
      Compare with $(x-h)^2=4p(y-k)$. Here $(h,k)=(0,0)$ and $4p=8$, so $p=2$. A positive $p$ places the focus two units above the vertex and the directrix two units below it.

      Related topic: vertical parabola standard form and the focus-directrix definition.

  - id: q002
    type: freeResponse
    prompt: |
      Analyze and sketch the parabola.

      $$
      9x=y^2
      $$

      State its vertex, focus, directrix, axis, and direction of opening.
    answer:
      expected: |
        Rewrite as $y^2=9x$. Comparing with $y^2=4px$ gives $p=\frac94$.

        Vertex: $(0,0)$
        Focus: $\left(\frac94,0\right)$
        Directrix: $x=-\frac94$
        Axis: $y=0$
        The parabola opens right.
      gradingMode: selfCheck
      keyPoints:
        - Rewrites the equation as $y^2=9x$.
        - Uses $4p=9$ rather than treating $9$ as $p$.
        - Gives the correct horizontal focus and directrix.
    explanation: |
      A squared $y$ with a linear $x$ signals a horizontal parabola. In $(y-k)^2=4p(x-h)$, the sign of $p$ determines left or right. Since $p=\frac94>0$, the curve opens right.

      Related topic: horizontal parabola orientation and interpreting $4p$.

  - id: q003
    type: freeResponse
    prompt: |
      Analyze and sketch the parabola.

      $$
      5x+3y^2=0
      $$

      State its vertex, focus, directrix, axis, and direction of opening.
    answer:
      expected: |
        Rewrite as

        $$
        y^2=-\frac53x.
        $$

        Thus $4p=-\frac53$ and $p=-\frac5{12}$.

        Vertex: $(0,0)$
        Focus: $\left(-\frac5{12},0\right)$
        Directrix: $x=\frac5{12}$
        Axis: $y=0$
        The parabola opens left.
      gradingMode: selfCheck
      keyPoints:
        - Isolates $y^2$ before comparing with standard form.
        - Computes $p=-\frac5{12}$.
        - Places the focus and directrix on opposite sides of the vertex.
    explanation: |
      Isolating the squared variable reveals the standard-form coefficient. The negative coefficient makes $p$ negative, so the focus lies left of the vertex and the directrix lies to its right.

      Related topic: sign analysis in horizontal parabola standard form.

  - id: q004
    type: freeResponse
    prompt: |
      Analyze and sketch the parabola.

      $$
      x^2+12y=0
      $$

      State its vertex, focus, directrix, axis, and direction of opening.
    answer:
      expected: |
        Rewrite as $x^2=-12y$. Then $4p=-12$, so $p=-3$.

        Vertex: $(0,0)$
        Focus: $(0,-3)$
        Directrix: $y=3$
        Axis: $x=0$
        The parabola opens downward.
      gradingMode: selfCheck
      keyPoints:
        - Rewrites the equation as $x^2=-12y$.
        - Finds $p=-3$.
        - Gives a downward-opening sketch.
    explanation: |
      The $x$ variable is squared, so the axis is vertical. The negative value of $p$ places the focus below the vertex, producing a downward-opening parabola.

      Related topic: vertical parabola orientation.

  - id: q005
    type: freeResponse
    prompt: |
      Analyze and sketch the parabola.

      $$
      (y+1)^2=16(x-3)
      $$

      State its vertex, focus, directrix, axis, and direction of opening.
    answer:
      expected: |
        The equation matches $(y-k)^2=4p(x-h)$ with $(h,k)=(3,-1)$ and $p=4$.

        Vertex: $(3,-1)$
        Focus: $(7,-1)$
        Directrix: $x=-1$
        Axis: $y=-1$
        The parabola opens right.
      gradingMode: selfCheck
      keyPoints:
        - Reads $k=-1$ from $y+1$.
        - Uses $4p=16$ to obtain $p=4$.
        - Translates both focus and directrix from the vertex.
    explanation: |
      The squared $y$ makes the parabola horizontal. Move $p=4$ units from the vertex in the opening direction to locate the focus; move the same distance in the opposite direction to locate the directrix.

      Related topic: translated horizontal parabolas.

  - id: q006
    type: freeResponse
    prompt: |
      Analyze and sketch the parabola.

      $$
      (x-3)^2=8(y+1)
      $$

      State its vertex, focus, directrix, axis, and direction of opening.
    answer:
      expected: |
        The equation matches $(x-h)^2=4p(y-k)$ with $(h,k)=(3,-1)$ and $p=2$.

        Vertex: $(3,-1)$
        Focus: $(3,1)$
        Directrix: $y=-3$
        Axis: $x=3$
        The parabola opens upward.
      gradingMode: selfCheck
      keyPoints:
        - Reads the translated vertex correctly.
        - Uses $4p=8$ to obtain $p=2$.
        - Gives the vertical axis $x=3$.
    explanation: |
      The squared $x$ makes the axis vertical. Since $p$ is positive, the focus is above the vertex and the directrix is below it.

      Related topic: translated vertical parabolas.

  - id: q007
    type: symbolicResponse
    prompt: |
      Find an equation of the parabola with vertex $(0,0)$ and focus $(1,0)$.
    answer:
      expectedLatex: 'y^2=4x'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The focus is one unit right of the vertex, so $p=1$ and the parabola opens right. Substitute into $(y-k)^2=4p(x-h)$:

      $$
      y^2=4x.
      $$

      The directrix is $x=-1$.

      Related topic: constructing a parabola from its vertex and focus.

  - id: q008
    type: symbolicResponse
    prompt: |
      Find an equation of the parabola with focus $(0,0)$ and directrix $y=6$.
    answer:
      expectedLatex: 'x^2=-12(y-3)'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The vertex is halfway between the focus and directrix, so it is $(0,3)$. The focus is three units below the vertex, giving $p=-3$. Therefore

      $$
      x^2=4(-3)(y-3)=-12(y-3).
      $$

      Related topic: using the focus-directrix midpoint to recover the vertex.

  - id: q009
    type: symbolicResponse
    prompt: |
      Find an equation of the parabola with focus $(-4,0)$ and directrix $x=2$.
    answer:
      expectedLatex: 'y^2=-12(x+1)'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The vertex is the midpoint between $x=-4$ and $x=2$, so it is $(-1,0)$. The directed distance from the vertex to the focus is $p=-3$. Hence

      $$
      y^2=4(-3)(x+1)=-12(x+1).
      $$

      Related topic: horizontal focus-directrix construction.

  - id: q010
    type: symbolicResponse
    prompt: |
      Find an equation of the parabola with focus $(2,-1)$ and vertex $(2,3)$.
    answer:
      expectedLatex: '(x-2)^2=-16(y-3)'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      The focus and vertex share $x=2$, so the axis is vertical. The focus is four units below the vertex, giving $p=-4$. Thus

      $$
      (x-2)^2=4(-4)(y-3)=-16(y-3).
      $$

      The directrix is $y=7$.

      Related topic: directed focal distance.

  - id: q011
    type: symbolicResponse
    prompt: |
      Find an equation of the parabola with vertex $(3,-1)$, a horizontal axis, and passing through $(-15,2)$.
    answer:
      expectedLatex: '(y+1)^2=-\frac12(x-3)'
      equivalenceMode: expression
      variables:
        - x
        - y
      tolerance: 0.000001
    explanation: |
      Begin with $(y+1)^2=4p(x-3)$. Substituting $(-15,2)$ gives

      $$
      9=4p(-18),
      $$

      so $p=-\frac18$ and $4p=-\frac12$. Therefore

      $$
      (y+1)^2=-\frac12(x-3).
      $$

      Related topic: determining a parabola's scale from a point on the curve.
