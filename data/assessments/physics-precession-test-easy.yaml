questions:
- id: q1
  type: multipleChoice
  prompt: What causes the precession of a spinning top?
  choices:
  - id: c1
    content: The torque due to gravity acting on its center of mass.
  - id: c2
    content: The conservation of its translational momentum.
  - id: c3
    content: Centripetal acceleration.
  answer:
    choiceId: c1
  explanation: Gravity applies a torque about the pivot, which is perpendicular to
    $\vec{L}$, causing $\vec{L}$ to change direction (precess).
