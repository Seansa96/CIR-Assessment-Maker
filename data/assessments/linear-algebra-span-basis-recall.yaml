schemaVersion: 1
id: linear-algebra-span-basis-recall
title: Span, Independence, and Basis Recall Drill
assessmentType: recallDrill
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-linear-combinations-span
  - linear-algebra-linear-independence-basis
modeDefault: practice
randomizeQuestions: true
skills:
  - span
  - linear-independence
  - basis
  - dimension
items:
  - id: r-span-def
    type: flashcard
    prompt: |
      What is the geometric interpretation of the span of two non-collinear vectors in $\mathbb{R}^3$?
    answer:
      expected: 'A plane passing through the origin.'

  - id: r-indep-def
    type: flashcard
    prompt: |
      Define what it means for a set of vectors $\{\vec{v}_1, \dots, \vec{v}_p\}$ to be linearly independent.
    answer:
      expected: 'The vector equation $c_1\vec{v}_1 + \dots + c_p\vec{v}_p = \vec{0}$ has only the trivial solution ($c_1 = \dots = c_p = 0$).'

  - id: r-dep-trick
    type: flashcard
    prompt: |
      If a set of vectors contains the zero vector, is it linearly independent or dependent?
    answer:
      expected: 'Linearly dependent. (You can place a non-zero weight on the zero vector and zeros on the rest to get the zero vector).'

  - id: r-basis-def
    type: flashcard
    prompt: |
      What two conditions must a set of vectors satisfy to be a basis for a vector space $V$?
    answer:
      expected: '1. They must span $V$. 2. They must be linearly independent.'

  - id: r-dimension
    type: cloze
    prompt: |
      The {{dimension}} of a vector space is the number of vectors in any basis for that space.
    answer:
      expected: 'dimension'

  - id: r-rank-nullity
    type: flashcard
    prompt: |
      State the Rank-Nullity Theorem for an $m \times n$ matrix $A$.
    answer:
      expected: 'Rank(A) + Nullity(A) = n (the number of columns).'

  - id: r-basis-pivots
    type: cloze
    prompt: |
      The pivot columns of a matrix $A$ form a basis for the {{column space}} of $A$.
    answer:
      expected: 'column space'
