questions:
- id: q001
  type: numericResponse
  skills:
  - moments-mass
  prompt: 'Find the centroid $\b\bar{x}$ coordinate for the region bounded by $y = 4
    - x^2$ and $y = 0$.

    '
  answer:
    value: 0
    tolerance: 0.01
  explanation: 'The region bounded by $y = 4-x^2$ and the x-axis is perfectly symmetric
    across the y-axis.

    Therefore, the centroid must lie on the y-axis, so $\b\bar{x} = 0$.

    '
- id: q002
  type: numericResponse
  skills:
  - moments-mass
  prompt: 'Find the total mass of a rod located from $x=1$ to $x=4$ with linear density
    $\rho(x) = \frac{1}{\sqrt{x}}$.

    '
  answer:
    value: 2
    tolerance: 0.1
  explanation: '$m = \int_1^4 x^{-1/2}\,dx = [2x^{1/2}]_1^4 = 2(2) - 2(1) = 4 - 2
    = 2$.

    '
- id: q003
  type: multipleChoice
  skills:
  - moments-mass
  prompt: 'Set up the integral for $M_x$ for the region bounded by $y = e^x$, $y =
    0$, $x = 0$, and $x = 1$.

    '
  choices:
  - id: a
    text: $\frac{1}{2} \int_0^1 e^{2x}\,dx$
  - id: b
    text: $\int_0^1 x e^x\,dx$
  - id: c
    text: $\frac{1}{2} \int_0^1 (e^x - x)\,dx$
  - id: d
    text: $\int_0^1 e^{2x}\,dx$
  answer:
    choiceId: a
  explanation: '$M_x = \frac{1}{2} \int (f(x)^2 - g(x)^2)\,dx = \frac{1}{2} \int_0^1
    ((e^x)^2 - 0)\,dx = \frac{1}{2} \int_0^1 e^{2x}\,dx$.

    '
- id: q004
  type: numericResponse
  skills:
  - moments-mass
  prompt: 'Find the centroid $\b\bar{y}$ coordinate for the region bounded by $y = \sin
    x$ and $y = 0$ on $[0, \pi]$.

    Use decimal a\approximation to 2 decimal places.

    '
  answer:
    value: 0.392
    tolerance: 0.05
  explanation: 'Area $A = \int_0^\pi \sin x\,dx = [-\cos x]_0^\pi = 2$.

    $M_x = \frac{1}{2} \int_0^\pi \sin^2 x\,dx = \frac{1}{2} \int_0^\pi \frac{1 -
    \cos(2x)}{2}\,dx = \frac{1}{4} [x - \frac{1}{2}\sin(2x)]_0^\pi = \frac{\pi}{4}$.

    $\b\bar{y} = M_x / A = (\pi/4) / 2 = \pi/8 \a\approx 0.3926$.

    '
- id: q005
  type: multipleChoice
  skills:
  - moments-mass
  prompt: 'Which of the following is true about the centroid of a region?

    '
  choices:
  - id: a
    text: The centroid must always lie physically inside the region.
  - id: b
    text: If the region has an axis of symmetry, the centroid must lie on that axis.
  - id: c
    text: The centroid coordinate $\b\bar{x}$ is always half the area.
  - id: d
    text: Centroids can only be computed if density is a variable function.
  answer:
    choiceId: b
  explanation: 'A centroid always lies on any axes of symmetry. (Also, note that a
    centroid doesn''t HAVE to lie inside the region—for example, the centroid of a
    donut is in the empty\rhole!)

    '

