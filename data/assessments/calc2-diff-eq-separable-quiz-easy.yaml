schemaVersion: 1
id: calc2-diff-eq-separable-quiz-easy
title: Separable Equations Quiz — Easy
assessmentType: quiz
categoryId: calculus-2
topicId: diff-eq-separable
modeDefault: practice
randomizeQuestions: true
skills: [recognize separable equations, separate variables, solve separable IVPs]
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [calculus-2, separable-equations, differential-equations] }
questions:
- id: q001
  type: symbolicResponse
  skills: [recognize separable equations]
  prompt: In the separated form of $y'=x(y+2)$, enter the factor multiplying $dy$ on the left.
  answer: { expectedLatex: '1/(y+2)', equivalenceMode: expression, tolerance: 0.000001, variables: [y], explanation: Dividing by $y+2$ gives $dy/(y+2)=x\,dx$; enter the left-side factor. }
- id: q002
  type: numericResponse
  skills: [recognize separable equations]
  prompt: For $y'=y(5-y)$, what is the positive equilibrium value?
  answer: { value: 5, tolerance: 0.001 }
  explanation: Constant solutions make the right side zero.
- id: q003
  type: symbolicResponse
  skills: [solve separable IVPs]
  prompt: Solve $y'=3y$ with $y(0)=4$. Enter $y(x)$.
  answer: { expectedLatex: '4e^(3x)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: Separation gives $\ln|y|=3x+C$, and the initial value determines the multiplier 4. }
- id: q004
  type: numericResponse
  skills: [construct mixing models]
  prompt: A 40-gal tank has 16 lb of salt. If mixture leaves at 5 gal/min, what is the salt-out rate in lb/min?
  answer: { value: 2, tolerance: 0.001 }
  explanation: The concentration is $16/40$ lb/gal, so outflow is $(16/40)(5)$.
- id: q005
  type: numericResponse
  skills: [solve separable IVPs]
  prompt: If $y'=2xy$ and $y(0)=3$, what is $y(1)$?
  answer: { value: 8.154845, tolerance: 0.082 }
  explanation: The solution is $3e^{x^2}$, so $y(1)=3e$.
