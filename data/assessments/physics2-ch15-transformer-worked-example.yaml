- id: we2
  title: Step-Down Transformer
  steps:
  - id: s1
    prompt: Use the turns ratio equation.
    explanation: 'Solution:

      1) $\frac{V_S}{V_P} = \frac{N_S}{N_P}$.

      2) $\frac{12}{120} = \frac{N_S}{500}$.

      3) $N_S = 500 \times \frac{12}{120} = 500 \times 0.1 = 50\text{ turns}$.


      Why it works:

      Faraday''s law dictates that the voltage per turn is the same for both coils since they share the
      same magnetic flux.'
    title: Use the turns ratio equation.
    instruction: 'Work through this step: Use the turns ratio equation.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: A transformer steps a $120\text{ V}$ primary voltage down to $12\text{ V}$. If the primary
    has $500$ turns, how many turns are on the secondary coil?
