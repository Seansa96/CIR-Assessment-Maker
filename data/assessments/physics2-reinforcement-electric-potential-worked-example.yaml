workedExamples:
- id: reinforcement-potential-we1
  title: Potential of two charges
  problem: Equal charges $+Q$ are each distance $r$ from point P. Find the potential at P.
  steps:
  - id: reinforcement-potential-we1-s1
    title: Select the superposition rule
    instruction: Decide whether the source contributions are scalar or vector quantities.
    hint: Potential is energy per charge and has no direction.
    type: multipleChoice
    prompt: Which setup is correct?
    choices:
    - { id: a, text: '$V_P=kQ/r+kQ/r$' }
    - { id: b, text: '$V_P=0$ because the fields point oppositely', issueSignals: [{ id: physics2-potential-field-cancellation, domains: [physics-2] }] }
    - { id: c, text: '$V_P=2kQ/r^2$', issueSignals: [{ id: physics2-potential-distance-power, domains: [physics-2] }] }
    - { id: d, text: '$V_P=kQ/(2r)$', issueSignals: [{ id: physics2-potential-addition-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Add the two scalar terms $kQ/r$, giving $V_P=2kQ/r$. Why it works: Potential superposes algebraically. Why the other choices fail: They use field cancellation, field scaling, or divide instead of add.'
  - id: reinforcement-potential-we1-s2
    title: Check the sign and units
    instruction: Use the source sign and potential units.
    hint: Positive source charges give positive potential relative to infinity.
    type: multipleChoice
    prompt: Which verification is correct?
    choices:
    - { id: a, text: 'The result is positive and has units joules per coulomb' }
    - { id: b, text: 'The result is negative and has units newtons per coulomb', issueSignals: [{ id: physics2-potential-sign-units-error, domains: [physics-2] }] }
    - { id: c, text: 'The result has units joules per coulomb squared', issueSignals: [{ id: physics2-potential-unit-error, domains: [physics-2] }] }
    - { id: d, text: 'The sign cannot be checked without a test charge', issueSignals: [{ id: physics2-potential-source-sign-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Positive sources give positive $V$ and $V$ has units J/C (volt). Why it works: Potential is source energy per unit positive charge. Why the other choices fail: They confuse potential with field, use the wrong charge units, or deny the reference convention.'
  - id: reinforcement-potential-we1-s3
    title: Verify scalar addition
    instruction: Check the potential result by its quantity type and units.
    hint: Potential is scalar and measured in volts.
    type: multipleChoice
    prompt: Which check is correct for the two-charge result?
    choices: [{ id: a, text: 'Terms add algebraically and the result is in volts' }, { id: b, text: 'Fields cancel, so potential is zero', issueSignals: [{ id: physics2-potential-vector-check, domains: [physics-2] }] }, { id: c, text: 'The result is in N/C', issueSignals: [{ id: physics2-potential-field-unit, domains: [physics-2] }] }, { id: d, text: 'Source terms multiply', issueSignals: [{ id: physics2-potential-product-check, domains: [physics-2] }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Potential terms add as scalars and have units of volts. Why it works: Potential has no direction. Why the other choices fail: They import vector cancellation, field units, or multiplication.'
- id: reinforcement-potential-we2
  title: Potential-energy change
  problem: A positive charge $q$ moves from $V_i=80\,\mathrm V$ to $V_f=20\,\mathrm V$.
  steps:
  - id: reinforcement-potential-we2-s1
    title: Compute the potential difference
    instruction: Subtract initial from final potential.
    hint: $\Delta V=V_f-V_i$.
    type: multipleChoice
    prompt: What is $\Delta V$?
    choices:
    - { id: a, text: '$-60\,\mathrm V$' }
    - { id: b, text: '$+60\,\mathrm V$', issueSignals: [{ id: physics2-potential-difference-order, domains: [physics-2] }] }
    - { id: c, text: '$100\,\mathrm V$', issueSignals: [{ id: physics2-potential-difference-addition, domains: [physics-2] }] }
    - { id: d, text: '$1/4\,\mathrm V$', issueSignals: [{ id: physics2-potential-difference-ratio, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $\Delta V=20-80=-60\,\mathrm V$. Why it works: A move to lower potential has a negative final-minus-initial difference. Why the other choices fail: They reverse or misuse subtraction.'
  - id: reinforcement-potential-we2-s2
    title: Compute energy change
    instruction: Apply $\Delta U=q\Delta V$.
    hint: Keep $q$ positive and preserve the negative sign from $\Delta V$.
    type: multipleChoice
    prompt: What is the change in potential energy?
    choices:
    - { id: a, text: '$-60q\,\mathrm J$ when $q$ is measured in coulombs' }
    - { id: b, text: '$+60q\,\mathrm J$', issueSignals: [{ id: physics2-potential-energy-sign, domains: [physics-2] }] }
    - { id: c, text: '$-q/60\,\mathrm J$', issueSignals: [{ id: physics2-potential-energy-division, domains: [physics-2] }] }
    - { id: d, text: '$0$ because the charge moved between equipotentials', issueSignals: [{ id: physics2-potential-energy-equipotential, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $\Delta U=q(-60\,\mathrm V)=-60q\,\mathrm J$ for $q$ in coulombs. Why it works: Positive charge loses potential energy when moving to lower potential. Why the other choices fail: They reverse the sign, divide by the voltage, or claim the endpoints have equal potential.'
  - id: reinforcement-potential-we2-s3
    title: Verify work and energy
    instruction: Relate the sign of energy change to field work.
    hint: $W_{\mathrm{field}}=-\Delta U$.
    type: multipleChoice
    prompt: What does negative $\Delta U$ mean for the positive charge?
    choices: [{ id: a, text: 'The field does positive work' }, { id: b, text: 'The field does negative work', issueSignals: [{ id: physics2-potential-work-sign, domains: [physics-2] }] }, { id: c, text: 'No work occurs', issueSignals: [{ id: physics2-potential-work-zero, domains: [physics-2] }] }, { id: d, text: 'The charge must be negative', issueSignals: [{ id: physics2-potential-charge-sign, domains: [physics-2] }] }]
    answer: { choiceId: a }
    explanation: 'Solution: $W_{\mathrm{field}}=-\Delta U$ is positive. Why it works: Field work is the negative energy change. Why the other choices fail: They reverse the sign, deny the change, or infer the wrong charge.'
