questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-diffusion-effusion
    prompt: |
      Which of the following defines **effusion**?
    choices:
      - id: a
        text: The gradual mixing of two different gases due to random molecular motion.
      - id: b
        text: The escape of gas molecules through a tiny hole into a vacuum or lower-pressure region.
      - id: c
        text: The process of a gas turning into a liquid under high pressure.
      - id: d
        text: The increase in gas volume as it is heated.
    answer:
      choiceId: b
    explanation: |
      Effusion specifically involves gas escaping through a microscopic opening (like a pinhole). Diffusion is the general mixing of gases in a shared space.

  - id: q002
    type: multipleChoice
    skills:
      - chem-diffusion-effusion
    prompt: |
      Which gas will effuse the **fastest** under identical conditions of temperature and pressure?
    choices:
      - id: a
        text: '$CO_2$ (44 g/mol)'
      - id: b
        text: '$He$ (4 g/mol)'
      - id: c
        text: '$Ar$ (40 g/mol)'
      - id: d
        text: '$Cl_2$ (71 g/mol)'
    answer:
      choiceId: b
    explanation: |
      According to Graham's Law, the rate of effusion is inversely proportional to the square root of the molar mass. The **lightest** gas effuses the fastest. Helium has the lowest molar mass.

  - id: q003
    type: multipleChoice
    skills:
      - chem-diffusion-effusion
    prompt: |
      When calculating the root-mean-square speed ($u_{rms} = \sqrt{\frac{3RT}{M}}$), what units MUST be used for the molar mass $M$?
    choices:
      - id: a
        text: grams per mole (g/mol)
      - id: b
        text: kilograms per mole (kg/mol)
      - id: c
        text: atomic mass units (amu)
      - id: d
        text: milligrams per mole (mg/mol)
    answer:
      choiceId: b
    explanation: |
      Because the ideal gas constant $R$ is in Joules ($1 \text{ J} = 1 \text{ kg}\cdot\text{m}^2/\text{s}^2$), the mass must be in **kg** to properly cancel units and give a speed in m/s.

  - id: q004
    type: numericResponse
    skills:
      - chem-diffusion-effusion
    prompt: |
      Hydrogen gas ($H_2$, 2.0 g/mol) and Oxygen gas ($O_2$, 32.0 g/mol) are placed in identical containers with pinholes. How many times faster will the $H_2$ effuse compared to the $O_2$?
    answer:
      value: 4.0
      tolerance: 0.1
    explanation: |
      Graham's Law: $\frac{r_{H_2}}{r_{O_2}} = \sqrt{\frac{M_{O_2}}{M_{H_2}}} = \sqrt{\frac{32.0}{2.0}} = \sqrt{16.0} = 4.0$.
      Hydrogen effuses exactly 4 times faster.

  - id: q005
    type: multipleChoice
    skills:
      - chem-diffusion-effusion
    prompt: |
      Two gases, A and B, are at the same temperature. Gas A has a molar mass of 10 g/mol, and Gas B has a molar mass of 40 g/mol. Which statement is true?
    choices:
      - id: a
        text: Gas B's molecules move, on average, 4 times slower than Gas A's.
      - id: b
        text: Gas B's molecules move, on average, 2 times slower than Gas A's.
      - id: c
        text: Both gases have the same average speed because they are at the same temperature.
      - id: d
        text: Gas B's molecules move, on average, 2 times faster than Gas A's.
    answer:
      choiceId: b
    explanation: |
      Average speed is inversely proportional to the square root of the mass ($\frac{v_A}{v_B} = \sqrt{\frac{40}{10}} = \sqrt{4} = 2$). Gas A moves twice as fast, meaning Gas B moves 2 times slower.

  - id: q006
    type: numericResponse
    skills:
      - chem-diffusion-effusion
    prompt: |
      Calculate the rms speed (in m/s) of Helium atoms ($He$, $M = 4.00 \text{ g/mol}$) at 300 K.
      *(Use $R = 8.314$ J/mol·K)*
    answer:
      value: 1367
      tolerance: 10
    explanation: |
      $M = 0.00400 \text{ kg/mol}$.
      $u_{rms} = \sqrt{\frac{3 \times 8.314 \times 300}{0.00400}} = \sqrt{\frac{7482.6}{0.00400}} = \sqrt{1870650} \approx 1367.7 \text{ m/s}$.

  - id: q007
    type: multipleChoice
    skills:
      - chem-diffusion-effusion
    prompt: |
      Why does diffusion happen much more slowly than the calculated $u_{rms}$ would suggest? (e.g. molecules moving 500 m/s take minutes to cross a 5-meter room).
    choices:
      - id: a
        text: Gravity slows the molecules down as they travel horizontally.
      - id: b
        text: Molecules constantly collide with air molecules, changing direction in a random, zigzag path.
      - id: c
        text: The formula for $u_{rms}$ is only theoretical and overestimates actual speed.
      - id: d
        text: Intermolecular forces drag the molecules to a halt.
    answer:
      choiceId: b
    explanation: |
      While individual molecules are moving very fast (~500 m/s), they undergo billions of collisions per second with air molecules, causing them to bounce around randomly (a "random walk"). It takes a long time to make net progress across a room.

  - id: q008
    type: numericResponse
    skills:
      - chem-diffusion-effusion
    prompt: |
      An unknown gas effuses 0.50 times as fast as Helium ($M = 4.0$ g/mol). What is the molar mass of the unknown gas (in g/mol)?
    answer:
      value: 16.0
      tolerance: 0.5
    explanation: |
      $\frac{r_{unkn}}{r_{He}} = 0.50 = \sqrt{\frac{M_{He}}{M_{unkn}}} = \sqrt{\frac{4.0}{M_{unkn}}}$
      Square both sides: $0.25 = \frac{4.0}{M_{unkn}} \implies M_{unkn} = \frac{4.0}{0.25} = 16.0 \text{ g/mol}$ (Likely $CH_4$).

  - id: q009
    type: multipleChoice
    skills:
      - chem-diffusion-effusion
    prompt: |
      Isotopes of uranium were separated during the Manhattan Project by converting uranium into uranium hexafluoride ($UF_6$) gas and allowing it to effuse. Why did this work?
    choices:
      - id: a
        text: $^{235}UF_6$ is slightly lighter than $^{238}UF_6$, so it effuses slightly faster, allowing enrichment.
      - id: b
        text: $^{238}UF_6$ is heavier, so it effuses faster due to increased momentum.
      - id: c
        text: $^{235}U$ reacts with the effusion membrane.
      - id: d
        text: The two isotopes have different chemical properties.
    answer:
      choiceId: a
    explanation: |
      Because $^{235}UF_6$ is slightly lighter than $^{238}UF_6$, Graham's law dictates it will effuse slightly faster. Over many thousands of stages, this tiny difference in effusion rates successfully concentrated the lighter, fissile isotope.

  - id: q010
    type: multipleChoice
    skills:
      - chem-diffusion-effusion
    prompt: |
      What happens to the rate of effusion of a gas if its absolute temperature is quadrupled (e.g. from 300 K to 1200 K)?
    choices:
      - id: a
        text: The rate increases by a factor of 4.
      - id: b
        text: The rate doubles.
      - id: c
        text: The rate is halved.
      - id: d
        text: The rate remains unchanged.
    answer:
      choiceId: b
    explanation: |
      Effusion rate is proportional to $u_{rms}$, which is proportional to $\sqrt{T}$. If temperature $T$ is quadrupled, the rate increases by $\sqrt{4} = 2$. It doubles.
