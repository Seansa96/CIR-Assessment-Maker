exploration:
  introduction: 'Periodic trends arise from the interplay between the number of protons
    in the nucleus (nuclear charge) and the number of electron shells. In this exploration,
    you will adjust the period and group of a hypothetical element and observe\rhow
    atomic radius, ionization energy, and electronegativity change.


    **Core principle:** As nuclear charge increases (moving right across a period),
    electrons are pulled closer — shrinking the atom and requiring more energy to
    remove an electron. As more shells are added (moving down a group), electrons
    are farther from the nucleus and held less tightly.

    '
  sections:
  - id: explore-period-trend
    title: Explore Across a Period (Left to Right)
    required: true
    instruction: 'Adjust the **Group number** slider (1–18) while keeping Period =
      3 (the Na → Ar row). Watch\rhow atomic radius decreases and ionization energy
      increases as you move right.


      Note: The relative values shown are schematic (not actual amu / kJ/mol). They
      illustrate the trend.

      '
    controls:
    - id: group
      type: slider
      label: Group Number (1 = alkali metal, 18 = noble gas)
      min: 1
      max: 18
      step: 1
      defaultValue: '1'
    - id: period
      type: slider
      label: Period Number (1–6)
      min: 1
      max: 6
      step: 1
      defaultValue: '3'
    views:
    - id: radius-display
      type: readout
      label: Relative Atomic Radius (arbitrary units — larger = bigger atom)
      expression: (7 - period) * 30 + (19 - group) * 5
    - id: ie-display
      type: readout
      label: Relative Ionization Energy (arbitrary units — larger = harder to ionize)
      expression: period * 15 + group * 8
    - id: en-display
      type: readout
      label: Relative Electronegativity (arbitrary units — larger = more electronegative)
      expression: period * 5 + group * 12
    check:
      id: period-trend-check
      type: multipleChoice
      prompt: 'As you increase the group number (moving left to right across Period
        3), what happens to the relative ionization energy in this model?

        '
      choices:
      - id: a
        text: It increases — elements on the right require more energy to remove an
          electron.
      - id: b
        text: It decreases — elements on the right lose electrons more easily.
      - id: c
        text: It stays constant across a period.
      - id: d
        text: It first increases then decreases.
      answer:

        choiceId: a
      explanation: 'Moving right across a period, the nuclear charge (number of protons)
        increases while electrons are added to the same shell. The stronger nuclear
        pull makes it harder to remove an electron, increasing ionization energy.

        '
  - id: explore-group-trend
    title: Explore Down a Group (Top to Bottom)
    required: true
    instruction: 'Keep the **Group** at 1 (alkali metals) and increase the **Period**
      slider from 2 to 6 (Li → Cs). Watch\rhow atomic radius increases while ionization
      energy decreases as you move down.

      '
    controls:
    - id: group2
      type: slider
      label: Group Number
      min: 1
      max: 18
      step: 1
      defaultValue: '1'
    - id: period2
      type: slider
      label: Period Number (2 = Li, 3 = Na, 4 = K, 5 = Rb, 6 = Cs)
      min: 2
      max: 6
      step: 1
      defaultValue: '2'
    views:
    - id: radius-group
      type: readout
      label: Relative Atomic Radius (larger = bigger)
      expression: (7 - period2) * 30 + (19 - group2) * 5
    - id: ie-group
      type: readout
      label: Relative Ionization Energy (larger = harder to remove electron)
      expression: period2 * 15 + group2 * 8
    check:
      id: group-trend-check
      type: multipleChoice
      prompt: 'Lithium (Li, Period 2) and cesium (Cs, Period 6) are both in Group
        1 (alkali metals). Which statement is correct about their properties?

        '
      choices:
      - id: a
        text: Cs has a larger atomic radius and lower ionization energy than Li.
      - id: b
        text: Li has a larger atomic radius because it is lighter.
      - id: c
        text: Both have identical ionization energies because they are in the same
          group.
      - id: d
        text: Cs has a smaller radius because it has more protons.
      answer:

        choiceId: a
      explanation: 'Going down Group 1 from Li to Cs, each element has one more electron
        shell. More shells means a larger atom (greater radius). The outer electrons
        are also farther from the nucleus and shielded by inner shells, so they are
        held less tightly — lower ionization energy. Cs is the most reactive alkali
        metal precisely because its electron is easiest to remove.

        '
