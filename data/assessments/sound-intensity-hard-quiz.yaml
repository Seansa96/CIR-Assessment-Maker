questions:
- id: q001
  type: numericResponse
  prompt: A point source has intensity 0.80 W/m^2 at 5.0 m. What intensity in W/m^2 is expected at 15 m under ideal spherical spreading?
  answer: { value: 0.08889, tolerance: 0.002 }
  explanation: |
    Solution: $I_2=I_1(r_1/r_2)^2=0.80(5.0/15)^2=0.08889$ W/m$^2$.

    Why it works: The same power is distributed over spherical areas proportional to $r^2$.
  difficultyDimensions: [proportionalReasoning, modelOrDerivation, unitAnalysis]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q002
  type: numericResponse
  prompt: At 2.0 m from a point source, intensity is 1.5 W/m^2. What total acoustic power in W does the ideal isotropic source emit?
  answer: { value: 75.398, tolerance: 0.2 }
  explanation: |
    Solution: $P=I(4\pi r^2)=1.5[4\pi(2.0)^2]=75.398$ W.

    Why it works: Intensity at radius $r$ is source power divided by the spherical surface area $4\pi r^2$.
  difficultyDimensions: [reverseReasoning, modelOrDerivation, representationTransfer]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q003
  type: multipleChoice
  prompt: A listener moves from 3 m to 6 m from an ideal point source. Which change occurs?
  choices:
  - { id: a, text: Intensity becomes one-fourth as large. }
  - { id: b, text: Intensity becomes one-half as large. }
  - { id: c, text: Intensity doubles. }
  - { id: d, text: Intensity is unchanged. }
  answer: { choiceId: a }
  explanation: |
    Solution: Intensity becomes one-fourth as large.

    Why it works: Doubling the distance quadruples the spherical spreading area.

    Why the other choices fail: The relevant geometric dependence is inverse square, not inverse linear or constant.
  difficultyDimensions: [proportionalReasoning, modelComparison, errorDiagnosis]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q004
  type: multipleChoice
  prompt: Why can an inverse-square intensity model fail to predict a real room measurement exactly?
  choices:
  - { id: a, text: Reflections and absorption can alter the received sound field. }
  - { id: b, text: Sound has no power in air. }
  - { id: c, text: Distance cannot affect intensity. }
  - { id: d, text: Spherical area decreases with distance. }
  answer: { choiceId: a }
  explanation: |
    Solution: Reflections and absorption can alter the received sound field.

    Why it works: The inverse-square model assumes ideal free spreading; room boundaries and losses violate that simplified condition.

    Why the other choices fail: Sound does carry power, distance affects spreading, and spherical area grows with radius.
  difficultyDimensions: [domainCondition, errorDiagnosis, modelComparison]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
