  prompt: |-
    Classify $\sum_{n=1}^\infty(-1)^n n!/n^n$. Which justification decides the question?
  choices:
  - id: a
    text: Absolutely convergent; the Ratio Test gives limit $e^{-1}<1$.
  - id: b
    text: Conditionally convergent; signs alternate.
  - id: c
    text: Divergent; factorial growth always dominates.
  - id: d
    text: Divergent; its terms do not approach zero.
  answer:
    choiceId: a
  explanation: |-
