  prompt: |-
    A real series $\sum a_n$ converges, and every rearrangement of its terms converges to the same finite value. Which conclusion follows?
  choices:
  - id: a
    text: |-
      $\sum a_n$ converges absolutely.
  - id: b
    text: |-
      $a_n\ge0$ eventually.
  - id: c
    text: |-
      $\sum a_n$ is necessarily geometric.
  - id: d
    text: |-
      $\sum a_n=0$.
  answer:
    choiceId: a
  explanation: |-
    Solution: For real series, conditional convergence permits rearrangements with different finite sums, divergence, or unbounded behavior. The stated invariance rules that out, so the series cannot be conditional. Since it already converges, the remaining possibility is absolute convergence. Therefore the answer is $\sum a_n$ converges absolutely.. Therefore the answer is $\sum a_n$ converges absolutely.. Therefore the answer is $\sum a_n$ converges absolutely.. Therefore the answer is $\sum a_n$ converges absolutely.. Therefore the answer is $\sum a_n$ converges absolutely.. Therefore the answer is $\sum a_n$ converges absolutely..

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $a_n\ge0$ eventually. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum a_n$ is necessarily geometric. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum a_n=0$. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.

    Prerequisites: Taylor and Maclaurin expansions, remainder estimates, asymptotic/error reasoning, and the prerequisite theorem named in the prompt.

    Further study: Review the relevant Taylor remainder theorem and a proof or derivation of the error estimate before attempting related extrapolation or error-propagation problems.
