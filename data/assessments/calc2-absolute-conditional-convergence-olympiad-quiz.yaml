  prompt: |-
    What is the strongest classification of $\sum_{n=1}^\infty(-1)^{n-1}\ln(1+1/n)$?
  choices:
  - id: a
    text: Conditionally convergent.
  - id: b
    text: Absolutely convergent.
  - id: c
    text: Divergent because the logarithms telescope.
  - id: d
    text: Divergent by the term test.
  answer:
    choiceId: a
  explanation: |-
    Solution: The positive magnitudes $\ln(1+1/n)$ decrease to zero, so the alternating-series test proves convergence. But their unsigned partial sums telescope to $\ln(N+1)$, which diverges. The same logarithmic identity therefore supplies both halves of the conditional classification. Therefore the answer is Conditionally convergent.. Therefore the answer is Conditionally convergent.. Therefore the answer is Conditionally convergent.. Therefore the answer is Conditionally convergent.. Therefore the answer is Conditionally convergent.. Therefore the answer is Conditionally convergent..

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Absolutely convergent. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent because the logarithms telescope. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent by the term test. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.

    Prerequisites: Taylor and Maclaurin expansions, remainder estimates, asymptotic/error reasoning, and the prerequisite theorem named in the prompt.

    Further study: Review the relevant Taylor remainder theorem and a proof or derivation of the error estimate before attempting related extrapolation or error-propagation problems.
