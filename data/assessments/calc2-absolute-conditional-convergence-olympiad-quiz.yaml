  prompt: |-
    Classify $\sum_{n=1}^\infty(-1)^{\lfloor\sqrt n\rfloor}/n$. Which statement is correct?
  choices:
  - id: a
    text: It converges conditionally.
  - id: b
    text: It converges absolutely.
  - id: c
    text: It diverges because signs do not alternate term by term.
  - id: d
    text: It diverges by the term test.
  answer:
    choiceId: a
  explanation: |-
    Solution: Group the terms with $k^2\le n<(k+1)^2$. Their common sign is $(-1)^k$, and their positive block weight is approximately $\log((k+1)^2/k^2)$, a decreasing quantity tending to zero. The resulting alternating block series converges, while the absolute series is harmonic and diverges. This is conditional convergence. Therefore the answer is It converges conditionally.. Therefore the answer is It converges conditionally.. Therefore the answer is It converges conditionally.. Therefore the answer is It converges conditionally.. Therefore the answer is It converges conditionally.. Therefore the answer is It converges conditionally..

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: It converges absolutely. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; It diverges because signs do not alternate term by term. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; It diverges by the term test. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.

    Prerequisites: Taylor and Maclaurin expansions, remainder estimates, asymptotic/error reasoning, and the prerequisite theorem named in the prompt.

    Further study: Review the relevant Taylor remainder theorem and a proof or derivation of the error estimate before attempting related extrapolation or error-propagation problems.
