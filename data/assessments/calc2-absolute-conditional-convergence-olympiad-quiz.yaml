  prompt: |-
    Let $a_n=(-1)^n n/(n^2+2(-1)^n)$. What does pairing $(a_{2k-1}+a_{2k})$ show about $\sum a_n$?
  choices:
  - id: a
    text: It converges conditionally because the paired terms are comparable to a convergent $1/k^2$ series, but $|a_n|$ is harmonic-size.
  - id: b
    text: It converges absolutely because paired terms converge.
  - id: c
    text: It diverges because neither the original signs nor magnitudes are monotone.
  - id: d
    text: It diverges by the term test.
  answer:
    choiceId: a
  explanation: |-
