glossary:
  introduction: 'These terms support quantitative reasoning about reversible reactions and their equilibrium compositions.'
  sections:
    - id: core
      title: Core equilibrium language
      entries:
        - { id: e1, term: reversible reaction, definition: 'A reaction that can proceed in both forward and reverse directions.', drills: [{ id: d1, type: flashcard, prompt: 'What does reversible mean?', answer: { expected: 'can proceed in both directions' }, explanation: 'Solution: It can proceed in both directions. Why it works: Products can react to form reactants.' }] }
        - { id: e2, term: dynamic equilibrium, definition: 'A state in which forward and reverse rates are equal while molecular change continues.', drills: [{ id: d2, type: flashcard, prompt: 'What two rates are equal at dynamic equilibrium?', answer: { expected: 'forward and reverse rates' }, explanation: 'Solution: Forward and reverse rates. Why it works: Equal rates give no net composition change.' }] }
        - { id: e3, term: equilibrium mixture, definition: 'The collection of reactant and product amounts present once equilibrium is reached.', drills: [{ id: d3, type: flashcard, prompt: 'Must concentrations be equal in an equilibrium mixture?', answer: { expected: 'no' }, explanation: 'Solution: No. Why it works: Equal rates do not require equal concentrations.' }] }
        - { id: e4, term: equilibrium constant, definition: 'The constant product-to-reactant activity ratio for a specified reaction at a specified temperature.', drills: [{ id: d4, type: flashcard, prompt: 'What condition fixes the value of K for a given reaction?', answer: { expected: 'temperature' }, explanation: 'Solution: Temperature. Why it works: K is temperature dependent.' }] }
        - { id: e5, term: Kc, definition: 'An equilibrium constant written using molar concentration terms.', drills: [{ id: d5, type: flashcard, prompt: 'What does the c in Kc indicate?', answer: { expected: 'concentration' }, explanation: 'Solution: Concentration. Why it works: Kc uses equilibrium molar concentrations.' }] }
        - { id: e6, term: reaction quotient, definition: 'The K-shaped ratio calculated from current rather than necessarily equilibrium values.', drills: [{ id: d6, type: flashcard, prompt: 'What does Q use that K does not?', answer: { expected: 'current concentrations or pressures' }, explanation: 'Solution: Current values. Why it works: Q diagnoses direction before equilibrium is reached.' }] }
        - { id: e7, term: equilibrium expression, definition: 'The products-over-reactants activity ratio with balanced-equation coefficients as exponents.', drills: [{ id: d7, type: flashcard, prompt: 'What becomes an exponent in an equilibrium expression?', answer: { expected: 'the balanced equation coefficient' }, explanation: 'Solution: The coefficient. Why it works: Stoichiometry controls each activity power.' }] }
        - { id: e8, term: homogeneous equilibrium, definition: 'An equilibrium in which all reacting species are in the same phase.', drills: [{ id: d8, type: flashcard, prompt: 'How many phases occur in a homogeneous equilibrium?', answer: { expected: 'one' }, explanation: 'Solution: One. Why it works: All reacting species share a phase.' }] }
    - id: calculations
      title: Calculations and response
      entries:
        - { id: e9, term: heterogeneous equilibrium, definition: 'An equilibrium involving more than one phase; pure solids and liquids have omitted activity factors.', drills: [{ id: d9, type: flashcard, prompt: 'Which pure phases are omitted from K?', answer: { expected: 'pure solids and liquids' }, explanation: 'Solution: Pure solids and liquids. Why it works: Their activities are treated as constant.' }] }
        - { id: e10, term: ICE table, definition: 'A table of Initial values, stoichiometric Changes, and Equilibrium values.', drills: [{ id: d10, type: flashcard, prompt: 'What do the letters ICE stand for?', answer: { expected: 'initial change equilibrium' }, explanation: 'Solution: Initial, Change, Equilibrium. Why it works: The table keeps reaction changes stoichiometrically linked.' }] }
        - { id: e11, term: equilibrium concentration, definition: 'The concentration of a species after the system has reached equilibrium.', drills: [{ id: d11, type: flashcard, prompt: 'Which row of an ICE table enters K?', answer: { expected: 'equilibrium row' }, explanation: 'Solution: The equilibrium row. Why it works: K is defined from the equilibrium composition.' }] }
        - { id: e12, term: net forward reaction, definition: 'The overall direction toward products when Q is less than K.', drills: [{ id: d12, type: flashcard, prompt: 'If Q<K, what is the net direction?', answer: { expected: 'toward products' }, explanation: 'Solution: Toward products. Why it works: Product ratio must increase to reach K.' }] }
        - { id: e13, term: net reverse reaction, definition: 'The overall direction toward reactants when Q is greater than K.', drills: [{ id: d13, type: flashcard, prompt: 'If Q>K, what is the net direction?', answer: { expected: 'toward reactants' }, explanation: 'Solution: Toward reactants. Why it works: Product ratio must decrease to reach K.' }] }
        - { id: e14, term: Le Châtelier response, definition: 'The net reaction direction that counteracts a concentration, pressure-volume, or temperature stress.', drills: [{ id: d14, type: flashcard, prompt: 'What comparison provides a quantitative stress prediction?', answer: { expected: 'Q compared with K' }, explanation: 'Solution: Compare Q with K. Why it works: The comparison identifies the required net change.' }] }
        - { id: e15, term: catalyst at equilibrium, definition: 'A substance that speeds forward and reverse reactions without changing K or equilibrium composition.', drills: [{ id: d15, type: flashcard, prompt: 'Does a catalyst change K at fixed temperature?', answer: { expected: 'no' }, explanation: 'Solution: No. Why it works: It changes both pathway rates rather than the thermodynamic ratio.' }] }
        - { id: e16, term: approximation check, definition: 'A numerical check that an assumed small ICE-table change is valid for the stated initial quantities.', drills: [{ id: d16, type: flashcard, prompt: 'Why check an ICE approximation?', answer: { expected: 'to verify the assumed change is small' }, explanation: 'Solution: To verify the change is small. Why it works: An unchecked approximation can distort the equilibrium result.' }] }
