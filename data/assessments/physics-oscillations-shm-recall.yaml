items:
- {id: shm-r1, type: cloze, prompt: 'Total ideal-SHM energy is $E={{\frac12kA^2}}$.', answer: {expected: '\frac12kA^2'}, explanation: 'Solution: Use $E=\frac{1}{2}kA^2$. Why it works: all mechanical energy equals the stored PE at maximum displacement.'}
- {id: shm-r2, type: typed, prompt: 'Where is potential energy maximum in SHM?', answer: {expected: 'at the amplitude (maximum displacement)'}, explanation: 'Solution: At maximum displacement. Why it works: the spring is most compressed or stretched, so PE is largest.'}
- {id: shm-r3, type: cloze, prompt: 'SHM position can be $x={{A\cos(\omega t+\phi)}}$.', answer: {expected: 'A\cos(\omega t+\phi)'}, explanation: 'Solution: Use $x=A\cos(\omega t+\phi)$. Why it works: it satisfies the SHM differential equation $\ddot x=-\omega^2 x$.'}
- {id: shm-r4, type: typed, prompt: 'What circular-motion quantity equals SHM amplitude?', answer: {expected: radius}, explanation: 'Solution: The radius. Why it works: SHM is the projection of uniform circular motion, and projection maximum equals the circle radius.'}
- {id: shm-r5, type: cloze, prompt: 'Angular frequency of a mass m on spring k is $\omega={{\sqrt{k/m}}}$.', answer: {expected: '\sqrt{k/m}'}, explanation: 'Solution: Use $\omega=\sqrt{k/m}$. Why it works: it follows from Newton''s second law applied to the restoring-force equation.'}
- {id: shm-r6, type: typed, prompt: 'What is the reference-circle projection called?', answer: {expected: simple harmonic motion}, explanation: 'Solution: Identify simple harmonic motion. Why it works: each coordinate of uniform circular motion varies sinusoidally.'}
- {id: pend-r1, type: cloze, prompt: 'For small angles, a simple pendulum has $T={{2\pi\sqrt{L/g}}}$.', answer: {expected: '2\pi\sqrt{L/g}'}, explanation: 'Solution: Use $T=2\pi\sqrt{L/g}$. Why it works: the small-angle restoring force produces SHM.'}
- {id: pend-r2, type: typed, prompt: 'Does simple-pendulum period depend on bob mass?', answer: {expected: no}, explanation: 'Solution: No. Why it works: mass cancels when the effective spring constant is substituted into the SHM period.'}
- {id: pend-r3, type: cloze, prompt: 'The approximation that makes pendulum motion SHM is $\sin\theta\approx{{\theta}}$.', answer: {expected: '\theta'}, explanation: 'Solution: Use $\sin\theta\approx\theta$. Why it works: it linearizes the restoring force for small angles.'}
- {id: pend-r4, type: typed, prompt: 'If pendulum length increases, does period increase or decrease?', answer: {expected: increase}, explanation: 'Solution: It increases. Why it works: $T$ is proportional to $\sqrt L$.'}
- {id: pend-r5, type: cloze, prompt: 'Higher gravity makes pendulum period {{shorter}}.', answer: {expected: shorter}, explanation: 'Solution: Identify shorter. Why it works: $T$ is inversely proportional to $\sqrt g$.'}
- {id: pend-r6, type: typed, prompt: 'What quantity replaces mass in the period formula for a physical pendulum?', answer: {expected: moment of inertia}, explanation: 'Solution: Use moment of inertia. Why it works: rotational inertia governs the angular acceleration of a rigid body.'}
