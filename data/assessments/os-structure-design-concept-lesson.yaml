lesson:
  introduction: 'This lesson introduces Operating System Structure and Design through the mental models emphasized by 1.7
    and 12 OS Structure and Design. Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: monolithic-kernel
    title: Monolithic kernel
    required: true
    content: 'A monolithic kernel keeps many OS services in one privileged address space for fast internal calls.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Monolithic does not mean unorganized; it means services share privileged space.

      '
    check:
      id: monolithic-kernel-check
      title: 'Check: Monolithic kernel'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Monolithic kernel**?

        '
      choices:
      - id: a
        text: A monolithic kernel keeps many OS services in one privileged address space for fast internal calls.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A monolithic kernel keeps many OS services in one privileged address space for fast internal calls. Related
        topic: Operating System Structure and Design.

        '
  - id: layered-design
    title: Layered design
    required: true
    content: 'Layering limits which components may depend on which other components, making reasoning easier at the cost of
      flexibility.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A layer violation can make the design harder to maintain.

      '
    check:
      id: layered-design-check
      title: 'Check: Layered design'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Layered design**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Layering limits which components may depend on which other components, making reasoning easier at the cost of
          flexibility.
      answer:
        choiceId: d
      explanation: 'Layering limits which components may depend on which other components, making reasoning easier at the
        cost of flexibility. Related topic: Operating System Structure and Design.

        '
  - id: microkernel
    title: Microkernel
    required: true
    content: 'A microkernel keeps only minimal mechanisms in the kernel and moves many services to user space.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Microkernels trade direct-call speed for isolation and modularity.

      '
    check:
      id: microkernel-check
      title: 'Check: Microkernel'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Microkernel**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: A microkernel keeps only minimal mechanisms in the kernel and moves many services to user space.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'A microkernel keeps only minimal mechanisms in the kernel and moves many services to user space. Related
        topic: Operating System Structure and Design.

        '
  - id: client-server-model
    title: Client-server model
    required: true
    content: 'OS services can be represented as servers that respond to client requests through message passing.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      The model is about structure, not necessarily network distribution.

      '
    check:
      id: client-server-model-check
      title: 'Check: Client-server model'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Client-server model**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: OS services can be represented as servers that respond to client requests through message passing.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'OS services can be represented as servers that respond to client requests through message passing. Related
        topic: Operating System Structure and Design.

        '
  - id: virtual-machines
    title: Virtual machines
    required: true
    content: 'A virtual machine presents a hardware-like interface so multiple isolated systems can share one physical host.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A VM is not just an application window; it virtualizes a machine boundary.

      '
    check:
      id: virtual-machines-check
      title: 'Check: Virtual machines'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Virtual machines**?

        '
      choices:
      - id: a
        text: A virtual machine presents a hardware-like interface so multiple isolated systems can share one physical host.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A virtual machine presents a hardware-like interface so multiple isolated systems can share one physical
        host. Related topic: Operating System Structure and Design.

        '
  - id: mechanism-versus-policy
    title: Mechanism versus policy
    required: true
    content: 'Mechanism provides what can be done; policy decides which choice should be made.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Mixing policy into mechanism makes later change harder.

      '
    check:
      id: mechanism-versus-policy-check
      title: 'Check: Mechanism versus policy'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Mechanism versus policy**?

