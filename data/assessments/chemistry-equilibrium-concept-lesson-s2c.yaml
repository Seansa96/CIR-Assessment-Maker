schemaVersion: 1
id: chemistry-equilibrium-concept-lesson-s2c
title: 'Chemical Equilibrium: Dynamic Balance and Quantitative Prediction'
assessmentType: conceptLesson
categoryId: chemistry
topicId: chemistry-equilibrium
modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [chemistry, equilibrium] }
authoring: { visualRequirement: required, visualRationale: 'Concentration-time and stress-response visuals distinguish dynamic balance from a stopped reaction.', sourceId: src-20260720035703-91ea51b0d8 }
lesson:
  introduction: 'Equilibrium is a dynamic state: opposing reactions continue, but their equal rates leave macroscopic concentrations constant. Use K and Q to turn that model into a testable prediction.'
  sections:
    - id: dynamic
      title: Dynamic does not mean unchanged molecules
      required: true
      content: 'At equilibrium, forward and reverse reactions continue at equal rates. Concentrations are constant, not necessarily equal.'
      media: [{ type: image, src: /media/chemistry/equilibrium-concentration-time.svg, alt: Reactant and product concentrations flatten after dynamic equilibrium is reached., caption: Equal rates produce constant concentrations. }]
      check: { id: c1, type: multipleChoice, prompt: 'Which statement is true at dynamic equilibrium?', choices: [{ id: a, text: 'Forward and reverse rates are equal.' }, { id: b, text: 'All molecular change stops.' }, { id: c, text: 'Reactant and product concentrations must be equal.' }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: Equal opposing rates give no net concentration change. Why the other choices fail: b denies ongoing reactions; c confuses equal rates with equal concentrations.' }
    - id: constant
      title: K describes an equilibrium composition
      required: true
      content: 'For $aA+bB\rightleftharpoons cC+dD$, $K_c=[C]^c[D]^d/[A]^a[B]^b$. Pure solids and liquids are omitted.'
      check: { id: c2, type: multipleChoice, prompt: 'For $A+2B\rightleftharpoons C$, which is $K_c$?', choices: [{ id: a, text: '$[C]/([A][B]^2)$' }, { id: b, text: '$[C]/([A]+2[B])$' }, { id: c, text: '$[A][B]^2/[C]$' }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: Coefficients become exponents and products are numerator factors. Why the other choices fail: b uses stoichiometric addition; c reverses products and reactants.' }
    - id: quotient
      title: Q gives the direction before equilibrium
      required: true
      content: 'Construct Q with the same expression as K but use current values. If $Q<K$, net reaction proceeds forward; if $Q>K$, it proceeds reverse.'
      check: { id: c3, type: multipleChoice, prompt: 'If $Q<K$, what net change occurs?', choices: [{ id: a, text: 'toward products' }, { id: b, text: 'toward reactants' }, { id: c, text: 'no change' }], answer: { choiceId: a }, explanation: 'Solution: Toward products. Why it works: The product-to-reactant ratio is too small. Why the other choices fail: b corrects an overly large Q; c requires Q=K.' }
    - id: ice
      title: ICE tables protect stoichiometric bookkeeping
      required: true
      content: 'Record initial concentrations, signed changes tied to coefficients, and equilibrium concentrations before substituting into K.'
      check: { id: c4, type: multipleChoice, prompt: 'For $A\rightleftharpoons2B$, if A changes by $-x$, B changes by', choices: [{ id: a, text: '$+2x$' }, { id: b, text: '$+x$' }, { id: c, text: '$-2x$' }], answer: { choiceId: a }, explanation: 'Solution: $+2x$. Why it works: Two B form for every A consumed. Why the other choices fail: b ignores the coefficient; c has the product sign wrong.' }
    - id: stresses
      title: A stress changes Q before the system responds
      required: true
      content: 'Concentration or volume changes alter Q immediately; the net reaction then moves until Q again equals K at the same temperature.'
      media: [{ type: image, src: /media/chemistry/equilibrium-stress-response.svg, alt: Adding reactant lowers Q below K and causes a net forward change., caption: Use Q versus K instead of memorizing arrows. }]
      check: { id: c5, type: multipleChoice, prompt: 'Adding a reactant to an equilibrium mixture usually makes Q', choices: [{ id: a, text: 'smaller' }, { id: b, text: 'larger' }, { id: c, text: 'unchanged' }], answer: { choiceId: a }, explanation: 'Solution: Smaller. Why it works: A reactant factor is in Q denominator. Why the other choices fail: b reverses the fraction effect; c ignores the imposed concentration change.' }
    - id: temperature
      title: Temperature can change K; a catalyst cannot
      required: true
      content: 'A catalyst speeds both directions and shortens time to equilibrium without changing K. Temperature changes relative rate constants and can change K.'
      check: { id: c6, type: multipleChoice, prompt: 'Which change can alter K?', choices: [{ id: a, text: temperature }, { id: b, text: catalyst }, { id: c, text: adding inert gas at constant volume }], answer: { choiceId: a }, explanation: 'Solution: Temperature. Why it works: K depends on temperature. Why the other choices fail: b changes approach speed; c does not change reacting species activities in this model.' }
