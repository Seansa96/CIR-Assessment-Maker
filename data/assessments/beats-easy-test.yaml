  type: numericResponse
  skills:
  - physics-beats
  prompt: On a day when the air temperature is 25.7 degrees Celsius... A lightning
    strike is seen, and thunder is heard 2.27 s later. How far away is the strike
    in meters?
  answer:
    value: 784.9
    tolerance: 0.05
  explanation: d = v*t = 346.42 * 2.27 = 784.9 m.
