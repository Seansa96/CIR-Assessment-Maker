questions:
- id: q001
  type: numericResponse
  skills:
  - physics-beats
  prompt: Use the Beats diagram and the model $f_b=|f_1-f_2|$. A calibrated scenario scales the reference
    values by 1.1. Determine the beat frequency. Give a numerical answer.
  answer:
    value: 6.6
    tolerance: 0.066
  explanation: Apply $f_b=|f_1-f_2|$ consistently to the scaled scenario; the requested beat frequency
    is 6.6.
  media:
  - type: image
    src: /media/physics/owa/beats.svg
    alt: Labeled original schematic for Beats used for quantitative analysis.
    caption: Beats model diagram.
