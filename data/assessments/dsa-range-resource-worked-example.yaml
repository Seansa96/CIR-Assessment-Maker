workedExamples:
- id: we001
  title: Trace a Range, Bit, and Resource-Constrained Techniques decision
  problem: 'Work through a realistic case: telemetry on a low-memory device. Select an approach, preserve its invariant, and explain the tradeoff.'
  steps:
  - title: Recognize the workload
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: 'Which requirement matters most in this scenario: telemetry on a low-memory device?'
    choices:
    - id: a
      text: The access pattern and bound
    - id: b
      text: The name of the structure
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: The access pattern and bound. The trace follows the module invariant and workload.
    id: step-1
  - title: Protect the invariant
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: What must the update preserve?
    choices:
    - id: a
      text: a fixed-capacity structure never writes outside its reserved storage
    - id: b
      text: Only the output formatting
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: a fixed-capacity structure never writes outside its reserved storage. The trace follows the module invariant and workload.
    id: step-2
  - title: Choose the implementation
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: Which implementation action fits Range, Bit, and Resource-Constrained Techniques?
    choices:
    - id: a
      text: a fixed C++ ring buffer
    - id: b
      text: Scan unrelated data repeatedly
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: a fixed C++ ring buffer. The trace follows the module invariant and workload.
    id: step-3
