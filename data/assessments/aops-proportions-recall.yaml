schemaVersion: 1
id: aops-proportions-recall
title: Proportions Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-proportions
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - art-of-problem-solving
  - aops-proportions
  - ratio-vocabulary
skills:
- Recall proportional invariants, percent factors, and scale rules
- Recognize unit and baseline checks
items:
- id: ratio-order
  type: flashcard
  prompt: Why is $a:b$ generally different from $b:a$?
  answer:
    expected: The order determines which quantity is divided by which; reversing gives the reciprocal.
  explanation: Ratios are ordered comparisons.
  tags: [ratio]
- id: proportion-domain
  type: flashcard
  prompt: What restrictions accompany $a/b=c/d$?
  answer:
    expected: b and d must be nonzero.
  explanation: The original ratios must be defined.
  tags: [proportion]
- id: direct-invariant
  type: typed
  prompt: Complete the direct-variation invariant $y/x=$ ____.
  answer:
    expected: k
    aliases: [constant, a constant]
  explanation: Direct variation keeps a ratio constant.
  tags: [direct-variation]
- id: inverse-invariant
  type: typed
  prompt: Complete the inverse-variation invariant $xy=$ ____.
  answer:
    expected: k
    aliases: [constant, a constant]
  explanation: Inverse variation keeps a product constant.
  tags: [inverse-variation]
- id: unit-rate-definition
  type: flashcard
  prompt: What makes a rate a unit rate?
  answer:
    expected: Its denominator quantity is one unit.
  explanation: Unit rates support direct comparison and scaling.
  tags: [unit-rate]
- id: conversion-orientation
  type: flashcard
  prompt: How do units show whether a conversion factor is oriented correctly?
  answer:
    expected: The unwanted unit cancels and the desired unit remains.
  explanation: Unit cancellation is an algebraic verification.
  tags: [conversion-factor]
- id: percent-increase-factor
  type: flashcard
  prompt: What multiplier represents an $r\%$ increase?
  answer:
    expected: 1+r/100
  explanation: Keep the whole original amount and add the fractional increase.
  tags: [percent]
- id: percent-decrease-factor
  type: flashcard
  prompt: What multiplier represents an $r\%$ decrease?
  answer:
    expected: 1-r/100
  explanation: The remaining proportion is 100% minus the decrease.
  tags: [percent]
- id: percent-change-baseline
  type: flashcard
  prompt: What is the baseline for ordinary percent change?
  answer:
    expected: The original amount.
  explanation: Divide the change by the starting reference amount.
  tags: [percent-change]
- id: area-scale-rule
  type: flashcard
  prompt: How does area scale under linear scale factor $s$?
  answer:
    expected: By s squared.
    aliases: ['$s^2$']
  explanation: Area contains two independent length factors.
  tags: [scale-factor]
- id: volume-scale-rule
  type: flashcard
  prompt: How does volume scale under linear scale factor $s$?
  answer:
    expected: By s cubed.
    aliases: ['$s^3$']
  explanation: Volume contains three independent length factors.
  tags: [scale-factor]
- id: concentration-invariant
  type: flashcard
  prompt: How is mixture concentration computed?
  answer:
    expected: Divide the component amount by the total mixture amount.
  explanation: Both numerator and total denominator may change when material is added.
  tags: [concentration]
