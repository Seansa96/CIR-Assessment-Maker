questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Look at the following C# code:
      
      ```csharp
      int stamina = 40;
      
      if (stamina > 50)
      {
          Console.WriteLine("Sprint");
      }
      else if (stamina > 20)
      {
          Console.WriteLine("Jog");
      }
      if (stamina < 100)
      {
          Console.WriteLine("Not Max");
      }
      ```
      
      What will be printed?
    choices:
      - id: a
        text: |
          `Jog`
          `Not Max`
      - id: b
        text: '`Jog`'
      - id: c
        text: '`Not Max`'
      - id: d
        text: |
          `Sprint`
          `Jog`
          `Not Max`
    answer:
      choiceId: a
    explanation: |
      Because `stamina > 20` is true, the `else if` block prints "Jog". Then, a COMPLETELY NEW `if` statement begins. Since `40 < 100` is also true, it prints "Not Max".

  - id: q002
    type: multipleChoice
    prompt: |
      Which code correctly loops exactly 5 times?
    choices:
      - id: a
        text: '`for (int i = 0; i <= 4; i++)`'
      - id: b
        text: '`for (int i = 1; i < 5; i++)`'
      - id: c
        text: '`for (int i = 0; i <= 5; i++)`'
      - id: d
        text: '`while (5)`'
    answer:
      choiceId: a
    explanation: |
      `i = 0, 1, 2, 3, 4` is exactly 5 iterations. Option B loops 4 times (1, 2, 3, 4). Option C loops 6 times (0, 1, 2, 3, 4, 5). Option D is invalid C# syntax because `while` requires a boolean condition.

  - id: q003
    type: numericResponse
    prompt: |
      Trace this `while` loop:
      
      ```csharp
      int combo = 0;
      while (combo < 3)
      {
          combo++;
      }
      Console.WriteLine(combo);
      ```
      
      What is printed?
    answer:
      value: 3
      tolerance: 0
    explanation: |
      Loop starts. Combo=0. 0<3 is True. Combo becomes 1.
      Loop continues. 1<3 is True. Combo becomes 2.
      Loop continues. 2<3 is True. Combo becomes 3.
      Loop checks 3<3. This is False. The loop ends. `3` is printed.

  - id: q004
    type: multipleChoice
    prompt: |
      You are writing a standard `switch` statement over an `int classId`. What happens if `classId` is `5`, but you only wrote cases for `1`, `2`, and `3`, and you did NOT include a `default` case?
    choices:
      - id: a
        text: The switch statement is skipped silently and the program continues.
      - id: b
        text: The compiler throws an error forcing you to write a default case.
      - id: c
        text: The program crashes at runtime.
      - id: d
        text: It runs the first case automatically.
    answer:
      choiceId: a
    explanation: |
      In a standard C# `switch` statement, if no case matches and there is no `default`, it just silently skips the switch block. (Note: This is different from C# 8 *switch expressions*, which DO throw an exception if there's no default `_` and no match).
