workedExamples:
- id: aops-exponents-logarithms-problem-1
  title: Simplifying fractional and negative exponents
  problem: |-
    For $x>0$, simplify

    $$
    \frac{(16x^{-4})^{3/4}}{2x^{-1}}
    $$

    and write the result using only positive exponents.
  steps:
  - id: aops-exponents-logarithms-p1-s1
    title: Read the restriction before using a fractional power
    instruction: |-
      The given condition $x>0$ ensures that the fourth root implicit in the exponent $3/4$ is real and that dividing by powers of $x$ is legal. It also lets us write $(x^{-4})^{3/4}=x^{-3}$ without an absolute-value ambiguity.
    type: multipleChoice
    prompt: Why is the condition $x>0$ useful here?
    choices:
    - id: a
      text: It makes the fractional power real and removes sign ambiguity when taking fourth roots.
    - id: b
      text: It allows the exponents 3 and 4 to be added.
    - id: c
      text: It makes every power of $x$ equal to 1.
    - id: d
      text: It permits division by zero.
    answer:
      choiceId: a
    explanation: Even-index roots and negative exponents require domain checks; $x>0$ handles both concerns.
  - id: aops-exponents-logarithms-p1-s2
    title: Apply the power to each factor
    instruction: |-
      Use $(ab)^r=a^rb^r$ on the positive quantities $16$ and $x^{-4}$:

      $$
      (16x^{-4})^{3/4}=16^{3/4}(x^{-4})^{3/4}.
      $$

      Since $16^{1/4}=2$, we have $16^{3/4}=2^3=8$. Multiplying exponents gives $(x^{-4})^{3/4}=x^{-3}$.
    type: multipleChoice
    prompt: What is the numerator after this step?
    choices:
    - id: a
      text: '$8x^{-3}$'
    - id: b
      text: '$12x^{-1}$'
    - id: c
      text: '$8x^{-1}$'
    - id: d
      text: '$2x^{-3}$'
    answer:
      choiceId: a
    explanation: Take the fourth root of 16 before cubing, and multiply $-4$ by $3/4$.
  - id: aops-exponents-logarithms-p1-s3
    title: Simplify the quotient coefficient and exponent
    instruction: |-
      Substitute the simplified numerator:

      $$
      \frac{8x^{-3}}{2x^{-1}}=4x^{-3-(-1)}=4x^{-2}.
      $$

      Division of like bases subtracts the denominator exponent. The double negative is why the resulting exponent is $-2$, not $-4$.
    type: multipleChoice
    prompt: Which exponent remains on $x$ after division?
    choices:
    - id: a
      text: '$-4$'
    - id: b
      text: '$-2$'
    - id: c
      text: '$2$'
    - id: d
      text: '$4$'
    answer:
      choiceId: b
    explanation: The quotient law gives $-3-(-1)=-2$.
  - id: aops-exponents-logarithms-p1-s4
    title: Convert to positive-exponent form
    instruction: |-
      A negative exponent indicates a reciprocal:

      $$
      4x^{-2}=\frac4{x^2}.
      $$

      This is the requested positive-exponent form.
    type: multipleChoice
    prompt: Which expression uses only positive exponents and is equivalent to $4x^{-2}$?
    choices:
    - id: a
      text: '$-4x^2$'
    - id: b
      text: '$\frac{x^2}{4}$'
    - id: c
      text: '$\frac4{x^2}$'
    - id: d
      text: '$\frac1{4x^2}$'
    answer:
      choiceId: c
    explanation: Moving $x^{-2}$ across the fraction bar changes its exponent to $2$; the coefficient 4 stays in the numerator.
  - id: aops-exponents-logarithms-p1-s5
    title: Verify with an allowed value
    instruction: |-
      Check $x=2$. The original expression becomes

      $$
      \frac{(16\cdot2^{-4})^{3/4}}{2\cdot2^{-1}}=\frac{1^{3/4}}1=1.
      $$

      The simplified expression gives $4/2^2=1$. The matching values support the algebra, and $x=2$ obeys the original restriction.
    type: multipleChoice
    prompt: Why does checking $x=0$ provide no valid verification?
    choices:
    - id: a
      text: Zero is excluded because the original expression contains negative powers of $x$.
    - id: b
      text: Zero makes the simplified answer too large.
    - id: c
      text: Fractional exponents can never be checked numerically.
    - id: d
      text: The coefficient 16 requires $x=16$.
    answer:
      choiceId: a
    explanation: A verification value must belong to the original domain; $x=0$ does not.
- id: aops-exponents-logarithms-problem-2
  title: A repeated power becomes a quadratic
  problem: |-
    Solve for all real $x$:

    $$
    4^x-5\cdot2^x+4=0.
    $$
  steps:
  - id: aops-exponents-logarithms-p2-s1
    title: Recognize the repeated exponential quantity
    instruction: |-
      Because $4^x=(2^2)^x=(2^x)^2$, both exponential terms are powers of the same positive quantity. Set

      $$u=2^x,$$

      remembering that $u>0$ for every real $x$.
    type: multipleChoice
    prompt: Why is $u=2^x$ a better substitution than $u=x$?
    choices:
    - id: a
      text: It turns $4^x$ into $u^2$ and $2^x$ into $u$.
    - id: b
      text: It makes $4^x$ equal to $4u$.
    - id: c
      text: It removes the constant term 4.
    - id: d
      text: It allows $u$ to be any negative number.
    answer:
      choiceId: a
    explanation: The expression has quadratic structure in the repeated quantity $2^x$.
  - id: aops-exponents-logarithms-p2-s2
    title: Solve the transformed quadratic
    instruction: |-
      The equation becomes

      $$u^2-5u+4=0.$$

      Factor by finding two numbers whose product is 4 and whose sum is $-5$:

      $$(u-1)(u-4)=0.$$

      Thus $u=1$ or $u=4$. Both satisfy the inherited condition $u>0$.
    type: multipleChoice
    prompt: Which factorization is correct?
    choices:
    - id: a
      text: '$(u+1)(u+4)$'
    - id: b
      text: '$(u-1)(u-4)$'
    - id: c
      text: '$(u-2)^2$'
    - id: d
      text: '$(u+1)(u-4)$'
    answer:
      choiceId: b
    explanation: Expanding gives $u^2-5u+4$.
  - id: aops-exponents-logarithms-p2-s3
    title: Return to the original variable
    instruction: |-
      Undo the substitution separately for each value:

      $$2^x=1=2^0\quad\Longrightarrow\quad x=0,$$

      $$2^x=4=2^2\quad\Longrightarrow\quad x=2.$$

      The exponential function with base 2 is one-to-one, so each equation contributes exactly one real solution.
    type: multipleChoice
    prompt: Which solution set follows from $u=1$ or $u=4$?
    choices:
    - id: a
      text: '$\{1,4\}$'
    - id: b
      text: '$\{0,2\}$'
    - id: c
      text: '$\{-1,-4\}$'
    - id: d
      text: '$\{2,4\}$'
    answer:
      choiceId: b
    explanation: Solve $2^x=1$ and $2^x=4$, not $x=1$ and $x=4$.
  - id: aops-exponents-logarithms-p2-s4
    title: Verify both candidates in the original equation
    instruction: |-
      At $x=0$, the left side is $1-5+4=0$. At $x=2$, it is $16-20+4=0$. Both candidates satisfy the original equation.

      Verification matters because substitutions and later algebra can introduce restrictions or mistakes even when the strategy is sound.
    type: multipleChoice
    prompt: What does direct substitution establish here?
    choices:
    - id: a
      text: Both $x=0$ and $x=2$ satisfy the original equation.
    - id: b
      text: Only $x=2$ satisfies the original equation.
    - id: c
      text: The substitution $u=2^x$ was invalid.
    - id: d
      text: Every real number is a solution.
    answer:
      choiceId: a
    explanation: Each candidate makes the original left side equal to zero.
  - id: aops-exponents-logarithms-p2-s5
    title: Identify the reusable pattern
    instruction: |-
      Whenever an equation contains $a^{2x}$ and $a^x$, or equivalent expressions such as $4^x$ and $2^x$, test whether $u=a^x$ creates a polynomial. Carry the restriction $u>0$, solve the polynomial, and then convert each admissible $u$ back to $x$.
    type: multipleChoice
    prompt: Which equation has the same repeated-power structure?
    choices:
    - id: a
      text: '$9^x-7\cdot3^x+12=0$'
    - id: b
      text: '$3^x+x=7$'
    - id: c
      text: '$x^3-7x+12=0$'
    - id: d
      text: '$\log_3x=7$'
    answer:
      choiceId: a
    explanation: Since $9^x=(3^x)^2$, setting $u=3^x$ produces a quadratic.
- id: aops-exponents-logarithms-problem-3
  title: Reciprocal symmetry in an exponential equation
  problem: |-
    Solve for all real $x$:

    $$
    2^x+2^{-x}=\frac52.
    $$
  steps:
  - id: aops-exponents-logarithms-p3-s1
    title: Expose the reciprocal pair
    instruction: |-
      Let $u=2^x$. Then $u>0$ and the negative exponent gives

      $$2^{-x}=\frac1{2^x}=\frac1u.$$

      The equation becomes $u+1/u=5/2$. The reciprocal form suggests that solutions may occur in pairs $u$ and $1/u$, corresponding to exponents $x$ and $-x$.
    type: multipleChoice
    prompt: Under $u=2^x$, what does $2^{-x}$ become?
    choices:
    - id: a
      text: '$-u$'
    - id: b
      text: '$u^{-1}=\frac1u$'
    - id: c
      text: '$u-1$'
    - id: d
      text: '$\frac1x$'
    answer:
      choiceId: b
    explanation: Negating an exponent takes the reciprocal of the corresponding power.
  - id: aops-exponents-logarithms-p3-s2
    title: Clear the denominator without losing the restriction
    instruction: |-
      Multiply $u+1/u=5/2$ by $2u$. This is legal because $u=2^x>0$, so $u\ne0$:

      $$2u^2+2=5u,$$

      or

      $$2u^2-5u+2=0.$$
    type: multipleChoice
    prompt: Which transformed equation is equivalent under $u>0$?
    choices:
    - id: a
      text: '$2u^2-5u+2=0$'
    - id: b
      text: '$2u^2-5u=0$'
    - id: c
      text: '$u^2-5u+1=0$'
    - id: d
      text: '$2u-5+2/u=0$'
    answer:
      choiceId: a
    explanation: Multiplying every term by $2u$ gives $2u^2+2=5u$.
  - id: aops-exponents-logarithms-p3-s3
    title: Factor and interpret reciprocal roots
    instruction: |-
      Factor the quadratic:

      $$(2u-1)(u-2)=0.$$

      Therefore $u=1/2$ or $u=2$. Their product is 1, matching the reciprocal symmetry anticipated from $u+1/u$.
    type: multipleChoice
    prompt: What are the admissible values of $u$?
    choices:
    - id: a
      text: '$u=-2,-\frac12$'
    - id: b
      text: '$u=1,2$'
    - id: c
      text: '$u=\frac12,2$'
    - id: d
      text: '$u=\frac25,1$'
    answer:
      choiceId: c
    explanation: Both roots are positive and reciprocal, so both meet the substitution restriction.
  - id: aops-exponents-logarithms-p3-s4
    title: Convert back to exponents
    instruction: |-
      From $2^x=2$, we get $x=1$. From $2^x=1/2=2^{-1}$, we get $x=-1$. Thus the candidate solution set is

      $$\{-1,1\}.$$
    type: multipleChoice
    prompt: Why does $u=1/2$ produce $x=-1$?
    choices:
    - id: a
      text: Because $2^{-1}=1/2$.
    - id: b
      text: Because a fraction always has exponent $-1$.
    - id: c
      text: Because $2^{1/2}=-1$.
    - id: d
      text: Because $u$ and $x$ are equal.
    answer:
      choiceId: a
    explanation: Rewrite $1/2$ as a power with base 2 before equating exponents.
  - id: aops-exponents-logarithms-p3-s5
    title: Verify symmetry and the original equation
    instruction: |-
      For $x=1$, the left side is $2+1/2=5/2$. For $x=-1$, the two terms exchange places, so the sum is again $5/2$.

      This final check both verifies the solutions and explains why they occur as a positive-negative pair: the original expression is unchanged when $x$ is replaced by $-x$.
    type: multipleChoice
    prompt: Which structural fact explains the paired solutions?
    choices:
    - id: a
      text: Replacing $x$ by $-x$ swaps the two addends without changing their sum.
    - id: b
      text: Every exponential equation has two solutions.
    - id: c
      text: The base 2 can be replaced by $-2$.
    - id: d
      text: Negative exponents always produce negative values.
    answer:
      choiceId: a
    explanation: The equation is symmetric under $x\mapsto -x$, so nonzero solutions naturally appear in opposite pairs.
