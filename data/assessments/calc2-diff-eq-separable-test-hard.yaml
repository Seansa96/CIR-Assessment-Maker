navigation: { learningGoal: evaluate, activityType: formalTest, tags: [calculus-2, separable-equations, differential-equations] }
questions:
- id: q001
  type: symbolicResponse
  skills: [solve nonlinear separable IVPs]
  prompt: Solve $y'=y^2$ with $y(0)=1$.
  answer: { expectedLatex: '1/(1-x)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: 'Integrating the reciprocal-square expression gives negative one over y equals x plus C.' }
- id: q002
  type: numericResponse
  skills: [solve nonlinear separable IVPs]
  prompt: For that solution, find $y(0.5)$.
  answer: { value: 2, tolerance: 0.001 }
  explanation: Substitute $x=0.5$ into $1/(1-x)$.
- id: q003
  type: numericResponse
  skills: [preserve equilibria]
  prompt: For $y'=y^2(y-3)$, how many distinct equilibrium solutions exist?
  answer: { value: 2, tolerance: 0.001 }
  explanation: The distinct roots are 0 and 3.
- id: q004
  type: symbolicResponse
  skills: [analyze logistic models]
  prompt: Enter the two factors of the logistic equation $P'=kP(M-P)$ that determine its equilibria.
  answer: { expectedLatex: 'P*(M-P)', equivalenceMode: expression, tolerance: 0.000001, variables: [P, M], explanation: Ignoring nonzero constant k, the product vanishes at $P=0$ and $P=M$. }
- id: q005
  type: numericResponse
  skills: [analyze logistic models]
  prompt: For $P'=0.1P(50-P)$, evaluate $P'$ at $P=20$.
  answer: { value: 60, tolerance: 0.001 }
  explanation: $0.1(20)(30)=60$.
