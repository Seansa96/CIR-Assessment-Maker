workedExamples:
- id: l3-sec1
  title: Equipotential Surfaces
  explanation: An equipotential surface is a region where the electric potential is
    constant. No work is done moving a charge along an equipotential surface. Electric
    field lines are always perpendicular to equipotential surfaces.
- id: l3-sec2
  title: Obtaining E from V
  explanation: 'The electric field is the negative gradient of the potential: $\vec{E}
    = -\nabla V$. In 1D, this is $E_x = -\frac{dV}{dx}$.'
