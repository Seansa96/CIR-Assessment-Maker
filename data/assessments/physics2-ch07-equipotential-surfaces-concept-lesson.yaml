lesson:
  introduction: >
    This lesson develops a repeatable way to solve Equipotential Surfaces & the Gradient problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch07-equipotential-surfaces-s1
    title: Name the model and quantities
    required: true
    content: >
      Equipotential Surfaces & the Gradient uses Delta V = - integral(E dot dl). In the name the model and quantities stage, read field direction perpendicular to equipotentials and use potential difference instead of path length alone.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Equipotential Surfaces & the Gradient problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch07-equipotential-surfaces-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Equipotential Surfaces & the Gradient, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use Delta V = - integral(E dot dl) after you read field direction perpendicular to equipotentials and use potential difference instead of path length alone.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Equipotential Surfaces & the Gradient problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-equipotential-surfaces-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables Delta V = - integral(E dot dl) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-equipotential-surfaces-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Equipotential Surfaces & the Gradient.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-equipotential-surfaces-units-error
          domains:
          - physics-2
      answer:
