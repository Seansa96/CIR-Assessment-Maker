workedExamples:
- id: aops-coord-geom-we-1
  title: Proof by Coordinate Placement
  steps:
  - id: step-1
    title: Place the triangle on the grid
    prompt: Set up a Cartesian coordinate system. Place the right angle at the most convenient location
      and assign coordinates to the vertices.
    difficultyDimensions:
    - Select the origin for the right angle.
    - Assign variable coordinates along the axes.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Place the right angle $C$ at $(0,0)$.
      - Place vertex $A$ on the $y$-axis at $(0, 2a)$.
      - Place vertex $B$ on the $x$-axis at $(2b, 0)$.
    explanation: 'Solution:

      Let the right triangle be $\triangle ABC$ with the right angle at $C$.

      The most strategic placement is to put $C$ at the origin $(0,0)$, so the legs lie on the $x$ and
      $y$ axes.

      Let $A$ be on the $y$-axis and $B$ be on the $x$-axis.

      To avoid fractions when finding the midpoint, assign even coordinates: let $A$ be $(0, 2a)$ and
      $B$ be $(2b, 0)$.


      Why it works:

      Placing the right angle at the origin automatically handles the perpendicularity of the legs. Using
      $2a$ and $2b$ proactively prevents messy $\frac{1}{2}$ fractions in the next step.

      '
    instruction: 'Work through this step: Set up a Cartesian coordinate system. Place the right angle
      at the most convenient location and assign coordinates to the vertices.'
    type: freeResponse
  - id: step-2
    title: Find the midpoint
    prompt: Calculate the coordinates of the midpoint $M$ of the hypotenuse $AB$.
    difficultyDimensions:
    - Apply the midpoint formula to the variable coordinates.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $M = \left( \frac{0 + 2b}{2}, \frac{2a + 0}{2} \right)$.
      - $M = (b, a)$.
    explanation: 'Solution:

      The hypotenuse is the segment $AB$ with endpoints $(0, 2a)$ and $(2b, 0)$.

      Using the midpoint formula:

      $M = \left( \frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2} \right) = \left( \frac{0 + 2b}{2}, \frac{2a
      + 0}{2} \right) = (b, a)$.


      Why it works:

      The midpoint formula strictly algebraically computes the average position.

      '
    instruction: 'Work through this step: Calculate the coordinates of the midpoint $M$ of the hypotenuse
      $AB$.'
    type: freeResponse
  - id: step-3
    title: Compute and compare the distances
    prompt: Calculate the squared distances from the midpoint $M$ to each of the three vertices $A, B,$
      and $C$ to prove they are equal.
    difficultyDimensions:
    - Apply the distance formula from $M$ to $C$.
    - Apply the distance formula from $M$ to $A$ and $B$.
    - Show all three squared distances are identical.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $MC^2 = (b - 0)^2 + (a - 0)^2 = a^2 + b^2$.
      - $MA^2 = (b - 0)^2 + (a - 2a)^2 = b^2 + (-a)^2 = a^2 + b^2$.
      - $MB^2 = (b - 2b)^2 + (a - 0)^2 = (-b)^2 + a^2 = a^2 + b^2$.
      - Since $MC^2 = MA^2 = MB^2$, the distances are equal.
    explanation: 'Solution:

      Using the squared distance formula $d^2 = \Delta x^2 + \Delta y^2$:

      Distance to $C(0,0)$: $MC^2 = (b-0)^2 + (a-0)^2 = b^2 + a^2$.

      Distance to $A(0,2a)$: $MA^2 = (b-0)^2 + (a-2a)^2 = b^2 + (-a)^2 = b^2 + a^2$.

      Distance to $B(2b,0)$: $MB^2 = (2b-b)^2 + (0-a)^2 = b^2 + (-a)^2 = b^2 + a^2$.

      Because $MA^2 = MB^2 = MC^2$, we conclude $MA = MB = MC$. The midpoint of the hypotenuse is equidistant
      from all vertices.


      Why it works:

      By placing the triangle on the grid, a classic Euclidean proof involving auxiliary lines or circles
      is reduced to three lines of foolproof polynomial arithmetic.

      '
    instruction: 'Work through this step: Calculate the squared distances from the midpoint $M$ to each
      of the three vertices $A, B,$ and $C$ to prove they are equal.'
    type: freeResponse
  problem: Prove that the midpoint of the hypotenuse of a right triangle is equidistant from all three
    vertices.
- id: aops-coord-geom-we-2
  title: Intersection of a Line and a Circle
  steps:
  - id: aops-coord-geom-we-2-step-1
    title: Write the equation of the circle
    prompt: Write the algebraic equation for the circle.
    difficultyDimensions:
    - Identify the center and radius.
    - Write in standard $(x-h)^2 + (y-k)^2 = r^2$ form.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Center is $(0,0)$ and $r=5$.
      - $x^2 + y^2 = 25$.
    explanation: 'Solution:

      The circle is centered at the origin, so $h=0$ and $k=0$. The radius is 5.

      The equation is $x^2 + y^2 = 5^2$, which simplifies to:

      $$x^2 + y^2 = 25$$


      Why it works:

      This is the direct translation of "all points distance 5 from the origin" via the Pythagorean theorem.

      '
    instruction: 'Work through this step: Write the algebraic equation for the circle.'
    type: freeResponse
  - id: aops-coord-geom-we-2-step-2
    title: Write the equation of the line
    prompt: Find the slope and $y$-intercept of the line, then write its equation.
    difficultyDimensions:
    - Calculate slope from the two points.
    - Identify the $y$-intercept.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Slope $m = \frac{5 - (-5)}{10 - 0} = \frac{10}{10} = 1$.
      - The point $(0, -5)$ is the $y$-intercept, so $b = -5$.
      - 'Equation: $y = x - 5$.'
    explanation: 'Solution:

      First find the slope between $(0, -5)$ and $(10, 5)$:

      $$m = \frac{5 - (-5)}{10 - 0} = \frac{10}{10} = 1$$

      The line crosses the $y$-axis at $(0, -5)$, so the $y$-intercept is $b = -5$.

      The equation in slope-intercept form is:

      $$y = x - 5$$


      Why it works:

      The line has a slope of 1, meaning it moves up 1 unit for every 1 unit right.

      '
    instruction: 'Work through this step: Find the slope and $y$-intercept of the line, then write its
      equation.'
    type: freeResponse
  - id: aops-coord-geom-we-2-step-3
    title: Intersect the equations
    prompt: Substitute the line equation into the circle equation to find the $x$-coordinates of the intersection
      points.
    difficultyDimensions:
    - Substitute $y = x - 5$ into $x^2 + y^2 = 25$.
    - Expand the binomial and solve the quadratic for $x$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $x^2 + (x - 5)^2 = 25$.
      - $x^2 + x^2 - 10x + 25 = 25$.
      - $2x^2 - 10x = 0$.
      - $2x(x - 5) = 0 \implies x = 0$ or $x = 5$.
    explanation: 'Solution:

      Substitute $y = x - 5$ into the circle''s equation:

      $$x^2 + (x - 5)^2 = 25$$

      Expand the binomial:

      $$x^2 + x^2 - 10x + 25 = 25$$

      Combine like terms and subtract 25 from both sides:

      $$2x^2 - 10x = 0$$

      Factor:

      $$2x(x - 5) = 0$$

      The solutions are $x = 0$ and $x = 5$.


      Why it works:

      Substitution forces the points to lie on both the circle and the line simultaneously.

      '
    instruction: 'Work through this step: Substitute the line equation into the circle equation to find
      the $x$-coordinates of the intersection points.'
    type: freeResponse
  - id: step-4
    title: Find the corresponding y-coordinates
    prompt: Plug the $x$-values back into the linear equation to find the final intersection points.
    difficultyDimensions:
    - Evaluate $y = x - 5$ for each root.
    - Write the final coordinate pairs.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'If $x=0$, $y = 0-5 = -5$. Point: $(0, -5)$.'
      - 'If $x=5$, $y = 5-5 = 0$. Point: $(5, 0)$.'
    explanation: 'Solution:

      Using the line equation $y = x - 5$:

      When $x = 0$: $y = 0 - 5 = -5$. The first point is $(0, -5)$.

      When $x = 5$: $y = 5 - 5 = 0$. The second point is $(5, 0)$.


      Why it works:

      Always plug back into the linear equation rather than the quadratic (circle) equation to avoid extraneous
      roots from $\pm$ square roots. Notice that $(0,-5)$ was given in the prompt, confirming our algebra
      is correct.

      '
    instruction: 'Work through this step: Plug the $x$-values back into the linear equation to find the
      final intersection points.'
    type: freeResponse
  problem: A circle with center $(0,0)$ has radius 5. A line passes through $(0, -5)$ and $(10, 5)$. Find
    the coordinates of their points of intersection.
- id: aops-coord-geom-we-3
  title: Finding the Orthocenter
  steps:
  - id: aops-coord-geom-we-3-step-1
    title: Find the altitude from C
    prompt: Write the equation of the line passing through $C$ that is perpendicular to $AB$.
    difficultyDimensions:
    - Identify the slope of the horizontal line $AB$.
    - Deduce that the perpendicular altitude is a vertical line.
    - Write the vertical line equation through $C$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AB$ lies on the $x$-axis, so its slope is 0.
      - The altitude from $C$ must be a vertical line.
      - Since $C$ is at $(2, 6)$, the vertical line is $x = 2$.
    explanation: 'Solution:

      The side $AB$ goes from $(0,0)$ to $(8,0)$. This is a horizontal line on the $x$-axis (slope 0).

      An altitude dropped to a horizontal line must be a vertical line (undefined slope).

      The vertical line passing through $C(2, 6)$ is $x = 2$.


      Why it works:

      Because $AB$ is conveniently on an axis, one of our altitude equations is completely trivial.

      '
    instruction: 'Work through this step: Write the equation of the line passing through $C$ that is perpendicular
      to $AB$.'
    type: freeResponse
  - id: aops-coord-geom-we-3-step-2
    title: Find the altitude from B
    prompt: Write the equation of the line passing through $B$ that is perpendicular to $AC$.
    difficultyDimensions:
    - Calculate the slope of $AC$.
    - Find the negative reciprocal for the altitude's slope.
    - Use point-slope form with point $B$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Slope of $AC = \frac{6-0}{2-0} = 3$.
      - Altitude slope $= -\frac{1}{3}$.
      - 'Point $B$ is $(8, 0)$. Equation: $y - 0 = -\frac{1}{3}(x - 8)$.'
      - $y = -\frac{1}{3}x + \frac{8}{3}$.
    explanation: 'Solution:

      First, find the slope of the side $AC$ between $(0,0)$ and $(2,6)$:

      $$m_{AC} = \frac{6 - 0}{2 - 0} = 3$$

      The altitude from $B$ must be perpendicular to $AC$, so its slope is the negative reciprocal: $m_{\text{alt}}
      = -\frac{1}{3}$.

      The altitude passes through $B(8, 0)$. Using point-slope form:

      $$y - 0 = -\frac{1}{3}(x - 8)$$

      $$y = -\frac{1}{3}x + \frac{8}{3}$$


      Why it works:

      We only need two altitudes to find the orthocenter, because all three altitudes concurrently intersect
      at the same point.

      '
    instruction: 'Work through this step: Write the equation of the line passing through $B$ that is perpendicular
      to $AC$.'
    type: freeResponse
  - id: aops-coord-geom-we-3-step-3
    title: Intersect the altitudes
    prompt: Solve the system of equations formed by the two altitude lines to find the orthocenter.
    difficultyDimensions:
    - Substitute $x=2$ into the second altitude equation.
    - Solve for $y$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Substitute $x = 2$ into $y = -\frac{1}{3}x + \frac{8}{3}$.
      - $y = -\frac{1}{3}(2) + \frac{8}{3} = \frac{6}{3} = 2$.
      - The orthocenter is $(2, 2)$.
    explanation: 'Solution:

      We have two altitude lines:

      1) $x = 2$

      2) $y = -\frac{1}{3}x + \frac{8}{3}$

      To find their intersection, simply substitute $x = 2$ into the second equation:

      $$y = -\frac{1}{3}(2) + \frac{8}{3}$$

      $$y = -\frac{2}{3} + \frac{8}{3} = \frac{6}{3} = 2$$

      The orthocenter is at $(2, 2)$.


      Why it works:

      The intersection of any two altitudes uniquely defines the orthocenter. Because one altitude was
      $x=2$, we didn''t even have to solve a full system, just perform a direct substitution.

      '
    instruction: 'Work through this step: Solve the system of equations formed by the two altitude lines
      to find the orthocenter.'
    type: freeResponse
  problem: A triangle has vertices at $A(0, 0)$, $B(8, 0)$, and $C(2, 6)$. Find the coordinates of its
    orthocenter.
