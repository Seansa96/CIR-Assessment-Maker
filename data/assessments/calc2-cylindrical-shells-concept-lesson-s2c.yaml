  - id: sh4
    title: 4. Circumference supplies the circular distance
    required: true
    content: 'A shell at radius r has circumference $2\pi r$. Its differential volume is circumference times height times thickness: $dV=2\pi(\text{radius})(\text{height})(\text{thickness})$.'
    media:
    - type: image
      src: /media/calculus/cylindrical-shell-model.svg
      alt: Cylindrical shell with circumference
      caption: 'Unroll the shell mentally: circumference times height times thickness.'
    check:
      id: c4
      type: multipleChoice
      prompt: Which factor makes a shell model different from an ordinary area strip?
      choices:
      - id: a
        text: circumference $2\\pi r$
        media: []
        issueSignals: []
      - id: b
        text: a lower bound
        media: []
        issueSignals: []
      - id: c
        text: a differential
        media: []
        issueSignals: []
      - id: d
        text: an antiderivative
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The rotation wraps the strip through circumference $2\pi r$. Why it works: Shell volume is circumference times height times thickness. Common trap: Do not use $\pi r^2$, which is a disk area. Why the other choices fail: Bounds, differentials, and antiderivatives occur in many integral models.'
