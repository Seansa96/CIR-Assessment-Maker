  - id: sh6
    title: 6. Choose shells when they avoid awkward inverses
    required: true
    content: A region described naturally as y-functions may need inverse functions and multiple pieces for washers about a vertical axis. Vertical shells can preserve the original functions and one interval.
    media:
    - type: image
      src: /media/calculus/cylindrical-shell-model.svg
      alt: Shell model beside a vertical axis
      caption: Choose the method that gives the clearest single slice description.
    check:
      id: c6
      type: multipleChoice
      prompt: Why can shells be preferable about a vertical axis for y=f(x)?
      choices:
      - id: a
        text: They can keep the given x-based functions.
        media: []
        issueSignals: []
      - id: b
        text: They eliminate integration.
        media: []
        issueSignals: []
      - id: c
        text: They always have zero radius.
        media: []
        issueSignals: []
      - id: d
        text: They make volume two-dimensional.
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Vertical shells use x and often preserve y=f(x). Why it works: Their height is directly top minus bottom. Common trap: Method choice is about model simplicity, not a promise of less arithmetic. Why the other choices fail: b, c, and d contradict the shell geometry.'
