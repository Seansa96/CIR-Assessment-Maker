lesson:
  introduction: The shell method accumulates thin rolled strips. Label the axis, then identify radius, height, circumference, and thickness in that order.
  sections:
  - id: sh1
    title: 1. Parallel slices make shells
    required: true
    content: A strip parallel to the axis of rotation sweeps out a cylindrical shell. This is the orientation opposite the disk/washer method.
    media:
    - type: image
      src: /media/calculus/cylindrical-shell-model.svg
      alt: Vertical strip rotating around a vertical axis to form a cylindrical shell
      caption: A parallel strip rolls into a shell.
    check:
      id: c1
      type: multipleChoice
      prompt: For rotation about the y-axis, which slices naturally form shells?
      choices:
      - id: a
        text: vertical slices with dx
        media: []
        issueSignals: []
      - id: b
        text: horizontal slices with dy
        media: []
        issueSignals: []
      - id: c
        text: perpendicular slices only
        media: []
        issueSignals: []
      - id: d
        text: no slices
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Use vertical slices with $dx$. Why it works: They are parallel to the vertical y-axis. Common trap: Perpendicular slices form washers, not shells. Why the other choices fail: b is parallel to a horizontal axis; c names the opposite method; d omits accumulation.'
