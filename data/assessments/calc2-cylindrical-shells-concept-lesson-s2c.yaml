  - id: sh5
    title: 5. Build the standard shell integral
    required: true
    content: About the y-axis, vertical strips between f and g give $V=2\pi\int_a^b x[f(x)-g(x)]dx$ when x is nonnegative. Change the radius expression when the axis moves.
    media:
    - type: image
      src: /media/calculus/cylindrical-shell-model.svg
      alt: Shell formula mapped to radius x
      caption: Every formula factor comes from a diagram label.
    check:
      id: c5
      type: freeResponse
      prompt: Name the three nonconstant factors in a shell integral about the y-axis.
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: selfCheck
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints:
        - radius x
        - height top minus bottom
        - thickness dx
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Radius x, strip height, and thickness dx are the varying factors; $2\pi$ is constant. Why it works: They encode circumference, height, and thickness. Common trap: Do not call $2\pi x$ the height.'
