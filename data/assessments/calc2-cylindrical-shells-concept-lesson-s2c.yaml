  - id: sh2
    title: 2. Shell radius is distance to the axis
    required: true
    content: For rotation about the y-axis, a vertical strip at x has radius $|x|$. For rotation about $x=k$, its radius is $|x-k|$. Draw the axis before choosing a radius.
    media:
    - type: image
      src: /media/calculus/cylindrical-shell-model.svg
      alt: Shell radius measured horizontally from the y-axis
      caption: Radius is a distance from the strip to the axis.
    check:
      id: c2
      type: freeResponse
      prompt: For rotation about $x=3$, write the radius of a vertical strip at x.
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: selfCheck
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints:
        - $|x-3|$
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The radius is $|x-3|$. Why it works: Horizontal distance from x to 3 cannot be negative. Common trap: x alone works only when the axis is x=0.'
