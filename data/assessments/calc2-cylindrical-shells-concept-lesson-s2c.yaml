  - id: sh3
    title: 3. Shell height is the strip length
    required: true
    content: For a vertical strip bounded by top $f(x)$ and bottom $g(x)$, height is $f(x)-g(x)$. It is not the radius and it may require a partition if boundary order changes.
    media:
    - type: image
      src: /media/calculus/cylindrical-shell-model.svg
      alt: Shell height labelled top minus bottom
      caption: The shell height is the strip length.
    check:
      id: c3
      type: multipleChoice
      prompt: What is the shell height between y=f(x) and y=g(x) when f is above g?
      choices:
      - id: a
        text: $f(x)-g(x)$
        media: []
        issueSignals: []
      - id: b
        text: $x$
        media: []
        issueSignals: []
      - id: c
        text: $2\\pi x$
        media: []
        issueSignals: []
      - id: d
        text: $f(x)g(x)$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Height is top minus bottom, $f(x)-g(x)$. Why it works: It is the vertical length of the strip. Common trap: $2\pi x$ is circumference, a different shell factor. Why the other choices fail: b is radius only for the y-axis; c omits height; d is not a length.'
