schemaVersion: 1
id: calc2-cylindrical-shells-concept-lesson-s2c
title: 'Cylindrical Shells: Radius, Height, and Parallel Slices'

assessmentType: conceptLesson
categoryId: calculus-2
topicId: cylindrical-shells
modeDefault: practice
randomizeQuestions: false
skills: [shell-method, radius-modeling, parallel-slices, volume-of-revolution]
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [calculus-2, cylindrical-shells, volume] }
authoring: { visualRequirement: required, visualRationale: Shell radius, shell height, and slice orientation are spatial relationships. }
lesson:
  introduction: 'The shell method accumulates thin rolled strips. Label the axis, then identify radius, height, circumference, and thickness in that order.'
  sections:
    - { id: sh1, title: '1. Parallel slices make shells', required: true, content: 'A strip parallel to the axis of rotation sweeps out a cylindrical shell. This is the orientation opposite the disk/washer method.', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Vertical strip rotating around a vertical axis to form a cylindrical shell, caption: 'A parallel strip rolls into a shell.' }], check: { id: c1, type: multipleChoice, prompt: 'For rotation about the y-axis, which slices naturally form shells?', choices: [{ id: a, text: vertical slices with dx }, { id: b, text: horizontal slices with dy }, { id: c, text: perpendicular slices only }, { id: d, text: no slices }], answer: { choiceId: a }, explanation: 'Solution: Use vertical slices with $dx$. Why it works: They are parallel to the vertical y-axis. Common trap: Perpendicular slices form washers, not shells. Why the other choices fail: b is parallel to a horizontal axis; c names the opposite method; d omits accumulation.' } }
    - { id: sh2, title: '2. Shell radius is distance to the axis', required: true, content: 'For rotation about the y-axis, a vertical strip at x has radius $|x|$. For rotation about $x=k$, its radius is $|x-k|$. Draw the axis before choosing a radius.', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Shell radius measured horizontally from the y-axis, caption: 'Radius is a distance from the strip to the axis.' }], check: { id: c2, type: freeResponse, prompt: 'For rotation about $x=3$, write the radius of a vertical strip at x.', answer: { gradingMode: selfCheck, keyPoints: ['$|x-3|$'] }, explanation: 'Solution: The radius is $|x-3|$. Why it works: Horizontal distance from x to 3 cannot be negative. Common trap: x alone works only when the axis is x=0.' } }
    - { id: sh3, title: '3. Shell height is the strip length', required: true, content: 'For a vertical strip bounded by top $f(x)$ and bottom $g(x)$, height is $f(x)-g(x)$. It is not the radius and it may require a partition if boundary order changes.', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Shell height labelled top minus bottom, caption: 'The shell height is the strip length.' }], check: { id: c3, type: multipleChoice, prompt: 'What is the shell height between y=f(x) and y=g(x) when f is above g?', choices: [{ id: a, text: '$f(x)-g(x)$' }, { id: b, text: '$x$' }, { id: c, text: '$2\\pi x$' }, { id: d, text: '$f(x)g(x)$' }], answer: { choiceId: a }, explanation: 'Solution: Height is top minus bottom, $f(x)-g(x)$. Why it works: It is the vertical length of the strip. Common trap: $2\pi x$ is circumference, a different shell factor. Why the other choices fail: b is radius only for the y-axis; c omits height; d is not a length.' } }
    - { id: sh4, title: '4. Circumference supplies the circular distance', required: true, content: 'A shell at radius r has circumference $2\pi r$. Its differential volume is circumference times height times thickness: $dV=2\pi(\text{radius})(\text{height})(\text{thickness})$.', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Cylindrical shell with circumference, height, and thickness labels, caption: 'Unroll the shell mentally: circumference times height times thickness.' }], check: { id: c4, type: multipleChoice, prompt: 'Which factor makes a shell model different from an ordinary area strip?', choices: [{ id: a, text: circumference $2\\pi r$ }, { id: b, text: a lower bound }, { id: c, text: a differential }, { id: d, text: an antiderivative }], answer: { choiceId: a }, explanation: 'Solution: The rotation wraps the strip through circumference $2\pi r$. Why it works: Shell volume is circumference times height times thickness. Common trap: Do not use $\pi r^2$, which is a disk area. Why the other choices fail: Bounds, differentials, and antiderivatives occur in many integral models.' } }
    - { id: sh5, title: '5. Build the standard shell integral', required: true, content: 'About the y-axis, vertical strips between f and g give $V=2\pi\int_a^b x[f(x)-g(x)]dx$ when x is nonnegative. Change the radius expression when the axis moves.', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Shell formula mapped to radius x, height f minus g, and thickness dx, caption: 'Every formula factor comes from a diagram label.' }], check: { id: c5, type: freeResponse, prompt: 'Name the three nonconstant factors in a shell integral about the y-axis.', answer: { gradingMode: selfCheck, keyPoints: [radius x, height top minus bottom, thickness dx] }, explanation: 'Solution: Radius x, strip height, and thickness dx are the varying factors; $2\pi$ is constant. Why it works: They encode circumference, height, and thickness. Common trap: Do not call $2\pi x$ the height.' } }
    - { id: sh6, title: '6. Choose shells when they avoid awkward inverses', required: true, content: 'A region described naturally as y-functions may need inverse functions and multiple pieces for washers about a vertical axis. Vertical shells can preserve the original functions and one interval.', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Shell model beside a vertical axis, caption: 'Choose the method that gives the clearest single slice description.' }], check: { id: c6, type: multipleChoice, prompt: 'Why can shells be preferable about a vertical axis for y=f(x)?', choices: [{ id: a, text: They can keep the given x-based functions. }, { id: b, text: They eliminate integration. }, { id: c, text: They always have zero radius. }, { id: d, text: They make volume two-dimensional. }], answer: { choiceId: a }, explanation: 'Solution: Vertical shells use x and often preserve y=f(x). Why it works: Their height is directly top minus bottom. Common trap: Method choice is about model simplicity, not a promise of less arithmetic. Why the other choices fail: b, c, and d contradict the shell geometry.' } }
    - { id: sh7, title: '7. Audit sign, bounds, and units', required: true, content: 'Check that radius and height are nonnegative on the interval, bounds index the thickness variable, and the result has cubic units. A negative radius or height signals an unmodeled axis crossing or boundary swap.', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Complete shell diagram with all factors labelled, caption: 'Radius, height, thickness, and bounds should all be visible.' }], check: { id: c7, type: freeResponse, prompt: 'Give one reason a shell setup might require splitting its interval.', answer: { gradingMode: selfCheck, keyPoints: [radius changes sign, height boundary changes, axis crossing] }, explanation: 'Solution: Split where the radius expression changes sign or where the top/bottom boundary changes. Why it works: Each integral piece needs a nonnegative geometric length. Common trap: An algebraically compact integrand can still represent signed, not geometric, volume.' } }
