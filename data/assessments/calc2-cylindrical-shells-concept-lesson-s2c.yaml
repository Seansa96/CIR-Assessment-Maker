        - height boundary changes
        - axis crossing
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Split where the radius expression changes sign or where the top/bottom boundary changes. Why it works: Each integral piece needs a nonnegative geometric length. Common trap: An algebraically compact integrand can still represent signed, not geometric, volume.'
