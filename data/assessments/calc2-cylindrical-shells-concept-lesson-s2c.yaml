  - id: sh7
    title: 7. Audit sign, bounds, and units
    required: true
    content: Check that radius and height are nonnegative on the interval, bounds index the thickness variable, and the result has cubic units. A negative radius or height signals an unmodeled axis crossing or boundary swap.
    media:
    - type: image
      src: /media/calculus/cylindrical-shell-model.svg
