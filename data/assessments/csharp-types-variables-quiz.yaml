questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Examine the following C# code snippet:
      
      ```csharp
      var playerLevel = "10";
      playerLevel = 11;
      ```
      
      What happens when you attempt to compile this code?
    choices:
      - id: a
        text: 'A compiler error occurs because you cannot assign an `int` (11) to a variable typed as a `string`.'
      - id: b
        text: 'The code compiles, and `playerLevel` changes from a string to an integer.'
      - id: c
        text: 'The code compiles, and `playerLevel` becomes `"11"`.'
      - id: d
        text: 'A compiler error occurs because `var` requires a type cast.'
    answer:
      choiceId: a
    explanation: |
      `var playerLevel = "10";` tells the compiler to permanently type `playerLevel` as a `string`. You cannot later assign the integer `11` to a `string` variable in C#.

  - id: q002
    type: multipleChoice
    prompt: |
      Which of the following is a completely valid way to declare a constant integer in C#?
    choices:
      - id: a
        text: '`const int MaxHealth = 100;`'
      - id: b
        text: '`int const MaxHealth = 100;`'
      - id: c
        text: '`const var MaxHealth = 100;`'
      - id: d
        text: '`final int MaxHealth = 100;`'
    answer:
      choiceId: a
    explanation: |
      The correct syntax is `const type Identifier = value;`. You cannot use `const var`, and `final` is Java syntax, not C#.

  - id: q003
    type: multipleChoice
    prompt: |
      If the player types `500` into the console, how do you correctly read it into an `int` variable named `gold`?
    choices:
      - id: a
        text: '`int gold = int.Parse(Console.ReadLine());`'
      - id: b
        text: '`int gold = Console.ReadLine();`'
      - id: c
        text: '`int gold = Console.ReadInt();`'
      - id: d
        text: '`int gold = (int)Console.ReadLine();`'
    answer:
      choiceId: a
    explanation: |
      `Console.ReadLine()` always returns a `string`. You must use `int.Parse()` to convert that string representation of a number into an actual `int`. Casting with `(int)` does not work on strings.

  - id: q004
    type: numericResponse
    prompt: |
      Trace this math code:
      
      ```csharp
      int baseDamage = 15;
      double multiplier = 2.0;
      int totalDamage = (int)(baseDamage * multiplier);
      ```
      
      What is the value of `totalDamage`?
    answer:
      value: 30
      tolerance: 0
    explanation: |
      `15 * 2.0` results in the `double` `30.0`. The `(int)` cast explicitly tells the compiler to convert that `double` back into an `int` (truncating any decimals). The result is the integer `30`.


