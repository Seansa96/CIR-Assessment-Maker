questions:
- id: q001
  type: numericResponse
  prompt: Air is at 9.4 degrees C. Using $v=331+0.60T$ in m/s, a tuning fork emits 379.4 Hz. What wavelength in m does the sound have?
  answer: { value: 0.8873, tolerance: 0.01 }
  explanation: |
    Solution: First $v=331+0.60(9.4)=336.64$ m/s. Then $\lambda=v/f=336.64/379.4=0.8873$ m.

    Why it works: Temperature determines the sound speed in this model, and the wave relation $v=f\lambda$ connects that speed to frequency and wavelength.
  difficultyDimensions: [multiStep, modelOrDerivation, unitAnalysis]
  subjectDifficultyTags: [soundSpeed, wavelength]
  difficultyEvidence: A temperature-dependent speed must be calculated before the wave relation is rearranged for wavelength.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q002
  type: numericResponse
  prompt: In air at 5.9 degrees C, lightning is seen and thunder arrives 0.60 s later. Using $v=331+0.60T$ in m/s, what distance in m is the strike away?
  answer: { value: 202.2, tolerance: 0.5 }
  explanation: |
    Solution: $v=331+0.60(5.9)=334.54$ m/s, so $d=vt=(334.54)(0.60)=200.724$ m, or about 201 m.

    Why it works: The visible flash arrives effectively immediately over this distance, while the time delay is modeled as the sound travel time.
  difficultyDimensions: [modelOrDerivation, assumptionCheck, multiStep]
  subjectDifficultyTags: [travelTime]
  difficultyEvidence: The learner must select the physically relevant signal delay and combine a temperature model with constant-speed travel.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q003
  type: numericResponse
  prompt: At a station where air is -3.9 degrees C, estimate the speed of sound in m/s using $v=331+0.60T$.
  answer: { value: 328.66, tolerance: 0.05 }
  explanation: |
    Solution: Substitute the negative temperature: $v=331+0.60(-3.9)=331-2.34=328.66$ m/s.

    Why it works: The linear approximation says sound speed decreases as the temperature decreases, so the negative temperature contribution must reduce 331 m/s.
  difficultyDimensions: [signConvention, modelOrDerivation, estimation]
  subjectDifficultyTags: [temperatureDependence]
  difficultyEvidence: A signed physical input is interpreted through a model and checked against the expected trend.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q004
  type: numericResponse
  prompt: Air is at -6.3 degrees C. Thunder is heard 1.70 s after the flash. Using $v=331+0.60T$ in m/s, what distance in m is the lightning strike away?
  answer: { value: 556.27, tolerance: 0.7 }
  explanation: |
    Solution: $v=331+0.60(-6.3)=327.22$ m/s. Therefore $d=vt=(327.22)(1.70)=556.274$ m.

    Why it works: The temperature first fixes the propagation speed; multiplying that speed by the sound-travel time gives the distance.
  difficultyDimensions: [multiStep, signConvention, unitAnalysis]
  subjectDifficultyTags: [travelTime]
  difficultyEvidence: The calculation combines a negative-temperature correction with a unit-consistent travel-time model.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q005
  type: numericResponse
  prompt: Air is at 13.1 degrees C. Thunder reaches a listener 2.57 s after the flash. Using $v=331+0.60T$ in m/s, what distance in m is the source?
  answer: { value: 870.87, tolerance: 1.0 }
  explanation: |
    Solution: $v=331+0.60(13.1)=338.86$ m/s. Then $d=vt=(338.86)(2.57)=870.8702$ m.

    Why it works: The model separates the medium-dependent speed from the measured duration of sound travel, then combines them through $d=vt$.
  difficultyDimensions: [multiStep, modelOrDerivation, significantFigures]
  subjectDifficultyTags: [travelTime]
  difficultyEvidence: A derived propagation speed is used in a second model, with the result reported at a precision justified by the inputs.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]

