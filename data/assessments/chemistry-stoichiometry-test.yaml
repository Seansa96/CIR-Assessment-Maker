questions:
- id: q001
  type: numericResponse
  prompt: 'How many moles of sulfur dioxide (SO2) are produced when 32.07 g of sulfur
    burns in excess oxygen?

    S(s) + O2(g) → SO2(g)

    (M(S) = 32.07 g/mol)

    '
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: 'n(S) = 32.07/32.07 = 1.000 mol. Ratio 1:1 → 1.000 mol SO2.

    '
- id: q002
  type: numericResponse
  prompt: 'Calculate the molar mass of aspirin, C9H8O4, in g/mol.

    (C = 12.011, H = 1.008, O = 15.999 g/mol)

    '
  answer:
    value: 180.16
    tolerance: 0.1
  explanation: 'M = 9(12.011) + 8(1.008) + 4(15.999) = 108.099 + 8.064 + 63.996 =
    180.159 g/mol.

    '
- id: q003
  type: multipleChoice
  prompt: 'A compound is 38.7% C, 9.7% H, and 51.6% O by mass. What is the empirical
    formula?

    (C = 12.011, H = 1.008, O = 15.999 g/mol)

    '
  choices:
  - id: a
    text: CH3O
  - id: b
    text: CH2O
  - id: c
    text: C2H6O
  - id: d
    text: CH4O
  answer:

    choiceId: a
  explanation: '38.7g C/12.011 = 3.22 mol C; 9.7g H/1.008 = 9.62 mol H; 51.6g O/15.999
    = 3.23 mol O.

    Divide by 3.22: C=1, H=2.99≈3, O=1. Empirical formula: CH3O.

    '
- id: q004
  type: numericResponse
  prompt: 'A compound has empirical formula CH3O and a molar mass of 62.07 g/mol.
    What is the molecular formula? Express your answer as the molecular weight (molar
    mass) of the molecular formula in g/mol.


    (Hint: Find the multiplier n and multiply empirical formula molar mass. Then write
    the molecular formula.)

    '
  answer:
    value: 62.07
    tolerance: 0.1
  explanation: 'M(CH3O) = 12.011 + 3(1.008) + 15.999 = 31.034 g/mol. n = 62.07/31.034
    = 2.0. Molecular formula = C2H6O2 (ethylene glycol). M(C2H6O2) = 62.07 g/mol.
    ✓

    '
- id: q005
  type: multipleChoice
  prompt: 'Which balanced equation correctly represents the combustion of hexane (C6H14)?

    '
  choices:
  - id: a
    text: 2C6H14 + 19O2 → 12CO2 + 14H2O
  - id: b
    text: C6H14 + 9O2 → 6CO2 + 7H2O
  - id: c
    text: C6H14 + 10O2 → 6CO2 + 7H2O
  - id: d
    text: 2C6H14 + 9O2 → 12CO2 + 14H2O
  answer:

    choiceId: a
  explanation: 'C6H14 + (19/2)O2 → 6CO2 + 7H2O. Multiply by 2: 2C6H14 + 19O2 → 12CO2
    + 14H2O. Verify: C 12=12✓, H 28=28✓, O 38=38✓.

    '
- id: q006
  type: numericResponse
  prompt: 'For the reaction: 4HCl + O2 → 2Cl2 + 2H2O


    If 36.5 g of HCl reacts with excess O2, what mass of Cl2 is produced in grams?

    (M(HCl) = 36.461 g/mol; M(Cl2) = 70.906 g/mol)

    '
  answer:
    value: 35.5
    tolerance: 0.5
  explanation: 'n(HCl) = 36.5/36.461 = 1.001 mol. Ratio HCl:Cl2 = 4:2 = 2:1. n(Cl2)
    = 0.5005 mol. m(Cl2) = 0.5005 × 70.906 = 35.49 g ≈ 35.5 g.

    '
- id: q007
  type: numericResponse
  prompt: 'For the reaction: 2SO2 + O2 → 2SO3


    A chemist mixes 128 g of SO2 with 48.0 g of O2. Identify the limiting reactant
    and calculate the theoretical yield of SO3 in grams.

    (M(SO2) = 64.06, M(O2) = 31.998, M(SO3) = 80.06 g/mol)

    '
  answer:
    value: 160
    tolerance: 2
  explanation: 'n(SO2) = 128/64.06 = 1.998 mol → n(SO3) from SO2 = 1.998 × (2/2) =
    1.998 mol.

    n(O2) = 48.0/31.998 = 1.500 mol → n(SO3) from O2 = 1.500 × (2/1) = 3.000 mol.

    SO2 produces less → SO2 is limiting. Ratio SO2:SO3 = 1:1. m(SO3) = 1.998 × 80.06
    = 159.96 g ≈ 160 g.

    '
- id: q008
  type: numericResponse
  prompt: 'A student runs the reaction Zn + H2SO4 → ZnSO4 + H2 and collects 1.40 g
    of H2. If the theoretical yield was 1.65 g, what is the percent yield?

    '
  answer:
    value: 84.8
    tolerance: 0.5
  explanation: '% yield = (1.40/1.65) × 100% = 84.8%.

    '
- id: q009
  type: multipleChoice
  prompt: 'What is the percent composition of nitrogen in NH4NO3 (ammonium nitrate)?

    (N = 14.007, H = 1.008, O = 15.999 g/mol; M(NH4NO3) = 80.052 g/mol)

    '
  choices:
  - id: a
    text: 35.0% (two nitrogen atoms contribute 28.014 g/mol)
  - id: b
    text: 17.5% (one nitrogen atom contributes 14.007 g/mol)
  - id: c
    text: 14.0%
  - id: d
    text: 70.0%
  answer:

    choiceId: a
  explanation: 'NH4NO3 has 2 nitrogen atoms. %N = 2(14.007)/80.052 × 100% = 28.014/80.052
    × 100% = 35.0%.

    '
- id: q010
  type: numericResponse
  prompt: 'What mass (in grams) of oxygen is needed to completely burn 12.0 g of ethane
    (C2H6)?

    2C2H6 + 7O2 → 4CO2 + 6H2O

    (M(C2H6) = 30.07 g/mol; M(O2) = 31.998 g/mol)

    '
  answer:
    value: 44.7
    tolerance: 0.5
  explanation: 'n(C2H6) = 12.0/30.07 = 0.3990 mol. Ratio C2H6:O2 = 2:7. n(O2) = 0.3990
    × (7/2) = 1.397 mol. m(O2) = 1.397 × 31.998 = 44.69 g ≈ 44.7 g.

    '
- id: q011
  type: multipleChoice
  prompt: 'A compound contains 53.1% Al and 46.9% O. What is the empirical formula?

    (Al = 26.982, O = 15.999 g/mol)

    '
  choices:
  - id: a
    text: Al2O3
  - id: b
    text: AlO
  - id: c
    text: Al2O
  - id: d
    text: AlO2
  answer:

    choiceId: a
  explanation: 'n(Al) = 53.1/26.982 = 1.968 mol; n(O) = 46.9/15.999 = 2.931 mol. Divide
    by 1.968: Al=1, O=1.49 ≈ 1.5. Multiply by 2: Al2O3. ✓

    '
- id: q012
  type: numericResponse
  prompt: 'For the Haber process: N2 + 3H2 → 2NH3


    Starting with 56.0 g of N2 and 12.1 g of H2, what is the theoretical yield of
    NH3 in grams?

    (M(N2) = 28.01, M(H2) = 2.016, M(NH3) = 17.031 g/mol)

    '
  answer:
    value: 68.1
    tolerance: 1.0
  explanation: 'n(N2) = 56.0/28.01 = 1.999 mol → n(NH3) from N2 = 1.999 × 2 = 3.998
    mol.

    n(H2) = 12.1/2.016 = 6.000 mol → n(NH3) from H2 = 6.000 × (2/3) = 4.000 mol.

    N2 and H2 produce essentially equal NH3 (~4.0 mol each); N2 is very slightly limiting.

    m(NH3) = 3.998 × 17.031 = 68.1 g.

    '
