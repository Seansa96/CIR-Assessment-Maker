schemaVersion: 1
id: calc2-polar-calculus-recall
title: 'Polar Calculus: Recall Drill'
categoryId: calculus-2
subcategoryIds:
  - polar-calculus
assessmentType: recallDrill
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
    - polar-calculus
skills:
  - polar-calculus
items:
  - id: recall-1
    type: flashcard
    skills:
      - polar-calculus
    prompt: What is the area formula for a polar curve $r=f(\theta)$ from $\theta=a$ to $\theta=b$?
    answer:
      expectedLatex: A=\frac{1}{2}\int_a^b [f(\theta)]^2\,d\theta
  - id: recall-2
    type: flashcard
    skills:
      - polar-calculus
    prompt: What is the arc length formula for a polar curve $r=f(\theta)$ from $\theta=a$ to $\theta=b$?
    answer:
      expectedLatex: L=\int_a^b\sqrt{r^2+\left(\frac{dr}{d\theta}\right)^2}\,d\theta
  - id: recall-3
    type: flashcard
    skills:
      - polar-calculus
    prompt: What parametric equations connect a polar curve $r=f(\theta)$ to $x$ and $y$?
    answer:
      expectedLatex: x=r\cos\theta,\quad y=r\sin\theta
  - id: recall-4
    type: flashcard
    skills:
      - polar-calculus
    prompt: For a polar curve, what is $\frac{dx}{d\theta}$?
    answer:
      expectedLatex: \frac{dx}{d\theta}=\frac{dr}{d\theta}\cos\theta-r\sin\theta
  - id: recall-5
    type: flashcard
    skills:
      - polar-calculus
    prompt: For a polar curve, what is $\frac{dy}{d\theta}$?
    answer:
      expectedLatex: \frac{dy}{d\theta}=\frac{dr}{d\theta}\sin\theta+r\cos\theta
  - id: recall-6
    type: flashcard
    skills:
      - polar-calculus
    prompt: What is the formula for $\frac{dy}{dx}$ on a polar curve?
    answer:
      expectedLatex: \frac{dy}{dx}=\frac{\frac{dr}{d\theta}\sin\theta+r\cos\theta}{\frac{dr}{d\theta}\cos\theta-r\sin\theta}
  - id: recall-7
    type: flashcard
    skills:
      - polar-calculus
    prompt: What condition identifies a horizontal tangent on a polar curve?
    answer:
      expectedLatex: \frac{dy}{d\theta}=0\quad\text{and}\quad\frac{dx}{d\theta}\ne 0
  - id: recall-8
    type: flashcard
    skills:
      - polar-calculus
    prompt: What condition identifies a vertical tangent on a polar curve?
    answer:
      expectedLatex: \frac{dx}{d\theta}=0\quad\text{and}\quad\frac{dy}{d\theta}\ne 0
  - id: recall-9
    type: flashcard
    skills:
      - polar-calculus
    prompt: When finding polar area between two curves on the same interval, what integral setup is used?
    answer:
      expectedLatex: A=\frac{1}{2}\int_a^b\left(r_{\text{outer}}^2-r_{\text{inner}}^2\right)\,d\theta
  - id: recall-10
    type: flashcard
    skills:
      - polar-calculus
    prompt: What should you square in a polar area integral?
    answer:
      expected: The radius function $r$, not the angle interval.
  - id: recall-11
    type: flashcard
    skills:
      - polar-calculus
    prompt: For $r=e^\theta$, what is $\frac{dr}{d\theta}$?
    answer:
      expectedLatex: e^\theta
  - id: recall-12
    type: flashcard
    skills:
      - polar-calculus
    prompt: Why does the polar arc length formula contain both $r^2$ and $\left(\frac{dr}{d\theta}\right)^2$?
    answer:
      expected: It comes from applying parametric arc length to $x=r\cos\theta$ and $y=r\sin\theta$.
