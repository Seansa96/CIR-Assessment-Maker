  - id: gauss-line-sheet-s3
    title: Translate the line-charge equation chain
    required: true
    content: >
      Once the cylinder has been chosen, the line-charge derivation becomes a short translation chain:


      $$

      \oint_S\mathbf E\cdot d\mathbf A

      =E(2\pi rL)

      =\frac{Q_{\mathrm{enc}}}{\epsilon_0}

      =\frac{\lambda L}{\epsilon_0}.

      $$


      Cancel the cylinder length $L$ and solve for the field:


      $$

      E(2\pi rL)=\frac{\lambda L}{\epsilon_0}

      \quad\Longrightarrow\quad

      E(r)=\frac{\lambda}{2\pi\epsilon_0r}.

      $$


      **Plain-English translation:** The flux through the cylindrical side equals the charge contained in the length-$L$ slice divided by $\epsilon_0$. Both flux area and enclosed charge contain one factor of $L$, so that arbitrary cylinder length cancels. The remaining radius dependence is $1/r$ because a cylinder's side area grows like $r$.
    media: []
    check:
      id: gauss-line-sheet-s3-check
      type: multipleChoice
      prompt: Which final field follows from $E(2\pi rL)=\lambda L/\epsilon_0$?
      choices:
      - id: a
        text: $E=\lambda/(2\pi\epsilon_0r)$, directed radially for positive $\lambda$
        media: []
        issueSignals: []
      - id: b
        text: $E=\lambda/(4\pi\epsilon_0r^2)$, directed radially outward
        media: []
        issueSignals:
        - id: physics2-line-point-charge-formula
          domains:
          - physics-2
      - id: c
        text: $E=\lambda(2\pi rL)/\epsilon_0$, because flux belongs in the numerator
        media: []
        issueSignals:
        - id: physics2-line-gauss-algebra-inversion
          domains:
          - physics-2
      - id: d
        text: $E=\lambda/(2\pi\epsilon_0L)$, directed along the line
        media: []
        issueSignals:
        - id: physics2-line-retained-length-axis
          domains:
          - physics-2
      answer:
        choiceId: a
