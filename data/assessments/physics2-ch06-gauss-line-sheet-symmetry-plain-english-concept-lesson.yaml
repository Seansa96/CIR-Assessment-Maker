  - id: gauss-line-sheet-s8
    title: A plain-English Gaussian-surface workflow
    required: true
    content: >
      For a new charge-distribution picture, translate it in this order:


      1. Name the source density: $\lambda$ for charge per length or $\sigma$ for charge per area.

      2. State the symmetry and field direction.

      3. Choose a closed Gaussian surface that follows that symmetry.

      4. Label each region's outward normal and decide whether its flux is positive, negative, or zero.

      5. Write $Q_{\mathrm{enc}}$ from the charge actually inside the surface.

      6. Simplify the flux, cancel common geometric factors, and check units, direction, and distance scaling.


      **Plain-English translation of the method:** “Match the boundary to the source, keep only the field that crosses the boundary, count the charge inside, and solve.”
