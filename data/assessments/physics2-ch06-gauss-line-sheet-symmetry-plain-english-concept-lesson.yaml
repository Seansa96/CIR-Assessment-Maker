      explanation: >
        Solution: Divide both sides by $2\pi rL$, cancel $L$, and obtain $E=\lambda/(2\pi\epsilon_0r)$. Positive $\lambda$ gives an outward radial direction, so choice A is correct.


        Why it works: The cylinder's side area supplies the factor $2\pi rL$, while the enclosed charge is $\lambda L$.


        Why the other choices fail: B uses the spherical point-charge area scaling; C multiplies by flux instead of isolating $E$; D leaves the arbitrary cylinder length and assigns the wrong direction.
