  - id: gauss-line-sheet-s4
    title: 'Figure 2: A sheet produces a normal field on both sides'
    required: true
    content: >
      **Definition - surface charge density:** The symbol $\sigma$ means charge per unit area. A sheet patch of area $A$ contains $Q=\sigma A$ when the density is uniform.


      **What the visual shows:** A large uniformly charged sheet is pierced by a short cylindrical pillbox. The pillbox has one flat face on each side of the sheet. For positive $\sigma$, field arrows point away from the sheet on both sides; for negative $\sigma$, they point toward it.


      **Why the geometry is special:** An ideal infinite sheet looks identical after any shift parallel to itself. The field cannot prefer one sideways direction, so it must be perpendicular to the sheet. The two sides have equal field magnitude.


      **Plain-English translation:** The sheet pushes field straight through the pillbox faces. Its infinite size means moving farther from the sheet does not change the ideal field strength.
