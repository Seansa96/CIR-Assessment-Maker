  - id: gauss-line-sheet-s7
    title: Compare the two source symmetries
    required: true
    content: >
      The two derivations look similar, but the contributing area is different:


      $$

      \text{line: } A_{\mathrm{side}}=2\pi rL,

      \qquad

      \text{sheet: } A_{\mathrm{faces}}=2A.

      $$


      These geometric facts produce


      $$

      E_{\mathrm{line}}=\frac{\lambda}{2\pi\epsilon_0r},

      \qquad

      E_{\mathrm{sheet}}=\frac{\sigma}{2\epsilon_0}.

      $$


      **Plain-English translation:** A line's cylindrical side area grows as you move away, so its field weakens as $1/r$. An ideal sheet's contributing face area is not set by the distance from the sheet, so its field stays constant.
