      explanation: >
        Solution: An infinite uniform line has cylindrical symmetry: the field is radial and constant in magnitude on a cylinder of fixed radius, so choice B is correct.


        Why it works: Translation along the line and rotation around it leave the source unchanged, so only the distance from the line can affect the magnitude.


        Why the other choices fail: A confuses the line's axis with the field direction; C mistakes symmetry for cancellation; D imports the point-charge inverse-square law before considering the cylinder's area growth.
