  - id: gauss-line-sheet-s6
    title: Translate the sheet equation chain
    required: true
    content: >
      The pillbox derivation translates as follows:


      $$

      \oint_S\mathbf E\cdot d\mathbf A

      =2EA

      =\frac{Q_{\mathrm{enc}}}{\epsilon_0}

      =\frac{\sigma A}{\epsilon_0}.

      $$


      Cancel the pillbox face area $A$ and solve:


      $$

      2EA=\frac{\sigma A}{\epsilon_0}

      \quad\Longrightarrow\quad

      E=\frac{\sigma}{2\epsilon_0}.

      $$


      **Plain-English translation:** The two equal face fluxes account for the factor of two. The sheet charge inside the pillbox is density times the pillbox face area. That same area appears on both sides and cancels, leaving a field that does not depend on distance from an ideal infinite sheet.
