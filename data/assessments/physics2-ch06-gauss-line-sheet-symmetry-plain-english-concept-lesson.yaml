  - id: gauss-line-sheet-s2
    title: 'Figure 1: Decide which cylinder surfaces carry flux'
    required: true
    content: >
      **Definition - flux contribution:** A small surface patch contributes $d\Phi=\mathbf E\cdot d\mathbf A$. The contribution is zero when the field is tangent to the patch, because then $\mathbf E$ is perpendicular to the patch normal.


      **What the visual shows:** The cylinder has one curved side wall and two circular end caps. On the curved wall, each outward normal points radially, in the same direction as the line-charge field. On the caps, the outward normals point along the line's axis, while the radial field is sideways relative to those normals.


      **Equations represented by the visual:**


      $$

      \Phi_{\mathrm{side}}=E\,(2\pi rL),\qquad

      \Phi_{\mathrm{caps}}=0.

      $$


      **Plain-English translation:** The side wall catches the field head-on, so it counts. The caps see the field sliding across them, so they contribute no flux even though they have area.
    media:
    - type: image
      src: /media/physics2/gauss-line-charge-cylinder.svg
      alt: A cylindrical Gaussian surface labels its curved wall as contributing flux and its end caps as zero flux because their normals are perpendicular to the radial field.
      caption: Figure 1 detail. The dot product decides contribution region by region.
    check:
      id: gauss-line-sheet-s2-check
      type: multipleChoice
      prompt: For the coaxial cylinder around a line charge, which flux accounting is correct?
      choices:
      - id: a
        text: The curved wall contributes $E(2\pi rL)$ and both caps contribute zero
        media: []
        issueSignals: []
      - id: b
        text: The curved wall contributes zero and the two caps contribute $2EA$
        media: []
        issueSignals:
        - id: physics2-line-cylinder-region-swap
          domains:
          - physics-2
      - id: c
        text: Every part contributes because every part has nonzero area
        media: []
        issueSignals:
        - id: physics2-line-area-implies-flux
          domains:
          - physics-2
      - id: d
        text: The curved wall contributes $E(\pi r^2)$ because that is the cylinder area
        media: []
        issueSignals:
        - id: physics2-line-cylinder-area-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
