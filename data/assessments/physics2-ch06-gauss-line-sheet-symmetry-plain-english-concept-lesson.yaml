      explanation: >
        Solution: Each flat face contributes $EA$ with a positive sign, and the side wall contributes zero. Therefore $\Phi_{\mathrm{total}}=EA+EA=2EA$, so choice C is correct.


        Why it works: The field and each face's outward normal point away from the sheet on their respective sides, so the dot products have matching signs.


        Why the other choices fail: A sees opposite normal directions but ignores the field also reverses direction; B omits one face; D uses the line-charge cylinder geometry.
