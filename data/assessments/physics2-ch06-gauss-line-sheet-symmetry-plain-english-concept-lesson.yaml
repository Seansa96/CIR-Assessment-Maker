lesson:
  introduction: >
    This lesson translates two classic Gauss's-law drawings into plain English: a long straight line of charge and a very large uniformly charged sheet. The key habit is to read the geometry before touching the algebra.


    Start with the closed-surface law:


    $$

    \oint_S\mathbf E\cdot d\mathbf A=\frac{Q_{\mathrm{enc}}}{\epsilon_0}.

    $$


    In plain English: add the signed field-through-surface contribution from every small piece of a closed boundary. Then choose a Gaussian surface whose symmetry makes those pieces easy to add. The line-charge case uses a cylinder; the sheet case uses a short pillbox.
  sections:
  - id: gauss-line-sheet-s1
    title: 'Figure 1: A line charge produces a radial field'
    required: true
    content: >
      **Definition - line charge density:** The symbol $\lambda$ means charge per unit length, so a segment of length $L$ contains $Q=\lambda L$ when the density is uniform.


      **What the visual shows:** A long straight line is surrounded by a coaxial cylinder of radius $r$ and length $L$. The electric-field arrows point radially away from a positive line charge, or toward a negative one.


      **Why the geometry is special:** Moving along the line does not change the situation, and rotating around the line does not change it either. Every point on the curved cylinder at the same radius is equivalent. Therefore $|\mathbf E|$ can depend on $r$, but not on the cylinder's angle or position along the line. The field direction is radial, not along the line.


      **Plain-English translation:** A long uniform line has no preferred direction around itself. At a fixed distance, all side-wall points see the same field strength, and the field points straight outward or inward.
    media:
    - type: image
      src: /media/physics2/gauss-line-charge-cylinder.svg
      alt: A uniform line charge runs along the axis of a cylindrical Gaussian surface while radial electric-field arrows cross its curved wall.
      caption: Figure 1. Cylindrical symmetry makes the radial field constant on the curved wall at fixed radius.
    check:
      id: gauss-line-sheet-s1-check
      type: multipleChoice
      prompt: Which statement best translates the symmetry of an infinite uniform line charge?
      choices:
