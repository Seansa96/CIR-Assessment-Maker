  - id: gauss-line-sheet-s5
    title: 'Figure 2: Read the pillbox side view'
    required: true
    content: >
      **What the side view shows:** The charged sheet is the vertical line through the center of the drawing, and the pillbox cross-section is the rectangle crossing it. The left and right flat faces have outward normals pointing away from the sheet. The top and bottom parts represent the curved side wall; its local normals point sideways relative to the normal field.


      **Equation represented by the visual:** For a positive sheet,


      $$

      \Phi_{\mathrm{left}}=EA,\qquad

      \Phi_{\mathrm{right}}=EA,\qquad

      \Phi_{\mathrm{side}}=0,

      $$


      so


      $$

      \Phi_{\mathrm{total}}=2EA.

      $$


      **Plain-English translation:** Both flat faces count positively because the field leaves the positive sheet and also leaves the pillbox through each outward face. The side wall is crossed sideways, so it adds nothing.
