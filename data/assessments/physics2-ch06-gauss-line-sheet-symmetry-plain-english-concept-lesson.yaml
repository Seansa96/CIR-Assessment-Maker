      explanation: >
        Solution: Planar symmetry forces the field normal to the sheet, reflection symmetry gives equal magnitudes on both sides, and the ideal infinite sheet gives no preferred distance. Choice B is correct.


        Why it works: A translation parallel to the sheet changes nothing, so only the normal direction remains physically distinguished.


        Why the other choices fail: A imports line-charge behavior; C forgets the second side; D uses point-charge intuition for a different source symmetry.
