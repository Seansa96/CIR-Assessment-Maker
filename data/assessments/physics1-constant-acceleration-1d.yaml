questions:
- id: q001
  type: numericResponse
  prompt: 'A particle starts from rest and accelerates at


    $$

    a = 4.0 \text{ m/s}^2

    $$


    for 6.0 s.


    What is its final velocity in m/s?

    '
  answer:
    value: 24
    tolerance: 0.01
  explanation: 'Use


    $$

    v=v_0+at

    $$


    Since $v_0=0$,


    $$

    v=(4)(6)=24\text{ m/s}

    $$


    Related topic: Final Velocity with Constant Acceleration

    '
- id: q002
  type: numericResponse
  prompt: 'A particle has an initial velocity of


    $$

    5.0\text{ m/s}

    $$


    and accelerates uniformly at


    $$

    2.0\text{ m/s}^2

    $$


    for 8.0 s.


    Find its displacement in meters.

    '
  answer:
    value: 104
    tolerance: 0.01
  explanation: 'Use


    $$

    x=v_0t+\frac12at^2

    $$


    $$

    x=(5)(8)+\frac12(2)(8^2)=104

    $$


    Related topic: Displacement with Constant Acceleration

    '
- id: q003
  type: multipleChoice
  prompt: 'Which kinematic equation contains displacement, acceleration, and velocity,
    but does NOT contain time?

    '
  choices:
  - id: a
    text: $v=v_0+at$
  - id: b
    text: $x=v_0t+\frac12at^2$
  - id: c
    text: $v^2=v_0^2+2a\Delta x$
  - id: d
    text: $x=\frac12(v+v_0)t$
  answer:
    choiceId: c
  explanation: 'The equation


    $$

    v^2=v_0^2+2a\Delta x

    $$


    contains no time variable.


    Related topic: Kinematic Equations Without Time

    '
- id: q004
  type: numericResponse
  prompt: 'A particle moving at


    $$

    30\text{ m/s}

    $$


    slows uniformly at


    $$

    -5.0\text{ m/s}^2

    $$


    until it stops.


    How long does this take?

    '
  answer:
    value: 6
    tolerance: 0.01
  explanation: 'Use


    $$

    0=30-5t

    $$


    giving


    $$

    t=6\text{ s}

    $$


    Related topic: Solving Time from Velocity and Acceleration

    '
- id: q005
  type: multipleChoice
  prompt: 'A particle has constant positive acceleration.


    Which statement must be true?

    '
  choices:
  - id: a
    text: Its velocity is constant.
  - id: b
    text: Its velocity changes at a constant rate.
  - id: c
    text: Its position is constant.
  - id: d
    text: Its acceleration is zero.
  answer:
    choiceId: b
  explanation: 'Constant acceleration means velocity changes by equal amounts in equal
    time intervals.


    Related topic: Definition of Constant Acceleration

    '
- id: q006
  type: numericResponse
  prompt: 'A particle begins with velocity


    $$

    v_0=12\text{ m/s}

    $$


    and accelerates at


    $$

    a=3.0\text{ m/s}^2

    $$


    What is its velocity after 5.0 s?

    '
  answer:
    value: 27
    tolerance: 0.01
  explanation: 'Use


    $$

    v=v_0+at

    $$


    $$

    v=12+3(5)=27\text{ m/s}

    $$


    Related topic: Velocity-Time Equation for Constant Acceleration

    '
- id: q007
  type: numericResponse
  prompt: 'A particle starts from rest and travels


    $$

    72\text{ m}

    $$


    under constant acceleration in


    $$

    6.0\text{ s}

    $$


    Find the acceleration in $\text{m/s}^2$.

    '
  answer:
    value: 4
    tolerance: 0.01
  explanation: 'Since $v_0=0$,


    $$

    x=\frac12at^2

    $$


    giving


    $$

    72=\frac12 a (36)

    $$


    so


    $$

    a=4\text{ m/s}^2

    $$


    Related topic: Finding Acceleration from Displacement and Time

    '
- id: q008
  type: multipleChoice
  prompt: 'A particle''s velocity changes from


    $$

    10\text{ m/s}

    $$


    to


    $$

    30\text{ m/s}

    $$


    in 5.0 s.


    Assuming constant acceleration, what is the acceleration?

    '
  choices:
  - id: a
    text: $2\text{ m/s}^2$
  - id: b
    text: $4\text{ m/s}^2$
  - id: c
    text: $6\text{ m/s}^2$
  - id: d
    text: $8\text{ m/s}^2$
  answer:
    choiceId: b
  explanation: 'Use


    $$

    a=\frac{v-v_0}{t}

    $$


    $$

    a=\frac{30-10}{5}=4

    $$


    Related topic: Average Acceleration from Velocity Change

    '
- id: q009
  type: multipleChoice
  prompt: 'A particle is moving in the positive x-direction but has a negative acceleration.


    What does this imply?

    '
  choices:
  - id: a
    text: The particle must be speeding up.
  - id: b
    text: The particle must be slowing down.
  - id: c
    text: The particle is not moving.
  - id: d
    text: Its velocity is constant.
  answer:
    choiceId: b
  explanation: 'Velocity and acceleration have opposite signs, so the particle''s
    speed decreases.


    Related topic: Signs of Velocity and Acceleration

    '
- id: q010
  type: numericResponse
  prompt: 'A particle has


    $$

    v_0=4.0\text{ m/s}

    $$


    and


    $$

    a=2.0\text{ m/s}^2

    $$


    What distance does it travel in the first 10.0 s?

    '
  answer:
    value: 140
    tolerance: 0.01
  explanation: 'Use


    $$

    x=v_0t+\frac12at^2

    $$


    $$

    x=(4)(10)+\frac12(2)(10^2)

    $$


    $$

    x=40+100=140\text{ m}

    $$


    Related topic: Displacement from Initial Velocity and Acceleration

    '
