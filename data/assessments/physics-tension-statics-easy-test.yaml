questions:
- prompt: A block of mass $M$ rests on a frictionless incline of angle $\theta$. It
    is held in place by a string parallel to the incline. Derive an expression for
    the tension $T$.
  type: symbolicResponse
  answer:
    expectedLatex: M g \sin(\theta)
    equivalenceMode: derivative
    variables:
    - M
    - g
    - \theta
    tolerance: 0.001
  explanation: The component of gravity parallel to the incline is $Mg\sin\theta$.
    For equilibrium, $T = Mg\sin\theta$.
  difficultyDimensions:
  - symbolic-manipulation
  - force-balance-1d
  subjectDifficultyTags: []
  difficultyEvidence: Requires equilibrium force balance
  prerequisiteObjectiveIds:
  - phys1-obj-newtons-laws
  sourceChunkIds:
  - src-20260720001005-93652b69c4:chunk-0018
  reasoningSignature: statics-easy-12
  variationAxes:
    scenario: statics configuration 12
    constraints: static equilibrium
    methodBranch: ''
  id: statics-easy-test-q001
