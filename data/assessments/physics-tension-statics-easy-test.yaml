- prompt: A 12 kg chandelier hangs from a single vertical cable. Using $g = 9.8\text{
    m/s}^2$, what is the tension in the cable (in N)?
  type: numericResponse
  answer:
    value: 117.60000000000001
    tolerance: 0.5
  explanation: Since it is at rest, $T = mg = 12(9.8) = 117.60000000000001$ N.
