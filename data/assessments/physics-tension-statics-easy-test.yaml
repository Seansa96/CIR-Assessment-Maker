- prompt: If an object is in static equilibrium, which of the following must be true?
  type: multipleChoice
  choices:
  - id: a
    text: The net force is zero
  - id: b
    text: There are no forces acting on it
  - id: c
    text: It is moving at constant velocity
  answer:
    choiceId: a
  explanation: Static equilibrium requires that $\sum \vec{F} = 0$. Forces may act
    on it, but they must balance.
