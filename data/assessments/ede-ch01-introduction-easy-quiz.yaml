- id: q001
  type: multipleChoice
  prompt: A lake model tracks pollutant mass $M(t)$. Which quantity must $M'(t)$ represent?
  skills:
  - ede-ch01-introduction-model-rate-laws
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-model-rate-laws
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: net pollutant mass change per unit time
  - id: b
    text: the lake volume only
    issueSignals:
    - id: ede-dependent-variable-error
      domains: &id001
      - elementary-differential-equations-bvp
  - id: c
    text: elapsed time
    issueSignals:
    - id: ede-dependent-variable-error
      domains: *id001
  - id: d
    text: pollutant concentration with no volume factor
    issueSignals:
    - id: ede-model-rate-unit-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $M'(t)$ is the net change of pollutant mass per unit time.

    Why it works: A derivative inherits the dependent variable's units divided by the independent variable's units.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q002
  type: numericResponse
  prompt: What is the order of $y'''+(y'')^4+x y=0$? Enter a number.
  skills:
  - ede-ch01-introduction-classify-solutions
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch01-introduction-classify-solutions
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 3
    tolerance: 0
  explanation: |-
    Solution: The order is $3$.

    Why it works: The highest derivative is $y'''$; the fourth power on $y''$ does not raise the order.
- id: q003
  type: symbolicResponse
  prompt: Solve $y'=6x$ with $y(0)=4$. Enter $y(x)$.
  skills:
  - ede-ch01-introduction-initial-value-validity
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch01-introduction-initial-value-validity
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: 3x^2+4
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: |-
    Solution: Integrating gives $y=3x^2+C$; $y(0)=4$ gives $C=4$.

    Why it works: Differentiation returns $6x$ and the initial value is satisfied.
- id: q004
  type: selectAll
  prompt: Which checks are required to verify that $y=e^{2x}$ solves $y'=2y$, $y(0)=1$?
  skills:
  - ede-ch01-introduction-initial-value-validity
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-initial-value-validity
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: Differentiate $e^{2x}$.
  - id: b
    text: Substitute into $y'=2y$.
  - id: c
    text: Check the value at $x=0$.
  - id: d
    text: Replace the initial value with a convenient one.
    issueSignals:
    - id: ede-initial-condition-error
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: |-
    Solution: Differentiate, substitute, and check $y(0)=1$.

    Why it works: All three conditions are needed for an IVP solution.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
- id: q005
  type: multipleChoice
  prompt: 'A solution formula contains $\ln|x-5|$ and passes through $x=2$. Which maximal interval is possible?'
  skills:
  - ede-ch01-introduction-initial-value-validity
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-initial-value-validity
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: '$(-\infty,5)$'
  - id: b
    text: '$(5,\infty)$'
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  - id: c
    text: '$(-\infty,\infty)$'
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  - id: d
    text: $(2,5)$
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The maximal interval is $(-\infty,5)$.

    Why it works: The interval must contain $2$ and cannot cross the singular point $5$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q006
  type: numericResponse
  prompt: For $y'=x-y$, what slope appears in the direction field at $(2,-1)$?
  skills:
  - ede-ch01-introduction-direction-fields
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch01-introduction-direction-fields
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 3
    tolerance: 0
  explanation: |-
    Solution: The slope is $2-(-1)=3$.

    Why it works: A direction-field segment at $(x,y)$ has slope equal to the right-hand side evaluated there.
- id: q007
  type: selectAll
  prompt: For $y'=y(y-3)$, select all equilibrium solutions.
  skills:
  - ede-ch01-introduction-direction-fields
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-direction-fields
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: $y=0$
  - id: b
    text: $y=3$
  - id: c
    text: $y=1$
    issueSignals:
    - id: ede-equilibrium-solution-missed
      domains: *id001
  - id: d
    text: $y=x$
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
  explanation: |-
    Solution: The equilibria are $y=0$ and $y=3$.

    Why it works: Constant solutions make $y'=0$, so solve $y(y-3)=0$.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
- id: q008
  type: multipleChoice
  prompt: How is $x+y^2=4$ classified as a solution relation before solving for $y$?
  skills:
  - ede-ch01-introduction-classify-solutions
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-classify-solutions
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: implicit
  - id: b
    text: explicit
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  - id: c
    text: an initial condition
    issueSignals:
    - id: ede-condition-ignored
      domains: *id001
  - id: d
    text: a direction field
    issueSignals:
    - id: ede-method-selection-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: It is an implicit relation.

    Why it works: The equation relates $x$ and $y$ without isolating one branch of $y(x)$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q009
  type: multipleChoice
  prompt: A population changes at a rate proportional to its current size. Which model expresses that assumption?
  skills:
  - ede-ch01-introduction-model-rate-laws
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-model-rate-laws
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $P'=kP$
  - id: b
    text: $P'=k+t$
    issueSignals:
    - id: ede-model-rate-unit-error
      domains: *id001
  - id: c
    text: $P=kP'$
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  - id: d
    text: $P'=k/P$
    issueSignals:
    - id: ede-method-selection-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The model is $P'=kP$.

    Why it works: Proportionality between rate and current amount means their ratio is the constant $k$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q010
  type: multipleChoice
  prompt: In a direction field, what distinguishes an integral curve from an arbitrary sketch?
  skills:
  - ede-ch01-introduction-direction-fields
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch01-introduction-direction-fields
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: It is tangent to the displayed slope at every point it follows.
  - id: b
    text: It crosses every equilibrium line.
    issueSignals:
    - id: ede-equilibrium-solution-missed
      domains: *id001
  - id: c
    text: It must be a straight line.
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  - id: d
    text: It ignores the horizontal coordinate.
    issueSignals:
    - id: ede-direction-field-sign-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: An integral curve is tangent to the local field everywhere along it.

    Why it works: Its derivative must equal the slope prescribed by the equation at each point.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
