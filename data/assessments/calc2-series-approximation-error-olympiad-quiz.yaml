- id: q001
  type: multipleChoice
  prompt: >
    For an alternating series satisfying the Leibniz hypotheses, the

    sum S lies between consecutive partial sums $S_N$ and $S_{N+1}$.

    What error is guaranteed by their midpoint M?
  choices:
  - id: a
    text: $|S-M|\le b_{N+1}/2$
    media: []
    issueSignals: []
  - id: b
    text: $|S-M|\le b_{N+1}$
    media: []
    issueSignals: []
  - id: c
    text: $|S-M|=b_{N+1}/2$
    media: []
    issueSignals: []
  - id: d
    text: $|S-M|\le b_N/2$
    media: []
    issueSignals: []
  answer:
    choiceId: a
    choiceIds: []
    expected: 
    gradingMode: 
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: The enclosing interval has width $|S_{N+1}-S_N|=b_{N+1}$, so its midpoint is at most half that width from any point inside. Therefore the answer is $|S-M|\le b_{N+1}/2$.


    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


    Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


    Why the other choices fail: $|S-M|\le b_{N+1}$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $|S-M|=b_{N+1}/2$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $|S-M|\le b_N/2$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.


    Prerequisites: Taylor and Maclaurin expansions, remainder estimates, asymptotic/error reasoning, and the prerequisite theorem named in the prompt.


    Further study: Review the relevant Taylor remainder theorem and a proof or derivation of the error estimate before attempting related extrapolation or error-propagation problems.
