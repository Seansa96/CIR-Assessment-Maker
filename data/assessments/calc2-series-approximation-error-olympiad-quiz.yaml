- id: q003
  type: multipleChoice
  prompt: >
    Positive tail terms satisfy $a_{n+1}/a_n\le r<1$ for every

    $n\ge N+1$. Which bound holds for $R_N=\sum_{n=N+1}^{\infty}a_n$?
  choices:
  - id: a
    text: $R_N\le a_{N+1}/(1-r)$
    media: []
    issueSignals: []
  - id: b
    text: $R_N\le ra_{N+1}$
    media: []
    issueSignals: []
  - id: c
    text: $R_N\le a_N/(1+r)$
    media: []
    issueSignals: []
  - id: d
    text: $R_N=a_{N+1}$
    media: []
    issueSignals: []
