id: calc2-series-approximation-error-olympiad-quiz
title: Series Approximation and Error Olympiad Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: series-approximation-error
skills:
- Derive sharp one-sided, two-sided, and uniform series error bounds
- Build geometric majorants and choose effective Taylor centers
- Verify the hypotheses behind remainder estimates
navigation:
