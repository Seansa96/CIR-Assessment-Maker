directedProject:
  summary: >-
    Create a console-based trivia quiz game that asks 5 questions, reads the
    user's answers, keeps score, and displays a final result message. This is
    your first multi-step interactive program.
  estimatedTimeMinutes: 35
  resources: []
  phases:
    - id: phase-1-setup
      title: "Project Setup"
      steps:
        - id: step-1-create
          title: "Create the Project and Plan Questions"
          instruction: |
            Create a new C++ console project named `QuizGame`.

            Start with this skeleton:

            ```cpp
            #include <iostream>
            #include <string>
            using namespace std;

            int main() {
                int score = 0;
                string answer;

                cout << "=== C++ Mini Quiz ===" << endl;
                cout << "Answer each question. Type your answer and press Enter." << endl;
                cout << endl;

                // Questions will go here

                return 0;
            }
            ```

            Before writing code, pick 5 trivia questions on any topic you like
            (C++, science, history, etc.). Write down each question and its correct
            answer.
          checklist:
            - id: chk-project
              text: "Created the QuizGame project with the skeleton"
            - id: chk-questions
              text: "Chose 5 trivia questions with correct answers"
          resources: []

    - id: phase-2-questions
      title: "Asking Questions and Checking Answers"
      steps:
        - id: step-2-first
          title: "Ask the First Question"
          instruction: |
            Add your first question after the header. Here is an example pattern:

            ```cpp
            // Question 1
            cout << "Q1: What keyword starts a C++ program's entry point? ";
            getline(cin, answer);
            if (answer == "main") {
                cout << "Correct!" << endl;
                score++;
            } else {
                cout << "Incorrect. The answer is: main" << endl;
            }
            cout << endl;
            ```

            The `if/else` structure compares the user's answer to the correct answer.
            If it matches, `score++` adds 1 to the score.

            **Note:** You have not formally learned `if/else` yet — that is in the
            Execution Flow area. For now, just follow the pattern above. Think of it
            as: "if the answer matches, do this; otherwise, do that."

            Build and test with a correct and incorrect answer.
          checklist:
            - id: chk-first-q
              text: "First question works with correct/incorrect detection"
            - id: chk-score
              text: "Score increments when the answer is correct"
          resources: []

        - id: step-3-remaining
          title: "Add Questions 2 Through 5"
          instruction: |
            Following the same pattern, add your remaining 4 questions. Each question
            block should:

            1. Print the question with `cout`
            2. Read the answer with `getline(cin, answer)`
            3. Use the `if/else` pattern to check and update the score
            4. Print `endl` between questions for spacing

            Here is an example of question 2:

            ```cpp
            // Question 2
            cout << "Q2: What does cout stand for? ";
            getline(cin, answer);
            if (answer == "character output" || answer == "console output") {
                cout << "Correct!" << endl;
                score++;
            } else {
                cout << "Incorrect. The answer is: character output" << endl;
            }
            cout << endl;
            ```

            **Tip:** You can accept multiple valid answers using `||` (or).

            Build and test after adding each question to catch errors early.
          notesPrompt: "What questions did you choose?"
          checklist:
            - id: chk-all-five
              text: "All 5 questions are implemented"
            - id: chk-each-tested
              text: "Each question tested with correct and incorrect answers"
          resources: []

    - id: phase-3-results
      title: "Displaying Results"
      steps:
        - id: step-4-score
          title: "Show the Final Score"
          instruction: |
            After all questions, display the final score:

            ```cpp
            cout << "=== Quiz Complete ===" << endl;
            cout << "Your score: " << score << " out of 5" << endl;
            ```

            Build and run through the entire quiz to see the score.
          checklist:
            - id: chk-score-display
              text: "Final score displays correctly"
          resources: []

        - id: step-5-message
          title: "Add a Performance Message"
          instruction: |
            Add a message based on the score using `if/else if/else`:

            ```cpp
            if (score == 5) {
                cout << "Perfect score! You're a C++ natural!" << endl;
            } else if (score >= 3) {
                cout << "Good job! Keep studying and you'll master it." << endl;
            } else {
                cout << "Keep practicing! Review the material and try again." << endl;
            }
            ```

            Build and test by intentionally getting different scores to see each message.
          checklist:
            - id: chk-perfect
              text: "Tested the perfect score message (5/5)"
            - id: chk-middle
              text: "Tested the middle range message (3-4/5)"
            - id: chk-low
              text: "Tested the low score message (0-2/5)"
          resources: []

    - id: phase-4-polish
      title: "Polish and Reflect"
      steps:
        - id: step-6-polish
          title: "Add Finishing Touches"
          instruction: |
            Add some final polish:

            1. Add a line at the very start that prints: `"Welcome to the Quiz Game!"`
            2. Add a question counter before each question: `"[1/5]"`, `"[2/5]"`, etc.
            3. Add a goodbye message at the end: `"Thanks for playing!"`

            Example for the counter:

            ```cpp
            cout << "[1/5] Q1: What keyword starts a C++ program's entry point? ";
            ```

            Build and do one final complete playthrough.

            **Reflection:** You just built a real interactive game using only `cout`,
            `cin`/`getline`, `string`, `int`, and the `if/else` pattern. Everything
            else in C++ builds on these fundamentals.
          notesPrompt: "What would you add to make this quiz game even better?"
          checklist:
            - id: chk-counter
              text: "Added question counters like [1/5]"
            - id: chk-polish
              text: "Added welcome and goodbye messages"
            - id: chk-final-run
              text: "Completed a full playthrough of the finished game"
          resources: []
