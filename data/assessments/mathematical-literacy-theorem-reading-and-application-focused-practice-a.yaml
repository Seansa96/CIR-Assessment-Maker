questions:
- id: q001
  type: multipleChoice
  prompt: Before you can invoke a theorem to guarantee a specific result about an object, what must you do first?
  choices:
  - id: a
    text: Verify that the object satisfies every hypothesis listed in the theorem.
  - id: b
    text: Assume the conclusion is true and work backward.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: Check if the converse of the theorem has been proven.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: Find an example where the theorem fails to understand its limits.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - conceptualUnderstanding
  - errorDiagnosis
  difficultyEvidence: Identifies the fundamental requirement for applying deductive mathematical theorems.
  explanation: |-
    Solution: Verify that the object satisfies every hypothesis listed in the theorem.
    Why it works: A theorem of the form $P \\implies Q$ only guarantees $Q$ if you can first prove $P$. You must show that your specific case meets all the conditions of $P$.
    Why the other choices fail: B is circular reasoning (assuming what you want to prove). C is irrelevant; the converse doesn't need to be true to use the direct theorem. D is a good exercise in general, but not the step required to *invoke* the theorem.
- id: q002
  type: multipleChoice
  prompt: In the theorem 'If a function is differentiable at a point, then it is continuous at that point', which
    part gives you the 'permission' to use the theorem's result?
  choices:
  - id: a
    text: 'The hypothesis: ''a function is differentiable at a point''.'
  - id: b
    text: 'The conclusion: ''it is continuous at that point''.'
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: c
    text: The logical connective 'If... then...'.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: The domain of all functions.
    issueSignals:
    - id: mathematical-structure-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Separates the actionable trigger (hypothesis) from the resulting fact (conclusion) in a standard
    implication.
  explanation: |-
    Solution: The hypothesis: 'a function is differentiable at a point'.
    Why it works: The 'if' clause (hypothesis) is the condition you must satisfy. It acts as the key or permission slip to unlock the theorem's result.
    Why the other choices fail: B is the reward (the result), not the permission. C is the structure connecting them. D is too broad; the theorem only grants permission for differentiable functions.
- id: q003
  type: multipleChoice
  prompt: 'A theorem states: ''If a sequence converges, then it is bounded''. You are studying a sequence that diverges
    (does not converge). What does the theorem tell you about your sequence?'
  choices:
  - id: a
    text: The theorem tells you nothing; the sequence might be bounded or unbounded.
  - id: b
    text: The sequence must be unbounded.
    issueSignals:
    - id: inverse-error
  - id: c
    text: The sequence must be bounded.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: The theorem is false for this sequence.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: inverse-error
  difficultyDimensions:
  - logicalEvaluation
  - errorDiagnosis
  difficultyEvidence: Recognizes that failing the hypothesis of a conditional statement leaves the conclusion undetermined.
  explanation: |-
    Solution: The theorem tells you nothing; the sequence might be bounded or unbounded.
    Why it works: A conditional statement $P \\implies Q$ makes no claim about what happens when $P$ is false. The sequence failed the hypothesis, so the theorem's guarantee does not apply.
    Why the other choices fail: B commits the inverse error (assuming $\\neg P \\implies \\neg Q$). C has no logical basis. D misunderstands that a theorem remains universally true even if it doesn't apply to a specific case.
- id: q004
  type: multipleChoice
  prompt: When a theorem concludes with an existential claim, such as '...then there exists a unique solution $x$',
    what can you do with this result in a proof?
  choices:
  - id: a
    text: You can introduce a new variable (like $x_0$) to represent this guaranteed solution and use it in subsequent
      steps.
  - id: b
    text: You must immediately calculate the exact numerical value of $x$ before proceeding.
    issueSignals:
    - id: mathematical-role-confusion
  - id: c
    text: You can assume $x$ is zero to simplify the proof.
    issueSignals:
    - id: mathematical-role-confusion
  - id: d
    text: You cannot use the theorem unless you already know the value of $x$.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-role-confusion
  difficultyDimensions:
  - applicationStrategy
  - errorDiagnosis
  difficultyEvidence: Identifies how to instantiate an existentially quantified conclusion in a mathematical argument.
  explanation: |-
    Solution: You can introduce a new variable (like $x_0$) to represent this guaranteed solution and use it in subsequent steps.
    Why it works: This is called existential instantiation. Once a theorem guarantees a mathematical object exists, you are allowed to name it and manipulate it based on its guaranteed properties, even without knowing its exact formula.
    Why the other choices fail: B is incorrect because existence theorems are often non-constructive. C is an arbitrary and invalid assumption. D defeats the entire purpose of an existence theorem.
