lesson:
  introduction: A molarity is not a reaction amount. Convert each reacting solution to moles, use the balanced equation as a mole-ratio bridge, then convert to the requested quantity.
  sections:
  - id: ss-01
    title: 1. Start with volume in liters
    required: true
    content: Use $n=MV$ only after converting milliliters to liters. The result is moles of the chemical species named by the solution.
    media:
    - type: image
      src: /media/chemistry/solution-stoichiometry-map.svg
      alt: Solution stoichiometry mole map
      caption: Moles connect solution concentration to balanced-equation ratios.
    check:
      id: ss-01-c
      type: numericResponse
      prompt: Find moles AgNO3 in 35.0 mL of 0.200 M AgNO3.
      choices: []
      answer:
        choiceId: 
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 0.007
        tolerance: 0.00001
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $n=(0.200)(0.0350)=0.00700\ \mathrm{mol}$. Why it works: Molarity times liters yields moles. Common trap: Using 35.0 as liters.'
