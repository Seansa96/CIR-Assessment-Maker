  - id: ss-04
    title: 4. Check for excess versus limiting reactant
    required: true
    content: If both reactant quantities are given, calculate how much product each could form or compare required stoichiometric amounts. The smaller product prediction identifies the limiting reactant.
    media:
    - type: image
      src: /media/chemistry/solution-stoichiometry-map.svg
