  - id: ss-05
    title: 5. Use precipitation as an observable product
    required: true
    content: A precipitate removes product from solution. Its theoretical mass comes from the limiting amount of the ions that form it.
    media:
    - type: image
      src: /media/chemistry/solution-stoichiometry-map.svg
      alt: Precipitate yield pathway
      caption: Moles of reacting ions determine precipitate mass.
    check:
      id: ss-05-c
      type: multipleChoice
      prompt: If Cl− is in excess, which amount controls AgCl precipitate?
      choices:
      - id: a
