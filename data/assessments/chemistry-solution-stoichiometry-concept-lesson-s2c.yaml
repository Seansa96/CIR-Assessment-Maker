  - id: ss-02
    title: 2. Balance before using a ratio
    required: true
    content: Coefficients, not subscripts, define mole ratios. Balance the molecular or net ionic equation before converting reactant moles to product moles.
    media:
    - type: image
      src: /media/chemistry/solution-stoichiometry-map.svg
      alt: Balanced-equation mole-ratio bridge
      caption: Coefficients create the mole-ratio bridge.
    check:
      id: ss-02-c
      type: multipleChoice
      prompt: In AgNO3+NaCl→AgCl+NaNO3, what ratio links mol AgNO3 to mol AgCl?
      choices:
      - id: a
        text: 1:1
        media: []
        issueSignals: []
      - id: b
        text: 1:2
        media: []
        issueSignals: []
      - id: c
        text: 2:1
        media: []
        issueSignals: []
      - id: d
        text: depends on molar mass
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The balanced coefficients are both 1, so ratio is 1 mol AgNO3 to 1 mol AgCl. Why it works: Coefficients determine stoichiometric ratios. Why the other choices fail: Subscripts and molar mass do not alter this coefficient ratio.'
