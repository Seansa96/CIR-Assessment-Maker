      explanation: 'Solution: Ag+ is limiting, so its moles set AgCl moles in the 1:1 net ionic equation. Why it works: Excess chloride remains after all Ag+ is consumed. Why the other choices fail: Water and sodium are spectators; density is not enough to establish reaction amount.'
