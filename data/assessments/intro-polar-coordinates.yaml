questions:
- id: q001
  type: multipleChoice
  prompt: In a polar coordinate pair $(r,\theta)$, what does $r$ represent?
  choices:
  - id: a
    text: Distance from the pole
  - id: b
    text: Angle from the positive y-axis
  - id: c
    text: Horizontal coordinate
  - id: d
    text: Slope of the ray
  answer:
    choiceId: a
  explanation: 'The value $r$ measures distance from the pole, which is the polar
    origin.


    Related topic: Meaning of Polar Radius

    '
- id: q002
  type: multipleChoice
  prompt: In standard polar coordinates, $\theta$ is usually measured from which direction?
  choices:
  - id: a
    text: The positive x-axis
  - id: b
    text: The positive y-axis
  - id: c
    text: The negative x-axis
  - id: d
    text: The line y=x
  answer:
    choiceId: a
  explanation: 'Polar angles are measured from the positive x-axis unless another
    reference is stated.


    Related topic: Polar Angle Measurement

    '
- id: q003
  type: multipleChoice
  prompt: Which Cartesian point matches $(r,\theta)=(5,0)$?
  choices:
  - id: a
    text: (5, 0)
  - id: b
    text: (0, 5)
  - id: c
    text: (-5, 0)
  - id: d
    text: (0, -5)
  answer:
    choiceId: a
  explanation: 'An angle of 0 points along the positive x-axis, so the point is 5
    units to the right.


    Related topic: Plotting Basic Polar Points

    '
- id: q004
  type: multipleChoice
  prompt: Which polar point lies on the positive y-axis?
  choices:
  - id: a
    text: $(4,\frac{\pi}{2})$
  - id: b
    text: $(4,0)$
  - id: c
    text: $(4,\pi)$
  - id: d
    text: $(4,\frac{3\pi}{2})$
  answer:
    choiceId: a
  explanation: 'The angle $\pi/2$ points straight upward from the pole.


    Related topic: Special Angles in Polar Coordinates

    '
- id: q005
  type: multipleChoice
  prompt: What are the Cartesian conversion formulas from polar coordinates?
  choices:
  - id: a
    text: $x=r\cos\theta,\ y=r\sin\theta$
  - id: b
    text: $x=r\sin\theta,\ y=r\cos\theta$
  - id: c
    text: $x=r+\cos\theta,\ y=r+\sin\theta$
  - id: d
    text: $x=\frac{r}{\cos\theta},\ y=\frac{r}{\sin\theta}$
  answer:
    choiceId: a
  explanation: 'The\rhorizontal component uses cosine and the vertical component uses
    sine.


    Related topic: Polar to Cartesian Conversion

    '
- id: q006
  type: multipleChoice
  prompt: What is $r$ for the Cartesian point $(3,4)$?
  choices:
  - id: a
    text: '5'
  - id: b
    text: '7'
  - id: c
    text: '1'
  - id: d
    text: '25'
  answer:
    choiceId: a
  explanation: '$r=\sqrt{x^2+y^2}=\sqrt{3^2+4^2}=5$.


    Related topic: Cartesian to Polar Radius

    '
- id: q007
  type: multipleChoice
  prompt: Which equation relates $r$, $x$, and $y$?
  choices:
  - id: a
    text: $r^2=x^2+y^2$
  - id: b
    text: $r=x+y$
  - id: c
    text: $r^2=x+y$
  - id: d
    text: $r=x^2-y^2$
  answer:
    choiceId: a
  explanation: 'The radius is the distance from the origin, so the Pythagorean theorem
    gives $r^2=x^2+y^2$.


    Related topic: Polar Radius Formula

    '
- id: q008
  type: multipleChoice
  prompt: What does a negative polar radius mean?
  choices:
  - id: a
    text: Move in the direction opposite the angle
  - id: b
    text: The point is impossible
  - id: c
    text: The angle must be negative
  - id: d
    text: The point is always at the pole
  answer:
    choiceId: a
  explanation: 'A negative $r$ places the point on the ray opposite the direction
    of $\theta$.


    Related topic: Negative Radius in Polar Coordinates

    '
- id: q009
  type: multipleChoice
  prompt: Which polar coordinate is equivalent to $(3,0)$?
  choices:
  - id: a
    text: $(3,2\pi)$
  - id: b
    text: $(3,\frac{\pi}{2})$
  - id: c
    text: $(3,\pi)$
  - id: d
    text: $(0,3)$
  answer:
    choiceId: a
  explanation: 'Adding $2\pi$ to the angle makes one full rotation and reaches the
    same point.


    Related topic: Equivalent Polar Coordinates

    '
- id: q010
  type: multipleChoice
  prompt: The polar equation $r=4$ represents what shape?
  choices:
  - id: a
    text: A circle centered at the pole
  - id: b
    text: A vertical line
  - id: c
    text: A\rhorizontal line
  - id: d
    text: A ray only
  answer:
    choiceId: a
  explanation: 'All points 4 units from the pole form a circle centered at the pole.


    Related topic: Basic Polar Graphs

    '
- id: q011
  type: numericResponse
  prompt: For $(r,\theta)=(6,0)$, what is the Cartesian x-coordinate?
  answer:
    value: 6
    tolerance: 0.0001
  explanation: '$x=r\cos\theta=6\cos0=6$.


    Related topic: Polar to Cartesian Coordinates

    '
- id: q012
  type: numericResponse
  prompt: For $(r,\theta)=(4,\frac{\pi}{2})$, what is the Cartesian y-coordinate?
  answer:
    value: 4
    tolerance: 0.0001
  explanation: '$y=r\sin\theta=4\sin(\pi/2)=4$.


    Related topic: Polar Coordinates at Special Angles

    '
- id: q013
  type: numericResponse
  prompt: Find $r$ for the point $(-5,12)$.
  answer:
    value: 13
    tolerance: 0.0001
  explanation: '$r=\sqrt{(-5)^2+12^2}=\sqrt{169}=13$.


    Related topic: Converting Cartesian Points to Polar Radius

    '
- id: q014
  type: freeResponse
  prompt: Explain why one point can have more than one polar coordinate pair.
  answer:
    expected: 'Angles that differ by full rotations point in the same direction.

      A negative radius can also describe the same point by using the opposite ray.

      '
    gradingMode: selfCheck
  explanation: 'Polar coordinates are not unique because angles can repeat every $2\pi$
    and negative radii reverse direction.


    Related topic: Non-Unique Polar Representations

    '
- id: q015
  type: numericResponse
  prompt: For $(r,\theta)=(10,\pi)$, what is the Cartesian x-coordinate?
  answer:
    value: -10
    tolerance: 0.0001
  explanation: '$x=r\cos\theta=10\cos\pi=-10$.


    Related topic: Polar Conversion Using Unit Circle Values

    '
