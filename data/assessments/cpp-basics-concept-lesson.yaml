schemaVersion: 1
id: cpp-basics-concept-lesson
title: 'C++ Basics: From Source to Output'
assessmentType: conceptLesson
categoryId: c++
topicId: c++-basics
modeDefault: practice
randomizeQuestions: false
skills: [cpp, program-structure, compilation, console-output]
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [c++, c++-basics, program-structure, build-output]
authoring:
  visualRequirement: required
  visualRationale: A build-and-execution flow makes the distinct roles of source, compiler, linker, executable, and output concrete.
lesson:
  introduction: |
    Follow one small output program from a source file through the build process and into the terminal. Each step answers a different question: what code runs, which names are available, and what the user sees.
  sections:
  - id: source-file
    title: Start with a source file
    content: A file such as `greet.cpp` contains C++ source text. It is not itself an executable; it must be translated before the operating system can run it.
    media:
    - type: image
      src: /assets/cpp/cpp-hello-world.svg
      alt: C++ source file flows through compilation and linking to an executable that writes to a terminal.
      caption: The source, build stages, executable, and terminal output are distinct artifacts.
    check:
      id: source-file-check
      type: multipleChoice
      prompt: Which artifact normally contains the C++ statements you edit?
      choices: [{ id: a, text: 'A `.cpp` source file' }, { id: b, text: A terminal output line }, { id: c, text: The linker itself }, { id: d, text: A namespace }]
      answer: { choiceId: a }
      explanation: The source file holds the program text; compilation and linking turn it into a runnable program.
  - id: main-entry
    title: Enter through main
    content: A hosted C++ program begins execution in `main`. The braces enclose its statements, which execute in order unless control flow later changes that order.
    check:
      id: main-entry-check
      type: multipleChoice
      prompt: What does `int main() { ... }` provide?
      choices: [{ id: a, text: The program entry point and its body }, { id: b, text: A standard-library header }, { id: c, text: A terminal command }, { id: d, text: A compiler option }]
      answer: { choiceId: a }
      explanation: '`main` is the normal entry point; its braces delimit the block that begins execution.'
  - id: declarations
    title: Make output names available
    content: |
      `#include <iostream>` makes declarations for stream I/O available. The `std::` qualifier identifies `cout` as a standard-library name rather than a locally invented one.
    check:
      id: declarations-check
      type: multipleChoice
      prompt: Which line makes the declaration of `std::cout` available?
      choices: [{ id: a, text: '`#include <iostream>`' }, { id: b, text: '`return 0;`' }, { id: c, text: '`std::cout;`' }, { id: d, text: '`using int;`' }]
      answer: { choiceId: a }
      explanation: The header supplies the declaration; `std::` then performs namespace qualification at the use site.
  - id: stream-output
    title: Trace one output statement
    content: In `std::cout << "Ready" << '\\n';`, each `<<` inserts another value into the same output stream. The newline is explicit; C++ does not add one simply because a statement ends.
    check:
      id: stream-output-check
      type: multipleChoice
      prompt: What is printed by `std::cout << "A" << "B";`?
      choices: [{ id: a, text: AB }, { id: b, text: A then B on a new line }, { id: c, text: A B with an inserted space }, { id: d, text: Nothing }]
      answer: { choiceId: a }
      explanation: Chained stream insertion appends both string literals without inserting a space or newline.
  - id: compile-stage
    title: Separate compilation from linking
    content: The compiler checks and translates source into object code. The linker combines object code with required definitions and libraries. A syntax error and an unresolved-symbol link error therefore happen at different stages.
    check:
      id: compile-stage-check
      type: multipleChoice
      prompt: A function is declared but no definition can be found when the program is assembled. Which stage reports that failure?
      choices: [{ id: a, text: The linker }, { id: b, text: '`std::cout`' }, { id: c, text: The editor }, { id: d, text: The newline escape }]
      answer: { choiceId: a }
      explanation: The compiler can translate a call using its declaration; linking fails when the required definition cannot be combined into the executable.
  - id: toolchain-support
    title: Read compatibility diagnostics
    content: Modern C++ facilities depend on the compiler and selected language mode. If a newer header or `std::println` is unavailable, treat the diagnostic as a toolchain-compatibility fact and use a supported alternative such as `<iostream>` and `std::cout`.
    check:
      id: toolchain-support-check
      type: multipleChoice
      prompt: What is the best response when a selected compiler does not provide `<print>`?
      choices: [{ id: a, text: Use a supported output facility or update the toolchain }, { id: b, text: Rename main }, { id: c, text: Remove all headers }, { id: d, text: Assume output is impossible }]
      answer: { choiceId: a }
      explanation: Library availability varies with compiler support and the chosen standard mode; `<iostream>` is a common supported alternative.
  - id: read-debug-cycle
    title: Use a build-output debugging loop
    content: Make one small change, build, read the exact diagnostic or output, and then adjust one cause at a time. This keeps a missing semicolon, a missing header, and a wrong output character from becoming one unexplained failure.
    check:
      id: read-debug-cycle-check
      type: multipleChoice
      prompt: A program builds but prints `BuildRun` when two lines were required. What is the direct repair?
      choices: [{ id: a, text: Insert a newline between the two output fragments }, { id: b, text: Change the linker }, { id: c, text: Remove main }, { id: d, text: Add a reference parameter }]
      answer: { choiceId: a }
      explanation: The build succeeded; the observed behavior shows that the output statement needs an explicit line break.
