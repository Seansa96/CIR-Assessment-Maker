lesson:
  introduction: >
    Follow one small output program from a source file through the build process and into the terminal. Each step answers a different question: what code runs, which names are available, and what the user sees.
  sections:
  - id: source-file
    title: Start with a source file
    required: true
    content: A file such as `greet.cpp` contains C++ source text. It is not itself an executable; it must be translated before the operating system can run it.
    media:
    - type: image
      src: /assets/cpp/cpp-hello-world.svg
      alt: C++ source file flows through compilation and linking to an executable that writes to a terminal.
      caption: The source, build stages, executable, and terminal output are distinct artifacts.
    check:
      id: source-file-check
      type: multipleChoice
      prompt: Which artifact normally contains the C++ statements you edit?
      choices:
      - id: a
        text: A `.cpp` source file
        issueSignals: []
      - id: b
        text: An executable file (`.exe` or `.out`)
        issueSignals: [executable-confusion]
      - id: c
        text: An object file (`.o` or `.obj`)
        issueSignals: [object-file-confusion]
      - id: d
        text: The compiler itself
        issueSignals: [compiler-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        The source file (typically ending in `.cpp`) holds the human-readable program text you edit.


        Why it works:

        Source files are the starting point of the pipeline. The compiler and linker read this file to translate it into a runnable program.


        Why the other choices fail:

        An executable file is the final translated program that runs on the OS, not the text you edit. An object file is an intermediate compiled stage that the linker uses. The compiler is the tool that performs the translation, not the file itself.
  - id: main-entry
    title: Enter through main
    required: true
    content: A hosted C++ program begins execution in `main`. The braces enclose its statements, which execute in order unless control flow later changes that order.
    check:
      id: main-entry-check
      type: multipleChoice
      prompt: What does `int main() { ... }` provide?
      choices:
      - id: a
        text: The program entry point and its body
        issueSignals: []
      - id: b
        text: A standard-library header
        issueSignals: [header-confusion]
      - id: c
        text: A function that runs after the program finishes
        issueSignals: [entry-point-confusion]
      - id: d
        text: An optional label for code organization
        issueSignals: [entry-point-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        `main` is the required entry point for any standard C++ application; its braces delimit the block that begins execution.


        Why it works:

        When the operating system launches your compiled executable, it looks specifically for the `main` function to start running your code.


        Why the other choices fail:

        Headers (like `<iostream>`) are included at the top of the file to provide declarations, they are not the entry point. `main` runs at the beginning, not the end. It is absolutely required, not an optional label.
  - id: declarations
    title: Make output names available
    required: true
    content: >
      `#include <iostream>` makes declarations for stream I/O available. The `std::` qualifier identifies `cout` as a standard-library name rather than a locally invented one. Angle brackets `< >` are used for standard library headers, while quotes `" "` are typically used for your own project headers.
    check:
      id: declarations-check
      type: multipleChoice
      prompt: Which line makes the declaration of `std::cout` available?
      choices:
      - id: a
        text: '`#include <iostream>`'
        issueSignals: []
      - id: b
        text: '`using namespace std;`'
        issueSignals: [namespace-confusion]
      - id: c
        text: '`std::cout;`'
        issueSignals: [declaration-confusion]
      - id: d
        text: '`int main()`'
        issueSignals: [entry-point-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        The header `#include <iostream>` supplies the declaration of the `cout` stream.


        Why it works:

        Before the compiler can let you use `cout`, it needs to know what it is. The `<iostream>` header file contains this blueprint.


        Why the other choices fail:

        `using namespace std;` allows you to drop the `std::` prefix, but the declaration still must come from the header. `std::cout;` by itself is an empty statement, not a declaration. `int main()` defines the entry point, it knows nothing about output streams.
  - id: namespaces-std
    title: 'Namespaces and std::'
    required: true
    content: >
      The C++ Standard Library places all its features inside the `std` namespace to avoid naming collisions with your own code. When you use `std::cout`, you are explicitly asking for the `cout` located in the `std` namespace.

      While you can write `using namespace std;` to avoid typing `std::`, this is often discouraged in larger projects because it defeats the purpose of namespaces and can cause unexpected naming conflicts.
    check:
      id: namespaces-std-check
      type: multipleChoice
      prompt: Why do we write `std::cout` instead of just `cout`?
      choices:
      - id: a
        text: Because `cout` is located inside the `std` namespace.
        issueSignals: []
      - id: b
        text: Because `std::` is a required command to print text.
        issueSignals: [namespace-confusion]
      - id: c
        text: Because `cout` stands for "character output" and `std` stands for "standard".
        issueSignals: [name-origin-confusion]
      - id: d
        text: It's an optional formatting choice with no functional difference.
        issueSignals: [namespace-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        `std::cout` specifies the exact path to the `cout` object within the standard library's `std` namespace.


        Why it works:

        Namespaces act like folders for code. Just as two files can have the same name if they are in different folders, two functions can share a name if they are in different namespaces.


        Why the other choices fail:

        `std::` is not a command, it's a scope resolution operator. While the acronyms are true, they don't explain the syntax requirement. It is functionally necessary unless you explicitly bring the namespace into scope with a `using` directive.
  - id: stream-output
    title: Trace one output statement
    required: true
    content: >
      In `std::cout << "Ready" << '\n';`, each `<<` inserts another value into the same output stream. The newline character `\n` is explicit; C++ does not add one simply because a statement ends.

      You can also use `std::endl`, which inserts a newline and also *flushes* the stream (forces it to print immediately). For most basic programs, `\n` is preferred because flushing is slightly slower and usually unnecessary.
    check:
      id: stream-output-check
      type: multipleChoice
      prompt: What is printed by `std::cout << "A" << "B";`?
      choices:
      - id: a
        text: AB
        issueSignals: []
      - id: b
        text: A then B on a new line
        issueSignals: [newline-insertion-misconception]
      - id: c
        text: A B with an inserted space
        issueSignals: [space-insertion-misconception]
      - id: d
        text: A syntax error
        issueSignals: [syntax-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        Chained stream insertion appends both string literals exactly as they are, without inserting a space or newline.


        Why it works:

        `std::cout` does exactly what you tell it and nothing more. If you don't explicitly insert a space (`" "`) or a newline (`\n`), the characters will be printed side-by-side.


        Why the other choices fail:

        C++ streams do not automatically add spaces or newlines between chained insertions. The syntax is perfectly valid, so it will not cause an error.
  - id: arithmetic-in-output
    title: Arithmetic in Output
    required: true
    content: >
      You aren't limited to just printing text. You can insert mathematical expressions directly into the output stream. C++ will evaluate the expression first and then print the result.

      ```cpp
      std::cout << "3 + 4 = " << 3 + 4 << '\n';
      // Output: 3 + 4 = 7
      ```
    check:
      id: arithmetic-in-output-check
      type: multipleChoice
      prompt: What will `std::cout << 5 * 2;` print to the screen?
      choices:
      - id: a
        text: '10'
        issueSignals: []
      - id: b
        text: '5 * 2'
        issueSignals: [evaluation-confusion]
      - id: c
        text: 'An error, because math must be done on a separate line'
        issueSignals: [syntax-confusion]
      - id: d
        text: '52'
        issueSignals: [concatenation-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        The expression `5 * 2` is evaluated to `10`, and then `10` is printed.


        Why it works:

        The stream insertion operator (`<<`) evaluates the expressions on its right side before passing the resulting value to the stream.


        Why the other choices fail:

        It will not print "5 * 2" because the expression is not enclosed in quotes (it is not a string literal). It is perfectly legal to do math directly in the `cout` statement. It multiplies rather than concatenates the digits.
  - id: statement-termination
    title: Statement Termination and Comments
    required: true
    content: >
      In C++, almost every statement must end with a semicolon (`;`). This tells the compiler where one instruction ends and the next begins. Forgetting a semicolon is one of the most common beginner errors.

      You can also write comments in your code. Comments are completely ignored by the compiler.
      - `//` starts a single-line comment.
      - `/* ... */` encloses a multi-line block comment.
    check:
      id: statement-termination-check
      type: multipleChoice
      prompt: Which of the following is true about semicolons in C++?
      choices:
      - id: a
        text: They are required at the end of most statements to separate instructions.
        issueSignals: []
      - id: b
        text: They are optional and only used for styling.
        issueSignals: [optional-syntax-misconception]
      - id: c
        text: They are used to start comments.
        issueSignals: [comment-syntax-confusion]
      - id: d
        text: They are automatically inserted by the compiler if you press Enter.
        issueSignals: [newline-semantics-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        Semicolons are a mandatory structural element in C++ that mark the end of a statement.


        Why it works:

        Unlike Python or JavaScript, C++ does not care about newlines. You could write your entire program on one line. The compiler relies on semicolons to know when an instruction is finished.


        Why the other choices fail:

        They are strictly required, not optional. Comments start with `//` or `/*`. The compiler never automatically inserts semicolons at newlines.
  - id: exit-semantics
    title: Exit Semantics (return 0)
    required: true
    content: >
      At the end of `main`, you typically see `return 0;`. Since `main` is declared to return an `int` (integer), this statement sends the value `0` back to the operating system when the program finishes.

      By convention, returning `0` means "the program executed successfully." Returning any non-zero value (like `1` or `-1`) signals that an error occurred.
    check:
      id: exit-semantics-check
      type: multipleChoice
      prompt: What is the purpose of returning 0 from the `main` function?
      choices:
      - id: a
        text: It signals to the operating system that the program finished successfully.
        issueSignals: []
      - id: b
        text: It clears the console output screen.
        issueSignals: [io-semantics-confusion]
      - id: c
        text: It resets all variables back to zero.
        issueSignals: [memory-semantics-confusion]
      - id: d
        text: It tells the compiler to stop building the program.
        issueSignals: [build-pipeline-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        The integer returned by `main` is the exit code. `0` conventionally indicates success.


        Why it works:

        When scripts or the operating system run your executable, they check this exit code to know if the program did its job or crashed.


        Why the other choices fail:

        The `return` statement in `main` only controls the exit status. It has no effect on the console output, memory state, or the compiler.
  - id: compile-stage
    title: Separate compilation from linking
    required: true
    content: >
      The compiler checks syntax and translates your source code into object code (often a `.o` or `.obj` file). The linker then takes these object files and combines them with required definitions and libraries to create the final executable.

      A syntax error (like a missing semicolon) is caught by the compiler. An unresolved symbol (like calling a function that doesn't exist) is caught later by the linker.
    check:
      id: compile-stage-check
      type: multipleChoice
      prompt: A function is declared but no definition can be found when the program is assembled. Which stage reports that failure?
      choices:
      - id: a
        text: The linker
        issueSignals: []
      - id: b
        text: The compiler
        issueSignals: [compiler-linker-confusion]
      - id: c
        text: The editor
        issueSignals: [editor-confusion]
      - id: d
        text: The operating system at runtime
        issueSignals: [runtime-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        The compiler can translate a call using its declaration; linking fails when the required definition cannot be combined into the final executable.


        Why it works:

        The compiler only looks at one file at a time and trusts that declarations are valid. The linker's job is to wire everything together; if the actual code for a function is missing, the linker complains.


        Why the other choices fail:

        The compiler passes the file if the syntax is correct. The editor only shows text. The OS won't even get to run the program because the build will fail before an executable is created.
  - id: toolchain-support
    title: Read compatibility diagnostics
    required: true
    content: >
      Modern C++ features depend on the compiler and selected language mode (like `-std=c++17` or `-std=c++20`). If a newer header or feature is unavailable, treat the diagnostic as a toolchain-compatibility fact. You must either update your compiler/flags or use a supported older alternative.
    check:
      id: toolchain-support-check
      type: multipleChoice
      prompt: What is the most appropriate response when your compiler reports that `<print>` (a C++23 feature) cannot be found?
      choices:
      - id: a
        text: Use an older supported output facility like `<iostream>` or update the compiler.
        issueSignals: []
      - id: b
        text: Ignore the error and try to run the executable anyway.
        issueSignals: [build-pipeline-confusion]
      - id: c
        text: Create a blank file named `print` in your folder.
        issueSignals: [header-confusion]
      - id: d
        text: Assume the computer is broken and reinstall the OS.
        issueSignals: [extreme-reaction-misconception]
      answer:
        choiceId: a
      explanation: >
        Solution:

        Library availability varies with compiler support and the chosen standard mode; you must use what the toolchain supports or upgrade the toolchain.


        Why it works:

        C++ evolves over time. If your compiler is older than the feature you are trying to use, it literally does not know what you are talking about.


        Why the other choices fail:

        You cannot run an executable if the compilation fails. Creating a blank file will cause a different error. Reinstalling the OS is a drastic overreaction to a simple version mismatch.
  - id: read-debug-cycle
    title: Use a build-output debugging loop
    required: true
    content: >
      Make one small change, build, read the exact diagnostic (error message) or output, and then adjust one cause at a time. The compiler will give you a line number and column where it detected the error.

      This keeps a missing semicolon, a missing header, and a wrong output character from becoming one giant unexplained failure.
    check:
      id: read-debug-cycle-check
      type: multipleChoice
      prompt: A program builds successfully but prints `BuildRun` when two lines were required. What is the direct repair?
      choices:
      - id: a
        text: Insert a newline (`\n` or `endl`) between the two output fragments.
        issueSignals: []
      - id: b
        text: Delete the `main` function and start over.
        issueSignals: [extreme-reaction-misconception]
      - id: c
        text: Add an extra `#include <iostream>` at the top.
        issueSignals: [header-confusion]
      - id: d
        text: Tell the compiler to ignore errors.
        issueSignals: [build-pipeline-confusion]
      answer:
        choiceId: a
      explanation: >
        Solution:

        The build succeeded; the observed behavior shows that the output statement simply needs an explicit line break.


        Why it works:

        When a program compiles but produces the wrong output, it is a logical error, not a syntax error. You must fix the logic (in this case, missing formatting).


        Why the other choices fail:

        Starting over is unnecessary for a tiny formatting bug. Including the header twice won't change the output. The compiler didn't report an error, so there's nothing to ignore.
