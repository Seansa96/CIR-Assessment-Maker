modeDefault: practice
guidedProject:
  language: css
  projectKind: console
  runnerMode: piston
  initialCode: |
    /* Your previous work */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Add global typography here */
    html { }
    body { }
    
    /* Enhance these selectors */
    .logo { }
    .nav-link { }
  instructions: |
    Welcome back to the Portfolio Capstone!
    
    In this step, we will dramatically improve the professional feel of the site by establishing a typography baseline.
    
    ![Target Preview](/media/css/portfolio_typography_preview.webp)
    
    **Your Task:**
    1. Set the global `html` font size to `16px`.
    2. Set the `body` to use `font-family: 'Inter', sans-serif;` and a `line-height` of `1.6`. Set the text color to `#e0e0e0` and background to `#121212`.
    3. Make the `.logo` stand out: Give it a `font-size` of `1.5rem` and `font-weight: 700` (bold).
    4. Style the `.nav-link` text: Give it a `font-size` of `1rem`, `font-weight: 600`, and color `#a0a0a0`. Remove the default underline with `text-decoration: none;`.
