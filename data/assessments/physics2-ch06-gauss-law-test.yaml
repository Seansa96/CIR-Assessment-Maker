title: Gauss's Law Test
assessmentType: test
categoryId: physics-2
topicId: physics2-gauss-law
attemptQuestionCount: 12
questions:
- id: q001
  type: numericResponse
  skills:
  - physics2-ch06-gauss-law-electric-flux
  prompt: E=300 N/C, A=0.020 m^2, and the outward normal is 60 degrees from E. Enter outward flux in N m^2/C.
  answer:
    value: 3.0
    tolerance: 0.02
  explanation: 'Solution: Phi=3.0 N m^2/C.


    Why it works: Flux is EA cos(theta) with theta from the normal.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-electric-flux
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-electric-flux
- id: q002
  type: numericResponse
  skills:
  - physics2-ch06-gauss-law-gauss-law-concept
  prompt: A closed surface encloses +4.0 nC. Enter its net flux in N m^2/C.
  answer:
    value: 451.8
    tolerance: 1.0
  explanation: 'Solution: Phi=4.0e-9/epsilon0; external charges do not change net flux.


    Why it works: Gauss’s law depends only on enclosed net charge.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-gauss-law-concept
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-electric-flux
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-concept
- id: q003
  type: numericResponse
  skills:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  prompt: An infinite line has lambda=1.0 microC/m. Enter E at r=0.10 m in N/C.
  answer:
    value: 180000.0
    tolerance: 1000.0
  explanation: 'Solution: E=lambda/(2 pi epsilon0 r)=1.80e5 N/C, radially outward.


    Why it works: A coaxial cylinder gives E(2 pi rL)=lambda L/epsilon0.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-concept
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-symmetry
- id: q004
  type: numericResponse
  skills:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  prompt: An infinite sheet has sigma=3.0 nC/m^2. Enter the field magnitude in N/C.
  answer:
    value: 169.4
    tolerance: 1.0
  explanation: 'Solution: E=sigma/(2 epsilon0)=169 N/C.


    Why it works: A pillbox has equal flux through its two faces.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
- id: q005
  type: freeResponse
  skills:
  - physics2-ch06-gauss-law-electric-flux
  prompt: A spherical shell carries total charge Q. Determine E for r<R and r>R.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - For r<R, E=0
    - for r>R, E=kQ/r^2 radially.
  explanation: 'Solution: For r<R, E=0; for r>R, E=kQ/r^2 radially.


    Why it works: Concentric Gaussian surfaces enclose no charge inside and Q outside.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-electric-flux
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-electric-flux
- id: q006
  type: symbolicResponse
  skills:
  - physics2-ch06-gauss-law-gauss-law-concept
  prompt: A uniformly charged solid sphere has total Q and radius R. Enter E(r) for r<R.
  answer:
    expectedLatex: k*Q*r/R^3
    equivalenceMode: simplify
    variables:
    - k
    - Q
    - r
    - R
    tolerance: 1.0e-06
  explanation: 'Solution: E=kQr/R^3 for r<R.


    Why it works: The enclosed charge scales as r^3, while Gaussian area scales as r^2.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-gauss-law-concept
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-electric-flux
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-concept
- id: q007
  type: numericResponse
  skills:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  prompt: A centered point charge q=4.0 nC is inside a cube. Enter flux through one face in N m^2/C.
  answer:
    value: 75.3
    tolerance: 0.5
  explanation: 'Solution: Phi_face=q/(6 epsilon0).


    Why it works: Total flux is q/epsilon0 and cubic symmetry divides it equally.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-concept
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-symmetry
- id: q008
  type: freeResponse
  skills:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  prompt: Explain why a coaxial cylinder is useful for an infinite line charge but a sphere is not.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - On the cylinder’s curved side E is constant and normal
    - on a sphere its magnitude and angle vary.
  explanation: 'Solution: On the cylinder’s curved side E is constant and normal; on a sphere its magnitude and
    angle vary.


    Why it works: A useful Gaussian surface matches the distribution symmetry.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
- id: q009
  type: freeResponse
  skills:
  - physics2-ch06-gauss-law-electric-flux
  prompt: What is E inside conducting material at electrostatic equilibrium, and why?
  answer:
    gradingMode: selfCheck
    keyPoints:
    - E=0
    - otherwise mobile charges would continue to move.
  explanation: 'Solution: E=0; otherwise mobile charges would continue to move.


    Why it works: Electrostatic equilibrium requires no net force-driven charge motion.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-electric-flux
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-electric-flux
- id: q010
  type: freeResponse
  skills:
  - physics2-ch06-gauss-law-gauss-law-concept
  prompt: A conductor has a cavity containing charge q and the conductor itself has net charge Q. Give induced inner
    and outer surface charges.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Inner surface has -q
    - outer surface has Q+q.
  explanation: 'Solution: Inner surface has -q; outer surface has Q+q.


    Why it works: A Gaussian surface within the conductor must enclose zero net charge, and conductor charge is
    conserved.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-gauss-law-concept
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-electric-flux
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-concept
- id: q011
  type: multipleChoice
  skills:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  prompt: A closed surface encloses equal positive and negative charges. Can E be nonzero at points on the surface?
  answer:
    choiceId: a
  explanation: 'Solution: Opposite charges can cancel in net charge while producing a nonzero local field.


    Why it works: Gauss’s law constrains the closed-surface integral, not E at each point.


    Why the other choices fail: The other choices confuse zero net flux with zero field or impose an unrelated geometry
    restriction.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-concept
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  choices:
  - id: a
    text: Yes; zero net enclosed charge fixes total flux, not the pointwise field.
  - id: b
    text: No; zero total charge makes E zero everywhere.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Only if the surface is spherical.
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: Only outside the surface.
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
- id: q012
  type: selectAll
  skills:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  prompt: Select the ideal charge geometries for which a Gaussian surface can make E constant and simplify the flux
    integral.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: 'Solution: The first three match spherical, cylindrical, and planar symmetry; a finite bent wire
    does not.


    Why it works: Matching the Gaussian surface to the charge symmetry makes field magnitude and orientation uniform
    on useful patches.


    The unselected statements either ignore the stated constraint or apply the wrong relation.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  difficultyEvidence: Requires a multistep transfer from a physical setup to a signed, geometric, or energy relation.
  prerequisiteObjectiveIds:
  - physics2-ch06-gauss-law-gauss-law-symmetry
  extensionObjectiveIds:
  - physics2-ch06-gauss-law-conductors-electrostatic-equilibrium
  choices:
  - id: a
    text: Spherical symmetry with a concentric sphere.
  - id: b
    text: Infinite line symmetry with a coaxial cylinder.
  - id: c
    text: Infinite planar symmetry with a pillbox.
  - id: d
    text: An arbitrary finite bent wire with a sphere.
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
