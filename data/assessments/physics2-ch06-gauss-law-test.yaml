questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - spatial-reasoning
  prompt: An infinite flat sheet of charge has a uniform surface charge density $\sigma
    = 8.85 \times 10^{-12}\text{ C/m}^2$. What is the magnitude of the electric field
    $E$ near the sheet (in V/m)? (Use $\epsilon_0 = 8.85 \times 10^{-12}\text{ C}^2/(\text{N
    m}^2)$)
  answer:
    numericValue: 0.5
    tolerance: 0.01
  explanation: 'Solution:

    1) For an infinite sheet, Gauss''s law gives $E = \frac{\sigma}{2\epsilon_0}$.

    2) Substitute values: $E = \frac{8.85 \times 10^{-12}}{2 \times (8.85 \times 10^{-12})}$.

    3) Calculate: $E = 1/2 = 0.5\text{ V/m}$.


    Why it works:

    A cylindrical Gaussian surface intersecting the sheet encloses charge $\sigma
    A$, and flux $2EA$ exits the ends, leading to $2EA = \sigma A / \epsilon_0$.'
