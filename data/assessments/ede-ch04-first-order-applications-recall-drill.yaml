items:
- id: r01
  type: typed
  prompt: Write the exponential growth/decay model.
  answer:
    expected: $Q'=kQ$.
  explanation: |-
    Solution: $Q'=kQ$.

    Why it works: A proportional-rate model produces an exponential transient whose sign, initial value, and limiting behavior determine the interpretation.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-growth-decay
  subjectDifficultyTags: []
- id: r02
  type: typed
  prompt: What equation identifies a steady state for $Q'=a-kQ$?
  answer:
    expected: $a-kQ=0$.
  explanation: |-
    Solution: $a-kQ=0$.

    Why it works: A proportional-rate model produces an exponential transient whose sign, initial value, and limiting behavior determine the interpretation.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-growth-decay
  subjectDifficultyTags: []
- id: r03
  type: typed
  prompt: What quantity decays in Newton cooling?
  answer:
    expected: $T-T_m$.
  explanation: |-
    Solution: $T-T_m$.

    Why it works: The model follows a signed balance: ambient temperature defines the cooling equilibrium, while flow times concentration defines each solute rate.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  subjectDifficultyTags: []
- id: r04
  type: typed
  prompt: State the well-mixed assumption.
  answer:
    expected: The solute concentration is uniform throughout the tank.
  explanation: |-
    Solution: The solute concentration is uniform throughout the tank.

    Why it works: The model follows a signed balance: ambient temperature defines the cooling equilibrium, while flow times concentration defines each solute rate.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  subjectDifficultyTags: []
- id: r05
  type: typed
  prompt: What is the balance rule for a tank?
  answer:
    expected: Rate of amount change equals rate in minus rate out.
  explanation: |-
    Solution: Rate of amount change equals rate in minus rate out.

    Why it works: The model follows a signed balance: ambient temperature defines the cooling equilibrium, while flow times concentration defines each solute rate.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  subjectDifficultyTags: []
- id: r06
  type: typed
  prompt: When is terminal velocity reached?
  answer:
    expected: When net force and acceleration are zero.
  explanation: |-
    Solution: When net force and acceleration are zero.

    Why it works: Newton's law uses a declared positive direction, includes the mass factor, and makes resistance oppose velocity.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-mechanics
  subjectDifficultyTags: []
- id: r07
  type: typed
  prompt: What direction does linear resistance act?
  answer:
    expected: Opposite the velocity.
  explanation: |-
    Solution: Opposite the velocity.

    Why it works: Newton's law uses a declared positive direction, includes the mass factor, and makes resistance oppose velocity.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-mechanics
  subjectDifficultyTags: []
- id: r08
  type: typed
  prompt: What does autonomous mean?
  answer:
    expected: No explicit independent-variable dependence.
  explanation: |-
    Solution: No explicit independent-variable dependence.

    Why it works: The sign of the autonomous rate between its zeros determines phase-line direction and stability.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-autonomous-phase
  subjectDifficultyTags: []
- id: r09
  type: typed
  prompt: What is an equilibrium on a phase line?
  answer:
    expected: A point where the derivative is zero.
  explanation: |-
    Solution: A point where the derivative is zero.

    Why it works: The sign of the autonomous rate between its zeros determines phase-line direction and stability.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-autonomous-phase
  subjectDifficultyTags: []
- id: r10
  type: typed
  prompt: How is stability read from nearby arrows?
  answer:
    expected: Arrows toward an equilibrium mean stable; away mean unstable.
  explanation: |-
    Solution: Arrows toward an equilibrium mean stable; away mean unstable.

    Why it works: The sign of the autonomous rate between its zeros determines phase-line direction and stability.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-autonomous-phase
  subjectDifficultyTags: []
- id: r11
  type: typed
  prompt: How do orthogonal slopes relate?
  answer:
    expected: Their product is $-1$ when defined.
  explanation: |-
    Solution: Their product is $-1$ when defined.

    Why it works: Eliminating the family parameter gives its slope field, and perpendicular trajectories use the negative reciprocal slope.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-curves
  subjectDifficultyTags: []
- id: r12
  type: typed
  prompt: Why eliminate a parameter from a family?
  answer:
    expected: To produce a differential equation shared by the family.
  explanation: |-
    Solution: To produce a differential equation shared by the family.

    Why it works: Eliminating the family parameter gives its slope field, and perpendicular trajectories use the negative reciprocal slope.
  tags:
  - ede-ch04-first-order-applications
  - recall
  skills:
  - ede-ch04-first-order-applications-curves
  subjectDifficultyTags: []
