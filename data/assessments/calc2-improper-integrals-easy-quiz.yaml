questions:
- id: q-imp-eq-1
  title: Identifying Improper Integrals
  prompt: |-
    Which of the following is a Type 2 improper integral?
  type: multipleChoice
  choices:
  - id: c1
    text: $\int_{1}^{\infty} \frac{1}{x^2} \, dx$
  - id: c2
    text: $\int_{0}^{1} \frac{1}{\sqrt{x}} \, dx$
  - id: c3
    text: $\int_{0}^{\pi} \sin(x) \, dx$
  answer:
    choiceId: c2
  explanation: |-
    A Type 2 improper integral has finite bounds, but an infinite discontinuity within or at the edge of the interval. $\frac{1}{\sqrt{x}}$ is undefined and approaches infinity at $x=0$, which is the lower bound. (Choice 1 is a Type 1 integral because of the infinite bound).
  skills:
  - calc2-improper-integrals

- id: q-imp-eq-2
  title: Evaluating a Basic Type 1
  prompt: |-
    Does the integral $\int_{1}^{\infty} \frac{1}{x^3} \, dx$ converge or diverge? If it converges, to what value?
  type: multipleChoice
  choices:
  - id: c1
    text: Converges to $\frac{1}{2}$
  - id: c2
    text: Converges to $1$
  - id: c3
    text: Diverges
  answer:
    choiceId: c1
  explanation: |-
    $\lim_{t \to \infty} \int_{1}^{t} x^{-3} \, dx = \lim_{t \to \infty} \left[ -\frac{1}{2}x^{-2} \right]_{1}^{t} = \lim_{t \to \infty} \left( -\frac{1}{2t^2} - (-\frac{1}{2(1)^2}) \right)$.
    As $t \to \infty$, $\frac{1}{2t^2} \to 0$.
    The result is $0 + \frac{1}{2} = \frac{1}{2}$.
  skills:
  - calc2-improper-integrals

- id: q-imp-eq-3
  title: The p-Test for Integrals
  prompt: |-
    According to the $p$-test for integrals, $\int_{1}^{\infty} \frac{1}{x^p} \, dx$ converges if and only if:
  type: multipleChoice
  choices:
  - id: c1
    text: $p > 1$
  - id: c2
    text: $p \ge 1$
  - id: c3
    text: $p < 1$
  answer:
    choiceId: c1
  explanation: |-
    The integral converges if the power in the denominator is strictly greater than 1. For example, $1/x^2$ converges, but $1/x$ diverges.
  skills:
  - calc2-improper-integrals
