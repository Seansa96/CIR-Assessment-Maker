questions:
- id: q001
  type: freeResponse
  prompt: Prove that \(\int_0^\infty \frac{x^{1}}{1+x^{4}} \, dx = \frac{\pi}{4\sin(\pi/4)}
    \) (Parameter a=9)
  answer:
    gradingMode: selfCheck
    checkModel: Proof requires contour integration or beta functions.
  explanation: Substitute u = x^n and utilize the Gamma/Beta function properties or
    complex analysis.
- id: q002
  type: freeResponse
  prompt: 'Evaluate the integral: \(\int \frac{1}{x^{2} \sqrt{16 - x^{2}}} \, dx\)'
  answer:
    gradingMode: selfCheck
    checkModel: '\begin{cases} - \frac{i \sqrt{x^{2} - 16}}{16 x} & \text{for}\: \left|{x^{2}}\right|
      > 16 \\- \frac{\sqrt{16 - x^{2}}}{16 x} & \text{otherwise} \end{cases} + C'
  explanation: Use trigonometric substitution x = 4\sin\theta.
