questions:
- id: q001
  type: multipleChoice
  prompt: 'Which expression defines $\int_2^\infty f(x)\,dx$?'
  choices: [{ id: a, text: '$\lim_{t\to\infty}\int_2^t f(x)\,dx$' }, { id: b, text: '$\int_2^\infty f(x)\,dx$ with infinity substituted' }, { id: c, text: '$\lim_{t\to2^+}\int_t^\infty f(x)\,dx$' }, { id: d, text: '$f(\infty)-f(2)$' }]
  answer: { choiceId: a }
  explanation: 'An infinite upper boundary is defined by truncating at a finite t and taking the limit as t grows. Infinity is not an ordinary endpoint to substitute.'
  difficultyDimensions: [representationTransfer, domainCondition]
  difficultyEvidence: Identifies an infinite boundary and selects the matching limit model.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q002
  type: multipleChoice
  prompt: 'Evaluate $\int_1^\infty 1/x^3\,dx$.'
  choices: [{ id: a, text: '$1/2$' }, { id: b, text: '$1$' }, { id: c, text: 'Diverges' }, { id: d, text: '$0$' }]
  answer: { choiceId: a }
  explanation: 'Use $\lim_{t\to\infty}[-1/(2x^2)]_1^t$. The upper term tends to zero, leaving one-half; the p equals three tail therefore converges.'
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
  difficultyEvidence: Builds the truncated-tail limit and evaluates an antiderivative at a moving endpoint.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q003
  type: multipleChoice
  prompt: 'Evaluate $\int_{-\infty}^{-1}x^{-2}\,dx$.'
  choices: [{ id: a, text: '$1$' }, { id: b, text: '$-1$' }, { id: c, text: 'Diverges because the bound is negative infinity' }, { id: d, text: '$0$' }]
  answer: { choiceId: a }
  explanation: 'Use a lower cutoff t and the antiderivative -1/x. The truncated value is $[-1/x]_t^{-1}=1+1/t$, which tends to 1 as t approaches negative infinity.'
  difficultyDimensions: [modelOrDerivation, domainCondition]
  difficultyEvidence: Uses the left-tail cutoff orientation and evaluates the resulting limit with a negative infinite bound.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q004
  type: multipleChoice
  prompt: 'Which setup is correct for $\int_0^1\ln x\,dx$?'
  choices: [{ id: a, text: '$\lim_{t\to0^+}\int_t^1\ln x\,dx$' }, { id: b, text: '$\lim_{t\to\infty}\int_0^t\ln x\,dx$' }, { id: c, text: '$\int_0^1\ln0\,dx$' }, { id: d, text: 'No limit is required because ln x is integrable' }]
  answer: { choiceId: a }
  explanation: 'Although ln x has a finite integral, it is undefined at zero. The definition still requires the lower cutoff to approach zero from the right.'
  difficultyDimensions: [domainCondition, representationTransfer]
  difficultyEvidence: Recognizes a finite-endpoint singularity and selects its one-sided limit definition.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q005
  type: multipleChoice
  prompt: 'Does $\int_0^1\ln x\,dx$ converge, and if so to what value?'
  choices: [{ id: a, text: 'It converges to $-1$.' }, { id: b, text: 'It diverges because ln 0 is undefined.' }, { id: c, text: 'It converges to 0.' }, { id: d, text: 'It diverges to negative infinity.' }]
  answer: { choiceId: a }
  explanation: 'Evaluate $\lim_{t\to0^+}[x\ln x-x]_t^1$. The lower expression tends to zero, so the result is -1; undefined integrand values do not automatically force divergence.'
  difficultyDimensions: [auxiliaryTechnique, errorDiagnosis]
  difficultyEvidence: Evaluates an endpoint limit and rejects the false rule that every undefined endpoint makes an integral diverge.
  prerequisiteObjectiveIds: [calc2-improper-identify-and-limit]
- id: q006
  type: multipleChoice
  prompt: 'For $\int_0^2 1/(x-1)^2\,dx$, what is the first required action?'
  choices: [{ id: a, text: 'Split at x=1 into two one-sided limits.' }, { id: b, text: 'Integrate from 0 to 2 without changing anything.' }, { id: c, text: 'Use a symmetric principal value.' }, { id: d, text: 'Replace x=1 by zero.' }]
  answer: { choiceId: a }
  explanation: 'The denominator vanishes at an interior point. Ordinary improper integration requires independent left and right limits, and either divergent component makes the full integral diverge.'
  difficultyDimensions: [modelOrDerivation, casePartition]
  difficultyEvidence: Detects an interior singularity and partitions the integral into the two required cases.
  prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate]
- id: q007
  type: multipleChoice
  prompt: 'Which integral diverges by comparison with $\int_1^\infty1/x\,dx$?'
  choices: [{ id: a, text: '$\int_1^\infty 1/\sqrt{x^2+1}\,dx$' }, { id: b, text: '$\int_1^\infty1/(x^2+1)\,dx$' }, { id: c, text: '$\int_1^\infty e^{-x}\,dx$' }, { id: d, text: '$\int_1^\infty1/x^3\,dx$' }]
  answer: { choiceId: a }
  explanation: 'For x at least one, $\sqrt{x^2+1}\le\sqrt2x$, so the integrand is at least $1/(\sqrt2x)$. That divergent harmonic-size comparison proves divergence.'
  difficultyDimensions: [simplification, proofJustification]
  difficultyEvidence: Establishes a useful denominator bound and uses it in the divergent direct-comparison direction.
  prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison]
- id: q008
  type: multipleChoice
  prompt: 'Which statement about $\int_{-\infty}^{\infty}f(x)\,dx$ is required for ordinary convergence?'
  choices: [{ id: a, text: 'Both one-sided tails must converge separately.' }, { id: b, text: 'Only their symmetric sum must have a finite limit.' }, { id: c, text: 'f must be even.' }, { id: d, text: 'f must be positive.' }]
  answer: { choiceId: a }
  explanation: 'Choose any finite split point and test the left and right tails independently. A principal-value cancellation is not the same as convergence of the ordinary improper integral.'
  difficultyDimensions: [casePartition, errorDiagnosis]
  difficultyEvidence: Splits a two-tailed integral and distinguishes ordinary convergence from a principal-value shortcut.
  prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate]
- id: q009
  type: multipleChoice
  prompt: 'Use limit comparison to classify $\int_1^\infty(3x^2+1)/(x^4+5)\,dx$.'
  choices: [{ id: a, text: 'Converges; its ratio to 3/x squared tends to 1.' }, { id: b, text: 'Diverges; every rational tail diverges.' }, { id: c, text: 'Diverges; the numerator has degree 2.' }, { id: d, text: 'Converges only as a principal value.' }]
  answer: { choiceId: a }
  explanation: 'The leading terms give $(3x^2)/(x^4)=3/x^2$. Their ratio tends to one, so the integrand has the same convergent behavior as a p equals two tail.'
  difficultyDimensions: [simplification, representationTransfer]
  difficultyEvidence: Extracts leading-term behavior and transfers it through a limit-comparison argument.
  prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison]
- id: q010
  type: multipleChoice
  prompt: 'If one component of a split improper integral diverges, what is the classification of the original integral?'
  choices: [{ id: a, text: 'It diverges.' }, { id: b, text: 'It converges if the other component is finite.' }, { id: c, text: 'It has principal-value convergence.' }, { id: d, text: 'It is automatically zero.' }]
  answer: { choiceId: a }
  explanation: 'The definition requires every component limit to be finite. There is no cancellation rule in the ordinary definition, so one divergent side decides the whole integral.'
  difficultyDimensions: [proofJustification, errorDiagnosis]
  difficultyEvidence: Applies the all-components requirement and rejects cancellation as a substitute for convergence.
  prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate]
