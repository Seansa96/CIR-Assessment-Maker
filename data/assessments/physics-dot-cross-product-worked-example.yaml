schemaVersion: 1
id: physics-dot-cross-product-worked-example
title: Dot Product and Cross Product Worked Example
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
  - physics-vectors
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Choosing and computing dot and cross products
    problem: |
      Compare the two major vector products:

      $$
      \vec{A}=2\hat{i}+3\hat{j},
      \qquad
      \vec{B}=4\hat{i}-\hat{j}.
      $$

      The dot product measures parallel alignment and produces a scalar. The cross product measures perpendicular orientation and produces a vector.
    steps:
      - id: s001
        title: Decide what kind of result you need
        instruction: "Dot product and cross product are chosen partly by the type of result needed."
        type: selectAll
        prompt: "Which statements are true?"
        choices:
          - id: a
            text: 'The dot product produces a scalar.'
          - id: b
            text: 'The cross product produces a vector.'
          - id: c
            text: 'The dot product is useful for projection and work.'
          - id: d
            text: 'The cross product is useful for torque and area direction.'
        answer:
          choiceIds: [a, b, c, d]
        hint: 'Ask whether the output should be a number or a directed vector.'
        explanation: |
          $\vec{A}\cdot\vec{B}$ is scalar. $\vec{A}\times\vec{B}$ is a vector perpendicular to both inputs.

          Related topic: Choosing vector products. Look up work for dot product and torque for cross product.

      - id: s002
        title: Compute the dot product from components
        instruction: "Multiply matching components and add the products."
        type: multipleChoice
        prompt: 'For $\vec{A}=(2,3)$ and $\vec{B}=(4,-1)$, what is $\vec{A}\cdot\vec{B}$?'
        choices:
          - id: a
            text: '$5$'
          - id: b
            text: '$11$'
          - id: c
            text: '$-5$'
          - id: d
            text: '$8\hat{i}-3\hat{j}$'
        answer:
          choiceId: a
        hint: 'Use $A_xB_x+A_yB_y$.'
        explanation: |
          $$
          \vec{A}\cdot\vec{B}=2(4)+3(-1)=8-3=5.
          $$

          Related topic: Dot product by components. The exact method is multiply matching components, then add.

      - id: s003
        title: Interpret the sign of a dot product
        instruction: "The sign of the dot product tells you whether the vectors point mostly together, perpendicular, or opposite."
        type: multipleChoice
        prompt: 'If $\vec{A}\cdot\vec{B}<0$, what does that usually mean about the angle between the vectors?'
        choices:
          - id: a
            text: 'The angle is greater than $90^\circ$.'
          - id: b
            text: 'The vectors are exactly parallel in the same direction.'
          - id: c
            text: 'The vectors must have equal magnitudes.'
          - id: d
            text: 'The cross product must be zero.'
        answer:
          choiceId: a
        hint: 'Use $\vec{A}\cdot\vec{B}=|\vec{A}||\vec{B}|\cos\theta$.'
        explanation: |
          Since $\cos\theta$ is negative for obtuse angles, a negative dot product means the vectors point more against each other than with each other.

          Related topic: Dot product angle interpretation.

      - id: s004
        title: Compute a 2D cross product as a k component
        instruction: 'For two vectors in the $xy$-plane, the cross product points in the $\hat{k}$ direction.'
        type: multipleChoice
        prompt: 'For $\vec{A}=(2,3,0)$ and $\vec{B}=(4,-1,0)$, what is $\vec{A}\times\vec{B}$?'
        choices:
          - id: a
            text: '$-14\hat{k}$'
          - id: b
            text: '$14\hat{k}$'
          - id: c
            text: '$5\hat{k}$'
          - id: d
            text: '$5$'
        answer:
          choiceId: a
        hint: 'For 2D vectors, use $(A_xB_y-A_yB_x)\hat{k}$.'
        explanation: |
          $$
          \vec{A}\times\vec{B}=(2(-1)-3(4))\hat{k}=(-2-12)\hat{k}=-14\hat{k}.
          $$

          Related topic: Cross product in the plane. The exact computation is $A_xB_y-A_yB_x$.

      - id: s005
        title: Use the right-hand rule
        instruction: "The sign of the $k$ component tells you whether the cross product points out of or into the page."
        type: multipleChoice
        prompt: 'In a standard $xy$ coordinate system, a positive $\hat{k}$ cross product points where?'
        choices:
          - id: a
            text: 'Out of the page or screen'
          - id: b
            text: 'Into the page or screen'
          - id: c
            text: 'Along the negative $x$-axis'
          - id: d
            text: 'Along the negative $y$-axis'
        answer:
          choiceId: a
        hint: 'Use the right-hand coordinate system: $\hat{i}\times\hat{j}=\hat{k}$.'
        explanation: |
          In the usual right-handed coordinate system, $+\hat{k}$ points out of the page when $+\hat{x}$ is right and $+\hat{y}$ is up.

          Related topic: Right-hand rule. If this is fuzzy, review the orientation of $\hat{i}$, $\hat{j}$, and $\hat{k}$.

      - id: s006
        title: Choose product by physics context
        instruction: "Physics formulas often tell you which product to use."
        type: selectAll
        prompt: "Which formulas use the cross product structure?"
        choices:
          - id: a
            text: '$\vec{\tau}=\vec{r}\times\vec{F}$'
          - id: b
            text: '$\vec{L}=\vec{r}\times\vec{p}$'
          - id: c
            text: '$W=\vec{F}\cdot\vec{d}$'
          - id: d
            text: '$P=\vec{F}\cdot\vec{v}$'
        answer:
          choiceIds: [a, b]
        hint: 'Cross product formulas usually produce a vector direction perpendicular to a plane.'
        explanation: |
          Torque and angular momentum use cross products because their direction is perpendicular to the plane of rotation. Work and power use dot products because they measure parallel contribution.

          Related topic: Physics meaning of vector products.

