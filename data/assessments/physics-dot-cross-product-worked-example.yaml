workedExamples:
  - id: we-dot-product
    title: Dot product from components
    problem: 'For $\vec A=2\hat i+3\hat j$ and $\vec B=4\hat i-\hat j$, calculate the dot product and interpret the result type.'
    steps:
      - id: dot-1
        title: Multiply matching components
        instruction: 'Use $\vec A\cdot\vec B=A_xB_x+A_yB_y$.'
        type: numericResponse
        prompt: 'What is $\vec A\cdot\vec B$?'
        answer: { value: 5, tolerance: 0.001 }
        explanation: 'Solution: $2(4)+3(-1)=8-3=5$.\n\nWhy it works: The dot product sums products of corresponding components.'
      - id: dot-2
        title: Identify output type
        instruction: 'A dot product does not retain a direction vector.'
        type: multipleChoice
        prompt: 'The result $5$ is a:'
        choices: [{ id: a, text: 'scalar' }, { id: b, text: 'vector in the plane' }]
        answer: { choiceId: a }
        explanation: 'Solution: It is a scalar.\n\nWhy it works: A dot product measures alignment and produces one number.\n\nWhy the other choices fail: A vector result belongs to a cross product, not a dot product.'
  - id: we-cross-product
    title: Cross product direction and magnitude
    problem: 'For $\vec A=2\hat i+3\hat j$ and $\vec B=4\hat i-\hat j$, calculate $\vec A\times\vec B$.'
    steps:
      - id: cross-1
        title: Compute signed z component
        instruction: 'For planar vectors, $(A_xB_y-A_yB_x)\hat k$ gives the cross product.'
        type: numericResponse
        prompt: 'What is the coefficient of $\hat k$?'
        answer: { value: -14, tolerance: 0.001 }
        explanation: 'Solution: $2(-1)-3(4)=-2-12=-14$.\n\nWhy it works: The determinant formula computes the oriented area component.'
      - id: cross-2
        title: State vector answer
        instruction: 'Attach the out-of-plane unit vector.'
        type: symbolicResponse
        prompt: 'Write $\vec A\times\vec B$. '
        answer: { gradingMode: auto, expectedLatex: '-14 \hat{k}', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $\vec A\times\vec B=-14\hat k$.\n\nWhy it works: A negative coefficient points into the page under the standard right-handed coordinate convention.'
