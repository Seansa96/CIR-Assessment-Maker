questions:
- id: hard-quiz-q022
  type: multipleChoice
  prompt: A chase gives x+20=3x-40. Find x.
  choices:
  - id: a
    text: '10'
  - id: b
    text: '60'
  - id: c
    text: '15'
  - id: d
    text: '30'
  answer:
    choiceId: d
  explanation: Solve the equality of justified angles. A common error is 10.
- id: hard-quiz-q021
  type: multipleChoice
  prompt: To use isosceles facts in a circle with center O and chord AB, what should you draw?
  choices:
  - id: a
    text: The stated facts are insufficient.
  - id: b
    text: Use the diagram scale to estimate the result.
  - id: c
    text: Radii OA and OB
  - id: d
    text: A random tangent
  answer:
    choiceId: c
  explanation: They create isosceles triangle OAB. A common error is a random tangent.
- id: hard-quiz-q063
  type: multipleChoice
  prompt: An inscribed angle intercepts a semicircle. Find angle.
  choices:
  - id: a
    text: 100 degrees
  - id: b
    text: 90 degrees
  - id: c
    text: 180 degrees
  - id: d
    text: 45 degrees
  answer:
    choiceId: b
  explanation: Half of 180. A common error is 180 degrees.
- id: hard-quiz-q017
  type: multipleChoice
  prompt: Two chords intersect inside circle; intercepted arcs are 70 and 110. Find angle.
  choices:
  - id: a
    text: 90 degrees
  - id: b
    text: 20 degrees
  - id: c
    text: 45 degrees
  - id: d
    text: 100 degrees
  answer:
    choiceId: a
  explanation: Inside chord angle is half sum. A common error is 20 degrees.
- id: hard-quiz-q019
  type: multipleChoice
  prompt: Cyclic quadrilateral angles are 2x and 4x opposite. Find x.
  choices:
  - id: a
    text: '45'
  - id: b
    text: 150 degrees
  - id: c
    text: 15 degrees
  - id: d
    text: 30 degrees
  answer:
    choiceId: d
  explanation: They sum 180. A common error is 45.
- id: hard-quiz-q023
  type: multipleChoice
  prompt: Why can you not assume two unmarked lines are parallel?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: Apply the converse without checking its hypothesis.
  - id: c
    text: Parallelism requires a marking or proof
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: c
  explanation: They look equally spaced.
- id: hard-quiz-q054
  type: multipleChoice
  prompt: Exterior angle 150; one remote 72. Find other.
  choices:
  - id: a
    text: 39 degrees
  - id: b
    text: 78 degrees
  - id: c
    text: 30 degrees
  - id: d
    text: 102 degrees
  answer:
    choiceId: b
  explanation: Subtract 72. A common error is 30 degrees.
- id: hard-quiz-q015
  type: multipleChoice
  prompt: AB=AC and exterior angle at B is 130. Find angle A.
  choices:
  - id: a
    text: 80 degrees
  - id: b
    text: 130 degrees
  - id: c
    text: 100 degrees
  - id: d
    text: 40 degrees
  answer:
    choiceId: a
  explanation: Interior B is 50, so C=50. A common error is 130 degrees.
- id: hard-quiz-q105
  type: multipleChoice
  prompt: A triangle has angles 30 and 70. An exterior angle at third vertex is what?
  choices:
  - id: a
    text: 80 degrees
  - id: b
    text: 50 degrees
  - id: c
    text: 110 degrees
  - id: d
    text: 100 degrees
  answer:
    choiceId: d
  explanation: It equals two remote angles. A common error is 80 degrees.
- id: hard-quiz-q013
  type: multipleChoice
  prompt: 'Parallel lines: alternate interior angle is 3x+5 and its mate 80. Find x.'
  choices:
  - id: a
    text: '50'
  - id: b
    text: '12.5'
  - id: c
    text: '25'
  - id: d
    text: '85'
  answer:
    choiceId: c
  explanation: Set equal and solve. A common error is 85.
- id: hard-quiz-q020
  type: multipleChoice
  prompt: A regular hexagon has interior 120. An adjacent exterior turn is what?
  choices:
  - id: a
    text: 70 degrees
  - id: b
    text: 60 degrees
  - id: c
    text: 120 degrees
  - id: d
    text: 30 degrees
  answer:
    choiceId: b
  explanation: Interior plus exterior is 180. A common error is 120 degrees.
- id: hard-quiz-q057
  type: multipleChoice
  prompt: A tangent-chord angle is 55. Find its intercepted arc.
  choices:
  - id: a
    text: 110 degrees
  - id: b
    text: 55 degrees
  - id: c
    text: 70 degrees
  - id: d
    text: 120 degrees
  answer:
    choiceId: a
  explanation: Arc is twice tangent-chord angle. A common error is 55 degrees.
- id: hard-quiz-q014
  type: multipleChoice
  prompt: Exterior angle is 140, one remote interior is 65. Find other remote.
  choices:
  - id: a
    text: 40 degrees
  - id: b
    text: 105 degrees
  - id: c
    text: 37.5 degrees
  - id: d
    text: 75 degrees
  answer:
    choiceId: d
  explanation: Exterior equals remote sum. A common error is 40 degrees.
- id: hard-quiz-q061
  type: multipleChoice
  prompt: A chase obtains 2x+15=75. Find x.
  choices:
  - id: a
    text: '60'
  - id: b
    text: '15'
  - id: c
    text: '30'
  - id: d
    text: '45'
  answer:
    choiceId: c
  explanation: Subtract then divide. A common error is 45.
- id: hard-quiz-q060
  type: multipleChoice
  prompt: A chord subtends an angle at circle center. What triangle is formed by radii to endpoints?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
  - id: b
    text: Isosceles triangle
  - id: c
    text: Equilateral always
  - id: d
    text: The stated facts are insufficient.
  answer:
    choiceId: b
  explanation: Both sides are radii. A common error is equilateral always.
