- id: hard-quiz-q022
  type: multipleChoice
  prompt: An angle chase gives $x+20 = 3x-40$ for a pair of vertical angles. Find $x$.
  choices:
  - id: a
    text: '10'
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: '60'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: c
    text: '15'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: d
    text: '30'
  answer:
    choiceId: d
  difficultyDimensions:
  - Form an algebraic equation based on vertical angles being equal.
  - Solve a multi-step linear equation for $x$.
  explanation: 'Solution:

    Vertical angles are strictly equal:

    $$x + 20 = 3x - 40$$

    $$20 + 40 = 3x - x$$

    $$60 = 2x \implies x = 30$$


    Why it works:

    Vertical angles are structurally congruent. Equating algebraic expressions representing their measures
    yields a solvable linear equation.


    Why the other choices fail:

    - **(A)** 10 results from $20 = 2x \implies x=10$ (subtracting 40 instead of adding).

    - **(B)** 60 is the value of $2x$, failing to divide by 2.

    - **(C)** 15 comes from $60 = 4x \implies x=15$ (adding $x$ to $3x$).

    '
- id: hard-quiz-q021
  type: multipleChoice
  prompt: To use isosceles triangle facts in a circle with center $O$ and chord $AB$, what auxiliary segments
    should you draw?
  choices:
  - id: a
    text: The stated facts are insufficient.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: b
    text: A perpendicular bisector of the chord.
    issueSignals:
    - id: wrong-construction
      domains: []
  - id: c
    text: Radii $OA$ and $OB$
  - id: d
    text: A random tangent through $A$
    issueSignals:
    - id: wrong-construction
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recognize that drawing radii creates an isosceles triangle.
  - Use auxiliary lines strategically to unlock circle theorems.
  explanation: 'Solution:

    Draw radii $OA$ and $OB$. Because all radii of the same circle are equal, $OA = OB$. This creates
    isosceles triangle $\triangle OAB$.


    Why it works:

    Adding radii from the center to chord endpoints is a standard geometric construction that instantly
    provides two equal sides, enabling the use of isosceles base-angle theorems.


    Why the other choices fail:

    - **(B)** A perpendicular bisector is helpful, but it does not directly invoke isosceles triangle
    base-angle facts without the radii.

    - **(D)** A tangent introduces right angles but does not create an isosceles triangle by itself.

    '
- id: hard-quiz-q063
  type: multipleChoice
  prompt: An inscribed angle intercepts a semicircle. Find the measure of the angle.
  choices:
  - id: a
    text: 100 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: b
    text: 90 degrees
  - id: c
    text: 180 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: d
    text: 45 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Identify that a semicircle is exactly a 180-degree arc.
  - Halve the arc to find the inscribed angle (Thales' theorem).
  explanation: 'Solution:

    A semicircle has an arc measure of $180^\circ$.

    An inscribed angle is half of its intercepted arc.

    $$\frac{1}{2}(180^\circ) = 90^\circ$$


    Why it works:

    This is Thales'' theorem: any angle inscribed in a semicircle is a right angle.


    Why the other choices fail:

    - **(C)** 180 assumes the inscribed angle equals the arc.

    - **(D)** 45 is half of 90, which halves the angle a second time.

    '
- id: hard-quiz-q017
  type: multipleChoice
  prompt: Two chords intersect inside a circle. Their intercepted arcs measure 70 and 110. Find the angle
    between the chords.
  choices:
  - id: a
    text: 90 degrees
  - id: b
    text: 20 degrees
    issueSignals:
    - id: formula-error
      domains: []
  - id: c
    text: 45 degrees
    issueSignals:
    - id: formula-error
      domains: []
  - id: d
    text: 100 degrees
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Recall the interior intersecting chords angle theorem.
  - Average the two intercepted arcs.
  explanation: 'Solution:

    The angle formed by two intersecting chords is half the sum of their intercepted arcs.

    $$\frac{70^\circ + 110^\circ}{2} = \frac{180^\circ}{2} = 90^\circ$$


    Why it works:

    Drawing an auxiliary chord to form a triangle shows that the interior angle is an exterior angle to
    that triangle, equal to the sum of two inscribed angles (which are halves of the two arcs).


    Why the other choices fail:

    - **(B)** 20 is half the *difference* ($110-70=40$, $40/2=20$), which is the formula for secants meeting
    *outside* the circle.

    - **(C)** 45 is a random angle or $90/2$.

    - **(D)** 100 is an average of something else or a math error.

    '
- id: hard-quiz-q019
  type: multipleChoice
  prompt: Opposite angles of a cyclic quadrilateral measure $2x$ and $4x$. Find $x$.
  choices:
  - id: a
    text: '45'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: b
    text: '150'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: c
    text: '15'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: d
    text: '30'
  answer:
    choiceId: d
  difficultyDimensions:
  - Set up the supplementary angle equation for cyclic quadrilaterals.
  - Solve $6x = 180$.
  explanation: 'Solution:

    Opposite angles in a cyclic quadrilateral sum to 180.

    $$2x + 4x = 180$$

    $$6x = 180 \implies x = 30$$


    Why it works:

    The two angles are inscribed and together intercept the entire $360^\circ$ circle. Their sum is therefore
    half of 360.


    Why the other choices fail:

    - **(A)** 45 comes from setting $2x = 4x$ or solving $4x=180 \implies x=45$.

    - **(C)** 15 comes from $6x=90 \implies x=15$ (using complementary instead of supplementary).

    '
- id: hard-quiz-q023
  type: multipleChoice
  prompt: Why can you not assume two unmarked lines are parallel?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: b
    text: Apply the converse without checking its hypothesis.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: c
    text: Parallelism requires an explicit marking or a geometric proof.
  - id: d
    text: The stated facts are insufficient.
    issueSignals:
    - id: methodology-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Distinguish rigorous proof logic from visual heuristics.
  - Require explicit hypotheses before applying parallel line theorems.
  explanation: 'Solution:

    In geometric proofs, visual appearance is not a valid justification. Parallelism must be either given
    by markings (like arrows on the lines) or proven via theorems (e.g., proving alternate interior angles
    are equal).


    Why it works:

    Diagrams are frequently "not drawn to scale" specifically to test logical deduction over visual guessing.


    Why the other choices fail:

    - **(A)** Estimating from a diagram is a flawed methodology.

    - **(B)** Applying a converse requires first proving the condition is met.

    '
- id: hard-quiz-q054
  type: multipleChoice
  prompt: An exterior angle of a triangle is 150 degrees, and one of its remote interior angles is 72
    degrees. Find the other remote interior angle.
  choices:
  - id: a
    text: 39 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: 78 degrees
  - id: c
    text: 30 degrees
    issueSignals:
    - id: supplement-error
      domains: []
  - id: d
    text: 102 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Apply the exterior angle theorem.
  - Subtract the known remote angle from the exterior angle.
  explanation: 'Solution:

    The exterior angle theorem states that an exterior angle equals the sum of its two remote interior
    angles.

    $$72^\circ + x = 150^\circ \implies x = 150^\circ - 72^\circ = 78^\circ$$


    Why it works:

    The interior angle adjacent to the exterior angle is $180^\circ - 150^\circ = 30^\circ$. The sum of
    the triangle''s angles is 180, so the other two must sum to $180^\circ - 30^\circ = 150^\circ$.


    Why the other choices fail:

    - **(A)** 39 is exactly half of 78.

    - **(C)** 30 is the adjacent interior angle ($180 - 150$), not the remote one.

    - **(D)** 102 is the supplement of 78 ($180-78$), which is a random transformation.

    '
- id: hard-quiz-q015
  type: multipleChoice
  prompt: In $\triangle ABC$, $AB=AC$ and the exterior angle at $B$ is 130 degrees. Find $\angle A$.
  choices:
  - id: a
    text: 80 degrees
  - id: b
    text: 130 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: c
    text: 100 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 40 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Use the exterior angle to find the adjacent base angle.
  - Apply the isosceles triangle theorem for the second base angle.
  - Use the triangle sum to find the vertex angle.
  explanation: 'Solution:

    The interior angle at $B$ and the exterior angle at $B$ are supplementary.

    Interior $\angle B = 180^\circ - 130^\circ = 50^\circ$.

    Since $AB=AC$, the base angles opposite those sides are equal: $\angle C = \angle B = 50^\circ$.

    The sum of the angles in the triangle is 180:

    $$\angle A + 50^\circ + 50^\circ = 180^\circ \implies \angle A = 80^\circ$$


    Why it works:

    Linking the linear pair to the isosceles symmetry to the triangle sum is a standard three-step angle
    chase.


    Why the other choices fail:

    - **(B)** 130 assumes the exterior angle equals $\angle A$ directly.

    - **(C)** 100 is $150-50$, an arithmetic error.

    - **(D)** 40 assumes the base angles were 70.

    '
- id: hard-quiz-q105
  type: multipleChoice
  prompt: A triangle has interior angles of 30 and 70. What is the measure of the exterior angle at the
    third vertex?
  choices:
  - id: a
    text: 80 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: b
    text: 50 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: 110 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 100 degrees
  answer:
    choiceId: d
  difficultyDimensions:
  - Identify that the exterior angle equals the sum of the two remote interior angles.
  - Sum the given angles.
  explanation: 'Solution:

    The exterior angle at the third vertex is equal to the sum of the two remote interior angles.

    $$30^\circ + 70^\circ = 100^\circ$$


    Why it works:

    The third interior angle is $180^\circ - (30^\circ + 70^\circ) = 80^\circ$. The exterior angle is
    supplementary to that, so $180^\circ - 80^\circ = 100^\circ$. The shortcut is direct addition.


    Why the other choices fail:

    - **(A)** 80 is the third *interior* angle, not the exterior angle.

    - **(B)** 50 is an arithmetic error.

    - **(C)** 110 is $180 - 70$.

    '
- id: hard-quiz-q013
  type: multipleChoice
  prompt: 'Parallel lines: an alternate interior angle is $3x+5$ and its mate is $80$. Find $x$.'
  choices:
  - id: a
    text: '50'
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: '12.5'
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: '25'
  - id: d
    text: '85'
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Identify that alternate interior angles are equal.
  - Solve the linear equation $3x+5 = 80$.
  explanation: 'Solution:

    Alternate interior angles between parallel lines are equal.

    $$3x + 5 = 80$$

    $$3x = 75 \implies x = 25$$


    Why it works:

    Transversals cutting parallel lines create identical but translated intersection clusters.


    Why the other choices fail:

    - **(A)** 50 comes from $3x+5+80=180 \implies 3x=95$, mistakenly assuming they are supplementary (like
    same-side interior angles).

    - **(D)** 85 comes from $3x-5=80$ (sign error) or $3x=85$.

    '
- id: hard-quiz-q020
  type: multipleChoice
  prompt: A regular hexagon has an interior angle of 120 degrees. What is its adjacent exterior turn angle?
  choices:
  - id: a
    text: 70 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: 60 degrees
  - id: c
    text: 120 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: d
    text: 30 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Recall that an interior and adjacent exterior angle form a linear pair.
  - Subtract 120 from 180.
  explanation: 'Solution:

    The interior angle and its adjacent exterior angle form a straight line, so they are supplementary.

    $$180^\circ - 120^\circ = 60^\circ$$


    Why it works:

    Walking around a polygon, you turn exactly the exterior angle at each vertex. The turn plus the interior
    angle always equals 180.


    Why the other choices fail:

    - **(C)** 120 is the interior angle, not the exterior turn.

    - **(D)** 30 is half of 60.

    '
- id: hard-quiz-q057
  type: multipleChoice
  prompt: An angle formed by a tangent and a chord is 55 degrees. Find its intercepted arc.
  choices:
  - id: a
    text: 110 degrees
  - id: b
    text: 55 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: c
    text: 70 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 120 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Recall the tangent-chord theorem.
  - Multiply the angle by 2 to find the arc.
  explanation: 'Solution:

    The intercepted arc is twice the measure of the tangent-chord angle.

    $$2 \times 55^\circ = 110^\circ$$


    Why it works:

    The angle is half the arc, exactly like an inscribed angle.


    Why the other choices fail:

    - **(B)** 55 assumes the arc equals the angle (central angle behavior).

    - **(D)** 120 is an arithmetic error or guess.

    '
- id: hard-quiz-q014
  type: multipleChoice
  prompt: An exterior angle of a triangle is 140, and one remote interior is 65. Find the other remote
    interior angle.
  choices:
  - id: a
    text: 40 degrees
    issueSignals:
    - id: supplement-error
      domains: []
  - id: b
    text: 105 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: 37.5 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 75 degrees
  answer:
    choiceId: d
  difficultyDimensions:
  - Apply the exterior angle theorem.
  - Subtract 65 from 140.
  explanation: 'Solution:

    The exterior angle equals the sum of the two remote interior angles.

    $$65^\circ + x = 140^\circ$$

    $$x = 140^\circ - 65^\circ = 75^\circ$$


    Why it works:

    The triangle sum is 180, and the linear pair sum is 180. This forces the exterior angle to precisely
    match the sum of the other two angles inside the triangle.


    Why the other choices fail:

    - **(A)** 40 is the adjacent interior angle ($180-140$), not the remote one.

    - **(B)** 105 is $180-75$, the supplement of the answer.

    '
- id: hard-quiz-q061
  type: multipleChoice
  prompt: An angle chase yields the equation $2x+15=75$. Find $x$.
  choices:
  - id: a
    text: '60'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: b
    text: '15'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: c
    text: '30'
  - id: d
    text: '45'
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Solve a basic linear equation by isolating $x$.
  - Recognize that the expression and value represent an angle.
  explanation: 'Solution:

    Subtract 15 from both sides:

    $$2x = 60$$

    Divide by 2:

    $$x = 30$$


    Why it works:

    Basic algebraic manipulation required to finish an angle chase.


    Why the other choices fail:

    - **(A)** 60 is the value of $2x$, failing to divide by 2.

    - **(D)** 45 is $90/2$, resulting from $2x = 75+15$ (adding instead of subtracting).

    '
- id: hard-quiz-q060
  type: multipleChoice
  prompt: A chord subtends an angle at the center of a circle. What type of triangle is formed by the
    chord and the two radii?
  choices:
  - id: a
    text: Use the diagram scale to estimate the result.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: b
    text: Isosceles triangle
  - id: c
    text: Equilateral always
    issueSignals:
    - id: theorem-error
      domains: []
  - id: d
    text: The stated facts are insufficient.
    issueSignals:
    - id: methodology-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Recall that all radii in a single circle are congruent.
  - Conclude that the triangle has two equal sides, making it isosceles.
  explanation: 'Solution:

    The triangle is formed by the chord and two radii. Because all radii of a circle are equal, the triangle
    always has at least two equal sides, making it an isosceles triangle.


    Why it works:

    The definition of a circle guarantees that the distance from the center to any point on the boundary
    is identically $r$.


    Why the other choices fail:

    - **(C)** It is only equilateral if the central angle happens to be exactly $60^\circ$ (and the chord
    length is exactly $r$).

    '
