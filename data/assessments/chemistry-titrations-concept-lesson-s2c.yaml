lesson:
  introduction: This lesson builds an acid-base model from definitions through equations, calculations, and verification.
  sections:
  - id: sec-1
    title: Titration vocabulary
    required: true
    content: A titration uses a standard solution to determine an unknown analyte. Equivalence is stoichiometric completion; endpoint is the observed indicator signal.
    media:
    - type: image
      src: /media/chemistry/chemistry-titrations-model.svg
      alt: Original diagram supporting titration vocabulary.
      caption: 
    check:
      id: chk-1
      type: multipleChoice
      prompt: Which distinction is correct?
      choices:
      - id: a
        text: They are identical by definition
        media: []
        issueSignals:
        - id: titration-equivalence-endpoint-confusion
          domains:
          - chemistry
      - id: b
        text: Equivalence is stoichiometric; endpoint is observed
        media: []
        issueSignals: []
      - id: c
        text: Endpoint is calculated from moles only
        media: []
        issueSignals:
        - id: titration-equivalence-endpoint-confusion
          domains:
          - chemistry
      - id: d
        text: Equivalence depends on indicator color
        media: []
        issueSignals:
        - id: titration-equivalence-endpoint-confusion
          domains:
          - chemistry
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Choice B (Equivalence is stoichiometric; endpoint is observed).


        Why it works: For the Titration vocabulary check, identify the governing acid-base relation in the prompt, apply it to the stated species or values, and verify charge, units, or model scope.


        Why the other choices fail: Choice A (They are identical by definition) uses the wrong model or operation; choice C (Endpoint is calculated from moles only) ignores a stated condition; choice D (Equivalence depends on indicator color) substitutes an irrelevant shortcut.
