schemaVersion: 1
id: calc2-arc-length-surface-area-recall-s2c
title: Arc Length and Surface Area Recall Drill
assessmentType: recallDrill
categoryId: calculus-2
topicId: arc-length-surface-area
modeDefault: practice
randomizeQuestions: true
skills: [arc-length, surface-area-of-revolution]
navigation: { learningGoal: recall, activityType: clozeDrill, tags: [calculus-2, arc-length, surface-area, recall] }
authoring: { visualRequirement: required, visualRationale: Recall includes recognizing the slanted-segment model and the swept-band model. }
items:
  - { id: r1, type: cloze, prompt: 'For y=f(x), $L=\int_a^b\sqrt{1+____}\,dx$.', answer: { expected: '[f''(x)]^2', aliases: ["f'(x)^2"] }, explanation: 'Solution: Fill in $[f''(x)]^2$. Why it works: The slope appears through the Pythagorean theorem. Common trap: Use the derivative, not f(x).' }
  - { id: r2, type: typed, prompt: 'Name the units of arc length and surface area when coordinates are measured in meters.', answer: { expected: 'arc length meters; surface area square meters', aliases: ['m and m squared', 'meters and square meters'] }, explanation: 'Solution: Arc length is measured in meters and surface area in square meters. Why it works: ds is a length, while a swept band is circumference times length. Common trap: A surface-area answer in meters has lost one length factor.' }
  - { id: r3, type: recognition, prompt: 'Which factor turns arc length into surface area of revolution?', choices: [{ id: a, text: '$2\pi$ times radius' }, { id: b, text: an additional derivative }, { id: c, text: a disk radius squared }, { id: d, text: no additional factor }], answer: { choiceId: a }, explanation: 'Solution: Choose $2\pi$ times radius. Why it works: The curve segment sweeps a circumference. Common trap: Disk area belongs to volume methods. Why the other choices fail: b changes ds; c models a cross section; d leaves only length.' }
