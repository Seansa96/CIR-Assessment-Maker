questions:
- id: work-hard-1
  title: Calculus Work
  type: symbolicResponse
  prompt: 'Adapted from OpenStax University Physics.


    A force $F(x) = 1x^2 + 1$ acts on a particle. What is the work done from $x=0$
    to $x=2$?'
  answer:
    gradingMode: auto
    expected: '4.666666666666666'
  explanation: $\int_0^2 (1x^2 + 1) dx = 1[x^3/3 + x]_0^2 = 1(8/3 + 2)$.
