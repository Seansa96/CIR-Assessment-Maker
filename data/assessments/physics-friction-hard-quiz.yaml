questions:
- id: fric-hard-1
  title: Inclined Plane Friction
  type: symbolicResponse
  prompt: 'Adapted from OpenStax University Physics.


    A mass $m$ slides down a plane at angle $\theta$ with coefficient of kinetic friction
    $\mu_k$. Enter the expression for acceleration $a$.'
  answer:
    gradingMode: auto
    expected: g*(\sin(\theta) - \mu_k*\cos(\theta))
    aliases:
    - g*sin(\theta) - g*\mu_k*cos(\theta)
  explanation: $mg\sin\theta - \mu_k mg\cos\theta = ma \implies a = g(\sin\theta -
    \mu_k\cos\theta)$.
