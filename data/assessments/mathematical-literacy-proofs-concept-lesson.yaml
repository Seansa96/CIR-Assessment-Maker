lesson:
  introduction: |
    Reading a proof is not passive. Mark the claim being established, the assumptions in force, and the reason that each important line follows from earlier information.
  sections:
    - id: s01
      title: Find the proof's destination
      content: |
        Start by restating the theorem in your own words. For a conditional, write the hypothesis on one side and the conclusion on the other; this tells you what the proof must connect.
    - id: s02
      title: Build a reason ledger
      content: |
        For each nontrivial sentence, ask whether its reason is a definition, an assumption, an earlier line, an algebra rule, or a named result. A proof is a chain of such licensed moves.
    - id: s03
      title: Treat omitted steps as questions
      content: |
        Authors sometimes omit routine algebra or a familiar definition. Fill the gap only after you can name the rule that supplies it. If no rule supplies it, the line needs more justification.
    - id: s04
      title: Separate a proof map from a proof method
      content: |
        This starter path teaches how to read an argument, not how to invent every proof. A good reader can still identify where a direct argument, an example, or a contradiction is being used.
