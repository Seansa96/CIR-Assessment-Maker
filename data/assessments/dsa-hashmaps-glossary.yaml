glossary:
  sections:
  - title: Core Concepts
    entries:
    - term: Hash Function
      definition: A function that converts an input (like a string) into a deterministic integer value.
    - term: Collision
      definition: When two distinct keys are mapped to the same index in a hash table.
    - term: Chaining
      definition: A collision resolution technique where each array index stores a linked list of all
        elements that mapped to that index.
    - term: Load Factor
      definition: The ratio of the number of elements in the hash table to the total number of available
        slots (buckets).
