items:
- id: r001
  type: typed
  prompt: What is fixed in fₓ?
  answer:
    expected: y
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: y


    Why it works: The named x variable changes; the other input is fixed.'
- id: r002
  type: typed
  prompt: What is fixed in fᵧ?
  answer:
    expected: x
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: x


    Why it works: The y derivative freezes x.'
- id: r003
  type: typed
  prompt: Find ∂(x³y)/∂x.
  answer:
    expected: 3x^2y
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: 3x^2y


    Why it works: y remains a constant factor.'
- id: r004
  type: typed
  prompt: Find ∂(x³y)/∂y.
  answer:
    expected: x^3
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: x^3


    Why it works: x³ is constant and d(y)/dy=1.'
- id: r005
  type: typed
  prompt: For f=x²−3xy+2y², give fₓ.
  answer:
    expected: 2x-3y
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: 2x-3y


    Why it works: Differentiate in x; y² is constant.'
- id: r006
  type: typed
  prompt: For f=x²−3xy+2y², give fᵧ.
  answer:
    expected: -3x+4y
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: -3x+4y


    Why it works: Differentiate in y; x² is constant.'
- id: r007
  type: typed
  prompt: What slope is fₓ(a,b)?
  answer:
    expected: tangent slope of the x slice
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: tangent slope of the x slice


    Why it works: The x slice fixes y=b.'
- id: r008
  type: typed
  prompt: If f is temperature and x is meters, what are fₓ units?
  answer:
    expected: temperature per meter
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: temperature per meter


    Why it works: Rate units are output units divided by input units.'
- id: r009
  type: typed
  prompt: What operation defines fₓₓ?
  answer:
    expected: differentiate in x twice
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: differentiate in x twice


    Why it works: The repeated subscript means apply the x derivative twice.'
- id: r010
  type: typed
  prompt: What operation defines fₓᵧ?
  answer:
    expected: differentiate in x then y
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: differentiate in x then y


    Why it works: First form fₓ, then differentiate that result in y.'
- id: r011
  type: typed
  prompt: When does Clairaut guarantee fₓᵧ=fᵧₓ?
  answer:
    expected: when the mixed partials are continuous near the point
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: when the mixed partials are continuous near the point


    Why it works: Continuity near the point is the sufficient theorem condition.'
- id: r012
  type: typed
  prompt: For g=sin(x²y), what inside derivative appears in gᵧ?
  answer:
    expected: x^2
    aliases: []
  issueSignals:
  - id: held-variable-confusion
  explanation: 'Solution: x^2


    Why it works: Hold x fixed; the inside y derivative is x².'
