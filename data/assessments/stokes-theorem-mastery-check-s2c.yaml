- id: q001
  type: multipleChoice
  prompt: If a Stokes boundary orientation reverses while the surface normal stays fixed, what happens to the line integral?
  choices:
  - id: a
    text: Its sign reverses
  - id: b
    text: It is unchanged (answers 'If a positively oriented boundary is reversed, what happens to its circulation integral?',
      not 'If a Stokes boundary orientation reverses while the surface normal stays fixed, what happens to the line integral?')
    issueSignals:
    - id: stokes-orientation-theorem-selection-error
  - id: c
    text: It becomes divergence
    issueSignals:
    - id: stokes-orientation-theorem-selection-error
  - id: d
    text: It doubles (answers 'What happens to a vector flux integral if the chosen normal reverses?', not 'If a Stokes boundary
      orientation reverses while the surface normal stays fixed, what happens to the line integral?')
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: stokes-orientation-theorem-selection-error
  difficultyDimensions: &id001
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Traversal reversal changes dr to its negative.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Parametric Surfaces and Surface
    Integrals.

    Why the other choices fail: Choice b, ''It is unchanged'', does not give ''Its sign reverses'' for ''If a Stokes boundary
    orientation reverses while the surface normal stays fixed, what happens to the line integral?''. It substitutes a different
    result, representation, or condition for the one the prompt specifies.

    Choice c, ''It becomes divergence'', does not give ''Its sign reverses'' for ''If a Stokes boundary orientation reverses
    while the surface normal stays fixed, what happens to the line integral?''. It substitutes a different result, representation,
    or condition for the one the prompt specifies.

    Choice d, ''It doubles'', does not give ''Its sign reverses'' for ''If a Stokes boundary orientation reverses while the
    surface normal stays fixed, what happens to the line integral?''. It substitutes a different result, representation, or
    condition for the one the prompt specifies.'
