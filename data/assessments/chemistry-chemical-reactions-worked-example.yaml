workedExamples:
  - id: precipitation-prediction
    title: Predicting Precipitation Reactions
    problem: |
      Predict the products and write the balanced molecular, complete ionic, and net ionic equations for the reaction between aqueous solutions of lead(II) nitrate and potassium iodide.
    steps:
      - id: predict-products
        title: Step 1 — Predict the products
        content: |
          Reactants: Pb(NO3)2(aq) and KI(aq).
          This is a double-displacement reaction. Swap the cations and anions:
          Pb2+ pairs with I- → PbI2
          K+ pairs with NO3- → KNO3

          Check solubility rules:
          - Nitrates (NO3-) and potassium (K+) salts are always soluble. So KNO3 is aqueous (aq).
          - Iodides (I-) are generally soluble, EXCEPT with Ag+, Pb2+, and Hg22+. Therefore, PbI2 is insoluble — it forms a solid precipitate (s).
      - id: molecular-eq
        title: Step 2 — Write the balanced molecular equation
        content: |
          Unbalanced: Pb(NO3)2(aq) + KI(aq) → PbI2(s) + KNO3(aq)
          Balanced (need 2 I- and 2 K+):
          $$
          \text{Pb(NO}_3\text{)}_2(aq) + 2\text{KI}(aq) \rightarrow \text{PbI}_2(s) + 2\text{KNO}_3(aq)
          $$
      - id: complete-ionic-eq
        title: Step 3 — Write the complete ionic equation
        content: |
          Break all strong electrolytes (aq) into their ions. Keep the precipitate (s) intact.

          $$
          \text{Pb}^{2+}(aq) + 2\text{NO}_3^{-}(aq) + 2\text{K}^{+}(aq) + 2\text{I}^{-}(aq) \rightarrow \text{PbI}_2(s) + 2\text{K}^{+}(aq) + 2\text{NO}_3^{-}(aq)
          $$
      - id: net-ionic-eq
        title: Step 4 — Write the net ionic equation
        content: |
          Identify and cancel the spectator ions (K+ and NO3- appear on both sides).

          $$
          \text{Pb}^{2+}(aq) + 2\text{I}^{-}(aq) \rightarrow \text{PbI}_2(s)
          $$
          (This forms a brilliant yellow precipitate).
    check:
      id: predict-check
      type: multipleChoice
      prompt: |
        If you mix aqueous solutions of NaCl and KNO3, what is the net ionic equation?
      choices:
        - id: a
          text: Na+(aq) + NO3-(aq) → NaNO3(s)
        - id: b
          text: K+(aq) + Cl-(aq) → KCl(s)
        - id: c
          text: There is no reaction (all possible products are soluble).
        - id: d
          text: Na+(aq) + Cl-(aq) + K+(aq) + NO3-(aq) → NaCl(s) + KNO3(s)
      answer:
        choiceId: c
      explanation: |
        Swapping partners gives NaNO3 and KCl. Both are highly soluble (all Na+, K+, and NO3- salts are soluble). Since no precipitate forms, all ions remain in solution as spectator ions. No reaction occurs.

  - id: redox-identification
    title: Identifying Redox Reactions and Oxidizing/Reducing Agents
    problem: |
      Determine if the following reaction is a redox reaction. If it is, identify the element oxidized, the element reduced, the oxidizing agent, and the reducing agent.

      $$
      \text{CH}_4(g) + 2\text{O}_2(g) \rightarrow \text{CO}_2(g) + 2\text{H}_2\text{O}(g)
      $$
    steps:
      - id: assign-states
        title: Step 1 — Assign oxidation states to all atoms
        content: |
          Reactants:
          - In CH4: H is a nonmetal attached to a less electronegative atom, so H is +1. There are four H's (+4 total). Carbon must be **-4** to balance.
          - In O2: Elements in their standard state are **0**.

          Products:
          - In CO2: O is typically -2. Two O's give -4. Carbon must be **+4**.
          - In H2O: H is +1, O is -2.
      - id: analyze-changes
        title: Step 2 — Analyze changes in oxidation state
        content: |
          Carbon goes from -4 to +4. Its oxidation state increased (it lost electrons).
          **Carbon is oxidized.**

          Oxygen goes from 0 to -2. Its oxidation state decreased (it gained electrons).
          **Oxygen is reduced.**

          Hydrogen remains +1 throughout.

          Since oxidation states changed, **yes, this is a redox reaction** (specifically, combustion).
      - id: identify-agents
        title: Step 3 — Identify the agents
        content: |
          The **oxidizing agent** is the reactant that *causes* oxidation by accepting electrons. The species that is reduced acts as the oxidizing agent.
          - Oxidizing agent: **O2**

          The **reducing agent** is the reactant that *causes* reduction by donating electrons. The species that is oxidized acts as the reducing agent.
          - Reducing agent: **CH4**
    check:
      id: redox-check
      type: freeResponse
      prompt: |
        In the reaction 2Mg(s) + O2(g) → 2MgO(s), what is the reducing agent?
      answer:
        gradingMode: selfCheck
        keyPoints:
          - Mg goes from 0 to +2 (oxidized).
          - O goes from 0 to -2 (reduced).
          - The substance oxidized acts as the reducing agent.
          - The reducing agent is Mg(s).

  - id: titration-calculation
    title: Acid-Base Titration Calculation
    problem: |
      A student performs a titration to determine the concentration of a sulfuric acid (H2SO4) solution. It takes 24.50 mL of a 0.150 M NaOH solution to completely neutralize 20.00 mL of the H2SO4 solution. What is the molarity of the H2SO4 solution?
    steps:
      - id: balance-eq
        title: Step 1 — Write the balanced chemical equation
        content: |
          H2SO4 has two acidic protons, so it requires two moles of NaOH to neutralize one mole of acid.
          $$
          \text{H}_2\text{SO}_4(aq) + 2\text{NaOH}(aq) \rightarrow \text{Na}_2\text{SO}_4(aq) + 2\text{H}_2\text{O}(l)
          $$
      - id: moles-known
        title: Step 2 — Calculate moles of the known substance (NaOH)
        content: |
          $$
          n_{NaOH} = M \times V = 0.150 \text{ mol/L} \times 0.02450 \text{ L} = 0.003675 \text{ mol NaOH}
          $$
      - id: moles-unknown
        title: Step 3 — Use stoichiometry to find moles of the unknown (H2SO4)
        content: |
          $$
          n_{H_2SO_4} = 0.003675 \text{ mol NaOH} \times \frac{1 \text{ mol H}_2\text{SO}_4}{2 \text{ mol NaOH}} = 0.0018375 \text{ mol H}_2\text{SO}_4
          $$
      - id: molarity-unknown
        title: Step 4 — Calculate the molarity of the unknown
        content: |
          $$
          M_{H_2SO_4} = \frac{n}{V} = \frac{0.0018375 \text{ mol}}{0.02000 \text{ L}} = 0.0919 \text{ M}
          $$
    check:
      id: titration-check
      type: numericResponse
      prompt: |
        In a titration, 15.0 mL of 0.200 M HCl exactly neutralizes 25.0 mL of an unknown NaOH solution. What is the molarity of the NaOH solution?
        (HCl + NaOH → NaCl + H2O)
      answer:
        value: 0.120
        tolerance: 0.005
      explanation: |
        Moles HCl = 0.200 M * 0.0150 L = 0.00300 mol. Since the ratio is 1:1, moles NaOH = 0.00300 mol. Molarity NaOH = 0.00300 mol / 0.0250 L = 0.120 M.


