questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a circle centered at the pole with radius three](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-01-circle-r3.svg)
    choices:
      - id: a
        text: '$r=3$'
      - id: b
        text: '$r=3\cos\theta$'
      - id: c
        text: '$r=3\sin\theta$'
      - id: d
        text: '$r=3+3\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      A constant-radius polar equation $r=a$ is a circle centered at the pole. Since every direction has the same radius, the graph is $r=3$.

  - id: q002
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a circle tangent to the pole and extending to the right](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-02-circle-right.svg)
    choices:
      - id: a
        text: '$r=4\cos\theta$'
      - id: b
        text: '$r=4\sin\theta$'
      - id: c
        text: '$r=4$'
      - id: d
        text: '$r=2+2\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      Curves of the form $r=a\cos\theta$ are circles tangent to the pole and centered on the positive $x$-axis when $a>0$.

  - id: q003
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a circle tangent to the pole and extending upward](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-03-circle-up.svg)
    choices:
      - id: a
        text: '$r=4\sin\theta$'
      - id: b
        text: '$r=4\cos\theta$'
      - id: c
        text: '$r=2+2\sin\theta$'
      - id: d
        text: '$r=4$'
    answer:
      choiceId: a
    explanation: |
      Curves of the form $r=a\sin\theta$ are circles tangent to the pole and centered on the positive $y$-axis when $a>0$.

  - id: q004
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a cardioid with cusp at the pole and bulging to the right](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-04-cardioid-right.svg)
    choices:
      - id: a
        text: '$r=2+2\cos\theta$'
      - id: b
        text: '$r=2-2\cos\theta$'
      - id: c
        text: '$r=2+2\sin\theta$'
      - id: d
        text: '$r=4\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      The graph is a cardioid because the constant and trig coefficient have equal magnitude. The largest radius is to the right at $\theta=0$, so the equation uses $+\cos\theta$.

  - id: q005
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a cardioid with cusp at the pole and bulging downward](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-05-cardioid-down.svg)
    choices:
      - id: a
        text: '$r=2-2\sin\theta$'
      - id: b
        text: '$r=2+2\sin\theta$'
      - id: c
        text: '$r=2-2\cos\theta$'
      - id: d
        text: '$r=2+2\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      The negative sine term makes the largest radius occur at $\theta=\frac{3\pi}{2}$, so the cardioid points downward.

  - id: q006
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a convex limacon slightly wider to the right](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-06-convex-limacon-right.svg)
    choices:
      - id: a
        text: '$r=3+\cos\theta$'
      - id: b
        text: '$r=1+3\cos\theta$'
      - id: c
        text: '$r=3+\sin\theta$'
      - id: d
        text: '$r=3-\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      Since $\frac{a}{b}=3>2$, this is a convex limacon. The positive cosine term makes it wider to the right.

  - id: q007
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a limacon with an inner loop oriented upward](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-07-inner-loop-up.svg)
    choices:
      - id: a
        text: '$r=1+2\sin\theta$'
      - id: b
        text: '$r=1-2\sin\theta$'
      - id: c
        text: '$r=1+2\cos\theta$'
      - id: d
        text: '$r=2+\sin\theta$'
    answer:
      choiceId: a
    explanation: |
      Since $a<b$, the limacon has an inner loop. The positive sine term orients the large loop upward.

  - id: q008
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a four-petal rose with petals on diagonal axes](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-08-four-petal-rose.svg)
    choices:
      - id: a
        text: '$r=3\sin(2\theta)$'
      - id: b
        text: '$r=3\cos(2\theta)$'
      - id: c
        text: '$r=3\sin(3\theta)$'
      - id: d
        text: '$r=3+3\sin\theta$'
    answer:
      choiceId: a
    explanation: |
      A rose $r=a\sin(2\theta)$ has four petals, and the sine version places the petals along diagonal directions rather than directly on the coordinate axes.

  - id: q009
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing a three-petal rose with one petal on the positive x-axis](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-09-three-petal-rose.svg)
    choices:
      - id: a
        text: '$r=3\cos(3\theta)$'
      - id: b
        text: '$r=3\sin(3\theta)$'
      - id: c
        text: '$r=3\cos(2\theta)$'
      - id: d
        text: '$r=3+3\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      For odd $n$, $r=a\cos(n\theta)$ has $n$ petals. The cosine version has one petal centered on the positive $x$-axis.

  - id: q010
    type: multipleChoice
    prompt: |
      Select the equation that best describes the graph.

      ![A polar graph showing an Archimedean spiral making two outward turns](/assessments/calc2-parametric-polar/polar-graph-recognition-easy-10-spiral.svg)
    choices:
      - id: a
        text: '$r=0.38\theta$'
      - id: b
        text: '$r=3$'
      - id: c
        text: '$r=3\cos(3\theta)$'
      - id: d
        text: '$r=2+2\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      An Archimedean spiral has radius increasing roughly linearly with angle. A constant radius would be a circle, and trig-only forms would close into roses or limacons.
