  explanation: 'Mutual exclusion ensures only one actor enters a critical region at a time. The distractors either ignore
    the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q004
  title: Explain Semaphore
  type: freeResponse
  prompt: 'In a short answer, explain why **Semaphore** matters in IPC and Synchronization.

    '
  answer:
    expected: 'A semaphore coordinates access through an integer count changed by atomic operations. A complete answer should
      also note that a semaphore is not the same as a mutex, though it can sometimes act like one.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Semaphore
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: IPC and Synchronization. The key is to connect the term to what the OS controls or protects.

    '
