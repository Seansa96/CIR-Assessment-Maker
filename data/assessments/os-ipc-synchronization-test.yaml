questions:
- id: q001
  title: Recognize Race condition
  type: multipleChoice
  prompt: 'Which statement best describes **Race condition** in operating systems?

    '
  choices:
  - id: a
    text: A race condition occurs when correctness depends on the timing of unsynchronized concurrent actions.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'A race condition occurs when correctness depends on the timing of unsynchronized concurrent actions. The distractors
    either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q002
  title: Recognize Critical region
  type: multipleChoice
  prompt: 'Which statement best describes **Critical region** in operating systems?

    '
  choices:
  - id: a
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: b
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  - id: c
    text: It removes the need for explicit policies, permissions, or resource-management decisions.
  - id: d
    text: A critical region is code that touches shared state and must not be executed concurrently by conflicting actors.
  answer:
    choiceId: d
  explanation: 'A critical region is code that touches shared state and must not be executed concurrently by conflicting actors.
    The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q003
  title: Recognize Mutual exclusion
  type: multipleChoice
  prompt: 'Which statement best describes **Mutual exclusion** in operating systems?

    '
  choices:
  - id: a
