schemaVersion: 1
id: physics-position-velocity-acceleration-graphs-worked-example
title: Position, Velocity, and Acceleration Graphs Worked Example
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
  - kinematics-2
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Reading velocity and acceleration from a position graph
    problem: |
      Given a position-time graph, predict the matching velocity-time and acceleration-time graphs by reading slope, concavity, corners, and discontinuities.
    steps:
      - id: s001
        title: Start with the derivative chain
        instruction: "The first organizing idea is that each graph is the derivative of the one above it."
        type: multipleChoice
        prompt: "Which derivative relationship is correct?"
        choices:
          - id: a
            text: "$v(t)=s'(t)$ and $a(t)=v'(t)=s''(t)$"
          - id: b
            text: "$s(t)=v'(t)$ and $v(t)=a'(t)$"
          - id: c
            text: "$a(t)=s'(t)$ and $v(t)=s''(t)$"
          - id: d
            text: "Position, velocity, and acceleration always have the same graph shape."
        answer:
          choiceId: a
        hint: "Velocity is the rate of change of position. Acceleration is the rate of change of velocity."
        explanation: |
          The whole method is based on:

          $$v(t)=s'(t), \qquad a(t)=v'(t)=s''(t).$$

          Related topic: derivatives in kinematics. Quick lookup: "position velocity acceleration derivative relationship."

      - id: s002
        title: Translate slope into velocity sign
        instruction: "Before thinking about exact values, decide whether the position graph is rising, falling, or flat."
        type: multipleChoice
        prompt: "If a position graph is increasing at a particular time, what must be true about velocity there?"
        choices:
          - id: a
            text: "Velocity is positive."
          - id: b
            text: "Velocity is negative."
          - id: c
            text: "Velocity is zero."
          - id: d
            text: "Acceleration must be positive."
        answer:
          choiceId: a
        hint: "Velocity is the slope of the position graph."
        explanation: |
          Increasing position means positive slope, so velocity is positive.

          Related topic: slope as instantaneous velocity. Action step: mark intervals where the position graph rises, falls, or flattens.

      - id: s003
        title: Translate flat tangents into zero velocity
        instruction: "Local maxima and minima in position are places where the velocity crosses or touches zero, if the graph is smooth there."
        type: multipleChoice
        prompt: "At a smooth local maximum of a position graph, what is the velocity?"
        choices:
          - id: a
            text: "Zero"
          - id: b
            text: "Always positive"
          - id: c
            text: "Always negative"
          - id: d
            text: "Undefined because all maxima are corners"
        answer:
          choiceId: a
        hint: "At a smooth peak, the tangent line is horizontal."
        explanation: |
          A smooth local maximum has slope $0$, so $v(t)=0$ there.

          Related topic: critical points. Quick lookup: "horizontal tangent derivative zero."

      - id: s004
        title: Read concavity as acceleration sign
        instruction: "Acceleration comes from how the slope of position is changing."
        type: multipleChoice
        prompt: "If the position graph is concave up, what does that say about acceleration?"
        choices:
          - id: a
            text: "Acceleration is positive."
          - id: b
            text: "Acceleration is negative."
          - id: c
            text: "Velocity is always negative."
          - id: d
            text: "Position must be decreasing."
        answer:
          choiceId: a
        hint: "Concave up means slopes are increasing."
        explanation: |
          Concave up means the slope of position is increasing, so velocity is increasing and acceleration is positive.

          Related topic: second derivative and concavity. Action step: ask whether slopes are becoming more positive or more negative.

      - id: s005
        title: Work through a concave-up position graph
        instruction: "Use the graph shape to predict the derivative graphs."
        type: multipleChoice
        prompt: |
          This position graph is concave up. Which description matches the velocity and acceleration graphs?
        media:
          - type: image
            src: /assessments/physics-graphs/set-a-position.svg
            alt: Concave-up parabolic position graph, Set A
            caption: Position graph for Set A
        choices:
          - id: a
            text: "Velocity is an increasing line; acceleration is a positive horizontal line."
          - id: b
            text: "Velocity is a constant positive line; acceleration is zero."
          - id: c
            text: "Velocity jumps between two constants; acceleration is undefined everywhere."
          - id: d
            text: "Velocity is decreasing; acceleration is negative."
        answer:
          choiceId: a
        hint: "A parabola has a linear derivative, and concave up means positive second derivative."
        explanation: |
          A concave-up parabola has an increasing linear velocity graph and a positive constant acceleration graph.

          Related topic: derivatives of quadratic functions. Quick lookup: "quadratic position linear velocity constant acceleration."

      - id: s006
        title: Work through a concave-down position graph
        instruction: "A downward-opening position graph has slopes that decrease over time."
        type: multipleChoice
        prompt: |
          This position graph is concave down. Which velocity and acceleration pattern should you expect?
        media:
          - type: image
            src: /assessments/physics-graphs/set-h-position.svg
            alt: Concave-down parabolic position graph, Set H
            caption: Position graph for Set H
        choices:
          - id: a
            text: "Velocity is a decreasing line; acceleration is a negative horizontal line."
          - id: b
            text: "Velocity is an increasing line; acceleration is a positive horizontal line."
          - id: c
            text: "Velocity is zero for all time; acceleration is zero for all time."
          - id: d
            text: "Velocity is undefined at the peak."
        answer:
          choiceId: a
        hint: "The slopes start positive, become zero near the top, then become negative."
        explanation: |
          Concave down means slopes decrease. The velocity graph is a decreasing line, and acceleration is a negative constant.

          Related topic: negative acceleration from position graphs. Lookup: "concave down position acceleration sign."

      - id: s007
        title: Distinguish velocity from acceleration
        instruction: "The sign of velocity tells direction. The sign of acceleration tells how velocity changes."
        type: multipleChoice
        prompt: "Can an object have positive velocity and negative acceleration at the same time?"
        choices:
          - id: a
            text: "Yes. It can move in the positive direction while slowing down."
          - id: b
            text: "No. Positive velocity always means positive acceleration."
          - id: c
            text: "No. Negative acceleration means the object moves backward."
          - id: d
            text: "Only if position is discontinuous."
        answer:
          choiceId: a
        hint: "Direction and change in velocity are different ideas."
        explanation: |
          Positive velocity means position is increasing. Negative acceleration means velocity is decreasing. Together, the object moves forward while slowing down.

          Related topic: velocity versus acceleration sign. Action step: separate "which way" from "speeding up or slowing down."

      - id: s008
        title: Identify a straight-line position graph
        instruction: "A straight position graph has constant slope."
        type: multipleChoice
        prompt: |
          This position graph is a line. What should the velocity and acceleration graphs look like?
        media:
          - type: image
            src: /assessments/physics-graphs/set-g-position.svg
            alt: Straight increasing position graph, Set G
            caption: Position graph for Set G
        choices:
          - id: a
            text: "Velocity is a positive horizontal line; acceleration is zero."
          - id: b
            text: "Velocity is an increasing line; acceleration is positive."
          - id: c
            text: "Velocity is a parabola; acceleration is a line."
          - id: d
            text: "Velocity and acceleration are both undefined."
        answer:
          choiceId: a
        hint: "A constant slope means constant velocity."
        explanation: |
          Linear position means constant velocity. Since velocity does not change, acceleration is zero.

          Related topic: constant velocity. Quick lookup: "linear position graph velocity acceleration."

      - id: s009
        title: Handle corners
        instruction: "At a sharp corner, the slope changes suddenly and there is no single tangent slope."
        type: multipleChoice
        prompt: |
          This position graph has a sharp corner. What happens to velocity at the corner?
        media:
          - type: image
            src: /assessments/physics-graphs/set-c-position.svg
            alt: V-shaped position graph with a corner, Set C
            caption: Position graph for Set C
        choices:
          - id: a
            text: "Velocity is undefined at the corner because the left and right slopes do not match."
          - id: b
            text: "Velocity must be zero at the corner."
          - id: c
            text: "Velocity must be positive at the corner."
          - id: d
            text: "Velocity is undefined only if the graph has a vertical asymptote."
        answer:
          choiceId: a
        hint: "A derivative requires the left-hand and right-hand slopes to agree."
        explanation: |
          A corner has different slopes from the left and right, so $s'(t)$ does not exist at that time.

          Related topic: nondifferentiability. Lookup: "derivative undefined at a corner."

      - id: s010
        title: Handle jumps
        instruction: "A jump in position is not physically typical for ordinary motion, but it is useful for testing the derivative concept."
        type: multipleChoice
        prompt: |
          This position graph has a jump discontinuity. What should happen to velocity at the jump?
        media:
          - type: image
            src: /assessments/physics-graphs/set-e-position.svg
            alt: Position graph with a jump discontinuity, Set E
            caption: Position graph for Set E
        choices:
          - id: a
            text: "Velocity is undefined at the jump."
          - id: b
            text: "Velocity is zero at the jump."
          - id: c
            text: "Velocity is positive infinity for the rest of the graph."
          - id: d
            text: "Velocity remains defined because the pieces have the same slope."
        answer:
          choiceId: a
        hint: "A function must be continuous at a point to be differentiable there."
        explanation: |
          A jump discontinuity makes the derivative undefined at that time, even if the pieces on both sides have the same slope.

          Related topic: differentiability implies continuity. Action step: check continuity before slope.

      - id: s011
        title: Read piecewise linear motion
        instruction: "For a piecewise linear position graph, each line segment has a constant velocity."
        type: multipleChoice
        prompt: |
          This position graph rises, becomes flat, then falls. What should velocity do?
        media:
          - type: image
            src: /assessments/physics-graphs/set-d-position.svg
            alt: Piecewise linear position graph, Set D
            caption: Position graph for Set D
        choices:
          - id: a
            text: "Velocity is positive, then zero, then negative, with undefined values at the corners."
          - id: b
            text: "Velocity is always positive."
          - id: c
            text: "Velocity is a smooth parabola."
          - id: d
            text: "Velocity is zero only at the corners."
        answer:
          choiceId: a
        hint: "Read the slope of each line segment."
        explanation: |
          Rising line segment: positive velocity. Flat segment: zero velocity. Falling segment: negative velocity. At the corners, velocity is undefined.

          Related topic: piecewise derivatives. Lookup: "derivative of piecewise linear graph."

      - id: s012
        title: Connect sine-like motion
        instruction: "A repeating position graph has derivative graphs shifted in phase."
        type: multipleChoice
        prompt: |
          This position graph is sinusoidal. What should be true about velocity?
        media:
          - type: image
            src: /assessments/physics-graphs/set-f-position.svg
            alt: Sinusoidal position graph, Set F
            caption: Position graph for Set F
        choices:
          - id: a
            text: "Velocity is largest in magnitude where position crosses its midline, and zero at smooth peaks and valleys."
          - id: b
            text: "Velocity is zero where position crosses its midline."
          - id: c
            text: "Velocity has the same shape and timing as position."
          - id: d
            text: "Velocity is undefined at every peak."
        answer:
          choiceId: a
        hint: "Sine has cosine as its derivative."
        explanation: |
          For sine-like position, velocity is cosine-like. Velocity is zero at smooth turning points and largest in magnitude when position changes fastest.

          Related topic: sinusoidal motion derivatives. Quick lookup: "simple harmonic motion position velocity acceleration graphs."

      - id: s013
        title: Use acceleration as curvature
        instruction: "When starting from a position graph, acceleration is often easier to infer from concavity than by drawing velocity first."
        type: selectAll
        prompt: "Which statements correctly connect position shape to acceleration?"
        choices:
          - id: a
            text: "Concave up position means positive acceleration."
          - id: b
            text: "Concave down position means negative acceleration."
          - id: c
            text: "Linear position means zero acceleration."
          - id: d
            text: "Increasing position always means positive acceleration."
        answer:
          choiceIds:
            - a
            - b
            - c
        hint: "Acceleration is about changing slope, not just whether position is increasing."
        explanation: |
          Acceleration is the second derivative of position. Concavity gives acceleration sign. Increasing/decreasing only gives velocity sign.

          Related topic: first derivative versus second derivative. Action step: use slope for velocity and concavity for acceleration.

      - id: s014
        title: Build a matching checklist
        instruction: "Use a fixed checklist whenever matching graph choices."
        type: selectAll
        prompt: "Which checks should you make when matching position, velocity, and acceleration graphs?"
        choices:
          - id: a
            text: "Where is position increasing, decreasing, or flat?"
          - id: b
            text: "Where is position concave up or concave down?"
          - id: c
            text: "Where are corners, cusps, jumps, or vertical tangents?"
          - id: d
            text: "Which graph has the darkest line color?"
        answer:
          choiceIds:
            - a
            - b
            - c
        hint: "Ignore decoration. Track mathematical structure."
        explanation: |
          The reliable path is: slope sign, slope size, concavity, and nondifferentiable points.

          Related topic: graph matching from derivatives. Lookup: "position velocity acceleration graph matching strategy."

      - id: s015
        title: Summarize the method
        instruction: "Lock in the reasoning pattern before using the quiz."
        type: freeResponse
        prompt: "Write a short checklist for predicting velocity and acceleration from a position graph."
        answer:
          expected: "Velocity is the slope of position, so rising means positive velocity, falling means negative velocity, and smooth flat points mean zero velocity. Acceleration is how velocity changes or the concavity of position, so concave up means positive acceleration, concave down means negative acceleration, and linear position means zero acceleration. Corners, cusps, jumps, and other nondifferentiable points make velocity undefined at those times."
          gradingMode: selfCheck
          keyPoints:
            - "Use slope of position for velocity."
            - "Use concavity or changing slope for acceleration."
            - "Smooth horizontal tangents give zero velocity."
            - "Corners and jumps make velocity undefined."
            - "Piecewise linear position gives piecewise constant velocity."
        hint: "Think: slope, concavity, undefined points."
        explanation: |
          The most efficient method is structural:

          1. Slope of position gives velocity.
          2. Change in slope, or concavity, gives acceleration.
          3. Nondifferentiable points in position become undefined points in velocity.

          Related topic: kinematics graph matching. Quick lookup: "position velocity acceleration graphs calculus."
