navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [physics-1, physics-measurements-units] }
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we-linear-position
    title: Straight position graph
    problem: 'Position rises linearly from $x=0$ m at $t=0$ s to $x=20$ m at $t=4.0$ s.'
    steps:
      - id: lp-1
        title: Find slope
        instruction: 'Velocity is the slope of a position-versus-time graph.'
        type: numericResponse
        prompt: 'What is the velocity in m/s?'
        answer: { value: 5, tolerance: 0.01 }
        explanation: 'Solution: $v=\Delta x/\Delta t=20/4.0=5.0$ m/s.\n\nWhy it works: The slope of position versus time is velocity.'
      - id: lp-2
        title: Infer acceleration
        instruction: 'A straight position graph has constant slope.'
        type: numericResponse
        prompt: 'What is acceleration in m/s$^2$?'
        answer: { value: 0, tolerance: 0.01 }
        explanation: 'Solution: $a=0$ m/s$^2$.\n\nWhy it works: Constant velocity means velocity has no rate of change.'
  - id: we-curved-position
    title: Concave-up position graph
    problem: 'A smooth position-versus-time graph is increasing and concave up over an interval.'
    steps:
      - id: cp-1
        title: Determine velocity sign
        instruction: 'An increasing position graph has positive slope.'
        type: multipleChoice
        prompt: 'What is the sign of velocity?'
        choices: [{ id: a, text: 'positive' }, { id: b, text: 'negative' }]
        answer: { choiceId: a }
        explanation: 'Solution: Velocity is positive.\n\nWhy it works: Positive slope means position increases with time.\n\nWhy the other choices fail: Negative velocity would make the position graph decrease.'
      - id: cp-2
        title: Determine acceleration sign
        instruction: 'Concavity records how the slope changes.'
        type: multipleChoice
        prompt: 'What is the sign of acceleration?'
        choices: [{ id: a, text: 'positive' }, { id: b, text: 'zero' }]
        answer: { choiceId: a }
        explanation: 'Solution: Acceleration is positive.\n\nWhy it works: Concave up means the position slope, and therefore velocity, is increasing.\n\nWhy the other choices fail: Zero acceleration would produce a straight, not curved, position graph.'
