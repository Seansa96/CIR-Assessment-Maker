lesson:
  introduction: Just as a net force causes linear acceleration, a net torque causes
    angular acceleration. Here we define torque and learn how to calculate it.
  sections:
  - id: sec-1
    title: Defining Torque
    content: 'Torque ($\tau$) measures the effectiveness of a force in causing an
      object to rotate about an axis. It depends on three factors:

      1. The magnitude of the applied force $F$.

      2. The distance $r$ from the pivot point to where the force is applied.

      3. The angle $\phi$ between the force vector and the position vector $r$.


      The magnitude of torque is given by: $$\tau = rF\sin\phi$$

      The quantity $r\sin\phi$ is often called the **lever arm** or **moment arm**
      ($r_\perp$). Alternatively, you can think of it as $\tau = r(F_\perp)$, where
      $F_\perp = F\sin\phi$ is the component of the force perpendicular to the radial
      line.'
    media:
    - type: image
      src: /media/physics/animations/torque-lever.gif
      alt: Animation of a force vector applied to a lever, showing how changing the
        angle affects the resulting torque.
      caption: 'Figure 1: Torque depends on the force, the radius, and the angle of
        application.'
    check:
      id: chk-tq-1
      type: multipleChoice
      prompt: You are trying to loosen a stubborn bolt with a wrench. Which of the
        following strategies will yield the maximum torque?
      choices:
      - id: a
        text: Apply the force close to the bolt, pulling parallel to the wrench.
        issueSignals:
        - id: torque-force-confusion
        - id: trigonometry-error
      - id: b
        text: Apply the force far from the bolt, pulling parallel to the wrench.
        issueSignals:
        - id: torque-force-confusion
        - id: trigonometry-error
      - id: c
        text: Apply the force close to the bolt, pushing perpendicularly to the wrench.
        issueSignals:
        - id: torque-force-confusion
        - id: trigonometry-error
      - id: d
        text: Apply the force at the very end of the wrench, pushing perpendicularly
          to it.
      answer:
        choiceId: d
      explanation: 'Solution:

        Apply the force at the very end of the wrench, pushing perpendicularly to
        it.


        Why it works:

        Torque is maximized when $r$ is maximized (applying force at the very end)
        and $\sin\phi$ is maximized (pushing perpendicularly, so $\phi = 90^\circ$
        and $\sin 90^\circ = 1$).


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Perpendicular Force
    content: 'Only the component perpendicular to the lever arm produces torque: $\tau=rF\sin\phi$.'
    media: []
    check: { id: chk-tq-5, type: multipleChoice, prompt: 'At what angle is torque maximum for fixed $r$ and $F$?', choices: [{ id: a, text: '$0^\circ$' }, { id: b, text: '$30^\circ$' }, { id: c, text: '$90^\circ$' }, { id: d, text: '$180^\circ$' }], answer: { choiceId: c }, explanation: 'Solution: $90^\circ$.\n\nWhy it works: $\sin\phi$ is largest at one.\n\nWhy the other choices fail: Parallel or partially aligned forces have smaller perpendicular components.' }
  - id: sec-4
    title: Lever Arm
    content: 'The lever arm is the perpendicular distance from the pivot to the force line of action.'
    media: []
    check: { id: chk-tq-6, type: multipleChoice, prompt: 'A force line passes through the pivot. Its torque is:', choices: [{ id: a, text: maximum }, { id: b, text: zero }, { id: c, text: force squared }, { id: d, text: always clockwise }], answer: { choiceId: b }, explanation: 'Solution: It is zero.\n\nWhy it works: The perpendicular lever arm is zero.\n\nWhy the other choices fail: Force without a lever arm cannot rotate the object.' }
  - id: sec-5
    title: Torque Signs
    content: 'In planar analysis, choose one rotation direction positive and sum clockwise and counterclockwise torques algebraically.'
    media: []
    check: { id: chk-tq-7, type: multipleChoice, prompt: 'With CCW positive, a 12 N m CCW torque and 5 N m CW torque give net:', choices: [{ id: a, text: '$-17$ N m' }, { id: b, text: '$-7$ N m' }, { id: c, text: '$7$ N m' }, { id: d, text: '$17$ N m' }], answer: { choiceId: c }, explanation: 'Solution: $12-5=7$ N m.\n\nWhy it works: Opposite rotations have opposite signs.\n\nWhy the other choices fail: They reverse signs or add opposing torques.' }
  - id: sec-6
    title: Static Equilibrium
    content: 'A body in rotational equilibrium has $\sum\tau=0$ about any chosen axis.'
    media: []
    check: { id: chk-tq-8, type: multipleChoice, prompt: 'For a balanced seesaw, net torque about its pivot is:', choices: [{ id: a, text: positive }, { id: b, text: negative }, { id: c, text: zero }, { id: d, text: mass }], answer: { choiceId: c }, explanation: 'Solution: It is zero.\n\nWhy it works: Equilibrium means no angular acceleration.\n\nWhy the other choices fail: Nonzero net torque would rotate the seesaw.' }
  - id: sec-7
    title: Torque Units
    content: 'Torque is measured in N m; it shares dimensions with energy but is physically a rotational effect.'
    media: []
    check: { id: chk-tq-9, type: multipleChoice, prompt: 'What is the SI unit of torque?', choices: [{ id: a, text: N }, { id: b, text: N m }, { id: c, text: J/s }, { id: d, text: kg m/s }], answer: { choiceId: b }, explanation: 'Solution: N m.\n\nWhy it works: Torque is force times lever arm.\n\nWhy the other choices fail: They are force, power, or momentum units.' }
  - id: sec-2
    title: Net Torque
    content: 'When multiple forces act on a body, each force produces its own torque.
      The **net torque** $\tau_{net}$ is the sum of the individual torques.


      By convention, a torque that tends to cause a counterclockwise rotation is positive,
      while a torque that causes a clockwise rotation is negative. $$\tau_{net} =
      \sum \tau_i = \tau_1 + \tau_2 + \dots$$'
    media: []
    check:
      id: chk-tq-2
      type: multipleChoice
      prompt: A horizontal uniform seesaw is balanced at its center. A 200 N child
        sits 1.5 m to the left of the pivot. Where must a 300 N child sit on the right
        side to keep the net torque at zero?
      choices:
      - id: a
        text: 0.5 m from the pivot
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: 1.0 m from the pivot
      - id: c
        text: 1.5 m from the pivot
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: d
        text: 2.0 m from the pivot
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        1.0 m from the pivot


        Why it works:

        To balance, the magnitudes of the counterclockwise and clockwise torques must
        be equal: $\tau_{CCW} = \tau_{CW}$. Thus, $(200\text{ N})(1.5\text{ m}) =
        (300\text{ N})(r)$. Solving gives $r = 300 / 300 = 1.0\text{ m}$.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
