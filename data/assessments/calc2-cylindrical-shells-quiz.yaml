schemaVersion: 1
id: calc2-cylindrical-shells-quiz
title: Cylindrical Shells Quiz
assessmentType: quiz
categoryId: calculus-2
subcategoryId: cylindrical-shells
subcategoryIds:
  - cylindrical-shells
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which method MUST you use if you are integrating with respect to $x$ (vertical slices) and revolving around the y-axis?
    choices:
      - id: a
        text: Cylindrical Shells
      - id: b
        text: Disks
      - id: c
        text: Washers
      - id: d
        text: Arc Length
    answer:
      choiceId: a
    explanation: |
      Vertical slices ($dx$) are parallel to the y-axis. When the slices are parallel to the axis of revolution, you use the shell method.

  - id: q002
    type: multipleChoice
    prompt: |
      Set up the integral using the shell method for the volume generated by revolving the region bounded by $y = x^2$, $y = 0$, and $x = 2$ around the y-axis.
    choices:
      - id: a
        text: $2\pi \int_0^2 x \cdot x^2\,dx$
      - id: b
        text: $\pi \int_0^2 (x^2)^2\,dx$
      - id: c
        text: $2\pi \int_0^4 y \sqrt{y}\,dy$
      - id: d
        text: $2\pi \int_0^2 x^2\,dx$
    answer:
      choiceId: a
    explanation: |
      Radius is $x$, height is $x^2$. Formula: $2\pi \int x \cdot h(x)\,dx = 2\pi \int_0^2 x \cdot x^2\,dx$.

  - id: q003
    type: numericResponse
    prompt: |
      Find the volume from the previous question: revolve the region bounded by $y = x^2$, $y = 0$, $x = 2$ around the y-axis.
      Provide the exact decimal value to 2 decimal places.
    answer:
      value: 25.13
      tolerance: 0.1
    explanation: |
      $V = 2\pi \int_0^2 x^3\,dx = 2\pi \left[ \frac{x^4}{4} \right]_0^2 = 2\pi (16/4) = 8\pi \approx 25.13$.

  - id: q004
    type: multipleChoice
    prompt: |
      If you revolve a region in the first quadrant around the vertical line $x = -3$, what is the radius $r(x)$ for the shell method?
    choices:
      - id: a
        text: $x + 3$
      - id: b
        text: $x - 3$
      - id: c
        text: $3 - x$
      - id: d
        text: $-3 - x$
    answer:
      choiceId: a
    explanation: |
      The radius is the distance from $x$ (which is positive) to $-3$. Distance = right - left = $x - (-3) = x + 3$.

  - id: q005
    type: multipleChoice
    prompt: |
      Set up the integral using the shell method for revolving the region bounded by $x = y^2$ and $x = 4$ around the x-axis.
    choices:
      - id: a
        text: $2\pi \int_{-2}^2 y(4 - y^2)\,dy$
      - id: b
        text: $2\pi \int_{0}^4 x(4 - x^2)\,dx$
      - id: c
        text: $\pi \int_{-2}^2 (16 - y^4)\,dy$
      - id: d
        text: $2\pi \int_{0}^2 y(4 - y^2)\,dy$
    answer:
      choiceId: d
    explanation: |
      Since it's revolved around the x-axis and we use shells, we must integrate with respect to $y$ ($dy$).
      The region is symmetric, but for shells, radius $r=y$ is only valid for $y \ge 0$. The volume generated by $y \in [0, 2]$ sweeps out the entire solid.
      Thus, integrate from 0 to 2. $r = y$, height = $4 - y^2$. $2\pi \int_0^2 y(4 - y^2)\,dy$.
