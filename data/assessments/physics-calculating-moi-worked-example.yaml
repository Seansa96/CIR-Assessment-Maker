workedExamples:
- id: we-calc-moi-1
  title: Composite Disc with Cutouts
  problem: Consider a uniform solid disc of radius $R = 1.5\text{ m}$ and total mass
    $M = 10\text{ kg}$ (before cutouts). Two circular holes, each of radius $r = 0.5\text{
    m}$, are cut out. Their centers are located at a distance $d = 0.75\text{ m}$
    from the main axis $O$. Calculate the new moment of inertia of the remaining shape
    about axis $O$.
  steps:
  - id: we-calc-moi-1-step1
    title: 'Step 1: MOI of the Solid Disc'
    instruction: Calculate the moment of inertia $I_0$ of the full disc *before* the
      cutouts.
    prompt: What is $I_0$?
    type: numericResponse
    media:
    - type: image
      src: /media/physics/worked-examples/moi-composite.png
      alt: A large circle of radius R=1.5 with two circular cutouts of radius r=0.5
        positioned at d=0.75 from the center.
      caption: Composite disc showing the location of the cutouts.
    answer:
      value: 11.25
      tolerance: 0.1
    explanation: 'Solution: $I_0=\tfrac12MR^2=\tfrac12(10)(1.5)^2=11.25\ \mathrm{kg\,m^2}$.\n\nWhy it works: A uniform solid disk has central-axis inertia $\tfrac12MR^2$.'
  - id: we-calc-moi-1-step2
    title: 'Step 2: Mass of the Cutouts'
    instruction: Find the mass of the material removed by a single cutout hole, $m_{hole}$.
      Since the disc is uniform, mass is proportional to area $\sigma = \frac{M}{\pi
      R^2}$.
    prompt: What is the mass of one hole $m_{hole}$?
    type: numericResponse
    answer:
      value: 1.111
      tolerance: 0.1
    explanation: 'Solution: $m_{hole}=M(r/R)^2=10(0.5/1.5)^2=1.111\ \mathrm{kg}$.\n\nWhy it works: A uniform disk has mass proportional to area.'
  - id: we-calc-moi-1-step3
    title: 'Step 3: Parallel-Axis Theorem for Cutouts'
    instruction: 'Calculate the MOI of one cutout hole with respect to the main axis
      $O$ using the parallel-axis theorem: $I_{hole} = I_{cm} + md^2$.'
    prompt: What is $I_{hole}$ for one cutout?
    type: numericResponse
    answer:
      value: 0.7638
      tolerance: 0.05
    explanation: 'Solution: $I_{cm}=\tfrac12(1.111)(0.5)^2=0.1388$, then $I_{hole}=I_{cm}+md^2=0.1388+1.111(0.75)^2=0.7638\ \mathrm{kg\,m^2}$.\n\nWhy it works: The parallel-axis theorem shifts a hole''s central inertia to axis $O$.'
  - id: we-calc-moi-1-step4
    title: 'Step 4: Superposition'
    instruction: Subtract the MOI of the two holes from the MOI of the full disc.
    prompt: What is the final $I_{total}$?
    type: numericResponse
    answer:
      value: 9.722
      tolerance: 0.1
    explanation: 'Solution: $I_{total}=I_0-2I_{hole}=11.25-2(0.7638)=9.722\ \mathrm{kg\,m^2}$.\n\nWhy it works: The two holes are removed mass, so their inertias are subtracted.'

- id: calc-moi-we002
  title: Point Masses on a Rod
  problem: 'Two point masses, 2.0 kg at 0.50 m and 3.0 kg at 1.0 m, rotate about the same axis. Find the total moment of inertia.'
  steps:
  - id: cmwe5
    title: Sum point-mass contributions
    instruction: Use $I=\sum mr^2$.
    prompt: 'What is the total moment of inertia in kg m$^2$?'
    type: numericResponse
    answer: { value: 3.5, tolerance: 0.01 }
    explanation: 'Solution: $I=2.0(0.50)^2+3.0(1.0)^2=0.50+3.0=3.50\ \mathrm{kg\,m^2}$.\n\nWhy it works: Add every mass-radius-squared contribution about one axis.'
  - id: cmwe6
    title: Move one mass outward
    instruction: Move the 2.0 kg mass to 1.0 m.
    prompt: 'What is the new total moment of inertia in kg m$^2$?'
    type: numericResponse
    answer: { value: 5, tolerance: 0.01 }
    explanation: 'Solution: $I=2.0(1.0)^2+3.0(1.0)^2=5.0\ \mathrm{kg\,m^2}$.\n\nWhy it works: Moving mass farther from the axis increases its $mr^2$ contribution.'
