questions:
- id: q001
  type: numericResponse
  prompt: |
    Calculate the orbital period $T$ in minutes of a satellite in an extremely low orbit around a hypothetical planet. 
    Assume the orbital radius is equal to the planet's radius $R = 4.0 \times 10^6 \text{ m}$ and the planet's mass is $M = 3.0 \times 10^{24} \text{ kg}$.
    Use $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$.
  answer:
    value: 59.2
    tolerance: 1.0
  explanation: |
    Solution:
    Using Kepler's Third Law: $T^2 = \frac{4\pi^2 r^3}{GM}$.
    $T = 2\pi \sqrt{\frac{(4.0 \times 10^6)^3}{(6.67 \times 10^{-11})(3.0 \times 10^{24})}} \approx 3553 \text{ s}$.
    Convert to minutes: $3553 / 60 = 59.2 \text{ minutes}$.
    
    Why it works:
    Kepler's Third Law allows us to calculate the period of an orbit if the mass of the central body and the orbital radius are known.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: |
    Why do astronauts aboard the International Space Station (ISS) experience "weightlessness"?
  choices:
  - id: a
    text: 'There is no gravity at the altitude of the ISS.'
  - id: b
    text: 'The ISS and the astronauts are both in continuous free fall toward Earth.'
  - id: c
    text: 'The centrifugal force completely cancels out Earth’s gravity.'
  - id: d
    text: 'The ISS is beyond Earth’s gravitational pull.'
  answer:
    choiceId: b
  explanation: |
    Solution:
    The ISS and the astronauts are both in continuous free fall toward Earth.
    
    Why it works:
    At the altitude of the ISS (around 400 km), Earth's gravity is still about 90% as strong as it is on the surface. However, the station has an immense tangential velocity. It falls toward Earth, but the Earth curves away beneath it at the exact same rate. Because the astronauts and the station fall together, there is no normal force pushing against them.
    
    Why the other choices fail:
    Gravity is very much present (preventing the ISS from flying off into deep space). Centrifugal force is a pseudo-force used in rotating reference frames, but the physical reality is free fall.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
