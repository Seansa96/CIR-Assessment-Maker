questions:
- id: rollercoaster-sym-speed-bottom
  title: Speed at the Bottom
  type: symbolicResponse
  prompt: 'A rollercoaster car starts from rest at a height $h$. Assuming no friction, what is its speed $v$ at the bottom (height $0$)? Let gravity be $g$.'
  answer:
    gradingMode: auto
    expectedLatex: \sqrt{2*g*h}
    equivalenceMode: expression
    tolerance: 0
  explanation: 'By conservation of energy, $mgh = \frac{1}{2}mv^2$. Solving for $v$ gives $v = \sqrt{2gh}$.'
- id: rollercoaster-sym-loop-height
  title: Minimum Height for a Loop
  type: symbolicResponse
  prompt: 'A rollercoaster car enters a circular loop of radius $R$. What is the minimum height $H$ it must start from (from rest) to just barely make it through the top of the loop without falling off?'
  answer:
    gradingMode: auto
    expectedLatex: 2.5*R
    equivalenceMode: expression
    tolerance: 0
  explanation: 'To barely make it, the normal force at the top is zero, so gravity provides the centripetal force: $mg = mv^2/R \implies v^2 = gR$. Using energy conservation from the start to the top of the loop (height $2R$): $mgH = mg(2R) + \frac{1}{2}mv^2 = 2mgR + 0.5mgR = 2.5mgR$. Thus, $H = 2.5R$.'
- id: rollercoaster-sym-intermediate-speed
  title: Speed at an Intermediate Height
  type: symbolicResponse
  prompt: 'If a rollercoaster starts from height $h$ with an initial speed $v_0$, what is its speed $v$ at a point of height $y$ (where $y < h$)?'
  answer:
    gradingMode: auto
    expectedLatex: \sqrt{v_0^2 + 2*g*(h-y)}
    equivalenceMode: expression
    tolerance: 0
  explanation: 'By conservation of energy: $\frac{1}{2}mv_0^2 + mgh = \frac{1}{2}mv^2 + mgy$. Rearranging for $v^2$ gives $v^2 = v_0^2 + 2g(h - y)$, so $v = \sqrt{v_0^2 + 2g(h-y)}$.'
