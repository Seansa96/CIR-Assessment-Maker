items:
  - { id: r1, type: typed, prompt: 'Write the positive average disappearance rate for reactant A.', answer: { expected: '-delta[A]/delta t', aliases: ['-Δ[A]/Δt', '-change in [A] divided by change in t'] }, explanation: 'Solution: $-\Delta[A]/\Delta t$. Why it works: The negative sign turns a reactant decrease into a positive rate.' }
  - { id: r2, type: recognition, prompt: 'For $2A\rightarrow B$, which relation is correct?', choices: [{ id: a, text: '$-\tfrac12\Delta[A]/\Delta t=\Delta[B]/\Delta t$' }, { id: b, text: '$-\Delta[A]/\Delta t=\Delta[B]/\Delta t$' }, { id: c, text: '$-2\Delta[A]/\Delta t=\Delta[B]/\Delta t$' }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: Two A are consumed per B formed. Why the other choices fail: b ignores stoichiometry; c reverses the coefficient adjustment.' }
  - { id: r3, type: typed, prompt: 'In rate = k[A]^m[B]^n, what experiment determines m and n?', answer: { expected: 'initial rates experiment', aliases: ['method of initial rates', 'initial rate measurements'] }, explanation: 'Solution: Initial-rate measurements. Why it works: Comparing controlled trials reveals each concentration factor.' }
  - { id: r4, type: typed, prompt: 'If doubling [A] quadruples rate, what is the order in A?', answer: { expected: '2', aliases: ['second order'] }, explanation: 'Solution: 2. Why it works: $4=2^2$, so the exponent is two.' }
  - { id: r5, type: typed, prompt: 'State the first-order half-life formula.', answer: { expected: '0.693/k', aliases: ['ln2/k', 'ln(2)/k'] }, explanation: 'Solution: $t_{1/2}=0.693/k$. Why it works: A first-order process loses the same fraction in equal intervals.' }
  - { id: r6, type: typed, prompt: 'Which graph is linear for a first-order reaction?', answer: { expected: 'ln concentration versus time', aliases: ['ln[A] vs time', 'ln[A] versus t'] }, explanation: 'Solution: $\ln[A]$ versus time. Why it works: The integrated first-order law has slope $-k$.' }
  - { id: r7, type: typed, prompt: 'Name the energy threshold a productive collision must meet.', answer: { expected: 'activation energy', aliases: ['Ea', 'E_a'] }, explanation: 'Solution: Activation energy. Why it works: The collision must access the reaction pathway.' }
  - { id: r8, type: typed, prompt: 'Besides adequate energy, what collision feature can affect whether reaction occurs?', answer: { expected: 'orientation', aliases: ['proper orientation', 'suitable orientation'] }, explanation: 'Solution: Suitable orientation. Why it works: Reacting parts must meet in a geometry that permits bond changes.' }
  - { id: r9, type: typed, prompt: 'In a simple mechanism, what does the slow step usually control?', answer: { expected: 'overall reaction rate', aliases: ['the rate law', 'reaction rate'] }, explanation: 'Solution: The overall rate. Why it works: The slowest pathway event is the throughput bottleneck.' }
  - { id: r10, type: typed, prompt: 'What is an intermediate?', answer: { expected: 'a species formed then consumed in a mechanism', aliases: ['species produced in one step and consumed in another'] }, explanation: 'Solution: A species formed then consumed in a mechanism. Why it works: It cancels from the net chemical equation.' }
  - { id: r11, type: recognition, prompt: 'At fixed temperature, what does a catalyst change?', choices: [{ id: a, text: 'the reaction pathway and activation energy' }, { id: b, text: 'the equilibrium constant' }, { id: c, text: 'the net enthalpy change' }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: A catalyst supplies an alternate lower-barrier path. Why the other choices fail: b is an equilibrium property at fixed temperature; c is a state-function change.' }
  - { id: r12, type: typed, prompt: 'Why does higher temperature usually increase k?', answer: { expected: 'more molecules have energy at least activation energy', aliases: ['more collisions exceed activation energy', 'larger fraction exceeds Ea'] }, explanation: 'Solution: More molecules have at least the activation energy. Why it works: The energy distribution shifts so productive collisions are more frequent.' }
