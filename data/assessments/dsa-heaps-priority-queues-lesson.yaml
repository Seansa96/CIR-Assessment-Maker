questions:
  - id: intro-heaps
    type: freeResponse
    prompt: |
      **The Heap Property**

      A **Heap** is a specialized tree-based data structure that satisfies the heap property. 
      In a **Min-Heap**, for any given node $C$, if $P$ is a parent node of $C$, then the value of $P$ is less than or equal to the value of $C$. The root node is guaranteed to be the absolute smallest element.
      In a **Max-Heap**, the parent is always greater than or equal to its children, and the root is the absolute largest element.

      Unlike a Binary Search Tree (where the left is smaller and the right is larger), a heap makes no guarantees about the order of siblings. The left child could be larger than the right child, or vice versa. The only rule is vertical (parent to child).

      Because of this property, a Heap is the ideal data structure to implement a **Priority Queue**, where you frequently need to extract the "highest priority" (smallest or largest) element in $O(\log N)$ time.

      If you have a Min-Heap and you want to find the *maximum* value in it, how long would it take in the worst case (in Big-O notation), and why?
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution:
      It would take $O(N)$ time.

      Why it works:
      Because a Min-Heap only guarantees that parents are smaller than children, the maximum value could be *any* of the leaf nodes at the bottom of the tree. Since there is no horizontal ordering, you would have to inspect all the leaf nodes (which make up roughly half the tree) to find the maximum, resulting in $O(N)$ time.
