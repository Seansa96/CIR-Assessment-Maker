workedExamples:
- id: we01
  title: A Bernoulli IVP
  problem: Solve $y'-y=xy^2$, $y(0)=1$.
  steps:
  - id: we01-s1
    title: Recognize and substitute
    instruction: Identify $n=2$ and transform.
    type: freeResponse
    prompt: Set $v=1/y$ and derive its equation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Uses Bernoulli substitution
      - Gets linear equation
    explanation: |-
      Solution: Since $v'=-y'/y^2$, division by $y^2$ gives $v'+v=-x$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Solve the transformed equation
    instruction: Use the integrating factor $e^x$.
    type: freeResponse
    prompt: Find $v$ from the data.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Integrates
      - Uses transformed data
    explanation: |-
      Solution: $(e^xv)'=-xe^x$, so $v=1-x+Ce^{-x}$; $v(0)=1$ gives $C=0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Return and verify
    instruction: Invert the substitution and inspect the denominator.
    type: freeResponse
    prompt: Give the solution and interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Back-substitutes
      - Checks interval
    explanation: |-
      Solution: $y=1/(1-x)$ on $(-\infty,1)$; differentiation gives $y'-y=xy^2$ and $y(0)=1$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: A homogeneous nonlinear IVP
  problem: Solve $y'=(y/x)^2$, $y(1)=2$, on $x>0$.
  steps:
  - id: we02-s1
    title: Transform and retain lines
    instruction: Set $y=ux$ and check constant $u$.
    type: freeResponse
    prompt: Find the transformed equation and straight-line solutions.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Product derivative
      - Retains lines
    explanation: |-
      Solution: $u+xu'=u^2$, so $xu'=u(u-1)$; $u=0,1$ give $y=0,x$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Separate the nonconstant branch
    instruction: Integrate with partial fractions and apply data.
    type: freeResponse
    prompt: Find $u(x)$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Separates
      - Uses data
    explanation: |-
      Solution: $\ln|(u-1)/u|=\ln x+C$; $u(1)=2$ gives $(u-1)/u=x/2$, hence $u=2/(2-x)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Return and restrict
    instruction: Use $y=ux$ and find singular points.
    type: freeResponse
    prompt: Give the IVP solution and interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Back-substitutes
      - States interval
    explanation: |-
      Solution: $y=2x/(2-x)$ on $(0,2)$; the interval respects $x>0$ and stops at the pole $x=2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Riccati reduction as an extension
  problem: For $y'=y^2-1$, use the known solution $y_1=1$ and data $y(0)=0$.
  steps:
  - id: we03-s1
    title: Subtract the known solution
    instruction: Let $z=y-1$.
    type: freeResponse
    prompt: Derive the equation and data for $z$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Substitutes
      - Transforms data
    explanation: |-
      Solution: $z'=2z+z^2=z(z+2)$ and $z(0)=-1$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Solve the separable equation
    instruction: Separate $z(z+2)$ and apply data.
    type: freeResponse
    prompt: Find $z$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Partial fractions
      - Uses branch
    explanation: |-
      Solution: Integration gives $z=-2e^{2x}/(1+e^{2x})$ for the selected branch.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Return and verify
    instruction: Add back $y_1$.
    type: freeResponse
    prompt: Give a simple final form and check it.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Back-substitutes
      - Verifies $-\tanh x$
    explanation: |-
      Solution: $y=1+z=(1-e^{2x})/(1+e^{2x})=-\tanh x$; then $y'=-\operatorname{sech}^2x=y^2-1$ and $y(0)=0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
