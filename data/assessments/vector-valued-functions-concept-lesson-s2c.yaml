  - id: s03
    title: Integrate componentwise
    required: true
    content: An antiderivative vector is built one component at a time, with a constant vector when appropriate. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
