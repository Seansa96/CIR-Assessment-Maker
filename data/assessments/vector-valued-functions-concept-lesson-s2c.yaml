  - id: s03
    title: Parameters trace an oriented curve
    required: true
    content: The equations $x=f(t)$, $y=g(t)$, and $z=h(t)$ are the parametric equations of the curve traced by $\mathbf r(t)$. Increasing $t$ gives an orientation, so the same geometric curve can be traced in opposite directions by changing its parameterization.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: What does increasing $t$ determine for a parameterized space curve?
      choices:
      - id: a
        text: The direction in which the curve is traced
        media: []
        issueSignals: []
      - id: b
        text: A normal vector to every point of the curve
        media: []
        issueSignals:
        - id: line-plane-role-confusion
          domains: []
      - id: c
        text: The curve's fixed total length
        media: []
        issueSignals:
        - id: parameter-orientation-error
          domains: []
      - id: d
        text: The value of every coordinate at once
        media: []
        issueSignals:
        - id: parameter-orientation-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Increasing $t$ determines the orientation of the tracing.

        Why it works: A parameter orders the successive position vectors along the curve.

        Why the other choices fail: b confuses a curve direction with a plane normal. c is not determined by orientation. d falsely says different curve points have identical coordinates.
      media: []
