lesson:
  introduction: A vector-valued function assigns a position vector to each permitted parameter value. Read its components, domain, orientation, and derivatives as connected descriptions of one moving point in space.
  sections:
  - id: s01
    title: A vector function outputs vectors
    required: true
    content: A three-dimensional vector function has the form $\mathbf r(t)=\langle f(t),g(t),h(t)\rangle$. Each value of $t$ determines a point on a space curve and a corresponding position vector from the origin.
    media:
    - type: image
      src: /media/calculus-3/space-curves.svg
      alt: A space curve traced by a moving position vector, with a tangent direction at one point.
      caption: The tip of $\mathbf r(t)$ traces a space curve as $t$ changes.
    check:
      id: check-01
      type: multipleChoice
      prompt: What is the output of a vector-valued function $\mathbf r(t)$ in three dimensions?
      choices:
      - id: a
        text: A vector such as $\langle f(t),g(t),h(t)\rangle$
        media: []
        issueSignals: []
      - id: b
        text: One scalar formed by adding its components
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      - id: c
        text: A plane normal that is fixed for all $t$
        media: []
        issueSignals:
        - id: line-plane-role-confusion
          domains: []
      - id: d
        text: Only the parameter value $t$
        media: []
        issueSignals:
        - id: representation-selection-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The output is a vector $\langle f(t),g(t),h(t)\rangle$.

        Why it works: The three component functions provide the x-, y-, and z-coordinates of the moving point.

        Why the other choices fail: b changes a vector into a scalar. c describes a different geometric object. d is the input, not the output.
      media: []
      language: 
      functionName: 
      executionMode: unspecified
      starterCode: 
      tests: 
      circuitQuestion: 
      graphingQuestion: 
