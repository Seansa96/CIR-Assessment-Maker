  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 2 → Parametric Curves if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: One parameter, three components
    required: true
    content: 'A vector-valued function gives a space-curve position for each allowed parameter value. In Vector-Valued Functions and Space Curves, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
