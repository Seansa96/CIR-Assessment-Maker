  - id: s05
    title: Tangent vectors point along the curve
    required: true
    content: The difference quotient is a secant vector. Its limit $\mathbf r'(t)$ is tangent to the curve, so the tangent line through $\mathbf r(t_0)$ uses direction $\mathbf r'(t_0)$.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: If $\mathbf r'(t_0)\ne\mathbf0$, what is its geometric role?
      choices:
      - id: a
        text: It is a direction vector for the tangent line at $\mathbf r(t_0)$
        media: []
        issueSignals: []
      - id: b
        text: It is the position vector of the next point only
        media: []
        issueSignals:
        - id: tangent-vector-role-error
          domains: []
      - id: c
        text: It is perpendicular to every space curve
        media: []
        issueSignals:
        - id: tangent-vector-role-error
          domains: []
      - id: d
        text: It is always a unit vector
        media: []
        issueSignals:
        - id: tangent-vector-role-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $\mathbf r'(t_0)$ gives the tangent-line direction.

        Why it works: It is the limit of secant directions as nearby curve points approach $\mathbf r(t_0)$.

        Why the other choices fail: b confuses change with position. c states an impossible universal perpendicularity. d requires normalization, which has not necessarily occurred.
