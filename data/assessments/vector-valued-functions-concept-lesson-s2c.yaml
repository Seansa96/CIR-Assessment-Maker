        domains: []
  - id: s02
    title: The domain is shared by all components
    required: true
    content: The domain of $\mathbf r(t)$ is the intersection of the domains of all component functions. A parameter value is allowed only when every coordinate of the output vector is defined.
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: What is the domain of $\mathbf r(t)=\langle t^3,\ln(3-t),\sqrt t\rangle$?
      choices:
      - id: a
        text: $[0,3)$
        media: []
        issueSignals: []
      - id: b
        text: $(-\infty,3)$
        media: []
        issueSignals:
        - id: domain-condition-error
          domains: []
      - id: c
        text: $[0,\infty)$
        media: []
        issueSignals:
        - id: domain-condition-error
          domains: []
      - id: d
        text: $(-\infty,\infty)$
        media: []
        issueSignals:
        - id: domain-condition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $\sqrt t$ requires $t\ge0$ and $\ln(3-t)$ requires $t<3$, so the domain is $[0,3)$.

        Why it works: Every component must exist for the vector output to exist.

        Why the other choices fail: b ignores the square-root restriction. c ignores the logarithm restriction. d ignores both restrictions.
      media: []
      language: 
