  - id: s06
    title: Normalize a tangent direction
    required: true
    content: The unit tangent vector is $\mathbf T(t)=\mathbf r'(t)/|\mathbf r'(t)|$ whenever $\mathbf r'(t)\ne\mathbf0$. It preserves the tangent direction while giving it length one.
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: Which expression gives the unit tangent vector?
      choices:
      - id: a
        text: $\mathbf T(t)=\frac{\mathbf r'(t)}{|\mathbf r'(t)|}$
        media: []
        issueSignals: []
      - id: b
        text: $\mathbf T(t)=|\mathbf r'(t)|\mathbf r'(t)$
        media: []
        issueSignals:
        - id: unit-tangent-normalization-error
          domains: []
      - id: c
        text: $\mathbf T(t)=\mathbf r(t)/|\mathbf r(t)|$
        media: []
        issueSignals:
        - id: tangent-vector-role-error
          domains: []
      - id: d
        text: $\mathbf T(t)=\mathbf r'(t)+|\mathbf r'(t)|$
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Divide $\mathbf r'(t)$ by its magnitude.

        Why it works: Dividing a nonzero vector by its magnitude produces a vector of length one in the same direction.

        Why the other choices fail: b scales in the wrong direction. c normalizes position rather than tangent direction. d adds unlike scalar and vector quantities.
