  - id: s07
    title: Integrals are componentwise
    required: true
    content: A definite or indefinite vector integral is formed by integrating each component. This is why a vector antiderivative differentiates back to the original vector function component by component.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: Find $\int\langle2t,\cos t,3\rangle\,dt$.
      choices:
      - id: a
        text: $\langle t^2,\sin t,3t\rangle+\mathbf C$
        media: []
        issueSignals: []
      - id: b
        text: $t^2+\sin t+3t+C$
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      - id: c
        text: $\langle2t^2,\sin t,3\rangle+\mathbf C$
        media: []
        issueSignals:
        - id: parametric-integral-error
          domains: []
      - id: d
        text: $\langle t^2,\cos t,3t\rangle+\mathbf C$
        media: []
        issueSignals:
        - id: parametric-integral-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Integrate each component to get $\langle t^2,\sin t,3t\rangle+\mathbf C$.

        Why it works: Vector integration applies the ordinary antiderivative rule separately to each coordinate function.

        Why the other choices fail: b loses the vector structure. c mishandles the first and third antiderivatives. d fails to integrate $\cos t$.
