  - id: s04
    title: Differentiate each component
    required: true
    content: When the component functions are differentiable, $\mathbf r'(t)=\langle f'(t),g'(t),h'(t)\rangle$. For a position vector, this derivative is the velocity vector and gives the tangent direction when it is nonzero.
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: Differentiate $\mathbf r(t)=\langle t^2,\sin t,t\rangle$.
      choices:
      - id: a
        text: $\langle2t,\cos t,1\rangle$
        media: []
        issueSignals: []
      - id: b
        text: $\langle t^2,\cos t,t\rangle$
        media: []
        issueSignals:
        - id: parametric-derivative-error
          domains: []
      - id: c
        text: $\langle2t,\sin t,0\rangle$
        media: []
        issueSignals:
        - id: parametric-derivative-error
          domains: []
      - id: d
        text: $2t+\cos t+1$
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $\mathbf r'(t)=\langle2t,\cos t,1\rangle$.

        Why it works: Differentiate x, y, and z components separately.

        Why the other choices fail: b leaves two components undifferentiated. c differentiates $\sin t$ and $t$ incorrectly. d adds components into a scalar.
