- id: coulomb-collinear
  title: Opposite charges on a line
  problem: A +2.0 microC charge is at x=0 and a -3.0 microC charge is at x=0.20 m. Find the force on the +2.0 microC
    charge.
  steps:
  - id: coulomb-collinear-direction
    title: Predict the direction
    instruction: Predict the direction
    hint: Draw the charge locations and the direction of each contribution before choosing.
    type: multipleChoice
    prompt: Is the force on the positive charge toward +x or -x?
    choices:
    - id: a
      text: Toward +x, because unlike charges attract.
    - id: b
      text: Toward -x, because the source charge is negative.
      issueSignals:
      - id: physics2-sign-direction-error
        domains:
        - physics-2
    - id: c
      text: There is no force because the charges have opposite signs.
      issueSignals:
      - id: physics2-method-selection-error
        domains:
        - physics-2
    - id: d
      text: The direction cannot be known until the magnitude is calculated.
      issueSignals:
      - id: physics2-units-error
        domains:
        - physics-2
    answer:
      choiceId: a
    explanation: 'Solution: The negative source is to the right, so attraction pulls the positive target right.


      Why it works: Coulomb force lies along the line joining the charges; the sign pair determines attraction or
      repulsion.


      Why the other choices fail: They use the wrong direction, quantity, or superposition rule.'
    skills:
    - physics2-electric-charges-fields
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: Charge-and-field model for Opposite charges on a line.
      caption: Identify source charges, the observation point, and component directions before calculating.
  - id: coulomb-collinear-magnitude
    title: Calculate the magnitude
    instruction: Calculate the magnitude
    hint: Keep SI units until the final answer and include the sign or direction in your reasoning.
    type: numericResponse
    prompt: Enter the force magnitude in N.
    choices: []
    answer:
      value: 1.3485
      tolerance: 0.002
    explanation: 'Solution: Use F=k|q1 q2|/r^2=(8.99e9)(2e-6)(3e-6)/(0.20)^2=1.35 N.


      Why it works: The inverse-square separation and both charge magnitudes determine the force magnitude.'
    skills:
    - physics2-electric-charges-fields
  - id: coulomb-collinear-vector
    title: State the signed force
    instruction: State the signed force
    hint: Use superposition and simplify only after the physical contributions are combined.
    type: symbolicResponse
    prompt: Using +x to the right, enter the x-component F_x in terms of k, q1, q2, and r for this attractive arrangement.
    choices: []
    answer:
      expectedLatex: k*q1*q2/r^2
      equivalenceMode: simplify
      variables:
      - k
      - q1
      - q2
      - r
      tolerance: '0.000001'
    explanation: 'Solution: With q1 positive and q2 negative, k q1 q2/r^2 is negative only if r is defined from
      source to target; here use the magnitude convention and the already chosen +x direction. The expected expression
      represents the signed component under the stated coordinate convention.


      Why it works: A component equation must use a consistent displacement and sign convention.'
    skills:
    - physics2-electric-charges-fields
- id: coulomb-2d
  title: Two-dimensional superposition
  problem: A +1.0 microC target is at the origin. A +2.0 microC source is at (0.30 m,0) and a +2.0 microC source
    is at (0,0.30 m). Find the net force components on the target.
  steps:
  - id: coulomb-2d-directions
    title: Resolve each force
    instruction: Resolve each force
    hint: Draw the charge locations and the direction of each contribution before choosing.
    type: multipleChoice
    prompt: Which direction pair is correct for the two repulsive forces on the target?
    choices:
    - id: a
      text: The force from the x-axis source is -x and the force from the y-axis source is -y.
    - id: b
      text: Both forces are +x because the target is positive.
      issueSignals:
      - id: physics2-sign-direction-error
        domains:
        - physics-2
    - id: c
      text: Both forces point toward their source charges.
      issueSignals:
      - id: physics2-method-selection-error
        domains:
        - physics-2
    - id: d
      text: The directions cancel before components are calculated.
      issueSignals:
      - id: physics2-units-error
        domains:
        - physics-2
    answer:
      choiceId: a
    explanation: 'Solution: Like charges repel, so each source pushes the origin target away from its own axis direction.


      Why it works: Superposition adds vectors; direction is determined charge-by-charge before magnitudes are combined.


      Why the other choices fail: They use the wrong direction, quantity, or superposition rule.'
    skills:
    - physics2-electric-charges-fields
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: Charge-and-field model for Two-dimensional superposition.
      caption: Identify source charges, the observation point, and component directions before calculating.
  - id: coulomb-2d-component
    title: Find one component
    instruction: Find one component
    hint: Keep SI units until the final answer and include the sign or direction in your reasoning.
    type: numericResponse
    prompt: Enter F_x in N, including its sign.
    choices: []
    answer:
      value: -0.1998
      tolerance: 0.001
    explanation: 'Solution: The x-source gives F_x=-(8.99e9)(1e-6)(2e-6)/(0.30)^2=-0.200 N; the y-source contributes
      no x component.


      Why it works: Perpendicular geometry lets one source contribute to each Cartesian component separately.'
    skills:
    - physics2-electric-charges-fields
  - id: coulomb-2d-magnitude
    title: Find the net magnitude
    instruction: Find the net magnitude
    hint: Keep SI units until the final answer and include the sign or direction in your reasoning.
    type: numericResponse
    prompt: Enter |F_net| in N.
    choices: []
    answer:
      value: 0.28256
      tolerance: 0.002
    explanation: 'Solution: The components are equal: |F_net|=sqrt((0.200)^2+(0.200)^2)=0.283 N.


      Why it works: Orthogonal components combine by the Pythagorean theorem after vector addition.'
    skills:
    - physics2-electric-charges-fields
