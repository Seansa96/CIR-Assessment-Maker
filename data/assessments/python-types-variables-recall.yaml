schemaVersion: 1
id: python-types-variables-recall
title: Python Types and Variables Recall
assessmentType: recallDrill
categoryId: python
subcategoryId: python-types-and-variables
subcategoryIds:
  - python-types-and-variables
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'Which function is used to ask the user for text input?'
    answer:
      expected: input
      aliases:
        - input()
  - id: r002
    type: typed
    prompt: 'Which function is used to output text to the console?'
    answer:
      expected: print
      aliases:
        - print()
  - id: r003
    type: typed
    prompt: 'What type is used for whole numbers?'
    answer:
      expected: int
      aliases:
        - integer
  - id: r004
    type: typed
    prompt: 'What type is used for numbers with decimal points?'
    answer:
      expected: float
      aliases:
        - floating point
  - id: r005
    type: typed
    prompt: 'What type does the `input()` function always return?'
    answer:
      expected: str
      aliases:
        - string
  - id: r006
    type: flashcard
    prompt: 'How do you correctly write a boolean "true" value in Python?'
    answer:
      expected: '`True` (with a capital T)'
  - id: r007
    type: flashcard
    prompt: 'What character is used before the quote marks to create a formatted string literal?'
    answer:
      expected: '`f` or `F` (e.g., `f"Text"`)'
  - id: r008
    type: typed
    prompt: 'What function would you wrap `input()` in to safely get a whole number?'
    answer:
      expected: int
      aliases:
        - int()


