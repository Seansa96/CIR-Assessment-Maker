workedExamples:
  - id: we-infinite-series-review-1
    title: Classify a signed rational series
    problem: |
      Classify
      $$\sum_{n=1}^{\infty}(-1)^{n-1}\frac{3n+1}{n^2+2}$$
      as absolutely convergent, conditionally convergent, or divergent.
    steps:
      - id: step-infinite-series-review-1-1
        title: Check the magnitude limit
        instruction: |
          Let $b_n=(3n+1)/(n^2+2)$. Dividing by $n^2$ shows
          $b_n\to0$.
        type: multipleChoice
        prompt: Which necessary condition is established?
        choices:
          - { id: a, text: 'The signed terms approach zero.' }
          - { id: b, text: 'The series converges absolutely.' }
          - { id: c, text: 'The partial sums equal zero.' }
          - { id: d, text: 'The series is geometric.' }
        answer: { choiceId: a }
        explanation: A zero term limit avoids immediate divergence but does not yet classify the series.
      - id: step-infinite-series-review-1-2
        title: Verify eventual decrease
        instruction: |
          For $f(x)=(3x+1)/(x^2+2)$,
          $$f'(x)=\frac{-3x^2-2x+6}{(x^2+2)^2},$$
          which is negative for all sufficiently large $x$. Thus $b_n$ is
          eventually decreasing, and the alternating-series test proves signed
          convergence.
        type: multipleChoice
        prompt: Why is eventual decrease sufficient?
        choices:
          - { id: a, text: 'Removing finitely many initial terms does not change convergence.' }
          - { id: b, text: 'The derivative must be negative only once.' }
          - { id: c, text: 'Absolute values remove every early term.' }
          - { id: d, text: 'The series begins at infinity.' }
        answer: { choiceId: a }
        explanation: The convergence question is determined by the tail.
      - id: step-infinite-series-review-1-3
        title: Test absolute convergence
        instruction: |
          Compare the magnitudes with $1/n$:
          $$\lim_{n\to\infty}
          \frac{(3n+1)/(n^2+2)}{1/n}=3.$$
          The positive magnitude series therefore diverges like the harmonic
          series.
        type: multipleChoice
        prompt: What does the finite positive comparison limit prove?
        choices:
          - { id: a, text: 'The two positive series share convergence behavior.' }
          - { id: b, text: 'The target series sums to $3$.' }
          - { id: c, text: 'The signed series diverges.' }
          - { id: d, text: 'The terms do not approach zero.' }
        answer: { choiceId: a }
        explanation: Limit comparison transfers behavior of the absolute-value series, not the signed cancellation.
      - id: step-infinite-series-review-1-4
        title: Combine the conclusions
        instruction: |
          The signed series converges, but its magnitude series diverges.
          Therefore it is conditionally convergent.
        type: multipleChoice
        prompt: Which classification records both facts?
        choices:
          - { id: a, text: 'Conditionally convergent' }
          - { id: b, text: 'Absolutely convergent' }
          - { id: c, text: 'Divergent' }
          - { id: d, text: 'Telescoping' }
        answer: { choiceId: a }
        explanation: Conditional convergence is precisely convergence without absolute convergence.

  - id: we-infinite-series-review-2
    title: Determine a power-series interval
    problem: |
      Find the radius and interval of convergence of
      $$\sum_{n=1}^{\infty}\frac{n(x-1)^n}{4^n}.$$
    steps:
      - id: step-infinite-series-review-2-1
        title: Form the absolute ratio
        instruction: |
          Consecutive absolute terms satisfy
          $$\left|\frac{a_{n+1}}{a_n}\right|
          =\frac{n+1}{n}\frac{|x-1|}{4}
          \longrightarrow\frac{|x-1|}{4}.$$
        type: multipleChoice
        prompt: What interior condition follows?
        choices:
          - { id: a, text: '$|x-1|<4$' }
          - { id: b, text: '$|x-4|<1$' }
          - { id: c, text: '$|x-1|\le4$' }
          - { id: d, text: '$|x|<4$' }
        answer: { choiceId: a }
        explanation: Ratio-test convergence requires the limiting ratio to be strictly below one.
      - id: step-infinite-series-review-2-2
        title: Locate the endpoint candidates
        instruction: |
          The center is $1$ and radius is $4$, giving candidate endpoints
          $x=-3$ and $x=5$.
        type: multipleChoice
        prompt: What is the open interval before endpoint tests?
        choices:
          - { id: a, text: '$(-3,5)$' }
          - { id: b, text: '$(-4,4)$' }
          - { id: c, text: '$(-5,3)$' }
          - { id: d, text: '$(1,4)$' }
        answer: { choiceId: a }
        explanation: Solve $-4<x-1<4$ by adding one to every part.
      - id: step-infinite-series-review-2-3
        title: Test both endpoints
        instruction: |
          At $x=5$, the terms become $n$; at $x=-3$, they become
          $n(-1)^n$. Neither term sequence approaches zero.
        type: multipleChoice
        prompt: Which test rejects both endpoints immediately?
        choices:
          - { id: a, text: 'The divergence test' }
          - { id: b, text: 'The integral test' }
          - { id: c, text: 'The alternating-series test' }
          - { id: d, text: 'The comparison test with $1/n^2$' }
        answer: { choiceId: a }
        explanation: Nonvanishing term magnitudes make series convergence impossible.
      - id: step-infinite-series-review-2-4
        title: State the final result
        instruction: |
          Neither endpoint is included, so the radius is $R=4$ and the interval
          of convergence is $(-3,5)$.
        type: multipleChoice
        prompt: Does the factor $n$ change the radius from the geometric value $4$?
        choices:
          - { id: a, text: 'No; $n^{1/n}\to1$, though it affects endpoint behavior.' }
          - { id: b, text: 'Yes; it makes the radius zero.' }
          - { id: c, text: 'Yes; it doubles the radius.' }
          - { id: d, text: 'No; polynomial factors never affect any convergence question.' }
        answer: { choiceId: a }
        explanation: Polynomial coefficient growth is subexponential, but endpoint substitution can leave growing terms.

  - id: we-infinite-series-review-3
    title: Approximate $\ln 2$ with a certified alternating error
    problem: |
      Using
      $$\ln2=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}n,$$
      find the least $N$ for which the alternating-series theorem guarantees
      $|\ln2-S_N|<0.001$, and determine whether $S_N$ is above or below $\ln2$.
    steps:
      - id: step-infinite-series-review-3-1
        title: Write the next-term bound
        instruction: |
          The reciprocal magnitudes decrease to zero, so
          $$|\ln2-S_N|\le\frac1{N+1}.$$
        type: multipleChoice
        prompt: What kind of information is $1/(N+1)$?
        choices:
          - { id: a, text: 'An upper bound on the absolute error' }
          - { id: b, text: 'The exact error for every $N$' }
          - { id: c, text: 'The value of $S_N$' }
          - { id: d, text: 'A lower bound on $\ln2$' }
        answer: { choiceId: a }
        explanation: The first omitted magnitude bounds the error but generally does not equal it.
      - id: step-infinite-series-review-3-2
        title: Respect the strict tolerance
        instruction: |
          Require
          $$\frac1{N+1}<\frac1{1000},$$
          so $N+1>1000$.
        type: multipleChoice
        prompt: Why does $N=999$ fail the requested guarantee?
        choices:
          - { id: a, text: 'It yields a bound equal to $0.001$, not below it.' }
          - { id: b, text: 'It includes too many terms.' }
          - { id: c, text: 'Odd indices cannot be used.' }
          - { id: d, text: '$999$ is not positive.' }
        answer: { choiceId: a }
        explanation: Strict accuracy language requires a strict inequality in the sufficient bound.
      - id: step-infinite-series-review-3-3
        title: Find the least truncation index
        instruction: |
          The least integer satisfying $N+1>1000$ is $N=1000$.
        type: multipleChoice
        prompt: What is the first omitted denominator at this truncation?
        choices:
          - { id: a, text: '$999$' }
          - { id: b, text: '$1000$' }
          - { id: c, text: '$1001$' }
          - { id: d, text: '$2000$' }
        answer: { choiceId: c }
        explanation: Summing through $n=1000$ makes $n=1001$ the next term.
      - id: step-infinite-series-review-3-4
        title: Determine the side of the approximation
        instruction: |
          The first omitted term has sign $(-1)^{1000}=+1$, so
          $R_{1000}=\ln2-S_{1000}>0$. Thus $S_{1000}$ is an underestimate.
        type: multipleChoice
        prompt: Which final statement is correct?
        choices:
          - { id: a, text: '$S_{1000}<\ln2$ and the gap is below $0.001$.' }
          - { id: b, text: '$S_{1000}>\ln2$ and the gap is below $0.001$.' }
          - { id: c, text: '$S_{1000}=\ln2$ exactly.' }
          - { id: d, text: 'The side cannot be determined.' }
        answer: { choiceId: a }
        explanation: The alternating remainder has the sign of the first omitted term when the hypotheses hold.
