- id: we-infinite-series-review-3
  title: |-
    Approximate $\ln 2$ with a certified alternating error
  problem: |
    Using
    $$\ln2=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}n,$$
    find the least $N$ for which the alternating-series theorem guarantees
    $|\ln2-S_N|<0.001$, and determine whether $S_N$ is above or below $\ln2$.
  steps:
  - id: step-infinite-series-review-3-1
    title: Write the next-term bound
    instruction: |
      The reciprocal magnitudes decrease to zero, so
      $$|\ln2-S_N|\le\frac1{N+1}.$$
    type: multipleChoice
    prompt: What kind of information is $1/(N+1)$?
    choices:
    - id: a
      text: An upper bound on the absolute error
    - id: b
      text: The exact error for every $N$
    - id: c
      text: The value of $S_N$
    - id: d
      text: |-
        A lower bound on $\ln2$
    answer:
      choiceId: a
    explanation: |-
      Solution: The first omitted magnitude bounds the error but generally does not equal it. Therefore the answer is An upper bound on the absolute error.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

