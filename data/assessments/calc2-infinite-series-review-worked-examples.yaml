- id: we-infinite-series-review-1
  title: Classify a signed rational series
  problem: |
    Classify
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\frac{3n+1}{n^2+2}$$
    as absolutely convergent, conditionally convergent, or divergent.
  steps:
  - id: step-infinite-series-review-1-1
    title: Check the magnitude limit
    instruction: |
      Let $b_n=(3n+1)/(n^2+2)$. Dividing by $n^2$ shows
      $b_n\to0$.
    type: multipleChoice
    prompt: Which necessary condition is established?
    choices:
    - id: a
      text: The signed terms approach zero.
    - id: b
      text: The series converges absolutely.
    - id: c
      text: The partial sums equal zero.
    - id: d
      text: The series is geometric.
    answer:
      choiceId: a
    explanation: |-
      Solution: A zero term limit avoids immediate divergence but does not yet classify the series. Therefore the answer is The signed terms approach zero.. Therefore the answer is The signed terms approach zero.. Therefore the answer is The signed terms approach zero..

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: The series converges absolutely. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The partial sums equal zero. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The series is geometric. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-infinite-series-review-1-2
    title: Verify eventual decrease
    instruction: |
      For $f(x)=(3x+1)/(x^2+2)$,
      $$f'(x)=\frac{-3x^2-2x+6}{(x^2+2)^2},$$
      which is negative for all sufficiently large $x$. Thus $b_n$ is
      eventually decreasing, and the alternating-series test proves signed
      convergence.
    type: multipleChoice
    prompt: Why is eventual decrease sufficient?
    choices:
    - id: a
      text: Removing finitely many initial terms does not change convergence.
    - id: b
      text: The derivative must be negative only once.
    - id: c
      text: Absolute values remove every early term.
    - id: d
      text: The series begins at infinity.
    answer:
      choiceId: a
    explanation: |-
      Solution: The convergence question is determined by the tail. Therefore the answer is Removing finitely many initial terms does not change convergence.. Therefore the answer is Removing finitely many initial terms does not change convergence.. Therefore the answer is Removing finitely many initial terms does not change convergence..

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: The derivative must be negative only once. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Absolute values remove every early term. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The series begins at infinity. conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-infinite-series-review-1-3
    title: Test absolute convergence
    instruction: |
      Compare the magnitudes with $1/n$:
      $$\lim_{n\to\infty}
      \frac{(3n+1)/(n^2+2)}{1/n}=3.$$
      The positive magnitude series therefore diverges like the harmonic
      series.
    type: multipleChoice
    prompt: What does the finite positive comparison limit prove?
    choices:
    - id: a
      text: The two positive series share convergence behavior.
    - id: b
      text: The target series sums to $3$.
    - id: c
      text: The signed series diverges.
    - id: d
      text: The terms do not approach zero.
    answer:
      choiceId: a
    explanation: 'Solution: Limit comparison transfers behavior of the absolute-value series, not the signed cancellation. Therefore the answer is The two positive series share convergence behavior.. Therefore the answer is The two positive series share convergence behavior.. Therefore the answer is The two positive series share convergence behavior..


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.


      Why the other choices fail: The target series sums to $3$. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The signed series diverges. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The terms do not approach zero. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.'
  - id: step-infinite-series-review-1-4
    title: Combine the conclusions
    instruction: 'The signed series converges, but its magnitude series diverges.

      Therefore it is conditionally convergent.

      '
    type: multipleChoice
    prompt: Which classification records both facts?
    choices:
    - id: a
      text: Conditionally convergent
    - id: b
      text: Absolutely convergent
    - id: c
      text: Divergent
    - id: d
      text: Telescoping
    answer:
      choiceId: a
    explanation: |-
      Solution: Conditional convergence is precisely convergence without absolute convergence. Therefore the answer is Conditionally convergent.

      Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

      Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

      Why the other choices fail: Absolutely convergent conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; Divergent conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; Telescoping conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
- id: we-infinite-series-review-2
  title: Determine a power-series interval
  problem: |
    Find the radius and interval of convergence of
    $$\sum_{n=1}^{\infty}\frac{n(x-1)^n}{4^n}.$$
  steps:
  - id: step-infinite-series-review-2-1
    title: Form the absolute ratio
    instruction: |
      Consecutive absolute terms satisfy
      $$\left|\frac{a_{n+1}}{a_n}\right|
      =\frac{n+1}{n}\frac{|x-1|}{4}
      \longrightarrow\frac{|x-1|}{4}.$$
    type: multipleChoice
    prompt: What interior condition follows?
    choices:
    - id: a
      text: $|x-1|<4$
    - id: b
      text: $|x-4|<1$
    - id: c
      text: |-
        $|x-1|\le4$
    - id: d
      text: $|x|<4$
    answer:
      choiceId: a
    explanation: |-
      Solution: Ratio-test convergence requires the limiting ratio to be strictly below one. Therefore the answer is $|x-1|<4$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $|x-4|<1$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $|x-1|\le4$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $|x|<4$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-infinite-series-review-2-2
    title: Locate the endpoint candidates
    instruction: 'The center is $1$ and radius is $4$, giving candidate endpoints

      $x=-3$ and $x=5$.

      '
    type: multipleChoice
    prompt: What is the open interval before endpoint tests?
    choices:
    - id: a
      text: $(-3,5)$
    - id: b
      text: $(-4,4)$
    - id: c
      text: $(-5,3)$
    - id: d
      text: $(1,4)$
    answer:
      choiceId: a
    explanation: |-
      Solution: Solve $-4<x-1<4$ by adding one to every part. Therefore the answer is $(-3,5)$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $(-4,4)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $(-5,3)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $(1,4)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-infinite-series-review-2-3
    title: Test both endpoints
    instruction: 'At $x=5$, the terms become $n$; at $x=-3$, they become

      $n(-1)^n$. Neither term sequence approaches zero.

      '
    type: multipleChoice
    prompt: Which test rejects both endpoints immediately?
    choices:
    - id: a
      text: The divergence test
    - id: b
      text: The integral test
    - id: c
      text: The alternating-series test
    - id: d
      text: The comparison test with $1/n^2$
    answer:
      choiceId: a
    explanation: 'Solution: Nonvanishing term magnitudes make series convergence impossible. Therefore the answer is The divergence test.


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.


      Why the other choices fail: The integral test conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The alternating-series test conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The comparison test with $1/n^2$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.'
  - id: step-infinite-series-review-2-4
    title: State the final result
    instruction: 'Neither endpoint is included, so the radius is $R=4$ and the interval

      of convergence is $(-3,5)$.

      '
    type: multipleChoice
    prompt: Does the factor $n$ change the radius from the geometric value $4$?
    choices:
    - id: a
      text: |-
        No; $n^{1/n}\to1$, though it affects endpoint behavior.
    - id: b
      text: Yes; it makes the radius zero.
    - id: c
      text: Yes; it doubles the radius.
    - id: d
      text: No; polynomial factors never affect any convergence question.
    answer:
      choiceId: a
    explanation: |-
