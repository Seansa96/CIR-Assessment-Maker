questions:
- id: q001
  type: multipleChoice
  prompt: A tangent segment $PT$ and a secant segment $PAB$ are drawn to a circle from an external point
    $P$. If $PA = 4$ and $AB = 5$, what is the length of the tangent segment $PT$?
  difficultyDimensions:
  - 'Calculate the whole secant length: $PB = 4 + 5 = 9$.'
  - 'Apply Tangent-Secant Theorem: $PT^2 = PA \cdot PB$.'
  - 'Substitute: $PT^2 = 4 \cdot 9 = 36$.'
  - 'Solve: $PT = 6$.'
  choices:
  - id: a
    text: $20$
    issueSignals:
    - id: squared-error
      domains: []
  - id: b
    text: $6$
  - id: c
    text: $2\sqrt{5}$
    issueSignals:
    - id: outside-inside-multiplication-error
      domains: []
  - id: d
    text: $4.5$
    issueSignals:
    - id: addition-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The Tangent-Secant Power Theorem states that $\text{tangent}^2 = \text{outside} \times \text{whole}$.

    The outside segment is $PA = 4$.

    The whole secant segment is $PB = PA + AB = 4 + 5 = 9$.

    $PT^2 = 4 \times 9$

    $PT^2 = 36$

    $PT = 6$.


    Why it works:

    The most common error on this type of problem is multiplying the outside segment by the inside segment
    ($4 \times 5 = 20$). The formula requires multiplying the outside segment by the *entire* length from
    the external point to the far edge of the circle.


    Why the other choices fail:

    - $20$ comes from calculating $4 \times 5 = 20$, and failing to take the square root or correctly
    form the whole length.

    - $2\sqrt{5}$ comes from the trap of multiplying outside by inside: $\sqrt{4 \times 5} = \sqrt{20}
    = 2\sqrt{5}$.

    - $4.5$ is the average of 4 and 5.

    '
- id: q002
  type: multipleChoice
  prompt: Two secant segments, $PAB$ and $PCD$, are drawn to a circle from an exterior point $P$. If $PA
    = 6$, $AB = 10$, and $PD = 24$, what is the length of $PC$?
  difficultyDimensions:
  - 'Calculate whole secant length for $PAB$: $PB = 6 + 10 = 16$.'
  - 'Apply Secant-Secant Theorem: $PA \cdot PB = PC \cdot PD$.'
  - 'Substitute: $6 \cdot 16 = PC \cdot 24$.'
  - 'Solve: $96 = 24 \cdot PC \implies PC = 4$.'
  choices:
  - id: a
    text: $2.5$
    issueSignals:
    - id: outside-inside-multiplication-error
      domains: []
  - id: b
    text: $4$
  - id: c
    text: $9$
    issueSignals:
    - id: reverse-order-confusion
      domains: []
  - id: d
    text: $14.4$
    issueSignals:
    - id: arithmetic-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    By the Secant-Secant Power Theorem, $\text{outside} \times \text{whole} = \text{outside} \times \text{whole}$.

    For the first secant, the outside is $PA = 6$ and the whole is $PB = 6 + 10 = 16$.

    For the second secant, the outside is $PC$ and the whole is $PD = 24$.

    $6 \times 16 = PC \times 24$

    $96 = 24 \times PC$

    $PC = 4$.


    Why it works:

    The formula treats both secants exactly the same way. The product of the outside piece and the total
    length is a constant for any secant drawn from point $P$ to that specific circle.


    Why the other choices fail:

    - $2.5$ comes from the classic trap of multiplying outside by inside: $6 \times 10 = PC \times (24
    - PC)$, wait, or $6 \times 10 = PC \times 24 \implies 60 = 24PC \implies PC = 2.5$. This treats 24
    as the inside segment.

    - $9$ comes from adding instead of multiplying ($6 + 16 = 22$, $22 - 24 = -2$... no).

    - $14.4$ might be $24 \times 6 / 10$.

    '
- id: q003
  type: multipleChoice
  prompt: Chords $AB$ and $CD$ intersect at point $E$ inside a circle. If $AE = x$, $EB = x + 3$, $CE
    = 4$, and $ED = 7$, what is the length of chord $AB$?
  difficultyDimensions:
  - 'Set up equation: $x(x + 3) = 4 \cdot 7$.'
  - 'Convert to quadratic: $x^2 + 3x - 28 = 0$.'
  - 'Factor: $(x + 7)(x - 4) = 0$.'
  - 'Select positive root: $x = 4$.'
  - 'Calculate full chord: $AB = x + (x + 3) = 4 + 7 = 11$.'
  choices:
  - id: a
    text: $4$
    issueSignals:
    - id: partial-length-confusion
      domains: []
  - id: b
    text: $11$
  - id: c
    text: $7$
    issueSignals:
    - id: partial-length-confusion
      domains: []
  - id: d
    text: $28$
    issueSignals:
    - id: multiplication-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    Use the Intersecting Chords Theorem:

    $AE \times EB = CE \times ED$

    $x(x + 3) = 4 \times 7$

    $x^2 + 3x = 28$

    $x^2 + 3x - 28 = 0$.

    Factor the quadratic equation:

    $(x + 7)(x - 4) = 0$.

    Since a length cannot be negative, $x = 4$.

    The question asks for the length of chord $AB$, which is $AE + EB$.

    $AB = x + (x + 3) = 4 + 7 = 11$.


    Why it works:

    Power of a Point problems frequently drop into quadratic equations when an unknown value is distributed
    across the segments of a single chord.


    Why the other choices fail:

    - $4$ is the length of segment $AE$ (the value of $x$), but not the full chord.

    - $7$ is the length of segment $EB$ ($x+3$), but not the full chord.

    - $28$ is the product of the segments ($4 \times 7 = 28$).

    '
- id: q004
  type: multipleChoice
  prompt: A point $P$ is located inside a circle of radius 10, such that the distance from $P$ to the
    center of the circle is 6. What is the length of the SHORTEST chord that can be drawn through point
    $P$?
  difficultyDimensions:
  - Recognize that the shortest chord through a point is perpendicular to the diameter through that point.
  - Draw the right triangle formed by the center, point $P$, and the end of the chord.
  - The hypotenuse is the radius (10), one leg is the distance (6).
  - 'Use Pythagorean theorem: $6^2 + x^2 = 10^2 \implies x = 8$.'
  - 'The chord is twice this leg: $2 \times 8 = 16$.'
  choices:
  - id: a
    text: $8$
    issueSignals:
    - id: half-chord-error
      domains: []
  - id: b
    text: $16$
  - id: c
    text: $20$
    issueSignals:
    - id: diameter-confusion
      domains: []
  - id: d
    text: $12.5$
    issueSignals:
    - id: area-calculation-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The shortest chord passing through any interior point $P$ is the one that is strictly perpendicular
    to the diameter passing through $P$.

    This perpendicular chord is bisected by the diameter, forming two right triangles.

    In one of these right triangles, the hypotenuse is the radius ($r=10$), one leg is the distance from
    the center ($d=6$), and the other leg is half the chord ($x$).

    $6^2 + x^2 = 10^2$

    $36 + x^2 = 100 \implies x^2 = 64 \implies x = 8$.

    Because $x$ is only half the chord, the full chord length is $8 \times 2 = 16$.


    Why it works:

    Alternatively, you can use the Power of a Point! The power of point $P$ is $r^2 - d^2 = 100 - 36 =
    64$.

    For the shortest chord, $P$ is the midpoint, meaning both segments of the chord are equal ($x$ and
    $x$).

    By the intersecting chords theorem, $x \cdot x = \text{Power} = 64 \implies x^2 = 64 \implies x =
    8$.

    Full chord $= 2x = 16$.


    Why the other choices fail:

    - $8$ is exactly half of the shortest chord.

    - $20$ is the length of the *longest* chord (the diameter).

    - $12.5$ is a distractor.

    '
- id: q005
  type: multipleChoice
  prompt: A circle has a diameter $AB$. A tangent line touches the circle at point $T$. If we extend the
    diameter $AB$ past $B$, it meets the tangent line at point $P$. If the radius of the circle is 5 and
    $PB = 8$, what is the length of the tangent $PT$?
  difficultyDimensions:
  - Recognize this is a tangent-secant problem where the secant passes through the center.
  - 'Determine outside segment: $PB = 8$.'
  - 'Determine whole secant: $PB + \text{diameter} = 8 + (5 \times 2) = 18$.'
  - 'Apply Tangent-Secant Theorem: $PT^2 = 8 \cdot 18$.'
  - 'Solve for $PT$: $PT^2 = 144 \implies PT = 12$.'
  choices:
  - id: a
    text: $104$
    issueSignals:
    - id: radius-diameter-confusion
      domains: []
  - id: b
    text: $12$
  - id: c
    text: $14.4$
    issueSignals:
    - id: addition-error
      domains: []
  - id: d
    text: $\sqrt{104}$
    issueSignals:
    - id: radius-diameter-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    We use the Tangent-Secant Theorem: $PT^2 = \text{outside} \times \text{whole}$.

    The outside segment of the secant is $PB = 8$.

    The whole secant is $PA$, which consists of $PB$ plus the diameter of the circle $AB$.

    Since the radius is 5, the diameter is 10.

    Whole secant $PA = 8 + 10 = 18$.

    $PT^2 = 8 \times 18$

    $PT^2 = 144$

    $PT = 12$.


    Why it works:

    When a secant passes through the center of the circle, the chord portion of the secant is exactly
    equal to the diameter. Always remember to double the radius before adding it to the outside segment!


    Why the other choices fail:

    - $104$ or $\sqrt{104}$ comes from using the radius instead of the diameter ($8 + 5 = 13$, then $8
    \times 13 = 104$).

    - $14.4$ might be from a math error.

    '
- id: q006
  type: multipleChoice
  prompt: Two intersecting chords in a circle have lengths of 10 and 12. The chord of length 10 is bisected
    by the other chord. What are the lengths of the two segments of the chord of length 12?
  difficultyDimensions:
  - Recognize the chord of length 10 is bisected, so its segments are 5 and 5.
  - 'Use intersecting chords theorem: $5 \cdot 5 = 25$.'
  - Let segments of the length 12 chord be $x$ and $12-x$.
  - 'Set up equation: $x(12-x) = 25$.'
  - 'Solve: $12x - x^2 = 25 \implies x^2 - 12x + 25 = 0$.'
  - 'Apply quadratic formula: $x = (12 \pm \sqrt{144 - 100}) / 2 = 6 \pm \sqrt{11}$.'
  choices:
  - id: a
    text: $6 + \sqrt{11}$ and $6 - \sqrt{11}$
  - id: b
    text: $8$ and $4$
    issueSignals:
    - id: guess-error
      domains: []
  - id: c
    text: $5$ and $7$
    issueSignals:
    - id: sum-error
      domains: []
  - id: d
    text: $6 + \sqrt{5}$ and $6 - \sqrt{5}$
    issueSignals:
    - id: quadratic-formula-error
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    The chord of length 10 is bisected, so its segments are 5 and 5.

    By the Intersecting Chords Theorem, the product of the segments of the second chord must equal the
    product of the segments of the first chord: $5 \times 5 = 25$.

    Let the segments of the second chord (length 12) be $x$ and $12-x$.

    $x(12 - x) = 25$

    $12x - x^2 = 25$

    $x^2 - 12x + 25 = 0$.

    Use the quadratic formula: $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$

    $x = \frac{12 \pm \sqrt{(-12)^2 - 4(1)(25)}}{2}$

    $x = \frac{12 \pm \sqrt{144 - 100}}{2} = \frac{12 \pm \sqrt{44}}{2}$

    $x = \frac{12 \pm 2\sqrt{11}}{2} = 6 \pm \sqrt{11}$.

    The two segments are $6 + \sqrt{11}$ and $6 - \sqrt{11}$.


    Why it works:

    Notice that if you add the two segments together, $(6 + \sqrt{11}) + (6 - \sqrt{11}) = 12$, which
    correctly matches the total length of the chord. If you multiply them, $(6 + \sqrt{11})(6 - \sqrt{11})
    = 36 - 11 = 25$, which matches the Power of a Point.


    Why the other choices fail:

    - $8$ and $4$ sum to 12, but their product is 32 (not 25).

    - $5$ and $7$ sum to 12, but their product is 35.

    - $6 \pm \sqrt{5}$ is a math error in the quadratic formula (e.g. failing to simplify $\sqrt{44}$
    properly).

    '
