questions:
- id: q001
  difficultyDimensions:
  - ModelOrDerivation
  - Simplification
  type: multipleChoice
  prompt: |
    Consider the standard Stress vs. Strain graph for a ductile material. Which of the following defines the "proportional limit"?
  choices:
  - id: a
    text: 'The point up to which stress and strain are directly proportional and Hooke''s law applies.'
  - id: b
    text: 'The absolute maximum stress the material can withstand before breaking entirely.'
  - id: c
    text: 'The point where the material begins to permanently deform, regardless of linearity.'
  - id: d
    text: 'The point where strain decreases even as stress increases.'
  answer:
    choiceId: a
  explanation: |
    Solution:
    The proportional limit is the end of the strictly linear region on the stress-strain curve.
    
    Why it works: Hooke's Law states that stress is directly proportional to strain, creating a straight line on the graph up to the proportional limit.
    
    Why the other choices fail: 
    - The maximum stress before breaking is the "ultimate tensile strength".
    - The point of permanent deformation is the "elastic limit" or "yield point" (which can be slightly past the proportional limit).
    - Strain never decreases while stress increases.
