  prompt: Find $T_3(x)$ for $f(x) = (1+x)^{-1/2}$ at $a=0$.
  explanation: 'Using binomial expansion: $T_3 = 1 - x/2 + 3x^2/8 - 5x^3/16$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.'
