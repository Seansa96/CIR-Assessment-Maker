questions:
- id: img-powerser-005
  concept: Maclaurin Series Substitution
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Find the Maclaurin series for $\sin(x^2)$.
  explanation: |-
    $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.
- id: img-powerser-030-v3
  concept: Interval of Convergence
  source: Power and Taylor Series/pset_6.png
  prompt: |-
    Find the interval of convergence of $\sum n! x^{2n}$.
  explanation: |-
    $R=0$. IOC: $\{0\}$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $R=0$. IOC: $\{0\}$.
- id: img-powerser-011-v1
  concept: Maclaurin Series Derivatives
  source: Power and Taylor Series/pset_3.png
  prompt: |-
    Find $f^{(6)}(0)$ if $f(x) = e^{x^2}$.
  explanation: |-
    $e^{x^2} = \sum x^{2n}/n!$. Coeff of $x^6$ ($n=3$): $1/3!$. $f^{(6)}(0) = 6!/3! = 120$.
  type: numericResponse
  answer:
    value: 120
    tolerance: 0.0001
- id: img-powerser-008-v3
  concept: Integration of Series
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Use a series to estimate $\int_0^{0.2} \cos(x^2) \, dx$ to 5 decimal places.
  explanation: |
    $\cos(x^2)=1-x^4/2+\cdots$.
    Integrating from 0 to 0.2 gives approximately $0.20000$.
  type: numericResponse
  answer:
    value: 0.1999968
    tolerance: 0.00001
- id: img-powerser-004-v2
  concept: Taylor Polynomials
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Find $T_3(x)$ for $f(x) = (1+x)^{-1/2}$ at $a=0$.
  explanation: |-
    Using binomial expansion: $T_3 = 1 - x/2 + 3x^2/8 - 5x^3/16$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Using binomial expansion: $T_3 = 1 - x/2 + 3x^2/8 - 5x^3/16$.
- id: img-powerser-036-v3
  concept: Differentiation of Series
  source: Power and Taylor Series/pset_7.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty \frac{n+1}{5^n}$.
  explanation: |-
    At $x=1/5$: $1/(4/5)^2 = 25/16$.
  type: numericResponse
  answer:
    value: 1.5625
    tolerance: 0.0001
- id: img-powerser-048-v1
  concept: Recognizing Series Sums
  source: Power and Taylor Series/pset_10.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty \frac{(-1)^n}{3^{n+1/2}(2n+1)}$.
  explanation: |
    Substitute $x=1/\sqrt{3}$ into the arctangent series. The sum is $\pi/6$.
  type: symbolicResponse
  answer:
    expectedLatex: pi/6
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
- id: img-powerser-033-v3
  concept: Integration of Series
  source: Power and Taylor Series/pset_7.png
  prompt: |-
    Find $\sum_{n=0}^\infty \frac{x^{n+2}}{n+1}$.
  explanation: |-
    $= x \sum \frac{x^{n+1}}{n+1} = -x \ln(1-x)$.
  type: symbolicResponse
  answer:
    expectedLatex: -x*ln(1-x)
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.000001
- id: img-powerser-021-v1
  concept: Recognizing Series Sums
  source: Power and Taylor Series/pset_5.png
  prompt: |-
    Find the sum $\sum_{n=0}^\infty \frac{(-1)^n \pi^{2n+1}}{3^{2n+1}(2n+1)!}$.
  explanation: |-
    $\sin(\pi/3) = \sqrt{3}/2$.
  type: symbolicResponse
  answer:
    expectedLatex: sqrt(3)/2
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
- id: img-powerser-049
  concept: Division of Series
  source: Power and Taylor Series/pset_10.png
  prompt: |-
    Find the full Maclaurin series for $\sec x$ up to the $x^6$ term by long division of $\cos x$ into 1.
  explanation: |-
    $\cos x = 1 - x^2/2 + x^4/24 - x^6/720 + \cdots$. Divide: $\sec x = 1 + x^2/2 + 5x^4/24 + 61x^6/720 + \cdots$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $\cos x = 1 - x^2/2 + x^4/24 - x^6/720 + \cdots$. Divide: $\sec x = 1 + x^2/2 + 5x^4/24 + 61x^6/720 + \cdots$.
- id: img-powerser-049-v2
  concept: Division of Series
  source: Power and Taylor Series/pset_10.png
  prompt: |-
    Find the Maclaurin series for $\tan x$ up to $x^5$.
  explanation: |-
    $\sin x / \cos x = (x - x^3/6 + x^5/120)/(1 - x^2/2 + x^4/24) = x + x^3/3 + 2x^5/15$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $\sin x / \cos x = (x - x^3/6 + x^5/120)/(1 - x^2/2 + x^4/24) = x + x^3/3 + 2x^5/15$.
- id: img-powerser-019
  concept: Integration of Series
  source: Power and Taylor Series/pset_4.png
  prompt: |-
    Find the power series for $\int_0^x e^{-t^2} dt$.
  explanation: |-
    $e^{-t^2} = \sum (-1)^n t^{2n}/n!$. $\int_0^x e^{-t^2} dt = \sum \frac{(-1)^n x^{2n+1}}{n!(2n+1)}$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $e^{-t^2} = \sum (-1)^n t^{2n}/n!$. $\int_0^x e^{-t^2} dt = \sum \frac{(-1)^n x^{2n+1}}{n!(2n+1)}$.
- id: img-powerser-013
  concept: Differentiation of Series
  source: Power and Taylor Series/pset_3.png
  prompt: |-
    Find the sum $\sum_{n=1}^\infty \frac{n}{4^n}$.
  explanation: |-
    $\sum nx^n = x/(1-x)^2$ at $x=1/4$: $(1/4)/(3/4)^2 = 4/9$.
  type: numericResponse
  answer:
    value: 0.4444444444444444
    tolerance: 0.0001
- id: img-powerser-039
  concept: Interval of Convergence
  source: Power and Taylor Series/pset_8.png
  prompt: |-
    Find the interval of convergence of $\sum \frac{(2x)^n}{n^2}$.
  explanation: |-
    $R=1/2$. At $x=1/2$: $\sum 1/n^2$ converges. At $x=-1/2$: $\sum (-1)^n/n^2$ converges. IOC: $[-1/2, 1/2]$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $R=1/2$. At $x=1/2$: $\sum 1/n^2$ converges. At $x=-1/2$: $\sum (-1)^n/n^2$ converges. IOC: $[-1/2, 1/2]$.
- id: img-powerser-022-v1
  concept: Taylor Polynomials
  source: Power and Taylor Series/pset_5.png
  prompt: |-
    Find $T_3(x)$ for $\ln x$ at $a=2$.
  explanation: |-
    $f=\ln 2, f'=1/2, f''=-1/4, f'''=2/8=1/4$. $T_3 = \ln 2 + \frac{(x-2)}{2} - \frac{(x-2)^2}{8} + \frac{(x-2)^3}{24}$.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $f=\ln 2, f'=1/2, f''=-1/4, f'''=2/8=1/4$. $T_3 = \ln 2 + \frac{(x-2)}{2} - \frac{(x-2)^2}{8} + \frac{(x-2)^3}{24}$.
