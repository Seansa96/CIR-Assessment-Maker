- id: img-powerser-005
  concept: Maclaurin Series Substitution
  source: Power and Taylor Series/pset_2.png
  prompt: |-
    Find the Maclaurin series for $\sin(x^2)$.
  explanation: |-
    Solution: $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain. Therefore the answer is $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.. Therefore the answer is $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.. Therefore the answer is $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$..

    Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

    Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.
