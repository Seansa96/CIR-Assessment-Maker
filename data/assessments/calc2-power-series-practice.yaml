- id: img-powerser-011-v1
  concept: Maclaurin Series Derivatives
  source: Power and Taylor Series/pset_3.png
  prompt: Find $f^{(6)}(0)$ if $f(x) = e^{x^2}$.
  explanation: '$e^{x^2} = \sum x^{2n}/n!$. Coeff of $x^6$ ($n=3$): $1/3!$. $f^{(6)}(0) = 6!/3! = 120$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.'
  type: numericResponse
  answer:
    value: 120
    tolerance: 0.0001
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: img-powerser-008-v3
  concept: Integration of Series
  source: Power and Taylor Series/pset_2.png
  prompt: Use a series to estimate $\int_0^{0.2} \cos(x^2) \, dx$ to 5 decimal places.
  explanation: |
    $\cos(x^2)=1-x^4/2+\cdots$. Integrating from $0$ to $0.2$ gives approximately $0.20000$.

    State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.
  type: numericResponse
  answer:
    value: 0.1999968
    tolerance: 0.00001
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
