questions:
- id: img-powerser-005
  concept: Maclaurin Series Substitution
  source: Power and Taylor Series/pset_2.png
  prompt: Find the Maclaurin series for $\sin(x^2)$.
  explanation: $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: $\sin(x^2) = \sum \frac{(-1)^n (x^2)^{2n+1}}{(2n+1)!} = \sum \frac{(-1)^n x^{4n+2}}{(2n+1)!}$.
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
  - calc2-obj-power-series-representations
- id: img-powerser-030-v3
  concept: Interval of Convergence
  source: Power and Taylor Series/pset_6.png
  prompt: Find the interval of convergence of $\sum n! x^{2n}$.
  explanation: '$R=0$. IOC: $\{0\}$. State the interval or convergence condition with the result; a formally correct transformed series is not usable outside its valid domain.'
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: '$R=0$. IOC: $\{0\}$.'
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  - domainCondition
  difficultyEvidence: The item requires selecting a representation, performing a nontrivial series operation, and checking the interval or condition under which the representation is valid.
  prerequisiteObjectiveIds:
