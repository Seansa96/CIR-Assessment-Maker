- id: we001
  title: Particle in a Double-Well Potential
  problem: 'One of the most powerful tools in Physics is the Potential Energy Curve
    $U(x)$. By simply looking at the shape of the potential energy graph, we can predict
    turning points, identify stable and unstable equilibrium, and determine maximum
    kinetic energy.


    Consider a $0.50\ \text{kg}$ particle moving along the $x$-axis. The particle
    is subject to a conservative force whose potential energy $U(x)$ is given by the
    graph below. The particle has a total mechanical energy $E = 2.0\ \text{J}$, represented
    by the dashed red line.


    ![Potential Energy Curve](/samples/physics-potential-energy-curve.png)


    Determine the turning points, maximum speed in the right well, and identify the
    equilibrium points.

    '
  steps:
  - id: step-we001-1
    title: Identify Allowed Regions and Turning Points
    instruction: 'The total energy is $E = U(x) + K(x)$. Since kinetic energy $K =
      \frac{1}{2}mv^2$ must be non-negative ($K \ge 0$), the particle can only exist
      in regions where $E \ge U(x)$.


      Look at the graph. The particle''s total energy $E = 2.0\ \text{J}$ intersects
      the $U(x)$ curve at four points: $x = -2.0$, $x = -1.0$, $x = 1.0$, and $x =
      2.0$. These are the **turning points**.


      If the particle starts at $x = 1.5\ \text{m}$, it is trapped in the right potential
      "well", oscillating between $1.0\ \text{m}$ and $2.0\ \text{m}$.

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution: The intersections where $E=U$ are turning points; allowed regions have $E\ge U$.

      Why it works: Kinetic energy is $K=E-U$ and cannot be negative.
  - id: step-we001-2
    title: Find Maximum Kinetic Energy and Speed
    instruction: 'Kinetic energy is the difference between total energy and potential
      energy: $K(x) = E - U(x)$. Graphically, this is the vertical distance between
      the\rhorizontal energy line and the curve.


      To find the *maximum* speed, we must find the point where $U(x)$ is a *minimum*.
      Looking at the right-hand well (between $x=1$ and $x=2$), the minimum potential
      energy occurs at a\approximately $x \a\approx 1.58\ \text{m}$, where $U \a\approx
      -0.25\ \text{J}$ (the lowest green dot).


      Using $K = E - U$:

      $$K_{\text{max}} = 2.0\ \text{J} - (-0.25\ \text{J}) = 2.25\ \text{J}.$$


      Now solve for speed:

      $$K_{\text{max}} = \frac{1}{2}mv_{\text{max}}^2$$

      $$2.25 = \frac{1}{2}(0.50)v_{\text{max}}^2$$

      $$2.25 = 0.25 v_{\text{max}}^2$$

      $$v_{\text{max}}^2 = 9.0 \implies v_{\text{max}} = 3.0\ \text{m/s}$$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution: In the right well, $K_{max}=2.25$ J and $v_{max}=3.0$ m/s.

      Why it works: Speed is largest where potential energy is smallest for fixed total energy.
  - id: step-we001-3
    title: Identify Equilibrium Points
    instruction: 'Equilibrium occurs where the net force is zero. Since $F_x = -\frac{dU}{dx}$,
      equilibrium points are simply the peaks and valleys (where the slope is zero)
      on the $U(x)$ graph. The green dots on the graph mark these points.


      - **Stable Equilibrium (Valleys):** If displaced slightly, the force pushes
      it back toward equilibrium.

      - **Unstable Equilibrium (Peaks):** If displaced slightly, the force pushes
      it away from equilibrium.


      At $x = 0$, the slope is zero so $F_x = 0$. Because it''s a local maximum (a
      peak), any slight displacement accelerates the particle away from $x = 0$. Therefore,
      it is an **unstable equilibrium**. The valleys at $x \a\approx \pm 1.58$ are **stable
      equilibrium** points.

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: |
      Solution: The local maximum at $x=0$ is unstable; local minima are stable.

      Why it works: $F=-dU/dx$ points toward a potential minimum and away from a maximum.

- id: we002
  title: Find Turning Points from a Spring Potential
  problem: A 0.50 kg glider moves on a frictionless track attached to a spring with $k=8.0$ N/m. Its total mechanical energy is 4.0 J. Find the magnitude of its turning-point displacement.
  steps:
  - id: curve-step-1
    title: Apply the turning-point condition
    instruction: At a turning point, speed is zero.
    type: symbolicResponse
    prompt: What equation relates total energy and displacement at a turning point?
    answer: { gradingMode: auto, expectedLatex: '\\frac{1}{2}kx^2=E', equivalenceMode: expression, tolerance: 0 }
    explanation: |
      Solution: $\tfrac12kx^2=E$.

      Why it works: At the turning point $K=0$, so all mechanical energy is spring potential energy.
  - id: curve-step-2
    title: Solve for displacement
    instruction: Use $k=8.0$ N/m and $E=4.0$ J.
    type: numericResponse
    prompt: What is $|x|$ in m?
    choices: []
    answer: { value: 1.0, tolerance: 0.001 }
    explanation: |
      Solution: $x=\sqrt{2E/k}=\sqrt{8.0/8.0}=1.0$ m.

      Why it works: The two turning points are symmetrically located at $x=\pm1.0$ m.
