- ec-simple-resistive
workedExamples:
- id: we1
  title: Finding Equivalent Resistance
  steps:
  - id: step1
    prompt: Calculate parallel equivalent.
    instruction: $R_p = (10 \cdot 40) / (10 + 40) = 400 / 50 = 8\Omega$.
    title: Calculate parallel equivalent.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  - id: step2
    prompt: Calculate total series resistance.
    instruction: $R_{eq} = 8\Omega + 12\Omega = 20\Omega$.
    title: Calculate total series resistance.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: Find the equivalent resistance of a $10\Omega$ and $40\Omega$ resistor
    in parallel, which are in series with a $12\Omega$ resistor.
