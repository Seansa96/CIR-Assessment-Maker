schemaVersion: 1
id: css-typography-quiz
title: Typography Quiz
assessmentType: quiz
categoryId: css
subcategoryIds:
  - css-typography
modeDefault: study
randomizeQuestions: true
questions:
  - id: q-fallback
    title: Fallback Fonts
    content: |
      You are importing a custom web font called 'Outfit', but you want to ensure the browser falls back to the system's default sans-serif font if 'Outfit' fails to load.
    check:
      id: check-fallback
      type: freeResponse
      prompt: "Write the exact CSS property and value to achieve this:"
      answer:
        gradingMode: exactMatch
        exactMatch: "font-family: 'Outfit', sans-serif;"
      explanation: |
        The `font-family` property accepts a comma-separated list. If the first font isn't available, the browser moves to the next.

  - id: q-rem
    title: REM Math
    content: |
      If the browser's default root font size is 16px, you set `html { font-size: 100%; }` and a paragraph to `font-size: 1.25rem`.
    check:
      id: check-rem
      type: multipleChoice
      prompt: "What is the computed physical size of the paragraph text in pixels?"
      choices:
        - id: a
          text: 16px
        - id: b
          text: 20px
        - id: c
          text: 24px
      answer:
        choiceId: b
      explanation: |
        1.25 * 16px = 20px. `rem` makes mental math easier while maintaining accessibility scaling!
