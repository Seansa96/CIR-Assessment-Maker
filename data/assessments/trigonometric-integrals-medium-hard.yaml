- id: q008
  type: symbolicResponse
  issueSignals:
  - id: integration-by-parts-misapplied
  - id: partial-fraction-decomposition-error
  - id: trigonometric-substitution-error
  - id: exponent-rule-misapplied
  - id: logarithm-property-misapplied
  - id: trigonometric-identity-misapplied
  prompt: 'Evaluate the integral.


    $$

    \int \sec^3 x\,dx

    $$

    '
  answer:
    expectedLatex: \frac{1}{2}\sec x\tan x+\frac{1}{2}\ln|\sec x+\tan x|+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'This standard result follows from integration by parts and the basic
    secant integral. Separate the $\sec^3 x$ as $\sec x\cdot \sec^2 x$ and let $u=\sec
    x$.


    Related topic: Secant Cubed Integral

    '
