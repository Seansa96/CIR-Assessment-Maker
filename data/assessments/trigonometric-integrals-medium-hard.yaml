  - id: exponent-rule-misapplied
  - id: logarithm-property-misapplied
  - id: trigonometric-identity-misapplied
  prompt: 'Evaluate the integral.


    $$

    \int \tan^3 x\,dx

    $$

    '
  answer:
    expectedLatex: \frac{\tan^2 x}{2}+\ln|\cos x|+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
