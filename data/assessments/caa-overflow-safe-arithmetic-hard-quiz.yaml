questions:
- id: q001
  title: Opposite Sign
  type: multipleChoice
  prompt: Why does adding signed values of opposite signs not overflow in the same way as same-sign addition?
  choices:
  - id: a
    text: The magnitude of the result moves between the operands rather than beyond both bounds.
  - id: b
    text: Opposite signs disable fixed-width limits.
  - id: c
    text: The CPU uses floating-point.
  - id: d
    text: The carry flag is always zero.
  answer:
    choiceId: a
  explanation: Overflow requires exceeding the signed range.
- id: q002
  title: Saturate High
  type: numericResponse
  prompt: In signed 8-bit saturating arithmetic, what should `120 + 20` return?
  answer:
    value: 127
    tolerance: 0
  explanation: The mathematical result exceeds 127, so it clamps high.
- id: q003
  title: Average Safety
  type: freeResponse
  prompt: Explain why `a + (b - a) / 2` can be safer than `(a + b) / 2` when `a <= b`.
  answer:
    expected: It avoids forming the potentially overflowing sum `a + b`; it computes the distance first and adds half of that distance to the lower endpoint.
    gradingMode: selfCheck
    keyPoints:
    - Avoids sum overflow
    - Uses distance
    - Requires assumption such as a <= b
  explanation: The algebraic result is similar, but the intermediate range is different.
- id: q004
  title: Assumption Check
  type: multipleChoice
  prompt: Which assumption should be written down before trusting a hard bit-level transformation?
  choices:
  - id: a
    text: Word width, signedness, and edge-case behavior
  - id: b
    text: Only the final decimal answer
  - id: c
    text: The number of comments
  - id: d
    text: The file extension
  answer:
    choiceId: a
  explanation: These transformations are representation-sensitive.
- id: q005
  title: Invariant Check
  type: multipleChoice
  prompt: What makes a bit trick explainable rather than magical?
  choices:
  - id: a
    text: A clear invariant that stays true through the transformation
  - id: b
    text: A shorter variable name
  - id: c
    text: Using only decimal numbers
  - id: d
    text: Avoiding all tests
  answer:
    choiceId: a
  explanation: An invariant explains why the result remains correct.
- id: q006
  title: Low Mask Challenge
  type: numericResponse
  prompt: What is the decimal value of `(1 << 6) - 1`?
  answer:
    value: 63
    tolerance: 0
  explanation: Six low bits set gives binary `111111`, which is 63.
- id: q007
  title: Power-of-Two Pattern
  type: multipleChoice
  prompt: Which 8-bit value is positive and has exactly one set bit?
  choices:
  - id: a
    text: '`01000000`'
  - id: b
    text: '`01100000`'
  - id: c
    text: '`00000000`'
  - id: d
    text: '`01111111`'
  answer:
    choiceId: a
  explanation: A positive power of two has one set bit.
- id: q008
  title: Testing Strategy
  type: freeResponse
  prompt: Describe a compact testing strategy for a bit-level algorithm.
  answer:
    expected: Test zero, one or more exact powers of two, all-ones or maximum values, sign boundaries when signed values are involved, and at least one ordinary middle value.
    gradingMode: selfCheck
    keyPoints:
    - Zero
    - Boundary values
    - Ordinary middle value
  explanation: This catches both boundary and normal behavior.
- id: q009
  title: Code Review Habit
  type: freeResponse
  prompt: What should a code review ask about a low-level arithmetic optimization?
  answer:
    expected: It should ask what assumptions make the transformation valid, what happens at overflow or boundary inputs, and whether the optimized form is clearer or properly documented.
    gradingMode: selfCheck
    keyPoints:
    - Assumptions
    - Overflow/boundaries
    - Clarity or documentation
  explanation: Low-level speedups need a correctness story.
- id: q010
  title: Mask Isolation
  type: multipleChoice
  prompt: Which operation usually extracts only the bits selected by `mask`?
  choices:
  - id: a
    text: '`x & mask`'
  - id: b
    text: '`x | mask`'
  - id: c
    text: '`x ^ 0`'
  - id: d
    text: '`x << mask`'
  answer:
    choiceId: a
  explanation: AND with a mask keeps selected bits.
