questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - formula-application
  prompt: A heater element operates at $120\text{ V}$ and draws a current of $15\text{
    A}$. What is the resistance of the heater (in Ohms)?
  answer:
    numericValue: 8.0
    tolerance: 0.1
  explanation: 'Solution:

    1) Use the definition of resistance: $R = V/I$.

    2) Substitute values: $R = 120 / 15$.

    3) Calculate: $R = 8.0\text{ }\Omega$.


    Why it works:

    By Ohm''s Law, the resistance determines how much current flows for a given applied
    voltage.'
