- id: q001
  type: freeResponse
  skills:
  - physics2-ch09-modeling
  prompt: A Current and Resistance situation emphasizes electric current. Define the system and sign convention,
    state when $V=IR$ applies, and construct a written solution that includes the relation, units, assumptions,
    and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $V=IR$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Current and Resistance model of charge transport in materials is reliable only when its relation,
    conditions, and interpretation are kept together.'
