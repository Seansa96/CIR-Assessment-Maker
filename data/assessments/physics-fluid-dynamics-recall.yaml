items:
  - { id: fr1, type: cloze, prompt: 'Complete: $Q=A\underline{\hspace{0.7cm}}$.', answer: { expected: v, expectedLatex: 'v', aliases: [velocity, speed], media: [] }, explanation: 'Solution: Insert $v$.\n\nWhy it works: Flow rate equals area times speed.', tags: [continuity] }
  - { id: fr2, type: cloze, prompt: 'Complete: $A_1v_1=A_2\underline{\hspace{0.7cm}}$.', answer: { expected: v_2, expectedLatex: 'v_2', aliases: [], media: [] }, explanation: 'Solution: Insert $v_2$.\n\nWhy it works: Incompressible continuity conserves volume flow rate.', tags: [continuity] }
  - { id: fr3, type: typed, prompt: 'What equation relates pressure, speed, and height along an ideal-fluid streamline?', answer: { expected: 'Bernoulli equation', expectedLatex: '', aliases: [Bernoulli], media: [] }, explanation: 'Solution: It is the Bernoulli equation.\n\nWhy it works: It expresses energy conservation for ideal flow.', tags: [bernoulli] }
  - { id: fr4, type: typed, prompt: 'What property is assumed absent in an ideal non-viscous fluid?', answer: { expected: viscosity, expectedLatex: '', aliases: [friction], media: [] }, explanation: 'Solution: The property is viscosity.\n\nWhy it works: Ideal-fluid flow neglects internal friction.', tags: [model] }
  - { id: fr5, type: cloze, prompt: 'The SI unit of pressure is the ____.', answer: { expected: pascal, expectedLatex: '', aliases: [Pa], media: [] }, explanation: 'Solution: The word is pascal.\n\nWhy it works: A pascal is one newton per square meter.', tags: [units] }
  - { id: fr6, type: typed, prompt: 'In a horizontal Venturi constriction, pressure is higher upstream or at the narrow fast section?', answer: { expected: upstream, expectedLatex: '', aliases: ['wide section'], media: [] }, explanation: 'Solution: It is higher upstream.\n\nWhy it works: The narrow section has higher speed and lower pressure.', tags: [bernoulli] }
