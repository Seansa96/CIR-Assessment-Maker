questions:
  - { id: q001, type: symbolicResponse, prompt: 'The region bounded by $y=x^2$, $y=4$, and $x=0$ is rotated about the x-axis. Find its volume.', answer: { expectedLatex: '128\pi/5', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The curves meet at $x=2$. A vertical slice gives an outer radius $R=4$ and inner radius $r=x^2$, so $V=\pi\int_0^2(16-x^4)dx=\pi[16x-x^5/5]_0^2=128\pi/5$. Why it works: The region does not touch the axis, so each perpendicular slice makes a washer. Common trap: $4-x^2$ is a vertical height, not a washer area. ', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Finds a curve intersection, distinguishes a hole from a disk, and integrates a fourth-power radius expression.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q002, type: symbolicResponse, prompt: 'The base is bounded by $y=x$ and $y=4-x$ on $0\le x\le2$. Cross sections perpendicular to the x-axis are squares. Find the volume.', answer: { expectedLatex: '32/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The square side is the base width $s=(4-x)-x=4-2x$. Thus $V=\int_0^2(4-2x)^2dx=\int_0^2(16-16x+4x^2)dx=32/3$. Why it works: A square with side $s$ has area $s^2$, which is then accumulated through thickness $dx$. Common trap: Do not integrate the width alone; width is not cross-sectional area.', difficultyDimensions: [modelOrDerivation, identityConstruction, auxiliaryTechnique], difficultyEvidence: 'Builds a changing width, transforms it into an area formula, and expands before integrating.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q003, type: symbolicResponse, prompt: 'Rotate the region between $y=x^2$ and $y=4$ for $0\le x\le2$ about $y=5$. Find the volume.', answer: { expectedLatex: '416\pi/15', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The axis is above the region. The outer radius is $5-x^2$ and the inner radius is $5-4=1$. Hence $V=\pi\int_0^2[(5-x^2)^2-1]dx=\pi\int_0^2(24-10x^2+x^4)dx=416\pi/15$. Why it works: Radii are distances to the actual axis $y=5$, not graph heights to the x-axis. Common trap: Reversing outer and inner radii produces a negative area.', difficultyDimensions: [representationTransfer, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Uses an offset axis, determines which distance is outer, and expands a squared expression.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q004, type: symbolicResponse, prompt: 'The base is the semicircle $x^2+y^2\le4$ above the x-axis. Cross sections perpendicular to the x-axis are equilateral triangles. Find the volume.', answer: { expectedLatex: '8\sqrt{3}/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: At $x$, the vertical chord has length $s=\sqrt{4-x^2}$. An equilateral triangle has area $A=\sqrt{3}s^2/4=\sqrt{3}(4-x^2)/4$. Therefore $V=\frac{\sqrt{3}}4[x(4-x^2/3)]_{-2}^2=8\sqrt{3}/3$. Why it works: The chord is the triangle side; squaring it removes the radical before integration. Common trap: The semicircle boundary $y=\sqrt{4-x^2}$ is only half the chord.', difficultyDimensions: [representationTransfer, modelOrDerivation, simplification], difficultyEvidence: 'Transfers a two-dimensional chord into a triangle side, applies a shape formula, and exploits radical cancellation.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q005, type: symbolicResponse, prompt: 'The region under $y=\sqrt{x}$ on $0\le x\le4$ rotates about the y-axis. Use horizontal washers to find the volume.', answer: { expectedLatex: '128\pi/5', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Rewrite the curve as $x=y^2$ with $0\le y\le2$. A horizontal slice runs from $x=y^2$ to $x=4$, so it forms a washer with $R=4$ and $r=y^2$. $V=\pi\int_0^2(16-y^4)dy=128\pi/5$. Why it works: A horizontal slice is perpendicular to the y-axis, so it creates a washer. Common trap: Vertical slices here make shells, not washers.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Requires inversion, a variable change for the bounds, and a slice-orientation decision.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q006, type: symbolicResponse, prompt: 'Find the volume obtained by rotating the region between $y=x$ and $y=2x$ on $0\le x\le1$ about $y=3$.', answer: { expectedLatex: '2\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Distances to $y=3$ are $R=3-x$ and $r=3-2x$ because $x\le1$. Thus $V=\pi\int_0^1[(3-x)^2-(3-2x)^2]dx=\pi\int_0^1(6x-3x^2)dx=2\pi$. Why it works: The lower curve is farther from an axis above both curves, so it is the outer radius. Common trap: Calling $3-2x$ outer reverses the washer area.', difficultyDimensions: [representationTransfer, reverseReasoning, auxiliaryTechnique], difficultyEvidence: 'Compares two offset distances, reverses the usual upper/lower intuition, and simplifies a difference of squares.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q007, type: symbolicResponse, prompt: 'The base is bounded by $y=0$, $y=x$, and $x=2$. Cross sections perpendicular to the y-axis are squares. Find the volume.', answer: { expectedLatex: '8/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Use horizontal slices. For $0\le y\le2$, the slice runs from $x=y$ to $x=2$, so square side $s=2-y$. $V=\int_0^2(2-y)^2dy=[(2-y)^3/-3]_0^2=8/3$. Why it works: Perpendicular to the y-axis means the cross-sectional thickness is $dy$. Common trap: Using $2-x$ with $dx$ describes a different family of slices.', difficultyDimensions: [representationTransfer, modelOrDerivation, domainCondition], difficultyEvidence: 'Chooses the required orientation, rewrites a boundary as x in terms of y, and uses y-bounds.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q008, type: freeResponse, prompt: 'A student writes $V=\\pi\\int_0^4(4-x^2)^2dx$ for rotating the region between $y=x^2$ and $y=4$ about the x-axis. Diagnose the error and give the correct model.', answer: { gradingMode: selfCheck, keyPoints: ['outer radius is 4', 'inner radius is x squared', 'pi integral from zero to two of sixteen minus x to the fourth'] }, explanation: 'Solution: The student squared a vertical height. The rotated region has a hole, so the correct setup is $V=\\pi\\int_0^2[4^2-(x^2)^2]dx$. Why it works: A washer area subtracts the inner circular area from the outer one. Common trap: The bounds are $0$ to $2$, not $0$ to $4$; $4$ is a y-value and the intersection occurs at x=2.', difficultyDimensions: [errorDiagnosis, reverseReasoning, modelOrDerivation], difficultyEvidence: 'Reconstructs geometry from an incorrect formula, distinguishes bounds from radii, and repairs a washer model.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q009, type: symbolicResponse, prompt: 'A base has vertical width $w(x)=2\sqrt{x}$ on $0\le x\le4$. Its perpendicular cross sections are semicircles with diameter $w(x)$. Find the volume.', answer: { expectedLatex: '4\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is $r=w/2=\sqrt{x}$. A semicircle area is $A=\pi r^2/2=\pi x/2$. Thus $V=\int_0^4\pi x/2\,dx=4\pi$. Why it works: The supplied width is a diameter, so it must be halved before using a circle-area formula. Common trap: Using $\pi w^2/2$ incorrectly treats the diameter as a radius.', difficultyDimensions: [modelOrDerivation, simplification, auxiliaryTechnique], difficultyEvidence: 'Translates a width into a diameter/radius relation, simplifies a radical expression, and integrates the resulting area.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
  - { id: q010, type: symbolicResponse, prompt: 'A student asks for a washer setup with $dy$ to rotate the region bounded by $x=y^2$ and $x=4$ about the x-axis. Explain why that is invalid, then give a valid setup and the volume.', answer: { expectedLatex: '8\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Horizontal $dy$ slices are parallel to the x-axis, so they make shells rather than washers. A valid washer/disk model uses vertical $dx$ slices: the region runs from $y=-\sqrt{x}$ to $y=\sqrt{x}$, giving disk radius $R=\sqrt{x}$. Thus $V=\pi\int_0^4(\sqrt{x})^2dx=\pi\int_0^4x\,dx=8\pi$. Why it works: Slice orientation determines the solid type, so an invalid requested representation must be rejected. Common trap: Treating any $dy$ integral as a washer integral.', difficultyDimensions: [errorDiagnosis, representationTransfer, reverseReasoning], difficultyEvidence: 'Tests the feasibility of a requested representation, rejects an invalid method, and constructs a valid alternative.' , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: function-analysis-error }]}
