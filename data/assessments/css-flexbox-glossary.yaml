schemaVersion: 1
id: css-flexbox-glossary
title: CSS Flexbox Glossary
assessmentType: glossary
categoryId: css
subcategoryIds:
- css-layout-flexbox
modeDefault: practice
glossary:
  introduction: Review these terms for CSS Flexbox Glossary.
  sections:
  - id: main-terms
    title: Core Terms
    required: true
    entries:
    - id: flex-container
      term: Flex Container
      definition: 'The parent element with display: flex.'
      drills:
      - id: flex-container-drill
        type: typed
        prompt: 'What is the term for: The parent element with display: flex.?'
        answer:
          expected: Flex Container
          aliases:
          - flex container
        explanation: The term is Flex Container.
    - id: flex-item
      term: Flex Item
      definition: The direct children of a flex container.
      drills:
      - id: flex-item-drill
        type: typed
        prompt: 'What is the term for: The direct children of a flex container.?'
        answer:
          expected: Flex Item
          aliases:
          - flex item
        explanation: The term is Flex Item.
    - id: justify-content
      term: justify-content
      definition: Aligns flex items along the main axis.
      drills:
      - id: justify-content-drill
        type: typed
        prompt: 'What is the term for: Aligns flex items along the main axis.?'
        answer:
          expected: justify-content
          aliases:
          - justify-content
        explanation: The term is justify-content.
    - id: align-items
      term: align-items
      definition: Aligns flex items along the cross axis.
      drills:
      - id: align-items-drill
        type: typed
        prompt: 'What is the term for: Aligns flex items along the cross axis.?'
        answer:
          expected: align-items
          aliases:
          - align-items
        explanation: The term is align-items.
