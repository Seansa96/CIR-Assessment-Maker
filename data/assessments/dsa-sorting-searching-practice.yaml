  prompt: "**Binary Search**\n\nWrite a Python function `binary_search(arr, target)` that searches for\
    \ a `target` integer in a sorted array `arr`.\nIf the target exists, return its index. If it does\
    \ not exist, return `-1`.\n\nYou must achieve $O(\\log N)$ time complexity by using the standard two-pointer\
    \ (left and right) halving technique. Do not use Python's built-in `in` operator or `arr.index()`,\
    \ as those are $O(N)$.\n\n```python\ndef binary_search(arr, target):\n    # Your code here\n    pass\n\
    ```\n"
  answer:
    gradingMode: automatic
    codeLanguage: python
    testCases:
    - input: binary_search([1, 3, 5, 7, 9], 5)
      expectedOutput: '2'
    - input: binary_search([1, 3, 5, 7, 9], 1)
      expectedOutput: '0'
    - input: binary_search([1, 3, 5, 7, 9], 9)
      expectedOutput: '4'
    - input: binary_search([1, 3, 5, 7, 9], 4)
      expectedOutput: '-1'
    - input: binary_search([], 5)
      expectedOutput: '-1'
  explanation: "Solution:\n```python\ndef binary_search(arr, target):\n    left = 0\n    right = len(arr)\
    \ - 1\n    \n    while left <= right:\n        mid = (left + right) // 2\n        \n        if arr[mid]\
    \ == target:\n            return mid\n        elif arr[mid] < target:\n            left = mid + 1\n\
    \        else:\n            right = mid - 1\n            \n    return -1\n```\n\nWhy it works:\nThe\
    \ algorithm maintains a search window defined by `left` and `right` indices. By checking the `mid`\
    \ element, we can immediately discard half of the remaining array because the array is sorted. If\
    \ `arr[mid]` is too small, the target must be to the right (`left = mid + 1`). If it's too large,\
    \ the target must be to the left (`right = mid - 1`). If the pointers cross (`left > right`), the\
    \ target is not in the array.\n"
