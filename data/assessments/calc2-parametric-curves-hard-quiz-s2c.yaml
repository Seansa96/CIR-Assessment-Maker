questions:
  - { id: q001, type: freeResponse, prompt: 'For $x=t^2-1,y=t(t^2-1)$, determine the Cartesian locus, its x restriction, and which branch is traced for $t\ge0$.', answer: { gradingMode: selfCheck, keyPoints: ['y squared equals x squared times x plus one', 'x at least negative one', 't nonnegative selects y sign matching x plus one'] }, explanation: 'Solution: x plus one equals t squared and y equals t times x, so y squared equals x squared times x plus one; x is at least negative one. For t nonnegative, the sign of y matches x. Why it works: The parameter supplies both an invariant and a branch-selection rule. Common trap: Reporting the algebraic locus without the restriction or branch.', difficultyDimensions: [identityConstruction, domainCondition, representationTransfer], difficultyEvidence: 'Builds an invariant, retains a domain, and selects a branch from parameter sign.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
  - { id: q002, type: freeResponse, prompt: 'Explain why $x=\cos t,y=\sin t$ on $[0,4\pi]$ and on $[0,2\pi]$ have the same locus but cannot always be used interchangeably in an area calculation.', answer: { gradingMode: selfCheck, keyPoints: ['same circle', 'second traces twice', 'directed integral doubles', 'choose one traversal'] }, explanation: 'Solution: Both describe the unit circle, but the longer interval makes two complete traversals. A directed boundary integral therefore doubles, so choose a one-trace interval. Why it works: Line integrals depend on path multiplicity as well as the locus. Common trap: Treating a graph as sufficient evidence for an accumulation bound.', difficultyDimensions: [globalLocalReasoning, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Separates a geometric set from path multiplicity and its integral consequence.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-integrals] }
  - { id: q003, type: freeResponse, prompt: 'A student eliminates t from $x=t^2,y=t^2-4$ and graphs all of $y=x-4$. Diagnose the error and repair the graph description.', answer: { gradingMode: selfCheck, keyPoints: ['x equals t squared', 'x nonnegative', 'right half ray from zero negative four'] }, explanation: 'Solution: The relation y equals x minus 4 is correct, but x equals t squared forces x at least zero. The trace is the ray beginning at $(0,-4)$ and extending right. Why it works: Elimination can enlarge the trace unless its domain is retained. Common trap: Forgetting that a Cartesian relation need not be a complete parameterized path.', difficultyDimensions: [errorDiagnosis, domainCondition, representationTransfer], difficultyEvidence: 'Repairs an overgeneralized locus using a parameter-imposed restriction.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
  - { id: q004, type: freeResponse, prompt: '![Directed trace](/media/calculus/parametric-review-trace.svg) Describe a method to verify that a proposed parametrization matches both endpoints and orientation of a pictured curve.', answer: { gradingMode: selfCheck, keyPoints: ['evaluate endpoint parameter values', 'sample nearby increasing values', 'compare restrictions or monotonic coordinate', 'check no unintended retracing'] }, explanation: 'Solution: Evaluate both coordinate functions at proposed endpoint parameters, then sample nearby increasing values to compare the arrow direction; finally check the interval and repeated positions. Why it works: Position, local motion, and interval jointly define a trace. Common trap: Verifying only the Cartesian equation.', difficultyDimensions: [modelOrDerivation, representationTransfer, proofJustification], difficultyEvidence: 'Uses visual data, sampled parameters, and interval validation together.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
  - { id: q005, type: freeResponse, prompt: 'Compare $(\cos t,\sin t)$ and $(\sin t,\cos t)$ by giving each start point and initial direction.', answer: { gradingMode: selfCheck, keyPoints: ['first starts 1 comma 0 upward', 'second starts 0 comma 1 rightward or downward? derivative x cos 0=1 y derivative minus sin 0=0 so rightward', 'same circle different phase'] }, explanation: 'Solution: The first starts at $(1,0)$ and initially moves upward. The second starts at $(0,1)$ and initially moves rightward. Both have the unit-circle locus but different phase and trace data. Why it works: Evaluate position and nearby coordinate changes. Common trap: Calling them identical because their eliminated equation matches.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, globalLocalReasoning], difficultyEvidence: 'Compares two parameterizations through position, local derivative behavior, and common locus.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
  - { id: q006, type: freeResponse, prompt: 'For $x=\cos(3t),y=\sin(3t)$, derive a minimal interval for one trace and justify it.', answer: { gradingMode: selfCheck, keyPoints: ['three t advances by two pi', 'interval length two pi over three', 'one full angular revolution'] }, explanation: 'Solution: The angle is 3t. For it to advance by 2 pi, t must advance by $2\pi/3$, so $[0,2\pi/3]$ traces once. Why it works: The angular argument controls period. Common trap: Using the standard $0$ to $2\pi$ interval and tracing three times.', difficultyDimensions: [parameterThreshold, modelOrDerivation, globalLocalReasoning], difficultyEvidence: 'Solves an angular-period threshold and relates it to traversal multiplicity.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
  - { id: q007, type: freeResponse, prompt: 'Explain how negative parameter values affect the two branches of $x=t^2,y=t^3$.', answer: { gradingMode: selfCheck, keyPoints: ['x nonnegative always', 'negative t gives negative y', 'positive t gives positive y', 'origin joins branches'] }, explanation: 'Solution: x remains nonnegative. Negative t gives negative y and traces the lower branch toward the origin; positive t gives positive y and traces the upper branch away from it. Why it works: Odd and even powers respond differently to sign. Common trap: Assuming a square removes all branch information.', difficultyDimensions: [domainCondition, representationTransfer, casePartition], difficultyEvidence: 'Partitions the parameter domain and maps parity to separate branches.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
  - { id: q008, type: freeResponse, prompt: 'Give a parameterization of the upper semicircle $x^2+y^2=9$ that starts at $(-3,0)$ and ends at $(3,0)$, and justify the interval.', answer: { gradingMode: selfCheck, keyPoints: ['x negative three cosine t', 'y three sine t', 'zero to pi', 'starts negative three zero ends three zero upper y nonnegative'] }, explanation: 'Solution: Use $x=-3\cos t,y=3\sin t,0\le t\le\pi$. It starts at $(-3,0)$, has nonnegative y, and ends at $(3,0)$. Why it works: The sign on cosine sets the requested start while sine supplies the upper half. Common trap: Using the full circle interval.', difficultyDimensions: [modelOrDerivation, representationTransfer, domainCondition], difficultyEvidence: 'Constructs a phase-adjusted parameterization and proves endpoint/domain behavior.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
  - { id: q009, type: freeResponse, prompt: 'Explain why a table of parameter values is more reliable than a Cartesian equation alone when a curve may self-intersect.', answer: { gradingMode: selfCheck, keyPoints: ['ordered points', 'reveals repeated positions', 'reveals direction', 'isolates loops'] }, explanation: 'Solution: A table lists points in parameter order, revealing repeated positions, direction, and which interval encloses each loop. A Cartesian equation only lists the point set. Why it works: Self-intersection is a tracing question as well as a locus question. Common trap: Choosing a full period without checking individual loops.', difficultyDimensions: [representationTransfer, globalLocalReasoning, proofJustification], difficultyEvidence: 'Compares an unordered representation to an ordered tracing method.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-integrals] }
  - { id: q010, type: freeResponse, prompt: 'Write a concise validation checklist for a parametric graph before it is used in a derivative or integral problem.', answer: { gradingMode: selfCheck, keyPoints: ['point check', 'orientation check', 'restriction and interval check', 'retrace/self intersection check'] }, explanation: 'Solution: Verify a known point, sample direction for increasing parameter, retain restrictions and intended interval, and check for repeated paths or self-intersections. Why it works: These checks validate the model before later calculus builds on it. Common trap: Starting differentiation or integration from an unverified trace.', difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Performs a global model audit rather than one isolated computation.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-locus-orientation] }
