questions:
- id: q001
  type: multipleChoice
  prompt: 'A 2.0 kg block rests on a flat\rhorizontal board. The board is slowly tilted
    upwards. When the angle of inclination reaches 30°, the block begins to slide
    down the board. What is the coefficient of static friction ($\mu_s$) between the
    block and the board?

    '
  choices:
  - id: a
    text: 0.5
  - id: b
    text: 0.58
  - id: c
    text: 0.87
  - id: d
    text: 1.0
  answer:
    choiceId: b
  explanation: 'The block slips when the component of gravity down the incline equals
    the maximum static friction: $mg \sin\theta = \mu_s N = \mu_s mg \cos\theta$.
    Therefore, $\mu_s = \tan\theta = \tan(30^\circ) = \frac{1}{\sqrt{3}} \a\approx 0.577
    \a\approx 0.58$.

    '
- id: q002
  type: multipleChoice
  prompt: 'An unbanked curve has a radius of 60 m. If the coefficient of static friction
    between a car''s tires and the road is 0.60, what is the maximum speed the car
    can navigate the curve without slipping? ($g = 9.8$ m/s²).

    '
  choices:
  - id: a
    text: 35 m/s
  - id: b
    text: 19 m/s
  - id: c
    text: 24 m/s
  - id: d
    text: 12 m/s
  answer:
    choiceId: b
  explanation: '$f_s = m \frac{v^2}{r} \implies \mu_s mg = m \frac{v^2}{r} \implies
    v = \sqrt{\mu_s gr} = \sqrt{0.60 \times 9.8 \times 60} = \sqrt{352.8} \a\approx
    18.8$ m/s.

    '
- id: q003
  type: multipleChoice
  prompt: 'A mass $m$ hangs from a string attached to the ceiling of an elevator.
    The elevator is accelerating downward at $a = g/2$. The tension in the string
    is:

    '
  choices:
  - id: a
    text: $mg$
  - id: b
    text: $1.5mg$
  - id: c
    text: $0.5mg$
  - id: d
    text: Zero
  answer:
    choiceId: c
  explanation: "Taking down as positive (direction of acceleration): $\\sum F = mg\
    \ - T = ma$. \n$mg - T = m(g/2) \\implies T = mg - mg/2 = 0.5mg$.\n"
- id: q004
  type: multipleChoice
  prompt: 'Two blocks of mass $m_1 = 3$ kg and $m_2 = 2$ kg are connected by a light
    string passing over a frictionless pulley (an Atwood machine). What is the magnitude
    of the acceleration of the blocks? (Use $g = 9.8$ m/s²).

    '
  choices:
  - id: a
    text: 1.96 m/s²
  - id: b
    text: 3.92 m/s²
  - id: c
    text: 9.8 m/s²
  - id: d
    text: 5.88 m/s²
  answer:
    choiceId: a
  explanation: "The net force driving the system is the difference in weights: $F_{net}\
    \ = m_1g - m_2g = (3-2)(9.8) = 9.8$ N. The total mass being accelerated is $M\
    \ = m_1 + m_2 = 5$ kg. \n$a = \\frac{F_{net}}{M} = \\frac{9.8}{5} = 1.96$ m/s².\n"
- id: q005
  type: freeResponse
  prompt: 'Why does a heavier skydiver reach a higher terminal speed than a lighter
    skydiver of the same physical size?

    '
  answer:
    expected: 'The heavier skydiver has a greater weight.

      '
    gradingMode: selfCheck
  explanation: 'Terminal speed is reached when the upward drag force equals the downward
    weight ($F_D = mg$). Because the heavier skydiver has a larger $mg$, they must
    fall at a faster speed to generate a correspondingly larger drag force $F_D$ to
    balance their weight.

    '
