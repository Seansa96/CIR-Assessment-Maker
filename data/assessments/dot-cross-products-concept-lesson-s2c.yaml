  - id: s05
    title: Connect cross product to area
    required: true
    content: The magnitude of a cross product is the area of the parallelogram spanned by its input vectors.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: What geometric quantity is $|\mathbf u\times\mathbf v|$?
      choices:
      - id: a
        text: parallelogram area
        media: []
        issueSignals: []
      - id: b
        text: triangle area
        media: []
        issueSignals:
        - id: cross-product-area-error
          domains: []
      - id: c
