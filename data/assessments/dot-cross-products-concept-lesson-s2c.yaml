  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Trigonometry → Unit Circle Trigonometry if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Dot products compare directions
    required: true
    content: 'The dot product is scalar and detects perpendicularity or supplies an angle/projection. In Dot and Cross Products, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
