  - id: s02
    title: Cross products build normals
    required: true
    content: The cross product is a vector perpendicular to both inputs; order controls orientation. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
