schemaVersion: 1
id: dot-cross-products-concept-lesson-s2c
title: 'Dot and Cross Products: Core Ideas'
assessmentType: conceptLesson
categoryId: calculus-3
topicId: calc3-dot-cross-products
modeDefault: practice
randomizeQuestions: false
skills: [dot-cross-products]
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [calculus-3, calc3-dot-cross-products, dot-cross-products] }
authoring: { visualRequirement: required, visualRationale: Dot and cross products connect scalar comparison, area, orientation, and normals. }
lesson:
  introduction: Dot products return scalars; cross products return vectors. Use the requested geometric output to choose the operation, then check direction and units.
  sections:
  - id: s01
    title: Compute a dot product
    required: true
    content: Multiply corresponding components and add the products. The dot product is a scalar.
    media: []
    check:
      id: check-01
      type: multipleChoice
      prompt: 'Compute $\langle1,2,3\rangle\cdot\langle2,0,1\rangle$.'
      choices:
      - { id: a, text: '5', issueSignals: [] }
      - { id: b, text: '7', issueSignals: [{ id: dot-product-computation-error, domains: [] }] }
      - { id: c, text: '$\langle2,0,3\rangle$', issueSignals: [{ id: scalar-vector-confusion, domains: [] }] }
      - { id: d, text: '$\sqrt{14}$', issueSignals: [{ id: magnitude-formula-error, domains: [] }] }
      answer: { choiceId: a }
      explanation: |
        Solution: $1(2)+2(0)+3(1)=5$.

        Why it works: A dot product adds the products of matching components and returns a scalar.

        Why the other choices fail: Choice b adds components incorrectly. Choice c is componentwise multiplication, which is a vector. Choice d is a magnitude calculation, not a dot product.
      issueSignals: [{ id: dot-product-computation-error, domains: [] }]
      difficultyDimensions: [representationTransfer, auxiliaryTechnique]
  - id: s02
    title: Recognize perpendicular vectors
    required: true
    content: For nonzero vectors, a dot product of zero means the vectors are perpendicular.
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: 'What does $\mathbf u\cdot\mathbf v=0$ mean for nonzero vectors?'
      choices:
      - { id: a, text: perpendicular, issueSignals: [] }
      - { id: b, text: parallel, issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }
      - { id: c, text: equal in magnitude, issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }
      - { id: d, text: one vector is the zero vector, issueSignals: [{ id: dot-product-geometry-error, domains: [] }] }
      answer: { choiceId: a }
      explanation: |
        Solution: The vectors are perpendicular.

        Why it works: $\mathbf u\cdot\mathbf v=|\mathbf u||\mathbf v|\cos\theta$; nonzero magnitudes make a zero dot product correspond to $\cos\theta=0$.

        Why the other choices fail: Choice b would give an angle of $0$ or $\pi$. Choice c is unrelated to the dot product value. Choice d is excluded by the prompt.
      issueSignals: [{ id: dot-product-geometry-error, domains: [] }]
      difficultyDimensions: [representationTransfer, auxiliaryTechnique]
  - id: s03
    title: Track cross-product order
    required: true
    content: 'The cross product is anti-commutative: reversing the order reverses the direction.'
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: 'What is $\mathbf i\times\mathbf j$?'
      choices:
      - { id: a, text: '$\mathbf k$', issueSignals: [] }
      - { id: b, text: 'a vector in the negative k-direction', issueSignals: [{ id: cross-product-order-error, domains: [] }] }
      - { id: c, text: '$\mathbf i$', issueSignals: [{ id: cross-product-direction-error, domains: [] }] }
      - { id: d, text: '0', issueSignals: [{ id: cross-product-direction-error, domains: [] }] }
      answer: { choiceId: a }
      explanation: |
        Solution: $\mathbf i\times\mathbf j=\mathbf k$.

        Why it works: The right-hand rule sends the positive x-direction toward the positive y-direction into the positive z-direction.

        Why the other choices fail: Choice b reverses the order. Choice c is an input direction, not a perpendicular direction. Choice d confuses perpendicular vectors with parallel vectors.
      issueSignals: [{ id: cross-product-order-error, domains: [] }]
      difficultyDimensions: [representationTransfer, auxiliaryTechnique]
  - id: s04
    title: Reverse the order
    required: true
    content: 'Switching cross-product inputs changes only the sign: $\mathbf v\times\mathbf u=-(\mathbf u\times\mathbf v)$.'
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: 'What is $\mathbf j\times\mathbf i$?'
      choices:
      - { id: a, text: 'the negative z unit vector', issueSignals: [] }
      - { id: b, text: 'the positive z unit vector', issueSignals: [{ id: cross-product-order-error, domains: [] }] }
      - { id: c, text: '$\mathbf j$', issueSignals: [{ id: cross-product-direction-error, domains: [] }] }
      - { id: d, text: '1', issueSignals: [{ id: scalar-vector-confusion, domains: [] }] }
      answer: { choiceId: a }
      explanation: |
        Solution: $\mathbf j\times\mathbf i=-\mathbf k$.

        Why it works: Reverse the order of $\mathbf i\times\mathbf j=\mathbf k$, then negate the result.

        Why the other choices fail: Choice b ignores anti-commutativity. Choice c is not perpendicular to the inputs. Choice d is a scalar rather than a vector.
      issueSignals: [{ id: cross-product-order-error, domains: [] }]
      difficultyDimensions: [representationTransfer, auxiliaryTechnique]
  - id: s05
    title: Connect cross product to area
    required: true
    content: The magnitude of a cross product is the area of the parallelogram spanned by its input vectors.
    media: []
    check:
      id: check-05
      type: multipleChoice
      prompt: 'What geometric quantity is $|\mathbf u\times\mathbf v|$?'
      choices:
      - { id: a, text: parallelogram area, issueSignals: [] }
      - { id: b, text: triangle area, issueSignals: [{ id: cross-product-area-error, domains: [] }] }
      - { id: c, text: '$\mathbf u\cdot\mathbf v$', issueSignals: [{ id: dot-cross-confusion, domains: [] }] }
      - { id: d, text: the length of $\mathbf u+\mathbf v$', issueSignals: [{ id: dot-cross-confusion, domains: [] }] }
      answer: { choiceId: a }
      explanation: |
        Solution: $|\mathbf u\times\mathbf v|$ is the area of the parallelogram spanned by $\mathbf u$ and $\mathbf v$.

        Why it works: Its magnitude is $|\mathbf u||\mathbf v|\sin\theta$, base times perpendicular height.

        Why the other choices fail: Choice b is half this area. Choice c is the dot product. Choice d is a diagonal length, not an area.
      issueSignals: [{ id: cross-product-area-error, domains: [] }]
      difficultyDimensions: [representationTransfer, auxiliaryTechnique]
  - id: s06
    title: Choose the output type
    required: true
    content: 'Check the requested output before computing: a dot product is scalar, whereas a cross product is a vector.'
    media: []
    check:
      id: check-06
      type: multipleChoice
      prompt: What type of quantity is a dot product?
      choices:
      - { id: a, text: scalar, issueSignals: [] }
      - { id: b, text: vector, issueSignals: [{ id: scalar-vector-confusion, domains: [] }] }
      - { id: c, text: normal vector, issueSignals: [{ id: dot-cross-confusion, domains: [] }] }
      - { id: d, text: oriented area vector, issueSignals: [{ id: dot-cross-confusion, domains: [] }] }
      answer: { choiceId: a }
      explanation: |
        Solution: A dot product is a scalar.

        Why it works: Component products are added into one number.

        Why the other choices fail: Choice b describes a cross product. Choices c and d are geometric uses of a cross product.
      issueSignals: [{ id: scalar-vector-confusion, domains: [] }]
      difficultyDimensions: [representationTransfer, auxiliaryTechnique]
  - id: s07
    title: Build a normal vector
    required: true
    content: A cross product is perpendicular to both input vectors, so it is useful for finding a normal to their plane.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: What operation produces a vector normal to two nonparallel vectors?
      choices:
      - { id: a, text: cross product, issueSignals: [] }
      - { id: b, text: dot product, issueSignals: [{ id: dot-cross-confusion, domains: [] }] }
      - { id: c, text: vector addition, issueSignals: [{ id: normal-vector-method-error, domains: [] }] }
      - { id: d, text: scalar multiplication, issueSignals: [{ id: normal-vector-method-error, domains: [] }] }
      answer: { choiceId: a }
      explanation: |
        Solution: Use the cross product.

        Why it works: $\mathbf u\times\mathbf v$ is perpendicular to both nonparallel inputs.

        Why the other choices fail: Choice b returns a scalar. Choice c stays in the input plane. Choice d only rescales one input direction.
      issueSignals: [{ id: normal-vector-method-error, domains: [] }]
      difficultyDimensions: [representationTransfer, auxiliaryTechnique]
