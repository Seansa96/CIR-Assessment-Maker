  - id: s03
    title: Track cross-product order
    required: true
    content: 'The cross product is anti-commutative: reversing the order reverses the direction.'
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: What is $\mathbf i\times\mathbf j$?
      choices:
      - id: a
        text: $\mathbf k$
        media: []
        issueSignals: []
      - id: b
        text: a vector in the negative k-direction
        media: []
        issueSignals:
        - id: cross-product-order-error
          domains: []
      - id: c
        text: $\mathbf i$
        media: []
        issueSignals:
        - id: cross-product-direction-error
          domains: []
      - id: d
        text: 0
        media: []
        issueSignals:
        - id: cross-product-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $\mathbf i\times\mathbf j=\mathbf k$.


        Why it works: The right-hand rule sends the positive x-direction toward the positive y-direction into the positive z-direction.


        Why the other choices fail: Choice b reverses the order. Choice c is an input direction, not a perpendicular direction. Choice d confuses perpendicular vectors with parallel vectors.
