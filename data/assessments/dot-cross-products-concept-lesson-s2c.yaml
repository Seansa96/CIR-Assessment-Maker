  - id: s02
    title: Recognize perpendicular vectors
    required: true
    content: For nonzero vectors, a dot product of zero means the vectors are perpendicular.
    media: []
    check:
      id: check-02
      type: multipleChoice
      prompt: What does $\mathbf u\cdot\mathbf v=0$ mean for nonzero vectors?
      choices:
      - id: a
        text: perpendicular
        media: []
        issueSignals: []
      - id: b
        text: parallel
        media: []
        issueSignals:
        - id: dot-product-geometry-error
          domains: []
      - id: c
        text: equal in magnitude
        media: []
        issueSignals:
        - id: dot-product-geometry-error
          domains: []
      - id: d
        text: one vector is the zero vector
        media: []
        issueSignals:
        - id: dot-product-geometry-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The vectors are perpendicular.


        Why it works: $\mathbf u\cdot\mathbf v=|\mathbf u||\mathbf v|\cos\theta$; nonzero magnitudes make a zero dot product correspond to $\cos\theta=0$.


        Why the other choices fail: Choice b would give an angle of $0$ or $\pi$. Choice c is unrelated to the dot product value. Choice d is excluded by the prompt.
