      explanation: >
        Solution: Use the cross product.


        Why it works: $\mathbf u\times\mathbf v$ is perpendicular to both nonparallel inputs.


        Why the other choices fail: Choice b returns a scalar. Choice c stays in the input plane. Choice d only rescales one input direction.
