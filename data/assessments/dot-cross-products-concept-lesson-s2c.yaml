        media: []
        issueSignals:
        - id: dot-cross-confusion
          domains: []
      - id: d
        text: the length of $\mathbf u+\mathbf v$'
        media: []
        issueSignals:
        - id: dot-cross-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $|\mathbf u\times\mathbf v|$ is the area of the parallelogram spanned by $\mathbf u$ and $\mathbf v$.


        Why it works: Its magnitude is $|\mathbf u||\mathbf v|\sin\theta$, base times perpendicular height.


        Why the other choices fail: Choice b is half this area. Choice c is the dot product. Choice d is a diagonal length, not an area.
