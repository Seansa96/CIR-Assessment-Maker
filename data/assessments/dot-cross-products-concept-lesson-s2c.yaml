lesson:
  introduction: Dot products return scalars; cross products return vectors. Use the requested geometric output to choose the operation, then check direction and units.
  sections:
  - id: s01
    title: Compute a dot product
    required: true
    content: Multiply corresponding components and add the products. The dot product is a scalar.
    media:
    - type: image
      src: /media/calculus-3/dot-cross-products.svg
      alt: Diagram of two vectors spanning a parallelogram and a perpendicular cross product
      caption: The dot product measures alignment
    check:
      id: check-01
      type: multipleChoice
      prompt: Compute $\langle1,2,3\rangle\cdot\langle2,0,1\rangle$.
      choices:
      - id: a
        text: 5
        media: []
        issueSignals: []
      - id: b
        text: 7
        media: []
        issueSignals:
        - id: dot-product-computation-error
          domains: []
      - id: c
        text: $\langle2,0,3\rangle$
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      - id: d
        text: $\sqrt{14}$
        media: []
        issueSignals:
        - id: magnitude-formula-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $1(2)+2(0)+3(1)=5$.


        Why it works: A dot product adds the products of matching components and returns a scalar.


        Why the other choices fail: Choice b adds components incorrectly. Choice c is componentwise multiplication, which is a vector. Choice d is a magnitude calculation, not a dot product.
