  - id: s07
    title: Build a normal vector
    required: true
    content: A cross product is perpendicular to both input vectors, so it is useful for finding a normal to their plane.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: What operation produces a vector normal to two nonparallel vectors?
      choices:
      - id: a
        text: cross product
        media: []
        issueSignals: []
      - id: b
