  - id: s04
    title: Reverse the order
    required: true
    content: 'Switching cross-product inputs changes only the sign: $\mathbf v\times\mathbf u=-(\mathbf u\times\mathbf v)$.'
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: What is $\mathbf j\times\mathbf i$?
      choices:
      - id: a
        text: the negative z unit vector
        media: []
        issueSignals: []
      - id: b
        text: the positive z unit vector
        media: []
        issueSignals:
        - id: cross-product-order-error
          domains: []
      - id: c
        text: $\mathbf j$
        media: []
        issueSignals:
        - id: cross-product-direction-error
          domains: []
      - id: d
        text: 1
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $\mathbf j\times\mathbf i=-\mathbf k$.


        Why it works: Reverse the order of $\mathbf i\times\mathbf j=\mathbf k$, then negate the result.


        Why the other choices fail: Choice b ignores anti-commutativity. Choice c is not perpendicular to the inputs. Choice d is a scalar rather than a vector.
