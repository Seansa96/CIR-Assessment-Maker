  - id: a
    text: '6'
  - id: b
    text: '3 (answers ''For f=x^2+y^2, what is f(1,2)-f(0,0)?'', not ''What is $\iiint_{[0,1]\times[0,2]\times[0,3]}1dV$?'')'
    issueSignals:
    - id: integration-bounds-error
  - id: c
    text: '5 (answers ''A wire has constant density 2 and length 5. What is its mass?'', not ''What is $\iiint_{[0,1]\times[0,2]\times[0,3]}1dV$?'')'
    issueSignals:
    - id: integration-bounds-error
  - id: d
    text: '0 (answers ''For f=x^2+y^2, what is f(1,2)-f(0,0)?'', not ''What is $\iiint_{[0,1]\times[0,2]\times[0,3]}1dV$?'')'
