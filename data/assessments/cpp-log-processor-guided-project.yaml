guidedProject:
  language: cpp
  instructions: 'Implement a `LogProcessor` class that reads a log file, counts the
    number of lines containing the word "ERROR", and writes the total count to a new
    file.


    Required behavior:

    - Create a class named exactly `LogProcessor`.

    - Provide `void processLogs(const std::string& inputFilename, const std::string&
    outputFilename)`.

    - `processLogs` should open `inputFilename` for reading. If it fails, do nothing.

    - Read the file line by line. Count\rhow many lines contain the substring `"ERROR"`.
    You can use `line.find("ERROR") != std::string::npos`.

    - Open `outputFilename` for writing.

    - Write the integer count to `outputFilename`.

    '
  files:
  - path: LogProcessor.h
    readOnly: false
    content: "#pragma once\n#include <string>\n#include <fstream>\n\nusing namespace\
      \ std;\n\nclass LogProcessor {\npublic:\n    // Implement processLogs\n    \n\
      };\n"
  - path: ProjectNotes.md
    readOnly: true
    content: 'Required names:

      - `LogProcessor`

      - `processLogs(string in, string out)`

      '
  requiredChecks:
  - id: process-logs
    title: processLogs works correctly
    description: Check if errors are counted and written
    expectedOutputContains:
    - LOGS_OK
    testCode: "#include \"LogProcessor.h\"\n#include <iostream>\n#include <fstream>\n\
      #include <string>\nusing namespace std;\n\nint main() {\n    // Setup test file\n\
      \    ofstream out(\"test_in.txt\");\n    out << \"INFO: System started\\n\"\
      ;\n    out << \"ERROR: Disk full\\n\";\n    out << \"WARNING: Low memory\\n\"\
      ;\n    out << \"ERROR: Timeout\\n\";\n    out.close();\n    \n    LogProcessor\
      \ lp;\n    lp.processLogs(\"test_in.txt\", \"test_out.txt\");\n    \n    ifstream\
      \ in(\"test_out.txt\");\n    string result;\n    if (in >> result && result\
      \ == \"2\") {\n        cout << \"LOGS_OK\";\n    } else {\n        cout << \"\
      FAIL\";\n    }\n    return 0;\n}\n"
