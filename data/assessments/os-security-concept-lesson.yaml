      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A component should receive only the authority needed to do its job. Related topic: Operating System Security.

        '
  - id: malware-and-exploits
    title: Malware and exploits
    required: true
    content: 'Malware exploits weaknesses in code, configuration, or users to gain unauthorized effects.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Security design must assume failures and limit blast radius.

      '
    check:
