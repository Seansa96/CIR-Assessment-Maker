lesson:
  introduction: 'This lesson introduces Operating System Security through the mental models emphasized by 9 Security. Focus
    on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: security-goals
    title: Security goals
    required: true
    content: 'Confidentiality, integrity, and availability describe what the system must protect.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Security is not only secrecy.

      '
    check:
      id: security-goals-check
      title: 'Check: Security goals'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Security goals**?

        '
      choices:
      - id: a
        text: Confidentiality, integrity, and availability describe what the system must protect.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Confidentiality, integrity, and availability describe what the system must protect. Related topic: Operating
        System Security.

        '
  - id: authentication
    title: Authentication
    required: true
    content: 'Authentication establishes who or what is making a request.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Authentication does not by itself decide what is allowed.

      '
    check:
      id: authentication-check
      title: 'Check: Authentication'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Authentication**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Authentication establishes who or what is making a request.
      answer:
        choiceId: d
      explanation: 'Authentication establishes who or what is making a request. Related topic: Operating System Security.

        '
  - id: authorization
    title: Authorization
    required: true
    content: 'Authorization decides whether an authenticated subject may perform an action on an object.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Authorization without good identity is weak.

      '
    check:
      id: authorization-check
      title: 'Check: Authorization'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Authorization**?

        '
      choices:
