        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Authorization decides whether an authenticated subject may perform an action on an object.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Authorization decides whether an authenticated subject may perform an action on an object. Related topic:
        Operating System Security.

        '
  - id: access-control
    title: Access control
    required: true
    content: 'Access control lists and capabilities represent permissions from different directions.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      ACLs attach permissions to objects; capabilities attach authority to subjects or tokens.

      '
    check:
      id: access-control-check
      title: 'Check: Access control'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Access control**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Access control lists and capabilities represent permissions from different directions.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Access control lists and capabilities represent permissions from different directions. Related topic:
        Operating System Security.

        '
  - id: least-privilege
    title: Least privilege
    required: true
    content: 'A component should receive only the authority needed to do its job.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Running everything as administrator expands damage from mistakes and attacks.

      '
    check:
      id: least-privilege-check
      title: 'Check: Least privilege'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Least privilege**?

        '
      choices:
