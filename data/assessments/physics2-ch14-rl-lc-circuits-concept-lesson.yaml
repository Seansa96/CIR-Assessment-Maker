      explanation: >
        Solution: During name the model and quantities for RL and LC Circuits, first identify the appropriate transient, its time constant, and the initial and final current. Then apply I_RL(t) = V/R(1-exp(-tR/L)) with one consistent coordinate system and solve for the requested quantity.


        Why it works: I_RL(t) = V/R(1-exp(-tR/L)) connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
