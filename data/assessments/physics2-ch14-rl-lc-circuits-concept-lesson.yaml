lesson:
  introduction: >
    This lesson develops a repeatable way to solve RL and LC Circuits problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch14-rl-lc-circuits-s1
    title: Name the model and quantities
    required: true
    content: >
      RL and LC Circuits uses I_RL(t) = V/R(1-exp(-tR/L)). In the name the model and quantities stage, identify the appropriate transient, its time constant, and the initial and final current.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving RL and LC Circuits problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch14-rl-lc-circuits-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for RL and LC Circuits, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use I_RL(t) = V/R(1-exp(-tR/L)) after you identify the appropriate transient, its time constant, and the initial and final current.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this RL and LC Circuits problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-rl-lc-circuits-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables I_RL(t) = V/R(1-exp(-tR/L)) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-rl-lc-circuits-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit RL and LC Circuits.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-rl-lc-circuits-units-error
          domains:
          - physics-2
      answer:
