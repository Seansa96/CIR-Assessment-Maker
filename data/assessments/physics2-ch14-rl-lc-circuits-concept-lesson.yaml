id: physics2-ch14-rl-lc-circuits-concept-lesson
title: RL and LC Circuits
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-inductance
lesson:
  introduction: This lesson develops the main ideas behind RL and LC Circuits and connects them to the
    governing physical relationships.
  sections:
  - id: l3-sec1
    title: RL Circuits
    required: true
    content: 'In a circuit with a resistor $R$ and inductor $L$, the current cannot change instantaneously.
      When a voltage is applied, the current grows exponentially: $i(t) = \frac{\mathcal{E}}{R}(1 - e^{-t/\tau})$,
      where the time constant is $\tau = L/R$.'
  - id: l3-sec2
    title: LC Circuits
    required: true
    content: In an ideal circuit with an inductor $L$ and capacitor $C$, energy oscillates between the
      electric field of the capacitor and the magnetic field of the inductor. The angular frequency of
      oscillation is $\omega = \frac{1}{\sqrt{LC}}$.
