glossary:
  introduction: Use each definition together with its equation-based example; retrieve the term from meaning rather
    than spelling cues.
  sections:
  - id: core
    title: Core vocabulary
    required: true
    content: Definitions, examples, and retrieval prompts for this chapter.
    entries:
    - id: t01
      term: mathematical model
      definition: An equation or system that represents relationships among quantities under stated assumptions.
      examples:
      - $P'=0.03P$ models population growth proportional to population.
      aliases: &id001 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t01-d
        type: typed
        prompt: What term names an equation-based representation of a real process and its assumptions?
        answer:
          expected: mathematical model
          aliases: *id001
          media: []
        explanation: |-
          Solution: mathematical model

          Why it works: An equation or system that represents relationships among quantities under stated assumptions.
    - id: t02
      term: dependent variable
      definition: The unknown quantity whose value depends on the independent variable.
      examples:
      - In $T'(t)=-k(T-T_a)$, temperature $T$ is the dependent variable.
      aliases: &id002 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t02-d
        type: typed
        prompt: In a cooling model, what term describes the temperature function being predicted?
        answer:
          expected: dependent variable
          aliases: *id002
          media: []
        explanation: |-
          Solution: dependent variable

          Why it works: The unknown quantity whose value depends on the independent variable.
    - id: t03
      term: independent variable
      definition: The input variable with respect to which derivatives are taken.
      examples:
      - Time $t$ is the independent variable in $Q'(t)=r-kQ$.
      aliases: &id003 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t03-d
        type: typed
        prompt: What term describes the input variable with respect to which a derivative is taken?
        answer:
          expected: independent variable
          aliases: *id003
          media: []
        explanation: |-
          Solution: independent variable

          Why it works: The input variable with respect to which derivatives are taken.
    - id: t04
      term: differential equation
      definition: An equation involving an unknown function and one or more of its derivatives.
      examples:
      - $y''+4y=0$ relates a function to its second derivative.
      aliases: &id004 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t04-d
        type: typed
        prompt: Name the kind of equation that relates an unknown function to its derivatives.
        answer:
          expected: differential equation
          aliases: *id004
          media: []
        explanation: |-
          Solution: differential equation

          Why it works: An equation involving an unknown function and one or more of its derivatives.
    - id: t05
      term: order
      definition: The order of the highest derivative appearing in a differential equation.
      examples:
      - $y''+(y')^4=0$ has value two for this classification.
      aliases: &id005 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t05-d
        type: typed
        prompt: What classification is determined by the highest derivative present rather than its exponent?
        answer:
          expected: order
          aliases: *id005
          media: []
        explanation: |-
          Solution: order

          Why it works: The order of the highest derivative appearing in a differential equation.
    - id: t06
      term: solution
      definition: A function or relation that satisfies the differential equation on a stated interval.
      examples:
      - $y=e^{2x}$ satisfies $y'=2y$ on all real $x$.
      aliases: &id006 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t06-d
        type: typed
        prompt: What term describes a function that makes the equation true after substitution on an interval?
        answer:
          expected: solution
          aliases: *id006
          media: []
        explanation: |-
          Solution: solution

          Why it works: A function or relation that satisfies the differential equation on a stated interval.
    - id: t07
      term: general solution
      definition: A family of solutions containing the arbitrary constants expected for the equation's order.
      examples:
      - $y=Ce^{-x}$ is the one-parameter family for $y'=-y$.
      aliases: &id007 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t07-d
        type: typed
        prompt: What term names a family containing arbitrary constants before conditions are applied?
        answer:
          expected: general solution
          aliases: *id007
          media: []
        explanation: |-
          Solution: general solution

          Why it works: A family of solutions containing the arbitrary constants expected for the equation's order.
    - id: t08
      term: particular solution
      definition: A single member of a solution family selected by conditions or fixed constants.
      examples:
      - $y=3e^{-x}$ is selected by $y(0)=3$.
      aliases: &id008 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t08-d
        type: typed
        prompt: What term names one member of a family after its constants are fixed?
        answer:
          expected: particular solution
          aliases: *id008
          media: []
        explanation: |-
          Solution: particular solution

          Why it works: A single member of a solution family selected by conditions or fixed constants.
    - id: t09
      term: initial-value problem
      definition: A differential equation together with values of the unknown function or derivatives at one input.
      examples:
      - $y'=x+y$, $y(0)=1$ specifies both evolution and starting data.
      aliases: &id009
      - IVP
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t09-d
        type: typed
        prompt: What term names a differential equation paired with data at one input point?
        answer:
          expected: initial-value problem
          aliases: *id009
          media: []
        explanation: |-
          Solution: initial-value problem

          Why it works: A differential equation together with values of the unknown function or derivatives at one input.
    - id: t10
      term: initial condition
      definition: A prescribed value of the unknown function or a derivative at the initial input.
      examples:
      - $y(0)=5$ fixes the constant in a first-order solution family.
      aliases: &id010 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t10-d
        type: typed
        prompt: What term describes data such as $y(2)=-1$ attached to a differential equation?
        answer:
          expected: initial condition
          aliases: *id010
          media: []
        explanation: |-
          Solution: initial condition

          Why it works: A prescribed value of the unknown function or a derivative at the initial input.
    - id: t11
      term: interval of validity
      definition: A connected interval on which the solution and original equation are defined and the conditions
        hold.
      examples:
      - A solution through $x=0$ of an equation singular at $x=2$ cannot cross $2$.
      aliases: &id011 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t11-d
        type: typed
        prompt: What term names the connected input range on which a solution legitimately satisfies the original
          equation?
        answer:
          expected: interval of validity
          aliases: *id011
          media: []
        explanation: |-
          Solution: interval of validity

          Why it works: A connected interval on which the solution and original equation are defined and the conditions hold.
    - id: t12
      term: direction field
      definition: A plot of short line segments whose slopes equal $f(x,y)$ for $y'=f(x,y)$.
      examples:
      - Segments for $y'=x-y$ show the local slope at each plotted point.
      aliases: &id012
      - slope field
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t12-d
        type: typed
        prompt: What representation displays local slopes throughout the plane without first solving the equation?
        answer:
          expected: direction field
          aliases: *id012
          media: []
        explanation: |-
          Solution: direction field

          Why it works: A plot of short line segments whose slopes equal $f(x,y)$ for $y'=f(x,y)$.
    - id: t13
      term: integral curve
      definition: A solution curve tangent to the direction-field segment at every point it passes through.
      examples:
      - The curve through $(0,1)$ follows the field determined by $y'=f(x,y)$.
      aliases: &id013
      - solution curve
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t13-d
        type: typed
        prompt: What term names a solution curve that follows the local segments of a slope field?
        answer:
          expected: integral curve
          aliases: *id013
          media: []
        explanation: |-
          Solution: integral curve

          Why it works: A solution curve tangent to the direction-field segment at every point it passes through.
    - id: t14
      term: explicit solution
      definition: A solution written with the dependent variable isolated as a function of the independent variable.
      examples:
      - '$y=\sqrt{9-x^2}$ is one explicit branch of a circle.'
      aliases: &id014 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t14-d
        type: typed
        prompt: What solution form isolates $y$ as in $y=g(x)$?
        answer:
          expected: explicit solution
          aliases: *id014
          media: []
        explanation: |-
          Solution: explicit solution

          Why it works: A solution written with the dependent variable isolated as a function of the independent variable.
    - id: t15
      term: implicit solution
      definition: A relation between variables that defines one or more solution branches without isolating the
        dependent variable.
      examples:
      - $x^2+y^2=C$ is a relation that may define two branches.
      aliases: &id015 []
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t15-d
        type: typed
        prompt: What solution form leaves the variables in a relation such as $F(x,y)=C$?
        answer:
          expected: implicit solution
          aliases: *id015
          media: []
        explanation: |-
          Solution: implicit solution

          Why it works: A relation between variables that defines one or more solution branches without isolating the dependent variable.
    - id: t16
      term: equilibrium solution
      definition: A constant solution found where an autonomous rate function vanishes.
      examples:
      - $y=0$ and $y=1$ are constant solutions of $y'=y(1-y)$.
      aliases: &id016
      - steady-state solution
      media: []
      tags:
      - ede-ch01-introduction
      drills:
      - id: t16-d
        type: typed
        prompt: What term names a constant solution obtained from $f(y)=0$?
        answer:
          expected: equilibrium solution
          aliases: *id016
          media: []
        explanation: |-
          Solution: equilibrium solution

          Why it works: A constant solution found where an autonomous rate function vanishes.
