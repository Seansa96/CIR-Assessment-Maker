workedExamples:
- id: we001
  title: Building a Character Creation Prompt
  problem: 'We need to write a script that asks a player for their character''s name,
    class, and starting gold. It then needs to display a formatted character sheet.


    The starting gold must be stored as a floating-point number, not a string, so
    we can do math with it later.

    '
  steps:
  - id: step-we001-1
    title: Gathering String Input
    instruction: 'First, we prompt the user for text-based inputs.

      '
    type: multipleChoice
    prompt: |
      Which code correctly asks for the player's name and class, storing them as strings?
    choices:
    - id: a
      text: '`name = input("Enter name: ")`

        `char_class = input("Enter class: ")`

        '
    - id: b
      text: '`name = print("Enter name: ")`

        `char_class = print("Enter class: ")`

        '
    - id: c
      text: '`name = str(input("Enter name: "))`

        `char_class = str(input("Enter class: "))`

        '
    answer:
      choiceId: a
    explanation: |
      `input()` already returns a string, so there's no need to use `str()`. `print()` outputs text but returns `None`.
  - id: step-we001-2
    title: Gathering Numeric Input
    instruction: 'Next, we ask for their starting gold. This needs to be a number.

      '
    type: multipleChoice
    prompt: |
      Which code correctly asks for starting gold and stores it as a float?
    choices:
    - id: a
      text: '`gold = float(input("Enter starting gold: "))`'
    - id: b
      text: '`gold = input("Enter starting gold: ")`'
    - id: c
      text: '`gold = int(input("Enter starting gold: "))`'
    answer:
      choiceId: a
    explanation: |
      We wrap `input()` in `float()` to convert the text the user types (like `"50.5"`) into a floating-point number (`50.5`).
  - id: step-we001-3
    title: Formatting the Output
    instruction: 'Finally, we print out the character sheet.

      '
    type: multipleChoice
    prompt: |
      Which statement correctly uses f-strings to display the character's details?
    choices:
    - id: a
      text: '`print(f"Name: {name} | Class: {char_class} | Gold: {gold}")`'
    - id: b
      text: '`print("Name: {name} | Class: {char_class} | Gold: {gold}")`'
    - id: c
      text: '`print(f"Name: name | Class: char_class | Gold: gold")`'
    answer:
      choiceId: a
    explanation: |
      The `f` prefix is required, and the variable names must be inside `{}` brackets so Python evaluates them.
  - id: step-we001-4
    title: The Full Script
    instruction: 'Putting it all together, we get our character creation script.

      '
    type: numericResponse
    prompt: |
      Look at the final script:
      ```python
      name = input("Name: ")
      char_class = input("Class: ")
      gold = float(input("Gold: "))
      print(f"Created {name} the {char_class} with {gold}G.")
      ```
      If the user enters `"Leo"`, `"Mage"`, and `"15"`, what will `gold + 5` evaluate to in Python?
    answer:
      value: 20
      tolerance: 0
    explanation: |
      The string `"15"` is converted to the float `15.0`. Adding `5` results in `20.0`. If we had forgotten to use `float()`, `gold + 5` would cause a `TypeError` because you can't add a string and an int.
