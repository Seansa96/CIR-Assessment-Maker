questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - formula-application
  prompt: An ideal LC circuit has an inductor of $4.0\text{ mH}$ and a capacitor of $1.0\text{ }\mu\text{F}$.
    What is the angular frequency of the oscillation (in rad/s)?
  answer:
    tolerance: 100
    value: 15811
  explanation: 'Solution:

    1) Use the formula $\omega = \frac{1}{\sqrt{LC}}$.

    2) Substitute: $L = 4.0 \times 10^{-3}\text{ H}$, $C = 1.0 \times 10^{-6}\text{ F}$.

    3) Calculate: $\omega = \frac{1}{\sqrt{4.0 \times 10^{-9}}} = \frac{1}{6.324 \times 10^{-5}} \approx
    15811\text{ rad/s}$.


    Why it works:

    The energy constantly sloshes back and forth between the inductor and capacitor at this natural resonant
    frequency.'
