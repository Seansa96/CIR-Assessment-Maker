schemaVersion: 1
id: completing-the-square-worked-example
title: Completing the Square Worked Example
assessmentType: workedExample
categoryId: precalculus
subcategoryIds:
- precalc-quadratics
modeDefault: practice
randomizeQuestions: false
workedExamples:
- id: we001
  title: Rewriting a quadratic by completing the square
  problem: 'Rewrite $x^2+6x+5$ in vertex form and identify the vertex.

    '
  steps:
  - id: step-we001-1
    title: Identify the pattern
    instruction: Start by recognizing what kind of expression you have and what completing
      the square is trying to build.
    type: multipleChoice
    prompt: |
      What structure are you trying to create from $x^2+6x+5$?
    choices:
    - id: a
      text: A perfect-square trinomial, such as $(x+h)^2$
    - id: b
      text: A factored difference of cubes
    - id: c
      text: A rational expression with a common denominator
    - id: d
      text: A trigonometric identity
    answer:
      choiceId: a
    hint: Look at the leading $x^2$ term and the linear $6x$ term. Completing the
      square builds a square binomial.
    explanation: |
      Completing the square rewrites the quadratic part as a perfect square. The pattern to look up is:

      $x^2+2bx+b^2=(x+b)^2$

      Related topic: perfect-square trinomials. Action step: identify the coefficient of $x$, cut it in half, and square it.
  - id: step-we001-2
    title: Use the linear coefficient
    instruction: The number attached to x determines the square you need to create.
    type: multipleChoice
    prompt: |
      For $x^2+6x+5$, what number should be squared to complete the square?
    choices:
    - id: a
      text: $3$, because half of $6$ is $3$
    - id: b
      text: $6$, because the coefficient of $x$ is $6$
    - id: c
      text: $5$, because it is the constant term
    - id: d
      text: $11$, because $6+5=11$
    answer:
      choiceId: a
    hint: Use half of the coefficient on x, then square that half.
    explanation: |
      Half of $6$ is $3$, so the square-completing term is $3^2=9$.

      Related topic: completing the square formula. Quick lookup phrase: "half the linear coefficient and square it."
  - id: step-we001-3
    title: Balance the expression
    instruction: If you add a number inside the expression, you must also subtract
      it so the value stays unchanged.
    type: multipleChoice
    prompt: |
      Which rewrite keeps $x^2+6x+5$ equivalent while creating the perfect square?
    choices:
    - id: a
      text: $x^2+6x+9-9+5$
    - id: b
      text: $x^2+6x+9+5$
    - id: c
      text: $x^2+6x-9+5$
    - id: d
      text: $x^2+9x+6+5$
    answer:
      choiceId: a
    hint: Add and subtract the same square-completing term.
    explanation: |
      Adding and subtracting $9$ preserves the original value:

      $x^2+6x+5=x^2+6x+9-9+5$

      Related topic: equivalent transformations. Action step: create the square without changing the expression's value.
  - id: step-we001-4
    title: Factor the square
    instruction: Now group the perfect-square trinomial and factor it into a square
      binomial.
    type: multipleChoice
    prompt: |
      What does $x^2+6x+9$ factor into?
    choices:
    - id: a
      text: $(x+3)^2$
    - id: b
      text: $(x+6)^2$
    - id: c
      text: $(x-3)^2$
    - id: d
      text: $(x+9)^2$
    answer:
      choiceId: a
    hint: The square term came from half of 6, which was 3.
    explanation: |
      $x^2+6x+9=(x+3)^2$.

      Related topic: perfect-square trinomial factoring. Action step: match $x^2+2bx+b^2$ with $b=3$.
  - id: step-we001-5
    title: Finish vertex form
    instruction: Combine the leftover constants after factoring the square.
    type: multipleChoice
    prompt: |
      What is the completed-square form of $x^2+6x+5$?
    choices:
    - id: a
      text: $(x+3)^2-4$
    - id: b
      text: $(x+3)^2+14$
    - id: c
      text: $(x-3)^2-4$
    - id: d
      text: $(x+6)^2-31$
    answer:
      choiceId: a
    hint: After $x^2+6x+9$, the constants are $-9+5$.
    explanation: |
      $x^2+6x+5=x^2+6x+9-9+5=(x+3)^2-4$.

      Related topic: vertex form of a quadratic. Lookup: $a(x-h)^2+k$.
  - id: step-we001-6
    title: Read the vertex
    instruction: Vertex form shows the\rhorizontal and vertical shift of the parabola.
    type: multipleChoice
    prompt: |
      What is the vertex of $y=(x+3)^2-4$?
    choices:
    - id: a
      text: $(-3,-4)$
    - id: b
      text: $(3,-4)$
    - id: c
      text: $(-3,4)$
    - id: d
      text: $(3,4)$
    answer:
      choiceId: a
    hint: Compare $(x+3)^2-4$ with $(x-h)^2+k$.
    explanation: |
      $(x+3)^2=(x-(-3))^2$, so $h=-3$ and $k=-4$.

      Related topic: vertex form. Action step: rewrite the inside as $x-h$ before reading the vertex.
  - id: step-we001-7
    title: Build the habit
    instruction: Summarize the pattern so you can recognize and repeat it.
    type: freeResponse
    prompt: In your own words, what are the steps for completing the square when the
      leading coefficient is 1?
    answer:
      expected: Find half of the x coefficient, square it, add and subtract that value,
        factor the perfect-square trinomial, then combine constants and read the vertex
        form.
      gradingMode: selfCheck
      keyPoints:
      - Use half of the linear coefficient.
      - Square that half to create the missing perfect-square term.
      - Add and subtract the same value to preserve equivalence.
      - Factor the trinomial and simplify the constants.
    hint: 'Think: half, square, balance, factor, simplify.'
    explanation: |
      The reliable pattern is: half the $x$ coefficient, square it, add and subtract that square, factor the square trinomial, and combine constants.

      Related topic: completing the square. Quick lookup phrase: "convert standard form quadratic to vertex form."
