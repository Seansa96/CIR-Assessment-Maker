questions:
- id: q-param-hard-1
  type: symbolicResponse
  title: Complex Elimination 1
  prompt: |-
    Eliminate the parameter $t$ to find a Cartesian equation for the curve:

    $$
    x = e^t + e^{-t}, \quad y = e^t - e^{-t}
    $$

    Express your answer by isolating $1$ on one side. What is the expression equal to $1$?
  answer:
    expectedLatex: \frac{x^2}{4} - \frac{y^2}{4}
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.001
  explanation: |-
    Note that $x$ and $y$ are related to the hyperbolic cosine and sine: $x = 2\cosh t$ and $y = 2\sinh t$. Since $\cosh^2 t - \sinh^2 t = 1$, we have $\left(\frac{x}{2}\right)^2 - \left(\frac{y}{2}\right)^2 = 1$. Thus, $\frac{x^2}{4} - \frac{y^2}{4} = 1$.
- id: q-param-hard-2
  type: symbolicResponse
  title: Complex Elimination 2
  prompt: |-
    Eliminate the parameter $t$ to find a Cartesian equation for the curve:

    $$
    x = \ln(t), \quad y = \sqrt{t+1}
    $$

    Express $y$ as a function of $x$.
  answer:
    expectedLatex: \sqrt{e^x + 1}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.001
  explanation: |-
    From the first equation, $t = e^x$. Substitute this into the second equation: $y = \sqrt{e^x + 1}.
- id: q-param-hard-3
  type: symbolicResponse
  title: Complex Elimination 3
  prompt: |-
    Eliminate the parameter $\theta$ to find a Cartesian equation for the curve:

    $$
    x = 3 + 2\tan\theta, \quad y = 1 - 4\sec\theta
    $$

    Express your answer by isolating $1$ on one side, ensuring the $y$ term is positive. What is the expression equal to $1$?
  answer:
    expectedLatex: \frac{(y-1)^2}{16} - \frac{(x-3)^2}{4}
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.001
  explanation: |-
    Isolate the trigonometric functions: $\tan\theta = \frac{x-3}{2}$ and $\sec\theta = \frac{y-1}{-4}$. Using the identity $\sec^2\theta - \tan^2\theta = 1$, we get $\left(\frac{y-1}{-4}\right)^2 - \left(\frac{x-3}{2}\right)^2 = 1$, which simplifies to $\frac{(y-1)^2}{16} - \frac{(x-3)^2}{4} = 1$.
- id: q-param-hard-4
  type: multipleChoice
  title: Intersection vs Collision 1
  prompt: |-
    Two particles move along the paths defined below for $t \ge 0$:

    Particle 1: $x_1 = 3t, \quad y_1 = 2t^2$

    Particle 2: $x_2 = 6, \quad y_2 = t+6$

    Do their paths intersect, and do they collide?
  choices:
  - id: c1
    text: The paths intersect, but the particles do not collide.
  - id: c2
    text: The paths intersect and the particles collide at exactly one point.
  - id: c3
    text: The paths do not intersect.
  - id: c4
    text: The paths intersect and the particles collide at exactly two points.
  answer:
    choiceId: c2
  explanation: |-
    For Particle 1: $y_1 = 2(x_1/3)^2 = 2x_1^2/9$. For Particle 2: $x_2=6$, so it moves vertically. Path intersection occurs at $x=6$. $y = 2(36)/9 = 8$. Paths intersect at $(6,8)$.
    To check for collision, set $x_1(t) = x_2(t)$: $3t = 6 \implies t = 2$. At $t=2$, $y_1(2) = 2(4)=8$. For Particle 2 at $t=2$, $y_2(2) = 2+6 = 8$. The particles are at the same point at the same time, so they collide at exactly one point.
- id: q-param-hard-5
  type: multipleChoice
  title: Intersection vs Collision 2
  prompt: |-
    Two particles move along the paths defined below for $t \ge 0$:

    Particle A: $x_A = t^2, \quad y_A = 4t$

    Particle B: $x_B = 2t-1, \quad y_B = t^2+3$

    Do their paths intersect, and do they collide?
  choices:
  - id: c1
    text: The paths intersect, but the particles do not collide.
  - id: c2
    text: The paths intersect and the particles collide at exactly one point.
  - id: c3
    text: The paths do not intersect.
  - id: c4
    text: The paths intersect and the particles collide at exactly two points.
  answer:
    choiceId: c2
  explanation: |-
    Set $x_A = x_B$: $t^2 = 2t-1 \implies t^2-2t+1 = 0 \implies (t-1)^2 = 0 \implies t=1$. At $t=1$, $y_A = 4(1)=4$ and $y_B = 1^2+3=4$. They collide at $(1,4)$ at $t=1$.
- id: q-param-hard-6
  type: multipleChoice
  title: Intersection vs Collision 3
  prompt: |-
    Two particles move along the paths defined below for $t \ge 0$:

    Particle 1: $x_1 = t, \quad y_1 = t^2$

    Particle 2: $x_2 = 2t, \quad y_2 = t+2$

    Do their paths intersect, and do they collide?
  choices:
  - id: c1
    text: The paths intersect, but the particles do not collide.
  - id: c2
    text: The paths intersect and the particles collide at exactly one point.
  - id: c3
    text: The paths do not intersect.
  - id: c4
    text: The paths intersect and the particles collide at exactly two points.
  answer:
    choiceId: c1
  explanation: |-
    Path 1 is $y=x^2$. Path 2 is $t = x/2 \implies y = x/2+2$. Intersection: $x^2 = x/2+2 \implies 2x^2-x-4=0$. Since the discriminant $1-4(2)(-4) = 33 > 0$, there are real intersection points.
    To check for collision, set $x_1(t) = x_2(t) \implies t = 2t \implies t = 0$. At $t=0$, Particle 1 is at $(0,0)$ and Particle 2 is at $(0,2)$. They are not at the same location. Therefore, their paths intersect but they do not collide.
- id: q-param-hard-7
  type: multipleChoice
  title: Intersection vs Collision 4
  prompt: |-
    Two particles move along the paths defined below for $t \ge 0$:

    Particle 1: $x_1 = \cos t, \quad y_1 = \sin t$

    Particle 2: $x_2 = \sin t, \quad y_2 = \cos t$

    Do their paths intersect, and do they collide?
  choices:
  - id: c1
    text: The paths intersect, but the particles do not collide.
  - id: c2
    text: The paths intersect and the particles collide at exactly one point per cycle.
  - id: c3
    text: The paths intersect and the particles collide at exactly two points per
      cycle.
  - id: c4
    text: The paths do not intersect.
  answer:
    choiceId: c3
  explanation: |-
    Both particles travel along the unit circle $x^2+y^2=1$, so their paths intersect completely. For collision, we need $\cos t = \sin t$ and $\sin t = \cos t$. This occurs when $\tan t = 1$, which happens at $t = \pi/4$ and $t = 5\pi/4$ in the interval $[0, 2\pi)$. Thus, they collide at two points per cycle.
- id: q-param-hard-8
  type: freeResponse
  title: Complex Parameterization 1
  prompt: |-
    Write a parameterization for the right half of the parabola $y = x^2 - 4x + 3$ starting at the vertex and moving to the right. Use $t$ as your parameter starting at $t=0$.
  answer:
    expected: |-
      A complete response provides $x(t)$ and $y(t)$ correctly restricted.
    gradingMode: selfCheck
    keyPoints:
    - Find the vertex at $x=2$.
    - Set $x(t) = t + 2$.
    - Set $y(t) = (t+2)^2 - 4(t+2) + 3 = t^2 - 1$.
  explanation: |-
    The vertex of the parabola is at $x = -(-4)/2(1) = 2$. The y-coordinate is $2^2 - 4(2) + 3 = -1$. Starting at the vertex and moving right, we can set $x(t) = t + 2$ for $t \ge 0$. Substituting this into $y$: $y(t) = (t+2)^2 - 4(t+2) + 3 = t^2 + 4t + 4 - 4t - 8 + 3 = t^2 - 1$.
- id: q-param-hard-9
  type: freeResponse
  title: Complex Parameterization 2
  prompt: |-
    Write a parameterization for the ellipse $9x^2 + 4y^2 = 36$ that starts at $(0, -3)$ and traces the ellipse counterclockwise, completing one revolution in $2\pi$ units of time.
  answer:
    expected: |-
      A complete response provides $x(t)$ and $y(t)$ reflecting the start point and direction.
    gradingMode: selfCheck
    keyPoints:
    - Divide by 36 to get $x^2/4 + y^2/9 = 1$, so $a=2, b=3$.
    - Start at $(0,-3)$ means at $t=0$, $x=0$ and $y=-3$.
    - 'Counterclockwise motion: $x(t) = 2\sin t$, $y(t) = -3\cos t$ (or equivalent
      phase shift).'
  explanation: |-
    The standard ellipse equation is $\frac{x^2}{4} + \frac{y^2}{9} = 1$. The standard counterclockwise parameterization is $x = 2\cos t, y = 3\sin t$, starting at $(2,0)$. To start at $(0,-3)$ and move counterclockwise (into Quadrant IV, so $x>0, y$ increasing), we can use a phase shift of $-\pi/2$, or directly write $x(t) = 2\sin t$ and $y(t) = -3\cos t$. Check $t=0$: $x=0, y=-3$. Check $t=\pi/2$: $x=2, y=0$. This is counterclockwise.
- id: q-param-hard-10
  type: freeResponse
  title: Complex Parameterization 3
  prompt: |-
    Parameterize the path consisting of the line segment from $(0,0)$ to $(2,4)$, followed by the line segment from $(2,4)$ to $(0,4)$. Define your piecewise functions for $x(t)$ and $y(t)$ for $0 \le t \le 2$.
  answer:
    expected: |-
      A complete response provides the piecewise definition.
    gradingMode: selfCheck
    keyPoints:
    - 'For $0 \le t \le 1$: $x(t) = 2t$, $y(t) = 4t$.'
    - 'For $1 < t \le 2$: $x(t) = 2 - 2(t-1) = 4 - 2t$.'
    - 'For $1 < t \le 2$: $y(t) = 4$.'
  explanation: |-
    Leg 1 ($0 \le t \le 1$): From $(0,0)$ to $(2,4)$. $\Delta x = 2, \Delta y = 4$. So $x_1(t) = 2t, y_1(t) = 4t$.
    Leg 2 ($1 \le t \le 2$): From $(2,4)$ to $(0,4)$. $\Delta x = -2, \Delta y = 0$. Using parameter $u = t-1$ from $0$ to $1$, $x_2(t) = 2 - 2(t-1) = 4 - 2t$ and $y_2(t) = 4$.
- id: q-param-hard-11
  type: symbolicResponse
  title: Complex Parameterization 4
  prompt: |-
    A circle of radius 3 rolls without slipping along the x-axis. The point $P$ on the circle starts at the origin $(0,0)$. The curve traced by $P$ is a cycloid. Provide the parameterization for $x(t)$ in terms of the angle $t$ the circle has rolled.
  answer:
    expectedLatex: 3(t - \sin t)
    equivalenceMode: expression
    variables:
    - t
    tolerance: 0.001
  explanation: |-
    The standard parameterization of a cycloid generated by a circle of radius $R$ rolling along the x-axis starting at the origin is $x(t) = R(t - \sin t)$ and $y(t) = R(1 - \cos t)$. Here $R=3$, so $x(t) = 3(t - \sin t)$.
- id: q-param-hard-12
  type: multipleChoice
  title: Domain Restrictions 1
  prompt: |-
    Consider the parametric curve $x = \sin t, \quad y = \cos^2 t$ for $-\infty < t < \infty$. What is the domain and range of the Cartesian curve?
  choices:
  - id: c1
    text: 'Domain: $[-1, 1]$, Range: $[0, 1]$'
  - id: c2
    text: 'Domain: $(-\infty, \infty)$, Range: $[0, 1]$'
  - id: c3
    text: 'Domain: $[-1, 1]$, Range: $(-\infty, \infty)$'
  - id: c4
    text: 'Domain: $(-\infty, \infty)$, Range: $(-\infty, \infty)$'
  answer:
    choiceId: c1
  explanation: |-
    Since $x = \sin t$, $x$ is restricted to $[-1, 1]$. Since $y = \cos^2 t$, $y$ is restricted to $[0, 1]$. The Cartesian equation is $y = 1 - x^2$, but it is only traced out for $x \in [-1, 1]$.
- id: q-param-hard-13
  type: multipleChoice
  title: Domain Restrictions 2
  prompt: |-
    Consider the parametric curve $x = e^t, \quad y = e^{3t}$. Which of the following describes the Cartesian curve and its domain?
  choices:
  - id: c1
    text: $y = x^3$ for $x > 0$
  - id: c2
    text: $y = x^3$ for all real $x$
  - id: c3
    text: $y = \ln(x^3)$ for $x > 0$
  - id: c4
    text: $y = e^{3x}$ for $x > 0$
  answer:
    choiceId: c1
  explanation: |-
    Since $x = e^t$ and $e^t$ is always positive, the domain is $x > 0$. Then $y = (e^t)^3 = x^3$. Therefore, the curve is $y = x^3$ for $x > 0$.
- id: q-param-hard-14
  type: multipleChoice
  title: Domain Restrictions 3
  prompt: |-
    Consider the curve defined by $x = \sec t, \quad y = \tan^2 t$ for $t \in (-\pi/2, \pi/2)$. What is the Cartesian equation and its domain?
  choices:
  - id: c1
    text: $y = x^2 - 1$ for $x \ge 1$
  - id: c2
    text: $y = x^2 - 1$ for $x \le -1$ or $x \ge 1$
  - id: c3
    text: $y = x^2 + 1$ for $x \ge 1$
  - id: c4
    text: $y = x^2 - 1$ for all real $x$
  answer:
    choiceId: c1
  explanation: |-
    We know $\sec^2 t - 1 = \tan^2 t$, so $x^2 - 1 = y$. For $t \in (-\pi/2, \pi/2)$, $\sec t \ge 1$, which means $x \ge 1$. Therefore, the curve is $y = x^2 - 1$ with domain $x \ge 1$.
- id: q-param-hard-15
  type: multipleChoice
  title: Domain Restrictions 4
  prompt: |-
    Consider the curve $x = t^2, \quad y = t^4 - 2t^2$. What is the lowest point reached by the curve?
  choices:
  - id: c1
    text: $(1, -1)$
  - id: c2
    text: $(0, 0)$
  - id: c3
    text: $(-1, -1)$
  - id: c4
    text: There is no lowest point.
  answer:
    choiceId: c1
  explanation: |-
    Eliminating $t$, we let $x = t^2$, which means $x \ge 0$. Then $y = x^2 - 2x$. This is a parabola opening upwards with vertex at $x = -(-2)/2(1) = 1$. The y-value at the vertex is $1^2 - 2(1) = -1$. Since $x=1 \ge 0$, this point is on the curve. Thus, the lowest point is $(1, -1)$.
