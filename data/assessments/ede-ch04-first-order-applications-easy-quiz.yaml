- id: q009
  type: multipleChoice
  skills:
  - ede-ch04-first-order-applications-curves
  prompt: If a family has slope $m$, an orthogonal trajectory has slope what?
  choices:
  - id: a
    text: |-
      $-1/m$, when $m
      e0$.
  - id: b
    text: $m$.
    issueSignals:
    - id: ede-orthogonal-slope-error
      domains: *id001
  - id: c
    text: $1/m$.
    issueSignals:
    - id: ede-orthogonal-slope-error
      domains: *id001
  - id: d
    text: $-m$.
    issueSignals:
    - id: ede-orthogonal-slope-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $-1/m$, when $m
    e0$.

    Why it works: Eliminating the family parameter gives its slope field, and perpendicular trajectories use the negative reciprocal slope.

    Why the other choices fail: The distractors retain the original slope or use a sign change/reciprocal that is not the negative reciprocal.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-curves
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
