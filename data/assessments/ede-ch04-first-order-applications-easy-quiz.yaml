questions:
- id: q001
  type: numericResponse
  skills:
  - ede-ch04-first-order-applications-growth-decay
  prompt: A quantity follows $Q'=0.3Q$ with $Q(0)=10$. What is $Q(2)$?
  answer:
    value: 18.221
    tolerance: 0.01
  explanation: |-
    Solution: $Q(2)=10e^{0.6}=18.221$.

    Why it works: A proportional-rate model produces an exponential transient whose sign, initial value, and limiting behavior determine the interpretation.
  difficultyDimensions:
  - modelOrDerivation
  - estimationOrBounds
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-growth-decay
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q002
  type: multipleChoice
  skills:
  - ede-ch04-first-order-applications-growth-decay
  prompt: For $Q'=a-kQ$ with $a,k>0$, what is the equilibrium?
  choices:
  - id: a
    text: $Q=a/k$.
  - id: b
    text: $Q=-a/k$.
    issueSignals:
    - id: ede-equilibrium-limiting-error
      domains: &id001
      - elementary-differential-equations-bvp
  - id: c
    text: $Q=ak$.
    issueSignals:
    - id: ede-equilibrium-limiting-error
      domains: *id001
  - id: d
    text: $Q=k/a$.
    issueSignals:
    - id: ede-equilibrium-limiting-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $Q=a/k$.

    Why it works: A proportional-rate model produces an exponential transient whose sign, initial value, and limiting behavior determine the interpretation.

    Why the other choices fail: The distractors reverse the rate sign, confuse equilibrium with initial data, or violate the exponential model's limit.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-growth-decay
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q003
  type: numericResponse
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  prompt: A body cools by $T'=-0.2(T-20)$ and starts at $70$. Find $T(5)$.
  answer:
    value: 38.394
    tolerance: 0.01
  explanation: |-
    Solution: $T=20+50e^{-0.2(5)}=38.394$.

    Why it works: The model follows a signed balance: ambient temperature defines the cooling equilibrium, while flow times concentration defines each solute rate.
  difficultyDimensions:
  - modelOrDerivation
  - estimationOrBounds
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-cooling-mixing
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q004
  type: multipleChoice
  skills:
  - ede-ch04-first-order-applications-cooling-mixing
  prompt: Which expression is the salt-out rate for a 100-L well-mixed tank with outflow 4 L/min and amount $Q$
    kg?
  choices:
  - id: a
    text: $4Q/100$ kg/min.
  - id: b
    text: $4Q$ kg/min.
    issueSignals:
    - id: ede-mixing-concentration-error
      domains: *id001
  - id: c
    text: $Q/4$ kg/min.
    issueSignals:
    - id: ede-mixing-concentration-error
      domains: *id001
  - id: d
    text: $100Q/4$ kg/min.
    issueSignals:
    - id: ede-mixing-concentration-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $4Q/100$ kg/min.

    Why it works: The model follows a signed balance: ambient temperature defines the cooling equilibrium, while flow times concentration defines each solute rate.

    Why the other choices fail: The distractors omit the ambient shift, misuse amount as concentration, freeze a changing volume, or reverse a balance sign.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-cooling-mixing
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q005
  type: multipleChoice
  skills:
  - ede-ch04-first-order-applications-mechanics
  prompt: Terminal velocity occurs when which condition holds?
  choices:
  - id: a
    text: The net force is zero, so acceleration is zero.
  - id: b
    text: Position is zero.
    issueSignals:
    - id: ede-terminal-velocity-error
      domains: *id001
  - id: c
    text: Mass is zero.
    issueSignals:
    - id: ede-terminal-velocity-error
      domains: *id001
  - id: d
    text: Time is zero.
    issueSignals:
    - id: ede-terminal-velocity-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The net force is zero, so acceleration is zero.

    Why it works: Newton's law uses a declared positive direction, includes the mass factor, and makes resistance oppose velocity.

    Why the other choices fail: The distractors omit mass, reverse resistance, or impose a condition unrelated to zero acceleration.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-mechanics
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
- id: q006
  type: multipleChoice
  skills:
  - ede-ch04-first-order-applications-autonomous-phase
  prompt: What feature identifies an autonomous equation?
  choices:
  - id: a
    text: Its right side has no explicit independent variable.
  - id: b
    text: It has no dependent variable.
    issueSignals:
    - id: ede-autonomous-stability-error
      domains: *id001
  - id: c
    text: It has no derivative.
    issueSignals:
    - id: ede-autonomous-stability-error
      domains: *id001
  - id: d
    text: It always has one equilibrium.
    issueSignals:
    - id: ede-autonomous-stability-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Its right side has no explicit independent variable.

    Why it works: The sign of the autonomous rate between its zeros determines phase-line direction and stability.

    Why the other choices fail: The distractors classify a zero without checking neighboring signs or reverse the phase-line arrows.
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch04-first-order-applications-autonomous-phase
  difficultyEvidence: Requires applying the named method or model and checking a distinct state, condition, or interpretation.
