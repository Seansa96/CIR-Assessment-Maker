glossary:
  sections:
    - title: "Core Terminology"
      entries:
        - term: "Root Node"
          definition: "The top node in a tree. It is the only node without a parent."
        - term: "Leaf Node"
          definition: "A node with no children."
        - term: "Height"
          definition: "The length of the longest downward path to a leaf from a given node."
        - term: "Binary Search Tree (BST)"
          definition: "A binary tree where the left child contains a smaller value than the parent, and the right child contains a larger value."
