lesson:
  introduction: |-
    A major application of Calculus 2 is finding the volume of "solids of revolution". These are 3D objects created by taking a flat 2D region and spinning it around an axis. Developing the intuition to visualize these shapes in your head is critical.
  sections:
  - id: sec-spinning-rectangles
    title: Spinning a Single Rectangle
    required: true
    content: |-
      Instead of trying to visualize the entire solid at once, start by visualizing a single slice.
      
      Imagine drawing a single vertical rectangle in a 2D region. Now, take that flat rectangle and spin it $360^\circ$ around a horizontal axis. What 3D shape does it trace out?
      
      It forms a **Disk** (a very short cylinder). 
      - The **radius** of the disk is the height of the rectangle (the distance from the axis of rotation to the top of the curve).
      - The **thickness** of the disk is the width of the rectangle ($dx$).
      
      The volume of a cylinder is $V = \pi r^2 h$. For our infinitesimal disk, this becomes $dV = \pi r^2\,dx$.

  - id: sec-hollow-centers
    title: Creating Hollow Centers (Washers)
    required: true
    content: |-
      Now, what if the rectangle is floating *above* the axis of rotation, with empty space between the bottom of the rectangle and the axis?
      
      When you spin this floating rectangle, it sweeps out a disk with a hole punched through the middle. We call this shape a **Washer**.
      
      To find the area of the face of the washer, you take the area of the large outer circle and subtract the area of the smaller inner circle:
      $$A = \pi R_{outer}^2 - \pi r_{inner}^2$$
      
      Multiply by the thickness $dx$ to get the volume of the slice, and integrate to add them all up!
      
      By breaking the solid down into these geometric components—disks and washers—you never have to memorize complex formulas. You just construct the geometry logically.

questions:
- id: q-geom-int2-1
  title: Concept Check - The Disk Method
  prompt: |-
    If you spin a rectangle of height $r$ and width $dx$ around an axis that touches its base, what is the volume of the resulting 3D slice?
  type: multipleChoice
  choices:
  - id: c1
    text: $2\pi r\,dx$
  - id: c2
    text: $\pi r^2\,dx$
  - id: c3
    text: $\frac{1}{3}\pi r^2\,dx$
  answer:
    choiceId: c2
  explanation: |-
    The spun rectangle forms a short cylinder (a disk). The volume of a cylinder is $\pi \times (\text{radius})^2 \times (\text{height})$. Here, the radius is $r$ and the "height" (thickness) is $dx$, yielding $\pi r^2\,dx$.
  skills:
  - geometric-intuition

- id: q-geom-int2-2
  title: Concept Check - The Washer Method
  prompt: |-
    Why does the formula for a washer use $\pi R^2 - \pi r^2$ instead of $\pi (R - r)^2$?
  type: multipleChoice
  choices:
  - id: c1
    text: Because $\pi (R - r)^2$ calculates the volume of a sphere instead.
  - id: c2
    text: Because you are subtracting the area of the inner "hole" circle from the area of the total outer circle.
  - id: c3
    text: Because algebraic squares can be distributed.
  answer:
    choiceId: c2
  explanation: |-
    Geometrically, a washer is a large solid disk with a smaller disk removed from the center. You find the area of the large outer circle ($\pi R^2$) and subtract the area of the inner hole ($\pi r^2$). $(R - r)^2$ would represent a completely different shape.
  skills:
  - geometric-intuition
