questions:
- id: q1
  type: numericResponse
  prompt: How many significant figures are in $0.00450$?
  answer:
    value: 3
    tolerance: 0.03
  explanation: 'Solution: Leading zeros are not significant; the digits 4, 5, and the trailing 0 are significant,
    so the count is 3.


    Why it works: A trailing zero to the right of a decimal records measured precision.'
  difficultyDimensions:
  - significantFigures
  - decimalNotation
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q2
  type: numericResponse
  prompt: Calculate $12.11 + 0.3$ and report with the correct number of decimal places.
  answer:
    value: 12.4
    tolerance: 0.12400000000000001
  explanation: 'Solution: $12.11+0.3=12.41$, then round to one decimal place: $12.4$.


    Why it works: For addition, the least precise decimal place controls the result.'
  difficultyDimensions:
  - additionRounding
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q3
  type: numericResponse
  prompt: Calculate $4.56\times1.4$ and report with the correct significant figures.
  answer:
    value: 6.4
    tolerance: 0.064
  explanation: 'Solution: $4.56\times1.4=6.384$, which rounds to $6.4$.


    Why it works: For multiplication, the factor with two significant figures limits the product.'
  difficultyDimensions:
  - multiplicationRounding
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q4
  type: multipleChoice
  prompt: Which is the normalized scientific notation for $0.0006020$?
  choices:
  - id: a
    text: $6.020\times10^{-4}$
    issueSignals: []
  - id: b
    text: $60.20\times10^{-5}$
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: c
    text: $6.020\times10^{4}$
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: d
    text: $0.6020\times10^{-3}$
    issueSignals:
    - id: stoichiometry-ratio-error
  answer:
    choiceId: a
  explanation: 'Solution: Move the decimal four places right: $6.020\times10^{-4}$.


    Why it works: Normalized scientific notation has a coefficient from 1 up to, but not including, 10.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - scientificNotation
  - exponentDirection
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q5
  type: numericResponse
  prompt: A sample has mass $18.25\ \mathrm{g}$ and volume $6.50\ \mathrm{mL}$. Find its density in $\mathrm{g/mL}$.
  answer:
    value: 2.81
    tolerance: 0.0281
  explanation: 'Solution: $d=m/V=18.25/6.50=2.8077$, reported as $2.81\ \mathrm{g/mL}$.


    Why it works: Density is an intensive ratio of mass to volume; 6.50 supplies three significant figures.'
  difficultyDimensions:
  - densityModel
  - significantFigures
  - units
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q6
  type: numericResponse
  prompt: A liquid has density $0.789\ \mathrm{g/mL}$. What volume is occupied by $15.0\ \mathrm{g}$?
  answer:
    value: 19.0
    tolerance: 0.19
  explanation: 'Solution: $V=m/d=15.0/0.789=19.011$, so $19.0\ \mathrm{mL}$.


    Why it works: Rearranging $d=m/V$ gives volume, and units of grams cancel.'
  difficultyDimensions:
  - densityRearrangement
  - units
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q7
  type: multipleChoice
  prompt: Four masses are 9.98, 9.99, 9.98, and 9.99 g. The accepted mass is 10.50 g. Which description
    is best?
  choices:
  - id: a
    text: Precise but inaccurate
    issueSignals: []
  - id: b
    text: Accurate but imprecise
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: c
    text: Both accurate and precise
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: d
    text: Neither accurate nor precise
    issueSignals:
    - id: stoichiometry-ratio-error
  answer:
    choiceId: a
  explanation: 'Solution: The measurements cluster tightly near 9.99 g but are far from 10.50 g.


    Why it works: Precision concerns repeatability; accuracy concerns closeness to the accepted value.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - accuracyVsPrecision
  - dataInterpretation
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q8
  type: numericResponse
  prompt: A measured length is $2.345\ \mathrm{cm}$ and the accepted length is $2.500\ \mathrm{cm}$. Find
    the percent error.
  answer:
    value: 6.2
    tolerance: 0.062000000000000006
  explanation: 'Solution: $|2.345-2.500|/2.500\times100=6.20\%$, reported as $6.2\%$.


    Why it works: Percent error compares the magnitude of the discrepancy with the accepted value.'
  difficultyDimensions:
  - percentError
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q9
  type: multipleChoice
  prompt: Which quantity is exact and therefore does not limit significant figures?
  choices:
  - id: a
    text: 12 eggs in a carton
    issueSignals: []
  - id: b
    text: 12.0 mL delivered by a cylinder
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: c
    text: 0.60 g measured on a balance
    issueSignals:
    - id: stoichiometry-ratio-error
  - id: d
    text: 21.3 °C read from a probe
    issueSignals:
    - id: stoichiometry-ratio-error
  answer:
    choiceId: a
  explanation: 'Solution: The number of eggs is counted, not measured.


    Why it works: Counted objects and defined conversion factors are exact; instrument readings carry
    uncertainty.


    Why the other choices fail: b does not follow the stated relationship or reporting rule; c does not
    follow the stated relationship or reporting rule; d does not follow the stated relationship or reporting
    rule.'
  difficultyDimensions:
  - exactNumbers
  - measurementUncertainty
  difficultyEvidence: Requires interpreting quantitative evidence and rejecting a specific, plausible
    alternative.
  issueSignals:
  - id: stoichiometry-ratio-error
- id: q10
  type: numericResponse
  prompt: Convert $27.0\ ^\circ\mathrm{C}$ to kelvin. Use $K=^\circ C+273.15$.
  answer:
    value: 300.2
    tolerance: 3.002
  explanation: 'Solution: $27.0+273.15=300.15\ \mathrm{K}$, rounded to one decimal place: $300.2\ \mathrm{K}$.


    Why it works: The Celsius reading fixes the tenths-place precision after the exact offset is added.'
  difficultyDimensions:
  - temperatureConversion
  - additionRounding
  - significantFigures
  difficultyEvidence: Requires selecting the governing relationship, tracking units, and reporting a constrained
    result.
  issueSignals:
  - id: stoichiometry-ratio-error
