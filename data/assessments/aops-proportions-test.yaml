schemaVersion: 1
id: aops-proportions-test
title: Proportions Chapter Test
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-proportions
modeDefault: scored
randomizeQuestions: true
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - art-of-problem-solving
  - aops-proportions
  - combined-ratios
  - mixtures
  - percent-analysis
skills:
- Solve multi-stage ratio and variation problems
- Analyze mixtures, successive percentages, and rates
- Apply dimensional scale factors correctly
- Justify proportional transformations and restrictions
questions:
- id: q001
  type: multipleChoice
  prompt: 'Positive quantities satisfy $p:q=2:3$ and $q:r=4:5$. If $p+q+r=175$, find $(p,q,r)$.'
  choices:
  - id: a
    text: '$(40,60,75)$'
  - id: b
    text: '$(35,60,80)$'
  - id: c
    text: '$(50,50,75)$'
  - id: d
    text: '$(20,30,125)$'
  answer:
    choiceId: a
  explanation: The combined ratio is $8:12:15$, totaling 35 parts; each part is 5.
- id: q002
  type: multipleChoice
  prompt: 'A machine makes 180 parts in 12 minutes. At the same rate, how many parts does it make in 35 minutes?'
  choices:
  - id: a
    text: '420'
  - id: b
    text: '480'
  - id: c
    text: '525'
  - id: d
    text: '630'
  answer:
    choiceId: c
  explanation: The unit rate is 15 parts per minute, so $15(35)=525$.
- id: q003
  type: multipleChoice
  prompt: 'A 4-person team needs 18 days for a fixed job. If 2 equally productive people join before work starts, how many days are needed?'
  choices:
  - id: a
    text: '9 days'
  - id: b
    text: '12 days'
  - id: c
    text: '16 days'
  - id: d
    text: '27 days'
  answer:
    choiceId: b
  explanation: The job requires $4(18)=72$ person-days, and $72/6=12$.
- id: q004
  type: multipleChoice
  prompt: 'A $120 item is discounted 20% and then taxed 10% on the discounted price. What is the final price?'
  choices:
  - id: a
    text: '$105.60'
  - id: b
    text: '$108.00'
  - id: c
    text: '$110.00'
  - id: d
    text: '$112.00'
  answer:
    choiceId: a
  explanation: |-
    Apply the factors in order: $120(0.80)(1.10)=105.60$.
- id: q005
  type: multipleChoice
  prompt: 'A 12-ounce drink is 25% juice. How many ounces of pure juice must be added to make it 40% juice?'
  choices:
  - id: a
    text: '2 ounces'
  - id: b
    text: '3 ounces'
  - id: c
    text: '4 ounces'
  - id: d
    text: '5 ounces'
  answer:
    choiceId: b
  explanation: Initial juice is 3 ounces. Solve $(3+x)/(12+x)=0.40$ to get $x=3$.
- id: q006
  type: multipleChoice
  prompt: 'A milk-water mixture has ratio $7:3$ and total volume 45 liters. How much water does it contain?'
  choices:
  - id: a
    text: '10.5 liters'
  - id: b
    text: '13.5 liters'
  - id: c
    text: '18 liters'
  - id: d
    text: '31.5 liters'
  answer:
    choiceId: b
  explanation: Water is $3/(7+3)=3/10$ of 45 liters.
- id: q007
  type: multipleChoice
  prompt: 'A runner increases speed from 8 km/h to 10 km/h. For a fixed distance, by what percent does travel time decrease?'
  choices:
  - id: a
    text: '10%'
  - id: b
    text: '20%'
  - id: c
    text: '25%'
  - id: d
    text: '80%'
  answer:
    choiceId: b
  explanation: Time varies inversely with speed, so the new time is $8/10=0.8$ of the old time.
- id: q008
  type: multipleChoice
  prompt: 'A class has girls to boys in ratio $5:4$. After 6 girls leave, the ratio is $7:6$. What was the original class size?'
  choices:
  - id: a
    text: '81'
  - id: b
    text: '126'
  - id: c
    text: '144'
  - id: d
    text: '162'
  answer:
    choiceId: d
  explanation: Set counts to $5k,4k$ and solve $(5k-6)/(4k)=7/6$, obtaining $k=18$ and total $9k=162$.
- id: q009
  type: multipleChoice
  prompt: 'How many liters of 15% solution and 45% solution make 20 liters of 30% solution?'
  choices:
  - id: a
    text: 5 liters of 15% and 15 liters of 45%
  - id: b
    text: 8 liters of 15% and 12 liters of 45%
  - id: c
    text: 10 liters of each
  - id: d
    text: 15 liters of 15% and 5 liters of 45%
  answer:
    choiceId: c
  explanation: The target concentration is halfway between 15% and 45%, so equal amounts work; the component equation confirms it.
- id: q010
  type: multipleChoice
  prompt: 'Similar rectangles have corresponding side ratio $2:5$. What is their area ratio?'
  choices:
  - id: a
    text: '$2:5$'
  - id: b
    text: '$4:10$'
  - id: c
    text: '$4:25$'
  - id: d
    text: '$8:125$'
  answer:
    choiceId: c
  explanation: Area scales by the square of the linear ratio.
- id: q011
  type: multipleChoice
  prompt: 'A currency exchange charges 2% of $500, then converts the remainder at 0.90 euro per dollar. How many euros are received?'
  choices:
  - id: a
    text: '€432'
  - id: b
    text: '€441'
  - id: c
    text: '€450'
  - id: d
    text: '€459'
  answer:
    choiceId: b
  explanation: The fee leaves $0.98(500)=490$ dollars, and $490(0.90)=441$ euros.
- id: q012
  type: multipleChoice
  prompt: 'A recipe for 8 servings uses 1.5 cups of rice. With 4.875 cups, what is the greatest whole number of servings possible?'
  choices:
  - id: a
    text: '24'
  - id: b
    text: '25'
  - id: c
    text: '26'
  - id: d
    text: '27'
  answer:
    choiceId: c
  explanation: The exact scale gives $8(4.875/1.5)=26$ servings.
- id: q013
  type: selectAll
  prompt: 'Select every correct scale statement for similar figures with linear factor $s>0$.'
  choices:
  - id: a
    text: Corresponding lengths scale by $s$.
  - id: b
    text: Perimeters scale by $s$.
  - id: c
    text: Areas scale by $s^2$.
  - id: d
    text: Volumes scale by $s^2$.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: Volume contains three length dimensions and scales by $s^3$.
- id: q014
  type: selectAll
  prompt: 'Which statements correctly distinguish proportional models?'
  choices:
  - id: a
    text: Direct variation keeps a ratio constant.
  - id: b
    text: Inverse variation keeps a product constant.
  - id: c
    text: Any relationship with a constant difference is direct variation.
  - id: d
    text: Cross multiplication requires an actual equality of defined ratios.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: A constant difference can describe $y=x+1$, whose ratio is not constant.
- id: q015
  type: freeResponse
  prompt: |-
    Derive cross multiplication from $a/b=c/d$, and explain why the assumptions $b\ne0$ and $d\ne0$ are necessary.
  answer:
    gradingMode: selfCheck
    expected: |-
      Because $b$ and $d$ are nonzero, multiply both sides by $bd$. This gives $ad=bc$. The restrictions are necessary because if either denominator were zero, the original ratio equation would be undefined, even though the cross-product equation might still be a meaningful-looking statement.
    keyPoints:
    - States both nonzero denominator restrictions.
    - Multiplies the full equation by $bd$.
    - Obtains $ad=bc$ and explains why it is derived rather than assumed.
  explanation: Cross multiplication is denominator clearing applied to a defined proportion.
