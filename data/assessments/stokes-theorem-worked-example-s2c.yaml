  - id: s003
    title: Match orientation
    instruction: What is the circulation?
    type: multipleChoice
    prompt: What is the circulation?
    choices:
    - id: a
      text: pi
    - id: b
      text: <0,0,1> (answers 'What is curl F?', not 'What is the circulation?')
      issueSignals:
      - id: stokes-orientation-theorem-selection-error
    - id: c
      text: Curl (answers 'What field operation appears in Stokes' Theorem?', not 'What is the circulation?')
      issueSignals:
      - id: sign-error
