workedExamples:
- id: example-001
  title: Build the representation
  problem: Use Stokes' Theorem for F=<-y/2,x/2,0> around the counterclockwise unit circle in the xy-plane.
  steps:
  - id: s001
    title: Find curl
    instruction: What is curl F?
    type: multipleChoice
    prompt: What is curl F?
    choices:
    - id: a
      text: <0,0,1>
    - id: b
      text: Stokes' Theorem (answers 'Which theorem is appropriate for circulation around a space-curve boundary?', not 'What
        is curl F?')
      issueSignals:
      - id: stokes-orientation-theorem-selection-error
    - id: c
      text: 2pi (answers 'For curl F=<0,0,2> through the upward unit disk, what is the flux?', not 'What is curl F?')
      issueSignals:
      - id: sign-error
    - id: d
      text: Its boundary orientation matches its normal (answers 'Which condition is required for a Stokes surface?', not
        'What is curl F?')
      issueSignals:
      - id: stokes-orientation-theorem-selection-error
    answer:
      choiceId: a
    issueSignals:
    - id: stokes-orientation-theorem-selection-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: <0,0,1>

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Parametric Surfaces and
      Surface Integrals.

      Why the other choices fail: Choice b, ''Stokes'' Theorem (answers ''Which theorem is appropriate for circulation around
      a space-curve boundary?'', not ''What is curl F?'')'', does not give ''<0,0,1>'' for ''What is curl F?''. It substitutes
      a different result, representation, or condition for the one the prompt specifies.

      Choice c, ''2pi (answers ''For curl F=<0,0,2> through the upward unit disk, what is the flux?'', not ''What is curl
      F?'')'', does not give ''<0,0,1>'' for ''What is curl F?''. It substitutes a different result, representation, or condition
      for the one the prompt specifies.

      Choice d, ''Its boundary orientation matches its normal (answers ''Which condition is required for a Stokes surface?'',
      not ''What is curl F?'')'', does not give ''<0,0,1>'' for ''What is curl F?''. It substitutes a different result, representation,
      or condition for the one the prompt specifies.'
  - id: s002
    title: Choose the disk
    instruction: What is the unit disk area?
    type: multipleChoice
    prompt: What is the unit disk area?
    choices:
    - id: a
      text: pi
    - id: b
      text: Its sign reverses (answers 'If a Stokes boundary orientation reverses while the surface normal stays fixed, what
        happens to the line integral?', not 'What is the unit disk area?')
      issueSignals:
