questions:
- id: q001
  type: multipleChoice
  prompt: |
    Which of Kepler's laws states that a line drawn from the Sun to a planet sweeps out equal areas in equal intervals of time?
  choices:
  - id: a
    text: "Kepler's First Law (Law of Ellipses)"
  - id: b
    text: "Kepler's Second Law (Law of Equal Areas)"
  - id: c
    text: "Kepler's Third Law (Law of Harmonies)"
  - id: d
    text: "Newton's Law of Universal Gravitation"
  answer:
    choiceId: b
  explanation: |
    Solution:
    Kepler's Second Law (Law of Equal Areas).
    
    Why it works:
    This law describes how a planet moves faster when it is closer to the sun and slower when it is farther away, such that the area swept out by the radius vector is constant over time.
    
    Why the other choices fail:
    The First Law describes the elliptical shape of orbits. The Third Law relates the orbital period to the semi-major axis. Newton's law describes the underlying force but is not one of Kepler's kinematic laws.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: |
    Calculate the orbital speed $v$ in m/s of a satellite in a circular orbit of radius $r = 2.0 \times 10^7 \text{ m}$ around a planet of mass $M = 8.0 \times 10^{24} \text{ kg}$.
    Use $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$.
  answer:
    value: 5165.26
    tolerance: 10
  explanation: |
    Solution:
    $v = \sqrt{\frac{GM}{r}} = \sqrt{\frac{(6.67 \times 10^{-11})(8.0 \times 10^{24})}{2.0 \times 10^7}}$.
    $v = \sqrt{\frac{53.36 \times 10^{13}}{2.0 \times 10^7}} = \sqrt{2.668 \times 10^7} = \sqrt{26680000} \approx 5165.26 \text{ m/s}$.
    
    Why it works:
    This is a direct application of the orbital velocity formula derived by equating gravitational force to centripetal force.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
