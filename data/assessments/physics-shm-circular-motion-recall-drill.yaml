items:
- {id: shmc-r1, type: cloze, prompt: 'SHM position can be $x={{A\cos(\omega t+\phi)}}$.', answer: 'A\cos(\omega t+\phi)', explanation: 'Solution: Write $x=A\cos(\omega t+\phi)$. Why it works: this is the horizontal projection of uniform circular motion.'}
- {id: shmc-r2, type: typed, prompt: 'What circular-motion quantity equals SHM amplitude?', answer: radius, explanation: 'Solution: Use radius. Why it works: the projection ranges from negative to positive circle radius.'}
- {id: shmc-r3, type: cloze, prompt: 'For SHM, $a={{-\omega^2x}}$.', answer: '-\omega^2x', explanation: 'Solution: Use $a=-\omega^2x$. Why it works: acceleration is always directed toward equilibrium.'}
- {id: shmc-r4, type: typed, prompt: 'Where is SHM speed maximum?', answer: equilibrium, explanation: 'Solution: At equilibrium. Why it works: the reference particle has its projection velocity largest when displacement is zero.'}
- {id: shmc-r5, type: cloze, prompt: 'Maximum SHM speed is $v_{max}={{A\omega}}$.', answer: 'A\omega', explanation: 'Solution: Use $v_{max}=A\omega$. Why it works: it is the tangential speed of the reference-circle particle.'}
- {id: shmc-r6, type: typed, prompt: 'What is the reference-circle projection called?', answer: simple harmonic motion, explanation: 'Solution: Identify simple harmonic motion. Why it works: each coordinate of uniform circular motion varies sinusoidally.'}
