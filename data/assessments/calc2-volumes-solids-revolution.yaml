questions:
- id: q001
  type: freeResponse
  skills:
  - volumes-solids-revolution
  prompt: 'What is the fundamental idea behind defining volume using a definite integral?

    '
  answer:
    expected: 'Volume is defined as the limit of a Riemann sum of cross-sectional
      areas.

      The solid is sliced into thin pieces whose volumes are a\approximated and then
      summed.

      Taking the limit produces the exact volume.

      '
    gradingMode: selfCheck
  explanation: 'The volume formula


    $$

    V=\int_a^b A(x)\,dx

    $$


    comes from summing infinitely many cross-sectional slices of area $A(x)$.


    Related topic: Volumes by Cross-Sectional Area

    '
- id: q002
  type: multipleChoice
  skills:
  - volumes-solids-revolution
  prompt: 'In the formula


    $$

    V=\int_a^b A(x)\,dx

    $$


    what does $A(x)$ represent?

    '
  choices:
  - id: a
    text: The derivative of the boundary curve
  - id: b
    text: The cross-sectional area perpendicular to the axis of integration
  - id: c
    text: The circumference of the solid
  - id: d
    text: The radius of the solid
  answer:
    choiceId: b
  explanation: '$A(x)$ represents the area of the slice taken perpendicular to the
    axis of integration.


    Related topic: Cross-Sectional Area Functions

    '
- id: q003
  type: freeResponse
  skills:
  - volumes-solids-revolution
  prompt: 'Why does the formula


    $$

    V=A(b-a)

    $$


    correctly compute the volume of a cylinder?

    '
  answer:
    expected: 'Because the cross-sectional area is constant.

      Integrating a constant area over the height produces

      area multiplied by height.

      '
    gradingMode: selfCheck
  explanation: 'If $A(x)=A$,


    $$

    V=\int_a^b A\,dx=A(b-a)

    $$


    which is the familiar cylinder formula.


    Related topic: Constant Cross Sections and Cylinder Volume

    '
- id: q004
  type: multipleChoice
  skills:
  - volumes-solids-revolution
  prompt: 'When a region is revolved about an axis, the resulting solid is called:

    '
  choices:
  - id: a
    text: A prism
  - id: b
    text: A polyhedron
  - id: c
    text: A solid of revolution
  - id: d
    text: A frustum
  answer:
    choiceId: c
  explanation: 'Rotating a region about a line creates a solid of revolution.


    Related topic: Solids of Revolution

    '
- id: q005
  type: multipleChoice
  skills:
  - volumes-solids-revolution
  prompt: 'The graph of


    $$

    y=\sqrt{x}

    $$


    on $0\le x\le1$


    is revolved about the x-axis.


    Which method naturally arises?

    '
  media:
  - type: image
    src: /samples/volume-disk.svg
    alt: Disk method cross sections for a curve revolved around the x-axis
    caption: Circular slices appear when the region is revolved around the x-axis.
  choices:
  - id: a
    text: Disk Method
  - id: b
    text: Shell Method
  - id: c
    text: Integration by Parts
  - id: d
    text: Partial Fractions
  answer:
    choiceId: a
  explanation: 'Cross-sections perpendicular to the x-axis are disks.


    Related topic: Disk Method

    '
- id: q006
  type: freeResponse
  skills:
  - volumes-solids-revolution
  prompt: 'Explain why the area of a cross-sectional disk is


    $$

    A(x)=\pi r^2

    $$


    when using the disk method.

    '
  answer:
    expected: 'Each slice is a circle.

      The radius comes from the distance between the curve and the axis of rotation.

      The area of a circle is $\pi r^2$.

      '
    gradingMode: selfCheck
  explanation: 'Disk and washer methods both rely on computing circular cross-sectional
    areas.


    Related topic: Circular Cross Sections in Volume Problems

    '
- id: q007
  type: multipleChoice
  skills:
  - volumes-solids-revolution
  prompt: 'When a solid contains a\rhollow center, which volume method is typically
    used?

    '
  choices:
  - id: a
    text: Disk Method
  - id: b
    text: Washer Method
  - id: c
    text: Substitution
  - id: d
    text: Shell Method only
  answer:
    choiceId: b
  explanation: 'A washer is a disk with the inner circular area removed.


    Related topic: Washer Method

    '
- id: q008
  type: freeResponse
  skills:
  - volumes-solids-revolution
  prompt: 'Explain the meaning of the washer formula


    $$

    A(x)=\pi R(x)^2-\pi r(x)^2

    $$

    '
  answer:
    expected: 'The outer circle contributes area $\pi R^2$.

      The inner circular\rhole contributes area $\pi r^2$.

      Subtracting gives the area of the washer.

      '
    gradingMode: selfCheck
  explanation: 'A washer is simply an outer disk minus an inner disk.


    Related topic: Washer Area Formula

    '
- id: q009
  type: numericResponse
  skills:
  - volumes-solids-revolution
  prompt: 'Compute the disk-method volume


    $$

    V=\pi\int_0^2 x^2\,dx

    $$


    Enter a decimal a\approximation.

    '
  answer:
    value: 8.37758
    tolerance: 0.01
  explanation: 'The antiderivative is


    $$

    \pi\left[\frac{x^3}{3}\right]_0^2=\frac{8\pi}{3}

    $$


    so any value within $0.01$ of $8.37758$ is accepted.


    Related topic: Evaluating Disk Method Integrals

    '
- id: q010
  type: freeResponse
  skills:
  - volumes-solids-revolution
  prompt: 'Why can the volume of a pyramid be found using cross-sectional areas?

    '
  answer:
    expected: 'Because the cross-sectional area changes continuously from the base
      to the apex.

      Integrating these areas over the height accumulates the entire volume.

      '
    gradingMode: selfCheck
  explanation: 'The pyramid is treated as a continuous collection of shrinking cross-sections.


    Related topic: Volumes from Variable Cross Sections

    '
- id: q011
  type: freeResponse
  skills:
  - volumes-solids-revolution
  prompt: 'What problem does the formula


    $$

    V=\int_a^b A(x)\,dx

    $$


    solve that ordinary geometry formulas cannot?

    '
  answer:
    expected: 'It allows us to find volumes of solids whose cross-sectional areas
      change continuously and cannot be described by simple geometric formulas.

      '
    gradingMode: selfCheck
  explanation: 'The power of integration is that it generalizes volume computation
    to arbitrary solids.


    Related topic: General Volume Integration

    '
