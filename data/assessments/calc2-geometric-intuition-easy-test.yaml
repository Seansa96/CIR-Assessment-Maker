questions:
- id: q-int-et-1
  title: The Area Slices
  prompt: |-
    If you slice the area bounded by $y=f(x)$, $y=0$, $x=a$, and $x=b$ vertically, what is the height of each infinitesimal rectangle?
  type: multipleChoice
  choices:
  - id: c1
    text: $dx$
  - id: c2
    text: $f(x)$
  - id: c3
    text: $b - a$
  - id: c4
    text: $x$
  answer:
    choiceId: c2
  explanation: |-
    The height of each vertical rectangle at position $x$ is given by the function value $f(x)$. The width is $dx$.
  skills:
  - geometric-intuition

- id: q-int-et-2
  title: Disks vs Washers
  prompt: |-
    When revolving a region around the x-axis, when must you use the Washer Method instead of the Disk Method?
  type: multipleChoice
  choices:
  - id: c1
    text: When the region is a perfect circle.
  - id: c2
    text: When the region does not fully touch the axis of revolution.
  - id: c3
    text: When integrating with respect to $y$.
  answer:
    choiceId: c2
  explanation: |-
    If there is a gap between the region and the axis of revolution, spinning the region creates a hollow center. Slicing this solid perpendicular to the axis produces a shape with a hole (a washer) rather than a solid circle (a disk).
  skills:
  - geometric-intuition

- id: q-int-et-3
  title: Arc Length Intuition
  prompt: |-
    To find the length of a curve, we approximate the curve using infinitely many tiny straight line segments. Which theorem provides the formula for the length of these tiny segments?
  type: multipleChoice
  choices:
  - id: c1
    text: The Fundamental Theorem of Calculus
  - id: c2
    text: The Pythagorean Theorem
  - id: c3
    text: The Mean Value Theorem
  answer:
    choiceId: c2
  explanation: |-
    A tiny line segment on the curve acts as the hypotenuse of a right triangle with width $dx$ and height $dy$. The Pythagorean Theorem gives the length as $ds = \sqrt{dx^2 + dy^2}$, which leads directly to the arc length formula.
  skills:
  - geometric-intuition
