glossary:
  introduction: Use these terms to make quantitative chemistry decisions precisely.
  sections:
  - id: terms
    title: Core terms
    entries:
    - id: e1
      term: accuracy
      definition: Closeness to an accepted value.
      drills:
      - id: d1
        type: flashcard
        prompt: Define accuracy.
        answer:
          expected: closeness to an accepted value
        explanation: 'Solution: closeness to an accepted value. Why it works: Closeness to an accepted value.'
    - id: e2
      term: precision
      definition: Closeness of repeated measurements to one another.
      drills:
      - id: d2
        type: flashcard
        prompt: Define precision.
        answer:
          expected: closeness of repeated measurements
        explanation: 'Solution: closeness of repeated measurements. Why it works: Closeness of repeated measurements to one
          another.'
    - id: e3
      term: uncertainty
      definition: The estimated range around a measured value.
      drills:
      - id: d3
        type: flashcard
        prompt: Define uncertainty.
        answer:
          expected: estimated range around a measurement
        explanation: 'Solution: estimated range around a measurement. Why it works: The estimated range around a measured
          value.'
    - id: e4
      term: significant figures
      definition: Digits justified by a measurement, including one estimated digit.
      drills:
      - id: d4
        type: flashcard
        prompt: Define significant figures.
        answer:
          expected: justified measured digits
        explanation: 'Solution: justified measured digits. Why it works: Digits justified by a measurement, including one
          estimated digit.'
    - id: e5
      term: scientific notation
      definition: A coefficient from 1 to 10 multiplied by a power of ten.
      drills:
      - id: d5
        type: flashcard
        prompt: Define scientific notation.
        answer:
          expected: coefficient times a power of ten
        explanation: 'Solution: coefficient times a power of ten. Why it works: A coefficient from 1 to 10 multiplied by a
          power of ten.'
    - id: e6
      term: density
      definition: Mass per unit volume.
      drills:
      - id: d6
        type: flashcard
        prompt: Define density.
        answer:
          expected: mass per unit volume
        explanation: 'Solution: mass per unit volume. Why it works: Mass per unit volume.'
