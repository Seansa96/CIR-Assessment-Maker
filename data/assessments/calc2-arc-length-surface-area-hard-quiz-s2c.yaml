authoring: { visualRequirement: required, visualRationale: 'Every item benefits from marking a differential arc segment, its radius to the rotation axis, or both.', difficultyTier: hard }
questions:
  - { id: q001, type: symbolicResponse, prompt: 'Find the exact arc length of $y=x^{3/2}$ from $x=0$ to $x=1$.', answer: { expectedLatex: '(13\sqrt{13}-8)/54', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=(3/2)\sqrt{x}$, so $L=\int_0^1\sqrt{1+9x/4}\,dx$. With $u=1+9x/4$, $L=(4/27)[u^{3/2}]_1^{13/4}=(13\sqrt{13}-8)/54$. Why it works: Arc length accumulates the hypotenuse $ds=\sqrt{dx^2+dy^2}$. Common trap: Do not integrate $1+(y'')^2$ without the square root.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, simplification], difficultyEvidence: 'Builds the differential-length model, substitutes into a radical integral, and simplifies a fractional endpoint.' }
  - { id: q002, type: symbolicResponse, prompt: 'Find the exact arc length of $y=(2/3)x^{3/2}$ from $x=0$ to $x=3$.', answer: { expectedLatex: '14/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=\sqrt{x}$, so $L=\int_0^3\sqrt{1+x}\,dx=(2/3)[(1+x)^{3/2}]_0^3=(2/3)(8-1)=14/3$. Why it works: The derivative creates a perfect linear expression under the arc-length radical. Common trap: The exponent $3/2$ is on $1+x$, not on x alone after the substitution.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Requires differentiating a fractional power, recognizing a simple radical antiderivative, and evaluating exact bounds.' }
  - { id: q003, type: symbolicResponse, prompt: 'Rotate $y=\sqrt{x}$, $0\le x\le4$, about the x-axis. Find the exact surface area.', answer: { expectedLatex: '\pi(17\sqrt{17}-1)/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=1/(2\sqrt{x})$. Then $S=2\pi\int_0^4\sqrt{x}\sqrt{1+1/(4x)}dx=\pi\int_0^4\sqrt{4x+1}\,dx=\pi[(4x+1)^{3/2}/6]_0^4=\pi(17\sqrt{17}-1)/6$. Why it works: Surface area is circumference $2\pi y$ times the slanted differential length $ds$. Common trap: The apparent derivative singularity at 0 cancels in the product; do not discard the endpoint without checking the simplified integrand.', difficultyDimensions: [simplification, modelOrDerivation, domainCondition], difficultyEvidence: 'Combines a radical radius and derivative, cancels a boundary singularity, and evaluates an exact shifted-radical integral.' }
  - { id: q004, type: symbolicResponse, prompt: 'Rotate $y=2\sqrt{x}$, $0\le x\le1$, about the x-axis. Find the exact surface area.', answer: { expectedLatex: '(8\pi/3)(2\sqrt{2}-1)', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=1/\sqrt{x}$. Thus $y\sqrt{1+(y'')^2}=2\sqrt{x}\sqrt{(x+1)/x}=2\sqrt{x+1}$. Therefore $S=4\pi\int_0^1\sqrt{x+1}dx=(8\pi/3)(2\sqrt2-1)$. Why it works: Simplifying the complete product is safer than trying to integrate the factors separately. Common trap: $2\sqrt{x}$ is the radius, whereas $\sqrt{1+(y'')^2}$ is the slope correction.', difficultyDimensions: [simplification, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Separates radius from slope correction, simplifies a radical product, and integrates a shifted power.' }
  - { id: q005, type: freeResponse, prompt: 'A student uses $2\pi\int_0^2x\,dx$ for the surface made by rotating $y=x$ from 0 to 2 about the y-axis. Identify the missing factor and give the correct surface area.', answer: { gradingMode: selfCheck, keyPoints: ['missing square root of one plus derivative squared', 'derivative is one', 'surface area is four pi square root two'] }, explanation: 'Solution: The missing factor is $ds/dx=\sqrt{1+(y'')^2}=\sqrt2$. The radius to the y-axis is x, so $S=2\pi\int_0^2x\sqrt2\,dx=4\pi\sqrt2$. Why it works: A curve segment is longer than its horizontal projection unless it is horizontal. Common trap: $2\pi r\,dx$ is a cylindrical-band approximation only when the curve is horizontal.', difficultyDimensions: [errorDiagnosis, reverseReasoning, modelOrDerivation], difficultyEvidence: 'Reconstructs a missing geometric differential from an incomplete circumference integral.' }
  - { id: q006, type: symbolicResponse, prompt: 'Find the arc length of $y=\ln(\cos x)$ on $0\le x\le\pi/4$.', answer: { expectedLatex: '\ln(1+\sqrt{2})', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=-\tan x$, so $\sqrt{1+(y'')^2}=\sqrt{1+\tan^2x}=\sec x$ on this interval. Hence $L=\int_0^{\pi/4}\sec x\,dx=\ln|\sec x+\tan x|_0^{\pi/4}=\ln(1+\sqrt2)$. Why it works: The identity $1+\tan^2x=\sec^2x$ converts the arc-length radical into an integrable function. Common trap: The square root of $\sec^2x$ is $|\sec x|$; it is positive here because the interval lies in the first quadrant.', difficultyDimensions: [identityConstruction, domainCondition, auxiliaryTechnique], difficultyEvidence: 'Uses a trigonometric identity, checks the sign needed to remove an absolute value, and integrates secant.' }
  - { id: q007, type: symbolicResponse, prompt: 'Find the exact arc length of $y=(2x+1)^{3/2}/3$ from $x=0$ to $x=4$.', answer: { expectedLatex: '(10\sqrt{10}-2\sqrt{2})/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=\sqrt{2x+1}$, so $L=\int_0^4\sqrt{2x+2}\,dx=[(2x+2)^{3/2}/3]_0^4=(10\sqrt{10}-2\sqrt2)/3$. Why it works: The derivative is chosen so that the arc-length expression becomes one shifted radical. Common trap: The derivative of $(2x+1)^{3/2}/3$ includes the chain-rule factor 2, which cancels the denominator 3 only after applying the power rule correctly.', difficultyDimensions: [auxiliaryTechnique, simplification, modelOrDerivation], difficultyEvidence: 'Requires chain-rule differentiation, radical simplification, and exact endpoint evaluation.' }
  - { id: q008, type: symbolicResponse, prompt: 'Rotate the line segment $y=3-x$ for $0\le x\le3$ about the x-axis. Find the surface area and explain why its radius changes.', answer: { expectedLatex: '9\pi\sqrt{2}', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $y''=-1$, so $S=2\pi\int_0^3(3-x)\sqrt2\,dx=2\pi\sqrt2[3x-x^2/2]_0^3=9\pi\sqrt2$. Why it works: The radius is the vertical distance $y=3-x$ to the x-axis, so it decreases continuously to zero. Common trap: Using constant radius 3 would describe a cylinder, not the cone swept by the segment.', difficultyDimensions: [modelOrDerivation, representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Maps a line segment to a variable radius, distinguishes a cone from a cylinder, and integrates the slant correction.' }
  - { id: q009, type: symbolicResponse, prompt: 'A curve $y=f(x)$ is rotated about the horizontal line $y=2$. State the correct surface-area integrand in terms of $f$ and $f''$, then apply it to $f(x)=x^2$ on $0\le x\le1$.', answer: { expectedLatex: '2\pi\int_0^1(2-x^2)\sqrt{1+4x^2}\,dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: The radius is the distance $|f(x)-2|$, so the integrand is $2\pi|f(x)-2|\sqrt{1+[f''(x)]^2}$. Here $x^2\le1$, giving $2\pi(2-x^2)\sqrt{1+4x^2}$. Why it works: Changing the axis changes radius but not the arc-length factor. Common trap: Replacing the radius by $f(x)$ silently assumes the axis is the x-axis.', difficultyDimensions: [representationTransfer, domainCondition, modelOrDerivation], difficultyEvidence: 'Derives an offset-axis radius, checks its sign on the interval, and preserves the independent slope factor.' }
  - { id: q010, type: freeResponse, prompt: 'A proposed arc-length formula for $y=x^2$ from 0 to 1 is $\int_0^1(1+4x^2)dx$. Diagnose the error, repair the formula, and explain the geometric meaning of the repaired factor.', answer: { gradingMode: selfCheck, keyPoints: ['square root is missing', 'integral of square root one plus four x squared', 'differential arc length or hypotenuse'] }, explanation: 'Solution: The correct formula is $L=\int_0^1\sqrt{1+4x^2}\,dx$. The omitted square root is essential because $\sqrt{dx^2+dy^2}=dx\sqrt{1+(dy/dx)^2}$ is the length of a tiny hypotenuse, not its squared length. Why it works: The Pythagorean theorem produces a square root when converting horizontal and vertical changes into distance. Common trap: $\int(1+(y'')^2)dx$ accumulates a dimensionally wrong squared-length quantity.', difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Uses the differential geometry derivation to reject a plausible but dimensionally wrong formula.' }
