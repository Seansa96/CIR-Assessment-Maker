questions:
- id: intro-binary-trees
  type: freeResponse
  prompt: "**Hierarchical Data Structures**\n\n![Binary Tree Diagram](/media/dsa/binary-tree-basic.svg)\n\
    \nArrays, Linked Lists, Stacks, and Queues are **linear** data structures. They represent data in\
    \ a single, 1-dimensional line. But many real-world relationships are hierarchical, like a company's\
    \ org chart or a computer's file system.\n\nTo represent this, we use a **Tree**. Like a Linked List,\
    \ a Tree is made of Nodes connected by pointers. But instead of a single `next` pointer, a Node in\
    \ a **Binary Tree** has up to two pointers: `left` and `right`.\n\nThe top of the tree is called the\
    \ **root**. Nodes with no children are called **leaves**. Because each node (except the root) has\
    \ exactly one parent, the structure branches out downwards without ever forming a loop (cycle).\n\n\
    Consider a `TreeNode` class in Python:\n```python\nclass TreeNode:\n    def __init__(self, value):\n\
    \        self.value = value\n        self.left = None\n        self.right = None\n```\n\nIf you wanted\
    \ to check if a specific `node` is a leaf node, what condition would you check?\n"
  answer:
    gradingMode: selfCheck
  explanation: 'Solution:

    You would check if both `node.left` and `node.right` are `None`.


    Why it works:

    By definition, a leaf is a node at the bottom of the tree that has no children. In our Python class,
    child pointers default to `None`. Therefore, if both the left and right pointers are `None`, the node
    has no children and is a leaf.

    '
