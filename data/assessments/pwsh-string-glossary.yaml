schemaVersion: 1
id: pwsh-string-glossary
title: "PowerShell String Terminology"
assessmentType: glossary
categoryId: scripting
subcategoryIds:
  - pwsh-string-basics
  - pwsh-string-methods
  - pwsh-regex
skills:
  - pwsh-string-basics
  - pwsh-string-methods
  - pwsh-regex
modeDefault: practice
glossary:
  - term: "Literal String"
    definition: |
      A string defined using **single quotes** (`' '`). PowerShell does not evaluate variables, sub-expressions, or escape characters inside a literal string. What you type is exactly what is output.
    drills:
      - id: drill-literal
        type: flashcard
        prompt: 'Which quote marks create a literal string where variables are NOT evaluated?'
        answer:
          expected: "Single quotes (`' '`)"
          
  - term: "Expandable String (String Interpolation)"
    definition: |
      A string defined using **double quotes** (`" "`). PowerShell parses expandable strings and replaces variable names and sub-expressions with their actual values before outputting the string.
    drills:
      - id: drill-expandable
        type: flashcard
        prompt: 'Which quote marks allow for string interpolation (variable expansion)?'
        answer:
          expected: "Double quotes (`\" \"`)"
          
  - term: "Sub-expression"
    definition: |
      The syntax `$()` used inside an expandable string (or in standard code) to force PowerShell to evaluate an entire expression before returning the result. This is heavily used to evaluate object properties (like `$($Process.Id)`) inside double quotes.
    drills:
      - id: drill-subexp
        type: flashcard
        prompt: 'What is the syntax for a sub-expression to evaluate an object property inside a string?'
        answer:
          expected: "`$()`"
          
  - term: "Escape Character (Backtick)"
    definition: |
      In PowerShell, the **backtick** (`` ` ``) is used to escape special characters inside double-quoted strings. Common uses include `` `n `` for newline, `` `t `` for tab, and `` `$ `` to insert a literal dollar sign.
    drills:
      - id: drill-escape
        type: flashcard
        prompt: 'What character serves as the escape character in PowerShell?'
        answer:
          expected: "The backtick (`` ` ``)"

  - term: "Regular Expression (Regex)"
    definition: |
      A sequence of characters that specifies a search pattern. PowerShell uses regex natively in its `-match` and `-replace` operators to allow for complex text parsing and validation.
    drills:
      - id: drill-regex
        type: flashcard
        prompt: 'What do the PowerShell `-match` and `-replace` operators use under the hood to perform complex text searches?'
        answer:
          expected: "Regular Expressions (Regex)"
          
  - term: "$Matches Variable"
    definition: |
      An automatic array variable that PowerShell populates immediately after a successful `-match` operation. `$Matches[0]` contains the full string that matched the regex pattern.
    drills:
      - id: drill-matches
        type: flashcard
        prompt: 'What automatic variable holds the results of a successful `-match` operation?'
        answer:
          expected: "`$Matches`"
