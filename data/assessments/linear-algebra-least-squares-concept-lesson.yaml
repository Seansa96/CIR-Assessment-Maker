lesson:
  introduction: >-
    In real-world applications, linear systems $A\vec{x} = \vec{b}$ are often
    overdetermined (more equations than variables) and inconsistent. When no
    exact solution exists, we seek the "best possible" approximation. The method
    of least squares finds an $\hat{\vec{x}}$ that minimizes the distance
    between $A\hat{\vec{x}}$ and $\vec{b}$, which geometrically corresponds to
    projecting $\vec{b}$ onto the column space of $A$.
  sections:
    - id: least-squares-problem
      title: The Least-Squares Problem
      content: |
        If $A$ is an $m \times n$ matrix and $\vec{b}$ is in $\mathbb{R}^m$, a **least-squares solution** to $A\vec{x} = \vec{b}$ is an $\hat{\vec{x}}$ in $\mathbb{R}^n$ such that:
        $$\|A\hat{\vec{x}} - \vec{b}\| \leq \|A\vec{x} - \vec{b}\| \quad \text{for all } \vec{x} \in \mathbb{R}^n$$

        Geometrically, $A\hat{\vec{x}}$ is the point in $\text{Col}(A)$ that is closest to $\vec{b}$. This point is exactly the orthogonal projection of $\vec{b}$ onto $\text{Col}(A)$, denoted $\hat{\vec{b}}$.
        So the least squares problem is equivalent to solving the consistent system $A\hat{\vec{x}} = \hat{\vec{b}}$.

        The distance $\|A\hat{\vec{x}} - \vec{b}\|$ is called the **least-squares error**.
      check:
        id: check-ls-geometry
        type: multipleChoice
        prompt: |
          In a least-squares problem $A\vec{x} = \vec{b}$, what relationship holds between the residual $\vec{b} - A\hat{\vec{x}}$ and the column space of $A$?
        choices:
          - id: c1
            text: 'The residual is in $\text{Col}(A)$.'
          - id: c2
            text: 'The residual is zero.'
          - id: c3
            text: 'The residual is orthogonal to every vector in $\text{Col}(A)$.'
          - id: c4
            text: 'The residual is orthogonal to $\vec{b}$.'
        answer:
          choiceId: c3
        explanation: |
          Because $A\hat{\vec{x}}$ is the orthogonal projection of $\vec{b}$ onto $\text{Col}(A)$, the error vector (residual) $\vec{b} - A\hat{\vec{x}}$ must be orthogonal to $\text{Col}(A)$. (This means it lies in $[\text{Col}(A)]^\perp$, which is $\text{Nul}(A^T)$.)

    - id: normal-equations
      title: The Normal Equations
      content: |
        We know the residual $\vec{b} - A\hat{\vec{x}}$ is orthogonal to $\text{Col}(A)$.
        This means it is in the null space of $A^T$.
        Therefore, $A^T(\vec{b} - A\hat{\vec{x}}) = \vec{0}$, which expands to:
        $$A^TA\hat{\vec{x}} = A^T\vec{b}$$

        These are the **normal equations** for $A\vec{x} = \vec{b}$.
        - The system $A^TA\vec{x} = A^T\vec{b}$ is **always consistent**, even if the original system $A\vec{x}=\vec{b}$ was not.
        - Any solution to the normal equations is a least-squares solution to $A\vec{x} = \vec{b}$.

        **Uniqueness**: The least-squares solution $\hat{\vec{x}}$ is unique if and only if the columns of $A$ are linearly independent. In this case, $A^TA$ is invertible, and we can write $\hat{\vec{x}} = (A^TA)^{-1}A^T\vec{b}$.
      check:
        id: check-normal-eq-setup
        type: multipleChoice
        prompt: |
          Which of the following describes the matrix $A^TA$ if $A$ is an $m \times n$ matrix?
        choices:
          - id: c1
            text: 'It is an $m \times m$ matrix.'
          - id: c2
            text: 'It is an $n \times n$ symmetric matrix.'
          - id: c3
            text: 'It is always an invertible matrix.'
          - id: c4
            text: 'It is equal to $A A^T$.'
        answer:
          choiceId: c2
        explanation: |
          $A^T$ is $n \times m$ and $A$ is $m \times n$, so their product $A^TA$ is $n \times n$. It is always symmetric because $(A^TA)^T = A^T(A^T)^T = A^TA$. However, it is only invertible if the columns of $A$ are linearly independent, so option C is not always true.

    - id: least-squares-lines
      title: Least-Squares Lines
      content: |
        A common application is fitting a line $y = \beta_0 + \beta_1 x$ to a set of data points $(x_1, y_1), \dots, (x_m, y_m)$.
        We plug the points into the line equation to get an overdetermined system:
        $$\begin{bmatrix} 1 & x_1 \\ 1 & x_2 \\ \vdots & \vdots \\ 1 & x_m \end{bmatrix} \begin{bmatrix} \beta_0 \\ \beta_1 \end{bmatrix} = \begin{bmatrix} y_1 \\ y_2 \\ \vdots \\ y_m \end{bmatrix}$$
        or $X\vec{\beta} = \vec{y}$.

        We find the best-fit line by solving the normal equations $X^TX\hat{\vec{\beta}} = X^T\vec{y}$. The matrix $X$ is called the **design matrix**, and $\vec{\beta}$ is the **parameter vector**.
      check:
        id: check-ls-line-matrix
        type: multipleChoice
        prompt: |
          Suppose you want to fit a line $y = \beta_0 + \beta_1 x$ to the three points $(0, 1)$, $(1, 3)$, and $(2, 4)$. What is the design matrix $X$?
        choices:
          - id: c1
            text: '$\begin{bmatrix} 0 & 1 \\ 1 & 3 \\ 2 & 4 \end{bmatrix}$'
          - id: c2
            text: '$\begin{bmatrix} 1 & 0 \\ 1 & 1 \\ 1 & 2 \end{bmatrix}$'
          - id: c3
            text: '$\begin{bmatrix} 1 & 1 & 1 \\ 0 & 1 & 2 \end{bmatrix}$'
          - id: c4
            text: '$\begin{bmatrix} \beta_0 \\ \beta_1 \end{bmatrix}$'
        answer:
          choiceId: c2
        explanation: |
          The design matrix $X$ has a first column of 1s (corresponding to the $\beta_0$ constant term) and a second column of the $x$-values ($0, 1, 2$). So $X = \begin{bmatrix} 1 & 0 \\ 1 & 1 \\ 1 & 2 \end{bmatrix}$.
