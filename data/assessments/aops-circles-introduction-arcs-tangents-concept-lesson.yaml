schemaVersion: 1
id: aops-circles-introduction-arcs-tangents-concept-lesson
title: 'Circles II: Chords, Tangents, and Structural Proofs'
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-circles-introduction
modeDefault: learn
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - art-of-problem-solving
  - aops-circles-introduction
  - aops-volume-1
  - geometry
