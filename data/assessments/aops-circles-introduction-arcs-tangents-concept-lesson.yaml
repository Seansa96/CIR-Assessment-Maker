skills:
- Use perpendicular center-to-chord relationships in both directions.
- Build right triangles from tangent-radius perpendicularity.
- Select and justify auxiliary radii in circle proofs.
lesson:
  introduction: A center turns curved geometry into triangles. This lesson develops the chord and tangent facts that make that conversion reliable, then combines them in proof and length problems.
  sections:
  - id: aops-circle2-equal-radii
    title: Equal radii create isosceles triangles
    required: true
    content: 'If $A$ and $B$ lie on a circle centered at $O$, then $OA=OB$. Thus triangle $AOB$ is isosceles. Equal radii are often the first hidden equality in a circle proof: draw the relevant radii, mark them equal, and then transfer equality to the base angles. The conclusion requires both endpoints to lie on the same circle.'
    media:
    - type: image
      src: /assessments/aops/aops-circles-structure.svg
      alt: Circle centered at O with labeled radii and chords.
      caption: Drawing radii exposes equal sides that the curved boundary hides.
    check:
      id: aops-circle2-equal-radii-check
      type: multipleChoice
      prompt: Why are the base angles of triangle $AOB$ equal?
      choices:
      - id: a
        text: $OA=OB$ because both are radii of one circle.
      - id: b
        text: Every chord is a diameter.
      - id: c
        text: All triangles in a circle are equilateral.
      - id: d
        text: The picture makes the angles look equal.
      answer:
        choiceId: a
      explanation: Equal sides in a triangle imply equal opposite angles.
  - id: aops-circle2-chord-forward
    title: A perpendicular from the center bisects a chord
    required: true
    content: 'Let $OM$ be perpendicular to chord $AB$. Right triangles $OMA$ and $OMB$ share $OM$, have equal hypotenuses $OA=OB$, and each has a right angle. Hypotenuse-leg congruence gives $AM=MB$. This is a theorem with a condition: a segment from the center does not automatically bisect a chord unless perpendicularity is known.'
    media:
    - type: image
      src: /assessments/aops/aops-circles-chord.svg
      alt: Radius OM perpendicular to chord AB at M, with AM and MB marked equal.
      caption: The perpendicular condition permits the midpoint conclusion.
    check:
      id: aops-circle2-chord-forward-check
      type: multipleChoice
      prompt: In the diagram, $AB=18$. What is $AM$?
      choices:
      - id: a
        text: '9'
      - id: b
        text: '18'
      - id: c
        text: '36'
      - id: d
        text: It cannot be determined.
      answer:
        choiceId: a
      explanation: The perpendicular from the center bisects the chord, so $AM=AB/2=9$.
  - id: aops-circle2-chord-converse
    title: The chord theorem works in reverse
    required: true
    content: If $M$ is the midpoint of chord $AB$, then $OM$ is perpendicular to $AB$. Triangles $OMA$ and $OMB$ have $OA=OB$, $AM=MB$, and common side $OM$, so SSS congruence makes the adjacent angles at $M$ equal. Because they form a linear pair, each is $90^\circ$. This converse is useful when midpoint markings are supplied instead of a right-angle mark.
    media:
    - type: image
      src: /assessments/aops/aops-circles-chord.svg
      alt: Center O joined to the marked midpoint M of chord AB.
      caption: Midpoint data can establish the missing perpendicular.
    check:
      id: aops-circle2-chord-converse-check
      type: multipleChoice
      prompt: Which fact is sufficient to prove $OM\perp AB$?
      choices:
      - id: a
        text: $M$ is the midpoint of chord $AB$.
      - id: b
        text: $M$ lies somewhere on $AB$.
      - id: c
        text: $AB$ appears horizontal.
      - id: d
        text: $OM$ is shorter than $OA$.
      answer:
        choiceId: a
      explanation: The center-to-midpoint converse supplies perpendicularity.
  - id: aops-circle2-tangent
    title: A tangent is perpendicular to the contact radius
    required: true
    content: 'A tangent meets a circle at one point $T$. The radius $OT$ is perpendicular to the tangent there. This creates a right triangle whenever an external point $P$ is joined to $O$. Conversely, a line through $T$ perpendicular to $OT$ is tangent. State the contact point: a radius to some other circle point need not be perpendicular to the tangent.'
    media:
    - type: image
      src: /assessments/aops/aops-circles-tangent.svg
      alt: Circle with tangent PT at T and right angle between OT and PT.
      caption: Tangency turns the radius and tangent segment into perpendicular legs.
    check:
      id: aops-circle2-tangent-check
      type: multipleChoice
      prompt: If $OT=7$ and $OP=25$, what is tangent length $PT$?
      choices:
      - id: a
        text: '24'
      - id: b
        text: '18'
      - id: c
        text: '25'
      - id: d
        text: '32'
      answer:
        choiceId: a
      explanation: Right triangle $OTP$ gives $PT=\sqrt{25^2-7^2}=24$.
  - id: aops-circle2-two-tangents
    title: Tangents from one external point are equal
    required: true
    content: If tangents from $P$ touch at $T$ and $U$, then $PT=PU$. Draw $OP$, $OT$, and $OU$. The two right triangles have common hypotenuse $OP$ and equal radius legs $OT=OU$, so they are congruent. This proof also shows why the theorem fails if either segment is a secant rather than a tangent.
    media:
    - type: image
      src: /assessments/aops/aops-circles-tangent.svg
      alt: Tangent-radius right triangle from an external point P.
      caption: Duplicating the right-triangle construction proves equal tangent lengths.
    check:
      id: aops-circle2-two-tangents-check
      type: multipleChoice
      prompt: Tangents from $P$ have lengths $3x+2$ and $5x-8$. Find $x$.
      choices:
      - id: a
        text: '5'
      - id: b
        text: '2'
      - id: c
        text: '3'
      - id: d
        text: '10'
      answer:
        choiceId: a
      explanation: 'Set the tangent lengths equal: $3x+2=5x-8$, hence $x=5$.'
  - id: aops-circle2-construction
    title: Choose auxiliary lines for a purpose
    required: true
    content: Draw a radius to a tangency point to create a right angle; draw radii to chord endpoints to create an isosceles triangle; join the center to a chord midpoint to access perpendicularity. An auxiliary line is not decoration. Before drawing it, name the theorem it unlocks and verify that its endpoints are available from the givens.
    media:
    - type: image
      src: /assessments/aops/aops-circles-tangent.svg
      alt: Radius drawn to a tangent contact point to create a right triangle.
      caption: A useful construction creates a named relation needed by the target.
    check:
      id: aops-circle2-construction-check
      type: multipleChoice
      prompt: A problem gives a tangent at $T$ and asks for a length. Which auxiliary segment is most useful first?
      choices:
      - id: a
        text: Draw the radius from the center to $T$.
      - id: b
        text: Draw an arbitrary chord.
      - id: c
        text: Extend the tangent through the circle.
      - id: d
        text: Assume the tangent bisects a radius.
      answer:
        choiceId: a
      explanation: The contact radius creates the justified right angle.
  - id: aops-circle2-synthesis
    title: Reason ledger and failure checks
    required: true
    content: 'A complete circle argument records a reason beside every equality or right angle: radius, shared side, midpoint, perpendicular, or tangent. Reject conclusions based only on appearance. For lengths, check positivity and the Pythagorean inequality; for proofs, check that each theorem is used in the direction supported by its hypotheses.'
    media:
    - type: image
      src: /assessments/aops/aops-circles-chord.svg
      alt: Chord theorem diagram with midpoint and right-angle markings.
      caption: Marks represent hypotheses; the proof ledger explains how conclusions follow.
    check:
      id: aops-circle2-synthesis-check
      type: multipleChoice
      prompt: Which claim is invalid without another condition?
      choices:
      - id: a
        text: A segment from the center to a chord bisects the chord.
      - id: b
        text: Two radii of one circle are equal.
      - id: c
        text: A radius to a tangency point is perpendicular to the tangent.
      - id: d
        text: A diameter has length twice the radius.
      answer:
        choiceId: a
      explanation: The center-to-chord segment must be perpendicular, or must meet the chord at its midpoint, before the paired theorem applies.
