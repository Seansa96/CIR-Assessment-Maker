lesson:
  introduction: Exactness identifies a hidden potential; integrating factors change a nonexact form into one while
    requiring careful domain bookkeeping.
  sections:
  - id: s1
    title: Differential forms and potentials
    required: true
    content: If $F_x=M$ and $F_y=N$, then $Mdx+Ndy=dF$ and solution curves are level sets $F=C$. Either $y(x)$ or
      $x(y)$ may locally parameterize such a curve.
    media: []
    check:
      id: q001
      type: multipleChoice
      prompt: If $F=x^2+xy+y^2$, what are $M$ and $N$ in $dF=Mdx+Ndy$?
      skills:
      - ede-ch02-first-order-equations-exact-equations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-exact-equations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Partial differentiation gives the two coefficients.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $M=2x+y,\ N=x+2y$
      - id: b
        text: $M=x+2y,\ N=2x+y$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $M=2x,\ N=2y$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $M=N=x+y$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Two reconstruction routes
    required: true
    content: Integrating $M$ with respect to $x$ leaves an unknown function of $y$; integrating $N$ with respect
      to $y$ leaves an unknown function of $x$. Either route must reproduce the other component.
    media: []
    check:
      id: q002
      type: multipleChoice
      prompt: After integrating $N=x+2y$ with respect to $y$, what form should $F$ have?
      skills:
      - ede-ch02-first-order-equations-exact-equations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-exact-equations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Terms constant with respect to $y$ are represented by the unknown function $h(x)$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $F=xy+y^2+h(x)$
      - id: b
        text: $F=x^2+2xy+h(y)$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $F=x+2y+h(x)$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $F=xy+2y+h(y)$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Region hypotheses
    required: true
    content: The cross-partial test $M_y=N_x$ is applied on an open region where the components and required derivatives
      are continuous. Equality at one isolated point is not exactness on a region.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: If $M_y=N_x$ only on the line $x=0$, what may be concluded?
      skills:
      - ede-ch02-first-order-equations-exact-equations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-exact-equations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Exactness requires equality throughout the open region.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The form is not exact on any open rectangle solely from that line equality
      - id: b
        text: It is exact everywhere
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Every line is a solution
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: No derivatives exist
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Diagnosing reconstruction failure
    required: true
    content: For a nonexact form, comparison after partial integration leaves a supposed one-variable derivative
      that still depends on the other variable. That contradiction identifies failure.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: You obtain $h'(y)=4xy$. Why does reconstruction fail?
      skills:
      - ede-ch02-first-order-equations-exact-equations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-exact-equations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The missing term was assumed to depend only on $y$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: A function of $y$ alone cannot have an $x$-dependent derivative
      - id: b
        text: Partial derivatives cannot contain products
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Every exact solution must be explicit
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: The constant must be zero
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: One-variable integrating factors
    required: true
    content: If $(M_y-N_x)/N$ depends only on $x$, exponentiate its $x$ integral for $\mu(x)$. The analogous ratio
      $(N_x-M_y)/M$ yields $\mu(y)$.
    media:
    - type: image
      src: /media/ede/ch02-integrating-factor-families.svg
      alt: Integrating-factor families with exactness retesting and warnings about zeros and singularities.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q005
      type: multipleChoice
      prompt: If $(M_y-N_x)/N=2/x$ on $x>0$, which factor is supported?
      skills:
      - ede-ch02-first-order-equations-integrating-factors
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-integrating-factors
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $e^{\int2/x dx}=e^{2\ln x}=x^2$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $x^2$
      - id: b
        text: $e^{2/x}$
        issueSignals:
        - id: ede-integrating-factor-equivalence-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $2\ln x$
        issueSignals:
        - id: ede-integrating-factor-equivalence-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y^2$
        issueSignals:
        - id: ede-integrating-factor-equivalence-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Product factors and exceptional solutions
    required: true
    content: Some forms admit $\mu=P(x)Q(y)$. Multiplication is equivalent to the original equation only where $\mu$
      is defined and nonzero; excluded curves must be checked directly in the original equation.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: Why must $y=0$ be checked separately after multiplying by $1/(x^2y^2)$?
      skills:
      - ede-ch02-first-order-equations-integrating-factors
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-integrating-factors
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Division by a vanishing state can remove a valid solution branch.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The factor is undefined there and may omit an original solution
      - id: b
        text: Exact equations forbid zero
        issueSignals:
        - id: ede-integrating-factor-equivalence-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: The derivative of zero is infinite
        issueSignals:
        - id: ede-integrating-factor-equivalence-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: All integrating factors create PDEs
        issueSignals:
        - id: ede-integrating-factor-equivalence-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
