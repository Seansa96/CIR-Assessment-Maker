schemaVersion: 1
id: physics-precession-worked-example
title: 'Worked Example: Precession of a Gyroscope'
description: Calculating precession angular velocity.
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
- physics-precession
workedExamples:
- id: we-precession-1
  title: Bicycle Wheel Gyroscope
  problem: A bicycle wheel of mass $M=2.0\text{ kg}$ and radius $R=0.3\text{ m}$ is
    spinning at $\omega = 15 \text{ rad/s}$. It is supported at one end of its axle
    at a distance $r = 0.15 \text{ m}$ from the center of mass. Treating the wheel
    as a thin hoop ($I=MR^2$), calculate its precession angular velocity $\Omega$.
  steps:
  - id: we-precession-1-step1
    title: 'Step 1: Torque and Angular Momentum'
    instruction: Calculate the magnitude of the torque due to gravity about the pivot,
      and the spin angular momentum $L$.
    prompt: What are $\tau$ and $L$?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\tau = Mgr = (2.0)(9.8)(0.15) = 2.94 \text{ N}\cdot\text{m}$
      - $I = MR^2 = (2.0)(0.3)^2 = 0.18 \text{ kg}\cdot\text{m}^2$
      - $L = I\omega = (0.18)(15) = 2.7 \text{ kg}\cdot\text{m}^2/\text{s}$
  - id: we-precession-1-step2
    title: 'Step 2: Precession Rate'
    instruction: Use $\Omega = \frac{\tau}{L}$ to find the precession rate.
    prompt: What is $\Omega$ in rad/s?
    type: numericResponse
    answer:
      value: 1.09
      tolerance: 0.05
    explanation: $$\Omega = \frac{2.94}{2.7} \approx 1.089 \text{ rad/s}$$
