workedExamples:
- id: we-precession-1
  title: Bicycle Wheel Gyroscope
  problem: A bicycle wheel of mass $M=2.0\text{ kg}$ and radius $R=0.3\text{ m}$ is
    spinning at $\omega = 15 \text{ rad/s}$. It is supported at one end of its axle
    at a distance $r = 0.15 \text{ m}$ from the center of mass. Treating the wheel
    as a thin hoop ($I=MR^2$), calculate its precession angular velocity $\Omega$.
  steps:
  - id: we-precession-1-step1
    title: 'Step 1: Torque and Angular Momentum'
    instruction: Calculate the magnitude of the torque due to gravity about the pivot,
      and the spin angular momentum $L$.
    prompt: What are $\tau$ and $L$?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\tau = Mgr = (2.0)(9.8)(0.15) = 2.94 \text{ N}\cdot\text{m}$
      - $I = MR^2 = (2.0)(0.3)^2 = 0.18 \text{ kg}\cdot\text{m}^2$
      - $L = I\omega = (0.18)(15) = 2.7 \text{ kg}\cdot\text{m}^2/\text{s}$
    explanation: 'Solution: Calculate $\tau=Mgr=2.94\ \mathrm{N\,m}$, $I=MR^2=0.18\ \mathrm{kg\,m^2}$, and $L=I\omega=2.7\ \mathrm{kg\,m^2/s}$.

      Why it works: Gravity acts with lever arm $r$, while a hoop has $I=MR^2$ and spin angular momentum $L=I\omega$.'
  - id: we-precession-1-step2
    title: 'Step 2: Precession Rate'
    instruction: Use $\Omega = \frac{\tau}{L}$ to find the precession rate.
    prompt: What is $\Omega$ in rad/s?
    type: numericResponse
    answer:
      value: 1.09
      tolerance: 0.05
    explanation: 'Solution: $\Omega=\tau/L=2.94/2.7=1.09\ \mathrm{rad/s}$.

      Why it works: For steady slow precession, the torque changes the direction of $\vec L$, giving $\Omega=\tau/L$.'

- id: precession-we002
  title: Precession Rate from Torque
  problem: 'A gyroscope has angular momentum $L=20\ \mathrm{kg\,m^2/s}$ and experiences perpendicular torque $\tau=4.0\ \mathrm{N\,m}$. Find its precession rate and period.'
  steps:
  - id: pwe3
    title: Calculate precession rate
    instruction: Use $\Omega=\tau/L$.
    type: numericResponse
    prompt: What is $\Omega$ in rad/s?
    answer: { value: 0.2, tolerance: 0.001 }
    explanation: 'Solution: $\Omega=4.0/20=0.20$ rad/s.\n\nWhy it works: Perpendicular torque turns angular momentum at rate $\tau/L$.'
  - id: pwe4
    title: Calculate precession period
    instruction: Use $T=2\pi/\Omega$.
    type: numericResponse
    prompt: What is the precession period in seconds?
    answer: { value: 31.4159, tolerance: 0.01 }
    explanation: 'Solution: $T=2\pi/0.20=31.4$ s.\n\nWhy it works: One precession cycle covers $2\pi$ radians.'
