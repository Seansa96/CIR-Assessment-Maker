schemaVersion: 1
id: ap-chemical-level-organization
title: Chemical Level of Organization
assessmentType: quiz
categoryId: anatomy-and-physiology
subcategoryIds:
  - ap-chemistry
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "What is matter?"
    choices:
      - id: a
        text: "Anything that has mass and occupies space"
      - id: b
        text: "Only living tissue"
      - id: c
        text: "Only energy"
      - id: d
        text: "Only water"
    answer: { choiceId: a }
    explanation: |
      Matter includes atoms, molecules, cells, and body structures.

      Related topic: Matter
  - id: q002
    type: multipleChoice
    prompt: "What is an element?"
    choices:
      - id: a
        text: "A pure substance made of one kind of atom"
      - id: b
        text: "A mixture of proteins"
      - id: c
        text: "A charged molecule only"
      - id: d
        text: "A type of tissue"
    answer: { choiceId: a }
    explanation: |
      Elements such as carbon, oxygen, and calcium are defined by their atoms.

      Related topic: Elements
  - id: q003
    type: multipleChoice
    prompt: "Which particle has a positive charge?"
    choices:
      - id: a
        text: "Proton"
      - id: b
        text: "Neutron"
      - id: c
        text: "Electron"
      - id: d
        text: "Molecule"
    answer: { choiceId: a }
    explanation: |
      Protons are positively charged particles found in the atomic nucleus.

      Related topic: Atomic Structure
  - id: q004
    type: multipleChoice
    prompt: "Which particle has a negative charge?"
    choices:
      - id: a
        text: "Electron"
      - id: b
        text: "Proton"
      - id: c
        text: "Neutron"
      - id: d
        text: "Nucleus"
    answer: { choiceId: a }
    explanation: |
      Electrons are negatively charged and occupy regions outside the nucleus.

      Related topic: Electrons
  - id: q005
    type: multipleChoice
    prompt: "What determines an element's atomic number?"
    choices:
      - id: a
        text: "Number of protons"
      - id: b
        text: "Number of neutrons"
      - id: c
        text: "Number of electron shells"
      - id: d
        text: "Number of bonds"
    answer: { choiceId: a }
    explanation: |
      The number of protons identifies the element.

      Related topic: Atomic Number
  - id: q006
    type: multipleChoice
    prompt: "What is an isotope?"
    choices:
      - id: a
        text: "Atoms of the same element with different numbers of neutrons"
      - id: b
        text: "Atoms with no protons"
      - id: c
        text: "Two atoms sharing electrons"
      - id: d
        text: "A molecule with water"
    answer: { choiceId: a }
    explanation: |
      Isotopes have the same proton number but different neutron numbers.

      Related topic: Isotopes
  - id: q007
    type: multipleChoice
    prompt: "What is an ion?"
    choices:
      - id: a
        text: "An atom or molecule with a net charge"
      - id: b
        text: "A neutral atom only"
      - id: c
        text: "A type of lipid"
      - id: d
        text: "A sugar polymer"
    answer: { choiceId: a }
    explanation: |
      Ions form when electrons are gained or lost.

      Related topic: Ions
  - id: q008
    type: multipleChoice
    prompt: "What type of bond forms when electrons are transferred?"
    choices:
      - id: a
        text: "Ionic bond"
      - id: b
        text: "Covalent bond"
      - id: c
        text: "Hydrogen bond"
      - id: d
        text: "Peptide bond only"
    answer: { choiceId: a }
    explanation: |
      Ionic bonds result from attraction between oppositely charged ions.

      Related topic: Ionic Bonds
  - id: q009
    type: multipleChoice
    prompt: "What type of bond forms when atoms share electrons?"
    choices:
      - id: a
        text: "Covalent bond"
      - id: b
        text: "Ionic bond"
      - id: c
        text: "Hydrogen bond"
      - id: d
        text: "Metallic tissue bond"
    answer: { choiceId: a }
    explanation: |
      Covalent bonds hold many biological molecules together.

      Related topic: Covalent Bonds
  - id: q010
    type: multipleChoice
    prompt: "Which weak attraction is important in water and DNA structure?"
    choices:
      - id: a
        text: "Hydrogen bond"
      - id: b
        text: "Ionic bond only"
      - id: c
        text: "Metallic bond"
      - id: d
        text: "Neutron bond"
    answer: { choiceId: a }
    explanation: |
      Hydrogen bonds are weaker than covalent bonds but very important in body chemistry.

      Related topic: Hydrogen Bonds
  - id: q011
    type: multipleChoice
    prompt: "Why is water an important solvent?"
    choices:
      - id: a
        text: "Its polarity helps dissolve many ionic and polar substances"
      - id: b
        text: "It has no charge separation"
      - id: c
        text: "It dissolves only fats"
      - id: d
        text: "It is always acidic"
    answer: { choiceId: a }
    explanation: |
      Polar water molecules interact well with ions and other polar molecules.

      Related topic: Water as a Solvent
  - id: q012
    type: multipleChoice
    prompt: "A solution with pH less than 7 is:"
    choices:
      - id: a
        text: "Acidic"
      - id: b
        text: "Basic"
      - id: c
        text: "Neutral"
      - id: d
        text: "Always a buffer"
    answer: { choiceId: a }
    explanation: |
      Acids increase hydrogen ion concentration and have pH values below 7.

      Related topic: Acids and pH
  - id: q013
    type: multipleChoice
    prompt: "A solution with pH greater than 7 is:"
    choices:
      - id: a
        text: "Basic"
      - id: b
        text: "Acidic"
      - id: c
        text: "Neutral"
      - id: d
        text: "A lipid"
    answer: { choiceId: a }
    explanation: |
      Bases accept hydrogen ions or release hydroxide ions and have pH values above 7.

      Related topic: Bases and pH
  - id: q014
    type: multipleChoice
    prompt: "What do buffers help maintain?"
    choices:
      - id: a
        text: "Stable pH"
      - id: b
        text: "Only body temperature"
      - id: c
        text: "Protein shape by breaking all bonds"
      - id: d
        text: "Atomic number"
    answer: { choiceId: a }
    explanation: |
      Buffers resist large changes in pH.

      Related topic: Buffers
  - id: q015
    type: multipleChoice
    prompt: "Which is an inorganic compound important in body fluids?"
    choices:
      - id: a
        text: "Water"
      - id: b
        text: "Protein"
      - id: c
        text: "DNA"
      - id: d
        text: "Triglyceride"
    answer: { choiceId: a }
    explanation: |
      Water is inorganic and is the most abundant compound in the body.

      Related topic: Inorganic Compounds
  - id: q016
    type: multipleChoice
    prompt: "Which is an example of an organic compound?"
    choices:
      - id: a
        text: "Glucose"
      - id: b
        text: "Water"
      - id: c
        text: "Oxygen gas"
      - id: d
        text: "Sodium chloride"
    answer: { choiceId: a }
    explanation: |
      Glucose is a carbon-containing carbohydrate.

      Related topic: Organic Compounds
  - id: q017
    type: multipleChoice
    prompt: "Which macromolecule is the body's most immediate energy source?"
    choices:
      - id: a
        text: "Carbohydrates"
      - id: b
        text: "Nucleic acids"
      - id: c
        text: "Proteins"
      - id: d
        text: "Minerals"
    answer: { choiceId: a }
    explanation: |
      Carbohydrates such as glucose are commonly used for quick energy.

      Related topic: Carbohydrates
  - id: q018
    type: multipleChoice
    prompt: "Which molecule is a monosaccharide?"
    choices:
      - id: a
        text: "Glucose"
      - id: b
        text: "Collagen"
      - id: c
        text: "DNA"
      - id: d
        text: "Cholesterol"
    answer: { choiceId: a }
    explanation: |
      Glucose is a single sugar unit.

      Related topic: Monosaccharides
  - id: q019
    type: multipleChoice
    prompt: "Which macromolecule includes fats, oils, phospholipids, and steroids?"
    choices:
      - id: a
        text: "Lipids"
      - id: b
        text: "Proteins"
      - id: c
        text: "Carbohydrates"
      - id: d
        text: "Nucleic acids"
    answer: { choiceId: a }
    explanation: |
      Lipids are hydrophobic organic compounds with several important body roles.

      Related topic: Lipids
  - id: q020
    type: multipleChoice
    prompt: "Which lipid is a major part of cell membranes?"
    choices:
      - id: a
        text: "Phospholipid"
      - id: b
        text: "Glucose"
      - id: c
        text: "Amino acid"
      - id: d
        text: "RNA"
    answer: { choiceId: a }
    explanation: |
      Phospholipids form the bilayer structure of cell membranes.

      Related topic: Phospholipids
  - id: q021
    type: multipleChoice
    prompt: "Proteins are built from:"
    choices:
      - id: a
        text: "Amino acids"
      - id: b
        text: "Fatty acids only"
      - id: c
        text: "Nucleotides"
      - id: d
        text: "Monosaccharides only"
    answer: { choiceId: a }
    explanation: |
      Amino acids link together to form proteins.

      Related topic: Amino Acids and Proteins
  - id: q022
    type: multipleChoice
    prompt: "What type of bond links amino acids in proteins?"
    choices:
      - id: a
        text: "Peptide bond"
      - id: b
        text: "Ionic bond only"
      - id: c
        text: "Hydrogen bond only"
      - id: d
        text: "Glycosidic bond"
    answer: { choiceId: a }
    explanation: |
      Peptide bonds connect amino acids into polypeptide chains.

      Related topic: Peptide Bonds
  - id: q023
    type: multipleChoice
    prompt: "What can denature a protein?"
    choices:
      - id: a
        text: "Extreme heat or pH changes"
      - id: b
        text: "Normal body temperature only"
      - id: c
        text: "Adding more amino acids only"
      - id: d
        text: "Removing all water"
    answer: { choiceId: a }
    explanation: |
      Denaturation disrupts protein shape, which can disrupt function.

      Related topic: Protein Denaturation
  - id: q024
    type: multipleChoice
    prompt: "Enzymes are usually:"
    choices:
      - id: a
        text: "Proteins that speed chemical reactions"
      - id: b
        text: "Lipids that store genetic information"
      - id: c
        text: "Sugars that form DNA"
      - id: d
        text: "Inorganic salts only"
    answer: { choiceId: a }
    explanation: |
      Enzymes act as biological catalysts.

      Related topic: Enzymes
  - id: q025
    type: multipleChoice
    prompt: "Nucleic acids are built from:"
    choices:
      - id: a
        text: "Nucleotides"
      - id: b
        text: "Amino acids"
      - id: c
        text: "Fatty acids"
      - id: d
        text: "Glycerol only"
    answer: { choiceId: a }
    explanation: |
      DNA and RNA are polymers of nucleotides.

      Related topic: Nucleotides
  - id: q026
    type: multipleChoice
    prompt: "Which molecule stores genetic information?"
    choices:
      - id: a
        text: "DNA"
      - id: b
        text: "Triglyceride"
      - id: c
        text: "Glucose"
      - id: d
        text: "Water"
    answer: { choiceId: a }
    explanation: |
      DNA contains the instructions for building proteins.

      Related topic: DNA
  - id: q027
    type: multipleChoice
    prompt: "ATP is best described as:"
    choices:
      - id: a
        text: "A short-term energy transfer molecule"
      - id: b
        text: "A structural bone mineral only"
      - id: c
        text: "A storage lipid"
      - id: d
        text: "An amino acid"
    answer: { choiceId: a }
    explanation: |
      ATP transfers usable energy to cellular processes.

      Related topic: ATP
  - id: q028
    type: multipleChoice
    prompt: "What is a salt in body chemistry?"
    choices:
      - id: a
        text: "An ionic compound that dissociates into ions"
      - id: b
        text: "Only table sugar"
      - id: c
        text: "A protein catalyst"
      - id: d
        text: "A molecule with no charge"
    answer: { choiceId: a }
    explanation: |
      Salts release ions such as sodium, potassium, chloride, and calcium in solution.

      Related topic: Salts and Electrolytes
  - id: q029
    type: multipleChoice
    prompt: "Which ion is especially important for muscle contraction and bone structure?"
    choices:
      - id: a
        text: "Calcium ion"
      - id: b
        text: "Helium ion"
      - id: c
        text: "Gold ion"
      - id: d
        text: "Neon ion"
    answer: { choiceId: a }
    explanation: |
      Calcium has major roles in bones, muscle contraction, and cell signaling.

      Related topic: Calcium in the Body
  - id: q030
    type: multipleChoice
    prompt: "Which statement best compares organic and inorganic compounds?"
    choices:
      - id: a
        text: "Organic compounds usually contain carbon-hydrogen bonds; inorganic compounds generally do not"
      - id: b
        text: "Organic compounds are never found in cells"
      - id: c
        text: "Inorganic compounds are always larger than proteins"
      - id: d
        text: "Water is an organic compound"
    answer: { choiceId: a }
    explanation: |
      A&P chemistry often separates carbon-based biological molecules from inorganic substances such as water, salts, acids, and bases.

      Related topic: Organic Versus Inorganic Compounds
