questions:
  - id: q001
    type: multipleChoice
    prompt: "What is matter?"
    choices:
      - id: a
        text: "Anything that has mass and occupies space"
      - id: b
        text: "Only living tissue"
      - id: c
        text: "Only energy"
      - id: d
        text: "Only water"
    answer: { choiceId: a }
    explanation: |
      Matter is anything with mass that takes up space. In A&P, this includes atoms, ions, molecules, cells, tissues, organs, body fluids, and the minerals that help form structures such as bone.

      Related topic: Matter
  - id: q002
    type: multipleChoice
    prompt: "What is an element?"
    choices:
      - id: a
        text: "A pure substance made of one kind of atom"
      - id: b
        text: "A mixture of proteins"
      - id: c
        text: "A charged molecule only"
      - id: d
        text: "A type of tissue"
    answer: { choiceId: a }
    explanation: |
      An element is a pure substance whose atoms all have the same number of protons. Carbon, hydrogen, oxygen, nitrogen, calcium, phosphorus, potassium, sodium, chlorine, and iron are common examples important in the body.

      Related topic: Elements
  - id: q003
    type: multipleChoice
    prompt: "Which particle has a positive charge?"
    choices:
      - id: a
        text: "Proton"
      - id: b
        text: "Neutron"
      - id: c
        text: "Electron"
      - id: d
        text: "Molecule"
    answer: { choiceId: a }
    explanation: |
      Protons carry a positive charge and are located in the nucleus. The number of protons determines the atomic number, so changing the proton count changes the element itself.

      Related topic: Atomic Structure
  - id: q004
    type: multipleChoice
    prompt: "Which particle has a negative charge?"
    choices:
      - id: a
        text: "Electron"
      - id: b
        text: "Proton"
      - id: c
        text: "Neutron"
      - id: d
        text: "Nucleus"
    answer: { choiceId: a }
    explanation: |
      Electrons carry a negative charge and occupy electron shells or orbitals around the nucleus. They are the particles most directly involved in chemical bonding and ion formation.

      Related topic: Electrons
  - id: q005
    type: multipleChoice
    prompt: "What determines an element's atomic number?"
    choices:
      - id: a
        text: "Number of protons"
      - id: b
        text: "Number of neutrons"
      - id: c
        text: "Number of electron shells"
      - id: d
        text: "Number of bonds"
    answer: { choiceId: a }
    explanation: |
      Atomic number equals the number of protons in the nucleus. For example, any atom with 6 protons is carbon, while any atom with 8 protons is oxygen.

      Related topic: Atomic Number
  - id: q006
    type: multipleChoice
    prompt: "What is an isotope?"
    choices:
      - id: a
        text: "Atoms of the same element with different numbers of neutrons"
      - id: b
        text: "Atoms with no protons"
      - id: c
        text: "Two atoms sharing electrons"
      - id: d
        text: "A molecule with water"
    answer: { choiceId: a }
    explanation: |
      Isotopes are atoms of the same element because they have the same number of protons, but they differ in neutron number. This changes mass number and can make some isotopes radioactive.

      Related topic: Isotopes
  - id: q007
    type: multipleChoice
    prompt: "What is an ion?"
    choices:
      - id: a
        text: "An atom or molecule with a net charge"
      - id: b
        text: "A neutral atom only"
      - id: c
        text: "A type of lipid"
      - id: d
        text: "A sugar polymer"
    answer: { choiceId: a }
    explanation: |
      Ions form when atoms or molecules gain or lose electrons. Losing electrons produces a positive ion, such as $Na^+$, while gaining electrons produces a negative ion, such as $Cl^-$.

      Related topic: Ions
  - id: q008
    type: multipleChoice
    prompt: "What type of bond forms when electrons are transferred?"
    choices:
      - id: a
        text: "Ionic bond"
      - id: b
        text: "Covalent bond"
      - id: c
        text: "Hydrogen bond"
      - id: d
        text: "Peptide bond only"
    answer: { choiceId: a }
    explanation: |
      Ionic bonding begins with electron transfer, producing oppositely charged ions. The attraction between cations and anions holds ionic compounds such as sodium chloride together.

      Related topic: Ionic Bonds
  - id: q009
    type: multipleChoice
    prompt: "What type of bond forms when atoms share electrons?"
    choices:
      - id: a
        text: "Covalent bond"
      - id: b
        text: "Ionic bond"
      - id: c
        text: "Hydrogen bond"
      - id: d
        text: "Metallic tissue bond"
    answer: { choiceId: a }
    explanation: |
      Covalent bonds form when atoms share electrons. Strong covalent bonds hold together water, glucose, amino acids, proteins, nucleic acids, and many other biological molecules.

      Related topic: Covalent Bonds
  - id: q010
    type: multipleChoice
    prompt: "Which weak attraction is important in water and DNA structure?"
    choices:
      - id: a
        text: "Hydrogen bond"
      - id: b
        text: "Ionic bond only"
      - id: c
        text: "Metallic bond"
      - id: d
        text: "Neutron bond"
    answer: { choiceId: a }
    explanation: |
      Hydrogen bonds are weak attractions involving a partially positive hydrogen atom and a partially negative atom such as oxygen or nitrogen. They help water molecules stick together and help stabilize DNA base pairing and protein shape.

      Related topic: Hydrogen Bonds
  - id: q011
    type: multipleChoice
    prompt: "Why is water an important solvent?"
    choices:
      - id: a
        text: "Its polarity helps dissolve many ionic and polar substances"
      - id: b
        text: "It has no charge separation"
      - id: c
        text: "It dissolves only fats"
      - id: d
        text: "It is always acidic"
    answer: { choiceId: a }
    explanation: |
      Water is polar because oxygen pulls shared electrons more strongly than hydrogen, giving water partial charges. Those partial charges surround ions and polar molecules, helping them dissolve in body fluids.

      Related topic: Water as a Solvent
  - id: q012
    type: multipleChoice
    prompt: "A solution with pH less than 7 is:"
    choices:
      - id: a
        text: "Acidic"
      - id: b
        text: "Basic"
      - id: c
        text: "Neutral"
      - id: d
        text: "Always a buffer"
    answer: { choiceId: a }
    explanation: |
      Acidic solutions have a pH below 7 because they contain relatively more hydrogen ions. In body chemistry, excess acidity can disrupt protein shape, enzyme activity, and normal cell function.

      Related topic: Acids and pH
  - id: q013
    type: multipleChoice
    prompt: "A solution with pH greater than 7 is:"
    choices:
      - id: a
        text: "Basic"
      - id: b
        text: "Acidic"
      - id: c
        text: "Neutral"
      - id: d
        text: "A lipid"
    answer: { choiceId: a }
    explanation: |
      Basic solutions have a pH above 7 because they accept hydrogen ions or release hydroxide ions. Like strong acids, strong bases can disturb protein structure and enzyme function.

      Related topic: Bases and pH
  - id: q014
    type: multipleChoice
    prompt: "What do buffers help maintain?"
    choices:
      - id: a
        text: "Stable pH"
      - id: b
        text: "Only body temperature"
      - id: c
        text: "Protein shape by breaking all bonds"
      - id: d
        text: "Atomic number"
    answer: { choiceId: a }
    explanation: |
      Buffers reduce sudden pH shifts by binding excess hydrogen ions when pH drops and releasing hydrogen ions when pH rises. The bicarbonate buffer system is especially important in blood.

      Related topic: Buffers
  - id: q015
    type: multipleChoice
    prompt: "Which is an inorganic compound important in body fluids?"
    choices:
      - id: a
        text: "Water"
      - id: b
        text: "Protein"
      - id: c
        text: "DNA"
      - id: d
        text: "Triglyceride"
    answer: { choiceId: a }
    explanation: |
      Water is inorganic because it does not contain carbon-hydrogen bonds. It is also the body's most abundant compound and supports transport, temperature regulation, lubrication, and chemical reactions.

      Related topic: Inorganic Compounds
  - id: q016
    type: multipleChoice
    prompt: "Which is an example of an organic compound?"
    choices:
      - id: a
        text: "Glucose"
      - id: b
        text: "Water"
      - id: c
        text: "Oxygen gas"
      - id: d
        text: "Sodium chloride"
    answer: { choiceId: a }
    explanation: |
      Glucose is an organic carbohydrate because it contains carbon-hydrogen bonds and is used by cells as a major fuel source. Water, oxygen gas, and sodium chloride are inorganic.

      Related topic: Organic Compounds
  - id: q017
    type: multipleChoice
    prompt: "Which macromolecule is the body's most immediate energy source?"
    choices:
      - id: a
        text: "Carbohydrates"
      - id: b
        text: "Nucleic acids"
      - id: c
        text: "Proteins"
      - id: d
        text: "Minerals"
    answer: { choiceId: a }
    explanation: |
      Carbohydrates are broken down into simple sugars such as glucose, which cells can rapidly use to make ATP. This makes carbohydrates the most immediate energy source among the macromolecule choices listed.

      Related topic: Carbohydrates
  - id: q018
    type: multipleChoice
    prompt: "Which molecule is a monosaccharide?"
    choices:
      - id: a
        text: "Glucose"
      - id: b
        text: "Collagen"
      - id: c
        text: "DNA"
      - id: d
        text: "Cholesterol"
    answer: { choiceId: a }
    explanation: |
      Glucose is a monosaccharide, meaning it is one sugar unit. Larger carbohydrates such as disaccharides and polysaccharides are built by linking monosaccharides together.

      Related topic: Monosaccharides
  - id: q019
    type: multipleChoice
    prompt: "Which macromolecule includes fats, oils, phospholipids, and steroids?"
    choices:
      - id: a
        text: "Lipids"
      - id: b
        text: "Proteins"
      - id: c
        text: "Carbohydrates"
      - id: d
        text: "Nucleic acids"
    answer: { choiceId: a }
    explanation: |
      Lipids are mostly nonpolar, hydrophobic organic molecules. Fats and oils store energy, phospholipids form membranes, and steroids such as cholesterol help form membranes and some hormones.

      Related topic: Lipids
  - id: q020
    type: multipleChoice
    prompt: "Which lipid is a major part of cell membranes?"
    choices:
      - id: a
        text: "Phospholipid"
      - id: b
        text: "Glucose"
      - id: c
        text: "Amino acid"
      - id: d
        text: "RNA"
    answer: { choiceId: a }
    explanation: |
      Phospholipids have hydrophilic heads and hydrophobic tails. In water, they arrange into a bilayer with heads facing fluid and tails tucked inward, forming the basic structure of cell membranes.

      Related topic: Phospholipids
  - id: q021
    type: multipleChoice
    prompt: "Proteins are built from:"
    choices:
      - id: a
        text: "Amino acids"
      - id: b
        text: "Fatty acids only"
      - id: c
        text: "Nucleotides"
      - id: d
        text: "Monosaccharides only"
    answer: { choiceId: a }
    explanation: |
      Proteins are polymers made from amino acid monomers. The amino acid sequence determines how the protein folds, and the folded shape determines the protein's function.

      Related topic: Amino Acids and Proteins
  - id: q022
    type: multipleChoice
    prompt: "What type of bond links amino acids in proteins?"
    choices:
      - id: a
        text: "Peptide bond"
      - id: b
        text: "Ionic bond only"
      - id: c
        text: "Hydrogen bond only"
      - id: d
        text: "Glycosidic bond"
    answer: { choiceId: a }
    explanation: |
      A peptide bond links the amino group of one amino acid to the carboxyl group of another. Repeating peptide bonds create polypeptide chains that fold into functional proteins.

      Related topic: Peptide Bonds
  - id: q023
    type: multipleChoice
    prompt: "What can denature a protein?"
    choices:
      - id: a
        text: "Extreme heat or pH changes"
      - id: b
        text: "Normal body temperature only"
      - id: c
        text: "Adding more amino acids only"
      - id: d
        text: "Removing all water"
    answer: { choiceId: a }
    explanation: |
      Denaturation disrupts a protein's three-dimensional shape without necessarily breaking every peptide bond. Heat, strong pH changes, and some chemicals can unfold proteins and reduce or destroy their function.

      Related topic: Protein Denaturation
  - id: q024
    type: multipleChoice
    prompt: "Enzymes are usually:"
    choices:
      - id: a
        text: "Proteins that speed chemical reactions"
      - id: b
        text: "Lipids that store genetic information"
      - id: c
        text: "Sugars that form DNA"
      - id: d
        text: "Inorganic salts only"
    answer: { choiceId: a }
    explanation: |
      Enzymes are usually proteins that lower activation energy, allowing chemical reactions to occur faster at body-compatible temperatures. Their active sites bind specific substrates.

      Related topic: Enzymes
  - id: q025
    type: multipleChoice
    prompt: "Nucleic acids are built from:"
    choices:
      - id: a
        text: "Nucleotides"
      - id: b
        text: "Amino acids"
      - id: c
        text: "Fatty acids"
      - id: d
        text: "Glycerol only"
    answer: { choiceId: a }
    explanation: |
      Nucleic acids are polymers made of nucleotide monomers. Each nucleotide includes a sugar, a phosphate group, and a nitrogenous base.

      Related topic: Nucleotides
  - id: q026
    type: multipleChoice
    prompt: "Which molecule stores genetic information?"
    choices:
      - id: a
        text: "DNA"
      - id: b
        text: "Triglyceride"
      - id: c
        text: "Glucose"
      - id: d
        text: "Water"
    answer: { choiceId: a }
    explanation: |
      DNA stores genetic instructions in the sequence of its nitrogenous bases. Genes are DNA segments that provide information used to make RNA and, ultimately, proteins.

      Related topic: DNA
  - id: q027
    type: multipleChoice
    prompt: "ATP is best described as:"
    choices:
      - id: a
        text: "A short-term energy transfer molecule"
      - id: b
        text: "A structural bone mineral only"
      - id: c
        text: "A storage lipid"
      - id: d
        text: "An amino acid"
    answer: { choiceId: a }
    explanation: |
      ATP stores energy in phosphate bonds and transfers that energy when the terminal phosphate is removed. Cells use ATP to power processes such as active transport, muscle contraction, and synthesis reactions.

      Related topic: ATP
  - id: q028
    type: multipleChoice
    prompt: "What is a salt in body chemistry?"
    choices:
      - id: a
        text: "An ionic compound that dissociates into ions"
      - id: b
        text: "Only table sugar"
      - id: c
        text: "A protein catalyst"
      - id: d
        text: "A molecule with no charge"
    answer: { choiceId: a }
    explanation: |
      Salts are ionic compounds that dissociate into ions in water. In body fluids, ions such as $Na^+$, $K^+$, $Cl^-$, and $Ca^{2+}$ act as electrolytes for fluid balance, nerve signaling, and muscle contraction.

      Related topic: Salts and Electrolytes
  - id: q029
    type: multipleChoice
    prompt: "Which ion is especially important for muscle contraction and bone structure?"
    choices:
      - id: a
        text: "Calcium ion"
      - id: b
        text: "Helium ion"
      - id: c
        text: "Gold ion"
      - id: d
        text: "Neon ion"
    answer: { choiceId: a }
    explanation: |
      Calcium ions contribute to bone mineral hardness, trigger interactions needed for muscle contraction, and act as signaling ions in many cells. That makes calcium important structurally and physiologically.

      Related topic: Calcium in the Body
  - id: q030
    type: multipleChoice
    prompt: "Which statement best compares organic and inorganic compounds?"
    choices:
      - id: a
        text: "Organic compounds usually contain carbon-hydrogen bonds; inorganic compounds generally do not"
      - id: b
        text: "Organic compounds are never found in cells"
      - id: c
        text: "Inorganic compounds are always larger than proteins"
      - id: d
        text: "Water is an organic compound"
    answer: { choiceId: a }
    explanation: |
      Organic compounds in A&P usually contain carbon-hydrogen bonds and include carbohydrates, lipids, proteins, and nucleic acids. Inorganic compounds generally lack those bonds and include water, salts, acids, bases, oxygen, and carbon dioxide.

      Related topic: Organic Versus Inorganic Compounds


