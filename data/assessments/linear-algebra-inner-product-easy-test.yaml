questions:
  - id: et-symmetry-axiom
    type: multipleChoice
    prompt: |
      Which of the following equations represents the **Symmetry** axiom of an inner product?
    choices:
      - id: c1
        text: '$\langle \vec{u}, \vec{v} \rangle = \langle \vec{v}, \vec{u} \rangle$'
      - id: c2
        text: '$\langle \vec{u} + \vec{v}, \vec{w} \rangle = \langle \vec{u}, \vec{w} \rangle + \langle \vec{v}, \vec{w} \rangle$'
      - id: c3
        text: '$\langle c\vec{u}, \vec{v} \rangle = c\langle \vec{u}, \vec{v} \rangle$'
      - id: c4
        text: '$\langle \vec{u}, \vec{u} \rangle \geq 0$'
    answer:
      choiceId: c1
    explanation: |
      Symmetry simply states that the order of the vectors in the inner product does not matter: $\langle \vec{u}, \vec{v} \rangle = \langle \vec{v}, \vec{u} \rangle$. (The other options are Additivity, Homogeneity, and Positivity, respectively).

  - id: et-distance-formula
    type: multipleChoice
    prompt: |
      In an inner product space, how is the distance between two vectors $\vec{u}$ and $\vec{v}$ computed?
    choices:
      - id: c1
        text: '$\sqrt{\langle \vec{u}, \vec{v} \rangle}$'
      - id: c2
        text: '$\|\vec{u}\| + \|\vec{v}\|$'
      - id: c3
        text: '$\|\vec{u} - \vec{v}\|$'
      - id: c4
        text: '$|\langle \vec{u}, \vec{v} \rangle|$'
    answer:
      choiceId: c3
    explanation: |
      Just as in $\mathbb{R}^n$, the distance between two points is the length of the vector connecting them. Thus, $\text{dist}(\vec{u}, \vec{v}) = \|\vec{u} - \vec{v}\|$.

  - id: et-zero-length-condition
    type: multipleChoice
    prompt: |
      According to the axioms of an inner product, under what condition does a vector $\vec{v}$ have a length of exactly $0$? (i.e., $\|\vec{v}\| = \sqrt{\langle \vec{v}, \vec{v} \rangle} = 0$)
    choices:
      - id: c1
        text: 'Only when $\vec{v}$ is orthogonal to every other vector in the space.'
      - id: c2
        text: 'If and only if $\vec{v} = \vec{0}$.'
      - id: c3
        text: 'When $\vec{v}$ is the identity vector.'
      - id: c4
        text: 'It is impossible for a length to be $0$.'
    answer:
      choiceId: c2
    explanation: |
      The Positivity axiom states that $\langle \vec{v}, \vec{v} \rangle \geq 0$, and it equals exactly $0$ if and only if $\vec{v}$ is the zero vector $\vec{0}$.

  - id: et-polynomial-inner-product
    type: numericResponse
    prompt: |
      Let $V = C[0, 1]$ with the inner product $\langle f, g \rangle = \int_0^1 f(t)g(t) \, dt$.
      Let $f(t) = 3$ and $g(t) = 4$. 
      Calculate the inner product $\langle f, g \rangle$.
    answer:
      value: 12
      tolerance: 0
    explanation: |
      $\langle f, g \rangle = \int_0^1 (3)(4) \, dt = \int_0^1 12 \, dt = 12[t]_0^1 = 12(1 - 0) = 12$.

  - id: et-cauchy-schwarz-concept
    type: multipleChoice
    prompt: |
      The Cauchy-Schwarz inequality states that the absolute value of the inner product of two vectors is always less than or equal to:
    choices:
      - id: c1
        text: 'The sum of their lengths.'
      - id: c2
        text: 'The product of their lengths.'
      - id: c3
        text: 'Zero.'
      - id: c4
        text: 'The inner product of their difference.'
    answer:
      choiceId: c2
    explanation: |
      The formula is $|\langle \vec{u}, \vec{v} \rangle| \leq \|\vec{u}\| \|\vec{v}\|$, meaning it is less than or equal to the product of their individual lengths (norms).
