glossary:
  introduction: Core terms for Gauss's Law.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of flux and surfaces.
    entries:
    - id: t1
      term: Electric Flux
      definition: The surface integral of the electric field over a given surface.
    - id: t2
      term: Gaussian Surface
      definition: An imaginary closed surface chosen to evaluate the surface integral
        of the electric field.
    - id: t3
      term: Electrostatic Equilibrium
      definition: The state of a conductor where there is no net macroscopic movement
        of charge.
