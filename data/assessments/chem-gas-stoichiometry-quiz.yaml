questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-gas-stoichiometry
    prompt: |
      Under what specific conditions is it valid to use the conversion factor **22.4 L = 1 mole** for a gas?
    choices:
      - id: a
        text: Any conditions, as long as it is an ideal gas.
      - id: b
        text: Standard Temperature and Pressure (0 °C and 1.00 atm) only.
      - id: c
        text: Room Temperature and Pressure (25 °C and 1.00 atm).
      - id: d
        text: Standard Temperature and Pressure (273 K and 760 torr) only for noble gases.
    answer:
      choiceId: b
    explanation: |
      The molar volume of an ideal gas is exactly 22.4 L *only* at Standard Temperature and Pressure (STP), which is defined as 0 °C (273.15 K) and 1 atm. If conditions differ, you must use $PV = nRT$.

  - id: q002
    type: numericResponse
    skills:
      - chem-gas-stoichiometry
    prompt: |
      Consider the combustion of methane:
      $$CH_4(g) + 2 O_2(g) \to CO_2(g) + 2 H_2O(g)$$
      If you react 15.0 L of $CH_4$ gas, what volume of $H_2O$ gas (in L) will be produced, assuming pressure and temperature remain constant?
    answer:
      value: 30.0
      tolerance: 0.2
    explanation: |
      At constant P and T, the volume ratio equals the mole ratio.
      $15.0 \text{ L } CH_4 \times (2 \text{ L } H_2O / 1 \text{ L } CH_4) = 30.0 \text{ L } H_2O$.

  - id: q003
    type: numericResponse
    skills:
      - chem-gas-stoichiometry
    prompt: |
      Solid potassium chlorate decomposes to form oxygen gas:
      $$2 KClO_3(s) \to 2 KCl(s) + 3 O_2(g)$$
      If you decompose enough $KClO_3$ to produce 1.50 moles of $O_2$ gas, what volume (in L) will the $O_2$ occupy at **STP**?
    answer:
      value: 33.6
      tolerance: 0.2
    explanation: |
      Since the gas is at STP, we can use 22.4 L/mol.
      $1.50 \text{ moles} \times 22.4 \text{ L/mol} = 33.6 \text{ L}$.

  - id: q004
    type: numericResponse
    skills:
      - chem-gas-stoichiometry
    prompt: |
      Zinc metal reacts with hydrochloric acid:
      $$Zn(s) + 2 HCl(aq) \to ZnCl_2(aq) + H_2(g)$$
      If 0.200 moles of $Zn$ are completely reacted, what volume of $H_2$ gas (in L) is produced at 298 K and 1.05 atm?
      *(Use $R = 0.0821$ L·atm/mol·K)*
    answer:
      value: 4.66
      tolerance: 0.1
    explanation: |
      Mole ratio $Zn : H_2$ is 1:1, so 0.200 moles of $H_2$ are produced.
      Use $V = nRT/P = (0.200 \times 0.0821 \times 298) / 1.05 = 4.893 / 1.05 = 4.66 \text{ L}$.

  - id: q005
    type: multipleChoice
    skills:
      - chem-gas-stoichiometry
    prompt: |
      A student needs to find the mass of solid reactant required to produce 10.0 L of gas at 85 °C and 1.2 atm. What is the correct first step in the stoichiometry map?
    choices:
      - id: a
        text: Divide 10.0 L by 22.4 L/mol to find the moles of gas.
      - id: b
        text: Use $PV = nRT$ to solve for the moles of gas ($n$).
      - id: c
        text: Multiply 10.0 L by the molar mass of the solid.
      - id: d
        text: Use the mole ratio from the balanced equation directly on the volume.
    answer:
      choiceId: b
    explanation: |
      Because the conditions are not STP, you cannot use 22.4 L/mol. You must use the Ideal Gas Law ($PV=nRT$) to convert the given volume of gas into moles before applying the mole ratio.

  - id: q006
    type: numericResponse
    skills:
      - chem-gas-stoichiometry
    prompt: |
      Consider the synthesis of ammonia:
      $$N_2(g) + 3 H_2(g) \to 2 NH_3(g)$$
      If you have 12.0 L of $N_2$ and 30.0 L of $H_2$ reacting at constant T and P, what volume (in L) of $NH_3$ can be produced? (Hint: Limiting reactant problem).
    answer:
      value: 20.0
      tolerance: 0.2
    explanation: |
      Since volumes are proportional to moles, we find the limiting reactant using volumes.
      $N_2$ requires $3 \times 12.0 = 36.0 \text{ L}$ of $H_2$. We only have 30.0 L of $H_2$. Therefore, $H_2$ is the limiting reactant.
      Volume of $NH_3$ produced = $30.0 \text{ L } H_2 \times (2 \text{ NH}_3 / 3 \text{ H}_2) = 20.0 \text{ L}$.

  - id: q007
    type: numericResponse
    skills:
      - chem-gas-stoichiometry
    prompt: |
      What mass (in g) of Calcium Carbonate ($CaCO_3$, $M = 100.1$ g/mol) must decompose to produce 5.00 L of $CO_2$ gas at STP?
      $$CaCO_3(s) \to CaO(s) + CO_2(g)$$
    answer:
      value: 22.3
      tolerance: 0.3
    explanation: |
      Since it's at STP, moles of $CO_2 = 5.00 \text{ L} / 22.4 \text{ L/mol} = 0.2232 \text{ moles}$.
      Mole ratio is 1:1, so we need 0.2232 moles of $CaCO_3$.
      Mass = $0.2232 \text{ mol} \times 100.1 \text{ g/mol} = 22.34 \text{ g}$.

  - id: q008
    type: multipleChoice
    skills:
      - chem-gas-stoichiometry
    prompt: |
      When doing gas stoichiometry involving a gas collected over water, what crucial step must be taken before using $PV=nRT$ to find the moles of gas?
    choices:
      - id: a
        text: The volume of the water must be subtracted from the total volume.
      - id: b
        text: The vapor pressure of the water must be subtracted from the total atmospheric pressure.
      - id: c
        text: The temperature of the water must be converted to Fahrenheit.
      - id: d
        text: The molar mass of water must be added to the gas.
    answer:
      choiceId: b
    explanation: |
      The total pressure in the collection flask includes both the gas and water vapor ($P_{total} = P_{gas} + P_{H_2O}$). You must subtract the water vapor pressure to find the pressure of the *dry* gas alone before plugging $P$ into $PV=nRT$.

  - id: q009
    type: numericResponse
    skills:
      - chem-gas-stoichiometry
    prompt: |
      $$2 H_2(g) + O_2(g) \to 2 H_2O(g)$$
      If 4.00 L of $H_2$ reacts completely, how many total liters of gas ($H_2O$) are present after the reaction? (Assume constant T and P, and $O_2$ is in excess).
    answer:
      value: 4.00
      tolerance: 0.1
    explanation: |
      Volume ratio is 2:2 (or 1:1) between $H_2$ and $H_2O(g)$. So 4.00 L of $H_2$ produces exactly 4.00 L of $H_2O$ vapor.

  - id: q010
    type: multipleChoice
    skills:
      - chem-gas-stoichiometry
    prompt: |
      A reaction produces $O_2$ gas. You measure the volume of gas produced at 20 °C. The next day, you repeat the experiment producing the exact same number of moles of $O_2$, but the room temperature has dropped to 15 °C (pressure remains constant). The volume measured on the second day will be:
    choices:
      - id: a
        text: Larger than the first day
      - id: b
        text: Smaller than the first day
      - id: c
        text: Exactly the same as the first day
      - id: d
        text: Impossible to determine
    answer:
      choiceId: b
    explanation: |
      Charles's Law: volume is directly proportional to temperature. If the temperature drops, the volume of the gas will decrease, even though the number of moles produced is identical. This highlights why STP or $PV=nRT$ corrections are necessary.
