lesson:
  introduction: 'Up until now, our series have just been sums of constant numbers.

    A **Power Series** is a series that contains a variable, $x$. It acts like an
    infinitely long polynomial!


    $$ \sum_{n=0}^\infty c_n x^n = c_0 + c_1 x + c_2 x^2 + c_3 x^3 + \dots $$

    '
  sections:
  - id: domain
    title: Interval and Radius of Convergence
    required: true
    content: 'Because a power series contains $x$, its convergence depends on the
      value of $x$ you plug in.

      The set of all $x$ values for which the series converges is called its **Interval
      of Convergence**.


      Every power series $\sum c_n (x-a)^n$ centered at $a$ falls into one of three
      categories:

      1. It only converges at the center, $x=a$ (Radius $R = 0$).

      2. It converges for all real numbers $x$ (Radius $R = \infty$).

      3. It converges for a specific radius $R$ around the center, meaning it converges
      when $|x-a| < R$ and diverges when $|x-a| > R$.


      We find the radius $R$ by using the **Ratio Test**.

      '
    check:
      id: domain-check
      type: multipleChoice
      prompt: If a power series centered at $x=3$ has a radius of convergence $R=2$,
        which of the following x-values is GUARANTEED to make the series converge?
      choices:
      - id: a
        text: $x = 4$
      - id: b
        text: $x = 5$
      - id: c
        text: $x = 1$
      - id: d
        text: $x = 6$
      answer:
        choiceId: a
      explanation: 'The series converges when $|x - 3| < 2$, meaning $1 < x < 5$.
        The endpoints (1 and 5) might converge or diverge, but $x=4$ is strictly inside
        the interval, so it guarantees convergence.

        '
  - id: ratio-test-power
    title: Using the Ratio Test
    required: true
    content: 'To find the interval of convergence, set up the Ratio Test and force
      the limit to be less than 1.


      Example: $\sum_{n=1}^\infty \frac{x^n}{n \cdot 2^n}$


      $$ \lim_{n \to \infty} \left| \frac{x^{n+1}}{(n+1)2^{n+1}} \cdot \frac{n2^n}{x^n}
      \right| = \lim_{n \to \infty} \left| \frac{x}{2} \cdot \frac{n}{n+1} \right|
      = \left| \frac{x}{2} \right| $$


      For convergence, we require $\left| \frac{x}{2} \right| < 1$, which means $|x|
      < 2$.

      So the Radius of Convergence is $R = 2$, and the interval is $(-2, 2)$.

      '
    check:
      id: ratio-test-power-check
      type: multipleChoice
      prompt: Why is the absolute value strictly necessary when performing the Ratio
        Test on a power series?
      choices:
      - id: a
        text: Because $x$ could be a negative number, and the Ratio Test requires
          positive terms.
      - id: b
        text: Because distance is always positive.
      - id: c
        text: Because the Ratio Test is the same as the Alternating Series Test.
      answer:
        choiceId: a
      explanation: 'The formal Ratio Test uses the absolute value $|a_{n+1}/a_n|$.
        Since $x$ can be negative, leaving out the absolute value would yield incorrect
        limits.

        '
  - id: endpoints
    title: Checking the Endpoints
    required: true
    content: 'The Ratio Test is **inconclusive** when $L = 1$, which happens exactly
      at the edges of the interval ($x = a \pm R$).


      You must test the endpoints manually by plugging them back into the original
      series and using other convergence tests (like the Alternating Series Test or
      p-series).


      In the previous example, the interval was $(-2, 2)$.

      - Plug in $x=2$: $\sum \frac{2^n}{n2^n} = \sum \frac{1}{n}$ (Diverges, harmonic
      series).

      - Plug in $x=-2$: $\sum \frac{(-2)^n}{n2^n} = \sum \frac{(-1)^n}{n}$ (Converges,
      alternating harmonic series).


      So the full interval of convergence is $[-2, 2)$.

      '
    check:
      id: endpoints-check
      type: multipleChoice
      prompt: If a series converges at both endpoints of its interval of convergence,
        what brackets are used for the interval?
      choices:
      - id: a
        text: $[a, b]$
      - id: b
        text: $(a, b)$
      - id: c
        text: $[a, b)$
      - id: d
        text: $(a, b]$
      answer:
        choiceId: a
      explanation: 'Square brackets $[$ and $]$ are used to denote that the endpoints
        are included in the interval.

        '
