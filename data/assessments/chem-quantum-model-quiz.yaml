questions:
  - id: qm-q01
    title: Heisenberg Uncertainty Principle
    type: multipleChoice
    prompt: |
      Which of the following best describes the Heisenberg Uncertainty Principle as it applies to electrons in an atom?
    choices:
      - id: a
        text: It is fundamentally impossible to simultaneously know both the exact position and the exact momentum (or velocity) of an electron.
      - id: b
        text: Electrons move randomly and unpredictably, so they do not follow any physical laws.
      - id: c
        text: The energy of an electron is uncertain until it absorbs a photon.
      - id: d
        text: We cannot know the charge and the mass of an electron at the same time.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** This principle destroyed the Bohr model's idea of neat, predictable orbits. Because measuring an electron inevitably disturbs it (bouncing a photon off it changes its momentum), we can only ever speak of the *probability* of finding an electron in a given region.

  - id: qm-q02
    title: Orbital Definition
    type: multipleChoice
    prompt: |
      In the quantum mechanical model, what exactly is an "orbital"?
    choices:
      - id: a
        text: A 3D region of space around the nucleus where there is a high probability (usually 90%) of finding an electron.
      - id: b
        text: A fixed circular path that an electron follows around the nucleus.
      - id: c
        text: A physical shell made of energy that surrounds the nucleus.
      - id: d
        text: The exact trajectory of an electron measured over time.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Orbitals are electron probability density clouds derived from the Schrödinger wave equation. They are not physical tracks or solid shells.

  - id: qm-q03
    title: Principal Quantum Number (n)
    type: multipleChoice
    prompt: |
      What property of an orbital is primarily determined by the principal quantum number, $n$?
    choices:
      - id: a
        text: The overall size and energy level of the orbital.
      - id: b
        text: The 3D shape of the orbital.
      - id: c
        text: The spatial orientation of the orbital.
      - id: d
        text: The spin direction of the electron within the orbital.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** As $n$ increases ($1, 2, 3 \dots$), the orbital becomes larger, meaning the electron spends more time further from the nucleus, and its energy increases.

  - id: qm-q04
    title: Angular Momentum Quantum Number (l)
    type: multipleChoice
    prompt: |
      Which quantum number determines the *shape* of the orbital (e.g., spherical $s$, dumbbell $p$, cloverleaf $d$)?
    choices:
      - id: a
        text: The angular momentum quantum number ($l$).
      - id: b
        text: The principal quantum number ($n$).
      - id: c
        text: The magnetic quantum number ($m_l$).
      - id: d
        text: The spin quantum number ($m_s$).
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** $l$ determines the subshell and the shape. $l=0$ is an $s$ orbital (sphere). $l=1$ is a $p$ orbital (dumbbell). $l=2$ is a $d$ orbital (cloverleaf).

  - id: qm-q05
    title: Magnetic Quantum Number (ml)
    type: multipleChoice
    prompt: |
      The magnetic quantum number ($m_l$) specifies the 3D orientation of an orbital in space. For a $p$-subshell (where $l = 1$), what are the possible values of $m_l$ and what does this mean physically?
    choices:
      - id: a
        text: $m_l$ can be $-1, 0, +1$, meaning there are exactly three $p$ orbitals pointing in different directions (like x, y, and z axes).
      - id: b
        text: $m_l$ can be $+1/2, -1/2$, meaning there are two $p$ orbitals.
      - id: c
        text: $m_l$ can only be $1$, meaning there is one large $p$ orbital.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** $m_l$ ranges from $-l$ to $+l$. For $l=1$, the values are $-1, 0, 1$. This corresponds to the three degenerate $p$ orbitals ($p_x, p_y, p_z$) that are oriented orthogonally to each other.

  - id: qm-q06
    title: Wave-Particle Duality
    type: multipleChoice
    prompt: |
      The quantum mechanical model of the atom treats the electron primarily as what?
    choices:
      - id: a
        text: A standing wave of probability.
      - id: b
        text: A tiny, solid, charged particle in a Newtonian orbit.
      - id: c
        text: A photon of light.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Louis de Broglie proposed that matter has wave-like properties. Schrödinger took this and treated the electron in a hydrogen atom as a 3D standing wave, leading to the wave functions that give us orbitals.

  - id: qm-q07
    title: Node Definition
    type: multipleChoice
    prompt: |
      In an orbital, what is a "node"?
    choices:
      - id: a
        text: A region of space where the probability of finding an electron is exactly zero.
      - id: b
        text: The point of maximum electron density.
      - id: c
        text: The center of the nucleus.
      - id: d
        text: The boundary where the orbital officially ends.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Because electrons act as standing waves, they have nodes (just like a vibrating guitar string has points that do not move). A node in a wave function squared ($|\psi|^2$) represents a plane or sphere of zero electron probability.

  - id: qm-q08
    title: Number of Orbitals per Subshell
    type: numericResponse
    prompt: |
      How many individual orbitals are contained within a single $d$-subshell (where $l=2$)?
    answer:
      value: 5
      tolerance: 0
    explanation: |
      For $l=2$, the possible values for $m_l$ are $-2, -1, 0, 1, 2$. That is 5 distinct values, meaning there are 5 individual $d$ orbitals in the subshell. Since each holds 2 electrons, the d-block is 10 elements wide.

  - id: qm-q09
    title: Spin Quantum Number (ms)
    type: multipleChoice
    prompt: |
      What does the spin quantum number ($m_s = +1/2$ or $-1/2$) physically represent?
    choices:
      - id: a
        text: It represents the two possible fundamental magnetic states of an electron.
      - id: b
        text: It represents whether the electron is physically spinning clockwise or counterclockwise on its axis like a top.
      - id: c
        text: It represents the speed of the electron (half the speed of light).
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Although historically visualized as a spinning top, quantum "spin" is an intrinsic property of the particle, like charge or mass. It gives the electron a tiny magnetic moment that can align in one of two directions in a magnetic field.

  - id: qm-q10
    title: Valid Quantum Numbers
    type: multipleChoice
    prompt: |
      Which of the following sets of quantum numbers $(n, l, m_l)$ is **NOT** allowed?
    choices:
      - id: a
        text: $(2, 2, 0)$
      - id: b
        text: $(3, 1, -1)$
      - id: c
        text: $(1, 0, 0)$
      - id: d
        text: $(4, 3, +2)$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The angular momentum quantum number $l$ must be strictly less than $n$ ($l = 0$ to $n-1$). If $n=2$, the maximum value for $l$ is 1. Therefore, $(2, 2, 0)$ is impossible (there is no such thing as a $2d$ orbital).
