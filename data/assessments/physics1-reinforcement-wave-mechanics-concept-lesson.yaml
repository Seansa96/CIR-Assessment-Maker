lesson:
  introduction: A traveling wave transports a pattern and energy while medium elements oscillate locally. Use phase, $v=f\lambda$, and boundary conditions to interpret wave behavior.
  sections:
  - id: physics1-reinforcement-wave-s1
    title: Read the propagation direction
    required: true
    content: In $y=f(x-vt)$, constant phase moves toward increasing $x$. In $f(x+vt)$, it moves toward decreasing $x$.
    check:
      id: physics1-reinforcement-wave-s1-check
      type: multipleChoice
      prompt: In which direction does $y=A\cos(kx-\omega t)$ travel?
      choices:
      - { id: a, text: 'Positive $x$' }
      - { id: b, text: 'Negative $x$', issueSignals: [{ id: physics1-wave-sign-direction-error, domains: [physics-1] }] }
      - { id: c, text: 'It does not travel because it is sinusoidal', issueSignals: [{ id: physics1-wave-pattern-motion-error, domains: [physics-1] }] }
      - { id: d, text: 'Both directions at the same time', issueSignals: [{ id: physics1-wave-standing-wave-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Constant phase requires $kx-\omega t=$ constant, so $x$ increases with $t$. Why it works: The minus sign selects rightward propagation. Why the other choices fail: They reverse the sign or confuse a traveling wave with a standing-wave superposition.'
    difficultyDimensions: [representation, sign]
    difficultyEvidence: Derives propagation direction from constant phase.
  - id: physics1-reinforcement-wave-s2
    title: Relate wavelength and frequency
    required: true
    content: Wave speed satisfies $v=f\lambda$. Frequency is set by the source; speed and wavelength respond to the medium.
    check:
      id: physics1-reinforcement-wave-s2-check
      type: multipleChoice
      prompt: A wave enters a new medium where its speed is lower while the source frequency stays fixed. What happens to wavelength?
      choices:
      - { id: a, text: 'It decreases because $\lambda=v/f$' }
      - { id: b, text: 'It increases because the wave slows down', issueSignals: [{ id: physics1-wave-speed-wavelength-error, domains: [physics-1] }] }
      - { id: c, text: 'It stays fixed because frequency changes', issueSignals: [{ id: physics1-wave-frequency-source-error, domains: [physics-1] }] }
      - { id: d, text: 'It becomes zero at the boundary', issueSignals: [{ id: physics1-wave-boundary-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: With fixed $f$, $\lambda=v/f$, so lower speed gives shorter wavelength. Why it works: The source controls frequency while the medium controls propagation speed. Why the other choices fail: They reverse the ratio or incorrectly let the source frequency change.'
    difficultyDimensions: [proportionality, boundaryCondition]
    difficultyEvidence: Tracks which wave quantity is source-controlled.
  - id: physics1-reinforcement-wave-s3
    title: Distinguish particle and pattern speed
    required: true
    content: Wave speed describes phase-pattern motion; a point on the medium has an oscillatory transverse velocity that may differ in magnitude and direction.
    check:
      id: physics1-reinforcement-wave-s3-check
      type: multipleChoice
      prompt: Which statement correctly distinguishes wave speed from particle velocity?
      choices:
      - { id: a, text: 'Wave speed is pattern propagation; particle velocity is the local time derivative of displacement' }
      - { id: b, text: 'They are always equal because both use metres per second', issueSignals: [{ id: physics1-wave-speed-particle-speed-error, domains: [physics-1] }] }
      - { id: c, text: 'Particle velocity is zero for every traveling wave', issueSignals: [{ id: physics1-wave-particle-motion-error, domains: [physics-1] }] }
      - { id: d, text: 'Wave speed depends only on amplitude', issueSignals: [{ id: physics1-wave-speed-model-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Wave speed is the speed of constant phase, while particle velocity is $\partial y/\partial t$. Why it works: A traveling pattern can pass while each element oscillates locally. Why the other choices fail: Equal units do not imply equal quantities, and the medium does move.'
    difficultyDimensions: [representation, modelDefinition]
    difficultyEvidence: Separates two velocities with the same units but different meanings.
  - id: physics1-reinforcement-wave-s4
    title: Apply fixed-end conditions
    required: true
    content: A string fixed at both ends has nodes at both boundaries. Allowed wavelengths satisfy $L=n\lambda/2$.
    check:
      id: physics1-reinforcement-wave-s4-check
      type: multipleChoice
      prompt: For a string of length $L$ fixed at both ends, what is the fundamental wavelength?
      choices:
      - { id: a, text: '$2L$' }
      - { id: b, text: '$L/2$', issueSignals: [{ id: physics1-standing-wave-boundary-error, domains: [physics-1] }] }
      - { id: c, text: '$L$', issueSignals: [{ id: physics1-standing-wave-node-error, domains: [physics-1] }] }
      - { id: d, text: '$4L$', issueSignals: [{ id: physics1-standing-wave-mode-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: The fundamental has half a wavelength between the nodes, so $L=\lambda/2$ and $\lambda=2L$. Why it works: The endpoint boundary condition selects the allowed spatial pattern. Why the other choices fail: They place the wrong fraction of a wavelength in the string.'
    difficultyDimensions: [boundaryCondition, derivation]
    difficultyEvidence: Derives the fundamental mode from endpoint constraints.
