lesson:
  introduction: Build a reliable model of bonding, molecular geometry, and compounds review by separating electron accounting,
    particle representation, and observable evidence.
  sections:
  - id: classify-first
    title: Classify before selecting a method
    required: true
    content: Composition and particle evidence decide whether to use ion-charge, molecular-prefix, or network-covalent reasoning.
    check:
      id: chk-classify-first
      type: multipleChoice
      prompt: Which statement correctly applies the idea of classify before selecting a method?
      choices:
      - id: a
        text: Fe2O3 requires ionic charge analysis before naming.
        issueSignals: []
      - id: b
        text: Fe2O3 should receive molecular prefixes because it has five atoms.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Fe2O3 requires ionic charge analysis before naming. Why it works: Composition and particle evidence
        decide whether to use ion-charge, molecular-prefix, or network-covalent reasoning. Why the other choices fail: The
        other statements either reverse the relevant electron or charge accounting or apply a structural model outside its
        stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-integrated-review-map.svg
      alt: Instructional workflow for bonding, molecular geometry, and compounds review showing the central particle-level
        decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: formula-name
    title: Connect charge balance to nomenclature
    required: true
    content: For ionic substances, charge balance determines subscripts and a variable metal's Roman numeral; prefixes instead
      preserve molecular atom counts.
    check:
      id: chk-formula-name
      type: multipleChoice
      prompt: Which statement correctly applies the idea of connect charge balance to nomenclature?
      choices:
      - id: a
        text: Iron(III) oxide is consistent with Fe3+ and O2- in Fe2O3.
        issueSignals: []
      - id: b
        text: The Roman numeral in iron(III) oxide reports three iron atoms.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Iron(III) oxide is consistent with Fe3+ and O2- in Fe2O3. Why it works: For ionic substances,
        charge balance determines subscripts and a variable metal''s Roman numeral; prefixes instead preserve molecular atom
        counts. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
  - id: lewis-account
    title: Build and verify Lewis structures
    required: true
    content: Count valence electrons, establish connectivity, distribute pairs, and verify the electron total and formal-charge
      sum before using the drawing downstream.
    check:
      id: chk-lewis-account
      type: multipleChoice
      prompt: Which statement correctly applies the idea of build and verify lewis structures?
      choices:
      - id: a
        text: A Lewis structure check must agree with both electron total and species charge.
        issueSignals: []
      - id: b
        text: A visually symmetric drawing is valid even if it uses the wrong electron total.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: A Lewis structure check must agree with both electron total and species charge. Why it works:
        Count valence electrons, establish connectivity, distribute pairs, and verify the electron total and formal-charge
        sum before using the drawing downstream. Why the other choices fail: The other statements either reverse the relevant
        electron or charge accounting or apply a structural model outside its stated scope.'
  - id: shape
    title: Convert a Lewis structure to local geometry
    required: true
    content: Count bond directions and central lone pairs at the requested center, distinguish electron geometry from molecular
      geometry, and refine angles qualitatively.
    check:
      id: chk-shape
      type: multipleChoice
      prompt: Which statement correctly applies the idea of convert a lewis structure to local geometry?
      choices:
      - id: a
        text: SO2 is locally bent at sulfur after counting three domains.
        issueSignals: []
      - id: b
        text: SO2 is linear because its formula has three atoms.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: SO2 is locally bent at sulfur after counting three domains. Why it works: Count bond directions
        and central lone pairs at the requested center, distinguish electron geometry from molecular geometry, and refine
        angles qualitatively. Why the other choices fail: The other statements either reverse the relevant electron or charge
        accounting or apply a structural model outside its stated scope.'
  - id: polarity
    title: Add bond dipoles using geometry
    required: true
    content: Assign local dipole directions and add them as vectors. Polar bonds can cancel in a symmetric geometry or reinforce
      in an asymmetric one.
    check:
      id: chk-polarity
      type: multipleChoice
      prompt: Which statement correctly applies the idea of add bond dipoles using geometry?
      choices:
      - id: a
        text: Bent SO2 has a nonzero molecular dipole.
        issueSignals: []
      - id: b
        text: Every molecule with two identical terminal atoms is nonpolar.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Bent SO2 has a nonzero molecular dipole. Why it works: Assign local dipole directions and add
        them as vectors. Polar bonds can cancel in a symmetric geometry or reinforce in an asymmetric one. Why the other choices
        fail: The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
  - id: properties
    title: Return to observable properties
    required: true
    content: Use the particle model to explain melting, conductivity, brittleness, or molecular behavior without claiming
      that one observation uniquely proves a model.
    check:
      id: chk-properties
      type: multipleChoice
      prompt: Which statement correctly applies the idea of return to observable properties?
      choices:
      - id: a
        text: Molten ionic material conducts because ions become mobile.
        issueSignals: []
      - id: b
        text: A high melting point by itself proves that a substance is ionic.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      - id: c
        text: The response uses a valid rule from a different stage of the analysis and therefore does not answer the stated
          question.
        issueSignals:
        - id: chemistry-bonding-review-method-error
      answer:
        choiceId: a
      explanation: 'Solution: Molten ionic material conducts because ions become mobile. Why it works: Use the particle model
        to explain melting, conductivity, brittleness, or molecular behavior without claiming that one observation uniquely
        proves a model. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
