- id: example-2
  title: Compare lattice attraction
  problem: Compare NaF, CsI, and CaO qualitatively.
  steps:
  - id: we2-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - NaF and CsI have the same charge product, so ion size distinguishes them; smaller NaF has stronger attraction.
    explanation: 'Solution: NaF and CsI have the same charge product, so ion size distinguishes them; smaller NaF has stronger
      attraction. Why it works: This step follows the topic''s accounting rules and supplies a separate check before the final
      conclusion.'
  - id: we2-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - CaO has 2+ and 2- ions, giving a larger charge product than either 1+/1- salt.
    explanation: 'Solution: CaO has 2+ and 2- ions, giving a larger charge product than either 1+/1- salt. Why it works: This
      step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we2-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The expected increasing attraction is CsI, NaF, CaO; verify that both charge and distance were considered.
    explanation: 'Solution: The expected increasing attraction is CsI, NaF, CaO; verify that both charge and distance were
      considered. Why it works: This step follows the topic''s accounting rules and supplies a separate check before the final
      conclusion.'
- id: example-3
  title: Explain calcium chloride properties
  problem: Relate CaCl2 composition and behavior to its particle model.
  steps:
  - id: we3-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - One Ca2+ requires two Cl- ions, so the formula unit is CaCl2.
    explanation: 'Solution: One Ca2+ requires two Cl- ions, so the formula unit is CaCl2. Why it works: This step follows
      the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we3-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - In the solid, ions occupy fixed lattice positions and cannot carry current through bulk motion.
    explanation: 'Solution: In the solid, ions occupy fixed lattice positions and cannot carry current through bulk motion.
      Why it works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we3-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - When molten or dissolved, mobile ions conduct; a shifted crystal can fracture when like charges align.
    explanation: 'Solution: When molten or dissolved, mobile ions conduct; a shifted crystal can fracture when like charges
