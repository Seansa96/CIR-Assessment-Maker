lesson:
  introduction: >
    The binomial theorem is a pattern language for powers of two-term expressions. Instead of multiplying $(a+b)$ by itself repeatedly, track three coordinated patterns: coefficients, the falling exponent on $a$, and the rising exponent on $b$.
  sections:
  - id: theorem-meaning
    title: Why binomial coefficients appear
    required: true
    content: >
      In $(a+b)^n$, choose $b$ from exactly $k$ of the $n$ factors and $a$ from the rest. Every such choice makes $a^{n-k}b^k$, and there are $\binom nk$ choices. Therefore


      $$

      (a+b)^n=\sum_{k=0}^{n}\binom nk a^{n-k}b^k.

      $$
    media:
    - type: image
      src: /assessments/precalc-binomial/term-map.svg
      alt: A visual table connecting coefficients with descending a exponents and ascending b exponents.
      caption: 
    check:
      id: theorem-meaning-check
      type: selectAll
      prompt: Which statements describe every term $\binom nk a^{n-k}b^k$?
      choices:
      - id: a
        text: The exponents add to $n$.
        media: []
        issueSignals: []
      - id: b
        text: The exponent on $a$ decreases as $k$ increases.
        media: []
        issueSignals: []
      - id: c
        text: Every coefficient is $1$.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      - id: d
        text: $\binom nk$ counts factor choices.
        media: []
        issueSignals: []
      answer:
        choiceId: 
        choiceIds:
        - a
        - b
        - d
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The true statements are A, B, and D.


        Why it works: $(n-k)+k=n$, and $\binom nk$ counts the selections of $k$ factors contributing $b$.


        Why the other choices fail: Coefficients vary with $k$ except at the ends.
