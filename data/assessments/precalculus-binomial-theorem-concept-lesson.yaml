  - id: coefficient-calculation
    title: Separate the binomial count from numerical powers
    required: true
    content: >
      A coefficient can have two sources: the binomial coefficient and the numerical powers inside the two terms. For example, the $x^2$ term of $(x+3)^4$ has coefficient $\binom42 3^2$, not merely $\binom42$.
    media: []
    check:
      id: coefficient-calculation-check
      type: multipleChoice
      prompt: What is the coefficient of $x^2$ in $(x+3)^4$?
      choices:
      - id: a
        text: $54$
        media: []
        issueSignals: []
      - id: b
        text: $6$
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: c
        text: $18$
        media: []
        issueSignals:
        - id: exponent-rule-misapplied
          domains: []
      - id: d
        text: $81$
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The $x^2$ term has $k=2$, so its coefficient is $\binom42 3^2=6\cdot9=54$.


        Why it works: Matching $4-k=2$ selects the correct term, then both the binomial count and the constant power contribute to its coefficient.


        Why the other choices fail: They omit either the binomial coefficient, part of the power of $3$, or use the constant endpoint instead.
