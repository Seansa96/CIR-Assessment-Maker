  - id: signs-and-substitution
    title: Preserve signs by substituting whole terms
    required: true
    content: >
      Treat a difference as a sum with a negative second term: $(3x-2)^6=(3x+(-2))^6$. Then $(-2)^k$ automatically produces the correct alternating signs. First build the symbolic pattern; simplify numeric powers afterward.
    media: []
    check:
      id: signs-check
      type: multipleChoice
      prompt: In $(x-4)^4$, what should be substituted for $b$?
      choices:
      - id: a
        text: $-4$
        media: []
        issueSignals: []
      - id: b
        text: $4$, then make all terms negative
        media: []
        issueSignals:
        - id: sign-error
          domains: []
      - id: c
        text: $x-4$
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      - id: d
        text: $-x$
        media: []
        issueSignals:
        - id: sign-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Write the expression as $(x+(-4))^4$, so $b=-4$.


        Why it works: The sign is part of the second term and is raised to the power $k$.


        Why the other choices fail: They detach the sign from the term or replace the wrong quantity.
