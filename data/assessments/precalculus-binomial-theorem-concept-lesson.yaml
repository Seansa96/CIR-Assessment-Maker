  - id: exponent-bookkeeping
    title: Track both exponents in every term
    required: true
    content: >
      In the $k$th selection pattern, the first term supplies $a^{n-k}$ and the second supplies $b^k$. The exponents always add to $n$, which is a quick check that no factor has been lost. For $(x+2)^6$, the term containing $x^4$ must use $k=2$.
    media: []
    check:
      id: exponent-bookkeeping-check
      type: multipleChoice
      prompt: Which term of $(x+2)^6$ contains $x^4$ before its numerical coefficient is simplified?
      choices:
      - id: a
        text: $\binom62x^4(2)^2$
        media: []
        issueSignals: []
      - id: b
        text: $\binom64x^4(2)^4$
        media: []
        issueSignals:
        - id: exponent-rule-misapplied
          domains: []
      - id: c
        text: $\binom62x^2(2)^4$
        media: []
        issueSignals:
        - id: exponent-rule-misapplied
          domains: []
      - id: d
        text: $\binom66x^4$
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Set $6-k=4$, so $k=2$ and the term is $\binom62x^4(2)^2$.


        Why it works: The first exponent is $n-k$ and the second exponent is $k$, so their sum remains $6$.


        Why the other choices fail: They use an exponent pair that does not produce $x^4$ while keeping both exponents tied to the same $k$.
