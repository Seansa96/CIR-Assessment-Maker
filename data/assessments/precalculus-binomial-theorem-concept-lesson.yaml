  - id: choose-a-method
    title: Choose expansion or extraction deliberately
    required: true
    content: >
      Expand the whole expression when the complete polynomial is needed. When a question asks for one coefficient or one term, the general-term method is more efficient because it avoids computing terms that will not be used.
    media: []
    check:
      id: choose-a-method-check
      type: multipleChoice
      prompt: Which task is best handled by the general term instead of a full expansion?
      choices:
      - id: a
        text: Find the coefficient of $x^5$ in $(2x-1)^9$.
        media: []
        issueSignals: []
      - id: b
        text: List every term of $(x+1)^4$.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      - id: c
        text: Rewrite $(x+1)^2$ as a product.
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: d
        text: Decide whether $x=1$ is a root of $x^2-1$.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Use the general term to isolate the one term containing $x^5$ in $(2x-1)^9$.


        Why it works: The requested output is one coefficient, so matching an exponent is faster than calculating every term of a ninth power.


        Why the other choices fail: They either require the whole expansion or are not binomial-expansion tasks.
