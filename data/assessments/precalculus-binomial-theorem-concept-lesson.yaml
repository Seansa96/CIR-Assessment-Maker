  - id: coefficient-extraction
    title: Extract one term instead of expanding all of them
    required: true
    content: >
      If only one coefficient is requested, use the general term, match the desired power, solve for $k$, and evaluate that one term. This is faster and makes the exponent bookkeeping visible.
    media:
    - type: image
      src: /assessments/precalc-binomial/coefficient-flow.svg
      alt: Four-step flow for finding a binomial coefficient without a full expansion.
      caption: 
    check:
      id: extraction-check
      type: multipleChoice
      prompt: To find the $x^4$ term of $(2x-3)^7$, which equation identifies the needed $k$?
      choices:
      - id: a
        text: $7-k=4$
        media: []
        issueSignals: []
      - id: b
        text: $k=4$
        media: []
        issueSignals:
        - id: exponent-rule-misapplied
          domains: []
      - id: c
        text: $7+k=4$
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: d
        text: $2k=4$
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The $x$ power comes from $(2x)^{7-k}$, so solve $7-k=4$.


        Why it works: The exponent on the first binomial term falls from $7$ by $k$.


        Why the other choices fail: They do not match the actual exponent of $x$.
