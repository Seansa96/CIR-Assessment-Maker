  - id: pascal-pattern
    title: Pascal's triangle is a coefficient calculator
    required: true
    content: >
      Pascal's triangle gives the coefficient row for each nonnegative integer exponent. Start and end every row with $1$; each interior value is the sum of the two values above it. For example, row $5$ is $1,5,10,10,5,1$.
    media:
    - type: image
      src: /assessments/precalc-binomial/pascal-triangle.svg
      alt: Pascal's triangle through row five with row five highlighted.
      caption: 
    check:
      id: pascal-pattern-check
      type: multipleChoice
      prompt: Which coefficient row is used for $(a-b)^5$?
      choices:
      - id: a
        text: $1,5,10,10,5,1$
        media: []
        issueSignals: []
      - id: b
        text: $1,4,6,4,1$
        media: []
        issueSignals:
        - id: exponent-rule-misapplied
          domains: []
      - id: c
        text: $1,1,1,1,1,1$
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      - id: d
        text: $5,10,10,5$
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Use row $5$: $1,5,10,10,5,1$.


        Why it works: The exponent selects the row; the sign of the second term does not change the coefficients.


        Why the other choices fail: They use a different row or omit endpoint coefficients.
