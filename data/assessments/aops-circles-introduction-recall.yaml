schemaVersion: 1
id: aops-circles-introduction-recall
title: Circles Terminology Recall Drill
assessmentType: recallDrill
categoryId: art-of-problem-solving
topicId: aops-circles-introduction
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - art-of-problem-solving
  - aops-circles-introduction
  - aops-volume-1
  - geometry
  - terminology
skills:
- Recall precise definitions and theorem triggers.
items:
- id: circle-flashcard
  type: flashcard
  prompt: Define Circle and state its recognition cue.
  answer:
    expected: The set of points in a plane at one fixed positive distance from a center.
  explanation: Every boundary point P satisfies OP=r.
  tags:
  - circle
  - aops-circles-introduction
- id: disk-flashcard
  type: flashcard
  prompt: Define Disk and state its recognition cue.
  answer:
    expected: A circle together with all points in its interior.
  explanation: Area refers to the disk, while circumference refers to its boundary.
  tags:
  - disk
  - aops-circles-introduction
- id: radius-flashcard
  type: flashcard
  prompt: Define Radius and state its recognition cue.
  answer:
    expected: A segment from the center to a point on the circle, or its length.
  explanation: OA is a radius when A lies on the circle.
  tags:
  - radius
  - aops-circles-introduction
- id: diameter-flashcard
  type: flashcard
  prompt: Define Diameter and state its recognition cue.
  answer:
    expected: A chord that passes through the center; its length is twice the radius.
  explanation: A diameter divides the circle into two semicircles.
  tags:
  - diameter
  - aops-circles-introduction
- id: chord-flashcard
  type: flashcard
  prompt: Define Chord and state its recognition cue.
  answer:
    expected: A segment whose two endpoints lie on the circle.
  explanation: Every diameter is a chord, but not every chord is a diameter.
  tags:
  - chord
  - aops-circles-introduction
- id: secant-flashcard
  type: flashcard
  prompt: Define Secant and state its recognition cue.
  answer:
    expected: A line that intersects a circle at two points.
  explanation: A secant continues beyond both endpoints of its chord.
  tags:
  - secant
  - aops-circles-introduction
- id: tangent-flashcard
  type: flashcard
  prompt: Define Tangent and state its recognition cue.
  answer:
    expected: A line that meets a circle at exactly one point.
  explanation: The tangent at T is perpendicular to radius OT.
  tags:
  - tangent
  - aops-circles-introduction
- id: point-of-tangency-flashcard
  type: flashcard
  prompt: Define Point of tangency and state its recognition cue.
  answer:
    expected: The unique point where a tangent meets its circle.
  explanation: A radius to T makes the tangent-radius right angle.
  tags:
  - point-of-tangency
  - aops-circles-introduction
- id: circumference-flashcard
  type: flashcard
  prompt: Define Circumference and state its recognition cue.
  answer:
    expected: The length of a circle's boundary.
  explanation: A radius-5 circle has circumference 10pi.
  tags:
  - circumference
  - aops-circles-introduction
- id: arc-flashcard
  type: flashcard
  prompt: Define Arc and state its recognition cue.
  answer:
    expected: A connected portion of a circle's circumference between two endpoints.
  explanation: An arc is one-dimensional; it is not a sector.
  tags:
  - arc
  - aops-circles-introduction
- id: minor-arc-flashcard
  type: flashcard
  prompt: Define Minor arc and state its recognition cue.
  answer:
    expected: The arc between two points measuring less than 180 degrees.
  explanation: Two-letter arc notation usually names a minor arc.
  tags:
  - minor-arc
  - aops-circles-introduction
- id: major-arc-flashcard
  type: flashcard
  prompt: Define Major arc and state its recognition cue.
  answer:
    expected: The arc between two points measuring more than 180 degrees.
  explanation: A third point often identifies which major arc is intended.
  tags:
  - major-arc
  - aops-circles-introduction
- id: central-angle-flashcard
  type: flashcard
  prompt: Define Central angle and state its recognition cue.
  answer:
    expected: An angle whose vertex is the center of a circle.
  explanation: Its degree measure equals that of its intercepted arc.
  tags:
  - central-angle
  - aops-circles-introduction
- id: sector-flashcard
  type: flashcard
  prompt: Define Sector and state its recognition cue.
  answer:
    expected: The region bounded by two radii and their intercepted arc.
  explanation: A 90-degree sector is one quarter of a disk.
  tags:
  - sector
  - aops-circles-introduction
- id: concentric-circles-flashcard
  type: flashcard
  prompt: Define Concentric circles and state its recognition cue.
  answer:
    expected: Circles that share the same center but have different radii.
  explanation: A washer-shaped region lies between concentric circles.
  tags:
  - concentric-circles
  - aops-circles-introduction
- id: intercepted-arc-flashcard
  type: flashcard
  prompt: Define Intercepted arc and state its recognition cue.
  answer:
    expected: The arc lying between the points where an angle's sides meet a circle.
  explanation: Circle-angle formulas require the correct intercepted arc.
  tags:
  - intercepted-arc
  - aops-circles-introduction
