sections:
- id: sec-1
  title: AM-GM Inequality
  content: The Arithmetic Mean-Geometric Mean Inequality states that for non-negative
    real numbers, the arithmetic mean is greater than or equal to the geometric mean.
    Equality holds if and only if all numbers are equal.
  check:
    id: check-1
    type: multipleChoice
    prompt: When does AM-GM achieve equality?
    options:
    - id: a
      text: When all variables are equal
    - id: b
      text: When the sum is 1
    answer:
      choiceId: a
- id: sec-2
  title: Cauchy's Functional Equation
  content: The only continuous solutions to f(x+y) = f(x) + f(y) are of the form f(x)
    = cx.
  check:
    id: check-2
    type: multipleChoice
    prompt: What is the general continuous solution to Cauchy's equation?
    options:
    - id: a
      text: f(x) = cx
    - id: b
      text: f(x) = x^2
    answer:
      choiceId: a
