schemaVersion: 1
id: calc2-power-series-hard-test
title: Power Series Hard Test
assessmentType: test
categoryId: calculus-2
topicId: power-series
skills:
- Determine radii from factorial and binomial coefficient growth
- Analyze endpoints, parity, composition, and coefficient convolution
- Derive power-series recurrences and generating-function identities
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - power-series
  - hard
  - coefficient-analysis
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - find-radii-from-stirling-asymptotics
  prompt: |
    What is the radius of convergence of
    $\sum_{n=1}^{\infty}(n^n/n!)x^n$?
  choices:
  - id: a
    text: $1/e$
  - id: b
    text: $e$
  - id: c
    text: $1$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: |-
    Stirling gives $(n^n/n!)^{1/n}\to e$, so the Cauchy–Hadamard radius is its reciprocal.
- id: q002
  type: multipleChoice
  skills:
  - find-radii-from-central-binomial-growth
  prompt: |
    Find the radius of
    $\sum_{n=1}^{\infty}[(n!)^2/(2n)!]x^n$.
  choices:
  - id: a
    text: $4$
  - id: b
    text: $1/4$
  - id: c
    text: $2$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: The coefficient is the reciprocal central binomial coefficient and has nth-root limit one
    fourth.
- id: q003
  type: multipleChoice
  skills:
  - test-shifted-power-series-endpoints
  prompt: |
    Determine the interval of convergence of
    $\sum_{n=1}^{\infty}(x+2)^n/(n3^n)$.
  choices:
  - id: a
    text: $[-5,1)$
  - id: b
    text: $(-5,1)$
  - id: c
    text: $[-5,1]$
  - id: d
    text: $(-5,1]$
  answer:
    choiceId: a
  explanation: The radius is three; x equals negative five gives the alternating harmonic series, while
    x equals one gives the harmonic series.
- id: q004
  type: multipleChoice
  skills:
  - derive-binomial-generating-functions
  prompt: |
    What is the coefficient of $x^n$ in $1/(1-x)^3$?
  choices:
  - id: a
    text: $(n+1)(n+2)/2$
  - id: b
    text: $n+1$
  - id: c
    text: $n^2$
  - id: d
    text: $3^n$
  answer:
    choiceId: a
  explanation: |-
    The negative-binomial expansion gives $\binom{n+2}{2}$, or differentiate the geometric series twice with the correct scale.
- id: q005
  type: multipleChoice
  skills:
  - compute-cauchy-product-coefficients
  prompt: |
    Squaring $\sum_{n=0}^{\infty}x^n$ inside $|x|<1$, what is the
    coefficient of $x^m$?
  choices:
  - id: a
    text: $m+1$
  - id: b
    text: $m$
  - id: c
    text: $2^m$
  - id: d
    text: $1$
  answer:
    choiceId: a
  explanation: The convolution pairs $(k,m-k)$ range from k equals zero through m, giving m plus one contributions.
- id: q006
  type: multipleChoice
  skills:
  - extract-even-and-odd-power-series
  prompt: |
    If $f(x)=\sum c_nx^n$, which expression retains only its even-power
    terms?
  choices:
  - id: a
    text: $[f(x)+f(-x)]/2$
  - id: b
    text: $[f(x)-f(-x)]/2$
  - id: c
    text: $f(x^2)/2$
  - id: d
    text: $f(x)+f(x)$
  answer:
    choiceId: a
  explanation: Substitution of negative x preserves even powers and reverses odd powers, so averaging
    cancels the odd part.
- id: q007
  type: multipleChoice
  skills:
  - derive-coefficient-recurrences-from-odes
  prompt: |
    Let $y=\sum_{n=0}^{\infty}c_nx^n$ satisfy $y'=y$ and $y(0)=2$.
    Which recurrence is correct?
  choices:
  - id: a
    text: $c_0=2$ and $c_{n+1}=c_n/(n+1)$
  - id: b
    text: $c_0=0$ and $c_{n+1}=(n+1)c_n$
  - id: c
    text: $c_n=2$ for every n
  - id: d
    text: $c_{n+1}=-c_n$
  answer:
    choiceId: a
  explanation: |-
    Matching the x-to-the-n coefficient in $y'=\sum(n+1)c_{n+1}x^n$ with y gives the recurrence.
- id: q008
  type: multipleChoice
  skills:
  - compose-power-series
  prompt: |
    From $1/(1-u)=\sum u^n$, which series represents $1/(1-x^2)$?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}x^{2n}$ for $|x|<1$
  - id: b
    text: |-
      $\sum x^n$ for $|x|<2$
  - id: c
    text: |-
      $\sum(-1)^nx^{2n}$
  - id: d
    text: |-
      $\sum x^{n+2}$
  answer:
    choiceId: a
  explanation: Substitute u equals x squared; the condition $|u|<1$ becomes $|x|<1$.
- id: q009
  type: multipleChoice
  skills:
  - use-power-series-uniqueness
  prompt: |
    Two power series centered at a agree for every x in an open interval
    around a. What follows?
  choices:
  - id: a
    text: Their corresponding coefficients are equal.
  - id: b
    text: Only their constant coefficients agree.
  - id: c
    text: Their radii must be infinite.
  - id: d
    text: Their coefficients may differ arbitrarily.
  answer:
    choiceId: a
  explanation: Repeated derivatives at the center recover each coefficient uniquely.
- id: q010
  type: multipleChoice
  skills:
  - connect-singularities-and-radii
  prompt: |
    What is the radius of the Taylor series of $1/(1+x^2)$ centered at
    zero?
  choices:
  - id: a
    text: $1$
  - id: b
    text: |-
      $\infty$
  - id: c
    text: $2$
  - id: d
    text: $1/2$
  answer:
    choiceId: a
  explanation: |-
    The geometric representation $\sum(-1)^nx^{2n}$ requires $|x|<1$; equivalently the complex singularities are at plus or minus i.
- id: q011
  type: multipleChoice
  skills:
  - track-radii-under-integration
  prompt: |
    If $\sum c_n(x-a)^n$ has radius R, what radius does its termwise
    antiderivative have?
  choices:
  - id: a
    text: $R$
  - id: b
    text: $R+1$
  - id: c
    text: $R/2$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: Dividing coefficients by n plus one changes only subexponential growth, so the radius is
    unchanged.
- id: q012
  type: multipleChoice
  skills:
  - analyze-sums-of-power-series
  prompt: |
    Power series f and g share a center and have radii $2$ and $5$. What is
    guaranteed about the radius of $f+g$?
  choices:
  - id: a
    text: It is at least $2$.
  - id: b
    text: It is exactly $2$.
  - id: c
    text: It is exactly $7$.
  - id: d
    text: It is zero.
  answer:
    choiceId: a
  explanation: Both converge in the smaller disk, while coefficient cancellation can make the sum's radius
    larger.
- id: q013
  type: multipleChoice
  skills:
  - differentiate-known-power-series
  prompt: |
    Inside $|x|<1$, what function equals
    $\sum_{n=1}^{\infty}(-1)^{n-1}x^{n-1}$?
  choices:
  - id: a
    text: $1/(1+x)$
  - id: b
    text: $1/(1-x)$
  - id: c
    text: |-
      $\ln(1+x)$
  - id: d
    text: |-
      $-\ln(1-x)$
  answer:
    choiceId: a
  explanation: |-
    This is the geometric series with ratio negative x, and it is also the derivative of $\ln(1+x)$.
- id: q014
  type: multipleChoice
  skills:
  - evaluate-power-series-at-interior-points
  prompt: |
    Evaluate $\sum_{n=0}^{\infty}(n+1)/2^n$.
  choices:
  - id: a
    text: $4$
  - id: b
    text: $2$
  - id: c
    text: $3$
  - id: d
    text: $6$
  answer:
    choiceId: a
  explanation: |-
    Use $\sum(n+1)x^n=1/(1-x)^2$ at x equals one half.
- id: q015
  type: multipleChoice
  skills:
  - interpret-endpoint-underdetermination
  prompt: |
    Why does a radius alone not determine endpoint behavior?
  choices:
  - id: a
    text: |-
      $\sum x^n/n$ and $\sum x^n/n^2$ both have radius $1$ but differ at endpoints.
  - id: b
    text: Every radius is approximate.
  - id: c
    text: Endpoints are always excluded.
  - id: d
    text: Power series have no endpoints.
  answer:
    choiceId: a
  explanation: At x equals one the first is harmonic and diverges, while the second converges absolutely,
    despite identical radii.
