lesson:
  introduction: This deeper lesson expands Deadlocks from Chapter 6 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: deadlock-definition
    title: Deadlock definition
    required: true
    content: 'A deadlock is a set of actors permanently waiting because each needs a resource held by another actor in the set.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Deadlocks, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: deadlock-definition-deep-check
      title: 'Check: Deadlock definition'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Deadlock definition**?
      choices:
      - id: a
        text: Deadlock is not just slowness.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Deadlock is not just slowness. Related topic: Deadlocks.'
  - id: coffman
    title: Four necessary conditions
    required: true
    content: 'Mutual exclusion, hold-and-wait, no preemption, and circular wait must all hold for deadlock to be possible.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Deadlocks, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: coffman-deep-check
      title: 'Check: Four necessary conditions'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Four necessary conditions**?
      choices:
      - id: a
        text: Breaking any one condition prevents deadlock.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Breaking any one condition prevents deadlock. Related topic: Deadlocks.'
  - id: resource-graph
    title: Resource allocation graph
    required: true
    content: 'A resource graph shows who holds and requests resources; cycles are central evidence but require instance-count interpretation.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Deadlocks, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: resource-graph-deep-check
      title: 'Check: Resource allocation graph'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Resource allocation graph**?
      choices:
      - id: a
        text: A cycle is not always sufficient with multiple resource instances.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'A cycle is not always sufficient with multiple resource instances. Related topic: Deadlocks.'
    media:
    - type: image
      src: /assessments/operating-systems/deadlocks/resource-allocation-graph.svg
      alt: Resource allocation graph showing processes, resources, requested edges, held edges, and a cycle.
      caption: A resource allocation graph makes circular wait visible.
  - id: detection-recovery
    title: Detection and recovery
    required: true
    content: 'Detection permits deadlock and then chooses a recovery action such as aborting or preempting.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Deadlocks, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: detection-recovery-deep-check
      title: 'Check: Detection and recovery'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Detection and recovery**?
      choices:
      - id: a
        text: Detection is incomplete without recovery.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Detection is incomplete without recovery. Related topic: Deadlocks.'
  - id: prevention-avoidance
    title: Prevention and avoidance
    required: true
    content: 'Prevention denies a condition structurally; avoidance uses runtime state to stay safe.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Deadlocks, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: prevention-avoidance-deep-check
      title: 'Check: Prevention and avoidance'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Prevention and avoidance**?
      choices:
      - id: a
        text: Avoidance needs information about future resource needs.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Avoidance needs information about future resource needs. Related topic: Deadlocks.'
