- id: bp-we002
  title: Find a rise height from projectile speed
  problem: A 0.020 kg pellet embeds in a 0.980 kg block initially at rest. The pellet speed is 150 m/s. Find the maximum rise height of the combined block and pellet.
  steps:
  - id: bp2-s1
    title: Find postcollision speed
    instruction: Conserve horizontal momentum across the short collision.
    hint: 
    type: numericResponse
    prompt: What is $V=mv/(m+M)$ in m/s?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 3.0
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $V=(0.020)(150)/(1.000)=3.00$ m/s.\n\nWhy it works: The pellet and block share one velocity after embedding.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: bp2-s2
    title: Convert speed to height
    instruction: Use the conservative swing after the collision.
    hint: 
    type: numericResponse
    prompt: What is $h=V^2/(2g)$ in m?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 0.45918367
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $h=3.00^2/[2(9.8)]=0.459$ m.\n\nWhy it works: The joined mass cancels from $\tfrac12(m+M)V^2=(m+M)gh$.'
