- id: bp-we001
  title: Infer projectile speed from the rise height
  problem: A 0.010 kg projectile embeds in a 2.00 kg block. The joined pair rises 0.050 m. Find the projectile's speed just before impact, using $g=9.8$ m/s$^2$.
  steps:
  - id: bp1-s1
    title: Find speed after the inelastic collision
    instruction: During the upward swing mechanical energy is conserved.
    hint: 
    type: numericResponse
    prompt: What is the joined speed $V=\sqrt{2gh}$ in m/s?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 0.98994949
      tolerance: 0.001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $V=\sqrt{2(9.8)(0.050)}=0.990$ m/s.\n\nWhy it works: During the swing, kinetic energy changes into gravitational potential energy.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: bp1-s2
    title: Apply momentum during impact
    instruction: Use momentum, not mechanical energy, for the embedding collision.
    hint: 
    type: numericResponse
    prompt: What is the projectile speed $v=(m+M)V/m$ in m/s?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 198.9799
      tolerance: 0.01
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: $v=(2.01/0.010)(0.98995)=199$ m/s.\n\nWhy it works: The short collision conserves horizontal momentum: $mv=(m+M)V$.'
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals: []
  - id: bp1-s3
    title: Check the two stages
    instruction: Identify the correct conservation law for each stage.
    hint: 
    type: multipleChoice
    prompt: Which pairing is correct?
    choices:
    - id: a
      text: Momentum during impact; mechanical energy during the swing
      media: []
      issueSignals: []
    - id: b
      text: Mechanical energy during impact; momentum during the swing
      media: []
      issueSignals:
      - id: concept-misunderstood
        domains:
        - physics-1
    answer:
      choiceId: a
      choiceIds: []
      expected: 
      gradingMode: auto
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: 'Solution: Choose momentum for impact and mechanical energy for the swing.\n\nWhy it works: Embedding is inelastic, while the subsequent swing has gravity as a conservative force.\n\nWhy the other choices fail: Mechanical energy is not conserved in embedding, and momentum is not conserved throughout the swing.'
