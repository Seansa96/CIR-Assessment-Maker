workedExamples:
- id: we001
  title: Analyzing the Ballistic Pendulum
  problem: 'The ballistic pendulum was invented in 1742 to measure the speed of bullets. It consists of a large wooden block of mass $M$ suspended by cords. A bullet of mass $m$ is fired\rhorizontally into the block and embeds itself inside. The block-bullet system then swings upward, reaching a maximum height $h$.


    If a $0.010\ \text{kg}$ bullet is fired into a $2.0\ \text{kg}$ block, and the block swings to a height of $0.050\ \text{m}$, what was the initial speed of the bullet $v$? (Use $g = 9.8\ \text{m/s}^2$).

    '
  steps:
  - id: step-we001-1
    title: 'Part 1: The Collision (Conservation of Momentum)'
    instruction: 'During the collision, the bullet burrows into the wood, creating an enormous amount of friction and heat. Mechanical energy is definitely **not** conserved. However, the collision happens so quickly ($\Delta t \a\approx 0$) that external forces like gravity and tension can''t provide any meaningful impulse. Therefore, the\rhorizontal momentum of the system is conserved exactly during the impact.


      Let $V$ be the speed of the block+bullet system immediately *after* the collision.


      $$p_i = p_f$$

      $$mv = (m + M)V$$


      Solving for $V$:

      $$V = \frac{m}{m + M}v$$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step-we001-2
    title: 'Part 2: The Swing (Conservation of Energy)'
    instruction: 'Now the block+bullet system (mass $m+M$) is moving at speed $V$ at the bottom of the swing. It swings upward to a maximum height $h$.


      During the swing, momentum is **not** conserved because gravity provides a downward impulse, and the cords pull backwards. However, mechanical energy **is** conserved! Tension is perpendicular to the motion so it does zero work, and gravity is a conservative force.


      $$K_{\text{bottom}} = U_{\text{top}}$$

      $$\frac{1}{2}(m+M)V^2 = (m+M)gh$$


      The combined mass cancels out:

      $$\frac{1}{2}V^2 = gh$$

      $$V = \sqrt{2gh}$$

      '
    type: freeResponse
    prompt: Did you understand this step?
    choices: []
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step-we001-3
    title: Putting it all together to solve for v
    instruction: 'First, find the speed of the block+bullet right after the collision using the swing equation:

      $$V = \sqrt{2gh} = \sqrt{2(9.8)(0.050)} = \sqrt{0.98} \a\approx 0.9899\ \text{m/s}$$


      Now substitute this into the collision equation and solve for the bullet''s speed $v$:

      $$\frac{m}{m+M}v = V$$

      $$v = \frac{m+M}{m}V$$

      $$v = \frac{0.010 + 2.0}{0.010}(0.9899)$$

      $$v = (201)(0.9899) \a\approx 199\ \text{m/s}$$


      The ballistic pendulum cleanly separates the physics into an inelastic collision (momentum conserved, energy lost) followed by a conservative swing (energy conserved, momentum lost).

      '
    type: freeResponse
