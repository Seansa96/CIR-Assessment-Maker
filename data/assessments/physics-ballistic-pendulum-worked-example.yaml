workedExamples:
- id: bp-we001
  title: Infer projectile speed from the rise height
  problem: A 0.010 kg projectile embeds in a 2.00 kg block. The joined pair rises 0.050 m. Find the projectile's speed just before impact, using $g=9.8$ m/s$^2$.
  steps:
  - { id: bp1-s1, title: Find speed after the inelastic collision, instruction: 'During the upward swing mechanical energy is conserved.', type: numericResponse, prompt: 'What is the joined speed $V=\sqrt{2gh}$ in m/s?', choices: [], answer: { value: 0.98994949, tolerance: 0.001 }, explanation: 'Solution: $V=\sqrt{2(9.8)(0.050)}=0.990$ m/s.\n\nWhy it works: During the swing, kinetic energy changes into gravitational potential energy.' }
  - { id: bp1-s2, title: Apply momentum during impact, instruction: 'Use momentum, not mechanical energy, for the embedding collision.', type: numericResponse, prompt: 'What is the projectile speed $v=(m+M)V/m$ in m/s?', choices: [], answer: { value: 198.9799, tolerance: 0.01 }, explanation: 'Solution: $v=(2.01/0.010)(0.98995)=199$ m/s.\n\nWhy it works: The short collision conserves horizontal momentum: $mv=(m+M)V$.' }
  - { id: bp1-s3, title: Check the two stages, instruction: 'Identify the correct conservation law for each stage.', type: multipleChoice, prompt: 'Which pairing is correct?', choices: [{ id: a, text: 'Momentum during impact; mechanical energy during the swing', issueSignals: [] }, { id: b, text: 'Mechanical energy during impact; momentum during the swing', issueSignals: [{ id: wrong-conservation-stage, domains: [physics-1] }] }], answer: { choiceId: a, gradingMode: auto }, explanation: 'Solution: Choose momentum for impact and mechanical energy for the swing.\n\nWhy it works: Embedding is inelastic, while the subsequent swing has gravity as a conservative force.\n\nWhy the other choices fail: Mechanical energy is not conserved in embedding, and momentum is not conserved throughout the swing.' }
- id: bp-we002
  title: Find a rise height from projectile speed
  problem: A 0.020 kg pellet embeds in a 0.980 kg block initially at rest. The pellet speed is 150 m/s. Find the maximum rise height of the combined block and pellet.
  steps:
  - { id: bp2-s1, title: Find postcollision speed, instruction: 'Conserve horizontal momentum across the short collision.', type: numericResponse, prompt: 'What is $V=mv/(m+M)$ in m/s?', choices: [], answer: { value: 3.0, tolerance: 0.001 }, explanation: 'Solution: $V=(0.020)(150)/(1.000)=3.00$ m/s.\n\nWhy it works: The pellet and block share one velocity after embedding.' }
  - { id: bp2-s2, title: Convert speed to height, instruction: 'Use the conservative swing after the collision.', type: numericResponse, prompt: 'What is $h=V^2/(2g)$ in m?', choices: [], answer: { value: 0.45918367, tolerance: 0.001 }, explanation: 'Solution: $h=3.00^2/[2(9.8)]=0.459$ m.\n\nWhy it works: The joined mass cancels from $\tfrac12(m+M)V^2=(m+M)gh$.' }
