workedExamples:
- id: we-1
  title: 'Worked Example'
  problem: 'Determine the open $t$-intervals on which the curve $x = t^2 + 1$, $y = t^3 - 3t$ is concave up or concave down.'
  steps:
  - id: step-1
    title: 'Recall the formula for the second derivative of a parametric curve'
    type: freeResponse
    skills:
    - parametric-concavity
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Concavity is determined by the sign of the second derivative with respect to $x$, which is $\frac{d^2y}{dx^2}$.
      
      The formula for the second derivative is:
      $$ \frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}} $$
      
      We must first find the first derivative $y' = \frac{dy}{dx}$.
  - id: step-2
    title: 'Find the first derivative $\frac{dy}{dx}$'
    type: freeResponse
    skills:
    - parametric-concavity
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      First compute $\frac{dx}{dt}$ and $\frac{dy}{dt}$:
      $$ \frac{dx}{dt} = 2t $$
      $$ \frac{dy}{dt} = 3t^2 - 3 $$
      
      Now divide them to find the first derivative:
      $$ \frac{dy}{dx} = \frac{3t^2 - 3}{2t} = \frac{3}{2}t - \frac{3}{2}t^{-1} $$
  - id: step-3
    title: 'Take the derivative of $\frac{dy}{dx}$ with respect to $t$'
    type: freeResponse
    skills:
    - parametric-concavity
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Next, we need the numerator of the second derivative formula, which is $\frac{d}{dt}\left(\frac{dy}{dx}\right)$.
      
      Differentiate the expression we just found with respect to $t$:
      $$ \frac{d}{dt}\left( \frac{3}{2}t - \frac{3}{2}t^{-1} \right) = \frac{3}{2} - \left(-\frac{3}{2}t^{-2}\right) $$
      $$ = \frac{3}{2} + \frac{3}{2t^2} $$
      
      To make division easier in the next step, let's find a common denominator:
      $$ = \frac{3t^2 + 3}{2t^2} $$
  - id: step-4
    title: 'Divide by $\frac{dx}{dt}$ to find $\frac{d^2y}{dx^2}$'
    type: freeResponse
    skills:
    - parametric-concavity
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      Now, apply the second derivative formula by dividing the result from Step 3 by $\frac{dx}{dt} = 2t$:
      
      $$ \frac{d^2y}{dx^2} = \frac{\frac{3t^2 + 3}{2t^2}}{2t} $$
      $$ \frac{d^2y}{dx^2} = \frac{3t^2 + 3}{4t^3} $$
      
      This gives us our second derivative. We now need to determine where this expression is positive (concave up) and negative (concave down).
  - id: step-5
    title: 'Analyze the sign of the second derivative'
    type: freeResponse
    skills:
    - parametric-concavity
    prompt: 'Did you understand this step?'
    answer:
      gradingMode: selfCheck
    instruction: |
      We analyze the sign of $\frac{d^2y}{dx^2} = \frac{3(t^2 + 1)}{4t^3}$.
      
      Look at the numerator: $3(t^2 + 1)$. Because $t^2 \geq 0$ for all real $t$, $t^2 + 1$ is *always positive*. Therefore, the numerator is always positive.
      
      Look at the denominator: $4t^3$.
      - If $t > 0$, $4t^3$ is positive.
      - If $t < 0$, $4t^3$ is negative.
      
      Thus, the sign of the entire fraction is determined entirely by $t$:
      - For $t > 0$, $\frac{d^2y}{dx^2} > 0$ (Concave Up).
      - For $t < 0$, $\frac{d^2y}{dx^2} < 0$ (Concave Down).
      
      The curve is **concave up** on the interval $(0, \infty)$ and **concave down** on the interval $(-\infty, 0)$.
