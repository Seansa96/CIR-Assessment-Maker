workedExamples:
- id: we-pendulums
  title: Deriving and applying Pendulums
  problem: Use the labeled model to derive and calculate the period from $T=2\pi\sqrt{L/g}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Read the diagram to identify the length $L$ of the simple pendulum.
    prompt: 'Identify the length.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Length $L$'
    explanation: >-
      The string length $L$ is the crucial parameter for a simple pendulum.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the essential assumption that allows the pendulum to act as a simple harmonic oscillator.
    prompt: 'What approximation is used?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Small angle approximation.'
    explanation: >-
      The small-angle approximation ($\sin\theta \approx \theta$) is required.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable we wish to calculate.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Period $T$'
    explanation: >-
      We want to determine the period $T$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the restoring force relation for small angles.
    prompt: 'Write the restoring force.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'F = -mg\theta'
    explanation: >-
      The tangential force is $F = -mg\sin\theta \approx -mg\theta$.
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the period $T$ using the effective spring constant method.
    prompt: 'Isolate the period $T$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'T = 2\pi\sqrt{L/g}'
    explanation: >-
      With $k_{\text{eff}} = \frac{mg}{L}$, we substitute into $T = 2\pi\sqrt{m/k}$ to get $T = 2\pi\sqrt{L/g}$.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Suppose a pendulum has length $L = 1.0$ m and $g = 9.8$ m/s$^2$. Calculate $T$.
    prompt: 'Calculate the period.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      value: 2.0
      tolerance: 0.02
    explanation: >-
      $T = 2\pi\sqrt{1.0 / 9.8} \approx 2\pi(0.319) \approx 2.01$ s.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Verify that the mass of the bob does not appear in the final equation.
    prompt: 'Does mass affect $T$?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'No, mass cancels out.'
    explanation: >-
      Mass $m$ cancels out during the derivation, showing period is independent of mass.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated period.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      value: 2.0
      tolerance: 0.02
    explanation: >-
      The period is $2.01$ seconds.
