workedExamples:
- id: we-pendulums
  title: Deriving and applying Pendulums
  problem: Use the labeled model to derive and calculate the period from $T=2\pi\sqrt{L/g}$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Read the diagram to identify the length $L$ of the simple pendulum.
    prompt: 'Identify the length.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Identify string length $L$. Why it works: in the small-angle model, length controls the effective restoring stiffness and period.'
  - id: step2
    title: State the assumptions
    instruction: >-
      State the essential assumption that allows the pendulum to act as a simple harmonic oscillator.
    prompt: 'What approximation is used?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Use $\sin\theta\approx\theta$. Why it works: this makes the tangential restoring force proportional to displacement.'
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable we wish to calculate.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: The target is the period $T$. Why it works: period measures the time for one full oscillation.'
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the restoring force relation for small angles.
    prompt: 'Write the restoring force.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: $F_t=-mg\sin\theta\approx-mg\theta$. Why it works: gravity has a tangential component that points toward equilibrium.'
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the period $T$ using the effective spring constant method.
    prompt: 'Isolate the period $T$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Substitute $k_{eff}=mg/L$ into $T=2\pi\sqrt{m/k}$ to obtain $T=2\pi\sqrt{L/g}$. Why it works: mass cancels between inertia and gravitational restoring force.'
  - id: step6
    title: Substitute the known values
    instruction: >-
      Suppose a pendulum has length $L = 1.0$ m and $g = 9.8$ m/s$^2$. Calculate $T$.
    prompt: 'Calculate the period.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      value: 2.0
      tolerance: 0.02
    explanation: 'Solution: $T=2\pi\sqrt{1.0/9.8}=2.01\ \text{s}$. Why it works: the formula applies when the swing angle is small.'
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Verify that the mass of the bob does not appear in the final equation.
    prompt: 'Does mass affect $T$?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: No; mass cancels. Why it works: both the inertial and gravitational terms contain the same mass factor.'
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated period.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/pendulums.svg
      alt: Labeled original schematic for Pendulums used for quantitative analysis.
      caption: Pendulums model diagram.
    answer:
      value: 2.0
      tolerance: 0.02
    explanation: 'Solution: The period is $2.01\ \text{s}$. Why it works: this is the evaluated small-angle period for the stated length and gravity.'
- id: pendulum-length-we002
  title: Determine Pendulum Length From Period
  problem: A small-angle pendulum has a period of $3.00\ \text{s}$ on Earth, where $g=9.8\ \text{m/s}^2$. Find its length.
  steps:
  - id: pendulum-length-we002-step-1
    title: Rearrange the period relation
    instruction: Solve the small-angle period formula for the unknown length $L$.
    type: symbolicResponse
    prompt: Solve $T=2\pi\sqrt{L/g}$ for $L$.
    answer: {expectedLatex: 'L=\frac{gT^2}{4\pi^2}', equivalenceMode: expression, tolerance: 0}
    explanation: 'Solution: Square $T/(2\pi)=\sqrt{L/g}$ to get $L=gT^2/(4\pi^2)$. Why it works: squaring removes the square root and isolates length.'
  - id: pendulum-length-we002-step-2
    title: Calculate the length
    instruction: Substitute the period and gravitational acceleration into the rearranged formula.
    type: numericResponse
    prompt: Calculate $L$ in meters.
    answer: {value: 2.23, tolerance: 0.01}
    explanation: 'Solution: $L=9.8(3.00)^2/(4\pi^2)=2.23\ \text{m}$. Why it works: this length gives the stated period under the small-angle model.'
