workedExamples:
- id: aops-sets-example-1
  title: Sets multi-problem scenario 1
  problem: |-
    This scenario mirrors an AoPS-style Sets problem archetype without copying the source. Problem A asks you to recognize **set notation** from the given structure. Problem B changes the context so you must decide whether the same method still applies.
  steps:
  - id: aops-sets-ex1-step-1
    title: Classify the structure
    instruction: |-
      Before doing computations, decide which chapter concept is active. The relevant cues are set notation, union, and translate notation.
    type: multipleChoice
    prompt: Which first move best fits this kind of problem?
    choices:
    - id: a
      text: Identify the Sets structure and list the given constraints.
    - id: b
      text: Ignore constraints and try random values.
    - id: c
      text: Assume every expression can be simplified by cancellation.
    - id: d
      text: Use the final answer choices as the only source of reasoning.
    answer:
      choiceId: a
    hint: A contest problem is usually won by classification before calculation.
    explanation: |-
      The first move is to identify the Sets structure, because that determines which theorem, identity, or counting rule is legal.
  - id: aops-sets-ex1-step-2
    title: Choose the method
    instruction: |-
      Use the structure to pick a method. In this scenario, the useful method is: translate notation.
    type: freeResponse
    prompt: Explain why this method is appropriate before carrying it out.
    answer:
      expected: |-
        The method applies because the problem contains the cue for translate notation and the constraints match the chapter structure.
      gradingMode: selfCheck
      keyPoints:
      - Name the cue.
      - State the method.
      - Mention the constraint that makes the method valid.
    hint: Name the cue and the legal move.
    explanation: This is the point where the solution becomes intentional rather than computational.
  - id: aops-sets-ex1-step-3
    title: Carry out the transformation
    instruction: |-
      Perform the method while preserving the value, diagram relationship, or counted set. Track every condition that changes.
    type: multipleChoice
    prompt: Which habit most reliably prevents a wrong answer in this step?
    choices:
    - id: a
      text: Write each transformation with its condition or reason.
    - id: b
      text: Drop inconvenient cases.
    - id: c
      text: Round early.
    - id: d
      text: Assume a special case proves all cases.
    answer:
      choiceId: a
    hint: Every move should have a reason.
    explanation: |-
      AoPS-style problems often hide traps in restrictions, special cases, or overcounting. Writing the reason keeps the argument valid.
  - id: aops-sets-ex1-step-4
    title: Verify and generalize
    instruction: |-
      Check that the result answers the original question, then identify what changed in Problem B.
    type: freeResponse
    prompt: What should be checked before accepting the final result?
    answer:
      expected: |-
        Check the original constraints, verify no cases were lost or added, and confirm the answer format matches the question.
      gradingMode: selfCheck
      keyPoints:
      - Original constraints checked.
      - No extra or missing cases.
      - Answer format matches the prompt.
    hint: Return to the first line of the problem.
    explanation: |-
      The final check is where many Sets problems are won: a correct computation still fails if it answers a different question.
