workedExamples:
- id: we01
  title: Reduction through $v(y)$
  problem: Reduce $y''=-y$ using $v=y'$.
  steps:
  - id: we01-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Apply the chain rule.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - v substitution
      - chain rule
    explanation: |-
      Solution: $v\,dv/dy=-y$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Integrate the trajectory equation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - integration
      - first integral
    explanation: |-
      Solution: $v^2/2+y^2/2=C$, or $v^2+y^2=C_1$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Check against the system.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - time derivative
      - conservation
    explanation: |-
      Solution: Differentiating $v^2+y^2$ in time gives $2v(-y)+2yv=0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Orient a phase trajectory
  problem: For $y''=-y$, use initial data $y(0)=0$, $v(0)=2$.
  steps:
  - id: we02-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Select the energy curve.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - initial data
      - circle
    explanation: |-
      Solution: $v^2+y^2=4$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Find the initial tangent.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - vector field
      - orientation
    explanation: |-
      Solution: $(y',v')=(2,0)$ at $(0,2)$, so motion begins to the right.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Connect to the time solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - explicit check
      - trajectory direction
    explanation: |-
      Solution: $y=2\sin t$, $v=2\cos t$ traces the circle clockwise from its top point.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Restoring-force stability
  problem: Analyze $y''=-4y$ near $(0,0)$.
  steps:
  - id: we03-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Check the force sign.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - signs
      - restoring force
    explanation: |-
      Solution: For $y>0$, acceleration is negative; for $y<0$, it is positive, always restoring toward zero.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Find a first integral.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - energy
      - closed curves
    explanation: |-
      Solution: $v^2/2+2y^2=C$ gives closed ellipses.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Classify the equilibrium.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - bounded motion
      - classification
    explanation: |-
      Solution: Nearby states remain on nearby bounded ellipses, so the equilibrium is stable but not asymptotically stable.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
