  - id: component-subtraction
    title: Subtract matching components
    required: true
    content: For $(A_x,A_y)-(B_x,B_y)$, subtract x from x and y from y; do not subtract only the magnitudes.
    media: []
    check:
      id: rm-s04
      type: multipleChoice
      prompt: What is $(18,0)-(0,-24)$ in m/s?
      choices:
      - id: a
        text: $(18,24)$
        media: []
        issueSignals: []
      - id: b
        text: $(18,-24)$
        media: []
        issueSignals:
        - id: negative-component-subtraction-error
          domains:
          - physics-1
      - id: c
        text: $42$ east
        media: []
        issueSignals:
        - id: vector-treated-as-scalar
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $(18,0)-(0,-24)=(18,24)$ m/s.\n\nWhy it works: Subtracting a negative y component adds a positive y component.\n\nWhy the other choices fail: Choice b misses the double negative; choice c loses vector direction.'
      media: []
