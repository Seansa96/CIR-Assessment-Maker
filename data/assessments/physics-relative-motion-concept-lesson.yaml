  - id: medium-motion
    title: Add vehicle and medium velocities
    required: true
    content: Ground velocity is $\vec v_{boat/E}=\vec v_{boat/water}+\vec v_{water/E}$ because the frame changes are chained.
    media: []
    check:
      id: rm-s06
      type: multipleChoice
      prompt: A boat moves north at 4 m/s through water; current is 3 m/s east. What is ground velocity?
      choices:
      - id: a
        text: $(3,4)$ m/s
        media: []
        issueSignals: []
      - id: b
        text: $7$ m/s north
        media: []
        issueSignals:
        - id: components-treated-as-collinear
          domains:
          - physics-1
      - id: c
        text: $(-3,4)$ m/s
        media: []
        issueSignals:
        - id: current-sign-reversed
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Add $(0,4)+(3,0)$ to get $(3,4)$ m/s.\n\nWhy it works: Boat-through-water and water-through-Earth velocities add to boat-through-Earth velocity.\n\nWhy the other choices fail: Choice b ignores perpendicular components; choice c reverses the eastward current.'
