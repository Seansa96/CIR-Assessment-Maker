lesson:
  introduction: >
    Relative motion answers a precise question: how does one object move as

    measured by a particular observer? Use named frames and signed components

    before calculating speeds, directions, or course corrections.
  sections:
  - id: observer
    title: State the observer
    required: true
    content: In $\vec v_{A/B}$, A is the moving object and B is the observer.
    media: []
    check:
      id: rm-s01
      type: multipleChoice
      prompt: In $\vec v_{boat/water}$, which object is the observer?
      choices:
      - id: a
        text: Water
        media: []
        issueSignals: []
      - id: b
        text: Boat
        media: []
        issueSignals:
        - id: frame-order-reversed
          domains:
          - physics-1
      - id: c
        text: Earth
        media: []
        issueSignals:
        - id: unstated-frame-invented
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Water is the observer.\n\nWhy it works: The denominator in $\vec v_{A/B}$ names the observer B.\n\nWhy the other choices fail: Choice b reverses the notation; choice c names a frame not present in the expression.'
      media: []
      language: 
      functionName: 
