  - id: connecting-frame
    title: Use a connecting frame
    required: true
    content: 'Earth commonly connects two moving objects: $\vec v_{A/B}=\vec v_{A/E}-\vec v_{B/E}$.'
    media: []
    check:
      id: rm-s02
      type: multipleChoice
      prompt: Which expression gives car velocity relative to a truck?
      choices:
      - id: a
        text: $\vec v_{C/E}-\vec v_{T/E}$
        media: []
        issueSignals: []
      - id: b
        text: $\vec v_{T/E}-\vec v_{C/E}$
        media: []
        issueSignals:
        - id: observer-subtraction-reversed
          domains:
          - physics-1
      - id: c
        text: $\vec v_{C/E}+\vec v_{T/E}$
        media: []
        issueSignals:
        - id: observer-motion-added
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Use $\vec v_{C/T}=\vec v_{C/E}-\vec v_{T/E}$.\n\nWhy it works: Changing into the truck frame removes the truck motion.\n\nWhy the other choices fail: Choice b gives truck relative to car; choice c adds rather than removes observer motion.'
      media: []
      language: 
      functionName: 
      executionMode: unspecified
      starterCode: 
      tests: 
