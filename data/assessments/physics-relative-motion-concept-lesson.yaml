  - id: signed-axes
    title: Declare signed axes
    required: true
    content: Set east $=+x$ and north $=+y$, then retain the signs of west and south components.
    media: []
    check:
      id: rm-s03
      type: multipleChoice
      prompt: With north positive y, what is 6 m/s south?
      choices:
      - id: a
        text: $(0,-6)$ m/s
        media: []
        issueSignals: []
      - id: b
        text: $(0,6)$ m/s
        media: []
        issueSignals:
        - id: direction-sign-error
          domains:
          - physics-1
      - id: c
        text: $(-6,0)$ m/s
        media: []
        issueSignals:
        - id: axes-swapped
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The vector is $(0,-6)$ m/s.\n\nWhy it works: South is opposite the declared positive y direction.\n\nWhy the other choices fail: Choice b points north; choice c points west.'
      media: []
      language: 
      functionName: 
