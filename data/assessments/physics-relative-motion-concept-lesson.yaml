  - id: zero-drift
    title: Impose the zero-drift condition
    required: true
    content: To land directly across a river, set the unwanted cross-track ground component to zero before finding heading or crossing time.
    media: []
    check:
      id: rm-s07
      type: multipleChoice
      prompt: A current is 3 m/s east. Which westward boat component prevents drift?
      choices:
      - id: a
        text: $3$ m/s west
        media: []
        issueSignals: []
      - id: b
        text: $0$ m/s west
        media: []
        issueSignals:
        - id: zero-drift-condition-ignored
          domains:
          - physics-1
      - id: c
        text: Any component if the boat points north
        media: []
        issueSignals:
        - id: heading-without-components
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The boat needs a $-3$ m/s westward component.\n\nWhy it works: $v_{ground,x}=(-3)+3=0$, so there is no east-west drift.\n\nWhy the other choices fail: Choice b leaves current drift; choice c ignores the component equation.'
