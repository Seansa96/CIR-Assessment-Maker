  - id: resultant
    title: Find a resultant magnitude and direction
    required: true
    content: For perpendicular components, use $|\vec v|=\sqrt{v_x^2+v_y^2}$ and use component signs to choose a direction quadrant.
    media: []
    check:
      id: rm-s05
      type: multipleChoice
      prompt: What is the magnitude of $(18,24)$ m/s?
      choices:
      - id: a
        text: $30$ m/s
        media: []
        issueSignals: []
      - id: b
        text: $42$ m/s
        media: []
        issueSignals:
        - id: perpendicular-magnitudes-added
          domains:
          - physics-1
      - id: c
        text: $6$ m/s
        media: []
        issueSignals:
        - id: components-subtracted-for-magnitude
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $\sqrt{18^2+24^2}=30$ m/s.\n\nWhy it works: The components are perpendicular legs of a right triangle.\n\nWhy the other choices fail: Choice b adds perpendicular magnitudes; choice c takes their difference.'
