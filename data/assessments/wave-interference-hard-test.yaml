questions:
- id: q001
  type: numericResponse
  prompt: Two pulses on a string overlap. One has displacement +3.0 cm and the other -5.0 cm at the same point. What instantaneous net displacement in cm results?
  answer: { value: -2, tolerance: 0.05 }
  explanation: |
    Solution: Add algebraically: $+3.0+(-5.0)=-2.0$ cm.

    Why it works: The superposition principle says the displacement is the signed sum of the individual displacements.
  difficultyDimensions: [signConvention, representationTransfer, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q002
  type: numericResponse
  prompt: Two coherent waves have wavelength 0.80 m. What smallest nonzero path difference in m gives destructive interference?
  answer: { value: 0.4, tolerance: 0.02 }
  explanation: |
    Solution: Destructive interference occurs at $(m+\tfrac12)\lambda$; the smallest is $\lambda/2=0.40$ m.

    Why it works: A half-cycle phase difference puts a crest from one wave at a trough from the other.
  difficultyDimensions: [modelSelection, representationTransfer, unitAnalysis]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q003
  type: multipleChoice
  prompt: Two equal-amplitude sinusoidal waves arrive in phase at a point. What happens there?
  choices:
  - { id: a, text: Constructive interference produces twice the individual amplitude. }
  - { id: b, text: They always cancel completely. }
  - { id: c, text: Their frequency becomes zero. }
  - { id: d, text: The waves permanently stop after overlap. }
  answer: { choiceId: a }
  explanation: |
    Solution: Constructive interference produces twice the individual amplitude.

    Why it works: Equal signed displacements add when the waves have zero phase difference.

    Why the other choices fail: Cancellation needs opposite phase; interference does not remove frequency or permanently destroy traveling waves.
  difficultyDimensions: [modelComparison, errorDiagnosis, causalReasoning]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q004
  type: multipleChoice
  prompt: After two pulses overlap destructively on a string and then pass through one another, what best describes them?
  choices:
  - { id: a, text: Each continues with its original shape and direction in an ideal linear medium. }
  - { id: b, text: Both remain permanently canceled. }
  - { id: c, text: Each reverses direction because of superposition alone. }
  - { id: d, text: Their wave speed becomes zero. }
  answer: { choiceId: a }
  explanation: |
    Solution: Each continues with its original shape and direction in an ideal linear medium.

    Why it works: Superposition describes a temporary sum during overlap; it does not make ideal linear pulses permanently interact.

    Why the other choices fail: Cancellation, reversal, and stopping would require additional physics beyond ordinary linear superposition.
  difficultyDimensions: [temporalReasoning, errorDiagnosis, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]

