  prompt: Use the Interference of Waves diagram and the model $A_R=A_1+A_2$. A calibrated scenario scales
    the reference values by 1.1. Determine the resultant amplitude. Give a numerical answer.
  answer:
    value: 0.88
    tolerance: 0.0088
  explanation: Apply $A_R=A_1+A_2$ consistently to the scaled scenario; the requested resultant amplitude
    is 0.88.
