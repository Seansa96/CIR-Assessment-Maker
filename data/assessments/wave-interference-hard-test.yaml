- id: q001
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A tensioned cable vibrates with wavelength 10.22 m when driven at 71.9 Hz.
    What is the angular frequency omega in rad/s?
  answer:
    value: 451.761
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*71.9 = 451.7610 rad/s.
- id: q002
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A seismic surface wave has a characteristic wavelength of 6.28 m and vibrates
    at 36.7 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 230.5929
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*36.7 = 230.5929 rad/s.
- id: q003
  type: numericResponse
  skills:
  - physics-wave-interference
  prompt: A seismic surface wave has a characteristic wavelength of 3.29 m and vibrates
    at 46.7 Hz. What is the wave number k in rad/m?
  answer:
    value: 1.9098
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 3.29 = 1.9098 rad/m.
