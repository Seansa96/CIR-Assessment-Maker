  explanation: >
    Solution: $\frac{|1+1+1|}{\sqrt{1^2+1^2+1^2}}=\frac3{\sqrt3}=\sqrt3$.

    Why it works: Point-plane distance is the absolute normal projection divided by the normal's magnitude.

    Why the other choices fail: b omits normalization. c inverts the quotient. d uses an incorrect normal length.
