  explanation: >
    Solution: $\mathbf r=\langle1,0,-2\rangle+t\langle3,1,4\rangle$.

    Why it works: A vector line is its given point plus a parameter times its given direction.

    Why the other choices fail: b swaps the point and direction. c omits the parameter. d describes the parallel line through the origin.
