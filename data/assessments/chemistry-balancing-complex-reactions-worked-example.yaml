modeDefault: study
randomizeQuestions: false
workedExamples:
- id: we-bal-001
  title: Balancing the Combustion of Butane
  problem: |
    Balance the combustion reaction of Butane gas ($C_4H_{10}$) with Oxygen gas ($O_2$) to produce Carbon Dioxide ($CO_2$) and Water ($H_2O$).

    Unbalanced equation:
    $C_4H_{10} + O_2 \rightarrow CO_2 + H_2O$
  steps:
  - id: step-we-bal-001
    title: Balance the Carbon atoms first.
    instruction: |
      Start with the most complex molecule, $C_4H_{10}$.
      There are 4 Carbon atoms on the reactant side. 
      To balance the Carbon atoms on the product side, we must place a coefficient of 4 in front of $CO_2$.

      Current state: $C_4H_{10} + O_2 \rightarrow 4CO_2 + H_2O$
    type: freeResponse
    skills:
    - chemical-reactions-balancing
    - elemental-states
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
  - id: step-we-bal-002
    title: Balance the Hydrogen atoms next.
    instruction: |
      There are 10 Hydrogen atoms in $C_4H_{10}$.
      On the product side, each $H_2O$ molecule has 2 Hydrogen atoms. 
      To get 10 Hydrogen atoms, we need a coefficient of 5 in front of $H_2O$ ($5 \times 2 = 10$).

      Current state: $C_4H_{10} + O_2 \rightarrow 4CO_2 + 5H_2O$
    type: freeResponse
    skills:
    - chemical-reactions-balancing
    - elemental-states
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
  - id: step-we-bal-003
    title: Balance the Oxygen atoms using a fraction.
    instruction: |
      Now, count the total Oxygen atoms on the product side:
      - From $4CO_2$: $4 \times 2 = 8$ Oxygen atoms
      - From $5H_2O$: $5 \times 1 = 5$ Oxygen atoms
      Total = 13 Oxygen atoms.

      On the reactant side, Oxygen comes as a diatomic molecule ($O_2$). We need 13 Oxygen atoms, so we need $\frac{13}{2}$ molecules of $O_2$.

      Current state: $C_4H_{10} + \frac{13}{2}O_2 \rightarrow 4CO_2 + 5H_2O$
    type: freeResponse
    skills:
    - chemical-reactions-balancing
    - elemental-states
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
  - id: step-we-bal-004
    title: Multiply the entire equation to remove the fraction.
    instruction: |
      Chemical equations should use whole number coefficients. 
      Multiply every coefficient in the entire equation by 2 to clear the fraction.

      $2 \times (C_4H_{10} + \frac{13}{2}O_2 \rightarrow 4CO_2 + 5H_2O)$
      
      Final equation:
      $2C_4H_{10} + 13O_2 \rightarrow 8CO_2 + 10H_2O$
    type: multipleChoice
    skills:
    - chemical-reactions-balancing
    prompt: What is the final balanced coefficient for $O_2$ in the combustion of Butane?
    choices:
    - id: c1
      text: "6.5"
    - id: c2
      text: "13"
    - id: c3
      text: "10"
    - id: c4
      text: "4"
    answer:
      choiceId: c2
    explanation: 'After multiplying the fractional coefficient $\frac{13}{2}$ by 2 to achieve whole numbers, the coefficient for Oxygen gas becomes 13.'

