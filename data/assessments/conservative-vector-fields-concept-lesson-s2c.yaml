  - id: s02
    title: Endpoint values replace a path
    required: true
    content: The Fundamental Theorem for Line Integrals evaluates a conservative-field integral by endpoint potential change. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
