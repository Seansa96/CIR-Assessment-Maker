lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Directional Derivatives and Gradients if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Potentials generate fields
    required: true
    content: 'A conservative field is the gradient of a potential function. In Conservative Vector Fields and the Fundamental Theorem, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
    media:
    - type: image
      src: /media/calculus-3/conservative-fields.svg
      alt: Original conservative vector fields and the fundamental theorem reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What is a conservative vector field?
      choices:
      - id: a
        text: a gradient field
        media: []
        issueSignals: []
      - id: b
        text: only endpoints matter (answers 'What does path independent mean?', not 'What is a conservative vector field?')
        media: []
        issueSignals:
        - id: conservative-field-test-error
          domains: []
      - id: c
        text: zero (answers 'What does a closed-curve integral of a conservative field equal?', not 'What is a conservative vector field?')
        media: []
        issueSignals:
        - id: conservative-field-test-error
          domains: []
      - id: d
        text: a potential function (answers 'What function is used in the Fundamental Theorem?', not 'What is a conservative vector field?')
        media: []
        issueSignals:
        - id: conservative-field-test-error
          domains: []
