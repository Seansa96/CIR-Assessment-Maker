    title: Domain conditions matter
    required: true
    content: Matching partial derivatives is a reliable test only on an appropriate simply connected domain. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
