# REVIEW_NOTE: Merged from four thin topics (physics-simple-harmonic-motion,
# physics-shm-energy, physics-shm-circular-motion, physics-pendulums).
# Needs a proper conceptLesson, workedExample, quiz, and test to complete the curriculum stack.
glossary:
  introduction: >
    Core quantities, energy relationships, and model comparisons for ideal mass-spring systems
    and pendulums under the small-angle approximation.
  sections:
  - id: shm-core-terms
    title: Mass-Spring SHM
    entries:
    - id: restoring-force
      term: restoring force
      definition: 'A force directed toward equilibrium; in a spring $F=-kx$.'
      drills:
      - {id: restoring-force-drill, type: typed, prompt: 'What force relation defines an ideal spring restoring force?', answer: {expected: '-kx'}}
    - id: amplitude
      term: amplitude
      definition: Maximum displacement from equilibrium.
      drills:
      - {id: amplitude-drill, type: cloze, prompt: 'Maximum displacement is called {{amplitude}}.', answer: {expected: amplitude}}
    - id: angular-frequency
      term: angular frequency
      definition: 'Oscillation rate $\omega=\sqrt{k/m}$ for a mass-spring oscillator.'
      drills:
      - {id: angular-frequency-drill, type: typed, prompt: 'What is $\omega$ for a mass m on spring k?', answer: {expected: 'sqrt(k/m)'}}
    - id: phase-constant
      term: phase constant
      definition: 'The initial phase $\phi$ in $x=A\cos(\omega t+\phi)$.'
      drills:
      - {id: phase-constant-drill, type: cloze, prompt: 'The initial offset angle is the {{phase constant}}.', answer: {expected: phase constant}}
  - id: shm-energy-terms
    title: Energy in SHM
    entries:
    - id: elastic-pe
      term: elastic potential energy
      definition: 'Energy stored in a spring, $U=\frac{1}{2}kx^2$.'
      drills:
      - {id: elastic-pe-drill, type: cloze, prompt: 'Spring potential energy is $U={{\frac{1}{2}kx^2}}$.', answer: {expected: '\frac{1}{2}kx^2'}}
    - id: total-shm-energy
      term: total SHM energy
      definition: 'Constant mechanical energy in ideal SHM: $E=\frac{1}{2}kA^2$.'
      drills:
      - {id: total-shm-energy-drill, type: typed, prompt: 'What is the total energy of an ideal mass-spring oscillator in terms of amplitude A?', answer: {expected: '(1/2)kA^2'}}
    - id: energy-transfer
      term: kinetic-potential energy exchange
      definition: 'At equilibrium KE is maximum; at amplitude PE is maximum. Sum is constant.'
      drills:
      - {id: energy-transfer-drill, type: cloze, prompt: 'KE is maximum when displacement is {{zero}}.', answer: {expected: zero}}
  - id: shm-circle-terms
    title: SHM and Circular Motion
    entries:
    - id: reference-circle
      term: reference circle
      definition: 'A circle of radius A whose projected x-coordinate is $x=A\cos(\omega t+\phi)$, reproducing SHM.'
      drills:
      - {id: reference-circle-drill, type: typed, prompt: 'What geometric construction maps uniform circular motion onto SHM?', answer: {expected: reference circle}}
    - id: uniform-circular-motion
      term: uniform circular motion
      definition: 'Motion at constant speed along a circle; its shadow on any axis is SHM.'
      drills:
      - {id: ucm-drill, type: cloze, prompt: 'The projection of uniform circular motion onto a diameter is {{simple harmonic motion}}.', answer: {expected: simple harmonic motion}}
  - id: pendulum-terms
    title: Pendulums
    entries:
    - id: simple-pendulum
      term: simple pendulum
      definition: A point mass on a massless inextensible string swinging in a vertical plane.
      drills:
      - {id: simple-pendulum-drill, type: typed, prompt: 'What idealized system is a point mass on a light string?', answer: {expected: simple pendulum}}
    - id: small-angle
      term: small-angle approximation
      definition: 'The approximation $\sin\theta\approx\theta$ for small angular displacements in radians.'
      drills:
      - {id: small-angle-drill, type: cloze, prompt: 'For small angles, $\sin\theta\approx{{\theta}}$.', answer: {expected: '\theta'}}
    - id: pendulum-period
      term: pendulum period
      definition: 'The time for one complete oscillation; for a simple pendulum $T=2\pi\sqrt{L/g}$.'
      drills:
      - {id: period-drill, type: typed, prompt: 'What is the period formula for a simple pendulum?', answer: {expected: '2*pi*sqrt(L/g)'}}
    - id: physical-pendulum
      term: physical pendulum
      definition: A rigid body oscillating about a pivot, with period depending on moment of inertia and center-of-mass distance.
      drills:
      - {id: physical-pendulum-drill, type: cloze, prompt: 'A rigid object oscillating about a pivot is a {{physical pendulum}}.', answer: {expected: physical pendulum}}
