workedExamples:
  - id: classify-parabola
    title: One squared variable signals a parabola
    problem: |
      Identify and analyze

      $$
      3x^2-6x-2y=1.
      $$
    steps:
      - id: cp-pattern
        title: Classify before completing the square
        instruction: |
          The equation contains $x^2$ but no $y^2$. In a nondegenerate conic without an $xy$ term, exactly one squared variable signals a parabola.
        type: multipleChoice
        prompt: Which conic is represented?
        choices:
          - id: parabola
            text: Parabola
          - id: ellipse
            text: Ellipse
          - id: hyperbola
            text: Hyperbola
        answer:
          choiceId: parabola
        hint: Count squared variables before considering coefficients.
        explanation: |
          One squared variable and one linear variable is the algebraic signature of a parabola.

      - id: cp-standard
        title: Expose the standard form
        instruction: |
          Factor before completing the square:

          $$
          3(x^2-2x)-2y=1.
          $$

          Then

          $$
          3(x-1)^2=2(y+2).
          $$
        type: symbolicResponse
        prompt: Write the equation in $(x-h)^2=4p(y-k)$ form.
        answer:
          expectedLatex: '(x-1)^2=\frac23(y+2)'
          equivalenceMode: expression
          variables:
            - x
            - y
          tolerance: 0.000001
        hint: Divide both sides by $3$.
        explanation: |
          The standard form is $(x-1)^2=\frac23(y+2)$.

      - id: cp-verify
        title: Verify through geometry
        instruction: |
          The standard form gives vertex $(1,-2)$ and $p=\frac16$. A positive $p$ confirms upward opening.
        type: freeResponse
        prompt: State the focus and directrix.
        answer:
          expected: |
            Focus $\left(1,-\frac{11}{6}\right)$ and directrix $y=-\frac{13}{6}$.
          gradingMode: selfCheck
          keyPoints:
            - Uses $4p=\frac23$.
            - Offsets vertically from the vertex.
        hint: Add $p$ to the vertex y-coordinate for the focus.
        explanation: |
          The recovered focus-directrix geometry verifies that the completed equation behaves as a parabola.

  - id: classify-ellipse
    title: Same-sign squares signal an ellipse
    problem: |
      Identify and analyze

      $$
      x^2-2x+2y^2-8y+7=0.
      $$
    steps:
      - id: ce-pattern
        title: Read the quadratic signature
        instruction: |
          Both $x^2$ and $y^2$ have positive coefficients. Unequal same-sign coefficients suggest an ellipse, subject to obtaining a positive normalized right side.
        type: multipleChoice
        prompt: What is the best initial classification?
        choices:
          - id: ellipse
            text: Ellipse
          - id: circle
            text: Circle
          - id: hyperbola
            text: Hyperbola
        answer:
          choiceId: ellipse
        hint: A circle would require equal squared-term coefficients.
        explanation: |
          Same-sign unequal quadratic coefficients are the standard ellipse pattern.

      - id: ce-complete
        title: Complete both squares
        instruction: |
          Group and complete:

          $$
          (x^2-2x)+2(y^2-4y)=-7,
          $$

          $$
          (x-1)^2+2(y-2)^2=2.
          $$
        type: symbolicResponse
        prompt: Normalize the equation to standard form.
        answer:
          expectedLatex: '\frac{(x-1)^2}{2}+(y-2)^2=1'
          equivalenceMode: expression
          variables:
            - x
            - y
          tolerance: 0.000001
        hint: Divide every term by $2$.
        explanation: |
          Standard form confirms a real ellipse centered at $(1,2)$.

      - id: ce-verify
        title: Verify through focal geometry
        instruction: |
          Here $a^2=2$, $b^2=1$, and $c^2=1$. The major axis is horizontal.
        type: freeResponse
        prompt: State the vertices and foci.
        answer:
          expected: |
            Vertices $(1\pm\sqrt2,2)$; foci $(0,2)$ and $(2,2)$.
          gradingMode: selfCheck
          keyPoints:
            - Offsets all points from center $(1,2)$.
            - Uses horizontal major-axis direction.
        hint: Move $a$ and $c$ along the x-direction.
        explanation: |
          The real vertices and interior foci confirm the ellipse classification.

  - id: classify-hyperbola
    title: Opposite-sign squares signal a hyperbola
    problem: |
      Identify and analyze

      $$
      y^2-2=x^2-2x.
      $$
    steps:
      - id: ch-pattern
        title: Bring squared terms together
        instruction: |
          Rearrange:

          $$
          y^2-(x^2-2x)=2.
          $$

          The squared variables will have opposite signs, signaling a hyperbola.
        type: multipleChoice
        prompt: Which variable will define the transverse axis?
        choices:
          - id: y
            text: The $y$ variable, because its squared term is positive.
          - id: x
            text: The $x$ variable, because it is inside parentheses.
          - id: neither
            text: Neither; the curve is an ellipse.
        answer:
          choiceId: y
        hint: The positive standard-form term gives the opening axis.
        explanation: |
          A positive $y$ term produces a vertical hyperbola.

      - id: ch-standard
        title: Complete the square with sign awareness
        instruction: |
          Since

          $$
          x^2-2x=(x-1)^2-1,
          $$

          substitution gives

          $$
          y^2-(x-1)^2=1.
          $$
        type: symbolicResponse
        prompt: Enter the standard-form equation.
        answer:
          expectedLatex: 'y^2-(x-1)^2=1'
          equivalenceMode: expression
          variables:
            - x
            - y
          tolerance: 0.000001
        hint: The center shifts right by one unit.
        explanation: |
          The equation is a vertical hyperbola centered at $(1,0)$.

      - id: ch-verify
        title: Verify with vertices and asymptotes
        instruction: |
          Both denominators are $1$, so $a=b=1$ and $c=\sqrt2$.
        type: freeResponse
        prompt: State the vertices, foci, and asymptotes.
        answer:
          expected: |
            Vertices $(1,\pm1)$; foci $(1,\pm\sqrt2)$; asymptotes $y=\pm(x-1)$.
          gradingMode: selfCheck
          keyPoints:
            - Uses center $(1,0)$.
            - Places vertices and foci vertically.
            - Passes both asymptotes through the center.
        hint: Use slopes $\pm\frac ab=\pm1$.
        explanation: |
          Two branches opening vertically and approaching intersecting asymptotes confirm the hyperbola classification.
