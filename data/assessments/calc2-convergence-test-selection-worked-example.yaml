  - id: convergence-select-step-007
    title: Form the ratio
    instruction: |
      Let:

      $$
      a_n=\frac{n!}{4^n}.
      $$

      Then:

      $$
      \left|\frac{a_{n+1}}{a_n}\right|
      =
      \frac{(n+1)!}{4^{n+1}}\cdot\frac{4^n}{n!}.
      $$
    type: multipleChoice
    prompt: What does the ratio simplify to?
    choices:
    - id: a
      text: |-
        $\frac{n+1}{4}$
    - id: b
      text: |-
        $\frac{4}{n+1}$
    - id: c
      text: |-
        $\frac{1}{4}$
    - id: d
      text: $n+1$
    answer:
      choiceId: a
    explanation: |-
      Solution: Since $(n+1)!=(n+1)n!$ and $4^{n+1}=4\cdot4^n$, the remaining ratio is $\frac{n+1}{4}$. Therefore the answer is $\frac{n+1}{4}$.

      Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

      Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.

      Why the other choices fail: $\frac{4}{n+1}$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; $\frac{1}{4}$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; $n+1$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors.
