workedExamples:
- id: convergence-test-selection-main
  title: Choosing the Test Before Doing Algebra
  problem: |
    Decide which convergence test to use by reading the structure of the series first.

    We will compare several common series:

    $$
    \sum_{n=1}^{\infty}\frac{3n^2+1}{n^4+5},
    \qquad
    \sum_{n=1}^{\infty}\frac{n!}{4^n},
    \qquad
    \sum_{n=2}^{\infty}\frac{(-1)^n}{n\ln n}.
    $$

    The goal is not just to get an answer. The goal is to identify the signal that tells you which tool is efficient.

    ![Convergence test selection flowchart from term scan to divergence, comparison, ratio, alternating, and integral tests](/assessments/calc2-infinite-series/convergence-test-selection-flow.svg)
  steps:
  - id: convergence-select-step-001
    title: First scan the structure
    instruction: 'Before calculating, ask what kind of expression you see.


      Rational functions in $n$ often suggest comparison with a $p$-series. Factorials and exponentials often suggest the Ratio Test. Alternating signs suggest the Alternating Series Test, followed by absolute convergence checks when needed.

      '
    type: selectAll
    prompt: Which structural signals should influence test choice?
    choices:
    - id: a
      text: Dominant powers of $n$ in numerator and denominator.
    - id: b
      text: Factorials or exponentials.
    - id: c
      text: Alternating signs such as $(-1)^n$.
    - id: d
      text: The font used to write the problem.
    answer:
      choiceIds:
      - a
      - b
      - c
    explanation: |-
      Solution: Convergence tests are pattern-driven. You choose a likely tool from the structure, then verify the conditions. Therefore the answer is Dominant powers of $n$ in numerator and denominator., Factorials or exponentials., Alternating signs such as $(-1)^n$.. Therefore the answer is Dominant powers of $n$ in numerator and denominator., Factorials or exponentials., Alternating signs such as $(-1)^n$.. Therefore the answer is Dominant powers of $n$ in numerator and denominator., Factorials or exponentials., Alternating signs such as $(-1)^n$.. Therefore the answer is Dominant powers of $n$ in numerator and denominator., Factorials or exponentials., Alternating signs such as $(-1)^n$.. Therefore the answer is Dominant powers of $n$ in numerator and denominator., Factorials or exponentials., Alternating signs such as $(-1)^n$..

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.
  - id: convergence-select-step-002
    title: Identify the dominant behavior
    instruction: |
      For:

      $$
      \sum_{n=1}^{\infty}\frac{3n^2+1}{n^4+5},
      $$

      the dominant terms are $3n^2$ and $n^4$.
    type: multipleChoice
    prompt: What simple expression describes the long-term size of the terms?
    choices:
    - id: a
      text: |-
        $\frac{3}{n^2}$
    - id: b
      text: $3n^2$
    - id: c
      text: |-
        $\frac{1}{n}$
    - id: d
      text: $n^4$
    answer:
      choiceId: a
    explanation: |-
      Solution: Divide the dominant powers: $\frac{3n^2}{n^4}=\frac{3}{n^2}$. Therefore the answer is $\frac{3}{n^2}$.

      Why it works: For positive terms, choose a benchmark $b_n$ with the same leading behavior and compute $L=\lim a_n/b_n$. A finite positive limit means $a_n$ and $b_n$ converge or diverge together.

      Common trap: The comparison limit need not equal $1$; any finite positive constant transfers the convergence classification.

      Why the other choices fail: $3n^2$ conflicts with this criterion: For positive terms, choose a benchmark $b_n$ with the same leading behavior and compute $L=\lim a_n/b_n$; $\frac{1}{n}$ conflicts with this criterion: For positive terms, choose a benchmark $b_n$ with the same leading behavior and compute $L=\lim a_n/b_n$; $n^4$ conflicts with this criterion: For positive terms, choose a benchmark $b_n$ with the same leading behavior and compute $L=\lim a_n/b_n$.
