  - id: convergence-select-step-004
    title: Compute the limit comparison
    instruction: |
      Let:

      $$
      a_n=\frac{3n^2+1}{n^4+5},
      \qquad
      b_n=\frac{1}{n^2}.
      $$

      Then:

      $$
      \frac{a_n}{b_n}
      =
      \frac{n^2(3n^2+1)}{n^4+5}.
      $$
    type: multipleChoice
    prompt: |-
      What is $\lim_{n\to\infty}\frac{a_n}{b_n}$?
    choices:
    - id: a
      text: $3$
    - id: b
      text: $0$
    - id: c
      text: |-
        $\infty$
    - id: d
      text: $1$
    answer:
      choiceId: a
    explanation: |-
      Solution: The leading term in the numerator is $3n^4$, and the leading term in the denominator is $n^4$, so the limit is $3$. Therefore the answer is $3$.

      Why it works: For positive terms, choose a benchmark $b_n$ with the same leading behavior and compute $L=\lim a_n/b_n$. A finite positive limit means $a_n$ and $b_n$ converge or diverge together.

      Common trap: The comparison limit need not equal $1$; any finite positive constant transfers the convergence classification.

