schemaVersion: 1
id: physics-two-vehicle-problems-worked-example
title: Two-Vehicle Problems Worked Example
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
- physics-measurements-units
modeDefault: practice
randomizeQuestions: false
workedExamples:
- id: we001
  title: Solving two-vehicle catch-up and pursuit problems
  problem: 'Two-vehicle problems are equation-matching problems. Each vehicle gets
    its own position equation, then the event condition tells you when to set the
    positions equal.


    Problem 1: A car is $30\ \text{m}$ ahead of a truck and moves at $12\ \text{m/s}$.
    The truck moves in the same direction at $18\ \text{m/s}$. Find when and where
    the truck catches the car.


    Problem 2: A speeder passes a police car at $20\ \text{m/s}$. The police car starts
    from rest $5.0\ \text{s}$ later and accelerates at $4.0\ \text{m/s}^2$. Find\rhow
    long after the police car starts it catches the speeder.

    '
  steps:
  - id: step-we001-1
    title: Problem 1 frame choice
    instruction: 'Start by choosing a coordinate system that makes both position equations
      easy.

      '
    type: multipleChoice
    prompt: |
      For Problem 1, which variable setup is most useful?
    choices:
    - id: a
      text: Let $x=0$ be the truck starting position and let $t=0$ be the starting
        moment.
    - id: b
      text: Let $x=0$ be wherever the catch happens, because that is already known.
    - id: c
      text: Use separate time variables for each vehicle even though they move during
        the same interval.
    - id: d
      text: Ignore the $30\ \text{m}$ head start until the end.
    answer:
      choiceId: a
    hint: 'Put the origin at the vehicle behind so the head start becomes the other
      vehicle''s initial position.

      '
    explanation: |
      Set the origin at the truck and use one shared time variable because both vehicles move during the same time interval.

      Related topic: two-object position model setup. Order of application: choose origin, choose positive direction, then write each position equation.
  - id: step-we001-2
    title: Problem 1 car equation
    instruction: 'The car already has a head start, so its initial position is not
      zero.

      '
    type: multipleChoice
    prompt: |
      With the truck starting at $x=0$, which position equation describes the car?
    choices:
    - id: a
      text: $x_c=30+12t$
    - id: b
      text: $x_c=12t$
    - id: c
      text: $x_c=30-12t$
    - id: d
      text: $x_c=18t$
    answer:
      choiceId: a
    explanation: |
      The car begins $30\ \text{m}$ ahead and moves forward at $12\ \text{m/s}$, so

      $$
      x_c=30+12t.
      $$

      Related topic: constant-velocity position equations. The manipulated variables are initial position and velocity.
  - id: step-we001-3
    title: Problem 1 truck equation
    instruction: 'The truck starts at the origin and moves at constant speed.

      '
    type: multipleChoice
    prompt: |
      Which position equation describes the truck?
    choices:
    - id: a
      text: $x_t=18t$
    - id: b
      text: $x_t=30+18t$
    - id: c
      text: $x_t=12t$
    - id: d
      text: $x_t=30-18t$
    answer:
      choiceId: a
    explanation: |
      The truck starts at $x=0$ and moves forward at $18\ \text{m/s}$:

      $$
      x_t=18t.
      $$

      Related topic: constant velocity with zero initial position.
  - id: step-we001-4
    title: Problem 1 catch condition
    instruction: 'Catch-up means both vehicles are at the same position at the same
      time.

      '
    type: multipleChoice
    prompt: |
      Which equation should be solved to find the catch time?
    choices:
    - id: a
      text: $18t=30+12t$
    - id: b
      text: $18t+12t=30$
    - id: c
      text: $30=12t$
    - id: d
      text: $18=30+12$
    answer:
      choiceId: a
    explanation: |
      The event condition is equal position:

      $$
      x_t=x_c.
      $$

      Substitute the two position equations:

      $$
      18t=30+12t.
      $$

      Related topic: setting position equations equal. Technique order: write positions first, then apply the event condition.
  - id: step-we001-5
    title: Problem 1 solve fully
    instruction: 'Now solve the full problem yourself.

      '
    type: numericResponse
    prompt: |
      For Problem 1,\rhow far from the truck's starting position does the catch happen?

      Enter the distance in meters.
    answer:
      value: 90
      tolerance: 0.001
    hint: 'First solve $18t=30+12t$, then substitute into $x_t=18t$.

      '
    explanation: |
      Solve:

      $$
      18t=30+12t
      $$

      so

      $$
      6t=30,\qquad t=5\ \text{s}.
      $$

      Then use the truck equation:

      $$
      x_t=18(5)=90\ \text{m}.
      $$

      Related topic: catch-up position after solving time. Technique order: solve event time, then substitute into either position equation.
  - id: step-we001-6
    title: Problem 2 define the clock
    instruction: 'Delayed-start pursuit problems become cleaner if time starts when
      the accelerating vehicle starts.

      '
    type: multipleChoice
    prompt: |
      For Problem 2, why is it useful to let $t=0$ be the moment the police car starts?
    choices:
    - id: a
      text: The police car then has simple motion from rest, and the speeder head
        start becomes an initial position.
    - id: b
      text: It makes the speeder stop moving.
    - id: c
      text: It removes acceleration from the problem.
    - id: d
      text: It means both vehicles started from rest.
    answer:
      choiceId: a
    explanation: |
      Starting the clock when the police car begins moving makes the police equation simple:

      $$
      x_p=\frac{1}{2}at^2.
      $$

      The speeder's delay becomes a head-start distance.

      Related topic: delayed-start pursuit setup. Technique order: convert delay to distance, then write equations from the new clock.
  - id: step-we001-7
    title: Problem 2 head start
    instruction: 'The speeder moves during the $5.0\ \text{s}$ delay.

      '
    type: multipleChoice
    prompt: |
      What is the speeder's head start when the police car begins moving?
    choices:
    - id: a
      text: $100\ \text{m}$
    - id: b
      text: $20\ \text{m}$
    - id: c
      text: $5\ \text{m}$
    - id: d
      text: $80\ \text{m}$
    answer:
      choiceId: a
    explanation: |
      During the delay, the speeder moves

      $$
      d=vt=(20)(5.0)=100\ \text{m}.
      $$

      Related topic: converting time delay into initial separation.
  - id: step-we001-8
    title: Problem 2 position equations
    instruction: 'One vehicle moves at constant speed; the other accelerates from
      rest.

      '
    type: multipleChoice
    prompt: |
      With $t=0$ when the police car starts, which pair of position equations is correct?
    choices:
    - id: a
      text: $x_s=100+20t$, $x_p=2t^2$
    - id: b
      text: $x_s=20t$, $x_p=100+2t^2$
    - id: c
      text: $x_s=100+4t^2$, $x_p=20t$
    - id: d
      text: $x_s=5+20t$, $x_p=4t^2$
    answer:
      choiceId: a
    explanation: |
      The speeder starts this clock $100\ \text{m}$ ahead and continues at $20\ \text{m/s}$:

      $$
      x_s=100+20t.
      $$

      The police car starts from rest with $a=4.0\ \text{m/s}^2$:

      $$
      x_p=\frac{1}{2}(4.0)t^2=2t^2.
      $$

      Related topic: constant velocity versus constant acceleration position equations.
  - id: step-we001-9
    title: Problem 2 catch equation
    instruction: 'Catch-up still means equal position, but the equation is now quadratic.

      '
    type: multipleChoice
    prompt: |
      Which equation should be solved for the police catch time?
    choices:
    - id: a
      text: $2t^2=100+20t$
    - id: b
      text: $2t^2+100=20t$
    - id: c
      text: $20t=100$
    - id: d
      text: $4t=20$
    answer:
      choiceId: a
    explanation: |
      Set positions equal:

      $$
      x_p=x_s.
      $$

      That gives

      $$
      2t^2=100+20t.
      $$

      Related topic: quadratic catch-up equations. Technique order: equal-position condition, rearrange, choose the positive root.
  - id: step-we001-10
    title: Problem 2 solve fully
    instruction: 'Now solve the accelerating pursuit problem yourself.

      '
    type: numericResponse
    prompt: |
      For Problem 2,\rhow many seconds after the police car starts does it catch the speeder?

      Enter the positive time in seconds.
    answer:
      value: 13.66
      tolerance: 0.02
    hint: 'Rearrange $2t^2=100+20t$ to $t^2-10t-50=0$ and use the positive root.

      '
    explanation: |
      Start from

      $$
      2t^2=100+20t.
      $$

      Rearrange:

      $$
      t^2-10t-50=0.
      $$

      The positive root is

      $$
      t=\frac{10+\sqrt{300}}{2}\a\approx13.66\ \text{s}.
      $$

      Related topic: accelerating pursuit with delayed start. Technique order: convert delay, write both positions, set equal, solve the positive root.
