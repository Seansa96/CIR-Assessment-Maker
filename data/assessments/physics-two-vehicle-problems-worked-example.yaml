workedExamples:
  - id: we-constant-speed-catch
    title: Constant-speed catch-up
    problem: 'A car is $30$ m ahead of a truck. The car travels at $12$ m/s and the truck at $18$ m/s in the same direction. Find the catch time and location from the truck''s start.'
    steps:
      - id: cs-1
        title: Set positions equal
        instruction: 'Use the truck start as $x=0$.'
        type: symbolicResponse
        prompt: 'Write the equal-position equation.'
        answer: { gradingMode: auto, expectedLatex: '18t=30+12t', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $18t=30+12t$.\n\nWhy it works: A catch occurs when both vehicles share position at the same time.'
      - id: cs-2
        title: Solve time and position
        instruction: 'Solve for time, then use the truck equation.'
        type: numericResponse
        prompt: 'How far from the truck start does the catch occur, in meters?'
        answer: { value: 90, tolerance: 0.01 }
        explanation: 'Solution: $6t=30$ gives $t=5.0$ s, then $x=18(5.0)=90$ m.\n\nWhy it works: The faster truck gains $6$ m each second on the head start.'
  - id: we-delayed-pursuit
    title: Delayed accelerating pursuit
    problem: 'A speeder travels at $20$ m/s. A police car begins from rest $5.0$ s later and accelerates at $4.0$ m/s$^2$. Find the catch time measured from the police start.'
    steps:
      - id: dp-1
        title: Convert delay to head start
        instruction: 'Use the police start as the new time origin.'
        type: numericResponse
        prompt: 'What is the speeder''s head start in meters?'
        answer: { value: 100, tolerance: 0.01 }
        explanation: 'Solution: $d=vt=(20)(5.0)=100$ m.\n\nWhy it works: The speeder continues moving during the police delay.'
      - id: dp-2
        title: Solve catch equation
        instruction: 'Set $x_p=\tfrac12at^2=2t^2$ equal to $x_s=100+20t$ and use the positive root.'
        type: numericResponse
        prompt: 'What is the catch time in seconds after police start?'
        answer: { value: 13.6603, tolerance: 0.01 }
        explanation: 'Solution: $2t^2=100+20t$ gives $t^2-10t-50=0$ and $t=(10+\sqrt{300})/2=13.66$ s.\n\nWhy it works: Equal position defines the catch, and only the positive root is a future time.'
