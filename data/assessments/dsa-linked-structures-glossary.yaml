glossary:
  sections:
  - title: Core Concepts
    entries:
    - term: Node
      definition: A basic unit of a data structure that contains data and one or more pointers to other
        nodes.
    - term: Pointer
      definition: A variable that stores the memory address of another object.
    - term: Head
      definition: The first node in a linked list. The entire list is accessible by traversing from the
        head.
    - term: Singly Linked List
      definition: A linked list where each node contains only a single pointer to the next node.
