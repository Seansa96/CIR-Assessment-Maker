schemaVersion: 1
id: calc2-power-series-olympiad-test
title: Power Series and Representations Olympiad Test
assessmentType: test
categoryId: calculus-2
topicId: power-series
skills:
- Analyze shifted, endpoint, and singularity-controlled power series
- Extract coefficients using products, recurrences, and differential equations
- Justify radius and representation claims from coefficient growth
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - power-series
  - olympiad
  - generating-functions
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - find-radii-from-nearest-singularities
  prompt: |
    What is the radius of the Taylor series for $\log x$ centered at
    $x=1$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $2$
  - id: c
    text: |-
      $\infty$
  - id: d
    text: $1/2$
  answer:
    choiceId: a
  explanation: The nearest obstruction to analyticity is at $x=0$, one unit from the center.
- id: q002
  type: multipleChoice
  skills:
  - extract-rational-function-coefficients
  prompt: |
    For a positive integer $m$, what is the coefficient of $x^n$ in
    $(1-x)^{-m}$?
  choices:
  - id: a
    text: |-
      $\binom{n+m-1}{m-1}$
  - id: b
    text: |-
      $\binom{m}{n}$
  - id: c
    text: $m^n$
  - id: d
    text: |-
      $(-1)^n\binom{m}{n}$
  answer:
    choiceId: a
  explanation: The negative-binomial expansion counts weak compositions of n into m parts, producing the
    stated binomial coefficient.
- id: q003
  type: multipleChoice
  skills:
  - use-cauchy-products
  prompt: |
    For every integer $n\ge 1$, what is
    $\displaystyle\sum_{k=0}^{n}\frac{(-1)^k}{k!(n-k)!}$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: $1/n!$
  - id: d
    text: $(-1)^n/n!$
  answer:
    choiceId: a
  explanation: This is the coefficient of $x^n$ in $e^{-x}e^x=1$, whose positive-degree coefficients vanish.
- id: q004
  type: multipleChoice
  skills:
  - classify-power-series-endpoints
  prompt: |
    At $x=1$, how does
    $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{2n+1}$
    converge?
  choices:
  - id: a
    text: Conditionally
  - id: b
    text: Absolutely
  - id: c
    text: It diverges by the term test
  - id: d
    text: It terminates
  answer:
    choiceId: a
  explanation: The alternating odd-harmonic series converges, but its absolute-value series diverges by
    comparison with the harmonic series.
- id: q005
  type: multipleChoice
  skills:
  - differentiate-power-series-identities
  prompt: |
    Inside $|x|<1$, what is the derivative of
    $\displaystyle\sum_{n=1}^{\infty}\frac{x^n}{n}$?
  choices:
  - id: a
    text: $1/(1-x)$
  - id: b
    text: $1/(1+x)$
  - id: c
    text: |-
      $-\log(1-x)$
  - id: d
    text: $x/(1-x)^2$
  answer:
    choiceId: a
  explanation: |-
    Termwise differentiation gives $\sum_{n=1}^{\infty}x^{n-1}=\sum_{j=0}^{\infty}x^j$.
- id: q006
  type: multipleChoice
  skills:
  - solve-initial-value-problems-by-series
  prompt: |
    The solution of $y'=xy$ with $y(0)=1$ has a Maclaurin series. What
    is the coefficient of $x^6$?
  choices:
  - id: a
    text: $1/48$
  - id: b
    text: $1/6$
  - id: c
    text: $1/720$
  - id: d
    text: $1/24$
  answer:
    choiceId: a
  explanation: |-
    The solution is $e^{x^2/2}=\sum_{k\ge0}x^{2k}/(2^k k!)$; set $2k=6$.
- id: q007
  type: multipleChoice
  skills:
  - apply-cauchy-hadamard-formula
  prompt: |
    What is the radius of convergence of
    $\displaystyle\sum_{n=0}^{\infty} n!x^n$?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: $e^{-1}$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: For every nonzero x, the ratio of successive term magnitudes is $(n+1)|x|$, which eventually
    exceeds one without bound.
- id: q008
  type: multipleChoice
  skills:
  - recognize-entire-series
  prompt: |
    Which statement about $\displaystyle\sum_{n=0}^{\infty}x^n/n!$
    is correct?
  choices:
  - id: a
    text: It converges for every real and complex x.
  - id: b
    text: It converges only when $|x|<1$.
  - id: c
    text: It converges conditionally at $x=-1$.
  - id: d
    text: Its radius is zero.
  answer:
    choiceId: a
  explanation: The successive-term ratio has magnitude $|x|/(n+1)$, which tends to zero for every fixed
    x.
- id: q009
  type: multipleChoice
  skills:
  - derive-weighted-geometric-series
  prompt: |
    For $|x|<1$, which power series equals $1/(1-x)^2$?
  choices:
  - id: a
    text: |-
      $\sum_{n=0}^{\infty}(n+1)x^n$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}x^n/n$
  - id: c
    text: |-
      $\sum_{n=0}^{\infty}x^{2n}$
  - id: d
    text: |-
      $\sum_{n=0}^{\infty}n!x^n$
  answer:
    choiceId: a
  explanation: |-
    Differentiate $\sum_{n\ge0}x^n=1/(1-x)$ and shift the index so the exponent begins at zero.
- id: q010
  type: multipleChoice
  skills:
  - analyze-removable-singularities
  prompt: |
    After defining its removable value at $x=1$, what is the radius of
    the Maclaurin series of $(1-x)/(1-x^2)$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $0$
  - id: c
    text: $2$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: Cancellation gives $1/(1+x)$ away from the removable point, and its genuine pole at $x=-1$
    is one unit from zero.
- id: q011
  type: multipleChoice
  skills:
  - determine-shifted-series-intervals
  prompt: |
    What is the interval of convergence of
    $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n+1}(x-1)^n}{n}$?
  choices:
  - id: a
    text: $(0,2]$
  - id: b
    text: $[0,2)$
  - id: c
    text: $(0,2)$
  - id: d
    text: $[0,2]$
  answer:
    choiceId: a
  explanation: The radius is one; at x equals two the alternating harmonic series converges, while at
    x equals zero the harmonic series diverges.
- id: q012
  type: multipleChoice
  skills:
  - differentiate-geometric-series
  prompt: |
    For $|x|<1$, evaluate
    $\displaystyle\sum_{n=1}^{\infty}n x^{n-1}$.
  choices:
  - id: a
    text: $1/(1-x)^2$
  - id: b
    text: $x/(1-x)^2$
  - id: c
    text: $1/(1-x)$
  - id: d
    text: |-
      $-\log(1-x)$
  answer:
    choiceId: a
  explanation: |-
    It is the termwise derivative of the geometric identity $\sum_{n\ge0}x^n=1/(1-x)$.
- id: q013
  type: multipleChoice
  skills:
  - count-coefficients-in-products
  prompt: |
    What is the coefficient of $x^n$ in
    $\displaystyle\frac{1}{(1-x)(1-x^2)}$?
  choices:
  - id: a
    text: |-
      $\lfloor n/2\rfloor+1$
  - id: b
    text: $n+1$
  - id: c
    text: $2^n$
  - id: d
    text: $1$ if n is even and $0$ otherwise
  answer:
    choiceId: a
  explanation: A contribution occurs for every pair of nonnegative integers with a plus twice b equal
    to n, so b ranges from zero through floor n over two.
- id: q014
  type: multipleChoice
  skills:
  - translate-recurrences-to-generating-functions
  prompt: |
    Let $a_0=1$ and $a_n=3a_{n-1}+2$ for $n\ge1$. Which generating
    function equals $A(x)=\sum_{n=0}^{\infty}a_nx^n$?
  choices:
  - id: a
    text: $(1+x)/[(1-x)(1-3x)]$
  - id: b
    text: $1/(1-3x)$
  - id: c
    text: $(1-x)/(1-3x)$
  - id: d
    text: $x/[(1-x)(1-3x)]$
  answer:
    choiceId: a
  explanation: Summing the recurrence gives $A-1=3xA+2x/(1-x)$, then solving for A yields the stated rational
    function.
- id: q015
  type: multipleChoice
  skills:
  - compare-radii-under-differentiation
  prompt: |
    A nonconstant power series has finite positive radius $R$. What is
    the radius of the series obtained by differentiating it term by term?
  choices:
  - id: a
    text: $R$
  - id: b
    text: $R/2$
  - id: c
    text: $R^2$
  - id: d
    text: It cannot be determined
  answer:
    choiceId: a
  explanation: Multiplying coefficients by n does not change their limiting nth-root growth because $n^{1/n}$
    tends to one.
attemptQuestionCount: 15
