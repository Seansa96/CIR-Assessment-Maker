lesson:
  introduction: |-
    Beyond just lengths and midpoints, coordinate geometry allows us to prove whether lines are parallel or perpendicular using their slopes. We can also find points that divide segments into specific ratios (partitioning).
  sections:
  - id: sec-slopes
    title: Parallel and Perpendicular Lines
    required: true
    content: |-
      The **slope** ($m$) of a line measures its steepness: $m = \frac{y_2 - y_1}{x_2 - x_1}$.
      
      Using slope, we can definitively prove the geometric relationship between two lines:
      - **Parallel Lines**: Have exactly the **same slope** ($m_1 = m_2$). They never intersect.
      - **Perpendicular Lines**: Have **negative reciprocal slopes** ($m_1 \times m_2 = -1$). They intersect at a perfect $90^\circ$ right angle.
      
      For example, if line $A$ has a slope of $\frac{2}{3}$, a line parallel to it will also have a slope of $\frac{2}{3}$, but a line perpendicular to it will have a slope of $-\frac{3}{2}$.

  - id: sec-partitioning
    title: Partitioning a Directed Line Segment
    required: true
    content: |-
      The midpoint cuts a segment in a $1:1$ ratio. What if we want to cut a segment in a $1:3$ ratio?
      
      This is called **partitioning**. To find a point $P$ that partitions segment $AB$ in a ratio of $a:b$, we use the fraction $k = \frac{a}{a+b}$. (This is the fraction of the total distance $P$ is from $A$).
      
      The formula to find the coordinates of $P$ is:
      $$x_P = x_1 + k(x_2 - x_1)$$
      $$y_P = y_1 + k(y_2 - y_1)$$
      
      You simply take the total horizontal distance, multiply it by the fraction $k$, and add it to the starting $x$. Then do the same for $y$!

questions:
- id: q-geom-coord2-1
  title: Concept Check - Perpendicular Slopes
  prompt: |-
    A line passes through $(1, 2)$ and $(3, 8)$. What is the slope of a line that is *perpendicular* to this line?
  type: multipleChoice
  choices:
  - id: c1
    text: $3$
  - id: c2
    text: $-3$
  - id: c3
    text: $-\frac{1}{3}$
  - id: c4
    text: $\frac{1}{3}$
  answer:
    choiceId: c3
  explanation: |-
    First, find the slope of the original line: $m = \frac{8 - 2}{3 - 1} = \frac{6}{2} = 3$.
    The perpendicular slope is the negative reciprocal of $3$. Flip it (to $\frac{1}{3}$) and change the sign (to $-\frac{1}{3}$).
  skills:
  - geometry-coordinate-geometry

- id: q-geom-coord2-2
  title: Concept Check - Partitioning Fraction
  prompt: |-
    You want to find a point $P$ that partitions a segment in a ratio of $2:3$. What is the fraction $k$ you should multiply the total distances by?
  type: numericResponse
  answer:
    numericValue: 0.4
    tolerance: 0.01
  explanation: |-
    A ratio of $2:3$ means $2$ parts on one side and $3$ parts on the other, making $5$ total parts.
    The fraction $k$ is $\frac{a}{a+b} = \frac{2}{2+3} = \frac{2}{5} = 0.4$.
  skills:
  - geometry-coordinate-geometry
