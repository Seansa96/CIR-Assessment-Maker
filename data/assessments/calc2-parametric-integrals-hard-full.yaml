- id: q-513497
  type: multipleChoice
  title: Surface Area Setup (3)
  prompt: Which integral represents the surface area generated by revolving $x = e^t$,
    $y = e^{-t}$ around the x-axis for $0 \le t \le 3$?
  choices:
  - id: c1
    text: $\int_0^3 2\pi e^{-t} \sqrt{e^{2t} + e^{-2t}} dt$
  - id: c2
    text: $\int_0^3 2\pi e^{t} \sqrt{e^{2t} + e^{-2t}} dt$
  - id: c3
    text: $\int_0^3 2\pi e^{-t} (e^{2t} + e^{-2t}) dt$
  - id: c4
    text: $\int_0^3 \pi e^{-2t} \sqrt{e^{2t} + e^{-2t}} dt$
  answer:
    choiceId: c1
  explanation: Surface area $= \int 2\pi y \sqrt{(dx/dt)^2 + (dy/dt)^2} dt$. Here
    $y = e^{-t}$, and $(dx/dt)^2 + (dy/dt)^2 = e^{2t} + e^{-2t}$.
  skills:
  - parametric-integrals
