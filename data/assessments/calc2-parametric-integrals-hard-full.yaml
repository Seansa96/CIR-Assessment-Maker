- id: q-c5675f
  type: numericResponse
  title: Evaluate Arc Length (1)
  prompt: Find the arc length of the curve $x = 4\cos(t)$, $y = 4\sin(t)$ from $t=0$
    to $t=\pi$.
  answer:
    value: 12.5663706
    tolerance: 0.05
  explanation: The curve is a semicircle of radius 4. Arc length is $\pi r = 4\pi$.
  skills:
  - parametric-integrals
