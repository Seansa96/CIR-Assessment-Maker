  - id: method-selection
    title: Select the right series method
    required: true
    content: >
      Use the binomial series for powers of a linear expression. First factor a constant when necessary so the remaining expression has the form $(1+u)^\alpha$.
    media: []
    check:
      id: method-selection-check
      type: multipleChoice
      prompt: Which first step prepares $(4-x)^{-1/2}$ for a binomial-series expansion about $x=0$?
      choices:
      - id: a
        text: Write it as $\frac12(1-x/4)^{-1/2}$.
        media: []
        issueSignals: []
      - id: b
        text: Write it as $4^{-1/2}(1-x)^{-1/2}$.
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: c
        text: Replace it by $(1-4x)^{-1/2}$.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      - id: d
        text: Use $u=4-x$ without factoring.
        media: []
        issueSignals:
        - id: function-composition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Factor $4$ inside the power to obtain $4^{-1/2}(1-x/4)^{-1/2}=\frac12(1-x/4)^{-1/2}$.


        Why it works: The remaining factor now matches $(1+u)^\alpha$ with $u=-x/4$.


        Why the other choices fail: They factor or substitute incorrectly and do not preserve the original function.
