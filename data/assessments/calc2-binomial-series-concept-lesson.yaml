lesson:
  introduction: >
    The generalized binomial theorem turns a non-integer power into a power series.

    It is the bridge from a familiar binomial expression to a useful local approximation.
  sections:
  - id: generalized-formula
    title: The generalized binomial theorem
    required: true
    content: >
      For any real number $\alpha$,


      $$

      (1+x)^\alpha=\sum_{n=0}^{\infty}\binom{\alpha}{n}x^n

      =1+\alpha x+\frac{\alpha(\alpha-1)}{2!}x^2+\cdots.

      $$


      Here $\binom{\alpha}{n}=\alpha(\alpha-1)\cdots(\alpha-n+1)/n!$.

      When $\alpha$ is a nonnegative integer, the series terminates; otherwise it is generally infinite.
    media: []
    check:
      id: binomial-series-formula-check
      type: multipleChoice
      prompt: What is the coefficient of $x^2$ in $(1+x)^\alpha$?
      choices:
      - id: a
        text: $\alpha(\alpha-1)/2$
        media: []
        issueSignals: []
      - id: b
        text: $\alpha^2$
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: c
        text: $\alpha/2$
        media: []
        issueSignals:
        - id: exponent-rule-misapplied
          domains: []
      - id: d
        text: $2\alpha(\alpha-1)$
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: In the sum, the term indexed by $n$ contains $x^n$. Since the question asks for the coefficient of $x^2$, select the term with $n=2$. Then

        $$\binom{\alpha}{2}=\frac{\alpha(\alpha-1)}{2!}=\frac{\alpha(\alpha-1)}{2}.$$


        Why it works: The exponent of $x$ is the index $n$, so matching $x^n$ with $x^2$ forces $n=2$. The generalized coefficient then has two descending factors and a $2!$ denominator.


        Why the other choices fail: They omit either the descending factor or the factorial denominator.
