        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: At an endpoint the ratio-test limit can equal $1$, so another convergence test is needed.


        Why it works: The ratio test decides convergence only when its limit is strictly below or above $1$.


        Why the other choices fail: Endpoints are not automatic, and the radius does not replace endpoint analysis.
