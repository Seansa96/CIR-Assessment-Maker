  - id: coefficient-pattern
    title: Build coefficients with descending factors
    required: true
    content: >
      The coefficient of $x^n$ is $\binom{\alpha}{n}$. For example, the quadratic coefficient of $(1+x)^{-1/2}$ is $(-1/2)(-3/2)/2=3/8$.
    media: []
    check:
      id: coefficient-pattern-check
      type: multipleChoice
      prompt: What is the coefficient of $x^2$ in $(1+x)^{-1/2}$?
      choices:
      - id: a
        text: $3/8$
        media: []
        issueSignals: []
      - id: b
        text: $-3/8$
        media: []
        issueSignals:
        - id: sign-error
          domains: []
      - id: c
        text: $1/4$
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: d
        text: $-1/2$
        media: []
        issueSignals:
        - id: exponent-rule-misapplied
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: $\binom{-1/2}{2}=(-1/2)(-3/2)/2=3/8$.


        Why it works: The two descending factors are both negative, so their product is positive before division by $2!$.


        Why the other choices fail: They assign the wrong sign or omit a descending factor or factorial.
