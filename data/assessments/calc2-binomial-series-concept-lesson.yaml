  - id: transformed-input
    title: Transform the input before expanding
    required: true
    content: >
      To expand $(1-3x)^{1/2}$, use the generalized theorem with $u=-3x$, not with $u=x$. The convergence condition becomes $|-3x|<1$, or $|x|<1/3$.
    media: []
    check:
      id: transformed-input-check
      type: multipleChoice
      prompt: What substitution puts $(1-3x)^{1/2}$ into the form $(1+u)^{1/2}$?
      choices:
      - id: a
        text: $u=-3x$
        media: []
        issueSignals: []
      - id: b
        text: $u=3x$
        media: []
        issueSignals:
        - id: sign-error
          domains: []
      - id: c
        text: $u=-x/3$
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: d
        text: $u=1-3x$
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: Match $1+u$ with $1-3x$, so $u=-3x$.


        Why it works: The generalized theorem applies after the entire variable part is identified as the binomial input.


        Why the other choices fail: They reverse the sign, invert the scale, or include the leading $1$ in the input.
