  - id: endpoint-testing
    title: Test endpoints separately
    required: true
    content: >
      The radius test only supplies an open interval. At a boundary such as $x=1$, inspect the resulting numerical series. For $(1+x)^{-1/2}$, the coefficient magnitudes behave like $n^{-1/2}$, so the series diverges at $x=1$.
    media: []
    check:
      id: endpoint-testing-check
      type: multipleChoice
      prompt: Why must an endpoint be checked separately after finding $|x|<1$?
      choices:
      - id: a
        text: The ratio test is generally inconclusive when its limit is $1$.
        media: []
        issueSignals: []
      - id: b
        text: All endpoints automatically converge.
        media: []
        issueSignals:
        - id: series-test-selection-error
          domains: []
      - id: c
        text: The radius changes at an endpoint.
        media: []
        issueSignals:
        - id: expression-equation-recognition-error
          domains: []
      - id: d
        text: A power series has no endpoint behavior.
        media: []
        issueSignals:
        - id: series-test-selection-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
