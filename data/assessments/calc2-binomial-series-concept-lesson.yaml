  - id: convergence-and-use
    title: Convergence and approximation
    required: true
    content: >
      For a non-terminating binomial series centered at zero, the guaranteed open interval is


      $$|x|<1.$$


      Test $x=1$ and $x=-1$ separately when an endpoint matters. Within the interval, keeping the first few terms gives a polynomial approximation; the omitted terms control its accuracy.
    media: []
    check:
      id: binomial-series-radius-check
      type: multipleChoice
      prompt: For a non-integer exponent, where is the binomial series automatically convergent?
      choices:
      - id: a
        text: $|x|<1$
        media: []
        issueSignals: []
      - id: b
        text: $|x|\le1$
        media: []
        issueSignals:
        - id: series-test-selection-error
          domains: []
      - id: c
        text: All real $x$'
        media: []
        issueSignals:
        - id: ratio-test-evaluation-error
          domains: []
      - id: d
        text: $|x|>1$
        media: []
        issueSignals:
        - id: series-test-selection-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: The ratio of successive term magnitudes approaches $|x|$, so the ratio test guarantees convergence for $|x|<1$.


        Why it works: A ratio-test limit below one produces absolute convergence.


        Why the other choices fail: Endpoint behavior is separate, and values outside the radius are not automatically convergent.
