questions:
- id: q001
  type: numericResponse
  prompt: |
    What is the gauge pressure at a depth of $50 \text{ m}$ in the ocean?
    Assume the density of seawater is $\rho = 1025 \text{ kg/m}^3$ and $g = 9.8 \text{ m/s}^2$.
    Enter your answer in Pascals.
  answer:
    value: 502250
    tolerance: 1000
  explanation: |
    Solution:
    $P_{gauge} = \rho g h$
    $P_{gauge} = (1025)(9.8)(50) = 502250 \text{ Pa}$.
    
    Why it works:
    Gauge pressure is simply the pressure due to the fluid column itself, ignoring the atmospheric pressure acting on the surface.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: |
    Three containers of different shapes (one cylindrical, one widening at the top, one narrowing at the top) are filled with water to the exact same depth $h$. 
    Which container experiences the greatest hydrostatic pressure at the very bottom?
  choices:
  - id: a
    text: 'The cylindrical container.'
  - id: b
    text: 'The container that widens at the top.'
  - id: c
    text: 'The container that narrows at the top.'
  - id: d
    text: 'The pressure is identical at the bottom of all three containers.'
  answer:
    choiceId: d
  explanation: |
    Solution:
    The pressure is identical at the bottom of all three containers.
    
    Why it works:
    The hydrostatic pressure depends only on the density of the fluid, gravity, and the vertical depth ($P = \rho g h$). The shape of the container does not matter.
    
    Why the other choices fail:
    This common misconception (the "hydrostatic paradox") occurs because the container that widens at the top holds more total *weight* of water. However, the slanted walls support some of that weight, leaving the pressure strictly dependent on depth.
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
