lesson:
  introduction: 'We''ve seen that rational functions like $\frac{1}{1-x}$ can be written
    as power series. But what about transcendental functions like $e^x$, $\sin x$,
    or $\ln x$?

    **Taylor Series** allow us to represent *any* infinitely differentiable function
    as a power series!

    '
  sections:
  - id: taylor-formula
    title: The Taylor Series Formula
    required: true
    content: 'If a function $f(x)$ has a power series representation centered at $x=a$,
      its coefficients must perfectly match all the derivatives of the function at
      that point.


      The $n$-th coefficient is:

      $$ c_n = \frac{f^{(n)}(a)}{n!} $$


      So the full **Taylor Series** is:

      $$ f(x) = \sum_{n=0}^\infty \frac{f^{(n)}(a)}{n!} (x-a)^n = f(a) + f''(a)(x-a)
      + \frac{f''''(a)}{2!}(x-a)^2 + \frac{f''''''(a)}{3!}(x-a)^3 + \dots $$

      '
    check:
      id: taylor-formula-check
      type: multipleChoice
      prompt: Why is there a factorial ($n!$) in the denominator of each Taylor coefficient?
      choices:
      - id: a
        text: Because taking the $n$-th derivative of $x^n$ produces $n(n-1)(n-2)\dots
          = n!$, which must be cancelled out to match $f^{(n)}(a)$.
      - id: b
        text: It guarantees that the Ratio Test will succeed.
      - id: c
        text: It was discovered empirically by Brook Taylor.
      - id: d
        text: It prevents the series from alternating.
      answer:
        choiceId: a
      explanation: 'Exactly. If $f(x) = c_3 x^3$, the 3rd derivative is $f''''''(x)
        = c_3(3)(2)(1) = c_3 \cdot 3!$. To isolate $c_3$, we must divide by $3!$.

        '
  - id: maclaurin-series
    title: Maclaurin Series
    required: true
    content: 'A **Maclaurin Series** is simply a Taylor Series centered at $a = 0$.


      $$ f(x) = \sum_{n=0}^\infty \frac{f^{(n)}(0)}{n!} x^n $$


      Because $a=0$, these are the easiest to compute and are used constantly in physics
      and engineering to a\approximate complex functions near zero.

      '
    check:
      id: maclaurin-series-check
      type: numericResponse
      prompt: If $f(x) = e^x$, what is the value of $f^{(n)}(0)$ for any $n$?
      answer:
        value: 1
        tolerance: 0.1
      explanation: 'The derivative of $e^x$ is always $e^x$. Evaluating $e^0$ always
        gives 1. Thus, every coefficient in the Maclaurin series for $e^x$ is simply
        $1/n!$.

        '
  - id: key-maclaurin
    title: Essential Maclaurin Series to Memorize
    required: true
    content: 'You do not want to derive these from scratch every time. Memorize them!


      1. **Exponential:** $e^x = \sum_{n=0}^\infty \frac{x^n}{n!} = 1 + x + \frac{x^2}{2!}
      + \frac{x^3}{3!} + \dots$ (For all real $x$)


      2. **Sine:** $\sin x = \sum_{n=0}^\infty \frac{(-1)^n x^{2n+1}}{(2n+1)!} = x
      - \frac{x^3}{3!} + \frac{x^5}{5!} - \dots$ (For all real $x$)


      3. **Cosine:** $\cos x = \sum_{n=0}^\infty \frac{(-1)^n x^{2n}}{(2n)!} = 1 -
      \frac{x^2}{2!} + \frac{x^4}{4!} - \dots$ (For all real $x$)


      *Notice\rhow Sine only has odd powers (it''s an odd function), and Cosine only
      has even powers (it''s an even function)!*

      '
    check:
      id: key-maclaurin-check
      type: multipleChoice
      prompt: What is the Maclaurin series for $x \cos(x)$?
      choices:
      - id: a
        text: $\sum_{n=0}^\infty \frac{(-1)^n x^{2n+1}}{(2n)!}$
      - id: b
        text: $\sum_{n=0}^\infty \frac{(-1)^n x^{2n}}{(2n)!}$
      - id: c
        text: $\sum_{n=0}^\infty \frac{(-1)^n x^{2n+2}}{(2n)!}$
      - id: d
        text: It cannot be determined easily.
      answer:
        choiceId: a
      explanation: 'Just take the known series for $\cos x$ and multiply every term
        by $x$. The power $x^{2n}$ becomes $x^{2n+1}$.

        '
