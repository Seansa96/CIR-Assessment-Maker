lesson:
  introduction: |
    Taylor series let us replace a function with a polynomial-like expression that matches the function near a chosen center.

    The point is not just to memorize a formula. The point is to understand why polynomials can imitate functions and how to build useful approximations from derivative information.
  sections:
    - id: polynomial-imitation
      title: Why Taylor Polynomials Work
      required: true
      content: |
        A tangent line matches a function's value and slope at one point:

        $$
        L(x)=f(a)+f'(a)(x-a).
        $$

        A Taylor polynomial pushes that idea further. It matches more derivative information at the center:

        $$
        f(a),\quad f'(a),\quad f''(a),\quad f'''(a),\quad \dots
        $$

        More matched derivatives usually means a better local imitation near $x=a$.

        ![Sine curve with first, third, and fifth degree Taylor polynomial approximations near zero](/assessments/calc2-infinite-series/taylor-polynomial-imitation-sinx.svg)
      check:
        id: polynomial-imitation-check
        type: multipleChoice
        prompt: What does a Taylor polynomial try to match at the center $a$?
        choices:
          - id: a
            text: The function value and derivative behavior at $a$.
          - id: b
            text: Only the graph's $x$-intercepts.
          - id: c
            text: Only the end behavior as $x\to\infty$.
          - id: d
            text: The area under the function on every interval.
        answer:
          choiceId: a
        explanation: |
          Taylor polynomials are local approximations. They are designed to match derivative information at the center.

    - id: taylor-formula
      title: The Taylor Series Formula
      required: true
      content: |
        If a function has a Taylor series centered at $a$, then:

        $$
        f(x)=\sum_{n=0}^{\infty}\frac{f^{(n)}(a)}{n!}(x-a)^n.
        $$

        Written out:

        $$
        f(x)=
        f(a)
        +f'(a)(x-a)
        +\frac{f''(a)}{2!}(x-a)^2
        +\frac{f'''(a)}{3!}(x-a)^3
        +\cdots
        $$

        The factorial appears because differentiating $(x-a)^n$ exactly $n$ times produces $n!$.
      check:
        id: taylor-formula-check
        type: multipleChoice
        prompt: Why does the Taylor coefficient use $\frac{f^{(n)}(a)}{n!}$?
        choices:
          - id: a
            text: Differentiating $(x-a)^n$ exactly $n$ times produces $n!$.
          - id: b
            text: It makes every Taylor series alternate.
          - id: c
            text: It prevents the radius of convergence from being finite.
          - id: d
            text: It turns every function into a geometric series.
        answer:
          choiceId: a
        explanation: |
          The factorial cancels the factor produced when the $n$th derivative reaches the coefficient of $(x-a)^n$.

    - id: maclaurin-series
      title: Maclaurin Means Centered at Zero
      required: true
      content: |
        A Maclaurin series is a Taylor series centered at $a=0$:

        $$
        f(x)=\sum_{n=0}^{\infty}\frac{f^{(n)}(0)}{n!}x^n.
        $$

        Maclaurin series are common because many standard functions have simple derivative patterns at $0$.

        For example, every derivative of $e^x$ is $e^x$, so every derivative at $0$ is $1$. Therefore:

        $$
        e^x=\sum_{n=0}^{\infty}\frac{x^n}{n!}.
        $$
      check:
        id: maclaurin-series-check
        type: numericResponse
        prompt: If $f(x)=e^x$, what is $f^{(n)}(0)$ for any nonnegative integer $n$?
        answer:
          value: 1
          tolerance: 0.000001
        explanation: |
          Every derivative of $e^x$ is still $e^x$, and $e^0=1$.

    - id: essential-series
      title: Essential Series to Recognize
      required: true
      content: |
        These series are worth memorizing because they become building blocks:

        $$
        e^x=\sum_{n=0}^{\infty}\frac{x^n}{n!}
        $$

        $$
        \sin x=\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{(2n+1)!}
        $$

        $$
        \cos x=\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n}}{(2n)!}
        $$

        $$
        \frac{1}{1-x}=\sum_{n=0}^{\infty}x^n,\qquad |x|<1.
        $$

        Sine has odd powers because it is odd. Cosine has even powers because it is even.
      check:
        id: essential-series-check
        type: multipleChoice
        prompt: Which feature identifies the Maclaurin series for $\cos x$?
        choices:
          - id: a
            text: It has only even powers and alternating signs.
          - id: b
            text: It has only odd powers and no alternating signs.
          - id: c
            text: It is a finite polynomial.
          - id: d
            text: It starts with $x$.
        answer:
          choiceId: a
        explanation: |
          Cosine is even, so its Maclaurin series has even powers. The signs alternate.

    - id: building-from-known-series
      title: Build New Series from Known Series
      required: true
      content: |
        Many Taylor-series problems are not asking you to compute derivatives from scratch. They ask you to recognize a known series and transform it.

        Examples:

        - replace $x$ with $3x$,
        - replace $x$ with $x^2$,
        - multiply the whole series by $x$,
        - differentiate a known series,
        - integrate a known series.

        For example:

        $$
        \cos x=\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n}}{(2n)!}
        $$

        gives

        $$
        x\cos x=\sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{(2n)!}.
        $$

        ![Flow map showing how known Taylor series become new series through substitution, differentiation, and integration](/assessments/calc2-infinite-series/taylor-known-series-transformation-map.svg)
      check:
        id: building-from-known-series-check
        type: multipleChoice
        prompt: What is the cleanest way to find a Maclaurin series for $e^{2x}$?
        choices:
          - id: a
            text: Start with the known series for $e^x$ and substitute $2x$ for $x$.
          - id: b
            text: Use partial fractions.
          - id: c
            text: Use the integral test.
          - id: d
            text: Convert to polar coordinates.
        answer:
          choiceId: a
        explanation: |
          Since $e^x=\sum x^n/n!$, substituting $2x$ gives $e^{2x}=\sum (2x)^n/n!$.

    - id: taylor-polynomial-vs-series
      title: Polynomial vs Infinite Series
      required: true
      content: |
        A Taylor polynomial stops after finitely many terms:

        $$
        T_N(x)=\sum_{n=0}^{N}\frac{f^{(n)}(a)}{n!}(x-a)^n.
        $$

        A Taylor series keeps going forever:

        $$
        \sum_{n=0}^{\infty}\frac{f^{(n)}(a)}{n!}(x-a)^n.
        $$

        Taylor polynomials are used for approximation. Taylor series are used when you want an infinite representation and its interval of convergence.
      check:
        id: taylor-polynomial-vs-series-check
        type: multipleChoice
        prompt: What is the main difference between a Taylor polynomial and a Taylor series?
        choices:
          - id: a
            text: A Taylor polynomial has finitely many terms; a Taylor series has infinitely many terms.
          - id: b
            text: A Taylor polynomial always diverges.
          - id: c
            text: A Taylor series cannot be centered away from zero.
          - id: d
            text: A Taylor polynomial never uses derivatives.
        answer:
          choiceId: a
        explanation: |
          The polynomial is the finite approximation. The series is the infinite expansion.

    - id: error-intuition
      title: Error Is the Part You Left Out
      required: true
      content: |
        When you approximate a function with a Taylor polynomial, the error is the remainder:

        $$
        R_N(x)=f(x)-T_N(x).
        $$

        In practice, common error tools include:

        - alternating-series error when the Taylor series alternates with decreasing terms,
        - Lagrange remainder when you can bound a later derivative,
        - calculator or numerical comparison when exact symbolic bounds are not required.

        The big idea is simple:

        $$
        \text{Approximation quality depends on center, distance from center, and number of terms.}
        $$

        ![Taylor approximation error visual showing how the approximation departs away from the center](/assessments/calc2-infinite-series/taylor-approximation-error.svg)
      check:
        id: error-intuition-check
        type: selectAll
        prompt: Which factors usually affect Taylor polynomial accuracy?
        choices:
          - id: a
            text: How far $x$ is from the center.
          - id: b
            text: How many terms are included.
          - id: c
            text: Whether the needed derivatives stay controlled.
          - id: d
            text: The color of the graph.
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: |
          Taylor approximations are local. They usually improve with more terms and with inputs closer to the center, provided the function behaves well there.
