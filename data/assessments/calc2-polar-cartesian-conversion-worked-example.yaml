workedExamples:
  - id: polar-circle-to-cartesian
    title: Convert a polar circle to a Cartesian equation
    problem: |
      Convert the polar equation

      $$
      r=4\sin\theta
      $$

      to a Cartesian equation, identify the curve, and connect the equation to its graph.

      ![Circle corresponding to r equals four sine theta, centered at zero comma two with radius two](/assessments/calc2-parametric-polar/polar-cartesian-circle-r4sin.svg)
    steps:
      - id: polar-cartesian-circle-step-1
        title: Start from the conversion dictionary
        instruction: |
          The most useful polar-to-Cartesian identities are:

          $$
          x=r\cos\theta,
          \qquad
          y=r\sin\theta,
          \qquad
          r^2=x^2+y^2.
          $$

          The equation $r=4\sin\theta$ contains $\sin\theta$, but the clean Cartesian identity uses $r\sin\theta=y$. That means we should create an $r\sin\theta$ factor.
        type: multipleChoice
        prompt: Which move best prepares $r=4\sin\theta$ for Cartesian conversion?
        choices:
          - id: multiply-r
            text: Multiply both sides by $r$.
          - id: divide-r
            text: Divide both sides by $r$ immediately.
          - id: square-sine
            text: Replace $\sin\theta$ with $\sin^2\theta$.
          - id: set-theta
            text: Set $\theta=0$.
        answer:
          choiceId: multiply-r
        hint: Try to create both $r^2$ and $r\sin\theta$.
        explanation: |
          Multiplying by $r$ gives

          $$
          r^2=4r\sin\theta.
          $$

          Now each side has a direct Cartesian replacement.

          Related topic: using $r^2=x^2+y^2$ and $r\sin\theta=y$.

      - id: polar-cartesian-circle-step-2
        title: Substitute the Cartesian identities
        instruction: |
          From

          $$
          r^2=4r\sin\theta,
          $$

          substitute

          $$
          r^2=x^2+y^2
          $$

          and

          $$
          r\sin\theta=y.
          $$
        type: symbolicResponse
        prompt: Write the Cartesian equation before completing the square.
        answer:
          expectedLatex: 'x^2+y^2=4y'
          equivalenceMode: expression
          variables:
            - x
            - y
          tolerance: 0.000001
        hint: Replace $r^2$ with $x^2+y^2$ and $r\sin\theta$ with $y$.
        explanation: |
          The direct substitution gives

          $$
          x^2+y^2=4y.
          $$

          This is already Cartesian, but completing the square will reveal the graph.

      - id: polar-cartesian-circle-step-3
        title: Complete the square
        instruction: |
          Move the $y$ terms together:

          $$
          x^2+y^2-4y=0.
          $$

          Complete the square on $y^2-4y$:

          $$
          y^2-4y=(y-2)^2-4.
          $$
        type: multipleChoice
        prompt: Which standard-form equation is equivalent?
        choices:
          - id: correct
            text: '$x^2+(y-2)^2=4$'
          - id: x-shift
            text: '$(x-2)^2+y^2=4$'
          - id: radius-four
            text: '$x^2+(y-4)^2=16$'
          - id: line
            text: '$y=4x$'
        answer:
          choiceId: correct
        explanation: |
          Add $4$ to both sides after completing the square:

          $$
          x^2+(y-2)^2=4.
          $$

          This is a circle centered at $(0,2)$ with radius $2$.

      - id: polar-cartesian-circle-step-4
        title: Interpret the graph
        instruction: |
          The equation

          $$
          x^2+(y-2)^2=4
          $$

          is a circle. Its center is $(0,2)$ and its radius is $2$. Notice that the circle passes through the pole $(0,0)$ because the distance from $(0,2)$ to $(0,0)$ is $2$.
        type: selectAll
        prompt: Which statements correctly describe the converted curve?
        choices:
          - id: center
            text: The center is $(0,2)$.
          - id: radius
            text: The radius is $2$.
          - id: pole
            text: The curve passes through the pole.
          - id: parabola
            text: The curve is a right-opening parabola.
        answer:
          choiceIds:
            - center
            - radius
            - pole
        explanation: |
          The graph is a circle, not a parabola. Its center-radius form is visible after completing the square.

      - id: polar-cartesian-circle-step-5
        title: Summarize the conversion
        instruction: |
          A strong conversion explanation names the identity choice, performs the algebra, and interprets the result.
        type: freeResponse
        prompt: Explain the conversion from $r=4\sin\theta$ to the Cartesian circle.
        answer:
          expected: Multiply by r to get r^2=4r sin theta. Substitute r^2=x^2+y^2 and r sin theta=y to get x^2+y^2=4y. Complete the square to get x^2+(y-2)^2=4, a circle centered at (0,2) with radius 2.
          gradingMode: selfCheck
          keyPoints:
            - Multiply both sides by $r$.
            - Substitute $r^2=x^2+y^2$.
            - Substitute $r\sin\theta=y$.
            - Complete the square.
            - Identify the circle's center and radius.
        explanation: |
          This example is the classic pattern for $r=a\sin\theta$. Multiplying by $r$ is not arbitrary; it creates the exact Cartesian identities needed to remove polar symbols.

  - id: cartesian-circle-to-polar
    title: Convert a Cartesian circle to a polar equation
    problem: |
      Convert the Cartesian equation

      $$
      x^2+y^2=6x
      $$

      to a polar equation. Then identify the curve from the polar form and confirm it with the graph.

      ![Circle corresponding to x squared plus y squared equals six x, centered at three comma zero with radius three](/assessments/calc2-parametric-polar/cartesian-polar-circle-x2y2-6x.svg)
    steps:
      - id: cartesian-polar-circle-step-1
        title: Match each Cartesian expression to a polar identity
        instruction: |
          When converting Cartesian to polar, use:

          $$
          x=r\cos\theta,
          \qquad
          y=r\sin\theta,
          \qquad
          x^2+y^2=r^2.
          $$

          The left side is already the distance-squared expression.
        type: multipleChoice
        prompt: What should replace $x^2+y^2$?
        choices:
          - id: r-squared
            text: '$r^2$'
          - id: r-cos
            text: '$r\cos\theta$'
          - id: r-sin
            text: '$r\sin\theta$'
          - id: theta
            text: '$\theta^2$'
        answer:
          choiceId: r-squared
        explanation: |
          The identity $r^2=x^2+y^2$ is the main bridge for circles centered on an axis through the pole.

      - id: cartesian-polar-circle-step-2
        title: Substitute into the equation
        instruction: |
          Starting with

          $$
          x^2+y^2=6x,
          $$

          substitute

          $$
          x^2+y^2=r^2
          $$

          and

          $$
          x=r\cos\theta.
          $$
        type: multipleChoice
        prompt: Which polar equation appears immediately after substitution?
        choices:
          - id: correct
            text: '$r^2=6r\cos\theta$'
          - id: sin
            text: '$r^2=6r\sin\theta$'
          - id: no-r
            text: '$r=6\cos\theta$'
          - id: squared-cos
            text: '$r^2=6\cos^2\theta$'
        answer:
          choiceId: correct
        explanation: |
          Since $x=r\cos\theta$, the right side becomes $6r\cos\theta$.

      - id: cartesian-polar-circle-step-3
        title: Divide carefully
        instruction: |
          From

          $$
          r^2=6r\cos\theta,
          $$

          factor:

          $$
          r(r-6\cos\theta)=0.
          $$

          The $r=0$ point is already included in the circle. The useful polar equation for the full curve is:

          $$
          r=6\cos\theta.
          $$
        type: symbolicResponse
        prompt: Write the simplified polar equation.
        answer:
          expectedLatex: 'r=6\cos\theta'
          equivalenceMode: expression
          variables:
            - r
            - theta
          tolerance: 0.000001
        hint: Divide by $r$ after noting that the pole remains part of the curve.
        explanation: |
          The simplified form is

          $$
          r=6\cos\theta.
          $$

          It represents a circle centered on the positive $x$-axis.

      - id: cartesian-polar-circle-step-4
        title: Interpret the polar form
        instruction: |
          Polar equations of the form

          $$
          r=a\cos\theta
          $$

          are circles tangent to the pole and centered on the $x$-axis. Here, $a=6$, so the Cartesian graph should be centered halfway from $0$ to $6$ on the $x$-axis.
        type: multipleChoice
        prompt: What are the center and radius of the original Cartesian circle?
        choices:
          - id: correct
            text: Center $(3,0)$, radius $3$.
          - id: y-center
            text: Center $(0,3)$, radius $3$.
          - id: radius-six
            text: Center $(6,0)$, radius $6$.
          - id: origin
            text: Center $(0,0)$, radius $6$.
        answer:
          choiceId: correct
        explanation: |
          Completing the square also confirms:

          $$
          x^2-6x+y^2=0
          $$

          becomes

          $$
          (x-3)^2+y^2=9.
          $$

          The center is $(3,0)$ and the radius is $3$.

      - id: cartesian-polar-circle-step-5
        title: Summarize the reverse conversion
        instruction: |
          A good explanation shows that the polar equation and Cartesian equation describe the same set of points.
        type: freeResponse
        prompt: Explain why $x^2+y^2=6x$ converts to $r=6\cos\theta$.
        answer:
          expected: Replace x^2+y^2 with r^2 and x with r cos theta. This gives r^2=6r cos theta, or r(r-6 cos theta)=0. The polar equation r=6 cos theta traces the circle, including the pole, and corresponds to (x-3)^2+y^2=9.
          gradingMode: selfCheck
          keyPoints:
            - Use $x^2+y^2=r^2$.
            - Use $x=r\cos\theta$.
            - Simplify $r^2=6r\cos\theta$ to $r=6\cos\theta$.
            - Mention the pole is included in the circle.
            - Identify the circle as centered at $(3,0)$ with radius $3$.
        explanation: |
          This is the reverse of the first pattern. Equations with $x^2+y^2$ often become very simple in polar form because $x^2+y^2$ is exactly $r^2$.

  - id: cartesian-parabola-to-polar-plot
    title: Convert a Cartesian parabola to polar form and plot it
    problem: |
      Convert the Cartesian equation

      $$
      y^2=4x
      $$

      to a polar equation. Then use the polar equation to understand and plot the curve.

      ![Right-opening parabola y squared equals four x plotted with its converted polar trace](/assessments/calc2-parametric-polar/cartesian-to-polar-parabola-y2-4x.svg)
    steps:
      - id: cartesian-parabola-step-1
        title: Substitute the coordinate identities
        instruction: |
          Use

          $$
          y=r\sin\theta
          $$

          and

          $$
          x=r\cos\theta.
          $$

          The equation $y^2=4x$ becomes:

          $$
          (r\sin\theta)^2=4(r\cos\theta).
          $$
        type: multipleChoice
        prompt: Which equation is correct after substitution?
        choices:
          - id: correct
            text: '$r^2\sin^2\theta=4r\cos\theta$'
          - id: cos-square
            text: '$r^2\cos^2\theta=4r\sin\theta$'
          - id: no-square
            text: '$r\sin\theta=4r\cos\theta$'
          - id: r-square-right
            text: '$r^2\sin^2\theta=4r^2\cos\theta$'
        answer:
          choiceId: correct
        explanation: |
          Since $y$ is squared, $(r\sin\theta)^2=r^2\sin^2\theta$. Since $x=r\cos\theta$, the right side is $4r\cos\theta$.

      - id: cartesian-parabola-step-2
        title: Solve for r without losing the pole
        instruction: |
          From

          $$
          r^2\sin^2\theta=4r\cos\theta,
          $$

          factor out $r$:

          $$
          r(r\sin^2\theta-4\cos\theta)=0.
          $$

          The $r=0$ solution is the vertex at the pole. For all other points, solve:

          $$
          r\sin^2\theta=4\cos\theta.
          $$
        type: symbolicResponse
        prompt: Solve for $r$.
        answer:
          expectedLatex: 'r=\frac{4\cos\theta}{\sin^2\theta}'
          equivalenceMode: expression
          variables:
            - r
            - theta
          tolerance: 0.000001
        hint: Divide by $\sin^2\theta$ after separating the $r=0$ vertex.
        explanation: |
          The converted polar equation is

          $$
          r=\frac{4\cos\theta}{\sin^2\theta}.
          $$

          This can also be written as

          $$
          r=4\cot\theta\csc\theta.
          $$

      - id: cartesian-parabola-step-3
        title: Choose a useful plotting interval
        instruction: |
          The formula

          $$
          r=\frac{4\cos\theta}{\sin^2\theta}
          $$

          is undefined when $\sin\theta=0$, so avoid $\theta=0$ and $\theta=\pi$.

          The interval

          $$
          0<\theta<\pi
          $$

          traces the right-opening parabola, with the vertex approached near $\theta=\frac{\pi}{2}$.
        type: multipleChoice
        prompt: Why should $\theta=0$ and $\theta=\pi$ be avoided in the polar plotting formula?
        choices:
          - id: denominator
            text: Because $\sin^2\theta=0$ makes the denominator zero.
          - id: numerator
            text: Because $\cos\theta=0$ makes the numerator zero.
          - id: cartesian
            text: Because the Cartesian parabola has no vertex.
          - id: periodic
            text: Because polar curves never use endpoint angles.
        answer:
          choiceId: denominator
        explanation: |
          The converted expression has $\sin^2\theta$ in the denominator. Angles where $\sin\theta=0$ correspond to the far-opening direction of the parabola rather than finite plotted endpoint points.

      - id: cartesian-parabola-step-4
        title: Understand the negative-radius half
        instruction: |
          For $0<\theta<\frac{\pi}{2}$, $\cos\theta>0$, so $r>0$. This traces the upper branch.

          For $\frac{\pi}{2}<\theta<\pi$, $\cos\theta<0$, so $r<0$. A negative radius points opposite the named angle, which traces the lower branch of the same right-opening parabola.
        type: multipleChoice
        prompt: What does the negative $r$ on $\frac{\pi}{2}<\theta<\pi$ do geometrically?
        choices:
          - id: lower-branch
            text: It flips the plotted point across the pole and traces the lower branch.
          - id: invalid
            text: It makes the polar equation invalid.
          - id: left-parabola
            text: It creates a separate left-opening parabola.
          - id: circle
            text: It changes the graph into a circle.
        answer:
          choiceId: lower-branch
        explanation: |
          Negative radius values are allowed in polar coordinates. They send the point in the opposite direction, which is exactly how the lower branch appears from angles in quadrant II.

      - id: cartesian-parabola-step-5
        title: Make a small plotting table
        instruction: |
          A polar plot is easier if you evaluate a few angles and convert to $(x,y)$:

          $$
          x=r\cos\theta,
          \qquad
          y=r\sin\theta.
          $$

          At $\theta=\frac{\pi}{4}$:

          $$
          r=\frac{4(\sqrt2/2)}{1/2}=4\sqrt2,
          $$

          so

          $$
          (x,y)=(4,4).
          $$
        type: multipleChoice
        prompt: Which point corresponds to $\theta=\frac{3\pi}{4}$?
        choices:
          - id: correct
            text: '$(4,-4)$'
          - id: positive
            text: '$(4,4)$'
          - id: left
            text: '$(-4,4)$'
          - id: vertex
            text: '$(0,0)$'
        answer:
          choiceId: correct
        hint: At $\frac{3\pi}{4}$, $r=-4\sqrt2$.
        explanation: |
          At $\theta=\frac{3\pi}{4}$,

          $$
          r=-4\sqrt2.
          $$

          Then

          $$
          x=(-4\sqrt2)\left(-\frac{\sqrt2}{2}\right)=4
          $$

          and

          $$
          y=(-4\sqrt2)\left(\frac{\sqrt2}{2}\right)=-4.
          $$

      - id: cartesian-parabola-step-6
        title: Match the plot to the equation
        instruction: |
          The graph shows the Cartesian reference curve in gray and the polar trace in red. They overlap because they are the same set of points.

          The vertex is at the pole, and the curve opens toward positive $x$.
        type: selectAll
        prompt: Which graph features should appear after plotting the converted polar equation?
        choices:
          - id: vertex
            text: The vertex is at $(0,0)$.
          - id: opens-right
            text: The curve opens to the right.
          - id: symmetric
            text: The graph is symmetric about the $x$-axis.
          - id: circle
            text: The graph is a circle centered at $(2,0)$.
        answer:
          choiceIds:
            - vertex
            - opens-right
            - symmetric
        explanation: |
          The original equation $y^2=4x$ is a right-opening parabola. The polar equation must preserve those features because it is just a rewritten form of the same curve.

      - id: cartesian-parabola-step-7
        title: Summarize the conversion and plotting logic
        instruction: |
          The final conversion is:

          $$
          y^2=4x
          \quad\Rightarrow\quad
          r^2\sin^2\theta=4r\cos\theta
          \quad\Rightarrow\quad
          r=\frac{4\cos\theta}{\sin^2\theta}.
          $$

          The pole $r=0$ is retained as the vertex, and $0<\theta<\pi$ gives a useful tracing interval.
        type: freeResponse
        prompt: Explain how to convert and plot $y^2=4x$ in polar form.
        answer:
          expected: Substitute y=r sin theta and x=r cos theta to get r^2 sin^2 theta=4r cos theta. Keep the r=0 vertex, then for nonzero r solve r=4 cos theta/sin^2 theta. Plot on 0<theta<pi, avoiding sin theta=0; positive r gives the upper branch and negative r gives the lower branch, producing the right-opening parabola y^2=4x.
          gradingMode: selfCheck
          keyPoints:
            - Substitute $y=r\sin\theta$ and $x=r\cos\theta$.
            - Factor out $r$ and keep the $r=0$ vertex.
            - Solve $r=\frac{4\cos\theta}{\sin^2\theta}$ for nonzero $r$.
            - Avoid $\theta=0$ and $\theta=\pi$ because $\sin^2\theta=0$.
            - Explain that negative radius values trace the lower branch.
            - Identify the final graph as the right-opening parabola.
        explanation: |
          This problem is more delicate than the circle examples because solving for $r$ creates a restricted polar expression. The algebra is still just coordinate conversion, but the graphing step requires attention to where the formula is defined and how negative radius values plot.
