  - { id: frr1, type: cloze, prompt: 'Maximum static friction is $f_{s,max}=\mu_s____$.', answer: { expected: N, expectedLatex: 'N', aliases: ['normal force'], media: [] }, explanation: 'Solution: Insert $N$.\n\nWhy it works: Static-friction limit is proportional to normal force.', tags: [formula] }
  - { id: frr2, type: typed, prompt: 'When does kinetic friction apply?', answer: { expected: 'when surfaces slide', expectedLatex: '', aliases: ['during sliding'], media: [] }, explanation: 'Solution: When surfaces slide.\n\nWhy it works: Kinetic friction models relative sliding.', tags: [regime] }
  - { id: frr3, type: cloze, prompt: 'Friction opposes relative ____ between surfaces.', answer: { expected: motion, expectedLatex: '', aliases: [sliding], media: [] }, explanation: 'Solution: Insert motion.\n\nWhy it works: Friction opposes actual or impending relative motion.', tags: [direction] }
  - { id: frr4, type: typed, prompt: 'What force is perpendicular to a contact surface?', answer: { expected: 'normal force', expectedLatex: 'N', aliases: [normal], media: [] }, explanation: 'Solution: Normal force.\n\nWhy it works: It acts perpendicular to the surface.', tags: [normal] }
  - { id: frr5, type: cloze, prompt: 'Kinetic friction magnitude is $f_k=\mu_k____$.', answer: { expected: N, expectedLatex: 'N', aliases: ['normal force'], media: [] }, explanation: 'Solution: Insert $N$.\n\nWhy it works: Kinetic friction is proportional to normal force.', tags: [formula] }
  - { id: frr6, type: typed, prompt: 'Can static friction be less than its maximum value?', answer: { expected: yes, expectedLatex: '', aliases: ['yes it can'], media: [] }, explanation: 'Solution: Yes.\n\nWhy it works: It adjusts to the amount needed until its maximum.', tags: [static] }
