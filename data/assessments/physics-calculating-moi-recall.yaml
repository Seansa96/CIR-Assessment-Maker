  sections:
  - id: sec-physics-calculating-moi-recall
    title: Core Terminology
    entries:
    - id: entry-parallel-axis
      term: Parallel-Axis Theorem
      definition: A theorem stating that the moment of inertia about any axis is $I
        = I_{cm} + md^2$, where $d$ is the distance from the center of mass axis.
      drills:
      - id: drill-parallel-axis
        prompt: The ________-Axis Theorem relates the moment of inertia about an arbitrary
          axis to the moment of inertia through the center of mass.
        type: typed
        answer:
          expected: Parallel
    - id: entry-continuous-moi
      term: Moment of Inertia for Continuous Bodies
      definition: Calculated using the integral $I = \int r^2 \, dm$.
      drills:
      - id: drill-integral-moi
        prompt: For continuous mass distributions, the moment of inertia is found
          using a(n) ________.
        type: typed
        answer:
          expected: integral
