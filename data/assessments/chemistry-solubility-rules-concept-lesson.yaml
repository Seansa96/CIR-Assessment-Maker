lesson:
  introduction: 'When you mix two aqueous solutions of ionic compounds, they sometimes react to form a solid precipitate, while other times nothing happens. How do you predict the outcome? You must apply **solubility rules**.'
  sections:
  - id: rules-of-solubility
    title: The Rules of Solubility
    required: true
    content: |
      Solubility rules help us predict if an ionic compound will dissolve in water ($aq$) or form an insoluble solid ($s$). 
      
      **Always Soluble (No Exceptions):**
      - **Group 1 cations**: $Li^+$, $Na^+$, $K^+$, $Rb^+$, $Cs^+$
      - **Ammonium**: $NH_4^+$
      - **Nitrates**: $NO_3^-$
      - **Acetates**: $C_2H_3O_2^-$ (or $CH_3COO^-$)
      
      **Usually Soluble (With Exceptions):**
      - **Halides** ($Cl^-$, $Br^-$, $I^-$): Soluble *except* with $Ag^+$, $Pb^{2+}$, and $Hg_2^{2+}$.
      - **Sulfates** ($SO_4^{2-}$): Soluble *except* with $Ba^{2+}$, $Sr^{2+}$, $Pb^{2+}$, $Ag^+$, and $Ca^{2+}$.
      
      **Usually Insoluble (With Exceptions):**
      - **Hydroxides** ($OH^-$) and **Sulfides** ($S^{2-}$): Insoluble *except* with Group 1, $NH_4^+$, and heavier Group 2 ($Ca^{2+}$, $Sr^{2+}$, $Ba^{2+}$).
      - **Carbonates** ($CO_3^{2-}$) and **Phosphates** ($PO_4^{3-}$): Insoluble *except* with Group 1 and $NH_4^+$.
    check:
      id: solubility-check
      type: multipleChoice
      skills:
      - solubility-rules
      prompt: 'Which of the following compounds is **insoluble** in water?'
      choices:
      - id: a
        text: $Na_2CO_3$
      - id: b
        text: $PbCl_2$
      - id: c
        text: $KNO_3$
      - id: d
        text: $NH_4Br$
      answer:

        choiceId: b
      explanation: 'Most chlorides are soluble, but $Pb^{2+}$ is an exception, making $PbCl_2$ insoluble. All sodium ($Na^+$), potassium ($K^+$), and ammonium ($NH_4^+$) salts are always soluble.'

  - id: ionic-equations
    title: Complete Ionic Equations
    required: true
    content: |
      When soluble ionic compounds dissolve in water, they completely dissociate into their constituent ions. A **complete ionic equation** shows all the soluble strong electrolytes as separate ions.
      
      **Molecular Equation:**
      $$ Pb(NO_3)_2(aq) + 2KI(aq) \rightarrow PbI_2(s) + 2KNO_3(aq) $$
      
      **Complete Ionic Equation:**
      To write this, break apart anything that is aqueous ($aq$). **Do not** break apart solids ($s$), liquids ($l$), or gases ($g$).
      $$ Pb^{2+}(aq) + 2NO_3^-(aq) + 2K^+(aq) + 2I^-(aq) \rightarrow PbI_2(s) + 2K^+(aq) + 2NO_3^-(aq) $$
      
      Notice how $Pb(NO_3)_2(aq)$ breaks into one $Pb^{2+}$ ion and **two** $NO_3^-$ ions.
    check:
      id: ionic-eq-check
      type: multipleChoice
      skills:
      - chemical-reactions-equations
      prompt: 'How should $Ca(OH)_2(aq)$ be written in a complete ionic equation?'
      choices:
      - id: a
        text: $Ca(OH)_2(aq)$
      - id: b
        text: $Ca^{2+}(aq) + OH_2^{2-}(aq)$
      - id: c
        text: $Ca^{2+}(aq) + 2OH^-(aq)$
      - id: d
        text: $Ca^{2+}(aq) + (OH)_2(aq)$
      answer:

        choiceId: c
      explanation: '$Ca(OH)_2$ dissociates into one calcium ion ($Ca^{2+}$) and two hydroxide ions ($OH^-$).'

  - id: net-ionic-equations
    title: Net Ionic Equations and Spectator Ions
    required: true
    content: |
      Look closely at the complete ionic equation from the previous section:
      $$ Pb^{2+}(aq) + \mathbf{2NO_3^-(aq)} + \mathbf{2K^+(aq)} + 2I^-(aq) \rightarrow PbI_2(s) + \mathbf{2K^+(aq)} + \mathbf{2NO_3^-(aq)} $$
      
      The $K^+$ and $NO_3^-$ ions appear exactly the same on both sides of the arrow. They didn't react; they just watched. We call these **spectator ions**.
      
      By canceling out the spectator ions, we get the **net ionic equation**, which shows only the species that actually participated in the chemical change:
      $$ Pb^{2+}(aq) + 2I^-(aq) \rightarrow PbI_2(s) $$
    check:
      id: net-ionic-check
      type: multipleChoice
      skills:
      - chemical-reactions-equations
      prompt: 'What are the spectator ions in the reaction between $AgNO_3(aq)$ and $NaCl(aq)$?'
      choices:
      - id: a
        text: $Ag^+$ and $Cl^-$
      - id: b
        text: $Na^+$ and $NO_3^-$
      - id: c
        text: $Ag^+$ and $NO_3^-$
      - id: d
        text: $Na^+$ and $Cl^-$
      answer:

        choiceId: b
      explanation: 'The products are $AgCl(s)$ and $NaNO_3(aq)$. The $Ag^+$ and $Cl^-$ combine to form the solid precipitate, while $Na^+$ and $NO_3^-$ remain aqueous and are the spectator ions.'
