workedExamples:
- id: separable-ivp-exponential
  title: A Separable Initial-Value Problem
  problem: |
    Solve the initial-value problem

    $$
    \frac{dy}{dx}=2xy, \qquad y(0)=3.
    $$

    Give the solution on the interval containing $x=0$ and verify it.
  steps:
  - id: identify-equilibrium
    title: Step 1 — Preserve an equilibrium solution
    instruction: Before dividing by $y$, test whether $y=0$ is a solution.
    type: multipleChoice
    prompt: Is $y=0$ a solution of $y'=2xy$?
    choices:
    - { id: yes, text: 'Yes; both sides are zero.' }
    - { id: no, text: 'No; the right side is undefined.' }
    answer:
      choiceId: yes
      explanation: $y=0$ is an equilibrium solution. It does not satisfy this IVP, but it would be lost if we divided by $y$ without noting it.
  - id: separate
    title: Step 2 — Separate the variables
    instruction: For the nonzero branch, put the $y$ factor with $dy$.
    type: symbolicResponse
    prompt: Enter the separated equation with $dy$ on the left.
    answer:
      expectedLatex: '\frac{1}{y}dy=2xdx'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x, y]
      explanation: Divide by $y$ and multiply by $dx$.
  - id: integrate
    title: Step 3 — Integrate
    instruction: Integrate both sides and combine constants into one $C$.
    type: symbolicResponse
    prompt: Enter the implicit relation after integration.
    answer:
      expectedLatex: '\ln(abs(y))=x^2+C'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x, y, C]
      explanation: $\int y^{-1}dy=\ln|y|$ and $\int2x\,dx=x^2$.
  - id: apply-condition
    title: Step 4 — Use the initial condition
    instruction: Exponentiate and determine the positive constant selected by $y(0)=3$.
    type: symbolicResponse
    prompt: Enter the particular solution $y(x)$.
    answer:
      expectedLatex: '3e^(x^2)'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [x]
      explanation: The initial condition chooses $y=3e^{x^2}$; differentiating gives $y'=2x(3e^{x^2})=2xy$.
- id: equal-flow-mixing
  title: Equal-Flow Salt-Mixing Model
  problem: |
    A 50-gal tank initially contains solution at 2 lb/gal. Pure water enters at 4 gal/min and the well-stirred mixture leaves at 4 gal/min. Find the amount of salt $S(t)$, in pounds.
  steps:
  - id: initial-amount
    title: Step 1 — Determine the initial amount
    instruction: Convert the given concentration and volume to salt amount.
    type: numericResponse
    prompt: What is $S(0)$ in pounds?
    answer:
      value: 100
      tolerance: 0.01
      explanation: Initial amount is $(2\ \mathrm{lb/gal})(50\ \mathrm{gal})=100$ lb.
  - id: balance
    title: Step 2 — Build the rate balance
    instruction: Because pure water enters, salt enters at zero rate. The tank volume stays 50 gal.
    type: symbolicResponse
    prompt: Enter $dS/dt$ in terms of $S$.
    answer:
      expectedLatex: '-4S/50'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [S]
      explanation: Outflow salt rate is $(S/50)(4)$ lb/min, so $S'=0-4S/50$.
  - id: separate-mixing
    title: Step 3 — Separate and integrate
    instruction: Solve the equation $S'=-(4/50)S$ for its nonzero family.
    type: symbolicResponse
    prompt: Enter $\ln|S|$ as a function of $t$ and $C$.
    answer:
      expectedLatex: '-4t/50+C'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [t, C]
      explanation: Dividing by $S$ gives $dS/S=-(4/50)dt$.
  - id: model-solution
    title: Step 4 — Apply the initial amount and interpret
    instruction: Use $S(0)=100$.
    type: symbolicResponse
    prompt: Enter $S(t)$.
    answer:
      expectedLatex: '100e^(-4t/50)'
      equivalenceMode: expression
      tolerance: 0.000001
      variables: [t]
      explanation: The salt amount decays exponentially toward zero, consistent with pure water replacing the original brine.
