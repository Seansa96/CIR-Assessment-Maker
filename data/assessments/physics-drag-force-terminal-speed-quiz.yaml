questions:
- id: q001
  type: multipleChoice
  prompt: 'Two spheres of identical shape and size but different masses ($m_1 = 1$
    kg and $m_2 = 5$ kg) are dropped from a high flying plane. Which sphere will have
    a higher terminal speed?

    '
  choices:
  - id: a
    text: The 5 kg sphere.
  - id: b
    text: The 1 kg sphere.
  - id: c
    text: They will have the same terminal speed.
  - id: d
    text: It depends on the altitude of the plane.
  answer:
    choiceId: a
  explanation: 'Terminal speed is reached when $F_D = mg$. Since $F_D$ depends on
    size and shape (which are identical), both spheres experience the same drag force
    at any given speed. However, the heavier sphere has a larger $mg$, so it must
    fall *faster* to generate a large enough drag force to balance its heavier weight.
    $v_t = \sqrt{2mg / (C \rho A)}$, so $v_t \propto \sqrt{m}$.

    '
- id: q002
  type: multipleChoice
  prompt: 'A coffee filter is dropped and reaches its terminal speed of 1.0 m/s. If
    you stack four identical coffee filters together, what will their new terminal
    speed be? (Assume the drag force is proportional to $v^2$).

    '
  choices:
  - id: a
    text: 1.0 m/s
  - id: b
    text: 2.0 m/s
  - id: c
    text: 4.0 m/s
  - id: d
    text: 16.0 m/s
  answer:
    choiceId: b
  explanation: 'For one filter: $mg = k v_1^2$.

    For four filters, the mass is $4m$, but the cross-sectional area and shape ($k$)
    are roughly the same since they are stacked inside each other.

    $4mg = k v_4^2$.

    Comparing the two: $4 (k v_1^2) = k v_4^2 \implies v_4^2 = 4 v_1^2 \implies v_4
    = 2 v_1$.

    The new terminal speed is $2.0$ m/s.

    '
- id: q003
  type: multipleChoice
  prompt: 'A ball is thrown straight up into the air with an initial velocity $v_0$.
    If air resistance (drag) is NOT ignored,\rhow does the time to go up ($t_{up}$)
    compare to the time to come down ($t_{down}$)?

    '
  choices:
  - id: a
    text: $t_{up} < t_{down}$
  - id: b
    text: $t_{up} > t_{down}$
  - id: c
    text: $t_{up} = t_{down}$
  answer:
    choiceId: a
  explanation: 'On the way up, gravity and drag both point DOWN. The downward acceleration
    is greater than $g$, so it stops quickly ($t_{up}$ is short). On the way down,
    gravity points down but drag points UP. The downward acceleration is less than
    $g$, so it takes longer to fall the same distance ($t_{down}$ is longer).

    '
