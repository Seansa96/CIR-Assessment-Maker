questions:
- id: q001
  type: multipleChoice
  prompt: What does the area between two curves represent?
  choices:
  - id: a
    text: The accumulated vertical difference between two functions over an interval
  - id: b
    text: The slope of the upper function
  - id: c
    text: The x-coordinate of an intersection point
  answer:
    choiceId: a
  explanation: 'Area between curves measures the accumulated difference between upper
    and lower functions.


    Related topic: Area Between Curves

    '
- id: q002
  type: freeResponse
  prompt: Explain what the integral represents in an area-between-curves problem.
  answer:
    expected: It represents the accumulated difference between the upper and lower
      functions over an interval.
    gradingMode: selfCheck
  explanation: 'The integral sums vertical differences over the interval.


    Related topic: Setting Up Area Between Curves Integrals

    '
- id: q003
  type: selectAll
  prompt: Which are valid setup steps?
  choices:
  - id: a
    text: Identify the upper function
  - id: b
    text: Identify the lower function
  - id: c
    text: Subtract lower from upper
  - id: d
    text: Integrate only the lower function
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: 'Area between curves requires determining upper/lower functions and
    integrating their difference.


    Related topic: Area Between Curves Setup

