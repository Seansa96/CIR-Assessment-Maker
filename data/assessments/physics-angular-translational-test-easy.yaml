questions:
- id: q1
  type: numericResponse
  prompt: A car travels at $20 \text{ m/s}$ around a curve of radius $50 \text{ m}$.
    What is its radial (centripetal) acceleration in $\text{m/s}^2$?
  answer:
    value: 8.0
    tolerance: 0.5
  explanation: $a_r = \frac{v^2}{r} = \frac{400}{50} = 8.0 \text{ m/s}^2$.
