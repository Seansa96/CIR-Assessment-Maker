- id: easy-q007
  type: symbolicResponse
  prompt: |-
    A belt moves with tangential acceleration $a_t$. It turns a pulley of radius $R$. Derive the expression for the pulley's angular acceleration $\alpha$.
  answer:
    expectedLatex: |-
      \frac{a_t}{R}
    equivalenceMode: derivative
    variables:
    - a_t
    - R
    tolerance: 0.001
  explanation: |-
    The tangential acceleration of the rim equals the belt's acceleration, so $a_t = R\alpha \implies \alpha = a_t/R$.
