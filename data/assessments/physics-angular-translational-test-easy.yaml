- id: easy-q012
  type: multipleChoice
  prompt: A belt connects two pulleys, $A$ and $B$. If $R_B = 2 R_A$, how does the
    angular velocity of $B$ compare to $A$?
  choices:
  - id: a
    text: |-
      $\omega_B = \frac{1}{2}\omega_A$
  - id: b
    text: |-
      $\omega_B = 2\omega_A$
  - id: c
    text: |-
      $\omega_B = \omega_A$
  answer:
    choiceId: a
  explanation: |-
    Since the belt speed $v$ is the same for both rims, $v = R_A \omega_A = R_B \omega_B$. Thus $\omega_B = \frac{R_A}{R_B}\omega_A = \frac{1}{2}\omega_A$.
