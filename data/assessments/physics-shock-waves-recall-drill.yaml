items:
- {id: shock-r1, type: cloze, prompt: 'Mach number is $M={{v_s/v}}$.', answer: {expected: 'v_s/v'}, explanation: 'Solution: Use $M=v_s/v$. Why it works: Mach number compares source speed with wave speed.'}
- {id: shock-r2, type: typed, prompt: 'What condition is required for a Mach cone?', answer: {expected: supersonic speed}, explanation: 'Solution: Source speed must be supersonic. Why it works: only then can the source outrun its previous wavefronts.'}
- {id: shock-r3, type: cloze, prompt: 'Mach-angle relation is $\sin\theta={{1/M}}$.', answer: {expected: '1/M'}, explanation: 'Solution: Use $\sin\theta=1/M$. Why it works: triangle geometry gives wavefront radius divided by source distance.'}
- {id: shock-r4, type: typed, prompt: 'What happens to the Mach angle as Mach number increases?', answer: {expected: it decreases}, explanation: 'Solution: It decreases. Why it works: $\sin\theta=1/M$ becomes smaller.'}
- {id: shock-r5, type: cloze, prompt: 'At Mach 1, the Mach angle is {{90 degrees}}.', answer: {expected: 90 degrees}, explanation: 'Solution: Use $\sin\theta=1$. Why it works: the cone opens to a right angle at the sound barrier.'}
- {id: shock-r6, type: typed, prompt: 'What is the abrupt pressure disturbance from a supersonic craft called?', answer: {expected: sonic boom}, explanation: 'Solution: Identify a sonic boom. Why it works: many wavefronts reinforce along the Mach cone.'}
