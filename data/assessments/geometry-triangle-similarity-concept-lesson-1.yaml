lesson:
  introduction: |-
    Congruent triangles are exactly the same size and shape. But what if two triangles are the exact same shape, but different sizes? Like a zoomed-in photograph? In geometry, we call this **Similarity**.
  sections:
  - id: sec-similarity
    title: What is Similarity?
    required: true
    content: |-
      Two polygons are **similar** (symbol: $\sim$) if they have exactly the same shape but not necessarily the same size. 
      
      For two triangles to be similar, two conditions must be met:
      1. All corresponding interior angles must be **congruent** (equal).
      2. All corresponding sides must be **proportional** (they scale up or down by the same multiplier).
      
      If $\triangle ABC \sim \triangle DEF$, then $\angle A \cong \angle D$, $\angle B \cong \angle E$, and $\angle C \cong \angle F$. 
      Furthermore, the ratio of their sides is constant:
      $$\frac{AB}{DE} = \frac{BC}{EF} = \frac{AC}{DF}$$

  - id: sec-scale-factor
    title: The Scale Factor
    required: true
    content: |-
      The constant ratio between the corresponding sides of similar figures is called the **scale factor**.
      
      For example, if $\triangle ABC \sim \triangle DEF$, and side $AB = 3$ while the corresponding side $DE = 6$, the scale factor from $\triangle ABC$ to $\triangle DEF$ is $\frac{6}{3} = 2$. This means every side in $\triangle DEF$ is exactly twice as long as the corresponding side in $\triangle ABC$.
      
      We can use this scale factor to set up proportions and solve for missing side lengths!

questions:
- id: q-geom-sim-1
  title: Concept Check - Similar vs Congruent
  prompt: |-
    True or False: All congruent triangles are also similar triangles.
  type: multipleChoice
  choices:
  - id: c1
    text: True
  - id: c2
    text: False
  answer:
    choiceId: c1
  explanation: |-
    **True**. Congruent triangles have equal angles and equal sides. Because their sides are equal, the ratio of their sides is exactly 1. They meet all the requirements for similarity (with a scale factor of 1).
  skills:
  - geometry-triangle-similarity

- id: q-geom-sim-2
  title: Concept Check - Finding a Missing Side
  prompt: |-
    $\triangle JKL \sim \triangle MNO$. The scale factor from $\triangle JKL$ to $\triangle MNO$ is $3$. If side $JK = 5$, what is the length of corresponding side $MN$?
  type: numericResponse
  answer:
    numericValue: 15
    tolerance: 0
  explanation: |-
    The scale factor is 3, which means the sides of the second triangle are 3 times larger than the first.
    $$MN = 3 \times JK = 3 \times 5 = 15$$
  skills:
  - geometry-triangle-similarity
