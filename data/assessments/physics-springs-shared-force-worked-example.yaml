workedExamples:
  - id: we-shared-force-extension
    title: Analyzing Spring Arrangements
    problem: |
      Let's understand why parallel springs share extension and series springs share force.
    steps:
      - id: step-1
        title: Step 1 — Parallel Springs
        instruction: |
          Imagine a rigid bar pulling on two parallel springs simultaneously.
        type: multipleChoice
        prompt: |
          Because the bar remains horizontal as it is pulled, what must be true about the two parallel springs?
        choices:
          - id: a
            text: 'They experience the same tension force.'
          - id: b
            text: 'They experience the exact same extension.'
          - id: c
            text: 'Their spring constants must be identical.'
        answer:
          choiceId: b
        explanation: 'Geometrically, if the attachment points move together, both springs are forced to stretch by the exact same distance.'
      - id: step-2
        title: Step 2 — Series Springs
        instruction: |
          Now imagine two springs hooked end-to-end (in series) with a mass hanging from the bottom.
        type: multipleChoice
        prompt: |
          By Newton's Third Law (and assuming the springs are massless), what must be true about the interaction between the two springs?
        choices:
          - id: a
            text: 'They stretch by the exact same amount.'
          - id: b
            text: 'They carry the exact same force throughout the chain.'
          - id: c
            text: 'The top spring carries twice the force.'
        answer:
          choiceId: b
        explanation: 'In a massless chain or string (or spring), tension is uniform. The bottom spring pulls on the top spring with force $F$, and the top pulls back with force $F$. Both carry force $F$.'
