topicId: physics-work-energy
skills: [Apply Work and Kinetic Energy, physics-work-energy, spring-energy]
navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [physics-1, physics-work-energy] }
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we-shared-parallel
    title: What parallel springs share
    problem: 'Compare the displacements and forces for two unequal springs connected in parallel.'
    steps:
      - id: sp-1
        title: Identify shared quantity
        instruction: 'Both springs connect to one moving rigid bar.'
        type: multipleChoice
        prompt: 'What must be equal for the two springs?'
        choices: [{ id: a, text: 'Their extension' }, { id: b, text: 'Their force' }]
        answer: { choiceId: a }
        explanation: 'Solution: Their extension is equal.\n\nWhy it works: The shared endpoints move together.\n\nWhy the other choices fail: Unequal stiffnesses generally produce unequal forces.'
      - id: sp-2
        title: Compare forces
        instruction: 'Use Hooke''s law with the common extension.'
        type: symbolicResponse
        prompt: 'If $k_2=3k_1$, write $F_2/F_1$. '
        answer: { gradingMode: auto, expectedLatex: '3', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_2/F_1=(k_2x)/(k_1x)=3$.\n\nWhy it works: With equal extension, force is proportional to stiffness.'
  - id: we-shared-series
    title: What series springs share
    problem: 'Compare the displacements and forces for two unequal massless springs connected in series.'
    steps:
      - id: ss-1
        title: Identify shared quantity
        instruction: 'The springs form one massless force path.'
        type: multipleChoice
        prompt: 'What must be equal through the chain?'
        choices: [{ id: a, text: 'Their force' }, { id: b, text: 'Their extension' }]
        answer: { choiceId: a }
        explanation: 'Solution: Their force is equal.\n\nWhy it works: A massless connector cannot have unequal forces acting on it.\n\nWhy the other choices fail: Different stiffnesses generally give different extensions.'
      - id: ss-2
        title: Compare extensions
        instruction: 'Use $x=F/k$ with the common force.'
        type: symbolicResponse
        prompt: 'If $k_2=3k_1$, write $x_2/x_1$. '
        answer: { gradingMode: auto, expectedLatex: '1/3', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $x_2/x_1=(F/k_2)/(F/k_1)=1/3$.\n\nWhy it works: Under the same force, extension is inversely proportional to stiffness.'
