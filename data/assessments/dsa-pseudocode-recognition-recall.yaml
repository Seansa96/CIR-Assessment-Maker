schemaVersion: 1
id: dsa-pseudocode-recognition-recall
title: DSA Pseudocode Recognition Recall
assessmentType: recallDrill
categoryId: dsa
subcategoryIds:
- dsa-complexity
- dsa-arrays-strings
- dsa-hashmaps
- dsa-stacks-queues
- dsa-heaps-priority-queues
- dsa-graphs
- dsa-sorting-searching
- dsa-recursion-backtracking
- dsa-recursion-dp
modeDefault: practice
randomizeQuestions: false
items:
- id: recognize-hashmap-frequency
  type: typed
  prompt: "Identify the pattern:\n\n```text\ncounts = {}\nfor x in values:\n    if\
    \ x not in counts:\n        counts[x] = 0\n    counts[x] = counts[x] + 1\n```\n"
  answer:
    expected: hash map frequency counting
    aliases:
    - frequency map
    - hashmap counting
    - dictionary counting
  explanation: 'The code maps each value to a count. This is the hash map frequency-counting
    pattern used for duplicates, anagrams, histograms, and counting occurrences.

    '
  tags:
  - hashmaps
  - frequency-counting
- id: recognize-two-sum-hashmap
  type: typed
  prompt: "Identify the algorithmic idea:\n\n```text\nseen = {}\nfor i from 0 to n\
    \ - 1:\n    need = target - nums[i]\n    if need in seen:\n        return [seen[need],\
    \ i]\n    seen[nums[i]] = i\n```\n"
  answer:
    expected: two-sum with a hash map
    aliases:
    - two sum hashmap
    - complement lookup
    - hash map complement search
  explanation: 'The key idea is storing previously seen numbers by value so each new
    number can check for its complement in constant average time.

    '
  tags:
  - hashmaps
  - complement-lookup
- id: recognize-stack-parentheses
  type: cloze
  prompt: "Identify the data structure:\n\n```text\nfor ch in text:\n    if ch is\
    \ opener:\n        push ch\n    else if ch is closer:\n        top = pop()\n \
    \       check top matches ch\n```\n\nThis is a ____ pattern.\n"
  answer:
    expected: stack
    aliases:
    - stack matching
    - valid parentheses
  explanation: 'Opening brackets are pushed and the most recent opener is popped first.
    That is last-in-first-out behavior.

    '
  tags:
  - stacks
  - nesting
- id: recognize-queue-bfs
  type: typed
  prompt: "Identify the traversal:\n\n```text\nqueue.add(start)\nvisited.add(start)\n\
    while queue is not empty:\n    node = queue.remove_front()\n    for neighbor in\
    \ neighbors(node):\n        if neighbor not in visited:\n            visited.add(neighbor)\n\
    \            queue.add(neighbor)\n```\n"
  answer:
    expected: breadth-first search
    aliases:
    - BFS
    - queue BFS
  explanation: 'The queue processes nodes in discovery order, which explores the graph
    level by level. This is breadth-first search.

    '
  tags:
  - graphs
  - bfs
  - queues
- id: recognize-dfs
  type: typed
  prompt: "Identify the traversal:\n\n```text\nvisit(node):\n    mark node visited\n\
    \    for neighbor in neighbors(node):\n        if neighbor not visited:\n    \
    \        visit(neighbor)\n```\n"
  answer:
    expected: depth-first search
    aliases:
    - DFS
    - recursive DFS
  explanation: 'Recursive traversal goes as far as it can along one branch before
    returning. That is depth-first search.

    '
  tags:
  - graphs
  - dfs
  - recursion
- id: recognize-binary-search
  type: cloze
  prompt: "Identify the algorithm:\n\n```text\nleft = 0\nright = n - 1\nwhile left\
    \ <= right:\n    mid = floor((left + right) / 2)\n    if values[mid] == target:\n\
    \        return mid\n    else if values[mid] < target:\n        left = mid + 1\n\
    \    else:\n        right = mid - 1\n```\n\nThis is ____.\n"
  answer:
    expected: binary search
  explanation: 'The algorithm checks the middle and discards half of the remaining
    sorted search space each iteration.

    '
  tags:
  - binary-search
  - sorting-searching
- id: recognize-sliding-window
  type: typed
  prompt: "Identify the pattern:\n\n```text\nleft = 0\nfor right from 0 to n - 1:\n\
    \    add values[right] to window\n    while window is invalid:\n        remove\
    \ values[left] from window\n        left = left + 1\n    update best answer\n\
    ```\n"
  answer:
    expected: sliding window
    aliases:
    - two pointer sliding window
  explanation: 'The window expands with `right` and shrinks with `left`. This pattern
    is common for contiguous subarray or substring problems.

    '
  tags:
  - arrays-strings
  - sliding-window
- id: recognize-two-pointers
  type: typed
  prompt: "Identify the pattern:\n\n```text\nleft = 0\nright = n - 1\nwhile left <\
    \ right:\n    if values[left] + values[right] is too small:\n        left = left\
    \ + 1\n    else:\n        right = right - 1\n```\n"
  answer:
    expected: two pointers
    aliases:
    - opposite-direction two pointers
  explanation: 'Two pointers move inward from opposite ends. This often appears with
    sorted arrays and pair-sum style problems.

    '
  tags:
  - arrays-strings
  - two-pointers
- id: recognize-merge-sort
  type: typed
  prompt: 'Identify the algorithm:


    ```text

    sort(left half)

    sort(right half)

    merge the two sorted halves

    ```

    '
  answer:
    expected: merge sort
    aliases:
    - mergesort
  explanation: 'Merge sort divides the input into halves, recursively sorts each half,
    and merges sorted results.

    '
  tags:
  - sorting-searching
  - divide-and-conquer
- id: recognize-dp-memoization
  type: cloze
  prompt: "Identify the optimization:\n\n```text\nsolve(state):\n    if state in cache:\n\
    \        return cache[state]\n    answer = combine smaller states\n    cache[state]\
    \ = answer\n    return answer\n```\n\nThis is ____.\n"
  answer:
    expected: memoization
    aliases:
    - top-down dynamic programming
    - DP memoization
  explanation: 'Memoization stores answers for states so repeated recursive calls
    can reuse work instead of recomputing it.

    '
  tags:
  - dynamic-programming
  - memoization
- id: recognize-min-heap
  type: typed
  prompt: "Identify the structure:\n\n```text\npush all tasks with priority\nwhile\
    \ heap is not empty:\n    task = remove smallest priority\n    process task\n\
    ```\n"
  answer:
    expected: priority queue or min-heap
    aliases:
    - priority queue
    - min heap
    - heap
  explanation: 'A priority queue processes the item with the best priority next, rather
    than first-in-first-out or last-in-first-out order.

    '
  tags:
  - heaps
  - priority-queue
- id: recognize-union-find
  type: typed
  prompt: "Identify the structure:\n\n```text\nfind(x):\n    return representative\
    \ of x\n\nunion(a, b):\n    connect the representatives of a and b\n\nconnected(a,\
    \ b):\n    return find(a) == find(b)\n```\n"
  answer:
    expected: union find
    aliases:
    - disjoint set union
    - DSU
  explanation: 'Union-find tracks connected components as sets. It is common in connectivity
    and Kruskal-style minimum spanning tree problems.

    '
  tags:
  - graphs
  - union-find
