questions:
- id: q001
  type: multipleChoice
  prompt: 'Simplify $\dfrac{a^7a^{-2}}{a^3}$ for $a\ne0$.'
  choices:
  - id: a
    text: '$a^2$'
  - id: b
    text: '$a^8$'
  - id: c
    text: '$a^{-12}$'
  - id: d
    text: '$2a$'
  answer:
    choiceId: a
  explanation: |-
    Add exponents in the numerator and subtract the denominator exponent: $7-2-3=2$.
- id: q002
  type: multipleChoice
  prompt: 'Which comparison is correct?'
  choices:
  - id: a
    text: '$8^{11}>4^{17}$ because $33>17$.'
  - id: b
    text: '$8^{11}<4^{17}$ because $2^{33}<2^{34}$.'
  - id: c
    text: '$8^{11}=4^{17}$ because both bases are even.'
  - id: d
    text: The quantities cannot be compared without a calculator.
  answer:
    choiceId: b
  explanation: |-
    Rewrite with base 2: $8^{11}=2^{33}$ and $4^{17}=2^{34}$.
- id: q003
  type: multipleChoice
  prompt: 'Evaluate $27^{-2/3}$.'
  choices:
  - id: a
    text: '$-9$'
  - id: b
    text: '$\frac19$'
  - id: c
    text: '$9$'
  - id: d
    text: '$\frac16$'
  answer:
    choiceId: b
  explanation: The cube root of 27 is 3, squaring gives 9, and the negative exponent takes the reciprocal.
- id: q004
  type: multipleChoice
  prompt: 'For real $x$, simplify $\sqrt{9x^2}$.'
  choices:
  - id: a
    text: '$3x$'
  - id: b
    text: '$9|x|$'
  - id: c
    text: '$3|x|$'
  - id: d
    text: '$\pm3x$'
  answer:
    choiceId: c
  explanation: The principal square root is nonnegative, so $\sqrt{x^2}=|x|$.
- id: q005
  type: multipleChoice
  prompt: 'Simplify $\sqrt{50}-\sqrt8$.'
  choices:
  - id: a
    text: '$\sqrt{42}$'
  - id: b
    text: '$3\sqrt2$'
  - id: c
    text: '$7\sqrt2$'
  - id: d
    text: '$\sqrt2$'
  answer:
    choiceId: b
  explanation: $\sqrt{50}=5\sqrt2$ and $\sqrt8=2\sqrt2$, so the difference is $3\sqrt2$.
- id: q006
  type: multipleChoice
  prompt: 'Rationalize $\dfrac1{\sqrt5+\sqrt2}$.'
  choices:
  - id: a
    text: '$\dfrac{\sqrt5-\sqrt2}{3}$'
  - id: b
    text: '$\dfrac{\sqrt5+\sqrt2}{7}$'
  - id: c
    text: '$\sqrt5-\sqrt2$'
  - id: d
    text: '$\dfrac1{3}$'
  answer:
    choiceId: a
  explanation: Multiply by the conjugate; the denominator becomes $5-2=3$.
- id: q007
  type: multipleChoice
  prompt: 'What is the real domain of $f(x)=\log_3(2x-5)$?'
  choices:
  - id: a
    text: '$x\ge\frac52$'
  - id: b
    text: '$x>\frac52$'
  - id: c
    text: '$x\ne\frac52$'
  - id: d
    text: All real numbers
  answer:
    choiceId: b
  explanation: |-
    A real logarithm requires a strictly positive argument: $2x-5>0$.
- id: q008
  type: multipleChoice
  prompt: 'If $\log_4 y=-\dfrac32$, what is $y$?'
  choices:
  - id: a
    text: '$-8$'
  - id: b
    text: '$\frac18$'
  - id: c
    text: '$8$'
  - id: d
    text: '$\frac1{16}$'
  answer:
    choiceId: b
  explanation: |-
    Convert to exponential form: $y=4^{-3/2}=1/(\sqrt4)^3=1/8$.
- id: q009
  type: multipleChoice
  prompt: 'Solve $9^x=27^{x-1}$.'
  choices:
  - id: a
    text: '$x=1$'
  - id: b
    text: '$x=2$'
  - id: c
    text: '$x=3$'
  - id: d
    text: '$x=\frac32$'
  answer:
    choiceId: c
  explanation: Rewrite as $3^{2x}=3^{3x-3}$, so $2x=3x-3$ and $x=3$.
- id: q010
  type: multipleChoice
  prompt: 'Solve $9^x-10\cdot3^x+9=0$.'
  choices:
  - id: a
    text: '$x=0$ or $x=2$'
  - id: b
    text: '$x=1$ or $x=9$'
  - id: c
    text: '$x=-1$ or $x=2$'
  - id: d
    text: '$x=0$ only'
  answer:
    choiceId: a
  explanation: Let $u=3^x>0$. Then $(u-1)(u-9)=0$, giving $3^x=1$ or $3^x=9$.
- id: q011
  type: multipleChoice
  prompt: 'Solve $\log_5(x-1)+\log_5(x+1)=1$ over the reals.'
  choices:
  - id: a
    text: '$x=\sqrt6$ only'
  - id: b
    text: '$x=\pm\sqrt6$'
  - id: c
    text: '$x=6$ only'
  - id: d
    text: There is no real solution.
  answer:
    choiceId: a
  explanation: The domain requires $x>1$. Combining logs gives $x^2-1=5$, so only the positive root is allowed.
- id: q012
  type: multipleChoice
  prompt: 'A student claims $\log_2(x+4)=\log_2x+2$. Which observation correctly evaluates the claim?'
  choices:
  - id: a
    text: It is always true because $\log_2 4=2$.
  - id: b
    text: It is false in general; the sum rule applies to products, not addition inside a logarithm.
  - id: c
    text: It is true only when $x<0$.
  - id: d
    text: It is false because logarithms cannot be added.
  answer:
    choiceId: b
  explanation: $\log_2x+2=\log_2(4x)$ for $x>0$, which is generally different from $\log_2(x+4)$.
- id: q013
  type: selectAll
  prompt: 'Select every identity that is valid under the stated conditions.'
  choices:
  - id: a
    text: 'For $a\ne0$, $a^{-3}=1/a^3$.'
  - id: b
    text: 'For $u,v>0$, $\log_b(uv)=\log_bu+\log_bv$ when $b>0$ and $b\ne1$.'
  - id: c
    text: 'For $u,v\ge0$, $\sqrt{u+v}=\sqrt u+\sqrt v$.'
  - id: d
    text: 'For real $t$, $\sqrt{t^2}=|t|$.'
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: The radical sum statement is false; for example, $u=v=1$ gives $\sqrt2\ne2$.
- id: q014
  type: selectAll
  prompt: 'When solving $\log_2(x-3)+\log_2(x+1)=4$, which steps are required for a complete solution?'
  choices:
  - id: a
    text: Record the original domain $x>3$.
  - id: b
    text: Combine the logarithms as $\log_2((x-3)(x+1))$.
  - id: c
    text: Keep every root of the resulting quadratic without checking it.
  - id: d
    text: Substitute admissible candidates into the original equation.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: The product law is valid after the domain is stated, and the domain plus substitution removes extraneous algebraic candidates.
- id: q015
  type: freeResponse
  prompt: |-
    A student solves $\sqrt{x+5}=x-1$ by squaring and obtains the candidates $x=4$ and $x=-1$. Explain which candidate is valid and why the other must be rejected.
  answer:
    gradingMode: selfCheck
    expected: |-
      The original equation requires $x-1\ge0$, so $x\ge1$. Substitution shows $x=4$ works because $\sqrt9=3$, while $x=-1$ fails the domain condition and gives $2=-2$. Thus the only solution is $x=4$.
    keyPoints:
    - States the restriction $x\ge1$ or checks both candidates in the original equation.
    - Verifies that $x=4$ satisfies the equation.
    - Rejects $x=-1$ as extraneous.
  explanation: Squaring can add solutions, so every candidate must be checked against the original radical equation.
