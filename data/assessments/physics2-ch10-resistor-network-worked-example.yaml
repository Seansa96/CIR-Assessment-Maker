workedExamples:
- id: we1
  title: Parallel and Series Combination
  steps:
  - id: s1
    prompt: Calculate the parallel combination.
    explanation: 'Solution:

      1) $\frac{1}{R_p} = \frac{1}{30} + \frac{1}{60} = \frac{2}{60} + \frac{1}{60} = \frac{3}{60}$.

      2) $R_p = 60/3 = 20\text{ }\Omega$.


      Why it works:

      Parallel resistors provide multiple paths for current, effectively lowering the overall resistance.'
    title: Calculate the parallel combination.
    instruction: 'Work through this step: Calculate the parallel combination.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  - id: s2
    prompt: Add the series resistor.
    explanation: 'Solution:

      1) $R_{eq} = R_p + R_3 = 20 + 20 = 40\text{ }\Omega$.


      Why it works:

      Series resistors force the total current to pass through each component sequentially, adding their
      resistances.'
    title: Add the series resistor.
    instruction: 'Work through this step: Add the series resistor.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: Two resistors $R_1 = 30\text{ }\Omega$ and $R_2 = 60\text{ }\Omega$ are connected in parallel.
    This combination is then connected in series with a third resistor $R_3 = 20\text{ }\Omega$. What
    is the total equivalent resistance?
