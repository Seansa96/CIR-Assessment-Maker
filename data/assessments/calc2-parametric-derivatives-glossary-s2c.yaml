modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: glossary, tags: [calculus-2, parametric-derivatives, formulas] }
authoring: { visualRequirement: required, visualRationale: 'Slope, tangency, and concavity are visual features of a traced curve.', sourceId: src-20260719182540-a40fdcd443 }
glossary:
  introduction: 'Use these definitions to classify local behavior before writing a tangent line or concavity conclusion.'
  sections:
    - id: derivative-terms
      title: Rates and tangent conditions
      required: true
      content: 'Parametric derivatives compare component rates, then convert the result from change per parameter to change per x.'
      entries:
        - id: parametric-slope
          term: Parametric slope
          definition: The slope of a parametric curve where the horizontal rate is nonzero.
          notation: '$\frac{dy}{dx}=\frac{dy/dt}{dx/dt}$'
          examples: ['Differentiate x and y with respect to t before forming the quotient.']
          aliases: [slope ratio]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Tangent slope on a directed curve }]
          tags: [slope]
          drills: [{ id: slope-drill, type: cloze, prompt: 'The parametric slope is ____ divided by ____.', answer: { expected: 'dy dt; dx dt', aliases: ['dy/dt; dx/dt'] }, explanation: 'Solution: Use dy/dt over dx/dt. Why it works: Slope is vertical change per horizontal change. Common trap: Reversing the quotient.' }]
        - id: horizontal-tangent
          term: Horizontal tangent
          definition: A tangent with zero slope, occurring when the vertical rate is zero and the horizontal rate is nonzero.
          notation: '$dy/dt=0,\ dx/dt\ne0$'
          examples: ['Find the point after finding a valid parameter.']
          aliases: [zero-slope tangent]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Horizontal tangent marker }]
          tags: [tangent]
          drills: [{ id: horizontal-drill, type: cloze, prompt: 'A horizontal tangent needs y-prime equal to ____ and x-prime ____ zero.', answer: { expected: 'zero; not equal to', aliases: ['0; not equal to', '0; nonzero'] }, explanation: 'Solution: The conditions are y-prime equals zero and x-prime nonzero. Why it works: The slope numerator is zero while its denominator remains valid. Common trap: Forgetting the denominator check.' }]
        - id: vertical-tangent
          term: Vertical tangent
          definition: A tangent with undefined slope, occurring when the horizontal rate is zero and the vertical rate is nonzero.
          notation: '$dx/dt=0,\ dy/dt\ne0$'
          examples: ['The curve can continue moving vertically even when x stops changing.']
          aliases: [infinite-slope tangent]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Vertical tangent marker }]
          tags: [tangent]
          drills: [{ id: vertical-drill, type: flashcard, prompt: 'State the component-rate condition for a vertical tangent.', answer: { expected: 'dx dt zero and dy dt nonzero', aliases: ['dx/dt=0, dy/dt not equal to 0'] }, explanation: 'Solution: dx/dt is zero and dy/dt is nonzero. Why it works: The slope quotient has nonzero numerator over zero denominator. Common trap: Reversing it with the horizontal condition.' }]
        - id: parametric-concavity
          term: Parametric second derivative
          definition: The rate of change of parametric slope with respect to x.
          notation: '$\frac{d^2y}{dx^2}=\frac{d(dy/dx)/dt}{dx/dt}$'
          examples: ['Positive values indicate concave up where the expression is defined.']
          aliases: [second derivative]
          media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Concavity change on a curve }]
          tags: [concavity]
          drills: [{ id: concavity-drill, type: cloze, prompt: 'After differentiating $dy/dx$ with respect to t, divide by ____ to get the second derivative.', answer: { expected: 'dx dt', aliases: ['dx/dt', 'x prime'] }, explanation: 'Solution: Divide by dx/dt. Why it works: The requested rate is per x, not per parameter. Common trap: Stopping with a derivative with respect to t.' }]
