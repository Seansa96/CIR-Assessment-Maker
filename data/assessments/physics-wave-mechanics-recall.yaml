items:
- {id: wave-r1, type: cloze, prompt: 'A positive-x wave can be $y=A\sin({{kx-\omega t+\phi}})$.', answer: {expected: 'kx-\omega t+\phi'}, explanation: 'Solution: Use $y=A\sin(kx-\omega t+\phi)$. Why it works: the argument decreases in time at fixed phase, moving the crest in the +x direction.'}
- {id: wave-r2, type: typed, prompt: 'What is the relation between wave number and wavelength?', answer: {expected: 'k = 2*pi / lambda'}, explanation: 'Solution: $k=2\pi/\lambda$. Why it works: it counts radians per unit length.'}
- {id: wave-r3, type: cloze, prompt: 'String wave speed is $v={{\sqrt{F_T/\mu}}}$.', answer: {expected: '\sqrt{F_T/\mu}'}, explanation: 'Solution: Use $v=\sqrt{F_T/\mu}$. Why it works: tension provides restoring force and linear density provides inertia.'}
- {id: wave-r4, type: typed, prompt: 'If tension quadruples, by what factor does string wave speed change?', answer: {expected: 2}, explanation: 'Solution: It doubles. Why it works: wave speed is proportional to square root of tension.'}
- {id: wave-r5, type: cloze, prompt: 'Linear density is $\mu={{m/L}}$.', answer: {expected: 'm/L'}, explanation: 'Solution: Use $\mu=m/L$. Why it works: it measures how much string mass must be accelerated per length.'}
- {id: wave-r6, type: typed, prompt: 'If linear density increases fourfold at fixed tension, what happens to wave speed?', answer: {expected: it halves}, explanation: 'Solution: It halves. Why it works: speed is inversely proportional to square root of linear density.'}
- {id: stand-r1, type: cloze, prompt: 'Fixed-string wavelengths are $\lambda_n={{2L/n}}$.', answer: {expected: '2L/n'}, explanation: 'Solution: Use $\lambda_n=2L/n$. Why it works: $n$ half-wavelengths fit in a string fixed at both ends.'}
- {id: stand-r2, type: typed, prompt: 'What condition occurs at both ends of a fixed string?', answer: {expected: node}, explanation: 'Solution: A node. Why it works: fixed ends cannot move.'}
- {id: stand-r3, type: cloze, prompt: 'Fixed-string frequencies are $f_n={{nv/(2L)}}$.', answer: {expected: 'nv/(2L)'}, explanation: 'Solution: Use $f_n=nv/(2L)$. Why it works: combine $v=f\lambda$ with allowed wavelengths.'}
- {id: stand-r4, type: typed, prompt: 'How many antinodes are in the third harmonic of a fixed string?', answer: {expected: 3}, explanation: 'Solution: Three. Why it works: harmonic number equals number of loops.'}
- {id: stand-r5, type: cloze, prompt: 'A standing wave forms from two equal waves traveling in {{opposite directions}}.', answer: {expected: opposite directions}, explanation: 'Solution: Identify opposite directions. Why it works: their superposition produces fixed interference locations.'}
- {id: stand-r6, type: typed, prompt: 'Does an ideal standing wave carry net energy along the string?', answer: {expected: no}, explanation: 'Solution: No. Why it works: equal opposite traveling-wave energy flows cancel.'}
