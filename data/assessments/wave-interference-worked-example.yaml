workedExamples:
- id: we-wave-interference
  title: Deriving and applying Interference of Waves
  problem: Use the labeled model to derive and calculate the resultant amplitude from $A_R=A_1+A_2$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Identify two speakers emitting sound waves in phase. An observer is at distance $x_1$ from Speaker 1 and $x_2$ from Speaker 2.
    prompt: Identify the paths.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Path lengths x_1 and x_2
    explanation: 'Solution: The waves travel different path lengths $x_1$ and $x_2$ to reach the observer.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the assumption regarding wave superposition.
    prompt: What principle applies?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Principle of superposition
    explanation: 'Solution: The principle of superposition applies, meaning displacements add linearly.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: 'Identify the target: calculate the phase difference $\Delta\phi$ to determine the type of interference.'
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Phase difference \Delta\phi
    explanation: 'Solution: We need to find $\Delta\phi$ to determine if the interference is constructive or destructive.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the relationship between path length difference $\Delta x$ and phase difference $\Delta\phi$.
    prompt: Write the phase relation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - \Delta\phi = (2\pi/\lambda) \Delta x
    explanation: 'Solution: $\Delta\phi = \frac{2\pi}{\lambda} \Delta x$ where $\Delta x = |x_2 - x_1|$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the path difference for fully destructive interference.
    prompt: When is interference destructive?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - \Delta x = (n + 0.5)\lambda
    explanation: 'Solution: Destructive interference requires $\Delta\phi = \pi, 3\pi \dots$, meaning $\Delta x = (n + 0.5)\lambda$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Given $\lambda = 2.0$ m, $x_1 = 5.0$ m, and $x_2 = 6.0$ m, calculate $\Delta\phi$ in radians.
    prompt: Calculate $\Delta\phi$.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      value: 3.14
      tolerance: 0.05
    explanation: 'Solution: $\Delta x = 1.0$ m. $\Delta\phi = \frac{2\pi}{2.0} (1.0) = \pi$ radians.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Interpret the result of $\Delta\phi = \pi$.
    prompt: What type of interference occurs?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Destructive interference
    explanation: 'Solution: A phase difference of an odd multiple of $\pi$ means the waves are perfectly out of phase, resulting in destructive interference.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the numerical phase difference.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/wave-interference.svg
      alt: Labeled original schematic for Interference of Waves used for quantitative analysis.
      caption: Interference of Waves model diagram.
    answer:
      value: 3.14
      tolerance: 0.05
    explanation: 'Solution: The phase difference is $\pi \approx 3.14$ radians.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
- id: constructive-interference-we002
  title: Constructive Interference of Two Pulses
  problem: Two upward pulses with amplitudes $0.20\ \text{m}$ and $0.35\ \text{m}$ overlap completely. Find their resultant amplitude.
  steps:
  - id: constructive-interference-we002-step-1
    title: Apply superposition
    type: symbolicResponse
    prompt: Write the resultant displacement in terms of the two pulse amplitudes.
    answer: {expectedLatex: 'A_R=A_1+A_2', equivalenceMode: expression, tolerance: 0}
    explanation: 'Solution: Write $A_R=A_1+A_2$. Why it works: wave displacements add algebraically during overlap.'
  - id: constructive-interference-we002-step-2
    title: Calculate the resultant
    type: numericResponse
    prompt: What is the resultant amplitude in meters?
    answer: {value: 0.55, tolerance: 0.001}
    explanation: 'Solution: $A_R=0.20+0.35=0.55\ \text{m}$. Why it works: both pulses have the same sign, so the interference is constructive.'
