questions:
  - id: eq-2x2-compute
    type: numericResponse
    prompt: |
      Compute $\det \begin{bmatrix} 7 & -2 \\ 3 & 5 \end{bmatrix}$.
    answer:
      value: 41
      tolerance: 0
    explanation: |
      $\det = (7)(5) - (-2)(3) = 35 + 6 = 41$.

  - id: eq-invertibility
    type: multipleChoice
    prompt: |
      Which of the following $2 \times 2$ matrices is **not invertible**?
    choices:
      - id: c1
        text: '$\begin{bmatrix} 1 & 2 \\ 3 & 5 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 4 & -2 \\ -6 & 3 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 3 & 0 \\ 0 & 2 \end{bmatrix}$'
    answer:
      choiceId: c2
    explanation: |
      $\det\begin{bmatrix}4&-2\\-6&3\end{bmatrix} = (4)(3) - (-2)(-6) = 12 - 12 = 0$. A zero determinant means the matrix is singular (not invertible). The rows are proportional: row 2 = $-\frac{3}{2}$ row 1.

  - id: eq-triangular-det
    type: numericResponse
    prompt: |
      Compute the determinant of the triangular matrix $\begin{bmatrix} 3 & -5 & 2 \\ 0 & -2 & 7 \\ 0 & 0 & 4 \end{bmatrix}$.
    answer:
      value: -24
      tolerance: 0
    explanation: |
      For a triangular matrix, $\det = $ product of diagonal entries $= 3 \times (-2) \times 4 = -24$.

  - id: eq-row-effect
    type: multipleChoice
    prompt: |
      Suppose $\det(A) = 5$. What is $\det(B)$ if $B$ is obtained from $A$ by first swapping two rows, then adding 3 times row 1 to row 2?
    choices:
      - id: c1
        text: '5'
      - id: c2
        text: '-5'
      - id: c3
        text: '15'
      - id: c4
        text: '-15'
    answer:
      choiceId: c2
    explanation: |
      **Row swap** multiplies the determinant by $-1$: $\det$ becomes $-5$. **Row replacement** (adding a multiple of one row to another) does **not** change the determinant. So the final determinant is $-5$.
