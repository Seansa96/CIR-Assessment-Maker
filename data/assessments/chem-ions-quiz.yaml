questions:
  - id: ion-q01
    title: Cation Formation
    type: multipleChoice
    prompt: |
      How does a neutral atom of magnesium (Mg) become a magnesium ion ($\text{Mg}^{2+}$)?
    choices:
      - id: a
        text: It loses two electrons.
      - id: b
        text: It gains two protons.
      - id: c
        text: It loses two protons.
      - id: d
        text: It gains two electrons.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Ions are formed by the loss or gain of **electrons**. The number of protons (which defines the element) never changes during ordinary chemical reactions. To get a $+2$ charge, the atom must lose two negatively charged electrons.

  - id: ion-q02
    title: Anion Formation and Naming
    type: multipleChoice
    prompt: |
      When a neutral chlorine atom gains an electron, what happens to its name and charge?
    choices:
      - id: a
        text: It becomes a chloride ion with a $-1$ charge.
      - id: b
        text: It becomes a chlorite ion with a $-1$ charge.
      - id: c
        text: It becomes a chlorine ion with a $+1$ charge.
      - id: d
        text: It becomes a chlorate ion with a $-1$ charge.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Nonmetals gain electrons to form anions. Monatomic anions are named by dropping the ending of the element's name and adding the suffix "-ide". Gaining one electron gives a $-1$ charge ($\text{Cl}^-$).

  - id: ion-q03
    title: Isoelectronic Series
    type: multipleChoice
    prompt: |
      Which of the following ions is **isoelectronic** (has the same number of electrons) with a noble gas?
    choices:
      - id: a
        text: $\text{K}^+$
      - id: b
        text: $\text{Fe}^{2+}$
      - id: c
        text: $\text{Zn}^{2+}$
      - id: d
        text: $\text{Ag}^+$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Potassium (K, atomic number 19) loses one electron to become $\text{K}^+$, which has 18 electrons. This is the exact same electron configuration as Argon (Ar, atomic number 18). Transition metals like Fe, Zn, and Ag typically do not form noble gas configurations when ionizing.

  - id: ion-q04
    title: Polyatomic Ion Recognition
    type: multipleChoice
    prompt: |
      Which of the following represents the sulfate ion?
    choices:
      - id: a
        text: $\text{SO}_4^{2-}$
      - id: b
        text: $\text{SO}_3^{2-}$
      - id: c
        text: $\text{S}^{2-}$
      - id: d
        text: $\text{HSO}_4^-$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** $\text{SO}_4^{2-}$ is sulfate. $\text{SO}_3^{2-}$ is sulfite. $\text{S}^{2-}$ is sulfide (monatomic). $\text{HSO}_4^-$ is hydrogen sulfate (bisulfate).

  - id: ion-q05
    title: Transition Metal Variable Charge
    type: multipleChoice
    prompt: |
      Why is Roman numeral notation (e.g., Iron(II) or Iron(III)) required when naming most transition metal compounds, but not for alkali metals?
    choices:
      - id: a
        text: Transition metals can form stable ions with different charges by losing a variable number of d-orbital electrons.
      - id: b
        text: Transition metals are heavier and require more specific naming conventions.
      - id: c
        text: Alkali metals do not form true ions.
      - id: d
        text: The Roman numeral indicates the number of atoms in the molecule, not the charge.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Alkali metals (Group 1) *always* form $+1$ ions, so their charge is understood. Transition metals (d-block) can often lose their s electrons and varying numbers of d electrons, allowing multiple possible oxidation states (like $\text{Fe}^{2+}$ and $\text{Fe}^{3+}$). The Roman numeral explicitly states the charge.

  - id: ion-q06
    title: Octet Rule Motivation
    type: multipleChoice
    prompt: |
      Oxygen (Group 16) typically forms a $-2$ ion ($\text{O}^{2-}$). According to the octet rule, why is this the most stable ion for oxygen?
    choices:
      - id: a
        text: By gaining two electrons, it achieves a full valence shell (8 electrons) like the nearest noble gas, Neon.
      - id: b
        text: Oxygen has 2 valence electrons and needs to lose them to be stable.
      - id: c
        text: Gaining two electrons balances its 8 protons to make the atom neutral.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Oxygen has 6 valence electrons ($2s^2 2p^4$). It needs 2 more to complete its octet ($2s^2 2p^6$), matching the stable noble gas configuration of Neon. Thus, it gains two electrons to form $\text{O}^{2-}$.

  - id: ion-q07
    title: Protons vs Electrons
    type: numericResponse
    prompt: |
      An ion of Aluminum ($\text{Al}^{3+}$) has an atomic number of 13. How many **electrons** does this ion contain?
    answer:
      value: 10
      tolerance: 0
    explanation: |
      A neutral aluminum atom has 13 protons and 13 electrons. The $3+$ charge means it has lost 3 electrons. $13 - 3 = 10$ electrons.

  - id: ion-q08
    title: Identifying the Ion from Particles
    type: multipleChoice
    prompt: |
      A particle contains 15 protons, 16 neutrons, and 18 electrons. What is the correct symbol and charge for this particle?
    choices:
      - id: a
        text: $\text{P}^{3-}$
      - id: b
        text: $\text{P}^{3+}$
      - id: c
        text: $\text{S}^{2-}$
      - id: d
        text: $\text{Ar}$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The number of protons (15) identifies the element as Phosphorus (P). The charge is $\text{Protons} - \text{Electrons} = 15 - 18 = -3$. Therefore, it is the phosphide ion, $\text{P}^{3-}$. (The neutrons just tell us the isotope is P-31).

  - id: ion-q09
    title: Cation Size vs Neutral Atom
    type: multipleChoice
    prompt: |
      How does the radius of a sodium ion ($\text{Na}^+$) compare to the radius of a neutral sodium atom ($\text{Na}$)?
    choices:
      - id: a
        text: The ion is significantly smaller than the neutral atom.
      - id: b
        text: The ion is significantly larger than the neutral atom.
      - id: c
        text: They are exactly the same size.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Cations are always smaller than their parent atoms. Sodium loses its entire outermost valence shell (the 3s electron) when it becomes $\text{Na}^+$. Furthermore, the remaining 10 electrons are pulled in more tightly by the 11 protons (higher effective nuclear charge).

  - id: ion-q10
    title: Ammonium Ion
    type: multipleChoice
    prompt: |
      Most polyatomic ions are anions (negatively charged). Which of the following is a common positively charged (cation) polyatomic ion?
    choices:
      - id: a
        text: Ammonium ($\text{NH}_4^+$)
      - id: b
        text: Nitrate ($\text{NO}_3^-$)
      - id: c
        text: Hydronium ($\text{H}_3\text{O}^+$)
      - id: d
        text: Both Ammonium and Hydronium
    answer:

      choiceId: d
    explanation: |
      **Instructor Notes:** Both Ammonium ($\text{NH}_4^+$) and Hydronium ($\text{H}_3\text{O}^+$) are positively charged polyatomic ions. Ammonium is frequently encountered in introductory chemistry forming ionic salts (like $\text{NH}_4\text{Cl}$).
