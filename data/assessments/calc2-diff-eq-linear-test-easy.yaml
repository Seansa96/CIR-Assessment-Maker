schemaVersion: 1
id: calc2-diff-eq-linear-test-easy
title: First-Order Linear Equations Test — Easy
assessmentType: test
categoryId: calculus-2
topicId: diff-eq-linear
modeDefault: practice
randomizeQuestions: true
skills: [write standard form, construct integrating factors, solve linear IVPs]
navigation: { learningGoal: evaluate, activityType: formalTest, tags: [calculus-2, first-order-linear, differential-equations] }
questions:
- id: q001
  type: symbolicResponse
  skills: [write standard form]
  prompt: Divide $3y'+6y=9x$ by 3. Enter $Q(x)$ in standard form.
  answer: { expectedLatex: '3x', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: Dividing every term by 3 gives $y'+2y=3x$. }
- id: q002
  type: symbolicResponse
  skills: [construct integrating factors]
  prompt: Enter an integrating factor for $y'+5y=10$.
  answer: { expectedLatex: 'e^(5x)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: The coefficient P is the constant 5. }
- id: q003
  type: symbolicResponse
  skills: [solve linear IVPs]
  prompt: Solve $y'+y=2$ with $y(0)=0$.
  answer: { expectedLatex: '2-2e^(-x)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: A constant particular solution is 2 and the initial difference is negative 2. }
- id: q004
  type: numericResponse
  skills: [solve linear IVPs]
  prompt: For $y'+y=2$, $y(0)=0$, find $y(\ln 2)$.
  answer: { value: 1, tolerance: 0.001 }
  explanation: Substitute $e^{-\ln2}=1/2$ into $y=2-2e^{-x}$.
- id: q005
  type: numericResponse
  skills: [model changing-volume mixtures]
  prompt: A tank starts with 80 gal; inflow is 5 gal/min and outflow is 2 gal/min. What is its volume after 10 min?
  answer: { value: 110, tolerance: 0.001 }
  explanation: Net volume gain is 3 gal/min.
