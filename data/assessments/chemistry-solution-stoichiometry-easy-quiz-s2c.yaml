questions:
  - { id: q001, type: multipleChoice, prompt: 'What quantity is obtained from (0.250 mol/L)(0.400 L)?', choices: [{ id: a, text: '0.100 mol' }, { id: b, text: '0.625 mol/L' }, { id: c, text: '0.100 L/mol' }, { id: d, text: '1.60 mol' }], answer: { choiceId: a }, explanation: 'Solution: (0.250 mol/L)(0.400 L)=0.100 mol. Why it works: Liters cancel, leaving moles. Why the other choices fail: b divides instead; c has inverted units; d reverses the multiplication.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Uses molarity conversion and unit cancellation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-MV-moles, variationAxes: { givens: molarity and volume, unknown: moles } }
  - { id: q002, type: multipleChoice, prompt: 'For Ag+(aq)+Cl−(aq)→AgCl(s), how many moles AgCl form from 0.0800 mol Ag+ with excess chloride?', choices: [{ id: a, text: '0.0800 mol' }, { id: b, text: '0.0400 mol' }, { id: c, text: '0.160 mol' }, { id: d, text: 'cannot be determined' }], answer: { choiceId: a }, explanation: 'Solution: 0.0800 mol AgCl forms. Why it works: The net ionic equation has a 1:1 mole ratio. Why the other choices fail: b and c change the coefficient; d ignores that chloride is explicitly excess.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Maps reactant moles through a 1:1 balanced equation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-one-to-one-yield, variationAxes: { scenario: precipitate yield, unknown: product moles } }
  - { id: q003, type: multipleChoice, prompt: 'What is the first quantitative step for a 35.0 mL solution of known molarity?', choices: [{ id: a, text: 'Convert 35.0 mL to liters, then use n = MV.' }, { id: b, text: 'Multiply by molar mass immediately.' }, { id: c, text: 'Use equation coefficients on milliliters.' }, { id: d, text: 'Find pH.' }], answer: { choiceId: a }, explanation: 'Solution: Convert volume to liters and calculate moles with n=MV. Why it works: Balanced equations compare moles, not milliliters. Why the other choices fail: b is premature; c uses the wrong quantity; d is unrelated.', difficultyDimensions: [modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Chooses the required first bridge in the mole map and rejects common unit misuse.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-first-step, variationAxes: { scenario: solution calculation, unknown: procedure choice } }
  - { id: q004, type: multipleChoice, prompt: 'For Ca2+(aq)+2OH−(aq)→Ca(OH)2(s), which reactant amount limits if 0.030 mol Ca2+ and 0.040 mol OH− are available?', choices: [{ id: a, text: 'OH−' }, { id: b, text: 'Ca2+' }, { id: c, text: 'neither; exactly stoichiometric' }, { id: d, text: 'water' }], answer: { choiceId: a }, explanation: 'Solution: OH− limits because 0.030 mol Ca2+ would require 0.060 mol OH−. Why it works: Compare actual OH− with the 2:1 requirement. Why the other choices fail: b ignores the coefficient; c needs 0.060 mol OH−; d is not a reactant here.', difficultyDimensions: [auxiliaryTechnique, casePartition], difficultyEvidence: 'Uses stoichiometric coefficient to identify the limiting branch.', prerequisiteObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-stoich-limiting-hydroxide, variationAxes: { scenario: limiting precipitation, unknown: limiting reactant } }
  - { id: q005, type: multipleChoice, prompt: 'Which mole ratio converts moles Ba2+ to moles BaSO4 in Ba2++SO4 2−→BaSO4(s)?', choices: [{ id: a, text: '1 mol BaSO4 / 1 mol Ba2+' }, { id: b, text: '2 mol BaSO4 / 1 mol Ba2+' }, { id: c, text: '1 mol Ba2+ / 2 mol BaSO4' }, { id: d, text: 'molar mass BaSO4 / molar mass Ba2+' }], answer: { choiceId: a }, explanation: 'Solution: Use 1 mol BaSO4 per 1 mol Ba2+. Why it works: Their coefficients are both one. Why the other choices fail: b and c invent coefficient changes; d is not a mole ratio from an equation.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Reads coefficients as a conversion factor.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-baso4-ratio, variationAxes: { representation: net equation to ratio, unknown: conversion factor } }
  - { id: q006, type: multipleChoice, prompt: '0.150 L of 0.200 M NaCl contains how many moles NaCl?', choices: [{ id: a, text: '0.0300 mol' }, { id: b, text: '0.750 mol' }, { id: c, text: '0.00133 mol' }, { id: d, text: '30.0 mol' }], answer: { choiceId: a }, explanation: 'Solution: n=MV=(0.200)(0.150)=0.0300 mol. Why it works: Molarity is mol per liter. Why the other choices fail: b divides; c inverts; d treats liters as milliliters.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Applies molarity and unit conversion representation.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-direct-moles, variationAxes: { givens: volume and M, unknown: solute moles } }
  - { id: q007, type: multipleChoice, prompt: 'After the limiting reactant is fully consumed, what remains of an excess reactant?', choices: [{ id: a, text: 'Some unreacted excess reactant' }, { id: b, text: 'No reactant at all' }, { id: c, text: 'Only the limiting reactant' }, { id: d, text: 'A larger coefficient' }], answer: { choiceId: a }, explanation: 'Solution: Some excess reactant remains. Why it works: The limiting reactant stops the reaction before all excess reactant can be used. Why the other choices fail: b and c reverse the definition; d is not a chemical amount.', difficultyDimensions: [modelOrDerivation, casePartition], difficultyEvidence: 'Relates limiting classification to post-reaction inventory.', prerequisiteObjectiveIds: [limiting-solution-reagent], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0458], reasoningSignature: easy-stoich-excess-remains, variationAxes: { scenario: limiting concept, unknown: remaining material } }
  - { id: q008, type: multipleChoice, prompt: 'Which conversion follows a mole map to find grams of precipitate from solution data?', choices: [{ id: a, text: 'mL → L → moles reactant → moles product → grams product' }, { id: b, text: 'mL → grams reactant → liters product' }, { id: c, text: 'molar mass → coefficients → mL' }, { id: d, text: 'pH → volume → mass' }], answer: { choiceId: a }, explanation: 'Solution: Use mL→L→moles reactant→moles product→grams product. Why it works: Molarity supplies moles and molar mass is applied only to the requested product. Why the other choices fail: They skip or scramble required unit bridges.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Selects ordered process chain and quantity representations.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-mole-map-order, variationAxes: { scenario: process planning, unknown: conversion sequence } }
  - { id: q009, type: freeResponse, prompt: 'Find moles of solute in 125.0 mL of 0.400 M solution.', answer: { gradingMode: selfCheck, keyPoints: ['0.1250 L', '0.0500 mol'] }, explanation: 'Solution: n=(0.400 mol/L)(0.1250 L)=0.0500 mol. Why it works: Convert mL to L before multiplying by molarity. Common trap: Reporting 50.0 mol.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Converts volume and applies molarity with units.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-volume-to-moles, variationAxes: { givens: mL and M, unknown: moles } }
  - { id: q010, type: freeResponse, prompt: 'For Ag+(aq)+Cl−(aq)→AgCl(s), find moles AgCl from 0.0150 mol Cl− with excess Ag+.', answer: { gradingMode: selfCheck, keyPoints: ['0.0150 mol AgCl', '1:1 ratio'] }, explanation: 'Solution: 0.0150 mol Cl− produces 0.0150 mol AgCl by the 1:1 equation. Why it works: The balanced coefficients relate moles directly. Common trap: Multiplying by chloride’s charge.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Applies a balanced net-ion mole ratio.', prerequisiteObjectiveIds: [solution-stoichiometry-mole-map], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0453], reasoningSignature: easy-stoich-agcl-from-chloride, variationAxes: { scenario: precipitate amount, unknown: product moles } }
