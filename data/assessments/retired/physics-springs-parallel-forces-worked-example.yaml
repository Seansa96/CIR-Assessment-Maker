navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [physics-1, physics-work-energy] }
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we-parallel-symbolic
    title: Load sharing in parallel
    problem: 'Two springs $k_1$ and $k_2$ support a load in parallel and extend by $x$.'
    steps:
      - id: pfs-1
        title: Common extension
        instruction: 'The springs share attachment points.'
        type: multipleChoice
        prompt: 'What extension does spring 1 have?'
        choices: [{ id: a, text: '$x_1=x$' }, { id: b, text: '$x_1=x/2$' }]
        answer: { choiceId: a }
        explanation: 'Solution: $x_1=x$.\n\nWhy it works: Parallel branches have the same endpoint displacement.\n\nWhy the other choices fail: The extension is not divided merely because there are two branches.'
      - id: pfs-2
        title: Individual force
        instruction: 'Apply Hooke''s law to spring 1.'
        type: symbolicResponse
        prompt: 'Write $F_1$. '
        answer: { gradingMode: auto, expectedLatex: 'k_1 x', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_1=k_1x$.\n\nWhy it works: Each spring''s force is its stiffness times the shared extension.'
  - id: we-parallel-numerical
    title: Numerical load split
    problem: 'Parallel springs have $k_1=100$ N/m and $k_2=300$ N/m and extend $0.20$ m. Find each force and the total.'
    steps:
      - id: pfn-1
        title: Force in first spring
        instruction: 'Use $F_1=k_1x$.'
        type: numericResponse
        prompt: 'What is $F_1$ in newtons?'
        answer: { value: 20, tolerance: 0.01 }
        explanation: 'Solution: $F_1=(100)(0.20)=20$ N.\n\nWhy it works: The first spring has the common extension.'
      - id: pfn-2
        title: Sum branch forces
        instruction: 'Calculate the second branch and add.'
        type: numericResponse
        prompt: 'What total force supports the extension, in newtons?'
        answer: { value: 80, tolerance: 0.01 }
        explanation: 'Solution: $F_2=(300)(0.20)=60$ N and $F_{total}=20+60=80$ N.\n\nWhy it works: Parallel spring forces add at the shared attachment.'
