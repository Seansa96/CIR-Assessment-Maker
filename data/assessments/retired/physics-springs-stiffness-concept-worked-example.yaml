workedExamples:
  - id: we-stiffness-parallel
    title: Two identical parallel springs
    problem: 'Two springs of stiffness $k$ are connected in parallel. Compare their equivalent stiffness with one spring.'
    steps:
      - id: stp-1
        title: Add parallel forces
        instruction: 'Each spring extends by $x$.'
        type: symbolicResponse
        prompt: 'Write the total restoring-force magnitude.'
        answer: { gradingMode: auto, expectedLatex: '2 k x', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_{total}=kx+kx=2kx$.\n\nWhy it works: Parallel branches have equal extension and their forces add.'
      - id: stp-2
        title: Identify stiffness
        instruction: 'Match the force to $k_{eq}x$.'
        type: symbolicResponse
        prompt: 'What is $k_{eq}$?'
        answer: { gradingMode: auto, expectedLatex: '2 k', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $k_{eq}=2k$.\n\nWhy it works: Twice the force is required for the same extension, so the combination is stiffer.'
  - id: we-stiffness-series
    title: Two identical series springs
    problem: 'Two springs of stiffness $k$ are connected in series. Compare their equivalent stiffness with one spring.'
    steps:
      - id: sts-1
        title: Add series extensions
        instruction: 'Each spring carries a common force $F$.'
        type: symbolicResponse
        prompt: 'Write the total extension.'
        answer: { gradingMode: auto, expectedLatex: '2 F/k', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $x_{total}=F/k+F/k=2F/k$.\n\nWhy it works: Series extensions add under the same force.'
      - id: sts-2
        title: Identify stiffness
        instruction: 'Use $F=k_{eq}x_{total}$.'
        type: symbolicResponse
        prompt: 'What is $k_{eq}$?'
        answer: { gradingMode: auto, expectedLatex: 'k/2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $k_{eq}=k/2$.\n\nWhy it works: The same force produces twice the extension, making the series combination softer.'
