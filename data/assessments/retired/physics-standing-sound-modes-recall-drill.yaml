items:
- {id: modes-r1, type: cloze, prompt: 'Open-open tube frequencies are $f_n={{nv/(2L)}}$.', answer: {expected: 'nv/(2L)'}, explanation: 'Solution: Use $f_n=nv/(2L)$. Why it works: integer half-wavelengths fit between two open ends.'}
- {id: modes-r2, type: typed, prompt: 'What displacement feature is at a closed end?', answer: {expected: node}, explanation: 'Solution: A node. Why it works: air cannot move at the closed boundary.'}
- {id: modes-r3, type: cloze, prompt: 'A closed-open tube permits only {{odd}} harmonics.', answer: {expected: odd}, explanation: 'Solution: Identify odd. Why it works: it must fit a node at one end and antinode at the other.'}
- {id: modes-r4, type: typed, prompt: 'What is the fundamental frequency of a closed-open tube?', answer: {expected: 'v/(4L)'}, explanation: 'Solution: Use $v/(4L)$. Why it works: the fundamental contains one quarter wavelength.'}
- {id: modes-r5, type: cloze, prompt: 'An open end is a pressure {{node}}.', answer: {expected: node}, explanation: 'Solution: Identify pressure node. Why it works: its gauge pressure stays at atmospheric pressure.'}
- {id: modes-r6, type: typed, prompt: 'In an open-open tube, the first overtone is which harmonic?', answer: {expected: second harmonic}, explanation: 'Solution: Second harmonic. Why it works: all integer harmonics are allowed.'}
