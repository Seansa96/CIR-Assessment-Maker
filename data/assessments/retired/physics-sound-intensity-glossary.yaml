    - {id: inverse-square, term: inverse-square law, definition: 'For an isotropic point source, intensity is proportional to $1/r^2$.', drills: [{id: inverse-square-drill, type: cloze, prompt: 'Point-source intensity follows an {{inverse-square law}}.', answer: {expected: inverse-square law}}]}
