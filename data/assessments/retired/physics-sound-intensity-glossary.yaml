    entries:
    - {id: intensity, term: intensity, definition: 'Power transported per unit area, in $\text{W/m}^2$.', drills: [{id: intensity-drill, type: typed, prompt: 'What quantity has units W per square meter?', answer: {expected: intensity}}]}
    - {id: intensity-level, term: intensity level, definition: 'The decibel value $\beta=10\log_{10}(I/I_0)$.', drills: [{id: intensity-level-drill, type: cloze, prompt: 'Sound intensity level is measured in {{decibels}}.', answer: {expected: decibels}}]}
