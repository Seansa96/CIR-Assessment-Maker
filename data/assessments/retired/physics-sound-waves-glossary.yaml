glossary:
  introduction: Core terminology for sound as a longitudinal mechanical wave.
  sections:
  - id: sound-wave-terms
    title: Core terms
    entries:
    - {id: compression, term: compression, definition: 'A region of increased pressure and density in a longitudinal wave.', drills: [{id: compression-drill, type: typed, prompt: 'What high-pressure region occurs in a longitudinal sound wave?', answer: {expected: compression}}]}
    - {id: rarefaction, term: rarefaction, definition: 'A region of decreased pressure and density in a longitudinal wave.', drills: [{id: rarefaction-drill, type: cloze, prompt: 'A low-pressure region is a {{rarefaction}}.', answer: {expected: rarefaction}}]}
    - {id: longitudinal, term: longitudinal wave, definition: 'A wave whose material displacement is parallel to propagation.', drills: [{id: longitudinal-drill, type: typed, prompt: 'What type of wave has displacement parallel to travel?', answer: {expected: longitudinal wave}}]}
    - {id: wavelength, term: wavelength, definition: 'Spatial repetition distance; with speed and frequency it obeys $v=f\lambda$.', drills: [{id: wavelength-drill, type: cloze, prompt: 'Wave relation is $v=f{{\lambda}}$.', answer: {expected: '\lambda'}}]}
