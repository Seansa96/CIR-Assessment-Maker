items:
- {id: shme-r1, type: cloze, prompt: 'Total ideal-SHM energy is $E={{\frac12kA^2}}$.', answer: {expected: '\frac12kA^2'}, explanation: 'Solution: Use $E=\frac12kA^2$. Why it works: all energy is spring potential energy at amplitude.'}
- {id: shme-r2, type: typed, prompt: 'Where is potential energy maximum in SHM?', answer: {expected: turning points}, explanation: 'Solution: At turning points. Why it works: displacement magnitude is maximum there.'}
- {id: shme-r3, type: cloze, prompt: 'At equilibrium, ideal-SHM energy is entirely {{kinetic}}.', answer: {expected: kinetic}, explanation: 'Solution: Identify kinetic energy. Why it works: $x=0$ makes spring potential energy zero.'}
- {id: shme-r4, type: typed, prompt: 'If amplitude doubles, by what factor does total energy change?', answer: {expected: 4}, explanation: 'Solution: It increases by four. Why it works: energy is proportional to $A^2$.'}
- {id: shme-r5, type: cloze, prompt: 'The identity used to prove SHM energy conservation is $\sin^2\theta+\cos^2\theta={{1}}$.', answer: {expected: '1'}, explanation: 'Solution: Use one. Why it works: the time-dependent energy factors sum to a constant.'}
- {id: shme-r6, type: typed, prompt: 'What is the SI unit of energy?', answer: {expected: joule}, explanation: 'Solution: Use joule. Why it works: both kinetic and elastic potential energy have joule units.'}
