title: Spring Energy and Gravity
assessmentType: workedExample
categoryId: physics-1
topicId: physics-work-energy
skills: [Apply Work and Kinetic Energy, physics-work-energy, spring-energy, conservation-of-energy]
navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [physics-1, physics-work-energy] }
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we-spring-gravity-symbolic
    title: Spring launch height
    problem: 'A vertical spring of stiffness $k$ is compressed by $d$ under a mass $m$, then releases the mass upward. Derive its maximum height above the initially compressed position.'
    steps:
      - id: sgs-1
        title: Initial energy
        instruction: 'Choose gravitational potential energy zero at the initially compressed position.'
        type: symbolicResponse
        prompt: 'What is the initial mechanical energy?'
        answer: { gradingMode: auto, expectedLatex: 'k d^2/2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $E_i=\tfrac12kd^2$.\n\nWhy it works: The system starts at rest and energy is initially stored in the compressed spring.'
      - id: sgs-2
        title: Maximum-height energy
        instruction: 'At maximum height the block is momentarily at rest and detached from the spring.'
        type: symbolicResponse
        prompt: 'Write the final energy.'
        answer: { gradingMode: auto, expectedLatex: 'm g h', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $E_f=mgh$.\n\nWhy it works: Kinetic and spring potential energies are both zero at the top.'
      - id: sgs-3
        title: Solve for height
        instruction: 'Conserve mechanical energy.'
        type: symbolicResponse
        prompt: 'Write $h$.'
        answer: { gradingMode: auto, expectedLatex: 'k d^2/(2m g)', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $\tfrac12kd^2=mgh$, so $h=kd^2/(2mg)$.\n\nWhy it works: With no nonconservative work, initial and final mechanical energies are equal.'
  - id: we-spring-gravity-numerical
    title: Numerical spring launch
    problem: 'A $0.20$ kg block is launched by a spring with $k=200$ N/m compressed $0.10$ m. Ignore air resistance and use $g=9.8$ m/s$^2$. Find the maximum height above the initial compressed position.'
    steps:
      - id: sgn-1
        title: Calculate spring energy
        instruction: 'Evaluate $\tfrac12kd^2$.'
        type: numericResponse
        prompt: 'What initial spring energy is stored, in joules?'
        answer: { value: 1, tolerance: 0.01 }
        explanation: 'Solution: $\tfrac12(200)(0.10)^2=1.0$ J.\n\nWhy it works: Spring energy depends on stiffness times compression squared.'
      - id: sgn-2
        title: Convert energy to height
        instruction: 'Set the spring energy equal to gravitational potential energy.'
        type: numericResponse
        prompt: 'What maximum height is reached, in meters?'
        answer: { value: 0.510204, tolerance: 0.001 }
        explanation: 'Solution: $h=1.0/[(0.20)(9.8)]=0.510$ m.\n\nWhy it works: At the top, all initial spring energy has become gravitational potential energy.'
