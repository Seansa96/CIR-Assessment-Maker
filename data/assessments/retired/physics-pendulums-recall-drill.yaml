items:
- {id: pend-r1, type: cloze, prompt: 'For small angles, a simple pendulum has $T={{2\pi\sqrt{L/g}}}$.', answer: {expected: '2\pi\sqrt{L/g}'}, explanation: 'Solution: Use $T=2\pi\sqrt{L/g}$. Why it works: the small-angle restoring force produces SHM.'}
- {id: pend-r2, type: typed, prompt: 'Does simple-pendulum period depend on bob mass?', answer: {expected: no}, explanation: 'Solution: No. Why it works: mass cancels when the effective spring constant is substituted into the SHM period.'}
- {id: pend-r3, type: cloze, prompt: 'The approximation that makes pendulum motion SHM is $\sin\theta\approx{{\theta}}$.', answer: {expected: '\theta'}, explanation: 'Solution: Use $\sin\theta\approx\theta$. Why it works: it linearizes the restoring force for small angles.'}
- {id: pend-r4, type: typed, prompt: 'If pendulum length increases, does period increase or decrease?', answer: {expected: increase}, explanation: 'Solution: It increases. Why it works: $T$ is proportional to $\sqrt L$.'}
- {id: pend-r5, type: cloze, prompt: 'Higher gravity makes pendulum period {{shorter}}.', answer: {expected: shorter}, explanation: 'Solution: Identify shorter. Why it works: $T$ is inversely proportional to $\sqrt g$.'}
- {id: pend-r6, type: typed, prompt: 'What quantity replaces mass in the period formula for a physical pendulum?', answer: {expected: moment of inertia}, explanation: 'Solution: Use moment of inertia. Why it works: rotational inertia governs the angular acceleration of a rigid body.'}
