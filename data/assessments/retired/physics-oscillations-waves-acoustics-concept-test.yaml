schemaVersion: 1
id: physics-oscillations-waves-acoustics-concept-test
title: Oscillations, Waves, and Acoustics Concept Test
assessmentType: test
categoryId: physics-1
topicId: physics-comprehensive-review
modeDefault: evaluate
randomizeQuestions: true
questions:
  - id: owa-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Defining condition for Simple Harmonic Motion."
    prerequisiteObjectiveIds: [physics-simple-harmonic-motion]
    extensionObjectiveIds: [physics-simple-harmonic-motion]
    prompt: |
      What is the defining characteristic of the restoring force in Simple Harmonic Motion (SHM)?
    choices:
      - id: a
        issueSignals:
          - id: hookes-law-sign-error
        text: 'It is constant in magnitude and direction.'
      - id: b
        issueSignals:
          - id: hookes-law-sign-error
        text: 'It is proportional to the square of the displacement.'
      - id: c
        text: 'It is directly proportional to the displacement and oppositely directed.'
      - id: d
        issueSignals:
          - id: hookes-law-sign-error
        text: 'It is inversely proportional to the displacement.'
    answer:
      choiceId: c
    explanation: |
        Solution: Hooke's Law is the defining condition for SHM: $F = -kx$.
        
        Why it works: The restoring force must increase linearly with displacement ($x$) and must point back toward the equilibrium position (the negative sign).
        
        Why the other choices fail: A constant force produces uniform acceleration, not oscillation. $x^2$ or $1/x$ dependencies result in anharmonic (non-simple) oscillations.

  - id: owa-q02
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Acceleration at maximum displacement."
    prerequisiteObjectiveIds: [physics-simple-harmonic-motion]
    extensionObjectiveIds: [physics-simple-harmonic-motion]
    prompt: |
      In Simple Harmonic Motion, when the oscillating mass is at its maximum displacement (amplitude), what are its velocity and acceleration?
    choices:
      - id: a
        text: 'Velocity is zero; acceleration is maximum.'
      - id: b
        issueSignals:
          - id: shm-energy-position-error
        text: 'Velocity is maximum; acceleration is zero.'
      - id: c
        issueSignals:
          - id: shm-energy-position-error
        text: 'Both velocity and acceleration are zero.'
      - id: d
        issueSignals:
          - id: shm-energy-position-error
        text: 'Both velocity and acceleration are maximum.'
    answer:
      choiceId: a
    explanation: |
        Solution: At the turnaround point (amplitude), the mass instantaneously stops.
        
        Why it works: Because it stops to change direction, velocity is zero. However, the spring is maximally stretched/compressed, so the restoring force ($F=-kx$) is at its maximum. Therefore, by Newton's Second Law, acceleration is also at its maximum.
        
        Why the other choices fail: Velocity is maximum at equilibrium. Acceleration is zero at equilibrium. They are out of phase by 90 degrees.

  - id: owa-q03
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Energy transformations in SHM."
    prerequisiteObjectiveIds: [physics-shm-energy]
    extensionObjectiveIds: [physics-shm-energy]
    prompt: |
      For an ideal horizontal mass-spring system in Simple Harmonic Motion, where is the kinetic energy of the mass equal to the potential energy of the spring?
    choices:
      - id: a
        issueSignals:
          - id: shm-energy-position-error
        text: 'At the equilibrium position.'
      - id: b
        issueSignals:
          - id: shm-energy-position-error
        text: 'At the maximum displacement (amplitude).'
      - id: c
        issueSignals:
          - id: shm-energy-position-error
        text: 'At a displacement equal to half the amplitude ($A/2$).'
      - id: d
        text: 'At a displacement equal to $A/\sqrt{2}$.'
    answer:
      choiceId: d
    explanation: |
        Solution: Total energy is $E = \frac{1}{2}kA^2$. We want to find $x$ where $K = U = E/2$.
        
        Why it works: $U = \frac{1}{2}kx^2 = \frac{1}{2} (\frac{1}{2}kA^2) \implies x^2 = A^2/2 \implies x = A/\sqrt{2} \approx 0.707A$.
        
        Why the other choices fail: At equilibrium ($x=0$), $U=0$. At amplitude ($x=A$), $K=0$. At $x=A/2$, $U$ is only one-quarter of the total energy ($1/4$), so $K$ is three-quarters.

  - id: owa-q04
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Pendulum period dependencies."
    prerequisiteObjectiveIds: [physics-pendulums]
    extensionObjectiveIds: [physics-pendulums]
    prompt: |
      If you take a simple pendulum to the Moon, where gravity is much weaker than on Earth, what happens to its period of oscillation?
    choices:
      - id: a
        text: 'The period increases.'
      - id: b
        issueSignals:
          - id: shm-period-frequency-confusion
        text: 'The period decreases.'
      - id: c
        issueSignals:
          - id: shm-period-frequency-confusion
        text: 'The period remains the same.'
      - id: d
        issueSignals:
          - id: shm-period-frequency-confusion
        text: 'It will not oscillate at all.'
    answer:
      choiceId: a
    explanation: |
        Solution: The period of a simple pendulum is $T = 2\pi \sqrt{L/g}$.
        
        Why it works: The period $T$ is inversely proportional to the square root of $g$. Since $g$ is smaller on the Moon, $T$ becomes larger (it swings more slowly).
        
        Why the other choices fail: Decreasing the restoring force (gravity) makes the oscillation more sluggish, increasing the time for one cycle.

  - id: owa-q05
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Damped vs Forced oscillations."
    prerequisiteObjectiveIds: [physics-damped-oscillations]
    extensionObjectiveIds: [physics-forced-oscillations]
    prompt: |
      What physical mechanism causes the amplitude of a damped oscillator to decrease over time?
    choices:
      - id: a
        issueSignals:
          - id: damping-force-concept-error
        text: 'The restoring force weakens as the spring ages.'
      - id: b
        text: 'A non-conservative force, like friction or air drag, dissipates mechanical energy.'
      - id: c
        issueSignals:
          - id: damping-force-concept-error
        text: 'The driving frequency does not match the natural frequency.'
      - id: d
        issueSignals:
          - id: damping-force-concept-error
        text: 'The mass of the oscillator gradually increases.'
    answer:
      choiceId: b
    explanation: |
        Solution: Damping is the loss of mechanical energy from the oscillating system.
        
        Why it works: Non-conservative forces (friction, drag) do negative work on the system, converting mechanical energy into thermal energy. Since energy $E \propto A^2$, a loss in energy means a loss in amplitude.
        
        Why the other choices fail: A weakening spring changes the period but not the energy natively. Driving frequency relates to forced oscillations. Mass doesn't spontaneously change.

  - id: owa-q06
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Resonance conceptualization."
    prerequisiteObjectiveIds: [physics-forced-oscillations]
    extensionObjectiveIds: [physics-forced-oscillations]
    prompt: |
      Resonance occurs in a forced oscillating system when:
    choices:
      - id: a
        issueSignals:
          - id: resonance-condition-error
        text: 'The driving force is removed completely.'
      - id: b
        text: 'The driving frequency matches the natural frequency of the system.'
      - id: c
        issueSignals:
          - id: resonance-condition-error
        text: 'The damping force is maximized.'
      - id: d
        issueSignals:
          - id: resonance-condition-error
        text: 'The mass of the system equals the spring constant.'
    answer:
      choiceId: b
    explanation: |
        Solution: Resonance is the phenomenon of maximum energy transfer to an oscillator.
        
        Why it works: When the external driving force pushes at exactly the frequency the system "wants" to oscillate at (its natural frequency), the pushes perfectly align with the velocity, doing maximum positive work and driving the amplitude very high.
        
        Why the other choices fail: Removing the force causes standard damped oscillation. Maximizing damping prevents resonance (overdamping). Mass equaling spring constant just means $\omega = 1$ rad/s.

  - id: owa-q07
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Wave speed independence."
    prerequisiteObjectiveIds: [physics-traveling-waves]
    extensionObjectiveIds: [physics-traveling-waves]
    prompt: |
      For a mechanical wave traveling through a uniform medium, the speed of the wave is determined primarily by:
    choices:
      - id: a
        issueSignals:
          - id: wave-speed-medium-dependence-error
        text: 'The frequency of the wave source.'
      - id: b
        issueSignals:
          - id: wave-speed-medium-dependence-error
        text: 'The amplitude of the wave.'
      - id: c
        issueSignals:
          - id: wave-speed-medium-dependence-error
        text: 'The wavelength of the wave.'
      - id: d
        text: 'The physical properties of the medium.'
    answer:
      choiceId: d
    explanation: |
        Solution: Wave speed is a property of the medium, not the source.
        
        Why it works: For example, the speed of sound depends on the temperature and density of air. The speed of a wave on a string depends on tension and linear mass density ($v = \sqrt{T/\mu}$).
        
        Why the other choices fail: Frequency is determined by the source. If frequency increases, wavelength decreases to keep $v = f\lambda$ constant. Amplitude affects energy, not speed (for linear waves).

  - id: owa-q08
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Transverse vs Longitudinal wave motion."
    prerequisiteObjectiveIds: [physics-traveling-waves]
    extensionObjectiveIds: [physics-sound-waves]
    prompt: |
      In a longitudinal wave, how do the particles of the medium move relative to the direction of wave propagation?
    choices:
      - id: a
        issueSignals:
          - id: wave-particle-motion-direction-error
        text: 'Perpendicular to the wave propagation.'
      - id: b
        text: 'Parallel to the wave propagation.'
      - id: c
        issueSignals:
          - id: wave-particle-motion-direction-error
        text: 'In circular paths.'
      - id: d
        issueSignals:
          - id: wave-particle-motion-direction-error
        text: 'They do not move at all.'
    answer:
      choiceId: b
    explanation: |
        Solution: The definition of a longitudinal wave (like sound).
        
        Why it works: "Longitudinal" means along the length. The particles oscillate back and forth along the same axis that the wave travels, creating compressions and rarefactions.
        
        Why the other choices fail: Perpendicular motion defines a transverse wave (like a wave on a string). Circular motion happens in surface water waves.

  - id: owa-q09
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Interference types."
    prerequisiteObjectiveIds: [physics-wave-interference]
    extensionObjectiveIds: [physics-wave-interference]
    prompt: |
      When two wave pulses traveling in opposite directions meet and briefly form a wave with a larger amplitude than either individual pulse, this is an example of:
    choices:
      - id: a
        issueSignals:
          - id: wave-superposition-error
        text: 'Destructive interference.'
      - id: b
        text: 'Constructive interference.'
      - id: c
        issueSignals:
          - id: wave-superposition-error
        text: 'Refraction.'
      - id: d
        issueSignals:
          - id: wave-superposition-error
        text: 'Diffraction.'
    answer:
      choiceId: b
    explanation: |
        Solution: The principle of superposition governs overlapping waves.
        
        Why it works: When two positive displacements meet, their amplitudes add together ($y = y_1 + y_2$) to create a larger peak. This addition is called constructive interference.
        
        Why the other choices fail: Destructive interference occurs when a positive and a negative displacement cancel each other out. Refraction and diffraction relate to bending waves, not overlapping them.

  - id: owa-q10
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Standing wave nodes."
    prerequisiteObjectiveIds: [physics-standing-waves-resonance]
    extensionObjectiveIds: [physics-standing-waves-resonance]
    prompt: |
      In a standing wave, what is a node?
    choices:
      - id: a
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'A point that undergoes maximum displacement.'
      - id: b
        text: 'A point that remains completely stationary.'
      - id: c
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'The distance between two adjacent peaks.'
      - id: d
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'The time it takes for one complete cycle.'
    answer:
      choiceId: b
    explanation: |
        Solution: Standing waves are formed by the interference of two traveling waves moving in opposite directions.
        
        Why it works: At certain locations, the two traveling waves always perfectly destructively interfere, resulting in zero displacement at all times. These stationary points are called nodes.
        
        Why the other choices fail: Points of maximum displacement are antinodes. Distance between peaks is wavelength. Time for a cycle is period.

  - id: owa-q11
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Boundary conditions for string harmonics."
    prerequisiteObjectiveIds: [physics-standing-waves-resonance]
    extensionObjectiveIds: [physics-standing-waves-resonance]
    prompt: |
      A guitar string is fixed at both ends. Which of the following best describes the boundary conditions and the fundamental standing wave?
    choices:
      - id: a
        text: 'Nodes at both ends, with one antinode in the middle.'
      - id: b
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'Antinodes at both ends, with one node in the middle.'
      - id: c
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'A node at one end and an antinode at the other.'
      - id: d
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'No nodes exist in the fundamental mode.'
    answer:
      choiceId: a
    explanation: |
        Solution: A "fixed" end cannot move, so it must be a node.
        
        Why it works: Because both ends are fixed, they must both be nodes. The simplest wave (fundamental) that fits between two nodes has exactly one antinode (a single "belly") in the middle, corresponding to $L = \lambda/2$.
        
        Why the other choices fail: Antinodes at ends happen for open pipes. Node at one end happens for a string fixed at one end and free at the other (or a pipe closed at one end).

  - id: owa-q12
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Sound as a pressure wave."
    prerequisiteObjectiveIds: [physics-sound-waves]
    extensionObjectiveIds: [physics-sound-waves]
    prompt: |
      Sound waves in air are characterized by alternating regions of:
    choices:
      - id: a
        issueSignals:
          - id: longitudinal-wave-compression-error
        text: 'High and low temperature.'
      - id: b
        text: 'High and low pressure.'
      - id: c
        issueSignals:
          - id: longitudinal-wave-compression-error
        text: 'High and low transverse displacement.'
      - id: d
        issueSignals:
          - id: longitudinal-wave-compression-error
        text: 'High and low electric field strength.'
    answer:
      choiceId: b
    explanation: |
        Solution: Sound in a gas is a longitudinal mechanical wave.
        
        Why it works: As particles oscillate back and forth, they bunch up (compressions/high pressure) and spread out (rarefactions/low pressure).
        
        Why the other choices fail: Temperature fluctuations are a tiny side effect, not the primary characterization. Transverse displacement doesn't occur in fluids. Electric fields are for electromagnetic waves (light).

  - id: owa-q13
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Speed of sound dependencies."
    prerequisiteObjectiveIds: [physics-speed-of-sound]
    extensionObjectiveIds: [physics-speed-of-sound]
    prompt: |
      Generally speaking, how does the speed of sound compare across different states of matter?
    choices:
      - id: a
        issueSignals:
          - id: sound-speed-medium-error
        text: 'It is fastest in gases, slower in liquids, and slowest in solids.'
      - id: b
        text: 'It is fastest in solids, slower in liquids, and slowest in gases.'
      - id: c
        issueSignals:
          - id: sound-speed-medium-error
        text: 'It is exactly the same in all states of matter.'
      - id: d
        issueSignals:
          - id: sound-speed-medium-error
        text: 'It is fastest in a vacuum.'
    answer:
      choiceId: b
    explanation: |
        Solution: The speed of sound depends on the bulk modulus (stiffness) and density of the medium ($v = \sqrt{B/\rho}$).
        
        Why it works: Solids are vastly stiffer than liquids, and liquids are much stiffer than gases. This massive increase in the restoring force (stiffness) outweighs the increase in density, making sound travel fastest in solids (e.g., steel ~5000 m/s) and slowest in gases (e.g., air ~340 m/s).
        
        Why the other choices fail: Sound cannot travel in a vacuum at all because there are no particles to oscillate.

  - id: owa-q14
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Decibel scale intuition."
    prerequisiteObjectiveIds: [physics-sound-intensity]
    extensionObjectiveIds: [physics-sound-intensity]
    prompt: |
      If the intensity of a sound wave is increased by a factor of 10, how does the sound intensity level (in decibels, dB) change?
    choices:
      - id: a
        text: 'It increases by 10 dB.'
      - id: b
        issueSignals:
          - id: sound-intensity-level-error
        text: 'It increases by a factor of 10.'
      - id: c
        issueSignals:
          - id: sound-intensity-level-error
        text: 'It increases by 1 dB.'
      - id: d
        issueSignals:
          - id: sound-intensity-level-error
        text: 'It doubles.'
    answer:
      choiceId: a
    explanation: |
        Solution: The decibel scale is logarithmic: $\beta = 10 \log_{10}(I/I_0)$.
        
        Why it works: If $I_{new} = 10 I_{old}$, then $\beta_{new} = 10 \log_{10}(10 I_{old}/I_0) = 10 (\log_{10}(10) + \log_{10}(I_{old}/I_0)) = 10(1) + \beta_{old} = \beta_{old} + 10$. A factor of 10 in intensity is an *addition* of 10 dB.
        
        Why the other choices fail: The dB scale adds when intensity multiplies. Multiplying by 100 adds 20 dB, multiplying by 1000 adds 30 dB, etc.

  - id: owa-q15
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Open vs closed pipe harmonics."
    prerequisiteObjectiveIds: [physics-standing-sound-modes]
    extensionObjectiveIds: [physics-standing-sound-modes]
    prompt: |
      An organ pipe is open at both ends. What types of harmonics (overtones) can it produce?
    choices:
      - id: a
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'Only odd harmonics (1st, 3rd, 5th...)'
      - id: b
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'Only even harmonics (2nd, 4th, 6th...)'
      - id: c
        text: 'All integer harmonics (1st, 2nd, 3rd, 4th...)'
      - id: d
        issueSignals:
          - id: standing-wave-harmonic-misidentified
        text: 'No harmonics, only the fundamental frequency.'
    answer:
      choiceId: c
    explanation: |
        Solution: An open-open pipe has antinodes at both ends.
        
        Why it works: The boundary conditions are identical at both ends (antinode-antinode). This symmetry allows half-wavelengths ($\lambda/2$) to fit perfectly into the pipe for every integer multiple, supporting all harmonics: $f_n = n(v/2L)$ for $n=1,2,3...$
        
        Why the other choices fail: An open-closed pipe (asymmetric) produces only odd harmonics because it must fit quarter-wavelengths.

  - id: owa-q16
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Beats phenomenon."
    prerequisiteObjectiveIds: [physics-beats]
    extensionObjectiveIds: [physics-beats]
    prompt: |
      You strike two tuning forks simultaneously. One has a frequency of 440 Hz and the other has a frequency of 444 Hz. What do you hear?
    choices:
      - id: a
        issueSignals:
          - id: shm-period-frequency-confusion
        text: 'A steady tone at 884 Hz.'
      - id: b
        text: 'A tone of 442 Hz that pulses in loudness 4 times per second.'
      - id: c
        issueSignals:
          - id: shm-period-frequency-confusion
        text: 'A tone of 442 Hz that pulses in loudness 884 times per second.'
      - id: d
        issueSignals:
          - id: shm-period-frequency-confusion
        text: 'Two distinct, steady tones of 440 Hz and 444 Hz.'
    answer:
      choiceId: b
    explanation: |
        Solution: Superposition of two closely spaced frequencies produces beats.
        
        Why it works: The perceived pitch is the average of the two frequencies: $(440+444)/2 = 442$ Hz. The interference alternates between constructive and destructive, creating a beat frequency equal to the difference: $|444 - 440| = 4$ Hz (4 pulses per second).
        
        Why the other choices fail: Human hearing fuses closely spaced tones into a single pulsing tone (beats) rather than hearing two distinct tones or their sum.

  - id: owa-q17
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Doppler effect conceptualization."
    prerequisiteObjectiveIds: [physics-doppler-effect]
    extensionObjectiveIds: [physics-doppler-effect]
    prompt: |
      An ambulance with its siren blaring is driving rapidly away from a stationary observer. How does the sound heard by the observer compare to the sound heard by the ambulance driver?
    choices:
      - id: a
        issueSignals:
          - id: doppler-effect-sign-error
        text: 'The observer hears a higher pitch (higher frequency).'
      - id: b
        text: 'The observer hears a lower pitch (lower frequency).'
      - id: c
        issueSignals:
          - id: doppler-effect-sign-error
        text: 'The observer hears the exact same pitch.'
      - id: d
        issueSignals:
          - id: doppler-effect-sign-error
        text: 'The observer hears a slower wave speed.'
    answer:
      choiceId: b
    explanation: |
        Solution: The Doppler Effect shifts frequency when there is relative motion.
        
        Why it works: Because the source is moving away, the sound waves are stretched out relative to the stationary observer. A longer wavelength $\lambda$ at a constant wave speed $v$ results in a lower frequency ($f = v/\lambda$).
        
        Why the other choices fail: Wave speed in air is constant regardless of source motion. If the ambulance were approaching, the pitch would be higher.

  - id: owa-q18
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Shock wave conditions."
    prerequisiteObjectiveIds: [physics-shock-waves]
    extensionObjectiveIds: [physics-shock-waves]
    prompt: |
      Under what condition is a sonic boom (a shock wave) produced by an aircraft?
    choices:
      - id: a
        issueSignals:
          - id: shock-wave-condition-error
        text: 'When the aircraft travels exactly at the speed of sound.'
      - id: b
        text: 'When the aircraft travels faster than the speed of sound.'
      - id: c
        issueSignals:
          - id: shock-wave-condition-error
        text: 'Only at the exact moment the aircraft breaks the sound barrier.'
      - id: d
        issueSignals:
          - id: shock-wave-condition-error
        text: 'When the aircraft accelerates rapidly.'
    answer:
      choiceId: b
    explanation: |
        Solution: A shock wave is a continuous three-dimensional cone of overlapping wavefronts.
        
        Why it works: As long as the aircraft travels faster than sound (supersonic), it outruns its own sound waves, which pile up behind it in a Mach cone. This cone sweeps continuously over the ground, creating a sonic boom for anyone it passes over.
        
        Why the other choices fail: It is not a one-time "breaking" event; it is a continuous wake dragged along by the supersonic object.

  - id: owa-q19
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Doppler effect with moving observer."
    prerequisiteObjectiveIds: [physics-doppler-effect]
    extensionObjectiveIds: [physics-doppler-effect]
    prompt: |
      A factory whistle blows at a constant frequency. You are in a car driving rapidly *toward* the factory. Why do you hear a higher frequency?
    choices:
      - id: a
        issueSignals:
          - id: doppler-effect-sign-error
        text: 'Because the sound waves are compressed in the air.'
      - id: b
        text: 'Because you are intercepting the sound waves at a higher rate than they are emitted.'
      - id: c
        issueSignals:
          - id: doppler-effect-sign-error
        text: 'Because the speed of sound in the air has increased.'
      - id: d
        issueSignals:
          - id: doppler-effect-sign-error
        text: 'Because the sound waves reflect off your car.'
    answer:
      choiceId: b
    explanation: |
        Solution: The Doppler effect for a moving observer depends on relative speed.
        
        Why it works: The wavelength in the air is unchanged (the source is stationary). However, because you are moving toward the waves, you crash into successive wave crests more frequently than if you were standing still, resulting in a higher perceived frequency.
        
        Why the other choices fail: Wave compression only happens if the *source* moves. The speed of sound relative to the air remains constant.

  - id: owa-q20
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Understanding simple harmonic motion acceleration."
    prerequisiteObjectiveIds: [physics-simple-harmonic-motion]
    extensionObjectiveIds: [physics-simple-harmonic-motion]
    prompt: |
      An object on a spring is oscillating in SHM. As it moves from its maximum positive displacement ($+A$) toward the equilibrium position ($0$), what happens to the magnitude of its velocity and acceleration?
    choices:
      - id: a
        issueSignals:
          - id: shm-energy-position-error
        text: 'Both velocity and acceleration magnitudes decrease.'
      - id: b
        text: 'Velocity magnitude increases; acceleration magnitude decreases.'
      - id: c
        issueSignals:
          - id: shm-energy-position-error
        text: 'Velocity magnitude decreases; acceleration magnitude increases.'
      - id: d
        issueSignals:
          - id: shm-energy-position-error
        text: 'Both velocity and acceleration magnitudes increase.'
    answer:
      choiceId: b
    explanation: |
        Solution: Analyze restoring force and kinetic energy.
        
        Why it works: As the object approaches equilibrium, the spring un-stretches, so the restoring force (and thus acceleration magnitude) decreases toward zero. Simultaneously, potential energy is converted to kinetic energy, so the speed (velocity magnitude) increases to its maximum at equilibrium.
        
        Why the other choices fail: They are out of phase; as one grows, the other shrinks.
