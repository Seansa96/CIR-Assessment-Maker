schemaVersion: 1
id: physics-properties-of-matter-concept-test
title: Properties of Matter Concept Test
assessmentType: test
categoryId: physics-1
topicId: physics-comprehensive-review
modeDefault: evaluate
randomizeQuestions: true
questions:
  - id: pom-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students often confuse stress and strain."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      In the context of material elasticity, how are stress and strain fundamentally defined?
    choices:
      - id: a
        issueSignals:
          - id: stress-strain-definition-error
        text: 'Stress is the deformation of the material; strain is the applied force per unit area.'
      - id: b
        text: 'Stress is the applied force per unit area; strain is the fractional deformation of the material.'
      - id: c
        issueSignals:
          - id: stress-strain-definition-error
        text: 'Stress and strain are both measures of the total force applied to the material.'
      - id: d
        issueSignals:
          - id: stress-strain-definition-error
        text: 'Stress and strain are both measures of how much the material stretches.'
    answer:
      choiceId: b
    explanation: |
        Solution: Stress is the cause (force/area), and strain is the effect (change in dimension/original dimension).
        
        Why it works: Stress has units of pressure (N/m$^2$ or Pascals), representing the intensity of the internal forces. Strain is a dimensionless ratio ($\Delta L / L$) representing the relative geometrical deformation.
        
        Why the other choices fail: Reversing the definitions or treating them as identical quantities are common misconceptions.

  - id: pom-q02
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Interpreting Young's modulus."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      Material A has a higher Young's Modulus than Material B. If identical cylindrical rods of both materials are subjected to the same tensile force, what will happen?
    choices:
      - id: a
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: 'Rod A will stretch more than Rod B.'
      - id: b
        text: 'Rod B will stretch more than Rod A.'
      - id: c
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: 'Both rods will stretch by the same amount.'
      - id: d
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: 'Rod A will break first.'
    answer:
      choiceId: b
    explanation: |
        Solution: Young's Modulus ($Y$ or $E$) measures a material's stiffness. $Y = \text{stress} / \text{strain}$.
        
        Why it works: A higher Young's Modulus means a material requires more stress to produce the same strain (it is stiffer). Therefore, for the *same* applied stress, the stiffer material (A) will exhibit less strain (stretch less) than the softer material (B).
        
        Why the other choices fail: A stiffer material stretches less, not more. Breaking depends on ultimate tensile strength, not just stiffness.

  - id: pom-q03
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Linear elastic region on stress-strain curve."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      On a standard stress-strain curve for a metal, what does the initial straight-line portion of the graph represent?
    choices:
      - id: a
        issueSignals:
          - id: elastic-region-interpretation-error
        text: 'The plastic deformation region.'
      - id: b
        text: 'The region where Hooke''s Law is obeyed.'
      - id: c
        issueSignals:
          - id: elastic-region-interpretation-error
        text: 'The point of ultimate tensile strength.'
      - id: d
        issueSignals:
          - id: elastic-region-interpretation-error
        text: 'The fracture point.'
    answer:
      choiceId: b
    explanation: |
        Solution: The straight line indicates a linear proportionality between stress and strain.
        
        Why it works: This linear relationship ($\text{stress} = Y \times \text{strain}$) is the continuous material equivalent of Hooke's Law ($F = kx$). In this region, deformation is purely elastic and proportional.
        
        Why the other choices fail: Plastic deformation occurs after the curve bends (yield point). Ultimate strength is the peak of the curve. Fracture is the end of the curve.

  - id: pom-q04
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Elastic limit vs proportional limit."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      If a material is stressed slightly beyond its elastic limit, what happens when the stress is removed?
    choices:
      - id: a
        issueSignals:
          - id: elastic-plastic-deformation-error
        text: 'It returns exactly to its original shape.'
      - id: b
        issueSignals:
          - id: elastic-plastic-deformation-error
        text: 'It shatters immediately.'
      - id: c
        text: 'It retains a permanent (plastic) deformation.'
      - id: d
        issueSignals:
          - id: elastic-plastic-deformation-error
        text: 'It becomes completely liquid.'
    answer:
      choiceId: c
    explanation: |
        Solution: The elastic limit marks the boundary between elastic and plastic behavior.
        
        Why it works: Below the elastic limit, the material springs back to its original dimensions. Exceeding it causes permanent rearrangement of atoms/molecules, resulting in a permanent set (plastic deformation) even after the load is removed.
        
        Why the other choices fail: Returning exactly to original shape only happens *below* the elastic limit. Shattering defines a brittle failure, which doesn't necessarily happen right at the elastic limit.

  - id: pom-q05
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Volume deformation conceptualization."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      Which elastic modulus relates to the change in volume of an object subjected to uniform pressure from all sides?
    choices:
      - id: a
        issueSignals:
          - id: elastic-modulus-type-error
        text: 'Young''s Modulus'
      - id: b
        issueSignals:
          - id: elastic-modulus-type-error
        text: 'Shear Modulus'
      - id: c
        text: 'Bulk Modulus'
      - id: d
        issueSignals:
          - id: elastic-modulus-type-error
        text: 'Modulus of Rupture'
    answer:
      choiceId: c
    explanation: |
        Solution: Different moduli describe different geometries of deformation.
        
        Why it works: The Bulk Modulus ($B$) relates volumetric stress (pressure, $\Delta P$) to volumetric strain ($\Delta V / V$). It measures a substance's resistance to uniform compression.
        
        Why the other choices fail: Young's Modulus is for 1D length changes (tension/compression). Shear Modulus is for 2D shape distortion (sliding planes).

  - id: pom-q06
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Shear stress mechanics."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      How is the force applied in order to create a shear stress in a material?
    choices:
      - id: a
        issueSignals:
          - id: shear-stress-direction-error
        text: 'Perpendicular to the surface area, pushing inward.'
      - id: b
        issueSignals:
          - id: shear-stress-direction-error
        text: 'Perpendicular to the surface area, pulling outward.'
      - id: c
        text: 'Parallel (tangential) to the surface area.'
      - id: d
        issueSignals:
          - id: shear-stress-direction-error
        text: 'Equally from all directions simultaneously.'
    answer:
      choiceId: c
    explanation: |
        Solution: Shear relates to parallel sliding of material layers.
        
        Why it works: Shear stress is defined as $F_{parallel} / A$. The force acts tangentially to the face of the material, tending to deform a rectangle into a parallelogram.
        
        Why the other choices fail: Perpendicular forces create normal stress (tensile or compressive). Equal forces from all directions create bulk (volume) stress.

  - id: pom-q07
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Compressibility and Bulk Modulus."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      Compressibility is a property often discussed for fluids. How is compressibility related to the Bulk Modulus?
    choices:
      - id: a
        issueSignals:
          - id: bulk-modulus-compressibility-error
        text: 'It is directly proportional to the Bulk Modulus.'
      - id: b
        text: 'It is the reciprocal (inverse) of the Bulk Modulus.'
      - id: c
        issueSignals:
          - id: bulk-modulus-compressibility-error
        text: 'It is the square of the Bulk Modulus.'
      - id: d
        issueSignals:
          - id: bulk-modulus-compressibility-error
        text: 'They are completely unrelated quantities.'
    answer:
      choiceId: b
    explanation: |
        Solution: Bulk modulus measures stiffness (resistance to compression).
        
        Why it works: Compressibility ($k$) measures how *easily* a substance compresses. Therefore, $k = 1/B$. A high bulk modulus means low compressibility.
        
        Why the other choices fail: If it were directly proportional, a stiff material would be highly compressible, which is a contradiction.

  - id: pom-q08
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Poisson's Ratio conceptualization."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      When a rubber band is stretched lengthwise, it becomes noticeably thinner in the middle. What material property quantifies this transverse contraction relative to the longitudinal extension?
    choices:
      - id: a
        issueSignals:
          - id: poissons-ratio-error
        text: 'Young''s Modulus'
      - id: b
        issueSignals:
          - id: poissons-ratio-error
        text: 'Shear Modulus'
      - id: c
        text: 'Poisson''s Ratio'
      - id: d
        issueSignals:
          - id: poissons-ratio-error
        text: 'Yield Strength'
    answer:
      choiceId: c
    explanation: |
        Solution: Poisson's ratio ($\nu$) describes the coupling between orthogonal directions during deformation.
        
        Why it works: $\nu = - (\text{transverse strain}) / (\text{longitudinal strain})$. It characterizes how much a material thins when stretched, or bulges when compressed.
        
        Why the other choices fail: Young's Modulus only relates longitudinal stress to longitudinal strain. Shear Modulus is for sliding deformation. Yield strength is a failure threshold.

  - id: pom-q09
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Ductile vs Brittle materials."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      On a stress-strain graph, what is the primary visual difference between a ductile material and a brittle material?
    choices:
      - id: a
        issueSignals:
          - id: ductile-brittle-behavior-error
        text: 'A brittle material has a much longer plastic deformation region before fracture.'
      - id: b
        text: 'A ductile material has a much longer plastic deformation region before fracture.'
      - id: c
        issueSignals:
          - id: ductile-brittle-behavior-error
        text: 'A ductile material does not have an elastic region.'
      - id: d
        issueSignals:
          - id: ductile-brittle-behavior-error
        text: 'A brittle material does not have an elastic region.'
    answer:
      choiceId: b
    explanation: |
        Solution: Ductility is the ability to sustain large plastic deformation (like drawing into a wire) before breaking.
        
        Why it works: A ductile material yields and then stretches significantly (long plastic region) before finally fracturing. A brittle material (like glass) fractures almost immediately after its elastic limit is reached, showing virtually no plastic region.
        
        Why the other choices fail: Both usually have an initial elastic (linear) region. Brittle materials lack the plastic region, not the ductile ones.

  - id: pom-q10
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Spring constant vs Young's modulus."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      How does the macroscopic spring constant ($k$) of a metal wire relate to the intrinsic Young's Modulus ($Y$) of the metal?
    choices:
      - id: a
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: '$k$ and $Y$ are the exact same quantity.'
      - id: b
        text: '$k$ depends on the length and cross-sectional area of the wire, while $Y$ is a property of the material itself.'
      - id: c
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: '$Y$ depends on the length and cross-sectional area of the wire, while $k$ is a property of the material itself.'
      - id: d
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: 'There is no mathematical relationship between $k$ and $Y$.'
    answer:
      choiceId: b
    explanation: |
        Solution: Relate $F = k\Delta L$ to $F/A = Y (\Delta L / L)$.
        
        Why it works: Rearranging the stress-strain equation gives $F = (YA/L) \Delta L$. Therefore, the effective spring constant is $k = YA/L$. This shows $k$ is geometry-dependent, while $Y$ is an intrinsic material property.
        
        Why the other choices fail: They are not the same; $k$ has units of N/m, while $Y$ has units of N/m$^2$. $Y$ is the intrinsic property, not $k$.

  - id: pom-q11
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Ultimate Tensile Strength."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      What does the "Ultimate Tensile Strength" (UTS) represent on a stress-strain curve?
    choices:
      - id: a
        issueSignals:
          - id: stress-strain-curve-property-error
        text: 'The point where the material first begins to deform plastically.'
      - id: b
        text: 'The maximum stress the material can withstand before necking and eventual fracture.'
      - id: c
        issueSignals:
          - id: stress-strain-curve-property-error
        text: 'The exact point where the material breaks into two pieces.'
      - id: d
        issueSignals:
          - id: stress-strain-curve-property-error
        text: 'The slope of the linear elastic region.'
    answer:
      choiceId: b
    explanation: |
        Solution: UTS is the global maximum on the stress-strain plot (engineering stress).
        
        Why it works: It represents the absolute highest stress the material can endure. After this point, the material begins to "neck" (thin out locally) and less applied force is required to continue stretching it until it finally breaks.
        
        Why the other choices fail: Yield point is where plastic deformation begins. Fracture point is where it breaks (which occurs at a lower engineering stress than UTS). The slope is Young's Modulus.

  - id: pom-q12
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Area under stress-strain curve."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      The area under the linear elastic portion of a stress-strain curve represents which physical quantity?
    choices:
      - id: a
        issueSignals:
          - id: elastic-energy-density-error
        text: 'The total force applied to the material.'
      - id: b
        text: 'The elastic potential energy stored per unit volume (strain energy density).'
      - id: c
        issueSignals:
          - id: elastic-energy-density-error
        text: 'The total work done to break the material.'
      - id: d
        issueSignals:
          - id: elastic-energy-density-error
        text: 'The Young''s Modulus of the material.'
    answer:
      choiceId: b
    explanation: |
        Solution: Area is the integral of stress with respect to strain.
        
        Why it works: $\int (F/A) d(\Delta L/L) = \frac{1}{AL} \int F d(\Delta L)$. The integral of force over distance is work (energy). Dividing by volume ($AL$) gives energy per unit volume, known as strain energy density.
        
        Why the other choices fail: Total work to break the material requires integrating the entire curve up to fracture, not just the linear portion (this total area represents "toughness").

  - id: pom-q13
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Toughness conceptually."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      In materials science and physics, a "tough" material is characterized by its ability to do what?
    choices:
      - id: a
        issueSignals:
          - id: toughness-concept-error
        text: 'Resist scratching on its surface.'
      - id: b
        issueSignals:
          - id: toughness-concept-error
        text: 'Resist bending and remain perfectly rigid.'
      - id: c
        text: 'Absorb a large amount of energy before fracturing.'
      - id: d
        issueSignals:
          - id: toughness-concept-error
        text: 'Return exactly to its original shape after a massive deformation.'
    answer:
      choiceId: c
    explanation: |
        Solution: Toughness is related to the total area under the entire stress-strain curve.
        
        Why it works: A tough material (like steel) requires a lot of energy to break because it has both high strength (high stress) and high ductility (high strain).
        
        Why the other choices fail: Resisting scratching is "hardness". Remaining rigid is "stiffness" (Young's modulus). Returning to original shape is "elasticity".

  - id: pom-q14
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Fluid shear resistance."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-fluid-statics]
    prompt: |
      How does the Shear Modulus of an ideal Newtonian fluid (like liquid water) compare to that of a typical solid?
    choices:
      - id: a
        text: 'It is exactly zero.'
      - id: b
        issueSignals:
          - id: shear-modulus-fluid-error
        text: 'It is roughly equal to a solid.'
      - id: c
        issueSignals:
          - id: shear-modulus-fluid-error
        text: 'It is infinite.'
      - id: d
        issueSignals:
          - id: shear-modulus-fluid-error
        text: 'It is negative.'
    answer:
      choiceId: a
    explanation: |
        Solution: Shear modulus measures resistance to static shear deformation.
        
        Why it works: Fluids, by definition, cannot support a static shear stress. If you apply a shear force to a fluid, it will flow continuously rather than deforming to a fixed angle and stopping. Therefore, its static shear modulus is zero.
        
        Why the other choices fail: Fluids only resist the *rate* of shear (viscosity), not the amount of static shear.

  - id: pom-q15
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Length dependence of deformation."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      You hang a heavy weight from a 1-meter steel wire, and it stretches by 1 mm. If you hang the exact same weight from a 2-meter steel wire of the same thickness, how much will it stretch?
    choices:
      - id: a
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: '0.5 mm'
      - id: b
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: '1 mm'
      - id: c
        text: '2 mm'
      - id: d
        issueSignals:
          - id: youngs-modulus-deformation-error
        text: '4 mm'
    answer:
      choiceId: c
    explanation: |
        Solution: Use $\Delta L = \frac{F L}{Y A}$.
        
        Why it works: The force ($F$), cross-sectional area ($A$), and material ($Y$) are identical. The elongation $\Delta L$ is directly proportional to the original length $L$. Since the original length is doubled, the elongation is also doubled to 2 mm.
        
        Why the other choices fail: The strain ($\Delta L / L$) remains identical (0.001) for both wires because the stress is identical. A 0.001 strain on a 2000 mm wire is 2 mm.

  - id: pom-q16
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Area dependence of deformation."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      If you double the radius of a cylindrical support column, how does its resistance to compressive deformation (its effective spring constant) change?
    choices:
      - id: a
        issueSignals:
          - id: area-length-stiffness-scaling-error
        text: 'It doubles.'
      - id: b
        text: 'It quadruples.'
      - id: c
        issueSignals:
          - id: area-length-stiffness-scaling-error
        text: 'It halves.'
      - id: d
        issueSignals:
          - id: area-length-stiffness-scaling-error
        text: 'It remains the same.'
    answer:
      choiceId: b
    explanation: |
        Solution: The effective spring constant of a column is $k = Y A / L$.
        
        Why it works: The cross-sectional area of a cylinder is $A = \pi r^2$. If the radius $r$ is doubled, the area $A$ increases by a factor of $(2)^2 = 4$. Therefore, the column becomes 4 times as stiff (stretches/compresses 4 times less under the same load).
        
        Why the other choices fail: The relationship to radius is quadratic, not linear.

  - id: pom-q17
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Volume strain with Bulk Modulus."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      When a solid block of iron is submerged deep in the ocean, it experiences immense hydrostatic pressure. What happens to its density?
    choices:
      - id: a
        issueSignals:
          - id: pressure-density-compressibility-error
        text: 'Its density decreases.'
      - id: b
        text: 'Its density increases.'
      - id: c
        issueSignals:
          - id: pressure-density-compressibility-error
        text: 'Its density remains exactly constant because solids are strictly incompressible.'
      - id: d
        issueSignals:
          - id: pressure-density-compressibility-error
        text: 'Its mass increases, causing density to increase.'
    answer:
      choiceId: b
    explanation: |
        Solution: Density is mass divided by volume ($\rho = m/V$).
        
        Why it works: The immense pressure causes a volumetric strain governed by the Bulk Modulus. The block's volume decreases slightly ($\Delta V < 0$). Since the mass $m$ is constant and the volume $V$ decreases, the density $\rho$ must increase.
        
        Why the other choices fail: Solids are highly resistant to compression, but they are not *strictly* incompressible; they do have a finite bulk modulus. Mass does not change.

  - id: pom-q18
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Necking phenomenon."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      During a tensile test of a metal, the engineering stress appears to *decrease* right before the material fractures. What is the physical reason for this?
    choices:
      - id: a
        issueSignals:
          - id: necking-engineering-stress-error
        text: 'The material is spontaneously creating more mass to heal itself.'
      - id: b
        issueSignals:
          - id: necking-engineering-stress-error
        text: 'The testing machine applies less force because it senses the break.'
      - id: c
        text: 'The sample undergoes ''necking'', where its cross-sectional area rapidly decreases in one spot.'
      - id: d
        issueSignals:
          - id: necking-engineering-stress-error
        text: 'The atoms inside the metal start repelling each other.'
    answer:
      choiceId: c
    explanation: |
        Solution: Engineering stress is calculated using the *original* (initial) cross-sectional area ($F/A_0$).
        
        Why it works: Once the ultimate tensile strength is reached, the material starts thinning rapidly in one specific region (necking). Because the *true* area in that neck is much smaller, it takes less total force $F$ to continue pulling it apart. Since engineering stress is plotted as $F/A_0$, the curve dips. The *true* stress ($F/A_{current}$) is actually still increasing.
        
        Why the other choices fail: The other options do not describe the localized plastic flow that causes the macroscopic force drop.

  - id: pom-q19
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Bending stress distributions."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      When a horizontal beam is supported at its ends and sags in the middle under its own weight, what types of stress are present within the beam?
    choices:
      - id: a
        issueSignals:
          - id: beam-bending-stress-error
        text: 'Only compressive stress.'
      - id: b
        issueSignals:
          - id: beam-bending-stress-error
        text: 'Only tensile stress.'
      - id: c
        text: 'Compressive stress in the top half, tensile stress in the bottom half.'
      - id: d
        issueSignals:
          - id: beam-bending-stress-error
        text: 'Tensile stress in the top half, compressive stress in the bottom half.'
    answer:
      choiceId: c
    explanation: |
        Solution: Bending a beam creates a gradient of longitudinal stress.
        
        Why it works: As the beam sags in the middle (forming a U-shape), the top surface is squeezed together (compression), while the bottom surface is stretched apart (tension). The neutral axis in the middle experiences zero longitudinal stress.
        
        Why the other choices fail: Bending always couples tension on the convex side and compression on the concave side.

  - id: pom-q20
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Spring combinations."
    prerequisiteObjectiveIds: [physics-elasticity]
    extensionObjectiveIds: [physics-elasticity]
    prompt: |
      Two identical elastic bungee cords, each with spring constant $k$, are tied end-to-end to make a single cord that is twice as long. What is the effective spring constant of this new, longer cord?
    choices:
      - id: a
        issueSignals:
          - id: spring-series-combination-error
        text: '$2k$'
      - id: b
        issueSignals:
          - id: spring-series-combination-error
        text: '$k$'
      - id: c
        text: '$k/2$'
      - id: d
        issueSignals:
          - id: spring-series-combination-error
        text: '$k/4$'
    answer:
      choiceId: c
    explanation: |
        Solution: Connecting springs end-to-end is a "series" configuration.
        
        Why it works: In series, the applied force $F$ stretches both cords. Each cord stretches by $x = F/k$. The total stretch is $x_{tot} = F/k + F/k = 2F/k$. The effective spring constant is $k_{eff} = F / x_{tot} = F / (2F/k) = k/2$. The longer cord is "softer".
        
        Why the other choices fail: Parallel connection (side-by-side) would yield $2k$.
