items:
- {id: soundi-r1, type: cloze, prompt: 'For an isotropic source, $I={{P/(4\pi r^2)}}$.', answer: {expected: 'P/(4\pi r^2)'}, explanation: 'Solution: Use $I=P/(4\pi r^2)$. Why it works: power spreads over a spherical area.'}
- {id: soundi-r2, type: typed, prompt: 'If distance doubles, by what factor does point-source intensity change?', answer: {expected: one fourth}, explanation: 'Solution: It becomes one-fourth. Why it works: intensity is inversely proportional to distance squared.'}
- {id: soundi-r3, type: cloze, prompt: 'Sound level is $\beta={{10\log_{10}(I/I_0)}}$.', answer: {expected: '10\log_{10}(I/I_0)'}, explanation: 'Solution: Use the decibel definition. Why it works: hearing spans a wide intensity range, motivating a logarithmic scale.'}
- {id: soundi-r4, type: typed, prompt: 'A 10 dB increase corresponds to what intensity factor?', answer: {expected: 10}, explanation: 'Solution: A factor of ten. Why it works: the logarithmic coefficient is 10.'}
- {id: soundi-r5, type: cloze, prompt: 'Intensity is proportional to pressure-amplitude {{squared}}.', answer: {expected: squared}, explanation: 'Solution: Identify squared. Why it works: time-averaged wave power is proportional to pressure-amplitude squared.'}
- {id: soundi-r6, type: typed, prompt: 'What is the unit of sound intensity?', answer: {expected: 'W/m^2'}, explanation: 'Solution: Use watts per square meter. Why it works: intensity is power divided by area.'}
