modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we-keq-parallel
    title: Parallel springs
    problem: 'Derive the equivalent stiffness of two springs $k_1$ and $k_2$ arranged in parallel.'
    steps:
      - id: kp-1
        title: Match extensions
        instruction: 'Parallel springs have the same extension $x$ and their forces add.'
        type: symbolicResponse
        prompt: 'Write the total force.'
        answer: { gradingMode: auto, expectedLatex: '(k_1+k_2)x', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_{total}=k_1x+k_2x=(k_1+k_2)x$.\n\nWhy it works: Both springs experience the same displacement.'
      - id: kp-2
        title: State equivalent stiffness
        instruction: 'Match the total force to $k_{eq}x$.'
        type: symbolicResponse
        prompt: 'What is $k_{eq}$?'
        answer: { gradingMode: auto, expectedLatex: 'k_1+k_2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $k_{eq}=k_1+k_2$.\n\nWhy it works: The parallel forces add for one shared extension.'
  - id: we-keq-series
    title: Series springs
    problem: 'Derive the equivalent stiffness of two springs $k_1$ and $k_2$ arranged in series.'
    steps:
      - id: ks-1
        title: Add extensions
        instruction: 'The same force $F$ passes through each spring in series.'
        type: symbolicResponse
        prompt: 'Write the total extension.'
        answer: { gradingMode: auto, expectedLatex: 'F/k_1+F/k_2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $x_{total}=F/k_1+F/k_2$.\n\nWhy it works: Series extensions add while the force is common.'
      - id: ks-2
        title: State equivalent stiffness
        instruction: 'Compare $x_{total}$ with $F/k_{eq}$.'
        type: symbolicResponse
        prompt: 'Write $1/k_{eq}$. '
        answer: { gradingMode: auto, expectedLatex: '1/k_1+1/k_2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $1/k_{eq}=1/k_1+1/k_2$.\n\nWhy it works: Equating the two total-extension forms and dividing by $F$ gives the reciprocal relation.'
