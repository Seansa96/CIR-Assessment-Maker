questions:
- id: q001
  type: numericResponse
  prompt: A string has tension 80 N and linear density 0.20 kg/m. What wave speed in m/s does $v=\sqrt{T/\mu}$ predict?
  answer: { value: 20, tolerance: 0.1 }
  explanation: |
    Solution: $v=\sqrt{80/0.20}=\sqrt{400}=20$ m/s.

    Why it works: String wave speed increases with tension and decreases with mass per unit length.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q002
  type: numericResponse
  prompt: A 2.0 m string has mass 0.10 kg. What is its linear density in kg/m?
  answer: { value: 0.05, tolerance: 0.001 }
  explanation: |
    Solution: $\mu=m/L=0.10/2.0=0.050$ kg/m.

    Why it works: Linear density is mass distributed per unit length.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q003
  type: multipleChoice
  prompt: If a string's tension is quadrupled while its linear density is unchanged, how does wave speed change?
  choices:
  - { id: a, text: It doubles. }
  - { id: b, text: It quadruples. }
  - { id: c, text: It is halved. }
  - { id: d, text: It is unchanged. }
  answer: { choiceId: a }
  explanation: |
    Solution: It doubles.

    Why it works: $v\propto\sqrt{T}$, and $\sqrt4=2$.

    Why the other choices fail: The relation is square-root rather than direct, so quadrupling tension does not quadruple speed.
  difficultyDimensions: [proportionalReasoning, modelOrDerivation]
- id: q004
  type: multipleChoice
  prompt: Two strings have equal tension. Which string carries waves faster?
  choices:
  - { id: a, text: The string with smaller linear density. }
  - { id: b, text: The string with larger linear density. }
  - { id: c, text: Both always have the same speed. }
  - { id: d, text: The string with lower frequency. }
  answer: { choiceId: a }
  explanation: |
    Solution: The string with smaller linear density.

    Why it works: $v=\sqrt{T/\mu}$ decreases as $\mu$ increases for fixed tension.

    Why the other choices fail: Frequency does not independently set speed in this model, and equal tension does not erase density dependence.
  difficultyDimensions: [modelComparison, causalReasoning]
