- id: q001
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: A tensioned cable vibrates with wavelength 15.61 m when driven at 47.0 Hz.
    What is the wave speed in m/s?
  answer:
    value: 733.67
    tolerance: 0.05
  explanation: v = lambda * f = 15.61 * 47.0 = 733.67 m/s.
- id: q002
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: An ocean swell propagates with a wavelength of 12.05 m passing a buoy at
    83.2 Hz. What is the wave speed in m/s?
  answer:
    value: 1002.56
    tolerance: 0.05
  explanation: v = lambda * f = 12.05 * 83.2 = 1002.56 m/s.
- id: q003
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: A seismic surface wave has a characteristic wavelength of 13.4 m and vibrates
    at 7.8 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.4689
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 13.4 = 0.4689 rad/m.
