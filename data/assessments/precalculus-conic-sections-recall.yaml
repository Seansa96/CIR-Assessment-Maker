schemaVersion: 1
id: precalculus-conic-sections-recall
title: Conic Sections and Standard Forms Recall
assessmentType: recallDrill
categoryId: precalculus
topicId: precalc-conics
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - precalculus
  - precalc-conics
  - conic-sections
skills:
- Apply precalculus concepts
- Apply Conic Sections
  - conic-standard-forms
  - conic-attributes
  - conic-strategies
items:
  - id: conic-center-flashcard
    type: flashcard
    prompt: |
      For the standard form equations of circles, ellipses, and hyperbolas, what do the parameters $(h, k)$ represent?
    answer:
      expected: The center of the conic section.
    tags:
      - conic-attributes

  - id: parabola-attributes-typed
    type: typed
    prompt: |
      Name the three key geometric attributes that define and describe a parabola. (List them separated by commas, e.g., "point, line, curve")
    answer:
      expected: focus, directrix, vertex
      aliases:
        - vertex, focus, directrix
        - directrix, focus, vertex
        - focus, vertex, directrix
    explanation: |
      The vertex is the peak/valley, the focus is the defining point inside the curve, and the directrix is the defining line outside the curve.
    tags:
      - conic-attributes

  - id: ellipse-foci-cloze
    type: cloze
    prompt: |
      An ellipse is defined by the set of all points where the sum of distances to two fixed points is constant. These two fixed points are called the \_\_\_\_.
    answer:
      expected: foci
      aliases:
        - focuses
    tags:
      - conic-attributes

  - id: hyperbola-asymptotes-cloze
    type: cloze
    prompt: |
      A hyperbola has two distinct branches and approaches two straight diagonal lines called \_\_\_\_ as it extends away from the center.
    answer:
      expected: asymptotes
    tags:
      - conic-attributes

  - id: circle-standard-form-symbolic
    type: symbolic
    prompt: |
      What is the standard form equation of a circle centered at $(h, k)$ with radius $r$?
    answer:
      expectedLatex: '(x-h)^2 + (y-k)^2 = r^2'
    tags:
      - conic-standard-forms

  - id: ellipse-standard-form-symbolic
    type: symbolic
    prompt: |
      What is the standard form equation of an ellipse centered at $(h, k)$ with a horizontal major axis (length $2a$) and a vertical minor axis (length $2b$)?
    answer:
      expectedLatex: '\frac{(x-h)^2}{a^2} + \frac{(y-k)^2}{b^2} = 1'
    tags:
      - conic-standard-forms

  - id: hyperbola-standard-form-symbolic
    type: symbolic
    prompt: |
      What is the standard form equation of a hyperbola centered at $(h, k)$ that opens left and right (horizontal transverse axis)?
    answer:
      expectedLatex: '\frac{(x-h)^2}{a^2} - \frac{(y-k)^2}{b^2} = 1'
    tags:
      - conic-standard-forms

  - id: parabola-standard-form-symbolic
    type: symbolic
    prompt: |
      What is the standard form equation of a parabola with vertex $(h, k)$ that opens up or down, using the directed distance from vertex to focus $p$?
    answer:
      expectedLatex: '(x-h)^2 = 4p(y-k)'
    tags:
      - conic-standard-forms

  - id: completing-the-square-typed
    type: typed
    prompt: |
      When given a general quadratic equation like $x^2 + y^2 - 4x + 6y - 3 = 0$, what algebraic technique must you use to convert it into the standard form of a conic section?
    answer:
      expected: completing the square
      aliases:
        - complete the square
    explanation: |
      Completing the square allows you to group the $x$ terms and $y$ terms into perfect square binomials, like $(x-h)^2$ and $(y-k)^2$.
    tags:
      - conic-strategies

  - id: strategy-ellipse-foci-vertex-flashcard
    type: flashcard
    prompt: |
      If a problem gives you the coordinates of the foci and one vertex of an ellipse, what is the strategy to find its standard equation?
    answer:
      expected: |
        1. Find the midpoint of the foci to get the center $(h,k)$.
        2. Find the distance from center to vertex for $a$.
        3. Find the distance from center to focus for $c$.
        4. Use $c^2 = a^2 - b^2$ to solve for $b^2$.
    tags:
      - conic-strategies

  - id: parabola-p-value-cloze
    type: cloze
    prompt: |
      In the standard form of a parabola $(x-h)^2 = 4p(y-k)$, the value $|p|$ represents the distance from the vertex to the \_\_\_\_ and also the distance from the vertex to the \_\_\_\_.
      (Note: Both blanks are the same word/concept, just provide the most common identifying point for the first blank).
      Wait, standard cloze only supports a single blank well. Let's rephrase.

      In the standard form of a parabola $(x-h)^2 = 4p(y-k)$, the absolute value of $p$ represents the distance from the vertex to the \_\_\_\_.
    answer:
      expected: focus
      aliases:
        - directrix
    tags:
      - conic-attributes
