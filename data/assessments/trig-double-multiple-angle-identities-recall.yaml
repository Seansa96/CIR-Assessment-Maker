schemaVersion: 1
id: trig-double-multiple-angle-identities-recall
title: Double and Multiple Angle Identities Recall
assessmentType: recallDrill
categoryId: trigonometry
subcategoryIds:
  - trig-double-half-angle
  - trig-multiple-angle
modeDefault: practice
randomizeQuestions: false
items:
  - id: double-angle-sine
    type: symbolic
    prompt: |
      Recall the double-angle identity for:

      $$
      \sin(2x)
      $$
    answer:
      expectedLatex: '2\sin x\cos x'
      aliases:
        - 2 sin x cos x
    explanation: |
      This comes from the angle-sum identity $\sin(x+x)=\sin x\cos x+\cos x\sin x$.
    tags:
      - double-angle
      - sine

  - id: double-angle-cosine-primary
    type: symbolic
    prompt: |
      Recall the main double-angle identity for:

      $$
      \cos(2x)
      $$
    answer:
      expectedLatex: '\cos^2 x-\sin^2 x'
      aliases:
        - cos^2 x - sin^2 x
    explanation: |
      This comes from $\cos(x+x)=\cos x\cos x-\sin x\sin x$.
    tags:
      - double-angle
      - cosine

  - id: double-angle-cosine-alternates
    type: typed
    prompt: |
      Write the two common alternate forms of the cosine double-angle identity.
    answer:
      expected: cos(2x) = 2cos^2(x)-1 and cos(2x) = 1-2sin^2(x)
      aliases:
        - 2cos^2(x)-1 and 1-2sin^2(x)
    explanation: |
      Start from $\cos(2x)=\cos^2x-\sin^2x$, then replace $\sin^2x$ with $1-\cos^2x$ or replace $\cos^2x$ with $1-\sin^2x$.
    tags:
      - double-angle
      - cosine
      - pythagorean-identities

  - id: double-angle-tangent
    type: symbolic
    prompt: |
      Recall the double-angle identity for:

      $$
      \tan(2x)
      $$
    answer:
      expectedLatex: '\frac{2\tan x}{1-\tan^2 x}'
      aliases:
        - 2 tan x over 1 minus tan squared x
    explanation: |
      This is derived by applying the tangent angle-sum identity to $\tan(x+x)$.
    tags:
      - double-angle
      - tangent

  - id: triple-angle-sine
    type: symbolic
    prompt: |
      Recall the triple-angle identity for:

      $$
      \sin(3x)
      $$
    answer:
      expectedLatex: '3\sin x-4\sin^3 x'
      aliases:
        - 3 sin x minus 4 sin cubed x
    explanation: |
      This is a multiple-angle identity. It can be built from $\sin(2x+x)$ using the angle-sum formulas and the double-angle identities.
    tags:
      - multiple-angle
      - triple-angle
      - sine

  - id: triple-angle-cosine
    type: symbolic
    prompt: |
      Recall the triple-angle identity for:

      $$
      \cos(3x)
      $$
    answer:
      expectedLatex: '4\cos^3 x-3\cos x'
      aliases:
        - 4 cos cubed x minus 3 cos x
    explanation: |
      This is the cosine triple-angle identity. It is especially useful when rewriting powers of cosine or solving certain trig equations.
    tags:
      - multiple-angle
      - triple-angle
      - cosine

  - id: cloze-double-angle-cosine-one-minus
    type: cloze
    prompt: |
      Complete this alternate cosine double-angle form:

      $$
      \cos(2x)=1-\_\_\_\_
      $$
    answer:
      expected: '2sin^2(x)'
      aliases:
        - 2 sin squared x
        - 2sin^2x
    explanation: |
      The missing term is $2\sin^2(x)$. This form is useful when an expression is mostly in sine.
    tags:
      - double-angle
      - cosine

  - id: flashcard-multiple-angle-build
    type: flashcard
    prompt: |
      If you forget a triple-angle identity, what is the fastest reconstruction strategy?
    answer:
      expected: Rewrite the angle as 2x + x, then use angle-sum identities plus double-angle identities.
    explanation: |
      For example, $\sin(3x)=\sin(2x+x)$. Then apply the sine sum identity and substitute $\sin(2x)$ and $\cos(2x)$.
    tags:
      - multiple-angle
      - reconstruction
      - which-tool-when
