schemaVersion: 1
id: aops-circles-introduction-concept-lesson
title: "Circles I: Structure, Measurement, and Scaling"
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-circles-introduction
modeDefault: learn
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [art-of-problem-solving, aops-circles-introduction, aops-volume-1, circle-structure, circumference, area]
skills:
- Identify radii, diameters, chords, arcs, sectors, and tangents.
- Compute and compare circle circumference and area.
- Apply linear and quadratic scale laws to circles.
lesson:
  introduction: |
    A circle is the set of points at a fixed distance from one center. That simple invariant creates a vocabulary of segments and regions and explains why every measurement can be organized around the radius.
  sections:
  - id: aops-circles-structure-purpose
    title: The fixed-distance model
    required: true
    content: |
      A circle with center $O$ and radius $r>0$ consists of every point $P$ satisfying $OP=r$. The boundary is the circle; the filled interior together with the boundary is a disk. Rotating a radius changes its direction but not its length, which is why circle results repeatedly create equal radii and isosceles triangles.
    media:
    - type: image
      src: /assessments/aops/aops-circles-structure.svg
      alt: Circle centered at O with a radius, diameter, chord, and tangent labeled.
      caption: Every boundary point is exactly one radius from O.
    check:
      id: aops-circles-structure-purpose-check
      type: multipleChoice
      prompt: Which statement defines a circle centered at $O$ with radius $r$?
      choices:
      - { id: a, text: 'All points $P$ satisfying $OP=r$.' }
      - { id: b, text: 'All points $P$ satisfying $OP\le r$.' }
      - { id: c, text: 'All points on one chosen diameter.' }
      - { id: d, text: 'All points whose distance from O varies.' }
      answer: { choiceId: a }
      explanation: Equality describes the boundary; $OP\le r$ describes the disk.
  - id: aops-circles-segments
    title: Radius, diameter, chord, and tangent
    required: true
    content: |
      A radius joins the center to the circle. A chord joins two circle points. A diameter is a chord through the center, so $d=2r$ and it is the longest chord. A tangent meets the circle at one point and is perpendicular to the radius at that point. These terms are not interchangeable: a chord need not pass through the center, and a secant meets the circle twice.
    media:
    - type: image
      src: /assessments/aops/aops-circles-structure.svg
      alt: Labeled radius OA, diameter BC, chord DE, and tangent through A.
      caption: The defining location of each segment determines which theorem is available.
    check:
      id: aops-circles-segments-check
      type: multipleChoice
      prompt: Which fact distinguishes a diameter from every other chord?
      choices:
      - { id: a, text: It passes through the center. }
      - { id: b, text: It has endpoints outside the circle. }
      - { id: c, text: It is perpendicular to every radius. }
      - { id: d, text: It touches the circle once. }
      answer: { choiceId: a }
      explanation: A diameter is precisely a chord through the center.
  - id: aops-circles-circumference
    title: Circumference and the meaning of pi
    required: true
    content: |
      The ratio of circumference to diameter is the constant $\pi$, so $C=\pi d=2\pi r$. Circumference is a length and uses linear units. If the radius doubles, the circumference doubles. Keeping answers in terms of $\pi$ preserves exactness; a decimal approximation should be used only when requested.
    media:
    - type: image
      src: /assessments/aops/aops-circles-scaling.svg
      alt: Two circles with radii 3 and 6 showing a circumference scale factor of 2.
      caption: Circumference scales in the same ratio as radius.
    check:
      id: aops-circles-circumference-check
      type: multipleChoice
      prompt: What is the exact circumference of a circle with radius 6?
      choices:
      - { id: a, text: '$12\pi$' }
      - { id: b, text: '$36\pi$' }
      - { id: c, text: '$6\pi$' }
      - { id: d, text: '$18\pi$' }
      answer: { choiceId: a }
      explanation: $C=2\pi r=12\pi$.
  - id: aops-circles-area
    title: Area and why the radius is squared
    required: true
    content: |
      Circle area is $A=\pi r^2$. One conceptual derivation cuts the disk into many narrow sectors and rearranges them into a near-rectangle whose height approaches $r$ and base approaches half the circumference, $\pi r$. Their product approaches $\pi r^2$. Area uses square units and scales by the square of a dilation factor.
    media:
    - type: image
      src: /assessments/aops/aops-circles-scaling.svg
      alt: Circles of radii 3 and 6 showing that doubling radius multiplies area by four.
      caption: Length factor 2 produces area factor $2^2=4$.
    check:
      id: aops-circles-area-check
      type: multipleChoice
      prompt: A radius is multiplied by 3. By what factor does area change?
      choices:
      - { id: a, text: 9 }
      - { id: b, text: 3 }
      - { id: c, text: 6 }
      - { id: d, text: 27 }
      answer: { choiceId: a }
      explanation: Area scales quadratically, so the factor is $3^2=9$.
  - id: aops-circles-arcs-sectors
    title: Central angles, arcs, and sectors
    required: true
    content: |
      A central angle has vertex at the center. Its intercepted arc and sector occupy the same fraction of a full circle as $\theta/360^\circ$. Thus

      $$L=\frac{\theta}{360^\circ}(2\pi r),\qquad S=\frac{\theta}{360^\circ}(\pi r^2).$$

      Arc length is a length; sector area is an area. Keeping those units visible prevents swapping the formulas.
    media:
    - type: image
      src: /assessments/aops/aops-circles-sector.svg
      alt: Circle of radius 6 with a shaded 120-degree sector and intercepted arc.
      caption: A $120^\circ$ sector is one third of the circle.
    check:
      id: aops-circles-arcs-sectors-check
      type: multipleChoice
      prompt: What fraction of a circle is a $120^\circ$ sector?
      choices:
      - { id: a, text: '$1/3$' }
      - { id: b, text: '$1/2$' }
      - { id: c, text: '$2/3$' }
      - { id: d, text: '$1/6$' }
      answer: { choiceId: a }
      explanation: $120/360=1/3$.
  - id: aops-circles-method-selection
    title: Select the quantity before the formula
    required: true
    content: |
      Start by naming what the problem asks for: radius, diameter, boundary length, enclosed area, arc length, or sector area. Convert diameter to radius only when the chosen formula requires it. Then identify the fraction of the circle, if any, and check dimensions. A result in square units cannot answer a length question.
    media:
    - type: image
      src: /assessments/aops/aops-circles-sector.svg
      alt: Shaded sector distinguishing its curved arc length from its two-dimensional area.
      caption: The same central angle controls two different quantities with different units.
    check:
      id: aops-circles-method-selection-check
      type: multipleChoice
      prompt: A problem asks for the curved boundary of a sector. Which quantity is required?
      choices:
      - { id: a, text: Arc length }
      - { id: b, text: Sector area }
      - { id: c, text: Diameter squared }
      - { id: d, text: Disk area }
      answer: { choiceId: a }
      explanation: The curved boundary is one-dimensional arc length.
  - id: aops-circles-traps-synthesis
    title: Traps, verification, and synthesis
    required: true
    content: |
      Common errors include using diameter where a formula expects radius, forgetting to square a scale factor for area, treating an unmarked chord as a diameter, and swapping arc and sector formulas. Verify an answer by checking units, scale behavior, and bounds: a proper sector must have less area than the whole disk, and an arc below $360^\circ$ must be shorter than the full circumference.
    media:
    - type: image
      src: /assessments/aops/aops-circles-structure.svg
      alt: Circle structure diagram showing that only the chord through O is a diameter.
      caption: Location and units are part of the theorem conditions.
    check:
      id: aops-circles-traps-synthesis-check
      type: multipleChoice
      prompt: Which result could be the area of a $90^\circ$ sector in a radius-4 circle?
      choices:
      - { id: a, text: '$4\pi$ square units' }
      - { id: b, text: '$8\pi$ square units' }
      - { id: c, text: '$16\pi$ square units' }
      - { id: d, text: '$32\pi$ square units' }
      answer: { choiceId: a }
      explanation: A quarter of the disk area $16\pi$ is $4\pi$.
