- id: reciprocal-square-engineering
  title: Create the missing reciprocal square identity
  problem: 'Suppose


    $$

    x+\frac{1}{x}=5,

    \qquad x\ne0.

    $$


    Find


    $$

    x^2+\frac{1}{x^2}

    $$


    without solving for $x$. The known expression and target look similar, but the

    target is not obtained by squaring each term independently. We will deliberately

    create the target inside a binomial-square identity.

    '
  steps:
  - id: step-reciprocal-square-engineering-1
    title: Choose an identity containing the target
    instruction: 'Search for an operation on the known expression that produces both

      $x^2$ and $\frac{1}{x^2}$.

      '
    type: multipleChoice
    prompt: Which operation creates the desired square terms at once?
    choices:
    - id: a
      text: Square $x+\frac{1}{x}$.
    - id: b
      text: Multiply $x+\frac{1}{x}$ by $x$.
    - id: c
      text: Subtract $x$ from both sides.
    - id: d
      text: Take a square root.
    answer:
      choiceId: a
    hint: 'The target contains the squares of both original terms.

      '
    explanation: |
      Squaring manufactures both target terms, plus a manageable cross term.

      Related topic: backward design with binomial identities.
  - id: step-reciprocal-square-engineering-2
    title: Keep the cross term
    instruction: 'Expand the square completely. The cross term is the correction that
      makes the

      identity valid.

      '
    type: multipleChoice
    prompt: Which expansion is correct?
    choices:
    - id: a
      text: $\left(x+\frac{1}{x}\right)^2=x^2+2+\frac{1}{x^2}$
    - id: b
      text: $\left(x+\frac{1}{x}\right)^2=x^2+\frac{1}{x^2}$
    - id: c
      text: $\left(x+\frac{1}{x}\right)^2=2x^2$
    - id: d
      text: $\left(x+\frac{1}{x}\right)^2=x^2+1+\frac{1}{x^2}$
    answer:
      choiceId: a
    hint: 'The middle term is $2(x)(1/x)$.

      '
    explanation: |
      Since $x\cdot\frac{1}{x}=1$, the cross term is $2$.

      Related topic: square of a binomial.
  - id: step-reciprocal-square-engineering-3
    title: Isolate the engineered target
    instruction: 'Rearrange the identity so the desired expression appears alone.

      '
    type: symbolicResponse
    prompt: |
      Express $x^2+\frac{1}{x^2}$ in terms of
      $x+\frac{1}{x}$.
    answer:
      expectedLatex: \left(x+\frac{1}{x}\right)^2-2
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0
    hint: 'Subtract the cross-term correction from the square.

      '
    explanation: "$$ \nx^2+\\frac{1}{x^2}\n=\n\\left(x+\\frac{1}{x}\\right)^2-2.\n\
      $$\n\nRelated topic: forcing a symmetric reciprocal identity.\n"
  - id: step-reciprocal-square-engineering-4
    title: Evaluate without solving for x
    instruction: 'Substitute the known value into the engineered identity.

      '
    type: numericResponse
    prompt: |
      If $x+\frac{1}{x}=5$, enter the value of
      $x^2+\frac{1}{x^2}$.
    answer:
      value: 23
      tolerance: 0
    hint: 'Compute $5^2-2$.

      '
    explanation: "$$ \nx^2+\\frac{1}{x^2}=5^2-2=23.\n$$\n\nSolving the quadratic for\
      \ $x$ would work, but it creates unnecessary branches.\nThe engineered identity\
      \ goes directly from known structure to target structure.\n\nRelated topic:\
      \ symmetric expressions without solving for variables.\n"
- id: sophie-germain-engineering
  title: Force a difficult quartic into factorable squares
  problem: 'Factor


    $$

    x^4+4.

    $$


    There is no common factor, and it is not initially a difference of squares. We
    will

    add and subtract the exact term needed to create one.

    '
  steps:
  - id: step-sophie-germain-engineering-1
    title: Imagine the desired square
    instruction: 'The terms $x^4$ and $4$ are the first and last terms of a square.

      '
    type: multipleChoice
    prompt: Which perfect square begins with $x^4$ and ends with $4$?
    choices:
    - id: a
      text: $(x^2+2)^2=x^4+4x^2+4$
    - id: b
      text: $(x+2)^2=x^2+4x+4$
    - id: c
      text: $(x^2+4)^2=x^4+8x^2+16$
    - id: d
      text: $(x^2-2)^2=x^4-4x^2-4$
    answer:
      choiceId: a
    hint: 'Use $(A+B)^2=A^2+2AB+B^2$ with $A=x^2$ and $B=2$.

      '
    explanation: |
      The missing middle term is $4x^2$.

      Related topic: recognizing an almost-perfect square.
  - id: step-sophie-germain-engineering-2
    title: Add and subtract the missing term
    instruction: 'Introduce $4x^2-4x^2=0$ so the first three terms become a square.

      '
    type: multipleChoice
    prompt: Which rewrite preserves value and creates a difference of squares?
    choices:
    - id: a
      text: $x^4+4=(x^2+2)^2-(2x)^2$
    - id: b
      text: $x^4+4=(x^2+2)^2+(2x)^2$
    - id: c
      text: $x^4+4=(x^2+4)^2-4x^2$
    - id: d
      text: $x^4+4=x^2(x^2+4)$
    answer:
      choiceId: a
    hint: '$(x^2+2)^2$ adds $4x^2$, so subtract $(2x)^2=4x^2$.

      '
    explanation: "$$ \nx^4+4\n=x^4+4x^2+4-4x^2\n=(x^2+2)^2-(2x)^2.\n$$\n\nRelated\
      \ topic: adding zero to manufacture a difference of squares.\n"
  - id: step-sophie-germain-engineering-3
    title: Apply the created identity
    instruction: 'Factor the engineered difference of squares.

      '
    type: symbolicResponse
    prompt: Factor $x^4+4$ completely over the integers.
    answer:
      expectedLatex: (x^2-2x+2)(x^2+2x+2)
      equivalenceMode: expression
      variables:
      - x
      tolerance: 0
    hint: 'Use $A^2-B^2=(A-B)(A+B)$ with $A=x^2+2$ and $B=2x$.

      '
    explanation: "$$ \n\\begin{aligned}\nx^4+4\n&=(x^2+2-2x)(x^2+2+2x)\\\\\n&=(x^2-2x+2)(x^2+2x+2).\n\
      \\end{aligned}\n$$\n\nThis is the Sophie Germain identity for $x^4+4$.\n\nRelated\
      \ topic: engineered difference of squares.\n"
- id: telescoping-engineering
  title: Split a fraction to create cancellation
  problem: 'Evaluate


    $$

    \sum_{k=1}^{n}\frac{1}{k(k+1)}.

    $$


    The terms do not visibly cancel. We will force each term into a difference whose

    neighboring pieces cancel across the sum.

    '
  steps:
  - id: step-telescoping-engineering-1
    title: Decide the desired denominator forms
    instruction: 'The denominator already contains neighboring factors $k$ and $k+1$.
      Try to

      separate the fraction into one term over each factor.

      '
    type: multipleChoice
    prompt: Which decomposition is correct?
    choices:
    - id: a
      text: $\frac{1}{k(k+1)}=\frac{1}{k}-\frac{1}{k+1}$
    - id: b
      text: $\frac{1}{k(k+1)}=\frac{1}{k}+\frac{1}{k+1}$
    - id: c
      text: $\frac{1}{k(k+1)}=\frac{1}{k-1}-\frac{1}{k}$
    - id: d
      text: $\frac{1}{k(k+1)}=\frac{1}{k^2}+\frac{1}{k}$
    answer:
      choiceId: a
    hint: 'Combine the proposed difference over the common denominator.

      '
    explanation: "$$ \n\\frac{1}{k}-\\frac{1}{k+1}\n=\n\\frac{k+1-k}{k(k+1)}\n=\n\\\
      frac{1}{k(k+1)}.\n$$\n\nRelated topic: partial fractions designed for telescoping.\n"
  - id: step-telescoping-engineering-2
    title: Expose neighboring cancellation
    instruction: 'Write the first several transformed terms before trying to sum them.

      '
    type: multipleChoice
    prompt: Which expansion shows the cancellation pattern?
    choices:
    - id: a
      text: $(1-\frac12)+(\frac12-\frac13)+(\frac13-\frac14)+\cdots+(\frac1n-\frac1{n+1})$
    - id: b
      text: $(1+\frac12)+(\frac12+\frac13)+\cdots$
    - id: c
      text: $1-\frac12-\frac13-\cdots-\frac1{n+1}$
    - id: d
      text: $\frac1{1^2}+\frac1{2^2}+\cdots+\frac1{n^2}$
    answer:
      choiceId: a
    hint: 'Substitute $k=1,2,3$ into $\frac1k-\frac1{k+1}$.

      '
    explanation: |
      Every interior fraction appears once positively and once negatively.

      Related topic: telescoping cancellation.
  - id: step-telescoping-engineering-3
    title: Keep only the boundary terms
    instruction: 'Cancel the interior pairs and express the result compactly.

      '
    type: symbolicResponse
    prompt: |
      Evaluate

      $$
      \sum_{k=1}^{n}\frac{1}{k(k+1)}.
      $$
    answer:
      expectedLatex: 1-\frac{1}{n+1}
      equivalenceMode: expression
      variables:
      - n
      tolerance: 0
    hint: 'The surviving terms are the first positive term and the final negative
      term.

      '
    explanation: "$$ \n\\sum_{k=1}^{n}\\frac{1}{k(k+1)}\n=\n1-\\frac{1}{n+1}\n=\n\\\
      frac{n}{n+1}.\n$$\n\nThe useful identity was not visible until each term was\
      \ decomposed into a\nneighboring difference.\n\nRelated topic: identity engineering\
      \ for telescoping sums.\n"
