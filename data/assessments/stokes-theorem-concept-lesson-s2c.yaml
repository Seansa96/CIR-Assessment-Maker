  - id: s03
    title: Choose the simplest spanning surface
    required: true
    content: A complicated boundary may be easier to evaluate using a simple surface with the same boundary. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
