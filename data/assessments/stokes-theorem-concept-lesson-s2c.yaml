  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Parametric Surfaces and Surface Integrals if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Boundary circulation equals curl flux
    required: true
    content: "Stokes' Theorem connects a line integral around an oriented boundary to curl through any compatible surface. In Stokes' Theorem, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object."
