    - type: image
      src: /media/calculus-3/stokes-theorem.svg
      alt: Original stokes' theorem reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What theorem links boundary circulation and curl flux?
      choices:
      - id: a
        text: Stokes' Theorem
        media: []
        issueSignals: []
      - id: b
        text: compatible orientation (answers 'What does the boundary curve need?', not 'What theorem links boundary circulation and curl flux?')
        media: []
        issueSignals:
        - id: stokes-orientation-theorem-selection-error
          domains: []
      - id: c
        text: right-hand rule (answers 'What rule links normal and boundary direction?', not 'What theorem links boundary circulation and curl flux?')
        media: []
        issueSignals:
        - id: stokes-orientation-theorem-selection-error
          domains: []
      - id: d
        text: curl (answers 'What field operation appears in Stokes' Theorem?', not 'What theorem links boundary circulation and curl flux?')
        media: []
        issueSignals:
        - id: stokes-orientation-theorem-selection-error
          domains: []
