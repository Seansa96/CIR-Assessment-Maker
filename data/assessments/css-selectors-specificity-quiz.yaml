schemaVersion: 1
id: css-selectors-specificity-quiz
title: Specificity and Selectors Quiz
assessmentType: quiz
categoryId: css
subcategoryIds:
  - css-selectors-specificity
modeDefault: study
randomizeQuestions: true
questions:
  - id: q-tiebreaker
    title: Specificity Tiebreaker
    content: |
      When two CSS rules have the exact same specificity score and target the exact same element, how does the browser decide which rule wins?
    check:
      id: check-tiebreaker
      type: multipleChoice
      choices:
        - id: a
          text: The rule with the most element selectors wins.
        - id: b
          text: The rule declared first in the stylesheet wins.
        - id: c
          text: The rule declared last in the stylesheet wins.
        - id: d
          text: The browser randomly selects one to apply.
      answer:
        choiceId: c
      explanation: |
        The cascading nature of CSS means that when specificity is tied, the rule that appears later (or last) in the CSS code overrides the earlier ones.

  - id: q-cloze-adjacent
    title: Adjacent Sibling Selector
    content: |
      You want to style only the `<p>` element that immediately follows an `<h1>` element, without affecting any other `<p>` elements on the page.
    check:
      id: check-cloze-adjacent
      type: freeResponse
      prompt: "Type the exact CSS selector needed to target this paragraph:"
      answer:
        gradingMode: selfCheck
      explanation: |
        The correct selector is `h1 + p`. The `+` combinator targets the adjacent sibling immediately following the first element.
