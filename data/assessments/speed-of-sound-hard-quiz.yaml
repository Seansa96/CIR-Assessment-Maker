questions:
- id: q001
  type: numericResponse
  prompt: A sound speed of 349 m/s is measured in air. Using $v=331+0.60T$, what air temperature in degrees C is inferred?
  answer: { value: 30, tolerance: 0.2 }
  explanation: |
    Solution: $T=(349-331)/0.60=30.0$ degrees C.

    Why it works: The temperature-dependent speed model is rearranged to infer the medium condition from a measured propagation speed.
  difficultyDimensions: [reverseReasoning, modelOrDerivation, unitAnalysis]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q002
  type: numericResponse
  prompt: Air is at 10 degrees C. A 500 Hz sound takes 2.0 s to reach a cliff and its echo returns 2.0 s later. Using $v=331+0.60T$, what distance in m is the cliff away?
  answer: { value: 337, tolerance: 1 }
  explanation: |
    Solution: $v=331+0.60(10)=337$ m/s. The 2.0 s is the round-trip time, so $d=v(2.0)/2=337$ m.

    Why it works: Echo time covers a trip to the cliff and back, requiring a factor of one-half after the temperature speed correction.
  difficultyDimensions: [multiStep, assumptionCheck, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q003
  type: numericResponse
  prompt: Air is at -5 degrees C. What wavelength in m does a 440 Hz tuning fork produce, using $v=331+0.60T$?
  answer: { value: 0.7455, tolerance: 0.01 }
  explanation: |
    Solution: $v=331+0.60(-5)=328$ m/s, then $\lambda=v/f=328/440=0.7455$ m.

    Why it works: Temperature first determines sound speed; the wave relation then converts that speed and frequency into wavelength.
  difficultyDimensions: [multiStep, signConvention, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
- id: q004
  type: multipleChoice
  prompt: A student uses $d=vt$ for an echo experiment but reports the total source-to-wall-and-back distance as the wall distance. What correction is required?
  choices:
  - { id: a, text: Divide the computed distance by 2. }
  - { id: b, text: Double the computed distance. }
  - { id: c, text: Replace sound speed with light speed. }
  - { id: d, text: Remove time from the model. }
  answer: { choiceId: a }
  explanation: |
    Solution: Divide the computed distance by 2.

    Why it works: The echo path has equal outward and return legs, so $vt$ is twice the one-way wall distance.

    Why the other choices fail: Doubling worsens the round-trip error, and neither light speed nor removing time represents the sound-echo model.
  difficultyDimensions: [errorDiagnosis, representationTransfer, causalReasoning]
  extensionObjectiveIds: [phys1-obj-sound-propagation-foundations]
