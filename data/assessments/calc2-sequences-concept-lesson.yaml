lesson:
  introduction: "A **Sequence** is an ordered list of numbers. \nUnlike a continuous\
    \ function $f(x)$ defined for all real numbers, a sequence $a_n$ is only defined\
    \ for integers $n = 1, 2, 3, \\dots$.\n"
  sections:
  - id: definition
    title: Defining a Sequence
    required: true
    content: 'A sequence can be defined explicitly or recursively.


      **Explicit Formula:**

      $a_n = \frac{n}{n+1}$

      Plugging in $n=1, 2, 3\dots$ gives the sequence: $\frac{1}{2}, \frac{2}{3},
      \frac{3}{4}, \dots$


      **Recursive Formula:**

      $a_1 = 1$, $a_n = 2a_{n-1}$

      This gives: $1, 2, 4, 8, \dots$

      '
    check:
      id: definition-check
      type: numericResponse
      issueSignals:
      - id: expression-equation-recognition-error
      - id: algebraic-simplification-error
      - id: geometric-series-convergence-error
      - id: limit-evaluation-error
      - id: exponent-rule-misapplied
      - id: function-analysis-error
      skills:
      - sequences
      prompt: If $a_n = (-1)^n \cdot n^2$, what is the 3rd term, $a_3$?
      answer:
        value: -9
        tolerance: 0.1
      explanation: '$a_3 = (-1)^3 \cdot (3)^2 = -1 \cdot 9 = -9$. The $(-1)^n$ term
        makes the sequence alternate between positive and negative.

        '
  - id: limits
    title: Limits and Convergence
    required: true
    content: 'A sequence **converges** to a limit $L$ if the terms approach $L$ as
      $n \to \infty$.

      $$ \lim_{n \to \infty} a_n = L $$


      If the limit does not exist (e.g., the terms grow infinitely large, or alternate
      forever like $1, -1, 1, -1\dots$), the sequence **diverges**.


      You can use all your knowledge of continuous limits (like L''Hôpital''s Rule)
      on sequences! Just replace $n$ with $x$ and evaluate $\lim_{x \to \infty} f(x)$.
      If the continuous function converges, the sequence converges to the same value.

      '
    check:
      id: limits-check
      type: numericResponse
      issueSignals:
      - id: expression-equation-recognition-error
      - id: algebraic-simplification-error
      - id: geometric-series-convergence-error
      - id: limit-evaluation-error
      - id: exponent-rule-misapplied
      - id: function-analysis-error
      skills:
      - sequences
      prompt: What does the sequence $a_n = \frac{3n^2 - 1}{2n^2 + n}$ converge to?
      answer:
        value: 1.5
        tolerance: 0.01
      explanation: 'Take the limit as $n \to \infty$. The highest power of $n$ is
        $n^2$ in both numerator and denominator. The limit is the ratio of their coefficients:
        $3/2 = 1.5$.

        '
  - id: squeeze-theorem
    title: The Squeeze Theorem
    required: true
    content: 'If you have a difficult sequence $b_n$, and you can trap it between
      two simpler sequences $a_n$ and $c_n$ (so $a_n \le b_n \le c_n$), and both $a_n$
      and $c_n$ converge to the exact same limit $L$, then $b_n$ must also converge
      to $L$.


      **Example:** $a_n = \frac{\sin n}{n}$

      Since $-1 \le \sin n \le 1$, we know that:

      $$ -\frac{1}{n} \le \frac{\sin n}{n} \le \frac{1}{n} $$

      As $n \to \infty$, both $-1/n$ and $1/n$ approach 0. Therefore, by the Squeeze
      Theorem, $\frac{\sin n}{n} \to 0$.

      '
    check:
      id: squeeze-theorem-check
      type: multipleChoice
      issueSignals:
      - id: expression-equation-recognition-error
      - id: algebraic-simplification-error
      - id: geometric-series-convergence-error
      - id: limit-evaluation-error
      - id: exponent-rule-misapplied
      - id: function-analysis-error
      skills:
      - sequences
      prompt: Does $a_n = \frac{\cos(n^2)}{n^3}$ converge or diverge?
      choices:
      - id: a
        text: Converges to 0
      - id: b
        text: Diverges to infinity
      - id: c
        text: Diverges by oscillation
      - id: d
        text: Converges to 1
      answer:
        choiceId: a
      explanation: 'Because $-1 \le \cos(n^2) \le 1$, the sequence is trapped between
        $-1/n^3$ and $1/n^3$. As $n \to \infty$, both outer sequences go to 0.

        '
