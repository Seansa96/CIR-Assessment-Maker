questions:
- id: q001
  type: multipleChoice
  prompt: If $z=f(x,y)$ and x,y depend on t, which formula is correct?
  choices:
  - id: a
    text: $dz/dt=f_x dx/dt+f_y dy/dt$
  - id: b
    text: $dz/dt=f_x+f_y$
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: $dz/dt=dx/dt+dy/dt$
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: $dz/dt=f_{xy}$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Each dependency path contributes a rate product.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Choice b, ''$dz/dt=f_x+f_y$'', does not give ''$dz/dt=f_x dx/dt+f_y dy/dt$'' for ''If $z=f(x,y)$
    and x,y depend on t, which formula is correct?''. It substitutes a different result, representation, or condition for
    the one the prompt specifies.

    Choice c, ''$dz/dt=dx/dt+dy/dt$'', does not give ''$dz/dt=f_x dx/dt+f_y dy/dt$'' for ''If $z=f(x,y)$ and x,y depend on
    t, which formula is correct?''. It substitutes a different result, representation, or condition for the one the prompt
    specifies.

    Choice d, ''$dz/dt=f_{xy}$'', does not give ''$dz/dt=f_x dx/dt+f_y dy/dt$'' for ''If $z=f(x,y)$ and x,y depend on t, which
    formula is correct?''. It substitutes a different result, representation, or condition for the one the prompt specifies.'
- id: q002
  type: multipleChoice
  prompt: For $z=x+y$ with x=t and y=t^2, what is dz/dt at t=2?
  choices:
  - id: a
    text: '5'
  - id: b
    text: 3 (answers 'For f=x^2+y^2, what is f(1,2)-f(0,0)?', not 'For $z=x+y$ with x=t and y=t^2, what is dz/dt at t=2?')
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: 4 (answers 'A potential f has f(A)=7 and f(B)=3. What is the integral of grad f from A to B?', not 'For $z=x+y$
      with x=t and y=t^2, what is dz/dt at t=2?')
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: '6'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
