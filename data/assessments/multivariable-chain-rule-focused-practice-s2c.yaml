    Calculus.

    Why the other choices fail: Choice b, ''3'', does not give ''5'' for ''For $z=x+y$ with x=t and y=t^2, what is dz/dt at
    t=2?''. It substitutes a different result, representation, or condition for the one the prompt specifies.

