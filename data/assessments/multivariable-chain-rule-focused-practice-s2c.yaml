questions:
- id: q001
  type: multipleChoice
  prompt: If $z=f(x,y)$ and x,y depend on t, which formula is correct?
  choices:
  - id: a
    text: $dz/dt=f_x dx/dt+f_y dy/dt$
  - id: b
    text: $dz/dt=f_x+f_y$
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: $dz/dt=dx/dt+dy/dt$
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: $dz/dt=f_{xy}$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Each dependency path contributes a rate product.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
    Calculus.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
