questions:
  - id: q001
    type: multipleChoice
    prompt: 'For an object $A$, observer $B$, and ground $G$, which expression gives the velocity of $A$ relative to $B$?'
    choices:
      - id: a
        text: '$\vec v_{A/B}=\vec v_{A/G}-\vec v_{B/G}$'
      - id: b
        text: '$\vec v_{A/B}=\vec v_{B/G}-\vec v_{A/G}$'
        issueSignals: [{id: relative-velocity-frame-error, domains: [relative-motion, frame-labeling]}]
      - id: c
        text: '$\vec v_{A/B}=\vec v_{A/G}+\vec v_{B/G}$'
        issueSignals: [{id: relative-velocity-frame-error, domains: [relative-motion, vector-addition]}]
      - id: d
        text: '$\vec v_{A/B}=\vec v_{A/G}$'
        issueSignals: [{id: relative-velocity-frame-error, domains: [relative-motion, frame-labeling]}]
    answer:
      choiceId: a
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    subjectDifficultyTags: [frame-labeling]
    difficultyEvidence: Interprets the order of nested reference-frame labels and the observer subtraction.
    prerequisiteObjectiveIds: [phys1-relative-motion-frame-equation]
    explanation: |
      Solution: Change from the ground frame to observer $B$'s frame by subtracting $B$'s ground velocity:

      $$
      \vec v_{A/B}=\vec v_{A/G}-\vec v_{B/G}.
      $$

      Why it works: An observer moving with $B$ treats $B$ as stationary, so the observer's motion is removed from the ground-frame velocity.
      Why the other choices fail: Choice b gives the velocity of $B$ relative to $A$; choice c adds instead of removing observer motion; choice d ignores that the observer is moving.
  - id: q002
    type: numericResponse
    prompt: 'A boat moves due north at $12 \text{m/s}$ relative to the water while the water flows due east at $5.0 \text{m/s}$. What is the boat''s ground-speed magnitude in $\text{m/s}$?'
    answer:
      value: 13
      tolerance: 0.01
    difficultyDimensions: [modelOrDerivation, representationTransfer]
    subjectDifficultyTags: [vector-components]
    difficultyEvidence: Combines perpendicular velocity components into a ground-speed magnitude.
    prerequisiteObjectiveIds: [phys1-relative-motion-frame-equation]
    explanation: |
      Solution:

      $$
      |\vec v_{B/G}|=sqrt{12^2+5.0^2}=13 \text{m/s}.
      $$

      Why it works: The northward boat velocity and eastward current are perpendicular components of the boat's ground velocity.
  - id: q003
    type: numericResponse
    prompt: 'A boat is pointed directly across a $150 \text{m}$-wide river at $6.0 \text{m/s}$ relative to the water. The current is $2.0 \text{m/s}$ downstream. How far downstream does it land, in meters?'
    answer:
      value: 50
      tolerance: 0.01
    difficultyDimensions: [modelOrDerivation, domainCondition]
    subjectDifficultyTags: [independent-components]
    difficultyEvidence: Selects the across-river component for time and then uses the current for drift.
    prerequisiteObjectiveIds: [phys1-relative-motion-components]
    explanation: |
      Solution: The boat takes

      $$
      t=\frac{150}{6.0}=25 \text{s}
      $$

      to cross. Its downstream displacement is

      $$
      d=(2.0)(25)=50 \text{m}.
      $$

      Why it works: The current does not change the boat's across-river component, so it affects drift but not crossing time.
