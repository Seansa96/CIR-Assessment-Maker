workedExamples:
  - id: we-perpendicular-forces
    title: Perpendicular applied forces
    problem: 'A $2.0$ kg block on a frictionless table experiences $6.0$ N east and $8.0$ N north. Find the net-force magnitude and acceleration magnitude.'
    steps:
      - id: pf-1
        title: Combine perpendicular components
        instruction: 'The force components form a right triangle.'
        type: numericResponse
        prompt: 'What is the net-force magnitude in newtons?'
        answer: { value: 10, tolerance: 0.01 }
        explanation: 'Solution: $F_{net}=\sqrt{6.0^2+8.0^2}=10$ N.\n\nWhy it works: Perpendicular vector components combine by the Pythagorean theorem.'
      - id: pf-2
        title: Apply Newton''s second law
        instruction: 'Use the net-force magnitude.'
        type: numericResponse
        prompt: 'What is acceleration magnitude in m/s$^2$?'
        answer: { value: 5, tolerance: 0.01 }
        explanation: 'Solution: $a=F_{net}/m=10/2.0=5.0$ m/s$^2$.\n\nWhy it works: On a frictionless table the net horizontal force causes the acceleration.'
  - id: we-opposing-forces
    title: Opposing force components
    problem: 'A $4.0$ kg block experiences $15$ N east and $9.0$ N west on a frictionless table. Find the acceleration vector.'
    steps:
      - id: of-1
        title: Find signed net force
        instruction: 'Choose east as positive.'
        type: numericResponse
        prompt: 'What is the net force in the east-positive direction, in newtons?'
        answer: { value: 6, tolerance: 0.01 }
        explanation: 'Solution: $F_x=15-9.0=+6.0$ N.\n\nWhy it works: Opposite directions have opposite signs.'
      - id: of-2
        title: Find acceleration
        instruction: 'Divide signed net force by mass.'
        type: numericResponse
        prompt: 'What is acceleration in m/s$^2$ in the east-positive direction?'
        answer: { value: 1.5, tolerance: 0.01 }
        explanation: 'Solution: $a_x=6.0/4.0=+1.5$ m/s$^2$.\n\nWhy it works: The positive sign means the acceleration points east.'
