schemaVersion: 1
id: physics-forces-vectors-no-friction-worked-example
title: Applied Forces With Vectors No Friction Worked Example
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
  - physics-vectors
  - physics-motion-2d
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Building a force diagram from vectors
    problem: |
      A $12\ \text{kg}$ box sits on a horizontal surface. A person pulls on it with a $50\ \text{N}$ force at $30^\circ$ above the horizontal. Ignore friction.

      Build the force equations using vectors, including applied force, weight, gravity, and the normal reactive force.
    steps:
      - id: s001
        title: Identify the forces
        instruction: |
          Start by listing real forces acting on the box. Do not include velocity or acceleration as forces.
        type: selectAll
        prompt: |
          Which forces act on the box?
        choices:
          - id: a
            text: 'Applied pull from the person'
          - id: b
            text: 'Weight from gravity'
          - id: c
            text: 'Normal reactive force from the surface'
          - id: d
            text: 'Friction force'
        answer:
          choiceIds: [a, b, c]
        hint: |
          The problem explicitly says to ignore friction.
        explanation: |
          The active forces are the applied pull, weight, and normal reactive force. Friction is excluded by the problem statement. The normal force is a reactive contact force from the surface, perpendicular to the surface.

          Related topic: free-body diagrams. Only include interactions, not motion quantities.

      - id: s002
        title: Resolve the applied force
        instruction: |
          A force applied at an angle must be split into horizontal and vertical components before using Newton's second law by components.
        type: multipleChoice
        prompt: |
          For a $50\ \text{N}$ pull at $30^\circ$ above horizontal, which components are correct?
        choices:
          - id: a
            text: '$F_x=50\cos30^\circ$, $F_y=50\sin30^\circ$'
          - id: b
            text: '$F_x=50\sin30^\circ$, $F_y=50\cos30^\circ$'
          - id: c
            text: '$F_x=50$, $F_y=30$'
          - id: d
            text: '$F_x=50\tan30^\circ$, $F_y=50$'
        answer:
          choiceId: a
        hint: |
          The angle is measured from the horizontal.
        explanation: |
          Since the angle is measured above the horizontal, the adjacent component is horizontal and the opposite component is vertical:

          $$
          F_x=50\cos30^\circ,\qquad F_y=50\sin30^\circ.
          $$

          Numerically, $F_x\approx43.3\ \text{N}$ and $F_y=25\ \text{N}$ upward.

      - id: s003
        title: Write the weight force
        instruction: |
          Weight is the gravitational force on the object, with magnitude $mg$ downward.
        type: freeResponse
        prompt: |
          Write the weight force vector for the $12\ \text{kg}$ box if upward is positive $y$.
        answer:
          expected: |
            $\vec{W}=(0,-mg)=(0,-117.6)\ \text{N}$ using $g=9.8\ \text{m/s}^2$.
          gradingMode: selfCheck
          keyPoints:
            - Weight magnitude is $mg$.
            - Direction is downward.
            - With upward positive, the y-component is negative.
        hint: |
          Weight is not mass. Weight is force due to gravity.
        explanation: |
          Use

          $$
          W=mg=(12)(9.8)=117.6\ \text{N}.
          $$

          Since upward is positive $y$, gravity points downward:

          $$
          \vec{W}=(0,-117.6)\ \text{N}.
          $$

      - id: s004
        title: Understand the normal reactive force
        instruction: |
          The normal force is reactive: it adjusts to enforce the no-vertical-acceleration constraint as long as the box remains in contact with the surface.
        type: multipleChoice
        prompt: |
          Why is the normal force not automatically equal to $mg$ here?
        choices:
          - id: a
            text: 'The applied pull has an upward component, so the surface does not need to push up as hard.'
          - id: b
            text: 'The normal force always equals the applied force.'
          - id: c
            text: 'The box has no weight on a horizontal surface.'
          - id: d
            text: 'The normal force points horizontally.'
        answer:
          choiceId: a
        hint: |
          Look at the vertical component of the angled pull.
        explanation: |
          The applied force has upward component $F_y=25\ \text{N}$. If vertical acceleration is zero, the vertical forces must balance:

          $$
          N+25-117.6=0.
          $$

          Therefore

          $$
          N=92.6\ \text{N}.
          $$

          The normal force is reactive because it changes depending on other vertical forces.

      - id: s005
        title: Write the component equations
        instruction: |
          Apply Newton's second law separately in the horizontal and vertical directions.
        type: freeResponse
        prompt: |
          Write the $x$ and $y$ force equations for the box, ignoring friction and assuming it stays on the surface.
        answer:
          expected: |
            $x$: $50\cos30^\circ=ma_x$. $y$: $N+50\sin30^\circ-mg=0$ because $a_y=0$.
          gradingMode: selfCheck
          keyPoints:
            - Horizontal net force is the horizontal applied component.
            - Vertical acceleration is zero while the box stays on the surface.
            - Normal plus vertical pull balances weight.
        hint: |
          Use $\sum F_x=ma_x$ and $\sum F_y=ma_y$.
        explanation: |
          In the horizontal direction, there is no friction, so

          $$
          \sum F_x=50\cos30^\circ=ma_x.
          $$

          In the vertical direction, the box does not leave the surface, so $a_y=0$:

          $$
          \sum F_y=N+50\sin30^\circ-mg=0.
          $$

          This is the core vector workflow: resolve forces, sum components, then apply constraints.

      - id: s006
        title: Solve the horizontal acceleration
        instruction: |
          Once the horizontal component equation is written, solve for acceleration.
        type: multipleChoice
        prompt: |
          What is the horizontal acceleration?
        choices:
          - id: a
            text: '$a_x\approx3.61\ \text{m/s}^2$'
          - id: b
            text: '$a_x\approx4.17\ \text{m/s}^2$'
          - id: c
            text: '$a_x\approx9.8\ \text{m/s}^2$'
          - id: d
            text: '$a_x=0$'
        answer:
          choiceId: a
        hint: |
          Divide the horizontal force component by mass.
        explanation: |
          The horizontal force is

          $$
          F_x=50\cos30^\circ\approx43.3\ \text{N}.
          $$

          Newton's second law gives

          $$
          a_x=\frac{F_x}{m}=\frac{43.3}{12}\approx3.61\ \text{m/s}^2.
          $$

          Gravity does not directly affect horizontal acceleration in this no-friction setup.

      - id: s007
        title: Check the lift-off condition
        instruction: |
          If the upward applied component exceeds weight, the normal force would become zero and the contact assumption breaks.
        type: multipleChoice
        prompt: |
          What condition would mean the box just loses contact with the surface?
        choices:
          - id: a
            text: '$F_y=mg$'
          - id: b
            text: '$F_x=mg$'
          - id: c
            text: '$N=mg$'
          - id: d
            text: '$a_x=0$'
        answer:
          choiceId: a
        hint: |
          At loss of contact, the normal force drops to zero.
        explanation: |
          The vertical equation while in contact is

          $$
          N+F_y-mg=0.
          $$

          At the threshold of losing contact, $N=0$, so

          $$
          F_y=mg.
          $$

          If $F_y>mg$, the surface no longer needs to push upward; the box accelerates upward instead. This is why normal force is reactive, not fixed.
