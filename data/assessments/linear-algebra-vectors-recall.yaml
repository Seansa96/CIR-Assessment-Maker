  - linear-algebra-vectors
skills:
- Apply linear-algebra concepts
- Apply Vectors and Matrix Basics
  - matrix-multiplication
  - linear-combinations
  - matrix-transpose
items:
  - id: linear-combination-definition-cloze
    type: cloze
    prompt: |
      An expression of the form $c_1\vec{v}_1 + c_2\vec{v}_2 + \dots + c_p\vec{v}_p$ is called a \_\_\_\_ of the vectors $\vec{v}_1, \dots, \vec{v}_p$.
    answer:
      expected: linear combination
      aliases:
        - linear combinations
    tags:
      - linear-combinations

  - id: matrix-mult-dimensions-typed
    type: typed
    prompt: |
      If matrix $A$ has dimensions $m \times n$ and matrix $B$ has dimensions $n \times p$, what are the dimensions of the product matrix $AB$? (Format as "m x p")
    answer:
      expected: m x p
      aliases:
        - m by p
        - m*p
    tags:
      - matrix-multiplication

  - id: matrix-vector-product-columns-flashcard
    type: flashcard
    prompt: |
      What does the matrix-vector product $A\vec{x}$ represent conceptually in terms of the columns of $A$?
    answer:
      expected: It represents a linear combination of the columns of $A$, using the entries in $\vec{x}$ as weights.
    tags:
      - matrix-vector-product
      - linear-combinations

  - id: matrix-mult-commutativity-flashcard
    type: flashcard
    prompt: |
      In general matrix algebra, does $AB = BA$?
    answer:
      expected: No. Matrix multiplication is generally not commutative.
    tags:
      - matrix-multiplication

  - id: matrix-transpose-product-symbolic
    type: symbolic
    prompt: |
      What is the formula for the transpose of a product of two matrices, $(AB)^T$?
    answer:
      expectedLatex: 'B^T A^T'
    tags:
      - matrix-transpose

  - id: vector-addition-geometry-typed
    type: typed
    prompt: |
      Geometrically, adding two vectors $\vec{u}$ and $\vec{v}$ in $\mathbb{R}^2$ forms what shape if we draw them originating from the same point? The result $\vec{u}+\vec{v}$ is the diagonal of a \_\_\_\_.
    answer:
      expected: parallelogram
    tags:
      - vector-addition
