      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-special-factorizations-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: create a known pattern, factor by grouping, add zero intentionally. Record the givens, unknown, and any restriction before selecting a method.'
