lesson:
  introduction: |-
    Clever algebra is not a collection of tricks. It is the deliberate choice of a representation that places the known information and the requested expression inside the same identity. This lesson develops that choice: when to factor instead of expand, how symmetric and reciprocal expressions compress, and why every cancellation or denominator-clearing step carries a condition.
  sections:
  - id: structure-before-computation
    title: Search for structure before computing
    required: true
    content: |-
      Direct computation often hides relationships. For example,

      $$1003^2-997^2$$

      invites two large squares, but its form $A^2-B^2$ exposes

      $$(A-B)(A+B)=6\cdot2000=12000.$$

      The factorization is useful because the difference and sum are easier than either square. The general habit is to compare the operations and exponents in the target with a small library of identities before expanding.
    check:
      id: structure-before-computation-check
      type: multipleChoice
      prompt: Which first step most efficiently evaluates $5002^2-4998^2$?
      choices:
      - id: a
        text: Compute both squares separately.
      - id: b
        text: Rewrite it as $(5002-4998)(5002+4998)$.
      - id: c
        text: Rewrite it as $(5002-4998)^2$.
      - id: d
        text: Divide both terms by $5000$.
      answer:
        choiceId: b
      explanation: Difference of squares turns the expression into $4\cdot10000$.
  - id: squares-and-near-squares
    title: Squares, differences of squares, and near-squares
    required: true
    content: |-
      The identities

      $$(a+b)^2=a^2+2ab+b^2,$$
      $$(a-b)^2=a^2-2ab+b^2,$$
      $$a^2-b^2=(a-b)(a+b)$$

      are verified by multiplication and therefore hold for all real or complex $a,b$. They also explain useful near-square computations: $99^2=(100-1)^2=10000-200+1$.

      The third identity requires subtraction. Over the reals, $a^2+b^2$ generally does not factor into real linear factors. A visual resemblance is not enough; expand a proposed factorization to test it.
    check:
      id: squares-and-near-squares-check
      type: multipleChoice
      prompt: Which expression is identically equal to $x^2+10x+25$?
      choices:
      - id: a
        text: '$(x+5)^2$'
      - id: b
        text: '$(x-5)^2$'
      - id: c
        text: '$(x+25)(x+1)$'
      - id: d
        text: '$(x+10)^2$'
      answer:
        choiceId: a
      explanation: The middle term of $(x+5)^2$ is $2(5)x=10x$.
  - id: sums-and-differences-of-cubes
    title: The alternating signs in cube factorizations
    required: true
    content: |-
      Cubes factor as

      $$a^3-b^3=(a-b)(a^2+ab+b^2),$$
      $$a^3+b^3=(a+b)(a^2-ab+b^2).$$

      A reliable sign memory is “same sign, opposite sign, always positive”: the binomial uses the original sign, the middle term of the quadratic uses the opposite sign, and the last term is positive. Expansion is the proof and the fastest way to correct a sign mistake because the mixed cubic terms must cancel.
    check:
      id: cube-factorizations-check
      type: multipleChoice
      prompt: Factor $8x^3+27$.
      choices:
      - id: a
        text: '$(2x+3)(4x^2-6x+9)$'
      - id: b
        text: '$(2x+3)(4x^2+6x+9)$'
      - id: c
        text: '$(2x-3)(4x^2+6x+9)$'
      - id: d
        text: '$(2x+3)(2x^2-3x+9)$'
      answer:
        choiceId: a
      explanation: Use $a^3+b^3=(a+b)(a^2-ab+b^2)$ with $a=2x$ and $b=3$.
  - id: grouping-and-purposeful-zero
    title: Grouping and adding zero on purpose
    required: true
    content: |-
      Some expressions become factorable only after terms are grouped by a shared binomial:

      $$ax+ay+bx+by=a(x+y)+b(x+y)=(a+b)(x+y).$$

      A more creative version adds and subtracts the same term. This preserves equality while creating a recognizable block. For instance, completing a square rewrites

      $$x^2+6x=x^2+6x+9-9=(x+3)^2-9.$$

      The added term is not arbitrary: it is chosen because half the linear coefficient, squared, completes the binomial square.
    check:
      id: grouping-and-purposeful-zero-check
      type: multipleChoice
      prompt: Which rewrite begins a valid factorization of $x^3+x^2+2x+2$ by grouping?
      choices:
      - id: a
        text: '$x^2(x+1)+2(x+1)$'
      - id: b
        text: '$x(x^2+1)+2(x+1)$'
      - id: c
        text: '$(x^3+x)(x^2+2)$'
      - id: d
        text: '$x^2(x+2)+(x+2)$'
      answer:
        choiceId: a
      explanation: Both groups contain $x+1$, giving $(x+1)(x^2+2)$.
  - id: symmetric-expressions
    title: Compress symmetric information into sum and product
    required: true
    content: |-
      An expression is symmetric in $a,b$ if swapping the variables leaves it unchanged. When a problem gives $s=a+b$ and $p=ab$, many symmetric targets can be computed without finding $a$ or $b$:

      $$a^2+b^2=s^2-2p,$$
      $$a^3+b^3=s^3-3ps.$$

      These follow by expanding $(a+b)^2$ and $(a+b)^3$. The representation matters: knowing only $a+b$ does not usually determine $a^2+b^2$, because the product $ab$ is also needed.
    check:
      id: symmetric-expressions-check
      type: multipleChoice
      prompt: If $a+b=7$ and $ab=10$, what is $a^3+b^3$?
      choices:
      - id: a
        text: '$133$'
      - id: b
        text: '$203$'
      - id: c
        text: '$273$'
      - id: d
        text: '$343$'
      answer:
        choiceId: a
      explanation: $a^3+b^3=(a+b)^3-3ab(a+b)=343-210=133$.
  - id: reciprocal-power-ladders
    title: Build reciprocal powers without solving for the variable
    required: true
    content: |-
      If $x+1/x=t$, then $x\ne0$ is already required. Squaring gives

      $$x^2+\frac1{x^2}=t^2-2.$$

      Higher powers can be built from lower ones. If $R_n=x^n+x^{-n}$, multiplying $R_n$ by $R_1=t$ gives

      $$R_{n+1}+R_{n-1}=tR_n,$$

      so $R_{n+1}=tR_n-R_{n-1}$. This recurrence keeps the work inside symmetric reciprocal expressions and avoids solving a quadratic for $x$.
    check:
      id: reciprocal-power-ladders-check
      type: multipleChoice
      prompt: If $x+1/x=3$, what is $x^2+1/x^2$?
      choices:
      - id: a
        text: '$5$'
      - id: b
        text: '$7$'
      - id: c
        text: '$9$'
      - id: d
        text: '$11$'
      answer:
        choiceId: b
      explanation: Squaring gives $x^2+2+1/x^2=9$, so the target is $7$.
  - id: restrictions-cancellation-and-verification
    title: Preserve restrictions and verify every identity
    required: true
    content: |-
      Factoring can reveal cancellation, but cancellation is division and therefore requires a nonzero factor. For example,

      $$\frac{x^2-1}{x-1}=\frac{(x-1)(x+1)}{x-1}=x+1$$

      only for $x\ne1$. The simplified expression extends to $x=1$, but the original fraction does not.

      Similarly, cancelling $x$ from $x(x-1)=x(x-2)$ loses the possible case $x=0$. A safe solution branches: either $x=0$, or $x\ne0$ and division is allowed. Verification by expansion, substitution, and domain checking turns a clever rewrite into a rigorous argument.
    check:
      id: restrictions-cancellation-and-verification-check
      type: multipleChoice
      prompt: What is the correct conclusion from $x(x-1)=x(x-2)$?
      choices:
      - id: a
        text: '$x-1=x-2$, so there is no solution.'
      - id: b
        text: '$x=0$ is a solution; division by $x$ is legal only in the separate case $x\ne0$.'
      - id: c
        text: Every real $x$ is a solution.
      - id: d
        text: '$x=1$ and $x=2$ are the only solutions.'
      answer:
        choiceId: b
      explanation: Moving all terms to one side gives $x[(x-1)-(x-2)]=x=0$.
