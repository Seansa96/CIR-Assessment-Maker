lesson:
  introduction: Learn to solve Special Factorizations and Clever Manipulations problems by recognizing difference of squares, sum and difference of cubes, clever grouping, identity forcing and justifying each theorem or transformation.
  sections:
  - id: aops-special-factorizations-motivation
    title: What the topic helps you notice
    required: true
    content: Special Factorizations and Clever Manipulations is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are difference of squares, sum and difference of cubes, clever grouping, identity forcing.
    check:
      id: aops-special-factorizations-motivation-check
      type: multipleChoice
      prompt: In Special Factorizations and Clever Manipulations, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-special-factorizations-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-special-factorizations-definitions-check
      type: multipleChoice
      prompt: In Special Factorizations and Clever Manipulations, what should be checked before applying a method?
      choices:
