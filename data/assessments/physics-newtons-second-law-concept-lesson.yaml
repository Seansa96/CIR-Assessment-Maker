id: physics-newtons-second-law-concept-lesson
title: Newton's Second Law Concept Lesson
assessmentType: conceptLesson
categoryId: physics-1
subcategoryIds:
- physics-newton-laws
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - newtons-second-law
  - net-force
  - momentum
lesson:
  introduction: 'Newton''s Second Law connects external interactions to changes in
    motion. This lesson

    develops both the momentum form and the familiar constant-mass form, then turns
    them

    into a repeatable force-modeling procedure.

    '
  sections:
  - id: momentum-form
    title: The general momentum statement
    required: true
    content: 'The general Newtonian statement is


      $$

      \sum\vec{F}_{\text{ext}}=\frac{d\vec{p}}{dt}.

      $$


      It says the net external force controls the rate of change of momentum. Internal

      forces between parts of the chosen system do not appear in the external-force
      sum.

      '
    check:
      id: momentum-form-check
      type: multipleChoice
      prompt: What quantity changes at a rate equal to the net external force?
      choices:
      - id: a
        text: Momentum
      - id: b
        text: Position
      - id: c
        text: Mass in every problem
      - id: d
        text: Kinetic energy in every problem
      answer:
        choiceId: a
      explanation: 'Newton''s Second Law is most generally $\sum\vec{F}_{ext}=d\vec{p}/dt$.


        Related topic: momentum and system boundaries.

        '
  - id: constant-mass-derivation
    title: Derive the constant-mass form
    required: true
    content: 'With $\vec{p}=m\vec{v}$,


      $$

      \frac{d\vec{p}}{dt}

      =\frac{d}{dt}(m\vec{v})

      =m\frac{d\vec{v}}{dt}+\vec{v}\frac{dm}{dt}.

      $$


      If the system mass is constant, $dm/dt=0$, so


      $$

      \sum\vec{F}=m\vec{a}.

      $$


      This familiar form is therefore a constant-mass specialization.

      '
    check:
      id: constant-mass-derivation-check
      type: multipleChoice
      prompt: Which assumption removes the term $\vec{v}\,dm/dt$?
      choices:
      - id: a
        text: The chosen system has constant mass.
      - id: b
        text: The object has zero velocity.
      - id: c
        text: The net force is zero.
      - id: d
        text: The acceleration is constant.
      answer:
        choiceId: a
      explanation: 'Constant mass means $dm/dt=0$, leaving $d\vec{p}/dt=m\vec{a}$.


        Related topic: product rule and momentum dynamics.

        '
  - id: vector-components
    title: Apply the law component by component
    required: true
    content: 'Newton''s Second Law is a vector equation:


      $$

      \sum F_x=ma_x,\qquad

      \sum F_y=ma_y,\qquad

      \sum F_z=ma_z.

      $$


      Choose axes that simplify the constraints. On an incline, axes parallel and

      perpendicular to the surface often reduce the number of components.

      '
    media:
    - type: image
      src: /assessments/physics-dynamics/free-body-force-model.svg
      alt: Free-body diagram showing normal force, weight, applied force, and friction
        on a block.
      caption: Resolve real forces along chosen axes before summing them.
    check:
      id: vector-components-check
      type: selectAll
      prompt: Which steps belong in a reliable Newton's Second Law solution?
      choices:
      - id: a
        text: Isolate the object or system.
      - id: b
        text: Draw external interaction forces.
      - id: c
        text: Resolve forces into components.
      - id: d
        text: Add velocity as a force in the direction of motion.
      answer:
        choiceIds:
        - a
        - b
        - c
      explanation: 'Velocity is not a force. The other three steps establish the model
        before algebra.


        Related topic: free-body diagrams and component equations.

        '
  - id: net-force-not-single-force
    title: Net force is the vector sum
    required: true
    content: 'The acceleration points with the **net** force, not necessarily with
      any one force.

      For a\rhorizontal object,


      $$

      F_{\text{app}}-f=ma_x

      $$


      may determine\rhorizontal acceleration while


      $$

      N-mg=ma_y

      $$


      enforces the vertical constraint.

      '
    check:
      id: net-force-not-single-force-check
      type: multipleChoice
      prompt: A 20 N force acts right and a 7 N force acts left. What is the\rhorizontal
        net force?
      choices:
      - id: a
        text: 13 N right
      - id: b
        text: 27 N right
      - id: c
        text: 13 N left
      - id: d
        text: 0 N
      answer:
        choiceId: a
      explanation: 'With right positive, $\sum F_x=20-7=13\ \text{N}$.


        Related topic: signed force components.

        '
  - id: unit-derivation
    title: Derive the unit of force
    required: true
    content: 'From $F=ma$,


      $$

      [F]=\text{kg}\cdot\frac{\text{m}}{\text{s}^2}.

      $$


      One newton is defined as


      $$

      1\ \text{N}=1\ \text{kg}\cdot\text{m/s}^2.

      $$


      Dimensional checking catches many missing-mass or missing-acceleration errors.

      '
    check:
      id: unit-derivation-check
      type: multipleChoice
      prompt: Which base-unit expression is equivalent to one newton?
      choices:
      - id: a
        text: $\text{kg}\cdot\text{m/s}^2$
      - id: b
        text: $\text{kg}\cdot\text{m/s}$
      - id: c
        text: $\text{kg/s}^2$
      - id: d
        text: $\text{m}^2/\text{s}^2$
      answer:
        choiceId: a
      explanation: 'Force equals mass times acceleration, giving $\text{kg}\cdot\text{m/s}^2$.


        Related topic: dimensional analysis.

        '
  - id: constraints
    title: Constraints determine some acceleration components
    required: true
    content: 'If an object remains on a\rhorizontal surface, $a_y=0$, even while it
      accelerates

     \rhorizontally. Therefore,


      $$

      \sum F_y=0.

      $$


      This equation often determines the normal force. Do not automatically set $N=mg$;

      an angled applied force or vertical acceleration can change $N$.

      '
    check:
      id: constraints-check
      type: multipleChoice
      prompt: 'A box stays on a\rhorizontal floor while being pulled upward at an angle.

        Compared with $mg$, the normal force is generally:

        '
      choices:
      - id: a
        text: Smaller, because the upward pull supports part of the weight
      - id: b
        text: Always equal
      - id: c
        text: Larger for every upward pull
      - id: d
        text: Zero
      answer:
        choiceId: a
      explanation: 'Vertical balance gives $N+F_{\text{app},y}-mg=0$, so

        $N=mg-F_{\text{app},y}$.


        Related topic: constraint equations and normal force.

        '
  - id: numerical-synthesis
    title: Calculate acceleration from the model
    required: true
    content: 'Once the force model is complete, calculate the vector sum and divide
      by mass.

      Keep signs consistent with the chosen axis.

      '
    check:
      id: numerical-synthesis-check
      type: numericResponse
      prompt: 'A $5.0\ \text{kg}$ object has a net\rhorizontal force of $15\ \text{N}$.

        Enter its acceleration magnitude in $\text{m/s}^2$.

        '
      answer:
        value: 3
        tolerance: 0.001
      explanation: '$$

        a=\frac{F_{\text{net}}}{m}=\frac{15}{5.0}=3.0\ \text{m/s}^2.

        $$


        Related topic: Newton''s Second Law calculation.

        '
