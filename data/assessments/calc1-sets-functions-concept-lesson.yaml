lesson:
  introduction: |
    This lesson introduces the object language used before calculation: sets, bounds, functions, images, restrictions, inverses, and sequences as indexed functions.
  sections:
  - id: bounds
    title: Bounds and extrema
    required: true
    content: |
      A maximum must be an element of a set. A supremum only has to be the least upper bound. Open intervals are the first place where that distinction matters.
    check:
      id: bounds-check
      type: multipleChoice
      prompt: |
        For $S=(0,1)$, which statement is true?
      choices:
      - id: a
        text: $S$ has maximum $1$.
      - id: b
        text: $S$ has supremum $1$ but no maximum.
      - id: c
        text: $S$ has no upper bounds.
      - id: d
        text: $S$ has minimum $0$.
      answer:
        choiceId: b
      explanation: |
        $1$ is the least upper bound, but it is not in the set.
  - id: functions
    title: Functions include domain and codomain
    required: true
    content: |
      A formula alone is not the whole function. Domain, codomain, and assignment rule determine what inputs are allowed and what claims are being made about outputs.
    check:
      id: functions-check
      type: selectAll
      prompt: |
        Which pieces matter in a careful function definition?
      choices:
      - id: a
        text: Domain
      - id: b
        text: Codomain
      - id: c
        text: Assignment rule
      - id: d
        text: Graph color
      answer:
        choiceIds:
        - a
        - b
        - c
      explanation: |
        Domain, codomain, and rule are structural data for a function.
  - id: sequences
    title: Sequences are indexed functions
    required: true
    content: |
      A sequence is a function whose inputs are usually positive integers. That is why sequence problems focus on term behavior as $n\to\infty$.
    check:
      id: sequences-check
      type: multipleChoice
      prompt: |
        Which description best fits $(a_n)$?
      choices:
      - id: a
        text: A function from positive integers to values
      - id: b
        text: Only a finite set
      - id: c
        text: A graph that must be continuous
      - id: d
        text: A relation with no order
      answer:
        choiceId: a
      explanation: |
        The index $n$ gives order and lets us ask about long-run behavior.
