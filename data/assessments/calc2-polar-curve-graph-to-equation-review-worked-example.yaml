workedExamples:
  - id: dimpled-limacon-from-graph
    title: Construct a Dimpled Limacon Equation from a Graph
    problem: |
      ![A right-facing dimpled polar limacon with maximum radius 5 and minimum radius 1](/assessments/calc2-parametric-polar/polar-review-dimpled-limacon-3-plus-2cos.svg)

      Use the graph to identify the main features and construct a likely polar equation.
    steps:
      - id: dimpled-limacon-step-1
        title: Identify the polar family
        instruction: |
          The graph is one smooth closed polar curve with a visible indentation, but it does not pass through the pole. That shape suggests a limacon of the form

          $$
          r=a\pm b\cos\theta
          $$

          or

          $$
          r=a\pm b\sin\theta.
          $$
        type: multipleChoice
        prompt: Which polar family best matches the graph?
        choices:
          - id: a
            text: Limacon
          - id: b
            text: Rose curve
          - id: c
            text: Circle centered at the pole
          - id: d
            text: Spiral
        answer:
          choiceId: a
        explanation: |
          The graph has the one-loop, dented structure of a limacon. A rose curve would have separated petals, a pole-centered circle would have constant radius, and a spiral would not close after one full turn.

          Related topic: polar graph family recognition.
      - id: dimpled-limacon-step-2
        title: Determine the axis and trigonometric function
        instruction: |
          The graph is symmetric across the polar axis, meaning it is symmetric across the horizontal $x$-axis. Polar equations using $\cos\theta$ naturally emphasize left-right orientation, while equations using $\sin\theta$ naturally emphasize up-down orientation.
        type: multipleChoice
        prompt: Which function should appear in the equation?
        choices:
          - id: a
            text: '$\cos\theta$'
          - id: b
            text: '$\sin\theta$'
          - id: c
            text: '$\tan\theta$'
          - id: d
            text: '$\sec\theta$'
        answer:
          choiceId: a
        explanation: |
          A horizontal limacon is usually modeled with cosine. The graph is largest to the right and smallest to the left, so the cosine model is the most direct fit.

          Related topic: choosing sine or cosine from polar symmetry.
      - id: dimpled-limacon-step-3
        title: Read the maximum and minimum radii
        instruction: |
          For a right-facing limacon

          $$
          r=a+b\cos\theta,
          $$

          the maximum radius occurs at $\theta=0$:

          $$
          r_{\max}=a+b.
          $$

          The smallest positive radius occurs at $\theta=\pi$:

          $$
          r_{\min}=a-b.
          $$

          From the graph, the rightmost radius is about $5$, and the left dent is about $1$ from the pole.
        type: multipleChoice
        prompt: Which system matches the visible maximum and minimum radii?
        choices:
          - id: a
            text: '$a+b=5,\ a-b=1$'
          - id: b
            text: '$a+b=1,\ a-b=5$'
          - id: c
            text: '$a+b=4,\ a-b=0$'
          - id: d
            text: '$a=5,\ b=1$'
        answer:
          choiceId: a
        explanation: |
          At $\theta=0$, $\cos\theta=1$, so $r=a+b$. At $\theta=\pi$, $\cos\theta=-1$, so $r=a-b$. The graph shows those values as $5$ and $1$.

          Related topic: reading $a$ and $b$ from polar extrema.
      - id: dimpled-limacon-step-4
        title: Solve for the parameters
        instruction: |
          Solve

          $$
          a+b=5,\qquad a-b=1.
          $$

          Adding the equations gives $2a=6$, so $a=3$. Then $b=2$.
        type: numericResponse
        prompt: What is the value of $a$?
        answer:
          value: 3
          tolerance: 0
        explanation: |
          Add the two equations to eliminate $b$:

          $$
          2a=6\implies a=3.
          $$

          Then $3+b=5$, so $b=2$.
      - id: dimpled-limacon-step-5
        title: Construct the equation
        instruction: |
          The curve is right-facing and cosine-based, with $a=3$ and $b=2$. The equation should therefore be

          $$
          r=3+2\cos\theta.
          $$

          The ratio $\frac{a}{b}=\frac32$ is between $1$ and $2$, which explains the dimple without an inner loop.
        type: symbolicResponse
        prompt: Write the polar equation for the graph.
        answer:
          expectedLatex: 'r=3+2\cos\theta'
          equivalenceMode: expression
          variables:
            - r
            - theta
          tolerance: 0.000001
        explanation: |
          The positive cosine term points the largest radius toward $\theta=0$. The values $a=3$ and $b=2$ produce $r_{\max}=5$ and $r_{\min}=1$.

          Related topic: constructing limacon equations from graph features.

  - id: cardioid-from-graph
    title: Construct a Cardioid Equation from a Graph
    problem: |
      ![A downward-facing polar cardioid with cusp at the pole and maximum radius 4 downward](/assessments/calc2-parametric-polar/polar-review-cardioid-2-minus-2sin.svg)

      Use the graph to identify the main features and construct a likely polar equation.
    steps:
      - id: cardioid-step-1
        title: Recognize the cusp
        instruction: |
          A cardioid is a special limacon where $a=b$. The curve touches the pole because there is some angle where

          $$
          r=0.
          $$

          The graph has exactly one cusp at the pole, which strongly suggests a cardioid.
        type: multipleChoice
        prompt: What graph feature most strongly indicates a cardioid?
        choices:
          - id: a
            text: It has a single cusp at the pole.
          - id: b
            text: It has three separated petals.
          - id: c
            text: It has no symmetry.
          - id: d
            text: It moves outward forever.
        answer:
          choiceId: a
        explanation: |
          A cardioid has one pole contact because $a=b$ in $r=a\pm b\sin\theta$ or $r=a\pm b\cos\theta$.

          Related topic: cardioid recognition.
      - id: cardioid-step-2
        title: Determine vertical orientation
        instruction: |
          The graph is symmetric about the vertical axis and opens downward. Vertical polar curves are usually modeled with $\sin\theta$.

          The negative sign in

          $$
          r=a-b\sin\theta
          $$

          places the maximum radius downward, because $\sin(3\pi/2)=-1$.
        type: multipleChoice
        prompt: Which model matches a downward-facing cardioid?
        choices:
          - id: a
            text: '$r=a-b\sin\theta$'
          - id: b
            text: '$r=a+b\sin\theta$'
          - id: c
            text: '$r=a+b\cos\theta$'
          - id: d
            text: '$r=a-b\cos\theta$'
        answer:
          choiceId: a
        explanation: |
          A sine model handles vertical orientation. The minus sign makes the graph largest when $\sin\theta=-1$, which is downward.
      - id: cardioid-step-3
        title: Read the maximum radius
        instruction: |
          The lowest point of the graph is about $4$ units from the pole. For

          $$
          r=a-b\sin\theta,
          $$

          the maximum radius occurs at $\theta=3\pi/2$:

          $$
          r=a-b(-1)=a+b.
          $$

          Since this is a cardioid, $a=b$, so $a+b=2a$.
        type: numericResponse
        prompt: If the maximum radius is $4$ and $a=b$, what is $a$?
        answer:
          value: 2
          tolerance: 0
        explanation: |
          Since $a+b=4$ and $a=b$, we have $2a=4$, so $a=2$ and $b=2$.
      - id: cardioid-step-4
        title: Confirm the pole angle
        instruction: |
          For

          $$
          r=2-2\sin\theta,
          $$

          the curve reaches the pole when

          $$
          2-2\sin\theta=0.
          $$

          That gives $\sin\theta=1$, so $\theta=\frac{\pi}{2}$. This matches the cusp at the top of the graph.
        type: multipleChoice
        prompt: At which angle does this cardioid reach the pole?
        choices:
          - id: a
            text: '$\theta=\frac{\pi}{2}$'
          - id: b
            text: '$\theta=0$'
          - id: c
            text: '$\theta=\pi$'
          - id: d
            text: '$\theta=\frac{3\pi}{2}$'
        answer:
          choiceId: a
        explanation: |
          The equation $2-2\sin\theta=0$ requires $\sin\theta=1$, which occurs at $\theta=\frac{\pi}{2}$.

          Related topic: pole intersections of cardioids.
      - id: cardioid-step-5
        title: Construct the equation
        instruction: |
          The graph is a downward-facing cardioid with $a=b=2$. Therefore:

          $$
          r=2-2\sin\theta.
          $$
        type: symbolicResponse
        prompt: Write the polar equation for the graph.
        answer:
          expectedLatex: 'r=2-2\sin\theta'
          equivalenceMode: expression
          variables:
            - r
            - theta
          tolerance: 0.000001
        explanation: |
          The sine term gives vertical symmetry, the negative sign points the main lobe downward, and $a=b=2$ gives the cardioid cusp at the pole.

          Related topic: constructing cardioid equations from graph features.

  - id: rose-curve-from-graph
    title: Construct a Rose Curve Equation from a Graph
    problem: |
      ![A three-petal polar rose curve with petal length 4](/assessments/calc2-parametric-polar/polar-review-rose-4sin3theta.svg)

      Use the graph to identify the main features and construct a likely polar equation.
    steps:
      - id: rose-curve-step-1
        title: Recognize the petal structure
        instruction: |
          A rose curve has separated petal-like lobes and usually has a form such as

          $$
          r=a\sin(n\theta)
          $$

          or

          $$
          r=a\cos(n\theta).
          $$

          The graph shows three equal petals.
        type: multipleChoice
        prompt: Which polar family best matches the graph?
        choices:
          - id: a
            text: Rose curve
          - id: b
            text: Dimpled limacon
          - id: c
            text: Cardioid
          - id: d
            text: Archimedean spiral
        answer:
          choiceId: a
        explanation: |
          The separated lobes are the giveaway feature. Limacons and cardioids are one-piece loops, while spirals do not close into petals.
      - id: rose-curve-step-2
        title: Count petals to find $n$
        instruction: |
          For rose curves:

          - If $n$ is odd, $r=a\sin(n\theta)$ or $r=a\cos(n\theta)$ has $n$ petals.
          - If $n$ is even, it has $2n$ petals.

          The graph has $3$ petals, so the simplest value is $n=3$.
        type: numericResponse
        prompt: What is the value of $n$ in the simplest rose model?
        answer:
          value: 3
          tolerance: 0
        explanation: |
          Three petals correspond to $n=3$ because odd $n$ rose curves have $n$ petals.

          Related topic: petal count rules for rose curves.
      - id: rose-curve-step-3
        title: Read the petal length
        instruction: |
          In

          $$
          r=a\sin(n\theta)
          $$

          or

          $$
          r=a\cos(n\theta),
          $$

          the coefficient $a$ is the maximum radius, which is also the petal length. The graph's petals reach radius $4$.
        type: numericResponse
        prompt: What is the value of $a$?
        answer:
          value: 4
          tolerance: 0
        explanation: |
          The outer edge of each petal reaches $r=4$, so $a=4$.
      - id: rose-curve-step-4
        title: Choose sine or cosine
        instruction: |
          A cosine rose with $n=3$ usually has a petal centered on the positive polar axis $\theta=0$.

          A sine rose with $n=3$ reaches a maximum when

          $$
          3\theta=\frac{\pi}{2},
          $$

          so one petal is centered at $\theta=\frac{\pi}{6}$. The graph has a petal tilted above the positive polar axis rather than centered on it.
        type: multipleChoice
        prompt: Which model best fits the orientation of the graph?
        choices:
          - id: a
            text: '$r=4\sin(3\theta)$'
          - id: b
            text: '$r=4\cos(3\theta)$'
          - id: c
            text: '$r=3\sin(4\theta)$'
          - id: d
            text: '$r=3\cos(4\theta)$'
        answer:
          choiceId: a
        explanation: |
          The graph's petal orientation is shifted off the polar axis, matching the sine rose $r=4\sin(3\theta)$.

          Related topic: sine versus cosine rose orientation.
      - id: rose-curve-step-5
        title: Construct the equation
        instruction: |
          The graph has $3$ petals, petal length $4$, and sine orientation. Therefore:

          $$
          r=4\sin(3\theta).
          $$
        type: symbolicResponse
        prompt: Write the polar equation for the graph.
        answer:
          expectedLatex: 'r=4\sin(3\theta)'
          equivalenceMode: expression
          variables:
            - r
            - theta
          tolerance: 0.000001
        explanation: |
          The coefficient $4$ gives the petal length. The factor $3\theta$ gives three petals because $3$ is odd. The sine function matches the graph's rotated orientation.

          Related topic: constructing rose curve equations from petal count, petal length, and orientation.
