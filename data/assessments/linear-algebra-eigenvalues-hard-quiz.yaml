questions:
  - id: hq-eigenspace-basis
    type: multipleChoice
    prompt: |
      Let $A = \begin{bmatrix}1 & 6 \\ 5 & 2\end{bmatrix}$. One of its eigenvalues is $\lambda = 7$.
      Which of the following is a basis for the eigenspace corresponding to $\lambda = 7$?
    choices:
      - id: c1
        text: '$\left\{ \begin{bmatrix}6\\5\end{bmatrix} \right\}$'
      - id: c2
        text: '$\left\{ \begin{bmatrix}1\\1\end{bmatrix} \right\}$'
      - id: c3
        text: '$\left\{ \begin{bmatrix}-6\\5\end{bmatrix} \right\}$'
      - id: c4
        text: '$\left\{ \begin{bmatrix}1\\-1\end{bmatrix} \right\}$'
    answer:
      choiceId: c2
    explanation: |
      The eigenspace is $\text{Nul}(A - 7I)$.
      $A - 7I = \begin{bmatrix}1-7 & 6 \\ 5 & 2-7\end{bmatrix} = \begin{bmatrix}-6 & 6 \\ 5 & -5\end{bmatrix}$.
      Solving $(A - 7I)\vec{x} = \vec{0}$, we see both rows give the equation $x_1 - x_2 = 0$, meaning $x_1 = x_2$.
      A basis vector is $\begin{bmatrix}1\\1\end{bmatrix}$.

  - id: hq-eigenvalue-3x3
    type: multipleChoice
    prompt: |
      Find the eigenvalues of $A = \begin{bmatrix}2 & 0 & 0 \\ 1 & 3 & 4 \\ 0 & 2 & 1\end{bmatrix}$.
    choices:
      - id: c1
        text: '$\lambda = 2, 3, 1$'
      - id: c2
        text: '$\lambda = 2, 4, 1$'
      - id: c3
        text: '$\lambda = 2, 5, -1$'
      - id: c4
        text: '$\lambda = 0, 3, 5$'
    answer:
      choiceId: c3
    explanation: |
      $\det(A - \lambda I) = \begin{vmatrix}2-\lambda & 0 & 0 \\ 1 & 3-\lambda & 4 \\ 0 & 2 & 1-\lambda\end{vmatrix}$.
      Expanding along the first row:
      $(2-\lambda) \det\begin{pmatrix}3-\lambda & 4 \\ 2 & 1-\lambda\end{pmatrix} - 0 + 0$.
      The inner determinant is $(3-\lambda)(1-\lambda) - 8 = 3 - 4\lambda + \lambda^2 - 8 = \lambda^2 - 4\lambda - 5$.
      This factors as $(\lambda - 5)(\lambda + 1)$.
      The characteristic equation is $(2-\lambda)(\lambda - 5)(\lambda + 1) = 0$.
      The eigenvalues are $2, 5, -1$.

  - id: hq-invertibility-eigenvalue
    type: multipleChoice
    prompt: |
      Let $A$ be an $n \times n$ matrix. Which of the following is equivalent to saying that $A$ is **invertible**?
    choices:
      - id: c1
        text: '$\lambda = 1$ is an eigenvalue of $A$.'
      - id: c2
        text: '$\lambda = 0$ is NOT an eigenvalue of $A$.'
      - id: c3
        text: 'All eigenvalues of $A$ are positive.'
      - id: c4
        text: '$A$ has exactly $n$ distinct eigenvalues.'
    answer:
      choiceId: c2
    explanation: |
      If $\lambda = 0$ is an eigenvalue, then there is a nonzero vector $\vec{x}$ such that $A\vec{x} = 0\vec{x} = \vec{0}$. This means $\text{Nul}(A)$ contains more than just the zero vector, which means $A$ is not invertible. Therefore, $A$ is invertible if and only if $0$ is NOT an eigenvalue. (The other options are false: an invertible matrix can have negative eigenvalues, fewer than $n$ distinct eigenvalues, and need not have 1 as an eigenvalue).
