lesson:
  sections:
  - id: section-prisms-cylinders
    title: Prisms and Cylinders
    content: 'A **prism** is a 3D solid with two congruent, parallel polygon bases connected by rectangular
      faces. A **cylinder** is the circular equivalent, with two parallel circular bases.


      For both shapes, the volume is determined by stacking the area of the base straight up through the
      height:

      $$\text{Volume} = (\text{Area of Base}) \times (\text{Height})$$


      The surface area consists of the two bases plus the lateral (side) area. If you unroll the side
      of a right prism or cylinder, it forms a large rectangle whose length is the perimeter of the base
      and whose width is the height of the solid.

      $$\text{Lateral Area} = (\text{Perimeter of Base}) \times (\text{Height})$$

      '
    check:
      type: multipleChoice
      prompt: A right cylinder has a radius of 3 and a height of 10. What is its total surface area (including
        both bases)?
      choices:
      - id: a
        text: $78\pi$
      - id: b
        text: $60\pi$
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: $90\pi$
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: $69\pi$
        issueSignals:
        - id: formula-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Calculate the area of the two circular bases.
      - Calculate the lateral area using the circumference.
      - Sum the areas.
      explanation: 'Solution:

        The area of one circular base is $\pi r^2 = \pi(3^2) = 9\pi$.

        There are two bases, so their combined area is $18\pi$.

        The lateral area is the circumference times the height: $(2\pi r)h = (2\pi \cdot 3)(10) = 60\pi$.

        The total surface area is $18\pi + 60\pi = 78\pi$.


        Why it works:

        Imagine cutting the label off a soup can and rolling it flat. It is a rectangle where one side
        perfectly wraps around the circular top (the circumference $2\pi r$) and the other side is the
        height ($h$).

        '
      id: section-prisms-cylinders-check
    required: true
  - id: section-pyramids-cones
    title: Pyramids and Cones
    content: 'A **pyramid** has a polygon base and triangular faces that meet at a single point (the apex).
      A **cone** is the circular equivalent.


      The volume of any pyramid or cone is exactly one-third the volume of a prism or cylinder with the
      same base and height:

      $$\text{Volume} = \frac{1}{3} (\text{Area of Base}) \times (\text{Height})$$


      The lateral surface area of a right regular pyramid or cone uses the **slant height** ($\ell$),
      which is the distance from the apex down the surface to the edge of the base. For a cone, the lateral
      area is $\pi r \ell$.

      '
    check:
      type: multipleChoice
      prompt: A cone has a radius of 5 and a volume of $100\pi$. What is its height?
      choices:
      - id: a
        text: '12'
      - id: b
        text: '4'
        issueSignals:
        - id: wrong-formula
          domains: []
      - id: c
        text: '20'
        issueSignals:
        - id: algebra-error
          domains: []
      - id: d
        text: '6'
        issueSignals:
        - id: formula-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Set up the volume equation $V = \frac{1}{3}\pi r^2 h$.
      - Substitute $V = 100\pi$ and $r = 5$.
      - Solve for $h$.
      explanation: 'Solution:

        The volume formula for a cone is $V = \frac{1}{3}\pi r^2 h$.

        Substitute the given values:

        $$100\pi = \frac{1}{3}\pi (5^2) h$$

        $$100\pi = \frac{25\pi}{3} h$$

        Divide both sides by $25\pi$:

        $$4 = \frac{1}{3} h$$

        $$h = 12$$


        Why it works:

        The $1/3$ factor is not an approximation; it is an exact geometric result derived from the fact
        that a cube can be perfectly partitioned into three identical pyramids meeting at a corner.

        '
      id: section-pyramids-cones-check
    required: true
  - id: section-spheres
    title: Spheres
    content: 'A sphere is the set of all points in 3D space at a fixed distance (the radius $r$) from
      a center point.


      The volume of a sphere is:

      $$V = \frac{4}{3}\pi r^3$$


      The surface area of a sphere is exactly equal to the lateral area of the cylinder that perfectly
      encloses it (Archimedes'' Hat-Box Theorem):

      $$A = 4\pi r^2$$


      Notice that the derivative of the volume with respect to the radius, $\frac{d}{dr}(\frac{4}{3}\pi
      r^3)$, is exactly the surface area $4\pi r^2$. This is because adding a tiny layer of thickness
      $dr$ to a sphere adds volume equal to the surface area times $dr$.

      '
    check:
      type: multipleChoice
      prompt: If the surface area of a sphere is numerically equal to its volume, what is the radius of
        the sphere?
      choices:
      - id: a
        text: '3'
      - id: b
        text: '1'
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: 4/3
        issueSignals:
        - id: algebra-error
          domains: []
      - id: d
        text: '4'
        issueSignals:
        - id: algebra-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Set $\frac{4}{3}\pi r^3 = 4\pi r^2$.
      - Cancel $4\pi r^2$ from both sides to isolate $r$.
      explanation: 'Solution:

        Set the volume equal to the surface area:

        $$\frac{4}{3}\pi r^3 = 4\pi r^2$$

        Since $r \neq 0$, we can divide both sides by $4\pi r^2$:

        $$\frac{1}{3} r = 1$$

        $$r = 3$$


        Why it works:

        Because volume scales with $r^3$ and surface area with $r^2$, small objects have a high surface-area-to-volume
        ratio, while large objects have a very low one. They are only numerically equal at exactly $r=3$.

        '
      id: section-spheres-check
    required: true
  - id: section-eulers-formula
    title: Polyhedra and Euler's Formula
    content: 'A **polyhedron** is a 3D solid with flat polygonal faces, straight edges, and sharp corners
      (vertices).


      For any convex polyhedron (like a cube, pyramid, or prism), there is a beautiful relationship between
      the number of Vertices ($V$), Edges ($E$), and Faces ($F$):

      $$V - E + F = 2$$


      This is **Euler''s Formula for Polyhedra**. It is a topological invariant; it remains true no matter
      how you stretch or distort the polyhedron, as long as you don''t punch a hole through it (like a
      donut).

      '
    check:
      type: multipleChoice
      prompt: A convex polyhedron has 12 faces and 20 vertices. How many edges does it have?
      choices:
      - id: a
        text: '30'
      - id: b
        text: '32'
        issueSignals:
        - id: algebra-error
          domains: []
      - id: c
        text: '10'
        issueSignals:
        - id: formula-error
          domains: []
      - id: d
        text: '34'
        issueSignals:
        - id: algebra-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Identify $V = 20$ and $F = 12$.
      - Substitute into $V - E + F = 2$.
      - Solve for $E$.
      explanation: 'Solution:

        Using Euler''s Formula:

        $$V - E + F = 2$$

        $$20 - E + 12 = 2$$

        $$32 - E = 2$$

        $$E = 30$$


        Why it works:

        This specific polyhedron is a regular dodecahedron (12 pentagonal faces). You can verify it: 12
        faces $\times$ 5 edges per face = 60 edges, but each edge is shared by 2 faces, so $60/2 = 30$
        unique edges.

        '
      id: section-eulers-formula-check
    required: true
  - id: section-scaling
    title: Scaling Laws
    content: 'When a 3D solid is scaled (enlarged or shrunk) by a linear scale factor of $k$:

      - All **1D** measurements (lengths, heights, perimeters, radii) scale by **$k$**.

      - All **2D** measurements (surface areas, base areas, cross-sections) scale by **$k^2$**.

      - All **3D** measurements (volumes, capacities, masses if uniform) scale by **$k^3$**.


      If you know the ratio of two volumes, you must take the cube root to find the linear ratio $k$,
      which you can then square to find the area ratio $k^2$.

      '
    check:
      type: multipleChoice
      prompt: Two similar pyramids have volumes of 8 and 27. If the surface area of the smaller pyramid
        is 20, what is the surface area of the larger pyramid?
      choices:
      - id: a
        text: '45'
      - id: b
        text: '67.5'
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: c
        text: '90'
        issueSignals:
        - id: algebra-error
          domains: []
      - id: d
        text: '135'
        issueSignals:
        - id: wrong-concept
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Find the volume ratio $k^3 = 27/8$.
      - Take the cube root to find linear ratio $k = 3/2$.
      - Square to find the area ratio $k^2 = 9/4$.
      - Multiply the small area by $9/4$.
      explanation: 'Solution:

        The ratio of their volumes ($k^3$) is $\frac{27}{8}$.

        Taking the cube root, the linear scale factor is $k = \frac{3}{2}$.

        The ratio of their surface areas ($k^2$) must be $\left(\frac{3}{2}\right)^2 = \frac{9}{4}$.

        The larger pyramid has an area $\frac{9}{4}$ times the smaller one.

        $$\text{Area} = 20 \times \frac{9}{4} = 5 \times 9 = 45$$


        Why it works:

        Scaling laws bypass complex formulas entirely. We never needed to know the height, base, or number
        of sides of the pyramid to find its new area!

        '
      id: section-scaling-check
    required: true
  - id: section-distance-3d
    title: Distance in 3D (Space Diagonal)
    content: 'The Pythagorean theorem extends beautifully into three dimensions. If you have a rectangular
      box (a rectangular prism) with length $\ell$, width $w$, and height $h$, the longest diagonal that
      cuts straight through the interior of the box (the space diagonal) is:

      $$d = \sqrt{\ell^2 + w^2 + h^2}$$


      This is derived by applying the 2D Pythagorean theorem twice: first to find the diagonal across
      the rectangular floor ($\sqrt{\ell^2 + w^2}$), and then using that floor diagonal as the base of
      a vertical right triangle with height $h$.

      '
    check:
      type: multipleChoice
      prompt: What is the length of the longest stick that can perfectly fit inside a rectangular box
        with dimensions 3, 4, and 12?
      choices:
      - id: a
        text: '13'
      - id: b
        text: '15'
        issueSignals:
        - id: algebra-error
          domains: []
      - id: c
        text: '5'
        issueSignals:
        - id: wrong-concept
          domains: []
      - id: d
        text: '19'
        issueSignals:
        - id: formula-error
          domains: []
      answer:
        choiceId: a
      difficultyDimensions:
      - Recognize the longest distance is the space diagonal.
      - Apply the 3D Pythagorean theorem $d = \sqrt{3^2 + 4^2 + 12^2}$.
      explanation: 'Solution:

        The longest stick connects two opposite corners through the interior of the box (the space diagonal).

        Using the 3D Pythagorean theorem:

        $$d = \sqrt{3^2 + 4^2 + 12^2}$$

        $$d = \sqrt{9 + 16 + 144}$$

        $$d = \sqrt{25 + 144} = \sqrt{169} = 13$$


        Why it works:

        Notice how the first two terms ($3^2 + 4^2 = 25$) form a classic $3-4-5$ right triangle on the
        floor. Then, the floor diagonal (5) combines with the height (12) to form a $5-12-13$ right triangle!

        '
      id: section-distance-3d-check
    required: true
  introduction: This lesson develops the key ideas in Three-Dimensional Geometry.
