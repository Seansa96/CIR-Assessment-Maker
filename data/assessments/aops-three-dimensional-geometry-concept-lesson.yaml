lesson:
  introduction: Learn to solve Three Dimensional Geometry problems by recognizing planes, surface area, volume, spheres, cubes, prisms, pyramids, polyhedra and justifying each theorem or transformation.
  sections:
  - id: aops-three-dimensional-geometry-motivation
    title: What the topic helps you notice
    required: true
    content: Three Dimensional Geometry is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are planes, surface area, volume, spheres, cubes, prisms, pyramids, polyhedra.
    check:
      id: aops-three-dimensional-geometry-motivation-check
      type: multipleChoice
      prompt: In Three Dimensional Geometry, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-three-dimensional-geometry-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-three-dimensional-geometry-definitions-check
      type: multipleChoice
      prompt: In Three Dimensional Geometry, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-three-dimensional-geometry-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: draw cross sections, separate surface area and volume, use similar solids carefully. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-three-dimensional-geometry-recognition-check
      type: multipleChoice
      prompt: In Three Dimensional Geometry, what should be checked before applying a method?
      choices:
