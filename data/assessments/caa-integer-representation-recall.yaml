schemaVersion: 1
id: caa-integer-representation-recall
title: Integer Representation Recall Drill
assessmentType: recallDrill
categoryId: computer-arithmetic-algorithms
subcategoryIds:
- caa-integer-representation
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - integer-representation
  - two-complement
  - unsigned-arithmetic
items:
- id: unsigned-range
  type: cloze
  prompt: 'Complete: an unsigned `w`-bit integer has values from 0 through ____.'
  answer:
    expected: 2^w - 1
  explanation: There are `2^w` patterns, starting at zero.
  tags:
  - ranges
- id: signed-range
  type: typed
  prompt: Recall the signed two's-complement range for `w` bits.
  answer:
    expected: -2^(w-1) through 2^(w-1)-1
  explanation: The high bit carries negative weight.
  tags:
  - two-complement
  - ranges
- id: sign-extension-rule
  type: flashcard
  prompt: How do you sign-extend a two's-complement value?
  answer:
    expected: Copy the sign bit into the newly added high bits.
  explanation: This keeps the signed value unchanged after widening.
  tags:
  - sign-extension
- id: zero-extension-rule
  type: flashcard
  prompt: How do you zero-extend an unsigned value?
  answer:
    expected: Add zeros in the newly added high bits.
  explanation: Unsigned values do not use a sign bit.
  tags:
  - zero-extension
- id: same-bits-different-meaning
  type: typed
  prompt: Explain why `11111111` can mean 255 or -1.
  answer:
    expected: The bits are the same representation, but unsigned interpretation gives 255 while 8-bit two's-complement signed interpretation gives -1.
  explanation: Meaning comes from the interpretation contract.
  tags:
  - interpretation
