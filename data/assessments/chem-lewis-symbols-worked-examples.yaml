    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Neutral oxygen begins with six valence electrons.
    explanation: 'Solution: Neutral oxygen begins with six valence electrons. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: we3-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Gaining two electrons completes an eight-electron outer shell.
    explanation: 'Solution: Gaining two electrons completes an eight-electron outer shell. Why it works: This step follows
      the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we3-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Bracket the eight-dot symbol with 2- outside; the two gained electrons account for the charge.
    explanation: 'Solution: Bracket the eight-dot symbol with 2- outside; the two gained electrons account for the charge.
