- id: example-1
  title: Build and interpret sulfur's Lewis symbol
  problem: Construct a Lewis symbol for sulfur and interpret its pairing pattern.
  steps:
  - id: we1-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Locate sulfur in group 6A, giving six valence electrons.
    explanation: 'Solution: Locate sulfur in group 6A, giving six valence electrons. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: we1-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Place four single dots first, then pair two of them to obtain two pairs and two single dots.
    explanation: 'Solution: Place four single dots first, then pair two of them to obtain two pairs and two single dots. Why
      it works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we1-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Verify six total dots; orientation may rotate, but the inventory and pairing pattern remain the same.
    explanation: 'Solution: Verify six total dots; orientation may rotate, but the inventory and pairing pattern remain the
      same. Why it works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
- id: example-2
  title: Represent aluminum ion formation
  problem: Use a Lewis symbol to represent formation of Al3+.
  steps:
  - id: we2-step1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Neutral aluminum has three valence electrons because it is in group 3A.
    explanation: 'Solution: Neutral aluminum has three valence electrons because it is in group 3A. Why it works: This step
      follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we2-step2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Removing three electrons leaves the common Al3+ cation with no displayed valence dots.
    explanation: 'Solution: Removing three electrons leaves the common Al3+ cation with no displayed valence dots. Why it
      works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: we2-step3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Write the bracketed Al symbol with 3+ outside and verify that electron loss produces positive charge.
    explanation: 'Solution: Write the bracketed Al symbol with 3+ outside and verify that electron loss produces positive
      charge. Why it works: This step follows the topic''s accounting rules and supplies a separate check before the final
      conclusion.'
