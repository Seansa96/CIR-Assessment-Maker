workedExamples:
- id: l2-sec1
  title: Inverting Amplifier
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Inverting Amplifier
    instruction: The inverting amplifier has the non-inverting input grounded, and
      the input signal is applied to the inverting input via $R_s$, with a feedback
      resistor $R_f$. The gain is $v_o/v_s = -R_f/R_s$.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec2
  title: Non-Inverting Amplifier
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Non-Inverting Amplifier
    instruction: The non-inverting amplifier applies the signal to the non-inverting
      input. The gain is $v_o/v_s = 1 + R_f/R_s$.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l2-sec3
  title: Summing and Difference Amplifiers
  problem: 'Review the following concept:'
  steps:
  - id: step3
    title: Summing and Difference Amplifiers
    instruction: A summing amplifier adds multiple input voltages. A difference amplifier
      outputs a scaled version of the difference between two input signals.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
