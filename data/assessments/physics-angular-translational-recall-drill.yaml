items:
  - { id: atr1, type: cloze, prompt: 'Tangential speed is $v=r____$.', answer: { expected: omega, expectedLatex: '\omega', aliases: ['angular velocity'], media: [] }, explanation: 'Solution: Insert $\omega$.\n\nWhy it works: Rim speed equals radius times angular speed.', tags: [speed] }
  - { id: atr2, type: typed, prompt: 'What is the radial acceleration formula in terms of angular speed?', answer: { expected: 'r omega squared', expectedLatex: 'r\omega^2', aliases: [], media: [] }, explanation: 'Solution: $a_r=r\omega^2$.\n\nWhy it works: It is equivalent to $v^2/r$.', tags: [acceleration] }
  - { id: atr3, type: cloze, prompt: 'Tangential acceleration is $a_t=r____$.', answer: { expected: alpha, expectedLatex: '\alpha', aliases: ['angular acceleration'], media: [] }, explanation: 'Solution: Insert $\alpha$.\n\nWhy it works: Angular acceleration changes rim speed.', tags: [acceleration] }
  - { id: atr4, type: typed, prompt: 'Which direction does centripetal acceleration point?', answer: { expected: 'toward the center', expectedLatex: '', aliases: ['toward the axis', inward], media: [] }, explanation: 'Solution: It points toward the center.\n\nWhy it works: It turns the velocity toward the circular path.', tags: [direction] }
  - { id: atr5, type: cloze, prompt: 'For a no-slip belt, $R_1\omega_1=R_2____$.', answer: { expected: omega_2, expectedLatex: '\omega_2', aliases: [], media: [] }, explanation: 'Solution: Insert $\omega_2$.\n\nWhy it works: The belt has one common tangential speed.', tags: [belts] }
  - { id: atr6, type: typed, prompt: 'What condition links a rolling wheel center speed and angular speed?', answer: { expected: 'no slipping', expectedLatex: 'v=R\omega', aliases: ['rolling without slipping'], media: [] }, explanation: 'Solution: The condition is rolling without slipping.\n\nWhy it works: It imposes $v=R\omega$.', tags: [rolling] }
