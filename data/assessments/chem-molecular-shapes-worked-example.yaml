workedExamples:
  - id: we-so2-workflow
    title: 'From a Lewis structure to a geometry: sulfur dioxide'
    problem: |
      Use VSEPR to analyze $SO_2$. A valid resonance contributor has sulfur as the central atom, two S–O bonding directions, and one lone pair on sulfur. Determine the electron-domain geometry, molecular geometry, and a defensible angle prediction.
    media:
      - type: image
        src: /media/chemistry/vsepr-domain-workflow.svg
        alt: VSEPR workflow diagram for converting a Lewis structure into electron-domain geometry, molecular geometry, and an angle estimate.
        caption: The same workflow works even when a Lewis structure contains resonance or a multiple bond.
    steps:
      - id: so2-center
        title: Identify the local center
        type: multipleChoice
        prompt: 'Which atom must be analyzed to name the O–S–O angle and the local molecular geometry of $SO_2$?'
        choices:
          - id: a
            text: Either terminal oxygen
          - id: b
            text: Sulfur, the atom between the two oxygens
          - id: c
            text: All three atoms together as one center
          - id: d
            text: The oxygen in the double bond only
        answer:
          choiceId: b
        instruction: The vertex of an O–S–O angle is sulfur, so all VSEPR counting is done around sulfur.
      - id: so2-domains
        title: Count domains rather than bond lines
        type: numericResponse
        prompt: 'How many electron domains are around sulfur in the stated $SO_2$ Lewis environment?'
        answer:
          value: 3
          tolerance: 0
        instruction: Two S–O bond directions contribute two domains, and the sulfur lone pair contributes the third. A double bond remains one domain.
      - id: so2-ede
        title: Name the electron-domain geometry
        type: multipleChoice
        prompt: 'What electron-domain geometry follows from three domains around sulfur?'
        choices:
          - id: a
            text: Linear
          - id: b
            text: Trigonal planar
          - id: c
            text: Tetrahedral
          - id: d
            text: Trigonal bipyramidal
        answer:
          choiceId: b
        instruction: Three electron domains spread into a trigonal-planar arrangement with a 120° ideal separation.
      - id: so2-axe
        title: Record the occupied positions
        type: multipleChoice
        prompt: 'Which AXE description matches sulfur in this $SO_2$ model?'
        choices:
          - id: a
            text: AX$_2$E
          - id: b
            text: AX$_3$
          - id: c
            text: AX$_2$E$_2$
          - id: d
            text: AX$_3$E
        answer:
          choiceId: a
        instruction: Sulfur has two atom-containing bond domains and one lone-pair domain.
      - id: so2-mg
        title: Remove the lone-pair position from the name
        type: multipleChoice
        prompt: 'After the lone-pair position is ignored, what molecular geometry remains?'
        choices:
          - id: a
            text: Linear
          - id: b
            text: Bent
          - id: c
            text: Trigonal planar
          - id: d
            text: Trigonal pyramidal
        answer:
          choiceId: b
        instruction: Only the two oxygen positions are named, so the molecular geometry is bent rather than trigonal planar.
      - id: so2-angle-start
        title: State the ideal starting angle
        type: numericResponse
        prompt: 'Before accounting for the lone pair, what ideal angle in degrees belongs to a trigonal-planar electron-domain geometry?'
        answer:
          value: 120
          tolerance: 0
        instruction: The ideal angle is determined by the electron-domain geometry, not by the final molecular-geometry label.
      - id: so2-angle-refine
        title: Refine the prediction qualitatively
        type: multipleChoice
        prompt: 'Relative to 120°, what does VSEPR predict for the O–S–O angle when a sulfur lone pair is present?'
        choices:
          - id: a
            text: Exactly 120°
          - id: b
            text: Slightly less than 120°
          - id: c
            text: Exactly 109.5°
          - id: d
            text: Greater than 180°
        answer:
          choiceId: b
        instruction: A lone-pair domain repels adjacent bonding domains strongly and compresses the bond angle below the trigonal-planar ideal.
      - id: so2-check
        title: Check that resonance did not change the count
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: 'Explain in one or two sentences why changing the placement of a double bond in an $SO_2$ resonance contributor does not change the VSEPR geometry prediction.'
        instruction: A double bond and a single bond each occupy one direction around sulfur. Every resonance contributor has two S–O bonding directions and one sulfur lone pair, so the domain count and geometry label stay the same.

  - id: we-clf3-positioning
    title: 'Use positional reasoning: chlorine trifluoride'
    problem: |
      Analyze $ClF_3$. Its central chlorine has three Cl–F bonding domains and two lone pairs. Determine both geometry names and use the axial/equatorial distinction to justify the molecular shape.
    media:
      - type: image
        src: /media/chemistry/vsepr-five-six-domain-map.svg
        alt: Diagram showing axial and equatorial positions in a trigonal bipyramid and why lone pairs occupy equatorial positions.
        caption: Positioning the lone pairs is the essential extra decision for a five-domain molecule.
    steps:
      - id: clf3-domains
        title: Count all chlorine domains
        type: numericResponse
        prompt: 'How many electron domains are around the central chlorine in $ClF_3$?'
        answer:
          value: 5
          tolerance: 0
        instruction: Three Cl–F bonds plus two lone pairs make five domains.
      - id: clf3-ede
        title: Choose the starting arrangement
        type: multipleChoice
        prompt: 'What electron-domain geometry does chlorine have?'
        choices:
          - id: a
            text: Tetrahedral
          - id: b
            text: Trigonal bipyramidal
          - id: c
            text: Octahedral
          - id: d
            text: Square planar
        answer:
          choiceId: b
        instruction: Five electron domains begin in a trigonal-bipyramidal arrangement.
      - id: clf3-axe
        title: Identify the occupancy pattern
        type: multipleChoice
        prompt: 'Which AXE description matches $ClF_3$ at chlorine?'
        choices:
          - id: a
            text: AX$_5$
          - id: b
            text: AX$_4$E
          - id: c
            text: AX$_3$E$_2$
          - id: d
            text: AX$_2$E$_3$
        answer:
          choiceId: c
        instruction: Three bonded fluorines and two chlorine lone pairs give AX$_3$E$_2$.
      - id: clf3-positions
        title: Place lone pairs where repulsion is lower
        type: multipleChoice
        prompt: 'Where should the two lone pairs be placed in the trigonal-bipyramidal arrangement?'
        choices:
          - id: a
            text: Both axial
          - id: b
            text: Both equatorial
          - id: c
            text: One axial and one equatorial
          - id: d
            text: 'Neither: lone pairs do not occupy VSEPR positions'
        answer:
          choiceId: b
        instruction: Each equatorial site has two 90° interactions, fewer than an axial site's three, so the larger lone-pair domains occupy equatorial sites.
      - id: clf3-atom-sites
        title: Locate the fluorine atoms
        type: multipleChoice
        prompt: 'After two equatorial sites are occupied by lone pairs, where do the three fluorine atoms lie?'
        choices:
          - id: a
            text: Two axial sites and the remaining equatorial site
          - id: b
            text: Three equatorial sites
          - id: c
            text: One axial site and two octahedral sites
          - id: d
            text: Four tetrahedral sites
        answer:
          choiceId: a
        instruction: The two axial positions and one equatorial position remain available for fluorine.
      - id: clf3-mg
        title: Name the visible atom arrangement
        type: multipleChoice
        prompt: 'What molecular geometry is formed by those three fluorine positions?'
        choices:
          - id: a
            text: Trigonal planar
          - id: b
            text: T-shaped
          - id: c
            text: Seesaw
          - id: d
            text: Linear
        answer:
          choiceId: b
        instruction: Two opposite axial atoms and one equatorial atom create a T-shaped molecular geometry.
      - id: clf3-angle
        title: Identify the ideal axial-equatorial angle
        type: numericResponse
        prompt: 'In the undistorted trigonal-bipyramidal arrangement, what is the ideal angle in degrees between an axial and an equatorial position?'
        answer:
          value: 90
          tolerance: 0
        instruction: The two axial directions are each perpendicular to the equatorial plane, giving a 90° axial-equatorial starting angle.
      - id: clf3-refine
        title: State the expected distortion
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: 'Why should the F–Cl–F angles near the equatorial lone pairs be treated as close to, rather than exactly, their ideal VSEPR values?'
        instruction: Lone pairs repel more strongly than bonding domains. They push the bonded fluorine directions away, so VSEPR predicts a distortion without requiring an unsupported exact numerical angle.
