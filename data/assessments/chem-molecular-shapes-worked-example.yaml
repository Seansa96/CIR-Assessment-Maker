workedExamples:
  - id: we-shapes-standard
    title: 'Tetrahedral Family: CH₄, NH₃, H₂O'
    problem: |
      Apply the VSEPR workflow to predict the electron-pair geometry, molecular geometry, and approximate bond angles for $CH_4$, $NH_3$, and $H_2O$. All three have 4 electron domains around the central atom — observe how lone pairs change the molecular shape.
    steps:
      - id: s1-ch4
        title: 'CH₄ — Methane (AX₄E₀)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the methane geometry analysis and continue.
        instruction: |
          **Lewis structure:** C forms 4 C—H single bonds. C has 0 lone pairs (uses all 8 electrons in bonds).

          **Electron domains on C:** 4 (all bonding)

          **AXₙEₘ:** AX₄E₀

          **Electron-pair geometry:** Tetrahedral

          **Molecular geometry:** Tetrahedral (no lone pairs to alter the shape)

          **Bond angle:** 109.5° (ideal tetrahedral)

          $CH_4$ is the prototype tetrahedral molecule. All four C—H bonds are equivalent in length (109 pm) and strength.

      - id: s2-nh3
        title: 'NH₃ — Ammonia (AX₃E₁)'
        type: multipleChoice
        answer:
          choiceId: b
        prompt: |
          After drawing the Lewis structure of $NH_3$ (N has 3 bonds + 1 lone pair), what is the correct molecular geometry?
        choices:
          - id: a
            text: Tetrahedral — because there are 4 electron domains
          - id: b
            text: Trigonal pyramidal — because molecular geometry ignores lone pairs
          - id: c
            text: Trigonal planar — because N has 3 bonds
          - id: d
            text: Bent — because the lone pair pushes bonds down
        instruction: |
          **AXₙEₘ:** AX₃E₁ — N has 3 bonds + 1 lone pair = 4 electron domains.

          **Electron-pair geometry:** Tetrahedral (4 domains)

          **Molecular geometry:** **Trigonal pyramidal** — molecular geometry names only describe atom positions. The lone pair occupies one tetrahedral position but is not "seen" in the shape name.

          **Bond angle:** ~107° (lone pair repels bonding pairs, compressing from 109.5°)

          NH₃ looks like a three-legged stool with N at the top — a trigonal pyramid.

      - id: s3-h2o
        title: 'H₂O — Water (AX₂E₂)'
        type: multipleChoice
        answer:
          choiceId: c
        prompt: |
          Water has 2 O—H bonds and 2 lone pairs on O (AX₂E₂). Which statement is correct about its geometry and bond angle?
        choices:
          - id: a
            text: Linear geometry, 180° (same as CO₂)
          - id: b
            text: Trigonal pyramidal, ~107°
          - id: c
            text: Bent geometry, ~104.5° (two lone pairs compress bonds more than one)
          - id: d
            text: Tetrahedral, 109.5°
        instruction: |
          **AXₙEₘ:** AX₂E₂

          **Electron-pair geometry:** Tetrahedral (4 domains)

          **Molecular geometry:** **Bent** — two H atoms and two lone pairs, but only atom positions determine the name.

          **Bond angle:** ~104.5° — two lone pairs exert greater repulsion than one (compare: NH₃ at 107°), further compressing the H—O—H angle below tetrahedral.

          This bent geometry + highly polar O—H bonds = massive net dipole moment → polar molecule → extensive hydrogen bonding.

  - id: we-shapes-expanded
    title: 'Expanded Octets: SF₄, ClF₃, XeF₂'
    problem: |
      Determine the molecular geometry and predict all unique bond angles for $SF_4$, $ClF_3$, and $XeF_2$. Each has 5 electron domains (trigonal bipyramidal electron-pair geometry) but different numbers of lone pairs.
    steps:
      - id: s4-sf4
        title: 'SF₄ — Sulfur Tetrafluoride (AX₄E₁, Seesaw)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the SF₄ geometry and continue.
        instruction: |
          S has 4 S—F bonds + 1 lone pair = 5 domains → AX₄E₁.

          In the trigonal bipyramidal electron-pair geometry, the lone pair occupies an **equatorial** position (120° spacing gives more room than the axial 90° spacing).

          **Molecular geometry: Seesaw** (looks like a seesaw — two axial F atoms up and down, two equatorial F atoms to the sides, with a gap where the lone pair is).

          **Bond angles:**
          - Axial F — S — Axial F: ≈ 177° (slightly less than 180° due to lone pair repulsion)
          - Equatorial F — S — Equatorial F: ≈ 101° (less than 120°, lone pair in equatorial plane)
          - Axial F — S — Equatorial F: ≈ 87°

      - id: s5-clf3
        title: 'ClF₃ — Chlorine Trifluoride (AX₃E₂, T-shaped)'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the ClF₃ geometry and continue.
        instruction: |
          Cl has 3 Cl—F bonds + 2 lone pairs = 5 domains → AX₃E₂.

          Both lone pairs occupy **equatorial** positions. The 3 F atoms fill: 2 axial positions + 1 equatorial position.

          **Molecular geometry: T-shaped** — the two axial F atoms and one equatorial F atom form a T.

          **Bond angles:**
          - Axial F — Cl — Equatorial F: ≈ 87° (compressed by the two equatorial lone pairs)
          - Axial F — Cl — Axial F: ≈ 175°

      - id: s6-xef2
        title: 'XeF₂ — Xenon Difluoride (AX₂E₃, Linear)'
        type: multipleChoice
        answer:
          choiceId: b
        prompt: |
          $XeF_2$ has 2 Xe—F bonds and 3 lone pairs on Xe. All three lone pairs occupy equatorial positions. What is the molecular geometry?
        choices:
          - id: a
            text: Bent (~104.5°)
          - id: b
            text: Linear (180°)
          - id: c
            text: Seesaw
          - id: d
            text: T-shaped
        instruction: |
          **AXₙEₘ:** AX₂E₃

          Electron-pair geometry: trigonal bipyramidal (5 domains).

          All three lone pairs occupy the three equatorial positions. The two F atoms are in the **axial positions**, directly opposite each other at 180°.

          **Molecular geometry: Linear** — despite having 3 lone pairs, the atoms describe a straight line.

          **Bond angle: 180°** (F—Xe—F)

          $XeF_2$ is one of only a few stable compounds of noble gases — made possible by Xe's ability to expand its octet using available $d$ orbitals.
