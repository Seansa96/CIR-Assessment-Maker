- id: grams-to-moles
  title: Converting Between Grams and Moles
  problem: '**Problem A: Basic Conversions**

    (a) How many moles of sodium (Na) are in 45.98 g of sodium?

    (b) What mass (in grams) of calcium carbonate (CaCO3) is present in 3.25 mol of CaCO3?


    **Problem B: Scaled Conversions**

    (c) How many moles of sodium (Na) are in 459.8 g of sodium?

    (d) What mass (in grams) of calcium carbonate (CaCO3) is present in 32.5 mol of CaCO3?


    Use: Na = 22.990 g/mol; Ca = 40.078, C = 12.011, O = 15.999 g/mol.

    '
  steps:
  - id: step-grams-to-moles-1
    title: 'Problem A: (a) Grams of Na → Moles of Na'
    type: numericResponse
    answer:
      value: 2.0
      tolerance: 0.001
    prompt: How many moles of Na are in 45.98 g of Na? Enter a value to four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Divide the given mass by sodium's molar mass (22.990 g/mol).
  - id: step-grams-to-moles-2
    title: 'Problem A: (b) Moles of CaCO3 → Grams of CaCO3'
    type: numericResponse
    answer:
      value: 325.3
      tolerance: 0.16265000000000002
    prompt: What mass of CaCO3 corresponds to 3.25 mol? Enter grams to three significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Multiply the amount in moles by the molar mass of CaCO3.
  - id: step-grams-to-moles-3
    title: 'Problem B: (c) Grams of Na → Moles of Na'
    type: numericResponse
    answer:
      value: 20.0
      tolerance: 0.01
    prompt: How many moles of Na are in 459.8 g of Na? Enter a value to four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use the same grams-to-moles relationship as in Problem A.
  - id: step-grams-to-moles-4
    title: 'Problem B: (d) Moles of CaCO3 → Grams of CaCO3'
    type: numericResponse
    answer:
      value: 3253
      tolerance: 1.6265
    prompt: What mass of CaCO3 corresponds to 32.5 mol? Enter grams to three significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Moles times molar mass gives mass.
  check:
    id: conversion-check
    type: numericResponse
    prompt: 'How many grams of nitrogen gas (N2) are in 5.00 mol of N2? (M of N = 14.007 g/mol)

      '
    answer:
      value: 140.1
      tolerance: 0.2
- id: moles-to-particles
  title: Converting Moles to Number of Particles
  problem: '**Problem A: A Glass of Water**

    How many water molecules are present in 250.0 mL of liquid water?


    **Problem B: A Swimming Pool**

    How many water molecules are present in 2,500,000 mL (2.5 million mL) of liquid water?


    (Density of water = 1.000 g/mL; M(H2O) = 18.015 g/mol; NA = 6.022 × 10²³ mol⁻¹)

    '
  steps:
  - id: step-moles-to-particles-1
    title: 'Problem A: Step 1 — Find the mass of 250.0 mL of water'
    type: numericResponse
    answer:
      value: 250.0
      tolerance: 0.125
    prompt: What is the mass, in grams, of 250.0 mL of water with density 1.00 g/mL?
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use mass = density × volume.
  - id: step-moles-to-particles-2
    title: 'Problem A: Step 2 — Convert mass to moles'
    type: numericResponse
    answer:
      value: 13.88
      tolerance: 0.006940000000000001
    prompt: How many moles of water are in the 250.0 mL sample? Enter four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: First use the mass from the density conversion, then divide by 18.015 g/mol.
  - id: step-moles-to-particles-3
    title: 'Problem A: Step 3 — Convert moles to molecules'
    type: symbolicResponse
    answer:
      expectedLatex: 8.36*10^24
      equivalenceMode: expression
      tolerance: 0
    prompt: How many water molecules are in the 250.0 mL sample? Enter the three-significant-figure result in scientific notation as a mathematical expression.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Convert moles to molecules using Avogadro's number.
  - id: step-moles-to-particles-4
    title: 'Problem B: Step 1 — Find the mass of 2,500,000 mL of water'
    type: numericResponse
    answer:
      value: 2500000
      tolerance: 1250.0
    prompt: What is the mass, in grams, of 2500000 mL of water with density 1.00 g/mL?
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use mass = density × volume before any mole conversion.
  - id: step-moles-to-particles-5
    title: 'Problem B: Step 2 — Convert mass to moles'
    type: numericResponse
    answer:
      value: 138800.0
      tolerance: 69.4
    prompt: How many moles of water are in the 2500000 mL sample? Enter four significant figures.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Divide the water mass by its molar mass.
  - id: step-moles-to-particles-6
    title: 'Problem B: Step 3 — Convert moles to molecules'
    type: symbolicResponse
    answer:
      expectedLatex: 8.36*10^28
      equivalenceMode: expression
      tolerance: 0
    prompt: How many water molecules are in the 2500000 mL sample? Enter the three-significant-figure result in scientific notation as a mathematical expression.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Multiply the number of moles by Avogadro's number.
  check:
    id: particles-check
    type: numericResponse
    prompt: 'How many atoms are in 1.000 mol of iron (Fe)? Give your answer in scientific notation as the coefficient (e.g., if the answer is 6.022 × 10²³, enter 6.022 × 10²³ as a decimal — but since this is numeric, enter the full value). Round to 4 significant figures: 6.022e23.


      Enter the coefficient only (the number before × 10²³): e.g., if the answer is 6.022 × 10²³, enter 6.022.

      '
    answer:
      value: 6.022
      tolerance: 0.002
- id: molar-mass-calculation
  title: Calculating Molar Mass of a Compound
  problem: '**Problem A: Iron Oxides**

    Calculate the molar mass of each compound and determine which contains more iron by mass: 100 g of Fe2O3 or 100 g of Fe3O4.


    **Problem B: Copper Oxides**

    Calculate the molar mass of each compound and determine which contains more copper by mass: 100 g of CuO or 100 g of Cu2O.


    Use: Fe = 55.845, O = 15.999, Cu = 63.546 g/mol.

    '
  steps:
  - id: step-molar-mass-calculation-1
    title: 'Problem A: Step 1 — Molar mass of Fe2O3'
    type: numericResponse
    answer:
      value: 159.687
      tolerance: 0.07984350000000001
    prompt: Calculate the molar mass of Fe2O3 in g/mol. Use the provided atomic masses.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Add the mass contributions from two Fe atoms and three O atoms.
  - id: step-molar-mass-calculation-2
    title: 'Problem A: Step 2 — Molar mass of Fe3O4'
    type: numericResponse
    answer:
      value: 231.531
      tolerance: 0.11576550000000001
    prompt: Calculate the molar mass of Fe3O4 in g/mol. Use the provided atomic masses.
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Use each formula subscript when adding the elemental mass contributions.
  - id: step-molar-mass-calculation-3
    title: 'Problem A: Step 3 — Percent iron by mass in each compound'
    type: multipleChoice
    answer:
      choiceId: b
    prompt: Which compound has the larger mass percent of iron?
    explanation: 'Solution:

      Use the stated quantities and the governing chemical relationship to determine the requested result.


      Why it works:

      The balanced equation and molar masses preserve the chemical amount while each conversion cancels the previous unit.


      Why the other choices fail:

      They either reverse the stoichiometric comparison, ignore coefficients, or name a product instead of a reactant.'
    instruction: Use the stated quantities and the governing chemical relationship to determine the requested result.
    hint: Compare each iron contribution divided by the compound's total molar mass.
    choices:
    - id: a
      text: Fe2O3
      issueSignals:
      - id: molar-mass-calculation-error
        domains:
        - chemistry
    - id: b
      text: Fe3O4
    - id: c
      text: They have the same mass percent of iron.
      issueSignals:
      - id: molar-mass-calculation-error
        domains:
        - chemistry
    - id: d
      text: It cannot be determined from the formulas.
      issueSignals:
      - id: molar-mass-calculation-error
        domains:
        - chemistry
