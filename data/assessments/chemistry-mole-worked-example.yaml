- id: grams-to-moles
  title: Converting Between Grams and Moles
  problem: |
    **Problem A: Basic Conversions**
    (a) How many moles of sodium (Na) are in 45.98 g of sodium?
    (b) What mass (in grams) of calcium carbonate (CaCO3) is present in 3.25 mol of CaCO3?

    **Problem B: Scaled Conversions**
    (c) How many moles of sodium (Na) are in 459.8 g of sodium?
    (d) What mass (in grams) of calcium carbonate (CaCO3) is present in 32.5 mol of CaCO3?

    Use: Na = 22.990 g/mol; Ca = 40.078, C = 12.011, O = 15.999 g/mol.
  steps:
  - id: step-grams-to-moles-1
    title: 'Problem A: (a) Grams of Na → Moles of Na'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '**Step 1:** Identify the molar mass of Na.

      $M_{Na} = 22.990 \text{ g/mol}$


      **Step 2:** Apply the conversion:

      $$

      n = \frac{m}{M} = \frac{45.98 \text{ g}}{22.990 \text{ g/mol}} = 2.000 \text{
      mol}

      $$


      There are **2.000 mol of sodium** in 45.98 g.

      '
  - id: step-grams-to-moles-2
    title: 'Problem A: (b) Moles of CaCO3 → Grams of CaCO3'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      **Step 1:** Calculate the molar mass of CaCO3.
      $$
      M = 40.078 + 12.011 + 3(15.999) = 40.078 + 12.011 + 47.997 = 100.086 \text{ g/mol}
      $$

      **Step 2:** Convert moles to grams:
      $$
      m = n \times M = 3.25 \text{ mol} \times 100.086 \text{ g/mol} = 325.3 \text{ g}
      $$

      ![Visual representation of basic conversions](/media/placeholders/mole-grams-basic.svg)
  - id: step-grams-to-moles-3
    title: 'Problem B: (c) Grams of Na → Moles of Na'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      **Step 1:** Identify the molar mass of Na.
      $M_{Na} = 22.990 \text{ g/mol}$

      **Step 2:** Apply the conversion:
      $$
      n = \frac{m}{M} = \frac{459.8 \text{ g}}{22.990 \text{ g/mol}} = 20.00 \text{ mol}
      $$

      There are **20.00 mol of sodium** in 459.8 g.
  - id: step-grams-to-moles-4
    title: 'Problem B: (d) Moles of CaCO3 → Grams of CaCO3'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      **Step 1:** Calculate the molar mass of CaCO3.
      $$
      M = 40.078 + 12.011 + 3(15.999) = 100.086 \text{ g/mol}
      $$

      **Step 2:** Convert moles to grams:
      $$
      m = n \times M = 32.5 \text{ mol} \times 100.086 \text{ g/mol} = 3253 \text{ g}
      $$

      ![Visual representation of scaled conversions](/media/placeholders/mole-grams-scaled.svg)
  check:
    id: conversion-check
    type: numericResponse
    prompt: 'How many grams of nitrogen gas (N2) are in 5.00 mol of N2? (M of N =
      14.007 g/mol)

      '
    answer:
      value: 140.1
      tolerance: 0.2
- id: moles-to-particles
  title: Converting Moles to Number of Particles
  problem: |
    **Problem A: A Glass of Water**
    How many water molecules are present in 250.0 mL of liquid water?

    **Problem B: A Swimming Pool**
    How many water molecules are present in 2,500,000 mL (2.5 million mL) of liquid water?

    (Density of water = 1.000 g/mL; M(H2O) = 18.015 g/mol; NA = 6.022 × 10²³ mol⁻¹)
  steps:
  - id: step-moles-to-particles-1
    title: 'Problem A: Step 1 — Find the mass of 250.0 mL of water'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      m = \rho \times V = 1.000 \text{ g/mL} \times 250.0 \text{ mL} = 250.0 \text{
      g}

      $$

      '
  - id: step-moles-to-particles-2
    title: 'Problem A: Step 2 — Convert mass to moles'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      n = \frac{m}{M} = \frac{250.0 \text{ g}}{18.015 \text{ g/mol}} = 13.88 \text{
      mol}

      $$

      '
  - id: step-moles-to-particles-3
    title: 'Problem A: Step 3 — Convert moles to molecules'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      N = n \times N_A = 13.88 \text{ mol} \times 6.022 \times 10^{23} \text{ mol}^{-1}
      $$
      $$
      N = 8.36 \times 10^{24} \text{ molecules}
      $$

      That's more than 8 quadrillion water molecules in a 250 mL glass.

      ![Visual representation of glass of water molecules](/media/placeholders/mole-particles-glass.svg)
  - id: step-moles-to-particles-4
    title: 'Problem B: Step 1 — Find the mass of 2,500,000 mL of water'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      m = \rho \times V = 1.000 \text{ g/mL} \times 2500000 \text{ mL} = 2500000 \text{ g}
      $$
  - id: step-moles-to-particles-5
    title: 'Problem B: Step 2 — Convert mass to moles'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      n = \frac{m}{M} = \frac{2500000 \text{ g}}{18.015 \text{ g/mol}} = 1.388 \times 10^5 \text{ mol}
      $$
  - id: step-moles-to-particles-6
    title: 'Problem B: Step 3 — Convert moles to molecules'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      N = n \times N_A = (1.388 \times 10^5 \text{ mol}) \times 6.022 \times 10^{23} \text{ mol}^{-1}
      $$
      $$
      N = 8.36 \times 10^{28} \text{ molecules}
      $$

      That's an unimaginably large number of water molecules in a swimming pool.

      ![Visual representation of swimming pool molecules](/media/placeholders/mole-particles-pool.svg)
  check:
    id: particles-check
    type: numericResponse
    prompt: 'How many atoms are in 1.000 mol of iron (Fe)? Give your answer in scientific
      notation as the coefficient (e.g., if the answer is 6.022 × 10²³, enter 6.022
      × 10²³ as a decimal — but since this is numeric, enter the full value). Round
      to 4 significant figures: 6.022e23.


      Enter the coefficient only (the number before × 10²³): e.g., if the answer is
      6.022 × 10²³, enter 6.022.

      '
    answer:
      value: 6.022
      tolerance: 0.002
- id: molar-mass-calculation
  title: Calculating Molar Mass of a Compound
  problem: |
    **Problem A: Iron Oxides**
    Calculate the molar mass of each compound and determine which contains more iron by mass: 100 g of Fe2O3 or 100 g of Fe3O4.

    **Problem B: Copper Oxides**
    Calculate the molar mass of each compound and determine which contains more copper by mass: 100 g of CuO or 100 g of Cu2O.

    Use: Fe = 55.845, O = 15.999, Cu = 63.546 g/mol.
  steps:
  - id: step-molar-mass-calculation-1
    title: 'Problem A: Step 1 — Molar mass of Fe2O3'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      M_{Fe_2O_3} = 2(55.845) + 3(15.999) = 111.690 + 47.997 = 159.687 \text{ g/mol}

      $$

      '
  - id: step-molar-mass-calculation-2
    title: 'Problem A: Step 2 — Molar mass of Fe3O4'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      M_{Fe_3O_4} = 3(55.845) + 4(15.999) = 167.535 + 63.996 = 231.531 \text{ g/mol}

      $$

      '
  - id: step-molar-mass-calculation-3
    title: 'Problem A: Step 3 — Percent iron by mass in each compound'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      \%\text{Fe in Fe}_2\text{O}_3 = \frac{111.690}{159.687} \times 100\% = 69.94\%
      $$
      $$
      \%\text{Fe in Fe}_3\text{O}_4 = \frac{167.535}{231.531} \times 100\% = 72.36\%
      $$

      **Fe3O4 contains a higher percentage of iron by mass** (72.36% vs. 69.94%).

      In 100 g of each ore:
      - Fe2O3 → 69.94 g of Fe
      - Fe3O4 → 72.36 g of Fe

      ![Visual representation of iron oxides](/media/placeholders/molar-mass-iron.svg)
  - id: step-molar-mass-calculation-4
    title: 'Problem B: Step 1 — Molar mass of CuO'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      M_{CuO} = 63.546 + 15.999 = 79.545 \text{ g/mol}
      $$
  - id: step-molar-mass-calculation-5
    title: 'Problem B: Step 2 — Molar mass of Cu2O'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      M_{Cu_2O} = 2(63.546) + 15.999 = 127.092 + 15.999 = 143.091 \text{ g/mol}
      $$
  - id: step-molar-mass-calculation-6
    title: 'Problem B: Step 3 — Percent copper by mass in each compound'
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: |
      $$
      \%\text{Cu in CuO} = \frac{63.546}{79.545} \times 100\% = 79.89\%
      $$
      $$
      \%\text{Cu in Cu}_2\text{O} = \frac{127.092}{143.091} \times 100\% = 88.82\%
      $$

      **Cu2O contains a higher percentage of copper by mass** (88.82% vs. 79.89%).

      In 100 g of each ore:
      - CuO → 79.89 g of Cu
      - Cu2O → 88.82 g of Cu

      ![Visual representation of copper oxides](/media/placeholders/molar-mass-copper.svg)
  check:
    id: molar-mass-check
    type: numericResponse
    prompt: 'What is the molar mass of Al2(SO4)3? Use: Al = 26.982, S = 32.065, O
      = 15.999 g/mol.

      '
    answer:
      value: 342.15
      tolerance: 0.5
    explanation: 'M = 2(26.982) + 3(32.065) + 12(15.999) = 53.964 + 96.195 + 191.988
      = 342.147 g/mol.

      '
