workedExamples:
  - id: grams-to-moles
    title: Converting Between Grams and Moles
    problem: |
      (a) How many moles of sodium (Na) are in 45.98 g of sodium?
      (b) What mass (in grams) of calcium carbonate (CaCO3) is present in 3.25 mol of CaCO3?
      Use: Na = 22.990 g/mol; Ca = 40.078, C = 12.011, O = 15.999 g/mol.
    steps:
      - id: na-grams-to-moles
        title: (a) Grams of Na → Moles of Na
        content: |
          **Step 1:** Identify the molar mass of Na.
          $M_{Na} = 22.990 \text{ g/mol}$

          **Step 2:** Apply the conversion:
          $$
          n = \frac{m}{M} = \frac{45.98 \text{ g}}{22.990 \text{ g/mol}} = 2.000 \text{ mol}
          $$

          There are **2.000 mol of sodium** in 45.98 g.
      - id: caco3-moles-to-grams
        title: (b) Moles of CaCO3 → Grams of CaCO3
        content: |
          **Step 1:** Calculate the molar mass of CaCO3.
          $$
          M = 40.078 + 12.011 + 3(15.999) = 40.078 + 12.011 + 47.997 = 100.086 \text{ g/mol}
          $$

          **Step 2:** Convert moles to grams:
          $$
          m = n \times M = 3.25 \text{ mol} \times 100.086 \text{ g/mol} = 325.3 \text{ g}
          $$
    check:
      id: conversion-check
      type: numericResponse
      prompt: |
        How many grams of nitrogen gas (N2) are in 5.00 mol of N2? (M of N = 14.007 g/mol)
      answer:
        value: 140.1
        tolerance: 0.2

  - id: moles-to-particles
    title: Converting Moles to Number of Particles
    problem: |
      How many water molecules are present in 250.0 mL of liquid water?
      (Density of water = 1.000 g/mL; M(H2O) = 18.015 g/mol; NA = 6.022 × 10²³ mol⁻¹)
    steps:
      - id: mass-from-density
        title: Step 1 — Find the mass of 250.0 mL of water
        content: |
          $$
          m = \rho \times V = 1.000 \text{ g/mL} \times 250.0 \text{ mL} = 250.0 \text{ g}
          $$
      - id: grams-to-moles-water
        title: Step 2 — Convert mass to moles
        content: |
          $$
          n = \frac{m}{M} = \frac{250.0 \text{ g}}{18.015 \text{ g/mol}} = 13.88 \text{ mol}
          $$
      - id: moles-to-molecules
        title: Step 3 — Convert moles to molecules
        content: |
          $$
          N = n \times N_A = 13.88 \text{ mol} \times 6.022 \times 10^{23} \text{ mol}^{-1}
          $$
          $$
          N = 8.36 \times 10^{24} \text{ molecules}
          $$

          That's more than 8 quadrillion water molecules in a 250 mL glass.
    check:
      id: particles-check
      type: numericResponse
      prompt: |
        How many atoms are in 1.000 mol of iron (Fe)? Give your answer in scientific notation as the coefficient (e.g., if the answer is 6.022 × 10²³, enter 6.022 × 10²³ as a decimal — but since this is numeric, enter the full value). Round to 4 significant figures: 6.022e23.

        Enter the coefficient only (the number before × 10²³): e.g., if the answer is 6.022 × 10²³, enter 6.022.
      answer:
        value: 6.022
        tolerance: 0.002

  - id: molar-mass-calculation
    title: Calculating Molar Mass of a Compound
    problem: |
      Calculate the molar mass of each compound and determine which contains more iron by mass: 100 g of Fe2O3 or 100 g of Fe3O4.
      Use: Fe = 55.845 g/mol, O = 15.999 g/mol.
    steps:
      - id: molar-mass-fe2o3
        title: Step 1 — Molar mass of Fe2O3
        content: |
          $$
          M_{Fe_2O_3} = 2(55.845) + 3(15.999) = 111.690 + 47.997 = 159.687 \text{ g/mol}
          $$
      - id: molar-mass-fe3o4
        title: Step 2 — Molar mass of Fe3O4
        content: |
          $$
          M_{Fe_3O_4} = 3(55.845) + 4(15.999) = 167.535 + 63.996 = 231.531 \text{ g/mol}
          $$
      - id: percent-fe
        title: Step 3 — Percent iron by mass in each compound
        content: |
          $$
          \%\text{Fe in Fe}_2\text{O}_3 = \frac{111.690}{159.687} \times 100\% = 69.94\%
          $$
          $$
          \%\text{Fe in Fe}_3\text{O}_4 = \frac{167.535}{231.531} \times 100\% = 72.36\%
          $$

          **Fe3O4 contains a higher percentage of iron by mass** (72.36% vs. 69.94%).

          In 100 g of each ore:
          - Fe2O3 → 69.94 g of Fe
          - Fe3O4 → 72.36 g of Fe
    check:
      id: molar-mass-check
      type: numericResponse
      prompt: |
        What is the molar mass of Al2(SO4)3? Use: Al = 26.982, S = 32.065, O = 15.999 g/mol.
      answer:
        value: 342.15
        tolerance: 0.5
      explanation: |
        M = 2(26.982) + 3(32.065) + 12(15.999) = 53.964 + 96.195 + 191.988 = 342.147 g/mol.


