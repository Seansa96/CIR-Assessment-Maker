workedExamples:
- id: reinforcement-cap-we1
  title: Parallel network
  problem: Capacitors $C_1=3\,\mu\mathrm F$ and $C_2=5\,\mu\mathrm F$ are connected in parallel across $12\,\mathrm V$.
  steps:
  - id: reinforcement-cap-we1-s1
    title: Choose the network rule
    instruction: Identify the common electrical quantity in parallel.
    hint: Parallel components share the same two nodes.
    type: multipleChoice
    prompt: Which equation gives the equivalent capacitance?
    choices:
    - { id: a, text: '$C_{eq}=C_1+C_2$' }
    - { id: b, text: '$1/C_{eq}=1/C_1+1/C_2$', issueSignals: [{ id: physics2-capacitance-series-rule, domains: [physics-2] }] }
    - { id: c, text: '$C_{eq}=C_1-C_2$', issueSignals: [{ id: physics2-capacitance-subtraction-rule, domains: [physics-2] }] }
    - { id: d, text: '$C_{eq}=C_1C_2$', issueSignals: [{ id: physics2-capacitance-product-rule, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Parallel capacitances add because charges add at common voltage. Why it works: Both capacitors connect across the same potential difference. Why the other choices fail: b is the reciprocal series rule, while c and d are not network laws.'
  - id: reinforcement-cap-we1-s2
    title: Calculate stored charge
    instruction: Find $C_{eq}$, then use $Q=C_{eq}V$.
    hint: The voltage is $12\,\mathrm V$ across the equivalent capacitor.
    type: multipleChoice
    prompt: What total charge is stored by the parallel combination?
    choices:
    - { id: a, text: '$96\,\mu\mathrm C$' }
    - { id: b, text: '$24\,\mu\mathrm C$', issueSignals: [{ id: physics2-capacitance-single-branch-error, domains: [physics-2] }] }
    - { id: c, text: '$7.5\,\mu\mathrm C$', issueSignals: [{ id: physics2-capacitance-voltage-division, domains: [physics-2] }] }
    - { id: d, text: '$8\,\mu\mathrm C$', issueSignals: [{ id: physics2-capacitance-voltage-factor, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $C_{eq}=3+5=8\,\mu\mathrm F$, so $Q=C_{eq}V=8(12)=96\,\mu\mathrm C$. Why it works: Both branches see $12\,\mathrm V$ and their charges add. Why the other choices fail: They use one branch, divide by voltage, or omit the voltage factor.'
  - id: reinforcement-cap-we1-s3
    title: Verify units
    instruction: Check the dimensions of charge.
    hint: $Q=CV$.
    type: multipleChoice
    prompt: Which unit is correct for the computed charge?
    choices: [{ id: a, text: '$\mu\mathrm C' }, { id: b, text: '$\mu\mathrm F/\mathrm V$', issueSignals: [{ id: physics2-capacitance-unit, domains: [physics-2] }] }, { id: c, text: '$\mathrm V/\mu\mathrm F$', issueSignals: [{ id: physics2-capacitance-unit-inverse, domains: [physics-2] }] }, { id: d, text: '$\mathrm N/\mathrm C$', issueSignals: [{ id: physics2-capacitance-field-unit, domains: [physics-2] }] }]
    answer: { choiceId: a }
    explanation: 'Solution: $CV$ has units of coulombs. Why it works: $C=Q/V$ rearranges to $Q=CV$. Why the other choices fail: They leave capacitance per voltage, invert the relation, or use field units.'
- id: reinforcement-cap-we2
  title: Isolated capacitor with dielectric
  problem: An isolated capacitor has charge $Q$ and capacitance $C$. A dielectric doubles its capacitance.
  steps:
  - id: reinforcement-cap-we2-s1
    title: Select the fixed quantity
    instruction: Identify the boundary condition before choosing an energy relation.
    hint: “Isolated” means no conducting path to a battery.
    type: multipleChoice
    prompt: Which quantity remains fixed during insertion?
    choices:
    - { id: a, text: 'Charge $Q$' }
    - { id: b, text: 'Voltage $V$ because every capacitor is battery-connected', issueSignals: [{ id: physics2-capacitance-isolation-error, domains: [physics-2] }] }
    - { id: c, text: 'Capacitance $C$ because material cannot change geometry', issueSignals: [{ id: physics2-dielectric-capacitance-error, domains: [physics-2] }] }
    - { id: d, text: 'Energy $U$ regardless of insertion work', issueSignals: [{ id: physics2-capacitance-energy-condition-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: Isolation fixes free charge; the dielectric changes capacitance and therefore voltage and energy. Why it works: No battery is available to supply charge. Why the other choices fail: They assume a connected battery or ignore the dielectric response.'
  - id: reinforcement-cap-we2-s2
    title: Compare energy
    instruction: Use $U=Q^2/(2C)$ for fixed charge.
    hint: The denominator doubles.
    type: multipleChoice
    prompt: How does the stored energy change when $C$ doubles?
    choices:
    - { id: a, text: 'It becomes one-half its original value' }
    - { id: b, text: 'It doubles because capacitance increased', issueSignals: [{ id: physics2-capacitance-energy-form-error, domains: [physics-2] }] }
    - { id: c, text: 'It quadruples because energy is quadratic', issueSignals: [{ id: physics2-capacitance-energy-power-error, domains: [physics-2] }] }
    - { id: d, text: 'It remains unchanged because $Q$ is fixed', issueSignals: [{ id: physics2-capacitance-fixed-charge-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: 'Solution: With fixed $Q$, doubling $C$ makes $U=Q^2/(2C)$ half as large. Why it works: The voltage drops and field energy decreases during dielectric insertion. Why the other choices fail: They use the fixed-voltage form or treat fixed charge as fixed energy.'
  - id: reinforcement-cap-we2-s3
    title: Check the limiting trend
    instruction: Test $U=Q^2/(2C)$ as capacitance grows.
    hint: Keep charge fixed.
    type: multipleChoice
    prompt: If $C$ becomes very large at fixed $Q$, what happens to $U$?
    choices: [{ id: a, text: 'It approaches zero' }, { id: b, text: 'It grows without bound', issueSignals: [{ id: physics2-capacitance-energy-limit, domains: [physics-2] }] }, { id: c, text: 'It is unchanged', issueSignals: [{ id: physics2-capacitance-energy-constant, domains: [physics-2] }] }, { id: d, text: 'It changes sign', issueSignals: [{ id: physics2-capacitance-energy-sign, domains: [physics-2] }] }]
    answer: { choiceId: a }
    explanation: 'Solution: $U$ approaches zero because $C$ is in the denominator. Why it works: The fixed-charge energy form is inverse in $C$. Why the other choices fail: They reverse the limit, omit the denominator, or invent a sign change.'
