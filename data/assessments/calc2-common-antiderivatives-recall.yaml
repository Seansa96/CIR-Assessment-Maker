schemaVersion: 1
id: calc2-common-antiderivatives-recall
title: Common and Useful Antiderivatives Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryId: calc2-common-antiderivatives-recall
subcategoryIds:
  - integration-techniques
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
    - antiderivatives
    - integration-foundations
    - trigonometric-antiderivatives
    - logarithmic-antiderivatives
    - inverse-trigonometric-antiderivatives
items:
  - id: antiderivative-sine
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\sin x\,dx
      $$
    answer:
      expectedLatex: '-\cos x+C'
      aliases:
        - negative cosine x plus c
    explanation: |
      Differentiate $-\cos x$ to recover $\sin x$. The negative sign compensates for
      $\frac{d}{dx}(\cos x)=-\sin x$.
    tags:
      - antiderivatives
      - sine
      - sign-check

  - id: antiderivative-cosine
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\cos x\,dx
      $$
    answer:
      expectedLatex: '\sin x+C'
      aliases:
        - sine x plus c
    explanation: |
      Since $\frac{d}{dx}(\sin x)=\cos x$, the antiderivative is $\sin x+C$.
    tags:
      - antiderivatives
      - cosine

  - id: antiderivative-secant-squared
    type: cloze
    prompt: |
      Complete:

      $$
      \int\sec^2x\,dx=\_\_\_\_
      $$
    answer:
      expected: tan(x) + C
      aliases:
        - tan x plus c
        - tangent x plus c
    explanation: |
      This is the reverse derivative

      $$
      \frac{d}{dx}(\tan x)=\sec^2x.
      $$
    tags:
      - antiderivatives
      - tangent
      - secant-squared

  - id: antiderivative-cosecant-squared
    type: cloze
    prompt: |
      Complete:

      $$
      \int\csc^2x\,dx=\_\_\_\_
      $$
    answer:
      expected: -cot(x) + C
      aliases:
        - negative cot x plus c
        - minus cotangent x plus c
    explanation: |
      Remember the negative derivative:

      $$
      \frac{d}{dx}(\cot x)=-\csc^2x.
      $$
    tags:
      - antiderivatives
      - cotangent
      - cosecant-squared
      - sign-check

  - id: antiderivative-secant-tangent
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\sec x\tan x\,dx
      $$
    answer:
      expectedLatex: '\sec x+C'
      aliases:
        - sec x plus c
        - secant x plus c
    explanation: |
      This reverses

      $$
      \frac{d}{dx}(\sec x)=\sec x\tan x.
      $$
    tags:
      - antiderivatives
      - secant
      - tangent

  - id: antiderivative-cosecant-cotangent
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\csc x\cot x\,dx
      $$
    answer:
      expectedLatex: '-\csc x+C'
      aliases:
        - negative csc x plus c
        - minus cosecant x plus c
    explanation: |
      The derivative of cosecant carries a negative sign:

      $$
      \frac{d}{dx}(\csc x)=-\csc x\cot x.
      $$
    tags:
      - antiderivatives
      - cosecant
      - cotangent
      - sign-check

  - id: antiderivative-tangent
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\tan x\,dx
      $$
    answer:
      expectedLatex: '-\ln|\cos x|+C'
      aliases:
        - ln absolute sec x plus c
        - negative ln absolute cos x plus c
    explanation: |
      Rewrite

      $$
      \tan x=\frac{\sin x}{\cos x}.
      $$

      With $u=\cos x$ and $du=-\sin x\,dx$:

      $$
      \int\tan x\,dx
      =-\int\frac{1}{u}\,du
      =-\ln|\cos x|+C.
      $$

      Equivalently, this is $\ln|\sec x|+C$.
    tags:
      - antiderivatives
      - tangent
      - logarithmic-antiderivative

  - id: antiderivative-cotangent
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\cot x\,dx
      $$
    answer:
      expectedLatex: '\ln|\sin x|+C'
      aliases:
        - ln absolute sin x plus c
    explanation: |
      Rewrite $\cot x=\frac{\cos x}{\sin x}$ and use
      $u=\sin x$, $du=\cos x\,dx$:

      $$
      \int\cot x\,dx=\ln|\sin x|+C.
      $$
    tags:
      - antiderivatives
      - cotangent
      - logarithmic-antiderivative

  - id: antiderivative-secant
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\sec x\,dx
      $$
    answer:
      expectedLatex: '\ln|\sec x+\tan x|+C'
      aliases:
        - ln absolute sec x plus tan x plus c
    explanation: |
      Multiply by

      $$
      \frac{\sec x+\tan x}{\sec x+\tan x}.
      $$

      The numerator becomes

      $$
      \sec^2x+\sec x\tan x
      =\frac{d}{dx}(\sec x+\tan x),
      $$

      producing the logarithm.
    tags:
      - antiderivatives
      - secant
      - logarithmic-antiderivative

  - id: antiderivative-cosecant
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\csc x\,dx
      $$
    answer:
      expectedLatex: '\ln|\csc x-\cot x|+C'
      aliases:
        - negative ln absolute csc x plus cot x plus c
        - ln absolute csc x minus cot x plus c
    explanation: |
      One standard form is

      $$
      \int\csc x\,dx=\ln|\csc x-\cot x|+C.
      $$

      An equivalent form is $-\ln|\csc x+\cot x|+C$. Differentiate either form to
      verify the sign.
    tags:
      - antiderivatives
      - cosecant
      - logarithmic-antiderivative
      - sign-check

  - id: antiderivative-reciprocal
    type: cloze
    prompt: |
      Complete:

      $$
      \int\frac{1}{x}\,dx=\_\_\_\_
      $$
    answer:
      expected: ln|x| + C
      aliases:
        - natural log absolute x plus c
        - ln absolute x plus c
    explanation: |
      The absolute value is required because $\frac{1}{x}$ is defined on both the
      positive and negative intervals away from zero.
    tags:
      - antiderivatives
      - logarithm
      - reciprocal

  - id: antiderivative-exponential-e
    type: symbolic
    prompt: |
      Recall:

      $$
      \int e^x\,dx
      $$
    answer:
      expectedLatex: 'e^x+C'
      aliases:
        - e to the x plus c
    explanation: |
      The exponential function $e^x$ is its own derivative and antiderivative.
    tags:
      - antiderivatives
      - exponential

  - id: antiderivative-exponential-base
    type: cloze
    prompt: |
      For $a>0$ and $a\ne1$, complete:

      $$
      \int a^x\,dx=\_\_\_\_
      $$
    answer:
      expected: a^x / ln(a) + C
      aliases:
        - a to the x over natural log a plus c
        - a^x divided by ln a plus c
    explanation: |
      Since $\frac{d}{dx}(a^x)=a^x\ln a$, divide by $\ln a$ to reverse the
      derivative.
    tags:
      - antiderivatives
      - exponential
      - chain-rule-reversal

  - id: antiderivative-arctangent-pattern
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\frac{1}{1+x^2}\,dx
      $$
    answer:
      expectedLatex: '\arctan x+C'
      aliases:
        - inverse tangent x plus c
        - arctan x plus c
    explanation: |
      This reverses

      $$
      \frac{d}{dx}(\arctan x)=\frac{1}{1+x^2}.
      $$
    tags:
      - antiderivatives
      - inverse-trigonometric
      - arctangent

  - id: antiderivative-arctangent-scaled
    type: flashcard
    prompt: |
      What common antiderivative pattern matches

      $$
      \int\frac{1}{a^2+x^2}\,dx,
      \qquad a>0?
      $$
    answer:
      expectedLatex: '\frac{1}{a}\arctan\left(\frac{x}{a}\right)+C'
      aliases:
        - one over a arctan x over a plus c
    explanation: |
      Factor $a^2$ from the denominator or use $u=x/a$. The outer factor
      $\frac{1}{a}$ is required by the chain rule.
    tags:
      - antiderivatives
      - inverse-trigonometric
      - arctangent
      - scaled-pattern

  - id: antiderivative-arcsine-pattern
    type: symbolic
    prompt: |
      Recall:

      $$
      \int\frac{1}{\sqrt{1-x^2}}\,dx
      $$
    answer:
      expectedLatex: '\arcsin x+C'
      aliases:
        - inverse sine x plus c
        - arcsin x plus c
    explanation: |
      This reverses

      $$
      \frac{d}{dx}(\arcsin x)=\frac{1}{\sqrt{1-x^2}}.
      $$
    tags:
      - antiderivatives
      - inverse-trigonometric
      - arcsine

  - id: antiderivative-arcsine-scaled
    type: flashcard
    prompt: |
      What common antiderivative pattern matches

      $$
      \int\frac{1}{\sqrt{a^2-x^2}}\,dx,
      \qquad a>0?
      $$
    answer:
      expectedLatex: '\arcsin\left(\frac{x}{a}\right)+C'
      aliases:
        - arcsin x over a plus c
        - inverse sine x over a plus c
    explanation: |
      Differentiating $\arcsin(x/a)$ produces

      $$
      \frac{1/a}{\sqrt{1-x^2/a^2}}
      =\frac{1}{\sqrt{a^2-x^2}}.
      $$
    tags:
      - antiderivatives
      - inverse-trigonometric
      - arcsine
      - scaled-pattern

  - id: antiderivative-memory-check
    type: typed
    prompt: |
      Which four single-function trigonometric antiderivatives produce logarithms?
    answer:
      expected: tangent, cotangent, secant, and cosecant
      aliases:
        - tan cot sec csc
        - tan(x), cot(x), sec(x), csc(x)
    explanation: |
      The logarithmic family is:

      $$
      \begin{aligned}
      \int\tan x\,dx&=-\ln|\cos x|+C,\\
      \int\cot x\,dx&=\ln|\sin x|+C,\\
      \int\sec x\,dx&=\ln|\sec x+\tan x|+C,\\
      \int\csc x\,dx&=\ln|\csc x-\cot x|+C.
      \end{aligned}
      $$
    tags:
      - antiderivatives
      - logarithmic-antiderivatives
      - memory-family
