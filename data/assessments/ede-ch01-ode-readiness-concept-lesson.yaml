schemaVersion: 1
id: ede-ch01-ode-readiness-concept-lesson
title: 'ODE Readiness: Calculus, Algebra, and Domains'
assessmentType: conceptLesson
categoryId: elementary-differential-equations-bvp
topicId: ede-ch01-introduction
modeDefault: practice
randomizeQuestions: false
skills:
- ede-ch01-introduction
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - elementary-differential-equations-bvp
  - ede-ch01-introduction
  - s2c-approved
  - supplemental
lesson:
  introduction: A differential-equations method is reliable only when its algebra, calculus, units, and domain restrictions
    are reliable.
  sections:
  - id: s1
    title: Functions and valid domains
    required: true
    content: A proposed solution must be defined and differentiable on an open interval. Denominators cannot vanish,
      logarithm arguments must be positive before absolute-value simplification, and an IVP interval must contain
      its initial input.
    media: []
    check:
      id: q001
      type: multipleChoice
      prompt: What is the real domain of $f(x)=\ln(x-2)/(x+1)$?
      skills:
      - ede-ch01-introduction-calculus-readiness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-calculus-readiness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The logarithm requires $x>2$, which already excludes $x=-1$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $(2,\infty)$
      - id: b
        text: $(-1,\infty)$
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $(-\infty,-1)\cup(2,\infty)$
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $[-1,2]$
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Derivatives as rates with units
    required: true
    content: If $V(t)$ is measured in liters and $t$ in minutes, then $V'(t)$ is measured in liters per minute.
      Units are a fast check on whether a proposed rate law can be correct.
    media: []
    check:
      id: q002
      type: multipleChoice
      prompt: If $M(t)$ is mass in grams and $t$ is seconds, what are the units of $M'(t)$?
      skills:
      - ede-ch01-introduction-calculus-readiness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-calculus-readiness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $M'$ measures change in mass divided by change in time.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: grams per second
      - id: b
        text: seconds per gram
        issueSignals:
        - id: ede-unit-consistency-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: grams
        issueSignals:
        - id: ede-unit-consistency-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: grams squared per second
        issueSignals:
        - id: ede-unit-consistency-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Product and chain rules
    required: true
    content: ODE verification often differentiates products and compositions. For $y=x e^{x^2}$, the product rule
      and chain rule give $y'=e^{x^2}(1+2x^2)$.
    media:
    - type: image
      src: /media/ede/ch01-calculus-readiness-map.svg
      alt: Dependency map connecting domain checks, derivative rules, antiderivatives, initial data, and verification.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q003
      type: multipleChoice
      prompt: Differentiate $x e^{x^2}$.
      skills:
      - ede-ch01-introduction-calculus-readiness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-calculus-readiness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The product derivative is $e^{x^2}+x(2x)e^{x^2}$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $e^{x^2}(1+2x^2)$
      - id: b
        text: $2x^2e^{x^2}$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $e^{2x}$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $(1+2x)e^{x^2}$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Antiderivatives and initial data
    required: true
    content: Integrating $y'=g(x)$ gives a family $y=G(x)+C$. The constant remains until initial data select one
      member of the family.
    media: []
    check:
      id: q004
      type: symbolicResponse
      prompt: Solve $y'=6x-2$ with $y(0)=5$.
      skills:
      - ede-ch01-introduction-calculus-readiness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch01-introduction-calculus-readiness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $y=3x^2-2x+C$ and $C=5$.

        Why it works: Differentiation and the supplied data verify the expression.
      answer:
        expectedLatex: 3x^2-2x+5
        equivalenceMode: expression
        variables:
        - x
        tolerance: 0.0001
  - id: s5
    title: Logarithms and partial fractions
    required: true
    content: Separation frequently produces rational functions. Decompose first, integrate each simple term, retain
      absolute values, and only then use initial data to choose a branch.
    media: []
    check:
      id: q005
      type: multipleChoice
      prompt: Which decomposition is correct for $1/[y(y-2)]$?
      skills:
      - ede-ch01-introduction-calculus-readiness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch01-introduction-calculus-readiness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Solving $1=A(y-2)+By$ gives $A=-1/2$ and $B=1/2$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $-1/(2y)+1/[2(y-2)]$
      - id: b
        text: $1/y+1/(y-2)$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $1/(2y)+1/[2(y-2)]$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $-1/y+1/(y-2)$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Implicit differentiation and verification
    required: true
    content: An implicit relation can define local solution branches. Differentiate the entire relation, solve for
      the required derivative where possible, and check that the selected point lies on the curve.
    media: []
    check:
      id: q006
      type: numericResponse
      prompt: For $x^2+y^2=25$, find $dy/dx$ at $(3,4)$.
      skills:
      - ede-ch01-introduction-calculus-readiness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch01-introduction-calculus-readiness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $2x+2yy'=0$, so $y'=-x/y=-3/4$.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: -0.75
        tolerance: 0.0001
