glossary:
  introduction: Vocabulary for separating the roles that different sentences play in mathematical writing.
  sections:
  - id: roles-in-text
    title: Roles in mathematical text
    required: true
    content: Identify a sentence's role before deciding what evidence it supplies.
    entries:
    - id: t01
      term: Definition
      definition: A statement that specifies the meaning of a term or object in the current mathematical setting.
      drills:
      - id: t01-drill
        type: flashcard
        prompt: What does a definition specify?
        answer:
          expected: Meaning.
        explanation: 'Solution: Meaning. Why it works: Definitions fix usage in a mathematical setting.'
        tags: []
    - id: t02
      term: Hypothesis
      definition: A stated assumption required before a theorem or conditional conclusion can be used.
      drills:
      - id: t02-drill
        type: flashcard
        prompt: What is a hypothesis?
        answer:
          expected: A required assumption.
        explanation: 'Solution: A required assumption. Why it works: It must hold before applying a conditional
          result.'
        tags: []
    - id: t03
      term: Theorem
      definition: A mathematical statement that has been established by proof.
      drills:
      - id: t03-drill
        type: flashcard
        prompt: What establishes a theorem?
        answer:
          expected: Proof.
        explanation: 'Solution: Proof. Why it works: A theorem is a proved mathematical statement.'
        tags: []
    - id: t04
      term: Example
      definition: A particular case used to illustrate an idea or test understanding.
      drills:
      - id: t04-drill
        type: flashcard
        prompt: What does an example illustrate?
        answer:
          expected: A particular case.
        explanation: 'Solution: A particular case. Why it works: Examples clarify an idea through instances.'
        tags: []
    - id: t05
      term: Counterexample
      definition: A permitted example that makes a universal claim false.
      drills:
      - id: t05-drill
        type: flashcard
        prompt: What can a counterexample refute?
        answer:
          expected: A universal claim.
        explanation: 'Solution: A universal claim. Why it works: One violating permitted case disproves it.'
        tags: []
