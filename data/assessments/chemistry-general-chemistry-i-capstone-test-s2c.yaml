questions:
  - id: q001
    type: numericResponse
    prompt: |
      Propane burns according to

      $$C_3H_8+5O_2\rightarrow3CO_2+4H_2O.$$

      If 11.0 g of propane reacts with 30.0 g of oxygen, what mass of $CO_2$ can form? Use molar masses 44.10 g/mol for propane, 32.00 g/mol for oxygen, and 44.01 g/mol for carbon dioxide.
    answer: { value: 24.8, tolerance: 0.08 }
    explanation: 'Solution: $n(C_3H_8)=11.0/44.10=0.249\text{ mol}$ and $n(O_2)=30.0/32.00=0.938\text{ mol}$. Propane would require $1.25$ mol $O_2$, so oxygen limits. Then $0.938(3/5)=0.563\text{ mol }CO_2$, or $24.8$ g. Why it works: The limiting reactant determines the available reaction extent; its coefficient ratio converts that extent to product. Therefore the answer is 24.8 g.'
    difficultyDimensions: [stoichiometricPipeline, limitingReactantReasoning, unitConversion, significantFigures]
    difficultyEvidence: 'Requires two mass-to-mole paths, limiting comparison, and a coefficient conversion.'
    prerequisiteObjectiveIds: [chem1-quantitative-pipeline]
    extensionObjectiveIds: [chem1-energy-model]
    issueSignals: [{ id: limiting-reactant-misidentified }]
  - id: q002
    type: freeResponse
    prompt: 'Mix aqueous $BaCl_2$ and $Na_2SO_4$. Write the balanced net ionic equation, including states, and name the spectator ions.'
    answer: { gradingMode: selfCheck, keyPoints: ['$Ba^{2+}(aq)+SO_4^{2-}(aq)\rightarrow BaSO_4(s)$', 'spectators are $Na^+$ and $Cl^-$', 'charges and atoms are balanced'] }
    explanation: 'Solution: $Ba^{2+}(aq)+SO_4^{2-}(aq)\rightarrow BaSO_4(s)$; $Na^+$ and $Cl^-$ are spectators. Why it works: Barium sulfate is insoluble, while the sodium and chloride ions remain unchanged in solution.'
    difficultyDimensions: [reactionPrediction, solubilityReasoning, ionicRepresentation]
    difficultyEvidence: 'Requires product prediction, solubility classification, and cancellation of spectators.'
    prerequisiteObjectiveIds: [chem1-aqueous-reaction-model]
    extensionObjectiveIds: [chem1-gas-solution-models]
    issueSignals: [{ id: precipitate-solubility-error }]
  - id: q003
    type: numericResponse
    prompt: 'A 0.125 mol sample of gas occupies 2.50 L at 1.20 atm. What volume will it occupy at 0.800 atm and the same temperature?'
    answer: { value: 3.75, tolerance: 0.02 }
    explanation: 'Solution: At constant temperature and amount, $P_1V_1=P_2V_2$, so $V_2=(1.20\times2.50)/0.800=3.75\text{ L}$. Why it works: Boyle''s law expresses the inverse pressure-volume relationship for a fixed amount of gas at fixed temperature.'
    difficultyDimensions: [modelSelection, algebraicRearrangement, proportionalReasoning]
    difficultyEvidence: 'Requires recognizing the fixed variables and rearranging an inverse proportionality.'
    prerequisiteObjectiveIds: [chem1-gas-solution-models]
    extensionObjectiveIds: [chem1-quantitative-pipeline]
    issueSignals: [{ id: ideal-gas-law-misapplied }]
  - id: q004
    type: numericResponse
    prompt: 'Use the following standard formation enthalpies in kJ/mol: $CO_2(g)=-393.5$, $H_2O(l)=-285.8$, and $C_2H_5OH(l)=-277.7$. Find $\Delta H^\circ_{rxn}$ for $C_2H_5OH(l)+3O_2(g)\rightarrow2CO_2(g)+3H_2O(l)$. '
    answer: { value: -1366.7, tolerance: 0.5 }
    explanation: 'Solution: Products sum to $2(-393.5)+3(-285.8)=-1644.4$ kJ. Reactants sum to $-277.7+3(0)=-277.7$ kJ. Thus $\Delta H^\circ_{rxn}=-1644.4-(-277.7)=-1366.7$ kJ/mol reaction. Why it works: Formation enthalpies are state functions, so coefficient-weighted product values minus reactant values gives the reaction enthalpy.'
    difficultyDimensions: [tableInterpretation, stoichiometricCoefficients, signReasoning, quantitativeCalculation]
    difficultyEvidence: 'Requires coefficient-weighted sums, reference-state handling, and signed subtraction.'
    prerequisiteObjectiveIds: [chem1-energy-model]
    extensionObjectiveIds: [chem1-quantitative-pipeline]
    issueSignals: [{ id: enthalpy-sign-error }]
  - id: q005
    type: multipleChoice
    prompt: 'Which statement correctly compares the intermolecular forces in $CH_4$ and $NH_3$?'
    choices:
      - { id: a, text: '$NH_3$ can hydrogen-bond, while $CH_4$ has only dispersion forces.', issueSignals: [] }
      - { id: b, text: '$CH_4$ hydrogen-bonds because it contains hydrogen.', issueSignals: [{ id: intermolecular-force-misidentified }] }
      - { id: c, text: 'Both have identical forces because both are small molecules.', issueSignals: [{ id: intermolecular-force-misidentified }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. Why it works: Nitrogen bonded to hydrogen and a nitrogen lone pair allow ammonia molecules to hydrogen-bond; methane is nonpolar and uses dispersion forces only. Why the other choices fail: b omits the required electronegative N, O, or F context; c ignores polarity and molecular structure.'
    difficultyDimensions: [structuralAnalysis, intermolecularForceClassification, propertyReasoning]
    difficultyEvidence: 'Links Lewis-structure features to an intermolecular-force model.'
    prerequisiteObjectiveIds: [chem1-structure-properties]
    extensionObjectiveIds: [chem1-gas-solution-models]
    issueSignals: [{ id: intermolecular-force-misidentified }]
  - id: q006
    type: multipleChoice
    prompt: 'A student draws nitrate, $NO_3^-$, with one N=O bond and two N-O single bonds. What additional idea is needed to describe all three N-O bonds accurately?'
    choices:
      - { id: a, text: 'Resonance: equivalent structures distribute the bonding over all three N-O positions.', issueSignals: [] }
      - { id: b, text: 'The octet rule requires nitrogen to have three triple bonds.', issueSignals: [{ id: lewis-structure-octet-error }] }
      - { id: c, text: 'Nitrate is nonpolar only because oxygen has no lone pairs.', issueSignals: [{ id: chemistry-bonding-covalent-pair-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. Why it works: Resonance contributors place the double bond in different positions, representing equal average N-O bond character. Why the other choices fail: b gives nitrogen an impossible electron count; c incorrectly removes oxygen lone pairs and does not explain bond equivalence.'
    difficultyDimensions: [lewisStructure, resonanceReasoning, electronCounting]
    difficultyEvidence: 'Interprets a structural drawing beyond one localized contributor.'
    prerequisiteObjectiveIds: [chem1-structure-properties]
    extensionObjectiveIds: [chem1-energy-model]
    issueSignals: [{ id: chemistry-bonding-resonance-error }]
