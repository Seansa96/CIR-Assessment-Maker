id: physics2-ch14-inductance-concept-lesson
title: Mutual & Self-Inductance
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-inductance
lesson:
  introduction: This lesson develops the main ideas behind Mutual & Self-Inductance and connects them
    to the governing physical relationships.
  sections:
  - id: l1-sec1
    title: Mutual Inductance
    required: true
    content: When a changing current $i_1$ in coil 1 induces an EMF $\mathcal{E}_2$ in coil 2, they have
      a mutual inductance $M$. The induced EMF is $\mathcal{E}_2 = -M \frac{di_1}{dt}$. $M$ depends only
      on the geometry of the two coils.
  - id: l1-sec2
    title: Self-Inductance
    required: true
    content: A changing current in a single coil induces an EMF in that same coil to oppose the change.
      This is self-inductance $L$. The induced EMF is $\mathcal{E} = -L \frac{di}{dt}$. For a solenoid,
      $L = \mu_0 n^2 A l$.
