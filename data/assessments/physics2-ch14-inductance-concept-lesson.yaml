      explanation: >
        Solution: During name the model and quantities for Mutual & Self-Inductance, first relate a current-change rate to induced emf and keep the opposition sign separate from magnitude. Then apply emf_L = -L dI/dt with one consistent coordinate system and solve for the requested quantity.


        Why it works: emf_L = -L dI/dt connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
