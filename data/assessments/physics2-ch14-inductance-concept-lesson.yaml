lesson:
  introduction: >
    This lesson develops a repeatable way to solve Mutual & Self-Inductance problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch14-inductance-s1
    title: Name the model and quantities
    required: true
    content: >
      Mutual & Self-Inductance uses emf_L = -L dI/dt. In the name the model and quantities stage, relate a current-change rate to induced emf and keep the opposition sign separate from magnitude.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Mutual & Self-Inductance problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch14-inductance-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Mutual & Self-Inductance, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use emf_L = -L dI/dt after you relate a current-change rate to induced emf and keep the opposition sign separate from magnitude.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Mutual & Self-Inductance problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-inductance-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables emf_L = -L dI/dt relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-inductance-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Mutual & Self-Inductance.
        media: []
        issueSignals:
        - id: physics2-physics2-ch14-inductance-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
