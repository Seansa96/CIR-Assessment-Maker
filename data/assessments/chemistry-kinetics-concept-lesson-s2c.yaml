schemaVersion: 1
id: chemistry-kinetics-concept-lesson-s2c
title: 'Chemical Kinetics: Rates, Evidence, and Molecular Models'
assessmentType: conceptLesson
categoryId: chemistry
topicId: chemistry-kinetics
modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [chemistry, kinetics] }
authoring: { visualRequirement: required, visualRationale: 'Rate evidence and activation-energy pathways are more reliable when learners connect graphs and molecular models.', sourceId: src-20260720035703-91ea51b0d8 }
lesson:
  introduction: |
    Chemical kinetics asks how quickly a chemical change occurs and why conditions alter that speed. Build every explanation from measured concentration change, a balanced reaction, and a molecular model.
  sections:
    - id: rates
      title: Rate is a measured change over time
      required: true
      content: |
        For a reactant $A$, its concentration decreases, so a positive disappearance rate is $-\Delta[A]/\Delta t$. For a product, use $\Delta[P]/\Delta t$. Always report concentration per time.
      media:
        - type: image
          src: /media/chemistry/kinetics-energy-rate-data.svg
          alt: Reaction-coordinate energy profile comparing catalyzed and uncatalyzed paths beside an initial-rate comparison.
          caption: Rate evidence establishes a rate law; a catalyst lowers the pathway barrier.
      check:
        id: kinetics-check-rate-sign
        type: multipleChoice
        prompt: 'A reactant concentration falls from $0.80\ \mathrm{M}$ to $0.50\ \mathrm{M}$ in $15\ \mathrm{s}$. What is its average disappearance rate?'
        choices:
          - { id: a, text: '$0.020\ \mathrm{M\,s^{-1}}$' }
          - { id: b, text: '$-0.020\ \mathrm{M\,s^{-1}}$' }
          - { id: c, text: '$0.30\ \mathrm{M\,s^{-1}}$' }
        answer: { choiceId: a }
        explanation: 'Solution: $-(0.50-0.80)/15=0.020\ \mathrm{M\,s^{-1}}$. Why it works: The minus sign converts reactant loss to a positive physical rate. Why the other choices fail: b omits that convention; c omits division by time.'
    - id: stoichiometry
      title: A balanced equation connects species rates
      required: true
      content: |
        In $2A\rightarrow B$, consuming two moles of $A$ accompanies forming one mole of $B$. Thus the reaction rate is $-\tfrac12\Delta[A]/\Delta t=\Delta[B]/\Delta t$.
      check:
        id: kinetics-check-stoich
        type: multipleChoice
        prompt: 'For $2X\rightarrow Y$, $X$ disappears at $0.060\ \mathrm{M\,s^{-1}}$. At what rate does $Y$ appear?'
        choices: [{ id: a, text: '$0.030\ \mathrm{M\,s^{-1}}$' }, { id: b, text: '$0.060\ \mathrm{M\,s^{-1}}$' }, { id: c, text: '$0.120\ \mathrm{M\,s^{-1}}$' }]
        answer: { choiceId: a }
        explanation: 'Solution: Divide the $X$ disappearance rate by its coefficient: $0.060/2=0.030\ \mathrm{M\,s^{-1}}$. Why it works: Stoichiometric coefficients set relative concentration changes. Why the other choices fail: b ignores the coefficient; c multiplies in the wrong direction.'
    - id: rate-laws
      title: Rate laws come from experiment
      required: true
      content: |
        A rate law such as $\mathrm{rate}=k[A]^m[B]^n$ is experimental evidence. Reaction orders are exponents measured by comparing trials, not usually the coefficients in the overall equation.
      check:
        id: kinetics-check-order
        type: multipleChoice
        prompt: 'Doubling $[A]$ while holding every other concentration fixed makes the initial rate four times larger. What is the order in $A$?'
        choices: [{ id: a, text: 'first order' }, { id: b, text: 'second order' }, { id: c, text: 'zero order' }]
        answer: { choiceId: b }
        explanation: 'Solution: $4=2^m$, so $m=2$. Why it works: The rate factor equals the concentration factor raised to the order. Why the other choices fail: first order predicts a factor of 2; zero order predicts no change.'
    - id: time
      title: Concentration changes reveal time models
      required: true
      content: |
        For a first-order process, a constant fraction disappears in equal time intervals. Its half-life is constant and satisfies $t_{1/2}=0.693/k$.
      check:
        id: kinetics-check-half-life
        type: numericResponse
        prompt: 'A first-order reaction has $k=0.231\ \mathrm{min^{-1}}$. Find $t_{1/2}$ in minutes.'
        answer: { value: 3.0, tolerance: 0.02 }
        explanation: 'Solution: $t_{1/2}=0.693/0.231=3.00\ \mathrm{min}$. Why it works: First-order half-life depends only on the first-order rate constant.'
    - id: collisions
      title: Collisions need energy and a workable orientation
      required: true
      content: |
        Raising concentration increases collision frequency. Raising temperature increases both collision frequency and the fraction of collisions with energy at least equal to $E_a$.
      check:
        id: kinetics-check-temperature
        type: multipleChoice
        prompt: 'Why does heating a reaction mixture usually increase its rate?'
        choices: [{ id: a, text: 'More collisions exceed the activation-energy threshold.' }, { id: b, text: 'Temperature permanently lowers the activation energy.' }, { id: c, text: 'Every collision becomes productive.' }]
        answer: { choiceId: a }
        explanation: 'Solution: Choose a. Why it works: A warmer energy distribution has a larger high-energy fraction. Why the other choices fail: b describes a catalyst pathway, not heating; c overstates the collision model.'
    - id: catalysts
      title: Catalysts change pathways, not equilibrium position
      required: true
      content: |
        A catalyst supplies an alternative pathway with lower activation energy. It accelerates forward and reverse processes, so equilibrium is reached sooner but $K$ at the same temperature is unchanged.
      check:
        id: kinetics-check-catalyst
        type: multipleChoice
        prompt: 'Which statement about a catalyst in a reversible reaction is correct?'
        choices: [{ id: a, text: 'It makes equilibrium arrive sooner without changing $K$.' }, { id: b, text: 'It shifts equilibrium toward products.' }, { id: c, text: 'It is consumed to lower reactant energy.' }]
        answer: { choiceId: a }
        explanation: 'Solution: Choose a. Why it works: A catalyst lowers barriers for both directions and is regenerated. Why the other choices fail: b confuses kinetics with equilibrium; c confuses a catalyst with a reactant.'
