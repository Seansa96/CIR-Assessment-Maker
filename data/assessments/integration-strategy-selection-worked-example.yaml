workedExamples:
- id: we001
  title: Choosing the most efficient integration method
  problem: Learn\rhow to inspect an integral before committing to a technique.
  steps:
  - id: step-we001-1
    title: Try direct simplification first
    instruction: Before using a named technique, check whether algebra or a basic
      antiderivative makes the integral immediate.
    type: multipleChoice
    prompt: What should you usually check first when seeing an integral?
    choices:
    - id: a
      text: Can it be simplified or integrated directly?
    - id: b
      text: Can every integral use trig substitution?
    - id: c
      text: Can the variable be renamed?
    - id: d
      text: Can the answer be guessed from the title?
    answer:
      choiceId: a
    hint: The fastest method is often the one that avoids a technique.
    explanation: |
      Always check direct integration and algebraic simplification first. Many hard-looking integrals become basic after expanding, factoring, splitting fractions, or applying a known identity.

      Related topic: Pre-strategy simplification; simplify the integrand before choosing substitution, parts, or trig substitution.
  - id: step-we001-2
    title: Recognize u-substitution
    instruction: Look for a composed function and a derivative of the inside, possibly
      up to a constant.
    type: multipleChoice
    prompt: Which integral has the clearest u-substitution structure?
    choices:
    - id: a
      text: $\int 2x\cos(x^2)\,dx$
    - id: b
      text: $\int x e^x\,dx$
    - id: c
      text: $\int \ln x\,dx$
    - id: d
      text: $\int \sqrt{9-x^2}\,dx$
    answer:
      choiceId: a
    hint: The derivative of $x^2$ is present.
    explanation: |
      The inner function is $x^2$, and its derivative $2x$ is present. Let $u=x^2$.

      Related topic: U-substitution trigger; find inside function plus derivative outside.
  - id: step-we001-3
    title: Recognize integration by parts
    instruction: Look for products where one factor simplifies under differentiation.
    type: multipleChoice
    prompt: Which integral most naturally suggests integration by parts?
    choices:
    - id: a
      text: $\int x e^x\,dx$
    - id: b
      text: $\int \frac{2x}{x^2+1}\,dx$
    - id: c
      text: $\int \sin x\,dx$
    - id: d
      text: $\int \frac{1}{x}\,dx$
    answer:
      choiceId: a
    hint: Choose a product where $x$ becomes simpler.
    explanation: |
      $x e^x$ is a product. Choosing $u=x$ makes $du=dx$, while $e^x$ integrates easily.

      Related topic: Integration by parts trigger; product plus a factor that simplifies under differentiation.
  - id: step-we001-4
    title: Recognize trig substitution
    instruction: Look for radicals or powers built from $a^2-x^2$, $x^2+a^2$, or $x^2-a^2$.
    type: multipleChoice
    prompt: Which integral most strongly suggests trigonometric substitution?
    choices:
    - id: a
      text: $\int \sqrt{16-x^2}\,dx$
    - id: b
      text: $\int x^2\,dx$
    - id: c
      text: $\int e^{2x}\,dx$
    - id: d
      text: $\int \frac{1}{x}\,dx$
    answer:
      choiceId: a
    hint: The square root has $a^2-x^2$.
    explanation: |
      $\\sqrt{16-x^2}$ is $\\sqrt{4^2-x^2}$, so $x=4\\sin\\theta$ matches the identity $1-\\sin^2\\theta=\\cos^2\\theta$.

      Related topic: Trig substitution trigger; match square-root forms to Pythagorean identities.
  - id: step-we001-5
    title: Recognize partial fractions
    instruction: Rational functions with factorable denominators often call for partial
      fractions.
    type: multipleChoice
    prompt: Which integral most naturally suggests partial fractions?
    choices:
    - id: a
      text: $\int \frac{3x+5}{(x-1)(x+2)}\,dx$
    - id: b
      text: $\int x\sin x\,dx$
    - id: c
      text: $\int \sqrt{9-x^2}\,dx$
    - id: d
      text: $\int \cos(3x)\,dx$
    answer:
      choiceId: a
    hint: A rational expression with linear factors is the clue.
    explanation: |
      A rational function with a factored denominator suggests decomposing into simpler fractions before integrating.

      Related topic: Partial fractions; factor the denominator and decompose the rational expression.
  - id: step-we001-6
    title: Pick the efficient strategy
    instruction: If more than one method could work, prefer the one with the least
      bookkeeping.
    type: multipleChoice
    prompt: For $\int \frac{2x}{x^2+1}\,dx$, what is the most efficient strategy?
    choices:
    - id: a
      text: U-substitution with $u=x^2+1$
    - id: b
      text: Integration by parts
    - id: c
      text: Trig substitution
    - id: d
      text: Partial fractions
    answer:
      choiceId: a
    hint: The numerator is the derivative of the denominator.
    explanation: |
      U-substitution is fastest because $d(x^2+1)=2x\\,dx$. Other methods might be possible in some artificial sense, but they add unnecessary work.

      Related topic: Efficiency heuristic; when derivative-of-inside is present, use u-substitution before heavier techniques.
  - id: step-we001-7
    title: Build a decision checklist
    instruction: Convert the strategy ideas into an order you can apply quickly.
    type: freeResponse
    prompt: Write a practical checklist for choosing an integration strategy.
    answer:
      expected: 'First simplify or use direct antiderivatives. Then check for u-substitution
        by looking for an inside function and its derivative. If there is a product
        with a simplifying factor, consider integration by parts. If there is a rational
        function with a factorable denominator, consider partial fractions. If there
        is a square-root pattern like $a^2-x^2$, $x^2+a^2$, or $x^2-a^2$, consider
        trig substitution. Prefer the method with the least algebra and bookkeeping.

        '
      gradingMode: selfCheck
      keyPoints:
      - Check direct simplification first.
      - Use u-substitution for inside plus derivative.
      - Use parts for product plus simplifying derivative.
      - Use partial fractions for rational/factorable denominators.
      - Use trig substitution for square-root square patterns.
      - Prefer the least complicated valid method.
    hint: Order the checklist from simplest to heavier techniques.
    explanation: |
      The fast lookup path is: review basic antiderivatives, u-substitution pattern recognition, integration by parts, partial fractions, and trig substitution radical patterns.

      Related topic: Integration strategy selection; identify structural cues before calculating.
