    title: Read the givens
    instruction: List the quantities, relationships, and restrictions that control this Angles problem.
    type: multipleChoice
    prompt: Which action is required at this stage of the direct application problem?
    choices:
    - id: a
      text: List the quantities, relationships, and restrictions that control this Angles problem.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
