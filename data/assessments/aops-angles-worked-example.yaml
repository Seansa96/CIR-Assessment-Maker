workedExamples:
- id: aops-angles-problem-1
  title: Transfer an angle across parallel lines
  problem: |-
    In the diagram, lines $l$ and $m$ are parallel and transversal $t$ creates the marked $62^\circ$ angle and angle $x$. Find $x$ and justify the equality.
  steps:
  - id: aops-angles-p1-s1
    title: Read only marked information
    instruction: |-
      Record $l\parallel m$, the transversal $t$, and the given $62^\circ$ angle. Do not use apparent slopes or scale.
    type: multipleChoice
    prompt: Which hypothesis licenses a relationship between the two intersections?
    choices:
    - id: a
      text: |-
        $l\parallel m$
    - id: b
      text: The lines look horizontal.
    - id: c
      text: Both marked angles look acute.
    - id: d
      text: The transversal is red.
    answer:
      choiceId: a
    explanation: Parallelism is the theorem hypothesis.
    media:
    - type: image
      src: /assessments/aops/aops-angle-lines.svg
      alt: Parallel lines l and m cut by transversal t
      with 62 degrees and x marked as alternate interior angles.: null
      caption: Parallel arrow marks and angle positions determine the relationship.
  - id: aops-angles-p1-s2
    title: Classify the angle pair
    instruction: |-
      Both marked angles lie between $l,m$ and on opposite sides of transversal $t$.
    type: multipleChoice
    prompt: What is the pair called?
    choices:
    - id: a
      text: Alternate interior angles
    - id: b
      text: Same-side interior angles
    - id: c
      text: A linear pair
    - id: d
      text: Vertical angles
    answer:
      choiceId: a
    explanation: Interior placement and opposite sides of the transversal identify
      the pair.
  - id: aops-angles-p1-s3
    title: Apply the equality theorem
    instruction: |-
      Alternate interior angles formed by a transversal of parallel lines are equal, so write $x=62^\circ$.
    type: multipleChoice
    prompt: Which equation is justified?
    choices:
    - id: a
      text: |-
        $x+62=180$
    - id: b
      text: |-
        $x=62$
    - id: c
      text: |-
        $2x=62$
    - id: d
      text: |-
        $x+62=360$
    answer:
      choiceId: b
    explanation: Alternate interior angles are equal, not supplementary.
  - id: aops-angles-p1-s4
    title: Check with a second route
    instruction: |-
      The given angle equals its vertical angle; that angle corresponds to $x$. Two standard relationships reproduce $x=62^\circ$.
    type: multipleChoice
    prompt: Why is this second route useful?
    choices:
    - id: a
      text: It independently checks the same measure.
    - id: b
      text: It proves the diagram is to scale.
    - id: c
      text: It changes the parallel hypothesis.
    - id: d
      text: |-
        It makes every angle $62^\circ$.
    answer:
      choiceId: a
    explanation: Agreement between valid routes catches positional mistakes.
  - id: aops-angles-p1-s5
    title: State measure and reason
    instruction: |-
      Conclude $x=62^\circ$ because the marked angles are alternate interior angles of parallel lines.
    type: multipleChoice
    prompt: Which final statement is complete?
    choices:
    - id: a
      text: |-
        $x=62^\circ$, by alternate interior angles with $l\parallel m$.
    - id: b
      text: |-
        $x=62^\circ$, because it looks equal.
    - id: c
      text: |-
        $x=118^\circ$, because all interior angles supplement.
    - id: d
      text: The measure cannot be determined.
    answer:
      choiceId: a
    explanation: The conclusion includes both value and theorem hypothesis.
- id: aops-angles-problem-2
  title: Derive an exterior angle from two remote angles
  problem: |-
    In triangle $ABC$, $\angle A=48^\circ$, $\angle B=67^\circ$, and side $AC$ is extended through $C$ to form exterior angle $x$. Find $x$.
  steps:
  - id: aops-angles-p2-s1
    title: Identify remote interior angles
    instruction: |-
      The two triangle angles not adjacent to exterior angle $x$ are $48^\circ$ and $67^\circ$.
    type: multipleChoice
    prompt: |-
      Which angles are remote from $x$?
    choices:
    - id: a
      text: |-
        $\angle A$ and $\angle B$
    - id: b
      text: |-
        $\angle B$ and the interior angle at $C$
    - id: c
      text: |-
        $x$ and $\angle A$
    - id: d
      text: |-
        Only $\angle C$
    answer:
      choiceId: a
    explanation: |-
      The adjacent interior angle is at $C$; the other two are remote.
    media:
    - type: image
      src: /assessments/aops/aops-angle-triangle.svg
      alt: Triangle ABC with 48 and 67 degree remote interior angles and exterior
        angle x at C.
      caption: The extension at C creates a linear pair with the interior angle at
        C.
  - id: aops-angles-p2-s2
    title: Establish the interior angle at C
    instruction: |-
      Triangle sum gives $\angle C=180^\circ-48^\circ-67^\circ=65^\circ$.
    type: multipleChoice
    prompt: |-
      What is $\angle C$?
    choices:
    - id: a
      text: |-
        $48^\circ$
    - id: b
      text: |-
        $65^\circ$
    - id: c
      text: |-
        $67^\circ$
    - id: d
      text: |-
        $115^\circ$
    answer:
      choiceId: b
    explanation: |-
      Interior angles total $180^\circ$.
  - id: aops-angles-p2-s3
    title: Use the linear pair
    instruction: |-
      The interior angle at $C$ and exterior angle $x$ lie on a straight line, so $x+65^\circ=180^\circ$.
    type: multipleChoice
    prompt: What value follows?
    choices:
    - id: a
      text: |-
        $65^\circ$
    - id: b
      text: |-
        $113^\circ$
    - id: c
      text: |-
        $115^\circ$
    - id: d
      text: |-
        $180^\circ$
    answer:
      choiceId: c
    explanation: |-
      $180-65=115$.
  - id: aops-angles-p2-s4
    title: Verify with the exterior-angle theorem
    instruction: |-
      Directly add the remote interior angles: $48^\circ+67^\circ=115^\circ$.
    type: multipleChoice
    prompt: Why do the two methods agree?
    choices:
    - id: a
      text: The exterior-angle theorem is derived from triangle sum and a linear pair.
    - id: b
      text: All triangle angles are equal.
    - id: c
      text: The drawing is symmetric.
    - id: d
      text: |-
        Exterior angles always equal $115^\circ$.
    answer:
      choiceId: a
    explanation: The theorem compresses the two equations already used.
  - id: aops-angles-p2-s5
    title: Check the range
    instruction: |-
      The exterior angle is obtuse and greater than either positive remote angle, consistent with their sum $115^\circ$.
    type: multipleChoice
    prompt: Which final conclusion is correct?
    choices:
    - id: a
      text: |-
        $x=65^\circ$
    - id: b
      text: |-
        $x=115^\circ$
    - id: c
      text: |-
        $x=180^\circ$
    - id: d
      text: |-
        $x=247^\circ$
    answer:
      choiceId: b
    explanation: Both derivations and the diagram-independent range check agree.
- id: aops-angles-problem-3
  title: Match a central angle to an inscribed angle
  problem: |-
    Central angle $\angle AOB=104^\circ$ and inscribed angle $\angle ACB=x$ intercept the same minor arc $AB$. Find $x$.
  steps:
  - id: aops-angles-p3-s1
    title: Locate both vertices
    instruction: |-
      $O$ is the center, so $\angle AOB$ is central. Point $C$ is on the circle, so $\angle ACB$ is inscribed.
    type: multipleChoice
    prompt: |-
      Which fact makes $\angle ACB$ inscribed?
    choices:
    - id: a
      text: |-
        Its vertex $C$ lies on the circle.
    - id: b
      text: Its vertex is the center.
    - id: c
      text: It is drawn below the center.
    - id: d
      text: It appears acute.
    answer:
      choiceId: a
    explanation: Vertex location is the defining recognition cue.
    media:
    - type: image
      src: /assessments/aops/aops-angle-circle.svg
      alt: Central angle AOB marked 104 degrees and inscribed angle ACB marked x intercepting
        arc AB.
      caption: Both angles have rays ending at A and B and intercept the same minor
        arc.
  - id: aops-angles-p3-s2
    title: Name the common intercepted arc
    instruction: |-
      Both angles have sides ending at $A,B$, so both intercept minor arc $AB$.
    type: multipleChoice
    prompt: Why must the intercepted arc be named?
    choices:
    - id: a
      text: The half-angle relation applies only when the same arc is intercepted.
    - id: b
      text: |-
        Every arc has measure $104^\circ$.
    - id: c
      text: Arc names determine the radius.
    - id: d
      text: An inscribed angle equals every central angle.
    answer:
      choiceId: a
    explanation: Different arcs can produce different central and inscribed measures.
  - id: aops-angles-p3-s3
    title: Apply the inscribed-angle theorem
    instruction: |-
      An inscribed angle is half the central angle intercepting the same arc, so $x=104^\circ/2$.
    type: multipleChoice
    prompt: Which equation is correct?
    choices:
    - id: a
      text: |-
        $x=104$
    - id: b
      text: |-
        $2x=104$
    - id: c
      text: |-
        $x+104=180$
    - id: d
      text: |-
        $x=208$
    answer:
      choiceId: b
    explanation: The central measure is twice the inscribed measure.
  - id: aops-angles-p3-s4
    title: Compute the measure
    instruction: |-
      Dividing by two gives $x=52^\circ$.
    type: multipleChoice
    prompt: |-
      What is $x$?
    choices:
    - id: a
      text: |-
        $26^\circ$
    - id: b
      text: |-
        $52^\circ$
    - id: c
      text: |-
        $104^\circ$
    - id: d
      text: |-
        $156^\circ$
    answer:
      choiceId: b
    explanation: |-
      Half of $104$ is $52$.
  - id: aops-angles-p3-s5
    title: Check vertex, arc, and range
    instruction: |-
      The angle is inscribed, uses the same minor arc, and is acute while the central angle is obtuse; $52^\circ$ satisfies every check.
    type: multipleChoice
    prompt: |-
      Which error would produce $104^\circ$ instead?
    choices:
    - id: a
      text: Treating the inscribed angle as though its vertex were the center.
    - id: b
      text: |-
        Naming arc $AB$.
    - id: c
      text: Dividing the central angle by two.
    - id: d
      text: |-
        Checking that $C$ lies on the circle.
    answer:
      choiceId: a
    explanation: Central and inscribed angles obey different formulas because their
      vertices differ.
