schemaVersion: 1
id: pwsh-string-guided-project-2
title: "The Broken Report Formatter"
assessmentType: guidedProject
categoryId: scripting
subcategoryIds:
  - pwsh-string-basics
guidedProject:
  language: pwsh
  projectKind: console
  runnerMode: workspace
  instructions: |
    Welcome to the Broken Report Formatter!
    
    A junior admin wrote a script `report.ps1` to output a clean string describing a system process. However, they completely messed up the string quoting rules. 
    
    Currently, the script outputs literal variable names and fails to evaluate object properties.
    
    **Requirements:**
    1. Open `report.ps1`.
    2. Fix the string quoting and interpolation so that the script correctly evaluates the `$ProcessName` variable and uses a sub-expression to evaluate `$ProcessObj.Id`.
    3. The final output printed to the screen must exactly match the format: 
       `Process: explorer, ID: 1234` (where 1234 is whatever the actual dynamic ID is).
  workspace:
    entryPoint: report.ps1
    allowedBaseImages:
      - mcr.microsoft.com/powershell:lts-ubuntu-22.04
    sourceGlobs:
      - report.ps1
    includePaths: []
    writablePaths: []
  files:
    - path: report.ps1
      readOnly: false
      content: |
        # We simulate getting a process object
        $ProcessName = "bash"
        $ProcessObj = Get-Process -Name bash
        
        # FIX THE LINE BELOW
        $Output = 'Process: $ProcessName, ID: $ProcessObj.Id'
        
        Write-Output $Output
        
  fixtures: []
  scenarios: []
  diagnostics: []
  requiredChecks:
    - id: check-interpolation
      title: "Script correctly interpolates variables and properties"
      description: "The script must use double quotes and sub-expressions to output the correct string."
      testCode: null
      expectedOutputContains: []
      run:
        arguments: []
        stdin: null
        scenario: null
      expect:
        stdoutContains:
          - "Process: bash, ID:"
        files: []
  bonusChecks: []
navigation:
  learningGoal: apply
  activityType: guidedProject
  tags:
    - powershell
    - strings
    - debugging
