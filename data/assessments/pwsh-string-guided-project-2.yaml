schemaVersion: 1
id: pwsh-string-guided-project-2
title: "The Broken Report Formatter"
assessmentType: sandbox
categoryId: scripting
subcategoryIds:
- pwsh-string-methods
skills:
- Apply scripting concepts
- Apply String Methods and Manipulation
navigation:
  learningGoal: apply
  activityType: sandbox
  tags:
  - scripting
  - pwsh-string-methods
  - pwsh-string-basics
sandbox:
  language: pwsh
  image: mcr.microsoft.com/powershell:latest
  initialCommand: 'pwsh -NoExit -Command "Start-Job -FilePath /workspace/.cir/monitor.ps1 | Out-Null"'
  readOnlyFileSystem: false
  instructions: |
    Welcome to the Broken Report Formatter!
    
    A junior admin wrote a script `report.ps1` to output a clean string describing a system process. However, they completely messed up the string quoting rules. 
    
    Currently, the script outputs literal variable names and fails to evaluate object properties.
    
    **Requirements:**
    1. Open `report.ps1`.
    2. Fix the string quoting and interpolation so that the script correctly evaluates the `$ProcessName` variable and uses a sub-expression to evaluate `$ProcessObj.Id`.
    3. The final output printed to the screen must exactly match the format: 
       `Process: explorer, ID: 1234` (where 1234 is whatever the actual dynamic ID is).
       
    The environment is pre-configured. When you have correctly formatted the report and saved your script, the background monitor will automatically detect it and advance the assessment.
  files:
    - path: report.ps1
      readOnly: false
      content: |
        # We simulate getting a process object
        $ProcessName = "bash"
        $ProcessObj = Get-Process -Name bash
        
        # FIX THE LINE BELOW
        $Output = 'Process: $ProcessName, ID: $ProcessObj.Id'
        
        Write-Output $Output
        
    - path: .cir/monitor.ps1
      readOnly: true
      content: |
        while ($true) {
            if (Test-Path "/workspace/report.ps1") {
                $output = & /workspace/report.ps1 | Out-String
                if ($output -match "Process: bash, ID:\s*\d+") {
                    Invoke-RestMethod -Method Post -Uri "$env:CIR_API_URL/api/attempts/$env:CIR_ATTEMPT_ID/sandbox/complete"
                    break
                }
            }
            Start-Sleep -Seconds 3
        }
