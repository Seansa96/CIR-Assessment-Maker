  - parametric-curves
items:
  - id: parametric-standard-forms-visual
    type: recognition
    skills:
      - parametric-curves
    prompt: |
      Use the standard-form grid as a visual cue.

      ![Reference grid of parametric standard forms for lines, line segments, circles, ellipses, function traces, and hyperbolas](/assessments/calc2-parametric-polar/parametric-standard-forms-reference.svg)

      Which form is the standard parameterization for an ellipse centered at $(h,k)$?
    choices:
      - id: a
        text: '$x=h+a\cos t,\ y=k+b\sin t$'
      - id: b
        text: '$x=x_0+at,\ y=y_0+bt$'
      - id: c
        text: '$x=t,\ y=f(t)$'
      - id: d
        text: '$x=a\sec t,\ y=b\tan t$'
    answer:
      choiceId: a
      expected: '$x=h+a\cos t,\ y=k+b\sin t$'
    explanation: |
      Cosine controls the horizontal radius and sine controls the vertical radius. Unequal radii produce an ellipse.
    tags:
      - parametric-standard-forms
      - visual-recognition

  - id: parametric-slope-symbolic
    type: symbolic
    skills:
      - parametric-derivatives
    prompt: Write the formula for $\frac{dy}{dx}$ for $x=f(t)$ and $y=g(t)$.
    answer:
      expectedLatex: '\frac{dy}{dx}=\frac{dy/dt}{dx/dt}'
      aliases:
        - 'dy/dx=(dy/dt)/(dx/dt)'
    explanation: |
      Parametric slope is vertical component rate divided by horizontal component rate.
    tags:
      - parametric-slope

  - id: parametric-second-derivative-symbolic
    type: symbolic
    skills:
      - parametric-derivatives
    prompt: Write the parametric second derivative formula.
    answer:
      expectedLatex: '\frac{d^2y}{dx^2}=\frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{dx/dt}'
      aliases:
        - 'd2y/dx2 = d/dt(dy/dx)/(dx/dt)'
    explanation: |
      Differentiate the first derivative with respect to $t$, then divide by $dx/dt$.
    tags:
      - parametric-second-derivative

  - id: horizontal-parametric-cloze
    type: cloze
    skills:
      - parametric-derivatives
    prompt: 'A parametric horizontal tangent usually has $\frac{dy}{dt}=0$ and $\frac{dx}{dt}\ne____$.' 
    answer:
      expected: 0
      aliases:
        - zero
    explanation: |
      The vertical rate vanishes, while the horizontal rate remains nonzero.
    tags:
      - parametric-tangents

  - id: vertical-parametric-cloze
    type: cloze
    skills:
      - parametric-derivatives
    prompt: 'A parametric vertical tangent usually has $\frac{dx}{dt}=0$ and $\frac{dy}{dt}\ne____$.' 
    answer:
      expected: 0
      aliases:
        - zero
    explanation: |
      The horizontal rate vanishes, while the vertical rate remains nonzero.
    tags:
      - parametric-tangents

  - id: speed-symbolic
    type: symbolic
    skills:
      - parametric-integrals
    prompt: Write the speed formula for position $x(t),y(t)$.
    answer:
      expectedLatex: '\sqrt{(x''(t))^2+(y''(t))^2}'
      aliases:
        - 'sqrt((dx/dt)^2+(dy/dt)^2)'
    explanation: |
      Speed is the magnitude of the velocity vector $\langle x'(t),y'(t)\rangle$.
    tags:
      - parametric-speed

  - id: arc-length-symbolic
    type: symbolic
    skills:
      - parametric-integrals
    prompt: Write the arc length formula for $x(t),y(t)$ on $a\le t\le b$.
    answer:
      expectedLatex: 'L=\int_a^b\sqrt{(x''(t))^2+(y''(t))^2}\,dt'
      aliases:
        - 'L=int sqrt((x prime)^2+(y prime)^2) dt'
    explanation: |
      Arc length accumulates speed over the parameter interval.
    tags:
      - parametric-arc-length

  - id: parametric-area-symbolic
    type: symbolic
    skills:
      - parametric-integrals
    prompt: Write the signed area formula using $y\,dx$ for a parametric curve.
    answer:
      expectedLatex: 'A=\int_a^b y(t)x''(t)\,dt'
      aliases:
        - 'A=int y(t)x prime(t) dt'
    explanation: |
      Since $dx=x'(t)\,dt$, area from $y\,dx$ becomes $\int y(t)x'(t)\,dt$.
    tags:
      - parametric-area

  - id: surface-area-x-symbolic
    type: symbolic
    skills:
      - parametric-integrals
    prompt: Write the surface area formula for revolving $x(t),y(t)$ about the $x$-axis.
    answer:
      expectedLatex: 'S=2\pi\int_a^b y(t)\sqrt{(x''(t))^2+(y''(t))^2}\,dt'
      aliases:
        - 'S=2pi int y(t) sqrt((x prime)^2+(y prime)^2) dt'
    explanation: |
      Surface area is circumference $2\pi y(t)$ times the arc-length element.
    tags:
      - parametric-surface-area

  - id: surface-area-y-symbolic
    type: symbolic
    skills:
      - parametric-integrals
    prompt: Write the surface area formula for revolving $x(t),y(t)$ about the $y$-axis.
    answer:
      expectedLatex: 'S=2\pi\int_a^b x(t)\sqrt{(x''(t))^2+(y''(t))^2}\,dt'
      aliases:
        - 'S=2pi int x(t) sqrt((x prime)^2+(y prime)^2) dt'
    explanation: |
      Surface area is circumference $2\pi x(t)$ times the arc-length element.
    tags:
      - parametric-surface-area

  - id: parameter-bounds-cloze
    type: cloze
    skills:
      - parametric-integrals
    prompt: 'Parametric integral bounds should be values of the ____.' 
    answer:
      expected: parameter
      aliases:
        - t
    explanation: |
      The integrand is written in terms of $t$, so the bounds must be parameter values.
    tags:
      - parametric-bounds

  - id: orientation-area-flashcard
    type: flashcard
    skills:
      - parametric-integrals
    prompt: Why can $\int y(t)x'(t)\,dt$ give a negative value?
    answer:
      expected: It is signed area, and $x'(t)<0$ means the curve is moving left.
    explanation: |
      Parametric area using $y\,dx$ depends on the direction in which $x$ changes.
    tags:
      - parametric-area
      - orientation

  - id: eliminate-parameter-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: What does it mean to eliminate the parameter?
    answer:
      expected: Rewrite the parametric equations as a relationship between $x$ and $y$.
    explanation: |
      Eliminating the parameter reveals the rectangular equation for the trace, but the parameter interval may still restrict the actual path.
    tags:
      - parameter-elimination
