schemaVersion: 1
id: physics2-ch07-electric-potential-reading-quiz
title: Electric Potential Reading Check
assessmentType: quiz
categoryId: physics-2
topicId: physics2-electric-potential
modeDefault: practice
randomizeQuestions: false
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Read the passage: “Electric potential is a property of the source arrangement at a point. Potential energy depends on both that potential and the charge placed there.” Which statement follows from the passage?
    choices:
      - id: a
        text: Potential is defined only after a test charge is placed at the point.
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
      - id: b
        text: The same potential can correspond to different potential energies for different charges.
      - id: c
        text: Potential and potential energy are interchangeable names for the same quantity.
        issueSignals: [{ id: physics2-method-selection-error, domains: [physics-2] }]
      - id: d
        text: Potential energy is independent of the sign of the charge.
        issueSignals: [{ id: physics2-sign-direction-error, domains: [physics-2] }]
    answer: { choiceId: b }
    explanation: 'Solution: The same potential can correspond to different potential energies because $U=qV$ and the charge $q$ can differ. Why it works: The passage separates a source property from the energy of a particular charge. Why the other choices fail: Potential is defined without the test charge, the quantities have different meanings, and charge sign affects $U$.'
    difficultyDimensions: [representationTransfer, modelOrDerivation]
    difficultyEvidence: Distinguishes two closely related quantities by reading their dependency relationship.
    skills: [physics2-ch07-electric-potential-potential-energy]
    subjectDifficultyTags: [physics2-ch07-electric-potential-potential-energy]
  - id: q002
    type: multipleChoice
    prompt: |
      Read the passage: “For a point charge, taking zero potential at infinity gives $V=kQ/r$. Potential is a scalar, so contributions from several charges add algebraically.” Two equal charges, $+Q$ and $-Q$, are the same distance from point P. What is the net potential at P?
    choices:
      - id: a
        text: $2kQ/r$
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
      - id: b
        text: $kQ/r$ directed toward the positive charge
        issueSignals: [{ id: physics2-method-selection-error, domains: [physics-2] }]
      - id: c
        text: zero
      - id: d
        text: $kQ/r$ directed toward the negative charge
        issueSignals: [{ id: physics2-sign-direction-error, domains: [physics-2] }]
    answer: { choiceId: c }
    explanation: 'Solution: The scalar contributions are $+kQ/r$ and $-kQ/r$, so they cancel to zero. Why it works: Potential adds as signed numbers and has no direction vector. Why the other choices fail: They add magnitudes or incorrectly assign a field direction to a scalar potential.'
    difficultyDimensions: [modelOrDerivation, errorDiagnosis]
    difficultyEvidence: Applies the passage’s scalar-addition rule to a symmetric signed-charge case.
    skills: [physics2-ch07-electric-potential-field-from-potential]
    subjectDifficultyTags: [physics2-ch07-electric-potential-field-from-potential]
  - id: q003
    type: multipleChoice
    prompt: |
      Read the passage: “The electric field points in the direction of decreasing potential. In one dimension, $E_x=-dV/dx$.” If potential increases as $x$ increases, which direction does the electric field point?
    choices:
      - id: a
        text: In the positive $x$ direction
        issueSignals: [{ id: physics2-sign-direction-error, domains: [physics-2] }]
      - id: b
        text: In the negative $x$ direction
      - id: c
        text: Perpendicular to the $x$ axis in every case
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
      - id: d
        text: It cannot be determined from the potential trend
        issueSignals: [{ id: physics2-method-selection-error, domains: [physics-2] }]
    answer: { choiceId: b }
    explanation: 'Solution: The field points in the negative $x$ direction because the potential decreases in that direction. Why it works: The minus sign in $E_x=-dV/dx$ reverses the direction of a positive potential slope. Why the other choices fail: They ignore or reverse that sign.'
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    difficultyEvidence: Translates a verbal potential trend into the sign implied by the field-potential relation.
    skills: [physics2-ch07-electric-potential-field-from-potential]
    subjectDifficultyTags: [physics2-ch07-electric-potential-field-from-potential]
  - id: q004
    type: multipleChoice
    prompt: |
      Read the passage: “An equipotential surface has the same potential everywhere on it. Moving a charge along that surface produces no change in potential energy.” Which conclusion is supported?
    choices:
      - id: a
        text: The electric field must have a tangential component along the surface.
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
      - id: b
        text: The electric field is perpendicular to the equipotential surface.
      - id: c
        text: The electric field is zero everywhere near the surface.
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
      - id: d
        text: A charge can gain potential energy without doing work.
        issueSignals: [{ id: physics2-method-selection-error, domains: [physics-2] }]
    answer: { choiceId: b }
    explanation: 'Solution: The electric field is perpendicular to an equipotential surface. Why it works: A tangential field component would change potential along the surface, contradicting its definition. Why the other choices fail: The field need not vanish, and no potential-energy change occurs along the surface.'
    difficultyDimensions: [modelOrDerivation, proofJustification]
    difficultyEvidence: Infers field geometry from the defining property of an equipotential.
    skills: [physics2-ch07-electric-potential-equipotentials]
    subjectDifficultyTags: [physics2-ch07-electric-potential-equipotentials]
  - id: q005
    type: multipleChoice
    prompt: |
      Read the passage: “Equipotential lines are closer together where the magnitude of the electric field is larger because $|E|$ measures the rate at which potential changes with distance.” A diagram shows the same potential step between lines, but half the spacing in region B compared with region A. How do the field magnitudes compare?
    choices:
      - id: a
        text: Region B has half the field magnitude.
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
      - id: b
        text: The field magnitudes are equal because the potential step is equal.
        issueSignals: [{ id: physics2-method-selection-error, domains: [physics-2] }]
      - id: c
        text: Region B has twice the field magnitude.
      - id: d
        text: The field magnitude cannot be inferred from spacing.
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
    answer: { choiceId: c }
    explanation: 'Solution: Region B has twice the field magnitude because $|E|\approx|\Delta V|/\Delta s$ and its spacing is halved. Why it works: The same potential change over a shorter distance means a larger gradient. Why the other choices fail: They reverse or discard the spacing-gradient relationship.'
    difficultyDimensions: [representationTransfer, parameterThreshold]
    difficultyEvidence: Reads a spatial representation and applies the potential-gradient relationship.
    skills: [physics2-ch07-electric-potential-potential-difference]
    subjectDifficultyTags: [physics2-ch07-electric-potential-potential-difference]
  - id: q006
    type: multipleChoice
    prompt: |
      Read the passage: “Only potential differences affect electric-field work. The numerical value assigned to zero potential is a reference choice.” If the same constant is added to $V$ everywhere, what changes?
    choices:
      - id: a
        text: The electric field changes because every potential is larger.
        issueSignals: [{ id: physics2-sign-direction-error, domains: [physics-2] }]
      - id: b
        text: Potential differences and the electric field remain unchanged.
      - id: c
        text: The electric field becomes zero.
        issueSignals: [{ id: physics2-method-selection-error, domains: [physics-2] }]
      - id: d
        text: Work along an equipotential becomes nonzero.
        issueSignals: [{ id: physics2-model-assumption-error, domains: [physics-2] }]
    answer: { choiceId: b }
    explanation: 'Solution: Potential differences and the electric field remain unchanged. Why it works: Adding a constant cancels in a difference and has zero spatial derivative, so $E=-\nabla V$ is unchanged. Why the other choices fail: They confuse the arbitrary reference level with a physical change in the field or work.'
    difficultyDimensions: [modelOrDerivation, errorDiagnosis]
    difficultyEvidence: Distinguishes an arbitrary reference shift from a change in measurable differences and gradients.
    skills: [physics2-ch07-electric-potential-field-from-potential]
    subjectDifficultyTags: [physics2-ch07-electric-potential-field-from-potential]
