    - path: run_checks.py
      readOnly: true
      content: |
        import unittest
        from rpg import Character, Hero, BattleEngine

        class TestRPG(unittest.TestCase):
            def test_character_basics(self):
                c = Character("Slime", 10, 2)
                self.assertTrue(c.is_alive())
                c.take_damage(10)
                self.assertFalse(c.is_alive())

            def test_hero_healing(self):
                h = Hero("Arthur", 50, 10, 2)
                h.take_damage(30)
                self.assertEqual(h.hp, 20)
                h.heal()
                self.assertEqual(h.hp, 40)
                self.assertEqual(h.potions, 1)
                h.heal()
                self.assertEqual(h.potions, 0)
                h.heal() # Out of potions, shouldn't heal
                self.assertEqual(h.hp, 60)

            def test_battle_engine_victory(self):
                hero = Hero("Arthur", 100, 20)
                enemy = Character("Dragon", 30, 5)
                engine = BattleEngine(hero, enemy)
                
                res = engine.play_turn("attack")
                self.assertEqual(res, "Continue")
                self.assertEqual(enemy.hp, 10)
                self.assertEqual(hero.hp, 95) # Dragon counters
                
                res = engine.play_turn("attack")
                self.assertEqual(res, "Victory")
                self.assertEqual(enemy.hp, -10)
                self.assertEqual(hero.hp, 95) # Dragon is dead, no counter

            def test_battle_engine_defeat(self):
                hero = Hero("Arthur", 10, 5)
                enemy = Character("Dragon", 100, 20)
                engine = BattleEngine(hero, enemy)
                
                res = engine.play_turn("attack")
                self.assertEqual(res, "Defeat")
                self.assertEqual(hero.hp, -10)

        if __name__ == '__main__':
            unittest.main(verbosity=2)


