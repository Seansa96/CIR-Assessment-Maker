guidedProject:
  language: python
  instructions: "Build the Capstone: Text RPG Battle Engine.\n\nThis project pulls\
    \ together Control Flow, Functions, Collections, and OOP! You will build a polymorphic\
    \ battle engine.\n\nRequired project behavior:\n\n- Implement the classes in `rpg.py`.\n\
    - **`Character` (Base Class):**\n  - `__init__(self, name, hp, attack_power)`\n\
    \  - `is_alive(self)`: Returns `True` if `hp > 0`, else `False`.\n  - `take_damage(self,\
    \ amount)`: Subtracts `amount` from `hp`.\n  - `attack(self, target)`: Calls `target.take_damage(self.attack_power)`.\n\
    - **`Hero(Character)`:**\n  - Has all `Character` properties, plus `potions` (defaults\
    \ to 3).\n  - `__init__(self, name, hp, attack_power, potions=3)`: Use `super()`!\n\
    \  - `heal(self)`: If `potions > 0`, adds 20 to `hp` and subtracts 1 from `potions`.\
    \ If 0 potions, does nothing.\n- **`BattleEngine`:**\n  - `__init__(self, hero,\
    \ enemy)`: Stores the references to the hero and enemy objects.\n  - `play_turn(self,\
    \ hero_action)`: \n    - If `hero_action` is `\"attack\"`, the hero attacks the\
    \ enemy.\n    - If `hero_action` is `\"heal\"`, the hero heals.\n    - Regardless\
    \ of the hero's action, if the enemy is still alive (`enemy.is_alive()`), the\
    \ enemy attacks the hero.\n    - Returns a string: `\"Victory\"` if enemy is dead,\
    \ `\"Defeat\"` if hero is dead, or `\"Continue\"` if both are alive.\n\nThe automated\
    \ tests will simulate full battle sequences.\n"
