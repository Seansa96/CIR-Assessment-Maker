      \        self.hero = hero\n        self.enemy = enemy\n        \n    def play_turn(self,\
      \ action):\n        # TODO: Process the hero's action (\"attack\" or \"heal\"\
      )\n        \n        # TODO: Process the enemy's counter-attack if still alive\n\
      \        \n        # TODO: Return \"Victory\", \"Defeat\", or \"Continue\"\n\
      \        return \"Continue\"\n"
  - path: run_checks.py
    readOnly: true
    content: "import unittest\nfrom rpg import Character, Hero, BattleEngine\n\nclass\
      \ TestRPG(unittest.TestCase):\n    def test_character_basics(self):\n      \
      \  c = Character(\"Slime\", 10, 2)\n        self.assertTrue(c.is_alive())\n\
      \        c.take_damage(10)\n        self.assertFalse(c.is_alive())\n\n    def\
      \ test_hero_healing(self):\n        h = Hero(\"Arthur\", 50, 10, 2)\n      \
      \  h.take_damage(30)\n        self.assertEqual(h.hp, 20)\n        h.heal()\n\
      \        self.assertEqual(h.hp, 40)\n        self.assertEqual(h.potions, 1)\n\
      \        h.heal()\n        self.assertEqual(h.potions, 0)\n        h.heal()\
      \ # Out of potions, shouldn't heal\n        self.assertEqual(h.hp, 60)\n\n \
      \   def test_battle_engine_victory(self):\n        hero = Hero(\"Arthur\", 100,\
      \ 20)\n        enemy = Character(\"Dragon\", 30, 5)\n        engine = BattleEngine(hero,\
      \ enemy)\n        \n        res = engine.play_turn(\"attack\")\n        self.assertEqual(res,\
      \ \"Continue\")\n        self.assertEqual(enemy.hp, 10)\n        self.assertEqual(hero.hp,\
      \ 95) # Dragon counters\n        \n        res = engine.play_turn(\"attack\"\
      )\n        self.assertEqual(res, \"Victory\")\n        self.assertEqual(enemy.hp,\
      \ -10)\n        self.assertEqual(hero.hp, 95) # Dragon is dead, no counter\n\
      \n    def test_battle_engine_defeat(self):\n        hero = Hero(\"Arthur\",\
      \ 10, 5)\n        enemy = Character(\"Dragon\", 100, 20)\n        engine = BattleEngine(hero,\
      \ enemy)\n        \n        res = engine.play_turn(\"attack\")\n        self.assertEqual(res,\
      \ \"Defeat\")\n        self.assertEqual(hero.hp, -10)\n\nif __name__ == '__main__':\n\
      \    unittest.main(verbosity=2)\n"
