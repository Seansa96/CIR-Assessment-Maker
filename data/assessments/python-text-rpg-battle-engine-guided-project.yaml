guidedProject:
  language: python
  instructions: |
    Build the Capstone: Text RPG Battle Engine.

    This project pulls together Control Flow, Functions, Collections, and OOP! You will build a polymorphic battle engine.

    Required project behavior:

    - Implement the classes in `rpg.py`.
    - **`Character` (Base Class):**
      - `__init__(self, name, hp, attack_power)`
      - `is_alive(self)`: Returns `True` if `hp > 0`, else `False`.
      - `take_damage(self, amount)`: Subtracts `amount` from `hp`.
      - `attack(self, target)`: Calls `target.take_damage(self.attack_power)`.
    - **`Hero(Character)`:**
      - Has all `Character` properties, plus `potions` (defaults to 3).
      - `__init__(self, name, hp, attack_power, potions=3)`: Use `super()`!
      - `heal(self)`: If `potions > 0`, adds 20 to `hp` and subtracts 1 from `potions`. If 0 potions, does nothing.
    - **`BattleEngine`:**
      - `__init__(self, hero, enemy)`: Stores the references to the hero and enemy objects.
      - `play_turn(self, hero_action)`: 
        - If `hero_action` is `"attack"`, the hero attacks the enemy.
        - If `hero_action` is `"heal"`, the hero heals.
        - Regardless of the hero's action, if the enemy is still alive (`enemy.is_alive()`), the enemy attacks the hero.
        - Returns a string: `"Victory"` if enemy is dead, `"Defeat"` if hero is dead, or `"Continue"` if both are alive.

    The automated tests will simulate full battle sequences.

