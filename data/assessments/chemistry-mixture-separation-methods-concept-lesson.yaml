lesson:
  introduction: |
    Mixtures can often be separated without changing the chemical identity of their components. The key move is to ask which physical property differs enough to exploit: boiling point, density, particle size, solubility, volatility, or attraction to another phase.
  sections:
    - id: distillation
      title: |
        Distillation
      content: |
        **Most useful for:** separating liquids, or a solvent from dissolved solute, when components have meaningfully different boiling points.
        
        **Why it works:** the more volatile component vaporizes first, then condenses in a cooler region.
        
        **Typical scenario:** purifying water from salt water or separating alcohol from water.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For distillation, the useful property is different boiling points and condensation of vapor.
      media:
        - type: image
          src: /assessments/chemistry/separation-methods/distillation.svg
          alt: Animated diagram of distillation as a mixture separation method
          caption: Distillation separates mixtures by using different boiling points and condensation of vapor.
      check:
        id: distillation-check
        type: multipleChoice
        prompt: |
          What physical difference makes Distillation useful?
        choices:
          - id: a
            text: |
              boiling point and condensation
          - id: b
            text: |
              particle size
          - id: c
            text: |
              magnetism
          - id: d
            text: |
              color only
        answer:
          choiceId: a
        explanation: |
          Solution:
          Distillation is useful when you can exploit different boiling points and condensation of vapor. That property lets the mixture separate physically without converting the components into new substances.
          
          Why it works:
          The selected response applies the governing idea from this section to the exact situation in the prompt.
          
          Why the other choices fail:
          Each remaining option conflicts with the definition, relationship, or process established in this section.
    - id: decantation
      title: |
        Decantation
      content: |
        **Most useful for:** separating a liquid from a settled solid or from an immiscible liquid layer.
        
        **Why it works:** gravity lets the denser phase settle, so the upper layer can be poured off carefully.
        
        **Typical scenario:** pouring clear water away from settled sand.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For decantation, the useful property is settling by density followed by careful pouring.
