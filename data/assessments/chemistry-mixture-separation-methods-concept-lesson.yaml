    - id: chromatography
      title: |
        Chromatography
      content: |
        **Most useful for:** separating small amounts of mixture components for identification or purification.
        
        **Why it works:** components travel at different speeds because they have different attractions to the stationary and mobile phases.
        
        **Typical scenario:** separating ink pigments on paper.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For chromatography, the useful property is different affinities for stationary and mobile phases.
