    - id: centrifugation
      title: |
        Centrifugation
      content: |
        **Most useful for:** speeding up separation of suspended particles or liquids with different densities.
        
        **Why it works:** rapid spinning creates a strong effective outward acceleration that drives denser material outward faster than gravity alone.
        
        **Typical scenario:** separating blood cells from plasma or pelleting fine suspended solids.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For centrifugation, the useful property is density difference accelerated by spinning.
      media:
        - type: image
          src: /assessments/chemistry/separation-methods/centrifugation.svg
