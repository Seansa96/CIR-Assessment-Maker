    - id: sublimation
      title: |
        Sublimation
      content: |
        **Most useful for:** separating a solid that can pass directly into vapor from solids that cannot.
        
        **Why it works:** one component has enough vapor pressure to sublime and then redeposit on a cooler surface.
        
        **Typical scenario:** separating iodine or ammonium chloride from sand.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For sublimation, the useful property is solid-to-gas transition followed by deposition.
