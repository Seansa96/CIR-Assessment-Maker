    - id: evaporation
      title: |
        Evaporation
      content: |
        **Most useful for:** recovering a dissolved solid when the solvent can be removed and the solvent does not need to be collected.
        
        **Why it works:** the solvent escapes as vapor, leaving the nonvolatile solute behind.
        
        **Typical scenario:** obtaining salt from salt water when the water is not needed.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For evaporation, the useful property is volatile solvent leaves, nonvolatile solute remains.
