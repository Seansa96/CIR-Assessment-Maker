    - id: fractional-crystallization
      title: |
        Fractional Crystallization
      content: |
        **Most useful for:** separating dissolved solids whose solubilities change differently with temperature.
        
        **Why it works:** as a solution cools or evaporates, the least soluble component reaches saturation and crystallizes first.
        
        **Typical scenario:** separating salts from a mixed solution by controlled cooling.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For fractional crystallization, the useful property is different solubility curves and selective crystallization.
