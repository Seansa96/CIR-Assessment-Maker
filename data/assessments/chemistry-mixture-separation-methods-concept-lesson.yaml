    - id: extraction
      title: |
        Extraction
      content: |
        **Most useful for:** moving a target substance into a solvent where it is more soluble.
        
        **Why it works:** different substances partition differently between solvents or phases.
        
        **Typical scenario:** extracting caffeine into an organic solvent or brewing tea in water.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For extraction, the useful property is selective solubility in a chosen solvent.
