    - id: filtration
      title: |
        Filtration
      content: |
        **Most useful for:** separating an insoluble solid from a liquid or gas.
        
        **Why it works:** the filter pores allow the fluid through but retain particles larger than the pore size.
        
        **Typical scenario:** removing sand from water with filter paper.
        
        The important question is not just "what equipment is shown?" but "which physical property is being exploited?" For filtration, the useful property is particle size relative to filter pore size.
