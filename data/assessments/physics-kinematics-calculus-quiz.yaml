questions:
  - id: q001
    type: multipleChoice
    prompt: |
      The velocity of an object is given by $v(t) = 3t^2 - 4t + 1$ m/s. What is the expression for the object's acceleration $a(t)$?
    choices:
      - id: a
        text: $6t - 4$ m/s²
      - id: b
        text: $t^3 - 2t^2 + t$ m/s²
      - id: c
        text: $3t - 4$ m/s²
      - id: d
        text: $6t$ m/s²
    answer:
      choiceId: a
    explanation: |
      Acceleration is the first derivative of velocity with respect to time: $a(t) = \frac{dv}{dt} = \frac{d}{dt}(3t^2 - 4t + 1) = 6t - 4$.

  - id: q002
    type: multipleChoice
    prompt: |
      The acceleration of a particle is given by $a(t) = 2t$. If the particle starts from rest at $t=0$, what is its velocity at $t=3$ seconds?
    choices:
      - id: a
        text: 6 m/s
      - id: b
        text: 9 m/s
      - id: c
        text: 18 m/s
      - id: d
        text: 3 m/s
    answer:
      choiceId: b
    explanation: |
      Velocity is the integral of acceleration: $v(t) = \int a(t) dt = \int 2t dt = t^2 + C$. Since it starts from rest, $v(0) = 0$, so $C = 0$ and $v(t) = t^2$. At $t=3$, $v(3) = (3)^2 = 9$ m/s.

  - id: q003
    type: multipleChoice
    prompt: |
      A car travels around a circular curve of radius 50 m. If the car is slowing down at a rate of 2.0 m/s² while its current speed is 10 m/s, what is the magnitude of its radial (centripetal) acceleration?
    choices:
      - id: a
        text: 2.0 m/s²
      - id: b
        text: 4.0 m/s²
      - id: c
        text: 2.8 m/s²
      - id: d
        text: 0.2 m/s²
    answer:
      choiceId: a
    explanation: |
      Radial acceleration $a_r = \frac{v^2}{r} = \frac{10^2}{50} = \frac{100}{50} = 2.0$ m/s². The tangential acceleration $a_t = -2.0$ m/s² does not affect the radial component.

  - id: q004
    type: multipleChoice
    prompt: |
      For the car in the previous question ($r=50$ m, $v=10$ m/s, slowing at $2.0$ m/s²), what is the magnitude of its *total* acceleration?
    choices:
      - id: a
        text: 4.0 m/s²
      - id: b
        text: 2.8 m/s²
      - id: c
        text: 2.0 m/s²
      - id: d
        text: 0 m/s²
    answer:
      choiceId: b
    explanation: |
      Total acceleration is the vector sum of tangential and radial acceleration: $|\vec{a}| = \sqrt{a_t^2 + a_r^2} = \sqrt{(-2.0)^2 + (2.0)^2} = \sqrt{4 + 4} = \sqrt{8} \approx 2.83$ m/s².
