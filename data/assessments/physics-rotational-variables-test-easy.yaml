schemaVersion: 1
id: physics-rotational-variables-test-easy
title: 'Test (Easy): Rotational Variables'
description: Foundational evaluation of angular position, velocity, acceleration,
  and linear-rotational links.
assessmentType: test
categoryId: physics-1
topicId: physics-rotational-variables
skills:
- angular-kinematics
- rotational-variables
- tangential-motion
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - physics-1
  - physics-rotational-variables
modeDefault: exam
randomizeQuestions: true
questions:
- id: easy-q001
  type: numericResponse
  prompt: A motor starts from rest and has angular acceleration 2.0 rad/s^2 for 3.0
    s. What final angular velocity in rad/s does it have?
  answer:
    value: 6
    tolerance: 0.1
  explanation: 'Solution: $\omega_f=0+(2.0)(3.0)=6.0$ rad/s.


    Why it works: Constant angular acceleration changes angular velocity by $\alpha
    t$.

    '
  difficultyDimensions:
  - modelOrDerivation
  - unitAnalysis
- id: easy-q002
  type: numericResponse
  prompt: A wheel turns through 10 radians in 2.0 s at constant angular velocity.
    What is its angular velocity in rad/s?
  answer:
    value: 5
    tolerance: 0.1
  explanation: 'Solution: $\omega=\Delta\theta/t=10/2.0=5.0$ rad/s.


    Why it works: Angular velocity is angular displacement per time.

    '
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: easy-q003
  type: numericResponse
  prompt: A disk's angular velocity changes from 4.0 rad/s to 16.0 rad/s in 6.0 s.
    What is its average angular acceleration in rad/s^2?
  answer:
    value: 2
    tolerance: 0.05
  explanation: 'Solution: $\alpha=(16.0-4.0)/6.0=2.0$ rad/s$^2$.


    Why it works: Average angular acceleration is the rate of change of angular velocity.

    '
  difficultyDimensions:
  - modelOrDerivation
  - unitAnalysis
- id: easy-q004
  type: numericResponse
  prompt: A point on a 0.40 m radius wheel has tangential speed 3.2 m/s. What angular
    speed in rad/s does the wheel have?
  answer:
    value: 8
    tolerance: 0.1
  explanation: 'Solution: $\omega=v_t/r=3.2/0.40=8.0$ rad/s.


    Why it works: Tangential speed and angular speed are related by $v_t=r\omega$.

    '
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
- id: easy-q005
  type: numericResponse
  prompt: A turntable spins at 120 rpm. What angular speed in rad/s is this?
  answer:
    value: 12.57
    tolerance: 0.05
  explanation: 'Solution: $120(2\pi/60)=4\pi=12.57$ rad/s.


    Why it works: The conversion uses $2\pi$ radians per revolution and 60 seconds
    per minute.

    '
  difficultyDimensions:
  - unitConversion
  - unitAnalysis
- id: easy-q006
  type: symbolicResponse
  prompt: Angular position is $\theta(t)=3t^2-4t$. Enter the angular velocity function.
  answer:
    expectedLatex: 6*t-4
    equivalenceMode: derivative
    variables:
    - t
    tolerance: 0.000001
  explanation: 'Solution: $\omega(t)=d\theta/dt=6t-4$.


    Why it works: Angular velocity is the time derivative of angular position.

    '
  difficultyDimensions:
  - symbolicManipulation
  - modelOrDerivation
- id: easy-q007
  type: symbolicResponse
  prompt: Angular velocity is $\omega(t)=5t^2+2t$. Enter the angular acceleration
    function.
  answer:
    expectedLatex: 10*t+2
    equivalenceMode: derivative
    variables:
    - t
    tolerance: 0.000001
  explanation: 'Solution: $\alpha(t)=d\omega/dt=10t+2$.


    Why it works: Angular acceleration is the derivative of angular velocity.

    '
  difficultyDimensions:
  - symbolicManipulation
  - representationTransfer
- id: easy-q008
  type: multipleChoice
  prompt: Two points are fixed on a rigid rotating disk, one near the center and one
    near the rim. Which quantity is the same for both?
  choices:
  - id: a
    text: Angular velocity
  - id: b
    text: Tangential speed
    issueSignals:
    - id: linear-angular-confusion
  - id: c
    text: Distance traveled in one second
    issueSignals:
    - id: lever-arm-confusion
  - id: d
    text: Centripetal acceleration
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution: Angular velocity.


    Why it works: A rigid disk rotates through the same angle per time at every radius.


    Why the other choices fail: Tangential speed, distance in a given time, and centripetal
    acceleration depend on radius.

    '
  difficultyDimensions:
  - modelComparison
  - representationTransfer
- id: easy-q009
  type: multipleChoice
  prompt: If a rotating wheel has positive angular velocity and negative angular acceleration,
    what is initially happening to its angular speed?
  choices:
  - id: a
    text: It is decreasing.
  - id: b
    text: It is increasing.
    issueSignals:
    - id: trigonometry-error
  - id: c
    text: It must be zero.
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: Its radius is decreasing.
    issueSignals:
    - id: lever-arm-confusion
    - id: trigonometry-error
  answer:
    choiceId: a
  explanation: 'Solution: It is decreasing.


    Why it works: The acceleration points opposite the current positive rotation.


    Why the other choices fail: Opposite signs mean slowing, not increasing, zero
    motion, or a changing radius.

    '
  difficultyDimensions:
  - signConvention
  - qualitativeCheck
- id: easy-q010
  type: numericResponse
  prompt: A wheel turns 2.5 revolutions. What angular displacement in radians is this?
  answer:
    value: 15.708
    tolerance: 0.03
  explanation: 'Solution: $\Delta\theta=2.5(2\pi)=5\pi=15.708$ rad.


    Why it works: One complete revolution corresponds to $2\pi$ radians.

    '
  difficultyDimensions:
  - unitConversion
  - representationTransfer
