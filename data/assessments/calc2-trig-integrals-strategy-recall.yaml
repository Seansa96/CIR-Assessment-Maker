items:
- id: odd-sine-trigger
  type: cloze
  skills:
  - trig-integrals-strategy
  prompt: 'If the power of sine in


    $$

    \int\sin^m x\cos^n x\,dx

    $$


    is odd, save one factor of $\_\_\_\_$.

    '
  answer:
    expected: sin(x) dx
    aliases:
    - sine x dx
    - sin x dx
    - one sine factor
  explanation: 'Save $\sin x\,dx$, rewrite the remaining even sine power using

    $\sin^2x=1-\cos^2x$, and use $u=\cos x$.

    '
  tags:
  - trig-integrals
  - odd-sine-power
  - substitution-selection
- id: odd-sine-substitution
  type: typed
  skills:
  - trig-integrals-strategy
  prompt: 'After saving $\sin x\,dx$ from an odd sine power, which substitution should
    you

    normally use?

    '
  answer:
    expected: u = cos(x)
    aliases:
    - u=cos x
    - cosine substitution
  explanation: 'Since $du=-\sin x\,dx$, the saved factor supplies the differential.
    Convert the

    remaining sine pairs into powers of cosine.

    '
  tags:
  - trig-integrals
  - odd-sine-power
  - u-substitution
- id: odd-cosine-trigger
  type: cloze
  skills:
  - trig-integrals-strategy
  prompt: 'If the power of cosine is odd, save one factor of $\_\_\_\_$ and use

    $u=\sin x$.

    '
  answer:
    expected: cos(x) dx
    aliases:
    - cosine x dx
    - cos x dx
    - one cosine factor
  explanation: 'Removing one cosine leaves an even power that can be rewritten using

    $\cos^2x=1-\sin^2x$.

    '
  tags:
  - trig-integrals
  - odd-cosine-power
  - substitution-selection
- id: sine-pythagorean-rewrite
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the identity used to rewrite an even sine power in terms of cosine.

    '
  answer:
    expectedLatex: \sin^2x=1-\cos^2x
    aliases:
    - sin squared x equals one minus cos squared x
  explanation: 'This form is used when one sine factor has been saved for

    $du=-\sin x\,dx$.

    '
  tags:
  - trig-identities
  - pythagorean-identity
  - odd-sine-power
- id: cosine-pythagorean-rewrite
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the identity used to rewrite an even cosine power in terms of sine.

    '
  answer:
    expectedLatex: \cos^2x=1-\sin^2x
    aliases:
    - cos squared x equals one minus sin squared x
  explanation: 'This form is used when one cosine factor has been saved for

    $du=\cos x\,dx$.

    '
  tags:
  - trig-identities
  - pythagorean-identity
  - odd-cosine-power
- id: both-even-strategy
  type: flashcard
  skills:
  - trig-integrals-strategy
  prompt: 'What is the standard strategy when both sine and cosine powers are even?

    '
  answer:
    expected: Use power-reduction identities, simplifying products such as sin(x)cos(x)
      first when helpful.
  explanation: 'Neither function has a spare odd factor that can supply a differential
    while leaving

    a convertible even power.

    '
  tags:
  - trig-integrals
  - even-even-powers
  - power-reduction
- id: sine-power-reduction
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the power-reduction identity for $\sin^2x$.

    '
  answer:
    expectedLatex: \sin^2x=\frac{1-\cos(2x)}{2}
    aliases:
    - sin squared x equals one minus cos 2x over 2
  explanation: 'This identity lowers the sine power and replaces it with a directly
    integrable

    constant and cosine term.

    '
  tags:
  - trig-identities
  - power-reduction
  - even-even-powers
- id: cosine-power-reduction
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the power-reduction identity for $\cos^2x$.

    '
  answer:
    expectedLatex: \cos^2x=\frac{1+\cos(2x)}{2}
    aliases:
    - cos squared x equals one plus cos 2x over 2
  explanation: 'The positive cosine term distinguishes the cosine reduction identity
    from the sine

    reduction identity.

    '
  tags:
  - trig-identities
  - power-reduction
  - even-even-powers
- id: even-secant-trigger
  type: cloze
  skills:
  - trig-integrals-strategy
  prompt: 'If the secant exponent is even in


    $$

    \int\tan^m x\sec^n x\,dx,

    $$


    save a factor of $\_\_\_\_$.

    '
  answer:
    expected: sec^2(x) dx
    aliases:
    - secant squared x dx
    - sec^2 x dx
  explanation: 'Then use $u=\tan x$ and convert remaining secant pairs through

    $\sec^2x=1+\tan^2x$.

    '
  tags:
  - trig-integrals
  - tangent-secant
  - even-secant-power
- id: even-secant-substitution
  type: typed
  skills:
  - trig-integrals-strategy
  prompt: 'Which substitution matches the saved factor $\sec^2x\,dx$?

    '
  answer:
    expected: u = tan(x)
    aliases:
    - u=tan x
    - tangent substitution
  explanation: 'The derivative of tangent is secant squared.

    '
  tags:
  - trig-integrals
  - tangent-secant
  - u-substitution
- id: secant-pythagorean-rewrite
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the identity used to rewrite remaining secant pairs in terms of
    tangent.

    '
  answer:
    expectedLatex: \sec^2x=1+\tan^2x
    aliases:
    - sec squared x equals one plus tan squared x
  explanation: 'This identity makes the remaining integrand a polynomial in $u=\tan
    x$.

    '
  tags:
  - trig-identities
  - tangent-secant
  - even-secant-power
- id: odd-tangent-trigger
  type: cloze
  skills:
  - trig-integrals-strategy
  prompt: 'If the tangent exponent is odd and secant is present, save a factor of

    $\_\_\_\_$.

    '
  answer:
    expected: sec(x)tan(x) dx
    aliases:
    - sec x tan x dx
    - secant x tangent x dx
  explanation: 'Then use $u=\sec x$ and rewrite remaining tangent pairs with

    $\tan^2x=\sec^2x-1$.

    '
  tags:
  - trig-integrals
  - tangent-secant
  - odd-tangent-power
- id: odd-tangent-substitution
  type: typed
  skills:
  - trig-integrals-strategy
  prompt: 'Which substitution matches the saved factor $\sec x\tan x\,dx$?

    '
  answer:
    expected: u = sec(x)
    aliases:
    - u=sec x
    - secant substitution
  explanation: 'The derivative of secant is $\sec x\tan x$.

    '
  tags:
  - trig-integrals
  - tangent-secant
  - u-substitution
- id: tangent-pythagorean-rewrite
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the identity used to rewrite remaining tangent pairs in terms of
    secant.

    '
  answer:
    expectedLatex: \tan^2x=\sec^2x-1
    aliases:
    - tan squared x equals sec squared x minus one
  explanation: 'This form makes the remaining integrand a polynomial in $u=\sec x$.

    '
  tags:
  - trig-identities
  - tangent-secant
  - odd-tangent-power
- id: secant-cubed-method
  type: flashcard
  skills:
  - trig-integrals-strategy
  prompt: 'What special method is used for $\int\sec^3x\,dx$, and why?

    '
  answer:
    expected: Use cyclic integration by parts because neither standard tangent-secant
      substitution package is present, and the original integral reappears so it can
      be solved algebraically.
  explanation: 'Use $u=\sec x$ and $dv=\sec^2x\,dx$, then replace

    $\tan^2x$ with $\sec^2x-1$.

    '
  tags:
  - trig-integrals
  - secant-cubed
  - cyclic-integration-by-parts
- id: secant-cubed-result
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the standard antiderivative:


    $$

    \int\sec^3x\,dx.

    $$

    '
  answer:
    expectedLatex: \frac{1}{2}\sec x\tan x+\frac{1}{2}\ln|\sec x+\tan x|+C
    aliases:
    - one half sec x tan x plus one half ln absolute sec x plus tan x plus c
  explanation: 'This is the base cyclic result used when reducing higher odd powers
    of secant.

    '
  tags:
  - trig-integrals
  - secant-cubed
  - standard-antiderivative
- id: secant-reduction-formula
  type: symbolic
  skills:
  - trig-integrals-strategy
  prompt: 'Recall the reduction formula for $\int\sec^n x\,dx$ with $n>1$.

    '
  answer:
    expectedLatex: \int\sec^n x\,dx=\frac{\sec^{n-2}x\tan x}{n-1}+\frac{n-2}{n-1}\int\sec^{n-2}x\,dx
    aliases:
    - secant reduction formula
  explanation: 'The formula lowers the secant exponent by two and eventually reaches

    $\int\sec x\,dx$ or $\int\sec^3x\,dx$.

    '
  tags:
  - trig-integrals
  - reduction-formulas
  - odd-secant-power
- id: strategy-final-check
  type: flashcard
  skills:
  - trig-integrals-strategy
  prompt: 'What final question should you ask before committing to a trigonometric
    substitution

    strategy?

    '
  answer:
    expected: Can every remaining factor be expressed in the chosen substitution variable,
      with the saved factor supplying its differential?
  explanation: 'A substitution is incomplete if leftover sine, cosine, tangent, or
    secant factors

    cannot be rewritten in the selected variable.

    '
  tags:
  - trig-integrals
  - strategy-check
  - substitution-selection
