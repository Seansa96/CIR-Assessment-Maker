  - id: choose
    title: 7. Choose a law by stage, not by habit
    required: true
    content: 'A multistage problem can use different laws in different intervals: momentum during a brief inelastic collision, then energy during later frictionless motion. Write the assumptions next to each equation.'
    media: []
    check:
      id: emr-c7
      type: multipleChoice
      prompt: A projectile embeds in a block and the pair rises on a frictionless pendulum. Which sequence is valid?
      choices:
      - id: a
        text: Momentum for embedding, then energy for the rise
        media: []
        issueSignals: []
      - id: b
        text: Energy for embedding, then momentum for the rise
        media: []
        issueSignals:
        - id: wrong-stage-method
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Use momentum in the inelastic impact and mechanical energy in the rise.\n\nWhy it works: The impact dissipates mechanical energy, while the later swing is conservative.\n\nWhy the other choices fail: Each choice b method is applied in a stage where its assumptions fail.'
