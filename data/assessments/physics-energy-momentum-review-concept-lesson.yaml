  - id: momentum
    title: 4. Keep momentum vector-valued
    required: true
    content: Momentum is $\vec p=m\vec v$. Choose axes and use signs or components before adding momenta.
    media: []
    check:
      id: emr-c4
      type: multipleChoice
      prompt: With right positive, a 2 kg object moving left at 3 m/s has what momentum?
      choices:
      - id: a
        text: $-6$ kg m/s
        media: []
        issueSignals: []
      - id: b
        text: $+6$ kg m/s
        media: []
        issueSignals:
        - id: sign-error
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $p=(2)(-3)=-6$ kg m/s.\n\nWhy it works: Momentum points with velocity.\n\nWhy the other choices fail: Positive magnitude alone loses direction.'
      media: []
      language: 
