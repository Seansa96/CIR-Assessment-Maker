  - id: work
    title: 2. Distinguish work from energy
    required: true
    content: 'Net work changes kinetic energy: $W_{net}=\Delta K$. Work is energy transferred by a force through displacement.'
    media: []
    check:
      id: emr-c2
      type: multipleChoice
      prompt: What does net work equal for a particle?
      choices:
      - id: a
        text: Change in kinetic energy
        media: []
        issueSignals: []
      - id: b
        text: Change in momentum
        media: []
        issueSignals:
        - id: work-impulse-confusion
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $W_{net}=\Delta K$.\n\nWhy it works: The work-energy theorem links total work to speed change.\n\nWhy the other choices fail: Momentum change is linked to impulse, not work.'
      media: []
      language: 
      functionName: 
      executionMode: unspecified
      starterCode: 
