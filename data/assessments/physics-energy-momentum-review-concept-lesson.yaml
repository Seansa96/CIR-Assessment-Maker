  - id: mechanical
    title: 3. Check mechanical-energy conditions
    required: true
    content: When only conservative forces do work, $K+U$ is constant. Friction, air drag, and an external push require explicit work or a broader energy account.
    media: []
    check:
      id: emr-c3
      type: multipleChoice
      prompt: Which situation supports direct mechanical-energy conservation?
      choices:
      - id: a
        text: A block slides on a frictionless track under gravity
        media: []
        issueSignals: []
      - id: b
        text: A block is dragged across a rough floor
        media: []
        issueSignals:
        - id: nonconservative-work-ignored
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Use $K_i+U_i=K_f+U_f$ for the frictionless track.\n\nWhy it works: Gravity is conservative and the normal force does no work.\n\nWhy the other choices fail: Friction transfers mechanical energy to thermal energy.'
      media: []
      language: 
      functionName: 
      executionMode: unspecified
      starterCode: 
