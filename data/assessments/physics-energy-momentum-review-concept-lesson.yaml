  - id: closed
    title: 6. Conserve momentum for a short closed event
    required: true
    content: If net external impulse is zero or negligible during an event, $\vec P_i=\vec P_f$. This is especially useful for collisions and explosions.
    media: []
    check:
      id: emr-c6
      type: multipleChoice
      prompt: Why can two carts conserve total momentum during a short low-friction collision?
      choices:
      - id: a
        text: Their collision force is internal and external impulse is negligible
        media: []
        issueSignals: []
      - id: b
        text: Kinetic energy is always conserved
        media: []
        issueSignals:
        - id: kinetic-energy-always-conserved
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The complete two-cart system has negligible external impulse.\n\nWhy it works: Internal forces cancel in the whole-system momentum sum.\n\nWhy the other choices fail: Many collisions lose kinetic energy.'
      media: []
