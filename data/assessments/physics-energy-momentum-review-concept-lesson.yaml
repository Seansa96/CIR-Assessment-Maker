  - id: impulse
    title: 5. Use impulse for force over time
    required: true
    content: Net impulse is $\vec J=\int\vec Fdt=\Delta\vec p$. A force-time area gives the signed momentum change.
    media: []
    check:
      id: emr-c5
      type: multipleChoice
      prompt: For constant force, what expression gives impulse?
      choices:
      - id: a
        text: $F\Delta t$
        media: []
        issueSignals: []
      - id: b
        text: $F/\Delta t$
        media: []
        issueSignals:
        - id: time-division-error
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $J=F\Delta t$.\n\nWhy it works: Constant force times duration is the force-time area.\n\nWhy the other choices fail: Dividing by time gives a rate, not impulse.'
      media: []
      language: 
      functionName: 
