lesson:
  introduction: Use this synthesis lesson to decide what system and time interval you are analyzing before you choose energy, work, impulse, or momentum conservation.
  sections:
  - id: system
    title: 1. Start with a system boundary
    required: true
    content: State the objects in the system. Forces between them are internal; forces from outside can transfer energy or momentum.
    media: []
    check:
      id: emr-c1
      type: multipleChoice
      prompt: For a cart-cart collision, what system makes their contact forces internal?
      choices:
      - id: a
        text: Both carts
        media: []
        issueSignals: []
      - id: b
        text: One cart only
        media: []
        issueSignals:
        - id: open-system
          domains:
          - physics-1
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Choose both carts.\n\nWhy it works: Their contact forces then occur within the system boundary.\n\nWhy the other choices fail: A one-cart system receives an external impulse from the omitted cart.'
      media: []
      language: 
      functionName: 
      executionMode: unspecified
      starterCode: 
