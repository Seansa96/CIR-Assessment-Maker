workedExamples:
  - id: shadow-indirect-measurement
    title: |
      Indirect Measurement With Shadows
    problem: |
      ![Indirect Measurement With Shadows diagram](/assessments/geometry/triangles/geometry-triangle-similarity-worked-example-2-shadow-indirect-measurement.svg)
      
      A $6$ ft person casts a $4$ ft shadow. At the same time, a tree casts an $18$ ft shadow. Find the height of the tree.
    steps:
      - id: shadow-indirect-measurement-step-1
        title: |
          Identify the governing idea
        instruction: |
          Start by deciding which theorem, formula, or geometric structure controls the problem.
        type: multipleChoice
        prompt: |
          Which idea should drive the solution?
        choices:
          - id: a
            text: |
              Similar triangles from equal sun angle
          - id: b
            text: |
              Pythagorean theorem
          - id: c
            text: |
              Triangle inequality only
          - id: d
            text: |
              A visual estimate without proof
        answer:
          choiceId: a
        explanation: |
          The controlling idea is Similar triangles from equal sun angle. It matches the given information and gives a reliable path.
      - id: shadow-indirect-measurement-step-2
        title: |
          Separate useful facts from noise
        instruction: |
          Before solving, identify the facts that justify the theorem or formula instead of grabbing a random equation.
        type: selectAll
        prompt: |
          Which statements support the solution?
        choices:
          - id: a
            text: |
              The given information matches Similar triangles from equal sun angle.
          - id: b
            text: |
              The diagram should be labeled before computing.
          - id: c
            text: |
              The final answer can be guessed from the drawing alone.
          - id: d
            text: |
              A different theorem should be used even if its conditions are missing.
        answer:
          choiceIds:
            - a
            - b
        explanation: |
          The correct statements connect the givens to the chosen method. The others either skip justification or apply a theorem without its required conditions.
      - id: shadow-indirect-measurement-step-3
        title: |
          Find the key result
        instruction: |
          Now use the selected method to get the main intermediate or final value.
        type: multipleChoice
        prompt: |
          Which key result is correct?
        choices:
          - id: a
            text: |
              $27$ ft
          - id: b
            text: |
              Not enough information
          - id: c
            text: |
              Use the largest number as the answer
          - id: d
            text: |
              The drawing alone determines it
        answer:
          choiceId: a
        explanation: |
          The height-to-shadow ratios match: $6/4=h/18$, so $h=27$ ft.
      - id: shadow-indirect-measurement-step-4
        title: |
          Choose the final conclusion
        instruction: |
          Use the key result to answer the original question clearly.
        type: multipleChoice
        prompt: |
          Which conclusion follows?
        choices:
          - id: a
            text: |
              The tree is $27$ ft tall.
          - id: b
            text: |
              The result cannot be determined.
          - id: c
            text: |
              A different theorem is required after solving.
          - id: d
            text: |
              The diagram contradicts the computation.
        answer:
          choiceId: a
        explanation: |
          The height-to-shadow ratios match: $6/4=h/18$, so $h=27$ ft.
      - id: shadow-indirect-measurement-step-5
        title: |
          Explain the complete path
        instruction: |
          Finish by explaining the reasoning in your own words. This is the step that turns a calculation into reusable geometry knowledge.
        type: freeResponse
        prompt: |
          Write a short final explanation of the solution.
        answer:
          expected: |
            The height-to-shadow ratios match: $6/4=h/18$, so $h=27$ ft.
          gradingMode: selfCheck
          keyPoints:
            - |
              Name the exact theorem or formula.
            - |
              Show how the givens satisfy that method.
            - |
              State the final result with units or classification where appropriate.
        explanation: |
          The height-to-shadow ratios match: $6/4=h/18$, so $h=27$ ft.
          
          Related topic: Triangle Similarity.
  - id: coordinate-dilation
    title: |
      Coordinate Dilation and Perimeter
    problem: |
