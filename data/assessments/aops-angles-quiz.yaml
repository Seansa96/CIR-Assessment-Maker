questions:
- id: q001
  type: multipleChoice
  prompt: Angles $A$ and $B$ are complementary. If $m\angle A = 37^\circ$, what is $m\angle B$?
  difficultyDimensions:
  - Recall the definition of complementary angles (sum to $90^\circ$).
  - Calculate $90 - 37$.
  choices:
  - id: a
    text: $53^\circ$
  - id: b
    text: $143^\circ$
    issueSignals:
    - id: supplementary-confusion
      domains: []
  - id: c
    text: $63^\circ$
    issueSignals:
    - id: subtraction-error
      domains: []
  - id: d
    text: $37^\circ$
    issueSignals:
    - id: vertical-angle-confusion
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    Complementary angles add up to $90^\circ$.

    $m\angle A + m\angle B = 90^\circ$

    $37^\circ + m\angle B = 90^\circ$

    $m\angle B = 90^\circ - 37^\circ = 53^\circ$.


    Why it works:

    The term "complementary" always refers to a sum of exactly a right angle ($90^\circ$).


    Why the other choices fail:

    - $143^\circ$ would be the answer if the angles were *supplementary* ($180 - 37 = 143$).

    - $63^\circ$ is a subtraction error from $100 - 37$.

    - $37^\circ$ assumes the angles are equal, which is only true for vertical angles or bisected angles.

    '
- id: q002
  type: multipleChoice
  prompt: Two angles form a linear pair. If one angle measures $4x$ and the other measures $5x$, what
    is the value of $x$?
  difficultyDimensions:
  - Recall that a linear pair is supplementary (sum to $180^\circ$).
  - Set up equation $4x + 5x = 180$.
  - Solve $9x = 180 \implies x = 20$.
  choices:
  - id: a
    text: $10$
    issueSignals:
    - id: complementary-confusion
      domains: []
  - id: b
    text: $20$
  - id: c
    text: $36$
    issueSignals:
    - id: single-angle-error
      domains: []
  - id: d
    text: $180$
    issueSignals:
    - id: sum-instead-of-variable
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    Angles that form a linear pair create a straight line, which measures $180^\circ$. Therefore, they
    are supplementary.

    $4x + 5x = 180$

    $9x = 180$

    $x = 20$.


    Why it works:

    A line always represents a $180^\circ$ angle. Any two adjacent angles resting on that straight line
    must sum to $180^\circ$.


    Why the other choices fail:

    - 10 would be correct if the angles summed to $90^\circ$ (complementary), since $9x = 90 \implies
    x = 10$.

    - 36 comes from setting one of the angles equal to $180$ ($5x = 180 \implies x = 36$).

    - 180 is the sum, not the value of the variable $x$.

    '
- id: q003
  type: multipleChoice
  prompt: Angles $\angle 1$ and $\angle 2$ are vertical angles. If $m\angle 1 = (3x + 10)^\circ$ and $m\angle
    2 = (5x - 20)^\circ$, find the measure of $\angle 1$.
  difficultyDimensions:
  - Recall that vertical angles are equal.
  - Set up equation $3x + 10 = 5x - 20$.
  - Solve for $x$ ($2x = 30 \implies x = 15$).
  - Substitute $x$ back into $3x + 10$ to find the angle measure ($55^\circ$).
  choices:
  - id: a
    text: $15^\circ$
    issueSignals:
    - id: variable-instead-of-angle
      domains: []
  - id: b
    text: $85^\circ$
    issueSignals:
    - id: supplementary-equation-error
      domains: []
  - id: c
    text: $55^\circ$
  - id: d
    text: $25^\circ$
    issueSignals:
    - id: algebraic-sign-error
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    Vertical angles are across from each other at an intersection and are always equal.

    $3x + 10 = 5x - 20$

    Subtract $3x$ from both sides: $10 = 2x - 20$

    Add 20 to both sides: $30 = 2x$

    Divide by 2: $x = 15$.

    The question asks for the measure of $\angle 1$, so we substitute $x = 15$:

    $m\angle 1 = 3(15) + 10 = 45 + 10 = 55^\circ$.


    Why it works:

    Vertical angles are guaranteed to be equal because they share exactly the same supplementary angles
    on the straight lines that form them. Note that finding $x$ is often only the first half of a geometry
    problem.


    Why the other choices fail:

    - $15^\circ$ is the value of the variable $x$, not the angle itself.

    - $85^\circ$ is the result of erroneously summing them to 180: $8x - 10 = 180 \implies x = 23.75 \dots$
    (or a sign error leading to $x=25$, then $3(25)+10 = 85$).

    - $25^\circ$ might come from an algebraic error like $5x + 3x = 10 + 20 \implies 8x = 30$.

    '
- id: q004
  type: multipleChoice
  prompt: An angle measures $12^\circ$ less than twice its supplement. What is the measure of the angle?
  difficultyDimensions:
  - Define the angle as $x$ and its supplement as $180 - x$.
  - 'Translate the sentence into an equation: $x = 2(180 - x) - 12$.'
  - 'Solve for $x$: $x = 360 - 2x - 12 \implies 3x = 348 \implies x = 116$.'
  choices:
  - id: a
    text: $116^\circ$
  - id: b
    text: $64^\circ$
    issueSignals:
    - id: complement-instead-of-angle
      domains: []
  - id: c
    text: $34^\circ$
    issueSignals:
    - id: complementary-confusion
      domains: []
  - id: d
    text: $128^\circ$
    issueSignals:
    - id: translation-error
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    Let the angle be $x$. Its supplement is $180 - x$.

    Translate the English sentence directly into algebra:

    $x = 2(180 - x) - 12$

    Distribute the 2:

    $x = 360 - 2x - 12$

    $x = 348 - 2x$

    Add $2x$ to both sides:

    $3x = 348$

    $x = 116^\circ$.


    Why it works:

    Defining the two angles as $x$ and $180-x$ guarantees they are supplementary. The phrasing "12 less
    than" means you subtract 12 at the very end of the expression, not at the beginning (it is $2(180-x)
    - 12$, not $12 - 2(180-x)$).


    Why the other choices fail:

    - $64^\circ$ is the supplement of the correct angle ($180 - 116$).

    - $34^\circ$ comes from incorrectly using $90-x$ (complement) instead of $180-x$: $x = 2(90-x) - 12
    \implies 3x = 168 \implies x = 56$ (or similar errors).

    - $128^\circ$ comes from translating incorrectly as $x = 2(180-x) + 12 \implies 3x = 372 \implies
    x = 124$, or similar.

    '
- id: q005
  type: multipleChoice
  prompt: The ratio of an angle to its complement is $2:3$. What is the measure of the larger angle?
  difficultyDimensions:
  - Represent the angles as $2x$ and $3x$.
  - Set their sum to 90 (complementary).
  - Solve $5x = 90 \implies x = 18$.
  - 'Find the larger angle: $3(18) = 54^\circ$.'
  choices:
  - id: a
    text: $36^\circ$
    issueSignals:
    - id: smaller-angle-error
      domains: []
  - id: b
    text: $54^\circ$
  - id: c
    text: $108^\circ$
    issueSignals:
    - id: supplementary-confusion
      domains: []
  - id: d
    text: $18^\circ$
    issueSignals:
    - id: variable-instead-of-angle
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    Because the ratio is $2:3$, we can call the two angles $2x$ and $3x$.

    Because they are complementary, their sum must be $90^\circ$:

    $2x + 3x = 90$

    $5x = 90$

    $x = 18$.

    The larger angle is $3x$:

    $3(18) = 54^\circ$.


    Why it works:

    Whenever you are given a ratio $A:B$, the easiest algebraic path is to define the quantities as $A
    \cdot x$ and $B \cdot x$. This instantly builds the ratio into the variables without needing fractions.


    Why the other choices fail:

    - $36^\circ$ is the smaller angle ($2x = 2(18)$).

    - $108^\circ$ would be the larger angle if they were supplementary ($5x = 180 \implies x=36 \implies
    3(36)=108$).

    - $18^\circ$ is the value of the multiplier $x$, not an angle measure.

    '
