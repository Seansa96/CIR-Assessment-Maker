schemaVersion: 1
id: aops-angles-quiz
title: Angles Practice Quiz
description: Practice angle measure, line relationships, triangle sums, and introductory circle-angle theorems.
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-angles
skills:
- Convert between degrees and radians
- Use vertical, supplementary, and full-turn angle relationships
- Apply parallel-line angle theorems and their converses
- Apply triangle-sum and exterior-angle theorems
- Relate central, inscribed, and tangent-chord angles to intercepted arcs
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-angles
  - angle-measure
  - parallel-lines
  - triangle-angles
  - circle-angles
questions:
- id: q001
  type: multipleChoice
  prompt: 'Convert $150^\circ$ to radians.'
  choices:
  - {id: a, text: '$\frac{5\pi}{6}$'}
  - {id: b, text: '$\frac{6\pi}{5}$'}
  - {id: c, text: '$\frac{3\pi}{5}$'}
  - {id: d, text: '$\frac{5\pi}{3}$'}
  answer: {choiceId: a}
  explanation: 'Multiply by $\pi/180$: $150\pi/180=5\pi/6$.'
- id: q002
  type: multipleChoice
  prompt: 'Two lines intersect. If one angle is $73^\circ$, what is the measure of its vertical angle?'
  choices:
  - {id: a, text: '$17^\circ$'}
  - {id: b, text: '$73^\circ$'}
  - {id: c, text: '$107^\circ$'}
  - {id: d, text: '$287^\circ$'}
  answer: {choiceId: b}
  explanation: Vertical angles are congruent, so the opposite angle is also $73^\circ$.
- id: q003
  type: multipleChoice
  prompt: 'One angle in a linear pair measures $118^\circ$. What is the other angle?'
  choices:
  - {id: a, text: '$52^\circ$'}
  - {id: b, text: '$62^\circ$'}
  - {id: c, text: '$72^\circ$'}
  - {id: d, text: '$118^\circ$'}
  answer: {choiceId: b}
  explanation: A linear pair sums to $180^\circ$, and $180-118=62$.
- id: q004
  type: multipleChoice
  prompt: 'Four angles around a point measure $85^\circ$, $110^\circ$, $95^\circ$, and $x^\circ$. Find $x$.'
  choices:
  - {id: a, text: '$60^\circ$'}
  - {id: b, text: '$70^\circ$'}
  - {id: c, text: '$80^\circ$'}
  - {id: d, text: '$90^\circ$'}
  answer: {choiceId: b}
  explanation: Angles around a point total $360^\circ$, so $x=360-(85+110+95)=70$.
- id: q005
  type: multipleChoice
  prompt: 'In the diagram, $\ell\parallel m$. Find $x$.'
  media:
  - type: image
    src: /assessments/aops/aops-angle-lines.svg
    alt: Parallel lines ell and m cut by transversal t, with a 62-degree angle and an alternate-interior angle x.
  choices:
  - {id: a, text: '$28^\circ$'}
  - {id: b, text: '$62^\circ$'}
  - {id: c, text: '$118^\circ$'}
  - {id: d, text: '$152^\circ$'}
  answer: {choiceId: b}
  explanation: The marked angles are alternate interior angles formed by parallel lines, so they are congruent.
- id: q006
  type: multipleChoice
  prompt: 'Parallel lines are cut by a transversal. One same-side interior angle is $68^\circ$. Find the other.'
  choices:
  - {id: a, text: '$22^\circ$'}
  - {id: b, text: '$68^\circ$'}
  - {id: c, text: '$112^\circ$'}
  - {id: d, text: '$292^\circ$'}
  answer: {choiceId: c}
  explanation: Same-side interior angles are supplementary, so the second is $180-68=112$ degrees.
- id: q007
  type: multipleChoice
  prompt: 'A triangle has angles $47^\circ$, $58^\circ$, and $x^\circ$. Find $x$.'
  choices:
  - {id: a, text: '$65^\circ$'}
  - {id: b, text: '$75^\circ$'}
  - {id: c, text: '$85^\circ$'}
  - {id: d, text: '$105^\circ$'}
  answer: {choiceId: b}
  explanation: Triangle angles total $180^\circ$, so $x=180-47-58=75$.
- id: q008
  type: multipleChoice
  prompt: 'Find the exterior angle $x$ in the diagram.'
  media:
  - type: image
    src: /assessments/aops/aops-angle-triangle.svg
    alt: Triangle ABC with remote interior angles 48 and 67 degrees and exterior angle x at C.
  choices:
  - {id: a, text: '$65^\circ$'}
  - {id: b, text: '$105^\circ$'}
  - {id: c, text: '$115^\circ$'}
  - {id: d, text: '$125^\circ$'}
  answer: {choiceId: c}
  explanation: An exterior angle equals the sum of the two remote interior angles, so $x=48+67=115$ degrees.
- id: q009
  type: multipleChoice
  prompt: 'A central angle measures $124^\circ$. What is the measure of its intercepted minor arc?'
  choices:
  - {id: a, text: '$62^\circ$'}
  - {id: b, text: '$124^\circ$'}
  - {id: c, text: '$236^\circ$'}
  - {id: d, text: '$248^\circ$'}
  answer: {choiceId: b}
  explanation: A central angle and its intercepted arc have the same degree measure.
- id: q010
  type: multipleChoice
  prompt: 'In the diagram, central angle $\angle AOB=104^\circ$. Find inscribed angle $x=\angle ACB$.'
  media:
  - type: image
    src: /assessments/aops/aops-angle-circle.svg
    alt: Circle with central angle AOB marked 104 degrees and inscribed angle ACB marked x, both intercepting arc AB.
  choices:
  - {id: a, text: '$26^\circ$'}
  - {id: b, text: '$52^\circ$'}
  - {id: c, text: '$104^\circ$'}
  - {id: d, text: '$208^\circ$'}
  answer: {choiceId: b}
  explanation: An inscribed angle is half the measure of its intercepted arc, so $x=104/2=52$ degrees.
- id: q011
  type: multipleChoice
  prompt: 'An inscribed angle intercepts a diameter. What is its measure?'
  choices:
  - {id: a, text: '$45^\circ$'}
  - {id: b, text: '$60^\circ$'}
  - {id: c, text: '$90^\circ$'}
  - {id: d, text: '$180^\circ$'}
  answer: {choiceId: c}
  explanation: A diameter determines a $180^\circ$ semicircle, and an inscribed angle is half its intercepted arc.
- id: q012
  type: multipleChoice
  prompt: 'The tangent and chord in the diagram form an angle at $A$. If $\angle ADB=38^\circ$, what is the tangent-chord angle intercepting the same chord $AB$?'
  media:
  - type: image
    src: /assessments/aops/aops-angle-cyclic-tangent.svg
    alt: Circle with chord AB, a tangent at A, and inscribed angle ADB marked 38 degrees.
  choices:
  - {id: a, text: '$19^\circ$'}
  - {id: b, text: '$38^\circ$'}
  - {id: c, text: '$52^\circ$'}
  - {id: d, text: '$76^\circ$'}
  answer: {choiceId: b}
  explanation: The tangent-chord angle equals the inscribed angle that intercepts the same chord.
- id: q013
  type: selectAll
  prompt: 'Assume two parallel lines are cut by a transversal. Which relationships must hold?'
  choices:
  - {id: a, text: Corresponding angles are congruent.}
  - {id: b, text: Alternate interior angles are congruent.}
  - {id: c, text: Same-side interior angles are supplementary.}
  - {id: d, text: Every angle in the figure is congruent.}
  answer: {choiceIds: [a, b, c]}
  explanation: Parallelism gives the first three relationships; acute and obtuse angles in the figure generally differ.
- id: q014
  type: selectAll
  prompt: 'Which circle-angle statements are valid?'
  choices:
  - {id: a, text: A central angle equals the measure of its intercepted arc.}
  - {id: b, text: An inscribed angle is half the measure of its intercepted arc.}
  - {id: c, text: A tangent-chord angle is half the measure of its intercepted arc.}
  - {id: d, text: An inscribed angle always equals its intercepted arc.}
  answer: {choiceIds: [a, b, c]}
  explanation: The central-angle factor is one; the inscribed and tangent-chord factors are one half.
- id: q015
  type: freeResponse
  prompt: Prove the exterior-angle theorem using only the triangle angle-sum theorem and a linear pair.
  answer:
    gradingMode: selfCheck
    expected: 'Let the triangle interior angles be $A$, $B$, and $C$, and let exterior angle $E$ form a linear pair with $C$. Triangle sum gives $A+B+C=180^\circ$, while the linear pair gives $E+C=180^\circ$. Therefore $A+B+C=E+C$. Subtracting $C$ yields $E=A+B$, so the exterior angle equals the sum of the two remote interior angles.'
    keyPoints:
    - States the triangle angle-sum equation.
    - States the linear-pair equation.
    - Equates the two expressions for $180^\circ$.
    - Concludes that the exterior angle equals the two remote interior angles.
  explanation: The theorem is a direct consequence of two independent sums that both equal $180^\circ$.
