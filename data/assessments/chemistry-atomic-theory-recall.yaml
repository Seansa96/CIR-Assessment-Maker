schemaVersion: 1
id: chemistry-atomic-theory-recall
title: Atomic Theory Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
- chemistry-atomic-theory
skills:
- chemistry-atomic-theory
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What law states that mass is neither created nor destroyed in a chemical
    reaction?
  answer:
    expected: Law of Conservation of Mass
    aliases:
    - conservation of mass
    - conservation of mass law
- id: r002
  type: typed
  prompt: 'What law states that a given compound always contains the same elements
    in exactly the same proportion by mass?

    '
  answer:
    expected: Law of Definite Proportions
    aliases:
    - definite proportions
    - law of definite composition
- id: r003
  type: typed
  prompt: 'When two elements form more than one compound, the masses of one element
    that combine with a fixed mass of the other are in small whole-number ratios.
    What law is this?

    '
  answer:
    expected: Law of Multiple Proportions
    aliases:
    - multiple proportions
- id: r004
  type: typed
  prompt: Which scientist is credited with developing the first modern atomic theory?
  answer:
    expected: Dalton
    aliases:
    - John Dalton
- id: r005
  type: typed
  prompt: The number of protons in an atom's nucleus is called the _____ number.
  answer:
    expected: atomic
    aliases:
    - atomic number
- id: r006
  type: typed
  prompt: The sum of protons and neutrons in an atom is called the _____ number.
  answer:
    expected: mass
    aliases:
    - mass number
- id: r007
  type: typed
  prompt: 'Atoms of the same element that have different numbers of neutrons are called
    what?

    '
  answer:
    expected: isotopes
- id: r008
  type: typed
  prompt: What is the charge of a cation?
  answer:
    expected: positive
    aliases:
    - +
    - positive charge
- id: r009
  type: typed
  prompt: What is the charge of an anion?
  answer:
    expected: negative
    aliases:
    - '-'
    - negative charge
- id: r010
  type: typed
  prompt: 'An atom has atomic number 17 and mass number 35. How many neutrons does
    it have?

    '
  answer:
    expected: '18'
    aliases:
    - 18 neutrons
- id: r011
  type: flashcard
  prompt: State Dalton's postulate that explains conservation of mass.
  answer:
    expected: 'In a chemical reaction, atoms are rearranged but not created or destroyed.

      '
- id: r012
  type: typed
  prompt: 'A sodium atom (Na, atomic number 11) loses one electron. What is the charge
    of the resulting ion?

    '
  answer:
    expected: 1+
    aliases:
    - '+1'
    - positive one
- id: r013
  type: flashcard
  prompt: How do you calculate the atomic mass of an element from its isotopes?
  answer:
    expected: 'Multiply the mass of each isotope by its fractional natural abundance
      and add the results (weighted average).

      '
- id: r014
  type: typed
  prompt: 'Which subatomic particle defines the identity of an element (i.e., changing
    its count changes the element)?

    '
  answer:
    expected: proton
    aliases:
    - protons
