questions:
- id: q001
  type: multipleChoice
  prompt: 'Which of the following best defines "gauge pressure"?

    '
  choices:
  - id: a
    text: The total absolute pressure exerted by the fluid.
    issueSignals:
    - id: pressure-confusion
  - id: b
    text: The pressure relative to a perfect vacuum.
    issueSignals:
    - id: pressure-confusion
  - id: c
    text: The absolute pressure minus the local atmospheric pressure.
  - id: d
    text: The pressure caused only by atmospheric gases.
    issueSignals:
    - id: pressure-confusion
  answer:
    choiceId: c
  explanation: 'Solution:

    The absolute pressure minus the local atmospheric pressure.


    Why it works:

    Standard pressure gauges are zeroed to the local atmospheric pressure. Therefore,
    they only measure the *additional* pressure provided by the system (such as the
    fluid column $\rho g h$). Thus, $P_{gauge} = P_{absolute} - P_{atm}$.


    Why the other choices fail:

    Absolute pressure is the pressure relative to a perfect vacuum (which is exactly
    zero).

    '
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
- id: q002
  type: numericResponse
  prompt: 'A solid metal block with a weight of $500 \text{ N}$ rests on a table.
    The base of the block in contact with the table has an area of $0.02 \text{ m}^2$.

    Calculate the pressure exerted by the block on the table in Pascals.

    '
  answer:
    value: 25000
    tolerance: 10
  explanation: 'Solution:

    $P = \frac{F}{A} = \frac{500}{0.02} = 25000 \text{ Pa}$.


    Why it works:

    Pressure is the normal force per unit area. Here, the normal force is exactly
    the weight of the block.

    '
  difficultyDimensions:
  - Simplification
  - ModelOrDerivation
