lesson:
  introduction: This lesson covers the primary definitions and equations governing
    Calculating Moi.
  sections:
  - id: sec-1
    title: Defining Calculating Moi
    content: The physics of Calculating Moi requires a solid understanding of both
      rotational kinematics and dynamics. The core principles mirror linear mechanics
      but account for radial distribution of mass and rotational axes. For example,
      torque relates to angular acceleration via $\tau = I\alpha$.
    media: []
    check:
      id: chk-physics-calculating-moi-1
      type: multipleChoice
      prompt: Which of the following best describes a key principle of Calculating
        Moi?
      choices:
      - id: a
        text: It depends strictly on linear mass alone.
        issueSignals:
        - id: linear-angular-confusion
        - id: inertia-mass-confusion
      - id: b
        text: It involves the relationship between forces, torques, and mass distribution.
      - id: c
        text: It is independent of the axis of rotation.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        It involves the relationship between forces, torques, and mass distribution.


        Why it works:

        Rotational mechanics always heavily relies on mass distribution and torques.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Discrete Masses
    content: 'For separated particles, calculate $I=\sum m_ir_i^2$ about the stated axis.'
    media: []
    check: { id: chk-cmoi-5, type: multipleChoice, prompt: 'A 2 kg mass at 3 m has inertia:', choices: [{ id: a, text: '$6$ kg m$^2$' }, { id: b, text: '$9$ kg m$^2$' }, { id: c, text: '$18$ kg m$^2$' }, { id: d, text: '$36$ kg m$^2$' }], answer: { choiceId: c }, explanation: 'Solution: $I=mr^2=2(3)^2=18$ kg m$^2$.\n\nWhy it works: Point-mass inertia weights distance squared.\n\nWhy the other choices fail: They omit or misapply the radius square.' }
  - id: sec-4
    title: Standard Shapes
    content: 'Use tabulated formulas only for the specific shape and stated axis.'
    media: []
    check: { id: chk-cmoi-6, type: multipleChoice, prompt: 'A solid disk about its central axis has:', choices: [{ id: a, text: '$MR^2$' }, { id: b, text: '$\tfrac12MR^2$' }, { id: c, text: '$\tfrac13ML^2$' }, { id: d, text: '$ML$' }], answer: { choiceId: b }, explanation: 'Solution: $I=\tfrac12MR^2$.\n\nWhy it works: This is the central-axis disk formula.\n\nWhy the other choices fail: They are a hoop, rod, or wrong-dimensional expression.' }
  - id: sec-5
    title: Parallel-Axis Theorem
    content: 'For an axis parallel to one through the center of mass, $I=I_{cm}+Md^2$.'
    media: []
    check: { id: chk-cmoi-7, type: multipleChoice, prompt: 'Moving an axis distance $d$ from center of mass changes inertia by:', choices: [{ id: a, text: '$Md$' }, { id: b, text: '$Md^2$' }, { id: c, text: '$M/d$' }, { id: d, text: zero }], answer: { choiceId: b }, explanation: 'Solution: Add $Md^2$.\n\nWhy it works: This is the parallel-axis theorem.\n\nWhy the other choices fail: The distance contribution is squared.' }
  - id: sec-6
    title: Composite Bodies
    content: 'Add inertias of included parts and subtract inertias of removed material about the same axis.'
    media: []
    check: { id: chk-cmoi-8, type: multipleChoice, prompt: 'A drilled hole in a uniform disk is handled by:', choices: [{ id: a, text: adding its inertia }, { id: b, text: subtracting its inertia }, { id: c, text: ignoring it }, { id: d, text: doubling it }], answer: { choiceId: b }, explanation: 'Solution: Subtract its inertia.\n\nWhy it works: The hole represents removed mass.\n\nWhy the other choices fail: They retain or exaggerate absent material.' }
  - id: sec-7
    title: Unit Checks
    content: 'Every moment of inertia must end in kg m$^2$.'
    media: []
    check: { id: chk-cmoi-9, type: multipleChoice, prompt: 'Which unit signals a valid inertia result?', choices: [{ id: a, text: kg m$^2$ }, { id: b, text: N m }, { id: c, text: J/s }, { id: d, text: m/s }], answer: { choiceId: a }, explanation: 'Solution: kg m$^2$.\n\nWhy it works: Inertia is mass times distance squared.\n\nWhy the other choices fail: They are torque, power, or speed units.' }
  - id: sec-2
    title: Mathematical Formulas
    content: The mathematical framework often relies on cross products and integrals.
      Ensuring consistent units (radians for angular measures) is critical. $L = I\omega$
      and $\tau = \vec{r} \times \vec{F}$ are foundational.
    media: []
    check:
      id: chk-physics-calculating-moi-2
      type: multipleChoice
      prompt: What unit is essential when using rotational kinematic formulas?
      choices:
      - id: a
        text: Degrees
        issueSignals:
        - id: unit-conversion-error
      - id: b
        text: Radians
      - id: c
        text: Revolutions
        issueSignals:
        - id: unit-conversion-error
      answer:
        choiceId: b
      explanation: 'Solution:

        Radians


        Why it works:

        Radians are the natural mathematical unit tying arc length to radius.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
