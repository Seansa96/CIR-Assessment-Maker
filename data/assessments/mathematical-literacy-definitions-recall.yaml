items:
- id: r001
  type: typed
  prompt: What is the role of a mathematical definition?
  answer:
    expected: to specify meaning
    aliases:
    - define a term
    - give the meaning of a term
  explanation: |-
    Solution: A definition specifies meaning.
    Why it works: Definitions establish the conditions attached to a term and can be unpacked in later reasoning.
- id: r002
  type: typed
  prompt: What is the name for an assumption required by a theorem?
  answer:
    expected: hypothesis
    aliases:
    - a hypothesis
    - condition
  explanation: |-
    Solution: It is a hypothesis.
    Why it works: Hypotheses are the conditions that must be in force before a theorem's conclusion may be used.
- id: r003
  type: typed
  prompt: What kind of claim can one counterexample disprove?
  answer:
    expected: a universal claim
    aliases:
    - a universal statement
    - a statement about every object
  explanation: |-
    Solution: It can disprove a universal claim.
    Why it works: A universal claim fails if even one permitted object does not have the asserted property.
- id: r004
  type: typed
  prompt: Can one confirming example prove a statement about every object?
  answer:
    expected: false
    aliases:
    - no it cannot
    - 'no'
  explanation: |-
    Solution: No.
    Why it works: An example establishes only one case; a universal conclusion needs reasoning that covers all permitted cases.
