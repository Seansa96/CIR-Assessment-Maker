schemaVersion: 1
id: calc2-polar-family-recognition-recall
title: Polar Family Recognition Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryIds:
  - polar-curves
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: recognitionDrill
  tags:
  - calculus-2
  - polar-curves
  - polar-family-recognition
  - polar-graphs
  - curve-families
skills:
- Apply calculus-2 concepts
- Apply Polar Curves
  - polar-graph-recognition
items:
  - id: constant-radius-circle
    type: recognition
    skills:
      - polar-graph-recognition
    prompt: Which family is represented by $r=5$?
    choices:
      - id: a
        text: Circle centered at the pole
      - id: b
        text: Rose curve
      - id: c
        text: Dimpled limacon
      - id: d
        text: Lemniscate
    answer:
      choiceId: a
      expected: Circle centered at the pole
    explanation: |
      Constant radius means every point is the same distance from the pole.
    tags:
      - polar-circle

  - id: polar-family-grid-recognition
    type: recognition
    skills:
      - polar-graph-recognition
    prompt: |
      Use the family grid as a visual cue.

      ![Grid of common polar curve families including circle, cardioid, limacon, rose, lemniscate, and spiral](/assessments/calc2-parametric-polar/polar-family-recognition-grid.svg)

      Which family is identified by a squared-radius equation such as $r^2=a^2\cos(2\theta)$?
    choices:
      - id: a
        text: Lemniscate
      - id: b
        text: Cardioid
      - id: c
        text: Circle centered at the pole
      - id: d
        text: Spiral
    answer:
      choiceId: a
      expected: Lemniscate
    explanation: |
      Lemniscates are figure-eight type curves commonly written with $r^2$ and a double-angle sine or cosine.
    tags:
      - lemniscate
      - visual-recognition

  - id: limacon-general-form
    type: symbolic
    skills:
      - polar-graph-recognition
    prompt: Write the general cosine form of a limacon.
    answer:
      expectedLatex: 'r=a\pm b\cos\theta'
      aliases:
        - 'r=a +/- b cos theta'
    explanation: |
      Limacons have a constant term plus or minus a sine or cosine term.
    tags:
      - limacon

  - id: inner-loop-ratio-cloze
    type: cloze
    skills:
      - polar-graph-recognition
    prompt: 'A limacon has an inner loop when $\frac{a}{b}$ is ____ than $1$.' 
    answer:
      expected: less
      aliases:
        - less than
        - '<'
    explanation: |
      If $a<b$, the trig part can overpower the constant term and make $r$ negative.
    tags:
      - inner-loop-limacon

  - id: cardioid-ratio-cloze
    type: cloze
    skills:
      - polar-graph-recognition
    prompt: 'A cardioid occurs in the limacon family when $\frac{a}{b}=____$.' 
    answer:
      expected: 1
      aliases:
        - one
    explanation: |
      Equal constant and trig coefficients make the curve touch the pole in one cusp.
    tags:
      - cardioid

  - id: dimpled-limacon-ratio
    type: typed
    skills:
      - polar-graph-recognition
    prompt: What limacon type occurs when $1<\frac{a}{b}<2$?
    answer:
      expected: dimpled limacon
      aliases:
        - dimpled
    explanation: |
      The graph has an inward dent but does not form an inner loop.
    tags:
      - dimpled-limacon

  - id: convex-limacon-ratio
    type: cloze
    skills:
      - polar-graph-recognition
    prompt: 'A limacon is convex when $\frac{a}{b}$ is at least ____.' 
    answer:
      expected: 2
      aliases:
        - two
    explanation: |
      At ratios of $2$ or greater, the curve loses its visible dimple.
    tags:
      - convex-limacon

  - id: rose-form-recognition
    type: recognition
    skills:
      - polar-graph-recognition
    prompt: Which equation form represents a rose curve?
    choices:
      - id: a
        text: '$r=a\sin(n\theta)$'
      - id: b
        text: '$r=a+b\theta$'
      - id: c
        text: '$r^2=a^2\cos(2\theta)$'
      - id: d
        text: '$r=a$'
    answer:
      choiceId: a
      expected: '$r=a\sin(n\theta)$'
    explanation: |
      Rose curves use sine or cosine of a multiple angle.
    tags:
      - rose-curve

  - id: rose-even-petal-count
    type: cloze
    skills:
      - polar-graph-recognition
    prompt: 'If $n$ is even in $r=a\cos(n\theta)$, the rose has ____ petals.' 
    answer:
      expected: 2n
      aliases:
        - twice n
        - double n
    explanation: |
      Even $n$ rose curves have $2n$ petals.
    tags:
      - rose-curve
      - petal-count

  - id: rose-odd-petal-count
    type: cloze
    skills:
      - polar-graph-recognition
    prompt: 'If $n$ is odd in $r=a\sin(n\theta)$, the rose has ____ petals.' 
    answer:
      expected: n
    explanation: |
      Odd $n$ rose curves have $n$ petals.
    tags:
      - rose-curve
      - petal-count

  - id: lemniscate-recognition
    type: recognition
    skills:
      - polar-graph-recognition
    prompt: Which equation form most strongly suggests a lemniscate?
    choices:
      - id: a
        text: '$r^2=a^2\cos(2\theta)$'
      - id: b
        text: '$r=a+b\theta$'
      - id: c
        text: '$r=a+b\cos\theta$'
      - id: d
        text: '$r=a$'
    answer:
      choiceId: a
      expected: '$r^2=a^2\cos(2\theta)$'
    explanation: |
      Lemniscates commonly appear as squared-radius equations involving $\sin(2\theta)$ or $\cos(2\theta)$.
    tags:
      - lemniscate

  - id: sine-orientation-typed
    type: typed
    skills:
      - polar-graph-recognition
    prompt: In basic polar families, does a sine term usually emphasize vertical or horizontal orientation?
    answer:
      expected: vertical
      aliases:
        - vertical orientation
    explanation: |
      Sine terms align naturally with the vertical direction; cosine terms align with the polar axis.
    tags:
      - polar-orientation

  - id: cosine-orientation-typed
    type: typed
    skills:
      - polar-graph-recognition
    prompt: In basic polar families, does a cosine term usually emphasize vertical or horizontal orientation?
    answer:
      expected: horizontal
      aliases:
        - horizontal orientation
    explanation: |
      Cosine terms align naturally with the polar axis, which is the positive $x$-axis.
    tags:
      - polar-orientation
