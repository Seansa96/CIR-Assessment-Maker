items:
- {id: sound-r1, type: cloze, prompt: 'In a fluid, $v={{\sqrt{B/\rho}}}$.', answer: {expected: '\sqrt{B/\rho}'}, explanation: 'Solution: Use $v=\sqrt{B/\rho}$. Why it works: bulk modulus supplies the restoring pressure and density supplies the inertia.'}
- {id: sound-r2, type: typed, prompt: 'Does sound speed in an ideal gas depend on frequency?', answer: {expected: no}, explanation: 'Solution: No. Why it works: all frequencies travel at the same phase velocity in an ideal medium.'}
- {id: sound-r3, type: cloze, prompt: 'For an isotropic source, $I={{P/(4\pi r^2)}}$.', answer: {expected: 'P/(4\pi r^2)'}, explanation: 'Solution: Use $I=P/(4\pi r^2)$. Why it works: power is spread uniformly over a sphere of area $4\pi r^2$.'}
- {id: sound-r4, type: typed, prompt: 'If distance doubles, by what factor does point-source intensity change?', answer: {expected: 'decreases by factor 4'}, explanation: 'Solution: One quarter. Why it works: the inverse-square law.'}
- {id: sound-r5, type: cloze, prompt: 'Open-open tube frequencies are $f_n={{nv/(2L)}}$.', answer: {expected: 'nv/(2L)'}, explanation: 'Solution: Use $f_n=nv/(2L)$. Why it works: antinodes at both open ends allow all integer harmonics.'}
- {id: sound-r6, type: typed, prompt: 'What displacement feature is at a closed end of a resonant tube?', answer: {expected: node}, explanation: 'Solution: A node. Why it works: rigid walls prohibit air displacement.'}
- {id: sound-r7, type: cloze, prompt: 'The lowest mode frequency is the {{fundamental}}.', answer: {expected: fundamental}, explanation: 'Solution: Identify the fundamental. Why it works: it is the longest standing-wave mode that fits in the resonator.'}
- {id: sound-r8, type: typed, prompt: 'What determines musical pitch most directly?', answer: {expected: frequency}, explanation: 'Solution: Frequency. Why it works: pitch is the perceptual counterpart of the fundamental frequency.'}
- {id: sound-r9, type: cloze, prompt: 'The beat frequency is $f_\text{beat}={{|f_1-f_2|}}$.', answer: {expected: '|f_1-f_2|'}, explanation: 'Solution: Use $f_\text{beat}=|f_1-f_2|$. Why it works: the amplitude envelope oscillates at the difference frequency.'}
- {id: sound-r10, type: typed, prompt: 'What beat frequency results from 256 Hz and 260 Hz tones?', answer: {expected: 4 Hz}, explanation: 'Solution: 4 Hz. Why it works: beat frequency is the absolute difference.'}
- {id: sound-r11, type: typed, prompt: 'Does an approaching source raise or lower observed frequency?', answer: {expected: raise}, explanation: 'Solution: It raises it. Why it works: the source overtakes its own wavefronts, reducing observed wavelength.'}
- {id: sound-r12, type: cloze, prompt: 'Mach number is $M={{v_s/v}}$.', answer: {expected: 'v_s/v'}, explanation: 'Solution: Use $M=v_s/v$. Why it works: it is the ratio of source speed to wave speed.'}
- {id: sound-r13, type: typed, prompt: 'What condition is required for a Mach cone?', answer: {expected: 'source speed must exceed sound speed (M > 1)'}, explanation: 'Solution: M > 1. Why it works: at subsonic speeds the source cannot outrun its wavefronts.'}
