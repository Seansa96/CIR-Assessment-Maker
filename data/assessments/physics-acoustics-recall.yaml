items:
- id: r01
  type: typed
  prompt: State a central equation or relationship for Sound Waves.
  answer: v=f\lambda
  explanation: 'Solution: Use $v=f\lambda$. Why it works: wave speed equals frequency times wavelength.'
  tags:
  - physics-sound-waves
  - equations
- id: r02
  type: typed
  prompt: State a central equation or relationship for Speed of Sound.
  answer: v\approx331+0.6T_C
  explanation: 'Solution: Use $v\approx331+0.6T_C$. Why it works: sound speed in air increases approximately linearly with Celsius temperature.'
  tags:
  - physics-speed-of-sound
  - equations
- id: r03
  type: typed
  prompt: State a central equation or relationship for Sound Intensity.
  answer: I=P/(4\pi r^2)
  explanation: 'Solution: Use $I=P/(4\pi r^2)$. Why it works: isotropic power spreads over a spherical area.'
  tags:
  - physics-sound-intensity
  - equations
- id: r04
  type: typed
  prompt: State a central equation or relationship for Normal Modes of a Standing Sound Wave.
  answer: f_n=nv/(2L)
  explanation: 'Solution: Use $f_n=nv/(2L)$. Why it works: an open-open tube supports integer half-wavelength modes.'
  tags:
  - physics-standing-sound-modes
  - equations
- id: r05
  type: typed
  prompt: State a central equation or relationship for Sources of Musical Sound.
  answer: f_1=v/(2L)
  explanation: 'Solution: Use $f_1=v/(2L)$. Why it works: the fundamental open-open mode has half a wavelength in the tube.'
  tags:
  - physics-musical-sound-sources
  - equations
- id: r06
  type: typed
  prompt: State a central equation or relationship for Beats.
  answer: f_b=|f_1-f_2|
  explanation: 'Solution: Use $f_b=|f_1-f_2|$. Why it works: the envelope repeats at the absolute source-frequency difference.'
  tags:
  - physics-beats
  - equations
- id: r07
  type: typed
  prompt: State a central equation or relationship for The Doppler Effect.
  answer: f'=f(v+v_o)/(v-v_s)
  explanation: 'Solution: Use the approaching-source/observer Doppler form. Why it works: both motions increase wavefront arrival rate.'
  tags:
  - physics-doppler-effect
  - equations
- id: r08
  type: typed
  prompt: State a central equation or relationship for Shock Waves.
  answer: \sin\theta=v/v_s
  explanation: 'Solution: Use $\sin\theta=v/v_s$. Why it works: Mach-cone geometry compares wavefront radius with source travel distance.'
  tags:
  - physics-shock-waves
  - equations
