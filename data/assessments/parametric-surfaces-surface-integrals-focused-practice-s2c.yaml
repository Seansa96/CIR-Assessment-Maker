questions:
- id: q001
  type: multipleChoice
  prompt: For r(u,v)=<u,v,u+v>, which vector is normal to the surface?
  choices:
  - id: a
    text: <-1,-1,1>
  - id: b
    text: <1,0,1>
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: c
    text: <0,1,1>
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: d
    text: <u,v,u+v>
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: surface-orientation-parameterization-error
  difficultyDimensions: &id001
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Compute ru cross rv from the two tangent vectors.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vector-Valued Functions.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: What does |ru cross rv| provide?
  choices:
  - id: a
    text: Surface-area scaling
  - id: b
    text: A potential function
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: c
    text: A curve length only
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: d
    text: A scalar curl
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: surface-orientation-parameterization-error
  difficultyDimensions: *id001
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: The cross-product magnitude is the area of a parameter-parallelogram.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vector-Valued Functions.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
