questions:
- id: q001
  type: multipleChoice
  prompt: For r(u,v)=<u,v,u+v>, which vector is normal to the surface?
  choices:
  - id: a
    text: <-1,-1,1>
  - id: b
    text: <1,0,1>
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: c
    text: <0,1,1>
    issueSignals:
    - id: surface-orientation-parameterization-error
  - id: d
    text: <u,v,u+v>
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: surface-orientation-parameterization-error
  difficultyDimensions: &id001
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Compute ru cross rv from the two tangent vectors.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vector-Valued Functions.

    Why the other choices fail: Choice b, ''<1,0,1>'', does not give ''<-1,-1,1>'' for ''For r(u,v)=<u,v,u+v>, which vector
    is normal to the surface?''. It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''<0,1,1>'', does not give ''<-1,-1,1>'' for ''For r(u,v)=<u,v,u+v>, which vector is normal to the surface?''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice d, ''<u,v,u+v>'', does not give ''<-1,-1,1>'' for ''For r(u,v)=<u,v,u+v>, which vector is normal to the surface?''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.'
