workedExamples:
- id: we01
  title: Euler's one-step defect
  problem: Analyze one Euler step for $y'=y$, $y(0)=1$, with step $h$.
  steps:
  - id: we01-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Write the exact and Euler next values.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - exact value
      - Euler update
    explanation: |-
      Solution: $y(h)=e^h$ and $Y_1=1+h$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Expand the difference.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Taylor expansion
      - leading term
    explanation: |-
      Solution: $e^h-(1+h)=h^2/2+h^3/6+\cdots$, so the leading local defect is $h^2/2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Confirm the order and sign.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - order check
      - curvature interpretation
    explanation: |-
      Solution: The ratio of the defect to $h^2$ tends to $1/2$, and the positive defect agrees with the convex exact curve lying above its tangent.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: A step-halving table
  problem: Use Euler for $y'=y$, $y(0)=1$ to approximate $y(1)$ with $h=0.5$ and $h=0.25$.
  steps:
  - id: we02-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Write the repeated update.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - recurrence
      - common endpoint
    explanation: |-
      Solution: $Y_N=(1+h)^N$ with $N=1/h$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Compute both approximations and errors.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - two approximations
      - two errors
    explanation: |-
      Solution: $Y_2=2.25$, $E_{0.5}=0.468282$; $Y_4=2.44140625$, $E_{0.25}=0.276876$ using $e=2.718282$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Interpret the ratio.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - ratio
      - qualified conclusion
    explanation: |-
      Solution: $E_{0.5}/E_{0.25}\approx1.69$; it is moving toward the first-order asymptotic ratio $2$ but coarse steps are not yet fully asymptotic.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Accuracy per evaluation
  problem: Compare Euler with $h=0.1$ and RK4 with $h=0.5$ on a unit interval.
  steps:
  - id: we03-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Count work before comparing error.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Euler cost
      - RK4 cost
    explanation: |-
      Solution: Euler uses $10$ evaluations; two RK4 steps use $2\times4=8$ evaluations.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Use supplied common-endpoint errors.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - same endpoint
      - reference errors
    explanation: |-
      Solution: If the errors are $1.2\times10^{-2}$ and $3.0\times10^{-4}$, RK4 is both cheaper by this count and more accurate in this run.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: State the limited conclusion.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - assumptions
      - no overgeneralization
    explanation: |-
      Solution: The comparison applies to this IVP, interval, implementation, and precision; it is not a universal timing theorem.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
