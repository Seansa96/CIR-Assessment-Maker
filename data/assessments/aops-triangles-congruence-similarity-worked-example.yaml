workedExamples:
- id: aops-triangles-cs-problem-1
  title: SSS correspondence before algebra
  problem: |
    The diagram marks $AB=DE$, $AC=DF$, and $BC=EF$. In addition, $AC=2x+3$ and $DF=5x-12$. Prove the relevant triangles congruent, find $x$, and verify that the resulting side length is compatible with the correspondence.
  steps:
  - id: aops-triangles-cs-p1-s1
    title: Parse only marked information
    instruction: Read the one-, two-, and three-tick side pairs instead of matching vertices by their positions on the page.
    type: multipleChoice
    prompt: Which ordered congruence statement follows from the tick marks?
    media:
    - type: image
      src: /assessments/aops/aops-triangles-congruence.svg
      alt: Triangles ABC and DEF with AB matching DE, AC matching DF, and BC matching EF.
      caption: Each tick count identifies one corresponding side pair.
    choices:
    - {id: a, text: '$\triangle ABC\cong\triangle DEF$'}
    - {id: b, text: '$\triangle ABC\cong\triangle DFE$'}
    - {id: c, text: '$\triangle ABC\cong\triangle EFD$'}
    - {id: d, text: '$\triangle ABC\cong\triangle FED$'}
    answer: {choiceId: a}
    explanation: The side marks force $A\leftrightarrow D$, $B\leftrightarrow E$, and $C\leftrightarrow F$.
  - id: aops-triangles-cs-p1-s2
    title: Name the rigidity theorem
    instruction: Check that all three equalities compare corresponding sides.
    type: multipleChoice
    prompt: Which theorem proves the triangles congruent?
    choices:
    - {id: a, text: SSS congruence}
    - {id: b, text: AAA congruence}
    - {id: c, text: SSA congruence}
    - {id: d, text: AA similarity only}
    answer: {choiceId: a}
    explanation: Three corresponding side equalities satisfy SSS and rigidly determine the triangles.
  - id: aops-triangles-cs-p1-s3
    title: Transfer the corresponding equality
    instruction: Use the order proved in step 1; do not choose an equation merely because it contains $x$.
    type: multipleChoice
    prompt: Which equation is licensed by the correspondence?
    choices:
    - {id: a, text: '$2x+3=5x-12$'}
    - {id: b, text: '$2x+3+5x-12=180$'}
    - {id: c, text: '$(2x+3)(5x-12)=1$'}
    - {id: d, text: '$2x+3=\frac12(5x-12)$'}
    answer: {choiceId: a}
    explanation: Corresponding sides $AC$ and $DF$ are equal, so their two expressions must be equal.
  - id: aops-triangles-cs-p1-s4
    title: Solve without losing the geometric meaning
    instruction: Rearrange the side-equality equation and retain the positive length check.
    type: multipleChoice
    prompt: What are $x$ and the common length $AC=DF$?
    choices:
    - {id: a, text: '$x=3$ and the length is $9$'}
    - {id: b, text: '$x=5$ and the length is $13$'}
    - {id: c, text: '$x=7$ and the length is $17$'}
    - {id: d, text: '$x=-5$ and the length is $-7$'}
    answer: {choiceId: b}
    explanation: Solving $2x+3=5x-12$ gives $15=3x$, hence $x=5$ and both expressions equal $13$.
  - id: aops-triangles-cs-p1-s5
    title: Verify correspondence and admissibility
    instruction: Substitute into both original expressions and state why the result is geometrically admissible.
    type: freeResponse
    prompt: Give the complete substitution check and identify what SSS permits you to conclude after the check.
    answer:
      gradingMode: selfCheck
      expected: 'At $x=5$, $AC=2(5)+3=13$ and $DF=5(5)-12=13$, so the corresponding lengths agree and are positive. Together with the other two marked side pairs, SSS gives $\triangle ABC\cong\triangle DEF$. Therefore every remaining corresponding side and angle pair is congruent by corresponding parts of congruent triangles.'
      keyPoints:
      - Substitutes $x=5$ into both side expressions.
      - Obtains the same positive length, 13.
      - Cites SSS before transferring other corresponding parts.
    explanation: The numerical solution is not complete until it respects both the original equations and the geometric correspondence.
- id: aops-triangles-cs-problem-2
  title: A parallel segment creates scale and area ratios
  problem: |
    In $\triangle ABC$, points $D$ and $E$ lie on $AB$ and $AC$, and $DE\parallel BC$. Suppose $AD=6$, $AB=15$, and $DE=8$. Find $BC$ and the area ratio $[ADE]:[ABC]$.
  steps:
  - id: aops-triangles-cs-p2-s1
    title: Identify the nested triangles
    instruction: Record the shared vertex and the two angle pairs created by parallelism.
    type: multipleChoice
    prompt: Which triangles should be compared?
    media:
    - type: image
      src: /assessments/aops/aops-triangles-similarity.svg
      alt: Triangle ABC with D on AB, E on AC, and DE parallel to BC, creating nested triangle ADE.
      caption: Parallel arrows and matching angle arcs identify the AA relationship.
    choices:
    - {id: a, text: '$\triangle ADE$ and $\triangle ABC$'}
    - {id: b, text: '$\triangle ADB$ and $\triangle AEC$'}
    - {id: c, text: '$\triangle BDE$ and $\triangle CDE$'}
    - {id: d, text: '$\triangle ABD$ and $\triangle ACE$'}
    answer: {choiceId: a}
    explanation: The parallel cross-section forms the smaller triangle ADE inside the original triangle ABC.
  - id: aops-triangles-cs-p2-s2
    title: Prove similarity before using ratios
    instruction: Use corresponding angles from $DE\parallel BC$ plus the shared angle at $A$.
    type: multipleChoice
    prompt: What is the shortest valid justification for $\triangle ADE\sim\triangle ABC$?
    choices:
    - {id: a, text: AA similarity}
    - {id: b, text: SSS congruence}
    - {id: c, text: The smaller triangle looks like the larger one.}
    - {id: d, text: Both triangles contain segment $DE$.}
    answer: {choiceId: a}
    explanation: Parallel lines give matching angles at D/B and E/C; two angle pairs establish AA similarity.
  - id: aops-triangles-cs-p2-s3
    title: Build one consistent linear ratio
    instruction: Keep every fraction in the small-to-large direction.
    type: multipleChoice
    prompt: Which proportion correctly connects the known lengths to $BC$?
    choices:
    - {id: a, text: '$\frac{AD}{AB}=\frac{DE}{BC}$'}
    - {id: b, text: '$\frac{AD}{AB}=\frac{BC}{DE}$'}
    - {id: c, text: '$\frac{AD}{DE}=\frac{AB}{BC}$ only if the triangles are congruent.'}
    - {id: d, text: '$AD+AB=DE+BC$'}
    answer: {choiceId: a}
    explanation: $AD$ corresponds to $AB$ and $DE$ corresponds to $BC$, with both ratios written small-to-large.
  - id: aops-triangles-cs-p2-s4
    title: Solve the length scale
    instruction: Simplify $AD/AB$ first, then apply the same factor to the bases.
    type: multipleChoice
    prompt: What is $BC$?
    choices:
    - {id: a, text: '$\frac{16}{5}$'}
    - {id: b, text: '$12$'}
    - {id: c, text: '$20$'}
    - {id: d, text: '$32$'}
    answer: {choiceId: c}
    explanation: 'The small-to-large factor is $6/15=2/5$, so $8/BC=2/5$ and $BC=20$.'
  - id: aops-triangles-cs-p2-s5
    title: Square the scale for area and check direction
    instruction: Convert the linear ratio to an area ratio, then verify that the nested triangle has the smaller area.
    type: freeResponse
    prompt: Find $[ADE]:[ABC]$ and explain why using $2:5$ directly would be wrong.
    answer:
      gradingMode: selfCheck
      expected: 'The small-to-large linear ratio is $AD:AB=2:5$. Areas scale as the square of a linear factor, so $[ADE]:[ABC]=2^2:5^2=4:25$. The ratio $2:5$ applies to lengths and perimeters, not two-dimensional area. The result $4/25<1$ is consistent with triangle ADE lying inside triangle ABC.'
      keyPoints:
      - Identifies the linear ratio $2:5$.
      - Squares both terms to obtain $4:25$.
      - Explains the dimensional reason for squaring.
      - Checks that the inner triangle has smaller area.
    explanation: Similarity separates linear scaling from area scaling; the latter uses the square of the factor.
- id: aops-triangles-cs-problem-3
  title: Recover a right triangle from its hypotenuse segments
  problem: |
    In right $\triangle ABC$, altitude $CD$ meets hypotenuse $AB$ at $D$. Suppose $AD=4$ and $DB=9$. Find the hypotenuse, altitude, both legs, and area. Verify the result in two independent ways.
  steps:
  - id: aops-triangles-cs-p3-s1
    title: Parse the right-triangle structure
    instruction: Distinguish the whole hypotenuse from its two pieces and retain both right-angle hypotheses.
    type: multipleChoice
    prompt: What is the whole hypotenuse $AB$?
    media:
    - type: image
      src: /assessments/aops/aops-triangles-altitude-hypotenuse.svg
      alt: Right triangle ABC with altitude CD perpendicular to hypotenuse AB, dividing AB into segments p and q.
      caption: Here $p=AD=4$, $q=DB=9$, and $AB=p+q$.
    choices:
    - {id: a, text: '$5$'}
    - {id: b, text: '$6$'}
    - {id: c, text: '$13$'}
    - {id: d, text: '$36$'}
    answer: {choiceId: c}
    explanation: The adjacent hypotenuse pieces add, so $AB=AD+DB=4+9=13$.
  - id: aops-triangles-cs-p3-s2
    title: Justify the geometric means
    instruction: Identify why the small triangles inherit two matching angles from the original.
    type: multipleChoice
    prompt: Why are the two small triangles and the original triangle similar?
    choices:
    - {id: a, text: Each has a right angle and shares one acute angle with the original, so AA applies.}
    - {id: b, text: They all have perimeter 13.}
    - {id: c, text: Every triangle containing an altitude is congruent to the original.}
    - {id: d, text: Their areas are visibly equal.}
    answer: {choiceId: a}
    explanation: The perpendicular altitude creates right angles, and each small triangle shares an acute angle with the original.
  - id: aops-triangles-cs-p3-s3
    title: Compute the altitude
    instruction: Apply $CD^2=AD\cdot DB$ and choose the positive root because a length is positive.
    type: multipleChoice
    prompt: What is $CD$?
    choices:
    - {id: a, text: '$\sqrt{13}$'}
    - {id: b, text: '$6$'}
    - {id: c, text: '$13$'}
    - {id: d, text: '$36$'}
    answer: {choiceId: b}
    explanation: $CD^2=4\cdot9=36$, so $CD=6$.
  - id: aops-triangles-cs-p3-s4
    title: Pair each leg with its adjacent projection
    instruction: Use $AC^2=AB\cdot AD$ and $BC^2=AB\cdot DB$; do not swap the projection segments.
    type: multipleChoice
    prompt: Which pair of leg lengths is correct?
    choices:
    - {id: a, text: '$AC=2\sqrt{13}$ and $BC=3\sqrt{13}$'}
    - {id: b, text: '$AC=4\sqrt{13}$ and $BC=9\sqrt{13}$'}
    - {id: c, text: '$AC=6$ and $BC=13$'}
    - {id: d, text: '$AC=\sqrt{4}$ and $BC=\sqrt{9}$'}
    answer: {choiceId: a}
    explanation: $AC^2=13\cdot4=52$ and $BC^2=13\cdot9=117$, giving $2\sqrt{13}$ and $3\sqrt{13}$.
  - id: aops-triangles-cs-p3-s5
    title: Verify by Pythagoras and by two area formulas
    instruction: Check the legs against the hypotenuse, then compute area using both the altitude to $AB$ and the perpendicular legs.
    type: freeResponse
    prompt: Complete both verifications and state the area.
    answer:
      gradingMode: selfCheck
      expected: 'Pythagoras gives $(2\sqrt{13})^2+(3\sqrt{13})^2=52+117=169=13^2$, confirming the hypotenuse. Using base $AB=13$ and altitude $CD=6$ gives area $\tfrac12(13)(6)=39$. Using the perpendicular legs gives $\tfrac12(2\sqrt{13})(3\sqrt{13})=\tfrac12(6)(13)=39$. Both methods agree.'
      keyPoints:
      - Verifies that the squared legs sum to $169$.
      - Computes area as $39$ from hypotenuse and altitude.
      - Computes the same area from the two legs.
      - Notes agreement of the independent checks.
    explanation: The Pythagorean and area checks test both the derived lengths and the correspondence used to obtain them.
