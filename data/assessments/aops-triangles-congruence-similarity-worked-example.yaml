workedExamples:
- id: aops-triangles-cs-we-1
  title: SSS correspondence before algebra
  steps:
  - id: aops-triangles-cs-we-1-s1
    title: Establish the congruence from tick marks and name the theorem
    prompt: Read the tick marks to identify the correspondence, state the congruence in correct vertex
      order, and name the theorem that makes it rigorous.
    difficultyDimensions:
    - 'Map vertices: single-tick pairs force $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow
      F$.'
    - Write the ordered statement $\triangle ABC \cong \triangle DEF$.
    - Identify SSS as the justifying theorem.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The tick marks force the correspondence $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow
        F$.
      - $\triangle ABC \cong \triangle DEF$ by SSS congruence.
    explanation: 'Solution:

      Each pair of tick marks identifies a pair of equal corresponding sides: $AB = DE$, $AC = DF$, $BC
      = EF$. Reading the correspondence from the tick patterns: vertex $A$ maps to $D$, $B$ to $E$, $C$
      to $F$. Therefore:

      $$\triangle ABC \cong \triangle DEF$$

      The justifying theorem is **SSS (Side-Side-Side) Congruence**: if three sides of one triangle are
      respectively equal to three sides of another, the triangles are congruent and their shape and size
      are completely determined.


      Why it works:

      The order of the vertices in the congruence statement is critical — it encodes which parts correspond.
      $\triangle ABC \cong \triangle DEF$ asserts $\angle A = \angle D$, $\angle B = \angle E$, $\angle
      C = \angle F$ in addition to all three side pairs. Writing $\triangle ABC \cong \triangle DFE$ would
      assert different (and incorrect) angle correspondences.

      '
    instruction: 'Work through this step: Read the tick marks to identify the correspondence, state the
      congruence in correct vertex order, and name the theorem that makes it rigorous.'
    type: freeResponse
  - id: aops-triangles-cs-we-1-s2
    title: Set up and solve the algebraic equation
    prompt: Use the congruence to write an equation for the corresponding sides $AC$ and $DF$, then solve
      for $x$.
    difficultyDimensions:
    - Set $AC = DF$ based on the correspondence proven in step 1.
    - Write $2x + 3 = 5x - 12$ and solve.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $2x + 3 = 5x - 12$
      - $15 = 3x$, so $x = 5$.
    explanation: 'Solution:

      Since $\triangle ABC \cong \triangle DEF$, corresponding sides $AC$ and $DF$ are equal:

      $$2x + 3 = 5x - 12$$

      $$3 + 12 = 5x - 2x$$

      $$15 = 3x$$

      $$x = 5$$


      Why it works:

      The equation is licensed directly by the correspondence — we can only equate $AC$ with $DF$ (not
      with $EF$ or $DE$) because the congruence statement established exactly which sides match. Using
      the wrong pair of sides would produce a meaningless equation.

      '
    instruction: 'Work through this step: Use the congruence to write an equation for the corresponding
      sides $AC$ and $DF$, then solve for $x$.'
    type: freeResponse
  - id: aops-triangles-cs-we-1-s3
    title: Verify the common length and apply CPCTC
    prompt: Substitute $x = 5$ into both expressions, confirm they agree and are positive, then state
      what follows from CPCTC.
    difficultyDimensions:
    - Substitute $x = 5$ into $2x + 3$ and $5x - 12$.
    - Confirm both give the same positive length.
    - State that all remaining corresponding parts are equal by CPCTC.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AC = 2(5) + 3 = 13$ and $DF = 5(5) - 12 = 13$. They agree. ✓
      - Since $13 > 0$, the common length is geometrically valid.
      - 'By CPCTC: $\angle A = \angle D$, $\angle B = \angle E$, $\angle C = \angle F$.'
    explanation: 'Solution:

      Substituting $x = 5$:

      $$AC = 2(5) + 3 = 13, \quad DF = 5(5) - 12 = 13$$

      Both expressions give 13, confirming the algebra is consistent. Since $13 > 0$, the common length
      is a valid side length.

      By **CPCTC** (Corresponding Parts of Congruent Triangles are Congruent), every remaining corresponding
      element is also equal: $\angle A = \angle D$, $\angle B = \angle E$, $\angle C = \angle F$.


      Why it works:

      Solving for $x$ is only half the job. If both expressions had given a negative number, the algebraic
      solution would be geometrically invalid even though the equation was solved correctly. The verification
      step catches this.

      '
    instruction: 'Work through this step: Substitute $x = 5$ into both expressions, confirm they agree
      and are positive, then state what follows from CPCTC.'
    type: freeResponse
  problem: 'The diagram marks $AB=DE$, $AC=DF$, and $BC=EF$. In addition, $AC=2x+3$ and $DF=5x-12$. Prove
    the relevant triangles congruent, find $x$, and verify the resulting side length is positive.

    '
- id: aops-triangles-cs-we-2
  title: A parallel segment creates scale and area ratios
  steps:
  - id: aops-triangles-cs-we-2-s1
    title: Prove similarity and find the linear ratio
    prompt: Justify why $\triangle ADE \sim \triangle ABC$, then determine the small-to-large linear scale
      factor.
    difficultyDimensions:
    - Identify the shared angle at $A$ and corresponding angles from $DE \parallel BC$.
    - State AA similarity.
    - Compute the linear ratio $k = AD/AB$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\angle A$ is shared. Since $DE \parallel BC$, the corresponding angles $\angle ADE = \angle ABC$
        and $\angle AED = \angle ACB$.
      - $\triangle ADE \sim \triangle ABC$ by AA similarity.
      - Linear ratio $k = AD/AB = 6/15 = 2/5$.
    explanation: 'Solution:

      Both triangles share $\angle A$. Because $DE \parallel BC$, a transversal (side $AB$) cuts the parallel
      lines forming equal corresponding angles: $\angle ADE = \angle ABC$. Two matching angle pairs satisfy
      **AA (Angle-Angle) Similarity**, so $\triangle ADE \sim \triangle ABC$.

      The linear scale factor (small to large) is:

      $$k = \frac{AD}{AB} = \frac{6}{15} = \frac{2}{5}$$


      Why it works:

      Similarity must be *proved* before any proportion is written. Using ratios without this proof would
      be circular (the proportions only hold *because* the triangles are similar). AA is the minimum sufficient
      condition — two angle pairs guarantee all three pairs match since the angles of a triangle sum to
      $180°$.

      '
    instruction: 'Work through this step: Justify why $\triangle ADE \sim \triangle ABC$, then determine
      the small-to-large linear scale factor.'
    type: freeResponse
  - id: aops-triangles-cs-we-2-s2
    title: Compute BC from the proportion
    prompt: Use the linear scale factor $k = 2/5$ and the known $DE = 8$ to find $BC$.
    difficultyDimensions:
    - Write the proportion $DE/BC = k = 2/5$.
    - Cross-multiply and solve for $BC$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\frac{DE}{BC} = \frac{2}{5}$, so $\frac{8}{BC} = \frac{2}{5}$.
      - $BC = 8 \times \frac{5}{2} = 20$.
    explanation: 'Solution:

      Since $DE$ corresponds to $BC$ in the similar triangle pair, and the linear ratio is $2:5$:

      $$\frac{DE}{BC} = \frac{2}{5}$$

      $$\frac{8}{BC} = \frac{2}{5}$$

      $$BC = 8 \cdot \frac{5}{2} = 20$$


      Why it works:

      All corresponding lengths in similar triangles share the same scale factor $k$. The same factor
      that applies to $AD:AB = 6:15 = 2:5$ also applies to $DE:BC = 8:20 = 2:5$.

      '
    instruction: 'Work through this step: Use the linear scale factor $k = 2/5$ and the known $DE = 8$
      to find $BC$.'
    type: freeResponse
  - id: aops-triangles-cs-we-2-s3
    title: Derive the area ratio
    prompt: Find $[ADE]:[ABC]$ and explain why the linear ratio $2:5$ cannot be applied directly to areas.
    difficultyDimensions:
    - Square the linear ratio to get the area ratio.
    - Compute $k^2 = (2/5)^2 = 4/25$.
    - Explain the dimensional reason for squaring.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Area ratio $= k^2 = (2/5)^2 = 4/25$.
      - $[ADE]:[ABC] = 4:25$.
      - Area is 2D, so both base and height scale by $k$; area scales by $k \cdot k = k^2$.
    explanation: 'Solution:

      The linear ratio is $k = 2/5$. Since area depends on two dimensions (base $\times$ height), both
      scale by $k$ simultaneously:

      $$\frac{[ADE]}{[ABC]} = k^2 = \left(\frac{2}{5}\right)^2 = \frac{4}{25}$$

      The ratio of areas is $[ADE]:[ABC] = 4:25$.


      Why it works:

      Using the linear ratio $2:5$ directly would give $[ADE]:[ABC] = 2:5$, which is wrong. Area is two-dimensional:
      if you scale both the base and height by $2/5$, the resulting area is $(2/5) \times (2/5) = 4/25$
      of the original. Since $4/25 < 1$, this correctly confirms the inner triangle is smaller than the
      outer triangle.

      '
    instruction: 'Work through this step: Find $[ADE]:[ABC]$ and explain why the linear ratio $2:5$ cannot
      be applied directly to areas.'
    type: freeResponse
  problem: 'In $\triangle ABC$, points $D$ and $E$ lie on $AB$ and $AC$, and $DE \parallel BC$. Given
    $AD = 6$, $AB = 15$, and $DE = 8$, find $BC$ and the ratio of areas $[ADE]:[ABC]$.

    '
- id: aops-triangles-cs-we-3
  title: Recover a right triangle from its hypotenuse segments
  steps:
  - id: aops-triangles-cs-we-3-s1
    title: Find AB and justify the geometric mean relations
    prompt: Compute the full hypotenuse $AB$, then explain why the three triangles ($\triangle ABC$, $\triangle
      ACD$, $\triangle CBD$) are mutually similar.
    difficultyDimensions:
    - 'Add the hypotenuse segments: $AB = AD + DB$.'
    - State that the altitude creates two right angles, giving two new right triangles.
    - Each small triangle shares one acute angle with the original via AA.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AB = 4 + 9 = 13$.
      - $\triangle ACD$ has a right angle at $D$ and shares $\angle A$ with $\triangle ABC$.
      - $\triangle CBD$ has a right angle at $D$ and shares $\angle B$ with $\triangle ABC$.
      - 'By AA: $\triangle ACD \sim \triangle ABC \sim \triangle CBD$.'
    explanation: 'Solution:

      The two hypotenuse segments are adjacent, so $AB = AD + DB = 4 + 9 = 13$.

      The altitude $CD$ is perpendicular to $AB$, creating right angles at $D$ in both $\triangle ACD$
      and $\triangle CBD$. Each small triangle has a right angle ($\angle CDA = \angle CDB = 90°$) and
      shares one acute angle with the original right triangle:

      - $\triangle ACD$ shares $\angle A$ with $\triangle ABC$.

      - $\triangle CBD$ shares $\angle B$ with $\triangle ABC$.

      By **AA similarity**, all three triangles are mutually similar.


      Why it works:

      This similarity chain is the engine behind all the geometric mean relations. Because the triangles
      are similar, corresponding side ratios are equal — and those ratios produce the elegant altitude,
      leg, and projection formulas.

      '
    instruction: 'Work through this step: Compute the full hypotenuse $AB$, then explain why the three
      triangles ($\triangle ABC$, $\triangle ACD$, $\triangle CBD$) are mutually similar.'
    type: freeResponse
  - id: aops-triangles-cs-we-3-s2
    title: Compute the altitude and both legs using geometric means
    prompt: Apply $CD^2 = AD \cdot DB$, $AC^2 = AB \cdot AD$, and $BC^2 = AB \cdot DB$ to find all three
      values.
    difficultyDimensions:
    - 'Altitude: $CD^2 = AD \cdot DB = 4 \cdot 9$.'
    - 'Leg $AC$: $AC^2 = AB \cdot AD = 13 \cdot 4$.'
    - 'Leg $BC$: $BC^2 = AB \cdot DB = 13 \cdot 9$.'
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $CD^2 = 36$, so $CD = 6$.
      - $AC^2 = 52$, so $AC = 2\sqrt{13}$.
      - $BC^2 = 117$, so $BC = 3\sqrt{13}$.
    explanation: 'Solution:

      From the similar triangle proportions:

      **Altitude** (geometric mean of the two segments):

      $$CD^2 = AD \cdot DB = 4 \cdot 9 = 36 \implies CD = 6$$

      **Leg $AC$** (geometric mean of the hypotenuse and the near projection $AD$):

      $$AC^2 = AB \cdot AD = 13 \cdot 4 = 52 \implies AC = \sqrt{52} = 2\sqrt{13}$$

      **Leg $BC$** (geometric mean of the hypotenuse and the near projection $DB$):

      $$BC^2 = AB \cdot DB = 13 \cdot 9 = 117 \implies BC = \sqrt{117} = 3\sqrt{13}$$


      Why it works:

      These three formulas all arise from the same proportionality. For example, the altitude formula
      comes from $\frac{CD}{AD} = \frac{DB}{CD}$ (the altitude is the geometric mean of the two segments
      it creates). Never swap $AD$ and $DB$ in the leg formulas: $AC$ pairs with $AD$ (the projection
      of $AC$ onto $AB$), and $BC$ pairs with $DB$.

      '
    instruction: 'Work through this step: Apply $CD^2 = AD \cdot DB$, $AC^2 = AB \cdot AD$, and $BC^2
      = AB \cdot DB$ to find all three values.'
    type: freeResponse
  - id: aops-triangles-cs-we-3-s3
    title: Verify with Pythagoras and two area formulas
    prompt: Confirm the legs and altitude using the Pythagorean theorem and then compute the area two
      ways.
    difficultyDimensions:
    - 'Verify: $AC^2 + BC^2 = 52 + 117 = 169 = 13^2$.'
    - 'Area method 1: $\frac{1}{2} \cdot AB \cdot CD = \frac{1}{2}(13)(6)$.'
    - 'Area method 2: $\frac{1}{2} \cdot AC \cdot BC = \frac{1}{2}(2\sqrt{13})(3\sqrt{13})$.'
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AC^2 + BC^2 = 52 + 117 = 169 = 13^2$ ✓ (Pythagoras confirms the hypotenuse).
      - 'Area method 1: $\frac{1}{2}(13)(6) = 39$.'
      - 'Area method 2: $\frac{1}{2}(2\sqrt{13})(3\sqrt{13}) = \frac{1}{2}(6)(13) = 39$ ✓.'
    explanation: 'Solution:

      **Pythagorean verification:**

      $$AC^2 + BC^2 = 52 + 117 = 169 = 13^2 \checkmark$$

      **Area (base $AB$ and altitude $CD$):**

      $$[\triangle ABC] = \tfrac{1}{2}(13)(6) = 39$$

      **Area (legs $AC$ and $BC$):**

      $$[\triangle ABC] = \tfrac{1}{2}(2\sqrt{13})(3\sqrt{13}) = \tfrac{1}{2}(6)(13) = 39 \checkmark$$

      Both area methods agree at 39 square units.


      Why it works:

      Three independent checks (Pythagorean theorem plus two distinct area formulas) all must produce
      consistent results. If any one check fails, it pinpoints which step introduced an error — far more
      diagnostic than a single verification.

      '
    instruction: 'Work through this step: Confirm the legs and altitude using the Pythagorean theorem
      and then compute the area two ways.'
    type: freeResponse
  problem: 'In right $\triangle ABC$, altitude $CD$ meets hypotenuse $AB$ at $D$. Given $AD = 4$ and $DB
    = 9$, find the altitude $CD$, both legs $AC$ and $BC$, and verify using Pythagoras and two area formulas.

    '
- id: aops-triangles-cs-we-4
  title: Indirect scale factor and cascaded area ratios
  steps:
  - id: aops-triangles-cs-we-4-s1
    title: Find the area of triangle PST using the parallel-line scale factor
    prompt: Use $ST \parallel QR$ and the given lengths to find the linear ratio of $\triangle PST$ to
      $\triangle PQR$, then compute $[\triangle PST]$.
    difficultyDimensions:
    - Linear ratio $k_1 = PS/PQ = 4/10 = 2/5$.
    - Area ratio $= k_1^2 = 4/25$.
    - $[\triangle PST] = 50 \times (4/25)$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $k_1 = PS/PQ = 4/10 = 2/5$.
      - $[\triangle PST] = 50 \times (4/25) = 8$.
    explanation: 'Solution:

      Because $ST \parallel QR$, triangle $PST$ is similar to triangle $PQR$ by the same AA argument as
      the previous problem. The linear scale factor is:

      $$k_1 = \frac{PS}{PQ} = \frac{4}{10} = \frac{2}{5}$$

      The area of the smaller triangle scales by $k_1^2$:

      $$[\triangle PST] = 50 \times \left(\frac{2}{5}\right)^2 = 50 \times \frac{4}{25} = 8$$


      Why it works:

      This is a direct application of the area-ratio rule. We never need to find the actual dimensions
      of either triangle — just the ratio is sufficient.

      '
    instruction: 'Work through this step: Use $ST \parallel QR$ and the given lengths to find the linear
      ratio of $\triangle PST$ to $\triangle PQR$, then compute $[\triangle PST]$.'
    type: freeResponse
  - id: aops-triangles-cs-we-4-s2
    title: Find the linear and area scale factors for the third triangle
    prompt: The third triangle has perimeter $3:2$ relative to $\triangle PQR$. Determine its linear scale
      factor relative to $\triangle PQR$ and then its area ratio.
    difficultyDimensions:
    - Perimeter scales linearly, so the linear ratio is $3:2$ (third to original).
    - Area ratio $= (3/2)^2 = 9/4$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Perimeter ratio $= 3:2$, so linear ratio $k_2 = 3/2$.
      - Area ratio of third to $\triangle PQR$ $= k_2^2 = 9/4$.
    explanation: 'Solution:

      Perimeter is a one-dimensional measurement (a sum of lengths), so it scales by the same factor as
      all other linear measurements. If the third triangle''s perimeter is $3/2$ of $\triangle PQR$''s
      perimeter, then every corresponding side of the third triangle is $3/2$ times the corresponding
      side of $\triangle PQR$.

      The linear scale factor is $k_2 = 3/2$, giving an area ratio of:

      $$k_2^2 = \left(\frac{3}{2}\right)^2 = \frac{9}{4}$$


      Why it works:

      Any linear measurement of a similar figure — side length, perimeter, altitude, or inradius — all
      share the same scale factor $k$. Only area uses $k^2$ and volume uses $k^3$.

      '
    instruction: 'Work through this step: The third triangle has perimeter $3:2$ relative to $\triangle
      PQR$. Determine its linear scale factor relative to $\triangle PQR$ and then its area ratio.'
    type: freeResponse
  - id: aops-triangles-cs-we-4-s3
    title: Compute the area of the third triangle
    prompt: Apply the area ratio to $[\triangle PQR] = 50$ to find the area of the third triangle.
    difficultyDimensions:
    - Multiply $[\triangle PQR]$ by the area ratio $9/4$.
    - Calculate $50 \times 9/4$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Area of third triangle $= 50 \times \frac{9}{4} = \frac{450}{4} = 112.5$.
    explanation: 'Solution:

      The area of the third triangle is $9/4$ times the area of $\triangle PQR$:

      $$\text{Area}_3 = 50 \times \frac{9}{4} = \frac{450}{4} = 112.5 \text{ square units}$$


      Why it works:

      The cascade of two similarity relationships ($PST \to PQR \to \text{third triangle}$) demonstrates
      that similar figure problems often require tracking scale factors across multiple layers. The key
      is to always identify clearly *which* two triangles you are comparing at each step and apply the
      corresponding $k^2$ rule.

      '
    instruction: 'Work through this step: Apply the area ratio to $[\triangle PQR] = 50$ to find the area
      of the third triangle.'
    type: freeResponse
  problem: 'Triangle $PQR$ has area 50. Segment $ST$ is drawn parallel to $QR$ with $PS = 4$ and $PQ =
    10$. A third triangle is drawn similar to $\triangle PQR$ with a perimeter $3:2$ larger than $\triangle
    PQR$ itself. Find the area of the third triangle.

    '
