- id: q001
  type: freeResponse
  skills:
  - rational-integration
  - olympiad-problem-solving
  prompt: Evaluate $\int \frac{dx}{x^2-9}$.
  answer:
    gradingMode: selfCheck
    expected: $\frac1{6}\ln\left|\frac{x-3}{x+3}\right|+C$.
    keyPoints:
    - 'Matches the reference result: $\frac1{6}\ln\left|\frac{x-3}{x+3}\right|+C$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: 'Factor $x^2-9=(x-3)(x+3)$ and use partial fractions: $1/(x^2-9)=[1/(23)][1/(x-3)-1/(x+3)]$.'
