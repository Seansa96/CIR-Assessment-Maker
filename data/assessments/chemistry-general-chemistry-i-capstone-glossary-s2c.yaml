glossary:
  introduction: 'These terms name the reasoning moves that recur across General Chemistry I.'
  sections:
    - id: quantitative-language
      title: Quantitative language
      entries:
        - id: limiting-reactant
          term: limiting reactant
          definition: 'The reactant that produces the smallest possible amount of product after stoichiometric comparison.'
          drills:
            - { id: limiting-reactant-drill, type: flashcard, prompt: 'What does the limiting reactant determine?', answer: { expected: 'the maximum amount of product', aliases: ['maximum product amount', 'theoretical yield'] }, explanation: 'Solution: The maximum amount of product. Why it works: Once that reactant is consumed, the reaction cannot make more product.' }
        - id: spectator-ion
          term: spectator ion
          definition: 'An ion present in the same form before and after an aqueous reaction.'
          drills:
            - { id: spectator-ion-drill, type: flashcard, prompt: 'What should happen to spectator ions when writing a net ionic equation?', answer: { expected: 'cancel them', aliases: ['they cancel', 'remove them'] }, explanation: 'Solution: Cancel them. Why it works: A net ionic equation records only species that undergo chemical change.' }
        - id: standard-enthalpy-formation
          term: standard enthalpy of formation
          definition: 'The enthalpy change for forming one mole of a compound from its elements in their standard states.'
          drills:
            - { id: formation-drill, type: flashcard, prompt: 'What is the standard formation enthalpy of an element in its standard state?', answer: { expected: 'zero', aliases: ['0', '0 kJ/mol'] }, explanation: 'Solution: Zero. Why it works: Standard formation enthalpies use those elemental reference states as the zero baseline.' }
        - id: molecular-polarity
          term: molecular polarity
          definition: 'The overall dipole of a molecule after its bond dipoles are combined using molecular geometry.'
          drills:
            - { id: polarity-drill, type: flashcard, prompt: 'Can polar bonds make a nonpolar molecule?', answer: { expected: 'yes', aliases: ['yes if the dipoles cancel'] }, explanation: 'Solution: Yes. Why it works: A symmetric geometry can make equal bond dipoles cancel as vectors.' }
