lesson:
  introduction: |-
    In the previous lesson, we learned the SSS and SAS congruence postulates. Now, we will explore three more shortcuts to proving triangles are congruent: ASA, AAS, and HL.
  sections:
  - id: sec-asa-aas
    title: ASA and AAS Congruence
    required: true
    content: |-
      **ASA (Angle-Side-Angle) Congruence Postulate**:
      If two angles and the **included side** (the side directly between the two angles) of one triangle are congruent to two angles and the included side of another triangle, then the two triangles are congruent.
      
      **AAS (Angle-Angle-Side) Congruence Theorem**:
      If two angles and a **non-included side** of one triangle are congruent to two angles and the corresponding non-included side of another triangle, then the two triangles are congruent.
      
      *Why does AAS work?* Because if you know two angles of a triangle, the Triangle Angle Sum Theorem ($180^\circ$) means you automatically know the third angle! So AAS is effectively the same as ASA.

  - id: sec-hl
    title: HL Congruence for Right Triangles
    required: true
    content: |-
      Earlier we learned that SSA (Side-Side-Angle) does NOT work to prove triangles are congruent. However, there is one special exception: when the angle is a **right angle**.
      
      **HL (Hypotenuse-Leg) Congruence Theorem**:
      If the hypotenuse and one leg of a **right triangle** are congruent to the hypotenuse and one leg of another right triangle, then the two triangles are congruent.
      
      Remember, this ONLY applies to right triangles. The hypotenuse is the longest side, directly opposite the $90^\circ$ angle.

questions:
- id: q-geom-cong2-1
  title: Concept Check - Identifying the Congruence Theorem
  prompt: |-
    You are given two right triangles. You know that their hypotenuses are equal in length, and one pair of legs are equal in length. What theorem proves they are congruent?
  type: multipleChoice
  choices:
  - id: c1
    text: SAS
  - id: c2
    text: SSS
  - id: c3
    text: HL
  - id: c4
    text: ASA
  answer:
    choiceId: c3
  explanation: |-
    Because they are right triangles and you know the Hypotenuse and a Leg are congruent, you use the **HL (Hypotenuse-Leg)** theorem.
  skills:
  - geometry-triangle-congruence

- id: q-geom-cong2-2
  title: Concept Check - The SSA Trap
  prompt: |-
    Can you prove two triangles are congruent using SSA (Side-Side-Angle) if the angle is $40^\circ$?
  type: multipleChoice
  choices:
  - id: c1
    text: Yes
  - id: c2
    text: No
  answer:
    choiceId: c2
  explanation: |-
    No. SSA is only a valid congruence theorem when the angle is a right angle ($90^\circ$), which is known as the HL Theorem. For any other angle, SSA can result in two completely different triangles (the "ambiguous case").
  skills:
  - geometry-triangle-congruence
