- id: q001
  type: numericResponse
  skills:
  - physics-standing-waves-resonance
  prompt: A seismic surface wave has a characteristic wavelength of 4.47 m and vibrates
    at 55.4 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 348.0885
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*55.4 = 348.0885 rad/s.
