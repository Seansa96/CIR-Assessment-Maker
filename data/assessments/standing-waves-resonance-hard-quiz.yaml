questions:
- id: q001
  type: numericResponse
  prompt: A string is fixed at both ends, has length 1.20 m, and wave speed 60 m/s. What is its third-harmonic frequency in Hz?
  answer: { value: 75, tolerance: 0.2 }
  explanation: |
    Solution: $f_1=v/(2L)=60/(2.4)=25$ Hz, so $f_3=3f_1=75$ Hz.

    Why it works: A fixed-fixed string supports integer harmonics whose frequencies are integer multiples of the fundamental.
  difficultyDimensions: [multiStep, modelOrDerivation, representationTransfer]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q002
  type: multipleChoice
  prompt: A fixed-end string mode has three antinodes. Which harmonic is it?
  choices:
  - { id: a, text: Third harmonic }
  - { id: b, text: Fundamental }
  - { id: c, text: Half harmonic }
  - { id: d, text: A mode with no resonance }
  answer: { choiceId: a }
  explanation: |
    Solution: Third harmonic.

    Why it works: For a string fixed at both ends, the harmonic number equals the number of antinodes.

    Why the other choices fail: The fundamental has one antinode, and valid fixed-end modes have integer rather than half harmonic numbers.
  difficultyDimensions: [representationTransfer, errorDiagnosis, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q003
  type: numericResponse
  prompt: A 0.80 m fixed-fixed string resonates in its fourth harmonic at 200 Hz. What wave speed in m/s does this imply?
  answer: { value: 80, tolerance: 0.3 }
  explanation: |
    Solution: $f_n=nv/(2L)$, so $v=2Lf_n/n=2(0.80)(200)/4=80$ m/s.

    Why it works: The observed harmonic number fixes the number of half wavelengths that fit in the string, allowing wave speed to be inferred.
  difficultyDimensions: [reverseReasoning, multiStep, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q004
  type: multipleChoice
  prompt: A driver has a fixed frequency. Which adjustment can move a stretched string toward resonance with that driver?
  choices:
  - { id: a, text: Change the tension to change the string wave speed and normal-mode frequencies. }
  - { id: b, text: Make every point of the string a node. }
  - { id: c, text: Remove all restoring force from the string. }
  - { id: d, text: Treat the standing wave as a single traveling pulse. }
  answer: { choiceId: a }
  explanation: |
    Solution: Change the tension to change the string wave speed and normal-mode frequencies.

    Why it works: Tension changes wave speed, which changes the frequencies allowed by the boundary conditions.

    Why the other choices fail: Nodes and restoring force are not adjustable resonance mechanisms, and a standing mode is not a single pulse.
  difficultyDimensions: [causalReasoning, modelCombination, errorDiagnosis]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
