guidedProject:
  language: cpp
  instructions: "Build a `CombatResolver` class that uses switch expressions and a\
    \ while loop.\n\nRequired project behavior:\n- In `Combat.cs`, create a public\
    \ class `CombatResolver`.\n- Create a public method `ResolveTurn(string action)`\
    \ that returns an `int`.\n  - Use a C# 8+ switch expression!\n  - If `\"attack\"\
    `, return 20.\n  - If `\"heavy_attack\"`, return 40.\n  - If `\"defend\"`, return\
    \ 0.\n  - For anything else (the default `_`), return 0.\n- Create a public method\
    \ `RunBattle(int enemyHp)`.\n  - Use a `while` loop that continues as long as\
    \ `enemyHp > 0`.\n  - Inside the loop, subtract 20 from `enemyHp` on each iteration\
    \ (simulating a basic attack).\n  - Keep track of the number of turns it took\
    \ to kill the enemy.\n  - Return the total number of turns (an `int`) once the\
    \ loop finishes.\n"
  requiredChecks:
  - id: compile-check
    title: Compile
    description: Compiles correctly.
    expectedOutputContains:
    - OK
