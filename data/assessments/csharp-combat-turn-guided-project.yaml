            {
                // TODO: Loop until enemyHp <= 0, return turn count
                return 0;
            }
        }
    - path: Program.cs
      readOnly: true
      content: |
        using System;

        public class Program
        {
            public static void Main()
            {
                var combat = new CombatResolver();
                
                // Test ResolveTurn
                if (combat.ResolveTurn("attack") != 20) throw new Exception("attack should return 20");
                if (combat.ResolveTurn("heavy_attack") != 40) throw new Exception("heavy_attack should return 40");
                if (combat.ResolveTurn("defend") != 0) throw new Exception("defend should return 0");
                if (combat.ResolveTurn("dance") != 0) throw new Exception("unknown action should return 0");
                
                // Test RunBattle
                int turns = combat.RunBattle(50); // 50 -> 30 -> 10 -> -10 (3 turns)
                if (turns != 3) throw new Exception($"50 HP should take 3 turns, but took {turns}");
                
                int turns2 = combat.RunBattle(20); // 20 -> 0 (1 turn)
                if (turns2 != 1) throw new Exception($"20 HP should take 1 turn, but took {turns2}");

                Console.WriteLine("All tests passed!");
            }
        }


