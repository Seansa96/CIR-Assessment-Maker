id: csharp-combat-turn-guided-project
title: C# Combat Turn Guided Project
assessmentType: guidedProject
categoryId: csharp
subcategoryId: csharp-control-flow
subcategoryIds:
  - csharp-control-flow
modeDefault: practice
randomizeQuestions: false
guidedProject:
  language: cpp
  instructions: |
    Build a `CombatResolver` class that uses switch expressions and a while loop.

    Required project behavior:
    - In `Combat.cs`, create a public class `CombatResolver`.
    - Create a public method `ResolveTurn(string action)` that returns an `int`.
      - Use a C# 8+ switch expression!
      - If `"attack"`, return 20.
      - If `"heavy_attack"`, return 40.
      - If `"defend"`, return 0.
      - For anything else (the default `_`), return 0.
    - Create a public method `RunBattle(int enemyHp)`.
      - Use a `while` loop that continues as long as `enemyHp > 0`.
      - Inside the loop, subtract 20 from `enemyHp` on each iteration (simulating a basic attack).
      - Keep track of the number of turns it took to kill the enemy.
      - Return the total number of turns (an `int`) once the loop finishes.

  requiredChecks:
    - id: compile-check
      title: Compile
      description: Compiles correctly.
      expectedOutputContains:
        - 'OK'

  files:
