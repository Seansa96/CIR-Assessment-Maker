    readOnly: true
    content: "using System;\n\npublic class Program\n{\n    public static void Main()\n\
      \    {\n        var combat = new CombatResolver();\n        \n        // Test\
      \ ResolveTurn\n        if (combat.ResolveTurn(\"attack\") != 20) throw new Exception(\"\
      attack should return 20\");\n        if (combat.ResolveTurn(\"heavy_attack\"\
      ) != 40) throw new Exception(\"heavy_attack should return 40\");\n        if\
      \ (combat.ResolveTurn(\"defend\") != 0) throw new Exception(\"defend should\
