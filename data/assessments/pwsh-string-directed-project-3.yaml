schemaVersion: 1
id: pwsh-string-directed-project-3
title: "Dynamic String Builder"
assessmentType: directedProject
categoryId: scripting
subcategoryIds:
  - pwsh-string-basics
questionCount: 0
guidedProject: null
directedProject:
  summary: "Practice string interpolation, sub-expressions, and escape characters by building a formatted multi-line report on your local machine."
  estimatedTimeMinutes: 15
  resources: []
  phases:
    - id: phase-1-vars
      title: "Define Variables"
      steps:
        - id: step-1-vars
          title: "Setup your data"
          instruction: |
            1. Open PowerShell.
            2. Define two variables:
               `$User = "Admin"`
               `$Service = Get-Service -Name WinRM` (This grabs an actual service object).
          checklist:
            - id: chk-vars
              text: "Defined $User and $Service variables"
          resources: []
    - id: phase-2-build
      title: "Build the Report"
      steps:
        - id: step-2-interpolate
          title: "String Interpolation"
          instruction: |
            1. Create a multi-line string using double quotes, backticks (`` `n ``) for newlines, and sub-expressions `$()` to get the service status.
            2. Run the following command exactly:
               `$Report = "Report for: $User `nService Status: $($Service.Status) `nCost: `$0.00"`
            3. Output `$Report` to the console.
            4. Verify it correctly evaluates `$User`, evaluates the `.Status` property using `$()`, and prints a literal dollar sign for the cost.
          checklist:
            - id: chk-report
              text: "Used double quotes and sub-expressions successfully"
            - id: chk-escape
              text: "Used the backtick escape character successfully"
          resources: []
