glossary:
  sections:
  - id: ch1-terms
    title: Terms
    required: true
    entries:
    - id: current
      term: Current
      definition: The rate of charge flow, measured in amperes (A). $i = dq/dt$.
      drills:
      - id: current-drill
        prompt: What is the rate of charge flow?
        answer:
          expected: Current
        type: typed
    - id: voltage
      term: Voltage
      definition: The energy per unit charge created by the separation of positive
        and negative charges, measured in volts (V). $v = dw/dq$.
      drills:
      - id: voltage-drill
        prompt: What is the energy per unit charge?
        answer:
          expected: Voltage
        type: typed
    - id: power
      term: Power
      definition: The time rate of expending or absorbing energy, measured in watts
        (W). $p = dw/dt = vi$.
      drills:
      - id: power-drill
        prompt: What is the time rate of expending or absorbing energy?
        answer:
          expected: Power
        type: typed
    - id: ideal-basic-circuit-element
      term: Ideal Basic Circuit Element
      definition: A two-terminal component that cannot be subdivided into other elements,
        described completely by its voltage and current.
      drills:
      - id: ideal-basic-circuit-element-drill
        prompt: What is the two-terminal component that cannot be subdivided?
        answer:
          expected: Ideal Basic Circuit Element
        type: typed
    - id: passive-sign-convention
      term: Passive Sign Convention
      definition: A standard convention where power is calculated as $p = vi$ if the
        reference current enters the positive reference voltage terminal.
      drills:
      - id: passive-sign-convention-drill
        prompt: What is the convention where $p=vi$ if current enters the positive
          terminal?
        answer:
          expected: Passive Sign Convention
        type: typed
  introduction: Review these terms carefully.
