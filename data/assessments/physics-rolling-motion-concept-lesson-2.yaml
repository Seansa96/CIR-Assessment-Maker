lesson:
  introduction: Because a rolling object translates and rotates simultaneously, its kinetic energy has two parts, and its acceleration depends on its moment of inertia.
  sections:
  - id: sec-1
    title: Kinetic Energy of Rolling
    content: 'The total kinetic energy of a rolling object is the sum of the translational kinetic energy of its center of mass and the rotational kinetic energy about its center of mass:


      $$K_{total} = \frac{1}{2}mv_{cm}^2 + \frac{1}{2}I_{cm}\omega^2$$


      Because $v_{cm} = R\omega$, we can substitute $\omega = v_{cm}/R$ to express the total kinetic energy entirely in terms of $v_{cm}$. The distribution of mass (and thus $I_{cm}$) dictates how much of the total energy is "locked up" in rotation rather than translation.'
    media:
    - type: image
      src: /media/physics/owa/rolling-motion.svg
      alt: Wheel rolling without slipping, with center speed and angular speed labeled.
      caption: No-slip rolling links the center speed to angular speed through the radius.
    check:
      id: chk-rm-3
      type: multipleChoice
      prompt: A solid sphere ($I = \frac{2}{5}mR^2$) and a hollow spherical shell ($I = \frac{2}{3}mR^2$) of equal mass and radius roll down a ramp from the same height. Which reaches the bottom first?
      choices:
      - id: a
        text: The hollow shell.
      - id: b
        text: The solid sphere.
      - id: c
        text: They reach the bottom at the exact same time.
      - id: d
        text: It depends on their mass.
      answer:
        choiceId: b
      explanation: Both start with the same potential energy. The hollow shell has a larger moment of inertia, meaning a larger fraction of its energy is consumed by rotation. Thus, it has less translational kinetic energy, resulting in a lower $v_{cm}$, so the solid sphere reaches the bottom first.
  - id: sec-2
    title: Role of Friction in Rolling
    content: 'Without friction, a ball placed on a frictionless ramp would simply slide down without rotating. Static friction at the point of contact provides the torque necessary to cause angular acceleration ($\alpha$).


      Even though static friction acts on the rolling body, it does **no work** because the point of application (the contact point) is momentarily at rest. Mechanical energy is conserved in ideal rolling without slipping.'
    media: []
    check:
      id: chk-rm-4
      type: multipleChoice
      prompt: Why does static friction do zero work on a wheel that is rolling without slipping?
      choices:
      - id: a
        text: Because the friction force is perpendicular to the motion.
      - id: b
        text: Because static friction is a conservative force.
      - id: c
        text: Because the point of the wheel in contact with the ground has an instantaneous displacement of zero.
      - id: d
        text: Because the net torque is zero.
      answer:
        choiceId: c
      explanation: Work is force times displacement ($W = \int \vec{F} \cdot d\vec{r}$). Since the point of contact where friction acts is instantaneously at rest, it does not move while the force is applied, so no work is done.
  - id: sec-3
    title: Energy Partition
    content: 'For rolling without slipping, substitute $\omega=v/R$ into $K=\tfrac12mv^2+\tfrac12I\omega^2$. A larger $I/(mR^2)$ means more energy is rotational.'
    media: []
    check:
      id: chk-rm-10
      type: multipleChoice
      prompt: Which object has the larger rotational-energy fraction at the same $m$, $R$, and rolling speed?
      choices: [{ id: a, text: Solid sphere }, { id: b, text: Hoop }, { id: c, text: They are equal }, { id: d, text: Cannot be determined }]
      answer: { choiceId: b }
      explanation: 'Solution: A hoop has $I=mR^2$, larger than a solid sphere''s $I=\tfrac25mR^2$.

        Why it works: Rotational energy at fixed $\omega$ is proportional to $I$.

        Why the other choices fail: Equal mass and radius do not imply equal moment of inertia.'
  - id: sec-4
    title: Rolling Down an Incline
    content: 'Combining force, torque, and $a=R\alpha$ gives $a=g\sin\theta/[1+I/(mR^2)]$ for an object rolling down an incline.'
    media: []
    check:
      id: chk-rm-11
      type: multipleChoice
      prompt: 'A solid cylinder has $I=\tfrac12mR^2$. Its acceleration down an incline is:'
      choices: [{ id: a, text: '$g\sin\theta$' }, { id: b, text: '$\tfrac12g\sin\theta$' }, { id: c, text: '$\tfrac23g\sin\theta$' }, { id: d, text: '$\tfrac32g\sin\theta$' }]
      answer: { choiceId: c }
      explanation: 'Solution: $a=g\sin\theta/(1+1/2)=\tfrac23g\sin\theta$.

        Why it works: Some gravitational energy and force response go into rotation.

        Why the other choices fail: They neglect rotation or use the reciprocal/inverted factor.'
  - id: sec-5
    title: Static Friction Direction
    content: 'A body released from rest on a slope tends to slide downhill at its contact point. Static friction points uphill, creating the torque needed for clockwise rolling.'
    media: []
    check:
      id: chk-rm-12
      type: multipleChoice
      prompt: 'For a cylinder rolling from rest down a ramp, static friction points:'
      choices: [{ id: a, text: Down the ramp }, { id: b, text: Up the ramp }, { id: c, text: Perpendicular to the ramp }, { id: d, text: It must be zero }]
      answer: { choiceId: b }
      explanation: 'Solution: Friction points uphill.

        Why it works: It supplies the torque that starts the required rotation.

        Why the other choices fail: Gravity provides downhill translation; zero friction would not establish no-slip rolling from rest.'
  - id: sec-6
    title: When Friction Does Work
    content: 'Static friction often does zero work in ideal rolling on a fixed surface, but kinetic friction during slipping converts mechanical energy into thermal energy.'
    media: []
    check:
      id: chk-rm-13
      type: multipleChoice
      prompt: Which situation most directly dissipates mechanical energy through friction?
      choices: [{ id: a, text: A wheel rolling without slipping on level ground }, { id: b, text: A skidding tire }, { id: c, text: A wheel with no contact force }, { id: d, text: A wheel at rest }]
      answer: { choiceId: b }
      explanation: 'Solution: A skidding tire experiences kinetic friction.

        Why it works: The surfaces slide relative to each other, producing thermal energy.

        Why the other choices fail: Ideal static contact has no relative slipping.'
  - id: sec-7
    title: Comparing Race Times
    content: 'Objects rolling from the same height conserve energy, but lower inertia parameters $I/(mR^2)$ yield greater translational acceleration and arrive earlier.'
    media: []
    check:
      id: chk-rm-14
      type: multipleChoice
      prompt: 'Which reaches the bottom first from rest: a solid sphere or a hoop of the same mass and radius?'
      choices: [{ id: a, text: The solid sphere }, { id: b, text: The hoop }, { id: c, text: They tie }, { id: d, text: Mass determines it }]
      answer: { choiceId: a }
      explanation: 'Solution: The solid sphere arrives first.

        Why it works: Its smaller $I/(mR^2)$ gives a larger acceleration.

        Why the other choices fail: The hoop puts more energy into rotation; equal mass does not make the accelerations equal.'
