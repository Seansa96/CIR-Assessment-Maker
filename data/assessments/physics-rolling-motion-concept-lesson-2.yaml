lesson:
  introduction: Because a rolling object translates and rotates simultaneously, its
    kinetic energy has two parts, and its acceleration depends on its moment of inertia.
  sections:
  - id: sec-1
    title: Kinetic Energy of Rolling
    content: 'The total kinetic energy of a rolling object is the sum of the translational
      kinetic energy of its center of mass and the rotational kinetic energy about
      its center of mass:


      $$K_{total} = \frac{1}{2}mv_{cm}^2 + \frac{1}{2}I_{cm}\omega^2$$


      Because $v_{cm} = R\omega$, we can substitute $\omega = v_{cm}/R$ to express
      the total kinetic energy entirely in terms of $v_{cm}$. The distribution of
      mass (and thus $I_{cm}$) dictates how much of the total energy is "locked up"
      in rotation rather than translation.'
    media: []
    check:
      id: chk-rm-3
      type: multipleChoice
      prompt: A solid sphere ($I = \frac{2}{5}mR^2$) and a hollow spherical shell
        ($I = \frac{2}{3}mR^2$) of equal mass and radius roll down a ramp from the
        same height. Which reaches the bottom first?
      choices:
      - id: a
        text: The hollow shell.
      - id: b
        text: The solid sphere.
      - id: c
        text: They reach the bottom at the exact same time.
      - id: d
        text: It depends on their mass.
      answer:
        choiceId: b
      explanation: Both start with the same potential energy. The hollow shell has
        a larger moment of inertia, meaning a larger fraction of its energy is consumed
        by rotation. Thus, it has less translational kinetic energy, resulting in
        a lower $v_{cm}$, so the solid sphere reaches the bottom first.
  - id: sec-2
    title: Role of Friction in Rolling
    content: 'Without friction, a ball placed on a frictionless ramp would simply
      slide down without rotating. Static friction at the point of contact provides
      the torque necessary to cause angular acceleration ($\alpha$).


      Even though static friction acts on the rolling body, it does **no work** because
      the point of application (the contact point) is momentarily at rest. Mechanical
      energy is conserved in ideal rolling without slipping.'
    media: []
    check:
      id: chk-rm-4
      type: multipleChoice
      prompt: Why does static friction do zero work on a wheel that is rolling without
        slipping?
      choices:
      - id: a
        text: Because the friction force is perpendicular to the motion.
      - id: b
        text: Because static friction is a conservative force.
      - id: c
        text: Because the point of the wheel in contact with the ground has an instantaneous
          displacement of zero.
      - id: d
        text: Because the net torque is zero.
      answer:
        choiceId: c
      explanation: Work is force times displacement ($W = \int \vec{F} \cdot d\vec{r}$).
        Since the point of contact where friction acts is instantaneously at rest,
        it does not move while the force is applied, so no work is done.
