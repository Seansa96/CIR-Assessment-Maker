  type: symbolicResponse
  prompt: |
    A cylindrical rod of length $L_1$, cross-sectional area $A_1$, and Young's Modulus $Y_1$ is welded end-to-end with a second cylindrical rod of length $L_2$, area $A_2$, and Young's Modulus $Y_2$. 
    
    A total pulling force $F$ is applied to the ends of the combined assembly. What is the effective Young's Modulus $Y_{\text{eff}}$ of a hypothetical uniform single rod of length $L_1 + L_2$ and area $A_1$ that would stretch by the exact same total amount?
  answer:
    expectedLatex: '\frac{(L_1 + L_2) Y_1 Y_2 A_2}{L_1 Y_2 A_2 + L_2 Y_1 A_1}'
    equivalenceMode: expression
    variables:
      - L_1
      - L_2
      - Y_1
      - Y_2
      - A_1
      - A_2
    tolerance: 0.0001
  explanation: |
    Solution:
    The total stretch is the sum of the individual stretches: $\Delta L_{\text{total}} = \Delta L_1 + \Delta L_2$.
    
    Substituting Hooke's law ($\Delta L = \frac{FL}{YA}$) for each part:
    $$ \Delta L_{\text{total}} = \frac{F L_1}{Y_1 A_1} + \frac{F L_2}{Y_2 A_2} $$
    
    The equivalent rod has length $L_1 + L_2$, area $A_1$, and modulus $Y_{\text{eff}}$. Its total stretch is:
    $$ \Delta L_{\text{total}} = \frac{F (L_1 + L_2)}{Y_{\text{eff}} A_1} $$
    
    Setting them equal:
    $$ \frac{F (L_1 + L_2)}{Y_{\text{eff}} A_1} = \frac{F L_1}{Y_1 A_1} + \frac{F L_2}{Y_2 A_2} $$
    
    The force $F$ cancels. Solving for $Y_{\text{eff}}$ gives:
    $$ Y_{\text{eff}} = \frac{L_1 + L_2}{A_1 \left( \frac{L_1}{Y_1 A_1} + \frac{L_2}{Y_2 A_2} \right)} $$
    
    Simplifying the denominator:
    $$ Y_{\text{eff}} = \frac{(L_1 + L_2) Y_1 Y_2 A_2}{L_1 Y_2 A_2 + L_2 Y_1 A_1} $$
    
    Why it works: This treats the two rods like springs in series, where displacements add up under the same tension force.
