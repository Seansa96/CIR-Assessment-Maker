lesson:
  introduction: This deeper lesson expands Memory Management from Chapter 3 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: address-space-abstraction
    title: Address space abstraction
    required: true
    content: 'An address space lets each process use a private-looking memory range while the OS maps it to physical resources.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Memory Management, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: address-space-abstraction-deep-check
      title: 'Check: Address space abstraction'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Address space abstraction**?
      choices:
      - id: a
        text: Virtual addresses require translation and protection.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Virtual addresses require translation and protection. Related topic: Memory Management.'
    media:
    - type: image
      src: /assessments/operating-systems/memory/process-address-spaces.svg
      alt: Two process address spaces mapped onto physical frames.
      caption: Address spaces provide private views that the OS maps onto physical memory.
  - id: relocation
    title: Relocation
    required: true
    content: 'Relocation lets a program run without being built for one fixed physical address.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Memory Management, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: relocation-deep-check
      title: 'Check: Relocation'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Relocation**?
      choices:
      - id: a
        text: Relocation separates program addresses from placement.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Relocation separates program addresses from placement. Related topic: Memory Management.'
  - id: protection
    title: Protection
    required: true
    content: 'Protection prevents one process from reading or writing memory it does not own or share by permission.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Memory Management, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: protection-deep-check
      title: 'Check: Protection'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Protection**?
      choices:
      - id: a
        text: Relocation alone is not protection.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Relocation alone is not protection. Related topic: Memory Management.'
  - id: free-space
    title: Free-space management
    required: true
    content: 'Bitmaps and free lists track available memory, but fragmentation can make total free space misleading.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Memory Management, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: free-space-deep-check
      title: 'Check: Free-space management'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Free-space management**?
      choices:
      - id: a
        text: Contiguous needs can fail despite enough total free memory.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Contiguous needs can fail despite enough total free memory. Related topic: Memory Management.'
    media:
    - type: image
      src: /assessments/operating-systems/memory/memory-fragmentation.svg
      alt: Memory line with allocated regions and holes demonstrating fragmentation.
      caption: Total free memory can be misleading when contiguous space is required.
  - id: swapping-segmentation
    title: Swapping and segmentation
    required: true
    content: 'Swapping moves process memory as a coarse unit; segmentation divides memory by logical program regions.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Memory Management, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: swapping-segmentation-deep-check
      title: 'Check: Swapping and segmentation'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Swapping and segmentation**?
      choices:
      - id: a
        text: Swapping and segmentation solve different problems.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Swapping and segmentation solve different problems. Related topic: Memory Management.'
