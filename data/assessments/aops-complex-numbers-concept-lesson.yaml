skills:
- Represent complex numbers uniquely in standard form
- Add and multiply complex numbers using component structure
- Use powers of i, conjugates, and moduli strategically
- Divide complex numbers and verify results by multiplication
lesson:
  introduction: |-
    Complex numbers extend the real numbers so equations such as $z^2=-1$ can be solved without abandoning ordinary algebra. The new symbol $i$ obeys one defining relation, $i^2=-1$. Everything in this lesson follows from that relation, distributivity, and the unique standard form $a+bi$.
  sections:
  - id: complex-extension-and-standard-form
    title: Why the number system is extended
    required: true
    content: |-
      No real number has square $-1$, because every real square is nonnegative. Define $i$ by $i^2=-1$. A complex number is then written

      $$z=a+bi,$$

      where $a,b$ are real. The number $a$ is the real part and $b$ is the imaginary part. This representation is unique: $a+bi=c+di$ exactly when $a=c$ and $b=d$.

      A real number is the special case $a+0i$, while a purely imaginary number has real part zero. The complex number zero is $0+0i$; both components must vanish.
    check:
      id: complex-extension-and-standard-form-check
      type: multipleChoice
      prompt: 'If $a+bi=7-3i$, what is $a-b$?'
      choices:
      - id: a
        text: '4'
      - id: b
        text: '10'
      - id: c
        text: '$7-3i$'
      - id: d
        text: '$-10$'
      answer:
        choiceId: b
      explanation: Uniqueness of standard form gives $a=7$ and $b=-3$, so $a-b=10$.
  - id: componentwise-addition-and-subtraction
    title: Addition preserves real and imaginary components
    required: true
    content: |-
      Addition and subtraction combine like components:

      $$(a+bi)+(c+di)=(a+c)+(b+d)i.$$

      For subtraction, distribute the minus sign to both components. For example,

      $$(6-2i)-(1+7i)=6-2i-1-7i=5-9i.$$

      This is analogous to combining like terms in a polynomial. A real component and an imaginary component do not combine because standard form records them independently.
    check:
      id: componentwise-addition-and-subtraction-check
      type: multipleChoice
      prompt: 'Compute $(4+5i)-(-2+9i)$.'
      choices:
      - id: a
        text: '$2+14i$'
      - id: b
        text: '$6-4i$'
      - id: c
        text: '$6+14i$'
      - id: d
        text: '$2-4i$'
      answer:
        choiceId: b
      explanation: Distribute the subtraction, giving $4+5i+2-9i=6-4i$.
  - id: multiplication-and-the-power-cycle
    title: Multiply normally, then use $i^2=-1$
    required: true
    content: |-
      Complex multiplication uses distributivity:

      $$(a+bi)(c+di)=ac+adi+bci+bd i^2=(ac-bd)+(ad+bc)i.$$

      The sign in the real part comes from $i^2=-1$. For instance,

      $$(2-3i)^2=4-12i+9i^2=-5-12i.$$

      Powers of $i$ repeat every four steps:

      $$i^0=1,\quad i^1=i,\quad i^2=-1,\quad i^3=-i,\quad i^4=1.$$

      Therefore reduce a large exponent modulo 4. Since $2026\equiv2\pmod4$, $i^{2026}=-1$.
    check:
      id: multiplication-and-the-power-cycle-check
      type: multipleChoice
      prompt: 'What is $i^{12345}$?'
      choices:
      - id: a
        text: '$1$'
      - id: b
        text: '$i$'
      - id: c
        text: '$-1$'
      - id: d
        text: '$-i$'
      answer:
        choiceId: b
      explanation: The remainder when 12345 is divided by 4 is 1, so the power equals $i^1$.
  - id: conjugates-and-modulus
    title: Conjugates turn products into real sums of squares
    required: true
    content: |-
      The conjugate of $z=a+bi$ is $\overline z=a-bi$. Their product is

      $$(a+bi)(a-bi)=a^2+b^2,$$

      because the cross terms cancel and $-b^2i^2=b^2$. This real, nonnegative quantity is the squared modulus:

      $$|z|=\sqrt{a^2+b^2},\qquad z\overline z=|z|^2.$$

      The modulus measures the distance from the origin to the point $(a,b)$ in the complex plane. Comparing moduli often avoids square roots: compare $a^2+b^2$ instead.
    check:
      id: conjugates-and-modulus-check
      type: multipleChoice
      prompt: 'Which number has the larger modulus: $3+4i$ or $1+5i$?'
      choices:
      - id: a
        text: '$3+4i$, because its real part is larger.'
      - id: b
        text: '$1+5i$, because its squared modulus is 26 rather than 25.'
      - id: c
        text: They have equal modulus.
      - id: d
        text: Moduli of nonreal numbers cannot be compared.
      answer:
        choiceId: b
      explanation: Compare $3^2+4^2=25$ with $1^2+5^2=26$.
  - id: division-by-a-complex-number
    title: Division uses a conjugate to create a real denominator
    required: true
    content: |-
      To divide by $c+di\ne0$, multiply numerator and denominator by its conjugate:

      $$\frac{a+bi}{c+di}\cdot\frac{c-di}{c-di}.
      $$

      The denominator becomes $c^2+d^2$, a positive real number unless $c=d=0$. Expand the numerator and collect components.

      Example:

      $$\frac{8+6i}{2-i}\cdot\frac{2+i}{2+i}=\frac{10+20i}{5}=2+4i.$$

      Verify a quotient by multiplying it by the original divisor: $(2+4i)(2-i)=8+6i$.
    check:
      id: division-by-a-complex-number-check
      type: multipleChoice
      prompt: 'Which factor should be used to simplify $\dfrac{3+i}{4-2i}$?'
      choices:
      - id: a
        text: '$\dfrac{4-2i}{4-2i}$'
      - id: b
        text: '$\dfrac{4+2i}{4+2i}$'
      - id: c
        text: '$\dfrac{3-i}{3-i}$'
      - id: d
        text: '$\dfrac{i}{i}$'
      answer:
        choiceId: b
      explanation: Multiply by the conjugate of the denominator so its product becomes real.
  - id: negative-radicands-and-equations
    title: Negative radicands require care
    required: true
    content: |-
      In the complex numbers, $z^2=-r$ with $r>0$ has the two solutions $z=\pm i\sqrt r$. The symbol $\sqrt{-r}$ is commonly assigned the principal value $i\sqrt r$, but an equation still requires both roots.

      Real radical identities cannot be transferred blindly. For example, taking principal complex square roots with $a=b=-1$ gives

      $$\sqrt{ab}=\sqrt1=1,$$

      while

      $$\sqrt a\sqrt b=i\cdot i=-1.$$

      Thus $\sqrt{ab}=\sqrt a\sqrt b$ is not a universal complex identity. Keep negative factors together until the role of $i$ is explicit.
    check:
      id: negative-radicands-and-equations-check
      type: multipleChoice
      prompt: 'What are all solutions of $z^2=-36$?'
      choices:
      - id: a
        text: '$z=6i$ only'
      - id: b
        text: '$z=-6i$ only'
      - id: c
        text: '$z=\pm6i$'
      - id: d
        text: '$z=\pm6$'
      answer:
        choiceId: c
      explanation: Both $6i$ and $-6i$ square to $-36$.
  - id: synthesis-solving-a-complex-square
    title: Synthesis—solve by comparing components
    required: true
    content: |-
      Find every complex number $z$ such that $z^2=8i$. Write $z=a+bi$ with real $a,b$. Expanding gives

      $$z^2=(a^2-b^2)+2abi.$$

      Equality with $0+8i$ requires the component equations

      $$a^2-b^2=0,\qquad 2ab=8.$$

      The first equation gives $a=b$ or $a=-b$. If $a=b$, then $2a^2=8$, so $a=b=2$ or $a=b=-2$. If $a=-b$, then $2ab=-2a^2$ cannot equal 8. Hence

      $$z=2+2i\quad\text{or}\quad z=-2-2i.$$

      Squaring either answer returns $8i$. Component comparison turns one complex equation into a real system and makes completeness visible.
    check:
      id: synthesis-solving-a-complex-square-check
      type: multipleChoice
      prompt: 'Which pair gives all solutions of $z^2=-8i$?'
      choices:
      - id: a
        text: '$2-2i$ and $-2+2i$'
      - id: b
        text: '$2+2i$ and $-2-2i$'
      - id: c
        text: '$4i$ and $-4i$'
      - id: d
        text: '$\sqrt8$ and $-\sqrt8$'
      answer:
        choiceId: a
      explanation: $(2-2i)^2=-8i$, and the negative of a square root is the second root.
