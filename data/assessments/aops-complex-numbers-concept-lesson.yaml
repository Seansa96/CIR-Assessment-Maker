lesson:
  introduction: Learn to solve Complex Numbers problems by recognizing imaginary unit, complex arithmetic, powers of i, real and imaginary parts and justifying each theorem or transformation.
  sections:
  - id: aops-complex-numbers-motivation
    title: What the topic helps you notice
    required: true
    content: Complex Numbers is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are imaginary unit, complex arithmetic, powers of i, real and imaginary parts.
    check:
      id: aops-complex-numbers-motivation-check
      type: multipleChoice
      prompt: In Complex Numbers, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-complex-numbers-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-complex-numbers-definitions-check
      type: multipleChoice
      prompt: In Complex Numbers, what should be checked before applying a method?
