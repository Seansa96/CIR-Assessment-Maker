glossary:
  introduction: Use these terms to state what a measurement means, where its uncertainty comes from, and how it should be reported.
  sections:
  - id: uncertainty-terms
    title: Uncertainty terms
    required: true
    content: Distinguish repeatable bias from trial-to-trial scatter, and distinguish absolute units from relative comparison.
    entries:
    - id: random-error
      term: Random error
      definition: Unpredictable trial-to-trial variation in a measurement.
      notation: ''
      examples:
      - Repeated timing measurements scatter around a central value.
      aliases:
      - random uncertainty
      media: []
      tags:
      - uncertainty
      drills:
      - id: random-error-drill
        type: cloze
        prompt: Trial-to-trial unpredictable variation is ____ error.
        answer:
          expected: random
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The answer is random.\n\nWhy it works: Random error changes unpredictably between repeated trials.'
        tags:
        - uncertainty
        skills: []
        issueSignals: []
        choices: []
    - id: systematic-error
      term: Systematic error
      definition: A repeatable bias that shifts results consistently in one direction.
      notation: ''
      examples:
      - A balance that reads 0.2 g high has a systematic offset.
      aliases:
      - systematic bias
      media: []
      tags:
      - uncertainty
      drills:
      - id: systematic-error-drill
        type: cloze
        prompt: A scale that reads high by the same amount has a ____ error.
        answer:
          expected: systematic
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The answer is systematic.\n\nWhy it works: The same offset biases every measurement in one direction.'
        tags:
        - uncertainty
        skills: []
        issueSignals: []
        choices: []
    - id: absolute-uncertainty
      term: Absolute uncertainty
      definition: Uncertainty expressed in the same units as the measured quantity.
      notation: $L=(12.4\pm0.1)$ cm
      examples:
      - The 0.1 cm uncertainty is absolute uncertainty.
      aliases: []
      media: []
      tags:
      - reporting
      drills:
      - id: absolute-uncertainty-drill
        type: cloze
        prompt: Absolute uncertainty in length is reported in ____ units.
        answer:
          expected: length
          expectedLatex: ''
          aliases:
          - the same
          media: []
          choiceId: 
        explanation: 'Solution: It uses length units.\n\nWhy it works: Absolute uncertainty is a possible change in the measured quantity.'
        tags:
        - reporting
        skills: []
        issueSignals: []
        choices: []
    - id: percent-uncertainty
      term: Percent uncertainty
      definition: Absolute uncertainty divided by the best estimate and multiplied by 100 percent.
      notation: $\delta\%=\delta q/q\times100\%$
      examples:
      - 0.5 m uncertainty on 10.0 m is 5 percent.
      aliases:
      - relative uncertainty
      media: []
      tags:
      - reporting
      drills:
      - id: percent-uncertainty-drill
        type: cloze
        prompt: Percent uncertainty equals absolute uncertainty divided by the ____ estimate, times 100 percent.
        answer:
          expected: best
          expectedLatex: ''
          aliases:
          - measured
          media: []
          choiceId: 
        explanation: 'Solution: The missing word is best.\n\nWhy it works: Percent uncertainty compares an uncertainty with the reported measurement.'
        tags:
        - reporting
        skills: []
        issueSignals: []
        choices: []
