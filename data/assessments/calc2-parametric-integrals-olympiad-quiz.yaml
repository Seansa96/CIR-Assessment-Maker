questions:
- id: q001
  type: freeResponse
  skills:
  - parametric-integrals
  - olympiad-problem-solving
  prompt: Find the area under $x=t$, $y=t^2$ from $t=0$ to $t=3$.
  answer:
    gradingMode: selfCheck
    expected: $\frac{27}{3}$.
    keyPoints:
    - 'Matches the reference result: $\frac{27}{3}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: Use $A=\int y\,dx=\int_0^3t^2(1)dt=27/3$.
