  skills: [normalize linear equations]
  prompt: On $x>0$, write the coefficient $P(x)$ after putting $x^2y'+3xy=x^3$ into standard form.
  answer: { expectedLatex: '3/x', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: Divide by $x^2$ to obtain $y'+(3/x)y=x$. }
- id: q002
  type: symbolicResponse
  issueSignals:
  - id: boundary-condition-failure
  - id: algebraic-simplification-error
  - id: u-substitution-failure
  - id: product-rule-misapplied
  - id: chain-rule-missed
  - id: logarithm-property-misapplied
  skills: [construct integrating factors]
  prompt: On $x>0$, enter an integrating factor for $y'+(3/x)y=x$.
  answer: { expectedLatex: 'x^3', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: The integral of 3/x is three natural log x, yielding x cubed. }
- id: q003
  type: symbolicResponse
  issueSignals:
  - id: boundary-condition-failure
  - id: algebraic-simplification-error
  - id: u-substitution-failure
  - id: product-rule-misapplied
  - id: chain-rule-missed
  - id: logarithm-property-misapplied
  skills: [solve linear IVPs]
  prompt: Solve $y'+(3/x)y=x$ on $x>0$ with $y(1)=1$.
  answer: { expectedLatex: 'x^2/5+4/(5x^3)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: Multiplication by $x^3$ gives $(x^3y)'=x^4$; the initial condition determines the integration constant. }
- id: q004
  type: symbolicResponse
  issueSignals:
  - id: boundary-condition-failure
  - id: algebraic-simplification-error
  - id: u-substitution-failure
  - id: product-rule-misapplied
  - id: chain-rule-missed
  - id: logarithm-property-misapplied
  skills: [model unequal-flow tanks]
  prompt: A tank begins with 100 gal; inflow is 2 gal/min and outflow is 3 gal/min. Enter the outflow concentration in terms of salt amount $S$ and time $t$.
  answer: { expectedLatex: 'S/(100-t)', equivalenceMode: expression, tolerance: 0.000001, variables: [S, t], explanation: The volume decreases as $V(t)=100-t$. }
- id: q005
  type: numericResponse
  issueSignals:
  - id: boundary-condition-failure
  - id: algebraic-simplification-error
  - id: u-substitution-failure
  - id: product-rule-misapplied
  - id: chain-rule-missed
  - id: logarithm-property-misapplied
  skills: [model unequal-flow tanks]
  prompt: At what time in minutes will that tank be empty if the rates remain constant?
  answer: { value: 100, tolerance: 0.001 }
  explanation: Set the volume $100-t$ equal to zero.
