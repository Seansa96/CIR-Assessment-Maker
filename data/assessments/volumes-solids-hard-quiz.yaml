questions:
- id: vol-hard-1
  title: Washer Method
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the volume generated by rotating the region bounded by $y = 4x$ and $y =
    4x^2$ around the x-axis.'
  answer:
    gradingMode: auto
    expected: (2/15)*16\pi
  explanation: Intersections at $x=0, 1$. $\pi \int_0^1 ((4x)^2 - (4x^2)^2) \, dx
    = 16\pi \int_0^1 (x^2 - x^4) \, dx = 16\pi (1/3 - 1/5) = \frac{216\pi}{15}$.
