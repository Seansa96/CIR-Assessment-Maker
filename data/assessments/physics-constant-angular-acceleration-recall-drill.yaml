items:
  - { id: card1, type: cloze, prompt: 'For constant angular acceleration, $\omega=\omega_0+____t$.', answer: { expected: alpha, expectedLatex: '\alpha', aliases: ['angular acceleration'], media: [] }, explanation: 'Solution: Insert $\alpha$.\n\nWhy it works: Angular velocity changes linearly under constant acceleration.', tags: [equation] }
  - { id: card2, type: typed, prompt: 'What is the slope of an omega-time graph?', answer: { expected: 'angular acceleration', expectedLatex: '\alpha', aliases: [alpha], media: [] }, explanation: 'Solution: It is angular acceleration.\n\nWhy it works: Slope is $d\omega/dt$.', tags: [graphs] }
  - { id: card3, type: cloze, prompt: 'The area under an omega-time graph is angular ____.', answer: { expected: displacement, expectedLatex: '\theta', aliases: [position], media: [] }, explanation: 'Solution: Insert displacement.\n\nWhy it works: Integrating angular velocity over time gives angle change.', tags: [graphs] }
  - { id: card4, type: typed, prompt: 'Which kinematic equation omits time?', answer: { expected: 'omega squared equals omega zero squared plus 2 alpha delta theta', expectedLatex: '\omega^2=\omega_0^2+2\alpha\Delta\theta', aliases: [], media: [] }, explanation: 'Solution: Use $\omega^2=\omega_0^2+2\alpha\Delta\theta$.\n\nWhy it works: It relates speed, acceleration, and angular displacement directly.', tags: [equation] }
  - { id: card5, type: cloze, prompt: 'For constant acceleration, average angular velocity is $(\omega_0+\omega)/____$.', answer: { expected: '2', expectedLatex: '2', aliases: [two], media: [] }, explanation: 'Solution: Insert 2.\n\nWhy it works: It is the mean of initial and final angular velocities.', tags: [average] }
  - { id: card6, type: typed, prompt: 'What is angular acceleration during coasting at constant angular velocity?', answer: { expected: zero, expectedLatex: '0', aliases: ['0'], media: [] }, explanation: 'Solution: It is zero.\n\nWhy it works: Constant angular velocity has no rate of change.', tags: [coasting] }
