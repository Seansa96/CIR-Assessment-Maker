workedExamples:
- id: we001
  title: Example 1
  problem: |-
    Find the interval of convergence of $\sum \frac{x^n}{n \cdot 3^n}$.
  steps:
  - id: step-we001-1
    title: Solution
    instruction: |-
      $R=3$. At $x=3$: $\sum 1/n$ diverges. At $x=-3$: $\sum (-1)^n/n$ converges. IOC: $[-3, 3)$.
