workedExamples:
  - id: find-radius
    title: Finding Radius and Interval of Convergence
    problem: |
      Find the radius of convergence and the interval of convergence for the power series:
      $$ \sum_{n=1}^\infty \frac{(-1)^n (x-3)^n}{n 5^n} $$
    steps:
      - id: ratio-setup
        title: Apply the Ratio Test
        content: |
          $$ L = \lim_{n \to \infty} \left| \frac{a_{n+1}}{a_n} \right| $$
          
          $$ a_{n+1} = \frac{(-1)^{n+1} (x-3)^{n+1}}{(n+1) 5^{n+1}} $$
          
          $$ L = \lim_{n \to \infty} \left| \frac{(x-3)^{n+1}}{(n+1) 5^{n+1}} \cdot \frac{n 5^n}{(x-3)^n} \right| $$
          
          Cancel terms: $(x-3)^{n+1}/(x-3)^n = (x-3)$, and $5^n/5^{n+1} = 1/5$.
          
          $$ L = \lim_{n \to \infty} \left| \frac{x-3}{5} \cdot \frac{n}{n+1} \right| $$
      - id: evaluate-ratio
        title: Evaluate the limit
        content: |
          Since $\lim \frac{n}{n+1} = 1$:
          $$ L = \left| \frac{x-3}{5} \right| $$
          
          For convergence, we require $L < 1$:
          $$ \frac{|x-3|}{5} < 1 \implies |x-3| < 5 $$
          
          This tells us the radius of convergence is **R = 5**.
          The open interval is $3 - 5 < x < 3 + 5$, which is $(-2, 8)$.
      - id: check-endpoints
        title: Check the endpoints manually
        content: |
          **Endpoint x = 8:**
          Substitute $x=8$ into the original series:
          $$ \sum \frac{(-1)^n (8-3)^n}{n 5^n} = \sum \frac{(-1)^n 5^n}{n 5^n} = \sum \frac{(-1)^n}{n} $$
          This is the Alternating Harmonic Series, which **converges**.
          
          **Endpoint x = -2:**
          Substitute $x=-2$:
          $$ \sum \frac{(-1)^n (-2-3)^n}{n 5^n} = \sum \frac{(-1)^n (-5)^n}{n 5^n} = \sum \frac{(-1)^n (-1)^n 5^n}{n 5^n} = \sum \frac{(-1)^{2n}}{n} = \sum \frac{1}{n} $$
          This is the Harmonic Series, which **diverges**.
          
          The final interval of convergence is $(-2, 8]$.
    check:
      id: find-radius-check
      type: multipleChoice
      prompt: Why does $(-1)^n (-5)^n$ simplify to $5^n$?
      choices:
        - id: a
          text: Because $(-5)^n = (-1)^n \cdot 5^n$. Then $(-1)^n \cdot (-1)^n = (-1)^{2n}$. Since $2n$ is always even, $(-1)^{2n} = 1$.
        - id: b
          text: Because negative times negative is positive.
        - id: c
          text: Because the absolute value removes the negative signs.
      answer:
        choiceId: a
      explanation: |
        Exactly. A negative number to the power of $n$ can be factored into $(-1)^n \cdot (positive)^n$.

  - id: geometric-representation
    title: Representing Functions as Power Series
    problem: |
      Find a power series representation for $f(x) = \frac{1}{1+x^2}$ and determine its radius of convergence.
    steps:
      - id: geometric-link
        title: Link to the Geometric Series formula
        content: |
          Recall the sum of a geometric series:
          $$ \frac{a}{1 - r} = \sum_{n=0}^\infty a r^n $$
          
          We want our function $\frac{1}{1+x^2}$ to look like $\frac{a}{1-r}$.
          Rewrite the denominator to have a minus sign:
          $$ \frac{1}{1 - (-x^2)} $$
      - id: build-series
        title: Build the series
        content: |
          Now we match the pieces:
          $a = 1$
          $r = -x^2$
          
          Substitute these into the geometric series formula:
          $$ \sum_{n=0}^\infty (1) (-x^2)^n = \sum_{n=0}^\infty (-1)^n x^{2n} $$
          
          Writing out the first few terms: $1 - x^2 + x^4 - x^6 + x^8 \dots$
      - id: find-roc
        title: Find the radius of convergence
        content: |
          A geometric series only converges when $|r| < 1$.
          Here, $r = -x^2$.
          
          $$ |-x^2| < 1 \implies x^2 < 1 \implies |x| < 1 $$
          
          So the radius of convergence is $R = 1$.
    check:
      id: geometric-representation-check
      type: multipleChoice
      prompt: If you take the derivative of $\frac{1}{1+x^2}$, you get $\frac{-2x}{(1+x^2)^2}$. How could you find the power series for this new function?
      choices:
        - id: a
          text: Take the derivative of the power series we just found, term-by-term.
        - id: b
          text: Multiply the series by $-2x$.
        - id: c
          text: It is impossible to find a power series for that function.
      answer:
        choiceId: a
      explanation: |
        One of the most powerful features of power series is that you can differentiate and integrate them term-by-term, just like regular polynomials!
