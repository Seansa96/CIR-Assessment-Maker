schemaVersion: 1
id: pwsh-string-directed-project-2
title: "CSV Data Extraction Sandbox"
assessmentType: directedProject
categoryId: scripting
subcategoryIds:
  - pwsh-string-methods
questionCount: 0
guidedProject: null
directedProject:
  summary: "In this directed project, you will practice splitting strings by manually parsing a comma-separated list in your local PowerShell terminal."
  estimatedTimeMinutes: 15
  resources: []
  phases:
    - id: phase-1-setup
      title: "Creating the Data"
      steps:
        - id: step-1-define
          title: "Define the CSV String"
          instruction: |
            1. Open PowerShell.
            2. Define a string variable representing a row of CSV data: 
               `$CsvRow = "Server01,192.168.1.10,Running,Windows"`
          checklist:
            - id: chk-define
              text: "Successfully defined the $CsvRow variable"
          resources: []
    - id: phase-2-parse
      title: "Parsing the Data"
      steps:
        - id: step-2-split
          title: "Split the String"
          instruction: |
            1. Use the `.Split()` method to break the string into an array based on the comma character:
               `$DataArray = $CsvRow.Split(",")`
            2. Extract the IP Address (which is the second item, at index 1) by running:
               `$DataArray[1]`
            3. Verify the output is exactly `192.168.1.10`.
          checklist:
            - id: chk-split
              text: "Used .Split(',') to create an array"
            - id: chk-index
              text: "Successfully accessed index 1 to extract the IP address"
          resources: []
