questions:
- id: q001
  type: numericResponse
  prompt: |
    A standard mercury barometer reads an atmospheric pressure equivalent to a column of mercury $0.760 \text{ m}$ high. 
    If the barometer were instead filled with pure water, what would be the height of the water column in meters?
    Use $\rho_{mercury} = 13600 \text{ kg/m}^3$ and $\rho_{water} = 1000 \text{ kg/m}^3$.
  answer:
    value: 10.336
    tolerance: 0.1
  explanation: |
    Solution:
    Atmospheric pressure $P_{atm}$ supports both columns. Therefore, the hydrostatic pressures must be equal:
    $\rho_{mercury} g h_{mercury} = \rho_{water} g h_{water}$
    $h_{water} = h_{mercury} \frac{\rho_{mercury}}{\rho_{water}} = 0.760 \times \frac{13600}{1000} = 0.760 \times 13.6 = 10.336 \text{ m}$.
    
    Why it works:
    Water is 13.6 times less dense than mercury. To exert the exact same pressure, the water column must be 13.6 times taller. This is why practical barometers use mercury; a water barometer would need to be over 10 meters tall!
  difficultyDimensions:
  - RepresentationTransfer
  - IdentityConstruction
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    A container is filled with two immiscible fluids. Fluid 1 has density $\rho_1$ and depth $h_1$. Fluid 2 sits below it and has density $\rho_2$ (where $\rho_2 > \rho_1$) and depth $h_2$.
    Write the expression for the **gauge pressure** at the very bottom of the container. 
    Use `\rho_1`, `h_1`, `\rho_2`, `h_2`, and `g`.
  answer:
    expectedLatex: \rho_1 g h_1 + \rho_2 g h_2
    equivalenceMode: expression
    variables: [\rho_1, h_1, \rho_2, h_2, g]
    tolerance: 0.00001
    keyPoints:
    - \rho_1 g h_1 + \rho_2 g h_2
  explanation: |
    Solution:
    $P_{gauge} = \rho_1 g h_1 + \rho_2 g h_2$
    
    Why it works:
    Gauge pressure is the pressure relative to the atmosphere (so we ignore $P_{atm}$). The total gauge pressure is simply the sum of the hydrostatic pressures from each discrete layer of fluid resting on the bottom.
  difficultyDimensions:
  - RepresentationTransfer
  - IdentityConstruction
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
