workedExamples:
- id: we1
  title: Electrons in a Copper Wire
  steps:
  - id: s1
    prompt: Use the current equation.
    explanation: 'Solution:

      1) Rearrange $I = n e v_d A$ to solve for $v_d$: $v_d = \frac{I}{n e A}$.

      2) Substitute values: $v_d = \frac{10}{(8.5 \times 10^{28})(1.6 \times 10^{-19})(3.0 \times 10^{-6})}$.

      3) Calculate denominator: $(8.5 \times 1.6 \times 3.0) \times 10^{28-19-6} = 40.8 \times 10^3 =
      40800$.

      4) $v_d = 10 / 40800 \approx 2.45 \times 10^{-4}\text{ m/s}$.


      Why it works:

      The large number density of free electrons means they only need to move very slowly to produce a
      macroscopic current.'
    title: Use the current equation.
    instruction: 'Work through this step: Use the current equation.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: A copper wire of cross-sectional area $3.0 \times 10^{-6}\text{ m}^2$ carries a current of
    $10\text{ A}$. Assuming copper has $8.5 \times 10^{28}$ free electrons per cubic meter, find the drift
    velocity. (Use $e = 1.6 \times 10^{-19}\text{ C}$).
