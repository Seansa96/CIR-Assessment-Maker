workedExamples:
- id: we001
  title: Fraction of an Iceberg Submerged
  problem: |
    A classic application of buoyancy is determining how much of a floating object sits below the waterline. 
    An iceberg is floating in the ocean. The density of ice is $\rho_{ice} = 917 \text{ kg/m}^3$, and the density of seawater is $\rho_{water} = 1025 \text{ kg/m}^3$.
    Calculate the fraction of the iceberg's total volume that is submerged beneath the surface.
  steps:
  - id: step-1
    title: 1. State the condition for floating
    instruction: |
      For an object to float at rest, it must be in vertical equilibrium. This means the upward buoyant force ($F_B$) must perfectly balance the downward force of gravity (the true weight $W$).
    type: symbolicResponse
    prompt: |
      What must the upward buoyant force $F_B$ perfectly equal? Enter the expression using `W` for weight.
    answer:
      expectedLatex: W
      equivalenceMode: expression
      variables: [W]
      tolerance: 0.00001
      keyPoints:
      - W
    explanation: |
      Solution:
      $W$
      
      Why it works:
      Newton's Second Law dictates that if the iceberg is not accelerating, the net force must be zero. The only vertical forces are gravity (down) and buoyancy (up), so they must be equal in magnitude.

  - id: step-2
    title: 2. Expand the expressions for Buoyancy and Weight
    instruction: |
      Expand both sides of $F_B = W$ using density and volume.
      - $F_B = \rho_{water} V_{sub} g$ (Archimedes' Principle)
      - $W = m_{ice} g = \rho_{ice} V_{total} g$ (Definition of density and weight)
      Set these two expressions equal to each other. Notice that gravity ($g$) cancels out on both sides.
    type: symbolicResponse
    prompt: |
      The buoyant force is $\rho_w V_s g$ and the weight is $\rho_i V_t g$. Setting them equal and canceling $g$ yields $\rho_w V_s$ on the left side. 
      What expression goes on the right side of this equation?
      Use `\rho_i` for ice density and `V_t` for total volume.
    answer:
      expectedLatex: \rho_i V_t
      equivalenceMode: expression
      variables: [\rho_w, V_s, \rho_i, V_t]
      tolerance: 0.00001
      keyPoints:
      - \rho_i V_t
    explanation: |
      Solution:
      $\rho_i V_t$
      
      Why it works:
      Equating $\rho_{water} V_{sub} g = \rho_{ice} V_{total} g$ and dividing both sides by $g$ isolates the relationship between the densities and the volumes.

  - id: step-3
    title: 3. Solve for the submerged fraction
    instruction: |
      The "fraction submerged" is the ratio of the submerged volume to the total volume ($V_{sub} / V_{total}$).
      Rearrange your equation from the previous step to solve for this ratio, and plug in the numerical values for the densities.
    type: numericResponse
    prompt: |
      What fraction (as a decimal) of the iceberg is submerged?
    answer:
      value: 0.895
      tolerance: 0.01
    explanation: |
      Solution:
      Rearranging $\rho_w V_s = \rho_i V_t$ yields:
      $\frac{V_s}{V_t} = \frac{\rho_i}{\rho_w}$.
      Plugging in the values: $\frac{V_s}{V_t} = \frac{917}{1025} \approx 0.895$ (or roughly 89.5%).
      
      Why it works:
      Because ice is nearly as dense as liquid water (about 89.5% of its density), it must displace a volume of water nearly equal to its own total volume to float. This is the origin of the phrase "tip of the iceberg"—almost 90% of the mass is hidden underwater!
