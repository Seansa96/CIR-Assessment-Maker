- id: q001
  type: numericResponse
  skills:
  - physics-musical-sound-sources
  prompt: Use the Sources of Musical Sound diagram and the model $f_1=v/(2L)$. A calibrated scenario scales
    the reference values by 1.1. Determine the fundamental frequency. Give a numerical answer.
  answer:
    value: 60.5
    tolerance: 0.6050000000000001
  explanation: Apply $f_1=v/(2L)$ consistently to the scaled scenario; the requested fundamental frequency
    is 60.5.
  media:
  - type: image
    src: /media/physics/owa/musical-sound-sources.svg
    alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
    caption: Sources of Musical Sound model diagram.
