    aliases:
    - monatomic ion
  explanation: 'Solution: A charged species consisting of one atom. Why it works: The definition identifies the exact model
    feature needed before applying a rule or drawing a conclusion.'
- id: r004
  type: typed
  prompt: Connect polyatomic ion to an observable or particle-level consequence.
