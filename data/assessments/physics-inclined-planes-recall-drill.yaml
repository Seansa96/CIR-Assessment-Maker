items:
  - { id: ir1, type: cloze, prompt: 'Gravity component down a slope is $mg____$.', answer: { expected: 'sin theta', expectedLatex: '\sin\theta', aliases: [], media: [] }, explanation: 'Solution: $\sin\theta$.\n\nWhy it works: It is parallel to the incline.', tags: [components] }
  - { id: ir2, type: cloze, prompt: 'Normal force on a frictionless incline is $mg____$.', answer: { expected: 'cos theta', expectedLatex: '\cos\theta', aliases: [], media: [] }, explanation: 'Solution: $\cos\theta$.\n\nWhy it works: The normal axis is perpendicular to the slope.', tags: [normal] }
  - { id: ir3, type: typed, prompt: 'What force opposes sliding down a rough incline?', answer: { expected: friction, expectedLatex: 'f', aliases: [], media: [] }, explanation: 'Solution: Friction.\n\nWhy it works: It opposes relative sliding.', tags: [friction] }
  - { id: ir4, type: typed, prompt: 'What axes simplify an incline problem?', answer: { expected: 'parallel and perpendicular to the incline', expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Parallel and perpendicular axes.\n\nWhy it works: Key contact forces align with them.', tags: [axes] }
  - { id: ir5, type: cloze, prompt: 'Kinetic friction on an incline is $\mu_k____$.', answer: { expected: N, expectedLatex: 'N', aliases: ['normal force'], media: [] }, explanation: 'Solution: Insert $N$.\n\nWhy it works: Kinetic friction is coefficient times normal force.', tags: [friction] }
  - { id: ir6, type: typed, prompt: 'What happens to the normal force as incline angle increases?', answer: { expected: decreases, expectedLatex: '', aliases: ['it decreases'], media: [] }, explanation: 'Solution: It decreases.\n\nWhy it works: $N=mg\cos\theta$.', tags: [normal] }
