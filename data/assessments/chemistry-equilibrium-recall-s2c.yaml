items:
  - { id: r1, type: typed, prompt: 'State the condition for dynamic equilibrium.', answer: { expected: 'forward and reverse rates are equal', aliases: ['equal forward and reverse rates'] }, explanation: 'Solution: Forward and reverse rates are equal. Why it works: Equal opposing rates give zero net change.' }
  - { id: r2, type: typed, prompt: 'For $aA+bB\rightleftharpoons cC$, write Kc.', answer: { expected: '[C]^c/([A]^a[B]^b)', aliases: ['products over reactants with coefficients as exponents'] }, explanation: 'Solution: $K_c=[C]^c/([A]^a[B]^b)$. Why it works: Products appear in numerator and coefficients become powers.' }
  - { id: r3, type: typed, prompt: 'Which pure phases are excluded from K expressions?', answer: { expected: 'pure solids and liquids', aliases: ['solids and liquids'] }, explanation: 'Solution: Pure solids and liquids. Why it works: Their activities are constant in this model.' }
  - { id: r4, type: recognition, prompt: 'If Q<K, the net reaction proceeds', choices: [{ id: a, text: forward }, { id: b, text: reverse }, { id: c, text: not at all }], answer: { choiceId: a }, explanation: 'Solution: Forward. Why it works: The product ratio must rise to reach K. Why the other choices fail: reverse lowers Q; no net change needs Q=K.' }
  - { id: r5, type: recognition, prompt: 'If Q>K, the net reaction proceeds', choices: [{ id: a, text: forward }, { id: b, text: reverse }, { id: c, text: equally in both directions with no adjustment }], answer: { choiceId: b }, explanation: 'Solution: Reverse. Why it works: The product ratio must fall to reach K. Why the other choices fail: forward raises Q; c describes Q=K.' }
  - { id: r6, type: typed, prompt: 'What do ICE-table letters stand for?', answer: { expected: 'initial change equilibrium' }, explanation: 'Solution: Initial, Change, Equilibrium. Why it works: Each row tracks a distinct stage of the reaction mixture.' }
  - { id: r7, type: typed, prompt: 'For $A\rightleftharpoons2B$, what B change accompanies an A change of $-x$?', answer: { expected: '+2x', aliases: ['2x'] }, explanation: 'Solution: $+2x$. Why it works: The balanced equation forms two B per A consumed.' }
  - { id: r8, type: typed, prompt: 'At fixed temperature, what does a catalyst change: K or time to equilibrium?', answer: { expected: 'time to equilibrium', aliases: ['time', 'rate of reaching equilibrium'] }, explanation: 'Solution: Time to equilibrium. Why it works: A catalyst speeds both directions without changing K.' }
  - { id: r9, type: typed, prompt: 'Which variable can change K?', answer: { expected: 'temperature' }, explanation: 'Solution: Temperature. Why it works: K depends on temperature, unlike a momentary concentration stress.' }
  - { id: r10, type: typed, prompt: 'Why does adding a reactant usually lower Q?', answer: { expected: 'reactant concentration is in the denominator', aliases: ['it increases the denominator'] }, explanation: 'Solution: It increases a denominator factor. Why it works: Q has the same reactant denominator structure as K.' }
  - { id: r11, type: typed, prompt: 'What must be checked after using a small-x approximation?', answer: { expected: 'that x is small relative to the initial concentration', aliases: ['the approximation is valid'] }, explanation: 'Solution: Check x is small relative to its starting value. Why it works: The approximation assumed that this change was negligible.' }
  - { id: r12, type: typed, prompt: 'Can equilibrium be reached starting with only products?', answer: { expected: 'yes' }, explanation: 'Solution: Yes. Why it works: A reversible system can approach the same equilibrium composition from either direction.' }
