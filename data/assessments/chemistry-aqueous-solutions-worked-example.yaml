- id: molarity-calculation
  title: Calculating and Using Molarity
  problem: '(a) Calculate the molarity of a solution prepared by dissolving 10.0 g
    of NaOH in enough water to make 250.0 mL of solution. (M(NaOH) = 40.00 g/mol)

    (b) How many grams of NaOH are needed to prepare 500.0 mL of 0.500 M NaOH?

    '
  steps:
  - id: step-molarity-calculation-1
    title: (a) Molarity from mass and volume
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Step 1: Convert mass to moles.

      $$

      n_{NaOH} = \frac{10.0 \text{ g}}{40.00 \text{ g/mol}} = 0.250 \text{ mol}

      $$


      Step 2: Convert volume to liters.

      $$

      V = 250.0 \text{ mL} \times \frac{1 \text{ L}}{1000 \text{ mL}} = 0.2500 \text{
      L}

      $$


      Step 3: Calculate molarity.

      $$

      M = \frac{n}{V} = \frac{0.250 \text{ mol}}{0.2500 \text{ L}} = 1.00 \text{ M}

      $$

      '
  - id: step-molarity-calculation-2
    title: (b) Mass needed for a target concentration
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Work backwards from M and V to moles, then to grams.


      $$

      n_{NaOH} = M \times V = 0.500 \text{ M} \times 0.5000 \text{ L} = 0.250 \text{
      mol}

      $$


      $$

      m_{NaOH} = 0.250 \text{ mol} \times 40.00 \text{ g/mol} = 10.0 \text{ g}

      $$

      '
  check:
    id: molarity-check
    type: numericResponse
    prompt: 'What is the molarity of a solution prepared by dissolving 58.5 g of NaCl
      (M = 58.44 g/mol) in enough water to make 2.00 L?

      '
    answer:
      value: 0.5
      tolerance: 0.005
- id: dilution
  title: Dilution Calculation
  problem: 'A lab requires 1.00 L of 0.250 M HCl solution. The lab stock is 12.0 M
    (concentrated) HCl. What volume of the concentrated HCl must be diluted?

    '
  steps:
  - id: step-dilution-1
    title: Step 1 — Apply the dilution equation
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      M_1 V_1 = M_2 V_2

      $$


      - M1 = 12.0 M (concentrated stock)

      - V1 = ? (volume to transfer)

      - M2 = 0.250 M (desired concentration)

      - V2 = 1.00 L (desired final volume)

      '
  - id: step-dilution-2
    title: Step 2 — Solve for V1
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      V_1 = \frac{M_2 V_2}{M_1} = \frac{0.250 \text{ M} \times 1.00 \text{ L}}{12.0
      \text{ M}} = 0.0208 \text{ L} = 20.8 \text{ mL}

      $$


      **Procedure:** Measure 20.8 mL of concentrated HCl into a volumetric flask,
      then carefully add deionized water until the total volume reaches exactly 1.00
      L.


      **Safety note:** Always add acid to water, never water to acid. The dilution
      of concentrated H2SO4 or HCl is highly exothermic.

      '
  check:
    id: dilution-check
    type: numericResponse
    prompt: 'How many mL of 6.00 M NaOH stock solution are needed to prepare 250.0
      mL of 0.400 M NaOH?

      '
    answer:
      value: 16.7
      tolerance: 0.2
    explanation: 'V1 = M2×V2/M1 = (0.400 × 0.2500) / 6.00 = 0.01000/6.00 = 1.667 ×
      10-2 L = 16.7 mL.

      '
- id: classify-electrolytes
  title: Classifying Solutes as Electrolytes
  problem: 'Classify each of the following as a strong electrolyte, weak electrolyte,
    or nonelectrolyte, and write the dissolution or ionization equation:

    (a) Ca(OH)2

    (b) HF

    (c) C12H22O11 (sucrose/table sugar)

    '
  steps:
  - id: step-classify-electrolytes-1
    title: (a) Ca(OH)2 — Strong Electrolyte
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Calcium hydroxide is the hydroxide of a Group 2A alkaline earth
      metal (heavier member, soluble). It is a **strong base** — a strong electrolyte.


      Dissolution equation (complete dissociation):

      $$

      \text{Ca(OH)}_2(s) \rightarrow \text{Ca}^{2+}(aq) + 2\text{OH}^{-}(aq)

      $$

      '
  - id: step-classify-electrolytes-2
    title: (b) HF — Weak Electrolyte
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Hydrofluoric acid (HF) is **not** one of the six strong acids. Despite
      fluorine''s high electronegativity, the H-F bond is very strong, so HF only
      partially dissociates.


      Ionization equation (partial, using equilibrium arrow):

      $$

      \text{HF}(aq) \rightleftharpoons \text{H}^{+}(aq) + \text{F}^{-}(aq)

      $$


      HF is a **weak electrolyte**.

      '
  - id: step-classify-electrolytes-3
    title: (c) C12H22O11 — Nonelectrolyte
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Sucrose is a large molecular organic compound. It dissolves in water
      (it''s very water-soluble due to many OH groups), but it does not release any
      ions.


      $$

      \text{C}_{12}\text{H}_{22}\text{O}_{11}(s) \xrightarrow{H_2O} \text{C}_{12}\text{H}_{22}\text{O}_{11}(aq)

      $$


      It remains intact as neutral molecules — a **nonelectrolyte**.

      '
  check:
    id: classify-check
    type: multipleChoice
    prompt: 'Which of the following dissolves in water to produce a solution that
      does NOT conduct electricity?

      '
    choices:
    - id: a
      text: CH3OH (methanol)
    - id: b
      text: HNO3 (nitric acid — strong acid)
    - id: c
      text: K2SO4 (potassium sulfate — soluble ionic salt)
    - id: d
      text: HF (hydrofluoric acid — weak acid)
    answer:

      choiceId: a
    explanation: 'Methanol (CH3OH) is a nonelectrolyte — it dissolves completely in
      water but produces no ions, so it does not conduct electricity. HNO3 is a strong
      acid (strong electrolyte), K2SO4 is a soluble ionic salt (strong electrolyte),
      and HF is a weak electrolyte (partial conduction).

      '
