schemaVersion: 1
id: physics-static-equilibrium-tension-concept-lesson
title: Static Equilibrium and Tension
assessmentType: conceptLesson
categoryId: physics-1
topicId: physics-static-equilibrium-tension
skills: [Apply Newton's Laws and Force Models, free-body-diagram, tension, static-equilibrium]
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [physics-1, physics-static-equilibrium-tension, tension, force-balance]
authoring:
  visualRequirement: required
  visualRationale: Tension directions and component balance are inherently geometric and require a force diagram.
  physicsModel:
    modelId: staticEquilibrium
    modelRole: foundation
    requiredRepresentations: [systemBoundary, freeBodyDiagram, coordinateAxes, forceComponents, motionConstraint]
lesson:
  introduction: Static equilibrium means every acceleration component is zero. It does not mean that forces are absent or that every force has the same magnitude.
  sections:
  - id: define-equilibrium
    title: Translate rest into equations
    content: A body at rest has $a_x=a_y=0$, so Newton's second law gives $\sum F_x=0$ and $\sum F_y=0$. Begin by selecting the junction, sign, or hanging object whose forces you will balance.
    media:
    - type: image
      src: /media/physics/worked-examples/two-string-tension-components.svg
      alt: A hanging mass supported by two angled strings with tension vectors and a downward weight vector.
      caption: The vectors can be nonzero while their horizontal and vertical sums vanish.
    check:
      id: define-equilibrium-check
      type: multipleChoice
      prompt: A sign hangs motionless from two cables. Which statement is true?
      choices:
      - { id: a, text: The net force is zero }
      - { id: b, text: Each cable has zero tension }
      - { id: c, text: Weight is absent }
      - { id: d, text: No force diagram is needed }
      answer: { choiceId: a }
      explanation: Static equilibrium requires the vector sum of real forces to vanish, not each individual force.
  - id: isolate-junction
    title: Isolate the force-bearing object
    content: For two strings meeting at a knot, draw the knot as the system. Each tension arrow points away from the knot along its string, and the load or third string supplies the remaining interaction.
    check:
      id: isolate-junction-check
      type: multipleChoice
      prompt: On an FBD of a knot, which direction does a string's tension point?
      choices:
      - { id: a, text: Away from the knot along the string }
      - { id: b, text: Toward the knot regardless of the system }
      - { id: c, text: Always vertically upward }
      - { id: d, text: Perpendicular to the string }
      answer: { choiceId: a }
      explanation: A taut string pulls the selected object along the string toward the other end, so the arrow leaves the knot toward that end.
  - id: choose-axes
    title: Choose axes and resolve angled tensions
    content: Use horizontal and vertical axes when cables have quoted angles. A tension at angle $\theta$ above horizontal has components $T\cos\theta$ horizontally and $T\sin\theta$ vertically.
    check:
      id: choose-axes-check
      type: multipleChoice
      prompt: A cable makes $30^\circ$ above horizontal. Which is its upward component?
      choices:
      - { id: a, text: $T\sin30^\circ$ }
      - { id: b, text: $T\cos30^\circ$ }
      - { id: c, text: $T\tan30^\circ$ }
      - { id: d, text: $T/30$ }
      answer: { choiceId: a }
      explanation: The vertical side is opposite an angle measured from the horizontal, so it uses sine.
  - id: horizontal-balance
    title: Balance horizontal components
    content: In a symmetric support, horizontal components cancel. In an asymmetric support, write their signed sum explicitly; a cable may carry a large horizontal component even when the load is vertical.
    check:
      id: horizontal-balance-check
      type: multipleChoice
      prompt: Why can two angled cables support a vertical load without horizontal acceleration?
      choices:
      - { id: a, text: Their horizontal components sum to zero }
      - { id: b, text: Tension has no horizontal component }
      - { id: c, text: Gravity cancels horizontal forces }
      - { id: d, text: The mass removes one cable }
      answer: { choiceId: a }
      explanation: Equilibrium must be satisfied independently in each axis.
  - id: vertical-balance
    title: Balance vertical components
    content: The upward components must total the downward load. For symmetric cables, $2T\sin\theta=mg$ when $\theta$ is measured above horizontal.
    check:
      id: vertical-balance-check
      type: multipleChoice
      prompt: If two identical cables become nearly horizontal while holding the same load, what happens to their tension?
      choices:
      - { id: a, text: It increases sharply }
      - { id: b, text: It becomes zero }
      - { id: c, text: It always equals half the weight }
      - { id: d, text: It is unrelated to cable angle }
      answer: { choiceId: a }
      explanation: Each cable then has a small vertical component, so a larger tension is needed to supply the same upward total.
  - id: constraint-check
    title: Check the physical tension constraint
    content: Ideal massless strings transmit one tension along a straight segment, but strings can only pull. A negative computed tension signals that the assumed taut geometry cannot be maintained.
    check:
      id: constraint-check-check
      type: multipleChoice
      prompt: What does a negative tension from an equilibrium calculation usually mean?
      choices:
      - { id: a, text: The assumed direction or taut-string model is inconsistent }
      - { id: b, text: Strings push }
      - { id: c, text: Gravity changed sign }
      - { id: d, text: The force is automatically zero }
      answer: { choiceId: a }
      explanation: Tension is a pulling interaction; revisit the model or the chosen force direction.
  - id: audit-force-pairs
    title: Audit common force-pair errors
    content: Do not put the force of the load on the cable onto the load's own FBD. Third-law partners act on different bodies. Equilibrium equations include only forces acting on the selected system.
    check:
      id: audit-force-pairs-check
      type: multipleChoice
      prompt: Which force belongs on the FBD of the hanging sign?
      choices:
      - { id: a, text: Each cable's force on the sign }
      - { id: b, text: The sign's force on each cable }
      - { id: c, text: The sign's force on Earth }
      - { id: d, text: A force equal to $ma$ }
      answer: { choiceId: a }
      explanation: An FBD lists forces exerted on the selected sign, not its reactions on other objects.
