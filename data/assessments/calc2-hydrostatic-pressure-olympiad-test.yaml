questions:
- id: q001
  type: freeResponse
  skills:
  - hydrostatic-pressure
  - olympiad-problem-solving
  prompt: A vertical rectangular plate of width $2$ m extends from the water surface to depth $2$ m. Using water weight density $9800$ N/m$^3$, find the hydrostatic force.
  answer:
    gradingMode: selfCheck
    expected: $39200$ N.
    keyPoints:
    - 'Matches the reference result: $39200$ N.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: A horizontal strip at depth $y$ has pressure $9800y$ and area $2dy$. Thus $F=98002\int_0^2y\,dy=196002$.
