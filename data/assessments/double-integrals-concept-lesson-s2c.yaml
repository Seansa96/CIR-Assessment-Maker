  - id: s02
    title: Iterated integrals encode bounds
    required: true
    content: Inner bounds describe a slice; outer bounds move that slice across the region. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
