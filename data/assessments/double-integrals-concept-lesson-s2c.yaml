  - id: s04
    title: Worked micro-example
    required: true
    content: 'Use the short task Evaluate $\int_0^2\int_0^3(x+y)\,dy\,dx$. as a model. First, integrate the inner variable: What is $\int_0^3(x+y)dy$? The resulting statement is $3x+9/2$. This identifies the governing relation and gives a checkable intermediate result.'
