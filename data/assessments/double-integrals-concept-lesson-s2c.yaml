lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 1 → Riemann Integration if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Accumulate over a region
    required: true
    content: 'A double integral adds values across area elements in a planar region. In Double Integrals, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
