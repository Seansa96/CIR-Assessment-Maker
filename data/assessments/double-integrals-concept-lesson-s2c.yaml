          domains: []
      - id: c
        text: a slice (answers 'What do inner bounds describe?', not 'What differential represents area in rectangular coordinates?')
        media: []
        issueSignals:
        - id: integration-bounds-error
          domains: []
      - id: d
        text: a new region description (answers 'What does changing order require?', not 'What differential represents area in rectangular coordinates?')
