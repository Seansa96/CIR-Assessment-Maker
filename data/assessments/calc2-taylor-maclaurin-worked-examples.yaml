- id: we-taylor-maclaurin-1
  title: Construct the Maclaurin series for $e^{2x}$
  problem: >
    Derive the Maclaurin series for $f(x)=e^{2x}$ directly from the Taylor

    coefficient formula and state its radius of convergence.


    ![Taylor polynomials matching a function near a center](/assessments/calc2-infinite-series/taylor-polynomial-imitation-sinx.svg)
  steps:
  - id: step-taylor-maclaurin-1-1
    title: Compute the derivative pattern
    instruction: >
      Repeated differentiation gives

      $$f^{(n)}(x)=2^n e^{2x}.$$

      Evaluating at the center $0$ gives $f^{(n)}(0)=2^n$.
    hint: 
    type: multipleChoice
    prompt: What is $f^{(3)}(0)$?
    choices:
    - id: a
      text: $6$
      media: []
      issueSignals: []
    - id: b
      text: $8$
      media: []
      issueSignals: []
    - id: c
      text: $e^6$
      media: []
      issueSignals: []
    - id: d
      text: $0$
      media: []
      issueSignals: []
    answer:
      choiceId: b
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >-
      Solution: Each derivative contributes another factor of two, and $e^0=1$. Therefore the answer is $8$.


      Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.


      Common trap: Do not confuse the derivative value with its Taylor coefficient; the factorial belongs in every coefficient, including the constant term where $0!=1$.


      Why the other choices fail: $6$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $e^6$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $0$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$.
