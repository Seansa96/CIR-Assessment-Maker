    title: Insert the coefficients
    instruction: >
      The Maclaurin formula is

      $$f(x)=\sum_{n=0}^{\infty}\frac{f^{(n)}(0)}{n!}x^n

      =\sum_{n=0}^{\infty}\frac{2^n x^n}{n!}.$$
