    entries:
      - { id: net-force, term: Net force, definition: 'The vector sum of all external forces on a system.', drills: [{ id: ddg1, type: cloze, prompt: 'Net force equals mass times ____.', answer: { expected: acceleration, expectedLatex: 'a', aliases: [], media: [] }, explanation: 'Solution: Acceleration.\n\nWhy it works: $\sum F=ma$.' }] }
      - { id: free-body-diagram, term: Free-body diagram, definition: 'A diagram showing all external forces acting on a chosen system.', drills: [{ id: ddg2, type: typed, prompt: 'What does an FBD show?', answer: { expected: 'external forces', expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: External forces.\n\nWhy it works: It isolates the system.' }] }
      - { id: normal-force, term: Normal force, definition: 'A contact force perpendicular to a surface.', drills: [{ id: ddg3, type: cloze, prompt: 'Normal force is ____ to the surface.', answer: { expected: perpendicular, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Perpendicular.\n\nWhy it works: Normal means perpendicular.' }] }
      - { id: system-boundary, term: System boundary, definition: 'The choice that separates the objects being analyzed from their surroundings.', drills: [{ id: ddg4, type: typed, prompt: 'Why choose a system boundary?', answer: { expected: 'identify external forces', expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: To identify external forces.\n\nWhy it works: Boundary choice classifies interactions.' }] }
