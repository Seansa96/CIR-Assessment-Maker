questions:
  - id: q001
    type: numericResponse
    prompt: 'How many moles are in 18.0 g of water, $H_2O$? Use 18.02 g/mol.'
    answer: { value: 0.999, tolerance: 0.002 }
    explanation: 'Solution: $18.0\text{ g}/18.02\text{ g mol}^{-1}=0.999\text{ mol}$. Why it works: Molar mass supplies the grams-to-moles conversion factor.'
    difficultyDimensions: [unitConversion, quantitativeReasoning]
    difficultyEvidence: 'Requires selecting and applying a molar-mass conversion.'
    prerequisiteObjectiveIds: [chem1-quantitative-pipeline]
    extensionObjectiveIds: [chem1-gas-solution-models]
    issueSignals: [{ id: molar-mass-calculation-error }]
  - id: q002
    type: multipleChoice
    prompt: 'Which net ionic equation represents precipitation when aqueous silver nitrate and sodium chloride are mixed?'
    choices:
      - { id: a, text: '$Ag^+(aq)+Cl^-(aq)\rightarrow AgCl(s)$', issueSignals: [] }
      - { id: b, text: '$AgNO_3(aq)+NaCl(aq)\rightarrow AgCl(aq)+NaNO_3(aq)$', issueSignals: [{ id: precipitate-solubility-error }] }
      - { id: c, text: '$Na^+(aq)+NO_3^-(aq)\rightarrow NaNO_3(s)$', issueSignals: [{ id: precipitate-solubility-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. Why it works: Silver chloride is insoluble, while sodium and nitrate ions remain dissolved spectators. Why the other choices fail: b keeps soluble strong electrolytes intact and labels AgCl incorrectly; c combines spectator ions that do not precipitate.'
    difficultyDimensions: [solubilityReasoning, ionicRepresentation, reactionPrediction]
    difficultyEvidence: 'Requires translating a molecular reaction into net ionic form.'
    prerequisiteObjectiveIds: [chem1-aqueous-reaction-model]
    extensionObjectiveIds: [chem1-quantitative-pipeline]
    issueSignals: [{ id: precipitate-solubility-error }]
  - id: q003
    type: numericResponse
    prompt: 'A 0.500 mol sample of an ideal gas occupies 12.3 L at 300. K. Find its pressure in atm using $R=0.08206\ \mathrm{L\,atm\,mol^{-1}\,K^{-1}}$.'
    answer: { value: 1.0, tolerance: 0.02 }
    explanation: 'Solution: $P=nRT/V=(0.500)(0.08206)(300.)/12.3=1.00\text{ atm}$. Why it works: The ideal-gas law relates the amount, absolute temperature, volume, and pressure of the same gas sample.'
    difficultyDimensions: [formulaSelection, algebraicRearrangement, units]
    difficultyEvidence: 'Uses an absolute temperature and a multivariable physical model.'
    prerequisiteObjectiveIds: [chem1-gas-solution-models]
    extensionObjectiveIds: [chem1-quantitative-pipeline]
    issueSignals: [{ id: ideal-gas-law-misapplied }]
  - id: q004
    type: numericResponse
    prompt: 'What is the molarity of a solution made by dissolving 0.250 mol NaCl to make 500. mL of solution?'
    answer: { value: 0.5, tolerance: 0.002 }
    explanation: 'Solution: Convert $500.\text{ mL}$ to $0.500\text{ L}$, then $M=0.250/0.500=0.500\text{ M}$. Why it works: Molarity is moles of solute per liter of solution.'
    difficultyDimensions: [volumeConversion, concentrationCalculation, units]
    difficultyEvidence: 'Combines metric conversion with concentration definition.'
    prerequisiteObjectiveIds: [chem1-gas-solution-models]
    extensionObjectiveIds: [chem1-aqueous-reaction-model]
    issueSignals: [{ id: molarity-molality-confusion }]
  - id: q005
    type: multipleChoice
    prompt: 'Which molecule is nonpolar even though it contains polar C=O bonds?'
    choices:
      - { id: a, text: '$CO_2$, because its linear bond dipoles cancel', issueSignals: [] }
      - { id: b, text: '$H_2O$, because its bent bond dipoles cancel', issueSignals: [{ id: chemistry-bonding-polarity-vector-error }] }
      - { id: c, text: '$NH_3$, because its trigonal-pyramidal bond dipoles cancel', issueSignals: [{ id: chemistry-bonding-polarity-vector-error }] }
    answer: { choiceId: a }
    explanation: 'Solution: Choose a. Why it works: The two equal C=O dipoles in linear carbon dioxide point in opposite directions. Why the other choices fail: b and c have asymmetric molecular geometries, so their bond dipoles do not cancel.'
    difficultyDimensions: [vseprGeometry, vectorReasoning, polarityModel]
    difficultyEvidence: 'Combines bond polarity with three-dimensional molecular geometry.'
    prerequisiteObjectiveIds: [chem1-structure-properties]
    extensionObjectiveIds: [chem1-gas-solution-models]
    issueSignals: [{ id: chemistry-bonding-polarity-vector-error }]
  - id: q006
    type: numericResponse
    prompt: 'A reaction warms 100.0 g of water by $5.00^\circ\mathrm{C}$. Find $q$ for the water in kJ using $c=4.184\ \mathrm{J\,g^{-1}\,^\circ C^{-1}}$.'
    answer: { value: 2.092, tolerance: 0.01 }
    explanation: 'Solution: $q=mc\Delta T=(100.0)(4.184)(5.00)=2092\text{ J}=2.092\text{ kJ}$. Why it works: Specific heat relates a sample''s mass and temperature change to transferred heat.'
    difficultyDimensions: [calorimetryModel, unitConversion, quantitativeReasoning]
    difficultyEvidence: 'Requires a heat calculation and joule-to-kilojoule conversion.'
    prerequisiteObjectiveIds: [chem1-energy-model]
    extensionObjectiveIds: [chem1-quantitative-pipeline]
    issueSignals: [{ id: calorimetry-calculation-error }]
