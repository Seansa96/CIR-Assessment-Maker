lesson:
  introduction: 'This lesson introduces Deadlocks through the mental models emphasized by 6 Deadlocks. Focus on what the OS
    is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: deadlock-condition
    title: Deadlock condition
    required: true
    content: 'Deadlock occurs when a set of processes cannot proceed because each waits for resources held by others.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Deadlock is not just slowness or contention.

      '
    check:
      id: deadlock-condition-check
      title: 'Check: Deadlock condition'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Deadlock condition**?

        '
      choices:
      - id: a
        text: Deadlock occurs when a set of processes cannot proceed because each waits for resources held by others.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Deadlock occurs when a set of processes cannot proceed because each waits for resources held by others.
        Related topic: Deadlocks.

        '
  - id: coffman-conditions
    title: Coffman conditions
    required: true
    content: 'Mutual exclusion, hold-and-wait, no preemption, and circular wait must all hold for deadlock.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Breaking any one condition can prevent deadlock.

      '
    check:
      id: coffman-conditions-check
      title: 'Check: Coffman conditions'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Coffman conditions**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Mutual exclusion, hold-and-wait, no preemption, and circular wait must all hold for deadlock.
      answer:
        choiceId: d
      explanation: 'Mutual exclusion, hold-and-wait, no preemption, and circular wait must all hold for deadlock. Related
        topic: Deadlocks.

        '
  - id: resource-allocation-graph
    title: Resource allocation graph
    required: true
    content: 'A resource graph visualizes processes, resources, holdings, and requests.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A cycle is suspicious, but interpretation depends on resource instance counts.

      '
    check:
      id: resource-allocation-graph-check
      title: 'Check: Resource allocation graph'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Resource allocation graph**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: A resource graph visualizes processes, resources, holdings, and requests.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'A resource graph visualizes processes, resources, holdings, and requests. Related topic: Deadlocks.

        '
  - id: deadlock-detection
    title: Deadlock detection
    required: true
    content: 'Detection allows deadlock to happen, then identifies it for recovery.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Detection requires a recovery policy.

      '
    check:
      id: deadlock-detection-check
      title: 'Check: Deadlock detection'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Deadlock detection**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Detection allows deadlock to happen, then identifies it for recovery.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Detection allows deadlock to happen, then identifies it for recovery. Related topic: Deadlocks.

        '
  - id: deadlock-prevention
    title: Deadlock prevention
    required: true
    content: 'Prevention structurally denies at least one necessary condition.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Prevention can reduce resource utilization or flexibility.

      '
    check:
      id: deadlock-prevention-check
      title: 'Check: Deadlock prevention'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Deadlock prevention**?

        '
      choices:
      - id: a
        text: Prevention structurally denies at least one necessary condition.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Prevention structurally denies at least one necessary condition. Related topic: Deadlocks.

        '
  - id: deadlock-avoidance
    title: Deadlock avoidance
    required: true
    content: 'Avoidance uses runtime knowledge to stay in safe states.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Avoidance needs information that may not be available.

      '
    check:
      id: deadlock-avoidance-check
