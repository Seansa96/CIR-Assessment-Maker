lesson:
  introduction: A family-to-ODE derivation must eliminate parameters without silently discarding branches or geometric
    restrictions.
  sections:
  - id: s1
    title: Eliminate a family parameter
    required: true
    content: Differentiate a one-parameter relation once and use the original relation to remove the parameter.
      The resulting ODE describes local slopes of family members where the algebra is valid.
    media: []
    check:
      id: q001
      type: multipleChoice
      prompt: For $y=cx^2$, which ODE results after eliminating $c$?
      skills:
      - ede-ch04-first-order-applications-curves
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-curves
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Since $c=y/x^2$, differentiation gives $y'=2cx=2y/x$ for $x\ne0$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y'=2y/x$
      - id: b
        text: $y'=2cx$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y'=y/x^2$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y''=0$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Lost branches and envelopes
    required: true
    content: Division or solving for a parameter can remove singular members or an envelope. The derived equation
      must be checked against the original family and against values where the elimination step was invalid.
    media:
    - type: image
      src: /media/ede/ch04-curve-envelope.svg
      alt: A one-parameter line family tangent to its envelope with the eliminated parameter and singular curve
        marked.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q002
      type: multipleChoice
      prompt: Why inspect a factor divided out during elimination?
      skills:
      - ede-ch04-first-order-applications-geometric-curve-fields
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-geometric-curve-fields
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Division excludes the factor's zero set, which may still have geometric meaning.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Its zero set may represent a lost branch or envelope
      - id: b
        text: It changes the independent variable
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: It guarantees orthogonality
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: It supplies an initial condition
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Tangent-line families
    required: true
    content: For $y=cx-c^2$, differentiation gives $y'=c$, so elimination yields $y=xy'-(y')^2$. The envelope comes
      from optimizing over $c$ and is not merely another fixed-$c$ line.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: What is the envelope of $y=cx-c^2$?
      skills:
      - ede-ch04-first-order-applications-geometric-curve-fields
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-geometric-curve-fields
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $\partial y/\partial c=x-2c=0$ gives $c=x/2$ and $y=x^2/4$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y=x^2/4$
      - id: b
        text: $y=x^2$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y=-x^2/4$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y=x/2$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Translate geometric conditions
    required: true
    content: Statements about tangent intercepts, normals, or angles must be expressed using the point $(x,y)$ and
      slope $y'$. A diagram helps identify signed lengths before algebra begins.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: A tangent at $(x,y)$ has x-intercept $a$. Which relation follows from point-slope form?
      skills:
      - ede-ch04-first-order-applications-geometric-curve-fields
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-geometric-curve-fields
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Setting $Y=0$ at $X=a$ in $Y-y=y'(X-x)$ gives $-y=y'(a-x)$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y'=y/(x-a)$
      - id: b
        text: $y'=(x-a)/y$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y'=y/x$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y'=a$
        issueSignals:
        - id: ede-curves-lost-branch-envelope-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: Orthogonal trajectories
    required: true
    content: At a regular intersection, perpendicular slopes satisfy $m_1m_2=-1$. Vertical or zero slopes require
      geometric care rather than blind division by zero.
    media:
    - type: image
      src: /media/ede/ch04-orthogonal-field-lines.svg
      alt: Level curves crossed at right angles by heat-flow or force-field trajectories.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q005
      type: multipleChoice
      prompt: The family slope is $-x/y$. What is the regular orthogonal slope?
      skills:
      - ede-ch04-first-order-applications-curves
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-curves
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The negative reciprocal of $-x/y$ is $y/x$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y/x$
      - id: b
        text: $x/y$
        issueSignals:
        - id: ede-curves-orthogonal-slope-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $-y/x$
        issueSignals:
        - id: ede-curves-orthogonal-slope-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $-x/y$
        issueSignals:
        - id: ede-curves-orthogonal-slope-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Physical field-line interpretations
    required: true
    content: Isotherms and equipotentials are level curves. Heat-flow lines or conservative force lines follow gradient
      directions and therefore meet regular level curves orthogonally.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: Why do gradient field lines meet regular level curves orthogonally?
      skills:
      - ede-ch04-first-order-applications-geometric-curve-fields
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-geometric-curve-fields
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Directional change along a level curve is zero, so its tangent is perpendicular to the gradient.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The gradient is normal to a level curve
      - id: b
        text: Their slopes are always equal
        issueSignals:
        - id: ede-curves-orthogonal-slope-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Every level curve is a circle
        issueSignals:
        - id: ede-curves-orthogonal-slope-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: The parameter is constant in time
        issueSignals:
        - id: ede-curves-orthogonal-slope-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
