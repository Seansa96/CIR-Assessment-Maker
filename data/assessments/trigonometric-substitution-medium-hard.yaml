- id: q009
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{\sqrt{25-x^2}}{x^2}\,dx

    $$

    '
  answer:
    expectedLatex: -\frac{\sqrt{25-x^2}}{x}-\arcsin\left(\frac{x}{5}\right)+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Use $x=5\sin\theta$, which converts the integrand into $\cot^2\theta$.


    Related topic: Sine Substitution Reciprocal Forms

    '
- id: q010
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{dx}{x^2\sqrt{4-x^2}}

