questions:
- id: q001
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{x^2}{\sqrt{9-x^2}}\,dx

    $$

    '
  answer:
    expectedLatex: \frac{9}{2}\arcsin\left(\frac{x}{3}\right)-\frac{x}{2}\sqrt{9-x^2}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Use $x=3\sin\theta$, then reduce the resulting $\sin^2\theta$ integral.


    Related topic: Sine Substitution with Powers

    '
- id: q002
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \sqrt{x^2+9}\,dx

    $$

    '
  answer:
    expectedLatex: \frac{x}{2}\sqrt{x^2+9}+\frac{9}{2}\ln|x+\sqrt{x^2+9}|+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Use $x=3\tan\theta$ and convert the secant expression back to $x$.


    Related topic: Tangent Substitution with Radical Numerators

    '
- id: q003
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \sqrt{x^2-16}\,dx

    $$

    '
  answer:
    expectedLatex: \frac{x}{2}\sqrt{x^2-16}-8\ln|x+\sqrt{x^2-16}|+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Use $x=4\sec\theta$ and simplify the resulting secant-tangent expression.


    Related topic: Secant Substitution with Radical Numerators

    '
- id: q004
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{dx}{(x^2+4)^{3/2}}

    $$

    '
  answer:
    expectedLatex: \frac{x}{4\sqrt{x^2+4}}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Differentiate $\frac{x}{4\sqrt{x^2+4}}$ to verify the result.


    Related topic: Tangent Substitution with Three-Halves Powers

    '
- id: q005
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{dx}{(9-x^2)^{3/2}}

    $$

    '
  answer:
    expectedLatex: \frac{x}{9\sqrt{9-x^2}}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'This follows from the derivative of $\frac{x}{\sqrt{9-x^2}}$.


    Related topic: Sine Substitution with Three-Halves Powers

    '
- id: q006
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{x^3}{\sqrt{16-x^2}}\,dx

    $$

    '
  answer:
    expectedLatex: -16\sqrt{16-x^2}+\frac{1}{3}(16-x^2)^{3/2}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'A substitution $u=16-x^2$ appears after separating one factor of $x$.


    Related topic: Powers with $a^2-x^2$ Radicals

    '
- id: q007
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{x^3}{\sqrt{x^2+9}}\,dx

    $$

    '
  answer:
    expectedLatex: \frac{1}{3}(x^2+9)^{3/2}-9\sqrt{x^2+9}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=x^2+9$ after writing $x^3=x^2\cdot x$.


    Related topic: Powers with $x^2+a^2$ Radicals

    '
- id: q008
  type: symbolicResponse
  prompt: 'Evaluate the integral using trigonometric substitution.


    $$

    \int \frac{dx}{x^2\sqrt{x^2-9}}

