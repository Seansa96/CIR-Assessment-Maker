lesson:
  introduction: Build a reliable model of distinguishing ionic and covalent compounds by separating electron accounting, particle
    representation, and observable evidence.
  sections:
  - id: composition
    title: Use composition as a first pass
    required: true
    content: A metal combined with a nonmetal or a formula containing recognized cations and anions usually indicates an ionic
      compound. Only nonmetals usually indicate a molecular or network-covalent substance.
    check:
      id: chk-composition
      type: multipleChoice
      prompt: Which statement correctly applies the idea of use composition as a first pass?
      choices:
      - id: a
        text: K2S is classified as ionic from K+ and S2- ions.
        issueSignals: []
      - id: b
        text: K2S is molecular because it contains two element symbols.
        issueSignals:
        - id: chemistry-bonding-classification-error
      - id: c
        text: Every compound containing oxygen is ionic.
        issueSignals:
        - id: chemistry-bonding-classification-error
      answer:
        choiceId: a
      explanation: 'Solution: K2S is classified as ionic from K+ and S2- ions. Why it works: A metal combined with a nonmetal
        or a formula containing recognized cations and anions usually indicates an ionic compound. Only nonmetals usually
        indicate a molecular or network-covalent substance. Why the other choices fail: The other statements either reverse
        the relevant electron or charge accounting or apply a structural model outside its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-classification-evidence.svg
      alt: Instructional workflow for distinguishing ionic and covalent compounds showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: particle-unit
    title: Identify the representative particle
    required: true
    content: Ionic formulas describe ratios in an extended lattice; molecular formulas describe discrete molecules. Network
      covalent solids are extended but do not consist of ions.
    check:
      id: chk-particle-unit
      type: multipleChoice
      prompt: Which statement correctly applies the idea of identify the representative particle?
      choices:
      - id: a
        text: CO2 commonly represents discrete molecules, while NaCl represents a formula-unit ratio.
        issueSignals: []
      - id: b
        text: NaCl consists of isolated NaCl molecules in its crystal.
        issueSignals:
        - id: chemistry-bonding-classification-error
      - id: c
        text: Every extended solid must be ionic.
        issueSignals:
        - id: chemistry-bonding-classification-error
      answer:
        choiceId: a
      explanation: 'Solution: CO2 commonly represents discrete molecules, while NaCl represents a formula-unit ratio. Why
        it works: Ionic formulas describe ratios in an extended lattice; molecular formulas describe discrete molecules. Network
        covalent solids are extended but do not consist of ions. Why the other choices fail: The other statements either reverse
        the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: properties
    title: Use properties as evidence
    required: true
    content: High melting point and conduction when molten or dissolved support mobile-ion behavior. Low melting molecular
      substances and poor electrical conduction support neutral particles, but no single property should be treated as conclusive
      alone.
    check:
      id: chk-properties
      type: multipleChoice
      prompt: Which statement correctly applies the idea of use properties as evidence?
      choices:
      - id: a
        text: A high-melting solid that conducts when molten is consistent with an ionic model.
        issueSignals: []
      - id: b
        text: Any solid that fails to conduct is necessarily molecular.
        issueSignals:
        - id: chemistry-bonding-classification-error
      - id: c
        text: A low melting point proves a substance contains metal ions.
        issueSignals:
        - id: chemistry-bonding-classification-error
      answer:
        choiceId: a
      explanation: 'Solution: A high-melting solid that conducts when molten is consistent with an ionic model. Why it works:
        High melting point and conduction when molten or dissolved support mobile-ion behavior. Low melting molecular substances
        and poor electrical conduction support neutral particles, but no single property should be treated as conclusive alone.
        Why the other choices fail: The other statements either reverse the relevant electron or charge accounting or apply
        a structural model outside its stated scope.'
  - id: solutions
    title: Interpret conductivity carefully
    required: true
    content: An ionic substance conducts in solution only if it dissolves and produces mobile ions. Some molecular substances
      react with water to form ions, so solution conductivity must be combined with chemical evidence.
    check:
      id: chk-solutions
      type: multipleChoice
      prompt: Which statement correctly applies the idea of interpret conductivity carefully?
      choices:
      - id: a
        text: Conducting aqueous HCl does not mean pure HCl is an ionic lattice.
        issueSignals: []
      - id: b
        text: Every conducting solution came from an ionic solid.
        issueSignals:
        - id: chemistry-bonding-classification-error
      - id: c
        text: Dissolving always leaves particles electrically neutral.
        issueSignals:
        - id: chemistry-bonding-classification-error
      answer:
        choiceId: a
      explanation: 'Solution: Conducting aqueous HCl does not mean pure HCl is an ionic lattice. Why it works: An ionic substance
        conducts in solution only if it dissolves and produces mobile ions. Some molecular substances react with water to
        form ions, so solution conductivity must be combined with chemical evidence. Why the other choices fail: The other
        statements either reverse the relevant electron or charge accounting or apply a structural model outside its stated
        scope.'
  - id: continuum
    title: Avoid a rigid cutoff
    required: true
    content: Electronegativity difference can support a bond-polarity argument, but bonding character is a continuum and bulk
      classification also depends on structure and particle organization.
    check:
      id: chk-continuum
      type: multipleChoice
      prompt: Which statement correctly applies the idea of avoid a rigid cutoff?
      choices:
      - id: a
        text: Electronegativity difference is evidence, not an infallible classification threshold.
        issueSignals: []
      - id: b
        text: A difference of exactly 1.7 changes every bond discontinuously from covalent to ionic.
        issueSignals:
        - id: chemistry-bonding-classification-error
      - id: c
        text: Electronegativity cannot influence bonding character.
        issueSignals:
        - id: chemistry-bonding-classification-error
      answer:
        choiceId: a
      explanation: 'Solution: Electronegativity difference is evidence, not an infallible classification threshold. Why it
        works: Electronegativity difference can support a bond-polarity argument, but bonding character is a continuum and
        bulk classification also depends on structure and particle organization. Why the other choices fail: The other statements
        either reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
  - id: exceptions
    title: Handle polyatomic and network cases
    required: true
    content: A compound such as NH4NO3 is ionic between polyatomic ions even though every atom is a nonmetal. Diamond and
      SiO2 are extended covalent structures rather than molecular or ionic lattices.
    check:
      id: chk-exceptions
      type: multipleChoice
      prompt: Which statement correctly applies the idea of handle polyatomic and network cases?
      choices:
      - id: a
        text: NH4NO3 contains covalent bonds within ions and ionic attraction between ions.
        issueSignals: []
      - id: b
        text: NH4NO3 must be molecular because it contains no metal.
        issueSignals:
        - id: chemistry-bonding-classification-error
      - id: c
        text: SiO2 consists of separate triatomic molecules in quartz.
        issueSignals:
        - id: chemistry-bonding-classification-error
      answer:
        choiceId: a
      explanation: 'Solution: NH4NO3 contains covalent bonds within ions and ionic attraction between ions. Why it works:
        A compound such as NH4NO3 is ionic between polyatomic ions even though every atom is a nonmetal. Diamond and SiO2
        are extended covalent structures rather than molecular or ionic lattices. Why the other choices fail: The other statements
        either reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
