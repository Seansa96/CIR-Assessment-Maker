items:
- id: standard-form
  type: flashcard
  prompt: What is the standard form of a first-order linear equation?
  answer: { expected: "y' + P(x)y = Q(x)", aliases: ['dy/dx + P(x)y = Q(x)'] }
  explanation: The coefficient of the derivative must first be one.
  tags: [standard-form]
- id: linearity
  type: flashcard
  prompt: In a linear equation, to what power do the dependent variable and its derivatives appear?
  answer: { expected: first, aliases: ['one', '1'] }
  explanation: Products such as $yy'$ and powers such as $y^2$ are nonlinear.
  tags: [classification]
- id: normalize
  type: flashcard
  prompt: What should be done if the coefficient of $y'$ is not one?
  answer: { expected: 'Divide the entire equation by that coefficient.' }
  explanation: This exposes $P(x)$ and $Q(x)$.
  tags: [standard-form]
- id: integrating-factor
  type: cloze
  prompt: The integrating factor for $y'+P(x)y=Q(x)$ is $e^{____}$.
  answer: { expected: 'integral P(x) dx', aliases: ['∫P(x)dx'] }
  explanation: The exponent is an antiderivative of $P(x)$.
  tags: [integrating-factor]
- id: product-rule-goal
  type: flashcard
  prompt: What derivative does the integrating factor create on the left side?
  answer: { expected: 'The derivative of the product of the integrating factor and y.', aliases: ['d/dx(mu y)'] }
  explanation: The product rule is the reason the method works.
  tags: [method]
- id: integrate
  type: flashcard
  prompt: After obtaining $(\mu y)'=\mu Q$, what is the next operation?
  answer: { expected: 'Integrate both sides with respect to the independent variable.' }
  explanation: Then divide by $\mu$ to isolate $y$.
  tags: [method]
- id: changing-volume
  type: flashcard
  prompt: When inflow and outflow rates differ, what additional quantity is needed in the salt-out term?
  answer: { expected: 'The time-dependent tank volume.' }
  explanation: Outflow concentration is $y/V(t)$, not $y$ divided by the initial volume.
  tags: [mixing]
- id: domain
  type: flashcard
  prompt: Why should a solution interval be stated for a linear equation containing $1/x$?
  answer: { expected: 'The equation and integrating factor are undefined at x equals zero.' }
  explanation: A solution cannot cross a point where its coefficients are undefined.
  tags: [domain]
