  difficultyEvidence: Requires matching a vector-calculus representation to the governing relation and orientation.
  explanation: 'Solution: Integrating one with respect to arc length gives the curve length.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 3 -> Vector-Valued Functions.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
