    - Use parametric arc length $L=\int_a^b\sqrt{(x'(t))^2+(y'(t))^2}\,dt$.
    - Compute $x'(t)=4t$ and $y'(t)=6t^2$.
    - Include the setup integral and rounded decimal value.
