- id: q021
  title: 'Part 1: Tangent Line of Parametric Curve'
  type: symbolicResponse
  prompt: |-
    Find the equation of the tangent line to the curve $x=t^2+2t,\ y=t^3-t$ at $t=1$.
  answer:
    expectedLatex: 'y=\frac{1}{2}x-\frac{3}{2}'
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.000001
  explanation: |-
    The formula for the slope of a parametric curve is:
    $$\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$$

    First, find the derivatives:
    $$\frac{dx}{dt} = 2t + 2$$
    $$\frac{dy}{dt} = 3t^2 - 1$$

    Evaluate at $t=1$:
    $$\frac{dx}{dt}\Big|_{t=1} = 2(1) + 2 = 4$$
    $$\frac{dy}{dt}\Big|_{t=1} = 3(1)^2 - 1 = 2$$

    So, the slope is $m = \frac{2}{4} = \frac{1}{2}$.

    Find the point at $t=1$:
    $$x = (1)^2 + 2(1) = 3$$
    $$y = (1)^3 - (1) = 0$$

    The equation of the tangent line is:
    $$y - 0 = \frac{1}{2}(x - 3)$$
    $$y = \frac{1}{2}x - \frac{3}{2}$$
- id: q022
  title: 'Part 1: Concavity of Parametric Curve'
  type: multipleChoice
  prompt: |-
    Determine the concavity of the curve $x=e^t,\ y=t^3$ at $t=1$.
  choices:
  - id: c1
    text: Concave Up
  - id: c2
    text: Concave Down
  - id: c3
    text: Neither (Inflection Point)
  answer:
    choiceId: c1
  explanation: |-
    The formula for the second derivative of a parametric curve is:
    $$\frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{dx/dt}$$

    First, find $\frac{dy}{dx}$:
    $$\frac{dx}{dt} = e^t$$
    $$\frac{dy}{dt} = 3t^2$$
    $$\frac{dy}{dx} = \frac{3t^2}{e^t} = 3t^2e^{-t}$$

    Next, find the derivative of $\frac{dy}{dx}$:
    $$\frac{d}{dt}\left(\frac{dy}{dx}\right) = 6te^{-t} - 3t^2e^{-t} = 3te^{-t}(2-t)$$

    Now, find the second derivative:
    $$\frac{d^2y}{dx^2} = \frac{3te^{-t}(2-t)}{e^t} = \frac{3t(2-t)}{e^{2t}}$$

    At $t=1$:
    $$\frac{d^2y}{dx^2}\Big|_{t=1} = \frac{3(1)(2-1)}{e^2} = \frac{3}{e^2} > 0$$

    Since the second derivative is positive, the curve is concave up at $t=1$.
- id: q023
  title: 'Part 1: Horizontal and Vertical Tangents'
  type: freeResponse
  prompt: |-
    Find all values of $t$ where the curve $x=t^2-4,\ y=t^3-3t$ has a horizontal or vertical tangent.
  answer:
    gradingMode: selfCheck
    expected: |
      Horizontal tangents: $t=-1$ and $t=1$. Vertical tangent: $t=0$.
    keyPoints:
    - Set $\frac{dy}{dt}=0$ for horizontal tangent candidates.
    - Set $\frac{dx}{dt}=0$ for vertical tangent candidates.
    - Check that the other derivative is nonzero at each candidate.
  explanation: |-
    First, find the derivatives:
    $$\frac{dx}{dt} = 2t$$
    $$\frac{dy}{dt} = 3t^2 - 3$$

    The condition for a horizontal tangent is $\frac{dy}{dt}=0$ and $\frac{dx}{dt} \ne 0$:
    $$3t^2 - 3 = 0 \implies t^2 = 1 \implies t = 1, t = -1$$
    Check $\frac{dx}{dt}$ at $t=\pm 1$: $2(1)=2 \ne 0$ and $2(-1)=-2 \ne 0$. 
    So, there are horizontal tangents at $t = 1$ and $t = -1$.

    The condition for a vertical tangent is $\frac{dx}{dt}=0$ and $\frac{dy}{dt} \ne 0$:
    $$2t = 0 \implies t = 0$$
    Check $\frac{dy}{dt}$ at $t=0$: $3(0)^2 - 3 = -3 \ne 0$.
    So, there is a vertical tangent at $t = 0$.
