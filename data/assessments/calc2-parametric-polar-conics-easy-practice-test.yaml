questions:
- id: q001
  title: 'Part 1: Sketch a Parametric Curve'
  type: freeResponse
  prompt: |-
    Sketch the parametric curve given by $x=t^2$, $y=t+1$ for $-2 \le t \le 2$. Indicate the direction of motion as $t$ increases.
  answer:
    gradingMode: selfCheck
    explanation: |-
      Substitute integer values of $t$ from $-2$ to $2$ into the equations:

      *   $t = -2 \implies x = (-2)^2 = 4,\ y = -2+1 = -1$. Point: $(4, -1)$
      *   $t = -1 \implies x = 1,\ y = 0$. Point: $(1, 0)$
      *   $t = 0 \implies x = 0,\ y = 1$. Point: $(0, 1)$
      *   $t = 1 \implies x = 1,\ y = 2$. Point: $(1, 2)$
      *   $t = 2 \implies x = 4,\ y = 3$. Point: $(4, 3)$

      Plot these points and draw a smooth curve (which forms a parabola opening to the right) connecting them. Draw arrows on the curve pointing from $(4,-1)$ towards $(4,3)$ to indicate the direction of increasing $t$.
- id: q002
  title: 'Part 1: Parametric Equations for a Circle'
  type: symbolicResponse
  prompt: |-
    Write a set of parametric equations for a circle with radius $3$ centered at the origin, starting at $(3,0)$ and traced counterclockwise.
  answer:
