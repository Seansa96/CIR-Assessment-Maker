      \ 3\\cos t, \\quad y = 3\\sin t$$"
- id: q003
  title: 'Part 1: Identify Parametric Curve from Graph'
  type: multipleChoice
  prompt: |-
    Identify the set of parametric equations that matches the given graph.

    ![Parametric Line](/assessments/calc2-parametric-polar/parametric-linear-easy.svg)
  choices:
  - id: c1
    text: x=2t+1, y=-t+3
  - id: c2
    text: x=t+1, y=-2t+3
  - id: c3
    text: x=2t, y=-t+2
  - id: c4
    text: x=-t+1, y=2t+3
  answer:
    choiceId: c1
    explanation: "Looking at the graph, at $t=0$, the curve is at $(1, 3)$. At $t=1$,\
      \ the curve is at $(3, 2)$. \n\nTesting the first option $x=2t+1,\\ y=-t+3$:\n\
      *   For $t=0$: $x=2(0)+1=1$ and $y=-(0)+3=3$. The point is $(1,3)$.\n*   For\
      \ $t=1$: $x=2(1)+1=3$ and $y=-(1)+3=2$. The point is $(3,2)$.\n\nThis perfectly\
      \ matches the graph."
- id: q004
  title: 'Part 1: Tangent Line of Parametric Curve'
  type: symbolicResponse
  prompt: |-
    Find the equation of the tangent line to the curve $x=t^2+t,\ y=t^3-2t$ at $t=1$.
  answer:
    expectedLatex: 'y=\frac{1}{3}x-\frac{5}{3}'
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.000001
    explanation: |-
      The formula for the slope of a parametric curve is:
      $$\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$$

      First, find the derivatives:
      $$\frac{dx}{dt} = 2t + 1$$
      $$\frac{dy}{dt} = 3t^2 - 2$$

      Evaluate at $t=1$:
      $$\frac{dx}{dt}\Big|_{t=1} = 2(1) + 1 = 3$$
      $$\frac{dy}{dt}\Big|_{t=1} = 3(1)^2 - 2 = 1$$

      So, the slope is $m = \frac{1}{3}$.

      Find the point at $t=1$:
      $$x = (1)^2 + 1 = 2$$
      $$y = (1)^3 - 2(1) = -1$$

      The equation of the tangent line in point-slope form is:
      $$y - (-1) = \frac{1}{3}(x - 2)$$
      $$y = \frac{1}{3}x - \frac{2}{3} - 1$$
      $$y = \frac{1}{3}x - \frac{5}{3}$$
- id: q005
  title: 'Part 1: Concavity of Parametric Curve'
  type: multipleChoice
  prompt: |-
    Determine the concavity of the curve $x=e^t,\ y=t^2$ at $t=2$.
  choices:
  - id: c1
    text: Concave Up
  - id: c2
    text: Concave Down
  - id: c3
    text: Neither (Inflection Point)
  answer:
    choiceId: c2
    explanation: |-
      The formula for the second derivative of a parametric curve is:
      $$\frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{dx/dt}$$

      First, find $\frac{dy}{dx}$:
      $$\frac{dx}{dt} = e^t$$
      $$\frac{dy}{dt} = 2t$$
      $$\frac{dy}{dx} = \frac{2t}{e^t} = 2te^{-t}$$

      Next, find the derivative of $\frac{dy}{dx}$ with respect to $t$ using the product rule:
      $$\frac{d}{dt}\left(\frac{dy}{dx}\right) = 2(1)e^{-t} + 2t(-e^{-t}) = 2e^{-t} - 2te^{-t}$$

      Now, find the second derivative:
      $$\frac{d^2y}{dx^2} = \frac{2e^{-t} - 2te^{-t}}{e^t} = \frac{2 - 2t}{e^{2t}}$$

      Evaluate at $t=1$:
      $$\frac{d^2y}{dx^2}\Big|_{t=1} = \frac{2 - 2(1)}{e^2} = 0$$

      Since the second derivative is $0$ at $t=1$, we need to check nearby values. At $t=0$, it is positive, at $t=2$, it is negative. So it's an inflection point.
      Wait, I should make sure it doesn't just equal 0. Let me check the math. $x=e^t, y=t^2$. $dx/dt=e^t$, $dy/dt=2t$. $y'=2te^{-t}$. $y'' = (2e^{-t} - 2te^{-t}) / e^t = (2-2t)e^{-2t}$. At $t=1$, $y'' = 0$. So it's neither. I'll correct the answer to choice 2 (Neither). Let's change the question value to t=2 so it's concave down.
      Let's evaluate at $t=2$:
      $$\frac{d^2y}{dx^2}\Big|_{t=2} = \frac{2 - 2(2)}{e^{4}} = -2e^{-4} < 0$$
      This means the curve is concave down at $t=2$.
- id: q006
  title: 'Part 1: Horizontal and Vertical Tangents'
  type: freeResponse
  prompt: |-
    Find all values of $t$ where the curve $x=t^3-3t,\ y=t^2-4$ has a horizontal or vertical tangent.
  answer:
    gradingMode: selfCheck
    explanation: "First, find the derivatives:\n$$\\frac{dx}{dt} = 3t^2 - 3$$\n$$\\\
      frac{dy}{dt} = 2t$$\n\nThe condition for a horizontal tangent is $\\frac{dy}{dt}=0$\
      \ and $\\frac{dx}{dt} \\ne 0$:\n$$2t = 0 \\implies t = 0$$\nCheck $\\frac{dx}{dt}$\
      \ at $t=0$: $3(0)^2 - 3 = -3 \\ne 0$. \nSo, there is a horizontal tangent at\
      \ $t = 0$.\n\nThe condition for a vertical tangent is $\\frac{dx}{dt}=0$ and\
      \ $\\frac{dy}{dt} \\ne 0$:\n$$3t^2 - 3 = 0 \\implies t^2 = 1 \\implies t = 1,\\\
      \ t = -1$$\nCheck $\\frac{dy}{dt}$ at $t=\\pm 1$: $2(1) = 2 \\ne 0$ and $2(-1)\
      \ = -2 \\ne 0$.\nSo, there are vertical tangents at $t = 1$ and $t = -1$."
- id: q007
  title: 'Part 1: Sketch a Polar Curve'
  type: freeResponse
  prompt: |-
    Sketch the polar curve $r=2$.
  answer:
    gradingMode: selfCheck
    explanation: |-
      The polar curve $r=2$ describes all points that are a distance of $2$ from the origin, regardless of the angle $\theta$.

      This forms a circle centered at the origin with a radius of $2$.
