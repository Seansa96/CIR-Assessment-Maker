- id: q026
  title: 'Part 1: Tangent Line of Polar Curve'
  type: symbolicResponse
  prompt: |-
    Find the slope of the tangent line to the polar curve $r=4\sin\theta$ at $\theta=\frac{\pi}{6}$.
  answer:
    expectedLatex: '\sqrt{3}'
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
  explanation: |-
    The formula for the slope of a polar curve is:
    $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$$

    Given $r = 4\sin\theta$, its derivative is $r' = 4\cos\theta$.
    Evaluate at $\theta = \frac{\pi}{6}$:
    $$r = 4\left(\frac{1}{2}\right) = 2$$
    $$r' = 4\left(\frac{\sqrt{3}}{2}\right) = 2\sqrt{3}$$

    Substitute into the slope formula:
    $$\frac{dy}{dx} = \frac{2\sqrt{3}(1/2) + 2(\sqrt{3}/2)}{2\sqrt{3}(\sqrt{3}/2) - 2(1/2)} = \frac{\sqrt{3} + \sqrt{3}}{3 - 1} = \frac{2\sqrt{3}}{2} = \sqrt{3}$$
- id: q027
  title: 'Part 1: Horizontal Tangents of Polar Curve'
  type: freeResponse
  prompt: |-
    Find all values of $\theta$ in $[0, 2\pi)$ where the polar curve $r=1-\cos\theta$ has a horizontal tangent.
  answer:
    gradingMode: selfCheck
    expected: |
      The horizontal tangents occur at $\theta=\frac{2\pi}{3}$ and $\theta=\frac{4\pi}{3}$. The candidate $\theta=0$ is excluded because it is a cusp.
    keyPoints:
    - Use the polar slope numerator $r'\sin\theta+r\cos\theta$.
    - Solve the resulting quadratic in $\cos\theta$.
    - Exclude cusp/singular candidates where both slope numerator and denominator vanish.
  explanation: |-
    The formula for the slope of a polar curve is:
    $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$$

    For a horizontal tangent, set the numerator of $\frac{dy}{dx}$ equal to zero:
    $$\frac{dy}{d\theta} = r'\sin\theta + r\cos\theta = 0$$

    Given $r=1-\cos\theta$, we have $r'=\sin\theta$:
    $$(\sin\theta)\sin\theta + (1-\cos\theta)\cos\theta = 0$$
    $$\sin^2\theta + \cos\theta - \cos^2\theta = 0$$

    Use the identity $\sin^2\theta = 1 - \cos^2\theta$:
    $$(1 - \cos^2\theta) + \cos\theta - \cos^2\theta = 0$$
    $$1 + \cos\theta - 2\cos^2\theta = 0$$
    $$2\cos^2\theta - \cos\theta - 1 = 0$$

    Factor the quadratic:
    $$(2\cos\theta + 1)(\cos\theta - 1) = 0$$

    This gives two cases:
    1.  $2\cos\theta + 1 = 0 \implies \cos\theta = -\frac{1}{2} \implies \theta = \frac{2\pi}{3}, \frac{4\pi}{3}$
    2.  $\cos\theta - 1 = 0 \implies \cos\theta = 1 \implies \theta = 0$

    At $\theta = 0$, both the numerator and denominator of $\frac{dy}{dx}$ are $0$ (a cusp), so it does not have a horizontal tangent there. The horizontal tangents occur at $\theta = \frac{2\pi}{3}$ and $\theta = \frac{4\pi}{3}$.
- id: q028
