    text: r=2+2\cos\theta
  - id: c2
    text: r=2+2\sin\theta
  - id: c3
    text: r=4\cos\theta
  - id: c4
    text: r=4\sin\theta
  answer:
    choiceId: c1
    explanation: "Looking at the graph, the curve passes through the pole ($r=0$)\
      \ at $\\theta=\\pi$, reaches a maximum distance of $4$ at $\\theta=0$, and has\
      \ a dimple/cusp. \n\nTesting $r=2+2\\cos\\theta$:\n*   $\\theta=0 \\implies\
      \ r=2+2(1)=4$. Point: $(4, 0)$\n*   $\\theta=\\pi/2 \\implies r=2+2(0)=2$. Point:\
      \ $(2, \\pi/2)$\n*   $\\theta=\\pi \\implies r=2+2(-1)=0$. Point: $(0, \\pi)$\n\
      \nThis perfectly matches the features of a cardioid oriented along the positive\
      \ x-axis."
- id: q009
  title: 'Part 1: Tangent Line of Polar Curve'
  type: symbolicResponse
  prompt: |-
    Find the slope of the tangent line to the polar curve $r=3\sin\theta$ at $\theta=\frac{\pi}{3}$.
  answer:
    expectedLatex: '-\sqrt{3}'
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
    explanation: |-
      The formula for the slope of a polar curve is:
      $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$$

      Given $r = 3\sin\theta$, its derivative is $r' = 3\cos\theta$.
      Evaluate at $\theta = \frac{\pi}{3}$:
      $$r = 3\sin\left(\frac{\pi}{3}\right) = \frac{3\sqrt{3}}{2}$$
      $$r' = 3\cos\left(\frac{\pi}{3}\right) = \frac{3}{2}$$

      Substitute into the slope formula:
      $$\frac{dy}{dx}
      =\frac{\frac32\frac{\sqrt3}{2}+\frac{3\sqrt3}{2}\frac12}
      {\frac32\frac12-\frac{3\sqrt3}{2}\frac{\sqrt3}{2}}
      =-\sqrt3.$$

      Wait, $r'\cos\theta - r\sin\theta$ at $\pi/4$ will be $3(\sqrt{2}/2)(\sqrt{2}/2) - 3(\sqrt{2}/2)(\sqrt{2}/2) = 0$. This means the slope is undefined (vertical tangent). Let me change the question to $\theta = 0$.

      Let's evaluate at $\theta = 0$:
      $$r = 3\sin(0) = 0$$
      $$r' = 3\cos(0) = 3$$
      $$\frac{dy}{dx} = \frac{3\sin(0) + 0\cos(0)}{3\cos(0) - 0\sin(0)} = \frac{0}{3} = 0$$

      Wait, let's use a non-zero slope. How about $\theta = \frac{\pi}{3}$?
      $$r = 3\left(\frac{\sqrt{3}}{2}\right)$$
      $$r' = 3\left(\frac{1}{2}\right)$$
      Numerator: $3(1/2)(\sqrt{3}/2) + 3(\sqrt{3}/2)(1/2) = 3\sqrt{3}/2$.
      Denominator: $3(1/2)(1/2) - 3(\sqrt{3}/2)(\sqrt{3}/2) = 3/4 - 9/4 = -6/4 = -3/2$.
      Slope: $(3\sqrt{3}/2) / (-3/2) = -\sqrt{3}$.
      I will use $\theta=\frac{\pi}{3}$.
- id: q010
  title: 'Part 1: Horizontal Tangents of Polar Curve'
  type: freeResponse
  prompt: |-
    Find all values of $\theta$ in $[0, 2\pi)$ where the polar curve $r=1+\cos\theta$ has a horizontal tangent.
  answer:
    gradingMode: selfCheck
    explanation: |-
      The formula for the slope of a polar curve is:
      $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$$

      For a horizontal tangent, set the numerator of $\frac{dy}{dx}$ equal to zero:
      $$\frac{dy}{d\theta} = r'\sin\theta + r\cos\theta = 0$$

      Given $r=1+\cos\theta$, we have $r'=-\sin\theta$:
      $$(-\sin\theta)\sin\theta + (1+\cos\theta)\cos\theta = 0$$
      $$-\sin^2\theta + \cos\theta + \cos^2\theta = 0$$

      Use the identity $\sin^2\theta = 1 - \cos^2\theta$:
      $$-(1 - \cos^2\theta) + \cos\theta + \cos^2\theta = 0$$
      $$2\cos^2\theta + \cos\theta - 1 = 0$$

      Factor the quadratic:
      $$(2\cos\theta - 1)(\cos\theta + 1) = 0$$

      This gives two cases:
      1.  $2\cos\theta - 1 = 0 \implies \cos\theta = \frac{1}{2} \implies \theta = \frac{\pi}{3}, \frac{5\pi}{3}$
      2.  $\cos\theta + 1 = 0 \implies \cos\theta = -1 \implies \theta = \pi$

      At $\theta = \pi$, both the numerator and denominator of $\frac{dy}{dx}$ are $0$ (a cusp), so it does not have a horizontal tangent there. The horizontal tangents occur at $\theta = \frac{\pi}{3}$ and $\theta = \frac{5\pi}{3}$.
- id: q011
  title: 'Part 1: Simple Area of a Polar Curve'
  type: symbolicResponse
  prompt: |-
    Set up the integral for the area of the region bounded by the polar curve $r=2\cos\theta$. Do not evaluate.
  answer:
    expectedLatex: '\frac{1}{2}\int_{0}^{\pi}(2\cos\theta)^2\,d\theta'
    equivalenceMode: expression
    variables: []
    tolerance: 0.000001
    explanation: |-
      The formula for polar area is:
      $$A = \frac{1}{2}\int_{\alpha}^{\beta} r^2 \,d\theta$$

      The curve $r=2\cos\theta$ is a circle that completes one full trace as $\theta$ goes from $-\frac{\pi}{2}$ to $\frac{\pi}{2}$ (or from $0$ to $\pi$).

      The integral is:
      $$A = \frac{1}{2}\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}} (2\cos\theta)^2 \,d\theta \quad \text{or} \quad A = \frac{1}{2}\int_{0}^{\pi} (2\cos\theta)^2 \,d\theta$$
- id: q012
  title: 'Part 1: Identify Conic Section'
  type: multipleChoice
  prompt: |-
    Identify the type of conic section represented by the equation $\frac{x^2}{4} - \frac{y^2}{9} = 1$.
  choices:
  - id: c1
    text: Ellipse
  - id: c2
    text: Parabola
  - id: c3
    text: Circle
  - id: c4
    text: Hyperbola
  answer:
    choiceId: c4
    explanation: |-
      The equation is in the standard form $\frac{x^2}{a^2} - \frac{y^2}{b^2} = 1$. The minus sign between the squared terms indicates that this is a hyperbola.
- id: q013
  title: 'Part 1: Write Conic Equation'
  type: symbolicResponse
  prompt: |-
    Write the standard equation of a circle with center $(2, -3)$ and radius $5$.
  answer:
    expectedLatex: '(x-2)^2+(y+3)^2=25'
    equivalenceMode: expression
    variables:
    - x
    - y
    tolerance: 0.000001
    explanation: |-
      The standard equation of a circle is:
      $$(x-h)^2 + (y-k)^2 = r^2$$

      Given the center $(h,k) = (2, -3)$ and radius $r = 5$, substitute these into the formula:
      $$(x-2)^2 + (y-(-3))^2 = 5^2$$
      $$(x-2)^2 + (y+3)^2 = 25$$
- id: q014
  title: 'Part 2: Parametric Arc Length'
  type: freeResponse
  prompt: "Find the arc length of the parametric curve $x=t^2,\\ y=t^3$ for $0 \\\
    le t \\le 1$. \n\nProvide the setup integral and the final decimal answer rounded\
    \ to 3 decimal places."
  answer:
    gradingMode: selfCheck
    explanation: |-
      The formula for parametric arc length is:
      $$L = \int_a^b \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \,dt$$

      Derivatives:
      $$\frac{dx}{dt} = 2t$$
      $$\frac{dy}{dt} = 3t^2$$

      Setup integral:
      $$L = \int_0^1 \sqrt{(2t)^2 + (3t^2)^2} \,dt = \int_0^1 \sqrt{4t^2 + 9t^4} \,dt$$

      Evaluate using a calculator:
      $$L \approx 1.440$$
- id: q015
  title: 'Part 2: Polar Arc Length'
  type: freeResponse
  prompt: "Find the arc length of the polar curve $r=e^{2\\theta}$ for $0 \\le \\\
    theta \\le \\pi$. \n\nProvide the setup integral and the final decimal answer\
    \ rounded to 3 decimal places."
  answer:
    gradingMode: selfCheck
    explanation: |-
      The formula for polar arc length is:
      $$L = \int_{\alpha}^{\beta} \sqrt{r^2 + \left(\frac{dr}{d\theta}\right)^2} \,d\theta$$

      Derivative:
      $$r' = 2e^{2\theta}$$

      Setup integral:
      $$L = \int_0^{\pi} \sqrt{(e^{2\theta})^2 + (2e^{2\theta})^2} \,d\theta = \int_0^{\pi} \sqrt{e^{4\theta} + 4e^{4\theta}} \,d\theta = \int_0^{\pi} \sqrt{5e^{4\theta}} \,d\theta$$

      Evaluate using a calculator:
      $$L \approx 596.586$$
- id: q016
  title: 'Part 2: Parametric Area'
  type: freeResponse
  prompt: |-
    Find the area under the parametric curve $x=e^t,\ y=\sin t$ from $t=0$ to $t=\pi$.

    Provide the setup integral and the final decimal answer rounded to 3 decimal places.
  answer:
    gradingMode: selfCheck
    explanation: |-
      The formula for parametric area is:
      $$A = \int_a^b y(t)x'(t) \,dt$$

      Derivative of $x$:
      $$x'(t) = e^t$$

      Setup integral:
      $$A = \int_0^{\pi} (\sin t)(e^t) \,dt = \int_0^{\pi} e^t\sin t \,dt$$

      Evaluate using a calculator:
      $$A \approx 12.070$$
- id: q017
  title: 'Part 2: Polar Area'
  type: freeResponse
  prompt: |-
    Find the area enclosed by one petal of the rose curve $r=2\sin(3\theta)$.

    Provide the setup integral and the final decimal answer rounded to 3 decimal places.
  answer:
    gradingMode: selfCheck
    explanation: |-
      The formula for polar area is:
      $$A = \frac{1}{2}\int_{\alpha}^{\beta} r^2 \,d\theta$$

      The curve $r=2\sin(3\theta)$ completes one petal from $\theta=0$ to $\theta=\frac{\pi}{3}$.

      Setup integral:
      $$A = \frac{1}{2}\int_0^{\frac{\pi}{3}} (2\sin(3\theta))^2 \,d\theta$$

      Evaluate using a calculator:
      $$A \approx 1.047$$
