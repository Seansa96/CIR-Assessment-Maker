- Calculate areas using standard formulas and Brahmagupta's formula.
lesson:
  sections:
  - id: section-parallelograms
    title: 'Parallelograms'
    content: |
      A parallelogram is a quadrilateral with both pairs of opposite sides parallel. This definition generates a cascade of equivalent properties:
      1. Opposite sides are equal in length.
      2. Opposite angles are equal in measure.
      3. Consecutive angles are supplementary (add to $180^\circ$).
      4. The diagonals bisect each other.

      In a geometry proof, establishing *any one* of these properties is sufficient to prove the quadrilateral is a parallelogram. The area of a parallelogram is simply $A = \text{base} \times \text{height}$, because it can be cut and rearranged into a rectangle.
    check:
      type: multipleChoice
      prompt: 'In quadrilateral $ABCD$, diagonals $AC$ and $BD$ intersect at $M$. If $AM = 5, MC = 5, BM = 7, MD = 7$, and $\angle AMB = 60^\circ$, what kind of quadrilateral is $ABCD$?'
      choices:
      - id: a
        text: 'A parallelogram'
      - id: b
        text: 'A rectangle'
        issueSignals: [wrong-concept]
      - id: c
        text: 'A rhombus'
        issueSignals: [wrong-concept]
      - id: d
        text: 'A square'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Recognize that the diagonals bisect each other.
      - Rule out special parallelograms since diagonals are neither equal nor perpendicular.
      explanation: |
        Solution:
        Since $AM = MC = 5$, diagonal $AC$ is bisected at $M$.
        Since $BM = MD = 7$, diagonal $BD$ is bisected at $M$.
        Because the diagonals bisect each other, $ABCD$ is a parallelogram.
        It is not a rectangle (diagonals $10$ and $14$ are not equal).
        It is not a rhombus (diagonals do not intersect at $90^\circ$).

        Why it works:
        The bisection of diagonals forces the opposite triangles ($\triangle AMB$ and $\triangle CMD$) to be congruent by SAS, which in turn forces opposite sides to be equal and parallel.

  - id: section-special-parallelograms
    title: 'Rectangles, Rhombi, and Squares'
    content: |
      Parallelograms with extra constraints become highly symmetric:
      
      **Rectangles** have four $90^\circ$ angles. This forces their diagonals to be equal in length. A rectangle is a cyclic quadrilateral because its opposite angles sum to $180^\circ$.
      
      **Rhombi** (plural of rhombus) have four equal sides. This forces their diagonals to be strictly perpendicular ($90^\circ$ intersection) and to bisect the interior angles. The area of a rhombus is $\frac{1}{2}d_1 d_2$.
      
      **Squares** possess the properties of both rectangles and rhombi: four equal sides, four right angles, equal diagonals, and perpendicular diagonals.
    check:
      type: multipleChoice
      prompt: 'A parallelogram has diagonals of lengths 10 and 24 that intersect at a right angle. What is its perimeter?'
      choices:
      - id: a
        text: '52'
      - id: b
        text: '68'
        issueSignals: [algebra-error]
      - id: c
        text: '120'
        issueSignals: [wrong-formula]
      - id: d
        text: '26'
        issueSignals: [formula-error]
      answer: {choiceId: a}
      difficultyDimensions:
      - Identify the shape as a rhombus.
      - Use Pythagorean theorem on the half-diagonals to find the side length.
      - Multiply by 4.
      explanation: |
        Solution:
        A parallelogram with perpendicular diagonals is a rhombus, so all four sides are equal.
        The diagonals bisect each other, creating four right triangles with legs $10/2 = 5$ and $24/2 = 12$.
        By the Pythagorean theorem, the hypotenuse (the side of the rhombus) is $\sqrt{5^2 + 12^2} = \sqrt{25 + 144} = 13$.
        The perimeter is $4 \times 13 = 52$.

        Why it works:
        The perpendicular intersection of the diagonals is the defining feature that locks a parallelogram's sides into equal lengths.

  - id: section-trapezoids
    title: 'Trapezoids'
    content: |
      A trapezoid (or trapezium) is a quadrilateral with *at least one* pair of parallel sides (the bases). 
      The median (midline) connects the midpoints of the non-parallel sides. Its length is the average of the two bases: $m = \frac{b_1 + b_2}{2}$.
      The area of a trapezoid is the median times the height: $A = mh$.

      An **isosceles trapezoid** has non-parallel sides of equal length. This forces the base angles to be equal, the diagonals to be equal, and makes the quadrilateral cyclic (inscribable in a circle).
    check:
      type: multipleChoice
      prompt: 'In trapezoid $ABCD$ with parallel bases $AB$ and $CD$, the diagonals $AC$ and $BD$ intersect at $E$. If $AB = 4$ and $CD = 10$, what is the ratio of the area of $\triangle ABE$ to the area of $\triangle CDE$?'
      choices:
      - id: a
        text: '4:25'
      - id: b
        text: '2:5'
        issueSignals: [wrong-concept]
      - id: c
        text: '16:100'
        issueSignals: [algebra-error]
      - id: d
        text: '4:10'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Prove $\triangle ABE \sim \triangle CDE$ due to parallel lines.
      - Square the linear ratio to find the area ratio.
      explanation: |
        Solution:
        Because $AB \parallel CD$, the alternate interior angles are equal: $\angle BAE = \angle DCE$ and $\angle ABE = \angle CDE$.
        Thus, $\triangle ABE \sim \triangle CDE$ by AA similarity.
        The ratio of their corresponding sides is $AB:CD = 4:10 = 2:5$.
        The ratio of the areas of similar triangles is the square of the side ratio:
        $(2/5)^2 = 4/25$.
        The area ratio is $4:25$.

        Why it works:
        Trapezoids naturally generate similar triangles when their diagonals are drawn, making them excellent candidates for proportional area problems.

  - id: section-kites
    title: 'Kites'
    content: |
      A kite is a quadrilateral with two distinct pairs of equal-length sides that are adjacent to each other.
      
      This symmetry guarantees that:
      1. The diagonals are perpendicular.
      2. The main diagonal (connecting the vertices between the equal sides) bisects the other diagonal.
      3. The main diagonal bisects the angles at its vertices.
      4. The area is half the product of the diagonals: $A = \frac{1}{2}d_1 d_2$.

      A rhombus is a special type of kite where all four sides are equal.
    check:
      type: multipleChoice
      prompt: 'A kite has side lengths 10 and 17. The main diagonal has length 21. What is the area of the kite?'
      choices:
      - id: a
        text: '168'
      - id: b
        text: '84'
        issueSignals: [wrong-formula]
      - id: c
        text: '336'
        issueSignals: [formula-error]
      - id: d
        text: '170'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - View the kite as two congruent triangles, or apply Heron's formula to the upper half.
      - Calculate the area.
      explanation: |
        Solution:
        The main diagonal of length 21 splits the kite into two congruent triangles, each with sides 10, 17, and 21.
        We can find the area of one triangle using Heron's Formula.
        Semiperimeter $s = \frac{10 + 17 + 21}{2} = 24$.
        Area $= \sqrt{24(24-10)(24-17)(24-21)} = \sqrt{24(14)(7)(3)}$.
        $24 \times 3 = 72$, $72 \times 98 \dots$ wait. Let's factor: $24=8 \times 3$, $14=2 \times 7$.
        $\sqrt{(8 \times 3)(2 \times 7)(7)(3)} = \sqrt{16 \times 9 \times 49} = 4 \times 3 \times 7 = 84$.
        One triangle has area 84.
        The kite has two such triangles, so its total area is $2 \times 84 = 168$.

        Why it works:
        The main diagonal acts as a line of symmetry, cutting the quadrilateral into two identical triangles, making Heron's formula highly effective.

  - id: section-cyclic-quadrilaterals
    title: 'Cyclic Quadrilaterals'
    content: |
      A quadrilateral is cyclic if its four vertices lie on a single circle. This imposes rigid angle constraints:
      1. Opposite angles are supplementary (sum to $180^\circ$).
      2. The angle between a side and a diagonal equals the angle between the opposite side and the other diagonal (because they subtend the same arc).
      3. An exterior angle equals the opposite interior angle.

      Ptolemy's Theorem ($AB \cdot CD + BC \cdot DA = AC \cdot BD$) applies exclusively to cyclic quadrilaterals. Proving a quadrilateral is cyclic is often the critical "aha!" moment in Olympiad geometry problems.
    check:
      type: multipleChoice
      prompt: 'In quadrilateral $WXYZ$, $\angle W = 100^\circ$ and $\angle Y = 80^\circ$. If $WX = 4, XY = 5, YZ = 6,$ and $ZW = 7$, can you use Ptolemy''s theorem to find the diagonals?'
      choices:
      - id: a
        text: 'Yes, because the opposite angles sum to $180^\circ$, making it cyclic.'
      - id: b
        text: 'No, because the sides are not equal.'
        issueSignals: [wrong-concept]
      - id: c
        text: 'No, because Ptolemy only applies to rectangles.'
        issueSignals: [wrong-concept]
      - id: d
        text: 'Yes, because all quadrilaterals are cyclic.'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Check the sum of the opposite angles.
      - Connect the supplementary property to the cyclic property.
      explanation: |
        Solution:
        We are given opposite angles $\angle W = 100^\circ$ and $\angle Y = 80^\circ$.
        Their sum is $100^\circ + 80^\circ = 180^\circ$.
        Because the opposite angles are supplementary, $WXYZ$ is a cyclic quadrilateral.
        Since it is cyclic, Ptolemy's Theorem is valid and can be applied.

        Why it works:
        The inscribed angle theorem dictates that opposite angles of a cyclic quad subtend arcs that add up to the entire $360^\circ$ circle, meaning the angles themselves must add to $180^\circ$.

  - id: section-brahmaguptas-formula
    title: 'Brahmagupta''s Formula'
    content: |
      Just as Heron's Formula finds the area of a triangle given its sides, **Brahmagupta's Formula** finds the area of a *cyclic* quadrilateral given its four sides $a, b, c, d$.

      First, calculate the semiperimeter:
      $$s = \frac{a + b + c + d}{2}$$
      Then the area is:
      $$A = \sqrt{(s-a)(s-b)(s-c)(s-d)}$$

      If you let $d = 0$, the quadrilateral collapses into a triangle and the formula perfectly reduces to Heron's Formula. Note that this formula *only* works if the quadrilateral can be inscribed in a circle!
    check:
      type: multipleChoice
      prompt: 'A cyclic quadrilateral has side lengths 1, 4, 5, and 8. What is its area?'
      choices:
      - id: a
        text: '12'
      - id: b
        text: '144'
        issueSignals: [formula-error]
      - id: c
        text: '10'
        issueSignals: [algebra-error]
      - id: d
        text: '$\sqrt{140}$'
        issueSignals: [algebra-error]
      answer: {choiceId: a}
      difficultyDimensions:
      - Calculate the semiperimeter $s$.
      - Apply Brahmagupta's Formula.
      explanation: |
        Solution:
        The perimeter is $1 + 4 + 5 + 8 = 18$.
        The semiperimeter is $s = 9$.
        Applying Brahmagupta's Formula:
        $$A = \sqrt{(9-1)(9-4)(9-5)(9-8)}$$
        $$A = \sqrt{(8)(5)(4)(1)}$$
        $$A = \sqrt{160}$$
        Wait, I set the answer to 12 ($\sqrt{144}$). Let me fix the sides.
        If the sides are 1, 2, 4, 5: $s=6$. $A = \sqrt{5 \cdot 4 \cdot 2 \cdot 1} = \sqrt{40}$.
        Let's pick sides to make a perfect square.
        Try $s=10$. We need four numbers that multiply to a square.
        Say, $9 \times 4 \times 1 \times 4 = 144$.
        So $s-a=9 \implies a=1$.
        $s-b=4 \implies b=6$.
        $s-c=1 \implies c=9$.
        $s-d=4 \implies d=6$.
        $1+6+9+6 = 22 \implies s=11$. But I needed $s=10$.
        Let's try $a=3, b=3, c=4, d=4$. $s=7$. $(4)(4)(3)(3) = 144$. Area = 12!
      prompt: 'A cyclic quadrilateral has side lengths 3, 3, 4, and 4. What is its area?'
      choices:
      - id: a
        text: '12'
      - id: b
        text: '144'
        issueSignals: [formula-error]
      - id: c
        text: '10'
        issueSignals: [algebra-error]
      - id: d
        text: '24'
        issueSignals: [wrong-formula]
      answer: {choiceId: a}
      difficultyDimensions:
      - Calculate the semiperimeter $s$.
      - Apply Brahmagupta's Formula.
      explanation: |
        Solution:
        The perimeter is $3 + 3 + 4 + 4 = 14$.
        The semiperimeter is $s = 7$.
        Applying Brahmagupta's Formula:
        $$A = \sqrt{(7-3)(7-3)(7-4)(7-4)}$$
        $$A = \sqrt{(4)(4)(3)(3)} = \sqrt{144} = 12$$

        Why it works:
        A cyclic quadrilateral with sides 3,3,4,4 is actually a kite inscribed in a circle. Brahmagupta's formula provides a beautiful, altitude-free path to its area.

  - id: section-varignons-theorem
    title: 'Varignon''s Theorem'
    content: |
      If you connect the midpoints of the adjacent sides of *any* quadrilateral, the resulting shape is always a parallelogram, known as the Varignon parallelogram.

      Furthermore:
      1. The perimeter of the Varignon parallelogram equals the sum of the diagonals of the original quadrilateral.
      2. The area of the Varignon parallelogram is exactly half the area of the original quadrilateral.

      This theorem is true for convex, concave, and even self-intersecting quadrilaterals! It relies purely on the midline theorem for triangles.
    check:
      type: multipleChoice
      prompt: 'The diagonals of a quadrilateral are 14 and 18. If you connect the midpoints of its four sides, what is the perimeter of the resulting shape?'
      choices:
      - id: a
        text: '32'
      - id: b
        text: '64'
        issueSignals: [formula-error]
      - id: c
        text: '16'
        issueSignals: [algebra-error]
      - id: d
        text: '252'
        issueSignals: [wrong-concept]
      answer: {choiceId: a}
      difficultyDimensions:
      - Recognize the shape as the Varignon parallelogram.
      - Apply the property that its perimeter equals the sum of the original diagonals.
      explanation: |
        Solution:
        Connecting the midpoints creates the Varignon parallelogram.
        Its sides are parallel to the original diagonals, and by the triangle midline theorem, each side of the parallelogram is exactly half the length of the diagonal it parallels.
        Since there are two sides parallel to the 14-diagonal (each length 7) and two sides parallel to the 18-diagonal (each length 9), the perimeter is:
        $$2(7) + 2(9) = 14 + 18 = 32$$
        
        Why it works:
        The sum of the diagonals of the original quadrilateral directly gives the perimeter of the inscribed midpoint parallelogram.
