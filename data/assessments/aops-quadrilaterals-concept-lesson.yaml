title: Quadrilaterals Concept Lesson
description: Build quadrilateral results from definitions, diagonals, and sufficient classification tests instead of trusting appearance.
assessmentType: conceptLesson
categoryId: art-of-problem-solving
topicId: aops-quadrilaterals
modeDefault: learn
randomizeQuestions: false
