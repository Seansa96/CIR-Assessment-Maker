questions:
- id: q001
  title: Variable torque work
  type: numericResponse
  prompt: |-
    A torque varies as $\tau=4\theta$ from $0$ to $3.0\text{ rad}$. How much work is done?
  answer:
    value: 18.0
    tolerance: 0.2
  explanation: |-
    $W=\int_0^3 4\theta\,d\theta=18\text{ J}$.
- id: q002
  title: Power from rpm
  type: numericResponse
  prompt: |-
    A motor provides $25\text{ N}\cdot\text{m}$ while spinning at $240\text{ rpm}$. What is power?
  answer:
    value: 628.3
    tolerance: 3.0
  explanation: |-
    $240\text{ rpm}=8\pi\text{ rad/s}$, so $P=25(8\pi)=628\text{ W}$.
- id: q003
  title: Work between speeds
  type: numericResponse
  prompt: |-
    A flywheel with $I=3.0$ speeds from $4$ to $10\text{ rad/s}$. How much work is required?
  answer:
    value: 126.0
    tolerance: 0.5
  explanation: |-
    $W=\frac12I(\omega_f^2-\omega_i^2)=1.5(100-16)=126\text{ J}$.
- id: q004
  title: Average torque
  type: numericResponse
  prompt: |-
    A wheel gains $500\text{ J}$ over $20\text{ rad}$. What average torque acted?
  answer:
    value: 25.0
    tolerance: 0.2
  explanation: |-
    $\tau_{avg}=W/\theta=500/20=25$.
- id: q005
  title: Torque-angle graph
  type: multipleChoice
  prompt: |-
    On a $\tau$ versus $\theta$ graph, work is:
  choices:
  - id: a
    text: |-
      area under the curve
  - id: b
    text: |-
      slope of the curve
  - id: c
    text: |-
      final angle only
  - id: d
    text: |-
      maximum torque only
  answer:
    choiceId: a
  explanation: |-
    $W=\int\tau\,d\theta$.
- id: q006
  title: Stopping angle
  type: numericResponse
  prompt: |-
    A wheel with $K_{rot}=240\text{ J}$ is stopped by $12\text{ N}\cdot\text{m}$ of braking torque. Through what angle does it turn?
  answer:
    value: 20.0
    tolerance: 0.2
  explanation: |-
    $240=12\theta$, so $\theta=20\text{ rad}$.
- id: q007
  title: Torque from power
  type: numericResponse
  prompt: |-
    A machine delivers $1500\text{ W}$ at $50\text{ rad/s}$. What torque is delivered?
  answer:
    value: 30.0
    tolerance: 0.2
  explanation: |-
    $\tau=P/\omega=1500/50=30$.
- id: q008
  title: Opposing torques work
  type: numericResponse
  prompt: |-
    Driving torque is $18\text{ N}\cdot\text{m}$ and resistive torque is $5\text{ N}\cdot\text{m}$ through $8\text{ rad}$. What net work is done?
  answer:
    value: 104.0
    tolerance: 0.5
  explanation: |-
    Net torque $=13$, so $W=13(8)=104\text{ J}$.
- id: q009
  title: Power sign
  type: multipleChoice
  prompt: |-
    If torque and angular velocity have opposite signs, instantaneous power is:
  choices:
  - id: a
    text: |-
      negative
  - id: b
    text: |-
      positive
  - id: c
    text: |-
      zero always
  - id: d
    text: |-
      undefined
  answer:
    choiceId: a
  explanation: |-
    $P=\tau\omega$, so opposite signs make power negative.
- id: q010
  title: Final omega from torque
  type: numericResponse
  prompt: |-
    A $6.0\text{ N}\cdot\text{m}$ torque acts through $15\text{ rad}$ on $I=5.0$ initially at rest. What is $\omega_f$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $W=90=\frac12(5)\omega^2$, so $\omega=6$.
- id: q011
  title: Efficiency
  type: numericResponse
  prompt: |-
    A motor draws $800\text{ W}$ and delivers $600\text{ W}$ to a shaft. What is efficiency percent?
  answer:
    value: 75.0
    tolerance: 0.5
  explanation: |-
    $\eta=600/800=75\%$.
- id: q012
  title: Energy from power
  type: numericResponse
  prompt: |-
    A constant $250\text{ W}$ is delivered for $12\text{ s}$. How much energy is added?
  answer:
    value: 3000.0
    tolerance: 5.0
  explanation: |-
    $E=Pt=250(12)=3000\text{ J}$.
- id: q013
  title: When to use work-energy
  type: multipleChoice
  prompt: |-
    Rotational work-energy is most useful when a problem gives:
  choices:
  - id: a
    text: |-
      torque over angular displacement and asks for speed or energy
  - id: b
    text: |-
      only a force diagram with no distances
  - id: c
    text: |-
      temperature changes
  - id: d
    text: |-
      center-of-mass position only
  answer:
    choiceId: a
  explanation: |-
    Work-energy connects torque through angle to kinetic energy change.
- id: q014
  title: Linear torque ramp
  type: numericResponse
  prompt: |-
    Torque increases linearly from $0$ to $20\text{ N}\cdot\text{m}$ over $5\text{ rad}$. What work is done?
  answer:
    value: 50.0
    tolerance: 0.5
  explanation: |-
    Triangle area under $\tau$-$\theta$: $W=\frac12(5)(20)=50\text{ J}$.
- id: q015
  title: Power from alpha
  type: numericResponse
  prompt: |-
    At an instant $I=2.0$, $\alpha=3.0\text{ rad/s}^2$, and $\omega=8.0\text{ rad/s}$. What power is delivered?
  answer:
    value: 48.0
    tolerance: 0.3
  explanation: |-
    $\tau=I\alpha=6$, so $P=\tau\omega=48\text{ W}$.
