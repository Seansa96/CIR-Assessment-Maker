questions:
- id: q1
  type: numericResponse
  prompt: A wheel ($I = 2.0 \text{ kg}\cdot\text{m}^2$) is accelerated from rest to
    $10 \text{ rad/s}$ by a constant torque of $5.0 \text{ N}\cdot\text{m}$. How many
    radians did it turn through during this process?
  answer:
    value: 20.0
    tolerance: 1.0
  explanation: $W = \Delta K \implies \tau\theta = \frac{1}{2}I\omega_f^2$. $5.0\theta
    = 0.5(2.0)(100) = 100$. $\theta = 20 \text{ rad}$.
