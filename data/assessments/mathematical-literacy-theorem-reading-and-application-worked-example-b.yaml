workedExamples:
- id: mathematical-literacy-theorem-reading-and-application-worked-example-b-example
  title: Check a theorem before using it
  problem: A theorem says “If a number is divisible by 6, then it is divisible by 3.” Read a proposed use of the
    theorem for 18.
  steps:
  - id: step-1
    title: State the hypothesis
    type: freeResponse
    prompt: What condition must be checked before applying the theorem?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Check that the number is divisible by 6.
    explanation: |-
      Solution: Check that the number is divisible by 6.
      Why it works: The hypothesis is the condition that licenses the theorem’s conclusion.
  - id: step-2
    title: Verify the condition
    type: freeResponse
    prompt: How does 18 meet that condition?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$18=6\cdot3$, so 18 is divisible by 6.'
    explanation: |-
      Solution: $18=6\cdot3$, so 18 is divisible by 6.
      Why it works: An integer factor verifies divisibility.
  - id: step-3
    title: State only the warranted conclusion
    type: freeResponse
    prompt: What conclusion is now justified?
    instruction: State the specific mathematical reason used at this checkpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 18 is divisible by 3.
    explanation: |-
      Solution: 18 is divisible by 3.
      Why it works: The theorem supplies this conclusion after its hypothesis has been checked.
