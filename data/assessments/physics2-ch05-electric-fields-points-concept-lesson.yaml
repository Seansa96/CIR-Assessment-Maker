  - id: physics2-ch05-electric-fields-points-s4
    title: Superposition and components
    required: true
    content: Fields from multiple sources add as vectors, $\mathbf E=\sum_i\mathbf E_i$. Resolve each displacement into components before adding; symmetry may cancel one component of the total, not of each contribution.
    media:
    - type: image
      src: /media/physics2/point-field-superposition.svg
      alt: Two symmetric positive sources have canceling horizontal components and reinforcing vertical components.
      caption: Two symmetric positive sources have canceling horizontal components and reinforcing vertical components.
    check:
      id: physics2-ch05-electric-fields-points-s4-check
      type: multipleChoice
      prompt: Two identical positive charges symmetric about the y-axis produce at a point on that axis a net field with
      choices:
      - id: a
        text: horizontal components cancelling and vertical components adding
        media: []
        issueSignals: []
      - id: b
        text: vertical components cancelling and horizontal components adding
        media: []
        issueSignals:
        - id: integration-bounds-error
          domains: []
      - id: c
        text: No net field only at the source charges themselves
        media: []
        issueSignals:
        - id: integration-error
          domains: []
      - id: d
        text: magnitudes added without direction
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        How to Solve: For each symmetric pair, the horizontal components have equal magnitude and opposite directions, while the vertical components point the same way. Thus horizontal components cancel and vertical components add.


        Why it works: Superposition is vector addition, so symmetry must be applied component by component.


        Why the other choices fail: Choice B swaps the surviving component, choice C incorrectly cancels the entire field, and choice D adds magnitudes without resolving directions.
