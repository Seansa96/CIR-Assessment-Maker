  - id: physics2-ch05-electric-fields-points-s5
    title: Distance scaling
    required: true
    content: For one point charge, $|\mathbf E|=k|q|/r^2$. Doubling $r$ makes the field one-fourth, while doubling $|q|$ doubles it. State what is held fixed before using proportionality.
    media:
    - type: image
      src: /media/physics2/point-field-inverse-square.svg
      alt: Tripling the observation distance reduces the point-charge field to one ninth.
      caption: Tripling the observation distance reduces the point-charge field to one ninth.
    check:
      id: physics2-ch05-electric-fields-points-s5-check
