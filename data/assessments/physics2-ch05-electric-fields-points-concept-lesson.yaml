  - id: physics2-ch05-electric-fields-points-s7
    title: Transfer and limits
    required: true
    content: Use a consistent source/observer coordinate system, check signs and units, and test limits. A distant collection of charges behaves like net charge $Q$ to leading order, so $E\sim kQ/r^2$.
