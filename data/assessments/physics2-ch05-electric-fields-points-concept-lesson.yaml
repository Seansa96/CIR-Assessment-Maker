  - id: physics2-ch05-electric-fields-points-s2
    title: Point-charge field
    required: true
    content: For a source charge $q$ at $\mathbf r_s$, $\mathbf E(\mathbf r)=kq(\mathbf r-\mathbf r_s)/|\mathbf r-\mathbf r_s|^3$. Positive $q$ points away and negative $q$ points toward the source.
    media:
    - type: image
      src: /media/physics2/point-field-negative-source.svg
      alt: At a point right of a negative charge, the field arrow points left toward the source.
      caption: At a point right of a negative charge, the field arrow points left toward the source.
    check:
      id: physics2-ch05-electric-fields-points-s2-check
      type: multipleChoice
      prompt: At a point to the right of a negative point charge, the field points
      choices:
