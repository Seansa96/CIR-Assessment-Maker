lesson:
  introduction: >-
    How can Coulomb's law for a point charge predict the field of a rod or a disk? Replace the object with small charged pieces, add their vector fields, and take the limit as the pieces become infinitesimal. The integral is the final expression of that construction.


    You will build charge elements, resolve their fields, and evaluate rod, ring, and disk integrals. You need definite integrals, simple substitution, and vector components. We assume fixed charges in vacuum, use $k=1/(4\pi\varepsilon_0)$, and evaluate fields away from the idealized charged material. Charge densities are signed; the diagrams illustrate positive charge.
  sections:
  - id: physics2-ch05-electric-fields-points-s1
    title: Field as force per charge
    required: true
    content: Define the electric field at a location by $\mathbf E=\mathbf F/q_0$ for a positive test charge taken small enough not to disturb the sources. The field belongs to the source arrangement; a test charge samples it. For a point source, E = k q/r^2 and F = q_0 E, with vector direction supplied separately.
    media:
    - type: image
      src: /media/physics2/point-field-force.svg
      alt: Field and force point left for a positive test charge.
      caption: Field and force point left for a positive test charge.
    check:
      id: physics2-ch05-electric-fields-points-s1-check
      type: multipleChoice
      prompt: A positive test charge placed where $\mathbf E$ points left experiences force
      choices:
      - id: a
        text: left
        media: []
        issueSignals: []
      - id: b
        text: right
        media: []
        issueSignals: []
      - id: c
        text: A force tangent to the nearest field line
        media: []
        issueSignals:
        - id: vector-component-resolution-error
          domains: []
      - id: d
        text: perpendicular to $\mathbf E$
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        How to Solve: Use the force-field relation $\mathbf F=q_0\mathbf E$. Here $q_0>0$, so multiplying the left-pointing field by a positive scalar preserves its direction: the force points left.


        Why it works: The field is the source-produced quantity, while $q_0$ sets the force scale. A positive test charge experiences force along the field; only a negative test charge would reverse it.


        Why the other choices fail: Choice B reverses the direction, choice C confuses a field-line tangent with a different direction than the stated field, and choice D incorrectly makes the force perpendicular to the field.
