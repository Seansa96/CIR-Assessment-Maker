        text: upward
        media: []
        issueSignals: []
      - id: d
        text: no field because the charge is negative
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        How to Solve: A negative source charge attracts a positive test charge. At a point to its right, “toward the charge” is left.


        Why it works: The point-charge field direction is away from positive charge and toward negative charge; the sign determines the direction after the source-to-observer geometry is identified.


        Why the other choices fail: Choice A uses the positive-charge rule, choice C ignores the horizontal source-observer line, and choice D incorrectly claims a negative source produces no field.
