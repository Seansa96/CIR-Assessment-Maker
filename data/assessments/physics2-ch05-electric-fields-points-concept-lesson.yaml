  - id: physics2-ch05-electric-fields-points-s6
    title: Units and field lines
    required: true
    content: Field units are N/C (equivalently V/m). Field-line direction is tangent to $\mathbf E$; line density is qualitative, while the inverse-square equation supplies magnitude.
    media:
