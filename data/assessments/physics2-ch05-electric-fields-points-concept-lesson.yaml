workedExamples:
- id: l2-sec1
  title: The Electric Field Concept
  explanation: Instead of thinking of forces acting instantly at a distance, we model
    a charge as creating an electric field $\vec{E}$ in the space around it. The force
    on a test charge $q_0$ placed in this field is $\vec{F} = q_0 \vec{E}$.
- id: l2-sec2
  title: Field of a Point Charge
  explanation: 'The electric field created by a single point charge $q$ at a distance
    $r$ is:

    $$\vec{E} = k \frac{q}{r^2} \hat{r}$$

    It points radially outward from a positive charge and inward toward a negative
    charge.'
