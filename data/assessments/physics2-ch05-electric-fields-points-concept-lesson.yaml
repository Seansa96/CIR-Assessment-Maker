      explanation: >
        How to Solve: Use $|\mathbf E|=k|q|/r^2$. Replacing $r$ by $3r$ gives $|\mathbf E|'=k|q|/(3r)^2=|\mathbf E|/9$.


        Why it works: The inverse-square dependence applies to the distance while the charge and constant remain fixed.


        Why the other choices fail: Choices A and B treat the dependence as linear or inverse-linear, and choice D incorrectly removes distance from the point-charge law.
