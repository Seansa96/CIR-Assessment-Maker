      explanation: >
        How to Solve: The point-charge field magnitude is $E=k|q|/r^2$, so $kq/r^2$ has electric-field units, $\mathrm{N/C}$ (equivalently $\mathrm{V/m}$).


        Why it works: The Coulomb constant combines with charge and inverse distance squared to produce force per charge.


        Why the other choices fail: Choice B squares the charge, choice C uses the wrong distance power, and choice D omits the Coulomb constant, so their units do not match electric field.
