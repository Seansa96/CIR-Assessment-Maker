  - id: physics2-ch05-electric-fields-points-s3
    title: Field versus force
    required: true
    content: 'The field does not include the test charge: $\mathbf F=q_0\mathbf E$. Reversing the sign of $q_0$ reverses the force but leaves $\mathbf E$ unchanged.'
    media:
    - type: image
      src: /media/physics2/point-field-test-charge-sign.svg
      alt: The electric field points up while the force on a negative test charge points down.
      caption: The electric field points up while the force on a negative test charge points down.
    check:
      id: physics2-ch05-electric-fields-points-s3-check
      type: multipleChoice
      prompt: If $\mathbf E$ points upward and $q_0<0$, the force on the test charge points
      choices:
      - id: a
        text: upward, as if the test charge were positive
        media: []
        issueSignals: []
      - id: b
        text: downward
        media: []
        issueSignals: []
      - id: c
        text: no force because the field is independent of test charge
        media: []
        issueSignals:
        - id: vector-field-interpretation-error
          domains: []
      - id: d
        text: radially outward from the source
        media: []
        issueSignals:
        - id: scalar-vector-confusion
          domains: []
      answer:
        choiceId: b
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        How to Solve: With $q_0<0$, $\mathbf F=q_0\mathbf E$ reverses the field direction. An upward field therefore produces a downward force.


        Why it works: The field is independent of the test charge, but the force is not; a negative scalar reverses a vector.


        Why the other choices fail: Choice A forgets the sign of $q_0$, choice C confuses field independence with zero force, and choice D invents a radial direction not specified by the prompt.
