questions:
  - id: q001
    type: multipleChoice
    prompt: Which header is normally included when a beginner C++ program uses `std::cout`?
    choices:
      - id: a
        text: '`#include <iostream>`'
      - id: b
        text: '`#include <string>`'
      - id: c
        text: '`#include <vector>`'
      - id: d
        text: '`#include <cmath>`'
    answer:
      choiceId: a
    explanation: |
      `std::cout` is part of the iostream library. A simple console program that prints text usually begins with `#include <iostream>`.

      Related topic: C++ standard library headers and console output.

  - id: q002
    type: multipleChoice
    prompt: In a normal C++ console program, which function is the operating system expected to enter first?
    choices:
      - id: a
        text: '`start()`'
      - id: b
        text: '`run()`'
      - id: c
        text: '`int main()`'
      - id: d
        text: '`print()`'
    answer:
      choiceId: c
    explanation: |
      A hosted C++ program begins execution at `main`. The common beginner signature is `int main()`, and the returned integer reports the program's exit status.

      Related topic: C++ entry point and program lifetime.

  - id: q003
    type: multipleChoice
    prompt: What does `return 0;` at the end of `main` conventionally communicate?
    choices:
      - id: a
        text: The program failed before finishing.
      - id: b
        text: The program completed successfully.
      - id: c
        text: The program printed the number zero.
      - id: d
        text: The compiler should ignore all warnings.
    answer:
      choiceId: b
    explanation: |
      Returning `0` from `main` conventionally means success. Other exit codes are often used to signal different failure states.

      Related topic: process exit status.

  - id: q004
    type: multipleChoice
    prompt: Which statement prints the words `Hello, World!` followed by a newline without relying on `using namespace std;`?
    choices:
      - id: a
        text: '`cout << "Hello, World!\n";`'
      - id: b
        text: '`std::cout << "Hello, World!\n";`'
      - id: c
        text: '`std:cout >> "Hello, World!\n";`'
      - id: d
        text: '`print("Hello, World!\n");`'
    answer:
      choiceId: b
    explanation: |
      Without `using namespace std;`, names from the standard library need the `std::` qualifier. The insertion operator `<<` sends text into `std::cout`.

      Related topic: namespaces and stream insertion.

  - id: q005
    type: multipleChoice
    prompt: What does the `<<` operator do in the expression `std::cout << value;`?
    choices:
      - id: a
        text: It compares `std::cout` and `value`.
      - id: b
        text: It shifts the bits of `value` to the left.
      - id: c
        text: It inserts `value` into the output stream.
      - id: d
        text: It reads keyboard input into `value`.
    answer:
      choiceId: c
    explanation: |
      With output streams, `<<` is the stream insertion operator. The same symbol can mean bit shifting in other contexts, so the left operand matters.

      Related topic: overloaded operators and output streams.

  - id: q006
    type: multipleChoice
    prompt: |
      Which detail is most likely to cause a compile error in this statement?

      ```cpp
      std::cout << "Hi"
      ```
    choices:
      - id: a
        text: The statement is missing a semicolon.
      - id: b
        text: The word `Hi` is too short.
      - id: c
        text: '`std::cout` cannot print strings.'
      - id: d
        text: The statement must use single quotes.
    answer:
      choiceId: a
    explanation: |
      C++ statements usually end with semicolons. Missing semicolons are one of the most common beginner compile errors.

      Related topic: C++ statement syntax.

  - id: q007
    type: multipleChoice
    prompt: What does `\n` mean inside a C++ string literal?
    choices:
      - id: a
        text: It inserts a newline character.
      - id: b
        text: It stops the program immediately.
      - id: c
        text: It deletes the previous character.
      - id: d
        text: It begins a comment.
    answer:
      choiceId: a
    explanation: |
      `\n` is an escape sequence for a newline character. It is often used instead of `std::endl` when the goal is simply to move output to the next line.

      Related topic: string literals and escape sequences.

  - id: q008
    type: multipleChoice
    prompt: Why does C++ source code normally need to be compiled before it is run?
    choices:
      - id: a
        text: Compilation converts source code into a program the machine can execute and catches many syntax/type errors.
      - id: b
        text: Compilation deletes comments so no one can read them.
      - id: c
        text: Compilation is only needed when a program prints text.
      - id: d
        text: Compilation uploads the program to the internet.
    answer:
      choiceId: a
    explanation: |
      C++ is compiled. The compiler translates source files and reports issues such as missing semicolons, unknown names, or type mismatches before the executable is produced.

      Related topic: compile-run workflow.

  - id: q009
    type: multipleChoice
    prompt: Which option best describes a string literal in C++?
    choices:
      - id: a
        text: A named memory location that always stores a number.
      - id: b
        text: A sequence of characters written directly in source code, usually inside double quotes.
      - id: c
        text: A function that must be called before `main`.
      - id: d
        text: A compiler setting for ignoring errors.
    answer:
      choiceId: b
    explanation: |
      `"Hello"` is a string literal: the characters are written directly in the source code inside double quotes.

      Related topic: literals and text output.

  - id: q010
    type: multipleChoice
    prompt: Which version keeps the standard-library qualification explicit?
    choices:
      - id: a
        text: '`cout << "Ready";`'
      - id: b
        text: '`std::cout << "Ready";`'
      - id: c
        text: '`cout::std << "Ready";`'
      - id: d
        text: '`output.std("Ready");`'
    answer:
      choiceId: b
    explanation: |
      `std::cout` means the `cout` object from the `std` namespace. Writing the qualification explicitly avoids depending on `using namespace std;`.

      Related topic: namespace qualification.

  - id: q011
    type: code
    prompt: |
      Complete the function `helloWorld`.

      The runner will call `helloWorld(0)` and compare the returned text. The integer parameter is only present so the current runner can pass an input value; your function does not need to use it.
    language: cpp
    functionName: helloWorld
    starterCode: |
      string helloWorld(int unused)
      {
          return "";
      }
    tests:
      - input: '0'
        expected: Hello, World!
    explanation: |
      The hidden runner supplies `#include <bits/stdc++.h>` and calls your function from its own `main`. The function should return exactly `Hello, World!`.

      Related topic: returning strings from simple functions.

  - id: q012
    type: code
    prompt: |
      Complete the function `greet`.

      Return the exact text `Hello, NAME!` using the `name` parameter. For example, `greet("Ada")` should return `Hello, Ada!`.
    language: cpp
    functionName: greet
    starterCode: |
      string greet(string name)
      {
          return "";
      }
    tests:
      - input: '"Ada"'
        expected: Hello, Ada!
      - input: '"Linus"'
        expected: Hello, Linus!
    explanation: |
      Concatenate the fixed pieces of the message with the parameter: `"Hello, " + name + "!"`.

      Related topic: string concatenation and parameters.

  - id: q013
    type: code
    prompt: |
      Complete the function `addThenDouble`.

      It should add the two integer parameters and return twice that sum.
    language: cpp
    functionName: addThenDouble
    starterCode: |
      int addThenDouble(int a, int b)
      {
          return 0;
      }
    tests:
      - input: '2, 3'
        expected: '10'
      - input: '4, -1'
        expected: '6'
    explanation: |
      Add first, then multiply the result by two: `2 * (a + b)`. This checks that the function returns a value instead of printing one.

      Related topic: expressions and return values.

  - id: q014
    type: freeResponse
    prompt: |
      Explain the role of each major part of this beginner C++ program:

      ```cpp
      #include <iostream>

      int main()
      {
          std::cout << "Hello, World!\n";
          return 0;
      }
      ```
    answer:
      expected: |
        `#include <iostream>` makes stream output declarations such as `std::cout` available. `int main()` is the program entry point. The braces contain the statements that run. `std::cout << "Hello, World!\n";` sends text to the console and ends the line. `return 0;` reports successful completion.
      gradingMode: selfCheck
      keyPoints:
        - Identifies `#include <iostream>` as the source of console I/O declarations.
        - Identifies `main` as the entry point.
        - Explains that `std::cout` writes output.
        - Explains that `\n` creates a newline.
        - Explains that `return 0` signals success.
    explanation: |
      A useful way to read a first C++ program is from outside to inside: include the library, define the entry point, execute statements inside the block, write output, then return a status.

      Related topic: C++ program structure.

  - id: q015
    type: freeResponse
    prompt: |
      A beginner writes this line and the compiler reports an error near the next line:

      ```cpp
      std::cout << "Ready"
      return 0;
      ```

      What is wrong, and how should the code be fixed?
    answer:
      expected: |
        The output statement is missing its semicolon. It should be written as `std::cout << "Ready";` before the `return 0;` line. In C++, statements usually need to be terminated, and the compiler may report the error at or near the following line because it was still trying to parse the unfinished statement.
      gradingMode: selfCheck
      keyPoints:
        - States that the `std::cout` statement is missing a semicolon.
        - Gives the corrected line `std::cout << "Ready";`.
        - Explains that C++ statements generally need terminators.
        - Notes that compiler error locations can point near, not exactly at, the original mistake.
    explanation: |
      Missing semicolons are a syntax issue, not a logic issue. When the compiler reaches `return`, it still has not seen the end of the previous statement, so the diagnostic can feel one line late.

      Related topic: reading compiler diagnostics.
