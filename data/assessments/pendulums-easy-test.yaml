- id: q001
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: Use the Pendulums diagram and the model $T=2\pi\sqrt{L/g}$. A calibrated scenario scales the
    reference values by 1.1. Determine the period. Give a numerical answer.
  answer:
    value: 2.2
    tolerance: 0.022000000000000002
  explanation: Apply $T=2\pi\sqrt{L/g}$ consistently to the scaled scenario; the requested period is 2.2.
  media:
