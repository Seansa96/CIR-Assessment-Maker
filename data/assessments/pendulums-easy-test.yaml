- id: q001
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: A vehicle's strut of 242.9 N/m supports a quarter of the car's mass, which
    is 1.37 kg. Calculate the angular frequency in rad/s.
  answer:
    value: 13.3154
    tolerance: 0.05
  explanation: omega = sqrt(k/m) = sqrt(242.9/1.37) = 13.3154 rad/s.
- id: q002
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: An industrial suspension system features a spring of 23.0 N/m supporting
    a load of 5.1 kg. If the amplitude is 0.361 m, what is the maximum speed in m/s?
  answer:
    value: 0.7666
    tolerance: 0.05
  explanation: v_max = A*omega = 0.361 * sqrt(23.0/5.1) = 0.7666 m/s.
- id: q003
  type: numericResponse
  skills:
  - physics-pendulums
  prompt: In a microgravity experiment, a 8.93 kg sample oscillates on a spring of
    stiffness 52.6 N/m. What is the period of oscillation in seconds?
  answer:
    value: 2.5889
    tolerance: 0.05
  explanation: T = 2*pi*sqrt(m/k) = 2*pi*sqrt(8.93/52.6) = 2.5889 s.
