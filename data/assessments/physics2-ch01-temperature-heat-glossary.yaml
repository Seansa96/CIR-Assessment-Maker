{"schemaVersion": 1, "id": "physics2-ch01-temperature-heat-glossary", "title": "Temperature and Heat Glossary", "assessmentType": "glossary", "categoryId": "physics-2", "topicId": "physics2-temperature-heat", "modeDefault": "practice", "randomizeQuestions": false, "skills": ["physics2-temperature-heat"], "navigation": {"learningGoal": "learn", "activityType": "glossary", "tags": ["physics-2", "physics2-temperature-heat", "s2c-reviewed"]}, "glossary": {"introduction": "Vocabulary for modeling, calculation, and interpretation.", "sections": [{"id": "terms", "title": "Core terms", "required": true, "content": "Use definitions to distinguish quantities, processes, and assumptions.", "entries": [{"id": "t01", "term": "equilibrium", "definition": "The state in which two objects in thermal contact no longer exchange net heat, meaning they are at the same temperature.", "drills": [{"id": "t01-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with equilibrium.", "answer": {"expected": "equilibrium"}, explanation: "Solution:\nThermal equilibrium occurs when objects reach the same temperature.\n\nWhy it works:\nThe zeroth law of thermodynamics dictates that heat flows until temperatures equalize."}]}, {"id": "t02", "term": "Celsius scale", "definition": "A temperature scale where water freezes at 0 degrees and boils at 100 degrees at standard atmospheric pressure.", "drills": [{"id": "t02-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with Celsius scale.", "answer": {"expected": "Celsius scale"}, explanation: "Solution:\nThe Celsius scale is based on the phase changes of water.\n\nWhy it works:\nIt provides a practical metric reference point for everyday temperatures."}]}, {"id": "t03", "term": "Kelvin scale", "definition": "An absolute temperature scale starting at absolute zero, with increments equal to Celsius degrees.", "drills": [{"id": "t03-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with Kelvin scale.", "answer": {"expected": "Kelvin scale"}, explanation: "Solution:\nThe Kelvin scale defines absolute zero as 0 K.\n\nWhy it works:\nAbsolute temperature scales are required for thermodynamic equations like the ideal gas law."}]}, {"id": "t04", "term": "linear expansion", "definition": "The fractional change in length of a solid per degree change in temperature.", "drills": [{"id": "t04-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with linear expansion.", "answer": {"expected": "linear expansion"}, explanation: "Solution:\nLinear expansion describes how materials elongate when heated.\n\nWhy it works:\nIncreased thermal energy causes atoms to vibrate more, pushing them further apart."}]}, {"id": "t05", "term": "volume expansion", "definition": "The fractional change in volume of a substance per degree change in temperature.", "drills": [{"id": "t05-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with volume expansion.", "answer": {"expected": "volume expansion"}, explanation: "Solution:\nVolume expansion applies to the 3D expansion of solids, liquids, and gases.\n\nWhy it works:\nAs atomic separation increases with temperature, the entire volume of the material increases."}]}, {"id": "t06", "term": "specific heat", "definition": "The amount of heat required to raise the temperature of 1 kg of a substance by 1 K.", "drills": [{"id": "t06-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with specific heat.", "answer": {"expected": "specific heat"}, explanation: "Solution:\nSpecific heat measures a material's thermal inertia per unit mass.\n\nWhy it works:\nDifferent molecular structures require different amounts of energy to increase their kinetic energy."}]}, {"id": "t07", "term": "calorimetry", "definition": "The experimental measurement of heat transfer between systems.", "drills": [{"id": "t07-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with calorimetry.", "answer": {"expected": "calorimetry"}, explanation: "Solution:\nCalorimetry
uses conservation of energy to measure heat transfer.\n\nWhy it works:\nIn an insulated system, heat lost by hot objects equals heat gained by cold objects."}]}, {"id": "t08", "term": "latent heat", "definition": "The heat absorbed or released per unit mass during a phase change at constant temperature.", "drills": [{"id": "t08-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with latent heat.", "answer": {"expected": "latent heat"}, explanation: "Solution:\nLatent heat is the energy involved in phase changes.\n\nWhy it works:\nDuring a phase transition, energy breaks intermolecular bonds instead of raising temperature."}]}, {"id": "t09", "term": "melting point", "definition": "The specific temperature at which a solid transitions into a liquid.", "drills": [{"id": "t09-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with melting point.", "answer": {"expected": "melting point"}, explanation: "Solution:\nThe melting point is the solid-to-liquid transition temperature.\n\nWhy it works:\nAt this temperature, thermal energy is sufficient to overcome the solid's lattice bonds."}]}, {"id": "t10", "term": "boiling point", "definition": "The specific temperature at which a liquid transitions into a gas.", "drills": [{"id": "t10-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with boiling point.", "answer": {"expected": "boiling point"}, explanation: "Solution:\nThe boiling point is the liquid-to-gas transition temperature.\n\nWhy it works:\nAt this point, the vapor pressure of the liquid equals the surrounding atmospheric pressure."}]}, {"id": "t11", "term": "conduction", "definition": "Heat transfer through stationary matter by physical contact.", "drills": [{"id": "t11-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with conduction.", "answer": {"expected": "conduction"}, explanation: "Solution:\nConduction involves direct molecular collision.\n\nWhy it works:\nFast-moving particles collide with slower ones, transferring kinetic energy through the material."}]}, {"id": "t12", "term": "convection", "definition": "Heat transfer by the macroscopic movement of a fluid.", "drills": [{"id": "t12-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with convection.", "answer": {"expected": "convection"}, explanation: "Solution:\nConvection transfers heat via fluid flow.\n\nWhy it works:\nHeated fluid becomes less dense and rises, creating circulatory currents that transport heat."}]}, {"id": "t13", "term": "radiation", "definition": "Heat transfer by electromagnetic waves, requiring no medium.", "drills": [{"id": "t13-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with radiation.", "answer": {"expected": "radiation"}, explanation: "Solution:\nRadiation transfers energy via photons.\n\nWhy it works:\nAll objects emit electromagnetic radiation proportional to the fourth power of their absolute temperature."}]}, {"id": "t14", "term": "thermal conductivity", "definition": "A material property indicating its ability to conduct heat.", "drills": [{"id": "t14-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with thermal conductivity.", "answer": {"expected": "thermal conductivity"}, explanation: "Solution:\nThermal conductivity quantifies how easily heat flows through a material.\n\nWhy it works:\nMetals have high conductivity due to free electrons; insulators have low conductivity."}]}, {"id": "t15", "term": "heat capacity", "definition": "The amount of heat required to raise the temperature of a specific object by 1 K.", "drills": [{"id": "t15-d", "type": "typed", "prompt": "Name the term: a chapter concept associated with heat capacity.", "answer": {"expected": "heat capacity"}, explanation: "Solution:\nHeat capacity applies to an entire object rather than per unit mass.\n\nWhy it works:\nIt is the product of the object's mass and its specific heat."}]}]}]}}
