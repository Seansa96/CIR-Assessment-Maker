questions:
- id: q001
  type: multipleChoice
  prompt: What type of quantity is $\vec{A}\cdot\vec{B}$?
  choices:
  - id: a
    text: A scalar
  - id: b
    text: A vector parallel to $\vec{A}$
  - id: c
    text: A vector perpendicular to both vectors
  - id: d
    text: A unit vector
  answer:
    choiceId: a
  explanation: 'The exact concept is dot product output type. A dot product returns
    a scalar, often used for work, projection, or angle comparison.

    '
- id: q002
  type: multipleChoice
  prompt: For $\vec{A}=(3,-2)$ and $\vec{B}=(4,5)$, what is $\vec{A}\cdot\vec{B}$?
  choices:
  - id: a
    text: $2$
  - id: b
    text: $22$
  - id: c
    text: $-2$
  - id: d
    text: $12\hat{i}-10\hat{j}$
  answer:
    choiceId: a
  explanation: 'Use component dot product: $3(4)+(-2)(5)=12-10=2$. The exact technique
    is multiply matching components and add.

    '
- id: q003
  type: multipleChoice
  prompt: For $\vec{A}=(1,4,0)$ and $\vec{B}=(2,-3,0)$, what is the $k$ component
    of $\vec{A}\times\vec{B}$?
  choices:
  - id: a
    text: $-11$
  - id: b
    text: $11$
  - id: c
    text: $5$
  - id: d
    text: $-5$
  answer:
    choiceId: a
  explanation: 'Use $A_xB_y-A_yB_x=1(-3)-4(2)=-11$. The exact technique is the 2D
    cross product determinant.

    '
- id: q004
  type: multipleChoice
  prompt: Which product is most directly used to compute work done by a constant force?
  choices:
  - id: a
    text: Dot product
  - id: b
    text: Cross product
  - id: c
    text: Scalar multiplication only
  - id: d
    text: Vector subtraction only
  answer:
    choiceId: a
  explanation: 'Work uses $W=\vec{F}\cdot\vec{d}$ because only the component of force
    parallel to displacement contributes. The exact choice is dot product for parallel
    contribution.

    '
- id: q005
  type: multipleChoice
  prompt: Which product is most directly used to compute torque?
  choices:
  - id: a
    text: Cross product
  - id: b
    text: Dot product
  - id: c
    text: Vector addition
  - id: d
    text: Component averaging
  answer:
    choiceId: a
  explanation: 'Torque uses $\vec{\tau}=\vec{r}\times\vec{F}$ because torque direction
    is perpendicular to the plane formed by lever arm and force. The exact choice
    is cross product.

    '
- id: q006
  type: multipleChoice
  prompt: If two nonzero vectors are perpendicular, what is their dot product?
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1$
  - id: c
    text: Their magnitude product
  - id: d
    text: Always negative
  answer:
    choiceId: a
  explanation: 'Since $\vec{A}\cdot\vec{B}=|\vec{A}||\vec{B}|\cos 90^\circ$, the result
    is $0$. The exact concept is orthogonality through the dot product.

    '
- id: q007
  type: selectAll
  prompt: Which statements correctly describe the cross product?
  choices:
  - id: a
    text: Its magnitude is $|\vec{A}||\vec{B}|\sin\theta$.
  - id: b
    text: Its direction is perpendicular to both input vectors.
  - id: c
    text: It is used in torque.
  - id: d
    text: It always produces a scalar.
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: 'The exact concept is cross product structure: magnitude from the perpendicular
    part, direction from the right-hand rule, and vector output.

    '
- id: q008
  type: multipleChoice
  prompt: If $\hat{i}\times\hat{j}=\hat{k}$, what is $\hat{j}\times\hat{i}$?
  choices:
  - id: a
    text: $-\hat{k}$
  - id: b
    text: $\hat{k}$
  - id: c
    text: $0$
  - id: d
    text: $\hat{i}+\hat{j}$
  answer:
    choiceId: a
  explanation: 'Reversing cross product order changes the sign. The exact technique
    is anticommutativity: $\vec{A}\times\vec{B}=-(\vec{B}\times\vec{A})$.

    '
