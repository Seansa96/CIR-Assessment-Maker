  - id: newton-law-terms
    title: Newton's Laws Terms
    entries:
      - { id: inertia, term: Inertia, definition: 'Tendency of an object to resist changes in velocity.', drills: [{ id: nlg1, type: typed, prompt: 'What property resists changes in motion?', answer: { expected: inertia, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Inertia.\n\nWhy it works: It is the content of Newton''s first law.' }] }
      - { id: net-force, term: Net force, definition: 'Vector sum of external forces on a system.', drills: [{ id: nlg2, type: cloze, prompt: 'Newton''s second law is $\sum F=____$.', answer: { expected: ma, expectedLatex: 'ma', aliases: [], media: [] }, explanation: 'Solution: $ma$.\n\nWhy it works: Net force causes acceleration.' }] }
      - { id: action-reaction, term: Action-reaction pair, definition: 'Equal and opposite forces exerted by two interacting objects on each other.', drills: [{ id: nlg3, type: typed, prompt: 'Do Newton third-law forces act on the same object?', answer: { expected: no, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: No.\n\nWhy it works: They act on different interacting objects.' }] }
      - { id: weight, term: Weight, definition: 'Gravitational force on mass, $W=mg$.', drills: [{ id: nlg4, type: cloze, prompt: 'Weight near Earth is $W=____$.', answer: { expected: mg, expectedLatex: 'mg', aliases: [], media: [] }, explanation: 'Solution: $mg$.\n\nWhy it works: Gravity force is mass times field strength.' }] }
