workedExamples:
- id: aops-count-we-1
  title: 'Permutations with Grouping'
  prompt: 'Five friends—Alice, Bob, Charlie, David, and Eve—are sitting in a row of 5 chairs at a movie theater. If Alice and Bob refuse to sit next to each other, how many different seating arrangements are possible?'
  steps:
  - id: step-1
    title: Find the total unconstrained arrangements
    prompt: Calculate the total number of ways the 5 friends can sit if there were no restrictions.
    difficultyDimensions:
    - Recognize this is an arrangement of all 5 distinct people.
    - Calculate $5!$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total arrangements $= 5!$.
      - $5! = 120$.
    explanation: |
      Solution:
      If there were no restrictions, we would just be arranging 5 distinct people in 5 distinct chairs.
      The number of ways to do this is $5!$ (5 factorial).
      $$5! = 5 \times 4 \times 3 \times 2 \times 1 = 120$$

      Why it works:
      Counting the total universe of possibilities is the first step in "complementary counting," a powerful technique where we count what we *don't* want and subtract it from the total.
  - id: step-2
    title: Count the restricted arrangements
    prompt: Find the number of seating arrangements where Alice and Bob *do* sit next to each other (the complement).
    difficultyDimensions:
    - Group Alice and Bob as a single "block".
    - Arrange the 4 items (3 people + 1 block) using $4!$.
    - Multiply by $2!$ because Alice and Bob can swap places within their block.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Treat Alice and Bob as one unit. There are now 4 units to arrange ($4! = 24$).
      - Alice and Bob can sit as AB or BA ($2! = 2$).
      - Total restricted arrangements = $24 \times 2 = 48$.
    explanation: |
      Solution:
      We want to count the arrangements where Alice and Bob are seated together.
      To do this, tie them together and treat them as a single "super-person" or block.
      Now we have 4 units to arrange: (Alice-Bob), Charlie, David, Eve.
      The number of ways to arrange these 4 units is $4! = 24$.
      However, inside their block, Alice and Bob can be arranged in $2! = 2$ ways (Alice on the left, or Bob on the left).
      By the Multiplication Principle, the total number of restricted arrangements is:
      $$24 \times 2 = 48$$

      Why it works:
      Grouping items into blocks is the standard method for forcing items to be adjacent in permutations.
  - id: step-3
    title: Apply complementary counting
    prompt: Subtract the restricted arrangements from the total to find the valid arrangements.
    difficultyDimensions:
    - Subtract 48 from 120.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total - Restricted = Valid.
      - $120 - 48 = 72$.
    explanation: |
      Solution:
      We know there are 120 total possible seating arrangements, and exactly 48 of them have Alice and Bob sitting together.
      Therefore, the number of arrangements where they do *not* sit together is:
      $$120 - 48 = 72$$
      There are 72 possible seating arrangements.

      Why it works:
      Complementary counting is almost always faster than trying to do direct casework on all the ways Alice and Bob could be separated (e.g., separated by 1 person, 2 people, or 3 people).

- id: aops-count-we-2
  title: 'Combinations with Cases'
  prompt: 'A committee of 4 people must be chosen from a group of 5 teachers and 6 students. How many different committees can be formed that contain exactly 2 teachers and 2 students?'
  steps:
  - id: step-1
    title: Choose the teachers
    prompt: Calculate the number of ways to select exactly 2 teachers from the 5 available teachers.
    difficultyDimensions:
    - Recognize that order doesn't matter (it's a committee).
    - Calculate $\binom{5}{2}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Use combinations because order doesn't matter.
      - $\binom{5}{2} = \frac{5 \times 4}{2 \times 1} = 10$.
    explanation: |
      Solution:
      Since we are just forming a group, the order in which we select the people does not matter. We use combinations.
      We need to choose 2 teachers out of a pool of 5.
      $$\binom{5}{2} = \frac{5!}{2!(5-2)!} = \frac{5 \times 4}{2 \times 1} = 10$$
      There are 10 ways to choose the teachers.

      Why it works:
      We isolate this specific sub-task (choosing teachers) from the rest of the problem to keep the math simple.
  - id: step-2
    title: Choose the students
    prompt: Calculate the number of ways to select exactly 2 students from the 6 available students.
    difficultyDimensions:
    - Calculate $\binom{6}{2}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\binom{6}{2} = \frac{6 \times 5}{2 \times 1} = 15$.
    explanation: |
      Solution:
      Similarly, we need to choose 2 students out of a pool of 6.
      $$\binom{6}{2} = \frac{6!}{2!(6-2)!} = \frac{6 \times 5}{2 \times 1} = 15$$
      There are 15 ways to choose the students.

      Why it works:
      This is the second independent sub-task required to build our committee.
  - id: step-3
    title: Combine the choices
    prompt: Combine the results from the previous steps to find the total number of valid committees.
    difficultyDimensions:
    - Recognize that choosing teachers and choosing students are sequential events.
    - Multiply $10 \times 15$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Use the Multiplication Principle.
      - Total $= 10 \times 15 = 150$.
    explanation: |
      Solution:
      To form the final committee, we must choose the teachers *and* choose the students.
      Because these are sequential, independent choices, we use the Multiplication Principle.
      $$\text{Total ways} = \binom{5}{2} \times \binom{6}{2} = 10 \times 15 = 150$$
      There are 150 different possible committees.

      Why it works:
      A common mistake is adding the two results ($10 + 15 = 25$). Addition is for mutually exclusive cases (OR). Multiplication is for sequential choices (AND).

- id: aops-count-we-3
  title: 'Stars and Bars with Restrictions'
  prompt: 'How many ways can 10 identical apples be distributed among 3 children so that every child receives at least one apple?'
  steps:
  - id: step-1
    title: Satisfy the minimum requirement
    prompt: Give each child one apple to satisfy the "at least one" constraint. How many apples are left to distribute freely?
    difficultyDimensions:
    - Subtract 1 apple for each of the 3 children.
    - $10 - 3 = 7$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Distribute 3 apples initially.
      - Apples remaining $n = 10 - 3 = 7$.
    explanation: |
      Solution:
      The problem requires that every child receives at least one apple.
      Because the apples are identical, we don't care *which* apples they get, just how many. Let's physically hand 1 apple to each of the 3 children right away.
      This uses up 3 apples.
      The number of apples we have left to distribute freely is:
      $$10 - 3 = 7$$
      
      Why it works:
      By front-loading the minimum requirement, we convert a restricted problem into an unrestricted Stars and Bars problem where a child is now allowed to receive 0 of the *remaining* apples.
  - id: step-2
    title: Set up Stars and Bars
    prompt: Identify the number of "stars" ($n$) and "bars" ($k-1$) needed to distribute the remaining apples.
    difficultyDimensions:
    - Identify $n = 7$ remaining apples.
    - Identify $k = 3$ children, so we need $3 - 1 = 2$ bars.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Stars (items) $n = 7$.
      - Bars (partitions) $k - 1 = 3 - 1 = 2$.
    explanation: |
      Solution:
      We are now distributing $n = 7$ identical apples (the stars) among $k = 3$ distinct children.
      To partition a line of stars into 3 groups, we need $k - 1 = 2$ bars.

      Why it works:
      For example, `**|***|**` means the first child gets 2 of the remaining apples, the second gets 3, and the third gets 2.
  - id: step-3
    title: Calculate the combinations
    prompt: Calculate the total number of arrangements of the stars and bars.
    difficultyDimensions:
    - Total positions = $7 + 2 = 9$.
    - Calculate $\binom{9}{2}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total positions $n + k - 1 = 7 + 2 = 9$.
      - $\binom{9}{2} = \frac{9 \times 8}{2 \times 1} = 36$.
    explanation: |
      Solution:
      We have 7 stars and 2 bars, giving a total of $7 + 2 = 9$ symbols to arrange in a line.
      We just need to choose which 2 of those 9 positions will hold the bars.
      $$\binom{9}{2} = \frac{9 \times 8}{2 \times 1} = \frac{72}{2} = 36$$
      There are 36 ways to distribute the apples.

      Why it works:
      There is a shortcut formula for Stars and Bars when every bin must get $\ge 1$ item: $\binom{N-1}{k-1}$, where $N$ is the *original* number of items. Let's check it: $\binom{10-1}{3-1} = \binom{9}{2} = 36$. Our manual subtraction method gives the exact same result!
