    - type: image
      src: /media/calculus-3/surface-integrals.svg
      alt: Original parametric surfaces and surface integrals reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: How many parameters define a parametric surface?
      choices:
      - id: a
        text: two
        media: []
        issueSignals: []
      - id: b
        text: ru and rv (answers 'What vectors are tangent to r(u,v)?', not 'How many parameters define a parametric surface?')
        media: []
        issueSignals:
        - id: surface-orientation-parameterization-error
          domains: []
      - id: c
        text: ru cross rv (answers 'What produces a normal direction?', not 'How many parameters define a parametric surface?')
        media: []
        issueSignals:
        - id: surface-orientation-parameterization-error
          domains: []
      - id: d
        text: surface area element (answers 'What does dS represent?', not 'How many parameters define a parametric surface?')
        media: []
        issueSignals:
        - id: surface-orientation-parameterization-error
          domains: []
