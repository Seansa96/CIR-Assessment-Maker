  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Vector-Valued Functions if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Two parameters sweep a surface
    required: true
    content: 'A parametric surface maps a parameter domain into three-dimensional points. In Parametric Surfaces and Surface Integrals, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
