  - id: s03
    title: Orientation selects a side
    required: true
    content: Reversing the normal reverses a vector flux integral but not scalar surface area. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
