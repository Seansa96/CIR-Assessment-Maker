questions:
- id: q001
  type: multipleChoice
  prompt: 'In $\triangle ABC$, $AB = AC$. If $m\angle A = 40^\circ$, what is $m\angle B$?'
  difficultyDimensions:
  - Recognize that $AB = AC$ means the triangle is isosceles.
  - Recall that base angles opposite equal sides are equal ($m\angle B = m\angle C$).
  - Set up equation: $40 + 2x = 180$.
  - Solve for $x$: $2x = 140 \implies x = 70^\circ$.
  choices:
  - id: a
    text: '$40^\circ$'
    issueSignals:
    - vertex-base-confusion
  - id: b
    text: '$70^\circ$'
  - id: c
    text: '$100^\circ$'
    issueSignals:
    - single-subtraction-error
  - id: d
    text: '$140^\circ$'
    issueSignals:
    - half-omission-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    Because $AB = AC$, $\triangle ABC$ is an isosceles triangle. The angles opposite these sides (angle $B$ and angle $C$) must be perfectly equal.
    The sum of the angles in a triangle is $180^\circ$.
    $m\angle A + m\angle B + m\angle C = 180^\circ$
    $40^\circ + x + x = 180^\circ$
    $40^\circ + 2x = 180^\circ$
    $2x = 140^\circ \implies x = 70^\circ$.
    Therefore, $m\angle B = 70^\circ$.

    Why it works:
    Isosceles triangles possess a single line of symmetry straight down the middle. This symmetry guarantees that the two "base" angles are mirror images of each other.

    Why the other choices fail:
    - $40^\circ$ incorrectly assumes angle $B$ is the vertex angle that is equal to angle $A$.
    - $100^\circ$ might come from $180 - 40 - 40$, assuming $A$ and some other angle were $40$.
    - $140^\circ$ correctly subtracts $40$ from $180$, but forgets to divide the remainder equally between the two base angles.

- id: q002
  type: multipleChoice
  prompt: 'A circle has a circumference of $16\pi$. What is its area?'
  difficultyDimensions:
  - Recall the circumference formula: $C = 2\pi r$.
  - Set up equation: $16\pi = 2\pi r$.
  - Solve for $r$: $r = 8$.
  - Recall the area formula: $A = \pi r^2$.
  - Calculate area: $\pi(8^2) = 64\pi$.
  choices:
  - id: a
    text: '$32\pi$'
    issueSignals:
    - diameter-radius-confusion
  - id: b
    text: '$256\pi$'
    issueSignals:
    - circumference-squared-error
  - id: c
    text: '$64\pi$'
  - id: d
    text: '$16\pi$'
    issueSignals:
    - formula-swap-error
  answer:
    choiceId: c
  explanation: |
    Solution:
    First, use the circumference to find the radius of the circle.
    $C = 2\pi r$
    $16\pi = 2\pi r$
    Divide by $2\pi$:
    $r = 8$.
    Now, use the radius to find the area.
    $A = \pi r^2$
    $A = \pi(8^2)$
    $A = 64\pi$.

    Why it works:
    You cannot jump directly from circumference to area. You must always use the given information to find the 1-dimensional radius first, as the radius is the master "key" to unlock all other circle properties.

    Why the other choices fail:
    - $32\pi$ incorrectly assumes the given 16 is the radius ($\pi \cdot 16^2 = 256\pi$... wait, $32\pi$ is $2\pi \cdot 16$).
    - $256\pi$ uses the full diameter (16) as the radius ($\pi \cdot 16^2 = 256\pi$).
    - $16\pi$ assumes area and circumference are equal (which only happens when $r=2$).

- id: q003
  type: multipleChoice
  prompt: 'A $15\text{-foot}$ ladder is leaning against a vertical wall. The base of the ladder is $9\text{ feet}$ away from the bottom of the wall. How high up the wall does the ladder reach?'
  difficultyDimensions:
  - Recognize this forms a right triangle.
  - Identify the ladder as the hypotenuse ($c = 15$) and the distance as a leg ($a = 9$).
  - Set up Pythagorean theorem: $9^2 + b^2 = 15^2$.
  - Solve for $b$: $81 + b^2 = 225 \implies b^2 = 144 \implies b = 12$.
  choices:
  - id: a
    text: '$12\text{ feet}$'
  - id: b
    text: '$24\text{ feet}$'
    issueSignals:
    - addition-error
  - id: c
    text: '$17.5\text{ feet}$'
    issueSignals:
    - hypotenuse-leg-confusion
  - id: d
    text: '$144\text{ feet}$'
    issueSignals:
    - square-root-omission
  answer:
    choiceId: a
  explanation: |
    Solution:
    The ladder, the wall, and the ground form a right triangle.
    The ladder itself is the longest side (the hypotenuse, $c = 15$).
    The distance along the ground is one leg ($a = 9$). We want to find the height ($b$).
    Use the Pythagorean theorem: $a^2 + b^2 = c^2$.
    $9^2 + b^2 = 15^2$
    $81 + b^2 = 225$
    $b^2 = 144$
    $b = 12\text{ feet}$.

    Why it works:
    This is a classic 3-4-5 right triangle scaled up by a factor of 3. $3\times3=9$, $4\times3=12$, and $5\times3=15$. Knowing Pythagorean triples can save you calculation time.

    Why the other choices fail:
    - $24$ might come from $15+9=24$.
    - $17.5$ comes from incorrectly treating the ladder and the ground as the two legs ($15^2 + 9^2 = c^2 \implies 225 + 81 = 306 \implies \sqrt{306} \approx 17.5$).
    - $144$ forgets to take the final square root.

- id: q004
  type: multipleChoice
  prompt: 'Two parallel lines are cut by a transversal. If one interior angle measures $115^\circ$, what is the measure of the alternate interior angle?'
  difficultyDimensions:
  - Recall the Alternate Interior Angles Theorem.
  - Recognize that alternate interior angles are congruent (equal).
  - Conclude the angle is $115^\circ$.
  choices:
  - id: a
    text: '$65^\circ$'
    issueSignals:
    - supplementary-confusion
  - id: b
    text: '$115^\circ$'
  - id: c
    text: '$25^\circ$'
    issueSignals:
    - complementary-confusion
  - id: d
    text: '$180^\circ$'
    issueSignals:
    - sum-confusion
  answer:
    choiceId: b
  explanation: |
    Solution:
    When two parallel lines are cut by a transversal, alternate interior angles (angles on opposite sides of the transversal, between the two parallel lines) are strictly congruent (equal in measure).
    Therefore, the other angle also measures $115^\circ$.

    Why it works:
    In a parallel line and transversal setup, every angle created is either acute or obtuse (unless the transversal is perfectly perpendicular). All the obtuse angles are equal to each other, and all the acute angles are equal to each other. Since $115^\circ$ is obtuse, the alternate interior angle (which is also obtuse) must be exactly the same.

    Why the other choices fail:
    - $65^\circ$ is the measure of the *consecutive* interior angle (which is supplementary, $180 - 115 = 65$).
    - $25^\circ$ assumes the angle is complementary ($90 - 115 \to -25$? Just a distractor).
    - $180^\circ$ is the sum of supplementary angles, not the measure of a single angle.

- id: q005
  type: multipleChoice
  prompt: 'A large rectangle has dimensions $20 \times 10$. A smaller rectangle with dimensions $8 \times 4$ is placed completely inside it. What is the area of the region inside the large rectangle but outside the small rectangle?'
  difficultyDimensions:
  - Calculate area of large rectangle: $20 \cdot 10 = 200$.
  - Calculate area of small rectangle: $8 \cdot 4 = 32$.
  - Subtract small area from large area: $200 - 32 = 168$.
  choices:
  - id: a
    text: '$168$'
  - id: b
    text: '$232$'
    issueSignals:
    - addition-instead-of-subtraction
  - id: c
    text: '$120$'
    issueSignals:
    - linear-subtraction-error
  - id: d
    text: '$72$'
    issueSignals:
    - perimeter-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    To find the area of the remaining region, calculate the total area and subtract the area of the "hole".
    Area of large rectangle = $20 \times 10 = 200$.
    Area of small rectangle = $8 \times 4 = 32$.
    Remaining Area = $200 - 32 = 168$.

    Why it works:
    Area is an additive property. You can find the area of complex shapes by adding or subtracting the areas of simpler shapes that comprise it.

    Why the other choices fail:
    - $232$ adds the areas together instead of subtracting ($200 + 32$).
    - $120$ subtracts the dimensions first before multiplying ($(20 - 8) \times (10 - 4) = 12 \times 6 = 72$, wait, $120$ is maybe $12 \times 10$).
    - $72$ is what you get if you subtract the lengths ($20-8=12$) and widths ($10-4=6$) and then multiply them ($12 \times 6 = 72$).
