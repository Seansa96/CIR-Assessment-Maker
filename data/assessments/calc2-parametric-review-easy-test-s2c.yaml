authoring: { visualRequirement: required, visualRationale: 'Orientation, tangent direction, and accumulated area are spatial relationships; original traces support the relevant prompts.', difficultyTier: easy }
questions:
  - { id: q001, type: symbolicResponse, prompt: 'For $x=t+1$, $y=2t-3$, eliminate $t$.', answer: { expectedLatex: 'y=2x-5', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: From $x=t+1$, $t=x-1$. Substitute: $y=2(x-1)-3=2x-5$. Why it works: Eliminating the parameter expresses the same points in Cartesian variables. Common trap: Substitute $x-1$, not $x+1$.' , difficultyDimensions: [representationTransfer, simplification], difficultyEvidence: 'Solves for the parameter and simplifies a substituted equation.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q002, type: freeResponse, prompt: 'For $x=3\cos t$, $y=3\sin t$, $0\le t\le2\pi$, state the curve, its starting point, and its orientation.', answer: { gradingMode: selfCheck, keyPoints: ['x squared plus y squared equals 9', 'starts at 3 comma 0', 'counterclockwise'] }, explanation: 'Solution: Squaring and adding gives $x^2+y^2=9$. At $t=0$ the point is $(3,0)$; as $t$ increases, $y$ becomes positive, so the circle is counterclockwise. Why it works: Sine and cosine give the coordinates of a rotating radius. Common trap: The equation alone does not report orientation.' , difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Connects a parameterization to both its Cartesian locus and directed trace.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q003, type: symbolicResponse, prompt: 'For $x=t^2$, $y=t^3$, find $dy/dx$ at $t=2$.', answer: { expectedLatex: '3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $dx/dt=2t$ and $dy/dt=3t^2$, so $dy/dx=(3t^2)/(2t)=3t/2$. At $t=2$, the slope is $3$. Why it works: The chain rule gives $dy/dx=(dy/dt)/(dx/dt)$ when $dx/dt\ne0$. Common trap: Do not differentiate $y$ with respect to $x$ as though $t=x$.' , difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: 'Uses the parametric derivative rule and cancels a common factor.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q004, type: symbolicResponse, prompt: 'For $x=t^2+1$, $y=t^3-3t$, find $d^2y/dx^2$ at $t=1$.', answer: { expectedLatex: '3/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $dy/dx=3(t^2-1)/(2t)=(3/2)(t-1/t)$. Then $d(dy/dx)/dt=(3/2)(1+1/t^2)$; divide by $dx/dt=2t$. At $1$, $d^2y/dx^2=3/2$. Why it works: A second parametric derivative needs one more division by $dx/dt$. Common trap: Forgetting that final division.' , difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: 'Differentiates a quotient-derived slope and applies the second-derivative rule.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q005, type: symbolicResponse, prompt: 'Find the area under $x=t$, $y=t^2$ for $0\le t\le2$.', answer: { expectedLatex: '8/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $A=\int y\,dx=\int_0^2t^2(1)dt=8/3$. Why it works: $dx=(dx/dt)dt=dt$. Common trap: The parameter bounds, not x-bounds guessed from the graph, drive the setup.' , difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: 'Transfers the area integral into parameter form and supplies matching bounds.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q006, type: symbolicResponse, prompt: 'Find the arc length of $x=3t$, $y=4t$, $0\le t\le2$.', answer: { expectedLatex: '10', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $L=\int_0^2\sqrt{3^2+4^2}\,dt=\int_0^25dt=10$. Why it works: The speed is the magnitude of $(dx/dt,dy/dt)$. Common trap: Arc length uses both coordinate rates.' , difficultyDimensions: [modelOrDerivation, simplification], difficultyEvidence: 'Constructs speed from two rates and uses the Pythagorean simplification.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q007, type: symbolicResponse, prompt: 'For $x=\cos t$, $y=\sin t$, find the tangent-line equation at $t=\pi/4$.', answer: { expectedLatex: 'y=-x+sqrt(2)', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: The point is $(\sqrt2/2,\sqrt2/2)$ and slope is $(-\sin t)/(\cos t)=-1$. Thus $y-\sqrt2/2=-(x-\sqrt2/2)$, or $y=-x+\sqrt2$. Why it works: A tangent requires both the traced point and slope. Common trap: Using the radius slope instead of the tangent slope.' , difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Evaluates position and derivative, then forms point-slope form.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q008, type: freeResponse, prompt: '![Directed parametric trace](/media/calculus/parametric-review-trace.svg) The trace starts at $(0,0)$, moves right and upward, and ends at $(4,0)$. Give parameter bounds for $x=t$, $y=4t-t^2$.', answer: { gradingMode: selfCheck, keyPoints: ['zero less than or equal to t less than or equal to four', 'starts t zero', 'ends t four'] }, explanation: 'Solution: Take $0\le t\le4$: then $(x,y)$ runs from $(0,0)$ to $(4,0)$ with $y\ge0$. Why it works: Here $x=t$, so parameter order is horizontal order. Common trap: $t\in[-2,2]$ describes a different part and orientation.' , difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Reads a directed trace and translates endpoints into parameter constraints.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q009, type: symbolicResponse, prompt: 'For $x=t^3-3t$, $y=t^2$, find the parameter values giving horizontal tangents.', answer: { expectedLatex: 't=0', equivalenceMode: expression, variables: [t], tolerance: 0.000001 }, explanation: 'Solution: Horizontal means $dy/dt=2t=0$ while $dx/dt=3t^2-3\ne0$. Thus $t=0$. Why it works: The numerator of $dy/dx$ vanishes but the denominator must not. Common trap: Listing $t=\pm1$; those make $dx/dt=0$.' , difficultyDimensions: [domainCondition, modelOrDerivation], difficultyEvidence: 'Applies the horizontal-tangent condition and checks the denominator.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q010, type: symbolicResponse, prompt: 'For $x=t^3-3t$, $y=t^2$, find the parameter values giving vertical tangents.', answer: { expectedLatex: 't=-1,1', equivalenceMode: expression, variables: [t], tolerance: 0.000001 }, explanation: 'Solution: Vertical means $dx/dt=3(t^2-1)=0$ and $dy/dt=2t\ne0$, so $t=\pm1$. Why it works: A vertical tangent has an undefined $dy/dx$ caused by a nonzero-over-zero quotient. Common trap: Reversing the horizontal and vertical tests.' , difficultyDimensions: [domainCondition, modelOrDerivation], difficultyEvidence: 'Solves the derivative threshold and excludes a simultaneous zero.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q011, type: symbolicResponse, prompt: 'For $x=2t-1$, $y=t^2$, find $d^2y/dx^2$.', answer: { expectedLatex: '1/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $dy/dx=(2t)/2=t$. Differentiating gives $d(dy/dx)/dt=1$, and dividing by $dx/dt=2$ gives $1/2$. Why it works: The second derivative measures slope change per x-change. Common trap: Reporting 1, which is change per parameter.' , difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Distinguishes parameter rate from the requested x-based second derivative.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q012, type: symbolicResponse, prompt: 'Find the area under $x=t^2$, $y=t$, $0\le t\le2$.', answer: { expectedLatex: '16/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $dx/dt=2t$, so $A=\int_0^2t(2t)dt=\int_0^22t^2dt=16/3$. Why it works: The parametric area element is $y(dx/dt)dt$. Common trap: Omitting $dx/dt$.' , difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts differential dx to a parameter derivative and integrates.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q013, type: symbolicResponse, prompt: 'Find the arc length of $x=\cos t$, $y=\sin t$, $0\le t\le\pi/2$.', answer: { expectedLatex: 'pi/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Speed is $\sqrt{\sin^2t+\cos^2t}=1$, so $L=\int_0^{\pi/2}dt=\pi/2$. Why it works: The parameter traces a unit circle at unit speed. Common trap: Confusing a quarter-circle length with its chord $\sqrt2$.' , difficultyDimensions: [identityConstruction, modelOrDerivation], difficultyEvidence: 'Uses a trigonometric identity inside the speed model.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q014, type: symbolicResponse, prompt: 'For $x=e^t$, $y=e^{-t}$, eliminate $t$.', answer: { expectedLatex: 'xy=1', equivalenceMode: expression, variables: [x,y], tolerance: 0.000001 }, explanation: 'Solution: Multiply: $xy=e^te^{-t}=1$. Why it works: Opposite exponents cancel. Common trap: Writing $x+y=1$, which does not follow from exponent rules.' , difficultyDimensions: [identityConstruction, representationTransfer], difficultyEvidence: 'Recognizes an invariant product and uses it to eliminate the parameter.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q015, type: symbolicResponse, prompt: 'For $x=t^2$, $y=t^2-4$, state the Cartesian relation.', answer: { expectedLatex: 'y=x-4', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: Both coordinates contain $t^2$, so $y=x-4$. Also $x\ge0$. Why it works: Parameter restrictions remain part of the traced curve. Common trap: Calling the trace the entire line; negative x is not reached.' , difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: 'Eliminates a shared expression and preserves the parameter-imposed domain.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q016, type: symbolicResponse, prompt: 'Find the area enclosed by $x=2\cos t$, $y=2\sin t$, $0\le t\le2\pi$ using $A=-\int y\,dx$.', answer: { expectedLatex: '4pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $dx=-2\sin tdt$, so $A=-\int_0^{2\pi}(2\sin t)(-2\sin t)dt=4\int_0^{2\pi}\sin^2t dt=4\pi$. Why it works: The directed closed-curve formula accumulates signed area once around the circle. Common trap: Reversing orientation changes the sign before the leading minus corrects it.' , difficultyDimensions: [representationTransfer, identityConstruction], difficultyEvidence: 'Builds the parametric area integral and reduces a squared trig function.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q017, type: freeResponse, prompt: 'A path has $dx/dt=0$ and $dy/dt=0$ at $t=1$. Explain why that fact alone does not classify the tangent there.', answer: { gradingMode: selfCheck, keyPoints: ['dy dx is zero over zero', 'need nearby behavior or higher derivatives', 'could be cusp or smooth tangent'] }, explanation: 'Solution: The slope formula is $0/0$, so it is indeterminate. Examine nearby values, a simplified derivative, or higher derivatives before calling it horizontal or vertical. Why it works: A simultaneous stop does not supply a direction. Common trap: Declaring every simultaneous zero a vertical tangent.' , difficultyDimensions: [domainCondition, errorDiagnosis], difficultyEvidence: 'Diagnoses an indeterminate derivative form and names the necessary additional analysis.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q018, type: symbolicResponse, prompt: 'For $x=t-\sin t$, $y=1-\cos t$, find $dy/dx$ at $t=\pi/2$.', answer: { expectedLatex: '1', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $dx/dt=1-\cos t$ and $dy/dt=\sin t$. At $\pi/2$, both are 1, so slope is 1. Why it works: Evaluate the two rates at the same parameter value. Common trap: Substitute into x and y instead of their derivatives.' , difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: 'Differentiates both coordinates and evaluates a rate quotient.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q019, type: symbolicResponse, prompt: 'Find the length of $x=t^2$, $y=t^2$ for $0\le t\le1$.', answer: { expectedLatex: 'sqrt(2)', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Speed is $\sqrt{(2t)^2+(2t)^2}=2\sqrt2t$, so $L=\int_0^12\sqrt2t dt=\sqrt2$. Why it works: The path is the diagonal from $(0,0)$ to $(1,1)$. Common trap: Forgetting $t\ge0$ when simplifying $\sqrt{t^2}$.' , difficultyDimensions: [simplification, domainCondition], difficultyEvidence: 'Simplifies a square root using the parameter interval and integrates speed.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q020, type: freeResponse, prompt: 'List the three quantities needed to write a tangent line to a parametric curve at $t=a$.', answer: { gradingMode: selfCheck, keyPoints: ['x of a', 'y of a', 'dy dx at a', 'point slope line'] }, explanation: 'Solution: Find $x(a)$ and $y(a)$ for the point, then $(dy/dx)|_{t=a}$ for the slope; substitute them into point-slope form. Why it works: A nonvertical line is determined by one point and one slope. Common trap: A derivative without its associated point is not a complete tangent line.' , difficultyDimensions: [modelOrDerivation, proofJustification], difficultyEvidence: 'Connects derivative data to the geometric requirements of a line.' , issueSignals: [{ id: parametric-derivative-error }, { id: parametric-arc-length-error }, { id: algebraic-simplification-error }, { id: chain-rule-missed }, { id: quotient-rule-misapplied }, { id: trigonometric-identity-misapplied }]}
