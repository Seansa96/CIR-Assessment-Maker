questions:
- id: q001
  type: numericResponse
  skills:
  - physics-wave-mathematics
  prompt: An ocean swell propagates with a wavelength of 13.54 m passing a buoy at
    80.0 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.464
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 13.54 = 0.4640 rad/m.
- id: q002
  type: numericResponse
  skills:
  - physics-wave-mathematics
  prompt: A laboratory ripple tank generates water waves of length 5.93 m at a frequency
    of 95.2 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 598.1592
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*95.2 = 598.1592 rad/s.
- id: q003
  type: numericResponse
  skills:
  - physics-wave-mathematics
  prompt: A seismic surface wave has a characteristic wavelength of 9.0 m and vibrates
    at 3.9 Hz. What is the wave speed in m/s?
  answer:
    value: 35.1
    tolerance: 0.05
  explanation: v = lambda * f = 9.0 * 3.9 = 35.10 m/s.
