questions:
- id: pred-q01
  title: Area Setup (dx vs dy)
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: Consider a region bounded by $x = y^2$ and $x = y + 2$. If we want to avoid
    splitting the integral into multiple parts, which differential should we use to
    set up the area integral, and why?
  choices:
  - id: a
    text: $dy$, because the rightmost curve and leftmost curve remain consistent for
      the entire region.
  - id: b
    text: $dx$, because the top curve and bottom curve remain consistent for the entire
      region.
  - id: c
    text: $dy$, because horizontal slices are always shorter than vertical slices.
  - id: d
    text: $dx$, because vertical slices are always easier to compute algebraically.
  answer:
    choiceId: a
  explanation: If we use $dx$, the bottom curve changes from the bottom half of the
    parabola to the line at $x=1$, requiring two integrals. Using $dy$ (horizontal
    slices), $x = y+2$ is always the right boundary and $x=y^2$ is always the left
    boundary.
- id: pred-q02
  title: Area Splitting Concept
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: Suppose you are setting up an integral to find the area bounded by $y =
    \sin x$, $y = \cos x$, $x=0$, and $x=\pi/2$ using vertical slices ($dx$). Why
    must the integral be split into two parts?
  choices:
  - id: a
    text: Because the function that acts as the upper boundary changes at $x = \pi/4$.
  - id: b
    text: Because the area formula requires an absolute value which cannot be integrated.
  - id: c
    text: Because trigonometric integrals can only be evaluated over intervals of
      length $\pi/4$.
  - id: d
    text: Because the region crosses the x-axis, creating negative area.
  answer:
    choiceId: a
  explanation: From $0$ to $\pi/4$, $\cos x > \sin x$. From $\pi/4$ to $\pi/2$, $\sin
    x > \cos x$. The fundamental geometry of the slice height (Top - Bottom) changes,
    forcing us to split the integral at the intersection.
- id: pred-q03a
  title: Identify Intersection
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: 'Consider the region $R$ in the first quadrant bounded by $y = e^x$, the
    line $y = e^3$, and the y-axis.


    What are the geometric corners (intersections) of this region?'
  choices:
  - id: a
    text: $(0,1)$, $(0,e^3)$, and $(3,e^3)$
  - id: b
    text: $(0,0)$, $(3,0)$, and $(3,e^3)$
  - id: c
    text: $(0,1)$, $(3,1)$, and $(3,e^3)$
  answer:
    choiceId: a
  explanation: The y-axis ($x=0$) intersects $y=e^x$ at $(0,1)$ and $y=e^3$ at $(0,e^3)$.
    The curves $y=e^x$ and $y=e^3$ intersect when $e^x = e^3 \implies x=3$.
- id: pred-q03b
  title: Setup with dy
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: 'Consider the region $R$ in the first quadrant bounded by $y = e^x$, the
    line $y = e^3$, and the y-axis.


    Which integral correctly represents the area of $R$ using horizontal slices ($dy$)?'
  choices:
  - id: a
    text: $\int_1^{e^3} (\ln y) dy$
  - id: b
    text: $\int_0^3 (e^3 - e^x) dx$
  - id: c
    text: $\int_1^{e^3} (e^3 - \ln y) dy$
  answer:
    choiceId: a
  explanation: 'With $dy$, we slice horizontally. The right curve is $x = \ln y$ and
    the left curve is the y-axis ($x=0$). The limits are the y-values of the region:
    $y=1$ to $y=e^3$. Thus, $\int_1^{e^3} (\ln y - 0) dy$.'
- id: pred-q04
  title: Washer vs Shell Method Choice
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: The region bounded by $y = \ln x$, $x=e$, and the x-axis is revolved around
    the y-axis. You want to set up the volume integral but you do not want to integrate
    exponential functions like $e^y$. Which method should you choose?
  choices:
  - id: a
    text: The Shell Method, because it requires integrating with respect to $x$, leading
      to $\int x \ln x \, dx$.
  - id: b
    text: The Washer Method, because it requires integrating with respect to $x$,
      leading to $\int x \ln x \, dx$.
  - id: c
    text: The Shell Method, because it requires integrating with respect to $y$.
  - id: d
    text: The Washer Method, because it requires integrating with respect to $y$.
  answer:
    choiceId: a
  explanation: Rotation about a vertical axis (y-axis) using $dx$ means using Cylindrical
    Shells. This keeps the integral in terms of $x$, avoiding the need to solve $y
    = \ln x$ for $x = e^y$ (which would be required for Washers with $dy$).
- id: pred-q05
  title: Washer Inner and Outer Radius
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: A region is bounded by $y = 4$ (top) and $y = x^2$ (bottom). It is rotated
    about the line $y = 6$ to form a solid. When setting up the Washer method integral,
    what are the expressions for the inner radius $r$ and outer radius $R$?
  choices:
  - id: a
    text: $R = 6 - x^2$ and $r = 6 - 4$
  - id: b
    text: $R = 4 - x^2$ and $r = 6 - 4$
  - id: c
    text: $R = 6 - 4$ and $r = 6 - x^2$
  - id: d
    text: $R = x^2 + 6$ and $r = 4 + 6$
  answer:
    choiceId: a
  explanation: The axis of rotation is $y=6$, which is above the region. The outer
    radius $R$ is the distance from the axis to the furthest boundary ($y=x^2$), so
    $R = 6 - x^2$. The inner radius $r$ is the distance to the closest boundary ($y=4$),
    so $r = 6 - 4 = 2$.
- id: pred-q06
  title: Shell Radius and Height
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: The region bounded by $y = x^3$, $x=2$, and $y=0$ is rotated about the vertical
    line $x=5$. If using the Cylindrical Shells method with vertical slices ($dx$),
    what are the expressions for the radius of a shell and its height?
  choices:
  - id: a
    text: Radius = $5 - x$, Height = $x^3$
  - id: b
    text: Radius = $x - 5$, Height = $x^3$
  - id: c
    text: Radius = $5 - x$, Height = $2 - x^3$
  - id: d
    text: Radius = $x$, Height = $x^3$
  answer:
    choiceId: a
  explanation: A vertical slice is at position $x$. The distance from this slice to
    the axis of rotation $x=5$ is $5-x$ (since the region lies between $x=0$ and $x=2$,
    $5>x$). The height of the shell is simply the height of the curve, $y = x^3$.
- id: pred-q07
  title: Cross Sections Setup
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: The base of a solid is the region in the xy-plane bounded by $y = \sqrt{x}$
    and $y = x/2$. Cross-sections perpendicular to the x-axis are equilateral triangles.
    Which integral correctly represents the volume of the solid?
  choices:
  - id: a
    text: $\int_0^4 \frac{\sqrt{3}}{4} \left( \sqrt{x} - \frac{x}{2} \right)^2 dx$
  - id: b
    text: $\int_0^4 \frac{1}{2} \left( \sqrt{x} - \frac{x}{2} \right)^2 dx$
  - id: c
    text: $\int_0^4 \frac{\sqrt{3}}{4} \left( x - \frac{x^2}{4} \right) dx$
  - id: d
    text: $\int_0^4 \left( \sqrt{x} - \frac{x}{2} \right)^2 dx$
  answer:
    choiceId: a
  explanation: 'The side length $s$ of the triangle is the distance between the curves:
    $s = \sqrt{x} - x/2$. The area of an equilateral triangle is $A = \frac{\sqrt{3}}{4}
    s^2$. Thus, $V = \int_0^4 \frac{\sqrt{3}}{4} (\sqrt{x} - x/2)^2 dx$.'
- id: pred-q08
  title: Arc Length Setup
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: Which integral correctly represents the arc length of the curve $f(x) =
    \frac{1}{3}x^3$ from $x=0$ to $x=2$?
  choices:
  - id: a
    text: $\int_0^2 \sqrt{1 + x^4} \, dx$
  - id: b
    text: $\int_0^2 \sqrt{1 + \frac{1}{9}x^6} \, dx$
  - id: c
    text: $\int_0^2 \left(1 + x^2\right) \, dx$
  - id: d
    text: $\int_0^2 \sqrt{1 + x^2} \, dx$
  answer:
    choiceId: a
  explanation: The derivative is $f'(x) = x^2$. The arc length formula requires $(f'(x))^2$,
    which is $(x^2)^2 = x^4$. So the integrand is $\sqrt{1 + x^4}$.
- id: pred-q09
  title: Surface Area Conceptual Catch
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: A student sets up the integral for the surface area of $y = \sin x$ on $[0,
    \pi]$ rotated about the x-axis as $\int_0^\pi \sqrt{1 + \cos^2 x} \, dx$. What
    geometric component of the surface area formula did they forget?
  choices:
  - id: a
    text: The circumference of the revolved band, $2\pi r = 2\pi \sin x$.
  - id: b
    text: Squaring the derivative under the radical.
  - id: c
    text: The surface area requires integrating with respect to $y$.
  - id: d
    text: They forgot to square the $\sin x$ term outside the radical.
  answer:
    choiceId: a
  explanation: The surface area formula is $\int 2\pi r \, ds$. The student included
    $ds = \sqrt{1+(y')^2} dx$, but completely forgot to multiply by $2\pi r$, which
    in this case is $2\pi y = 2\pi \sin x$.
- id: pred-q10a
  title: Setup M_x
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: 'A uniform thin plate (constant density $\rho=1$) covers the region bounded
    by $y=1-x^2$ and the x-axis.


    Which integral correctly represents the moment about the x-axis ($M_x$)?'
  choices:
  - id: a
    text: $\frac{1}{2} \int_{-1}^1 (1-x^2)^2 \, dx$
  - id: b
    text: $\int_{-1}^1 x(1-x^2) \, dx$
  - id: c
    text: $\int_{-1}^1 (1-x^2)^2 \, dx$
  answer:
    choiceId: a
  explanation: $M_x = \frac{1}{2} \int_a^b [f(x)^2 - g(x)^2] dx$. Since $g(x)=0$,
    this is $\frac{1}{2} \int_{-1}^1 (1-x^2)^2 dx$.
- id: pred-q10b
  title: Setup M_y
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: 'A uniform thin plate (constant density $\rho=1$) covers the region bounded
    by $y=1-x^2$ and the x-axis.


    Which integral correctly represents the moment about the y-axis ($M_y$)?'
  choices:
  - id: a
    text: $\int_{-1}^1 x(1-x^2) \, dx$
  - id: b
    text: $\frac{1}{2} \int_{-1}^1 (1-x^2)^2 \, dx$
  - id: c
    text: $\int_{-1}^1 (1-x^2) \, dx$
  answer:
    choiceId: a
  explanation: $M_y = \int_a^b x[f(x) - g(x)] dx = \int_{-1}^1 x(1-x^2) dx$.
- id: pred-q11
  title: Average Value Concept
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: What geometric interpretation does the average value $f_{avg}$ of a continuous
    positive function $f(x)$ on $[a,b]$ have?
  choices:
  - id: a
    text: It is the height of a rectangle over $[a,b]$ that has the same area as the
      region under $f(x)$.
  - id: b
    text: It is the exact midpoint of the y-values $f(a)$ and $f(b)$.
  - id: c
    text: It is the y-coordinate of the centroid of the region under the curve.
  - id: d
    text: It is the radius required to create a cylinder of equal volume.
  answer:
    choiceId: a
  explanation: Because $f_{avg} = \frac{1}{b-a}\int_a^b f(x) dx$, we can rewrite this
    as $f_{avg} \times (b-a) = \int_a^b f(x) dx$. This means a rectangle with width
    $(b-a)$ and height $f_{avg}$ has the exact same area as the integral of the function.
- id: pred-q12
  title: MVT for Integrals Setup
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: For the function $f(x) = 3x^2$ on $[0, 2]$, the average value is $4$. According
    to the Mean Value Theorem for Integrals, how do you find the specific value $c$
    guaranteed by the theorem?
  choices:
  - id: a
    text: Solve $3c^2 = 4$ for $c$ in the interval $[0,2]$.
  - id: b
    text: Set $c = \frac{0+2}{2} = 1$.
  - id: c
    text: Solve $\int_0^c 3x^2 dx = 4$.
  - id: d
    text: Evaluate $f'(c) = 4$.
  answer:
    choiceId: a
  explanation: 'The Mean Value Theorem for Integrals guarantees that there is some
    $c$ in the interval where the function equals its average value: $f(c) = f_{avg}$.
    Thus, you set the function $3c^2$ equal to the average value $4$ and solve for
    $c$.'
- id: pred-q13
  title: Shifted Axis Execution (Washers)
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: Set up the integral for the volume of the region bounded by $y=x^2$ and
    $y=4$, rotated about the horizontal line $y=-2$.
  choices:
  - id: a
    text: $\int_{-2}^2 \pi \left[ 36 - (x^2 + 2)^2 \right] \, dx$
  - id: b
    text: $\int_{-2}^2 \pi \left[ (x^2 + 2)^2 - 36 \right] \, dx$
  - id: c
    text: $\int_{-2}^2 \pi \left[ 16 - x^4 \right] \, dx$
  - id: d
    text: $\int_{-2}^2 \pi \left[ (4 - x^2)^2 \right] \, dx$
  answer:
    choiceId: a
  explanation: The outer radius $R$ is from $y=-2$ up to $y=4$, so $R = 4 - (-2) =
    6$. The inner radius $r$ is from $y=-2$ up to $y=x^2$, so $r = x^2 - (-2) = x^2
    + 2$. The volume is $\int \pi [R^2 - r^2] dx = \int \pi [36 - (x^2+2)^2] dx$.
- id: pred-q14
  title: Shifted Axis Execution (Shells)
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: Set up the integral for the volume of the region bounded by $y = \sqrt{x}$,
    $y = 0$, and $x = 4$, rotated about $x=5$, using the cylindrical shells method.
  choices:
  - id: a
    text: $\int_0^4 2\pi (5-x)(\sqrt{x}) \, dx$
  - id: b
    text: $\int_0^4 2\pi (x-5)(\sqrt{x}) \, dx$
  - id: c
    text: $\int_0^2 2\pi (5-y)(4-y^2) \, dy$
  - id: d
    text: $\int_0^4 2\pi (5-x)(4-\sqrt{x}) \, dx$
  answer:
    choiceId: a
  explanation: 'Using shells with $dx$ (vertical slices): The radius from the slice
    at $x$ to the axis $x=5$ is $(5-x)$. The height of the shell is the top curve
    minus the bottom curve, $\sqrt{x} - 0$. Therefore, $V = \int_0^4 2\pi (5-x)\sqrt{x}
    \, dx$.'
- id: pred-q15
  title: Reverse Engineering an Integral
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: Consider the integral $V = \int_1^4 2\pi x (\ln x) \, dx$. Which of the
    following geometric scenarios does this best represent?
  choices:
  - id: a
    text: The volume of the region between $y=\ln x$ and $y=0$ for $x \in [1,4]$ rotated
      about the y-axis.
  - id: b
    text: The volume of the region between $y=\ln x$ and $y=0$ for $x \in [1,4]$ rotated
      about the x-axis.
  - id: c
    text: The surface area of $y=\ln x$ rotated about the y-axis.
  - id: d
    text: The arc length of $y=\ln x$ from $1$ to $4$.
  answer:
    choiceId: a
  explanation: The format $\int 2\pi r h \, dx$ is the signature of the Cylindrical
    Shells method. Here $r=x$ (indicating rotation about the y-axis) and $h=\ln x$
    (indicating the height is bounded by the curve $\ln x$ and the x-axis).
- id: pred-q16
  title: Evaluate Integral (Rationalizing Substitution)
  type: symbolicResponse
  skills:
  - geom-applications-test-2
  prompt: Evaluate the integral $\int_{0}^1 \frac{1}{1+\sqrt[3]{ x }}dx$.
  answer:
    gradingMode: auto
    expectedLatex: 3\ln 2 - \frac{3}{2}
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Let $u = x^{1/3}$, so $x = u^3$ and $dx = 3u^2 du$. The bounds change
    from $x=0,1$ to $u=0,1$.


    The integral becomes $\int_0^1 \frac{3u^2}{1+u} du$. Using polynomial long division,
    $\frac{3u^2}{u+1} = 3u - 3 + \frac{3}{u+1}$.


    Integrating yields: $[\frac{3}{2}u^2 - 3u + 3\ln|u+1|]_0^1 = (\frac{3}{2} - 3
    + 3\ln 2) - 0 = 3\ln 2 - \frac{3}{2}$.'
- id: pred-q17
  title: Area of Upper Semicircle Proof
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: To show that the area of the upper semicircle $\int_{-r}^r \sqrt{ r^2-x^2
    }dx$ is equal to $\frac{\pi r^2}{2}$, which trigonometric substitution is used?
  choices:
  - id: a
    text: Let $x = r\sin\theta$
  - id: b
    text: Let $x = r\tan\theta$
  - id: c
    text: Let $x = r\sec\theta$
  answer:
    choiceId: a
  explanation: Substituting $x = r\sin\theta$ transforms $\sqrt{r^2-x^2}$ into $\sqrt{r^2
    - r^2\sin^2\theta} = r\cos\theta$, allowing the integral to be evaluated using
    the half-angle identity for $\cos^2\theta$.
- id: pred-q18
  title: Antiderivative (Rational Function)
  type: symbolicResponse
  skills:
  - geom-applications-test-2
  prompt: Find the general antiderivative of $\int \frac{9x-41}{x^2-10x+25}dx$. (Use
    $C$ for the constant of integration).
  answer:
    gradingMode: auto
    expectedLatex: 9\ln|x-5| - \frac{4}{x-5} + C
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Factor the denominator: $x^2-10x+25 = (x-5)^2$. Let $u = x-5$, then
    $x = u+5$ and $dx = du$.


    $\int \frac{9(u+5)-41}{u^2} du = \int \frac{9u+45-41}{u^2} du = \int \frac{9u+4}{u^2}
    du = \int (\frac{9}{u} + 4u^{-2}) du$.


    Integrating yields $9\ln|u| - \frac{4}{u} + C = 9\ln|x-5| - \frac{4}{x-5} + C$.'
- id: pred-q19
  title: Antiderivative (Trig Sub)
  type: symbolicResponse
  skills:
  - geom-applications-test-2
  prompt: Find the general antiderivative of $\int \frac{\sqrt{ x^2-9 }}{x^3}dx$.
    (Use $C$ for the constant of integration).
  answer:
    gradingMode: auto
    expectedLatex: \frac{1}{6}\sec^{-1}\left(\frac{x}{3}\right) - \frac{\sqrt{x^2-9}}{2x^2}
      + C
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Let $x = 3\sec\theta \implies dx = 3\sec\theta\tan\theta d\theta$.
    $\sqrt{x^2-9} = 3\tan\theta$.


    The integral becomes $\int \frac{3\tan\theta}{27\sec^3\theta} 3\sec\theta\tan\theta
    d\theta = \frac{1}{3} \int \frac{\tan^2\theta}{\sec^2\theta} d\theta = \frac{1}{3}
    \int \sin^2\theta d\theta$.


    $\frac{1}{3} \int \frac{1-\cos(2\theta)}{2} d\theta = \frac{1}{6}(\theta - \sin\theta\cos\theta)
    + C$.


    Converting back to $x$: $\theta = \sec^{-1}(x/3)$, $\sin\theta = \frac{\sqrt{x^2-9}}{x}$,
    $\cos\theta = \frac{3}{x}$. Thus, $\frac{1}{6}\sec^{-1}(x/3) - \frac{3\sqrt{x^2-9}}{6x^2}
    + C$.'
- id: pred-q20
  title: Antiderivative (Conceptual Trick)
  type: freeResponse
  skills:
  - geom-applications-test-2
  prompt: "Evaluate the antiderivative of $\\int \\frac{20x^3}{\\sqrt{ 16-81x^{11}\
    \ }}dx$. \n\nShow your work and any relevant substitutions or advanced functions\
    \ required (e.g., Hypergeometric series)."
  answer:
    gradingMode: selfCheck
    expectedText: Teacher review required due to the non-standard exponent 11 mapping
      to x^3.
  explanation: Because the derivative of $x^{11}$ is proportional to $x^{10}$, not
    $x^3$, this integral does not admit a standard elementary antiderivative (unlike
    if it were $x^8$, where $u=x^4$ would apply). It requires advanced special functions
    like the incomplete Beta function or a power series expansion.
- id: pred-q21
  title: Antiderivative (Inverse Tangent Form)
  type: symbolicResponse
  skills:
  - geom-applications-test-2
  prompt: Find the general antiderivative of $\int \frac{30x^4}{9+49x^{10}}dx$. (Use
    $C$ for the constant of integration).
  answer:
    gradingMode: auto
    expectedLatex: \frac{2}{7}\arctan\left(\frac{7x^5}{3}\right) + C
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Let $u = 7x^5 \implies du = 35x^4 dx$. Then $30x^4 dx = \frac{30}{35}du
    = \frac{6}{7}du$.


    The integral becomes $\int \frac{6/7}{9 + u^2} du = \frac{6}{7} \left( \frac{1}{3}\arctan(\frac{u}{3})
    \right) = \frac{2}{7}\arctan(\frac{u}{3})$.


    Substituting back yields $\frac{2}{7}\arctan\left(\frac{7x^5}{3}\right) + C$.'
- id: pred-q22
  title: Volume Proof (Cylinder)
  type: multipleChoice
  skills:
  - geom-applications-test-2
  prompt: To prove that the volume of a cylinder of radius $r$ and height $h$ is $V
    = \pi r^2 h$ using calculus, which geometric setup and integral correctly models
    this?
  choices:
  - id: a
    text: Revolve the constant line $y = r$ around the x-axis from $x=0$ to $x=h$,
      using $\int_0^h \pi r^2 dx$.
  - id: b
    text: Revolve the line $y = \frac{r}{h}x$ around the x-axis from $x=0$ to $x=h$,
      using $\int_0^h \pi (\frac{r}{h}x)^2 dx$.
  - id: c
    text: Revolve the curve $y = \sqrt{r^2-x^2}$ around the x-axis from $x=-r$ to
      $x=r$.
  answer:
    choiceId: a
  explanation: Revolving a horizontal line $y=r$ around the x-axis sweeps out a solid
    cylinder. The disk method gives $V = \int_0^h \pi (r)^2 dx = [\pi r^2 x]_0^h =
    \pi r^2 h$. (Choice B generates a cone, and Choice C generates a sphere).
- id: pred-q23
  title: Area of a Circle
  type: symbolicResponse
  skills:
  - geom-applications-test-2
  prompt: 'Find the area enclosed by the circle $x^2+y^2=4$ using calculus.


    *Hint: Use symmetry to find the area of the top half (or quarter) of the circle,
    then use a trigonometric substitution like $x = 2\sin\theta$.*'
  answer:
    gradingMode: auto
