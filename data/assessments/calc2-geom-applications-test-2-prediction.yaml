  explanation: 'The circle has radius $r=2$. The total area is $4 \times \int_0^2
    \sqrt{4-x^2} dx$.


    Let $x=2\sin\theta$, $dx=2\cos\theta d\theta$. The integral becomes $4 \times
    \int_0^{\pi/2} 4\cos^2\theta d\theta = 16 \int_0^{\pi/2} \frac{1+\cos(2\theta)}{2}
    d\theta = 8 [\theta + \frac{1}{2}\sin(2\theta)]_0^{\pi/2} = 8(\pi/2) = 4\pi$.'
