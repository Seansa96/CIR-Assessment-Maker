lesson:
  introduction: >
    This lesson develops a repeatable way to solve RLC Series Circuits problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch15-rlc-series-s1
    title: Name the model and quantities
    required: true
    content: >
      RLC Series Circuits uses Z = sqrt(R^2 + (X_L-X_C)^2). In the name the model and quantities stage, calculate reactances, combine their signed difference, then use impedance for current and phase.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving RLC Series Circuits problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch15-rlc-series-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for RLC Series Circuits, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use Z = sqrt(R^2 + (X_L-X_C)^2) after you calculate reactances, combine their signed difference, then use impedance for current and phase.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this RLC Series Circuits problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-rlc-series-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables Z = sqrt(R^2 + (X_L-X_C)^2) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-rlc-series-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit RLC Series Circuits.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-rlc-series-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for RLC Series Circuits, first calculate reactances, combine their signed difference, then use impedance for current and phase. Then apply Z = sqrt(R^2 + (X_L-X_C)^2) with one consistent coordinate system and solve for the requested quantity.


        Why it works: Z = sqrt(R^2 + (X_L-X_C)^2) connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
