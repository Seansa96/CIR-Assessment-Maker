assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-ac-circuits
workedExamples:
- id: l2-sec1
  title: Impedance
  explanation: In an RLC series circuit, the total opposition to current is the impedance
    $Z = \sqrt{R^2 + (X_L - X_C)^2}$. The max current is $I_{max} = V_{max}/Z$.
- id: l2-sec2
  title: Phase Angle & Resonance
  explanation: The phase angle between voltage and current is $\phi = \tan^{-1}\left(\frac{X_L
    - X_C}{R}\right)$. At resonance, $X_L = X_C$, so $Z = R$ (its minimum value),
    and current is maximum. The resonant frequency is $\omega_0 = \frac{1}{\sqrt{LC}}$.
