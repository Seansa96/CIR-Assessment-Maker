    choices:
    - id: a
      text: List the quantities, relationships, and restrictions that control this Three Dimensional Geometry problem.
    - id: b
      text: Assume the diagram is to scale.
    - id: c
      text: Discard inconvenient cases.
    - id: d
      text: Choose an answer before reasoning.
