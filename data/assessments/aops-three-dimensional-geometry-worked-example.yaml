workedExamples:
- id: aops-3d-we-1
  title: Slicing a Cone
  steps:
  - id: step-1
    title: Calculate the volume of the original cone
    prompt: Find the volume of the entire, uncut cone.
    difficultyDimensions:
    - Use the cone volume formula $V = \frac{1}{3}\pi r^2 h$.
    - Substitute $r = 6$ and $h = 12$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $V_{\text{total}} = \frac{1}{3}\pi (6^2)(12)$.
      - $V_{\text{total}} = 144\pi$.
    explanation: 'Solution:

      The volume of the entire cone before slicing is given by $V = \frac{1}{3}\pi r^2 h$.

      $$V_{\text{total}} = \frac{1}{3}\pi (6^2) (12)$$

      $$V_{\text{total}} = \frac{1}{3}\pi (36) (12) = 144\pi$$


      Why it works:

      We need the total volume so we can subtract the volume of the piece we remove.

      '
    instruction: 'Work through this step: Find the volume of the entire, uncut cone.'
    type: freeResponse
  - id: step-2
    title: Find the scaling factor of the removed top cone
    prompt: The removed top piece is a smaller cone similar to the original. Find its height and the linear
      scaling factor $k$.
    difficultyDimensions:
    - 'Calculate the height of the top cone: $12 - 8 = 4$.'
    - 'Calculate the ratio of the heights: $k = 4/12 = 1/3$.'
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The height of the top cone is $12 - 8 = 4$.
      - The linear scale factor $k = \frac{4}{12} = \frac{1}{3}$.
    explanation: 'Solution:

      The slice is made 8 units *above* the base. The total height is 12, so the height of the small cone
      removed from the top is $12 - 8 = 4$.

      Because the slice is horizontal, the small top cone is perfectly similar to the large original cone.

      The linear scaling factor (ratio of lengths) from the large cone to the small cone is:

      $$k = \frac{h_{\text{small}}}{h_{\text{large}}} = \frac{4}{12} = \frac{1}{3}$$


      Why it works:

      Because all dimensions scale linearly, we don''t need to manually calculate the radius of the top
      cone (though it would be $6 \times \frac{1}{3} = 2$). We can use the scaling laws directly on the
      volume.

      '
    instruction: 'Work through this step: The removed top piece is a smaller cone similar to the original.
      Find its height and the linear scaling factor $k$.'
    type: freeResponse
  - id: step-3
    title: Calculate the volume of the frustum
    prompt: Use the 3D scaling law to find the volume of the top cone, then subtract it from the total
      volume.
    difficultyDimensions:
    - 'Cube the linear factor: $k^3 = (1/3)^3 = 1/27$.'
    - 'Find the top cone volume: $144\pi \times (1/27) = \frac{16\pi}{3}$.'
    - 'Subtract from total: $144\pi - \frac{16\pi}{3}$.'
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Volume scale factor is $(1/3)^3 = 1/27$.
      - $V_{\text{top}} = \frac{1}{27} \times 144\pi = \frac{144\pi}{27} = \frac{16\pi}{3}$.
      - $V_{\text{frustum}} = 144\pi - \frac{16\pi}{3} = \frac{432\pi}{3} - \frac{16\pi}{3} = \frac{416\pi}{3}$.
    explanation: 'Solution:

      Since the linear scaling factor is $k = \frac{1}{3}$, the volume scaling factor is $k^3 = \left(\frac{1}{3}\right)^3
      = \frac{1}{27}$.

      The volume of the small top cone is $\frac{1}{27}$ of the total volume.

      $$V_{\text{top}} = \frac{1}{27} (144\pi) = \frac{144\pi}{27} = \frac{16\pi}{3}$$

      The remaining volume (the frustum) is the total volume minus the top cone.

      $$V_{\text{frustum}} = 144\pi - \frac{16\pi}{3} = \frac{432\pi}{3} - \frac{16\pi}{3} = \frac{416\pi}{3}$$


      Why it works:

      Alternatively, the top cone is $\frac{1}{27}$ of the total, meaning the frustum must be exactly
      $\frac{26}{27}$ of the total volume. $\frac{26}{27} \times 144\pi = \frac{416\pi}{3}$.

      '
    instruction: 'Work through this step: Use the 3D scaling law to find the volume of the top cone, then
      subtract it from the total volume.'
    type: freeResponse
  problem: A cone has a height of 12 and a base radius of 6. A horizontal slice is made through the cone
    at a height of 8 units above the base, removing the top portion. What is the volume of the remaining
    bottom portion (the frustum)?
- id: aops-3d-we-2
  title: Inscribing a Sphere in a Cylinder
  steps:
  - id: aops-3d-we-2-step-1
    title: Find the radius of the sphere
    prompt: Use the volume of the sphere to determine its radius.
    difficultyDimensions:
    - Set up $\frac{4}{3}\pi r^3 = 36\pi$.
    - Solve for $r$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\frac{4}{3}\pi r^3 = 36\pi$.
      - $r^3 = 36 \times \frac{3}{4} = 27$.
      - $r = 3$.
    explanation: 'Solution:

      The volume of a sphere is $V = \frac{4}{3}\pi r^3$.

      $$\frac{4}{3}\pi r^3 = 36\pi$$

      Divide by $\pi$ and multiply by $\frac{3}{4}$:

      $$r^3 = 36 \times \frac{3}{4} = 9 \times 3 = 27$$

      $$r = 3$$


      Why it works:

      The radius of the sphere is the fundamental unit that dictates the dimensions of both the sphere
      and the enclosing cylinder.

      '
    instruction: 'Work through this step: Use the volume of the sphere to determine its radius.'
    type: freeResponse
  - id: aops-3d-we-2-step-2
    title: Determine the cylinder's dimensions
    prompt: Express the radius and height of the cylinder in terms of the sphere's radius.
    difficultyDimensions:
    - Identify that the cylinder's radius equals the sphere's radius ($r=3$).
    - Identify that the cylinder's height equals the sphere's diameter ($h = 2r = 6$).
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Cylinder radius $R = r = 3$.
      - Cylinder height $H = 2r = 6$.
    explanation: 'Solution:

      Because the sphere perfectly touches the lateral walls, the radius of the cylinder''s base must
      exactly match the radius of the sphere: $R = 3$.

      Because the sphere touches both the top and bottom bases of the cylinder, the height of the cylinder
      must exactly match the diameter of the sphere: $H = 2r = 6$.


      Why it works:

      Visualizing the 2D cross-section helps: it is a circle of radius 3 perfectly inscribed in a square
      of side length 6.

      '
    instruction: 'Work through this step: Express the radius and height of the cylinder in terms of the
      sphere''s radius.'
    type: freeResponse
  - id: aops-3d-we-2-step-3
    title: Calculate the cylinder's volume
    prompt: Use the dimensions to find the volume of the cylinder. What is the ratio of the sphere's volume
      to the cylinder's volume?
    difficultyDimensions:
    - Compute $V = \pi R^2 H$.
    - $V = \pi (3^2) (6) = 54\pi$.
    - Notice that $36\pi / 54\pi = 2/3$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $V_{\text{cyl}} = \pi (3^2)(6) = 54\pi$.
      - The ratio is $36\pi / 54\pi = 2/3$.
    explanation: 'Solution:

      The volume of the cylinder is $V = \pi R^2 H$.

      $$V_{\text{cyl}} = \pi (3^2)(6) = \pi (9)(6) = 54\pi$$

      The volume of the cylinder is $54\pi$.

      Notice the ratio of their volumes: $\frac{36\pi}{54\pi} = \frac{2}{3}$.


      Why it works:

      Archimedes discovered this beautiful invariant: a sphere inscribed in a cylinder *always* occupies
      exactly $\frac{2}{3}$ of the cylinder''s volume (and has $\frac{2}{3}$ of its total surface area).
      He was so proud of this discovery that he asked for a sphere inscribed in a cylinder to be sculpted
      on his tombstone.

      '
    instruction: 'Work through this step: Use the dimensions to find the volume of the cylinder. What
      is the ratio of the sphere''s volume to the cylinder''s volume?'
    type: freeResponse
  problem: A sphere is inscribed inside a right circular cylinder such that it perfectly touches the top
    base, the bottom base, and the lateral walls. If the volume of the sphere is $36\pi$, what is the
    volume of the cylinder?
- id: aops-3d-we-3
  title: Tetrahedron in a Cube
  steps:
  - id: aops-3d-we-3-step-1
    title: Visualize the removed pieces
    prompt: When you carve the tetrahedron out of the cube, you are removing four identical corner pyramids.
      What are the dimensions of these corner pyramids?
    difficultyDimensions:
    - Identify that the removed corners are triangular pyramids.
    - Identify their base is a right triangle on a face of the cube.
    - Identify their legs are the edges of the cube (length 2).
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The corners are triangular pyramids (tetrahedra) sharing a vertex with the cube.
      - They have three mutually perpendicular edges of length 2 meeting at the corner.
    explanation: 'Solution:

      To form the inscribed tetrahedron, we connect alternating vertices of the cube.

      This leaves behind four identical corner pieces. Each piece is a triangular pyramid cut from a corner
      of the cube.

      The corner of the cube provides the apex, and the three edges of the cube meeting at that corner
      provide three mutually perpendicular edges of length 2.


      Why it works:

      Instead of trying to find the base area and height of the tricky inner tetrahedron directly, we
      use subtractive geometry. We will find the volume of the easily calculable corner pieces and subtract
      them from the cube.

      '
    instruction: 'Work through this step: When you carve the tetrahedron out of the cube, you are removing
      four identical corner pyramids. What are the dimensions of these corner pyramids?'
    type: freeResponse
  - id: aops-3d-we-3-step-2
    title: Find the volume of one corner pyramid
    prompt: Calculate the volume of one of these corner pyramids.
    difficultyDimensions:
    - Use $V = \frac{1}{3}Bh$.
    - 'The base $B$ is a right triangle with legs 2 and 2: $B = \frac{1}{2}(2)(2) = 2$.'
    - 'The height is the third edge: $h = 2$.'
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Base area $B = \frac{1}{2}(2)(2) = 2$.
      - $V_{\text{pyramid}} = \frac{1}{3}(2)(2) = \frac{4}{3}$.
    explanation: 'Solution:

      Let one of the cube''s faces be the base of the pyramid. The base is a right isosceles triangle
      with legs 2 and 2, so its area is:

      $$\text{Area}_{\text{base}} = \frac{1}{2}(2)(2) = 2$$

      The height of the pyramid is the cube edge perpendicular to that face, which is also 2.

      The volume of the pyramid is:

      $$V_{\text{pyramid}} = \frac{1}{3} \times \text{Base} \times \text{height} = \frac{1}{3}(2)(2) =
      \frac{4}{3}$$


      Why it works:

      Because the three edges meet at mutually perpendicular $90^\circ$ angles, we don''t have to worry
      about slant heights. Any of the three faces meeting at the corner can serve as the base.

      '
    instruction: 'Work through this step: Calculate the volume of one of these corner pyramids.'
    type: freeResponse
  - id: aops-3d-we-3-step-3
    title: Calculate the tetrahedron volume
    prompt: Subtract the four corner pyramids from the total volume of the cube.
    difficultyDimensions:
    - Total cube volume $= 2^3 = 8$.
    - Total removed volume $= 4 \times \frac{4}{3} = \frac{16}{3}$.
    - 'Subtract: $8 - \frac{16}{3} = \frac{8}{3}$.'
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $V_{\text{cube}} = 2^3 = 8$.
      - Removed $= 4 \left(\frac{4}{3}\right) = \frac{16}{3}$.
      - $V_{\text{tetrahedron}} = 8 - \frac{16}{3} = \frac{24}{3} - \frac{16}{3} = \frac{8}{3}$.
    explanation: 'Solution:

      The total volume of the cube is $s^3 = 2^3 = 8$.

      There are four corner pyramids to remove. Their combined volume is:

      $$V_{\text{removed}} = 4 \times \frac{4}{3} = \frac{16}{3}$$

      The volume of the inscribed regular tetrahedron is the cube minus the corners:

      $$V_{\text{tetrahedron}} = 8 - \frac{16}{3} = \frac{24}{3} - \frac{16}{3} = \frac{8}{3}$$


      Why it works:

      This subtractive method is infinitely easier than trying to calculate the height of a regular tetrahedron
      whose edges are diagonals of the cube faces (length $2\sqrt{2}$). Notice that the tetrahedron takes
      up exactly $\frac{8/3}{8} = \frac{1}{3}$ of the cube''s volume.

      '
    instruction: 'Work through this step: Subtract the four corner pyramids from the total volume of the
      cube.'
    type: freeResponse
  problem: A cube has a side length of 2. By connecting the four vertices of the cube such that no two
    are connected by a cube edge, you form a regular tetrahedron inside the cube. What is the volume of
    this tetrahedron?
