guidedProject:
  language: cpp
  instructions: 'Build a small pointer-based inventory scanner.


    The app will handle compiling, linking, and running hidden checks. You only edit
    the project files. Do not add `main()` to your files; the app supplies hidden
    `main()` functions when you click Run Checks.


    Required project behavior:


    - Use the provided `Item` struct exactly as written.

    - Implement `Item* findItemById(Item* items, int count, int id);`

    - Implement `void applyDurabilityDamage(Item* item, int amount);`

    - Implement `bool transferItem(Item* from, Item* to);`


    Exact behavior:


    - `findItemById` scans indexes `0` through `count - 1`.

    - `findItemById` only matches occupied slots.

    - `findItemById` returns a pointer to the matching slot.

    - `findItemById` returns `nullptr` if `items` is null, `count <= 0`, or no occupied
    item has the target id.

    - `applyDurabilityDamage` must safely do nothing when `item == nullptr`.

    - `applyDurabilityDamage` subtracts `amount` from `item->durability`.

    - `applyDurabilityDamage` clamps durability at `0`.

    - `transferItem` returns `false` if either pointer is null.

    - `transferItem` returns `false` if `from` is not occupied.

    - `transferItem` returns `false` if `to` is already occupied.

    - On success, `transferItem` copies the item from `from` to `to`, clears the source
    slot, and returns `true`.


    Keep the file names, struct fields, and function names exactly as provided. The
    hidden checks call these exact names.

    '
  files:
  - path: Item.h
    readOnly: false
    content: "#pragma once\n#include <string>\nusing namespace std;\n\nstruct Item\
      \ {\n    int id;\n    string name;\n    int durability;\n    bool occupied;\n\
      };\n"
  - path: InventoryScanner.h
    readOnly: false
    content: "#pragma once\n#include \"Item.h\"\n\nItem* findItemById(Item* items,\
      \ int count, int id)\n{\n    // Scan occupied slots and return a pointer to\
      \ the matching item.\n    return nullptr;\n}\n\nvoid applyDurabilityDamage(Item*\
      \ item, int amount)\n{\n    // Safely damage the item and clamp durability at\
      \ 0.\n}\n\nbool transferItem(Item* from, Item* to)\n{\n    // Move an occupied\
      \ item into an empty destination slot.\n    return false;\n}\n"
  - path: ProjectNotes.md
    readOnly: true
    content: 'This project is intentionally header-only so the hidden checks can include
      your code directly.


      Names that must match exactly:


      - Item

      - id

      - name

      - durability

      - occupied

      - findItemById(Item* items, int count, int id)

      - applyDurabilityDamage(Item* item, int amount)

      - transferItem(Item* from, Item* to)


      Do not write main(). The app writes the hidden main() functions for each check.

      '
  requiredChecks:
  - id: find-existing-occupied-item
    title: findItemById returns the matching occupied slot
    description: findItemById must scan occupied slots and return a pointer to the
      item with the requested id.
    expectedOutputContains:
    - FIND_EXISTING_OK
    testCode: "int main() {\n    Item items[4] = {\n        {10, \"potion\", 5, true},\n\
      \        {20, \"sword\", 80, true},\n        {30, \"empty-looking\", 40, false},\n\
      \        {40, \"shield\", 60, true}\n    };\n\n    Item* found = findItemById(items,\
      \ 4, 20);\n    if (found == &items[1] && found->name == \"sword\") {\n     \
      \   cout << \"FIND_EXISTING_OK\";\n        return 0;\n    }\n\n    cout << \"\
      FIND_EXISTING_FAIL\";\n    return 0;\n}\n"
  - id: find-ignores-empty-and-missing
    title: findItemById ignores empty slots and reports missing items
    description: findItemById must ignore unoccupied slots and return nullptr when
      no occupied matching item exists.
    expectedOutputContains:
    - FIND_MISSING_OK
    testCode: "int main() {\n    Item items[3] = {\n        {7, \"empty-bow\", 25,\
      \ false},\n        {8, \"lantern\", 10, true},\n        {9, \"rope\", 12, true}\n\
      \    };\n\n    Item* emptyMatch = findItemById(items, 3, 7);\n    Item* missing\
      \ = findItemById(items, 3, 100);\n    Item* nullItems = findItemById(nullptr,\
      \ 3, 8);\n    Item* zeroCount = findItemById(items, 0, 8);\n\n    if (emptyMatch\
      \ == nullptr && missing == nullptr && nullItems == nullptr && zeroCount == nullptr)\
      \ {\n        cout << \"FIND_MISSING_OK\";\n        return 0;\n    }\n\n    cout\
      \ << \"FIND_MISSING_FAIL\";\n    return 0;\n}\n"
  - id: damage-mutates-and-clamps
    title: applyDurabilityDamage mutates and clamps
    description: applyDurabilityDamage must subtract damage from durability and never
      leave durability below zero.
    expectedOutputContains:
    - DAMAGE_CLAMP_OK
    testCode: "int main() {\n    Item item{5, \"helmet\", 12, true};\n    applyDurabilityDamage(&item,\
      \ 4);\n    bool firstDamage = item.durability == 8;\n\n    applyDurabilityDamage(&item,\
      \ 50);\n    bool clamped = item.durability == 0;\n\n    if (firstDamage && clamped)\
      \ {\n        cout << \"DAMAGE_CLAMP_OK\";\n        return 0;\n    }\n\n    cout\
      \ << \"DAMAGE_CLAMP_FAIL:\" << item.durability;\n    return 0;\n}\n"
  - id: damage-null-safe
    title: applyDurabilityDamage handles nullptr
    description: applyDurabilityDamage must safely do nothing when it receives nullptr.
    expectedOutputContains:
    - DAMAGE_NULL_OK
    testCode: "int main() {\n    applyDurabilityDamage(nullptr, 10);\n    cout <<\
      \ \"DAMAGE_NULL_OK\";\n    return 0;\n}\n"
  - id: transfer-moves-and-clears
    title: transferItem moves an item and clears the source
    description: transferItem must copy an occupied source item into an empty destination
      and clear the source slot.
    expectedOutputContains:
    - TRANSFER_MOVE_OK
    testCode: "int main() {\n    Item from{11, \"axe\", 70, true};\n    Item to{0,\
      \ \"\", 0, false};\n\n    bool moved = transferItem(&from, &to);\n    bool destinationHasItem\
      \ = to.occupied && to.id == 11 && to.name == \"axe\" && to.durability == 70;\n\
      \    bool sourceCleared = !from.occupied;\n\n    if (moved && destinationHasItem\
      \ && sourceCleared) {\n        cout << \"TRANSFER_MOVE_OK\";\n        return\
      \ 0;\n    }\n\n    cout << \"TRANSFER_MOVE_FAIL\";\n    return 0;\n}\n"
  bonusChecks:
  - id: transfer-fails-cleanly
    title: transferItem rejects invalid transfers
    description: transferItem should fail without damaging data when the destination
      is occupied, the source is empty, or either pointer is null.
    expectedOutputContains:
    - TRANSFER_FAILS_OK
    testCode: "int main() {\n    Item source{1, \"gem\", 100, true};\n    Item occupiedDestination{2,\
      \ \"coin\", 1, true};\n    Item emptySource{0, \"\", 0, false};\n    Item emptyDestination{0,\
      \ \"\", 0, false};\n\n    bool blockedOccupied = !transferItem(&source, &occupiedDestination)\n\
      \        && source.occupied\n        && occupiedDestination.id == 2;\n\n   \
      \ bool blockedEmptySource = !transferItem(&emptySource, &emptyDestination)\n\
      \        && !emptyDestination.occupied;\n\n    bool blockedNull = !transferItem(nullptr,\
      \ &emptyDestination)\n        && !transferItem(&source, nullptr);\n\n    if\
      \ (blockedOccupied && blockedEmptySource && blockedNull) {\n        cout <<\
      \ \"TRANSFER_FAILS_OK\";\n        return 0;\n    }\n\n    cout << \"TRANSFER_FAILS_FAIL\"\
      ;\n    return 0;\n}\n"
