schemaVersion: 1
id: precalculus-partial-fractions-quiz
title: Partial Fraction Decomposition Quiz
assessmentType: quiz
categoryId: precalculus
subcategoryId: precalc-rational
subcategoryIds:
  - precalc-rational
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: 'Which template matches $\frac{7x-1}{(x+3)(x-5)}$?'
    choices:
      - id: a
        text: '$\frac{A}{x+3}+\frac{B}{x-5}$'
      - id: b
        text: '$\frac{Ax+B}{(x+3)(x-5)}$'
      - id: c
        text: '$A(x+3)+B(x-5)$'
      - id: d
        text: '$\frac{A}{(x+3)^2}+\frac{B}{(x-5)^2}$'
    answer:
      choiceId: a
    explanation: |
      The denominator has distinct linear factors. The exact decomposition technique is one constant numerator over each linear factor.

  - id: q002
    type: multipleChoice
    prompt: 'Which template matches $\frac{x+1}{(x-4)^3}$?'
    choices:
      - id: a
        text: '$\frac{A}{x-4}+\frac{B}{(x-4)^2}+\frac{C}{(x-4)^3}$'
      - id: b
        text: '$\frac{A}{(x-4)^3}$ only'
      - id: c
        text: '$\frac{Ax+B}{(x-4)^3}$ only'
      - id: d
        text: '$A(x-4)+B(x-4)^2+C(x-4)^3$'
    answer:
      choiceId: a
    explanation: |
      Repeated linear factors require each power from $1$ to the repeated power. The exact technique is repeated-linear-factor decomposition.

  - id: q003
    type: multipleChoice
    prompt: 'Which template matches $\frac{2x+5}{(x+1)(x^2+4)}$?'
    choices:
      - id: a
        text: '$\frac{A}{x+1}+\frac{Bx+C}{x^2+4}$'
      - id: b
        text: '$\frac{A}{x+1}+\frac{B}{x^2+4}$'
      - id: c
        text: '$\frac{Ax+B}{x+1}+\frac{C}{x^2+4}$'
      - id: d
        text: '$\frac{A}{(x+1)^2}+\frac{B}{(x^2+4)^2}$'
    answer:
      choiceId: a
    explanation: |
      The irreducible quadratic $x^2+4$ needs a linear numerator. The exact technique is partial fractions with an irreducible quadratic factor.

  - id: q004
    type: multipleChoice
    prompt: 'For $\frac{4x+1}{(x-1)(x+2)}=\frac{A}{x-1}+\frac{B}{x+2}$, what equation comes from clearing denominators?'
    choices:
      - id: a
        text: '$4x+1=A(x+2)+B(x-1)$'
      - id: b
        text: '$4x+1=A(x-1)+B(x+2)$'
      - id: c
        text: '$4x+1=A+B$'
      - id: d
        text: '$4x+1=AB(x-1)(x+2)$'
    answer:
      choiceId: a
    explanation: |
      Multiplying by the common denominator leaves the opposite factor attached to each numerator. The exact technique is clearing denominators.

  - id: q005
    type: multipleChoice
    prompt: 'For $\frac{4x+1}{(x-1)(x+2)}=\frac{A}{x-1}+\frac{B}{x+2}$, what are $A$ and $B$?'
    choices:
      - id: a
        text: '$A=\frac{5}{3}$, $B=\frac{7}{3}$'
      - id: b
        text: '$A=\frac{7}{3}$, $B=\frac{5}{3}$'
      - id: c
        text: '$A=4$, $B=1$'
      - id: d
        text: '$A=-\frac{5}{3}$, $B=\frac{7}{3}$'
    answer:
      choiceId: a
    explanation: |
      Use $4x+1=A(x+2)+B(x-1)$. Setting $x=1$ gives $5=3A$, so $A=5/3$. Setting $x=-2$ gives $-7=-3B$, so $B=7/3$. The exact technique is substitution at factor roots.

  - id: q006
    type: multipleChoice
    prompt: 'What must happen before decomposing $\frac{x^2+3x+1}{x+2}$ into partial fractions?'
    choices:
      - id: a
        text: 'Polynomial division'
      - id: b
        text: 'Completing the square'
      - id: c
        text: 'Power reduction'
      - id: d
        text: 'No setup; it is already proper.'
    answer:
      choiceId: a
    explanation: |
      The numerator degree is greater than the denominator degree. The exact technique is polynomial division before decomposition.

  - id: q007
    type: selectAll
    prompt: "Which denominator factors require a linear numerator in a partial fraction template?"
    choices:
      - id: a
        text: '$x^2+1$'
      - id: b
        text: '$x^2+4x+8$'
      - id: c
        text: '$x-3$'
      - id: d
        text: '$(x+2)^2$'
    answer:
      choiceIds: [a, b]
    explanation: |
      Irreducible quadratic factors require linear numerators. The exact rule is numerator degree one less than denominator factor degree.

  - id: q008
    type: multipleChoice
    prompt: "Which expression is already decomposed into partial fractions?"
    choices:
      - id: a
        text: '$\frac{2}{x-1}+\frac{3}{x+4}$'
      - id: b
        text: '$\frac{2x+3}{(x-1)(x+4)}$'
      - id: c
        text: '$\frac{x^2+1}{x-1}$'
      - id: d
        text: '$\frac{2x+3}{x^2+4}$'
    answer:
      choiceId: a
    explanation: |
      Partial fractions are a sum of simpler rational pieces. The exact recognition skill is seeing separate terms over simple factors.

