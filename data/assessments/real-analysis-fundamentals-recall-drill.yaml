items:
- id: recall-subset
  type: flashcard
  prompt: What must be shown to prove A is a subset of B?
  answer:
    expected: Every element of A belongs to B.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Every element of A belongs to B.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-equivalence
  type: flashcard
  prompt: Name the three conditions of an equivalence relation.
  answer:
    expected: Reflexive, symmetric, and transitive.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Reflexive, symmetric, and transitive.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-function
  type: flashcard
  prompt: What uniqueness condition does a function impose?
  answer:
    expected: Each domain element has exactly one output.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Each domain element has exactly one output.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-injective
  type: flashcard
  prompt: State the defining implication for an injective function.
  answer:
    expected: Equal outputs imply equal inputs.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Equal outputs imply equal inputs.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-surjective
  type: flashcard
  prompt: What does surjective mean?
  answer:
    expected: Every codomain element is an output.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Every codomain element is an output.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-ordered-field
  type: flashcard
  prompt: What compatibility is required in an ordered field?
  answer:
    expected: Order is preserved by addition and multiplication by positive elements.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Order is preserved by addition and multiplication by positive elements.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-cauchy
  type: flashcard
  prompt: What does it mean for a sequence to be Cauchy?
  answer:
    expected: Its terms eventually become arbitrarily close to one another.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Its terms eventually become arbitrarily close to one another.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-rational-gap
  type: flashcard
  prompt: What completeness failure can occur in the rationals?
  answer:
    expected: A bounded rational set may have no rational supremum.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: A bounded rational set may have no rational supremum.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-upper-bound
  type: flashcard
  prompt: Define an upper bound of a set.
  answer:
    expected: A number at least as large as every element of the set.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: A number at least as large as every element of the set.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-supremum
  type: flashcard
  prompt: What makes an upper bound a supremum?
  answer:
    expected: It is the least upper bound.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: It is the least upper bound.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-infimum
  type: flashcard
  prompt: What makes a lower bound an infimum?
  answer:
    expected: It is the greatest lower bound.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: It is the greatest lower bound.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-archimedean
  type: flashcard
  prompt: State the Archimedean property in one sentence.
  answer:
    expected: Every real number is less than some integer.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Every real number is less than some integer.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-density
  type: flashcard
  prompt: What density fact connects rationals and reals?
  answer:
    expected: A rational lies between any two distinct real numbers.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: A rational lies between any two distinct real numbers.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-completeness
  type: flashcard
  prompt: State the least-upper-bound property of the reals.
  answer:
    expected: Every nonempty real set with an upper bound has a supremum in the reals.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: Every nonempty real set with an upper bound has a supremum in the reals.'
  tags:
  - real-analysis-fundamentals
  skills: []
- id: recall-partition
  type: flashcard
  prompt: How do equivalence classes organize a set?
  answer:
    expected: They form a partition of the set.
    aliases: []
    media: []
  explanation: 'Recall the exact definition: They form a partition of the set.'
  tags:
  - real-analysis-fundamentals
  skills: []
