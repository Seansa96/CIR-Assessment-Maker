questions:
- id: arc-easy-1
  title: Arc Length
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the arc length of $y = \frac{2}{3}x^{3/2}$ from $x=0$ to $x=8$.'
  answer:
    gradingMode: auto
    expectedLatex: (2/3)*(27 - 1)
    equivalenceMode: expression
    tolerance: 0
  explanation: $y' = x^{1/2}$. $L = \int_0^8 \sqrt{1+x} \, dx = \frac{2}{3}[(1+x)^{3/2}]_0^8
    = \frac{2}{3}(27 - 1)$.
