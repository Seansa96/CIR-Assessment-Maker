schemaVersion: 1
id: linear-algebra-span-basis-hard-test
title: Span, Independence, and Basis Advanced Test
assessmentType: test
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-linear-combinations-span
  - linear-algebra-linear-independence-basis
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 3
skills:
  - span
  - linear-independence
  - basis
  - dimension
questions:
  - id: test-hard-col-space-basis
    type: multipleChoice
    prompt: |
      Let $A = \begin{bmatrix} 1 & -2 & 0 & 4 \\ 3 & 1 & 1 & 0 \\ -1 & -5 & -1 & 8 \end{bmatrix}$. 
      The Reduced Row Echelon Form of $A$ is $\begin{bmatrix} 1 & 0 & \frac{2}{7} & \frac{4}{7} \\ 0 & 1 & -\frac{1}{7} & -\frac{12}{7} \\ 0 & 0 & 0 & 0 \end{bmatrix}$.
      Which of the following is a basis for the column space of $A$?
    choices:
      - id: c1
        text: '$\left\{ \begin{bmatrix} 1 \\ 3 \\ -1 \end{bmatrix}, \begin{bmatrix} -2 \\ 1 \\ -5 \end{bmatrix} \right\}$'
      - id: c2
        text: '$\left\{ \begin{bmatrix} 1 \\ 0 \\ 0 \end{bmatrix}, \begin{bmatrix} 0 \\ 1 \\ 0 \end{bmatrix} \right\}$'
      - id: c3
        text: '$\left\{ \begin{bmatrix} 1 \\ -2 \\ 0 \\ 4 \end{bmatrix}, \begin{bmatrix} 3 \\ 1 \\ 1 \\ 0 \end{bmatrix} \right\}$'
      - id: c4
        text: '$\left\{ \begin{bmatrix} -\frac{2}{7} \\ \frac{1}{7} \\ 1 \\ 0 \end{bmatrix}, \begin{bmatrix} -\frac{4}{7} \\ \frac{12}{7} \\ 0 \\ 1 \end{bmatrix} \right\}$'
    answer:
      choiceId: c1

  - id: test-hard-span-h
    type: multipleChoice
    prompt: |
      Let $\vec{v}_1 = \begin{bmatrix} 1 \\ 0 \\ -2 \end{bmatrix}$, $\vec{v}_2 = \begin{bmatrix} -3 \\ 1 \\ 8 \end{bmatrix}$, and $\vec{b} = \begin{bmatrix} h \\ -5 \\ 0 \end{bmatrix}$.
      For what value of $h$ is $\vec{b}$ in the plane spanned by $\vec{v}_1$ and $\vec{v}_2$?
    choices:
      - id: c1
        text: '$h = -5$'
      - id: c2
        text: '$h = 5$'
      - id: c3
        text: '$h = 13$'
      - id: c4
        text: '$h = -13$'
    answer:
      choiceId: c1

  - id: test-hard-dimension-subspace
    type: multipleChoice
    prompt: |
      Let $H$ be the subspace of $\mathbb{R}^4$ consisting of all vectors of the form $\begin{bmatrix} a - 2b + 5c \\ 2a + 5b - 8c \\ -a - 4b + 7c \\ 3a + b + c \end{bmatrix}$. 
      What is the dimension of $H$?
    choices:
      - id: c1
        text: '1'
      - id: c2
        text: '2'
      - id: c3
        text: '3'
      - id: c4
        text: '4'
    answer:
      choiceId: c2
