questions:
- id: hard-test-q104
  type: multipleChoice
  prompt: Two inscribed angles intercept same arc. Compare them.
  choices:
  - id: a
    text: They supplement
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: They are equal
  answer:
    choiceId: d
  explanation: Both are half same arc. A common error is they supplement.
- id: hard-test-q018
  type: multipleChoice
  prompt: Two secants meet outside circle; far arc 150, near arc 70. Find angle.
  choices:
  - id: a
    text: 140 degrees
  - id: b
    text: 20 degrees
  - id: c
    text: 40 degrees
  - id: d
    text: 110 degrees
  answer:
    choiceId: c
  explanation: Outside angle is half difference. A common error is 110 degrees.
- id: hard-test-q058
  type: multipleChoice
  prompt: Cyclic quadrilateral has angles x+20 and 2x+10 opposite. Find x.
  choices:
  - id: a
    text: '25'
  - id: b
    text: '50'
  - id: c
    text: '75'
  - id: d
    text: '100'
  answer:
    choiceId: b
  explanation: Their sum is 180. A common error is 75.
- id: hard-test-q062
  type: multipleChoice
  prompt: Can an unmarked angle be assumed 90 because a segment appears horizontal?
  choices:
  - id: a
    text: 'No'
  - id: b
    text: 'Yes'
  - id: c
    text: The stated facts are insufficient.
  - id: d
    text: Use the diagram scale to estimate the result.
  answer:
    choiceId: a
  explanation: Perpendicularity needs proof/mark. A common error is yes.
- id: hard-test-q095
  type: multipleChoice
  prompt: Exterior angle 117 and remote interior 49. Find other remote.
  choices:
  - id: a
    text: 166 degrees
  - id: b
    text: 112 degrees
  - id: c
    text: 34 degrees
  - id: d
    text: 68 degrees
  answer:
    choiceId: d
  explanation: Subtract. A common error is 166 degrees.
- id: hard-test-q096
  type: multipleChoice
  prompt: AB=AC; angle A=46. Find angle B.
  choices:
  - id: a
    text: 113 degrees
  - id: b
    text: 33.5 degrees
  - id: c
    text: 67 degrees
  - id: d
    text: 44 degrees
  answer:
    choiceId: c
  explanation: Remaining 134 split equally. A common error is 44 degrees.
- id: hard-test-q106
  type: multipleChoice
  prompt: A square has diagonal. Find angle between diagonal and a side.
  choices:
  - id: a
    text: 22.5 degrees
  - id: b
    text: 45 degrees
  - id: c
    text: 90 degrees
  - id: d
    text: 135 degrees
  answer:
    choiceId: b
  explanation: It forms isosceles right triangle. A common error is 90 degrees.
- id: hard-test-q016
  type: multipleChoice
  prompt: A transversal makes 35 degrees with one parallel line. Find acute angle it makes with other.
  choices:
  - id: a
    text: 35 degrees
  - id: b
    text: 145 degrees
  - id: c
    text: 17.5 degrees
  - id: d
    text: 45 degrees
  answer:
    choiceId: a
  explanation: Corresponding acute angles equal. A common error is 145 degrees.
- id: hard-test-q059
  type: multipleChoice
  prompt: Exterior turn of regular octagon is 45. Find interior.
  choices:
  - id: a
    text: 45 degrees
  - id: b
    text: 67.5 degrees
  - id: c
    text: 145 degrees
  - id: d
    text: 135 degrees
  answer:
    choiceId: d
  explanation: Supplement it. A common error is 45 degrees.
- id: hard-test-q100
  type: multipleChoice
  prompt: A radius meets tangent at T. What is angle between them?
  choices:
  - id: a
    text: 45 degrees
  - id: b
    text: 100 degrees
  - id: c
    text: 90 degrees
  - id: d
    text: 180 degrees
  answer:
    choiceId: c
  explanation: Radius-tangent theorem. A common error is 180 degrees.
- id: hard-test-q053
  type: multipleChoice
  prompt: Isosceles triangle has base angles x+10 and 2x-20. Find x.
  choices:
  - id: a
    text: '15'
  - id: b
    text: '30'
  - id: c
    text: '10'
  - id: d
    text: '60'
  answer:
    choiceId: b
  explanation: Equal base angles. A common error is 10.
- id: hard-test-q107
  type: multipleChoice
  prompt: If an angle is labeled x and its supplement 2x, find x.
  choices:
  - id: a
    text: 60 degrees
  - id: b
    text: 90 degrees
  - id: c
    text: 120 degrees
  - id: d
    text: 30 degrees
  answer:
    choiceId: a
  explanation: 3x=180. A common error is 90 degrees.
- id: hard-test-q102
  type: multipleChoice
  prompt: To show two base angles equal in a circle-center chord setup, which fact helps?
  choices:
  - id: a
    text: Chord is a diameter
  - id: b
    text: The stated facts are insufficient.
  - id: c
    text: Use the diagram scale to estimate the result.
  - id: d
    text: Radii to chord endpoints are equal
  answer:
    choiceId: d
  explanation: This makes an isosceles triangle. A common error is chord is a diameter.
- id: hard-test-q142
  type: multipleChoice
  prompt: Two inscribed angles intercept arcs 120 and 80. Find their angle difference.
  choices:
  - id: a
    text: 160 degrees
  - id: b
    text: 10 degrees
  - id: c
    text: 20 degrees
  - id: d
    text: 40 degrees
  answer:
    choiceId: c
  explanation: They are 60 and 40. A common error is 40 degrees.
- id: hard-test-q024
  type: multipleChoice
  prompt: An angle subtending a diameter is what?
  choices:
  - id: a
    text: 100 degrees
  - id: b
    text: 90 degrees
  - id: c
    text: 180 degrees
  - id: d
    text: 45 degrees
  answer:
    choiceId: b
  explanation: It intercepts a semicircle. A common error is 180 degrees.
