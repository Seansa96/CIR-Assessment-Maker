questions:
- id: hard-test-q104
  type: multipleChoice
  prompt: Two inscribed angles intercept the exact same arc. What is their relationship?
  choices:
  - id: a
    text: They are supplementary
    issueSignals:
    - id: theorem-error
      domains: []
  - id: b
    text: The stated facts are insufficient.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: c
    text: Use the diagram scale to estimate the result.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: d
    text: They are equal
  answer:
    choiceId: d
  difficultyDimensions:
  - Identify that both angles are inscribed and share an arc.
  - Apply the inscribed angle theorem to conclude they are equal.
  explanation: 'Solution:

    Both inscribed angles are equal to exactly half of the same intercepted arc. Therefore, they must
    be equal to each other.


    Why it works:

    This is a direct corollary of the inscribed angle theorem, sometimes called the "bow-tie" theorem
    when the chords cross.


    Why the other choices fail:

    - **(A)** They would be supplementary only if they intercepted opposite arcs that combine to form
    the whole circle (like opposite angles of a cyclic quadrilateral).

    '
- id: hard-test-q018
  type: multipleChoice
  prompt: Two secants meet outside a circle. The far intercepted arc is 150, and the near intercepted
    arc is 70. Find the angle between the secants.
  choices:
  - id: a
    text: 140 degrees
    issueSignals:
    - id: formula-error
      domains: []
  - id: b
    text: 20 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: 40 degrees
  - id: d
    text: 110 degrees
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recall the exterior intersecting secants angle theorem.
  - Subtract the near arc from the far arc and divide by 2.
  explanation: 'Solution:

    The angle formed by two secants meeting outside the circle is half the difference of their intercepted
    arcs.

    $$\frac{150^\circ - 70^\circ}{2} = \frac{80^\circ}{2} = 40^\circ$$


    Why it works:

    Drawing an auxiliary chord forms a triangle where the exterior angle is inscribed to the far arc,
    and the remote interior angles are the exterior intersection and the near inscribed arc. This leads
    directly to the difference formula.


    Why the other choices fail:

    - **(B)** 20 might come from $70-150/2$ or subtracting wrong.

    - **(D)** 110 is half the *sum* ($150+70=220$, $220/2=110$), which is the formula for chords intersecting
    *inside* the circle.

    '
- id: hard-test-q058
  type: multipleChoice
  prompt: A cyclic quadrilateral has opposite angles measuring $x+20$ and $2x+10$. Find $x$.
  choices:
  - id: a
    text: '25'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: b
    text: '50'
  - id: c
    text: '75'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: d
    text: '100'
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Setup the supplementary angle equation.
  - Solve the multi-step linear equation for $x$.
  explanation: 'Solution:

    Opposite angles in a cyclic quadrilateral sum to 180 degrees.

    $$(x + 20) + (2x + 10) = 180$$

    $$3x + 30 = 180$$

    $$3x = 150 \implies x = 50$$


    Why it works:

    The cyclic quadrilateral property requires opposite angles to be supplementary.


    Why the other choices fail:

    - **(C)** 75 results from assuming the angles are equal: $x+20 = 2x+10 \implies x=10$, which is wrong,
    or another math error.

    '
- id: hard-test-q062
  type: multipleChoice
  prompt: Can an unmarked angle be assumed to be 90 degrees just because a segment appears horizontal
    and another appears vertical?
  choices:
  - id: a
    text: 'No'
  - id: b
    text: 'Yes'
    issueSignals:
    - id: methodology-error
      domains: []
  - id: c
    text: The stated facts are insufficient.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: d
    text: Use the diagram scale to estimate the result.
    issueSignals:
    - id: methodology-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Distinguish rigorous geometric proof from visual appearance.
  - Rely on text definitions and explicit markings over diagrams.
  explanation: 'Solution:

    No, angles cannot be assumed to be 90 degrees based purely on visual appearance.


    Why it works:

    Diagrams are often intentionally drawn to scale or slightly off-scale. A right angle must be marked
    with a square symbol, explicitly stated in the text, or proven via theorems (e.g., Thales'' theorem
    or Pythagorean converse).


    Why the other choices fail:

    - **(B)** Yes is exactly the trap of trusting the diagram over the text.

    '
- id: hard-test-q095
  type: multipleChoice
  prompt: An exterior angle of a triangle is 117, and one remote interior angle is 49. Find the other
    remote interior angle.
  choices:
  - id: a
    text: 166 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: 112 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: 34 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 68 degrees
  answer:
    choiceId: d
  difficultyDimensions:
  - Apply the exterior angle theorem.
  - Subtract 49 from 117.
  explanation: 'Solution:

    The exterior angle equals the sum of the two remote interior angles.

    $$49^\circ + x = 117^\circ$$

    $$x = 117^\circ - 49^\circ = 68^\circ$$


    Why it works:

    The third angle in the triangle is $180 - 117 = 63$. Then $180 - 63 - 49 = 68$. The exterior angle
    theorem skips the intermediate step.


    Why the other choices fail:

    - **(A)** 166 is the sum ($117+49$), failing to subtract.

    '
- id: hard-test-q096
  type: multipleChoice
  prompt: In $\triangle ABC$, $AB=AC$ and vertex $\angle A = 46^\circ$. Find base $\angle B$.
  choices:
  - id: a
    text: 113 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: 33.5 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: 67 degrees
  - id: d
    text: 44 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Subtract the vertex angle from 180 to find the base angle sum.
  - Divide by 2 to find a single base angle.
  explanation: 'Solution:

    The sum of all three angles is 180. The remaining angle measure to be shared by the two equal base
    angles is:

    $$180^\circ - 46^\circ = 134^\circ$$

    Since $AB=AC$, $\angle B = \angle C$.

    $$\angle B = 134^\circ / 2 = 67^\circ$$


    Why it works:

    Isosceles triangles have two equal angles opposite their two equal sides.


    Why the other choices fail:

    - **(D)** 44 is an arithmetic error ($134/2 \neq 44$).

    '
- id: hard-test-q106
  type: multipleChoice
  prompt: A square has a diagonal drawn. Find the angle between the diagonal and a side.
  choices:
  - id: a
    text: 22.5 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: 45 degrees
  - id: c
    text: 90 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: d
    text: 135 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Recognize that the diagonal splits the square into two right isosceles triangles.
  - Conclude the angle is half of 90.
  explanation: 'Solution:

    A square has $90^\circ$ corners. The diagonal bisects these corner angles.

    $$90^\circ / 2 = 45^\circ$$


    Why it works:

    The diagonal and two sides form an isosceles right triangle ($90^\circ, 45^\circ, 45^\circ$).


    Why the other choices fail:

    - **(C)** 90 is the corner angle of the square, not the angle with the diagonal.

    '
- id: hard-test-q016
  type: multipleChoice
  prompt: A transversal makes a 35-degree angle with one parallel line. Find the acute angle it makes
    with the other parallel line.
  choices:
  - id: a
    text: 35 degrees
  - id: b
    text: 145 degrees
    issueSignals:
    - id: supplement-error
      domains: []
  - id: c
    text: 17.5 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 45 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Recall that all acute angles in a parallel line transversal setup are equal.
  - Reject the obtuse supplement when asked for an acute angle.
  explanation: 'Solution:

    When a transversal intersects parallel lines, all the acute angles formed are equal (35 degrees),
    and all the obtuse angles formed are equal (145 degrees).


    Why it works:

    Corresponding, alternate interior, and vertical angles all guarantee that the 4 acute angles at the
    two intersections are identical.


    Why the other choices fail:

    - **(B)** 145 is the obtuse angle (the supplement).

    '
- id: hard-test-q059
  type: multipleChoice
  prompt: The exterior turn angle of a regular octagon is 45 degrees. Find its interior angle.
  choices:
  - id: a
    text: 45 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: b
    text: 67.5 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: 145 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 135 degrees
  answer:
    choiceId: d
  difficultyDimensions:
  - Recall that an interior angle and its adjacent exterior turn angle form a linear pair.
  - Subtract 45 from 180.
  explanation: 'Solution:

    An interior angle and its exterior angle are supplementary.

    $$180^\circ - 45^\circ = 135^\circ$$


    Why it works:

    Walking along a polygon''s edge and turning at the vertex forms a straight line ($180^\circ$) when
    combined with the interior angle you didn''t walk through.


    Why the other choices fail:

    - **(A)** 45 is the exterior angle itself.

    - **(C)** 145 is an arithmetic error ($190-45$).

    '
- id: hard-test-q100
  type: multipleChoice
  prompt: A radius meets a tangent line at the point of tangency $T$. What is the angle between them?
  choices:
  - id: a
    text: 45 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: b
    text: 100 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: c
    text: 90 degrees
  - id: d
    text: 180 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recall the tangent-radius theorem.
  - Understand that the radius represents the shortest distance, which implies perpendicularity.
  explanation: 'Solution:

    A radius is always perpendicular to a tangent line at the point of tangency, so the angle is 90 degrees.


    Why it works:

    The shortest distance from the center to the tangent line is the radius, and the shortest path is
    always the perpendicular.


    Why the other choices fail:

    - **(D)** 180 means they form a straight line, which is visually and geometrically impossible for
    a circle.

    '
- id: hard-test-q053
  type: multipleChoice
  prompt: An isosceles triangle has base angles labeled $x+10$ and $2x-20$. Find $x$.
  choices:
  - id: a
    text: '15'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: b
    text: '30'
  - id: c
    text: '10'
    issueSignals:
    - id: algebra-error
      domains: []
  - id: d
    text: '60'
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Set the two base angle expressions equal.
  - Solve for $x$.
  explanation: 'Solution:

    Base angles of an isosceles triangle are equal.

    $$x + 10 = 2x - 20$$

    $$10 + 20 = 2x - x$$

    $$30 = x$$


    Why it works:

    By definition (or the Isosceles Triangle Theorem), the angles opposite the equal sides must be congruent.


    Why the other choices fail:

    - **(C)** 10 comes from $x-20=0$ or a similar error.

    '
- id: hard-test-q107
  type: multipleChoice
  prompt: If an angle is labeled $x$ and its supplement is $2x$, find $x$.
  choices:
  - id: a
    text: 60 degrees
  - id: b
    text: 90 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: c
    text: 120 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: 30 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Create an equation using the definition of supplementary angles.
  - Solve $3x=180$.
  explanation: 'Solution:

    Supplementary angles sum to 180.

    $$x + 2x = 180$$

    $$3x = 180 \implies x = 60$$


    Why it works:

    Algebra directly translates the geometric property into an equation.


    Why the other choices fail:

    - **(B)** 90 assumes the angles are equal ($x=2x$ is impossible for positive angles).

    - **(C)** 120 is the measure of the larger angle ($2x$), not $x$.

    '
- id: hard-test-q102
  type: multipleChoice
  prompt: To show two base angles are equal in a circle-center-to-chord setup, which fact helps?
  choices:
  - id: a
    text: The chord is a diameter.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: b
    text: The stated facts are insufficient.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: c
    text: Use the diagram scale to estimate the result.
    issueSignals:
    - id: methodology-error
      domains: []
  - id: d
    text: Radii drawn to the chord endpoints are equal.
  answer:
    choiceId: d
  difficultyDimensions:
  - Identify that drawing radii forms a triangle.
  - Recall that all radii are equal, making the triangle isosceles.
  explanation: 'Solution:

    Connecting the center to the two endpoints of the chord creates two radii. Since all radii are equal,
    this forms an isosceles triangle, which guarantees the two base angles are equal.


    Why it works:

    This is the fundamental bridge between circle geometry and triangle geometry.


    Why the other choices fail:

    - **(A)** The chord does not need to be a diameter for this to work; it works for any chord.

    '
- id: hard-test-q142
  type: multipleChoice
  prompt: Two inscribed angles intercept arcs measuring 120 and 80. Find the absolute difference between
    the two angles.
  choices:
  - id: a
    text: 160 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: 10 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: 20 degrees
  - id: d
    text: 40 degrees
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Calculate each inscribed angle separately (halve each arc).
  - Subtract the two angles.
  explanation: 'Solution:

    First inscribed angle $= 120 / 2 = 60^\circ$.

    Second inscribed angle $= 80 / 2 = 40^\circ$.

    Difference $= 60^\circ - 40^\circ = 20^\circ$.


    Why it works:

    Applying the inscribed angle theorem to each angle individually before finding their difference prevents
    conflating them with intersecting secant formulas.


    Why the other choices fail:

    - **(D)** 40 is the difference of the arcs ($120-80$), failing to halve them.

    '
- id: hard-test-q024
  type: multipleChoice
  prompt: An angle inscribed in a circle subtends a diameter. What is the measure of the angle?
  choices:
  - id: a
    text: 100 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: b
    text: 90 degrees
  - id: c
    text: 180 degrees
    issueSignals:
    - id: angle-measure-error
      domains: []
  - id: d
    text: 45 degrees
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Identify that a diameter cuts a $180^\circ$ semicircle.
  - Apply the inscribed angle theorem.
  explanation: 'Solution:

    A diameter subtends a semicircle, which is a $180^\circ$ arc.

    An inscribed angle is half of its intercepted arc.

    $$\frac{1}{2}(180^\circ) = 90^\circ$$


    Why it works:

    This is known as Thales'' theorem. Any angle inscribed in a semicircle is a right angle.


    Why the other choices fail:

    - **(C)** 180 is the measure of the arc, not the angle.

    '
