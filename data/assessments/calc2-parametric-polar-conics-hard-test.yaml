questions:
- id: q001
  title: Sketching Parametric Curves
  type: freeResponse
  prompt: |-
    Sketch the parametric curve and describe its exact behavior over the given interval.

    $$
    x=t^2-4t+1,\quad y=3-2t,\quad -1\le t\le 5
    $$
  answer:
    expected: |-
      A complete response identifies the Cartesian curve, the start/end points, and direction.
    gradingMode: selfCheck
    keyPoints:
    - Identify the curve as a parabola.
    - Identify the starting point at $t=-1$ as $(6, 5)$.
    - Identify the ending point at $t=5$ as $(6, -7)$.
    - Note that the curve traces exactly one section of the parabola.
  explanation: "Solve for $t$: $t = \\frac{3-y}{2}$. Substitute into $x$: \n$$\nx\
    \ = \\left(\\frac{3-y}{2}\\right)^2 - 4\\left(\\frac{3-y}{2}\\right) + 1\n$$\n\
    This is a parabola opening to the right. \nAt $t=-1$, $(x,y) = (6, 5)$. \nAt $t=5$,\
    \ $(x,y) = (6, -7)$.\nThe curve moves smoothly from $(6,5)$ down to $(6,-7)$ along\
    \ the parabolic path."
- id: q002
  title: Sketching Parametric Curves
  type: freeResponse
  prompt: |-
    Sketch the parametric curve. Eliminate the parameter to find the Cartesian equation.

    $$
    x=e^t+1,\quad y=-2e^{2t}+3
    $$
  answer:
    expected: |-
      A complete response provides the Cartesian equation and domain restriction.
    gradingMode: selfCheck
    keyPoints:
    - State the Cartesian equation $y = -2(x-1)^2 + 3$.
    - Identify the domain restriction $x > 1$ because $e^t > 0$.
    - Sketch the right half of the parabola.
  explanation: |-
    From $x=e^t+1$, we have $e^t = x-1$. Since $e^t > 0$, we must have $x > 1$.
    Substitute into $y$:
    $$
    y = -2(e^t)^2 + 3 = -2(x-1)^2 + 3
    $$
    This is a downward-opening parabola with vertex $(1,3)$. Due to the domain restriction, the sketch is only the portion of the parabola strictly to the right of $x=1$.
- id: q003
  title: Parameterizations of Curves
  type: freeResponse
  prompt: |-
    Write a parameterization for the ellipse $\frac{x^2}{16} + \frac{y^2}{9} = 1$, starting at $(0,3)$ and traced clockwise.
  answer:
    expected: |-
      A complete response provides $x(t)$ and $y(t)$ that meet all conditions.
    gradingMode: selfCheck
    keyPoints:
    - Identify $a=4, b=3$.
    - Ensure $(x(0), y(0)) = (0,3)$.
    - Ensure clockwise motion.
    - State $x = 4\sin t, y = 3\cos t$ (or equivalent).
  explanation: "A standard clockwise ellipse is $x = a\\sin t, y = b\\cos t$. \nLet's\
    \ check the starting point at $t=0$:\n$$\nx(0) = 4\\sin(0) = 0,\\quad y(0) = 3\\\
    cos(0) = 3\n$$\nThis matches $(0,3)$. \nAt $t=\\pi/2$, $x=4, y=0$, which is clockwise\
    \ from the top vertex.\n$$\nx = 4\\sin t,\\quad y = 3\\cos t\n$$"
- id: q004
  title: Parameterizations of Curves
  type: freeResponse
  prompt: |-
    Write a parameterization for the path that traverses the line segment from $(-2, 3)$ to $(4, -1)$ and then from $(4,-1)$ back to $(-2,3)$. You only need to describe how you would construct a piecewise parameterization.
  answer:
    expected: |-
      A complete response explains a piecewise construction or a back-and-forth periodic function.
    gradingMode: selfCheck
    keyPoints:
    - Create $L_1(t)$ from $t=0$ to $t=1$.
    - Create $L_2(t)$ from $t=1$ to $t=2$ reversing the direction.
  explanation: |-
    For the first leg ($0 \le t \le 1$):
    $$
    x_1(t) = -2 + 6t,\quad y_1(t) = 3 - 4t
    $$
    For the second leg ($1 \le t \le 2$):
    $$
    x_2(t) = 4 - 6(t-1),\quad y_2(t) = -1 + 4(t-1)
    $$
    These can be combined into a single piecewise function.
- id: q005
  title: Derivatives with Parametric Curves
  type: freeResponse
  prompt: |-
    Find the slope of the tangent line to the curve $x=2+5\cos t, y=-1-3\sin t$ at $t = \frac{5\pi}{6}$.
  answer:
    expected: |-
      A complete response provides the exact numerical slope.
    gradingMode: selfCheck
    keyPoints:
    - Find $\frac{dx}{dt} = -5\sin t$ and $\frac{dy}{dt} = -3\cos t$.
    - Find $\frac{dy}{dx} = \frac{3}{5}\cot t$.
    - Evaluate at $t=\frac{5\pi}{6}$ to get $-\frac{3\sqrt{3}}{5}$.
  explanation: |-
    First, find the derivatives:
    $$
    \frac{dx}{dt} = -5\sin t,\quad \frac{dy}{dt} = -3\cos t
    $$
    $$
    \frac{dy}{dx} = \frac{-3\cos t}{-5\sin t} = \frac{3}{5}\cot t
    $$
    Evaluate at $t = \frac{5\pi}{6}$:
    $$
    \cot\left(\frac{5\pi}{6}\right) = -\sqrt{3}
    $$
    $$
    \frac{dy}{dx} = \frac{3}{5}(-\sqrt{3}) = -\frac{3\sqrt{3}}{5}
    $$
- id: q006
  title: Horizontal and Vertical Tangents
  type: freeResponse
  prompt: |-
    Find all points $(x,y)$ where the curve $x=t^4-4t^2, y=t^3-3t$ has vertical tangents. Justify that these are not cusps.
  answer:
    expected: |-
      A complete response finds where $dx/dt=0$ and verifies $dy/dt \ne 0$.
    gradingMode: selfCheck
    keyPoints:
    - Set $\frac{dx}{dt} = 4t^3 - 8t = 0$ to get $t=0, \pm\sqrt{2}$.
    - Check $\frac{dy}{dt} = 3t^2 - 3 \ne 0$ at those $t$ values.
    - Calculate coordinates to find $(0,0), (-4, \sqrt{2}), (-4, -\sqrt{2})$.
  explanation: |-
    Vertical tangents occur where $\frac{dx}{dt}=0$ and $\frac{dy}{dt}\ne 0$.
    $$
    \frac{dx}{dt} = 4t^3 - 8t = 4t(t^2 - 2) = 0 \implies t = 0, \sqrt{2}, -\sqrt{2}
    $$
    Check $\frac{dy}{dt} = 3t^2 - 3$:
    At $t=0$, $\frac{dy}{dt} = -3 \ne 0$.
    At $t=\pm\sqrt{2}$, $\frac{dy}{dt} = 3(2) - 3 = 3 \ne 0$.
    Therefore, these are valid vertical tangents, not cusps.
    Points:
    $t=0 \implies (0,0)$
    $t=\sqrt{2} \implies (4-8, 2\sqrt{2}-3\sqrt{2}) = (-4, -\sqrt{2})$
    $t=-\sqrt{2} \implies (4-8, -2\sqrt{2}+3\sqrt{2}) = (-4, \sqrt{2})$
- id: q007
  title: Concavity of Parametric Curves
  type: freeResponse
  prompt: |-
    Determine the interval(s) of $t$ for which the curve $x=e^t, y=te^t$ is concave down.
  answer:
    expected: |-
      A complete response calculates the second derivative and determines where it is negative.
    gradingMode: selfCheck
    keyPoints:
    - Find $\frac{dy}{dx} = \frac{e^t + te^t}{e^t} = 1+t$.
    - Find $\frac{d^2y}{dx^2} = \frac{1}{e^t}$.
    - Conclude that it is never concave down.
  explanation: |-
    First, find $\frac{dy}{dx}$:
    $$
    \frac{dx}{dt} = e^t,\quad \frac{dy}{dt} = e^t + te^t
    $$
    $$
    \frac{dy}{dx} = \frac{e^t(1+t)}{e^t} = 1+t
    $$
    Next, apply the second derivative formula:
    $$
    \frac{d^2y}{dx^2} = \frac{\frac{d}{dt}(1+t)}{e^t} = \frac{1}{e^t}
    $$
    Since $e^t > 0$ for all $t$, $\frac{d^2y}{dx^2} > 0$ everywhere. The curve is never concave down.
- id: q008
  title: Integrals with Parametric Curves
  type: numericResponse
  prompt: |-
    Find the arc length of the parametric curve $x=t^2, y=t^3-3t$ for $0 \le t \le 2$. Round your final answer to 3 decimal places.
  answer:
    value: '7.391'
    tolerance: 0.005
  explanation: |-
    The formula for parametric arc length is:
    $$
    L = \int_a^b \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \,dt
    $$
    Derivatives:
    $$
    \frac{dx}{dt} = 2t,\quad \frac{dy}{dt} = 3t^2-3
    $$
    Setup integral:
    $$
    L = \int_0^2 \sqrt{(2t)^2 + (3t^2-3)^2} \,dt = \int_0^2 \sqrt{4t^2 + 9t^4 - 18t^2 + 9} \,dt = \int_0^2 \sqrt{9t^4 - 14t^2 + 9} \,dt
    $$
    Using a calculator, $L \approx 7.391$.
- id: q009
  title: Sketching Polar Curves
  type: freeResponse
  prompt: |-
    Sketch the polar curve $r=3+6\cos\theta$. Identify its specific shape and any important features like inner loops.
  answer:
    expected: |-
      A complete response sketches a limaçon with an inner loop.
    gradingMode: selfCheck
    keyPoints:
    - Identify the shape as a limaçon with an inner loop.
    - State the outer loop reaches $r=9$ at $\theta=0$.
    - State the inner loop reaches $r=-3$ at $\theta=\pi$.
    - Identify zeros at $\theta = \frac{2\pi}{3}, \frac{4\pi}{3}$.
  explanation: |-
    Since $|\frac{a}{b}| = |\frac{3}{6}| = \frac{1}{2} < 1$, this is a limaçon with an inner loop.
    At $\theta=0$, $r = 9$.
    At $\theta=\pi$, $r = -3$ (this traces the inner loop in the direction of $0$).
    The curve passes through the pole when $3+6\cos\theta=0 \implies \cos\theta = -1/2 \implies \theta = \frac{2\pi}{3}, \frac{4\pi}{3}$.
- id: q010
  title: Sketching Polar Curves
  type: freeResponse
  prompt: |-
    Sketch the polar curve $r=4\cos(3\theta)$. How many petals does it have?
  answer:
    expected: |-
      A complete response sketches a three-petaled rose.
    gradingMode: selfCheck
    keyPoints:
    - Identify the shape as a rose curve.
    - Identify it has 3 petals (since 3 is odd).
    - State the first petal is centered on the positive x-axis ($\theta=0$).
  explanation: |-
    The equation $r=a\cos(n\theta)$ with $n=3$ describes a rose curve. Because $n$ is odd, it has exactly $n=3$ petals. The maximum radius is $4$, which occurs when $\cos(3\theta)=1$, specifically at $\theta=0, \frac{2\pi}{3}, \frac{4\pi}{3}$.
- id: q011
  title: Slopes with Polar Curves
  type: freeResponse
  prompt: |-
    Find the exact slope of the tangent line to the polar curve $r=2-2\sin\theta$ at $\theta=\pi$.
  answer:
    expected: |-
      A complete response evaluates the polar slope formula at $\theta=\pi$.
    gradingMode: selfCheck
    keyPoints:
    - Evaluate $r(\pi) = 2$ and $r'(\pi) = 2$.
    - Substitute into the slope formula.
    - State the slope is 1.
  explanation: |-
    Given $r = 2-2\sin\theta$ and $r' = -2\cos\theta$.
    Evaluate at $\theta = \pi$:
    $$
    r = 2-2(0) = 2,\quad r' = -2(-1) = 2
    $$
    Substitute into the slope formula:
    $$
    \frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta} = \frac{2(0) + 2(-1)}{2(-1) - 2(0)} = \frac{-2}{-2} = 1
    $$
- id: q012
  title: Polar Horizontal and Vertical Tangents
  type: freeResponse
  prompt: |-
    Find all values of $\theta$ in $[0, 2\pi)$ where the polar curve $r=1+\sin\theta$ has a vertical tangent.
  answer:
    expected: |-
      A complete response finds where the denominator of $dy/dx$ is zero and numerator is non-zero.
    gradingMode: selfCheck
    keyPoints:
    - Set $r'\cos\theta - r\sin\theta = 0$.
    - State $\cos^2\theta - \sin\theta - \sin^2\theta = 0$.
    - Solve to get $\sin\theta = \frac{1}{2}, -1$.
    - Identify $\theta = \frac{\pi}{6}, \frac{5\pi}{6}$. Note $\theta=\frac{3\pi}{2}$
      is a cusp.
  explanation: |-
    For a vertical tangent, the denominator of $\frac{dy}{dx}$ must be zero:
    $$
    \frac{dx}{d\theta} = r'\cos\theta - r\sin\theta = 0
    $$
    Given $r = 1+\sin\theta$, we have $r' = \cos\theta$:
    $$
    \cos^2\theta - (1+\sin\theta)\sin\theta = 0
    $$
    $$
    1 - \sin^2\theta - \sin\theta - \sin^2\theta = 0
    $$
    $$
    2\sin^2\theta + \sin\theta - 1 = 0
    $$
    $$
    (2\sin\theta - 1)(\sin\theta + 1) = 0
    $$
    This gives $\sin\theta = \frac{1}{2}$ (so $\theta = \pi/6, 5\pi/6$) and $\sin\theta = -1$ (so $\theta = 3\pi/2$).
    However, at $\theta = 3\pi/2$, both $dx/d\theta = 0$ and $dy/d\theta = 0$. This is the cusp at the pole, not a vertical tangent. The valid vertical tangents are at $\pi/6$ and $5\pi/6$.
- id: q013
  title: Integrals with Polar Curves
  type: numericResponse
  prompt: |-
    Find the area of the inner loop of the limaçon $r=1+2\cos\theta$. Round your final answer to 3 decimal places.
  answer:
    value: '0.544'
    tolerance: 0.005
  explanation: |-
    First, find the bounds for the inner loop. Set $r=0$:
    $$
    1+2\cos\theta = 0 \implies \cos\theta = -1/2 \implies \theta = \frac{2\pi}{3}, \frac{4\pi}{3}
    $$
    The inner loop is traced as $\theta$ goes from $\frac{2\pi}{3}$ to $\frac{4\pi}{3}$.
    Setup integral:
    $$
    A = \frac{1}{2}\int_{2\pi/3}^{4\pi/3} (1+2\cos\theta)^2 \,d\theta
    $$
    Using a calculator, $A \approx 0.544$.
- id: q014
  title: Integrals with Polar Curves
  type: numericResponse
  prompt: |-
    Find the area of the region inside the circle $r=4\sin\theta$ and outside the circle $r=2$. Round your final answer to 3 decimal places.
  answer:
    value: '7.653'
    tolerance: 0.005
  explanation: |-
    First, find the intersection points:
    $$
    4\sin\theta = 2 \implies \sin\theta = \frac{1}{2} \implies \theta = \frac{\pi}{6}, \frac{5\pi}{6}
    $$
    The area is the integral of $\frac{1}{2}(r_{outer}^2 - r_{inner}^2)$:
    $$
    A = \frac{1}{2}\int_{\pi/6}^{5\pi/6} \left((4\sin\theta)^2 - 2^2\right) \,d\theta
    $$
    Using a calculator, $A = \frac{4\pi}{3} + 2\sqrt{3} \approx 4.826$ wait, no, $4.188+3.464 = 7.652$? Let's evaluate exactly:
    $\frac{1}{2}\int (16\sin^2\theta - 4) d\theta = \frac{1}{2}\int (8(1-\cos 2\theta) - 4) d\theta = \frac{1}{2}\int (4 - 8\cos 2\theta) d\theta$
    $= \frac{1}{2}[4\theta - 4\sin 2\theta] = [2\theta - 2\sin 2\theta]$
    Evaluate from $\pi/6$ to $5\pi/6$:
    Upper: $2(5\pi/6) - 2\sin(5\pi/3) = 5\pi/3 - 2(-\sqrt{3}/2) = 5\pi/3 + \sqrt{3}$
    Lower: $2(\pi/6) - 2\sin(\pi/3) = \pi/3 - 2(\sqrt{3}/2) = \pi/3 - \sqrt{3}$
    Difference: $(5\pi/3 + \sqrt{3}) - (\pi/3 - \sqrt{3}) = 4\pi/3 + 2\sqrt{3} \approx 4.18879 + 3.4641 = 7.653$.
    Let me correct the expected value to 7.653.
- id: q015
  title: Conic Sections
  type: freeResponse
  prompt: "Identify the conic section and write it in standard form by completing\
    \ the square: \n\n$$\n16x^2-25y^2+64x+150y-561=0\n$$"
  answer:
    expected: |-
      A complete response classifies the conic and provides the standard form.
    gradingMode: selfCheck
    keyPoints:
    - Identify the conic as a hyperbola.
    - Complete the square for $x$ and $y$.
    - 'State the final form: $\frac{(x+2)^2}{25} - \frac{(y-3)^2}{16} = 1$.'
  explanation: |-
    First, group the terms and factor out leading coefficients:
    $$
    16(x^2+4x) - 25(y^2-6y) = 561
    $$
    Complete the square:
    $$
    16(x^2+4x+4) - 25(y^2-6y+9) = 561 + 16(4) - 25(9)
    $$
    $$
    16(x+2)^2 - 25(y-3)^2 = 561 + 64 - 225 = 400
    $$
    Divide by $400$:
    $$
    \frac{(x+2)^2}{25} - \frac{(y-3)^2}{16} = 1
    $$
    This is a hyperbola opening horizontally.
- id: q016
  title: Conic Sections
  type: freeResponse
  prompt: |-
    Determine the center, vertices, foci, and asymptotes of the hyperbola $\frac{(y+1)^2}{9} - \frac{(x-2)^2}{16} = 1$.
  answer:
    expected: |-
      A complete response lists all key features of the hyperbola.
    gradingMode: selfCheck
    keyPoints:
    - 'Center: $(2, -1)$'
    - 'Vertices: $(2, 2)$ and $(2, -4)$'
    - 'Foci: $(2, 4)$ and $(2, -6)$'
    - 'Asymptotes: $y+1 = \pm \frac{3}{4}(x-2)$'
  explanation: "The hyperbola opens vertically because the $y^2$ term is positive.\
    \ \nCenter $(h,k) = (2, -1)$.\n$a^2 = 9 \\implies a=3$. Vertices are at $(h, k\
    \ \\pm a) = (2, -1\\pm 3)$, which are $(2, 2)$ and $(2, -4)$.\n$b^2 = 16 \\implies\
    \ b=4$.\n$c^2 = a^2+b^2 = 25 \\implies c=5$. Foci are at $(h, k \\pm c) = (2,\
    \ -1\\pm 5)$, which are $(2, 4)$ and $(2, -6)$.\nAsymptotes are $y-k = \\pm \\\
    frac{a}{b}(x-h)$, so $y+1 = \\pm \\frac{3}{4}(x-2)$."

- id: q-conics-hard-test-graph-1
  type: graphingResponse
  title: Graphing the Conic Section
  prompt: |
    A conic section is defined parametrically as $x(t) = 4 + 3\cos(t)$ and $y(t) = 1 + 3\sin(t)$.
    Determine the Cartesian equation of this conic section and draw it using the ellipse tool.
  answer:
    graphingAnswer:
      features:
        - type: ShapeType
          stringValue: ellipse
          weight: 1.0
        - type: Vertex
          x: 7.0
          y: 1.0
          tolerance: 0.2
          weight: 0.5
        - type: Vertex
          x: 1.0
          y: 1.0
          tolerance: 0.2
          weight: 0.5
        - type: Vertex
          x: 4.0
          y: 4.0
          tolerance: 0.2
          weight: 0.5
        - type: Vertex
          x: 4.0
          y: -2.0
          tolerance: 0.2
          weight: 0.5
  explanation: |
    Subtracting the constants and using $\cos^2 t + \sin^2 t = 1$, we get $(x-4)^2/9 + (y-1)^2/9 = 1$, which is the circle $(x-4)^2 + (y-1)^2 = 9$. This circle is centered at $(4, 1)$ with a radius of $3$.
  skills:
  - parametric-curves
