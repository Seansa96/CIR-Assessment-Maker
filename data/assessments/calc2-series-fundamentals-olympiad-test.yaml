  type: multipleChoice
  skills:
  - characterize-absolute-convergence-by-subseries
  prompt: 'A real series has the property that every subseries converges. What

    stronger conclusion follows?

    '
  choices:
  - id: a
    text: The original series converges absolutely.
  - id: b
    text: The original sum is zero.
  - id: c
    text: The terms are eventually zero.
  - id: d
    text: The series is geometric.
  answer:
    choiceId: a
  explanation: |-
    Solution: Selecting all positive terms and all negative terms gives finite masses of both signs, whose sum is the absolute series. Therefore the answer is The original series converges absolutely.. Therefore the answer is The original series converges absolutely.. Therefore the answer is The original series converges absolutely..

