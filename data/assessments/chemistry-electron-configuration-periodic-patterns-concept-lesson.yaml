modeDefault: study
randomizeQuestions: false
lesson:
  introduction: |-
    Learn how to read electron configurations directly from the periodic table.
  sections:
  - id: sec-econfig-001
    title: The Blocks of the Periodic Table
    content: |-
      The table’s s, p, d, and f blocks identify the subshell being filled. The s block is Groups 1–2 (plus helium), the p block is Groups 13–18, the d block is Groups 3–12, and the f block is the two detached rows. Use the block to identify the subshell letter.
    required: true
    check:
      id: q-econfig-001
      type: multipleChoice
      prompt: |-
        An element lies in Groups 3–12. Which subshell block is being filled?
      choices:
      - id: c1
        text: s block
        issueSignals:
        - id: electron-configuration-periodic-block-error
          domains:
          - chemistry
      - id: c2
        text: p block
        issueSignals:
        - id: electron-configuration-periodic-block-error
          domains:
          - chemistry
      - id: c3
        text: d block
        issueSignals: []
      - id: c4
        text: f block
        issueSignals:
        - id: electron-configuration-periodic-block-error
          domains:
          - chemistry
      answer:
        choiceId: c3
      explanation: |-
        How to Solve: The prompt places the element in Groups 3–12. Those groups occupy the central transition-metal region, which is the d block.
  - id: sec-econfig-002
    title: Reading the Rows (Principal Quantum Number)
    content: |-
      For s and p blocks, the subshell’s principal number matches the period. For d block it is period minus one, and for f block it is period minus two. This offset identifies the subshell being filled, not the atom’s outermost occupied shell.
    required: true
    check:
      id: q-econfig-002
      type: multipleChoice
      prompt: |-
        A transition element is in period 5. What principal number labels the d subshell being filled?
      choices:
      - id: c1
        text: '3'
        issueSignals:
        - id: electron-configuration-period-offset-error
          domains:
          - chemistry
      - id: c2
        text: '4'
        issueSignals: []
      - id: c3
        text: '5'
        issueSignals:
        - id: electron-configuration-period-offset-error
          domains:
          - chemistry
      - id: c4
        text: '6'
        issueSignals:
        - id: electron-configuration-period-offset-error
          domains:
          - chemistry
      answer:
        choiceId: c2
      explanation: |-
        How to Solve: Apply the d-block offset, $n=\text{period}-1$. For period 5, the filling subshell is $4d$.
  - id: sec-econfig-003
    title: Building the Configuration
    content: |-
      Within each block, moving one column to the right adds one electron to the subshell being filled. The s, p, d, and f subshells can hold 2, 6, 10, and 14 electrons, respectively.
    required: true
    check:
      id: q-econfig-003
      type: multipleChoice
      prompt: |-
        Magnesium is in period 3, Group 2. Which ending matches its position in the s block?
      choices:
      - id: c1
        text: $3s^1$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      - id: c2
        text: $3s^2$
        issueSignals: []
      - id: c3
        text: $2s^2$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      - id: c4
        text: $3d^2$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      answer:
        choiceId: c2
      explanation: |-
        How to Solve: Period 3 sets the s subshell label to $3s$. Group 2 is the second s-block column, so the subshell contains two electrons: $3s^2$.
  - id: sec-econfig-004
    title: Read the p-Block Position
    required: true
    content: |-
      The p block has six columns and fills from $p^1$ through $p^6$. For a main-group p-block element, its column within that block gives the superscript.
    check:
      id: sec-econfig-004-check
      type: multipleChoice
      prompt: |-
        Silicon is the second element in the period-3 p block. Which subshell ending follows from its position?
      choices:
      - id: c1
        text: $3p^1$
        issueSignals:
        - id: electron-configuration-block-position-error
          domains:
          - chemistry
      - id: c2
        text: $3p^2$
        issueSignals: []
      - id: c3
        text: $3p^3$
        issueSignals:
        - id: electron-configuration-block-position-error
          domains:
          - chemistry
      - id: c4
        text: $2p^2$
        issueSignals:
        - id: electron-configuration-block-position-error
          domains:
          - chemistry
      answer:
        choiceId: c2
      explanation: |-
        How to Solve: Period 3 gives the principal number 3, and the second position in the p block gives two p electrons. The ending is $3p^2$.
  - id: sec-econfig-005
    title: Assemble a Full Configuration
    required: true
    content: |-
      Combine the filled earlier subshells with the current block position, preserving the Aufbau order. Phosphorus is three places into period 3’s p block, so its ending is $3p^3$ after the filled $3s^2$.
    check:
      id: sec-econfig-005-check
      type: multipleChoice
      prompt: |-
        Phosphorus has atomic number 15. Which configuration both follows the block order and accounts for all 15 electrons?
      choices:
      - id: c1
        text: $1s^2 2s^2 2p^6 3s^2 3p^3$
        issueSignals: []
      - id: c2
        text: $1s^2 2s^2 2p^6 3s^1 3p^4$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      - id: c3
        text: $1s^2 2s^2 2p^6 3s^2 3p^5$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      - id: c4
        text: $1s^2 2s^2 2p^6 3d^3$
        issueSignals:
        - id: electron-configuration-electron-count-error
          domains:
          - chemistry
      answer:
        choiceId: c1
      explanation: |-
        How to Solve: The first two shells contribute 10 electrons and $3s^2$ brings the total to 12. Phosphorus is three positions into the $3p$ block, so $3p^3$ gives 15 total.
  - id: sec-econfig-006
    title: Compress the Core with Noble-Gas Notation
    required: true
    content: |-
      Replace the complete configuration of the nearest preceding noble gas with its symbol in brackets. Keep the remaining subshells in their filling order.
    check:
      id: sec-econfig-006-check
      type: multipleChoice
      prompt: |-
        Calcium has 20 electrons. Which noble-gas shorthand accounts for 18 core electrons and the remaining two?
      choices:
      - id: c1
        text: $[\mathrm{Ne}]\,3s^2 3p^6 4s^2$
        issueSignals:
        - id: electron-configuration-noble-gas-core-error
          domains:
          - chemistry
      - id: c2
        text: $[\mathrm{Ar}]\,4s^2$
        issueSignals: []
      - id: c3
        text: $[\mathrm{Kr}]\,4s^2$
        issueSignals:
        - id: electron-configuration-noble-gas-core-error
          domains:
          - chemistry
      - id: c4
        text: $[\mathrm{Ar}]\,3d^2$
        issueSignals:
        - id: electron-configuration-noble-gas-core-error
          domains:
          - chemistry
      answer:
        choiceId: c2
      explanation: |-
        How to Solve: Argon is the noble gas immediately before calcium and accounts for 18 electrons. Calcium has two more, which fill $4s$, giving $[\mathrm{Ar}]\,4s^2$.
  - id: sec-econfig-007
    title: Use d-Block Position and Ground-State Exceptions
    required: true
    content: |-
      A period-4 d-block element fills $3d$ after $4s$. Periodic position predicts the usual Aufbau pattern, but chromium and copper are notable ground-state exceptions: one $4s$ electron shifts to make a half-filled $3d^5$ or full $3d^{10}$ subshell.
    check:
      id: sec-econfig-007-check
      type: multipleChoice
      prompt: |-
        Copper is one electron short of a full d subshell in the usual Aufbau prediction $[\mathrm{Ar}]\,4s^2 3d^9$. Which observed ground-state configuration gives copper a full d subshell?
      choices:
      - id: c1
        text: $[\mathrm{Ar}]\,4s^2 3d^9$
        issueSignals:
        - id: electron-configuration-transition-metal-exception-error
          domains:
          - chemistry
      - id: c2
        text: $[\mathrm{Ar}]\,4s^1 3d^{10}$
        issueSignals: []
      - id: c3
        text: $[\mathrm{Ar}]\,4s^0 3d^{11}$
        issueSignals:
        - id: electron-configuration-transition-metal-exception-error
          domains:
          - chemistry
      - id: c4
        text: $[\mathrm{Kr}]\,4s^1 3d^{10}$
        issueSignals:
        - id: electron-configuration-transition-metal-exception-error
          domains:
          - chemistry
      answer:
        choiceId: c2
      explanation: |-
        How to Solve: Compare the predicted $3d^9$ with the stability cue in the question: a full d subshell needs one more electron. Moving one electron from $4s$ gives $4s^1 3d^{10}$ without changing the total count.
