schemaVersion: 1
id: chemistry-electron-configuration-periodic-patterns-concept-lesson
title: Electron Configurations and the Periodic Table
assessmentType: conceptLesson
categoryId: chemistry
subcategoryIds:
- chem-electron-configs
skills:
- chem-electron-configs
modeDefault: study
randomizeQuestions: false
lesson:
  introduction: "Learn how to read electron configurations directly from the periodic table."
  sections:
  - id: sec-econfig-001
    title: The Blocks of the Periodic Table
    content: |
      Rather than memorizing the diagonal rule, you can read electron configurations straight off the periodic table!
      
      The periodic table is divided into four distinct blocks corresponding to the angular momentum subshells:
      - **s-block**: Groups 1 and 2 (plus Helium).
      - **p-block**: Groups 13 through 18.
      - **d-block**: Groups 3 through 12 (the transition metals).
      - **f-block**: The two bottom rows (lanthanides and actinides).
    required: true
    check:
      id: q-econfig-001
      title: Identifying Blocks
      prompt: Which block do the transition metals belong to?
      type: multipleChoice
      skills:
      - periodic-table-patterns
      - electron-configurations
      choices:
      - id: c1
        text: s-block
      - id: c2
        text: p-block
      - id: c3
        text: d-block
      - id: c4
        text: f-block
      answer:
        choiceId: c3
      explanation: "The transition metals occupy the center of the table, which corresponds to the d-block."
  - id: sec-econfig-002
    title: Reading the Rows (Principal Quantum Number)
    content: |
      As you move down the rows (periods), the principal quantum number ($n$) increases.
      - For the **s** and **p** blocks, $n$ is exactly the row number. (e.g., Row 2 is 2s and 2p).
      - For the **d** block, $n$ is the row number minus 1. (e.g., Row 4 transition metals fill the **3d** subshell).
      - For the **f** block, $n$ is the row number minus 2. (e.g., Row 6 lanthanides fill the **4f** subshell).
    required: true
    check:
      id: q-econfig-002
      title: The d-block Shift
      prompt: In the 4th row (period) of the periodic table, what is the principal quantum number for the d-block elements (like Iron or Copper)?
      type: multipleChoice
      skills:
      - periodic-table-patterns
      - atomic-structure
      - electron-configurations
      choices:
      - id: c1
        text: "2"
      - id: c2
        text: "3"
      - id: c3
        text: "4"
      - id: c4
        text: "5"
      answer:
        choiceId: c2
      explanation: "For the d-block, the shell number is (Row - 1). Since it's in Row 4, the d-electrons fill the 3d subshell."
  - id: sec-econfig-003
    title: Building the Configuration
    content: |
      To find the electron configuration of any element, you "read" the periodic table left-to-right, top-to-bottom, just like a book.
      
      Example: **Oxygen (O)**
      1. Row 1: Read across the s-block -> $1s^2$
      2. Row 2: Read across the s-block -> $2s^2$
      3. Row 2 p-block: Oxygen is the 4th element in the 2p block -> $2p^4$
      
      Full configuration: $1s^2 2s^2 2p^4$
    required: true
    check:
      id: q-econfig-003
      title: Read a Configuration
      prompt: What is the full electron configuration of Phosphorus (P), the 3rd element in the 3p block?
      type: multipleChoice
      skills:
      - periodic-table-patterns
      - electron-configurations
      choices:
      - id: c1
        text: "$1s^2 2s^2 2p^6 3s^2 3p^2$"
      - id: c2
        text: "$1s^2 2s^2 2p^6 3s^2 3p^3$"
      - id: c3
        text: "$1s^2 2s^2 2p^6 3s^2 3p^5$"
      - id: c4
        text: "$1s^2 2s^2 2p^6 3d^3$"
      answer:
        choiceId: c2
      explanation: "Read left to right: Row 1 ($1s^2$), Row 2 ($2s^2 2p^6$), Row 3 s-block ($3s^2$), and 3 steps into the 3p block ($3p^3$). Total: $1s^2 2s^2 2p^6 3s^2 3p^3$."

