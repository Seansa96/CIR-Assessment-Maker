  prompt: "**Searching a BST**\n\nYou are given the root of a Binary Search Tree (BST). The node class\
    \ is:\n\n```python\nclass TreeNode:\n    def __init__(self, value):\n        self.value = value\n\
    \        self.left = None\n        self.right = None\n```\n\nWrite a Python function `search_bst(node,\
    \ target)` that returns `True` if the `target` value exists in the tree, and `False` otherwise. You\
    \ must use the BST property to achieve $O(\\log N)$ average time complexity. Do not search both branches\
    \ unconditionally.\n\n```python\ndef search_bst(node, target):\n    # Write your recursive logic here\n\
    \    pass\n```\n"
  answer:
    gradingMode: automatic
    codeLanguage: python
    testCases:
    - input: 'root = TreeNode(10)

        root.left = TreeNode(5)

        root.right = TreeNode(15)

        search_bst(root, 15)

        '
      expectedOutput: 'True'
    - input: 'root = TreeNode(10)

        root.left = TreeNode(5)

        root.right = TreeNode(15)

        search_bst(root, 99)

        '
      expectedOutput: 'False'
    - input: search_bst(None, 10)
      expectedOutput: 'False'
  explanation: "Solution:\n```python\ndef search_bst(node, target):\n    if node is None:\n        return\
    \ False\n    if node.value == target:\n        return True\n    \n    if target < node.value:\n  \
    \      return search_bst(node.left, target)\n    else:\n        return search_bst(node.right, target)\n\
    ```\n\nWhy it works:\nThe function first checks the base cases: if the node is empty, it returns `False`.\
    \ If it matches the target, it returns `True`. \nThen, it uses the BST property. If the target is\
    \ smaller, we know it *must* be in the left subtree, so we recursively search only the left. If it's\
    \ larger, we search only the right. This halves the search space at each step, yielding $O(\\log N)$\
    \ time.\n"
