questions:
  - id: eq-stochastic-check
    type: multipleChoice
    prompt: |
      Which of the following matrices is a valid **stochastic matrix** for a Markov chain?
    choices:
      - id: c1
        text: '$\begin{bmatrix}0.6 & 0.5 \\ 0.4 & 0.6\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}1.2 & 0 \\ -0.2 & 1\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}0.3 & 0.8 \\ 0.7 & 0.2\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}0.5 & 0.4 \\ 0.5 & 0.4\end{bmatrix}$'
    answer:
      choiceId: c3
    explanation: |
      A valid stochastic matrix must have columns that sum to exactly $1$, and all entries must be non-negative.
      - A: Column 2 sums to $1.1$.
      - B: Contains a negative probability ($-0.2$).
      - **C**: Column 1 sums to $0.3+0.7=1.0$, and Column 2 sums to $0.8+0.2=1.0$. All positive.
      - D: Column 2 sums to $0.8$.

  - id: eq-transition-meaning
    type: multipleChoice
    prompt: |
      Let $P$ be a transition matrix where the first column represents the "Healthy" state and the second column represents the "Sick" state.
      $P = \begin{bmatrix} 0.9 & 0.4 \\ 0.1 & 0.6 \end{bmatrix}$.
      What does the value $0.1$ represent?
    choices:
      - id: c1
        text: 'The probability of staying Healthy.'
      - id: c2
        text: 'The probability of transitioning from Healthy to Sick.'
      - id: c3
        text: 'The probability of transitioning from Sick to Healthy.'
      - id: c4
        text: 'The probability of staying Sick.'
    answer:
      choiceId: c2
    explanation: |
      The entry in row $i$ and column $j$ is the probability of transitioning *from* state $j$ *to* state $i$.
      The $0.1$ is in row 2 ("Sick") and column 1 ("Healthy"). Therefore, it is the probability of moving from Healthy to Sick.

  - id: eq-pca-variance
    type: multipleChoice
    prompt: |
      In a Principal Component Analysis (PCA) of a dataset, you compute the covariance matrix and find its eigenvalues are $\lambda_1 = 50$, $\lambda_2 = 12$, and $\lambda_3 = 0.5$.
      Which principal component captures the **most** variance in the dataset?
    choices:
      - id: c1
        text: 'The eigenvector corresponding to $\lambda_1 = 50$.'
      - id: c2
        text: 'The eigenvector corresponding to $\lambda_3 = 0.5$.'
      - id: c3
        text: 'The eigenvector corresponding to $\lambda_2 = 12$.'
      - id: c4
        text: 'They all capture the same amount of variance.'
    answer:
      choiceId: c1
    explanation: |
      In PCA, the eigenvalues represent the amount of variance (information) captured along the direction of their corresponding eigenvectors. The largest eigenvalue ($\lambda=50$) corresponds to the first principal component, which captures the maximum possible variance.
