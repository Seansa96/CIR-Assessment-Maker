questions:
- id: q001
  type: freeResponse
  skills:
  - physics2-ch16-modeling
  prompt: A Electromagnetic Waves situation emphasizes maxwell's equations. Define the system and sign convention,
    state when $c=1/\\sqrt{\\mu_0\\epsilon_0}$ applies, and construct a written solution that includes the relation,
    units, assumptions, and a limiting-case check.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - defines the system and sign convention
    - states or applies $c=1/\\sqrt{\\mu_0\\epsilon_0}$ with appropriate assumptions
    - shows units and an intermediate relation
    - checks direction or a limiting case
  explanation: 'Solution: Start from a defined system, write the governing relation symbolically, then connect the
    result to units and a physical limit.


    Why it works: The Electromagnetic Waves model of coupled electric and magnetic waves is reliable only when its
    relation, conditions, and interpretation are kept together.'
  difficultyDimensions: &id001
  - modelOrDerivation
  - proofJustification
  - representationTransfer
  subjectDifficultyTags:
