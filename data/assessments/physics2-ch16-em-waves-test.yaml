questions:
- id: q001
  type: numericResponse
  difficultyDimensions:
  - calculation-complexity
  - formula-application
  prompt: The magnetic field of a plane electromagnetic wave has a maximum value of
    $4.0 \times 10^{-6}\text{ T}$. What is the maximum value of the electric field
    (in V/m)? (Use $c = 3.0 \times 10^8\text{ m/s}$)
  answer:
    numericValue: 1200
    tolerance: 5
  explanation: 'Solution:

    1) Use the relation $E_{max} = c B_{max}$.

    2) Substitute values: $E_{max} = (3.0 \times 10^8) \times (4.0 \times 10^{-6})$.

    3) Calculate: $E_{max} = 12.0 \times 10^2 = 1200\text{ V/m}$.


    Why it works:

    In a vacuum, the ratio of the electric field magnitude to the magnetic field magnitude
    in an EM wave is always exactly the speed of light.'
