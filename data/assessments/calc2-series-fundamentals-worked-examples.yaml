- id: we-series-fundamentals-3
  title: A telescoping formula can reveal divergence
  problem: |
    Determine the behavior of
    $$\sum_{n=1}^{\infty}\left(\sqrt{n+1}-\sqrt n\right).$$
  steps:
  - id: step-series-fundamentals-3-1
    title: Check the individual term
    instruction: |
      Rationalizing gives
      $$\sqrt{n+1}-\sqrt n
      =\frac1{\sqrt{n+1}+\sqrt n}\longrightarrow0.$$
      The necessary term condition is satisfied.
    type: multipleChoice
    prompt: What conclusion follows from the zero term limit alone?
    choices:
    - id: a
      text: No convergence conclusion follows.
    - id: b
      text: The series converges.
    - id: c
      text: The series converges absolutely.
    - id: d
      text: The series sums to zero.
    answer:
      choiceId: a
    explanation: 'Solution: A zero term limit only prevents immediate rejection by the divergence test. Therefore the answer is No convergence conclusion follows.. Therefore the answer is No convergence conclusion follows.. Therefore the answer is No convergence conclusion follows..


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.


      Why the other choices fail: The series converges. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The series converges absolutely. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The series sums to zero. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.'
  - id: step-series-fundamentals-3-2
    title: Form the finite partial sum
    instruction: |
      Before taking a limit, write
      $$S_N=(\sqrt2-1)+(\sqrt3-\sqrt2)+\cdots+
      (\sqrt{N+1}-\sqrt N).$$
    type: multipleChoice
    prompt: Which terms cancel?
    choices:
    - id: a
      text: |-
        Every radical from $\sqrt2$ through $\sqrt N$
    - id: b
      text: Only the integer terms
    - id: c
      text: The first and last radicals
    - id: d
      text: No terms cancel
    answer:
      choiceId: a
    explanation: |-
      Solution: Each interior radical appears once positively and once negatively. Therefore the answer is Every radical from $\sqrt2$ through $\sqrt N$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: Only the integer terms conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; The first and last radicals conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; No terms cancel conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-series-fundamentals-3-3
    title: Identify the boundary growth
    instruction: |
      Cancellation leaves
      $$S_N=\sqrt{N+1}-1.$$
      This boundary term grows without bound as $N\to\infty$.
    type: multipleChoice
    prompt: What is the series classification?
    choices:
    - id: a
      text: |-
        Divergent to $+\infty$
    - id: b
      text: Convergent to $1$
    - id: c
      text: Conditionally convergent
    - id: d
      text: Oscillatory divergent
    answer:
      choiceId: a
    explanation: |-
      Solution: Series convergence is determined by the partial-sum limit, which is infinite here. Therefore the answer is Divergent to $+\infty$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

