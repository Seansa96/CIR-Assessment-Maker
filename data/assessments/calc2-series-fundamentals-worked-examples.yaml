  - id: step-series-fundamentals-3-4
    title: State the general lesson
    instruction: 'Telescoping is an algebraic simplification, not a convergence verdict.

      The surviving boundary must still approach a finite number.

      '
    type: multipleChoice
    prompt: Which final check is always required after telescoping?
    choices:
    - id: a
      text: Take the limit of the surviving partial-sum boundary terms.
    - id: b
      text: Apply the ratio test to the canceled terms.
    - id: c
      text: Assume the last term is zero.
    - id: d
      text: Count the number of cancellations.
    answer:
      choiceId: a
    explanation: |-
