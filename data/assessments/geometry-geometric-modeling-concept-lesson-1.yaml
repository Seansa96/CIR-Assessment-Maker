lesson:
  introduction: |-
    Geometry isn't just about abstract shapes; it is an incredible tool for modeling the real world. One of the most common applications of area is calculating population density.
  sections:
  - id: sec-modeling-area
    title: Modeling Real-World Shapes
    required: true
    content: |-
      When measuring a city, a state, or a country, the borders are almost never perfect geometric shapes. However, we can **model** them using composite shapes to get a very close estimate.
      
      For example, the state of Nevada looks somewhat like a rectangle with a triangle cut out of one corner. To estimate its area, we don't need calculus; we can just calculate the area of the rectangle and subtract the area of the missing triangle!

  - id: sec-population-density
    title: Population Density
    required: true
    content: |-
      **Population Density** tells us how crowded a specific area is. It is a ratio of the number of people (or animals, or trees) to the amount of space they occupy.
      
      $$\text{Population Density} = \frac{\text{Number of People}}{\text{Land Area}}$$
      
      For example, if a small town is modeled as a $3$ mile by $4$ mile rectangle, its area is $12$ square miles. If $6,000$ people live there, the density is $6000 / 12 = 500$ people per square mile.
      
      You can also rearrange the formula to find the total population if you know the density:
      $$\text{Total Population} = \text{Density} \times \text{Area}$$

questions:
- id: q-geom-mod-1
  title: Concept Check - Finding Density
  prompt: |-
    A city is roughly circular with a radius of $10$ miles. If the population is $314,159$ people, what is the approximate population density? (Use $\pi \approx 3.14159$)
  type: numericResponse
  answer:
    numericValue: 1000
    tolerance: 10
  explanation: |-
    First, find the area of the circular city: $A = \pi r^2 = \pi (10^2) = 100\pi \approx 314.159$ square miles.
    Then, divide the population by the area: $314159 \div 314.159 = 1000$ people per square mile.
  skills:
  - geometry-geometric-modeling

- id: q-geom-mod-2
  title: Concept Check - Finding Population
  prompt: |-
    A rectangular farm measures $2$ km by $3$ km. The farmer plants corn with a density of $4,000$ stalks per square kilometer. How many stalks of corn are on the farm?
  type: numericResponse
  answer:
    numericValue: 24000
    tolerance: 0
  explanation: |-
    The area of the farm is $2 \times 3 = 6$ square kilometers.
    Total Population = Density $\times$ Area = $4000 \times 6 = 24,000$ stalks.
  skills:
  - geometry-geometric-modeling
