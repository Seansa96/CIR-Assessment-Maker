glossary:
  sections:
    - title: "Sorting Characteristics"
      entries:
        - term: "In-place Sorting"
          definition: "A sorting algorithm that requires only a constant, O(1), amount of extra memory space."
        - term: "Stable Sort"
          definition: "A sorting algorithm that preserves the relative order of equal elements in the sorted output."
    - title: "Algorithms"
      entries:
        - term: "Bubble Sort"
          definition: "An O(n^2) sorting algorithm that repeatedly steps through the list, compares adjacent elements, and swaps them if they are in the wrong order."
        - term: "Merge Sort"
          definition: "An O(n log n) divide-and-conquer algorithm that recursively splits the list in half, sorts the halves, and then merges them back together."
