schemaVersion: 1
id: physics-static-structures-concept-lesson
title: Static Equilibrium of Rigid Structures
assessmentType: conceptLesson
categoryId: physics-1
topicId: physics-static-equilibrium-tension
modeDefault: practice
randomizeQuestions: false
skills: [static-equilibrium, torque, free-body-diagram, rigid-body]
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags: [physics-1, physics-static-equilibrium-tension, structures]
authoring:
  visualRequirement: required
  visualRationale: A rigid-body equilibrium model needs a force diagram, locations, and a pivot.
lesson:
  introduction: A rigid structure can be at rest only when both its net force and its net torque are zero.
  sections:
  - id: model
    title: Model the whole structure
    content: |
      Isolate the beam, ladder, or sign as one object. Draw every external force and label where it acts. Its weight acts at the center of mass; support forces act at their contact points.
    media:
    - type: image
      src: /media/physics/owa/static-beam-equilibrium.svg
      alt: Horizontal beam with a hinge force, cable tension, beam weight, and load weight.
      caption: Location matters because each force can produce torque about a chosen pivot.
    check: { id: ssc1, type: multipleChoice, prompt: 'What acts at a beam''s center of mass?', choices: [{ id: a, text: its weight }, { id: b, text: cable tension only }, { id: c, text: no force }, { id: d, text: torque only }], answer: { choiceId: a }, explanation: 'Solution: Its weight.\n\nWhy it works: Gravity acts at the center of mass.\n\nWhy the other choices fail: Support forces act at contacts.' }
  - id: force-balance
    title: Write force balance
    content: |
      Rest means $\sum F_x=0$ and $\sum F_y=0$. These equations determine how supports share horizontal and vertical load, but they do not by themselves prevent rotation.
    check: { id: ssc2, type: multipleChoice, prompt: 'What condition prevents translational acceleration?', choices: [{ id: a, text: '$\sum F=0$' }, { id: b, text: '$\sum\tau=1$' }, { id: c, text: $I=0$ }, { id: d, text: $v=0$ }], answer: { choiceId: a }, explanation: 'Solution: $\sum F=0$.\n\nWhy it works: Net force causes translational acceleration.\n\nWhy the other choices fail: Torque balance separately prevents angular acceleration.' }
  - id: torque
    title: Write torque balance
    content: |
      For each force, use $\tau=rF\sin\phi$, with a consistent clockwise/counterclockwise sign convention. Static equilibrium also requires $\sum\tau=0$.
    check: { id: ssc3, type: multipleChoice, prompt: 'What condition prevents angular acceleration?', choices: [{ id: a, text: '$\sum\tau=0$' }, { id: b, text: '$\sum F=1$' }, { id: c, text: $r=0$ always }, { id: d, text: $m=0$ }], answer: { choiceId: a }, explanation: 'Solution: $\sum\tau=0$.\n\nWhy it works: Net torque causes angular acceleration.\n\nWhy the other choices fail: Force balance alone does not stop rotation.' }
  - id: pivot
    title: Choose a helpful pivot
    content: |
      Choose a pivot through an unknown support force when possible. That force then has zero lever arm, so its torque is zero and the torque equation can solve another unknown first.
    check: { id: ssc4, type: multipleChoice, prompt: 'A force through the chosen pivot has torque:', choices: [{ id: a, text: zero }, { id: b, text: maximum }, { id: c, text: negative always }, { id: d, text: weight }], answer: { choiceId: a }, explanation: 'Solution: Zero.\n\nWhy it works: Its lever arm is zero.\n\nWhy the other choices fail: Force magnitude alone does not create torque.' }
  - id: lever-arm
    title: Use the perpendicular lever arm
    content: |
      The distance in a torque calculation is the perpendicular distance from the pivot to the force's line of action. A force applied at the pivot has no torque even if its magnitude is large.
    check: { id: ssc5, type: multipleChoice, prompt: 'Torque uses what distance?', choices: [{ id: a, text: perpendicular lever arm }, { id: b, text: any beam length }, { id: c, text: mass }, { id: d, text: time }], answer: { choiceId: a }, explanation: 'Solution: Perpendicular lever arm.\n\nWhy it works: It is distance to the force line of action.\n\nWhy the other choices fail: Other distances need not create torque.' }
  - id: solve
    title: Solve in a deliberate order
    content: |
      Draw the FBD, choose a pivot, solve $\sum\tau=0$, then use $\sum F_x=0$ and $\sum F_y=0$. Check units: torques are in N m and forces are in N.
    check: { id: ssc6, type: multipleChoice, prompt: 'What units measure torque?', choices: [{ id: a, text: N m }, { id: b, text: N }, { id: c, text: J/s }, { id: d, text: kg }], answer: { choiceId: a }, explanation: 'Solution: N m.\n\nWhy it works: Torque is force times lever arm.\n\nWhy the other choices fail: They are force, power, or mass units.' }
  - id: sanity
    title: Perform a structural sanity check
    content: |
      A support that can only push cannot supply a negative normal force, and a cable can only pull. If a result violates the support model, revise the assumed geometry rather than accepting an impossible force.
    check: { id: ssc7, type: multipleChoice, prompt: 'A cable can exert:', choices: [{ id: a, text: tension only }, { id: b, text: compression only }, { id: c, text: any push }, { id: d, text: no force }], answer: { choiceId: a }, explanation: 'Solution: Tension only.\n\nWhy it works: Cables pull but do not push.\n\nWhy the other choices fail: Compression requires a rigid member.' }
