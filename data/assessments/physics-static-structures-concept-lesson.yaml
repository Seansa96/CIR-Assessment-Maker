authoring:
  visualRequirement: required
  visualRationale: A rigid-body equilibrium model needs a force diagram, locations, and a pivot.
lesson:
  introduction: A rigid structure can be at rest only when both its net force and its net torque are zero.
  sections:
  - id: model
    title: Model the whole structure
    content: |
      Isolate the beam, ladder, or sign as one object. Draw every external force and label where it acts. Its weight acts at the center of mass; support forces act at their contact points.
    media:
    - type: image
      src: /media/physics/owa/static-beam-equilibrium.svg
      alt: Horizontal beam with a hinge force, cable tension, beam weight, and load weight.
      caption: Location matters because each force can produce torque about a chosen pivot.
  - id: force-balance
    title: Write force balance
    content: |
      Rest means $\sum F_x=0$ and $\sum F_y=0$. These equations determine how supports share horizontal and vertical load, but they do not by themselves prevent rotation.
  - id: torque
    title: Write torque balance
    content: |
      For each force, use $\tau=rF\sin\phi$, with a consistent clockwise/counterclockwise sign convention. Static equilibrium also requires $\sum\tau=0$.
  - id: pivot
    title: Choose a helpful pivot
    content: |
      Choose a pivot through an unknown support force when possible. That force then has zero lever arm, so its torque is zero and the torque equation can solve another unknown first.
  - id: lever-arm
    title: Use the perpendicular lever arm
    content: |
      The distance in a torque calculation is the perpendicular distance from the pivot to the force's line of action. A force applied at the pivot has no torque even if its magnitude is large.
  - id: solve
    title: Solve in a deliberate order
    content: |
      Draw the FBD, choose a pivot, solve $\sum\tau=0$, then use $\sum F_x=0$ and $\sum F_y=0$. Check units: torques are in N m and forces are in N.
  - id: sanity
    title: Perform a structural sanity check
    content: |
      A support that can only push cannot supply a negative normal force, and a cable can only pull. If a result violates the support model, revise the assumed geometry rather than accepting an impossible force.
