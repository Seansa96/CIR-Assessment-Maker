lesson:
  introduction: Learn to solve Functions problems by recognizing function machines, graphs, inputs and outputs, even and odd functions, absolute value, floor functions, piecewise functions, transformations and justifying each theorem or transformation.
  sections:
  - id: aops-functions-motivation
    title: What the topic helps you notice
    required: true
    content: Functions is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are function machines, graphs, inputs and outputs, even and odd functions, absolute value, floor functions, piecewise functions, transformations.
    check:
      id: aops-functions-motivation-check
      type: multipleChoice
      prompt: In Functions, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-functions-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
