workedExamples:
  - id: we-keq
    title: Finding $k_{eq}$ for Springs
    problem: |
      Let's derive the equivalent spring constants for springs connected in parallel and in series.
      
      ![Parallel and Series Springs](/C:/Users/SeanS/.gemini/antigravity-ide/brain/0c2da531-34dd-4854-a79c-4be0015d19b7/springs_parallel_series_1782498985857.png)
    steps:
      - id: step-1
        title: Step 1 — Parallel Springs
        instruction: |
          When two springs with constants $k_1$ and $k_2$ are connected in parallel, they must stretch by the same amount $x$. The total force required to stretch both springs is the sum of the individual forces.
        type: symbolicResponse
        prompt: |
          If $F_{\text{total}} = F_1 + F_2 = k_1 x + k_2 x$, what is the equivalent spring constant $k_{eq}$ such that $F_{\text{total}} = k_{eq} x$?
        answer:
          gradingMode: auto
          expectedLatex: k_1 + k_2
          equivalenceMode: expression
          tolerance: 0
        explanation: 'Factoring out $x$ gives $F_{\text{total}} = (k_1 + k_2)x$. Therefore, $k_{eq} = k_1 + k_2$.'
      - id: step-2
        title: Step 2 — Series Springs
        instruction: |
          When two springs are connected in series, the same force $F$ acts on both springs, but their extensions add up: $x_{\text{total}} = x_1 + x_2$.
          We know $x_1 = F / k_1$ and $x_2 = F / k_2$.
        type: symbolicResponse
        prompt: |
          Substitute $x_1$ and $x_2$ into the equation for total stretch, and find the expression for $1/k_{eq}$ (where $x_{\text{total}} = F / k_{eq}$).
        answer:
          gradingMode: auto
          expectedLatex: \frac{1}{k_1} + \frac{1}{k_2}
          equivalenceMode: expression
          tolerance: 0
        explanation: 'Since $F/k_{eq} = F/k_1 + F/k_2$, dividing by $F$ yields $1/k_{eq} = 1/k_1 + 1/k_2$.'
