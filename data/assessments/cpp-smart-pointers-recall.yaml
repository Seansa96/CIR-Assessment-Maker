schemaVersion: 1
id: cpp-smart-pointers-recall
title: C++ Smart Pointers Recall
assessmentType: recallDrill
categoryId: c++
subcategoryId: c++-standard-library
subcategoryIds:
  - c++-standard-library
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'Which smart pointer enforces exclusive ownership?'
    answer:
      expected: unique_ptr
      aliases:
        - std::unique_ptr
  - id: r002
    type: typed
    prompt: 'Which smart pointer allows shared ownership via reference counting?'
    answer:
      expected: shared_ptr
      aliases:
        - std::shared_ptr
  - id: r003
    type: typed
    prompt: 'What function is the safest way to create a `std::unique_ptr`?'
    answer:
      expected: make_unique
      aliases:
        - std::make_unique
  - id: r004
    type: typed
    prompt: 'Which header file is required to use smart pointers in C++?'
    answer:
      expected: <memory>
      aliases:
        - memory
  - id: r005
    type: flashcard
    prompt: 'What happens to the object managed by a `unique_ptr` when the pointer goes out of scope?'
    answer:
      expected: The object is automatically deleted.
