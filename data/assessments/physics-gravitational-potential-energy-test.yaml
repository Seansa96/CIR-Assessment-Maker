questions:
- id: q001
  type: numericResponse
  prompt: |
    A rogue meteor approaches Earth from very deep space (effectively infinity) where it was initially moving at $v_0 = 5.0 \times 10^3 \text{ m/s}$. 
    Assuming it falls directly toward Earth and ignores air resistance, what is its speed just before impact?
    Use $G = 6.67 \times 10^{-11} \text{ N m}^2/\text{kg}^2$, Earth mass $M = 5.97 \times 10^{24} \text{ kg}$, and Earth radius $R = 6.37 \times 10^6 \text{ m}$.
    Enter your answer in m/s.
  answer:
    value: 12248
    tolerance: 50
  explanation: |
    Solution:
    By conservation of energy: $E_i = E_f$
    $K_i + U_i = K_f + U_f$
    At infinity, $U_i = 0$, so $\frac{1}{2}mv_0^2 + 0 = \frac{1}{2}mv_f^2 - G\frac{Mm}{R}$.
    Dividing by $m$ and multiplying by 2:
    $v_f^2 = v_0^2 + \frac{2GM}{R}$
    Note that $\frac{2GM}{R}$ is simply the escape velocity squared ($v_{esc}^2 = 1.25 \times 10^8 \text{ m}^2/\text{s}^2$).
    $v_f^2 = (5000)^2 + 1.25 \times 10^8 = 2.5 \times 10^7 + 1.25 \times 10^8 = 1.5 \times 10^8$
    $v_f = \sqrt{1.5 \times 10^8} \approx 12247 \text{ m/s}$.
    
    Why it works:
    The meteor starts with non-zero kinetic energy at infinity. As it falls into the gravitational well, it gains kinetic energy equal to the depth of the potential energy well.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    Consider a satellite of mass $m$ in a stable circular orbit of radius $r$ around a planet of mass $M$.
    Write an expression for the total mechanical energy $E$ of the satellite.
    Use `G`, `M`, `m`, and `r`.
  answer:
    expectedLatex: -\frac{G M m}{2 r}
    equivalenceMode: expression
    variables: [G, M, m, r]
    tolerance: 0.00001
    keyPoints:
    - -GMm / (2r)
  explanation: |
    Solution:
    $E = -\frac{GMm}{2r}$
    
    Why it works:
    For a circular orbit, the centripetal force is gravity: $mv^2/r = GMm/r^2$, which means $mv^2 = GMm/r$.
    The kinetic energy is $K = \frac{1}{2}mv^2 = \frac{GMm}{2r}$.
    The potential energy is $U = -\frac{GMm}{r}$.
    The total energy $E = K + U = \frac{GMm}{2r} - \frac{GMm}{r} = -\frac{GMm}{2r}$.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
