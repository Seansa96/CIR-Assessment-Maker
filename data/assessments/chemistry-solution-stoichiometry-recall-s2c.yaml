items:
  - id: ssr-01
    type: flashcard
    prompt: 'How do you calculate moles of solute given molarity and volume in liters?'
    answer: { expected: multiply them }
    explanation: 'Solution: Moles = Molarity × Volume. Why it works: mol/L × L = mol.'
  - id: ssr-02
    type: flashcard
    prompt: 'What determines the theoretical yield in a reaction with two reactants?'
    answer: { expected: limiting reactant }
    explanation: 'Solution: Limiting reactant. Why it works: The reaction stops when this reactant runs out.'
