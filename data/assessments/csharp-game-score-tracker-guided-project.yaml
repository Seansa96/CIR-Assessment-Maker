        using System.Collections.Generic;
        using System.Linq;
        using System.Threading.Tasks;

        // TODO: Define ITracker interface
        
        // TODO: Implement ScoreTracker
        public class ScoreTracker
        {
            
        }
    - path: Program.cs
      readOnly: true
      content: |
        using System;
        using System.Collections.Generic;
        using System.Threading.Tasks;

        public class Program
        {
            public static async Task Main()
            {
                // We cast to the interface to ensure they implemented it correctly
                ITracker tracker = new ScoreTracker();
                
                tracker.AddScore("Alice", 100);
                tracker.AddScore("Bob", 50);
                tracker.AddScore("Alice", 200); // Alice is now 300
                tracker.AddScore("Charlie", 150);
                
                List<string> top2 = tracker.GetTopPlayers(2);
                
                if (top2.Count != 2) throw new Exception("Expected 2 players");
                if (top2[0] != "Alice") throw new Exception($"Expected Alice first, got {top2[0]}");
                if (top2[1] != "Charlie") throw new Exception($"Expected Charlie second, got {top2[1]}");
                
                // Ensure the async method can be awaited
                await tracker.SaveScoresAsync("dummy.txt");
                
                Console.WriteLine("All tests passed!");
            }
        }


