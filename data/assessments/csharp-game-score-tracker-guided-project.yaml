guidedProject:
  language: cpp
  instructions: |
    Build the Capstone: Game Score Tracker.

    This project pulls together Types, Control Flow, Collections, LINQ, OOP, and Async!
    
    You will build an async-capable `ScoreTracker` that implements an `ITracker` interface.

    Required project behavior:
    - In `ScoreTracker.cs`:
      - Define `public interface ITracker` with:
        - `void AddScore(string player, int score);`
        - `List<string> GetTopPlayers(int count);`
        - `Task SaveScoresAsync(string path);`
      - Implement `public class ScoreTracker : ITracker`.
      - Internally, use a `Dictionary<string, int>` to store `player -> score`.
      - `AddScore`: If the player exists, add the score to their current score. If not, add them to the dictionary.
      - `GetTopPlayers`: Use LINQ! Order the dictionary by the VALUE descending, select the KEY (the name), and Take the top `count`. Return it as a List.
      - `SaveScoresAsync`: 
        - Use `await Task.Delay(10)` to simulate disk I/O.
        - Create a string formatted as `"Player1:100,Player2:50"`. (Hint: `string.Join(",", dictionary.Select(kvp => $"{kvp.Key}:{kvp.Value}"))`)
        - Do not actually write to disk for this test, just return. (We don't want to pollute the test system with files).

  requiredChecks:
    - id: compile-check
      title: Compile
      description: Compiles correctly.
      expectedOutputContains:
        - "OK"
