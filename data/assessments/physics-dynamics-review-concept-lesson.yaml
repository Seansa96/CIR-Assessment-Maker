schemaVersion: 1
id: physics-dynamics-review-concept-lesson
title: Dynamics Model Synthesis Review
description: Select and connect force models across introductory dynamics.
assessmentType: conceptLesson
categoryId: physics-1
topicId: physics-dynamics-review
skills: [Synthesize dynamics models]
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [physics-1, physics-dynamics-review] }
lesson:
  introduction: 'Dynamics problems become manageable when you define the system, draw forces, choose axes, and apply the model that matches the constraints.'
  sections:
  - { id: ds1, title: Define the System, content: 'Choose the object or collection of objects whose motion you will analyze.', media: [], check: { id: dsc1, type: multipleChoice, prompt: 'What is the first modeling decision in a force problem?', choices: [{ id: a, text: define the system }, { id: b, text: choose an answer }, { id: c, text: cancel all forces }, { id: d, text: use energy immediately }], answer: { choiceId: a }, explanation: 'Solution: Define the system.\n\nWhy it works: Forces are identified relative to a chosen object or system.\n\nWhy the other choices fail: Equations require a clear system boundary first.' } }
  - { id: ds2, title: Draw a Free-Body Diagram, content: 'Represent every external force on the chosen system, not forces exerted by the system on other objects.', media: [], check: { id: dsc2, type: multipleChoice, prompt: 'A free-body diagram contains:', choices: [{ id: a, text: external forces on the system }, { id: b, text: every force in the universe }, { id: c, text: velocities only }, { id: d, text: internal forces only }], answer: { choiceId: a }, explanation: 'Solution: External forces on the system.\n\nWhy it works: They determine the system net force.\n\nWhy the other choices fail: Irrelevant or internal forces obscure the model.' } }
  - { id: ds3, title: Choose Axes, content: 'Align axes with motion or surfaces whenever possible so force components simplify.', media: [], check: { id: dsc3, type: multipleChoice, prompt: 'On an incline, a convenient axis is:', choices: [{ id: a, text: parallel and perpendicular to slope }, { id: b, text: arbitrary only }, { id: c, text: circular always }, { id: d, text: no axes }], answer: { choiceId: a }, explanation: 'Solution: Use axes parallel and perpendicular to the slope.\n\nWhy it works: Normal force and friction align naturally.\n\nWhy the other choices fail: They create unnecessary components.' } }
  - { id: ds4, title: Apply Newton's Second Law, content: 'For each axis, use $\sum F=ma$ with signs consistent with the selected coordinate direction.', media: [], check: { id: dsc4, type: multipleChoice, prompt: 'When net force is zero, acceleration is:', choices: [{ id: a, text: zero }, { id: b, text: always positive }, { id: c, text: mass }, { id: d, text: friction }], answer: { choiceId: a }, explanation: 'Solution: Acceleration is zero.\n\nWhy it works: $\sum F=ma$.\n\nWhy the other choices fail: Zero net force does not require zero velocity.' } }
  - { id: ds5, title: Friction and Contact, content: 'Static friction adjusts up to its maximum; kinetic friction has magnitude $\mu_kN$ during sliding.', media: [], check: { id: dsc5, type: multipleChoice, prompt: 'Kinetic friction occurs when surfaces:', choices: [{ id: a, text: slide relative to each other }, { id: b, text: are at rest only }, { id: c, text: have zero normal force }, { id: d, text: are massless }], answer: { choiceId: a }, explanation: 'Solution: They slide relative to each other.\n\nWhy it works: Kinetic friction models sliding contact.\n\nWhy the other choices fail: Static friction applies without relative sliding.' } }
  - { id: ds6, title: Connected Systems, content: 'A taut massless string constrains linked objects to have related acceleration magnitudes.', media: [], check: { id: dsc6, type: multipleChoice, prompt: 'An ideal taut string commonly makes connected masses share:', choices: [{ id: a, text: acceleration magnitude }, { id: b, text: mass }, { id: c, text: position always }, { id: d, text: gravity }], answer: { choiceId: a }, explanation: 'Solution: They share acceleration magnitude.\n\nWhy it works: String length is constrained.\n\nWhy the other choices fail: Different masses can be connected by one string.' } }
  - { id: ds7, title: Check the Result, content: 'Check units, signs, limits, and whether the acceleration direction agrees with the net force.', media: [], check: { id: dsc7, type: multipleChoice, prompt: 'A valid final dynamics check includes:', choices: [{ id: a, text: units and direction }, { id: b, text: color only }, { id: c, text: no equations }, { id: d, text: changing givens }], answer: { choiceId: a }, explanation: 'Solution: Check units and direction.\n\nWhy it works: They test consistency with the force model.\n\nWhy the other choices fail: They do not validate the physics.' } }
