schemaVersion: 1
id: css-portfolio-responsive-directed-project
title: Responsive Layout Drill
assessmentType: guidedProject
categoryId: css
subcategoryIds:
- css-responsive-design
skills:
- Apply css-responsive-design
navigation:
  learningGoal: evaluate
  activityType: guidedProject
  tags:
  - css
  - css-responsive-design
modeDefault: practice
guidedProject:
  language: bash
  instructions: Make the `.grid-container` layout change from 1 column (default) to 2 equal columns on screens wider than 800px.
  files:
  - path: style.css
    readOnly: false
    content: ".grid-container {\n  display: grid;\n  grid-template-columns: 1fr;\n}\n\n@media (min-width: 800px) {\n  .grid-container {\n    grid-template-columns: 1fr 1fr;\n  }\n}\n"
  requiredChecks:
  - id: check-exists
    title: Check CSS File
    description: Check that the CSS file was updated.
    expectedOutputContains:
    - OK
    testCode: echo OK
