id: images-vs-containers
title: Docker Images vs Containers
assessmentType: recallDrill
categoryId: containerization
items:
- id: item-image-definition
  type: flashcard
  prompt: 'What is a **Docker Image**? How does it differ from a container?

    '
  answer:
    expected: "A **Docker Image** is a read-only template or blueprint that contains\
      \ a set of instructions for creating a Docker container. \nIt includes the application\
      \ code, libraries, tools, dependencies, and other files needed to make an application\
      \ run. \n\nA **Container** is a runnable instance of an image. You can think\
      \ of an image as a class, and a container as an object instantiated from that\
      \ class.\n"
    aliases: []
    media: []
- id: item-layer-cache
  type: flashcard
  prompt: 'How do Docker images utilize layers and caching to improve build times
    and minimize storage?

    '
  answer:
    expected: "A Docker image is built up from a series of layers. Each instruction\
      \ in an image's Dockerfile (like `RUN`, `COPY`, `ADD`) creates a layer. \nThese\
      \ layers are stacked and each one is a delta of the changes from the previous\
      \ layer.\n\nWhen you rebuild an image, Docker checks if it can reuse existing\
      \ layers from its cache. If the instructions and files haven't changed, Docker\
      \ reuses the cached layer, which significantly speeds up the build process.\n"
    aliases: []
    media: []
