glossary:
  introduction: |-
    Quadratic work becomes more reliable when each representation and root condition has a precise name. These terms distinguish an equation from its polynomial, an algebraic candidate from a verified solution, and a computational technique from the invariant that justifies it.
  sections:
  - id: quadratic-objects-and-forms
    title: Quadratic Objects and Forms
    required: true
    content: A quadratic may be represented to emphasize coefficients, roots, or a completed square.
    entries:
    - id: quadratic-polynomial
      term: Quadratic Polynomial
      definition: A polynomial of degree exactly two, written $ax^2+bx+c$ with $a\ne0$.
      notation: '$ax^2+bx+c$'
      examples: ['$3x^2-5x+1$ is quadratic; $0x^2+4x-7$ is not.']
      aliases: [degree-two polynomial]
      media: []
      tags: [quadratic-polynomial]
      drills:
      - id: quadratic-polynomial-drill
        type: flashcard
        prompt: Why must $a\ne0$ in $ax^2+bx+c$?
        answer:
          expected: Otherwise the degree is less than two, so the polynomial is not quadratic.
        explanation: The leading nonzero term determines degree.
        tags: [quadratic-polynomial]
    - id: quadratic-equation
      term: Quadratic Equation
      definition: An equation that can be rearranged to $ax^2+bx+c=0$ with $a\ne0$.
      notation: '$ax^2+bx+c=0$'
      examples: ['$x(x+3)=10$ becomes $x^2+3x-10=0$.']
      aliases: []
      media: []
      tags: [quadratic-equation]
      drills:
      - id: quadratic-equation-drill
        type: flashcard
        prompt: What first transformation exposes whether an equation is quadratic?
        answer:
          expected: Move all terms to one side and simplify to polynomial standard form.
        explanation: Degree and coefficients are clearest when the other side is zero.
        tags: [quadratic-equation]
    - id: leading-coefficient
      term: Leading Coefficient
      definition: The coefficient $a$ of the highest-degree term $ax^2$ in a quadratic polynomial.
      notation: '$a$'
      examples: ['The leading coefficient of $-2x^2+7x-4$ is $-2$.']
      aliases: []
      media: []
      tags: [leading-coefficient]
      drills:
      - id: leading-coefficient-drill
        type: typed
        prompt: What is the leading coefficient of $5-3x+8x^2$?
        answer:
          expected: '8'
        explanation: Reorder by degree; the quadratic term is $8x^2$.
        tags: [leading-coefficient]
    - id: standard-form
      term: Standard Form
      definition: The coefficient-centered representation $ax^2+bx+c=0$ used for the discriminant, quadratic formula, and Vieta relations.
      notation: '$ax^2+bx+c=0$'
      examples: ['$2x(x-1)=3$ has standard form $2x^2-2x-3=0$.']
      aliases: [general form]
      media: []
      tags: [standard-form]
      drills:
      - id: standard-form-drill
        type: flashcard
        prompt: Which form makes $a$, $b$, and $c$ immediately available?
        answer:
          expected: Standard form.
        explanation: The coefficients appear explicitly in $ax^2+bx+c=0$.
        tags: [standard-form]
    - id: factored-form
      term: Factored Form
      definition: A product representation such as $a(x-r)(x-s)=0$ that exposes roots through the zero-product property.
      notation: '$a(x-r)(x-s)=0$'
      examples: ['$2(x-3)(x+1)=0$ has roots $3$ and $-1$.']
      aliases: []
      media: []
      tags: [factored-form]
      drills:
      - id: factored-form-drill
        type: flashcard
        prompt: What information does $a(x-r)(x-s)=0$ expose directly?
        answer:
          expected: The roots r and s.
        explanation: A product is zero when at least one factor is zero.
        tags: [factored-form]
    - id: vertex-form
      term: Vertex Form
      definition: The completed-square representation $a(x-h)^2+k$, which exposes the turning point and the equation's square structure.
      notation: '$a(x-h)^2+k$'
      examples: ['$x^2+6x+11=(x+3)^2+2$.']
      aliases: [completed-square form]
      media: []
      tags: [vertex-form]
      drills:
      - id: vertex-form-drill
        type: typed
        prompt: Complete the square in $x^2-8x+19=(x-h)^2+k$. Give $(h,k)$.
        answer:
          expected: '(4,3)'
          aliases: ['h=4, k=3']
        explanation: $x^2-8x+19=(x-4)^2+3$.
        tags: [vertex-form]
  - id: roots-methods-and-checks
    title: Roots, Methods, and Verification
    required: true
    content: Solving methods generate roots or candidates; domain restrictions determine which candidates survive.
    entries:
    - id: root
      term: Root
      definition: A value that makes a polynomial zero; for an equation, it must also satisfy the original equation and its domain.
      notation: '$f(r)=0$'
      examples: ['$4$ is the only root of $\sqrt{x+5}=x-1$, although squaring also produces the candidate $-1$.']
      aliases: [zero, solution]
      media: []
      tags: [root]
      drills:
      - id: root-drill
        type: flashcard
        prompt: How is a proposed root verified?
        answer:
          expected: Substitute it into the original equation and check every domain restriction.
        explanation: Transformed equations may admit candidates absent from the original.
        tags: [root]
    - id: zero-product-property
      term: Zero-Product Property
      definition: If a finite product of real or complex factors equals zero, at least one factor equals zero.
      notation: '$uv=0\Rightarrow u=0\text{ or }v=0$'
      examples: ['$(x-5)(x+2)=0$ gives $x=5$ or $x=-2$.']
      aliases: []
      media: []
      tags: [zero-product-property]
      drills:
      - id: zero-product-drill
        type: flashcard
        prompt: Why must the equation equal zero before factored form can be used directly?
        answer:
          expected: The zero-product property applies to a product equal to zero.
        explanation: A product equal to a nonzero number does not force either factor to that number or to zero.
        tags: [zero-product-property]
    - id: completing-the-square
      term: Completing the Square
      definition: Rewriting a quadratic expression by adding and subtracting the square of half the linear coefficient after normalizing the $x^2$ coefficient.
      notation: '$x^2+px=(x+p/2)^2-(p/2)^2$'
      examples: ['$x^2+2x-7=(x+1)^2-8$.']
      aliases: []
      media: []
      tags: [completing-square]
      drills:
      - id: completing-square-drill
        type: typed
        prompt: What number completes the square in $x^2+10x+\_\_$?
        answer:
          expected: '25'
        explanation: Square half of 10.
        tags: [completing-square]
    - id: quadratic-formula
      term: Quadratic Formula
      definition: The general root formula obtained by completing the square in $ax^2+bx+c=0$.
      notation: '$x=(-b\pm\sqrt{b^2-4ac})/(2a)$'
      examples: ['$x^2+2x-7=0$ gives $x=-1\pm2\sqrt2$.']
      aliases: []
      media: []
      tags: [quadratic-formula]
      drills:
      - id: quadratic-formula-drill
        type: flashcard
        prompt: Which coefficient appears in the denominator of the quadratic formula?
        answer:
          expected: Twice the leading coefficient, 2a.
        explanation: Dividing by $2a$ is essential; using only 2 changes both roots.
        tags: [quadratic-formula]
    - id: discriminant
      term: Discriminant
      definition: The quantity $b^2-4ac$, whose sign determines the real/complex root pattern and whose square status controls rationality when coefficients are rational.
      notation: '$\Delta=b^2-4ac$'
      examples: ['$x^2+4x+8=0$ has $\Delta=-16$, so its roots are nonreal.']
      aliases: [delta]
      media: []
      tags: [discriminant]
      drills:
      - id: discriminant-drill
        type: typed
        prompt: Find the discriminant of $3x^2-2x+5=0$.
        answer:
          expected: '-56'
        explanation: $(-2)^2-4(3)(5)=4-60=-56$.
        tags: [discriminant]
    - id: repeated-root
      term: Repeated Root
      definition: A root of multiplicity two; for a quadratic it occurs exactly when the discriminant is zero.
      notation: '$a(x-r)^2=0$'
      examples: ['$x^2-6x+9=(x-3)^2$ has repeated root $3$.']
      aliases: [double root]
      media: []
      tags: [repeated-root]
      drills:
      - id: repeated-root-drill
        type: flashcard
        prompt: What equation in the coefficients forces a repeated root?
        answer:
          expected: b squared minus 4ac equals zero.
          aliases: ['$b^2-4ac=0$']
        explanation: The plus/minus branches of the quadratic formula then coincide.
        tags: [repeated-root]
    - id: vieta-relations
      term: Vieta Relations
      definition: For roots $r,s$ of $ax^2+bx+c=0$, the coefficient invariants $r+s=-b/a$ and $rs=c/a$.
      notation: '$r+s=-b/a,\quad rs=c/a$'
      examples: ['Roots of $2x^2-7x+3$ have sum $7/2$ and product $3/2$.']
      aliases: [root-coefficient relations]
      media: []
      tags: [vieta]
      drills:
      - id: vieta-drill
        type: typed
        prompt: If $r,s$ solve $x^2-9x+14=0$, what is $rs$?
        answer:
          expected: '14'
        explanation: For a monic quadratic, the constant term is the product of the roots.
        tags: [vieta]
    - id: quadratic-substitution
      term: Quadratic Substitution
      definition: Replacing a repeated expression by a new variable so the transformed equation has degree two in that variable.
      notation: '$u=g(x)$'
      examples: ['For $x^4-5x^2+4=0$, let $u=x^2$ and solve $u^2-5u+4=0$.']
      aliases: [disguised quadratic]
      media: []
      tags: [quadratic-substitution]
      drills:
      - id: substitution-drill
        type: flashcard
        prompt: What must be done after solving a quadratic in $u=g(x)$?
        answer:
          expected: Solve each surviving equation g(x)=u and enforce the range and domain restrictions on u and x.
        explanation: Roots in the substituted variable are not automatically roots in the original variable.
        tags: [quadratic-substitution]
    - id: extraneous-root
      term: Extraneous Root
      definition: A solution of a transformed equation that fails the original equation, often introduced by squaring or clearing denominators.
      notation: null
      examples: ['$-1$ satisfies the squared equation derived from $\sqrt{x+5}=x-1$ but not the original equation.']
      aliases: [extraneous solution]
      media: []
      tags: [extraneous-root]
      drills:
      - id: extraneous-root-drill
        type: flashcard
        prompt: Which common algebraic operation is not reversible without a sign check?
        answer:
          expected: Squaring both sides.
        explanation: Equal squares permit opposite signs, so the squared equation may have extra roots.
        tags: [extraneous-root]
