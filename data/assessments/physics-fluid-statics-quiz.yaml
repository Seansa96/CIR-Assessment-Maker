questions:
- id: q001
  type: numericResponse
  prompt: |
    Calculate the absolute pressure at the bottom of a $10 \text{ m}$ deep swimming pool.
    Use $\rho_{water} = 1000 \text{ kg/m}^3$, $g = 9.8 \text{ m/s}^2$, and assume atmospheric pressure at the surface is $1.01 \times 10^5 \text{ Pa}$.
    Enter your answer in Pascals.
  answer:
    value: 199000
    tolerance: 500
  explanation: |
    Solution:
    $P = P_0 + \rho g h$
    $P = 1.01 \times 10^5 + (1000)(9.8)(10)$
    $P = 101000 + 98000 = 199000 \text{ Pa}$.
    
    Why it works:
    The absolute pressure at the bottom is the sum of the atmospheric pressure pushing down on the surface plus the hydrostatic pressure exerted by the weight of the $10 \text{ m}$ column of water.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: |
    A U-shaped tube contains water ($\rho = 1000 \text{ kg/m}^3$) and an unknown oil that do not mix. Both ends of the tube are open to the atmosphere. The oil rests on top of the water in the right arm.
    How can you determine the density of the unknown oil?
  choices:
  - id: a
    text: 'By measuring the total volume of oil and water in the tube.'
  - id: b
    text: 'By equating the gauge pressure at the bottom of the U-tube and measuring the maximum heights of the liquids.'
  - id: c
    text: 'By identifying the horizontal interface where oil meets water, and setting the hydrostatic pressures equal at that same horizontal level in both arms.'
  answer:
    choiceId: c
  explanation: |
    Solution:
    By identifying the horizontal interface where oil meets water, and setting the hydrostatic pressures equal at that same horizontal level in both arms.
    
    Why it works:
    In a continuous, static body of a single fluid (like the water filling the bottom of the U-tube), the pressure must be identical at any two points at the exact same horizontal level. By balancing the equations $\rho_{water} g h_{water} = \rho_{oil} g h_{oil}$ at the interface height, you can solve for the unknown density.
    
    Why the other choices fail:
    Equating pressures at the very bottom works, but it's mathematically more cumbersome than just using the interface level as the $h=0$ reference point. Total volume does not provide enough information without mass.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
