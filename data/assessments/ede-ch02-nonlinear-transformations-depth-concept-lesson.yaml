lesson:
  introduction: A useful substitution is justified by equation structure and must be checked for lost solutions
    and domain restrictions.
  sections:
  - id: s1
    title: Variation-of-parameters motif
    required: true
    content: Writing $y=u y_1$ lets a known related solution absorb part of the equation. In nonlinear problems,
      the remaining equation for $u$ may become separable.
    media: []
    check:
      id: q001
      type: multipleChoice
      prompt: What is the purpose of writing $y=u y_1$?
      skills:
      - ede-ch02-first-order-equations-nonlinear-transformations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-nonlinear-transformations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The known factor is chosen so terms cancel or combine into a separable form.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Use known structure to obtain a simpler equation for $u$
      - id: b
        text: Assume every solution is constant
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Remove all initial conditions
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Change the independent variable into a parameter
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Bernoulli equations
    required: true
    content: For $y'+p(x)y=q(x)y^n$ with $n\ne0,1$, the substitution $v=y^{1-n}$ produces a linear equation in $v$
      on branches where the transformation is defined.
    media:
    - type: image
      src: /media/ede/ch02-nonlinear-transformation-map.svg
      alt: Decision map for Bernoulli, homogeneous nonlinear, translated-homogeneous, and Riccati substitutions.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q002
      type: multipleChoice
      prompt: Which substitution applies to $y'+p(x)y=q(x)y^4$?
      skills:
      - ede-ch02-first-order-equations-nonlinear-transformations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-nonlinear-transformations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Bernoulli uses $v=y^{1-n}=y^{-3}$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $v=y^{-3}$
      - id: b
        text: $v=y/x$
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $v=y^4$
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $v=x/y$
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Homogeneous nonlinear equations
    required: true
    content: An equation $y'=q(y/x)$ becomes separable with $y=ux$, so $y'=u+xu'$. This meaning of homogeneous differs
      from homogeneous linear equations.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: After $y=ux$, what is $y'$?
      skills:
      - ede-ch02-first-order-equations-nonlinear-transformations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-nonlinear-transformations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Differentiate the product of two functions of $x$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $u+xu'$
      - id: b
        text: $xu'$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $u'$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $u/x$
        issueSignals:
        - id: ede-readiness-rule-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Constant-ratio solutions
    required: true
    content: Before dividing by $q(u)-u$, solve $q(u)=u$. Each root gives a constant $u$ and therefore a straight-line
      solution $y=ux$ that separation may otherwise lose.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: For $q(u)=u^2$, which constant-ratio solutions arise?
      skills:
      - ede-ch02-first-order-equations-nonlinear-transformations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-nonlinear-transformations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $u^2=u$ gives $u=0,1$ and hence $y=ux$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y=0$ and $y=x$
      - id: b
        text: $y=1$ only
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y=x^2$ only
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: No straight lines
        issueSignals:
        - id: ede-transformed-solution-lost
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: Domain and translated-homogeneous forms
    required: true
    content: Because $y/x$ requires $x\ne0$, solutions are considered on intervals on one side of zero. Some ratios
      of affine linear forms become homogeneous after translating $x=X+x_0$, $y=Y+y_0$ to their common intersection.
    media: []
    check:
      id: q005
      type: multipleChoice
      prompt: Why must a $y/x$ substitution track the interval?
      skills:
      - ede-ch02-first-order-equations-nonlinear-transformations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-nonlinear-transformations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The substitution itself imposes $x\ne0$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The ratio and transformed equation are undefined at $x=0$
      - id: b
        text: Every solution is periodic
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: The exponent must be an integer
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Partial derivatives are required
        issueSignals:
        - id: ede-validity-interval-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Known-solution Riccati reduction
    required: true
    content: For $y'=P+Qy+Ry^2$, subtracting a known particular solution $y_1$ by $z=y-y_1$ cancels the constant
      residual and produces a Bernoulli equation for $z$.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: Given a known Riccati solution $y_1$, which substitution begins the reduction?
      skills:
      - ede-ch02-first-order-equations-nonlinear-transformations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-nonlinear-transformations
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Subtracting the known solution removes the terms it already satisfies.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $z=y-y_1$
      - id: b
        text: $z=y/y'$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $z=x-y$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $z=e^y$
        issueSignals:
        - id: ede-method-selection-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
