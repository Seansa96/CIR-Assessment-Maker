workedExamples:
  - id: radium-alpha-decay
    title: Complete an alpha-decay equation
    problem: 'Radium-226 undergoes alpha decay: $^{226}_{88}Ra\rightarrow ?+{}^4_2He$. Determine the daughter nuclide and verify both conserved nuclear numbers.'
    steps:
      - id: e1s1
        title: Conserve mass number
        instruction: 'Set the parent mass number equal to the sum of product mass numbers.'
        type: numericResponse
        prompt: 'What is the daughter mass number $A$?'
        answer: { value: 222, tolerance: 0 }
        explanation: 'Solution: $A=226-4=222$. Why it works: Mass number counts nucleons, and the parent total must equal the sum for the daughter and alpha particle.'
        media: [{ type: image, src: /media/chemistry/nuclear-decay-daughter-map.svg, alt: Coordinate map showing how alpha, beta-minus, positron, and gamma decay change mass and atomic numbers., caption: Alpha decay moves four units lower in mass number and two units lower in atomic number. }]
      - id: e1s2
        title: Conserve atomic number
        instruction: 'Set the parent atomic number equal to the sum of product atomic numbers.'
        type: numericResponse
        prompt: 'What is the daughter atomic number $Z$?'
        answer: { value: 86, tolerance: 0 }
        explanation: 'Solution: $Z=88-2=86$. Why it works: Nuclear charge is conserved, so the daughter supplies the atomic-number difference after the alpha particle carries away two protons.'
      - id: e1s3
        title: Identify and verify the daughter
        instruction: 'Use the periodic table to identify element 86, then audit both sides of the equation.'
        type: freeResponse
        prompt: 'Write the completed nuclear equation and show the two conservation checks.'
        answer:
          gradingMode: selfCheck
          keyPoints:
            - '$^{226}_{88}Ra\rightarrow{}^{222}_{86}Rn+{}^4_2He$'
            - 'Mass-number check: $226=222+4$.'
            - 'Atomic-number check: $88=86+2$.'
        explanation: 'Solution: $^{226}_{88}Ra\rightarrow{}^{222}_{86}Rn+{}^4_2He$, with $226=222+4$ and $88=86+2$. Why it works: Element 86 is radon, and the independent mass-number and atomic-number sums both balance.'
  - id: tracer-half-life
    title: Connect decay constant, half-life, and remaining mass
    problem: 'A radioactive tracer begins with $24.0\ \mathrm{mg}$ and has first-order decay constant $k=0.08664\ \mathrm{day^{-1}}$. Find its half-life and the mass remaining after 24.0 days.'
    steps:
      - id: e2s1
        title: Convert decay constant to half-life
        instruction: 'For first-order radioactive decay, use $t_{1/2}=\ln 2/k$.'
        type: numericResponse
        prompt: 'Calculate the half-life in days.'
        answer: { value: 8.00, tolerance: 0.02 }
        explanation: 'Solution: $t_{1/2}=0.693147/0.08664=8.0003\ \mathrm{days}\approx8.00\ \mathrm{days}$. Why it works: A first-order decay constant fixes the time required for the amount to fall by one-half.'
      - id: e2s2
        title: Count elapsed half-lives
        instruction: 'Divide elapsed time by the half-life before applying the repeated-halving model.'
        type: numericResponse
        prompt: 'How many half-lives elapse during 24.0 days?'
        answer: { value: 3.00, tolerance: 0.01 }
        explanation: 'Solution: $n=24.0/8.00=3.00$ half-lives. Why it works: The elapsed time contains three equal half-life intervals.'
      - id: e2s3
        title: Apply repeated halving
        instruction: 'Use $m=m_0(1/2)^n$ with the half-life count from the previous step.'
        type: numericResponse
        prompt: 'Calculate the remaining tracer mass in milligrams.'
        answer: { value: 3.00, tolerance: 0.02 }
        explanation: 'Solution: $m=(24.0)(1/2)^3=3.00\ \mathrm{mg}$. Why it works: Three successive halvings change 24.0 to 12.0, then 6.00, then 3.00 mg.'
  - id: helium-binding-energy
    title: Calculate mass defect and binding energy
    problem: 'A helium-4 nucleus contains two protons and two neutrons. Use $m_p=1.007276\ \mathrm{u}$, $m_n=1.008665\ \mathrm{u}$, measured nuclear mass $m_{He}=4.001506\ \mathrm{u}$, and $1\ \mathrm{u}c^2=931.5\ \mathrm{MeV}$.'
    steps:
      - id: e3s1
        title: Inventory separated nucleons
        instruction: 'Add the masses of two free protons and two free neutrons.'
        type: numericResponse
        prompt: 'Calculate the total separated-nucleon mass in atomic mass units.'
        answer: { value: 4.031882, tolerance: 0.000002 }
        explanation: 'Solution: $m_{separated}=2(1.007276)+2(1.008665)=4.031882\ \mathrm{u}$. Why it works: The constituent inventory contains exactly two particles of each supplied mass.'
      - id: e3s2
        title: Find the positive mass defect
        instruction: 'Subtract the measured bound-nucleus mass from the separated-nucleon mass.'
        type: numericResponse
        prompt: 'Calculate the mass defect $\Delta m$ in atomic mass units.'
        answer: { value: 0.030376, tolerance: 0.000002 }
        explanation: 'Solution: $\Delta m=4.031882-4.001506=0.030376\ \mathrm{u}$. Why it works: A bound nucleus has less mass than its separated constituents; the positive difference corresponds to released binding energy.'
      - id: e3s3
        title: Convert mass defect to binding energy
        instruction: 'Multiply the mass defect by the supplied energy equivalent per atomic mass unit.'
        type: numericResponse
        prompt: 'Calculate the total binding energy in MeV.'
        answer: { value: 28.30, tolerance: 0.03 }
        explanation: 'Solution: $E=(0.030376\ \mathrm{u})(931.5\ \mathrm{MeV/u})=28.295\ \mathrm{MeV}\approx28.30\ \mathrm{MeV}$. Why it works: $E=\Delta mc^2$ converts the missing mass into the energy required to separate the nucleus.'
