workedExamples:
- id: we01
  title: Linear IVP and limiting value
  problem: Solve $Q'+2Q=6$ with $Q(0)=1$ and interpret the long-term value.
  steps:
  - id: we1-s1
    title: Recognize standard form
    instruction: Identify $p(x)$ and $q(x)$ before integrating.
    type: freeResponse
    prompt: State the equation class and integrating factor.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - linear
      - mu=e^(2x)
    explanation: |-
      Solution: The equation is linear with $p=2$, so $\mu=e^{\int2dx}=e^{2x}$.

      Why it works: The coefficient of $Q$ in normalized standard form determines the integrating factor.
    media: []
  - id: we1-s2
    title: Integrate the product derivative
    instruction: Multiply, integrate, and apply the initial condition.
    type: freeResponse
    prompt: Carry out the solution calculation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - product derivative
      - integrates
      - C=-2
    explanation: |-
      Solution: $(e^{2x}Q)'=6e^{2x}$, so $e^{2x}Q=3e^{2x}+C$. Thus $Q=3+Ce^{-2x}$; $Q(0)=1$ gives $C=-2$.

      Why it works: Multiplication by the integrating factor makes the left side one derivative.
    media: []
  - id: we1-s3
    title: Verify and interpret
    instruction: Differentiate and examine the decaying term.
    type: freeResponse
    prompt: Verify the IVP and state the limiting value.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - checks ODE
      - checks IC
      - limit 3
    explanation: "Solution: $Q=3-2e^{-2x}$ gives $Q'=4e^{-2x}$ and $Q'+2Q=6$; also $Q(0)=1$. Since $e^{-2x}\to0$,\
      \ $Q\to3$.\n\nWhy it works: Substitution verifies the solution, and the complementary term vanishes for large\
      \ $x$."
    media: []
- id: we02
  title: Separable IVP
  problem: Solve $y'=xy$ with $y(0)=3$ and check the initial condition.
  steps:
  - id: we2-s1
    title: Retain equilibria and separate
    instruction: Check the divided factor, then separate variables.
    type: freeResponse
    prompt: Identify any equilibrium and write the separated equation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - equilibrium y=0
      - separated equation
    explanation: |-
      Solution: $y=0$ is an equilibrium. For nonzero solutions, $dy/y=x\,dx$.

      Why it works: Division by $y$ is valid only after the zero solution is recorded.
    media: []
  - id: we2-s2
    title: Integrate and apply data
    instruction: Integrate both sides and solve for the constant.
    type: freeResponse
    prompt: Find the solution satisfying $y(0)=3$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - integrates
      - exponentiates
      - A=3
    explanation: |-
      Solution: $\ln|y|=x^2/2+C$, so $y=Ae^{x^2/2}$. The initial value gives $A=3$.

      Why it works: The sign is absorbed into the nonzero constant, which the initial value fixes.
    media: []
  - id: we2-s3
    title: Verify
    instruction: Differentiate and substitute the initial input.
    type: freeResponse
    prompt: Verify the final solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - derivative
      - ODE check
      - IC check
    explanation: |-
      Solution: For $y=3e^{x^2/2}$, $y'=3xe^{x^2/2}=xy$, and $y(0)=3$.

      Why it works: Both the differential equation and initial condition hold for all real $x$.
    media: []
- id: we03
  title: Exact equation and potential
  problem: 'Solve $(2xy+3)\,dx+(x^2+4y)\,dy=0$ by testing exactness and building a potential.'
  steps:
  - id: we3-s1
    title: Test exactness
    instruction: Compute the cross partial derivatives.
    type: freeResponse
    prompt: Determine whether the equation is exact.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - identifies M,N
      - cross partials equal
    explanation: |-
      Solution: With $M=2xy+3$ and $N=x^2+4y$, $M_y=2x=N_x$, so the equation is exact.

      Why it works: Equality of the cross partials is the exactness condition on the region.
    media: []
  - id: we3-s2
    title: Construct the potential
    instruction: Integrate one component and recover the missing term.
    type: freeResponse
    prompt: 'Find a potential $\Phi(x,y)$.'
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - integrates M
      - includes g(y)
      - finds g
    explanation: |-
      Solution: Integrating $M$ in $x$ gives $\Phi=x^2y+3x+g(y)$. Then $\Phi_y=x^2+g'(y)=N$, so $g'(y)=4y$ and $g=2y^2$.

      Why it works: The unknown function accounts for terms lost during partial integration.
    media: []
  - id: we3-s3
    title: State and verify the solution
    instruction: Write a level curve and compare both partials.
    type: freeResponse
    prompt: Give the implicit solution and verify it.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - implicit solution
      - both partial checks
    explanation: |-
      Solution: $x^2y+3x+2y^2=C$. Its $x$ derivative is $2xy+3=M$ and its $y$ derivative is $x^2+4y=N$.

      Why it works: A potential's level curves solve the exact differential equation.
    media: []
