glossary:
  introduction: Retrieve the relation and condition attached to each core energy-and-momentum term.
  sections:
  - id: review-terms
    title: Energy and momentum synthesis terms
    required: true
    content: Use units and system conditions to avoid confusing these related quantities.
    entries:
    - id: net-work
      term: Net work
      definition: The sum of work by all forces on an object.
      notation: $W_{net}=\Delta K$
      examples:
      - Positive net work increases kinetic energy.
      aliases: []
      media: []
      tags:
      - energy
      drills:
      - id: work-drill
        type: cloze
        prompt: Net work equals the change in ____ energy.
        answer:
          expected: kinetic
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The word is "kinetic."\n\nWhy it works: This is the work-energy theorem.'
        tags:
        - energy
        skills: []
        choices: []
    - id: mechanical-energy
      term: Mechanical energy
      definition: The sum of kinetic and potential energy.
      notation: $E_{mech}=K+U$
      examples:
      - It is conserved when only conservative forces do work.
      aliases: []
      media: []
      tags:
      - energy
      drills:
      - id: mechanical-drill
        type: cloze
        prompt: Mechanical energy is $K+____$.
        answer:
          expected: U
          expectedLatex: U
          aliases:
          - potential energy
          media: []
          choiceId: 
        explanation: 'Solution: Insert $U$.\n\nWhy it works: Mechanical energy combines kinetic and potential energy.'
        tags:
        - energy
        skills: []
        choices: []
    - id: impulse
      term: Impulse
      definition: Net force integrated over time
      notation: $\vec J=\Delta\vec p$
      examples:
      - Catching a ball over longer time reduces average force.
      aliases: []
      media: []
      tags:
      - momentum
      drills:
      - id: impulse-drill
        type: cloze
        prompt: Impulse equals change in ____.
        answer:
          expected: momentum
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: It equals momentum change.\n\nWhy it works: $\vec J=\Delta\vec p$.'
        tags:
        - momentum
        skills: []
        choices: []
    - id: closed-system
      term: Closed system for momentum
      definition: A system with negligible net external impulse during the interaction.
      notation: $\Delta\vec P=\vec0$
      examples:
      - Two colliding carts on a low-friction track.
      aliases: []
      media: []
      tags:
      - system
      drills:
      - id: closed-drill
        type: cloze
        prompt: Momentum is conserved when net ____ impulse is zero.
        answer:
          expected: external
          expectedLatex: ''
          aliases: []
          media: []
          choiceId: 
        explanation: 'Solution: The word is "external."\n\nWhy it works: Internal forces cancel for the complete system.'
        tags:
        - system
        skills: []
        choices: []
