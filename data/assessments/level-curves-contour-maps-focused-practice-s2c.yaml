- type: multipleChoice
  prompt: Which point has the higher temperature?
  choices:
  - id: a
    text: A, because its contour label is larger.
  - id: b
    text: B, because outer contours are always warmer.
    issueSignals:
    - id: contour-direction-error
  - id: c
    text: They have equal temperatures.
    issueSignals:
    - id: contour-label-misread
  - id: d
    text: The map gives no information about the values.
    issueSignals:
    - id: contour-label-misread
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is A, because its contour label is larger..


    Why it works: mistaking a contour map for an unlabeled drawing


    Why the other choices fail:


    Choice b: B, because outer contours are always warmer. results from assuming outward movement means increasing
    values.


    Choice c: They have equal temperatures. results from ignoring the distinct contour labels.


    Choice d: The map gives no information about the values. results from mistaking a contour map for an unlabeled
    drawing.'
  issueSignals:
  - id: contour-label-misread
  - id: contour-direction-error
  difficultyDimensions:
