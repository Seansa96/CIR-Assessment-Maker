    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q007
- type: multipleChoice
  prompt: What is the approximate rainfall at P if it lies three-quarters of the way from the 28 contour toward
    the 32 contour?
  choices:
  - id: a
    text: 31 mm.
  - id: b
    text: 29 mm.
    issueSignals:
    - id: contour-interpolation-error
  - id: c
    text: 30 mm.
    issueSignals:
    - id: contour-interpolation-error
  - id: d
    text: 32 mm.
    issueSignals:
    - id: contour-label-misread
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is 31 mm..


    Why it works: rounding to the upper contour


    Why the other choices fail:


    Choice b: 29 mm. results from interpolating one-quarter rather than three-quarters.


    Choice c: 30 mm. results from using the midpoint rather than P’s stated position.


    Choice d: 32 mm. results from rounding to the upper contour.'
  issueSignals:
  - id: contour-label-misread
  - id: contour-interpolation-error
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
    against neighboring levels.
  subjectDifficultyTags:
  - contour-map-interpretation
  media:
  - type: image
    src: /media/calculus-3/contour-quiz-q008.svg
    alt: Original hillside rainfall contour map with values 20, 24, 28, 32, 36 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q008
- type: multipleChoice
  prompt: A and B lie on the same isobar. What is the pressure difference $p(B)-p(A)$?
  choices:
  - id: a
    text: 0 millibars.
  - id: b
    text: 5 millibars.
    issueSignals:
    - id: same-contour-change-error
  - id: c
    text: -5 millibars.
    issueSignals:
    - id: contour-direction-error
  - id: d
    text: 1000 millibars.
    issueSignals:
    - id: change-vs-value-error
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is 0 millibars..


    Why it works: reporting a level value instead of a difference


    Why the other choices fail:


    Choice b: 5 millibars. results from using the spacing between neighboring contours.


    Choice c: -5 millibars. results from reversing a nonzero change.


    Choice d: 1000 millibars. results from reporting a level value instead of a difference.'
  issueSignals:
  - id: change-vs-value-error
  - id: same-contour-change-error
  - id: contour-direction-error
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
    against neighboring levels.
  subjectDifficultyTags:
  - contour-map-interpretation
  media:
  - type: image
    src: /media/calculus-3/contour-quiz-q009.svg
    alt: Original island pressure contour map with values 990, 995, 1000, 1005, 1010 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q009
- type: multipleChoice
  prompt: What does the wide spacing of equal 20-m contours near D indicate about the terrain there?
  choices:
  - id: a
    text: The terrain is gradual there; each 20-m rise takes more map distance.
  - id: b
    text: The terrain is steep there; wide spacing means a larger rate.
    issueSignals:
    - id: steepness-spacing-confusion
  - id: c
    text: The elevation is lower there, so spacing cannot indicate steepness.
    issueSignals:
    - id: value-rate-confusion
  - id: d
    text: The terrain is flat because the contour values differ.
    issueSignals:
    - id: contour-definition-error
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is The terrain is gradual there; each 20-m rise takes more map
    distance..


    Why it works: assuming distinct contours imply a flat surface


    Why the other choices fail:


    Choice b: The terrain is steep there; wide spacing means a larger rate. results from reversing the spacing-rate
    relationship.


    Choice c: The elevation is lower there, so spacing cannot indicate steepness. results from confusing absolute
    level with rate.


    Choice d: The terrain is flat because the contour values differ. results from assuming distinct contours
    imply a flat surface.'
  issueSignals:
  - id: contour-definition-error
  - id: value-rate-confusion
  - id: steepness-spacing-confusion
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
