questions:
- type: multipleChoice
  prompt: Point P lies halfway between the 120 and 140 contours. Estimate the elevation.
  choices:
  - id: a
    text: $130$ m
  - id: b
    text: $120$ m
    issueSignals:
    - id: contour-interpolation-error
  - id: c
    text: $140$ m
    issueSignals:
    - id: contour-label-misread
  - id: d
    text: $150$ m
    issueSignals:
    - id: contour-interpolation-error
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is $130$ m.


    Why it works: moving beyond the interval


    Why the other choices fail:


    Choice b: $120$ m results from using the lower value only.


    Choice c: $140$ m results from using the upper value only.


    Choice d: $150$ m results from moving beyond the interval.'
  issueSignals:
  - id: contour-label-misread
  - id: contour-interpolation-error
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
    against neighboring levels.
  subjectDifficultyTags:
  - contour-map-interpretation
  media:
  - type: image
    src: /media/calculus-3/contour-quiz-q001.svg
    alt: Original cedar ridge elevation contour map with values 100, 120, 140, 160 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q001
- type: multipleChoice
  prompt: Points A and B lie on the same labeled curve. Which conclusion is justified?
  choices:
  - id: a
    text: They have the same temperature, 20°.
  - id: b
    text: B is 10° warmer than A.
    issueSignals:
    - id: contour-label-misread
  - id: c
    text: A is 5° warmer than B.
    issueSignals:
    - id: contour-interval-confusion
  - id: d
    text: Their temperatures cannot be compared.
    issueSignals:
    - id: contour-label-misread
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is They have the same temperature, 20°..


    Why it works: assuming the map gives positions but no output labels


    Why the other choices fail:


    Choice b: B is 10° warmer than A. results from reading a separate outer curve instead of the shared curve.


    Choice c: A is 5° warmer than B. results from treating a contour interval as the difference between points
    on one curve.


    Choice d: Their temperatures cannot be compared. results from assuming the map gives positions but no output
    labels.'
  issueSignals:
  - id: contour-label-misread
  - id: contour-interval-confusion
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
    against neighboring levels.
  subjectDifficultyTags:
  - contour-map-interpretation
  media:
  - type: image
    src: /media/calculus-3/contour-quiz-q002.svg
    alt: Original thermal spring temperature contour map with values 10, 15, 20, 25 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q002
- type: multipleChoice
  prompt: Equal 20-m elevation intervals are closest near which marked point, indicating the steeper terrain?
  choices:
  - id: a
    text: P.
  - id: b
    text: Q.
    issueSignals:
    - id: steepness-spacing-confusion
  - id: c
    text: The two locations are equally steep.
    issueSignals:
    - id: steepness-spacing-confusion
  - id: d
    text: The highest contour, regardless of location.
    issueSignals:
    - id: contour-label-misread
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is P..


    Why it works: confusing absolute elevation with slope magnitude


    Why the other choices fail:


    Choice b: Q. results from selecting the wide-spaced region.


    Choice c: The two locations are equally steep. results from ignoring the visibly different spacing.


    Choice d: The highest contour, regardless of location. results from confusing absolute elevation with slope
    magnitude.'
  issueSignals:
  - id: contour-label-misread
  - id: steepness-spacing-confusion
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
    against neighboring levels.
  subjectDifficultyTags:
  - contour-map-interpretation
  media:
  - type: image
    src: /media/calculus-3/contour-quiz-q003.svg
    alt: Original snowfield elevation contour map with values 500, 520, 540, 560, 580 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q003
- type: multipleChoice
  prompt: Moving from S on the 4° contour to T on the 16° contour, what is the net temperature change?
  choices:
  - id: a
    text: An increase of 12°.
  - id: b
    text: A decrease of 12°.
    issueSignals:
    - id: contour-direction-error
  - id: c
    text: No change.
    issueSignals:
    - id: contour-path-confusion
  - id: d
    text: An increase of 20°.
    issueSignals:
    - id: contour-arithmetic-error
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is An increase of 12°..


    Why it works: adding the endpoint values


    Why the other choices fail:


    Choice b: A decrease of 12°. results from reversing final minus initial.


    Choice c: No change. results from confusing a crossing path with travel on one contour.


    Choice d: An increase of 20°. results from adding the endpoint values.'
  issueSignals:
  - id: contour-arithmetic-error
  - id: contour-path-confusion
  - id: contour-direction-error
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
    against neighboring levels.
  subjectDifficultyTags:
  - contour-map-interpretation
  media:
  - type: image
    src: /media/calculus-3/contour-quiz-q004.svg
    alt: Original coastal air temperature contour map with values 4, 8, 12, 16, 20 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q004
- type: multipleChoice
  prompt: At point P on the curve labeled 1300, which level-set equation is correct for elevation E?
  choices:
  - id: a
    text: $E(x,y)=1300$.
  - id: b
    text: $x=1300$.
    issueSignals:
    - id: level-set-notation-error
  - id: c
    text: $y=1300$.
    issueSignals:
    - id: level-set-notation-error
  - id: d
    text: $E(1300,y)=x$.
    issueSignals:
    - id: level-set-notation-error
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is $E(x,y)=1300$..


    Why it works: swapping the input and output roles


    Why the other choices fail:


    Choice b: $x=1300$. results from using the output label as an input coordinate.


    Choice c: $y=1300$. results from using the output label as the other input coordinate.


    Choice d: $E(1300,y)=x$. results from swapping the input and output roles.'
  issueSignals:
  - id: level-set-notation-error
  difficultyDimensions:
  - representationTransfer
  - estimationOrBounds
  difficultyEvidence: Read the labeled contour geometry, identify the requested quantity, and verify the interpretation
    against neighboring levels.
  subjectDifficultyTags:
  - contour-map-interpretation
  media:
  - type: image
    src: /media/calculus-3/contour-quiz-q005.svg
    alt: Original glacier surface height contour map with values 1200, 1250, 1300, 1350 and marked locations.
    caption: Read the contour labels, point positions, and local spacing to answer.
  id: q005
- type: multipleChoice
  prompt: At R between the 50-m and 60-m contours, which direction leads toward increasing elevation?
  choices:
  - id: a
    text: Toward the center, where the labels rise to 70 and 80.
  - id: b
    text: Away from the center, where labels fall toward 40.
    issueSignals:
    - id: contour-direction-error
  - id: c
    text: Along the contour through R.
    issueSignals:
    - id: contour-path-confusion
  - id: d
    text: Toward the lower-left corner regardless of labels.
    issueSignals:
    - id: contour-label-misread
  answer:
    choiceId: a
  explanation: 'Solution: The correct choice is Toward the center, where the labels rise to 70 and 80..


    Why it works: using map orientation instead of contour values


    Why the other choices fail:


    Choice b: Away from the center, where labels fall toward 40. results from following decreasing values.


    Choice c: Along the contour through R. results from moving without crossing to a new contour.


    Choice d: Toward the lower-left corner regardless of labels. results from using map orientation instead
    of contour values.'
  issueSignals:
  - id: contour-label-misread
  - id: contour-path-confusion
  - id: contour-direction-error
