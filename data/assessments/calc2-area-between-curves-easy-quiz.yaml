- id: q001
  type: freeResponse
  prompt: A spring has natural length 3 m. A force of 30 N stretches it by 1 m. Find
    the work done stretching it 3 m.
  answer:
    gradingMode: selfCheck
    checkModel: 135 J
  explanation: Find the spring constant k, then integrate kx from 0 to a.
- id: q002
  type: freeResponse
  prompt: Find the volume obtained by rotating y = 2x^2 from x=0 to x=1 about the
    y-axis.
  answer:
    gradingMode: selfCheck
    checkModel: pi
  explanation: Use the method of cylindrical shells.
- id: q003
  type: freeResponse
  prompt: Find the arc length of y = (2/3)1x^{3/2} from x=0 to x=3.
  answer:
    gradingMode: selfCheck
    checkModel: Evaluate integral of sqrt(1 + (y')^2).
  explanation: Apply the arc length formula.
