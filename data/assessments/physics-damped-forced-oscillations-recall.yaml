# REVIEW_NOTE: Merged from physics-damped-oscillations and physics-forced-oscillations stubs.
items:
- {id: damp-r1, type: cloze, prompt: 'Linear viscous damping is modeled by $F_\text{damp}={{-bv}}$.', answer: {expected: '-bv'}, explanation: 'Solution: Write $F_\text{damp}=-bv$. Why it works: the negative sign makes the force oppose velocity.'}
- {id: damp-r2, type: typed, prompt: 'What damping regime still oscillates while its amplitude decreases?', answer: {expected: underdamped}, explanation: 'Solution: Identify underdamped motion. Why it works: damping is present but insufficient to prevent repeated equilibrium crossings.'}
- {id: damp-r3, type: cloze, prompt: 'Critical damping occurs when $b={{2\sqrt{mk}}}$.', answer: {expected: '2\sqrt{mk}'}, explanation: 'Solution: Use $b_c=2\sqrt{mk}$. Why it works: this makes the characteristic-equation discriminant zero.'}
- {id: damp-r4, type: typed, prompt: 'What is the SI unit of $b$ in $F=-bv$?', answer: {expected: 'kg/s'}, explanation: 'Solution: $b$ has units $\text{kg/s}$. Why it works: multiplying by velocity gives a newton.'}
- {id: damp-r5, type: cloze, prompt: 'The amplitude in an underdamped oscillator decreases {{exponentially}}.', answer: {expected: exponentially}, explanation: 'Solution: Identify exponential decay. Why it works: the amplitude contains an exponential factor in time.'}
- {id: damp-r6, type: typed, prompt: 'Which regime returns to equilibrium without oscillating and as rapidly as possible?', answer: {expected: critical damping}, explanation: 'Solution: Identify critical damping. Why it works: it is the boundary between underdamped and overdamped response.'}
- {id: forced-r1, type: cloze, prompt: 'A periodic external force produces a {{forced}} oscillation.', answer: {expected: forced}, explanation: 'Solution: Identify forced oscillation. Why it works: the system is driven at the frequency of the external agent.'}
- {id: forced-r2, type: typed, prompt: 'Near what frequency does resonance occur in a lightly damped system?', answer: {expected: natural frequency}, explanation: 'Solution: Near the natural frequency $\omega_0$. Why it works: at that frequency the driving force is always in phase with velocity.'}
- {id: forced-r3, type: cloze, prompt: 'At resonance, the driving-force frequency approximately equals the {{natural frequency}}.', answer: {expected: natural frequency}, explanation: 'Solution: Identify the natural frequency. Why it works: energy transfer is maximized when the driving frequency matches the free-oscillation rate.'}
- {id: forced-r4, type: typed, prompt: 'What happens to steady-state amplitude as damping decreases and driving frequency approaches resonance?', answer: {expected: amplitude increases (diverges for zero damping)}, explanation: 'Solution: Amplitude grows. Why it works: with less energy loss per cycle the system can store more mechanical energy.'}
