- id: q001
  type: multipleChoice
  prompt: For rotation about the y-axis, which strips naturally form shells?
  choices:
  - id: a
    text: vertical strips with dx
    media: []
    issueSignals: []
  - id: b
    text: horizontal strips with dy
    media: []
    issueSignals: []
  - id: c
    text: perpendicular strips only
    media: []
    issueSignals: []
  - id: d
    text: no strips
    media: []
    issueSignals: []
  answer:
    choiceId: a
    choiceIds: []
    expected: 
    gradingMode: 
    expectedLatex: 
    equivalenceMode: 
    variables: []
