questions:
  - { id: q001, type: multipleChoice, prompt: 'For rotation about the y-axis, which strips naturally form shells?', media: [{ type: image, src: /media/calculus/cylindrical-shell-model.svg, alt: Vertical strip parallel to y-axis forming a shell }], choices: [{ id: a, text: vertical strips with dx }, { id: b, text: horizontal strips with dy }, { id: c, text: perpendicular strips only }, { id: d, text: no strips }], answer: { choiceId: a }, explanation: 'Solution: Use vertical strips with dx. Why it works: They are parallel to the vertical axis and roll into shells. Common trap: Perpendicular strips form washers. Why the other choices fail: b is parallel to a horizontal axis; c names the disk/washer orientation; d omits the model.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: Links axis direction to a parallel strip and the shell model. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q002, type: multipleChoice, prompt: 'A vertical strip at x rotates about the y-axis. What is its radius when x≥0?', choices: [{ id: a, text: x }, { id: b, text: y }, { id: c, text: '$2\pi x$' }, { id: d, text: '$\pi x^2$' }], answer: { choiceId: a }, explanation: 'Solution: The radius is x. Why it works: x is the horizontal distance to the y-axis. Common trap: $2\pi x$ is circumference, not radius. Why the other choices fail: b is a vertical coordinate; c and d are derived geometry factors.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Distinguishes axis distance from circumference and area. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q003, type: multipleChoice, prompt: 'Between y=f(x) and y=g(x), with f above g, what is the shell height?', choices: [{ id: a, text: '$f(x)-g(x)$' }, { id: b, text: x }, { id: c, text: '$2\pi x$' }, { id: d, text: '$f(x)g(x)$' }], answer: { choiceId: a }, explanation: 'Solution: Height is top minus bottom, $f(x)-g(x)$. Why it works: It is the vertical length of the strip. Common trap: Radius and circumference are separate factors. Why the other choices fail: b is radius only for y-axis rotation; c is circumference; d is not a length.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: Converts boundary labels into the strip-length factor. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q004, type: multipleChoice, prompt: 'What is the circumference of a shell with radius r?', choices: [{ id: a, text: '$2\pi r$' }, { id: b, text: '$\pi r^2$' }, { id: c, text: r }, { id: d, text: '$2r$' }], answer: { choiceId: a }, explanation: 'Solution: Circumference is $2\pi r$. Why it works: Each shell wraps around a circle of radius r. Common trap: $\pi r^2$ is circular area. Why the other choices fail: c is radius; d is diameter.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Applies the circle relation to the shell's circular path. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q005, type: multipleChoice, prompt: 'Which integral is the shell volume under y=4-x on [0,4] about the y-axis?', choices: [{ id: a, text: '$2\pi\int_0^4x(4-x)dx$' }, { id: b, text: '$\pi\int_0^4(4-x)^2dx$' }, { id: c, text: '$\int_0^4x(4-x)dx$' }, { id: d, text: '$2\pi\int_0^4(4-x)dx$' }], answer: { choiceId: a }, explanation: 'Solution: $V=2\pi\int_0^4x(4-x)dx$. Why it works: Radius is x, height is 4-x, and dx is thickness. Common trap: Do not omit circumference. Why the other choices fail: b is a disk-style expression; c lacks 2π; d omits radius.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: Assembles the complete shell product from a region and axis. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q006, type: multipleChoice, prompt: 'For rotation about x=5, the radius of a vertical strip at x=2 is', choices: [{ id: a, text: 3 }, { id: b, text: 2 }, { id: c, text: 5 }, { id: d, text: 7 }], answer: { choiceId: a }, explanation: 'Solution: Radius is $|2-5|=3$. Why it works: Radius is distance to the offset axis. Common trap: x itself is only distance to x=0. Why the other choices fail: b ignores shift; c is axis coordinate; d adds rather than measures difference.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Computes an offset-axis distance rather than using a raw coordinate. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q007, type: multipleChoice, prompt: 'Evaluate $2\pi\int_0^2x\,dx$.', choices: [{ id: a, text: '$4\pi$' }, { id: b, text: '$2\pi$' }, { id: c, text: '$8\pi$' }, { id: d, text: '$\pi$' }], answer: { choiceId: a }, explanation: 'Solution: $2\pi[x^2/2]_0^2=2\pi(2)=4\pi$. Why it works: The power rule evaluates the shell integral. Common trap: Keep the outside factor 2π. Why the other choices fail: b, c, and d misapply the power rule or constant.', difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: Evaluates a routine shell integral after factoring a constant. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q008, type: multipleChoice, prompt: 'What units must a shell-method volume have when lengths are in meters?', choices: [{ id: a, text: cubic meters }, { id: b, text: square meters }, { id: c, text: meters }, { id: d, text: meters per second }], answer: { choiceId: a }, explanation: 'Solution: Volume has cubic meters. Why it works: Circumference, height, and thickness are each lengths. Common trap: Square units omit thickness. Why the other choices fail: b is area; c is length; d is a rate.', difficultyDimensions: [representationTransfer, errorDiagnosis], difficultyEvidence: Checks the dimensional product of three length factors. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q009, type: multipleChoice, prompt: 'When might a shell setup need a partition?', choices: [{ id: a, text: radius or height changes sign/formula }, { id: b, text: the interval has endpoints }, { id: c, text: a constant 2π appears }, { id: d, text: every shell has thickness }], answer: { choiceId: a }, explanation: 'Solution: Split where radius or height is no longer described by one nonnegative expression. Why it works: Shell geometry uses positive distances and lengths. Common trap: A compact algebraic expression can hide a sign change. Why the other choices fail: b, c, and d occur in every ordinary setup.', difficultyDimensions: [casePartition, errorDiagnosis], difficultyEvidence: Detects a geometric change that invalidates a single shell expression. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
  - { id: q010, type: multipleChoice, prompt: 'Why can shells be preferable for y=f(x) rotated about the y-axis?', choices: [{ id: a, text: vertical strips keep the given x-based boundary functions }, { id: b, text: shells eliminate integration }, { id: c, text: shells always have zero radius }, { id: d, text: shells calculate area only }], answer: { choiceId: a }, explanation: 'Solution: Shells can use the original y=f(x) directly as a height expression. Why it works: Vertical strips are parallel to the y-axis. Common trap: The preferred method is chosen for simpler modeling, not because it avoids work. Why the other choices fail: b, c, and d contradict the shell definition.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Compares representation cost and selects the method that preserves native functions. , issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }, { id: sign-error }, { id: geometric-volume-formula-error }, { id: mathematical-translation-error }, { id: pythagorean-theorem-misapplied }]}
