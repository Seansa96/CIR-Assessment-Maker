  explanation: 'Solution: Height is top minus bottom, $f(x)-g(x)$. Why it works: It is the vertical length of the strip. Common trap: Radius and circumference are separate factors. Why the other choices fail: b is radius only for y-axis rotation; c is circumference; d is not a length.'
