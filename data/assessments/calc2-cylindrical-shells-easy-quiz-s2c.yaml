  explanation: 'Solution: Use vertical strips with dx. Why it works: They are parallel to the vertical axis and roll into shells. Common trap: Perpendicular strips form washers. Why the other choices fail: b is parallel to a horizontal axis; c names the disk/washer orientation; d omits the model.'
