questions:
- id: q001
  title: Apply I/O path
  type: multipleChoice
  prompt: A system design discussion mentions **I/O path**. Which conclusion is most defensible?
  choices:
  - id: a
    text: User code does not drive hardware directly.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: User code does not drive hardware directly. This is why I/O path matters in Input and Output.
