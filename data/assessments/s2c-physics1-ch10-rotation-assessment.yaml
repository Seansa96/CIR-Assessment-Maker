questions:
  - id: q-s2c-phys1-ch10-moi-discrete-01
    type: numericResponse
    skills:
      - moment-of-inertia-discrete
    prompt: |
      Two point masses, $m_1 = 2.0 \text{ kg}$ and $m_2 = 3.0 \text{ kg}$, are attached to a massless rod. The system rotates about an axis perpendicular to the rod. If $m_1$ is located $0.40 \text{ m}$ from the axis and $m_2$ is located $0.60 \text{ m}$ from the axis, what is the total moment of inertia of the system?
      
      Provide your answer in $\text{kg} \cdot \text{m}^2$.
    answer:
      gradingMode: automatic
      value: 1.40
      tolerance: 0.05
    explanation: |
      The total moment of inertia is the sum of the moments of inertia of the individual point masses:
      $I = \sum m_i r_i^2 = m_1 r_1^2 + m_2 r_2^2$

      Plug in the given values:
      $I = (2.0)(0.40)^2 + (3.0)(0.60)^2$
      $I = (2.0)(0.16) + (3.0)(0.36)$
      $I = 0.32 + 1.08 = 1.40 \text{ kg} \cdot \text{m}^2$

  - id: q-s2c-phys1-ch10-rotational-ke-01
    type: numericResponse
    skills:
      - rotational-kinetic-energy
    prompt: |
      A flywheel has a moment of inertia of $5.0 \text{ kg} \cdot \text{m}^2$. It is rotating at an angular velocity of $120 \text{ rev/min}$. What is the rotational kinetic energy of the flywheel?
      
      Provide your answer in Joules (J). Use $\pi \approx 3.14159$.
    answer:
      gradingMode: automatic
      value: 394.78
      tolerance: 1.0
    explanation: |
      First, convert the angular velocity from rev/min to rad/s:
      $\omega = 120 \text{ rev/min} \times \frac{2\pi \text{ rad}}{1 \text{ rev}} \times \frac{1 \text{ min}}{60 \text{ s}}$
      $\omega = 120 \times \frac{2\pi}{60} = 4\pi \approx 12.566 \text{ rad/s}$

      Next, use the formula for rotational kinetic energy:
      $K = \frac{1}{2} I \omega^2$
      $K = \frac{1}{2} (5.0) (4\pi)^2$
      $K = 2.5 \times 16\pi^2$
      $K = 40\pi^2 \approx 394.78 \text{ J}$
