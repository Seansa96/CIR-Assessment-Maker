questions:
- id: q001
  title: Recognize Monolithic kernel
  type: multipleChoice
  prompt: 'Which statement best describes **Monolithic kernel** in operating systems?

    '
  choices:
  - id: a
    text: A monolithic kernel keeps many OS services in one privileged address space for fast internal calls.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'A monolithic kernel keeps many OS services in one privileged address space for fast internal calls. The distractors
    either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q002
  title: Recognize Layered design
  type: multipleChoice
  prompt: 'Which statement best describes **Layered design** in operating systems?

    '
  choices:
  - id: a
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: b
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  - id: c
    text: It removes the need for explicit policies, permissions, or resource-management decisions.
  - id: d
    text: Layering limits which components may depend on which other components, making reasoning easier at the cost of flexibility.
  answer:
    choiceId: d
  explanation: 'Layering limits which components may depend on which other components, making reasoning easier at the cost
    of flexibility. The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
