- id: q004
  title: Explain Client-server model
  type: freeResponse
  prompt: 'In a short answer, explain why **Client-server model** matters in Operating System Structure and Design.

    '
  answer:
    expected: 'OS services can be represented as servers that respond to client requests through message passing. A complete
      answer should also note that the model is about structure, not necessarily network distribution.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Client-server model
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Operating System Structure and Design. The key is to connect the term to what the OS controls
    or protects.

    '
