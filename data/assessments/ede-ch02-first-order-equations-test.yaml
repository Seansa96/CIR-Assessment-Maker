- id: q011
  type: multipleChoice
  prompt: 'An equation is both linear and separable: $y''=-xy$, $y(0)=4$. Which approach is sound?'
  skills:
  - ede-ch02-first-order-equations-linear-ivps
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-linear-ivps
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: Either method is valid if $y=0$ is retained during separation and the IVP is checked.
  - id: b
    text: Only separation is allowed because methods cannot overlap.
    issueSignals:
    - id: ede-method-selection-error
      domains: *id001
  - id: c
    text: Divide by $y$ and declare that no equilibrium exists.
    issueSignals:
    - id: ede-equilibrium-solution-lost
      domains: *id001
  - id: d
    text: Use a Bernoulli substitution because the equation contains a product.
    issueSignals:
    - id: ede-bernoulli-substitution-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Either linear or separable reasoning gives $y=4e^{-x^2/2}$.

    Why it works: Method classes can overlap; correctness depends on preserving solutions and checking the condition.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch03-numerical-methods-euler-updates
- id: q012
  type: multipleChoice
  prompt: For $xy'+y=x^2$, $y(2)=3$, which preparation and interval are correct?
  skills:
  - ede-ch02-first-order-equations-linear-ivps
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-linear-ivps
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: 'Divide by $x$ to get $y''+y/x=x$ and work on $(0,\infty)$.'
  - id: b
    text: Use all real $x$ because the original coefficients are polynomials.
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  - id: c
    text: Treat $x=0$ as an ordinary point after division.
    issueSignals:
    - id: ede-linear-standard-form-error
      domains: *id001
  - id: d
    text: 'Separate as $dy/y=x\,dx$.'
    issueSignals:
    - id: ede-separation-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Normalize on $(0,\infty)$, the maximal coefficient-continuity interval containing $2$.

    Why it works: Dividing by the leading coefficient exposes the singular point that controls the linear theorem and integrating factor.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  prerequisiteObjectiveIds:
  - ede-ch02-first-order-equations-linear-ivps
  extensionObjectiveIds:
  - ede-ch03-numerical-methods-euler-updates
