questions:
- id: q001
  type: symbolicResponse
  prompt: Solve $y'-3y=6$ with $y(0)=-1$.
  skills:
  - ede-ch02-first-order-equations-linear-ivps
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-linear-ivps
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: e^{3x}-2
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: |-
    Solution: A particular solution is $-2$, so $y=Ce^{3x}-2$; the condition gives $C=1$.

    Why it works: Differentiating and substituting gives $6$, and $y(0)=-1$.
- id: q002
  type: selectAll
  prompt: For $y'=x y(y-2)$, select every conclusion that must be retained when separating variables.
  skills:
  - ede-ch02-first-order-equations-separable-equilibria
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-separable-equilibria
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: $y=0$ is a solution.
  - id: b
    text: $y=2$ is a solution.
  - id: c
    text: Dividing by $y(y-2)$ can lose both constant solutions.
  - id: d
    text: Every solution must cross $y=2$.
    issueSignals:
    - id: ede-equilibrium-solution-lost
      domains: &id001
      - elementary-differential-equations-bvp
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: |-
    Solution: Both equilibria must be recorded before division.

    Why it works: They make the divided factor zero while satisfying the original equation.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
- id: q003
  type: multipleChoice
  prompt: 'A separated calculation ends at $y+\ln|y-1|=x+C$. What is the correct status of this result?'
  skills:
  - ede-ch02-first-order-equations-separable-equilibria
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-separable-equilibria
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: It is a valid implicit form where defined, subject to any lost equilibria and initial data.
  - id: b
    text: It is invalid until solved explicitly for $y$.
    issueSignals:
    - id: ede-method-selection-error
      domains: *id001
  - id: c
    text: It is automatically valid at $y=1$.
    issueSignals:
    - id: ede-equilibrium-solution-lost
      domains: *id001
  - id: d
    text: The logarithm imposes no domain restriction.
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: The relation may be retained as an implicit solution on a valid interval.

    Why it works: Implicit solutions need not be algebraically isolated, but domain and division restrictions remain.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q004
  type: selectAll
  prompt: For $y'=x^2+y^2$ near $(0,1)$, which theorem statements are justified?
  skills:
  - ede-ch02-first-order-equations-existence-uniqueness
  media: []
  difficultyDimensions:
  - constraintTracking
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-existence-uniqueness
  difficultyEvidence: Requires checking several statements independently against the differential equation and its
    conditions.
  choices:
  - id: a
    text: $f(x,y)=x^2+y^2$ is continuous near the point.
  - id: b
    text: $f_y=2y$ is continuous near the point.
  - id: c
    text: A unique local solution is guaranteed.
  - id: d
    text: The theorem supplies a closed-form solution.
    issueSignals:
    - id: ede-existence-uniqueness-confusion
      domains: *id001
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: |-
    Solution: Continuity of $f$ and $f_y$ guarantees a unique local solution, not a formula.

    Why it works: The polynomial right side and its $y$ derivative are continuous in every rectangle.

    Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
- id: q005
  type: symbolicResponse
  prompt: Solve the Bernoulli IVP $y'+y=y^2$, $y(0)=1/2$.
  skills:
  - ede-ch02-first-order-equations-nonlinear-transformations
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-nonlinear-transformations
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: 1/(1+e^x)
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: |-
    Solution: With $v=y^{-1}$, $v'-v=-1$, so $v=1+Ce^x$; $v(0)=2$ gives $C=1$.

    Why it works: Taking the reciprocal gives the stated solution, which satisfies both the ODE and initial value.
- id: q006
  type: symbolicResponse
  prompt: Solve $y'=1+y/x$ on $x>0$ using $v=y/x$. Enter the general solution.
  skills:
  - ede-ch02-first-order-equations-nonlinear-transformations
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-nonlinear-transformations
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: x*(ln(x)+C)
    equivalenceMode: expression
    variables:
    - x
    - C
    tolerance: 0.0001
  explanation: |-
    Solution: Since $y=vx$, $y'=v+xv'$, so $xv'=1$ and $v=\ln x+C$; hence $y=x(\ln x+C)$.

    Why it works: Differentiation gives $y'=\ln x+C+1=1+y/x$.
- id: q007
  type: numericResponse
  prompt: For $M=3x^2y+2$ and $N=x^3+4y$, evaluate $M_y-N_x$.
  skills:
  - ede-ch02-first-order-equations-exact-equations
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-exact-equations
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 0
    tolerance: 0
  explanation: |-
    Solution: $M_y=3x^2$ and $N_x=3x^2$, so the difference is $0$.

    Why it works: Equality of the cross partials establishes exactness.
- id: q008
  type: multipleChoice
  prompt: 'A potential satisfies $\Phi_x=3x^2y+2$ and $\Phi_y=x^3+4y$. Which implicit solution follows?'
  skills:
  - ede-ch02-first-order-equations-exact-equations
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-exact-equations
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $x^3y+2x+2y^2=C$
  - id: b
    text: $3x^2y+2+x^3+4y=C$
    issueSignals:
    - id: ede-potential-function-error
      domains: *id001
  - id: c
    text: $x^3y+2x+4y=C$
    issueSignals:
    - id: ede-potential-function-error
      domains: *id001
  - id: d
    text: $x^2y+2x+2y^2=C$
    issueSignals:
    - id: ede-exactness-test-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $x^3y+2x+2y^2=C$.

    Why it works: Its two partial derivatives reproduce the supplied components.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q009
  type: multipleChoice
  prompt: 'For $2y\,dx+x\,dy=0$ on $x>0$, which multiplier makes the equation exact?'
  skills:
  - ede-ch02-first-order-equations-integrating-factors
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-integrating-factors
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $x$
  - id: b
    text: $1/x$
    issueSignals:
    - id: ede-integrating-factor-error
      domains: *id001
  - id: c
    text: $e^x$
    issueSignals:
    - id: ede-integrating-factor-error
      domains: *id001
  - id: d
    text: $y$
    issueSignals:
    - id: ede-integrating-factor-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Multiply by $x$.

    Why it works: The ratio $(M_y-N_x)/N=1/x$ yields $\mu=e^{\int dx/x}=x$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q010
