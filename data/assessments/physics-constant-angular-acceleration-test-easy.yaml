randomizeQuestions: true
questions:
- id: q1
  type: numericResponse
  prompt: A turbine spinning at $50 \text{ rad/s}$ is brought to rest in $10 \text{
    s}$ at a constant rate. What is the magnitude of the angular acceleration?
  answer:
    value: 5.0
    tolerance: 0.5
  explanation: $|\alpha| = |\frac{\Delta\omega}{\Delta t}| = \frac{50}{10} = 5.0 \text{
    rad/s}^2$.
