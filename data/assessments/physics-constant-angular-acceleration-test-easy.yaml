schemaVersion: 1
id: physics-constant-angular-acceleration-test-easy
title: 'Test (Easy): Constant Angular Acceleration'
description: Fundamental exam covering Constant Angular Acceleration.
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-constant-angular-acceleration
skills:
- physics-constant-angular-acceleration
- constant-angular-acceleration
- rotational-kinematics
- angular-acceleration
modeDefault: exam
randomizeQuestions: true
questions:
- id: q001
  title: Angular acceleration
  type: numericResponse
  prompt: |-
    A wheel speeds up from $2.0$ to $10.0\text{ rad/s}$ in $4.0\text{ s}$. What is $\alpha$?
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: |-
    $\alpha=(10-2)/4=2.0\text{ rad/s}^2$.
- id: q002
  title: Final angular speed
  type: numericResponse
  prompt: |-
    A rotor starts at $3.0\text{ rad/s}$ with $\alpha=1.5\text{ rad/s}^2$ for $6.0\text{ s}$. What is $\omega_f$?
  answer:
    value: 12.0
    tolerance: 0.05
  explanation: |-
    $\omega_f=3.0+1.5(6.0)=12.0\text{ rad/s}$.
- id: q003
  title: Angular displacement from rest
  type: numericResponse
  prompt: |-
    A wheel starts from rest with $\alpha=4.0\text{ rad/s}^2$ for $3.0\text{ s}$. What angle is covered?
  answer:
    value: 18.0
    tolerance: 0.1
  explanation: |-
    $\theta=\frac12\alpha t^2=\frac12(4)(9)=18\text{ rad}$.
- id: q004
  title: Time to stop
  type: numericResponse
  prompt: |-
    A disk slows from $20\text{ rad/s}$ to rest with $\alpha=-5.0\text{ rad/s}^2$. How long does it take?
  answer:
    value: 4.0
    tolerance: 0.02
  explanation: |-
    $t=(0-20)/(-5)=4.0\text{ s}$.
- id: q005
  title: Angle while slowing
  type: numericResponse
  prompt: |-
    A wheel slows from $12$ to $4\text{ rad/s}$ in $2.0\text{ s}$. What angle is covered?
  answer:
    value: 16.0
    tolerance: 0.1
  explanation: |-
    $\omega_{avg}=8\text{ rad/s}$, so $\theta=8(2)=16\text{ rad}$.
- id: q006
  title: No-time equation
  type: multipleChoice
  prompt: |-
    Which equation is most direct when time is not given?
  choices:
  - id: a
    text: |-
      $\omega_f^2=\omega_i^2+2\alpha\theta$
  - id: b
    text: |-
      $\theta=\omega_it+\frac12\alpha t^2$
  - id: c
    text: |-
      $\omega_f=\omega_i+\alpha t$
  - id: d
    text: |-
      $v=\omega R$
  answer:
    choiceId: a
  explanation: |-
    Use the no-time kinematic equation.
- id: q007
  title: Find alpha without time
  type: numericResponse
  prompt: |-
    A wheel starts at $5$ and reaches $13\text{ rad/s}$ after $18\text{ rad}$. What is $\alpha$?
  answer:
    value: 4.0
    tolerance: 0.05
  explanation: |-
    $\alpha=(169-25)/(36)=4.0\text{ rad/s}^2$.
- id: q008
  title: Revolutions to radians
  type: numericResponse
  prompt: |-
    How many radians are in $4.0$ revolutions?
  answer:
    value: 25.133
    tolerance: 0.02
  explanation: |-
    $4(2\pi)=8\pi\approx25.13\text{ rad}$.
- id: q009
  title: Slowing sign
  type: multipleChoice
  prompt: |-
    If a wheel is rotating clockwise and slowing, angular acceleration:
  choices:
  - id: a
    text: |-
      points opposite angular velocity under the chosen sign convention
  - id: b
    text: |-
      must be zero
  - id: c
    text: |-
      must have the same sign
  - id: d
    text: |-
      has units of radians only
  answer:
    choiceId: a
  explanation: |-
    Slowing means angular acceleration opposes angular velocity.
- id: q010
  title: Average angular speed
  type: numericResponse
  prompt: |-
    A wheel changes uniformly from $6$ to $14\text{ rad/s}$. What is average angular speed?
  answer:
    value: 10.0
    tolerance: 0.02
  explanation: |-
    $\omega_{avg}=(6+14)/2=10\text{ rad/s}$.
- id: q011
  title: Time from angle
  type: numericResponse
  prompt: |-
    Starting from rest with $\alpha=2.0\text{ rad/s}^2$, how long to rotate $25\text{ rad}$?
  answer:
    value: 5.0
    tolerance: 0.05
  explanation: |-
    $25=\frac12(2)t^2=t^2$, so $t=5\text{ s}$.
- id: q012
  title: Final speed after angle
  type: numericResponse
  prompt: |-
    A wheel starts at $4\text{ rad/s}$ and accelerates at $3\text{ rad/s}^2$ through $10\text{ rad}$. What is $\omega_f$?
  answer:
    value: 8.718
    tolerance: 0.03
  explanation: |-
    $\omega_f=\sqrt{16+60}=8.72\text{ rad/s}$.
- id: q013
  title: Angular variables
  type: multipleChoice
  prompt: |-
    Rotational kinematics replaces $x$, $v$, and $a$ with:
  choices:
  - id: a
    text: |-
      $\theta$, $\omega$, and $\alpha$
  - id: b
    text: |-
      $r$, $v$, and $\omega$
  - id: c
    text: |-
      $F$, $\tau$, and $I$
  - id: d
    text: |-
      $K$, $W$, and $P$
  answer:
    choiceId: a
  explanation: |-
    The angular variables are $\theta$, $\omega$, and $\alpha$.
- id: q014
  title: Stopping angle
  type: numericResponse
  prompt: |-
    A wheel at $15\text{ rad/s}$ slows with $\alpha=-3\text{ rad/s}^2$. Through what angle before stopping?
  answer:
    value: 37.5
    tolerance: 0.1
  explanation: |-
    $0=15^2+2(-3)\theta$, so $\theta=37.5\text{ rad}$.
- id: q015
  title: Speed from rest
  type: numericResponse
  prompt: |-
    A turntable starts from rest and rotates $32\text{ rad}$ with $\alpha=4\text{ rad/s}^2$. What is $\omega_f$?
  answer:
    value: 16.0
    tolerance: 0.05
  explanation: |-
    $\omega_f=\sqrt{2\alpha\theta}=16\text{ rad/s}$.
