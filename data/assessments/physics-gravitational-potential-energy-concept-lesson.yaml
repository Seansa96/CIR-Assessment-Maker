lesson:
  introduction: Relate gravitational force, height, and system energy in uniform and nonuniform gravitational fields.
  sections:
    - { id: gpe1, title: Near-Earth potential energy, content: 'Near Earth, $\Delta U_g=mg\Delta y$.', check: { id: gpec1, type: multipleChoice, prompt: 'Raising an object increases its gravitational potential energy by:', choices: [{ id: a, text: '$mg\Delta y$' }, { id: b, text: '$m/\Delta y$' }], answer: { choiceId: a }, explanation: 'Solution: Use $mg\Delta y$.\n\nWhy it works: Weight acts approximately constant near Earth.\n\nWhy the other choices fail: Potential-energy change is proportional to height change.' } }
    - { id: gpe2, title: Reference level, content: 'The zero of potential energy is chosen conveniently; only changes have physical significance.', check: { id: gpec2, type: multipleChoice, prompt: 'Changing the zero reference for potential energy changes:', choices: [{ id: a, text: 'the numerical value but not energy differences' }, { id: b, text: 'the force of gravity' }], answer: { choiceId: a }, explanation: 'Solution: It changes numerical values but not differences.\n\nWhy it works: Adding a constant to potential changes no forces.\n\nWhy the other choices fail: Gravity is independent of the reference choice.' } }
    - { id: gpe3, title: Work and potential, content: 'For gravity, $W_g=-\Delta U_g$.', check: { id: gpec3, type: multipleChoice, prompt: 'As an object falls, gravity does:', choices: [{ id: a, text: 'positive work' }, { id: b, text: 'negative work' }], answer: { choiceId: a }, explanation: 'Solution: Gravity does positive work.\n\nWhy it works: Force and downward displacement align.\n\nWhy the other choices fail: Negative work would increase gravitational potential energy.' } }
    - { id: gpe4, title: Conservation of energy, content: 'Without nonconservative work, $K_i+U_i=K_f+U_f$.', check: { id: gpec4, type: multipleChoice, prompt: 'A falling object with negligible air resistance converts gravitational potential energy primarily into:', choices: [{ id: a, text: 'kinetic energy' }, { id: b, text: 'mass' }], answer: { choiceId: a }, explanation: 'Solution: It converts to kinetic energy.\n\nWhy it works: Mechanical energy is conserved.\n\nWhy the other choices fail: Mass does not increase in this model.' } }
    - { id: gpe5, title: Universal potential energy, content: 'For separated spherical masses, $U=-GMm/r$ when zero is at infinity.', check: { id: gpec5, type: multipleChoice, prompt: 'Why is gravitational potential energy negative with zero at infinity?', choices: [{ id: a, text: 'Work is required to separate attracting masses to infinity' }, { id: b, text: 'Gravity repels masses' }], answer: { choiceId: a }, explanation: 'Solution: Separation requires positive external work.\n\nWhy it works: Bound masses have lower energy than the separated state.\n\nWhy the other choices fail: Gravity is attractive.' } }
    - { id: gpe6, title: Escape condition, content: 'Reaching infinity with zero speed requires total mechanical energy zero.', check: { id: gpec6, type: multipleChoice, prompt: 'At escape speed, total mechanical energy is:', choices: [{ id: a, text: 'zero' }, { id: b, text: 'always negative' }], answer: { choiceId: a }, explanation: 'Solution: It is zero.\n\nWhy it works: Both potential and kinetic energy approach zero at infinity.\n\nWhy the other choices fail: Negative total energy remains a bound orbit.' } }
    - { id: gpe7, title: Units and signs, content: 'Potential energy is measured in joules; direction and reference choices determine signs.', check: { id: gpec7, type: multipleChoice, prompt: 'The SI unit of gravitational potential energy is:', choices: [{ id: a, text: 'joule' }, { id: b, text: 'newton' }], answer: { choiceId: a }, explanation: 'Solution: The unit is joule.\n\nWhy it works: Potential energy is energy.\n\nWhy the other choices fail: A newton measures force.' } }
