lesson:
  introduction: |
    Welcome to the lesson on Gravitational Potential Energy. Near Earth's surface, you used the approximation $U = mgh$. When venturing further into space, we must account for the changing force of gravity over vast distances using the universal formula for potential energy.
  sections:
  - id: intro-universal-u
    title: 1. The Universal Potential Energy Formula
    required: true
    content: |
      The universal gravitational potential energy of a two-body system is given by:
      $$ U = -G \frac{m_1 m_2}{r} $$
      Why is it negative? We define the potential energy to be zero at an infinite distance ($r \to \infty$). Because gravity is an attractive force, bringing two masses closer together releases energy, resulting in a negative potential energy.
    media: []
    check:
      id: check-1
      type: multipleChoice
      prompt: |
        Where is the universal gravitational potential energy defined to be zero?
      choices:
      - id: a
        text: 'At the center of the Earth'
      - id: b
        text: 'At the surface of the Earth'
      - id: c
        text: 'At an infinite distance'
      - id: d
        text: 'At the midpoint between two masses'
      answer:
        choiceId: c
      explanation: |
        Solution:
        The zero point is defined at $r = \infty$.
        
        Why it works:
        By convention, the potential energy is zero when the masses are infinitely far apart and not interacting. As they move closer under gravitational attraction, their potential energy decreases, becoming negative.
        
        Why the other choices fail:
        Choices A and B are arbitrary local reference points often used for the $mgh$ approximation, but not the universal formula. Choice D is incorrect because gravity still exerts a strong pull there.

  - id: energy-conservation
    title: 2. Conservation of Energy in Space
    required: true
    content: |
      The total mechanical energy of an object in a gravitational field is conserved if no non-conservative forces (like air resistance or thrusters) do work.
      $$ E = K + U = \frac{1}{2}mv^2 - G\frac{Mm}{r} $$
      If $E < 0$, the object is "bound" in orbit. If $E \ge 0$, the object has enough energy to escape the gravitational pull and reach infinity.
    media: []
    check:
      id: check-2
      type: multipleChoice
      prompt: |
        An asteroid is in a stable, bound orbit around the Sun. Which statement about its total mechanical energy $E$ must be true?
      choices:
      - id: a
        text: '$E = 0$'
      - id: b
        text: '$E > 0$'
      - id: c
        text: '$E < 0$'
      - id: d
        text: 'Total energy constantly changes'
      answer:
        choiceId: c
      explanation: |
        Solution:
        The total energy must be $E < 0$.
        
        Why it works:
        A bound system means the object cannot escape to infinity. Because $U$ is negative and reaches 0 at infinity, the kinetic energy $K$ is not large enough to overcome the negative potential energy.
        
        Why the other choices fail:
        If $E \ge 0$, the object is unbound and will escape the system, following a parabolic or hyperbolic trajectory. Energy is conserved, so it does not constantly change.

  - id: escape-velocity
    title: 3. Escape Velocity
    required: true
    content: |
      Escape velocity is the minimum speed needed for an object to just reach infinity with zero remaining speed. At infinity, $K_f = 0$ and $U_f = 0$, so $E_{total} = 0$.
      Setting the initial energy equal to zero:
      $$ \frac{1}{2}mv_{esc}^2 - G\frac{Mm}{R} = 0 $$
      Solving for $v_{esc}$ yields:
      $$ v_{esc} = \sqrt{\frac{2GM}{R}} $$
    media: []
    check:
      id: check-3
      type: multipleChoice
      prompt: |
        Does the escape velocity of a rocket depend on the mass of the rocket?
      choices:
      - id: a
        text: 'Yes, heavier rockets need a higher escape velocity.'
      - id: b
        text: 'Yes, heavier rockets need a lower escape velocity.'
      - id: c
        text: 'No, escape velocity is independent of the projectile mass.'
      answer:
        choiceId: c
      explanation: |
        Solution:
        Escape velocity is independent of the rocket's mass.
        
        Why it works:
        In the conservation of energy equation, the mass of the projectile $m$ appears in both the kinetic energy and potential energy terms, and thus cancels out algebraically.
        
        Why the other choices fail:
        While a heavier rocket requires more *energy* (and more fuel) to reach that speed, the required *velocity* itself depends only on the mass and radius of the planet ($M$ and $R$).
