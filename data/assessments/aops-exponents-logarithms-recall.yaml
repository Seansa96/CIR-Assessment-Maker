items:
- id: exponent-product-law
  type: symbolic
  prompt: Complete the same-base product law $a^m a^n=$ ____.
  answer:
    expectedLatex: 'a^{m+n}'
    aliases: ['$a^{m+n}$']
  explanation: Multiplication joins the two groups of like factors.
  tags: [exponent-laws]
- id: negative-exponent-reciprocal
  type: symbolic
  prompt: Rewrite $a^{-n}$ for $a\ne0$ without a negative exponent.
  answer:
    expectedLatex: '\frac1{a^n}'
    aliases: ['\frac1{a^n}']
  explanation: A negative exponent denotes a reciprocal.
  tags: [negative-exponent]
- id: zero-exponent-restriction
  type: cloze
  prompt: The elementary identity $a^0=1$ requires $a$ to be ____.
  answer:
    expected: nonzero
    aliases: [not zero, a != 0]
  explanation: The derivation uses $a^m/a^m$, which is undefined at $a=0$.
  tags: [zero-exponent]
- id: rational-exponent-denominator
  type: flashcard
  prompt: What does the denominator $q$ indicate in $a^{p/q}$?
  answer:
    expected: Take the qth root; the numerator p then indicates the power.
  explanation: Rational exponents encode a root and a power while preserving exponent laws.
  tags: [rational-exponent]
- id: principal-root-identity
  type: symbolic
  prompt: Simplify $\sqrt{x^2}$ for real $x$.
  answer:
    expectedLatex: '\lvert x\rvert'
    aliases: ['\lvert x\rvert']
  explanation: The principal square root is nonnegative.
  tags: [principal-root]
- id: conjugate-purpose
  type: flashcard
  prompt: Why does multiplying by a binomial conjugate help rationalize a denominator?
  answer:
    expected: The product is a difference of squares, so the cross radical terms cancel.
  explanation: $(u+v)(u-v)=u^2-v^2$.
  tags: [conjugate, rationalization]
- id: logarithm-inverse-statement
  type: symbolic
  prompt: Rewrite $\log_bx=y$ in exponential form.
  answer:
    expectedLatex: 'b^y=x'
    aliases: ['$b^y=x$']
  explanation: A logarithm gives the exponent on the base that produces the argument.
  tags: [logarithm]
- id: logarithm-base-restrictions
  type: flashcard
  prompt: What restrictions must a real logarithm base $b$ satisfy?
  answer:
    expected: b>0 and b is not 1
  explanation: These restrictions make the exponential map one-to-one with positive outputs.
  tags: [logarithm-domain]
- id: logarithm-argument-restriction
  type: cloze
  prompt: Every real logarithm argument must be strictly ____.
  answer:
    expected: positive
    aliases: [greater than zero]
  explanation: Positive-base exponentials never produce zero or negative values.
  tags: [logarithm-domain]
- id: logarithm-product-law
  type: symbolic
  prompt: For $u,v>0$, complete $\log_b(uv)=$ ____.
  answer:
    expectedLatex: '\log_bu+\log_bv'
    aliases: ['$\log_bu+\log_bv$']
  explanation: Products inside one logarithm become sums of logarithms.
  tags: [logarithm-laws]
- id: repeated-power-cue
  type: flashcard
  prompt: What substitution is suggested by an equation containing both $a^{2x}$ and $a^x$?
  answer:
    expected: Let u=a^x, with u>0.
  explanation: Then $a^{2x}=u^2$, often producing a quadratic.
  tags: [exponential-equations]
- id: verification-after-squaring
  type: flashcard
  prompt: Why must candidates be checked after squaring both sides of an equation?
  answer:
    expected: Squaring is not reversible without sign conditions and may introduce extraneous solutions.
  explanation: A squared equation can be true even when the two original sides had opposite signs.
  tags: [extraneous-solution, verification]
