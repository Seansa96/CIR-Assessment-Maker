glossary:
  introduction: These terms connect signed one-dimensional motion with the derivative and integral relationships used in calculus-based kinematics.
  sections:
  - id: quantities-and-graphs
    title: Kinematic quantities and graph meanings
    required: true
    content: Use a chosen positive direction consistently. Slopes and signed areas then connect position, velocity, and acceleration graphs.
    entries:
    - id: displacement
      term: Displacement
      definition: The signed change in position from initial to final location.
      notation: $\Delta x=x_f-x_i$
      examples:
      - From 3 m to -2 m, displacement is -5 m.
      aliases: []
      media: []
      tags:
      - position
      drills:
      - id: disp-cloze
        type: cloze
        prompt: 'Complete: $\Delta x=x_f\;\underline{\hspace{0.8cm}}\;x_i$.'
        answer:
          expected: '-'
          expectedLatex: '-'
          aliases:
          - minus
          - subtract
          media: []
          choiceId: 
        explanation: 'Solution: Insert a minus sign.\n\nWhy it works: Displacement is final position minus initial position.'
        tags:
        - position
        skills: []
        choices: []
    - id: instantaneous-velocity
      term: Instantaneous velocity
      definition: The signed rate of change of position at an instant.
      notation: $v(t)=dx/dt$
      examples:
      - The tangent slope of x versus t is velocity.
      aliases: []
      media: []
      tags:
      - derivative
      drills:
      - id: vel-cloze
        type: cloze
        prompt: Velocity is the ____ of position with respect to time.
        answer:
          expected: derivative
          expectedLatex: ''
          aliases:
          - rate of change
          media: []
          choiceId: 
        explanation: 'Solution: The missing word is derivative.\n\nWhy it works: $v=dx/dt$ defines velocity as the time derivative of position.'
        tags:
        - derivative
        skills: []
        choices: []
    - id: acceleration
      term: Acceleration
      definition: The signed rate of change of velocity.
      notation: $a(t)=dv/dt=d^2x/dt^2$
      examples:
      - Positive acceleration makes signed velocity increase.
      aliases: []
      media: []
      tags:
      - derivative
      drills:
      - id: acc-cloze
        type: cloze
        prompt: Acceleration is the time derivative of ____.
        answer:
          expected: velocity
          expectedLatex: ''
          aliases:
          - v
          media: []
          choiceId: 
        explanation: 'Solution: The answer is velocity.\n\nWhy it works: $a=dv/dt$ measures how velocity changes with time.'
        tags:
        - derivative
        skills: []
        choices: []
    - id: signed-area
      term: Signed area
      definition: Area below a graph's time axis counts negative when integrating a signed quantity.
      notation: $\Delta x=\int v(t)dt$
      examples:
      - Area under velocity versus time gives displacement.
      aliases: []
      media: []
      tags:
      - integral
      drills:
      - id: area-cloze
        type: cloze
        prompt: The signed area under a velocity-time graph gives ____.
        answer:
          expected: displacement
          expectedLatex: ''
          aliases:
          - change in position
          media: []
          choiceId: 
        explanation: 'Solution: It gives displacement.\n\nWhy it works: Integrating velocity over time produces the signed change in position.'
        tags:
        - integral
        skills: []
        choices: []
