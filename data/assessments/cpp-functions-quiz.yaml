schemaVersion: 1
id: cpp-functions-quiz
title: C++ Functions Quiz
assessmentType: quiz
categoryId: c++
subcategoryId: c++-functions
subcategoryIds:
  - c++-functions
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which function signature correctly passes a `std::string` by reference so it can be modified?
    choices:
      - id: a
        text: '`void updateName(std::string& name)`'
      - id: b
        text: '`void updateName(std::string name)`'
      - id: c
        text: '`void updateName(const std::string& name)`'
      - id: d
        text: '`void updateName(&std::string name)`'
    answer:
      choiceId: a
    explanation: |
      The `&` goes after the type. `const std::string&` would prevent modification.

  - id: q002
    type: multipleChoice
    prompt: |
      Consider the following overloaded functions:
      ```cpp
      void printVal(int x);
      void printVal(double x);
      ```
      If you call `printVal(5.5);`, which one is executed?
    choices:
      - id: a
        text: '`void printVal(double x);`'
      - id: b
        text: '`void printVal(int x);`'
      - id: c
        text: 'A compiler error occurs because it is ambiguous.'
      - id: d
        text: 'It calls both in sequence.'
    answer:
      choiceId: a
    explanation: |
      `5.5` is a `double` literal, so it exactly matches the `double` version.

  - id: q003
    type: multipleChoice
    prompt: |
      Why do recursive functions require a base case?
    choices:
      - id: a
        text: 'To provide a stopping condition so recursion doesn''t continue infinitely.'
      - id: b
        text: 'To specify the return type of the function.'
      - id: c
        text: 'To allow the function to be overloaded.'
      - id: d
        text: 'To improve the execution speed of the function.'
    answer:
      choiceId: a
    explanation: |
      Without a base case, recursion continues until the call stack overflows.

  - id: q004
    type: multipleChoice
    prompt: |
      Which of the following is a valid use of default parameters?
    choices:
      - id: a
        text: '`void drawBox(int width, int height = 10);`'
      - id: b
        text: '`void drawBox(int width = 10, int height);`'
      - id: c
        text: '`void drawBox(int width = 10, int height = 20, int depth);`'
      - id: d
        text: '`void drawBox(width = 10, height = 20);`'
    answer:
      choiceId: a
    explanation: |
      Default parameters must appear at the end of the parameter list.

  - id: q005
    type: multipleChoice
    prompt: |
      What will be the output of this code?
      ```cpp
      void modify(int val, int& ref) {
          val = 10;
          ref = 20;
      }
      
      int main() {
          int x = 1;
          int y = 2;
          modify(x, y);
          cout << x << " " << y;
          return 0;
      }
      ```
    choices:
      - id: a
        text: '`1 20`'
      - id: b
        text: '`10 20`'
      - id: c
        text: '`1 2`'
      - id: d
        text: '`10 2`'
    answer:
      choiceId: a
    explanation: |
      `x` is passed by value (copy), so it remains `1`. `y` is passed by reference, so it is changed to `20`.

  - id: q006
    type: code
    prompt: |
      Write a function named `clamp` that takes three `int` parameters: `value`, `min`, and `max`.
      It should return `min` if `value < min`, return `max` if `value > max`, and otherwise return `value`.
    language: cpp
    functionName: clamp
    starterCode: |
      int clamp(int value, int min, int max) {
          return 0;
      }
    tests:
      - input: "5, 0, 10"
        expected: "5"
      - input: "-5, 0, 10"
        expected: "0"
      - input: "15, 0, 10"
        expected: "10"
    answer: {}
    explanation: |
      You can use `if/else` statements, or `std::min` and `std::max`.

  - id: q007
    type: code
    prompt: |
      Write a recursive function named `sumUpTo` that takes a positive `int n` and returns the sum of all integers from 1 to `n`.
      Base case: if `n <= 1`, return `n`.
    language: cpp
    functionName: sumUpTo
    starterCode: |
      int sumUpTo(int n) {
          return 0;
      }
    tests:
      - input: "1"
        expected: "1"
      - input: "4"
        expected: "10"
      - input: "10"
        expected: "55"
    answer: {}
    explanation: |
      Return `n + sumUpTo(n - 1)`.

  - id: q008
    type: code
    prompt: |
      Write two overloaded functions named `getArea`.
      1. `double getArea(double radius)` returns the area of a circle (`3.14159 * radius * radius`).
      2. `double getArea(double width, double height)` returns the area of a rectangle.
    language: cpp
    functionName: getArea
    starterCode: |
      // Write your overloaded functions here
    tests:
      - input: "2.0"
        expected: "12.56636"
      - input: "4.0, 5.0"
        expected: "20"
    answer: {}
    explanation: |
      Overload the function by providing two distinct parameter lists.
