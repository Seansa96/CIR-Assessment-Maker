- id: conservation-of-mass-verification
  title: Verifying Conservation of Mass
  problem: 'A student burns magnesium metal in air. Before the reaction, the magnesium
    ribbon has a mass of 3.24 g. After heating, the white powder (magnesium oxide)
    collected has a mass of 5.40 g.


    (a) Does this experiment obey the Law of Conservation of Mass?

    (b) What mass of oxygen from the air reacted?

    '
  steps:
  - id: step-conservation-of-mass-verification-1
    title: Identify what the Law of Conservation of Mass predicts
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'The law states: mass of reactants = mass of products.


      Reactants: magnesium (Mg) + oxygen (O2) from air

      Products: magnesium oxide (MgO)


      So: mass Mg + mass O2 = mass MgO

      '
  - id: step-conservation-of-mass-verification-2
    title: Calculate the mass of oxygen that reacted
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'We know:

      - Mass of Mg = 3.24 g

      - Mass of MgO = 5.40 g


      Rearranging: mass O2 = mass MgO − mass Mg


      $$

      m_{O_2} = 5.40\text{ g} - 3.24\text{ g} = 2.16\text{ g}

      $$


      The reaction consumed 2.16 g of oxygen from the air.

      '
  - id: step-conservation-of-mass-verification-3
    title: Verify conservation
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Check: 3.24 g Mg + 2.16 g O2 = 5.40 g MgO ✓


      Mass is conserved. The experiment obeys the Law of Conservation of Mass.

      '
  check:
    id: conservation-check
    type: multipleChoice
    prompt: 'If the student had collected only 4.50 g of magnesium oxide instead of
      5.40 g, what is the most likely explanation?

      '
    choices:
    - id: a
      text: Some of the magnesium oxide powder was lost (e.g., scattered during heating).
    - id: b
      text: The Law of Conservation of Mass was violated.
    - id: c
      text: The magnesium must have had impurities.
    - id: d
      text: Some magnesium did not actually react.
    answer:

      choiceId: a
    explanation: 'Conservation of mass cannot be violated in a chemical reaction.
      The most likely experimental error is that some product was lost — powder scattered
      from the crucible during the vigorous reaction. Option (d) is a possibility
      but would typically give excess unreacted Mg, not a small MgO mass.

      '
- id: isotope-composition
  title: Protons, Neutrons, and Electrons from Nuclear Notation
  problem: 'For each of the following atoms or ions, determine the number of protons,
    neutrons, and electrons:


    (a) ${}^{56}_{26}\text{Fe}$ (neutral iron atom)

    (b) ${}^{56}_{26}\text{Fe}^{3+}$ (iron(III) ion)

    (c) ${}^{35}_{17}\text{Cl}^{-}$ (chloride ion)

    '
  steps:
  - id: step-isotope-composition-1
    title: (a) Neutral iron atom — Fe-56
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'From ${}^{56}_{26}\text{Fe}$:

      - **Protons** = Z = **26**

      - **Neutrons** = A − Z = 56 − 26 = **30**

      - **Electrons** = protons (neutral atom) = **26**

      '
  - id: step-isotope-composition-2
    title: (b) Iron(III) ion — Fe3+
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Fe3+ has lost 3 electrons from the neutral Fe atom.

      - **Protons** = 26 (unchanged — protons never change)

      - **Neutrons** = 30 (unchanged)

      - **Electrons** = 26 − 3 = **23**


      The 3+ charge means 3 more protons than electrons.

      '
  - id: step-isotope-composition-3
    title: (c) Chloride ion — Cl−
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'From ${}^{35}_{17}\text{Cl}^{-}$: Cl− has gained 1 electron.

      - **Protons** = Z = **17**

      - **Neutrons** = A − Z = 35 − 17 = **18**

      - **Electrons** = 17 + 1 = **18**


      The 1− charge means 1 more electron than proton.

      '
  check:
    id: isotope-check
    type: numericResponse
    prompt: 'An atom of ${}^{31}_{15}\text{P}$ (phosphorus) gains 3 electrons to form
      the phosphide ion (P3−). How many electrons does the phosphide ion have?

      '
    answer:
      value: 18
      tolerance: 0
- id: multiple-proportions-application
  title: Applying the Law of Multiple Proportions
  problem: 'Sulfur forms two different compounds with oxygen:

    - **Compound A**: 32.0 g of sulfur combined with 32.0 g of oxygen

    - **Compound B**: 32.0 g of sulfur combined with 48.0 g of oxygen


    Show that these data illustrate the Law of Multiple Proportions, and identify
    the likely formulas.

    '
  steps:
  - id: step-multiple-proportions-application-1
    title: Find the ratio of oxygen masses
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'For a fixed 32.0 g of sulfur, compare the oxygen masses:


      $$

      \frac{m_O \text{ in Compound B}}{m_O \text{ in Compound A}} = \frac{48.0\text{
      g}}{32.0\text{ g}} = \frac{3}{2}

      $$


      The ratio is 3:2 — a small whole number ratio. This is exactly what the Law
      of Multiple Proportions predicts.

      '
  - id: step-multiple-proportions-application-2
    title: Identify the formulas
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '- Compound A: 32 g S + 32 g O → equal masses, suggesting a 1:1 atom
      ratio (since S and O have similar molar masses). This is **SO** (sulfur monoxide,
      or more precisely part of the SO family).

      - Compound B: 32 g S + 48 g O → ratio of 2:3. This is **SO3** (sulfur trioxide,
      where 32 g S = 1 mol, 48 g O = 3 mol).


      Actually more precisely: Compound A is **SO2** (sulfur dioxide, 32 g S and 32
      g O = 1:2 mol ratio of S:O... Let''s check: 1 mol S = 32 g, 2 mol O = 32 g →
      yes, SO2) and Compound B is **SO3** (1 mol S = 32 g, 3 mol O = 48 g → yes, SO3).


      The ratio of O in SO3 to O in SO2 is 3:2. ✓

      '
  check:
    id: multiple-proportions-check
    type: multipleChoice
    prompt: 'Two compounds of nitrogen and hydrogen contain the following: Compound
      X has 14.0 g N per 3.0 g H; Compound Y has 14.0 g N per 6.0 g H. What is the
      ratio of hydrogen in Y to hydrogen in X (for fixed nitrogen mass)?

      '
    choices:
    - id: a
      text: '2:1'
    - id: b
      text: '1:2'
    - id: c
      text: '3:1'
    - id: d
      text: '1:1'
    answer:

      choiceId: a
    explanation: '6.0 g H (in Y) / 3.0 g H (in X) = 2:1. A simple whole-number ratio.
      This illustrates the Law of Multiple Proportions. The compounds are likely NH3
      (compound X) and N2H4 (compound Y).

      '
