- id: we2
  title: Sliding Bar
  steps:
  - id: s1
    prompt: Calculate the motional EMF.
    explanation: 'Solution:

      1) Use the formula $\mathcal{E} = Bvl$.

      2) Substitute values: $\mathcal{E} = (1.5)(2.0)(0.5) = 1.5\text{ V}$.


      Why it works:

      The magnetic force on the free electrons in the moving bar creates a charge separation, which acts
      as a voltage source.'
    title: Calculate the motional EMF.
    instruction: 'Work through this step: Calculate the motional EMF.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: A conducting bar of length $0.5\text{ m}$ slides along two parallel conducting rails at a speed
    of $2.0\text{ m/s}$. A uniform magnetic field of $1.5\text{ T}$ is perpendicular to the plane of the
    rails. Calculate the motional EMF.
