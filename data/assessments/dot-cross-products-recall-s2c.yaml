- id: r002
  type: typed
  prompt: State the magnitude formula for a cross product in terms of the angle $\theta$.
  answer:
    expected: '|u||v| sin(theta)'
    expectedLatex: 
    aliases:
    - '|u| |v| sin theta'
    - magnitude u times magnitude v times sin theta
    media: []
    choiceId: 
  explanation: 'Solution: $|\mathbf u\times\mathbf v|=|\mathbf u||\mathbf v|\sin\theta$. Why it works: The sine factor supplies the perpendicular height for the spanned parallelogram.'
  tags: []
  skills: []
  issueSignals:
