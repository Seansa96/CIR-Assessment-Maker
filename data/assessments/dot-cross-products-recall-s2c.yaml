- id: r001
  type: cloze
  prompt: For nonzero vectors, $\mathbf u\cdot\mathbf v=0$ means the vectors are ____.
  answer:
    expected: perpendicular
    expectedLatex: 
    aliases:
    - orthogonal
    media: []
    choiceId: 
  explanation: 'Solution: Fill in perpendicular. Why it works: A zero dot product makes the angle between nonzero vectors $90^\circ$.'
