workedExamples:
- id: we01
  title: Cooling thermometer
  problem: A thermometer follows $T'=-0.4(T-20)$ and reads $80$ at $t=0$. Set up the IVP and identify the equilibrium
    temperature.
  steps:
  - id: we1-s1
    title: Identify the state and data
    instruction: Define the dependent variable, units, and supplied condition.
    type: freeResponse
    prompt: State the unknown function and initial condition.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Defines T(t)
      - States T(0)=80
    explanation: |-
      Solution: Let $T(t)$ be temperature in degrees Celsius at time $t$; the condition is $T(0)=80$.

      Why it works: The derivative and initial value must refer to the same state variable and time origin.
    media: []
  - id: we1-s2
    title: Write the IVP
    instruction: Combine the rate law with the measured starting value.
    type: freeResponse
    prompt: Write the complete initial-value problem.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Includes ODE
      - Includes initial condition
    explanation: |-
      Solution: $T'=-0.4(T-20),\quad T(0)=80$.

      Why it works: An IVP consists of both the evolution equation and data selecting one solution.
    media: []
  - id: we1-s3
    title: Find and interpret equilibrium
    instruction: Set the rate equal to zero and check units.
    type: freeResponse
    prompt: Identify the equilibrium and explain its meaning.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Sets T'=0
      - Finds 20
      - Interprets equilibrium
    explanation: |-
      Solution: $0=-0.4(T-20)$ gives $T=20^\circ\mathrm C$. At that temperature the model predicts no further change.

      Why it works: An equilibrium is a constant state, so its derivative must vanish.
    media: []
- id: we02
  title: Verify an IVP solution
  problem: Verify that $y=x^2+1$ solves $y'=2x$ with $y(0)=1$, then state the interval of validity.
  steps:
  - id: we2-s1
    title: Differentiate the candidate
    instruction: Compute the derivative independently.
    type: freeResponse
    prompt: Find the derivative of the proposed solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Derivative is 2x
    explanation: |-
      Solution: For $y=x^2+1$, $y'=2x$.

      Why it works: Matching the differential equation requires the candidate derivative, not merely its value.
    media: []
  - id: we2-s2
    title: Check the initial condition
    instruction: Evaluate the candidate at the supplied point.
    type: freeResponse
    prompt: Verify $y(0)=1$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Evaluates at zero
      - Gets one
    explanation: |-
      Solution: $y(0)=0^2+1=1$, so the initial condition holds.

      Why it works: Equation verification and initial-data verification are separate requirements.
    media: []
  - id: we2-s3
    title: State the valid interval
    instruction: Inspect both formula and ODE for singularities.
    type: freeResponse
    prompt: Give the maximal interval of validity.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Checks formula
      - Checks ODE
      - States all reals
    explanation: |-
      Solution: Both $x^2+1$ and $2x$ are defined and differentiable for every real $x$, so the interval is $(-\infty,\infty)$.

      Why it works: No finite point makes either the solution or original equation undefined.
    media: []
- id: we03
  title: Read a direction field
  problem: For $y'=y(1-y)$, identify the equilibrium solutions and predict whether a solution starting at $0.4$
    rises or falls.
  steps:
  - id: we3-s1
    title: Locate equilibria
    instruction: Set the autonomous rate function equal to zero.
    type: freeResponse
    prompt: Find all constant solutions.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Sets rate to zero
      - Finds both equilibria
    explanation: |-
      Solution: $y(1-y)=0$ gives the equilibria $y=0$ and $y=1$.

      Why it works: A constant solution has zero derivative for every input.
    media: []
  - id: we3-s2
    title: Determine the local sign
    instruction: Evaluate the rate at the initial level.
    type: freeResponse
    prompt: Find the sign of $y'$ when $y=0.4$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Substitutes 0.4
      - Finds positive sign
    explanation: |-
      Solution: $y'=0.4(0.6)=0.24>0$.

      Why it works: The sign of the autonomous rate gives the direction of motion along the integral curve.
    media: []
  - id: we3-s3
    title: Interpret the curve
    instruction: Connect the sign analysis to the direction field.
    type: freeResponse
    prompt: State whether the solution rises or falls and its nearby target.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Rises
      - Identifies y=1
      - Does not cross equilibrium
    explanation: |-
      Solution: The curve rises from $0.4$ and approaches the stable equilibrium $y=1$ without crossing it.

      Why it works: Slopes are positive between the two equilibria and vanish at $y=1$.
    media: []
