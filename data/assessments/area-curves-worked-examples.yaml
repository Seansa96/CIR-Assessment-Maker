workedExamples:
- id: we-area-1
  title: Area Between Intersecting Parabolas
  problem: Find the area bounded by $y = x^2$ and $y = 2 - x^2$.
  steps:
  - id: step-we-area-1-1
    title: Find intersections
    instruction: Set functions equal.
    type: multipleChoice
    prompt: At what x-values do the curves intersect?
    choices:
    - id: a
      text: x = -1, 1
    - id: b
      text: x = -2, 2
    - id: c
      text: x = 0, 2
    answer:
      choiceId: a
    explanation: $x^2 = 2 - x^2 \implies 2x^2 = 2 \implies x = \pm 1$.
  - id: step-we-area-1-2
    title: Setup and evaluate
    instruction: Integrate top minus bottom.
    type: symbolicResponse
    prompt: Evaluate $\int_{-1}^1 ((2 - x^2) - x^2) \, dx$.
    answer:
      gradingMode: auto
      expectedLatex: 8/3
      equivalenceMode: expression
      tolerance: 0
    explanation: $\int_{-1}^1 (2 - 2x^2) \, dx = [2x - 2x^3/3]_{-1}^1 = (2 - 2/3)
      - (-2 + 2/3) = 8/3$.
