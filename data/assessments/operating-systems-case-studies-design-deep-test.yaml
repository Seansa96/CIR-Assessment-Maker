  title: UNIX, Linux, and Android Tradeoff
  type: freeResponse
  prompt: Explain one tradeoff in UNIX, Linux, and Android using a concrete OS mechanism.
  answer:
    expected: A strong answer names a mechanism in UNIX, Linux, and Android, identifies the resource or boundary it controls, and explains what benefit is gained and what cost or risk appears.
    gradingMode: selfCheck
    keyPoints:
    - Names mechanism
    - Identifies resource or boundary
    - Explains benefit
    - Explains cost or risk
  explanation: OS design is tradeoff-heavy; UNIX, Linux, and Android should be explained through mechanism and consequence.
