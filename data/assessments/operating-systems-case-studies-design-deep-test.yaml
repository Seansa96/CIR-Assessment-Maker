questions:
- id: q001
  title: 'UNIX, Linux, and Android: UNIX organizing ideas'
  type: multipleChoice
  prompt: In a design review, which statement best applies **UNIX organizing ideas**?
  choices:
  - id: a
    text: The design style matters more than command memorization.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'The design style matters more than command memorization. Related topic: UNIX, Linux, and Android.'
