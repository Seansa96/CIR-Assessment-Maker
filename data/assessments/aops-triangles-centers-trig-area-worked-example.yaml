- id: aops-triangles-cta-we-1
  title: All four centers in a 6-8-10 right triangle
  prompt: |
    A right triangle has legs 6 and 8 and hypotenuse 10. Find: (a) the circumradius, (b) the orthocenter location, (c) the inradius, (d) the distance from the right-angle vertex to the centroid.
  steps:
  - id: aops-triangles-cta-we-1-s1
    title: Circumradius and orthocenter
    prompt: 'Use the right-triangle-specific theorems to locate the circumcenter and orthocenter without any general formula.'
    difficultyDimensions:
    - In a right triangle, the hypotenuse is a diameter of the circumcircle.
    - In a right triangle, the two legs are altitudes; their intersection is the right-angle vertex.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Circumradius $R = \text{hypotenuse}/2 = 10/2 = 5$. The circumcenter is the midpoint of the hypotenuse.
      - The orthocenter is located at the right-angle vertex (where the two perpendicular legs intersect).
    explanation: |
      Solution:
      **Circumradius:** In any right triangle, the hypotenuse is a diameter of the circumscribed circle. Therefore the circumcenter is the midpoint of the hypotenuse, and the circumradius is:
      $$R = \frac{\text{hypotenuse}}{2} = \frac{10}{2} = 5$$
      **Orthocenter:** The orthocenter is the intersection of the three altitudes. In a right triangle, each leg is perpendicular to the other leg, so the two legs *themselves* are altitudes. Their intersection is the right-angle vertex. The orthocenter coincides with the right-angle vertex.

      Why it works:
      These are not special cases to memorize separately — they both follow from first principles. The hypotenuse subtends a $90°$ angle at any point on the circle (Thales' theorem), which is why the right-angle vertex lies on the circle and the hypotenuse is the diameter. The altitude argument follows from the definition of altitude (perpendicular from a vertex to the opposite side).
  - id: aops-triangles-cta-we-1-s2
    title: Compute the inradius
    prompt: 'Find the area $K$ and semiperimeter $s$, then use $K = rs$ to find the inradius $r$.'
    difficultyDimensions:
    - Compute $K = \frac{1}{2}(6)(8)$.
    - Compute $s = (6 + 8 + 10)/2$.
    - Solve $K = rs$ for $r$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $K = 24$, $s = 12$.
      - $r = K/s = 24/12 = 2$.
    explanation: |
      Solution:
      The area using the two perpendicular legs as base and height:
      $$K = \frac{1}{2}(6)(8) = 24$$
      The semiperimeter:
      $$s = \frac{6 + 8 + 10}{2} = \frac{24}{2} = 12$$
      Using the inradius formula $K = rs$:
      $$24 = r \cdot 12 \implies r = 2$$

      Why it works:
      The formula $K = rs$ (area equals inradius times semiperimeter) arises from dividing the triangle into three smaller triangles each with the inradius as a height, connecting the incenter to each side. There is also a shortcut for right triangles: $r = (a + b - c)/2$ where $a$, $b$ are legs and $c$ is the hypotenuse. Check: $(6 + 8 - 10)/2 = 4/2 = 2$ ✓.
  - id: aops-triangles-cta-we-1-s3
    title: Distance from the right-angle vertex to the centroid
    prompt: 'Find the length of the median from the right-angle vertex to the hypotenuse midpoint, then apply the $2:1$ centroid ratio.'
    difficultyDimensions:
    - The median from the right-angle vertex goes to the hypotenuse midpoint, which is also the circumcenter.
    - The length of this median equals the circumradius $R = 5$.
    - The centroid divides each median $2:1$ from vertex to midpoint.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Median length $= R = 5$.
      - Distance from vertex to centroid $= \frac{2}{3}(5) = \frac{10}{3}$.
      - Remaining distance (centroid to midpoint) $= \frac{1}{3}(5) = \frac{5}{3}$. Check: $\frac{10/3}{5/3} = 2:1$ ✓.
    explanation: |
      Solution:
      The midpoint of the hypotenuse is the circumcenter (as found in step 1), so every vertex of a right triangle is exactly $R = 5$ from the hypotenuse midpoint. In particular, the median from the right-angle vertex to the hypotenuse midpoint has length 5.
      The centroid divides each median in the ratio $2:1$ measured from the vertex:
      $$\text{vertex to centroid} = \frac{2}{3}(5) = \frac{10}{3}$$
      The remaining portion (centroid to hypotenuse midpoint) is $\frac{1}{3}(5) = \frac{5}{3}$, and indeed $\frac{10/3}{5/3} = 2$ confirms the $2:1$ ratio.

      Why it works:
      The $2:1$ centroid theorem means the centroid is always closer to the midpoint of the opposite side than to the vertex. Confusing the direction of the ratio (taking $1/3$ from the vertex instead of $2/3$) is one of the most common errors in centroid problems.

- id: aops-triangles-cta-we-2
  title: Exact trigonometry in a 30° ramp model
  prompt: |
    A straight ramp makes a $30°$ angle with level ground. Its horizontal run is $12\sqrt{3}$ meters. Find the vertical rise and ramp length. Verify the three side lengths without decimal approximation.
  steps:
  - id: aops-triangles-cta-we-2-s1
    title: Assign trig roles and solve for the rise
    prompt: 'Label the run as adjacent, the rise as opposite, and the ramp as hypotenuse relative to the $30°$ angle. Then write and solve the tangent equation for the rise.'
    difficultyDimensions:
    - Correct role assignment relative to the ground angle.
    - Write $\tan(30°) = \text{rise}/\text{run}$.
    - Substitute $\tan(30°) = 1/\sqrt{3}$ and solve.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Run (adjacent) $= 12\sqrt{3}$, rise (opposite) $= h$, ramp (hypotenuse) $= L$.
      - '$\tan(30°) = h/(12\sqrt{3}) = 1/\sqrt{3}$.'
      - '$h = 12\sqrt{3}/\sqrt{3} = 12$ meters.'
    explanation: |
      Solution:
      Working from the $30°$ ground angle:
      - **Adjacent** (along the ground): the horizontal run $= 12\sqrt{3}$
      - **Opposite** (across from the angle): the vertical rise $= h$
      - **Hypotenuse** (opposite the right angle): the ramp $= L$
      
      Tangent compares opposite to adjacent:
      $$\tan(30°) = \frac{h}{12\sqrt{3}}$$
      Using the exact value $\tan(30°) = \frac{1}{\sqrt{3}}$:
      $$\frac{1}{\sqrt{3}} = \frac{h}{12\sqrt{3}} \implies h = \frac{12\sqrt{3}}{\sqrt{3}} = 12 \text{ meters}$$

      Why it works:
      The choice of tangent is deliberate: it directly relates the unknown (rise) to the known (run) without involving the ramp at all. Using sine instead would introduce two unknowns in one equation.
  - id: aops-triangles-cta-we-2-s2
    title: Find the ramp length using sine
    prompt: 'Now that the rise is known, find the ramp length $L$ using the sine ratio.'
    difficultyDimensions:
    - Write $\sin(30°) = \text{rise}/\text{ramp} = h/L$.
    - Substitute $h = 12$ and $\sin(30°) = 1/2$.
    - Solve for $L$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$\sin(30°) = 12/L = 1/2$.'
      - '$L = 24$ meters.'
    explanation: |
      Solution:
      Sine compares opposite to hypotenuse:
      $$\sin(30°) = \frac{h}{L} = \frac{12}{L}$$
      Using $\sin(30°) = \frac{1}{2}$:
      $$\frac{1}{2} = \frac{12}{L} \implies L = 24 \text{ meters}$$

      Why it works:
      Alternatively, once we know both legs ($12$ and $12\sqrt{3}$), we could use the Pythagorean theorem: $\sqrt{12^2 + (12\sqrt{3})^2} = \sqrt{144 + 432} = \sqrt{576} = 24$. Both methods give 24, which we verify in the next step.
  - id: aops-triangles-cta-we-2-s3
    title: Verify via special-triangle ratio and Pythagoras
    prompt: 'Confirm the solution using both the $30°$-$60°$-$90°$ side ratio and the Pythagorean equation.'
    difficultyDimensions:
    - 'The $30°$-$60°$-$90°$ ratio is $1:\sqrt{3}:2$.'
    - 'Check that $12 : 12\sqrt{3} : 24$ simplifies to $1:\sqrt{3}:2$.'
    - Verify $12^2 + (12\sqrt{3})^2 = 24^2$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'Dividing by 12: $12:12\sqrt{3}:24 = 1:\sqrt{3}:2$ ✓ (matches the $30°$-$60°$-$90°$ template).'
      - '$12^2 + (12\sqrt{3})^2 = 144 + 432 = 576 = 24^2$ ✓.'
    explanation: |
      Solution:
      **Special-triangle ratio check:** Dividing the three sides $12$, $12\sqrt{3}$, $24$ by 12:
      $$1 : \sqrt{3} : 2$$
      This is the canonical $30°$-$60°$-$90°$ pattern (short leg : long leg : hypotenuse). ✓

      **Pythagorean check:**
      $$12^2 + (12\sqrt{3})^2 = 144 + 432 = 576 = 24^2 \checkmark$$
      Both verifications agree.

      Why it works:
      Two independent checks cross-validate the trigonometric work. The special-triangle check confirms the angle structure; the Pythagorean check confirms the numerical values. Together they ensure both the trig setup and the arithmetic are correct.

- id: aops-triangles-cta-we-3
  title: One 13-14-15 triangle, four area methods
  prompt: |
    A triangle has side lengths 13, 14, and 15. (a) Find its area using Heron's formula. (b) Derive the altitude to the side of length 14 and the inradius. (c) Find $\sin C$ where $C$ is the angle between sides 13 and 14, and verify that the sine-area formula gives the same area.
  steps:
  - id: aops-triangles-cta-we-3-s1
    title: Apply Heron's formula
    prompt: 'Verify the triangle exists, compute the semiperimeter, then evaluate Heron''s formula.'
    difficultyDimensions:
    - Check $13 + 14 > 15$ (only non-trivial inequality).
    - Compute $s = (13+14+15)/2$.
    - Evaluate $K = \sqrt{s(s-a)(s-b)(s-c)}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$13 + 14 = 27 > 15$ ✓. Triangle exists.'
      - '$s = 42/2 = 21$.'
      - '$K = \sqrt{21 \cdot 8 \cdot 7 \cdot 6} = \sqrt{7056} = 84$.'
    explanation: |
      Solution:
      The triangle inequality check: $13 + 14 = 27 > 15$. ✓
      Semiperimeter: $s = (13+14+15)/2 = 21$.
      Heron's formula with $(s-a, s-b, s-c) = (21-13, 21-14, 21-15) = (8, 7, 6)$:
      $$K = \sqrt{21 \cdot 8 \cdot 7 \cdot 6} = \sqrt{7056} = 84$$

      Why it works:
      $7056 = 7056$. To see why $\sqrt{7056} = 84$: factor as $21 \cdot 8 \cdot 7 \cdot 6 = (3 \cdot 7)(8)(7)(6) = 7^2 \cdot 3 \cdot 8 \cdot 6 = 7^2 \cdot 144$. So $\sqrt{7^2 \cdot 144} = 7 \cdot 12 = 84$. Keeping the factors visible (not multiplying them out prematurely) makes the arithmetic tractable.
  - id: aops-triangles-cta-we-3-s2
    title: Derive the altitude to side 14 and the inradius
    prompt: 'Use the area from step 1 and the formulas $K = \frac{1}{2}bh$ and $K = rs$ to find the altitude $h$ to base 14 and the inradius $r$.'
    difficultyDimensions:
    - Set $\frac{1}{2}(14)h = 84$ and solve for $h$.
    - Set $r \cdot 21 = 84$ and solve for $r$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$7h = 84 \implies h = 12$.'
      - '$r = 84/21 = 4$.'
    explanation: |
      Solution:
      **Altitude to side 14:** Using $K = \frac{1}{2}bh$ with base $b = 14$:
      $$84 = \frac{1}{2}(14)h = 7h \implies h = 12$$
      **Inradius:** Using $K = rs$ with $s = 21$:
      $$84 = r(21) \implies r = 4$$

      Why it works:
      Both formulas use the *same area* computed once by Heron's formula. This is the power of Heron's formula — once you have $K$, you can derive every other measurement of the triangle algebraically, without knowing any angles.
  - id: aops-triangles-cta-we-3-s3
    title: Recover sin C and verify with the included-angle formula
    prompt: 'Find $\sin C$ using $K = \frac{1}{2}ab\sin C$ with sides 13 and 14, then confirm this reproduces area 84.'
    difficultyDimensions:
    - Write $84 = \frac{1}{2}(13)(14)\sin C = 91\sin C$.
    - Solve for $\sin C$ and simplify.
    - Substitute back to verify $\frac{1}{2}(13)(14)\sin C = 84$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$91\sin C = 84 \implies \sin C = 84/91 = 12/13$.'
      - Verification: $\frac{1}{2}(13)(14)(12/13) = \frac{1}{2}(14)(12) = 84$ ✓.
      - Also verify $K = rs$: $(4)(21) = 84$ ✓.
    explanation: |
      Solution:
      Using the sine area formula $K = \frac{1}{2}ab\sin C$ with the two sides adjacent to angle $C$ being 13 and 14:
      $$84 = \frac{1}{2}(13)(14)\sin C = 91\sin C$$
      $$\sin C = \frac{84}{91} = \frac{12}{13}$$
      **Verification (sine formula):**
      $$\frac{1}{2}(13)(14)\left(\frac{12}{13}\right) = \frac{1}{2}(14)(12) = 84 \checkmark$$
      **Verification (inradius formula):**
      $$rs = (4)(21) = 84 \checkmark$$

      Why it works:
      Four formulas — Heron, base-height, included-angle sine, and inradius-semiperimeter — produce the same area. This agreement across four independent methods confirms both the numerical results and that the correct inputs were matched to each formula.

- id: aops-triangles-cta-we-4
  title: Circumradius via Heron and the Law of Sines
  prompt: |
    A triangle has sides $a = 7$, $b = 8$, $c = 9$. (a) Use Heron's formula to find the area $K$. (b) Apply the extended Law of Sines $\frac{a}{\sin A} = 2R$ to find the circumradius $R$.
  steps:
  - id: aops-triangles-cta-we-4-s1
    title: Compute the area with Heron's formula
    prompt: 'Find the semiperimeter and evaluate Heron''s formula for sides 7, 8, and 9.'
    difficultyDimensions:
    - Compute $s = (7+8+9)/2 = 12$.
    - Evaluate $K = \sqrt{s(s-a)(s-b)(s-c)} = \sqrt{12 \cdot 5 \cdot 4 \cdot 3}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$s = 12$.'
      - '$K = \sqrt{12 \cdot 5 \cdot 4 \cdot 3} = \sqrt{720} = 12\sqrt{5}$.'
    explanation: |
      Solution:
      Semiperimeter: $s = (7+8+9)/2 = 12$.
      $(s-a, s-b, s-c) = (12-7, 12-8, 12-9) = (5, 4, 3)$.
      $$K = \sqrt{12 \cdot 5 \cdot 4 \cdot 3} = \sqrt{720}$$
      Simplify $\sqrt{720} = \sqrt{144 \cdot 5} = 12\sqrt{5}$.
      The area is $K = 12\sqrt{5}$.

      Why it works:
      Factor before multiplying: $12 \cdot 4 = 48$ and $5 \cdot 3 = 15$, so $48 \cdot 15 = 720$. Alternatively, factor the product as $12 \cdot 5 \cdot 4 \cdot 3 = (4 \cdot 3)(4 \cdot 3)(5) = 12^2 \cdot 5 = 144 \cdot 5$ to extract the square root.
  - id: aops-triangles-cta-we-4-s2
    title: Find sin A using the area formula
    prompt: 'Use $K = \frac{1}{2}bc\sin A$ with sides $b = 8$, $c = 9$ to find $\sin A$.'
    difficultyDimensions:
    - Set $\frac{1}{2}(8)(9)\sin A = 12\sqrt{5}$.
    - Simplify $36\sin A = 12\sqrt{5}$.
    - Solve for $\sin A$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$36\sin A = 12\sqrt{5}$.'
      - '$\sin A = \frac{12\sqrt{5}}{36} = \frac{\sqrt{5}}{3}$.'
    explanation: |
      Solution:
      The included angle $A$ is opposite side $a = 7$ and is between sides $b = 8$ and $c = 9$:
      $$K = \frac{1}{2}bc\sin A$$
      $$12\sqrt{5} = \frac{1}{2}(8)(9)\sin A = 36\sin A$$
      $$\sin A = \frac{12\sqrt{5}}{36} = \frac{\sqrt{5}}{3}$$

      Why it works:
      We use the area formula as a bridge between the known area and the unknown angle. This avoids the need for the Law of Cosines entirely. By isolating $\sin A$ from the area, we gain the trig ratio needed for the next step.
  - id: aops-triangles-cta-we-4-s3
    title: Apply the extended Law of Sines to find R
    prompt: 'Use $\frac{a}{\sin A} = 2R$ with $a = 7$ and $\sin A = \sqrt{5}/3$ to compute the circumradius $R$.'
    difficultyDimensions:
    - Write $2R = a/\sin A = 7 / (\sqrt{5}/3)$.
    - Simplify by multiplying by the reciprocal.
    - Rationalize if needed.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$2R = \frac{7}{\sqrt{5}/3} = \frac{21}{\sqrt{5}} = \frac{21\sqrt{5}}{5}$.'
      - '$R = \frac{21\sqrt{5}}{10}$.'
    explanation: |
      Solution:
      The extended Law of Sines states $\frac{a}{\sin A} = 2R$:
      $$2R = \frac{a}{\sin A} = \frac{7}{\sqrt{5}/3} = \frac{7 \cdot 3}{\sqrt{5}} = \frac{21}{\sqrt{5}} = \frac{21\sqrt{5}}{5}$$
      Therefore:
      $$R = \frac{21\sqrt{5}}{10}$$

      Why it works:
      The extended Law of Sines connects three quantities: a side length, its opposite angle, and the circumradius. Once we know any side and its opposite angle (or $\sin$ of that angle), we immediately have the circumradius. Alternatively, there is a direct formula $R = \frac{abc}{4K}$, which gives $\frac{7 \cdot 8 \cdot 9}{4 \cdot 12\sqrt{5}} = \frac{504}{48\sqrt{5}} = \frac{21}{2\sqrt{5}} = \frac{21\sqrt{5}}{10}$ — agreeing with our result.
