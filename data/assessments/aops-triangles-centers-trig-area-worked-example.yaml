workedExamples:
- id: aops-triangles-cta-problem-1
  title: All four centers in a 6-8-10 right triangle
  problem: |
    A right triangle has legs 6 and 8 and hypotenuse 10. Determine its circumradius, orthocenter location, inradius, and the distance from the right-angle vertex to the centroid along the median to the hypotenuse.
  steps:
  - id: aops-triangles-cta-p1-s1
    title: Match each center to its defining structure
    instruction: Separate distance-to-vertices, altitude, distance-to-sides, and median information before calculating.
    type: multipleChoice
    prompt: Which ordered list correctly matches circumcenter, orthocenter, incenter, and centroid?
    media:
    - type: image
      src: /assessments/aops/aops-triangles-four-centers.svg
      alt: Four panels show the circumcenter, orthocenter, incenter, and centroid with their defining line families.
      caption: Perpendicular bisectors, altitudes, angle bisectors, and medians answer different geometric questions.
    choices:
    - {id: a, text: 'vertices; altitudes; sides; medians'}
    - {id: b, text: 'sides; medians; vertices; altitudes'}
    - {id: c, text: 'altitudes; vertices; medians; sides'}
    - {id: d, text: 'medians; sides; altitudes; vertices'}
    answer: {choiceId: a}
    explanation: The circumcenter is equidistant from vertices, the orthocenter lies on altitudes, the incenter is equidistant from sides, and the centroid lies on medians.
  - id: aops-triangles-cta-p1-s2
    title: Use the right-triangle circumcenter theorem
    instruction: In a right triangle, the hypotenuse is a diameter of the circumcircle.
    type: multipleChoice
    prompt: What is the circumradius?
    choices:
    - {id: a, text: '$2$'}
    - {id: b, text: '$3$'}
    - {id: c, text: '$5$'}
    - {id: d, text: '$10$'}
    answer: {choiceId: c}
    explanation: The circumcenter is the midpoint of the length-10 hypotenuse, so its distance to each vertex is 5.
  - id: aops-triangles-cta-p1-s3
    title: Locate the orthocenter from perpendicular legs
    instruction: Recognize that each leg already lies perpendicular to the other leg.
    type: multipleChoice
    prompt: Where is the orthocenter?
    choices:
    - {id: a, text: At the right-angle vertex}
    - {id: b, text: At the hypotenuse midpoint}
    - {id: c, text: Outside every right triangle}
    - {id: d, text: At the midpoint of the shorter leg}
    answer: {choiceId: a}
    explanation: The two legs serve as altitudes, so their intersection is the right-angle vertex.
  - id: aops-triangles-cta-p1-s4
    title: Recover the inradius from area
    instruction: Compute $K$ and $s$, then solve $K=rs$.
    type: multipleChoice
    prompt: What is the inradius?
    choices:
    - {id: a, text: '$2$'}
    - {id: b, text: '$4$'}
    - {id: c, text: '$5$'}
    - {id: d, text: '$12$'}
    answer: {choiceId: a}
    explanation: $K=\tfrac12(6)(8)=24$ and $s=(6+8+10)/2=12$, so $r=24/12=2$.
  - id: aops-triangles-cta-p1-s5
    title: Use both right-triangle and centroid ratios
    instruction: First find the median from the right angle to the hypotenuse, then take the vertex-to-centroid fraction.
    type: freeResponse
    prompt: Find the distance from the right-angle vertex to the centroid and verify that the ratio is oriented correctly.
    answer:
      gradingMode: selfCheck
      expected: 'The midpoint of the hypotenuse is the circumcenter, so it is 5 units from every vertex. Therefore the median from the right-angle vertex to that midpoint has length 5. The centroid lies two thirds of the way from a vertex to the midpoint, so the requested distance is $(2/3)(5)=10/3$. The remaining centroid-to-midpoint segment is $5/3$, and $(10/3):(5/3)=2:1$, confirming the orientation.'
      keyPoints:
      - Uses the hypotenuse midpoint to obtain median length 5.
      - Takes two thirds from the vertex.
      - Obtains $10/3$.
      - Checks the remaining $5/3$ portion and the $2:1$ ratio.
    explanation: The centroid ratio is measured from the vertex; reversing it would incorrectly give one third of the median.
- id: aops-triangles-cta-problem-2
  title: Exact trigonometry in a ramp model
  problem: |
    A straight ramp makes a $30^\circ$ angle with level ground. Its horizontal run is $12\sqrt3$ meters. Find the vertical rise and ramp length, then verify the three side lengths without decimal approximation.
  steps:
  - id: aops-triangles-cta-p2-s1
    title: Label roles relative to the given angle
    instruction: Use the ground angle as the reference and name the run, rise, and ramp before selecting a ratio.
    type: multipleChoice
    prompt: Which role assignment is correct?
    media:
    - type: image
      src: /assessments/aops/aops-triangles-trigonometry.svg
      alt: Right triangle showing adjacent, opposite, and hypotenuse side roles relative to angle theta.
      caption: For the ground angle, run is adjacent, rise is opposite, and the ramp is the hypotenuse.
    choices:
    - {id: a, text: 'run = adjacent, rise = opposite, ramp = hypotenuse'}
    - {id: b, text: 'run = hypotenuse, rise = adjacent, ramp = opposite'}
    - {id: c, text: 'run = opposite, rise = hypotenuse, ramp = adjacent'}
    - {id: d, text: All three roles can be interchanged.}
    answer: {choiceId: a}
    explanation: The ramp is opposite the right angle, while the rise lies across from the $30^\circ$ ground angle.
  - id: aops-triangles-cta-p2-s2
    title: Select a ratio for the rise
    instruction: Choose the ratio containing the known adjacent side and unknown opposite side.
    type: multipleChoice
    prompt: Which equation directly finds the rise $h$?
    choices:
    - {id: a, text: '$\tan30^\circ=\frac{h}{12\sqrt3}$'}
    - {id: b, text: '$\sin30^\circ=\frac{12\sqrt3}{h}$'}
    - {id: c, text: '$\cos30^\circ=\frac{h}{12\sqrt3}$'}
    - {id: d, text: '$h+12\sqrt3=30$'}
    answer: {choiceId: a}
    explanation: Tangent compares opposite to adjacent, exactly the unknown rise and known horizontal run.
  - id: aops-triangles-cta-p2-s3
    title: Solve the exact rise
    instruction: Use $\tan30^\circ=1/\sqrt3$ and simplify radicals before interpreting units.
    type: multipleChoice
    prompt: What is the vertical rise?
    choices:
    - {id: a, text: '$4$ meters'}
    - {id: b, text: '$12$ meters'}
    - {id: c, text: '$12\sqrt3$ meters'}
    - {id: d, text: '$36$ meters'}
    answer: {choiceId: b}
    explanation: $h=(12\sqrt3)(1/\sqrt3)=12$ meters.
  - id: aops-triangles-cta-p2-s4
    title: Find the hypotenuse with a second ratio
    instruction: Use sine with the now-known opposite side or cosine with the original adjacent side.
    type: multipleChoice
    prompt: What is the ramp length $L$?
    choices:
    - {id: a, text: '$12$ meters'}
    - {id: b, text: '$18$ meters'}
    - {id: c, text: '$24$ meters'}
    - {id: d, text: '$24\sqrt3$ meters'}
    answer: {choiceId: c}
    explanation: $\sin30^\circ=12/L=1/2$, so $L=24$ meters.
  - id: aops-triangles-cta-p2-s5
    title: Verify with special-triangle structure and Pythagoras
    instruction: Check both the $30$-$60$-$90$ ratio and the squared side equation.
    type: freeResponse
    prompt: Give both exact verifications.
    answer:
      gradingMode: selfCheck
      expected: 'The sides are $12$, $12\sqrt3$, and $24$. They have the $1:\sqrt3:2$ ratio after dividing by 12, which is the $30$-$60$-$90$ pattern. Also $12^2+(12\sqrt3)^2=144+432=576=24^2$. Both checks confirm the rise and ramp length.'
      keyPoints:
      - Lists the three exact side lengths.
      - Identifies the $1:\sqrt3:2$ ratio.
      - Verifies the Pythagorean equation.
      - Avoids unnecessary decimal approximation.
    explanation: Two independent structures confirm that the side roles and trigonometric equations were assigned correctly.
- id: aops-triangles-cta-problem-3
  title: One 13-14-15 triangle, four area methods
  problem: |
    A triangle has side lengths 13, 14, and 15. Find its area with Heron formula. Then find the altitude to the side of length 14, the inradius, and the sine of the angle between the sides of lengths 13 and 14. Use the later results to reproduce the same area.
  steps:
  - id: aops-triangles-cta-p3-s1
    title: Check existence and compute semiperimeter
    instruction: Verify the strict triangle inequality before placing the side lengths into Heron formula.
    type: multipleChoice
    prompt: Which statement is correct?
    media:
    - type: image
      src: /assessments/aops/aops-triangles-area-methods.svg
      alt: Three triangle panels illustrating base-height, included-angle, Heron, and inradius area methods.
      caption: The 13-14-15 data begin in the three-side panel and later support every displayed method.
    choices:
    - {id: a, text: 'The triangle exists and $s=21$.'}
    - {id: b, text: 'The triangle exists and $s=42$.'}
    - {id: c, text: 'The triangle is degenerate because $13+14=15$.'}
    - {id: d, text: 'The triangle cannot be tested without an angle.'}
    answer: {choiceId: a}
    explanation: The two shorter sides satisfy $13+14>15$, and $s=(13+14+15)/2=21$.
  - id: aops-triangles-cta-p3-s2
    title: Apply Heron formula carefully
    instruction: Keep the four factors visible so arithmetic errors can be checked.
    type: multipleChoice
    prompt: What area does Heron formula give?
    choices:
    - {id: a, text: '$42$'}
    - {id: b, text: '$72$'}
    - {id: c, text: '$84$'}
    - {id: d, text: '$168$'}
    answer: {choiceId: c}
    explanation: $K=\sqrt{21(8)(7)(6)}=\sqrt{7056}=84$ square units.
  - id: aops-triangles-cta-p3-s3
    title: Recover a matching altitude
    instruction: Use side 14 as the base in $K=\tfrac12bh$.
    type: multipleChoice
    prompt: What is the altitude to the side of length 14?
    choices:
    - {id: a, text: '$6$'}
    - {id: b, text: '$12$'}
    - {id: c, text: '$14$'}
    - {id: d, text: '$24$'}
    answer: {choiceId: b}
    explanation: $84=\tfrac12(14)h=7h$, so $h=12$.
  - id: aops-triangles-cta-p3-s4
    title: Recover the inradius
    instruction: Use the already verified semiperimeter rather than the full perimeter.
    type: multipleChoice
    prompt: What is the inradius?
    choices:
    - {id: a, text: '$2$'}
    - {id: b, text: '$4$'}
    - {id: c, text: '$6$'}
    - {id: d, text: '$21$'}
    answer: {choiceId: b}
    explanation: From $K=rs$, $84=r(21)$, so $r=4$.
  - id: aops-triangles-cta-p3-s5
    title: Recover an included-angle sine and close the loop
    instruction: Place sides 13 and 14 around their included angle $C$ in $K=\tfrac12ab\sin C$.
    type: freeResponse
    prompt: Find $\sin C$ and show that both the sine formula and $K=rs$ reproduce area 84.
    answer:
      gradingMode: selfCheck
      expected: 'Using the included sides 13 and 14, $84=\tfrac12(13)(14)\sin C=91\sin C$, so $\sin C=84/91=12/13$. Substitution gives $\tfrac12(13)(14)(12/13)=84$. The inradius check gives $rs=(4)(21)=84$. Thus Heron, base-height, included-angle sine, and inradius-semiperimeter methods all agree.'
      keyPoints:
      - Solves $91\sin C=84$.
      - Simplifies to $\sin C=12/13$.
      - Recomputes area 84 with the sine formula.
      - Recomputes area 84 from $rs$.
    explanation: Agreement across four formulas confirms both the arithmetic and the correct matching of each formula to its inputs.
