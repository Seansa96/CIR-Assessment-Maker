workedExamples:
- id: reinforcement-acoustics-we1
  title: Compare sound intensity levels
  problem: A listener moves from $r_1=2.0\,\mathrm m$ to $r_2=6.0\,\mathrm m$ from an isotropic point source.
  steps:
  - id: reinforcement-acoustics-we1-s1
    title: Scale the intensity
    instruction: Use inverse-square spreading for the same source power.
    hint: $I\propto1/r^2$.
    type: multipleChoice
    prompt: What is the ratio $I_2/I_1$?
    choices:
    - { id: a, text: '$1/9$' }
    - { id: b, text: '$1/3$', issueSignals: [{ id: physics1-sound-distance-linear, domains: [physics-1] }] }
    - { id: c, text: '$3$', issueSignals: [{ id: physics1-sound-distance-direction, domains: [physics-1] }] }
    - { id: d, text: '$9$', issueSignals: [{ id: physics1-sound-inverse-square-reversal, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $I_2/I_1=(r_1/r_2)^2=(2/6)^2=1/9$. Why it works: Spherical spreading distributes the same power over area proportional to $r^2$. Why the other choices fail: use linear scaling, reverse the trend, or omit the inverse.'
  - id: reinforcement-acoustics-we1-s2
    title: Convert the intensity change to decibels
    instruction: Apply $\Delta\beta=10\log_{10}(I_2/I_1)$.
    hint: $\log_{10}(1/9)=-\log_{10}9$.
    type: multipleChoice
    prompt: What is the approximate level change?
    choices:
    - { id: a, text: '$-9.5\,\mathrm{dB}$' }
    - { id: b, text: '$-3.0\,\mathrm{dB}$', issueSignals: [{ id: physics1-sound-db-ratio-error, domains: [physics-1] }] }
    - { id: c, text: '$+9.5\,\mathrm{dB}$', issueSignals: [{ id: physics1-sound-db-sign, domains: [physics-1] }] }
    - { id: d, text: '$-90\,\mathrm{dB}$', issueSignals: [{ id: physics1-sound-db-factor, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $10\log_{10}(1/9)\approx-9.5\,\mathrm{dB}$. Why it works: A ninefold intensity decrease is negative on the logarithmic scale. Why the other choices fail: use the wrong logarithm, sign, or factor of ten.'
- id: reinforcement-acoustics-we2
  title: Analyze a moving-source Doppler shift
  problem: A stationary listener hears a source of frequency $f=500\,\mathrm{Hz}$ moving toward the listener at $v_s=30\,\mathrm{m/s}$; take sound speed $v=330\,\mathrm{m/s}$.
  steps:
  - id: reinforcement-acoustics-we2-s1
    title: Select the Doppler relation
    instruction: Decide which source-motion formula applies to an approaching source.
    hint: Wavefronts are compressed in front of an approaching source.
    type: multipleChoice
    prompt: Which expression gives the observed frequency?
    choices:
    - { id: a, text: '$f_{\mathrm{obs}}=f\,v/(v-v_s)$' }
    - { id: b, text: '$f_{\mathrm{obs}}=f\,v/(v+v_s)$', issueSignals: [{ id: physics1-doppler-approach-sign, domains: [physics-1] }] }
    - { id: c, text: '$f_{\mathrm{obs}}=f\,(v-v_s)/v$', issueSignals: [{ id: physics1-doppler-inversion, domains: [physics-1] }] }
    - { id: d, text: '$f_{\mathrm{obs}}=f+v_s$', issueSignals: [{ id: physics1-doppler-units, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: For an approaching source and stationary listener, $f_{\mathrm{obs}}=fv/(v-v_s)$. Why it works: The source reduces the spacing between successive wavefronts. Why the other choices fail: reverse compression, invert the ratio, or add quantities with incompatible units.'
  - id: reinforcement-acoustics-we2-s2
    title: Evaluate and interpret
    instruction: Substitute the speeds and decide whether the shift is upward or downward.
    hint: Compute $500(330)/(330-30)$.
    type: multipleChoice
    prompt: What does the listener hear?
    choices:
    - { id: a, text: '$550\,\mathrm{Hz}$, higher than the source frequency' }
    - { id: b, text: '$455\,\mathrm{Hz}$, lower than the source frequency', issueSignals: [{ id: physics1-doppler-approach-interpretation, domains: [physics-1] }] }
    - { id: c, text: '$530\,\mathrm{Hz}$, because add $v_s$ to $f$', issueSignals: [{ id: physics1-doppler-speed-frequency-mix, domains: [physics-1] }] }
    - { id: d, text: '$500\,\mathrm{Hz}$, because only listeners can cause a shift', issueSignals: [{ id: physics1-doppler-source-motion-omission, domains: [physics-1] }] }
    answer: { choiceId: a }
    explanation: 'Solution: $f_{\mathrm{obs}}=500(330/300)=550\,\mathrm{Hz}$. Why it works: Approaching wavefronts are closer together, so the observed frequency rises. Why the other choices fail: use recession, mix speed with frequency, or omit source motion.'
