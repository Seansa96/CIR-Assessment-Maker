lesson:
  introduction: The theorem answers separate questions about whether an IVP has a solution and whether nearby solutions
    are forced to agree.
  sections:
  - id: s1
    title: Open rectangles around initial data
    required: true
    content: The standard theorem examines an open rectangle containing $(x_0,y_0)$ on which the right side and,
      for uniqueness, its $y$ derivative are continuous.
    media:
    - type: image
      src: /media/ede/ch02-existence-uniqueness-rectangles.svg
      alt: Open rectangle showing continuity regions, an initial point, and local existence and uniqueness conclusions.
      caption: Use the relationships in the diagram to select and verify the next step.
    check:
      id: q001
      type: multipleChoice
      prompt: For $f=(x+y)/(x-y)$ at $(1,0)$, which obstacle must a valid rectangle avoid?
      skills:
      - ede-ch02-first-order-equations-existence-uniqueness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-existence-uniqueness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The denominator vanishes precisely on $x=y$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The line $x=y$
      - id: b
        text: The line $x=0$
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: The line $y=0$
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: The circle $x^2+y^2=1$
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Existence and uniqueness are separate
    required: true
    content: Continuity of $f$ gives local existence. Continuity of both $f$ and $f_y$ gives the standard sufficient
      local uniqueness conclusion.
    media: []
    check:
      id: q002
      type: multipleChoice
      prompt: If $f$ is continuous but $f_y$ is not continuous near the initial point, what follows from this test?
      skills:
      - ede-ch02-first-order-equations-existence-uniqueness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-existence-uniqueness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The two parts of the theorem have different hypotheses and conclusions.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Existence is guaranteed, but this test gives no uniqueness conclusion
      - id: b
        text: No solution exists
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Multiple solutions are proved
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: A global unique solution is guaranteed
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s3
    title: Sufficient is not necessary
    required: true
    content: A failed hypothesis means the theorem is silent; it does not establish the negation of its conclusion.
      Another argument may still prove uniqueness.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: The standard $f_y$ condition fails. Which statement is logically valid?
      skills:
      - ede-ch02-first-order-equations-existence-uniqueness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-existence-uniqueness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Failure of a sufficient condition is not proof that uniqueness fails.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The theorem does not decide uniqueness
      - id: b
        text: The IVP has infinitely many solutions
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: The IVP has no solutions
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Every solution blows up
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Local versus global conclusions
    required: true
    content: The theorem guarantees a solution on some interval around $x_0$, not necessarily the whole coefficient
      domain and not necessarily the largest interval of existence.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: What does a local uniqueness theorem guarantee?
      skills:
      - ede-ch02-first-order-equations-existence-uniqueness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-existence-uniqueness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The conclusion is explicitly local around the initial input.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: Agreement on some open interval containing $x_0$
      - id: b
        text: A formula on all real numbers
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: No later singularity
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: A closed interval including every boundary
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s5
    title: Actual nonuniqueness
    required: true
    content: For $y'=3y^{2/3}$ with $y(0)=0$, both $y=0$ and $y=x^3$ solve the IVP. Direct verification, not merely
      theorem failure, proves nonuniqueness.
    media: []
    check:
      id: q005
      type: multipleChoice
      prompt: Which pair directly proves nonuniqueness for $y'=3y^{2/3}$, $y(0)=0$?
      skills:
      - ede-ch02-first-order-equations-existence-uniqueness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-existence-uniqueness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Both candidates satisfy the equation and initial value but differ immediately.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $y=0$ and $y=x^3$
      - id: b
        text: $y=x$ and $y=-x$
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $y=1$ and $y=e^x$
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $y=x^2$ and $y=2x^2$
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Branching and largest uniqueness intervals
    required: true
    content: A solution may be unique until it reaches a state where the uniqueness hypotheses fail, after which
      distinct continuations can branch. The largest uniqueness interval can therefore be smaller than the formula's
      domain.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: Why can two continuations branch after meeting $y=0$ in $y'=3y^{2/3}$?
      skills:
      - ede-ch02-first-order-equations-existence-uniqueness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-existence-uniqueness
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The standard local uniqueness protection fails at $y=0$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $f_y=2y^{-1/3}$ is singular there
      - id: b
        text: The equation becomes second order
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: The independent variable disappears
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Every equilibrium must be crossed
        issueSignals:
        - id: ede-local-global-theorem-confusion
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
