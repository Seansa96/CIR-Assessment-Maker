modeDefault: practice
randomizeQuestions: false
workedExamples:
- id: ex-drag-power
  title: Mechanical Energy Loss to Drag
  problem: |
    Let's prove that the rate at which mechanical energy is lost due to linear drag is proportional to the square of the velocity ($dE/dt = -bv^2$).
  steps:
  - id: step-1
    title: Step 1 — Mechanical Power Definition
    instruction: |
      Start with the definition of mechanical power delivered by a force: $P = \vec F \cdot \vec v$.
      The linear drag force is $\vec F_d = -b\vec v$.
    type: symbolicResponse
    prompt: Substitute $\vec F_d$ into the power equation and evaluate the dot product. What does $P_d$ equal?
    answer:
      gradingMode: auto
      expectedLatex: -bv^2
      equivalenceMode: expression
      tolerance: 0
    explanation: $P_d = (-b\vec v) \cdot \vec v = -b(\vec v \cdot \vec v) = -bv^2$. The power delivered by drag is negative, meaning drag continuously does negative work on the object.
  - id: step-2
    title: Step 2 — Link to Energy
    instruction: |
      Since drag is a nonconservative force, the rate of work done by drag is the rate of change of mechanical energy of the system.
    type: multipleChoice
    prompt: Which of the following equations correctly expresses this relationship?
    choices:
    - id: a
      text: $dE_{\text{mech}}/dt = P_d$
    - id: b
      text: $dE_{\text{mech}}/dt = -P_d$
    - id: c
      text: $dE_{\text{mech}}/dt = P_d \times t$
    answer:
      choiceId: a
    explanation: 'Power is simply the rate of doing work or changing energy: $P = dW/dt = dE/dt$.'
  - id: step-3
    title: Step 3 — Final Conclusion
    instruction: |
      Combining these, we get $dE_{\text{mech}}/dt = -bv^2$.
    type: multipleChoice
    prompt: What does the negative sign in $-bv^2$ indicate physically?
    choices:
    - id: a
      text: Mechanical energy is being added to the object.
    - id: b
      text: Mechanical energy is being removed from the object and dissipated as heat/turbulence.
    - id: c
      text: The object is moving backwards.
    answer:
      choiceId: b
    explanation: A negative rate of change means the total amount of mechanical energy ($K+U$) is continuously decreasing.
