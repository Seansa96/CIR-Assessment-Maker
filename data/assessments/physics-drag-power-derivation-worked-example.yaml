modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: ex-linear-drag-power
    title: Linear drag power
    problem: 'Derive the instantaneous power delivered by linear drag $\vec F_d=-b\vec v$.'
    steps:
      - id: ld-1
        title: Substitute force into power
        instruction: 'Start with $P=\vec F\cdot\vec v$.'
        type: symbolicResponse
        prompt: 'Write the drag power in terms of $b$ and speed $v$.'
        answer: { gradingMode: auto, expectedLatex: '-b v^2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $P_d=(-b\vec v)\cdot\vec v=-bv^2$.\n\nWhy it works: $\vec v\cdot\vec v=v^2$.'
      - id: ld-2
        title: Interpret the sign
        instruction: 'Use the sign of power to describe energy transfer.'
        type: multipleChoice
        prompt: 'For $b>0$ and nonzero speed, the drag power is:'
        choices: [{ id: a, text: 'negative' }, { id: b, text: 'positive' }]
        answer: { choiceId: a }
        explanation: 'Solution: $-bv^2<0$.\n\nWhy it works: Drag opposes velocity and removes mechanical energy.\n\nWhy the other choices fail: Positive power would add energy to the moving object.'
  - id: ex-quadratic-drag-power
    title: Quadratic drag power
    problem: 'A drag force has magnitude $cv^2$ opposite the velocity. Find the magnitude of the power dissipated at speed $v$.'
    steps:
      - id: qd-1
        title: Combine force and speed
        instruction: 'The force is antiparallel to the velocity.'
        type: symbolicResponse
        prompt: 'Write the signed power delivered by drag.'
        answer: { gradingMode: auto, expectedLatex: '-c v^3', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $P=(-cv^2)v=-cv^3$.\n\nWhy it works: The force-velocity dot product uses the force component along the motion, which is negative.'
      - id: qd-2
        title: State dissipation magnitude
        instruction: 'Dissipation magnitude is the positive rate at which mechanical energy is removed.'
        type: symbolicResponse
        prompt: 'What is the positive magnitude of the dissipated power?'
        answer: { gradingMode: auto, expectedLatex: 'c v^3', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: The magnitude is $|P|=cv^3$.\n\nWhy it works: Magnitude removes the negative sign that indicates direction of energy transfer.'
