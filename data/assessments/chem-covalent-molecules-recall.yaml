title: Covalent Molecules and Bonding Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
  - chem-covalent-molecules
skills:
  - chem-covalent-molecules
  - chem-covalent-bonds
modeDefault: practice
items:
  - id: item-001
    type: flashcard
    prompt: What is a sigma (σ) bond?
    answer:
      expected: |
      A covalent bond formed by **end-to-end (head-on) overlap** of orbitals directly along the internuclear axis. Every single bond is a σ bond. Atoms can freely rotate around a σ bond.
  - id: item-002
    type: flashcard
    prompt: What is a pi (π) bond?
    answer:
      expected: |
      A covalent bond formed by **side-to-side (lateral) overlap** of p orbitals above and below the internuclear axis. Pi bonds exist only in double and triple bonds. Rotation around a π bond is restricted (would break the overlap).
  - id: item-003
    type: flashcard
    prompt: How many σ and π bonds are in a single bond, a double bond, and a triple bond?
    answer:
      expected: |
      - **Single bond:** 1 σ, 0 π
      - **Double bond:** 1 σ + 1 π
      - **Triple bond:** 1 σ + 2 π
  - id: item-004
    type: flashcard
    prompt: As bond order increases (single → double → triple), what happens to bond length and bond energy?
    answer:
      expected: |
      - **Bond length decreases** (nuclei pulled closer by more shared electrons)
      - **Bond energy increases** (more energy required to break a stronger bond)

      Example (C—C bonds): single ~154 pm / 347 kJ; double ~134 pm / 614 kJ; triple ~120 pm / 839 kJ.
  - id: item-005
    type: flashcard
    prompt: 'What is the bond order of N₂?'
    answer:
      expected: |
      **3** (triple bond: N≡N). Nitrogen has 5 valence electrons each; both need 3 more for an octet, so they share 3 pairs. N₂ has bond order = 3, bond length ≈ 110 pm, and is the strongest common diatomic bond (~945 kJ/mol).
  - id: item-006
    type: flashcard
    prompt: 'What formula estimates ΔH using bond energies?'
    answer:
      expected: |
      $$\Delta H \approx \sum D(\text{bonds broken}) - \sum D(\text{bonds formed})$$

      where $D$ = bond dissociation energy (always positive). Energy is **absorbed** breaking bonds and **released** forming bonds. A negative result means exothermic.
  - id: item-007
    type: flashcard
    prompt: 'How many σ and π bonds are in CO₂ (O=C=O)?'
    answer:
      expected: |
      **2 σ bonds, 2 π bonds**

      Each C=O double bond contains 1 σ + 1 π. Two C=O bonds → 2σ + 2π total.
  - id: item-008
    type: flashcard
    prompt: 'How many σ and π bonds are in N₂ (N≡N)?'
    answer:
      expected: |
      **1 σ bond, 2 π bonds**

      One triple bond = 1σ + 2π.
  - id: item-009
    type: flashcard
    prompt: 'How many σ and π bonds are in acetylene (HC≡CH)?'
    answer:
      expected: |
      **3 σ bonds, 2 π bonds**

      - H—C: 1σ
      - C≡C: 1σ + 2π
      - C—H: 1σ

      Total: 3σ, 2π.
  - id: item-010
    type: flashcard
    prompt: Why is covalent bond energy always positive in bond dissociation tables?
    answer:
      expected: |
      Bond dissociation energy (D) is defined as the energy required to **break** a bond — this always requires an input of energy (endothermic), so D is always positive. When bonds form (reverse process), the same amount of energy is **released**.

