sections:
  - id: layers
    title: The Four Layers of the Box
    content: |
      Every HTML element on a webpage is fundamentally a rectangular box. The CSS Box Model describes the four layers that make up this box, from the inside out:
      
      1. **Content**: The actual content of the element (text, images).
      2. **Padding**: Transparent space immediately surrounding the content.
      3. **Border**: A visible line that wraps around the padding.
      4. **Margin**: Transparent space outside the border that pushes other elements away.
  - id: content-box-vs-border-box
    title: The `box-sizing` Problem
    content: |
      By default, CSS uses the `content-box` sizing model. If you set `width: 200px;` and `padding: 20px;`, the browser makes the *content* 200px wide, adds 20px of padding to the left and right, and the element's actual footprint becomes **240px wide**.
      
      This makes building grid layouts incredibly frustrating because elements keep overflowing their containers.
      
      **The Solution: `border-box`**
      If you set `box-sizing: border-box;`, the browser forces the padding and borders *inside* the width you specified. A 200px wide element with 20px padding will have a 160px content area, and its total footprint will remain exactly **200px**.
  - id: margin-collapse
    title: Margin Collapsing
    content: |
      When the vertical margins (top and bottom) of two adjacent block-level elements touch, they **collapse** into a single margin. The size of this single margin is equal to the *larger* of the two margins.
      
      For example, if Element A has a bottom margin of `30px` and Element B has a top margin of `20px`, the gap between them will be `30px` (not `50px`).
lesson:
  introduction: The Box Model
  sections:
    - id: sec-q1
      title: Check Your Understanding
      content: Review the box-sizing models.
      check:
        id: check-q1
        type: multipleChoice
        prompt: "Why is `box-sizing: border-box;` considered a best practice for modern CSS?"
        choices:
          - id: a
            text: It removes the need for margins entirely.
          - id: b
            text: It makes calculating the final physical dimensions of an element much easier and predictable.
          - id: c
            text: It forces borders to be rounded by default.
        answer:
          choiceId: b
        explanation: |
          By ensuring that padding and borders are included in the element's specified width, `border-box` prevents elements from unexpectedly growing and breaking layouts.
