- id: notes-exp-point-one-error
  title: How many terms approximate $e^{0.1}$?
  problem: Choose enough Maclaurin terms for $e^x$ to approximate $e^{0.1}$ within $0.00001$.
  steps:
  - id: notes-exp-point-one-final
    title: Bound the first omitted term
    instruction: For $e^x$ at $x=0.1$, all positive terms decrease; check the first omitted term against the requested tolerance.
    hint: 
    type: freeResponse
    prompt: What degree is sufficient, and how many terms are used?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - $e^{0.1}\frac{0.1^4}{4!}<0.00001$.
      - Degree $3$; four terms through $x^3/3!$.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: For $T_3$, the Lagrange remainder has $M=e^{0.1}$ on $[0,0.1]$, so


      $$|R_3(0.1)|\le e^{0.1}\frac{0.1^4}{4!}\approx4.60\times10^{-6}<10^{-5}.$$


      Thus $T_3(0.1)$, using four terms from $n=0$ through $n=3$, is sufficient.


      Why it works: The fourth derivative of $e^x$ is $e^x$, and $e^x\le e^{0.1}$ on the interval from the center to the target. The Lagrange remainder then gives a rigorous error bound.
