- id: notes-sine-one-bounds
  title: Compare two error bounds for $\sin(1)$
  problem: For $T_3(x)=x-x^3/3!$, compare the Taylor-remainder and alternating-series error bounds when approximating $\sin(1)$.
  steps:
  - id: notes-sine-one-final
    title: Use both appropriate error tools
    instruction: Bound $|f^{(4)}|$ by $1$ for the Lagrange form, then compare with the first omitted alternating-series term.
    hint: 
    type: freeResponse
    prompt: Give both bounds and say which is sharper.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: selfCheck
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 
      tolerance: 
      media: []
      keyPoints:
      - 'Taylor remainder: $|R_3(1)|\le1/4!=1/24$.'
      - 'Alternating-series bound: $|R_3(1)|\le1/5!=1/120$.'
      - The alternating bound is sharper.
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: Since $|\sin x|\le1$,


      $$|R_3(1)|\le\frac{1}{4!}=\frac1{24}.$$


      The alternating sine series has decreasing term magnitudes at $x=1$, so its error is at most the first omitted term:


      $$|R_3(1)|\le\frac1{5!}=\frac1{120}.$$


      Why it works: Both bounds are valid, but the alternating-series theorem uses more structure of this particular series and therefore gives the smaller bound.
