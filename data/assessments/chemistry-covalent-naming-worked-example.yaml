- id: we-cov-name-001
  title: Naming N2O4
  problem: What is the systematic name for the compound $N_2O_4$?
  steps:
  - id: step-we-cov-001
    title: Identify the elements and determine the type of compound.
    instruction: 'First, look at the elements involved. Nitrogen (N) and Oxygen (O) are both **non-metals**.

      When two non-metals combine, they form a **covalent** (or molecular) compound. We must use Greek prefixes to denote
      the number of atoms of each element.

      '
    type: freeResponse
    skills:
    - periodic-table-patterns
    - covalent-compounds-naming
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    explanation: "Solution: First, look at the elements involved. Nitrogen (N) and Oxygen (O) are both **non-metals**.\nWhen\
      \ two non-metals combine, they form a **covalent** (or molecular) compound. We must use Greek prefixes to denote the\
      \ number of atoms of each element.\n Why it works: A two-nonmetal formula uses prefixes to preserve the stated atom\
      \ counts."
  - id: step-we-cov-002
    title: Name the first element and apply its prefix.
    instruction: "The first element is Nitrogen, and there are 2 atoms ($N_2$). \nThe Greek prefix for 2 is \"di-\". \n\n\
      So, the first part of the name is **Dinitrogen**.\n(Note: We never use the prefix \"mono-\" for the first element, but\
      \ here it's \"di-\", so we include it).\n"
    type: freeResponse
    skills:
    - covalent-compounds-naming
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    explanation: "Solution: The first element is Nitrogen, and there are 2 atoms ($N_2$). \nThe Greek prefix for 2 is \"di-\"\
      . \n\nSo, the first part of the name is **Dinitrogen**.\n(Note: We never use the prefix \"mono-\" for the first element,\
      \ but here it's \"di-\", so we include it).\n Why it works: A two-nonmetal formula uses prefixes to preserve the stated\
      \ atom counts."
  - id: step-we-cov-003
    title: Name the second element, apply its prefix, and change the suffix.
    instruction: 'The second element is Oxygen, and there are 4 atoms ($O_4$).

      The prefix for 4 is "tetra-".

      The suffix of the second element always changes to "-ide", making it "oxide".


      Combining these gives "tetraoxide", but by convention we often drop the "a" when followed by "o" to make it easier to
      say: **tetroxide**.

      '
    type: freeResponse
    skills:
    - covalent-compounds-naming
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    explanation: "Solution: The second element is Oxygen, and there are 4 atoms ($O_4$).\nThe prefix for 4 is \"tetra-\".\n\
      The suffix of the second element always changes to \"-ide\", making it \"oxide\".\n\nCombining these gives \"tetraoxide\"\
      , but by convention we often drop the \"a\" when followed by \"o\" to make it easier to say: **tetroxide**.\n Why it\
      \ works: A two-nonmetal formula uses prefixes to preserve the stated atom counts."
  - id: step-we-cov-004
    title: Combine to form the full name.
    instruction: 'Combine the two parts to get the full name:

      **Dinitrogen tetroxide**.

      '
    type: multipleChoice
    skills:
    - covalent-compounds-naming
    prompt: What is the systematic name for $N_2O_4$?
    choices:
    - id: c1
      text: Nitrogen(II) oxide
    - id: c2
      text: Nitrogen tetroxide
    - id: c3
      text: Dinitrogen tetroxide
    - id: c4
      text: Binitrogen quadroxide
    answer:
      choiceId: c3
    explanation: "Solution: Combine the two parts to get the full name:\n**Dinitrogen tetroxide**.\n Why it works: A two-nonmetal\
      \ formula uses prefixes to preserve the stated atom counts."
- id: we-cov-name-002
  title: Writing the formula for Phosphorus pentachloride
  problem: What is the chemical formula for Phosphorus pentachloride?
  steps:
  - id: step-we-cov-005
    title: Identify the elements from the name.
    instruction: 'The name is "Phosphorus pentachloride".

      - "Phosphorus" corresponds to the element P.

      - "chloride" corresponds to the element Chlorine (Cl).

      '
    type: freeResponse
    skills:
    - covalent-compounds-naming
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    explanation: "Solution: The name is \"Phosphorus pentachloride\".\n- \"Phosphorus\" corresponds to the element P.\n- \"\
      chloride\" corresponds to the element Chlorine (Cl).\n Why it works: A two-nonmetal formula uses prefixes to preserve\
      \ the stated atom counts."
  - id: step-we-cov-006
    title: Determine subscripts from prefixes.
    instruction: '- "Phosphorus" has no prefix. When the first element has no prefix, it implies there is exactly **1** atom.

      - "penta-" is the prefix for **5**. So there are 5 chlorine atoms.

      '
    type: freeResponse
    skills:
    - covalent-compounds-naming
    prompt: Did you understand this step?
    answer:
      gradingMode: selfCheck
    explanation: "Solution: - \"Phosphorus\" has no prefix. When the first element has no prefix, it implies there is exactly\
      \ **1** atom.\n- \"penta-\" is the prefix for **5**. So there are 5 chlorine atoms.\n Why it works: A two-nonmetal formula\
      \ uses prefixes to preserve the stated atom counts."
  - id: step-we-cov-007
    title: Combine into the final formula.
    instruction: 'Combine the symbols and their numbers: $P$ (1) and $Cl$ (5).

      The number 1 is omitted in chemical formulas.

      Thus, the formula is **$PCl_5$**.

      '
    type: multipleChoice
    skills:
    - covalent-compounds-naming
    prompt: What is the formula for Phosphorus pentachloride?
    choices:
    - id: c1
      text: $PCl_5$
    - id: c2
      text: $P_5Cl$
    - id: c3
      text: $PCl_4$
    - id: c4
      text: $P_2Cl_5$
    answer:
      choiceId: c1
    explanation: "Solution: Combine the symbols and their numbers: $P$ (1) and $Cl$ (5).\nThe number 1 is omitted in chemical\
      \ formulas.\nThus, the formula is **$PCl_5$**.\n Why it works: A two-nonmetal formula uses prefixes to preserve the\
      \ stated atom counts."
