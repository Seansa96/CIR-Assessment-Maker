  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: Use the Sound Waves diagram and the model $v=f\lambda$. A calibrated scenario scales the reference
    values by 1.1. Determine the sound speed. Give a numerical answer.
  answer:
    value: 363.0
    tolerance: 3.630000000000001
  explanation: Apply $v=f\lambda$ consistently to the scaled scenario; the requested sound speed is 363.
  media:
