questions:
- id: q001
  difficultyDimensions: [modelOrDerivation, simplification]
  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: During a cool morning at 23.9 C... A tuning fork emits a 129.4 Hz tone.
    What is the wavelength of the sound wave in meters?
  answer:
    value: 2.6688
    tolerance: 0.05
  explanation: |
    Solution: $lambda=v/f=345.34/129.4=2.6688$ m.

    Why it works: A wave travels one wavelength each period, so speed equals wavelength times frequency.
- id: q002
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: In a desert environment with an air temperature of 1.0 C... A lightning
    strike is seen, and thunder is heard 12.91 s later. How far away is the strike
    in meters?
  answer:
    value: 4281.3
    tolerance: 0.05
  explanation: |
    Solution: $d=vt=(331.60)(12.91)=4281.3$ m.

    Why it works: The sound delay is travel time after the nearly instantaneous visible flash.
- id: q003
  difficultyDimensions: [modelOrDerivation, simplification]
  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: During a cool morning at -2.8 C... What is the approximate speed of sound
    in m/s?
  answer:
    value: 329.32
    tolerance: 0.05
  explanation: |
    Solution: $v=331+0.6T=331+0.6(-2.8)=329.32$ m/s.

    Why it works: In this approximation, sound speed in air rises with temperature.
- id: q004
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
  type: numericResponse
  skills:
  - physics-sound-waves
  prompt: In a desert environment with an air temperature of -4.1 C... A tuning fork
    emits a 614.7 Hz tone. What is the wavelength of the sound wave in meters?
  answer:
    value: 0.5345
    tolerance: 0.05
  explanation: |
    Solution: The temperature model gives $v=328.54$ m/s, then $lambda=v/f=328.54/614.7=0.5345$ m.

    Why it works: Temperature determines air sound speed, which is then divided by frequency for wavelength.
