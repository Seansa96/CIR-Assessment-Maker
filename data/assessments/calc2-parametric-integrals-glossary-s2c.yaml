glossary:
  introduction: 'These formulas only work after the parameter interval has been matched to the intended path.'
  sections:
    - id: pi-formulas
      title: Differential models
      required: true
      content: 'Parametric integration converts each Cartesian differential into a parameter differential.'
      entries:
        - { id: dx-parametric, term: Parametric differential, definition: 'The x differential expressed through the parameter.', notation: '$dx=x prime(t)dt$', examples: ['Use it in $\int y\,dx$.'], aliases: [chain-rule differential], media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Path with horizontal differential component }], tags: [area], drills: [{ id: dx-drill, type: cloze, prompt: 'For a parametric x-coordinate, $dx=$ ____ $dt$.', answer: { expected: 'dx dt', aliases: ['dx/dt'] }, explanation: 'Solution: dx equals dx/dt times dt. Why it works: This is the chain-rule differential. Common trap: Replacing dx by dt.' }] }
        - { id: parametric-speed, term: Parametric speed, definition: 'Magnitude of the velocity vector used in arc length.', notation: '$\sqrt{(x prime)^2+(y prime)^2}$', examples: ['Arc length is the integral of speed over t.'], aliases: [speed], media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Tangent velocity vector }], tags: [arc-length], drills: [{ id: speed-drill, type: flashcard, prompt: 'What expression is integrated for parametric arc length?', answer: { expected: 'square root of x prime squared plus y prime squared', aliases: ['sqrt x prime squared plus y prime squared'] }, explanation: 'Solution: Integrate the speed magnitude. Why it works: It is the length of the velocity vector. Common trap: Integrating the slope.' }] }
        - { id: one-trace, term: One-trace interval, definition: 'A parameter interval that traverses exactly the intended arch or loop once.', notation: '$t\in[a,b]$', examples: ['Use consecutive zeros or crossings for a loop.'], aliases: [minimal trace], media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: One arch marked by endpoints }], tags: [bounds], drills: [{ id: trace-drill, type: cloze, prompt: 'A path interval should trace the intended loop exactly ____ time.', answer: { expected: one, aliases: [once] }, explanation: 'Solution: The missing word is one. Why it works: Retacing doubles directed accumulation. Common trap: Taking a full period without checking multiplicity.' }] }
