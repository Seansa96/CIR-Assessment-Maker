workedExamples:
  - id: spiral-length
    title: Arc Length of a Spiral Segment
    problem: 'Set up the arc length of $r=2\theta$ on $0\le\theta\le1$.'
    steps:
      - { id: sl-1, title: 'Differentiate the radius', instruction: 'Find the radial rate.', type: numericResponse, prompt: 'What is dr/dtheta?', answer: { value: 2, tolerance: 0.000001 }, explanation: 'Solution: The derivative of 2 theta is 2. Why it works: Radius changes linearly with theta. Common trap: Using r itself as the derivative.' , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
      - { id: sl-2, title: 'Build polar speed', instruction: 'Substitute r and its derivative into the length formula.', type: multipleChoice, prompt: 'Which integrand is correct?', choices: [{ id: a, text: '$2\sqrt{1+\theta^2}$' }, { id: b, text: '$2\theta$' }, { id: c, text: '$4\theta^2$' }, { id: d, text: '$\sqrt{2\theta}$' }], answer: { choiceId: a }, explanation: 'Solution: $\sqrt{(2\theta)^2+2^2}=2\sqrt{1+\theta^2}$. Why it works: Polar speed combines angular-radius and radial-change terms. Common trap: Omitting dr/dtheta. Why the other choices fail: They omit the radical or one contribution.' , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
      - { id: sl-3, title: 'Evaluate with a standard antiderivative', instruction: 'Use the standard integral for square root of one plus theta squared.', type: freeResponse, prompt: 'State the exact length.', answer: { gradingMode: selfCheck, keyPoints: ['square root two plus ln one plus square root two'] }, explanation: 'Solution: $L=\sqrt2+\ln(1+\sqrt2)$. Why it works: Integrating $2\sqrt{1+\theta^2}$ gives theta square root one plus theta squared plus ln of theta plus the radical. Common trap: Treating the spiral as a circular arc.' , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
