randomizeQuestions: false
lesson:
  introduction: Introduction to Binary Search Trees
  sections:
  - id: sec1
    title: The Binary Search Tree Property
    required: true
    content: |
      A **Binary Search Tree (BST)** is a node-based binary tree data structure where each node has at most two children, referred to as the left child and the right child.
      
      The defining property of a BST is:
      * The left subtree of a node contains only nodes with keys strictly **less than** the node's key.
      * The right subtree of a node contains only nodes with keys strictly **greater than** the node's key.
      * Both the left and right subtrees must also be binary search trees.
    media:
      - type: image
        src: /media/dsa/bst.svg
        alt: "A visual representation of a Binary Search Tree with root node 8."
        caption: "Figure 1: Notice how every node in the left subtree of 8 is smaller than 8, and every node in the right subtree is larger."
    views: []
    controls: []
    check:
      id: q1
      type: multipleChoice
      prompt: "In the BST shown above, if we want to insert the value `7`, as which node's child will it be inserted?"
      choices:
        - id: a
          text: "Right child of 3"
        - id: b
          text: "Right child of 6"
        - id: c
          text: "Left child of 8"
        - id: d
          text: "Left child of 10"
      answer:
        choiceId: b
      explanation: |
        To insert `7`:
        1. Compare with root (`8`): `7 < 8`, go left to `3`.
        2. Compare with `3`: `7 > 3`, go right to `6`.
        3. Compare with `6`: `7 > 6`, go right. 
        Since `6` has no right child, `7` becomes the right child of `6`.
