schemaVersion: 1
id: physics2-ch08-capacitors-series-parallel-concept-lesson
title: Capacitors in Series and Parallel
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-capacitance
lesson:
  introduction: This lesson develops the main ideas behind Capacitors in Series and Parallel and connects
    them to the governing physical relationships.
  sections:
  - id: l2-sec1
    title: Capacitors in Parallel
    required: true
    content: 'When capacitors are connected in parallel, the potential difference $V$ across each is the
      same. The equivalent capacitance is the sum of the individual capacitances: $C_{eq} = C_1 + C_2
      + \dots$'
  - id: l2-sec2
    title: Capacitors in Series
    required: true
    content: 'When capacitors are connected in series, the magnitude of charge $Q$ on each is the same.
      The equivalent capacitance is found using reciprocals: $\frac{1}{C_{eq}} = \frac{1}{C_1} + \frac{1}{C_2}
      + \dots$'
