schemaVersion: 1
id: aops-triangles-olympiad-quiz
title: Triangles Olympiad Quiz
description: Contest-transfer problems combining enumeration, nested similarity, right-triangle projections, centers, and extremal area.
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-triangles
skills:
- Enumerate integer triangles without double counting
- Extract hidden similarity and isosceles consequences
- Combine projection, area, and center invariants
- Build concise geometric proofs
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags: [art-of-problem-solving, aops-triangles, geometry, olympiad, contest-transfer, triangle-proof, extremal-area]
questions:
- id: olympiad-quiz-q001
  type: multipleChoice
  prompt: How many unordered integer-sided nondegenerate triangles have perimeter 20?
  choices: [{id: a, text: '6'}, {id: b, text: '7'}, {id: c, text: '8'}, {id: d, text: '9'}]
  answer: {choiceId: c}
  explanation: With $a\le b\le c$, the eight triples are $(2,9,9),(3,8,9),(4,7,9),(4,8,8),(5,6,9),(5,7,8),(6,6,8),(6,7,7)$.
- id: olympiad-quiz-q002
  type: multipleChoice
  prompt: A triangle has side lengths $x$, $x+1$, and $2x-1$ and perimeter 40. Classify it by angles.
  choices: [{id: a, text: Acute}, {id: b, text: Right}, {id: c, text: Obtuse}, {id: d, text: Degenerate}]
  answer: {choiceId: c}
  explanation: The perimeter gives $4x=40$, so the sides are 10, 11, 19. They form a triangle, and $19^2=361>10^2+11^2=221$.
- id: olympiad-quiz-q003
  type: multipleChoice
  prompt: From vertex $A$, the same cevian is both a median and an internal angle bisector. What must follow?
  choices:
  - {id: a, text: '$AB=AC$'}
  - {id: b, text: '$AB=BC$'}
  - {id: c, text: The triangle is right at $A$.}
  - {id: d, text: The triangle is equilateral.}
  answer: {choiceId: a}
  explanation: The median makes the opposite segments equal; the angle-bisector theorem then forces $AB/AC=1$.
- id: olympiad-quiz-q004
  type: multipleChoice
  prompt: 'In $\triangle ABC$, $DE\parallel BC$ and $AD:DB=2:1$. Find $[ADE]$ divided by the area of trapezoid $DBCE$.'
  media:
  - type: image
    src: /assessments/aops/aops-triangles-similarity.svg
    alt: Triangle ABC with DE parallel to BC and a top triangle ADE above trapezoid DBCE.
  choices: [{id: a, text: '$2/3$'}, {id: b, text: '$4/5$'}, {id: c, text: '$4/9$'}, {id: d, text: '$5/4$'}]
  answer: {choiceId: b}
  explanation: The top triangle is $4/9$ of the whole, leaving $5/9$ for the trapezoid; their ratio is $4/5$.
- id: olympiad-quiz-q005
  type: multipleChoice
  prompt: A midpoint-parallel construction produces a triangle with linear scale $1/2$ of the original, and the construction is repeated inside that smaller triangle. What fraction of the original area is the second nested triangle?
  choices: [{id: a, text: '$1/4$'}, {id: b, text: '$1/8$'}, {id: c, text: '$1/16$'}, {id: d, text: '$1/32$'}]
  answer: {choiceId: c}
  explanation: Two successive length factors give total length factor $1/4$, so the area factor is $(1/4)^2=1/16$.
- id: olympiad-quiz-q006
  type: multipleChoice
  prompt: An altitude of length 12 divides a right triangle's hypotenuse in ratio $4:9$. Find the triangle's area.
  media:
  - type: image
    src: /assessments/aops/aops-triangles-altitude-hypotenuse.svg
    alt: Right triangle with altitude 12 to a hypotenuse split in ratio 4 to 9.
  choices: [{id: a, text: '$78$'}, {id: b, text: '$144$'}, {id: c, text: '$156$'}, {id: d, text: '$312$'}]
  answer: {choiceId: c}
  explanation: The segments are 8 and 18 because $12^2=(4k)(9k)$ gives $k=2$. Thus the hypotenuse is 26 and area is $\tfrac12(26)(12)=156$.
- id: olympiad-quiz-q007
  type: multipleChoice
  prompt: In the preceding projection configuration, what is the longer leg?
  choices: [{id: a, text: '$3\sqrt{13}$'}, {id: b, text: '$4\sqrt{13}$'}, {id: c, text: '$6\sqrt{13}$'}, {id: d, text: '$9\sqrt{13}$'}]
  answer: {choiceId: c}
  explanation: The longer leg is adjacent to segment 18, so its square is $26\cdot18=468=36\cdot13$.
- id: olympiad-quiz-q008
  type: multipleChoice
  prompt: An equilateral triangle has inradius 6. Find its area.
  choices: [{id: a, text: '$36\sqrt3$'}, {id: b, text: '$72\sqrt3$'}, {id: c, text: '$108\sqrt3$'}, {id: d, text: '$144\sqrt3$'}]
  answer: {choiceId: c}
  explanation: Its side is $2r\sqrt3=12\sqrt3$, so area is $(\sqrt3/4)(12\sqrt3)^2=108\sqrt3$.
- id: olympiad-quiz-q009
  type: multipleChoice
  prompt: A 9-40-41 right triangle has an incircle. How far from the right-angle vertex is either tangency point on the two legs?
  choices: [{id: a, text: '$4$'}, {id: b, text: '$9$'}, {id: c, text: '$20$'}, {id: d, text: '$41/2$'}]
  answer: {choiceId: a}
  explanation: The inradius is 4, and the small square at the right-angle corner has side length equal to the inradius; equal tangent segments give distance 4 on each leg.
- id: olympiad-quiz-q010
  type: multipleChoice
  prompt: In a 13-14-15 triangle, the altitude to the side of length 14 splits that side into two pieces. What is the shorter piece?
  choices: [{id: a, text: '$4$'}, {id: b, text: '$5$'}, {id: c, text: '$6$'}, {id: d, text: '$7$'}]
  answer: {choiceId: b}
  explanation: The area is 84, so the altitude is 12. The projection adjacent to side 13 is $\sqrt{13^2-12^2}=5$; the other is 9.
- id: olympiad-quiz-q011
  type: multipleChoice
  prompt: Two sides of a triangle are 10 and 14. What is the greatest possible area?
  choices: [{id: a, text: '$35$'}, {id: b, text: '$60$'}, {id: c, text: '$70$'}, {id: d, text: '$140$'}]
  answer: {choiceId: c}
  explanation: $K=70\sin C\le70$, with equality at included angle $90^\circ$.
- id: olympiad-quiz-q012
  type: multipleChoice
  prompt: Similar triangles have areas 144 and 225. A median in the smaller triangle has length 20. Find the corresponding median in the larger triangle.
  choices: [{id: a, text: '$24$'}, {id: b, text: '$25$'}, {id: c, text: '$30$'}, {id: d, text: '$125/4$'}]
  answer: {choiceId: b}
  explanation: The length ratio is $\sqrt{225/144}=15/12=5/4$, so the median is $20(5/4)=25$.
- id: olympiad-quiz-q013
  type: selectAll
  prompt: Which statements can each prove that a triangle is isosceles?
  choices:
  - {id: a, text: Two interior angles are congruent.}
  - {id: b, text: A median from a vertex is also its angle bisector.}
  - {id: c, text: An altitude from a vertex is also a median.}
  - {id: d, text: The triangle has one median.}
  answer: {choiceIds: [a, b, c]}
  explanation: Each of the first three gives a valid converse or congruence proof; every triangle has medians.
- id: olympiad-quiz-q014
  type: selectAll
  prompt: Which proof moves require an explicit hypothesis before use?
  choices:
  - {id: a, text: Use Pythagoras only after a right angle is known.}
  - {id: b, text: Use CPCTC only after triangle congruence is proved.}
  - {id: c, text: Use proportional sides only after similarity is proved or given.}
  - {id: d, text: Infer equal sides whenever a drawing looks symmetric.}
  answer: {choiceIds: [a, b, c]}
  explanation: Visual symmetry without markings or proof is not a theorem hypothesis.
- id: olympiad-quiz-q015
  type: freeResponse
  prompt: Prove that the three medians of a triangle are concurrent and that their intersection divides each median in a $2:1$ ratio from the vertex.
  answer:
    gradingMode: selfCheck
    expected: 'Place the triangle at vectors $A,B,C$. The midpoint of $BC$ is $(B+C)/2$. The point $G=(A+B+C)/3$ satisfies $G=A+(2/3)((B+C)/2-A)$, so it lies two thirds of the way from $A$ to the midpoint of $BC$. Cyclically, the same expression places $G$ two thirds of the way along the medians from $B$ and $C$. Thus all three medians pass through the same point $G$, and each is divided in the ratio $2:1$ from its vertex.'
    keyPoints:
    - Represents a side midpoint correctly.
    - Defines $G=(A+B+C)/3$.
    - Shows $G$ lies two thirds along one median.
    - Applies the symmetric argument to the other medians.
  explanation: The common affine average supplies both concurrency and the division ratio.
