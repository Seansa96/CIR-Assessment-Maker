questions:
  - id: q001
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \sin x\,dx
      $$
    answer:
      expectedLatex: -\cos x+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Since the derivative of $\cos x$ is $-\sin x$, the antiderivative of $\sin x$ is $-\cos x+C$.

      Related topic: Basic Sine Antiderivatives

  - id: q002
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \cos x\,dx
      $$
    answer:
      expectedLatex: \sin x+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      The derivative of $\sin x$ is $\cos x$.

      Related topic: Basic Cosine Antiderivatives

  - id: q003
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \sec^2 x\,dx
      $$
    answer:
      expectedLatex: \tan x+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      The derivative of $\tan x$ is $\sec^2 x$.

      Related topic: Tangent Antiderivatives

  - id: q004
    type: symbolicResponse
