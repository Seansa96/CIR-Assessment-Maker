  - id: q007
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \sin(3x)\,dx
      $$
    answer:
      expectedLatex: -\frac{1}{3}\cos(3x)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Account for the inner derivative $3$ by multiplying by $\frac{1}{3}$.

      Related topic: Chain Rule Reversal

  - id: q008
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \cos(5x)\,dx
      $$
    answer:
      expectedLatex: \frac{1}{5}\sin(5x)+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      The inner derivative is $5$, so the antiderivative includes a factor of $\frac{1}{5}$.

      Related topic: Chain Rule Reversal

  - id: q009
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int 2\sin x\cos x\,dx
      $$
    answer:
      expectedLatex: \sin^2 x+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Let $u=\sin x$. Then $du=\cos x\,dx$, giving $\sin^2 x+C$.

      Related topic: Simple Trigonometric Substitution

  - id: q010
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \sin^2 x\,dx
      $$
    answer:
      expectedLatex: \frac{x}{2}-\frac{\sin(2x)}{4}+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use $\sin^2 x=\frac{1-\cos(2x)}{2}$ before integrating.

      Related topic: Power-Reduction Identities

  - id: q011
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \cos^2 x\,dx
      $$
    answer:
      expectedLatex: \frac{x}{2}+\frac{\sin(2x)}{4}+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Use $\cos^2 x=\frac{1+\cos(2x)}{2}$ before integrating.

      Related topic: Power-Reduction Identities

  - id: q012
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \tan x\,dx
      $$
    answer:
      expectedLatex: -\ln|\cos x|+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Rewrite $\tan x$ as $\frac{\sin x}{\cos x}$ and let $u=\cos x$.

      Related topic: Tangent Integral

  - id: q013
    type: symbolicResponse
    prompt: |
      Evaluate the integral.

      $$
      \int \cot x\,dx
      $$
    answer:
      expectedLatex: \ln|\sin x|+C
      equivalenceMode: derivative
      tolerance: 0.000001
      variables:
        - x
    explanation: |
      Rewrite $\cot x$ as $\frac{\cos x}{\sin x}$ and let $u=\sin x$.

      Related topic: Cotangent Integral

  - id: q014
    type: symbolicResponse
    prompt: |
