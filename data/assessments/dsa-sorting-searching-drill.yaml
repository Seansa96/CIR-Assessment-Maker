items:
  - id: drill-binary-search-1
    prompt: |
      Given the sorted array `[2, 5, 8, 12, 16, 23, 38, 56, 72, 91]`, and a target of `23`. 
      If you perform standard binary search (midpoint calculated as `(low + high) // 2`), what is the value at the midpoint during the first comparison?
    answer: "16"
  
  - id: drill-binary-search-2
    prompt: |
      In the array `[2, 5, 8, 12, 16, 23, 38, 56, 72, 91]`, how many total comparisons against the midpoint will be made to find the target `23`? (Count the first comparison against 16 as the first one).
    answer: "3"
