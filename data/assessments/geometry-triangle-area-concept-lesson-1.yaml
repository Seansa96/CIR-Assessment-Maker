lesson:
  introduction: |-
    Finding the area of a triangle is a fundamental skill. While most students learn the basic formula early on, geometry provides us with powerful alternative formulas for when the height is unknown.
  sections:
  - id: sec-base-height
    title: The Base-Height Formula
    required: true
    content: |-
      The classic formula for the area of a triangle is:
      $$Area = \frac{1}{2} b h$$
      Where $b$ is the length of the base, and $h$ is the height (the altitude drawn to that base).
      
      It is critical to remember that the height must be **perpendicular** to the base. In a right triangle, the legs are already perpendicular, so you can use them as the base and height! But in an obtuse triangle, the height might actually fall outside the triangle.

  - id: sec-herons
    title: Heron's Formula
    required: true
    content: |-
      What if you know the lengths of all three sides of a triangle, but you don't know the height?
      
      Instead of using complex trigonometry to find the height, you can use **Heron's Formula**!
      
      First, calculate the **semiperimeter** ($s$), which is exactly half of the perimeter:
      $$s = \frac{a + b + c}{2}$$
      
      Then, plug $s$ and the three side lengths into Heron's Formula:
      $$Area = \sqrt{s(s - a)(s - b)(s - c)}$$
      
      This formula works for *any* triangle, as long as you know all three sides!

questions:
- id: q-geom-area-1
  title: Concept Check - Basic Area
  prompt: |-
    A right triangle has legs of length $6$ and $8$, and a hypotenuse of $10$. What is the area of the triangle?
  type: numericResponse
  answer:
    numericValue: 24
    tolerance: 0
  explanation: |-
    In a right triangle, the legs are perpendicular to each other, so they act as the base and the height.
    $$Area = \frac{1}{2} b h = \frac{1}{2}(6)(8) = 24$$
    (You do not need the hypotenuse to find the area!)
  skills:
  - geometry-triangle-area

- id: q-geom-area-2
  title: Concept Check - Semi-perimeter
  prompt: |-
    A triangle has sides of lengths $5$, $12$, and $13$. What is the value of the semiperimeter ($s$) used in Heron's Formula?
  type: numericResponse
  answer:
    numericValue: 15
    tolerance: 0
  explanation: |-
    The semiperimeter is half of the total perimeter.
    $$s = \frac{5 + 12 + 13}{2} = \frac{30}{2} = 15$$
  skills:
  - geometry-triangle-area
