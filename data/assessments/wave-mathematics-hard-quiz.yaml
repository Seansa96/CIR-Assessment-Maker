  type: numericResponse
  skills:
  - physics-wave-mathematics
  prompt: A laboratory ripple tank generates water waves of length 14.26 m at a frequency
    of 42.1 Hz. What is the wave speed in m/s?
  answer:
    value: 600.346
    tolerance: 0.05
  explanation: v = lambda * f = 14.26 * 42.1 = 600.35 m/s.
