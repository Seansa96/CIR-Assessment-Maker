- id: q001
  type: numericResponse
  skills:
  - physics-wave-mathematics
  prompt: A tensioned cable vibrates with wavelength 3.32 m when driven at 19.9 Hz.
    What is the angular frequency omega in rad/s?
  answer:
    value: 125.0354
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*19.9 = 125.0354 rad/s.
