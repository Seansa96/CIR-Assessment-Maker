glossary:
  introduction: 'Understand the forms of concentration and how solutions are prepared.'
  sections:
    - id: dissolved-particles
      title: Dissolved particles and electrolytes
      entries:
        - id: entry-electrolyte
          term: electrolyte
          definition: 'A substance that forms mobile ions when dissolved in water or melted, allowing the liquid to conduct electricity.'
          drills:
            - { id: sg-08, type: flashcard, prompt: 'What makes a dissolved substance an electrolyte?', answer: { expected: It forms mobile ions that carry electrical charge through the solution. }, explanation: 'Mobile ions carry charge through the solution, so the solution can conduct electricity.' }
        - id: entry-strong-electrolyte
          term: strong electrolyte
          definition: 'A solute that separates into ions essentially completely when dissolved in water.'
          drills:
            - { id: sg-09, type: cloze, prompt: 'A strong electrolyte forms ions ___ when dissolved in water.', answer: { expected: essentially completely }, explanation: 'Strong electrolytes produce ions essentially completely in water, leaving very little intact solute.' }
        - id: entry-weak-electrolyte
          term: weak electrolyte
          definition: 'A solute that reacts with water only partially to form ions, leaving a mixture of ions and intact molecules.'
          drills:
            - { id: sg-10, type: cloze, prompt: 'A weak electrolyte forms ions ___ in water, so both ions and intact solute remain.', answer: { expected: partially }, explanation: 'Weak electrolytes ionize only partially, so the solution contains both ions and intact solute.' }
        - id: entry-non-electrolyte
          term: non-electrolyte
          definition: 'A solute that dissolves as neutral particles and does not form ions in solution.'
          drills:
            - { id: sg-11, type: flashcard, prompt: 'What happens to a non-electrolyte when it dissolves in water?', answer: { expected: It remains as neutral particles rather than forming ions. }, explanation: 'Because it does not form mobile ions, a dissolved non-electrolyte does not carry charge through the solution.' }
        - id: entry-solvation
          term: solvation
          definition: 'The process in which solvent particles surround and interact with dissolved solute particles; in water, this is called hydration.'
          drills:
            - { id: sg-12, type: flashcard, prompt: 'What is solvation, and what is it called when water is the solvent?', answer: { expected: Solvent particles surround and interact with solute particles; in water this is hydration. }, explanation: 'Solvation describes solvent particles surrounding and interacting with the solute; water-specific solvation is hydration.' }
    - id: concentration-forms
      title: Concentration forms
      entries:
        - id: entry-mass-percent
          term: mass percent
          definition: 'Mass of solute divided by mass of total solution times 100 percent.'
          expression: '$\%m/m=\frac{m_{solute}}{m_{solution}}\times100\%$'
          drills:
            - { id: sg-04, type: flashcard, prompt: 'What is mass percent?', answer: { expected: Mass of solute divided by mass of total solution times 100 percent. }, explanation: 'Solution: Mass of solute divided by mass of total solution times 100 percent. Why it works: It is a mass ratio.' }
        - id: entry-ppm
          term: ppm
          definition: 'One part solute per million parts solution; for dilute water, approximately mg/L.'
          expression: '$1\ \mathrm{ppm}\approx1\ \mathrm{mg/L}$'
          drills:
            - { id: sg-02, type: cloze, prompt: 'For a dilute aqueous solution, 1 ppm is approximately 1 ___.', answer: { expected: mg/L }, explanation: 'Solution: The blank is mg/L. Why it works: A liter of dilute water has mass close to one kilogram.' }
        - id: entry-ppb
          term: ppb
          definition: 'One part solute per billion parts solution; for dilute water, approximately micrograms/L.'
          expression: '$1\ \mathrm{ppb}\approx1\ \mathrm{\mu g/L}$'
          drills:
            - { id: sg-05, type: flashcard, prompt: 'What is ppb for dilute water?', answer: { expected: micrograms/L }, explanation: 'Solution: micrograms/L. Why it works: It is one thousandth of a ppm.' }
        - id: entry-molarity
          term: molarity
          definition: 'Moles of solute per liter of final solution.'
          expression: '$M=\frac{n}{V}$'
          drills:
            - { id: sg-01, type: cloze, prompt: 'Molarity is moles of solute per ___ of final solution.', answer: { expected: liter }, explanation: 'Solution: The blank is liter. Why it works: The defining unit of molarity is mol/L.' }
    - id: solution-preparation
      title: Preparation and dilution
      entries:
        - id: entry-final-vol
          term: final solution volume
          definition: 'The calibrated volume after the solute has dissolved and the mark is reached; it is not the starting water volume.'
          drills:
            - { id: sg-06, type: flashcard, prompt: 'A solute is dissolved and the mixture is brought to the calibration mark in a volumetric flask. Which volume belongs in the molarity denominator?' , answer: { expected: final solution volume, aliases: [total volume of solution] }, explanation: 'Use the final volume at the calibration mark: the solution contains both dissolved solute and solvent, so it is not the starting water volume.' }
        - id: entry-stock
          term: stock solution
          definition: 'A more concentrated solution used to prepare dilute solutions.'
          drills:
            - { id: sg-07, type: flashcard, prompt: 'What is a stock solution?', answer: { expected: A more concentrated solution }, explanation: 'Solution: A more concentrated solution used to prepare dilute solutions. Why it works: It is stored for dilution.' }
        - id: entry-dilution
          term: dilution
          definition: 'Adding solvent without changing solute moles.'
          expression: '$M_1V_1=M_2V_2$'
          drills:
            - { id: sg-03, type: flashcard, prompt: 'What is conserved during a dilution?', answer: { expected: moles of solute }, explanation: 'Solution: Moles of solute are conserved. Why it works: Adding solvent changes volume, not the amount of dissolved solute.' }
