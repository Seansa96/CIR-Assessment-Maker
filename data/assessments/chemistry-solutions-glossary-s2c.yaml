glossary:
  introduction: 'Understand the forms of concentration and how solutions are prepared.'
  sections:
    - id: concentration-forms
      title: Concentration forms
      entries:
        - id: entry-mass-percent
          term: mass percent
          definition: 'Mass of solute divided by mass of total solution times 100 percent.'
          expression: '$\%m/m=\frac{m_{solute}}{m_{solution}}\times100\%$'
          drills:
            - { id: sg-04, type: flashcard, prompt: 'What is mass percent?', answer: { expected: Mass of solute divided by mass of total solution times 100 percent. }, explanation: 'Solution: Mass of solute divided by mass of total solution times 100 percent. Why it works: It is a mass ratio.' }
        - id: entry-ppm
          term: ppm
          definition: 'One part solute per million parts solution; for dilute water, approximately mg/L.'
          expression: '$1\ \mathrm{ppm}\approx1\ \mathrm{mg/L}$'
          drills:
            - { id: sg-02, type: cloze, prompt: 'For a dilute aqueous solution, 1 ppm is approximately 1 ___.', answer: { expected: mg/L }, explanation: 'Solution: The blank is mg/L. Why it works: A liter of dilute water has mass close to one kilogram.' }
        - id: entry-ppb
          term: ppb
          definition: 'One part solute per billion parts solution; for dilute water, approximately micrograms/L.'
          expression: '$1\ \mathrm{ppb}\approx1\ \mathrm{\mu g/L}$'
          drills:
            - { id: sg-05, type: flashcard, prompt: 'What is ppb for dilute water?', answer: { expected: micrograms/L }, explanation: 'Solution: micrograms/L. Why it works: It is one thousandth of a ppm.' }
        - id: entry-molarity
          term: molarity
          definition: 'Moles of solute per liter of final solution.'
          expression: '$M=\frac{n}{V}$'
          drills:
            - { id: sg-01, type: cloze, prompt: 'Molarity is moles of solute per ___ of final solution.', answer: { expected: liter }, explanation: 'Solution: The blank is liter. Why it works: The defining unit of molarity is mol/L.' }
    - id: solution-preparation
      title: Preparation and dilution
      entries:
        - id: entry-final-vol
          term: final solution volume
          definition: 'The calibrated volume after the solute has dissolved and the mark is reached; it is not the starting water volume.'
          drills:
            - { id: sg-06, type: flashcard, prompt: 'Is final solution volume the starting water volume?', answer: { expected: no }, explanation: 'Solution: No. Why it works: Solute takes up space.' }
        - id: entry-stock
          term: stock solution
          definition: 'A more concentrated solution used to prepare dilute solutions.'
          drills:
            - { id: sg-07, type: flashcard, prompt: 'What is a stock solution?', answer: { expected: A more concentrated solution }, explanation: 'Solution: A more concentrated solution used to prepare dilute solutions. Why it works: It is stored for dilution.' }
        - id: entry-dilution
          term: dilution
          definition: 'Adding solvent without changing solute moles.'
          expression: '$M_1V_1=M_2V_2$'
          drills:
            - { id: sg-03, type: flashcard, prompt: 'What is conserved during a dilution?', answer: { expected: moles of solute }, explanation: 'Solution: Moles of solute are conserved. Why it works: Adding solvent changes volume, not the amount of dissolved solute.' }
