questions:
  - id: fric-diag-ramp-up
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] In a free body diagram of a block that is actively sliding UP a rough ramp, which forces point parallel to the ramp and in the downwards direction?
    choices:
      - id: a
        text: 'Two forces: The parallel component of gravity ($mg\sin\theta$) and kinetic friction.'
      - id: b
        text: 'One force: Only kinetic friction.'
      - id: c
        text: 'One force: Only the parallel component of gravity.'
      - id: d
        text: 'No forces point downwards along the ramp.'
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Since the motion is UP the ramp, kinetic friction opposes the motion and points DOWN the ramp. The parallel component of gravity always points DOWN the ramp. Thus, both forces point down the ramp.

  - id: fric-diag-wall-push
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A diagram shows a book held against a vertical wall by a diagonal force pushing up and in. The book is at rest, but if the push were slightly weaker, it would slide down. Which direction does static friction point?
    choices:
      - id: a
        text: Upwards
      - id: b
        text: Downwards
      - id: c
        text: Into the wall
      - id: d
        text: Away from the wall
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Static friction opposes *intended* motion. Since the book is on the verge of sliding DOWN, static friction must be pointing UP to help support it.

  - id: fric-diag-pull-angle
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block is dragged across a rough horizontal floor by a rope angled at $30°$ above the horizontal. In the free body diagram, how should the normal force ($N$) arrow compare in length to the gravity ($mg$) arrow?
    choices:
      - id: a
        text: The normal force arrow should be shorter than the gravity arrow.
      - id: b
        text: The normal force arrow should be exactly equal in length to the gravity arrow.
      - id: c
        text: The normal force arrow should be longer than the gravity arrow.
      - id: d
        text: There should be no normal force arrow.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The tension in the rope has an upward vertical component. Vertical forces must balance: $N + T_y = mg$. Therefore, $N = mg - T_y$, meaning the normal force is less than gravity. The arrow for $N$ should be shorter.

  - id: fric-diag-push-angle
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block is pushed across a horizontal floor by a stick angled downwards at $45°$ below the horizontal. In the free body diagram, how should the kinetic friction arrow compare to what it would be if the block were pushed horizontally?
    choices:
      - id: a
        text: The friction arrow should be drawn longer (indicating more friction).
      - id: b
        text: The friction arrow should be drawn shorter (indicating less friction).
      - id: c
        text: The friction arrow should be the same length.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Pushing downwards adds a downward vertical component, increasing the normal force ($N = mg + F_y$). Since $f_k = \mu_k N$, the friction force is greater, so the arrow should be longer.

  - id: fric-diag-stacked-blocks
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] Block A sits on top of Block B. A hand pulls Block B to the right, and both blocks accelerate to the right together (no slipping). In the free body diagram for Block A (the top block), what force is responsible for its acceleration to the right?
    choices:
      - id: a
        text: Static friction pointing to the right.
      - id: b
        text: Kinetic friction pointing to the right.
      - id: c
        text: Static friction pointing to the left.
      - id: d
        text: The pull force from the hand.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The only horizontal force acting on Block A is the friction from Block B. Since they do not slip relative to each other, it is *static* friction. Because Block A is accelerating to the right, this force must point to the right.

  - id: fric-diag-stacked-bottom
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] Referring to the previous scenario (Block A on Block B, accelerating right together), in the free body diagram for Block B (the bottom block), what horizontal forces are acting on it from Block A?
    choices:
      - id: a
        text: Static friction pointing to the left.
      - id: b
        text: Static friction pointing to the right.
      - id: c
        text: Kinetic friction pointing to the left.
      - id: d
        text: No horizontal forces from Block A act on Block B.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** By Newton's Third Law, if Block B exerts static friction to the right on Block A, Block A must exert an equal and opposite static friction force to the left on Block B.

  - id: fric-diag-inclined-static
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block rests completely stationary on a rough incline angled at $20°$. In the free body diagram, what must be true about the vectors for static friction ($f_s$) and the parallel component of gravity ($mg\sin\theta$)?
    choices:
      - id: a
        text: They must be drawn equal in length and opposite in direction.
      - id: b
        text: The static friction arrow must be drawn longer to prevent slipping.
      - id: c
        text: The gravity component must be longer since gravity is a fundamental force.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Since the block is stationary (acceleration = 0), all forces must be in equilibrium. The force pulling it down the ramp ($mg\sin\theta$) must be exactly balanced by static friction ($f_s$) pointing up the ramp.

  - id: fric-diag-inclined-kinetic
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block is released from rest on a rough incline and begins to accelerate downwards. In the free body diagram, how do the lengths of the kinetic friction arrow ($f_k$) and the parallel gravity arrow ($mg\sin\theta$) compare?
    choices:
      - id: a
        text: The parallel gravity arrow is longer than the kinetic friction arrow.
      - id: b
        text: The kinetic friction arrow is longer than the parallel gravity arrow.
      - id: c
        text: They are exactly equal in length.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Because the block accelerates *down* the incline, there must be a net force pointing down the incline. Therefore, the downward component ($mg\sin\theta$) must be greater in magnitude than the upward force ($f_k$).

  - id: fric-diag-brake-car
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A car is traveling to the right and slams on its brakes, skidding to a stop. In the free body diagram of the car during the skid, which horizontal forces are present?
    choices:
      - id: a
        text: Only kinetic friction pointing to the left.
      - id: b
        text: Kinetic friction pointing to the left, and a forward "momentum force" pointing to the right.
      - id: c
        text: Static friction pointing to the left.
      - id: d
        text: Only the force of the brakes pushing backward.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** There is no such thing as a "force of motion" or "momentum force". Once the brakes lock and the car skids, the only horizontal force acting on the car from the environment is kinetic friction from the road, pointing to the left.

  - id: fric-diag-atwood-table
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] In a modified Atwood machine, a block on a rough horizontal table is pulled to the right by a string connected to a hanging mass. In the free body diagram for the block on the table, what are the horizontal forces?
    choices:
      - id: a
        text: Tension to the right, kinetic friction to the left.
      - id: b
        text: Tension to the right, static friction to the left.
      - id: c
        text: Gravity to the right, kinetic friction to the left.
      - id: d
        text: Tension to the right, normal force to the left.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The string provides a Tension force to the right. If the block is sliding, the rough table provides kinetic friction to the left. (Gravity and normal force are vertical).

  - id: fric-diag-terminal-velocity
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block slides down a very long, rough incline and eventually reaches a constant terminal velocity. At this point, how should the free body diagram be drawn?
    choices:
      - id: a
        text: The kinetic friction arrow (up ramp) exactly matches the length of the gravity component (down ramp).
      - id: b
        text: The kinetic friction arrow should be zero.
      - id: c
        text: The gravity component (down ramp) is still longer than friction, but velocity is maxed out.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Constant velocity means acceleration is zero, which means net force is zero. Therefore, the forces parallel to the ramp must perfectly balance.

  - id: fric-diag-pushing-wall
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] You push horizontally against a heavy box that is resting on a floor, but it does not move. The free body diagram shows your applied push ($F_\text{push}$) to the right. What is the correct representation of friction?
    choices:
      - id: a
        text: An arrow for static friction pointing left, exactly equal in length to $F_\text{push}$.
      - id: b
        text: An arrow for static friction pointing left, equal in length to the maximum static friction ($\mu_s N$).
      - id: c
        text: An arrow for kinetic friction pointing left.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Since the box doesn't move, it is in equilibrium. The static friction force adjusts itself to be exactly equal to the applied force, regardless of what the *maximum* possible static friction is.

  - id: fric-diag-changing-normal
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block is on a flat board. You slowly lift one end of the board, increasing the angle of incline. The block has not yet slipped. In the series of free body diagrams for increasing angles, what happens to the length of the normal force arrow?
    choices:
      - id: a
        text: It gets shorter.
      - id: b
        text: It gets longer.
      - id: c
        text: It stays exactly the same length.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The normal force on an incline is $N = mg\cos\theta$. As $\theta$ increases from $0°$ towards $90°$, $\cos\theta$ decreases, meaning the normal force gets smaller.

  - id: fric-diag-air-drag
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A baseball is thrown horizontally and is experiencing air resistance (drag). In a free body diagram taken just after release (when velocity is purely horizontal), what direction does the air drag force point?
    choices:
      - id: a
        text: Horizontally backwards, opposite to the velocity.
      - id: b
        text: Straight upwards, opposing gravity.
      - id: c
        text: Diagonally upwards and backwards.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Drag (fluid friction) always points exactly opposite to the velocity vector through the fluid. Since the initial velocity is purely horizontal, the drag is purely horizontal backwards.

  - id: fric-diag-wrong-force
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A student draws a free body diagram for a block sliding across a frictionless ice pond after being kicked. The student includes an arrow pointing in the direction of motion labeled "Force of the kick". Is this correct?
    choices:
      - id: a
        text: No, because once the foot is no longer in contact with the block, the kick force is gone.
      - id: b
        text: Yes, because an object needs a force to keep moving.
      - id: c
        text: Yes, but it should be labeled "inertia" instead of kick.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Free body diagrams only show forces acting on the object *at that exact moment*. Once contact is lost, the kick force is zero. The block continues moving due to inertia, but inertia is not a force and is never drawn as a vector.
