  tags:
  - diagrams
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
questions:
- id: fric-diag-ramp-1
  type: multipleChoice
  prompt: '[Diagram Interpretation] In a diagram of a block pushed UP a rough ramp
    by a force parallel to the ramp,\rhow many forces point DOWN the ramp?'
  choices:
  - id: a
    text: 'Two: the parallel component of gravity ($mg\sin\theta$) and kinetic friction.'
  - id: b
    text: 'One: just gravity.'
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Since motion is UP the ramp, friction points
    DOWN the ramp, combining with the gravity component.'
- id: fric-diag-wall-1
  type: multipleChoice
  prompt: '[Diagram Interpretation] A diagram shows a book held against a wall by
    a diagonal force pushing up and in. Which direction does friction point?'
  choices:
  - id: a
    text: It depends on whether the vertical component of the push is greater or less
      than gravity.
  - id: b
    text: Always up.
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Static friction opposes *intended* motion. If
    the push is strong enough, the book tends to slide UP, so friction points DOWN.'
