lesson:
  introduction: This deeper lesson expands Introduction and System Calls from Chapter 1 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: extended-machine
    title: OS as extended machine
    required: true
    content: 'The operating system hides awkward hardware details behind abstractions such as processes, files, address spaces, and system calls.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Introduction and System Calls, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: extended-machine-deep-check
      title: 'Check: OS as extended machine'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **OS as extended machine**?
      choices:
      - id: a
        text: The OS gives programs safer abstractions than raw hardware.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'The OS gives programs safer abstractions than raw hardware. Related topic: Introduction and System Calls.'
  - id: resource-manager
    title: OS as resource manager
    required: true
    content: 'The operating system allocates CPU time, memory, storage, and devices among competing programs while enforcing protection.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Introduction and System Calls, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: resource-manager-deep-check
      title: 'Check: OS as resource manager'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **OS as resource manager**?
      choices:
      - id: a
        text: The OS decides how shared resources are allocated and protected.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'The OS decides how shared resources are allocated and protected. Related topic: Introduction and System Calls.'
  - id: mode-transition
    title: User mode to kernel mode
    required: true
    content: 'A system call is a controlled transition from user code into privileged kernel work, usually through a defined trap or syscall path.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Introduction and System Calls, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: mode-transition-deep-check
      title: 'Check: User mode to kernel mode'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **User mode to kernel mode**?
      choices:
      - id: a
        text: A system call crosses a protection boundary.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'A system call crosses a protection boundary. Related topic: Introduction and System Calls.'
    media:
    - type: image
      src: /assessments/operating-systems/system-calls/system-call-boundary.svg
      alt: System call path crossing from user mode through an API wrapper into kernel mode and back.
      caption: System calls are controlled crossings into protected kernel work.
  - id: hardware-interrupts
    title: Hardware and interrupts
    required: true
    content: 'Interrupts let devices and timers demand attention, which is why the OS can regain control and multiplex the machine.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Introduction and System Calls, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: hardware-interrupts-deep-check
      title: 'Check: Hardware and interrupts'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Hardware and interrupts**?
      choices:
      - id: a
        text: Interrupts are central to preemption and device service.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Interrupts are central to preemption and device service. Related topic: Introduction and System Calls.'
    media:
    - type: image
      src: /assessments/operating-systems/system-calls/kernel-user-mode.svg
      alt: User mode and kernel mode regions separated by a controlled trap and return path.
      caption: Mode boundaries preserve protection when devices or interrupts require kernel work.
  - id: api-vs-syscall
    title: API versus system call
    required: true
    content: 'A library API may wrap, combine, or avoid system calls; the system call is the protected kernel interface.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Introduction and System Calls, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: api-vs-syscall-deep-check
      title: 'Check: API versus system call'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **API versus system call**?
      choices:
      - id: a
        text: An API call and a system call are not always identical.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'An API call and a system call are not always identical. Related topic: Introduction and System Calls.'
    media:
    - type: image
      src: /assessments/operating-systems/system-calls/api-vs-syscall.svg
      alt: API call branching to either a true system call or a user-space-only operation.
      caption: A library API may wrap one syscall, several syscalls, or no syscall.
