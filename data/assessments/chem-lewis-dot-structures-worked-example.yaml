    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - H2O uses two O-H bonds and two oxygen lone pairs.
    explanation: 'Solution: H2O uses two O-H bonds and two oxygen lone pairs. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: s2-nh3
