    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - NH3 uses three N-H bonds and one nitrogen lone pair.
    explanation: 'Solution: NH3 uses three N-H bonds and one nitrogen lone pair. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: s3-hcn
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - HCN uses H-C and a C triple N bond with one nitrogen lone pair.
    explanation: 'Solution: HCN uses H-C and a C triple N bond with one nitrogen lone pair. Why it works: This step follows
      the topic''s accounting rules and supplies a separate check before the final conclusion.'
