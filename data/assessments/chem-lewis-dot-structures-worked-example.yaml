workedExamples:
  - id: we-lewis-standard
    title: 'Standard Lewis Structures: H₂O, NH₃, HCN'
    problem: |
      Apply the five-step Lewis structure procedure to draw correct structures for $H_2O$, $NH_3$, and $HCN$. For each, verify the electron count and identify any lone pairs on the central atom.
    steps:
      - id: s1-h2o
        title: 'H₂O — Water'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the H₂O Lewis structure and continue.
        instruction: |
          **Step 1:** Valence electrons: $O(6) + 2 \times H(1) = 8$

          **Step 2:** O is central (H cannot be central). Skeleton: H—O—H, using 4 electrons. Remaining: $8 - 4 = 4$.

          **Step 3:** Complete H octets: each H already has 2 (from bond). Place remaining 4 electrons as **2 lone pairs on O**.

          **Result:**
          $$\ddot{O}(\text{with 2 lone pairs})\text{, 2 O—H bonds}$$

          O count: 2 lone pairs (4 e⁻) + 2 bonds (4 e⁻) = 8 ✓. Each H has 2 ✓.

      - id: s2-nh3
        title: 'NH₃ — Ammonia'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the NH₃ Lewis structure and continue.
        instruction: |
          **Step 1:** Valence electrons: $N(5) + 3 \times H(1) = 8$

          **Step 2:** N is central. Skeleton: N with three N—H bonds (6 e⁻ used). Remaining: $8 - 6 = 2$.

          **Step 3:** H octets are complete (2 each from bond). Place 2 remaining electrons as **1 lone pair on N**.

          **Result:** N has 3 bonds + 1 lone pair = 8 electrons ✓

          The lone pair on N gives ammonia its **trigonal pyramidal** shape and makes it a Lewis base (electron-pair donor).

      - id: s3-hcn
        title: 'HCN — Hydrogen Cyanide'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the HCN Lewis structure and continue.
        instruction: |
          **Step 1:** Valence electrons: $H(1) + C(4) + N(5) = 10$

          **Step 2:** C is the central atom (N and H are terminal). Skeleton: H—C—N (4 e⁻ used). Remaining: 6.

          **Step 3:** Complete terminal atoms. N needs 6 more for its octet (currently has 2 from bond), so give N 3 lone pairs? No — N only gets 6 e⁻ from lone pairs if it has a single bond. With a single bond, N has 2 (bond) + 6 (lone pairs) = 8 ✓. C has 2 (H bond) + 2 (N bond) = 4 — not an octet!

          **Step 4:** Convert lone pairs on N to bonding pairs. Move 2 lone pairs from N → form C≡N triple bond.

          **Final:** H—C≡N (1 lone pair on N). C: 2 + 6 = 8 ✓. N: 2 (lone pair) + 6 (triple bond shared) = 8 ✓. Total e⁻: $2 + 6 + 2 = 10$ ✓.

  - id: we-lewis-expanded
    title: 'Expanded Octets: PCl₅ and SF₄'
    problem: |
      Draw the Lewis structures of $PCl_5$ and $SF_4$. Both have central atoms from Period 3 that can exceed 8 electrons.
    steps:
      - id: s4-pcl5
        title: 'PCl₅ — Phosphorus Pentachloride'
        type: numericResponse
        answer:
          value: 40
          tolerance: 0
        prompt: |
          How many total valence electrons are in $PCl_5$?
          (P: Group 15 = 5 valence e⁻; Cl: Group 17 = 7 each)
        instruction: |
          $P: 5 + 5 \times Cl: 7 = 5 + 35 = 40$ valence electrons.

          Lewis structure: P at center with **5 P—Cl bonds** (10 e⁻). Remaining: $40 - 10 = 30$.

          Each Cl receives 3 lone pairs: $5 \times 6 = 30$ e⁻ used → 0 remaining.

          P has 10 electrons total (5 bonds) — an expanded octet. $PCl_5$ has **trigonal bipyramidal** geometry.

      - id: s5-sf4
        title: 'SF₄ — Sulfur Tetrafluoride'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the SF₄ Lewis structure and the resulting geometry, then continue.
        instruction: |
          Valence electrons: $S: 6 + 4 \times F: 7 = 6 + 28 = 34$

          Skeleton: S at center, 4 S—F bonds (8 e⁻). Remaining: $34 - 8 = 26$.

          Complete F octets: each F needs 3 lone pairs (6 e⁻) = $4 \times 6 = 24$ e⁻. Remaining: $26 - 24 = 2$.

          Place remaining 2 electrons as **1 lone pair on S**.

          S now has: 4 bonds (8 e⁻) + 1 lone pair (2 e⁻) = **10 electrons** (expanded octet).

          AXₙEₘ = AX₄E₁ → **seesaw molecular geometry**. The lone pair occupies an equatorial position of the trigonal bipyramidal electron-pair geometry.

  - id: we-lewis-ions
    title: 'Polyatomic Ions: SO₄²⁻ and NH₄⁺'
    problem: |
      Draw the Lewis structures for the sulfate ion ($SO_4^{2-}$) and the ammonium ion ($NH_4^+$). Show all lone pairs and calculate the formal charge on the central atom in each.
    steps:
      - id: s6-sulfate
        title: Sulfate ion SO₄²⁻
        type: numericResponse
        answer:
          value: 0
          tolerance: 0
        prompt: |
          For the sulfate ion ($SO_4^{2-}$), the most stable Lewis structure has S at center forming **two** S=O double bonds and **two** S—O single bonds (32 total valence electrons). What is the formal charge on S in this structure?

          (Hint: S has 0 lone pairs, and participates in 2 double bonds + 2 single bonds = 12 bonding electrons around S)
        instruction: |
          Valence electrons: $S: 6 + 4 \times O: 24 + 2 \text{ (charge)} = 32$.

          For the structure with two S=O and two S—O:
          - Bonding electrons on S: $2 \times 4 \text{ (double)} + 2 \times 2 \text{ (single)} = 12$
          - Lone pairs on S: 0

          $$\text{FC}(S) = 6 - 0 - \frac{12}{2} = 6 - 0 - 6 = 0$$

          Sulfur formal charge = **0**. The singly-bonded O atoms each have FC = −1 (two of them), accounting for the 2− overall charge.

      - id: s7-ammonium
        title: Ammonium ion NH₄⁺
        type: numericResponse
        answer:
          value: 1
          tolerance: 0
        prompt: |
          For the ammonium ion ($NH_4^+$), N forms 4 N—H bonds and has **no lone pairs**. The total valence electrons are 8 (after subtracting 1 for the positive charge). What is the formal charge on N?
        instruction: |
          Valence electrons: $N: 5 + 4 \times H: 4 - 1 \text{ (charge)} = 8$.

          4 N—H bonds use all 8 electrons. N has no lone pairs.

          $$\text{FC}(N) = 5 - 0 - \frac{8}{2} = 5 - 0 - 4 = +1$$

          N carries a **formal charge of +1**, consistent with the +1 overall charge of $NH_4^+$. Each H has FC = $1 - 0 - 1 = 0$.
