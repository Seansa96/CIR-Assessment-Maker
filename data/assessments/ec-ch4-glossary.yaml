glossary:
  sections:
  - id: ch4-terms
    title: Terms
    required: true
    entries:
    - id: node-voltage-method
      term: Node-Voltage Method
      definition: A systematic method of circuit analysis based on KCL that uses node
        voltages as the circuit variables.
      drills:
      - id: node-voltage-method-drill
        prompt: Which method uses KCL to find voltages?
        answer:
          expected: Node-Voltage Method
        type: typed
    - id: mesh-current-method
      term: Mesh-Current Method
      definition: A systematic method of circuit analysis based on KVL that uses mesh
        currents as the circuit variables.
      drills:
      - id: mesh-current-method-drill
        prompt: Which method uses KVL to find loop currents?
        answer:
          expected: Mesh-Current Method
        type: typed
    - id: supernode
      term: Supernode
      definition: A theoretical construct formed when a voltage source connects two
        non-reference nodes, enclosing the source and its two nodes into a single
        generalized node for KCL.
      drills:
      - id: supernode-drill
        prompt: What do we call a voltage source between non-reference nodes?
        answer:
          expected: Supernode
        type: typed
    - id: supermesh
      term: Supermesh
      definition: A theoretical construct formed when a current source is shared between
        two meshes, avoiding the need to assign a voltage to the current source.
      drills:
      - id: supermesh-drill
        prompt: What equivalent circuit uses a voltage source in series with a resistor?
        answer:
          expected: Thévenin Equivalent
        type: typed
    - id: thévenin-equivalent
      term: Thévenin Equivalent
      definition: An equivalent circuit consisting of an independent voltage source
        in series with a resistor.
      drills:
      - id: thévenin-equivalent-drill
        prompt: What equivalent circuit uses a current source in parallel with a resistor?
        answer:
          expected: Norton Equivalent
        type: typed
    - id: norton-equivalent
      term: Norton Equivalent
      definition: An equivalent circuit consisting of an independent current source
        in parallel with a resistor.
      drills:
      - id: norton-equivalent-drill
        prompt: Which method uses KCL to find voltages?
        answer:
          expected: Node-Voltage Method
        type: typed
    - id: superposition
      term: Superposition
      definition: A principle stating that the response in a linear circuit with multiple
        independent sources is the sum of the individual responses caused by each
        source acting alone.
      drills:
      - id: superposition-drill
        prompt: Which method uses KVL to find loop currents?
        answer:
          expected: Mesh-Current Method
        type: typed
  introduction: Review these terms carefully.
