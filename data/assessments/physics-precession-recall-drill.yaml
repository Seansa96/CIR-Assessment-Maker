items:
  - { id: pr1, type: cloze, prompt: 'For slow precession, $\Omega=\tau/____$.', answer: { expected: L, expectedLatex: 'L', aliases: ['angular momentum'], media: [] }, explanation: 'Solution: Insert $L$.\n\nWhy it works: Precession rate is torque divided by angular momentum.', tags: [rate] }
  - { id: pr2, type: typed, prompt: 'What quantity causes a gyroscope''s angular momentum direction to change?', answer: { expected: torque, expectedLatex: '', aliases: ['net torque'], media: [] }, explanation: 'Solution: The quantity is torque.\n\nWhy it works: $d\vec L/dt=\vec\tau$.', tags: [torque] }
  - { id: pr3, type: cloze, prompt: 'A faster-spinning gyroscope precesses ____ under fixed torque.', answer: { expected: slower, expectedLatex: '', aliases: [more slowly], media: [] }, explanation: 'Solution: Insert slower.\n\nWhy it works: Larger angular momentum lowers $\Omega$.', tags: [spin] }
  - { id: pr4, type: typed, prompt: 'In a supported gyroscope, what force commonly supplies the precession torque?', answer: { expected: gravity, expectedLatex: '', aliases: [weight], media: [] }, explanation: 'Solution: The force is gravity.\n\nWhy it works: Weight acts at a lever arm from pivot.', tags: [gravity] }
  - { id: pr5, type: cloze, prompt: 'The side of a spinning gyroscope that traces a cone is its spin ____.', answer: { expected: axis, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Insert axis.\n\nWhy it works: Precession is rotation of the spin-axis direction.', tags: [definition] }
  - { id: pr6, type: typed, prompt: 'Which rule determines rotational-vector directions?', answer: { expected: 'right hand rule', expectedLatex: '', aliases: ['right-hand rule'], media: [] }, explanation: 'Solution: It is the right-hand rule.\n\nWhy it works: It sets cross-product direction.', tags: [direction] }
