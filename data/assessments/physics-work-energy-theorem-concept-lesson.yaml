sections:
  - id: theorem-definition
    title: The Work-Kinetic Energy Theorem
    content: |
      The **Work-Kinetic Energy Theorem** states that the net work done on an object by all forces equals the change in the object's kinetic energy.

      $$ W_{net} = \Delta K = K_f - K_i $$

      This is a direct consequence of Newton's Second Law and the definitions of work and kinetic energy. 
      * If $W_{net} > 0$, the object speeds up (kinetic energy increases).
      * If $W_{net} < 0$, the object slows down (kinetic energy decreases).
      * If $W_{net} = 0$, the object maintains a constant speed.

  - id: why-its-useful
    title: Why Use Energy Instead of Newton's Laws?
    content: |
      You can solve many problems using either Newton's laws (to find acceleration) followed by kinematic equations, OR by using the work-energy theorem.

      However, the Work-Energy Theorem is often **much easier and faster** because:
      1. Work and Energy are **scalars**, not vectors. You don't have to break them into x and y components.
      2. It relates speed and position directly, completely ignoring the *time* it takes and the *path* taken (for conservative forces).
      3. It works easily even when forces are varying (using the area under the force-position curve), whereas kinematics with varying acceleration requires integrating differential equations.

questions:
  - id: q001
    type: multipleChoice
    prompt: |
      A net work of $-50$ J is done on a shopping cart as it moves across a parking lot. Which of the following must be true?
    choices:
      - id: a
        text: The cart is speeding up.
      - id: b
        text: The cart is slowing down.
      - id: c
        text: The cart is moving at a constant speed.
      - id: d
        text: The cart is moving backwards.
    answer:
      choiceId: b
    explanation: |
      According to the Work-Kinetic Energy Theorem, $W_{net} = \Delta K$. Since the net work is negative, $\Delta K$ is negative, meaning the final kinetic energy is less than the initial kinetic energy. Therefore, the cart is slowing down.


