schemaVersion: 1
id: css-box-model-quiz
title: Box Model Quiz
assessmentType: quiz
categoryId: css
subcategoryIds:
  - css-box-model
modeDefault: study
randomizeQuestions: true
questions:
  - id: q-shorthand
    title: Padding Shorthand
    content: |
      You want to apply padding to an element using the shorthand property. You want 10px on the top and bottom, and 20px on the left and right.
    check:
      id: check-shorthand
      type: freeResponse
      prompt: "Type the exact CSS declaration (including the property name and semicolon):"
      answer:
        gradingMode: exactMatch
        exactMatch: "padding: 10px 20px;"
      explanation: |
        The two-value shorthand applies the first value to top/bottom, and the second to left/right.

  - id: q-collapse
    title: Margin Collapse
    content: |
      Element A is directly above Element B. Element A has a `margin-bottom` of 40px. Element B has a `margin-top` of 25px.
    check:
      id: check-collapse
      type: multipleChoice
      prompt: "What is the total vertical distance between the two elements?"
      choices:
        - id: a
          text: 65px
        - id: b
          text: 40px
        - id: c
          text: 25px
      answer:
        choiceId: b
      explanation: |
        Due to margin collapsing, vertical margins of adjacent elements do not add together. The larger of the two margins (40px) dictates the space.
