lesson:
  introduction: Learn to solve The Power of Coordinates problems by recognizing coordinate plane, line equations, plotting lines, distance formula, circle equations, intersections and justifying each theorem or transformation.
  sections:
  - id: aops-coordinate-geometry-motivation
    title: What the topic helps you notice
    required: true
    content: The Power of Coordinates is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are coordinate plane, line equations, plotting lines, distance formula, circle equations, intersections.
    check:
      id: aops-coordinate-geometry-motivation-check
      type: multipleChoice
      prompt: In The Power of Coordinates, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-coordinate-geometry-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-coordinate-geometry-definitions-check
      type: multipleChoice
      prompt: In The Power of Coordinates, what should be checked before applying a method?
      choices:
