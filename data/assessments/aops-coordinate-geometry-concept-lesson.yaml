      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-coordinate-geometry-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: translate geometry into algebra, use slope/intercept, solve intersections cleanly. Record the givens, unknown, and any restriction before selecting a method.'
