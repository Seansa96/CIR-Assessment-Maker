questions:
- id: q001
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A mass of 5.14 kg is attached to a horizontal spring with constant 54.5
    N/m on a frictionless table. If the amplitude is 0.432 m, what is the maximum
    speed in m/s?
  answer:
    value: 1.4067
    tolerance: 0.05
  explanation: |
    Solution: $v_{\max}=A\omega=(0.432)\sqrt{54.5/5.14}=1.4067\text{ m/s}$.

    Why it works: In simple harmonic motion, maximum speed equals amplitude times angular frequency, with $\omega=\sqrt{k/m}$.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: The spring-mass frequency model is selected and evaluated.
- id: q002
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A vehicle's strut of 156.2 N/m supports a quarter of the car's mass, which
    is 8.72 kg. If the amplitude is 0.308 m, what is the maximum speed in m/s?
  answer:
    value: 1.3036
    tolerance: 0.05
  explanation: |
    Solution: $v_{\max}=A\omega=(0.308)\sqrt{156.2/8.72}=1.3036\text{ m/s}$.

    Why it works: The quarter-car mass and strut stiffness form the mass-spring model, so $\omega=\sqrt{k/m}$ and $v_{\max}=A\omega$.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: The physical description is mapped to a spring-mass frequency calculation.
- id: q003
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A mass of 3.62 kg is attached to a horizontal spring with constant 338.4
    N/m on a frictionless table. What is the period of oscillation in seconds?
  answer:
    value: 0.6499
    tolerance: 0.05
  explanation: |
    Solution: $T=2\pi\sqrt{m/k}=2\pi\sqrt{3.62/338.4}=0.6499\text{ s}$.

    Why it works: An ideal mass-spring oscillator has period $2\pi\sqrt{m/k}$, determined by inertia and stiffness.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: The period relation is selected and evaluated with consistent SI quantities.
- id: q004
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A 6.43 kg sensor is oscillating on a delicate tether with effective stiffness
    22.3 N/m. Calculate the angular frequency in rad/s.
  answer:
    value: 1.8623
    tolerance: 0.05
  explanation: |
    Solution: $\omega=\sqrt{k/m}=\sqrt{22.3/6.43}=1.8623\text{ rad/s}$.

    Why it works: The angular frequency of an ideal spring-mass oscillator is set by stiffness divided by mass under the square root.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: The oscillator parameters are substituted into the angular-frequency model.
- id: q005
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A 7.16 kg sensor is oscillating on a delicate tether with effective stiffness
    205.5 N/m. Calculate the angular frequency in rad/s.
  answer:
    value: 5.3573
    tolerance: 0.05
  explanation: |
    Solution: $\omega=\sqrt{k/m}=\sqrt{205.5/7.16}=5.3573\text{ rad/s}$.

    Why it works: The same spring-mass relation applies because the stated effective stiffness provides the restoring effect.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: The oscillator parameters are substituted into the angular-frequency model.
