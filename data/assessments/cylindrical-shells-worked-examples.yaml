- id: we-shell-1
  title: Shell Method Example
  problem: Find the volume generated by rotating the region bounded by $y=2x-x^2$
    and $y=0$ about the y-axis.
  steps:
  - id: step-we-shell-1-1
    title: Shell radius and height
    instruction: Identify components.
    type: multipleChoice
    prompt: What are $r$ and $h$?
    choices:
    - id: a
      text: $r=x, h=2x-x^2$
    answer:
      choiceId: a
  - id: step-we-shell-1-2
    title: Integrate
    instruction: Evaluate $2\pi \int_0^2 x(2x-x^2) \, dx$.
    type: symbolicResponse
    prompt: Enter volume.
    answer:
      gradingMode: auto
      expectedLatex: 8\pi/3
      equivalenceMode: expression
      tolerance: 0
