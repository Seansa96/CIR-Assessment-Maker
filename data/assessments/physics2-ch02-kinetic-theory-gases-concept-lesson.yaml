lesson:
  introduction: >
    This lesson develops a repeatable way to solve 'Kinetic Theory of Gases: Concept Lesson' problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch02-kinetic-theory-gases-s1
    title: Name the model and quantities
    required: true
    content: >
      'Kinetic Theory of Gases: Concept Lesson' uses PV = nRT. In the name the model and quantities stage, make temperature absolute, identify the amount of gas, and solve one state variable at a time.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving 'Kinetic Theory of Gases: Concept Lesson' problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch02-kinetic-theory-gases-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for 'Kinetic Theory of Gases: Concept Lesson', what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use PV = nRT after you make temperature absolute, identify the amount of gas, and solve one state variable at a time.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this 'Kinetic Theory of Gases: Concept Lesson' problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch02-kinetic-theory-gases-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables PV = nRT relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch02-kinetic-theory-gases-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit 'Kinetic Theory of Gases: Concept Lesson'.
        media: []
        issueSignals:
        - id: physics2-physics2-ch02-kinetic-theory-gases-units-error
          domains:
          - physics-2
