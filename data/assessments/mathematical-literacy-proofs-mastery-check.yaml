questions:
- id: q001
  type: multipleChoice
  prompt: In a proof by contradiction of the statement 'If $P$ then $Q$', the author begins by assuming $P$ is true
    and $Q$ is false. They eventually deduce that $0 = 1$. What is the final logical step?
  choices:
  - id: a
    text: Because the assumption '$P$ and not $Q$' led to a falsehood, the assumption must be false, meaning 'If
      $P$ then $Q$' is true.
  - id: b
    text: Because $0=1$ is false, the hypothesis $P$ must have been false all along.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: The contradiction proves that $Q$ implies $P$.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: The contradiction means the theorem is unprovable.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - proofStructure
  - logicalEquivalence
  - errorDiagnosis
  difficultyEvidence: Identifies the closing logical mechanic of a proof by contradiction.
  explanation: |-
    Solution: Because the assumption '$P$ and not $Q$' led to a falsehood, the assumption must be false, meaning 'If $P$ then $Q$' is true.
    Why it works: A proof by contradiction temporarily assumes the negation of the theorem ($P \\land \\neg Q$). By showing this leads to a logical impossibility, we conclude the negation is false, and therefore the original theorem ($P \\implies Q$) must be true.
    Why the other choices fail: B arbitrarily blames $P$, when the contradiction only proves that the *combination* of $P$ and $\\neg Q$ is impossible. C randomly invokes the converse. D misunderstands the method entirely; reaching a contradiction is the goal, meaning it *is* proven.
- id: q002
  type: multipleChoice
  prompt: A student is asked to prove 'If a quadrilateral is a rectangle, then its diagonals are equal in length'.
    The student draws a quadrilateral with equal diagonals, uses geometry to prove all four angles are 90 degrees,
    and declares the proof complete. What error occurred?
  choices:
  - id: a
    text: The student proved the converse of the theorem instead of the theorem itself.
  - id: b
    text: The student proved the contrapositive instead of the direct theorem.
    issueSignals:
    - id: errorDiagnosis-failure
  - id: c
    text: The student used proof by contradiction incorrectly.
    issueSignals:
    - id: errorDiagnosis-failure
  - id: d
    text: There is no error; the student successfully proved the theorem.
    issueSignals:
    - id: errorDiagnosis-failure
  answer:
    choiceId: a
  issueSignals:
  - id: errorDiagnosis-failure
  difficultyDimensions:
  - errorDiagnosis
  - proofStructure
  - logicalEquivalence
  difficultyEvidence: Diagnoses the fallacy of proving the converse instead of the direct implication.
  explanation: |-
    Solution: The student proved the converse of the theorem instead of the theorem itself.
    Why it works: The theorem is 'Rectangle $\\implies$ Equal Diagonals'. The student assumed 'Equal Diagonals' and proved 'Rectangle'. This is $Q \\implies P$, which is the converse, not the requested theorem.
    Why the other choices fail: B is incorrect because a contrapositive proof would assume unequal diagonals and prove it's not a rectangle. C is incorrect because there was no contradiction assumed. D fails to recognize the logical direction error.
- id: q003
  type: multipleChoice
  prompt: 'At the beginning of a real analysis proof, the author writes ''Let $\epsilon > 0$ be given.'' What is
    the logical purpose of this sentence?'
  choices:
  - id: a
    text: 'It fixes an arbitrary positive number so that the author can establish a universal claim ($\forall \epsilon
      > 0$).'
  - id: b
    text: 'It assumes that $\epsilon$ exists, which is the first step of an existential proof ($\exists \epsilon
      > 0$).'
    issueSignals:
    - id: proofStructure-error
  - id: c
    text: It restricts the proof to only apply to small numbers.
    issueSignals:
    - id: conventionRecognition-error
  - id: d
    text: 'It defines $\epsilon$ as a variable that approaches zero.'
    issueSignals:
    - id: conventionRecognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: proofStructure-error
  difficultyDimensions:
  - conventionRecognition
  - proofStructure
  - quantifierScope
  difficultyEvidence: Translates the standard 'Let X be given' idiom into its formal role as universal instantiation
    in a proof.
  explanation: |-
    Solution: It fixes an arbitrary positive number so that the author can establish a universal claim ($\\forall \\epsilon > 0$).
    Why it works: To prove a statement is true for *all* positive numbers, you must pick one number without assuming anything about it other than its positivity. If you can prove the result for this arbitrary 'given' $\\epsilon$, the result holds for all positive numbers.
    Why the other choices fail: B confuses universal generalization with existential instantiation (which would be 'Choose $\\epsilon = ...$'). C is a common psychological misconception; $\\epsilon$ can be a billion, the logic still holds. D confuses rigorous proof structure with informal limit intuition.
- id: q004
  type: multipleChoice
  prompt: In a proof by mathematical induction regarding a property $P(n)$, the author proves $P(1)$ is true. Then,
    they write 'Assume $P(k)$ is true for all $k$. Therefore, the property holds for all $n$.' What critical step
    is missing?
  choices:
  - id: a
    text: The author failed to prove that $P(k)$ implies $P(k+1)$.
  - id: b
    text: The author failed to prove the base case $P(0)$.
    issueSignals:
    - id: proofStructure-error
  - id: c
    text: The author failed to define what $k$ is.
    issueSignals:
    - id: proofStructure-error
  - id: d
    text: The author used weak induction instead of strong induction.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: proofStructure-error
  difficultyDimensions:
  - errorDiagnosis
  - proofStructure
  difficultyEvidence: Identifies the missing inductive step in a flawed induction proof.
  explanation: |-
    Solution: The author failed to prove that $P(k)$ implies $P(k+1)$.
    Why it works: Induction requires two steps: the base case ($P(1)$) and the inductive step (showing that if $P(k)$ is true, then $P(k+1)$ must also be true). The author merely assumed the conclusion rather than proving the necessary link.
    Why the other choices fail: B is incorrect because $P(1)$ is a perfectly valid base case. C is pedantic; the structural failure is the lack of the inductive step, not the variable definition. D is incorrect; strong induction isn't required here, the basic mechanism of induction is just entirely absent.
