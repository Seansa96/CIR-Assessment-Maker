questions:
- id: q001
  type: multipleChoice
  prompt: In a proof by contradiction of the statement 'If $P$ then $Q$', the author begins by assuming $P$ is true
    and $Q$ is false. They eventually deduce that $0 = 1$. What is the final logical step?
  choices:
  - id: a
    text: Because the assumption '$P$ and not $Q$' led to a falsehood, the assumption must be false, meaning 'If
      $P$ then $Q$' is true.
  - id: b
    text: Because $0=1$ is false, the hypothesis $P$ must have been false all along.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: The contradiction proves that $Q$ implies $P$.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: The contradiction means the theorem is unprovable.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - proofStructure
  - logicalEquivalence
  - errorDiagnosis
  difficultyEvidence: Identifies the closing logical mechanic of a proof by contradiction.
  explanation: 'Solution: Because the assumption ''$P$ and not $Q$'' led to a falsehood, the assumption must be
    false, meaning ''If $P$ then $Q$'' is true.

    Why it works: A proof by contradiction temporarily assumes the negation of the theorem ($P \\land \\neg Q$).
    By showing this leads to a logical impossibility, we conclude the negation is false, and therefore the original
    theorem ($P \\implies Q$) must be true.

    Why the other choices fail: B arbitrarily blames $P$, when the contradiction only proves that the *combination*
    of $P$ and $\\neg Q$ is impossible. C randomly invokes the converse. D misunderstands the method entirely; reaching
    a contradiction is the goal, meaning it *is* proven.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q002
  type: multipleChoice
  prompt: A student is asked to prove 'If a quadrilateral is a rectangle, then its diagonals are equal in length'.
    The student draws a quadrilateral with equal diagonals, uses geometry to prove all four angles are 90 degrees,
    and declares the proof complete. What error occurred?
  choices:
  - id: a
    text: The student proved the converse of the theorem instead of the theorem itself.
  - id: b
    text: The student proved the contrapositive instead of the direct theorem.
    issueSignals:
    - id: errorDiagnosis-failure
  - id: c
    text: The student used proof by contradiction incorrectly.
    issueSignals:
    - id: errorDiagnosis-failure
  - id: d
    text: There is no error; the student successfully proved the theorem.
    issueSignals:
    - id: errorDiagnosis-failure
  answer:
    choiceId: a
  issueSignals:
  - id: errorDiagnosis-failure
  difficultyDimensions:
  - errorDiagnosis
  - proofStructure
  - logicalEquivalence
  difficultyEvidence: Diagnoses the fallacy of proving the converse instead of the direct implication.
  explanation: 'Solution: The student proved the converse of the theorem instead of the theorem itself.

    Why it works: The theorem is ''Rectangle $\\implies$ Equal Diagonals''. The student assumed ''Equal Diagonals''
    and proved ''Rectangle''. This is $Q \\implies P$, which is the converse, not the requested theorem.

    Why the other choices fail: B is incorrect because a contrapositive proof would assume unequal diagonals and
    prove it''s not a rectangle. C is incorrect because there was no contradiction assumed. D fails to recognize
    the logical direction error.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q003
  type: multipleChoice
  prompt: At the beginning of a real analysis proof, the author writes 'Let $\epsilon > 0$ be given.' What is the
    logical purpose of this sentence?
  choices:
  - id: a
    text: It fixes an arbitrary positive number so that the author can establish a universal claim ($\forall \epsilon
      > 0$).
  - id: b
    text: It assumes that $\epsilon$ exists, which is the first step of an existential proof ($\exists \epsilon
      > 0$).
    issueSignals:
    - id: proofStructure-error
  - id: c
    text: It restricts the proof to only apply to small numbers.
    issueSignals:
    - id: conventionRecognition-error
  - id: d
    text: It defines $\epsilon$ as a variable that approaches zero.
    issueSignals:
    - id: conventionRecognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: proofStructure-error
  difficultyDimensions:
  - conventionRecognition
  - proofStructure
  - quantifierScope
  difficultyEvidence: Translates the standard 'Let X be given' idiom into its formal role as universal instantiation
    in a proof.
  explanation: 'Solution: It fixes an arbitrary positive number so that the author can establish a universal claim
    ($\\forall \\epsilon > 0$).

    Why it works: To prove a statement is true for *all* positive numbers, you must pick one number without assuming
    anything about it other than its positivity. If you can prove the result for this arbitrary ''given'' $\\epsilon$,
    the result holds for all positive numbers.

    Why the other choices fail: B confuses universal generalization with existential instantiation (which would
    be ''Choose $\\epsilon = ...$''). C is a common psychological misconception; $\\epsilon$ can be a billion, the
    logic still holds. D confuses rigorous proof structure with informal limit intuition.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q004
  type: multipleChoice
  prompt: In a proof by mathematical induction regarding a property $P(n)$, the author proves $P(1)$ is true. Then,
    they write 'Assume $P(k)$ is true for all $k$. Therefore, the property holds for all $n$.' What critical step
    is missing?
  choices:
  - id: a
    text: The author failed to prove that $P(k)$ implies $P(k+1)$.
  - id: b
    text: The author failed to prove the base case $P(0)$.
    issueSignals:
    - id: proofStructure-error
  - id: c
    text: The author failed to define what $k$ is.
    issueSignals:
    - id: proofStructure-error
  - id: d
    text: The author used weak induction instead of strong induction.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: proofStructure-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Identifies the missing inductive step in a flawed induction proof.
  explanation: 'Solution: The author failed to prove that $P(k)$ implies $P(k+1)$.

    Why it works: Induction requires two steps: the base case ($P(1)$) and the inductive step (showing that if $P(k)$
    is true, then $P(k+1)$ must also be true). The author merely assumed the conclusion rather than proving the
    necessary link.

    Why the other choices fail: B is incorrect because $P(1)$ is a perfectly valid base case. C is pedantic; the
    structural failure is the lack of the inductive step, not the variable definition. D is incorrect; strong induction
    isn''t required here, the basic mechanism of induction is just entirely absent.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q005
  type: multipleChoice
  prompt: A proof defines an auxiliary expression $u$, establishes $L \le u \le U$, and then invokes a theorem whose
    conclusion applies when a quantity is trapped between bounds. Which inference is justified by this structure?
  choices:
  - id: a
    text: The cited theorem may be applied only after the displayed bounds have been verified for $u$.
  - id: b
    text: Defining $u$ alone makes the conclusion of the cited theorem true.
    issueSignals:
    - id: auxiliary-object-overreach
  - id: c
    text: The bounds can be omitted because the theorem was named.
    issueSignals:
    - id: citation-without-hypotheses
  - id: d
    text: Any two inequalities about $u$ prove every later conclusion.
    issueSignals:
    - id: inequality-overgeneralization
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - conditionChecking
  - representationTransfer
  difficultyEvidence: Maps a displayed chain of inequalities to the applicability condition of the cited bounding
    theorem.
  explanation: 'Solution: The cited theorem may be applied only after the displayed bounds have been verified for
    $u$.

    Why it works: The source proof builds the inequalities first and cites the theorem as the next justified move;
    the bounds are its relevant input.

    Why the other choices fail: B makes a definition do logical work. C cites a result while ignoring its conditions.
    D treats unrelated inequalities as a universal proof device.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q006
  type: multipleChoice
  prompt: In the source-style sequence “Definition; Theorem; Proof,” a learner says, “The theorem is true because
    its terms were defined.” What is the best diagnosis?
  choices:
  - id: a
    text: The learner has confused defining the terms with proving that the theorem's claim follows from its hypotheses.
  - id: b
    text: The learner is correct because every definition is a proof.
    issueSignals:
    - id: definition-proof-confusion
  - id: c
    text: The theorem needs no hypotheses once a definition appears.
    issueSignals:
    - id: hypothesis-erasure
  - id: d
    text: The proof should be replaced by another copy of the definition.
    issueSignals:
    - id: exposition-role-confusion
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - conventionRecognition
  - conditionChecking
  difficultyEvidence: Separates the semantic function of a definition from the hypothesis-to-conclusion burden of
    a theorem proof.
  explanation: 'Solution: The learner has confused defining the terms with proving that the theorem''s claim follows
    from its hypotheses.

    Why it works: A definition fixes usage. A proof must still show why the asserted conclusion follows under the
    theorem''s stated conditions.

    Why the other choices fail: B equates meaning with justification. C removes conditions from the claim. D repeats
    terminology instead of providing a logical argument.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q007
  type: multipleChoice
  prompt: A proof has derived the needed bounds but ends with “Therefore the desired result holds” without naming
    the theorem that turns those bounds into the result. Which revision most directly repairs the exposition?
  choices:
  - id: a
    text: State the applicable bounding theorem and explain that its conditions are the bounds just established.
  - id: b
    text: Add a new definition after the conclusion.
    issueSignals:
    - id: definition-as-justification
  - id: c
    text: Delete the bounds so the conclusion appears sooner.
    issueSignals:
    - id: evidence-removal
  - id: d
    text: Repeat the conclusion several times without linking it to a result.
    issueSignals:
    - id: assertion-for-proof
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - explanationCompleteness
  - conditionChecking
  difficultyEvidence: Detects a missing warrant between established inequalities and a claimed conclusion, then
    selects a source-supported repair.
  explanation: 'Solution: State the applicable bounding theorem and explain that its conditions are the bounds just
    established.

    Why it works: The revision makes the dependency visible: verified bounds satisfy the cited theorem''s conditions,
    which yields the result.

    Why the other choices fail: B changes vocabulary, not the missing link. C removes the evidence. D is an unsupported
    assertion, however often it is repeated.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q008
  type: multipleChoice
  prompt: Which ordering best preserves the logical dependencies in a proof that uses an auxiliary quantity and
    a squeeze argument?
  choices:
  - id: a
    text: Define the auxiliary quantity; establish its bounds; verify the theorem's conditions; state the resulting
      conclusion.
  - id: b
    text: State the conclusion; define the auxiliary quantity; omit the bounds.
    issueSignals:
    - id: conclusion-before-warrant
  - id: c
    text: Cite the theorem; define the theorem; then decide whether its conditions hold.
    issueSignals:
    - id: theorem-definition-confusion
  - id: d
    text: Define the conclusion; assert the bounds; stop before applying any result.
    issueSignals:
    - id: incomplete-proof-chain
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - sequencing
  - conditionChecking
  difficultyEvidence: Reconstructs the order required for an auxiliary construction, inequality evidence, and theorem
    application.
  explanation: 'Solution: Define the auxiliary quantity; establish its bounds; verify the theorem''s conditions;
    state the resulting conclusion.

    Why it works: Each step supplies information required by the next: the object to bound, the bounds, the theorem''s
    inputs, and then its output.

    Why the other choices fail: B concludes before evidence. C confuses citing with defining and postpones condition
    checks. D never reaches a justified conclusion.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q009
  type: multipleChoice
  prompt: A displayed calculation is correct, but it does not mention how it connects to the theorem being proved.
    What must a complete proof reader look for next?
  choices:
  - id: a
    text: A justified link showing how that calculation advances from the theorem's hypotheses toward its conclusion.
  - id: b
    text: A more complicated calculation, regardless of its purpose.
    issueSignals:
    - id: complexity-for-justification
  - id: c
    text: A definition that makes the calculation automatically relevant.
    issueSignals:
    - id: definition-as-relevance
  - id: d
    text: A conclusion chosen before the calculation is interpreted.
    issueSignals:
    - id: reverse-proof-direction
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - relevanceFiltering
  - explanationCompleteness
  difficultyEvidence: Evaluates a correct local calculation for its explicit logical role in a theorem proof rather
    than treating correctness as sufficiency.
  explanation: 'Solution: A justified link showing how that calculation advances from the theorem''s hypotheses
    toward its conclusion.

    Why it works: Proof reading tracks dependencies, not only algebraic accuracy; each line must support a later
    inference or conclusion.

    Why the other choices fail: B substitutes difficulty for relevance. C does not create a logical connection.
    D chooses an endpoint before the argument warrants it.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
- id: q010
  type: multipleChoice
  prompt: An author writes “This proves the theorem” after deriving the theorem's stated conclusion from its hypotheses
    using previously justified steps. Why is that closing sentence appropriate?
  choices:
  - id: a
    text: It marks that the proof chain has reached the specific claim announced by the theorem.
  - id: b
    text: It makes an unsupported claim true merely by marking it as finished.
    issueSignals:
    - id: conclusion-marker-magic
  - id: c
    text: It replaces the need for the theorem's hypotheses.
    issueSignals:
    - id: hypothesis-erasure
  - id: d
    text: It converts every preceding line into a definition.
    issueSignals:
    - id: proof-definition-confusion
  answer:
    choiceId: a
  difficultyDimensions:
  - conventionRecognition
  - argumentMapping
  - conditionChecking
  difficultyEvidence: Interprets a proof-closing convention only after checking that the announced conclusion has
    been derived from the stated hypotheses.
  explanation: 'Solution: It marks that the proof chain has reached the specific claim announced by the theorem.

    Why it works: The closing language summarizes an already completed derivation; it does not supply the derivation
    itself.

    Why the other choices fail: B gives the marker magical force. C discards required assumptions. D confuses a
    proof''s conclusion with a definition.'
  prerequisiteObjectiveIds:
  - ml-theorem-reading-02
