  prompt: Formula for area between $f(y)$ (right) and $g(y)$ (left) from $c$ to $d$.
  answer:
    expectedLatex: \int_c^d (f(y) - g(y)) \, dy
    aliases:
    - \int_c^d (f(y)-g(y)) dy
