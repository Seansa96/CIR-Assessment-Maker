schemaVersion: 1
id: phys-fric-tiered-setup-test
title: Friction - Tiered Setup Test
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-friction
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - translation-only
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 20
questions:
- id: fric-test-t1-1
  type: multipleChoice
  prompt: '[Tier 1: Direct] Set up the equation for a block sliding to a stop on a
   \rhorizontal surface.'
  choices:
  - id: a
    text: $-\mu_k mg = m a_x$
  - id: b
    text: $\mu_k mg = 0$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Normal force equals mg. Friction is the only
   \rhorizontal force, pointing opposite to velocity.'
- id: fric-test-t2-1
  type: multipleChoice
  prompt: '[Tier 2: Disguised] Set up the equation to find the minimum coefficient
    of static friction to park a car on a hill of angle $\theta$.'
  choices:
  - id: a
    text: $\mu_s (mg\cos\theta) = mg\sin\theta \implies \mu_s = \tan\theta$
  - id: b
    text: $\mu_s mg = mg\sin\theta$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Normal force is $mg\cos\theta$. The required
    friction must balance $mg\sin\theta$.'
- id: fric-test-t3-1
  type: multipleChoice
  prompt: '[Tier 3: Exam-Style] A block $m_1$ on a rough\rhorizontal table ($\mu_k$)
    is pulled by a hanging mass $m_2$ via a pulley. Set up the system of equations.'
  choices:
  - id: a
    text: $T - \mu_k m_1 g = m_1 a$ and $m_2 g - T = m_2 a$
  - id: b
    text: $m_2 g - \mu_k m_1 g = 0$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Coupled system. $T$ pulls $m_1$ forward, friction
    opposes. For $m_2$, gravity pulls down, $T$ pulls up.'
- id: fric-test-t4-1
  type: multipleChoice
  prompt: '[Tier 4: Novel] A rotating cylindrical space station creates artificial
    gravity. A person leans against a vertical wall. Set up the friction equation
    preventing them from sliding down the wall.'
  choices:
  - id: a
    text: $f_s = mg \le \mu_s (m \frac{v^2}{R})$
  - id: b
    text: $f_s = \mu_s mg$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The ''Normal'' force is the centripetal force
    $mv^2/R$. Friction must balance actual gravity $mg$.'
