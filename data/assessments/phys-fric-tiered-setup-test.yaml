questions:
  - id: fric-tier-q01
    title: Level 1 - Identify the Normal Force Equation
    type: symbolicResponse
    prompt: |
      A block of mass $m$ is being pulled across a horizontal floor by a rope. The rope makes an angle $\theta$ **above** the horizontal, and the tension is $T$. Enter the expression for the normal force $N$ acting on the block. Use $g$ for gravity.
    answer:
      expectedLatex: m*g - T*\sin(\theta)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      **Step 1:** Identify vertical forces. Gravity ($mg$) points down. Normal force ($N$) points up. The vertical component of tension ($T\sin\theta$) points up.
      **Step 2:** The block does not accelerate vertically, so forces balance: $N + T\sin\theta = mg$.
      **Step 3:** Solve for $N = mg - T\sin\theta$.

  - id: fric-tier-q02
    title: Level 1 - Identify the Friction Equation
    type: symbolicResponse
    prompt: |
      Following the previous question (mass $m$, horizontal floor, rope at angle $\theta$ above horizontal with tension $T$), if the block is sliding and the coefficient of kinetic friction is $\mu_k$, enter the expression for the magnitude of the kinetic friction force $f_k$.
    answer:
      expectedLatex: \mu_k*(m*g - T*\sin(\theta))
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      **Step 1:** Recall the definition of kinetic friction: $f_k = \mu_k N$.
      **Step 2:** Substitute the normal force found previously ($N = mg - T\sin\theta$).
      **Result:** $f_k = \mu_k(mg - T\sin\theta)$.

  - id: fric-tier-q03
    title: Level 2 - Horizontal Acceleration Setup
    type: symbolicResponse
    prompt: |
      Using the same scenario (mass $m$, horizontal floor, pulling force $T$ at angle $\theta$ above horizontal, kinetic friction $\mu_k$), write the expression for the horizontal acceleration $a$ of the block.
    answer:
      expectedLatex: (T*\cos(\theta) - \mu_k*(m*g - T*\sin(\theta)))/m
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      **Step 1:** Set up Newton's Second Law for the horizontal direction: $\sum F_x = ma$.
      **Step 2:** The forward force is $T\cos\theta$. The backward force is $f_k = \mu_k(mg - T\sin\theta)$.
      **Step 3:** $T\cos\theta - \mu_k(mg - T\sin\theta) = ma$.
      **Step 4:** Divide by $m$ to get $a$.

  - id: fric-tier-q04
    title: Level 1 - Incline Normal Force
    type: symbolicResponse
    prompt: |
      A block of mass $M$ is placed on a ramp angled at $\phi$ relative to the horizontal. No other objects are touching it. Enter the expression for the normal force $N$ exerted by the ramp on the block.
    answer:
      expectedLatex: M*g*\cos(\phi)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      On an incline, the component of gravity perpendicular to the surface is $Mg\cos\phi$. Since there are no other forces perpendicular to the ramp and the block doesn't accelerate through the ramp, $N = Mg\cos\phi$.

  - id: fric-tier-q05
    title: Level 2 - Incline Net Force Setup
    type: symbolicResponse
    prompt: |
      The block of mass $M$ is sliding down the ramp (angle $\phi$). The coefficient of kinetic friction is $\mu_k$. Enter the expression for the NET force down the ramp.
    answer:
      expectedLatex: M*g*\sin(\phi) - \mu_k*M*g*\cos(\phi)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      **Step 1:** The force pulling it down the ramp is the parallel component of gravity: $Mg\sin\phi$.
      **Step 2:** The force resisting the motion is kinetic friction pointing up the ramp: $f_k = \mu_k N = \mu_k Mg\cos\phi$.
      **Result:** Net force = $Mg\sin\phi - \mu_k Mg\cos\phi$.

  - id: fric-tier-q06
    title: Level 3 - Terminal Velocity on Incline
    type: symbolicResponse
    prompt: |
      A block of mass $M$ slides down a rough ramp of angle $\phi$ at a **constant velocity**. Enter the expression for the coefficient of kinetic friction $\mu_k$ in terms of the angle $\phi$.
    answer:
      expectedLatex: \tan(\phi)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Constant velocity means net force is zero.
      $Mg\sin\phi - \mu_k Mg\cos\phi = 0$.
      $Mg\sin\phi = \mu_k Mg\cos\phi$.
      Divide both sides by $Mg\cos\phi$: $\mu_k = \frac{\sin\phi}{\cos\phi} = \tan\phi$.

  - id: fric-tier-q07
    title: Level 1 - Stacked Blocks Normal Force
    type: symbolicResponse
    prompt: |
      Block A (mass $m_A$) sits on top of Block B (mass $m_B$). Block B sits on a horizontal table. Enter the expression for the normal force $N_{AB}$ that Block B exerts on Block A.
    answer:
      expectedLatex: m_A*g
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Considering only Block A, the only vertical forces on it are its own gravity ($m_A g$ down) and the normal force from B ($N_{AB}$ up). Since it's not accelerating vertically, $N_{AB} = m_A g$.

  - id: fric-tier-q08
    title: Level 2 - Stacked Blocks Bottom Normal Force
    type: symbolicResponse
    prompt: |
      Following the previous scenario (Block A on Block B on a table), enter the expression for the normal force $N_\text{table}$ that the table exerts on Block B.
    answer:
      expectedLatex: (m_A + m_B)*g
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Considering the entire system of (Block A + Block B), the total downward gravity force is $(m_A + m_B)g$. The table must support this entire weight, so $N_\text{table} = (m_A + m_B)g$. (Alternatively, analyzing just B: $N_\text{table} = m_B g + N_{AB, \text{down}} = m_B g + m_A g$).

  - id: fric-tier-q09
    title: Level 2 - Atwood with Friction Tension
    type: symbolicResponse
    prompt: |
      Mass $m_1$ is on a horizontal table with friction coefficient $\mu_k$. It is connected by a string over a pulley to a hanging mass $m_2$. The system accelerates such that $m_2$ moves downwards with acceleration $a$. Write the expression for the tension $T$ in the string, considering ONLY the equation for the hanging mass $m_2$.
    answer:
      expectedLatex: m_2*(g - a)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      For the hanging mass $m_2$, gravity pulls down ($m_2 g$) and tension pulls up ($T$). The net acceleration is downward ($a$).
      Newton's Second Law: $m_2 g - T = m_2 a$.
      Solving for T: $T = m_2 g - m_2 a = m_2(g - a)$.

  - id: fric-tier-q10
    title: Level 3 - Atwood with Friction Full Acceleration
    type: symbolicResponse
    prompt: |
      Using the same Atwood setup ($m_1$ on rough table with $\mu_k$, $m_2$ hanging), enter the full expression for the acceleration $a$ of the system.
    answer:
      expectedLatex: (m_2*g - \mu_k*m_1*g)/(m_1 + m_2)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      System approach: The driving force is $m_2 g$. The opposing force is friction on the table $f_k = \mu_k m_1 g$.
      Net force = $m_2 g - \mu_k m_1 g$.
      Total mass = $m_1 + m_2$.
      $a = \frac{m_2 g - \mu_k m_1 g}{m_1 + m_2}$.

  - id: fric-tier-q11
    title: Level 1 - Pushing against a Wall
    type: symbolicResponse
    prompt: |
      You push a block of mass $m$ horizontally against a vertical wall with a force $F$. The coefficient of static friction is $\mu_s$. Enter the expression for the maximum possible static friction force.
    answer:
      expectedLatex: \mu_s*F
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The normal force from the wall balances the horizontal push: $N = F$.
      Maximum static friction is $f_{s,\max} = \mu_s N = \mu_s F$.

  - id: fric-tier-q12
    title: Level 2 - Minimum Push on a Wall
    type: symbolicResponse
    prompt: |
      In the previous scenario (block of mass $m$ pushed horizontally against a vertical wall with $\mu_s$), enter the expression for the MINIMUM push force $F$ required to keep the block from sliding down.
    answer:
      expectedLatex: m*g/\mu_s
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      To not slide down, the upward static friction must balance downward gravity: $f_s = mg$.
      The maximum friction available is $\mu_s F$.
      For the minimum push, we need $\mu_s F = mg$.
      Solving for $F$ gives $F = \frac{mg}{\mu_s}$.

  - id: fric-tier-q13
    title: Level 1 - Two Forces on Incline
    type: numericResponse
    prompt: |
      A $2.0\text{ kg}$ block is on a $30°$ incline ($\mu_k = 0.10$). You pull it UP the incline with a string (parallel to incline) with a tension of $30\text{ N}$. Calculate the magnitude of the friction force (in Newtons) opposing this motion. Use $g = 9.8\text{ m/s}^2$ and round to one decimal place.
    answer:
      value: 1.7
      tolerance: 0.1
    explanation: |
      $f_k = \mu_k N = \mu_k(mg\cos 30°)$.
      $f_k = 0.10(2.0)(9.8)\cos 30° = 1.96(0.866) \approx 1.697\text{ N}$.
      Rounds to $1.7\text{ N}$.

  - id: fric-tier-q14
    title: Level 2 - Two Forces on Incline (Acceleration)
    type: numericResponse
    prompt: |
      Using the values from the previous question ($m = 2.0\text{ kg}$, $30°$ incline, $\mu_k = 0.10$, pulling UP with $30\text{ N}$), calculate the acceleration of the block in m/s². Round to one decimal place.
    answer:
      value: 9.3
      tolerance: 0.1
    explanation: |
      Upward force: $T = 30\text{ N}$.
      Downward forces: Gravity component $mg\sin 30° = 2.0(9.8)(0.5) = 9.8\text{ N}$.
      Friction (opposing upward motion): $f_k \approx 1.70\text{ N}$.
      Net force = $30 - 9.8 - 1.70 = 18.5\text{ N}$.
      Acceleration $a = F_\text{net} / m = 18.5 / 2.0 = 9.25\text{ m/s}^2$. Rounds to $9.3\text{ m/s}^2$.

  - id: fric-tier-q15
    title: Level 3 - Block on Accelerating Cart
    type: symbolicResponse
    prompt: |
      A block of mass $m$ sits on a flatbed cart. The cart accelerates to the right with acceleration $a$. The block does not slip. What is the expression for the static friction force $f_s$ acting on the block?
    answer:
      expectedLatex: m*a
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The block is accelerating to the right at exactly the same rate as the cart ($a$). The only horizontal force acting on the block to cause this acceleration is the static friction from the cart. Therefore, by Newton's Second Law, $f_s = ma$.
