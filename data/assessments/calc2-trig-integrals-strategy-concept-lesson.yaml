lesson:
  introduction: 'Trigonometric power integrals are decided by structure. The useful
    question is not

    merely which substitution looks familiar, but whether the integrand contains the

    derivative factor needed to express everything in one variable.


    This lesson builds a decision tree for powers of sine and cosine and for powers
    of

    tangent and secant. It also identifies the important odd-secant exception that
    leads

    to integration by parts and reduction formulas.

    '
  sections:
  - id: substitution-needs-a-companion
    title: A substitution needs its differential companion
    required: true
    content: 'Suppose the integrand contains only a power of cosine:


      $$

      \int \cos^3 x\,dx.

      $$


      Choosing $u=\cos x$ immediately gives


      $$

      du=-\sin x\,dx.

      $$


      That differential is not currently present. A substitution is useful only when

      the remaining factors can supply the derivative of the chosen inner function.


      Instead, save one factor of $\cos x\,dx$ and rewrite the remaining even power:


      $$

      \cos^3x=\cos^2x\cos x=(1-\sin^2x)\cos x.

      $$


      Now $u=\sin x$ works because $du=\cos x\,dx$, and every other factor can be

      written as a polynomial in $u$.

      '
    check:
      id: substitution-needs-a-companion-check
      type: multipleChoice
      prompt: 'Why is $u=\cos x$ not the useful first substitution for

        $\int\cos^3x\,dx$?

        '
      choices:
      - id: a
        text: Its differential requires a factor of $\sin x\,dx$, which is not available.
      - id: b
        text: $\cos x$ cannot be used as a substitution variable.
      - id: c
        text: Odd powers cannot be integrated.
      - id: d
        text: The Pythagorean identity applies only to even exponents.
      answer:
        choiceId: a
      explanation: 'The obstacle is the missing derivative factor. Saving one cosine
        factor instead

        makes $u=\sin x$ available.


        Related topic: reverse chain rule and differential matching.

        '
  - id: odd-sine-power
    title: Odd sine power means save one sine
    required: true
    content: 'For


      $$

      \int \sin^m x\cos^n x\,dx,

      $$


      if $m$ is odd, separate one factor of $\sin x\,dx$. The remaining sine power
      is

      even, so it is a power of $\sin^2x$ and can be converted using


      $$

      \sin^2x=1-\cos^2x.

      $$


      The resulting integrand is a polynomial in $\cos x$ multiplied by

      $\sin x\,dx$, so use


      $$

      u=\cos x,\qquad du=-\sin x\,dx.

      $$


      The odd exponent is valuable because removing one factor leaves an even exponent

      that can be rewritten completely through the Pythagorean identity.

      '
    check:
      id: odd-sine-power-check
      type: multipleChoice
      prompt: 'Which first rewrite prepares


        $$

        \int\sin^5x\cos^2x\,dx

        $$


        for one-variable substitution?

        '
      choices:
      - id: a
        text: $\int(1-\cos^2x)^2\cos^2x\sin x\,dx$
      - id: b
        text: $\int\sin^5x(1-\sin^2x)\,dx$
      - id: c
        text: $\int(1+\tan^2x)^2\,dx$
      - id: d
        text: $\int\sin^4x\cos^2x\,dx$
      answer:
        choiceId: a
      explanation: 'Save one $\sin x\,dx$, rewrite $\sin^4x=(1-\cos^2x)^2$, and then
        use

        $u=\cos x$.


        Related topic: odd powers of sine.

        '
  - id: odd-cosine-power
    title: Odd cosine power means save one cosine
    required: true
    content: 'If the cosine exponent is odd, use the mirror strategy:


      1. Save one $\cos x\,dx$.

      2. Rewrite the remaining even cosine power with


      $$

      \cos^2x=1-\sin^2x.

      $$


      3. Let


      $$

      u=\sin x,\qquad du=\cos x\,dx.

      $$


      For example,


      $$

      \sin^2x\cos^3x

      =\sin^2x(1-\sin^2x)\cos x.

      $$

      '
    check:
      id: odd-cosine-power-check
      type: multipleChoice
      prompt: 'For $\int\sin^4x\cos^3x\,dx$, which substitution should the saved odd

        cosine factor support?

        '
      choices:
      - id: a
        text: $u=\sin x$
      - id: b
        text: $u=\cos x$
      - id: c
        text: $u=\tan x$
      - id: d
        text: $u=x^2$
      answer:
        choiceId: a
      explanation: 'Save $\cos x\,dx$, rewrite the remaining $\cos^2x$, and use

        $du=\cos x\,dx$.


        Related topic: odd powers of cosine.

        '
  - id: both-sine-cosine-even
    title: If both powers are even, reduce the powers
    required: true
    content: 'When both sine and cosine powers are even, neither function has a spare
      odd factor

      to save. The substitution strategy cannot convert the entire integrand into
      one

      variable.


      Use power-reduction identities:


      $$

      \sin^2x=\frac{1-\cos(2x)}{2},

      \qquad

      \cos^2x=\frac{1+\cos(2x)}{2}.

      $$


      For a product such as $\sin^2x\cos^2x$, it is often shorter to first use


      $$

      \sin x\cos x=\frac{1}{2}\sin(2x),

      $$


      giving


      $$

      \sin^2x\cos^2x=\frac{1}{4}\sin^2(2x),

      $$


      and then reduce the remaining square.

      '
    check:
      id: both-sine-cosine-even-check
      type: multipleChoice
      prompt: 'What is the structural reason power reduction is preferred for

        $\int\sin^4x\cos^2x\,dx$?

        '
      choices:
      - id: a
        text: There is no odd sine or cosine factor whose removal leaves an even power
          and supplies a differential.
      - id: b
        text: Even powers always require integration by parts.
      - id: c
        text: Pythagorean identities cannot be used with powers.
      - id: d
        text: The integral is already a polynomial in $x$.
      answer:
        choiceId: a
      explanation: 'With both powers even, saving one factor would leave an odd power
        that cannot be

        converted solely through $\sin^2x+\cos^2x=1$.


        Related topic: power-reduction identities.

        '
  - id: tangent-secant-even-secant
    title: Even secant power means save secant squared
    required: true
    content: 'For


      $$

      \int\tan^m x\sec^n x\,dx,

      $$


      if $n$ is even and at least $2$, save


      $$

      \sec^2x\,dx.

      $$


      Convert every remaining even secant pair using


      $$

      \sec^2x=1+\tan^2x,

      $$


      then use


      $$

      u=\tan x,\qquad du=\sec^2x\,dx.

      $$


      Example:


      $$

      \tan^8x\sec^4x\,dx

      =\tan^8x\sec^2x(\sec^2x\,dx)

      \longrightarrow

      u^8(1+u^2)\,du.

      $$

      '
    check:
      id: tangent-secant-even-secant-check
      type: multipleChoice
      prompt: 'For $\int\tan^6x\sec^4x\,dx$, what should be reserved for the differential?

        '
      choices:
      - id: a
        text: $\sec^2x\,dx$
      - id: b
        text: $\sec x\tan x\,dx$
      - id: c
        text: $\tan^2x\,dx$
      - id: d
        text: $\sin x\,dx$
      answer:
        choiceId: a
      explanation: 'An even secant power contains a $\sec^2x$ factor, which matches
        the derivative

        of $\tan x$.


        Related topic: even secant power strategy.

        '
  - id: tangent-secant-odd-tangent
    title: Odd tangent power means save secant tangent
    required: true
    content: 'If the tangent exponent $m$ is odd and there is at least one secant
      factor, save


      $$

      \sec x\tan x\,dx.

      $$


      Removing one tangent leaves an even tangent power. Convert it with


      $$

      \tan^2x=\sec^2x-1,

      $$


      and use


      $$

      u=\sec x,\qquad du=\sec x\tan x\,dx.

      $$


      Example:


      $$

      \tan^3x\sec^5x

      =\tan^2x\sec^4x(\sec x\tan x)

      \longrightarrow

      (u^2-1)u^4\,du.

      $$

      '
    check:
      id: tangent-secant-odd-tangent-check
      type: multipleChoice
      prompt: 'Which transformed polynomial follows from

        $\int\tan^3x\sec^5x\,dx$ with $u=\sec x$?

        '
      choices:
      - id: a
        text: $\int(u^2-1)u^4\,du$
      - id: b
        text: $\int(1-u^2)u^4\,du$
      - id: c
        text: $\int u^3(1+u^2)\,du$
      - id: d
        text: $\int\frac{u^4}{u^2-1}\,du$
      answer:
        choiceId: a
      explanation: 'Save $\sec x\tan x\,dx$, replace $\tan^2x$ by $\sec^2x-1$, and
        substitute

        $u=\sec x$.


        Related topic: odd tangent power strategy.

        '
  - id: neither-standard-trigger
    title: When neither parity trigger applies
    required: true
    content: 'Some integrals do not contain either standard differential package.
      A key example

      is


      $$

      \int\sec^3x\,dx.

      $$


      The secant power is odd, not even, and there is no tangent factor to save. A
      direct

      substitution does not express the entire integral in one variable.


      This is a signal to use a special method:


      - integration by parts for $\int\sec^3x\,dx$,

      - a reduction formula for higher odd powers of secant,

      - the parallel method for odd powers of cosecant,

      - algebraic rewriting for pure powers such as $\int\tan^3x\,dx$.


      These are not failures of the decision tree. They are the branch reached when

      neither derivative-matching parity condition is available.

      '
    check:
      id: neither-standard-trigger-check
      type: multipleChoice
      prompt: 'Why does $\int\sec^3x\,dx$ require a special cyclic integration-by-parts

        argument?

        '
      choices:
      - id: a
        text: It has neither a saved $\sec^2x\,dx$ package nor a $\sec x\tan x\,dx$
          package.
      - id: b
        text: Secant has no derivative.
      - id: c
        text: Odd powers always require partial fractions.
      - id: d
        text: $\sec^3x$ is not a trigonometric function.
      answer:
        choiceId: a
      explanation: 'Neither standard tangent-secant substitution package is present.
        Integration by

        parts recreates the original integral, allowing it to be solved algebraically.


        Related topic: cyclic integration by parts for odd secant powers.

        '
  - id: strategy-synthesis
    title: Use the parity decision tree
    required: true
    content: "For sine and cosine powers:\n\n1. Odd sine power: save $\\sin x\\,dx$,\
      \ convert sine pairs, use $u=\\cos x$.\n2. Odd cosine power: save $\\cos x\\\
      ,dx$, convert cosine pairs, use $u=\\sin x$.\n3. Both even: use power reduction,\
      \ often simplifying products first.\n\nFor tangent and secant powers:\n\n1.\
      \ Even secant power: save $\\sec^2x\\,dx$, use $u=\\tan x$.\n2. Odd tangent\
      \ power with secant present: save $\\sec x\\tan x\\,dx$, use\n   $u=\\sec x$.\n\
      3. Neither condition: rewrite algebraically or use special integration-by-parts\n\
      \   and reduction methods.\n\nAlways verify the selected substitution can express\
      \ every remaining factor in the\nnew variable.\n"
    check:
      id: strategy-synthesis-check
      type: selectAll
      prompt: 'Select every correctly matched strategy.

        '
      choices:
      - id: a
        text: '$\sin^7x\cos^2x$: save $\sin x\,dx$ and use $u=\cos x$'
      - id: b
        text: '$\sin^4x\cos^2x$: use power reduction'
      - id: c
        text: '$\tan^4x\sec^6x$: save $\sec^2x\,dx$ and use $u=\tan x$'
      - id: d
        text: '$\tan^5x\sec^3x$: save $\sec x\tan x\,dx$ and use $u=\sec x$'
      answer:
        choiceIds:
        - a
        - b
        - c
        - d
      explanation: 'Each choice follows directly from the parity trigger and leaves
        the remaining

        integrand expressible in the selected substitution variable.


        Related topic: trigonometric integral strategy selection.

        '
