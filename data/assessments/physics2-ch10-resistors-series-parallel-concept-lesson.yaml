title: Resistors in Series and Parallel
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-dc-circuits
workedExamples:
- id: l1-sec1
  title: Series Resistors
  explanation: 'When resistors are in series, the same current passes through all
    of them. The equivalent resistance is the sum of the individual resistances: $R_{eq}
    = R_1 + R_2 + \dots$'
- id: l1-sec2
  title: Parallel Resistors
  explanation: 'When resistors are in parallel, the potential difference across each
    is the same. The equivalent resistance is given by: $\frac{1}{R_{eq}} = \frac{1}{R_1}
    + \frac{1}{R_2} + \dots$'
