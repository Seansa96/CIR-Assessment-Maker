lesson:
  introduction: >
    This lesson develops a repeatable way to solve Resistors in Series and Parallel problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch10-resistors-series-parallel-s1
    title: Name the model and quantities
    required: true
    content: >
      Resistors in Series and Parallel uses R_eq = sum R_i. In the name the model and quantities stage, reduce a network by identifying truly series and parallel groups before substituting values.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Resistors in Series and Parallel problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch10-resistors-series-parallel-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Resistors in Series and Parallel, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use R_eq = sum R_i after you reduce a network by identifying truly series and parallel groups before substituting values.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Resistors in Series and Parallel problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-resistors-series-parallel-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables R_eq = sum R_i relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-resistors-series-parallel-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Resistors in Series and Parallel.
        media: []
        issueSignals:
        - id: physics2-physics2-ch10-resistors-series-parallel-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Resistors in Series and Parallel, first reduce a network by identifying truly series and parallel groups before substituting values. Then apply R_eq = sum R_i with one consistent coordinate system and solve for the requested quantity.


        Why it works: R_eq = sum R_i connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
