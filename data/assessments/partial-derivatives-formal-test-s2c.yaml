questions:
- id: q001
  type: multipleChoice
  prompt: For $f(x,y)=2x^4y-5y^2$, what is $f_x$?
  choices:
  - id: a
    text: $0$ (drops the derivative of $x^4$)
    issueSignals:
    - id: product-rule-misapplied
  - id: b
    text: $8x^3y-10y$
    issueSignals:
    - id: product-rule-misapplied
  - id: c
    text: $8x^4$
    issueSignals:
    - id: product-rule-misapplied
  - id: d
    text: $8x^3y$
  answer:
    choiceId: d
  issueSignals:
  - id: product-rule-misapplied
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Power-rule partial requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: Holding y fixed gives $f_x=8x^3y$.


    Why it works: The y-only term has zero x derivative.


    Why the other choices fail:


    Choice a: This differentiates in y rather than x.

    Choice b: The y-only term is constant in x.

    Choice c: This omits the y coefficient.'
- id: q002
  type: multipleChoice
  prompt: For $g(x,y)=\cos(x^2+y)$, what is $g_x$?
  choices:
  - id: a
    text: $-\sin(x^2+y)$
    issueSignals:
    - id: chain-rule-missed
  - id: b
    text: $2x\sin(x^2+y)$
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: $-2x\sin(x^2+y)$
  - id: d
    text: $-2x\cos(x^2+y)$
    issueSignals:
    - id: chain-rule-missed
  answer:
    choiceId: c
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Composite chain rule requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: Differentiate the outer cosine and multiply by $(x^2+y)_x=2x$.


    Why it works: The chain rule accounts for the changing inner argument.


    Why the other choices fail:


    Choice a: This omits the inner x derivative $2x$.

    Choice b: Cosine differentiation contributes a negative sign.

    Choice d: This keeps cosine instead of differentiating the outer function.'
- id: q003
  type: multipleChoice
  prompt: Let $g(x)=f(x,3)$. What does $g\prime(2)$ measure geometrically?
  choices:
  - id: a
    text: $f(2,3)$, the surface height
    issueSignals:
    - id: held-variable-confusion
  - id: b
    text: The tangent slope of the trace $y=3$, equal to $f_x(2,3)$.
  - id: c
    text: $f_y(2,3)$, the trace where x is fixed
    issueSignals:
    - id: held-variable-confusion
  - id: d
    text: The maximum slope in any direction
    issueSignals:
    - id: held-variable-confusion
  answer:
    choiceId: b
  issueSignals:
  - id: held-variable-confusion
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Coordinate-slice geometry requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: The slice fixes y and varies x, so its slope is $f_x(2,3)$.


    Why it works: A coordinate partial is the ordinary derivative along the corresponding surface trace.


    Why the other choices fail:


    Choice a: Height is not tangent slope.

    Choice c: That is the other coordinate slice.

    Choice d: A coordinate partial is not a maximum over directions.'
- id: q004
  type: multipleChoice
  prompt: If the second partials are continuous on a disk around $(1,-1)$, which conclusion follows?
  choices:
  - id: a
    text: $f_{xy}(1,-1)=f_{yx}(1,-1)$
  - id: b
    text: Both mixed partials must be zero
    issueSignals:
    - id: mixed-partial-order
  - id: c
    text: They are equal only if $f_x=f_y$ at the point
    issueSignals:
    - id: mixed-partial-order
  - id: d
    text: No conclusion is possible
    issueSignals:
    - id: mixed-partial-order
  answer:
    choiceId: a
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Theorem application requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: Clairaut''s theorem gives equality of the two mixed partials.


    Why it works: The specified neighborhood supplies the required continuity condition.


    Why the other choices fail:


    Choice b: The theorem equates values but does not force zero.

    Choice c: First derivative values are irrelevant to the continuity condition.

    Choice d: The stated continuity is a sufficient condition.'
- id: q005
  type: multipleChoice
  prompt: Let $T(x,y)=x^2e^y+xy^2$. What is $T_x(2,0)?
  choices:
  - id: a
    text: $0$ (drops the $x^2e^y$ term)
    issueSignals:
    - id: held-variable-confusion
  - id: b
    text: '2'
    issueSignals:
    - id: held-variable-confusion
  - id: c
    text: $e$
    issueSignals:
    - id: held-variable-confusion
  - id: d
    text: '4'
  answer:
    choiceId: d
  issueSignals:
  - id: held-variable-confusion
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Applied partial rate requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds: []
  explanation: 'Solution: $T_x=2xe^y+y^2$, so $T_x(2,0)=4.


    Why it works: Differentiate in x with y held fixed, then evaluate at the given point.


    Why the other choices fail:


    Choice a: The derivative of $x^2e^y$ is nonzero at x=2.

    Choice b: This drops the factor x from the derivative of $x^2$.

    Choice c: Although $e^y=1$ at y=0, the x power still contributes a factor 4.'
- id: q006
  type: multipleChoice
  prompt: For $f(x,y)=x^3y^2-4xy+2y$, what is $f_{xy}?
  choices:
  - id: a
    text: $3x^2y^2-4y$
    issueSignals:
    - id: mixed-partial-order
  - id: b
    text: $6xy-4$
    issueSignals:
    - id: mixed-partial-order
  - id: c
    text: $6x^2y-4$
  - id: d
    text: $6x^2y+4$
    issueSignals:
    - id: mixed-partial-order
  answer:
    choiceId: c
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Ordered mixed polynomial derivative requires the student to track the requested variable
    or derivative order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: $f_x=3x^2y^2-4y$, so $f_{xy}=6x^2y-4.


    Why it works: The requested order differentiates in x first and then differentiates that result in y.


    Why the other choices fail:


    Choice a: This is the first x partial before the y derivative.

    Choice b: Differentiating $3x^2y^2$ in y gives $6x^2y$, not $6xy$.

    Choice d: The derivative of $-4y$ is -4, preserving the negative sign.'
- id: q007
  type: multipleChoice
  prompt: For $L=\ln(x^2+y^2)$, find $L_{xx}(1,1)$.
  choices:
  - id: a
    text: '1'
    issueSignals:
    - id: chain-rule-missed
  - id: b
    text: '0'
  - id: c
    text: '-1'
    issueSignals:
    - id: chain-rule-missed
  - id: d
    text: $1/2$ (keeps only the first quotient-rule term)
    issueSignals:
    - id: chain-rule-missed
  answer:
    choiceId: b
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Pure second derivative of quotient requires the student to track the requested variable
    or derivative order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: $L_x=2x/(x^2+y^2)$ and $L_{xx}=2/(x^2+y^2)-4x^2/(x^2+y^2)^2=0$ at $(1,1)$.


    Why it works: The quotient rule contributes both terms, which cancel after evaluation.


    Why the other choices fail:


    Choice a: This keeps only the first term of the second derivative.

    Choice c: The two terms cancel at the point.

    Choice d: This omits the derivative of the denominator.'
- id: q008
  type: multipleChoice
  prompt: For $V(x,y)=\ln(1+x^2+2y^2)$, find $V_{xy}(1,1).
  choices:
  - id: a
    text: $-1/2$
  - id: b
    text: $1/2$ (loses the negative reciprocal-derivative sign)
    issueSignals:
    - id: sign-error
  - id: c
    text: $-1/4$
    issueSignals:
    - id: sign-error
  - id: d
    text: '0'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: sign-error
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Mixed quotient derivative requires the student to track the requested variable or derivative
    order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: $V_x=2x/(1+x^2+2y^2)$, so $V_{xy}=-8xy/(1+x^2+2y^2)^2=-1/2$.


    Why it works: The y derivative acts on the variable denominator; the anisotropic coefficient 2 contributes
    an inner factor 4.


    Why the other choices fail:


    Choice b: The reciprocal denominator derivative is negative.

    Choice c: The full denominator is squared; at the point it is 16.

    Choice d: Both coordinates are nonzero, so the mixed numerator does not vanish.'
- id: q009
  type: multipleChoice
  prompt: For $P(x,y)=x^3\sin(xy)$, find $P_{yx}(1,1).
  choices:
  - id: a
    text: $4\cos1-\sin1$
    issueSignals:
    - id: mixed-partial-order
  - id: b
    text: $4\cos1+\sin1$
    issueSignals:
    - id: mixed-partial-order
  - id: c
    text: $3\cos1-\sin1$
    issueSignals:
    - id: mixed-partial-order
  - id: d
    text: $x^4\cos(xy)$
  answer:
    choiceId: d
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Ordered mixed product derivative requires the student to track the requested variable or
    derivative order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: $P_y=x^4\cos(xy)$ and $P_{yx}=4x^3\cos(xy)-x^4y\sin(xy)$, giving $4\cos1-\sin1$.


    Why it works: The first y derivative creates $x^4$; the x derivative then acts on the power and the composite
    cosine.


    Why the other choices fail:


    Choice a: This option does not match the stated derivative operation or point evaluation.

    Choice b: The chain derivative of cosine contributes a negative sine term.

    Choice c: The derivative of $x^4$ is $4x^3$.'
- id: q010
  type: multipleChoice
  prompt: For $S(x,y)=\sin(x^2y)$, compute $S_{xy}(1,1).
  choices:
  - id: a
    text: $2\cos1-2\sin1$
    issueSignals:
    - id: chain-rule-missed
  - id: b
    text: $2\cos1+2\sin1$
    issueSignals:
    - id: chain-rule-missed
  - id: c
    text: $2\cos1$
  - id: d
    text: $\cos1-2\sin1$
    issueSignals:
    - id: chain-rule-missed
  answer:
    choiceId: c
  issueSignals:
  - id: chain-rule-missed
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Nested chain rule requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: $S_x=2xy\cos(x^2y)$ and $S_{xy}=2x\cos(x^2y)-2x^3y\sin(x^2y)$, giving $2\cos1-2\sin1$.


    Why it works: At y=1 both the explicit-factor derivative and the inner chain derivative contribute.


    Why the other choices fail:


    Choice a: This option does not match the stated derivative operation or point evaluation.

    Choice b: The chain derivative of cosine is negative.

    Choice d: This drops the factor 2 from differentiating $x^2$.'
- id: q011
  type: multipleChoice
  prompt: If mixed second partials exist but are not known to be continuous on a neighborhood, what can be concluded
    about exchanging their order?
  choices:
  - id: a
    text: The mixed partials are automatically equal.
    issueSignals:
    - id: mixed-partial-order
  - id: b
    text: No equality conclusion follows without a direct calculation or another applicable theorem.
  - id: c
    text: The mixed partials must be unequal.
    issueSignals:
    - id: mixed-partial-order
  - id: d
    text: Both mixed partials must be zero.
    issueSignals:
    - id: mixed-partial-order
  answer:
    choiceId: b
  issueSignals:
  - id: mixed-partial-order
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Counterexample to unconditional equality requires the student to track the requested variable
    or derivative order and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-partial-rates
  extensionObjectiveIds:
  - calc3-partial-rates
  explanation: 'Solution: No equality conclusion follows without a direct calculation or another applicable theorem.


    Why it works: The continuity hypothesis is sufficient for Clairaut’s theorem; without it, equality is not
    guaranteed, but inequality is not guaranteed either.


    Why the other choices fail:


    Choice a: This asserts Clairaut’s conclusion without its stated hypothesis.

    Choice c: A missing sufficient condition does not prove the conclusion false.

    Choice d: Continuity information does not determine the numerical value.'
- id: q012
  type: multipleChoice
  prompt: Let $B(x,y)=xy^2+\cos x$ and follow $x=2-t$, $y=1+2t$. What is $dB/dt$ at $t=0?
  choices:
  - id: a
    text: $7+\sin2$
  - id: b
    text: $1-\sin2$
    issueSignals:
    - id: held-variable-confusion
  - id: c
    text: '8'
    issueSignals:
    - id: held-variable-confusion
  - id: d
    text: $7-\sin2$
    issueSignals:
    - id: held-variable-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: held-variable-confusion
  difficultyDimensions:
  - representationTransfer
  - modelOrDerivation
  - methodSelection
  subjectDifficultyTags:
  - partialDerivative
  difficultyEvidence: Path chain rule requires the student to track the requested variable or derivative order
    and verify the resulting value.
  prerequisiteObjectiveIds:
  - calc3-readiness
  extensionObjectiveIds:
  - calc3-higher-partials
  explanation: 'Solution: $B_x=1-\sin2$ and $B_y=4$ at $(2,1)$, while $x''= -1$ and $y''=2$. Thus $dB/dt=-(1-\sin2)+8=7+\sin2$.


    Why it works: The chain rule weights both partial rates by their coordinate velocities, including the negative
    x velocity.


    Why the other choices fail:


    Choice b: This is only the x partial and omits both path weighting and the y contribution.

    Choice c: This omits the cosine contribution weighted by the negative x velocity.

    Choice d: The x velocity is -1, so the cosine contribution adds $\sin2$.'
