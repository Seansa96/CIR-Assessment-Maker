lesson:
  introduction: |
    Not every convergent series converges for the same reason. Absolute convergence means the magnitudes alone are summable. Conditional convergence means signs and cancellation are essential.

    This distinction matters because absolute convergence is stronger and more stable under rearrangement.
  sections:
    - id: absolute-first
      title: Absolute convergence is the stronger test
      required: true
      content: |
        Given a series $\sum a_n$, form the absolute value series:

        $$
        \sum |a_n|.
        $$

        If $\sum |a_n|$ converges, then $\sum a_n$ converges absolutely.

        Absolute convergence is stronger because it says the series still converges even after all cancellation is removed.
      check:
        id: absolute-first-check
        type: multipleChoice
        prompt: What does it mean for $\sum a_n$ to converge absolutely?
        choices:
          - id: a
            text: '$\sum |a_n|$ converges.'
          - id: b
            text: '$\sum |a_n|$ diverges but $\sum a_n$ converges.'
          - id: c
            text: '$a_n$ is always positive.'
          - id: d
            text: '$a_n$ is always zero.'
        answer:
          choiceId: a
        explanation: |
          Absolute convergence is defined by convergence of $\sum |a_n|$.

          Related topic: absolute convergence definition.
    - id: conditional-meaning
      title: Conditional convergence depends on cancellation
      required: true
      content: |
        A series is conditionally convergent when:

        $$
        \sum a_n
        $$

        converges, but

        $$
        \sum |a_n|
        $$

        diverges.

        This usually happens with alternating series whose magnitudes shrink slowly.
      check:
        id: conditional-meaning-check
        type: multipleChoice
        prompt: Which statement describes conditional convergence?
        choices:
          - id: a
            text: The original series converges, but the absolute value series diverges.
          - id: b
            text: Both the original and absolute value series diverge.
          - id: c
            text: The absolute value series converges.
          - id: d
            text: The series has only positive terms.
        answer:
          choiceId: a
        explanation: |
          Conditional convergence means convergence depends on sign cancellation. Without the signs, the series diverges.

          Related topic: conditional convergence definition.
    - id: harmonic-comparison
      title: The harmonic pair shows the difference
      required: true
      content: |
        ![The harmonic partial sums diverge while alternating harmonic partial sums settle](/assessments/calc2-infinite-series/absolute-conditional-comparison.svg)

        The harmonic series diverges:

        $$
        \sum_{n=1}^{\infty}\frac{1}{n}.
        $$

        The alternating harmonic series converges:

        $$
        \sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n}.
        $$

        Since the absolute value version of the alternating harmonic series is the harmonic series, the alternating harmonic series is conditionally convergent.
      check:
        id: harmonic-comparison-check
        type: selectAll
        prompt: Which statements are true about the alternating harmonic series?
        choices:
          - id: a
            text: It converges by the Alternating Series Test.
          - id: b
            text: Its absolute value series is the divergent harmonic series.
          - id: c
            text: It converges conditionally.
          - id: d
            text: It converges absolutely.
        answer:
          choiceIds: [a, b, c]
        explanation: |
          The alternating harmonic series converges, but its absolute value series diverges. Therefore it is conditionally convergent, not absolutely convergent.

          Related topic: alternating harmonic series.
    - id: classification-workflow
      title: Classification workflow
      required: true
      content: |
        To classify a sign-changing series:

        1. Test $\sum |a_n|$.
        2. If $\sum |a_n|$ converges, stop: the original series converges absolutely.
        3. If $\sum |a_n|$ diverges, test the original sign-changing series.
        4. If the original converges, it is conditionally convergent.
        5. If the original diverges, it is divergent.

        Do not call a series conditional just because it alternates. You must show the original converges and the absolute value version diverges.
      check:
        id: classification-workflow-check
        type: multipleChoice
        prompt: You find that $\sum |a_n|$ converges. What can you immediately conclude?
        choices:
          - id: a
            text: $\sum a_n$ converges absolutely.
          - id: b
            text: $\sum a_n$ diverges.
          - id: c
            text: $\sum a_n$ converges conditionally.
          - id: d
            text: No conclusion is possible.
        answer:
          choiceId: a
        explanation: |
          Absolute convergence of $\sum |a_n|$ guarantees convergence of $\sum a_n$.

          Related topic: absolute convergence implies convergence.
    - id: why-it-matters
      title: Why the distinction matters
      required: true
      content: |
        Absolute convergence is robust. Conditional convergence is more delicate because it depends on cancellation.

        In later mathematics, conditionally convergent series can behave unexpectedly if terms are rearranged. For Calculus 2, the practical point is simpler:

        - absolute convergence is the strongest conclusion,
        - conditional convergence needs two pieces of evidence,
        - divergence must still be checked when absolute convergence fails.
      check:
        id: why-it-matters-check
        type: multipleChoice
        prompt: Why is absolute convergence considered stronger than conditional convergence?
        choices:
          - id: a
            text: It converges even after sign cancellation is removed.
          - id: b
            text: It only applies to finite sums.
          - id: c
            text: It means every term is equal to zero.
          - id: d
            text: It means the series must be geometric.
        answer:
          choiceId: a
        explanation: |
          Absolute convergence means the magnitude series $\sum |a_n|$ converges, so convergence does not rely on alternating cancellation.

          Related topic: strength of absolute convergence.
