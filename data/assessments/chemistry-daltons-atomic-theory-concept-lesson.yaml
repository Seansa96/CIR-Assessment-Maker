lesson:
  introduction: 'In 1808, John Dalton published his Atomic Theory — the first comprehensive,
    quantitative model of matter. Though some postulates have been refined since,
    it remains one of the most important frameworks in all of science. Understanding
    it means understanding *why* chemical laws work, not just that they do.

    '
  sections:
  - id: daltons-postulates
    title: 'Dalton''s Atomic Theory: The Five Postulates'
    required: true
    content: 'Dalton proposed five core ideas:


      1. **All matter is made of atoms.** Atoms are indivisible and indestructible
      (we now know this is not strictly true — nuclear reactions can split atoms —
      but it\rholds for chemistry).

      2. **All atoms of a given element are identical** in mass and properties.

      3. **Atoms of different elements differ** in mass and properties.

      4. **Compounds form when atoms of different elements combine in fixed, small
      whole-number ratios.**

      5. **In a chemical reaction, atoms are rearranged** — not created or destroyed.


      Postulates 1 and 5 explain the Law of Conservation of Mass.

      Postulates 2–4 explain the Law of Definite Proportions and the Law of Multiple
      Proportions.


      **Modern revision:** We now know that atoms of the same element can have different
      masses (isotopes), and atoms can be subdivided in nuclear reactions. But Dalton''s
      theory is still an excellent model for all of chemistry.

      '
    check:
      id: postulates-check
      type: multipleChoice
      prompt: 'Which of Dalton''s postulates directly explains why water always contains
        hydrogen and oxygen in a fixed 1:8 mass ratio?

        '
      choices:
      - id: a
        text: Compounds form when atoms combine in fixed whole-number ratios.
      - id: b
        text: Atoms are indivisible.
      - id: c
        text: Atoms of different elements differ in mass.
      - id: d
        text: In a reaction, atoms are rearranged, not destroyed.
      answer:

        choiceId: a
      explanation: 'Because water is always H2O — two hydrogen atoms and one oxygen
        atom in a fixed ratio — and because atoms have definite masses, the mass ratio
        is always fixed. This is postulate 4 in action.

        '
  - id: atomic-symbols
    title: Atomic Symbols and Nuclear Notation
    required: true
    content: 'Each element has a one- or two-letter **atomic symbol** (e.g., C for
      carbon, Na for sodium, Fe for iron).


      The **nuclear (nuclide) notation** encodes the key numbers for any atom:


      $$

      {}^{A}_{Z}\text{X}

      $$


      Where:

      - **X** = element symbol

      - **Z** = **atomic number** = number of protons (defines the element)

      - **A** = **mass number** = protons + neutrons


      So the number of neutrons = A − Z.


      **Example:** ${}^{12}_{6}\text{C}$ is carbon-12: 6 protons, 6 neutrons, 6 electrons
      (if neutral).


      **Subatomic particles:**


      | Particle | Charge | Mass (amu) | Location |

      |---|---|---|---|

      | Proton | +1 | 1.0073 | Nucleus |

      | Neutron | 0 | 1.0087 | Nucleus |

      | Electron | −1 | 0.000549 | Electron cloud |

      '
    check:
      id: atomic-symbols-check
      type: multipleChoice
      prompt: 'An atom has the symbol ${}^{40}_{20}\text{Ca}$. How many neutrons does
        this atom have?

        '
      choices:
      - id: a
        text: '20'
      - id: b
        text: '40'
      - id: c
        text: '60'
      - id: d
        text: '18'
      answer:

        choiceId: a
      explanation: 'Neutrons = A - Z = 40 - 20 = 20. The atomic number (Z = 20) tells
        us the element is calcium; the mass number (A = 40) tells us the total of
        protons plus neutrons.

        '
  - id: isotopes
    title: Isotopes
    required: true
    content: '**Isotopes** are atoms of the same element (same Z) that have **different
      numbers of neutrons** (different A).


      All isotopes of carbon have 6 protons, but:

      - ${}^{12}_{6}\text{C}$ — carbon-12: 6 neutrons (most abundant, 98.9%)

      - ${}^{13}_{6}\text{C}$ — carbon-13: 7 neutrons (1.1%)

      - ${}^{14}_{6}\text{C}$ — carbon-14: 8 neutrons (trace; radioactive)


      **Isotopes of the same element are chemically identical** — they react the same
      way. They differ only in mass, which affects physical properties like density.


      The **atomic mass** listed on the periodic table is a **weighted average** of
      all naturally occurring isotopes.


      $$

      \b\bar{m} = \sum (\text{fraction}_i \times m_i)

      $$


      **Example:** Chlorine is 75.77% Cl-35 and 24.23% Cl-37.

      $$

      \b\bar{m}_{\text{Cl}} = (0.7577 \times 35) + (0.2423 \times 37) = 35.45 \text{
      amu}

      $$

      '
    check:
      id: isotopes-check
      type: multipleChoice
      prompt: 'Boron has two stable isotopes: B-10 (19.9% abundant, mass = 10.013
        amu) and B-11 (80.1% abundant, mass = 11.009 amu). What is the a\approximate
        atomic mass of boron?

        '
      choices:
      - id: a
        text: 10.81 amu
      - id: b
        text: 10.50 amu
      - id: c
        text: 11.00 amu
      - id: d
        text: 10.00 amu
      answer:

        choiceId: a
      explanation: 'Atomic mass = (0.199 × 10.013) + (0.801 × 11.009) = 1.993 + 8.818
        = 10.81 amu. The weighted average is closer to 11 because B-11 is far more
        abundant.

        '
  - id: ions
    title: Ions — Cations and Anions
    required: true
    content: "A neutral atom has equal numbers of protons and electrons. When an atom\
      \ **gains or loses electrons**, it becomes an **ion** — a charged particle.\n\
      \n- **Cation** (positive ion): formed when an atom **loses** electrons.\n  -\
      \ Example: Na loses 1 electron → Na⁺ (sodium ion)\n  - Metals tend to form cations.\n\
      \n- **Anion** (negative ion): formed when an atom **gains** electrons.\n  -\
      \ Example: Cl gains 1 electron → Cl⁻ (chloride ion)\n  - Nonmetals tend to form\
      \ anions.\n\nThe number of **protons never changes** when forming an ion — that\
      \ would change the element. Only electrons are transferred.\n\n**Common ion\
      \ charges to memorize:**\n\n| Group | Charge | Examples |\n|---|---|---|\n|\
      \ 1A (Alkali metals) | 1+ | Na+, K+, Li+ |\n| 2A (Alkaline earth) | 2+ | Ca2+,\
      \ Mg2+, Ba2+ |\n| Halogens (7A) | 1− | F−, Cl−, Br−, I− |\n| Oxygen group (6A)\
      \ | 2− | O2−, S2− |\n| Nitrogen group (5A) | 3− | N3−, P3− |\n"
    check:
      id: ions-check
      type: multipleChoice
      prompt: 'An atom of sulfur (S, atomic number 16) gains two electrons. What is
        the resulting ion?

        '
      choices:
      - id: a
        text: S2− with 16 protons and 18 electrons
      - id: b
        text: S2+ with 16 protons and 14 electrons
      - id: c
        text: S2− with 14 protons and 16 electrons
      - id: d
        text: S with 16 protons and 16 electrons
      answer:

        choiceId: a
      explanation: 'Gaining electrons creates an anion. Sulfur gains 2 electrons:
        16 + 2 = 18 electrons total. The number of protons (16) does not change. The
        charge is 2−, giving the sulfide ion S2−.

        '
