    title: File-like interfaces
    required: true
    content: 'Devices, pipes, and many resources expose file-like operations, but they are not all ordinary disk files.


      Decision habit: ask what boundary, resource, or policy is being controlled. For UNIX, Linux, and Android, the safe answer usually names both the mechanism and its tradeoff.'
