lesson:
  introduction: This deeper lesson expands UNIX, Linux, and Android from Chapter 10 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: unix-philosophy
    title: UNIX organizing ideas
    required: true
    content: 'UNIX-style systems emphasize files, processes, permissions, pipes, and composable tools.


      Decision habit: ask what boundary, resource, or policy is being controlled. For UNIX, Linux, and Android, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: unix-philosophy-deep-check
      title: 'Check: UNIX organizing ideas'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **UNIX organizing ideas**?
      choices:
      - id: a
        text: The design style matters more than command memorization.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'The design style matters more than command memorization. Related topic: UNIX, Linux, and Android.'
  - id: fork-exec
    title: Fork and exec
    required: true
    content: 'UNIX process creation separates duplicating a process context from replacing the program image.


      Decision habit: ask what boundary, resource, or policy is being controlled. For UNIX, Linux, and Android, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: fork-exec-deep-check
      title: 'Check: Fork and exec'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Fork and exec**?
      choices:
