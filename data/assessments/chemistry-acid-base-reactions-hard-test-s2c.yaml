questions:
- id: q-1
  type: multipleChoice
  prompt: Which net ionic equation represents strong acid–strong hydroxide neutralization? Include the stated aqueous condition
    and classify the model before choosing.
  choices:
  - id: a
    text: H+ + OH− → H2O
    issueSignals: []
  - id: b
    text: H+ + Cl− → HCl
    issueSignals:
    - id: chemical-equation-balancing-error
      domains:
      - chemistry
  - id: c
    text: Na+ + OH− → NaOH
    issueSignals:
    - id: chemical-equation-balancing-error
      domains:
      - chemistry
  - id: d
    text: H2O → H+ + OH−
    issueSignals:
    - id: chemical-equation-balancing-error
      domains:
      - chemistry
  answer:
    choiceId: a
  explanation: 'Solution: Choice A (H+ + OH− → H2O).


    Why it works: Apply the acid-base definition, equilibrium relation, logarithmic conversion, or stoichiometric ratio named
    by the prompt, then check units and assumptions.


    Why the other choices fail: Choice B (H+ + Cl− → HCl) makes a model or sign error; choice C (Na+ + OH− → NaOH) uses the
    wrong condition or operation; choice D (H2O → H+ + OH−) does not follow from the supplied species, values, or titration
    region.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  - representationTransfer
  difficultyEvidence: 'Neutralization pattern: apply the governing acid-base relation and check the result against the stated
    condition.'
  prerequisiteObjectiveIds:
  - acid-base-models
  extensionObjectiveIds:
  - acid-base-transfer
