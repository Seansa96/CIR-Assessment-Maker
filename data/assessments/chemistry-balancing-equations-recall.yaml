schemaVersion: 1
id: chemistry-balancing-equations-recall
title: Balancing Chemical Equations Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
- chemistry-stoichiometry
skills:
- Apply Stoichiometry
- chemistry-stoichiometry
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - chemistry
  - chemistry-stoichiometry
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What arrow symbol separates reactants from products in a chemical equation?
  answer:
    expected: arrow
    aliases:
    - →
    - rightward arrow
- id: r002
  type: typed
  prompt: What does the state symbol (aq) after a formula mean?
  answer:
    expected: aqueous (dissolved in water)
    aliases:
    - dissolved in water
    - aqueous
- id: r003
  type: typed
  prompt: 'When balancing a chemical equation, which of the following can you change:
    subscripts or coefficients?

    '
  answer:
    expected: coefficients
    aliases:
    - only coefficients
    - the coefficients
- id: r004
  type: typed
  prompt: 'In the balanced equation CH4 + 2O2 → CO2 + 2H2O, what is the coefficient
    of O2?

    '
  answer:
    expected: '2'
- id: r005
  type: flashcard
  prompt: State the rule that must be true for a chemical equation to be considered
    balanced.
  answer:
    expected: 'The number of atoms of each element must be the same on both the reactant
      side and the product side of the equation. Mass is conserved.

      '
- id: r006
  type: typed
  prompt: 'In balancing by inspection, which elements are typically balanced last?

    '
  answer:
    expected: hydrogen and oxygen
    aliases:
    - H and O
    - oxygen and hydrogen
- id: r007
  type: typed
  prompt: 'True or false: You can change subscripts in a formula to balance a chemical
    equation.

    '
  answer:
    expected: false
    aliases:
    - 'no'
    - false
- id: r008
  type: typed
  prompt: 'What symbol above the reaction arrow indicates that heat is required for
    the reaction?

    '
  answer:
    expected: delta (Δ)
    aliases:
    - Δ
    - the delta symbol
    - triangle
- id: r009
  type: typed
  prompt: 'In the equation N2 + 3H2 → 2NH3,\rhow many moles of NH3 are produced for
    every mole of N2?

    '
  answer:
    expected: '2'
    aliases:
    - 2 moles
- id: r010
  type: flashcard
  prompt: What is the strategy for balancing the combustion of a hydrocarbon (CxHy
    + O2 → CO2 + H2O)?
  answer:
    expected: '1. Balance carbon first (using the CO2 coefficient). 2. Balance hydrogen
      (using the H2O coefficient). 3. Balance oxygen last (adjust the O2 coefficient).
      4. If the O2 coefficient is fractional, multiply all coefficients by 2.

      '
