workedExamples:
- id: we001
  title: A recursive sequence with a fixed point
  problem: |
    Let $a_1=1$ and $a_{n+1}=\sqrt{2+a_n}$. Show why the sequence converges and identify its limit.
  steps:
  - id: mono-seq-s001
    title: Find the candidate limit
    instruction: |
      If the sequence converges to $L$, then $L=\sqrt{2+L}$.
    type: multipleChoice
    prompt: 'Which positive candidate limit appears?

      '
    choices:
    - id: a
      text: $1$
    - id: b
      text: $2$
    - id: c
      text: $-1$
    - id: d
      text: $0$
    answer:
      choiceId: b
    explanation: 'Solution: $L^2-L-2=0$, so $L=2$ or $L=-1$. The positive candidate is $2$. Therefore the answer is $2$.


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.


      Why the other choices fail: $1$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $-1$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $0$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.'
  - id: mono-seq-s002
    title: Bound the sequence
    instruction: |
      Assume $a_n<2$. Then $a_{n+1}=\sqrt{2+a_n}<\sqrt4=2$.
    type: multipleChoice
    prompt: 'What method keeps the bound true for all terms?

      '
    choices:
    - id: a
      text: Induction
    - id: b
      text: Partial fractions
    - id: c
      text: Rolle's Theorem
    - id: d
      text: Completing the square
    answer:
      choiceId: a
    explanation: |-
      Solution: The recurrence passes the bound from one term to the next, so induction is natural. Therefore the answer is Induction.

      Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

      Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

      Why the other choices fail: Partial fractions conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; Rolle's Theorem conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; Completing the square conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
  - id: mono-seq-s003
    title: Show monotonicity
    instruction: 'Compare $a_{n+1}$ and $a_n$ while terms are nonnegative.

      '
    type: freeResponse
    prompt: |
      Explain why $a_{n+1}>a_n$ when $1\le a_n<2$.
    answer:
      expected: |
        Because both sides are nonnegative, $a_{n+1}>a_n$ is equivalent to $2+a_n>a_n^2$, or $(2-a_n)(a_n+1)>0$, which holds for $1\le a_n<2$.
      gradingMode: selfCheck
      keyPoints:
      - Uses safe squaring
      - Transforms to a positive product
      - Uses the bound $a_n<2$
    explanation: |-
      Solution: Related topic: monotone convergence for sequences. Therefore the answer is Because both sides are nonnegative, $a_{n+1}>a_n$ is equivalent to $2+a_n>a_n^2$, or $(2-a_n)(a_n+1)>0$, which holds for $1\le a_n<2$.
      . Therefore the answer is Because both sides are nonnegative, $a_{n+1}>a_n$ is equivalent to $2+a_n>a_n^2$, or $(2-a_n)(a_n+1)>0$, which holds for $1\le a_n<2$.
      .

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.
  - id: mono-seq-s004
    title: Conclude
    instruction: 'Increasing and bounded above implies convergence.

      '
    type: numericResponse
    prompt: 'What is the limit?

      '
    answer:
      value: 2
      tolerance: 0.000001
    explanation: 'Solution: The sequence converges, and the compatible fixed point is $2$.


      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.


      Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.'
