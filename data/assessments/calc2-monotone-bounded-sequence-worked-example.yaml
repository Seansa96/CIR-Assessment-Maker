workedExamples:
- id: we001
  title: A recursive sequence with a fixed point
  problem: |
    Let $a_1=1$ and $a_{n+1}=\sqrt{2+a_n}$. Show why the sequence converges and identify its limit.
  steps:
  - id: mono-seq-s001
    title: Find the candidate limit
    instruction: |
      If the sequence converges to $L$, then $L=\sqrt{2+L}$.
    type: multipleChoice
    prompt: |
      Which positive candidate limit appears?
    choices:
    - id: a
      text: $1$
    - id: b
      text: $2$
    - id: c
      text: $-1$
    - id: d
      text: $0$
    answer:
      choiceId: b
    explanation: |
      $L^2-L-2=0$, so $L=2$ or $L=-1$. The positive candidate is $2$.
  - id: mono-seq-s002
    title: Bound the sequence
    instruction: |
      Assume $a_n<2$. Then $a_{n+1}=\sqrt{2+a_n}<\sqrt4=2$.
    type: multipleChoice
    prompt: |
      What method keeps the bound true for all terms?
    choices:
    - id: a
      text: Induction
    - id: b
      text: Partial fractions
    - id: c
      text: Rolle's Theorem
    - id: d
      text: Completing the square
    answer:
      choiceId: a
    explanation: |
      The recurrence passes the bound from one term to the next, so induction is natural.
  - id: mono-seq-s003
    title: Show monotonicity
    instruction: |
      Compare $a_{n+1}$ and $a_n$ while terms are nonnegative.
    type: freeResponse
    prompt: |
      Explain why $a_{n+1}>a_n$ when $1\le a_n<2$.
    answer:
      expected: |
        Because both sides are nonnegative, $a_{n+1}>a_n$ is equivalent to $2+a_n>a_n^2$, or $(2-a_n)(a_n+1)>0$, which holds for $1\le a_n<2$.
      gradingMode: selfCheck
      keyPoints:
      - Uses safe squaring
      - Transforms to a positive product
      - Uses the bound $a_n<2$
    explanation: |
      Related topic: monotone convergence for sequences.
  - id: mono-seq-s004
    title: Conclude
    instruction: |
      Increasing and bounded above implies convergence.
    type: numericResponse
    prompt: |
      What is the limit?
    answer:
      value: 2
      tolerance: 0.000001
    explanation: |
      The sequence converges, and the compatible fixed point is $2$.
