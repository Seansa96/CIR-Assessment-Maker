questions:
- id: q001
  type: multipleChoice
  skills: [physics-damped-oscillations]
  prompt: A mass-spring system is described as critically damped. Which observation best matches that model?
  choices: [{ id: a, text: It returns to equilibrium fastest without oscillating. }, { id: b, text: It oscillates forever with constant amplitude. }, { id: c, text: Its amplitude grows exponentially. }]
  answer: { choiceId: a }
  explanation: |
    Solution: It returns to equilibrium fastest without oscillating.

    Why it works: Critical damping is the boundary between underdamped oscillation and slower overdamped return.

    Why the other choices fail: Constant or growing amplitude contradicts energy loss from damping.
  difficultyDimensions: [modelOrDerivation, domainCondition, representationTransfer]
  difficultyEvidence: Classifies a physical observation using the damping-regime model.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q002
  type: numericResponse
  skills: [physics-damped-oscillations]
  prompt: A $1.0\text{ kg}$ oscillator with $k=25\text{ N/m}$ is critically damped. Find $b_c$ in kg/s.
  answer: { value: 10, tolerance: 0.03 }
  explanation: |
    Solution: $b_c=2\sqrt{mk}=2\sqrt{(1.0)(25)}=10\text{ kg/s}$.

    Why it works: Critical damping sets the discriminant of the damped-oscillator equation to zero.
  difficultyDimensions: [modelOrDerivation, simplification, domainCondition]
  difficultyEvidence: Translates a damping regime into its boundary formula and evaluates it.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q003
  type: multipleChoice
  skills: [physics-damped-oscillations]
  prompt: For fixed $m$ and $k$, which change makes an initially underdamped system reach the critical boundary?
  choices: [{ id: a, text: Increase b until $b=2sqrt(mk)$. }, { id: b, text: Decrease b to zero. }, { id: c, text: Increase amplitude only. }]
  answer: { choiceId: a }
  explanation: |
    Solution: Increase $b$ until $b=2sqrt(mk)$.

    Why it works: The critical coefficient is $2sqrt(mk)$ for a linear damped mass-spring system.

    Why the other choices fail: Zero damping is undamped, and amplitude does not set the damping regime in the linear model.
  difficultyDimensions: [modelOrDerivation, representationTransfer, errorDiagnosis]
  difficultyEvidence: Uses the critical boundary to diagnose irrelevant and incorrect control changes.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q004
  type: numericResponse
  skills: [physics-damped-oscillations]
  prompt: With $m=2.0\text{ kg}$, $k=50\text{ N/m}$, and $b=6.0\text{ kg/s}$, find the underdamped angular frequency in rad/s from $omega'=sqrt(k/m-(b/(2m))^2)$.
  answer: { value: 4.769696, tolerance: 0.02 }
  explanation: |
    Solution: $omega'=sqrt(50/2-(6/4)^2)=sqrt(25-2.25)=4.77\text{ rad/s}$.

    Why it works: Damping subtracts $(b/(2m))^2$ from the squared natural frequency.
  difficultyDimensions: [modelOrDerivation, simplification, domainCondition]
  difficultyEvidence: Evaluates a derived-frequency model and confirms the radicand is positive.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q005
  type: multipleChoice
  skills: [physics-damped-oscillations]
  prompt: A measured damped waveform has peaks that follow a decreasing exponential envelope. What is the direct physical interpretation?
  choices: [{ id: a, text: Damping removes mechanical energy over time. }, { id: b, text: The spring constant must be zero. }, { id: c, text: The mass is accelerating upward forever. }]
  answer: { choiceId: a }
  explanation: |
    Solution: Damping removes mechanical energy over time.

    Why it works: A viscous damping force opposes velocity, producing an amplitude envelope that decreases with time.

    Why the other choices fail: A decaying envelope does not imply no restoring force or unbounded acceleration.
  difficultyDimensions: [representationTransfer, modelOrDerivation, errorDiagnosis]
  difficultyEvidence: Infers the physical energy change from a graph feature and rejects causal confusions.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q006
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: An industrial suspension system features a spring of 463.9 N/m supporting
    a load of 9.69 kg. What is the period of oscillation in seconds?
  answer:
    value: 0.9081
    tolerance: 0.05
  explanation: |
    Solution: $T=2pi sqrt(m/k)=2pi sqrt(9.69/463.9)=0.9081\text{ s}$.

    Why it works: The suspension is modeled as one effective mass and spring, so its period follows from inertia and stiffness.
  difficultyDimensions: [representationTransfer, modelOrDerivation, simplification]
  difficultyEvidence: Converts an applied suspension description into an effective mass-spring period calculation.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q007
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: An industrial suspension system features a spring of 295.4 N/m supporting
    a load of 8.36 kg. What is the period of oscillation in seconds?
  answer:
    value: 1.057
    tolerance: 0.05
  explanation: |
    Solution: $T=2pi sqrt(m/k)=2pi sqrt(8.36/295.4)=1.0570\text{ s}$.

    Why it works: The period relation uses the ratio of mass to spring stiffness, not the oscillation amplitude.
  difficultyDimensions: [modelOrDerivation, simplification, errorDiagnosis]
  difficultyEvidence: Selects the period relation and distinguishes relevant parameters from an omitted amplitude.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q008
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A mass of 7.31 kg is attached to a horizontal spring with constant 402.3
    N/m on a frictionless table. Calculate the angular frequency in rad/s.
  answer:
    value: 7.4185
    tolerance: 0.05
  explanation: |
    Solution: $omega=sqrt(k/m)=sqrt(402.3/7.31)=7.4185\text{ rad/s}$.

    Why it works: Squared angular frequency is stiffness divided by mass in the idealized oscillator model.
  difficultyDimensions: [modelOrDerivation, simplification, representationTransfer]
  difficultyEvidence: Uses the oscillator model to translate stiffness and mass into an angular frequency.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1338]
- id: q009
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A 3.71 kg sensor is oscillating on a delicate tether with effective stiffness
    44.3 N/m. Calculate the angular frequency in rad/s.
  answer:
    value: 3.4555
    tolerance: 0.05
  explanation: |
    Solution: $omega=sqrt(k/m)=sqrt(44.3/3.71)=3.4555\text{ rad/s}$.

    Why it works: The tether's effective stiffness supplies the restoring relation used in the spring-mass model.
  difficultyDimensions: [representationTransfer, modelOrDerivation, simplification]
  difficultyEvidence: Transfers the spring-mass frequency model to a tether described by effective stiffness.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
