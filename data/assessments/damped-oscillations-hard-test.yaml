  prompt: A vehicle's strut of 468.4 N/m supports a quarter of the car's mass, which
    is 1.41 kg. If the amplitude is 0.292 m, what is the maximum speed in m/s?
  answer:
    value: 5.3221
    tolerance: 0.05
  explanation: v_max = A*omega = 0.292 * sqrt(468.4/1.41) = 5.3221 m/s.
