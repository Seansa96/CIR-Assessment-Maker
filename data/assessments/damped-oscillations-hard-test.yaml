- id: q001
  type: numericResponse
  skills:
  - physics-damped-oscillations
  prompt: A 0.83 kg sensor is oscillating on a delicate tether with effective stiffness
    114.4 N/m. What is the period of oscillation in seconds?
  answer:
    value: 0.5352
    tolerance: 0.05
  explanation: T = 2*pi*sqrt(m/k) = 2*pi*sqrt(0.83/114.4) = 0.5352 s.
- id: q002
  type: numericResponse
  skills:
