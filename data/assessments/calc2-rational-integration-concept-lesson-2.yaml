lesson:
  introduction: |-
    In the previous lesson, we looked at distinct linear factors. But what happens if a factor is squared, or if the denominator contains a quadratic that cannot be factored? We need to adjust our setup!
  sections:
  - id: sec-repeated-linear
    title: Repeated Linear Factors
    required: true
    content: |-
      If a linear factor is repeated, like $(x-2)^2$, you cannot just write $\frac{A}{x-2} + \frac{B}{x-2}$. That would just combine into $\frac{A+B}{x-2}$, missing the squared term!
      
      Instead, you must include a fraction for **every power** of the factor up to the one given.
      
      Example: $\frac{5x}{(x-2)^3}$
      Setup: $\frac{A}{x-2} + \frac{B}{(x-2)^2} + \frac{C}{(x-2)^3}$
      
      The numerators remain constants ($A, B, C$) because the base factor $(x-2)$ is linear.

  - id: sec-irreducible-quadratic
    title: Irreducible Quadratic Factors
    required: true
    content: |-
      An "irreducible quadratic" is a quadratic factor like $x^2 + 4$ that cannot be factored into real numbers. 
      
      Because the denominator has degree 2, the numerator we place above it must be a general polynomial of degree 1 (a linear term).
      
      Instead of just a constant $A$, we use $Ax + B$.
      
      Example: $\frac{3x+1}{(x-1)(x^2+4)}$
      Setup: $\frac{A}{x-1} + \frac{Bx + C}{x^2+4}$
      
      Integrating the resulting $\frac{Bx+C}{x^2+4}$ term usually requires splitting it into two parts: a U-substitution part ($\frac{Bx}{x^2+4}$) and an arctangent part ($\frac{C}{x^2+4}$).

questions:
- id: q-calc2-rat2-1
  title: Concept Check - Repeated Setup
  prompt: |-
    What is the correct partial fraction setup for $\frac{x^2 + 1}{x(x+1)^2}$?
  type: multipleChoice
  issueSignals:
  - id: partial-fraction-decomposition-error
  - id: algebraic-simplification-error
  - id: expression-equation-recognition-error
  - id: fraction-arithmetic-error
  - id: logarithm-property-misapplied
  - id: exponent-rule-misapplied
  choices:
  - id: c1
    text: $\frac{A}{x} + \frac{B}{x+1}$
  - id: c2
    text: $\frac{A}{x} + \frac{B}{(x+1)^2}$
  - id: c3
    text: $\frac{A}{x} + \frac{B}{x+1} + \frac{C}{(x+1)^2}$
  answer:
    choiceId: c3
  explanation: |-
    The factor $x$ gets $\frac{A}{x}$. The repeated factor $(x+1)^2$ must be built up power by power: first $\frac{B}{x+1}$, then $\frac{C}{(x+1)^2}$.
  skills:
  - calc2-rational-integration

- id: q-calc2-rat2-2
  title: Concept Check - Quadratic Setup
  prompt: |-
    What is the correct partial fraction setup for $\frac{5}{(x^2+9)(x^2+1)^2}$?
  type: multipleChoice
  issueSignals:
  - id: partial-fraction-decomposition-error
  - id: algebraic-simplification-error
  - id: expression-equation-recognition-error
  - id: fraction-arithmetic-error
  - id: logarithm-property-misapplied
  - id: exponent-rule-misapplied
  choices:
  - id: c1
    text: $\frac{A}{x^2+9} + \frac{B}{x^2+1} + \frac{C}{(x^2+1)^2}$
  - id: c2
    text: $\frac{Ax+B}{x^2+9} + \frac{Cx+D}{x^2+1} + \frac{Ex+F}{(x^2+1)^2}$
  - id: c3
    text: $\frac{Ax+B}{x^2+9} + \frac{Cx+D}{(x^2+1)^2}$
  answer:
    choiceId: c2
  explanation: |-
    $x^2+9$ is an irreducible quadratic, so it gets a linear numerator: $\frac{Ax+B}{x^2+9}$.
    $(x^2+1)^2$ is a REPEATED irreducible quadratic. You must combine both rules: build up the powers, and give each one a linear numerator!
  skills:
  - calc2-rational-integration
