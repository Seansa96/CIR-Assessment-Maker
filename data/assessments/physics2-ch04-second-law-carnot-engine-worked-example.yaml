workedExamples:
- id: we1
  title: Efficiency and Work of a Carnot Engine
  prompt: A Carnot engine operates between a hot reservoir at $500\text{ K}$ and a
    cold reservoir at $300\text{ K}$. In one cycle, it absorbs $1000\text{ J}$ of
    heat from the hot reservoir. Calculate its efficiency and the work done per cycle.
  steps:
  - id: s1
    prompt: Calculate the Carnot efficiency.
    explanation: 'Solution:

      1) Use the definition of efficiency: $e = 1 - \frac{T_c}{T_h}$.

      2) Substitute: $e = 1 - \frac{300}{500} = 1 - 0.6 = 0.4$.

      The efficiency is $40\%$.


      Why it works:

      The Carnot efficiency is the theoretical maximum efficiency for any heat engine,
      depending only on the temperatures of the hot and cold reservoirs.'
  - id: s2
    prompt: Calculate the work done.
    explanation: 'Solution:

      1) Use the definition of efficiency: $e = \frac{W}{Q_h}$.

      2) Rearrange to solve for work: $W = e \cdot Q_h$.

      3) Substitute: $W = 0.4 \times 1000 = 400\text{ J}$.

      The engine does $400\text{ J}$ of work per cycle.


      Why it works:

      Efficiency tells us what fraction of the input heat energy is converted into
      useful work.'
