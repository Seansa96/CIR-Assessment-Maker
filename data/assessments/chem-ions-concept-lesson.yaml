lesson:
  introduction: Build a reliable model of ions by separating electron accounting, particle representation, and observable
    evidence.
  sections:
  - id: charge-accounting
    title: Relate charge to protons and electrons
    required: true
    content: Net charge equals positive proton charge plus negative electron charge. Changing electron count forms an ion;
      ordinary chemical ion formation does not change the nucleus.
    check:
      id: chk-charge-accounting
      type: multipleChoice
      prompt: Which statement correctly applies the idea of relate charge to protons and electrons?
      choices:
      - id: a
        text: Losing two electrons forms a 2+ ion.
        issueSignals: []
      - id: b
        text: Losing two electrons forms a 2- ion.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      - id: c
        text: Gaining two protons is the usual way to form an anion.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Losing two electrons forms a 2+ ion. Why it works: Net charge equals positive proton charge
        plus negative electron charge. Changing electron count forms an ion; ordinary chemical ion formation does not change
        the nucleus. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-ion-formation-map.svg
      alt: Instructional workflow for ions showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: cation-anion
    title: Distinguish cations and anions
    required: true
    content: Cations contain fewer electrons than protons and are positive. Anions contain more electrons than protons and
      are negative. The sign describes the imbalance, not whether the species is attracted to an electrode in a particular
      diagram.
    check:
      id: chk-cation-anion
      type: multipleChoice
      prompt: Which statement correctly applies the idea of distinguish cations and anions?
      choices:
      - id: a
        text: A species with 12 protons and 10 electrons is a 2+ cation.
        issueSignals: []
      - id: b
        text: A species with 12 protons and 10 electrons is a 2- anion.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      - id: c
        text: The species is neutral because both counts are even.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: A species with 12 protons and 10 electrons is a 2+ cation. Why it works: Cations contain fewer
        electrons than protons and are positive. Anions contain more electrons than protons and are negative. The sign describes
        the imbalance, not whether the species is attracted to an electrode in a particular diagram. Why the other choices
        fail: The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
  - id: main-group-charges
    title: Predict common main-group charges
    required: true
    content: Metals on the left commonly lose their few valence electrons, while nonmetals near the right commonly gain enough
      electrons to approach a noble-gas count. State these as common patterns rather than universal oxidation states.
    check:
      id: chk-main-group-charges
      type: multipleChoice
      prompt: Which statement correctly applies the idea of predict common main-group charges?
      choices:
      - id: a
        text: Magnesium commonly forms Mg2+ by losing two electrons.
        issueSignals: []
      - id: b
        text: Magnesium commonly forms Mg2- by gaining two electrons.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      - id: c
        text: Magnesium commonly forms Mg6+ to expose six core electrons.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Magnesium commonly forms Mg2+ by losing two electrons. Why it works: Metals on the left commonly
        lose their few valence electrons, while nonmetals near the right commonly gain enough electrons to approach a noble-gas
        count. State these as common patterns rather than universal oxidation states. Why the other choices fail: The other
        statements either reverse the relevant electron or charge accounting or apply a structural model outside its stated
        scope.'
  - id: electron-config
    title: Check the resulting electron count
    required: true
    content: A predicted monatomic ion should have an electron count consistent with the stated charge and, for many main-group
      ions, a nearby noble-gas configuration.
    check:
      id: chk-electron-config
      type: multipleChoice
      prompt: Which statement correctly applies the idea of check the resulting electron count?
      choices:
      - id: a
        text: Na+ and Ne are isoelectronic with ten electrons.
        issueSignals: []
      - id: b
        text: Na+ and Ar are isoelectronic with eighteen electrons.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      - id: c
        text: Na+ retains all eleven electrons because charge changes protons.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Na+ and Ne are isoelectronic with ten electrons. Why it works: A predicted monatomic ion should
        have an electron count consistent with the stated charge and, for many main-group ions, a nearby noble-gas configuration.
        Why the other choices fail: The other statements either reverse the relevant electron or charge accounting or apply
        a structural model outside its stated scope.'
  - id: polyatomic
    title: Treat a polyatomic ion as one charged unit
    required: true
    content: A polyatomic ion contains covalent bonds internally but carries a net charge as a whole. Preserve its atom grouping
      when counting units in a formula.
    check:
      id: chk-polyatomic
      type: multipleChoice
      prompt: Which statement correctly applies the idea of treat a polyatomic ion as one charged unit?
      choices:
      - id: a
        text: Nitrate is a three-oxygen polyatomic anion with an overall 1- charge.
        issueSignals: []
      - id: b
        text: Each atom in nitrate separately carries the full 1- ion charge.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      - id: c
        text: A polyatomic ion cannot appear inside an ionic compound.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: Nitrate is a three-oxygen polyatomic anion with an overall 1- charge. Why it works: A polyatomic
        ion contains covalent bonds internally but carries a net charge as a whole. Preserve its atom grouping when counting
        units in a formula. Why the other choices fail: The other statements either reverse the relevant electron or charge
        accounting or apply a structural model outside its stated scope.'
  - id: conserve-charge
    title: Conserve total charge
    required: true
    content: Any formula or electron-transfer description must have the required net charge. For a neutral compound, total
      positive and negative contributions cancel exactly.
    check:
      id: chk-conserve-charge
      type: multipleChoice
      prompt: Which statement correctly applies the idea of conserve total charge?
      choices:
      - id: a
        text: One Ca2+ requires two Cl- ions for a neutral combination.
        issueSignals: []
      - id: b
        text: One Ca2+ requires one Cl- because there are two element symbols.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      - id: c
        text: Two Ca2+ ions and one Cl- ion give a neutral combination.
        issueSignals:
        - id: chemistry-bonding-ion-charge-error
      answer:
        choiceId: a
      explanation: 'Solution: One Ca2+ requires two Cl- ions for a neutral combination. Why it works: Any formula or electron-transfer
        description must have the required net charge. For a neutral compound, total positive and negative contributions cancel
        exactly. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
