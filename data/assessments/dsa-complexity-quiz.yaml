questions:
- id: formal-inequality-definition
  type: multipleChoice
  difficultyDimensions:
  - Interpretation of formal definition
  - Distinguishing O vs Omega
  subjectDifficultyTags:
  - Asymptotic-Definitions
  prerequisiteObjectiveIds:
  - obj-dsa-complexity-02
  prompt: 'Suppose you have a cost function $f(n)$ for a given algorithm. An analyst determines that the
    following inequality is true:


    $f(n) \ge c \cdot g(n)$ for some $c > 0$ and all $n > n_0$


    Which of the following statements correctly identifies the asymptotic relationship between $f(n)$
    and $g(n)$ based on this inequality?

    '
  choiceOptions:
  - id: opt-big-o
    text: The function $f(n)$ is in $O(g(n))$, representing an upper bound on the growth rate.
    issueSignals:
    - id: confused-upper-lower-bound
      domains: []
  - id: opt-big-omega
    text: The function $f(n)$ is in $\Omega(g(n))$, representing a lower bound on the growth rate.
  - id: opt-big-theta
    text: The function $f(n)$ is in $\Theta(g(n))$, representing a tight bound on the growth rate.
    issueSignals:
    - id: confused-tight-bound
      domains: []
  - id: opt-invalid
    text: The inequality does not match any standard asymptotic notation because it requires $c < 0$.
    issueSignals:
    - id: misunderstood-constant-c
      domains: []
  answer:
    gradingMode: automatic
    correctChoiceId: opt-big-omega
  explanation: "Solution:\nThe correct statement is that $f(n)$ is in $\\Omega(g(n))$, representing a\
    \ lower bound.\n\nWhy it works:\nThe inequality $\\ge$ states that $f(n)$ will never grow *more slowly*\
    \ than $g(n)$ multiplied by a constant. This is the definition of a lower bound, which corresponds\
    \ to Big-Omega ($\\Omega$). \n\nWhy the other choices fail:\n- Big-O ($O$) uses the $\\le$ inequality,\
    \ establishing an upper bound.\n- Big-Theta ($\\Theta$) requires bounding from both above and below\
    \ by the same function.\n- The constant $c$ must be positive; time and space complexity are non-negative.\n"
