directedProject:
  summary: "This project will guide you through installing Visual Studio 2022, creating your first C++ console application, and running it successfully."
  estimatedTimeMinutes: 30
  resources:
    - label: "Visual Studio Downloads"
      url: "https://visualstudio.microsoft.com/downloads/"
      kind: external
      description: "Download the free Community edition."
  phases:
    - id: phase-1-install
      title: "Installation"
      steps:
        - id: step-1-download
          title: "Download and Run Installer"
          instruction: |
            1. Navigate to the **Visual Studio Downloads** page linked in the resources.
            2. Download the **Visual Studio 2022 Community** installer.
            3. Run the installer executable (`VisualStudioSetup.exe`).
            4. Wait for the Visual Studio Installer to update and prepare the workload selection screen.
          checklist:
            - id: chk-download
              text: "Downloaded VisualStudioSetup.exe"
            - id: chk-run
              text: "Ran the installer and reached workload screen"
          resources: []
        - id: step-2-workload
          title: "Select C++ Workload"
          instruction: |
            In the Visual Studio Installer workload selection screen:
            1. Locate the **Desktop & Mobile** section.
            2. Check the box for **Desktop development with C++**.
            3. (Optional) In the right-hand Installation details panel, ensure the latest Windows SDK is checked (it usually is by default).
            4. Click **Install** in the bottom right.
            5. Wait for the download and installation to complete (this may take a while depending on your internet connection).
            6. When finished, click **Launch**.
          notesPrompt: "Did you encounter any errors during installation? How long did it take?"
          checklist:
            - id: chk-workload
              text: "Selected Desktop development with C++"
            - id: chk-install
              text: "Installation completed successfully"
          resources: []

    - id: phase-2-project
      title: "Creating Your First Project"
      steps:
        - id: step-3-create
          title: "Create a Console App"
          instruction: |
            1. In the Visual Studio startup window, click **Create a new project**.
            2. In the search box at the top, type `Console App`.
            3. Look for the result that says **Console App** with the tags `C++`, `Windows`, and `Console`. Select it and click **Next**.
            4. Enter `HelloWorld` for the Project name.
            5. Choose a memorable location to save your project.
            6. Check "Place solution and project in the same directory" if you wish to keep things simple for now.
            7. Click **Create**.
          checklist:
            - id: chk-template
              text: "Found the C++ Console App template"
            - id: chk-named
              text: "Named the project HelloWorld"
            - id: chk-created
              text: "Successfully created the project"
          resources: []

        - id: step-4-explore
          title: "Explore the Code"
          instruction: |
            Visual Studio has automatically generated some code for you in a file called `HelloWorld.cpp`.
            
            ```cpp
            #include <iostream>

            int main()
            {
                std::cout << "Hello World!\n";
            }
            ```

            Take a moment to understand what this does:
            - `#include <iostream>` tells the compiler to include the standard input/output stream library, giving us access to `std::cout`.
            - `int main()` is the entry point of every C++ program.
            - `std::cout << "Hello World!\n";` prints the text to the console. The `\n` creates a new line.
          checklist:
            - id: chk-found-file
              text: "Located HelloWorld.cpp in the Solution Explorer"
            - id: chk-read-code
              text: "Read and understood the default code"
          resources: []

        - id: step-5-run
          title: "Run the Program"
          instruction: |
            Now it's time to compile and run your program!
            
            1. Go to the top menu bar and select **Debug > Start Without Debugging**. 
            2. Alternatively, press the shortcut `Ctrl + F5`.
            3. Visual Studio will build (compile) your project. You can see the progress in the **Output** window at the bottom.
            4. If the build is successful, a black terminal (console) window will pop up.
          notesPrompt: "What text did the terminal window display?"
          checklist:
            - id: chk-build
              text: "Project built without errors"
            - id: chk-run
              text: "Console window appeared and displayed the correct output"
          resources: []
