  - id: aops-proportions-trap
    title: Common misconception
    required: true
    content: A common error is using a converse, diagram appearance, or familiar formula without its hypothesis. Name the missing hypothesis and test it.
    check:
      id: aops-proportions-trap-check
      type: multipleChoice
