lesson:
  introduction: |-
    A proportion is an equality of ratios, not a license to cross-multiply any four numbers. Proportional reasoning begins by identifying what stays constant: a ratio, a product, a unit rate, or a scale factor. Once the invariant is correct, the algebra is usually short; when the invariant is wrong, flawless arithmetic still answers the wrong question.
  sections:
  - id: ratios-proportions-and-cross-products
    title: A proportion equates two meaningful ratios
    required: true
    content: |-
      A ratio compares quantities in a stated order. The ratio $a:b$ can be written $a/b$ when $b\ne0$. A proportion

      $$\frac ab=\frac cd$$

      asserts that two ratios are equal, with $b,d\ne0$. Multiplying both sides by the nonzero product $bd$ gives $ad=bc$. Thus cross multiplication is derived from denominator clearing; it does not decide whether the original situation is proportional.

      In a part-to-part ratio such as red:blue $=3:5$, the total contains $3+5=8$ parts. If there are 32 objects, red contributes $3/8$ of the total, not $3/5$.
    check:
      id: ratios-proportions-and-cross-products-check
      type: multipleChoice
      prompt: 'Red and blue beads are in the ratio $3:5$. If there are 48 beads altogether, how many are red?'
      choices:
      - id: a
        text: '18'
      - id: b
        text: '20'
      - id: c
        text: '28'
      - id: d
        text: '30'
      answer:
        choiceId: a
      explanation: Red beads make up $3/(3+5)=3/8$ of the total, and $(3/8)48=18$.
  - id: direct-variation-and-constant-ratio
    title: Direct variation keeps a ratio constant
    required: true
    content: |-
      If $y$ varies directly with $x$, then

      $$y=kx\qquad\text{or}\qquad\frac yx=k$$

      for a constant $k$ and relevant nonzero $x$. Doubling $x$ doubles $y$; multiplying $x$ by any factor multiplies $y$ by the same factor. The graph passes through the origin.

      A merely linear relationship $y=mx+b$ is not direct variation when $b\ne0$. For example, $y=x+1$ has a constant difference $y-x=1$, but the ratio $y/x$ changes. Test the invariant rather than the general appearance of a line.
    check:
      id: direct-variation-and-constant-ratio-check
      type: multipleChoice
      prompt: 'If $y$ varies directly with $x$ and $y=18$ when $x=6$, what is $y$ when $x=10$?'
      choices:
      - id: a
        text: '22'
      - id: b
        text: '28'
      - id: c
        text: '30'
      - id: d
        text: '108'
      answer:
        choiceId: c
      explanation: The constant ratio is $k=18/6=3$, so $y=3(10)=30$.
  - id: inverse-variation-and-constant-product
    title: Inverse variation keeps a product constant
    required: true
    content: |-
      If $y$ varies inversely with nonzero $x$, then

      $$y=\frac kx\qquad\text{or}\qquad xy=k.$$

      Multiplying $x$ by a positive factor divides $y$ by that factor. This describes fixed-work situations: if equally productive workers complete a fixed job, workers times days is constant. It also describes fixed-distance travel, where speed times time is the distance.

      “One increases while the other decreases” is not sufficient evidence; many nonproportional relationships behave that way. Verify that the product remains constant.
    check:
      id: inverse-variation-and-constant-product-check
      type: multipleChoice
      prompt: 'Six equally productive workers need 10 days for a fixed job. How many days would 15 workers need?'
      choices:
      - id: a
        text: '4 days'
      - id: b
        text: '6 days'
      - id: c
        text: '19 days'
      - id: d
        text: '25 days'
      answer:
        choiceId: a
      explanation: Fixed work gives $6(10)=15d$, so $d=4$.
  - id: unit-rates-and-conversion-factors
    title: Units reveal the correct orientation
    required: true
    content: |-
      A unit rate compares a quantity to one unit of another. Conversion factors are ratios equal to one, such as

      $$\frac{100\text{ cm}}{1\text{ m}}.$$

      Multiplying by a conversion factor changes the written unit, not the physical amount. Choose the orientation so unwanted units cancel:

      $$2.5\text{ m}\cdot\frac{100\text{ cm}}{1\text{ m}}=250\text{ cm}.$$

      Map and blueprint scales use the same idea. A map scale $1:50{,}000$ means one unit on the map corresponds to 50,000 of the same unit in reality; a final unit conversion may still be necessary.
    check:
      id: unit-rates-and-conversion-factors-check
      type: multipleChoice
      prompt: 'On a $1:50{,}000$ map, a distance is 3 cm. What actual distance does it represent?'
      choices:
      - id: a
        text: '150 meters'
      - id: b
        text: '1.5 kilometers'
      - id: c
        text: '15 kilometers'
      - id: d
        text: '150 kilometers'
      answer:
        choiceId: b
      explanation: Three centimeters scale to 150,000 cm, which is 1,500 m or 1.5 km.
  - id: percent-baselines-and-successive-change
    title: Every percentage has a reference amount
    required: true
    content: |-
      Percent change compares the change with the original amount:

      $$\text{percent change}=\frac{\text{new}-\text{old}}{\text{old}}\cdot100\%.$$

      An increase of $r\%$ multiplies by $1+r/100$; a decrease multiplies by $1-r/100$. Successive changes multiply their factors because the second percentage uses a new baseline.

      A 20% increase followed by a 20% decrease produces $1.2(0.8)=0.96$ of the original, not 100%. Likewise, a price of $P$ after a 25% discount is $0.75P$; recovering the original requires division by $0.75$.
    check:
      id: percent-baselines-and-successive-change-check
      type: multipleChoice
      prompt: 'After a 25% discount, a jacket costs $54. What was its original price?'
      choices:
      - id: a
        text: '$67.50'
      - id: b
        text: '$72'
      - id: c
        text: '$79'
      - id: d
        text: '$81'
      answer:
        choiceId: b
      explanation: The sale price is 75% of the original, so $0.75P=54$ and $P=72$.
  - id: scale-factors-length-area-and-volume
    title: Different measurements scale by different powers
    required: true
    content: |-
      Similar figures preserve shape and multiply every corresponding length by one linear scale factor $s$. Perimeters therefore scale by $s$, areas by $s^2$, and volumes by $s^3$.

      If two similar rectangles have side ratio $2:5$, their area ratio is $2^2:5^2=4:25$. Applying the linear ratio directly to area is a common mistake because area is built from two length dimensions.

      Always identify what the problem asks to scale: a side, a boundary length, an area, or a volume.
    check:
      id: scale-factors-length-area-and-volume-check
      type: multipleChoice
      prompt: 'Two similar solids have linear scale factor 3 from small to large. What is the volume scale factor?'
      choices:
      - id: a
        text: '3'
      - id: b
        text: '6'
      - id: c
        text: '9'
      - id: d
        text: '27'
      answer:
        choiceId: d
      explanation: Volume uses three length dimensions, so it scales by $3^3=27$.
  - id: ratio-synthesis-and-shared-parts
    title: Synthesis—merge ratios through a shared quantity
    required: true
    content: |-
      Suppose $p:q=2:3$ and $q:r=4:5$. The two ratios cannot be joined as $2:3:5$ because their copies of $q$ represent different part counts.

      Match the shared quantity using a common multiple. Scale $2:3$ by 4 to get $p:q=8:12$. Scale $4:5$ by 3 to get $q:r=12:15$. Therefore

      $$p:q:r=8:12:15.$$

      Verification recovers both original ratios: $8/12=2/3$ and $12/15=4/5$. Shared-variable matching is the ratio analogue of using a common denominator.
    check:
      id: ratio-synthesis-and-shared-parts-check
      type: multipleChoice
      prompt: 'If $a:b=3:4$ and $b:c=6:7$, what is $a:b:c$ in whole-number form?'
      choices:
      - id: a
        text: '$3:4:7$'
      - id: b
        text: '$9:12:14$'
      - id: c
        text: '$18:24:28$ only'
      - id: d
        text: '$3:6:7$'
      answer:
        choiceId: b
      explanation: |-
        Match $b$ at 12: scale the first ratio by 3 and the second by 2.
