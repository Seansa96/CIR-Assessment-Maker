lesson:
  introduction: Learn to solve Proportions problems by recognizing direct proportion, inverse proportion, conversion factors, percent and justifying each theorem or transformation.
  sections:
  - id: aops-proportions-motivation
    title: What the topic helps you notice
    required: true
    content: Proportions is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are direct proportion, inverse proportion, conversion factors, percent.
    check:
      id: aops-proportions-motivation-check
      type: multipleChoice
      prompt: In Proportions, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-proportions-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-proportions-definitions-check
      type: multipleChoice
      prompt: In Proportions, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-proportions-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: write ratios as equations, track units, percent change is relative. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-proportions-recognition-check
      type: multipleChoice
      prompt: In Proportions, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-proportions-method
    title: Choose a method
    required: true
    content: Choose the shortest valid route from the givens to the target. Explain why the condition for the chosen method is satisfied.
    check:
      id: aops-proportions-method-check
      type: multipleChoice
      prompt: In Proportions, what should be checked before applying a method?
      choices:
