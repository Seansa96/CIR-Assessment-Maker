- id: we2
  title: Field of an Infinite Line Charge
  steps:
  - id: s1
    prompt: Apply Gauss's Law to a cylindrical surface.
    explanation: 'Solution:

      1) Choose a coaxial cylindrical Gaussian surface of radius $r$ and length $L$.

      2) The field is radial, so flux only passes through the curved sides: $\oint \vec{E} \cdot d\vec{A}
      = E (2\pi r L)$.

      3) Enclosed charge is $q_{enc} = \lambda L$.

      4) Apply Gauss''s Law: $E (2\pi r L) = \frac{\lambda L}{\epsilon_0} \implies E = \frac{\lambda}{2\pi
      \epsilon_0 r}$.


      Why it works:

      The infinite symmetry means the electric field cannot have a component parallel to the wire, simplifying
      the flux integral.'
    title: Apply Gauss's Law to a cylindrical surface.
    instruction: 'Work through this step: Apply Gauss''s Law to a cylindrical surface.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: Find the electric field at a distance $r$ from an infinitely long straight wire carrying a
    uniform linear charge density $\lambda$.
