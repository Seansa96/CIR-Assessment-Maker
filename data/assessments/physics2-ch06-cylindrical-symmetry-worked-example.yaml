workedExamples:
- id: we01
  title: Field of an infinite line charge
  problem: An infinite line has uniform positive charge density $\lambda$. Find $E(r)$ using a coaxial Gaussian cylinder of length $L$.
  steps:
  - id: we1-s1
    title: Choose the surface
    instruction: Match the Gaussian surface to the source symmetry.
    hint: The field is radial and depends only on distance from the line.
    type: multipleChoice
    prompt: Which surface makes the flux calculation simplest?
    choices:
    - { id: a, text: A coaxial cylinder of radius $r$ and length $L$ }
    - { id: b, text: A sphere centered on the line, issueSignals: [{ id: physics2-gauss-cylindrical-mismatch, domains: [physics-2] }] }
    - { id: c, text: A disk perpendicular to the line, issueSignals: [{ id: physics2-gauss-cylindrical-mismatch, domains: [physics-2] }] }
    - { id: d, text: A cube with one face on the line, issueSignals: [{ id: physics2-gauss-cylindrical-mismatch, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: Choose a coaxial cylinder. The field is constant on its curved surface and tangent to the end caps.
      Why it works: Cylindrical symmetry makes one unknown magnitude $E(r)$ factor out of the flux integral.
      Why the other choices fail: Their geometry does not keep the field magnitude constant on the contributing surface.
  - id: we1-s2
    title: Write Gauss's law
    instruction: Compute flux and enclosed charge symbolically.
    hint: The curved area is $2\pi rL$ and the line charge inside is $\lambda L$.
    type: multipleChoice
    prompt: Which equation correctly represents Gauss's law for this cylinder?
    choices:
    - { id: a, text: '$E(2\pi rL)=\lambda L/\epsilon_0$' }
    - { id: b, text: '$E(4\pi r^2)=\lambda L/\epsilon_0$', issueSignals: [{ id: physics2-gauss-area-geometry-error, domains: [physics-2] }] }
    - { id: c, text: '$E(2\pi rL)=\lambda/(\epsilon_0L)$', issueSignals: [{ id: physics2-gauss-enclosed-charge-error, domains: [physics-2] }] }
    - { id: d, text: '$E(2\pi rL)=0$ because the cylinder is closed', issueSignals: [{ id: physics2-gauss-flux-zero-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: The curved surface contributes $E(2\pi rL)$, and the enclosed charge is $\lambda L$, so the first equation is correct.
      Why it works: End-cap flux is zero because $\mathbf E$ is tangent there.
      Why the other choices fail: They use spherical area, mishandle line density, or mistake a closed surface for zero flux.
  - id: we1-s3
    title: Solve and verify scaling
    instruction: Isolate $E$ and inspect its dependence on $r$.
    hint: Cancel $L$ only after writing the full equation.
    type: multipleChoice
    prompt: Which result and scaling check are correct?
    choices:
    - { id: a, text: '$E=\lambda/(2\pi\epsilon_0r)$, directed radially outward for $\lambda>0$' }
    - { id: b, text: '$E=\lambda/(4\pi\epsilon_0r^2)$, directed outward', issueSignals: [{ id: physics2-gauss-spherical-scaling-error, domains: [physics-2] }] }
    - { id: c, text: '$E=\lambda/(2\pi\epsilon_0r)$, directed inward', issueSignals: [{ id: physics2-gauss-sign-direction-error, domains: [physics-2] }] }
    - { id: d, text: '$E=\lambda/(2\pi\epsilon_0L)$, independent of distance', issueSignals: [{ id: physics2-gauss-length-cancellation-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: Cancel $L$ to obtain $E=\lambda/(2\pi\epsilon_0r)$. Positive line charge gives outward field and inverse-$r$ scaling.
      Why it works: Cylindrical area grows linearly with $r$.
      Why the other choices fail: b uses spherical scaling, c reverses the sign, and d fails to cancel the cylinder length.
- id: we02
  title: Field near a charged cylindrical shell
  problem: A long cylindrical shell has surface charge density $\sigma$ at radius $R$. Compare the field inside and outside.
  steps:
  - id: we2-s1
    title: Select Gaussian radii
    instruction: Use coaxial cylinders with radius $r<R$ and $r>R$.
    hint: Decide whether each surface encloses the shell charge.
    type: multipleChoice
    prompt: What enclosed charge belongs to a Gaussian cylinder with $r<R$?
    choices:
    - { id: a, text: '$0$' }
    - { id: b, text: '$2\pi RL\sigma$', issueSignals: [{ id: physics2-gauss-enclosed-charge-error, domains: [physics-2] }] }
    - { id: c, text: '$2\pi rL\sigma$', issueSignals: [{ id: physics2-gauss-radius-error, domains: [physics-2] }] }
    - { id: d, text: '$\sigma/L$', issueSignals: [{ id: physics2-gauss-units-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: For $r<R$, the Gaussian cylinder lies inside the shell and encloses no shell charge.
      Why it works: Gauss's law counts charge inside the chosen surface, not charge at a larger radius.
      Why the other choices fail: They use the shell charge despite the surface being inside, use the wrong radius, or have wrong units.
  - id: we2-s2
    title: Evaluate the inside field
    instruction: Apply Gauss's law to the inner Gaussian cylinder.
    hint: With zero enclosed charge, the symmetric field must vanish.
    type: multipleChoice
    prompt: What is the field for $r<R$?
    choices:
    - { id: a, text: '$E=0$' }
    - { id: b, text: '$E=\sigma/\epsilon_0$', issueSignals: [{ id: physics2-gauss-boundary-error, domains: [physics-2] }] }
    - { id: c, text: '$E=\sigma R/(\epsilon_0r)$', issueSignals: [{ id: physics2-gauss-inside-scaling-error, domains: [physics-2] }] }
    - { id: d, text: '$E=\sigma r/\epsilon_0R$', issueSignals: [{ id: physics2-gauss-inside-scaling-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: $E(2\pi rL)=0$, so $E=0$ everywhere inside the ideal infinite shell.
      Why it works: The Gaussian surface encloses no charge and cylindrical symmetry makes $E$ constant on it.
      Why the other choices fail: They use the boundary field or invent radial dependence unsupported by the enclosed-charge result.
  - id: we2-s3
    title: Evaluate the outside field
    instruction: Use the shell charge enclosed by a cylinder with $r>R$.
    hint: The enclosed charge is surface density times shell area.
    type: multipleChoice
    prompt: Which outside field follows for $r>R$?
    choices:
    - { id: a, text: '$E=\sigma R/(\epsilon_0r)$, radially outward for $\sigma>0$' }
    - { id: b, text: '$E=\sigma/\epsilon_0$, independent of $r$', issueSignals: [{ id: physics2-gauss-cylindrical-scaling-error, domains: [physics-2] }] }
    - { id: c, text: '$E=\sigma Rr/\epsilon_0$', issueSignals: [{ id: physics2-gauss-cylindrical-scaling-error, domains: [physics-2] }] }
    - { id: d, text: '$E=0$ because the shell is closed', issueSignals: [{ id: physics2-gauss-closed-surface-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: $E(2\pi rL)=\sigma(2\pi RL)/\epsilon_0$, giving $E=\sigma R/(\epsilon_0r)$.
      Why it works: The enclosed charge is fixed while cylindrical area grows with $r$.
      Why the other choices fail: b is the planar result, c has the inverse scaling reversed, and d confuses closed with zero flux.
