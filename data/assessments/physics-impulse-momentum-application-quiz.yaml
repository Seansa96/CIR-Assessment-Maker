questions:
- id: q-impulse-cart
  title: Evaluating an Impulse Integral
  type: symbolicResponse
  prompt: |
    A $0.50\text{ kg}$ cart starts at rest. Its net force is $F(t)=4.0t$ N for $0\le t\le2.0\text{ s}$. What is its final velocity in m/s?
  answer:
    gradingMode: auto
    expectedLatex: 16
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Solution: $J=\int_0^{2.0}4.0t\,dt=8.0\text{ N s}$. Since $J=m(v_f-v_i)$ and $v_i=0$, $8.0=0.50v_f$, so $v_f=16\text{ m/s}$.

    Why it works: Net impulse equals the change in momentum.
  difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
  difficultyEvidence: Evaluates a force-time integral before applying impulse-momentum.
