questions:
- id: q-impulse-cart
  title: Evaluating an Impulse Integral
  type: symbolicResponse
  prompt: 'A $0.50\\text{ kg}$ cart moving in 1D is subjected to a net force given by $F(t) = 4.0t$ (in Newtons) from $t = 0$ to $t = 2.0\\text{ s}$. \nIf the cart started at rest, what is its final velocity (in m/s)?\n'
  answer:
    gradingMode: auto
    expectedLatex: 16
    equivalenceMode: expression
    tolerance: 0.1
  explanation: 'First, evaluate the impulse integral: $J = \\int_0^{2.0} 4.0t \\, dt = [2.0t^2]_0^{2.0} = 2.0(2.0)^2 = 8.0\\text{ N}\\cdot\\text{s}$.\nThen use the theorem $J = \\Delta p = m(v_f - v_i)$. \nSince $v_i = 0$, $8.0 = 0.50 v_f \\implies v_f = 16\\text{ m/s}$.\n'
