schemaVersion: 1
id: css-specificity-best-practices-concept-lesson
title: Best Practices for CSS Specificity
assessmentType: conceptLesson
categoryId: css
subcategoryIds:
  - css-selectors-specificity
modeDefault: study
sections:
  - id: flat-selectors
    title: Keep Specificity Flat
    content: |
      A common mistake in CSS is creating deeply nested, highly specific selectors like `body #main-content .sidebar ul li a.active`.
      
      High specificity makes your CSS brittle. If you ever need to override that link's style, you have to write an *even more* specific selector, leading to an arms race of specificity.
      
      **Best Practice**: Keep your specificity as low and flat as possible. A single class like `.sidebar-link-active` is much easier to maintain and override than a deeply nested chain.
  - id: avoid-ids
    title: Avoid ID Selectors for Styling
    content: |
      IDs carry extremely high specificity (1-0-0). Because of this, they easily override your class-based styles and can only be overridden by other IDs or `!important`.
      
      **Best Practice**: Reserve IDs for JavaScript hooks and HTML anchors. Use class selectors for all CSS styling, even if the element only appears once on the page (e.g., use `.header` instead of `#header`).
  - id: danger-of-important
    title: The Dangers of !important
    content: |
      The `!important` rule overrides normal specificity entirely. While it might seem like a quick fix to force a style to apply, it breaks the natural cascade of CSS.
      
      Once you use `!important`, the only way to override it is with *another* `!important` placed later in the stylesheet.
      
      **Best Practice**: Never use `!important` to solve specificity wars. Fix the underlying selector structure instead. The only valid use case for `!important` is usually for strictly enforced utility classes (e.g., `.hidden { display: none !important; }`).
