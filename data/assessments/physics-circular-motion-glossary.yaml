      - { id: centripetal-acceleration, term: Centripetal acceleration, definition: 'Inward acceleration of magnitude $v^2/r$ that changes velocity direction.', drills: [{ id: cg1, type: cloze, prompt: 'Centripetal acceleration points ____.', answer: { expected: inward, expectedLatex: '', aliases: ['toward center'], media: [] }, explanation: 'Solution: Inward.\n\nWhy it works: It points toward the center of curvature.' }] }
      - { id: centripetal-force, term: Centripetal force, definition: 'The net inward force required for circular motion.', drills: [{ id: cg2, type: typed, prompt: 'Is centripetal force a new kind of force?', answer: { expected: no, expectedLatex: '', aliases: ['no it is net force'], media: [] }, explanation: 'Solution: No.\n\nWhy it works: It names the net radial role of real forces.' }] }
      - { id: radial-acceleration, term: Radial acceleration, definition: 'Acceleration directed along the radius toward the center.', drills: [{ id: cg3, type: cloze, prompt: 'Radial acceleration changes velocity ____.', answer: { expected: direction, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Direction.\n\nWhy it works: It is perpendicular to velocity.' }] }
      - { id: tangential-acceleration, term: Tangential acceleration, definition: 'Acceleration along the path that changes speed.', drills: [{ id: cg4, type: typed, prompt: 'What acceleration changes circular-motion speed?', answer: { expected: 'tangential acceleration', expectedLatex: 'a_t', aliases: [], media: [] }, explanation: 'Solution: Tangential acceleration.\n\nWhy it works: It lies along velocity.' }] }
