  - id: s-atc-02
    title: Grouping Related Data with struct
    required: true
    content: |
      When several variables always travel together and describe one entity, a `struct` bundles
      them into a single named type. You define the fields once and use the struct name everywhere:

      ```cpp
      struct Student {
          std::string name;
          int         age;
          double      gpa;
      };

      Student alice{"Alice", 20, 3.8};
      std::cout << alice.name << " has GPA " << alice.gpa << endl;
      ```

      Members are accessed with the dot operator `.`. You can also declare a `struct` with empty
      braces to zero-initialize all numeric fields:

      ```cpp
      Student blank{};  // name="", age=0, gpa=0.0
      ```

      **Structs are value types**: assigning one struct to another copies all its fields
      independently. There is no shared memory between the original and the copy:

      ```cpp
      Student a = alice;
      a.gpa = 4.0;
      // alice.gpa is still 3.8 — a and alice are separate copies
      ```

      This copy-by-value behavior makes structs predictable: changing one variable never
      silently changes another. Use a `struct` whenever several variables logically belong
      together as a single entity — a coordinate, a record, a configuration block.
    media: []
    check:
      id: s-atc-02-check
      type: multipleChoice
      prompt: >-
        After executing:
        ```cpp
        Student s{"Bob", 19, 3.2};
        Student t = s;
        t.gpa = 4.0;
        ```
        What is the value of `s.gpa`?
      choices:
      - id: a
        text: '`3.2` — unchanged'
        media: []
        issueSignals: []
      - id: b
        text: '`4.0` — both `s` and `t` refer to the same object'
        media: []
        issueSignals:
        - id: struct-copy-confusion
          domains: []
      - id: c
        text: '`0.0` — gpa is reset on assignment'
        media: []
        issueSignals:
        - id: assignment-zero-confusion
          domains: []
      - id: d
        text: A compile error because you cannot copy a `struct`
        media: []
        issueSignals:
        - id: struct-copy-not-allowed-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: |
        Solution:
        `Student t = s;` creates an independent copy of `s`. Modifying `t.gpa` affects only `t`.
        `s.gpa` remains `3.2`.

        Why it works:
        C++ structs are value types. The assignment operator copies every field byte-for-byte
        into the new variable. From that point, `s` and `t` are two completely independent objects
        occupying different memory locations.

        Why the other choices fail:
        - `4.0` reflects a reference-semantics mental model (like a pointer or Java object). C++
          struct assignment is copy, not reference.
        - `0.0` incorrectly assumes that struct assignment resets fields instead of copying them.
        - A compile error: C++ automatically provides a copy-assignment operator for structs;
          no special code is required.
