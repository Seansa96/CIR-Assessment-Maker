      explanation: |
        Solution:
        10 GB is approximately 10,000,000,000 bytes. An `int` holds at most about
        2,147,483,647 — far too small. An `unsigned int` holds at most about 4,294,967,295,
        which is also smaller than 10 GB. `long long` holds up to about 9.2 × 10¹⁸, which
        comfortably fits file sizes in any foreseeable scenario.

        Why it works:
        `long long` is a 64-bit signed integer, giving it a range large enough for any
        practical file size, byte count, or large integer calculation.

        Why the other choices fail:
        - `int` overflows at ~2.1 billion; a 10 GB file exceeds this by more than 4×.
        - `unsigned int` extends only to ~4.3 billion, still less than 10 billion.
        - `bool` stores only `true`/`false` and has no numeric range for byte counts.
