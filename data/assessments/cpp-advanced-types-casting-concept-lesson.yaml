  - id: s-atc-05
    title: Implicit Narrowing Conversion
    required: true
    content: |
      C++ allows many numeric types to convert to each other automatically. When the
      destination type is smaller or less precise, the conversion *narrows* and silently
      discards information:

      ```cpp
      double d = 9.99;
      int i = d;        // i == 9; the fractional part is truncated, not rounded
      ```

      The truncation is silent: no error, no warning by default. This is a frequent source of
      bugs. **Braced initialization `{}`** is a safer alternative because it makes the compiler
      reject narrowing at compile time:

      ```cpp
      int i{9.99};   // Error: narrowing conversion — caught before the program runs
      ```

      **Integer division** is a related trap. When both operands of `/` are `int`, the result
      is an `int` — the quotient is truncated regardless of the variable that receives it:

      ```cpp
      int result = 9 / 2;          // result == 4, not 4.5
      double d   = 9 / 2;          // d == 4.0, not 4.5 — division is already done in int!
      double ok  = 9.0 / 2;        // ok == 4.5 — one double operand forces double division
      ```

      The **narrowing trap in `std::vector` initializers** is another compiler-caught case:

      ```cpp
      std::vector<int> v{1, 2.5};  // Error: 2.5 would narrow to int
      ```

      Recognizing these situations early prevents hard-to-debug runtime errors.
    media: []
    check:
      id: s-atc-05-check
      type: multipleChoice
      prompt: What is the value stored in `result` after `int result = 9 / 2;`?
      choices:
      - id: a
        text: '`4`'
        media: []
        issueSignals: []
      - id: b
        text: '`4.5`'
        media: []
        issueSignals:
        - id: floating-point-division-assumed
          domains: []
      - id: c
        text: '`5`'
        media: []
        issueSignals:
        - id: integer-rounding-confusion
          domains: []
      - id: d
        text: '`9`'
        media: []
        issueSignals:
        - id: division-ignored-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: |
        Solution:
        Both `9` and `2` are `int` literals, so `/` performs integer division: the mathematical
        result is 4.5, but the fractional part is discarded. `result` receives `4`.

        Why it works:
        In C++, the type of an arithmetic expression is determined by the types of its operands,
        not by the type of the variable receiving the result. Because both operands are `int`,
        the division produces an `int` — the truncation happens before the assignment.

        Why the other choices fail:
        - `4.5` assumes at least one operand was a floating-point type, but both are `int`.
        - `5` confuses truncation with rounding. C++ truncates toward zero; 4.5 becomes 4,
          not 5.
        - `9` suggests the division was not performed, which is incorrect.
