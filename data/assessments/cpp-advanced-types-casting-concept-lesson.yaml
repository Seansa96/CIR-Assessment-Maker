  - id: s-atc-04
    title: 'std::vector<T>: A Typed, Resizable Sequence'
    required: true
    content: |
      `std::vector<T>` is the go-to container for storing a sequence of values when you do not
      know the size at compile time. The type parameter `T` specifies what the vector holds;
      the compiler enforces that only values of that type can be stored:

      ```cpp
      #include <vector>

      std::vector<double> scores;   // empty vector of doubles
      scores.push_back(88.5);       // append 88.5
      scores.push_back(91.0);       // append 91.0
      scores.push_back(74.3);       // append 74.3

      std::cout << "Count: " << scores.size() << endl; // 3
      std::cout << "First: " << scores[0]    << endl;  // 88.5
      ```

      **Key operations:**

      | Operation | Meaning |
      |---|---|
      | `v.push_back(x)` | Append `x` to the end |
      | `v.size()` | Number of elements (returns `size_t`) |
      | `v[i]` | Access element at index `i` (no bounds check) |
      | `v.at(i)` | Access element at index `i` (throws if out of range) |
      | `v.empty()` | `true` if `v` has no elements |
      | `v.clear()` | Remove all elements |

      **Range-based for loop** is the idiomatic way to visit every element:

      ```cpp
      double sum = 0.0;
      for (double score : scores) {
          sum += score;
      }
      ```

      Prefer `std::vector` over raw arrays for almost all sequential storage: it manages its
      own memory, resizes automatically, and integrates with every standard library algorithm.
    media: []
    check:
      id: s-atc-04-check
      type: multipleChoice
      prompt: >-
        After:
        ```cpp
        std::vector<int> v = {10, 20, 30};
        v.push_back(40);
        ```
        What does `v.size()` return?
      choices:
      - id: a
        text: '`4` elements'
        media: []
        issueSignals: []
      - id: b
        text: '`3` elements'
        media: []
        issueSignals:
        - id: push-back-ignored-confusion
          domains: []
      - id: c
        text: '`40` — the last element'
        media: []
        issueSignals:
        - id: value-not-size-confusion
          domains: []
      - id: d
        text: '`1` — only the appended element'
        media: []
        issueSignals:
        - id: only-last-element-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: |
        Solution:
        The vector is initialized with 3 elements (`{10, 20, 30}`), then `push_back(40)` appends
        a fourth. `v.size()` returns the count of elements currently stored, which is `4`.

        Why it works:
        `push_back` increases the size by 1. `v.size()` always reflects the current number of
        stored elements, regardless of how they were added.

        Why the other choices fail:
        - `3` ignores the `push_back` call, treating the vector as if it were still at its
          initial size.
        - `40` confuses the value of the last element with the count of elements.
        - `1` would only be correct if `push_back` replaced all existing elements, which it does
          not — it appends.
