  - id: s-atc-06
    title: Explicit Type Casting with static_cast
    required: true
    content: |
      `static_cast<TargetType>(expression)` is the C++ way to convert between types
      intentionally. It communicates your intent to both the compiler and future readers,
      and it fails at compile time when the conversion is not valid:

      ```cpp
      double x = 7.89;
      int   n  = static_cast<int>(x);   // n == 7; truncates, but explicitly
      ```

      **Fixing integer division — position matters critically:**

      ```cpp
      int total = 45, count = 10;

      // WRONG — truncation happens before the cast:
      double wrong = static_cast<double>(total / count);  // 4.0

      // CORRECT — cast before dividing, so division is done in double:
      double correct = static_cast<double>(total) / count;  // 4.5
      ```

      The cast must be applied to an *operand*, not to the *result*, because C++ evaluates
      the sub-expression `total / count` first (as integer division), then casts. Once the
      fractional part is lost, the cast cannot recover it.

      **Prefer `static_cast` over C-style casts `(int)x`:**

      | Property | `static_cast<int>(x)` | C-style `(int)x` |
      |---|---|---|
      | Compiler checks validity | Yes | No |
      | Visible in code review | Obvious | Easy to miss |
      | Can accidentally remove `const` | No | Yes |

      Use `static_cast` every time you deliberately convert a numeric type. The extra typing
      is worth it: it prevents hidden errors and makes the intent of the conversion impossible
      to miss in a code review.
    media: []
    check:
      id: s-atc-06-check
      type: multipleChoice
      prompt: >-
        What value does `result` hold after:
        ```cpp
        int a = 7, b = 3;
        double result = static_cast<double>(a / b);
        ```
      choices:
      - id: a
        text: '`2.0`'
        media: []
        issueSignals: []
      - id: b
        text: '`2.333...`'
        media: []
        issueSignals:
        - id: cast-position-error
          domains: []
      - id: c
        text: '`3.0`'
        media: []
        issueSignals:
        - id: integer-rounding-confusion
          domains: []
      - id: d
        text: '`7.0`'
        media: []
        issueSignals:
        - id: numerator-only-confusion
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: |
        Solution:
        The sub-expression `a / b` is evaluated first. Both `a` and `b` are `int`, so integer
        division gives `7 / 3 = 2`. Then `static_cast<double>(2)` converts that integer `2`
        to `2.0`. The result is `2.0`, not `2.333...`.

        Why it works:
        C++ evaluates inner expressions before outer ones. The cast applies to the already-computed
        integer quotient, not to the operands. To get `2.333...`, the cast must be applied to one
        operand before the division: `static_cast<double>(a) / b`.

        Why the other choices fail:
        - `2.333...` is the mathematically correct answer but requires casting an *operand* before
          dividing. Here the cast is applied to the result of integer division — too late to
          recover the fractional part.
        - `3.0` reflects rounding rather than truncation; C++ truncates toward zero.
        - `7.0` confuses the numerator with the result of the division.
