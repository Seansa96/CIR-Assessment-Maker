  - id: s-atc-03
    title: Scoped Enumerations with enum class
    required: true
    content: |
      When a variable can only take one of a fixed set of named values — a direction, a day,
      a status code — use `enum class`. It gives each possible value a meaningful name and
      prevents the two common bugs of plain `enum`:

      **Problem 1 — name pollution**: plain `enum` dumps its enumerators into the surrounding
      scope, causing collisions if two enums have the same name (e.g., both have a `None` value).
      `enum class` requires qualification: `Color::Red`, `Direction::North`.

      **Problem 2 — implicit integer conversion**: a plain `enum` silently converts to `int`,
      so you can accidentally pass a `Direction` where an `int` is expected. `enum class`
      forbids this:

      ```cpp
      enum class Direction { North, South, East, West };

      Direction d = Direction::North;
      // int n = d;                    // Error: no implicit conversion
      int n = static_cast<int>(d);    // OK: explicit intent
      ```

      A `switch` on an `enum class` is idiomatic and lets the compiler warn when you forget
      a case:

      ```cpp
      switch (d) {
          case Direction::North: std::cout << "Going north" << endl; break;
          case Direction::South: std::cout << "Going south" << endl; break;
          case Direction::East:  std::cout << "Going east"  << endl; break;
          case Direction::West:  std::cout << "Going west"  << endl; break;
      }
      ```
    media: []
    check:
      id: s-atc-03-check
      type: selectAll
      prompt: Which statements are true about `enum class` in C++?
      choices:
      - id: a
        text: Enumerators must be qualified with the enum name (e.g., `Direction::North`).
        media: []
        issueSignals: []
      - id: b
        text: An `enum class` value implicitly converts to `int` without a cast.
        media: []
        issueSignals:
        - id: enum-class-implicit-int-confusion
          domains: []
      - id: c
        text: '`enum class` prevents its enumerator names from polluting the enclosing scope.'
        media: []
        issueSignals: []
      - id: d
        text: '`enum class` values can be used in a `switch` statement.'
        media: []
        issueSignals: []
      answer:
        choiceId:
        choiceIds:
        - a
        - c
        - d
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: |
        Solution:
        Statements a, c, and d are true. Statement b is false.

        Why it works:
        `enum class` was introduced precisely to fix the two flaws of plain `enum`:
        unqualified name access and implicit integer conversion. Requiring the enum name as a
        prefix (a, c) and prohibiting silent `int` conversion makes the intent of any comparison
        or assignment explicit. `switch` on an `enum class` (d) is fully supported and idiomatic.

        Why the other choices fail:
        - Statement b is false: `enum class` deliberately disables implicit conversion to `int`.
          You must use `static_cast<int>` if you need the underlying numeric value. This prevents
          a large class of bugs where an integer is accidentally used where an enum is expected.
