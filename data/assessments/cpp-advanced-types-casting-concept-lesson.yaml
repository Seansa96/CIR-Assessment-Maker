lesson:
  introduction: >
    The primitive types covered in the first lesson — `int`, `double`, `bool`, `char` — are
    the atoms of C++ programs. This lesson introduces the molecules: `unsigned` integers
    for non-negative quantities, `struct` for grouping related fields, `enum class` for
    named states, and `std::vector<T>` for typed sequences. It then explains how C++
    converts between types both silently and explicitly, and why controlling those
    conversions with `static_cast` produces correct, readable code.
  sections:

  - id: s-atc-01
    title: Unsigned and Sized Integer Types
    required: true
    content: |
      C++ provides several integer types that differ in size (number of bits) and whether they
      can store negative values. The most commonly needed variants are:

      | Type | Typical size | Value range |
      |---|---|---|
      | `int` | 32 bits | −2,147,483,648 to 2,147,483,647 |
      | `long long` | 64 bits | ±9.2 × 10¹⁸ |
      | `unsigned int` | 32 bits | 0 to 4,294,967,295 |
      | `size_t` | 32 or 64 bits | 0 to platform max |

      **`unsigned int`** drops the sign bit, doubling the positive range but eliminating the
      ability to store negative values. Critically, when an `unsigned` variable reaches 0 and you
      subtract 1, it does not become −1 — it *wraps around* to the maximum value (4,294,967,295
      for 32-bit). This is a common source of hard-to-find bugs:

      ```cpp
      unsigned int x = 0;
      x--;  // x is now 4,294,967,295, not -1
      ```

      **`long long`** is your go-to when values can exceed about two billion. Never use `int`
      for file sizes, database IDs, or population counts where overflow is possible.

      **`size_t`** is the unsigned integer type that `sizeof()`, `.size()`, and `.capacity()`
      return. Always use `size_t` — or `auto` — when storing sizes returned by the standard
      library to avoid signed/unsigned comparison warnings:

      ```cpp
      std::string s = "Hello";
      size_t len = s.size();  // correct: no signed/unsigned mismatch
      ```

      **Rule of thumb**: use `int` for general signed arithmetic, `long long` when the value
      can exceed ~2 billion, and `size_t` only when storing standard-library sizes. Avoid
      `unsigned` for general arithmetic because the wrap-around behavior is rarely what you want.
    media: []
