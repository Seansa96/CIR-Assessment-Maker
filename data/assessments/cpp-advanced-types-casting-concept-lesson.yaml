  - id: s-atc-07
    title: Choosing the Right Type
    required: true
    content: |
      With so many types available, a quick decision guide helps you pick the right one every
      time:

      | Situation | Recommended type |
      |---|---|
      | General integer arithmetic | `int` |
      | Integer that may exceed ~2 billion | `long long` |
      | Non-negative count or size from the standard library | `size_t` |
      | Decimal / fractional value | `double` |
      | Single character | `char` |
      | True/false flag | `bool` |
      | Fixed set of named states or categories | `enum class` |
      | Group of related named fields forming one entity | `struct` |
      | Resizable typed sequence | `std::vector<T>` |

      Two final habits that prevent a large class of bugs:

      **Always initialize**: use braced initialization `int x{};` rather than `int x;`. An
      uninitialized local variable has an indeterminate (garbage) value; reading it is undefined
      behavior.

      **Always use `static_cast`** when converting between numeric types intentionally. Prefer
      it over C-style casts `(int)x`, which bypass compiler checks and can silently discard
      `const`. When you see `static_cast`, you immediately know the programmer intended the
      conversion; when you see `(int)`, you cannot tell whether it was intentional or accidental.
    media: []
    check:
      id: s-atc-07-check
      type: selectAll
      prompt: >-
        Which of the following are good reasons to prefer `static_cast<int>(x)` over
        the C-style cast `(int)x`?
      choices:
      - id: a
        text: '`static_cast` produces a compile error when the conversion is not valid for the types involved.'
        media: []
        issueSignals: []
      - id: b
        text: '`static_cast` executes faster than a C-style cast at runtime.'
        media: []
        issueSignals:
        - id: static-cast-runtime-speed-myth
          domains: []
      - id: c
        text: '`static_cast` makes the programmer''s intent explicit and easy to find in a code review.'
        media: []
        issueSignals: []
      - id: d
        text: '`static_cast` cannot accidentally remove `const` or `volatile` qualifiers.'
        media: []
        issueSignals: []
      answer:
        choiceId:
        choiceIds:
        - a
        - c
        - d
        expected:
        gradingMode:
        expectedLatex:
        equivalenceMode:
        variables: []
        value:
        tolerance:
        media: []
        keyPoints: []
        circuitAnswer:
        graphingAnswer:
      explanation: |
        Solution:
        Statements a, c, and d are correct reasons to prefer `static_cast`. Statement b is false.

