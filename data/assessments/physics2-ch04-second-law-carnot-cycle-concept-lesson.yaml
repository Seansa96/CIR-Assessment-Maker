workedExamples:
- id: l2-sec1
  title: Carnot's Principle
  explanation: Sadi Carnot proposed that no real engine operating between two energy
    reservoirs can be more efficient than a reversible engine operating between the
    same two reservoirs. This theoretical, perfectly reversible engine is called a
    Carnot engine.
- id: l2-sec2
  title: The Carnot Cycle
  explanation: 'The Carnot cycle consists of four reversible processes for an ideal
    gas:

    1. Isothermal expansion at $T_h$ (absorbing $Q_h$).

    2. Adiabatic expansion (cooling from $T_h$ to $T_c$).

    3. Isothermal compression at $T_c$ (expelling $Q_c$).

    4. Adiabatic compression (heating back to $T_h$).


    For a Carnot engine, the ratio of heat transferred is equal to the ratio of absolute
    temperatures: $\frac{Q_c}{Q_h} = \frac{T_c}{T_h}$.'
- id: l2-sec3
  title: Carnot Efficiency
  explanation: 'Because $\frac{Q_c}{Q_h} = \frac{T_c}{T_h}$, the efficiency of a Carnot
    engine becomes:

    $$e_C = 1 - \frac{T_c}{T_h}$$


    This is the maximum possible efficiency for any heat engine operating between
    temperatures $T_h$ and $T_c$. Since $T_c > 0$ K, a 100% efficient engine is impossible
    (Kelvin-Planck statement of the Second Law).'
