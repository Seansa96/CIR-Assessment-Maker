lesson:
  introduction: >
    This lesson develops a repeatable way to solve The Carnot Cycle problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch04-second-law-carnot-cycle-s1
    title: Name the model and quantities
    required: true
    content: >
      The Carnot Cycle uses eta = 1 - T_c/T_h. In the name the model and quantities stage, use Kelvin temperatures and compare the result with the physical bounds zero and one.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving The Carnot Cycle problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch04-second-law-carnot-cycle-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for The Carnot Cycle, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use eta = 1 - T_c/T_h after you use Kelvin temperatures and compare the result with the physical bounds zero and one.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this The Carnot Cycle problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch04-second-law-carnot-cycle-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables eta = 1 - T_c/T_h relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch04-second-law-carnot-cycle-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit The Carnot Cycle.
        media: []
        issueSignals:
        - id: physics2-physics2-ch04-second-law-carnot-cycle-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
