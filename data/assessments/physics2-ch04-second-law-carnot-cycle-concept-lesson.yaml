      explanation: >
        Solution: During name the model and quantities for The Carnot Cycle, first use Kelvin temperatures and compare the result with the physical bounds zero and one. Then apply eta = 1 - T_c/T_h with one consistent coordinate system and solve for the requested quantity.


        Why it works: eta = 1 - T_c/T_h connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
