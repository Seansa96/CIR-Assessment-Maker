glossary:
  introduction: 'Use these terms to interpret a polar equation before calculating with it.'
  sections:
    - id: polar-language
      title: Directed-radius vocabulary
      required: true
      content: 'Polar coordinates use a ray angle and a directed radius, so coordinate equivalence and sign are central.'
      entries:
        - { id: polar-radius, term: Polar radius, definition: 'Directed distance r from the pole along a ray.', notation: '$r$', examples: ['Negative r plots on the opposite ray.'], aliases: [radial coordinate], media: [{ type: image, src: /media/calculus/polar-review-loop-sector.svg, alt: Polar radius on a ray }], tags: [r], drills: [{ id: radius-drill, type: cloze, prompt: 'A negative polar radius is plotted on the ____ ray.', answer: { expected: opposite, aliases: [opposite] }, explanation: 'Solution: The missing word is opposite. Why it works: Negating r reverses direction by pi. Common trap: Deleting negative radius values.' }] }
        - { id: polar-axis-symmetry, term: Polar-axis symmetry, definition: 'Symmetry across the horizontal polar axis, often tested by replacing theta with negative theta.', notation: '$\theta\mapsto-\theta$', examples: ['Cosine-based equations often pass this test.'], aliases: [horizontal symmetry], media: [{ type: image, src: /media/calculus/polar-review-loop-sector.svg, alt: Polar-axis symmetric curve }], tags: [symmetry], drills: [{ id: symmetry-drill, type: flashcard, prompt: 'What substitution tests polar-axis symmetry?', answer: { expected: 'theta replaced by negative theta', aliases: ['theta to negative theta'] }, explanation: 'Solution: Replace theta with negative theta. Why it works: This reflects each ray across the polar axis. Common trap: Negating r instead.' }] }
        - { id: limacon, term: Limacon, definition: 'A curve of the form $r=a+b\cos\theta$ or $a+b\sin\theta$; it has an inner loop when $|b|>|a|$.', notation: '$r=a+b\cos\theta$', examples: ['Check where r changes sign.'], aliases: [limaçon], media: [{ type: image, src: /media/calculus/polar-review-loop-sector.svg, alt: Limacon with inner loop }], tags: [families], drills: [{ id: limacon-drill, type: cloze, prompt: 'A limacon has an inner loop when absolute b is ____ than absolute a.', answer: { expected: greater, aliases: [larger] }, explanation: 'Solution: The missing word is greater. Why it works: The radius then crosses zero and becomes negative. Common trap: Calling every limacon a cardioid.' }] }
        - { id: rose, term: Rose curve, definition: 'A curve $r=a\cos(n\theta)$ or $a\sin(n\theta)$ with petal count determined by the parity of n.', notation: '$r=a\cos(n\theta)$', examples: ['Odd n gives n petals; even n gives 2n.'], aliases: [rhodonea], media: [{ type: image, src: /media/calculus/polar-review-loop-sector.svg, alt: Polar petal curve model }], tags: [families], drills: [{ id: rose-drill, type: flashcard, prompt: 'How many petals does $r=\cos(3\theta)$ have?', answer: { expected: three, aliases: ['3'] }, explanation: 'Solution: It has three petals. Why it works: Odd n yields n petals. Common trap: Always doubling n.' }] }
