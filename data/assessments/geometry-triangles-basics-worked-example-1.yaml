workedExamples:
- id: we-geom-tri-1
  title: Solving for the Third Angle
  steps:
  - id: step-1
    title: Identify the relevant theorem
    type: multipleChoice
    choices:
    - id: c1
      text: Triangle Angle Sum Theorem
    - id: c2
      text: Isosceles Triangle Theorem
    answer:
      choiceId: c1
    explanation: The Triangle Angle Sum Theorem relates the three interior angles.
    instruction: Consider the following question to advance.
    prompt: Which theorem should drive the solution?
  - id: step-2
    title: Set up the equation
    type: multipleChoice
    choices:
    - id: c1
      text: |-
        $m\angle A + m\angle B = m\angle C$
    - id: c2
      text: |-
        $m\angle A + m\angle B + m\angle C = 180^\circ$
    answer:
      choiceId: c2
    explanation: |-
      The sum of the interior angles is $180^\circ$.
    instruction: Consider the following question to advance.
    prompt: Using the theorem, write an equation relating the angles.
  - id: step-3
    title: Calculate the missing angle
    type: numericResponse
    answer:
      value: 60.0
      tolerance: 0.0
    explanation: |-
      $45 + 75 + m\angle C = 180$. $120 + m\angle C = 180$. Therefore, $m\angle C = 60^\circ$.
    instruction: Consider the following question to advance.
    prompt: |-
      Substitute the given values into the equation and solve for $m\angle C$. What is the measure of $\angle C$?
  problem: |-
    In $\triangle ABC$, the measure of $\angle A$ is $45^\circ$ and the measure of $\angle B$ is $75^\circ$. Find the measure of $\angle C$.
