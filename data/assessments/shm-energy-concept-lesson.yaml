    title: Physical system and assumptions
    content: For **Energy in Simple Harmonic Motion**, start from the model $E=\tfrac12 kA^2$. This step
      connects the physical picture to the physical system and assumptions. State assumptions, track SI
      units, and explain what a limiting case means before calculating.
