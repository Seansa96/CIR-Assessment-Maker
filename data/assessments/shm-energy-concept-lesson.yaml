lesson:
  introduction: This lesson develops Energy in Simple Harmonic Motion from a diagram, a mathematical model,
    and a calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      In simple harmonic motion, a system's energy oscillates continuously between kinetic energy (associated with the object's mass and velocity) and potential energy (stored in the stretched or compressed spring). We assume a conservative system where no mechanical energy is lost to non-conservative forces like friction or air drag.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s1, type: multipleChoice, prompt: 'Which forms exchange in ideal SHM?', choices: [{id: a, text: 'Kinetic and potential energy'}, {id: b, text: 'A changing total energy'}, {id: c, text: 'No energy relation'}, {id: d, text: 'A constant force'}], answer: {choiceId: a}, explanation: 'This follows from conservation of mechanical energy in ideal SHM.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The relevant quantities are kinetic energy $K = \frac{1}{2}mv^2$, elastic potential energy $U = \frac{1}{2}kx^2$, the spring constant $k$, the mass $m$, and the amplitude $A$. Mechanical energy $E$ is the sum of kinetic and potential energy: $E = K + U$.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s2, type: multipleChoice, prompt: 'What is total mechanical energy?', choices: [{id: a, text: '$E=K+U$'}, {id: b, text: 'A changing total energy'}, {id: c, text: 'No energy relation'}, {id: d, text: 'A constant force'}], answer: {choiceId: a}, explanation: 'This follows from conservation of mechanical energy in ideal SHM.'}
  - id: s3
    title: Mathematical model
    content: >-
      At any position $x$, the total energy is $E = \frac{1}{2}mv^2 + \frac{1}{2}kx^2$. Because energy is conserved, $E$ remains constant throughout the motion. At the amplitude ($x = \pm A$), the velocity is zero, so all energy is potential: $E = \frac{1}{2}kA^2$. At the equilibrium position ($x = 0$), the potential energy is zero, so all energy is kinetic: $E = \frac{1}{2}mv_{\text{max}}^2$.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s3, type: multipleChoice, prompt: 'What is total energy at amplitude?', choices: [{id: a, text: '$\frac12kA^2$'}, {id: b, text: 'A changing total energy'}, {id: c, text: 'No energy relation'}, {id: d, text: 'A constant force'}], answer: {choiceId: a}, explanation: 'This follows from conservation of mechanical energy in ideal SHM.'}
  - id: s4
    title: Calculus connection
    content: >-
      Using the calculus-based kinematic equations, we know $x(t) = A\cos(\omega t)$ and $v(t) = -\omega A\sin(\omega t)$. Substituting these into the energy equations gives $U(t) = \frac{1}{2}kA^2\cos^2(\omega t)$ and $K(t) = \frac{1}{2}m\omega^2 A^2\sin^2(\omega t)$.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s4, type: multipleChoice, prompt: 'How do energy terms vary in time?', choices: [{id: a, text: '$K$ and $U$ vary as squared sine/cosine'}, {id: b, text: 'A changing total energy'}, {id: c, text: 'No energy relation'}, {id: d, text: 'A constant force'}], answer: {choiceId: a}, explanation: 'This follows from conservation of mechanical energy in ideal SHM.'}
  - id: s5
    title: Derivation or justification
    content: >-
      To prove energy is conserved mathematically, we sum $K(t)$ and $U(t)$. Recall that $\omega^2 = \frac{k}{m}$, so $\frac{1}{2}m\omega^2 A^2$ simplifies to $\frac{1}{2}kA^2$. Thus, $E(t) = \frac{1}{2}kA^2\sin^2(\omega t) + \frac{1}{2}kA^2\cos^2(\omega t)$. Factoring out $\frac{1}{2}kA^2$ and applying the Pythagorean identity $\sin^2\theta + \cos^2\theta = 1$, we find $E = \frac{1}{2}kA^2$, a constant.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s5, type: multipleChoice, prompt: 'What identity proves total energy is constant?', choices: [{id: a, text: '$\sin^2\theta+\cos^2\theta=1$'}, {id: b, text: 'A changing total energy'}, {id: c, text: 'No energy relation'}, {id: d, text: 'A constant force'}], answer: {choiceId: a}, explanation: 'This follows from conservation of mechanical energy in ideal SHM.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, plotting energy vs. position reveals a parabolic potential energy well $U(x) = \frac{1}{2}kx^2$. Kinetic energy $K(x)$ is an inverted parabola. Their sum is a flat horizontal line $E = \frac{1}{2}kA^2$, visually confirming that total energy is invariant with position.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s6, type: multipleChoice, prompt: 'What does a total-energy-versus-position graph show?', choices: [{id: a, text: 'A horizontal total-energy line'}, {id: b, text: 'A changing total energy'}, {id: c, text: 'No energy relation'}, {id: d, text: 'A constant force'}], answer: {choiceId: a}, explanation: 'This follows from conservation of mechanical energy in ideal SHM.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A powerful quantitative strategy is to equate the energy at two different points in the oscillation. For example, to find maximum velocity, set the maximum potential energy equal to the maximum kinetic energy: $\frac{1}{2}kA^2 = \frac{1}{2}mv_{\text{max}}^2$, and solve for $v_{\text{max}} = A\sqrt{\frac{k}{m}} = A\omega$.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s7, type: multipleChoice, prompt: 'How can maximum speed be found?', choices: [{id: a, text: 'Equate maximum potential and kinetic energy'}, {id: b, text: 'A changing total energy'}, {id: c, text: 'No energy relation'}, {id: d, text: 'A constant force'}], answer: {choiceId: a}, explanation: 'This follows from conservation of mechanical energy in ideal SHM.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Limiting behavior check: if the amplitude $A$ is doubled, the total energy increases by a factor of 4 because $E \propto A^2$. The SI unit of energy is the Joule (J), which expands to $\text{kg}\cdot\text{m}^2/\text{s}^2$, consistent with both $\frac{1}{2}mv^2$ and $\frac{1}{2}kx^2$.
    media:
    - type: image
      src: /media/physics/owa/shm-energy.svg
      alt: Labeled original schematic for Energy in Simple Harmonic Motion used for quantitative analysis.
      caption: Energy in Simple Harmonic Motion model diagram.
    check: {id: shme-s8, type: multipleChoice, prompt: 'If amplitude doubles, what happens to total energy?', choices: [{id: a, text: 'It quadruples'}, {id: b, text: 'It doubles'}, {id: c, text: 'It is unchanged'}, {id: d, text: 'It halves'}], answer: {choiceId: a}, explanation: 'Total energy is proportional to amplitude squared.'}
