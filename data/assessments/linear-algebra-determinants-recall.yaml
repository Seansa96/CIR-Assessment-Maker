  - invertibility
items:
  - id: r-2x2-formula
    type: flashcard
    prompt: |
      What is the formula for $\det \begin{bmatrix} a & b \\ c & d \end{bmatrix}$?
    answer:
      expected: '$ad - bc$'

  - id: r-row-swap-effect
    type: cloze
    prompt: |
      Swapping two rows of a matrix {{negates}} (multiplies by $-1$) the determinant.
    answer:
      expected: 'negates'

  - id: r-row-replacement-effect
    type: flashcard
    prompt: |
      What happens to the determinant when you add a multiple of one row to another row (row replacement)?
    answer:
      expected: 'The determinant does not change.'

  - id: r-row-scale-effect
    type: cloze
    prompt: |
      If you multiply one row of a matrix by a scalar $k$, the determinant is multiplied by {{k}}.
    answer:
      expected: 'k'

  - id: r-triangular-det
    type: flashcard
    prompt: |
      What is the determinant of a triangular matrix (upper or lower)?
    answer:
      expected: 'The product of its diagonal entries.'

  - id: r-invertibility-det
    type: cloze
    prompt: |
      A square matrix $A$ is invertible if and only if $\det(A)$ is {{nonzero}}.
    answer:
      expected: 'nonzero'

  - id: r-product-rule
    type: flashcard
    prompt: |
      State the product rule for determinants: $\det(AB) = $?
    answer:
      expected: '$\det(A)\det(B)$'

  - id: r-scalar-multiple-det
    type: flashcard
    prompt: |
      For an $n \times n$ matrix $A$ and scalar $k$, what is $\det(kA)$?
    answer:
      expected: '$k^n \det(A)$'

  - id: r-transpose-det
    type: cloze
    prompt: |
      $\det(A^T) = {{\det(A)}}$, so transposing a matrix does not change its determinant.
    answer:
      expected: '\det(A)'

  - id: r-det-geometric
    type: flashcard
    prompt: |
      What does $|\det(A)|$ represent geometrically for a $2 \times 2$ matrix?
    answer:
      expected: 'The area of the parallelogram formed by the column vectors of $A$.'
