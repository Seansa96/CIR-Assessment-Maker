glossary:
  sections:
  - title: Core Concepts
    entries:
    - term: Algorithm
      definition: An explicit sequence of instructions, performed on data, to accomplish a desired objective.
    - term: Uniform Cost Model
      definition: An abstraction of a modern computer where any basic operation performed takes a uniform,
        constant amount of time.
  - title: Performance Scenarios
    entries:
    - term: Worst Case
      definition: A function describing the maximum number of operations an algorithm might perform for
        an input of size n.
    - term: Average Case
      definition: A function describing the expected number of operations when performing an algorithm
        over all possible typical inputs.
    - term: Amortized Case
      definition: The average time taken per operation, evaluating a sequence of operations where one
        expensive operation is offset by many cheap ones.
  - title: Asymptotic Notation
    entries:
    - term: Big-O Notation
      definition: A notation describing the upper bound of a function's growth rate as input size approaches
        infinity.
    - term: Big-Omega Notation
      definition: A notation describing the lower bound of a function's growth rate.
    - term: Big-Theta Notation
      definition: A notation used when an algorithm is bounded from above and below by the same function
        (tight bound).
