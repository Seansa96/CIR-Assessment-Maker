lesson:
  introduction: We can now incorporate rotational kinetic energy into the principle
    of conservation of mechanical energy.
  sections:
  - id: sec-1
    title: Conservation of Mechanical Energy
    content: 'If no non-conservative work is done on a system, its total mechanical
      energy is conserved. For a system involving a rotating object (like a massive
      pulley or a rolling ball), the total mechanical energy is the sum of translational
      kinetic energy, rotational kinetic energy, and potential energy:


      $$E = K_{trans} + K_{rot} + U$$

      $$E = \frac{1}{2}mv_{cm}^2 + \frac{1}{2}I\omega^2 + U$$


      When a block falls while attached to a massive pulley, gravitational potential
      energy is converted into *both* the block''s translational kinetic energy and
      the pulley''s rotational kinetic energy.'
    media:
    - type: image
      src: /media/physics/owa/rotational-variables.svg
      alt: Wheel diagram showing the rotational variables used with moment of inertia.
      caption: Rotational kinetic energy depends on both inertia and angular speed.
    check:
      id: chk-ike-3
      type: multipleChoice
      prompt: A block of mass $m$ drops a height $h$, unwinding a string from a massive
        pulley of moment of inertia $I$. Compared to a massless pulley, how does the
        block's final speed compare?
      choices:
      - id: a
        text: The final speed is greater.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: The final speed is smaller.
      - id: c
        text: The final speed is the same.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: d
        text: It depends on the radius of the pulley.
        issueSignals:
        - id: lever-arm-confusion
      answer:
        choiceId: b
      explanation: 'Solution:

        The final speed is smaller.


        Why it works:

        With a massive pulley, some of the lost potential energy $mgh$ must go into
        the rotational kinetic energy $\frac{1}{2}I\omega^2$ of the pulley. This leaves
        less energy for the block''s translational kinetic energy $\frac{1}{2}mv^2$,
        resulting in a smaller final speed.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Rolling Energy
    content: 'Rolling energy is $K=\tfrac12mv^2+\tfrac12I\omega^2$.'
    media: []
    check: { id: chk-ike-10, type: multipleChoice, prompt: 'A rolling object has which kinetic-energy forms?', choices: [{ id: a, text: translational only }, { id: b, text: rotational only }, { id: c, text: both }, { id: d, text: neither }], answer: { choiceId: c }, explanation: 'Solution: Both forms.\n\nWhy it works: Its center translates while it rotates.\n\nWhy the other choices fail: Omitting either motion misses energy.' }
  - id: sec-4
    title: Energy Conservation
    content: 'With negligible nonconservative work, total mechanical energy is conserved.'
    media: []
    check: { id: chk-ike-11, type: multipleChoice, prompt: 'In ideal rolling down a slope, gravitational potential energy becomes:', choices: [{ id: a, text: kinetic energy }, { id: b, text: mass }, { id: c, text: torque only }, { id: d, text: nothing }], answer: { choiceId: a }, explanation: 'Solution: It becomes kinetic energy.\n\nWhy it works: Mechanical energy is conserved.\n\nWhy the other choices fail: Potential energy transfers into translational and rotational motion.' }
  - id: sec-5
    title: Inertia and Speed
    content: 'For equal released height, higher inertia parameter leaves less energy for translation and lowers speed.'
    media: []
    check: { id: chk-ike-12, type: multipleChoice, prompt: 'Which rolls slower from equal height?', choices: [{ id: a, text: object with larger $I/(MR^2)$ }, { id: b, text: object with smaller $I/(MR^2)$ }, { id: c, text: both always tie }, { id: d, text: no object }], answer: { choiceId: a }, explanation: 'Solution: The larger-inertia-parameter object.\n\nWhy it works: More energy is rotational.\n\nWhy the other choices fail: Less translational energy means slower center motion.' }
  - id: sec-6
    title: Flywheel Storage
    content: 'High inertia and high angular speed allow a flywheel to store energy.'
    media: []
    check: { id: chk-ike-13, type: multipleChoice, prompt: 'At fixed angular speed, a larger inertia flywheel stores:', choices: [{ id: a, text: less energy }, { id: b, text: more energy }, { id: c, text: equal energy }, { id: d, text: no energy }], answer: { choiceId: b }, explanation: 'Solution: More energy.\n\nWhy it works: $K=\tfrac12I\omega^2$.\n\nWhy the other choices fail: Energy is proportional to inertia at fixed speed.' }
  - id: sec-7
    title: Energy Accounting
    content: 'Write every relevant potential, translational, and rotational term before canceling or solving.'
    media: []
    check: { id: chk-ike-14, type: multipleChoice, prompt: 'A massive pulley requires adding which term to an energy equation?', choices: [{ id: a, text: $\tfrac12I\omega^2$ }, { id: b, text: $I\alpha$ only }, { id: c, text: $rF$ only }, { id: d, text: no term }], answer: { choiceId: a }, explanation: 'Solution: Add $\tfrac12I\omega^2$.\n\nWhy it works: The pulley rotates and carries kinetic energy.\n\nWhy the other choices fail: The other expressions are dynamics terms, not energy.' }
  - id: sec-2
    title: Energy in Flywheels
    content: 'A flywheel is a heavy rotating wheel used to store rotational kinetic
      energy in machines. Because $K = \frac{1}{2}I\omega^2$, a flywheel can store
      large amounts of energy if it is spun very fast (high $\omega$) or if its mass
      is concentrated at the rim (high $I$).


      Advanced modern flywheels are made of high-strength carbon fiber materials to
      withstand the extreme radial forces at high angular velocities, allowing them
      to serve as clean, efficient energy storage devices.'
    media: []
    check:
      id: chk-ike-4
      type: multipleChoice
      prompt: If you want to design a flywheel to store the maximum amount of energy
        for a given total mass and radius, where should you place the bulk of its
        mass?
      choices:
      - id: a
        text: Concentrated near the central axis.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Concentrated at the outer rim.
      - id: c
        text: Distributed evenly throughout.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: d
        text: The distribution does not affect the stored energy.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Concentrated at the outer rim.


        Why it works:

        To maximize energy storage for a given $\omega$, you must maximize the moment
        of inertia $I$. Because $I = \sum m_i r_i^2$, placing the mass at the outer
        rim (maximizing $r$) yields the highest $I$.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
