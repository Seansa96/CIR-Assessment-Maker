questions:
  - id: type2-q01
    title: Identifying a Type II Metal
    type: multipleChoice
    prompt: |
      Why do compounds containing Iron (Fe) require a Roman numeral in their name, while compounds containing Calcium (Ca) do not?
    choices:
      - id: a
        text: Iron is a transition metal that can form multiple stable ions with different charges (e.g., $+2$ or $+3$), so the specific charge must be stated. Calcium is a Group 2 metal and always forms a $+2$ ion.
      - id: b
        text: Iron is heavier than Calcium, and all heavy metals require Roman numerals.
      - id: c
        text: Calcium is a transition metal, while Iron is an alkaline earth metal.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Type II metals have variable oxidation states. Because "Iron oxide" could refer to $\text{FeO}$ or $\text{Fe}_2\text{O}_3$, the name is ambiguous. We must use Roman numerals—Iron(II) oxide or Iron(III) oxide—to specify which cation is present.

  - id: type2-q02
    title: Meaning of the Roman Numeral
    type: multipleChoice
    prompt: |
      In the name "Lead(IV) chloride", what exactly does the Roman numeral "(IV)" represent?
    choices:
      - id: a
        text: It represents the $+4$ charge on the single Lead cation ($\text{Pb}^{4+}$).
      - id: b
        text: It means there are four Lead atoms in the chemical formula.
      - id: c
        text: It means there are four Chloride atoms in the chemical formula.
      - id: d
        text: It represents the total negative charge of the compound.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** A very common student mistake is assuming the Roman numeral tells you how many atoms there are. It strictly indicates the *charge* on one individual metal cation.

  - id: type2-q03
    title: Deducing the Charge from the Formula
    type: multipleChoice
    prompt: |
      What is the correct systematic name for $\text{Cu}_2\text{O}$?
    choices:
      - id: a
        text: Copper(I) oxide
      - id: b
        text: Copper(II) oxide
      - id: c
        text: Dicopper oxide
      - id: d
        text: Copper oxide
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** To find Copper's charge, work backward from Oxygen. Oxygen is always $-2$. Since the compound is neutral, the total positive charge must be $+2$. Because there are *two* Copper atoms sharing this $+2$ charge, each Copper must be $+1$. Therefore, Copper(I) oxide.

  - id: type2-q04
    title: The Sneaky 1:1 Ratio
    type: multipleChoice
    prompt: |
      What is the correct name for $\text{SnS}$?
    choices:
      - id: a
        text: Tin(II) sulfide
      - id: b
        text: Tin(I) sulfide
      - id: c
        text: Tin sulfide
      - id: d
        text: Tin(IV) sulfide
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Sulfur is in Group 16, so it is $-2$. Since there is one Tin for every one Sulfur, the Tin atom must completely balance the $-2$ charge. Thus, Tin must be $+2$. The name is Tin(II) sulfide. (A common error is just looking at the subscript 1 and assuming it's Tin(I)).

  - id: type2-q05
    title: Writing Formulas from Names
    type: multipleChoice
    prompt: |
      Which is the correct chemical formula for Cobalt(III) chloride?
    choices:
      - id: a
        text: $\text{CoCl}_3$
      - id: b
        text: $\text{Co}_3\text{Cl}$
      - id: c
        text: $\text{Co}_3\text{Cl}_3$
      - id: d
        text: $\text{CoCl}$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Cobalt(III) means $\text{Co}^{3+}$. Chloride is $\text{Cl}^-$. It takes three $-1$ Chloride ions to balance one $+3$ Cobalt ion, resulting in $\text{CoCl}_3$.

  - id: type2-q06
    title: The Classical (Old) Naming System
    type: multipleChoice
    prompt: |
      Before the modern Stock system (Roman numerals), the classical system used "-ic" and "-ous" suffixes to indicate charge. In this system, what does the "-ous" suffix indicate?
    choices:
      - id: a
        text: It indicates the metal ion with the *lower* of the two common charges.
      - id: b
        text: It indicates the metal ion with the *higher* of the two common charges.
      - id: c
        text: It indicates that the compound is an acid.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** In the old system, "-ous" means the lower charge, and "-ic" means the higher charge. For example, Iron forms $+2$ and $+3$. $\text{Fe}^{2+}$ is ferrous, and $\text{Fe}^{3+}$ is ferric. (This is why Roman numerals are vastly preferred today!).

  - id: type2-q07
    title: Classical to Modern Translation
    type: multipleChoice
    prompt: |
      The compound "Cupric chloride" contains Copper in its higher common oxidation state ($+2$). What is the formula for Cupric chloride?
    choices:
      - id: a
        text: $\text{CuCl}_2$
      - id: b
        text: $\text{CuCl}$
      - id: c
        text: $\text{Cu}_2\text{Cl}$
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** "Cupric" means Copper(II), or $\text{Cu}^{2+}$. Chloride is $\text{Cl}^-$. To balance, you need two Chlorides: $\text{CuCl}_2$. ("Cuprous" would be Copper(I), $\text{CuCl}$).

  - id: type2-q08
    title: Manganese Complications
    type: numericResponse
    prompt: |
      Manganese (Mn) can take on many different charges. In the compound $\text{MnO}_2$, what is the Roman numeral that should be in the name Manganese(___) oxide?
    answer:
      value: 4
      tolerance: 0
    explanation: |
      Oxygen is $-2$. There are two Oxygens, so the total negative charge is $-4$. 
      Therefore, the single Manganese atom must be $+4$ to balance it. 
      The name is Manganese(IV) oxide. (Note: $\text{MnO}_2$ is NOT Manganese(II) dioxide!).

  - id: type2-q09
    title: Type II Metals Outside the D-Block
    type: multipleChoice
    prompt: |
      Which two heavy metals in the p-block (Group 14) behave as Type II metals, commonly forming both $+2$ and $+4$ ions?
    choices:
      - id: a
        text: Tin (Sn) and Lead (Pb)
      - id: b
        text: Carbon (C) and Silicon (Si)
      - id: c
        text: Aluminum (Al) and Gallium (Ga)
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Even though they are not transition metals, Tin and Lead are large, heavy metals that can lose just their two p-electrons ($+2$), or both their p and s electrons ($+4$). Thus, they require Roman numerals.

  - id: type2-q10
    title: Recognizing the Error
    type: multipleChoice
    prompt: |
      A student writes the name of $\text{Fe}_2\text{O}_3$ as "Iron(II) oxide". What did the student do wrong?
    choices:
      - id: a
        text: They assumed the subscript on the Iron atom (2) was its charge. The actual charge of Iron in this compound is $+3$.
      - id: b
        text: They used Roman numerals when Iron doesn't need them.
      - id: c
        text: They forgot to use the prefix "di-" for Iron.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** This is the most common error in nomenclature. The subscript tells you *how many* atoms there are, not their charge. Because three Oxygens provide a $-6$ total charge, the two Irons must provide a $+6$ total charge, meaning each Iron is $+3$. The correct name is Iron(III) oxide.
