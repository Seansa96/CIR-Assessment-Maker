schemaVersion: 1
id: chemistry-binary-ionic-type-ii-naming-quiz
title: Binary Ionic Compounds Type II Naming Quiz
assessmentType: quiz
categoryId: chemistry
subcategoryId: chemistry-measurements
subcategoryIds:
  - chemistry-compounds
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      What is the correct name for FeCl2?
    choices:
      - id: a
        text: iron(II) chloride
      - id: b
        text: iron(III) chloride
      - id: c
        text: iron dichloride
      - id: d
        text: iron chloride
    answer:
      choiceId: a
    explanation: |
      Each chloride is 1-. Two chlorides give a total charge of 2-, so iron must be Fe2+. The name is iron(II) chloride.

  - id: q002
    type: multipleChoice
    prompt: |
      What is the correct name for FeCl3?
    choices:
      - id: a
        text: iron(III) chloride
      - id: b
        text: iron(II) chloride
      - id: c
        text: iron trichloride
      - id: d
        text: ferric chlorine
    answer:
      choiceId: a
    explanation: |
      Three chloride ions give a total charge of 3-, so iron must be Fe3+. Type II names use Roman numerals to show the metal charge.

  - id: q003
    type: multipleChoice
    prompt: |
      What is the correct formula for copper(I) oxide?
    choices:
      - id: a
        text: Cu2O
      - id: b
        text: CuO
      - id: c
        text: CuO2
      - id: d
        text: Cu2O2
    answer:
      choiceId: a
    explanation: |
      Copper(I) is Cu+ and oxide is O2-. Two Cu+ ions are needed to balance one oxide ion, so the formula is Cu2O.

  - id: q004
    type: multipleChoice
    prompt: |
      What is the correct formula for copper(II) oxide?
    choices:
      - id: a
        text: CuO
      - id: b
        text: Cu2O
      - id: c
        text: CuO2
      - id: d
        text: Cu2O3
    answer:
      choiceId: a
    explanation: |
      Copper(II) is Cu2+ and oxide is O2-. The charges balance in a '1:1' ratio, giving CuO.

  - id: q005
    type: multipleChoice
    prompt: |
      What is the correct name for PbO2?
    choices:
      - id: a
        text: lead(IV) oxide
      - id: b
        text: lead(II) oxide
      - id: c
        text: lead dioxide
      - id: d
        text: lead oxide
    answer:
      choiceId: a
    explanation: |
      Each oxide is 2-. Two oxide ions give 4-, so lead must be Pb4+. The correct Type II name is lead(IV) oxide.

  - id: q006
    type: multipleChoice
    prompt: |
      What is the correct name for PbO?
    choices:
      - id: a
        text: lead(II) oxide
      - id: b
        text: lead(IV) oxide
      - id: c
        text: lead monoxide
      - id: d
        text: lead oxygen
    answer:
      choiceId: a
    explanation: |
      Oxide is 2-, so lead must be 2+ in PbO. The Roman numeral identifies the variable metal charge.

  - id: q007
    type: multipleChoice
    prompt: |
      What is the correct formula for tin(IV) chloride?
    choices:
      - id: a
        text: SnCl4
      - id: b
        text: SnCl2
      - id: c
        text: Sn4Cl
      - id: d
        text: Sn2Cl4
    answer:
      choiceId: a
    explanation: |
      Tin(IV) is Sn4+ and chloride is Cl-. Four chloride ions are needed to balance one tin(IV) ion, giving SnCl4.

  - id: q008
    type: multipleChoice
    prompt: |
      What is the correct formula for tin(II) sulfide?
    choices:
      - id: a
        text: SnS
      - id: b
        text: SnS2
      - id: c
        text: Sn2S
      - id: d
        text: Sn2S2
    answer:
      choiceId: a
    explanation: |
      Tin(II) is Sn2+ and sulfide is S2-. The charges balance in a '1:1' ratio, giving SnS.

  - id: q009
    type: multipleChoice
    prompt: |
      What is the correct name for CoBr2?
    choices:
      - id: a
        text: cobalt(II) bromide
      - id: b
        text: cobalt(III) bromide
      - id: c
        text: cobalt dibromide
      - id: d
        text: cobalt bromine
    answer:
      choiceId: a
    explanation: |
      Bromide is 1-. Two bromide ions give 2-, so cobalt is Co2+. The name is cobalt(II) bromide.

  - id: q010
    type: multipleChoice
    prompt: |
      What is the correct name for Co2O3?
    choices:
      - id: a
        text: cobalt(III) oxide
      - id: b
        text: cobalt(II) oxide
      - id: c
        text: dicobalt trioxide
      - id: d
        text: cobalt oxide
    answer:
      choiceId: a
    explanation: |
      Three oxide ions give 6-. The two cobalt ions must total 6+, so each cobalt is 3+. The name is cobalt(III) oxide.

  - id: q011
    type: multipleChoice
    prompt: |
      What is the correct formula for chromium(III) nitride?
    choices:
      - id: a
        text: CrN
      - id: b
        text: Cr3N
      - id: c
        text: CrN3
      - id: d
        text: Cr2N3
    answer:
      choiceId: a
    explanation: |
      Chromium(III) is Cr3+ and nitride is N3-. The charges balance in a '1:1' ratio, giving CrN.

  - id: q012
    type: multipleChoice
    prompt: |
      What is the correct name for MnO2?
    choices:
      - id: a
        text: manganese(IV) oxide
      - id: b
        text: manganese(II) oxide
      - id: c
        text: manganese dioxide
      - id: d
        text: manganese oxide
    answer:
      choiceId: a
    explanation: |
      Two oxide ions total 4-, so manganese must be Mn4+. Binary ionic Type II naming uses manganese(IV) oxide.

  - id: q013
    type: multipleChoice
    prompt: |
      What is the correct formula for nickel(II) phosphide?
    choices:
      - id: a
        text: Ni3P2
      - id: b
        text: Ni2P3
      - id: c
        text: NiP
      - id: d
        text: NiP2
    answer:
      choiceId: a
    explanation: |
      Nickel(II) is Ni2+ and phosphide is P3-. Three nickel ions give 6+ and two phosphide ions give 6-, so the formula is Ni3P2.

  - id: q014
    type: multipleChoice
    prompt: |
      What is the correct name for Hg2S?
    choices:
      - id: a
        text: mercury(I) sulfide
      - id: b
        text: mercury(II) sulfide
      - id: c
        text: dimercury sulfide
      - id: d
        text: mercury sulfur
    answer:
      choiceId: a
    explanation: |
      Sulfide is 2-. The cation here is the mercury(I) dimer, Hg2 2+, so the compound is mercury(I) sulfide. This is a common special Type II pattern.

  - id: q015
    type: multipleChoice
    prompt: |
      What is the correct formula for iron(III) sulfide?
    choices:
      - id: a
        text: Fe2S3
      - id: b
        text: FeS
      - id: c
        text: Fe3S2
      - id: d
        text: FeS3
    answer:
      choiceId: a
    explanation: |
      Iron(III) is Fe3+ and sulfide is S2-. Two iron(III) ions total 6+ and three sulfide ions total 6-, giving Fe2S3.


