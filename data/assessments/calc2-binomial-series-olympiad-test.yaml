    difficultyDimensions: [representationTransfer, auxiliaryTechnique, proofJustification, reverseReasoning, simplification]
    subjectDifficultyTags: [roots-of-unity-symmetry]
    difficultyEvidence: Exploits even-power symmetry rather than expanding a high-degree polynomial.
    prerequisiteObjectiveIds: [binomial-coefficients, polynomial-symmetry]
    extensionObjectiveIds: [generating-functions]
    issueSignals: [{ id: expression-equation-recognition-error }, { id: algebraic-simplification-error }]
    prompt: What is the coefficient of $x^7$ in $(1+x)^{10}(1-x)^{10}$?
    answer: { expectedLatex: '0', equivalenceMode: expression, variables: [x], tolerance: 0 }
    explanation: |
      Solution: $(1+x)^{10}(1-x)^{10}=(1-x^2)^{10}$ contains only even powers, so the $x^7$ coefficient is $0$.

      Why it works: Pairing conjugate binomials converts the expression into a polynomial in $x^2$.


      Prerequisites: Recognize difference-of-squares structure and binomial coefficients.

      Further study: Generalize parity arguments using roots of unity filters.
