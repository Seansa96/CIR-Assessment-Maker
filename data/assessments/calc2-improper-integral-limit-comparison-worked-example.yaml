workedExamples:
- id: we001
  title: Separate tail behavior from local behavior
  problem: |
    Determine whether

    $$
    \int_1^{\infty}\frac{\sqrt{x^2+4}}{x^3+1}\,dx
    $$

    converges.
  steps:
  - id: imp-limit-s001
    title: Identify the improper feature
    instruction: |
      The interval extends to infinity, so this is a Type 1 improper integral.
    type: multipleChoice
    prompt: |
      What causes the integral to be improper?
    choices:
    - id: a
      text: Infinite interval
    - id: b
      text: Division by zero at $x=1$
    - id: c
      text: Trigonometric substitution
    - id: d
      text: Jump discontinuity
    answer:
      choiceId: a
    explanation: |
      The upper limit is infinite; there is no singularity at $x=1$.
  - id: imp-limit-s002
    title: Find the tail model
    instruction: |
      For large $x$, the numerator behaves like $x$ and the denominator like $x^3$.
    type: multipleChoice
    prompt: |
      Which p-integral should be compared?
    choices:
    - id: a
      text: $\int_1^\infty \frac{1}{x}\,dx$
    - id: b
      text: $\int_1^\infty \frac{1}{x^2}\,dx$
    - id: c
      text: $\int_1^\infty x^2\,dx$
    - id: d
      text: $\int_1^\infty 1\,dx$
    answer:
      choiceId: b
    explanation: |
      The integrand behaves like $1/x^2$, and $p=2>1$ converges.
  - id: imp-limit-s003
    title: Transfer the result
    instruction: |
      A positive finite limit comparison with $1/x^2$ transfers convergence.
    type: multipleChoice
    prompt: |
      What is the conclusion?
    choices:
    - id: a
      text: The integral converges
    - id: b
      text: The integral diverges
    - id: c
      text: The test is inconclusive
    - id: d
      text: The integrand must be negative
    answer:
      choiceId: a
    explanation: |
      The original integral converges because its tail is comparable to a convergent p-integral.
  - id: imp-limit-s004
    title: Write the reasoning
    instruction: |
      A good explanation identifies the improper type, the model, and the threshold.
    type: freeResponse
    prompt: |
      Explain the convergence decision.
    answer:
      expected: |
        As $x\to\infty$, $\sqrt{x^2+4}/(x^3+1)\sim x/x^3=1/x^2$. Limit comparison with $\int_1^\infty x^{-2}\,dx$ shows the integral converges.
      gradingMode: selfCheck
      keyPoints:
      - Identifies Type 1 tail
      - Finds $1/x^2$ behavior
      - Uses p-integral threshold
      - States convergence
    explanation: |
      Related topic: improper integral comparison.
