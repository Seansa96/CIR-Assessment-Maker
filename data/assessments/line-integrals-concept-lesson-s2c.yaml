lesson:
  introduction: This topic is part of a recommended Calc 3 route, not a gate. You may begin here directly; refresh Calculus 3 -> Vector-Valued Functions if the prerequisite representation is unfamiliar.
  sections:
  - id: s01
    title: Accumulate along a curve
    required: true
    content: 'A scalar line integral adds scalar values weighted by small arc lengths. In Line Integrals, begin by naming the mathematical object before calculating: a point, vector, curve, surface, field, or region. The notation determines which quantities may vary and what an answer represents. That first classification prevents applying a correct formula to the wrong geometric object.'
    media:
    - type: image
      src: /media/calculus-3/line-integrals.svg
      alt: Original line integrals reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What geometric object is integrated over in a line integral?
      choices:
      - id: a
        text: a curve
        media: []
        issueSignals: []
      - id: b
        text: arc length element (answers 'What does ds represent?', not 'What geometric object is integrated over in a line integral?')
        media: []
        issueSignals:
        - id: line-integral-parameterization-error
          domains: []
      - id: c
        text: r prime of t dt (answers 'What is dr for r(t)?', not 'What geometric object is integrated over in a line integral?')
        media: []
        issueSignals:
        - id: line-integral-parameterization-error
          domains: []
      - id: d
        text: work (answers 'What can a vector line integral represent?', not 'What geometric object is integrated over in a line integral?')
        media: []
        issueSignals:
        - id: line-integral-parameterization-error
          domains: []
      answer:
        choiceId: a
