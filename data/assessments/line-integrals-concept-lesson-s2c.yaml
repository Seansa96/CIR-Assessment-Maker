  - id: s03
    title: Orientation can matter
    required: true
    content: Reversing a vector line integral reverses its sign, while scalar mass integrals do not. Draw or mentally trace the representation before simplifying. Ask what remains fixed, what changes, and which direction is positive. This check is especially useful when a sign, a normal vector, a parameter order, or an integration limit can change the numerical value or the meaning of the result.
