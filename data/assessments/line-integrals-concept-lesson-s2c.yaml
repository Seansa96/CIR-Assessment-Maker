  - id: s02
    title: Parameterization supplies motion
    required: true
    content: A vector line integral uses a curve parameterization and its derivative. Keep the symbols and their roles visible as you work. A reliable setup records the independent variables, the dependent quantity, and any orientation or bounds. In particular, do not replace a geometric description with a memorized expression until every component of the expression has a meaning.
