questions:
  - id: bonds-test-q01
    title: Predicting Bond Type from Electronegativity
    type: multipleChoice
    prompt: |
      Two atoms form a bond. The electronegativity difference between them is $\Delta\text{EN} = 1.9$. Based on the general rule ($\Delta\text{EN} < 0.5$: nonpolar covalent; $0.5 \leq \Delta\text{EN} < 1.7$: polar covalent; $\Delta\text{EN} \geq 1.7$: ionic), what type of bond is expected?
    choices:
      - id: a
        text: Nonpolar covalent — the electrons are shared equally.
      - id: b
        text: Polar covalent — the electrons are shared unequally but not transferred.
      - id: c
        text: Ionic — the large electronegativity difference causes electron transfer, forming ions.
      - id: d
        text: Metallic — the electrons form a sea shared across many atoms.
    answer:

      choiceId: c
    explanation: |
      With $\Delta\text{EN} = 1.9 \geq 1.7$, the bond is classified as **ionic**. The more electronegative atom pulls the electron(s) completely enough to form distinct cations and anions. Example: Na (EN 0.93) and Cl (EN 3.16), $\Delta\text{EN} = 2.23$.

  - id: bonds-test-q02
    title: Lewis Structure — Count of Lone Pairs on Oxygen
    type: numericResponse
    prompt: |
      In a water molecule ($\text{H}_2\text{O}$), oxygen forms two single bonds with hydrogen atoms. How many **lone pairs** does the oxygen atom have in the Lewis structure?

      *(Oxygen has 6 valence electrons; each bond uses one of oxygen's electrons.)*
    answer:
      value: 2.0
      tolerance: 0.1
    explanation: |
      Oxygen has 6 valence electrons. It forms 2 bonds (using 2 electrons). Remaining electrons: $6 - 2 = 4$, arranged as **2 lone pairs**.

      The 2 bonds + 2 lone pairs give oxygen 4 electron groups, consistent with $sp^3$ hybridization and a bent molecular geometry.

  - id: bonds-test-q03
    title: VSEPR Geometry — Tetrahedral
    type: multipleChoice
    prompt: |
      Methane ($\text{CH}_4$) has a central carbon atom bonded to four hydrogen atoms with no lone pairs on carbon. According to VSEPR theory, what is the molecular geometry of methane?
    choices:
      - id: a
        text: 'Square planar — four atoms arranged in a flat square around the center.'
      - id: b
        text: 'Trigonal planar — three atoms in a triangle with one above.'
      - id: c
        text: 'Tetrahedral — four atoms at the corners of a tetrahedron, with bond angles of approximately 109.5°.'
      - id: d
        text: 'Linear — all atoms in a straight line.'
    answer:

      choiceId: c
    explanation: |
      With 4 bonding pairs and 0 lone pairs (electron geometry = tetrahedral), the **molecular geometry is also tetrahedral**. The four H atoms point to the corners of a regular tetrahedron, maximizing separation between electron pairs. Bond angle: $109.5°$.

  - id: bonds-test-q04
    title: VSEPR — Effect of Lone Pairs on Geometry
    type: multipleChoice
    prompt: |
      Ammonia ($\text{NH}_3$) has a central nitrogen with 3 bonding pairs and **1 lone pair**. Compared to methane ($\text{CH}_4$, which has 4 bonding pairs and 0 lone pairs with a $109.5°$ bond angle), what is the molecular geometry of ammonia and how does its H–N–H bond angle compare?
    choices:
      - id: a
        text: 'Trigonal planar with a $120°$ bond angle — lone pairs spread the bonds farther apart.'
      - id: b
        text: 'Tetrahedral with a $109.5°$ bond angle — lone pairs have no effect on molecular shape.'
      - id: c
        text: 'Trigonal pyramidal with a bond angle less than $109.5°$ (approximately $107°$) — the lone pair occupies more space than a bonding pair, compressing the H–N–H angle.'
      - id: d
        text: 'Linear with a $180°$ bond angle — lone pairs repel all bonding pairs to opposite sides.'
    answer:

      choiceId: c
    explanation: |
      Lone pairs occupy more angular space than bonding pairs (no nucleus pulling them in). This lone pair–bonding pair repulsion is **greater** than bonding pair–bonding pair repulsion, compressing the H–N–H bond angle from the ideal $109.5°$ to approximately $107°$. The molecular geometry is **trigonal pyramidal** — the nitrogen sits atop a triangular base of hydrogen atoms.

  - id: bonds-test-q05
    title: Naming Ionic Compounds — Type I
    type: freeResponse
    prompt: |
      Name the following ionic compounds (Type I — the metal has a fixed charge):
      1. $\text{NaCl}$
      2. $\text{MgO}$
      3. $\text{Al}_2\text{O}_3$
      4. $\text{K}_3\text{N}$
    answer:
      gradingMode: selfCheck
      keyPoints:
        - 'NaCl: sodium chloride (sodium ion Na+, chloride ion Cl-)'
        - 'MgO: magnesium oxide (Mg2+, O2-)'
        - 'Al2O3: aluminum oxide (Al3+, O2-)'
        - 'K3N: potassium nitride (K+, N3-)'
    explanation: |
      Type I ionic compound naming rules:
      1. Name the **cation** (metal) first with its element name unchanged.
      2. Name the **anion** (nonmetal) second, changing the ending to **-ide**.

      Results: sodium chloride, magnesium oxide, aluminum oxide, potassium nitride.

  - id: bonds-test-q06
    title: Naming Transition Metal Compounds — Type II
    type: multipleChoice
    prompt: |
      What is the correct IUPAC name for $\text{FeCl}_3$? (Iron is a transition metal with variable charge.)
    choices:
      - id: a
        text: 'Iron chloride — transition metals always use just the element name.'
      - id: b
        text: 'Iron(III) chloride — the Roman numeral indicates the iron ion''s charge is +3, determined by balancing with three Cl⁻ ions.'
      - id: c
        text: 'Iron trichloride — use Greek prefixes to count the nonmetal atoms.'
      - id: d
        text: 'Ferric chloride only — IUPAC does not use Roman numerals.'
    answer:

      choiceId: b
    explanation: |
      $\text{FeCl}_3$: three Cl⁻ ions give a total anionic charge of $-3$. Iron must be $\text{Fe}^{3+}$ to balance. The name is **iron(III) chloride**.

      The Roman numeral is required for Type II (transition metal) compounds because the metal's charge is not fixed. The older system uses prefixes like "ferric" for Fe³⁺ and "ferrous" for Fe²⁺, but IUPAC Roman numeral notation is preferred.

  - id: bonds-test-q07
    title: Writing Formulas from Ionic Names
    type: freeResponse
    prompt: |
      Write the correct chemical formula for each compound:
      1. Calcium phosphate
      2. Aluminum sulfate
      3. Copper(II) nitrate
      4. Iron(III) oxide
    answer:
      gradingMode: selfCheck
      keyPoints:
        - 'Calcium phosphate: Ca3(PO4)2 — Ca2+ and PO43-, cross-multiply charges: 3 Ca and 2 phosphate'
        - 'Aluminum sulfate: Al2(SO4)3 — Al3+ and SO42-'
        - 'Copper(II) nitrate: Cu(NO3)2 — Cu2+ and NO3-'
        - 'Iron(III) oxide: Fe2O3 — Fe3+ and O2-'
    explanation: |
      The cross-charge method: the numerical value of each ion's charge becomes the subscript of the other ion.

      - $\text{Ca}^{2+}$ and $\text{PO}_4^{3-}$: $\text{Ca}_3(\text{PO}_4)_2$
      - $\text{Al}^{3+}$ and $\text{SO}_4^{2-}$: $\text{Al}_2(\text{SO}_4)_3$
      - $\text{Cu}^{2+}$ and $\text{NO}_3^-$: $\text{Cu}(\text{NO}_3)_2$
      - $\text{Fe}^{3+}$ and $\text{O}^{2-}$: $\text{Fe}_2\text{O}_3$

  - id: bonds-test-q08
    title: Molecular Compounds — Greek Prefix Naming
    type: multipleChoice
    prompt: |
      What is the correct name for $\text{N}_2\text{O}_5$?
    choices:
      - id: a
        text: Nitrogen oxide
      - id: b
        text: Dinitrogen pentoxide
      - id: c
        text: Nitrogen(V) oxide
      - id: d
        text: Nitrous oxide
    answer:

      choiceId: b
    explanation: |
      For molecular (covalent) compounds, use Greek prefixes: mono-, di-, tri-, tetra-, penta-, hexa-...

      $\text{N}_2\text{O}_5$: 2 nitrogen → **di**nitrogen; 5 oxygen → **pent**oxide (drop the 'a' before a vowel).

      **Dinitrogen pentoxide.**

      Note: "mono-" is omitted for the first element but used for the second (e.g., CO = carbon **mono**oxide, not monocarbon oxide).

  - id: bonds-test-q09
    title: Molecular Polarity
    type: multipleChoice
    prompt: |
      Carbon dioxide ($\text{CO}_2$) has **polar** C=O bonds (oxygen is more electronegative than carbon), yet $\text{CO}_2$ is a **nonpolar molecule**. Which explanation is correct?
    choices:
      - id: a
        text: The C=O bonds are actually nonpolar because carbon and oxygen have similar electronegativities.
      - id: b
        text: The molecule is nonpolar because it is linear — the two equal and opposite C=O bond dipoles point in exactly opposite directions and cancel each other, giving a net dipole moment of zero.
      - id: c
        text: The molecule is nonpolar because it has no lone pairs on carbon.
      - id: d
        text: The molecule is nonpolar because oxygen atoms on both sides make the charges balance by mass.
    answer:

      choiceId: b
    explanation: |
      $\text{CO}_2$ is **linear** (two C=O bonds at 180°). Each C=O bond is polar (dipole pointing toward O), but the two dipoles are exactly opposite in direction and cancel vectorially → **net dipole = 0 → nonpolar molecule**.

      Compare to water ($\text{H}_2\text{O}$): also has equal O–H bond dipoles, but the **bent** geometry means they do NOT cancel → net dipole ≠ 0 → **polar molecule**.

      Key lesson: polar bonds don't guarantee a polar molecule — molecular geometry matters.

  - id: bonds-test-q10
    title: Intermolecular Forces and Boiling Point
    type: multipleChoice
    prompt: |
      Rank the following substances from **lowest to highest** normal boiling point: $\text{CH}_4$, $\text{HF}$, $\text{H}_2\text{O}$, $\text{HCl}$.
    choices:
      - id: a
        text: '$\text{CH}_4 < \text{HCl} < \text{HF} < \text{H}_2\text{O}$'
      - id: b
        text: '$\text{H}_2\text{O} < \text{HF} < \text{HCl} < \text{CH}_4}$'
      - id: c
        text: '$\text{HCl} < \text{CH}_4 < \text{HF} < \text{H}_2\text{O}$'
      - id: d
        text: '$\text{CH}_4 < \text{H}_2\text{O} < \text{HF} < \text{HCl}$'
    answer:

      choiceId: a
    explanation: |
      Boiling points depend on the strength of intermolecular forces (IMF):
      - $\text{CH}_4$: only **London dispersion** forces (weakest, small nonpolar molecule) → $\text{bp} = -161°\text{C}$
      - $\text{HCl}$: **dipole-dipole** + London dispersion → $\text{bp} = -85°\text{C}$
      - $\text{HF}$: **hydrogen bonding** (F is highly electronegative) → $\text{bp} = +19.5°\text{C}$
      - $\text{H}_2\text{O}$: **hydrogen bonding** (2 H-bond donors + 2 acceptors per molecule, more extensive network) → $\text{bp} = 100°\text{C}$

      Order: $\text{CH}_4 < \text{HCl} < \text{HF} < \text{H}_2\text{O}$.

  - id: bonds-test-q11
    title: Lewis Structure — Formal Charge
    type: numericResponse
    prompt: |
      In the Lewis structure of carbon monoxide ($\text{CO}$), carbon and oxygen are connected by a **triple bond**. Carbon has 2 non-bonding electrons; oxygen has 2 non-bonding electrons.

      Using the formula: $\text{Formal charge} = (\text{valence e}^-) - (\text{lone pair e}^-) - \dfrac{1}{2}(\text{bonding e}^-)$

      What is the formal charge on **carbon** in CO?
    answer:
      value: -1.0
      tolerance: 0.1
    explanation: |
      Carbon has 4 valence electrons. In CO with a triple bond:
      - Lone pair electrons on C: 2
      - Bonding electrons shared with C: 6 (triple bond × 2 electrons per side... actually triple bond = 6 total, so 3 each)

      $$\text{FC}_\text{C} = 4 - 2 - \frac{1}{2}(6) = 4 - 2 - 3 = -1$$

      Oxygen's formal charge: $6 - 2 - 3 = +1$. The molecule has an overall neutral charge but internal charge separation, making CO a reactive and toxic molecule.

  - id: bonds-test-q12
    title: Hybridization and Geometry
    type: multipleChoice
    prompt: |
      A molecule has a central atom with **3 electron groups** (2 bonding pairs and 1 lone pair) around it. What is its hybridization and molecular geometry?
    choices:
      - id: a
        text: '$sp^3$ hybridization, tetrahedral molecular geometry'
      - id: b
        text: '$sp^2$ hybridization, trigonal planar molecular geometry'
      - id: c
        text: '$sp^2$ hybridization, **bent** molecular geometry'
      - id: d
        text: '$sp$ hybridization, linear molecular geometry'
    answer:

      choiceId: c
    explanation: |
      **3 electron groups** → $sp^2$ hybridization (electron geometry = trigonal planar).

      But with 1 lone pair and 2 bonding pairs, the **molecular geometry** (considering only atom positions) is **bent** (or V-shaped).

      Example: $\text{SO}_2$ or $\text{O}_3$ — the central atom is $sp^2$ hybridized, but the molecule looks bent because the lone pair occupies one of the three corners of the trigonal planar arrangement.

  - id: bonds-test-q13
    title: Bond Order and Bond Length
    type: multipleChoice
    prompt: |
      Rank the following C–C bonds from **shortest to longest**:
      - The C–C bond in ethane ($\text{C}_2\text{H}_6$, single bond)
      - The C=C bond in ethylene ($\text{C}_2\text{H}_4$, double bond)
      - The C≡C bond in acetylene ($\text{C}_2\text{H}_2$, triple bond)
    choices:
      - id: a
        text: 'Single < double < triple (single bonds are shortest)'
      - id: b
        text: 'Triple < double < single (triple bonds are shortest)'
      - id: c
        text: 'All C–C bonds are the same length regardless of bond order.'
      - id: d
        text: 'Double < single < triple (double bonds are shortest due to pi bond compression)'
    answer:

      choiceId: b
    explanation: |
      Higher bond order = more electron density between atoms = stronger and **shorter** bond.

      Approximate C–C bond lengths:
      - Single bond (ethane): ~154 pm
      - Double bond (ethylene): ~134 pm
      - Triple bond (acetylene): ~120 pm

      This trend generalizes: higher bond order always gives a shorter, stronger bond.

  - id: bonds-test-q14
    title: Resonance Structures
    type: multipleChoice
    prompt: |
      The nitrate ion ($\text{NO}_3^-$) has three equivalent resonance structures, each showing one N=O double bond and two N–O single bonds. What does resonance tell us about the actual N–O bonds in the nitrate ion?
    choices:
      - id: a
        text: 'The three N–O bonds alternate rapidly between single and double bonds.'
      - id: b
        text: 'The actual bond order is fractional — all three N–O bonds are equivalent with bond order 4/3, intermediate between single and double bond length.'
      - id: c
        text: 'Only the double bond exists; the other two single bonds are just showing alternatives.'
      - id: d
        text: 'Resonance means the molecule is unstable because it cannot choose one structure.'
    answer:

      choiceId: b
    explanation: |
      Resonance structures are a **human notation limitation** — the actual molecule is not switching between structures. The true electron distribution is the **average (hybrid) of all resonance contributors**.

      In $\text{NO}_3^-$: 4 bonds shared among 3 positions → bond order = $4/3 \approx 1.33$ per N–O bond. Experimentally, all three N–O bonds are the same length (~124 pm), between a single bond (~140 pm) and a double bond (~115 pm).

  - id: bonds-test-q15
    title: Lattice Energy and Ionic Compound Stability
    type: multipleChoice
    prompt: |
      Which of the following ionic compounds would you expect to have the **highest lattice energy** (most energy released when gas-phase ions form the solid)?
    choices:
      - id: a
        text: 'NaCl — sodium chloride, with $+1$ and $-1$ ions.'
      - id: b
        text: 'MgO — magnesium oxide, with $+2$ and $-2$ ions that are also smaller than Cs and I.'
      - id: c
        text: 'CsI — cesium iodide, with $+1$ and $-1$ ions that are large.'
      - id: d
        text: 'KBr — potassium bromide, with $+1$ and $-1$ ions of intermediate size.'
    answer:

      choiceId: b
    explanation: |
      Lattice energy is proportional to $\dfrac{|q_+||q_-|}{r_+ + r_-}$ (Coulomb's law).

      - **Higher charges** → stronger attraction → higher lattice energy.
      - **Smaller ions** → shorter distance → stronger attraction → higher lattice energy.

      MgO has $2+ \times 2- = 4$ charge product vs. $1+ \times 1- = 1$ for NaCl, KBr, and CsI. Additionally, Mg²⁺ and O²⁻ are smaller ions than K⁺/Br⁻ or Cs⁺/I⁻. MgO has by far the highest lattice energy (~3795 kJ/mol vs. ~787 kJ/mol for NaCl).

  - id: bonds-test-q16
    title: Polyatomic Ion — Sulfate
    type: freeResponse
    prompt: |
      The sulfate ion has the formula $\text{SO}_4^{2-}$. Write the correct formula for the compounds formed between:
      1. Calcium and sulfate
      2. Iron(III) and sulfate
      3. Ammonium and sulfate

      Show your charge balancing.
    answer:
      gradingMode: selfCheck
      keyPoints:
        - 'Calcium sulfate: Ca2+ and SO42- -> CaSO4 (charges 2+ and 2- balance with 1:1 ratio)'
        - 'Iron(III) sulfate: Fe3+ and SO42- -> Fe2(SO4)3 (2 x 3+ = 6+ matches 3 x 2- = 6-)'
        - 'Ammonium sulfate: NH4+ and SO42- -> (NH4)2SO4 (2 x 1+ balances 1 x 2-)'
    explanation: |
      - $\text{Ca}^{2+} + \text{SO}_4^{2-}$: charges balance 1:1 → $\text{CaSO}_4$ (calcium sulfate)
      - $\text{Fe}^{3+} + \text{SO}_4^{2-}$: need 2 Fe³⁺ and 3 SO₄²⁻ → $\text{Fe}_2(\text{SO}_4)_3$ (iron(III) sulfate)
      - $\text{NH}_4^+ + \text{SO}_4^{2-}$: need 2 ammonium → $(\text{NH}_4)_2\text{SO}_4$ (ammonium sulfate)

  - id: bonds-test-q17
    title: Electronegativity and Dipole Direction
    type: multipleChoice
    prompt: |
      In a H–F bond, which atom is the **negative** end of the dipole, and why?
    choices:
      - id: a
        text: 'Hydrogen — it has only one proton so it "pulls" less on electrons.'
      - id: b
        text: 'Fluorine — it has a much higher electronegativity (EN = 4.0 vs. H = 2.1) and pulls the shared electrons much closer to itself, creating a partial negative charge ($\delta^-$) on F and partial positive charge ($\delta^+$) on H.'
      - id: c
        text: 'Hydrogen — it is at the positive pole because it is the smaller atom.'
      - id: d
        text: 'Neither — single bonds do not create dipoles.'
    answer:

      choiceId: b
    explanation: |
      Electronegativity measures how strongly an atom attracts bonding electrons. Fluorine is the most electronegative element (EN = 4.0); hydrogen has EN = 2.1. In H–F, the shared electrons spend significantly more time near F, creating:
      - $\delta^-$ on F (excess electron density)
      - $\delta^+$ on H (depleted electron density)

      The dipole arrow points from $\delta^+$ to $\delta^-$ (toward F). HF has the largest bond dipole of any diatomic hydrogen halide.

  - id: bonds-test-q18
    title: Acid Naming — Binary Acids
    type: freeResponse
    prompt: |
      Name the following binary acids (acids dissolved in water):
      1. $\text{HCl}(aq)$
      2. $\text{H}_2\text{S}(aq)$
      3. $\text{HBr}(aq)$
    answer:
      gradingMode: selfCheck
      keyPoints:
        - 'HCl(aq): hydrochloric acid (hydro- prefix + chlor- + -ic acid)'
        - 'H2S(aq): hydrosulfuric acid'
        - 'HBr(aq): hydrobromic acid'
    explanation: |
      Binary acid naming: **hydro-** + (element stem) + **-ic acid**.

      - $\text{HCl}(aq)$: hydro**chlor**ic acid
      - $\text{H}_2\text{S}(aq)$: hydro**sulfur**ic acid
      - $\text{HBr}(aq)$: hydro**brom**ic acid

      Note: pure HCl gas is called "hydrogen chloride" — it becomes "hydrochloric acid" when dissolved in water.

  - id: bonds-test-q19
    title: Number of Sigma and Pi Bonds
    type: numericResponse
    prompt: |
      In a molecule of acetylene ($\text{H–C≡C–H}$), how many **pi ($\pi$) bonds** are present?
    answer:
      value: 2.0
      tolerance: 0.1
    explanation: |
      A triple bond consists of **one sigma ($\sigma$) bond** and **two pi ($\pi$) bonds**.

      Acetylene has: 2 H–C single bonds (both $\sigma$) + 1 C≡C triple bond ($1\sigma + 2\pi$).

      Total: 4 sigma bonds, **2 pi bonds**.

      Pi bonds form from sideways overlap of $p$ orbitals; sigma bonds from head-on overlap. Rotation around a triple bond is possible (unlike double bonds), but the cylindrical symmetry of two pi bonds makes the geometry linear.

  - id: bonds-test-q20
    title: Covalent vs. Ionic Properties
    type: multipleChoice
    prompt: |
      Which of the following is a property **unique to ionic compounds** (as compared to typical covalent molecular compounds)?
    choices:
      - id: a
        text: 'They can form crystals.'
      - id: b
        text: 'They conduct electricity when dissolved in water or melted, because the ions are free to move and carry charge.'
      - id: c
        text: 'They can be solid at room temperature.'
      - id: d
        text: 'They consist of atoms held together by electrostatic forces.'
    answer:

      choiceId: b
    explanation: |
      The defining distinction: **ionic compounds conduct electricity in solution or when molten** because the ions dissociate and become mobile charge carriers.

      Covalent compounds generally do NOT conduct electricity even when dissolved (they form neutral molecules, not ions) — with exceptions for acids that ionize in water.

      Both ionic and covalent compounds can form solids and crystals, and both involve electrostatic interactions (though of different types).
