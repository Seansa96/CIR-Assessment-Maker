questions:
- id: q001
  title: Apply Security goals
  type: multipleChoice
  prompt: A system design discussion mentions **Security goals**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Security is not only secrecy.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Security is not only secrecy. This is why Security goals matters in Operating System Security.
