schemaVersion: 1
id: calc2-rational-integration-quiz
title: Rational Integration Strategy Quiz
assessmentType: quiz
categoryId: calculus-2
subcategoryIds:
  - integration-techniques
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: 'Before integrating $\frac{x^3+1}{x^2-1}$, what should you do first?'
    choices:
      - id: a
        text: 'Polynomial long division'
      - id: b
        text: 'Power reduction'
      - id: c
        text: 'Trigonometric substitution'
      - id: d
        text: 'Integration by parts'
    answer:
      choiceId: a
    explanation: |
      The numerator degree is higher than the denominator degree, so the exact technique is polynomial long division before any partial fraction work.

  - id: q002
    type: multipleChoice
    prompt: 'Which template matches $\frac{5x+1}{(x-2)(x+4)}$?'
    choices:
      - id: a
        text: '$\frac{A}{x-2}+\frac{B}{x+4}$'
      - id: b
        text: '$\frac{Ax+B}{(x-2)(x+4)}$'
      - id: c
        text: '$A(x-2)+B(x+4)$'
      - id: d
        text: '$\frac{A}{(x-2)^2}+\frac{B}{(x+4)^2}$'
    answer:
      choiceId: a
    explanation: |
      The denominator has distinct linear factors, so the exact technique is partial fractions with one constant numerator over each factor.

  - id: q003
    type: multipleChoice
    prompt: 'What technique is most appropriate for $\int \frac{1}{x^2+6x+13}\,dx$?'
    choices:
      - id: a
        text: 'Complete the square and use an arctangent form'
      - id: b
        text: 'Use odd sine power identities'
      - id: c
        text: 'Use integration by parts'
      - id: d
        text: 'Use direct logarithm only'
    answer:
      choiceId: a
    explanation: |
      $x^2+6x+13=(x+3)^2+4$, so the exact technique is completing the square followed by the arctangent rational integral pattern.

  - id: q004
    type: multipleChoice
    prompt: 'What is $\int \frac{3}{x-5}\,dx$?'
    choices:
      - id: a
        text: '$3\ln|x-5|+C$'
      - id: b
        text: '$\ln|3x-5|+C$'
      - id: c
        text: '$\frac{3}{2}(x-5)^2+C$'
      - id: d
        text: '$-\frac{3}{(x-5)^2}+C$'
    answer:
      choiceId: a
    explanation: |
      This is already a simple linear denominator. The exact technique is the logarithmic antiderivative $\int \frac{1}{x-a}\,dx=\ln|x-a|+C$.

  - id: q005
    type: multipleChoice
    prompt: 'Which setup is correct for $\frac{4x+7}{(x+1)^2(x-3)}$?'
    choices:
      - id: a
        text: '$\frac{A}{x+1}+\frac{B}{(x+1)^2}+\frac{C}{x-3}$'
      - id: b
        text: '$\frac{A}{(x+1)^2}+\frac{B}{x-3}$ only'
      - id: c
        text: '$\frac{Ax+B}{(x+1)^2}+\frac{C}{x-3}$'
      - id: d
        text: '$A(x+1)^2+C(x-3)$'
    answer:
      choiceId: a
    explanation: |
      Repeated linear factors require every power up to the repeated power. The exact technique is partial fractions for repeated linear factors.

  - id: q006
    type: multipleChoice
    prompt: 'Which result matches $\int \frac{2x}{x^2+9}\,dx$?'
    choices:
      - id: a
        text: '$\ln(x^2+9)+C$'
      - id: b
        text: '$\frac{1}{3}\arctan\left(\frac{x}{3}\right)+C$'
      - id: c
        text: '$2\ln|x|+C$'
      - id: d
        text: '$x^2\ln 9+C$'
    answer:
      choiceId: a
    explanation: |
      The numerator is the derivative of the denominator, so the exact technique is direct $u$-substitution with $u=x^2+9$.

  - id: q007
    type: multipleChoice
    prompt: 'What is the best first step for $\int \frac{x+1}{x^2-4}\,dx$?'
    choices:
      - id: a
        text: 'Factor the denominator as $(x-2)(x+2)$ and use partial fractions.'
      - id: b
        text: 'Complete the square and use arctangent.'
      - id: c
        text: 'Use power-reduction identities.'
      - id: d
        text: 'Use integration by parts with $u=x+1$.'
    answer:
      choiceId: a
    explanation: |
      The denominator factors into distinct linear terms, so the exact technique is partial fraction decomposition.

  - id: q008
    type: multipleChoice
    prompt: "Which denominator should produce an arctangent term rather than only logarithms?"
    choices:
      - id: a
        text: '$x^2+4$'
      - id: b
        text: '$x^2-4$'
      - id: c
        text: '$(x-4)(x+1)$'
      - id: d
        text: '$(x-2)^2$'
    answer:
      choiceId: a
    explanation: |
      $x^2+4$ is an irreducible quadratic over the reals and matches $x^2+a^2$. The exact technique is arctangent rational integration.

