id: calc2-rational-integration-quiz
title: Rational Integration Strategy Quiz
assessmentType: quiz
categoryId: calculus-2
subcategoryId: u-sub-integration
subcategoryIds:
  - integration-techniques
modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which antiderivative matches?

      $$
      \int \frac{x+5}{x^2+6x+13}\,dx
      $$
    choices:
      - id: a
        text: '$\frac{1}{2}\ln(x^2+6x+13)+\arctan\left(\frac{x+3}{2}\right)+C$'
      - id: b
        text: '$\ln|x+5|+\arctan(x+3)+C$'
      - id: c
        text: '$\frac{1}{2}\ln(x^2+6x+13)-\arctan\left(\frac{x+3}{2}\right)+C$'
      - id: d
        text: '$\ln(x^2+6x+13)+C$'
    answer:
      choiceId: a
    explanation: |
      Use two technique choices in sequence. First split the numerator around the derivative of the denominator:

      $$
      x+5=\frac{1}{2}(2x+6)+2.
      $$

      The first part uses $u=x^2+6x+13$ and gives $\frac{1}{2}\ln(x^2+6x+13)$. The remaining part requires completing the square:

      $$
      x^2+6x+13=(x+3)^2+4.
      $$

      Then use the arctangent pattern on $\int \frac{2}{(x+3)^2+2^2}\,dx$. The full strategy is numerator decomposition, $u$-substitution, completing the square, then arctangent.

  - id: q002
    type: multipleChoice
    prompt: |
      Before integrating, what is the best first step?

      $$
      \int \frac{x^3+2x^2+x+5}{x^2+1}\,dx
      $$
    choices:
      - id: a
        text: 'Use polynomial division, then integrate the quotient and the remaining proper fraction.'
      - id: b
        text: 'Use partial fractions immediately.'
      - id: c
        text: 'Complete the square first.'
      - id: d
        text: 'Use integration by parts with $u=x^3+2x^2+x+5$.'
    answer:
      choiceId: a
    explanation: |
      The rational function is improper because the numerator degree is $3$ and the denominator degree is $2$. The first technique choice must be polynomial division. After division,

      $$
      \frac{x^3+2x^2+x+5}{x^2+1}=x+2+\frac{4-x}{x^2+1}.
      $$

      Then integrate the quotient directly. The remainder is proper; split $\frac{4-x}{x^2+1}$ into $\frac{4}{x^2+1}-\frac{x}{x^2+1}$, using arctangent for the first and $u=x^2+1$ for the second.

  - id: q003
    type: multipleChoice
    prompt: |
      Which partial fraction template is correct?

      $$
      \frac{4x-1}{(x-2)^2(x+3)}
      $$
    choices:
      - id: a
        text: '$\frac{A}{x-2}+\frac{B}{(x-2)^2}+\frac{C}{x+3}$'
      - id: b
        text: '$\frac{A}{(x-2)^2}+\frac{B}{x+3}$'
      - id: c
        text: '$\frac{Ax+B}{(x-2)^2}+\frac{C}{x+3}$'
      - id: d
        text: '$\frac{A}{x-2}+\frac{B}{x+3}$'
    answer:
      choiceId: a
    explanation: |
      The denominator is already factored into a repeated linear factor and a distinct linear factor. The technique choice is partial fraction decomposition for repeated linear factors. Repeated factor $(x-2)^2$ requires one term for each power:

      $$
      \frac{A}{x-2}+\frac{B}{(x-2)^2}.
      $$

      The distinct linear factor $x+3$ contributes $\frac{C}{x+3}$. No polynomial division is needed because the rational function is proper.

  - id: q004
    type: multipleChoice
    prompt: |
      Which antiderivative matches?

      $$
      \int \frac{5}{x^2-9}\,dx
      $$
    choices:
      - id: a
        text: '$\frac{5}{6}\ln\left|\frac{x-3}{x+3}\right|+C$'
      - id: b
        text: '$5\arctan\left(\frac{x}{3}\right)+C$'
      - id: c
        text: '$\frac{5}{3}\ln|x^2-9|+C$'
      - id: d
        text: '$-\frac{5}{x^2-9}+C$'
    answer:
      choiceId: a
    explanation: |
      The denominator factors:

      $$
      x^2-9=(x-3)(x+3).
      $$

      The technique choice is partial fractions with distinct linear factors, not arctangent, because $x^2-9$ is a difference of squares rather than $x^2+a^2$. Decompose:

      $$
      \frac{5}{(x-3)(x+3)}=\frac{5/6}{x-3}-\frac{5/6}{x+3}.
      $$

      Integrating gives the log difference.

  - id: q005
    type: multipleChoice
    prompt: |
      Which antiderivative matches?

      $$
      \int \frac{2x+1}{x^2+4x+8}\,dx
      $$
    choices:
      - id: a
        text: '$\ln(x^2+4x+8)-\frac{3}{2}\arctan\left(\frac{x+2}{2}\right)+C$'
      - id: b
        text: '$\ln(x^2+4x+8)+\frac{3}{2}\arctan\left(\frac{x+2}{2}\right)+C$'
      - id: c
        text: '$2\ln|x+4|+\arctan(x)+C$'
      - id: d
        text: '$\frac{1}{2}\ln(x^2+4x+8)+C$'
    answer:
      choiceId: a
    explanation: |
      This requires numerator adjustment plus completing the square. The denominator derivative is $2x+4$, so rewrite

      $$
      2x+1=(2x+4)-3.
      $$

      The $(2x+4)$ part uses $u=x^2+4x+8$ and gives $\ln(x^2+4x+8)$. For the remaining part, complete the square:

      $$
      x^2+4x+8=(x+2)^2+4.
      $$

      Then $\int \frac{-3}{(x+2)^2+2^2}\,dx=-\frac{3}{2}\arctan\left(\frac{x+2}{2}\right)$. The full sequence is numerator decomposition, $u$-substitution, completing the square, arctangent.

  - id: q006
    type: multipleChoice
    prompt: |
      What technique sequence is needed?

      $$
      \int \frac{x^2+2x+5}{x+1}\,dx
      $$
    choices:
      - id: a
        text: 'Polynomial division, then direct integration and a logarithm from the remaining linear denominator.'
      - id: b
        text: 'Complete the square, then arctangent.'
      - id: c
        text: 'Partial fractions with two distinct linear factors.'
      - id: d
        text: 'Trig substitution.'
    answer:
      choiceId: a
    explanation: |
      The rational function is improper, so polynomial division comes first:

      $$
      \frac{x^2+2x+5}{x+1}=x+1+\frac{4}{x+1}.
      $$

      Then integrate $x+1$ directly and use the logarithmic rule on $\frac{4}{x+1}$. There is no factor decomposition beyond the linear denominator after division, and no completing the square is needed.

  - id: q007
    type: multipleChoice
    prompt: |
      Which setup matches this rational function?

      $$
      \frac{3x+2}{x(x^2+4)}
      $$
    choices:
      - id: a
        text: '$\frac{A}{x}+\frac{Bx+C}{x^2+4}$'
      - id: b
        text: '$\frac{A}{x}+\frac{B}{x^2+4}$'
      - id: c
        text: '$\frac{A}{x^2}+\frac{B}{x+4}$'
      - id: d
        text: '$\frac{Ax+B}{x}+\frac{C}{x^2+4}$'
    answer:
      choiceId: a
    explanation: |
      The denominator has one linear factor, $x$, and one irreducible quadratic factor, $x^2+4$. The technique choice is partial fraction decomposition with mixed factor types. Linear factors use constant numerators; irreducible quadratic factors require linear numerators:

      $$
      \frac{A}{x}+\frac{Bx+C}{x^2+4}.
      $$

      After solving constants, the terms may produce logarithms, $u$-substitution terms, and arctangent terms.

  - id: q008
    type: multipleChoice
    prompt: |
      Which antiderivative matches?

      $$
      \int \frac{1}{x^2+2x+5}\,dx
      $$
    choices:
      - id: a
        text: '$\frac{1}{2}\arctan\left(\frac{x+1}{2}\right)+C$'
      - id: b
        text: '$\ln(x^2+2x+5)+C$'
      - id: c
        text: '$\arctan(x^2+2x+5)+C$'
      - id: d
        text: '$\frac{1}{5}\ln|x+1|+C$'
    answer:
      choiceId: a
    explanation: |
      The denominator does not factor over the reals. Complete the square:

      $$
      x^2+2x+5=(x+1)^2+4.
      $$

      The technique choice is completing the square followed by the arctangent form. Since the denominator becomes $(x+1)^2+2^2$, the coefficient is $\frac{1}{2}$.

  - id: q009
    type: multipleChoice
    prompt: |
      Which decomposition is correct?

      $$
      \frac{7x+1}{x^2-x-6}
      $$
    choices:
      - id: a
        text: '$\frac{22/5}{x-3}+\frac{13/5}{x+2}$'
      - id: b
        text: '$\frac{13/5}{x-3}+\frac{22/5}{x+2}$'
      - id: c
        text: '$\frac{7}{x-3}+\frac{1}{x+2}$'
      - id: d
        text: '$\frac{7x+1}{(x-3)^2}+\frac{1}{x+2}$'
    answer:
      choiceId: a
    explanation: |
      Factor the denominator first:

      $$
      x^2-x-6=(x-3)(x+2).
      $$

      The technique choice is partial fractions for distinct linear factors:

      $$
      \frac{7x+1}{(x-3)(x+2)}=\frac{A}{x-3}+\frac{B}{x+2}.
      $$

      Clearing denominators gives $7x+1=A(x+2)+B(x-3)$. Substituting $x=3$ gives $A=22/5$; substituting $x=-2$ gives $B=13/5$.

  - id: q010
    type: multipleChoice
    prompt: |
      Which antiderivative matches?

      $$
      \int \frac{x}{(x+1)^2}\,dx
      $$
    choices:
      - id: a
        text: '$\ln|x+1|+\frac{1}{x+1}+C$'
      - id: b
        text: '$\ln|x+1|-\frac{1}{x+1}+C$'
      - id: c
        text: '$\frac{x^2}{2(x+1)^2}+C$'
      - id: d
        text: '$-\frac{x}{x+1}+C$'
    answer:
      choiceId: a
    explanation: |
      This can be handled by a quick algebraic rewrite or repeated-linear partial fractions. Rewrite the numerator:

      $$
      x=(x+1)-1.
      $$

      Then

      $$
      \frac{x}{(x+1)^2}=\frac{1}{x+1}-\frac{1}{(x+1)^2}.
      $$

      The first term gives a logarithm and the second gives $\frac{1}{x+1}$. The technique choices are numerator rewriting, equivalent to a very small repeated-factor decomposition, then direct integration.

  - id: q011
    type: selectAll
    prompt: |
      Which technique choices are required somewhere in this integral?

      $$
      \int \frac{x^3+1}{x^2-1}\,dx
      $$
    choices:
      - id: a
        text: 'Polynomial division'
      - id: b
        text: 'Factor decomposition into $(x-1)(x+1)$'
      - id: c
        text: 'Completing the square'
      - id: d
        text: 'Partial fractions for the proper remainder'
    answer:
      choiceIds: [a, b, d]
    explanation: |
      The numerator degree is larger, so start with polynomial division. After division, the remainder sits over $x^2-1$, which factors as $(x-1)(x+1)$. That proper remainder needs partial fraction decomposition. Completing the square is not used because the denominator is factorable as a difference of squares.

  - id: q012
    type: selectAll
    prompt: |
      Which technique choices are required somewhere in this integral?

      $$
      \int \frac{x^2+4x+1}{x^2+4x+8}\,dx
      $$
    choices:
      - id: a
        text: 'Rewrite the numerator relative to the denominator.'
      - id: b
        text: 'Complete the square.'
      - id: c
        text: 'Use an arctangent form.'
      - id: d
        text: 'Use distinct linear partial fractions.'
    answer:
      choiceIds: [a, b, c]
    explanation: |
      The degrees are equal, so first rewrite:

      $$
      x^2+4x+1=(x^2+4x+8)-7.
      $$

      That gives a direct $\int 1\,dx$ part and a remaining rational part. Then complete the square:

      $$
      x^2+4x+8=(x+2)^2+4.
      $$

      The remaining term uses arctangent. Distinct linear partial fractions are not used because the quadratic is irreducible over the reals.

  - id: q013
    type: multipleChoice
    prompt: |
      What is the best first structural move?

      $$
      \int \frac{6x+5}{x^2+x-2}\,dx
      $$
    choices:
      - id: a
        text: 'Factor the denominator and use partial fractions.'
      - id: b
        text: 'Complete the square and use only arctangent.'
      - id: c
        text: 'Use polynomial division first.'
      - id: d
        text: 'Use trigonometric substitution.'
    answer:
      choiceId: a
    explanation: |
      The rational function is proper because the numerator degree is less than the denominator degree. The denominator factors:

      $$
      x^2+x-2=(x+2)(x-1).
      $$

      The technique choice is factor decomposition followed by partial fractions. Polynomial division is unnecessary, and completing the square is less efficient because the denominator factors over the reals.

  - id: q014
    type: multipleChoice
    prompt: |
      Which antiderivative matches?

      $$
      \int \frac{x^2}{x^2+1}\,dx
      $$
    choices:
      - id: a
        text: '$x-\arctan x+C$'
      - id: b
        text: '$x+\arctan x+C$'
      - id: c
        text: '$\ln(x^2+1)+C$'
      - id: d
        text: '$\frac{x^3}{3(x^2+1)}+C$'
    answer:
      choiceId: a
    explanation: |
      The degrees are equal, so use division or numerator rewriting:

      $$
      x^2=(x^2+1)-1.
      $$

      Then

      $$
      \frac{x^2}{x^2+1}=1-\frac{1}{x^2+1}.
      $$

      The technique choices are polynomial division or equivalent numerator decomposition, direct integration of $1$, and the arctangent pattern for $\frac{1}{x^2+1}$.

  - id: q015
    type: multipleChoice
    prompt: |
      Which full technique sequence is best?

      $$
      \int \frac{x^4+x^2+1}{x^2+1}\,dx
      $$
    choices:
      - id: a
        text: 'Polynomial division, then split the proper remainder into an arctangent term.'
      - id: b
        text: 'Partial fractions with distinct linear factors only.'
      - id: c
        text: 'Complete the square before doing anything else.'
      - id: d
        text: 'Integration by parts twice.'
    answer:
      choiceId: a
    explanation: |
      The rational function is improper because the numerator degree is $4$ and the denominator degree is $2$. Start with polynomial division:

      $$
      \frac{x^4+x^2+1}{x^2+1}=x^2+\frac{1}{x^2+1}.
      $$

      Then integrate $x^2$ directly and integrate $\frac{1}{x^2+1}$ as $\arctan x$. The full sequence is polynomial division, direct power integration, then arctangent for the proper remainder. Partial fractions are not needed because $x^2+1$ is irreducible and already in arctangent form.
