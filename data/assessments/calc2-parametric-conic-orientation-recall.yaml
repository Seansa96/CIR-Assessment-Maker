schemaVersion: 1
id: calc2-parametric-conic-orientation-recall
title: Parametric Conic Orientation Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryIds:
  - parametric-curves
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
    - parametric-curves
    - conic-sections
    - orientation
    - starting-position
    - graph-recognition
skills:
  - parametric-curves
  - conic-graph-recognition
items:
  - id: circle-grid-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: |
      Study the circular orientation grid.

      ![Grid of circular parametric curves with red starting points and arrows showing orientation](/assessments/calc2-parametric-polar/parametric-conic-circle-orientation-grid.svg)

      What two visual facts should you retrieve first from any parametric conic graph?
    answer:
      expected: Starting point and direction of travel as the parameter increases.
    explanation: |
      The red dot gives the position at the lower endpoint of the parameter interval, usually $t=0$. The arrows show orientation: the direction the curve travels as $t$ increases.
    tags:
      - starting-position
      - orientation

  - id: unit-circle-standard-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: |
      For $0\le t\le2\pi$, recall the starting point and orientation:

      $$
      x=\cos t,\qquad y=\sin t.
      $$
    answer:
      expected: It starts at $(1,0)$ and moves counterclockwise.
    explanation: |
      At $t=0$, $(x,y)=(1,0)$. As $t$ increases slightly, $y=\sin t$ becomes positive, so the motion begins upward and travels counterclockwise.

      ![Unit circle starting at the right side and moving counterclockwise](/assessments/calc2-parametric-polar/parametric-conic-circle-start-right-ccw.svg)
    tags:
      - unit-circle
      - counterclockwise

  - id: unit-circle-negative-time-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: |
      For $0\le t\le2\pi$, recall the starting point and orientation:

      $$
      x=\cos(-t),\qquad y=\sin(-t).
      $$
    answer:
      expected: It starts at $(1,0)$ and moves clockwise.
    explanation: |
      The starting point is still $(1,0)$, but replacing $t$ with $-t$ reverses the direction of travel.

      ![Unit circle starting at the right side and moving clockwise](/assessments/calc2-parametric-polar/parametric-conic-circle-start-right-cw.svg)
    tags:
      - unit-circle
      - clockwise

  - id: circle-top-ccw-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: |
      For $0\le t\le2\pi$, recall the starting point and orientation:

      $$
      x=\cos\left(t+\frac{\pi}{2}\right),
      \qquad
      y=\sin\left(t+\frac{\pi}{2}\right).
      $$
    answer:
      expected: It starts at $(0,1)$ and moves counterclockwise.
    explanation: |
      At $t=0$, the angle is $\frac{\pi}{2}$, so the starting point is the top of the circle. The positive $t$ direction preserves counterclockwise motion.

      ![Unit circle starting at the top and moving counterclockwise](/assessments/calc2-parametric-polar/parametric-conic-circle-start-top-ccw.svg)
    tags:
      - phase-shift
      - counterclockwise

  - id: circle-top-cw-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: |
      For $0\le t\le2\pi$, recall the starting point and orientation:

      $$
      x=\cos\left(-t+\frac{\pi}{2}\right),
      \qquad
      y=\sin\left(-t+\frac{\pi}{2}\right).
      $$
    answer:
      expected: It starts at $(0,1)$ and moves clockwise.
    explanation: |
      The shift $\frac{\pi}{2}$ sets the start at the top. The negative $t$ reverses the standard counterclockwise orientation.

      ![Unit circle starting at the top and moving clockwise](/assessments/calc2-parametric-polar/parametric-conic-circle-start-top-cw.svg)
    tags:
      - phase-shift
      - clockwise

  - id: shifted-ellipse-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: |
      For $0\le t\le2\pi$, recall the starting point and orientation:

      $$
      x=2+3\cos t,\qquad y=1+1.2\sin t.
      $$
    answer:
      expected: It starts at $(5,1)$ and moves counterclockwise around an ellipse centered at $(2,1)$.
    explanation: |
      At $t=0$, cosine is $1$ and sine is $0$, so the start is $(2+3,1)=(5,1)$. Positive sine immediately increases $y$, so the trace moves upward from the rightmost point.

      ![Shifted ellipse starting at the right side and moving counterclockwise](/assessments/calc2-parametric-polar/parametric-conic-ellipse-shifted-start-right-ccw.svg)
    tags:
      - ellipse
      - starting-position

  - id: parabola-trace-flashcard
    type: flashcard
    skills:
      - parametric-curves
    prompt: |
      For $-2\le t\le2$, recall the starting point and trace direction:

      $$
      x=t,\qquad y=t^2.
      $$
    answer:
      expected: It starts at $(-2,4)$, moves down and right to the vertex, then moves up and right.
    explanation: |
      The lower endpoint is $t=-2$, giving $(-2,4)$. As $t$ increases to $0$, the point approaches the vertex $(0,0)$; after that, it moves up the right side.

      ![Parabola traced from left high point through the vertex and up the right side](/assessments/calc2-parametric-polar/parametric-conic-parabola-x-t-y-t2.svg)
    tags:
      - parabola
      - interval

  - id: graph-to-expression-recognition
    type: recognition
    skills:
      - parametric-curves
    prompt: |
      Match the graph to the most likely parameterization on $0\le t\le2\pi$.

      ![Ellipse with red starting point at the top and arrows moving clockwise](/assessments/calc2-parametric-polar/parametric-conic-quiz-ellipse-top-cw.svg)
    choices:
      - id: a
        text: '$x=-1+1.5\cos(-t+\frac{\pi}{2}),\ y=2+3\sin(-t+\frac{\pi}{2})$'
      - id: b
        text: '$x=-1+1.5\cos(t+\frac{\pi}{2}),\ y=2+3\sin(t+\frac{\pi}{2})$'
      - id: c
        text: '$x=2+3\cos t,\ y=1+1.2\sin t$'
      - id: d
        text: '$x=t,\ y=t^2$'
    answer:
      choiceId: a
      expected: '$x=-1+1.5\cos(-t+\frac{\pi}{2}),\ y=2+3\sin(-t+\frac{\pi}{2})$'
    explanation: |
      The top start requires the $\frac{\pi}{2}$ phase shift. The clockwise arrows require replacing $t$ with $-t$.
    tags:
      - graph-to-expression
      - ellipse
