questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which type of intermolecular force is present in **all** atoms and molecules?
    choices:
      - id: a
        text: Hydrogen bonding
      - id: b
        text: Dipole-dipole forces
      - id: c
        text: London dispersion forces
      - id: d
        text: Ion-dipole forces
    answer:
      choiceId: c
    explanation: |
      London dispersion forces result from temporary fluctuations in electron clouds, creating instantaneous dipoles. Because all atoms and molecules have electrons, all of them exhibit dispersion forces.

  - id: q002
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which of the following compounds exhibits **hydrogen bonding** in its pure liquid state?
    choices:
      - id: a
        text: '$H_2S$'
      - id: b
        text: '$CH_3F$'
      - id: c
        text: '$CH_3COOH$'
      - id: d
        text: '$CH_3OCH_3$'
    answer:
      choiceId: c
    explanation: |
      Hydrogen bonding requires an H atom directly bonded to F, O, or N. In acetic acid ($CH_3COOH$), there is an O—H bond. In $CH_3F$, the F is bonded to C. In $H_2S$, S is not electronegative enough. In $CH_3OCH_3$, the O is bonded only to carbons.

  - id: q003
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Among the halogens ($F_2$, $Cl_2$, $Br_2$, $I_2$), $F_2$ and $Cl_2$ are gases, $Br_2$ is a liquid, and $I_2$ is a solid at room temperature. What explains this trend?
    choices:
      - id: a
        text: Decreasing electronegativity down the group increases bond strength
      - id: b
        text: Increasing molar mass and electron cloud size down the group increases polarizability and London dispersion forces
      - id: c
        text: The heavier halogens have permanent dipole moments
      - id: d
        text: Hydrogen bonding becomes possible in the heavier halogens
    answer:
      choiceId: b
    explanation: |
      All halogens are nonpolar diatomic molecules, so they rely solely on London dispersion forces. As you go down the group, the atoms have more electrons in larger, more diffuse orbitals. This makes the electron cloud more **polarizable**, leading to stronger dispersion forces that can hold $Br_2$ as a liquid and $I_2$ as a solid.

  - id: q004
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which of the following pairs is correctly matched with the strongest intermolecular force holding the two specified particles together?
    choices:
      - id: a
        text: '$Na^+$ and $H_2O$: Dipole-dipole force'
      - id: b
        text: '$CH_4$ and $CH_4$: Hydrogen bonding'
      - id: c
        text: '$NH_3$ and $NH_3$: Hydrogen bonding'
      - id: d
        text: '$H_2O$ and $CH_4$: Ion-dipole force'
    answer:
      choiceId: c
    explanation: |
      $NH_3$ molecules hydrogen bond with each other because they have N—H bonds and a lone pair on N. $Na^+$ and $H_2O$ is an ion-dipole interaction. $CH_4$ is nonpolar (dispersion only).

  - id: q005
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Rank the following according to **increasing vapor pressure** at room temperature: water ($H_2O$), diethyl ether ($CH_3CH_2OCH_2CH_3$, weak IMFs), and ethanol ($CH_3CH_2OH$, moderate IMFs).
    choices:
      - id: a
        text: Water < Ethanol < Diethyl ether
      - id: b
        text: Diethyl ether < Ethanol < Water
      - id: c
        text: Ethanol < Water < Diethyl ether
      - id: d
        text: Water < Diethyl ether < Ethanol
    answer:
      choiceId: a
    explanation: |
      Vapor pressure is **inversely** related to IMF strength. Stronger IMFs = lower vapor pressure (fewer molecules escape). Water has the strongest IMFs (extensive H-bonding) → lowest vapor pressure. Diethyl ether has the weakest IMFs (dipole-dipole/dispersion) → highest vapor pressure.

  - id: q006
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which intermolecular force is responsible for the capillary action that allows water to climb up a narrow glass tube?
    choices:
      - id: a
        text: London dispersion forces only
      - id: b
        text: Ion-dipole forces between water and the air
      - id: c
        text: Adhesive forces (hydrogen bonding/dipole interactions) between water and the polar $SiO_2$ in glass
      - id: d
        text: Covalent bonds forming between water and glass
    answer:
      choiceId: c
    explanation: |
      Capillary action is driven by **adhesion** (attraction between liquid molecules and the tube surface) being stronger than **cohesion** (attraction between liquid molecules themselves). The polar glass ($SiO_2$) surface strongly attracts water molecules via dipole and hydrogen bonding interactions.

  - id: q007
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Identify the strongest intermolecular force present in pure $HCl$.
    choices:
      - id: a
        text: London dispersion forces
      - id: b
        text: Dipole-dipole forces
      - id: c
        text: Hydrogen bonding
      - id: d
        text: Ion-dipole forces
    answer:
      choiceId: b
    explanation: |
      $HCl$ is a polar molecule ($\Delta EN = 0.9$), so it has dipole-dipole forces. It does **not** have hydrogen bonding because H is bonded to Cl, not to the required highly electronegative, small atoms (F, O, or N).

  - id: q008
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which of the following substances would you expect to have the highest boiling point?
    choices:
      - id: a
        text: '$CH_4$'
      - id: b
        text: '$C_2H_6$'
      - id: c
        text: '$C_3H_8$'
      - id: d
        text: '$C_8H_{18}$ (Octane)'
    answer:
      choiceId: d
    explanation: |
      All four are nonpolar alkanes with only London dispersion forces. Dispersion forces increase with molecular size and surface area. Octane is the largest molecule (highest molar mass, longest chain), making it the most polarizable with the strongest dispersion forces. (Octane is a liquid; the others are gases).

  - id: q009
    type: multipleChoice
    skills:
      - chem-intermolecular-forces
    prompt: |
      Why is the boiling point of $H_2O$ (100°C) so much higher than that of $H_2S$ (−60°C)?
    choices:
      - id: a
        text: $H_2O$ is nonpolar while $H_2S$ is polar
      - id: b
        text: Oxygen is smaller than sulfur, reducing London dispersion forces
      - id: c
        text: $H_2O$ can form strong hydrogen bonds, while $H_2S$ relies on weaker dipole-dipole forces
      - id: d
        text: The covalent bonds inside $H_2O$ are stronger than in $H_2S$
    answer:
      choiceId: c
    explanation: |
      Boiling point depends on *intermolecular* forces, not intramolecular covalent bonds. Both are polar, bent molecules. However, the O—H bond allows water to form extensive **hydrogen bonding** networks, requiring massive energy to boil. $H_2S$ only forms standard dipole-dipole interactions.

  - id: q010
    type: selectAll
    skills:
      - chem-intermolecular-forces
    prompt: |
      Which physical properties generally **increase** as the strength of intermolecular forces increases? Select all that apply.
    choices:
      - id: a
        text: Boiling point
      - id: b
        text: Melting point
      - id: c
        text: Vapor pressure
      - id: d
        text: Viscosity
      - id: e
        text: Surface tension
    answer:
      choiceIds:
        - a
        - b
        - d
        - e
    explanation: |
      Stronger IMFs mean molecules are held together more tightly. This raises the boiling/melting points (more energy to separate), increases viscosity (harder to flow past each other), and increases surface tension (stronger inward pull at the surface). **Vapor pressure decreases** because fewer molecules can escape into the gas phase.
