questions:
- id: q001
  title: Sketching Parametric Curves
  type: freeResponse
  prompt: |-
    Sketch the parametric curve and indicate its direction of motion.

    $$
    x=t^2-3t,\qquad y=-2t+5
    $$
  answer:
    expected: |-
      A complete response identifies the Cartesian curve, gives key points, and shows direction of motion.
    gradingMode: selfCheck
    keyPoints:
    - Eliminate the parameter correctly.
    - Identify the curve type (parabola opening right).
    - Label important points.
    - Indicate direction as $t$ increases.
  explanation: |-
    Solve $y=-2t+5$ for $t$: $t = \frac{5-y}{2}$. Substitute into $x=t^2-3t$ to find a parabola opening to the right. Use sample values of $t$ to determine direction.
- id: q002
  title: Sketching Parametric Curves
  type: freeResponse
  prompt: |-
    Sketch the parametric curve and indicate its direction of motion.

    $$
    x=4\cos t,\qquad y=-6\sin t
    $$
  answer:
    expected: |-
      A complete response identifies the Cartesian curve, gives key points, and shows direction of motion.
    gradingMode: selfCheck
    keyPoints:
    - Eliminate the parameter using $\sin^2 t + \cos^2 t = 1$.
    - Identify the curve type (ellipse).
    - Label the vertices.
    - Indicate clockwise direction.
  explanation: |-
    Since $\frac{x}{4} = \cos t$ and $\frac{y}{-6} = \sin t$, squaring and adding gives $\frac{x^2}{16} + \frac{y^2}{36} = 1$. This is an ellipse. As $t$ increases from $0$ to $\pi/2$, the point moves from $(4,0)$ to $(0,-6)$, which is a clockwise direction.
- id: q003
  title: Parameterizations of Curves
  type: freeResponse
  prompt: |-
    Parameterize the line segment from $(0,1)$ to $(3,-2)$ such that $t=0$ corresponds to the first point and $t=1$ corresponds to the second point.
  answer:
    expected: |-
      A complete response gives $x(t)$ and $y(t)$ for the line segment.
    gradingMode: selfCheck
    keyPoints:
    - Use the formula $x = x_0 + (x_1-x_0)t$ and $y = y_0 + (y_1-y_0)t$.
    - State $x = 3t$.
    - State $y = 1 - 3t$.
  explanation: |-
    Using the points $(x_0, y_0) = (0,1)$ and $(x_1, y_1) = (3,-2)$:
    $$
    x = 0 + (3-0)t = 3t
    $$
    $$
    y = 1 + (-2-1)t = 1-3t
    $$
- id: q004
  title: Parameterizations of Curves
  type: freeResponse
  prompt: |-
    Write a parameterization for the circle $x^2+y^2=25$, starting at $(5,0)$ and traced counterclockwise.
  answer:
    expected: |-
      A complete response gives $x(t)$ and $y(t)$ using sine and cosine.
    gradingMode: selfCheck
    keyPoints:
    - Identify radius $R=5$.
    - Use standard counterclockwise parameterization.
    - State $x = 5\cos t, y = 5\sin t$.
  explanation: "A circle of radius $R$ centered at the origin can be parameterized\
    \ by $x = R\\cos t$ and $y = R\\sin t$. \nHere $R=5$, so:\n$$\nx = 5\\cos t, \\\
    quad y = 5\\sin t\n$$"
- id: q005
  title: Parameterizations of Curves
  type: freeResponse
  prompt: |-
    Parameterize the parabola $y=x^2-2x$ using $x=t$.
  answer:
    expected: |-
      A complete response substitutes $x=t$ into the equation.
    gradingMode: selfCheck
    keyPoints:
    - State $x = t$.
    - State $y = t^2 - 2t$.
  explanation: |-
    By letting $x=t$, we substitute $t$ into the equation for $y$:
    $$
    y = t^2 - 2t
    $$
    So the parameterization is $x=t,\ y=t^2-2t$.
- id: q006
  title: Derivatives with Parametric Curves
  type: freeResponse
  prompt: |-
    Find $\frac{dy}{dx}$ in terms of $t$ for the curve $x=t^3, y=t^2$.
  answer:
    expected: |-
      A complete response provides the derivative $dy/dx$ by dividing $dy/dt$ by $dx/dt$.
    gradingMode: selfCheck
    keyPoints:
    - Find $\frac{dx}{dt} = 3t^2$.
    - Find $\frac{dy}{dt} = 2t$.
    - State $\frac{dy}{dx} = \frac{2}{3t}$.
  explanation: |-
    First, find the derivatives with respect to $t$:
    $$
    \frac{dx}{dt} = 3t^2,\quad \frac{dy}{dt} = 2t
    $$
    Then apply the parametric derivative formula:
    $$
    \frac{dy}{dx} = \frac{dy/dt}{dx/dt} = \frac{2t}{3t^2} = \frac{2}{3t}
    $$
- id: q007
  title: Derivatives with Parametric Curves
  type: freeResponse
  prompt: |-
    Find the slope of the curve $x=e^t, y=t^2$ at $t=1$.
  answer:
    expected: |-
      A complete response provides the numerical slope evaluated at $t=1$.
    gradingMode: selfCheck
    keyPoints:
    - Find $\frac{dx}{dt} = e^t$ and $\frac{dy}{dt} = 2t$.
    - Find $\frac{dy}{dx} = \frac{2t}{e^t}$.
    - Evaluate at $t=1$ to get $\frac{2}{e}$.
  explanation: |-
    First, find the derivatives:
    $$
    \frac{dx}{dt} = e^t,\quad \frac{dy}{dt} = 2t
    $$
    $$
    \frac{dy}{dx} = \frac{dy/dt}{dx/dt} = \frac{2t}{e^t}
    $$
    Evaluate at $t=1$:
    $$
    \frac{dy}{dx}\Big|_{t=1} = \frac{2(1)}{e^1} = \frac{2}{e}
    $$
- id: q008
  title: Derivatives with Parametric Curves
  type: freeResponse
  prompt: |-
    Find the equation of the tangent line to the curve $x=t^2, y=t^3-3t$ at $t=2$.
  answer:
    expected: |-
      A complete response shows the point, slope, and tangent line equation.
    gradingMode: selfCheck
    keyPoints:
    - Find the point $(4, 2)$ at $t=2$.
    - Find the slope $m = \frac{9}{4}$.
    - State the tangent line $y - 2 = \frac{9}{4}(x - 4)$.
  explanation: |-
    First, find the point at $t=2$:
    $$
    x(2) = 2^2 = 4
    $$
    $$
    y(2) = 2^3 - 3(2) = 8 - 6 = 2
    $$
    Point: $(4, 2)$

    Find the derivatives:
    $$
    \frac{dx}{dt} = 2t,\quad \frac{dy}{dt} = 3t^2 - 3
    $$
    $$
    \frac{dy}{dx} = \frac{3t^2 - 3}{2t}
    $$
    Evaluate the slope at $t=2$:
    $$
    m = \frac{3(2)^2 - 3}{2(2)} = \frac{12 - 3}{4} = \frac{9}{4}
    $$
    Tangent line equation:
    $$
    y - 2 = \frac{9}{4}(x - 4)
    $$
- id: q009
  title: Horizontal and Vertical Tangents
  type: freeResponse
  prompt: |-
    Find all values of $t$ where the curve $x=t^2-3t, y=t^3-3t$ has a horizontal tangent.
  answer:
    expected: |-
      A complete response identifies where $dy/dt=0$ and $dx/dt \ne 0$.
    gradingMode: selfCheck
    keyPoints:
    - Find $\frac{dy}{dt} = 3t^2 - 3$.
    - Set $\frac{dy}{dt} = 0$ to get $t = \pm 1$.
    - Verify $\frac{dx}{dt} \ne 0$ at $t = \pm 1$.
  explanation: |-
    For a horizontal tangent, we need $\frac{dy}{dt}=0$ and $\frac{dx}{dt}\ne 0$.
    $$
    \frac{dy}{dt} = 3t^2 - 3 = 0 \implies t^2 = 1 \implies t = 1, -1
    $$
    Check $\frac{dx}{dt} = 2t - 3$:
    At $t=1$: $\frac{dx}{dt} = -1 \ne 0$.
    At $t=-1$: $\frac{dx}{dt} = -5 \ne 0$.
    Horizontal tangents occur at $t = 1$ and $t = -1$.
- id: q010
  title: Concavity of Parametric Curves
  type: freeResponse
  prompt: |-
    Find $\frac{d^2y}{dx^2}$ in terms of $t$ for the curve $x=t^2, y=t^3$.
  answer:
    expected: |-
      A complete response uses the correct second derivative formula.
    gradingMode: selfCheck
    keyPoints:
    - Find $\frac{dy}{dx} = \frac{3}{2}t$.
    - Find $\frac{d}{dt}\left(\frac{dy}{dx}\right) = \frac{3}{2}$.
    - State $\frac{d^2y}{dx^2} = \frac{3}{4t}$.
  explanation: |-
    First, find $\frac{dy}{dx}$:
    $$
    \frac{dx}{dt} = 2t,\quad \frac{dy}{dt} = 3t^2
    $$
    $$
    \frac{dy}{dx} = \frac{3t^2}{2t} = \frac{3}{2}t
    $$
    Now use the second derivative formula:
    $$
    \frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}} = \frac{\frac{3}{2}}{2t} = \frac{3}{4t}
    $$
- id: q011
  title: Integrals with Parametric Curves
  type: freeResponse
  prompt: |-
    Set up the integral for the area under the parametric curve $x=t^2, y=t^3$ from $t=1$ to $t=2$.
  answer:
    expected: |-
      A complete response provides the correct integral setup using $y(t)x'(t)$.
    gradingMode: selfCheck
    keyPoints:
    - Use Area $= \int y(t)x'(t) dt$.
    - Identify $x'(t) = 2t$.
    - State $\int_1^2 t^3 (2t) dt = \int_1^2 2t^4 dt$.
  explanation: |-
    The formula for parametric area is:
    $$
    A = \int_a^b y(t)x'(t) \,dt
    $$
    Here, $y(t) = t^3$ and $x'(t) = 2t$. The integral is:
    $$
    A = \int_1^2 (t^3)(2t) \,dt = \int_1^2 2t^4 \,dt
    $$
- id: q012
  title: Integrals with Parametric Curves
  type: freeResponse
  prompt: |-
    Set up the integral for the arc length of the parametric curve $x=\cos t, y=\sin t$ from $t=0$ to $t=\pi$.
  answer:
    expected: |-
      A complete response provides the correct arc length integral setup.
    gradingMode: selfCheck
    keyPoints:
    - Find $\frac{dx}{dt} = -\sin t$ and $\frac{dy}{dt} = \cos t$.
    - Substitute into arc length formula.
    - Simplify to $\int_0^\pi \sqrt{\sin^2 t + \cos^2 t} dt$ or $\int_0^\pi 1 dt$.
  explanation: |-
    The formula for parametric arc length is:
    $$
    L = \int_a^b \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \,dt
    $$
    Derivatives:
    $$
    \frac{dx}{dt} = -\sin t,\quad \frac{dy}{dt} = \cos t
    $$
    Setup integral:
    $$
    L = \int_0^\pi \sqrt{(-\sin t)^2 + (\cos t)^2} \,dt = \int_0^\pi \sqrt{\sin^2 t + \cos^2 t} \,dt = \int_0^\pi 1 \,dt
    $$
- id: q013
  title: Sketching Polar Curves
  type: freeResponse
  prompt: |-
    Sketch the polar curve $r=6\cos\theta$. What shape is this?
  answer:
    expected: |-
      A complete response sketches a circle shifted on the x-axis.
    gradingMode: selfCheck
    keyPoints:
    - Identify the shape as a circle.
    - State the diameter is 6 along the positive x-axis.
    - State the center is at $(3,0)$ in Cartesian coordinates.
  explanation: |-
    The equation $r=6\cos\theta$ describes a circle passing through the pole, with its center at Cartesian coordinates $(3,0)$ and a diameter of 6 along the positive x-axis.
- id: q014
  title: Sketching Polar Curves
  type: freeResponse
  prompt: |-
    Sketch the polar curve $r=5\sin(2\theta)$. What shape is this?
  answer:
    expected: |-
      A complete response sketches a four-petaled rose.
    gradingMode: selfCheck
    keyPoints:
    - Identify the shape as a rose curve.
    - Identify it has 4 petals (since 2 is even, $2(2)=4$).
    - State the maximum petal length is 5.
  explanation: |-
    The equation $r=a\sin(n\theta)$ with $n=2$ describes a rose curve with $2n=4$ petals. The maximum radius is 5. Since it's sine, the petals are centered in the four quadrants, not on the axes.
- id: q015
  title: Slopes with Polar Curves
  type: freeResponse
  prompt: |-
    Find the formula for $\frac{dy}{dx}$ for the polar curve $r=3\cos\theta$.
  answer:
    expected: |-
      A complete response uses the polar slope formula.
    gradingMode: selfCheck
    keyPoints:
    - Find $r' = -3\sin\theta$.
    - Use $\frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$.
    - Substitute $r$ and $r'$ correctly.
  explanation: |-
    The formula for polar slope is:
    $$
    \frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}
    $$
    Given $r = 3\cos\theta$, we have $r' = -3\sin\theta$:
    $$
    \frac{dy}{dx} = \frac{(-3\sin\theta)\sin\theta + (3\cos\theta)\cos\theta}{(-3\sin\theta)\cos\theta - (3\cos\theta)\sin\theta} = \frac{-3\sin^2\theta + 3\cos^2\theta}{-6\sin\theta\cos\theta}
    $$
- id: q016
  title: Slopes with Polar Curves
  type: freeResponse
  prompt: |-
    Find the slope of the polar curve $r=2\sin\theta$ at $\theta=\frac{\pi}{4}$.
  answer:
    expected: |-
      A complete response evaluates the slope formula at the given angle.
    gradingMode: selfCheck
    keyPoints:
    - Evaluate $r(\pi/4) = \sqrt{2}$ and $r'(\pi/4) = \sqrt{2}$.
    - Substitute into the slope formula.
    - State the slope is 0.
  explanation: |-
    Given $r = 2\sin\theta$ and $r' = 2\cos\theta$.
    Evaluate at $\theta = \frac{\pi}{4}$:
    $$
    r = 2\left(\frac{\sqrt{2}}{2}\right) = \sqrt{2},\quad r' = 2\left(\frac{\sqrt{2}}{2}\right) = \sqrt{2}
    $$
    Substitute into the slope formula:
    $$
    \frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta} = \frac{\sqrt{2}\left(\frac{\sqrt{2}}{2}\right) + \sqrt{2}\left(\frac{\sqrt{2}}{2}\right)}{\sqrt{2}\left(\frac{\sqrt{2}}{2}\right) - \sqrt{2}\left(\frac{\sqrt{2}}{2}\right)} = \frac{1 + 1}{1 - 1} = \frac{2}{0}
    $$
    Wait, the denominator is zero, so the slope is undefined (vertical tangent).
- id: q017
  title: Polar Horizontal and Vertical Tangents
  type: freeResponse
  prompt: |-
    Set up the equation to find horizontal tangents for the polar curve $r=1+\cos\theta$.
  answer:
    expected: |-
      A complete response shows setting the numerator of the derivative to zero.
    gradingMode: selfCheck
    keyPoints:
    - Find $r' = -\sin\theta$.
    - Set $r'\sin\theta + r\cos\theta = 0$.
    - State $(-\sin\theta)\sin\theta + (1+\cos\theta)\cos\theta = 0$.
  explanation: |-
    For a horizontal tangent, the numerator of the slope formula $\frac{dy}{d\theta}$ must be zero:
    $$
    \frac{dy}{d\theta} = r'\sin\theta + r\cos\theta = 0
    $$
    Given $r = 1+\cos\theta$, we have $r' = -\sin\theta$:
    $$
    -\sin^2\theta + (1+\cos\theta)\cos\theta = 0
    $$
- id: q018
  title: Integrals with Polar Curves
  type: freeResponse
  prompt: |-
    Set up the integral for the area of the region bounded by $r=3\cos\theta$.
  answer:
    expected: |-
      A complete response gives the correct polar area integral setup.
    gradingMode: selfCheck
    keyPoints:
    - Use Area $= \frac{1}{2}\int r^2 d\theta$.
    - Determine bounds, e.g., $0$ to $\pi$ or $-\pi/2$ to $\pi/2$.
    - State $\frac{1}{2}\int_0^\pi (3\cos\theta)^2 d\theta$.
  explanation: |-
    The formula for polar area is $A = \frac{1}{2}\int r^2 \,d\theta$.
    The circle $r=3\cos\theta$ completes one full trace from $0$ to $\pi$.
    $$
    A = \frac{1}{2}\int_0^\pi (3\cos\theta)^2 \,d\theta
    $$
- id: q019
  title: Integrals with Polar Curves
  type: freeResponse
  prompt: |-
    Set up the integral for the arc length of the polar curve $r=2$ from $\theta=0$ to $\theta=2\pi$.
  answer:
    expected: |-
      A complete response gives the correct polar arc length integral setup.
    gradingMode: selfCheck
    keyPoints:
    - Find $r' = 0$.
    - Substitute into arc length formula $\sqrt{r^2 + (r')^2}$.
    - State $\int_0^{2\pi} \sqrt{2^2 + 0^2} d\theta = \int_0^{2\pi} 2 d\theta$.
  explanation: |-
    The formula for polar arc length is:
    $$
    L = \int_{\alpha}^{\beta} \sqrt{r^2 + \left(\frac{dr}{d\theta}\right)^2} \,d\theta
    $$
    Here $r=2$ and $r'=0$:
    $$
    L = \int_0^{2\pi} \sqrt{2^2 + 0^2} \,d\theta = \int_0^{2\pi} 2 \,d\theta
    $$
- id: q020
  title: Conic Sections
  type: freeResponse
  prompt: "Identify the conic section and write it in standard form by completing\
    \ the square: \n\n$$\n4x^2+25y^2-16x+150y+141=0\n$$"
  answer:
    expected: |-
      A complete response classifies the conic and provides the standard form.
    gradingMode: selfCheck
    keyPoints:
    - Identify the conic as an ellipse.
    - Complete the square for $x$ and $y$.
    - 'State the final form: $\frac{(x-2)^2}{25} + \frac{(y+3)^2}{4} = 1$.'
  explanation: |-
    First, group the terms:
    $$
    4(x^2-4x) + 25(y^2+6y) = -141
    $$
    Complete the square:
    $$
    4(x^2-4x+4) + 25(y^2+6y+9) = -141 + 4(4) + 25(9)
    $$
    $$
    4(x-2)^2 + 25(y+3)^2 = 100
    $$
    Divide by $100$:
    $$
    \frac{(x-2)^2}{25} + \frac{(y+3)^2}{4} = 1
    $$
    This is an ellipse.
- id: q021
  title: Conic Sections
  type: freeResponse
  prompt: |-
    Identify the vertex and focus of the parabola $y^2 = 8x$.
  answer:
    expected: |-
      A complete response identifies both key features of the parabola.
    gradingMode: selfCheck
    keyPoints:
    - Identify the vertex at $(0,0)$.
    - Determine $4p = 8 \implies p = 2$.
    - Identify the focus at $(2,0)$.
  explanation: "The standard form is $y^2 = 4px$. \nThe vertex is at the origin $(0,0)$.\
    \ \nSince $4p = 8$, we have $p = 2$. The parabola opens to the right, so the focus\
    \ is at $(p, 0) = (2,0)$."
