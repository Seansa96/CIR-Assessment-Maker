title: Cylindrical Capacitor
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-capacitance
workedExamples:
- id: we1
  title: Finding the capacitance of a cylindrical capacitor
  prompt: Find the capacitance of a cylindrical capacitor consisting of a solid inner
    conductor of radius $a$ and a coaxial outer conducting shell of radius $b$, both
    of length $L$. Assume $L \gg b$.
  steps:
  - id: s1
    prompt: Determine the electric field and potential difference.
    explanation: 'Solution:

      1) By Gauss''s Law, the field between the cylinders is $E = \frac{\lambda}{2\pi
      \epsilon_0 r} = \frac{Q}{2\pi \epsilon_0 L r}$.

      2) Integrate to find $V$: $V = -\int_b^a E \, dr = \int_a^b \frac{Q}{2\pi \epsilon_0
      L r} \, dr = \frac{Q}{2\pi \epsilon_0 L} \ln\left(\frac{b}{a}\right)$.

      3) Use $C = \frac{Q}{V}$ to find $C = \frac{2\pi \epsilon_0 L}{\ln(b/a)}$.


      Why it works:

      Capacitance is derived by assuming a charge $Q$, finding the resulting field
      $E$, integrating to find $V$, and taking the ratio $Q/V$.'
