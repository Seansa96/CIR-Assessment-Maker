- id: we02
  title: Dielectric insertion under two constraints
  problem: A 2.00 microF capacitor is initially at 4.00 V. Compare inserting a dielectric with kappa=3 when
    isolated versus while connected to an ideal 4.00 V battery.
  steps:
  - id: 02-isolated-capacitance
    title: For the isolated capacitor, find its new capacit
    instruction: For the isolated capacitor, find its new capacitance.
    prompt: For the isolated capacitor, find its new capacitance.
    type: numericResponse
    choices: []
    answer:
      value: 6.0
      tolerance: 0.02
    explanation: 'Solution: C_new=kappa C=6.00 microF.


      Why it works: A dielectric multiplies capacitance by kappa regardless of the electrical constraint.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-capacitance
  - id: 02-isolated-voltage
    title: For the isolated capacitor, find its new voltage
    instruction: For the isolated capacitor, find its new voltage.
    prompt: For the isolated capacitor, find its new voltage.
    type: numericResponse
    choices: []
    answer:
      value: 1.333
      tolerance: 0.01
    explanation: 'Solution: Q stays fixed at 8.00 microC; V=Q/C_new=1.333 V.


      Why it works: Disconnection fixes charge, not voltage.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-capacitance
  - id: 02-connected-charge
    title: For the battery-connected capacitor, find its ne
    instruction: For the battery-connected capacitor, find its new charge.
    prompt: For the battery-connected capacitor, find its new charge.
    type: numericResponse
    choices: []
    answer:
      value: 24.0
      tolerance: 0.1
    explanation: 'Solution: V stays 4.00 V; Q=C_new V=24.0 microC.


      Why it works: The battery supplies additional charge as capacitance increases.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-capacitance
  - id: 02-energy-compare
    title: How does stored energy change in the isolated ca
    instruction: How does stored energy change in the isolated case?
    prompt: How does stored energy change in the isolated case?
    type: multipleChoice
    choices:
    - id: a
      text: decreases to one third
    - id: b
      text: It rises because the distance increases.
      issueSignals:
      - id: physics2-method-selection-error
        domains:
        - physics-2
    - id: c
      text: The field is zero at every axial point.
      issueSignals:
      - id: physics2-method-selection-error
        domains:
        - physics-2
    - id: d
      text: The field points toward the positive source.
      issueSignals:
      - id: physics2-method-selection-error
        domains:
        - physics-2
    answer:
      choiceId: a
    explanation: 'Solution: At fixed Q, U=Q^2/(2C); tripling C reduces U to one third.


      Why it works: The fixed-charge energy formula is inversely proportional to capacitance.


      Why the other choices fail: None'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-capacitance
  skills:
  - physics2-capacitance
