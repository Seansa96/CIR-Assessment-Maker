workedExamples:
- id: we01
  title: Coaxial cylindrical capacitor
  problem: A coaxial capacitor has L=0.500 m, inner radius a=1.00 mm, outer radius b=4.00 mm, and vacuum between
    conductors.
  steps:
  - id: 01-log-ratio
    title: Evaluate ln(b/a).
    instruction: Evaluate ln(b/a).
    prompt: Evaluate ln(b/a).
    type: numericResponse
    choices: []
    answer:
      value: 1.3863
      tolerance: 0.002
    explanation: 'Solution: b/a=4, so ln(b/a)=ln 4=1.3863.


      Why it works: The radial integration produces a logarithm of the dimensionless radius ratio.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-capacitance
  - id: 01-capacitance
    title: Find the capacitance.
    instruction: Find the capacitance.
    prompt: Find the capacitance.
    type: numericResponse
    choices: []
    answer:
      value: 2.0e-11
      tolerance: 2.0e-13
    explanation: 'Solution: C=2 pi epsilon0 L/ln(b/a)=2.00e-11 F.


      Why it works: Gauss’s law gives E proportional to 1/r; integrating E from a to b gives the stated geometry
      formula.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-capacitance
  - id: 01-charge
    title: If the capacitor is held at 100 V, find its char
    instruction: If the capacitor is held at 100 V, find its charge.
    prompt: If the capacitor is held at 100 V, find its charge.
    type: numericResponse
    choices: []
    answer:
      value: 2.0e-09
      tolerance: 2.0e-11
    explanation: 'Solution: Q=CV=2.00e-9 C.


      Why it works: Capacitance relates stored charge to potential difference.'
    hint: Use the stated geometry and the defining relation; retain signs and units.
    skills:
    - physics2-capacitance
  skills:
