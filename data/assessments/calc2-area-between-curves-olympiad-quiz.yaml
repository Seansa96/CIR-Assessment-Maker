- id: q001
  type: freeResponse
  prompt: A spring has natural length 1 m. A force of 10 N stretches it by 1 m. Find
    the work done stretching it 1 m.
  answer:
    gradingMode: selfCheck
    checkModel: 5 J
  explanation: Find the spring constant k, then integrate kx from 0 to a.
