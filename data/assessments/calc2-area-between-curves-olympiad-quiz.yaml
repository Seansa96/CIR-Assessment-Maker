questions:
- id: q001
  type: freeResponse
  skills:
  - area-between-curves
  - olympiad-problem-solving
  prompt: Find the exact area enclosed by $y=x^2$ and $y=3x$ on their bounded region.
  answer:
    gradingMode: selfCheck
    expected: $\frac{27}{6}$.
    keyPoints:
    - 'Matches the reference result: $\frac{27}{6}$.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: The intersections are $x=0$ and $x=3$. On this interval $3x\ge x^2$, so integrate $\int_0^3(3x-x^2)\,dx=27/6$.
