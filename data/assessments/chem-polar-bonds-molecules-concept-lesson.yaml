lesson:
  introduction: Build a reliable model of polar bonds and molecular polarity by separating electron accounting, particle representation,
    and observable evidence.
  sections:
  - id: sec-electronegativity
    title: Use electronegativity direction
    required: true
    content: A bond dipole points toward the more electronegative atom, which carries partial negative character.
    check:
      id: chk-sec-electronegativity
      type: multipleChoice
      prompt: Which statement correctly applies the idea of use electronegativity direction?
      choices:
      - id: a
        text: An H-F bond dipole points toward fluorine.
        issueSignals: []
      - id: b
        text: An H-F bond dipole points toward hydrogen because hydrogen is positive.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      answer:
        choiceId: a
      explanation: 'Solution: An H-F bond dipole points toward fluorine. Why it works: A bond dipole points toward the more
        electronegative atom, which carries partial negative character. Why the other choices fail: The other statements either
        reverse the relevant electron or charge accounting or apply a structural model outside its stated scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-polarity-vectors.svg
      alt: Instructional workflow for polar bonds and molecular polarity showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: sec-bond-polarity
    title: Separate partial from full charge
    required: true
    content: Polar covalent sharing produces partial charges; it does not automatically create free ions.
    check:
      id: chk-sec-bond-polarity
      type: multipleChoice
      prompt: Which statement correctly applies the idea of separate partial from full charge?
      choices:
      - id: a
        text: HF has unequal sharing without being an isolated H+ and F- pair.
        issueSignals: []
      - id: b
        text: Every polar bond is fully ionic.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      answer:
        choiceId: a
      explanation: 'Solution: HF has unequal sharing without being an isolated H+ and F- pair. Why it works: Polar covalent
        sharing produces partial charges; it does not automatically create free ions. Why the other choices fail: The other
        statements either reverse the relevant electron or charge accounting or apply a structural model outside its stated
        scope.'
  - id: sec-molecular-polarity
    title: Add dipoles as vectors
    required: true
    content: Molecular polarity depends on vector sum, not the mere presence of polar bonds.
    check:
      id: chk-sec-molecular-polarity
      type: multipleChoice
      prompt: Which statement correctly applies the idea of add dipoles as vectors?
      choices:
      - id: a
        text: Linear CO2 has cancelling C-O dipoles.
        issueSignals: []
      - id: b
        text: CO2 is polar because it contains two polar bonds.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      answer:
        choiceId: a
      explanation: 'Solution: Linear CO2 has cancelling C-O dipoles. Why it works: Molecular polarity depends on vector sum,
        not the mere presence of polar bonds. Why the other choices fail: The other statements either reverse the relevant
        electron or charge accounting or apply a structural model outside its stated scope.'
  - id: sec-symmetry
    title: Use symmetry with geometry
    required: true
    content: Equal dipoles cancel only when the three-dimensional arrangement makes their vectors balance.
    check:
      id: chk-sec-symmetry
      type: multipleChoice
      prompt: Which statement correctly applies the idea of use symmetry with geometry?
      choices:
      - id: a
        text: Tetrahedral CCl4 is nonpolar because four equal vectors cancel.
        issueSignals: []
      - id: b
        text: Any molecule with four bonds is automatically nonpolar.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      answer:
        choiceId: a
      explanation: 'Solution: Tetrahedral CCl4 is nonpolar because four equal vectors cancel. Why it works: Equal dipoles
        cancel only when the three-dimensional arrangement makes their vectors balance. Why the other choices fail: The other
        statements either reverse the relevant electron or charge accounting or apply a structural model outside its stated
        scope.'
  - id: sec-polarity-applications
    title: Recognize asymmetric substitution
    required: true
    content: Replacing one member of a symmetric set can prevent complete cancellation even when the central geometry remains
      similar.
    check:
      id: chk-sec-polarity-applications
      type: multipleChoice
      prompt: Which statement correctly applies the idea of recognize asymmetric substitution?
      choices:
      - id: a
        text: CHCl3 is polar while CCl4 is nonpolar.
        issueSignals: []
      - id: b
        text: CHCl3 is nonpolar because both formulas contain carbon and chlorine.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      answer:
        choiceId: a
      explanation: 'Solution: CHCl3 is polar while CCl4 is nonpolar. Why it works: Replacing one member of a symmetric set
        can prevent complete cancellation even when the central geometry remains similar. Why the other choices fail: The
        other statements either reverse the relevant electron or charge accounting or apply a structural model outside its
        stated scope.'
  - id: sec-multicenter
    title: Analyze local and net polarity
    required: true
    content: For a multicenter molecule, identify local bond dipoles and geometry, then add their contributions over the whole
      structure.
    check:
      id: chk-sec-multicenter
      type: multipleChoice
      prompt: Which statement correctly applies the idea of analyze local and net polarity?
      choices:
      - id: a
        text: Local polar bonds can produce either a zero or nonzero molecular dipole.
        issueSignals: []
      - id: b
        text: One polar bond guarantees the entire molecule is polar.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      - id: c
        text: The conclusion follows from counting element symbols rather than applying the required electron, charge, or
          vector check.
        issueSignals:
        - id: chemistry-bonding-polarity-vector-error
      answer:
        choiceId: a
      explanation: 'Solution: Local polar bonds can produce either a zero or nonzero molecular dipole. Why it works: For a
        multicenter molecule, identify local bond dipoles and geometry, then add their contributions over the whole structure.
        Why the other choices fail: The other statements either reverse the relevant electron or charge accounting or apply
        a structural model outside its stated scope.'
