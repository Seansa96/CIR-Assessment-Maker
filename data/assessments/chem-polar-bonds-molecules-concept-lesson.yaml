lesson:
  introduction: |
    Not all covalent bonds are created equal. When two different atoms share electrons, one usually pulls the shared electrons more strongly than the other. This unequal sharing creates **bond polarity** — partial charges that can accumulate into a molecule-wide **dipole moment**. Whether that dipole cancels or survives depends entirely on molecular geometry, making polarity the bridge between structure and physical behavior.
  sections:
    - id: sec-electronegativity
      title: Electronegativity and Its Trends
      required: true
      content: |
        **Electronegativity (EN)** is a measure of an atom's ability to attract bonding electrons toward itself in a covalent bond. The Pauling scale runs from 0.7 (Fr, least electronegative) to 4.0 (F, most electronegative).

        **Periodic trends:**
        - Electronegativity **increases across a period** (left → right) because nuclear charge increases while shielding stays roughly constant.
        - Electronegativity **decreases down a group** because atomic radius increases, moving bonding electrons farther from the nucleus.

        Key values to know:

        | Element | EN | Element | EN |
        |---|---|---|---|
        | F | 4.0 | N | 3.0 |
        | O | 3.5 | Cl | 3.2 |
        | H | 2.1 | C | 2.5 |
        | Na | 0.9 | S | 2.6 |

        The difference in electronegativity ($\Delta EN$) between bonded atoms determines bond character:
        - $\Delta EN < 0.4$: essentially nonpolar covalent
        - $0.4 \leq \Delta EN < 2.0$: polar covalent
        - $\Delta EN \geq 2.0$: ionic
      check:
        id: chk-pol-1
        type: multipleChoice
        prompt: |
          Which bond is **most polar**?
        choices:
          - id: a
            text: C—H ($\Delta$EN ≈ 0.4)
          - id: b
            text: N—H ($\Delta$EN ≈ 0.9)
          - id: c
            text: O—H ($\Delta$EN ≈ 1.4)
          - id: d
            text: C—C ($\Delta$EN = 0)
        answer:
          choiceId: c
        explanation: |
          Bond polarity increases with $\Delta EN$. The O—H bond has the largest electronegativity difference (O = 3.5, H = 2.1, $\Delta EN = 1.4$) among the choices, making it the most polar. This is why O—H bonds are key players in hydrogen bonding.

    - id: sec-bond-polarity
      title: Bond Polarity and Dipole Moments
      required: true
      content: |
        When two atoms of different electronegativity share electrons, the electrons are pulled toward the more electronegative atom, creating **partial charges**:

        - The more electronegative atom gets a partial negative charge: $\delta^-$
        - The less electronegative atom gets a partial positive charge: $\delta^+$

        This charge separation is called a **bond dipole**. Dipoles have both magnitude and direction — they are vector quantities.

        **Dipole moment ($\mu$):** the product of the magnitude of the partial charge and the distance between the charges:

        $$
        \mu = Q \times r
        $$

        Units: debyes (D). The larger the charge separation and the longer the bond, the larger the dipole moment.

        **Convention:** Dipole arrows point from the positive end ($\delta^+$) toward the negative end ($\delta^-$):

        $$
        H \xrightarrow{\delta^+ \to \delta^-} F \quad (H—F \text{ bond dipole})
        $$

        The H—F bond has $\mu = 1.82$ D; the H—Cl bond has $\mu = 1.08$ D; H—Br: 0.82 D. The trend follows the electronegativity difference.
      check:
        id: chk-pol-2
        type: multipleChoice
        prompt: |
          In an H—Cl bond, where is the partial negative charge ($\delta^-$) located?
        choices:
          - id: a
            text: On hydrogen, because it is less electronegative
          - id: b
            text: On chlorine, because it is more electronegative
          - id: c
            text: Equally on both atoms
          - id: d
            text: In the space between the two atoms
        answer:
          choiceId: b
        explanation: |
          Chlorine (EN = 3.2) is significantly more electronegative than hydrogen (EN = 2.1). The shared electrons are pulled toward Cl, giving it the partial negative charge ($\delta^-$) and leaving H with the partial positive charge ($\delta^+$).

    - id: sec-molecular-polarity
      title: Molecular Polarity — Geometry Matters
      required: true
      content: |
        A molecule's net polarity is the **vector sum of all its individual bond dipoles**. Molecular geometry determines whether those vectors cancel or reinforce:

        **If all bond dipoles cancel → nonpolar molecule ($\mu = 0$)**

        **If bond dipoles do not fully cancel → polar molecule ($\mu \neq 0$)**

        The symmetry test: if a molecule has a **symmetric arrangement of identical bonds** around the central atom, bond dipoles cancel.

        | Molecule | Geometry | Bond Dipoles | Net Dipole |
        |---|---|---|---|
        | $CO_2$ | Linear | ← C → (cancel) | 0 (nonpolar) |
        | $CCl_4$ | Tetrahedral | 4 equal vectors pointing outward (cancel) | 0 (nonpolar) |
        | $BF_3$ | Trigonal planar | 3 equal vectors (cancel) | 0 (nonpolar) |
        | $H_2O$ | Bent | Two O—H dipoles point toward O (don't cancel) | ≠ 0 (polar) |
        | $NH_3$ | Trigonal pyramidal | Three N—H dipoles + lone pair (don't cancel) | ≠ 0 (polar) |
        | $CHCl_3$ | Tetrahedral | One C—H and three C—Cl (unequal, don't cancel) | ≠ 0 (polar) |
      media:
        - type: image
          src: /media/chemistry/covalent-bonding/chem-molecular-polarity-vectors.png
          alt: Diagram showing dipole moment vectors for CO2 (linear, vectors cancel, nonpolar) versus H2O (bent, vectors reinforce, polar).
          caption: "In CO₂, the two C=O bond dipoles are equal and opposite — they cancel, giving a nonpolar molecule. In H₂O, the two O—H dipoles reinforce each other because of the bent geometry, giving a significant net dipole moment."
      check:
        id: chk-pol-3
        type: multipleChoice
        prompt: |
          $CCl_4$ has four polar C—Cl bonds. Why is the molecule nonpolar overall?
        choices:
          - id: a
            text: Because C—Cl bonds are not actually polar (ΔEN is too small)
          - id: b
            text: Because the perfectly tetrahedral geometry causes the four bond dipoles to cancel exactly
          - id: c
            text: Because carbon's formal charge is zero
          - id: d
            text: Because the molecule is too large for dipoles to be significant
        answer:
          choiceId: b
        explanation: |
          Each C—Cl bond is polar ($\Delta EN \approx 0.7$), but in the **perfect tetrahedral** geometry of $CCl_4$, the four C—Cl dipole vectors point symmetrically outward in 3D. As vectors, they sum exactly to zero — the molecule has no net dipole moment and is **nonpolar**. If just one Cl is replaced by another element (as in $CHCl_3$), the symmetry breaks and a net dipole appears.

    - id: sec-polarity-applications
      title: Predicting Polarity — The Quick Test
      required: true
      content: |
        Follow this decision procedure to determine if a molecule is polar:

        1. **Draw the Lewis structure** and determine molecular geometry.
        2. **Identify all polar bonds** (bonds between atoms with $\Delta EN > 0.4$).
        3. **Check for symmetry:** If the molecule has a center of symmetry and identical substituents on all sides, bond dipoles cancel → **nonpolar**.
        4. **Account for lone pairs:** Lone pairs on the central atom contribute to the molecular dipole (they push electron density in their direction). A molecule like $SF_4$ (seesaw) is polar partly because its lone pair breaks symmetry.

        **Important:** A molecule with **no polar bonds** is always nonpolar (e.g., $O_2$, $N_2$, $P_4$).

        A molecule with **polar bonds** may be polar or nonpolar depending on geometry.

        A molecule is **definitely polar** if:
        - It has polar bonds **and** an asymmetric geometry, **or**
        - It has a lone pair on the central atom that breaks the otherwise symmetric arrangement.

        **Solubility connection:** The principle "like dissolves like" stems from polarity — polar solvents (like water) dissolve polar and ionic solutes; nonpolar solvents (like hexane) dissolve nonpolar solutes.
      check:
        id: chk-pol-4
        type: selectAll
        prompt: |
          Which of the following molecules are **polar**? Select all that apply.
        choices:
          - id: a
            text: '$NH_3$ (trigonal pyramidal, N—H bonds are polar)'
          - id: b
            text: '$BF_3$ (trigonal planar, B—F bonds are polar)'
          - id: c
            text: '$H_2O$ (bent, O—H bonds are polar)'
          - id: d
            text: '$SF_6$ (octahedral, S—F bonds are polar)'
        answer:
          choiceIds:
            - a
            - c
        explanation: |
          **$NH_3$**: trigonal pyramidal (AX₃E₁) — the lone pair and three N—H bonds do not cancel, giving a net dipole. **Polar** ✓

          **$BF_3$**: trigonal planar (AX₃E₀) — three equal B—F bond dipoles in a symmetric plane cancel exactly. **Nonpolar** ✗

          **$H_2O$**: bent (AX₂E₂) — the two O—H dipoles reinforce each other due to bent geometry. **Polar** ✓

          **$SF_6$**: octahedral (AX₆E₀) — six equivalent S—F bond dipoles point symmetrically in 3D space and cancel completely. **Nonpolar** ✗
