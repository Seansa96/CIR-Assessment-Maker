- id: q001
  type: freeResponse
  prompt: >
    The first ten terms of

    $\displaystyle\sum_{n=1}^{\infty}(-1)^{n+1}/n$ approximate

    $\log 2$. Which error bound is guaranteed by the alternating-series

    estimate?


    Give the conclusion and the calculation or theorem that justifies it; do not answer with a choice letter.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints:
    - The absolute error is no larger than the magnitude of the eleventh term, the first omitted term.
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: The absolute error is no larger than the magnitude of the eleventh term, the first omitted term.


    Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


    Common trap: The first omitted term is not automatically an error bound. State the theorem's hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.
