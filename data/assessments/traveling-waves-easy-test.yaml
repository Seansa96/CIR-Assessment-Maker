- id: q001
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: Use the Traveling Waves diagram and the model $v=f\lambda$. A calibrated scenario scales the
    reference values by 1.1. Determine the wave speed. Give a numerical answer.
  answer:
    value: 3.3
    tolerance: 0.033
  explanation: Apply $v=f\lambda$ consistently to the scaled scenario; the requested wave speed is 3.3.
  media:
  - type: image
    src: /media/physics/owa/traveling-waves.svg
    alt: Labeled original schematic for Traveling Waves used for quantitative analysis.
    caption: Traveling Waves model diagram.
