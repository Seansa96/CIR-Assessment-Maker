- id: q001
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: A tensioned cable vibrates with wavelength 16.89 m when driven at 92.0 Hz.
    What is the angular frequency omega in rad/s?
  answer:
    value: 578.053
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*92.0 = 578.0530 rad/s.
- id: q002
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: An ocean swell propagates with a wavelength of 12.05 m passing a buoy at
    83.2 Hz. What is the wave speed in m/s?
  answer:
    value: 1002.56
    tolerance: 0.05
  explanation: v = lambda * f = 12.05 * 83.2 = 1002.56 m/s.
- id: q003
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: A tensioned cable vibrates with wavelength 15.45 m when driven at 17.6 Hz.
    What is the wave number k in rad/m?
  answer:
    value: 0.4067
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 15.45 = 0.4067 rad/m.
