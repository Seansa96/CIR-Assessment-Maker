lesson:
  introduction: |-
    Just as a line segment is a piece of a line, an **arc** is a piece of the outer edge of a circle. In this lesson, we will learn how to measure, name, and classify arcs.
  sections:
  - id: sec-arcs
    title: Major, Minor, and Semicircles
    required: true
    content: |-
      An arc is formed by two endpoints on a circle and all the continuous points on the curve between them.
      
      We classify arcs based on their size relative to a half-circle:
      1. **Semicircle**: An arc whose endpoints form a diameter. It is exactly half of the circle ($180^\circ$).
      2. **Minor Arc**: An arc that is smaller than a semicircle (less than $180^\circ$).
      3. **Major Arc**: An arc that is larger than a semicircle (greater than $180^\circ$).

  - id: sec-naming
    title: Naming Arcs and Measuring Them
    required: true
    content: |-
      We name arcs using the letters of the points on the circle, with a curved line drawn over them.
      
      - **Minor arcs** are named using just their two endpoints (e.g., $\overparen{AB}$). 
      - **Major arcs and semicircles** MUST be named using three points (e.g., $\overparen{ABC}$), so you know which way around the circle to go!
      
      Arcs are measured in degrees. A full circle is $360^\circ$. The measure of a minor arc is equal to the measure of its corresponding central angle. The measure of a major arc is $360^\circ$ minus the measure of its corresponding minor arc.

questions:
- id: q-geom-circ2-1
  title: Concept Check - Naming Arcs
  prompt: |-
    Why must a major arc be named with three letters instead of two?
  type: multipleChoice
  choices:
  - id: c1
    text: Because it is bigger than $180^\circ$.
  - id: c2
    text: To distinguish it from the minor arc that shares the same endpoints.
  - id: c3
    text: Because all arcs must be named with three letters.
  answer:
    choiceId: c2
  explanation: |-
    If you just said arc $\overparen{AB}$, it is automatically assumed you mean the shortest path (the minor arc). To specify the long way around the circle, you must provide a third point (e.g., $\overparen{ADB}$) to trace the correct path.
  skills:
  - geometry-circles-basics

- id: q-geom-circ2-2
  title: Concept Check - Measuring Arcs
  prompt: |-
    If minor arc $\overparen{XY}$ measures $80^\circ$, what is the measure of major arc $\overparen{XWY}$?
  type: numericResponse
  answer:
    numericValue: 280
    tolerance: 0
  explanation: |-
    The minor arc and major arc that share the same endpoints make up the entire circle. A full circle is $360^\circ$.
    $$360^\circ - 80^\circ = 280^\circ$$
  skills:
  - geometry-circles-basics
