workedExamples:
- id: complex-number
  title: Overloading Math Operators
  problem: 'We want to create a `Complex` number class that stores a `real` and `imag`
    part. We want to be able to add two complex numbers using `c1 + c2` and check
    for equality using `c1 == c2`.

    '
  steps:
  - id: step-complex-number-1
    title: Overload the addition operator (+)
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "Addition doesn't modify the existing object; it returns a new one.\
      \ It should be a `const` member function.\n\n```cpp\nclass Complex {\npublic:\n\
      \    double real, imag;\n    \n    Complex(double r, double i) : real(r), imag(i)\
      \ {}\n    \n    Complex operator+(const Complex& other) const {\n        return\
      \ Complex(real + other.real, imag + other.imag);\n    }\n};\n```\n"
  - id: step-complex-number-2
    title: Overload the equality operator (==)
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "Equality returns a `bool`. Two complex numbers are equal if both\
      \ their real and imaginary parts match.\n\n```cpp\n    bool operator==(const\
      \ Complex& other) const {\n        return (real == other.real) && (imag == other.imag);\n\
      \    }\n```\n"
  - id: step-complex-number-3
    title: Overload the stream insertion operator (<<)
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "To print using `cout << c1`, we must define a non-member function\
      \ that takes `std::ostream&` and `const Complex&`.\n\n```cpp\n#include <iostream>\n\
      \nstd::ostream& operator<<(std::ostream& os, const Complex& c) {\n    os <<\
      \ c.real << \" + \" << c.imag << \"i\";\n    return os;\n}\n\nint main() {\n\
      \    Complex c1(1, 2), c2(3, 4);\n    Complex c3 = c1 + c2;\n    std::cout <<\
      \ c3 << \"\\n\"; // Prints: 4 + 6i\n    return 0;\n}\n```\n"
  check:
    id: member-operator
    type: multipleChoice
    prompt: Why is `operator+` usually declared as `const` at the end of its signature
      (e.g., `Complex operator+(...) const`)?
    choices:
    - id: a
      text: Because adding two objects shouldn't modify the original object calling
        the method.
    - id: b
      text: Because it returns a constant value.
    - id: c
      text: Because the other parameter is `const`.
    - id: d
      text: Because it is required for all operators.
    answer:
      choiceId: a
    explanation: 'The `const` guarantees that `c1 + c2` does not change `c1`. It creates
      and returns a brand new `Complex` object instead.

      '
