questions:
- id: q001
  type: multipleChoice
  prompt: "What does this function return when called as `countUp(4)`?\n\n```cpp\n\
    int countUp(int n) {\n    int total = 0;\n    for (int i = 1; i <= n; i++) {\n\
    \        total += i;\n    }\n    return total;\n}\n```\n"
  choices:
  - id: a
    text: '`10`'
  - id: b
    text: '`6`'
  - id: c
    text: '`4`'
  - id: d
    text: It does not compile.
  answer:
    choiceId: a
  explanation: 'The loop adds `1 + 2 + 3 + 4`, so the result is `10`.


    Related topic: Tracing counted `for` loops and accumulators.


    Read further: Practice hand-tracing loop variables, conditions, and accumulator
    updates.

    '
- id: q002
  type: multipleChoice
  prompt: "Is there anything wrong with this function?\n\n```cpp\nint firstEven(int\
    \ n) {\n    int i = 0;\n    while (i < n) {\n        if (i % 2 == 0) {\n     \
    \       return i;\n        }\n    }\n    return -1;\n}\n```\n"
  choices:
  - id: a
    text: It returns `0` immediately for any positive `n`.
  - id: b
    text: It has an infinite loop for positive `n`.
  - id: c
    text: It cannot compile because `%` is invalid.
  - id: d
    text: It always returns `-1`.
  answer:
    choiceId: a
  explanation: 'For any positive `n`, `i` starts as `0`, and `0 % 2 == 0`, so the
    function returns before an infinite loop can occur.


    Related topic: Early `return` inside loops and condition order.


    Read further: Review\rhow `return` exits a function immediately, even from inside
    a loop.

    '
- id: q003
  type: multipleChoice
  prompt: "What is the main issue with this loop?\n\n```cpp\nint sumBelow(int n) {\n\
    \    int total = 0;\n    for (int i = 0; i <= n; i++) {\n        total += i;\n\
    \    }\n    return total;\n}\n```\n\nThe function was meant to sum integers strictly\
    \ below `n`.\n"
  choices:
  - id: a
    text: The condition should be `i < n`, not `i <= n`.
  - id: b
    text: The loop should start at `1`, never `0`.
  - id: c
    text: The accumulator should start at `1`.
  - id: d
    text: The update should be `i--`.
  answer:
    choiceId: a
  explanation: '`i <= n` includes `n`, but "strictly below `n`" means the loop should
    stop before `n`.


    Related topic: Off-by-one errors in loop bounds.


    Read further: Compare inclusive conditions like `<=` with exclusive conditions
    like `<`.

    '
- id: q004
  type: multipleChoice
  prompt: "What does this function return for `hasNegative({2, 5, -1, 8})`?\n\n```cpp\n\
    bool hasNegative(vector<int> values) {\n    for (int value : values) {\n     \
    \   if (value < 0) {\n            return true;\n        }\n    }\n    return false;\n\
    }\n```\n"
  choices:
  - id: a
    text: '`true`'
  - id: b
    text: '`false`'
  - id: c
    text: It does not compile because range-based loops cannot use `int`.
  - id: d
    text: It returns `-1`.
  answer:
    choiceId: a
  explanation: 'The range-based loop checks each value. When it reaches `-1`, the
    condition is true and the function returns `true`.


    Related topic: Range-based `for` loops and search patterns.


    Read further: Study range-based loops, boolean flags, and early return search
    logic.

    '
- id: q005
  type: multipleChoice
  prompt: "What is wrong with this function?\n\n```cpp\nint productToN(int n) {\n\
    \    int product = 0;\n    for (int i = 1; i <= n; i++) {\n        product *=\
    \ i;\n    }\n    return product;\n}\n```\n"
  choices:
  - id: a
    text: '`product` should start at `1`, not `0`.'
  - id: b
    text: The loop condition should use `>=`.
  - id: c
    text: '`*=` cannot be used in C++.'
  - id: d
    text: The function must return `double`.
  answer:
    choiceId: a
  explanation: 'Multiplying by `0` keeps the product at `0`. A multiplication accumulator
    should start at `1`.


    Related topic: Choosing correct accumulator identity values.


    Read further: Review identity values for sum, product, maximum, and minimum accumulator
    patterns.

    '
- id: q006
  type: code
  prompt: 'Write a C++ function `sumEvenToN` that returns the sum of all even integers
    from `2` through `n`.

    '
  language: cpp
  functionName: sumEvenToN
  starterCode: "int sumEvenToN(int n) {\n    // Return the sum of even integers from\
    \ 2 through n.\n    return 0;\n}\n"
  tests:
  - input: '6'
    expected: '12'
  - input: '1'
    expected: '0'
  - input: '10'
    expected: '30'
  answer: {}
  explanation: 'Loop through the even values with `i += 2`, or loop through every
    value and check `i % 2 == 0`.


    Related topic: Loop step size and filtering with modulo.


    Read further: Study `for` loop update expressions and the `%` remainder operator.

    '
- id: q007
  type: code
  prompt: 'Write a C++ function `countDigits` that returns\rhow many decimal digits
    are in a positive integer.

    '
  language: cpp
  functionName: countDigits
  starterCode: "int countDigits(int n) {\n    // n will be positive.\n    return 0;\n\
    }\n"
  tests:
  - input: '7'
    expected: '1'
  - input: '42'
    expected: '2'
  - input: '1005'
    expected: '4'
  answer: {}
  explanation: 'Repeatedly divide `n` by `10` and count\rhow many divisions happen
    before `n` becomes `0`.


    Related topic: `while` loops with changing state.


    Read further: Review integer division and sentinel conditions in `while` loops.

    '
- id: q008
  type: code
  prompt: 'Write a C++ function `factorial` that returns `n!` for `n >= 0`.

    '
  language: cpp
  functionName: factorial
  starterCode: "int factorial(int n) {\n    // Return n factorial.\n    return 0;\n\
    }\n"
  tests:
  - input: '0'
    expected: '1'
  - input: '4'
    expected: '24'
  - input: '6'
    expected: '720'
  answer: {}
  explanation: 'Start the product at `1` and multiply by each integer from `2` through
    `n`.


    Related topic: Product accumulators and special base cases.


    Read further: Study factorial as a standard loop accumulation example.

    '
- id: q009
  type: code
  prompt: 'Write a C++ function `countChar` that returns\rhow many times character
    `target` appears in string `text`.

    '
  language: cpp
  functionName: countChar
  starterCode: "int countChar(string text, char target) {\n    // Count\rhow often\
    \ target appears in text.\n    return 0;\n}\n"
  tests:
  - input: '"banana", ''a'''
    expected: '3'
  - input: '"loop", ''o'''
    expected: '2'
  - input: '"test", ''z'''
    expected: '0'
  answer: {}
  explanation: 'Loop over the characters in `text`, compare each one with `target`,
    and increment a counter when they match.


    Related topic: Range-based loops over strings and conditional counting.


    Read further: Review strings as sequences and the pattern of counting matches
    in a loop.

    '
- id: q010
  type: code
  prompt: 'Write a C++ function `isPrime` that returns whether `n` is prime. Assume
    `n >= 1`.

    '
  language: cpp
  functionName: isPrime
  starterCode: "bool isPrime(int n) {\n    // Return true if n is prime, otherwise\
    \ false.\n    return false;\n}\n"
  tests:
  - input: '1'
    expected: '0'
  - input: '2'
    expected: '1'
  - input: '9'
    expected: '0'
  - input: '13'
    expected: '1'
  answer: {}
  explanation: 'Handle `n < 2` as not prime, then check possible divisors. If any
    divisor divides evenly, return `false`; otherwise return `true`.


    Related topic: Loop-based divisibility testing and early returns.


    Read further: Study modulo, boolean return values, and improving divisor loops
    up to `sqrt(n)`.

    '
