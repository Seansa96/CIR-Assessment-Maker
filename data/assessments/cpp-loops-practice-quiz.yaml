questions:
  - id: q001
    type: multipleChoice
    prompt: |
      What does this function return when called as `countUp(4)`?

      ```cpp
      int countUp(int n) {
          int total = 0;
          for (int i = 1; i <= n; i++) {
              total += i;
          }
          return total;
      }
      ```
    choices:
      - id: a
        text: "`10`"
      - id: b
        text: "`6`"
      - id: c
        text: "`4`"
      - id: d
        text: "It does not compile."
    answer:
      choiceId: a
    explanation: |
      The loop adds `1 + 2 + 3 + 4`, so the result is `10`.

      Related topic: Tracing counted `for` loops and accumulators.

      Read further: Practice hand-tracing loop variables, conditions, and accumulator updates.
  - id: q002
    type: multipleChoice
    prompt: |
      Is there anything wrong with this function?

      ```cpp
      int firstEven(int n) {
          int i = 0;
          while (i < n) {
              if (i % 2 == 0) {
                  return i;
              }
          }
          return -1;
      }
      ```
    choices:
      - id: a
        text: "It returns `0` immediately for any positive `n`."
      - id: b
        text: "It has an infinite loop for positive `n`."
      - id: c
        text: "It cannot compile because `%` is invalid."
      - id: d
        text: "It always returns `-1`."
    answer:
      choiceId: a
    explanation: |
      For any positive `n`, `i` starts as `0`, and `0 % 2 == 0`, so the function returns before an infinite loop can occur.

      Related topic: Early `return` inside loops and condition order.

      Read further: Review how `return` exits a function immediately, even from inside a loop.
  - id: q003
    type: multipleChoice
    prompt: |
      What is the main issue with this loop?

      ```cpp
      int sumBelow(int n) {
          int total = 0;
          for (int i = 0; i <= n; i++) {
              total += i;
          }
          return total;
      }
      ```

      The function was meant to sum integers strictly below `n`.
    choices:
      - id: a
        text: "The condition should be `i < n`, not `i <= n`."
      - id: b
        text: "The loop should start at `1`, never `0`."
      - id: c
        text: "The accumulator should start at `1`."
      - id: d
        text: "The update should be `i--`."
    answer:
      choiceId: a
    explanation: |
      `i <= n` includes `n`, but "strictly below `n`" means the loop should stop before `n`.

      Related topic: Off-by-one errors in loop bounds.

      Read further: Compare inclusive conditions like `<=` with exclusive conditions like `<`.
  - id: q004
    type: multipleChoice
    prompt: |
      What does this function return for `hasNegative({2, 5, -1, 8})`?

      ```cpp
      bool hasNegative(vector<int> values) {
          for (int value : values) {
              if (value < 0) {
                  return true;
              }
          }
          return false;
      }
      ```
    choices:
      - id: a
        text: "`true`"
      - id: b
        text: "`false`"
      - id: c
        text: "It does not compile because range-based loops cannot use `int`."
      - id: d
        text: "It returns `-1`."
    answer:
      choiceId: a
    explanation: |
      The range-based loop checks each value. When it reaches `-1`, the condition is true and the function returns `true`.

      Related topic: Range-based `for` loops and search patterns.

      Read further: Study range-based loops, boolean flags, and early return search logic.
  - id: q005
    type: multipleChoice
    prompt: |
      What is wrong with this function?

      ```cpp
      int productToN(int n) {
          int product = 0;
          for (int i = 1; i <= n; i++) {
              product *= i;
          }
          return product;
      }
      ```
    choices:
      - id: a
        text: "`product` should start at `1`, not `0`."
      - id: b
        text: "The loop condition should use `>=`."
      - id: c
        text: "`*=` cannot be used in C++."
      - id: d
        text: "The function must return `double`."
    answer:
      choiceId: a
    explanation: |
      Multiplying by `0` keeps the product at `0`. A multiplication accumulator should start at `1`.

      Related topic: Choosing correct accumulator identity values.

      Read further: Review identity values for sum, product, maximum, and minimum accumulator patterns.
  - id: q006
    type: code
    prompt: |
      Write a C++ function `sumEvenToN` that returns the sum of all even integers from `2` through `n`.
    language: cpp
    functionName: sumEvenToN
    starterCode: |
      int sumEvenToN(int n) {
          // Return the sum of even integers from 2 through n.
          return 0;
      }
    tests:
      - input: "6"
        expected: "12"
      - input: "1"
        expected: "0"
      - input: "10"
        expected: "30"
    answer: {}
    explanation: |
      Loop through the even values with `i += 2`, or loop through every value and check `i % 2 == 0`.

      Related topic: Loop step size and filtering with modulo.

      Read further: Study `for` loop update expressions and the `%` remainder operator.
  - id: q007
    type: code
    prompt: |
      Write a C++ function `countDigits` that returns how many decimal digits are in a positive integer.
    language: cpp
    functionName: countDigits
    starterCode: |
      int countDigits(int n) {
          // n will be positive.
          return 0;
      }
    tests:
      - input: "7"
        expected: "1"
      - input: "42"
        expected: "2"
      - input: "1005"
        expected: "4"
    answer: {}
    explanation: |
      Repeatedly divide `n` by `10` and count how many divisions happen before `n` becomes `0`.

      Related topic: `while` loops with changing state.

      Read further: Review integer division and sentinel conditions in `while` loops.
  - id: q008
    type: code
    prompt: |
      Write a C++ function `factorial` that returns `n!` for `n >= 0`.
    language: cpp
    functionName: factorial
    starterCode: |
      int factorial(int n) {
          // Return n factorial.
          return 0;
      }
    tests:
      - input: "0"
        expected: "1"
      - input: "4"
        expected: "24"
      - input: "6"
        expected: "720"
    answer: {}
    explanation: |
      Start the product at `1` and multiply by each integer from `2` through `n`.

      Related topic: Product accumulators and special base cases.

      Read further: Study factorial as a standard loop accumulation example.
  - id: q009
