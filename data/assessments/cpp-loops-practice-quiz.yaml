      Loop over the characters in `text`, compare each one with `target`, and increment a counter when they match.

      Related topic: Range-based loops over strings and conditional counting.

      Read further: Review strings as sequences and the pattern of counting matches in a loop.
  - id: q010
    type: code
    prompt: |
      Write a C++ function `isPrime` that returns whether `n` is prime. Assume `n >= 1`.
    language: cpp
    functionName: isPrime
    starterCode: |
      bool isPrime(int n) {
          // Return true if n is prime, otherwise false.
          return false;
      }
    tests:
      - input: "1"
        expected: "0"
      - input: "2"
        expected: "1"
      - input: "9"
        expected: "0"
      - input: "13"
        expected: "1"
    answer: {}
    explanation: |
      Handle `n < 2` as not prime, then check possible divisors. If any divisor divides evenly, return `false`; otherwise return `true`.

      Related topic: Loop-based divisibility testing and early returns.

      Read further: Study modulo, boolean return values, and improving divisor loops up to `sqrt(n)`.
