items:
- id: rel-r001
  type: cloze
  prompt: 'Complete: $\vec v_{A/B}=\vec v_{A/E}\;\underline{\hspace{1cm}}\;\vec v_{B/E}$.'
  answer:
    expected: '-'
    expectedLatex: '-'
    aliases:
    - minus
    - subtract
    media: []
    choiceId: 
  explanation: "Solution: Insert a minus sign.\\n\\nWhy it works: Changing to observer B removes B's Earth-frame motion."
  tags:
  - frame-equation
  skills: []
  issueSignals: []
  choices: []
- id: rel-r002
  type: typed
  prompt: What does the denominator B identify in $\vec v_{A/B}$?
  answer:
    expected: observer
    expectedLatex: ''
    aliases:
    - reference frame
    media: []
    choiceId: 
  explanation: 'Solution: B is the observer.\n\nWhy it works: Relative velocity is always stated from a particular observing frame.'
  tags:
  - frame-labels
  skills: []
  issueSignals: []
  choices: []
- id: rel-r003
  type: cloze
  prompt: With east positive x, a westward 8 m/s component is $v_x=\underline{\hspace{1cm}}$ m/s.
  answer:
    expected: -8
    expectedLatex: -8
    aliases:
    - −8
    media: []
    choiceId: 
  explanation: 'Solution: $v_x=-8$ m/s.\n\nWhy it works: West is opposite the declared positive east direction.'
  tags:
  - signed-components
  skills: []
  issueSignals: []
  choices: []
- id: rel-r004
  type: typed
  prompt: What operation combines the x components when calculating $\vec v_{A/B}=\vec v_{A/E}-\vec v_{B/E}$?
  answer:
    expected: subtraction
    expectedLatex: ''
    aliases:
    - subtract
    media: []
    choiceId: 
  explanation: 'Solution: Subtract the components.\n\nWhy it works: Vector subtraction is performed independently on matching components.'
  tags:
  - components
  skills: []
  issueSignals: []
  choices: []
- id: rel-r005
  type: cloze
  prompt: For a direct river crossing, impose $v_{ground,x}=\underline{\hspace{1cm}}$.
  answer:
    expected: 0
    expectedLatex: 0
    aliases:
    - zero
    media: []
    choiceId: 
  explanation: 'Solution: Set the cross-track ground component to $0$.\n\nWhy it works: Zero cross-track velocity prevents drift.'
  tags:
  - course-correction
  skills: []
  issueSignals: []
  choices: []
- id: rel-r006
  type: typed
  prompt: 'Which component determines crossing time after drift is cancelled: along-route or cross-route?'
  answer:
    expected: along-route
    expectedLatex: ''
    aliases:
    - across-river
    - northward
    media: []
    choiceId: 
  explanation: 'Solution: Use the along-route component.\n\nWhy it works: Only the component toward the destination changes the crossing distance.'
  tags:
  - course-correction
  skills: []
  issueSignals: []
  choices: []
