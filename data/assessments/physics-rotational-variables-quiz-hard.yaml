questions:
- id: q1
  type: numericResponse
  prompt: The angular position of a flywheel is given by $\theta(t) = 2.0t^3$. What
    is its angular velocity at $t = 2.0 \text{ s}$?
  answer:
    value: 24.0
    tolerance: 0.5
  explanation: $\omega(t) = \frac{d\theta}{dt} = 6.0t^2$. At $t=2$, $\omega = 6(4)
    = 24 \text{ rad/s}$.
