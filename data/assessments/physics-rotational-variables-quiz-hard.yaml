questions:
- id: hard-q001
  type: numericResponse
  prompt: |-
    A turbine spinning at $100\text{ rpm}$ slows down at a constant rate of $0.5\text{ rad/s}^2$. How long does it take to stop?
  answer:
    value: 20.943933333333334
    tolerance: 1.0
  explanation: |-
    First convert rpm to rad/s: $\omega_i = 100 \times \frac{\pi}{30}$. Then use $t = \frac{\omega_f - \omega_i}{\alpha}$.
