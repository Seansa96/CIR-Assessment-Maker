questions:
- id: q001
  type: multipleChoice
  prompt: 'A circle has a radius of 8 cm. What is its circumference?'
  difficultyDimensions:
  - Recall circumference formula: $C = 2\pi r$.
  - Substitute $r = 8$: $C = 2 \times \pi \times 8 = 16\pi$.
  choices:
  - id: a
    text: '$8\pi\text{ cm}$'
    issueSignals:
    - diameter-confusion
  - id: b
    text: '$16\pi\text{ cm}$'
  - id: c
    text: '$64\pi\text{ cm}$'
    issueSignals:
    - area-confusion
  - id: d
    text: '$32\pi\text{ cm}$'
    issueSignals:
    - multiplication-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    The formula for the circumference of a circle is $C = 2\pi r$ (or $C = \pi d$).
    Given the radius $r = 8$:
    $C = 2\pi(8) = 16\pi\text{ cm}$.

    Why it works:
    Circumference is a 1-dimensional measurement of length around the boundary, so the radius is only raised to the first power.

    Why the other choices fail:
    - $8\pi$ uses the radius in place of the diameter ($C = \pi r$).
    - $64\pi$ is the *area* of the circle ($\pi r^2$).
    - $32\pi$ is $4\pi r$, perhaps confusing the surface area of a sphere formula.

- id: q002
  type: multipleChoice
  prompt: 'If the area of a circle is $144\pi\text{ m}^2$, what is its diameter?'
  difficultyDimensions:
  - Set up area equation: $\pi r^2 = 144\pi$.
  - Solve for radius: $r^2 = 144 \implies r = 12$.
  - Multiply by 2 to find diameter: $12 \times 2 = 24$.
  choices:
  - id: a
    text: '$12\text{ m}$'
    issueSignals:
    - radius-diameter-confusion
  - id: b
    text: '$72\text{ m}$'
    issueSignals:
    - division-error
  - id: c
    text: '$24\text{ m}$'
  - id: d
    text: '$144\text{ m}$'
    issueSignals:
    - square-root-omission
  answer:
    choiceId: c
  explanation: |
    Solution:
    The formula for the area of a circle is $A = \pi r^2$.
    $\pi r^2 = 144\pi$
    Divide both sides by $\pi$:
    $r^2 = 144$
    Take the square root:
    $r = 12$.
    The question asks for the diameter, which is twice the radius:
    $d = 2r = 2(12) = 24\text{ m}$.

    Why it works:
    This requires working backward from a 2-dimensional area to a 1-dimensional radius. Always read carefully to see whether the final question asks for radius or diameter!

    Why the other choices fail:
    - $12$ is the radius, but the question asks for the diameter.
    - $72$ comes from dividing 144 by 2 instead of taking the square root.
    - $144$ forgets to take the square root entirely.

- id: q003
  type: multipleChoice
  prompt: 'A circle has a circumference of $20\pi$. What is its area?'
  difficultyDimensions:
  - Use circumference to find radius: $2\pi r = 20\pi \implies r = 10$.
  - Use radius to find area: $\pi(10)^2 = 100\pi$.
  choices:
  - id: a
    text: '$100\pi$'
  - id: b
    text: '$400\pi$'
    issueSignals:
    - diameter-area-error
  - id: c
    text: '$10\pi$'
    issueSignals:
    - radius-diameter-confusion
  - id: d
    text: '$20\pi$'
    issueSignals:
    - circumference-confusion
  answer:
    choiceId: a
  explanation: |
    Solution:
    First, use the circumference to find the radius.
    $C = 2\pi r$
    $20\pi = 2\pi r$
    $r = 10$.
    Now, use the radius to find the area.
    $A = \pi r^2$
    $A = \pi(10)^2 = 100\pi$.

    Why it works:
    You cannot directly convert circumference to area without passing through the radius (or diameter) first. The radius is the master key for all circle properties.

    Why the other choices fail:
    - $400\pi$ incorrectly assumes the circumference value $20$ is the radius, yielding $\pi(20)^2 = 400\pi$.
    - $10\pi$ is $\pi r$, the formula for semi-circumference, not area.
    - $20\pi$ is just the original circumference value restated.

- id: q004
  type: multipleChoice
  prompt: 'In a circle with radius 12 cm, what is the length of an arc intercepted by a central angle of $60^\circ$?'
  difficultyDimensions:
  - Calculate total circumference: $2\pi(12) = 24\pi$.
  - Find the fraction of the circle: $60^\circ / 360^\circ = 1/6$.
  - Multiply: $(1/6) \times 24\pi = 4\pi$.
  choices:
  - id: a
    text: '$12\pi$'
    issueSignals:
    - area-fraction-error
  - id: b
    text: '$4\pi$'
  - id: c
    text: '$2\pi$'
    issueSignals:
    - diameter-confusion
  - id: d
    text: '$24\pi$'
    issueSignals:
    - fraction-omission
  answer:
    choiceId: b
  explanation: |
    Solution:
    The formula for arc length is $\frac{\text{central angle}}{360^\circ} \times C$.
    First, find the total circumference: $C = 2\pi(12) = 24\pi$.
    The arc covers $60^\circ$, which is $\frac{60}{360} = \frac{1}{6}$ of the full circle.
    Arc length = $\frac{1}{6} \times 24\pi = 4\pi\text{ cm}$.

    Why it works:
    An arc is just a slice of the crust of the pizza. If you take 1/6th of the pizza, you get 1/6th of the crust. 

    Why the other choices fail:
    - $12\pi$ might be a confusion with the area of the sector ($\frac{1}{6} \times 144\pi = 24\pi$), or just a miscalculation.
    - $2\pi$ occurs if you forget to use the diameter ($2r$) and just use the radius ($\frac{1}{6} \times 12\pi = 2\pi$).
    - $24\pi$ is the entire circumference.

- id: q005
  type: multipleChoice
  prompt: 'What is the area of a sector of a circle with a radius of 6 m and a central angle of $120^\circ$?'
  difficultyDimensions:
  - Calculate total area: $\pi(6)^2 = 36\pi$.
  - Find fraction of the circle: $120^\circ / 360^\circ = 1/3$.
  - Multiply: $(1/3) \times 36\pi = 12\pi$.
  choices:
  - id: a
    text: '$4\pi\text{ m}^2$'
    issueSignals:
    - circumference-fraction-error
  - id: b
    text: '$12\pi\text{ m}^2$'
  - id: c
    text: '$36\pi\text{ m}^2$'
    issueSignals:
    - fraction-omission
  - id: d
    text: '$24\pi\text{ m}^2$'
    issueSignals:
    - ratio-error
  answer:
    choiceId: b
  explanation: |
    Solution:
    The formula for the area of a sector is $\frac{\text{central angle}}{360^\circ} \times A$.
    First, find the total area of the circle: $A = \pi(6)^2 = 36\pi$.
    The sector covers $120^\circ$, which is $\frac{120}{360} = \frac{1}{3}$ of the full circle.
    Sector Area = $\frac{1}{3} \times 36\pi = 12\pi\text{ m}^2$.

    Why it works:
    A sector is just a slice of pizza. If the angle is 1/3 of a full rotation, the slice contains 1/3 of the total area.

    Why the other choices fail:
    - $4\pi$ is the *arc length* of the sector ($\frac{1}{3} \times 12\pi$), not the area.
    - $36\pi$ is the total area of the whole circle.
    - $24\pi$ is a miscalculation, perhaps assuming $120/360 = 2/3$.
