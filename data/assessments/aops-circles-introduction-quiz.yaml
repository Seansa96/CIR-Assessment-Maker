questions:
- id: easy-quiz-q031
  type: multipleChoice
  prompt: A radius-6 circle has a $90^\circ$ central angle. What is the intercepted arc length?
  media:
  - {type: image, src: /assessments/aops/aops-circles-sector.svg, alt: Circle centered at O with a marked central sector and intercepted arc.}
  choices:
  - {id: a, text: '$3\pi$'}
  - {id: b, text: '$6\pi$'}
  - {id: c, text: '$9\pi$'}
  - {id: d, text: '$12\pi$'}
  answer: {choiceId: a}
  explanation: A quarter of circumference $2\pi(6)=12\pi$ is $3\pi$.
- id: easy-quiz-q011
  type: multipleChoice
  prompt: A circle has diameter $14$. What is its circumference?
  choices:
  - {id: a, text: '$7\pi$'}
  - {id: b, text: '$14\pi$'}
  - {id: c, text: '$28\pi$'}
  - {id: d, text: '$49\pi$'}
  answer: {choiceId: b}
  explanation: Use $C=\pi d$ directly.
- id: easy-quiz-q021
  type: multipleChoice
  prompt: Find the area of a disk with radius $5$.
  choices:
  - {id: a, text: '$10\pi$'}
  - {id: b, text: '$20\pi$'}
  - {id: c, text: '$25\pi$'}
  - {id: d, text: '$50\pi$'}
  answer: {choiceId: c}
  explanation: $A=\pi r^2=25\pi$ square units.
- id: easy-quiz-q001
  type: multipleChoice
  prompt: In the diagram, which labeled segment is a diameter?
  media:
  - {type: image, src: /assessments/aops/aops-circles-structure.svg, alt: Circle centered at O with radius OA, diameter BC, chord DE, and tangent at A.}
  choices:
  - {id: a, text: '$OA$'}
  - {id: b, text: '$BC$'}
  - {id: c, text: '$DE$'}
  - {id: d, text: The tangent through $A$}
  answer: {choiceId: b}
  explanation: $BC$ is the chord marked through center $O$.
- id: easy-quiz-q041
  type: multipleChoice
  prompt: Find the area of a $120^\circ$ sector in a circle of radius $6$.
  media:
  - {type: image, src: /assessments/aops/aops-circles-sector.svg, alt: Radius-6 circle with a 120-degree central sector shaded.}
  choices:
  - {id: a, text: '$6\pi$'}
  - {id: b, text: '$12\pi$'}
  - {id: c, text: '$18\pi$'}
  - {id: d, text: '$24\pi$'}
  answer: {choiceId: b}
  explanation: The sector is one third of disk area $36\pi$.
- id: easy-quiz-q032
  type: multipleChoice
  prompt: The radius of one circle is twice another's. What is the ratio of their circumferences, larger to smaller?
  media:
  - {type: image, src: /assessments/aops/aops-circles-scaling.svg, alt: Circles with radii 3 and 6 illustrating linear scaling.}
  choices:
  - {id: a, text: '$1:1$'}
  - {id: b, text: '$2:1$'}
  - {id: c, text: '$4:1$'}
  - {id: d, text: '$8:1$'}
  answer: {choiceId: b}
  explanation: Circumference is a length and scales linearly with radius.
- id: easy-quiz-q012
  type: multipleChoice
  prompt: The radius of a disk doubles. By what factor does its area change?
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$3$'}
  - {id: c, text: '$4$'}
  - {id: d, text: '$8$'}
  answer: {choiceId: c}
  explanation: |-
    Area scales by the square of the linear factor: $2^2=4$.
- id: easy-quiz-q022
  type: multipleChoice
  prompt: In the marked diagram, what is $\angle OTP$?
  media:
  - {type: image, src: /assessments/aops/aops-circles-tangent.svg, alt: Radius OT perpendicular to tangent PT at point T.}
  choices:
  - {id: a, text: '$45^\circ$'}
  - {id: b, text: '$60^\circ$'}
  - {id: c, text: '$90^\circ$'}
  - {id: d, text: '$180^\circ$'}
  answer: {choiceId: c}
  explanation: A tangent is perpendicular to the radius at the tangency point.
- id: easy-quiz-q002
  type: multipleChoice
  prompt: In the diagram, $OM\perp AB$. Which equality follows?
  media:
  - {type: image, src: /assessments/aops/aops-circles-chord.svg, alt: Circle centered at O with perpendicular OM meeting chord AB at M.}
  choices:
  - {id: a, text: '$OA=OM$'}
  - {id: b, text: '$AM=MB$'}
  - {id: c, text: '$AB=OM$'}
  - {id: d, text: '$OA=AB$'}
  answer: {choiceId: b}
  explanation: A perpendicular from the center to a chord bisects the chord.
- id: easy-quiz-q042
  type: multipleChoice
  prompt: A circle has circumference $10\pi$. What is its radius?
  choices:
  - {id: a, text: '$2.5$'}
  - {id: b, text: '$5$'}
  - {id: c, text: '$10$'}
  - {id: d, text: '$20$'}
  answer: {choiceId: b}
  explanation: $2\pi r=10\pi$ gives $r=5$.
- id: easy-quiz-q033
  type: multipleChoice
  prompt: A semicircle has radius $4$. What is its perimeter, including the diameter?
  choices:
  - {id: a, text: '$4\pi$'}
  - {id: b, text: '$4\pi+4$'}
  - {id: c, text: '$4\pi+8$'}
  - {id: d, text: '$8\pi+8$'}
  answer: {choiceId: c}
  explanation: The curved half-circumference is $4\pi$, and the diameter is $8$.
- id: easy-quiz-q013
  type: multipleChoice
  prompt: Concentric circles have radii $5$ and $3$. Find the area between them.
  choices:
  - {id: a, text: '$8\pi$'}
  - {id: b, text: '$16\pi$'}
  - {id: c, text: '$25\pi$'}
  - {id: d, text: '$34\pi$'}
  answer: {choiceId: b}
  explanation: |-
    Subtract disk areas: $\pi(5^2-3^2)=16\pi$.
- id: easy-quiz-q023
  type: selectAll
  prompt: Which statements are justified by the marked structure diagram?
  media:
  - {type: image, src: /assessments/aops/aops-circles-structure.svg, alt: Circle centered at O with labeled radius, diameter, chord, and tangent.}
  choices:
  - {id: a, text: '$OA$ is a radius.'}
  - {id: b, text: '$BC$ has length twice a radius.'}
  - {id: c, text: '$DE$ must pass through $O$.'}
  - {id: d, text: The tangent at $A$ is perpendicular to $OA$.}
  answer:
    choiceIds: [a, b, d]
  explanation: The chord $DE$ is not marked through the center, so it need not be a diameter.
- id: easy-quiz-q003
  type: selectAll
  prompt: Which statements correctly match a circle quantity with its dimension?
  choices:
  - {id: a, text: Circumference is measured in linear units.}
  - {id: b, text: Arc length is measured in linear units.}
  - {id: c, text: Sector area is measured in square units.}
  - {id: d, text: Radius is measured in square units.}
  answer:
    choiceIds: [a, b, c]
  explanation: Radius is a length, not an area.
- id: easy-quiz-q043
  type: freeResponse
  prompt: Explain why a $60^\circ$ sector of a circle has one sixth of both the full circumference as arc length and the full disk area as sector area, while the two answers use different units.
  answer:
    gradingMode: selfCheck
    expected: |-
      A full turn is $360^\circ$, so $60/360=1/6$. The central angle selects one sixth of the boundary and one sixth of the disk. Arc length is one-dimensional and uses linear units; sector area is two-dimensional and uses square units.
    keyPoints:
    - Computes $60/360=1/6$.
    - Applies the fraction to both the boundary and disk.
    - Distinguishes linear from square units.
  explanation: The angular fraction is shared, but the measured objects have different dimensions.
