lesson:
  introduction: 'In addition to the circumcenter and incenter, there are two more
    major triangle centers that we must learn: the Centroid and the Orthocenter.'
  sections:
  - id: sec-centroid
    title: The Centroid
    required: true
    content: 'The **Centroid** is the point where the three **medians** of the triangle
      intersect.


      A median is a line segment drawn from a vertex to the exact midpoint of the
      opposite side.


      The centroid is often called the "center of gravity" or "center of mass" of
      the triangle. If you cut the triangle out of cardboard, you could balance it
      perfectly on your finger at the centroid!


      **The Centroid Theorem**: The centroid divides each median into two parts with
      a $2:1$ ratio. The distance from the vertex to the centroid is exactly twice
      the distance from the centroid to the midpoint of the opposite side.'
    media:
    - type: image
      src: /assessments/geometry/triangle_centroid.png
      alt: Triangle Centroid
      caption: The centroid is the intersection of the medians.
  - id: sec-orthocenter
    title: The Orthocenter
    required: true
    content: 'The **Orthocenter** is the point where the three **altitudes** of the
      triangle intersect.


      An altitude is a line segment drawn from a vertex perpendicular (at a $90^\circ$
      angle) to the opposite side (or an extension of the opposite side). You can
      think of the altitude as the "height" of the triangle from that base.


      Like the circumcenter, the orthocenter can be inside the triangle (acute), on
      the vertex of the right angle (right), or outside the triangle (obtuse).'
    media:
    - type: image
      src: /assessments/geometry/triangle_orthocenter.png
      alt: Triangle Orthocenter
      caption: The orthocenter is the intersection of the altitudes.
questions:
- id: q-geom-cent2-1
  title: Concept Check - The Centroid Theorem
  prompt: In $\triangle ABC$, the median from vertex $A$ intersects side $BC$ at point
    $M$. The centroid is point $G$. If the distance from $G$ to $M$ ($GM$) is 4 units,
    what is the distance from vertex $A$ to the centroid ($AG$)?
  type: numericResponse
  answer:
    numericValue: 8
    tolerance: 0
  explanation: 'The centroid divides the median in a $2:1$ ratio. The segment from
    the vertex to the centroid ($AG$) is twice as long as the segment from the centroid
    to the midpoint ($GM$).

    $$AG = 2 \times GM = 2 \times 4 = 8$$'
  skills:
  - geometry-triangle-centers
- id: q-geom-cent2-2
  title: Concept Check - The Orthocenter
  prompt: Which set of lines intersect to form the orthocenter of a triangle?
  type: multipleChoice
  choices:
  - id: c1
    text: Angle bisectors
  - id: c2
    text: Medians
  - id: c3
    text: Altitudes
  - id: c4
    text: Perpendicular bisectors
  answer:
    choiceId: c3
  explanation: The orthocenter is the intersection of the **altitudes** (the heights)
    of the triangle.
  skills:
  - geometry-triangle-centers
