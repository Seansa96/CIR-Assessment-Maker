- id: we002
  title: Approximate a square root near one
  problem: Use the quadratic binomial approximation to estimate $\sqrt{1.04}$.
  steps:
  - id: step003
    title: Identify the small input
    instruction: Match $\sqrt{1.04}$ with $\sqrt{1+x}$.
