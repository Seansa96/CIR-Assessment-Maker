lesson:
  introduction: Potential Energy and Conservative Forces
  sections:
  - id: sec-q001
    title: Conservative Forces vs. Non-Conservative Forces
    content: |
      **Conservative Forces vs. Non-Conservative Forces**

      In Physics, a force is called **conservative** if the work it does on an object moving between two points is completely independent of the path taken. Gravity is a perfect example. If you lift a book $2\ \text{m}$ straight up, gravity does the exact same amount of negative work as if you carried the book up a zigzagging staircase to the same $2\ \text{m}$ height.

      A force is **non-conservative** if the work done depends on the path. Friction is non-conservative because dragging an object along a longer, zigzagging path generates more heat and results in more negative work done by friction.

      Which of the following is the defining property of a conservative force?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: The work done by the force depends only on the initial and final positions,
          not on the path taken.
      - id: c2
        text: The force always acts in the direction of motion.
      - id: c3
        text: The work done by the force is always positive.
      - id: c4
        text: The force only exists in a vacuum.
      answer:
        choiceId: c1
        gradingMode: auto
      explanation: |
        The definition of a conservative force is that the work done, $W = \int \vec{F} \cdot d\vec{r}$, is path-independent. Because it only depends on the endpoints, we can define a "potential energy" associated with those positions!
  - id: sec-q002
    title: Defining Potential Energy
    content: |
      **Defining Potential Energy**

      Because the work done by a conservative force is path-independent, we can invent a scalar function called **Potential Energy**, denoted $U$. We define the change in potential energy, $\Delta U$, as the *negative* of the work done by the conservative force:

      $$
      \Delta U = -W_c = -\int_{x_i}^{x_f} F_x dx
      $$

      Why the negative sign? If gravity (a conservative force) does *positive* work on a falling apple, the apple's potential energy must *decrease*. If gravity does *negative* work (like when you throw the apple upward), the potential energy must *increase*.

      If a spring does $15\ \text{J}$ of positive work on a mass attached to it, what happens to the potential energy of the spring system?
    check:
      id: check-q002
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: "It increases by $15 \text{J}$."
      - id: c2
        text: "It decreases by $15 \text{J}$."
      - id: c3
        text: It remains unchanged.
      - id: c4
        text: "It decreases by $30 \text{J}$."
      answer:
        choiceId: c2
        gradingMode: auto
      explanation: |
        Using the definition $\Delta U = -W_c$, if the work done by the spring force is $W_c = +15\ \text{J}$, then $\Delta U = -15\ \text{J}$. The potential energy decreases.
  - id: sec-q003
    title: Gravitational Potential Energy
    content: |
      **Gravitational Potential Energy**

      Near the surface of the Earth, the gravitational force is roughly constant: $F_y = -mg$ (assuming up is the positive $y$-direction).

      Using our definition $\Delta U = -\int F_y dy$, we can find the potential energy change when moving from $y_i$ to $y_f$:

      $$
      \Delta U_g = -\int_{y_i}^{y_f} (-mg) dy = mg(y_f - y_i) = mgh
      $$

      If we choose to set $U_g = 0$ at the ground ($y=0$), then the gravitational potential energy of an object at height $h$ is simply $U_g = mgh$.

      A $2.0\ \text{kg}$ block is lifted from a table ($1.0\ \text{m}$ high) to a shelf ($3.0\ \text{m}$ high). What is the change in gravitational potential energy? (Use $g = 9.8\ \text{m/s}^2$).
    check:
      id: check-q003
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: "$19.6 \text{J}$"
      - id: c2
        text: "$39.2 \text{J}$"
      - id: c3
        text: "$58.8 \text{J}$"
      - id: c4
        text: "$78.4 \text{J}$"
      answer:
        choiceId: c2
        gradingMode: auto
      explanation: |
        The change in height is $\Delta y = 3.0\ \text{m} - 1.0\ \text{m} = 2.0\ \text{m}$.
        $\Delta U_g = mg\Delta y = (2.0\ \text{kg})(9.8\ \text{m/s}^2)(2.0\ \text{m}) = 39.2\ \text{J}$.
  - id: sec-q004
    title: Elastic Potential Energy
    content: |
      **Elastic Potential Energy**

      Consider a block attached to a horizontal ideal spring. The force exerted by the spring follows Hooke's Law: $F_x = -kx$, where $x$ is the displacement from the relaxed equilibrium position.

      Calculate the change in potential energy $\Delta U_s$ when the spring is stretched from $x_i = 0$ to some final displacement $x_f = x$.

      *(Hint: Use the definition $\Delta U = -\int_{0}^{x} F_x dx$, substituting $F_x = -kx$)*
    check:
      id: check-q004
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: '$\frac{1}{2}kx^2$'
      - id: b
        text: '$-\frac{1}{2}kx^2$'
      - id: c
        text: '$kx^2$'
      - id: d
        text: '$-kx$'
      answer:
        choiceId: a
      explanation: |
        By definition:
        $$
        \Delta U_s = -\int_{0}^{x} (-kx) dx = \int_{0}^{x} kx dx
        $$
        Evaluating this integral yields:
        $$
        \Delta U_s = \left[ \frac{1}{2}kx^2 \right]_0^x = \frac{1}{2}kx^2
        $$
        This tells us that the potential energy stored in an ideal spring is $U_s = \frac{1}{2}kx^2$.
  - id: sec-q005
    title: 'The Big Picture: Reversibility'
    content: |
      **The Big Picture: Reversibility**

      Potential energy is essentially "stored" energy. When a conservative force does negative work (like tossing a ball up, working against gravity), energy is stored as potential energy. As the ball falls back down, gravity does positive work, converting that stored potential energy back into kinetic energy.

      This complete reversibility is why potential energy is only defined for conservative forces. If you slide a block across a rough table, friction does negative work and generates heat. Can this thermal energy be seamlessly converted back into organized kinetic energy by sliding the block backwards?
    check:
      id: check-q005
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: c1
        text: Yes, because all forms of energy are completely reversible.
      - id: c2
        text: No, friction is a non-conservative force, and the energy dissipated
          as heat cannot simply be recovered as organized mechanical energy.
      answer:
        choiceId: c2
        gradingMode: auto
      explanation: |
        Correct! Non-conservative forces like friction dissipate mechanical energy into microscopic thermal motion, which cannot be reversed just by returning to the original position. Therefore, there is no "frictional potential energy."
