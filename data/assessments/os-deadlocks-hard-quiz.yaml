questions:
- id: q001
  title: Apply Deadlock definition
  type: multipleChoice
  prompt: A system design discussion mentions **Deadlock definition**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Deadlock is not just slowness.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Deadlock is not just slowness. This is why Deadlock definition matters in Deadlocks.
- id: q002
  title: Apply Four necessary conditions
  type: multipleChoice
  prompt: A system design discussion mentions **Four necessary conditions**. Which conclusion is most defensible?
  choices:
  - id: a
    text: Breaking any one condition prevents deadlock.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: Breaking any one condition prevents deadlock. This is why Four necessary conditions matters in Deadlocks.
