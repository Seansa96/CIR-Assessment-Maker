lesson:
  introduction: |
    Why can you smell perfume from across the room? How does helium leak out of a tied balloon over time? Both of these phenomena describe the movement of gas molecules — processes known as **diffusion** and **effusion**. They depend directly on the mass of the gas molecules and their kinetic energy.
  sections:
    - id: sec-definitions
      title: Defining Diffusion and Effusion
      required: true
      content: |
        - **Diffusion** is the gradual mixing of gas molecules by random motion and collisions. When you open a bottle of perfume, the scent molecules slowly diffuse through the air to reach your nose. The rate of diffusion is relatively slow because the molecules constantly collide with air molecules, taking a zigzag "random walk" path.
        - **Effusion** is the process by which a gas under pressure escapes from a container through a tiny hole (a pinhole) into a vacuum or lower-pressure region. For example, a helium balloon shrinking over a few days is due to effusion through microscopic pores in the rubber.

        Both processes are governed by how fast the molecules are moving.
      check:
        id: chk-effusion-1
        type: multipleChoice
        prompt: |
          Which of the following scenarios best describes **effusion**?
        choices:
          - id: a
            text: A drop of food coloring spreading throughout a glass of water.
          - id: b
            text: The smell of baking cookies spreading from the kitchen to the living room.
          - id: c
            text: Air slowly leaking out of a tiny puncture in a bicycle tire.
          - id: d
            text: Stirring sugar into a cup of coffee.
        answer:
          choiceId: c
        explanation: |
          Effusion specifically refers to gas escaping through a tiny opening (like a puncture in a tire or pores in a balloon). Spreading of a scent or food coloring is diffusion (mixing through space/collisions).

    - id: sec-rms-speed
      title: Root-Mean-Square (rms) Speed
      required: true
      content: |
        The rate at which a gas effuses or diffuses depends directly on its molecular speed. We often calculate the **root-mean-square (rms) speed**, denoted as $u_{rms}$, which is a type of average molecular speed.

        $$u_{rms} = \sqrt{\frac{3RT}{M}}$$

        **Crucial details for this formula:**
        - $R = 8.314$ J/(mol·K) (You must use the SI value for energy here!)
        - $T$ = Temperature in Kelvin
        - $M$ = Molar mass in **kg/mol** (You MUST convert g/mol to kg/mol to get speed in m/s).

        *Key takeaway:* Heavier molecules (large $M$) move **slower**. Hotter molecules (large $T$) move **faster**.
      check:
        id: chk-effusion-2
        type: multipleChoice
        prompt: |
          If you have samples of $H_2$ (2 g/mol), $N_2$ (28 g/mol), and $CO_2$ (44 g/mol) all at the exact same temperature, which gas molecules have the **highest** average speed ($u_{rms}$)?
        choices:
          - id: a
            text: '$CO_2$'
          - id: b
            text: '$N_2$'
          - id: c
            text: '$H_2$'
          - id: d
            text: They all have the same average speed because they are at the same temperature.
        answer:
          choiceId: c
        explanation: |
          While they all have the same average *kinetic energy* (because T is the same), the **lightest** molecules must travel the **fastest** to maintain that kinetic energy. $H_2$ has the lowest molar mass, so it has the highest $u_{rms}$.

    - id: sec-grahams-law
      title: Graham's Law of Effusion
      required: true
      content: |
        Because effusion rate is directly proportional to rms speed, we can compare the effusion rates of two different gases ($r_1$ and $r_2$) at the same temperature and pressure using **Graham's Law**:

        $$\frac{r_1}{r_2} = \sqrt{\frac{M_2}{M_1}}$$

        Notice the inverse relationship: the rate of gas 1 is over gas 2 on the left, but molar mass $M_2$ is over $M_1$ on the right.

        This tells us that the rate of effusion is inversely proportional to the square root of the gas's molar mass. **Lighter gases effuse faster.** For example, Helium (4 g/mol) will effuse much faster than Argon (40 g/mol), which is why He balloons deflate faster than air-filled balloons.
      check:
        id: chk-effusion-3
        type: numericResponse
        prompt: |
          A sample of Helium ($M = 4.0$ g/mol) and a sample of Methane ($CH_4$, $M = 16.0$ g/mol) are placed in identical porous containers at the same temperature. How many times faster will the Helium effuse compared to the Methane?
        answer:
          value: 2.0
          tolerance: 0.1
        explanation: |
          Using Graham's Law:
          $$\frac{r_{He}}{r_{CH_4}} = \sqrt{\frac{M_{CH_4}}{M_{He}}} = \sqrt{\frac{16.0}{4.0}} = \sqrt{4.0} = 2.0$$
          Helium effuses exactly 2 times faster than Methane.
