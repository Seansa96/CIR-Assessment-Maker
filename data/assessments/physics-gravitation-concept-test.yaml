questions:
  - id: grav-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students confuse the inverse-square law distance dependence."
    prerequisiteObjectiveIds: [physics-newtons-law-universal-gravitation]
    extensionObjectiveIds: [physics-newtons-law-universal-gravitation]
    prompt: |
      If the distance between the centers of two massive spherical objects is tripled, how does the gravitational force between them change?
    choices:
      - id: a
        text: 'It becomes 1/3 as strong.'
      - id: b
        text: 'It becomes 1/9 as strong.'
      - id: c
        text: 'It becomes 3 times as strong.'
      - id: d
        text: 'It becomes 9 times as strong.'
    answer:
      choiceId: b
    explanation: |
        Solution: Newton's Law of Universal Gravitation is $F = G \frac{m_1 m_2}{r^2}$.
        
        Why it works: The force is inversely proportional to the *square* of the distance ($r$). If $r \rightarrow 3r$, then the denominator becomes $(3r)^2 = 9r^2$, making the new force $1/9$ of the original.
        
        Why the other choices fail: A factor of 1/3 would imply an inverse-linear relationship ($1/r$).

  - id: grav-q02
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Newton's Third Law in gravitation."
    prerequisiteObjectiveIds: [physics-newtons-law-universal-gravitation]
    extensionObjectiveIds: [physics-newtons-law-universal-gravitation]
    prompt: |
      The Earth is much more massive than the Moon. How does the gravitational force exerted by the Earth on the Moon compare to the gravitational force exerted by the Moon on the Earth?
    choices:
      - id: a
        text: 'The Earth exerts a much larger force on the Moon.'
      - id: b
        text: 'The Moon exerts a much larger force on the Earth.'
      - id: c
        text: 'They exert exactly the same magnitude of force on each other.'
      - id: d
        text: 'The forces depend on their orbital speeds, not just their masses.'
    answer:
      choiceId: c
    explanation: |
        Solution: This is a direct application of Newton's Third Law (action-reaction).
        
        Why it works: Gravitation is a mutual interaction between two masses, described by the single term $G(M_E M_M)/r^2$. Both objects experience this exact same force magnitude, just in opposite directions.
        
        Why the other choices fail: The Earth accelerates much less because it has more mass ($a = F/m$), but the interaction force itself is perfectly symmetric.

  - id: grav-q03
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Superposition of gravitational fields."
    prerequisiteObjectiveIds: [physics-gravitational-fields]
    extensionObjectiveIds: [physics-gravitational-fields]
    prompt: |
      At a point exactly halfway between two identical stars, what is the net gravitational field (acceleration due to gravity, $g$)?
    choices:
      - id: a
        text: 'It is twice the field of a single star.'
      - id: b
        text: 'It is exactly zero.'
      - id: c
        text: 'It points toward the closer star.'
      - id: d
        text: 'It depends on the mass of the object placed there.'
    answer:
      choiceId: b
    explanation: |
        Solution: Gravitational fields are vectors and obey the superposition principle.
        
        Why it works: The field from the left star points left, and the field from the right star points right. Because the masses and distances are identical, the magnitudes are equal. They perfectly cancel each other out, yielding a net field of zero.
        
        Why the other choices fail: Adding them (twice the field) ignores their vector nature. A field exists independently of a test mass placed within it.

  - id: grav-q04
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Why astronauts are weightless."
    prerequisiteObjectiveIds: [physics-newtons-law-universal-gravitation]
    extensionObjectiveIds: [physics-gravitational-fields]
    prompt: |
      Astronauts inside the International Space Station (ISS) float around and appear "weightless." Why does this happen?
    choices:
      - id: a
        text: 'They are so far from Earth that gravity is effectively zero.'
      - id: b
        text: 'The ISS shields them from Earth''s gravitational field.'
      - id: c
        text: 'Both the astronauts and the ISS are in continuous free fall toward Earth at the same rate.'
      - id: d
        text: 'Centrifugal force pushes them exactly counter to gravity.'
    answer:
      choiceId: c
    explanation: |
        Solution: Orbit is fundamentally a state of continuous free-fall.
        
        Why it works: At ISS altitude (about 400 km), Earth's gravity is still about 90% as strong as on the surface. However, both the station and the astronauts are falling toward Earth at the same acceleration. Because they are falling together, there is no normal force between them, creating the sensation of weightlessness.
        
        Why the other choices fail: Gravity is not zero. Centrifugal force is a fictitious force in a rotating frame; in an inertial frame, only gravity acts on them.

  - id: grav-q05
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Gravitational potential energy sign convention."
    prerequisiteObjectiveIds: [physics-gravitational-potential-energy]
    extensionObjectiveIds: [physics-gravitational-potential-energy]
    prompt: |
      Why is the universal gravitational potential energy ($U = -G\frac{m_1 m_2}{r}$) conventionally defined as a negative value?
    choices:
      - id: a
        text: 'Because gravity is an attractive force, so work done by gravity is always negative.'
      - id: b
        text: 'To set the zero point of potential energy at an infinite distance, representing an unbound state.'
      - id: c
        text: 'Because masses are always positive, making the fraction negative.'
      - id: d
        text: 'To ensure that kinetic energy is always greater than potential energy.'
    answer:
      choiceId: b
    explanation: |
        Solution: The reference point for potential energy is arbitrary, but $r = \infty$ is mathematically convenient.
        
        Why it works: We define $U=0$ when objects are infinitely far apart (no interaction). As they fall toward each other, gravity does positive work, meaning the potential energy must *decrease*. Since it starts at zero and decreases, it becomes negative. A negative $U$ indicates a "bound" system.
        
        Why the other choices fail: Gravity does positive work when objects fall together. Kinetic energy can be less than the magnitude of potential energy.

  - id: grav-q06
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Kepler's Second Law implications."
    prerequisiteObjectiveIds: [physics-keplers-laws]
    extensionObjectiveIds: [physics-keplers-laws]
    prompt: |
      According to Kepler's Second Law (a line segment joining a planet and the Sun sweeps out equal areas during equal intervals of time), what happens to a planet's speed as it orbits?
    choices:
      - id: a
        text: 'It moves fastest when it is closest to the Sun (perihelion).'
      - id: b
        text: 'It moves fastest when it is farthest from the Sun (aphelion).'
      - id: c
        text: 'It maintains a constant speed throughout its orbit.'
      - id: d
        text: 'Its speed depends only on its mass, not its position.'
    answer:
      choiceId: a
    explanation: |
        Solution: Kepler's Second Law is a direct consequence of the conservation of angular momentum ($L = mvr$).
        
        Why it works: To sweep out the same area in the same time when the "radius" (distance to the Sun) is short, the arc length traveled must be longer. Thus, the planet must move faster at perihelion.
        
        Why the other choices fail: Constant speed only applies to perfectly circular orbits, not elliptical ones.

  - id: grav-q07
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Orbital speed dependence."
    prerequisiteObjectiveIds: [physics-satellite-orbits-energy]
    extensionObjectiveIds: [physics-satellite-orbits-energy]
    prompt: |
      Two satellites, A (mass 1000 kg) and B (mass 2000 kg), are placed in the exact same circular orbit around Earth. How do their orbital speeds compare?
    choices:
      - id: a
        text: 'Satellite B must move faster to stay in orbit.'
      - id: b
        text: 'Satellite A must move faster to stay in orbit.'
      - id: c
        text: 'They must move at the exact same orbital speed.'
      - id: d
        text: 'It depends on the physical size of the satellites.'
    answer:
      choiceId: c
    explanation: |
        Solution: The required centripetal force is provided by gravity: $G\frac{mM_E}{r^2} = m\frac{v^2}{r}$.
        
        Why it works: The mass of the satellite ($m$) cancels out on both sides of the equation. This yields $v = \sqrt{GM_E/r}$. The orbital speed depends only on the mass of the central body ($M_E$) and the orbital radius ($r$).
        
        Why the other choices fail: A heavier satellite experiences more gravitational force, but it also has more inertia, so the required speed to maintain the orbit remains identical.

  - id: grav-q08
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Geosynchronous orbit requirements."
    prerequisiteObjectiveIds: [physics-satellite-orbits-energy]
    extensionObjectiveIds: [physics-satellite-orbits-energy]
    prompt: |
      To maintain a geostationary orbit (appearing stationary over a single point on Earth's equator), a satellite must have:
    choices:
      - id: a
        text: 'A specific mass and a specific altitude.'
      - id: b
        text: 'A specific altitude, but any mass is acceptable.'
      - id: c
        text: 'A specific mass, but any altitude is acceptable.'
      - id: d
        text: 'A highly elliptical orbit.'
    answer:
      choiceId: b
    explanation: |
        Solution: A geostationary orbit requires the satellite's orbital period to exactly match Earth's rotational period (24 hours).
        
        Why it works: By Kepler's Third Law ($T^2 \propto r^3$), a 24-hour period strictly dictates exactly one specific orbital radius (about 35,786 km above the equator). As established earlier, orbital parameters are entirely independent of the satellite's mass.
        
        Why the other choices fail: Mass does not affect orbital periods or speeds.

  - id: grav-q09
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Escape velocity independence of direction."
    prerequisiteObjectiveIds: [physics-escape-velocity]
    extensionObjectiveIds: [physics-escape-velocity]
    prompt: |
      Escape velocity is the minimum speed required to permanently leave a celestial body's gravitational influence. Does the required escape speed depend on the launch angle? (Ignore air resistance and planetary rotation).
    choices:
      - id: a
        text: 'Yes, it must be launched straight up.'
      - id: b
        text: 'Yes, launching at an angle requires a higher speed.'
      - id: c
        text: 'No, it is a scalar quantity derived purely from energy conservation.'
      - id: d
        text: 'No, because gravity only acts horizontally.'
    answer:
      choiceId: c
    explanation: |
        Solution: Escape velocity is an energy concept: $K + U = 0$.
        
        Why it works: As long as the initial kinetic energy ($\frac{1}{2}mv^2$) is greater than or equal to the magnitude of the gravitational potential energy, the object has enough energy to reach infinity. Since kinetic energy is a scalar (directionless), the launch angle doesn't matter (assuming the trajectory doesn't intersect the planet).
        
        Why the other choices fail: Velocity is a vector, but the *speed* (kinetic energy) required to escape relies on scalar energy budgets.

  - id: grav-q10
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Kepler's Third Law."
    prerequisiteObjectiveIds: [physics-keplers-laws]
    extensionObjectiveIds: [physics-keplers-laws]
    prompt: |
      Planet X is twice as far from the Sun as Planet Y. According to Kepler's Third Law, how does Planet X's orbital period ($T_X$) compare to Planet Y's period ($T_Y$)?
    choices:
      - id: a
        text: '$T_X$ is exactly 2 times $T_Y$.'
      - id: b
        text: '$T_X$ is exactly 4 times $T_Y$.'
      - id: c
        text: '$T_X$ is more than 2 times $T_Y$ but less than 4 times $T_Y$.'
      - id: d
        text: '$T_X$ is exactly 8 times $T_Y$.'
    answer:
      choiceId: c
    explanation: |
        Solution: Kepler's Third Law states $T^2 \propto r^3$.
        
        Why it works: If $r$ increases by a factor of 2, $r^3$ increases by a factor of 8. Therefore, $T^2$ increases by a factor of 8. This means $T$ increases by a factor of $\sqrt{8} \approx 2.82$.
        
        Why the other choices fail: A factor of 2 assumes a linear relationship ($T \propto r$). A factor of 4 assumes $T \propto r^2$. A factor of 8 assumes $T \propto r^3$.

  - id: grav-q11
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Total mechanical energy of a circular orbit."
    prerequisiteObjectiveIds: [physics-satellite-orbits-energy]
    extensionObjectiveIds: [physics-satellite-orbits-energy]
    prompt: |
      For a satellite in a stable circular orbit around Earth, how does its kinetic energy ($K$) compare to its gravitational potential energy ($U$)?
    choices:
      - id: a
        text: '$K$ is positive and equal in magnitude to $U$.'
      - id: b
        text: '$K = -\frac{1}{2}U$'
      - id: c
        text: '$K = -2U$'
      - id: d
        text: '$K$ and $U$ are unrelated in orbit.'
    answer:
      choiceId: b
    explanation: |
        Solution: This is the Virial Theorem for inverse-square forces in circular orbits.
        
        Why it works: $U = -GMm/r$. Using centripetal force $mv^2/r = GMm/r^2$, we find $K = \frac{1}{2}mv^2 = \frac{1}{2}GMm/r$. Therefore, $K = -\frac{1}{2}U$. Note that since $U$ is negative, $K$ is positive. The total energy is $E = K + U = \frac{1}{2}U$.
        
        Why the other choices fail: A stable bound orbit always has a negative total energy, meaning the magnitude of $U$ must be strictly greater than $K$.

  - id: grav-q12
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Black hole event horizon conceptualization."
    prerequisiteObjectiveIds: [physics-escape-velocity]
    extensionObjectiveIds: [physics-escape-velocity]
    prompt: |
      What defining characteristic dictates the radius of a black hole's event horizon (the Schwarzschild radius)?
    choices:
      - id: a
        text: 'The distance where gravity becomes infinite.'
      - id: b
        text: 'The distance where the local speed of light becomes zero.'
      - id: c
        text: 'The distance at which the escape velocity equals the speed of light.'
      - id: d
        text: 'The distance where the black hole''s mass is physically located.'
    answer:
      choiceId: c
    explanation: |
        Solution: Escape velocity is $v_{esc} = \sqrt{2GM/R}$.
        
        Why it works: The event horizon marks the boundary of no return. By setting $v_{esc} = c$ (the speed of light) and solving for $R$, we find the Schwarzschild radius $R_s = 2GM/c^2$. Inside this radius, not even light is fast enough to escape.
        
        Why the other choices fail: Gravity is not infinite at the event horizon (only at the singularity). The speed of light is a universal constant. The mass is located entirely at the central singularity, not at the event horizon boundary.

  - id: grav-q13
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Gravitational field inside a hollow shell."
    prerequisiteObjectiveIds: [physics-gravitational-fields]
    extensionObjectiveIds: [physics-gravitational-fields]
    prompt: |
      Imagine a massive, perfectly spherical hollow shell. What is the net gravitational field produced by the shell at any point *inside* the hollow cavity?
    choices:
      - id: a
        text: 'It is greatest near the inner surface and zero at the center.'
      - id: b
        text: 'It points toward the nearest part of the shell.'
      - id: c
        text: 'It is exactly zero everywhere inside.'
      - id: d
        text: 'It is constant and non-zero everywhere inside.'
    answer:
      choiceId: c
    explanation: |
        Solution: This is Newton's Shell Theorem.
        
        Why it works: Because gravitational force follows an inverse-square law, if you stand closer to one wall inside the shell, the stronger pull of the near wall is perfectly canceled by the weaker pull of the larger amount of mass on the far wall. The vector sum is identically zero everywhere inside.
        
        Why the other choices fail: An inverse-cube or linear law would not cancel perfectly. In reality, gravity perfectly cancels inside a uniform spherical shell.

  - id: grav-q14
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Changing orbits."
    prerequisiteObjectiveIds: [physics-satellite-orbits-energy]
    extensionObjectiveIds: [physics-satellite-orbits-energy]
    prompt: |
      If a satellite in a low circular orbit wants to transfer to a higher circular orbit, what must happen to its total mechanical energy and its final orbital speed?
    choices:
      - id: a
        text: 'Energy increases; final speed increases.'
      - id: b
        text: 'Energy increases; final speed decreases.'
      - id: c
        text: 'Energy decreases; final speed increases.'
      - id: d
        text: 'Energy decreases; final speed decreases.'
    answer:
      choiceId: b
    explanation: |
        Solution: Analyze $E = -GMm/(2r)$ and $v = \sqrt{GM/r}$.
        
        Why it works: To reach a higher orbit (larger $r$), the spacecraft must fire its thrusters to add energy (total energy becomes less negative, so it increases). However, at the new, higher altitude, the required orbital speed $v \propto 1/\sqrt{r}$ is actually slower than it was in the lower orbit.
        
        Why the other choices fail: This counterintuitive result (adding energy makes you end up going slower) is a fundamental feature of orbital mechanics.

  - id: grav-q15
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Tidal forces conceptualization."
    prerequisiteObjectiveIds: [physics-gravitational-fields]
    extensionObjectiveIds: [physics-gravitational-fields]
    prompt: |
      What physical mechanism is primarily responsible for the ocean tides on Earth?
    choices:
      - id: a
        text: 'The overall strength of the Moon''s gravitational pull on Earth''s oceans.'
      - id: b
        text: 'The difference (gradient) in the Moon''s gravitational pull across the diameter of the Earth.'
      - id: c
        text: 'The centrifugal force of the Earth''s daily rotation.'
      - id: d
        text: 'The magnetic interaction between the Earth and the Moon.'
    answer:
      choiceId: b
    explanation: |
        Solution: Tides are caused by differential gravity (tidal forces).
        
        Why it works: The side of Earth facing the Moon is closer and feels a stronger pull than the center of the Earth. The side opposite the Moon feels a weaker pull. This *difference* stretches the Earth and its oceans along the Earth-Moon axis, creating two high tide bulges.
        
        Why the other choices fail: The Sun exerts a stronger overall gravitational force on Earth than the Moon does, but the Moon causes stronger tides because it is much closer, making the *gradient* (difference across Earth) steeper.

  - id: grav-q16
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Dependence of g on planetary properties."
    prerequisiteObjectiveIds: [physics-newtons-law-universal-gravitation]
    extensionObjectiveIds: [physics-newtons-law-universal-gravitation]
    prompt: |
      Planet Z has exactly the same mass as Earth, but its radius is half of Earth's radius. What is the acceleration due to gravity ($g_Z$) on the surface of Planet Z compared to Earth's $g$?
    choices:
      - id: a
        text: '$g_Z = 4g$'
      - id: b
        text: '$g_Z = 2g$'
      - id: c
        text: '$g_Z = g/2$'
      - id: d
        text: '$g_Z = g/4$'
    answer:
      choiceId: a
    explanation: |
        Solution: Surface gravity is $g = GM/R^2$.
        
        Why it works: The mass $M$ is unchanged. The radius $R$ is halved ($R \rightarrow R/2$). Because $R$ is squared in the denominator, $(R/2)^2 = R^2/4$. Dividing by $1/4$ is equivalent to multiplying by 4.
        
        Why the other choices fail: The relationship is inverse-square, not inverse-linear.

  - id: grav-q17
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Potential energy of extended systems."
    prerequisiteObjectiveIds: [physics-gravitational-potential-energy]
    extensionObjectiveIds: [physics-gravitational-potential-energy]
    prompt: |
      Three equal masses are arranged in an equilateral triangle. What represents the total gravitational potential energy of this system?
    choices:
      - id: a
        text: 'The potential energy of any single pair.'
      - id: b
        text: 'The sum of the potential energies of all three distinct pairs.'
      - id: c
        text: 'Zero, due to symmetry.'
      - id: d
        text: 'It cannot be calculated without an external reference mass.'
    answer:
      choiceId: b
    explanation: |
        Solution: System potential energy is the energy required to assemble the system from infinity.
        
        Why it works: You must account for the interaction between every unique pair of masses. For masses A, B, and C, the total energy is $U_{total} = U_{AB} + U_{BC} + U_{CA}$.
        
        Why the other choices fail: Symmetry does not cancel potential energy (which is a scalar, unlike fields/forces which are vectors and can cancel). It is an intrinsic property of the system.

  - id: grav-q18
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Kepler's First Law implications."
    prerequisiteObjectiveIds: [physics-keplers-laws]
    extensionObjectiveIds: [physics-keplers-laws]
    prompt: |
      According to Kepler's First Law, planets orbit the Sun in ellipses. Where is the Sun located in this geometry?
    choices:
      - id: a
        text: 'At the exact geometric center of the ellipse.'
      - id: b
        text: 'At one of the two foci of the ellipse.'
      - id: c
        text: 'Along the semi-minor axis.'
      - id: d
        text: 'It constantly shifts between the two foci.'
    answer:
      choiceId: b
    explanation: |
        Solution: Kepler's First Law (Law of Ellipses).
        
        Why it works: A bound orbit governed by an inverse-square force is an ellipse, with the central massive body (the Sun) located at one of the focal points. The other focal point is empty space.
        
        Why the other choices fail: A circle is a special case of an ellipse where both foci merge at the center. For general planetary orbits, the Sun is offset from the center.

  - id: grav-q19
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Work done by gravity in orbit."
    prerequisiteObjectiveIds: [physics-satellite-orbits-energy]
    extensionObjectiveIds: [physics-satellite-orbits-energy]
    prompt: |
      How much work is done by the gravitational force on a satellite during one complete circular orbit around the Earth?
    choices:
      - id: a
        text: 'Positive work, because gravity keeps it in orbit.'
      - id: b
        text: 'Negative work, because gravity pulls it inward.'
      - id: c
        text: 'Zero work.'
      - id: d
        text: 'It depends on the satellite''s mass.'
    answer:
      choiceId: c
    explanation: |
        Solution: Work is $W = \int \vec{F} \cdot d\vec{s}$.
        
        Why it works: In a circular orbit, the gravitational force (which points to the center) is always exactly perpendicular to the displacement (which is tangent to the circle). Since the dot product of perpendicular vectors is zero, gravity does zero work. Consequently, the satellite's kinetic energy and speed remain perfectly constant.
        
        Why the other choices fail: Gravity does work only in elliptical orbits (speeding it up toward perihelion, slowing it down toward aphelion), but over one full closed cycle of any orbit, the net work is zero because gravity is a conservative force.

  - id: grav-q20
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Gravity inside a solid sphere."
    prerequisiteObjectiveIds: [physics-gravitational-fields]
    extensionObjectiveIds: [physics-gravitational-fields]
    prompt: |
      Imagine a tunnel bored straight through the center of the Earth to the other side. Assuming Earth is a sphere of uniform density, how does the gravitational force change as a dropped object falls from the surface toward the center?
    choices:
      - id: a
        text: 'The force increases according to the inverse-square law.'
      - id: b
        text: 'The force remains constant.'
      - id: c
        text: 'The force decreases linearly, becoming zero at the center.'
      - id: d
        text: 'The force is immediately zero once it goes underground.'
    answer:
      choiceId: c
    explanation: |
        Solution: By the Shell Theorem, only the mass *closer* to the center than the object contributes to the net pull.
        
        Why it works: As the object falls, the "effective" mass pulling it inward decreases proportionally to $r^3$. The inverse square law strengthens the pull by $1/r^2$. The net result ($r^3/r^2 = r$) is that the internal gravitational force is directly proportional to the radius $r$. It decreases linearly and vanishes at the exact center.
        
        Why the other choices fail: It doesn't increase, because the outer shells of mass pull backward, perfectly canceling out.
