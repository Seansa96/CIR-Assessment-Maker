workedExamples:
- id: aops-pop-we-1
  title: 'Finding the Radius'
  prompt: 'From an external point $P$, a tangent $PT$ of length 12 is drawn to a circle. A secant $PAB$ is also drawn such that it passes through the center of the circle. If the external segment $PA$ is 8, find the radius of the circle.'
  steps:
  - id: step-1
    title: Apply the Tangent-Secant Theorem
    prompt: Set up the equation relating the tangent and the secant segments to find the total length of the secant, $PB$.
    difficultyDimensions:
    - Write $(PT)^2 = PA \cdot PB$.
    - Substitute the known values.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $(12)^2 = 8 \cdot PB$.
      - $144 = 8 \cdot PB$.
      - $PB = 18$.
    explanation: |
      Solution:
      The Tangent-Secant Theorem states that $(PT)^2 = PA \cdot PB$.
      Substituting the given lengths:
      $$12^2 = 8 \cdot PB$$
      $$144 = 8 \cdot PB$$
      $$PB = \frac{144}{8} = 18$$

      Why it works:
      The product of the secant segments is constant and must equal the tangent squared.
  - id: step-2
    title: Find the length of the internal chord
    prompt: Use the lengths of $PA$ and $PB$ to find the length of the chord $AB$.
    difficultyDimensions:
    - Recognize that $PB = PA + AB$.
    - Subtract $PA$ from $PB$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AB = PB - PA$.
      - $AB = 18 - 8 = 10$.
    explanation: |
      Solution:
      The total secant length $PB$ is composed of the external segment $PA$ and the internal chord $AB$.
      $$PB = PA + AB$$
      $$18 = 8 + AB$$
      $$AB = 10$$

      Why it works:
      This separates the secant into its geometric components.
  - id: step-3
    title: Determine the radius
    prompt: Use the specific property of this secant (that it passes through the center) to find the radius.
    difficultyDimensions:
    - Identify that chord $AB$ is a diameter.
    - Halve the diameter to find the radius.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Since the secant passes through the center, chord $AB$ is a diameter.
      - Radius $r = AB / 2 = 10 / 2 = 5$.
    explanation: |
      Solution:
      The problem states that the secant $PAB$ passes through the center of the circle.
      Any chord that passes through the center is a diameter of the circle.
      Therefore, the diameter is $AB = 10$.
      The radius is half the diameter: $r = 5$.

      Why it works:
      This problem creatively combines the general secant theorem with the specific definition of a diameter to find the radius without requiring the Pythagorean theorem on $\triangle PTO$.

- id: aops-pop-we-2
  title: 'Using the Algebraic Definition'
  prompt: 'Point $P$ is at a distance of 13 from the center of a circle. A secant through $P$ intersects the circle at $A$ and $B$, such that $PA = 9$. If the length of the chord $AB$ is 7, find the radius of the circle.'
  steps:
  - id: step-1
    title: Find the geometric product
    prompt: Calculate the total length of the secant $PB$ and find the product $PA \cdot PB$.
    difficultyDimensions:
    - Add $PA$ and $AB$ to find $PB$.
    - Multiply $PA \cdot PB$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $PB = PA + AB = 9 + 7 = 16$.
      - $PA \cdot PB = 9 \cdot 16 = 144$.
    explanation: |
      Solution:
      The total secant is $PB = PA + AB = 9 + 7 = 16$.
      The product of the secant segments is:
      $$PA \cdot PB = 9 \times 16 = 144$$

      Why it works:
      This product is constant for any line drawn through $P$ intersecting the circle.
  - id: step-2
    title: Use the algebraic power formula
    prompt: Equate the geometric product to the algebraic definition of Power ($d^2 - R^2$) to solve for the radius $R$.
    difficultyDimensions:
    - Set $d^2 - R^2 = 144$.
    - Substitute $d = 13$.
    - Solve for $R$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $d^2 - R^2 = 144$.
      - $13^2 - R^2 = 144$.
      - $169 - R^2 = 144 \implies R^2 = 25$.
      - $R = 5$.
    explanation: |
      Solution:
      The geometric product of the secant segments equals the algebraic power of point $P$.
      $$\text{Power}(P) = d^2 - R^2 = 144$$
      We are given the distance from $P$ to the center is $d = 13$.
      $$13^2 - R^2 = 144$$
      $$169 - R^2 = 144$$
      $$R^2 = 169 - 144 = 25$$
      $$R = 5$$

      Why it works:
      The algebraic definition allows us to connect the purely geometric lengths ($PA, PB$) directly to the core properties of the circle ($d, R$) without drawing any auxiliary right triangles.

- id: aops-pop-we-3
  title: 'Hidden Cyclic Quadrilaterals'
  prompt: 'In $\triangle ABC$, altitudes $AD$ and $BE$ are drawn, intersecting at the orthocenter $H$. Prove that $CD \cdot CB = CE \cdot CA$.'
  steps:
  - id: step-1
    title: Identify the right angles
    prompt: Use the definition of an altitude to find right angles that will help us find a cyclic quadrilateral.
    difficultyDimensions:
    - State that altitudes meet the opposite sides at $90^\circ$.
    - Identify $\angle ADC = 90^\circ$ and $\angle BEC = 90^\circ$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $AD \perp BC$, so $\angle ADC = 90^\circ$.
      - $BE \perp AC$, so $\angle BEC = 90^\circ$.
    explanation: |
      Solution:
      Because $AD$ and $BE$ are altitudes, they are perpendicular to the sides they intersect.
      Therefore, $\angle ADC = 90^\circ$ and $\angle BEC = 90^\circ$.

      Why it works:
      Right angles are the strongest indicator of a cyclic quadrilateral because they subtend diameters.
  - id: step-2
    title: Prove a quadrilateral is cyclic
    prompt: Use the two right angles to prove that the points $A, B, D, E$ are concyclic.
    difficultyDimensions:
    - Notice that $\angle ADB = \angle AEB = 90^\circ$.
    - Conclude that $A, B, D, E$ lie on a circle with diameter $AB$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\angle ADB = 90^\circ$ and $\angle AEB = 90^\circ$.
      - Both angles subtend the same segment $AB$.
      - Therefore, $A, B, D, E$ form a cyclic quadrilateral (with diameter $AB$).
    explanation: |
      Solution:
      Look at the segment $AB$. The angles $\angle ADB$ and $\angle AEB$ are both right angles ($90^\circ$).
      A classic theorem states that if two points subtend equal angles on the same side of a segment, the four points are concyclic.
      Because both are $90^\circ$, they are inscribed in a semicircle, meaning $A, B, D, E$ lie on a circle with $AB$ as its diameter.

      Why it works:
      Finding hidden circles is the key to Olympiad geometry.
  - id: step-3
    title: Apply the Secant-Secant Theorem
    prompt: Use the Secant-Secant Theorem from point $C$ on the newly discovered circle to complete the proof.
    difficultyDimensions:
    - Identify $C$ as an external point to the circle passing through $A, B, D, E$.
    - The secants from $C$ are $CD B$ and $CE A$.
    - Write the power of point $C$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $C$ is an external point.
      - The secants are the lines $CB$ (intersecting at $D, B$) and $CA$ (intersecting at $E, A$).
      - Therefore, $CD \cdot CB = CE \cdot CA$.
    explanation: |
      Solution:
      We proved that $A, B, D, E$ lie on a circle.
      Point $C$ is located outside this circle.
      The line $BC$ acts as a secant intersecting the circle at $D$ and $B$.
      The line $AC$ acts as a secant intersecting the circle at $E$ and $A$.
      By the Secant-Secant Theorem (Power of Point $C$):
      $$CD \cdot CB = CE \cdot CA$$
      This completes the proof.

      Why it works:
      The theorem we wanted to prove is literally just the algebraic statement of the Secant-Secant Theorem for the cyclic quadrilateral we found.
