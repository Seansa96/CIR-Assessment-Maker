schemaVersion: 1
id: chemistry-reactions-reading-quiz
title: Chemical Reaction Identification Reading Check
assessmentType: quiz
categoryId: chemistry
topicId: chemistry-reactions
modeDefault: practice
randomizeQuestions: false
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Read the passage: “A complete combustion reaction of a hydrocarbon uses oxygen and forms carbon dioxide and water. The reaction pattern is useful even before coefficients are balanced.” Which products should be predicted for propane burning completely?
    choices:
      - id: a
        text: $CO_2$ and $H_2O$
      - id: b
        text: $CO$ and $H_2$
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: c
        text: $C$ and $H_2O_2$
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: d
        text: A metal and an acid
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: Complete hydrocarbon combustion produces $CO_2$ and $H_2O$. Why it works: Carbon forms carbon dioxide and hydrogen forms water when oxygen is abundant. Why the other choices fail: They describe incomplete combustion, unrelated products, or a different reaction family.'
    difficultyDimensions: [modelOrDerivation, representationTransfer]
    difficultyEvidence: Reads a reaction-family definition and applies it to a named hydrocarbon.
    skills: [chemistry-reactions]
    subjectDifficultyTags: [combustion, reaction-identification]
  - id: q002
    type: multipleChoice
    prompt: |
      Read the passage: “In a synthesis reaction, two or more reactants combine to make one product. In a decomposition reaction, one compound breaks into two or more simpler products.” Which equation is decomposition?
    choices:
      - id: a
        text: $2Mg+O_2\rightarrow2MgO$
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: b
        text: $CaCO_3\rightarrow CaO+CO_2$
      - id: c
        text: $Zn+2HCl\rightarrow ZnCl_2+H_2$
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: d
        text: $AgNO_3+NaCl\rightarrow AgCl+NaNO_3$
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
    answer: { choiceId: b }
    explanation: 'Solution: $CaCO_3$ breaks into $CaO$ and $CO_2$, so it is decomposition. Why it works: One compound becomes multiple products. Why the other choices fail: a is synthesis, c is single replacement, and d is double replacement.'
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    difficultyEvidence: Maps reactant/product counts to the synthesis and decomposition pattern definitions.
    skills: [chemistry-reactions]
    subjectDifficultyTags: [synthesis-decomposition, reaction-identification]
  - id: q003
    type: multipleChoice
    prompt: |
      Read the passage: “Single replacement has the pattern $A+BC\rightarrow AC+B$: an element replaces another element in a compound. Double replacement has the pattern $AB+CD\rightarrow AD+CB$: two ionic partners exchange.” Which pattern describes $Zn+2HCl\rightarrow ZnCl_2+H_2$?
    choices:
      - id: a
        text: Single replacement
      - id: b
        text: Double replacement
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: c
        text: Decomposition
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: d
        text: Combustion
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: It is single replacement: zinc replaces hydrogen in hydrochloric acid, producing zinc chloride and hydrogen gas. Why it works: An element plus a compound yields a new compound plus a displaced element. Why the other choices fail: Two compounds do not exchange partners, one compound does not split, and oxygen combustion is absent.'
    difficultyDimensions: [modelOrDerivation, representationTransfer]
    difficultyEvidence: Interprets an equation by tracking which element is displaced from an ionic compound.
    skills: [chemistry-reactions]
    subjectDifficultyTags: [single-replacement, reaction-identification]
  - id: q004
    type: multipleChoice
    prompt: |
      Read the passage: “A double-replacement mixture is a precipitation reaction only when one possible new pairing forms an insoluble solid. Spectator ions remain aqueous.” When $AgNO_3(aq)$ and $NaCl(aq)$ are mixed, what identifies the reaction?
    choices:
      - id: a
        text: $AgCl(s)$ forms, so the reaction is a precipitation reaction.
      - id: b
        text: $NaNO_3(s)$ forms because all exchanged products are solids.
        issueSignals: [{ id: precipitate-solubility-error, domains: [chemistry] }]
      - id: c
        text: No reaction occurs because both reactants are soluble.
        issueSignals: [{ id: precipitate-solubility-error, domains: [chemistry] }]
      - id: d
        text: It is combustion because a new compound forms.
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: $AgCl(s)$ is the insoluble product, so the mixture undergoes precipitation; $Na^+$ and $NO_3^-$ remain spectators. Why it works: Soluble reactants can exchange ions and then produce an insoluble solid. Why the other choices fail: Only the silver chloride pairing precipitates, and the pattern is not combustion.'
    difficultyDimensions: [domainCondition, representationTransfer]
    difficultyEvidence: Applies a solubility condition to distinguish a precipitating double replacement from no reaction.
    skills: [chemistry-reactions]
    subjectDifficultyTags: [precipitation, double-replacement]
  - id: q005
    type: multipleChoice
    prompt: |
      Read the passage: “Redox reactions involve electron transfer. Oxidation is loss of electrons and reduction is gain. A reaction can fit another pattern, such as single replacement or combustion, and still be redox.” Which observation is direct evidence of redox?
    choices:
      - id: a
        text: At least one element’s oxidation state increases while another’s decreases.
      - id: b
        text: Two aqueous solutions are mixed, regardless of the products.
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: c
        text: The equation contains two reactants.
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: d
        text: A reaction has any coefficient greater than one.
        issueSignals: [{ id: oxidation-state-assignment-error, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: Opposite oxidation-state changes show that electrons were transferred: one species was oxidized and another reduced. Why it works: Oxidation-state bookkeeping tracks redox electron movement. Why the other choices fail: Reactant count, aqueous mixing, and coefficients do not by themselves establish electron transfer.'
    difficultyDimensions: [modelOrDerivation, errorDiagnosis]
    difficultyEvidence: Distinguishes the defining redox evidence from superficial equation features.
    skills: [chemistry-reactions]
    subjectDifficultyTags: [redox, oxidation-state]
  - id: q006
    type: multipleChoice
    prompt: |
      Read the passage: “Reaction labels can overlap. Combustion is identified by reaction with oxygen and characteristic products, while redox is identified by oxidation-state change. A combustion reaction is therefore often also redox.” How should $CH_4+2O_2\rightarrow CO_2+2H_2O$ be classified?
    choices:
      - id: a
        text: Combustion and redox
      - id: b
        text: Only precipitation
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: c
        text: Only double replacement
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
      - id: d
        text: Neither, because more than one label is not allowed
        issueSignals: [{ id: reaction-type-misidentified, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: Methane reacting with oxygen to form carbon dioxide and water is combustion, and carbon and oxygen change oxidation states, so it is also redox. Why it works: Pattern labels describe different features of the same reaction. Why the other choices fail: No aqueous ion exchange or insoluble solid is involved, and labels are not mutually exclusive.'
    difficultyDimensions: [casePartition, modelOrDerivation, representationTransfer]
    difficultyEvidence: Integrates two classification criteria and recognizes that reaction families can overlap.
    skills: [chemistry-reactions]
    subjectDifficultyTags: [combustion, redox, reaction-identification]
