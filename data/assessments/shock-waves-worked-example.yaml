workedExamples:
- id: we-shock-waves
  title: Deriving and applying Shock Waves
  problem: Use the labeled model to derive and calculate the Mach angle from $\sin\theta=v/v_s$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the speed of the source $v_s$ and the speed of sound $v$.
    prompt: 'Identify the speeds.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Speeds v_s and v'
    explanation: >-
      The problem provides the speed of the jet and the local speed of sound.
  - id: step2
    title: State the assumptions
    instruction: >-
      Verify the condition for a shock wave.
    prompt: 'Is $v_s > v$?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Yes, source is supersonic.'
    explanation: >-
      A shock wave only forms if the source is supersonic ($v_s > v$).
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want to find the Mach cone half-angle $\theta$.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Mach angle \theta'
    explanation: >-
      Calculate the angle $\theta$ of the shock wave cone.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the geometric relation for the Mach cone angle.
    prompt: 'Write the equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: '\sin\theta = v / v_s'
    explanation: >-
      $\sin\theta = \frac{v}{v_s}$
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the angle $\theta$ using the inverse sine function.
    prompt: 'Isolate $	heta$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: '\theta = \arcsin(v/v_s)'
    explanation: >-
      $\theta = \arcsin\left(\frac{v}{v_s}\right)$
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $v = 330$ m/s and $v_s = 660$ m/s, calculate $\theta$ in degrees.
    prompt: 'Calculate $	heta$.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      value: 30.0
      tolerance: 0.3
    explanation: >-
      $\theta = \arcsin(330 / 660) = \arcsin(0.5) = 30^\circ$.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the Mach number for context.
    prompt: 'What is the Mach number?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Mach 2'
    explanation: >-
      $M = v_s / v = 660 / 330 = 2.0$. It is flying at Mach 2.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated Mach cone angle.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      value: 30.0
      tolerance: 0.3
    explanation: >-
      The cone half-angle is $30^\circ$.
