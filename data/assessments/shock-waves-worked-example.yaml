workedExamples:
- id: we-shock-waves
  title: Deriving and applying Shock Waves
  problem: Use the labeled model to derive and calculate the Mach angle from $\sin\theta=v/v_s$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the speed of the source $v_s$ and the speed of sound $v$.
    prompt: 'Identify the speeds.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Identify source speed $v_s$ and sound speed $v$. Why it works: their ratio determines whether a Mach cone exists and its angle.'
  - id: step2
    title: State the assumptions
    instruction: >-
      Verify the condition for a shock wave.
    prompt: 'Is $v_s > v$?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Verify $v_s>v$. Why it works: the source must outrun the waves it emits to form a shock cone.'
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target: we want to find the Mach cone half-angle $\theta$.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Target the Mach-cone half-angle $\theta$. Why it works: it geometrically describes the shock-wave boundary.'
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the geometric relation for the Mach cone angle.
    prompt: 'Write the equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: Write $\sin\theta=v/v_s$. Why it works: the right triangle compares wavefront radius with source travel distance in the same time.'
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the angle $\theta$ using the inverse sine function.
    prompt: 'Isolate $	heta$.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: $\theta=\arcsin(v/v_s)$. Why it works: inverse sine isolates the cone half-angle from the geometric ratio.'
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given $v = 330$ m/s and $v_s = 660$ m/s, calculate $\theta$ in degrees.
    prompt: 'Calculate $	heta$.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      value: 30.0
      tolerance: 0.3
    explanation: 'Solution: $\theta=\arcsin(330/660)=30^\circ$. Why it works: the source speed is twice the sound speed, so the sine ratio is one-half.'
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the Mach number for context.
    prompt: 'What is the Mach number?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      gradingMode: selfCheck
    explanation: 'Solution: $M=v_s/v=660/330=2.0$. Why it works: Mach number is the source-to-sound speed ratio.'
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated Mach cone angle.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    answer:
      value: 30.0
      tolerance: 0.3
    explanation: 'Solution: The cone half-angle is $30^\circ$. Why it works: it is the inverse-sine result for the stated supersonic speed ratio.'
- id: shock-mach-we002
  title: Mach Angle for a Faster Aircraft
  problem: An aircraft flies at Mach $2.5$. Find its Mach-cone half-angle.
  steps:
  - id: shock-mach-we002-step-1
    title: Set the Mach-angle relation
    instruction: 'Complete this step.'
    type: symbolicResponse
    prompt: Write the relation for $\theta$ in terms of Mach number $M$.
    answer: {expectedLatex: '\theta=\arcsin\left(\frac{1}{M}\right)', equivalenceMode: expression, tolerance: 0}
    explanation: 'Solution: $\theta=\arcsin(1/M)$. Why it works: $\sin\theta=1/M$ follows directly from shock-cone geometry.'
  - id: shock-mach-we002-step-2
    title: Calculate the angle
    instruction: 'Complete this step.'
    type: numericResponse
    prompt: Calculate the half-angle in degrees.
    answer: {value: 23.58, tolerance: 0.1}
    explanation: 'Solution: $\theta=\arcsin(1/2.5)=23.58^\circ$. Why it works: higher Mach number produces a narrower cone.'
