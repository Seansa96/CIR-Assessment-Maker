questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: In an AC circuit containing only a capacitor, what is the phase relationship between the current
    and the voltage?
  explanation: 'Solution:

    For a capacitor, $I$ leads $V$ by $90^\circ$ (or $\pi/2$ radians). (ELI the ICE man: in a Capacitor,
    I leads E).


    Why it works:

    Because $I = C \frac{dV}{dt}$, the current is the derivative of the sine wave voltage, resulting in
    a cosine wave (shifted $+90^\circ$).

    Why the other choices fail: Voltage leading is for inductors. In phase is for resistors.'
  choices:
  - id: a
    text: Current leads voltage by 90 degrees.
  - id: b
    text: Voltage leads current by 90 degrees.
  - id: c
    text: They are in phase.
  - id: d
    text: Current leads voltage by 180 degrees.
  answer:
    choiceId: a
