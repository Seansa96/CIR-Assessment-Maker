workedExamples:
  - id: classify-solid
    title: Classify a Solid from Its Formula and Properties
    problem: |
      A solid sample has the formula $\text{SiO}_2$, a very high melting point, does not conduct electricity as a solid,
      and is hard and brittle. Identify its solid type and explain the particle arrangement.
    steps:
      - id: identify-bonding
        title: Identify the bonding model
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Decide whether the substance is ionic, molecular, metallic, or covalent-network.
        instruction: |
          Silicon dioxide is a **covalent-network solid**. It is not made of individual $\text{SiO}_2$ molecules;
          covalent bonds extend through a three-dimensional network.
      - id: connect-properties
        title: Connect structure to properties
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Explain the high melting point and lack of conductivity.
        instruction: |
          Many strong covalent bonds must be broken to melt the network. Its electrons are localized in bonds, so it
          does not have mobile charge carriers for electrical conduction.
  - id: compare-solids
    title: Compare Ionic and Molecular Solids
    problem: |
      Compare sodium chloride, $\text{NaCl}$, with solid carbon dioxide, $\text{CO}_2$.
      Predict which has the higher melting point and which can conduct electricity when molten.
    steps:
      - id: classify-both
        title: Identify particles and attractions
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Identify the particles held together in each solid.
        instruction: |
          $\text{NaCl}$ is an ionic lattice of cations and anions held by electrostatic attraction. Solid $\text{CO}_2$
          is a molecular solid of discrete nonpolar molecules held mainly by London dispersion forces.
      - id: predict-properties
        title: Predict melting and conductivity
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Make both predictions before checking the reasoning.
        instruction: |
          $\text{NaCl}$ has the higher melting point because ionic attractions are much stronger than dispersion forces.
          Molten $\text{NaCl}$ conducts because its ions can move; neither solid has mobile ions in the rigid lattice.
  - id: particle-motion
    title: Particle Motion Across States
    problem: |
      Describe the arrangement and motion of particles in a solid, liquid, and gas of the same molecular substance.
    steps:
      - id: state-comparison
        title: Compare the three states
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Write a one-sentence comparison for each state.
        instruction: |
          In a solid, particles vibrate about fixed positions. In a liquid, particles remain close together but slide
          past one another. In a gas, particles are far apart and move rapidly in random directions.
