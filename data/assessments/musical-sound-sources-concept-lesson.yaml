lesson:
  introduction: This lesson develops Sources of Musical Sound from a diagram, a mathematical model, and
    a calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      Musical instruments generate sound through standing waves. The physical system typically involves a source of vibration (like a bowed string, a reed, or vibrating lips) coupled with a resonant cavity (the body of a violin, or the tube of a flute) that amplifies specific frequencies.
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The primary measurable quantities are the fundamental frequency (which determines the perceived pitch), and the amplitudes of the higher harmonics (which determine the timbre or tone quality of the instrument).
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model of a musical note is a Fourier series: a superposition of many sine waves. $y(t) = \sum A_n \sin(2\pi f_n t)$. The fundamental is $f_1$, and the overtones are $f_2, f_3$, etc.
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
  - id: s4
    title: Calculus connection
    content: >-
      Calculus and Fourier analysis prove that any complex periodic waveform can be decomposed into a sum of simple harmonic waves. The shape of the waveform dictates the relative amplitudes $A_n$ of each harmonic component.
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
  - id: s5
    title: Derivation or justification
    content: >-
      When an instrument is played, the boundary conditions of the resonant cavity dictate which harmonics $f_n$ are physically allowed to form standing waves. A clarinet (closed-open cylinder) emphasizes odd harmonics ($1f_1, 3f_1, 5f_1$). A flute (open-open cylinder) plays all integer harmonics.
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, a frequency spectrum plots amplitude vs frequency, appearing as a series of vertical spikes at the harmonic frequencies. The unique envelope of these spikes is the "fingerprint" (timbre) of the instrument.
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
  - id: s7
    title: Quantitative strategy
    content: >-
      A quantitative strategy for analyzing instruments is finding the wave speed $v$ inside the medium, applying the correct boundary condition formula ($v/2L$ vs $v/4L$), and then mapping out the allowed overtone series.
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: Two different instruments playing the same fundamental pitch will have identical spacing between their harmonic spikes on a frequency axis, but the height of those spikes will differ completely.
    media:
    - type: image
      src: /media/physics/owa/musical-sound-sources.svg
      alt: Labeled original schematic for Sources of Musical Sound used for quantitative analysis.
      caption: Sources of Musical Sound model diagram.
