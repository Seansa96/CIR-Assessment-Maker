questions:
  - { id: q001, type: freeResponse, prompt: 'For $r=1+2\cos\theta$, find the two consecutive zero angles that bound the negative-radius interval and explain the resulting graph feature.', answer: { gradingMode: selfCheck, keyPoints: ['two pi over three', 'four pi over three', 'negative radius', 'inner loop'] }, explanation: 'Solution: Set one plus two cosine theta equal to zero to get theta equals two pi over three and four pi over three. Between them r is negative, producing the inner loop on opposite rays. Why it works: Zeros reach the pole and sign changes reverse the radius direction. Common trap: Treating the interval as an outer-loop segment.', difficultyDimensions: [auxiliaryTechnique, domainCondition, representationTransfer], difficultyEvidence: 'Solves a trig threshold, signs the interval, and maps it to a loop.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-graph-symmetry] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q002, type: freeResponse, prompt: 'Convert $r=4/(1-\cos\theta)$ to a Cartesian equation and identify its conic type.', answer: { gradingMode: selfCheck, keyPoints: ['r minus r cosine equals four', 'radical minus x equals four', 'y squared equals eight x plus sixteen', 'parabola'] }, explanation: 'Solution: Multiply to get $r-r\cos\theta=4$, substitute $r=\sqrt{x^2+y^2}$ and r cosine theta equals x, then square to obtain $y^2=8x+16$, a parabola. Why it works: Polar radius is distance from the pole. Common trap: Squaring before isolating the radical and losing the domain condition.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Converts coordinate systems, isolates a radical, and classifies the resulting conic.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-conversion] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q003, type: freeResponse, prompt: 'Explain why $r=\cos(4\theta)$ should not be graphed as a single loop over $0\le\theta\le2\pi$.', answer: { gradingMode: selfCheck, keyPoints: ['eight petals', 'zeros delimit petals', 'negative r', 'full interval traces multiple components'] }, explanation: 'Solution: Even n gives 2n, so there are eight petals. Zeros of cosine 4 theta delimit individual petals, while the full interval traces many components and may retrace. Why it works: The angular frequency and signed radius control trace multiplicity. Common trap: Calling it a four-petal curve.', difficultyDimensions: [identityConstruction, globalLocalReasoning, domainCondition], difficultyEvidence: 'Uses parity, zeros, and tracing multiplicity to classify a rose.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-graph-symmetry] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q004, type: freeResponse, prompt: 'Show that $(r,\theta)$ and $(-r,\theta+\pi)$ have identical Cartesian coordinates.', answer: { gradingMode: selfCheck, keyPoints: ['cos theta plus pi negative cosine', 'sin theta plus pi negative sine', 'products agree'] }, explanation: 'Solution: $(-r)\cos(\theta+\pi)=(-r)(-\cos\theta)=r\cos\theta$, and similarly for sine. Why it works: Both trig components change sign after adding pi. Common trap: Negating r without changing angle.', difficultyDimensions: [identityConstruction, representationTransfer, proofJustification], difficultyEvidence: 'Proves coordinate equivalence through trig identities and component conversion.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-conversion] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q005, type: freeResponse, prompt: 'A graph appears symmetric about the polar axis but an algebraic test is inconclusive. Give a graphing-based verification procedure.', answer: { gradingMode: selfCheck, keyPoints: ['sample plus minus theta', 'compare r values', 'plot reflections', 'check negative r equivalence'] }, explanation: 'Solution: Evaluate matching positive and negative angles, compare radius values, and plot their points while accounting for negative r. Matching reflected locations supports the symmetry. Why it works: Symmetry is a point-set property even when a simple symbolic test is insufficient. Common trap: Trusting a rough sketch.', difficultyDimensions: [representationTransfer, estimationOrBounds, proofJustification], difficultyEvidence: 'Uses sampled data and reflected-ray geometry to verify a symmetry claim.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-graph-symmetry] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q006, type: freeResponse, prompt: 'Explain why two polar curves can intersect at the pole even if equating their radius expressions misses that point.', answer: { gradingMode: selfCheck, keyPoints: ['pole has many theta representations', 'solve each r equals zero', 'equate radii alone insufficient'] }, explanation: 'Solution: The pole has infinitely many polar angle names. Test zeros of each radius separately in addition to solving equal-r equations. Why it works: Same Cartesian point need not use the same theta representation. Common trap: Assuming every intersection shares one angle.', difficultyDimensions: [casePartition, representationTransfer, errorDiagnosis], difficultyEvidence: 'Adds a pole-specific case to an algebraic intersection method.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-conversion] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q007, type: freeResponse, prompt: 'For $r=2\cos\theta$, compare the interval $[-\pi/2,\pi/2]$ with $[0,2\pi]$ as graphing intervals.', answer: { gradingMode: selfCheck, keyPoints: ['first traces circle once', 'second includes negative r retracing', 'same locus different traversal'] }, explanation: 'Solution: The first interval traces the circle once with nonnegative radius. The second includes negative-radius values and retraces points, although the locus is the same. Why it works: Interval choice controls traversal multiplicity. Common trap: Calling all full periods one trace.', difficultyDimensions: [globalLocalReasoning, domainCondition, representationTransfer], difficultyEvidence: 'Compares two intervals by sign structure and path coverage.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-graph-symmetry] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q008, type: freeResponse, prompt: '![Polar loop](/media/calculus/polar-review-loop-sector.svg) Describe how to distinguish a dimpled limacon from one with an inner loop using only radius data.', answer: { gradingMode: selfCheck, keyPoints: ['find min radius', 'check sign', 'negative means inner loop', 'positive nonzero means dimpled'] }, explanation: 'Solution: Determine whether r reaches zero and becomes negative. A negative interval creates an inner loop; a positive minimum can produce a dimple without a loop. Why it works: Signed radius controls opposite-ray tracing. Common trap: Classifying only from a maximum radius.', difficultyDimensions: [domainCondition, representationTransfer, modelOrDerivation], difficultyEvidence: 'Uses radius extrema/sign information to classify a visual curve family.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-graph-symmetry] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q009, type: freeResponse, prompt: 'Give a procedure to construct a graph from $r=f(\theta)$ that will not lose negative-radius branches.', answer: { gradingMode: selfCheck, keyPoints: ['find zeros and symmetry', 'table angles', 'record r sign', 'plot negative r opposite ray', 'connect in theta order'] }, explanation: 'Solution: Locate zeros and symmetries, tabulate key angles with signed radii, plot negative values on opposite rays, and connect points in increasing theta order. Why it works: Polar graphing is a directed trace. Common trap: Plotting only radius magnitude.', difficultyDimensions: [modelOrDerivation, casePartition, representationTransfer], difficultyEvidence: 'Builds a stepwise graph model including sign regions and ordered tracing.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-graph-symmetry] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q010, type: freeResponse, prompt: 'Write a validation checklist for a polar graph identification or conversion answer.', answer: { gradingMode: selfCheck, keyPoints: ['coordinate conversion or equation test', 'r zeros and signs', 'symmetry', 'interval and retracing', 'sample points'] }, explanation: 'Solution: Check the coordinate conversion/equation, locate zeros and sign intervals, test symmetry, verify a one-trace interval, and sample key points. Why it works: These checks jointly validate both locus and traversal. Common trap: Identifying a family from one visual feature.', difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Audits conversion, graph construction, and tracing evidence together.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-graph-symmetry] , issueSignals: [{ id: polar-rectangular-conversion-error }, { id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: conic-section-misidentified }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
