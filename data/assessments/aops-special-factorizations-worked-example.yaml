workedExamples:
- id: aops-special-factorizations-problem-1
  title: Evaluate a large difference without large squares
  problem: Evaluate $1000001^2-999999^2$ without separately squaring either integer.
  steps:
  - id: aops-special-factorizations-p1-s1
    title: Identify the structural form
    instruction: |-
      Set $A=1000001$ and $B=999999$. The target is exactly $A^2-B^2$, so it matches the difference-of-squares identity.
    type: multipleChoice
    prompt: Which identity matches the target?
    choices:
    - id: a
      text: '$A^2-B^2=(A-B)(A+B)$'
    - id: b
      text: '$A^2-B^2=(A-B)^2$'
    - id: c
      text: '$A^2-B^2=(A+B)^2$'
    - id: d
      text: '$A^2-B^2=A(A-B)$'
    answer:
      choiceId: a
    explanation: Multiplying $(A-B)(A+B)$ cancels the mixed terms.
  - id: aops-special-factorizations-p1-s2
    title: Replace expensive operations
    instruction: |-
      Rewrite the expression as
      $$(1000001-999999)(1000001+999999).$$
      This is an identity, so no approximation has been made.
    type: multipleChoice
    prompt: What is the first factor?
    choices:
    - id: a
      text: '$1$'
    - id: b
      text: '$2$'
    - id: c
      text: '$999999$'
    - id: d
      text: '$2000000$'
    answer:
      choiceId: b
    explanation: $1000001-999999=2$.
  - id: aops-special-factorizations-p1-s3
    title: Compute the easy sum
    instruction: The second factor is $1000001+999999=2000000$.
    type: multipleChoice
    prompt: What product now represents the original expression?
    choices:
    - id: a
      text: '$2\cdot2000000$'
    - id: b
      text: '$2\cdot999999$'
    - id: c
      text: '$2000000^2$'
    - id: d
      text: '$1000001\cdot999999$'
    answer:
      choiceId: a
    explanation: The two factors are the difference $2$ and sum $2000000$.
  - id: aops-special-factorizations-p1-s4
    title: Finish the arithmetic
    instruction: Multiplying gives $2\cdot2000000=4000000$.
    type: multipleChoice
    prompt: What is the value of the original difference?
    choices:
    - id: a
      text: '$2000000$'
    - id: b
      text: '$3999998$'
    - id: c
      text: '$4000000$'
    - id: d
      text: '$4000004$'
    answer:
      choiceId: c
    explanation: The identity reduced two seven-digit squares to one doubling.
  - id: aops-special-factorizations-p1-s5
    title: Sanity-check magnitude and sign
    instruction: |-
      The expression is positive because the first base is larger. Also, two numbers about one million that differ by two have squares differing by about $2\cdot1000000\cdot2=4000000$, consistent with the exact result.
    type: multipleChoice
    prompt: Which observation best verifies the result?
    choices:
    - id: a
      text: The answer should be negative because subtraction appears.
    - id: b
      text: A positive result near four million matches the bases' size and difference.
    - id: c
      text: The answer should be near one trillion.
    - id: d
      text: Both squares are odd, so their difference must be odd.
    answer:
      choiceId: b
    explanation: The exact factorization and magnitude estimate agree.
- id: aops-special-factorizations-problem-2
  title: Find a cubic symmetric expression without finding the variables
  problem: Real numbers $p,q$ satisfy $p+q=7$ and $pq=10$. Find $p^3+q^3$ without solving for $p$ and $q$ individually.
  steps:
  - id: aops-special-factorizations-p2-s1
    title: Recognize symmetry
    instruction: |-
      The target is unchanged when $p$ and $q$ are swapped. The given sum and product are therefore natural invariants to use directly.
    type: multipleChoice
    prompt: Which pair of quantities is already known?
    choices:
    - id: a
      text: '$p-q$ and $p/q$'
    - id: b
      text: '$p+q$ and $pq$'
    - id: c
      text: '$p^2$ and $q^2$'
    - id: d
      text: '$p^3$ and $q^3$'
    answer:
      choiceId: b
    explanation: Symmetric polynomials in two variables can often be rewritten using their sum and product.
  - id: aops-special-factorizations-p2-s2
    title: Derive the needed identity
    instruction: |-
      Expand
      $$(p+q)^3=p^3+3p^2q+3pq^2+q^3.$$
      Factor the mixed terms as $3pq(p+q)$.
    type: multipleChoice
    prompt: Which identity follows?
    choices:
    - id: a
      text: '$p^3+q^3=(p+q)^3-3pq(p+q)$'
    - id: b
      text: '$p^3+q^3=(p+q)^3-pq$'
    - id: c
      text: '$p^3+q^3=(p+q)^3+3pq(p+q)$'
    - id: d
      text: '$p^3+q^3=(p+q)(p-q)$'
    answer:
      choiceId: a
    explanation: Move the mixed contribution $3pq(p+q)$ to the other side.
  - id: aops-special-factorizations-p2-s3
    title: Substitute the invariants
    instruction: Use $p+q=7$ and $pq=10$ to obtain $7^3-3(10)(7)$.
    type: multipleChoice
    prompt: What is the mixed-term contribution $3pq(p+q)$?
    choices:
    - id: a
      text: '$30$'
    - id: b
      text: '$70$'
    - id: c
      text: '$210$'
    - id: d
      text: '$343$'
    answer:
      choiceId: c
    explanation: $3\cdot10\cdot7=210$.
  - id: aops-special-factorizations-p2-s4
    title: Evaluate the target
    instruction: $7^3-210=343-210=133$, so $p^3+q^3=133$.
    type: multipleChoice
    prompt: What is $p^3+q^3$?
    choices:
    - id: a
      text: '$103$'
    - id: b
      text: '$133$'
    - id: c
      text: '$210$'
    - id: d
      text: '$343$'
    answer:
      choiceId: b
    explanation: The cubic sum is the cube of the sum minus the mixed contribution.
  - id: aops-special-factorizations-p2-s5
    title: Verify without relying on unnecessary solving
    instruction: |-
      The numbers $2$ and $5$ have sum $7$ and product $10$, so they are one compatible pair. Their cubes sum to $8+125=133$, confirming the invariant calculation. The solution did not need this reconstruction.
    type: multipleChoice
    prompt: Why was solving for $p,q$ unnecessary?
    choices:
    - id: a
      text: The target was determined by the known symmetric invariants.
    - id: b
      text: Cubes are always equal to sums.
    - id: c
      text: Every pair with sum $7$ has the same product.
    - id: d
      text: The variables were assumed to be integers.
    answer:
      choiceId: a
    explanation: The derived identity depends only on $p+q$ and $pq$.
- id: aops-special-factorizations-problem-3
  title: Climb a reciprocal-power ladder
  problem: A nonzero real number $x$ satisfies $x+1/x=3$. Find $x^4+1/x^4$ without solving for $x$.
  steps:
  - id: aops-special-factorizations-p3-s1
    title: State the domain condition
    instruction: |-
      The expression $1/x$ requires $x\ne0$. This restriction is part of the original condition and remains in force throughout the manipulation.
    type: multipleChoice
    prompt: Why is $x\ne0$ guaranteed?
    choices:
    - id: a
      text: Because $x$ appears inside a square.
    - id: b
      text: Because the original equation contains $1/x$.
    - id: c
      text: Because the right side is positive.
    - id: d
      text: Because every reciprocal is positive.
    answer:
      choiceId: b
    explanation: Division by zero would make the given equation undefined.
  - id: aops-special-factorizations-p3-s2
    title: Build the second-power sum
    instruction: |-
      Square the given relation:
      $$\left(x+\frac1x\right)^2=x^2+2+\frac1{x^2}=9.$$
    type: multipleChoice
    prompt: What is $x^2+1/x^2$?
    choices:
    - id: a
      text: '$5$'
    - id: b
      text: '$7$'
    - id: c
      text: '$9$'
    - id: d
      text: '$11$'
    answer:
      choiceId: b
    explanation: Subtract the cross term $2$ from $9$.
  - id: aops-special-factorizations-p3-s3
    title: Square the new invariant
    instruction: |-
      Now square $x^2+1/x^2=7$:
      $$\left(x^2+\frac1{x^2}\right)^2=x^4+2+\frac1{x^4}=49.$$
    type: multipleChoice
    prompt: Why does the same cross term $2$ appear again?
    choices:
    - id: a
      text: '$2(x^2)(1/x^2)=2$'
    - id: b
      text: '$x^2+1/x^2=2$'
    - id: c
      text: '$x^4=1/x^4$'
    - id: d
      text: The cross term is being ignored.
    answer:
      choiceId: a
    explanation: The reciprocal factors multiply to one.
  - id: aops-special-factorizations-p3-s4
    title: Isolate the requested expression
    instruction: Subtract $2$ from $49$ to obtain $x^4+1/x^4=47$.
    type: multipleChoice
    prompt: What is the requested value?
    choices:
    - id: a
      text: '$45$'
    - id: b
      text: '$47$'
    - id: c
      text: '$49$'
    - id: d
      text: '$51$'
    answer:
      choiceId: b
    explanation: The squared second-power sum contains the target plus $2$.
  - id: aops-special-factorizations-p3-s5
    title: Verify feasibility and method choice
    instruction: |-
      The original equation has real solutions because $x^2-3x+1=0$ has positive discriminant $5$. Both reciprocal roots yield the same symmetric power sum, so the value $47$ is well-defined without selecting one root.
    type: multipleChoice
    prompt: Why do both possible values of $x$ give the same answer?
    choices:
    - id: a
      text: They are reciprocal roots, and the target is unchanged under $x\mapsto1/x$.
    - id: b
      text: The two roots are equal.
    - id: c
      text: Fourth powers of all real numbers are equal.
    - id: d
      text: The equation has only one root.
    answer:
      choiceId: a
    explanation: Reciprocal symmetry makes the target identical for the two roots.
