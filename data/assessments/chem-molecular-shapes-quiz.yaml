modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 12
questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      The Lewis structure of $CO_2$ is O=C=O. Use the diagram's domain-counting rule. What are the electron-domain geometry and molecular geometry around carbon?
    media:
      - type: image
        src: /media/chemistry/vsepr-domain-workflow.svg
        alt: VSEPR workflow showing that each bond direction counts once when determining geometry around a central atom.
    choices:
      - id: a
        text: Trigonal planar; bent
      - id: b
        text: Linear; linear
      - id: c
        text: Tetrahedral; tetrahedral
      - id: d
        text: Linear; bent
    answer:
      choiceId: b
    explanation: Carbon has two C=O bond domains and no lone pairs. Two domains make both geometries linear.

  - id: q002
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Nitrogen in $NH_3$ has three N–H bonds and one lone pair. Which statement correctly separates the two VSEPR names?
    media:
      - type: image
        src: /media/chemistry/vsepr-four-domain-family.svg
        alt: Four-domain family diagram comparing methane, ammonia, and water as lone pairs replace bonded atoms.
    choices:
      - id: a
        text: Electron-domain geometry is trigonal pyramidal; molecular geometry is tetrahedral.
      - id: b
        text: Electron-domain geometry is tetrahedral; molecular geometry is trigonal pyramidal.
      - id: c
        text: Both geometries are trigonal planar.
      - id: d
        text: Both geometries are tetrahedral because there are four domains.
    answer:
      choiceId: b
    explanation: All four domains, including the lone pair, are tetrahedral. The three atom positions form a trigonal pyramid.

  - id: q003
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      A Lewis structure for ozone has a central O with two O–O bonding directions and one lone pair. Which molecular geometry follows after the lone-pair position is omitted from the name?
    media:
      - type: image
        src: /media/chemistry/vsepr-domain-workflow.svg
        alt: Workflow diagram showing how three domains become trigonal planar electron-domain geometry and a lone pair is omitted for molecular geometry.
    choices:
      - id: a
        text: Linear
      - id: b
        text: Bent
      - id: c
        text: Trigonal planar
      - id: d
        text: Tetrahedral
    answer:
      choiceId: b
    explanation: The central O is AX$_2$E. Three domains are trigonal planar, but two atom positions give a bent molecular geometry.

  - id: q004
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      In $ClF_3$, chlorine has three bonded fluorines and two lone pairs. Before naming the atoms-only shape, what electron-domain geometry must be assigned?
    media:
      - type: image
        src: /media/chemistry/vsepr-five-six-domain-map.svg
        alt: Diagram of trigonal-bipyramidal axial and equatorial positions for five electron domains.
    choices:
      - id: a
        text: Trigonal planar
      - id: b
        text: Tetrahedral
      - id: c
        text: Trigonal bipyramidal
      - id: d
        text: Octahedral
    answer:
      choiceId: c
    explanation: Three bonding domains plus two lone pairs make five domains, which arrange trigonal bipyramidally.

  - id: q005
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Continue the $ClF_3$ analysis. Where do its two lone pairs go in the trigonal-bipyramidal arrangement, and what molecular geometry results?
    media:
      - type: image
        src: /media/chemistry/vsepr-five-six-domain-map.svg
        alt: Diagram showing that equatorial positions have fewer 90-degree interactions than axial positions in a trigonal bipyramid.
    choices:
      - id: a
        text: Both axial; trigonal planar
      - id: b
        text: Both equatorial; T-shaped
      - id: c
        text: One axial and one equatorial; seesaw
      - id: d
        text: Both equatorial; square planar
    answer:
      choiceId: b
    explanation: 'Lone pairs favor equatorial sites, leaving two axial and one equatorial fluorine positions: a T shape.'

  - id: q006
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Xenon in $XeF_4$ has four Xe–F bonds and two lone pairs. What is the molecular geometry around xenon?
    media:
      - type: image
        src: /media/chemistry/vsepr-five-six-domain-map.svg
        alt: Octahedral position diagram showing two lone pairs in opposite positions and four atoms in a square plane.
    choices:
      - id: a
        text: Octahedral
      - id: b
        text: Square pyramidal
      - id: c
        text: Square planar
      - id: d
        text: Seesaw
    answer:
      choiceId: c
    explanation: Six total domains make an octahedral electron-domain arrangement. Opposite lone pairs leave four fluorines in a square plane.

  - id: q007
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Compare $CH_4$, $NH_3$, and $H_2O$. All have four electron domains at the central atom. Which order lists their characteristic H–center–H angles from largest to smallest?
    choices:
      - id: a
        text: $H_2O > NH_3 > CH_4$
      - id: b
        text: $CH_4 > NH_3 > H_2O$
      - id: c
        text: $NH_3 > CH_4 > H_2O$
      - id: d
        text: All are exactly 109.5°
    answer:
      choiceId: b
    explanation: As zero, one, then two lone pairs occupy the tetrahedral arrangement, their stronger repulsion progressively compresses the bond angles.

  - id: q008
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      The carbon in phosgene, $COCl_2$, has one C=O double bond and two C–Cl single bonds. What is the most defensible prediction for the Cl–C–Cl angle?
    choices:
      - id: a
        text: Exactly 109.5°, because carbon has four electrons in bonds.
      - id: b
        text: Exactly 120°, because a double bond counts as two domains.
      - id: c
        text: Less than 120°, because the C=O domain repels the C–Cl domains more strongly.
      - id: d
        text: 180°, because the double bond forces linear geometry.
    answer:
      choiceId: c
    explanation: The central carbon has three domains and a trigonal-planar ideal. The higher-density double-bond domain expands adjacent angles and compresses the angle between the two C–Cl bonds.

  - id: q009
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      A student labels $SO_2$ “trigonal planar” after counting three electron domains at sulfur. What correction is needed?
    choices:
      - id: a
        text: The count is wrong; double bonds count as two domains.
      - id: b
        text: Trigonal planar is the electron-domain geometry, but the molecular geometry is bent because sulfur has a lone pair.
      - id: c
        text: The molecular geometry is tetrahedral because sulfur is in Period 3.
      - id: d
        text: The molecule is linear because both bonds involve oxygen.
    answer:
      choiceId: b
    explanation: The three-domain arrangement includes the lone pair. Molecular geometry names only the two oxygen positions.

  - id: q010
    type: numericResponse
    skills:
      - chem-molecular-shapes
    prompt: |
      In $XeF_2$, the central xenon has two Xe–F bonding domains and three lone-pair domains. How many total electron domains are around xenon?
    answer:
      value: 5
      tolerance: 0
    explanation: 'Add the two bonding directions and three lone pairs: $2+3=5$ domains.'

  - id: q011
    type: selectAll
    skills:
      - chem-molecular-shapes
    prompt: |
      Which statements follow the VSEPR workflow correctly? Select all that apply.
    choices:
      - id: a
        text: A double bond is one electron domain around the atom being analyzed.
      - id: b
        text: Molecular geometry includes lone-pair positions in its name.
      - id: c
        text: In a trigonal bipyramid, a lone pair favors an equatorial position.
      - id: d
        text: To predict A–B–C, count domains around B.
    answer:
      choiceIds:
        - a
        - c
        - d
    explanation: Double bonds occupy one direction, lone pairs are included only in electron-domain geometry, equatorial lone pairs avoid one 90° interaction, and the middle atom is the angle vertex.

  - id: q012
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Consider the local centers in $CH_3COOH$. Which set of molecular geometries is correct for the methyl carbon, carbonyl carbon, and hydroxyl oxygen, respectively?
    choices:
      - id: a
        text: Tetrahedral; trigonal planar; bent
      - id: b
        text: Tetrahedral; tetrahedral; linear
      - id: c
        text: Trigonal planar; bent; trigonal pyramidal
      - id: d
        text: Linear; trigonal planar; tetrahedral
    answer:
      choiceId: a
    explanation: The methyl carbon has four bond domains, the carbonyl carbon has three domains, and the hydroxyl oxygen has two bonds plus two lone pairs.
