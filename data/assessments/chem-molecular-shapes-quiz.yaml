id: chem-molecular-shapes-quiz
title: Shapes of Molecules Easy Quiz
assessmentType: quiz
categoryId: chemistry
topicId: chem-molecular-shapes
skills: [Apply chemistry concepts, Determine electron-domain and molecular geometry]
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [chemistry, chem-molecular-shapes, easy] }
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 12
authoring: { visualRequirement: required, visualRationale: 'Geometry classification is assessed from spatial diagrams as well as formulas.', difficultyTier: easy, sourceId: src-20260720035703-91ea51b0d8 }
questions:
  - id: q001
    type: multipleChoice
    prompt: 'The Lewis structure O=C=O has two bond directions at carbon. Which pair of geometry names is correct?'
    media: [{ type: image, src: /media/chemistry/vsepr-domain-workflow.svg, alt: Workflow showing that each bond direction counts as one domain., caption: Apply the domain-counting rule at carbon. }]
    choices: [{ id: a, text: 'Trigonal planar; bent', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: b, text: 'Linear; linear', issueSignals: [] }, { id: c, text: 'Tetrahedral; tetrahedral', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: d, text: 'Linear; bent', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }]
    answer: { choiceId: b }
    explanation: 'Solution: Both geometries are linear. Why it works: Carbon has two bonding domains and no lone pairs. Why the other choices fail: a and c use too many domains; d invents a lone-pair effect.'
    difficultyDimensions: [domainCounting, dualGeometryNaming]
    difficultyEvidence: 'Counts multiple bonds as directions and reports both labels.'
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q002
    type: multipleChoice
    prompt: '$NH_3$ has three N-H bonds and one nitrogen lone pair. Which statement is correct?'
    media: [{ type: image, src: /media/chemistry/vsepr-four-domain-family.svg, alt: Four-domain perspective family for methane, ammonia, and water., caption: Compare all-domain and atoms-only names. }]
    choices: [{ id: a, text: 'Trigonal-pyramidal electron geometry; tetrahedral molecular geometry', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: b, text: 'Tetrahedral electron geometry; trigonal-pyramidal molecular geometry', issueSignals: [] }, { id: c, text: 'Both are tetrahedral', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: d, text: 'Both are trigonal planar', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: b }
    explanation: 'Solution: Tetrahedral electron geometry and trigonal-pyramidal molecular geometry. Why it works: Four domains set the first name, while three atom positions set the second. Why the other choices fail: a reverses the labels; c counts the lone pair as an atom; d omits the lone pair.'
    difficultyDimensions: [lonePairAccounting, geometryDistinction]
    difficultyEvidence: 'Separates two names for one four-domain center.'
    issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }, { id: chemistry-vsepr-domain-count-error }]
  - id: q003
    type: multipleChoice
    prompt: 'The central O in ozone has two bonding directions and one lone pair. What is its molecular geometry?'
    choices: [{ id: a, text: Linear, issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: b, text: Bent, issueSignals: [] }, { id: c, text: Trigonal planar, issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: d, text: Tetrahedral, issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: b }
    explanation: 'Solution: Ozone is bent at the central oxygen. Why it works: AX$_2$E has three domains but only two atom positions. Why the other choices fail: Linear ignores the lone pair; trigonal planar is the electron geometry; tetrahedral requires four domains.'
    difficultyDimensions: [resonanceContext, atomsOnlyNaming]
    difficultyEvidence: 'Uses a stated resonance environment to name the local shape.'
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q004
    type: multipleChoice
    prompt: '$ClF_3$ has three bonds and two lone pairs at chlorine. What is its electron-domain geometry?'
    media: [{ type: image, src: /media/chemistry/vsepr-five-domain-family.svg, alt: Five-domain trigonal-bipyramidal family., caption: Count all five domains before naming atoms. }]
    choices: [{ id: a, text: Trigonal planar, issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: b, text: Tetrahedral, issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: c, text: Trigonal bipyramidal, issueSignals: [] }, { id: d, text: Octahedral, issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: c }
    explanation: 'Solution: The electron-domain geometry is trigonal bipyramidal. Why it works: Three bonds plus two lone pairs make five domains. Why the other choices fail: The alternatives correspond to three, four, and six domains.'
    difficultyDimensions: [domainArithmetic, fiveDomainRecognition]
    difficultyEvidence: 'Converts an AXE inventory into a domain-family name.'
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }]
  - id: q005
    type: multipleChoice
    prompt: 'Where do the two lone pairs in $ClF_3$ preferentially sit, and what shape remains?'
    choices: [{ id: a, text: 'Both axial; trigonal planar', issueSignals: [{ id: chemistry-vsepr-lone-pair-position-error }] }, { id: b, text: 'Both equatorial; T-shaped', issueSignals: [] }, { id: c, text: 'One axial and one equatorial; seesaw', issueSignals: [{ id: chemistry-vsepr-lone-pair-position-error }] }, { id: d, text: 'Both equatorial; square planar', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }]
    answer: { choiceId: b }
    explanation: 'Solution: Both lone pairs are equatorial and the atoms form a T. Why it works: Equatorial placement minimizes 90-degree interactions, leaving two axial and one equatorial fluorine. Why the other choices fail: a and c use less favorable placement; d imports a six-domain shape.'
    difficultyDimensions: [positionSelection, derivedShape]
    difficultyEvidence: 'Uses interaction counts before naming the remaining atom sites.'
    issueSignals: [{ id: chemistry-vsepr-lone-pair-position-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q006
    type: multipleChoice
    prompt: '$XeF_4$ has four bonds and two xenon lone pairs. What is its molecular geometry?'
    media: [{ type: image, src: /media/chemistry/vsepr-six-domain-family.svg, alt: Six-domain family with opposite lone pairs leaving a square plane., caption: Omit opposite lone-pair positions from the molecular name. }]
    choices: [{ id: a, text: Octahedral, issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: b, text: Square pyramidal, issueSignals: [{ id: chemistry-vsepr-lone-pair-position-error }] }, { id: c, text: Square planar, issueSignals: [] }, { id: d, text: Seesaw, issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: c }
    explanation: 'Solution: $XeF_4$ is square planar. Why it works: Six domains are octahedral and two opposite lone pairs leave four coplanar fluorines. Why the other choices fail: Octahedral includes lone-pair positions; square pyramidal has one lone pair; seesaw has five domains.'
    difficultyDimensions: [oppositePairPlacement, molecularNaming]
    difficultyEvidence: 'Derives an atoms-only shape from a six-domain arrangement.'
    issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }, { id: chemistry-vsepr-lone-pair-position-error }, { id: chemistry-vsepr-domain-count-error }]
  - id: q007
    type: multipleChoice
    prompt: 'Which order lists characteristic bond angles from largest to smallest for $CH_4$, $NH_3$, and $H_2O$?'
    media: [{ type: image, src: /media/chemistry/vsepr-angle-distortion.svg, alt: Progressive tetrahedral-angle compression with zero, one, and two lone pairs., caption: Compare the number of central lone pairs. }]
    choices: [{ id: a, text: '$H_2O>NH_3>CH_4$', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }, { id: b, text: '$CH_4>NH_3>H_2O$', issueSignals: [] }, { id: c, text: '$NH_3>CH_4>H_2O$', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }, { id: d, text: 'All are exactly 109.5 degrees', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }]
    answer: { choiceId: b }
    explanation: 'Solution: $CH_4>NH_3>H_2O$. Why it works: Increasing central lone-pair count progressively compresses the bond angle. Why the other choices fail: a and c reverse part of the trend; d treats unequal domains as ideal and equivalent.'
    difficultyDimensions: [comparativeReasoning, lonePairTrend]
    difficultyEvidence: 'Orders three related geometries using a qualitative repulsion trend.'
    issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }]
  - id: q008
    type: multipleChoice
    prompt: 'At carbon in $COCl_2$, one C=O domain and two C-Cl domains give a trigonal-planar ideal. What is the best prediction for the Cl-C-Cl angle?'
    choices: [{ id: a, text: 'Exactly 109.5 degrees', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: b, text: 'Exactly 120 degrees because every domain is identical', issueSignals: [{ id: chemistry-vsepr-angle-distortion-error }] }, { id: c, text: 'Less than 120 degrees because the C=O domain repels more strongly', issueSignals: [] }, { id: d, text: '180 degrees', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: c }
    explanation: 'Solution: Predict less than 120 degrees. Why it works: The denser C=O domain expands its adjacent angles and compresses the angle between the C-Cl domains. Why the other choices fail: a and d use wrong domain families; b ignores unequal domain density.'
    difficultyDimensions: [multipleBondDensity, qualitativeAngleRefinement]
    difficultyEvidence: 'Starts from an ideal and then applies an unequal-domain correction.'
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }, { id: chemistry-vsepr-angle-distortion-error }]
  - id: q009
    type: multipleChoice
    prompt: 'A student calls $SO_2$ trigonal planar after counting three sulfur domains. What correction is needed?'
    choices: [{ id: a, text: 'Double bonds must count twice, so the count is wrong.', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }, { id: b, text: 'Trigonal planar is the electron geometry, but the molecular geometry is bent.', issueSignals: [] }, { id: c, text: 'The molecular geometry is tetrahedral because sulfur is Period 3.', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: d, text: 'The molecule is linear because both terminal atoms are oxygen.', issueSignals: [{ id: chemistry-vsepr-domain-count-error }] }]
    answer: { choiceId: b }
    explanation: 'Solution: Keep trigonal planar as the electron geometry and report bent molecular geometry. Why it works: The lone-pair position is omitted from the atoms-only name. Why the other choices fail: a miscounts multiple bonds; c substitutes an unrelated periodic shortcut; d ignores the lone pair.'
    difficultyDimensions: [errorDiagnosis, geometryVocabulary]
    difficultyEvidence: 'Repairs a plausible partially correct student statement.'
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }, { id: chemistry-vsepr-geometry-name-confusion }]
  - id: q010
    type: numericResponse
    prompt: 'In $XeF_2$, xenon has two bonding domains and three lone-pair domains. How many total domains surround xenon?'
    answer: { value: 5, tolerance: 0 }
    explanation: 'Solution: $2+3=5$ domains. Why it works: Total domains include both central bond directions and central lone pairs.'
    difficultyDimensions: [givenInventory, exactDomainCount]
    difficultyEvidence: 'Adds two domain types while excluding terminal lone pairs.'
    issueSignals: [{ id: chemistry-vsepr-domain-count-error }]
  - id: q011
    type: selectAll
    prompt: 'Which statements correctly apply the VSEPR workflow?'
    choices: [{ id: a, text: 'A multiple bond counts as one domain direction.', issueSignals: [] }, { id: b, text: 'Molecular geometry includes lone-pair positions.', issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }] }, { id: c, text: 'A trigonal-bipyramidal lone pair favors an equatorial site.', issueSignals: [] }, { id: d, text: 'For A-B-C, analyze domains around B.', issueSignals: [] }]
    answer: { choiceIds: [a, c, d] }
    explanation: 'Solution: Select a, c, and d. Why it works: VSEPR counts directions, minimizes close interactions, and analyzes the angle vertex. Why the other choices fail: b incorrectly includes lone pairs in the molecular name.'
    difficultyDimensions: [multiRuleEvaluation, workflowTransfer]
    difficultyEvidence: 'Evaluates four independent rules across counting, positioning, and angle analysis.'
    issueSignals: [{ id: chemistry-vsepr-geometry-name-confusion }]
  - id: q012
    type: multipleChoice
    prompt: 'Which local molecular geometries describe the methyl carbon, carbonyl carbon, and hydroxyl oxygen in $CH_3COOH$, respectively?'
    media: [{ type: image, src: /media/chemistry/vsepr-multicenter-map.svg, alt: Acetic acid with three local centers highlighted., caption: Count domains separately at each highlighted atom. }]
    choices: [{ id: a, text: 'Tetrahedral; trigonal planar; bent', issueSignals: [] }, { id: b, text: 'Tetrahedral; tetrahedral; linear', issueSignals: [{ id: chemistry-vsepr-multicenter-error }] }, { id: c, text: 'Trigonal planar; bent; trigonal pyramidal', issueSignals: [{ id: chemistry-vsepr-multicenter-error }] }, { id: d, text: 'Linear; trigonal planar; tetrahedral', issueSignals: [{ id: chemistry-vsepr-multicenter-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Tetrahedral, trigonal planar, and bent. Why it works: The centers have four bond domains, three bond directions, and two bonds plus two lone pairs. Why the other choices fail: b-d miscount at least one local center or report an electron-domain name as molecular geometry.'
    difficultyDimensions: [multicenterDecomposition, geometrySequence]
    difficultyEvidence: 'Performs three distinct local analyses in one molecule.'
    issueSignals: [{ id: chemistry-vsepr-multicenter-error }]
