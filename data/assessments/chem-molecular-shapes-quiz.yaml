modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 12
questions:
  - id: q001
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      What is the molecular geometry of **methane ($CH_4$)**?
    choices:
      - id: a
        text: Trigonal planar
      - id: b
        text: Square planar
      - id: c
        text: Tetrahedral
      - id: d
        text: Trigonal pyramidal
    answer:
      choiceId: c
    explanation: |
      C in $CH_4$ has 4 C—H bonds and no lone pairs (AX₄E₀). With 4 bonding domains and 0 lone pairs, both the electron-pair geometry and molecular geometry are **tetrahedral** with ideal 109.5° bond angles.

  - id: q002
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      The VSEPR model predicts that the H—N—H bond angle in ammonia ($NH_3$) is **less than** 109.5°. What causes this compression?
    choices:
      - id: a
        text: The N—H bonds are polar, creating repulsion between the hydrogen atoms
      - id: b
        text: The lone pair on nitrogen takes up more space than a bonding pair and pushes the N—H bonds together
      - id: c
        text: Nitrogen's atomic radius is too large for 109.5°
      - id: d
        text: The trigonal planar geometry requires exactly 107°
    answer:
      choiceId: b
    explanation: |
      Lone pairs are held by only one nucleus and occupy more angular volume than bonding pairs. In $NH_3$ (AX₃E₁), the one lone pair pushes the three bonding pairs closer together, reducing the H—N—H angle from the ideal 109.5° to approximately **107°**.

  - id: q003
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      What is the molecular geometry of $CO_2$?
    choices:
      - id: a
        text: Bent (~117°)
      - id: b
        text: Linear (180°)
      - id: c
        text: Trigonal planar (120°)
      - id: d
        text: Tetrahedral (109.5°)
    answer:
      choiceId: b
    explanation: |
      C in $CO_2$ has 2 electron domains (each C=O double bond counts as 1 domain). No lone pairs on C → AX₂E₀ → **linear** geometry with 180° bond angle.

  - id: q004
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      What is the **electron-pair geometry** of a molecule with 3 bonding domains and 2 lone pairs on the central atom?
    choices:
      - id: a
        text: Trigonal planar
      - id: b
        text: Tetrahedral
      - id: c
        text: Trigonal bipyramidal
      - id: d
        text: Octahedral
    answer:
      choiceId: c
    explanation: |
      3 bonding + 2 lone pairs = **5 total electron domains**. Five electron domains arrange in a **trigonal bipyramidal** electron-pair geometry. The molecular geometry (considering only atom positions) for this AX₃E₂ type is **T-shaped** (like $ClF_3$).

  - id: q005
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Predict the molecular geometry of $SO_2$.

      (S has 2 S—O bonds and 1 lone pair; the structure is AX₂E₁)
    choices:
      - id: a
        text: Linear (180°)
      - id: b
        text: Trigonal planar (120°)
      - id: c
        text: Bent (~117°)
      - id: d
        text: Trigonal pyramidal (~107°)
    answer:
      choiceId: c
    explanation: |
      AX₂E₁: 3 total electron domains → trigonal planar **electron-pair geometry**. The lone pair on S occupies one position; the 2 O atoms are in the other two. Molecular geometry: **bent**, with a bond angle slightly less than 120° (≈119°) due to lone pair repulsion.

  - id: q006
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      What is the molecular geometry of $XeF_4$?

      (Xe has 4 Xe—F bonds and 2 lone pairs; AX₄E₂; octahedral electron-pair geometry)
    choices:
      - id: a
        text: Octahedral
      - id: b
        text: Square pyramidal
      - id: c
        text: Square planar
      - id: d
        text: Seesaw
    answer:
      choiceId: c
    explanation: |
      AX₄E₂ with octahedral electron-pair geometry: the two lone pairs minimize repulsion by occupying **opposite** axial positions (180° apart). The 4 F atoms form a square in the equatorial plane → **square planar** molecular geometry with 90° F—Xe—F angles.

  - id: q007
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      In the trigonal bipyramidal geometry, lone pairs prefer to occupy **equatorial** positions rather than axial positions. Why?
    choices:
      - id: a
        text: Equatorial positions are farther from all other atoms than axial positions
      - id: b
        text: Equatorial positions have more 90° neighbors than axial positions, causing more repulsion if a lone pair is axial
      - id: c
        text: Axial positions have more 90° interactions, so placing the lone pair (greater repulsion) equatorial minimizes total repulsion
      - id: d
        text: Lone pairs are attracted to the equatorial plane by electrostatic forces
    answer:
      choiceId: c
    explanation: |
      In the trigonal bipyramidal geometry, axial positions have three 90° neighbors (the equatorial atoms) while equatorial positions have only two 90° neighbors (the axial atoms). Since lone pairs exert stronger repulsion than bonding pairs, placing the lone pair in the equatorial position minimizes the number of 90° lone-pair interactions, reducing total repulsion.

  - id: q008
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      What is the AXₙEₘ designation and molecular geometry of **$PCl_5$**?
    choices:
      - id: a
        text: 'AX₅E₀; Trigonal bipyramidal'
      - id: b
        text: 'AX₄E₁; Seesaw'
      - id: c
        text: 'AX₅E₀; Octahedral'
      - id: d
        text: 'AX₄E₀; Tetrahedral'
    answer:
      choiceId: a
    explanation: |
      P in $PCl_5$ has 5 P—Cl bonds and **no lone pairs** (AX₅E₀). With 5 bonding domains and no lone pairs, the electron-pair geometry and molecular geometry are both **trigonal bipyramidal**. Bond angles: 120° (equatorial) and 90° (axial-equatorial).

  - id: q009
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      Both $CO_2$ and $SO_2$ contain double bonds to oxygen atoms. However, one is linear and one is bent. What is the key structural difference that explains this?
    choices:
      - id: a
        text: '$CO_2$ has more valence electrons than $SO_2$'
      - id: b
        text: '$SO_2$ has a lone pair on the sulfur atom; $CO_2$ has no lone pairs on carbon'
      - id: c
        text: '$CO_2$ has a larger bond angle because carbon is more electronegative than sulfur'
      - id: d
        text: '$SO_2$ has only single bonds despite appearing to have double bonds'
    answer:
      choiceId: b
    explanation: |
      In $CO_2$ (AX₂E₀), carbon has 2 bonding domains and **no lone pairs** → linear. In $SO_2$ (AX₂E₁), sulfur has 2 bonding domains plus **1 lone pair** → 3 total domains → bent geometry (~119°). The lone pair on S is what distinguishes the two.

  - id: q010
    type: numericResponse
    skills:
      - chem-molecular-shapes
    prompt: |
      How many **lone pairs** are on the central xenon atom in $XeF_2$?

      (Xe: Period 5, 8 valence electrons; F: 7 each; total valence e⁻ = 22; skeleton uses 4; each F gets 3 lone pairs = 12; remaining electrons go on Xe)
    answer:
      value: 3
      tolerance: 0
    explanation: |
      Total valence e⁻: $Xe(8) + 2F(14) = 22$.
      2 Xe—F bonds: 4 e⁻. Each F gets 3 lone pairs: $2 \times 6 = 12$ e⁻. Used: $4 + 12 = 16$. Remaining: $22 - 16 = 6$ → **3 lone pairs on Xe**.
      AX₂E₃ → all 3 equatorial positions occupied by lone pairs → linear molecular geometry.

  - id: q011
    type: selectAll
    skills:
      - chem-molecular-shapes
    prompt: |
      Which of the following molecules have a **trigonal planar** molecular geometry? Select all that apply.
    choices:
      - id: a
        text: '$BF_3$ (AX₃E₀)'
      - id: b
        text: '$SO_3$ (AX₃E₀)'
      - id: c
        text: '$NH_3$ (AX₃E₁)'
      - id: d
        text: '$CO_3^{2-}$ (AX₃E₀ for carbon)'
    answer:
      choiceIds:
        - a
        - b
        - d
    explanation: |
      Trigonal planar geometry requires AX₃E₀ — three bonding domains and no lone pairs. $BF_3$, $SO_3$, and the carbonate ion's carbon (AX₃E₀ in the hybrid) all qualify. $NH_3$ is AX₃E₁ (one lone pair on N) → **trigonal pyramidal**, not trigonal planar.

  - id: q012
    type: multipleChoice
    skills:
      - chem-molecular-shapes
    prompt: |
      The molecule **$SF_4$** has 4 S—F bonds and 1 lone pair on S. What is its molecular geometry?
    choices:
      - id: a
        text: Tetrahedral
      - id: b
        text: Seesaw
      - id: c
        text: Square planar
      - id: d
        text: Trigonal bipyramidal
    answer:
      choiceId: b
    explanation: |
      AX₄E₁ with 5 total electron domains → trigonal bipyramidal electron-pair geometry. The lone pair occupies an equatorial position (minimizes 90° repulsion). With the lone pair "hidden" and 4 F atoms visible: 2 axial + 2 equatorial F atoms → **seesaw** molecular geometry.
