id: chem-molecular-shapes-quiz
title: Shapes of Molecules Quiz
assessmentType: quiz
categoryId: chemistry
topicId: chem-molecular-shapes
skills:
  - Apply chemistry concepts
  - Determine electron-domain and molecular geometry
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
    - chemistry
