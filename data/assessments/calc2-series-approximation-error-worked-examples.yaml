    - id: b
      text: |-
        $\ln x$
    - id: c
      text: $x^{-2}$
    - id: d
      text: $x^2/2$
    answer:
      choiceId: a
    explanation: |-
      Solution: Evaluating $-1/x$ from $A$ to infinity gives $1/A$. Therefore the answer is $-1/x$.

      Why it works: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$. Compute derivatives at the center, divide by $n!$, and preserve the power $(x-a)^n$ before analyzing convergence.

      Common trap: Do not confuse the derivative value with its Taylor coefficient; the factorial belongs in every coefficient, including the constant term where $0!=1$.

      Why the other choices fail: $\ln x$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $x^{-2}$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$; $x^2/2$ conflicts with this criterion: The Taylor formula is $\sum_{n=0}^{\infty} f^{(n)}(a)(x-a)^n/n!$.
