      text: $b_n$ fails to approach zero.
    - id: b
      text: $b_n$ is positive.
    - id: c
      text: The signs alternate.
    - id: d
      text: $b_n$ contains a power.
    answer:
      choiceId: a
    explanation: 'Solution: Alternation alone cannot overcome a nonzero term limit. Therefore the answer is $b_n$ fails to approach zero.. Therefore the answer is $b_n$ fails to approach zero.. Therefore the answer is $b_n$ fails to approach zero.. Therefore the answer is $b_n$ fails to approach zero..


