- id: we-series-approximation-error-2
  title: Bound a positive tail by improper integrals
  problem: |
    For $\sum_{n=1}^{\infty}1/n^2$, find the least $N$ for which the
    integral-test remainder estimate guarantees $R_N<0.01$.
  steps:
  - id: step-series-approximation-error-2-1
    title: State both integral bounds
    instruction: |
      For the positive decreasing function $f(x)=1/x^2$,
      $$\int_{N+1}^{\infty}f(x)\,dx
      \le R_N\le
      \int_N^{\infty}f(x)\,dx.$$
    type: multipleChoice
    issueSignals:
    - id: power-series-expansion-error
    - id: algebraic-simplification-error
    - id: power-rule-error
    - id: exponent-rule-misapplied
    - id: chain-rule-missed
    - id: function-composition-error
    prompt: Which side is used to guarantee an upper error limit?
    choices:
    - id: a
      text: The integral beginning at $N$
    - id: b
      text: The integral beginning at $N+1$
    - id: c
      text: The average of the two integrals
    - id: d
      text: Neither integral
    answer:
      choiceId: a
    explanation: 'Solution: A sufficient accuracy guarantee needs an upper bound on the unknown tail. Therefore the answer is The integral beginning at $N$.


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


      Why the other choices fail: The integral beginning at $N+1$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; The average of the two integrals conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; Neither integral conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
  - id: step-series-approximation-error-2-2
    title: Evaluate the tail integrals
    instruction: |
      Since $\int_A^\infty x^{-2}\,dx=1/A$,
      $$\frac1{N+1}\le R_N\le\frac1N.$$
    type: multipleChoice
