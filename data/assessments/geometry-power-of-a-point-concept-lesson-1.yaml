lesson:
  introduction: |-
    Earlier, we learned three different rules for segment lengths in circles: Intersecting Chords, Intersecting Secants, and Tangent-Secant. What if I told you they are actually all the exact same rule? Welcome to the Power of a Point Theorem.
  sections:
  - id: sec-the-power
    title: Defining the Power of a Point
    required: true
    content: |-
      Let $P$ be a point anywhere in the plane, and let $O$ be the center of a circle with radius $r$. 
      
      The **Power of Point P** relative to circle $O$ is defined mathematically as the distance from $P$ to the center squared, minus the radius squared:
      $$\text{Power} = d^2 - r^2$$
      where $d = PO$.
      
      Notice what happens:
      - If $P$ is **outside** the circle, $d > r$, so the power is positive.
      - If $P$ is **on** the circle, $d = r$, so the power is $0$.
      - If $P$ is **inside** the circle, $d < r$, so the power is negative!

  - id: sec-unifying-theorem
    title: The Unifying Theorem
    required: true
    content: |-
      The amazing part is that if you draw *any* line through point $P$ that intersects the circle at points $A$ and $B$, the product of the directed distances $PA \times PB$ is always equal to the Power of Point $P$!
      
      Because the power of $P$ is constant for that specific point and circle, $PA \times PB$ is always the same, no matter what line you draw through $P$!
      
      - If $P$ is inside, $PA$ and $PB$ go in opposite directions, so their product is negative. This is the **Intersecting Chords Theorem**!
      - If $P$ is outside, this is the **Intersecting Secants Theorem**!
      - If $A$ and $B$ are the same point (the line is tangent), $PA \times PA = PA^2$. This is the **Tangent-Secant Theorem**!

questions:
- id: q-geom-pop-1
  title: Concept Check - The Power Equation
  prompt: |-
    A circle has a radius of $5$. A point $P$ is located $13$ units away from the center of the circle. What is the Power of Point $P$ relative to this circle?
  type: numericResponse
  answer:
    numericValue: 144
    tolerance: 0
  explanation: |-
    Use the formula: $\text{Power} = d^2 - r^2$.
    The distance $d$ is $13$, and the radius $r$ is $5$.
    $$\text{Power} = 13^2 - 5^2 = 169 - 25 = 144$$
  skills:
  - geometry-power-of-a-point

- id: q-geom-pop-2
  title: Concept Check - Unifying the Theorems
  prompt: |-
    If the Power of a point $P$ is zero, where is point $P$ located?
  type: multipleChoice
  choices:
  - id: c1
    text: Inside the circle
  - id: c2
    text: On the circle
  - id: c3
    text: Outside the circle
  answer:
    choiceId: c2
  explanation: |-
    The Power is $d^2 - r^2$. For the power to be zero, $d^2$ must equal $r^2$, which means the distance to the center $d$ is exactly equal to the radius $r$. This means the point is lying exactly **on the circle**.
  skills:
  - geometry-power-of-a-point
