questions:
- id: q-imp-et-1
  title: Type 1 Limit Setup
  prompt: |-
    Which limit expression correctly represents $\int_{2}^{\infty} \frac{1}{x \ln(x)} \, dx$?
  type: multipleChoice
  choices:
  - id: c1
    text: $\lim_{t \to \infty} \int_{2}^{t} \frac{1}{x \ln(x)} \, dx$
  - id: c2
    text: $\lim_{t \to 0} \int_{t}^{2} \frac{1}{x \ln(x)} \, dx$
  - id: c3
    text: $\lim_{t \to 2} \int_{t}^{\infty} \frac{1}{x \ln(x)} \, dx$
  answer:
    choiceId: c1
  explanation: |-
    Replace the infinite upper bound with a variable $t$, and take the limit as $t$ approaches infinity.
  skills:
  - calc2-improper-integrals

- id: q-imp-et-2
  title: Evaluating Type 1 Exponential
  prompt: |-
    Does $\int_{0}^{\infty} e^{-3x} \, dx$ converge or diverge? If it converges, find its value.
  type: multipleChoice
  choices:
  - id: c1
    text: Converges to $\frac{1}{3}$
  - id: c2
    text: Converges to $3$
  - id: c3
    text: Diverges
  - id: c4
    text: Converges to $0$
  answer:
    choiceId: c1
  explanation: |-
    Antiderivative is $-\frac{1}{3}e^{-3x}$.
    Evaluate from $0$ to $t$: $[-\frac{1}{3}e^{-3t}] - [-\frac{1}{3}e^{0}]$.
    As $t \to \infty$, $e^{-3t} = \frac{1}{e^{3t}} \to 0$.
    Result: $0 - (-\frac{1}{3}(1)) = \frac{1}{3}$.
  skills:
  - calc2-improper-integrals

- id: q-imp-et-3
  title: Applying the p-Test
  prompt: |-
    Use the p-test to determine if $\int_{1}^{\infty} \frac{1}{\sqrt[3]{x}} \, dx$ converges or diverges.
  type: multipleChoice
  choices:
  - id: c1
    text: Diverges because $p = 1/3 \le 1$.
  - id: c2
    text: Converges because $p = 1/3 < 1$.
  - id: c3
    text: Converges because $p = 3 > 1$.
  answer:
    choiceId: c1
  explanation: |-
    $\sqrt[3]{x} = x^{1/3}$. The power $p$ is $1/3$.
    By the p-test, the integral converges only if $p > 1$. Since $1/3$ is less than 1, it diverges.
  skills:
  - calc2-improper-integrals

- id: q-imp-et-4
  title: Type 2 Discontinuity
  prompt: |-
    Where is the infinite discontinuity in the integral $\int_{0}^{2} \frac{1}{x-2} \, dx$?
  type: multipleChoice
  choices:
  - id: c1
    text: At $x = 2$
  - id: c2
    text: At $x = 0$
  - id: c3
    text: There is no infinite discontinuity.
  answer:
    choiceId: c1
  explanation: |-
    The denominator is zero when $x - 2 = 0$, which is at $x = 2$. This is the upper bound of the integral.
  skills:
  - calc2-improper-integrals

- id: q-imp-et-5
  title: Evaluating Type 2
  prompt: |-
    Does $\int_{0}^{1} \frac{1}{\sqrt{x}} \, dx$ converge or diverge? If it converges, find its value.
  type: multipleChoice
  choices:
  - id: c1
    text: Converges to $2$
  - id: c2
    text: Converges to $1/2$
  - id: c3
    text: Diverges
  answer:
    choiceId: c1
  explanation: |-
    The discontinuity is at $x=0$.
    $\lim_{t \to 0^+} \int_{t}^{1} x^{-1/2} \, dx$.
    Antiderivative is $2x^{1/2} = 2\sqrt{x}$.
    Evaluate: $\lim_{t \to 0^+} [2\sqrt{1} - 2\sqrt{t}] = 2 - 0 = 2$.
  skills:
  - calc2-improper-integrals
