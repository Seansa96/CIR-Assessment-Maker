title: Improper Integrals Easy Test
assessmentType: test
categoryId: calculus-2
topicId: improper-integrals
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 20
skills: [limit-definitions, p-test, comparison, split-integrals]
navigation: { learningGoal: evaluate, activityType: formalTest, tags: [calculus-2, improper-integrals, easy-test] }
authoring: { visualRequirement: notApplicable, visualRationale: The test asks learners to construct the correct symbolic setup from stated boundaries and singularities., difficultyTier: easy }
questions:
- { id: q001, type: freeResponse, prompt: 'Write the defining limit for $\int_3^\infty f(x)dx$.', answer: { gradingMode: selfCheck, checkModel: '$\lim_{t\to\infty}\int_3^t f(x)dx$.' }, explanation: 'Replace the infinite upper endpoint by a finite cutoff t, then send t to infinity.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: selects the infinite-tail limit model, prerequisiteObjectiveIds: [calc2-improper-identify-and-limit] }
- { id: q002, type: freeResponse, prompt: 'Evaluate $\int_1^\infty4/x^3dx$.', answer: { gradingMode: selfCheck, checkModel: '$2$.' }, explanation: 'The truncated antiderivative is $-2/x^2$; its upper contribution tends to zero and the finite result is 2.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique], difficultyEvidence: forms a tail limit and evaluates its antiderivative, prerequisiteObjectiveIds: [calc2-improper-identify-and-limit] }
- { id: q003, type: freeResponse, prompt: 'Classify $\int_1^\infty x^{-1}dx$.', answer: { gradingMode: selfCheck, checkModel: 'Divergent.' }, explanation: 'This is the p equals one tail boundary. Its logarithmic antiderivative grows without bound.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: identifies p-test boundary at infinity, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q004, type: freeResponse, prompt: 'Evaluate $\int_0^1x^{-1/2}dx$.', answer: { gradingMode: selfCheck, checkModel: '$2$.' }, explanation: 'Use a lower cutoff; $[2\sqrt{x}]_t^1$ tends to 2 as t approaches zero from the right.', difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: uses endpoint cutoff and evaluates its limit, prerequisiteObjectiveIds: [calc2-improper-identify-and-limit] }
- { id: q005, type: freeResponse, prompt: 'Classify $\int_0^1x^{-1}dx$.', answer: { gradingMode: selfCheck, checkModel: 'Divergent.' }, explanation: 'Near zero the p equals one endpoint boundary diverges, as the logarithm becomes unbounded.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: identifies endpoint p-test boundary, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q006, type: freeResponse, prompt: 'Set up, but do not evaluate, $\int_0^2 1/(x-1)^2dx$.', answer: { gradingMode: selfCheck, checkModel: 'Split at 1 into limits from 0 to t and t to 2.' }, explanation: 'The interior asymptote creates two separate one-sided improper integrals. Ordinary convergence requires a finite limit on both sides, so neither side may be omitted or paired with the other.', difficultyDimensions: [modelOrDerivation, casePartition], difficultyEvidence: locates and partitions an interior defect, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q007, type: freeResponse, prompt: 'Classify $\int_1^\infty1/(x^2+1)dx$ by comparison.', answer: { gradingMode: selfCheck, checkModel: 'Convergent.' }, explanation: 'For x at least one, $1/(x^2+1)\le1/x^2$, and the p equals two tail converges. This is the convergent direction of direct comparison: the unknown nonnegative area is bounded above by a finite benchmark.', difficultyDimensions: [simplification, proofJustification], difficultyEvidence: establishes an upper benchmark inequality, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q008, type: freeResponse, prompt: 'Classify $\int_1^\infty1/\sqrt{x^2+1}dx$ by comparison.', answer: { gradingMode: selfCheck, checkModel: 'Divergent.' }, explanation: 'The integrand is at least $1/(\sqrt2x)$ for x at least one, so it dominates a divergent harmonic tail.', difficultyDimensions: [simplification, proofJustification], difficultyEvidence: establishes a lower divergent benchmark, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q009, type: freeResponse, prompt: 'Evaluate $\int_0^1\ln xdx$.', answer: { gradingMode: selfCheck, checkModel: '$-1$.' }, explanation: 'Use $x\ln x-x$ and a right-hand cutoff at zero; the lower expression tends to zero.', difficultyDimensions: [auxiliaryTechnique, domainCondition], difficultyEvidence: evaluates an undefined-endpoint limit, prerequisiteObjectiveIds: [calc2-improper-identify-and-limit] }
- { id: q010, type: freeResponse, prompt: 'Classify $\int_2^\infty1/[x(\ln x)^2]dx$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent.' }, explanation: 'With u equal to ln x, it becomes a u to the negative two tail, which converges. The original factor dx/x supplies du, so the logarithm changes the otherwise borderline harmonic tail into an integrable form.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: uses logarithmic substitution and transformed p-test, prerequisiteObjectiveIds: [calc2-u-substitution] }
- { id: q011, type: freeResponse, prompt: 'Classify $\int_2^\infty1/(x\ln x)dx$.', answer: { gradingMode: selfCheck, checkModel: 'Divergent.' }, explanation: 'The same substitution yields the u to the negative one boundary, whose logarithmic antiderivative is unbounded.', difficultyDimensions: [auxiliaryTechnique, domainCondition], difficultyEvidence: transforms and recognizes p equals one boundary, prerequisiteObjectiveIds: [calc2-u-substitution] }
- { id: q012, type: freeResponse, prompt: 'Evaluate $\int_0^\infty e^{-x}dx$.', answer: { gradingMode: selfCheck, checkModel: '$1$.' }, explanation: 'Only the upper tail is improper; $[-e^{-x}]_0^t$ tends to 1 as t goes to infinity.', difficultyDimensions: [modelOrDerivation, domainCondition], difficultyEvidence: isolates tail boundary and evaluates limit, prerequisiteObjectiveIds: [calc2-improper-identify-and-limit] }
- { id: q013, type: freeResponse, prompt: 'Evaluate $\int_0^\infty xe^{-x}dx$.', answer: { gradingMode: selfCheck, checkModel: '$1$.' }, explanation: 'Integration by parts gives $[-xe^{-x}-e^{-x}]_0^\infty$; exponential decay makes the upper limit zero.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation], difficultyEvidence: combines integration by parts with an improper tail limit, prerequisiteObjectiveIds: [calc2-integration-by-parts] }
- { id: q014, type: freeResponse, prompt: 'Classify $\int_0^1 1/\sqrt{1-x}dx$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent, with value 2.' }, explanation: 'After u equals one minus x, this is an endpoint p equals one-half integral, which is finite.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: moves singular endpoint and applies p-test, prerequisiteObjectiveIds: [calc2-u-substitution] }
- { id: q015, type: freeResponse, prompt: 'State the ordinary convergence requirement for $\int_{-\infty}^{\infty}f(x)dx$.', answer: { gradingMode: selfCheck, checkModel: 'Both one-sided tails must converge separately.' }, explanation: 'Choose a finite split point and require finite left and right tail limits; symmetric cancellation alone is insufficient.', difficultyDimensions: [casePartition, errorDiagnosis], difficultyEvidence: splits two tails and rejects principal-value shortcut, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q016, type: freeResponse, prompt: 'Use limit comparison to classify $\int_1^\infty(2x+1)/(x^3+7)dx$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent; it behaves like 2/x squared.' }, explanation: 'Multiplying by x squared gives a ratio tending to 2, so the integral has the same convergent behavior as the p equals two tail.', difficultyDimensions: [simplification, representationTransfer], difficultyEvidence: extracts leading-term comparison form, prerequisiteObjectiveIds: [calc2-limit-comparison] }
- { id: q017, type: freeResponse, prompt: 'For which p does $\int_1^\infty x^{-p}dx$ converge?', answer: { gradingMode: selfCheck, checkModel: 'p>1.' }, explanation: 'The infinite-tail p-test requires decay faster than 1/x; p equals one remains divergent.', difficultyDimensions: [parameterThreshold, domainCondition], difficultyEvidence: identifies threshold and its boundary, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q018, type: freeResponse, prompt: 'For which p does $\int_0^1x^{-p}dx$ converge?', answer: { gradingMode: selfCheck, checkModel: 'p<1.' }, explanation: 'At a finite singular endpoint the threshold reverses: exponents at least one produce an infinite area.', difficultyDimensions: [parameterThreshold, domainCondition], difficultyEvidence: selects endpoint threshold and boundary, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
- { id: q019, type: freeResponse, prompt: 'Explain why $\int_{-1}^11/x dx$ diverges ordinarily.', answer: { gradingMode: selfCheck, checkModel: 'Both one-sided logarithmic limits diverge; principal value cancellation is not ordinary convergence.' }, explanation: 'Splitting at zero gives independent limits to negative and positive infinity. Their paired cancellation changes the definition and cannot establish convergence.', difficultyDimensions: [casePartition, errorDiagnosis], difficultyEvidence: applies split definition and diagnoses cancellation error, prerequisiteObjectiveIds: [calc2-improper-split-and-evaluate] }
- { id: q020, type: freeResponse, prompt: 'If $0\le f(x)\le3/x^2$ eventually, classify $\int_A^\infty f(x)dx$.', answer: { gradingMode: selfCheck, checkModel: 'Convergent.' }, explanation: 'The benchmark 3/x squared has a finite p equals two tail. Direct comparison bounds f by that finite area.', difficultyDimensions: [representationTransfer, proofJustification], difficultyEvidence: transfers eventual inequality to convergence comparison, prerequisiteObjectiveIds: [calc2-improper-classify-by-comparison] }
