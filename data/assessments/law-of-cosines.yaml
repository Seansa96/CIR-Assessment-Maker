questions:
  - id: q001
    type: multipleChoice
    prompt: "Which formula is the Law of Cosines for side c?"
    choices:
      - id: a
        text: 'c^2=a^2+b^2-2ab\cos C'
      - id: b
        text: 'c^2=a^2+b^2+2ab\cos C'
      - id: c
        text: 'c=a+b-2ab\cos C'
      - id: d
        text: '\frac{c}{\sin C}=\frac{a}{\sin A}'
    answer:
      choiceId: a
    explanation: |
      The Law of Cosines relates one side to the other two sides and the included angle.

      Related topic: Law of Cosines Formula
  - id: q002
    type: multipleChoice
    prompt: "When is the Law of Cosines usually the best first choice?"
    choices:
      - id: a
        text: "Two sides and the included angle are known"
      - id: b
        text: "Two angles and one side are known"
      - id: c
        text: "Only one angle is known"
      - id: d
        text: "The triangle is always right"
    answer:
      choiceId: a
    explanation: |
      SAS information gives two sides with the angle between them, exactly matching the Law of Cosines setup.

      Related topic: SAS Triangle Solving
  - id: q003
    type: multipleChoice
    prompt: "A triangle has sides 5 and 7 with included angle 60 degrees. Which setup finds the opposite side c?"
    choices:
      - id: a
        text: 'c^2=5^2+7^2-2(5)(7)\cos60^\circ'
      - id: b
        text: 'c^2=5^2+7^2+2(5)(7)\cos60^\circ'
      - id: c
        text: '\frac{c}{\sin60^\circ}=\frac{5}{\sin7}'
      - id: d
        text: 'c=5+7-60'
    answer:
      choiceId: a
    explanation: |
      The side opposite the known included angle is found by subtracting the cosine term.

      Related topic: Law of Cosines Side Setup
  - id: q004
    type: multipleChoice
    prompt: "For sides a, b, and c, which formula can solve for angle C?"
    choices:
      - id: a
        text: '\cos C=\frac{a^2+b^2-c^2}{2ab}'
      - id: b
        text: '\sin C=\frac{a^2+b^2-c^2}{2ab}'
      - id: c
        text: '\cos C=\frac{c^2-a^2-b^2}{2ab}'
      - id: d
        text: 'C=a+b+c'
    answer:
      choiceId: a
    explanation: |
      Rearranging $c^2=a^2+b^2-2ab\cos C$ isolates $\cos C$.

      Related topic: Finding Angles with Law of Cosines
  - id: q005
    type: multipleChoice
    prompt: "What type of information suggests using Law of Cosines to find an angle?"
    choices:
      - id: a
        text: "All three side lengths are known"
      - id: b
        text: "All three angles are known"
      - id: c
        text: "Only the area is known"
      - id: d
        text: "One side and one non-included angle are known"
    answer:
      choiceId: a
    explanation: |
      SSS information allows each angle to be found with a rearranged Law of Cosines formula.

      Related topic: SSS Triangle Solving
  - id: q006
    type: multipleChoice
    prompt: "If the included angle is 90 degrees, what does the Law of Cosines become?"
    choices:
      - id: a
        text: "The Pythagorean theorem"
      - id: b
        text: "The Law of Sines"
      - id: c
        text: "The area formula"
      - id: d
        text: "The unit circle"
    answer:
      choiceId: a
    explanation: |
      Since $\cos90^\circ=0$, the cosine term disappears and $c^2=a^2+b^2$.

      Related topic: Law of Cosines and Right Triangles
  - id: q007
    type: multipleChoice
    prompt: "A triangle has sides 6, 8, and 10. What does Law of Cosines imply about the angle opposite side 10?"
    choices:
      - id: a
        text: "It is 90 degrees"
      - id: b
        text: "It is 60 degrees"
      - id: c
        text: "It is 30 degrees"
      - id: d
        text: "It cannot be found"
    answer:
      choiceId: a
    explanation: |
      Since $10^2=6^2+8^2$, the cosine term must be zero, so the angle is $90^\circ$.

      Related topic: Classifying Triangles with Law of Cosines
  - id: q008
    type: multipleChoice
    prompt: "Which scenario is NOT a natural Law of Cosines setup?"
    choices:
      - id: a
        text: "Two angles and one side are known"
      - id: b
        text: "Two sides and the included angle are known"
      - id: c
        text: "Three side lengths are known"
      - id: d
        text: "A side opposite an included angle is needed"
    answer:
      choiceId: a
    explanation: |
      AAS or ASA information usually points to the Law of Sines after finding the third angle.

      Related topic: Choosing Law of Sines Versus Law of Cosines
  - id: q009
    type: multipleChoice
    prompt: 'In the formula $c^2=a^2+b^2-2ab\cos C$, angle C is located where?'
    choices:
      - id: a
        text: "Between sides a and b"
      - id: b
        text: "Between sides a and c"
      - id: c
        text: "Between sides b and c"
      - id: d
        text: "Opposite side a"
    answer:
      choiceId: a
    explanation: |
      The angle used in the cosine term is the included angle between the two sides being multiplied.

      Related topic: Included Angles
  - id: q010
    type: multipleChoice
    prompt: "A triangle has sides 4 and 9 with included angle 120 degrees. What is the correct first step?"
    choices:
      - id: a
        text: 'Set up $c^2=4^2+9^2-2(4)(9)\cos120^\circ$'
      - id: b
        text: 'Set up $\frac{4}{\sin120^\circ}=\frac{9}{\sin C}$'
      - id: c
        text: "Add all sides and divide by 2"
      - id: d
        text: "Use only the Pythagorean theorem"
    answer:
      choiceId: a
    explanation: |
      Two sides and the included angle are known, so the Law of Cosines is the appropriate setup.

      Related topic: Applying Law of Cosines to SAS Problems
