questions:
- id: q-terminal-dust
  title: Terminal Velocity of Dust Particles
  type: symbolicResponse
  prompt: |
    A dust particle of mass $m$ falls through the air with a terminal velocity $v_t = mg/b$.
    If a second dust particle has twice the mass ($2m$) but the exact same linear drag coefficient $b$, what is its terminal velocity in terms of the first particle's $v_t$?
  answer:
    gradingMode: auto
    expectedLatex: 2*v_t
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    The new terminal velocity is $v_{t}' = (2m)g / b = 2 (mg / b) = 2 v_t$. It will fall twice as fast!
