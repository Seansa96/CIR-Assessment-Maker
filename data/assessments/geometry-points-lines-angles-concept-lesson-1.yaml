lesson:
  introduction: |-
    Angles are everywhere in geometry! In this lesson, we will learn how angles are measured and how to classify them based on their size.
  sections:
  - id: sec-measuring
    title: Measuring Angles
    required: true
    content: |-
      The measure of an angle is typically given in **degrees ($^\circ$)**. A full circle contains $360^\circ$. 
      
      We use a tool called a protractor to measure angles. When we want to talk about the measure of $\angle ABC$, we write $m\angle ABC$. For example, if an angle measures 45 degrees, we write $m\angle ABC = 45^\circ$.

      The **Protractor Postulate** states that given a line $\overleftrightarrow{AB}$ and a point $O$ on it, all rays that can be drawn from $O$ on one side of the line can be paired with the real numbers from 0 to 180.

  - id: sec-classifying
    title: Classifying Angles
    required: true
    content: |-
      Angles are classified into four main categories based on their degree measure:
      
      1. **Acute Angle**: An angle whose measure is greater than $0^\circ$ and strictly less than $90^\circ$.
      2. **Right Angle**: An angle whose measure is exactly $90^\circ$. It is often indicated with a small square in the corner.
      3. **Obtuse Angle**: An angle whose measure is strictly greater than $90^\circ$ and strictly less than $180^\circ$.
      4. **Straight Angle**: An angle whose measure is exactly $180^\circ$. A straight angle essentially forms a straight line.

      The examples below compare the four classifications using the same initial ray. Notice that the classification is determined by the opening between the rays, not by their orientation on the page.

      ![Examples of a 45-degree acute angle, 90-degree right angle, 125-degree obtuse angle, and 180-degree straight angle](/assessments/geometry/angle-classification-examples.svg)

  - id: sec-addition
    title: Angle Addition Postulate
    required: true
    content: |-
      Just like we can add the lengths of adjacent segments, we can add the measures of adjacent angles.
      
      If point $D$ lies in the interior of $\angle ABC$, then the measure of the two smaller angles adds up to the measure of the larger angle:
      $$m\angle ABD + m\angle DBC = m\angle ABC$$

questions:
- id: q-geom-pla-1
  title: Concept Check - Angle Classification
  prompt: |-
    An angle measures exactly $180^\circ$. What type of angle is this?
  type: multipleChoice
  choices:
  - id: c1
    text: Acute Angle
  - id: c2
    text: Right Angle
  - id: c3
    text: Obtuse Angle
  - id: c4
    text: Straight Angle
  answer:
    choiceId: c4
  explanation: |-
    An angle measuring exactly $180^\circ$ is a **straight angle**. It forms a straight line.
  skills:
  - geometry-points-lines-angles

- id: q-geom-pla-2
  title: Concept Check - Angle Addition
  prompt: |-
    Point $D$ lies in the interior of $\angle ABC$. If $m\angle ABD = 35^\circ$ and $m\angle DBC = 75^\circ$, what is $m\angle ABC$?
  type: numericResponse
  answer:
    numericValue: 110
    tolerance: 0
  explanation: |-
    By the Angle Addition Postulate:
    $$m\angle ABC = m\angle ABD + m\angle DBC$$
    $$m\angle ABC = 35^\circ + 75^\circ = 110^\circ$$
  skills:
  - geometry-points-lines-angles
