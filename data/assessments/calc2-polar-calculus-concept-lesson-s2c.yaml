lesson:
  introduction: Polar calculus accumulates sectors and path elements. The central task is selecting an interval that traces exactly the intended region or arc.
  sections:
  - id: pcl-01
    title: 1. Build area from infinitesimal sectors
    required: true
    content: A small polar sector has area $dA=\frac12r^2d\theta$, giving $A=\frac12\int r^2d\theta$.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Shaded polar sector
      caption: 
    check:
      id: pcl-01-c
      type: multipleChoice
      prompt: What factor appears in the polar area formula?
      choices:
      - id: a
        text: one half
        media: []
        issueSignals: []
      - id: b
        text: two pi
        media: []
        issueSignals: []
      - id: c
        text: r prime
        media: []
        issueSignals: []
      - id: d
        text: dx
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Polar sector area is one half r squared d theta. Why it works: A sector with angle d theta has this area. Common trap: Omitting one half. Why the other choices fail: They belong to other geometric formulas.'
