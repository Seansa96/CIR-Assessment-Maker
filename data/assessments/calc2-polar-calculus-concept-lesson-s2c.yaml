  - id: pcl-04
    title: 4. Distinguish between-region and overlap models
    required: true
    content: A region inside both curves uses the smaller nonnegative radius; a region between curves uses outer minus inner. The wording determines the model.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Common region bounded by smaller radius
      caption: 
    check:
      id: pcl-04-c
      type: multipleChoice
      prompt: For the region inside both polar curves, which radial boundary is used?
      choices:
      - id: a
        text: the smaller radius
        media: []
        issueSignals: []
      - id: b
        text: outer minus inner
        media: []
        issueSignals: []
      - id: c
        text: the larger radius
        media: []
        issueSignals: []
      - id: d
        text: their sum
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: A point inside both must be no farther than the smaller boundary. Why it works: It satisfies both inequalities. Common trap: Automatically using an annular difference. Why the other choices fail: They describe a different region.'
