        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The path can retrace points, include multiple petals, or duplicate a loop through negative radius. Why it works: Bounds specify traversal, not only angle range. Common trap: Assuming every full angular period is one trace.'
