    title: 6. Check sign and retracing before integrating
    required: true
    content: Negative r and periodic equations can retrace points. Use zeros, sample angles, and symmetry only after confirming the selected portion is distinct.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Polar loop traced once
      caption: 
