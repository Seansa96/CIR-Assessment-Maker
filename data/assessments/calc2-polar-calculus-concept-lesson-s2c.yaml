  - id: pcl-02
    title: 2. Use zeros and intersections for bounds
    required: true
    content: A loop begins/ends at zeros of r; a region between curves begins/ends at relevant intersections. Verify the selected interval traces the target once.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Loop endpoints and intersection rays
      caption: 
    check:
      id: pcl-02-c
      type: multipleChoice
      prompt: What equation often finds polar loop endpoints?
      choices:
      - id: a
        text: $r=0$
        media: []
        issueSignals: []
      - id: b
        text: $r=1$
        media: []
        issueSignals: []
      - id: c
        text: $dr/dtheta=0$ only
        media: []
        issueSignals: []
      - id: d
        text: $x=0$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: r equals zero reaches the pole and often marks loop endpoints. Why it works: Radius zero has no distance from the pole. Common trap: Using a maximum-radius condition. Why the other choices fail: They do not generally locate pole crossings.'
