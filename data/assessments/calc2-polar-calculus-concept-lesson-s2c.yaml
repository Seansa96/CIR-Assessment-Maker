  - id: pcl-05
    title: 5. Form the polar arc-length element
    required: true
    content: When radius varies, $ds=\sqrt{r^2+(dr/d\theta)^2}\,d\theta$. Both radial change and angular sweep contribute.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Polar path with radial and angular changes
      caption: 
    check:
      id: pcl-05-c
      type: multipleChoice
      prompt: Which extra term distinguishes polar length from a circular arc?
      choices:
      - id: a
        text: $(dr/dtheta)^2$
        media: []
        issueSignals: []
      - id: b
        text: $dx/dt$
        media: []
        issueSignals: []
      - id: c
        text: $dy/dx$
        media: []
        issueSignals: []
      - id: d
        text: outer radius minus inner radius
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Radial change contributes r-prime squared. Why it works: The path can move inward/outward while it turns. Common trap: Using r d theta for every polar curve. Why the other choices fail: They belong to other models.'
