  - id: pcl-03
    title: 3. Identify outer and inner radii
    required: true
    content: For area between curves, use $\frac12\int(r_{outer}^2-r_{inner}^2)d\theta$. Sample each interval because radius order can switch.
    media:
    - type: image
      src: /media/calculus/polar-review-loop-sector.svg
      alt: Annular polar sector between two radii
      caption: 
    check:
      id: pcl-03-c
      type: multipleChoice
      prompt: Why is $(r_o-r_i)^2$ generally wrong for between-curves area?
      choices:
      - id: a
        text: sector areas subtract squared radii
        media: []
        issueSignals: []
      - id: b
        text: theta cannot be integrated
        media: []
        issueSignals: []
      - id: c
        text: r is always constant
        media: []
        issueSignals: []
      - id: d
        text: outer radius is negative
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Subtract sector areas: one half outer squared minus inner squared. Why it works: Area is proportional to radius squared. Common trap: Squaring radial thickness and introducing a false cross term. Why the other choices fail: They do not explain the geometric formula.'
