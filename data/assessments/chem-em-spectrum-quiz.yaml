questions:
- id: em-spec-1
  title: Wavelength from Frequency
  type: numericResponse
  prompt: 'Adapted from OpenStax College Chemistry 2e.


    A photon has a frequency of $8 \times 10^{14}$ Hz. Calculate its wavelength in
    nanometers (nm). Use $c = 3 \times 10^8$ m/s.'
  answer:
    gradingMode: auto
    expected: 375.0
    tolerance: 5
  explanation: $\lambda = \frac{c}{\nu} = \frac{3 \times 10^8}{8 \times 10^{14}} =
    375.0$ nm.
