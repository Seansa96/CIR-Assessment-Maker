questions:
  - id: em-q01
    title: Wavelength and Frequency Relationship
    type: multipleChoice
    prompt: |
      Which of the following statements correctly describes the relationship between the wavelength ($\lambda$) and frequency ($\nu$) of electromagnetic radiation?
    choices:
      - id: a
        text: They are inversely proportional; as wavelength increases, frequency decreases.
      - id: b
        text: They are directly proportional; as wavelength increases, frequency increases.
      - id: c
        text: They are independent of each other.
      - id: d
        text: Their sum is always equal to the speed of light.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** The equation $c = \lambda \nu$ relates the two, where $c$ is the constant speed of light. Because their product is constant, if one goes up, the other must go down. They are inversely proportional.

  - id: em-q02
    title: Energy and Frequency Relationship
    type: multipleChoice
    prompt: |
      According to Planck's equation ($E = h\nu$), how is the energy of a photon related to its frequency?
    choices:
      - id: a
        text: Energy is directly proportional to frequency.
      - id: b
        text: Energy is inversely proportional to frequency.
      - id: c
        text: Energy is independent of frequency.
      - id: d
        text: Energy is proportional to the square of the frequency.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** $E$ and $\nu$ are on opposite sides of the equation and on the numerator. Higher frequency waves (like X-rays or Gamma rays) vibrate faster and carry more energy per photon.

  - id: em-q03
    title: Ranking the Spectrum by Energy
    type: multipleChoice
    prompt: |
      Which of the following lists regions of the electromagnetic spectrum in order of **increasing energy** (lowest to highest)?
    choices:
      - id: a
        text: Radio waves, Microwaves, Infrared, Visible, Ultraviolet, X-rays
      - id: b
        text: X-rays, Ultraviolet, Visible, Infrared, Microwaves, Radio waves
      - id: c
        text: Radio waves, Visible, Microwaves, Ultraviolet, Infrared, X-rays
      - id: d
        text: Visible, Ultraviolet, Infrared, Radio waves, Microwaves, X-rays
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Radio waves have the longest wavelength and lowest frequency, giving them the lowest energy. X-rays and Gamma rays have very short wavelengths, high frequencies, and the highest energy.

  - id: em-q04
    title: Visible Light Colors
    type: multipleChoice
    prompt: |
      Within the visible light spectrum, which color of light has the longest wavelength and lowest energy?
    choices:
      - id: a
        text: Red
      - id: b
        text: Violet
      - id: c
        text: Green
      - id: d
        text: Yellow
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Remember ROYGBIV. Red is adjacent to Infrared (lower energy), so it has the longest wavelength (around $700\text{ nm}$) and lowest energy. Violet is adjacent to Ultraviolet (higher energy), so it has the shortest wavelength (around $400\text{ nm}$) and highest energy.

  - id: em-q05
    title: Calculating Frequency from Wavelength
    type: numericResponse
    prompt: |
      A green laser emits light with a wavelength of $500\text{ nm}$ ($5.0 \times 10^{-7}\text{ m}$). Using the speed of light $c = 3.0 \times 10^8\text{ m/s}$, what is the frequency of this light in Hz (or $s^{-1}$)? Enter the value as a multiple of $10^{14}$ (e.g. if it is $4.0 \times 10^{14}$, enter 4.0). Round to one decimal place.
    answer:
      value: 6.0
      tolerance: 0.1
    explanation: |
      Use the wave equation: $c = \lambda \nu$.
      Rearrange for frequency: $\nu = \frac{c}{\lambda}$.
      $\nu = \frac{3.0 \times 10^8\text{ m/s}}{5.0 \times 10^{-7}\text{ m}} = 0.6 \times 10^{15}\text{ s}^{-1} = 6.0 \times 10^{14}\text{ Hz}$.

  - id: em-q06
    title: Calculating Energy from Frequency
    type: numericResponse
    prompt: |
      What is the energy of a photon with a frequency of $5.0 \times 10^{14}\text{ Hz}$? Use Planck's constant $h = 6.626 \times 10^{-34}\text{ J}\cdot\text{s}$. Enter the value as a multiple of $10^{-19}$ Joules. Round to two decimal places.
    answer:
      value: 3.31
      tolerance: 0.05
    explanation: |
      Use Planck's equation: $E = h\nu$.
      $E = (6.626 \times 10^{-34}\text{ J}\cdot\text{s})(5.0 \times 10^{14}\text{ s}^{-1})$.
      $E = 33.13 \times 10^{-20}\text{ J} = 3.31 \times 10^{-19}\text{ J}$.

  - id: em-q07
    title: Continuous vs Line Spectra
    type: multipleChoice
    prompt: |
      When white light (like from the sun or an incandescent bulb) is passed through a prism, a continuous rainbow of colors is seen. What is seen when the light emitted from excited hydrogen gas is passed through a prism?
    choices:
      - id: a
        text: A line emission spectrum consisting of a few discrete, brightly colored lines on a dark background.
      - id: b
        text: A continuous rainbow, identical to white light.
      - id: c
        text: A dark absorption spectrum with a few black lines missing from a rainbow background.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Excited atoms do not emit all wavelengths of light. Because their electron energy levels are quantized, they can only emit photons with specific energies (and thus specific colors/wavelengths). This creates a unique "fingerprint" of distinct bright lines.

  - id: em-q08
    title: The Photoelectric Effect
    type: multipleChoice
    prompt: |
      Einstein's explanation of the photoelectric effect proved what fundamental property of light?
    choices:
      - id: a
        text: Light behaves as a stream of individual particles (photons) whose energy depends on frequency, not intensity.
      - id: b
        text: Light behaves strictly as a continuous wave that can build up enough energy to eject electrons over time.
      - id: c
        text: Light can only travel in a vacuum.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Classical wave theory predicted that a very bright (intense) red light would eventually eject electrons. Einstein showed that only a single photon with high enough frequency (like blue or UV) can eject an electron, proving the particle (quantum) nature of light.

  - id: em-q09
    title: Electromagnetic Wave Speed
    type: multipleChoice
    prompt: |
      How does the speed of X-rays traveling through a vacuum compare to the speed of Radio waves traveling through a vacuum?
    choices:
      - id: a
        text: They travel at the exact same speed.
      - id: b
        text: X-rays travel much faster because they have higher energy.
      - id: c
        text: Radio waves travel much faster because they have longer wavelengths.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** ALL electromagnetic radiation (from radio to gamma) travels at the exact same speed in a vacuum: the speed of light, $c \approx 3.0 \times 10^8\text{ m/s}$.

  - id: em-q10
    title: Harmful Radiation
    type: multipleChoice
    prompt: |
      Why is exposure to Ultraviolet (UV) or X-ray radiation dangerous to human cells, whereas exposure to Radio waves or Microwaves is generally not?
    choices:
      - id: a
        text: UV and X-ray photons have enough energy to break chemical bonds and ionize atoms (ionizing radiation).
      - id: b
        text: UV and X-rays travel faster and hit the skin harder.
      - id: c
        text: UV and X-rays have longer wavelengths that can wrap around human cells.
    answer:

      choiceId: a
    explanation: |
      **Instructor Notes:** Because energy is proportional to frequency ($E = h\nu$), high-frequency radiation carries a massive amount of energy per photon. This is enough energy to knock electrons out of molecules (like DNA), causing mutations or cellular damage. Radio waves have very low energy and pass through us harmlessly.
