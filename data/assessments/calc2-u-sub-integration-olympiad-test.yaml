  prompt: 'Evaluate the integral: \(\int \frac{1}{x^{2} \sqrt{9 - x^{2}}} \, dx\)'
  answer:
    gradingMode: selfCheck
    checkModel: '\begin{cases} - \frac{i \sqrt{x^{2} - 9}}{9 x} & \text{for}\: \left|{x^{2}}\right|
      > 9 \\- \frac{\sqrt{9 - x^{2}}}{9 x} & \text{otherwise} \end{cases} + C'
  explanation: Use trigonometric substitution x = 3\sin\theta.
