  prompt: 'Evaluate the integral: \(\int \frac{x + 4}{\left(x - 1\right) \left(x +
    3\right)} \, dx\)'
  answer:
    gradingMode: selfCheck
    checkModel: \frac{5 \log{\left(x - 1 \right)}}{4} - \frac{\log{\left(x + 3 \right)}}{4}
      + C
  explanation: Use partial fraction decomposition.
