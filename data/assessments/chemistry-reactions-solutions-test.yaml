questions:
- id: q001
  type: numericResponse
  prompt: 'What is the molarity of a solution prepared by dissolving 15.0 g of NaOH
    (M = 40.00 g/mol) in enough water to make 500.0 mL of solution?

    '
  answer:
    value: 0.75
    tolerance: 0.005
  explanation: 'moles NaOH = 15.0 g / 40.00 g/mol = 0.375 mol.

    Molarity = 0.375 mol / 0.5000 L = 0.750 M.

    '
- id: q002
  type: multipleChoice
  prompt: 'Which of the following compounds is a strong electrolyte?

    '
  choices:
  - id: a
    text: KNO3
  - id: b
    text: CH3OH
  - id: c
    text: HF
  - id: d
    text: C12H22O11
  answer:

    choiceId: a
  explanation: 'KNO3 is a soluble ionic salt and a strong electrolyte. CH3OH and C12H22O11
    are molecular nonelectrolytes. HF is a weak acid and a weak electrolyte.

    '
- id: q003
  type: multipleChoice
  prompt: 'Based on solubility rules, what is the precipitate formed when aqueous
    solutions of BaCl2 and Na2SO4 are mixed?

    '
  choices:
  - id: a
    text: BaSO4
  - id: b
    text: NaCl
  - id: c
    text: BaNa2
  - id: d
    text: Cl2SO4
  answer:

    choiceId: a
  explanation: 'The possible products are BaSO4 and NaCl. NaCl is highly soluble.
    BaSO4 is insoluble (sulfates are mostly soluble except those of Ba, Sr, Pb, Ag,
    Ca).

    '
- id: q004
  type: numericResponse
  prompt: 'How many mL of 3.00 M H2SO4 are required to prepare 1.50 L of 0.100 M H2SO4?

    '
  answer:
    value: 50.0
    tolerance: 0.5
  explanation: 'M1V1 = M2V2. (3.00 M)(V1) = (0.100 M)(1.50 L). V1 = 0.150 / 3.00 =
    0.0500 L = 50.0 mL.

    '
- id: q005
  type: multipleChoice
  prompt: 'In the reaction 2Al(s) + 3Cu2+(aq) → 2Al3+(aq) + 3Cu(s), which species
    is the oxidizing agent?

    '
  choices:
  - id: a
    text: Cu2+(aq)
  - id: b
    text: Al(s)
  - id: c
    text: Al3+(aq)
  - id: d
    text: Cu(s)
  answer:

    choiceId: a
  explanation: 'Al goes from 0 to +3 (is oxidized), so Al is the reducing agent. Cu2+
    goes from +2 to 0 (is reduced), so Cu2+ is the oxidizing agent.

    '
- id: q006
  type: multipleChoice
  prompt: 'What is the net ionic equation for the reaction of aqueous HNO3 and aqueous
    KOH?

    '
  choices:
  - id: a
    text: H+(aq) + OH-(aq) → H2O(l)
  - id: b
    text: K+(aq) + NO3-(aq) → KNO3(aq)
  - id: c
    text: HNO3(aq) + KOH(aq) → H2O(l) + KNO3(aq)
  - id: d
    text: H+(aq) + K+(aq) → HK(aq)
  answer:

    choiceId: a
  explanation: 'This is a strong acid reacting with a strong base. The complete ionic
    equation is H+ + NO3- + K+ + OH- → H2O + K+ + NO3-. K+ and NO3- are spectator
    ions. The net ionic equation is H+(aq) + OH-(aq) → H2O(l).

    '
- id: q007
  type: numericResponse
  prompt: 'In a titration, 22.50 mL of an NaOH solution of unknown concentration requires
    15.00 mL of 0.125 M H2SO4 to reach the endpoint. What is the molarity of the NaOH
    solution?

    (H2SO4 + 2NaOH → Na2SO4 + 2H2O)

    '
  answer:
    value: 0.167
    tolerance: 0.002
  explanation: 'Moles H2SO4 = 0.125 M × 0.01500 L = 0.001875 mol.

    Moles NaOH required = 0.001875 mol H2SO4 × (2 mol NaOH / 1 mol H2SO4) = 0.00375
    mol NaOH.

    Molarity NaOH = 0.00375 mol / 0.02250 L = 0.1667 M ≈ 0.167 M.

    '
- id: q008
  type: multipleChoice
  prompt: 'What is the oxidation state of chromium in the dichromate ion, Cr2O7(2-)?

    '
  choices:
  - id: a
    text: 6
  - id: b
    text: 7
  - id: c
    text: 3
  - id: d
    text: 12
  answer:

    choiceId: a
  explanation: 'Oxygen is -2. Seven O''s give -14. The total charge is -2, so the
    two Cr atoms must contribute +12 to the charge. 2x = 12, so x = +6.

    '
- id: q009
  type: numericResponse
  prompt: 'What mass of AgCl (M = 143.32 g/mol) will precipitate if 50.0 mL of 0.200
    M AgNO3 is mixed with excess NaCl?

    (AgNO3 + NaCl → AgCl + NaNO3)

    '
  answer:
    value: 1.43
    tolerance: 0.02
  explanation: 'Moles AgNO3 = 0.200 M × 0.0500 L = 0.0100 mol.

    Since NaCl is in excess, all 0.0100 mol of Ag+ will precipitate.

    Moles AgCl = 0.0100 mol.

    Mass AgCl = 0.0100 mol × 143.32 g/mol = 1.433 g ≈ 1.43 g.

    '
- id: q010
  type: numericResponse
  prompt: 'What is the total concentration of ALL ions in a 0.250 M solution of Na2SO4?

    Assume complete dissociation.

    '
  answer:
    value: 0.75
    tolerance: 0.005
  explanation: 'Na2SO4 dissociates into 2 Na+ ions and 1 SO4(2-) ion (total 3 ions
    per formula unit).

    Total ion concentration = 3 × 0.250 M = 0.750 M.

    '
