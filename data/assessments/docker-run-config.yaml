schemaVersion: 1
id: docker-run-config
title: Container Config and Environment Variables
assessmentType: guidedProject
categoryId: containerization
guidedProject:
  language: bash
  projectKind: console
  runnerMode: workspace
  instructions: 'Sometimes you need to pass configuration into a container. Docker
    allows you to set environment variables using the `-e` flag.


    **Requirements:**

    1. Write a bash script `run.sh` that launches an `alpine` container.

    2. Set an environment variable named `GREETING` to `Hello from Docker`.

    3. The container should execute `sh -c "echo $GREETING"` to print the greeting.

    4. You do not need to run in detached mode for this exercise.


    *Hint: `docker run -e VAR=VALUE alpine sh -c ''echo $VAR''`*

    '
  workspace:
    entryPoint: run.sh
    allowedBaseImages:
    - docker:dind
    sourceGlobs:
    - run.sh
  files:
  - path: run.sh
    readOnly: false
    content: '#!/bin/bash


      # Write your docker run command below

      '
  fixtures: []
  scenarios: []
  diagnostics: []
  requiredChecks:
  - id: check-docker-run-env
    title: Container prints the correct greeting
    description: The alpine container should print "Hello from Docker" to the console.
    testCode: null
    expectedOutputContains: []
    run:
      arguments: []
      stdin: null
      scenario: null
    expect:
      stdoutContains:
      - Hello from Docker
      files: []
  bonusChecks: []
