attemptQuestionCount: 10
questions:
- id: cpp-hello-world-q-mc-1
  type: multipleChoice
  prompt: Which function is the normal entry point of a hosted C++ program?
  choices: [{ id: a, text: main }, { id: b, text: start }, { id: c, text: cout }, { id: d, text: compile }]
  answer: { choiceId: a }
  explanation: Execution begins at the program's one main function.
- id: cpp-hello-world-q-mc-2
  type: multipleChoice
  prompt: What must be included to use the broadly supported `std::cout` output stream?
  choices: [{ id: a, text: '`<iostream>`' }, { id: b, text: '`<vector>`' }, { id: c, text: '`<limits>`' }, { id: d, text: '`<cassert>`' }]
  answer: { choiceId: a }
  explanation: iostream declares the standard console input/output streams.
- id: cpp-hello-world-q-mc-3
  type: multipleChoice
  prompt: What is printed by `std::cout << "A" << "B\\n";`?
  choices: [{ id: a, text: AB followed by a newline }, { id: b, text: A and B on separate lines }, { id: c, text: A B with a space }, { id: d, text: Nothing; cout only accepts numbers }]
  answer: { choiceId: a }
  explanation: Each insertion appends to the same stream; only the final string requests a newline.
- id: cpp-hello-world-q-mc-4
  type: multipleChoice
  prompt: In a typical C++ build, which component joins object code and required libraries?
  choices: [{ id: a, text: The linker }, { id: b, text: The preprocessor alone }, { id: c, text: std::cout }, { id: d, text: The source editor }]
  answer: { choiceId: a }
  explanation: The compiler translates source, while the linker assembles the program from translated pieces.
- id: cpp-hello-world-q-mc-5
  type: multipleChoice
  prompt: A compiler says `println` is not a member of `std`. What is the most useful conclusion?
  choices: [{ id: a, text: The selected toolchain or language mode may not provide that newer facility. }, { id: b, text: A newline may never be printed in C++. }, { id: c, text: main must take a parameter. }, { id: d, text: All headers must use quotation marks. }]
  answer: { choiceId: a }
  explanation: Standard-library feature availability depends on compiler support and the chosen standard mode.
- id: cpp-hello-world-q-code-1
  type: code
  prompt: Write a complete C++ program that prints exactly `Hello, C++!` followed by a newline.
  language: cpp
  functionName: main
  starterCode: "#include <iostream>\n\nint main() {\n  // print the required line\n}\n"
  tests: [{ input: test, expected: "Hello, C++!\n" }]
  explanation: Include iostream, use main, and send the exact text plus a newline to std::cout.
- id: cpp-hello-world-q-code-2
  type: code
  prompt: Write a complete C++ program that prints `Build` on the first line and `Run` on the second line.
  language: cpp
  functionName: main
  starterCode: "#include <iostream>\n\nint main() {\n  // produce two lines\n}\n"
  tests: [{ input: test, expected: "Build\nRun\n" }]
  explanation: Two output statements or two newline characters both make the required line break explicit.
- id: cpp-hello-world-q-code-3
  type: code
  prompt: Write a complete C++ program that prints the three characters `7`, `8`, and `9` consecutively, followed by one newline.
  language: cpp
  functionName: main
  starterCode: "#include <iostream>\n\nint main() {\n  // use stream insertion\n}\n"
  tests: [{ input: test, expected: "789\n" }]
  explanation: Consecutive insertions into std::cout append to the same output stream until a newline is inserted.
- id: cpp-hello-world-q-fr-1
  type: freeResponse
  prompt: A file `hello.cpp` compiles into object code but fails during linking because a named function cannot be found. Explain the difference between this failure and a syntax error.
  answer:
    gradingMode: selfCheck
    keyPoints: [Syntax errors are found while parsing/translating source, Link failures occur when translated pieces or definitions cannot be combined, Mentions a missing definition or library symbol]
  explanation: Self-check against the distinction between compile and link stages.
- id: cpp-hello-world-q-fr-2
  type: freeResponse
  prompt: Explain why `#include <iostream>` and `std::cout` solve two different name-availability problems in a small output program.
  answer:
    gradingMode: selfCheck
    keyPoints: [Header makes declarations available, std qualifies the standard-library namespace, Recognizes that omitting either can produce a diagnostic]
  explanation: Self-check against the three key points.
