description: Source-aligned practice with program structure, output, and build diagnostics.
assessmentType: quiz
categoryId: c++
topicId: cpp-hello-world
skills: [cpp, c-plus-plus, cpp-hello-world, compilation, console-output]
difficulty: 2
navigation:
  learningGoal: practice
  activityType: focusedPractice
