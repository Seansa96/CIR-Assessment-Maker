lesson:
  introduction: 'Atoms are unimaginably small — a single carbon atom has a mass of
    about 2 × 10⁻²³ grams. Working with individual atoms is impractical. Chemists
    solve this by using a unit called the **mole**, which bridges the atomic scale
    and the everyday laboratory scale. The mole is to chemistry what the "dozen" is
    to baking — a convenient counting unit.

    '
  sections:
  - id: counting-by-weighing
    title: Counting by Weighing
    required: true
    content: 'If you need 100 paper clips, you don''t count them one by one — you
      weigh a known number, determine the mass per clip, and weigh out the rest. Chemists
      do the same thing with atoms.


      **Key principle:** If you know the mass of one atom (in amu) and you have a
      sample of known mass, you can calculate\rhow many atoms you have without counting
      them individually.


      **Atomic Mass Unit (amu):**

      - 1 amu is defined as exactly 1/12 the mass of a carbon-12 atom.

      - 1 amu = 1.661 × 10⁻²⁴ g


      **Atomic mass** (listed on the periodic table) is the **weighted average mass**
      of all naturally occurring isotopes of an element, expressed in amu.

      - C: 12.011 amu

      - O: 15.999 amu

      - Na: 22.990 amu

      '
    check:
      id: counting-check
      type: multipleChoice
      prompt: 'The atomic mass of iron (Fe) is 55.85 amu. This value represents:

        '
      choices:
      - id: a
        text: The weighted average mass of all naturally occurring iron isotopes.
      - id: b
        text: The mass of the most abundant iron isotope only.
      - id: c
        text: The total mass of all iron atoms in 1 gram of iron.
      - id: d
        text: The number of neutrons in iron.
      answer:
        choiceId: a
      explanation: 'The periodic table atomic mass is always the isotope-weighted
        average. Iron has four stable isotopes (Fe-54, Fe-56, Fe-57, Fe-58); 55.85
        amu is their weighted average.

        '
  - id: the-mole
    title: The Mole and Avogadro's Number
    required: true
    content: 'The **mole (mol)** is the SI unit of amount of substance. It is defined
      as exactly:


      $$

      N_A = 6.02214076 \times 10^{23} \text{ entities}

      $$


      This is **Avogadro''s number** (symbolized $N_A$). One mole of any substance
      contains $6.022 \times 10^{23}$ particles (atoms, molecules, ions, etc.).


      **Why this number?** It was chosen so that one mole of carbon-12 atoms has a
      mass of exactly 12 grams — linking the atomic mass scale (amu) to the laboratory
      scale (grams).


      **Analogies to build intuition:**

      - 1 dozen eggs = 12 eggs

      - 1 gross = 144 items

      - 1 mole = 6.022 × 10²³ items


      A mole of marbles would cover the entire surface of the Earth to a depth of
      several kilometers. Atoms are extraordinarily small.

      '
    check:
      id: mole-check
      type: multipleChoice
      prompt: 'Which statement correctly describes one mole of water molecules (H2O)?

        '
      choices:
      - id: a
        text: It contains 6.022 × 10²³ water molecules.
      - id: b
        text: It contains 6.022 × 10²³ hydrogen atoms only.
      - id: c
        text: It has a mass of 1 gram.
      - id: d
        text: It contains 6.022 × 10²³ grams of oxygen.
      answer:
        choiceId: a
      explanation: 'One mole of any substance contains 6.022 × 10²³ representative
        particles. For H2O, those particles are water molecules. The mass of one mole
        of H2O is 18.02 g (the molar mass), not 1 gram.

        '
  - id: molar-mass
    title: Molar Mass
    required: true
    content: '**Molar mass** is the mass of exactly one mole of a substance, expressed
      in **grams per mole (g/mol)**.


      **Key relationship:** The molar mass of an element (in g/mol) is numerically
      equal to its atomic mass (in amu).

      - C: 12.011 g/mol

      - O: 15.999 g/mol

      - Fe: 55.845 g/mol


      **For compounds**, add up the molar masses of all atoms in the formula:


      **Example — H2O:**

      $$

      M_{H_2O} = 2(1.008) + 15.999 = 18.015 \text{ g/mol}

      $$


      **Example — Ca3(PO4)2:**

      $$

      M = 3(40.078) + 2(30.974) + 8(15.999)

      $$

      $$

      = 120.234 + 61.948 + 127.992 = 310.174 \text{ g/mol}

      $$

      '
    check:
      id: molar-mass-check
      type: numericResponse
      prompt: 'Calculate the molar mass of glucose, C6H12O6, in g/mol. Use: C = 12.011,
        H = 1.008, O = 15.999.

        '
      answer:
        value: 180.16
        tolerance: 0.05
      explanation: 'M = 6(12.011) + 12(1.008) + 6(15.999) = 72.066 + 12.096 + 95.994
        = 180.156 ≈ 180.16 g/mol.

        '
  - id: mole-conversions
    title: The Mole Roadmap — Converting Between Mass, Moles, and Particles
    required: true
    content: 'The three most common stoichiometry conversions connect:


      $$

      \text{Mass (g)} \xleftrightarrow{\div M, \times M} \text{Moles (mol)} \xleftrightarrow{\div
      N_A, \times N_A} \text{Particles}

      $$


      **Grams to moles:**

      $$

      n = \frac{m}{M} \quad \text{(divide by molar mass)}

      $$


      **Moles to grams:**

      $$

      m = n \times M \quad \text{(multiply by molar mass)}

      $$


      **Moles to particles:**

      $$

      \text{particles} = n \times N_A

      $$


      **Example:** How many grams of NaCl is 0.500 mol?


      $m = 0.500 \text{ mol} \times 58.44 \text{ g/mol} = 29.22 \text{ g}$


      **Example:** How many molecules are in 18.02 g of H2O?


      $n = \frac{18.02 \text{ g}}{18.015 \text{ g/mol}} = 1.000 \text{ mol}$


      $\text{molecules} = 1.000 \times 6.022 \times 10^{23} = 6.022 \times 10^{23}$

      '
    check:
      id: conversion-check
      type: numericResponse
      prompt: 'How many moles of iron (Fe) are in 111.7 g of iron? (Molar mass of
        Fe = 55.845 g/mol)

        '
      answer:
        value: 2.0
        tolerance: 0.05
      explanation: 'n = m / M = 111.7 g / 55.845 g/mol = 2.000 mol. Notice that 111.7
        g is exactly 2 × 55.845.

        '
  - id: percent-composition
    title: Percent Composition of Compounds
    required: true
    content: '**Percent composition** tells you the mass fraction of each element
      in a compound. It can be calculated from the chemical formula:


      $$

      \%\text{ element} = \frac{\text{mass of element in 1 mol of compound}}{\text{molar
      mass of compound}} \times 100\%

      $$


      **Example — H2O:**

      $$

      \%\text{H} = \frac{2 \times 1.008}{18.015} \times 100\% = 11.19\%

      $$

      $$

      \%\text{O} = \frac{15.999}{18.015} \times 100\% = 88.81\%

      $$


      Check: 11.19% + 88.81% = 100.00% ✓


      **Use:** Percent composition is used to verify a compound''s identity and to
      determine empirical formulas from experimental data.

      '
    check:
      id: percent-check
      type: numericResponse
      prompt: 'What is the percent composition of carbon in CO2? Use M(C) = 12.011
        g/mol, M(O) = 15.999 g/mol.

        Express as a percentage to one decimal place.

        '
      answer:
        value: 27.3
        tolerance: 0.2
      explanation: 'M(CO2) = 12.011 + 2(15.999) = 44.009 g/mol. %C = (12.011 / 44.009)
        × 100% = 27.29% ≈ 27.3%.

        '
