lesson:
  introduction: |
    When an object is submerged in a fluid, the fluid exerts a pressure on the object. The deeper you go, the higher the pressure.
    If we want to find the total force exerted by the fluid on a submerged vertical plate (like a dam or a window of a submarine), we have to use integration because the pressure is different at every depth.
  sections:
    - id: pressure-depth
      title: Pressure and Depth
      required: true
      content: |
        **Pressure** $P$ at a depth $d$ is given by:
        $P = \rho g d$
        where $\rho$ is the density of the fluid (e.g., $1000$ kg/m$^3$ for water), and $g$ is the acceleration due to gravity ($9.8$ m/s$^2$).
        
        *Note: In US Customary units, weight density $\gamma$ is given directly (e.g., $62.4$ lb/ft$^3$), so $P = \gamma d$.*
        
        Because pressure is Force per unit Area ($P = F/A$), the force on a horizontal plate at a constant depth is simply $F = P \times A$.
      check:
        id: pressure-depth-check
        type: multipleChoice
        prompt: If a flat horizontal plate of area 2 m² is submerged at a constant depth of 5 meters in water ($\rho = 1000, g = 9.8$), what is the total force on the plate?
        choices:
          - id: a
            text: 98,000 N
          - id: b
            text: 49,000 N
          - id: c
            text: 10,000 N
          - id: d
            text: 196,000 N
        answer:
          choiceId: a
        explanation: |
          $P = \rho g d = (1000)(9.8)(5) = 49,000$ N/m².
          $F = P \times A = 49,000 \times 2 = 98,000$ N.

    - id: vertical-plates
      title: Force on a Vertical Plate
      required: true
      content: |
        If a plate is placed vertically in the water, the pressure is not constant across its surface. The bottom of the plate feels more pressure than the top.
        
        We slice the plate into thin horizontal strips of thickness $dy$. For a very thin strip, the depth $d(y)$ is roughly constant.
        The area of the strip is $w(y) dy$, where $w(y)$ is the width of the plate at coordinate $y$.
        
        The force on one thin strip is:
        $dF = \text{Pressure} \times \text{Area} = (\rho g \cdot d(y)) \times (w(y) dy)$
        
        The total force is the integral from the bottom $y=a$ to the top $y=b$ of the plate:
        
        $$
        F = \int_a^b \rho g \cdot d(y) \cdot w(y)\,dy
        $$
      check:
        id: vertical-plates-check
        type: multipleChoice
        prompt: If the surface of the water is at $y=10$, what is the depth $d(y)$ of a strip located at coordinate $y$?
        choices:
          - id: a
            text: $10 - y$
          - id: b
            text: $y$
          - id: c
            text: $y - 10$
          - id: d
            text: $10 + y$
        answer:
          choiceId: a
        explanation: |
          Depth is measured downward from the surface. If you are at height $y$, you are $10 - y$ units below the surface at $10$.


