questions:
  - { id: q001, type: multipleChoice, prompt: 'When BaCl2(aq) and Na2SO4(aq) are mixed, which product is the precipitate?', choices: [{ id: a, text: 'BaSO4(s)' }, { id: b, text: 'NaCl(s)' }, { id: c, text: 'BaCl2(s)' }, { id: d, text: 'Na2SO4(s)' }], answer: { choiceId: a }, explanation: 'Solution: BaSO4(s) precipitates. Why it works: Barium sulfate is insoluble, while sodium and chloride salts remain soluble. Why the other choices fail: b, c, and d are soluble aqueous compounds in this context.', difficultyDimensions: [representationTransfer, casePartition], difficultyEvidence: 'Uses exchanged-ion representation and solubility classification.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-ba-sulfate-precipitate, variationAxes: { scenario: salt mixing, unknown: precipitate } }
  - { id: q002, type: multipleChoice, prompt: 'Which is the net ionic equation for AgNO3(aq) + NaCl(aq)?', choices: [{ id: a, text: 'Ag+(aq) + Cl−(aq) → AgCl(s)' }, { id: b, text: 'AgNO3(aq) + NaCl(aq) → AgCl(s) + NaNO3(aq)' }, { id: c, text: 'Na+(aq) + NO3−(aq) → NaNO3(s)' }, { id: d, text: 'Ag+(aq) + NO3−(aq) → AgNO3(s)' }], answer: { choiceId: a }, explanation: 'Solution: Ag+(aq) + Cl−(aq) → AgCl(s). Why it works: Only silver and chloride form the insoluble product; sodium and nitrate are unchanged spectators. Why the other choices fail: b is molecular, not net ionic; c and d incorrectly precipitate soluble salts.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Transfers molecular reactants to the net-changing ionic pair.', prerequisiteObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-agcl-net-ionic, variationAxes: { representation: molecular to net ionic, unknown: net equation } }
  - { id: q003, type: multipleChoice, prompt: 'Which species is a spectator ion in Pb(NO3)2(aq) + 2KI(aq) → PbI2(s) + 2KNO3(aq)?', choices: [{ id: a, text: 'K+' }, { id: b, text: 'Pb2+' }, { id: c, text: 'I−' }, { id: d, text: 'PbI2(s)' }], answer: { choiceId: a }, explanation: 'Solution: K+ is a spectator ion. Why it works: It remains K+(aq) on both sides of the complete ionic equation. Why the other choices fail: Pb2+ and I− form the precipitate; PbI2 is the changed solid product.', difficultyDimensions: [representationTransfer, errorDiagnosis], difficultyEvidence: 'Identifies unchanged ionic species after complete-ion splitting.', prerequisiteObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-spectator-identification, variationAxes: { scenario: lead-iodide precipitation, unknown: spectator ion } }
  - { id: q004, type: multipleChoice, prompt: 'Which mixture gives no net ionic reaction?', choices: [{ id: a, text: 'NaNO3(aq) + KCl(aq)' }, { id: b, text: 'BaCl2(aq) + Na2SO4(aq)' }, { id: c, text: 'AgNO3(aq) + NaCl(aq)' }, { id: d, text: 'Pb(NO3)2(aq) + KI(aq)' }], answer: { choiceId: a }, explanation: 'Solution: NaNO3(aq) + KCl(aq) gives no net reaction. Why it works: All ions remain soluble and unchanged. Why the other choices fail: b forms BaSO4, c forms AgCl, and d forms PbI2.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Compares possible product solubilities to distinguish a no-reaction branch.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-no-reaction-selection, variationAxes: { scenario: mixture selection, unknown: no-reaction case } }
  - { id: q005, type: multipleChoice, prompt: 'In a complete ionic equation, how should Na2SO4(aq) be written?', choices: [{ id: a, text: '2Na+(aq) + SO4 2−(aq)' }, { id: b, text: 'Na2SO4(s)' }, { id: c, text: 'Na2+(aq) + SO4−(aq)' }, { id: d, text: 'Na+(aq) + SO4 2−(aq)' }], answer: { choiceId: a }, explanation: 'Solution: 2Na+(aq) + SO4 2−(aq). Why it works: A soluble ionic compound dissociates according to its formula subscripts. Why the other choices fail: b has the wrong phase; c has invalid charges; d omits one sodium ion.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts a formula unit to a correctly counted ionic representation.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-split-sodium-sulfate, variationAxes: { representation: formula to complete ions, unknown: correct expansion } }
  - { id: q006, type: multipleChoice, prompt: 'Which product should remain intact in a complete ionic equation?', choices: [{ id: a, text: 'CaCO3(s)' }, { id: b, text: 'KNO3(aq)' }, { id: c, text: 'NaCl(aq)' }, { id: d, text: 'HCl(aq)' }], answer: { choiceId: a }, explanation: 'Solution: CaCO3(s) remains intact. Why it works: Solids are not split into free aqueous ions. Why the other choices fail: b and c are soluble salts; d is a strong acid, so they are written as ions in this introductory convention.', difficultyDimensions: [casePartition, representationTransfer], difficultyEvidence: 'Selects the phase-based exception to splitting strong aqueous electrolytes.', prerequisiteObjectiveIds: [complete-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-keep-solid-intact, variationAxes: { scenario: equation-writing rule, unknown: intact species } }
  - { id: q007, type: multipleChoice, prompt: 'What is the balanced molecular equation when CaCl2(aq) reacts with Na2CO3(aq)?', choices: [{ id: a, text: 'CaCl2(aq) + Na2CO3(aq) → CaCO3(s) + 2NaCl(aq)' }, { id: b, text: 'CaCl2 + Na2CO3 → CaCO3 + NaCl' }, { id: c, text: 'Ca2+ + CO3 2− → CaCO3(s)' }, { id: d, text: 'CaCl2 + Na2CO3 → CaNa(s) + ClCO3(aq)' }], answer: { choiceId: a }, explanation: 'Solution: Choice a is balanced and gives the insoluble carbonate. Why it works: Ca2+ and CO3 2− form a 1:1 neutral solid; two NaCl units conserve Na and Cl. Why the other choices fail: b lacks phases and balance; c is net ionic; d invents impossible products.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: 'Builds neutral products and balances molecular bookkeeping.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-calcium-carbonate-molecular, variationAxes: { scenario: double replacement, unknown: balanced molecular equation } }
  - { id: q008, type: multipleChoice, prompt: 'Why are Na+ and NO3− canceled from an equation when unchanged on both sides?', choices: [{ id: a, text: 'They are spectators and do not undergo chemical change.' }, { id: b, text: 'Their charges are zero.' }, { id: c, text: 'They form a gas.' }, { id: d, text: 'They are never present in water.' }], answer: { choiceId: a }, explanation: 'Solution: They are canceled because they are spectator ions. Why it works: A net ionic equation shows only the species whose chemical identity or phase changes. Why the other choices fail: b is false for ions; c and d contradict their aqueous spectator role.', difficultyDimensions: [proofJustification, representationTransfer], difficultyEvidence: 'Explains the purpose of representation reduction using chemical-change criteria.', prerequisiteObjectiveIds: [spectator-ion-cancellation], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-why-cancel-spectators, variationAxes: { scenario: equation reduction, unknown: rationale } }
  - { id: q009, type: freeResponse, prompt: 'Write the net ionic equation for Ba2+(aq) reacting with SO4 2−(aq).', answer: { gradingMode: selfCheck, keyPoints: ['Ba2+(aq) + SO4 2−(aq) → BaSO4(s)'] }, explanation: 'Solution: Ba2+(aq) + SO4 2−(aq) → BaSO4(s). Why it works: The two ions combine in a charge-balanced 1:1 insoluble solid. Common trap: Leaving the product aqueous.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: 'Converts charged ions to a balanced precipitate formula and phase.', prerequisiteObjectiveIds: [net-ionic-equations], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0407], reasoningSignature: easy-write-baso4-net, variationAxes: { representation: ions to net equation, unknown: precipitate equation } }
  - { id: q010, type: freeResponse, prompt: 'State whether mixing KNO3(aq) and NaCl(aq) has a net reaction, and give the reason.', answer: { gradingMode: selfCheck, keyPoints: ['no reaction', 'all possible salts soluble', 'all ions spectators'] }, explanation: 'Solution: There is no net reaction. Why it works: K+, Na+, NO3−, and Cl− remain soluble, unchanged aqueous ions. Common trap: Writing a reaction merely because ions exchange partners.', difficultyDimensions: [casePartition, proofJustification], difficultyEvidence: 'Applies the no-net-change criterion after considering product solubility.', prerequisiteObjectiveIds: [aqueous-reaction-prediction], sourceChunkIds: [src-20260720035703-91ea51b0d8:chunk-0402], reasoningSignature: easy-explain-no-reaction, variationAxes: { scenario: soluble-salt mixture, unknown: reaction decision } }
