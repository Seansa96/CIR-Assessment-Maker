lesson:
  introduction: This lesson develops Shock Waves from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      A shock wave forms when a source moves through a medium at a speed greater than the wave speed in that medium ($v_s > v$). The physical system is analogous to a boat moving faster than the water waves it creates, producing a V-shaped bow wake.
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s1, type: multipleChoice, prompt: 'When does a shock wave form?', choices: [{id: a, text: 'A source faster than wave speed'}, {id: b, text: 'A stationary source'}, {id: c, text: 'A subsonic source'}, {id: d, text: 'No wave geometry'}], answer: {choiceId: a}, explanation: 'This follows from supersonic wavefront geometry.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      Measurable quantities are the source velocity $v_s$, the speed of sound $v$, the Mach number ($M = v_s / v$), and the half-angle of the shock wave cone $\theta$.
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s2, type: multipleChoice, prompt: 'What dimensionless speed ratio is used?', choices: [{id: a, text: 'Mach number'}, {id: b, text: 'A stationary source'}, {id: c, text: 'A subsonic source'}, {id: d, text: 'No wave geometry'}], answer: {choiceId: a}, explanation: 'This follows from supersonic wavefront geometry.'}
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model relies on geometry. In a given time $t$, the source moves a distance $v_s t$, while the wavefront emitted at time $t=0$ expands to a radius $v t$. The tangent from the source's current position to the expanding spherical wavefronts forms a cone.
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s3, type: multipleChoice, prompt: 'What geometry describes a Mach cone?', choices: [{id: a, text: 'A tangent cone of wavefronts'}, {id: b, text: 'A stationary source'}, {id: c, text: 'A subsonic source'}, {id: d, text: 'No wave geometry'}], answer: {choiceId: a}, explanation: 'This follows from supersonic wavefront geometry.'}
  - id: s4
    title: Calculus connection
    content: >-
      By drawing a right triangle from the source's current position to the tangent point on the $t=0$ wavefront, the opposite side is $v t$ and the hypotenuse is $v_s t$. Using trigonometry, $\sin\theta = \frac{v t}{v_s t} = \frac{v}{v_s}$.
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s4, type: multipleChoice, prompt: 'What is the Mach-angle relation?', choices: [{id: a, text: '$\sin\theta=v/v_s$'}, {id: b, text: 'A stationary source'}, {id: c, text: 'A subsonic source'}, {id: d, text: 'No wave geometry'}], answer: {choiceId: a}, explanation: 'This follows from supersonic wavefront geometry.'}
  - id: s5
    title: Derivation or justification
    content: >-
      We derive the Mach number as the reciprocal of this ratio: $M = \frac{v_s}{v} = \frac{1}{\sin\theta}$. The shock wave (sonic boom) is the superposition of countless wavefronts along this cone edge, creating an abrupt, massive pressure change.
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s5, type: multipleChoice, prompt: 'How is Mach number related to Mach angle?', choices: [{id: a, text: '$M=1/\sin\theta$'}, {id: b, text: 'A stationary source'}, {id: c, text: 'A subsonic source'}, {id: d, text: 'No wave geometry'}], answer: {choiceId: a}, explanation: 'This follows from supersonic wavefront geometry.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, drawing concentric circles representing wavefronts emitted by a supersonic source shows that the wavefronts overlap and constructively interfere exclusively along the V-shaped boundary (the Mach cone).
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s6, type: multipleChoice, prompt: 'Where do supersonic wavefronts reinforce?', choices: [{id: a, text: 'Along the cone boundary'}, {id: b, text: 'A stationary source'}, {id: c, text: 'A subsonic source'}, {id: d, text: 'No wave geometry'}], answer: {choiceId: a}, explanation: 'This follows from supersonic wavefront geometry.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A quantitative strategy for finding the altitude of a supersonic jet when the boom is heard involves mapping the cone to the ground. If the jet is at altitude $h$, the boom trails behind the jet by a ground distance $x = \frac{h}{\tan\theta}$.
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s7, type: multipleChoice, prompt: 'What ground distance trails a boom from altitude h?', choices: [{id: a, text: '$x=h/\tan\theta$'}, {id: b, text: 'A stationary source'}, {id: c, text: 'A subsonic source'}, {id: d, text: 'No wave geometry'}], answer: {choiceId: a}, explanation: 'This follows from supersonic wavefront geometry.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: If the source slows down to $v_s = v$ (Mach 1), $\sin\theta = 1$, so $\theta = 90^\circ$; the 'cone' becomes a flat wall of pressure (the sound barrier). If $v_s < v$, $\sin\theta > 1$, which has no real solution, correctly indicating no shock wave forms.
    media:
    - type: image
      src: /media/physics/owa/shock-waves.svg
      alt: Labeled original schematic for Shock Waves used for quantitative analysis.
      caption: Shock Waves model diagram.
    check: {id: shock-s8, type: multipleChoice, prompt: 'At Mach 1, what is the Mach angle?', choices: [{id: a, text: '$90^\circ$'}, {id: b, text: '$0^\circ$'}, {id: c, text: '$45^\circ$'}, {id: d, text: 'Undefined'}], answer: {choiceId: a}, explanation: 'At $M=1$, $\sin\theta=1$ and the angle is $90^\circ$.'}
