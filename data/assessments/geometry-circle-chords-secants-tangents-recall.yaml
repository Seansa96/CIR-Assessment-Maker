items:
- id: item-tangent-radius-theorem
  type: flashcard
  prompt: 'What angle does a tangent line make with the radius drawn to the point of tangency?'
  answer:
    expected: 'They are perpendicular, forming a $90^\circ$ angle.'
    aliases:
    - '90 degrees'
    - 'perpendicular'
  skills:
  - geometry-circle-chords-secants-tangents
- id: item-two-tangents-theorem
  type: flashcard
  prompt: 'What is true about the lengths of two tangent segments drawn from the same external point to a circle?'
  answer:
    expected: 'They are equal in length.'
    aliases:
    - 'They are equal'
    - 'They are congruent'
  skills:
  - geometry-circle-chords-secants-tangents
- id: item-intersecting-chords-theorem
  type: flashcard
  prompt: 'If two chords intersect inside a circle, what is the relationship between the lengths of their segments?'
  answer:
    expected: 'The product of the segments of one chord equals the product of the segments of the other chord.'
    aliases:
    - 'The product of their parts are equal'
    - 'a times b equals c times d'
  skills:
  - geometry-circle-chords-secants-tangents
