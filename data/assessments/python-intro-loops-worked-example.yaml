workedExamples:
- id: we001
  title: Building a counted loop in Python
  problem: Write a Python function that uses a loop to add the integers from $1$ through
    $n$.
  steps:
  - id: step-we001-1
    title: Identify the repeated action
    instruction: Start by deciding what operation must happen more than once.
    type: multipleChoice
    prompt: In a function that adds the integers from $1$ through $n$, what is the
      repeated action?
    choices:
    - id: a
      text: Add the current number to a running total.
    - id: b
      text: Return before the loop runs.
    - id: c
      text: Rename the function each iteration.
    - id: d
      text: Create a new list for every number.
    answer:
      choiceId: a
    hint: Each iteration should contribute one number to the answer.
    explanation: |
      The loop repeats the same action: add the current number to an accumulator.

      Related topic: Loop accumulation patterns in Python.

      Read further: Study `for` loops and accumulator variables in a Python control-flow chapter.
  - id: step-we001-2
    title: Choose the range
    instruction: Python's `range` stops before the ending value, so choose the endpoint
      carefully.
    type: multipleChoice
    prompt: Which loop visits every integer from `1` through `n`?
    choices:
    - id: a
      text: '`for i in range(1, n + 1):`'
    - id: b
      text: '`for i in range(1, n):`'
    - id: c
      text: '`for i in range(n, 1):`'
    - id: d
      text: '`for i in range(0, n - 1):`'
    answer:
      choiceId: a
    hint: The stop value is excluded.
    explanation: |
      `range(1, n + 1)` starts at `1` and stops just before `n + 1`, so it includes `n`.

      Related topic: Python `range(start, stop)` endpoint rules.

      Read further: Review\rhow `range` treats the stop argument and\rhow that causes off-by-one errors.
  - id: step-we001-3
    title: Initialize the accumulator
    instruction: The running total must exist before it is updated.
    type: multipleChoice
    prompt: Before the loop starts, what should `total` be set to?
    choices:
    - id: a
      text: '`0`'
    - id: b
      text: '`1`'
    - id: c
      text: '`n`'
    - id: d
      text: '`range(n)`'
    answer:
      choiceId: a
    hint: A sum starts with the value that changes nothing when added.
    explanation: |
      A sum accumulator should start at `0`, then each loop iteration adds one more value.

      Related topic: Initializing variables before a loop.

      Read further: Review accumulator variables and why they must be assigned before the loop body uses them.
  - id: step-we001-4
    title: Update inside the loop
    instruction: Pick the statement that changes the running total correctly.
    type: multipleChoice
    prompt: Which statement should go inside the loop body?
    choices:
    - id: a
      text: '`total += i`'
    - id: b
      text: '`i += total`'
    - id: c
      text: '`total = n`'
    - id: d
      text: '`return i`'
    answer:
      choiceId: a
    hint: The total should absorb the current number.
    explanation: |
      `total += i` adds the current loop value to the accumulator.

      Related topic: Compound assignment in Python loops.

      Read further: Look up `+=` and the indentation rules that determine what belongs inside a loop.
  - id: step-we001-5
    title: Complete the function
    instruction: 'Put the loop together inside the full function definition.


      Submit the complete `sum_to_n(n)` function shown in the starter code. Keep the
      function name and parameter exactly the same. The app will call your function
      with test inputs, so do not write `print(...)`, do not call the function yourself,
      and do not submit only the loop body.

      '
    type: code
    prompt: |
      Complete the Python function so it returns the sum of the integers from `1` through `n`.

      Your answer should be the entire function definition:

      ```python
      def sum_to_n(n):
          ...
      ```

      The test runner will call `sum_to_n(5)`, `sum_to_n(1)`, and `sum_to_n(10)` automatically.
    language: python
    functionName: sum_to_n
    starterCode: "def sum_to_n(n):\n    total = 0\n    # Add the integers 1 through\
      \ n.\n    return total\n"
    tests:
    - input: '5'
      expected: '15'
    - input: '1'
      expected: '1'
    - input: '10'
      expected: '55'
    answer: {}
    hint: Keep `def sum_to_n(n):`, add a `for i in range(1, n + 1):` loop inside it,
      update `total`, and return `total` after the loop.
    explanation: |
      The submitted answer should be a complete function definition named `sum_to_n`. The runner imports that submitted function and calls it with each test input.

      A correct solution initializes `total`, loops through `range(1, n + 1)`, adds each `i`, and returns `total` after the loop. Do not include `print` statements or manual calls like `sum_to_n(5)`; the test harness handles those calls.

      Related topic: Complete counted-loop accumulation in Python.

      Read further: Practice Python functions that combine `for`, `range`, indentation, and return values.
