questions:
- id: q001
  type: multipleChoice
  prompt: Evaluate $1000001^2-999999^2$.
  choices:
  - {id: a, text: '$2000000$'}
  - {id: b, text: '$3999998$'}
  - {id: c, text: '$4000000$'}
  - {id: d, text: '$4000004$'}
  answer: {choiceId: c}
  explanation: The difference of squares is $2\cdot2000000=4000000$.
  skills: [evaluate-with-identities]
- id: q002
  type: multipleChoice
  prompt: Factor $16m^4-n^4$ completely over the real numbers.
  choices:
  - {id: a, text: '$(2m-n)(2m+n)(4m^2+n^2)$'}
  - {id: b, text: '$(4m-n)(4m+n)$'}
  - {id: c, text: '$(4m^2-n^2)^2$'}
  - {id: d, text: '$(2m-n)^2(2m+n)^2$'}
  answer: {choiceId: a}
  explanation: First factor $(4m^2)^2-(n^2)^2$, then factor $4m^2-n^2$ again.
  skills: [factor-repeated-differences-of-squares]
- id: q003
  type: multipleChoice
  prompt: If $p+q=7$ and $pq=10$, find $p^3+q^3$.
  choices:
  - {id: a, text: '$103$'}
  - {id: b, text: '$133$'}
  - {id: c, text: '$210$'}
  - {id: d, text: '$343$'}
  answer: {choiceId: b}
  explanation: $(p+q)^3-3pq(p+q)=343-210=133$.
  skills: [derive-symmetric-cubic-sums]
- id: q004
  type: multipleChoice
  prompt: If $u-v=4$ and $uv=3$, find $u^2+v^2$.
  choices:
  - {id: a, text: '$10$'}
  - {id: b, text: '$16$'}
  - {id: c, text: '$22$'}
  - {id: d, text: '$28$'}
  answer: {choiceId: c}
  explanation: $(u-v)^2=u^2-2uv+v^2$, so $u^2+v^2=16+6=22$.
  skills: [rewrite-symmetric-expressions]
- id: q005
  type: multipleChoice
  prompt: A nonzero real $r$ satisfies $r+1/r=3$. Find $r^3+1/r^3$.
  choices:
  - {id: a, text: '$9$'}
  - {id: b, text: '$18$'}
  - {id: c, text: '$24$'}
  - {id: d, text: '$27$'}
  answer: {choiceId: b}
  explanation: $(r+1/r)^3=r^3+1/r^3+3(r+1/r)$, so the target is $27-9=18$.
  skills: [build-reciprocal-cubic-powers]
- id: q006
  type: multipleChoice
  prompt: A nonzero real $z$ satisfies $z+1/z=4$. Find $z^4+1/z^4$.
  choices:
  - {id: a, text: '$190$'}
  - {id: b, text: '$192$'}
  - {id: c, text: '$194$'}
  - {id: d, text: '$196$'}
  answer: {choiceId: c}
  explanation: First $z^2+z^{-2}=4^2-2=14$; then $z^4+z^{-4}=14^2-2=194$.
  skills: [build-reciprocal-power-ladders]
- id: q007
  type: multipleChoice
  prompt: If $a+b=3$ and $ab=1$, find $a^4+b^4$.
  choices:
  - {id: a, text: '$45$'}
  - {id: b, text: '$47$'}
  - {id: c, text: '$49$'}
  - {id: d, text: '$81$'}
  answer: {choiceId: b}
  explanation: $a^2+b^2=9-2=7$, so $a^4+b^4=7^2-2(ab)^2=49-2=47$.
  skills: [derive-higher-symmetric-powers]
- id: q008
  type: multipleChoice
  prompt: Find all real solutions of $x^4-13x^2+36=0$.
  choices:
  - {id: a, text: '$x=2,3$'}
  - {id: b, text: '$x=-2,-3$'}
  - {id: c, text: '$x=\pm2,\pm3$'}
  - {id: d, text: '$x=\pm4,\pm9$'}
  answer: {choiceId: c}
  explanation: With $u=x^2$, $(u-4)(u-9)=0$, so $x^2=4$ or $9$ and both signs occur.
  skills: [solve-disguised-factorizations]
- id: q009
  type: multipleChoice
  prompt: Simplify $(x^2+x+1)(x-1)$.
  choices:
  - {id: a, text: '$x^3-1$'}
  - {id: b, text: '$x^3+1$'}
  - {id: c, text: '$x^3-x$'}
  - {id: d, text: '$x^2-1$'}
  answer: {choiceId: a}
  explanation: This is the difference-of-cubes factorization $(x-1)(x^2+x+1)$.
  skills: [recognize-reversed-identities]
- id: q010
  type: multipleChoice
  prompt: Evaluate $1001\cdot999$ without long multiplication.
  choices:
  - {id: a, text: '$998999$'}
  - {id: b, text: '$999999$'}
  - {id: c, text: '$1000000$'}
  - {id: d, text: '$1000999$'}
  answer: {choiceId: b}
  explanation: $(1000+1)(1000-1)=1000^2-1=999999$.
  skills: [evaluate-conjugate-products]
- id: q011
  type: multipleChoice
  prompt: Positive real numbers $a,b$ satisfy $a^2-b^2=0$. What must follow?
  choices:
  - {id: a, text: '$a=b$'}
  - {id: b, text: '$a=-b$'}
  - {id: c, text: '$a=0$ only'}
  - {id: d, text: '$ab=0$'}
  answer: {choiceId: a}
  explanation: $(a-b)(a+b)=0$. Positivity makes $a+b>0$, leaving $a-b=0$.
  skills: [reason-from-factor-cases]
- id: q012
  type: multipleChoice
  prompt: Solve $x(x-1)=x(x-2)$ over the real numbers.
  choices:
  - {id: a, text: No solution}
  - {id: b, text: '$x=0$'}
  - {id: c, text: '$x=1$'}
  - {id: d, text: Every real number}
  answer: {choiceId: b}
  explanation: Subtracting gives $x[(x-1)-(x-2)]=x=0$. Cancelling $x$ initially would lose the solution.
  skills: [avoid-invalid-cancellation]
- id: q013
  type: selectAll
  prompt: Which quantities are determined solely by knowing $s=a+b$ and $p=ab$?
  choices:
  - {id: a, text: '$a^2+b^2$'}
  - {id: b, text: '$a^3+b^3$'}
  - {id: c, text: '$a-b$, with its sign uniquely fixed'}
  - {id: d, text: '$(a-b)^2$'}
  answer:
    choiceIds: [a, b, d]
  explanation: The first, second, and fourth are symmetric; swapping $a,b$ changes the sign of $a-b$ without changing $s,p$.
  skills: [identify-symmetric-invariants]
- id: q014
  type: selectAll
  prompt: Which factorizations are correct?
  choices:
  - {id: a, text: '$27y^3+8=(3y+2)(9y^2-6y+4)$'}
  - {id: b, text: '$x^3-x=x(x-1)(x+1)$'}
  - {id: c, text: '$a^4-16=(a^2-4)(a^2+4)$'}
  - {id: d, text: '$a^2+b^2=(a-b)(a+b)$'}
  answer:
    choiceIds: [a, b, c]
  explanation: Choice d is the factorization of $a^2-b^2$, not $a^2+b^2$.
  skills: [verify-compound-factorizations]
- id: q015
  type: freeResponse
  prompt: |-
    Let $R_n=x^n+x^{-n}$ for a nonzero $x$, and let $t=x+x^{-1}$. Derive the recurrence
    $$R_{n+1}=tR_n-R_{n-1}$$
    for integers $n\ge1$.
  answer:
    gradingMode: selfCheck
    expected: |-
      Multiply:
      $$tR_n=(x+x^{-1})(x^n+x^{-n})=x^{n+1}+x^{n-1}+x^{-(n-1)}+x^{-(n+1)}.$$
      The outer pair is $R_{n+1}$ and the inner pair is $R_{n-1}$. Thus $tR_n=R_{n+1}+R_{n-1}$, and rearranging gives $R_{n+1}=tR_n-R_{n-1}$.
    keyPoints:
    - States $x\ne0$.
    - Expands $tR_n$ into four powers.
    - Groups the powers as $R_{n+1}+R_{n-1}$.
    - Rearranges to the requested recurrence.
  explanation: The recurrence comes from pairing neighboring reciprocal powers after multiplication by $x+x^{-1}$.
  skills: [derive-reciprocal-recurrences]
