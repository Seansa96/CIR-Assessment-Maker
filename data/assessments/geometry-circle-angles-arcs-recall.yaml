skills:
- geometry-circle-angles-arcs
items:
- id: item-central-angle
  type: flashcard
  prompt: 'What is the relationship between a central angle and its intercepted arc?'
  answer:
    expected: 'A central angle is equal to the measure of its intercepted arc.'
    aliases:
    - 'They are equal'
    - 'The central angle equals the intercepted arc'
  skills:
  - geometry-circle-angles-arcs
- id: item-inscribed-angle
  type: symbolic
  prompt: 'Write the formula for the measure of an inscribed angle $\theta$ given its intercepted arc $a$.'
  answer:
    expectedLatex: '\frac{1}{2}a'
    equivalenceMode: expression
    variables:
    - a
  skills:
  - geometry-circle-angles-arcs
- id: item-interior-intersecting-chords
  type: symbolic
  prompt: 'Write the formula for the interior angle $\theta$ formed by two intersecting chords, given the two intercepted arcs $a$ and $b$.'
  answer:
    expectedLatex: '\frac{1}{2}(a+b)'
    equivalenceMode: expression
    variables:
    - a
    - b
  skills:
  - geometry-circle-angles-arcs
- id: item-exterior-angle-secants
  type: symbolic
  prompt: 'Write the formula for the exterior angle $\theta$ formed by two secants (or tangents), given the intercepted arcs $a$ (larger) and $b$ (smaller).'
  answer:
    expectedLatex: '\frac{1}{2}(a-b)'
    equivalenceMode: expression
    variables:
    - a
    - b
  skills:
  - geometry-circle-angles-arcs
