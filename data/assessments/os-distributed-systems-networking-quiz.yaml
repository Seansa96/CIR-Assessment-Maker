questions:
- id: q001
  type: multipleChoice
  skills:
  - os-networking
  blueprintId: os-networking-rpc-flow
  prompt: When a server receives a packet from a client in an RPC system, which component
    is responsible for unpacking (unmarshaling) the parameters?
  choices:
  - id: a
    text: The Network Router
  - id: b
    text: The Client Stub
  - id: c
    text: The Server Stub
  - id: d
    text: The Application Layer
  answer:
    choiceId: c
  explanation: The Server Stub unmarshals the data received from the network and invokes
    the actual server function.
- id: q002
  type: multipleChoice
  skills:
  - os-networking
  blueprintId: os-networking-middleware-layers
  prompt: If an application needs to seamlessly access files across Windows and Linux
    servers, what type of software layer is typically used to abstract the differences?
  choices:
  - id: a
    text: Network Hardware Layer
  - id: b
    text: File-System-Based Middleware
  - id: c
    text: Kernel Scheduler
  - id: d
    text: Microcode
  answer:
    choiceId: b
  explanation: File-System-Based middleware abstracts the underlying OS differences
    and provides a common filesystem interface.
