authoring: { visualRequirement: required, visualRationale: 'Each item requires a learner-created diagram that distinguishes slice orientation, axis distance, and solid overlap.', difficultyTier: hard }
questions:
  - { id: q001, type: symbolicResponse, prompt: 'Rotate the region between $y=x^2$ and $y=4$ for $0\le x\le2$ about $y=5$. Find the volume.', answer: { expectedLatex: '416\pi/15', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=5-x^2$, $r=1$, so $V=\pi\int_0^2[(5-x^2)^2-1]dx=\pi\int_0^2(24-10x^2+x^4)dx=416\pi/15$. Why it works: The axis is above the region, making the lower curve the outer radius. Common trap: Using graph height as radius ignores the shifted axis.', difficultyDimensions: [representationTransfer, reverseReasoning, auxiliaryTechnique], difficultyEvidence: 'Compares offset distances, reverses ordinary upper/lower intuition, and expands a square.' }
  - { id: q002, type: symbolicResponse, prompt: 'Rotate $0\le x\le4$, $0\le y\le2$ about $x=2$. Find the shell volume without double-counting overlap.', answer: { expectedLatex: '16\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Use only $0\le x\le2$: $V=2\pi\int_0^2(2-x)(2)dx=16\pi$. Why it works: Strips at x and $4-x$ create the same physical shell after rotation. Common trap: Integrating both sides counts every shell twice.', difficultyDimensions: [globalLocalReasoning, casePartition, modelOrDerivation], difficultyEvidence: 'An interior axis requires recognizing duplicate shells and restricting the physical radial domain.' }
  - { id: q003, type: symbolicResponse, prompt: 'The base is the upper semicircle $x^2+y^2\le4$. Perpendicular cross sections are equilateral triangles. Find the volume.', answer: { expectedLatex: '8\sqrt{3}/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The chord side is $s=\sqrt{4-x^2}$, so $A=\sqrt3s^2/4=\sqrt3(4-x^2)/4$. Thus $V=\int_{-2}^2A\,dx=8\sqrt3/3$. Why it works: The visible semicircle height is half the chord; the full chord supplies the triangle side. Common trap: Using $\sqrt{4-x^2}$ as a radius or half-width gives half the correct geometry.', difficultyDimensions: [representationTransfer, modelOrDerivation, simplification], difficultyEvidence: 'Turns a circular chord into a triangle side, applies an area formula, and removes a radical by squaring.' }
  - { id: q004, type: symbolicResponse, prompt: 'Use horizontal washers to rotate the region under $y=\sqrt{x}$, $0\le x\le4$, about the y-axis.', answer: { expectedLatex: '128\pi/5', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Invert to $x=y^2$, $0\le y\le2$. $R=4$, $r=y^2$, so $V=\pi\int_0^2(16-y^4)dy=128\pi/5$. Why it works: The chosen $dy$ slice is perpendicular to the vertical axis. Common trap: A vertical $dx$ slice yields shells; it cannot be used in a washer formula.', difficultyDimensions: [representationTransfer, auxiliaryTechnique, modelOrDerivation], difficultyEvidence: 'Requires inversion, a variable/bound change, and a method-consistent slice orientation.' }
  - { id: q005, type: symbolicResponse, prompt: 'Rotate the region under $y=1-x^2$ on $[-1,1]$ about the y-axis. Use shells without double-counting the solid.', answer: { expectedLatex: '\pi/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Use one side only: $V=2\pi\int_0^1x(1-x^2)dx=2\pi(1/2-1/4)=\pi/2$. Why it works: Opposite strips make the same shell when the axis passes through the region. Common trap: Doubling this integral would count overlapping shells twice.', difficultyDimensions: [globalLocalReasoning, errorDiagnosis, modelOrDerivation], difficultyEvidence: 'Requires physical-solid reasoning beyond a mechanically symmetric integral.' }
  - { id: q006, type: symbolicResponse, prompt: 'The base lies between $y=x$ and $y=4-x$ on $0\le x\le2$. Cross sections are right isosceles triangles whose legs equal the base width. Find the volume.', answer: { expectedLatex: '16/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Width is $w=4-2x$. A right isosceles triangle with legs w has area $w^2/2$. Thus $V=\int_0^2(4-2x)^2/2\,dx=16/3$. Why it works: The given width is a leg, not a hypotenuse or area. Common trap: Using $w^2$ misses the triangle factor $1/2$.', difficultyDimensions: [modelOrDerivation, identityConstruction, auxiliaryTechnique], difficultyEvidence: 'Derives width from boundaries, translates it through a shape formula, and integrates the resulting polynomial.' }
  - { id: q007, type: freeResponse, prompt: 'A student writes $\pi\int_0^4(4-x)^2dx$ for rotating the region under $y=4-x$ about the y-axis. Diagnose why this is not a valid disk/washer model and give a correct shell setup.', answer: { gradingMode: selfCheck, keyPoints: ['vertical axis needs horizontal washers or vertical shells', 'vertical strips are parallel to axis', 'two pi integral x times four minus x from zero to four'] }, explanation: 'Solution: Vertical $dx$ strips are parallel to the y-axis, so they form shells rather than disks. The correct setup is $V=2\pi\int_0^4x(4-x)dx$. Why it works: Disk/washer slices must be perpendicular to the axis. Common trap: Squaring a vertical height does not make it a radius to the y-axis.', difficultyDimensions: [errorDiagnosis, representationTransfer, reverseReasoning], difficultyEvidence: 'Works backward from an invalid formula to identify slice orientation and repair the model.' }
  - { id: q008, type: symbolicResponse, prompt: 'Rotate the region under $y=x$ on $0\le x\le3$ about $x=1$ using shells.', answer: { expectedLatex: '29\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi[\int_0^1(1-x)x\,dx+\int_1^3(x-1)x\,dx]=2\pi(1/6+14/3)=29\pi/3$. Why it works: Radius is $|x-1|$, so the integral must be partitioned at the axis. Common trap: A single signed $(x-1)x$ integral allows negative radii to cancel positive volume.', difficultyDimensions: [casePartition, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Uses an absolute-distance radius, partitions at the axis, and evaluates separate shell integrals.' }
  - { id: q009, type: symbolicResponse, prompt: 'For the region bounded by $y=x$ and $y=4$, give the shell setup for rotation about the y-axis and explain why shells are more direct than washers.', answer: { expectedLatex: '2\pi\int_0^4x(4-x)dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: Vertical shells have radius x and height $4-x$, so $V=2\pi\int_0^4x(4-x)dx$. Why it works: A washer model would require solving $x=y$ and horizontal slices, while the given y-functions already give shell height. Common trap: Axis direction alone does not choose a method; representation simplicity does.', difficultyDimensions: [representationTransfer, reverseReasoning, modelOrDerivation], difficultyEvidence: 'Compares two models and justifies the representation that avoids unnecessary inversion.' }
  - { id: q010, type: symbolicResponse, prompt: 'Rotate the region between $y=x$ and $y=2x$ on $0\le x\le1$ about $y=3$. Find the volume.', answer: { expectedLatex: '2\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $R=3-x$ and $r=3-2x$. Thus $V=\pi\int_0^1[(3-x)^2-(3-2x)^2]dx=\pi\int_0^1(6x-3x^2)dx=2\pi$. Why it works: The lower curve is farther from the axis above the region. Common trap: Naming the upper curve outer reverses the area.', difficultyDimensions: [representationTransfer, reverseReasoning, auxiliaryTechnique], difficultyEvidence: 'Compares offset distances, reverses curve-order intuition, and simplifies a difference of squares.' }
  - { id: q011, type: symbolicResponse, prompt: 'A base has width $2\sqrt{x}$ on $0\le x\le4$. Cross sections are semicircles with that width as diameter. Find the volume.', answer: { expectedLatex: '4\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $r=\sqrt{x}$ and $A=\pi r^2/2=\pi x/2$. Thus $V=\int_0^4\pi x/2\,dx=4\pi$. Why it works: The stated width is a diameter, so it must be halved before area is computed. Common trap: Treating $2\sqrt{x}$ as radius multiplies area by four.', difficultyDimensions: [modelOrDerivation, simplification, auxiliaryTechnique], difficultyEvidence: 'Converts diameter to radius, simplifies a radical through squaring, and integrates a cross-section area.' }
  - { id: q012, type: freeResponse, prompt: 'A region is described by $x=y^2$ and $x=4$ and is rotated about the x-axis. Explain why a requested washer setup with $dy$ is invalid, then give a valid disk/washer setup.', answer: { gradingMode: selfCheck, keyPoints: ['horizontal dy strips are parallel to x axis', 'they make shells', 'vertical dx disks radius square root x', 'pi integral zero to four x dx'] }, explanation: 'Solution: Horizontal $dy$ strips are parallel to the x-axis, so they make shells. Vertical $dx$ strips are perpendicular and give disks of radius $\sqrt{x}$: $V=\pi\int_0^4x\,dx$. Why it works: Slice orientation, not merely the integration variable, determines the solid type. Common trap: A requested formula can be geometrically impossible and should be rejected rather than forced.', difficultyDimensions: [errorDiagnosis, representationTransfer, reverseReasoning], difficultyEvidence: 'Evaluates method feasibility, rejects a bad representation, and constructs the correct alternative.' }
  - { id: q013, type: symbolicResponse, prompt: 'Rotate the region under $y=x$ on $0\le x\le1$ about $y=2$. Find the volume.', answer: { expectedLatex: '5\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The outer radius is 2 and inner radius is $2-x$. $V=\pi\int_0^1[4-(2-x)^2]dx=\pi\int_0^1(4x-x^2)dx=5\pi/3$. Why it works: The axis is outside the region, so both radius distances are positive. Common trap: Using x as a radius incorrectly measures to the x-axis.', difficultyDimensions: [representationTransfer, modelOrDerivation, simplification], difficultyEvidence: 'Measures offset radii, expands their squared difference, and integrates.' }
  - { id: q014, type: symbolicResponse, prompt: 'Rotate the region between $y=x^2$ and $y=2x$ about the y-axis. Find the volume.', answer: { expectedLatex: '8\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Intersections are x=0 and x=2; shell height is $2x-x^2$. Thus $V=2\pi\int_0^2x(2x-x^2)dx=8\pi/3$. Why it works: The line is above the parabola on the enclosed interval. Common trap: Bounds must come from intersections, not from an assumed unit interval.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, domainCondition], difficultyEvidence: 'Finds boundaries, determines curve order, and forms a cubic shell integrand.' }
  - { id: q015, type: symbolicResponse, prompt: 'The base is bounded by $y=0$, $y=x$, and $x=2$. Cross sections perpendicular to the y-axis are squares. Find the volume.', answer: { expectedLatex: '8/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: At y, width is $2-y$, so $A=(2-y)^2$. $V=\int_0^2(2-y)^2dy=8/3$. Why it works: The stated direction forces horizontal slices and y-bounds. Common trap: Keeping dx would use the wrong cross-section family.', difficultyDimensions: [representationTransfer, modelOrDerivation, domainCondition], difficultyEvidence: 'Changes variable, solves a boundary for x, and uses the corresponding y interval.' }
  - { id: q016, type: freeResponse, prompt: 'A shell setup for rotating $y=x^2$ on $0\le x\le2$ about the y-axis is written as $\pi\int_0^2x^4dx$. Diagnose the error and repair it.', answer: { gradingMode: selfCheck, keyPoints: ['pi x fourth is disk style', 'shell circumference is two pi x', 'height x squared', 'two pi integral x cubed'] }, explanation: 'Solution: $\pi x^4$ treats the strip as a disk. A shell uses circumference times height: $V=2\pi\int_0^2x(x^2)dx$. Why it works: A vertical strip parallel to the axis rolls into a hollow cylinder. Common trap: Disk and shell formulas cannot be interchanged just because both include $\pi$.', difficultyDimensions: [errorDiagnosis, reverseReasoning, modelOrDerivation], difficultyEvidence: 'Identifies an inappropriate geometric model and reconstructs the correct shell geometry.' }
  - { id: q017, type: symbolicResponse, prompt: 'Use shells to rotate $y=\sqrt{x}$ on $0\le x\le4$ about the y-axis.', answer: { expectedLatex: '128\pi/5', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^4x\sqrt{x}dx=2\pi[2x^{5/2}/5]_0^4=128\pi/5$. Why it works: The shell radius is x and height is $\sqrt{x}$. Common trap: The antiderivative of $x^{3/2}$ is $2x^{5/2}/5$, not $x^{5/2}/3$.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: 'Forms a fractional-power shell integrand and evaluates its noninteger endpoint power.' }
  - { id: q018, type: symbolicResponse, prompt: 'Rotate the region under $y=x$ on $0\le x\le3$ about $x=1$. Find the volume using shells.', answer: { expectedLatex: '29\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Split at x=1: $V=2\pi[\int_0^1(1-x)x\,dx+\int_1^3(x-1)x\,dx]=29\pi/3$. Why it works: Radius is absolute distance to the axis. Common trap: The negative side cannot be left signed because volume radii are nonnegative.', difficultyDimensions: [casePartition, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Requires a sign partition and separate exact integrations.' }
  - { id: q019, type: freeResponse, prompt: 'For rotating the region between $y=x$ and $y=4$ about the y-axis, compare shells and washers. State which is more direct and one valid setup for each.', answer: { gradingMode: selfCheck, keyPoints: ['shells more direct', 'shell setup two pi integral x times four minus x', 'washer setup pi integral y squared dy from zero to four'] }, explanation: 'Solution: Shells are more direct: $2\pi\int_0^4x(4-x)dx$. Horizontal washers also work: $V=\pi\int_0^4y^2dy$. Why it works: The region runs from x=0 to x=y at height y, so each horizontal slice is a disk of radius y. Common trap: A valid alternative method need not be the simplest representation.', difficultyDimensions: [representationTransfer, reverseReasoning, modelOrDerivation], difficultyEvidence: 'Builds and compares two legitimate models using different variables and geometric descriptions.' }
  - { id: q020, type: symbolicResponse, prompt: 'The region $0\le x\le2$, $1\le y\le3$ rotates about $x=4$. Find the shell volume.', answer: { expectedLatex: '24\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is $4-x$ and shell height is 2. $V=2\pi\int_0^2(4-x)(2)dx=24\pi$. Why it works: The axis lies outside the region, so one positive radius expression applies. Common trap: x is a location, not the distance to an axis at x=4.', difficultyDimensions: [representationTransfer, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: 'Uses an external shifted axis, a constant height, and an exact shell integral.' }
