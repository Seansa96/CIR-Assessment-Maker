glossary:
  introduction: |
    Master the formulas, charges, and names of common polyatomic ions. These ions are groups of covalently bonded atoms that carry an overall charge and act as single discrete units in ionic compounds.
  sections:
    - id: cations
      title: Polyatomic Cations
      required: true
      content: |
        There is only one common polyatomic cation you need to memorize in introductory chemistry.
      entries:
        - id: ammonium
          term: Ammonium
          definition: |
            A positively charged polyatomic ion formed by the protonation of ammonia.
          notation: '$NH_4^+$'
          examples:
            - 'Found in ammonium chloride ($NH_4Cl$) and ammonium nitrate ($NH_4NO_3$).'
          aliases: []
          media: []
          tags: [cation, nitrogen]
          drills:
            - id: ammonium-formula
              type: flashcard
              prompt: 'What is the formula and charge of the ammonium ion?'
              answer:
                expected: '$NH_4^+$'
                aliases: [NH4+]
              explanation: Ammonium is $NH_4^+$, the only common polyatomic cation.
              tags: [cation, nitrogen]

    - id: oxygen-hydrogen-carbon
      title: Oxygen, Hydrogen, and Carbon Based Anions
      required: true
      content: |
        These common anions are frequently encountered in basic chemical reactions, acids, and bases.
      entries:
        - id: hydroxide
          term: Hydroxide
          definition: |
            A diatomic anion consisting of oxygen and hydrogen. It is the defining ion of Arrhenius bases.
          notation: '$OH^-$'
          examples:
            - 'Found in strong bases like sodium hydroxide ($NaOH$).'
          aliases: []
          media: []
          tags: [hydroxide, base, anion]
          drills:
            - id: hydroxide-formula
              type: flashcard
              prompt: 'What is the formula and charge of the hydroxide ion?'
              answer:
                expected: '$OH^-$'
                aliases: [OH-]
              explanation: Hydroxide is $OH^-$.
              tags: [hydroxide, anion]
              
        - id: carbonate
          term: Carbonate
          definition: |
            A polyatomic anion containing one carbon and three oxygen atoms.
          notation: '$CO_3^{2-}$'
          examples:
            - 'Found in calcium carbonate ($CaCO_3$, limestone).'
          aliases: []
          media: []
          tags: [carbonate, carbon, anion]
          drills:
            - id: carbonate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the carbonate ion?'
              answer:
                expected: '$CO_3^{2-}$'
                aliases: [CO3 2-]
              explanation: Carbonate is $CO_3^{2-}$.
              tags: [carbonate, anion]

        - id: bicarbonate
          term: Bicarbonate (Hydrogen Carbonate)
          definition: |
            Formed by adding a hydrogen ion ($H^+$) to a carbonate ion.
          notation: '$HCO_3^-$'
          examples:
            - 'Found in baking soda (sodium bicarbonate, $NaHCO_3$).'
          aliases: [Hydrogen carbonate]
          media: []
          tags: [bicarbonate, carbon, anion]
          drills:
            - id: bicarbonate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the bicarbonate ion?'
              answer:
                expected: '$HCO_3^-$'
                aliases: [HCO3-]
              explanation: Bicarbonate is $HCO_3^-$. Adding $H^+$ to $CO_3^{2-}$ results in a 1- charge.
              tags: [bicarbonate, anion]

        - id: acetate
          term: Acetate
          definition: |
            The conjugate base of acetic acid.
          notation: '$C_2H_3O_2^-$ or $CH_3COO^-$'
          examples:
            - 'Found in sodium acetate ($NaC_2H_3O_2$).'
          aliases: [Ethanoate]
          media: []
          tags: [acetate, carbon, anion]
          drills:
            - id: acetate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the acetate ion?'
              answer:
                expected: '$C_2H_3O_2^-$ or $CH_3COO^-$'
                aliases: [C2H3O2-, CH3COO-]
              explanation: Acetate is $C_2H_3O_2^-$ or $CH_3COO^-$.
              tags: [acetate, anion]
              
        - id: cyanide
          term: Cyanide
          definition: |
            A highly toxic diatomic anion containing carbon triple-bonded to nitrogen.
          notation: '$CN^-$'
          examples:
            - 'Found in potassium cyanide ($KCN$).'
          aliases: []
          media: []
          tags: [cyanide, carbon, nitrogen, anion]
          drills:
            - id: cyanide-formula
              type: flashcard
              prompt: 'What is the formula and charge of the cyanide ion?'
              answer:
                expected: '$CN^-$'
                aliases: [CN-]
              explanation: Cyanide is $CN^-$.
              tags: [cyanide, anion]

    - id: nitrogen-oxyanions
      title: Nitrogen Oxyanions
      required: true
      content: |
        Oxyanions containing nitrogen. Note the naming pattern: the "-ate" ion has more oxygen atoms than the "-ite" ion.
      entries:
        - id: nitrate
          term: Nitrate
          definition: |
            The most common nitrogen oxyanion, where nitrogen is in the +5 oxidation state.
          notation: '$NO_3^-$'
          examples:
            - 'Found in potassium nitrate ($KNO_3$), used in fertilizers and explosives.'
          aliases: []
          media: []
          tags: [nitrate, nitrogen, oxyanion, anion]
          drills:
            - id: nitrate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the nitrate ion?'
              answer:
                expected: '$NO_3^-$'
                aliases: [NO3-]
              explanation: Nitrate is $NO_3^-$.
              tags: [nitrate, anion]

        - id: nitrite
          term: Nitrite
          definition: |
            A nitrogen oxyanion with one less oxygen atom than nitrate.
          notation: '$NO_2^-$'
          examples:
            - 'Found in sodium nitrite ($NaNO_2$), used as a food preservative.'
          aliases: []
          media: []
          tags: [nitrite, nitrogen, oxyanion, anion]
          drills:
            - id: nitrite-formula
              type: flashcard
              prompt: 'What is the formula and charge of the nitrite ion?'
              answer:
                expected: '$NO_2^-$'
                aliases: [NO2-]
              explanation: Nitrite is $NO_2^-$. The "-ite" suffix indicates one less oxygen than the "-ate" ion ($NO_3^-$).
              tags: [nitrite, anion]

    - id: sulfur-oxyanions
      title: Sulfur Oxyanions
      required: true
      content: |
        Oxyanions containing sulfur. Note that both sulfate and sulfite carry a 2- charge.
      entries:
        - id: sulfate
          term: Sulfate
          definition: |
            The most common sulfur oxyanion.
          notation: '$SO_4^{2-}$'
          examples:
            - 'Found in copper(II) sulfate ($CuSO_4$).'
          aliases: []
          media: []
          tags: [sulfate, sulfur, oxyanion, anion]
          drills:
            - id: sulfate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the sulfate ion?'
              answer:
                expected: '$SO_4^{2-}$'
                aliases: [SO4 2-]
              explanation: Sulfate is $SO_4^{2-}$.
              tags: [sulfate, anion]

        - id: sulfite
          term: Sulfite
          definition: |
            A sulfur oxyanion with one less oxygen atom than sulfate.
          notation: '$SO_3^{2-}$'
          examples:
            - 'Found in sodium sulfite ($Na_2SO_3$).'
          aliases: []
          media: []
          tags: [sulfite, sulfur, oxyanion, anion]
          drills:
            - id: sulfite-formula
              type: flashcard
              prompt: 'What is the formula and charge of the sulfite ion?'
              answer:
                expected: '$SO_3^{2-}$'
                aliases: [SO3 2-]
              explanation: Sulfite is $SO_3^{2-}$. The "-ite" suffix indicates one less oxygen than the "-ate" ion ($SO_4^{2-}$).
              tags: [sulfite, anion]

    - id: phosphorus-oxyanions
      title: Phosphorus Oxyanions
      required: true
      content: |
        Oxyanions containing phosphorus. The phosphate ion carries a 3- charge, which is relatively rare.
      entries:
        - id: phosphate
          term: Phosphate
          definition: |
            The most common phosphorus oxyanion, essential in biology (e.g., DNA backbone, ATP).
          notation: '$PO_4^{3-}$'
          examples:
            - 'Found in sodium phosphate ($Na_3PO_4$).'
          aliases: []
          media: []
          tags: [phosphate, phosphorus, oxyanion, anion]
          drills:
            - id: phosphate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the phosphate ion?'
              answer:
                expected: '$PO_4^{3-}$'
                aliases: [PO4 3-]
              explanation: Phosphate is $PO_4^{3-}$.
              tags: [phosphate, anion]

    - id: halogen-oxyanions
      title: Halogen Oxyanions
      required: true
      content: |
        Halogens (like chlorine, bromine, and iodine) form a series of four oxyanions. They all carry a 1- charge. The naming prefixes and suffixes indicate the number of oxygen atoms.
      entries:
        - id: perchlorate
          term: Perchlorate
          definition: |
            The chlorine oxyanion with the most oxygen atoms (four). The prefix "per-" means "more than" (as in more than chlorate).
          notation: '$ClO_4^-$'
          examples:
            - 'Found in ammonium perchlorate ($NH_4ClO_4$), used in solid rocket boosters.'
          aliases: []
          media: []
          tags: [perchlorate, chlorine, oxyanion, anion]
          drills:
            - id: perchlorate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the perchlorate ion?'
              answer:
                expected: '$ClO_4^-$'
                aliases: [ClO4-]
              explanation: Perchlorate is $ClO_4^-$.
              tags: [perchlorate, anion]

        - id: chlorate
          term: Chlorate
          definition: |
            The base chlorine oxyanion with three oxygen atoms.
          notation: '$ClO_3^-$'
          examples:
            - 'Found in potassium chlorate ($KClO_3$).'
          aliases: []
          media: []
          tags: [chlorate, chlorine, oxyanion, anion]
          drills:
            - id: chlorate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the chlorate ion?'
              answer:
                expected: '$ClO_3^-$'
                aliases: [ClO3-]
              explanation: Chlorate is $ClO_3^-$.
              tags: [chlorate, anion]

        - id: chlorite
          term: Chlorite
          definition: |
            The chlorine oxyanion with two oxygen atoms.
          notation: '$ClO_2^-$'
          examples:
            - 'Found in sodium chlorite ($NaClO_2$).'
          aliases: []
          media: []
          tags: [chlorite, chlorine, oxyanion, anion]
          drills:
            - id: chlorite-formula
              type: flashcard
              prompt: 'What is the formula and charge of the chlorite ion?'
              answer:
                expected: '$ClO_2^-$'
                aliases: [ClO2-]
              explanation: Chlorite is $ClO_2^-$.
              tags: [chlorite, anion]

        - id: hypochlorite
          term: Hypochlorite
          definition: |
            The chlorine oxyanion with the fewest oxygen atoms (one). The prefix "hypo-" means "less than" (as in less than chlorite).
          notation: '$ClO^-$'
          examples:
            - 'Found in sodium hypochlorite ($NaClO$), the active ingredient in household bleach.'
          aliases: []
          media: []
          tags: [hypochlorite, chlorine, oxyanion, anion]
          drills:
            - id: hypochlorite-formula
              type: flashcard
              prompt: 'What is the formula and charge of the hypochlorite ion?'
              answer:
                expected: '$ClO^-$'
                aliases: [ClO-]
              explanation: Hypochlorite is $ClO^-$.
              tags: [hypochlorite, anion]

    - id: transition-metal-oxyanions
      title: Transition Metal Oxyanions
      required: true
      content: |
        Some transition metals, like chromium and manganese, form polyatomic oxyanions where the metal is in a high oxidation state.
      entries:
        - id: chromate
          term: Chromate
          definition: |
            An oxyanion containing chromium in the +6 oxidation state.
          notation: '$CrO_4^{2-}$'
          examples:
            - 'Found in potassium chromate ($K_2CrO_4$).'
          aliases: []
          media: []
          tags: [chromate, chromium, oxyanion, anion]
          drills:
            - id: chromate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the chromate ion?'
              answer:
                expected: '$CrO_4^{2-}$'
                aliases: [CrO4 2-]
              explanation: Chromate is $CrO_4^{2-}$.
              tags: [chromate, anion]

        - id: dichromate
          term: Dichromate
          definition: |
            An oxyanion containing two chromium atoms, also in the +6 oxidation state.
          notation: '$Cr_2O_7^{2-}$'
          examples:
            - 'Found in potassium dichromate ($K_2Cr_2O_7$).'
          aliases: []
          media: []
          tags: [dichromate, chromium, oxyanion, anion]
          drills:
            - id: dichromate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the dichromate ion?'
              answer:
                expected: '$Cr_2O_7^{2-}$'
                aliases: [Cr2O7 2-]
              explanation: Dichromate is $Cr_2O_7^{2-}$.
              tags: [dichromate, anion]

        - id: permanganate
          term: Permanganate
          definition: |
            An oxyanion containing manganese in the +7 oxidation state. It is a very strong oxidizing agent and intensely purple in color.
          notation: '$MnO_4^-$'
          examples:
            - 'Found in potassium permanganate ($KMnO_4$).'
          aliases: []
          media: []
          tags: [permanganate, manganese, oxyanion, anion]
          drills:
            - id: permanganate-formula
              type: flashcard
              prompt: 'What is the formula and charge of the permanganate ion?'
              answer:
                expected: '$MnO_4^-$'
                aliases: [MnO4-]
              explanation: Permanganate is $MnO_4^-$.
              tags: [permanganate, anion]
