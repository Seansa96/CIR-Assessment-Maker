    instruction: What is the segment length?
    type: multipleChoice
    prompt: What is the segment length?
    choices:
    - id: a
      text: '5'
    - id: b
      text: The derivative r prime(t) (answers 'Which ingredient is required to evaluate a vector line integral from a parameterization?',
        not 'What is the segment length?')
      issueSignals:
      - id: line-integral-parameterization-error
    - id: c
      text: A scalar mass integral (answers 'Which line integral is independent of orientation?', not 'What is the segment
        length?')
      issueSignals:
      - id: sign-error
    - id: d
      text: Accumulated unit density along the segment. (answers 'What does the result measure?', not 'What is the segment
        length?')
      issueSignals:
      - id: line-integral-parameterization-error
    answer:
      choiceId: a
    issueSignals:
    - id: line-integral-parameterization-error
