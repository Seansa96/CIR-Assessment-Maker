questions:
  - id: conv-concept-1-rate-of-shrink
    title: Shrinking Too Slowly
    type: multipleChoice
    skills:
    - improper-integrals-convergence-concept
    prompt: |
      Both $f(x) = \frac{1}{x}$ and $g(x) = \frac{1}{x^2}$ approach $0$ as $x \to \infty$. 
      Why does the area under $g(x)$ from $[1, \infty)$ converge, but the area under $f(x)$ diverge?
    choices:
      - id: a
        text: 'Because $f(x)$ actually crosses the x-axis, creating negative area.'
      - id: b
        text: 'Because $f(x)$ does not shrink to zero fast enough to trap a finite amount of area.'
      - id: c
        text: 'Because $g(x)$ is undefined at $x=0$, which forces the infinite tail to converge.'
    answer:
      choiceId: b
    explanation: 'Simply approaching zero is not enough for an infinite region to have finite area; the function must approach zero *fast enough*. $1/x^2$ shrinks much faster than $1/x$, allowing its accumulated area to bound to a finite number.'
  - id: conv-concept-2-dct-logic
    title: Direct Comparison Logic
    type: multipleChoice
    skills:
    - improper-integrals-convergence-concept
    prompt: |
      You want to prove that $\int_1^\infty \frac{2 + \sin(x)}{x^3} \, dx$ converges. 
      Which of the following is the correct logical setup using the Direct Comparison Test?
    choices:
      - id: a
        text: 'Since $\frac{2 + \sin(x)}{x^3} \le \frac{3}{x^3}$ and $\int_1^\infty \frac{3}{x^3} \, dx$ converges (p-test), the original integral converges.'
      - id: b
        text: 'Since $\frac{2 + \sin(x)}{x^3} \ge \frac{1}{x^3}$ and $\int_1^\infty \frac{1}{x^3} \, dx$ converges (p-test), the original integral converges.'
      - id: c
        text: 'Since $\frac{2 + \sin(x)}{x^3} \le \frac{1}{x}$ and $\int_1^\infty \frac{1}{x} \, dx$ diverges, the original integral converges.'
    answer:
      choiceId: a
    explanation: 'To prove convergence with DCT, you must find a *larger* function that converges. Since the max value of $\sin(x)$ is $1$, the numerator is at most $3$. Thus the function is smaller than $3/x^3$, which converges by the p-test ($p=3 > 1$). Choice B proves nothing (being larger than a finite area doesn''t mean you are finite).'
  - id: conv-concept-3-lct-logic
    title: Limit Comparison Test
    type: multipleChoice
    skills:
    - improper-integrals-convergence-concept
    prompt: |
      When using the Limit Comparison Test (LCT) between $f(x)$ and $g(x)$, you evaluate $\lim_{x\to\infty} \frac{f(x)}{g(x)} = L$.
      If $0 < L < \infty$, what can you conclude?
    choices:
      - id: a
        text: 'Both integrals converge to the exact same numerical value $L$.'
      - id: b
        text: 'Both integrals behave the same (either both converge or both diverge).'
      - id: c
        text: 'The test is inconclusive, and you must use the Direct Comparison Test.'
    answer:
      choiceId: b
    explanation: 'A positive, finite limit in LCT means that the two functions grow/shrink at the exact same proportional rate as $x \to \infty$. Therefore, their areas must behave the exact same way—they share the same fate of convergence or divergence, though not necessarily the exact same area value.'
  - id: conv-concept-4-log-test
    title: Logarithmic Convergence
    type: multipleChoice
    skills:
    - improper-integrals-convergence-concept
    prompt: |
      Consider the integral $\int_2^\infty \frac{1}{x (\ln x)^p} \, dx$. 
      Based on u-substitution, under what conditions will this integral converge?
    choices:
      - id: a
        text: 'It converges for $p > 1$.'
      - id: b
        text: 'It converges for $p < 1$.'
      - id: c
        text: 'It converges for all $p > 0$.'
    answer:
      choiceId: a
    explanation: 'Using $u = \ln x$ and $du = \frac{1}{x}dx$, the integral becomes $\int_{\ln 2}^\infty \frac{1}{u^p} \, du$. This perfectly matches the standard $p$-test format, which requires $p > 1$ for convergence.'
