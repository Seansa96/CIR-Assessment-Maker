items:
- id: gray-code-property
  type: flashcard
  prompt: What is the key adjacency property of Gray code?
  answer:
    expected: Adjacent encoded values differ in exactly one bit.
  explanation: This reduces transition ambiguity.
  tags:
  - gray-code
- id: binary-to-gray
  type: typed
  prompt: Recall the common binary-to-Gray transformation.
  answer:
    expected: g = b ^ (b >> 1)
  explanation: XOR each bit with its higher neighbor.
  tags:
  - gray-code
- id: crc-purpose
  type: flashcard
  prompt: What is the purpose of a CRC?
  answer:
    expected: Detect accidental changes in a block of bits using polynomial-style remainder logic.
  explanation: CRC is detection, not general correction.
  tags:
  - crc
- id: hamming-purpose
  type: cloze
  prompt: 'Complete: Hamming-style codes add redundancy to detect and often ____ single-bit errors.'
  answer:
    expected: correct
  explanation: The syndrome identifies an error position in the simple case.
  tags:
  - hamming-code
- id: redundancy
  type: typed
  prompt: Why do error-detecting codes add extra bits?
  answer:
    expected: The extra bits create constraints that make invalid or altered patterns recognizable.
  explanation: Redundancy is what gives detection or correction power.
  tags:
  - redundancy
