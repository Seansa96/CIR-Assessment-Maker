lesson:
  introduction: This deeper lesson expands Operating System Security from Chapter 9 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: cia
    title: Security goals
    required: true
    content: 'Confidentiality, integrity, and availability describe what the system must protect.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Security, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: cia-deep-check
      title: 'Check: Security goals'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Security goals**?
      choices:
      - id: a
        text: Security is not only secrecy.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Security is not only secrecy. Related topic: Operating System Security.'
  - id: authn-authz
    title: Authentication and authorization
    required: true
    content: 'Authentication establishes identity; authorization decides what that identity may do.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Security, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: authn-authz-deep-check
      title: 'Check: Authentication and authorization'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Authentication and authorization**?
      choices:
      - id: a
        text: Knowing who you are is not the same as granting access.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Knowing who you are is not the same as granting access. Related topic: Operating System Security.'
  - id: acl-capability
    title: ACLs and capabilities
    required: true
    content: 'ACLs attach permissions to objects; capabilities carry authority with subjects or tokens.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Security, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: acl-capability-deep-check
      title: 'Check: ACLs and capabilities'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **ACLs and capabilities**?
      choices:
      - id: a
        text: Both model access from different directions.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Both model access from different directions. Related topic: Operating System Security.'
    media:
    - type: image
      src: /assessments/operating-systems/security/acl-vs-capability.svg
      alt: ACL view compared with capability view for access control.
      caption: ACLs and capabilities attach authority from different directions.
  - id: tcb
    title: Trusted computing base
    required: true
    content: 'The trusted computing base is the part whose correctness is relied on for security.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Security, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: tcb-deep-check
      title: 'Check: Trusted computing base'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Trusted computing base**?
      choices:
      - id: a
        text: Smaller trusted bases are easier to reason about.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Smaller trusted bases are easier to reason about. Related topic: Operating System Security.'
    media:
    - type: image
      src: /assessments/operating-systems/security/trusted-computing-base.svg
      alt: Trusted computing base containing kernel, auth service, and policy store.
      caption: A smaller trusted computing base is easier to reason about.
  - id: least-privilege
    title: Least privilege and containment
    required: true
    content: 'Least privilege limits damage by giving components only the authority they need.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Operating System Security, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: least-privilege-deep-check
      title: 'Check: Least privilege and containment'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Least privilege and containment**?
      choices:
      - id: a
        text: Privilege boundaries reduce blast radius.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Privilege boundaries reduce blast radius. Related topic: Operating System Security.'
