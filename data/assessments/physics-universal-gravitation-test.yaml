  type: numericResponse
  prompt: |
    A satellite is planned to orbit Earth at an altitude where the local acceleration due to gravity is exactly half of its surface value (i.e., $g_h = g/2$). 
    
    Given that the Earth's radius is $R_E = 6371\text{ km}$, what must the altitude $h$ of the satellite be above the surface of the Earth, in km?
  answer:
    value: 2639
    tolerance: 10
  explanation: |
    Solution:
    The acceleration due to gravity at the surface is $g = G \frac{M_E}{R_E^2}$.
    The acceleration at altitude $h$ is $g_h = G \frac{M_E}{(R_E + h)^2}$.
    
    Why it works:
    We are given that $g_h = \frac{1}{2} g$. Substitute the expressions:
    $$ G \frac{M_E}{(R_E + h)^2} = \frac{1}{2} G \frac{M_E}{R_E^2} $$
    
    Cancel $G M_E$:
    $$ \frac{1}{(R_E + h)^2} = \frac{1}{2 R_E^2} $$
    
    Invert both sides:
    $$ (R_E + h)^2 = 2 R_E^2 $$
    
    Take the square root of both sides:
    $$ R_E + h = \sqrt{2} R_E $$
    
    Solve for altitude $h$:
    $$ h = (\sqrt{2} - 1) R_E $$
    $$ h = (\sqrt{2} - 1)(6371) \approx (0.4142)(6371) \approx 2639\text{ km} $$
