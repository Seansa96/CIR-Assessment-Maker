schemaVersion: 1
id: python-standard-library-recall
title: Python Standard Library Recall
assessmentType: recallDrill
categoryId: python
subcategoryIds:
- python-standard-library
skills:
- Apply Python Standard Library
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - python
  - python-standard-library
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: Which keyword brings an external module into your Python script?
  answer:
    expected: import
- id: r002
  type: typed
  prompt: What function in the `random` module returns a random integer between a
    and b (inclusive)?
  answer:
    expected: randint
    aliases:
    - random.randint
- id: r003
  type: typed
  prompt: What function in the `random` module picks a single random element from
    a list with equal probability?
  answer:
    expected: choice
    aliases:
    - random.choice
- id: r004
  type: typed
  prompt: What function in the `random` module allows you to pick items from a list
    using probabilities (weights)?
  answer:
    expected: choices
    aliases:
    - random.choices
- id: r005
  type: typed
  prompt: What function in the `json` module converts a Python dictionary into a JSON
    string?
  answer:
    expected: dumps
    aliases:
    - json.dumps
- id: r006
  type: typed
  prompt: What function in the `json` module converts a JSON string back into a Python
    dictionary?
  answer:
    expected: loads
    aliases:
    - json.loads
- id: r007
  type: typed
  prompt: Which function inside `os.path` returns `True` if a file or directory exists
    at the given path?
  answer:
    expected: exists
    aliases:
    - os.path.exists
- id: r008
  type: typed
  prompt: What function in the `math` module rounds a number down to the nearest integer?
  answer:
    expected: floor
    aliases:
    - math.floor
