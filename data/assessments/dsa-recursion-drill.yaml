items:
  - id: drill-trace-1
    prompt: |
      ```python
      def mystery(n):
          if n <= 1:
              return 1
          return n + mystery(n - 1)
      ```
      What is the result of `mystery(4)`?
    answer: "10"
    
  - id: drill-trace-2
    prompt: |
      ```python
      def ping(x):
          if x == 0:
              return 0
          return 2 + ping(x - 1)
      ```
      What is the result of `ping(3)`?
    answer: "6"
