- id: drill-trace-1
  prompt: "```python\ndef mystery(n):\n    if n <= 1:\n        return 1\n    return n + mystery(n - 1)\n\
    ```\nWhat is the result of `mystery(4)`?\n"
  answer: { expected: '10' }
- id: drill-trace-2
  prompt: "```python\ndef ping(x):\n    if x == 0:\n        return 0\n    return 2 + ping(x - 1)\n```\n\
    What is the result of `ping(3)`?\n"
  answer: { expected: '6' }


