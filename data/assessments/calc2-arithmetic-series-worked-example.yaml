workedExamples:
- id: sigma-notation
  title: Arithmetic Series in Sigma Notation
  problem: 'Evaluate the following finite sum:

    $$ \sum_{k=1}^{40} (3k - 5) $$

    '
  steps:
  - id: step-sigma-notation-1
    title: Identify the first and last terms
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'To use the formula $S_n = \frac{n}{2}(a_1 + a_n)$, we need to find
      the number of terms $n$, the first term $a_1$, and the last term $a_n$.


      Since we start at $k=1$ and end at $k=40$, there are $n = 40$ terms.


      First term (plug in $k=1$):

      $$ a_1 = 3(1) - 5 = -2 $$


      Last term (plug in $k=40$):

      $$ a_{40} = 3(40) - 5 = 120 - 5 = 115 $$

      '
  - id: step-sigma-notation-2
    title: Apply the sum formula
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Substitute these values into the sum formula:


      $$ S_{40} = \frac{40}{2} (-2 + 115) $$


      $$ S_{40} = 20 (113) = 2260 $$

      '
  check:
    id: sigma-notation-check
    type: numericResponse
    prompt: What is the constant difference $d$ for this arithmetic sequence?
    answer:
      value: 3
      tolerance: 0.1
    explanation: 'The term is $3k - 5$. As $k$ increases by 1, the value increases
      by 3. So $d=3$.

      '
- id: unknown-n
  title: Finding the sum with an unknown number of terms
  problem: 'Find the sum of the arithmetic series: $7 + 11 + 15 + \dots + 99$.

    '
  steps:
  - id: step-unknown-n-1
    title: Find the number of terms (n)
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'We know $a_1 = 7$, $a_n = 99$, and the common difference $d = 11
      - 7 = 4$.

      We must find $n$ using the explicit formula:

      $$ a_n = a_1 + (n-1)d $$


      $$ 99 = 7 + (n-1)4 $$

      $$ 92 = (n-1)4 $$

      $$ 23 = n - 1 \implies n = 24 $$


      There are 24 terms in the series.

      '
  - id: step-unknown-n-2
    title: Apply the sum formula
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$ S_{24} = \frac{24}{2} (7 + 99) $$


      $$ S_{24} = 12 (106) $$


      $$ S_{24} = 1272 $$

      '
  check:
    id: unknown-n-check
    type: numericResponse
    prompt: What would be the 5th term in this series?
    answer:
      value: 23
      tolerance: 0.1
    explanation: '$a_5 = 7 + (5-1)4 = 7 + 16 = 23$. (Or just count: 7, 11, 15, 19,
      23).

      '
