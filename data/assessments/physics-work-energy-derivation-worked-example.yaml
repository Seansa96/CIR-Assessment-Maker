workedExamples:
  - id: ex-newton-to-energy
    title: Newton''s law to kinetic energy
    problem: 'Derive the work-energy theorem from $\vec F_{net}=m\vec a$.'
    steps:
      - id: ne-1
        title: Differential work
        instruction: 'Substitute $\vec F_{net}=m\,d\vec v/dt$ and $d\vec r=\vec vdt$ into $dW=\vec F\cdot d\vec r$.'
        type: symbolicResponse
        prompt: 'What expression results for $dW$?'
        answer: { gradingMode: auto, expectedLatex: 'm \vec{v} \cdot d\vec{v}', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $dW=m\vec v\cdot d\vec v$.\n\nWhy it works: The factors of $dt$ cancel after substituting acceleration and displacement.'
      - id: ne-2
        title: Integrate speed change
        instruction: 'Integrate between initial and final speed.'
        type: symbolicResponse
        prompt: 'What is the resulting net work?'
        answer: { gradingMode: auto, expectedLatex: '\frac{1}{2}m v_f^2-\frac{1}{2}m v_i^2', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $W_{net}=\tfrac12mv_f^2-\tfrac12mv_i^2=\Delta K$.\n\nWhy it works: $\vec v\cdot d\vec v=\tfrac12d(v^2)$.'
  - id: ex-net-work-speed
    title: Applying the theorem
    problem: 'A $4.0$ kg object speeds up from $3.0$ m/s to $7.0$ m/s. Find the net work.'
    steps:
      - id: ns-1
        title: Find kinetic-energy change
        instruction: 'Use $W_{net}=\tfrac12m(v_f^2-v_i^2)$.'
        type: numericResponse
        prompt: 'What is the net work in joules?'
        answer: { value: 80, tolerance: 0.01 }
        explanation: 'Solution: $W_{net}=\tfrac12(4.0)(49-9)=80$ J.\n\nWhy it works: Net work equals the change in kinetic energy.'
      - id: ns-2
        title: Check the sign
        instruction: 'Compare final and initial speeds.'
        type: multipleChoice
        prompt: 'Why is the net work positive?'
        choices: [{ id: a, text: 'The final kinetic energy is larger.' }, { id: b, text: 'Mass is always positive.' }]
        answer: { choiceId: a }
        explanation: 'Solution: The final kinetic energy is larger.\n\nWhy it works: Kinetic energy grows as speed squared.\n\nWhy the other choices fail: Positive mass alone does not determine the sign of an energy change.'
