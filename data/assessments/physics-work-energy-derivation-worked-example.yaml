workedExamples:
- id: ex-work-energy
  title: Newton's Second Law to Work-Energy
  problem: |
    Let's derive the work-energy theorem ($W_{\text{net}} = \Delta K$) starting from Newton's second law ($\vec F_{\text{net}} = m\vec a$).
  steps:
  - id: step-1
    title: Step 1 — Define Infinitesimal Work
    instruction: |
      Start with the definition of the tiny amount of work $dW$ done over a tiny displacement $d\vec r$.
    type: multipleChoice
    prompt: Which equation correctly defines infinitesimal work?
    choices:
    - id: a
      text: $dW = \vec F_{\text{net}} \cdot d\vec r$
    - id: b
      text: $dW = \vec F_{\text{net}} \times d\vec r$
    - id: c
      text: $dW = m d\vec r$
    answer:
      choiceId: a
    explanation: Work is the dot product of force and displacement.
  - id: step-2
    title: Step 2 — Substitute Newton's Second Law and Kinematics
    instruction: |
      Substitute $\vec F_{\text{net}} = m\vec a$ into $dW = \vec F_{\text{net}} \cdot d\vec r$.
      Then, substitute the kinematic definitions $\vec a = d\vec v / dt$ and $d\vec r = \vec v \, dt$.
    type: symbolicResponse
    prompt: After making these substitutions and canceling $dt$, what expression equals $dW$? (Write the expression using $m$, $\vec v$, and $d\vec v$)
    answer:
      gradingMode: auto
      expectedLatex: m\vec{v} \cdot d\vec{v}
      equivalenceMode: expression
      tolerance: 0
    explanation: $dW = (m d\vec v / dt) \cdot (\vec v \, dt) = m \vec v \cdot d\vec v$.
  - id: step-3
    title: Step 3 — Integrate
    instruction: |
      We now integrate both sides. $\int dW = W_{\text{net}}$.
      On the right, we integrate $m \int_{v_i}^{v_f} \vec v \cdot d\vec v$.
      The dot product $\vec v \cdot d\vec v$ is exactly $\frac{1}{2}d(v^2)$.
    type: symbolicResponse
    prompt: Evaluate the integral $m \int_{v_i}^{v_f} v \, dv$. What is the final resulting expression?
    answer:
      gradingMode: auto
      expectedLatex: \frac{1}{2}mv_f^2 - \frac{1}{2}mv_i^2
      equivalenceMode: expression
      tolerance: 0
    explanation: The integral of $v \, dv$ is $\frac{1}{2}v^2$. Evaluating from $v_i$ to $v_f$ gives exactly $\Delta K$.
