questions:
- id: q001
  type: multipleChoice
  prompt: 'If you want to count\rhow many times the number `5` appears in a `std::vector<int>
    v`, which algorithm is most appropriate?

    '
  choices:
  - id: a
    text: '`std::count(v.begin(), v.end(), 5);`'
  - id: b
    text: '`std::find(v.begin(), v.end(), 5);`'
  - id: c
    text: '`std::sort(v.begin(), v.end());`'
  - id: d
    text: '`v.count(5);`'
  answer:
    choiceId: a
  explanation: '`std::count` traverses the range and returns the number of elements
    equal to the target value. `std::vector` does not have a member `count` function.

    '
- id: q002
  type: multipleChoice
  prompt: 'When defining a lambda function `[](int a, int b) { return a > b; }` to
    pass to `std::sort`, what order will the resulting range be sorted in?

    '
  choices:
  - id: a
    text: Descending (largest first)
  - id: b
    text: Ascending (smallest first)
  - id: c
    text: Random
  - id: d
    text: It will remain unchanged
  answer:
    choiceId: a
  explanation: 'Returning `a > b` means `a` should come before `b` if `a` is strictly
    greater, which results in a descending sort.

    '
- id: q003
  type: multipleChoice
  prompt: 'What must you include to use functions like `std::sort` and `std::find`?

    '
  choices:
  - id: a
    text: '`<algorithm>`'
  - id: b
    text: '`<vector>`'
  - id: c
    text: '`<math>`'
  - id: d
    text: '`<memory>`'
  answer:
    choiceId: a
  explanation: 'The STL algorithms are defined in the `<algorithm>` header.

    '
- id: q004
  type: code
  prompt: 'Write a function named `hasNegative` that takes a `const std::vector<int>&
    v` and returns `bool`.

    Use `std::find_if` and a lambda expression to check if there is at least one negative
    number in the vector.

    '
  language: cpp
  functionName: hasNegative
  starterCode: "#include <vector>\n#include <algorithm>\n\nbool hasNegative(const\
    \ std::vector<int>& v) {\n    // Your code here\n    return false;\n}\n"
  tests:
  - input: '{1, 2, 3}'
    expected: '0'
  - input: '{1, -2, 3}'
    expected: '1'
  - input: '{-1, -2, -3}'
    expected: '1'
  answer: {}
  explanation: 'You should check if the result of `std::find_if` is not equal to `v.end()`.

    '
