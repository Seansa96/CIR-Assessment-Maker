schemaVersion: 1
id: physics-newtons-second-law-sprinter-worked-example
title: Newton's Second Law Sprinter Worked Example
assessmentType: workedExample
categoryId: physics-1
subcategoryIds:
  - physics-motion-1d
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Connecting net force to acceleration and race time
    problem: |
      Newton's Second Law problems are cause-and-effect problems: the net external force causes acceleration, and acceleration then connects to the kinematics of motion.

      Problem 1: Andrea, a $63.0\ \text{kg}$ sprinter, starts a race with an acceleration of $4.200\ \text{m/s}^2$. What is the net external force on her?

      Problem 2: If Andrea accelerates at that rate for $20.00\ \text{m}$ and then maintains that velocity for the remainder of a $100.00\ \text{m}$ dash, what will her time be for the race?
    steps:
      - id: s001
        title: Identify the law
        instruction: |
          Start by identifying what the first problem is really asking for.
        type: multipleChoice
        prompt: |
          Which relationship directly connects Andrea's mass, acceleration, and net external force?
        choices:
          - id: a
            text: '$\sum F=ma$'
          - id: b
            text: '$v^2=v_0^2+2a\Delta x$'
          - id: c
            text: '$p=mv$'
          - id: d
            text: '$W=Fd\cos\theta$'
        answer:
          choiceId: a
        hint: |
          The words net external force and acceleration point directly to Newton's Second Law.
        explanation: |
          Use Newton's Second Law:

          $$
          \sum F=ma.
          $$

          Related topic: Newton's Second Law. Strengthen the habit of reading "net force" as the vector sum of all external forces, not one individual push.

      - id: s002
        title: Substitute force values
        instruction: |
          The first part is a direct substitution because mass and acceleration are already given.
        type: multipleChoice
        prompt: |
          Which substitution is correct for the net external force?
        choices:
          - id: a
            text: '$F_{\text{net}}=(63.0)(4.200)\ \text{N}$'
          - id: b
            text: '$F_{\text{net}}=\frac{63.0}{4.200}\ \text{N}$'
          - id: c
            text: '$F_{\text{net}}=(4.200)(20.00)\ \text{N}$'
          - id: d
            text: '$F_{\text{net}}=\frac{100.00}{20.00}\ \text{N}$'
        answer:
          choiceId: a
        explanation: |
          Mass is measured in kilograms and acceleration in $\text{m/s}^2$, so their product has units

          $$
          \text{kg}\cdot\frac{\text{m}}{\text{s}^2}=\text{N}.
          $$

          Related topic: unit meaning of the newton. If this step feels mechanical, review how derived SI units are built from base units.

      - id: s003
        title: Solve the net force
        instruction: |
          Now calculate the force.
        type: numericResponse
        prompt: |
          What is the net external force on Andrea?

          Enter the force in newtons.
        answer:
          value: 264.6
          tolerance: 0.01
        hint: |
          Multiply $63.0$ by $4.200$.
        explanation: |
          Compute

          $$
          F_{\text{net}}=ma=(63.0)(4.200)=264.6\ \text{N}.
          $$

          With the given values, this is usually reported as $265\ \text{N}$ to three significant figures.

          Related topic: applying Newton's Second Law in one dimension. The exact technique is identifying the net force, then multiplying mass by acceleration.

      - id: s004
        title: Switch from force to motion
        instruction: |
          The second problem uses the same acceleration, but now asks for total race time. That means switching from dynamics into kinematics.
        type: multipleChoice
        prompt: |
          During the first $20.00\ \text{m}$, which kinematics equation best finds Andrea's velocity at the end of the acceleration phase?
        choices:
          - id: a
            text: '$v^2=v_0^2+2a\Delta x$'
          - id: b
            text: '$F_{\text{net}}=ma$'
          - id: c
            text: '$x=x_0+vt$ with constant velocity'
          - id: d
            text: '$a=\frac{\Delta v}{\Delta t}$ using final time already known'
        answer:
          choiceId: a
        hint: |
          You know acceleration and displacement, but not time yet.
        explanation: |
          Use

          $$
          v^2=v_0^2+2a\Delta x
          $$

          because the known quantities are $v_0=0$, $a=4.200\ \text{m/s}^2$, and $\Delta x=20.00\ \text{m}$.

          Related topic: kinematic equation selection. The key pattern is choosing the equation that avoids the unknown you do not need yet.

      - id: s005
        title: End speed after acceleration
        instruction: |
          Andrea starts from rest, so $v_0=0$.
        type: numericResponse
        prompt: |
          What speed does Andrea reach after accelerating for $20.00\ \text{m}$?

          Enter the speed in $\text{m/s}$.
        answer:
          value: 12.96
          tolerance: 0.02
        hint: |
          Use $v=\sqrt{2a\Delta x}$.
        explanation: |
          Substitute:

          $$
          v^2=0^2+2(4.200)(20.00)=168.0.
          $$

          Therefore

          $$
          v=\sqrt{168.0}\approx12.96\ \text{m/s}.
          $$

          Related topic: speed from displacement under constant acceleration. Review square-rooting the kinematics equation after isolating $v^2$.

      - id: s006
        title: Time for acceleration phase
        instruction: |
          Now find how long Andrea spends accelerating.
        type: multipleChoice
        prompt: |
          Which expression gives the time for the first $20.00\ \text{m}$?
        choices:
          - id: a
            text: '$t_1=\frac{v-v_0}{a}$'
          - id: b
            text: '$t_1=\frac{100.00}{12.96}$'
          - id: c
            text: '$t_1=\frac{a}{v}$'
          - id: d
            text: '$t_1=\frac{20.00}{100.00}$'
        answer:
          choiceId: a
        explanation: |
          During constant acceleration,

          $$
          v=v_0+at.
          $$

          Since $v_0=0$, solve for time:

          $$
          t_1=\frac{v}{a}.
          $$

          Related topic: manipulating the velocity-time equation. The order is find final speed first, then use it to find acceleration time.

      - id: s007
        title: Acceleration time value
        instruction: |
          Use the speed from the previous step.
        type: numericResponse
        prompt: |
          How many seconds does Andrea spend accelerating?
        answer:
          value: 3.09
          tolerance: 0.02
        hint: |
          Divide $12.96\ \text{m/s}$ by $4.200\ \text{m/s}^2$.
        explanation: |
          Compute

          $$
          t_1=\frac{12.96}{4.200}\approx3.09\ \text{s}.
          $$

          Related topic: interpreting acceleration as change in velocity per second.

      - id: s008
        title: Constant velocity phase
        instruction: |
          Andrea has already covered $20.00\ \text{m}$, so the remaining distance is covered at constant speed.
        type: multipleChoice
        prompt: |
          Which setup gives the time for the remaining part of the race?
        choices:
          - id: a
            text: '$t_2=\frac{80.00}{12.96}$'
          - id: b
            text: '$t_2=\frac{100.00}{12.96}$'
          - id: c
            text: '$t_2=\frac{20.00}{4.200}$'
          - id: d
            text: '$t_2=\frac{12.96}{80.00}$'
        answer:
          choiceId: a
        explanation: |
          After the acceleration phase, the remaining distance is

          $$
          100.00-20.00=80.00\ \text{m}.
          $$

          Constant velocity means

          $$
          t_2=\frac{\Delta x}{v}=\frac{80.00}{12.96}.
          $$

          Related topic: splitting a motion problem into phases. The core skill is not mixing the accelerating part with the constant-speed part.

      - id: s009
        title: Total race time
        instruction: |
          Solve the full second problem by adding the phase times.
        type: numericResponse
        prompt: |
          What is Andrea's total time for the $100.00\ \text{m}$ dash?

          Enter the time in seconds.
        answer:
          value: 9.26
          tolerance: 0.03
        hint: |
          Add $t_1\approx3.09\ \text{s}$ and $t_2\approx6.17\ \text{s}$.
        explanation: |
          The constant-speed time is

          $$
          t_2=\frac{80.00}{12.96}\approx6.17\ \text{s}.
          $$

          Add the two phases:

          $$
          t_{\text{total}}=t_1+t_2\approx3.09+6.17=9.26\ \text{s}.
          $$

          Related topic: piecewise motion. Technique order: use dynamics to find acceleration, use kinematics for the acceleration phase, then use constant-velocity motion for the remaining distance.
