- id: we001
  title: Connecting net force to acceleration and race time
  problem: 'Newton''s Second Law problems are cause-and-effect problems: the net external
    force causes acceleration, and acceleration then connects to the kinematics of
    motion.


    Problem 1: Andrea, a $63.0\ \text{kg}$ sprinter, starts a race with an acceleration
    of $4.200\ \text{m/s}^2$. What is the net external force on her?


    Problem 2: If Andrea accelerates at that rate for $20.00\ \text{m}$ and then maintains
    that velocity for the remainder of a $100.00\ \text{m}$ dash, what will her time
    be for the race?

    '
  steps:
  - id: step-we001-1
    title: Identify the law
    instruction: 'Start by identifying what the first problem is really asking for.

      '
    type: multipleChoice
    prompt: |
      Which relationship directly connects Andrea's mass, acceleration, and net external force?
    choices:
    - id: a
      text: $\sum F=ma$
    - id: b
      text: $v^2=v_0^2+2a\Delta x$
    - id: c
      text: $p=mv$
    - id: d
      text: $W=Fd\cos\theta$
    answer:
      choiceId: a
    hint: 'The words net external force and acceleration point directly to Newton''s
      Second Law.

      '
    explanation: |
      Solution:
      Use Newton's Second Law:

      $$
      \sum F=ma.
      $$

      Why it works:
      Net force is the vector sum of all external forces, so it is the quantity that determines acceleration.

      Why the other choices fail:
      The other equations describe kinematics, momentum, or work; none directly relates net force, mass, and acceleration.
  - id: step-we001-2
    title: Substitute force values
    instruction: 'The first part is a direct substitution because mass and acceleration
      are already given.

      '
    type: multipleChoice
    prompt: |
      Which substitution is correct for the net external force?
    choices:
    - id: a
      text: $F_{\text{net}}=(63.0)(4.200)\ \text{N}$
    - id: b
      text: $F_{\text{net}}=\frac{63.0}{4.200}\ \text{N}$
    - id: c
      text: $F_{\text{net}}=(4.200)(20.00)\ \text{N}$
    - id: d
      text: $F_{\text{net}}=\frac{100.00}{20.00}\ \text{N}$
    answer:
      choiceId: a
    explanation: |
      Solution:
      Substitute the given mass and acceleration in $F_{\text{net}}=ma$. Mass is measured in kilograms and acceleration in $\text{m/s}^2$, so their product has units

      $$
      \text{kg}\cdot\frac{\text{m}}{\text{s}^2}=\text{N}.
      $$

      Why it works:
      Multiplying mass by acceleration yields the derived SI unit $\text{N}$.

      Why the other choices fail:
      Dividing reverses Newton's second law, and distance-based expressions do not use the requested mass-acceleration relationship.
  - id: step-we001-3
    title: Solve the net force
    instruction: 'Now calculate the force.

      '
    type: numericResponse
    prompt: |
      What is the net external force on Andrea?

      Enter the force in newtons.
    answer:
      value: 264.6
      tolerance: 0.01
    hint: 'Multiply $63.0$ by $4.200$.

      '
    explanation: |
      Solution:
      Compute

      $$
      F_{\text{net}}=ma=(63.0)(4.200)=264.6\ \text{N}.
      $$

      With the given values, this is usually reported as $265\ \text{N}$ to three significant figures.

      Why it works:
      Once the net-force model is identified, Newton's second law gives the force directly from the given mass and acceleration.
  - id: step-we001-4
    title: Switch from force to motion
    instruction: 'The second problem uses the same acceleration, but now asks for
      total race time. That means switching from dynamics into kinematics.

      '
    type: multipleChoice
    prompt: |
      During the first $20.00\ \text{m}$, which kinematics equation best finds Andrea's velocity at the end of the acceleration phase?
    choices:
    - id: a
      text: $v^2=v_0^2+2a\Delta x$
    - id: b
      text: $F_{\text{net}}=ma$
    - id: c
      text: $x=x_0+vt$ with constant velocity
    - id: d
      text: $a=\frac{\Delta v}{\Delta t}$ using final time already known
    answer:
      choiceId: a
    hint: 'You know acceleration and displacement, but not time yet.

      '
    explanation: |
      Solution:
      Use

      $$
      v^2=v_0^2+2a\Delta x
      $$

      because the known quantities are $v_0=0$, $a=4.200\ \text{m/s}^2$, and $\Delta x=20.00\ \text{m}$.

      Why it works:
      This equation connects displacement, acceleration, and speed without requiring the unknown time.

      Why the other choices fail:
      Newton's law does not determine the speed from displacement, constant-speed motion does not apply here, and the final time is not known.
  - id: step-we001-5
    title: End speed after acceleration
    instruction: 'Andrea starts from rest, so $v_0=0$.

      '
    type: numericResponse
    prompt: |
      What speed does Andrea reach after accelerating for $20.00\ \text{m}$?

      Enter the speed in $\text{m/s}$.
    answer:
      value: 12.96
      tolerance: 0.02
    hint: 'Use $v=\sqrt{2a\Delta x}$.

      '
    explanation: |
      Solution:
      Substitute:

      $$
      v^2=0^2+2(4.200)(20.00)=168.0.
      $$

      Therefore

      $$
      v=\sqrt{168.0}\a\approx12.96\ \text{m/s}.
      $$

      Why it works:
      Starting from rest makes $v_0=0$, leaving $v^2=2a\Delta x$; taking the positive square root gives speed.
  - id: step-we001-6
    title: Time for acceleration phase
    instruction: 'Now find\rhow long Andrea spends accelerating.

      '
    type: multipleChoice
    prompt: |
      Which expression gives the time for the first $20.00\ \text{m}$?
    choices:
    - id: a
      text: $t_1=\frac{v-v_0}{a}$
    - id: b
      text: $t_1=\frac{100.00}{12.96}$
    - id: c
      text: $t_1=\frac{a}{v}$
    - id: d
      text: $t_1=\frac{20.00}{100.00}$
    answer:
      choiceId: a
    explanation: |
      Solution:
      During constant acceleration,

      $$
      v=v_0+at.
      $$

      Since $v_0=0$, solve for time:

      $$
      t_1=\frac{v}{a}.
      $$

      Why it works:
      The velocity-time relation can be rearranged after the final speed is known.

      Why the other choices fail:
      The other expressions use the wrong distance, invert the relation, or form a dimensionless ratio instead of time.
  - id: step-we001-7
    title: Acceleration time value
    instruction: 'Use the speed from the previous step.

      '
    type: numericResponse
    prompt: |
      How many seconds does Andrea spend accelerating?
    answer:
      value: 3.09
      tolerance: 0.02
    hint: 'Divide $12.96\ \text{m/s}$ by $4.200\ \text{m/s}^2$.

      '
    explanation: |
      Solution:
      Compute

      $$
      t_1=\frac{12.96}{4.200}\a\approx3.09\ \text{s}.
      $$

      Why it works:
      Acceleration is velocity change per time, so dividing the velocity gain by the constant acceleration gives the elapsed time.
  - id: step-we001-8
    title: Constant velocity phase
    instruction: 'Andrea has already covered $20.00\ \text{m}$, so the remaining distance
      is covered at constant speed.

      '
    type: multipleChoice
    prompt: |
      Which setup gives the time for the remaining part of the race?
    choices:
    - id: a
      text: $t_2=\frac{80.00}{12.96}$
    - id: b
      text: $t_2=\frac{100.00}{12.96}$
    - id: c
      text: $t_2=\frac{20.00}{4.200}$
    - id: d
      text: $t_2=\frac{12.96}{80.00}$
    answer:
      choiceId: a
    explanation: |
      Solution:
      After the acceleration phase, the remaining distance is

      $$
      100.00-20.00=80.00\ \text{m}.
      $$

      Constant velocity means

      $$
      t_2=\frac{\Delta x}{v}=\frac{80.00}{12.96}.
      $$

      Why it works:
      The second phase has constant speed and covers only the remaining $80.00\ \text{m}$.

      Why the other choices fail:
      Using $100.00\ \text{m}$ double-counts the first phase, while the other expressions do not implement distance divided by constant speed.
  - id: step-we001-9
    title: Total race time
    instruction: 'Solve the full second problem by adding the phase times.

      '
    type: numericResponse
    prompt: |
      What is Andrea's total time for the $100.00\ \text{m}$ dash?

      Enter the time in seconds.
    answer:
      value: 9.26
      tolerance: 0.03
    hint: 'Add $t_1\a\approx3.09\ \text{s}$ and $t_2\a\approx6.17\ \text{s}$.

      '
    explanation: |
      Solution:
      The constant-speed time is

      $$
      t_2=\frac{80.00}{12.96}\a\approx6.17\ \text{s}.
      $$

      Add the two phases:

      $$
      t_{\text{total}}=t_1+t_2\a\approx3.09+6.17=9.26\ \text{s}.
      $$

      Why it works:
      The race is piecewise: add the time from the accelerating phase to the time from the constant-speed phase.
- id: sprinter-we002
  title: Braking Force on a Runner
  problem: |-
    A $60.0\ \text{kg}$ runner slows uniformly from $8.0\ \text{m/s}$ to $2.0\ \text{m/s}$ in $3.0\ \text{s}$. Find the horizontal net force on the runner.
  steps:
  - id: sprinter-we002-step-1
    title: Determine the acceleration
    type: numericResponse
    prompt: What is the runner's acceleration in $\text{m/s}^2$?
    answer:
      value: -2
      tolerance: 0.01
    explanation: |-
      Solution:
      Use $a=(v_f-v_i)/t=(2.0-8.0)/3.0=-2.0\ \text{m/s}^2$.

      Why it works:
      The negative sign represents an acceleration opposite the selected positive running direction.
  - id: sprinter-we002-step-2
    title: Determine the net force
    type: numericResponse
    prompt: What horizontal net force acts on the runner in newtons?
    answer:
      value: -120
      tolerance: 0.1
    explanation: |-
      Solution:
      Apply $F_{net}=ma=(60.0)(-2.0)=-120\ \text{N}$.

      Why it works:
      Newton's second law preserves the acceleration direction: the net force must point backward to slow a forward-moving runner.
