schemaVersion: 1
id: pwsh-string-basics-concept-lesson
title: "String Basics and Quoting"
assessmentType: conceptLesson
categoryId: scripting
subcategoryIds:
  - pwsh-string-basics
skills:
  - pwsh-string-basics
modeDefault: practice
randomizeQuestions: false
lesson:
  introduction: |
    In PowerShell, almost everything you see on the screen is a string representation of an underlying object. Understanding how to properly format, quote, and escape strings is fundamental to writing good scripts.
  sections:
    - id: sec-quotes
      title: "Single vs. Double Quotes"
      required: true
      content: |
        PowerShell handles strings very similarly to Bash.
        
        **Single Quotes (`' '`)** indicate a **literal string**. PowerShell will not attempt to interpret anything inside it. What you type is exactly what you get.
        `Write-Host 'Your path is $env:PATH'` -> Output: `Your path is $env:PATH`
        
        **Double Quotes (`" "`)** indicate an **expandable string**. PowerShell will look inside the string for variables or sub-expressions and expand them (replace them with their actual values) before outputting the string. This is known as **String Interpolation**.
        `Write-Host "Your computer name is $env:COMPUTERNAME"` -> Output: `Your computer name is DESKTOP-X91A`
      check:
        id: chk-str-1
        type: multipleChoice
        prompt: "You have a variable `$Name = 'Alice'`. What is the exact output of `Write-Host 'Hello $Name'`?"
        choices:
          - id: a
            text: "Hello Alice"
          - id: b
            text: "Hello $Name"
          - id: c
            text: "Error: Variable $Name not found"
          - id: d
            text: "Hello 'Alice'"
        answer:
          choiceId: b
        explanation: |
          Because you used single quotes (`'`), PowerShell treats it as a literal string. It does not expand the `$Name` variable.

    - id: sec-subexpressions
      title: "Sub-expressions in Strings"
      required: true
      content: |
        Sometimes, you want to insert the *property* of an object into a double-quoted string. 
        If you try: `"My process ID is $PID.Id"`, PowerShell will output `My process ID is 1234.Id`. It doesn't know the `.Id` is part of the variable!
        
        To fix this, you must wrap the variable and its property in a **Sub-expression** using `$()`:
        `"My process ID is $($PID.Id)"`
        
        The `$()` tells PowerShell: "Evaluate everything inside these parentheses first, and then insert the result into the string."
      check:
        id: chk-str-2
        type: multipleChoice
        prompt: "If `$Process = Get-Process -Name explorer`, which string will correctly output the number of handles the process is using?"
        choices:
          - id: a
            text: "\"Explorer uses $Process.Handles handles\""
          - id: b
            text: "'Explorer uses $($Process.Handles) handles'"
          - id: c
            text: "\"Explorer uses $($Process.Handles) handles\""
          - id: d
            text: "\"Explorer uses ($Process.Handles) handles\""
        answer:
          choiceId: c
        explanation: |
          You must use double quotes for expansion, and the `$()` sub-expression syntax to correctly evaluate the `.Handles` property before inserting it into the string.

    - id: sec-escaping
      title: "Escaping Characters (The Backtick)"
      required: true
      content: |
        In many languages (like C++ or Python), the escape character is the backslash (`\`).
        In PowerShell, because the backslash is used heavily for Windows file paths (e.g. `C:\Windows`), the escape character is the **backtick** (`` ` ``).
        
        - `` `n `` inserts a Newline.
        - `` `t `` inserts a Tab.
        - `` `$ `` escapes a dollar sign in a double-quoted string so it prints a literal `$` instead of evaluating a variable.
        
        Example:
        `"Apples`nOranges"` outputs:
        Apples
        Oranges
      check:
        id: chk-str-3
        type: multipleChoice
        prompt: "How would you format a string to output exactly `Cost: $50` inside double quotes?"
        choices:
          - id: a
            text: "\"Cost: \\$50\""
          - id: b
            text: "\"Cost: `$50\""
          - id: c
            text: "\"Cost: /$50\""
          - id: d
            text: "\"Cost: '$50'\""
        answer:
          choiceId: b
        explanation: |
          The backtick (`` ` ``) is the PowerShell escape character. `` `$ `` tells PowerShell to treat the dollar sign as a literal character rather than the start of a variable named `$50`.
