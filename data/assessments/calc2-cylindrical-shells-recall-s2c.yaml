modeDefault: practice
randomizeQuestions: true
skills: [shell-method, radius-modeling]
navigation: { learningGoal: recall, activityType: clozeDrill, tags: [calculus-2, cylindrical-shells, recall] }
authoring: { visualRequirement: required, visualRationale: Shell cues are tied to a diagrammed rotated strip. }
items:
  - { id: r1, type: cloze, prompt: 'For a shell of radius r, the circumference factor is $\underline{\hspace{1cm}}$.', answer: { expected: '2\\pi r', aliases: ['$2\pi r$'] }, explanation: 'Solution: $2\pi r$. Why it works: A shell wraps once around a circle of radius r. Common trap: $\pi r^2$ has area units.' }
  - { id: r2, type: typed, prompt: 'For rotation about the y-axis, what is the radius of a vertical strip at x?', answer: { expected: '|x|', aliases: [absolute value of x, x if x is nonnegative] }, explanation: 'Solution: The radius is $|x|$, or x on a nonnegative interval. Why it works: Radius is distance to x=0. Common trap: Use an absolute value or split when the region crosses the axis.' }
  - { id: r3, type: recognition, prompt: 'Which slice orientation is parallel to the x-axis?', choices: [{ id: a, text: horizontal }, { id: b, text: vertical }, { id: c, text: radial }, { id: d, text: circular }], answer: { choiceId: a }, explanation: 'Solution: Horizontal. Why it works: The x-axis is horizontal. Common trap: A slice perpendicular to the x-axis is vertical. Why the other choices fail: b is perpendicular; c and d do not identify standard Cartesian slice orientation.' }
