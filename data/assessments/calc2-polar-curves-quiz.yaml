questions:
  - id: q-polar-curves-quiz-1
    type: multipleChoice
    title: Converting to Cartesian
    prompt: |
      Convert the polar equation $r = 4\cos\theta$ into a Cartesian (rectangular) equation.
    choices:
      - id: c1
        text: '$(x - 2)^2 + y^2 = 4$'
      - id: c2
        text: '$x^2 + (y - 2)^2 = 4$'
      - id: c3
        text: '$x^2 + y^2 = 4$'
      - id: c4
        text: '$(x - 4)^2 + y^2 = 16$'
    answer:
      choiceId: c1
    explanation: |
      Multiply both sides by $r$:
      $r^2 = 4r\cos\theta$
      
      Substitute $r^2 = x^2 + y^2$ and $r\cos\theta = x$:
      $x^2 + y^2 = 4x$
      
      Rearrange and complete the square for $x$:
      $x^2 - 4x + 4 + y^2 = 4$
      $(x - 2)^2 + y^2 = 4$
    skills:
      - polar-curves

  - id: q-polar-curves-quiz-2
    type: multipleChoice
    title: Identifying Rose Curves
    prompt: |
      How many petals does the rose curve $r = \sin(3\theta)$ have?
    choices:
      - id: c1
        text: '3'
      - id: c2
        text: '6'
      - id: c3
        text: '1.5'
      - id: c4
        text: '9'
    answer:
      choiceId: c1
    explanation: |
      For a rose curve $r = a\sin(n\theta)$ or $r = a\cos(n\theta)$, if $n$ is an odd integer, the curve has exactly $n$ petals. 
      Since $n=3$ is odd, it has 3 petals. (If $n$ were even, it would have $2n$ petals).
    skills:
      - polar-curves

  - id: q-polar-curves-quiz-3
    type: symbolicResponse
    title: Converting to Polar
    prompt: |
      Convert the Cartesian equation $y = 3x$ into a polar equation $r = f(\theta)$ or an equation purely involving $\theta$.
      
      What is the value of $\tan\theta$?
    answer:
      expectedLatex: '3'
      equivalenceMode: expression
      variables: []
      tolerance: 0.000001
    explanation: |
      Substitute $x = r\cos\theta$ and $y = r\sin\theta$:
      $r\sin\theta = 3r\cos\theta$
      
      Assuming $r \neq 0$, divide by $r\cos\theta$:
      $\frac{\sin\theta}{\cos\theta} = 3 \implies \tan\theta = 3$
      
      This describes a line passing through the origin.
    skills:
      - polar-curves

  - id: q-polar-curves-quiz-4
    type: multipleChoice
    title: Circle Identification
    prompt: |
      Which of the following describes the graph of $r = 5$?
    choices:
      - id: c1
        text: 'A circle of radius 5 centered at the origin'
      - id: c2
        text: 'A straight line passing through $(5, 5)$'
      - id: c3
        text: 'A circle of radius 2.5 centered at $(2.5, 0)$'
      - id: c4
        text: 'A vertical line at $x=5$'
    answer:
      choiceId: c1
    explanation: |
      The equation $r=5$ means the distance from the origin is a constant 5 for all angles $\theta$. This is the definition of a circle of radius 5 centered at the pole (origin).
    skills:
      - polar-curves
