workedExamples:
  - id: limiting-carbon-dioxide
    title: Use a limiting reactant to predict product mass
    problem: 'For $2Mg+O_2\rightarrow2MgO$, 6.00 g Mg reacts with 3.00 g $O_2$. Find the mass of MgO formed.'
    steps:
      - id: lc1
        title: Convert magnesium to moles
        instruction: 'Use the molar mass of Mg, 24.31 g/mol.'
        type: numericResponse
        prompt: 'How many moles of Mg are present?'
        answer: { value: 0.2468, tolerance: 0.0005 }
        explanation: 'Solution: $6.00\text{ g}/24.31\text{ g mol}^{-1}=0.2468\text{ mol}$. Why it works: Molar mass converts a measured mass into chemical amount.'
      - id: lc2
        title: Identify the limiting reactant
        instruction: 'Compare the moles of MgO each reactant could produce.'
        type: freeResponse
        prompt: 'Which reactant limits the amount of MgO?'
        answer: { gradingMode: selfCheck, keyPoints: ['magnesium', 'Mg'] }
        explanation: 'Solution: Magnesium limits. $0.2468$ mol Mg can form $0.2468$ mol MgO, while $3.00/32.00=0.09375$ mol $O_2$ can form $0.1875$ mol MgO. Why it works: The smaller product amount identifies the reactant exhausted first.'
      - id: lc3
        title: Convert product moles to mass
        instruction: 'Use 40.31 g/mol for MgO and report three significant figures.'
        type: numericResponse
        prompt: 'What mass of MgO forms in g?'
        answer: { value: 9.95, tolerance: 0.03 }
        explanation: 'Solution: $(0.2468\text{ mol})(40.31\text{ g mol}^{-1})=9.95\text{ g MgO}$. Why it works: The limiting reactant fixes the available product moles.'
  - id: formation-enthalpy
    title: Find a reaction enthalpy from formation enthalpies
    problem: 'For $CH_4(g)+2O_2(g)\rightarrow CO_2(g)+2H_2O(l)$, use $\Delta H_f^\circ$ values of $-74.8$, $-393.5$, and $-285.8$ kJ/mol for methane, carbon dioxide, and liquid water.'
    steps:
      - id: fh1
        title: Sum the product formation enthalpies
        instruction: 'Include the coefficient on water.'
        type: numericResponse
        prompt: 'Find the product sum in kJ/mol reaction.'
        answer: { value: -965.1, tolerance: 0.2 }
        explanation: 'Solution: $-393.5+2(-285.8)=-965.1\text{ kJ}$. Why it works: Each product contribution is multiplied by its balanced-equation coefficient.'
      - id: fh2
        title: Sum the reactant formation enthalpies
        instruction: 'Elements in their standard states have zero formation enthalpy.'
        type: numericResponse
        prompt: 'Find the reactant sum in kJ/mol reaction.'
        answer: { value: -74.8, tolerance: 0.1 }
        explanation: 'Solution: $-74.8+2(0)=-74.8\text{ kJ}$. Why it works: Standard-state oxygen is the elemental reference state.'
      - id: fh3
        title: Subtract reactants from products
        instruction: 'Use products minus reactants.'
        type: numericResponse
        prompt: 'Find $\Delta H_{rxn}^\circ$ in kJ/mol reaction.'
        answer: { value: -890.3, tolerance: 0.3 }
        explanation: 'Solution: $-965.1-(-74.8)=-890.3\text{ kJ mol}^{-1}$. Why it works: Reaction enthalpy is the state-function difference between the product and reactant sums.'
