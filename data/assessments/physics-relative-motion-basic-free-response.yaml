questions:
- id: q001
  type: freeResponse
  prompt: 'Pursuit: A runner starts $40\ \text{m}$ ahead of a cyclist. The runner
    moves at $4\ \text{m/s}$ and the cyclist moves at $9\ \text{m/s}$ in the same
    direction.


    How long until the cyclist catches the runner?

    '
  answer:
    expected: '8 s. Use relative speed $9-4=5\ \text{m/s}$ and time $t=\frac{40}{5}$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Distance to close is 40 m.
    - Relative speed is the speed difference because they move the same direction.
    - Use $t=d/v_{\text{rel}}$.
  explanation: 'The cyclist must close a $40\ \text{m}$ gap. Since both move in the
    same direction, relative speed is


    $$

    v_{\text{rel}}=9-4=5\ \text{m/s}.

    $$


    Then


    $$

    t=\frac{d}{v_{\text{rel}}}=\frac{40}{5}=8\ \text{s}.

    $$


    The thought process is: ask what distance must be covered, then ask what relative
    speed closes that distance.

    '
- id: q002
  type: freeResponse
  prompt: 'Two trains meeting: Train A and Train B are $900\ \text{m}$ apart and move
    toward each other. Train A moves at $20\ \text{m/s}$ and Train B moves at $25\
    \text{m/s}$.


    When do they meet?

    '
  answer:
    expected: '20 s. The relative speed is $20+25=45\ \text{m/s}$, so $t=900/45=20$.

      '
    gradingMode: selfCheck
    keyPoints:
    - They move toward each other.
    - Add speeds for relative speed.
    - Divide total separation by relative speed.
  explanation: 'The distance to close is $900\ \text{m}$. Because the trains approach
    each other, their relative speed is


    $$

    v_{\text{rel}}=20+25=45\ \text{m/s}.

    $$


    Then $t=d/v_{\text{rel}}=900/45=20\ \text{s}$. This is the classic meeting problem.

    '
- id: q003
  type: freeResponse
  prompt: 'Train passing a pole: A $120\ \text{m}$ train moves past a pole at $15\
    \text{m/s}$.


    How long does it take the whole train to pass the pole?

    '
  answer:
    expected: '8 s. The train must move its own length past the pole, so $t=120/15=8$.

      '
    gradingMode: selfCheck
    keyPoints:
    - The distance is the train length.
    - The pole has zero length.
    - Use $t=d/v$.
  explanation: 'For a train passing a pole, the train must cover exactly its own length
    relative to the pole. The pole is stationary, so relative speed is just the train
    speed:


    $$

    t=\frac{120}{15}=8\ \text{s}.

    $$

    '
- id: q004
  type: freeResponse
  prompt: 'Train passing a platform: A $100\ \text{m}$ train passes a $150\ \text{m}$
    platform at $25\ \text{m/s}$.


    How long until the whole train clears the platform?

    '
  answer:
    expected: '10 s. The front of the train must cover train length plus platform
      length, $100+150=250$ m, so $t=250/25=10$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Distance is train length plus platform length.
    - Platform is stationary.
    - Use $t=d/v$.
  explanation: 'To fully clear the platform, the rear of the train must pass the far
    edge. Equivalently, the front must travel


    $$

    100+150=250\ \text{m}.

    $$


    With speed $25\ \text{m/s}$, $t=250/25=10\ \text{s}$. The technique is identifying
    the distance that must be covered before using $t=d/v$.

    '
- id: q005
  type: freeResponse
  prompt: 'Two trains passing each other: A $120\ \text{m}$ train and an $80\ \text{m}$
    train move toward each other at $18\ \text{m/s}$ and $22\ \text{m/s}$.


    How long do they take to completely pass each other?

    '
  answer:
    expected: '5 s. The distance is $120+80=200$ m and the relative speed is $18+22=40$
      m/s, so $t=200/40=5$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Add train lengths for passing distance.
    - Add speeds because they move opposite directions.
    - Use $t=d/v_{\text{rel}}$.
  explanation: 'Complete passing requires the two train lengths to clear:


    $$

    d=120+80=200\ \text{m}.

    $$


    Since they move toward each other,


    $$

    v_{\text{rel}}=18+22=40\ \text{m/s}.

    $$


    Therefore $t=200/40=5\ \text{s}$.

    '
- id: q006
  type: freeResponse
  prompt: 'Two trains same direction: A $90\ \text{m}$ train moving $30\ \text{m/s}$
    overtakes a $110\ \text{m}$ train moving $20\ \text{m/s}$ in the same direction.


    How long does it take the faster train to completely pass the slower train?

    '
  answer:
    expected: '20 s. The passing distance is $90+110=200$ m and relative speed is
      $30-20=10$ m/s.

      '
    gradingMode: selfCheck
    keyPoints:
    - Add train lengths.
    - Same direction means subtract speeds.
    - Use $t=d/v_{\text{rel}}$.
  explanation: 'The faster train must gain a full combined length:


    $$

    d=90+110=200\ \text{m}.

    $$


    Same direction means relative speed is


    $$

    v_{\text{rel}}=30-20=10\ \text{m/s}.

    $$


    So $t=200/10=20\ \text{s}$.

    '
- id: q007
  type: freeResponse
  prompt: 'Person walking inside a train: A train moves east at $18\ \text{m/s}$.
    A passenger walks west inside the train at $1.5\ \text{m/s}$ relative to the train.


    What is the passenger''s velocity relative to the ground?

    '
  answer:
    expected: '16.5 m/s east. Add velocities with signs: $v_{pg}=v_{pt}+v_{tg}=-1.5+18=16.5$
      m/s east.

      '
    gradingMode: selfCheck
    keyPoints:
    - Choose east as positive.
    - Passenger relative to train is west, so negative.
    - Add relative velocities.
  explanation: 'Use the relative velocity relationship:


    $$

    v_{pg}=v_{pt}+v_{tg}.

    $$


    East is positive, so $v_{pt}=-1.5\ \text{m/s}$ and $v_{tg}=18\ \text{m/s}$. Therefore


    $$

    v_{pg}=16.5\ \text{m/s}

    $$


    east.

    '
- id: q008
  type: freeResponse
  prompt: 'River upstream/downstream: A boat moves $6\ \text{m/s}$ relative to still
    water. The river current is $2\ \text{m/s}$.


    What are the boat''s speeds relative to shore downstream and upstream?

    '
  answer:
    expected: 'Downstream: 8 m/s. Upstream: 4 m/s. Add current downstream and subtract
      current upstream.

      '
    gradingMode: selfCheck
    keyPoints:
    - Boat relative to water is 6 m/s.
    - Water relative to shore is 2 m/s.
    - Downstream adds; upstream subtracts.
  explanation: 'Use


    $$

    \vec{v}_{bs}=\vec{v}_{bw}+\vec{v}_{ws}.

    $$


    Downstream, the boat velocity and current point the same way:


    $$

    6+2=8\ \text{m/s}.

    $$


    Upstream, they oppose:


    $$

    6-2=4\ \text{m/s}.

    $$

    '
- id: q009
  type: freeResponse
  prompt: 'Cross river and drift: A boat points straight across a $120\ \text{m}$
    wide river at $4\ \text{m/s}$ relative to the water. The current is $1.5\ \text{m/s}$
    downstream.


    How far downstream does it land?

    '
  answer:
    expected: '45 m downstream. Crossing time is $120/4=30$ s, drift is $1.5(30)=45$
      m.

      '
    gradingMode: selfCheck
    keyPoints:
    - Across-river component controls crossing time.
    - Current controls downstream drift.
    - Use independent perpendicular components.
  explanation: 'Since the boat points straight across, its cross-river velocity is
    $4\ \text{m/s}$. Time to cross:


    $$

    t=\frac{120}{4}=30\ \text{s}.

    $$


    The current carries the boat downstream during that time:


    $$

    d=(1.5)(30)=45\ \text{m}.

    $$


    The technique is vector component separation: one component crosses, the other
    drifts.

    '
- id: q010
  type: freeResponse
  prompt: 'Land directly opposite: A boat can move $5\ \text{m/s}$ relative to water.
    The current is $3\ \text{m/s}$ east. The boat must land directly north across
    the river.


    What upstream component must the boat aim with, and why?

    '
  answer:
    expected: 'It needs a 3 m/s westward component relative to the water to cancel
      the 3 m/s eastward current. The remaining northward component carries it across.

      '
    gradingMode: selfCheck
    keyPoints:
    - The current is east.
    - Aim upstream/west so the\rhorizontal component cancels current.
    - Boat speed is the hypotenuse of the velocity triangle.
  explanation: 'To land directly opposite, the net east-west component relative to
    shore must be zero. Therefore the boat''s westward component relative to water
    must equal the eastward current:


    $$

    v_{\text{boat},x}=v_{\text{current}}=3\ \text{m/s}.

    $$


    The boat''s total speed $5\ \text{m/s}$ is the hypotenuse of the right triangle.
    The northward component is


    $$

    \sqrt{5^2-3^2}=4\ \text{m/s}.

    $$

    '
- id: q011
  type: freeResponse
  prompt: 'Plane and drag/wind: A plane flies east at $80\ \text{m/s}$ relative to
    the air. A wind blows west at $15\ \text{m/s}$.


    What is the plane''s ground velocity?

    '
  answer:
    expected: '65 m/s east. Add plane-relative-to-air and air-relative-to-ground:
      $80+(-15)=65$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Treat wind as air relative to ground.
    - Opposite directions subtract.
    - Use vector addition.
  explanation: 'The structure is the same as boat-current motion:


    $$

    \vec{v}_{pg}=\vec{v}_{pa}+\vec{v}_{ag}.

    $$


    East is positive, so $v_{pa}=80$ and $v_{ag}=-15$. Thus $v_{pg}=65\ \text{m/s}$
    east.

    '
- id: q012
  type: freeResponse
  prompt: 'Lead-on motion: A ball rolls across a table at $2\ \text{m/s}$ perpendicular
    to your line of sight. It is $4\ \text{m}$ away from the point where your thrown
    object would travel straight forward at $8\ \text{m/s}$.


    How far ahead of the ball should you aim if your object reaches that distance
    in $0.50\ \text{s}$?

    '
  answer:
    expected: 'Aim 1.0 m ahead. The ball moves sideways $2(0.50)=1.0$ m during the
      flight time.

      '
    gradingMode: selfCheck
    keyPoints:
    - Find time of your object's travel.
    - Multiply target's perpendicular speed by that time.
    - Aim at the future position, not current position.
  explanation: 'Lead problems ask where the target will be, not where it is now. The
    sideways lead distance is


    $$

    d=v_{\text{target}}t=(2)(0.50)=1.0\ \text{m}.

    $$


    The technique choice is future-position relative motion: determine the time available,
    then move the target by its velocity over that time.

    '
- id: q013
  type: freeResponse
  prompt: 'Overtaking: Car A passes a marker at $18\ \text{m/s}$. Car B passes the
    same marker $5.0\ \text{s}$ later at $28\ \text{m/s}$, moving in the same direction.


    How long after Car B passes the marker does it catch Car A?

    '
  answer:
    expected: '9 s. Car A has a head start of $18(5)=90$ m. Relative speed is $28-18=10$
      m/s, so $t=90/10=9$ s.

      '
    gradingMode: selfCheck
    keyPoints:
    - Convert delayed start into a head-start distance.
    - Same direction means subtract speeds.
    - Time is measured after Car B passes the marker.
  explanation: 'During Car B''s delay, Car A travels


    $$

    d=18(5.0)=90\ \text{m}.

    $$


    Car B closes the gap at relative speed


    $$

    28-18=10\ \text{m/s}.

    $$


    Thus $t=90/10=9\ \text{s}$ after Car B passes the marker.

    '
- id: q014
  type: freeResponse
  prompt: 'Rain and umbrella: Rain falls vertically downward at $8\ \text{m/s}$ relative
    to the ground. You run east at $6\ \text{m/s}$.


    What is the rain''s velocity relative to you?

    '
  answer:
    expected: 'Relative to you, the rain has components 6 m/s west and 8 m/s downward,
      with magnitude 10 m/s. It appears slanted from ahead.

      '
    gradingMode: selfCheck
    keyPoints:
    - Use $\vec{v}_{rain,you}=\vec{v}_{rain,ground}-\vec{v}_{you,ground}$.
    - Horizontal component is opposite your running direction.
    - Combine perpendicular components with Pythagorean theorem.
  explanation: 'Relative velocity is observer subtraction:


    $$

    \vec{v}_{ry}=\vec{v}_{rg}-\vec{v}_{yg}.

    $$


    The rain has no\rhorizontal ground component, while you move east at $6\ \text{m/s}$.
    So relative to you, rain moves west at $6\ \text{m/s}$ and downward at $8\ \text{m/s}$.
    Magnitude:


    $$

    \sqrt{6^2+8^2}=10\ \text{m/s}.

    $$

    '
- id: q015
  type: freeResponse
  prompt: 'Elevator reference frame: An elevator moves upward at constant speed $3\
    \text{m/s}$. A person inside tosses a ball upward at $5\ \text{m/s}$ relative
    to the elevator.


    What is the ball''s initial velocity relative to the building?

    '
  answer:
    expected: '8 m/s upward. Add ball relative to elevator and elevator relative to
      building: $5+3=8$.

      '
    gradingMode: selfCheck
    keyPoints:
    - Use relative velocity addition.
    - Both velocities are upward.
    - Constant elevator speed does not change gravity afterward.
  explanation: 'Use


    $$

    v_{bb}=v_{be}+v_{eb}

    $$


    in words: ball relative to building equals ball relative to elevator plus elevator
    relative to building. Both are upward, so the initial building-frame velocity
    is $5+3=8\ \text{m/s}$ upward. After release, acceleration relative to the building
    is still $-g$ if air resistance is ignored.

    '
