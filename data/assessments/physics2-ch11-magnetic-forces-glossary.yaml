schemaVersion: 1
id: physics2-ch11-magnetic-forces-glossary
title: Magnetic Forces & Fields Glossary
assessmentType: glossary
categoryId: physics-2
topicId: physics2-magnetic-forces-fields
glossary:
  introduction: Core terms for magnetic forces.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of forces and moments.
    entries:
    - id: t1
      term: Magnetic Field
      definition: A vector field that describes the magnetic influence on moving electric
        charges, electric currents, and magnetic materials.
    - id: t2
      term: Lorentz Force
      definition: The total force on a point charge due to electromagnetic fields,
        $\vec{F} = q(\vec{E} + \vec{v} \times \vec{B})$.
    - id: t3
      term: Magnetic Dipole Moment
      definition: A vector $\vec{\mu} = I\vec{A}$ that characterizes the magnetic
        properties of a current loop.
