    entries:
    - id: t1
      term: Magnetic Field
      definition: A vector field that describes the magnetic influence on moving electric charges, electric
        currents, and magnetic materials.
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Magnetic Field mean?
        answer:
          expected: A vector field that describes the magnetic influence on moving electric charges, electric
            currents, and magnetic materials.
        explanation: 'Solution:


          A vector field that describes the magnetic influence on moving electric charges, electric currents,
          and magnetic materials.


          Why it works:


          This definition identifies the essential meaning of Magnetic Field.'
        tags: []
    - id: t2
      term: Lorentz Force
      definition: The total force on a point charge due to electromagnetic fields, $\vec{F} = q(\vec{E}
        + \vec{v} \times \vec{B})$.
      drills:
      - id: t2-drill
        type: flashcard
        prompt: What does Lorentz Force mean?
        answer:
          expected: The total force on a point charge due to electromagnetic fields, $\vec{F} = q(\vec{E}
            + \vec{v} \times \vec{B})$.
        explanation: 'Solution:


          The total force on a point charge due to electromagnetic fields, $\vec{F} = q(\vec{E} + \vec{v}
          \times \vec{B})$.


          Why it works:


          This definition identifies the essential meaning of Lorentz Force.'
        tags: []
    - id: t3
      term: Magnetic Dipole Moment
      definition: A vector $\vec{\mu} = I\vec{A}$ that characterizes the magnetic properties of a current
        loop.
      drills:
      - id: t3-drill
        type: flashcard
        prompt: What does Magnetic Dipole Moment mean?
        answer:
          expected: A vector $\vec{\mu} = I\vec{A}$ that characterizes the magnetic properties of a current
            loop.
        explanation: 'Solution:


          A vector $\vec{\mu} = I\vec{A}$ that characterizes the magnetic properties of a current loop.


          Why it works:


          This definition identifies the essential meaning of Magnetic Dipole Moment.'
        tags: []
