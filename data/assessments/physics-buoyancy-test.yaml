questions:
- id: q001
  type: numericResponse
  prompt: |
    A solid sphere floats in a tank of oil ($\rho_{oil} = 800 \text{ kg/m}^3$) with exactly half of its volume submerged ($V_{sub} / V_{total} = 0.50$). 
    Calculate the density of the solid sphere in $\text{kg/m}^3$.
  answer:
    value: 400
    tolerance: 1.0
  explanation: |
    Solution:
    From the floating equilibrium condition, we know that $\frac{V_{sub}}{V_{total}} = \frac{\rho_{obj}}{\rho_{fluid}}$.
    $0.50 = \frac{\rho_{sphere}}{800}$
    $\rho_{sphere} = 0.50 \times 800 = 400 \text{ kg/m}^3$.
    
    Why it works:
    An object will displace a volume of fluid equal to its own weight. If the object is exactly half as dense as the fluid, it will only need to submerge half of its volume to displace enough fluid to support itself.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    Write the expression for the apparent weight $W_{app}$ of an object of mass $m$ and density $\rho_o$ that is completely submerged in a fluid of density $\rho_f$. 
    Express your answer in terms of `m`, `g`, `\rho_o`, and `\rho_f`. (Hint: Use $V = m / \rho_o$).
  answer:
    expectedLatex: mg \left(1 - \frac{\rho_f}{\rho_o}\right)
    equivalenceMode: expression
    variables: [m, g, \rho_o, \rho_f]
    tolerance: 0.00001
    keyPoints:
    - mg - mg(\rho_f / \rho_o)
  explanation: |
    Solution:
    $W_{app} = mg - \rho_f V g$
    Substitute $V = \frac{m}{\rho_o}$:
    $W_{app} = mg - \rho_f \left(\frac{m}{\rho_o}\right) g = mg - mg \frac{\rho_f}{\rho_o} = mg \left(1 - \frac{\rho_f}{\rho_o}\right)$.
    
    Why it works:
    This formula shows that the apparent weight is just the true weight ($mg$) scaled down by a factor depending on the density ratio. If the densities are equal, the apparent weight is zero.
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
