  - parametric-derivatives
items:
  - id: recall-1
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: If $x=f(t)$ and $y=g(t)$, what is the parametric formula for $\frac{dy}{dx}$?
    answer:
      expectedLatex: \frac{dy}{dx}=\frac{dy/dt}{dx/dt}
  - id: recall-2
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: What condition must hold for $\frac{dy}{dx}=\frac{dy/dt}{dx/dt}$ to be defined?
    answer:
      expectedLatex: \frac{dx}{dt}\ne 0
  - id: recall-3
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: What is the parametric formula for $\frac{d^2y}{dx^2}$?
    answer:
      expectedLatex: \frac{d^2y}{dx^2}=\frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}}
  - id: recall-4
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: For a parametric curve, what derivative condition identifies a horizontal tangent?
    answer:
      expectedLatex: \frac{dy}{dt}=0\quad\text{and}\quad\frac{dx}{dt}\ne 0
  - id: recall-5
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: For a parametric curve, what derivative condition identifies a vertical tangent?
    answer:
      expectedLatex: \frac{dx}{dt}=0\quad\text{and}\quad\frac{dy}{dt}\ne 0
  - id: recall-6
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: After finding a tangent slope at $t=t_0$, how do you find the point for the tangent line?
    answer:
      expectedLatex: (x(t_0),\ y(t_0))
  - id: recall-7
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: What point-slope form is used for the tangent line once the point and slope are known?
    answer:
      expectedLatex: y-y_0=m(x-x_0)
  - id: recall-8
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: How do you determine concavity for a parametric curve?
    answer:
      expected: Use the sign of $\frac{d^2y}{dx^2}$.
  - id: recall-9
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: If $\frac{d^2y}{dx^2}>0$, what is the concavity?
    answer:
      expected: Concave up
  - id: recall-10
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: If $\frac{d^2y}{dx^2}<0$, what is the concavity?
    answer:
      expected: Concave down
  - id: recall-11
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: What is the usual first step when finding $\frac{dy}{dx}$ from parametric equations?
    answer:
      expectedLatex: \text{Compute }\frac{dx}{dt}\text{ and }\frac{dy}{dt}.
  - id: recall-12
    type: flashcard
    skills:
      - parametric-derivatives
    prompt: Which rule justifies the formula $\frac{dy}{dx}=\frac{dy/dt}{dx/dt}$?
    answer:
      expected: The Chain Rule
