directedProject:
  summary: Count successful line extractions and learn why EOF must not control the loop.
  estimatedTimeMinutes: 45
  outcomes:
  - Implement the line-counting-stream-loop family from a precise contract.
  - Explain the invariant and complexity of the implementation.
  - Adapt the base solution to changed requirements without breaking edge cases.
  environment:
    name: Local C++20 console project
    platform:
    - windows
    - linux
    - macos
    toolVersion: C++20
    requiredAccounts: []
    prerequisites:
    - Functions
    - loops
    - standard library containers
    installLinks: []
  resources: []
  phases:
  - id: phase-1-contract-and-approach
    title: Understand the contract and approach
    required: true
    goal: Translate the problem into an invariant before coding.
    steps:
    - id: step-1-problem-contract
      title: Read the canonical problem
      instruction: |
        Source family: `cpp-fsf-file-003`

        Implement `std::optional<std::size_t> count_file_lines(const
        std::filesystem::path& path)`. Count the number of lines successfully
        produced by `std::getline`. Return `nullopt` if the file cannot be opened
        or an I/O error occurs. An empty file has zero lines.
      expectedObservation: Requires counting successful reads rather than testing EOF before a read.
      checklist:
      - id: contract-input-output
        text: I can state the exact input, output, and edge-case policy.
      - id: contract-complexity
        text: I identified which operations determine the time and space cost.
      resources: []
    - id: step-2-approach
      title: Plan the implementation
      instruction: |
        Use this approach before opening the sample solution:

        1. Open the input stream and represent open/read failure separately from a count of zero.
        2. Call `std::getline` in the loop condition so the body sees only real lines.
        3. Increment once per successful extraction, including a final unterminated line.
        4. After the loop, treat `bad()` as failure and normal EOF as success.

        Write a short trace for one nontrivial input.
      expectedObservation: Increment only after each successful `getline`, then distinguish normal EOF
        from a bad stream.
      checklist:
      - id: approach-invariant
        text: My trace preserves the stated invariant at every step.
      resources: []
  - id: phase-2-reference-and-build
    title: Study the example and build your version
    required: true
    goal: Connect the approach to complete, compilable C++.
    steps:
    - id: step-3-example-solution
      title: Trace the example solution
      instruction: |
        The loop body runs only for lines actually extracted. A final line
        without a delimiter still succeeds once; an empty file never succeeds.
        Normal EOF sets fail/eof state, while `bad()` identifies an I/O failure.

        ```cpp
        #include <filesystem>
        #include <fstream>
        #include <optional>
        #include <string>

        std::optional<std::size_t> count_file_lines(
            const std::filesystem::path& path) {
            std::ifstream input(path);
            if (!input) return std::nullopt;
            std::size_t count = 0;
            std::string line;
            while (std::getline(input, line)) ++count;
            if (input.bad()) return std::nullopt;
            return count;
        }
        ```

        Trace this solution against every representative case before writing your own version. The sample is a reference, not starter code.
      expectedObservation: Increment only after each successful `getline`, then distinguish normal EOF
        from a bad stream.
      checklist:
      - id: solution-explained
        text: I can explain every branch, loop, and edge-case decision.
      - id: trap-avoided
        text: 'I can explain why this trap is wrong: Writing `while (!input.eof())`, which can count one
          extra iteration after the final failed read.'
      resources: []
    - id: step-4-build
      title: Implement independently
      instruction: |
        Create `main.cpp` and implement the canonical contract without copying the reference. Add the representative cases from the bank plus at least three edge cases.
      files:
      - path: main.cpp
        purpose: Learner implementation and tests
        suggestedContent: |
          // Implement the required function here.
          // Keep main() small and use it only for your own test cases.

          int main() {
              return 0;
          }
        readOnly: false
      checklist:
      - id: build-compiles
        text: The program compiles with C++20 warnings enabled.
      - id: build-tests
        text: Representative and edge cases pass.
      troubleshooting:
      - problem: Output differs only at an edge case.
        suggestion: Writing `while (!input.eof())`, which can count one extra iteration after the final
          failed read.
      resources: []
  - id: phase-3-variants
    title: Implement changed-condition variants
    required: true
    goal: Generalize the family instead of memorizing one solution.
    steps:
    - id: step-5-variants
      title: Complete the family variants
      instruction: |
        Extend the program with these variants:

        1. Also count empty lines and the longest line length in one pass.
        2. Return a structure containing line count, nonempty line count, and byte count.
        3. Create fixtures for empty files, one newline, trailing newline, and no trailing newline.

        Keep each behavior in a separately testable function.
      checklist:
      - id: variants-distinct
        text: Each variant changes behavior or constraints, not only sample data.
      - id: variants-regression
        text: The original canonical tests still pass.
      notesPrompt: Which part of the original invariant survived every variant, and which part had to
        change?
      resources: []
