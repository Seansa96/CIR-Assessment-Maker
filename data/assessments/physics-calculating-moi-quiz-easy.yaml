schemaVersion: 1
id: physics-calculating-moi-quiz-easy
title: 'Quiz (Easy): Calculating Moment of Inertia'
description: Fundamental practice problems for Calculating Moment of Inertia.
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
- physics-calculating-moi
skills:
- physics-calculating-moi
- moment-of-inertia
- moment-of-inertia-calculation
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  title: Single point mass
  type: numericResponse
  prompt: |-
    A $2.0\text{ kg}$ point mass is $3.0\text{ m}$ from an axis. What is $I$?
  answer:
    value: 18.0
    tolerance: 0.1
  explanation: |-
    $I=mr^2=(2)(3^2)=18\text{ kg}\cdot\text{m}^2$.
- id: q002
  title: Two point masses
  type: numericResponse
  prompt: |-
    Masses $1.0\text{ kg}$ at $2.0\text{ m}$ and $3.0\text{ kg}$ at $1.0\text{ m}$ rotate about the same axis. What is total $I$?
  answer:
    value: 7.0
    tolerance: 0.1
  explanation: |-
    $I=1(2^2)+3(1^2)=7$.
- id: q003
  title: Thin hoop
  type: numericResponse
  prompt: |-
    A hoop has $M=4.0\text{ kg}$ and $R=0.50\text{ m}$. What is $I$?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: |-
    $I=MR^2=4(0.5)^2=1.0$.
- id: q004
  title: Solid disk
  type: numericResponse
  prompt: |-
    A solid disk has $M=6.0\text{ kg}$ and $R=0.20\text{ m}$. What is central $I$?
  answer:
    value: 0.12
    tolerance: 0.005
  explanation: |-
    $I=\frac12MR^2=0.12$.
- id: q005
  title: Rod about center
  type: numericResponse
  prompt: |-
    A rod has $M=3.0\text{ kg}$ and $L=2.0\text{ m}$. What is $I$ about its center?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: |-
    $I=\frac1{12}ML^2=1.0$.
- id: q006
  title: Rod about end
  type: numericResponse
  prompt: |-
    A rod has $M=3.0\text{ kg}$ and $L=2.0\text{ m}$. What is $I$ about one end?
  answer:
    value: 4.0
    tolerance: 0.05
  explanation: |-
    $I=\frac13ML^2=4.0$.
- id: q007
  title: Parallel axis theorem
  type: numericResponse
  prompt: |-
    A disk has central $I=0.40$ and mass $5.0\text{ kg}$. Find $I$ about a parallel axis $0.30\text{ m}$ away.
  answer:
    value: 0.85
    tolerance: 0.02
  explanation: |-
    $I=I_{cm}+Md^2=0.40+5(0.30)^2=0.85$.
- id: q008
  title: Distance weighting
  type: multipleChoice
  prompt: |-
    Why does distant mass matter strongly for $I$?
  choices:
  - id: a
    text: |-
      Distance is squared in $I=\sum mr^2$.
  - id: b
    text: |-
      Mass is squared.
  - id: c
    text: |-
      Torque is perpendicular.
  - id: d
    text: |-
      All point masses have equal $I$.
  answer:
    choiceId: a
  explanation: |-
    $r^2$ weighting makes distant mass especially important.
- id: q009
  title: Solid sphere
  type: numericResponse
  prompt: |-
    A solid sphere has $M=10\text{ kg}$ and $R=0.50\text{ m}$. What is $I$ about a diameter?
  answer:
    value: 1.0
    tolerance: 0.02
  explanation: |-
    $I=\frac25MR^2=1.0$.
- id: q010
  title: Radius scaling
  type: multipleChoice
  prompt: |-
    If mass is fixed and radius doubles for a similar shape, how does $I$ scale?
  choices:
  - id: a
    text: |-
      It becomes four times larger.
  - id: b
    text: |-
      It doubles.
  - id: c
    text: |-
      It becomes eight times larger.
  - id: d
    text: |-
      It is unchanged.
  answer:
    choiceId: a
  explanation: |-
    $I\propto MR^2$, so doubling $R$ multiplies $I$ by $4$.
