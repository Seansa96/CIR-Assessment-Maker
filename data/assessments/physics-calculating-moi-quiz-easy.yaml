questions:
- id: q1
  type: numericResponse
  prompt: A solid uniform disk has a mass of $10 \text{ kg}$ and a radius of $0.4
    \text{ m}$. What is its moment of inertia about its central axis?
  answer:
    value: 0.8
    tolerance: 0.1
  explanation: $I = \frac{1}{2}MR^2 = 0.5(10)(0.16) = 0.8 \text{ kg}\cdot\text{m}^2$.
