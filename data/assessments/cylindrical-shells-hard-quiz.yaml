questions:
- id: shell-hard-1
  title: Shell Method Off-Axis
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the volume generated by rotating the region bounded by $y = x^2$ and $y=1$
    about the line $x=2$.'
  answer:
    gradingMode: auto
    expectedLatex: 8*2\pi/3
    equivalenceMode: expression
    tolerance: 0
  explanation: Radius is $(2-x)$ or $(x-2)$ depending on bounds. Bounds $x \in [-1,
    1]$. $\int_{-1}^1 2\pi(2-x)(1-x^2) \, dx = \frac{82\pi}{3}$.
