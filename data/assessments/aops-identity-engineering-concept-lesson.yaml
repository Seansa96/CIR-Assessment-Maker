lesson:
  introduction: Learn to solve Identity Engineering problems by recognizing factoring, substitutions, and identity design and justifying each theorem or transformation.
  sections:
  - id: aops-identity-engineering-motivation
    title: What the topic helps you notice
    required: true
    content: Identity Engineering is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are factoring, substitutions, and identity design.
    check:
      id: aops-identity-engineering-motivation-check
      type: multipleChoice
      prompt: In Identity Engineering, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-identity-engineering-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-identity-engineering-definitions-check
      type: multipleChoice
      prompt: In Identity Engineering, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-identity-engineering-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: factoring, substitutions, and identity design. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-identity-engineering-recognition-check
      type: multipleChoice
      prompt: In Identity Engineering, what should be checked before applying a method?
      choices:
