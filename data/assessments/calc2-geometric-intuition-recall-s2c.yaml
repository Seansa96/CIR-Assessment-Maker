id: calc2-geometric-intuition-recall-s2c
title: Geometric Integration Recall Drill
assessmentType: recallDrill
categoryId: calculus-2
topicId: geometric-intuition
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags: [calculus-2, geometric-intuition, recall]
authoring:
  visualRequirement: required
  visualRationale: The drill includes visual recognition of slice orientation and its matching measurement.
items:
  - id: q001
    type: cloze
    prompt: 'For vertical slices, area height is ____ minus ____.'
    answer: { expected: 'top; bottom', aliases: ['top,bottom', 'upper; lower'] }
    explanation: 'Solution: The order is top minus bottom. Why it works: A vertical slice measures positive change in y. Common trap: Reversing the order creates a negative contribution.'
  - id: q002
    type: cloze
    prompt: 'For horizontal slices, length is ____ minus ____.'
    answer: { expected: 'right; left', aliases: ['right,left'] }
    explanation: 'Solution: The order is right minus left. Why it works: A horizontal slice measures positive change in x. Common trap: Do not confuse this length with the thickness $dy$.'
  - id: q003
    type: typed
    prompt: 'State the units of $\int_a^b A(x)\,dx$ when $A(x)$ is an area and x is a length.'
    answer: { expected: volume, aliases: ['cubic units', 'cubic length'] }
    explanation: 'Solution: The answer is volume, or cubic units. Why it works: Area times a length-thickness produces a volume contribution. Common trap: Square units describe $A(x)$ before it is accumulated.'
  - id: q004
    type: cloze
    prompt: 'A representative vertical slice has thickness ____.'
    answer: { expected: '$dx$', aliases: [dx] }
    explanation: 'Solution: The thickness is $dx$. Why it works: Vertical slices vary in x. Common trap: The slice height may be a y-difference, but that does not make its thickness $dy$.'
  - id: q005
    type: typed
    prompt: 'What does a definite integral record when a graph lies on both sides of the reference axis?'
    answer: { expected: signed accumulation, aliases: ['net signed accumulation', 'signed area'] }
    explanation: 'Solution: It records signed accumulation. Why it works: Below-axis contributions are negative in an ordinary definite integral. Common trap: Geometric area requires nonnegative pieces.'
  - id: q006
    type: recognition
    prompt: 'The diagram shows a vertical slice. Name the boundary-order and thickness pair used for its area contribution.'
    media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: Vertical slice between two curves with height and dx labels }]
    choices: [{ id: a, text: 'top minus bottom and $dx$' }, { id: b, text: 'right minus left and $dy$' }]
    answer: { choiceId: a, expected: 'top minus bottom and dx', aliases: ['top-bottom and dx', 'upper minus lower and dx'] }
    explanation: 'Solution: The correct pair is top-minus-bottom and $dx$. Why it works: The pictured slice is vertical, so it has a vertical height and horizontal thickness. Common trap: Right-minus-left with $dy$ describes a horizontal slice.'
