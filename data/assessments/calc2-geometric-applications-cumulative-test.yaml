- id: geom-cum-1
  title: Arc Length Logarithmic
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    Find the exact arc length of the curve $y = \ln(\sec x)$ from $x = 0$ to $x = \pi/4$.
  answer:
    gradingMode: auto
    expectedLatex: \ln(1+\sqrt{2})
    equivalenceMode: expression
    tolerance: 0
  explanation: '1. $y'' = rac{1}{\\sec x} (\\sec x \tan x) = \tan x$.\n2. $(y'')^2 = \tan^2 x$.\n3. $\\sqrt{1 + (y'')^2} = \\sqrt{1 + \tan^2 x} = \\sqrt{\\sec^2 x} = \\sec x$ (since $\\sec x > 0$ on $[0, \\pi/4]$).\n4. $L = \\int_0^{\\pi/4} \\sec x \\, dx = [\\ln|\\sec x + \tan x|]_0^{\\pi/4} = \\ln(\\sqrt{2} + 1) - \\ln(1 + 0) = \\ln(1+\\sqrt{2})$.\n'
- id: geom-cum-2
  title: Surface Area Radical
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    Find the exact surface area generated by rotating $y = 2\sqrt{x}$ from $x=1$ to $x=2$ around the $x$-axis.
  answer:
    gradingMode: auto
    expectedLatex: rac{8\pi}{3}(3\sqrt{3} - 2\sqrt{2})
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. $y' = 1/\sqrt{x} \implies 1 + (y')^2 = 1 + 1/x = rac{x+1}{x}$.
    2. $S = \int_1^2 2\pi y \sqrt{1 + (y')^2} \, dx = 2\pi \int_1^2 (2\sqrt{x}) \sqrt{rac{x+1}{x}} \, dx$.
    3. $S = 4\pi \int_1^2 \sqrt{x+1} \, dx = 4\pi [rac{2}{3}(x+1)^{3/2}]_1^2 = rac{8\pi}{3}(3^{3/2} - 2^{3/2}) = rac{8\pi}{3}(3\sqrt{3} - 2\sqrt{2})$.
- id: geom-cum-3
  title: Volume Shell Method Shifted
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    Use the method of cylindrical shells to find the volume generated by rotating the region bounded by $y=x^3$, $y=0$, and $x=1$ around the vertical line $x=2$.
  answer:
    gradingMode: auto
    expectedLatex: 3\pi/5
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Radius of shell $r = 2-x$. Height $h = x^3$.
    2. $V = \int_0^1 2\pi (2-x)x^3 \, dx = 2\pi \int_0^1 (2x^3 - x^4) \, dx$.
    3. $V = 2\pi [rac{1}{2}x^4 - rac{1}{5}x^5]_0^1 = 2\pi(1/2 - 1/5) = 2\pi(3/10) = 3\pi/5$.
- id: geom-cum-4
  title: Average Value Sine Squared
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    Find the exact average value of the function $f(x) = \sin^2 x$ on the interval $[0, \pi]$.
  answer:
    gradingMode: auto
    expectedLatex: 1/2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Average value $= rac{1}{\pi - 0} \int_0^\pi \sin^2 x \, dx$.
    2. $\int_0^\pi rac{1 - \cos(2x)}{2} \, dx = [rac{x}{2} - rac{\sin(2x)}{4}]_0^\pi = \pi/2$.
    3. Average value $= rac{1}{\pi} (\pi/2) = 1/2$.
- id: geom-cum-5
  title: Center of Mass X-coordinate
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    Find the exact $x$-coordinate of the center of mass (centroid) of the region bounded by $y = \sqrt{x}$, $y=0$, and $x=1$.
  answer:
    gradingMode: auto
    expectedLatex: 3/5
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Area $M = \int_0^1 \sqrt{x} \, dx = [2/3 x^{3/2}]_0^1 = 2/3$.
    2. Moment about y-axis $M_y = \int_0^1 x\sqrt{x} \, dx = \int_0^1 x^{3/2} \, dx = [2/5 x^{5/2}]_0^1 = 2/5$.
    3. $ar{x} = M_y / M = (2/5) / (2/3) = 6/10 = 3/5$.
- id: geom-cum-6
  title: Work Pumping Conical Tank
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: 'An inverted conical tank of height 4 m and base radius 2 m is full of water. The work required to pump all the water out of the top is $W \times 9800 \\pi$. Find the exact value of $W$.\n'
  answer:
    gradingMode: auto
    expectedLatex: 16/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Establish coordinate system with origin at the bottom tip of the cone. Radius at height $y$ is $r/y = 2/4 \implies r = y/2$.
    2. Volume of slice $dV = \pi (y/2)^2 dy = rac{\pi}{4}y^2 dy$.
    3. Force $dF = 9800 rac{\pi}{4}y^2 dy$. Distance to pump is $4-y$.
    4. $W_{total} = \int_0^4 9800 rac{\pi}{4} y^2 (4-y) \, dy = 9800\pi \int_0^4 (y^2 - y^3/4) \, dy$.
    5. Evaluate integral: $[y^3/3 - y^4/16]_0^4 = 64/3 - 256/16 = 64/3 - 16 = 64/3 - 48/3 = 16/3$.
    6. Therefore $W = 16/3$.
- id: geom-cum-7
  title: Area Bisection
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    Find the exact value of $c$ (where $0 < c < 9$) such that the horizontal line $y=c$ bisects the area bounded by $y=x^2$ and $y=9$.
  answer:
    gradingMode: auto
    expectedLatex: 9/2^{2/3}
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Total area $= \int_{-3}^3 (9-x^2) \, dx = 2[9x - x^3/3]_0^3 = 2(27-9) = 36$. Half area = 18.
    2. Area bounded by $y=x^2$ and $y=c$ is $\int_{-\sqrt{c}}^{\sqrt{c}} (c-x^2) \, dx = rac{4}{3}c^{3/2}$.
    3. Set $rac{4}{3}c^{3/2} = 18 \implies c^{3/2} = rac{54}{4} = rac{27}{2}$.
    4. $c = (rac{27}{2})^{2/3} = rac{9}{2^{2/3}}$.
- id: geom-cum-8
  title: Implicit Crossing Area
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    Find the exact total area enclosed by the relation $|x| + 2|y| = 4$.
  answer:
    gradingMode: auto
    expectedLatex: 16
    equivalenceMode: expression
    tolerance: 0.1
  explanation: '1. In Quadrant 1, $x + 2y = 4 \\implies y = 2 - x/2$.\n2. The $x$-intercept is 4, $y$-intercept is 2.\n3. Area in Q1 is a triangle: $rac{1}{2}(4)(2) = 4$.\n4. Total area by symmetry is $4 \times 4 = 16$.\n'
- id: geom-cum-9
  title: Cross Section Semicircles
  type: symbolicResponse
  skills:
  - geometric-applications-cumulative
  prompt: |
    The base of a solid is bounded by $y=x$ and $y=x^2$. Cross sections perpendicular to the $y$-axis are semicircles. Find the exact volume.
  answer:
    gradingMode: auto
    expectedLatex: \pi/240
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Base width $d = \sqrt{y} - y$.
    2. Area $A(y) = rac{\pi}{8} d^2 = rac{\pi}{8} (y - 2y^{3/2} + y^2)$.
    3. $V = rac{\pi}{8} \int_0^1 (y - 2y^{3/2} + y^2) \, dy = rac{\pi}{8} (1/2 - 4/5 + 1/3) = rac{\pi}{8} (1/30) = rac{\pi}{240}$.
    *(Wait! Is it? $rac{15-24+10}{30} = 1/30$. Yes. $\pi/240$. I'll update the answer).*
- id: geom-cum-10
  title: Surface Area Setup Recognition
  type: multipleChoice
  skills:
  - geometric-applications-cumulative
  prompt: |
    Which of the following integrals correctly represents the surface area generated by revolving the curve $y = e^x$ from $x=0$ to $x=1$ about the **y-axis**?
  choices:
  - id: a
    text: $\int_0^1 2\pi e^x \sqrt{1 + e^{2x}} \, dx$
  - id: b
    text: $\int_0^1 2\pi x \sqrt{1 + e^{2x}} \, dx$
  - id: c
    text: $\int_1^e 2\pi y \sqrt{1 + (1/y)^2} \, dy$
  - id: d
    text: $\int_0^1 2\pi \sqrt{1 + e^{2x}} \, dx$
  answer:
    choiceId: b
  explanation: |
    1. Revolution about the y-axis means radius $r = x$. Surface area with respect to $x$ is $\int_0^1 2\pi x \sqrt{1 + (y')^2} \, dx = \int_0^1 2\pi x \sqrt{1 + e^{2x}} \, dx$. This matches B.
    2. With respect to $y$, $x = \ln y$. Radius is still $x$, but $x$ is now $\ln y$. So $S = \int_1^e 2\pi (\ln y) \sqrt{1 + (1/y)^2} \, dy$. 
    3. Choice C calculates the surface area about the x-axis because it uses radius $y$.
    4. Therefore, only B is correct.

