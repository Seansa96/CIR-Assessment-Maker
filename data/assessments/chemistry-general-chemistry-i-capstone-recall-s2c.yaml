items:
  - { id: r01, type: typed, prompt: 'What conversion factor changes grams of a substance into moles?', answer: { expected: 'molar mass', aliases: ['molar mass in grams per mole', 'grams per mole'] }, explanation: 'Solution: Molar mass. Why it works: Its units, grams per mole, cancel grams and leave moles.' }
  - { id: r02, type: typed, prompt: 'What does a balanced-equation coefficient compare?', answer: { expected: 'moles', aliases: ['mole amounts', 'amounts in moles'] }, explanation: 'Solution: Moles. Why it works: Coefficients count relative formula-unit amounts, which scale to mole ratios.' }
  - { id: r03, type: typed, prompt: 'What equation defines molarity?', answer: { expected: 'moles of solute divided by liters of solution', aliases: ['mol/L', 'moles per liter'] }, explanation: 'Solution: Moles of solute divided by liters of solution. Why it works: Molarity is an amount-per-volume concentration.' }
  - { id: r04, type: typed, prompt: 'What gas-law temperature scale must be used in $PV=nRT$?', answer: { expected: 'kelvin', aliases: ['K'] }, explanation: 'Solution: Kelvin. Why it works: The ideal-gas relationship requires an absolute temperature scale.' }
  - { id: r05, type: typed, prompt: 'What quantity is canceled from a complete ionic equation to obtain a net ionic equation?', answer: { expected: 'spectator ions', aliases: ['spectator ion'] }, explanation: 'Solution: Spectator ions. Why it works: They occur unchanged on both sides of the complete ionic equation.' }
  - { id: r06, type: typed, prompt: 'What sign does $\Delta H$ have for an exothermic reaction?', answer: { expected: 'negative', aliases: ['minus', '-'] }, explanation: 'Solution: Negative. Why it works: Heat leaving the system lowers the enthalpy of products relative to reactants.' }
  - { id: r07, type: typed, prompt: 'What rule fills equal-energy orbitals with separate electrons before pairing?', answer: { expected: 'Hunds rule', aliases: ['Hund rule'] }, explanation: 'Solution: Hund''s rule. Why it works: It minimizes electron repulsion in degenerate orbitals.' }
  - { id: r08, type: typed, prompt: 'What molecular feature determines whether bond dipoles cancel?', answer: { expected: 'molecular geometry', aliases: ['shape', 'molecular shape'] }, explanation: 'Solution: Molecular geometry. Why it works: Bond dipoles are vectors whose overall sum depends on their spatial arrangement.' }
