  type: multipleChoice
  prompt: |
    Two cylindrical wires, Wire A and Wire B, are made of the **same material**. Wire B has twice the length and twice the diameter of Wire A. Both wires hang vertically and support identical masses $m$ attached to their ends. 
    
    What is the ratio of their elongations, $\Delta L_B / \Delta L_A$?
  choices:
  - id: a
    text: '1 / 2'
  - id: b
    text: '1'
  - id: c
    text: '2'
  - id: d
    text: '1 / 4'
  answer:
    choiceId: a
  explanation: |
    Solution:
    The elongation formula is $\Delta L = \frac{FL}{YA}$. 
    The force $F$ (which is $mg$) and Young's Modulus $Y$ are the same for both.
    
    Why it works:
    The area $A$ is proportional to the square of the diameter ($A \propto d^2$).
    If Wire B has twice the diameter, its area is $4 \times$ that of Wire A.
    If Wire B has twice the length, $L_B = 2 L_A$.
    
    Plugging this into the proportional relationship:
    $\Delta L_B \propto \frac{2 L_A}{4 A_A} = \frac{1}{2} \left( \frac{L_A}{A_A} \right)$
    
    Therefore, $\Delta L_B / \Delta L_A = 1/2$.
    
    Why the other choices fail: 
    - If you assumed area scales linearly with diameter, you would incorrectly get a ratio of 1.
    - If you squared the length instead of the diameter, you would incorrectly get a ratio of 2 or 4.
