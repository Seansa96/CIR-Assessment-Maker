lesson:
  introduction: A mechanics ODE is trustworthy only after direction, force law, units, and the active motion branch
    are declared.
  sections:
  - id: s1
    title: Force, mass, and sign conventions
    required: true
    content: Choose a positive direction before writing $m v'=\sum F$. Weight is $mg$, not $g$ alone, and every
      resistance force points opposite the current velocity.
    media:
    - type: image
      src: /media/ede/ch04-resistance-branches.svg
      alt: Force and velocity arrows for upward and downward branches with linear and quadratic resistance.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q001
      type: multipleChoice
      prompt: Downward is positive for a falling mass with linear drag. Which equation is correct?
      skills:
      - ede-ch04-first-order-applications-mechanics
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-mechanics
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: Gravity is positive downward and drag is negative when $v>0$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $mv'=mg-bv$
      - id: b
        text: $mv'=g+bv$
        issueSignals:
        - id: ede-mechanics-resistance-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $v'=mg+bv$
        issueSignals:
        - id: ede-mechanics-resistance-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $mv'=-mg-bv$
        issueSignals:
        - id: ede-mechanics-resistance-branch-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s2
    title: Linear resistance
    required: true
    content: For downward motion with $m v'=mg-bv$, velocity approaches $v_T=mg/b$. The transient decays at rate
      $b/m$.
    media: []
    check:
      id: q002
      type: numericResponse
      prompt: A 2-kg falling object has $b=0.5$ kg/s and $g=9.8$ m/s$^2$. Find terminal speed.
      skills:
      - ede-ch04-first-order-applications-mechanics
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-mechanics
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $v_T=mg/b=2(9.8)/0.5=39.2$ m/s.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 39.2
        tolerance: 0.0001
  - id: s3
    title: Upward and downward branches
    required: true
    content: If upward is positive, linear drag is $-bv$ automatically on either branch, but a quadratic law is
      commonly written $-b|v|v$. Replacing it by $-bv^2$ reverses the force incorrectly when $v<0$.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: Which expression always opposes velocity?
      skills:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $|v|v$ has the sign of $v$, so its negative opposes either direction.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $-b|v|v$
      - id: b
        text: $-bv^2$
        issueSignals:
        - id: ede-mechanics-resistance-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $+b|v|v$
        issueSignals:
        - id: ede-mechanics-resistance-branch-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $bg$
        issueSignals:
        - id: ede-mechanics-resistance-branch-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s4
    title: Apex and return questions
    required: true
    content: During upward motion, solve only until the first time $v=0$. The downward branch then begins with new
      sign behavior; position follows from integrating velocity and may require a second equation or quadrature.
    media: []
    check:
      id: q004
      type: numericResponse
      prompt: For $v'=-(1+v^2)$, $v(0)=1$, the solution satisfies $\arctan v=\pi/4-t$. Find the apex time.
      skills:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: At the apex $v=0$, so $t=\pi/4\approx0.785398$.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 0.785398
        tolerance: 0.0001
  - id: s5
    title: Inverse-square gravity
    required: true
    content: Far from a planet, gravitational acceleration varies as $-GM/r^2$. With $v=dr/dt$, the identity $r''=v,dv/dr$
      reduces the autonomous second-order equation.
    media:
    - type: image
      src: /media/ede/ch04-inverse-square-escape.svg
      alt: Radial speed and inverse-square attraction with the escape-energy threshold.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q005
      type: multipleChoice
      prompt: Which reduced equation follows from $r''=-GM/r^2$?
      skills:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The chain rule gives $r''=dv/dt=(dv/dr)(dr/dt)=v,dv/dr$.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: $v\,dv/dr=-GM/r^2$
      - id: b
        text: $dv/dr=-GM/r^2$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: $v'=-GM/r$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: $v^2=-GM/r^2$
        issueSignals:
        - id: ede-autonomous-phase-variable-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
  - id: s6
    title: Escape velocity
    required: true
    content: Integration gives $v^2/2-GM/r=C$. Requiring nonnegative limiting speed as $r\to\infty$ yields the threshold
      $v_{esc}=\sqrt{2GM/r_0}$.
    media: []
    check:
      id: q006
      type: numericResponse
      prompt: If $2GM/r_0=121$ km$^2$/s$^2$, find escape speed in km/s.
      skills:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-nonlinear-resistance-escape
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $v_{esc}=\sqrt{121}=11$ km/s.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 11
        tolerance: 0.0001
