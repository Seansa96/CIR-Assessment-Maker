questions:
  - id: q001
    type: numericResponse
    skills: [area-between-curves, identify-upper-function]
    prompt: |
      The region is bounded by $y=\sqrt{x+1}$, $y=1/(x+1)$, and $x=3$.
      Find its area. Give a decimal answer.
    media:
      - type: image
        src: /media/s2c-dev/area-between-curves-slice.svg
        alt: A generic vertical slice showing upper minus lower.
        caption: Choose the upper function minus the lower function on the interval from their intersection to the stated vertical boundary.
    answer:
      value: 3.280372
      tolerance: 0.001
    explanation: |
      The curves meet at $x=0$. On $[0,3]$, the square-root curve is above the reciprocal curve, so integrate $\sqrt{x+1}-1/(x+1)$. The result is $14/3-\ln 4\approx3.280372$.
  - id: q002
    type: numericResponse
    skills: [area-between-curves, solve-intersections]
    prompt: |
      Find the exact area enclosed by $y=x+2$, $y=12-x^2$, $x=-1$, and $x=2$.
    answer:
      value: 25.5
      tolerance: 0.0001
    explanation: |
      The parabola is above the line on the stated interval. Compute $\int_{-1}^{2}[(12-x^2)-(x+2)]\,dx=51/2$.
  - id: q003
    type: numericResponse
    skills: [area-between-curves, rational-functions]
    prompt: |
      The curves $y=1/(x+1)$ and $y=1/(x+1)^2$ meet at $x=0$. Together with $x=1$, they enclose a region. Find its area as a decimal.
    answer:
      value: 0.193147
      tolerance: 0.001
    explanation: |
      On $[0,1]$, $1/(x+1)$ is the upper curve. Integrating their difference gives $\ln 2-1/2\approx0.193147$.
  - id: q004
    type: numericResponse
    skills: [area-between-curves, polynomial-intersections]
    prompt: |
      Find the area enclosed by $y=x^2$ and $y=6x-2x^2$.
    answer:
      value: 4
      tolerance: 0.0001
    explanation: |
      The intersections are $x=0$ and $x=2$. The second parabola is upper, so the area is $\int_0^2(6x-3x^2)\,dx=4$.
  - id: q005
    type: numericResponse
    skills: [area-between-curves, trigonometric-functions]
    prompt: |
      Find the total area between $y=\tan x$ and $y=2\sin x$ on $[-\pi/3,\pi/3]$.
    answer:
      value: 0.613706
      tolerance: 0.001
    explanation: |
      The curves meet at $-\pi/3$, $0$, and $\pi/3$. Symmetry gives twice the positive-side area: $2\int_0^{\pi/3}(2\sin x-\tan x)\,dx=2(1-\ln2)$.
  - id: q006
    type: numericResponse
    skills: [area-between-curves, horizontal-slices]
    prompt: |
      The curves $2x+y^2=8$ and $x=y$ enclose a region. Use horizontal slices and find its area.
    media:
      - type: image
        src: /media/s2c-dev/area-between-curves-slice.svg
        alt: A generic slice between a left and right boundary.
        caption: For horizontal slicing, rewrite each boundary as $x$ in terms of $y$ and use right minus left.
    answer:
      value: 18
      tolerance: 0.0001
    explanation: |
      Write the parabola as $x=(8-y^2)/2$. The intersections have $y=-4$ and $y=2$, and the area is $\int_{-4}^{2}[(8-y^2)/2-y],dy=18$.
  - id: q007
    type: numericResponse
    skills: [area-between-curves, rational-functions]
    prompt: |
      Find the area bounded by $y=x^2$ and $y=3/(x^2+2)$. Give a decimal answer.
    answer:
      value: 1.944593
      tolerance: 0.001
    explanation: |
      The intersections are at $x=\pm1$. The reciprocal curve is upper, and symmetry gives $2\int_0^1[3/(x^2+2)-x^2],dx\approx1.944593$.
  - id: q008
    type: numericResponse
    skills: [area-between-curves, absolute-value]
    prompt: |
      Find the area enclosed by $y=|x|$ and $y=x^2-2$.
    answer:
      value: 6.666667
      tolerance: 0.001
    explanation: |
      The curves meet at $x=-2$ and $x=2$. Split the absolute-value graph at zero or use symmetry: $2\int_0^2[x-(x^2-2)],dx=20/3$.
  - id: q009
    type: numericResponse
    skills: [coordinate-geometry, triangle-area]
    prompt: |
      A triangular region has vertices $(-1,4)$, $(3,-2)$, and $(6,3)$. Find its area.
    answer:
      value: 19
      tolerance: 0.0001
    explanation: |
      Using a base-height calculation or the shoelace formula gives $\tfrac12|38|=19$ square units.
  - id: q010
    type: numericResponse
    skills: [numerical-intersection, numerical-integration]
    prompt: |
      A graphing utility shows that $y=\sin(x^2)$ and $y=x^2/2$ meet at $x=0$ and again near $x=1.376$.
      Estimate the area of the enclosed region. Give a decimal answer.
    answer:
      value: 0.235681
      tolerance: 0.01
    explanation: |
      Use the positive intersection and numerically evaluate $\int_0^{1.37677}[\sin(x^2)-x^2/2],dx\approx0.235681$. The requested skill is numerical modeling after graph-based intersection finding.
