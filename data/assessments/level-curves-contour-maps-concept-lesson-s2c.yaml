  - id: s02
    title: Read the coordinates and the value separately
    required: true
    content: A map position tells you the inputs $(x,y)$; the contour label tells you the output $f(x,y)$. If the point lies exactly on a labeled curve, read its value directly. If it lies between curves, estimate using its relative position and the neighboring labels.
    media:
    - type: image
      src: /media/calculus-3/contour-reading-overview.svg
      alt: Original elevation contour map with labeled equal-value curves and marked location P.
      caption: Each labeled line is a constant function value; estimate between adjacent labels and compare their spacing.
    check:
      id: check-02
      type: multipleChoice
      prompt: Point P lies halfway between the 120 and 140 contours. What is a reasonable estimate for $f(P)$?
      choices:
      - id: a
        text: $130$
        media: []
        issueSignals: []
      - id: b
        text: $120$
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: $140$
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: $160$
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is $130$.


        Why it works: reading the next contour beyond the interval


        Why the other choices fail:


        Choice b: $120$ results from rounding down to the lower contour.


        Choice c: $140$ results from rounding up to the upper contour.


        Choice d: $160$ results from reading the next contour beyond the interval.
