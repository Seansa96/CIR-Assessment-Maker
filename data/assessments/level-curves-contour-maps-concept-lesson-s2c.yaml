  - id: s05
    title: Read steepness from spacing
    required: true
    content: Compare spacing only where adjacent contours represent the same change in value. If values 10 units apart are packed tightly in one region and spread out in another, the surface changes more rapidly per unit map distance in the tightly packed region. Unequal contour intervals require checking the labels before comparing spacing.
    media:
    - type: image
      src: /media/calculus-3/contour-spacing-steepness.svg
      alt: Two contour-map panels on the same six-kilometer scale compare a 10-unit change across two kilometers with the same change across five kilometers.
      caption: With the same contour interval, closer contours mean a larger average rate magnitude per kilometer.
    check:
      id: check-05
      type: multipleChoice
      prompt: Two neighboring contour pairs differ by 10 units. Pair A is 2 km apart and pair B is 5 km apart. Which region has the larger average rate magnitude across the pair?
      choices:
      - id: a
        text: 'Pair A: $10/2=5$ units per km.'
        media: []
        issueSignals: []
      - id: b
        text: 'Pair B: $10/5=2$ units per km.'
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: They are equal because both intervals are 10 units.
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: 'Pair B: $10\cdot5=50$ units per km.'
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is Pair A: $10/2=5$ units per km..


        Why it works: multiplying instead of dividing by distance


        Why the other choices fail:


        Choice b: Pair B: $10/5=2$ units per km. results from using the wider spacing as the larger rate.


        Choice c: They are equal because both intervals are 10 units. results from comparing value interval alone and ignoring distance.


        Choice d: Pair B: $10\cdot5=50$ units per km. results from multiplying instead of dividing by distance.
