  - id: s07
    title: Follow a path across contours
    required: true
    content: A path that stays on one contour has no change in $f$, even though its coordinates move. A path that crosses contours changes the output; the labels reveal the sign and approximate size. Count the value changes, not just the number of lines crossed.
    media: []
    check:
      id: check-07
      type: multipleChoice
      prompt: A hiker moves from the 110 contour to the 150 contour. What is the net change in elevation?
      choices:
      - id: a
        text: An increase of 40 m.
        media: []
        issueSignals: []
      - id: b
        text: A decrease of 40 m.
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: No change, because four contour intervals are crossed.
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: An increase of 260 m.
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is An increase of 40 m..


        Why it works: adding initial and final elevations


        Why the other choices fail:


        Choice b: A decrease of 40 m. results from subtracting in reverse order.


        Choice c: No change, because four contour intervals are crossed. results from confusing contour crossings with constant value.


        Choice d: An increase of 260 m. results from adding initial and final elevations.
