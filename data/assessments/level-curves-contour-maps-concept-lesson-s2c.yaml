lesson:
  introduction: A contour map turns a three-dimensional surface into labeled curves on a two-dimensional map. Each line records one function value. Learn to read a location, compare neighboring values, estimate change, and translate what the picture says into equations and geometric claims. The maps in this lesson are original schematic examples; every label and point is part of the problem.
  sections:
  - id: s01
    title: A contour is a level curve
    required: true
    content: For a scalar field $f(x,y)$, the contour labeled $c$ is the set of map locations satisfying $f(x,y)=c$. The output stays fixed along that line while the coordinates change. The label is a function value, not a distance or a height above the page.
    media:
    - type: image
      src: /media/calculus-3/contour-reading-overview.svg
      alt: Original elevation contour map with labeled equal-value curves and marked location P.
      caption: Each labeled line is a constant function value; estimate between adjacent labels and compare their spacing.
    check:
      id: check-01
      type: multipleChoice
      prompt: At a point R on the 140 contour, what equation must hold?
      choices:
      - id: a
        text: $f(x_R,y_R)=140$
        media: []
        issueSignals: []
      - id: b
        text: $x_R+y_R=140$
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: $f(140,y_R)=x_R$
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: $f(x_R,y_R)=0$
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is $f(x_R,y_R)=140$.


        Why it works: using the zero contour instead


        Why the other choices fail:


        Choice b: $x_R+y_R=140$ results from confusing coordinates with output.


        Choice c: $f(140,y_R)=x_R$ results from swapping input and output roles.


        Choice d: $f(x_R,y_R)=0$ results from using the zero contour instead.
