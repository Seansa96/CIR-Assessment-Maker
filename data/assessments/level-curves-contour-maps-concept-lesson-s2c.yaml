  - id: s03
    title: Interpolate with the contour interval
    required: true
    content: When a point lies between two labeled contours, use its position across that band. Halfway between values 20 and 30 suggests about 25; one-quarter of the way from 20 toward 30 suggests about 22.5. This is an estimate, because the true surface may not vary linearly between the lines.
    media: []
    check:
      id: check-03
      type: multipleChoice
      prompt: At a point about one-quarter of the way from contour 40 toward contour 60, which estimate follows linear interpolation?
      choices:
      - id: a
        text: $45$
        media: []
        issueSignals: []
      - id: b
        text: $50$
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: $55$
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: $40$
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
