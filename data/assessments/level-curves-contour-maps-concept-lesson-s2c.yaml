  - id: s08
    title: Connect contours to surface geometry
    required: true
    content: Tightly packed equal-interval contours correspond to a steep surface; widely spaced contours correspond to a gradual surface. Near a smooth point, the gradient points perpendicular to the contour toward larger values. A direction tangent to a contour has approximately zero instantaneous change in the function.
    media:
    - type: image
      src: /media/calculus-3/contour-gradient-tangent.svg
      alt: Nearby contours labeled 2, 3, and 4 surround point P on contour 3; the gradient points outward toward larger labels and perpendicular to a unit tangent along the contour.
      caption: At a smooth point, the gradient is normal to the level curve, while the tangent direction stays on that curve.
    check:
      id: check-08
      type: multipleChoice
      prompt: At a smooth point, the gradient points toward larger labels and has magnitude 6. What directional derivative occurs along a unit tangent to that contour?
      choices:
      - id: a
        text: $0$
        media: []
        issueSignals: []
      - id: b
        text: $6$
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: -$6$
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: $1$
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is $0$.


        Why it works: assuming every unit direction has rate one


        Why the other choices fail:


        Choice b: $6$ results from using the maximum rate instead of the tangent-direction rate.


        Choice c: -$6$ results from reversing the gradient direction.


        Choice d: $1$ results from assuming every unit direction has rate one.
