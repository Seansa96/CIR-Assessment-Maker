  - id: s06
    title: Translate the picture into an equation
    required: true
    content: Every contour can be written algebraically as $f(x,y)=c$. A map with several labeled contours shows several members of this family. For example, the curve labeled 75 is exactly the level set $f(x,y)=75$; its shape may be a circle, a winding path, or a line.
    media:
    - type: image
      src: /media/calculus-3/contour-level-equation-18.svg
      alt: An x-y contour map has three nested level curves labeled 12, 18, and 24, with point P marked on the curve labeled 18.
      caption: The label 18 is the fixed output value, so every point on this curve satisfies f(x,y)=18.
    check:
      id: check-06
      type: multipleChoice
      prompt: Which equation describes the contour labeled 18?
      choices:
      - id: a
        text: $f(x,y)=18$
        media: []
        issueSignals: []
      - id: b
        text: $x=18$
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: $y=18$
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: $f(18,y)=x$
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is $f(x,y)=18$.


        Why it works: using 18 as an input rather than the fixed output


        Why the other choices fail:


        Choice b: $x=18$ results from treating the output label as the x-coordinate.


        Choice c: $y=18$ results from treating the output label as the y-coordinate.


        Choice d: $f(18,y)=x$ results from using 18 as an input rather than the fixed output.
