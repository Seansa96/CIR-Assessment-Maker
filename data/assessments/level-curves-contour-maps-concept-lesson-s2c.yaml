  - id: s04
    title: Use the labels to infer increase and decrease
    required: true
    content: Compare the values printed on neighboring curves before deciding which way is uphill, warmer, or higher pressure. Moving toward larger contour labels increases $f$; moving toward smaller labels decreases it. The map’s colors or geographic directions do not determine the sign by themselves.
    media: []
    check:
      id: check-04
      type: multipleChoice
      prompt: Moving from the 80 contour toward the 50 contour, what happens to $f$?
      choices:
      - id: a
        text: It decreases by 30 units.
        media: []
        issueSignals: []
      - id: b
        text: It increases by 30 units.
        media: []
        issueSignals:
        - id: contour-label-misread
          domains: []
      - id: c
        text: It remains constant.
        media: []
        issueSignals:
        - id: contour-interpolation-error
          domains: []
      - id: d
        text: Its change is 130 units.
        media: []
        issueSignals:
        - id: contour-direction-error
          domains: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is It decreases by 30 units..


        Why it works: adding the endpoint values instead of subtracting


        Why the other choices fail:


        Choice b: It increases by 30 units. results from reversing the direction of the label change.


        Choice c: It remains constant. results from assuming movement across contours is constant.


        Choice d: Its change is 130 units. results from adding the endpoint values instead of subtracting.
