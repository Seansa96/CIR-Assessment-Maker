        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: The correct choice is $45$.


        Why it works: using the lower contour exactly


        Why the other choices fail:


        Choice b: $50$ results from using the midpoint regardless of location.


        Choice c: $55$ results from placing the point three-quarters of the way across the interval.


        Choice d: $40$ results from using the lower contour exactly.
