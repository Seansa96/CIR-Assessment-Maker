questions:
  - { id: q001, type: symbolicResponse, prompt: 'Rotate the region under $y=4-x$ on $0\le x\le4$ about $x=5$. Find the volume using shells.', answer: { expectedLatex: '176\\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is $5-x$ and height is $4-x$, so $V=2\pi\int_0^4(5-x)(4-x)dx=2\pi[20x-9x^2/2+x^3/3]_0^4=2\pi(88/3)=176\pi/3$. Why it works: A vertical strip is parallel to the vertical axis $x=5$, so circumference times height gives the shell volume. Common trap: Radius is $5-x$, not $x$; also evaluate every antiderivative term at $x=4$. ', difficultyDimensions: [modelOrDerivation, representationTransfer, auxiliaryTechnique], difficultyEvidence: Uses a shifted radius, boundary height, and a product integral. }
  - { id: q002, type: symbolicResponse, prompt: 'Rotate the rectangle $0\le x\le4$, $0\le y\le2$ about $x=2$. Find its volume using shells.', answer: { expectedLatex: '16\\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The radius is $|x-2|$ and height is 2. Split at x=2: $V=4\pi[\int_0^2(2-x)dx+\int_2^4(x-2)dx]=4\pi(2+2)=16\pi$. Why it works: The axis crosses the region, so radius changes formula. Common trap: Integrating $x-2$ across [0,4] cancels radii and gives zero.', difficultyDimensions: [casePartition, domainCondition, modelOrDerivation], difficultyEvidence: The rotation axis crosses the interval, requiring an absolute-distance partition. }
  - { id: q003, type: symbolicResponse, prompt: 'Find the shell volume when the region between $y=x$ and $y=x^2$ on $[0,1]$ rotates about the y-axis.', answer: { expectedLatex: '\\pi/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is x and height is $x-x^2$. $V=2\pi\int_0^1x(x-x^2)dx=2\pi[ x^3/3-x^4/4]_0^1=\pi/6$. Why it works: Vertical shells preserve both original y-functions. Common trap: Height is x minus x squared, not their product alone.', difficultyDimensions: [modelOrDerivation, simplification, auxiliaryTechnique], difficultyEvidence: Determines curve order, forms a shell product, and integrates a simplified polynomial. }
  - { id: q004, type: symbolicResponse, prompt: 'Find the volume when the region under $y=\sqrt{x}$ on $[0,4]$ rotates about the y-axis using shells.', answer: { expectedLatex: '128\\pi/5', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: $V=2\pi\int_0^4x\sqrt{x}dx=2\pi[2x^{5/2}/5]_0^4=128\pi/5$. Why it works: Radius is x and height is $\sqrt{x}$. Common trap: Do not divide by 3; the antiderivative of $x^{3/2}$ has denominator $5/2$.', difficultyDimensions: [modelOrDerivation, auxiliaryTechnique, domainCondition], difficultyEvidence: Uses fractional exponents, endpoint evaluation, and the shell geometry. }
  - { id: q005, type: freeResponse, prompt: 'A proposed shell setup for rotating y=x^2 on [0,2] about the y-axis is $\pi\int_0^2x^4dx$. Identify the geometric error and give the correct integral.', answer: { gradingMode: selfCheck, keyPoints: ['circumference 2 pi x', 'height x squared', '2 pi integral x cubed'] }, explanation: 'Solution: $\pi x^4$ treats the strip like a disk area. A shell uses circumference times height, so $V=2\pi\int_0^2x(x^2)dx$. Why it works: The vertical strip is parallel to the y-axis and rolls into a hollow cylinder. Common trap: Disk and shell formulas are not interchangeable.', difficultyDimensions: [errorDiagnosis, reverseReasoning, modelOrDerivation], difficultyEvidence: Reconstructs the correct geometry from an incorrect disk-style expression. }
  - { id: q006, type: symbolicResponse, prompt: 'Rotate the region under y=x on [0,3] about x=1. Find the shell volume.', answer: { expectedLatex: '29\\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is $|x-1|$ and height is x. $V=2\pi[\int_0^1(1-x)x dx+\int_1^3(x-1)x dx]=2\pi(1/6+14/3)=29\pi/3$. Why it works: The radius changes sign at the axis and must remain nonnegative. Common trap: A single $(x-1)x$ integral gives signed rather than geometric shells.', difficultyDimensions: [casePartition, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: Requires an offset-axis absolute radius and exact piecewise integration. }
  - { id: q007, type: symbolicResponse, prompt: 'Explain which method is simpler for rotating the region bounded by y=x and y=4 about the y-axis, then give a shell setup.', answer: { expectedLatex: '2\\pi\\int_0^4x(4-x)dx', equivalenceMode: expression, variables: [x], tolerance: 0.000001 }, explanation: 'Solution: Shells are simpler because vertical strips use height $4-x$ directly; washers would require x=y and horizontal slices but also work. $V=2\pi\int_0^4x(4-x)dx$. Why it works: Vertical strips are parallel to the y-axis. Common trap: Method selection is based on representation simplicity, not a rule that one axis forces one method.', difficultyDimensions: [representationTransfer, reverseReasoning, modelOrDerivation], difficultyEvidence: Compares two valid representations and justifies the lower-complexity shell model. }
  - { id: q008, type: symbolicResponse, prompt: 'Find the volume when the region between y=2x and y=x^2 rotates about the y-axis.', answer: { expectedLatex: '8\\pi/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Intersections are x=0,2; height is $2x-x^2$. $V=2\pi\int_0^2x(2x-x^2)dx=2\pi[2x^3/3-x^4/4]_0^2=8\pi/3$. Why it works: The line is above the parabola on the enclosed interval. Common trap: Solve the intersections before assuming bounds.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, domainCondition], difficultyEvidence: Finds bounds, determines order, and builds a cubic shell integrand. }
  - { id: q009, type: symbolicResponse, prompt: 'Rotate the region y=1, y=3, 0≤x≤2 about x=4. Find the shell volume.', answer: { expectedLatex: '24\\pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is $4-x$ and height is 2. $V=2\pi\int_0^2(4-x)(2)dx=4\pi[4x-x^2/2]_0^2=24\pi$. Why it works: The axis is outside the region, so one positive radius formula applies. Common trap: Do not use x as the radius to an axis at x=4.', difficultyDimensions: [representationTransfer, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: Uses an external offset axis and constant strip height. }
  - { id: q010, type: symbolicResponse, prompt: 'Find the shell volume under y=1-x^2 on [-1,1] about the y-axis.', answer: { expectedLatex: '\\pi/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Radius is |x| and height is $1-x^2$. By symmetry, $V=4\pi\int_0^1x(1-x^2)dx=4\pi(1/2-1/4)=\pi$. Why it works: Left and right strips at equal distance make distinct shells only once in the physical solid; the correct shell setup uses x≥0, yielding $2\pi\int_0^1x(1-x^2)dx=\pi/2$. Common trap: Do not double shells from both sides of an axis that lies inside the region; they overlap after rotation.', difficultyDimensions: [globalLocalReasoning, errorDiagnosis, modelOrDerivation], difficultyEvidence: Requires recognizing overlap of symmetric strips and restricting the shell domain. }
