workedExamples:
- id: we001
  title: Choosing and applying the Law of Sines
  problem: 'Use the Law of Sines to solve oblique triangles when you have, or can
    create, an opposite side-angle pair.


    Standard notation pairs side $a$ with opposite angle $A$, side $b$ with opposite
    angle $B$, and side $c$ with opposite angle $C$.

    '
  steps:
  - id: step-we001-1
    title: Write the identity family
    instruction: 'First, memorize the structure of the Law of Sines as a family of
      equivalent ratios.


      Side-over-sine form:


      $$

      \frac{a}{\sin A}=\frac{b}{\sin B}=\frac{c}{\sin C}

      $$


      Sine-over-side form:


      $$

      \frac{\sin A}{a}=\frac{\sin B}{b}=\frac{\sin C}{c}

      $$


      Useful two-ratio permutations include:


      $$

      \frac{a}{\sin A}=\frac{b}{\sin B},

      \qquad

      \frac{a}{\sin A}=\frac{c}{\sin C},

      \qquad

      \frac{b}{\sin B}=\frac{c}{\sin C}

      $$


      and equivalently:


      $$

      \frac{\sin A}{a}=\frac{\sin B}{b},

      \qquad

      \frac{\sin A}{a}=\frac{\sin C}{c},

      \qquad

      \frac{\sin B}{b}=\frac{\sin C}{c}.

      $$


      The practical decision is: use whichever pair includes one complete opposite
      pair and one unknown.

      '
    type: freeResponse
    prompt: |
      Type out the main Law of Sines forms and at least three useful two-ratio permutations.
    answer:
      expected: 'A complete response should include both main forms:


        $$

        \frac{a}{\sin A}=\frac{b}{\sin B}=\frac{c}{\sin C}

        $$


        and


        $$

        \frac{\sin A}{a}=\frac{\sin B}{b}=\frac{\sin C}{c}.

        $$


        It should also include pairwise forms such as $\frac{a}{\sin A}=\frac{b}{\sin
        B}$, $\frac{a}{\sin A}=\frac{c}{\sin C}$, and $\frac{b}{\sin B}=\frac{c}{\sin
        C}$, or the reciprocal versions.

        '
      gradingMode: selfCheck
      keyPoints:
      - Pairs must match each side with its opposite angle.
      - Both side-over-sine and sine-over-side forms are valid.
      - A two-ratio setup should use one known opposite pair and one target unknown.
    hint: 'Write one full chain with sides on top, one reciprocal chain with sines
      on top, then split the chain into pairs.

      '
    explanation: |
      The Law of Sines is a proportional relationship between opposite side-angle pairs. The notation matters: $a$ pairs with $A$, $b$ pairs with $B$, and $c$ pairs with $C$.

      Related topic: Law of Sines identities and opposite side-angle notation.
  - id: step-we001-2
    title: Decide whether Law of Sines is available
    instruction: 'The Law of Sines needs at least one known opposite pair, such as
      side $a$ and angle $A$.

      '
    type: multipleChoice
    prompt: |
      Which situation can use the Law of Sines immediately?
    choices:
    - id: a
      text: $A=42^\circ$, $a=12$, and $B=68^\circ$
    - id: b
      text: $a=7$, $b=9$, and $c=11$
    - id: c
      text: $a=5$, $b=8$, and included angle $C=40^\circ$
    - id: d
      text: $A=50^\circ$ only
    answer:
      choiceId: a
    hint: 'Look for a complete opposite pair: a side and the angle across from it.

      '
    explanation: |
      Choice A gives the complete pair $A$ and $a$, plus another angle. That lets you write a proportion involving the unknown side opposite $B$.

      Related topic: AAS/ASA Law of Sines setup. The actionable check is "Do I have one full opposite pair?"
  - id: step-we001-3
    title: Find a missing side from AAS or ASA
    instruction: 'Suppose $A=42^\circ$, $B=68^\circ$, and $a=12$. To find $b$, pair
      $b$ with $\sin B$ and $a$ with $\sin A$.

      '
    type: multipleChoice
    prompt: |
      Which equation correctly finds $b$?
    choices:
    - id: a
      text: $\frac{b}{\sin 68^\circ}=\frac{12}{\sin 42^\circ}$
    - id: b
      text: $\frac{b}{\sin 42^\circ}=\frac{12}{\sin 68^\circ}$
    - id: c
      text: $b^2=12^2+68^2-2(12)(68)\cos 42^\circ$
    - id: d
      text: $b=12\sin 42^\circ$
    answer:
      choiceId: a
    hint: 'Side $b$ is opposite angle $B=68^\circ$.

      '
    explanation: |
      Match opposite pairs:

      $$
      \frac{b}{\sin B}=\frac{a}{\sin A}
      $$

      so

      $$
      \frac{b}{\sin 68^\circ}=\frac{12}{\sin 42^\circ}.
      $$

      Related topic: Solving a side with the Law of Sines.
  - id: step-we001-4
    title: Isolate the unknown side
    instruction: 'After setting up the proportion, multiply by the denominator under
      the unknown.

      '
    type: multipleChoice
    prompt: |
      From

      $$
      \frac{b}{\sin 68^\circ}=\frac{12}{\sin 42^\circ},
      $$

      which expression isolates $b$?
    choices:
    - id: a
      text: $b=\frac{12\sin 68^\circ}{\sin 42^\circ}$
    - id: b
      text: $b=\frac{12\sin 42^\circ}{\sin 68^\circ}$
    - id: c
      text: $b=12+\sin 68^\circ-\sin 42^\circ$
    - id: d
      text: $b=\sin^{-1}\left(\frac{12}{68}\right)$
    answer:
      choiceId: a
    hint: 'Multiply both sides by $\sin 68^\circ$.

      '
    explanation: |
      Multiply both sides by $\sin 68^\circ$:

      $$
      b=\sin 68^\circ\cdot\frac{12}{\sin 42^\circ}
      =\frac{12\sin 68^\circ}{\sin 42^\circ}.
      $$

      Related topic: Proportion manipulation in Law of Sines problems.
  - id: step-we001-5
    title: Find the third angle first when needed
    instruction: 'If two angles are known, use the triangle angle sum before applying
      the Law of Sines to the remaining side.

      '
    type: multipleChoice
    prompt: |
      A triangle has $A=35^\circ$, $B=80^\circ$, and $a=10$. What is $C$?
    choices:
    - id: a
      text: $65^\circ$
    - id: b
      text: $75^\circ$
    - id: c
      text: $115^\circ$
    - id: d
      text: $180^\circ$
    answer:
      choiceId: a
    hint: 'The angles of a triangle sum to $180^\circ$.

      '
    explanation: |
      $$
      C=180^\circ-35^\circ-80^\circ=65^\circ.
      $$

      Related topic: Triangle angle sum before Law of Sines.
  - id: step-we001-6
    title: Notice the ambiguous SSA case
    instruction: 'SSA information can produce zero, one, or two possible triangles
      because two different angles can share the same sine value.

      '
    type: multipleChoice
    prompt: |
      Why should you be careful when using

      $$
      \sin B=\frac{b\sin A}{a}
      $$

      in an SSA problem?
    choices:
    - id: a
      text: There may be an acute angle and an obtuse supplement with the same sine.
    - id: b
      text: The Law of Sines never works for sides.
    - id: c
      text: All SSA triangles are impossible.
    - id: d
      text: Sine can only be used in right triangles.
    answer:
      choiceId: a
    hint: '$\sin \theta=\sin(180^\circ-\theta)$.

      '
    explanation: |
      If $\sin B$ gives an acute angle, the supplementary angle $180^\circ-B$ may also fit the triangle. You must check whether the alternate angle leaves a positive third angle.

      Related topic: Ambiguous case of the Law of Sines.
