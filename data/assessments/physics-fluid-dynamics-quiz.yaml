questions:
- id: q001
  type: numericResponse
  prompt: "Water ($\\rho = 1000 \\text{ kg/m}^3$) flows steadily through a horizontal\
    \ pipe. In the wide section, the absolute pressure is $150,000 \\text{ Pa}$ and\
    \ the fluid speed is $2.0 \\text{ m/s}$. \nIn the narrow section, the fluid speed\
    \ increases to $10.0 \\text{ m/s}$. \nCalculate the absolute pressure in the narrow\
    \ section in Pascals.\n"
  answer:
    value: 102000
    tolerance: 1000
  explanation: 'Solution:

    Because the pipe is horizontal, $y_1 = y_2$, so Bernoulli''s equation simplifies
    to:

    $P_1 + \frac{1}{2}\rho v_1^2 = P_2 + \frac{1}{2}\rho v_2^2$

    $150000 + \frac{1}{2}(1000)(2.0)^2 = P_2 + \frac{1}{2}(1000)(10.0)^2$

    $150000 + 500(4) = P_2 + 500(100)$

    $150000 + 2000 = P_2 + 50000$

    $152000 = P_2 + 50000$

    $P_2 = 102000 \text{ Pa}$.


    Why it works:

    This is the Venturi effect. The increase in kinetic energy density (from $2000
    \text{ J/m}^3$ to $50000 \text{ J/m}^3$) requires an exactly equal decrease in
    pressure energy density to conserve total energy.

    '
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
- id: q002
  type: multipleChoice
  prompt: "A large tank of water is open to the atmosphere at the top. A small hole\
    \ is punctured in its side, allowing water to spray out horizontally. \nIf you\
    \ double the depth of the hole relative to the water surface, what happens to\
    \ the exit speed of the water?\n"
  choices:
  - id: a
    text: The exit speed doubles.
    issueSignals:
    - id: velocity-flow-confusion
  - id: b
    text: The exit speed increases by a factor of roughly 1.41.
  - id: c
    text: The exit speed increases by a factor of 4.
    issueSignals:
    - id: velocity-flow-confusion
  - id: d
    text: The exit speed remains the same.
    issueSignals:
    - id: velocity-flow-confusion
  answer:
    choiceId: b
  explanation: 'Solution:

    The exit speed increases by a factor of roughly $1.41$ ($\sqrt{2}$).


    Why it works:

    Torricelli''s Law states that $v = \sqrt{2gh}$. Therefore, velocity is proportional
    to the square root of the depth $h$. If $h$ is doubled ($2h$), the velocity increases
    by a factor of $\sqrt{2} \approx 1.414$.


    Why the other choices fail:

    Doubling the depth doubles the pressure (potential energy), but since kinetic
    energy depends on $v^2$, the velocity only increases by the square root of the
    pressure change.

    '
  difficultyDimensions:
  - IdentityConstruction
  - Simplification
  - ModelOrDerivation
