workedExamples:
- id: l1-sec1
  title: Ideal Voltage Source
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Ideal Voltage Source
    instruction: An ideal voltage source maintains a prescribed voltage across its
      terminals regardless of the current flowing through it. It is an active element
      that provides energy to the circuit.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l1-sec2
  title: Ideal Current Source
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Ideal Current Source
    instruction: An ideal current source maintains a prescribed current in its branch
      regardless of the voltage across its terminals.
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l1-sec3
  title: Dependent Sources
  problem: 'Review the following concept:'
  steps:
  - id: step3
    title: Dependent Sources
    instruction: 'Dependent (or controlled) sources establish a voltage or current
      whose value depends on a voltage or current elsewhere in the circuit. There
      are four types: VCVS, VCCS, CCVS, CCCS.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
