  - id: sequence-limit-tools-step-009
    title: Use monotone bounded convergence
    instruction: |
      Some recursively defined sequences do not give their limit immediately. You first prove the sequence is trapped and moving one direction.

      $$
      a_1=1,\qquad a_{n+1}=\frac{a_n+8}{3}
      $$
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: algebraic-simplification-error
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: If the sequence is shown increasing and bounded above, what limit does it approach?
    choices:
    - id: a
      text: $4$
    - id: b
      text: $8$
    - id: c
      text: |-
        $\frac83$
    - id: d
      text: It must diverge.
    answer:
      choiceId: a
    explanation: |-
      Solution: If $a_n\to L$, then

      $$
      L=\frac{L+8}{3}.
      $$

      Solving gives $3L=L+8$, so $L=4$. The monotone-bounded proof justifies that the limit exists. Therefore the answer is $4$.

      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.

      Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.

      Why the other choices fail: $8$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; $\frac83$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; It must diverge. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.
  - id: sequence-limit-tools-step-010
    title: Interpret a long finite sum as a Riemann sum
    instruction: |
      A sequence can itself be a sum whose number of terms changes with $n$.

      $$
      a_n=\frac1n\sum_{k=1}^{n}\frac{1}{1+k/n}
      $$
    type: multipleChoice
    issueSignals:
    - id: expression-equation-recognition-error
    - id: algebraic-simplification-error
    - id: geometric-series-convergence-error
    - id: limit-evaluation-error
    - id: exponent-rule-misapplied
    - id: function-analysis-error
    prompt: What does this converge to?
    choices:
    - id: a
      text: |-
        $\int_0^1\frac{1}{1+x}\,dx=\ln 2$
    - id: b
      text: |-
        $0$, because each term has a factor $\frac1n$
    - id: c
      text: $1$, because there are $n$ terms
    - id: d
      text: The sequence diverges.
    answer:
      choiceId: a
    explanation: |-
      Solution: This is a right-endpoint Riemann sum for $f(x)=\frac1{1+x}$ on $[0,1]$. The limit is $\ln 2$. Therefore the answer is $\int_0^1\frac{1}{1+x}\,dx=\ln 2$.

      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

