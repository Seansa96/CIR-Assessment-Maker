workedExamples:
  - id: sequence-limit-tool-tour
    title: Choosing the Right Limit Tool for a Sequence
    problem: |
      ![Sequence term behavior examples](/media/calculus/infinite-series/sequence-limit-behaviors.svg)

      Decide whether each sequence converges by choosing the limit tool that matches its structure. The goal is not to memorize one trick. The goal is to learn what the expression is asking you to notice.
    steps:
      - id: sequence-limit-tools-step-001
        title: Start with dominant terms
        instruction: |
          Rational expressions are usually decided by the largest power of $n$.

          $$
          a_n=\frac{4n^3-7n}{2n^3+5}
          $$
        type: multipleChoice
        prompt: What is the best conclusion?
        choices:
          - id: a
            text: The sequence converges to $2$ by comparing dominant terms.
          - id: b
            text: The sequence diverges because both numerator and denominator grow.
          - id: c
            text: The sequence converges to $0$ by the Squeeze Theorem.
          - id: d
            text: The sequence diverges by oscillation.
        answer:
          choiceId: a
        explanation: |
          Divide by $n^3$. The lower-power terms vanish:

          $$
          \frac{4-7/n^2}{2+5/n^3}\to \frac42=2.
          $$

          Related topic: dominant-term limits for rational sequences.
      - id: sequence-limit-tools-step-002
        title: Use continuity after an inner limit
        instruction: |
          When a familiar function surrounds a simpler expression, first find the inner limit.

          $$
          a_n=\cos\left(\frac{3}{n}\right)
          $$
        type: multipleChoice
        prompt: Which reasoning is correct?
        choices:
          - id: a
            text: Since $\frac3n\to 0$ and cosine is continuous, $a_n\to 1$.
          - id: b
            text: Since cosine oscillates, the sequence diverges.
          - id: c
            text: Since $\frac3n\to 0$, the sequence must converge to $0$.
          - id: d
            text: Since $n$ grows, the sequence diverges to infinity.
        answer:
          choiceId: a
        explanation: |
          Continuous functions preserve limits. Here $\cos(3/n)\to \cos(0)=1$.
      - id: sequence-limit-tools-step-003
        title: Squeeze bounded oscillation
        instruction: |
          Oscillation does not automatically mean divergence. If the oscillating part is multiplied by something shrinking to $0$, squeeze it.

          $$
          a_n=\frac{\sin(5n)}{\sqrt n}
          $$
        type: multipleChoice
        prompt: What should you do?
        choices:
          - id: a
            text: Squeeze between $-\frac1{\sqrt n}$ and $\frac1{\sqrt n}$, so it converges to $0$.
          - id: b
            text: Declare divergence because $\sin(5n)$ oscillates.
          - id: c
            text: Compare leading powers and get $5$.
          - id: d
            text: Use monotone bounded convergence.
        answer:
          choiceId: a
        explanation: |
          Because $-1\le \sin(5n)\le 1$,

          $$
          -\frac1{\sqrt n}\le \frac{\sin(5n)}{\sqrt n}\le \frac1{\sqrt n}.
          $$

          Both bounds go to $0$.
      - id: sequence-limit-tools-step-004
        title: Detect real oscillation with subsequences
        instruction: |
          Oscillation becomes divergence when different subsequences approach different values.

          $$
          a_n=(-1)^n\frac{n+2}{n}
          $$
        type: multipleChoice
        prompt: What happens?
        choices:
          - id: a
            text: It diverges because even and odd subsequences approach $1$ and $-1$.
          - id: b
            text: It converges to $0$ because of $(-1)^n$.
          - id: c
            text: It converges to $1$ because $\frac{n+2}{n}\to 1$.
          - id: d
            text: It diverges to infinity.
        answer:
          choiceId: a
        explanation: |
          The magnitude approaches $1$, not $0$. The sign alternates, so the sequence keeps jumping between values near $1$ and $-1$.
      - id: sequence-limit-tools-step-005
        title: Rationalize an infinity-minus-infinity form
        instruction: |
          Differences of large square-root expressions often need a conjugate.

          $$
          a_n=\sqrt{n^2+6n}-n
          $$
        type: multipleChoice
        prompt: Which transformation reveals the limit?
        choices:
          - id: a
            text: '$\sqrt{n^2+6n}-n=\frac{6n}{\sqrt{n^2+6n}+n}\to 3$'
          - id: b
            text: '$\sqrt{n^2+6n}-n\to 0$ because the $n^2$ terms cancel'
          - id: c
            text: '$\sqrt{n^2+6n}-n\to\infty$ because both pieces grow'
          - id: d
            text: '$\sqrt{n^2+6n}-n$ diverges by oscillation'
        answer:
          choiceId: a
        explanation: |
          The conjugate turns the expression into a ratio:

          $$
          \frac{6n}{\sqrt{n^2+6n}+n}
          =
          \frac{6}{\sqrt{1+6/n}+1}\to 3.
          $$
      - id: sequence-limit-tools-step-006
        title: Recognize the exponential limit
        instruction: |
          Expressions like $\left(1+\frac{c}{n}\right)^n$ are neither polynomial nor geometric in the ordinary sense.

          $$
          a_n=\left(1+\frac{5}{n}\right)^n
          $$
        type: multipleChoice
        prompt: What is the limit?
        choices:
          - id: a
            text: '$e^5$'
          - id: b
            text: '$5$'
          - id: c
            text: '$0$'
          - id: d
            text: The sequence diverges.
        answer:
          choiceId: a
        explanation: |
          The standard limit is:

          $$
          \left(1+\frac{c}{n}\right)^n\to e^c.
          $$

          Here $c=5$.
      - id: sequence-limit-tools-step-007
        title: Use logarithms for nth roots
        instruction: |
          Nth roots are often easier after taking a logarithm.

          $$
          a_n=n^{1/n}
          $$
        type: multipleChoice
        prompt: Which reasoning is correct?
        choices:
          - id: a
            text: 'Take logs: $\ln(a_n)=\frac{\ln n}{n}\to 0$, so $a_n\to 1$.'
          - id: b
            text: Since $n$ grows, $n^{1/n}\to\infty$.
          - id: c
            text: Since the exponent goes to $0$, $n^{1/n}\to 0$.
          - id: d
            text: The sequence diverges by oscillation.
        answer:
          choiceId: a
        explanation: |
          The exponent tends to $0$, but the base tends to infinity, so this is not direct substitution. Logs make the competition visible.
      - id: sequence-limit-tools-step-008
        title: Compare growth rates
        instruction: |
          Some limits are best recognized by knowing the growth hierarchy:

          $$
          \ln n \ll n^p \ll b^n \ll n!
          $$

          for $p>0$ and $b>1$.

          $$
          a_n=\frac{n^4}{2^n}
          $$
        type: multipleChoice
        prompt: What happens?
        choices:
          - id: a
            text: It converges to $0$ because exponentials beat polynomials.
          - id: b
            text: It diverges because $n^4$ grows.
          - id: c
            text: It converges to $4$.
          - id: d
            text: It diverges by oscillation.
        answer:
          choiceId: a
        explanation: |
          The denominator grows exponentially while the numerator grows polynomially. The ratio goes to $0$.
      - id: sequence-limit-tools-step-009
        title: Use monotone bounded convergence
        instruction: |
          Some recursively defined sequences do not give their limit immediately. You first prove the sequence is trapped and moving one direction.

          $$
          a_1=1,\qquad a_{n+1}=\frac{a_n+8}{3}
          $$
        type: multipleChoice
        prompt: If the sequence is shown increasing and bounded above, what limit does it approach?
        choices:
          - id: a
            text: '$4$'
          - id: b
            text: '$8$'
          - id: c
            text: '$\frac83$'
          - id: d
            text: It must diverge.
        answer:
          choiceId: a
        explanation: |
          If $a_n\to L$, then

          $$
          L=\frac{L+8}{3}.
          $$

          Solving gives $3L=L+8$, so $L=4$. The monotone-bounded proof justifies that the limit exists.
      - id: sequence-limit-tools-step-010
        title: Interpret a long finite sum as a Riemann sum
        instruction: |
          A sequence can itself be a sum whose number of terms changes with $n$.

          $$
          a_n=\frac1n\sum_{k=1}^{n}\frac{1}{1+k/n}
          $$
        type: multipleChoice
        prompt: What does this converge to?
        choices:
          - id: a
            text: '$\int_0^1\frac{1}{1+x}\,dx=\ln 2$'
          - id: b
            text: '$0$, because each term has a factor $\frac1n$'
          - id: c
            text: '$1$, because there are $n$ terms'
          - id: d
            text: The sequence diverges.
        answer:
          choiceId: a
        explanation: |
          This is a right-endpoint Riemann sum for $f(x)=\frac1{1+x}$ on $[0,1]$. The limit is $\ln 2$.
