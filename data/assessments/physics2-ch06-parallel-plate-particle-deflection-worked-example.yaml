id: physics2-ch06-parallel-plate-particle-deflection-worked-example
title: "Gauss's Law in Action: Field, Force, and Particle Deflection in a Capacitor"
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-gauss-law
modeDefault: practice
randomizeQuestions: false
questions: []
workedExamples:
- id: ppd-we01
  title: "Part A — Vertical Acceleration of the Particle"
  problem: |
    **Setup:** A parallel-plate capacitor has square plates of side $L$.
    The top plate carries charge $+Q$ and the bottom plate carries charge $-Q$.
    A particle of mass $m$ and positive charge $+q$ enters horizontally
    between the plates with speed $v$.

    The goal of **Part A** is to find the particle's vertical acceleration $a_y$.

    $$
    \text{Chain:} \quad Q \;\to\; \sigma \;\to\; E \;\to\; F_E \;\to\; a_y
    $$
  media:
  - type: image
    src: /media/physics/physics2/capacitor-particle-deflection.jpg
    alt: >
      Diagram of a parallel-plate capacitor. Top plate labeled +Q with plus signs,
      bottom plate labeled -Q with minus signs. Downward electric-field arrows labeled E
      fill the gap. A positive charge +q enters from the left moving rightward with
      velocity v. Its curved trajectory bends downward toward the negative plate.
      Plate length L and vertical deflection delta-y are labeled.
    caption: >
      The electric field points from +Q (top) to −Q (bottom), so it is directed
      downward. A positive charge entering horizontally is pushed downward by the
      electric force F_E = qE, producing a downward acceleration a_y.
  steps:
  - id: ppd-we01-s1
    title: "Step 1 — Which direction does the electric field point?"
    instruction: |
      Before doing any algebra, get the physics straight: electric field lines always
      run from positive charge toward negative charge.

      Ask yourself: Which plate is on top, and which is on the bottom?
      Then decide which way the field arrows point between the plates.
    hint: 'Field lines leave $+$ surfaces and arrive at $-$ surfaces.'
    type: multipleChoice
    prompt: |
      The top plate is $+Q$ and the bottom plate is $-Q$.
      Which statement correctly describes the electric field between the plates?
    choices:
    - id: a
      text: 'The field points **downward** (from $+Q$ top plate toward $-Q$ bottom plate).'
    - id: b
      text: 'The field points **upward** (from $-Q$ bottom plate toward $+Q$ top plate).'
      issueSignals:
      - id: physics2-field-direction-sign-reversal
        domains: [physics-2]
    - id: c
      text: 'The field is zero between ideal parallel plates because the two charges cancel.'
      issueSignals:
      - id: physics2-field-cancellation-misconception
        domains: [physics-2]
    - id: d
      text: 'The field points horizontally (parallel to the plates) because the charge enters horizontally.'
      issueSignals:
      - id: physics2-field-direction-velocity-confusion
        domains: [physics-2]
    answer: { choiceId: a }
    explanation: |
      Solution: The field points **downward**, from the positive top plate to the negative bottom plate.

      Why it works: Electric field lines begin on positive charge and end on negative charge.
      The top plate is the source (+Q) and the bottom plate is the sink (-Q),
      so every field arrow in the gap is directed straight down.

      Why the other choices fail:
      Choice b reverses the rule: field lines go from + to -, not the other way.
      Choice c confuses the superposition result: the fields from the two plates add between
      the plates (both point downward there) and cancel outside the plates.
      Choice d confuses the direction of the particle velocity with the direction of the field.
      The field is determined by the plate charges, not by how the particle moves.

  - id: ppd-we01-s2
    title: "Step 2 — Surface charge density sigma"
    instruction: |
      To use Gauss's law we need the surface charge density sigma,
      which is simply how much charge is spread per unit area of plate.

      The plates are square with side length L, so the plate area is A = L^2.
    hint: 'sigma = Q/A and A = L^2 for a square plate of side L.'
    type: multipleChoice
    prompt: |
      The top plate carries charge $+Q$ and has area $A = L^2$.
      Which expression gives the surface charge density $\sigma$?
    choices:
    - id: a
      text: '$\sigma = \dfrac{Q}{L^2}$'
    - id: b
      text: '$\sigma = \dfrac{Q}{L}$'
      issueSignals:
      - id: physics2-area-dimension-error
        domains: [physics-2]
    - id: c
      text: '$\sigma = \dfrac{Q}{4\pi L^2}$'
      issueSignals:
      - id: physics2-spherical-area-confusion
        domains: [physics-2]
    - id: d
      text: '$\sigma = QL^2$'
      issueSignals:
      - id: physics2-density-inversion-error
        domains: [physics-2]
    answer: { choiceId: a }
    explanation: |
      Solution: sigma = Q / L^2.

      Why it works: Surface charge density is charge per unit area.
      A square plate of side L has area L x L = L^2,
      so dividing total charge Q by L^2 gives charge per square meter.

      Why the other choices fail:
      Choice b divides by L instead of L^2 — this gives units of C/m, not C/m^2.
      Choice c uses the formula for the surface area of a sphere (4 pi r^2),
      which does not apply to a flat rectangular plate.
      Choice d multiplies instead of divides, making sigma grow with plate size,
      which is the opposite of what spreading charge over a larger area does.

  - id: ppd-we01-s3
    title: "Step 3 — Electric field magnitude from Gauss's Law"
    instruction: |
      For an ideal parallel-plate capacitor, Gauss's law gives the field between the plates as

        E = sigma / epsilon_0

      Now substitute sigma = Q / L^2 from Step 2.
    hint: 'Substitute sigma = Q/L^2 directly into E = sigma/epsilon_0.'
    type: multipleChoice
    prompt: |
      Using $\sigma = Q/L^2$, which expression for the field magnitude $E$ between the plates is correct?
    choices:
    - id: a
      text: '$E = \dfrac{Q}{L^2 \epsilon_0}$'
    - id: b
      text: '$E = \dfrac{Q}{2L^2 \epsilon_0}$'
      issueSignals:
      - id: physics2-single-sheet-factor-two-error
        domains: [physics-2]
    - id: c
      text: '$E = \dfrac{Q \epsilon_0}{L^2}$'
      issueSignals:
      - id: physics2-epsilon-inversion-error
        domains: [physics-2]
    - id: d
      text: '$E = \dfrac{Q}{4\pi\epsilon_0 L^2}$'
      issueSignals:
      - id: physics2-point-charge-formula-confusion
        domains: [physics-2]
    answer: { choiceId: a }
    explanation: |
      Solution: E = Q / (L^2 * epsilon_0).

      Why it works: Start from E = sigma/epsilon_0 and replace sigma with Q/L^2.

        E = sigma / epsilon_0 = (Q/L^2) / epsilon_0 = Q / (L^2 * epsilon_0)

      Why the other choices fail:
      Choice b uses E = sigma/(2*epsilon_0), which is the field from a single infinite sheet
      considered in isolation. For a parallel-plate capacitor the two sheets' fields add
      between the plates, giving sigma/epsilon_0 (no extra factor of 2 in the denominator).
      Choice c places epsilon_0 in the numerator. epsilon_0 always appears in the
      denominator when relating charge to field strength.
      Choice d uses the Coulomb point-charge formula Q/(4*pi*epsilon_0*r^2).
      That formula applies to a point charge, not to a uniform sheet of charge.

  - id: ppd-we01-s4
    title: "Step 4 — Vertical acceleration (Newton's 2nd Law)"
    instruction: |
      Now apply Newton's second law in the vertical direction.
      The only vertical force on the particle is the electric force F_E = qE, so

        a_y = F_E / m = qE / m

      Substitute the expression for E from Step 3.
    hint: 'Replace E with Q/(L^2*epsilon_0) in a_y = qE/m.'
    type: multipleChoice
    prompt: |
      After substituting the field from Step 3, which expression for $a_y$ is correct?
    choices:
    - id: a
      text: '$a_y = \dfrac{Qq}{L^2 \epsilon_0 m}$'
    - id: b
      text: '$a_y = \dfrac{Qq}{L^2 \epsilon_0 m^2}$'
      issueSignals:
      - id: physics2-mass-squared-error
        domains: [physics-2]
    - id: c
      text: '$a_y = \dfrac{Q}{L^2 \epsilon_0 m}$'
      issueSignals:
      - id: physics2-particle-charge-omission
        domains: [physics-2]
    - id: d
      text: '$a_y = \dfrac{Qq\epsilon_0}{L^2 m}$'
      issueSignals:
      - id: physics2-epsilon-inversion-error
        domains: [physics-2]
    answer: { choiceId: a }
    explanation: |
      Solution: a_y = Qq / (L^2 * epsilon_0 * m).

      Why it works: Chain the three substitutions in order:

        a_y = qE/m = (q/m) * Q/(L^2*epsilon_0) = Qq / (L^2 * epsilon_0 * m)

      The conceptual chain is:
      plate charge Q -> surface density sigma -> field E -> force F_E = qE -> acceleration a_y.

      Why the other choices fail:
      Choice b squares m. Newton's law divides force by m once, not twice.
      Choice c omits the particle charge q. The electric force is F_E = qE,
      so a particle with more charge feels a larger force and gains more acceleration.
      Choice d puts epsilon_0 in the numerator. epsilon_0 appears in the denominator
      whenever it relates charge to field (from E = sigma/epsilon_0).

- id: ppd-we02
  title: "Part B — Vertical Deflection While Crossing the Capacitor"
  problem: |
    Using the acceleration a_y = Eq/m from Part A, find the vertical deflection
    delta_y of the particle as it travels the full length L of the capacitor
    at horizontal speed v.

      Chain: a_y -> t -> delta_y
  media:
  - type: image
    src: /media/physics/physics2/capacitor-particle-deflection.jpg
    alt: >
      Diagram of a parallel-plate capacitor. Top plate labeled +Q, bottom plate labeled -Q.
      Downward field arrows labeled E fill the gap. A positive charge +q enters from the
      left at speed v, follows a curved trajectory, and exits at the right with vertical
      deflection delta-y. Plate length L is labeled on the horizontal axis.
    caption: >
      The horizontal speed v is unchanged (no horizontal force), so the time inside
      the capacitor is t = L/v. The vertical displacement follows from kinematics
      with zero initial vertical velocity.
  steps:
  - id: ppd-we02-s1
    title: "Step 5 — Time spent inside the capacitor"
    instruction: |
      There is no horizontal force on the particle (the electric field is vertical).
      So the particle's horizontal speed v stays constant throughout its trip.

      It must cover the horizontal plate length L at constant speed v.
    hint: 'Use distance = speed * time, then solve for t.'
    type: multipleChoice
    prompt: |
      The particle crosses the full plate length $L$ horizontally at constant speed $v$
      with no horizontal acceleration.
      How long does the particle spend between the plates?
    choices:
    - id: a
      text: '$t = \dfrac{L}{v}$'
    - id: b
      text: '$t = \dfrac{v}{L}$'
      issueSignals:
      - id: physics2-kinematics-inversion-error
        domains: [physics-2]
    - id: c
      text: '$t = \dfrac{L}{a_y}$'
      issueSignals:
      - id: physics2-kinematics-dimension-substitution-error
        domains: [physics-2]
    - id: d
      text: '$t = Lv$'
      issueSignals:
      - id: physics2-kinematics-product-error
        domains: [physics-2]
    answer: { choiceId: a }
    explanation: |
      Solution: t = L / v.

      Why it works: With no horizontal force, horizontal motion is uniform.
      Applying d = v*t and solving for t gives t = L/v.

      Why the other choices fail:
      Choice b inverts the fraction. v/L has units of 1/s (frequency), not seconds.
      Choice c uses a_y (vertical acceleration) in a horizontal kinematics equation.
      Acceleration is vertical; it does not set the horizontal transit time.
      Choice d multiplies L and v, giving units of m^2/s, not seconds.

  - id: ppd-we02-s2
    title: "Step 6 — Kinematic equation for vertical displacement"
    instruction: |
      The particle starts with zero vertical velocity (v_iy = 0) because it enters
      purely horizontally. Constant-acceleration kinematics in the vertical direction gives:

        delta_y = v_iy * t + (1/2) * a_y * t^2 = (1/2) * a_y * t^2

      Now substitute a_y = Eq/m and t = L/v from the previous steps.
    hint: 'Square t = L/v to get L^2/v^2, then multiply by (1/2)*(Eq/m).'
    type: multipleChoice
    prompt: |
      Using $a_y = Eq/m$ and $t = L/v$, which expression for the vertical deflection $\Delta y$ is correct?
    choices:
    - id: a
      text: '$\Delta y = \dfrac{EqL^2}{2mv^2}$'
    - id: b
      text: '$\Delta y = \dfrac{EqL}{2mv}$'
      issueSignals:
      - id: physics2-kinematics-t-squared-error
        domains: [physics-2]
    - id: c
      text: '$\Delta y = \dfrac{EqL^2}{mv^2}$'
      issueSignals:
      - id: physics2-kinematics-half-factor-omission
        domains: [physics-2]
    - id: d
      text: '$\Delta y = \dfrac{Eqv^2}{2mL^2}$'
      issueSignals:
      - id: physics2-kinematics-inversion-error
        domains: [physics-2]
    answer: { choiceId: a }
    explanation: |
      Solution: delta_y = EqL^2 / (2mv^2).

      Why it works: Start from delta_y = (1/2)*a_y*t^2 and substitute step by step:

        delta_y = (1/2) * (Eq/m) * (L/v)^2
                = (1/2) * (Eq/m) * (L^2/v^2)
                = EqL^2 / (2mv^2)

      Why the other choices fail:
      Choice b uses t instead of t^2. Kinematics with constant acceleration always involves
      t^2 for displacement. Using t instead of t^2 is the most common algebra slip here.
      Choice c drops the factor of 1/2. The 1/2 comes from integrating constant acceleration:
      the area under a velocity-vs-time triangle is (1/2)*base*height = (1/2)*t*(a_y*t).
      Choice d inverts L^2/v^2 to v^2/L^2. Faster speed and shorter plate both reduce
      deflection, so v^2 must be in the denominator and L^2 in the numerator.

  - id: ppd-we02-s3
    title: "Step 7 — Physical interpretation: what makes deflection bigger or smaller?"
    instruction: |
      Look at the final answer:

        delta_y = EqL^2 / (2mv^2)

      Each quantity in the formula has a physical story.
      Without doing any new calculation, decide what happens when the horizontal speed doubles.
    hint: |
      Identify which quantities are in the numerator (larger -> more deflection) and which
      are in the denominator (larger -> less deflection).
      Pay special attention to the v^2: speed appears squared.
    type: multipleChoice
    prompt: |
      The particle's horizontal speed $v$ is doubled (everything else stays the same).
      What happens to the vertical deflection $\Delta y$?
    choices:
    - id: a
      text: '$\Delta y$ is reduced to **one-quarter** of its original value.'
    - id: b
      text: '$\Delta y$ is reduced to **one-half** of its original value.'
      issueSignals:
      - id: physics2-quadratic-v-dependence-error
        domains: [physics-2]
    - id: c
      text: '$\Delta y$ is **unchanged** because the particle still crosses the same plate length $L$.'
      issueSignals:
      - id: physics2-speed-deflection-independence-misconception
        domains: [physics-2]
    - id: d
      text: '$\Delta y$ is **doubled** because faster entry means more kinetic energy to deflect.'
      issueSignals:
      - id: physics2-speed-deflection-direct-error
        domains: [physics-2]
    answer: { choiceId: a }
    explanation: |
      Solution: delta_y is reduced to one-quarter of its original value.

      Why it works: Speed enters the formula as v^2 in the denominator.
      If v becomes 2v:

        delta_y_new = EqL^2 / (2m*(2v)^2)
                    = EqL^2 / (2m*4v^2)
                    = (1/4) * EqL^2/(2mv^2)
                    = delta_y / 4

      The physical reason: the faster particle spends only half the time t = L/v inside
      the capacitor, but displacement grows as t^2, so halving the time gives one-quarter
      the deflection.

      Why the other choices fail:
      Choice b treats v as linear (v^1) in the denominator. Because kinematic displacement
      involves t^2 ~ 1/v^2, the actual power is 2, not 1.
      Choice c ignores that a faster particle exits sooner and therefore experiences fewer
      ticks of vertical acceleration.
      Choice d reverses the effect entirely. More speed means less time between the plates
      and less deflection, not more.

