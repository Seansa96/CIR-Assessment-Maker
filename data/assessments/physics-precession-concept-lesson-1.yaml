lesson:
  introduction: This lesson covers the primary definitions and equations governing
    Precession.
  sections:
  - id: sec-1
    title: Defining Precession
    content: The physics of Precession requires a solid understanding of both rotational
      kinematics and dynamics. The core principles mirror linear mechanics but account
      for radial distribution of mass and rotational axes. For example, torque relates
      to angular acceleration via $\tau = I\alpha$.
    media: []
    check:
      id: chk-physics-precession-1
      type: multipleChoice
      prompt: Which of the following best describes a key principle of Precession?
      choices:
      - id: a
        text: It depends strictly on linear mass alone.
      - id: b
        text: It involves the relationship between forces, torques, and mass distribution.
      - id: c
        text: It is independent of the axis of rotation.
      answer:
        choiceId: b
      explanation: Rotational mechanics always heavily relies on mass distribution
        and torques.
  - id: sec-2
    title: Mathematical Formulas
    content: The mathematical framework often relies on cross products and integrals.
      Ensuring consistent units (radians for angular measures) is critical. $L = I\omega$
      and $\tau = \vec{r} \times \vec{F}$ are foundational.
    media: []
    check:
      id: chk-physics-precession-2
      type: multipleChoice
      prompt: What unit is essential when using rotational kinematic formulas?
      choices:
      - id: a
        text: Degrees
      - id: b
        text: Radians
      - id: c
        text: Revolutions
      answer:
        choiceId: b
      explanation: Radians are the natural mathematical unit tying arc length to radius.
  - { id: p1-3, title: Torque changes direction, content: 'A torque perpendicular to angular momentum turns its direction rather than simply changing spin rate.', check: { id: p1c3, type: multipleChoice, prompt: 'For a spinning gyroscope, a perpendicular torque primarily changes:', choices: [{ id: a, text: 'angular-momentum direction' }, { id: b, text: 'mass' }], answer: { choiceId: a }, explanation: 'Solution: It changes direction.\n\nWhy it works: $d\vec L$ points with torque.\n\nWhy the other choices fail: Torque does not change mass.' } }
  - { id: p1-4, title: Precession, content: 'Precession is slow rotation of the spin axis around another direction.', check: { id: p1c4, type: multipleChoice, prompt: 'Gyroscopic precession describes motion of the:', choices: [{ id: a, text: 'spin axis' }, { id: b, text: 'object''s mass value' }], answer: { choiceId: a }, explanation: 'Solution: It describes spin-axis motion.\n\nWhy it works: Torque causes angular momentum to turn.\n\nWhy the other choices fail: Mass is not a rotational direction.' } }
  - { id: p1-5, title: Precession rate, content: 'For slow precession, $\Omega=\tau/L$.', check: { id: p1c5, type: multipleChoice, prompt: 'At fixed torque, larger spin angular momentum gives precession that is:', choices: [{ id: a, text: 'slower' }, { id: b, text: 'faster' }], answer: { choiceId: a }, explanation: 'Solution: It is slower.\n\nWhy it works: $\Omega=\tau/L$.\n\nWhy the other choices fail: Larger $L$ resists directional change.' } }
  - { id: p1-6, title: Gravity torque, content: 'A supported gyroscope experiences gravity torque about its pivot.', check: { id: p1c6, type: multipleChoice, prompt: 'The torque causing a supported gyroscope to precess commonly comes from:', choices: [{ id: a, text: 'gravity acting at its center of mass' }, { id: b, text: 'zero gravity' }], answer: { choiceId: a }, explanation: 'Solution: It comes from gravity.\n\nWhy it works: Weight has a lever arm about the pivot.\n\nWhy the other choices fail: Without torque, steady precession is not driven.' } }
  - { id: p1-7, title: Right-hand rule, content: 'Use the right-hand rule to predict angular momentum and torque directions.', check: { id: p1c7, type: multipleChoice, prompt: 'The right-hand rule helps determine:', choices: [{ id: a, text: 'vector direction' }, { id: b, text: 'object density' }], answer: { choiceId: a }, explanation: 'Solution: It determines vector direction.\n\nWhy it works: Rotational quantities are vectors.\n\nWhy the other choices fail: Density is scalar.' } }
