- id: q006
  type: multipleChoice
  skills:
  - analyze-monotone-recurrences
  prompt: |
    Let $a_1=1$ and $a_{n+1}=\sqrt{2+a_n}$. What is the limit?
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: |-
      $\sqrt2$
  - id: d
    text: The sequence diverges
  answer:
    choiceId: a
  explanation: |-
    Solution: The sequence increases and remains below two; its limit L satisfies $L=\sqrt{2+L}$, whose compatible nonnegative solution is two. Therefore the answer is $2$.

    Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.

    Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.

    Why the other choices fail: $1$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; $\sqrt2$ conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; The sequence diverges conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.
