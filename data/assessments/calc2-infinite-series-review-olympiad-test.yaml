- id: q001
  type: multipleChoice
  skills:
  - sum-higher-order-telescoping-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{1}{n(n+1)(n+2)}$.
  choices:
  - id: a
    text: $1/4$
  - id: b
    text: $1/2$
  - id: c
    text: $1$
  - id: d
    text: |-
      $\pi^2/12$
  answer:
    choiceId: a
  explanation: |-
    Solution: Write the term as one-half times $[1/(n(n+1))-1/((n+1)(n+2))]$ and telescope. Therefore the answer is $1/4$.

    Why it works: Rewrite the general term so consecutive partial-sum terms cancel. Write $S_N$ explicitly, cancel only terms that occur with opposite signs, and then take $N\to\infty$ to obtain the infinite-series result.

    Common trap: Do not cancel nonadjacent terms by inspection without writing $S_N$; the surviving last term usually depends on $N$ and must be sent to its limit.

    Why the other choices fail: $1/2$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $1$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel; $\pi^2/12$ conflicts with this criterion: Rewrite the general term so consecutive partial-sum terms cancel.
- id: q002
  type: multipleChoice
