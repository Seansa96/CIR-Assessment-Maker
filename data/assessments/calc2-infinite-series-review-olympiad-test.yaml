schemaVersion: 1
id: calc2-infinite-series-review-olympiad-test
title: Infinite Series Comprehensive Review Olympiad Test
assessmentType: test
categoryId: calculus-2
topicId: infinite-series-review
skills:
- Synthesize telescoping, generating functions, asymptotics, and recurrence limits
- Determine radii and endpoint behavior from factorial coefficient growth
- Control approximation errors and justify double-series rearrangements
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - infinite-series-review
  - olympiad
  - synthesis-test
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - sum-higher-order-telescoping-series
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{1}{n(n+1)(n+2)}$.
  choices:
  - id: a
    text: $1/4$
  - id: b
    text: $1/2$
  - id: c
    text: $1$
  - id: d
    text: |-
      $\pi^2/12$
  answer:
    choiceId: a
  explanation: Write the term as one-half times $[1/(n(n+1))-1/((n+1)(n+2))]$ and telescope.
- id: q002
  type: multipleChoice
  skills:
  - derive-weighted-geometric-sums
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}n/2^n$.
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: $4$
  - id: d
    text: $3/2$
  answer:
    choiceId: a
  explanation: |-
    From $\sum nx^n=x/(1-x)^2$, substitute x equals one-half.
- id: q003
  type: multipleChoice
  skills:
  - derive-second-moment-geometric-sums
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}n^2/2^n$.
  choices:
  - id: a
    text: $6$
  - id: b
    text: $4$
  - id: c
    text: $8$
  - id: d
    text: $2$
  answer:
    choiceId: a
  explanation: |-
    Use $\sum n^2x^n=x(1+x)/(1-x)^3$ and set x equal to one-half.
- id: q004
  type: multipleChoice
  skills:
  - use-small-angle-asymptotics
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}\sin(1/n)$.
  choices:
  - id: a
    text: It diverges by limit comparison with $1/n$.
  - id: b
    text: It converges by comparison with $1/n^2$.
  - id: c
    text: It converges conditionally.
  - id: d
    text: It alternates.
  answer:
    choiceId: a
  explanation: |-
    The ratio $\sin(1/n)/(1/n)$ tends to one, so the positive series has harmonic behavior.
- id: q005
  type: multipleChoice
  skills:
  - use-quadratic-small-angle-asymptotics
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}[1-\cos(1/n)]$.
  choices:
  - id: a
    text: It converges by limit comparison with $1/n^2$.
  - id: b
    text: It diverges by comparison with $1/n$.
  - id: c
    text: It converges conditionally.
  - id: d
    text: Its terms approach one.
  answer:
    choiceId: a
  explanation: |-
    Since $1-\cos u\sim u^2/2$, the terms are asymptotic to $1/(2n^2)$.
- id: q006
  type: multipleChoice
  skills:
  - analyze-monotone-recurrences
  prompt: |
    Let $a_1=1$ and $a_{n+1}=\sqrt{2+a_n}$. What is the limit?
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: |-
      $\sqrt2$
  - id: d
    text: The sequence diverges
  answer:
    choiceId: a
  explanation: |-
    The sequence increases and remains below two; its limit L satisfies $L=\sqrt{2+L}$, whose compatible nonnegative solution is two.
- id: q007
  type: multipleChoice
  skills:
  - compute-limsup-and-liminf
  prompt: |
    For $a_n=(-1)^n+1/n$, what are $\limsup a_n$ and $\liminf a_n$?
  choices:
  - id: a
    text: $1$ and $-1$
  - id: b
    text: $0$ and $0$
  - id: c
    text: $1$ and $0$
  - id: d
    text: |-
      $\infty$ and $-\infty$
  answer:
    choiceId: a
  explanation: The even subsequence approaches one and the odd subsequence approaches minus one.
- id: q008
  type: multipleChoice
  skills:
  - find-entire-factorial-ratio-series
  prompt: |
    What is the radius of
    $\displaystyle\sum_{n=0}^{\infty}\frac{n!}{(2n)!}x^n$?
  choices:
  - id: a
    text: |-
      $\infty$
  - id: b
    text: $2$
  - id: c
    text: $4$
  - id: d
    text: $0$
  answer:
    choiceId: a
  explanation: The ratio of successive coefficient magnitudes is $1/[2(2n+1)]$, so the term ratio tends
    to zero for every fixed x.
- id: q009
  type: multipleChoice
  skills:
  - find-central-binomial-type-radii
  prompt: |
    What is the radius of
    $\displaystyle\sum_{n=0}^{\infty}\frac{(n!)^2}{(2n)!}x^n$?
  choices:
  - id: a
    text: $4$
  - id: b
    text: $1/4$
  - id: c
    text: |-
      $\infty$
  - id: d
    text: $2$
  answer:
    choiceId: a
  explanation: The successive coefficient ratio tends to one-fourth, so the series term ratio tends to
    $|x|/4$.
- id: q010
  type: multipleChoice
  skills:
  - test-binomial-series-boundaries
  prompt: |
    At $x=1$, how does the Maclaurin series for $(1-x)^{-1/2}$
    behave?
  choices:
  - id: a
    text: It diverges, with coefficients of order $n^{-1/2}$.
  - id: b
    text: It converges absolutely.
  - id: c
    text: It converges conditionally.
  - id: d
    text: It terminates.
  answer:
    choiceId: a
  explanation: |-
    The coefficients are $\binom{2n}{n}/4^n\sim1/\sqrt{\pi n}$, whose positive sum diverges.
- id: q011
  type: multipleChoice
  skills:
  - derive-third-moment-generating-series
  prompt: |
    For $|x|<1$, which expression equals
    $\displaystyle\sum_{n=1}^{\infty}n^3x^n$?
  choices:
  - id: a
    text: $x(1+4x+x^2)/(1-x)^4$
  - id: b
    text: $x(1+x)/(1-x)^3$
  - id: c
    text: $x/(1-x)^2$
  - id: d
    text: $1/(1-x)^4$
  answer:
    choiceId: a
  explanation: |-
    Apply $x\,d/dx$ to the second-moment identity and combine terms over the fourth power denominator.
- id: q012
  type: multipleChoice
  skills:
  - evaluate-cancellation-limits-with-series
  prompt: |
    Evaluate
    $\displaystyle\lim_{x\to0}\frac{e^x\cos x-1-x}{x^2}$.
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1/2$
  - id: c
    text: $-1/2$
  - id: d
    text: $1$
  answer:
    choiceId: a
  explanation: |-
    Multiplication gives $e^x\cos x=1+x+0x^2-x^3/3+\cdots$, so the numerator begins beyond degree two.
- id: q013
  type: multipleChoice
  skills:
  - bound-gregory-series-errors
  prompt: |
    How many terms of
    $\pi/4=1-1/3+1/5-\cdots$ guarantee error less than $10^{-3}$?
  choices:
  - id: a
    text: $500$
  - id: b
    text: $499$
  - id: c
    text: $1000$
  - id: d
    text: $100$
  answer:
    choiceId: a
  explanation: With N terms the first omitted denominator is $2N+1$; requiring its reciprocal below one-thousandth
    first succeeds at N equals five hundred.
- id: q014
  type: multipleChoice
  skills:
  - bound-zeta-tails
  prompt: |
    If $S_N=\sum_{n=1}^{N}1/n^2$, which upper bound holds for
    $\pi^2/6-S_N$?
  choices:
  - id: a
    text: $1/N$
  - id: b
    text: $1/(N+1)^2$
  - id: c
    text: $1/N^2$
  - id: d
    text: $1/(2N)$
  answer:
    choiceId: a
  explanation: |-
    The integral-test upper remainder is $\int_N^\infty x^{-2}\,dx=1/N$.
- id: q015
  type: multipleChoice
  skills:
  - rearrange-nonnegative-double-series
  prompt: |
    Evaluate
    $\displaystyle\sum_{m=0}^{\infty}\sum_{n=0}^{\infty}2^{-(m+n)}$.
  choices:
  - id: a
    text: $4$
  - id: b
    text: $2$
  - id: c
    text: $1$
  - id: d
    text: It diverges
  answer:
    choiceId: a
  explanation: |-
    Nonnegativity permits factorization into two copies of $\sum_{k\ge0}2^{-k}=2$, whose product is four.
attemptQuestionCount: 15
