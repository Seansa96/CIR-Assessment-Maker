lesson:
  introduction: |-
    Right triangles are the most useful triangles in mathematics, serving as the foundation for trigonometry and coordinate geometry. The most famous relationship involving right triangles is the Pythagorean Theorem.
  sections:
  - id: sec-pythagorean
    title: The Pythagorean Theorem
    required: true
    content: |-
      In a right triangle, the side opposite the $90^\circ$ angle is the longest side, called the **hypotenuse**. The other two sides that form the right angle are called the **legs**.
      
      The **Pythagorean Theorem** states that in any right triangle, the square of the length of the hypotenuse is equal to the sum of the squares of the lengths of the legs.
      
      If the legs have lengths $a$ and $b$, and the hypotenuse has length $c$, then:
      $$a^2 + b^2 = c^2$$
      
      If you know any two sides of a right triangle, you can always find the third! Note: This theorem *only* works for right triangles.

  - id: sec-converse
    title: The Converse of the Pythagorean Theorem
    required: true
    content: |-
      The **Converse** of the Pythagorean Theorem allows us to determine if a triangle is a right triangle just by looking at its side lengths.
      
      If a triangle has side lengths $a, b,$ and $c$ (where $c$ is the longest side), and if $a^2 + b^2 = c^2$, then the triangle **must** be a right triangle.
      
      What if $a^2 + b^2 \neq c^2$?
      - If $c^2 < a^2 + b^2$, then the triangle is **acute** (the "hypotenuse" shrunk).
      - If $c^2 > a^2 + b^2$, then the triangle is **obtuse** (the "hypotenuse" stretched).

questions:
- id: q-geom-rt1-1
  title: Concept Check - Finding the Hypotenuse
  prompt: |-
    A right triangle has legs of length $3$ and $4$. What is the length of the hypotenuse?
  type: numericResponse
  answer:
    numericValue: 5
    tolerance: 0
  explanation: |-
    Using the Pythagorean Theorem: $a^2 + b^2 = c^2$.
    $$3^2 + 4^2 = c^2$$
    $$9 + 16 = 25$$
    $$c^2 = 25 \implies c = 5$$
    This is a famous set of integer lengths called a **Pythagorean Triple** (3-4-5).
  skills:
  - geometry-right-triangles

- id: q-geom-rt1-2
  title: Concept Check - The Converse
  prompt: |-
    A triangle has side lengths $5, 12,$ and $14$. Classify this triangle as acute, right, or obtuse.
  type: multipleChoice
  choices:
  - id: c1
    text: Acute
  - id: c2
    text: Right
  - id: c3
    text: Obtuse
  answer:
    choiceId: c3
  explanation: |-
    Let $c$ be the longest side, so $c = 14$. The other two sides are $a = 5$ and $b = 12$.
    Calculate $c^2$: $14^2 = 196$.
    Calculate $a^2 + b^2$: $5^2 + 12^2 = 25 + 144 = 169$.
    Because $196 > 169$ ($c^2 > a^2 + b^2$), the longest side is "too long" to form a right angle, making the triangle **obtuse**.
  skills:
  - geometry-right-triangles
