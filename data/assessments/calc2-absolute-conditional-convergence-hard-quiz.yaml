- id: q001
  type: freeResponse
  prompt: Classify $\sum_{n=2}^\infty(-1)^{n-1}\frac{\ln n}{n}$ as absolutely convergent, conditionally convergent, or divergent. Justify both the signed and absolute conclusions.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: First establish eventual decrease of $\ln x/x$ and its limit of zero. Alternation then proves convergence, while the integral of $\ln x/x$ grows without bound, so taking absolute values destroys convergence.


    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.


    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.
