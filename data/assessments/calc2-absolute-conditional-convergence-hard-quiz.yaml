- id: q003
  type: freeResponse
  prompt: Suppose $\sum a_n$ converges absolutely and $|c_n|\le5$. Prove that $\sum c_na_n$ converges absolutely, then explain why no sign pattern of $c_n$ matters.
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: selfCheck
    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: Move immediately to absolute values, where the varying signs are irrelevant. The uniform bound on $c_n$ supplies a convergent comparison series, so the product series is absolutely—and therefore ordinarily—convergent.


    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.


    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.
