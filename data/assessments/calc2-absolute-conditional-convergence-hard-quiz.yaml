questions:
- id: q001
  type: freeResponse
  prompt: 'Classify $\sum_{n=2}^\infty(-1)^{n-1}\frac{\ln n}{n}$ as absolutely convergent, conditionally convergent, or divergent. Justify both the signed and absolute conclusions.'
  answer: { gradingMode: selfCheck, checkModel: 'Conditionally convergent. The magnitudes decrease eventually to 0, so the alternating-series test applies; $\sum \ln n/n$ diverges by the integral test.' }
  explanation: 'First establish eventual decrease of $\ln x/x$ and its limit of zero. Alternation then proves convergence, while the integral of $\ln x/x$ grows without bound, so taking absolute values destroys convergence.'
  difficultyDimensions: [auxiliaryTechnique, domainCondition, proofJustification]
  difficultyEvidence: Requires an eventual monotonicity check, an alternating-series argument, and a separate improper-integral argument for absolute divergence.
  prerequisiteObjectiveIds: [calc2-integral-test, calc2-alternating-series-test]
- id: q002
  type: freeResponse
  prompt: 'For real $p$, classify $\sum_{n=1}^\infty(-1)^{n-1}\frac{n^p}{n^2+3n}$ as absolutely convergent, conditionally convergent, or divergent.'
  answer: { gradingMode: selfCheck, checkModel: 'Absolutely convergent for $p<1$; conditionally convergent for $1\le p<2$; divergent for $p\ge2$.' }
  explanation: 'Compare the magnitude with $n^{p-2}$. The p-series threshold gives absolute convergence for $p<1$; for $1\le p<2$ the magnitudes still decrease to zero and alternate; at $p\ge2$ the terms fail to approach zero.'
  difficultyDimensions: [simplification, parameterThreshold, domainCondition]
  difficultyEvidence: Reduces a rational expression to its asymptotic power, partitions the parameter range at two thresholds, and applies the term condition at the endpoint.
  prerequisiteObjectiveIds: [calc2-limit-comparison, calc2-alternating-series-test]
- id: q003
  type: freeResponse
  prompt: 'Suppose $\sum a_n$ converges absolutely and $|c_n|\le5$. Prove that $\sum c_na_n$ converges absolutely, then explain why no sign pattern of $c_n$ matters.'
  answer: { gradingMode: selfCheck, checkModel: '$|c_na_n|\le5|a_n|$; comparison with the convergent series $5\sum|a_n|$ proves absolute convergence.' }
  explanation: 'Move immediately to absolute values, where the varying signs are irrelevant. The uniform bound on $c_n$ supplies a convergent comparison series, so the product series is absolutely—and therefore ordinarily—convergent.'
  difficultyDimensions: [representationTransfer, proofJustification, auxiliaryTechnique]
  difficultyEvidence: Transfers the claim to an absolute-value series, constructs a comparison bound, and invokes the absolute-implies-ordinary convergence theorem.
  prerequisiteObjectiveIds: [calc2-comparison-test, calc2-absolute-convergence]
- id: q004
  type: freeResponse
  prompt: 'Classify $\sum_{n=1}^\infty(-1)^{n-1}(\sqrt{n^2+4n}-n)$. Your justification must identify both the alternating-series behavior and the behavior after absolute values are taken.'
  answer: { gradingMode: selfCheck, checkModel: 'Conditionally convergent. Rationalization gives $4/(\sqrt{n^2+4n}+n)$, which decreases to 0 and is asymptotic to $2/n$.' }
  explanation: 'Rationalizing reveals a positive magnitude with harmonic order rather than treating the radical difference as opaque. That form supports eventual decrease and a zero limit for alternation, but its limit comparison with $1/n$ rules out absolute convergence.'
  difficultyDimensions: [identityConstruction, representationTransfer, proofJustification]
  difficultyEvidence: Creates a conjugate identity, changes to an asymptotic representation, and uses different convergence arguments for the signed and absolute series.
  prerequisiteObjectiveIds: [calc2-limit-comparison, calc2-alternating-series-test]
- id: q005
  type: freeResponse
  prompt: 'Construct a conditionally convergent series $\sum a_n$ for which $\sum a_n^2$ diverges. State both series and prove the two claims.'
  answer: { gradingMode: selfCheck, checkModel: 'Take $a_n=(-1)^{n-1}/\sqrt n$. It converges by the alternating-series test but not absolutely, and $a_n^2=1/n$, whose series diverges.' }
  explanation: 'Choose a magnitude that tends to zero and decreases slowly enough that its square remains harmonic size. Alternation supplies convergence of the original series, while the harmonic series proves both failure of absolute convergence and divergence of the squares.'
  difficultyDimensions: [counterexampleOrConstruction, reverseReasoning, proofJustification]
  difficultyEvidence: Works backward from a desired divergent square series, constructs a signed parent series, and separately proves the required convergence classifications.
  prerequisiteObjectiveIds: [calc2-p-series, calc2-alternating-series-test]
- id: q006
  type: freeResponse
  prompt: 'Classify $\sum_{n=1}^\infty\frac{\sin(n\pi/2)}{\sqrt n}$. Rewrite it as a familiar signed subseries before deciding whether its convergence is absolute or conditional.'
  answer: { gradingMode: selfCheck, checkModel: 'Conditionally convergent. Even terms vanish and odd terms form $1-1/\sqrt3+1/\sqrt5-\cdots$; its absolute series is a divergent p-series subseries with exponent $1/2$.' }
  explanation: 'The sine factor is a periodic selector, not an obstacle. Separating even and odd indices produces an alternating decreasing sequence tending to zero, whereas the surviving absolute terms have the same divergent half-power behavior.'
  difficultyDimensions: [representationTransfer, simplification, auxiliaryTechnique]
  difficultyEvidence: Converts a trigonometric periodic pattern into an indexed subseries, simplifies away zero terms, and applies alternating and p-series reasoning.
  prerequisiteObjectiveIds: [calc2-alternating-series-test, calc2-p-series]
- id: q007
  type: freeResponse
  prompt: 'Use the Ratio Test to classify $\sum_{n=1}^\infty(-1)^n\frac{n!}{n^n}$. Explain why the alternating sign is not the decisive feature.'
  answer: { gradingMode: selfCheck, checkModel: 'Absolutely convergent, since $|a_{n+1}/a_n|=(n/(n+1))^n\to e^{-1}<1$.' }
  explanation: 'Apply the ratio test to magnitudes. The limiting ratio is below one, which proves absolute convergence before any signed-series theorem is needed; the alternating factor therefore cannot change the classification.'
  difficultyDimensions: [auxiliaryTechnique, representationTransfer, proofJustification]
  difficultyEvidence: Transfers to magnitudes, derives a non-obvious successive-term ratio, and uses a limiting exponential form to justify a Ratio Test conclusion.
  prerequisiteObjectiveIds: [calc2-ratio-test, calc1-exponential-limits]
- id: q008
  type: freeResponse
  prompt: 'Let $\sum a_n$ converge conditionally and let $\sum b_n$ converge absolutely. Prove that $\sum(a_n+b_n)$ is conditionally convergent.'
  answer: { gradingMode: selfCheck, checkModel: 'It converges by linearity. If it converged absolutely, subtracting the absolutely convergent $\sum b_n$ would make $\sum a_n$ absolutely convergent, contradicting the hypothesis.' }
  explanation: 'First use ordinary convergence to establish that the sum series exists. Then argue by contradiction with closure of absolutely convergent series under subtraction; this is what rules out an absolute classification for the new series.'
  difficultyDimensions: [proofJustification, reverseReasoning, representationTransfer]
  difficultyEvidence: Combines two convergence modes, reasons through a contradiction, and transfers absolute convergence through an algebraic difference of series.
  prerequisiteObjectiveIds: [calc2-absolute-convergence]
- id: q009
  type: freeResponse
  prompt: 'The alternating harmonic series is grouped as $(a_1+a_2)+(a_3+a_4)+\cdots$, with $a_n=(-1)^{n-1}/n$. Prove that the grouped series has the original sum, then explain why this does not license an arbitrary rearrangement.'
  answer: { gradingMode: selfCheck, checkModel: 'The grouped partial sums are the even-index partial sums of the original convergent series, hence have the same limit. Grouping preserves order; arbitrary rearrangement does not.' }
  explanation: 'Identify the block-boundary sums as a subsequence of the original partial sums. A convergent sequence and every subsequence share a limit, while a rearrangement changes which finite partial sums occur and is not covered by that argument.'
  difficultyDimensions: [representationTransfer, proofJustification, errorDiagnosis]
  difficultyEvidence: Recasts blocks as a subsequence, proves preservation of a limit, and diagnoses the false transfer from grouping to rearrangement.
  prerequisiteObjectiveIds: [calc1-sequences, calc2-conditional-convergence]
- id: q010
  type: freeResponse
  prompt: 'Find all real $p$ for which $\sum_{n=2}^\infty(-1)^n/[n(\ln n)^p]$ converges, and classify the convergence when it does. Account for the endpoint $p=0$.'
  answer: { gradingMode: selfCheck, checkModel: 'It converges conditionally for $p\le1$ and converges absolutely for $p>1$.' }
  explanation: 'For every real p, the magnitudes $(\ln n)^{-p}/n$ eventually decrease to zero, so alternation gives convergence. The logarithmic integral threshold says that the absolute series converges only for $p>1$, including the conditional endpoint $p=0$.'
  difficultyDimensions: [parameterThreshold, domainCondition, auxiliaryTechnique]
  difficultyEvidence: Requires a logarithmic-series threshold, an eventual monotonicity and limit condition for alternation, and separate treatment of the boundary parameter.
  prerequisiteObjectiveIds: [calc2-integral-test, calc2-alternating-series-test]
