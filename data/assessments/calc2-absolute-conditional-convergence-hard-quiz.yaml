    expectedLatex: 
    equivalenceMode: 
    variables: []
    value: 
    tolerance: 
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >-
    Solution: For every real p, the magnitudes $(\ln n)^{-p}/n$ eventually decrease to zero, so alternation gives convergence. The logarithmic integral threshold says that the absolute series converges only for $p>1$, including the conditional endpoint $p=0$.


    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.


    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.
