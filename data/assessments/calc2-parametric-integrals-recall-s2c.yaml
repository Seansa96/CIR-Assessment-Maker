items:
  - { id: q001, type: cloze, prompt: 'For parametric arc length, integrate the ____ of the velocity vector.', answer: { expected: magnitude, aliases: [speed] }, explanation: 'Solution: Integrate its magnitude, or speed. Why it works: Length is nonnegative distance accumulated along a path. Common trap: Integrating a signed component rate.' }
  - { id: q002, type: typed, prompt: 'State the parametric arc-length integrand.', answer: { expected: 'sqrt x prime squared plus y prime squared', aliases: ['sqrt((dx/dt)^2+(dy/dt)^2)'] }, explanation: 'Solution: The integrand is the square root of x-prime squared plus y-prime squared. Why it works: It is the Euclidean speed magnitude. Common trap: Using dy/dx.' }
  - { id: q003, type: cloze, prompt: 'In a parametric area model, $dx=$ ____ $dt$.', answer: { expected: 'dx dt', aliases: ['dx/dt'] }, explanation: 'Solution: dx equals dx/dt times dt. Why it works: The parameter changes x at rate dx/dt. Common trap: Omitting the derivative.' }
  - { id: q004, type: typed, prompt: 'What path property can accidentally double a directed area integral?', answer: { expected: retracing, aliases: ['tracing twice', 'duplicate traversal'] }, explanation: 'Solution: Retracing or a duplicate traversal doubles directed accumulation. Why it works: The integral follows the path order. Common trap: Looking only at the enclosed locus.' }
  - { id: q005, type: recognition, prompt: 'The arrows show a single arch. What should the bounds include?', media: [{ type: image, src: /media/calculus/parametric-review-trace.svg, alt: Directed arch with endpoints }], choices: [{ id: a, text: 'only the interval that traces this arch once' }, { id: b, text: 'every parameter value in a full period' }], answer: { choiceId: a, expected: 'one trace interval', aliases: ['trace once'] }, explanation: 'Solution: Select only the interval that traces the intended arch once. Why it works: Bounds are part of the path model. Common trap: Adding unrelated repeated sections.' }
