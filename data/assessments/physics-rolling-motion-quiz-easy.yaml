questions:
- id: q1
  type: numericResponse
  prompt: A car tire of radius $0.3 \text{ m}$ is rolling without slipping. If the car moves at $15 \text{ m/s}$, what is the angular velocity of the tire?
  answer:
    value: 50.0
    tolerance: 1.0
  explanation: 'Solution: $v = r\omega \implies \omega = v/r = 15/0.3 = 50 \text{ rad/s}$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
