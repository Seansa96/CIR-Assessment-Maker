- id: q005
  type: freeResponse
  prompt: |-
    A Prove It problem has been changed so that the obvious first method no longer applies directly. Explain how you would decide whether **prove both directions only when needed** is still legal, and name one condition you would check.
  answer:
    expected: |-
      Check whether the structure still contains pigeonhole principle and whether the constraints needed for prove both directions only when needed remain true.
    gradingMode: selfCheck
    keyPoints:
    - Mentions pigeonhole principle.
    - Mentions prove both directions only when needed.
    - Checks a condition or edge case.
  explanation: |-
    The purpose is to test method selection. Related topic: Prove It; specific technique: prove both directions only when needed.
  skills:
  - aops-proof-methods
