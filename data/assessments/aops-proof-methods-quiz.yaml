questions:
- id: q001
  type: multipleChoice
  prompt: |-
    An original Prove It problem variant is designed to test **proof vocabulary**. Which solution strategy is most appropriate?
  choices:
  - id: a
    text: Use state assumptions after checking the relevant constraints.
  - id: b
    text: Assume the answer from a visually similar problem still applies.
  - id: c
    text: Ignore the distinction between necessary and sufficient conditions.
  - id: d
    text: Try arithmetic first and decide the structure only after the answer appears.
  answer:
    choiceId: a
  explanation: |-
    This mirrors the difficulty of a chapter problem archetype: recognize proof vocabulary, choose state assumptions, and verify the constraints before computing.
  skills:
  - aops-proof-methods
