lesson:
  introduction: First-order equations require method selection before calculation. This lesson identifies the defining
    structure of each major method, carries out its essential steps, and verifies the result on an appropriate interval.
  sections:
  - id: s1
    title: Linear equations and integrating factors
    required: true
    content: 'A linear first-order equation has standard form $y''+p(x)y=q(x)$. Its integrating factor is $\mu(x)=e^{\int
      p(x)\,dx}$, which turns the left side into $(\mu y)''$. For $y''+2y=6$, $\mu=e^{2x}$ and $(e^{2x}y)''=6e^{2x}$.'
    media:
    - type: image
      src: /media/ede/ch02-method-map.svg
      alt: Decision map for classifying a first-order equation as linear, separable, exact, Bernoulli, homogeneous,
        or a supported integrating-factor case.
      caption: Check equation structure before choosing algebra or a substitution.
    check:
      id: q001
      type: multipleChoice
      prompt: Which integrating factor is appropriate for $y'+(3/x)y=x^2$ on $x>0$?
      skills:
      - ede-ch02-first-order-equations-linear-ivps
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-linear-ivps
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: $x^3$
      - id: b
        text: $e^{3/x}$
        issueSignals:
        - id: ede-integrating-factor-error
          domains: &id001
          - elementary-differential-equations-bvp
      - id: c
        text: '$3\ln x$'
        issueSignals:
        - id: ede-integrating-factor-error
          domains: *id001
      - id: d
        text: $x^{-3}$
        issueSignals:
        - id: ede-linear-standard-form-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: $\mu=e^{\int 3/x\,dx}=e^{3\ln x}=x^3$ on $x>0$.

        Why it works: The coefficient of $y$ in standard form is integrated and exponentiated.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s2
    title: Separation and equilibria
    required: true
    content: For $y'=g(x)h(y)$, move nonzero factors of $y$ to one side and $x$ factors to the other, then integrate.
      Before dividing by $h(y)$, solve $h(y)=0$ to retain constant equilibrium solutions. An implicit relation is
      acceptable when isolating $y$ is unnecessary or impossible.
    media: []
    check:
      id: q002
      type: selectAll
      prompt: For $y'=x y(y-2)$, which solutions require separate attention before dividing by $y(y-2)$?
      skills:
      - ede-ch02-first-order-equations-separable-equilibria
      media: []
      difficultyDimensions:
      - constraintTracking
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-separable-equilibria
      difficultyEvidence: Requires checking several statements independently against the differential equation and
        its conditions.
      choices:
      - id: a
        text: $y=0$
      - id: b
        text: $y=2$
      - id: c
        text: $y=x$
        issueSignals:
        - id: ede-equilibrium-solution-lost
          domains: *id001
      - id: d
        text: $y=-2$
        issueSignals:
        - id: ede-separation-error
          domains: *id001
      answer:
        choiceIds:
        - a
        - b
      explanation: |-
        Solution: The constant solutions $y=0$ and $y=2$ must be retained.

        Why it works: Both make the factor used in division equal to zero and satisfy the original ODE.

        Why the other choices fail: Every unselected statement violates a stated equation, condition, or theorem hypothesis.
  - id: s3
    title: Local existence and uniqueness
    required: true
    content: For $y'=f(x,y)$ near $(x_0,y_0)$, continuity of $f$ gives local existence. Continuity of $f_y$ in a
      rectangle around the point is a standard sufficient condition for local uniqueness. These conditions are sufficient,
      not necessary; failure of the uniqueness hypothesis does not by itself prove multiple solutions.
    media: []
    check:
      id: q003
      type: multipleChoice
      prompt: 'For $y''=\sqrt{|y|}$ with $y(0)=0$, which theorem conclusion is justified by the standard $f,f_y$
        test?'
      skills:
      - ede-ch02-first-order-equations-existence-uniqueness
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-existence-uniqueness
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: Continuity gives local existence, but the stated uniqueness test does not apply at $y=0$.
      - id: b
        text: No solution exists because $f_y$ is not continuous.
        issueSignals:
        - id: ede-existence-uniqueness-confusion
          domains: *id001
      - id: c
        text: A unique solution is guaranteed because $f$ is continuous.
        issueSignals:
        - id: ede-existence-uniqueness-confusion
          domains: *id001
      - id: d
        text: Infinitely many solutions are proved solely by the failed hypothesis.
        issueSignals:
        - id: ede-existence-uniqueness-confusion
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: Local existence is guaranteed; this sufficient uniqueness test does not apply.

        Why it works: The right-hand side is continuous, while its $y$ derivative is not continuous at zero.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s4
    title: Bernoulli and homogeneous substitutions
    required: true
    content: A Bernoulli equation $y'+p(x)y=q(x)y^n$ becomes linear under $v=y^{1-n}$. A homogeneous first-order
      equation $y'=F(y/x)$ becomes separable under $v=y/x$, using $y'=v+xv'$. The equation's recognizable form determines
      which substitution is valid.
    media: []
    check:
      id: q004
      type: multipleChoice
      prompt: Which substitution linearizes $y'+(2/x)y=x y^3$?
      skills:
      - ede-ch02-first-order-equations-nonlinear-transformations
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-nonlinear-transformations
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: $v=y^{-2}$
      - id: b
        text: $v=y/x$
        issueSignals:
        - id: ede-homogeneous-substitution-error
          domains: *id001
      - id: c
        text: $v=y^2$
        issueSignals:
        - id: ede-bernoulli-substitution-error
          domains: *id001
      - id: d
        text: $v=x/y^3$
        issueSignals:
        - id: ede-method-selection-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: Use $v=y^{1-3}=y^{-2}$.

        Why it works: The equation is Bernoulli with exponent $n=3$.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s5
    title: Exact equations and potential functions
    required: true
    content: 'For $M(x,y)\,dx+N(x,y)\,dy=0$, exactness means $M_y=N_x$ on a suitable region. Seek $\Phi$ with $\Phi_x=M$
      and $\Phi_y=N$. Integrate one component, add an unknown function of the other variable, and determine it by
      comparison. The implicit solution is $\Phi(x,y)=C$.'
    media: &id002
    - type: image
      src: /media/ede/ch02-exactness-potential-workflow.svg
      alt: Workflow from the exactness test M sub y equals N sub x to construction and verification of a potential
        function.
      caption: A missing single-variable term is recovered after partial integration.
    check:
      id: q005
      type: multipleChoice
      prompt: 'Is $(2xy+1)\,dx+(x^2+3y^2)\,dy=0$ exact?'
      skills:
      - ede-ch02-first-order-equations-exact-equations
      media: *id002
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-exact-equations
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: Yes, because $M_y=2x=N_x$.
      - id: b
        text: |-
          No, because $M
          e N$.
        issueSignals:
        - id: ede-exactness-test-error
          domains: *id001
      - id: c
        text: Yes, because $M_x=N_y$.
        issueSignals:
        - id: ede-exactness-test-error
          domains: *id001
      - id: d
        text: No, because both variables appear.
        issueSignals:
        - id: ede-equation-structure-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: The equation is exact because $M_y=N_x=2x$.

        Why it works: Exactness compares the cross partial derivatives, not the original component functions.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
  - id: s6
    title: Integrating factors for nonexact equations
    required: true
    content: 'Some nonexact equations admit a one-variable integrating factor. If $(M_y-N_x)/N$ depends only on
      $x$, then $\mu(x)=e^{\int (M_y-N_x)/N\,dx}$. If $(N_x-M_y)/M$ depends only on $y$, use the analogous $\mu(y)$.
      After multiplying, repeat the exactness test.'
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: 'For $2y\,dx+x\,dy=0$, $(M_y-N_x)/N=1/x$. Which integrating factor is supported?'
      skills:
      - ede-ch02-first-order-equations-integrating-factors
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch02-first-order-equations-integrating-factors
      difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a
        plausible error.
      choices:
      - id: a
        text: '$\mu(x)=x$'
      - id: b
        text: '$\mu(x)=e^x$'
        issueSignals:
        - id: ede-integrating-factor-error
          domains: *id001
      - id: c
        text: '$\mu(y)=y$'
        issueSignals:
        - id: ede-integrating-factor-error
          domains: *id001
      - id: d
        text: No integrating factor can exist.
        issueSignals:
        - id: ede-method-selection-error
          domains: *id001
      answer:
        choiceId: a
      explanation: |-
        Solution: $\mu(x)=e^{\int 1/x\,dx}=x$ on $x>0$.

        Why it works: The diagnostic ratio depends only on $x$, and multiplying by $x$ makes the equation exact.

        Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
