    - id: t3
      term: Lenz's Law
      definition: The induced EMF generates a current that opposes the change in magnetic flux that produced
        it.
      drills:
      - id: t3-drill
        type: flashcard
        prompt: What does Lenz's Law mean?
        answer:
          expected: The induced EMF generates a current that opposes the change in magnetic flux that
            produced it.
        explanation: 'Solution:


          The induced EMF generates a current that opposes the change in magnetic flux that produced it.


          Why it works:


          This definition identifies the essential meaning of Lenz''s Law.'
