    - id: t1
      term: Electromagnetic Induction
      definition: The process of generating an electromotive force (EMF) by changing the magnetic flux
        through a circuit.
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Electromagnetic Induction mean?
        answer:
          expected: The process of generating an electromotive force (EMF) by changing the magnetic flux
            through a circuit.
        explanation: 'Solution:


          The process of generating an electromotive force (EMF) by changing the magnetic flux through
          a circuit.


          Why it works:


          This definition identifies the essential meaning of Electromagnetic Induction.'
        tags: []
    - id: t2
      term: Magnetic Flux
      definition: The total magnetic field passing through a given area.
      drills:
