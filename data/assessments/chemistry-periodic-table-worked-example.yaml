- id: atomic-radius-comparison
  title: Comparing Atomic Radii
  problem: 'Without looking at a periodic table, rank the following elements in order
    of **increasing atomic radius** (smallest to largest):

    Na (sodium, Period 3, Group 1), Cl (chlorine, Period 3, Group 17), K (potassium,
    Period 4, Group 1), Mg (magnesium, Period 3, Group 2)

    '
  steps:
  - id: step-atomic-radius-comparison-1
    title: Step 1 — Rank elements within Period 3
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Within Period 3, atomic radius **decreases from left to right**
      (increasing nuclear charge pulls electrons in tighter).


      Period 3 elements in order of increasing radius (left to right = decreasing
      radius):

      - Na (Group 1) > Mg (Group 2) > Cl (Group 17)


      So far: **Cl < Mg < Na** in radius.

      '
  - id: step-atomic-radius-comparison-2
    title: Step 2 — Compare K to the Period 3 elements
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'K is in Group 1 (same as Na) but in Period 4. Going down a group,
      atomic radius **increases** because a new electron shell is added.


      Therefore: K > Na (K is one period below Na in the same group).

      '
  - id: step-atomic-radius-comparison-3
    title: Step 3 — Final ranking (smallest to largest)
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Combining both trends:


      $$

      \text{Cl} < \text{Mg} < \text{Na} < \text{K}

      $$


      Chlorine is the smallest (far right of its period); potassium is the largest
      (below sodium, with an extra electron shell).

      '
  check:
    id: radius-check
    type: multipleChoice
    prompt: 'Which element has the largest atomic radius: F, O, S, or Se?

      '
    choices:
    - id: a
      text: Se (selenium) — Period 4, Group 16
    - id: b
      text: S (sulfur) — Period 3, Group 16
    - id: c
      text: O (oxygen) — Period 2, Group 16
    - id: d
      text: F (fluorine) — Period 2, Group 17
    answer:

      choiceId: a
    explanation: 'All four are nonmetals, but Se is furthest down Group 16 (Period
      4) and has the most electron shells. Going down a group increases radius. Se
      > S > O. F is also Period 2 and in Group 17 (further right than O), so F < O.

      '
- id: ionization-energy-prediction
  title: Predicting Relative Ionization Energies
  problem: 'Rank the following in order of **increasing first ionization energy**
    (easiest to hardest to ionize):

    Cs (cesium), F (fluorine), Na (sodium), Cl (chlorine)

    '
  steps:
  - id: step-ionization-energy-prediction-1
    title: Step 1 — Apply the group trend
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Going **down** a group, ionization energy **decreases** (electron
      farther from nucleus, more shielded).


      - Group 1: Na (Period 3) vs. Cs (Period 6) → Na > Cs in IE

      - Group 17: Cl (Period 3) vs. F (Period 2) → F > Cl in IE

      '
  - id: step-ionization-energy-prediction-2
    title: Step 2 — Apply the period trend
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Going **right** across a period, ionization energy **increases**.


      In Period 3: Cl is further right than Na → Cl > Na in IE.

      In Period 2: F is in Group 17, much further right than any Period 3 element
      by trend.


      F has the highest ionization energy of any element (it is the most electronegative
      and hardest to ionize).

      '
  - id: step-ionization-energy-prediction-3
    title: Step 3 — Final ranking (lowest to highest IE)
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: '$$

      \text{Cs} < \text{Na} < \text{Cl} < \text{F}

      $$


      Cesium (lower-left) is easiest to ionize; fluorine (upper-right) is hardest.

      '
  check:
    id: ie-check
    type: multipleChoice
    prompt: 'Which element would you predict has the highest first ionization energy:
      Li, Be, B, or Ne?

      '
    choices:
    - id: a
      text: Ne (neon) — noble gas, Period 2, Group 18
    - id: b
      text: Li (lithium) — Period 2, Group 1
    - id: c
      text: B (boron) — Period 2, Group 13
    - id: d
      text: Be (beryllium) — Period 2, Group 2
    answer:

      choiceId: a
    explanation: 'Across Period 2, ionization energy generally increases from left
      to right. Noble gases have completely filled valence shells and the highest
      ionization energies in their period. Ne (Group 18) has the highest IE in Period
      2. Note: B and Be have a slight dip from the trend due to electron subshell
      effects, but Ne is clearly highest.

      '
- id: classify-elements
  title: Classifying Elements as Metal, Nonmetal, or Metalloid
  problem: 'Classify each of the following elements as a metal, nonmetal, or metalloid.
    Use periodic table position to reason through each:

    (a) Silicon (Si, Period 3, Group 14)

    (b) Phosphorus (P, Period 3, Group 15)

    (c) Tin (Sn, Period 5, Group 14)

    (d) Iodine (I, Period 5, Group 17)

    '
  steps:
  - id: step-classify-elements-1
    title: (a) Silicon — Metalloid
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Silicon sits on the staircase line of the periodic table (between
      metals and nonmetals in Group 14). It is a classic **metalloid** — it has a
      metallic luster but is a semiconductor, not a conductor. This is why silicon
      is the foundation of computer chips.

      '
  - id: step-classify-elements-2
    title: (b) Phosphorus — Nonmetal
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Phosphorus is in Group 15, Period 3, to the right of the staircase.
      It is a **nonmetal** — exists as waxy, flammable P4 solid. It does not conduct
      electricity and forms anions (P3−) in ionic compounds.

      '
  - id: step-classify-elements-3
    title: (c) Tin — Metal
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Tin is in Group 14 but is in Period 5 — well below the staircase,
      in the metallic region. It is a **metal** — malleable, conductive, shiny. Tin
      is used in solder and food cans.

      '
  - id: step-classify-elements-4
    title: (d) Iodine — Nonmetal (Halogen)
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: 'Iodine is in Group 17 (the halogens). All halogens are **nonmetals**.
      Iodine is a lustrous purple-black solid at room temperature, but it does not
      have metallic conductivity.

      '
  check:
    id: classify-check
    type: multipleChoice
    prompt: 'Arsenic (As) is in Period 4, Group 15, along the staircase. What is the
      correct classification?

      '
    choices:
    - id: a
      text: Metalloid
    - id: b
      text: Metal
    - id: c
      text: Nonmetal
    - id: d
      text: Noble gas
    answer:

      choiceId: a
    explanation: 'Arsenic lies along the staircase dividing metals from nonmetals.
      Like silicon and germanium, it is a metalloid — it has some properties of both
      metals and nonmetals and is a semiconductor.

      '
