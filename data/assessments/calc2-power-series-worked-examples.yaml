- id: we-power-series-2
  title: Differentiate the geometric series
  problem: |
    Derive a formula for

    $$
    \sum_{n=1}^{\infty}n x^{n-1}
    $$

    and use it to evaluate $\sum_{n=1}^{\infty}n/2^{n-1}$.

    ![A map from the geometric series to its derivative](/assessments/calc2-infinite-series/power-series-operations-map.svg)
  steps:
  - id: step-power-series-2-1
    title: Start from a known representation
    instruction: |
      For $|x|<1$,

      $$
      \frac1{1-x}=\sum_{n=0}^{\infty}x^n.
      $$

      Inside its radius, a power series may be differentiated term by term.
    type: multipleChoice
    prompt: What is the radius of this geometric power series?
    choices:
    - id: a
      text: $1$
    - id: b
      text: $0$
    - id: c
      text: $2$
    - id: d
      text: |-
        $\infty$
    answer:
      choiceId: a
    explanation: |-
      Solution: Geometric convergence requires $|x|<1$. Therefore the answer is $1$.

      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.

      Why the other choices fail: $0$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $2$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $\infty$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
  - id: step-power-series-2-2
    title: Differentiate both sides
    instruction: |
      Differentiation gives

      $$
      \frac1{(1-x)^2}
      =\sum_{n=1}^{\infty}n x^{n-1},\qquad |x|<1.
      $$
    type: multipleChoice
    prompt: Why does the differentiated sum begin at $n=1$?
    choices:
    - id: a
      text: The derivative of the $n=0$ constant term is zero.
    - id: b
      text: The original series begins at $n=1$.
    - id: c
      text: $x^0$ is undefined.
    - id: d
      text: Differentiation always shifts to one.
    answer:
      choiceId: a
    explanation: 'Solution: The constant term disappears under differentiation. Therefore the answer is The derivative of the $n=0$ constant term is zero.. Therefore the answer is The derivative of the $n=0$ constant term is zero.. Therefore the answer is The derivative of the $n=0$ constant term is zero.. Therefore the answer is The derivative of the $n=0$ constant term is zero..


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


      Why the other choices fail: The original series begins at $n=1$. conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $x^0$ is undefined. conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; Differentiation always shifts to one. conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
  - id: step-power-series-2-3
    title: Substitute the requested value
    instruction: |
      Since $x=1/2$ lies inside the convergence interval,

      $$
      \sum_{n=1}^{\infty}\frac{n}{2^{n-1}}
      =\frac1{(1-1/2)^2}=4.
      $$
    type: multipleChoice
    prompt: What permits direct substitution into the identity?
    choices:
    - id: a
      text: $|1/2|<1$
    - id: b
      text: $1/2$ is an endpoint
    - id: c
      text: Every differentiated series converges everywhere
    - id: d
      text: All terms are integers
    answer:
      choiceId: a
    explanation: 'Solution: The derived identity is valid throughout the unchanged radius of convergence. Therefore the answer is $|1/2|<1$.


      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.


      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.


      Why the other choices fail: $1/2$ is an endpoint conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; Every differentiated series converges everywhere conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; All terms are integers conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.'
  - id: step-power-series-2-4
    title: Check the indexing
    instruction: 'The requested denominator is $2^{n-1}$. If it were $2^n$, every term

      would be half as large and the sum would be $2$.

      '
    type: multipleChoice
    prompt: |-
      What is $\sum_{n=1}^{\infty}n/2^n$?
    choices:
    - id: a
      text: $1$
    - id: b
      text: $2$
    - id: c
      text: $4$
    - id: d
      text: $8$
    answer:
      choiceId: b
    explanation: 'Solution: Factor $1/2$ from the already evaluated $2^{-(n-1)}$ series. Therefore the answer is $2$.


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


      Why the other choices fail: $1$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $4$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $8$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
- id: we-power-series-3
  title: Build a representation by substitution
  problem: |
    Find a power series centered at $0$ for

    $$
    f(x)=\frac{x}{1+x^2},
    $$

    and state its interval of convergence.
  steps:
  - id: step-power-series-3-1
    title: Match the geometric denominator
    instruction: |
      Write

      $$
      \frac1{1+x^2}=\frac1{1-(-x^2)}.
      $$

      This has geometric variable $u=-x^2$.
    type: multipleChoice
    prompt: Which geometric substitution is correct?
    choices:
    - id: a
      text: $u=-x^2$
    - id: b
      text: $u=x$
    - id: c
      text: $u=1+x^2$
    - id: d
      text: $u=-x$
    answer:
      choiceId: a
    explanation: 'Solution: The standard denominator is $1-u$, so $u$ must equal $-x^2$. Therefore the answer is $u=-x^2$.


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


      Why the other choices fail: $u=x$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $u=1+x^2$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $u=-x$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
  - id: step-power-series-3-2
    title: Expand and restore the numerator
    instruction: |
      For $|-x^2|<1$,

      $$
      \frac1{1+x^2}=\sum_{n=0}^{\infty}(-1)^n x^{2n}.
      $$

      Multiplying by $x$ gives

      $$
      f(x)=\sum_{n=0}^{\infty}(-1)^n x^{2n+1}.
      $$
    type: multipleChoice
    prompt: Which are the first four nonzero terms?
    choices:
    - id: a
      text: $x-x^3+x^5-x^7$
    - id: b
      text: $1-x^2+x^4-x^6$
    - id: c
      text: $x+x^3+x^5+x^7$
    - id: d
      text: $x-x^2+x^3-x^4$
    answer:
      choiceId: a
    explanation: 'Solution: Only odd powers remain after multiplication by $x$, and signs alternate. Therefore the answer is $x-x^3+x^5-x^7$.


      Why it works: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone. Check the derivative bound and the interval between the expansion center and the target value, then evaluate the resulting upper bound for $|R_n(x)|$.


      Common trap: The first omitted term is not automatically an error bound. State the theorem''s hypotheses, use the correct derivative order, and keep the degree $n$ distinct from the first omitted index $n+1$.


      Why the other choices fail: $1-x^2+x^4-x^6$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $x+x^3+x^5+x^7$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone; $x-x^2+x^3-x^4$ conflicts with this criterion: For a Taylor polynomial $T_n$, use the applicable remainder theorem rather than the next written term alone.'
  - id: step-power-series-3-3
    title: Solve the interior condition
    instruction: 'The geometric condition is $|x^2|<1$, equivalent to $|x|<1$.

      Thus the candidate interval is $(-1,1)$.

      '
    type: multipleChoice
    prompt: What is the radius of convergence?
    choices:
    - id: a
      text: $1$
    - id: b
      text: $2$
    - id: c
      text: $1/2$
    - id: d
      text: |-
        $\infty$
    answer:
      choiceId: a
    explanation: |-
      Solution: The nearest complex singularities are also one unit from the center, consistent with the geometric condition. Therefore the answer is $1$.

      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.

      Why the other choices fail: $2$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $1/2$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $\infty$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
  - id: step-power-series-3-4
    title: Test both real endpoints
    instruction: 'At $x=1$, the terms are $(-1)^n$; at $x=-1$, they are

      $-(-1)^n$. In both cases the terms fail to approach zero, so neither

      endpoint is included.

      '
    type: multipleChoice
    prompt: What is the final interval of convergence?
    choices:
    - id: a
      text: $(-1,1)$
    - id: b
      text: $[-1,1]$
    - id: c
      text: $[-1,1)$
    - id: d
      text: |-
        $(-\infty,\infty)$
    answer:
      choiceId: a
    explanation: |-
      Solution: Endpoint substitution yields nonvanishing terms, so the divergence test excludes both. Therefore the answer is $(-1,1)$.

      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.

      Why the other choices fail: $[-1,1]$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $[-1,1)$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $(-\infty,\infty)$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
