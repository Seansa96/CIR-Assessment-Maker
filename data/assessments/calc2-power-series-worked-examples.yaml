      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.


      Why the other choices fail: Power series never include endpoints. conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; The center is an endpoint. conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; The terms are undefined there. conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.'
  - id: step-power-series-1-3
    title: Test the right endpoint
    instruction: |
      At $x=5$, $(x-2)^n/3^n=1$, so the series becomes
      $\sum1/n$, which diverges.
    type: multipleChoice
    prompt: Is $x=5$ included?
    choices:
    - id: a
      text: No, because the harmonic series diverges.
    - id: b
      text: Yes, because $5$ is finite.
    - id: c
      text: Yes, by the alternating-series test.
    - id: d
      text: No, because the terms alternate.
    answer:
