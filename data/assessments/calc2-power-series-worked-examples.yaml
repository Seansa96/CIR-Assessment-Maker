- id: we-power-series-1
  title: Find an interval with asymmetric endpoints
  problem: |
    Find the radius and interval of convergence of

    $$
    \sum_{n=1}^{\infty}\frac{(x-2)^n}{n3^n}.
    $$

    ![A centered convergence interval with distinct endpoint tests](/assessments/calc2-infinite-series/power-series-radius-endpoints-map.svg)
  steps:
  - id: step-power-series-1-1
    title: Apply the ratio test away from endpoints
    instruction: |
      For the absolute terms,

      $$
      \left|\frac{a_{n+1}}{a_n}\right|
      =\frac{|x-2|}{3}\frac{n}{n+1}
      \longrightarrow\frac{|x-2|}{3}.
      $$
    type: multipleChoice
    prompt: What inequality gives absolute convergence?
    choices:
    - id: a
      text: $|x-2|<3$
    - id: b
      text: |-
        $|x-2|\le3$
    - id: c
      text: $|x|<2$
    - id: d
      text: $|x-3|<2$
    answer:
      choiceId: a
    explanation: |-
      Solution: The ratio test requires a limit strictly below one and says nothing at equality. Therefore the answer is $|x-2|<3$.

      Why it works: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$. Then test each endpoint separately in the original series, because endpoint behavior is not determined by the ratio calculation.

      Common trap: Do not substitute endpoints into a simplified inequality and stop; each endpoint may converge, diverge, or have a different inclusion status.

      Why the other choices fail: $|x-2|\le3$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $|x|<2$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$; $|x-3|<2$ conflicts with this criterion: First apply the Ratio or Root Test to obtain the open radius condition $|x-c|<R$.
  - id: step-power-series-1-2
    title: Read the radius and candidate interval
    instruction: 'The inequality $|x-2|<3$ gives center $2$, radius $R=3$, and open

      interval $(-1,5)$ before endpoint testing.

      '
    type: multipleChoice
    prompt: Why are the endpoints not included yet?
    choices:
    - id: a
      text: The ratio-test limit equals $1$ there and is inconclusive.
    - id: b
      text: Power series never include endpoints.
    - id: c
      text: The center is an endpoint.
    - id: d
      text: The terms are undefined there.
    answer:
      choiceId: a
    explanation: 'Solution: Endpoint behavior depends on the remaining numerical series after substitution. Therefore the answer is The ratio-test limit equals $1$ there and is inconclusive.. Therefore the answer is The ratio-test limit equals $1$ there and is inconclusive.. Therefore the answer is The ratio-test limit equals $1$ there and is inconclusive.. Therefore the answer is The ratio-test limit equals $1$ there and is inconclusive..


