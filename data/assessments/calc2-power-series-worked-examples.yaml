  - id: step-power-series-1-4
    title: Test the left endpoint
    instruction: |
      At $x=-1$, the series becomes $\sum(-1)^n/n$, which converges by the
      alternating-series test. Therefore the interval is

      $$
      [-1,5).
      $$
    type: multipleChoice
    prompt: What is the convergence type at $x=-1$?
    choices:
