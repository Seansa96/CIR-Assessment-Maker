workedExamples:
- id: we01
  title: 'Euler: a rising concentration'
  problem: For $y'=x+y$, $y(0)=1$, use Euler with $h=0.2$ to estimate $y(0.4)$.
  steps:
  - id: we1-s1
    title: First current-state update
    instruction: Evaluate the slope at the initial mesh point and advance exactly one step.
    type: freeResponse
    prompt: Compute $f(x_0,y_0)$ and $y_1$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - slope 1
      - y1=1.2
    explanation: |-
      Solution: At $(0,1)$, $f=1$, so $y_1=1+0.2(1)=1.2$.

      Why it works: Euler uses the known current state $(0,1)$ for the first tangent prediction.
    media: []
  - id: we1-s2
    title: Second current-state update
    instruction: Use the newly computed state rather than reusing the initial slope.
    type: freeResponse
    prompt: Compute $f(x_1,y_1)$ and $y_2$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - slope 1.4
      - y2=1.48
    explanation: |-
      Solution: At $(0.2,1.2)$, $f=1.4$, so $y_2=1.2+0.2(1.4)=1.48$.

      Why it works: The recurrence advances both coordinates before the next slope evaluation.
    media: []
  - id: we1-s3
    title: Report and audit the table
    instruction: Check that the mesh point and number of steps match the requested endpoint.
    type: freeResponse
    prompt: State the estimate and verify the update table reaches $x=0.4$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - x2=0.4
      - estimate 1.48
      - current-row slopes
    explanation: |-
      Solution: The two steps reach $x_2=0.4$, so $y(0.4)\approx1.48$. Each slope was evaluated at its current row.

      Why it works: A correct numerical value is meaningful only when it corresponds to the requested mesh point.
    media: []
- id: we02
  title: 'Endpoint-average Improved Euler: average slopes'
  problem: For $y'=x+y$, $y(0)=1$, take one endpoint-average Improved Euler step with $h=0.2$.
  steps:
  - id: we2-s1
    title: Predict the endpoint state
    instruction: Use the initial slope for an Euler predictor only.
    type: freeResponse
    prompt: Compute the predictor $y^*$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - initial slope
      - predictor 1.2
    explanation: |-
      Solution: $f(0,1)=1$, so $y^*=1+0.2(1)=1.2$.

      Why it works: endpoint-average Improved Euler needs a provisional endpoint state before it can evaluate the endpoint slope.
    media: []
  - id: we2-s2
    title: Average the endpoint slopes
    instruction: Evaluate the slope at the predicted endpoint and apply the trapezoidal average.
    type: freeResponse
    prompt: Compute the corrected value $y_1$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - endpoint slope 1.4
      - corrected 1.24
    explanation: |-
      Solution: $f(0.2,1.2)=1.4$, so $y_1=1+\frac{0.2}{2}(1+1.4)=1.24$.

      Why it works: The average accounts for the slope change across the step.
    media: []
  - id: we2-s3
    title: Compare the methods
    instruction: Explain the numerical difference without claiming proof of accuracy.
    type: freeResponse
    prompt: Compare the Euler and endpoint-average Improved Euler one-step values.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Euler 1.20
      - Heun 1.24
      - slope-growth explanation
    explanation: |-
      Solution: Euler gives $1.20$ while endpoint-average Improved Euler gives $1.24$. Because the slope grows over the step, the endpoint correction raises the estimate.

      Why it works: A method comparison should connect the changed stage information to the changed estimate.
    media: []
- id: we03
  title: 'RK4: a four-slope step'
  problem: For $y'=y$, $y(0)=1$, use RK4 with $h=0.1$ for one step.
  steps:
  - id: we3-s1
    title: Compute the four stages
    instruction: Use the correct midpoint and endpoint stage states.
    type: freeResponse
    prompt: Calculate $k_1,k_2,k_3,k_4$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - four correct stages
      - midpoint states
    explanation: |-
      Solution: $k_1=1$, $k_2=1.05$, $k_3=1.0525$, and $k_4=1.10525$.

      Why it works: Each later slope is evaluated at the state predicted by the preceding stage.
    media: []
  - id: we3-s2
    title: Apply the RK4 weights
    instruction: Combine the stages using weights $1,2,2,1$.
    type: freeResponse
    prompt: Compute $y_1$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - correct weights
      - value 1.105170833
    explanation: |-
      Solution: $y_1=1+\frac{0.1}{6}(1+2(1.05)+2(1.0525)+1.10525)=1.105170833\ldots$.

      Why it works: The RK4 weighted average is multiplied by the full step size.
    media: []
  - id: we3-s3
    title: Compare with a reference
    instruction: Evaluate the exact solution only as an accuracy reference.
    type: freeResponse
    prompt: Compare the RK4 value with $e^{0.1}$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - reference value
      - error about 6.47e-7
    explanation: |-
      Solution: $e^{0.1}\approx1.105170186$, so the absolute one-step error is about $6.47\times10^{-7}$.

      Why it works: The exact solution verifies the scale of the error without changing the RK4 calculation.
    media: []
