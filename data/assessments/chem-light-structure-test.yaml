questions:
  - id: light-struct-q01
    title: Wavelength and Frequency Relationship
    type: numericResponse
    prompt: |
      A photon of orange light has a wavelength of $620\text{ nm}$. Using the speed of light $c = 3.00 \times 10^8\text{ m/s}$, what is the frequency of this light in Hz (or $\text{s}^{-1}$)? 
      
      *Enter your answer as a coefficient multiplied by $10^{14}$ (e.g. if the answer is $1.2 \times 10^{14}$, enter 1.2).*
    answer:
      value: 4.84
      tolerance: 0.1
    explanation: |
      First convert wavelength to meters: $\lambda = 620\text{ nm} = 620 \times 10^{-9}\text{ m} = 6.20 \times 10^{-7}\text{ m}$.

      $$c = \lambda \nu \implies \nu = \frac{c}{\lambda} = \frac{3.00 \times 10^8}{6.20 \times 10^{-7}} \approx 4.84 \times 10^{14}\text{ Hz}$$

  - id: light-struct-q02
    title: Energy of a Photon
    type: numericResponse
    prompt: |
      What is the energy in Joules of a single photon of ultraviolet light with a frequency of $1.50 \times 10^{15}\text{ Hz}$?
      
      Use Planck's constant $h = 6.626 \times 10^{-34}\text{ J}\cdot\text{s}$.
      
      *Enter your answer as a coefficient multiplied by $10^{-19}$ (e.g. if the answer is $5.0 \times 10^{-19}$, enter 5.0).*
    answer:
      value: 9.94
      tolerance: 0.1
    explanation: |
      $$E = h\nu = (6.626 \times 10^{-34}\text{ J}\cdot\text{s})(1.50 \times 10^{15}\text{ s}^{-1}) = 9.939 \times 10^{-19}\text{ J}$$
      
      Rounding to 3 significant figures, we get $9.94 \times 10^{-19}\text{ J}$.

  - id: light-struct-q03
    title: Electromagnetic Spectrum Energy Ranking
    type: multipleChoice
    prompt: |
      Which of the following types of electromagnetic radiation has the **highest energy per photon**?
    choices:
      - id: a
        text: Microwaves
      - id: b
        text: Infrared light
      - id: c
        text: Visible (blue) light
      - id: d
        text: X-rays
    answer:

      choiceId: d
    explanation: |
      Energy is directly proportional to frequency ($E = h\nu$) and inversely proportional to wavelength ($E = hc/\lambda$). 
      
      The electromagnetic spectrum from lowest to highest energy is: Radio < Microwave < Infrared < Visible (Red to Violet) < Ultraviolet < X-ray < Gamma ray. 
      
      X-rays have the highest frequency and shortest wavelength of the choices, meaning they have the highest energy per photon.

  - id: light-struct-q04
    title: Bohr Model — Electron Transitions
    type: multipleChoice
    prompt: |
      According to the Bohr model of the hydrogen atom, which of the following electron transitions results in the **emission** of a photon with the **longest wavelength**?
    choices:
      - id: a
        text: $n=4 \rightarrow n=1$
      - id: b
        text: $n=4 \rightarrow n=3$
      - id: c
        text: $n=1 \rightarrow n=4$
      - id: d
        text: $n=3 \rightarrow n=4$
    answer:

      choiceId: b
    explanation: |
      **Emission** means the electron goes from a higher energy level to a lower one (eliminating c and d, which are absorption).
      
      Longest wavelength corresponds to the **lowest energy** photon ($E \propto 1/\lambda$). 
      The energy levels get closer together as $n$ increases. The energy difference between $n=4$ and $n=3$ is much smaller than between $n=4$ and $n=1$. Therefore, the $n=4 \rightarrow n=3$ transition emits the lowest energy (longest wavelength) photon.

  - id: light-struct-q05
    title: Quantum Numbers — Principal Quantum Number
    type: multipleChoice
    prompt: |
      Which of the following statements about the principal quantum number ($n$) is correct?
    choices:
      - id: a
        text: It defines the shape of the orbital.
      - id: b
        text: It determines the orientation of the orbital in space.
      - id: c
        text: It indicates the main energy level (or shell) and average distance from the nucleus.
      - id: d
        text: It specifies the spin state of an electron in an orbital.
    answer:

      choiceId: c
    explanation: |
      The principal quantum number, $n$, indicates the main energy level (shell) and is related to the orbital's size and average distance from the nucleus. 
      - $l$ defines the shape.
      - $m_l$ defines the orientation.
      - $m_s$ defines the electron spin.

  - id: light-struct-q06
    title: Quantum Numbers — Valid Sets
    type: multipleChoice
    prompt: |
      Which of the following sets of quantum numbers $(n, l, m_l, m_s)$ is **not** allowed?
    choices:
      - id: a
        text: $(2, 1, -1, +1/2)$
      - id: b
        text: $(3, 2, 0, -1/2)$
      - id: c
        text: $(3, 3, 2, +1/2)$
      - id: d
        text: $(4, 0, 0, -1/2)$
    answer:

      choiceId: c
    explanation: |
      The angular momentum quantum number $l$ must be an integer from $0$ to $n-1$. 
      
      In choice C, $n=3$ and $l=3$. This is impossible because if $n=3$, the maximum value for $l$ is $2$. (There is no $3f$ subshell).

  - id: light-struct-q07
    title: Orbital Shapes
    type: multipleChoice
    prompt: |
      An orbital is described by the quantum numbers $n=3$ and $l=1$. What is the general shape of this orbital?
    choices:
      - id: a
        text: Spherical
      - id: b
        text: Dumbbell (two lobes)
      - id: c
        text: Four-lobed (cloverleaf) or a dumbbell with a torus
      - id: d
        text: Complex multi-lobed shape
    answer:

      choiceId: b
    explanation: |
      The quantum number $l$ determines the subshell and shape:
      - $l=0$: $s$ orbital (spherical)
      - $l=1$: $p$ orbital (dumbbell)
      - $l=2$: $d$ orbital (mostly cloverleaf)
      - $l=3$: $f$ orbital (complex)
      
      Since $l=1$, this is a $3p$ orbital, which has a dumbbell shape.

  - id: light-struct-q08
    title: Electron Configuration — Full Notation
    type: multipleChoice
    prompt: |
      What is the correct full ground-state electron configuration for a neutral Phosphorus (P) atom (atomic number 15)?
    choices:
      - id: a
        text: $1s^2 2s^2 2p^6 3s^2 3p^3$
      - id: b
        text: $1s^2 2s^2 2p^6 3s^2 3p^5$
      - id: c
        text: $1s^2 2s^2 2p^6 3s^1 3p^4$
      - id: d
        text: $1s^2 2s^2 2p^6 3p^5$
    answer:

      choiceId: a
    explanation: |
      Phosphorus has 15 electrons. Filling order (Aufbau principle): $1s, 2s, 2p, 3s, 3p$.
      - $1s$: 2 electrons
      - $2s$: 2 electrons
      - $2p$: 6 electrons
      - $3s$: 2 electrons
      - $3p$: 3 electrons (to reach 15 total)
      
      Configuration: $1s^2 2s^2 2p^6 3s^2 3p^3$.

  - id: light-struct-q09
    title: Electron Configuration — Noble Gas Core
    type: freeResponse
    prompt: |
      Write the ground-state electron configuration for an Iron (Fe) atom (atomic number 26) using the noble gas core abbreviation.
      
      *Format: [Ar] 4s2 3d6 (use spaces between terms, no superscripts needed)*
    answer:
      gradingMode: selfCheck
      keyPoints:
        - '[Ar] 4s2 3d6'
        - '[Ar] 3d6 4s2'
    explanation: |
      Iron has 26 electrons. The previous noble gas is Argon (Ar), which accounts for 18 electrons.
      The remaining 8 electrons go into the $4s$ and $3d$ subshells.
      The $4s$ fills before the $3d$, taking 2 electrons. The last 6 electrons go into the $3d$ subshell.
      Result: $[\text{Ar}]\, 4s^2 3d^6$.

  - id: light-struct-q10
    title: Valence Electrons Count
    type: numericResponse
    prompt: |
      How many valence electrons does a neutral Selenium (Se) atom (Group 16 / VIA) possess?
    answer:
      value: 6.0
      tolerance: 0.1
    explanation: |
      Selenium is in Group 16 of the periodic table. For main-group elements, the group number (13-18) minus 10 gives the number of valence electrons. 
      Alternatively, its configuration is $[\text{Ar}]\, 4s^2 3d^{10} 4p^4$. The highest energy level is $n=4$, which contains $2+4 = 6$ valence electrons. (The filled $3d$ subshell is considered part of the core).

  - id: light-struct-q11
    title: Hund's Rule and Orbital Diagrams
    type: multipleChoice
    prompt: |
      According to Hund's Rule, how should the three $2p$ electrons of a Nitrogen atom be distributed in its orbital diagram?
    choices:
      - id: a
        text: One orbital gets two paired electrons, one gets a single electron, and one is empty.
      - id: b
        text: All three electrons are placed in the same orbital.
      - id: c
        text: Each of the three $p$ orbitals receives one electron, and all three have parallel (same) spins.
      - id: d
        text: Each of the three $p$ orbitals receives one electron, but they must have alternating spins.
    answer:

      choiceId: c
    explanation: |
      Hund's Rule states that for degenerate orbitals (like the three $2p$ orbitals), electrons fill them singly first, with parallel spins, before pairing up. This minimizes electron-electron repulsion. So for Nitrogen ($1s^2 2s^2 2p^3$), the three $2p$ electrons will occupy $p_x, p_y$, and $p_z$ with the same spin direction.

  - id: light-struct-q12
    title: Periodic Trends — Atomic Radius
    type: multipleChoice
    prompt: |
      Which of the following sequences correctly lists elements in order of **increasing** atomic radius?
    choices:
      - id: a
        text: $\text{F} < \text{O} < \text{S} < \text{Se}$
      - id: b
        text: $\text{Se} < \text{S} < \text{O} < \text{F}$
      - id: c
        text: $\text{F} < \text{S} < \text{O} < \text{Se}$
      - id: d
        text: $\text{O} < \text{F} < \text{Se} < \text{S}$
    answer:

      choiceId: a
    explanation: |
      Atomic radius **increases down a group** (due to additional electron shells) and **decreases across a period from left to right** (due to increasing effective nuclear charge).
      - Fluorine (F) is right of Oxygen (O), so F < O.
      - Sulfur (S) is below Oxygen (O), so O < S.
      - Selenium (Se) is below Sulfur (S), so S < Se.
      
      Therefore, the order of increasing atomic radius is: $\text{F} < \text{O} < \text{S} < \text{Se}$.

  - id: light-struct-q13
    title: Periodic Trends — First Ionization Energy
    type: multipleChoice
    prompt: |
      Which element has the **highest** first ionization energy?
    choices:
      - id: a
        text: Sodium (Na)
      - id: b
        text: Magnesium (Mg)
      - id: c
        text: Chlorine (Cl)
      - id: d
        text: Argon (Ar)
    answer:

      choiceId: d
    explanation: |
      Ionization energy is the energy required to remove an electron. It generally **increases across a period** (left to right) and **decreases down a group**.
      Argon is a noble gas at the far right of Period 3. It has a full valence shell (stable octet) and a high effective nuclear charge, making it extremely difficult to remove an electron.

  - id: light-struct-q14
    title: Periodic Trends — Electronegativity
    type: multipleChoice
    prompt: |
      Electronegativity is the measure of an atom's ability to attract shared electrons in a chemical bond. Which of the following elements is the **most electronegative**?
    choices:
      - id: a
        text: Oxygen (O)
      - id: b
        text: Fluorine (F)
      - id: c
        text: Nitrogen (N)
      - id: d
        text: Chlorine (Cl)
    answer:

      choiceId: b
    explanation: |
      Electronegativity increases across a period (left to right) and decreases down a group. Fluorine (F) is located at the top right of the periodic table (excluding noble gases, which generally don't form bonds) and is the most electronegative element, with a Pauling value of 4.0.

  - id: light-struct-q15
    title: Ions — Isoelectronic Species
    type: multipleChoice
    prompt: |
      Which of the following ions is **not** isoelectronic with the noble gas Neon (Ne)?
    choices:
      - id: a
        text: $\text{O}^{2-}$
      - id: b
        text: $\text{F}^{-}$
      - id: c
        text: $\text{Na}^{+}$
      - id: d
        text: $\text{Cl}^{-}$
    answer:

      choiceId: d
    explanation: |
      Isoelectronic means having the same electron configuration (and number of electrons). Neon has 10 electrons.
      - $\text{O}^{2-}$: $8 + 2 = 10$ electrons
      - $\text{F}^{-}$: $9 + 1 = 10$ electrons
      - $\text{Na}^{+}$: $11 - 1 = 10$ electrons
      - $\text{Cl}^{-}$: $17 + 1 = 18$ electrons. (Chloride is isoelectronic with Argon, not Neon).

  - id: light-struct-q16
    title: Effective Nuclear Charge
    type: multipleChoice
    prompt: |
      Why does the atomic radius **decrease** as you move from left to right across a period?
    choices:
      - id: a
        text: Electrons are added to higher energy levels, which compresses the inner shells.
      - id: b
        text: The number of protons in the nucleus increases, leading to a greater effective nuclear charge ($Z_{\text{eff}}$) that pulls the valence electrons closer.
      - id: c
        text: The atomic mass increases, making the atoms denser and more compact.
      - id: d
        text: The number of core electrons increases, shielding the valence electrons more effectively.
    answer:

      choiceId: b
    explanation: |
      Across a period, protons are added to the nucleus and electrons are added to the *same* valence shell. Because electrons in the same shell don't shield each other very well, the effective nuclear charge ($Z_{\text{eff}}$) experienced by the valence electrons increases. This stronger pull from the nucleus draws the electron cloud closer, decreasing the atomic radius.

  - id: light-struct-q17
    title: Exceptions to Ionization Energy Trends
    type: multipleChoice
    prompt: |
      The first ionization energy of Oxygen is slightly **lower** than that of Nitrogen, even though Oxygen is further to the right in Period 2. Why does this exception occur?
    choices:
      - id: a
        text: Oxygen has a lower effective nuclear charge than Nitrogen.
      - id: b
        text: Oxygen's valence electrons are in the $3s$ subshell, which is further away.
      - id: c
        text: Nitrogen has a stable, half-filled $2p$ subshell ($2p^3$). Removing an electron from Oxygen ($2p^4$) eliminates electron-electron repulsion between paired electrons in the same orbital.
      - id: d
        text: Nitrogen is a diatomic gas, making it harder to ionize.
    answer:

      choiceId: c
    explanation: |
      Nitrogen's configuration is $1s^2 2s^2 2p^3$. The three $2p$ electrons occupy separate orbitals with parallel spins (half-filled stability).
      Oxygen's configuration is $1s^2 2s^2 2p^4$. The fourth $p$ electron must pair up with another electron in one of the $2p$ orbitals. The electrostatic repulsion between these two paired electrons makes it slightly easier to remove one of them, lowering Oxygen's ionization energy compared to Nitrogen.

  - id: light-struct-q18
    title: Electron Configuration — Transition Metal Ions
    type: multipleChoice
    prompt: |
      What is the electron configuration of the Copper(II) ion ($\text{Cu}^{2+}$)? 
      
      *(Note: Neutral Copper (Z=29) is an anomaly with configuration $[\text{Ar}]\, 4s^1 3d^{10}$.)*
    choices:
      - id: a
        text: $[\text{Ar}]\, 4s^2 3d^7$
      - id: b
        text: $[\text{Ar}]\, 4s^1 3d^8$
      - id: c
        text: $[\text{Ar}]\, 4s^0 3d^9$
      - id: d
        text: $[\text{Ar}]\, 3d^9 4p^2$
    answer:

      choiceId: c
    explanation: |
      When transition metals form cations, electrons are removed from the highest principal quantum number ($n$) shell first — which is the $4s$ subshell, not the $3d$.
      Neutral Cu: $[\text{Ar}]\, 4s^1 3d^{10}$.
      To form $\text{Cu}^{2+}$, remove 2 electrons: the one $4s$ electron first, then one $3d$ electron.
      Result: $[\text{Ar}]\, 4s^0 3d^9$ (or just $[\text{Ar}]\, 3d^9$).

  - id: light-struct-q19
    title: de Broglie Wavelength
    type: numericResponse
    prompt: |
      According to the de Broglie equation $\lambda = \frac{h}{mv}$, what is the wavelength in meters of an electron (mass $= 9.11 \times 10^{-31}\text{ kg}$) moving at $2.20 \times 10^6\text{ m/s}$?
      
      Use Planck's constant $h = 6.626 \times 10^{-34}\text{ J}\cdot\text{s}$.
      
      *Enter your answer as a coefficient multiplied by $10^{-10}$ (e.g. if the answer is $3.3 \times 10^{-10}$, enter 3.3).*
    answer:
      value: 3.31
      tolerance: 0.05
    explanation: |
      $$\lambda = \frac{h}{mv} = \frac{6.626 \times 10^{-34}}{(9.11 \times 10^{-31})(2.20 \times 10^6)}$$
      $$\lambda = \frac{6.626 \times 10^{-34}}{20.042 \times 10^{-25}} \approx 3.306 \times 10^{-10}\text{ m}$$
      
      This is $3.31 \times 10^{-10}\text{ m}$ (or 0.331 nm).

  - id: light-struct-q20
    title: Successive Ionization Energies
    type: multipleChoice
    prompt: |
      An unknown element from Period 3 has the following successive ionization energies (in kJ/mol):
      - $\text{IE}_1 = 738$
      - $\text{IE}_2 = 1451$
      - $\text{IE}_3 = 7733$
      - $\text{IE}_4 = 10542$
      
      Which element is this most likely to be?
    choices:
      - id: a
        text: Sodium (Na)
      - id: b
        text: Magnesium (Mg)
      - id: c
        text: Aluminum (Al)
      - id: d
        text: Silicon (Si)
    answer:

      choiceId: b
    explanation: |
      Notice the massive jump in energy between the 2nd and 3rd ionization energies (from 1451 to 7733 kJ/mol). This indicates that the first two electrons are relatively easy to remove (valence electrons), but the third electron is extremely difficult to remove because it must come from a stable, inner-core noble gas configuration.
      An element with 2 valence electrons is in Group 2. In Period 3, this element is Magnesium (Mg).
