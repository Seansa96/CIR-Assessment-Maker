glossary:
  introduction: |
    Key terminology and equations for the Introduction to Differential Equations area.
  sections:
    - id: definitions
      title: Core Definitions
      required: true
      content: |
        These are the fundamental terms used to classify and solve differential equations.
      entries:
        - id: term-differential-equation
          term: Differential Equation
          definition: |
            An equation that contains an unknown function and one or more of its derivatives.
          notation: null
          examples: 
            - |
              $y'' + y = 0$
            - |
              $dP/dt = kP$
          aliases: 
            - DE
            - Ordinary Differential Equation
            - ODE
          media: []
          tags: 
            - terminology
          drills:
            - id: drill-diff-eq
              type: flashcard
              prompt: |
                What is an equation that contains an unknown function and its derivatives called?
              answer:
                expected: Differential Equation
                expectedLatex: null
                aliases: 
                  - DE
                  - ODE
                media: []

        - id: term-order
          term: Order of a Differential Equation
          definition: |
            The order of the highest derivative that occurs in the equation.
          notation: null
          examples: 
            - |
              $y''' + 2y = x$ is third-order.
          aliases: []
          media: []
          tags: 
            - classification
          drills:
            - id: drill-order
              type: flashcard
              prompt: |
                How is the 'order' of a differential equation determined?
              answer:
                expected: By the highest derivative present in the equation.
                expectedLatex: null
                aliases: 
                  - highest derivative
                media: []

        - id: term-ivp
          term: Initial Value Problem
          definition: |
            A differential equation combined with one or more initial conditions (values of the dependent variable) used to find a particular solution.
          notation: IVP
          examples: 
            - |
              $y' = xy, y(0) = 5$
          aliases: 
            - IVP
          media: []
          tags: 
            - terminology
          drills:
            - id: drill-ivp
              type: flashcard
              prompt: |
                What does IVP stand for in the context of differential equations?
              answer:
                expected: Initial Value Problem
                expectedLatex: null
                aliases: 
                  - initial value problem
                media: []

        - id: term-direction-field
          term: Direction Field
          definition: |
            A graphical representation of the solutions to a first-order differential equation $y' = F(x,y)$, created by drawing short line segments with slope $F(x,y)$ at a grid of points.
          notation: null
          examples: []
          aliases: 
            - Slope Field
          media: []
          tags: 
            - graphical
          drills:
            - id: drill-direction-field
              type: flashcard
              prompt: |
                What is another name for a slope field?
              answer:
                expected: Direction Field
                expectedLatex: null
                aliases: 
                  - direction field
                media: []

        - id: term-separable
          term: Separable Equation
          definition: |
            A first-order differential equation that can be factored as a function of $x$ multiplied by a function of $y$: $dy/dx = g(x)f(y)$.
          notation: null
          examples: 
            - |
              $dy/dx = (x^2)(e^y)$
          aliases: []
          media: []
          tags: 
            - classification
            - technique
          drills:
            - id: drill-separable
              type: flashcard
              prompt: |
                What type of equation can be written in the form $dy/dx = g(x)f(y)$?
              answer:
                expected: Separable Equation
                expectedLatex: null
                aliases: 
                  - separable
                media: []

        - id: term-linear
          term: First-Order Linear Equation
          definition: |
            A differential equation that can be written in the standard form $dy/dx + P(x)y = Q(x)$.
          notation: null
          examples: 
            - |
              $x y' - 2y = x^2$
          aliases: 
            - Linear DE
          media: []
          tags: 
            - classification
          drills:
            - id: drill-linear
              type: flashcard
              prompt: |
                What is the standard form of a First-Order Linear Equation?
              answer:
                expected: null
                expectedLatex: y' + P(x)y = Q(x)
                aliases: []
                media: []

        - id: term-integrating-factor
          term: Integrating Factor
          definition: |
            A function $I(x) = e^{\int P(x) dx}$ used to multiply a first-order linear equation so that the left side becomes the exact derivative of the product $I(x)y$.
          notation: |
            $I(x)$
          examples: []
          aliases: []
          media: []
          tags: 
            - technique
          drills:
            - id: drill-integrating-factor
              type: flashcard
              prompt: |
                What is the formula for the integrating factor $I(x)$ given standard form $y' + P(x)y = Q(x)$?
              answer:
                expected: null
                expectedLatex: e^{\int P(x) dx}
                aliases: []
                media: []
