workedExamples:
- id: mathematical-literacy-logic-worked-example-a-example
  title: Annotate a short mathematical passage
  problem: 'Read the short claim: If an integer n is even, then n squared is even. Annotate what is assumed, what
    is claimed, and what would justify the transition.'
  steps:
  - id: step-1
    title: Mark the assumption
    type: multipleChoice
    prompt: Identify the hypothesis in your own words.
    difficultyDimensions:
    - representationTransfer
    - scopeTracking
    choices:
    - id: a
      text: The assumption is that n is an even integer.
      issueSignals: []
    - id: b
      text: The assumption is that n squared is even.
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: c
      text: The assumption is that all integers are even.
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: d
      text: The assumption is that n is any integer.
      issueSignals:
      - id: mathematical-structure-recognition-error
    answer:
      choiceId: a
    explanation: |-
      Solution: The assumption is that n is even.
      Why it works: A conditional begins with its hypothesis; it is the information available to a reader of the proof.
      Why the other choices fail: The hypothesis is the "if" part, not the "then" part (n squared is even). It restricts n to even integers, not all integers or any integer.
  - id: step-2
    title: Name the bridge
    type: multipleChoice
    prompt: What definition can turn the hypothesis into a usable expression?
    difficultyDimensions:
    - definitionUse
    - argumentMapping
    choices:
    - id: a
      text: 'Use the definition of even: n equals two times an integer.'
      issueSignals: []
    - id: b
      text: 'Use the definition of square: n multiplied by itself.'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: c
      text: 'Use the definition of integer: a whole number.'
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: d
      text: Use the definition of an equation.
      issueSignals:
      - id: mathematical-structure-recognition-error
    answer:
      choiceId: a
    explanation: |-
      Solution: Use the definition of an even integer.
      Why it works: Definitions license replacing a named property with its stated structural form.
      Why the other choices fail: We need to translate the hypothesis ("n is even") into an expression. The definition of square or integer does not help us write down what "n is even" means mathematically.
  - id: step-3
    title: State the conclusion
    type: multipleChoice
    prompt: Explain why the final claim follows.
    difficultyDimensions:
    - argumentMapping
    - conclusionCheck
    choices:
    - id: a
      text: The square has the form two times an integer, so it is even.
      issueSignals: []
    - id: b
      text: Because we assumed the square is even.
      issueSignals:
      - id: logical-fallacy
    - id: c
      text: Because squaring an even number gives a larger number.
      issueSignals:
      - id: mathematical-structure-recognition-error
    - id: d
      text: The square is an integer, so it must be even.
      issueSignals:
      - id: mathematical-structure-recognition-error
    answer:
      choiceId: a
    explanation: |-
      Solution: The square has the form two times an integer, so it is even.
      Why it works: The conclusion follows by the same definition used to interpret the hypothesis.
      Why the other choices fail: The claim is not assumed; it must be shown. Squaring an even number giving a larger number doesn't prove it's even. Not all integers are even.
