questions:
- id: rel-mot-sym-1
  title: River Crossing Time
  type: symbolicResponse
  prompt: 'A boat heads directly across a river of width $w$ with a speed $v_b$ relative to the water. The river flows with speed $v_r$ relative to the shore. What is the total time $t$ it takes to cross the river?'
  answer:
    gradingMode: auto
    expectedLatex: w/v_b
    equivalenceMode: expression
    tolerance: 0
  explanation: 'The motion across the river is determined entirely by the component of velocity perpendicular to the shore ($v_b$). Time is distance divided by this velocity: $t = w/v_b$.'
- id: rel-mot-sym-2
  title: Downstream Drift Distance
  type: symbolicResponse
  prompt: 'A boat heads directly across a river of width $w$ with a speed $v_b$ relative to the water. The river flows with speed $v_r$ relative to the shore. What is the distance $d$ it is carried downstream before reaching the opposite shore?'
  answer:
    gradingMode: auto
    expectedLatex: v_r * (w/v_b)
    equivalenceMode: expression
    tolerance: 0
  explanation: 'The time to cross is $t = w/v_b$. During this time, the river carries the boat downstream at speed $v_r$. Thus, $d = v_r t = v_r (w/v_b)$.'
- id: rel-mot-sym-3
  title: Crosswind and Ground Speed
  type: symbolicResponse
  prompt: 'A plane flies with airspeed $v_p$ due north. There is a crosswind blowing due east with speed $v_w$. What is the magnitude of the plane''s velocity relative to the ground, $v_g$?'
  answer:
    gradingMode: auto
    expectedLatex: \sqrt{v_p^2 + v_w^2}
    equivalenceMode: expression
    tolerance: 0
  explanation: 'The velocities are perpendicular vectors. Using the Pythagorean theorem, the magnitude is $\sqrt{v_p^2 + v_w^2}$.'
