lesson:
  introduction: |-
    Sometimes the equation of a circle is expanded out, hiding its center and radius. To extract this information, we must use an algebraic technique called **Completing the Square** to force the equation back into standard form.
  sections:
  - id: sec-expanded-form
    title: Expanded Form
    required: true
    content: |-
      The expanded (or general) form of a circle looks something like this:
      $$x^2 + y^2 - 6x + 8y - 11 = 0$$
      
      We cannot easily tell what the center or radius is! We need it to look like $(x - h)^2 + (y - k)^2 = r^2$.

  - id: sec-completing-square
    title: The Steps to Complete the Square
    required: true
    content: |-
      1. **Group the variables**: Put the $x$ terms together and the $y$ terms together. Move any constant numbers to the other side of the equals sign.
         $$(x^2 - 6x) + (y^2 + 8y) = 11$$
         
      2. **Find the magic numbers**: For the $x$ group, take half of the $x$ coefficient and square it: $(-6/2)^2 = (-3)^2 = 9$.
         For the $y$ group, take half of the $y$ coefficient and square it: $(8/2)^2 = 4^2 = 16$.
         
      3. **Add to both sides**: Add these magic numbers inside the parentheses AND to the right side of the equation to keep it balanced.
         $$(x^2 - 6x + 9) + (y^2 + 8y + 16) = 11 + 9 + 16$$
         
      4. **Factor**: Because we "completed the square", the parentheses perfectly factor into perfect squares!
         $$(x - 3)^2 + (y + 4)^2 = 36$$
         
      Now the equation is in standard form! The center is $(3, -4)$ and the radius is $\sqrt{36} = 6$.

questions:
- id: q-geom-ceq2-1
  title: Concept Check - Finding the Magic Number
  prompt: |-
    If you are completing the square for the expression $(x^2 + 10x)$, what number must you add to complete the square?
  type: numericResponse
  answer:
    numericValue: 25
    tolerance: 0
  explanation: |-
    Take the coefficient of $x$, which is $10$. Divide it by $2$ to get $5$. Then square it to get $25$. The completed square is $(x^2 + 10x + 25)$, which factors perfectly into $(x + 5)^2$.
  skills:
  - geometry-circle-equations-coordinate

- id: q-geom-ceq2-2
  title: Concept Check - Balancing the Equation
  prompt: |-
    When completing the square for a circle's equation, if you add $16$ to the left side of the equation to complete the $y$ group, what must you do to the right side?
  type: multipleChoice
  choices:
  - id: c1
    text: Subtract 16
  - id: c2
    text: Add 16
  - id: c3
    text: Add 4 (the square root)
  answer:
    choiceId: c2
  explanation: |-
    The golden rule of algebra: whatever you do to one side of the equation, you must do to the other side to keep it balanced. If you add $16$ on the left, you must **add 16** on the right!
  skills:
  - geometry-circle-equations-coordinate
