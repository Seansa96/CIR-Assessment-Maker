lesson:
  introduction: 'This lesson introduces Operating System Design through the mental models emphasized by 12 Operating System
    Design. Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: design-requirements
    title: Design requirements
    required: true
    content: 'An OS design starts from goals such as reliability, performance, portability, security, maintainability, and
      compatibility.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Optimizing one goal often stresses another.

      '
    check:
      id: design-requirements-check
      title: 'Check: Design requirements'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Design requirements**?

        '
      choices:
      - id: a
        text: An OS design starts from goals such as reliability, performance, portability, security, maintainability, and
          compatibility.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'An OS design starts from goals such as reliability, performance, portability, security, maintainability,
        and compatibility. Related topic: Operating System Design.

        '
  - id: abstraction-choice
    title: Abstraction choice
    required: true
    content: 'Good OS abstractions hide accidental hardware complexity while exposing enough control for useful programs.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Hiding too much can block performance or flexibility.

      '
    check:
      id: abstraction-choice-check
      title: 'Check: Abstraction choice'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Abstraction choice**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Good OS abstractions hide accidental hardware complexity while exposing enough control for useful programs.
      answer:
        choiceId: d
      explanation: 'Good OS abstractions hide accidental hardware complexity while exposing enough control for useful programs.
        Related topic: Operating System Design.

        '
  - id: modularity
    title: Modularity
    required: true
    content: 'Modular boundaries make systems easier to reason about, test, and replace.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A boundary that is too chatty can hurt performance.

      '
    check:
      id: modularity-check
      title: 'Check: Modularity'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Modularity**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Modular boundaries make systems easier to reason about, test, and replace.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Modular boundaries make systems easier to reason about, test, and replace. Related topic: Operating System
        Design.

        '
  - id: reliability
    title: Reliability
    required: true
    content: 'Reliability improves when faults are isolated, interfaces are narrow, and recovery paths are designed intentionally.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Reliability is not added only by testing at the end.

      '
    check:
      id: reliability-check
      title: 'Check: Reliability'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Reliability**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Reliability improves when faults are isolated, interfaces are narrow, and recovery paths are designed intentionally.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Reliability improves when faults are isolated, interfaces are narrow, and recovery paths are designed
        intentionally. Related topic: Operating System Design.

        '
  - id: performance-tradeoffs
    title: Performance tradeoffs
    required: true
    content: 'Caching, batching, zero-copy paths, and fast common cases improve performance but complicate correctness.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      A faster mechanism that breaks isolation is not a good OS tradeoff.

      '
    check:
      id: performance-tradeoffs-check
      title: 'Check: Performance tradeoffs'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Performance tradeoffs**?

        '
      choices:
      - id: a
        text: Caching, batching, zero-copy paths, and fast common cases improve performance but complicate correctness.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'Caching, batching, zero-copy paths, and fast common cases improve performance but complicate correctness.
        Related topic: Operating System Design.

        '
  - id: evolution
    title: Evolution
    required: true
    content: 'Operating systems must evolve while preserving compatibility with programs, users, and hardware ecosystems.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Compatibility can dominate otherwise clean design decisions.

      '
    check:
      id: evolution-check
      title: 'Check: Evolution'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Evolution**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Operating systems must evolve while preserving compatibility with programs, users, and hardware ecosystems.
      answer:
        choiceId: d
      explanation: 'Operating systems must evolve while preserving compatibility with programs, users, and hardware ecosystems.
        Related topic: Operating System Design.

        '
