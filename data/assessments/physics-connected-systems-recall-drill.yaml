items:
  - { id: csr1, type: cloze, prompt: 'A taut ideal string transmits ____.', answer: { expected: tension, expectedLatex: 'T', aliases: [], media: [] }, explanation: 'Solution: Tension.\n\nWhy it works: The string pulls along its length.', tags: [tension] }
  - { id: csr2, type: typed, prompt: 'What motion quantity do ideal connected masses share?', answer: { expected: 'acceleration magnitude', expectedLatex: 'a', aliases: [acceleration], media: [] }, explanation: 'Solution: Acceleration magnitude.\n\nWhy it works: Fixed string length constrains linked motion.', tags: [constraint] }
  - { id: csr3, type: cloze, prompt: 'An Atwood machine has two masses and a ____.', answer: { expected: pulley, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Pulley.\n\nWhy it works: The string passes over a pulley.', tags: [Atwood] }
  - { id: csr4, type: typed, prompt: 'What law is applied to each mass in a connected system?', answer: { expected: 'newtons second law', expectedLatex: '\sum F=ma', aliases: ['Newton''s second law'], media: [] }, explanation: 'Solution: Newton''s second law.\n\nWhy it works: It relates each mass''s forces to acceleration.', tags: [law] }
  - { id: csr5, type: cloze, prompt: 'Tension is internal when connected objects are treated as one ____.', answer: { expected: system, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: System.\n\nWhy it works: It acts between the system''s member objects.', tags: [system] }
  - { id: csr6, type: typed, prompt: 'What diagram identifies forces on each connected object?', answer: { expected: 'free body diagram', expectedLatex: '', aliases: [FBD], media: [] }, explanation: 'Solution: Free-body diagram.\n\nWhy it works: It isolates external forces on that object.', tags: [model] }
