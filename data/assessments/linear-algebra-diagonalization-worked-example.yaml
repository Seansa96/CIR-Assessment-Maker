workedExamples:
  - id: ex-diagonalization-pipeline
    title: Constructing P and D to Diagonalize A
    problem: |
      Let $A = \begin{bmatrix}4 & -3 \\ 2 & -1\end{bmatrix}$. 
      Find an invertible matrix $P$ and a diagonal matrix $D$ such that $A = PDP^{-1}$.
    steps:
      - id: step1
        title: Find the eigenvalues to form D
        instruction: |
          First, solve the characteristic equation $\det(A - \lambda I) = 0$.
          $A - \lambda I = \begin{bmatrix}4-\lambda & -3 \\ 2 & -1-\lambda\end{bmatrix}$.
          $\det(A - \lambda I) = (4-\lambda)(-1-\lambda) - (-3)(2) = -4 - 4\lambda + \lambda + \lambda^2 + 6 = \lambda^2 - 3\lambda + 2$.
          Factoring $\lambda^2 - 3\lambda + 2 = 0$ gives $(\lambda - 1)(\lambda - 2) = 0$.
          The eigenvalues are $\lambda_1 = 1$ and $\lambda_2 = 2$.
          These become the diagonal entries of $D$.
        type: symbolicResponse
        prompt: |
          What is the diagonal matrix $D$? (Place the eigenvalues in ascending order down the diagonal).
        answer:
          expectedLatex: '\begin{bmatrix} 1 & 0 \\ 0 & 2 \end{bmatrix}'
          equivalenceMode: expression
          tolerance: 0
          aliases:
            - '\begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix}'
        explanation: |
          $D = \begin{bmatrix}1 & 0 \\ 0 & 2\end{bmatrix}$. The order we place them on the diagonal will dictate the order we must place the eigenvectors in $P$.

      - id: step2
        title: Find the eigenvectors to form P
        instruction: |
          For $\lambda_1 = 1$:
          $A - 1I = \begin{bmatrix}3 & -3 \\ 2 & -2\end{bmatrix}$. 
          Solving $(A-I)\vec{x} = \vec{0}$ gives $3x_1 - 3x_2 = 0 \implies x_1 = x_2$.
          A basis vector for this eigenspace is $\vec{v}_1 = \begin{bmatrix}1\\1\end{bmatrix}$.

          For $\lambda_2 = 2$:
          $A - 2I = \begin{bmatrix}2 & -3 \\ 2 & -3\end{bmatrix}$.
          Solving $(A-2I)\vec{x} = \vec{0}$ gives $2x_1 - 3x_2 = 0 \implies x_1 = \frac{3}{2}x_2$.
          To avoid fractions, let $x_2 = 2$, which gives $x_1 = 3$.
          A basis vector for this eigenspace is $\vec{v}_2 = \begin{bmatrix}3\\2\end{bmatrix}$.

          Now assemble $P = \begin{bmatrix}\vec{v}_1 & \vec{v}_2\end{bmatrix}$.
        type: symbolicResponse
        prompt: |
          What is the matrix $P$? (Match the column order to the eigenvalue order in $D$).
        answer:
          expectedLatex: '\begin{bmatrix} 1 & 3 \\ 1 & 2 \end{bmatrix}'
          equivalenceMode: expression
          tolerance: 0
          aliases:
            - '\begin{pmatrix} 1 & 3 \\ 1 & 2 \end{pmatrix}'
        explanation: |
          The first column corresponds to $\lambda_1 = 1$ and the second column corresponds to $\lambda_2 = 2$.
          So $P = \begin{bmatrix}1 & 3 \\ 1 & 2\end{bmatrix}$.

      - id: step3
        title: Verify the diagonalization equation AP = PD
        instruction: |
          To ensure we didn't make a mistake, we can verify that $A = PDP^{-1}$. It is usually easier to multiply by $P$ on the right and verify the equivalent equation $AP = PD$, because it avoids calculating $P^{-1}$.

          Compute $AP = \begin{bmatrix}4 & -3 \\ 2 & -1\end{bmatrix} \begin{bmatrix}1 & 3 \\ 1 & 2\end{bmatrix} = \begin{bmatrix}4(1)-3(1) & 4(3)-3(2) \\ 2(1)-1(1) & 2(3)-1(2)\end{bmatrix} = \begin{bmatrix}1 & 6 \\ 1 & 4\end{bmatrix}$.

          Now compute $PD$.
        type: symbolicResponse
        prompt: |
          Compute $PD$. Enter the resulting matrix.
        answer:
          expectedLatex: '\begin{bmatrix} 1 & 6 \\ 1 & 4 \end{bmatrix}'
          equivalenceMode: expression
          tolerance: 0
          aliases:
            - '\begin{pmatrix} 1 & 6 \\ 1 & 4 \end{pmatrix}'
        explanation: |
          $PD = \begin{bmatrix}1 & 3 \\ 1 & 2\end{bmatrix} \begin{bmatrix}1 & 0 \\ 0 & 2\end{bmatrix} = \begin{bmatrix}1(1)+3(0) & 1(0)+3(2) \\ 1(1)+2(0) & 1(0)+2(2)\end{bmatrix} = \begin{bmatrix}1 & 6 \\ 1 & 4\end{bmatrix}$.
          Since $AP = PD$, our factorization is correct!
