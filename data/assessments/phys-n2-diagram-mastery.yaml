questions:
  - id: n2-diag-q01
    title: Net Force and Acceleration Vectors
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] In a free body diagram, a block has a $10\text{ N}$ force pointing East and a $4\text{ N}$ force pointing West. Which direction does the acceleration vector ($\vec{a}$) point?
    choices:
      - id: a
        text: East
      - id: b
        text: West
      - id: c
        text: It depends on the velocity of the block.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** According to Newton's Second Law ($\vec{F}_\text{net} = m\vec{a}$), the acceleration vector *always* points in the exact same direction as the net force vector. Here, the net force is $6\text{ N}$ East, so acceleration must be East.

  - id: n2-diag-q02
    title: Elevator Accelerating Upwards
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A person stands on a scale in an elevator. The elevator is accelerating UPWARDS. In the person's free body diagram, how should the normal force ($N$) from the scale compare to gravity ($mg$)?
    choices:
      - id: a
        text: The normal force arrow must be drawn longer than the gravity arrow.
      - id: b
        text: The normal force arrow must be drawn shorter than the gravity arrow.
      - id: c
        text: They must be exactly equal in length.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** To accelerate upwards, there must be a net upward force. Therefore, the upward force ($N$) must be strictly greater than the downward force ($mg$). The scale will read a value higher than their true weight.

  - id: n2-diag-q03
    title: Elevator Moving Up at Constant Velocity
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A person stands in an elevator moving UPWARDS at a steady $5\text{ m/s}$. In the person's free body diagram, how should the normal force ($N$) compare to gravity ($mg$)?
    choices:
      - id: a
        text: The normal force arrow must be drawn longer than the gravity arrow.
      - id: b
        text: The normal force arrow must be drawn shorter than the gravity arrow.
      - id: c
        text: They must be exactly equal in length.
    answer:
      choiceId: c
    explanation: |
      **Instructor Notes:** Constant velocity means zero acceleration. By Newton's Second Law, zero acceleration means zero net force. Therefore, the upward force ($N$) must perfectly balance the downward force ($mg$), regardless of the direction of motion.

  - id: n2-diag-q04
    title: Block accelerating down an incline
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A block slides down a frictionless incline. The coordinate system is tilted so the x-axis is parallel to the ramp. In this diagram, what is the net force in the y-direction (perpendicular to the ramp)?
    choices:
      - id: a
        text: Zero. The normal force exactly balances the perpendicular component of gravity.
      - id: b
        text: It points into the ramp.
      - id: c
        text: It points away from the ramp.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The block does not accelerate through the solid ramp or fly off it. Since $a_y = 0$, the net force in the y-direction must be zero. $N = mg\cos\theta$.

  - id: n2-diag-q05
    title: Two blocks pushed together
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] You push a large Block A (mass $3m$) with a horizontal force $F$. Block A pushes against a smaller Block B (mass $m$). They accelerate together across a frictionless floor. In the free body diagram for Block B, what is the only horizontal force acting on it?
    choices:
      - id: a
        text: The normal contact force from Block A.
      - id: b
        text: The external force $F$.
      - id: c
        text: The inertia of Block B.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Only forces from direct physical contact or gravity act on Block B. You are pushing A, not B. Block A pushes B via a normal contact force. This is the only horizontal force on B.

  - id: n2-diag-q06
    title: Atwood Machine (Two hanging masses)
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] In a standard Atwood machine, $m_1 = 5\text{ kg}$ and $m_2 = 2\text{ kg}$ hang from a massless string over a frictionless pulley. If you draw the free body diagram for $m_1$, how should the Tension ($T$) arrow compare to its gravity ($m_1 g$) arrow?
    choices:
      - id: a
        text: The gravity arrow should be longer than the Tension arrow.
      - id: b
        text: The Tension arrow should be longer than the gravity arrow.
      - id: c
        text: They should be equal in length.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Since $m_1$ is heavier, it will accelerate downwards. To have a downward acceleration, the downward force ($m_1 g$) must be greater than the upward force ($T$).

  - id: n2-diag-q07
    title: Atwood Machine (Lighter mass)
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] In the same Atwood machine ($m_1 = 5\text{ kg}$, $m_2 = 2\text{ kg}$), look at the free body diagram for the lighter mass $m_2$. How should the Tension ($T$) arrow compare to its gravity ($m_2 g$) arrow?
    choices:
      - id: a
        text: The Tension arrow should be longer than the gravity arrow.
      - id: b
        text: The gravity arrow should be longer than the Tension arrow.
      - id: c
        text: They should be equal in length.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** The lighter mass $m_2$ will accelerate UPWARDS. To have an upward acceleration, the upward force ($T$) must be strictly greater than the downward force ($m_2 g$).

  - id: n2-diag-q08
    title: Circular Motion (Car around a curve)
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A top-down diagram shows a car driving in a circle at a constant speed. Which arrow correctly represents the net force on the car?
    choices:
      - id: a
        text: An arrow pointing exactly towards the center of the circle.
      - id: b
        text: An arrow pointing forward, tangent to the circle.
      - id: c
        text: An arrow pointing diagonally outward (centrifugal force).
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Uniform circular motion requires a centripetal (center-seeking) acceleration. By Newton's Second Law, the net force must point in the exact same direction as the acceleration: towards the center.

  - id: n2-diag-q09
    title: Skydiver opening parachute
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A skydiver is falling at $50\text{ m/s}$ (terminal velocity). She opens her parachute and rapidly slows down to $5\text{ m/s}$. During the brief time she is actively slowing down, what does her free body diagram look like?
    choices:
      - id: a
        text: The upward drag force from the parachute is drawn much longer than the downward gravity force.
      - id: b
        text: The upward drag force is drawn exactly equal to the downward gravity force.
      - id: c
        text: The downward gravity force is drawn much longer than the upward drag force.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** She is moving DOWN but slowing down, meaning her acceleration is UP. To accelerate upwards, the net force must be upwards. Therefore, the upward drag must vastly exceed her weight during deployment.

  - id: n2-diag-q10
    title: Tension in a swinging pendulum
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A pendulum bob swings through its lowest point. In the free body diagram at this exact bottom position, how does the upward Tension ($T$) compare to downward gravity ($mg$)?
    choices:
      - id: a
        text: Tension is longer than gravity.
      - id: b
        text: Tension is equal to gravity.
      - id: c
        text: Tension is shorter than gravity.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** At the lowest point, it is moving in a circular arc, requiring an upward centripetal acceleration ($v^2/R$). Since acceleration is UP, the net force must be UP. Thus, $T > mg$.

  - id: n2-diag-q11
    title: Apparent Weight at top of Ferris Wheel
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] You are sitting on a Ferris wheel that rotates at a constant speed. At the very top of the ride, what is the relationship between the upward normal force ($N$) from the seat and your downward weight ($mg$)?
    choices:
      - id: a
        text: The normal force arrow is drawn shorter than gravity.
      - id: b
        text: The normal force arrow is drawn equal to gravity.
      - id: c
        text: The normal force arrow is drawn longer than gravity.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** At the top, the center of the circle is BELOW you. You need a net force pointing DOWN to maintain circular motion. Therefore, downward gravity must be greater than the upward normal force ($mg > N$), making you feel lighter.

  - id: n2-diag-q12
    title: Car accelerating, dangling fuzzy dice
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A car accelerates to the right. Fuzzy dice hang from the rearview mirror at an angle, trailing backwards relative to the car. In the free body diagram of the dice (from an inertial frame outside the car), what provides the horizontal net force?
    choices:
      - id: a
        text: The horizontal component of the tension in the string.
      - id: b
        text: A backward "fictitious force" pushing it left.
      - id: c
        text: Gravity pointing diagonally.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** From an outside frame, the dice are accelerating to the right along with the car. The only physical forces are gravity (down) and tension (up and right). The rightward component of tension ($T\sin\theta$) provides the required $ma$.

  - id: n2-diag-q13
    title: Pushing two blocks (comparing forces)
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A $10\text{ N}$ force pushes a $3\text{ kg}$ block, which pushes a $2\text{ kg}$ block across frictionless ice. Compare the force the $3\text{ kg}$ block exerts on the $2\text{ kg}$ block ($F_{32}$) to the initial $10\text{ N}$ push.
    choices:
      - id: a
        text: $F_{32}$ is exactly $10\text{ N}$.
      - id: b
        text: $F_{32}$ is less than $10\text{ N}$.
      - id: c
        text: $F_{32}$ is greater than $10\text{ N}$.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** The whole system ($5\text{ kg}$) accelerates at $2\text{ m/s}^2$. For the $2\text{ kg}$ block to accelerate at $2\text{ m/s}^2$, it needs a net force of $F = ma = 2(2) = 4\text{ N}$. Thus, $F_{32}$ is only $4\text{ N}$, which is less than the total $10\text{ N}$ pushing both.

  - id: n2-diag-q14
    title: Dragging a sled with an angled rope
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] You drag a sled across level snow with a rope pulled at an angle $30°$ above the horizontal. The sled accelerates. Which force is responsible for the forward acceleration in the free body diagram?
    choices:
      - id: a
        text: The horizontal component of the Tension.
      - id: b
        text: The total Tension.
      - id: c
        text: The normal force.
    answer:
      choiceId: a
    explanation: |
      **Instructor Notes:** Only forces (or components of forces) in the direction of motion contribute to acceleration in that direction. The forward driving force is $T\cos\theta$.

  - id: n2-diag-q15
    title: Unbalanced Forces vs Balanced Forces
    type: multipleChoice
    prompt: |
      [Diagram Interpretation] A free body diagram has four arrows: $10\text{ N}$ North, $10\text{ N}$ South, $5\text{ N}$ East, $5\text{ N}$ West. What can you definitively say about the motion of this object?
    choices:
      - id: a
        text: The object is at rest.
      - id: b
        text: The object has a constant velocity (which could be zero).
      - id: c
        text: The object is moving East but slowing down.
    answer:
      choiceId: b
    explanation: |
      **Instructor Notes:** The forces are perfectly balanced in all directions ($F_\text{net} = 0$). By Newton's First and Second laws, $a = 0$. This means the velocity is constant. It could be resting, or moving steadily in any direction.
