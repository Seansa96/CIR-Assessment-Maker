schemaVersion: 1
id: phys-n2-diagram-mastery
title: Newton's Laws - Diagram Interpretation
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
- physics-newton-laws
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - diagrams
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
questions:
- id: n2-diag-ramp-1
  type: multipleChoice
  prompt: '[Diagram Interpretation] In a standard inclined plane FBD tilted at angle
    $\theta$, the gravity vector $mg$ points straight down. What is the component
    of gravity perpendicular to the plane?'
  choices:
  - id: a
    text: $mg \cos\theta$
  - id: b
    text: $mg \sin\theta$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** Students must memorize or quickly derive the
    geometry: perpendicular is cosine, parallel is sine for the standard ramp.'
- id: n2-diag-atwood-1
  type: multipleChoice
  prompt: '[Diagram Interpretation] In an Atwood machine diagram, $m_1 < m_2$. If
    we assign ''up'' as positive for $m_1$, what MUST be the positive direction for
    $m_2$ to write a coupled system of equations $a_1 = a_2 = a$?'
  choices:
  - id: a
    text: Down
  - id: b
    text: Up
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The coordinate system must ''bend'' around the
    pulley. If $m_1$ accelerating up is positive, $m_2$ accelerating down must also
    be positive.'
