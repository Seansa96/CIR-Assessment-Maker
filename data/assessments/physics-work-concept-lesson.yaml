sections:
- id: intro-work
  title: What is Work?
  content: 'In everyday language, "work" means any physical or mental effort. In physics,
    **Work ($W$)** has a very precise definition: it is the energy transferred to
    or from an object via the application of force along a displacement.


    * If the force transfers energy *to* the object, the work is positive.

    * If the force transfers energy *away* from the object, the work is negative.


    The SI unit for Work is the **Joule (J)**, where $1 \text{ J} = 1 \text{ N}\cdot\text{m}$.

    '
- id: constant-force
  title: Work Done by a Constant Force
  content: 'For a constant force $\vec{F}$ acting on an object that undergoes a straight-line
    displacement $\Delta \vec{r}$, the work done is the **dot product** of the force
    and displacement vectors:


    $$ W = \vec{F} \cdot \Delta \vec{r} = |\vec{F}| |\Delta \vec{r}| \cos \theta $$


    where $\theta$ is the angle between the force vector and the displacement vector.

    * If $\theta < 90^\circ$ (force and displacement are generally in the same direction),
    $W > 0$.

    * If $\theta = 90^\circ$ (force is perpendicular to displacement), $W = 0$.

    * If $\theta > 90^\circ$ (force and displacement are generally in opposite directions),
    $W < 0$.

    '
- id: varying-force
  title: Work Done by a Varying Force
  content: 'In Calculus-based physics, if the force varies with position, we must
    use integration. Work is the **line integral** of force over the path of the object:


    $$ W = \int_{\vec{r}_i}^{\vec{r}_f} \vec{F} \cdot d\vec{r} $$


    In one dimension (e.g., along the x-axis), this simplifies to:

    $$ W = \int_{x_i}^{x_f} F(x) \, dx $$


    Graphically, this means work is the **area under the Force vs. Position curve**.


    ![Work as Area Under Curve](/media/physics/work-area-graph.png)

    '
lesson:
  introduction: Work
  sections:
  - id: sec-q001
    title: 'You push a heavy box across a level floor at a constant speed by applying
      a\rhorizontal force. The work done by the normal force (from the floor) on the
      box is:'
    content: |
      You push a heavy box across a level floor at a constant speed by applying a\rhorizontal force. The work done by the normal force (from the floor) on the box is:
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: Positive
      - id: b
        text: Negative
      - id: c
        text: Zero
      - id: d
        text: Depends on the mass of the box
      answer:
        choiceId: c
      explanation: |
        The normal force points vertically upward, while the displacement is\rhorizontal. The angle between them is $90^\circ$. Since $\cos(90^\circ) = 0$, the work done by the normal force is zero.
