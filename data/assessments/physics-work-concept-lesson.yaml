sections:
- id: intro-work
  title: What is Work?
  content: 'In everyday language, "work" means any physical or mental effort. In physics,
    **Work ($W$)** has a very precise definition: it is the energy transferred to
    or from an object via the application of force along a displacement.


    * If the force transfers energy *to* the object, the work is positive.

    * If the force transfers energy *away* from the object, the work is negative.


    The SI unit for Work is the **Joule (J)**, where $1 \text{ J} = 1 \text{ N}\cdot\text{m}$.

    '
- id: constant-force
  title: Work Done by a Constant Force
  content: 'For a constant force $\vec{F}$ acting on an object that undergoes a straight-line
    displacement $\Delta \vec{r}$, the work done is the **dot product** of the force
    and displacement vectors:


    $$ W = \vec{F} \cdot \Delta \vec{r} = |\vec{F}| |\Delta \vec{r}| \cos \theta $$


    where $\theta$ is the angle between the force vector and the displacement vector.

    * If $\theta < 90^\circ$ (force and displacement are generally in the same direction),
    $W > 0$.

    * If $\theta = 90^\circ$ (force is perpendicular to displacement), $W = 0$.

    * If $\theta > 90^\circ$ (force and displacement are generally in opposite directions),
    $W < 0$.

    '
- id: varying-force
  title: Work Done by a Varying Force
  content: 'In Calculus-based physics, if the force varies with position, we must
    use integration. Work is the **line integral** of force over the path of the object:


    $$ W = \int_{\vec{r}_i}^{\vec{r}_f} \vec{F} \cdot d\vec{r} $$


    In one dimension (e.g., along the x-axis), this simplifies to:

    $$ W = \int_{x_i}^{x_f} F(x) \, dx $$


    Graphically, this means work is the **area under the Force vs. Position curve**.


    ![Work as Area Under Curve](/media/physics/work-area-graph.png)

    '
lesson:
  introduction: Work
  sections:
  - id: sec-q001
    title: 'You push a heavy box across a level floor at a constant speed by applying
      a\rhorizontal force. The work done by the normal force (from the floor) on the
      box is:'
    content: |
      You push a heavy box across a level floor at a constant speed by applying a\rhorizontal force. The work done by the normal force (from the floor) on the box is:
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: Positive
      - id: b
        text: Negative
      - id: c
        text: Zero
      - id: d
        text: Depends on the mass of the box
      answer:
        choiceId: c
      explanation: |
        Solution: The normal force does zero work.

        Why it works: It is perpendicular to the horizontal displacement, so $\cos90^\circ=0$.

        Why the other choices fail: A perpendicular force transfers no energy through the displacement.
  - { id: work-sec2, title: Parallel force component, content: 'Only the component parallel to displacement does work: $W=Fd\cos\theta$.', check: { id: work-c2, type: multipleChoice, prompt: 'A 10 N force acts along a 3 m displacement. What work does it do?', choices: [{ id: a, text: '$30$ J', issueSignals: [] }, { id: b, text: '$3.3$ J', issueSignals: [{ id: divided-force-distance, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: $W=(10)(3)=30$ J.\n\nWhy it works: Force and displacement are parallel.\n\nWhy the other choices fail: Work is force times displacement, not their quotient.' } }
  - { id: work-sec3, title: Sign of work, content: 'A force in the same direction as displacement does positive work; an opposing force does negative work.', check: { id: work-c3, type: multipleChoice, prompt: 'What sign is the work done by kinetic friction on a sliding box?', choices: [{ id: a, text: 'Negative', issueSignals: [] }, { id: b, text: 'Positive', issueSignals: [{ id: friction-work-sign, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: Friction does negative work.\n\nWhy it works: It points opposite the displacement.\n\nWhy the other choices fail: Positive work would add kinetic energy.' } }
  - { id: work-sec4, title: Perpendicular forces, content: 'A force perpendicular to displacement has zero dot product and does no work, even if its magnitude is large.', check: { id: work-c4, type: multipleChoice, prompt: 'Which force usually does zero work on a block moving horizontally along a level surface?', choices: [{ id: a, text: 'Normal force', issueSignals: [] }, { id: b, text: 'Applied horizontal force', issueSignals: [{ id: perpendicular-force-confusion, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: The normal force does zero work.\n\nWhy it works: It is vertical while displacement is horizontal.\n\nWhy the other choices fail: A parallel applied force can transfer energy.' } }
  - { id: work-sec5, title: Varying force, content: 'For a position-dependent one-dimensional force, $W=\int F(x)dx$.', check: { id: work-c5, type: multipleChoice, prompt: 'What mathematical operation finds work from a varying force $F(x)$?', choices: [{ id: a, text: 'Integrate $F(x)$ over position', issueSignals: [] }, { id: b, text: 'Differentiate $F(x)$', issueSignals: [{ id: integral-derivative-confusion, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: Integrate force over displacement.\n\nWhy it works: Work accumulates small contributions $dW=Fdx$.\n\nWhy the other choices fail: A derivative gives a rate of force change, not accumulated work.' } }
  - { id: work-sec6, title: Force-position graph, content: 'The signed area under an $F_x$ versus $x$ graph is work. Area below the axis counts negative.', check: { id: work-c6, type: multipleChoice, prompt: 'On an $F_x$-versus-$x$ graph, area below the x-axis represents what?', choices: [{ id: a, text: 'Negative work', issueSignals: [] }, { id: b, text: 'Zero work', issueSignals: [{ id: graph-area-sign, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: It represents negative work.\n\nWhy it works: The force component is negative over that displacement.\n\nWhy the other choices fail: Only zero area gives zero work.' } }
  - { id: work-sec7, title: Units and energy transfer, content: 'One joule is one newton-meter. Work is energy transferred into or out of an object by a force acting through displacement.', check: { id: work-c7, type: multipleChoice, prompt: 'Which unit is equivalent to one joule?', choices: [{ id: a, text: 'N m', issueSignals: [] }, { id: b, text: 'N/s', issueSignals: [{ id: work-unit-error, domains: [physics-1] }] }], answer: { choiceId: a }, explanation: 'Solution: $1$ J equals $1$ N m.\n\nWhy it works: Work is force times displacement.\n\nWhy the other choices fail: N/s is not an energy unit.' } }
