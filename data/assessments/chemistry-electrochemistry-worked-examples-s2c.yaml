workedExamples:
  - id: acidic-redox-balance
    title: Balance a redox reaction in acidic solution
    problem: 'Balance $MnO_4^-+Fe^{2+}\rightarrow Mn^{2+}+Fe^{3+}$ in acidic solution and verify conservation of atoms and charge.'
    steps:
      - id: e1s1
        title: Separate the electron-transfer halves
        instruction: 'Identify which species loses an electron and which gains electrons before adding water or hydrogen ions.'
        type: freeResponse
        prompt: 'Write the unscaled iron oxidation half-reaction.'
        answer: { gradingMode: selfCheck, keyPoints: ['$Fe^{2+}\rightarrow Fe^{3+}+e^-$'] }
        explanation: 'Solution: $Fe^{2+}\rightarrow Fe^{3+}+e^-$. Why it works: Iron increases from +2 to +3, so one electron must appear on the product side.'
      - id: e1s2
        title: Balance the permanganate reduction
        instruction: 'Balance O with water, H with $H^+$, and charge with electrons.'
        type: freeResponse
        prompt: 'Write the balanced manganese reduction half-reaction in acidic solution.'
        answer: { gradingMode: selfCheck, keyPoints: ['$MnO_4^-+8H^++5e^-\rightarrow Mn^{2+}+4H_2O$'] }
        explanation: 'Solution: $MnO_4^-+8H^++5e^-\rightarrow Mn^{2+}+4H_2O$. Why it works: Four waters balance O, eight protons balance H, and five electrons make both sides total charge +2.'
      - id: e1s3
        title: Cancel electrons and verify
        instruction: 'Multiply the iron half-reaction by five, add the halves, and audit every element and the total charge.'
        type: freeResponse
        prompt: 'Write the balanced net ionic equation and state the charge on each side.'
        answer: { gradingMode: selfCheck, keyPoints: ['$MnO_4^-+8H^++5Fe^{2+}\rightarrow Mn^{2+}+4H_2O+5Fe^{3+}$', 'charge +17 on each side'] }
        explanation: 'Solution: $MnO_4^-+8H^++5Fe^{2+}\rightarrow Mn^{2+}+4H_2O+5Fe^{3+}$. Each side has charge +17. Why it works: Five electrons lost by iron cancel the five gained by permanganate; Mn, Fe, O, H, and charge are conserved.'
  - id: zinc-copper-cell
    title: Construct and analyze a zinc–copper galvanic cell
    problem: 'A standard cell uses $Zn^{2+}/Zn$ with $E^\circ_{red}=-0.76\ \mathrm{V}$ and $Cu^{2+}/Cu$ with $E^\circ_{red}=+0.34\ \mathrm{V}$. Identify the electrodes, write cell notation, and calculate $E^\circ_{cell}$.'
    steps:
      - id: e2s1
        title: Assign cathode and anode
        instruction: 'The more positive reduction potential operates as the reduction half-cell in a spontaneous galvanic cell.'
        type: multipleChoice
        prompt: 'Which electrode is the cathode?'
        choices:
          - { id: a, text: 'Cu, because $Cu^{2+}$ has the more positive reduction potential.', issueSignals: [] }
          - { id: b, text: 'Zn, because its reduction potential has the larger magnitude.', issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }] }
          - { id: c, text: 'Neither; both electrodes are oxidation sites.', issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }] }
        answer: { choiceId: a }
        explanation: 'Solution: Cu is the cathode and Zn is the anode. Why it works: The more positive $E^\circ_{red}$ remains written as reduction, so $Cu^{2+}+2e^-\rightarrow Cu$. Why the other choices fail: b compares magnitudes instead of reduction tendency; c would not provide a paired redox process.'
        media: [{ type: image, src: /media/chemistry/electrochemistry-galvanic-cell.svg, alt: Zinc anode and copper cathode connected by a wire and salt bridge., caption: Electrons leave zinc and enter the copper half-cell. }]
      - id: e2s2
        title: Encode the cell
        instruction: 'Write oxidation on the left, reduction on the right, single lines at phase boundaries, and a double line for the salt bridge.'
        type: freeResponse
        prompt: 'Write the standard cell notation.'
        answer: { gradingMode: selfCheck, keyPoints: ['$Zn(s)|Zn^{2+}(aq,1\ M)||Cu^{2+}(aq,1\ M)|Cu(s)$'] }
        explanation: 'Solution: $Zn(s)|Zn^{2+}(aq,1\ M)||Cu^{2+}(aq,1\ M)|Cu(s)$. Why it works: Zinc oxidation is the left half-cell, copper reduction is the right half-cell, and the double line marks the ionic connection.'
      - id: e2s3
        title: Calculate the standard potential
        instruction: 'Subtract the anode reduction potential from the cathode reduction potential; do not multiply potentials by balancing coefficients.'
        type: numericResponse
        prompt: 'Find $E^\circ_{cell}$ in volts.'
        answer: { value: 1.10, tolerance: 0.001 }
        explanation: 'Solution: $E^\circ_{cell}=0.34-(-0.76)=1.10\ \mathrm{V}$. Why it works: Cathode-minus-anode gives a positive value for the spontaneous cell, and potential is intensive.'
        media: [{ type: image, src: /media/chemistry/electrochemistry-galvanic-cell.svg, alt: Galvanic cell showing electron flow from zinc anode to copper cathode., caption: The positive cell potential agrees with the drawn spontaneous direction. }]
  - id: copper-electroplating
    title: Calculate copper deposited during electrolysis
    problem: 'A plating bath reduces copper by $Cu^{2+}+2e^-\rightarrow Cu(s)$. A current of $2.50\ \mathrm{A}$ runs for $32.0\ \mathrm{min}$. Use $F=96485\ \mathrm{C\,mol^{-1}}$ and $M_{Cu}=63.546\ \mathrm{g\,mol^{-1}}$.'
    steps:
      - id: e3s1
        title: Convert current and time to charge
        instruction: 'Convert minutes to seconds before using $q=It$.'
        type: numericResponse
        prompt: 'Calculate the delivered charge in coulombs.'
        answer: { value: 4800, tolerance: 1 }
        explanation: 'Solution: $t=32.0(60)=1920\ \mathrm{s}$ and $q=(2.50\ \mathrm{C\,s^{-1}})(1920\ \mathrm{s})=4800\ \mathrm{C}$. Why it works: Current is charge per time, so amperes times seconds gives coulombs.'
        media: [{ type: image, src: /media/chemistry/electrochemistry-electrolytic-cell.svg, alt: Electrolytic cell driven by an external DC power source., caption: The source supplies the charge used in the reduction half-reaction. }]
      - id: e3s2
        title: Convert charge to electron amount
        instruction: 'Divide total charge by the Faraday constant.'
        type: numericResponse
        prompt: 'Calculate moles of electrons delivered.'
        answer: { value: 0.04975, tolerance: 0.00002 }
        explanation: 'Solution: $n(e^-)=4800/96485=0.04975\ \mathrm{mol}$. Why it works: One mole of electrons carries 96485 coulombs.'
      - id: e3s3
        title: Apply electron stoichiometry and molar mass
        instruction: 'Use two moles of electrons per mole of copper, then convert copper moles to grams.'
        type: numericResponse
        prompt: 'Calculate the mass of copper deposited in grams.'
        answer: { value: 1.58, tolerance: 0.01 }
        explanation: 'Solution: $n(Cu)=0.04975/2=0.02487\ \mathrm{mol}$ and $m=(0.02487)(63.546)=1.58\ \mathrm{g}$. Why it works: The half-reaction requires two electron moles per copper mole before the molar-mass conversion.'
