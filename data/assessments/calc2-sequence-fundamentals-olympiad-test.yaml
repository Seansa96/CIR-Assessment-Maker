- id: q001
  type: multipleChoice
  skills:
  - prove-recursive-sequence-convergence
  - identify-fixed-points
  prompt: |
    Let $a_1=2$ and
    $$a_{n+1}=\frac12\left(a_n+\frac3{a_n}\right).$$
    Which conclusion is correct?
  choices:
  - id: a
    text: |-
      $a_n\downarrow\sqrt3$
  - id: b
    text: |-
      $a_n\uparrow2$
  - id: c
    text: |-
      $a_n\to-\sqrt3$
  - id: d
    text: The sequence oscillates without a limit.
  answer:
    choiceId: a
  explanation: |-
    Solution: AM-GM keeps $a_n\ge\sqrt3$, and $a_{n+1}-a_n=(3-a_n^2)/(2a_n)\le0$; the positive fixed point is $\sqrt3$. Therefore the answer is $a_n\downarrow\sqrt3$.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

    Why the other choices fail: $a_n\uparrow2$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $a_n\to-\sqrt3$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The sequence oscillates without a limit. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
- id: q002
  type: multipleChoice
  skills:
  - rationalize-sequence-limits
  prompt: |
    Evaluate
    $$\lim_{n\to\infty}n\left(\sqrt{n^2+n}-n\right).$$
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1/2$
  - id: c
    text: |-
      $+\infty$
  - id: d
    text: $1$
  answer:
    choiceId: c
  explanation: |-
    Solution: Rationalization gives $n^2/(\sqrt{n^2+n}+n)$, which is asymptotic to $n/2$ and therefore diverges to $+\infty$. Therefore the answer is $+\infty$.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

    Why the other choices fail: $0$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $1/2$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $1$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
