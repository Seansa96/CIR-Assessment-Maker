- id: q004
  type: multipleChoice
  skills:
  - recognize-riemann-sum-sequences
  prompt: |
    Determine
    $$\lim_{n\to\infty}\sum_{k=1}^{n}\frac1{n+k}.$$
  choices:
  - id: a
    text: $0$
  - id: b
    text: $1/2$
  - id: c
    text: |-
      $\ln2$
  - id: d
    text: $1$
  answer:
    choiceId: c
  explanation: |-
    Solution: Rewrite the sum as $(1/n)\sum_{k=1}^{n}1/(1+k/n)$, a right-endpoint Riemann sum for $\int_0^1 dx/(1+x)=\ln2$. Therefore the answer is $\ln2$.

    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

    Why the other choices fail: $0$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $1/2$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $1$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
- id: q005
  type: multipleChoice
  skills:
  - bound-harmonic-differences
  prompt: |
    What is
    $$\lim_{n\to\infty}\left(H_{2n}-H_n\right),\qquad
    H_m=\sum_{k=1}^{m}\frac1k?$$
  choices:
  - id: a
    text: $0$
  - id: b
    text: |-
      $\ln2$
  - id: c
    text: $1$
  - id: d
    text: |-
      $+\infty$
  answer:
    choiceId: b
  explanation: |-
    Solution: The difference is $\sum_{k=n+1}^{2n}1/k$, which is squeezed by adjacent integrals whose common limiting value is $\int_1^2 dx/x=\ln2$. Therefore the answer is $\ln2$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $0$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $1$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $+\infty$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
