- id: q008
  type: multipleChoice
  skills:
  - apply-subsequence-criteria
  prompt: |
    Suppose $a_{2n}\to L$ and $a_{2n+1}\to L$. What follows?
  choices:
  - id: a
    text: |-
      $a_n\to L$
  - id: b
    text: $a_n$ may still have a third subsequential limit
  - id: c
    text: $a_n$ must alternate between two values
  - id: d
    text: Only boundedness follows
  answer:
    choiceId: a
  explanation: |-
    Solution: Beyond the larger of the two parity thresholds, every index is either even or odd and therefore its term lies within the requested tolerance of $L$. Therefore the answer is $a_n\to L$.

    Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.

    Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.

    Why the other choices fail: $a_n$ may still have a third subsequential limit conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; $a_n$ must alternate between two values conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; Only boundedness follows conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.
