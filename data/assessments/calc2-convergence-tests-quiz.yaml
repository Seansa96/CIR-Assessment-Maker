schemaVersion: 1
id: calc2-convergence-tests-quiz
title: Convergence Tests Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: convergence-tests
skills:
- Select convergence tests from term structure
- Apply comparison, integral, ratio, root, and alternating tests
- Check theorem conditions and interpret inconclusive results
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - calculus-2
  - convergence-tests
  - focused-practice
  - test-selection
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    What is the quickest conclusion for $\sum_{n=1}^{\infty}n/(n+1)$?
  choices:
  - id: a
    text: It diverges because the terms approach $1$.
  - id: b
    text: It converges by comparison with $1/n$.
  - id: c
    text: It converges to $1$.
  - id: d
    text: The ratio test proves convergence.
  answer:
    choiceId: a
  explanation: The summand has nonzero limit one, violating a necessary condition for series convergence.
- id: q002
  type: multipleChoice
  skills:
  - use-direct-comparison
  prompt: |
    Which inequality proves convergence of
    $\sum_{n=1}^{\infty}1/(n^2+\sin^2n)$?
  choices:
  - id: a
    text: |-
      $0<1/(n^2+\sin^2n)\le1/n^2$
  - id: b
    text: |-
      $1/(n^2+\sin^2n)\le1/n$
  - id: c
    text: |-
      $1/(n^2+\sin^2n)\ge1/(n^2+1)$
  - id: d
    text: The terms are positive.
  answer:
    choiceId: a
  explanation: Adding a nonnegative quantity to the denominator makes the term no larger than the convergent
    p-series term.
- id: q003
  type: multipleChoice
  skills:
  - use-divergent-lower-comparison
  prompt: |
    Which benchmark is useful for proving divergence of
    $\sum_{n=1}^{\infty}1/(\sqrt n+1)$?
  choices:
  - id: a
    text: |-
      $\sum1/\sqrt n$
  - id: b
    text: |-
      $\sum1/n^2$
  - id: c
    text: |-
      $\sum(1/2)^n$
  - id: d
    text: |-
      $\sum1/n^3$
  answer:
    choiceId: a
  explanation: |-
    For large n the term is comparable to $1/\sqrt n$, a divergent p-series with exponent one half.
- id: q004
  type: multipleChoice
  skills:
  - apply-limit-comparison
  prompt: |
    Classify $\sum_{n=1}^{\infty}(n+2)/(n^2+1)$.
  choices:
  - id: a
    text: Divergent by limit comparison with $1/n$
  - id: b
    text: Convergent by comparison with $1/n^2$
  - id: c
    text: Geometric and convergent
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: Multiplying the summand by n gives a limit of one, so it shares harmonic divergence.
- id: q005
  type: multipleChoice
  skills:
  - apply-the-integral-test
  prompt: |
    What does the integral test show for
    $\sum_{n=2}^{\infty}1/[n(\ln n)^2]$?
  choices:
  - id: a
    text: It converges.
  - id: b
    text: It diverges.
  - id: c
    text: The terms do not approach zero.
  - id: d
    text: It is geometric.
  answer:
    choiceId: a
  explanation: |-
    With u equal to ln x, the improper integral becomes $\int_{\ln2}^{\infty}u^{-2}\,du$, which is finite.
- id: q006
  type: multipleChoice
  skills:
  - apply-the-ratio-test
  prompt: |
    For $a_n=n!/n^n$, what is $\lim a_{n+1}/a_n$?
  choices:
  - id: a
    text: $1/e$
  - id: b
    text: $1$
  - id: c
    text: $0$
  - id: d
    text: $e$
  answer:
    choiceId: a
  explanation: The ratio is $(n/(n+1))^n$, which approaches $e^{-1}$.
- id: q007
  type: multipleChoice
  skills:
  - apply-the-root-test
  prompt: |
    What does the root test conclude for
    $\sum_{n=1}^{\infty}[(2n+1)/(3n)]^n$?
  choices:
  - id: a
    text: Absolute convergence
  - id: b
    text: Divergence
  - id: c
    text: Conditional convergence
  - id: d
    text: Inconclusive
  answer:
    choiceId: a
  explanation: The nth root tends to two thirds, strictly below one.
- id: q008
  type: multipleChoice
  skills:
  - interpret-inconclusive-ratio-results
  prompt: |
    If $\lim|a_{n+1}/a_n|=1$, which statement is correct?
  choices:
  - id: a
    text: The ratio test gives no conclusion.
  - id: b
    text: The series converges.
  - id: c
    text: The series diverges.
  - id: d
    text: The series is conditionally convergent.
  answer:
    choiceId: a
  explanation: Both the harmonic and reciprocal-square series have ratio limit one but opposite outcomes.
- id: q009
  type: multipleChoice
  skills:
  - check-comparison-test-hypotheses
  prompt: |
    Before applying the standard direct comparison test to $\sum a_n$ and
    $\sum b_n$, what should be checked?
  choices:
  - id: a
    text: The relevant terms are nonnegative eventually.
  - id: b
    text: Both series have the same first term.
  - id: c
    text: Both terms alternate.
  - id: d
    text: Their partial sums are equal.
  answer:
    choiceId: a
  explanation: Ordering individual terms controls sums only in the required direction when the tail terms
    are nonnegative.
- id: q010
  type: multipleChoice
  skills:
  - apply-the-p-series-test
  prompt: |
    How does $\sum_{n=1}^{\infty}1/n^{1.001}$ behave?
  choices:
  - id: a
    text: It converges.
  - id: b
    text: It diverges because the exponent is close to $1$.
  - id: c
    text: It is geometric.
  - id: d
    text: The p-series test is inconclusive.
  answer:
    choiceId: a
  explanation: The p-series threshold is strict but any exponent greater than one qualifies.
- id: q011
  type: multipleChoice
  skills:
  - classify-geometric-series
  prompt: |
    What happens to $\sum_{n=0}^{\infty}(-6/5)^n$?
  choices:
  - id: a
    text: It diverges.
  - id: b
    text: It converges because signs alternate.
  - id: c
    text: It converges to $5/11$.
  - id: d
    text: It converges absolutely.
  answer:
    choiceId: a
  explanation: A geometric series converges only when the ratio magnitude is below one; here it is six
    fifths.
- id: q012
  type: multipleChoice
  skills:
  - check-integral-test-hypotheses
  prompt: |
    A function matching $a_n=f(n)$ is positive, continuous, and decreasing
    only for $x\ge100$. Can the integral test still apply?
  choices:
  - id: a
    text: Yes; eventual hypotheses are enough.
  - id: b
    text: No; they must hold from $x=1$.
  - id: c
    text: Only if the first 99 terms are zero.
  - id: d
    text: Only for alternating series.
  answer:
    choiceId: a
  explanation: Removing or changing finitely many initial terms does not affect convergence.
- id: q013
  type: multipleChoice
  skills:
  - use-absolute-convergence
  prompt: |
    If $\sum|a_n|$ converges, what follows about $\sum a_n$?
  choices:
  - id: a
    text: It converges.
  - id: b
    text: It diverges.
  - id: c
    text: It must be alternating.
  - id: d
    text: Its sum is zero.
  answer:
    choiceId: a
  explanation: Absolute convergence controls every signed tail through the triangle inequality.
- id: q014
  type: multipleChoice
  skills:
  - recognize-condensation-structure
  prompt: |
    Which test is especially useful for a positive decreasing series whose
    terms involve $n$, $\ln n$, and iterated logarithms?
  choices:
  - id: a
    text: Cauchy condensation
  - id: b
    text: Alternating-series test
  - id: c
    text: Geometric sum formula
  - id: d
    text: Telescoping only
  answer:
    choiceId: a
  explanation: Condensation converts dyadic blocks into a simpler logarithmic benchmark.
- id: q015
  type: multipleChoice
  skills:
  - apply-the-alternating-series-test
  prompt: |
    Why does $\sum_{n=1}^{\infty}(-1)^{n-1}/\sqrt n$ converge?
  choices:
  - id: a
    text: |-
      $1/\sqrt n$ decreases to $0$.
  - id: b
    text: |-
      $\sum1/\sqrt n$ converges.
  - id: c
    text: Its ratio limit is below $1$.
  - id: d
    text: All signed series converge.
  answer:
    choiceId: a
  explanation: The alternating-series theorem applies even though the absolute p-series with exponent
    one half diverges.
