- id: q006
  type: multipleChoice
  skills:
  - apply-the-ratio-test
  prompt: |
    For $a_n=n!/n^n$, what is $\lim a_{n+1}/a_n$?
  choices:
  - id: a
    text: $1/e$
  - id: b
    text: $1$
  - id: c
    text: $0$
  - id: d
    text: $e$
  answer:
    choiceId: a
  explanation: |-
    Solution: The ratio is $(n/(n+1))^n$, which approaches $e^{-1}$. Therefore the answer is $1/e$.

    Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

    Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.

    Why the other choices fail: $1$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; $0$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; $e$ conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors.
- id: q007
  type: multipleChoice
  skills:
  - apply-the-root-test
  prompt: |
    What does the root test conclude for
    $\sum_{n=1}^{\infty}[(2n+1)/(3n)]^n$?
  choices:
  - id: a
    text: Absolute convergence
  - id: b
    text: Divergence
  - id: c
    text: Conditional convergence
  - id: d
    text: Inconclusive
  answer:
    choiceId: a
  explanation: |-
    Solution: The nth root tends to two thirds, strictly below one. Therefore the answer is Absolute convergence.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Divergence conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Conditional convergence conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Inconclusive conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
