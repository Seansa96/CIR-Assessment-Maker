- id: q001
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    What is the quickest conclusion for $\sum_{n=1}^{\infty}n/(n+1)$?
  choices:
  - id: a
    text: It diverges because the terms approach $1$.
  - id: b
    text: It converges by comparison with $1/n$.
  - id: c
    text: It converges to $1$.
  - id: d
    text: The ratio test proves convergence.
  answer:
    choiceId: a
  explanation: |-
    Solution: The summand has nonzero limit one, violating a necessary condition for series convergence. Therefore the answer is It diverges because the terms approach $1$.. Therefore the answer is It diverges because the terms approach $1$.. Therefore the answer is It diverges because the terms approach $1$.. Therefore the answer is It diverges because the terms approach $1$.. Therefore the answer is It diverges because the terms approach $1$.. Therefore the answer is It diverges because the terms approach $1$..

    Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

    Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.

    Why the other choices fail: It converges by comparison with $1/n$. conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; It converges to $1$. conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; The ratio test proves convergence. conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors.
- id: q002
  type: multipleChoice
  skills:
  - use-direct-comparison
  prompt: |
    Which inequality proves convergence of
    $\sum_{n=1}^{\infty}1/(n^2+\sin^2n)$?
  choices:
  - id: a
    text: |-
      $0<1/(n^2+\sin^2n)\le1/n^2$
  - id: b
    text: |-
      $1/(n^2+\sin^2n)\le1/n$
  - id: c
    text: |-
      $1/(n^2+\sin^2n)\ge1/(n^2+1)$
  - id: d
    text: The terms are positive.
  answer:
    choiceId: a
  explanation: |-
    Solution: Adding a nonnegative quantity to the denominator makes the term no larger than the convergent p-series term. Therefore the answer is $0<1/(n^2+\sin^2n)\le1/n^2$.

    Why it works: Match the positive tail to $\sum 1/n^p$. Its threshold is strict: it converges only when $p>1$ and diverges for $p\le1$.

    Common trap: The harmonic boundary $p=1$ diverges, so replacing $p>1$ with $p\ge1$ changes the conclusion.

    Why the other choices fail: $1/(n^2+\sin^2n)\le1/n$ conflicts with this criterion: Match the positive tail to $\sum 1/n^p$; $1/(n^2+\sin^2n)\ge1/(n^2+1)$ conflicts with this criterion: Match the positive tail to $\sum 1/n^p$; The terms are positive. conflicts with this criterion: Match the positive tail to $\sum 1/n^p$.
