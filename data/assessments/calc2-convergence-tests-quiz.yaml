  - id: b
    text: Convergent by comparison with $1/n^2$
  - id: c
    text: Geometric and convergent
  - id: d
    text: Divergent by the term test
  answer:
    choiceId: a
  explanation: 'Solution: Multiplying the summand by n gives a limit of one, so it shares harmonic divergence. Therefore the answer is Divergent by limit comparison with $1/n$.


    Why it works: First rewrite the term as $ar^n$. A geometric series converges exactly when $|r|<1$; its finite sum formula is valid only in that regime.


    Common trap: A negative ratio still needs $|r|<1$; alternating signs do not make $r=-1$ converge.


