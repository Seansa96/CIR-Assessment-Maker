schemaVersion: 1
id: calc2-convergence-tests-quiz
title: Convergence Tests Quiz
assessmentType: quiz
categoryId: calculus-2
subcategoryIds:
- sequences-series
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  prompt: 'Which test is the best choice to determine the convergence of $\sum_{n=1}^\infty
    \frac{2^n}{n!}$?

    '
  choices:
  - id: a
    text: The Ratio Test
  - id: b
    text: The Integral Test
  - id: c
    text: The Limit Comparison Test
  - id: d
    text: The Divergence Test
  answer:
    choiceId: a
  explanation: 'Whenever you see factorials ($n!$) or exponentials ($2^n$), the Ratio
    Test is almost always the right choice because the terms will easily cancel.

    '
- id: q002
  type: multipleChoice
  prompt: 'Apply the Ratio Test to $\sum_{n=1}^\infty \frac{n^3}{3^n}$. What is the
    value of the limit $L$, and what is the conclusion?

    '
  choices:
  - id: a
    text: $L = 1/3$. The series converges.
  - id: b
    text: $L = 3$. The series diverges.
  - id: c
    text: $L = 0$. The series converges.
  - id: d
    text: $L = 1$. The test is inconclusive.
  answer:
    choiceId: a
  explanation: '$L = \lim \frac{(n+1)^3}{3^{n+1}} \cdot \frac{3^n}{n^3} = \lim \frac{(n+1)^3}{n^3}
    \cdot \frac{1}{3} = (1) \cdot \frac{1}{3} = \frac{1}{3}$. Since $L < 1$, it converges.

    '
- id: q003
  type: multipleChoice
  prompt: 'Using the Limit Comparison Test on $\sum \frac{5n^2 - 1}{n^4 + 3n}$, what
    function $b_n$ should you compare it to, and what is the conclusion?

    '
  choices:
  - id: a
    text: $b_n = 1/n^2$. The series converges.
  - id: b
    text: $b_n = 1/n^2$. The series diverges.
  - id: c
    text: $b_n = 1/n^4$. The series converges.
  - id: d
    text: $b_n = n^2$. The series diverges.
  answer:
    choiceId: a
  explanation: 'Ignore the lower order terms. The dominant term is $\frac{n^2}{n^4}
    = \frac{1}{n^2}$. This is a p-series with $p=2$, which converges. The LCT proves
    the original series also converges.

    '
- id: q004
  type: multipleChoice
  prompt: 'Does the Alternating Harmonic Series $\sum_{n=1}^\infty \frac{(-1)^{n-1}}{n}$
    converge or diverge?

    '
  choices:
  - id: a
    text: Converges conditionally
  - id: b
    text: Converges absolutely
  - id: c
    text: Diverges
  answer:
    choiceId: a
  explanation: 'By the Alternating Series Test, it converges because the terms $1/n$
    are decreasing and go to 0. However, the absolute value version $\sum 1/n$ is
    the Harmonic Series, which diverges. Thus, it converges *conditionally*.

    '
- id: q005
  type: multipleChoice
  prompt: 'You try to use the Integral Test on a series, and you find that the improper
    integral $\int_1^\infty f(x)\,dx$ diverges to $\infty$. What does this mean for
    the series?

    '
  choices:
  - id: a
    text: The series diverges.
  - id: b
    text: The series converges.
  - id: c
    text: The test is inconclusive.
  answer:
    choiceId: a
  explanation: 'The Integral Test guarantees that the series and the integral share
    the same fate. If the integral diverges, the series diverges.

    '
