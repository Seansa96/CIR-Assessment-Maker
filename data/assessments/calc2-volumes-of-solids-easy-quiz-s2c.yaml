navigation: { learningGoal: practice, activityType: mixedPractice, tags: [calculus-2, volumes-of-solids, easy] }
authoring: { visualRequirement: required, visualRationale: Each item asks the learner to identify an axis-dependent cross-section. , difficultyTier: easy }
questions:
  - { id: q001, type: multipleChoice, prompt: 'A perpendicular slice has area $A(x)$. Which expression is its differential volume?', media: [{ type: image, src: /media/calculus/disk-washer-model.svg, alt: Thin cross section with dx thickness }], choices: [{ id: a, text: '$A(x)dx$' }, { id: b, text: '$A(x)$' }, { id: c, text: '$A(x)/dx$' }, { id: d, text: '$A(x)^2$' }], answer: { choiceId: a }, explanation: 'Solution: $dV=A(x)dx$. Why it works: Area times a small length is volume. Common trap: Area alone is not volume. Why the other choices fail: b omits thickness; c has the wrong units; d squares the area.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: Identifies the geometric differential and checks its dimensional role. }
  - { id: q002, type: multipleChoice, prompt: 'Rotation about the x-axis uses disks from vertical slices. If $y=3x$, what is the disk radius?', choices: [{ id: a, text: '$3x$' }, { id: b, text: '$x$' }, { id: c, text: '$\pi(3x)^2$' }, { id: d, text: '$dx$' }], answer: { choiceId: a }, explanation: 'Solution: $R=3x$. Why it works: Radius is the distance from y=0 to y=3x. Common trap: Do not put $\pi$ or a square into the radius itself. Why the other choices fail: b is the x-location; c is an area; d is thickness.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Separates the graph-to-axis distance from the cross-sectional area formula. }
  - { id: q003, type: multipleChoice, prompt: 'A washer has $R=5$ and $r=2$. What is its cross-sectional area?', choices: [{ id: a, text: '$21\pi$' }, { id: b, text: '$9\pi$' }, { id: c, text: '$3\pi$' }, { id: d, text: '$25\pi$' }], answer: { choiceId: a }, explanation: 'Solution: $A=\pi(5^2-2^2)=\pi(25-4)=21\pi$. Why it works: Subtract inner circle area from outer circle area. Common trap: $(5-2)^2\pi=9\pi$ is not the area difference. Why the other choices fail: b squares a radius difference; c is a length-like difference; d ignores the hole.', difficultyDimensions: [simplification, modelOrDerivation], difficultyEvidence: Chooses the washer model and evaluates the squared-radius difference. }
  - { id: q004, type: multipleChoice, prompt: 'The region between $y=1$ and $y=4$ is rotated about the x-axis. Is the cross section a disk or washer?', choices: [{ id: a, text: washer }, { id: b, text: disk }, { id: c, text: shell }, { id: d, text: line segment }], answer: { choiceId: a }, explanation: 'Solution: It is a washer. Why it works: The interval from y=1 to y=4 leaves a hole of radius 1 around the x-axis. Common trap: A region does not form a disk unless it reaches the axis. Why the other choices fail: b omits the hole; c comes from parallel slices; d is not a rotated cross section.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Uses axis contact to distinguish disk from washer. }
  - { id: q005, type: multipleChoice, prompt: 'For rotation about $y=2$, what is the radius from $y=f(x)$ to the axis?', choices: [{ id: a, text: '$|f(x)-2|$' }, { id: b, text: '$f(x)+2$' }, { id: c, text: '$2f(x)$' }, { id: d, text: '$f(x)$' }], answer: { choiceId: a }, explanation: 'Solution: The radius is $|f(x)-2|$. Why it works: A radius is a nonnegative vertical distance to y=2. Common trap: $f(x)$ alone assumes the axis is y=0. Why the other choices fail: b and c are not distances; d ignores the shifted axis.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Transfers an offset-axis diagram into an absolute-distance expression. }
  - { id: q006, type: multipleChoice, prompt: 'For a vertical axis of rotation, which slice orientation naturally creates disks/washers?', choices: [{ id: a, text: horizontal slices with dy }, { id: b, text: vertical slices with dx }, { id: c, text: no slices }, { id: d, text: parallel strips only }], answer: { choiceId: a }, explanation: 'Solution: Use horizontal $dy$ slices. Why it works: They are perpendicular to a vertical axis. Common trap: Parallel vertical strips make shells. Why the other choices fail: b and d describe shells; c cannot build an accumulation model.', difficultyDimensions: [representationTransfer, auxiliaryTechnique], difficultyEvidence: Selects the method-compatible slice orientation from an axis direction. }
  - { id: q007, type: multipleChoice, prompt: 'Evaluate $\int_0^2\pi x^2\,dx$.', choices: [{ id: a, text: '$8\pi/3$' }, { id: b, text: '$4\pi$' }, { id: c, text: '$2\pi$' }, { id: d, text: '$8\pi$' }], answer: { choiceId: a }, explanation: 'Solution: $\pi[x^3/3]_0^2=8\pi/3$. Why it works: This is the disk integral when $R=x$. Common trap: Divide the exponent-raised power by 3. Why the other choices fail: b, c, and d do not apply the power rule correctly.', difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: Identifies the disk integrand and performs a power-rule definite integral. }
  - { id: q008, type: multipleChoice, prompt: 'Which units should a correctly modeled volume have if all lengths are centimeters?', choices: [{ id: a, text: cubic centimeters }, { id: b, text: square centimeters }, { id: c, text: centimeters }, { id: d, text: centimeters per second }], answer: { choiceId: a }, explanation: 'Solution: Volume has units $\text{cm}^3$. Why it works: Cross-sectional area in $\text{cm}^2$ is multiplied by thickness in cm. Common trap: A square-unit result usually means thickness was lost. Why the other choices fail: b is area; c is length; d is a rate.', difficultyDimensions: [representationTransfer, errorDiagnosis], difficultyEvidence: Uses dimensions to validate the quantity produced by a cross-sectional model. }
  - { id: q009, type: multipleChoice, prompt: 'For $V=\int_a^b\pi[R(x)^2-r(x)^2]dx$, what do a and b represent?', choices: [{ id: a, text: first and last x-slice locations }, { id: b, text: the two radii }, { id: c, text: the final volume units }, { id: d, text: the circumference }], answer: { choiceId: a }, explanation: 'Solution: They are the first and last x-locations. Why it works: The differential is dx, so bounds are x-values. Common trap: Radii belong in the integrand. Why the other choices fail: b, c, and d are different parts of the model.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Associates the integration variable with the meaning of the bounds. }
  - { id: q010, type: multipleChoice, prompt: 'What is the best first diagram label before writing a disk or washer integral?', choices: [{ id: a, text: axis of rotation }, { id: b, text: antiderivative }, { id: c, text: final volume }, { id: d, text: calculator mode }], answer: { choiceId: a }, explanation: 'Solution: Label the axis of rotation first. Why it works: Every radius is measured from that axis. Common trap: A correct-looking formula with the wrong axis distances models a different solid. Why the other choices fail: b and c happen after the model; d does not define geometry.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: Selects the model-building step that determines every radius expression. }
