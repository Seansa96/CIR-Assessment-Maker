questions:
  - id: q001
    type: symbolicResponse
    prompt: |
      Evaluate exactly:

      $$
      \int_0^2\frac{1}{\sqrt{x^2+4}}\,dx.
      $$

      Give the result in logarithmic form.
    answer:
      expectedLatex: '\ln(1+\sqrt2)'
      equivalenceMode: expression
      variables: []
      tolerance: 0.000001
    explanation: |
      Use $x=2\tan u$, so $dx=2\sec^2u\,du$ and
      $\sqrt{x^2+4}=2\sec u$. The bounds become $u=0$ and
      $u=\pi/4$:

      $$
      \int_0^{\pi/4}\sec u\,du
      =\left[\ln|\sec u+\tan u|\right]_0^{\pi/4}
      =\boxed{\ln(1+\sqrt2)}.
      $$

      Related topic: the $\sqrt{x^2+a^2}$ trigonometric-substitution pattern.

  - id: q002
    type: symbolicResponse
    prompt: |
      Evaluate:

      $$
      \int2xe^{-8x}\,dx.
      $$
    answer:
      expectedLatex: '-\frac{(8x+1)e^{-8x}}{32}'
      equivalenceMode: derivative
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Use integration by parts with $u=2x$ and
      $dv=e^{-8x}\,dx$. Then $du=2\,dx$ and
      $v=-e^{-8x}/8$:

      $$
      \int2xe^{-8x}\,dx
      =-\frac{x}{4}e^{-8x}-\frac1{32}e^{-8x}+C
      =\boxed{-\frac{(8x+1)e^{-8x}}{32}+C}.
      $$

      Related topic: integration by parts for polynomial-exponential products.

  - id: q003
    type: symbolicResponse
    prompt: |
      Evaluate:

      $$
      \int\frac{2x-4}{x^3+9x}\,dx.
      $$
    answer:
      expectedLatex: '-\frac49\ln|x|+\frac29\ln(x^2+9)+\frac23\arctan\left(\frac{x}{3}\right)'
      equivalenceMode: derivative
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Factor the denominator as $x(x^2+9)$ and decompose:

      $$
      \frac{2x-4}{x(x^2+9)}
      =-\frac{4}{9x}
      +\frac{\frac49x+2}{x^2+9}.
      $$

      Integrate the logarithmic and inverse-tangent terms:

      $$
      \boxed{
      -\frac49\ln|x|
      +\frac29\ln(x^2+9)
      +\frac23\arctan\left(\frac{x}{3}\right)+C
      }.
      $$

      Related topic: partial fractions with an irreducible quadratic factor.

  - id: q004
    type: symbolicResponse
    prompt: |
      The Beta Function is defined by

      $$
      B(x,y)=\int_0^\infty
      \frac{t^{x-1}}{(1+t)^{x+y}}\,dt.
      $$

      Use this definition to calculate $B(2,3)$ exactly.
    answer:
      expectedLatex: '\frac1{12}'
      equivalenceMode: expression
      variables: []
      tolerance: 0.000001
    explanation: |
      Substitution gives

      $$
      B(2,3)=\int_0^\infty\frac{t}{(1+t)^5}\,dt.
      $$

      Let $u=1+t$, so $t=u-1$:

      $$
      \int_1^\infty(u^{-4}-u^{-5})\,du
      =\left[-\frac1{3u^3}+\frac1{4u^4}\right]_1^\infty
      =\boxed{\frac1{12}}.
      $$

      Related topic: improper integrals and substitutions on infinite intervals.

  - id: q005
    type: freeResponse
    prompt: |
      Sketch the region bounded by

      $$
      y=-x^2+10
      \qquad\text{and}\qquad
      y=x+4.
      $$

      Identify both intersections as ordered pairs.

      ![Blank coordinate grid for sketching the parabola and line region](/assessments/calc2-comprehensive-review/parabola-line-region-grid.svg)
    answer:
      expected: 'A downward-opening parabola and the line y=x+4 intersect at (-3,1) and (2,6), with the bounded region between the curves for -3 <= x <= 2.'
      gradingMode: selfCheck
      keyPoints:
        - The parabola opens downward with vertex $(0,10)$.
        - The line has slope $1$ and $y$-intercept $4$.
        - The intersections are $(-3,1)$ and $(2,6)$.
        - The region between the curves is clearly indicated.
    explanation: |
      Solve

      $$
      -x^2+10=x+4
      \quad\Longrightarrow\quad
      x^2+x-6=0
      \quad\Longrightarrow\quad
      x=-3,\ 2.
      $$

      Substitution into $y=x+4$ gives $(-3,1)$ and $(2,6)$.

      ![Completed graph of the parabola and line with the bounded region shaded](/assessments/calc2-comprehensive-review/parabola-line-region-solution.svg)

      Related topic: converting geometric boundaries into integration limits.

  - id: q006
    type: symbolicResponse
    prompt: |
      For the region bounded by

      $$
      y=-x^2+10
      \qquad\text{and}\qquad
      y=x+4,
      $$

      write a single integral without an absolute value, then enter the exact area.
    answer:
      expectedLatex: '\frac{125}{6}'
      equivalenceMode: expression
      variables: []
      tolerance: 0.000001
    explanation: |
      The parabola is above the line on $[-3,2]$:

      $$
      A=\int_{-3}^{2}
      \left[(-x^2+10)-(x+4)\right]\,dx
      =\int_{-3}^{2}(-x^2-x+6)\,dx.
      $$

      Therefore

      $$
      A=
      \left[-\frac{x^3}{3}-\frac{x^2}{2}+6x\right]_{-3}^{2}
      =\boxed{\frac{125}{6}}.
      $$

      Related topic: area as upper function minus lower function.

  - id: q007
    type: symbolicResponse
    prompt: |
      Revolve the region bounded by

      $$
      y=-x^2+10
      \qquad\text{and}\qquad
      y=x+4
      $$

      about the $x$-axis. Write a single integral without an absolute value, then enter the exact volume.
    answer:
      expectedLatex: '250\pi'
      equivalenceMode: expression
      variables: []
      tolerance: 0.000001
    explanation: |
      Washers have outer radius $R=-x^2+10$ and inner radius
      $r=x+4$:

      $$
      V=\pi\int_{-3}^{2}
      \left[(-x^2+10)^2-(x+4)^2\right]\,dx
      =\boxed{250\pi}.
      $$

      Related topic: washer volume as $\pi(R^2-r^2)$.

  - id: q008
    type: freeResponse
    prompt: |
      For Questions 8–18, consider the region enclosed by

      $$
      y=\sqrt{2x+1}
      \qquad\text{and}\qquad
      y=\frac{x}{3}+1.
      $$

      Sketch the region, label a useful scale, and identify the intersections.

      ![Blank coordinate grid for sketching the square-root and line region](/assessments/calc2-comprehensive-review/sqrt-line-region-grid.svg)
    answer:
      expected: 'The curves intersect at (0,1) and (12,5). The square-root curve is above the line for 0 < x < 12, and the enclosed region is shaded between them.'
      gradingMode: selfCheck
      keyPoints:
        - The intersections are $(0,1)$ and $(12,5)$.
        - The square-root curve is the upper boundary for $0<x<12$.
        - The line is the lower boundary.
        - The enclosed region and scale are clearly shown.
    explanation: |
      Squaring the intersection equation gives

      $$
      2x+1=\left(\frac{x}{3}+1\right)^2,
      $$

      which simplifies to $x(x-12)=0$. The corresponding points are
      $(0,1)$ and $(12,5)$.

      ![Completed graph of the square-root and line curves with the bounded region shaded](/assessments/calc2-comprehensive-review/sqrt-line-region-solution.svg)

  - id: q009
    type: numericResponse
    prompt: |
      Using differential $dy$, set up the exact area of the region between

      $$
      y=\sqrt{2x+1}
      \qquad\text{and}\qquad
      y=\frac{x}{3}+1.
      $$

      Enter the area rounded to three decimal places.
    answer:
      value: 5.333
      tolerance: 0.0005
    explanation: |
      Solve each curve for $x$:

      $$
      x_{\text{left}}=\frac{y^2-1}{2},
      \qquad
      x_{\text{right}}=3y-3.
      $$

      Thus

      $$
      A=\int_1^5
      \left[(3y-3)-\frac{y^2-1}{2}\right]\,dy
      =\frac{16}{3}
      \approx\boxed{5.333}.
      $$

      Related topic: horizontal slices use right minus left.

  - id: q010
    type: numericResponse
    prompt: |
      The same region is the base of a solid whose cross sections perpendicular to the $x$-axis are squares.

      Write the volume integral, then enter the volume rounded to one decimal place.
    answer:
      value: 2.8
      tolerance: 0.05
    explanation: |
      The square side length is the vertical distance between the curves:

      $$
      s(x)=\sqrt{2x+1}-\left(\frac{x}{3}+1\right).
      $$

      Therefore

      $$
      V=\int_0^{12}
      \left[\sqrt{2x+1}-\left(\frac{x}{3}+1\right)\right]^2dx
      =\frac{128}{45}
      \approx\boxed{2.8}.
      $$

      Related topic: known-cross-section volume uses $\int A(x)\,dx$.

  - id: q011
    type: numericResponse
    prompt: |
      Rotate the same region about the $x$-axis. Without changing variables, write a washer integral with differential $dx$.

      Enter the volume rounded to three decimal places.
    answer:
      value: 100.531
      tolerance: 0.0005
    explanation: |
      The outer radius is $\sqrt{2x+1}$ and the inner radius is
      $x/3+1$:

      $$
      V=\pi\int_0^{12}
      \left[(2x+1)-\left(\frac{x}{3}+1\right)^2\right]dx
      =32\pi
      \approx\boxed{100.531}.
      $$

  - id: q012
    type: numericResponse
    prompt: |
      Rotate the same region about the $y$-axis. Without changing variables, use differential $dx$.

      Enter the volume rounded to three decimal places.
    answer:
      value: 174.254
      tolerance: 0.0005
    explanation: |
      Differential $dx$ makes vertical shells natural. Radius is $x$ and height is upper minus lower:

      $$
      V=2\pi\int_0^{12}
      x\left[\sqrt{2x+1}-\left(\frac{x}{3}+1\right)\right]dx
      =\frac{832\pi}{15}
      \approx\boxed{174.254}.
      $$

      Related topic: cylindrical shells about a vertical axis.

  - id: q013
    type: numericResponse
    prompt: |
      Rotate the same region about the $y$-axis, but now use differential $dy$.

      Enter the volume rounded to three decimal places.
    answer:
      value: 174.254
      tolerance: 0.0005
    explanation: |
      Horizontal slices create washers. For $1\leq y\leq5$,

      $$
      R(y)=3y-3,
      \qquad
      r(y)=\frac{y^2-1}{2}.
      $$

      Hence

      $$
      V=\pi\int_1^5
      \left[(3y-3)^2-\left(\frac{y^2-1}{2}\right)^2\right]dy
      =\frac{832\pi}{15}
      \approx\boxed{174.254}.
      $$

      The agreement with the shell result is a strong setup check.

  - id: q014
    type: numericResponse
    prompt: |
      Rotate the same region about the horizontal line $y=10$.

      Write the washer integral and enter the volume rounded to three decimal places.
    answer:
      value: 234.572
      tolerance: 0.0005
    explanation: |
      The axis lies above both curves. The farther, outer radius reaches the lower line:

      $$
      R=10-\left(\frac{x}{3}+1\right)=9-\frac{x}{3},
      $$

      while the inner radius is

      $$
      r=10-\sqrt{2x+1}.
      $$

      Therefore

      $$
      V=\pi\int_0^{12}
      \left[
      \left(9-\frac{x}{3}\right)^2
      -\left(10-\sqrt{2x+1}\right)^2
      \right]dx
      =\frac{224\pi}{3}
      \approx\boxed{234.572}.
      $$

  - id: q015
    type: numericResponse
    prompt: |
      Without changing variables, write an integral with differential $dx$ for the exact length of the upper boundary

      $$
      y=\sqrt{2x+1},\qquad0\leq x\leq12.
      $$

      Enter the length rounded to three decimal places.
    answer:
      value: 12.756
      tolerance: 0.0005
    explanation: |
      Since

      $$
      y'=\frac{1}{\sqrt{2x+1}},
      $$

      the arc length is

      $$
      L=\int_0^{12}
      \sqrt{1+\frac{1}{2x+1}}\,dx
      \approx\boxed{12.756}.
      $$

      Related topic: Cartesian arc length with respect to $x$.

  - id: q016
    type: numericResponse
    prompt: |
      Rewrite the upper boundary as

      $$
      x=\frac{y^2-1}{2},\qquad1\leq y\leq5.
      $$

      Write its exact arc-length integral with differential $dy$, then enter the length rounded to three decimal places.
    answer:
      value: 12.756
      tolerance: 0.0005
    explanation: |
      Here $dx/dy=y$, so

      $$
      L=\int_1^5\sqrt{1+y^2}\,dy
      \approx\boxed{12.756}.
      $$

      This must agree with the $dx$ formulation because both integrals measure the same geometric curve.

  - id: q017
    type: numericResponse
    prompt: |
      Rotate the upper boundary

      $$
      y=\sqrt{2x+1},\qquad0\leq x\leq12
      $$

      about the $x$-axis. Write the exact surface-area integral and enter the result rounded to three decimal places.
    answer:
      value: 271.740
      tolerance: 0.0005
    explanation: |
      Use

      $$
      S=2\pi\int_a^b y\sqrt{1+(y')^2}\,dx.
      $$

      The product simplifies:

      $$
      \sqrt{2x+1}
      \sqrt{1+\frac{1}{2x+1}}
      =\sqrt{2x+2}.
      $$

      Thus

      $$
      S=2\pi\int_0^{12}\sqrt{2x+2}\,dx
      =\frac{2\pi}{3}\left(26\sqrt{26}-2\sqrt2\right)
      \approx\boxed{271.740}.
      $$

  - id: q018
    type: freeResponse
    prompt: |
      Find the centroid $(\bar{x},\bar{y})$ of the region enclosed by

      $$
      y=\sqrt{2x+1}
      \qquad\text{and}\qquad
      y=\frac{x}{3}+1.
      $$

      State the area and both moment integrals used. Give exact coordinates and three-decimal approximations.
    answer:
      expected: 'The area is 16/3. The centroid is (26/5, 3), approximately (5.200, 3.000).'
      gradingMode: selfCheck
      keyPoints:
        - '$A=\int_0^{12}(f-g)\,dx=16/3$.'
        - '$\bar{x}=\frac1A\int_0^{12}x(f-g)\,dx=26/5$.'
        - '$\bar{y}=\frac1{2A}\int_0^{12}(f^2-g^2)\,dx=3$.'
        - The decimal centroid is $(5.200,3.000)$.
    explanation: |
      Let

      $$
      f(x)=\sqrt{2x+1},
      \qquad
      g(x)=\frac{x}{3}+1,
      \qquad
      A=\frac{16}{3}.
      $$

      Then

      $$
      \bar{x}
      =\frac1A\int_0^{12}x[f(x)-g(x)]\,dx
      =\frac{26}{5},
      $$

      and

      $$
      \bar{y}
      =\frac1{2A}\int_0^{12}[f(x)^2-g(x)^2]\,dx
      =3.
      $$

      Therefore

      $$
      \boxed{(\bar{x},\bar{y})=\left(\frac{26}{5},3\right)}
      \approx(5.200,3.000).
      $$

  - id: q019
    type: freeResponse
    prompt: |
      Let

      $$
      f(x)=4e^{-2x}
      $$

      on $[0,2]$.

      1. Write the average-value integral.
      2. Evaluate the average value to three decimal places.
      3. Find the value $c\in[0,2]$ satisfying the Mean Value Theorem for integrals, and approximate it to three decimal places.
    answer:
      expected: 'The average value is (1/2) integral from 0 to 2 of 4e^(-2x) dx = 1-e^(-4), approximately 0.982. The MVT value is c=(1/2)ln(4/(1-e^(-4))), approximately 0.702.'
      gradingMode: selfCheck
      keyPoints:
        - '$f_{\mathrm{avg}}=\frac12\int_0^2 4e^{-2x}\,dx$.'
        - '$f_{\mathrm{avg}}=1-e^{-4}\approx0.982$.'
        - Solve $4e^{-2c}=1-e^{-4}$.
        - '$c=\frac12\ln\left(\frac4{1-e^{-4}}\right)\approx0.702$.'
    explanation: |
      The average value is

      $$
      f_{\mathrm{avg}}
      =\frac{1}{2-0}\int_0^2 4e^{-2x}\,dx
      =1-e^{-4}
      \approx\boxed{0.982}.
      $$

      The Mean Value Theorem for integrals requires

      $$
      f(c)=f_{\mathrm{avg}}.
      $$

      Therefore

      $$
      4e^{-2c}=1-e^{-4}
      \quad\Longrightarrow\quad
      c=\frac12\ln\left(\frac4{1-e^{-4}}\right)
      \approx\boxed{0.702}.
      $$

      Related topic: average value and existence of a representative function value.
