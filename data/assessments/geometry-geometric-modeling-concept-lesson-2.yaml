lesson:
  introduction: |-
    Just as we use 2D area to model population density on land, we use 3D volume to model the mass density of objects.
  sections:
  - id: sec-modeling-volume
    title: Modeling 3D Objects
    required: true
    content: |-
      Many real-world objects can be approximated using basic 3D geometric solids.
      - A tree trunk can be modeled as a **cylinder**.
      - A mountain or a pile of sand can be modeled as a **cone**.
      - A basketball or the Earth can be modeled as a **sphere**.
      - A shipping container is a **rectangular prism**.
      
      By finding the volume of these idealized shapes, we can estimate how much space the real object takes up!

  - id: sec-mass-density
    title: Mass Density
    required: true
    content: |-
      **Mass Density** (often just called "density" in physics) is a measure of how tightly packed the matter in an object is. It is the ratio of an object's mass to its volume.
      
      $$\text{Density} = \frac{\text{Mass}}{\text{Volume}} \quad (D = \frac{m}{V})$$
      
      For example, lead has a very high density because a lot of mass is packed into a small volume. A sponge has a low density because it takes up a lot of volume but has very little mass.
      
      If you know the material an object is made of (which gives you its density) and you can use geometry to calculate its volume, you can predict exactly how heavy it will be without ever putting it on a scale! 
      $$m = D \times V$$

questions:
- id: q-geom-mod2-1
  title: Concept Check - Finding Mass
  prompt: |-
    A block of solid gold is modeled as a rectangular prism measuring $2$ cm by $3$ cm by $5$ cm. The density of gold is roughly $19.3$ grams per cubic centimeter. What is the mass of the gold block?
  type: numericResponse
  answer:
    numericValue: 579
    tolerance: 0.1
  explanation: |-
    First, find the volume of the rectangular prism: $V = l \times w \times h = 2 \times 3 \times 5 = 30 \text{ cm}^3$.
    Then, multiply the volume by the density to find the mass: $m = D \times V = 19.3 \times 30 = 579$ grams.
  skills:
  - geometry-geometric-modeling

- id: q-geom-mod2-2
  title: Concept Check - Finding Density
  prompt: |-
    A perfectly spherical cannonball has a radius of $3$ inches. It weighs $28.27$ pounds. What is its density in pounds per cubic inch? (Use $\pi \approx 3.14159$)
  type: numericResponse
  answer:
    numericValue: 0.25
    tolerance: 0.05
  explanation: |-
    First, find the volume of the sphere: $V = \frac{4}{3}\pi r^3 = \frac{4}{3}\pi (3^3) = 36\pi \approx 113.1$ cubic inches.
    Then, divide the mass by the volume to find the density: $D = \frac{m}{V} = \frac{28.27}{113.1} \approx 0.25$ lbs/in$^3$.
  skills:
  - geometry-geometric-modeling
