schemaVersion: 1
id: aops-complex-numbers-quiz
title: Complex Numbers Practice Quiz
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-complex-numbers
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-complex-numbers
  - complex-arithmetic
  - conjugates
  - powers-of-i
skills:
- Compute with complex numbers in standard form
- Reduce powers of i using their period-four cycle
- Use conjugates for modulus and division
- Check complex identities and equations componentwise
questions:
- id: q001
  type: multipleChoice
  prompt: 'Evaluate $i^{37}$.'
  choices:
  - id: a
    text: '$1$'
  - id: b
    text: '$i$'
  - id: c
    text: '$-1$'
  - id: d
    text: '$-i$'
  answer:
    choiceId: b
  explanation: Since $37\equiv1\pmod4$, the power equals $i^1$.
- id: q002
  type: multipleChoice
  prompt: 'Compute $(3+4i)+(5-9i)$.'
  choices:
  - id: a
    text: '$8-5i$'
  - id: b
    text: '$8+13i$'
  - id: c
    text: '$-2-5i$'
  - id: d
    text: '$15-36i$'
  answer:
    choiceId: a
  explanation: Add real components and imaginary components separately.
- id: q003
  type: multipleChoice
  prompt: 'Compute $(3-2i)(4+i)$.'
  choices:
  - id: a
    text: '$10-5i$'
  - id: b
    text: '$14-5i$'
  - id: c
    text: '$14+i$'
  - id: d
    text: '$12-8i$'
  answer:
    choiceId: b
  explanation: Expanding gives $12+3i-8i-2i^2=14-5i$.
- id: q004
  type: multipleChoice
  prompt: 'Write $(1+i)^2$ in standard form.'
  choices:
  - id: a
    text: '$2$'
  - id: b
    text: '$2i$'
  - id: c
    text: '$1+i$'
  - id: d
    text: '$-2$'
  answer:
    choiceId: b
  explanation: $1+2i+i^2=2i$.
- id: q005
  type: multipleChoice
  prompt: 'What are all solutions of $z^2=-49$?'
  choices:
  - id: a
    text: '$z=7i$ only'
  - id: b
    text: '$z=-7i$ only'
  - id: c
    text: '$z=\pm7i$'
  - id: d
    text: '$z=\pm7$'
  answer:
    choiceId: c
  explanation: Both $7i$ and $-7i$ square to $-49$.
- id: q006
  type: multipleChoice
  prompt: 'If $a+bi=-6+11i$, what is $a+b$?'
  choices:
  - id: a
    text: '$-17$'
  - id: b
    text: '$5$'
  - id: c
    text: '$17$'
  - id: d
    text: '$-5$'
  answer:
    choiceId: b
  explanation: Equality in standard form gives $a=-6$ and $b=11$.
- id: q007
  type: multipleChoice
  prompt: 'What is the conjugate of $-6+11i$?'
  choices:
  - id: a
    text: '$6-11i$'
  - id: b
    text: '$-6-11i$'
  - id: c
    text: '$6+11i$'
  - id: d
    text: '$-11+6i$'
  answer:
    choiceId: b
  explanation: A conjugate changes only the sign of the imaginary component.
- id: q008
  type: multipleChoice
  prompt: 'Which number has the greater modulus?'
  choices:
  - id: a
    text: '$3+4i$, because $|3+4i|^2=25$.'
  - id: b
    text: '$1+5i$, because $|1+5i|^2=26$.'
  - id: c
    text: They have equal modulus.
  - id: d
    text: The modulus is undefined for both.
  answer:
    choiceId: b
  explanation: Squared moduli can be compared directly, and $26>25$.
- id: q009
  type: multipleChoice
  prompt: 'Simplify $\dfrac{5+i}{5-i}$.'
  choices:
  - id: a
    text: '$1$'
  - id: b
    text: '$\dfrac{12+5i}{13}$'
  - id: c
    text: '$\dfrac{12-5i}{13}$'
  - id: d
    text: '$\dfrac{24+10i}{13}$'
  answer:
    choiceId: b
  explanation: Multiply by $(5+i)/(5+i)$, then reduce $(24+10i)/26$.
- id: q010
  type: multipleChoice
  prompt: 'Compute $i^2+i^3+i^4$.'
  choices:
  - id: a
    text: '$-i$'
  - id: b
    text: '$i$'
  - id: c
    text: '$-2-i$'
  - id: d
    text: '$1-i$'
  answer:
    choiceId: a
  explanation: The sum is $-1-i+1=-i$.
- id: q011
  type: multipleChoice
  prompt: 'Solve $z+(4-3i)=10+i$.'
  choices:
  - id: a
    text: '$z=6-2i$'
  - id: b
    text: '$z=14-2i$'
  - id: c
    text: '$z=6+4i$'
  - id: d
    text: '$z=14+4i$'
  answer:
    choiceId: c
  explanation: |-
    Subtract $4-3i$ from both sides: $10+i-4+3i=6+4i$.
- id: q012
  type: multipleChoice
  prompt: 'Which calculation disproves $\sqrt{ab}=\sqrt a\sqrt b$ for principal complex square roots?'
  choices:
  - id: a
    text: 'Set $a=b=1$: both sides equal 1.'
  - id: b
    text: 'Set $a=b=-1$: the left side is 1 while the right side is $i^2=-1$.'
  - id: c
    text: 'Set $a=0,b=-1$: both sides equal 0.'
  - id: d
    text: The identity cannot be tested with numbers.
  answer:
    choiceId: b
  explanation: One valid counterexample is enough to disprove a claimed universal identity.
- id: q013
  type: selectAll
  prompt: 'Select every statement that is true for $z=a+bi$ with real $a,b$.'
  choices:
  - id: a
    text: '$\overline z=a-bi$.'
  - id: b
    text: '$z\overline z=a^2+b^2$.'
  - id: c
    text: '$z=0$ whenever $a+b=0$.'
  - id: d
    text: '$|z|=\sqrt{a^2+b^2}$.'
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: A complex number is zero only when both components are zero, not merely when their sum is zero.
- id: q014
  type: selectAll
  prompt: 'Which methods correctly verify a complex-number result?'
  choices:
  - id: a
    text: Verify a quotient $q=w/v$ by checking $qv=w$.
  - id: b
    text: Verify equality by comparing both real and imaginary components.
  - id: c
    text: Verify $z^2=w$ by checking only the real part of $z^2$.
  - id: d
    text: Verify a claimed square root by squaring it.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: Complex equality requires both components to agree.
- id: q015
  type: freeResponse
  prompt: |-
    Explain why $(a+bi)(a-bi)$ is always real for real $a,b$, and state its value.
  answer:
    gradingMode: selfCheck
    expected: |-
      Expanding gives $a^2-abi+abi-b^2i^2$. The cross terms cancel and $i^2=-1$, so the product is $a^2+b^2$, which is real and nonnegative.
    keyPoints:
    - Expands the conjugate product correctly.
    - Identifies cancellation of the imaginary cross terms.
    - Uses $i^2=-1$ to obtain $a^2+b^2$.
  explanation: This conjugate-product identity is the basis for complex division and squared modulus.
