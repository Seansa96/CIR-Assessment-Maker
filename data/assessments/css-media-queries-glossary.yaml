glossary:
  introduction: Review these terms for Media Queries Glossary.
  sections:
  - id: main-terms
    title: Core Terms
    required: true
    entries:
    - id: media-query
      term: Media Query
      definition: A CSS technique introduced in CSS3 to apply styles based on device characteristics, typically screen width.
      drills:
      - id: media-query-drill
        type: typed
        prompt: 'What is the term for: A CSS technique introduced in CSS3 to apply styles based on device characteristics, typically screen width.?'
        answer:
          expected: Media Query
          aliases:
          - media query
        explanation: The term is Media Query.
    - id: breakpoint
      term: Breakpoint
      definition: The point at which your site's content will respond to provide the user with the best possible layout to consume the information.
      drills:
      - id: breakpoint-drill
        type: typed
        prompt: 'What is the term for: The point at which your site''s content will respond to provide the user with the best possible layout to consume the information.?'
        answer:
          expected: Breakpoint
          aliases:
          - breakpoint
        explanation: The term is Breakpoint.
