workedExamples:
  - id: we-polar-calc-1
    title: Area of a Polar Region
    problem: |
      Find the area of the region that lies inside the polar curve $r = 3\sin\theta$ and outside the curve $r = 1 + \sin\theta$.
    steps:
      - id: step-we-polar-calc-1a
        title: Find the points of intersection
        instruction: |
          First, find where the curves intersect to determine the limits of integration.
          Set the equations equal:
          $3\sin\theta = 1 + \sin\theta$
          $2\sin\theta = 1 \implies \sin\theta = \frac{1}{2}$
          
          The solutions in $[0, 2\pi)$ are $\theta = \frac{\pi}{6}$ and $\theta = \frac{5\pi}{6}$.
          Since both curves are in the upper half-plane and symmetric about $\theta = \pi/2$, the region is bounded between these two angles.
        type: freeResponse
        prompt: Did you find the limits of integration?
        answer:
          gradingMode: selfCheck
        skills:
          - polar-calculus

      - id: step-we-polar-calc-1b
        title: Set up the area integral
        instruction: |
          The area between two polar curves $r_{outer}$ and $r_{inner}$ is given by:
          
          $$
          A = \frac{1}{2} \int_{\alpha}^{\beta} (r_{outer}^2 - r_{inner}^2) \, d\theta
          $$
          
          Here, $r_{outer} = 3\sin\theta$ and $r_{inner} = 1 + \sin\theta$.
          
          $A = \frac{1}{2} \int_{\pi/6}^{5\pi/6} \left( (3\sin\theta)^2 - (1 + \sin\theta)^2 \right) \, d\theta$
        type: symbolicResponse
        prompt: 'Expand the integrand $(3\sin\theta)^2 - (1 + \sin\theta)^2$. What is the simplified expression?'
        answer:
          expectedLatex: '8\sin^2\theta - 2\sin\theta - 1'
          equivalenceMode: expression
          variables: []
          tolerance: 0.000001
        explanation: |
          $(3\sin\theta)^2 = 9\sin^2\theta$
          $(1 + \sin\theta)^2 = 1 + 2\sin\theta + \sin^2\theta$
          
          Subtracting gives: $9\sin^2\theta - (1 + 2\sin\theta + \sin^2\theta) = 8\sin^2\theta - 2\sin\theta - 1$.
        skills:
          - polar-calculus

      - id: step-we-polar-calc-1c
        title: Evaluate the integral
        instruction: |
          Now evaluate:
          $$
          A = \frac{1}{2} \int_{\pi/6}^{5\pi/6} (8\sin^2\theta - 2\sin\theta - 1) \, d\theta
          $$
          
          Use the half-angle identity: $\sin^2\theta = \frac{1 - \cos(2\theta)}{2}$.
          $8\sin^2\theta = 4(1 - \cos(2\theta)) = 4 - 4\cos(2\theta)$.
          
          The integral becomes:
          $$
          A = \frac{1}{2} \int_{\pi/6}^{5\pi/6} (3 - 4\cos(2\theta) - 2\sin\theta) \, d\theta
          $$
          
          Evaluating the antiderivative:
          $\frac{1}{2} \left[ 3\theta - 2\sin(2\theta) + 2\cos\theta \right]_{\pi/6}^{5\pi/6}$
        type: numericResponse
        prompt: 'Evaluate this exactly, but provide your answer as a decimal rounded to 3 decimal places.'
        answer:
          value: 3.14159265
          tolerance: 0.005
        explanation: |
          At $\theta = 5\pi/6$:
          $3(5\pi/6) - 2\sin(5\pi/3) + 2\cos(5\pi/6) = \frac{5\pi}{2} - 2(-\sqrt{3}/2) + 2(-\sqrt{3}/2) = \frac{5\pi}{2} + \sqrt{3} - \sqrt{3} = \frac{5\pi}{2}$
          
          At $\theta = \pi/6$:
          $3(\pi/6) - 2\sin(\pi/3) + 2\cos(\pi/6) = \frac{\pi}{2} - 2(\sqrt{3}/2) + 2(\sqrt{3}/2) = \frac{\pi}{2}$
          
          Subtracting: $\frac{5\pi}{2} - \frac{\pi}{2} = \frac{4\pi}{2} = 2\pi$.
          Multiply by $\frac{1}{2}$ from the area formula: $A = \frac{1}{2}(2\pi) = \pi$.
          The area is exactly $\pi$, which is $\approx 3.142$.
        skills:
          - polar-calculus
