questions:
- id: q001
  difficultyDimensions:
  - ModelOrDerivation
  - Simplification
  type: multipleChoice
  prompt: |
    Two space stations drift in deep space and attract each other with a gravitational force $F$. If they fire their thrusters and move apart until the distance between their centers is **tripled**, what will be the new gravitational force between them?
  choices:
  - id: a
    text: '$F / 9$'
  - id: b
    text: '$F / 3$'
  - id: c
    text: '$F$'
  - id: d
    text: '$3F$'
  answer:
    choiceId: a
  explanation: |
    Solution:
    The new force is $1/9$ of the original force.
    
    Why it works: Newton's Law of Universal Gravitation is an inverse-square law ($F \propto 1/r^2$). If the distance $r$ is multiplied by $3$, the force is divided by $3^2 = 9$.
    
    Why the other choices fail: 
    - $F/3$ assumes a simple linear inverse relationship ($1/r$).
    - $F$ assumes gravity doesn't change with distance.
    - $3F$ implies gravity gets stronger as things move further apart, which violates the law of attraction.
