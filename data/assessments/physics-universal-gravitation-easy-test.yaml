questions:
- id: q001
  difficultyDimensions:
  - ModelOrDerivation
  - Simplification
  type: numericResponse
  prompt: |
    Two masses, $m_1 = 5.0\text{ kg}$ and $m_2 = 10.0\text{ kg}$, are separated by a distance of $r = 2.0\text{ m}$ between their centers. 
    
    Calculate the magnitude of the gravitational force between them in units of $10^{-10}\text{ N}$. Use $G = 6.67 \times 10^{-11}\text{ N}\cdot\text{m}^2/\text{kg}^2$.
    (For example, if the answer is $3.5 \times 10^{-10}\text{ N}$, enter 3.5).
  answer:
    value: 8.3375
    tolerance: 0.1
  explanation: |
    Solution:
    Apply Newton's Law of Universal Gravitation directly.
    $$ F = G \frac{m_1 m_2}{r^2} $$
    
    Why it works:
    Plug in the values:
    $$ F = (6.67 \times 10^{-11}) \frac{(5.0)(10.0)}{(2.0)^2} $$
    $$ F = (6.67 \times 10^{-11}) \frac{50.0}{4.0} $$
    $$ F = (6.67 \times 10^{-11})(12.5) = 83.375 \times 10^{-11} = 8.3375 \times 10^{-10}\text{ N} $$
    
    The value to enter is $8.3375$.
