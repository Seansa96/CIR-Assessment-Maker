workedExamples:
- id: we001
  title: Building a D&D Dice Roller
  problem: 'We want to create a reusable class that simulates rolling standard Dungeons
    & Dragons dice (d4, d6, d8, d12, d20).

    We will use the `System.Random` class, but we must be careful about\rhow we instantiate
    it to avoid generating the same numbers repeatedly.

    '
  steps:
  - id: step-we001-1
    title: The Naive Approach
    instruction: "First, let's look at the WRONG way to do it:\n\n```csharp\npublic\
      \ class BadDiceRoller\n{\n    public int RollD20()\n    {\n        Random rng\
      \ = new Random(); // Don't do this!\n        return rng.Next(1, 21);\n    }\n\
      }\n```\n"
    type: multipleChoice
    prompt: |
      Why is creating a `new Random()` inside the method a bad idea if you call `RollD20()` very quickly in a loop?
    choices:
    - id: a
      text: It uses up too much computer memory.
    - id: b
      text: '`new Random()` is seeded by the system clock. If called repeatedly in
        the same millisecond, it will produce the exact same "random" number over
        and over.'
    - id: c
      text: It will throw an exception if called more than 10 times.
    answer:
      choiceId: b
    explanation: |
      Historically in .NET, `new Random()` grabs the current system time to use as a mathematical seed. If the clock hasn't ticked to the next millisecond, the next `new Random()` gets the exact same seed, producing identical results.
  - id: step-we001-2
    title: The Correct Approach
    instruction: "To fix this, we should create ONE instance of `Random` and share\
      \ it across the whole class (or even the whole application).\n\n```csharp\n\
      public class DiceRoller\n{\n    // Create one shared instance\n    private Random\
      \ _rng = new Random();\n    \n    public int Roll(int sides)\n    {\n      \
      \  return _rng.Next(1, sides + 1);\n    }\n}\n```\n"
    type: numericResponse
    prompt: |
      If we call `Roll(6)` using the correct class above, what is the *highest* possible number that could be returned?
    answer:
      value: 6
      tolerance: 0
    explanation: |
      The method passes `sides + 1` into the upper bound of `.Next()`. So `Roll(6)` passes `7`. Because `.Next()`'s upper bound is exclusive, the highest number it will ever return is `6`.
  - id: step-we001-3
    title: Simulating Advantage
    instruction: "In D&D, rolling \"with Advantage\" means you roll two d20s and take\
      \ the HIGHEST result. Let's use `System.Math` to do this easily.\n\n```csharp\n\
      public int RollWithAdvantage()\n{\n    int roll1 = Roll(20);\n    int roll2\
      \ = Roll(20);\n    \n    return Math.Max(roll1, roll2);\n}\n```\n"
    type: multipleChoice
    prompt: |
      What would `Math.Max(14, 14)` return?
    choices:
    - id: a
      text: '`14`'
    - id: b
      text: '`28`'
    - id: c
      text: '`0`'
    answer:
      choiceId: a
    explanation: |
      `Math.Max` simply returns the larger of the two numbers. If they are identical, it just returns that number.
