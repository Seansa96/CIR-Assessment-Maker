navigation: { learningGoal: learn, activityType: glossary, tags: [calculus-2, area-between-curves, formulas] }
authoring: { visualRequirement: required, visualRationale: Boundary order and slice orientation require visual recognition. }
glossary:
  introduction: 'The area formula is selected by slice orientation. Learn the boundary-order phrase before writing an integral.'
  sections:
    - id: setup-language
      title: Setup language and recognition cues
      required: true
      content: 'Use these terms to describe a defensible area model.'
      entries:
        - id: intersection-bound
          term: Intersection bound
          definition: A coordinate where the two boundary curves meet and a region may begin, end, or need a partition.
          notation: '$f(x)=g(x)$ for vertical-bound x-values'
          examples: ['Check whether all intersections actually bound the shaded region.']
          aliases: [intersection point]
          media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Intersection points at the ends of a shaded region }]
          tags: [bounds, intersections]
          drills: [{ id: intersection-drill, type: cloze, prompt: 'Solve $f(x)=g(x)$ to find likely ____ for a vertical area integral.', answer: { expected: bounds, aliases: [endpoints] }, explanation: 'Solution: The missing term is bounds. Why it works: Intersections locate where the two-curve region begins or ends. Common trap: A bound is a coordinate, not a slice height.' }]
        - id: vertical-area
          term: Vertical area slice
          definition: A rectangle of thickness $dx$ whose height is the upper y-boundary minus the lower y-boundary.
          notation: '$[f_{top}(x)-f_{bottom}(x)]\,dx$'
          examples: ['Use when the region is conveniently described by y-functions of x.']
          aliases: [top minus bottom]
          media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Vertical slice labeled top minus bottom and dx }]
          tags: [vertical, dx]
          drills: [{ id: vertical-drill, type: flashcard, prompt: 'State the boundary-order phrase for a vertical area slice.', answer: { expected: top minus bottom, aliases: ['upper minus lower'] }, explanation: 'Solution: The phrase is top minus bottom. Why it works: The slice measures vertical distance. Common trap: Pair it with $dx$, not $dy$.' }]
        - id: horizontal-area
          term: Horizontal area slice
          definition: A rectangle of thickness $dy$ whose length is the right x-boundary minus the left x-boundary.
          notation: '$[R(y)-L(y)]\,dy$'
          examples: ['Use when x is naturally expressed as a function of y.']
          aliases: [right minus left]
          media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Area model used to identify a horizontal right-minus-left slice }]
          tags: [horizontal, dy]
          drills: [{ id: horizontal-drill, type: cloze, prompt: 'A horizontal slice is ____ minus ____ times $dy$.', answer: { expected: 'right; left', aliases: ['right,left'] }, explanation: 'Solution: The order is right then left. Why it works: The slice measures an x-distance. Common trap: A horizontal slice does not use top minus bottom.' }]
        - id: partition-point
          term: Partition point
          definition: A location at which the slice formula changes because boundary order, sign, or a piecewise expression changes.
          notation: ''
          examples: ['Axis crossings and absolute-value corners can require partitions even if they are not outer endpoints.']
          aliases: [break point]
          media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Region model showing that a changing boundary relation requires separate pieces }]
          tags: [piecewise, partition]
          drills: [{ id: partition-drill, type: typed, prompt: 'What must you do when the top curve changes identity within the interval?', answer: { expected: 'partition the integral', aliases: ['split the integral', 'split it'] }, explanation: 'Solution: Partition or split the integral. Why it works: Each piece needs one correct boundary-order formula. Common trap: A single formula cannot represent two different top curves.' }]
        - id: geometric-area
          term: Geometric area
          definition: A nonnegative measure of a region; unlike signed integral, it does not allow below-axis pieces to cancel above-axis pieces.
          notation: '$\int |f(x)|\,dx$ when the only lower boundary is the axis'
          examples: ['Split at zeros instead of integrating a sign-changing height without adjustment.']
          aliases: [unsigned area]
          media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Shaded region interpreted as nonnegative area }]
          tags: [sign, area]
          drills: [{ id: geometric-area-drill, type: flashcard, prompt: 'Does geometric area permit positive and negative pieces to cancel?', answer: { expected: no, aliases: ['no', 'it is nonnegative'] }, explanation: 'Solution: No; geometric area is nonnegative. Why it works: It accumulates distances rather than signed heights. Common trap: A zero definite integral can still enclose positive area.' }]
