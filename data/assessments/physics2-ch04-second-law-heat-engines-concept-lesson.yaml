workedExamples:
- id: l1-sec1
  title: The Second Law of Thermodynamics
  explanation: While the First Law of Thermodynamics is a statement of energy conservation,
    it does not dictate the direction of heat flow. The Second Law of Thermodynamics
    states that heat naturally flows from a hotter body to a colder body, and never
    the reverse spontaneously. This sets fundamental limits on how we can convert
    heat into work.
- id: l1-sec2
  title: Heat Engines
  explanation: 'A heat engine is a device that operates in a cyclic process to convert
    thermal energy (heat) into mechanical work. It absorbs heat $Q_h$ from a hot reservoir
    at temperature $T_h$, performs work $W$, and expels waste heat $Q_c$ to a cold
    reservoir at temperature $T_c$.


    By conservation of energy (First Law for a cycle): $W = Q_h - Q_c$.


    The thermal efficiency $e$ of a heat engine is the ratio of the work done to the
    heat absorbed:

    $$e = \frac{W}{Q_h} = 1 - \frac{Q_c}{Q_h}$$'
- id: l1-sec3
  title: Refrigerators and Heat Pumps
  explanation: 'A refrigerator is a heat engine operated in reverse. It takes in work
    $W$ to extract heat $Q_c$ from a cold reservoir and expel heat $Q_h$ to a hot
    reservoir. The performance is measured by the coefficient of performance (COP).


    For a refrigerator:

    $$K_R = \frac{Q_c}{W} = \frac{Q_c}{Q_h - Q_c}$$


    For a heat pump (whose goal is to heat a space):

    $$K_P = \frac{Q_h}{W} = \frac{Q_h}{Q_h - Q_c}$$'
