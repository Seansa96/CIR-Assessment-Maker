  introduction: >
    This lesson develops a repeatable way to solve Heat Engines and Refrigerators problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch04-second-law-heat-engines-s1
    title: Name the model and quantities
    required: true
    content: >
      Heat Engines and Refrigerators uses eta = W_out/Q_h. In the name the model and quantities stage, separate input heat, rejected heat, and useful work before calculating efficiency.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
