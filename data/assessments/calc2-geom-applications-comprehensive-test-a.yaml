questions:
  - id: ca-geom-a-1
    title: Area of Parabolas
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      Find the exact area of the region enclosed by $y = x^2$ and $y = 4 - x^2$.
    answer:
      gradingMode: auto
      expectedLatex: \frac{16\sqrt{2}}{3}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Intersection points: $x^2 = 4 - x^2 \implies 2x^2 = 4 \implies x = \pm\sqrt{2}$.
      2. The top curve is $4-x^2$.
      3. $A = \int_{-\sqrt{2}}^{\sqrt{2}} (4 - 2x^2) \, dx = \left[ 4x - \frac{2}{3}x^3 \right]_{-\sqrt{2}}^{\sqrt{2}}$.
      4. $A = \left(4\sqrt{2} - \frac{4\sqrt{2}}{3}\right) - \left(-4\sqrt{2} + \frac{4\sqrt{2}}{3}\right) = 8\sqrt{2} - \frac{8\sqrt{2}}{3} = \frac{16\sqrt{2}}{3}$.

  - id: ca-geom-a-2
    title: Area of Cubic and Quadratic
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      Find the exact area of the region enclosed by $f(x) = x^3 - 4x^2 + x - 1$ and $g(x) = -x^2 + 2x - 4$.
    answer:
      gradingMode: auto
      expectedLatex: 8
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Intersections: $x^3 - 4x^2 + x - 1 = -x^2 + 2x - 4 \implies x^3 - 3x^2 - x + 3 = 0$.
      2. Factoring by grouping: $x^2(x-3) - 1(x-3) = 0 \implies (x^2-1)(x-3) = 0$.
      3. The curves intersect at $x = -1, 1, 3$.
      4. On $[-1, 1]$, $f(x) > g(x)$. On $[1, 3]$, $g(x) > f(x)$.
      5. $A = \int_{-1}^1 (x^3 - 3x^2 - x + 3) \, dx + \int_1^3 (-x^3 + 3x^2 + x - 3) \, dx$.
      6. Evaluated, the first integral yields 4, and the second integral yields 4.
      7. Total area = $4 + 4 = 8$.

  - id: ca-geom-a-3
    title: Volume by Cross Sections (Squares)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = \sqrt{x-2}$, the x-axis, and $x = 11$ is the base of a solid where cross sections perpendicular to the x-axis are squares.
      
      Determine the exact volume of the solid.
    answer:
      gradingMode: auto
      expectedLatex: 40.5
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Side length of square $s = y = \sqrt{x-2}$.
      2. Area of cross section $A(x) = s^2 = x-2$.
      3. Volume $V = \int_2^{11} (x-2) \, dx = \left[ \frac{1}{2}x^2 - 2x \right]_2^{11}$.
      4. $V = \left(\frac{121}{2} - 22\right) - \left(2 - 4\right) = 38.5 - (-2) = 40.5$.

  - id: ca-geom-a-4
    title: Volume of Revolution (x-axis, dx)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y=x^3$, the x-axis, and $x=2$ is rotated about the x-axis. 
      
      Determine the exact volume of the solid.
    answer:
      gradingMode: auto
      expectedLatex: \frac{128\pi}{7}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Using disks with differential $dx$: $r = x^3$.
      2. $V = \int_0^2 \pi (x^3)^2 \, dx = \pi \int_0^2 x^6 \, dx$.
      3. $V = \pi \left[ \frac{x^7}{7} \right]_0^2 = \frac{128\pi}{7}$.

  - id: ca-geom-a-5
    title: Volume of Revolution (y-axis, dx)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y=x^3$, the x-axis, and $x=2$ is rotated about the y-axis. 
      
      Determine the exact volume using the differential $dx$.
    answer:
      gradingMode: auto
      expectedLatex: \frac{64\pi}{5}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. Since we must use $dx$ to rotate about the y-axis, we use the method of cylindrical shells.
      2. Radius $r = x$, Height $h = x^3$.
      3. $V = \int_0^2 2\pi x (x^3) \, dx = 2\pi \int_0^2 x^4 \, dx$.
      4. $V = 2\pi \left[ \frac{x^5}{5} \right]_0^2 = 2\pi \left(\frac{32}{5}\right) = \frac{64\pi}{5}$.

  - id: ca-geom-a-6
    title: Volume of Revolution (Parabola, Disks)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = 10x - x^2$ and the x-axis is rotated about the x-axis.
      
      Determine the exact volume of the solid.
    answer:
      gradingMode: auto
      expectedLatex: \frac{10000\pi}{3}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. The parabola intersects the x-axis at $x=0$ and $x=10$.
      2. Disk method: $V = \int_0^{10} \pi (10x - x^2)^2 \, dx$.
      3. Expand: $(10x - x^2)^2 = 100x^2 - 20x^3 + x^4$.
      4. $V = \pi \left[ \frac{100}{3}x^3 - 5x^4 + \frac{1}{5}x^5 \right]_0^{10}$.
      5. $V = \pi \left( \frac{100000}{3} - 50000 + 20000 \right) = \pi \left( \frac{100000}{3} - \frac{90000}{3} \right) = \frac{10000\pi}{3}$.

  - id: ca-geom-a-7
    title: Volume of Revolution (Parabola, Shifted Axis)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = 10x - x^2$ and the x-axis is rotated about the line $y = 30$.
      
      Which of the following integral expressions correctly represents the volume?
    choices:
      - id: a
        text: $\int_0^{10} \pi \left[ 30^2 - (30 - (10x-x^2))^2 \right] \, dx$
      - id: b
        text: $\int_0^{10} \pi \left[ (30 - (10x-x^2))^2 - 30^2 \right] \, dx$
      - id: c
        text: $\int_0^{10} 2\pi (30-x)(10x-x^2) \, dx$
      - id: d
        text: $\int_0^{10} \pi (30 - 10x + x^2)^2 \, dx$
    answer:
      choiceId: a
    explanation: |
      This requires the Washer method. 
      The axis of revolution is $y=30$. The region is bounded between $y=0$ and $y=10x-x^2$. 
      The outer radius $R$ is the distance from $y=30$ to the bottom curve $y=0$, so $R = 30 - 0 = 30$.
      The inner radius $r$ is the distance from $y=30$ to the top curve $y=10x-x^2$, so $r = 30 - (10x - x^2)$.
      Thus, $V = \int_0^{10} \pi [R^2 - r^2] \, dx = \int_0^{10} \pi [30^2 - (30 - 10x + x^2)^2] \, dx$.

  - id: ca-geom-a-8
    title: Volume of Revolution (Two Curves, Shells)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      The region bounded by $y = x^2 - 2x + 2$ and $y = 2x - 1$ is rotated about the y-axis.
      
      Which of the following integral expressions correctly represents the volume?
    choices:
      - id: a
        text: $\int_1^3 2\pi x \left[ (2x - 1) - (x^2 - 2x + 2) \right] \, dx$
      - id: b
        text: $\int_1^3 2\pi x \left[ (x^2 - 2x + 2) - (2x - 1) \right] \, dx$
      - id: c
        text: $\int_1^3 \pi \left[ (2x - 1)^2 - (x^2 - 2x + 2)^2 \right] \, dx$
      - id: d
        text: $\int_1^3 \pi x \left[ (2x - 1) - (x^2 - 2x + 2) \right]^2 \, dx$
    answer:
      choiceId: a
    explanation: |
      1. Find intersections: $x^2 - 2x + 2 = 2x - 1 \implies x^2 - 4x + 3 = 0 \implies x = 1, x = 3$.
      2. The line $y=2x-1$ is the upper curve on $[1,3]$.
      3. Since we are rotating around the y-axis and using $dx$, we must use cylindrical shells.
      4. Radius $r = x$. Height $h = \text{Top} - \text{Bottom} = (2x - 1) - (x^2 - 2x + 2)$.
      5. $V = \int_1^3 2\pi x h \, dx$.

  - id: ca-geom-a-9
    title: Average Value (Rational)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      Determine the exact average value of the function $f(x) = \frac{1}{x}$ on the interval $[1, 3]$.
    answer:
      gradingMode: auto
      expectedLatex: \frac{\ln 3}{2}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      $f_{avg} = \frac{1}{3-1} \int_1^3 \frac{1}{x} \, dx = \frac{1}{2} [\ln x]_1^3 = \frac{\ln 3 - \ln 1}{2} = \frac{\ln 3}{2}$.

  - id: ca-geom-a-10
    title: MVT for Integrals (Kinematics)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      An object initially at rest accelerates such that its acceleration is given by $a(t) = \frac{1}{2}t^2$ for $t \in [0, r]$. 
      
      Determine the time $t$ (in terms of $r$) where the velocity is equal to the average velocity over the time interval.
    answer:
      gradingMode: auto
      expectedLatex: \frac{r}{\sqrt[3]{4}}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. $v(t) = \int a(t) dt = \frac{1}{6}t^3 + C$. Since $v(0)=0$, $C=0$. $v(t) = \frac{1}{6}t^3$.
      2. Average velocity $v_{avg} = \frac{1}{r - 0} \int_0^r \frac{1}{6}t^3 \, dt = \frac{1}{r} \left[ \frac{1}{24}t^4 \right]_0^r = \frac{r^3}{24}$.
      3. Set $v(t) = v_{avg} \implies \frac{1}{6}t^3 = \frac{r^3}{24}$.
      4. $t^3 = \frac{6r^3}{24} = \frac{r^3}{4}$.
      5. $t = \frac{r}{\sqrt[3]{4}}$.

  - id: ca-geom-a-11
    title: Arc Length Integral Setup
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      Write an expression that represents the length of the portion of $y = -x^2 + 12x + 28$ that is above the x-axis.
    choices:
      - id: a
        text: $\int_{-2}^{14} \sqrt{1 + (-2x + 12)^2} \, dx$
      - id: b
        text: $\int_{-2}^{14} \sqrt{1 + (-x^2 + 12x + 28)^2} \, dx$
      - id: c
        text: $\int_{0}^{28} \sqrt{1 + (-2x + 12)^2} \, dx$
      - id: d
        text: $\int_{-2}^{14} (1 - 2x + 12) \, dx$
    answer:
      choiceId: a
    explanation: |
      1. Find roots to determine when it's above the x-axis: $-x^2 + 12x + 28 = 0 \implies x^2 - 12x - 28 = 0 \implies (x-14)(x+2) = 0$. Roots at $x=-2, 14$.
      2. Derivative $y' = -2x + 12$.
      3. Arc length $L = \int_a^b \sqrt{1 + (y')^2} \, dx = \int_{-2}^{14} \sqrt{1 + (-2x+12)^2} \, dx$.

  - id: ca-geom-a-12
    title: Arc Length of Logarithm
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      Consider the curve defined by $y = \ln(x)$ on the interval $1 \le x \le e^4$. 
      Which integral, using the differential $dx$, represents the length of this curve?
    choices:
      - id: a
        text: $\int_1^{e^4} \sqrt{1 + \frac{1}{x^2}} \, dx$
      - id: b
        text: $\int_1^{e^4} \sqrt{1 + \frac{1}{x}} \, dx$
      - id: c
        text: $\int_0^{4} \sqrt{1 + e^{2x}} \, dx$
      - id: d
        text: $\int_1^{e^4} (1 + x^{-2}) \, dx$
    answer:
      choiceId: a
    explanation: |
      1. $y = \ln x \implies y' = \frac{1}{x}$.
      2. $L = \int_a^b \sqrt{1 + (y')^2} \, dx = \int_1^{e^4} \sqrt{1 + \left(\frac{1}{x}\right)^2} \, dx = \int_1^{e^4} \sqrt{1 + \frac{1}{x^2}} \, dx$.

  - id: ca-geom-a-13
    title: Surface Area (Spherical Segment)
    type: symbolicResponse
    skills:
    - geom-applications-comprehensive
    prompt: |
      Consider the object created by revolving $y = \sqrt{1-x^2}$ for $x \in \left[0, \frac{1}{2}\right]$ about the x-axis. 
      
      Determine the exact surface area of the object.
    answer:
      gradingMode: auto
      expectedLatex: \pi
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      1. $y = (1-x^2)^{1/2} \implies y' = \frac{1}{2}(1-x^2)^{-1/2}(-2x) = \frac{-x}{\sqrt{1-x^2}}$.
      2. $1 + (y')^2 = 1 + \frac{x^2}{1-x^2} = \frac{1-x^2+x^2}{1-x^2} = \frac{1}{1-x^2}$.
      3. $S = \int_a^b 2\pi y \sqrt{1+(y')^2} \, dx = \int_0^{1/2} 2\pi \sqrt{1-x^2} \sqrt{\frac{1}{1-x^2}} \, dx$.
      4. $S = \int_0^{1/2} 2\pi \, dx = [2\pi x]_0^{1/2} = \pi$.

  - id: ca-geom-a-14
    title: Center of Mass (Centroid)
    type: multipleChoice
    skills:
    - geom-applications-comprehensive
    prompt: |
      Determine the exact coordinates of the centroid $(\bar{x}, \bar{y})$ of the region bounded by $y = \sqrt{x}$, the x-axis, and $x = 9$.
    choices:
      - id: a
        text: $\left( \frac{27}{5}, \frac{9}{4} \right)$
      - id: b
        text: $\left( \frac{9}{2}, \frac{3}{2} \right)$
      - id: c
        text: $\left( 5.4, 3 \right)$
      - id: d
        text: $\left( \frac{18}{5}, \frac{9}{4} \right)$
    answer:
      choiceId: a
    explanation: |
      1. Mass (Area) $M = \int_0^9 \sqrt{x} \, dx = \left[ \frac{2}{3}x^{3/2} \right]_0^9 = \frac{2}{3}(27) = 18$.
      2. Moment $M_y = \int_0^9 x\sqrt{x} \, dx = \left[ \frac{2}{5}x^{5/2} \right]_0^9 = \frac{2}{5}(243) = \frac{486}{5}$.
      3. Moment $M_x = \frac{1}{2}\int_0^9 (\sqrt{x})^2 \, dx = \frac{1}{2} \left[ \frac{1}{2}x^2 \right]_0^9 = \frac{81}{4}$.
      4. $\bar{x} = \frac{M_y}{M} = \frac{486/5}{18} = \frac{27}{5}$.
      5. $\bar{y} = \frac{M_x}{M} = \frac{81/4}{18} = \frac{9}{4}$.
