schemaVersion: 1
id: aops-number-systems-glossary
title: Number Systems Glossary
assessmentType: glossary
categoryId: art-of-problem-solving
topicId: aops-number-systems
modeDefault: practice
randomizeQuestions: false
navigation:
  learningGoal: learn
  activityType: glossary
  tags:
  - art-of-problem-solving
  - aops-number-systems
  - number-set-vocabulary
  - proof-vocabulary
skills:
- Interpret standard number-set notation and containment
- Distinguish rational, irrational, real, and complex terminology
- Recognize closure, counterexample, and lowest-terms proof language
glossary:
  introduction: |-
    Number-set vocabulary encodes exact definitions and allowed operations. Classification should use these definitions rather than the visual form of a number or a finite calculator display.
  sections:
  - id: standard-number-sets
    title: Standard Number Sets
    required: true
    content: Each set extends earlier sets to support more operations or equations.
    entries:
    - id: natural-number
      term: Natural Number
      definition: A positive counting number under the convention used here; some texts also include zero.
      notation: '$\mathbb N$'
      examples: ['$1,2,3,\ldots$']
      aliases: [counting number]
      media: []
      tags: [natural-number]
      drills:
      - id: natural-number-drill
        type: flashcard
        prompt: What convention must be stated when using $\mathbb N$?
        answer:
          expected: Whether zero is included.
        explanation: Both conventions occur in mathematics.
        tags: [natural-number]
    - id: integer
      term: Integer
      definition: A whole number, including negative whole numbers, zero, and positive whole numbers.
      notation: '$\mathbb Z$'
      examples: ['$\ldots,-2,-1,0,1,2,\ldots$']
      aliases: []
      media: []
      tags: [integer]
      drills:
      - id: integer-drill
        type: flashcard
        prompt: Why is every integer rational?
        answer:
          expected: Every integer n can be written as n over 1.
          aliases: ['$n=n/1$']
        explanation: The denominator 1 is a nonzero integer.
        tags: [integer]
    - id: rational-number
      term: Rational Number
      definition: A number expressible as $p/q$ for integers $p,q$ with $q\ne0$.
      notation: '$\mathbb Q$'
      examples: ['$-3/7$, $5$, and $0.\overline2$ are rational.']
      aliases: []
      media: []
      tags: [rational-number]
      drills:
      - id: rational-number-drill
        type: flashcard
        prompt: What restriction belongs in the definition $p/q$?
        answer:
          expected: q must be nonzero.
          aliases: ['$q\ne0$']
        explanation: Division by zero is undefined.
        tags: [rational-number]
    - id: irrational-number
      term: Irrational Number
      definition: A real number that cannot be represented as a quotient of two integers.
      notation: '$\mathbb R\setminus\mathbb Q$'
      examples: ['$\sqrt2$ and $\pi$ are irrational.']
      aliases: []
      media: []
      tags: [irrational-number]
      drills:
      - id: irrational-number-drill
        type: flashcard
        prompt: Why does a long calculator decimal not prove irrationality?
        answer:
          expected: It is only a finite approximation and does not rule out an exact fraction.
        explanation: Irrationality is a claim about all rational representations.
        tags: [irrational-number]
    - id: real-number
      term: Real Number
      definition: A rational or irrational number represented on the real number line.
      notation: '$\mathbb R$'
      examples: ['$-4$, $2/3$, and $\sqrt5$ are real.']
      aliases: []
      media: []
      tags: [real-number]
      drills:
      - id: real-number-drill
        type: flashcard
        prompt: Which two disjoint classes form the real numbers?
        answer:
          expected: Rational and irrational numbers.
        explanation: Every real is exactly one of those two types.
        tags: [real-number]
    - id: complex-number
      term: Complex Number
      definition: A number $a+bi$ with real $a,b$ and $i^2=-1$.
      notation: '$\mathbb C$'
      examples: ['$2+3i$ and $-5=-5+0i$ are complex.']
      aliases: []
      media: []
      tags: [complex-number]
      drills:
      - id: complex-number-drill
        type: flashcard
        prompt: When is $a+bi$ a real number?
        answer:
          expected: When b equals zero.
          aliases: ['$b=0$']
        explanation: A nonzero imaginary component makes the number nonreal.
        tags: [complex-number]
    - id: imaginary-unit
      term: Imaginary Unit
      definition: The complex number $i$ defined by $i^2=-1$.
      notation: '$i$'
      examples: ['$\sqrt{-9}=3i$ for the principal square root.']
      aliases: []
      media: []
      tags: [imaginary-unit]
      drills:
      - id: imaginary-unit-drill
        type: typed
        prompt: What is $i^2$?
        answer:
          expected: '-1'
        explanation: This defining relation extends the real number system.
        tags: [imaginary-unit]
  - id: representations-and-proof-tools
    title: Representations and Proof Tools
    required: true
    content: Exact representations and logical terms support conversion and classification proofs.
    entries:
    - id: lowest-terms
      term: Lowest Terms
      definition: A fraction $p/q$ whose numerator and denominator have greatest common divisor $1$.
      notation: '$\gcd(p,q)=1$'
      examples: ['$6/15$ reduces to $2/5$.']
      aliases: [reduced fraction]
      media: []
      tags: [lowest-terms]
      drills:
      - id: lowest-terms-drill
        type: flashcard
        prompt: What contradiction is sought after assuming an irrational square root equals $p/q$ in lowest terms?
        answer:
          expected: Show that p and q share a prime factor.
        explanation: That violates $\gcd(p,q)=1$.
        tags: [lowest-terms]
    - id: terminating-decimal
      term: Terminating Decimal
      definition: A decimal expansion with only finitely many nonzero decimal places.
      notation: null
      examples: ['$0.375=3/8$ terminates.']
      aliases: []
      media: []
      tags: [terminating-decimal]
      drills:
      - id: terminating-decimal-drill
        type: flashcard
        prompt: Which prime factors may appear in the reduced denominator of a terminating decimal?
        answer:
          expected: Only 2 and 5.
        explanation: Powers of ten factor as powers of 2 times powers of 5.
        tags: [terminating-decimal]
    - id: repeating-decimal
      term: Repeating Decimal
      definition: A decimal expansion in which a finite block repeats forever after some point.
      notation: '$0.\overline{27}$'
      examples: ['$1/3=0.\overline3$.']
      aliases: [recurring decimal]
      media: []
      tags: [repeating-decimal]
      drills:
      - id: repeating-decimal-drill
        type: flashcard
        prompt: Why does multiplying by a power of ten help convert a repeating decimal?
        answer:
          expected: It aligns identical repeating tails so subtraction removes them.
        explanation: The remaining equation has integer coefficients.
        tags: [repeating-decimal]
    - id: closure
      term: Closure
      definition: A set is closed under an operation when applying it to any permitted members always produces another member of the set.
      notation: null
      examples: ['$\mathbb Z$ is closed under addition but not division.']
      aliases: []
      media: []
      tags: [closure]
      drills:
      - id: closure-drill
        type: flashcard
        prompt: Are the integers closed under division?
        answer:
          expected: No; for example, 1 divided by 2 is not an integer.
        explanation: One valid counterexample disproves closure.
        tags: [closure]
    - id: counterexample
      term: Counterexample
      definition: A specific case satisfying a claim's hypotheses but violating its conclusion.
      notation: null
      examples: ['$\sqrt2+(-\sqrt2)=0$ disproves closure of irrationals under addition.']
      aliases: []
      media: []
      tags: [counterexample]
      drills:
      - id: counterexample-drill
        type: flashcard
        prompt: How many counterexamples are needed to disprove a universal statement?
        answer:
          expected: One valid counterexample.
        explanation: A universal claim says every case works.
        tags: [counterexample]
    - id: complex-conjugate
      term: Complex Conjugate
      definition: For $z=a+bi$, the number $\overline z=a-bi$ with the imaginary part's sign reversed.
      notation: '$\overline z$'
      examples: ['The conjugate of $2+3i$ is $2-3i$.']
      aliases: [conjugate]
      media: []
      tags: [complex-conjugate]
      drills:
      - id: complex-conjugate-drill
        type: typed
        prompt: What is $(a+bi)(a-bi)$?
        answer:
          expected: a squared plus b squared.
          aliases: ['$a^2+b^2$']
        explanation: The product is a difference of squares and $i^2=-1$.
        tags: [complex-conjugate]
