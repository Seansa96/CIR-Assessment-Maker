questions:
- id: q-coast-drag
  title: Evaluating Exponential Decay
  type: symbolicResponse
  prompt: 'A $4.0\\text{ kg}$ sled coasts on wet ice (assume negligible standard friction) through a strong headwind that exerts a drag force $F_d = -bv$, where $b = 2.0\\text{ kg/s}$. \nThe sled starts at $v_0 = 10\\text{ m/s}$. \nCalculate the velocity of the sled (in m/s) at exactly $t = 2.0\\text{ s}$. \n(Hint: $e^{-1} \\approx 0.368$)\n'
  answer:
    gradingMode: auto
    expectedLatex: 3.68
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    First, find the time constant $\tau = m/b = 4.0 / 2.0 = 2.0\text{ s}$.
    Use the derived formula $v(t) = v_0 e^{-bt/m} = v_0 e^{-t/\tau}$.
    $v(2.0) = 10 e^{-2.0/2.0} = 10 e^{-1} \approx 10(0.368) = 3.68\text{ m/s}$.
