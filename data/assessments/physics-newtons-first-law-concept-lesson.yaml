lesson:
  introduction: 'Newton''s First Law identifies the natural motion of an object when
    the net external

    force is zero. It also establishes the inertial reference frames in which Newtonian

    mechanics takes its simplest form.

    '
  sections:
  - id: natural-motion
    title: Force is not required to maintain motion
    required: true
    content: 'If the net external force on an object is zero, its velocity remains
      constant:


      $$

      \sum\vec{F}=\vec{0}\quad\Longrightarrow\quad\frac{d\vec{v}}{dt}=\vec{0}.

      $$


      Constant velocity includes rest as the special case $\vec{v}=\vec{0}$.

      '
    check:
      id: natural-motion-check
      type: multipleChoice
      prompt: Which motion is possible when the net external force is zero?
      choices:
      - id: a
        text: Rest or motion in a straight line at constant speed
      - id: b
        text: Only rest
      - id: c
        text: Speeding up in a straight line
      - id: d
        text: Turning at constant speed
      answer:
        choiceId: a
      explanation: 'Zero net force means zero acceleration, so the velocity vector
        remains constant.


        Related topic: equilibrium and constant velocity.

        '
  - id: inertia
    title: Inertia and mass
    required: true
    content: 'Inertia is resistance to a change in velocity. Mass quantifies translational

      inertia: a larger mass requires a larger net force to produce the same acceleration.

      Inertia is not a force and does not point in a direction.

      '
    check:
      id: inertia-check
      type: multipleChoice
      prompt: What does greater mass indicate in Newtonian mechanics?
      choices:
      - id: a
        text: Greater resistance to acceleration for a given net force
      - id: b
        text: A larger forward force of inertia
      - id: c
        text: A greater velocity in every situation
      - id: d
        text: Zero gravitational interaction
      answer:
        choiceId: a
      explanation: 'From $a=F_{\text{net}}/m$, increasing mass reduces acceleration
        for the same

        net force. There is no separate force of inertia on an ordinary free-body
        diagram.


        Related topic: inertial mass.

        '
  - id: vector-equilibrium
    title: Equilibrium is a vector condition
    required: true
    content: 'Equilibrium requires each component of net force to vanish:


      $$

      \sum F_x=0,\qquad \sum F_y=0,\qquad \sum F_z=0.

      $$


      Forces may be individually nonzero while their vector sum is zero.

      '
    media:
    - type: image
      src: /assessments/physics-dynamics/free-body-force-model.svg
      alt: Free-body diagram of a block with normal force, weight, applied force,
        and friction.
      caption: Equilibrium depends on the vector sum, not the absence of individual
        forces.
    check:
      id: vector-equilibrium-check
      type: selectAll
      prompt: Which situations can satisfy translational equilibrium?
      choices:
      - id: a
        text: An object at rest with balanced forces
      - id: b
        text: An object moving at constant velocity with balanced forces
      - id: c
        text: An object changing direction at constant speed
      - id: d
        text: An object with two equal and opposite collinear forces
      answer:
        choiceIds:
        - a
        - b
        - d
      explanation: 'Rest and constant velocity both have zero acceleration. Changing
        direction

        requires acceleration and therefore a nonzero net force.


        Related topic: static and dynamic equilibrium.

        '
  - id: inertial-frames
    title: Inertial reference frames
    required: true
    content: 'An inertial frame is one in which a force-free object moves with constant
      velocity.

      Frames moving at constant velocity relative to one another are all inertial
      in

      classical mechanics. An accelerating or rotating frame is non-inertial and may

      require apparent forces to describe motion from that frame.

      '
    check:
      id: inertial-frames-check
      type: multipleChoice
      prompt: Which observer is a\approximately in an inertial frame?
      choices:
      - id: a
        text: A train moving in a straight line at constant velocity
      - id: b
        text: A car accelerating away from a stoplight
      - id: c
        text: A rider on a rotating carousel
      - id: d
        text: An elevator beginning to move upward
      answer:
        choiceId: a
      explanation: 'Constant-velocity frames are inertial relative to one another.
        The other frames

        accelerate or rotate.


        Related topic: reference frames and apparent forces.

        '
  - id: force-identification
    title: Build a force model before balancing it
    required: true
    content: 'Draw forces caused by interactions: gravity, contact normal force, tension,

      friction, springs, and applied contact forces. Do not draw velocity, acceleration,

      or "motion force" as forces.


      Then choose axes and impose $\sum F_i=0$ for equilibrium.

      '
    check:
      id: force-identification-check
      type: selectAll
      prompt: Which entries belong on a free-body diagram for a book resting on a
        table?
      choices:
      - id: a
        text: Weight from Earth
      - id: b
        text: Normal force from the table
      - id: c
        text: A force of rest
      - id: d
        text: The book's zero velocity
      answer:
        choiceIds:
        - a
        - b
      explanation: 'Only interactions produce forces. Zero velocity describes the
        state of motion;

        it is not an interaction.


        Related topic: free-body diagrams.

        '
  - id: first-law-limit
    title: The First Law does not say forces are absent
    required: true
    content: 'Newton''s First Law requires zero **net** force, not zero individual
      forces.

      A hanging sign can have upward tensions and downward weight while remaining
      at rest.

      The useful procedure is always:


      1. isolate one object,

      2. list external interactions,

      3. resolve components,

      4. set each net component to zero.

      '
    check:
      id: first-law-limit-check
      type: multipleChoice
      prompt: A crate moves right at constant velocity while being pushed. What must
        be true?
      choices:
      - id: a
        text: Other forces balance the push so the net force is zero.
      - id: b
        text: The push is the only\rhorizontal force.
      - id: c
        text: Motion proves the net force points right.
      - id: d
        text: The crate has no inertia.
      answer:
        choiceId: a
      explanation: 'Constant velocity implies zero acceleration and therefore zero
        net force.


        Related topic: interpreting motion before writing force equations.

        '
  - id: first-law-synthesis
    title: Synthesize the equilibrium model
    required: true
    content: 'Newton''s First Law is a diagnostic statement: observe constant velocity,
      infer

      $\vec{a}=0$, then require $\sum\vec{F}=0$. It does not identify the forces for
      you;

      those come from the object''s interactions.

      '
    check:
      id: first-law-synthesis-check
      type: multipleChoice
      prompt: Which reasoning chain is correct for an object moving at constant velocity?
      choices:
      - id: a
        text: $\vec{v}$ constant $\Rightarrow \vec{a}=0 \Rightarrow \sum\vec{F}=0$
      - id: b
        text: $\vec{v}$ constant $\Rightarrow \vec{a}=\vec{v} \Rightarrow \sum\vec{F}=m\vec{v}$
      - id: c
        text: $\vec{v}$ constant $\Rightarrow$ no forces act
      - id: d
        text: $\vec{v}$ constant $\Rightarrow$ the net force points with the motion
      answer:
        choiceId: a
      explanation: 'Constant velocity has zero time derivative. Newton''s laws then
        require zero net

        external force.


        Related topic: connecting kinematics to dynamics.

        '
