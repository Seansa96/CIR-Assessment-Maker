questions:
- id: q001
  type: multipleChoice
  prompt: 'A runner moves from $x=2\ \text{m}$ to $x=11\ \text{m}$. What is the displacement?

    '
  choices:
  - id: a
    text: $9\ \text{m}$
  - id: b
    text: $13\ \text{m}$
  - id: c
    text: $-9\ \text{m}$
  - id: d
    text: $22\ \text{m}$
  answer:
    choiceId: a
  explanation: 'Displacement is final position minus initial position: $\Delta x=x_f-x_i=11-2=9\
    \text{m}$. Related topic: displacement versus position.

    '
- id: q002
  type: multipleChoice
  prompt: 'A person walks $5\ \text{m}$ east and then $3\ \text{m}$ west. What is
    the total distance traveled?

    '
  choices:
  - id: a
    text: $8\ \text{m}$
  - id: b
    text: $2\ \text{m}$ east
  - id: c
    text: $2\ \text{m}$ west
  - id: d
    text: $15\ \text{m}$
  answer:
    choiceId: a
  explanation: 'Total distance adds path length regardless of direction: $5+3=8\ \text{m}$.
    Related topic: distance versus displacement.

    '
- id: q003
  type: multipleChoice
  prompt: 'A person walks $5\ \text{m}$ east and then $3\ \text{m}$ west. What is
    the displacement?

    '
  choices:
  - id: a
    text: $2\ \text{m}$ east
  - id: b
    text: $8\ \text{m}$ east
  - id: c
    text: $8\ \text{m}$ west
  - id: d
    text: $0\ \text{m}$
  answer:
    choiceId: a
  explanation: 'Displacement keeps direction: $+5-3=+2\ \text{m}$, so the displacement
    is $2\ \text{m}$ east. Related topic: signed one-dimensional motion.

    '
- id: q004
  type: multipleChoice
  prompt: 'A car travels $120\ \text{m}$ in $6.0\ \text{s}$. What is its average speed?

    '
  choices:
  - id: a
    text: $20\ \text{m/s}$
  - id: b
    text: $720\ \text{m/s}$
  - id: c
    text: $0.050\ \text{m/s}$
  - id: d
    text: $126\ \text{m/s}$
  answer:
    choiceId: a
  explanation: 'Average speed is total distance divided by elapsed time: $120/6.0=20\
    \text{m/s}$. Related topic: average speed.

    '
- id: q005
  type: multipleChoice
  prompt: 'A particle moves from $x=-4\ \text{m}$ to $x=8\ \text{m}$ in $3.0\ \text{s}$.
    What is its average velocity?

    '
  choices:
  - id: a
    text: $4.0\ \text{m/s}$
  - id: b
    text: $12\ \text{m/s}$
  - id: c
    text: $-4.0\ \text{m/s}$
  - id: d
    text: $36\ \text{m/s}$
  answer:
    choiceId: a
  explanation: 'Average velocity is displacement divided by elapsed time: $\frac{8-(-4)}{3.0}=4.0\
    \text{m/s}$. Related topic: average velocity.

    '
- id: q006
  type: multipleChoice
  prompt: 'If $x(t)=t^2+3t$, what is the instantaneous velocity at $t=2$?

    '
  choices:
  - id: a
    text: $7\ \text{m/s}$
  - id: b
    text: $10\ \text{m/s}$
  - id: c
    text: $4\ \text{m/s}$
  - id: d
    text: $2\ \text{m/s}$
  answer:
    choiceId: a
  explanation: 'Instantaneous velocity is the derivative of position: $v(t)=x''(t)=2t+3$.
    At $t=2$, $v=7\ \text{m/s}$. Related topic: velocity as derivative of position.

    '
- id: q007
  type: multipleChoice
  prompt: 'If $v(t)=4t-1$, what is the instantaneous acceleration?

    '
  choices:
  - id: a
    text: $4\ \text{m/s}^2$
  - id: b
    text: $4t-1\ \text{m/s}^2$
  - id: c
    text: $-1\ \text{m/s}^2$
  - id: d
    text: $0\ \text{m/s}^2$
  answer:
    choiceId: a
  explanation: 'Acceleration is the derivative of velocity: $a(t)=v''(t)=4$. Related
    topic: acceleration as derivative of velocity.

    '
- id: q008
  type: multipleChoice
  prompt: 'If $v(t)$ is negative for an interval, what does that mean in one-dimensional
    motion?

    '
  choices:
  - id: a
    text: The object is moving in the negative direction.
  - id: b
    text: The object must be slowing down.
  - id: c
    text: The object has zero speed.
  - id: d
    text: The object cannot have displacement.
  answer:
    choiceId: a
  explanation: 'The sign of velocity gives direction. Speed is $|v|$, so negative
    velocity does not mean negative speed. Related topic: speed versus velocity.

    '
- id: q009
  type: multipleChoice
  prompt: 'If $v(t)=3$ from $t=0$ to $t=4$, what distance is traveled?

    '
  choices:
  - id: a
    text: $12\ \text{m}$
  - id: b
    text: $7\ \text{m}$
  - id: c
    text: $1.33\ \text{m}$
  - id: d
    text: $0\ \text{m}$
  answer:
    choiceId: a
  explanation: 'Distance from a nonnegative velocity graph is area under $v(t)$: $3(4)=12\
    \text{m}$. Related topic: distance as accumulated speed.

    '
- id: q010
  type: multipleChoice
  prompt: 'If $v(t)$ changes from positive to negative, what must happen at the turning
    point if $v(t)$ is continuous?

    '
  choices:
  - id: a
    text: $v=0$
  - id: b
    text: $a=0$
  - id: c
    text: $x=0$
  - id: d
    text: Distance traveled becomes zero
  answer:
    choiceId: a
  explanation: 'A continuous velocity changing sign must pass through zero. That is
    where the object momentarily stops before reversing direction. Related topic:
    turning points in one-dimensional motion.

    '
