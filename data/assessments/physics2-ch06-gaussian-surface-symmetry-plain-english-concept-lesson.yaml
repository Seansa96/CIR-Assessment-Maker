        media: []
        issueSignals:
        - id: physics2-flux-invented-angle
          domains:
          - physics-2
      - id: c
        text: $\theta=90^\circ$ and $\Phi_E=0$
        media: []
        issueSignals: []
      - id: d
        text: $\theta=180^\circ$ and $\Phi_E=-EA$
        media: []
        issueSignals:
        - id: physics2-flux-antiparallel-normal-error
          domains:
          - physics-2
      answer:
        choiceId: c
        choiceIds: []
        expected: 
