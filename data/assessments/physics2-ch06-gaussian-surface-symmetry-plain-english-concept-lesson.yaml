  - id: gauss-plain-english-s8
    title: A plain-English translation routine for any Gaussian-surface figure
    required: true
    content: >
      When a new diagram appears, read it in this order:


      1. **Find the boundary.** Is the requested surface open or closed? Gauss's law requires a closed surface.

      2. **Draw or identify the normals.** Closed-surface normals point outward.

      3. **Compare $\mathbf E$ with $d\mathbf A$.** Decide whether each region gives positive, negative, or zero flux.

      4. **Test symmetry before simplifying.** Ask whether $E$ is constant over a region and whether the angle is fixed.

      5. **Add the surface contributions.** Use a sum or integral unless symmetry supports a shortcut such as $EA$.

      6. **Inventory enclosed charge.** Add only signed charge inside the boundary.


      **Plain-English translation of the whole law:** “Signed field through the complete boundary equals net charge inside divided by $\epsilon_0$.”
    media: []
    check:
      id: gauss-plain-english-s8-check
      type: multipleChoice
      prompt: Which is the most reliable first move when translating a new Gaussian-surface diagram into mathematics?
      choices:
      - id: a
        text: Immediately write $\Phi_E=EA$ for the entire surface
        media: []
        issueSignals:
        - id: physics2-gauss-premature-flux-factoring
          domains:
          - physics-2
      - id: b
        text: Identify the closed boundary and its outward area-vector directions
        media: []
        issueSignals: []
      - id: c
        text: Add every charge shown, whether inside or outside
        media: []
        issueSignals:
        - id: physics2-gauss-boundary-inventory-error
          domains:
          - physics-2
      - id: d
        text: Choose the largest familiar area formula before examining the field
        media: []
        issueSignals:
        - id: physics2-gauss-area-before-symmetry
          domains:
          - physics-2
      answer:
