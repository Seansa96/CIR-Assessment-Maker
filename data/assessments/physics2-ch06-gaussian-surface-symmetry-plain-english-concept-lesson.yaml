      caption: Figure 2. Keep the field and area fixed; rotate only the surface normal and follow the cosine.
    check:
      id: gauss-plain-english-s2-check
      type: multipleChoice
      prompt: The electric field is parallel to the plane of a flat surface. What are the angle and flux relative to that surface's normal?
