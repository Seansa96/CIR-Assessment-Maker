  - id: gauss-plain-english-s2
    title: 'Figure 2: Rotation changes flux from maximum to zero'
    required: true
    content: >
      **Definition - signed flux:** Electric flux is positive when $\mathbf E$ points generally with the chosen normal, negative when it points generally against the normal, and zero when the field is perpendicular to the normal.


      **What the visual shows:** The same field magnitude $E$ and area $A$ appear in three orientations. Only the direction of the area vector changes.


      **Equations represented by the visual:**


      $$

      \begin{aligned}

      \theta=0^\circ &: \quad \Phi_E=EA &&\text{(maximum positive flux)},\\

      0^\circ<\theta<90^\circ &: \quad \Phi_E=EA\cos\theta &&\text{(intermediate positive flux)},\\

      \theta=90^\circ &: \quad \Phi_E=0 &&\text{(zero flux)}.

      \end{aligned}

      $$


      **Plain-English translation:** A surface catches the most field when its normal points along the field. As the surface turns so the field increasingly slides along it, the through-surface part decreases. When the field lies in the surface, none of it passes through, so the flux is zero.


      A common wording trap is “the surface is perpendicular to the field.” That describes maximum flux because its normal is parallel to the field. “The surface is parallel to the field” describes zero flux because its normal is perpendicular to the field.
