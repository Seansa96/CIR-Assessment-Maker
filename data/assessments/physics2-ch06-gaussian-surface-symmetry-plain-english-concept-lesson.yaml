  - id: gauss-plain-english-s6
    title: Why radius cancels in flux but not in the electric field
    required: true
    content: >
      In the point-charge example, two different quantities depend on radius:


      $$

      E(r)=\frac{kq}{r^2}

      \quad\text{and}\quad

      A(r)=4\pi r^2.

      $$


      The local field magnitude decreases with radius. The total flux multiplies that weaker field by a larger spherical area:


      $$

      \Phi_E=E(r)A(r)=\frac{kq}{r^2}(4\pi r^2)=4\pi kq.

      $$


      **Plain-English translation:** Farther away, each square meter receives less field, but there are proportionally more square meters available. Constant total flux does not mean constant electric field.
