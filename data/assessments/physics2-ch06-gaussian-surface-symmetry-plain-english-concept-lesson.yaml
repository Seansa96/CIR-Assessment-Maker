  - id: gauss-plain-english-s5
    title: The law is always true; the shortcut is not always useful
    required: true
    content: >
      Gauss's law,


      $$

      \oint_S\mathbf E\cdot d\mathbf A=\frac{Q_{\mathrm{enc}}}{\epsilon_0},

      $$


      is valid for every closed surface and every electric-field pattern. Symmetry is not required for the law to be true.


      Symmetry is required when you want the law to reveal a local field magnitude without doing a difficult integral. A useful Gaussian surface makes each contributing region satisfy one of these conditions:


      1. $E$ is constant and $\mathbf E$ is parallel or antiparallel to $d\mathbf A$;

      2. $\mathbf E$ is tangent to the surface, so the contribution is zero; or

      3. separate regions have simple, known contributions.


      **Plain-English translation:** Gauss's law always tells you the total flux. It tells you the value of $E$ easily only when the geometry prevents $E$ and the angle from changing in complicated ways across the surface.
