        media: []
        issueSignals: []
      - id: c
        text: The angle between two neighboring electric-field lines
        media: []
        issueSignals:
        - id: physics2-flux-field-line-spacing-angle
          domains:
          - physics-2
      - id: d
        text: The angle between $\mathbf A$ and the edge of the page
        media: []
        issueSignals:
        - id: physics2-flux-page-orientation-error
          domains:
          - physics-2
      answer:
