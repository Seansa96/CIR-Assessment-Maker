      explanation: >
        Solution: Spherical symmetry gives the same $E(r)$ at every point, and the radial field aligns with each outward normal, so the dot product contributes $E(r)dA$ everywhere.


        Why it works: These are the two separate conditions needed to simplify the integral: constant magnitude and a known constant angle.


        Why the other choices fail: B makes a nonzero point-charge field vanish and reverses outward normals; C reverses both scaling laws; D mistakes a closed surface for proof of uniform field magnitude.
