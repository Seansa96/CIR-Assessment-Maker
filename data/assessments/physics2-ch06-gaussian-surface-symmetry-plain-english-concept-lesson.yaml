lesson:
  introduction: >
    Gauss's law can look like a compact equation hiding a great deal of geometry. This lesson unpacks that geometry one picture at a time. You will learn what each arrow, surface, angle, and area element means; translate each figure into plain English; and then connect that translation to the mathematics.


    The central statement is


    $$

    \oint_S \mathbf E\cdot d\mathbf A=\frac{Q_{\mathrm{enc}}}{\epsilon_0}.

    $$


    In plain English: add the signed electric-field flow through every tiny patch of a closed surface. The total depends only on the net charge enclosed by that surface. Gauss's law is always true for a closed surface, but it becomes an easy way to calculate $E$ only when symmetry makes the left-hand side simple.
  sections:
  - id: gauss-plain-english-s1
    title: 'Figure 1: The area vector tells the surface which way is positive'
    required: true
    content: >
      **Definition - area vector:** A flat surface with area $A$ is represented by a vector $\mathbf A$. Its magnitude is the ordinary area, $|\mathbf A|=A$, and its direction is perpendicular to the surface. For an open surface, either normal may be chosen as positive. For a closed surface, the area vector must point outward.


      **What the visual shows:** Blue arrows represent a uniform electric field $\mathbf E$ crossing a tilted yellow surface. The red vector $\mathbf A$ is not drawn along the surface; it sticks straight out of it. The angle $\theta$ is measured between $\mathbf E$ and $\mathbf A$.


      **Equation represented by the visual:**


      $$

      \Phi_E=\mathbf E\cdot\mathbf A=EA\cos\theta.

      $$


      **Plain-English translation:** Flux counts the part of the field that goes through the surface, not the part that slides along it. The cosine keeps the component of $\mathbf E$ parallel to the surface normal. Reversing the chosen normal reverses the sign of the flux without changing the physical field.
