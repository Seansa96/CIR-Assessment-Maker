    - type: image
      src: /media/physics2/gauss-area-vector.svg
      alt: A uniform electric field crosses a tilted flat surface whose red area vector is perpendicular to the surface and makes angle theta with the field.
      caption: Figure 1. The flux angle is measured from the field to the area vector, which is normal to the surface.
    check:
      id: gauss-plain-english-s1-check
      type: multipleChoice
      prompt: In $\Phi_E=EA\cos\theta$, which angle is $\theta$?
      choices:
