      src: /media/physics2/gauss-curved-patches.svg
      alt: A curved surface is divided into patches with differently directed local area vectors while a horizontal electric field crosses the surface.
      caption: Figure 3. Every patch has its own area vector and potentially its own field magnitude and angle.
    check:
      id: gauss-plain-english-s3-check
      type: multipleChoice
      prompt: Why is $\Phi_E=EA\cos\theta$ usually insufficient for an arbitrary curved surface in a nonuniform field?
