      - id: c
        text: The local field, area-vector direction, or both can vary from patch to patch
        media: []
        issueSignals: []
      - id: d
        text: The cosine must always be replaced by a sine on curved surfaces
        media: []
        issueSignals:
        - id: physics2-flux-sine-substitution-error
          domains:
          - physics-2
