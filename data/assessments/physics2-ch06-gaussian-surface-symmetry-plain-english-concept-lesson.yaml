  - id: gauss-plain-english-s4
    title: 'Figure 4: A centered point charge makes a sphere perfectly symmetric'
    required: true
    content: >
      **Definition - Gaussian surface:** A Gaussian surface is an imaginary closed surface chosen to organize a flux calculation. It is not a physical shell unless the problem explicitly says one exists. Its area vectors point outward.


      **What the visual shows:** A positive point charge $q$ sits at the center of a spherical Gaussian surface of radius $r$. The electric field is radial. Every point on the sphere is the same distance from the charge, so $E(r)$ has the same magnitude everywhere. Each outward $d\mathbf A$ is also radial, so $\mathbf E\parallel d\mathbf A$ and $\theta=0^\circ$ everywhere.


      **Equations represented by the visual:**


      $$

      E(r)=\frac{kq}{r^2},\qquad A_{\mathrm{sphere}}=4\pi r^2,

      $$


      and therefore


      $$

      \begin{aligned}

      \Phi_E

      &=\oint_S\mathbf E\cdot d\mathbf A\\

      &=E(r)\oint_S dA\\

      &=\left(\frac{kq}{r^2}\right)(4\pi r^2)\\

      &=4\pi kq\\

      &=\frac{q}{\epsilon_0},

      \end{aligned}

      $$


      because $k=1/(4\pi\epsilon_0)$.


      **Plain-English translation:** As the sphere gets larger, the field at each point gets weaker as $1/r^2$, but the sphere provides more area as $r^2$. Those effects exactly balance, so every centered sphere encloses the same total outward flux.
    media:
    - type: image
      src: /media/physics2/gauss-point-charge-sphere.svg
      alt: A positive point charge is centered inside a spherical Gaussian surface; radial field arrows align with outward area vectors everywhere on the sphere.
      caption: 'Figure 4. Centering matters: it makes both the field magnitude and the field-normal angle constant over the sphere.'
    check:
