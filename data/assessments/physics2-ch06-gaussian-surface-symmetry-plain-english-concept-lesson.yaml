  - id: gauss-plain-english-s7
    title: The right-hand side counts only signed enclosed charge
    required: true
    content: >
      $Q_{\mathrm{enc}}$ is the algebraic sum of all charge inside the Gaussian surface. Include positive and negative signs. Do not include an outside charge, even though it can change $\mathbf E$ at individual points on the surface.


      An external charge sends some field lines into a closed surface and others back out. Its entering and leaving flux contributions cancel in the total. An internal positive charge produces net outward flux; an internal negative charge produces net inward, negative flux.


      **Plain-English translation:** The field on the boundary can notice every charge, but the net closed-surface flux keeps a ledger only of the charge trapped inside.
