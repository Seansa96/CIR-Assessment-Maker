  - id: gauss-plain-english-s3
    title: 'Figure 3: Curved surfaces are handled one tiny patch at a time'
    required: true
    content: >
      **Definition - area element:** On a curved surface, $d\mathbf A$ is an infinitesimal vector normal to one tiny patch. Its direction changes from patch to patch, and the field magnitude may also change.


      **What the visual shows:** A curved green surface is crossed by horizontal field arrows. Several red local area vectors point in different directions because each is perpendicular to its own patch. There is no single angle that represents the entire surface.


      **Equations represented by the visual:** For small patches,


      $$

      \Delta\Phi_i\approx\mathbf E_i\cdot\Delta\mathbf A_i

      =E_i\Delta A_i\cos\theta_i,

      $$


      so the total is


      $$

      \Phi_E\approx\sum_{i=1}^{n}E_i\Delta A_i\cos\theta_i.

      $$


      In the limit of infinitely small patches,


      $$

      \Phi_E=\int_S\mathbf E\cdot d\mathbf A.

      $$


      **Plain-English translation:** Zoom in until each curved patch looks flat. Find the signed through-patch field for each piece, multiply by that tiny area, and add all the pieces. The integral is precise bookkeeping for that limiting sum.
