schemaVersion: 1
id: ede-ch04-growth-input-inference-depth-concept-lesson
title: Growth, Decay, Input, and Parameter Inference
assessmentType: conceptLesson
categoryId: elementary-differential-equations-bvp
topicId: ede-ch04-first-order-applications
modeDefault: practice
randomizeQuestions: false
skills:
- ede-ch04-first-order-applications
navigation:
  learningGoal: learn
  activityType: conceptLesson
  tags:
  - elementary-differential-equations-bvp
