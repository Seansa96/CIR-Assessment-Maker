  - supplemental
lesson:
  introduction: Rate constants become meaningful only after measurements, units, and model assumptions are connected.
  sections:
  - id: s1
    title: Infer an exponential parameter
    required: true
    content: For $Q'=kQ$, two measurements give $Q(t_2)/Q(t_1)=e^{k(t_2-t_1)}$. Ratios remove the unknown scale
      and determine $k$ with inverse-time units.
    media:
    - type: image
      src: /media/ede/ch04-parameter-inference.svg
      alt: Measurements determining an exponential rate and a production-removal equilibrium.
      caption: Use the relationships in the diagram to organize the calculation and verification.
    check:
      id: q001
      type: numericResponse
      prompt: A quantity grows from 20 to 30 in 5 hours. Find $k$ in $Q'=kQ$.
      skills:
      - ede-ch04-first-order-applications-parameter-inference
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-parameter-inference
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $k=\ln(30/20)/5\approx0.081093$ h$^{-1}$.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 0.081093
        tolerance: 0.0001
  - id: s2
    title: Doubling time and half-life
    required: true
    content: If $k>0$, doubling time is $\ln2/k$. If $k<0$, half-life is $\ln2/|k|$. The sign belongs to the differential
      equation, not to the time interval.
    media: []
    check:
      id: q002
      type: numericResponse
      prompt: A decay constant is $k=-0.035$ day$^{-1}$. Find the half-life in days.
      skills:
      - ede-ch04-first-order-applications-parameter-inference
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-parameter-inference
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $t_{1/2}=\ln2/0.035\approx19.8042$ days.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 19.8042
        tolerance: 0.001
  - id: s3
    title: Reverse-time questions
    required: true
    content: 'An exponential model is algebraically reversible: $Q(0)=Q(T)e^{-kT}$. Interpreting a past value still
      requires the same constant-rate assumptions to have held throughout the interval.'
    media: []
    check:
      id: q003
      type: numericResponse
      prompt: An account grows continuously at $4\%$ per year and is worth $5000$ after 6 years. Find its present
        value.
      skills:
      - ede-ch04-first-order-applications-parameter-inference
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-parameter-inference
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $5000e^{-0.04(6)}\approx3933.14$.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 3933.14
        tolerance: 0.01
  - id: s4
    title: Production with proportional removal
    required: true
    content: For $Q'=a-kQ$ with $a,k>0$, the equilibrium is $Q_*=a/k$ and $Q=Q_*+(Q_0-Q_*)e^{-kt}$. The transient
      sign shows whether the state rises or falls toward the limit.
    media: []
    check:
      id: q004
      type: numericResponse
      prompt: For $Q'=12-0.3Q$, find the equilibrium value.
      skills:
      - ede-ch04-first-order-applications-growth-decay
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-growth-decay
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: $Q_*=12/0.3=40$.

        Why it works: Direct substitution verifies the numerical result and its units or sign.
      answer:
        value: 40
        tolerance: 0.0001
  - id: s5
    title: Continuous deposits
    required: true
    content: A continuously deposited amount obeys $A'=rA+d$. Its solution separates growth of the initial principal
      from accumulated deposits. The model differs from periodic deposits made at discrete times.
    media: []
    check:
      id: q005
      type: symbolicResponse
      prompt: Solve $A'=0.05A+1000$, $A(0)=0$.
      skills:
      - ede-ch04-first-order-applications-growth-decay
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - calculation
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-growth-decay
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: The equilibrium-form solution gives $A=20000(e^{0.05t}-1)$.

        Why it works: Differentiation and the supplied data verify the expression.
      answer:
        expectedLatex: 20000(e^{0.05t}-1)
        equivalenceMode: expression
        variables:
        - t
        tolerance: 0.0001
  - id: s6
    title: Assumptions and observations
    required: true
    content: A fitted exponential does not by itself validate constant environment, unlimited resources, continuous
      compounding, or unchanged production. Residuals and mechanism checks decide whether extrapolation is defensible.
    media: []
    check:
      id: q006
      type: multipleChoice
      prompt: Which observation most directly challenges constant proportional growth?
      skills:
      - ede-ch04-first-order-applications-growth-decay
      media: []
      difficultyDimensions:
      - modelOrDerivation
      - errorDiagnosis
      subjectDifficultyTags:
      - ede-ch04-first-order-applications-growth-decay
      difficultyEvidence: Requires choosing the governing relation and checking the result against the stated conditions.
      explanation: |-
        Solution: A rate that changes with state contradicts a constant proportional-rate parameter.

        Why it works: The stated structure and conditions determine the result.

        Why the other choices fail: The other choices misuse a rule, omit a condition, or reverse the relevant relationship.
      choices:
      - id: a
        text: The estimated rate falls systematically as the state grows
      - id: b
        text: The state remains positive
        issueSignals:
        - id: ede-model-parameter-inference-error
          domains:
          - elementary-differential-equations-bvp
      - id: c
        text: Time is measured in days
        issueSignals:
        - id: ede-model-parameter-inference-error
          domains:
          - elementary-differential-equations-bvp
      - id: d
        text: Two measurements agree exactly
        issueSignals:
        - id: ede-model-parameter-inference-error
          domains:
          - elementary-differential-equations-bvp
      answer:
        choiceId: a
