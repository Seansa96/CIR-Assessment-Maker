id: calc2-area-between-curves-recall-s2c
title: Area Between Curves Recall Drill
assessmentType: recallDrill
categoryId: calculus-2
topicId: area-between-curves
modeDefault: practice
randomizeQuestions: true
navigation: { learningGoal: recall, activityType: mixedRecallSet, tags: [calculus-2, area-between-curves, recall] }
authoring: { visualRequirement: required, visualRationale: One item tests visual recognition of a vertical slice and its formula. }
items:
  - { id: q001, type: cloze, prompt: 'Vertical slices use ____ minus ____ and $dx$.', answer: { expected: 'top; bottom', aliases: ['top,bottom', 'upper; lower'] }, explanation: 'Solution: The order is top minus bottom. Why it works: A vertical slice measures y-distance. Common trap: Reversing it gives a negative contribution.' }
  - { id: q002, type: cloze, prompt: 'Horizontal slices use ____ minus ____ and $dy$.', answer: { expected: 'right; left', aliases: ['right,left'] }, explanation: 'Solution: The order is right minus left. Why it works: A horizontal slice measures x-distance. Common trap: $dy$ is thickness, not length.' }
  - { id: q003, type: typed, prompt: 'What equation is normally solved to find x-bounds where $y=f(x)$ and $y=g(x)$ meet?', answer: { expected: 'f(x)=g(x)', aliases: ['f equals g', 'f(x) = g(x)'] }, explanation: 'Solution: Solve $f(x)=g(x)$. Why it works: Intersections have equal y-values. Common trap: Solving derivatives equal finds tangent information, not generally region bounds.' }
  - { id: q004, type: typed, prompt: 'What action is required when the upper boundary changes at an interior point?', answer: { expected: 'split or partition the integral', aliases: ['split the integral', 'partition'] }, explanation: 'Solution: Split or partition the integral. Why it works: Each subinterval needs one boundary-order formula. Common trap: Do not average or blend boundary expressions.' }
  - id: q005
    type: recognition
    prompt: 'Name the expression form that matches the pictured vertical slice.'
    media: [{ type: image, src: /media/calculus/area-between-curves-model.svg, alt: Vertical slice between an upper curve and lower curve with dx label }]
    choices: [{ id: a, text: '$[top-bottom]dx$' }, { id: b, text: '$[right-left]dy$' }]
    answer: { choiceId: a, expected: 'top minus bottom dx', aliases: ['top-bottom dx', 'upper minus lower dx'] }
    explanation: 'Solution: The picture is a vertical rectangle, so its area is top minus bottom times $dx$. Why it works: It measures a y-height and x-thickness. Common trap: Right minus left describes a horizontal slice.'
