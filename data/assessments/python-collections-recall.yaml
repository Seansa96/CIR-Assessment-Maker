schemaVersion: 1
id: python-collections-recall
title: Python Collections Recall
assessmentType: recallDrill
categoryId: python
topicId: python-collections
skills:
- Apply Collections and Data Structures in Python
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - python
  - python-collections
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: Which collection type is ordered, mutable, and created with `[]`?
  answer:
    expected: list
- id: r002
  type: typed
  prompt: Which collection type uses key-value pairs and is created with `{}`?
  answer:
    expected: dict
    aliases:
    - dictionary
- id: r003
  type: typed
  prompt: Which collection type is ordered, immutable (unchangeable), and created
    with `()`?
  answer:
    expected: tuple
- id: r004
  type: typed
  prompt: Which collection type is unordered, guarantees unique elements, and is created
    with `{}` (but no colons)?
  answer:
    expected: set
- id: r005
  type: typed
  prompt: What list method adds a single item to the end of the list?
  answer:
    expected: append
- id: r006
  type: typed
  prompt: What keyword checks if a key exists in a dictionary, or an item exists in
    a list (e.g., `if item ___ inventory:`)?
  answer:
    expected: in
- id: r007
  type: typed
  prompt: What dictionary method returns a view of all the key-value pairs as tuples?
  answer:
    expected: items
    aliases:
    - items()
- id: r008
  type: typed
  prompt: What dictionary method returns a list of all the keys?
  answer:
    expected: keys
    aliases:
    - keys()
