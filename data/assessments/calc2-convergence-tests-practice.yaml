- id: img-convtest-014-v3
  concept: Integral Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{1}{n \ln n (\ln(\ln n))^2}$.
  explanation: |
    The integral-test antiderivative is $-1/\ln(\ln x)$, which tends to 0. The series converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |
      The integral-test antiderivative is $-1/\ln(\ln x)$, which tends to 0. The series converges.
