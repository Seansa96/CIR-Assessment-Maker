- id: img-convtest-011-v1
  concept: Root Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \left(\frac{4n}{3n+2}\right)^n$.
  explanation: |-
    Root test: $4/3 > 1$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Root test: $4/3 > 1$. Diverges.
- id: img-convtest-036-v3
  concept: Alternating Series Test
  source: Tests For Convergence/pset_7.png
  prompt: |-
    Test $\sum \frac{n^2}{n^3+1}$.
  explanation: |-
    LCT with $1/n$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      LCT with $1/n$. Diverges.
- id: img-convtest-025-v2
  concept: Direct Comparison Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{1}{n^{2/3}+1}$.
  explanation: |-
    LCT with $1/n^{2/3}$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
