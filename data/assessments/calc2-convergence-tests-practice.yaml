- id: img-convtest-009-v1
  concept: Alternating Series Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n n^2}{n^3+5}$.
  explanation: |-
    Solution: AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges. Therefore the answer is AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.. Therefore the answer is AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.. Therefore the answer is AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.. Therefore the answer is AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.. Therefore the answer is AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges..

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.
