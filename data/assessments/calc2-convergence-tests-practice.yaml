- id: img-convtest-011
  concept: Root Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \left(\frac{3n}{4n+5}\right)^n$.
  explanation: |-
    Solution: Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges. Therefore the answer is Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.. Therefore the answer is Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.. Therefore the answer is Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.. Therefore the answer is Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.. Therefore the answer is Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges..

    Why it works: Form $L=\limsup_{n\to\infty}\sqrt[n]{|a_n|}$. The Root Test gives absolute convergence for $L<1$, divergence for $L>1$, and is inconclusive at $L=1$.

    Common trap: The root test is especially useful when a whole expression is raised to the $n$th power; do not omit the absolute value.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.
