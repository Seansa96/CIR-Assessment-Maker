- id: img-convtest-021
  concept: Absolute Convergence
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{(-1)^n \arctan n}{n^2}$.
  explanation: |-
    Solution: $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges. Therefore the answer is $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.. Therefore the answer is $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.. Therefore the answer is $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.. Therefore the answer is $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.. Therefore the answer is $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges..

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.
