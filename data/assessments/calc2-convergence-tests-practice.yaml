questions:
- id: img-convtest-021
  concept: Absolute Convergence
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{(-1)^n \arctan n}{n^2}$.
  explanation: |-
    $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $|\arctan n| < \pi/2$, so $|a_n| < \pi/(2n^2)$. Absolutely converges.
- id: img-convtest-021-v1
  concept: Absolute Convergence
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{(-1)^n \arctan(n^2)}{n^3}$.
  explanation: |-
    $|a_n| < \pi/(2n^3)$. Absolutely converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $|a_n| < \pi/(2n^3)$. Absolutely converges.
- id: img-convtest-027-v1
  concept: Telescoping Series
  source: Tests For Convergence/pset_6.png
  prompt: |-
    Test $\sum \frac{1}{1^2+2^2+\cdots+n^2}$.
  explanation: |-
    $1^2+\dots+n^2 = n(n+1)(2n+1)/6$. $\sum 6/n^3$: converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $1^2+\dots+n^2 = n(n+1)(2n+1)/6$. $\sum 6/n^3$: converges.
- id: img-convtest-015-v1
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{3^n}{5^n - 4^n}$.
  explanation: |-
    LCT with $(3/5)^n$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      LCT with $(3/5)^n$. Converges.
- id: img-convtest-009-v1
  concept: Alternating Series Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n n^2}{n^3+5}$.
  explanation: |-
    AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      AST: converges. Absolute: $\sim 1/n$, diverges. Conditionally converges.
- id: img-convtest-015-v2
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_4.png
  prompt: |-
    Test $\sum \frac{5^n}{4^n + 3^n}$.
  explanation: |-
    LCT with $(5/4)^n$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      LCT with $(5/4)^n$. Diverges.
- id: img-convtest-012-v1
  concept: Absolute Convergence
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{\sin n}{n^3}$.
  explanation: |-
    $|\sin n| \le 1$. Absolute convergence via comparison with $1/n^3$. Absolutely converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      $|\sin n| \le 1$. Absolute convergence via comparison with $1/n^3$. Absolutely converges.
- id: img-convtest-011
  concept: Root Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \left(\frac{3n}{4n+5}\right)^n$.
  explanation: |-
    Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Root test: $\lim (a_n)^{1/n} = \lim \frac{3n}{4n+5} = 3/4 < 1$. Converges.
- id: img-convtest-010-v3
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_3.png
  prompt: |-
    Test $\sum \frac{(-1)^n (n^2+1)}{n^4+2}$.
  explanation: |-
    Absolute convergence via LCT with $1/n^2$. Absolutely converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      Absolute convergence via LCT with $1/n^2$. Absolutely converges.
- id: img-convtest-020
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{1}{(n+1)(n+2)}$.
  explanation: |-
    LCT with $1/n^2$: converges. Converges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
      LCT with $1/n^2$: converges. Converges.
- id: img-convtest-020-v2
  concept: Limit Comparison Test
  source: Tests For Convergence/pset_5.png
  prompt: |-
    Test $\sum \frac{n}{(n+1)(n+2)}$.
  explanation: |-
    LCT with $1/n$. Diverges.
  type: freeResponse
  answer:
    gradingMode: selfCheck
    expected: |-
