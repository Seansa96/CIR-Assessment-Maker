lesson:
  introduction: >
    This lesson develops a repeatable way to solve The Biot-Savart Law problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch12-biot-savart-s1
    title: Name the model and quantities
    required: true
    content: >
      The Biot-Savart Law uses dB = mu_0 I dl cross rhat/(4 pi r^2). In the name the model and quantities stage, identify source elements, use symmetry to combine directions, and integrate their contributions.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving The Biot-Savart Law problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch12-biot-savart-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for The Biot-Savart Law, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use dB = mu_0 I dl cross rhat/(4 pi r^2) after you identify source elements, use symmetry to combine directions, and integrate their contributions.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this The Biot-Savart Law problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-biot-savart-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables dB = mu_0 I dl cross rhat/(4 pi r^2) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-biot-savart-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit The Biot-Savart Law.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-biot-savart-units-error
          domains:
          - physics-2
      answer:
