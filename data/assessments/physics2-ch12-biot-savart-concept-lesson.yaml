title: The Biot-Savart Law
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-sources-magnetic-fields
lesson:
  introduction: This lesson develops the main ideas behind The Biot-Savart Law and connects them to the
    governing physical relationships.
  sections:
  - id: l1-sec1
    title: Biot-Savart Law
    required: true
    content: 'The Biot-Savart Law gives the magnetic field $d\vec{B}$ created by an infinitesimal current
      element $I d\vec{l}$:

      $$d\vec{B} = \frac{\mu_0}{4\pi} \frac{I d\vec{l} \times \hat{r}}{r^2}$$

      where $\mu_0 = 4\pi \times 10^{-7}\text{ T m/A}$ is the permeability of free space.'
  - id: l1-sec2
    title: Field of a Wire and Loop
    required: true
    content: Integrating the Biot-Savart Law for a long straight wire gives $B = \frac{\mu_0 I}{2\pi r}$.
      For the center of a circular current loop of radius $R$, the field is $B = \frac{\mu_0 I}{2R}$.
