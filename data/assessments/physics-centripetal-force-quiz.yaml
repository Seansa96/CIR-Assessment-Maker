questions:
  - id: q001
    type: multipleChoice
    prompt: |
      A pendulum bob of mass $m$ is swinging back and forth. When the bob is at the very lowest point of its swing, the tension $T$ in the string is:
    choices:
      - id: a
        text: Greater than $mg$.
      - id: b
        text: Less than $mg$.
      - id: c
        text: Equal to $mg$.
      - id: d
        text: Zero.
    answer:
      choiceId: a
    explanation: |
      At the lowest point, the acceleration points straight up toward the pivot point (this is the centripetal acceleration $v^2/L$). Newton's Second Law says $\sum F_r = m a_r$, so $T - mg = m \frac{v^2}{L}$. Solving for tension gives $T = mg + m \frac{v^2}{L}$, which is clearly greater than $mg$.

  - id: q002
    type: multipleChoice
    prompt: |
      A satellite is in a stable circular orbit around Earth. If the mass of the satellite were doubled, how would its required orbital speed change (assuming the orbital radius stays the same)?
    choices:
      - id: a
        text: It would double.
      - id: b
        text: It would be multiplied by $\sqrt{2}$.
      - id: c
        text: It would be halved.
      - id: d
        text: It would stay the same.
    answer:
      choiceId: d
    explanation: |
      The centripetal force is provided by gravity: $G\frac{Mm}{r^2} = m\frac{v^2}{r}$. Notice that the mass of the satellite $m$ cancels out on both sides: $G\frac{M}{r^2} = \frac{v^2}{r}$. The orbital speed $v = \sqrt{\frac{GM}{r}}$ depends only on the mass of the Earth $M$ and the radius $r$, not on the satellite's mass.

  - id: q003
    type: numericResponse
    prompt: |
      A 1000 kg car goes over the crest of a hill that has a circular cross-section with a radius of 40 m. What is the maximum speed the car can have at the top of the hill without leaving the ground? (Use $g = 10$ m/s²).
    answer:
      value: 20
      tolerance: 0.5
    explanation: |
      At the top of the hill, the center of the circular path is straight down. The forces are gravity (down, positive radial direction) and the normal force (up, negative radial direction).
      $\sum F_r = mg - N = m\frac{v^2}{r}$.
      The car leaves the ground when the normal force drops to zero ($N = 0$).
      $mg = m\frac{v^2}{r} \implies v = \sqrt{gr} = \sqrt{10 \times 40} = \sqrt{400} = 20$ m/s.


