glossary:
  introduction: |
    Use this reference to recognize the structural parts of a power series before deciding where it converges.

    ![A power-series center, radius, and endpoint-test map](/assessments/calc2-infinite-series/power-series-radius-endpoints-map.svg)
  sections:
    - id: power-series-structure
      title: Structure and convergence language
      required: true
      content: A power series is organized around a center, while its interval records the actual convergence set after both endpoints have been tested.
      entries:
        - id: center
          term: Center
          definition: The value $a$ in a series written with powers of $(x-a)$.
          notation: '$\sum c_n(x-a)^n$'
          drills:
            - id: center-cloze
              type: cloze
              prompt: 'The series $\sum c_n(x+4)^n$ is centered at ____.'
              answer: { expected: '-4' }
              explanation: The standard factor is $(x-a)$, so $x+4=x-(-4)$.
        - id: radius
          term: Radius of convergence
          definition: The distance from the center within which convergence is automatic.
          notation: '$|x-a|<R$'
          drills:
            - id: radius-cloze
              type: cloze
              prompt: 'The inequality $|x-2|<5$ gives radius ____.'
              answer: { expected: '5' }
              explanation: Radius is the positive distance from the center.
        - id: endpoint-test
          term: Endpoint test
          definition: The separate numerical-series test performed after substituting $x=a-R$ and $x=a+R$.
          notation: '$x=a\pm R$'
          drills:
            - id: endpoint-typed
              type: typed
              prompt: What must be done after the ratio test gives the open interval of a power series?
              answer: { expected: test both endpoints separately, aliases: [perform endpoint tests] }
              explanation: The ratio test is usually inconclusive when its limit equals one.
