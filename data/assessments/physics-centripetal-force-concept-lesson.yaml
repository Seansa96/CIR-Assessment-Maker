sections:
- id: what-is-centripetal-force
  title: What is Centripetal Force?
  content: 'According to Newton''s Second Law, any acceleration must be caused by
    a net force. When an object moves in a circular path, it experiences a radial
    (centripetal) acceleration $a_r = \frac{v^2}{r}$ pointing toward the center of
    the circle.


    Therefore, there must be a net force pointing toward the center. We call this
    the **centripetal force**.


    $$ F_c = m a_r = m \frac{v^2}{r} $$


    **Important:** Centripetal force is *not* a new, distinct type of force like gravity
    or tension. It is simply the *name given to the net radial force*. It must be
    provided by existing physical forces:

    * For a satellite orbiting Earth, gravity provides the centripetal force.

    * For a car rounding a flat curve, static friction provides the centripetal force.

    * For a ball swung on a string, tension provides the centripetal force.

    '
- id: identifying-the-forces
  title: Identifying the Forces
  content: 'When solving circular motion problems, the "centripetal direction" (toward
    the center) is the positive radial axis.


    $$ \sum F_r = m \frac{v^2}{r} $$


    Any forces pointing toward the center are positive, and forces pointing away from
    the center are negative. The sum of these forces equals $mv^2/r$.

    '
lesson:
  introduction: Centripetal Force
  sections:
  - id: sec-q001
    title: A ball attached to a string is swung in a vertical circle. At the very
      bottom of the circle, which forces contribute to the centripetal force?
    content: |
      A ball attached to a string is swung in a vertical circle. At the very bottom of the circle, which forces contribute to the centripetal force?
    check:
      id: check-q001
      type: multipleChoice
      prompt: 'Select the correct statement:'
      choices:
      - id: a
        text: Tension pointing up and Gravity pointing down.
      - id: b
        text: Only Tension pointing up.
      - id: c
        text: Only Gravity pointing down.
      - id: d
        text: Tension pointing down and Gravity pointing up.
      answer:
        choiceId: a
      explanation: |
        At the bottom of the loop, the center of the circle is straight up. The Tension ($T$) points up (toward the center), and gravity ($mg$) points down (away from the center). The net centripetal force is $\sum F_r = T - mg = mv^2/r$.
  - id: cf2
    title: Centripetal Force Is a Net Force
    content: 'Centripetal force is the name for the net inward force, not an additional physical interaction.'
    media: []
    check: { id: cfc2, type: multipleChoice, prompt: 'For a car on a flat curve, what commonly provides centripetal force?', choices: [{ id: a, text: static friction }, { id: b, text: a new centripetal force }, { id: c, text: weight only }, { id: d, text: no force }], answer: { choiceId: a }, explanation: 'Solution: Static friction.\n\nWhy it works: It can point inward along the road.\n\nWhy the other choices fail: Centripetal force is a net-force role, not a new force.' }
  - id: cf3
    title: Radial Direction
    content: 'Choose inward as positive radial direction and sum all real force components along it.'
    media: []
    check: { id: cfc3, type: multipleChoice, prompt: 'Centripetal acceleration points:', choices: [{ id: a, text: inward }, { id: b, text: tangent to path }, { id: c, text: outward }, { id: d, text: upward always }], answer: { choiceId: a }, explanation: 'Solution: Inward.\n\nWhy it works: It changes the direction of velocity toward the circle center.\n\nWhy the other choices fail: Tangential acceleration changes speed; outward is not the acceleration direction.' }
  - id: cf4
    title: Speed Dependence
    content: 'Required inward force grows as $v^2$: $F_c=mv^2/r$.'
    media: []
    check: { id: cfc4, type: multipleChoice, prompt: 'Doubling speed at fixed mass and radius changes required centripetal force by:', choices: [{ id: a, text: factor 4 }, { id: b, text: factor 2 }, { id: c, text: factor 1/2 }, { id: d, text: no change }], answer: { choiceId: a }, explanation: 'Solution: Factor 4.\n\nWhy it works: Force depends on speed squared.\n\nWhy the other choices fail: They treat a square relation as linear.' }
  - id: cf5
    title: Radius Dependence
    content: 'At fixed speed, a tighter radius requires larger inward acceleration and force.'
    media: []
    check: { id: cfc5, type: multipleChoice, prompt: 'Halving radius at fixed speed changes centripetal acceleration by:', choices: [{ id: a, text: doubles it }, { id: b, text: halves it }, { id: c, text: no change }, { id: d, text: quadruples it }], answer: { choiceId: a }, explanation: 'Solution: It doubles.\n\nWhy it works: $a_r=v^2/r$.\n\nWhy the other choices fail: Acceleration is inversely, not quadratically, proportional to radius.' }
  - id: cf6
    title: Vertical Circles
    content: 'In a vertical circle, gravity contributes differently at top and bottom because radial direction changes.'
    media: []
    check: { id: cfc6, type: multipleChoice, prompt: 'At the top of a vertical circle, gravity points:', choices: [{ id: a, text: toward center }, { id: b, text: away from center }, { id: c, text: tangent to path }, { id: d, text: zero }], answer: { choiceId: a }, explanation: 'Solution: Toward the center.\n\nWhy it works: The center lies below the object at the top.\n\nWhy the other choices fail: Gravity remains downward.' }
  - id: cf7
    title: Model Check
    content: 'Check that radial force has units of newtons and points inward when the path curves.'
    media: []
    check: { id: cfc7, type: multipleChoice, prompt: 'An object traveling straight at constant speed has centripetal force:', choices: [{ id: a, text: zero }, { id: b, text: $mv^2/r$ always }, { id: c, text: weight }, { id: d, text: friction always }], answer: { choiceId: a }, explanation: 'Solution: Zero.\n\nWhy it works: A straight path has no inward curvature.\n\nWhy the other choices fail: Circular motion is required for centripetal acceleration.' }
