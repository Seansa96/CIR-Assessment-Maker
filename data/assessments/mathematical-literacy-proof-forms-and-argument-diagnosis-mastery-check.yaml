questions:
- id: q001
  type: multipleChoice
  prompt: Which statement is the contrapositive of “If n is even, then $n^2$ is even”?
  choices:
  - id: a
    text: If $n^2$ is not even, then n is not even.
  - id: b
    text: If $n^2$ is even, then n is even.
    issueSignals:
    - id: reversed-implication
  - id: c
    text: If n is not even, then $n^2$ is even.
    issueSignals:
    - id: reversed-implication
  - id: d
    text: If n is even, then $n^2$ is not even.
    issueSignals:
    - id: reversed-implication
  answer:
    choiceId: a
  issueSignals:
  - id: reversed-implication
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: If $n^2$ is not even, then n is not even.
    Why it works: A contrapositive negates and reverses the hypothesis and conclusion without changing the conditional’s truth value.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
- id: q002
  type: multipleChoice
  prompt: A proof of “If P, then Q” assumes not Q and derives not P. What proof form is being used?
  choices:
  - id: a
    text: Contrapositive proof.
  - id: b
    text: Converse proof.
    issueSignals:
    - id: proofStructure-error
  - id: c
    text: Proof by one example.
    issueSignals:
    - id: proofStructure-error
  - id: d
    text: Definition only.
    issueSignals:
    - id: proofStructure-error
  answer:
    choiceId: a
  issueSignals:
  - id: proofStructure-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: Contrapositive proof.
    Why it works: Showing not Q implies not P proves the contrapositive, which is logically equivalent to the original conditional.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
- id: q003
  type: multipleChoice
  prompt: Why does the even number 2 refute “Every even integer is divisible by 4”?
  choices:
  - id: a
    text: It satisfies the hypothesis “even” but fails the claimed conclusion “divisible by 4.”
  - id: b
    text: It is not an integer.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: It proves every even integer is divisible by 4.
    issueSignals:
    - id: example-as-proof
  - id: d
    text: It reverses the definition of even.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: It satisfies the hypothesis “even” but fails the claimed conclusion “divisible by 4.”
    Why it works: A counterexample is one permitted case that makes a universal conditional claim fail.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
- id: q004
  type: multipleChoice
  prompt: A line writes “n=2k” after assuming n is even. What licenses that line?
  choices:
  - id: a
    text: The definition of even supplies an integer k with n=2k.
  - id: b
    text: Every integer has the form 2k.
    issueSignals:
    - id: divisor-definition-misread
  - id: c
    text: The converse of the even-number definition.
    issueSignals:
    - id: divisor-definition-misread
  - id: d
    text: A numerical example alone.
    issueSignals:
    - id: divisor-definition-misread
  answer:
    choiceId: a
  issueSignals:
  - id: divisor-definition-misread
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: |-
    Solution: The definition of even supplies an integer k with n=2k.
    Why it works: A definition licenses replacing a named property with its stated structural form.
    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.
