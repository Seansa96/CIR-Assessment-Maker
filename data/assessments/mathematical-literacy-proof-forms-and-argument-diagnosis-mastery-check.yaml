questions:
- id: q001
  type: multipleChoice
  prompt: Which statement is the contrapositive of “If n is even, then $n^2$ is even”?
  choices:
  - id: a
    text: If $n^2$ is not even, then n is not even.
  - id: b
    text: If $n^2$ is even, then n is even.
    issueSignals:
    - id: reversed-implication
  - id: c
    text: If n is not even, then $n^2$ is even.
    issueSignals:
    - id: reversed-implication
  - id: d
    text: If n is even, then $n^2$ is not even.
    issueSignals:
    - id: reversed-implication
  answer:
    choiceId: a
  issueSignals:
  - id: reversed-implication
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: 'Solution: If $n^2$ is not even, then n is not even.

    Why it works: A contrapositive negates and reverses the hypothesis and conclusion without changing the conditional’s
    truth value.

    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q002
  type: multipleChoice
  prompt: A proof of “If P, then Q” assumes not Q and derives not P. What proof form is being used?
  choices:
  - id: a
    text: Contrapositive proof.
  - id: b
    text: An argument for the converse conditional.
    issueSignals:
    - id: proofStructure-error
  - id: c
    text: Proof by one example.
    issueSignals:
    - id: proofStructure-error
  - id: d
    text: Definition only.
    issueSignals:
    - id: proofStructure-error
  answer:
    choiceId: a
  issueSignals:
  - id: proofStructure-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: 'Solution: Contrapositive proof.

    Why it works: Showing not Q implies not P proves the contrapositive, which is logically equivalent to the original
    conditional.

    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q003
  type: multipleChoice
  prompt: Why does the even number 2 refute “Every even integer is divisible by 4”?
  choices:
  - id: a
    text: It satisfies the hypothesis “even” but fails the claimed conclusion “divisible by 4.”
  - id: b
    text: It is not an integer.
    issueSignals:
    - id: example-as-proof
  - id: c
    text: It proves every even integer is divisible by 4.
    issueSignals:
    - id: example-as-proof
  - id: d
    text: It reverses the definition of even.
    issueSignals:
    - id: example-as-proof
  answer:
    choiceId: a
  issueSignals:
  - id: example-as-proof
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: 'Solution: It satisfies the hypothesis “even” but fails the claimed conclusion “divisible by 4.”

    Why it works: A counterexample is one permitted case that makes a universal conditional claim fail.

    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q004
  type: multipleChoice
  prompt: A line writes “n=2k” after assuming n is even. What licenses that line?
  choices:
  - id: a
    text: The definition of even supplies an integer k with n=2k.
  - id: b
    text: Every integer has the form 2k.
    issueSignals:
    - id: divisor-definition-misread
  - id: c
    text: The converse of the even-number definition.
    issueSignals:
    - id: divisor-definition-misread
  - id: d
    text: A numerical example alone.
    issueSignals:
    - id: divisor-definition-misread
  answer:
    choiceId: a
  issueSignals:
  - id: divisor-definition-misread
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - proofJustification
  difficultyEvidence: Requires preserving the stated logical direction and evaluating a concrete mathematical-reading
    claim.
  explanation: 'Solution: The definition of even supplies an integer k with n=2k.

    Why it works: A definition licenses replacing a named property with its stated structural form.

    Why the other choices fail: Each alternative changes the claim’s direction, role, or required evidence.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q005
  type: multipleChoice
  prompt: A proof of “If P then Q” assumes not Q and derives not P. What method is it?
  choices:
  - id: a
    text: Contrapositive proof.
  - id: b
    text: Direct proof.
    issueSignals:
    - id: method-misclassification
  - id: c
    text: Converse proof.
    issueSignals:
    - id: converse-confusion
  - id: d
    text: Inverse proof.
    issueSignals:
    - id: inverse-confusion
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - representationTransfer
  - methodSelection
  difficultyEvidence: Identifies method from assumption and derived conclusion.
  explanation: 'Solution: Contrapositive proof.

    Why it works: It proves the equivalent statement “if not Q then not P.”

    Why the other choices fail: Direct starts with P; converse and inverse are different conditionals.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q006
  type: multipleChoice
  prompt: A proposed contrapositive proof assumes not Q but concludes Q. What is missing?
  choices:
  - id: a
    text: A derivation of not P from not Q.
  - id: b
    text: More symbols.
    issueSignals:
    - id: symbol-authority-error
  - id: c
    text: A proof of Q implies P.
    issueSignals:
    - id: converse-target-error
  - id: d
    text: A new definition only.
    issueSignals:
    - id: definition-as-repair
  answer:
    choiceId: a
  difficultyDimensions:
  - argumentMapping
  - errorDiagnosis
  - conditionChecking
  difficultyEvidence: Detects failure to reach the contrapositive conclusion.
  explanation: 'Solution: A derivation of not P from not Q.

    Why it works: That completes the contrapositive conditional.

    Why the other choices fail: They do not provide the required logical endpoint.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q007
  type: multipleChoice
  prompt: Which feature favors a contrapositive proof of “If P then Q”?
  choices:
  - id: a
    text: Not Q is a useful start from which not P can be derived.
  - id: b
    text: Every conditional requires this method.
    issueSignals:
    - id: universal-method-error
  - id: c
    text: The converse seems easier.
    issueSignals:
    - id: converse-substitution
  - id: d
    text: Justification may be omitted.
    issueSignals:
    - id: justification-omission
  answer:
    choiceId: a
  difficultyDimensions:
  - methodSelection
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Chooses a proof strategy from a usable negated conclusion.
  explanation: 'Solution: Not Q is a useful start from which not P can be derived.

    Why it works: This constructs the equivalent contrapositive.

    Why the other choices fail: They select a different claim or abandon proof requirements.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q008
  type: multipleChoice
  prompt: For “If n is even, then n squared is even,” what is a valid direct-proof start?
  choices:
  - id: a
    text: Let n equal 2k for an integer k.
  - id: b
    text: Assume n squared is not even.
    issueSignals:
    - id: contrapositive-start
  - id: c
    text: Assume n squared is even.
    issueSignals:
    - id: converse-start
  - id: d
    text: Assume n is not even.
    issueSignals:
    - id: inverse-start
  answer:
    choiceId: a
  difficultyDimensions:
  - definitionUse
  - representationTransfer
  - methodSelection
  difficultyEvidence: Uses the parity definition on the original hypothesis.
  explanation: 'Solution: Let n equal 2k for an integer k.

    Why it works: This unpacks evenness in a direct proof.

    Why the other choices fail: They begin contrapositive, converse, or inverse arguments.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q009
  type: multipleChoice
  prompt: Why can a contrapositive proof establish the original conditional?
  choices:
  - id: a
    text: The truth-table comparison makes the two conditionals logically equivalent.
  - id: b
    text: Negating a conditional makes it true.
    issueSignals:
    - id: negation-truth-error
  - id: c
    text: The converse always agrees with it.
    issueSignals:
    - id: converse-equivalence-error
  - id: d
    text: Its proof label guarantees truth.
    issueSignals:
    - id: label-authority-error
  answer:
    choiceId: a
  difficultyDimensions:
  - representationTransfer
  - conventionRecognition
  - justificationEvaluation
  difficultyEvidence: Connects truth-table equivalence to proof validity.
  explanation: 'Solution: The truth-table comparison makes the two conditionals logically equivalent.

    Why it works: Equivalent statements have the same truth value.

    Why the other choices fail: They assert false rules or replace reasoning with a label.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
- id: q010
  type: multipleChoice
  prompt: A parity proof reaches its desired conclusion but contains an unjustified algebraic step. What is the
    verdict?
  choices:
  - id: a
    text: It has a gap until that step is justified by algebra or a definition.
  - id: b
    text: The endpoint validates all earlier steps.
    issueSignals:
    - id: endpoint-overrides-reasoning
  - id: c
    text: The converse repairs the step.
    issueSignals:
    - id: converse-as-warrant
  - id: d
    text: Parity arguments need no warrants.
    issueSignals:
    - id: proof-standard-dismissal
  answer:
    choiceId: a
  difficultyDimensions:
  - errorDiagnosis
  - argumentMapping
  - justificationEvaluation
  difficultyEvidence: Evaluates an apparently plausible proof for a missing warrant.
  explanation: 'Solution: It has a gap until that step is justified by algebra or a definition.

    Why it works: Each proof step must be licensed by stated mathematics.

    Why the other choices fail: They accept an unsupported chain or change the claim.'
  prerequisiteObjectiveIds:
  - ml-proof-reading-02
