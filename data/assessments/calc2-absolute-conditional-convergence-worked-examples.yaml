workedExamples:
  - id: we-absolute-conditional-convergence-1
    title: Prove absolute convergence by comparison
    problem: |
      Classify
      $$\sum_{n=1}^{\infty}\frac{(-1)^n}{n^2+1}$$
      as absolutely convergent, conditionally convergent, or divergent.
    steps:
      - id: step-absolute-conditional-convergence-1-1
        title: Form the absolute-value series
        instruction: |
          Absolute convergence concerns
          $$\sum_{n=1}^{\infty}\left|\frac{(-1)^n}{n^2+1}\right|
          =\sum_{n=1}^{\infty}\frac1{n^2+1}.$$
        type: multipleChoice
        prompt: What happens to $(-1)^n$ after taking absolute values?
        choices:
          - id: a
            text: It becomes $1$.
          - id: b
            text: It becomes $-1$.
          - id: c
            text: It becomes $n$.
          - id: d
            text: It remains alternating.
        answer:
          choiceId: a
        explanation: Since $|(-1)^n|=1$, only the positive magnitudes remain.
      - id: step-absolute-conditional-convergence-1-2
        title: Choose a valid comparison
        instruction: |
          For $n\ge1$, $n^2+1\ge n^2$, so
          $$0<\frac1{n^2+1}\le\frac1{n^2}.$$
          The comparison series $\sum1/n^2$ is a convergent $p$-series.
        type: multipleChoice
        prompt: Why is comparison with $\sum1/n$ not the useful direction here?
        choices:
          - id: a
            text: Being smaller than a divergent series would not prove convergence.
          - id: b
            text: The harmonic series converges.
          - id: c
            text: Both series have negative terms.
          - id: d
            text: Direct comparison cannot be used on positive terms.
        answer:
          choiceId: a
        explanation: To prove convergence by direct comparison, dominate the target by a known convergent series.
      - id: step-absolute-conditional-convergence-1-3
        title: Conclude absolute convergence
        instruction: |
          The comparison test proves $\sum1/(n^2+1)$ converges. Therefore the
          original signed series converges absolutely.
        type: multipleChoice
        prompt: Which theorem transfers this result to the original series?
        choices:
          - id: a
            text: If $\sum|a_n|$ converges, then $\sum a_n$ converges.
          - id: b
            text: If $a_n\to0$, then $\sum a_n$ converges.
          - id: c
            text: Every alternating series converges absolutely.
          - id: d
            text: A bounded sequence always has a convergent series.
        answer:
          choiceId: a
        explanation: Absolute convergence is a sufficient condition for convergence of the signed series.
      - id: step-absolute-conditional-convergence-1-4
        title: Avoid an unnecessary second test
        instruction: |
          Once convergence of $\sum|a_n|$ is known, the strongest classification
          is already established. There is no need to apply the alternating-series
          test separately.
        type: multipleChoice
        prompt: What is the final classification?
        choices:
          - id: a
            text: Absolutely convergent
          - id: b
            text: Conditionally convergent
          - id: c
            text: Divergent
          - id: d
            text: Inconclusive
        answer:
          choiceId: a
        explanation: A conditionally convergent series is specifically one that fails absolute convergence.

  - id: we-absolute-conditional-convergence-2
    title: Establish conditional convergence
    problem: |
      Classify
      $$\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{\sqrt n}.$$
    steps:
      - id: step-absolute-conditional-convergence-2-1
        title: Check the signed series
        instruction: |
          Set $b_n=1/\sqrt n$. The magnitudes are positive, decrease with $n$,
          and satisfy $b_n\to0$. The alternating-series test therefore proves
          that the signed series converges.
        type: multipleChoice
        prompt: Which fact is essential but would fail for $b_n=1+1/n$?
        choices:
          - id: a
            text: '$b_n\to0$'
          - id: b
            text: '$b_n>0$'
          - id: c
            text: '$b_n$ has a square root'
          - id: d
            text: '$b_1=1$'
        answer:
          choiceId: a
        explanation: Alternating signs cannot overcome terms that fail to approach zero.
      - id: step-absolute-conditional-convergence-2-2
        title: Remove the signs
        instruction: |
          Absolute convergence would require convergence of
          $$\sum_{n=1}^{\infty}\frac1{\sqrt n}
          =\sum_{n=1}^{\infty}\frac1{n^{1/2}}.$$
        type: multipleChoice
        prompt: Which standard family contains this absolute-value series?
        choices:
          - id: a
            text: A $p$-series with $p=1/2$
          - id: b
            text: A geometric series with ratio $1/2$
          - id: c
            text: A telescoping series
          - id: d
            text: A $p$-series with $p=2$
        answer:
          choiceId: a
        explanation: The exponent in the denominator is the $p$ parameter.
      - id: step-absolute-conditional-convergence-2-3
        title: Decide the absolute-value series
        instruction: |
          A $p$-series $\sum1/n^p$ converges exactly when $p>1$. Since
          $p=1/2\le1$, the absolute-value series diverges.
        type: multipleChoice
        prompt: What has now been proved?
        choices:
          - id: a
            text: The original converges, but not absolutely.
          - id: b
            text: The original diverges.
          - id: c
            text: The original converges absolutely.
          - id: d
            text: The term limit is nonzero.
        answer:
          choiceId: a
        explanation: The alternating test and $p$-series test answer two distinct questions needed for classification.
      - id: step-absolute-conditional-convergence-2-4
        title: State both parts of the conclusion
        instruction: |
          Because the signed series converges and its absolute-value series
          diverges, the original series converges conditionally.
        type: multipleChoice
        prompt: Which justification is complete?
        choices:
          - id: a
            text: 'Conditional: the alternating-series test proves convergence, while the $p$-series test disproves absolute convergence.'
          - id: b
            text: Conditional because the signs alternate.
          - id: c
            text: Absolute because the terms approach zero.
          - id: d
            text: Divergent because the absolute-value series diverges.
        answer:
          choiceId: a
        explanation: A classification must state why the signed series converges and why absolute convergence fails.

  - id: we-absolute-conditional-convergence-3
    title: Classify an entire parameter family
    problem: |
      For real $p$, classify
      $$\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^p}$$
      as absolutely convergent, conditionally convergent, or divergent.
    steps:
      - id: step-absolute-conditional-convergence-3-1
        title: Separate the term-test region
        instruction: |
          If $p=0$, the terms are $(-1)^{n-1}$ and do not approach zero.
          If $p<0$, their magnitudes $n^{-p}$ grow. Thus the series diverges
          for every $p\le0$ by the divergence test.
        type: multipleChoice
        prompt: Why can no alternating-series argument rescue the case $p\le0$?
        choices:
          - id: a
            text: The terms fail to approach zero.
          - id: b
            text: The terms are not all positive.
          - id: c
            text: The exponent is an integer.
          - id: d
            text: The partial sums are finite.
        answer:
          choiceId: a
        explanation: A zero term limit is necessary for every convergent series.
      - id: step-absolute-conditional-convergence-3-2
        title: Establish signed convergence for positive $p$
        instruction: |
          When $p>0$, $b_n=1/n^p$ decreases and tends to zero. Therefore the
          alternating-series test proves convergence throughout $p>0$.
        type: multipleChoice
        prompt: For which range has signed convergence now been established?
        choices:
          - id: a
            text: '$p>0$'
          - id: b
            text: '$p>1$ only'
          - id: c
            text: '$p\le0$'
          - id: d
            text: All real $p$
        answer:
          choiceId: a
        explanation: The alternating-series threshold is $p>0$, which differs from the absolute-convergence threshold.
      - id: step-absolute-conditional-convergence-3-3
        title: Locate the absolute-convergence range
        instruction: |
          Taking absolute values produces $\sum1/n^p$. The $p$-series theorem
          says this converges exactly when $p>1$. Hence the original series is
          absolutely convergent for $p>1$.
        type: multipleChoice
        prompt: What happens at the boundary $p=1$?
        choices:
          - id: a
            text: The signed series converges, but the absolute-value harmonic series diverges.
          - id: b
            text: Both series converge.
          - id: c
            text: The signed terms fail to approach zero.
          - id: d
            text: The series is geometric.
        answer:
          choiceId: a
        explanation: The alternating harmonic series is the boundary case and is conditionally convergent.
      - id: step-absolute-conditional-convergence-3-4
        title: Assemble the classification
        instruction: |
          Combining the regions gives:
          $$\begin{cases}
          p>1 &: \text{absolutely convergent},\\
          0<p\le1 &: \text{conditionally convergent},\\
          p\le0 &: \text{divergent}.
          \end{cases}$$
          Each boundary belongs where its theorem conditions place it.
        type: multipleChoice
        prompt: Which value of $p$ produces conditional convergence?
        choices:
          - id: a
            text: '$p=3/4$'
          - id: b
            text: '$p=2$'
          - id: c
            text: '$p=0$'
          - id: d
            text: '$p=-1$'
        answer:
          choiceId: a
        explanation: $3/4$ lies in $0<p\le1$; the signed series converges but its absolute-value $p$-series diverges.
