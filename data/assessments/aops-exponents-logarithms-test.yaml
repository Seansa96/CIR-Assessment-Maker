questions:
- id: q001
  type: multipleChoice
  prompt: 'For $x\ge0$, simplify $(x^{3/2})^2$.'
  choices:
  - id: a
    text: '$x^3$'
  - id: b
    text: '$x^{3/4}$'
  - id: c
    text: '$x^4$'
  - id: d
    text: '$2x^{3/2}$'
  answer:
    choiceId: a
  explanation: Multiply the exponents; the stated nonnegative domain supports the real fractional power.
- id: q002
  type: multipleChoice
  prompt: 'Which statement is correct?'
  choices:
  - id: a
    text: '$16^7<8^9$'
  - id: b
    text: '$16^7=8^9$'
  - id: c
    text: '$16^7>8^9$'
  - id: d
    text: The comparison depends on a logarithm approximation.
  answer:
    choiceId: c
  explanation: $16^7=2^{28}$ and $8^9=2^{27}$.
- id: q003
  type: multipleChoice
  prompt: 'Find all real solutions of $x^{2/3}=4$.'
  choices:
  - id: a
    text: '$x=8$ only'
  - id: b
    text: '$x=-8$ only'
  - id: c
    text: '$x=\pm8$'
  - id: d
    text: '$x=\pm2$'
  answer:
    choiceId: c
  explanation: Let $u=\sqrt[3]{x}$. Then $u^2=4$, so $u=\pm2$ and $x=u^3=\pm8$.
- id: q004
  type: multipleChoice
  prompt: 'Rationalize $\dfrac3{\sqrt7-2}$.'
  choices:
  - id: a
    text: '$\sqrt7+2$'
  - id: b
    text: '$3\sqrt7+6$'
  - id: c
    text: '$\sqrt7-2$'
  - id: d
    text: '$\dfrac{\sqrt7+2}{3}$'
  answer:
    choiceId: a
  explanation: The conjugate product is $7-4=3$, which cancels the numerator coefficient 3.
- id: q005
  type: multipleChoice
  prompt: 'Solve $\sqrt{2x+3}=x$ over the reals.'
  choices:
  - id: a
    text: '$x=3$ only'
  - id: b
    text: '$x=-1$ only'
  - id: c
    text: '$x=-1$ or $x=3$'
  - id: d
    text: There is no real solution.
  answer:
    choiceId: a
  explanation: Squaring gives candidates $-1$ and 3, but the original right side must be nonnegative and direct substitution rejects $-1$.
- id: q006
  type: multipleChoice
  prompt: 'What is the real domain of $\log_2(x^2-9)$?'
  choices:
  - id: a
    text: '$x>3$'
  - id: b
    text: '$x<-3$ or $x>3$'
  - id: c
    text: '$x\ne\pm3$'
  - id: d
    text: '$-3<x<3$'
  answer:
    choiceId: b
  explanation: The argument must satisfy $(x-3)(x+3)>0$, which occurs outside the two roots.
- id: q007
  type: multipleChoice
  prompt: 'Solve $\log_3(x-1)-\log_3(x-4)=1$.'
  choices:
  - id: a
    text: '$x=\frac52$'
  - id: b
    text: '$x=4$'
  - id: c
    text: '$x=\frac{11}{2}$'
  - id: d
    text: '$x=11$'
  answer:
    choiceId: c
  explanation: The domain is $x>4$. The quotient law gives $(x-1)/(x-4)=3$, hence $x=11/2$.
- id: q008
  type: multipleChoice
  prompt: 'Solve $4^{x+1}=8^{2x-1}$.'
  choices:
  - id: a
    text: '$x=\frac14$'
  - id: b
    text: '$x=\frac54$'
  - id: c
    text: '$x=\frac45$'
  - id: d
    text: '$x=2$'
  answer:
    choiceId: b
  explanation: |-
    Rewrite with base 2: $2x+2=6x-3$, so $x=5/4$.
- id: q009
  type: multipleChoice
  prompt: 'Solve $16^x-17\cdot4^x+16=0$.'
  choices:
  - id: a
    text: '$x=1$ or $x=16$'
  - id: b
    text: '$x=0$ or $x=2$'
  - id: c
    text: '$x=-1$ or $x=2$'
  - id: d
    text: '$x=0$ only'
  answer:
    choiceId: b
  explanation: Let $u=4^x>0$. Then $(u-1)(u-16)=0$, giving $x=0$ or $x=2$.
- id: q010
  type: multipleChoice
  prompt: 'Solve $3^x+3^{-x}=\dfrac{10}{3}$.'
  choices:
  - id: a
    text: '$x=1$ only'
  - id: b
    text: '$x=-1$ only'
  - id: c
    text: '$x=\pm1$'
  - id: d
    text: '$x=\pm3$'
  answer:
    choiceId: c
  explanation: With $u=3^x>0$, solve $u+1/u=10/3$ to obtain $u=3$ or $1/3$.
- id: q011
  type: multipleChoice
  prompt: 'For real $x$, what is the minimum value of $2^x+2^{-x}$?'
  choices:
  - id: a
    text: '0'
  - id: b
    text: '1'
  - id: c
    text: '2'
  - id: d
    text: No minimum exists.
  answer:
    choiceId: c
  explanation: Let $u=2^x>0$. Then $u+1/u\ge2$ by AM-GM, with equality at $u=1$, or $x=0$.
- id: q012
  type: multipleChoice
  prompt: 'Solve $\log_{x-1}8=3$ over the reals.'
  choices:
  - id: a
    text: '$x=2$'
  - id: b
    text: '$x=3$'
  - id: c
    text: '$x=9$'
  - id: d
    text: '$x=-1$'
  answer:
    choiceId: b
  explanation: $(x-1)^3=8$ gives $x-1=2$; the resulting base 2 is positive and not 1.
- id: q013
  type: selectAll
  prompt: 'Select every equation for which the substitution $u=2^x$ directly produces a polynomial in $u$.'
  choices:
  - id: a
    text: '$4^x-6\cdot2^x+8=0$'
  - id: b
    text: '$2^x+2^{-x}=3$'
  - id: c
    text: '$8^x-4^x=6$'
  - id: d
    text: '$2^x+x=5$'
  answer:
    choiceIds:
    - a
    - b
    - c
  explanation: The first three become expressions involving integer powers of $u$ after clearing a nonzero denominator when needed; the final equation still contains $x$.
- id: q014
  type: selectAll
  prompt: 'Which statements about real logarithmic equations are correct?'
  choices:
  - id: a
    text: Every logarithm argument must be positive.
  - id: b
    text: A base must be positive and different from 1.
  - id: c
    text: '$\log_b(u+v)=\log_bu+\log_bv$ whenever $u,v>0$.'
  - id: d
    text: Algebraic candidates must be tested against the original domain.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: The logarithm sum claim is false; the addition law corresponds to a product inside one logarithm.
- id: q015
  type: freeResponse
  prompt: |-
    Prove that $a^x+a^{-x}\ge2$ for every $a>0$ and real $x$. State when equality occurs.
  answer:
    gradingMode: selfCheck
    expected: |-
      Let $u=a^x>0$. Then $a^{-x}=1/u$. By AM-GM, $u+1/u\ge2\sqrt{u(1/u)}=2$. Equality holds exactly when $u=1/u$, so $u=1$. If $a\ne1$, this means $x=0$; if $a=1$, equality holds for every real $x$.
    keyPoints:
    - Introduces a positive quantity such as $u=a^x$.
    - Applies AM-GM or an equivalent square argument.
    - Handles the equality condition, including the exceptional base $a=1$.
  explanation: The exceptional equality case is part of a complete proof; dividing by $\log a$ would incorrectly ignore $a=1$.
