lesson:
  introduction: 'A chemist in a lab can measure *how much* of each element is in an
    unknown compound using combustion analysis or mass spectrometry — but they cannot
    directly see the atoms. This lesson shows\rhow to work backward from percent composition
    data to identify the formula of a compound.

    '
  sections:
  - id: empirical-vs-molecular
    title: Empirical Formula vs. Molecular Formula
    required: true
    content: '**Empirical formula**: The simplest whole-number ratio of atoms in a
      compound.

      **Molecular formula**: The actual number of each type of atom in one molecule.


      The molecular formula is always a whole-number multiple of the empirical formula.


      | Compound | Molecular formula | Empirical formula |

      |---|---|---|

      | Glucose | C6H12O6 | CH2O |

      | Acetic acid | C2H4O2 | CH2O |

      | Benzene | C6H6 | CH |

      | Water | H2O | H2O (same) |


      Note that glucose and acetic acid have the **same** empirical formula (CH2O)
      but completely different molecular formulas, properties, and behavior!

      '
    check:
      id: empirical-check
      type: multipleChoice
      prompt: 'Which of the following pairs share the same empirical formula?

        '
      choices:
      - id: a
        text: N2H4 and N2H2
      - id: b
        text: H2O and H2O2
      - id: c
        text: CO and CO2
      - id: d
        text: C2H2 and C4H4
      answer:

        choiceId: d
      explanation: 'C2H2 and C4H4 both reduce to the empirical formula CH (ratio of
        C:H is 1:1 in both). N2H4 (empirical NH2) and N2H2 (empirical NH) are different.
        H2O and H2O2 are different. CO and CO2 are different.

        '
  - id: empirical-from-percent
    title: Finding the Empirical Formula from Percent Composition
    required: true
    content: '**The 4-Step Method:**


      **Step 1:** Assume you have 100 g of the compound. Each percentage becomes grams
      directly.


      **Step 2:** Convert grams of each element to moles:

      $$

      n = \frac{m}{M}

      $$


      **Step 3:** Divide all mole values by the smallest mole value to get a ratio.


      **Step 4:** If necessary, multiply by a small integer to make all ratios whole
      numbers.


      **Example:** A compound is 40.0% C, 6.72% H, and 53.3% O by mass.


      - Assume 100 g → 40.0 g C, 6.72 g H, 53.3 g O


      - Moles: $n_C = \frac{40.0}{12.011} = 3.33$, $n_H = \frac{6.72}{1.008} = 6.67$,
      $n_O = \frac{53.3}{15.999} = 3.33$


      - Divide by smallest (3.33): C = 1, H = 2, O = 1


      - Empirical formula: **CH2O**

      '
    check:
      id: from-percent-check
      type: multipleChoice
      prompt: 'A compound contains 75.0% C and 25.0% H by mass. What is the empirical
        formula?

        (C = 12.011, H = 1.008 g/mol)

        '
      choices:
      - id: a
        text: CH4
      - id: b
        text: CH2
      - id: c
        text: C2H6
      - id: d
        text: CH3
      answer:

        choiceId: a
      explanation: '75.0 g C / 12.011 = 6.244 mol C; 25.0 g H / 1.008 = 24.80 mol
        H. Ratio: 24.80/6.244 = 3.97 ≈ 4 H per C. Empirical formula: CH4 (methane).

        '
  - id: molecular-from-empirical
    title: Finding the Molecular Formula from the Empirical Formula
    required: true
    content: 'Once you have the empirical formula, you need the **molar mass of the
      compound** (from experimental data like mass spectrometry) to find the molecular
      formula.


      **Step 1:** Calculate the molar mass of the empirical formula (EFM).


      **Step 2:** Divide the actual molar mass by the EFM to get the multiplier n:

      $$

      n = \frac{M_{\text{compound}}}{M_{\text{empirical}}}

      $$


      **Step 3:** Multiply every subscript in the empirical formula by n.


      **Example:** Empirical formula CH2O, actual molar mass = 180 g/mol.


      - EFM of CH2O = 12.011 + 2(1.008) + 15.999 = 30.026 g/mol

      - n = 180 / 30.026 ≈ 6

      - Molecular formula: **(CH2O)6 = C6H12O6** (glucose)

      '
    check:
      id: molecular-check
      type: multipleChoice
      prompt: 'A compound has empirical formula NO2 and a molar mass of 92 g/mol.
        What is the molecular formula?

        (N = 14.007, O = 15.999 g/mol → M(NO2) = 46.005 g/mol)

        '
      choices:
      - id: a
        text: N2O4
      - id: b
        text: NO2
      - id: c
        text: N3O6
      - id: d
        text: N4O8
      answer:

        choiceId: a
      explanation: 'n = 92 / 46 = 2. Molecular formula = (NO2)2 = N2O4 (dinitrogen
        tetroxide, a reddish-brown gas involved in atmospheric chemistry).

        '
