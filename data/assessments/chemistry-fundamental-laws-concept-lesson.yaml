lesson:
  introduction: |
    Before atoms could be seen or measured directly, chemists discovered that matter follows strict quantitative rules. Three fundamental laws — discovered in the late 18th and early 19th centuries — laid the foundation for all of modern chemistry and ultimately led to Dalton's Atomic Theory.
  sections:
    - id: conservation-of-mass
      title: Law of Conservation of Mass
      required: true
      content: |
        **Antoine Lavoisier** (1789) established that in any chemical reaction, **mass is neither created nor destroyed**.

        The total mass of the **reactants** always equals the total mass of the **products**.

        **Example:** When 2.0 g of hydrogen gas reacts with 16.0 g of oxygen gas to form water, exactly 18.0 g of water is produced. Not a single gram is lost.

        $$
        m_{\text{reactants}} = m_{\text{products}}
        $$

        This law was revolutionary because it showed that chemistry is a quantitative science — atoms are conserved through reactions; they merely rearrange.
      check:
        id: conservation-check
        type: multipleChoice
        prompt: |
          A student burns 12.0 g of carbon in excess oxygen and collects the CO2 produced. The student measures only 40.0 g of CO2. What mass of oxygen reacted?
        choices:
          - id: a
            text: 28.0 g
          - id: b
            text: 40.0 g
          - id: c
            text: 12.0 g
          - id: d
            text: 52.0 g
        answer:
          choiceId: a
        explanation: |
          By conservation of mass, mass of O2 = mass of CO2 - mass of C = 40.0 g - 12.0 g = 28.0 g. Every gram of reactant must appear in the products.

    - id: definite-proportions
      title: Law of Definite Proportions
      required: true
      content: |
        **Joseph Proust** (1799) discovered that a given chemical compound **always contains the same elements in the same mass ratio**, regardless of its source or how it was made.

        **Example:** Water (H2O) is always 11.2% hydrogen and 88.8% oxygen by mass — whether it comes from a river, a cloud, or a lab synthesis. The ratio never changes.

        This law tells us that compounds have fixed, characteristic compositions — they are not just random mixtures.

        **Contrast with mixtures:** Air can be 20% or 25% oxygen; it has no fixed ratio. Water is always 88.8% oxygen. That distinction is the boundary between a compound and a mixture.
      check:
        id: definite-proportions-check
        type: multipleChoice
        prompt: |
          A chemist synthesizes water in two separate experiments. In the first, 1.0 g of H2 reacts with 8.0 g of O2. In the second, 2.0 g of H2 reacts with 16.0 g of O2. What does the Law of Definite Proportions predict about the H:O mass ratio in each batch of water?
        choices:
          - id: a
            text: The H:O ratio is 1:8 in both samples.
          - id: b
            text: The H:O ratio is different because different amounts were used.
          - id: c
            text: The ratio depends on temperature and pressure.
          - id: d
            text: Only the first experiment gives pure water.
        answer:
          choiceId: a
        explanation: |
          The Law of Definite Proportions guarantees that water always has a fixed 1:8 mass ratio of H to O. The amount synthesized does not affect the ratio — it is an intrinsic property of the compound.

    - id: multiple-proportions
      title: Law of Multiple Proportions
      required: true
      content: |
        **John Dalton** (1803) noticed that when **two elements form more than one compound**, the masses of one element that combine with a fixed mass of the other are in **small whole-number ratios**.

        **Example:** Carbon and oxygen form two compounds:
        - Carbon monoxide (CO): 12 g of C combines with 16 g of O
        - Carbon dioxide (CO2): 12 g of C combines with 32 g of O

        The ratio of oxygen masses for a fixed 12 g of C is:

        $$
        \frac{32\text{ g O in CO}_2}{16\text{ g O in CO}} = \frac{2}{1}
        $$

        The ratio is exactly 2:1 — a small whole number. This is **not** a coincidence; it is a consequence of the fact that matter is made of discrete atoms.

        This law was the critical clue that led Dalton to propose his Atomic Theory: if atoms are whole, indivisible units, then compounds must combine in whole-number ratios.
      check:
        id: multiple-proportions-check
        type: multipleChoice
        prompt: |
          Nitrogen forms two compounds with oxygen: NO and NO2. If 14 g of nitrogen is present in each compound, how many grams of oxygen are in NO2 compared to NO?
        choices:
          - id: a
            text: Twice as much oxygen is in NO2 as in NO.
          - id: b
            text: The same amount of oxygen is in both.
          - id: c
            text: NO2 has 1.5 times as much oxygen as NO.
          - id: d
            text: The ratio depends on the conditions of the reaction.
        answer:
          choiceId: a
        explanation: |
          NO has one oxygen per nitrogen (16 g O per 14 g N). NO2 has two oxygens per nitrogen (32 g O per 14 g N). The ratio is 32:16 = 2:1 — exactly twice as much. This whole-number ratio is the hallmark of the Law of Multiple Proportions.


