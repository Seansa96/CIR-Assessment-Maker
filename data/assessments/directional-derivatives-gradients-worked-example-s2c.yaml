workedExamples:
- id: normalize-and-take-the-dot-product
  title: Normalize and take the dot product
  problem: For f(x,y)=x^2+y^2, find the directional derivative at (1,2) toward <3,4>.
  steps:
  - id: e34-s01
    type: multipleChoice
    prompt: What is grad f(1,2)?
    choices:
    - id: a
      text: <2,4>
      issueSignals: []
    - id: b
      text: <2,2>
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: <1,2>
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: <4,2>
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: <2,4>


      Why it works: The partials are 2x and 2y, so at (1,2) they are 2 and 4.


      Why the other choices fail:

      Choice b: This evaluates both components as 2 and misses f_y=2y=4.

      Choice c: This reports the point instead of differentiating f.

      Choice d: This swaps the x and y components.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Find the gradient
    instruction: What is grad f(1,2)?
    media:
    - type: image
      src: /media/calculus-3/gradients.svg
      alt: Gradient and unit direction on a surface.
      caption: The dot product selects the rate in the requested direction.
  - id: e34-s02
    type: multipleChoice
    prompt: What unit vector points toward <3,4>?
    choices:
    - id: a
      text: <3/5,4/5>
      issueSignals: []
    - id: b
      text: <3,4>
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: <3/4,4/3>
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: <4/5,3/5>
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: <3/5,4/5>


      Why it works: The vector has length 5, so divide both components by 5.


      Why the other choices fail:

      Choice b: This leaves the vector at length 5.

      Choice c: This divides components by different lengths.

      Choice d: This swaps the vector components.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Normalize the direction
    instruction: What unit vector points toward <3,4>?
  - id: e34-s03
    type: multipleChoice
    prompt: What is the directional derivative?
    choices:
    - id: a
      text: 22/5
      issueSignals: []
    - id: b
      text: 2sqrt(5)
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: '2'
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: 24/5
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: 22/5


      Why it works: The dot product is <2,4>·<3/5,4/5>=6/5+16/5=22/5.


      Why the other choices fail:

      Choice b: This gives the gradient magnitude rather than the directional rate.

      Choice c: This uses only the x-direction contribution.

      Choice d: This substitutes 4/5 for both direction components.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Evaluate the directional derivative
    instruction: What is the directional derivative?
- id: find-the-steepest-ascent
  title: Find the steepest ascent
  problem: For f(x,y)=3x^2+y^2 at (1,2), find the maximum directional derivative and its direction.
  steps:
  - id: e24-s01
    type: multipleChoice
    prompt: What is grad f(1,2)?
    choices:
    - id: a
      text: <6,4>
      issueSignals: []
    - id: b
      text: <3,2>
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: <6,2>
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: <6,12>
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: <6,4>


      Why it works: The partials are 6x and 2y, giving <6,4>.


      Why the other choices fail:

      Choice b: This omits the factor 2 from differentiating the squares.

      Choice c: This differentiates y^2 incorrectly at y=2.

      Choice d: This applies the coefficient 3 to the y term.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Compute the gradient
    instruction: What is grad f(1,2)?
  - id: e24-s02
    type: multipleChoice
    prompt: What is the maximum directional derivative?
    choices:
    - id: a
      text: 2sqrt(13)
      issueSignals: []
    - id: b
      text: '10'
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: sqrt(13)
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: '52'
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: 2sqrt(13)


      Why it works: The maximum rate is |grad f|=sqrt(36+16)=2sqrt(13).


      Why the other choices fail:

      Choice b: This adds the gradient components instead of finding its length.

      Choice c: This reports half the magnitude; |<6,4>|=sqrt(52).

      Choice d: This reports the squared norm.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Find the maximum rate
    instruction: What is the maximum directional derivative?
  - id: e24-s03
    type: multipleChoice
    prompt: What unit direction gives that rate?
    choices:
    - id: a
      text: <3/sqrt(13),2/sqrt(13)>
      issueSignals: []
    - id: b
      text: <3/13,2/13>
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: <2/sqrt(13),3/sqrt(13)>
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: <-3/sqrt(13),-2/sqrt(13)>
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: <3/sqrt(13),2/sqrt(13)>


      Why it works: Normalize <6,4> by 2sqrt(13).


      Why the other choices fail:

      Choice b: This divides by 13 instead of the gradient''s length 2sqrt(13).

      Choice c: This swaps the gradient components.

      Choice d: This points toward steepest decrease.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Find the maximizing direction
    instruction: What unit direction gives that rate?
  - id: e24-s04
    type: multipleChoice
    prompt: What is the dot product with the maximizing unit vector?
    choices:
    - id: a
      text: 2sqrt(13)
      issueSignals: []
    - id: b
      text: '0'
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: -2sqrt(13)
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: '-52'
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: 2sqrt(13)


      Why it works: The gradient dotted with its own unit direction equals its magnitude.


      Why the other choices fail:

      Choice b: This would require a perpendicular direction.

      Choice c: This uses the opposite unit direction.

      Choice d: This dots the gradient with the opposite unnormalized gradient.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Check the result
    instruction: What is the dot product with the maximizing unit vector?
- id: measure-change-along-a-signed-direction
  title: Measure change along a signed direction
  problem: For f=x^2+xy+y^2 at (1,-1), find D_u f for direction vector <-3,4>.
  steps:
  - id: e39-s01
    type: multipleChoice
    prompt: What is grad f(x,y)?
    choices:
    - id: a
      text: <2x+y,x+2y>
      issueSignals: []
    - id: b
      text: <2x+y,2x+2y>
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: <2x,x+2y>
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: <x+2y,2x+y>
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: <2x+y,x+2y>


      Why it works: Differentiate each term with respect to x and y, respectively.


      Why the other choices fail:

      Choice b: This differentiates xy with respect to y as 2y instead of x.

      Choice c: This omits the y contribution to f_x.

      Choice d: This swaps the x and y components.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Differentiate f
    instruction: What is grad f(x,y)?
  - id: e39-s02
    type: multipleChoice
    prompt: What is grad f(1,-1)?
    choices:
    - id: a
      text: <1,-1>
      issueSignals: []
    - id: b
      text: <3,-1>
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: <1,3>
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: <-1,1>
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: <1,-1>


      Why it works: The components are 2(1)-1=1 and 1+2(-1)=-1.


      Why the other choices fail:

      Choice b: This substitutes x=1,y=-1 into 2x+y incorrectly.

      Choice c: This evaluates the y component as x-2y.

      Choice d: This reverses both component signs.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Evaluate at the point
    instruction: What is grad f(1,-1)?
  - id: e39-s03
    type: multipleChoice
    prompt: What unit vector points toward <-3,4>?
    choices:
    - id: a
      text: <-3/5,4/5>
      issueSignals: []
    - id: b
      text: <3/5,4/5>
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: <-3,4>
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: <-4/5,3/5>
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: <-3/5,4/5>


      Why it works: The length is 5; preserve each component''s sign when dividing.


      Why the other choices fail:

      Choice b: This loses the negative x direction.

      Choice c: This omits division by the vector length 5.

      Choice d: This rotates or swaps the direction components.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Normalize the signed direction
    instruction: What unit vector points toward <-3,4>?
  - id: e39-s04
    type: multipleChoice
    prompt: What is D_u f(1,-1)?
    choices:
    - id: a
      text: -7/5
      issueSignals: []
    - id: b
      text: 7/5
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: '-1'
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: -3/5
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: -7/5


      Why it works: <1,-1>·<-3/5,4/5>=-3/5-4/5=-7/5.


      Why the other choices fail:

      Choice b: This reverses the sign of the dot product.

      Choice c: This reports f_y alone and skips the directional dot product.

      Choice d: This omits the y-path contribution (-1)(4/5).'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Take the directional dot product
    instruction: What is D_u f(1,-1)?
  - id: e39-s05
    type: multipleChoice
    prompt: What does the negative result mean?
    choices:
    - id: a
      text: f decreases initially in that direction
      issueSignals: []
    - id: b
      text: f increases at its maximum rate
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: f is constant along that direction
      issueSignals:
      - id: vector-component-resolution-error
    - id: d
      text: the gradient has negative magnitude
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    explanation: 'Solution: f decreases initially in that direction


      Why it works: A negative directional derivative means the function decreases initially along u.


      Why the other choices fail:

      Choice b: That would require moving in the gradient direction.

      Choice c: That would require a zero dot product.

      Choice d: A vector magnitude cannot be negative.'
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    title: Interpret the sign
    instruction: What does the negative result mean?
