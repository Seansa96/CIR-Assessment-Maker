workedExamples:
- id: example-001
  title: Build the representation
  problem: 'For $f(x,y)=x^2+y^2$, find the directional derivative at $(1,2)$ toward $\langle3,4\rangle$.'
  steps:
  - id: s001
    title: Find the gradient
    instruction: 'What is $\nabla f(1,2)$?'
    type: multipleChoice
    prompt: 'What is $\nabla f(1,2)$?'
    choices:
    - id: a
      text: '$\langle2,4\rangle$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle2,4\rangle$

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s002
    title: Normalize direction
    instruction: 'What unit vector points toward $\langle3,4\rangle$?'
    type: multipleChoice
    prompt: 'What unit vector points toward $\langle3,4\rangle$?'
    choices:
    - id: a
      text: '$\langle3/5,4/5\rangle$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: vector-component-resolution-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: vector-component-resolution-error
    answer:
      choiceId: a
    issueSignals:
    - id: vector-component-resolution-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle3/5,4/5\rangle$

      Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Unit Circle Trigonometry.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
  - id: s003
    title: Take dot product
    instruction: What is the directional derivative?
    type: multipleChoice
    prompt: What is the directional derivative?
    choices:
    - id: a
      text: $22/5$
