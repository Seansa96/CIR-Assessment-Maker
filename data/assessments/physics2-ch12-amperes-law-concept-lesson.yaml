lesson:
  introduction: >
    This lesson develops a repeatable way to solve Ampere's Law problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch12-amperes-law-s1
    title: Name the model and quantities
    required: true
    content: >
      Ampere's Law uses integral(B dot dl) = mu_0 I_enclosed. In the name the model and quantities stage, select an Amperian loop with symmetry and include only current piercing its surface.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Ampere's Law problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch12-amperes-law-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Ampere's Law, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use integral(B dot dl) = mu_0 I_enclosed after you select an Amperian loop with symmetry and include only current piercing its surface.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Ampere's Law problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-amperes-law-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables integral(B dot dl) = mu_0 I_enclosed relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-amperes-law-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Ampere's Law.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-amperes-law-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Ampere's Law, first select an Amperian loop with symmetry and include only current piercing its surface. Then apply integral(B dot dl) = mu_0 I_enclosed with one consistent coordinate system and solve for the requested quantity.


        Why it works: integral(B dot dl) = mu_0 I_enclosed connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
