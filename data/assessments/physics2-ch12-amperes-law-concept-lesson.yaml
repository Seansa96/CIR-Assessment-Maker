lesson:
  introduction: This lesson develops the main ideas behind Ampere's Law and connects them to the governing
    physical relationships.
  sections:
  - id: l2-sec1
    title: Ampere's Law
    required: true
    content: 'Ampere''s Law relates the line integral of the magnetic field around a closed path to the
      total current passing through any surface bounded by that path:

      $$\oint \vec{B} \cdot d\vec{l} = \mu_0 I_{enc}$$'
  - id: l2-sec2
    title: Solenoids and Toroids
    required: true
    content: 'Ampere''s Law easily yields the field inside a long solenoid: $B = \mu_0 n I$ (where $n$
      is turns per unit length), and inside a toroid: $B = \frac{\mu_0 N I}{2\pi r}$.'
