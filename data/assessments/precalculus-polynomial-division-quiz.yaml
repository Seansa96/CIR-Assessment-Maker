modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: symbolicResponse
  prompt: 'Divide and enter the quotient:


    $$

    \frac{x^2+5x+6}{x+2}

    $$

    '
  answer:
    expectedLatex: x+3
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Use synthetic division with root $-2$, or factor $(x+2)(x+3)$. The
    quotient is $x+3$.


    Related topic: synthetic division with divisor $x-c$.

    '
- id: q002
  type: symbolicResponse
  prompt: 'Divide and enter the quotient:


    $$

    \frac{3x^3-2x^2-7x+6}{x-1}

    $$

    '
  answer:
    expectedLatex: 3x^2+x-6
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Use synthetic division with root $1$. The quotient coefficients are
    $3,1,-6$ and the remainder is $0$.


    Related topic: synthetic division arithmetic.

    '
- id: q003
  type: symbolicResponse
  prompt: 'Divide and enter the quotient:


    $$

    \frac{2x^3+x^2-8x+5}{x+2}

    $$

    '
  answer:
    expectedLatex: 2x^2-3x-2
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Use synthetic division with root $-2$. The quotient is $2x^2-3x-2$
    and the remainder is $9$.


    Related topic: quotient with nonzero remainder.

    '
- id: q004
  type: symbolicResponse
  prompt: 'Divide and enter the full result, including the remainder term:


    $$

    \frac{x^3+4x+1}{x-2}

    $$

    '
  answer:
    expectedLatex: x^2+2x+8+\frac{17}{x-2}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Include a zero coefficient for the missing $x^2$ term: $1,0,4,1$.
    Synthetic division by $2$ gives quotient $x^2+2x+8$ and remainder $17$.


    Related topic: missing terms in synthetic division.

    '
- id: q005
  type: symbolicResponse
  prompt: 'Divide and enter the quotient:


    $$

    \frac{x^3-6x^2+11x-6}{x-3}

    $$

    '
  answer:
    expectedLatex: x^2-3x+2
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Synthetic division with root $3$ gives quotient $x^2-3x+2$ and remainder
    $0$.


    Related topic: factor theorem and synthetic division.

    '
- id: q006
  type: multipleChoice
  prompt: 'Which synthetic number should be used for division by $x+5$?

    '
  choices:
  - id: a
    text: $-5$
  - id: b
    text: $5$
  - id: c
    text: $0$
  - id: d
    text: $1/5$
  answer:
    choiceId: a
  explanation: 'Set $x+5=0$, so $x=-5$. The synthetic number is $-5$.


    Related topic: synthetic division root from divisor.

    '
- id: q007
  type: symbolicResponse
  prompt: 'Divide and enter the quotient:


    $$

    \frac{2x^4-3x^3+x-4}{x^2+1}

    $$

    '
  answer:
    expectedLatex: 2x^2-3x-2
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Use long division because the divisor is quadratic. Include the missing
    $x^2$ coefficient in the dividend. The quotient is $2x^2-3x-2$.


    Related topic: polynomial long division.

    '
- id: q008
  type: symbolicResponse
  prompt: 'Divide and enter the full result:


    $$

    \frac{x^2+1}{x-1}

    $$

    '
  answer:
    expectedLatex: x+1+\frac{2}{x-1}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Synthetic division by $1$ gives quotient $x+1$ and remainder $2$.
    The full result is quotient plus remainder over divisor.


    Related topic: remainder term after division.

    '
- id: q009
  type: multipleChoice
  prompt: 'Which situation requires polynomial long division rather than ordinary
    synthetic division?

    '
  choices:
  - id: a
    text: Dividing by $x^2+3$
  - id: b
    text: Dividing by $x-4$
  - id: c
    text: Dividing by $x+1$
  - id: d
    text: Dividing by $x$
  answer:
    choiceId: a
  explanation: 'Standard synthetic division applies to monic linear divisors. A quadratic
    divisor such as $x^2+3$ calls for long division in this course context.


    Related topic: choosing long division vs synthetic division.

    '
- id: q010
  type: symbolicResponse
  prompt: 'Divide and enter the quotient:


    $$

    \frac{4x^3-12x^2+9x}{x}

    $$

    '
  answer:
    expectedLatex: 4x^2-12x+9
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0
  explanation: 'Since every term has a factor of $x$, divide term by term. This is
    the simplest polynomial division case.


    Related topic: monomial division.

    '
