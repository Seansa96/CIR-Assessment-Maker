- id: example-01
  title: Identify from condensed notation
  problem: Analyze CH₃CH₂OCH₃.
  steps:
  - id: step-1
    title: Trace connectivity
    instruction: Mark the directly connected atoms and bond orders.
    type: freeResponse
    prompt: What local bonds should be marked first?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Mark the connected atoms and bond order named in the prompt.
    explanation: 'Solution: Mark the local bonds. Why it works: Connectivity determines the classification.'
  - id: step-2
    title: Classify
    instruction: Name the matching group.
    type: freeResponse
    prompt: What group is supported by that pattern?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - ether
    explanation: 'Solution: ether. Why it works: The oxygen is single-bonded to two carbon-containing groups.'
  - id: step-3
    title: Verify boundary
    instruction: Check competing groups and property assumptions.
    type: freeResponse
    prompt: What boundary check prevents a competing classification?
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Check the neighboring atom and carbonyl boundary.
    explanation: 'Solution: Check the neighboring atom and carbonyl boundary. Why it works: This catches look-alike classifications.'
  media:
  - type: image
    src: /media/chemistry/chem-functional-groups-map.svg
    alt: Original connectivity reference with visible bonds.
    caption: null
