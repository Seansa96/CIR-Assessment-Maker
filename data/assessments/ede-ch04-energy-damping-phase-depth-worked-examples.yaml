workedExamples:
- id: we01
  title: Spring energy
  problem: For $y''+4y=0$, $y(0)=1$, $v(0)=0$.
  steps:
  - id: we01-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Derive the energy.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - potential
      - first integral
    explanation: |-
      Solution: $E=v^2/2+2y^2$ is constant.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Apply initial data.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - constant
      - phase ellipse
    explanation: |-
      Solution: $E=2$, so $v^2+4y^2=4$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Verify turning points.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - turning points
      - boundedness
    explanation: |-
      Solution: At $v=0$, $y=\pm1$; the initial point is one turning point and the motion remains bounded.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Pendulum energy classification
  problem: For $y''+\sin y=0$, start at $y=0$ with speed $v_0$.
  steps:
  - id: we02-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Evaluate initial energy.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - energy
      - initial state
    explanation: |-
      Solution: $E=v_0^2/2$ because $1-\cos0=0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Compare with the barrier.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - barrier
      - threshold
    explanation: |-
      Solution: The upright barrier is $E=2$, so $|v_0|=2$ is the separatrix threshold.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Classify the motion.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - three regimes
      - separatrix
    explanation: |-
      Solution: $|v_0|<2$ oscillates, $|v_0|=2$ approaches an upright equilibrium, and $|v_0|>2$ rotates.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Damped energy audit
  problem: For $y''+0.5y'+y=0$, define $E=(v^2+y^2)/2$.
  steps:
  - id: we03-s1
    title: Model or transform
    instruction: Identify the governing relation and preserve its assumptions.
    type: freeResponse
    prompt: Differentiate along a solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - chain rule
      - system substitution
    explanation: |-
      Solution: $E'=vv'+yy'=v(-0.5v-y)+yv=-0.5v^2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Compute
    instruction: Carry out the indicated recurrence, integration, or algebra in an auditable order.
    type: freeResponse
    prompt: Infer monotonicity.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - sign
      - turning point
    explanation: |-
      Solution: $E'\le0$, with equality only when $v=0$ at that instant.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Verify and interpret
    instruction: Check the result against the equation, data, units, direction, or domain.
    type: freeResponse
    prompt: Interpret the portrait.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - inward motion
      - equilibrium
    explanation: |-
      Solution: No trajectory can move to a higher energy circle; non-equilibrium motion loses amplitude and spirals toward the origin.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
