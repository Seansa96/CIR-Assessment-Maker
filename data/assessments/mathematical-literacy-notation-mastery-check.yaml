questions:
- id: q001
  type: multipleChoice
  prompt: Let $D=\{a\in\mathbb{Z}:a\mid 18\}$. Which claim correctly uses the notation?
  choices:
  - id: a
    text: $-3\in D$ because $18=(-3)(-6)$.
  - id: b
    text: $5\in D$ because $5<18$.
    issueSignals:
    - id: divisibility-order-confused
  - id: c
    text: $18\in D$ only if $18$ is prime.
    issueSignals:
    - id: divisor-definition-misread
  - id: d
    text: $D$ contains fractions whose denominators divide $18$.
    issueSignals:
    - id: divisor-fraction-confused
  answer:
    choiceId: a
  issueSignals:
  - id: divisor-definition-misread
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Applies set-builder notation and the existential factorization definition of divisibility,
    including negative divisors.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $-3\in D$ because $18=(-3)(-6)$ and $-6\in\mathbb{Z}$.

    Why it works: $a\mid18$ means that an integer multiplier $c$ exists with $18=ac$.

    Why the other choices fail: B replaces divisibility with order. C adds an irrelevant primality condition, and
    D mistakes divisors for fractions.'
- id: q002
  type: multipleChoice
  prompt: For $B=\{(r,n):r\in\mathbb{R},\ n\in\mathbb{N}\}$, which object can belong to $B$?
  choices:
  - id: a
    text: $(\pi,4)$
  - id: b
    text: $(4,\pi)$
    issueSignals:
    - id: coordinate-domain-swapped
  - id: c
    text: $\{\pi,4\}$
    issueSignals:
    - id: ordered-pair-set-confused
  - id: d
    text: $(\pi,-4)$
    issueSignals:
    - id: natural-domain-ignored
  answer:
    choiceId: a
  issueSignals:
  - id: coordinate-domain-swapped
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Checks both coordinate order and distinct membership conditions in a Cartesian product.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $(\pi,4)\in B$ because $\pi$ is real and $4$ is natural.

    Why it works: An element of a Cartesian product is an ordered pair whose first and second entries meet the corresponding
    factor conditions.

    Why the other choices fail: B swaps the requirements, C is an unordered set, and D violates the natural-number
    condition.'
- id: q003
  type: multipleChoice
  prompt: Let $A=\{1,2\}$ and $B=\{1,2,3\}$. What directly establishes $A\subseteq B$?
  choices:
  - id: a
    text: Every element of $A$—namely $1$ and $2$—is an element of $B$.
  - id: b
    text: $B$ has more elements than $A$.
    issueSignals:
    - id: cardinality-for-membership-substituted
  - id: c
    text: $A$ and $B$ share the element $1$.
    issueSignals:
    - id: overlap-for-containment-substituted
  - id: d
    text: $A$ is written before $B$.
    issueSignals:
    - id: notation-order-misread
  answer:
    choiceId: a
  issueSignals:
  - id: overlap-for-containment-substituted
  difficultyDimensions:
  - definitionApplication
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Requires using the universal membership condition for subset rather than a size or overlap
    heuristic.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: Verify that every element of $A$ belongs to $B$.

    Why it works: The definition of $A\subseteq B$ is precisely the universal membership condition.

    Why the other choices fail: B is not sufficient for containment, C gives only one shared element, and D has
    no mathematical consequence.'
- id: q004
  type: multipleChoice
  prompt: Which statement about the empty set is always true?
  choices:
  - id: a
    text: $\varnothing\subseteq C$ for every set $C$.
  - id: b
    text: $\varnothing\in C$ for every set $C$.
    issueSignals:
    - id: subset-membership-confused
  - id: c
    text: $|\varnothing|=1$ because its symbol is written once.
    issueSignals:
    - id: notation-for-cardinality-confused
  - id: d
    text: $\varnothing=C$ whenever $C$ has no named elements.
    issueSignals:
    - id: empty-description-overgeneralized
  answer:
    choiceId: a
  issueSignals:
  - id: subset-membership-confused
  difficultyDimensions:
  - definitionApplication
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Applies the universal subset definition to the boundary case with no counterexample candidate.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $\varnothing\subseteq C$ for every set $C$.

    Why it works: There is no element of the empty set that could fail to be in $C$, so the required universal condition
    holds.

    Why the other choices fail: B confuses subset with membership. C miscounts elements, and D incorrectly equates
    every set with an unnamed description to the empty set.'
- id: q005
  type: multipleChoice
  prompt: Let $E=\{2n:n\in\mathbb Z\}$. Which claim is justified directly from this set-builder description?
  choices:
  - id: a
    text: $-8\in E$ because $-8=2(-4)$ and $-4\in\mathbb Z$.
  - id: b
    text: $-8\notin E$ because E contains only positive even integers.
    issueSignals:
    - id: domain-restricted-without-basis
  - id: c
    text: $-8\in E$ because every negative integer is even.
    issueSignals:
    - id: integer-parity-overgeneralized
  - id: d
    text: $-8\in E$ because $-8$ is an integer, regardless of the expression $2n$.
    issueSignals:
    - id: set-builder-rule-ignored
  answer:
    choiceId: a
  issueSignals:
  - id: set-builder-rule-ignored
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Interprets both the generating expression and the integer restriction, then distinguishes
    a valid witness from two overbroad readings.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $-8\in E$ because $-8=2(-4)$ for the integer $-4$.

    Why it works: The set contains exactly values obtainable as twice an integer; negative integers are allowed
    by the stated domain.

    Why the other choices fail: B invents a positivity restriction, C mistakes one parity example for a universal
    claim, and D ignores the rule after the colon.'
- id: q006
  type: multipleChoice
  prompt: 'A text uses $|X|$ twice: once with $X=\{-2,0,5\}$ and once with $X=-5$. What do the two expressions mean?'
  choices:
  - id: a
    text: The first is the cardinality 3; the second is the absolute value 5.
  - id: b
    text: Both are absolute values because vertical bars always mean distance from zero.
    issueSignals:
    - id: cardinality-absolute-value-confused
  - id: c
    text: Both are cardinalities because X is written with the same letter.
    issueSignals:
    - id: notation-context-ignored
  - id: d
    text: The first is 5 and the second is 1 because each bar pair counts symbols.
    issueSignals:
    - id: delimiter-counting-error
  answer:
    choiceId: a
  issueSignals:
  - id: cardinality-absolute-value-confused
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Requires using the type of the enclosed object, rather than the glyph alone, to select the
    meaning of vertical bars.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $|\{-2,0,5\}|=3$ and $|-5|=5$.

    Why it works: Vertical bars give cardinality for a set and absolute value for a number.

    Why the other choices fail: B and C force one meaning in both contexts, while D treats notation marks as mathematical
    data.'
- id: q007
  type: multipleChoice
  prompt: Which object has the correct shape to be an element of $\mathbb R\times(\mathbb N\times\mathbb Z)$?
  choices:
  - id: a
    text: $(2.5,(3,-1))$
  - id: b
    text: $((2.5,3),-1)$
    issueSignals:
    - id: product-grouping-reversed
  - id: c
    text: $(2.5,3,-1)$
    issueSignals:
    - id: nested-pair-triple-confused
  - id: d
    text: $(2.5,(-1,3))$
    issueSignals:
    - id: coordinate-domain-swapped
  answer:
    choiceId: a
  issueSignals:
  - id: product-grouping-reversed
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - structuralRecognition
  difficultyEvidence: Tracks the outer product, the nested second coordinate, and the separate natural and integer
    requirements.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $(2.5,(3,-1))$ has a real first coordinate and an inner pair in $\mathbb N\times\mathbb
    Z$.

    Why it works: Parentheses make the second component one ordered pair, not two ungrouped coordinates.

    Why the other choices fail: B reverses the nesting, C is a triple, and D puts a negative integer in the natural-number
    position.'
- id: q008
  type: multipleChoice
  prompt: Let $A=\{\varnothing\}$ and $B=\varnothing$. Which comparison is correct?
  choices:
  - id: a
    text: $A\ne B$ because A has one element and B has none.
  - id: b
    text: $A=B$ because both expressions display the empty-set symbol.
    issueSignals:
    - id: empty-set-singleton-confused
  - id: c
    text: $A\subseteq B$ because every set containing $\varnothing$ is empty.
    issueSignals:
    - id: subset-membership-confused
  - id: d
    text: $B\in A$ is false because the empty set cannot be an element of any set.
    issueSignals:
    - id: empty-set-membership-denied
  answer:
    choiceId: a
  issueSignals:
  - id: empty-set-singleton-confused
  difficultyDimensions:
  - definitionApplication
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Separates a set with no elements from a singleton whose one element is itself the empty set.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $A\ne B$ because $|A|=1$ whereas $|B|=0$.

    Why it works: Braces create a set containing the displayed object; they do not merely repeat its notation.

    Why the other choices fail: B erases the braces'' role, C asserts a false containment rule, and D overlooks
    that $\varnothing$ is exactly A''s element.'
- id: q009
  type: multipleChoice
  prompt: Let $A=\{1,\{2\}\}$ and $B=\{1,2\}$. Which statement identifies a genuine difference?
  choices:
  - id: a
    text: $2\in B$, but $2\notin A$; instead $\{2\}\in A$.
  - id: b
    text: $2\in A$ because a set automatically contains the elements of each member set.
    issueSignals:
    - id: nested-membership-flattened
  - id: c
    text: $A=B$ because the braces around 2 are only punctuation.
    issueSignals:
    - id: nested-set-notation-ignored
  - id: d
    text: $\{2\}\notin A$ because sets cannot be elements of sets.
    issueSignals:
    - id: set-as-element-denied
  answer:
    choiceId: a
  issueSignals:
  - id: nested-membership-flattened
  difficultyDimensions:
  - representationTransfer
  - structuralRecognition
  - errorDiagnosis
  difficultyEvidence: Requires reading a nested object as one element and rejecting an unjustified flattening operation.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $2$ belongs to B, while A contains the set $\{2\}$ rather than the number 2.

    Why it works: Elements are the objects listed at the outermost brace level.

    Why the other choices fail: B and C flatten a nested set, and D rejects a permitted type of set element.'
- id: q010
  type: multipleChoice
  prompt: For $C=\{x\in\mathbb Z:x^2<9\}$, which claim is true?
  choices:
  - id: a
    text: $-2\in C$ because $(-2)^2=4<9$.
  - id: b
    text: $3\in C$ because $3^2=9$ is no greater than 9.
    issueSignals:
    - id: strict-inequality-weakened
  - id: c
    text: $\frac12\in C$ because its square is less than 9.
    issueSignals:
    - id: domain-condition-ignored
  - id: d
    text: $-4\in C$ because negative integers always satisfy a square restriction.
    issueSignals:
    - id: sign-before-squaring-error
  answer:
    choiceId: a
  issueSignals:
  - id: domain-condition-ignored
  difficultyDimensions:
  - representationTransfer
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Applies both the integer domain and a strict square inequality while diagnosing boundary and
    sign errors.
  prerequisiteObjectiveIds:
  - ml-notation-02
  explanation: 'Solution: $-2\in C$ because it is an integer and its square is 4.

    Why it works: Membership requires satisfying every part of the set-builder rule.

    Why the other choices fail: B changes $<$ to $\le$, C ignores the integer domain, and D incorrectly assumes
    a negative input makes its square small.'
