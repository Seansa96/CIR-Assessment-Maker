  prompt: A wave on a stretched string has wavelength 18.21 m and frequency 82.8 Hz.
    What is the wave speed in m/s?
  answer:
    value: 1507.788
    tolerance: 0.05
  explanation: v = lambda * f = 18.21 * 82.8 = 1507.79 m/s.
