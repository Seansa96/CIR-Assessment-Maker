questions:
- id: q001
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: Use the Wave Speed on a Stretched String diagram and the model $v=\sqrt{T/\mu}$. A calibrated
    scenario scales the reference values by 1.1. Determine the string-wave speed. Give a numerical answer.
  answer:
    value: 13.2
    tolerance: 0.132
  explanation: Apply $v=\sqrt{T/\mu}$ consistently to the scaled scenario; the requested string-wave speed
    is 13.2.
  media:
