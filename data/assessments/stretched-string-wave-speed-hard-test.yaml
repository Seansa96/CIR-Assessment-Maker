- id: q001
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: A seismic surface wave has a characteristic wavelength of 1.4 m and vibrates
    at 79.8 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 501.3982
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*79.8 = 501.3982 rad/s.
- id: q002
  type: numericResponse
