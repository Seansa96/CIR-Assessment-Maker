questions:
- prompt: A painting hangs from a wire. If the wire is made more tightly horizontal
    (angle with horizontal decreases), what happens to the tension?
  type: multipleChoice
  choices:
  - id: a
    text: The tension increases
  - id: b
    text: The tension decreases
  - id: c
    text: The tension stays the same
  answer:
    choiceId: a
  explanation: Since $2T\sin\theta = mg$, as $\theta$ approaches zero, $\sin\theta$
    gets very small, making $T$ very large.
