questions:
- id: physics-static-structures-mastery-q001
  type: numericResponse
  prompt: A 4.0 m horizontal beam is hinged at the left. A 200 N load hangs 3.0 m from the hinge. A vertical support acts at the right end. Ignore beam weight. Find the support force in N.
  answer: { value: 150, tolerance: 0.3 }
  explanation: |
    Solution: $S(4.0)-200(3.0)=0$, so $S=150$ N.

    Why it works: Taking torques about the hinge removes the unknown hinge forces.
  difficultyDimensions: [modelOrDerivation, simplification]
  difficultyEvidence: A rigid-body torque balance determines a support force.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-static-structures-mastery-q001
- id: physics-static-structures-mastery-q002
  type: multipleChoice
  prompt: A beam has zero net vertical force but a nonzero net torque. Which conclusion is correct?
  choices: [{ id: a, text: It can still rotate and is not in static equilibrium. }, { id: b, text: It is in static equilibrium because force balance is enough. }, { id: c, text: All its forces must be zero. }]
  answer: { choiceId: a }
  explanation: |
    Solution: It can still rotate and is not in static equilibrium.

    Why it works: Static equilibrium of a rigid body requires both net force and net torque to be zero.

    Why the other choices fail: Force balance alone does not prevent rotation, and nonzero balanced forces are allowed.
  difficultyDimensions: [errorDiagnosis, modelOrDerivation, representationTransfer]
  difficultyEvidence: A force-only equilibrium claim is tested against rigid-body conditions.
  prerequisiteObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-static-structures-mastery-q002
- id: physics-static-structures-mastery-q003
  type: numericResponse
  prompt: In q001, what vertical hinge force in N is required, with upward positive?
  answer: { value: 50, tolerance: 0.3 }
  explanation: |
    Solution: $H_y+150-200=0$, so $H_y=50$ N.

    Why it works: After torque balance fixes the right support, vertical force balance fixes the hinge reaction.
  difficultyDimensions: [modelOrDerivation, reverseReasoning, representationTransfer]
  difficultyEvidence: The support force from torque balance is transferred into a vertical force equation.
  prerequisiteObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-static-structures-mastery-q003
- id: physics-static-structures-mastery-q004
  type: multipleChoice
  prompt: Two equal forces act on a beam. Which produces the larger torque about a pivot?
  choices: [{ id: a, text: The force with the larger perpendicular lever arm. }, { id: b, text: The force applied closest to the pivot regardless of angle. }, { id: c, text: Both always produce equal torque. }]
  answer: { choiceId: a }
  explanation: |
    Solution: The force with the larger perpendicular lever arm produces the larger torque.

    Why it works: Torque magnitude is force times perpendicular distance from the pivot to the force line.

    Why the other choices fail: Application-point distance alone is not the lever arm, and equal forces can have different lever arms.
  difficultyDimensions: [representationTransfer, modelOrDerivation, errorDiagnosis]
  difficultyEvidence: The learner distinguishes perpendicular lever arm from superficial point distance.
  prerequisiteObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-static-structures-mastery-q004


