- prompt: A 22 kg sign is supported by two cables making symmetric angles of $45^\circ$
    with the horizontal. What is the tension in one of the cables? Use $g = 9.8\text{
    m/s}^2$.
  type: numericResponse
  answer:
    value: 152.45368406166034
    tolerance: 1.0
  explanation: $2T\sin(45^\circ) = mg \implies T = \frac{mg}{2\sin(45^\circ)} = \frac{215.60000000000002}{1.414}
    = 152.5$ N.
