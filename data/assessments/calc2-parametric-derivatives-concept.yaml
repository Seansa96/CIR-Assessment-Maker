lesson:
  introduction: To find slopes of tangent lines to parametric curves, we can use the
    Chain Rule rather than converting the curve to Cartesian form first.
  sections:
  - id: intro-param-deriv
    title: The First Derivative
    content: |-
      When dealing with parametric curves, the slope of the tangent line $\frac{dy}{dx}$ is found using the rates of change of x and y with respect to t.

      ![Parametric Tangent](/assessments/calc2-parametric-polar/parametric_tangent_demo.svg)
    check:
      id: intro-param-deriv-check
      type: multipleChoice
      prompt: |-
        Given $x=f(t)$ and $y=g(t)$, what is the correct formula for the slope $\frac{dy}{dx}$?
      choices:
      - id: a
        text: |-
          $\frac{dy}{dx} = \frac{dx/dt}{dy/dt}$
      - id: b
        text: |-
          $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$
      - id: c
        text: |-
          $\frac{dy}{dx} = \frac{dy}{dt} \cdot \frac{dx}{dt}$
      answer:
        choiceId: b
      explanation: |-
        By the chain rule, $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$ provided $\frac{dx}{dt} \neq 0$.
