lesson:
  introduction: To find slopes of tangent lines to parametric curves, we can use the
    Chain Rule rather than converting the curve to Cartesian form first.
  sections:
  - id: intro-param-deriv
    title: The First Derivative
    content: 'When dealing with parametric curves, the slope of the tangent line $\frac{dy}{dx}$
      is found using the rates of change of x and y with respect to t.


      ![Parametric Tangent](/assessments/calc2-parametric-polar/parametric_tangent_demo.svg)'
    check:
      id: intro-param-deriv-check
      type: multipleChoice
      prompt: Given $x=f(t)$ and $y=g(t)$, what is the correct formula for the slope
        $\frac{dy}{dx}$?
      choices:
      - id: a
        text: $\frac{dy}{dx} = \frac{dx/dt}{dy/dt}$
      - id: b
        text: $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$
      - id: c
        text: $\frac{dy}{dx} = \frac{dy}{dt} \cdot \frac{dx}{dt}$
      answer:
        choiceId: b
      explanation: By the chain rule, $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$ provided
        $\frac{dx}{dt} \neq 0$.
  - id: second-deriv-pitfall
    title: 'Pitfall: The Second Derivative'
    content: 'To find $\frac{dy}{dx}$, we use $\frac{dy/dt}{dx/dt}$.


      A very common mistake is assuming the second derivative $\frac{d^2y}{dx^2}$
      is just the derivative of $\frac{dy}{dx}$ with respect to $t$. **It is not!**


      $\frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{\frac{dx}{dt}}$


      You MUST divide by $\frac{dx}{dt}$ again!'
    check:
      id: second-deriv-check
      type: multipleChoice
      prompt: Why do we divide by $\frac{dx}{dt}$ when calculating the second derivative?
      choices:
      - id: a
        text: To apply the chain rule, since we are differentiating with respect to
          $x$, not $t$.
      - id: b
        text: To cancel out the $t$ variables.
      - id: c
        text: Because acceleration is always divided by velocity.
      answer:
        choiceId: a
      explanation: By the chain rule, $\frac{d}{dx} = \frac{d}{dt} \cdot \frac{dt}{dx}
        = \frac{d}{dt} \cdot \frac{1}{dx/dt}$.
