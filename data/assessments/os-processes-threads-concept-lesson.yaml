lesson:
  introduction: 'This lesson introduces Processes and Threads through the mental models emphasized by 2 Processes and Threads.
    Focus on what the OS is protecting, sharing, scheduling, translating, or abstracting.

    '
  sections:
  - id: process-model
    title: Process model
    required: true
    content: 'A process is an executing program with registers, memory context, open resources, and scheduling state.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      The program file and the running process are different objects.

      '
    check:
      id: process-model-check
      title: 'Check: Process model'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Process model**?

        '
      choices:
      - id: a
        text: A process is an executing program with registers, memory context, open resources, and scheduling state.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'A process is an executing program with registers, memory context, open resources, and scheduling state.
        Related topic: Processes and Threads.

        '
  - id: process-states
    title: Process states
    required: true
    content: 'Processes move among running, ready, and blocked states depending on CPU availability and waiting conditions.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Blocked means waiting for an event, not merely waiting for CPU time.

      '
    check:
      id: process-states-check
      title: 'Check: Process states'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Process states**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Processes move among running, ready, and blocked states depending on CPU availability and waiting conditions.
      answer:
        choiceId: d
      explanation: 'Processes move among running, ready, and blocked states depending on CPU availability and waiting conditions.
        Related topic: Processes and Threads.

        '
  - id: process-creation
    title: Process creation
    required: true
    content: 'Operating systems create new execution contexts through controlled mechanisms that assign identifiers and resources.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Creation is not just loading bytes; it establishes management state.

      '
    check:
      id: process-creation-check
      title: 'Check: Process creation'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Process creation**?

        '
      choices:
      - id: a
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: Operating systems create new execution contexts through controlled mechanisms that assign identifiers and resources.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: c
      explanation: 'Operating systems create new execution contexts through controlled mechanisms that assign identifiers
        and resources. Related topic: Processes and Threads.

        '
  - id: thread-model
    title: Thread model
    required: true
    content: 'Threads share a process address space but have their own program counters, stacks, and scheduling state.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Threads share memory, so they reduce isolation while enabling cheaper concurrency.

      '
    check:
      id: thread-model-check
      title: 'Check: Thread model'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Thread model**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: Threads share a process address space but have their own program counters, stacks, and scheduling state.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      answer:
        choiceId: b
      explanation: 'Threads share a process address space but have their own program counters, stacks, and scheduling state.
        Related topic: Processes and Threads.

        '
  - id: user-versus-kernel-threads
    title: User versus kernel threads
    required: true
    content: 'User-level threads can be fast to manage, while kernel-level threads give the OS direct scheduling awareness.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Neither implementation is universally best.

      '
    check:
      id: user-versus-kernel-threads-check
      title: 'Check: User versus kernel threads'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **User versus kernel threads**?

        '
      choices:
      - id: a
        text: User-level threads can be fast to manage, while kernel-level threads give the OS direct scheduling awareness.
      - id: b
        text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
      - id: c
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: d
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      answer:
        choiceId: a
      explanation: 'User-level threads can be fast to manage, while kernel-level threads give the OS direct scheduling awareness.
        Related topic: Processes and Threads.

        '
  - id: thread-safety
    title: Thread safety
    required: true
    content: 'Single-threaded assumptions often fail when shared data can be accessed concurrently.


      A useful question to ask is: what resource, boundary, or policy decision is being controlled here? Common confusion:
      Adding threads without redesigning shared state creates subtle bugs.

      '
    check:
      id: thread-safety-check
      title: 'Check: Thread safety'
      type: multipleChoice
      prompt: 'Which statement best captures the OS idea of **Thread safety**?

        '
      choices:
      - id: a
        text: It is handled entirely by application code without kernel or operating-system involvement.
      - id: b
        text: It can always be solved by adding faster hardware rather than changing operating-system design.
      - id: c
        text: It removes the need for explicit policies, permissions, or resource-management decisions.
      - id: d
        text: Single-threaded assumptions often fail when shared data can be accessed concurrently.
      answer:
        choiceId: d
      explanation: 'Single-threaded assumptions often fail when shared data can be accessed concurrently. Related topic: Processes
        and Threads.

        '
