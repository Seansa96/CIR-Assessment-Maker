schemaVersion: 1
id: physics-torque-test-hard
title: 'Test (Hard): Torque'
description: Rigorous exam covering Torque.
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-torque
modeDefault: exam
randomizeQuestions: true
questions:
- id: q1
  type: numericResponse
  prompt: A mechanic applies a $100 \text{ N}$ force at an angle of $30^\circ$ to
    the handle of a $0.5 \text{ m}$ wrench. What is the magnitude of the torque generated?
  answer:
    value: 25.0
    tolerance: 0.5
  explanation: $\tau = rF\sin(\theta) = 0.5(100)\sin(30^\circ) = 0.5(100)(0.5) = 25
    \text{ N}\cdot\text{m}$.
