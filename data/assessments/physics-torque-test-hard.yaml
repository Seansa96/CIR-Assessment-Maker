modeDefault: exam
randomizeQuestions: true
questions:
- id: q001
  title: Angled cable balance
  type: numericResponse
  prompt: |-
    A $120\text{ N}$ load is $2.0\text{ m}$ from a pivot. A cable $3.0\text{ m}$ from the pivot makes $40^\circ$ with the beam. What tension balances it?
  answer:
    value: 124.4
    tolerance: 1.0
  explanation: |-
    $T(3)\sin40^\circ=120(2)$, so $T\approx124\text{ N}$.
- id: q002
  title: Angular acceleration
  type: numericResponse
  prompt: |-
    A wheel with $I=2.5$ has net torque $15\text{ N}\cdot\text{m}$. What is $\alpha$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |-
    $\alpha=\tau/I=15/2.5=6.0\text{ rad/s}^2$.
- id: q003
  title: Torque components
  type: numericResponse
  prompt: |-
    A force has $F_x=30\text{ N}$ and $F_y=40\text{ N}$ at $(0.20,0.50)\text{ m}$. What is $\tau_z=xF_y-yF_x$?
  answer:
    value: -7.0
    tolerance: 0.1
  explanation: |-
    $\tau_z=0.20(40)-0.50(30)=-7\text{ N}\cdot\text{m}$.
- id: q004
  title: Line of action trap
  type: multipleChoice
  prompt: |-
    A large force can produce little or no torque if:
  choices:
  - id: a
    text: |-
      its line of action passes close to or through the pivot
  - id: b
    text: |-
      it is measured in Newtons
  - id: c
    text: |-
      the object has mass
  - id: d
    text: |-
      the pivot is named
  answer:
    choiceId: a
  explanation: |-
    Torque depends on perpendicular lever arm.
- id: q005
  title: Opposing torques
  type: numericResponse
  prompt: |-
    A pulley with $I=0.80$ has $12\text{ N}$ at $0.30\text{ m}$ and opposing $5\text{ N}$ at $0.20\text{ m}$. What is $\alpha$?
  answer:
    value: 3.25
    tolerance: 0.05
  explanation: |-
    Net torque $=3.6-1.0=2.6$, so $\alpha=2.6/0.80=3.25$.
- id: q006
  title: Find angle
  type: numericResponse
  prompt: |-
    A $50\text{ N}$ force at $0.40\text{ m}$ produces $10\text{ N}\cdot\text{m}$. What is the smaller angle?
  answer:
    value: 30.0
    tolerance: 0.2
  explanation: |-
    $10=20\sin\theta$, so $\theta=30^\circ$.
- id: q007
  title: Uniform beam support
  type: numericResponse
  prompt: |-
    A $4.0\text{ m}$ uniform beam weighs $200\text{ N}$ and is supported by a right-end vertical cable. What is cable tension?
  answer:
    value: 100.0
    tolerance: 0.5
  explanation: |-
    $T(4.0)=200(2.0)$, so $T=100\text{ N}$.
- id: q008
  title: Pivot choice
  type: multipleChoice
  prompt: |-
    Why choose a pivot at an unknown force?
  choices:
  - id: a
    text: |-
      That force has zero torque and drops out.
  - id: b
    text: |-
      It makes all forces zero.
  - id: c
    text: |-
      It changes weight.
  - id: d
    text: |-
      It removes units.
  answer:
    choiceId: a
  explanation: |-
    Forces at the pivot have zero lever arm.
- id: q009
  title: Signed torque
  type: numericResponse
  prompt: |-
    A force $F_y=20\text{ N}$ is applied at $x=-0.30\text{ m}$. What is $\tau_z$?
  answer:
    value: -6.0
    tolerance: 0.1
  explanation: |-
    $\tau_z=xF_y=-0.30(20)=-6$.
- id: q010
  title: Required angled force
  type: numericResponse
  prompt: |-
    You need $36\text{ N}\cdot\text{m}$ at $0.90\text{ m}$ with force $60^\circ$ to the handle. What force is required?
  answer:
    value: 46.19
    tolerance: 0.3
  explanation: |-
    $F=36/(0.90\sin60^\circ)=46.2\text{ N}$.
- id: q011
  title: Torque direction
  type: multipleChoice
  prompt: |-
    If net torque is clockwise, angular acceleration is:
  choices:
  - id: a
    text: |-
      clockwise under the same sign convention
  - id: b
    text: |-
      always counterclockwise
  - id: c
    text: |-
      zero
  - id: d
    text: |-
      unrelated
  answer:
    choiceId: a
  explanation: |-
    $\tau_{net}=I\alpha$ gives the angular acceleration direction.
- id: q012
  title: Disk forces
  type: numericResponse
  prompt: |-
    A disk has $18\text{ N}$ at $0.20\text{ m}$ CCW and $10\text{ N}$ at $0.30\text{ m}$ CW. What is net torque?
  answer:
    value: 0.6
    tolerance: 0.05
  explanation: |-
    $18(0.20)-10(0.30)=0.60\text{ N}\cdot\text{m}$.
- id: q013
  title: Rod weight torque
  type: numericResponse
  prompt: |-
    A uniform $30\text{ N}$ rod of length $1.2\text{ m}$ is horizontal from a hinge. What torque does its weight exert?
  answer:
    value: 18.0
    tolerance: 0.2
  explanation: |-
    Weight acts at center: $\tau=30(0.60)=18$.
- id: q014
  title: Static equilibrium
  type: multipleChoice
  prompt: |-
    A rigid body in static equilibrium must satisfy:
  choices:
  - id: a
    text: |-
      $\sum F=0$ and $\sum\tau=0$
  - id: b
    text: |-
      $\sum F=ma$ only
  - id: c
    text: |-
      $\sum\tau=I\omega$ only
  - id: d
    text: |-
      $K_{rot}=0$ always
  answer:
    choiceId: a
  explanation: |-
    No translational or angular acceleration means both sums vanish.
- id: q015
  title: Perpendicular distance
  type: numericResponse
  prompt: |-
    A $75\text{ N}$ force has a line of action $0.18\text{ m}$ from the pivot. What is torque magnitude?
  answer:
    value: 13.5
    tolerance: 0.1
  explanation: |-
    $\tau=F r_\perp=75(0.18)=13.5$.
