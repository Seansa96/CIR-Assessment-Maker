lesson:
  introduction: 'A chemical equation is a symbolic representation of a chemical reaction.
    It shows which substances react (reactants) and what is formed (products), along
    with the proportions in which they react. Before any quantitative analysis can
    be done, the equation must be balanced — meaning the same number of each type
    of atom must appear on both sides.

    '
  sections:
  - id: anatomy-of-equation
    title: Anatomy of a Chemical Equation
    required: true
    content: '**General form:**

      $$

      \text{Reactants} \rightarrow \text{Products}

      $$


      **State symbols** written in parentheses after each formula:

      - (s) = solid

      - (l) = liquid

      - (g) = gas

      - (aq) = aqueous (dissolved in water)


      **Arrow types:**

      - → = reaction proceeds in one direction

      - ⇌ = reversible reaction (equilibrium)

      - Δ above the arrow = heat is applied


      **Coefficients** (the numbers in front of formulas): indicate the molar ratios
      in which substances react and are produced.


      **Example — Combustion of methane:**

      $$

      \text{CH}_4(g) + 2\text{O}_2(g) \rightarrow \text{CO}_2(g) + 2\text{H}_2\text{O}(g)

      $$


      This reads: "1 mol of methane reacts with 2 mol of oxygen to produce 1 mol of
      CO2 and 2 mol of water vapor."

      '
    check:
      id: anatomy-check
      type: multipleChoice
      prompt: 'In the equation N2(g) + 3H2(g) → 2NH3(g), what does the coefficient
        3 in front of H2 represent?

        '
      choices:
      - id: a
        text: 3 moles of H2 are consumed for every mole of N2.
      - id: b
        text: 3 atoms of H are consumed total.
      - id: c
        text: H2 reacts 3 times slower than N2.
      - id: d
        text: The reaction requires 3 degrees of heat.
      answer:

        choiceId: a
      explanation: 'Coefficients represent molar ratios. 3 mol H2 are required for
        every 1 mol N2 consumed, and 2 mol NH3 are produced.

        '
  - id: conservation-of-atoms
    title: The Law of Conservation of Atoms
    required: true
    content: 'A balanced equation obeys the **Law of Conservation of Mass**: atoms
      are neither created nor destroyed in a chemical reaction — they are rearranged.


      **Critical rule:** When balancing, you may **only change the coefficients**,
      never the subscripts.


      - Changing subscripts changes the identity of the substance (H2O → H2O2 — completely
      different compound!).

      - Changing coefficients only changes the quantity.


      **Verification:** Count atoms on each side for every element. If the counts
      match, the equation is balanced.

      '
    check:
      id: conservation-atoms-check
      type: multipleChoice
      prompt: 'A student "balances" H2 + O → H2O by changing O to O2 in the reactant.
        What is wrong with this approach?

        '
      choices:
      - id: a
        text: Changing the subscript changes the substance from O atoms to O2 molecules
          — that is not allowed.
      - id: b
        text: The student should have added a coefficient, not changed a subscript.
      - id: c
        text: Both (a) and (b) are correct issues with this approach.
      - id: d
        text: Nothing — this is a valid balancing step.
      answer:

        choiceId: c
      explanation: 'Changing "O" to "O2" changes the substance from oxygen atoms to
        oxygen molecules — that is a different chemical species. The correct approach
        is to use coefficients: 2H2 + O2 → 2H2O. Both problems are real issues with
        the student''s approach.

        '
  - id: balancing-by-inspection
    title: Balancing by Inspection
    required: true
    content: '**General strategy for balancing by inspection:**


      1. Start with the most complex molecule (most elements or heaviest compound).

      2. Balance atoms that appear in only one reactant and one product first.

      3. Balance polyatomic ions as a unit if they appear unchanged on both sides.

      4. Balance hydrogen last (it appears in many compounds).

      5. Balance oxygen last (same reason).

      6. Use fractions if needed — then clear them by multiplying through by an integer.


      **Example — Fe + O2 → Fe2O3 (rust):**


      Step 1: Balance Fe — Fe2O3 has 2 Fe, so put 2 in front of Fe on the left:

      $2\text{Fe} + \text{O}_2 \rightarrow \text{Fe}_2\text{O}_3$


      Step 2: Balance O — 3 oxygen on right, so need 3/2 O2 on left:

      $2\text{Fe} + \frac{3}{2}\text{O}_2 \rightarrow \text{Fe}_2\text{O}_3$


      Step 3: Clear the fraction — multiply everything by 2:

      $$

      4\text{Fe}(s) + 3\text{O}_2(g) \rightarrow 2\text{Fe}_2\text{O}_3(s)

      $$


      **Verify:** Left: 4 Fe, 6 O. Right: 4 Fe, 6 O. ✓

      '
    check:
      id: balancing-check
      type: multipleChoice
      prompt: 'What are the correct coefficients (in order) to balance:

        _Al + _O2 → _Al2O3?

        '
      choices:
      - id: a
        text: 4, 3, 2
      - id: b
        text: 2, 3, 1
      - id: c
        text: 1, 1, 1
      - id: d
        text: 2, 1, 2
      answer:

        choiceId: a
      explanation: '4Al + 3O2 → 2Al2O3. Left: 4 Al, 6 O. Right: 4 Al (in 2×Al2O3),
        6 O (in 2×3 O per molecule). ✓

        '
