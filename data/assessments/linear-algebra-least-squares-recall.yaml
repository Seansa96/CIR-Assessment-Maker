schemaVersion: 1
id: linear-algebra-least-squares-recall
title: Least Squares and Approximations Recall Drill
assessmentType: recallDrill
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-least-squares
modeDefault: practice
randomizeQuestions: true
skills:
  - least-squares
  - normal-equations
items:
  - id: r-ls-def
    type: flashcard
    prompt: |
      What defines a least-squares solution $\hat{\vec{x}}$ to the system $A\vec{x} = \vec{b}$?
    answer:
      expected: |
        An $\hat{\vec{x}}$ such that $\|A\hat{\vec{x}} - \vec{b}\| \leq \|A\vec{x} - \vec{b}\|$ for all $\vec{x}$ in $\mathbb{R}^n$. It minimizes the distance between $A\vec{x}$ and $\vec{b}$.

  - id: r-ls-geometry
    type: flashcard
    prompt: |
      Geometrically, what is the vector $A\hat{\vec{x}}$ in a least-squares problem?
    answer:
      expected: |
        It is the orthogonal projection of $\vec{b}$ onto the column space of $A$, denoted $\hat{\vec{b}} = \text{proj}_{\text{Col}(A)}\vec{b}$.

  - id: r-normal-eq
    type: flashcard
    prompt: |
      State the normal equations for the system $A\vec{x} = \vec{b}$.
    answer:
      expected: '$A^TA\hat{\vec{x}} = A^T\vec{b}$'

  - id: r-residual-orthogonality
    type: cloze
    prompt: |
      The residual vector $\vec{b} - A\hat{\vec{x}}$ is orthogonal to every vector in the {{column space}} of $A$.
    answer:
      expected: 'column space'

  - id: r-ata-invertible
    type: flashcard
    prompt: |
      Under what condition is the matrix $A^TA$ invertible, guaranteeing a unique least-squares solution?
    answer:
      expected: 'When the columns of $A$ are linearly independent.'

  - id: r-unique-ls-formula
    type: flashcard
    prompt: |
      If $A^TA$ is invertible, what is the explicit formula for the least-squares solution $\hat{\vec{x}}$?
    answer:
      expected: '$\hat{\vec{x}} = (A^TA)^{-1}A^T\vec{b}$'

  - id: r-ls-error
    type: flashcard
    prompt: |
      What is the "least-squares error"?
    answer:
      expected: |
        The distance from $\vec{b}$ to the projected point $A\hat{\vec{x}}$. It is given by the norm of the residual: $\|\vec{b} - A\hat{\vec{x}}\|$.
