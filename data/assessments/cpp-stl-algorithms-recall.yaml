schemaVersion: 1
id: cpp-stl-algorithms-recall
title: C++ STL Algorithms Recall
assessmentType: recallDrill
categoryId: c++
subcategoryId: c++-standard-library
subcategoryIds:
  - c++-standard-library
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: 'Which standard algorithm orders elements in ascending order by default?'
    answer:
      expected: sort
      aliases:
        - std::sort
  - id: r002
    type: typed
    prompt: 'Which standard algorithm searches a range for a specific value?'
    answer:
      expected: find
      aliases:
        - std::find
  - id: r003
    type: typed
    prompt: 'Which standard algorithm searches a range using a custom condition (predicate)?'
    answer:
      expected: find_if
      aliases:
        - std::find_if
  - id: r004
    type: typed
    prompt: 'Which standard algorithm applies an operation to elements and outputs them to a destination?'
    answer:
      expected: transform
      aliases:
        - std::transform
  - id: r005
    type: flashcard
    prompt: 'What value does `std::find` return if it cannot locate the requested element?'
    answer:
      expected: The end iterator of the range (e.g., `container.end()`).


