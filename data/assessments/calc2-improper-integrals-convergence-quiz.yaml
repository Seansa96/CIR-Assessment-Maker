questions:
- id: q001
  type: freeResponse
  prompt: 'Determine whether the integral converges or diverges and explain why:


    $$

    \int_1^\infty \frac{1}{x^3}\,dx

    $$

    '
  answer:
    expected: 'Converges by the infinite-tail p-test because p=3>1.

      '
    gradingMode: selfCheck
    keyPoints:
    - Recognize Type 1 infinite interval.
    - Use the p-test at infinity.
    - State that p=3 is greater than 1.
  explanation: 'This is Type 1 because of the infinite upper limit. The technique
    is the infinite-tail $p$-test:


    $$

    \int_1^\infty \frac{1}{x^p}\,dx

    $$


    converges when $p>1$. Here $p=3$, so the integral converges.


    Related topic: Type 1 improper integral and $p$-test at infinity.

    '
- id: q002
  type: freeResponse
  prompt: 'Determine whether the integral converges or diverges and explain why:


    $$

    \int_1^\infty \frac{1}{x}\,dx

    $$

    '
  answer:
    expected: 'Diverges by the infinite-tail p-test because p=1 is the divergent boundary
      case.

      '
    gradingMode: selfCheck
    keyPoints:
    - Recognize the harmonic tail.
    - State p=1.
    - p=1 diverges at infinity.
  explanation: 'This is the boundary case for the infinite-tail $p$-test. Since $p=1$,
    the integral diverges.


    Related topic: harmonic improper integral.

    '
- id: q003
  type: multipleChoice
  prompt: 'Evaluate the improper integral:


    $$

    \int_1^\infty \frac{1}{x^2}\,dx

    $$

    '
  choices:
  - id: a
    text: $1$
  - id: b
    text: $0$
  - id: c
    text: $\infty$
  - id: d
    text: $-1$
  answer:
    choiceId: a
  explanation: 'Set up the Type 1 limit:


    $$

    \lim_{b\to\infty}\int_1^b x^{-2}\,dx

    =

    \lim_{b\to\infty}\left[-\frac{1}{x}\right]_1^b.

    $$


    This gives $\lim_{b\to\infty}(1-\frac{1}{b})=1$.


    Related topic: evaluating convergent $p$-integrals.

    '
- id: q004
  type: multipleChoice
  prompt: 'Evaluate:


    $$

    \lim_{a\to0^+}\int_a^1 \frac{1}{\sqrt{x}}\,dx

    $$

    '
  choices:
  - id: a
    text: $2$
  - id: b
    text: $0$
  - id: c
    text: $\infty$
  - id: d
    text: $1$
  answer:
    choiceId: a
  explanation: 'Integrate:


    $$

    \int x^{-1/2}\,dx=2\sqrt{x}.

    $$


    Then


    $$

    \lim_{a\to0^+}(2-2\sqrt{a})=2.

    $$


    Related topic: Type 2 endpoint singularity with $p<1$.

    '
- id: q005
  type: freeResponse
  prompt: 'Determine whether the integral converges or diverges and explain why:


    $$

    \int_0^1 \frac{1}{x^{4/3}}\,dx

    $$

    '
  answer:
    expected: 'Diverges by the endpoint p-test because p=4/3 is greater than 1.

      '
    gradingMode: selfCheck
    keyPoints:
    - Recognize Type 2 endpoint singularity at 0.
    - Use endpoint p-test.
    - Endpoint p-test converges only when p<1.
  explanation: 'This is a Type 2 endpoint singularity at $x=0$. For


    $$

    \int_0^1 \frac{1}{x^p}\,dx,

    $$


    convergence requires $p<1$. Here $p=\frac{4}{3}$, so it diverges.


    Related topic: endpoint $p$-test.

    '
- id: q006
  type: multipleChoice
  prompt: 'Evaluate the limit expression:


    $$

    \lim_{b\to\infty}\int_1^b \frac{\ln x}{x^2}\,dx

    $$

    '
  choices:
  - id: a
    text: $1$
  - id: b
    text: $0$
  - id: c
    text: $\infty$
  - id: d
    text: $-1$
  answer:
    choiceId: a
  explanation: 'Integration by parts gives


    $$

    \int \frac{\ln x}{x^2}\,dx=-\frac{\ln x}{x}-\frac{1}{x}.

    $$


    From $1$ to $b$:


    $$

    1-\frac{\ln b+1}{b}.

    $$


    The limit $\frac{\ln b+1}{b}\to0$ uses L''Hospital''s rule on the $\frac{\ln b}{b}$
    part. The integral converges to $1$.


    Related topic: improper integrals requiring L''Hospital after integration by parts.

    '
- id: q007
  type: freeResponse
  prompt: 'Determine whether this ordinary improper integral converges or diverges:


    $$

    \int_{-\infty}^{\infty} x\,dx

    $$


    Explain the issue.

    '
  answer:
    expected: 'Diverges as an ordinary improper integral because the two separate
      tails do not both converge, even though the symmetric principal value is 0.

      '
    gradingMode: selfCheck
    keyPoints:
    - Split into two tails.
    - Each tail must converge separately.
    - Principal value is not ordinary convergence.
  explanation: 'For ordinary improper convergence, split:


    $$

    \int_{-\infty}^{0}x\,dx+\int_0^\infty x\,dx.

    $$


    The left tail tends to $-\infty$ and the right tail tends to $\infty$. The symmetric
    principal value is not enough.


    Related topic: two-tail condition versus Cauchy principal value.

    '
- id: q008
  type: multipleChoice
  prompt: 'Evaluate:


    $$

    \lim_{a\to0^+}\int_a^1 \ln x\,dx

    $$

    '
  choices:
  - id: a
    text: $-1$
  - id: b
    text: $0$
  - id: c
    text: $1$
  - id: d
    text: Diverges to $-\infty$
  answer:
    choiceId: a
  explanation: 'An antiderivative is


    $$

    x\ln x-x.

    $$


    The lower endpoint gives $\lim_{a\to0^+}(a\ln a-a)$. The term $a\ln a$ is a $0\cdot\infty$
    form; rewrite as $\frac{\ln a}{1/a}$ and use L''Hospital''s rule to get $0$. The
    value is $-1$.


    Related topic: endpoint logarithmic singularity and L''Hospital''s rule.

    '
- id: q009
  type: freeResponse
  prompt: 'Determine whether the integral converges or diverges and explain why:


    $$

    \int_0^2 \frac{1}{x-1}\,dx

    $$

    '
  answer:
    expected: 'Diverges because there is an interior singularity at x=1, and the one-sided
      improper integrals diverge.

      '
    gradingMode: selfCheck
    keyPoints:
    - Identify the interior singularity at x=1.
    - Split at x=1.
    - One-sided limits must both converge; they do not.
  explanation: 'This is Type 2 with an interior discontinuity. You must split at $x=1$:


    $$

    \lim_{b\to1^-}\int_0^b\frac{1}{x-1}\,dx

    +

    \lim_{c\to1^+}\int_c^2\frac{1}{x-1}\,dx.

    $$


    The logarithmic one-sided limits diverge. Cancellation across the asymptote is
    not allowed.


    Related topic: interior singularities and one-sided limits.

    '
- id: q010
  type: multipleChoice
  prompt: 'Evaluate:


    $$

    \int_0^\infty e^{-2x}\,dx

    $$

    '
  choices:
  - id: a
    text: $\frac{1}{2}$
  - id: b
    text: $2$
  - id: c
    text: $0$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: 'Use a Type 1 limit:


    $$

    \lim_{b\to\infty}\int_0^b e^{-2x}\,dx

    =

    \lim_{b\to\infty}\left[-\frac{1}{2}e^{-2x}\right]_0^b.

    $$


    Since $e^{-2b}\to0$, the value is $\frac{1}{2}$.


    Related topic: exponential decay on an infinite interval.

    '
- id: q011
  type: freeResponse
  prompt: 'Determine whether the integral converges or diverges and explain why:


    $$

    \int_1^\infty \frac{\sin x}{x^2}\,dx

    $$

    '
  answer:
    expected: 'Converges absolutely by comparison because |sin x|/x^2 <= 1/x^2 and
      the p-test with p=2 converges.

      '
    gradingMode: selfCheck
    keyPoints:
    - Use absolute value for absolute convergence.
    - Compare to 1/x^2.
    - p=2 tail converges.
  explanation: 'Since $|\sin x|\le1$,


    $$

    \left|\frac{\sin x}{x^2}\right|\le\frac{1}{x^2}.

    $$


    The comparison function is a convergent $p=2$ tail, so the integral converges
    absolutely.


    Related topic: comparison test for improper integrals.

    '
- id: q012
  type: multipleChoice
  prompt: 'Evaluate the limit expression:


    $$

    \lim_{b\to\infty}\int_1^b \frac{1}{x^{3/2}}\,dx

    $$

    '
  choices:
  - id: a
    text: $2$
  - id: b
    text: $1$
  - id: c
    text: $\infty$
  - id: d
    text: $\frac{1}{2}$
  answer:
    choiceId: a
  explanation: 'Integrate:


    $$

    \int x^{-3/2}\,dx=-2x^{-1/2}.

    $$


    Then


    $$

    \lim_{b\to\infty}\left(-\frac{2}{\sqrt{b}}+2\right)=2.

    $$


    Related topic: evaluating a convergent infinite-tail $p$-integral.

    '
- id: q013
  type: freeResponse
  prompt: 'Determine whether the integral converges or diverges and explain why:


    $$

    \int_2^\infty \frac{1}{x\ln x}\,dx

    $$

    '
  answer:
    expected: 'Diverges. Use u=ln x, du=dx/x, giving integral of 1/u from ln 2 to
      infinity, which diverges.

      '
    gradingMode: selfCheck
    keyPoints:
    - Use u = ln x.
    - Convert dx/x to du.
    - Recognize the resulting 1/u tail diverges.
  explanation: 'Let $u=\ln x$, so $du=\frac{1}{x}\,dx$. The integral becomes


    $$

    \int_{\ln 2}^{\infty}\frac{1}{u}\,du,

    $$


    which diverges by the $p=1$ tail.


    Related topic: logarithmic improper integral.

    '
- id: q014
  type: multipleChoice
  prompt: 'Evaluate:


    $$

    \lim_{b\to\infty}\int_0^b x e^{-x}\,dx

    $$

    '
  choices:
  - id: a
    text: $1$
  - id: b
    text: $0$
  - id: c
    text: $\infty$
  - id: d
    text: $e$
  answer:
    choiceId: a
  explanation: 'Integration by parts gives


    $$

    \int x e^{-x}\,dx=-(x+1)e^{-x}.

    $$


    From $0$ to $b$:


    $$

    1-(b+1)e^{-b}.

    $$


    The limit $(b+1)e^{-b}=\frac{b+1}{e^b}\to0$, which can be justified with L''Hospital''s
    rule. The value is $1$.


    Related topic: exponential decay and L''Hospital after integration by parts.

    '
- id: q015
  type: freeResponse
  prompt: 'Determine whether the integral converges or diverges and explain why:


    $$

    \int_0^1 \frac{\ln x}{\sqrt{x}}\,dx

    $$

    '
  answer:
    expected: 'Converges. The endpoint singularity is softened by x^{-1/2}; after
      substituting x=u^2, the integral becomes a finite logarithmic endpoint limit.

      '
    gradingMode: selfCheck
    keyPoints:
    - Identify endpoint issue at 0.
    - Use substitution such as x=u^2 or compare logarithmic growth against x^{-p}
      with p<1.
    - State convergence.
  explanation: 'Let $x=u^2$, so $dx=2u\,du$ and $\sqrt{x}=u$. Then


    $$

    \int_0^1 \frac{\ln x}{\sqrt{x}}\,dx

    =

    \int_0^1 4\ln u\,du.

    $$


    The endpoint limit for $u\ln u$ is handled by L''Hospital''s rule and is finite.
    The integral converges.


    Related topic: logarithmic endpoint singularities and substitution.

    '
