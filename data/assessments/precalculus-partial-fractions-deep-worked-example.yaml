schemaVersion: 1
id: precalculus-partial-fractions-deep-worked-example
title: Partial Fraction Decomposition In Depth Worked Example
assessmentType: workedExample
categoryId: precalculus
subcategoryId: precalc-rational
subcategoryIds:
  - precalc-rational
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Performing the full decomposition
    problem: |
      Decompose:

      $$
      \frac{7x+17}{(x+1)(x+4)}
      $$

      This example asks you to build the decomposition, clear denominators, solve constants, and write the final form.
    steps:
      - id: s001
        title: Check proper form
        instruction: |
          Partial fractions starts directly only when the rational expression is proper.
        type: multipleChoice
        prompt: |
          Is this expression proper?

          $$
          \frac{7x+17}{(x+1)(x+4)}
          $$
        choices:
          - id: a
            text: 'Yes, numerator degree $1$ is less than denominator degree $2$.'
          - id: b
            text: 'No, numerator degree is larger.'
          - id: c
            text: 'No, because the denominator is factored.'
          - id: d
            text: 'No, because partial fractions never starts from factored form.'
        answer:
          choiceId: a
        explanation: |
          The expression is proper because the numerator degree is smaller than the denominator degree.

          Related topic: proper rational expression check.

      - id: s002
        title: Write the template
        instruction: |
          Each distinct linear factor gets one constant numerator.
        type: symbolicResponse
        prompt: |
          Write the partial fraction template for:

          $$
          \frac{7x+17}{(x+1)(x+4)}
          $$

          Use constants $A$ and $B$.
        answer:
          expectedLatex: '\frac{A}{x+1}+\frac{B}{x+4}'
          equivalenceMode: expression
          variables:
            - x
            - A
            - B
          tolerance: 0.000001
        hint: |
          Distinct linear factors get constants over each factor.
        explanation: |
          The correct template is

          $$
          \frac{A}{x+1}+\frac{B}{x+4}.
          $$

          Related topic: partial fraction template for distinct linear factors.

      - id: s003
        title: Clear denominators
        instruction: |
          Multiply by the entire denominator to get a polynomial identity.
        type: symbolicResponse
        prompt: |
          After clearing denominators, enter the right-hand side expression:

          $$
          7x+17 = \_\_\_\_
          $$
        answer:
          expectedLatex: 'A(x+4)+B(x+1)'
          equivalenceMode: expression
          variables:
            - x
            - A
            - B
          tolerance: 0.000001
        hint: |
          The denominator below $A$ cancels $x+1$ and leaves $x+4$.
        explanation: |
          Clearing denominators gives

          $$
          7x+17=A(x+4)+B(x+1).
          $$

          Related topic: clearing denominators in partial fractions.

      - id: s004
        title: Solve for A
        instruction: |
          Choose an $x$ value that makes the $B$ term disappear.
        type: symbolicResponse
        prompt: |
          Use $x=-1$ in

          $$
          7x+17=A(x+4)+B(x+1)
          $$

          Enter $A$.
        answer:
          expectedLatex: '\frac{10}{3}'
          equivalenceMode: expression
          variables:
            - x
          tolerance: 0.000001
        explanation: |
          At $x=-1$, the $B(x+1)$ term becomes zero:

          $$
          10=3A
          $$

          so $A=\frac{10}{3}$.

          Related topic: substitution at factor roots.

      - id: s005
        title: Solve for B
        instruction: |
          Choose an $x$ value that makes the $A$ term disappear.
        type: symbolicResponse
        prompt: |
          Use $x=-4$ in

          $$
          7x+17=A(x+4)+B(x+1)
          $$

          Enter $B$.
        answer:
          expectedLatex: '\frac{11}{3}'
          equivalenceMode: expression
          variables:
            - x
          tolerance: 0.000001
        explanation: |
          At $x=-4$, the $A(x+4)$ term becomes zero:

          $$
          -11=-3B
          $$

          so $B=\frac{11}{3}$.

          Related topic: cover-up substitution.

      - id: s006
        title: Write the final decomposition
        instruction: |
          Substitute the constants back into the template.
        type: symbolicResponse
        prompt: |
          Write the full partial fraction decomposition:

          $$
          \frac{7x+17}{(x+1)(x+4)} = \_\_\_\_
          $$
        answer:
          expectedLatex: '\frac{10}{3(x+1)}+\frac{11}{3(x+4)}'
          equivalenceMode: expression
          variables:
            - x
          tolerance: 0.000001
        explanation: |
          Substitute $A=\frac{10}{3}$ and $B=\frac{11}{3}$ into the template:

          $$
          \frac{10}{3(x+1)}+\frac{11}{3(x+4)}.
          $$

          Related topic: final partial fraction form.

      - id: s007
        title: Handle repeated factors
        instruction: |
          Repeated factors require each power of the factor.
        type: symbolicResponse
        prompt: |
          Write the template for:

          $$
          \frac{4x+1}{(x-2)^2}
          $$
        answer:
          expectedLatex: '\frac{A}{x-2}+\frac{B}{(x-2)^2}'
          equivalenceMode: expression
          variables:
            - x
            - A
            - B
          tolerance: 0.000001
        explanation: |
          For the repeated linear factor $(x-2)^2$, include both powers:

          $$
          \frac{A}{x-2}+\frac{B}{(x-2)^2}.
          $$

          Related topic: repeated linear factors in partial fractions.
