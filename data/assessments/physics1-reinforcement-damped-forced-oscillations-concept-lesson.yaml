lesson:
  introduction: Damping removes mechanical energy, while a periodic driver can add energy. Resonance occurs when driving frequency is near the system's natural frequency.
  sections:
  - id: physics1-reinforcement-damped-s1
    title: Interpret damping
    required: true
    content: Damping causes amplitude and mechanical energy to decrease with time. The oscillation can remain underdamped, critically damped, or overdamped.
    check:
      id: physics1-reinforcement-damped-s1-check
      type: multipleChoice
      prompt: Which observation most directly indicates damping in a free oscillator?
      choices:
      - { id: a, text: 'Successive peaks have smaller amplitudes' }
      - { id: b, text: 'The period is exactly zero', issueSignals: [{ id: physics1-damping-period-error, domains: [physics-1] }] }
      - { id: c, text: 'The total mechanical energy grows each cycle', issueSignals: [{ id: physics1-damping-energy-direction-error, domains: [physics-1] }] }
      - { id: d, text: 'The equilibrium position changes solely because of friction', issueSignals: [{ id: physics1-damping-equilibrium-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Damping removes energy, so peak amplitude decays. Why it works: Amplitude tracks the oscillatory mechanical energy. Why the other choices fail: They contradict energy loss or assign damping an unsupported effect on equilibrium.'
    difficultyDimensions: [graphInterpretation, energy]
    difficultyEvidence: Identifies damping from a measurable time-series feature.
  - id: physics1-reinforcement-damped-s2
    title: Compare damping regimes
    required: true
    content: Underdamped systems oscillate while decaying; critically damped systems return fastest without oscillating; overdamped systems return without oscillating but more slowly.
    check:
      id: physics1-reinforcement-damped-s2-check
      type: multipleChoice
      prompt: Which response is fastest without overshooting equilibrium?
      choices:
      - { id: a, text: 'Critical damping' }
      - { id: b, text: 'Underdamping', issueSignals: [{ id: physics1-damping-overshoot-error, domains: [physics-1] }] }
      - { id: c, text: 'Overdamping', issueSignals: [{ id: physics1-damping-speed-regime-error, domains: [physics-1] }] }
      - { id: d, text: 'Zero damping', issueSignals: [{ id: physics1-damping-no-loss-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Critical damping reaches equilibrium fastest without oscillation. Why it works: It is the boundary between real exponential decay and oscillatory decay. Why the other choices fail: Underdamping overshoots, overdamping is slower, and zero damping never settles.'
    difficultyDimensions: [modelSelection, limitingCase]
    difficultyEvidence: Distinguishes response regimes using two constraints.
  - id: physics1-reinforcement-damped-s3
    title: Identify resonance
    required: true
    content: A driven oscillator absorbs energy most efficiently near its natural frequency, with damping limiting the peak response.
    check:
      id: physics1-reinforcement-damped-s3-check
      type: multipleChoice
      prompt: A frequency-response graph has a sharp peak near $\omega_0$. What does the peak represent?
      choices:
      - { id: a, text: 'Large steady-state amplitude when driving frequency is near the natural frequency' }
      - { id: b, text: 'Zero energy transfer at the natural frequency', issueSignals: [{ id: physics1-resonance-energy-error, domains: [physics-1] }] }
      - { id: c, text: 'A frequency-independent amplitude', issueSignals: [{ id: physics1-resonance-frequency-error, domains: [physics-1] }] }
      - { id: d, text: 'A proof that damping is absent', issueSignals: [{ id: physics1-resonance-damping-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: The peak is resonance: the driver supplies energy efficiently near the natural frequency. Why it works: Phase and energy transfer align near resonance. Why the other choices fail: They reverse the energy response or treat a peak as evidence of no damping.'
    difficultyDimensions: [graphInterpretation, modelSelection]
    difficultyEvidence: Interprets a response curve rather than a static formula.
  - id: physics1-reinforcement-damped-s4
    title: Predict the effect of more damping
    required: true
    content: Increasing damping lowers and broadens the resonance peak. It reduces the maximum steady-state amplitude.
    check:
      id: physics1-reinforcement-damped-s4-check
      type: multipleChoice
      prompt: Compared with a lightly damped oscillator, what does stronger damping generally do to its resonance curve?
      choices:
      - { id: a, text: 'Lowers and broadens the peak' }
      - { id: b, text: 'Raises and narrows the peak', issueSignals: [{ id: physics1-damping-resonance-trend-error, domains: [physics-1] }] }
      - { id: c, text: 'Leaves the peak unchanged', issueSignals: [{ id: physics1-damping-response-error, domains: [physics-1] }] }
      - { id: d, text: 'Removes the driving frequency from the response', issueSignals: [{ id: physics1-damping-driver-error, domains: [physics-1] }] }
      answer: { choiceId: a }
      explanation: 'Solution: Stronger damping dissipates more energy and makes the resonance less selective, lowering and broadening the peak. Why it works: Damping limits amplitude and phase sharpness. Why the other choices fail: They predict the opposite trend or deny the driven response.'
    difficultyDimensions: [graphInterpretation, energy]
    difficultyEvidence: Predicts two linked changes in a frequency-response graph.
