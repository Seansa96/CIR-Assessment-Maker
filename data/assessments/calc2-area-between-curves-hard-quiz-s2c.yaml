questions:
  - { id: q001, type: symbolicResponse, prompt: 'Find the total geometric area between $y=x$ and $y=x^3$ on $[-1,1]$.', answer: { expectedLatex: '1/2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Intersections are x=-1,0,1. On [-1,0], $x^3>x$; on [0,1], $x>x^3$. Thus $A=\int_{-1}^0(x^3-x)dx+\int_0^1(x-x^3)dx=1/4+1/4=1/2$. Why it works: Geometric area requires positive top-minus-bottom pieces. Common trap: $\int_{-1}^1(x-x^3)dx=0$ is signed cancellation, not area.', difficultyDimensions: [casePartition, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: Intersections create two different boundary orders and require two exact integrals. }
  - { id: q002, type: symbolicResponse, prompt: 'Find the area bounded by $x=y^2$ and $x=2y+3$.', answer: { expectedLatex: '125/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Set $y^2=2y+3$ to get y=-1,3. Horizontal length is $(2y+3)-y^2$. $A=\int_{-1}^3(2y+3-y^2)dy=[y^2+3y-y^3/3]_{-1}^3=125/6$. Why it works: Both boundaries are naturally x-functions of y. Common trap: Using y-functions of x introduces two parabola branches unnecessarily.', difficultyDimensions: [representationTransfer, modelOrDerivation, auxiliaryTechnique], difficultyEvidence: Requires choosing horizontal slices, solving for y-bounds, and integrating a right-minus-left expression. }
  - { id: q003, type: symbolicResponse, prompt: 'Find the total area between $y=|x|$ and $y=x^2$ on $[-1,1]$.', answer: { expectedLatex: '1/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: On [-1,0], $|x|=-x$; on [0,1], $|x|=x$. In both pieces $|x|\ge x^2$. So $A=2\int_0^1(x-x^2)dx=2(1/2-1/3)=1/3$. Why it works: The absolute value changes formula at 0 and symmetry reduces the calculation. Common trap: Treating |x| as x on the negative interval.', difficultyDimensions: [casePartition, simplification, modelOrDerivation], difficultyEvidence: Requires resolving an absolute value, checking curve order, and using justified symmetry. }
  - { id: q004, type: symbolicResponse, prompt: 'Find the area enclosed by $y=4-x^2$ and $y=|x|$.', answer: { expectedLatex: '(17\\sqrt{17}-25)/6', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: By symmetry solve $4-x^2=x$ for $a=(\sqrt{17}-1)/2$. Then $A=2[4x-x^3/3-x^2/2]_0^a=(17\sqrt{17}-25)/6$. Why it works: On [0,a], the parabola is above x; symmetry doubles the matched half-regions. Common trap: The negative root does not equal -a until the absolute-value branch is accounted for.', difficultyDimensions: [identityConstruction, modelOrDerivation, proofJustification], difficultyEvidence: Requires branch-aware intersection reasoning, symmetry justification, and substitution of an algebraic endpoint. }
  - { id: q005, type: symbolicResponse, prompt: 'A student writes $\int_{-1}^1(x^2-x)dx$ for the area between $y=x^2$ and $y=x$. Give the correct total area.', answer: { expectedLatex: '1', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The curves meet at 0 and 1. On [-1,0], x squared is above x; on [0,1], x is above x squared. Hence $A=\int_{-1}^0(x^2-x)dx+\int_0^1(x-x^2)dx=5/6+1/6=1$. Why it works: Curve order changes at 0. Common trap: The stated integral is only correct on [-1,0].', difficultyDimensions: [errorDiagnosis, reverseReasoning, casePartition], difficultyEvidence: Starts from a flawed setup, reconstructs the geometry, and repairs the interval-specific model. }
  - { id: q006, type: symbolicResponse, prompt: 'Find the area bounded by $y=\sqrt{x}$, $y=x^2$, and $x=0$.', answer: { expectedLatex: '1/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Solve $\sqrt{x}=x^2$: for x nonnegative, x=0 or 1. On [0,1], $\sqrt{x}$ is above $x^2$. Thus $A=\int_0^1(x^{1/2}-x^2)dx=2/3-1/3=1/3$. Why it works: Domain x≥0 is essential before squaring. Common trap: Squaring without a domain check can introduce invalid roots.', difficultyDimensions: [domainCondition, auxiliaryTechnique, modelOrDerivation], difficultyEvidence: Requires domain control, nontrivial intersection solving, and a fractional-power area integral. }
  - { id: q007, type: symbolicResponse, prompt: 'Find the area enclosed by $x=y^2$ and $x=4-y^2$.', answer: { expectedLatex: '16\\sqrt{2}/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Intersections satisfy $y^2=4-y^2$, so y=±√2. Horizontal length is $(4-y^2)-y^2=4-2y^2$. $A=\int_{-\sqrt2}^{\sqrt2}(4-2y^2)dy=16\sqrt2/3$. Why it works: Both curves are x-functions of y, so horizontal slices avoid inverse branches. Common trap: Do not use top-minus-bottom for a horizontal slice.', difficultyDimensions: [representationTransfer, simplification, modelOrDerivation], difficultyEvidence: Builds a horizontal model from sideways parabolas and uses symmetry in exact evaluation. }
  - { id: q008, type: symbolicResponse, prompt: 'Find the total area between $y=\sin x$ and the x-axis on $[-\pi,\pi]$.', answer: { expectedLatex: '4', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Sine is negative on [-π,0] and positive on [0,π]. $A=-\int_{-\pi}^0\sin xdx+\int_0^\pi\sin xdx=2+2=4$. Why it works: Area uses absolute height, not signed accumulation. Common trap: The ordinary integral over this symmetric interval is zero.', difficultyDimensions: [casePartition, representationTransfer, errorDiagnosis], difficultyEvidence: Requires sign analysis, a piecewise absolute-area model, and rejection of cancellation. }
  - { id: q009, type: symbolicResponse, prompt: 'Find the area bounded by $y=e^x$, $y=e^{-x}$, and $x=1$.', answer: { expectedLatex: 'e+1/e-2', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: The curves meet at x=0. On [0,1], $e^x$ is above $e^{-x}$. $A=\int_0^1(e^x-e^{-x})dx=[e^x+e^{-x}]_0^1=e+e^{-1}-2$. Why it works: The bounding line x=1 closes the region after the intersection. Common trap: The antiderivative of $-e^{-x}$ is $+e^{-x}$.', difficultyDimensions: [auxiliaryTechnique, modelOrDerivation, domainCondition], difficultyEvidence: Finds a transcendental intersection, determines order, and integrates competing exponentials. }
  - { id: q010, type: symbolicResponse, prompt: 'Find the area enclosed by $y=x^2-2x$ and $y=0$.', answer: { expectedLatex: '4/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Zeros are x=0 and x=2. The parabola is below the axis between them, so $A=\int_0^2-(x^2-2x)dx=\int_0^2(2x-x^2)dx=[x^2-x^3/3]_0^2=4/3$. Why it works: Geometric area reverses a negative vertical distance. Common trap: Reporting -4/3 gives signed accumulation instead of area.', difficultyDimensions: [domainCondition, modelOrDerivation, errorDiagnosis], difficultyEvidence: Uses root structure, sign analysis, and a corrected area integrand. }
