lesson:
  introduction: Use governing principles, units, and representations to select a Physics 1 model before calculation.
  sections:
    - { id: cr1, title: Vectors, content: 'Resolve vectors into components before adding them.', check: { id: crc1, type: multipleChoice, prompt: 'Which components should be added to find a net force?', choices: [{ id: a, text: 'Matching x and y components' }, { id: b, text: 'Only magnitudes' }], answer: { choiceId: a }, explanation: 'Solution: Add matching components.\n\nWhy it works: Vectors add component by component.\n\nWhy the other choices fail: Magnitudes alone discard direction.' } }
    - { id: cr2, title: Newton''s laws, content: 'A free-body diagram identifies external forces before applying $\sum\vec F=m\vec a$.', check: { id: crc2, type: multipleChoice, prompt: 'A zero net force implies:', choices: [{ id: a, text: 'zero acceleration' }, { id: b, text: 'zero velocity' }], answer: { choiceId: a }, explanation: 'Solution: Net force zero implies acceleration zero.\n\nWhy it works: This is Newton''s second law.\n\nWhy the other choices fail: Constant nonzero velocity also has zero acceleration.' } }
    - { id: cr3, title: Kinematics, content: 'Constant-acceleration equations link position, velocity, acceleration, and time.', check: { id: crc3, type: multipleChoice, prompt: 'When time is absent, a useful constant-acceleration relation is:', choices: [{ id: a, text: '$v_f^2=v_i^2+2a\Delta x$' }, { id: b, text: '$v_f=v_i+at$' }], answer: { choiceId: a }, explanation: 'Solution: Use $v_f^2=v_i^2+2a\Delta x$.\n\nWhy it works: It omits time.\n\nWhy the other choices fail: The other relation requires time.' } }
    - { id: cr4, title: Work and energy, content: 'Net work changes kinetic energy: $W_{net}=\Delta K$.', check: { id: crc4, type: multipleChoice, prompt: 'Positive net work causes kinetic energy to:', choices: [{ id: a, text: 'increase' }, { id: b, text: 'decrease' }], answer: { choiceId: a }, explanation: 'Solution: Kinetic energy increases.\n\nWhy it works: $W_{net}=\Delta K$.\n\nWhy the other choices fail: Decrease requires negative net work.' } }
    - { id: cr5, title: Momentum, content: 'Total momentum is conserved for an isolated system.', check: { id: crc5, type: multipleChoice, prompt: 'Momentum conservation requires negligible:', choices: [{ id: a, text: 'external impulse' }, { id: b, text: 'internal force' }], answer: { choiceId: a }, explanation: 'Solution: It requires negligible external impulse.\n\nWhy it works: Internal forces cancel in the system total.\n\nWhy the other choices fail: Internal forces can be present while total momentum is conserved.' } }
    - { id: cr6, title: Rotation, content: 'Torque changes angular motion; its magnitude is $\tau=rF\sin\theta$.', check: { id: crc6, type: multipleChoice, prompt: 'A force through a rotation axis produces torque of:', choices: [{ id: a, text: 'zero' }, { id: b, text: 'maximum' }], answer: { choiceId: a }, explanation: 'Solution: Torque is zero.\n\nWhy it works: The lever arm is zero.\n\nWhy the other choices fail: Maximum torque requires a perpendicular force at nonzero radius.' } }
    - { id: cr7, title: Fluids and waves, content: 'Fluid pressure varies with depth, and wave speed combines restoring effect with inertia.', check: { id: crc7, type: multipleChoice, prompt: 'At greater depth in a static fluid, pressure is:', choices: [{ id: a, text: 'greater' }, { id: b, text: 'smaller' }], answer: { choiceId: a }, explanation: 'Solution: Pressure is greater.\n\nWhy it works: $p=p_0+\rho gh$ increases with depth.\n\nWhy the other choices fail: Static-fluid pressure is not independent of depth.' } }
