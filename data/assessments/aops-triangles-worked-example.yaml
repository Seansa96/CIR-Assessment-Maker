- id: aops-triangles-we-1
  title: Integer side lengths under strict inequality
  prompt: 'A triangle has side lengths 5, 8, and an integer $x$. Find every possible value of $x$ and the total count. Explain why the two boundary values are excluded.'
  steps:
  - id: aops-triangles-we-1-s1
    title: Derive the valid range
    prompt: 'Apply the Triangle Inequality Theorem to determine which values of $x$ are allowed.'
    difficultyDimensions:
    - Identify the combined form of the Triangle Inequality: $|a - b| < c < a + b$.
    - Substitute $a = 5$, $b = 8$ to get $3 < x < 13$.
    - Explain why the boundaries are excluded (degenerate triangle).
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The inequality is $3 < x < 13$.
      - At $x = 3$, the sides $3 + 5 = 8$ form a degenerate straight line.
      - At $x = 13$, the sides $5 + 8 = 13$ form a degenerate straight line.
    explanation: |
      Solution:
      The Triangle Inequality requires all three of the following:
      $$x + 5 > 8 \implies x > 3$$
      $$x + 8 > 5 \implies x > -3 \quad \text{(automatically satisfied for positive } x\text{)}$$
      $$5 + 8 > x \implies x < 13$$
      Combining, the valid range is $3 < x < 13$.
      At $x = 3$: sides are 3, 5, 8, but $3 + 5 = 8$. The three vertices are collinear — a degenerate segment with zero area, not a triangle.
      At $x = 13$: sides are 5, 8, 13, but $5 + 8 = 13$. Same degenerate case.

      Why it works:
      Strict inequality is required because equality collapses the triangle into a flat line. The combined form $|a-b| < x < a+b$ is a shortcut derived from simultaneously satisfying all three individual inequalities.
  - id: aops-triangles-we-1-s2
    title: Apply the integer restriction and count
    prompt: 'List all integers strictly between 3 and 13, and count them.'
    difficultyDimensions:
    - List integers satisfying $3 < x < 13$.
    - Use the counting formula: (largest) $-$ (smallest) $+ 1$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Valid integers are $x = 4, 5, 6, 7, 8, 9, 10, 11, 12$.
      - Count $= 12 - 4 + 1 = 9$ values.
    explanation: |
      Solution:
      The integers strictly greater than 3 and strictly less than 13 are:
      $$x \in \{4, 5, 6, 7, 8, 9, 10, 11, 12\}$$
      Using the inclusive counting formula: $12 - 4 + 1 = \mathbf{9}$ possible values.

      Why it works:
      A common off-by-one error is writing $12 - 4 = 8$. The $+1$ correction accounts for including both endpoints of the accepted range (4 and 12). Always use (largest $-$ smallest $+ 1$) when counting consecutive integers.
  - id: aops-triangles-we-1-s3
    title: Verify the extreme accepted values
    prompt: 'Confirm that $x = 4$ and $x = 12$ each form nondegenerate triangles by checking all three inequalities.'
    difficultyDimensions:
    - For $x = 4$: verify $4 + 5 > 8$, $5 + 8 > 4$, $4 + 8 > 5$.
    - For $x = 12$: verify $12 + 5 > 8$, $5 + 8 > 12$, $12 + 8 > 5$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$x = 4$: $4 + 5 = 9 > 8$ ✓. The other two inequalities are trivially satisfied.'
      - '$x = 12$: $5 + 8 = 13 > 12$ ✓. The other two inequalities are trivially satisfied.'
    explanation: |
      Solution:
      For $x = 4$, the three sides are 4, 5, 8. The only non-trivial inequality is the largest side:
      $$4 + 5 = 9 > 8 \checkmark$$
      For $x = 12$, the three sides are 5, 8, 12. The only non-trivial inequality is the largest side:
      $$5 + 8 = 13 > 12 \checkmark$$
      Both extreme accepted values produce valid triangles.

      Why it works:
      For three positive sides, only the inequality involving the largest side is ever non-trivial. The other two inequalities (smaller side + largest side $>$ middle side, etc.) are always automatically satisfied. This reduces every triangle inequality check to a single test.

- id: aops-triangles-we-2
  title: Missing leg, area, and perimeter in a 7-24-25 triangle
  prompt: 'A right triangle has hypotenuse 25 and one leg 7. Find the other leg, then the area and perimeter. Verify the missing side algebraically before using it.'
  steps:
  - id: aops-triangles-we-2-s1
    title: Solve the Pythagorean equation for the missing leg
    prompt: 'Using the right-angle and hypotenuse of 25, set up and solve for the unknown leg $y$.'
    difficultyDimensions:
    - Identify the Pythagorean equation with hypotenuse 25 and one leg 7.
    - Isolate $y^2$ by subtracting $7^2$.
    - Take the positive square root.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Equation: $7^2 + y^2 = 25^2$.
      - $y^2 = 625 - 49 = 576$.
      - $y = 24$.
    explanation: |
      Solution:
      In a right triangle, the two legs and the hypotenuse satisfy the Pythagorean theorem. With legs 7 and $y$, and hypotenuse 25:
      $$7^2 + y^2 = 25^2$$
      $$49 + y^2 = 625$$
      $$y^2 = 576$$
      Since a side length must be positive, $y = \sqrt{576} = 24$.

      Why it works:
      The hypotenuse is always the side opposite the right angle — it is the longest side. We must subtract the known leg-squared from the hypotenuse-squared, not the other way around, or we would obtain a negative number for $y^2$.
  - id: aops-triangles-we-2-s2
    title: Compute the area
    prompt: 'Use the two legs as the base and height to calculate the area.'
    difficultyDimensions:
    - Recall that the legs of a right triangle are perpendicular, so they are the base and height.
    - Apply $K = \frac{1}{2} \cdot \text{base} \cdot \text{height}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $K = \frac{1}{2}(7)(24) = 84$ square units.
    explanation: |
      Solution:
      The two legs of a right triangle are perpendicular to each other, so one leg serves as the base and the other as the height.
      $$K = \frac{1}{2}(7)(24) = \frac{168}{2} = 84 \text{ square units}$$

      Why it works:
      This is why area problems are much simpler for right triangles than for general triangles. In a general triangle, you need an external altitude from a vertex perpendicular to the opposite side. In a right triangle, the altitude is already built into the figure — it is one of the legs!
  - id: aops-triangles-we-2-s3
    title: Compute the perimeter and verify
    prompt: 'Add all three sides to find the perimeter, then substitute all values back into the Pythagorean equation to confirm.'
    difficultyDimensions:
    - Sum the three sides: $7 + 24 + 25$.
    - Verify: $7^2 + 24^2 = 25^2$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Perimeter $= 7 + 24 + 25 = 56$ units.
      - Verification: $49 + 576 = 625 = 25^2$ ✓.
    explanation: |
      Solution:
      The perimeter is the sum of all three sides:
      $$P = 7 + 24 + 25 = 56 \text{ units}$$
      Verification by substituting $y = 24$ into the original equation:
      $$7^2 + 24^2 = 49 + 576 = 625 = 25^2 \checkmark$$

      Why it works:
      Always verify the computed missing side in the original equation before using it to compute area and perimeter. A calculation error in step 1 would silently propagate into both later answers, making an independent check impossible.

- id: aops-triangles-we-3
  title: Pythagorean converse under a changed brace length
  prompt: 'A triangular frame has side lengths 20, 21, and 29. Determine if it contains a right angle. The longest brace is then replaced by length 30 while the other two sides stay fixed. Does the new frame exist? Classify its largest angle.'
  steps:
  - id: aops-triangles-we-3-s1
    title: Verify existence and classify 20-21-29
    prompt: 'Test the triangle inequality for 20-21-29, then compare $c^2$ vs. $a^2 + b^2$ to classify the triangle.'
    difficultyDimensions:
    - Test the only non-trivial inequality: $20 + 21 > 29$.
    - Compute $29^2$ and $20^2 + 21^2$ separately.
    - Apply the Pythagorean converse based on the comparison.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$20 + 21 = 41 > 29$, so the triangle exists.'
      - '$29^2 = 841$ and $20^2 + 21^2 = 400 + 441 = 841$.'
      - Since $c^2 = a^2 + b^2$, the angle opposite 29 is exactly $90°$.
    explanation: |
      Solution:
      First, test existence. The only non-trivial inequality involves the largest side:
      $$20 + 21 = 41 > 29 \checkmark$$
      The triangle is nondegenerate. Now classify it using the Pythagorean Converse:
      $$c^2 = 29^2 = 841$$
      $$a^2 + b^2 = 20^2 + 21^2 = 400 + 441 = 841$$
      Since $c^2 = a^2 + b^2$, the triangle is a **right triangle**. The right angle is opposite the longest side of 29.

      Why it works:
      The Pythagorean Converse says: if $c^2 = a^2 + b^2$ then the angle opposite $c$ is $90°$; if $c^2 > a^2 + b^2$ it is obtuse; if $c^2 < a^2 + b^2$ it is acute. We never need to compute any actual angle — the algebraic comparison does all the work.
  - id: aops-triangles-we-3-s2
    title: Verify existence of the 20-21-30 frame
    prompt: 'After replacing the longest side with 30, confirm the new frame still satisfies the triangle inequality.'
    difficultyDimensions:
    - Test $20 + 21 > 30$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$20 + 21 = 41 > 30$ ✓. The new frame exists.'
    explanation: |
      Solution:
      After replacing 29 with 30, the new set of sides is 20, 21, and 30. Check the only non-trivial inequality:
      $$20 + 21 = 41 > 30 \checkmark$$
      The triangle is nondegenerate and the frame can be built.

      Why it works:
      Never assume that a valid replacement preserves the triangle inequality. Increasing the longest side makes the inequality harder to satisfy. In this case we are fine, but if we had replaced with $c = 45$, the frame would fail ($20 + 21 = 41 < 45$) and would collapse.
  - id: aops-triangles-we-3-s3
    title: Classify 20-21-30 and interpret the angle change
    prompt: 'Compare $30^2$ with $20^2 + 21^2$ to classify the triangle, and explain what happened to the angle opposite the longest side.'
    difficultyDimensions:
    - Compute $30^2 = 900$ and compare with $20^2 + 21^2 = 841$.
    - Classify the triangle using the Pythagorean Converse.
    - Interpret how lengthening the opposite side affects the angle.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$30^2 = 900 > 841 = 20^2 + 21^2$, so the triangle is **obtuse**.'
      - The angle opposite the longest side increased from $90°$ to an angle greater than $90°$.
    explanation: |
      Solution:
      Applying the Pythagorean Converse to the new frame:
      $$c^2 = 30^2 = 900$$
      $$a^2 + b^2 = 20^2 + 21^2 = 841$$
      Since $c^2 > a^2 + b^2$, the triangle is **obtuse**. The angle opposite the longest side (which was exactly $90°$ in the original frame) has grown to an angle greater than $90°$.

      Why it works:
      As the longest side $c$ increases while $a$ and $b$ remain fixed, the two other vertices are pulled apart. The angle they form "opens up" — increasing from $90°$ toward $180°$. The squared comparison detects this precisely without needing a calculator or inverse trig.

- id: aops-triangles-we-4
  title: Radical bounds and classifying via the converse
  prompt: 'A triangle has side lengths $\sqrt{7}$, $\sqrt{11}$, and an unknown side $x > 0$. (a) Find the exact range of valid values for $x$ in simplest radical form. (b) Determine whether the triangle with $x = \sqrt{18}$ is acute, right, or obtuse.'
  steps:
  - id: aops-triangles-we-4-s1
    title: Derive the valid range for x
    prompt: 'Apply the triangle inequality to sides $\sqrt{7}$, $\sqrt{11}$, and $x$.'
    difficultyDimensions:
    - Compute $\sqrt{11} - \sqrt{7}$ for the lower bound.
    - Compute $\sqrt{7} + \sqrt{11}$ for the upper bound.
    - State the open interval in simplest radical form.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Lower bound: $x > \sqrt{11} - \sqrt{7}$.
      - Upper bound: $x < \sqrt{11} + \sqrt{7}$.
      - The range is $\sqrt{11} - \sqrt{7} < x < \sqrt{11} + \sqrt{7}$.
    explanation: |
      Solution:
      The triangle inequality requires $x + \sqrt{7} > \sqrt{11}$ and $x + \sqrt{11} > \sqrt{7}$ (automatic) and $\sqrt{7} + \sqrt{11} > x$.
      Combining the binding inequalities:
      $$\sqrt{11} - \sqrt{7} < x < \sqrt{11} + \sqrt{7}$$

      Why it works:
      The combined form $|a - b| < x < a + b$ works for any positive side lengths, including irrational ones. We leave the bounds in exact radical form rather than approximating, since $\sqrt{11} - \sqrt{7} \approx 0.677$ and $\sqrt{11} + \sqrt{7} \approx 5.970$.
  - id: aops-triangles-we-4-s2
    title: Verify that $x = \sqrt{18}$ is in the valid range
    prompt: 'Before classifying the triangle, confirm that $\sqrt{18}$ produces a valid (nondegenerate) triangle.'
    difficultyDimensions:
    - Compute approximate values: $\sqrt{7} \approx 2.646$, $\sqrt{11} \approx 3.317$, $\sqrt{18} \approx 4.243$.
    - Check $\sqrt{11} - \sqrt{7} < \sqrt{18} < \sqrt{11} + \sqrt{7}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$\sqrt{11} - \sqrt{7} \approx 0.677 < 4.243 \approx \sqrt{18}$ ✓'
      - '$\sqrt{18} \approx 4.243 < 5.970 \approx \sqrt{11} + \sqrt{7}$ ✓'
      - The triangle with sides $\sqrt{7}$, $\sqrt{11}$, $\sqrt{18}$ is valid.
    explanation: |
      Solution:
      Numerically: $\sqrt{18} = 3\sqrt{2} \approx 4.243$.
      Lower bound: $\sqrt{11} - \sqrt{7} \approx 3.317 - 2.646 = 0.671 < 4.243$ ✓
      Upper bound: $\sqrt{11} + \sqrt{7} \approx 5.963 > 4.243$ ✓
      The triangle exists.

      Why it works:
      Always verify existence before applying the Pythagorean Converse. Applying the converse to a degenerate (non-existent) triangle would produce a meaningless classification.
  - id: aops-triangles-we-4-s3
    title: Classify the triangle using the Pythagorean Converse
    prompt: 'Compare the square of the largest side with the sum of squares of the other two sides.'
    difficultyDimensions:
    - Identify the largest side. Since $\sqrt{18} > \sqrt{11} > \sqrt{7}$, the largest is $\sqrt{18}$.
    - Compute $(\sqrt{18})^2 = 18$ and $(\sqrt{7})^2 + (\sqrt{11})^2 = 7 + 11 = 18$.
    - Apply the converse.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $c^2 = (\sqrt{18})^2 = 18$.
      - $a^2 + b^2 = 7 + 11 = 18$.
      - Since $c^2 = a^2 + b^2$, the triangle is a **right triangle**.
    explanation: |
      Solution:
      The largest side is $\sqrt{18}$ (since $18 > 11 > 7$). Applying the Pythagorean Converse:
      $$c^2 = (\sqrt{18})^2 = 18$$
      $$a^2 + b^2 = (\sqrt{7})^2 + (\sqrt{11})^2 = 7 + 11 = 18$$
      Since $c^2 = a^2 + b^2$, the angle opposite $\sqrt{18}$ is exactly $90°$. This is a **right triangle**.

      Why it works:
      Working with radicals is actually simpler for converse problems because squaring them removes the radical entirely. The sides $\sqrt{7}$, $\sqrt{11}$, $\sqrt{18}$ form a right triangle precisely because $7 + 11 = 18$ — no approximations needed.
