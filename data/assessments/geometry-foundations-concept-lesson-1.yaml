lesson:
  introduction: |-
    Welcome to Geometry! The foundation of all Euclidean geometry rests on three undefined terms: **points**, **lines**, and **planes**. From these basic building blocks, we can construct the entirety of geometric theorems and proofs.
  sections:
  - id: sec-points
    title: What is a Point?
    required: true
    content: |-
      A **point** indicates a location and has no size, width, length, or depth. It is represented by a dot and named with a capital letter, such as Point $A$.

      Even though we draw a dot to visualize a point, remember that mathematically, a point is infinitely small.

  - id: sec-lines
    title: Lines and Collinear Points
    required: true
    content: |-
      A **line** is a straight continuous arrangement of infinitely many points. It has infinite length but no thickness and extends forever in two directions.
      
      We can name a line by any two points on it, for example, $\overleftrightarrow{AB}$, or by a single lowercase cursive letter, like line $\ell$.

      Points that lie on the same line are called **collinear**. If points do not lie on the same line, they are **noncollinear**. For any two points, there is exactly one line that passes through them.

  - id: sec-planes
    title: Planes and Coplanar Points
    required: true
    content: |-
      A **plane** is a flat surface that extends infinitely in all directions. It has length and width but no depth. You can think of a plane as an infinitely large sheet of paper.
      
      A plane is defined by any three noncollinear points. Points or lines that lie in the same plane are called **coplanar**.

questions:
- id: q-geom-fnd-1
  title: Concept Check - Collinear Points
  prompt: |-
    If you are given three points $A$, $B$, and $C$, which of the following statements must ALWAYS be true?
  type: multipleChoice
  choices:
  - id: c1
    text: They are collinear.
  - id: c2
    text: They are coplanar.
  - id: c3
    text: They form a triangle.
  answer:
    choiceId: c2
  explanation: |-
    Any three points are always **coplanar**, because exactly one plane can pass through any three noncollinear points. (If they are collinear, infinitely many planes can pass through them, but they still lie in at least one plane). They are not always collinear, and if they *are* collinear, they do not form a triangle.
  skills:
  - geometry-foundations

- id: q-geom-fnd-2
  title: Concept Check - Undefined Terms
  prompt: |-
    Which of the following is NOT one of the three undefined terms in geometry?
  type: multipleChoice
  choices:
  - id: c1
    text: Point
  - id: c2
    text: Line
  - id: c3
    text: Angle
  - id: c4
    text: Plane
  answer:
    choiceId: c3
  explanation: |-
    The three undefined terms in Euclidean geometry are **Point**, **Line**, and **Plane**. An angle is defined using rays, which are built from these undefined terms.
  skills:
  - geometry-foundations
