schemaVersion: 1
id: calc2-arithmetic-series-quiz
title: Arithmetic Series Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: arithmetic-series
skills:
- Solve inverse arithmetic-sequence and finite-sum problems
- Evaluate shifted sigma sums and decreasing progressions
- Model constant additive change and recover terms from partial sums
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - calculus-2
  - arithmetic-series
  - focused-practice
  - arithmetic-models
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - recover-first-terms
  prompt: |
    An arithmetic sequence has $a_8=31$ and $d=3$. What is $a_1$?
  choices:
  - id: a
    text: $10$
  - id: b
    text: $7$
  - id: c
    text: $28$
  - id: d
    text: $4$
  answer:
    choiceId: a
  explanation: Seven differences separate the first and eighth terms, so $a_1=31-7(3)=10$.
- id: q002
  type: multipleChoice
  skills:
  - solve-for-term-indices
  prompt: |
    In the sequence $14,19,24,\ldots$, which term is $104$?
  choices:
  - id: a
    text: The 19th term
  - id: b
    text: The 18th term
  - id: c
    text: The 20th term
  - id: d
    text: The 21st term
  answer:
    choiceId: a
  explanation: Solve $14+5(n-1)=104$, giving $n-1=18$ and n equals nineteen.
- id: q003
  type: multipleChoice
  skills:
  - sum-multiples-in-ranges
  prompt: |
    Find the sum of all positive multiples of $7$ below $100$.
  choices:
  - id: a
    text: $735$
  - id: b
    text: $700$
  - id: c
    text: $749$
  - id: d
    text: $686$
  answer:
    choiceId: a
  explanation: |-
    The terms are $7$ through $98=14\cdot7$, so the sum is $14(7+98)/2=735$.
- id: q004
  type: multipleChoice
  skills:
  - model-row-capacity
  prompt: |
    A theater has $18$ seats in its first row and two more seats in each
    successive row. How many seats are in the first $25$ rows?
  choices:
  - id: a
    text: $1050$
  - id: b
    text: $1650$
  - id: c
    text: $900$
  - id: d
    text: $1125$
  answer:
    choiceId: a
  explanation: The last row has $18+24(2)=66$ seats, and the total is $25(18+66)/2=1050$.
- id: q005
  type: multipleChoice
  skills:
  - use-arithmetic-sequence-averages
  prompt: |
    What is the average of the first $21$ terms of an arithmetic sequence?
  choices:
  - id: a
    text: $a_{11}$
  - id: b
    text: $a_{10}$
  - id: c
    text: $a_{21}/2$
  - id: d
    text: $a_1+a_{21}$
  answer:
    choiceId: a
  explanation: With an odd count, paired endpoints average to the unique middle term, whose index is eleven.
- id: q006
  type: multipleChoice
  skills:
  - sum-symmetric-arithmetic-terms
  prompt: |
    Evaluate $-30,-25,-20,\ldots,25,30$ as a finite sum.
  choices:
  - id: a
    text: $0$
  - id: b
    text: $30$
  - id: c
    text: $-30$
  - id: d
    text: $390$
  answer:
    choiceId: a
  explanation: Every negative term pairs with its positive opposite, and the middle term is zero.
- id: q007
  type: multipleChoice
  skills:
  - solve-common-differences-from-sums
  prompt: |
    An arithmetic series has $a_1=4$, $n=12$, and $S_{12}=378$. What is
    the common difference?
  choices:
  - id: a
    text: $5$
  - id: b
    text: $4$
  - id: c
    text: $6$
  - id: d
    text: $7$
  answer:
    choiceId: a
  explanation: $378=12[8+11d]/2=6(8+11d)$ gives $d=5$.
- id: q008
  type: multipleChoice
  skills:
  - evaluate-shifted-sigma-sums
  prompt: |
    Evaluate $\sum_{k=4}^{18}(2k+3)$.
  choices:
  - id: a
    text: $375$
  - id: b
    text: $336$
  - id: c
    text: $345$
  - id: d
    text: $390$
  answer:
    choiceId: a
  explanation: There are fifteen terms, from eleven through thirty-nine, so the sum is $15(11+39)/2=375$.
- id: q009
  type: multipleChoice
  skills:
  - insert-arithmetic-means
  prompt: |
    How many arithmetic means must be inserted between $5$ and $41$ so the
    common difference is $6$?
  choices:
  - id: a
    text: $5$
  - id: b
    text: $6$
  - id: c
    text: $4$
  - id: d
    text: $7$
  answer:
    choiceId: a
  explanation: The endpoint difference creates six intervals of size six, so five interior terms are inserted.
- id: q010
  type: multipleChoice
  skills:
  - sum-decreasing-arithmetic-series
  prompt: |
    Find the sum of the first $15$ terms of $40,37,34,\ldots$.
  choices:
  - id: a
    text: $285$
  - id: b
    text: $315$
  - id: c
    text: $-285$
  - id: d
    text: $570$
  answer:
    choiceId: a
  explanation: The fifteenth term is $40+14(-3)=-2$, so the sum is $15(40-2)/2=285$.
- id: q011
  type: multipleChoice
  skills:
  - recover-terms-from-partial-sums
  prompt: |
    If $S_{14}=210$ and $S_{13}=182$, what is $a_{14}$?
  choices:
  - id: a
    text: $28$
  - id: b
    text: $14$
  - id: c
    text: $392$
  - id: d
    text: $26$
  answer:
    choiceId: a
  explanation: The new term added between the two partial sums is $a_{14}=210-182=28$.
- id: q012
  type: multipleChoice
  skills:
  - sum-even-number-progressions
  prompt: |
    What is $2+4+6+\cdots+80$?
  choices:
  - id: a
    text: $1640$
  - id: b
    text: $1600$
  - id: c
    text: $3240$
  - id: d
    text: $820$
  answer:
    choiceId: a
  explanation: There are forty terms, so the sum is $40(2+80)/2=1640$.
- id: q013
  type: multipleChoice
  skills:
  - model-constant-depreciation
  prompt: |
    A machine is worth $50{,}000$ initially and loses $3{,}500$ in value
    each year. What is its value after $8$ yearly losses?
  choices:
  - id: a
    text: $22{,}000$
  - id: b
    text: $25{,}500$
  - id: c
    text: $28{,}000$
  - id: d
    text: $78{,}000$
  answer:
    choiceId: a
  explanation: Eight constant losses total $8(3500)=28000$, leaving 22000.
- id: q014
  type: multipleChoice
  skills:
  - justify-arithmetic-sum-formulas
  prompt: |
    In the reverse-and-add derivation of the arithmetic sum formula, what is
    the sum of each aligned pair?
  choices:
  - id: a
    text: $a_1+a_n$
  - id: b
    text: $a_1+d$
  - id: c
    text: $2a_1$
  - id: d
    text: $nd$
  answer:
    choiceId: a
  explanation: The first term pairs with the last, the second with the next-to-last, and equal spacing
    makes every column sum to the same endpoint total.
- id: q015
  type: multipleChoice
  skills:
  - classify-constant-infinite-series
  prompt: |
    An arithmetic sequence has common difference zero. When does its
    associated infinite series converge?
  choices:
  - id: a
    text: Only when the constant term is $0$
  - id: b
    text: For every constant term
  - id: c
    text: Whenever the constant is less than $1$
  - id: d
    text: Whenever the constant is negative
  answer:
    choiceId: a
  explanation: A nonzero constant term fails the term test, while the identically zero series has every
    partial sum equal to zero.
attemptQuestionCount: 15
