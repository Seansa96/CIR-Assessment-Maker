modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: numericResponse
    prompt: |
      Find the sum of the first 50 positive odd integers ($1 + 3 + 5 + \dots$).
    answer:
      value: 2500
      tolerance: 0.1
    explanation: |
      $n = 50$, $a_1 = 1$, $d = 2$.
      The 50th odd integer is $a_{50} = 1 + (49)2 = 99$.
      $S = \frac{50}{2} (1 + 99) = 25 \times 100 = 2500$.
      (Fun fact: The sum of the first $n$ odd integers is always $n^2$).

  - id: q002
    type: numericResponse
    prompt: |
      Evaluate $\sum_{k=5}^{20} (2k + 1)$.
      *(Careful with finding $n$!)*
    answer:
      value: 416
      tolerance: 0.1
    explanation: |
      The number of terms from $k=5$ to $k=20$ inclusive is $20 - 5 + 1 = 16$.
      First term ($k=5$): $2(5)+1 = 11$.
      Last term ($k=20$): $2(20)+1 = 41$.
      $S = \frac{16}{2} (11 + 41) = 8(52) = 416$.

  - id: q003
    type: multipleChoice
    prompt: |
      Why does an infinite arithmetic series (where $d \ne 0$) always diverge?
    choices:
      - id: a
        text: Because the individual terms $a_n$ do not approach zero as $n \to \infty$.
      - id: b
        text: Because you cannot divide by infinity in the sum formula.
      - id: c
        text: Because arithmetic series involve addition, not multiplication.
      - id: d
        text: Because the Squeeze Theorem fails.
    answer:
      choiceId: a
    explanation: |
      A fundamental rule of series is the Test for Divergence: If $\lim a_n \ne 0$, the sum $\sum a_n$ diverges. Since an arithmetic sequence with $d \ne 0$ just keeps growing (or shrinking), its terms never approach 0.

  - id: q004
    type: numericResponse
    prompt: |
      If the sum of the first 10 terms of an arithmetic series is 150, and the first term is $a_1 = 6$, what is the 10th term ($a_{10}$)?
    answer:
      value: 24
      tolerance: 0.1
    explanation: |
      Use the formula $S_n = \frac{n}{2}(a_1 + a_n)$.
      $150 = \frac{10}{2}(6 + a_{10}) \implies 150 = 5(6 + a_{10}) \implies 30 = 6 + a_{10} \implies a_{10} = 24$.

  - id: q005
    type: numericResponse
    prompt: |
      An auditorium has 20 rows of seats. There are 25 seats in the first row, 27 in the second, 29 in the third, and so on. 
      What is the total capacity of the auditorium?
    answer:
      value: 880
      tolerance: 0.1
    explanation: |
      $n=20$, $a_1=25$, $d=2$.
      $S_{20} = \frac{20}{2} [2(25) + (19)2] = 10 [50 + 38] = 10(88) = 880$.
