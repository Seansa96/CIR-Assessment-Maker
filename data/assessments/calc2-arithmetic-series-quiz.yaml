- id: q001
  type: multipleChoice
  skills:
  - recover-first-terms
  prompt: 'An arithmetic sequence has $a_8=31$ and $d=3$. What is $a_1$?

    '
  choices:
  - id: a
    text: $10$
  - id: b
    text: $7$
  - id: c
    text: $28$
  - id: d
    text: $4$
  answer:
    choiceId: a
  explanation: 'Solution: Seven differences separate the first and eighth terms, so $a_1=31-7(3)=10$. Therefore the answer is $10$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


    Why the other choices fail: $7$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $28$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $4$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.'
- id: q002
  type: multipleChoice
  skills:
  - solve-for-term-indices
  prompt: |
    In the sequence $14,19,24,\ldots$, which term is $104$?
  choices:
  - id: a
    text: The 19th term
  - id: b
    text: The 18th term
  - id: c
    text: The 20th term
  - id: d
    text: The 21st term
  answer:
    choiceId: a
  explanation: 'Solution: Solve $14+5(n-1)=104$, giving $n-1=18$ and n equals nineteen. Therefore the answer is The 19th term.


    Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


    Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.


    Why the other choices fail: The 18th term conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The 20th term conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The 21st term conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.'
- id: q003
  type: multipleChoice
  skills:
  - sum-multiples-in-ranges
  prompt: 'Find the sum of all positive multiples of $7$ below $100$.

    '
  choices:
  - id: a
    text: $735$
  - id: b
    text: $700$
  - id: c
    text: $749$
  - id: d
    text: $686$
  answer:
    choiceId: a
  explanation: |-
    Solution: The terms are $7$ through $98=14\cdot7$, so the sum is $14(7+98)/2=735$. Therefore the answer is $735$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $700$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $749$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $686$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
