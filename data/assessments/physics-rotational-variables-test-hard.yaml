- id: hard-q012
  type: multipleChoice
  prompt: |-
    If the angular position is $\theta(t) = -C t^2 + D t$, where $C, D > 0$, what is the initial direction of rotation?
  choices:
  - id: a
    text: Positive (Counter-clockwise)
  - id: b
    text: Negative (Clockwise)
  - id: c
    text: It starts at rest.
  answer:
    choiceId: a
  explanation: |-
    The initial angular velocity is $\omega(0) = \frac{d\theta}{dt}\big|_{t=0} = D$. Since $D > 0$, the rotation is initially in the positive direction.
