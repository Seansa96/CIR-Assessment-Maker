questions:
- id: hard-q001
  type: numericResponse
  prompt: A turbine initially spins at 100 rpm and slows uniformly with angular acceleration -0.50 rad/s^2. How many seconds elapse before it stops?
  answer: { value: 20.94, tolerance: 0.3 }
  explanation: |
    Solution: $\omega_i=100(2\pi/60)=10.472$ rad/s. With $0=\omega_i+\alpha t$, $t=-10.472/(-0.50)=20.94$ s.

    Why it works: Constant angular acceleration changes angular velocity linearly, and the negative acceleration is opposite the initial positive rotation.
  difficultyDimensions: [unitConversion, signConvention, modelOrDerivation]
  subjectDifficultyTags: [angularVelocity]
  difficultyEvidence: The rotational rate must be converted and a signed constant-acceleration relation must be solved for time.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]
- id: hard-q002
  type: numericResponse
  prompt: A wheel starts from rest and has constant angular acceleration 3.0 rad/s^2 for 4.0 s. Through what angular displacement in radians does it turn?
  answer: { value: 24, tolerance: 0.1 }
  explanation: |
    Solution: $\Delta\theta=\omega_i t+\tfrac12\alpha t^2=0+\tfrac12(3.0)(4.0)^2=24$ rad.

    Why it works: For constant angular acceleration, displacement accumulates from the average angular velocity over the interval.
  difficultyDimensions: [modelOrDerivation, multiStep, representationTransfer]
  subjectDifficultyTags: [angularDisplacement]
  difficultyEvidence: A linear-kinematics relation must be transferred to rotational variables with a rest initial condition.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]
- id: hard-q003
  type: numericResponse
  prompt: A record has angular speed 12 rad/s. A point 0.18 m from its center has what tangential speed in m/s?
  answer: { value: 2.16, tolerance: 0.03 }
  explanation: |
    Solution: $v_t=r\omega=(0.18)(12)=2.16$ m/s.

    Why it works: Every point shares the same angular speed, but its linear speed depends on radial distance from the axis.
  difficultyDimensions: [representationTransfer, unitAnalysis, modelOrDerivation]
  subjectDifficultyTags: [tangentialSpeed]
  difficultyEvidence: The answer requires distinguishing common angular motion from radius-dependent tangential motion.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]
- id: hard-q004
  type: numericResponse
  prompt: A fan accelerates uniformly from 8.0 rad/s to 26.0 rad/s while turning through 102 rad. What angular acceleration in rad/s^2 does it have?
  answer: { value: 3, tolerance: 0.05 }
  explanation: |
    Solution: Use $\omega_f^2=\omega_i^2+2\alpha\Delta\theta$. Thus $\alpha=(26^2-8^2)/(2\cdot102)=3.00$ rad/s^2.

    Why it works: This constant-acceleration form eliminates time, which is not supplied, and relates the speed change directly to angular displacement.
  difficultyDimensions: [strategySelection, reverseReasoning, modelOrDerivation]
  subjectDifficultyTags: [noTimeKinematics]
  difficultyEvidence: The appropriate angular-kinematics equation must be selected based on the missing variable and then rearranged.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]
- id: hard-q005
  type: symbolicResponse
  prompt: A disk has angular velocity $\omega(t)=at^3+b$. Enter its angular acceleration as a function of $t$.
  answer:
    expectedLatex: '3*a*t^2'
    equivalenceMode: derivative
    variables: [a, b, t]
    tolerance: 0.000001
  explanation: |
    Solution: $\alpha(t)=d\omega/dt=d(at^3+b)/dt=3at^2$.

    Why it works: Angular acceleration is the time derivative of angular velocity, and a constant term differentiates to zero.
  difficultyDimensions: [symbolicManipulation, modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [angularAcceleration]
  difficultyEvidence: The physical definition must be translated into differentiation of a symbolic time function.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]
- id: hard-q006
  type: multipleChoice
  prompt: Two points lie on the same rigid disk, one at twice the radius of the other. If the disk rotates without slipping about its center, which comparison is correct?
  choices:
  - { id: a, text: They have equal angular speeds, but the outer point has twice the tangential speed. }
  - { id: b, text: They have equal tangential speeds, but the outer point has twice the angular speed. }
  - { id: c, text: Both angular speed and tangential speed are equal. }
  - { id: d, text: The inner point has twice both speeds. }
  answer: { choiceId: a }
  explanation: |
    Solution: They have equal angular speeds, but the outer point has twice the tangential speed.

    Why it works: A rigid disk has one $\omega$, while $v_t=r\omega$ grows directly with radius.

    Why the other choices fail: Tangential speed is not uniform across the disk, and neither point has a separate angular speed in rigid rotation.
  difficultyDimensions: [modelComparison, representationTransfer, errorDiagnosis]
  subjectDifficultyTags: [rigidRotation]
  difficultyEvidence: The qualitative comparison separates two linked but nonidentical rotational variables.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]
- id: hard-q007
  type: numericResponse
  prompt: A wheel turns 7.5 revolutions in 2.0 s at constant rate. What angular velocity in rad/s does it have?
  answer: { value: 23.56, tolerance: 0.05 }
  explanation: |
    Solution: $\omega=(7.5)(2\pi)/(2.0)=7.5\pi=23.56$ rad/s.

    Why it works: Angular speed is angular displacement per time; each revolution contributes $2\pi$ radians.
  difficultyDimensions: [unitConversion, modelOrDerivation, unitAnalysis]
  subjectDifficultyTags: [revolutionsToRadians]
  difficultyEvidence: Revolutions must be converted to radians before the rate relation is evaluated.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]
- id: hard-q008
  type: multipleChoice
  prompt: A rotating object has positive angular velocity and negative angular acceleration. Which outcome is possible before its direction reverses?
  choices:
  - { id: a, text: Its angular speed decreases to zero. }
  - { id: b, text: Its angular speed must increase. }
  - { id: c, text: Its angular displacement must be zero. }
  - { id: d, text: Its radius must decrease. }
  answer: { choiceId: a }
  explanation: |
    Solution: Its angular speed decreases to zero.

    Why it works: Opposite signs for angular velocity and angular acceleration mean the acceleration initially acts to reduce the magnitude of the rotational velocity.

    Why the other choices fail: The speed need not increase, the object can still turn while slowing, and radius is unrelated to the stated signs.
  difficultyDimensions: [signConvention, qualitativeCheck, errorDiagnosis]
  subjectDifficultyTags: [angularAccelerationDirection]
  difficultyEvidence: The signs of two vector-like rotational quantities must be interpreted without numerical substitution.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  extensionObjectiveIds: [phys1-obj-rotational-variables]

