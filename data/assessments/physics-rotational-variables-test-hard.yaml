questions:
- id: q1
  type: numericResponse
  prompt: The angular velocity of a disk is $\omega(t) = 4.0t^2 - 2.0t$. What is the
    angular acceleration at $t = 3.0 \text{ s}$?
  answer:
    value: 22.0
    tolerance: 0.5
  explanation: $\alpha(t) = \frac{d\omega}{dt} = 8.0t - 2.0$. At $t=3$, $\alpha =
    24 - 2 = 22 \text{ rad/s}^2$.
