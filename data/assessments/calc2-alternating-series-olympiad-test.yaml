questions:
- id: q001
  type: multipleChoice
  skills:
  - evaluate-alternating-zeta-values
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^2}$.
  choices:
  - id: a
    text: |-
      $\pi^2/12$
  - id: b
    text: |-
      $\pi^2/6$
  - id: c
    text: |-
      $\pi^2/8$
  - id: d
    text: |-
      $\ln2$
  answer:
    choiceId: a
  explanation: |-
    Subtract twice the even reciprocal-square subseries from $\zeta(2)$ to get $(1-2^{1-2})\zeta(2)=\pi^2/12$.
- id: q002
  type: multipleChoice
  skills:
  - connect-power-series-and-alternating-constants
  prompt: |
    What is $\displaystyle1-\frac13+\frac15-\frac17+\cdots$?
  choices:
  - id: a
    text: |-
      $\pi/4$
  - id: b
    text: |-
      $\ln2$
  - id: c
    text: $1/2$
  - id: d
    text: |-
      $\pi/2$
  answer:
    choiceId: a
  explanation: |-
    Integrating $1/(1+x^2)=1-x^2+x^4-\cdots$ from zero to one gives $\arctan1=\pi/4$.
- id: q003
  type: multipleChoice
  skills:
  - shift-alternating-series-indices
  prompt: |
    Evaluate $\displaystyle\frac13-\frac15+\frac17-\frac19+\cdots$.
  choices:
  - id: a
    text: |-
      $1-\pi/4$
  - id: b
    text: |-
      $\pi/4$
  - id: c
    text: |-
      $\pi/4-1$
  - id: d
    text: $1/3$
  answer:
    choiceId: a
  explanation: |-
    The Gregory series is $1-(1/3-1/5+1/7-\cdots)=\pi/4$.
- id: q004
  type: multipleChoice
  skills:
  - classify-harmonic-number-series
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}(-1)^{n-1}H_n/n$, where
    $H_n=1+1/2+\cdots+1/n$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    The magnitudes eventually decrease to zero because $H_n=O(\ln n)$, while $\sum H_n/n$ dominates the harmonic series and diverges.
- id: q005
  type: multipleChoice
  skills:
  - check-full-term-limits
  prompt: |
    What happens to $\sum_{n=1}^{\infty}(-1)^nH_n$?
  choices:
  - id: a
    text: It diverges by the term test.
  - id: b
    text: It converges conditionally.
  - id: c
    text: It converges absolutely.
  - id: d
    text: |-
      It sums to $\ln2$.
  answer:
    choiceId: a
  explanation: The magnitudes H_n grow rather than approach zero, so the series cannot converge.
- id: q006
  type: multipleChoice
  skills:
  - use-exact-harmonic-increments
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^{n-1}(H_{n+1}-H_n)$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Finite
  answer:
    choiceId: a
  explanation: Since $H_{n+1}-H_n=1/(n+1)$, this is a shifted alternating harmonic series whose absolute
    series diverges.
- id: q007
  type: multipleChoice
  skills:
  - solve-large-error-thresholds
  prompt: |
    For $\sum_{n=1}^{\infty}(-1)^{n-1}/\sqrt n$, what is the least $N$
    for which the alternating estimate guarantees $|R_N|<10^{-3}$?
  choices:
  - id: a
    text: $1{,}000{,}000$
  - id: b
    text: $999{,}999$
  - id: c
    text: $1000$
  - id: d
    text: $1{,}000{,}001$
  answer:
    choiceId: a
  explanation: |-
    The strict condition $1/\sqrt{N+1}<10^{-3}$ requires $N+1>10^6$, so the least integer N is one million.
- id: q008
  type: multipleChoice
  skills:
  - analyze-modulated-harmonic-series
  prompt: |
    For $0\le\theta<2\pi$, when does
    $\sum_{n=1}^{\infty}(-1)^n\cos(n\theta)/n$ fail to converge?
  choices:
  - id: a
    text: |-
      Only when $\theta=\pi$
  - id: b
    text: |-
      Only when $\theta=0$
  - id: c
    text: |-
      For every $\theta$
  - id: d
    text: |-
      For no $\theta$
  answer:
    choiceId: a
  explanation: |-
    The coefficient is $\cos(n(\theta+\pi))$; its partial sums are bounded except when the frequency is a multiple of $2\pi$, which here occurs at theta equals pi and leaves the harmonic series.
- id: q009
  type: multipleChoice
  skills:
  - justify-integral-series-interchange
  prompt: |
    Since $1/(n+1)=\int_0^1x^n\,dx$, what value follows for
    $\sum_{n=0}^{\infty}(-1)^n/(n+1)$?
  choices:
  - id: a
    text: |-
      $\ln2$
  - id: b
    text: $1/2$
  - id: c
    text: $1$
  - id: d
    text: |-
      $\pi/4$
  answer:
    choiceId: a
  explanation: |-
    Finite geometric sums integrate to a limit of $\int_0^1(1+x)^{-1}\,dx=\ln2$.
- id: q010
  type: multipleChoice
  skills:
  - analyze-infinite-bounded-displacement-permutations
  prompt: |
    Swap each adjacent pair in the alternating harmonic series:
    $$-\frac12+1-\frac14+\frac13-\frac16+\frac15-\cdots.$$
    What is its sum?
  choices:
  - id: a
    text: |-
      $\ln2$
  - id: b
    text: |-
      $-\ln2$
  - id: c
    text: $0$
  - id: d
    text: It diverges.
  answer:
    choiceId: a
  explanation: Every even partial sum equals the corresponding even partial sum before the swaps, and
    the odd-even discrepancy is a single term tending to zero.
- id: q011
  type: multipleChoice
  skills:
  - analyze-nth-root-perturbations
  prompt: |
    Classify $\sum_{n=2}^{\infty}(-1)^n(n^{1/n}-1)$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    Since $n^{1/n}-1\sim(\ln n)/n$, the magnitudes eventually decrease to zero while their positive sum diverges.
- id: q012
  type: multipleChoice
  skills:
  - analyze-logarithmic-increments
  prompt: |
    Determine the strongest classification of
    $\sum_{n=1}^{\infty}(-1)^{n-1}\ln(1+1/n)$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Finite after two terms
  answer:
    choiceId: a
  explanation: |-
    The magnitudes decrease and are asymptotic to $1/n$; their unsigned partial sums equal $\ln(N+1)$ and diverge.
- id: q013
  type: multipleChoice
  skills:
  - use-refined-alternating-remainder-bounds
  prompt: |
    For a positive-first alternating series with decreasing magnitudes
    $b_n$, and even $N$, which quantity has the same sign as $R_N=S-S_N$?
  choices:
  - id: a
    text: $b_{N+1}$
  - id: b
    text: $-b_{N+1}$
  - id: c
    text: $S_N$ always
  - id: d
    text: Its sign is undetermined
  answer:
    choiceId: a
  explanation: After an even truncation the first omitted term is positive, and the alternating tail retains
    that sign while having smaller magnitude.
- id: q014
  type: multipleChoice
  skills:
  - apply-dirichlet-to-trigonometric-series
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^n\sin(n)/n$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent because sine oscillates
  - id: d
    text: Telescoping
  answer:
    choiceId: a
  explanation: The modulated coefficients have bounded partial sums, so Dirichlet gives convergence; their
    absolute values have positive average and harmonic weighting, causing divergence.
- id: q015
  type: multipleChoice
  skills:
  - derive-euler-transformed-series
  prompt: |
    Which positive series is equal to $\ln2$ and converges geometrically
    after an Euler transformation?
  choices:
  - id: a
    text: |-
      $\sum_{n=1}^{\infty}1/(n2^n)$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}1/(2n)$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}1/n^2$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}2^{-n}$
  answer:
    choiceId: a
  explanation: |-
    Integrating the geometric identity $\sum_{n\ge0}x^n=1/(1-x)$ from zero to one half gives $\sum 1/(n2^n)=-\ln(1-1/2)=\ln2$.
