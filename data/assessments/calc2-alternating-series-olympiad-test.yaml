  prompt: |
    For $\sum_{n=1}^{\infty}(-1)^{n-1}/\sqrt n$, what is the least $N$
    for which the alternating estimate guarantees $|R_N|<10^{-3}$?
  choices:
  - id: a
    text: $1{,}000{,}000$
  - id: b
    text: $999{,}999$
  - id: c
    text: $1000$
  - id: d
    text: $1{,}000{,}001$
  answer:
    choiceId: a
  explanation: |-
    Solution: The strict condition $1/\sqrt{N+1}<10^{-3}$ requires $N+1>10^6$, so the least integer N is one million. Therefore the answer is $1{,}000{,}000$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $999{,}999$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $1000$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $1{,}000{,}001$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q008
  type: multipleChoice
  skills:
  - analyze-modulated-harmonic-series
  prompt: |
    For $0\le\theta<2\pi$, when does
    $\sum_{n=1}^{\infty}(-1)^n\cos(n\theta)/n$ fail to converge?
  choices:
  - id: a
    text: |-
      Only when $\theta=\pi$
  - id: b
    text: |-
      Only when $\theta=0$
  - id: c
    text: |-
      For every $\theta$
  - id: d
    text: |-
      For no $\theta$
  answer:
    choiceId: a
  explanation: |-
    Solution: The coefficient is $\cos(n(\theta+\pi))$; its partial sums are bounded except when the frequency is a multiple of $2\pi$, which here occurs at theta equals pi and leaves the harmonic series. Therefore the answer is Only when $\theta=\pi$.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: Only when $\theta=0$ conflicts with this criterion: Direct comparison uses nonnegative terms; For every $\theta$ conflicts with this criterion: Direct comparison uses nonnegative terms; For no $\theta$ conflicts with this criterion: Direct comparison uses nonnegative terms.
- id: q009
  type: multipleChoice
  skills:
  - justify-integral-series-interchange
  prompt: |
    Since $1/(n+1)=\int_0^1x^n\,dx$, what value follows for
    $\sum_{n=0}^{\infty}(-1)^n/(n+1)$?
  choices:
  - id: a
    text: |-
      $\ln2$
  - id: b
    text: $1/2$
  - id: c
    text: $1$
  - id: d
    text: |-
      $\pi/4$
  answer:
    choiceId: a
  explanation: |-
    Solution: Finite geometric sums integrate to a limit of $\int_0^1(1+x)^{-1}\,dx=\ln2$. Therefore the answer is $\ln2$.

    Why it works: First rewrite the term as $ar^n$. A geometric series converges exactly when $|r|<1$; its finite sum formula is valid only in that regime.

    Common trap: A negative ratio still needs $|r|<1$; alternating signs do not make $r=-1$ converge.

    Why the other choices fail: $1/2$ conflicts with this criterion: First rewrite the term as $ar^n$; $1$ conflicts with this criterion: First rewrite the term as $ar^n$; $\pi/4$ conflicts with this criterion: First rewrite the term as $ar^n$.
- id: q010
  type: multipleChoice
  skills:
  - analyze-infinite-bounded-displacement-permutations
  prompt: |
    Swap each adjacent pair in the alternating harmonic series:
    $$-\frac12+1-\frac14+\frac13-\frac16+\frac15-\cdots.$$
    What is its sum?
  choices:
  - id: a
    text: |-
      $\ln2$
  - id: b
    text: |-
      $-\ln2$
  - id: c
    text: $0$
  - id: d
    text: It diverges.
  answer:
    choiceId: a
  explanation: |-
    Solution: Every even partial sum equals the corresponding even partial sum before the swaps, and the odd-even discrepancy is a single term tending to zero. Therefore the answer is $\ln2$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $-\ln2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $0$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; It diverges. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
