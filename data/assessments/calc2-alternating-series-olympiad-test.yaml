- id: q004
  type: multipleChoice
  skills:
  - classify-harmonic-number-series
  prompt: |
    Classify $\displaystyle\sum_{n=1}^{\infty}(-1)^{n-1}H_n/n$, where
    $H_n=1+1/2+\cdots+1/n$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    Solution: The magnitudes eventually decrease to zero because $H_n=O(\ln n)$, while $\sum H_n/n$ dominates the harmonic series and diverges. Therefore the answer is Conditionally convergent.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: Absolutely convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent by the term test conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Geometric conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
