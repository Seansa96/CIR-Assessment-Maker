- id: q015
  type: multipleChoice
  skills:
  - derive-euler-transformed-series
  prompt: |
    Which positive series is equal to $\ln2$ and converges geometrically
    after an Euler transformation?
  choices:
  - id: a
    text: |-
      $\sum_{n=1}^{\infty}1/(n2^n)$
  - id: b
    text: |-
      $\sum_{n=1}^{\infty}1/(2n)$
  - id: c
    text: |-
      $\sum_{n=1}^{\infty}1/n^2$
  - id: d
    text: |-
      $\sum_{n=1}^{\infty}2^{-n}$
  answer:
    choiceId: a
  explanation: |-
    Solution: Integrating the geometric identity $\sum_{n\ge0}x^n=1/(1-x)$ from zero to one half gives $\sum 1/(n2^n)=-\ln(1-1/2)=\ln2$. Therefore the answer is $\sum_{n=1}^{\infty}1/(n2^n)$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\sum_{n=1}^{\infty}1/(2n)$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum_{n=1}^{\infty}1/n^2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum_{n=1}^{\infty}2^{-n}$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
