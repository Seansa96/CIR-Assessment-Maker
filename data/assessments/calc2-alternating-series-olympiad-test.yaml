- id: q001
  type: multipleChoice
  skills:
  - evaluate-alternating-zeta-values
  prompt: |
    Evaluate $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n^2}$.
  choices:
  - id: a
    text: |-
      $\pi^2/12$
  - id: b
    text: |-
      $\pi^2/6$
  - id: c
    text: |-
      $\pi^2/8$
  - id: d
    text: |-
      $\ln2$
  answer:
    choiceId: a
  explanation: |-
    Solution: Subtract twice the even reciprocal-square subseries from $\zeta(2)$ to get $(1-2^{1-2})\zeta(2)=\pi^2/12$. Therefore the answer is $\pi^2/12$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\pi^2/6$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\pi^2/8$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\ln2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q002
  type: multipleChoice
  skills:
  - connect-power-series-and-alternating-constants
  prompt: |
    What is $\displaystyle1-\frac13+\frac15-\frac17+\cdots$?
  choices:
  - id: a
    text: |-
      $\pi/4$
  - id: b
    text: |-
      $\ln2$
  - id: c
    text: $1/2$
  - id: d
    text: |-
      $\pi/2$
  answer:
    choiceId: a
  explanation: |-
    Solution: Integrating $1/(1+x^2)=1-x^2+x^4-\cdots$ from zero to one gives $\arctan1=\pi/4$. Therefore the answer is $\pi/4$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\ln2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $1/2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\pi/2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
