questions:
- id: q-dce9a1
  type: multipleChoice
  title: Identify the Curve (1)
  prompt: What type of curve is $r = 7\sin(2\theta)$?
  choices:
  - id: c1
    text: A 4-petaled rose
  - id: c2
    text: A 2-petaled rose
  - id: c3
    text: A circle
  - id: c4
    text: A limaçon
  answer:
    choiceId: c1
  explanation: For $r = a\sin(n\theta)$, if $n$ is even, there are $2n$ petals. Here
    $n=2$, so $4$ petals.
  skills:
  - polar-curves
