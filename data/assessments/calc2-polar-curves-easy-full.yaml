- id: q-e393c2
  type: symbolicResponse
  title: Cartesian to Polar (4)
  prompt: Convert $x^2 + y^2 = 25$ to a polar equation in terms of $r$. (Assume $r
    > 0$)
  answer:
    expectedLatex: '5'
    equivalenceMode: expression
    variables: []
    tolerance: 0.0001
  explanation: Since $r^2 = x^2 + y^2$, we have $r^2 = 25 \implies r = 5$.
  skills:
  - polar-curves
