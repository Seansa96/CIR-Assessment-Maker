lesson:
  introduction: 'When you revolve a curve around an axis, you generate a 3D surface
    (like an empty vase). The area of this surface is the **surface area of revolution**.

    This is different from volume, which is the amount of 3D space *inside* the shape.
    Surface area is the amount of 2D material needed to construct the outer shell.

    '
  sections:
  - id: derivation
    title: Derivation
    required: true
    content: 'We a\approximate the curve using tiny straight line segments, $ds$. When
      we revolve one of these tiny segments around an axis, it sweeps out a narrow
      band (the frustum of a cone).


      The surface area of a thin band is a\approximately its circumference multiplied
      by its slant height (the arc length segment $ds$).


      Area of band $\a\approx 2\pi \cdot (\text{radius}) \cdot ds$


      Since $ds = \sqrt{1 + [f''(x)]^2}\,dx$, we just need to determine the radius.

      '
    check:
      id: derivation-check
      type: multipleChoice
      prompt: In the formula for surface area, what does the $ds$ represent geometrically?
      choices:
      - id: a
        text: A tiny segment of arc length.
      - id: b
        text: The thickness of a disk.
      - id: c
        text: The circumference of the band.
      - id: d
        text: The derivative of the function.
      answer:
        choiceId: a
      explanation: '$ds$ is the differential arc length. The formula is literally
        summing up the areas of infinite tiny circular bands.

        '
  - id: formulas
    title: Surface Area Formulas
    required: true
    content: 'The radius depends on which axis you revolve around:


      **Revolving around the x-axis:**

      The radius is the vertical distance to the x-axis, which is $y = f(x)$.


      $$ S = \int_a^b 2\pi \cdot f(x) \cdot \sqrt{1 + [f''(x)]^2}\,dx $$


      **Revolving around the y-axis:**

      The radius is the\rhorizontal distance to the y-axis, which is $x$.


      $$ S = \int_a^b 2\pi \cdot x \cdot \sqrt{1 + [f''(x)]^2}\,dx $$


      (Or if integrating with respect to $y$, the radius is $g(y)$ when revolving
      around the y-axis).

      '
    check:
      id: formulas-check
      type: multipleChoice
      prompt: Set up the integral for the surface area of $y = \sin x$ on $[0, \pi]$
        revolved around the x-axis.
      choices:
      - id: a
        text: $2\pi \int_0^\pi \sin x \sqrt{1 + \cos^2 x}\,dx$
      - id: b
        text: $2\pi \int_0^\pi x \sqrt{1 + \cos^2 x}\,dx$
      - id: c
        text: $\pi \int_0^\pi \sin^2 x \,dx$
      - id: d
        text: $2\pi \int_0^\pi \sqrt{1 + \cos^2 x}\,dx$
      answer:
        choiceId: a
      explanation: 'Revolving around the x-axis means the radius is $y = \sin x$.
        The derivative is $\cos x$. Thus the integrand is $2\pi (\sin x) \sqrt{1 +
        (\cos x)^2}$.

        '
