schemaVersion: 1
id: chemistry-compounds-worked-example
title: Chemical Nomenclature Worked Examples
assessmentType: workedExample
categoryId: chemistry
subcategoryId: chemistry-compounds
subcategoryIds:
  - chemistry-compounds
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: naming-type-i-ii
    title: Naming Type I and Type II Ionic Compounds
    problem: |
      Name the following ionic compounds:
      (a) MgBr2
      (b) FeCl3
      (c) Cr2O3
      (d) Cu3N
    steps:
      - id: mgbr2
        title: (a) MgBr2 — Type I
        content: |
          - Mg is magnesium, a Group 2A metal → fixed 2+ charge → **Type I** (no Roman numeral needed)
          - Br is a halogen; as an anion it becomes **bromide**
          - Answer: **magnesium bromide**
      - id: fecl3
        title: (b) FeCl3 — Type II
        content: |
          - Fe is iron, a transition metal → variable charge → **Type II** (Roman numeral required)
          - Cl is Cl−; there are 3 Cl− ions → total anion charge = 3−
          - Iron must be 3+ to balance: Fe3+
          - Answer: **iron(III) chloride**
      - id: cr2o3
        title: (c) Cr2O3 — Type II
        content: |
          - Cr is chromium, a transition metal → **Type II**
          - O is O2−; 3 oxide ions → total anion charge = 6−
          - 2 chromium ions supply 6+, so each Cr = 3+ (Cr3+)
          - Answer: **chromium(III) oxide**
      - id: cu3n
        title: (d) Cu3N — Type II
        content: |
          - Cu is copper, a transition metal → **Type II**
          - N is N3− (nitride); 1 nitride ion → total anion charge = 3−
          - 3 copper ions supply 3+, so each Cu = 1+ (Cu+)
          - Answer: **copper(I) nitride**
    check:
      id: naming-check
      type: freeResponse
      prompt: |
        Name the compound PbCl4.
      answer:
        gradingMode: selfCheck
        keyPoints:
          - Lead (Pb) is a transition metal with variable charge — Type II.
          - 'Cl is Cl−; 4 chloride ions = 4− total.'
          - Lead must be 4+ (Pb4+).
          - Name is lead(IV) chloride.

  - id: formula-from-name
    title: Writing Formulas from Names
    problem: |
      Write the correct chemical formulas for:
      (a) tin(IV) oxide
      (b) dinitrogen pentoxide
      (c) iron(III) sulfate
    steps:
      - id: snO2
        title: '(a) Tin(IV) oxide'
        content: |
          - Tin(IV) → Sn4+
          - Oxide → O2−
          - Charges must balance: 4+ vs 2−. Need 2 oxygen ions for every 1 tin ion.
          - Formula: **SnO2**
      - id: n2o5
        title: '(b) Dinitrogen pentoxide'
        content: |
          - "Di-" = 2 nitrogen atoms
          - "Penta-" = 5 oxygen atoms
          - Formula: **N2O5**
          - (This is a molecular compound — use the prefixes directly as subscripts)
      - id: iron-sulfate
        title: '(c) Iron(III) sulfate'
        content: |
          - Iron(III) → Fe3+
          - Sulfate → SO4²−
          - Charges: 3+ and 2−. LCM of 3 and 2 is 6.
          - Need 2 Fe3+ (giving 6+) and 3 SO4²− (giving 6−)
          - Formula: **Fe2(SO4)3**

          Note the parentheses around SO4 with the subscript 3 outside.
    check:
      id: formula-check
      type: freeResponse
      prompt: |
        Write the formula for ammonium phosphate.
      answer:
        gradingMode: selfCheck
        keyPoints:
          - Ammonium is NH4+; phosphate is PO4³−.
          - Charges are 1+ and 3−. Need 3 ammonium ions and 1 phosphate ion to balance.
          - Formula is (NH4)3PO4.

  - id: identify-compound-type
    title: Identifying Compound Type from Formula
    problem: |
      For each formula, identify the compound type (Type I ionic, Type II ionic, molecular) and name it:
      (a) CCl4
      (b) BaO
      (c) SnCl2
    steps:
      - id: ccl4
        title: '(a) CCl4'
        content: |
          Carbon (C) and chlorine (Cl) are **both nonmetals** → **molecular compound**. Use prefixes.
          - C: only 1 atom → no "mono" prefix for first element
          - Cl: 4 atoms → "tetra-"
          - Name: **carbon tetrachloride** (also known as tetrachloromethane)
      - id: bao
        title: '(b) BaO'
        content: |
          Barium (Ba) is a **Group 2A metal** (fixed 2+ charge) + oxygen (nonmetal) → **Type I ionic**
          - Ba2+ balanced by O2− in a 1:1 ratio
          - Name: **barium oxide**
      - id: sncl2
        title: '(c) SnCl2'
        content: |
          Tin (Sn) is a **transition metal** (variable charge) + chlorine → **Type II ionic**
          - 2 Cl− ions → 2− total → Sn must be 2+ (Sn2+)
          - Name: **tin(II) chloride** (also called stannous chloride)
    check:
      id: compound-type-check
      type: multipleChoice
      prompt: |
        Which of the following compounds requires a Roman numeral in its name?
      choices:
        - id: a
          text: CrF3 — chromium is a variable-charge transition metal
        - id: b
          text: BaCl2 — barium is a fixed-charge alkaline earth metal
        - id: c
          text: PCl3 — both phosphorus and chlorine are nonmetals
        - id: d
          text: NaBr — sodium is a fixed-charge alkali metal
      answer:
        choiceId: a
      explanation: |
        CrF3 contains chromium, which is a transition metal with multiple possible oxidation states (+2, +3, +6). Therefore, a Roman numeral is required. The name is chromium(III) fluoride. BaCl2 (barium, fixed 2+) and NaBr (sodium, fixed 1+) are Type I — no Roman numeral. PCl3 is molecular — use prefixes, not Roman numerals.
