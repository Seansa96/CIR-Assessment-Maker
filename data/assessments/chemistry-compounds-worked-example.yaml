- id: example-1
  title: Name fixed- and variable-charge salts
  problem: Name CaCl2 and FeCl3 using the correct ionic path.
  steps:
  - id: step-naming-type-i-ii-1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Classify both formulas as ionic because each begins with a metal.
    explanation: 'Solution: Classify both formulas as ionic because each begins with a metal. Why it works: This step follows
      the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: step-naming-type-i-ii-2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Calcium has a fixed 2+ charge, so CaCl2 is calcium chloride.
    explanation: 'Solution: Calcium has a fixed 2+ charge, so CaCl2 is calcium chloride. Why it works: This step follows the
      topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: step-naming-type-i-ii-3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Three Cl- require Fe3+, so FeCl3 is iron(III) chloride.
    explanation: 'Solution: Three Cl- require Fe3+, so FeCl3 is iron(III) chloride. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: step-naming-type-i-ii-4
    title: Step 4
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 4 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Verify that each name communicates the ion ratio without molecular prefixes.
    explanation: 'Solution: Verify that each name communicates the ion ratio without molecular prefixes. Why it works: This
      step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
- id: example-2
  title: Write formulas from ionic names
  problem: Write aluminum oxide, copper(II) nitrate, and ammonium sulfate.
  steps:
  - id: step-formula-from-name-1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Balance Al3+ with O2- to obtain Al2O3.
    explanation: 'Solution: Balance Al3+ with O2- to obtain Al2O3. Why it works: This step follows the topic''s accounting
      rules and supplies a separate check before the final conclusion.'
  - id: step-formula-from-name-2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Balance Cu2+ with two nitrate ions to obtain Cu(NO3)2.
    explanation: 'Solution: Balance Cu2+ with two nitrate ions to obtain Cu(NO3)2. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: step-formula-from-name-3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Balance two NH4+ ions with SO4 2- to obtain (NH4)2SO4.
    explanation: 'Solution: Balance two NH4+ ions with SO4 2- to obtain (NH4)2SO4. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
- id: example-3
  title: Select and apply the molecular path
  problem: Name N2O4 and write the formula for phosphorus pentachloride.
  steps:
  - id: step-identify-compound-type-1
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Two nonmetals select the molecular-prefix system.
    explanation: 'Solution: Two nonmetals select the molecular-prefix system. Why it works: This step follows the topic''s
      accounting rules and supplies a separate check before the final conclusion.'
  - id: step-identify-compound-type-2
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - N2O4 becomes dinitrogen tetroxide after applying the vowel contraction.
    explanation: 'Solution: N2O4 becomes dinitrogen tetroxide after applying the vowel contraction. Why it works: This step
      follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: step-identify-compound-type-3
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Phosphorus pentachloride becomes PCl5; the omitted mono prefix implies one phosphorus.
    explanation: 'Solution: Phosphorus pentachloride becomes PCl5; the omitted mono prefix implies one phosphorus. Why it
      works: This step follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
