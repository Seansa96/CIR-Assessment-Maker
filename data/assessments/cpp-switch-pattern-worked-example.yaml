workedExamples:
- id: switch-menu
  title: Building an Interactive Menu
  problem: 'Write an interactive program that repeatedly asks the user for a command
    (1: Print Hello, 2: Print Time, 3: Exit). The program should use a loop and a
    `switch` statement to dispatch the commands, and stop when the user chooses 3.

    '
  steps:
  - id: step-switch-menu-1
    title: Set up a continuous loop
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "We'll use a `while (true)` loop to keep the menu running until the\
      \ user explicitly chooses to exit.\n\n```cpp\n#include <iostream>\nusing namespace\
      \ std;\n\nint main() {\n    int choice = 0;\n    \n    while (true) {\n    \
      \    cout << \"1. Print Hello\\n2. Print Time\\n3. Exit\\nChoice: \";\n    \
      \    cin >> choice;\n```\n"
  - id: step-switch-menu-2
    title: Use a switch statement for commands
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "Inside the loop, we use a `switch` on the `choice` variable.\n\n\
      ```cpp\n        switch (choice) {\n            case 1:\n                cout\
      \ << \"Hello!\\n\";\n                break;\n            case 2:\n         \
      \       cout << \"It's 12:00 PM\\n\";\n                break;\n```\n\nEach case\
      \ ends with `break;` so we don't accidentally execute the code for the next\
      \ case.\n"
  - id: step-switch-menu-3
    title: Handle the exit case and invalid input
    type: freeResponse
    answer:
      gradingMode: selfCheck
    prompt: Consider the explanation and continue to the next step.
    instruction: "When the user chooses 3, we can break out of the `while (true)`\
      \ loop. Wait! The `break` keyword inside a switch statement only breaks out\
      \ of the switch, not the loop. \n\nTo exit the whole program from `main`, we\
      \ can just `return 0;`. If we were in a different function, a boolean flag like\
      \ `keepRunning = false;` would be better. For the `default` case, we handle\
      \ invalid numbers.\n\n```cpp\n            case 3:\n                cout << \"\
      Goodbye.\\n\";\n                return 0; // Exits the whole program\n     \
      \       default:\n                cout << \"Invalid choice.\\n\";\n        \
      \        break;\n        }\n    }\n    return 0;\n}\n```\n"
  check:
    id: switch-break-check
    type: multipleChoice
    prompt: Inside a `while` loop that contains a `switch` statement, what happens
      if you write `break;` inside one of the `case` blocks?
    choices:
    - id: a
      text: It exits the `switch` statement, and the `while` loop continues to its
        next iteration.
    - id: b
      text: It exits the `while` loop entirely.
    - id: c
      text: It exits the whole function.
    - id: d
      text: It throws a compiler error.
    answer:
      choiceId: a
    explanation: '`break` applies to the innermost enclosing loop or switch. Inside
      a switch, it only breaks the switch, allowing the surrounding while loop to
      continue.

      '
