workedExamples:
  - id: ex-polynomial-inner-product
    title: Length and Orthogonality in C[0,1]
    problem: |
      Let $V = C[0, 1]$ be the vector space of continuous functions on the interval $[0, 1]$. 
      Define the inner product as $\langle f, g \rangle = \int_0^1 f(t)g(t) \, dt$.

      Let $p(t) = 1$ and $q(t) = t - \frac{1}{2}$.
      Determine if $p$ and $q$ are orthogonal, and find the length of $p$.
    steps:
      - id: step1
        title: Set up the inner product integral
        instruction: |
          To check if two vectors (functions) are orthogonal, we must compute their inner product. If it evaluates to $0$, they are orthogonal.

          Set up the integral: $\langle p, q \rangle = \int_0^1 p(t)q(t) \, dt = \int_0^1 (1)\left(t - \frac{1}{2}\right) \, dt$.
        type: multipleChoice
        prompt: |
          Evaluate the integral $\int_0^1 \left(t - \frac{1}{2}\right) \, dt$. What is the result?
        choices:
          - id: c1
            text: '$0$'
          - id: c2
            text: '$1$'
          - id: c3
            text: '$\frac{1}{2}$'
          - id: c4
            text: '$-\frac{1}{2}$'
        answer:
          choiceId: c1
        explanation: |
          The antiderivative is $\frac{1}{2}t^2 - \frac{1}{2}t$.
          Evaluating from 0 to 1 gives $\left(\frac{1}{2}(1)^2 - \frac{1}{2}(1)\right) - (0 - 0) = \frac{1}{2} - \frac{1}{2} = 0$.
          Because $\langle p, q \rangle = 0$, the functions $p(t)$ and $q(t)$ are orthogonal in this inner product space!

      - id: step2
        title: Compute the inner product of p with itself
        instruction: |
          The length (or norm) of a vector in an inner product space is defined as $\|p\| = \sqrt{\langle p, p \rangle}$.
          First, we must compute the inner product of $p(t)$ with itself.

          $\langle p, p \rangle = \int_0^1 p(t)p(t) \, dt = \int_0^1 (1)(1) \, dt$.
        type: numericResponse
        prompt: |
          Evaluate $\int_0^1 1 \, dt$.
        answer:
          value: 1
          tolerance: 0
        explanation: |
          The antiderivative is $t$. Evaluating from 0 to 1 gives $1 - 0 = 1$.
          So $\langle p, p \rangle = 1$.

      - id: step3
        title: Compute the length of p
        instruction: |
          Now apply the definition of length: $\|p\| = \sqrt{\langle p, p \rangle}$.
        type: numericResponse
        prompt: |
          What is the length of $p(t) = 1$ in the space $C[0,1]$?
        answer:
          value: 1
          tolerance: 0
        explanation: |
          $\|p\| = \sqrt{1} = 1$. This means $p(t) = 1$ acts as a "unit vector" in this particular inner product space.
          *(Fun fact: The length of $q(t)$ would be calculated via $\int_0^1 (t - 1/2)^2 dt = 1/12$, so its length is $1/\sqrt{12}$.)*
