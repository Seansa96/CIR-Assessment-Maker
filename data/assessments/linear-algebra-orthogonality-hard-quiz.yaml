questions:
  - id: hq-projection-onto-subspace
    type: multipleChoice
    prompt: |
      Let $W = \text{Span}\left\{ \vec{u}_1 = \begin{bmatrix}1\\1\\0\end{bmatrix},\ \vec{u}_2 = \begin{bmatrix}-1\\1\\0\end{bmatrix} \right\}$. 
      Note that $\vec{u}_1 \cdot \vec{u}_2 = -1+1+0 = 0$, so $\{\vec{u}_1, \vec{u}_2\}$ is already orthogonal.
      Find $\text{proj}_W \vec{y}$ where $\vec{y} = \begin{bmatrix}3\\1\\2\end{bmatrix}$.
    choices:
      - id: c1
        text: '$\begin{bmatrix}2\\2\\0\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}1\\3\\0\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}3\\1\\0\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}2\\0\\2\end{bmatrix}$'
    answer:
      choiceId: c3
    explanation: |
      Using the subspace projection formula with an orthogonal basis:
      $\hat{\vec{y}} = \frac{\vec{y}\cdot\vec{u}_1}{\vec{u}_1\cdot\vec{u}_1}\vec{u}_1 + \frac{\vec{y}\cdot\vec{u}_2}{\vec{u}_2\cdot\vec{u}_2}\vec{u}_2$

      $\vec{y}\cdot\vec{u}_1 = (3)(1)+(1)(1)+(2)(0) = 4$, $\|\vec{u}_1\|^2 = 1+1+0 = 2$.

      $\vec{y}\cdot\vec{u}_2 = (3)(-1)+(1)(1)+(2)(0) = -2$, $\|\vec{u}_2\|^2 = 1+1+0 = 2$.

      $\hat{\vec{y}} = \frac{4}{2}\begin{bmatrix}1\\1\\0\end{bmatrix} + \frac{-2}{2}\begin{bmatrix}-1\\1\\0\end{bmatrix}$
      $= 2\begin{bmatrix}1\\1\\0\end{bmatrix} + (-1)\begin{bmatrix}-1\\1\\0\end{bmatrix}$
      $= \begin{bmatrix}2\\2\\0\end{bmatrix} + \begin{bmatrix}1\\-1\\0\end{bmatrix} = \begin{bmatrix}3\\1\\0\end{bmatrix}$.

      Note that $\hat{\vec{y}} = \begin{bmatrix}3\\1\\0\end{bmatrix}$ is exactly $\vec{y}$ with its third component zeroed out, which makes sense geometrically: $W$ is the $xy$-plane (spanned by vectors with zero $z$-component), so projecting onto $W$ removes the $z$ contribution.

  - id: hq-orthogonal-complement-vector
    type: multipleChoice
    prompt: |
      Let $W = \text{Span}\left\{ \begin{bmatrix}1\\2\\3\end{bmatrix} \right\}$ in $\mathbb{R}^3$. Which of the following is in $W^\perp$?
    choices:
      - id: c1
        text: '$\begin{bmatrix}1\\2\\3\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}2\\-1\\0\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}3\\2\\1\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}1\\1\\1\end{bmatrix}$'
    answer:
      choiceId: c2
    explanation: |
      $\vec{v} \in W^\perp$ iff $\vec{v} \cdot \begin{bmatrix}1\\2\\3\end{bmatrix} = 0$.
      - A: $1+4+9 = 14 \neq 0$.
      - **B**: $2-2+0 = 0$. ✓
      - C: $3+4+3 = 10 \neq 0$.
      - D: $1+2+3 = 6 \neq 0$.

  - id: hq-gram-schmidt-result
    type: multipleChoice
    prompt: |
      Apply one step of Gram-Schmidt to $\vec{x}_1 = \begin{bmatrix}4\\0\end{bmatrix}$, $\vec{x}_2 = \begin{bmatrix}1\\1\end{bmatrix}$.
      What is the second orthogonal vector $\vec{v}_2$?
    choices:
      - id: c1
        text: '$\begin{bmatrix}0\\1\end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix}1\\0\end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix}-1\\1\end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix}1\\-1\end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      $\vec{v}_1 = \begin{bmatrix}4\\0\end{bmatrix}$.
      $\text{proj}_{\vec{v}_1}\vec{x}_2 = \frac{\vec{x}_2\cdot\vec{v}_1}{\vec{v}_1\cdot\vec{v}_1}\vec{v}_1 = \frac{4+0}{16}\begin{bmatrix}4\\0\end{bmatrix} = \frac{1}{4}\begin{bmatrix}4\\0\end{bmatrix} = \begin{bmatrix}1\\0\end{bmatrix}$.
      $\vec{v}_2 = \vec{x}_2 - \text{proj} = \begin{bmatrix}1\\1\end{bmatrix} - \begin{bmatrix}1\\0\end{bmatrix} = \begin{bmatrix}0\\1\end{bmatrix}$. ✓ Verify: $\begin{bmatrix}4\\0\end{bmatrix}\cdot\begin{bmatrix}0\\1\end{bmatrix} = 0$.
