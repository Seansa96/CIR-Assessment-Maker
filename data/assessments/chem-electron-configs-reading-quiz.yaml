schemaVersion: 1
id: chem-electron-configs-reading-quiz
title: Electron Configurations Reading Check
assessmentType: quiz
categoryId: chemistry
topicId: chem-electron-configs
modeDefault: practice
randomizeQuestions: false
questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Read the passage: “The Aufbau principle fills available subshells in order of increasing energy. For the first twenty elements, the sequence reaches $1s$, $2s$, $2p$, $3s$, $3p$, and then $4s$.” Which configuration violates this ordering?
    choices:
      - id: a
        text: $1s^2 2s^2 2p^6 3s^2$
      - id: b
        text: $1s^2 2s^2 2p^6 3s^2 3p^1$
      - id: c
        text: $1s^2 2s^2 2p^6 3p^1$
        issueSignals: [{ id: electron-configuration-aufbau-order-error, domains: [chemistry] }]
      - id: d
        text: $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$
    answer: { choiceId: c }
    explanation: 'Solution: The third configuration places an electron in $3p$ while $3s$ is not filled. Why it works: Aufbau requires the lower-energy $3s$ subshell to fill before $3p$. Why the other choices fail: They follow the stated sequence.'
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    difficultyEvidence: Reads an orbital-filling rule and locates a premature subshell transition.
    skills: [chem-electron-configs]
    subjectDifficultyTags: [electron-configurations]
  - id: q002
    type: multipleChoice
    prompt: |
      Read the passage: “The Pauli exclusion principle allows at most two electrons in one orbital. If two are present, they must have opposite spin because they already share $n$, $l$, and $m_l$.” Why can a $2p$ subshell hold six electrons?
    choices:
      - id: a
        text: It contains three orbitals, each holding two opposite-spin electrons.
      - id: b
        text: The $p$ subshell has six possible spin values in one orbital.
        issueSignals: [{ id: electron-configuration-subshell-capacity-error, domains: [chemistry] }]
      - id: c
        text: Hund’s rule permits six electrons in every orbital.
        issueSignals: [{ id: electron-configuration-pauli-exclusion-error, domains: [chemistry] }]
      - id: d
        text: The principal quantum number sets the capacity at $2n^2=8$.
        issueSignals: [{ id: electron-configuration-subshell-capacity-error, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: A $p$ subshell has three orbitals, and Pauli permits two opposite-spin electrons per orbital, giving $3\times2=6$. Why it works: Capacity comes from orbital count times two electrons per orbital. Why the other choices fail: One orbital has only two spin states, Hund’s rule does not raise orbital capacity, and $2n^2$ is the capacity of the entire shell.'
    difficultyDimensions: [modelOrDerivation, auxiliaryTechnique]
    difficultyEvidence: Combines the number of orbitals in a subshell with the Pauli two-electron limit.
    skills: [chem-electron-configs]
    subjectDifficultyTags: [electron-configurations]
  - id: q003
    type: multipleChoice
    prompt: |
      Read the passage: “Hund’s rule applies when orbitals in the same subshell have equal energy. Electrons occupy those orbitals singly with parallel spins before pairing.” Which orbital diagram best represents nitrogen’s $2p^3$ subshell?
    choices:
      - id: a
        text: $[\uparrow\downarrow]\ [\uparrow]\ [\,\,]$
        issueSignals: [{ id: electron-configuration-hunds-rule-error, domains: [chemistry] }]
      - id: b
        text: $[\uparrow]\ [\uparrow]\ [\uparrow]$
      - id: c
        text: $[\uparrow\downarrow]\ [\,\,]\ [\,\,]$
        issueSignals: [{ id: electron-configuration-hunds-rule-error, domains: [chemistry] }]
      - id: d
        text: $[\uparrow]\ [\downarrow]\ [\,\,]$
        issueSignals: [{ id: electron-configuration-hunds-rule-error, domains: [chemistry] }]
    answer: { choiceId: b }
    explanation: 'Solution: Nitrogen has three $2p$ electrons, so Hund’s rule places one parallel-spin electron in each of the three equal-energy orbitals. Why it works: Pairing is delayed until every degenerate orbital is occupied once. Why the other choices fail: They pair too early or use opposite spins before the subshell is singly filled.'
    difficultyDimensions: [representationTransfer, errorDiagnosis]
    difficultyEvidence: Interprets a prose filling rule as an orbital-box representation.
    skills: [chem-electron-configs]
    subjectDifficultyTags: [electron-configurations]
  - id: q004
    type: multipleChoice
    prompt: |
      Read the passage: “A noble-gas shorthand replaces the filled inner electrons with the symbol of the preceding noble gas. The remaining superscripts must still total the electrons outside that core.” Which shorthand correctly represents chlorine, $Z=17$?
    choices:
      - id: a
        text: $[Ne]3s^2 3p^5$
      - id: b
        text: $[He]2s^2 2p^5$
        issueSignals: [{ id: electron-configuration-noble-gas-core-error, domains: [chemistry] }]
      - id: c
        text: $[Ar]4s^1$
        issueSignals: [{ id: electron-configuration-electron-count-error, domains: [chemistry] }]
      - id: d
        text: $[Ne]3s^2 3p^6$
        issueSignals: [{ id: electron-configuration-electron-count-error, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: Chlorine has 17 electrons: the neon core supplies 10, then $3s^2 3p^5$ supplies 7 more. Why it works: The shorthand uses the preceding noble gas and preserves the total electron count. Why the other choices fail: They use the wrong core or add the wrong number of outer electrons.'
    difficultyDimensions: [representationTransfer, modelOrDerivation]
    difficultyEvidence: Converts atomic number into a valid noble-gas core plus outer-subshell count.
    skills: [chem-electron-configs]
    subjectDifficultyTags: [electron-configurations]
  - id: q005
    type: multipleChoice
    prompt: |
      Read the passage: “For a main-group atom, valence electrons are the electrons in the highest occupied principal shell. They help explain bonding and periodic behavior.” What are the valence electrons in $[Ne]3s^2 3p^4$?
    choices:
      - id: a
        text: The six electrons in $3s^2 3p^4$
      - id: b
        text: The ten electrons in the $[Ne]$ core
        issueSignals: [{ id: electron-configuration-valence-shell-error, domains: [chemistry] }]
      - id: c
        text: Only the four electrons in $3p^4$
        issueSignals: [{ id: electron-configuration-valence-shell-error, domains: [chemistry] }]
      - id: d
        text: All fourteen electrons in the atom
        issueSignals: [{ id: electron-configuration-electron-count-error, domains: [chemistry] }]
    answer: { choiceId: a }
    explanation: 'Solution: The valence count is $3s^2+3p^4=6$. Why it works: Both occupied subshells have the highest principal quantum number, $n=3$. Why the other choices fail: The neon core is inner-shell, $3p$ alone omits $3s$, and the total electron count is not the valence count.'
    difficultyDimensions: [modelOrDerivation, errorDiagnosis]
    difficultyEvidence: Reads shell notation and separates the highest principal shell from the inner noble-gas core.
    skills: [chem-electron-configs]
    subjectDifficultyTags: [electron-configurations]
  - id: q006
    type: multipleChoice
    prompt: |
      Read the passage: “When a transition-metal cation forms, electrons are removed from the highest principal quantum number first, even if a lower-energy $d$ subshell is written earlier in the neutral atom’s configuration.” Which configuration is correct for $Fe^{2+}$?
    choices:
      - id: a
        text: $[Ar]4s^2 3d^4$
        issueSignals: [{ id: electron-configuration-cation-removal-error, domains: [chemistry] }]
      - id: b
        text: $[Ar]3d^6$
      - id: c
        text: $[Ar]4s^1 3d^5$
        issueSignals: [{ id: electron-configuration-cation-removal-error, domains: [chemistry] }]
      - id: d
        text: $[Ar]3d^4$
        issueSignals: [{ id: electron-configuration-electron-count-error, domains: [chemistry] }]
    answer: { choiceId: b }
    explanation: 'Solution: Neutral iron is $[Ar]4s^2 3d^6$; remove both $4s$ electrons first to obtain $[Ar]3d^6$. Why it works: Ionization removes from the shell with the largest $n$ before the $3d$ electrons. Why the other choices fail: They remove from $3d$ first or remove too many electrons.'
    difficultyDimensions: [modelOrDerivation, errorDiagnosis, representationTransfer]
    difficultyEvidence: Applies the stated ionization rule to reconcile neutral-atom writing order with cation formation.
    skills: [chem-electron-configs]
    subjectDifficultyTags: [electron-configurations]
