questions:
- id: q001
  type: symbolicResponse
  prompt: What is the coefficient of $(x-1)^2$ in the series for $\sqrt{3-x}$ centered at $x=1$?
  choices: []
  answer:
    choiceId: 
    choiceIds: []
    expected: 
    gradingMode: 
    expectedLatex: -1/(16\sqrt{2})
    equivalenceMode: expression
    variables:
    - x
    value: 
    tolerance: 0
    media: []
    keyPoints: []
    circuitAnswer: 
    graphingAnswer: 
  explanation: >
    Solution: Write $\sqrt{3-x}=\sqrt2\,(1-(x-1)/2)^{1/2}$. Its quadratic coefficient is $\sqrt2(-1/8)(1/4)=-1/(16\sqrt2)$. 


    Why it works: The $u^2$ coefficient for $(1+u)^{1/2}$ is $-1/8$, and $u=-(x-1)/2$.
