        text: Migration can help load but hurt locality.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Migration can help load but hurt locality. Related topic: Multiple Processor Systems.'
  - id: distributed-contrast
    title: Distributed contrast
    required: true
    content: 'Distributed systems lack shared memory and must handle network delay, partial failure, and message protocols.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Multiple Processor Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
