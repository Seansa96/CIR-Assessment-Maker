lesson:
  introduction: This deeper lesson expands Multiple Processor Systems from Chapter 8 of the Modern Operating Systems reference structure. It focuses on mechanism, boundary, tradeoff, and common failure modes rather than memorized labels.
  sections:
  - id: parallelism-vs-speedup
    title: Parallelism versus speedup
    required: true
    content: 'More CPUs create potential parallelism, but locks, serial sections, memory bandwidth, and scheduling overhead limit speedup.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Multiple Processor Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: parallelism-vs-speedup-deep-check
      title: 'Check: Parallelism versus speedup'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Parallelism versus speedup**?
      choices:
      - id: a
        text: More cores do not guarantee proportional speedup.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'More cores do not guarantee proportional speedup. Related topic: Multiple Processor Systems.'
  - id: shared-memory
    title: Shared memory
    required: true
    content: 'Shared-memory systems make communication convenient but require synchronization and cache coherence.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Multiple Processor Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: shared-memory-deep-check
      title: 'Check: Shared memory'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Shared memory**?
      choices:
      - id: a
        text: Shared address space increases both power and risk.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Shared address space increases both power and risk. Related topic: Multiple Processor Systems.'
  - id: cache-coherence
    title: Cache coherence
    required: true
    content: 'Coherence keeps cached copies of shared memory from becoming mutually inconsistent.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Multiple Processor Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: cache-coherence-deep-check
      title: 'Check: Cache coherence'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Cache coherence**?
      choices:
      - id: a
        text: Coherence does not replace locking.
      - id: b
        text: The issue is only terminology and has no effect on resource management or protection.
      - id: c
        text: The application can always bypass the operating system safely if it needs more speed.
      - id: d
        text: Adding faster hardware removes the need to reason about this design choice.
      answer:
        choiceId: a
      explanation: 'Coherence does not replace locking. Related topic: Multiple Processor Systems.'
    media:
    - type: image
      src: /assessments/operating-systems/multiprocessor/cache-coherence.svg
      alt: Two CPUs with private caches and shared memory showing a stale cached value.
      caption: Cache coherence keeps shared-memory views compatible.
  - id: affinity-load
    title: Affinity and load balancing
    required: true
    content: 'Schedulers balance work while trying to preserve cache warmth and processor affinity.


      Decision habit: ask what boundary, resource, or policy is being controlled. For Multiple Processor Systems, the safe answer usually names both the mechanism and its tradeoff.'
    check:
      id: affinity-load-deep-check
      title: 'Check: Affinity and load balancing'
      type: multipleChoice
      prompt: Which statement best captures the important idea behind **Affinity and load balancing**?
      choices:
