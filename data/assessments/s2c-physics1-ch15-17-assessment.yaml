questions:
  - id: q-s2c-phys1-ch15-shm-01
    type: numericResponse
    skills:
      - shm-period-mass-spring
    prompt: |
      A $0.50 \text{ kg}$ mass is attached to a spring with a spring constant of $50.0 \text{ N/m}$. The mass oscillates on a frictionless horizontal surface. What is the period of the oscillation?
      
      Provide your answer in seconds. Use $\pi \approx 3.14159$.
    answer:
      gradingMode: automatic
      value: 0.628
      tolerance: 0.05
    explanation: |
      The period of a mass-spring system is given by:
      $T = 2\pi\sqrt{\frac{m}{k}}$
      
      Substitute the given values:
      $T = 2\pi\sqrt{\frac{0.50}{50.0}} = 2\pi\sqrt{0.01} = 2\pi(0.1) \approx 0.6283 \text{ s}$

  - id: q-s2c-phys1-ch16-waves-01
    type: numericResponse
    skills:
      - traveling-wave-speed-frequency
    prompt: |
      A traveling wave has a wavelength of $2.0 \text{ m}$ and a frequency of $5.0 \text{ Hz}$. What is the wave speed?
      
      Provide your answer in m/s.
    answer:
      gradingMode: automatic
      value: 10.0
      tolerance: 0.1
    explanation: |
      The wave speed is related to wavelength and frequency by:
      $v = \lambda f$
      
      Substitute the given values:
      $v = (2.0 \text{ m})(5.0 \text{ Hz}) = 10.0 \text{ m/s}$

  - id: q-s2c-phys1-ch17-sound-01
    type: numericResponse
    skills:
      - sound-wave-speed
    prompt: |
      What is the approximate speed of sound in air when the temperature is $20^\circ \text{C}$?
      
      Provide your answer in m/s using the approximation $v \approx 331 + 0.6T$.
    answer:
      gradingMode: automatic
      value: 343.0
      tolerance: 1.0
    explanation: |
      Using the empirical approximation formula for the speed of sound in air:
      $v \approx 331 + 0.6T$
      
      Substitute $T = 20^\circ \text{C}$:
      $v \approx 331 + 0.6(20) = 331 + 12 = 343 \text{ m/s}$
