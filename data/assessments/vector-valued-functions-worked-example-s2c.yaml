workedExamples:
- id: example-001
  title: Build a tangent line to a space curve
  problem: For $\mathbf r(t)=\langle t^2,2t,t^3\rangle$, find the tangent line at $t=1$ and the unit tangent vector there.
  steps:
  - id: s001
    title: Find the point
    instruction: Evaluate the position vector at the specified parameter.
    hint: Substitute 1 into all three component functions.
    type: symbolicResponse
    prompt: Enter $\mathbf r(1)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle1,2,1\rangle
      equivalenceMode: expression
      variables: []
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf r(1)=\langle1^2,2(1),1^3\rangle=\langle1,2,1\rangle$.

      Why it works: A vector function's component values give the coordinates of the curve point at that parameter.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: parameter-orientation-error
      domains: []
  - id: s002
    title: Differentiate componentwise
    instruction: Compute the tangent/velocity vector function.
    hint: Differentiate $t^2$, $2t$, and $t^3$ separately.
    type: symbolicResponse
    prompt: Enter $\mathbf r'(t)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle2t,2,3t^2\rangle
      equivalenceMode: expression
      variables:
      - t
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf r'(t)=\langle2t,2,3t^2\rangle$.

      Why it works: The derivative of a vector function is obtained by differentiating each component function.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: parametric-derivative-error
      domains: []
  - id: s003
    title: Evaluate the tangent direction
    instruction: Use the specified parameter in the derivative.
    hint: Substitute $t=1$ into $\langle2t,2,3t^2\rangle$.
    type: symbolicResponse
    prompt: Enter $\mathbf r'(1)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle2,2,3\rangle
      equivalenceMode: expression
      variables: []
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf r'(1)=\langle2,2,3\rangle$.

      Why it works: At a parameter value with nonzero derivative, the derivative supplies the tangent-line direction.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: tangent-vector-role-error
      domains: []
  - id: s004
    title: Measure tangent-vector length
    instruction: Compute the magnitude needed to normalize the tangent vector.
    hint: Use the square root of the sum of squared components.
    type: numericResponse
    prompt: What is $|\langle2,2,3\rangle|$?
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: 
      equivalenceMode: 
      variables: []
      value: 4.123105626
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $|\langle2,2,3\rangle|=\sqrt{4+4+9}=\sqrt{17}$.

      Why it works: Magnitude is the Euclidean length of the tangent-vector components.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: magnitude-formula-error
      domains: []
  - id: s005
    title: Normalize the direction
    instruction: Divide the tangent vector by its magnitude.
    hint: Divide every component of $\langle2,2,3\rangle$ by $\sqrt{17}$.
    type: symbolicResponse
    prompt: Enter the unit tangent vector $\mathbf T(1)$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle2/\sqrt{17},2/\sqrt{17},3/\sqrt{17}\rangle
      equivalenceMode: expression
      variables: []
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf T(1)=\langle2/\sqrt{17},2/\sqrt{17},3/\sqrt{17}\rangle$.

      Why it works: Dividing by $|\mathbf r'(1)|$ retains tangent direction and changes its magnitude to one.
    media: []
    language: 
    functionName: 
    executionMode: unspecified
    starterCode: 
    tests: 
    issueSignals:
    - id: unit-tangent-normalization-error
      domains: []
  - id: s006
    title: Write and check the tangent line
    instruction: Use the curve point and tangent direction to form a line.
    hint: A tangent line is point plus a scalar times the tangent direction.
    type: symbolicResponse
    prompt: Enter a vector equation for the tangent line, using parameter $s$.
    choices: []
    answer:
      choiceId: 
      choiceIds: []
      expected: 
      gradingMode: 
      expectedLatex: \langle1,2,1\rangle+s\langle2,2,3\rangle
      equivalenceMode: expression
      variables:
      - s
      value: 
      tolerance: 0.000001
      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >
      Solution: $\mathbf L(s)=\langle1,2,1\rangle+s\langle2,2,3\rangle$.

      Why it works: At $s=0$ the line passes through $\mathbf r(1)$, and its direction is $\mathbf r'(1)$, so it is tangent to the curve there.
    media: []
