workedExamples:
- id: example-001
  title: Build the representation
  problem: 'For $\mathbf r(t)=\langle t^2,2t,1-t\rangle$, find the tangent vector at $t=1$.'
  steps:
  - id: s001
    title: Differentiate components
    instruction: 'What is $\mathbf r''(t)$?'
    type: multipleChoice
    prompt: 'What is $\mathbf r''(t)$?'
    choices:
    - id: a
      text: '$\langle2t,2,-1\rangle$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: parametric-derivative-error
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: parametric-derivative-error
    answer:
      choiceId: a
    issueSignals:
    - id: parametric-derivative-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle2t,2,-1\rangle$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Parametric Curves.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
