      - id: sign-error
    - id: d
      text: '$\langle2t,-\sin t,3\rangle$ (answers ''Differentiate $\mathbf r(t)=\langle t^2,\cos t,3t\rangle$.'', not ''What
        is $\mathbf r''(t)$?'')'
