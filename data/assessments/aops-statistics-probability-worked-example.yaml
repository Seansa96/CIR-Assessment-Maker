workedExamples:
- id: aops-stat-we-1
  title: 'Average Speed Trap'
  prompt: 'A car travels from City A to City B at a constant speed of 40 mph. It returns along the exact same route from City B to City A at a constant speed of 60 mph. What is the car''s average speed for the entire round trip?'
  steps:
  - id: step-1
    title: Set up the time equation
    prompt: Let the distance between the two cities be $D$. Write expressions for the time taken for the outbound trip and the return trip.
    difficultyDimensions:
    - Use Time = Distance / Speed.
    - Outbound time = $D/40$.
    - Return time = $D/60$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $T_{\text{out}} = \frac{D}{40}$.
      - $T_{\text{return}} = \frac{D}{60}$.
    explanation: |
      Solution:
      Using the formula $T = \frac{D}{R}$ (Time = Distance / Rate), we calculate the time for each leg of the trip.
      Let $D$ be the one-way distance between City A and City B.
      The outbound time is $T_1 = \frac{D}{40}$.
      The return time is $T_2 = \frac{D}{60}$.

      Why it works:
      The most common mistake in this problem is averaging the two speeds $(40+60)/2 = 50$. This is incorrect because the car spends *more time* driving at 40 mph than at 60 mph, so the true average must be weighted towards 40.
  - id: step-2
    title: Find the total time
    prompt: Add the two times together to find the total time for the round trip in terms of $D$.
    difficultyDimensions:
    - Find a common denominator for $D/40 + D/60$.
    - Add the fractions.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $\frac{D}{40} + \frac{D}{60} = \frac{3D}{120} + \frac{2D}{120} = \frac{5D}{120}$.
      - Total Time = $\frac{D}{24}$.
    explanation: |
      Solution:
      The total time for the round trip is the sum of $T_1$ and $T_2$:
      $$T_{\text{total}} = \frac{D}{40} + \frac{D}{60}$$
      Find a common denominator (120):
      $$T_{\text{total}} = \frac{3D}{120} + \frac{2D}{120} = \frac{5D}{120}$$
      Simplify the fraction:
      $$T_{\text{total}} = \frac{D}{24}$$

      Why it works:
      We now have a single expression representing the entire duration of the trip, regardless of what $D$ actually is.
  - id: step-3
    title: Calculate the average speed
    prompt: Divide the total distance for the round trip by the total time to find the average speed.
    difficultyDimensions:
    - Total distance = $2D$.
    - Average speed = $2D / (D/24)$.
    - The $D$'s cancel.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total distance = $2D$.
      - $\text{Average Speed} = \frac{2D}{D/24}$.
      - $\text{Average Speed} = 48$.
    explanation: |
      Solution:
      The average speed for the entire trip is the Total Distance divided by the Total Time.
      The car drove from A to B and back, so the total distance is $2D$.
      $$\text{Average Speed} = \frac{2D}{D/24}$$
      To divide by a fraction, multiply by the reciprocal:
      $$\text{Average Speed} = 2D \times \frac{24}{D}$$
      The $D$'s cancel out completely:
      $$\text{Average Speed} = 2 \times 24 = 48 \text{ mph}$$
      The average speed is 48 mph.

      Why it works:
      Notice that $48$ is strictly less than the arithmetic mean of 50. What we calculated here is called the **harmonic mean**: $\frac{2}{\frac{1}{40} + \frac{1}{60}}$.

- id: aops-stat-we-2
  title: 'Combinatorial Probability'
  prompt: 'A standard deck of 52 cards contains 4 Aces. If you are dealt a hand of 5 cards at random, what is the probability that you receive exactly 2 Aces?'
  steps:
  - id: step-1
    title: Determine the total sample space
    prompt: How many different 5-card hands can be dealt from a 52-card deck?
    difficultyDimensions:
    - Recognize that order doesn't matter, so use combinations.
    - Set up $\binom{52}{5}$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Total hands $= \binom{52}{5}$.
    explanation: |
      Solution:
      The total number of possible outcomes (the denominator of our probability) is the number of ways to choose 5 cards from 52, where the order does not matter.
      This is given by the combination formula:
      $$\text{Total} = \binom{52}{5}$$

      Why it works:
      This is the standard baseline for all poker-style probability questions.
  - id: step-2
    title: Count the favorable outcomes
    prompt: To get exactly 2 Aces, you must choose 2 Aces from the available Aces, AND 3 non-Aces from the remaining cards. Calculate the number of ways to do this.
    difficultyDimensions:
    - Ways to choose 2 Aces: $\binom{4}{2}$.
    - Ways to choose 3 non-Aces from 48 non-Aces: $\binom{48}{3}$.
    - Multiply them.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Favorable hands = $\binom{4}{2} \times \binom{48}{3}$.
    explanation: |
      Solution:
      We need to construct a hand that meets our exact condition.
      Step 1: Choose 2 Aces. There are 4 Aces in the deck, so there are $\binom{4}{2} = 6$ ways to do this.
      Step 2: Choose 3 non-Aces to complete the 5-card hand. There are $52 - 4 = 48$ non-Aces in the deck. We must choose 3 of them. There are $\binom{48}{3}$ ways to do this.
      Because these choices are independent parts of the same hand, we multiply them:
      $$\text{Favorable} = \binom{4}{2} \times \binom{48}{3}$$

      Why it works:
      Splitting the deck into "cards we want" and "cards we don't want", and choosing from those separate pools, is the definitive strategy for combinatorial probability.
  - id: step-3
    title: Write the probability
    prompt: Combine the numerator and denominator to express the final probability (you do not need to expand the factorials).
    difficultyDimensions:
    - Set up the fraction: Favorable / Total.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $P(\text{2 Aces}) = \frac{\binom{4}{2} \binom{48}{3}}{\binom{52}{5}}$.
    explanation: |
      Solution:
      The probability of an event is the number of favorable outcomes divided by the total number of outcomes.
      $$P = \frac{\binom{4}{2} \binom{48}{3}}{\binom{52}{5}}$$
      This evaluates to roughly 4%, but leaving it in combinatorial notation is standard practice in advanced math unless requested otherwise.

      Why it works:
      This distribution is formally known as the Hypergeometric Distribution, representing probability without replacement.

- id: aops-stat-we-3
  title: 'Geometric Probability: Meeting Times'
  prompt: 'Alice and Bob agree to meet at a café between 12:00 PM and 1:00 PM. Each will arrive at a random time within that hour and wait exactly 15 minutes for the other person before leaving. What is the probability that they successfully meet?'
  steps:
  - id: step-1
    title: Define the sample space geometrically
    prompt: Let $x$ be Alice's arrival time in minutes past 12:00, and $y$ be Bob's arrival time. Graph the total sample space of their possible arrival times on a coordinate plane. What is the area of this region?
    difficultyDimensions:
    - Identify $0 \le x \le 60$ and $0 \le y \le 60$.
    - The sample space is a $60 \times 60$ square.
    - Area = 3600.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The sample space is a square bounded by $0 \le x \le 60$ and $0 \le y \le 60$.
      - Total Area = $60 \times 60 = 3600$.
    explanation: |
      Solution:
      Since they arrive independently at random continuous times within the hour, we can map their arrival times to a 2D coordinate plane.
      Let $x \in [0, 60]$ be Alice's arrival minute.
      Let $y \in [0, 60]$ be Bob's arrival minute.
      Every possible combination $(x,y)$ forms a $60 \times 60$ square on the Cartesian plane.
      The total area of the sample space is $60 \times 60 = 3600$.

      Why it works:
      By converting time into continuous coordinates, we transform a very difficult continuous probability problem into a simple geometry problem.
  - id: step-2
    title: Graph the success condition
    prompt: Write an inequality that represents Alice and Bob meeting (i.e., their arrival times are within 15 minutes of each other). Shade this region inside the $60 \times 60$ square.
    difficultyDimensions:
    - Write $|x - y| \le 15$.
    - This translates to $y \le x + 15$ and $y \ge x - 15$.
    - Identify the shape of the success region (a diagonal band).
    answer:
      gradingMode: selfCheck
      keyPoints:
      - They meet if $|x - y| \le 15$.
      - The region is the area between the lines $y = x + 15$ and $y = x - 15$ inside the square.
    explanation: |
      Solution:
      They will successfully meet if the absolute difference between their arrival times is less than or equal to 15 minutes:
      $$|x - y| \le 15$$
      This absolute value inequality splits into two lines:
      $y \le x + 15$ (Alice arrives first, Bob arrives within 15 mins)
      $y \ge x - 15$ (Bob arrives first, Alice arrives within 15 mins)
      Graphing these two lines inside the $60 \times 60$ square creates a diagonal band running from the bottom-left to the top-right.

      Why it works:
      The points inside this band represent every exact combination of times where they intersect at the café.
  - id: step-3
    title: Calculate the favorable area
    prompt: Instead of calculating the area of the awkward diagonal band directly, calculate the area of the two triangles outside the band, and subtract them from the total area. Find the probability.
    difficultyDimensions:
    - Identify the two triangles as right isosceles triangles with leg $60 - 15 = 45$.
    - Calculate their combined area: $45 \times 45 = 2025$.
    - Favorable Area = $3600 - 2025 = 1575$.
    - Probability = $1575 / 3600 = 7/16$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The two empty corner regions are triangles with legs 45.
      - Area of the two triangles $= 2 \times \frac{1}{2}(45)(45) = 2025$.
      - Favorable area $= 3600 - 2025 = 1575$.
      - Probability $= \frac{1575}{3600} = \frac{7}{16}$.
    explanation: |
      Solution:
      The region outside the diagonal band consists of two large right triangles in the top-left and bottom-right corners of the square.
      The top-left triangle has vertices $(0, 15), (0, 60), (45, 60)$. It has base 45 and height 45.
      The bottom-right triangle has vertices $(15, 0), (60, 0), (60, 45)$. It also has base 45 and height 45.
      The combined area of these two triangles (which form a $45 \times 45$ square) is:
      $$\text{Area}_{\text{miss}} = 45 \times 45 = 2025$$
      The area of the success band is the total area minus the missing area:
      $$\text{Area}_{\text{meet}} = 3600 - 2025 = 1575$$
      The probability they meet is the favorable area divided by the total area:
      $$P = \frac{1575}{3600} = \frac{63}{144} = \frac{7}{16}$$

      Why it works:
      Subtractive geometry is almost always the easiest way to solve geometric probability problems.
