items:
- id: difference-squares-formula
  type: typed
  prompt: Complete $a^2-b^2=$ ____.
  answer:
    expected: '(a-b)(a+b)'
    aliases: ['$(a-b)(a+b)$']
  explanation: The mixed terms cancel when the conjugate binomials multiply.
  tags: [difference-of-squares]
- id: binomial-square-plus
  type: typed
  prompt: Complete $(a+b)^2=a^2+$ ____ $+b^2$.
  answer:
    expected: 2ab
    aliases: ['$2ab$']
  explanation: The two cross products contribute $2ab$.
  tags: [perfect-square]
- id: binomial-square-minus
  type: typed
  prompt: Complete $(a-b)^2=a^2-$ ____ $+b^2$.
  answer:
    expected: 2ab
    aliases: ['$2ab$']
  explanation: Both cross products are negative.
  tags: [perfect-square]
- id: difference-cubes-formula
  type: flashcard
  prompt: State the factorization of $a^3-b^3$.
  answer:
    expected: (a-b)(a squared plus ab plus b squared).
    aliases: ['$(a-b)(a^2+ab+b^2)$']
  explanation: The quadratic factor uses a positive middle term.
  tags: [difference-of-cubes]
- id: sum-cubes-formula
  type: flashcard
  prompt: State the factorization of $a^3+b^3$.
  answer:
    expected: (a+b)(a squared minus ab plus b squared).
    aliases: ['$(a+b)(a^2-ab+b^2)$']
  explanation: The quadratic factor uses the opposite sign in its middle term.
  tags: [sum-of-cubes]
- id: symmetric-square-rule
  type: typed
  prompt: Complete $a^2+b^2=(a+b)^2-$ ____.
  answer:
    expected: 2ab
    aliases: ['$2ab$']
  explanation: Expanding the square adds the cross term $2ab$.
  tags: [symmetry]
- id: symmetric-cube-rule
  type: flashcard
  prompt: Express $a^3+b^3$ using $a+b$ and $ab$.
  answer:
    expected: (a+b) cubed minus 3ab times (a+b).
    aliases: ['$(a+b)^3-3ab(a+b)$']
  explanation: Rearrange the expansion of $(a+b)^3$.
  tags: [symmetry]
- id: reciprocal-square-rule
  type: flashcard
  prompt: If $x+1/x=t$, what is $x^2+1/x^2$?
  answer:
    expected: t squared minus 2.
    aliases: ['$t^2-2$']
  explanation: Squaring produces the cross term $2$.
  tags: [reciprocal-symmetry]
- id: reciprocal-recurrence
  type: flashcard
  prompt: For $R_n=x^n+x^{-n}$ and $t=x+1/x$, state a recurrence for $R_{n+1}$.
  answer:
    expected: R sub n plus 1 equals t R sub n minus R sub n minus 1.
    aliases: ['$R_{n+1}=tR_n-R_{n-1}$']
  explanation: Multiply $R_n$ by $x+1/x$ and collect neighboring powers.
  tags: [reciprocal-symmetry]
- id: grouping-cue
  type: flashcard
  prompt: What is the goal of factoring by grouping?
  answer:
    expected: Make separate groups expose the same factor, then factor that shared expression.
  explanation: The shared factor becomes a factor of the whole expression.
  tags: [grouping]
- id: purposeful-zero-cue
  type: flashcard
  prompt: Why does adding and subtracting the same term preserve an expression?
  answer:
    expected: The net change is zero.
  explanation: The term is chosen to create a useful identity, not to change value.
  tags: [purposeful-zero]
- id: cancellation-condition
  type: flashcard
  prompt: What condition permits cancellation of a factor?
  answer:
    expected: The cancelled factor must be nonzero, with its zero case handled separately when relevant.
  explanation: Cancellation is division by that factor.
  tags: [cancellation]
