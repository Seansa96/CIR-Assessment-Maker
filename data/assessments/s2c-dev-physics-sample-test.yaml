questions:
- id: q000
  type: freeResponse
  skills:
  - kinetic-friction-incline
  prompt: A 30 kg block slides down an incline angled at 25 degrees. The coefficient of kinetic friction is 0.3. What is the kinetic friction force?
  answer:
    gradingMode: selfCheck
    expected: 79.94 N
  explanation: On an incline, N = mg*cos(theta). f_k = mu * mg * cos(theta) = 0.3 * 30 * 9.8 * cos(25) = 79.94 N.
- id: q001
  type: freeResponse
  skills:
  - calculate-drag
  prompt: A 10 kg object with drag coefficient 0.5 and cross-sectional area 0.2 m^2 falls through air (density 1.2 kg/m^3) at 8 m/s. What is the drag force?
  answer:
    gradingMode: selfCheck
    expected: 3.84 N
  explanation: F_D = 0.5 * C * rho * A * v^2 = 0.5 * 0.5 * 1.2 * 0.2 * 8^2 = 3.84 N.
- id: q002
  type: freeResponse
  skills:
  - calculate-drag
  prompt: A 20 kg object with drag coefficient 0.5 and cross-sectional area 0.2 m^2 falls through air (density 1.2 kg/m^3) at 8 m/s. What is the drag force?
  answer:
    gradingMode: selfCheck
    expected: 3.84 N
  explanation: F_D = 0.5 * C * rho * A * v^2 = 0.5 * 0.5 * 1.2 * 0.2 * 8^2 = 3.84 N.
- id: q003
  type: freeResponse
  skills:
  - max-static-friction
  prompt: A 5 kg block sits on a horizontal surface with a coefficient of static friction of 0.9. What is the maximum static friction force?
  answer:
    gradingMode: selfCheck
    expected: 44.1 N
  explanation: Use f_s = mu * N where N = mg. f_s = 0.9 * (5 * 9.8) = 44.1 N.
- id: q004
  type: freeResponse
  skills:
  - calculate-fc
  prompt: A 5 kg object moves in a circle of radius 0.5 m at a constant speed of 2 m/s. What is the centripetal force?
  answer:
    gradingMode: selfCheck
    expected: 40.0 N
  explanation: Use F_c = m*v^2/r. F_c = 5 * 2^2 / 0.5 = 40.0 N.
- id: q005
  type: freeResponse
  skills:
  - calculate-cg
  prompt: A 25 kg mass is at x=2 m and a 100 kg mass is at x=5 m. Where is the center of gravity?
  answer:
    gradingMode: selfCheck
    expected: 4.4 m
  explanation: x_cg = (m1*x1 + m2*x2) / (m1+m2) = (25*2 + 100*5) / (25+100) = 4.4 m.
- id: q006
  type: freeResponse
  skills:
  - calculate-stress
  prompt: A rod of length 1.5 m and cross-sectional area 0.01 m^2 is subjected to a stretching force of 50 N. What is the tensile stress?
  answer:
    gradingMode: selfCheck
    expected: 5000.0 Pa
  explanation: Stress = F / A = 50 / 0.01 = 5000.0 Pa.
- id: q007
  type: freeResponse
  skills:
  - vertical-forces
  prompt: A 20 kg block is supported symmetrically by two vertical ropes. An additional downward force of 500 N is applied. What is the tension in each rope?
  answer:
    gradingMode: selfCheck
    expected: 348.0 N
  explanation: 'Sum of forces in y is zero: 2T = mg + F. 2T = 20*9.8 + 500. T = 348.0 N.'
- id: q008
  type: freeResponse
  skills:
