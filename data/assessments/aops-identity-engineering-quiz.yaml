questions:
  - id: q001
    type: numericResponse
    prompt: |
      If

      $$
      x+\frac{1}{x}=4,
      $$

      find $x^2+\frac{1}{x^2}$ without solving for $x$.
    answer:
      value: 14
      tolerance: 0.000001
    explanation: |
      Force the target through the square:

      $$
      \left(x+\frac1x\right)^2=x^2+2+\frac1{x^2}.
      $$

      Therefore the target is $4^2-2=14$.

      Related topic: symmetric reciprocal identities.

  - id: q002
    type: numericResponse
    prompt: |
      Given $a-b=3$ and $ab=5$, find $a^2+b^2$.
    answer:
      value: 19
      tolerance: 0.000001
    explanation: |
      Manufacture the target from

      $$
      (a-b)^2=a^2-2ab+b^2.
      $$

      Thus $a^2+b^2=(a-b)^2+2ab=9+10=19$.

      Related topic: creating a target from a binomial-square identity.

  - id: q003
    type: symbolicResponse
    prompt: |
      Simplify for $x^2\ne1$:

      $$
      \frac{x^4-1}{x^2-1}.
      $$
    answer:
      expectedLatex: 'x^2+1'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Force a difference of squares:

      $$
      x^4-1=(x^2-1)(x^2+1).
      $$

      Cancel the common factor on the stated domain.

      Related topic: choosing the correct level of factorization.

  - id: q004
    type: numericResponse
    prompt: |
      Evaluate $99^2$ mentally by creating a convenient identity.
    answer:
      value: 9801
      tolerance: 0.000001
    explanation: |
      Write $99=100-1$:

      $$
      99^2=(100-1)^2=10000-200+1=9801.
      $$

      Related topic: creating a nearby-base square.

  - id: q005
    type: multipleChoice
    prompt: |
      Which engineered rewrite most directly proves that $n^3-n$ is divisible by $6$
      for every integer $n$?
    choices:
      - id: a
        text: '$n^3-n=n(n-1)(n+1)$'
      - id: b
        text: '$n^3-n=n(n^2+1)$'
      - id: c
        text: '$n^3-n=(n-1)^3$'
      - id: d
        text: '$n^3-n=n^2(n-1)$'
    answer:
      choiceId: a
    explanation: |
      The factorization creates three consecutive integers. One is divisible by $3$, and
      at least one is even, so their product is divisible by $6$.

      Related topic: factorization engineered for divisibility.

  - id: q006
    type: symbolicResponse
    prompt: |
      Simplify:

      $$
      \frac{1}{\sqrt{x+1}+\sqrt{x}}.
      $$
    answer:
      expectedLatex: '\sqrt{x+1}-\sqrt{x}'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Multiply by the conjugate form of one:

      $$
      \frac{\sqrt{x+1}-\sqrt{x}}{\sqrt{x+1}-\sqrt{x}}.
      $$

      The denominator becomes $(x+1)-x=1$.

      Related topic: manufacturing a difference of squares with a conjugate.

  - id: q007
    type: numericResponse
    prompt: |
      If $x+y=10$ and $xy=21$, find $x^2+y^2$ without solving for $x$ and $y$.
    answer:
      value: 58
      tolerance: 0.000001
    explanation: |
      Use

      $$
      (x+y)^2=x^2+2xy+y^2.
      $$

      Hence $x^2+y^2=100-42=58$.

      Related topic: symmetric polynomial identities.

  - id: q008
    type: symbolicResponse
    prompt: |
      Simplify:

      $$
      (x-1)(x+1)+1.
      $$
    answer:
      expectedLatex: 'x^2'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Recognize the difference of squares:

      $$
      (x-1)(x+1)=x^2-1.
      $$

      The added $1$ repairs the missing constant, leaving $x^2$.

      Related topic: reversible use of difference-of-squares identities.

  - id: q009
    type: numericResponse
    prompt: |
      Evaluate mentally:

      $$
      202^2-198^2.
      $$
    answer:
      value: 1600
      tolerance: 0.000001
    explanation: |
      Do not square both numbers. Force a difference of squares:

      $$
      (202-198)(202+198)=4\cdot400=1600.
      $$

      Related topic: selecting form before computation.

  - id: q010
    type: symbolicResponse
    prompt: |
      Factor completely:

      $$
      x^4+4.
      $$
    answer:
      expectedLatex: '(x^2-2x+2)(x^2+2x+2)'
      equivalenceMode: expression
      variables:
        - x
      tolerance: 0.000001
    explanation: |
      Add and subtract $4x^2$:

      $$
      x^4+4=(x^2+2)^2-(2x)^2.
      $$

      Then factor the engineered difference of squares.

      Related topic: Sophie Germain identity.

  - id: q011
    type: symbolicResponse
    prompt: |
      Decompose into a telescoping difference:

      $$
      \frac{1}{k(k+1)}.
      $$
    answer:
      expectedLatex: '\frac{1}{k}-\frac{1}{k+1}'
      equivalenceMode: expression
      variables:
        - k
      tolerance: 0.000001
    explanation: |
      The neighboring denominator factors suggest one fraction over each:

      $$
      \frac1k-\frac1{k+1}
      =\frac{k+1-k}{k(k+1)}.
      $$

      Related topic: partial fractions designed for telescoping.

  - id: q012
    type: numericResponse
    prompt: |
      Given

      $$
      p+\frac{1}{p}=3,
      $$

      find

      $$
      p^3+\frac{1}{p^3}
      $$

      without solving for $p$.
    answer:
      value: 18
      tolerance: 0.000001
    explanation: |
      Cube the known symmetric expression:

      $$
      \left(p+\frac1p\right)^3
      =
      p^3+\frac1{p^3}+3\left(p+\frac1p\right).
      $$

      Therefore,

      $$
      p^3+\frac1{p^3}=3^3-3(3)=18.
      $$

      Related topic: higher symmetric reciprocal identities.


