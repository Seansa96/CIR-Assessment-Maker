questions:
- id: olympiad-test-q134
  type: multipleChoice
  prompt: A tangent from $P$ to a radius-9 circle has $OP=15$. Find the tangent length.
  choices:
  - {id: a, text: '$6$'}
  - {id: b, text: '$9$'}
  - {id: c, text: '$12$'}
  - {id: d, text: '$24$'}
  answer: {choiceId: c}
  explanation: Radius and tangent are perpendicular, so $PT=\sqrt{15^2-9^2}=12$.
- id: olympiad-test-q114
  type: multipleChoice
  prompt: A radius-13 circle has parallel chords of lengths $10$ and $24$ on the same side of the center. Find the distance between the chords.
  choices:
  - {id: a, text: '$5$'}
  - {id: b, text: '$7$'}
  - {id: c, text: '$12$'}
  - {id: d, text: '$17$'}
  answer: {choiceId: b}
  explanation: Their center distances are $12$ and $5$, so same-side separation is $7$.
- id: olympiad-test-q144
  type: multipleChoice
  prompt: A $6$-by-$8$ rectangle is inscribed in a circle. Find the circle's area.
  choices:
  - {id: a, text: '$13\pi$'}
  - {id: b, text: '$25\pi$'}
  - {id: c, text: '$50\pi$'}
  - {id: d, text: '$100\pi$'}
  answer: {choiceId: b}
  explanation: The rectangle diagonal $10$ is a diameter, so radius is $5$.
- id: olympiad-test-q124
  type: multipleChoice
  prompt: An equilateral triangle of side $6\sqrt3$ is inscribed in a circle. Find the circle's area.
  choices:
  - {id: a, text: '$12\pi$'}
  - {id: b, text: '$18\pi$'}
  - {id: c, text: '$36\pi$'}
  - {id: d, text: '$108\pi$'}
  answer: {choiceId: c}
  explanation: An equilateral triangle has circumradius $s/\sqrt3=6$.
- id: olympiad-test-q104
  type: multipleChoice
  prompt: Two circles of radius $10$ have centers $12$ units apart. Find their common chord length.
  choices:
  - {id: a, text: '$8$'}
  - {id: b, text: '$12$'}
  - {id: c, text: '$16$'}
  - {id: d, text: '$20$'}
  answer: {choiceId: c}
  explanation: Half the chord is $\sqrt{10^2-6^2}=8$.
- id: olympiad-test-q135
  type: multipleChoice
  prompt: A chord in a radius-6 circle subtends a $90^\circ$ central angle. Find the area of the minor circular segment.
  choices:
  - {id: a, text: '$9\pi-18$'}
  - {id: b, text: '$9\pi+18$'}
  - {id: c, text: '$18\pi-9$'}
  - {id: d, text: '$36\pi-18$'}
  answer: {choiceId: a}
  explanation: Subtract right-triangle area $18$ from quarter-sector area $9\pi$.
- id: olympiad-test-q115
  type: multipleChoice
  prompt: An annulus has constant width $2$ and area $20\pi$. Find its inner radius.
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$4$'}
  - {id: c, text: '$5$'}
  - {id: d, text: '$8$'}
  answer: {choiceId: b}
  explanation: $\pi[(r+2)^2-r^2]=20\pi$ gives $4r+4=20$, so $r=4$.
- id: olympiad-test-q145
  type: multipleChoice
  prompt: Tangents $PA,PB$ form $\angle APB=120^\circ$ to a radius-6 circle. Find $PA$.
  choices:
  - {id: a, text: '$2\sqrt3$'}
  - {id: b, text: '$3\sqrt3$'}
  - {id: c, text: '$6$'}
  - {id: d, text: '$6\sqrt3$'}
  answer: {choiceId: a}
  explanation: Half the tangent angle is $60^\circ$, so right triangle $OAP$ is $30$-$60$-$90$ with $OA=6$ opposite $60^\circ$ and $PA=2\sqrt3$.
- id: olympiad-test-q125
  type: multipleChoice
  prompt: A circle centered at the origin passes through $(5,12)$. Which line is tangent at that point?
  choices:
  - {id: a, text: '$5x+12y=169$'}
  - {id: b, text: '$12x+5y=169$'}
  - {id: c, text: '$5x-12y=0$'}
  - {id: d, text: '$x+y=17$'}
  answer: {choiceId: a}
  explanation: Radius vector $(5,12)$ is a normal, and $5(5)+12(12)=169$.
- id: olympiad-test-q105
  type: multipleChoice
  prompt: A circle passes through $(0,0),(4,0),(0,6)$. Find its area.
  choices:
  - {id: a, text: '$10\pi$'}
  - {id: b, text: '$13\pi$'}
  - {id: c, text: '$26\pi$'}
  - {id: d, text: '$52\pi$'}
  answer: {choiceId: b}
  explanation: The three points form a right triangle whose hypotenuse has squared length $52$; the circumradius is half the hypotenuse, so $r^2=13$.
- id: olympiad-test-q136
  type: multipleChoice
  prompt: A square is circumscribed about a circle of area $16\pi$. Find the area outside the circle but inside the square.
  choices:
  - {id: a, text: '$16-4\pi$'}
  - {id: b, text: '$32-16\pi$'}
  - {id: c, text: '$64-16\pi$'}
  - {id: d, text: '$64-4\pi$'}
  answer: {choiceId: c}
  explanation: Radius is $4$, square side is diameter $8$, and subtracting gives $64-16\pi$.
- id: olympiad-test-q116
  type: multipleChoice
  prompt: A chord of length $16$ in a radius-10 circle subtends a minor sector. What is the cosine of half the central angle?
  choices:
  - {id: a, text: '$3/5$'}
  - {id: b, text: '$4/5$'}
  - {id: c, text: '$5/4$'}
  - {id: d, text: '$8/5$'}
  answer: {choiceId: a}
  explanation: The half-chord is $8$ and center distance is $6$; in the half-triangle, cosine of the half-angle is $6/10=3/5$.
- id: olympiad-test-q146
  type: selectAll
  prompt: Which configurations force a right angle?
  choices:
  - {id: a, text: A radius and tangent at their common circle point.}
  - {id: b, text: A center segment to the midpoint of a non-diameter chord.}
  - {id: c, text: Any radius and any chord.}
  - {id: d, text: The line of centers and common chord of two intersecting circles.}
  answer:
    choiceIds: [a, b, d]
  explanation: Each selected configuration follows from a tangent or perpendicular-bisector theorem.
- id: olympiad-test-q126
  type: selectAll
  prompt: Which quantities are invariant under rotating a chord around the center while keeping its length fixed?
  choices:
  - {id: a, text: Its distance from the center.}
  - {id: b, text: The minor central angle it subtends.}
  - {id: c, text: Its endpoints' coordinate values.}
  - {id: d, text: The area of its minor circular segment.}
  answer:
    choiceIds: [a, b, d]
  explanation: Rotation changes coordinates but preserves all distances, angles, and areas.
- id: olympiad-test-q106
  type: freeResponse
  prompt: Prove that every chord of a radius-$r$ circle has length at most $2r$, with equality exactly for a diameter.
  media:
  - {type: image, src: /assessments/aops/aops-circles-structure.svg, alt: Circle centered at O showing a diameter and a chord not through the center.}
  answer:
    gradingMode: selfCheck
    expected: |-
      For chord endpoints $A,B$, triangle inequality in $\triangle AOB$ gives $AB\le AO+OB=2r$. Equality in the triangle inequality occurs exactly when $A,O,B$ are collinear with $O$ between $A$ and $B$. In that case $AB$ passes through the center and is a diameter. Conversely, every diameter has length $2r$.
    keyPoints:
    - Forms triangle $AOB$ from the chord and two radii.
    - Applies $AB\le AO+OB$.
    - Uses $AO=OB=r$.
    - Characterizes equality as the diameter case.
  explanation: The extremal chord result is an equality case of the triangle inequality.
