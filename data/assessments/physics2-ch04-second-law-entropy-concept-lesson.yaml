lesson:
  introduction: >
    This lesson develops a repeatable way to solve Entropy and Irreversibility problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch04-second-law-entropy-s1
    title: Name the model and quantities
    required: true
    content: >
      Entropy and Irreversibility uses Delta S = integral(dQ_rev/T). In the name the model and quantities stage, identify a reversible reference path and track the system rather than the surroundings.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Entropy and Irreversibility problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch04-second-law-entropy-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Entropy and Irreversibility, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use Delta S = integral(dQ_rev/T) after you identify a reversible reference path and track the system rather than the surroundings.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Entropy and Irreversibility problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch04-second-law-entropy-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables Delta S = integral(dQ_rev/T) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch04-second-law-entropy-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Entropy and Irreversibility.
        media: []
        issueSignals:
        - id: physics2-physics2-ch04-second-law-entropy-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
