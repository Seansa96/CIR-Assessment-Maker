title: Entropy and Irreversibility
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-second-law-thermodynamics
lesson:
  introduction: This lesson develops the key ideas in Entropy and Irreversibility.
  sections:
  - id: l3-sec1
    title: Defining Entropy
    required: true
    content: 'Entropy $S$ is a state variable related to the disorder or multiplicity of a system. For
      a reversible, infinitesimal process, the change in entropy is defined as:

      $$dS = \frac{dQ_r}{T}$$

      where $dQ_r$ is the heat absorbed reversibly at temperature $T$.'
  - id: l3-sec2
    title: Calculating Entropy Change
    required: true
    content: 'The total entropy change between states $i$ and $f$ is:

      $$\Delta S = \int_i^f \frac{dQ_r}{T}$$


      Because entropy is a state function, $\Delta S$ is the same regardless of whether the actual process
      is reversible or irreversible, as long as it connects the same initial and final states. We calculate
      it by substituting a reversible path between the states.'
  - id: l3-sec3
    title: Entropy in the Universe
    required: true
    content: 'The Second Law of Thermodynamics can be restated in terms of entropy: The total entropy
      of an isolated system (or the universe) never decreases.

      $$\Delta S_{univ} \ge 0$$

      For reversible processes, $\Delta S_{univ} = 0$. For irreversible (real) processes, $\Delta S_{univ}
      > 0$.'
