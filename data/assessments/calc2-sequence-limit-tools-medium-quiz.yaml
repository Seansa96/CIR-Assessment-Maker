- id: q001
  type: multipleChoice
  prompt: |
    Which tool best decides the limit?

    $$
    a_n=\frac{7n^4-2n}{3n^4+n^2}
    $$
  choices:
  - id: a
    text: |-
      Dominant-term comparison; it converges to $\frac73$.
  - id: b
    text: Squeeze theorem; it converges to 0.
  - id: c
    text: Subsequence test; it diverges.
  - id: d
    text: Monotone bounded theorem; it converges to 7.
  answer:
    choiceId: a
  explanation: |-
    Solution: For rational expressions, divide by the highest power of $n$. The leading coefficient ratio is $\frac73$. Therefore the answer is Dominant-term comparison; it converges to $\frac73$.. Therefore the answer is Dominant-term comparison; it converges to $\frac73$.. Therefore the answer is Dominant-term comparison; it converges to $\frac73$..

    Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.

    Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.

