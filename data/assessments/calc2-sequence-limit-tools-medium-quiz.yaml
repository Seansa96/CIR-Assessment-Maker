questions:
  - id: q001
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\frac{7n^4-2n}{3n^4+n^2}
      $$
    choices:
      - id: a
        text: Dominant-term comparison; it converges to $\frac73$.
      - id: b
        text: Squeeze theorem; it converges to 0.
      - id: c
        text: Subsequence test; it diverges.
      - id: d
        text: Monotone bounded theorem; it converges to 7.
    answer:
      choiceId: a
    explanation: |
      For rational expressions, divide by the highest power of $n$. The leading coefficient ratio is $\frac73$.
  - id: q002
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\frac{\sin(4n)}{n}
      $$
    choices:
      - id: a
        text: Squeeze theorem; it converges to 0.
      - id: b
        text: Dominant terms; it diverges to infinity.
      - id: c
        text: Subsequence test; it diverges by oscillation.
      - id: d
        text: Exponential limit; it converges to $e^4$.
    answer:
      choiceId: a
    explanation: |
      Since $-1\le \sin(4n)\le 1$, the sequence is squeezed between $-\frac1n$ and $\frac1n$.
  - id: q003
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\sqrt{n^2+5n}-n
      $$
    choices:
      - id: a
        text: Rationalization; it converges to $\frac52$.
      - id: b
        text: Squeeze theorem; it converges to 0.
      - id: c
        text: Subsequence test; it diverges.
      - id: d
        text: Direct substitution; it converges to 5.
    answer:
      choiceId: a
    explanation: |
      Multiply by the conjugate to avoid the $\infty-\infty$ form:

      $$
      \frac{5n}{\sqrt{n^2+5n}+n}\to\frac52.
      $$
  - id: q004
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\left(1-\frac2n\right)^n
      $$
    choices:
      - id: a
        text: Standard exponential limit; it converges to $e^{-2}$.
      - id: b
        text: Dominant-term comparison; it converges to $-2$.
      - id: c
        text: Squeeze theorem; it converges to 0.
      - id: d
        text: Subsequence test; it diverges.
    answer:
      choiceId: a
    explanation: |
      This matches $\left(1+\frac cn\right)^n\to e^c$ with $c=-2$.
  - id: q005
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=(-1)^n\left(2+\frac1n\right)
      $$
    choices:
      - id: a
        text: Subsequence test; it diverges by oscillation.
      - id: b
        text: Squeeze theorem; it converges to 0.
      - id: c
        text: Dominant terms; it converges to 2.
      - id: d
        text: Rationalization; it converges to 1.
    answer:
      choiceId: a
    explanation: |
      The even terms approach $2$ and the odd terms approach $-2$, so the sequence has no single limit.
  - id: q006
    type: multipleChoice
    prompt: |
      Which conclusion is justified for the recursively defined sequence?

      $$
      a_1=1,\qquad a_{n+1}=\frac{a_n+6}{4}
      $$
    choices:
      - id: a
        text: It converges to 2 if it can be shown monotone and bounded.
      - id: b
        text: It diverges because recursive sequences never converge.
      - id: c
        text: It converges to 6 by direct substitution.
      - id: d
        text: It oscillates between 1 and 6.
    answer:
      choiceId: a
    explanation: |
      If the sequence converges to $L$, then $L=\frac{L+6}{4}$, so $L=2$. A monotone-bounded argument justifies convergence.
  - id: q007
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\frac{\ln(n^2)}{\ln(n^5)}
      $$
    choices:
      - id: a
        text: Logarithm laws; it converges to $\frac25$.
      - id: b
        text: Squeeze theorem; it converges to 0.
      - id: c
        text: Exponential limit; it converges to $e^2$.
      - id: d
        text: Subsequence test; it diverges.
    answer:
      choiceId: a
    explanation: |
      Use $\ln(n^k)=k\ln n$. The ratio becomes $\frac{2\ln n}{5\ln n}=\frac25$.
  - id: q008
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\frac{3^n-2^n}{3^n+2^n}
      $$
    choices:
      - id: a
        text: Divide by the dominant exponential; it converges to 1.
      - id: b
        text: Divide by $n$; it converges to 3.
      - id: c
        text: Squeeze theorem; it converges to 0.
      - id: d
        text: Subsequence test; it diverges.
    answer:
      choiceId: a
    explanation: |
      Divide numerator and denominator by $3^n$. The $\left(\frac23\right)^n$ terms vanish.
  - id: q009
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\frac{n^2}{2^n}
      $$
    choices:
      - id: a
        text: Growth-rate comparison; it converges to 0.
      - id: b
        text: Dominant polynomial terms; it diverges to infinity.
      - id: c
        text: Subsequence test; it diverges.
      - id: d
        text: Rationalization; it converges to 2.
    answer:
      choiceId: a
    explanation: |
      Exponential growth beats polynomial growth, so $\frac{n^2}{2^n}\to 0$.
  - id: q010
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\cos\left(\frac1n\right)
      $$
    choices:
      - id: a
        text: Continuity; it converges to 1.
      - id: b
        text: Squeeze theorem; it converges to 0.
      - id: c
        text: Subsequence test; it diverges.
      - id: d
        text: Dominant terms; it diverges to infinity.
    answer:
      choiceId: a
    explanation: |
      Since $\frac1n\to 0$ and cosine is continuous, $\cos(1/n)\to \cos 0=1$.
  - id: q011
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\frac{n+\sin n}{n}
      $$
    choices:
      - id: a
        text: Squeeze the error term; it converges to 1.
      - id: b
        text: Subsequence test; it diverges because $\sin n$ oscillates.
      - id: c
        text: Dominant terms; it converges to 0.
      - id: d
        text: Exponential limit; it converges to $e$.
    answer:
      choiceId: a
    explanation: |
      Rewrite as $1+\frac{\sin n}{n}$. The second term is squeezed to $0$.
  - id: q012
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\sqrt[n]{7}
      $$
    choices:
      - id: a
        text: Logarithms; it converges to 1.
      - id: b
        text: Direct substitution; it converges to 7.
      - id: c
        text: Squeeze theorem; it converges to 0.
      - id: d
        text: Subsequence test; it diverges.
    answer:
      choiceId: a
    explanation: |
      Write $\sqrt[n]{7}=e^{(\ln 7)/n}$. Since $(\ln 7)/n\to 0$, the sequence converges to $1$.
  - id: q013
    type: multipleChoice
    prompt: |
      Which conclusion is correct?

      $$
      a_n=\frac{1+(-1)^n}{2}
      $$
    choices:
      - id: a
        text: It diverges because the subsequences approach 0 and 1.
      - id: b
        text: It converges to $\frac12$ by averaging.
      - id: c
        text: It converges to 0 by squeezing.
      - id: d
        text: It diverges to infinity.
    answer:
      choiceId: a
    explanation: |
      A sequence must settle term-by-term. Alternating between $0$ and $1$ means there is no limit.
  - id: q014
    type: multipleChoice
    prompt: |
      Which tool best decides the limit?

      $$
      a_n=\frac{5n^3+n}{\sqrt{4n^6+1}}
      $$
    choices:
      - id: a
        text: Dominant powers; it converges to $\frac52$.
      - id: b
        text: Squeeze theorem; it converges to 0.
      - id: c
        text: Rationalization; it converges to 5.
      - id: d
        text: Subsequence test; it diverges.
    answer:
      choiceId: a
    explanation: |
      The numerator behaves like $5n^3$ and the denominator behaves like $\sqrt{4n^6}=2n^3$, so the limit is $\frac52$.
  - id: q015
    type: multipleChoice
    prompt: |
      Which conclusion is most appropriate?

      $$
      a_n=\frac{1}{n}+\frac{1}{n+1}+\cdots+\frac{1}{2n}
      $$
    choices:
      - id: a
        text: Converges to $\ln 2$ by a Riemann-sum/integral interpretation.
      - id: b
        text: Converges to 0 because each term goes to 0.
      - id: c
        text: Diverges to infinity by harmonic behavior.
      - id: d
        text: Diverges by oscillation.
    answer:
      choiceId: a
    explanation: |
      Rewrite as $\frac1n\sum_{k=0}^{n}\frac{1}{1+k/n}$, which approaches $\int_0^1\frac{1}{1+x}\,dx=\ln 2$.
