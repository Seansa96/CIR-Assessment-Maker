workedExamples:
- id: we-rolling-1
  title: Cylinder on an Incline
  problem: A solid cylinder of mass $M$ and radius $R$ rolls without slipping down an incline of angle $\theta = 30^\circ$. Find the acceleration of the center of mass.
  steps:
  - id: we-rolling-1-step1
    title: 'Step 1: Force Decomposition'
    instruction: Set up the force and torque equations. Consider gravity, the normal force, and static friction $f_s$. Let $x$ be parallel to the incline downwards.
    prompt: Write the equations.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/worked-examples/rolling-incline-fbd.png
      alt: A cylinder rolling down an incline with Gravity, Normal, and Friction vectors labeled.
      caption: FBD of rolling motion.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'Translation parallel to incline: $Mg\sin\theta - f_s = Ma_{cm}$'
      - 'Translation perpendicular: $F_N - Mg\cos\theta = 0$'
      - 'Rotation about CM: $f_s R = I\alpha$'
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'

- id: rolling-we002
  title: Energy of a Rolling Hoop
  problem: 'A hoop of mass $2.0\ \mathrm{kg}$ and radius $0.40\ \mathrm{m}$ rolls without slipping at $3.0\ \mathrm{m/s}$. Find its total kinetic energy.'
  steps:
  - id: rwe4
    title: Write both energy terms
    instruction: Use $I=mR^2$ and $\omega=v/R$ for a hoop.
    type: symbolicResponse
    prompt: Express the total kinetic energy in terms of $m$ and $v$.
    answer: { expectedLatex: 'mv^2', equivalenceMode: expression, tolerance: 0 }
    explanation: 'Solution: $K=\tfrac12mv^2+\tfrac12(mR^2)(v/R)^2=mv^2$.

      Why it works: A hoop has equal translational and rotational kinetic-energy contributions.'
  - id: rwe5
    title: Evaluate the kinetic energy
    instruction: Substitute the mass and speed.
    type: numericResponse
    prompt: What is the total kinetic energy in joules?
    answer: { value: 18, tolerance: 0.01 }
    explanation: 'Solution: $K=mv^2=(2.0)(3.0)^2=18\ \mathrm{J}$.

      Why it works: The result from the preceding energy expression applies directly.'
  - id: we-rolling-1-step2
    title: 'Step 2: Solve for Acceleration'
    instruction: Substitute the rolling constraint $a_{cm} = \alpha R$ and $I = \frac{1}{2}MR^2$ to find $a_{cm}$.
    prompt: What is $a_{cm}$ in terms of $g$ and $\theta$?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $f_s = \frac{I\alpha}{R} = \frac{\frac{1}{2}MR^2(a_{cm}/R)}{R} = \frac{1}{2}Ma_{cm}$
      - $Mg\sin\theta - \frac{1}{2}Ma_{cm} = Ma_{cm}$
      - $g\sin\theta = \frac{3}{2}a_{cm}$
      - $a_{cm} = \frac{2}{3}g\sin\theta$
    explanation: 'Solution: Use the quantities and governing relation stated in this step to obtain the displayed result.


      Why it works: This step applies the stated physical model and carries its result into the next step.'
  - id: we-rolling-1-step3
    title: 'Step 3: Numerical Value'
    instruction: Plug in $\theta = 30^\circ$ and $g=9.8$.
    prompt: What is $a_{cm}$?
    type: numericResponse
    answer:
      value: 3.27
      tolerance: 0.1
    explanation: 'Solution: $$a_{cm} = \frac{2}{3}(9.8)\sin(30^\circ) = \frac{2}{3}(9.8)(0.5) = 3.266 \text{ m/s}^2$$


      Why it works: This step applies the stated physical model and carries its result into the next step.'
