    '
- id: q004
  title: Explain Access control
  type: freeResponse
  prompt: 'In a short answer, explain why **Access control** matters in Operating System Security.

    '
  answer:
    expected: 'Access control lists and capabilities represent permissions from different directions. A complete answer should
      also note that acls attach permissions to objects; capabilities attach authority to subjects or tokens.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Access control
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Operating System Security. The key is to connect the term to what the OS controls or protects.

    '
