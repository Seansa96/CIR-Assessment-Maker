questions:
- id: q001
  title: Recognize Security goals
  type: multipleChoice
  prompt: 'Which statement best describes **Security goals** in operating systems?

    '
  choices:
  - id: a
    text: Confidentiality, integrity, and availability describe what the system must protect.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'Confidentiality, integrity, and availability describe what the system must protect. The distractors either
    ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
- id: q002
  title: Recognize Authentication
  type: multipleChoice
  prompt: 'Which statement best describes **Authentication** in operating systems?

    '
  choices:
  - id: a
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: b
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  - id: c
    text: It removes the need for explicit policies, permissions, or resource-management decisions.
  - id: d
    text: Authentication establishes who or what is making a request.
  answer:
    choiceId: d
  explanation: 'Authentication establishes who or what is making a request. The distractors either ignore the OS boundary
    or confuse a design tradeoff with a universal rule.

    '
- id: q003
  title: Recognize Authorization
  type: multipleChoice
  prompt: 'Which statement best describes **Authorization** in operating systems?

    '
  choices:
