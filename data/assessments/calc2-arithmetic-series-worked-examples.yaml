- id: we-arithmetic-series-1
  title: Sum a finite arithmetic progression
  problem: |
    Find the sum of the first $40$ terms of
    $$5+8+11+14+\cdots.$$
  steps:
  - id: step-arithmetic-series-1-1
    title: Identify the sequence parameters
    instruction: 'The first term is $a_1=5$ and consecutive terms differ by

      $d=3$. Arithmetic structure means this difference is constant.

      '
    type: multipleChoice
    prompt: Which pair is correct?
    choices:
    - id: a
      text: |-
        $a_1=5,\ d=3$
    - id: b
      text: |-
        $a_1=3,\ d=5$
    - id: c
      text: |-
        $a_1=5,\ d=8$
    - id: d
      text: |-
        $a_1=8,\ d=3$
    answer:
      choiceId: a
    explanation: |-
      Solution: Subtracting adjacent terms gives the common difference $8-5=3$. Therefore the answer is $a_1=5,\ d=3$.

      Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.

      Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.

      Why the other choices fail: $a_1=3,\ d=5$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $a_1=5,\ d=8$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $a_1=8,\ d=3$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.
  - id: step-arithmetic-series-1-2
    title: Find the final included term
    instruction: 'The $n$th term is $a_n=a_1+(n-1)d$. Therefore

      $$a_{40}=5+39(3)=122.$$

      '
    type: multipleChoice
    prompt: Why is the multiplier $39$ rather than $40$?
    choices:
    - id: a
      text: There are $39$ increments from the first term to the fortieth.
    - id: b
      text: The first term is not included.
    - id: c
      text: The common difference begins at zero.
    - id: d
      text: Arithmetic sequences use $n-2$.
    answer:
      choiceId: a
    explanation: 'Solution: Term one occurs before any common-difference step has been taken. Therefore the answer is There are $39$ increments from the first term to the fortieth.. Therefore the answer is There are $39$ increments from the first term to the fortieth.. Therefore the answer is There are $39$ increments from the first term to the fortieth..


      Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


      Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


      Why the other choices fail: The first term is not included. conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; The common difference begins at zero. conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; Arithmetic sequences use $n-2$. conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.'
  - id: step-arithmetic-series-1-3
    title: Apply the finite-sum formula
    instruction: |
      Pairing the first and last terms gives
      $$S_{40}=\frac{40}{2}(a_1+a_{40})
      =20(5+122).$$
    type: multipleChoice
    prompt: What is the value of this product?
    choices:
    - id: a
      text: $1270$
    - id: b
      text: $2540$
    - id: c
      text: $4880$
    - id: d
      text: $5080$
    answer:
      choiceId: b
    explanation: |-
      Solution: $20\cdot127=2540$. Therefore the answer is $2540$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $1270$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $4880$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $5080$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-arithmetic-series-1-4
    title: Verify by average value
    instruction: 'The average of the evenly spaced endpoints is

      $(5+122)/2=63.5$. Multiplying by $40$ terms again gives $2540$.

      '
    type: multipleChoice
    prompt: Why does the endpoint average equal the mean of all terms?
    choices:
    - id: a
      text: Terms pair symmetrically to the same endpoint sum.
    - id: b
      text: Every term equals the midpoint.
    - id: c
      text: The common difference is positive.
    - id: d
      text: There are an even number of terms.
    answer:
      choiceId: a
    explanation: 'Solution: First-plus-last, second-plus-next-to-last, and so on all equal $a_1+a_n$; the reasoning also works for odd counts. Therefore the answer is Terms pair symmetrically to the same endpoint sum.. Therefore the answer is Terms pair symmetrically to the same endpoint sum.. Therefore the answer is Terms pair symmetrically to the same endpoint sum..


