- id: we-arithmetic-series-3
  title: Decide whether an infinite arithmetic series can converge
  problem: |
    For real $a$ and $d$, classify the infinite series
    $$\sum_{n=1}^{\infty}[a+(n-1)d].$$
    Determine exactly when it converges.
  steps:
  - id: step-arithmetic-series-3-1
    title: Apply the necessary term condition
    instruction: 'Every convergent series must have terms tending to zero. Here the term

      sequence is $a_n=a+(n-1)d$.

      '
    type: multipleChoice
    prompt: |-
      What happens when $d\ne0$?
    choices:
    - id: a
      text: $a_n$ is unbounded in magnitude and cannot approach zero.
    - id: b
      text: $a_n$ always approaches zero.
    - id: c
      text: The series becomes geometric.
    - id: d
      text: The terms alternate with shrinking magnitude.
    answer:
      choiceId: a
    explanation: 'Solution: A nonzero constant difference makes the linear term grow toward one of the infinities. Therefore the answer is $a_n$ is unbounded in magnitude and cannot approach zero.. Therefore the answer is $a_n$ is unbounded in magnitude and cannot approach zero.. Therefore the answer is $a_n$ is unbounded in magnitude and cannot approach zero..


      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.


      Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.


      Why the other choices fail: $a_n$ always approaches zero. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; The series becomes geometric. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; The terms alternate with shrinking magnitude. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.'
  - id: step-arithmetic-series-3-2
    title: Handle zero common difference
    instruction: 'If $d=0$, every term equals $a$. The necessary limit condition then

      requires $a=0$.

      '
    type: multipleChoice
    prompt: What if $d=0$ but $a=4$?
    choices:
