- id: we-arithmetic-series-2
  title: Recover the number of terms from a target sum
  problem: |
    How many terms of
    $$7+11+15+\cdots$$
    are needed for the sum to equal $525$?
  steps:
  - id: step-arithmetic-series-2-1
    title: Write the relevant formulas
    instruction: 'Here $a_1=7$ and $d=4$, so

      $$a_n=7+4(n-1)=4n+3.$$

      '
    type: multipleChoice
    prompt: Which expression is the last included term?
    choices:
    - id: a
      text: $4n+3$
    - id: b
      text: $7n+4$
    - id: c
      text: $4n+7$
    - id: d
      text: $11n$
    answer:
      choiceId: a
    explanation: |-
      Solution: The first term accounts for the offset after $n-1$ differences of four. Therefore the answer is $4n+3$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $7n+4$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $4n+7$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $11n$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-arithmetic-series-2-2
    title: Translate the sum condition
    instruction: |
      Substitute the endpoint into the finite-sum formula:
      $$525=\frac n2[7+(4n+3)]=\frac n2(4n+10).$$
    type: multipleChoice
    prompt: Which equation results after multiplying by $2$?
    choices:
    - id: a
      text: $4n^2+10n=1050$
    - id: b
      text: $4n+10=1050$
    - id: c
      text: $2n^2+5=525$
    - id: d
      text: $4n^2+3n=525$
    answer:
      choiceId: a
    explanation: |-
      Solution: Distributing $n$ produces the quadratic term because the endpoint itself depends on $n$. Therefore the answer is $4n^2+10n=1050$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $4n+10=1050$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $2n^2+5=525$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $4n^2+3n=525$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-arithmetic-series-2-3
    title: Solve the integer equation
    instruction: 'Rearranging and dividing by two gives

      $$2n^2+5n-525=0=(2n+35)(n-15).$$

      '
    type: multipleChoice
    prompt: Which root is admissible?
    choices:
    - id: a
      text: $n=15$
    - id: b
      text: $n=-35/2$
    - id: c
      text: Both roots
    - id: d
      text: Neither root
    answer:
      choiceId: a
    explanation: |-
      Solution: A number of included terms must be a positive integer. Therefore the answer is $n=15$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $n=-35/2$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Both roots conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; Neither root conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-arithmetic-series-2-4
    title: Check the original target
    instruction: |
      For $n=15$, the last term is $4(15)+3=63$, and
      $$S_{15}=\frac{15}{2}(7+63)=\frac{15}{2}(70)=525.$$
      This matches the target $525$, so the positive integer root is valid.
    type: multipleChoice
    prompt: What is the correct final conclusion after this verification?
    choices:
    - id: a
      text: No positive integer number of terms has sum $525$.
    - id: b
      text: $15$ terms are required.
    - id: c
      text: $14$ terms are required.
    - id: d
      text: The sequence is geometric.
    answer:
      choiceId: b
    explanation: |-
      Solution: Direct substitution confirms both the algebra and the admissible root. Therefore the answer is $15$ terms are required.. Therefore the answer is $15$ terms are required.. Therefore the answer is $15$ terms are required..

