id: physics2-ch07-calculating-potential-concept-lesson
title: Calculating Potential from Fields & Charges
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electric-potential
lesson:
  introduction: This lesson develops the main ideas behind Calculating Potential from Fields & Charges
    and connects them to the governing physical relationships.
  sections:
  - id: l2-sec1
    title: Potential of a Point Charge
    required: true
    content: 'Setting $V=0$ at infinity, the potential due to a point charge $q$ at distance $r$ is $V
      = k \frac{q}{r}$. For a collection of point charges, the total potential is the algebraic (scalar)
      sum: $V = \sum k \frac{q_i}{r_i}$.'
  - id: l2-sec2
    title: Potential of Continuous Distributions
    required: true
    content: 'For a continuous charge distribution, we integrate: $V = \int k \frac{dq}{r}$.'
