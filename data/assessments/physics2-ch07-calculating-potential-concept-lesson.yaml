lesson:
  introduction: >
    This lesson develops a repeatable way to solve Calculating Potential from Fields & Charges problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch07-calculating-potential-s1
    title: Name the model and quantities
    required: true
    content: >
      Calculating Potential from Fields & Charges uses V = kq/r. In the name the model and quantities stage, add scalar potentials with signs before converting a potential difference into energy or work.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Calculating Potential from Fields & Charges problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch07-calculating-potential-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Calculating Potential from Fields & Charges, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use V = kq/r after you add scalar potentials with signs before converting a potential difference into energy or work.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Calculating Potential from Fields & Charges problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-calculating-potential-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables V = kq/r relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-calculating-potential-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Calculating Potential from Fields & Charges.
        media: []
        issueSignals:
        - id: physics2-physics2-ch07-calculating-potential-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
