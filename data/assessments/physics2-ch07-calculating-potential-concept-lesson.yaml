      explanation: >
        Solution: During name the model and quantities for Calculating Potential from Fields & Charges, first add scalar potentials with signs before converting a potential difference into energy or work. Then apply V = kq/r with one consistent coordinate system and solve for the requested quantity.


        Why it works: V = kq/r connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
