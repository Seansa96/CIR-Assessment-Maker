questions:
- id: physics-wave-boundaries-focused-q001
  type: multipleChoice
  prompt: A single localized bump travels along a rope and then leaves the observed region. How should it be classified?
  choices:
  - { id: a, text: A pulse. }
  - { id: b, text: A periodic wave because it travels. }
  - { id: c, text: A standing wave because the rope has a disturbance. }
  answer: { choiceId: a }
  explanation: |
    Solution: It is a pulse.

    Why it works: A pulse is a localized disturbance, whereas a periodic wave repeats its pattern in time.

    Why the other choices fail: Travel alone does not make a disturbance periodic, and a standing wave has a persistent spatial pattern rather than one bump passing through.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
  subjectDifficultyTags: [pulseVsPeriodic]
  difficultyEvidence: The described time pattern must be classified as localized rather than repeating.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1384]
  blueprintId: physics-wave-boundaries-focused-q001
- id: physics-wave-boundaries-focused-q002
  type: multipleChoice
  prompt: An upward pulse reaches a fixed end of a taut string. The reflected pulse is an upward crest, a downward trough, or neither?
  choices:
  - { id: a, text: An upward crest. }
  - { id: b, text: A downward trough. }
  - { id: c, text: Neither; a fixed end absorbs every pulse. }
  answer: { choiceId: b }
  explanation: |
    Solution: It reflects as a downward trough.

    Why it works: The fixed endpoint must remain at zero displacement, so the reflected disturbance inverts to cancel the incident displacement at the end.

    Why the other choices fail: An upright crest would violate the fixed-end constraint, and ideal reflection does not require total absorption.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [fixedEndReflection]
  difficultyEvidence: The boundary condition is translated into a reflected-pulse shape.
  prerequisiteObjectiveIds: [phys1-obj-wave-speed]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1411]
  blueprintId: physics-wave-boundaries-focused-q002
- id: physics-wave-boundaries-focused-q003
  type: multipleChoice
  prompt: A driven wave on one string reaches a junction with a second, different string. Which claim best describes the idealized outcome?
  choices:
  - { id: a, text: Some energy can reflect and some can transmit into the second string. }
  - { id: b, text: All energy must reflect because the strings differ. }
  - { id: c, text: The junction eliminates the driving frequency. }
  answer: { choiceId: a }
  explanation: |
    Solution: Some energy can reflect and some can transmit into the second string.

    Why it works: A change of medium can divide the incident wave energy between reflected and transmitted disturbances; the junction does not erase the source's driving frequency.

    Why the other choices fail: Total reflection is only a limiting case, and frequency is set by the driving source rather than destroyed at an ordinary junction.
  difficultyDimensions: [errorDiagnosis, representationTransfer, modelOrDerivation]
  subjectDifficultyTags: [transmission]
  difficultyEvidence: The learner applies boundary reasoning to reject two plausible overgeneralizations.
  prerequisiteObjectiveIds: [phys1-obj-wave-boundaries]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1413]
