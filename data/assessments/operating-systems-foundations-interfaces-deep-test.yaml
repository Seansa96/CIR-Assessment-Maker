  explanation: 'Layering improves reasoning by controlling dependencies. Related topic: Operating System Structure and Design.'
- id: q007
  title: Introduction and System Calls Tradeoff
  type: freeResponse
  prompt: Explain one tradeoff in Introduction and System Calls using a concrete OS mechanism.
  answer:
    expected: A strong answer names a mechanism in Introduction and System Calls, identifies the resource or boundary it controls, and explains what benefit is gained and what cost or risk appears.
    gradingMode: selfCheck
    keyPoints:
    - Names mechanism
    - Identifies resource or boundary
    - Explains benefit
    - Explains cost or risk
  explanation: OS design is tradeoff-heavy; Introduction and System Calls should be explained through mechanism and consequence.
