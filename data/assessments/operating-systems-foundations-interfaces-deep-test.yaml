    text: Isolation and modularity often cost extra message passing.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'Isolation and modularity often cost extra message passing. Related topic: Operating System Structure and Design.'
- id: q006
