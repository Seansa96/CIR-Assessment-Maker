questions:
- id: q001
  title: 'Introduction and System Calls: OS as extended machine'
  type: multipleChoice
  prompt: In a design review, which statement best applies **OS as extended machine**?
  choices:
  - id: a
    text: The OS gives programs safer abstractions than raw hardware.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'The OS gives programs safer abstractions than raw hardware. Related topic: Introduction and System Calls.'
- id: q002
  title: 'Introduction and System Calls: OS as resource manager'
  type: multipleChoice
  prompt: In a design review, which statement best applies **OS as resource manager**?
  choices:
  - id: a
    text: The OS decides how shared resources are allocated and protected.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'The OS decides how shared resources are allocated and protected. Related topic: Introduction and System Calls.'
- id: q003
  title: 'Introduction and System Calls: User mode to kernel mode'
  type: multipleChoice
  prompt: In a design review, which statement best applies **User mode to kernel mode**?
  choices:
  - id: a
    text: A system call crosses a protection boundary.
  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'A system call crosses a protection boundary. Related topic: Introduction and System Calls.'
- id: q004
