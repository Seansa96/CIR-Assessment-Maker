  - id: b
    text: The operating system is not involved in this kind of decision.
  - id: c
    text: The safest choice is always to bypass protection for speed.
  - id: d
    text: The concept is only a vocabulary label with no design consequences.
  answer:
    choiceId: a
  explanation: 'Fast internal calls trade against fault isolation. Related topic: Operating System Structure and Design.'
- id: q005
  title: 'Operating System Structure and Design: Microkernel tradeoff'
  type: multipleChoice
  prompt: In a design review, which statement best applies **Microkernel tradeoff**?
  choices:
