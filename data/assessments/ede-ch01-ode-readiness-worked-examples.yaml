workedExamples:
- id: we01
  title: Verify a product-composition solution
  problem: Verify that $y=xe^{-x}$ solves $y'+y=e^{-x}$ and state its maximal interval.
  steps:
  - id: we01-s1
    title: Differentiate accurately
    instruction: Apply product and chain rules.
    type: freeResponse
    prompt: Compute $y'$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Uses product rule
      - Uses chain rule
    explanation: |-
      Solution: $y'=e^{-x}-xe^{-x}=(1-x)e^{-x}$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Substitute into the ODE
    instruction: Combine the derivative and original function.
    type: freeResponse
    prompt: Evaluate $y'+y$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Substitutes
      - Simplifies
    explanation: |-
      Solution: $(1-x)e^{-x}+xe^{-x}=e^{-x}$, matching the right side.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: Check the interval
    instruction: Inspect both formula and equation for singularities.
    type: freeResponse
    prompt: State the maximal interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Checks formula
      - States all reals
    explanation: |-
      Solution: $xe^{-x}$ and $e^{-x}$ are defined and smooth for every real $x$, so the interval is $(-\infty,\infty)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: Recover a family and impose data
  problem: Solve $y'=3x^2-4$ with $y(1)=2$.
  steps:
  - id: we02-s1
    title: Integrate the rate
    instruction: Include the arbitrary constant.
    type: freeResponse
    prompt: Find the solution family.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Antidifferentiates
      - Includes constant
    explanation: |-
      Solution: $y=x^3-4x+C$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Apply the initial value
    instruction: Substitute the supplied point.
    type: freeResponse
    prompt: Determine $C$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Uses initial condition
      - Finds five
    explanation: |-
      Solution: $2=1-4+C$, so $C=5$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify
    instruction: Differentiate and evaluate the data.
    type: freeResponse
    prompt: Check the final result.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Checks derivative
      - Checks data
    explanation: |-
      Solution: $y=x^3-4x+5$ has $y'=3x^2-4$ and $y(1)=2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: Partial fractions and a solution branch
  problem: Solve $y'=y(y-2)$ with $y(0)=1$ using partial fractions.
  steps:
  - id: we03-s1
    title: Separate without losing equilibria
    instruction: Record zero factors before division.
    type: freeResponse
    prompt: Separate variables and list equilibria.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Retains equilibria
      - Separates
    explanation: |-
      Solution: $y=0$ and $y=2$ are equilibria; otherwise $dy/[y(y-2)]=dx$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Integrate and choose the sign
    instruction: Use partial fractions and the initial point.
    type: freeResponse
    prompt: Obtain an implicit relation.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Integrates
      - Uses branch sign
    explanation: |-
      Solution: $\tfrac12\ln|(y-2)/y|=x+C$; the initial value gives $C=0$ and the ratio is negative on this branch.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Solve and verify the interval
    instruction: Isolate $y$ and inspect its denominator.
    type: freeResponse
    prompt: Give the explicit solution and interval.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Solves explicitly
      - Checks interval
    explanation: |-
      Solution: $y=2/(1+e^{2x})$, defined for all real $x$; differentiation verifies $y'=y(y-2)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
