questions:
- id: q1
  type: numericResponse
  prompt: 'Two forces act on a wheel of $I = 2.0 \text{ kg}\cdot\text{m}^2$: $F_1
    = 10 \text{ N}$ applied at $R_1 = 0.4 \text{ m}$ (counterclockwise) and $F_2 =
    20 \text{ N}$ applied at $R_2 = 0.1 \text{ m}$ (clockwise). What is the magnitude
    of the angular acceleration?'
  answer:
    value: 1.0
    tolerance: 0.1
  explanation: $\tau_{net} = 10(0.4) - 20(0.1) = 4.0 - 2.0 = 2.0 \text{ N}\cdot\text{m}$.
    $\alpha = 2.0 / 2.0 = 1.0 \text{ rad/s}^2$.
