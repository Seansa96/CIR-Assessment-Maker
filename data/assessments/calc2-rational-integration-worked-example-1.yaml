workedExamples:
- id: we-rat-1
  title: Integrating with Partial Fractions
  problem: |-
    Evaluate the indefinite integral:
    $$\int \frac{x + 7}{x^2 - x - 6} \, dx$$
  steps:
  - id: step-1
    title: Factor the Denominator
    type: freeResponse
    issueSignals:
    - id: partial-fraction-decomposition-error
    - id: algebraic-simplification-error
    - id: expression-equation-recognition-error
    - id: fraction-arithmetic-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: Summarize why factoring the denominator is the first useful move.
    answer:
      expected: The denominator factors into distinct linear terms, so partial fractions can be used without long division.
      gradingMode: selfCheck
    instruction: |-
      First, check the degrees. The numerator is degree 1, and the denominator is degree 2. Since the top is strictly less than the bottom, we do not need long division.
      
      Next, factor the denominator:
      $x^2 - x - 6 = (x - 3)(x + 2)$
      
      So the integral is $\int \frac{x + 7}{(x - 3)(x + 2)} \, dx$.
  - id: step-2
    title: Set Up the Decomposition
    type: freeResponse
    issueSignals:
    - id: partial-fraction-decomposition-error
    - id: algebraic-simplification-error
    - id: expression-equation-recognition-error
    - id: fraction-arithmetic-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: Summarize the partial fraction form that matches the two linear factors.
    answer:
      expected: Use A over x minus 3 plus B over x plus 2 because the denominator has two distinct linear factors.
      gradingMode: selfCheck
    instruction: |-
      Set up the partial fraction equation using constants $A$ and $B$ for the distinct linear factors:
      $$\frac{x + 7}{(x - 3)(x + 2)} = \frac{A}{x - 3} + \frac{B}{x + 2}$$
  - id: step-3
    title: Clear the Fractions
    type: freeResponse
    issueSignals:
    - id: partial-fraction-decomposition-error
    - id: algebraic-simplification-error
    - id: expression-equation-recognition-error
    - id: fraction-arithmetic-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: Summarize why multiplying by the common denominator helps.
    answer:
      expected: Clearing denominators turns the rational equation into a polynomial identity that can be solved for A and B.
      gradingMode: selfCheck
    instruction: |-
      Multiply the entire equation by the common denominator $(x - 3)(x + 2)$:
      $$x + 7 = A(x + 2) + B(x - 3)$$
      
      This equation must be true for *all* values of $x$.
  - id: step-4
    title: Solve for the Constants
    type: freeResponse
    issueSignals:
    - id: partial-fraction-decomposition-error
    - id: algebraic-simplification-error
    - id: expression-equation-recognition-error
    - id: fraction-arithmetic-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: Summarize how the strategic x-values isolate the constants.
    answer:
      expected: Plugging in x equals -2 isolates B and plugging in x equals 3 isolates A.
      gradingMode: selfCheck
    instruction: |-
      We can solve for $A$ and $B$ by picking strategic values for $x$ that make the factors zero.
      
      **Let $x = -2$:**
      $(-2) + 7 = A(-2 + 2) + B(-2 - 3)$
      $5 = A(0) + B(-5)$
      $5 = -5B \implies B = -1$
      
      **Let $x = 3$:**
      $(3) + 7 = A(3 + 2) + B(3 - 3)$
      $10 = A(5) + B(0)$
      $10 = 5A \implies A = 2$
  - id: step-5
    title: Rewrite and Integrate
    type: freeResponse
    issueSignals:
    - id: partial-fraction-decomposition-error
    - id: algebraic-simplification-error
    - id: expression-equation-recognition-error
    - id: fraction-arithmetic-error
    - id: logarithm-property-misapplied
    - id: exponent-rule-misapplied
    prompt: Summarize why the final antiderivative uses logarithms.
    answer:
      expected: Each decomposed term has the form constant over a linear factor, so each integrates to a constant times a natural logarithm.
      gradingMode: selfCheck
    instruction: |-
      Substitute $A = 2$ and $B = -1$ back into the original setup:
      $$\int \left( \frac{2}{x - 3} - \frac{1}{x + 2} \right) \, dx$$
      
      Now, integrate each term individually. Both result in natural logarithms (with a quick u-substitution where $u$ is the denominator and $du = dx$):
      $$2\ln|x - 3| - \ln|x + 2| + C$$
