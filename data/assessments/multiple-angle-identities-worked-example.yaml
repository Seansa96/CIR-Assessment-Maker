id: multiple-angle-identities-worked-example
title: Multiple Angle Identities Worked Example
assessmentType: workedExample
categoryId: trigonometry
subcategoryId: trig-multiple-angle
subcategoryIds:
  - trig-multiple-angle
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Recognizing and choosing multiple-angle identities
    problem: |
      Learn how double-angle and triple-angle identities are used to rewrite expressions like $\sin(2x)$, $\cos(2x)$, $\sin(3x)$, and $\cos(3x)$.
    steps:
      - id: s001
        title: Recognize the structure
        instruction: "A multiple-angle identity appears when the angle is a multiple of another angle."
        type: selectAll
        prompt: "Which expressions involve multiple-angle structure?"
        choices:
          - id: a
            text: '$\sin(2x)$'
          - id: b
            text: '$\cos(3x)$'
          - id: c
            text: '$\tan(4\theta)$'
          - id: d
            text: '$\sin x+\cos x$'
        answer:
          choiceIds:
            - a
            - b
            - c
        hint: 'Look for an angle like $2x$, $3x$, or $4\theta$.'
        explanation: |
          Multiple-angle identities rewrite trig functions whose angle is multiplied. These often come from angle-sum formulas.

          Related topic: multiple-angle identities. Action step: first identify the base angle and the multiplier.

      - id: s002
        title: Use the sine double-angle identity
        instruction: "The sine double-angle identity is often used when a product of sine and cosine appears."
        type: multipleChoice
        prompt: |
          Which identity is correct?
        choices:
          - id: a
            text: '$\sin(2x)=2\sin x\cos x$'
          - id: b
            text: '$\sin(2x)=\sin^2 x+\cos^2 x$'
          - id: c
            text: '$\sin(2x)=2\sin^2 x$'
          - id: d
            text: '$\sin(2x)=\cos^2 x-\sin^2 x$'
        answer:
          choiceId: a
        hint: "Sine of a sum becomes sine-cosine plus cosine-sine."
        explanation: |
          $\sin(2x)=\sin(x+x)=2\sin x\cos x$.

          Related topic: sine angle-sum identity. Lookup: "$\sin(a+b)$ formula" if the identity feels unmotivated.

      - id: s003
        title: Choose a cosine double-angle form
        instruction: "Cosine double-angle has several equivalent forms, and the best one depends on the expression you want to match."
        type: multipleChoice
        prompt: |
          If an expression contains only $\sin^2 x$, which form of $\cos(2x)$ is usually the most useful?
        choices:
          - id: a
            text: '$\cos(2x)=1-2\sin^2 x$'
          - id: b
            text: '$\cos(2x)=2\cos^2 x-1$'
          - id: c
            text: '$\cos(2x)=2\sin x\cos x$'
          - id: d
            text: '$\cos(2x)=\sin x+\cos x$'
        answer:
          choiceId: a
        hint: "Choose the version using the function already present."
        explanation: |
          Use $\cos(2x)=1-2\sin^2 x$ when the expression is built from sine squared.

          Related topic: choosing cosine double-angle forms. Action step: match the identity to the trig function already in the problem.

      - id: s004
        title: Recognize triple-angle sine
        instruction: "Triple-angle identities rewrite a trig function of 3x as a polynomial in the trig function of x."
        type: multipleChoice
        prompt: |
          Which identity is correct?
        choices:
          - id: a
            text: '$\sin(3x)=3\sin x-4\sin^3 x$'
          - id: b
            text: '$\sin(3x)=4\sin^3 x-3\sin x$'
          - id: c
            text: '$\sin(3x)=3\cos x-4\cos^3 x$'
          - id: d
            text: '$\sin(3x)=\sin x+\sin 2x$'
        answer:
          choiceId: a
        hint: 'The sine triple-angle identity starts with positive $3\sin x$.'
        explanation: |
          $\sin(3x)=3\sin x-4\sin^3 x$.

          Related topic: triple-angle sine identity. Lookup: "sin 3x identity" and connect it back to $\sin(2x+x)$.

      - id: s005
        title: Recognize triple-angle cosine
        instruction: "Cosine triple-angle has a similar polynomial form, but the sign order differs."
        type: multipleChoice
        prompt: |
          Which identity is correct?
        choices:
          - id: a
            text: '$\cos(3x)=4\cos^3 x-3\cos x$'
          - id: b
            text: '$\cos(3x)=3\cos x-4\cos^3 x$'
          - id: c
            text: '$\cos(3x)=3\sin x-4\sin^3 x$'
          - id: d
            text: '$\cos(3x)=\cos x+\cos 2x$'
        answer:
          choiceId: a
        hint: "Cosine triple-angle starts with the cubic term."
        explanation: |
          $\cos(3x)=4\cos^3 x-3\cos x$.

          Related topic: triple-angle cosine identity. Quick lookup phrase: "cos 3x identity."

      - id: s006
        title: Decide why you are using it
        instruction: "Multiple-angle identities are not just memorization. They change the structure of the problem."
        type: multipleChoice
        prompt: |
          When is $\sin(2x)=2\sin x\cos x$ especially useful?
        choices:
          - id: a
            text: 'When you need to rewrite a product $\sin x\cos x$ as a single trig function'
          - id: b
            text: "When you need to factor a polynomial denominator"
          - id: c
            text: "When you need to complete the square"
          - id: d
            text: "When the expression has no trig functions"
        answer:
          choiceId: a
        hint: "The identity connects a product to a single double-angle expression."
        explanation: |
          Since $\sin(2x)=2\sin x\cos x$, the product $\sin x\cos x$ can become $\frac{1}{2}\sin(2x)$.

          Related topic: product-to-double-angle conversion. Action step: look for sine-cosine products.

      - id: s007
        title: Summarize the lookup path
        instruction: "Make a compact decision checklist."
        type: freeResponse
        prompt: "What should you look for when deciding whether a multiple-angle identity is useful?"
        answer:
          expected: "Look for angles like 2x or 3x, products such as sin x cos x, or powers that resemble double-angle forms. Then choose the identity matching the trig function already present, such as sin(2x), one of the cos(2x) forms, sin(3x), or cos(3x)."
          gradingMode: selfCheck
          keyPoints:
            - "Identify multiplied angles like $2x$ or $3x$."
            - 'Use $\sin(2x)=2\sin x\cos x$ for sine-cosine products.'
            - "Choose the cosine double-angle form that matches sine squared or cosine squared."
            - "Use triple-angle identities when $3x$ or cubic trig patterns appear."
        hint: "Think: multiplied angle, product, square, or cubic pattern."
        explanation: |
          Multiple-angle identities are pattern tools. They are useful when changing between a multiplied angle and powers/products of the base angle makes the expression easier.

          Related topic: multiple-angle identities. Quick lookup phrase: "double angle and triple angle identities."
