  - id: section-4
    title: Gravitational field and surface gravity
    required: true
    content: >
      Dividing the gravitational force on a small test mass by that mass gives the local field magnitude:


      $$

      g(r)=\frac{GM}{r^2}.

      $$


      Near a planet's surface this is often approximately constant over small height changes; at orbital distances it must be evaluated from the changing $r$.
    media: []
    check:
      id: check-4
      type: multipleChoice
      prompt: 'At a larger distance from the same planet, the gravitational field is:'
      choices:
      - id: a
        text: smaller
        media: []
        issueSignals: []
      - id: b
        text: larger
        media: []
        issueSignals: []
      answer:
