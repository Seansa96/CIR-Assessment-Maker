    check:
      id: check-3
      type: multipleChoice
      prompt: "The force of a planet on a satellite compared with the satellite's force on the planet is:"
      choices:
      - id: a
        text: equal in magnitude and opposite in direction
        media: []
        issueSignals: []
      - id: b
        text: larger because the planet is more massive
        media: []
        issueSignals: []
