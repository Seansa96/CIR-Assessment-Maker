  - id: section-2
    title: Center-to-center distance is the model distance
    required: true
    content: >
      In Newton's law, $r$ is the distance between the **centers of mass** of objects that can be modeled as spherical or point-like. For an object above a planet's surface, use


      $$

      r=R_{planet}+h,

      $$


      not merely the altitude $h$. The inverse-square factor acts on this full center-to-center separation.
    media: []
    check:
      id: check-2
      type: multipleChoice
      prompt: For a satellite at altitude $h$, use which distance in Newton's law?
      choices:
      - id: a
        text: $R+h$
        media: []
        issueSignals: []
      - id: b
        text: $h$ only
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Use $R+h$.\n\nWhy it works: Separation is center to center.\n\nWhy the other choices fail: Altitude begins at the surface.'
