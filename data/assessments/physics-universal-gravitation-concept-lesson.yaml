lesson:
  introduction: Welcome to the concept lesson on Universal Gravitation.
  sections:
  - id: section-1
    title: Newton's Law of Universal Gravitation
    required: true
    content: >
      The gravitational force $F$ between two point masses $m_1$ and $m_2$ separated by a distance $r$ is given by:

      $$ F = G \frac{m_1 m_2}{r^2} $$

      where $G \approx 6.674 \times 10^{-11}\text{ N}\cdot\text{m}^2/\text{kg}^2$ is the universal gravitational constant.


      At the surface of a planet (like Earth with mass $M_E$ and radius $R_E$), this force is responsible for the weight of an object ($W = mg$). Equating the two gives:

      $$ mg = G \frac{m M_E}{R_E^2} \implies g = G \frac{M_E}{R_E^2} $$
    media:
    - type: image
      src: /media/physics/owa/universal-gravitation-separation.svg
      alt: Two masses with attractive force arrows and a center-to-center separation distance.
      caption: Gravity acts along the center-to-center separation line; doubling that separation reduces force by a factor of four.
    check:
      id: check-1
      type: multipleChoice
      prompt: If the Earth magically shrank to half its current radius, but its mass remained exactly the same, what would happen to the acceleration due to gravity $g$ at its new surface?
      choices:
      - id: a
        text: It would quadruple (become $4g$).
        media: []
        issueSignals: []
      - id: b
        text: It would double (become $2g$).
        media: []
        issueSignals: []
      - id: c
        text: It would remain the same ($1g$).
        media: []
        issueSignals: []
      - id: d
        text: It would become one quarter of its original value ($g/4$).
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution:

        The formula for surface gravity is $g = G \frac{M_E}{R_E^2}$.


        Why it works: Because the radius $R_E$ is squared in the denominator, halving the radius introduces a factor of $(1/2)^2 = 1/4$ in the denominator, which flips to a factor of $4$ in the numerator.


        Why the other choices fail:

        - Doubling (2g) assumes a linear inverse relationship.

        - Remaining the same assumes $g$ is a constant independent of the planet's size.

        - Quartering (g/4) would happen if the radius were doubled, not halved.
