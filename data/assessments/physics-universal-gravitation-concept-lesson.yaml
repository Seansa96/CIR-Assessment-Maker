sections:
- id: intro
  title: Introduction to Universal Gravitation
  content: |
    Gravity is the fundamental force of attraction between any two masses in the universe. Isaac Newton formulated this relationship, noting that the force is proportional to the masses and inversely proportional to the square of the distance between them.
    
    A seminal application of this law is measuring $g$, the acceleration due to gravity, at the Earth's surface.
lesson:
  introduction: 'Welcome to the concept lesson on Universal Gravitation.'
  sections:
  - id: section-1
    title: Newton's Law of Universal Gravitation
    content: |
      The gravitational force $F$ between two point masses $m_1$ and $m_2$ separated by a distance $r$ is given by:
      $$ F = G \frac{m_1 m_2}{r^2} $$
      where $G \approx 6.674 \times 10^{-11}\text{ N}\cdot\text{m}^2/\text{kg}^2$ is the universal gravitational constant.
      
      At the surface of a planet (like Earth with mass $M_E$ and radius $R_E$), this force is responsible for the weight of an object ($W = mg$). Equating the two gives:
      $$ mg = G \frac{m M_E}{R_E^2} \implies g = G \frac{M_E}{R_E^2} $$
    media:
    - type: image
      src: /media/physics/owa/universal-gravitation-separation.svg
      alt: Two masses with attractive force arrows and a center-to-center separation distance.
      caption: Gravity acts along the center-to-center separation line; doubling that separation reduces force by a factor of four.
    check:
      id: check-1
      type: multipleChoice
      prompt: 'If the Earth magically shrank to half its current radius, but its mass remained exactly the same, what would happen to the acceleration due to gravity $g$ at its new surface?'
      choices:
      - id: a
        text: 'It would quadruple (become $4g$).'
      - id: b
        text: 'It would double (become $2g$).'
      - id: c
        text: 'It would remain the same ($1g$).'
      - id: d
        text: 'It would become one quarter of its original value ($g/4$).'
      answer:
        choiceId: a
      explanation: |
        Solution:
        The formula for surface gravity is $g = G \frac{M_E}{R_E^2}$.
        
        Why it works: Because the radius $R_E$ is squared in the denominator, halving the radius introduces a factor of $(1/2)^2 = 1/4$ in the denominator, which flips to a factor of $4$ in the numerator.
        
        Why the other choices fail: 
        - Doubling (2g) assumes a linear inverse relationship.
        - Remaining the same assumes $g$ is a constant independent of the planet's size.
        - Quartering (g/4) would happen if the radius were doubled, not halved.
  - id: section-2
    title: Center-to-center distance is the model distance
    content: |
      In Newton's law, $r$ is the distance between the **centers of mass** of objects that can be modeled as spherical or point-like. For an object above a planet's surface, use

      $$
      r=R_{planet}+h,
      $$

      not merely the altitude $h$. The inverse-square factor acts on this full center-to-center separation.
  - id: section-3
    title: The force pair has equal magnitude
    content: |
      The planet pulls on a satellite with the same force magnitude that the satellite pulls on the planet. The accelerations are different because $a=F/m$: the less massive object has the larger acceleration. Do not confuse equal interaction forces with equal changes in velocity for two objects of different mass.
  - id: section-4
    title: Gravitational field and surface gravity
    content: |
      Dividing the gravitational force on a small test mass by that mass gives the local field magnitude:

      $$
      g(r)=\frac{GM}{r^2}.
      $$

      Near a planet's surface this is often approximately constant over small height changes; at orbital distances it must be evaluated from the changing $r$.
  - id: section-5
    title: Inverse-square checks
    content: |
      Use ratios to check reasoning before calculating numbers. Doubling separation makes force and field one quarter as large; tripling separation makes them one ninth as large. If the central mass doubles at fixed separation, the force and field double. These checks expose the common error of applying a linear distance rule.
