  - id: section-5
    title: Inverse-square checks
    required: true
    content: >
      Use ratios to check reasoning before calculating numbers. Doubling separation makes force and field one quarter as large; tripling separation makes them one ninth as large. If the central mass doubles at fixed separation, the force and field double. These checks expose the common error of applying a linear distance rule.
