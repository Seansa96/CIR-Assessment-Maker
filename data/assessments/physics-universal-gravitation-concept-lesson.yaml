        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: It is smaller.\n\nWhy it works: $g=GM/r^2$ decreases with squared distance.\n\nWhy the other choices fail: Larger distance does not strengthen an inverse-square field.'
