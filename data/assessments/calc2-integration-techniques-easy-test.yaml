- id: q-int-et-1
  title: Integration by Parts Basics
  prompt: |-
    Which of the following is the correct formula for Integration by Parts?
  type: multipleChoice
  choices:
  - id: c1
    text: $\int u \, dv = uv - \int v \, du$
  - id: c2
    text: $\int u \, dv = uv + \int v \, du$
  - id: c3
    text: $\int u \, dv = u'v - \int uv' \, dx$
  - id: c4
    text: $\int u \, dv = uv - \int u \, dv$
  answer:
    choiceId: c1
  explanation: |-
    The Integration by Parts formula is derived from the product rule for derivatives, and it states: $\int u \, dv = uv - \int v \, du$.
  skills:
  - calc2-integration-techniques

- id: q-int-et-2
  title: Choosing u and dv
  prompt: |-
    When using Integration by Parts to evaluate $\int x e^x \, dx$, what is the best choice for $u$ and $dv$?
  type: multipleChoice
  choices:
  - id: c1
    text: $u = e^x, \quad dv = x \, dx$
  - id: c2
    text: $u = x, \quad dv = e^x \, dx$
  - id: c3
    text: $u = xe^x, \quad dv = dx$
  - id: c4
    text: $u = 1, \quad dv = xe^x \, dx$
  answer:
    choiceId: c2
  explanation: |-
    Using the LIATE rule (Logarithmic, Inverse trig, Algebraic, Trig, Exponential), $x$ is Algebraic and $e^x$ is Exponential. $A$ comes before $E$, so let $u = x$ (which simplifies to $1$ when derived) and let $dv = e^x \, dx$ (which is easy to integrate).
  skills:
  - calc2-integration-techniques

- id: q-int-et-3
  title: Evaluating an Integration by Parts
  prompt: |-
    Evaluate $\int x \sin(x) \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: $-x\cos(x) + \sin(x) + C$
  - id: c2
    text: $x\cos(x) - \sin(x) + C$
  - id: c3
    text: $-x\sin(x) + \cos(x) + C$
  - id: c4
    text: $x\cos(x) + \sin(x) + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = x$ and $dv = \sin(x) \, dx$. 
    Then $du = dx$ and $v = -\cos(x)$.
    Formula: $uv - \int v \, du = -x\cos(x) - \int (-\cos(x)) \, dx = -x\cos(x) + \int \cos(x) \, dx = -x\cos(x) + \sin(x) + C$.
  skills:
  - calc2-integration-techniques

- id: q-int-et-4
  title: Odd Sine Power
  prompt: |-
    Evaluate $\int \sin^3(x) \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: $-\cos(x) + \frac{1}{3}\cos^3(x) + C$
  - id: c2
    text: $\frac{1}{4}\sin^4(x) + C$
  - id: c3
    text: $\cos(x) - \frac{1}{3}\cos^3(x) + C$
  answer:
    choiceId: c1
  explanation: |-
    Rewrite as $\int \sin^2(x)\sin(x) \, dx = \int (1-\cos^2(x))\sin(x) \, dx$.
    Let $u = \cos(x), du = -\sin(x) \, dx$.
    $-\int (1-u^2) \, du = -\left(u - \frac{u^3}{3}\right) + C = -u + \frac{u^3}{3} + C = -\cos(x) + \frac{1}{3}\cos^3(x) + C$.
  skills:
  - calc2-integration-techniques

- id: q-int-et-5
  title: Logarithmic Integration by Parts
  prompt: |-
    Evaluate $\int \ln(x) \, dx$.
  type: multipleChoice
  choices:
  - id: c1
    text: $x\ln(x) - x + C$
  - id: c2
    text: $\frac{1}{x} + C$
  - id: c3
    text: $x\ln(x) + x + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = \ln(x)$ and $dv = dx$. 
    Then $du = \frac{1}{x} \, dx$ and $v = x$.
    Formula: $uv - \int v \, du = x\ln(x) - \int x\left(\frac{1}{x}\right) \, dx = x\ln(x) - \int 1 \, dx = x\ln(x) - x + C$.
  skills:
  - calc2-integration-techniques
