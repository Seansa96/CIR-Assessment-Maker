lesson:
  introduction: Build a reliable model of ionic bonds and compounds by separating electron accounting, particle representation,
    and observable evidence.
  sections:
  - id: transfer-attraction
    title: Connect electron transfer to attraction
    required: true
    content: Electron transfer describes ion formation, while the ionic bond is the electrostatic attraction among the resulting
      oppositely charged ions. Do not draw one transferred electron as a permanent physical connector.
    check:
      id: chk-transfer-attraction
      type: multipleChoice
      prompt: Which statement correctly applies the idea of connect electron transfer to attraction?
      choices:
      - id: a
        text: NaCl formation produces Na+ and Cl- whose opposite charges attract.
        issueSignals: []
      - id: b
        text: The transferred electron becomes a rigid rod joining one sodium to one chlorine.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      - id: c
        text: Na and Cl remain neutral but acquire an ionic label.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      answer:
        choiceId: a
      explanation: 'Solution: NaCl formation produces Na+ and Cl- whose opposite charges attract. Why it works: Electron transfer
        describes ion formation, while the ionic bond is the electrostatic attraction among the resulting oppositely charged
        ions. Do not draw one transferred electron as a permanent physical connector. Why the other choices fail: The other
        statements either reverse the relevant electron or charge accounting or apply a structural model outside its stated
        scope.'
    media:
    - type: image
      src: /media/chemistry/bonding-ionic-lattice-map.svg
      alt: Instructional workflow for ionic bonds and compounds showing the central particle-level decisions.
      caption: Use the representation to connect observable evidence with electron and particle accounting.
  - id: lattice
    title: Model the extended lattice
    required: true
    content: An ionic solid is an extended array, not a collection of isolated NaCl molecules. Its formula states the lowest
      charge-balanced ratio of ions.
    check:
      id: chk-lattice
      type: multipleChoice
      prompt: Which statement correctly applies the idea of model the extended lattice?
      choices:
      - id: a
        text: Solid MgCl2 contains a repeating 1:2 ratio of Mg2+ to Cl-.
        issueSignals: []
      - id: b
        text: Each MgCl2 molecule contains one isolated magnesium-chlorine-chlorine unit.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      - id: c
        text: The formula means every magnesium touches exactly two chloride ions.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      answer:
        choiceId: a
      explanation: 'Solution: Solid MgCl2 contains a repeating 1:2 ratio of Mg2+ to Cl-. Why it works: An ionic solid is an
        extended array, not a collection of isolated NaCl molecules. Its formula states the lowest charge-balanced ratio of
        ions. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting or
        apply a structural model outside its stated scope.'
  - id: properties
    title: Explain characteristic properties
    required: true
    content: Strong lattice attractions contribute to high melting points. Ions are fixed in a solid but mobile in a melt
      or aqueous solution, explaining the change in conductivity.
    check:
      id: chk-properties
      type: multipleChoice
      prompt: Which statement correctly applies the idea of explain characteristic properties?
      choices:
      - id: a
        text: Molten NaCl conducts because its ions can move.
        issueSignals: []
      - id: b
        text: Solid NaCl conducts best because its ions are locked in place.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      - id: c
        text: NaCl melts easily because opposite charges repel.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      answer:
        choiceId: a
      explanation: 'Solution: Molten NaCl conducts because its ions can move. Why it works: Strong lattice attractions contribute
        to high melting points. Ions are fixed in a solid but mobile in a melt or aqueous solution, explaining the change
        in conductivity. Why the other choices fail: The other statements either reverse the relevant electron or charge accounting
        or apply a structural model outside its stated scope.'
  - id: brittleness
    title: Explain brittleness
    required: true
    content: A displacement can align like-charged ions across a cleavage plane. Their repulsion drives the crystal apart
      rather than allowing layers to slide as in a metal.
    check:
      id: chk-brittleness
      type: multipleChoice
      prompt: Which statement correctly applies the idea of explain brittleness?
      choices:
      - id: a
        text: Shifting an ionic lattice can place like charges together and fracture it.
        issueSignals: []
      - id: b
        text: Ionic crystals are brittle because all ionic attractions disappear at room temperature.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      - id: c
        text: Brittleness proves the solid contains neutral molecules.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      answer:
        choiceId: a
      explanation: 'Solution: Shifting an ionic lattice can place like charges together and fracture it. Why it works: A displacement
        can align like-charged ions across a cleavage plane. Their repulsion drives the crystal apart rather than allowing
        layers to slide as in a metal. Why the other choices fail: The other statements either reverse the relevant electron
        or charge accounting or apply a structural model outside its stated scope.'
  - id: lattice-trends
    title: Predict qualitative lattice-energy trends
    required: true
    content: Greater ionic charge and shorter ion separation strengthen electrostatic attraction. Compare one factor at a
      time and state that lattice energy is a property of the full ionic assembly.
    check:
      id: chk-lattice-trends
      type: multipleChoice
      prompt: Which statement correctly applies the idea of predict qualitative lattice-energy trends?
      choices:
      - id: a
        text: CaO is expected to have stronger lattice attraction than NaF because its ions have larger charge magnitudes.
        issueSignals: []
      - id: b
        text: CsI must have stronger attraction than NaF because cesium and iodine are larger.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      - id: c
        text: Lattice energy is found by multiplying the two ion masses.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      answer:
        choiceId: a
      explanation: 'Solution: CaO is expected to have stronger lattice attraction than NaF because its ions have larger charge
        magnitudes. Why it works: Greater ionic charge and shorter ion separation strengthen electrostatic attraction. Compare
        one factor at a time and state that lattice energy is a property of the full ionic assembly. Why the other choices
        fail: The other statements either reverse the relevant electron or charge accounting or apply a structural model outside
        its stated scope.'
  - id: energy-cycle
    title: Account for the complete formation process
    required: true
    content: Forming separated ions can require energy, but assembling the lattice releases energy. A valid energetic argument
      includes both ion formation and lattice stabilization.
    check:
      id: chk-energy-cycle
      type: multipleChoice
      prompt: Which statement correctly applies the idea of account for the complete formation process?
      choices:
      - id: a
        text: Lattice formation can offset endothermic electron-removal steps.
        issueSignals: []
      - id: b
        text: Electron transfer alone guarantees every ionic compound forms exothermically.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      - id: c
        text: Only atomic mass determines whether an ionic solid is stable.
        issueSignals:
        - id: chemistry-bonding-ionic-model-error
      answer:
        choiceId: a
      explanation: 'Solution: Lattice formation can offset endothermic electron-removal steps. Why it works: Forming separated
        ions can require energy, but assembling the lattice releases energy. A valid energetic argument includes both ion
        formation and lattice stabilization. Why the other choices fail: The other statements either reverse the relevant
        electron or charge accounting or apply a structural model outside its stated scope.'
