authoring: { visualRequirement: required, visualRationale: 'Energy and rate-data representations support transfer across kinetics models.', difficultyTier: mixed, sourceId: src-20260720035703-91ea51b0d8 }
questions:
  - { id: q1, type: numericResponse, prompt: 'For $2A\rightarrow B$, A disappears at $0.160\ \mathrm{M\,min^{-1}}$. Find the reaction rate.', answer: { value: 0.08, tolerance: 0.0001 }, explanation: 'Solution: $r=0.160/2=0.080\ \mathrm{M\,min^{-1}}$. Why it works: Divide reactant disappearance by its coefficient.', difficultyDimensions: [stoichiometricTranslation, quantitativeReasoning, units], difficultyEvidence: 'Transfers a measured species rate to reaction rate.', prerequisiteObjectiveIds: [chem-kinetics-rate-stoichiometry], extensionObjectiveIds: [chem-kinetics-rate-law], issueSignals: [{ id: chemistry-stoichiometry-ignored }] }
  - { id: q2, type: multipleChoice, prompt: 'A rate changes by a factor of 8 when [B] doubles with all else fixed. What is the order in B?', choices: [{ id: a, text: first, issueSignals: [{ id: chemistry-rate-law-factor-misread }] }, { id: b, text: second, issueSignals: [{ id: chemistry-rate-law-factor-misread }] }, { id: c, text: third, issueSignals: [] }], answer: { choiceId: c }, explanation: 'Solution: Third order. Why it works: $8=2^3$. Why the other choices fail: first and second order predict factors 2 and 4.', difficultyDimensions: [dataInterpretation, exponentReasoning, modelSelection], difficultyEvidence: 'Infers an exponent from a nonlinear rate factor.', prerequisiteObjectiveIds: [chem-kinetics-rate-law], extensionObjectiveIds: [chem-kinetics-mechanism], issueSignals: [{ id: chemistry-rate-law-factor-misread }] }
  - { id: q3, type: numericResponse, prompt: 'A first-order reaction has $k=0.1155\ \mathrm{min^{-1}}$. Find $t_{1/2}$ in min.', answer: { value: 6, tolerance: 0.02 }, explanation: 'Solution: $0.693/0.1155=6.00$ min. Why it works: The first-order half-life is $0.693/k$.', difficultyDimensions: [formulaSelection, unitInterpretation, numericalCalculation], difficultyEvidence: 'Chooses the order-specific time relation.', prerequisiteObjectiveIds: [chem-kinetics-time-models], extensionObjectiveIds: [chem-kinetics-rate-law], issueSignals: [{ id: chemistry-half-life-model-misapplied }] }
  - { id: q4, type: multipleChoice, prompt: 'Which observation supports first-order decay?', choices: [{ id: a, text: 'equal fractions disappear in equal times', issueSignals: [] }, { id: b, text: 'equal molar amounts disappear in equal times', issueSignals: [{ id: chemistry-order-model-confusion }] }, { id: c, text: 'rate is independent of concentration', issueSignals: [{ id: chemistry-order-model-confusion }] }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: First-order reactions have constant half-life. Why the other choices fail: b describes zero-order behavior; c is also zero-order.', difficultyDimensions: [modelInterpretation, representationTransfer, errorDiagnosis], difficultyEvidence: 'Distinguishes fractional from absolute concentration change.', prerequisiteObjectiveIds: [chem-kinetics-time-models], extensionObjectiveIds: [chem-kinetics-rate-law], issueSignals: [{ id: chemistry-order-model-confusion }] }
  - { id: q5, type: multipleChoice, prompt: 'Heating a mixture raises rate chiefly because it', choices: [{ id: a, text: increases the fraction above $E_a$', issueSignals: [] }, { id: b, text: lowers $E_a$ for the same path, issueSignals: [{ id: chemistry-temperature-catalyst-confusion }] }, { id: c, text: changes reactant coefficients, issueSignals: [{ id: chemistry-kinetics-stoichiometry-confusion }] }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: A warmer distribution contains more barrier-crossing collisions. Why the other choices fail: b describes a catalyst; c does not follow from heating.', difficultyDimensions: [molecularModel, energyDistribution, causalReasoning], difficultyEvidence: 'Connects temperature to the collision-energy distribution.', prerequisiteObjectiveIds: [chem-kinetics-collision-energy], extensionObjectiveIds: [chem-kinetics-mechanism], issueSignals: [{ id: chemistry-temperature-catalyst-confusion }] }
  - { id: q6, type: multipleChoice, prompt: 'Which condition makes a mechanism plausible?', choices: [{ id: a, text: its summed steps reproduce the net reaction and its predicted rate law agrees with evidence', issueSignals: [] }, { id: b, text: its first step has the same coefficients as the net reaction, issueSignals: [{ id: chemistry-mechanism-rate-law-confusion }] }, { id: c, text: it has no intermediates, issueSignals: [{ id: chemistry-mechanism-species-confusion }] }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: Mechanisms must satisfy both stoichiometric and kinetic evidence. Why the other choices fail: b is not required; c wrongly excludes ordinary pathway intermediates.', difficultyDimensions: [mechanismValidation, evidenceIntegration, modelSelection], difficultyEvidence: 'Uses independent stoichiometric and kinetic checks.', prerequisiteObjectiveIds: [chem-kinetics-mechanism], extensionObjectiveIds: [chem-kinetics-rate-law], issueSignals: [{ id: chemistry-mechanism-rate-law-confusion }] }
  - { id: q7, type: numericResponse, prompt: 'For $rate=k[X][Y]^2$, $k=4.0\ \mathrm{M^{-2}s^{-1}}$, $[X]=0.30$ M, and $[Y]=0.20$ M. Find rate in $\mathrm{M\,s^{-1}}$.', answer: { value: 0.048, tolerance: 0.0002 }, explanation: 'Solution: $4.0(0.30)(0.20)^2=0.048\ \mathrm{M\,s^{-1}}$. Why it works: Apply each experimental exponent before multiplying.', difficultyDimensions: [rateLawSubstitution, exponentUse, units], difficultyEvidence: 'Evaluates a mixed-order rate law.', prerequisiteObjectiveIds: [chem-kinetics-rate-law], extensionObjectiveIds: [chem-kinetics-time-models], issueSignals: [{ id: chemistry-rate-law-exponent-omitted }] }
  - { id: q8, type: selectAll, prompt: 'Select all catalyst statements that are correct at fixed temperature.', choices: [{ id: a, text: lowers the activation barrier, issueSignals: [] }, { id: b, text: is regenerated overall, issueSignals: [] }, { id: c, text: changes K, issueSignals: [{ id: chemistry-kinetics-equilibrium-confusion }] }, { id: d, text: speeds both directions, issueSignals: [] }], answer: { choiceIds: [a, b, d] }, explanation: 'Solution: Select a, b, and d. Why it works: Catalysts provide a regenerated lower-barrier path in both directions. Why the other choices fail: c confuses equilibrium position with approach rate.', difficultyDimensions: [multiConditionReasoning, pathwayModel, equilibriumDistinction], difficultyEvidence: 'Separates catalytic kinetics from thermodynamics.', prerequisiteObjectiveIds: [chem-kinetics-collision-energy], extensionObjectiveIds: [chem-kinetics-mechanism], issueSignals: [{ id: chemistry-kinetics-equilibrium-confusion }] }
  - { id: q9, type: multipleChoice, prompt: 'On an energy profile, a catalyst changes which labeled quantity?', choices: [{ id: a, text: activation energy, issueSignals: [] }, { id: b, text: reactant-to-product enthalpy difference, issueSignals: [{ id: chemistry-catalyst-state-function-confusion }] }, { id: c, text: atom conservation, issueSignals: [{ id: chemistry-conservation-confusion }] }], answer: { choiceId: a }, explanation: 'Solution: Activation energy. Why it works: The alternate path has a lower peak. Why the other choices fail: b is a state-function difference; c is unchanged in all balanced reactions.', difficultyDimensions: [diagramInterpretation, stateFunctionDistinction, mechanismReasoning], difficultyEvidence: 'Reads a pathway graph while preserving conserved quantities.', prerequisiteObjectiveIds: [chem-kinetics-collision-energy], extensionObjectiveIds: [chem-kinetics-mechanism], issueSignals: [{ id: chemistry-catalyst-state-function-confusion }] }
  - { id: q10, type: freeResponse, prompt: 'A proposed slow elementary step is $M+N\rightarrow I$. State the rate law predicted by this step and name one further check required before accepting the mechanism.', answer: { gradingMode: selfCheck, keyPoints: ['rate = k[M][N]', 'compare predicted rate law with experiment', 'steps sum to net reaction'] }, explanation: 'Solution: The step predicts $rate=k[M][N]$; compare it with measured kinetics and confirm the summed steps give the net reaction. Why it works: A slow elementary step supplies its molecularity to its rate expression, but a mechanism needs independent evidence.', difficultyDimensions: [mechanismTranslation, evidenceValidation, openExplanation], difficultyEvidence: 'Transfers elementary-step molecularity into a testable mechanism claim.', prerequisiteObjectiveIds: [chem-kinetics-mechanism], extensionObjectiveIds: [chem-kinetics-rate-law], issueSignals: [{ id: chemistry-mechanism-rate-law-confusion }] }
  - { id: q11, type: numericResponse, prompt: 'A first-order sample starts at 0.640 M and has a 5.0 h half-life. Find concentration after 15.0 h.', answer: { value: 0.08, tolerance: 0.001 }, explanation: 'Solution: Three half-lives leave $0.640(1/2)^3=0.080$ M. Why it works: Each first-order half-life halves the remaining concentration.', difficultyDimensions: [timeModel, exponentialReasoning, quantitativeCalculation], difficultyEvidence: 'Converts elapsed time into repeated fractional change.', prerequisiteObjectiveIds: [chem-kinetics-time-models], extensionObjectiveIds: [chem-kinetics-rate-law], issueSignals: [{ id: chemistry-half-life-count-error }] }
  - { id: q12, type: multipleChoice, prompt: 'A catalyst is added to a reversible reaction already at equilibrium. What happens immediately?', choices: [{ id: a, text: forward and reverse rates rise equally, issueSignals: [] }, { id: b, text: products increase until K changes, issueSignals: [{ id: chemistry-kinetics-equilibrium-confusion }] }, { id: c, text: only reverse rate rises, issueSignals: [{ id: chemistry-catalyst-direction-confusion }] }], answer: { choiceId: a }, explanation: 'Solution: Choose a. Why it works: The catalyst lowers barriers in both directions. Why the other choices fail: b predicts a K change at fixed temperature; c treats a pathway catalyst as direction-selective.', difficultyDimensions: [equilibriumContext, catalystMechanism, directionReasoning], difficultyEvidence: 'Transfers catalyst reasoning into a dynamic-equilibrium context.', prerequisiteObjectiveIds: [chem-kinetics-collision-energy], extensionObjectiveIds: [chem-kinetics-mechanism], issueSignals: [{ id: chemistry-kinetics-equilibrium-confusion }] }
