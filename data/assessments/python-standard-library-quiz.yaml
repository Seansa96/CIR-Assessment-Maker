schemaVersion: 1
id: python-standard-library-quiz
title: Python Standard Library Quiz
assessmentType: quiz
categoryId: python
subcategoryIds:
- python-standard-library
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 3
questions:
- id: q001
  type: multipleChoice
  prompt: 'If you want to roll a standard 20-sided die (values 1 through 20), which
    code is correct?

    '
  choices:
  - id: a
    text: '`random.randint(1, 20)`'
  - id: b
    text: '`random.choice(1, 20)`'
  - id: c
    text: '`random.randint(0, 19)`'
  - id: d
    text: '`random.rand(20)`'
  answer:
    choiceId: a
  explanation: '`randint(a, b)` includes both `a` and `b`. So `randint(1, 20)` will
    return a number from 1 to 20, just like a d20.

    '
- id: q002
  type: multipleChoice
  prompt: 'You are making a save system and want to convert this dictionary into a
    string:

    `save_data = {"hp": 100, "level": 5}`


    Which function do you use?

    '
  choices:
  - id: a
    text: '`json.dumps(save_data)`'
  - id: b
    text: '`json.loads(save_data)`'
  - id: c
    text: '`os.dump(save_data)`'
  - id: d
    text: '`str.json(save_data)`'
  answer:
    choiceId: a
  explanation: '`dumps` (dump string) takes a Python object and converts it into a
    JSON-formatted string.

    '
- id: q003
  type: multipleChoice
  prompt: 'If you run `random.choice(["Sword", "Shield"])` 100 times, roughly\rhow
    many times will it return "Shield"?

    '
  choices:
  - id: a
    text: About 50 times.
  - id: b
    text: Exactly 1 time, then it removes it from the list.
  - id: c
    text: 100 times.
  - id: d
    text: 0 times, because strings are not numbers.
  answer:
    choiceId: a
  explanation: '`random.choice()` picks an item with uniform probability. Since there
    are 2 items, "Shield" has a 50% chance of being chosen each time.

    '
- id: q004
  type: numericResponse
  prompt: 'Trace this math code:


    ```python

    import math


    base_damage = 15.8

    final_damage = math.floor(base_damage) + 2

    ```


    What is `final_damage`?

    '
  answer:
    value: 17
    tolerance: 0
  explanation: '`math.floor(15.8)` rounds down to the nearest integer, which is `15`.
    Then `15 + 2` equals `17`.

    '
