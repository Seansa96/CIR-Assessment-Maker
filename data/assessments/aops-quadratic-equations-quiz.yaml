schemaVersion: 1
id: aops-quadratic-equations-quiz
title: Quadratic Equations Practice Quiz
assessmentType: quiz
categoryId: art-of-problem-solving
topicId: aops-quadratic-equations
modeDefault: practice
randomizeQuestions: true
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
  - art-of-problem-solving
  - aops-quadratic-equations
  - quadratic-formula
  - discriminant
  - root-relations
skills:
- Solve quadratics by efficient valid methods
- Classify roots from the discriminant
- Use root sums and products to build and analyze equations
- Check substituted and squared equations for invalid candidates
questions:
- id: q001
  type: multipleChoice
  prompt: 'Solve $x^2-9=0$.'
  choices:
  - id: a
    text: '$x=3$ only'
  - id: b
    text: '$x=-3$ only'
  - id: c
    text: '$x=\pm3$'
  - id: d
    text: '$x=9$'
  answer:
    choiceId: c
  explanation: Factor as $(x-3)(x+3)=0$ or take both square roots of 9.
- id: q002
  type: multipleChoice
  prompt: 'Solve $x^2+7x+12=0$.'
  choices:
  - id: a
    text: '$x=3,4$'
  - id: b
    text: '$x=-3,-4$'
  - id: c
    text: '$x=-3,4$'
  - id: d
    text: '$x=3,-4$'
  answer:
    choiceId: b
  explanation: Factor as $(x+3)(x+4)=0$.
- id: q003
  type: multipleChoice
  prompt: 'What is the discriminant of $3x^2-4x+5=0$?'
  choices:
  - id: a
    text: '$-44$'
  - id: b
    text: '$-16$'
  - id: c
    text: '16'
  - id: d
    text: '44'
  answer:
    choiceId: a
  explanation: $(-4)^2-4(3)(5)=16-60=-44$.
- id: q004
  type: multipleChoice
  prompt: 'How many real roots does $x^2+4x+4=0$ have?'
  choices:
  - id: a
    text: Two distinct real roots
  - id: b
    text: One repeated real root
  - id: c
    text: No real roots
  - id: d
    text: Infinitely many roots
  answer:
    choiceId: b
  explanation: The polynomial is $(x+2)^2$ and has discriminant zero.
- id: q005
  type: multipleChoice
  prompt: 'Solve $x^2+1=0$ over the complex numbers.'
  choices:
  - id: a
    text: No solutions
  - id: b
    text: '$x=1,-1$'
  - id: c
    text: '$x=i$ only'
  - id: d
    text: '$x=\pm i$'
  answer:
    choiceId: d
  explanation: The equation is $x^2=-1$, whose two complex roots are $i$ and $-i$.
- id: q006
  type: multipleChoice
  prompt: 'Which monic quadratic has roots 2 and $-5$?'
  choices:
  - id: a
    text: '$x^2-3x-10=0$'
  - id: b
    text: '$x^2+3x-10=0$'
  - id: c
    text: '$x^2-7x+10=0$'
  - id: d
    text: '$x^2+7x-10=0$'
  answer:
    choiceId: b
  explanation: Expand $(x-2)(x+5)$.
- id: q007
  type: multipleChoice
  prompt: 'What are the sum and product of the roots of $4x^2-7x+2=0$?'
  choices:
  - id: a
    text: 'Sum $-7/4$, product $1/2$'
  - id: b
    text: 'Sum $7/4$, product $1/2$'
  - id: c
    text: 'Sum $7/4$, product $-1/2$'
  - id: d
    text: 'Sum 7, product 2'
  answer:
    choiceId: b
  explanation: Vieta gives $-b/a=7/4$ and $c/a=1/2$.
- id: q008
  type: multipleChoice
  prompt: 'Solve $x^2+2x-7=0$.'
  choices:
  - id: a
    text: '$x=1\pm2\sqrt2$'
  - id: b
    text: '$x=-1\pm2\sqrt2$'
  - id: c
    text: '$x=-2\pm\sqrt7$'
  - id: d
    text: '$x=-1\pm\sqrt7$'
  answer:
    choiceId: b
  explanation: Completing the square gives $(x+1)^2=8$.
- id: q009
  type: multipleChoice
  prompt: 'Solve $x^4-5x^2+4=0$ over the reals.'
  choices:
  - id: a
    text: '$x=1,4$'
  - id: b
    text: '$x=\pm1,\pm2$'
  - id: c
    text: '$x=\pm1,\pm4$'
  - id: d
    text: '$x=0,\pm5$'
  answer:
    choiceId: b
  explanation: Let $u=x^2$, solve $u=1,4$, then take both square roots of each value.
- id: q010
  type: multipleChoice
  prompt: 'A rectangle has width $x$, length $x+2$, and area 48. What is its positive width?'
  choices:
  - id: a
    text: '4'
  - id: b
    text: '6'
  - id: c
    text: '8'
  - id: d
    text: '10'
  answer:
    choiceId: b
  explanation: $x(x+2)=48$ factors as $(x-6)(x+8)=0$; a length must be positive.
- id: q011
  type: multipleChoice
  prompt: 'Solve $\sqrt{x+5}=x-1$ over the reals.'
  choices:
  - id: a
    text: '$x=4$ only'
  - id: b
    text: '$x=-1$ only'
  - id: c
    text: '$x=4$ or $x=-1$'
  - id: d
    text: No real solution
  answer:
    choiceId: a
  explanation: Squaring produces 4 and $-1$, but only 4 satisfies the original equation and $x\ge1$.
- id: q012
  type: multipleChoice
  prompt: 'For which real $k$ does $x^2+kx+9=0$ have one repeated real root?'
  choices:
  - id: a
    text: '$k=6$ only'
  - id: b
    text: '$k=-6$ only'
  - id: c
    text: '$k=\pm6$'
  - id: d
    text: '$k=36$'
  answer:
    choiceId: c
  explanation: Set the discriminant $k^2-36$ equal to zero.
- id: q013
  type: selectAll
  prompt: 'Which statements about $ax^2+bx+c=0$ with real coefficients and $a\ne0$ are correct?'
  choices:
  - id: a
    text: A positive discriminant gives two distinct real roots.
  - id: b
    text: A zero discriminant gives a repeated real root.
  - id: c
    text: A negative discriminant gives no roots in the complex numbers.
  - id: d
    text: Nonreal roots occur as conjugates.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: A negative discriminant gives two nonreal complex-conjugate roots.
- id: q014
  type: selectAll
  prompt: 'Which practices belong in a complete quadratic solution?'
  choices:
  - id: a
    text: Put the equation in a form appropriate for the chosen method.
  - id: b
    text: Reverse every substitution and preserve its range restrictions.
  - id: c
    text: Keep all roots after squaring without checking the original equation.
  - id: d
    text: Reject algebraic roots that violate physical or denominator restrictions.
  answer:
    choiceIds:
    - a
    - b
    - d
  explanation: Squaring and denominator clearing require original-equation checks.
- id: q015
  type: freeResponse
  prompt: |-
    Prove that a monic quadratic with roots $r$ and $s$ can be written $x^2-(r+s)x+rs=0$.
  answer:
    gradingMode: selfCheck
    expected: |-
      A monic quadratic with roots $r,s$ has factors $(x-r)(x-s)$. Expanding gives $x^2-rx-sx+rs=x^2-(r+s)x+rs$. Setting the product equal to zero produces the stated equation.
    keyPoints:
    - Uses the factors $(x-r)(x-s)$.
    - Expands the middle term with the correct negative sign.
    - Connects the factorization with the zero-product roots.
  explanation: The expansion directly yields Vieta's sum and product relations.
