questions:
- id: q1
  type: numericResponse
  prompt: A force $\vec{F} = (3.0\hat{i} - 4.0\hat{j}) \text{ N}$ is applied at position
    $\vec{r} = (2.0\hat{i} + 5.0\hat{j}) \text{ m}$. What is the z-component of the
    torque?
  answer:
    value: -23.0
    tolerance: 1.0
  explanation: $\vec{\tau} = \vec{r} \times \vec{F} = (2.0\hat{i} + 5.0\hat{j}) \times
    (3.0\hat{i} - 4.0\hat{j}) = -8.0\hat{k} - 15.0\hat{k} = -23.0\hat{k} \text{ N}\cdot\text{m}$.
