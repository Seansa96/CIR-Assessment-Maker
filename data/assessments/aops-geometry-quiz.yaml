- id: q-aops-geom-similar-tri-parallel
  type: numericResponse
  prompt: 'In $\triangle ABC$, points $D$ and $E$ lie on sides $AB$ and $AC$, respectively, such that $DE \parallel BC$. If $AB = 3AD$ and $DE = 6$, what is the length of $BC$?'
  difficultyDimensions:
  - 'Identify that $DE \parallel BC$ implies $\triangle ADE \sim \triangle ABC$ by Angle-Angle similarity.'
  - 'Determine the similarity ratio is $AD/AB = 1/3$.'
  - 'Apply the ratio to find $BC = 3 \cdot DE = 18$.'
  answer:
    value: 18
    tolerance: 0
  explanation: |
    Solution:
    Since $DE \parallel BC$, $\angle ADE = \angle ABC$ and $\angle AED = \angle ACB$ because they are corresponding angles.
    Therefore, $\triangle ADE \sim \triangle ABC$ by Angle-Angle (AA) similarity.
    The ratio of corresponding sides is $\frac{AD}{AB}$. We are given that $AB = 3AD$, so the ratio is $\frac{1}{3}$.
    This means that every side of $\triangle ADE$ is $\frac{1}{3}$ the length of the corresponding side of $\triangle ABC$.
    Therefore, $\frac{DE}{BC} = \frac{1}{3}$. Since $DE = 6$, $BC = 3 \cdot 6 = 18$.

    Why it works:
    Parallel lines intersecting two transversals (the sides of the triangle) create proportional segments and congruent corresponding angles, embedding a scaled, similar version of the original triangle inside it.

- id: q-aops-geom-similar-area-ratio
  type: multipleChoice
  prompt: 'Two triangles are similar. The area of the larger triangle is 16 times the area of the smaller triangle. If the shortest side of the smaller triangle has length 5, what is the length of the shortest side of the larger triangle?'
  difficultyDimensions:
  - 'Recall that the ratio of the areas of similar triangles is the square of the ratio of their corresponding sides.'
  - 'Compute the ratio of the sides as $\sqrt{16} = 4$.'
  - 'Apply the side ratio to the given length: $4 \cdot 5 = 20$.'
  choices:
  - id: a
    text: '20'
  - id: b
    text: '80'
    issueSignals:
    - id: area-ratio-confusion
      domains: []
  - id: c
    text: '10'
    issueSignals:
    - id: square-root-error
      domains: []
  - id: d
    text: '16'
    issueSignals:
    - id: irrelevant-number
      domains: []
  answer:
    choiceId: a
  explanation: |
    Solution:
    If two triangles are similar with a side ratio of $k$, the ratio of their areas is $k^2$.
    We are given that the area ratio is 16, so $k^2 = 16$.
    Taking the square root gives $k = 4$, so the sides of the larger triangle are 4 times as long as the sides of the smaller triangle.
    The shortest side of the smaller triangle is 5, so the shortest side of the larger triangle is $4 \cdot 5 = 20$.

    Why it works:
    Area is a two-dimensional measure. If you scale a figure by a factor of $k$ in every linear direction, its area scales by $k \times k = k^2$. 

    Why the other choices fail:
    - 80 incorrectly multiplies the length by the area ratio (16) instead of the side ratio (4).
    - 10 incorrectly uses a side ratio of 2 (perhaps confusing a square root with halving, or just doubling the side).
    - 16 simply guesses the area ratio itself as the side length.
