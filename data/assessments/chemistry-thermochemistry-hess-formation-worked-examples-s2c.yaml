workedExamples:
- id: example-1
  title: 'Calorimetry: heat gained by water'
  problem: A 100.0 g water sample warms from 22.0 °C to 28.5 °C. Use $c=4.184\ \mathrm{J/(g\,°C)}$. Find
    heat gained by water and heat of the system.
  steps:
  - id: e1s1
    title: Temperature change
    instruction: Subtract initial from final temperature.
    type: numericResponse
    prompt: Find $\Delta T$ in °C.
    answer:
      value: 6.5
      tolerance: 0.01
    explanation: 'Solution: $28.5-22.0=6.5\ ^\circ\mathrm{C}$.


      Why it works: Temperature change is final minus initial.'
  - id: e1s2
    title: Heat of water
    instruction: Use $q=mc\Delta T$.
    type: numericResponse
    prompt: Find $q_{water}$ in J.
    answer:
      value: 2719.6
      tolerance: 3
    explanation: 'Solution: $(100.0)(4.184)(6.5)=2719.6\ \mathrm{J}$.


      Why it works: The water is the surroundings that absorb this heat.'
  - id: e1s3
    title: System sign
    instruction: Apply energy conservation.
    type: numericResponse
    prompt: Find $q_{system}$ in kJ.
    answer:
      value: -2.72
      tolerance: 0.02
    explanation: 'Solution: $q_{system}=-q_{water}=-2.72\ \mathrm{kJ}$.


      Why it works: An isolated calorimetry setup transfers heat between system and surroundings with
      opposite signs.'
- id: example-2
  title: 'Hess’s law: reverse and add'
  problem: Given $\mathrm{C+O_2\rightarrow CO_2}$, $\Delta H=-393.5$ kJ and $\mathrm{CO+1/2O_2\rightarrow
    CO_2}$, $\Delta H=-283.0$ kJ, find $\Delta H$ for $\mathrm{C+1/2O_2\rightarrow CO}$.
  steps:
  - id: e2s1
    title: Reverse the matching equation
    instruction: Reverse the equation containing CO₂ as a product.
    type: numericResponse
    prompt: What is $\Delta H$ (kJ) for $\mathrm{CO_2\rightarrow CO+1/2O_2}$?
    answer:
      value: 283.0
      tolerance: 0.01
    explanation: 'Solution: Reversal changes $-283.0$ to $+283.0\ \mathrm{kJ}$.


      Why it works: Enthalpy is a state function, so reversing a reaction reverses the sign.'
  - id: e2s2
    title: Add enthalpies
    instruction: Add the original first equation and the reversed second equation.
    type: numericResponse
    prompt: Find the summed $\Delta H$ in kJ.
    answer:
      value: -110.5
      tolerance: 0.01
    explanation: 'Solution: $-393.5+283.0=-110.5\ \mathrm{kJ}$.


      Why it works: Intermediate $\mathrm{CO_2}$ cancels when equations are added.'
  - id: e2s3
    title: Read the target
    instruction: Confirm that the remaining species match the target equation.
    type: numericResponse
    prompt: What is the target reaction enthalpy in kJ per mol CO formed?
    answer:
      value: -110.5
      tolerance: 0.01
    explanation: 'Solution: The remaining equation is $\mathrm{C+1/2O_2\rightarrow CO}$, so $\Delta H=-110.5\
      \mathrm{kJ}$.


      Why it works: After cancellation, the summed equation is exactly the requested reaction.'
- id: example-3
  title: 'Formation enthalpies: products minus reactants'
  problem: 'For $\mathrm{CH_4+2O_2\rightarrow CO_2+2H_2O(l)}$, use $\Delta H_f^\circ$: CH₄ = −74.8, CO₂
    = −393.5, H₂O(l) = −285.8, O₂ = 0 kJ/mol.'
  steps:
  - id: e3s1
    title: Products total
    instruction: Multiply each product formation enthalpy by its coefficient.
    type: numericResponse
    prompt: Find $\sum n\Delta H_f^\circ$ for products in kJ.
    answer:
      value: -965.1
      tolerance: 0.02
    explanation: 'Solution: $-393.5+2(-285.8)=-965.1\ \mathrm{kJ}$.


      Why it works: Formation enthalpies are extensive with reaction coefficients.'
  - id: e3s2
    title: Reactants total
    instruction: Include elements in their standard states.
    type: numericResponse
    prompt: Find $\sum n\Delta H_f^\circ$ for reactants in kJ.
    answer:
      value: -74.8
      tolerance: 0.02
    explanation: 'Solution: $-74.8+2(0)=-74.8\ \mathrm{kJ}$.


      Why it works: An element in its standard state has formation enthalpy zero.'
  - id: e3s3
    title: Reaction enthalpy
    instruction: Subtract reactants from products.
    type: numericResponse
    prompt: Find $\Delta H_{rxn}^\circ$ in kJ per mol CH₄.
    answer:
      value: -890.3
      tolerance: 0.02
    explanation: 'Solution: $-965.1-(-74.8)=-890.3\ \mathrm{kJ}$.


      Why it works: The formation-enthalpy equation is products minus reactants.'
