schemaVersion: 1
id: calc2-taylor-recall
title: Taylor and Maclaurin Series Recall
assessmentType: recallDrill
categoryId: calculus-2
topicId: taylor-maclaurin
skills:
- Construct Taylor and Maclaurin series
- Recognize standard expansions, symmetry, and remainder terms
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - calculus-2
  - taylor-maclaurin
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  skills:
  - taylor
  prompt: What is the formula for the n-th coefficient c_n of a Taylor series centered
    at a?
  answer:
    expected: f^(n)(a) / n!
    aliases:
    - f^n(a)/n!
    - nth derivative at a over n factorial
- id: r002
  type: typed
  skills:
  - taylor
  prompt: A Maclaurin series is a Taylor series centered at what value?
  answer:
    expected: '0'
    aliases:
    - zero
    - x=0
- id: r003
  type: typed
  skills:
  - taylor
  prompt: What is the Maclaurin series for e^x?
  answer:
    expected: \sum x^n / n!
    aliases:
    - sum x^n / n!
    - 1 + x + x^2/2 + ...
- id: r004
  type: typed
  skills:
  - taylor
  prompt: Does the Maclaurin series for sin(x) contain only even powers or only odd
    powers?
  answer:
    expected: odd
    aliases:
    - odd powers
- id: r005
  type: typed
  skills:
  - taylor
  prompt: Does the Maclaurin series for cos(x) alternate signs, or are all terms positive?
  answer:
    expected: alternate
    aliases:
    - alternates
    - alternating
- id: r006
  type: typed
  skills:
  - taylor-polynomials
  prompt: What is the degree-N Taylor polynomial of f centered at a commonly denoted?
  answer:
    expected: $P_N(x)$
    aliases:
    - P_N
    - Taylor polynomial
- id: r007
  type: flashcard
  skills:
  - taylor-remainders
  prompt: What does $R_N(x)=f(x)-P_N(x)$ represent?
  answer:
    expected: the Taylor remainder
    aliases:
    - remainder
    - truncation error
- id: r008
  type: typed
  skills:
  - standard-maclaurin-series
  prompt: What is the Maclaurin series for $\cos x$?
  answer:
    expected: '$\sum_{n=0}^{\infty}(-1)^n x^{2n}/(2n)!$'
    aliases:
    - sum (-1)^n x^(2n)/(2n)!
- id: r009
  type: typed
  skills:
  - standard-maclaurin-series
  prompt: What is the Maclaurin series for $\sin x$?
  answer:
    expected: '$\sum_{n=0}^{\infty}(-1)^n x^{2n+1}/(2n+1)!$'
    aliases:
    - sum (-1)^n x^(2n+1)/(2n+1)!
- id: r010
  type: typed
  skills:
  - standard-maclaurin-series
  prompt: What is the Maclaurin series for $\log(1+x)$?
  answer:
    expected: '$\sum_{n=1}^{\infty}(-1)^{n+1}x^n/n$'
    aliases:
    - x - x^2/2 + x^3/3 - ...
- id: r011
  type: flashcard
  skills:
  - lagrange-remainder
  prompt: In the Lagrange remainder bound, which derivative order is used after a degree-N Taylor polynomial?
  answer:
    expected: the $(N+1)$st derivative
    aliases:
    - N plus 1 derivative
- id: r012
  type: typed
  skills:
  - shifted-taylor-series
  prompt: In a Taylor series centered at a, in what power should terms be written?
  answer:
    expected: powers of $(x-a)$
    aliases:
    - x minus a
- id: r013
  type: flashcard
  skills:
  - polynomial-exactness
  prompt: What happens to the Taylor remainder once the degree reaches the degree of a polynomial?
  answer:
    expected: It is zero.
    aliases:
    - zero
    - the Taylor polynomial is exact
- id: r014
  type: typed
  skills:
  - parity
  prompt: What type of powers appear in the Maclaurin series of an odd analytic function?
  answer:
    expected: odd powers
    aliases:
    - only odd powers
- id: r015
  type: flashcard
  skills:
  - series-validity
  prompt: Is matching all formal derivatives enough for a smooth function to equal its Taylor series?
  answer:
    expected: no
    aliases:
    - the remainder must also approach zero
