questions:
- id: q001
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: A tensioned cable vibrates with wavelength 14.14 m when driven at 94.3 Hz.
    What is the wave number k in rad/m?
  answer:
    value: 0.4444
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 14.14 = 0.4444 rad/m.
- id: q002
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: A wave on a stretched string has wavelength 15.25 m and frequency 62.9 Hz.
    What is the wave number k in rad/m?
  answer:
    value: 0.412
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 15.25 = 0.4120 rad/m.
- id: q003
  type: numericResponse
  skills:
  - physics-stretched-string-wave-speed
  prompt: A laboratory ripple tank generates water waves of length 4.9 m at a frequency
    of 52.7 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 331.1239
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*52.7 = 331.1239 rad/s.
