questions:
- id: q001
  type: numericResponse
  prompt: A string carries waves at 30 m/s and has linear density 0.050 kg/m. What tension in N is required?
  answer: { value: 45, tolerance: 0.3 }
  explanation: |
    Solution: From $v^2=T/\mu$, $T=\mu v^2=0.050(30)^2=45$ N.

    Why it works: The string speed model is inverted to infer the tension needed for a specified propagation speed.
  difficultyDimensions: [reverseReasoning, modelOrDerivation, unitAnalysis]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q002
  type: numericResponse
  prompt: A 1.5 m string of mass 0.090 kg is under 60 N tension. What wave speed in m/s does it support?
  answer: { value: 31.62, tolerance: 0.2 }
  explanation: |
    Solution: $\mu=0.090/1.5=0.060$ kg/m, so $v=\sqrt{60/0.060}=31.62$ m/s.

    Why it works: Total mass must first be converted to linear density before the tension-speed relation can be used.
  difficultyDimensions: [multiStep, representationTransfer, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q003
  type: multipleChoice
  prompt: A string's tension and linear density are both multiplied by four. How does its wave speed change?
  choices:
  - { id: a, text: It is unchanged. }
  - { id: b, text: It doubles. }
  - { id: c, text: It is halved. }
  - { id: d, text: It quadruples. }
  answer: { choiceId: a }
  explanation: |
    Solution: It is unchanged.

    Why it works: $T/\mu$ is unchanged when numerator and denominator are multiplied by the same factor.

    Why the other choices fail: The square-root model depends on the ratio, not either parameter alone.
  difficultyDimensions: [proportionalReasoning, modelComparison, errorDiagnosis]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
- id: q004
  type: symbolicResponse
  prompt: Starting from $v=\sqrt{T/\mu}$, enter the linear density $\mu$ in terms of tension $T$ and wave speed $v$.
  answer: { expectedLatex: 'T/v^2', equivalenceMode: expression, variables: [T, v], tolerance: 0.000001 }
  explanation: |
    Solution: Square to get $v^2=T/\mu$, then rearrange: $\mu=T/v^2$.

    Why it works: Algebraic inversion isolates the mass-per-length parameter in the string-speed model.
  difficultyDimensions: [symbolicManipulation, reverseReasoning, modelOrDerivation]
  extensionObjectiveIds: [phys1-obj-wave-boundaries]
