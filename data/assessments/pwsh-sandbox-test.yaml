sandbox:
  language: pwsh
  image: "mcr.microsoft.com/powershell:latest"
  initialCommand: "pwsh"
  readOnlyFileSystem: false
  instructions: |
    Welcome to the PowerShell Sandbox!

    This is an interactive, browser-based terminal connected to a live container. 
    You can run PowerShell commands here directly. Try:
    
    * `Get-ChildItem`
    * `Get-Command`
    * `$PSVersionTable`

    When you are done experimenting, click the **Complete Sandbox** button.
