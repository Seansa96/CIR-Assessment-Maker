workedExamples:
- id: l1-sec1
  title: Resistors in Series
  problem: 'Review the following concept:'
  steps:
  - id: step1
    title: Resistors in Series
    instruction: 'Resistors in series carry the same current. The equivalent resistance
      is the sum of the individual resistances: $R_{eq} = R_1 + R_2 + \dots + R_n$.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
- id: l1-sec2
  title: Resistors in Parallel
  problem: 'Review the following concept:'
  steps:
  - id: step2
    title: Resistors in Parallel
    instruction: 'Resistors in parallel have the same voltage across them. The equivalent
      resistance is found using the reciprocal sum: $1/R_{eq} = 1/R_1 + 1/R_2 + \dots
      + 1/R_n$. For two resistors, $R_{eq} = (R_1 R_2) / (R_1 + R_2)$.'
    type: freeResponse
    prompt: Did you understand this concept?
    answer:
      gradingMode: selfCheck
