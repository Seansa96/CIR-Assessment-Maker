workedExamples:
- id: we001
  title: Column under Compression
  problem: |
    A cylindrical solid granite column has a radius of $0.5\text{ m}$ and an original height of $10.0\text{ m}$. It supports a massive statue with a mass of $200,000\text{ kg}$. 
    
    Given that the Young's Modulus of granite is $Y = 4.5 \times 10^{10}\text{ N/m}^2$ and taking $g = 9.8\text{ m/s}^2$, find the absolute compression ($\Delta L$) of the column in millimeters.
  steps:
  - id: step-1
    title: Calculate the cross-sectional area of the column
    instruction: |
      First, we need to find the area over which the force is distributed.
      
      $$ A = \pi r^2 = \pi (0.5)^2 \approx 0.785\text{ m}^2 $$
    type: numericResponse
    prompt: What is the column's cross-sectional area in $\mathrm{m}^2$?
    choices: []
    answer:
      value: 0.785398
      tolerance: 0.001
    explanation: |
      Solution: $A=\pi r^2=\pi(0.5\text{ m})^2=0.785\text{ m}^2$.
      
      Why it works: The load is distributed across the top circular face of the column.
  - id: step-2
    title: Calculate the applied compressive force
    instruction: |
      The force compressing the column is the weight of the statue.
      
      $$ F = mg = (200,000)(9.8) = 1,960,000\text{ N} $$
    type: numericResponse
    prompt: What compressive force in N does the statue apply to the column?
    choices: []
    answer:
      value: 1960000
      tolerance: 100
    explanation: |
      Solution: $F=mg=(200{,}000\text{ kg})(9.8\text{ m/s}^2)=1.96\times10^6\text{ N}$.
      
      Why it works: For the supported statue at rest, the compressive load it transmits equals its weight.
  - id: step-3
    title: Calculate stress and strain
    instruction: |
      The compressive stress $\sigma$ is:
      $$ \sigma = \frac{F}{A} = \frac{1,960,000}{0.785} \approx 2.49 \times 10^6\text{ N/m}^2 $$
      
      The strain $\epsilon$ is found using Young's Modulus ($Y = \sigma / \epsilon$):
      $$ \epsilon = \frac{\sigma}{Y} = \frac{2.49 \times 10^6}{4.5 \times 10^{10}} \approx 5.54 \times 10^{-5} $$
    type: numericResponse
    prompt: What is the magnitude of the column's axial strain?
    choices: []
    answer:
      value: 0.00005543
      tolerance: 0.0000002
    explanation: |
      Solution: $\sigma=F/A=(1.96\times10^6)/(0.785)=2.50\times10^6\text{ Pa}$, so $\epsilon=\sigma/Y=(2.50\times10^6)/(4.5\times10^{10})=5.54\times10^{-5}$.
      
      Why it works: Young's modulus is $Y=\sigma/\epsilon$, so axial stress divided by $Y$ gives the dimensionless strain in the linear elastic range.
  - id: step-4
    title: Calculate the absolute compression
    instruction: |
      Finally, we find the change in length $\Delta L$.
      
      $$ \Delta L = \epsilon L = (5.54 \times 10^{-5})(10.0) = 5.54 \times 10^{-4}\text{ m} $$
      
      To convert to millimeters, multiply by $1000$:
      $$ \Delta L \approx 0.55\text{ mm} $$
    type: numericResponse
    prompt: What is the magnitude of the column's compression in mm?
    choices: []
    answer:
      value: 0.5543
      tolerance: 0.003
    explanation: |
      Solution: $\Delta L=\epsilon L=(5.54\times10^{-5})(10.0\text{ m})=5.54\times10^{-4}\text{ m}=0.554\text{ mm}$.

      Why it works: The strain relation $\epsilon=\Delta L/L$ gives the total shortening once the fractional strain and original length are known.
