- id: q003
  type: multipleChoice
  skills:
  - solve-alternating-error-thresholds
  prompt: |
    For $\sum_{n=1}^{\infty}(-1)^{n-1}/n^2$, what is the least $N$ for
    which the alternating-series theorem guarantees $|R_N|<10^{-4}$?
  choices:
  - id: a
    text: $100$
  - id: b
    text: $99$
  - id: c
    text: $101$
  - id: d
    text: $10{,}000$
  answer:
    choiceId: a
  explanation: |-
    Solution: The bound is $1/(N+1)^2<10^{-4}$, requiring $N+1>100$ and hence least integer $N=100$. Therefore the answer is $100$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $99$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $101$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $10{,}000$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: q004
  type: multipleChoice
  skills:
  - bound-alternating-series-sums
  prompt: 'For a positive-first alternating series with decreasing magnitudes, which

    relation always holds?

    '
  choices:
  - id: a
    text: |-
      $S_{2N}\le S\le S_{2N-1}$
  - id: b
    text: |-
      $S_{2N-1}\le S\le S_{2N}$
  - id: c
    text: $S=S_N$ for some finite $N$
  - id: d
    text: |-
      $S\le0$
  answer:
    choiceId: a
  explanation: |-
    Solution: Even partial sums approach upward from below and odd partial sums approach downward from above. Therefore the answer is $S_{2N}\le S\le S_{2N-1}$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $S_{2N-1}\le S\le S_{2N}$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $S=S_N$ for some finite $N$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $S\le0$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
