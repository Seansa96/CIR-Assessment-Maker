schemaVersion: 1
id: calc2-alternating-series-hard-test
title: Alternating Series Hard Test
assessmentType: test
categoryId: calculus-2
topicId: alternating-series
skills:
- Verify alternating-series hypotheses and reject invalid applications
- Classify signed series as absolute, conditional, or divergent
- Compute rigorous remainder bounds and approximation direction
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - alternating-series
  - hard
  - remainder-bounds
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - check-the-term-test-before-ast
  prompt: |
    What happens to $\sum_{n=1}^{\infty}(-1)^n n/(n+1)$?
  choices:
  - id: a
    text: It diverges by the term test.
  - id: b
    text: It converges conditionally.
  - id: c
    text: It converges absolutely.
  - id: d
    text: It telescopes.
  answer:
    choiceId: a
  explanation: The term magnitude approaches one, so the terms do not approach zero.
- id: q002
  type: multipleChoice
  skills:
  - classify-alternating-series
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^{n-1}/(n+\sqrt n)$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: The positive magnitudes decrease to zero, but limit comparison with $1/n$ gives absolute
    divergence.
- id: q003
  type: multipleChoice
  skills:
  - solve-alternating-error-thresholds
  prompt: |
    For $\sum_{n=1}^{\infty}(-1)^{n-1}/n^2$, what is the least $N$ for
    which the alternating-series theorem guarantees $|R_N|<10^{-4}$?
  choices:
  - id: a
    text: $100$
  - id: b
    text: $99$
  - id: c
    text: $101$
  - id: d
    text: $10{,}000$
  answer:
    choiceId: a
  explanation: The bound is $1/(N+1)^2<10^{-4}$, requiring $N+1>100$ and hence least integer $N=100$.
- id: q004
  type: multipleChoice
  skills:
  - bound-alternating-series-sums
  prompt: |
    For a positive-first alternating series with decreasing magnitudes, which
    relation always holds?
  choices:
  - id: a
    text: |-
      $S_{2N}\le S\le S_{2N-1}$
  - id: b
    text: |-
      $S_{2N-1}\le S\le S_{2N}$
  - id: c
    text: $S=S_N$ for some finite $N$
  - id: d
    text: |-
      $S\le0$
  answer:
    choiceId: a
  explanation: Even partial sums approach upward from below and odd partial sums approach downward from
    above.
- id: q005
  type: multipleChoice
  skills:
  - verify-eventual-monotonicity
  prompt: |
    Why is the alternating-series test applicable to
    $\sum_{n=3}^{\infty}(-1)^n(\ln n)/n$?
  choices:
  - id: a
    text: |-
      $\ln x/x$ decreases for $x>e$ and tends to $0$.
  - id: b
    text: |-
      $\sum(\ln n)/n$ converges.
  - id: c
    text: The magnitudes decrease from $n=1$ onward.
  - id: d
    text: Every logarithmic series converges.
  answer:
    choiceId: a
  explanation: |-
    Differentiation gives $(1-\ln x)/x^2<0$ after e, and the logarithm grows more slowly than x.
- id: q006
  type: multipleChoice
  skills:
  - classify-rational-alternating-series
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^n(n+1)/(n^2+1)$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Telescoping
  answer:
    choiceId: a
  explanation: The magnitude is eventually decreasing to zero and is asymptotic to $1/n$, so its absolute
    series diverges.
- id: q007
  type: multipleChoice
  skills:
  - classify-parameterized-alternating-series
  prompt: |
    For which $p$ is $\sum_{n=1}^{\infty}(-1)^{n-1}/n^p$
    conditionally convergent?
  choices:
  - id: a
    text: |-
      $0<p\le1$
  - id: b
    text: $p>1$
  - id: c
    text: |-
      $p\le0$
  - id: d
    text: Every real $p$
  answer:
    choiceId: a
  explanation: Signed convergence needs $p>0$, while absolute p-series convergence begins only when $p>1$.
- id: q008
  type: multipleChoice
  skills:
  - classify-slowly-decreasing-alternating-series
  prompt: |
    What is the strongest classification of
    $\sum_{n=2}^{\infty}(-1)^n/\ln(n+1)$?
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent because logarithms grow slowly
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: |-
    The magnitudes decrease to zero; their positive sum diverges since eventually $1/\ln(n+1)>1/n$.
- id: q009
  type: multipleChoice
  skills:
  - use-small-angle-comparison
  prompt: |
    Classify $\sum_{n=1}^{\infty}(-1)^{n-1}\sin(1/n)$.
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent by the term test
  - id: d
    text: Telescoping
  answer:
    choiceId: a
  explanation: |-
    The magnitudes decrease to zero, while $\sin(1/n)/(1/n)\to1$, so the absolute series behaves harmonically.
- id: q010
  type: multipleChoice
  skills:
  - compute-error-guarantees
  prompt: |
    If $S_{20}$ approximates
    $\sum_{n=1}^{\infty}(-1)^{n-1}/(2n+1)$, which guaranteed error bound is
    sharpest from the alternating-series theorem?
  choices:
  - id: a
    text: $1/43$
  - id: b
    text: $1/41$
  - id: c
    text: $1/21$
  - id: d
    text: $1/400$
  answer:
    choiceId: a
  explanation: |-
    The first omitted index is 21, whose magnitude is $1/(2\cdot21+1)=1/43$.
- id: q011
  type: multipleChoice
  skills:
  - detect-invalid-ast-use
  prompt: |
    A signed series has two positive terms followed by two negative terms,
    repeating, and term magnitudes $1/n$. Why does the ordinary
    alternating-series test not apply directly?
  choices:
  - id: a
    text: The signs do not alternate term by term.
  - id: b
    text: The terms fail to approach zero.
  - id: c
    text: $1/n$ is increasing.
  - id: d
    text: Negative terms are forbidden.
  answer:
    choiceId: a
  explanation: The standard theorem requires a single sign change at each successive term; a block argument
    would need separate analysis.
- id: q012
  type: multipleChoice
  skills:
  - combine-ratio-and-alternating-tests
  prompt: |
    For a signed series, suppose
    $\lim|a_{n+1}/a_n|=3/4$. What is guaranteed?
  choices:
  - id: a
    text: Absolute convergence
  - id: b
    text: Conditional convergence only
  - id: c
    text: Divergence
  - id: d
    text: No conclusion
  answer:
    choiceId: a
  explanation: |-
    A ratio limit below one proves convergence of $\sum|a_n|$, which is stronger than signed convergence.
- id: q013
  type: multipleChoice
  skills:
  - analyze-factorial-alternating-series
  prompt: |
    How does $\sum_{n=1}^{\infty}(-1)^n n!/(2n)!$ converge?
  choices:
  - id: a
    text: Absolutely
  - id: b
    text: Conditionally
  - id: c
    text: It diverges.
  - id: d
    text: The term test is inconclusive and no other test applies.
  answer:
    choiceId: a
  explanation: The absolute consecutive ratio is $(n+1)/[(2n+2)(2n+1)]$, which tends to zero.
- id: q014
  type: multipleChoice
  skills:
  - check-vanishing-terms
  prompt: |
    Determine the behavior of
    $\sum_{n=1}^{\infty}(-1)^n(1+1/n)$.
  choices:
  - id: a
    text: Divergent
  - id: b
    text: Conditionally convergent
  - id: c
    text: Absolutely convergent
  - id: d
    text: Converges to zero
  answer:
    choiceId: a
  explanation: The term magnitudes approach one, so the terms themselves do not approach zero.
- id: q015
  type: multipleChoice
  skills:
  - infer-error-sign
  prompt: |
    A positive-first alternating series has decreasing magnitudes. If $N$ is
    odd, how does $S_N$ compare with the sum $S$?
  choices:
  - id: a
    text: $S_N>S$
  - id: b
    text: $S_N<S$
  - id: c
    text: $S_N=S$
  - id: d
    text: No comparison is possible
  answer:
    choiceId: a
  explanation: Odd partial sums end after a positive term and form the decreasing sequence of upper bounds.
attemptQuestionCount: 15
