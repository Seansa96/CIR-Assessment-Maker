- id: q007
  type: multipleChoice
  skills:
  - classify-parameterized-alternating-series
  prompt: |
    For which $p$ is $\sum_{n=1}^{\infty}(-1)^{n-1}/n^p$
    conditionally convergent?
  choices:
  - id: a
    text: |-
      $0<p\le1$
  - id: b
    text: $p>1$
  - id: c
    text: |-
      $p\le0$
  - id: d
    text: Every real $p$
  answer:
    choiceId: a
  explanation: |-
    Solution: Signed convergence needs $p>0$, while absolute p-series convergence begins only when $p>1$. Therefore the answer is $0<p\le1$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

