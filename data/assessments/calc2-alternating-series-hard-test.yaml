  type: multipleChoice
  skills:
  - check-the-term-test-before-ast
  prompt: |
    What happens to $\sum_{n=1}^{\infty}(-1)^n n/(n+1)$?
  choices:
  - id: a
    text: It diverges by the term test.
  - id: b
    text: It converges conditionally.
  - id: c
    text: It converges absolutely.
  - id: d
    text: It telescopes.
  answer:
    choiceId: a
  explanation: |-
    Solution: The term magnitude approaches one, so the terms do not approach zero. Therefore the answer is It diverges by the term test.. Therefore the answer is It diverges by the term test.. Therefore the answer is It diverges by the term test.. Therefore the answer is It diverges by the term test.. Therefore the answer is It diverges by the term test.. Therefore the answer is It diverges by the term test..

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: It converges conditionally. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; It converges absolutely. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; It telescopes. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
