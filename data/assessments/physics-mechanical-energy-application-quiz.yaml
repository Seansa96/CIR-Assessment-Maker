questions:
- id: q-block-ramp
  title: Sliding Down a Ramp
  type: symbolicResponse
  prompt: |
    A block of mass $m$ starts from rest and slides down a frictionless track from a height $h$. 
    Derive an expression for its speed $v$ at the bottom of the track (height $0$). Let gravity be $g$.
  answer:
    gradingMode: auto
    expectedLatex: \sqrt{2*g*h}
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    Mechanical energy is conserved because there is no friction, and the normal force does zero work.
    $K_i + U_i = K_f + U_f \implies 0 + mgh = \frac{1}{2}mv^2 + 0$.
    Divide by $m$ to get $gh = \frac{1}{2}v^2$, so $v = \sqrt{2gh}$.
