lesson:
  introduction: Just as mass dictates how hard it is to linearly accelerate an object,
    an object's mass distribution dictates how hard it is to rotationally accelerate
    it.
  sections:
  - id: sec-1
    title: Rotational Kinetic Energy
    content: 'A rotating rigid body consists of many particles, each with some kinetic
      energy $K_i = \frac{1}{2}m_iv_i^2$. Because $v_i = r_i\omega$, the total kinetic
      energy is: $$K_{rot} = \sum \frac{1}{2}m_i(r_i\omega)^2 = \frac{1}{2} \left(
      \sum m_i r_i^2 \right) \omega^2$$


      We define the quantity in parentheses as the **Moment of Inertia**, $I = \sum
      m_i r_i^2$. Thus, the rotational kinetic energy simplifies to: $$K_{rot} = \frac{1}{2}I\omega^2$$

      This mirrors the linear kinetic energy formula $K = \frac{1}{2}mv^2$, with $I$
      replacing mass and $\omega$ replacing velocity.'
    media:
    - type: image
      src: /media/physics/owa/rotational-variables.svg
      alt: Wheel diagram showing radius and angular variables that determine rotational
        inertia.
      caption: Mass farther from the axis contributes more to rotational inertia.
    check:
      id: chk-ike-1
      type: multipleChoice
      prompt: If a rigid body's angular velocity is doubled, how does its rotational
        kinetic energy change?
      choices:
      - id: a
        text: It remains the same.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: It doubles.
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: c
        text: It quadruples.
      - id: d
        text: It increases by a factor of 8.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: c
      explanation: 'Solution:

        It quadruples.


        Why it works:

        Because $K_{rot} = \frac{1}{2}I\omega^2$, the kinetic energy is proportional
        to the square of the angular velocity. Doubling $\omega$ results in a $(2)^2
        = 4$ times increase in kinetic energy.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
  - id: sec-3
    title: Radius Squared Weighting
    content: 'Each mass contribution to inertia is $mr^2$, so moving mass outward strongly increases inertia.'
    media: []
    check: { id: chk-ike-5, type: multipleChoice, prompt: 'Moving a point mass from radius $r$ to $2r$ changes its inertia by:', choices: [{ id: a, text: half }, { id: b, text: twice }, { id: c, text: four times }, { id: d, text: unchanged }], answer: { choiceId: c }, explanation: 'Solution: It becomes four times.\n\nWhy it works: Inertia depends on $r^2$.\n\nWhy the other choices fail: They ignore the squared radius dependence.' }
  - id: sec-4
    title: Axis Dependence
    content: 'Moment of inertia depends on the chosen axis as well as mass distribution.'
    media: []
    check: { id: chk-ike-6, type: multipleChoice, prompt: 'The same object can have different moments of inertia about:', choices: [{ id: a, text: different axes }, { id: b, text: the same axis only }, { id: c, text: no axes }, { id: d, text: one time }], answer: { choiceId: a }, explanation: 'Solution: Different axes.\n\nWhy it works: Distances $r$ are measured from the selected axis.\n\nWhy the other choices fail: Changing the axis changes those distances.' }
  - id: sec-5
    title: Inertia Units
    content: 'The SI unit of moment of inertia is kg m$^2$.'
    media: []
    check: { id: chk-ike-7, type: multipleChoice, prompt: 'What are the SI units of moment of inertia?', choices: [{ id: a, text: kg }, { id: b, text: kg m }, { id: c, text: kg m$^2$ }, { id: d, text: J }], answer: { choiceId: c }, explanation: 'Solution: kg m$^2$.\n\nWhy it works: $I=\sum mr^2$.\n\nWhy the other choices fail: They omit a distance factor or name energy.' }
  - id: sec-6
    title: Common Shapes
    content: 'About a central axis, a hoop has $I=MR^2$ while a solid disk has $I=\tfrac12MR^2$.'
    media: []
    check: { id: chk-ike-8, type: multipleChoice, prompt: 'Which has larger inertia for equal $M$ and $R$?', choices: [{ id: a, text: solid disk }, { id: b, text: hoop }, { id: c, text: equal }, { id: d, text: neither }], answer: { choiceId: b }, explanation: 'Solution: The hoop.\n\nWhy it works: More mass lies at the maximum radius.\n\nWhy the other choices fail: Equal mass does not mean equal mass distribution.' }
  - id: sec-7
    title: Energy Scaling
    content: 'At fixed inertia, rotational kinetic energy scales as angular-speed squared.'
    media: []
    check: { id: chk-ike-9, type: multipleChoice, prompt: 'Halving angular speed changes rotational kinetic energy by factor:', choices: [{ id: a, text: one half }, { id: b, text: one quarter }, { id: c, text: two }, { id: d, text: four }], answer: { choiceId: b }, explanation: 'Solution: It becomes one quarter.\n\nWhy it works: $K=\tfrac12I\omega^2$.\n\nWhy the other choices fail: They treat the square relation as linear.' }
  - id: sec-2
    title: Moment of Inertia
    content: 'The Moment of Inertia $I$ is the rotational analog of mass. However,
      unlike mass, $I$ depends not only on *how much* mass there is, but on *how that
      mass is distributed* relative to the axis of rotation.


      Mass located further from the axis contributes much more to the moment of inertia
      (due to the $r_i^2$ term). Consequently, a hollow hoop is much harder to start
      spinning than a solid disk of the exact same mass and radius, because all of
      the hoop''s mass is far from the axis.'
    media: []
    check:
      id: chk-ike-2
      type: multipleChoice
      prompt: Two cylinders have the same mass and outer radius. Cylinder A is solid,
        while Cylinder B is a hollow shell. Which has the larger moment of inertia
        about its central axis?
      choices:
      - id: a
        text: Cylinder A (solid)
        issueSignals:
        - id: rotational-concept-misunderstood
      - id: b
        text: Cylinder B (hollow)
      - id: c
        text: They have the same moment of inertia.
        issueSignals:
        - id: inertia-mass-confusion
      - id: d
        text: It depends on their lengths.
        issueSignals:
        - id: rotational-concept-misunderstood
      answer:
        choiceId: b
      explanation: 'Solution:

        Cylinder B (hollow)


        Why it works:

        Cylinder B has all of its mass concentrated at the outer radius $r$, maximizing
        the $m_i r_i^2$ sum. Cylinder A has some mass closer to the center, which
        contributes less to $I$. Thus, B has the larger moment of inertia.


        Why the other choices fail:

        The distractors relate to common errors in fixed-axis rotation, such as confusing
        linear and angular kinematics, using the wrong lever arm, or misunderstanding
        moment of inertia.

        '
      difficultyDimensions:
      - conceptual
      - model-or-derivation
