questions:
- id: q001
  type: freeResponse
  skills:
  - parametric-curves
  - olympiad-problem-solving
  prompt: For $x=t^2-3$ and $y=2t$, eliminate $t$ and identify the curve.
  answer:
    gradingMode: selfCheck
    expected: $x=y^2/4-3$, a right-opening parabola.
    keyPoints:
    - 'Matches the reference result: $x=y^2/4-3$, a right-opening parabola.'
    - Explains the governing theorem, test, or construction used.
    - Checks the applicable conditions and original constraints.
  explanation: From $y=2t$, $t=y/2$. Substitute into $x=t^2-3$ to get $x=y^2/4-3$.
