questions:
- id: q1
  type: numericResponse
  prompt: An ice skater spinning at $2.0 \text{ rev/s}$ pulls her arms in, decreasing
    her moment of inertia to half its original value. What is her new spin rate in
    rev/s?
  answer:
    value: 4.0
    tolerance: 0.5
  explanation: $I_1\omega_1 = I_2\omega_2 \implies I(2) = (0.5I)\omega_2 \implies
    \omega_2 = 4 \text{ rev/s}$.
