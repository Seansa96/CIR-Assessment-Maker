questions:
- id: q1
  type: numericResponse
  prompt: An ice skater spinning at $2.0 \text{ rev/s}$ pulls her arms in, decreasing
    her moment of inertia to half its original value. What is her new spin rate in
    rev/s?
  answer:
    value: 4.0
    tolerance: 0.5
  difficultyDimensions: [modelOrDerivation, reverseReasoning]
  subjectDifficultyTags: [angular-momentum-conservation]
  difficultyEvidence: Uses an inverse proportionality implied by conservation of angular momentum.
  prerequisiteObjectiveIds: [phys1-obj-fixed-axis-rotation]
  explanation: |
    Solution: With negligible external torque,

    $$
    I_1\omega_1=I_2\omega_2.
    $$

    Since $I_2=0.5I_1$,

    $$
    I_1(2.0)=(0.5I_1)\omega_2,
    \qquad \omega_2=4.0\ \text{rev/s}.
    $$

    Why it works: With no external torque, angular momentum is conserved. Halving the moment of inertia doubles the spin rate.
