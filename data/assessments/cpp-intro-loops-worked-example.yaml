schemaVersion: 1
id: cpp-intro-loops-worked-example
title: C++ Intro to Loops Worked Example
assessmentType: workedExample
categoryId: c++
subcategoryIds:
  - c++-execution-flow
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Building a counted loop in C++
    problem: "Write a C++ function that uses a loop to add the integers from $1$ through $n$."
    steps:
      - id: s001
        title: Identify the repeated action
        instruction: "Start by deciding what operation must happen more than once."
        type: multipleChoice
        prompt: "In a function that adds the integers from $1$ through $n$, what is the repeated action?"
        choices:
          - id: a
            text: "Add the current counter value to a running total."
          - id: b
            text: "Return from the function before the loop starts."
          - id: c
            text: "Declare a new function on every iteration."
          - id: d
            text: "Change the function name each time the loop runs."
        answer:
          choiceId: a
        hint: "Think about what changes each time through the loop."
        explanation: |
          The loop should keep a running total and add the current counter value on each iteration.

          Related topic: Loop accumulation patterns in C++.

          Read further: Study `for` loops, loop counters, and accumulator variables in a C++ control-flow chapter.
      - id: s002
        title: Choose the loop bounds
        instruction: "A counted loop needs a starting value, a stopping condition, and an update."
        type: multipleChoice
        prompt: "Which loop header visits every integer from $1$ through $n$ exactly once?"
        choices:
          - id: a
            text: "`for (int i = 1; i <= n; i++)`"
          - id: b
            text: "`for (int i = 1; i < n; i++)`"
          - id: c
            text: "`for (int i = n; i <= 1; i++)`"
          - id: d
            text: "`for (int i = 0; i < n; i--)`"
        answer:
          choiceId: a
        hint: "The last value included should be exactly `n`."
        explanation: |
          Starting at `1`, continuing while `i <= n`, and incrementing with `i++` includes both endpoints.

          Related topic: Inclusive loop bounds and off-by-one errors.

          Read further: Review counted `for` loops and compare `<` versus `<=` in loop conditions.
      - id: s003
        title: Initialize the accumulator
        instruction: "The running total must start from the additive identity."
        type: multipleChoice
        prompt: "Before the loop starts, what value should `total` have?"
        choices:
          - id: a
            text: "`0`"
          - id: b
            text: "`1`"
          - id: c
            text: "`n`"
          - id: d
            text: "`i`"
        answer:
          choiceId: a
        hint: "Adding zero does not change the total."
        explanation: |
          An accumulator for addition should start at `0`; then each loop iteration adds one new value.

          Related topic: Accumulator initialization.

          Read further: Look up identity values for accumulation, especially `0` for sums and `1` for products.
      - id: s004
        title: Update inside the loop
        instruction: "Now decide what statement belongs inside the loop body."
        type: multipleChoice
        prompt: "Which statement correctly updates the accumulator?"
        choices:
          - id: a
            text: "`total += i;`"
          - id: b
            text: "`i += total;`"
          - id: c
            text: "`total = n;`"
          - id: d
            text: "`return total;`"
        answer:
          choiceId: a
        hint: "The accumulator should change, not the loop bound."
        explanation: |
          `total += i;` adds the current counter value to the running total.

          Related topic: Compound assignment in loop bodies.

          Read further: Review `+=` and how loop body statements execute once per iteration.
      - id: s005
        title: Complete the function
        instruction: "Put the loop together in a function that returns the accumulated sum."
        type: code
        prompt: |
          Complete the C++ function so it returns the sum of the integers from `1` through `n`.
        language: cpp
        functionName: sumToN
        starterCode: |
          int sumToN(int n) {
              int total = 0;
              // Add the integers 1 through n.
              return total;
          }
        tests:
          - input: "5"
            expected: "15"
          - input: "1"
            expected: "1"
          - input: "10"
            expected: "55"
        answer: {}
        hint: "Use `for (int i = 1; i <= n; i++)` and add `i` to `total`."
        explanation: |
          A correct solution initializes `total` to `0`, loops from `1` through `n`, adds each counter value, and returns the final total.

          Related topic: Complete counted-loop accumulation in C++.

          Read further: Practice writing functions that combine `for` loops, local variables, and return values.
