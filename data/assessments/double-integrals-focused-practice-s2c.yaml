- id: q002
  type: multipleChoice
  prompt: 'Which bounds describe $0\le x\le1$, $0\le y\le x$?'
  choices:
  - id: a
    text: '$\int_0^1\int_0^x f(x,y)dy dx$'
  - id: b
    text: '$\int_0^x\int_0^1 f dy dx$'
    issueSignals:
    - id: integration-bounds-error
  - id: c
    text: '$\int_0^1\int_x^0 f dy dx$'
    issueSignals:
    - id: integration-bounds-error
  - id: d
    text: '$\int_0^1 f dx$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: integration-bounds-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: For each x, y runs from zero to the line y=x.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Riemann Integration.

    Why the other choices fail: Choice b, ''$\int_0^x\int_0^1 f dy dx$'', does not give ''$\int_0^1\int_0^x f(x,y)dy dx$''
    for ''Which bounds describe $0\le x\le1$, $0\le y\le x$?''. It substitutes a different result, representation, or condition
    for the one the prompt specifies.

    Choice c, ''$\int_0^1\int_x^0 f dy dx$'', does not give ''$\int_0^1\int_0^x f(x,y)dy dx$'' for ''Which bounds describe
    $0\le x\le1$, $0\le y\le x$?''. It substitutes a different result, representation, or condition for the one the prompt
    specifies.

    Choice d, ''$\int_0^1 f dx$'', does not give ''$\int_0^1\int_0^x f(x,y)dy dx$'' for ''Which bounds describe $0\le x\le1$,
