questions:
- id: q001
  type: multipleChoice
  prompt: 'Evaluate $\int_0^1\int_0^2 1\,dy\,dx$.'
  choices:
  - id: a
    text: '2'
  - id: b
    text: '1'
    issueSignals:
    - id: integration-bounds-error
  - id: c
    text: '3'
    issueSignals:
    - id: integration-bounds-error
  - id: d
    text: '0'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: integration-bounds-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: The integrand 1 accumulates the rectangle''s area.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Riemann Integration.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
- id: q002
  type: multipleChoice
  prompt: 'Which bounds describe $0\le x\le1$, $0\le y\le x$?'
  choices:
  - id: a
    text: '$\int_0^1\int_0^x f(x,y)dy dx$'
  - id: b
    text: '$\int_0^x\int_0^1 f dy dx$'
    issueSignals:
    - id: integration-bounds-error
  - id: c
    text: '$\int_0^1\int_x^0 f dy dx$'
    issueSignals:
    - id: integration-bounds-error
  - id: d
    text: '$\int_0^1 f dx$'
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: integration-bounds-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: For each x, y runs from zero to the line y=x.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Riemann Integration.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
