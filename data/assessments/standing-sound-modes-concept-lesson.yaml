lesson:
  introduction: This lesson develops Normal Modes of a Standing Sound Wave from a diagram, a mathematical
    model, and a calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      Standing sound waves are created in air columns (tubes or pipes) when traveling sound waves reflect off the ends and superimpose. The physical system is modeled by the pipe's length and whether its ends are open to the atmosphere or closed.
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      Measurable quantities include the tube length $L$, the speed of sound $v$, and the resonant frequencies $f_n$. At a closed end, air molecules cannot move, creating a displacement node. At an open end, air is free to move, creating a displacement antinode.
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
  - id: s3
    title: Mathematical model
    content: >-
      For a pipe open at both ends (displacement antinodes at both ends), the longest wave that fits has half a wavelength inside: $L = \frac{\lambda_1}{2}$. This leads to the mathematical model $f_n = n\frac{v}{2L}$ for $n=1,2,3\dots$
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
  - id: s4
    title: Calculus connection
    content: >-
      For a pipe closed at one end (a node at the closed end, antinode at the open end), the fundamental mode fits only a quarter wavelength: $L = \frac{\lambda_1}{4}$. The mathematical model becomes $f_n = n\frac{v}{4L}$, where $n$ can only be odd integers ($1, 3, 5\dots$).
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
  - id: s5
    title: Derivation or justification
    content: >-
      Using calculus, if we model this in terms of pressure instead of displacement, the roles reverse! An open end is constrained to atmospheric pressure, so it is a pressure node (zero gauge pressure). A closed end is a pressure antinode (maximum pressure variation). The resulting math is identical.
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, drawing the displacement envelopes inside the tube helps visually identify the harmonic. An open-open tube fits integer multiples of half-waves. A closed-open tube fits odd integer multiples of quarter-waves.
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
  - id: s7
    title: Quantitative strategy
    content: >-
      A common quantitative strategy is determining the harmonic number $n$ based on the given overtone. For an open-open pipe, the 1st overtone is the 2nd harmonic ($n=2$). For a closed-open pipe, the 1st overtone is the 3rd harmonic ($n=3$).
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: Covering one end of a previously open tube halves its fundamental frequency, effectively dropping the pitch by one octave. The formulas successfully predict this behavior.
    media:
    - type: image
      src: /media/physics/owa/standing-sound-modes.svg
      alt: Labeled original schematic for Normal Modes of a Standing Sound Wave used for quantitative
        analysis.
      caption: Normal Modes of a Standing Sound Wave model diagram.
