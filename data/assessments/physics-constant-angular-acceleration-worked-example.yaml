- id: we-const-alpha-1
  title: Stopping a Centrifuge
  problem: A centrifuge operating at $3600 \text{ rev/min}$ is switched off and decelerates
    uniformly, coming to rest in $120 \text{ s}$. How many revolutions does it make
    before stopping?
  steps:
  - id: we-const-alpha-1-step1
    title: 'Step 1: Unit Conversion'
    instruction: Convert the initial angular velocity $\omega_0$ from rev/min to rad/s.
    prompt: Write down $\omega_0$ in rad/s. Leave your answer in terms of $\pi$.
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $3600 \text{ rev/min} \times \frac{2\pi \text{ rad}}{1 \text{ rev}} \times
        \frac{1 \text{ min}}{60 \text{ s}}$
      - $= 120\pi \text{ rad/s}$
    explanation: |
      Solution:

      $$
      3600\ \frac{\text{rev}}{\text{min}}
      \left(\frac{2\pi\ \text{rad}}{1\ \text{rev}}\right)
      \left(\frac{1\ \text{min}}{60\ \text{s}}\right)
      =120\pi\ \text{rad/s}.
      $$

      Why it works: The conversion factors cancel revolutions and minutes, leaving the SI angular-velocity unit of radians per second.
  - id: we-const-alpha-1-step2
    title: 'Step 2: Calculate Angular Acceleration'
    instruction: Use the kinematic equation $\omega = \omega_0 + \alpha t$ to find
      $\alpha$.
    prompt: What is $\alpha$?
    type: freeResponse
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $0 = 120\pi + \alpha(120)$
      - $\alpha = -\pi \text{ rad/s}^2$
    explanation: |
      Solution:

      $$
      \omega_f=\omega_0+\alpha t
      \quad\Rightarrow\quad
      0=120\pi+\alpha(120),
      $$

      so $\alpha=-\pi\ \text{rad/s}^2$.

      Why it works: Uniform deceleration means angular acceleration is constant, so the constant-angular-acceleration kinematic equation applies. The negative sign indicates acceleration opposite the initial rotation.
  - id: we-const-alpha-1-step3
    title: 'Step 3: Calculate Angular Displacement'
    instruction: Use $\theta = \omega_0 t + \frac{1}{2}\alpha t^2$ to find total displacement,
      then convert back to revolutions.
    prompt: What is the total number of revolutions?
    type: numericResponse
    answer:
      value: 3600
      tolerance: 1
    explanation: |
      Solution:

      $$
      \theta=\omega_0t+\frac12\alpha t^2
      =120\pi(120)+\frac12(-\pi)(120)^2
      =7200\pi\ \text{rad}.
      $$

      Converting gives

      $$
      \frac{7200\pi\ \text{rad}}{2\pi\ \text{rad/rev}}=3600\ \text{rev}.
      $$

      Why it works: Angular displacement under constant angular acceleration follows the rotational kinematic equation; division by $2\pi$ converts radians to revolutions.

- id: constant-angular-acceleration-we002
  title: Accelerating Turntable
  problem: 'A turntable starts at $2.0\ \mathrm{rad/s}$ and accelerates at $3.0\ \mathrm{rad/s^2}$ for 4.0 s. Find its final angular speed and angular displacement.'
  steps:
  - id: cawe4
    title: Find final angular speed
    instruction: Use $\omega=\omega_0+\alpha t$.
    prompt: 'What is the final angular speed in rad/s?'
    type: numericResponse
    answer: { value: 14, tolerance: 0.01 }
    explanation: 'Solution: $\omega=2.0+(3.0)(4.0)=14$ rad/s.\n\nWhy it works: Constant angular acceleration changes angular velocity linearly.'
  - id: cawe5
    title: Find angular displacement
    instruction: Use $\Delta\theta=\omega_0t+\tfrac12\alpha t^2$.
    prompt: 'What angular displacement occurs in radians?'
    type: numericResponse
    answer: { value: 32, tolerance: 0.01 }
    explanation: 'Solution: $\Delta\theta=(2.0)(4.0)+\tfrac12(3.0)(4.0)^2=32$ rad.\n\nWhy it works: The constant-acceleration displacement relation accounts for initial rotation and speeding up.'
