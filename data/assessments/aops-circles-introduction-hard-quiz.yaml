- id: hard-quiz-q061
  type: multipleChoice
  prompt: Concentric circles have radii $10$ and $6$. Find the area of the annulus.
  choices:
  - id: a
    text: $16\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $40\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $64\pi$
  - id: d
    text: $136\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Compute the areas of the outer and inner circles.
  - Subtract the inner area from the outer area.
  explanation: 'Solution:

    Area of outer circle $= \pi(10^2) = 100\pi$.

    Area of inner circle $= \pi(6^2) = 36\pi$.

    Annulus area $= 100\pi - 36\pi = 64\pi$.


    Why it works:

    The annulus is the region between the two concentric circles. Its area is precisely the large disk''s
    area minus the small disk''s area.


    Why the other choices fail:

    - **(A)** $16\pi = \pi(10-6)^2$ subtracts radii before squaring.

    - **(B)** $40\pi = 20\pi + 20\pi$ is random arithmetic or $4 \times 10\pi$.

    - **(D)** $136\pi = \pi(100+36)$ adds the areas instead of subtracting.

    '
- id: hard-quiz-q051
  type: multipleChoice
  prompt: Two circles have radii in ratio $5:3$. What is the ratio of their areas?
  choices:
  - id: a
    text: $5:3$
    issueSignals:
    - id: ratio-vs-area-ratio
      domains: []
  - id: b
    text: $10:6$
    issueSignals:
    - id: ratio-vs-area-ratio
      domains: []
  - id: c
    text: $25:9$
  - id: d
    text: $125:27$
    issueSignals:
    - id: ratio-vs-area-ratio
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recognize that the ratio of areas is the square of the ratio of radii.
  - Compute the square of the ratio.
  explanation: 'Solution:

    The ratio of radii is $5:3$.

    The ratio of areas is $(5/3)^2 = 25:9$.


    Why it works:

    Area is a 2-dimensional measure. When a shape is scaled linearly by a factor $k$, its area scales
    by $k^2$. Thus, the ratio of areas of similar figures (and all circles are similar) is the square
    of their linear ratio.


    Why the other choices fail:

    - **(A)** $5:3$ is the linear (radius/circumference) ratio.

    - **(B)** $10:6$ is an unreduced version of the linear ratio $5:3$.

    - **(D)** $125:27$ is the cubic (volume) ratio for spheres.

    '
- id: hard-quiz-q071
  type: multipleChoice
  prompt: A radius-13 circle has a chord whose distance from the center is $5$. Find the chord length.
  media:
  - type: image
    src: /assessments/aops/aops-circles-chord.svg
    alt: Perpendicular from center O to chord AB at midpoint M.
  choices:
  - id: a
    text: $12$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $18$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $24$
  - id: d
    text: $26$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Form a right triangle with the radius, center-to-chord distance, and half-chord.
  - Apply Pythagorean theorem to find half-chord and double it.
  explanation: 'Solution:

    The distance from the center is the perpendicular segment to the chord, which bisects it.

    This forms a right triangle with hypotenuse $13$ (radius) and leg $5$ (distance).

    Half-chord $x = \sqrt{13^2 - 5^2} = \sqrt{169-25} = \sqrt{144} = 12$.

    Full chord length $= 2 \times 12 = 24$.


    Why it works:

    The perpendicular from the center of a circle to a chord bisects the chord. Drawing a radius creates
    a right triangle, letting us use the Pythagorean theorem to find the half-chord.


    Why the other choices fail:

    - **(A)** $12$ is the length of the half-chord, failing to double it for the full length.

    - **(B)** $18 = 13 + 5$ adds the hypotenuse and leg.

    - **(D)** $26 = 2 \times 13$ is the length of the diameter (the longest possible chord).

    '
- id: hard-quiz-q091
  type: multipleChoice
  prompt: From external point $P$, tangent lengths are $4x-1$ and $2x+7$. Find $x$.
  choices:
  - id: a
    text: $2$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $4$
  - id: c
    text: $6$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $8$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Set the two tangent expressions equal based on the two-tangent theorem.
  - Solve the resulting linear equation.
  explanation: 'Solution:

    Tangents from an external point to a circle are equal in length.

    $$4x - 1 = 2x + 7$$

    $$2x = 8$$

    $$x = 4$$


    Why it works:

    The Two-Tangent Theorem states that if two tangent segments are drawn to a circle from an exterior
    point, then the segments are congruent.


    Why the other choices fail:

    - **(A)** $2$ comes from $4x+1 = 2x+7 \implies 2x=6 \implies x=3$ or similar sign error.

    - **(C)** $6$ might come from $4x-1+2x+7 = \text{something}$, but they must be equal.

    - **(D)** $8 = 2x$ is the step before dividing by 2.

    '
- id: hard-quiz-q081
  type: multipleChoice
  prompt: Point $P$ is $17$ units from center $O$ of a radius-8 circle. Find tangent length $PT$.
  media:
  - type: image
    src: /assessments/aops/aops-circles-tangent.svg
    alt: Tangent PT perpendicular to radius OT
    forming right triangle OPT.: null
  choices:
  - id: a
    text: $9$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $12$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $15$
  - id: d
    text: $25$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Recognize that the radius is perpendicular to the tangent at the point of tangency.
  - Apply Pythagorean theorem to the resulting right triangle with hypotenuse 17.
  explanation: 'Solution:

    The tangent $PT$ and radius $OT$ meet at a right angle.

    This forms right $\triangle OTP$ with hypotenuse $OP = 17$ and leg $OT = 8$.

    $$PT^2 + 8^2 = 17^2$$

    $$PT^2 + 64 = 289$$

    $$PT^2 = 225 \implies PT = 15$$


    Why it works:

    A tangent to a circle is perpendicular to the radius drawn to the point of tangency, guaranteeing
    a right triangle. We can then use the Pythagorean theorem.


    Why the other choices fail:

    - **(A)** $9 = 17-8$ finds the distance from $P$ to the closest point on the circle, not the tangent
    length.

    - **(B)** $12$ is a common right triangle leg but does not fit $8$ and $17$.

    - **(D)** $25 = 17+8$ adds the values.

    '
- id: hard-quiz-q062
  type: multipleChoice
  prompt: Tangents $PA,PB$ form $\angle APB=46^\circ$. Find minor central angle $\angle AOB$.
  choices:
  - id: a
    text: $46^\circ$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $92^\circ$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $134^\circ$
  - id: d
    text: $314^\circ$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Identify the quadrilateral formed by the two tangents and two radii.
  - Subtract the $46^\circ$ angle and two $90^\circ$ angles from $360^\circ$.
  explanation: 'Solution:

    The radii to the points of tangency are perpendicular to the tangents, so $\angle OAP = \angle OBP
    = 90^\circ$.

    The sum of angles in quadrilateral $OAPB$ is $360^\circ$:

    $$\angle AOB + 46^\circ + 90^\circ + 90^\circ = 360^\circ$$

    $$\angle AOB + 226^\circ = 360^\circ \implies \angle AOB = 134^\circ$$


    Why it works:

    Because two angles of the quadrilateral are $90^\circ$, the other two angles must sum to $180^\circ$
    (they are supplementary). Thus $180^\circ - 46^\circ = 134^\circ$.


    Why the other choices fail:

    - **(A)** $46^\circ$ assumes the central angle equals the tangent angle.

    - **(B)** $92^\circ = 2 \times 46^\circ$.

    - **(D)** $314^\circ = 360^\circ - 46^\circ$ forgets to subtract the two $90^\circ$ tangent angles.

    '
- id: hard-quiz-q052
  type: multipleChoice
  prompt: Find the perimeter of a $120^\circ$ sector of radius $9$.
  media:
  - type: image
    src: /assessments/aops/aops-circles-sector.svg
    alt: Circle sector showing two radii and its intercepted arc.
  choices:
  - id: a
    text: $6\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $18+6\pi$
  - id: c
    text: $18+12\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $81\pi/3$
    issueSignals:
    - id: area-formula-wrong-base
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Compute the arc length for the $120^\circ$ fraction of the circumference.
  - Add the two straight radii to get the total perimeter.
  explanation: 'Solution:

    Full circumference $C = 2\pi(9) = 18\pi$.

    The arc length is $\frac{120}{360} = \frac{1}{3}$ of the circumference: $\frac{1}{3}(18\pi) = 6\pi$.

    The boundary of the sector includes this arc PLUS the two straight radii.

    Perimeter $= 6\pi + 9 + 9 = 18 + 6\pi$.


    Why it works:

    A sector is a closed 2D shape bounded by one arc and two radii. Its perimeter must include all three
    boundary segments.


    Why the other choices fail:

    - **(A)** $6\pi$ is only the arc length, ignoring the two straight sides (radii).

    - **(C)** $18 + 12\pi$ computes the arc length as $2/3$ of the circumference instead of $1/3$.

    - **(D)** $81\pi/3 = 27\pi$ is the *area* of the sector, not the perimeter.

    '
- id: hard-quiz-q072
  type: multipleChoice
  prompt: Equal chords in the same circle are $7$ units from the center and have length $16$. What is
    the distance from the center to either chord?
  choices:
  - id: a
    text: $7$
  - id: b
    text: $8$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $14$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $16$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: a
  difficultyDimensions:
  - Understand the theorem that equal chords are equidistant from the center.
  - Recognize that the distance is already given in the prompt.
  explanation: 'Solution:

    The prompt states: "Equal chords ... are $7$ units from the center".

    Therefore, the distance from the center to either chord is $7$.


    Why it works:

    Chords of equal length in a circle are always equidistant from the center. The prompt provides this
    distance directly, testing reading comprehension and theorem confidence.


    Why the other choices fail:

    - **(B)** $8$ is half the chord length.

    - **(C)** $14 = 2 \times 7$.

    - **(D)** $16$ is the full chord length.

    '
- id: hard-quiz-q092
  type: multipleChoice
  prompt: A circle centered at $(2,-1)$ passes through $(8,7)$. Find its area.
  choices:
  - id: a
    text: $10\pi$
    issueSignals:
    - id: area-formula-wrong-base
      domains: []
  - id: b
    text: $50\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $64\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $100\pi$
  answer:
    choiceId: d
  difficultyDimensions:
  - Compute the radius using the 2D distance formula.
  - Square the radius and multiply by $\pi$ for the area.
  explanation: 'Solution:

    The radius is the distance between $(2,-1)$ and $(8,7)$:

    $$r = \sqrt{(8-2)^2 + (7 - (-1))^2} = \sqrt{6^2 + 8^2} = \sqrt{36+64} = \sqrt{100} = 10$$

    Area $= \pi r^2 = \pi(10^2) = 100\pi$.


    Why it works:

    The distance from the center to any point on the circle is the radius. The distance formula is an
    application of the Pythagorean theorem.


    Why the other choices fail:

    - **(A)** $10\pi$ is $\pi r$, forgetting to square the radius.

    - **(B)** $50\pi$ uses half of $100\pi$, perhaps treating $100$ as $2r^2$.

    - **(C)** $64\pi$ computes $r$ from only the y-coordinates or makes a coordinate math error.

    '
- id: hard-quiz-q082
  type: multipleChoice
  prompt: Two concentric circles have radii differing by $4$. What is the difference of their circumferences?
  choices:
  - id: a
    text: $4\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $8\pi$
  - id: c
    text: $16\pi$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: It depends on the individual radii.
    issueSignals:
    - id: algebra-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Write algebraic expressions for both circumferences.
  - Substitute the difference of the radii to find the difference of circumferences.
  explanation: 'Solution:

    Let the radii be $R$ and $r$, with $R - r = 4$.

    Difference of circumferences $= 2\pi R - 2\pi r = 2\pi(R - r)$.

    Substituting the difference: $2\pi(4) = 8\pi$.


    Why it works:

    Circumference is a linear function of radius $C = 2\pi r$. The difference between two circumferences
    is just $2\pi$ times the difference between their radii, independent of their absolute sizes.


    Why the other choices fail:

    - **(A)** $4\pi$ would be the difference if circumference was $\pi r$ instead of $2\pi r$.

    - **(C)** $16\pi = 4^2 \pi$ squares the difference, confusing it with area formulas.

    - **(D)** It is false that it depends on the radii; the $R$ and $r$ factor out perfectly.

    '
- id: hard-quiz-q063
  type: multipleChoice
  prompt: An annulus has inner radius $2$ and area $45\pi$. Find its outer radius.
  choices:
  - id: a
    text: $5$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $7$
  - id: c
    text: $9$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $47$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: b
  difficultyDimensions:
  - Set up the annulus area formula $A = \pi(R^2 - r^2)$.
  - Substitute knowns and solve for the outer radius $R$.
  explanation: 'Solution:

    Annulus Area $= \pi(R^2 - r^2) \implies 45\pi = \pi(R^2 - 2^2)$

    Divide by $\pi$:

    $$45 = R^2 - 4$$

    $$R^2 = 49 \implies R = 7$$


    Why it works:

    The area of an annulus is the outer disk''s area minus the inner disk''s area. This gives a direct
    equation that can be solved for the single unknown.


    Why the other choices fail:

    - **(A)** $5$ comes from $R^2 + 4 = 45 \implies R^2=41$ (maybe guessing $\sqrt{25}$).

    - **(C)** $9$ comes from incorrectly evaluating $\sqrt{45+4}$ or confusing $r=2$ with area $2\pi$.

    - **(D)** $47 = 45+2$, adding radius directly to area magnitude.

    '
- id: hard-quiz-q053
  type: multipleChoice
  prompt: A chord in a radius-10 circle is $6$ units from the center. What is its length?
  choices:
  - id: a
    text: $8$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $12$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: c
    text: $16$
  - id: d
    text: $20$
    issueSignals:
    - id: aops-sign-error
      domains: []
  answer:
    choiceId: c
  difficultyDimensions:
  - Apply the Pythagorean theorem to find the half-chord length.
  - Double the half-chord length.
  explanation: 'Solution:

    The distance to the chord is the perpendicular from the center, which bisects the chord.

    This creates a right triangle where hypotenuse $= 10$ and leg $= 6$.

    The other leg (half the chord) is $\sqrt{10^2 - 6^2} = \sqrt{100-36} = \sqrt{64} = 8$.

    Full chord $= 2 \times 8 = 16$.


    Why it works:

    The perpendicular from the center bisects the chord. The right triangle formed by the radius, distance
    to chord, and half-chord is a classic $6$-$8$-$10$ Pythagorean triple.


    Why the other choices fail:

    - **(A)** $8$ is the length of the half-chord.

    - **(B)** $12 = 2 \times 6$ doubles the distance instead of the half-chord.

    - **(D)** $20 = 2 \times 10$ is the length of the diameter.

    '
- id: hard-quiz-q073
  type: selectAll
  prompt: Which statements about chords in one circle are true?
  media:
  - type: image
    src: /assessments/aops/aops-circles-chord.svg
    alt: Center perpendicular to a chord at its midpoint.
  choices:
  - id: a
    text: A perpendicular from the center to a chord bisects it.
  - id: b
    text: Equal chords are equidistant from the center.
  - id: c
    text: Every chord passes through the center.
    issueSignals:
    - id: definition-error
      domains: []
  - id: d
    text: The chord closest to the center is longer than a chord farther away.
  answer:
    choiceIds:
    - a
    - b
    - d
  difficultyDimensions:
  - Identify the perpendicular bisector theorem for chords.
  - Understand the inverse relationship between chord length and center distance.
  explanation: 'Solution:

    (A), (B), and (D) are true theorems about circle chords.


    Why it works:

    The perpendicular from the center creates two congruent right triangles, bisecting the chord (A).
    By the Pythagorean theorem, a larger distance (leg) means a smaller half-chord (other leg), so closer
    chords are longer (D). Equal chords therefore have equal distances (B).


    (C) is false: Only diameters pass through the center. Most chords do not.

    '
- id: hard-quiz-q093
  type: selectAll
  prompt: Which transformations follow from a dilation of a circle by factor $k>0$?
  choices:
  - id: a
    text: Radius is multiplied by $k$.
  - id: b
    text: Circumference is multiplied by $k$.
  - id: c
    text: Area is multiplied by $k^2$.
  - id: d
    text: Every central angle is multiplied by $k$.
    issueSignals:
    - id: scaling-error
      domains: []
  answer:
    choiceIds:
    - a
    - b
    - c
  difficultyDimensions:
  - Apply 1D scaling to radius and circumference.
  - Apply 2D scaling to area.
  - Identify that angles are invariant under uniform scaling.
  explanation: 'Solution:

    (A), (B), and (C) are true.


    Why it works:

    A dilation by $k$ multiplies all linear (1D) measurements by $k$ (radius, circumference) and all 2D
    measurements by $k^2$ (area).


    (D) is false: Dilation is a similarity transformation that preserves all angle measures. A $90^\circ$
    sector remains a $90^\circ$ sector regardless of scale.

    '
- id: hard-quiz-q083
  type: freeResponse
  prompt: Prove that two tangent segments drawn from the same external point to a circle have equal lengths.
  media:
  - type: image
    src: /assessments/aops/aops-circles-tangent.svg
    alt: Radius to a tangent point forming a right triangle with an external point.
  difficultyDimensions:
  - Construct radii to the points of tangency to form right angles.
  - Connect the external point to the center to form a shared hypotenuse.
  - Apply HL congruence to conclude the tangent legs are equal.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Draws radii to both tangent points.
    - Uses the tangent-radius right angles.
    - Uses common hypotenuse and equal radii.
    - Concludes tangent lengths are equal by congruence.
  explanation: 'Solution:

    Let $P$ be the external point. Draw tangents from $P$ touching the circle at $A$ and $B$.

    Let $O$ be the center of the circle. Draw radii $OA$ and $OB$, and draw segment $OP$.

    By the tangent theorem, $OA \perp PA$ and $OB \perp PB$, creating two right triangles: $\triangle
    OAP$ and $\triangle OBP$.

    In these triangles:

    1. Hypotenuse $OP$ is common to both.

    2. Legs $OA = OB$ because they are radii of the same circle.

    By Hypotenuse-Leg (HL) congruence, $\triangle OAP \cong \triangle OBP$.

    Because corresponding parts of congruent triangles are equal, $PA = PB$.


    Why it works:

    Exploiting the tangent-radius right angle allows us to frame the entire problem as a simple right
    triangle congruence, avoiding complex circle arcs.

    '
