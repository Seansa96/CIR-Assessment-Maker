skills:
- Combine circle measurements with algebra and coordinate distance
- Use chord and tangent right triangles
- Apply theorem converses and prove equal tangent lengths
questions:
- id: hard-quiz-q061
  type: multipleChoice
  prompt: Concentric circles have radii $10$ and $6$. Find the area of the annulus.
  choices:
  - {id: a, text: '$16\pi$'}
  - {id: b, text: '$40\pi$'}
  - {id: c, text: '$64\pi$'}
  - {id: d, text: '$136\pi$'}
  answer: {choiceId: c}
  explanation: $\pi(10^2-6^2)=64\pi$.
- id: hard-quiz-q051
  type: multipleChoice
  prompt: Two circles have radii in ratio $5:3$. What is the ratio of their areas?
  choices:
  - {id: a, text: '$5:3$'}
  - {id: b, text: '$10:6$'}
  - {id: c, text: '$25:9$'}
  - {id: d, text: '$125:27$'}
  answer: {choiceId: c}
  explanation: Area scales as the square of the radius ratio.
- id: hard-quiz-q071
  type: multipleChoice
  prompt: A radius-13 circle has a chord whose distance from the center is $5$. Find the chord length.
  media:
  - {type: image, src: /assessments/aops/aops-circles-chord.svg, alt: Perpendicular from center O to chord AB at midpoint M.}
  choices:
  - {id: a, text: '$12$'}
  - {id: b, text: '$18$'}
  - {id: c, text: '$24$'}
  - {id: d, text: '$26$'}
  answer: {choiceId: c}
  explanation: The half-chord is $\sqrt{13^2-5^2}=12$, so the chord is $24$.
- id: hard-quiz-q091
  type: multipleChoice
  prompt: From external point $P$, tangent lengths are $4x-1$ and $2x+7$. Find $x$.
  choices:
  - {id: a, text: '$2$'}
  - {id: b, text: '$4$'}
  - {id: c, text: '$6$'}
  - {id: d, text: '$8$'}
  answer: {choiceId: b}
  explanation: Equal tangents give $4x-1=2x+7$, so $x=4$ and both lengths are $15$.
- id: hard-quiz-q081
  type: multipleChoice
  prompt: Point $P$ is $17$ units from center $O$ of a radius-8 circle. Find tangent length $PT$.
  media:
  - {type: image, src: /assessments/aops/aops-circles-tangent.svg, alt: Tangent PT perpendicular to radius OT, forming right triangle OPT.}
  choices:
  - {id: a, text: '$9$'}
  - {id: b, text: '$12$'}
  - {id: c, text: '$15$'}
  - {id: d, text: '$25$'}
  answer: {choiceId: c}
  explanation: $PT=\sqrt{17^2-8^2}=15$.
- id: hard-quiz-q062
  type: multipleChoice
  prompt: Tangents $PA,PB$ form $\angle APB=46^\circ$. Find minor central angle $\angle AOB$.
  choices:
  - {id: a, text: '$46^\circ$'}
  - {id: b, text: '$92^\circ$'}
  - {id: c, text: '$134^\circ$'}
  - {id: d, text: '$314^\circ$'}
  answer: {choiceId: c}
  explanation: Two right angles at tangency give $\angle AOB=180^\circ-46^\circ$.
- id: hard-quiz-q052
  type: multipleChoice
  prompt: Find the perimeter of a $120^\circ$ sector of radius $9$.
  media:
  - {type: image, src: /assessments/aops/aops-circles-sector.svg, alt: Circle sector showing two radii and its intercepted arc.}
  choices:
  - {id: a, text: '$6\pi$'}
  - {id: b, text: '$18+6\pi$'}
  - {id: c, text: '$18+12\pi$'}
  - {id: d, text: '$81\pi/3$'}
  answer: {choiceId: b}
  explanation: The arc is $(120/360)(18\pi)=6\pi$; add two radii totaling $18$.
- id: hard-quiz-q072
  type: multipleChoice
  prompt: Equal chords in the same circle are $7$ units from the center and have length $16$. What is the distance from the center to either chord?
  choices:
  - {id: a, text: '$7$'}
  - {id: b, text: '$8$'}
  - {id: c, text: '$14$'}
  - {id: d, text: '$16$'}
  answer: {choiceId: a}
  explanation: Equal chords are equidistant from the center; the stated distance transfers to either chord.
- id: hard-quiz-q092
  type: multipleChoice
  prompt: A circle centered at $(2,-1)$ passes through $(8,7)$. Find its area.
  choices:
  - {id: a, text: '$10\pi$'}
  - {id: b, text: '$50\pi$'}
  - {id: c, text: '$64\pi$'}
  - {id: d, text: '$100\pi$'}
  answer: {choiceId: d}
  explanation: Radius is $\sqrt{6^2+8^2}=10$, so area is $100\pi$.
- id: hard-quiz-q082
  type: multipleChoice
  prompt: Two concentric circles have radii differing by $4$. What is the difference of their circumferences?
  choices:
  - {id: a, text: '$4\pi$'}
  - {id: b, text: '$8\pi$'}
  - {id: c, text: '$16\pi$'}
  - {id: d, text: It depends on the individual radii.}
  answer: {choiceId: b}
  explanation: $2\pi R-2\pi r=2\pi(R-r)=8\pi$.
- id: hard-quiz-q063
  type: multipleChoice
  prompt: An annulus has inner radius $2$ and area $45\pi$. Find its outer radius.
  choices:
  - {id: a, text: '$5$'}
  - {id: b, text: '$7$'}
  - {id: c, text: '$9$'}
  - {id: d, text: '$47$'}
  answer: {choiceId: b}
  explanation: $\pi(R^2-2^2)=45\pi$ gives $R^2=49$, so $R=7$.
- id: hard-quiz-q053
  type: multipleChoice
  prompt: A chord in a radius-10 circle is $6$ units from the center. What is its length?
  choices:
  - {id: a, text: '$8$'}
  - {id: b, text: '$12$'}
  - {id: c, text: '$16$'}
  - {id: d, text: '$20$'}
  answer: {choiceId: c}
  explanation: Half the chord is $\sqrt{10^2-6^2}=8$, so the full chord is $16$.
- id: hard-quiz-q073
  type: selectAll
  prompt: Which statements about chords in one circle are true?
  media:
  - {type: image, src: /assessments/aops/aops-circles-chord.svg, alt: Center perpendicular to a chord at its midpoint.}
  choices:
  - {id: a, text: A perpendicular from the center to a chord bisects it.}
  - {id: b, text: Equal chords are equidistant from the center.}
  - {id: c, text: Every chord passes through the center.}
  - {id: d, text: The chord closest to the center is longer than a chord farther away.}
  answer:
    choiceIds: [a, b, d]
  explanation: Only diameters pass through the center; chord length decreases as center distance increases.
- id: hard-quiz-q093
  type: selectAll
  prompt: Which transformations follow from a dilation of a circle by factor $k>0$?
  choices:
  - {id: a, text: Radius is multiplied by $k$.}
  - {id: b, text: Circumference is multiplied by $k$.}
  - {id: c, text: Area is multiplied by $k^2$.}
  - {id: d, text: Every central angle is multiplied by $k$.}
  answer:
    choiceIds: [a, b, c]
  explanation: Dilation changes lengths and areas but preserves angle measures.
- id: hard-quiz-q083
  type: freeResponse
  prompt: Prove that two tangent segments drawn from the same external point to a circle have equal lengths.
  media:
  - {type: image, src: /assessments/aops/aops-circles-tangent.svg, alt: Radius to a tangent point forming a right triangle with an external point.}
  answer:
    gradingMode: selfCheck
    expected: |-
      Let tangents from $P$ touch at $A,B$ and let $O$ be the center. Then $OA\perp PA$ and $OB\perp PB$. Right triangles $\triangle OAP$ and $\triangle OBP$ share hypotenuse $OP$, and radii $OA=OB$. They are congruent by hypotenuse-leg, so corresponding legs $PA=PB$.
    keyPoints:
    - Draws radii to both tangent points.
    - Uses the tangent-radius right angles.
    - Uses common hypotenuse and equal radii.
    - Concludes tangent lengths are equal by congruence.
  explanation: Equal tangent lengths are a consequence of right-triangle congruence.
