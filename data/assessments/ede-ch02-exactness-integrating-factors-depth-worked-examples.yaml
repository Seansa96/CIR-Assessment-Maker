workedExamples:
- id: we01
  title: Reconstruct from the $dy$ component
  problem: Solve $(2x+y)dx+(x+2y)dy=0$ by integrating $N$ first.
  steps:
  - id: we01-s1
    title: Test exactness
    instruction: Compute cross partials.
    type: freeResponse
    prompt: Verify the form is exact.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Computes cross partials
      - States region
    explanation: |-
      Solution: $M_y=1=N_x$ on all of $\mathbb R^2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s2
    title: Integrate $N$ first
    instruction: Recover the missing function of $x$.
    type: freeResponse
    prompt: Construct $F$.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Integrates N
      - Finds h
    explanation: |-
      Solution: $F=xy+y^2+h(x)$; matching $F_x=y+h'(x)=2x+y$ gives $h=x^2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we01-s3
    title: State and verify
    instruction: Use a level set and both partials.
    type: freeResponse
    prompt: Give the implicit solution.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Level set
      - Verifies components
    explanation: |-
      Solution: $x^2+xy+y^2=C$; its partial derivatives reproduce $M$ and $N$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we02
  title: A one-variable integrating factor
  problem: Solve $2y dx+x dy=0$ on $x>0$.
  steps:
  - id: we02-s1
    title: Diagnose nonexactness
    instruction: Calculate the ratio for an $x$ factor.
    type: freeResponse
    prompt: Find the supported ratio.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Cross partials
      - Ratio depends on x
    explanation: |-
      Solution: $M_y=2$, $N_x=1$, and $(M_y-N_x)/N=1/x$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s2
    title: Multiply and solve
    instruction: Use $\mu=x$ and construct the potential.
    type: freeResponse
    prompt: Make the form exact.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Finds factor
      - Recognizes differential
    explanation: |-
      Solution: Multiplication gives $2xy dx+x^2dy=d(x^2y)$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we02-s3
    title: Verify equivalence
    instruction: State the solution and domain.
    type: freeResponse
    prompt: Give the implicit family.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Solution family
      - Domain check
    explanation: |-
      Solution: $x^2y=C$ on $x>0$; the factor is nonzero there, so the transformed and original forms are equivalent.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
- id: we03
  title: A product factor and a lost curve
  problem: Analyze $y^2dx+x^2dy=0$ using $\mu=1/(x^2y^2)$.
  steps:
  - id: we03-s1
    title: Apply the product factor
    instruction: Restrict to nonzero $x,y$.
    type: freeResponse
    prompt: Write the exact transformed form.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Multiplies components
      - States restrictions
    explanation: |-
      Solution: The result is $dx/x^2+dy/y^2=0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s2
    title: Integrate the exact form
    instruction: Find its potential.
    type: freeResponse
    prompt: Give the implicit nonzero family.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Integrates
      - Forms level set
    explanation: |-
      Solution: $-1/x-1/y=C$ because the derivatives are $1/x^2$ and $1/y^2$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
  - id: we03-s3
    title: Audit excluded curves
    instruction: Return to the original equation.
    type: freeResponse
    prompt: Check whether $y=0$ was lost.
    choices: []
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Checks original
      - Identifies lost solution
    explanation: |-
      Solution: For $y(x)\equiv0$, $y^2+x^2y'=0$, so it is an original solution omitted because the factor is undefined at $y=0$.

      Why it works: The calculation preserves the original equation, data, and domain conditions.
    media: []
