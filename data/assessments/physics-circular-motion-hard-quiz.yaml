questions:
- id: circ-hard-1
  title: Non-uniform Circular Motion
  type: symbolicResponse
  prompt: 'Adapted from OpenStax University Physics.


    A particle moves in a circle of radius $R$. Its speed is given by $v(t) = 1t^2$.
    Find the magnitude of the total acceleration at time $t$.'
  answer:
    gradingMode: auto
    expected: \sqrt{(2*1*t)^2 + ((1*t^2)^2/R)^2}
  explanation: $a_t = 2t$. $a_c = v^2/R = (1t^2)^2/R$. Total acceleration $a = \sqrt{a_t^2
    + a_c^2}$.
