items:
  - id: drill-heap-left-child
    prompt: |
      Heaps are almost always implemented as standard Arrays (using a 0-indexed system), rather than node objects. 
      
      If a parent node is located at index $i=3$ in the array, at what index will its **left child** be located?
    answer: "7"
  
  - id: drill-heap-right-child
    prompt: |
      If a parent node is located at index $i=3$ in the 0-indexed array, at what index will its **right child** be located?
    answer: "8"
    
  - id: drill-heap-parent
    prompt: |
      If a child node is located at index $i=12$ in the 0-indexed array, at what index is its **parent** located?
    answer: "5"
