workedExamples:
- id: aops-angle-chasing-worked-example-problem-1
  title: Parallel-line transfer
  problem: Parallel lines $l$ and $m$ are cut by transversal $t$. A marked alternate interior angle is $62^\circ$. Find $x$.
  steps:
  - id: aops-angle-chasing-worked-example-p1-s1
    title: Read the markings
    instruction: Arrow marks, not appearance, establish $l\parallel m$.
    type: multipleChoice
    prompt: What hypothesis is available?
    choices:
    - id: a
      text: $l\parallel m$
    - id: b
      text: $l\perp m$
    - id: c
      text: $t\parallel l$
    - id: d
      text: No line relation
    answer:
      choiceId: a
    explanation: Matching arrow marks denote parallel lines.
    media:
    - type: image
      src: /assessments/aops/aops-angle-lines.svg
      alt: Parallel lines l and m with alternate interior angles 62 degrees and x.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-angle-chasing-worked-example-p1-s2
    title: Classify the pair
    instruction: The two marked angles lie between the parallels on opposite sides of the transversal.
    type: multipleChoice
    prompt: What kind of pair is this?
    choices:
    - id: a
      text: alternate interior
    - id: b
      text: same-side interior
    - id: c
      text: vertical
    - id: d
      text: linear pair
    answer:
      choiceId: a
    explanation: Their locations define alternate interior angles.
  - id: aops-angle-chasing-worked-example-p1-s3
    title: Apply the theorem
    instruction: Alternate interior angles between parallel lines are equal.
    type: multipleChoice
    prompt: Which equation follows?
    choices:
    - id: a
      text: $x=62^\circ$
    - id: b
      text: $x+62=90$
    - id: c
      text: $x+62=360$
    - id: d
      text: $x=2(62)$
    answer:
      choiceId: a
    explanation: The theorem gives equality.
  - id: aops-angle-chasing-worked-example-p1-s4
    title: Check range
    instruction: Both marked angles are acute.
    type: multipleChoice
    prompt: Which value is consistent?
    choices:
    - id: a
      text: $62^\circ$
    - id: b
      text: $118^\circ$
    - id: c
      text: $242^\circ$
    - id: d
      text: $298^\circ$
    answer:
      choiceId: a
    explanation: The transferred angle is acute.
  - id: aops-angle-chasing-worked-example-p1-s5
    title: Conclude
    instruction: State the target with units.
    type: multipleChoice
    prompt: What is $x$?
    choices:
    - id: a
      text: $62^\circ$
    - id: b
      text: 62 units
    - id: c
      text: $118^\circ$
    - id: d
      text: undetermined
    answer:
      choiceId: a
    explanation: The parallel hypothesis determines $x$.
- id: aops-angle-chasing-worked-example-problem-2
  title: Exterior-angle chain
  problem: "In triangle $ABC$, $\angle A=48^\\circ$ and $\angle B=67^\\circ$. Side $AC$ is extended through $C$, forming exterior angle $x$. Find $x$."
  steps:
  - id: aops-angle-chasing-worked-example-p2-s1
    title: Locate remote angles
    instruction: The remote interior angles are the two triangle angles not adjacent to $x$.
    type: multipleChoice
    prompt: Which are remote?
    choices:
    - id: a
      text: "$\angle A$ and $\angle B$"
    - id: b
      text: "$\angle B$ and $\angle C$"
    - id: c
      text: "$x$ and $\angle C$"
    - id: d
      text: "Only $\angle C$"
    answer:
      choiceId: a
    explanation: Angles A and B do not share the exterior vertex.
    media:
    - type: image
      src: /assessments/aops/aops-angle-triangle.svg
      alt: Triangle with remote interior angles 48 and 67 degrees and exterior target x.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-angle-chasing-worked-example-p2-s2
    title: Choose a theorem
    instruction: The exterior angle equals the sum of its remote interiors.
    type: multipleChoice
    prompt: Which equation applies?
    choices:
    - id: a
      text: $x=48+67$
    - id: b
      text: $x=180-48-67$
    - id: c
      text: $x=48-67$
    - id: d
      text: $x=360-48-67$
    answer:
      choiceId: a
    explanation: Use the exterior-angle theorem.
  - id: aops-angle-chasing-worked-example-p2-s3
    title: Calculate
    instruction: Add the two remote angles.
    type: multipleChoice
    prompt: What is $x$?
    choices:
    - id: a
      text: $115^\circ$
    - id: b
      text: $65^\circ$
    - id: c
      text: $19^\circ$
    - id: d
      text: $245^\circ$
    answer:
      choiceId: a
    explanation: $48+67=115$.
  - id: aops-angle-chasing-worked-example-p2-s4
    title: Independent check
    instruction: First find interior angle C, then use its linear pair.
    type: multipleChoice
    prompt: "What is $\angle C$?"
    choices:
    - id: a
      text: $65^\circ$
    - id: b
      text: $115^\circ$
    - id: c
      text: $67^\circ$
    - id: d
      text: $48^\circ$
    answer:
      choiceId: a
    explanation: $180-48-67=65$.
  - id: aops-angle-chasing-worked-example-p2-s5
    title: Verify
    instruction: Interior C and exterior x must be supplementary.
    type: multipleChoice
    prompt: Which check holds?
    choices:
    - id: a
      text: $65+115=180$
    - id: b
      text: $65=115$
    - id: c
      text: $115-65=180$
    - id: d
      text: $2(65)=115$
    answer:
      choiceId: a
    explanation: The linear pair verifies the chase.
- id: aops-angle-chasing-worked-example-problem-3
  title: Isosceles bisector synthesis
  problem: "In isosceles triangle $ABC$, $AB=AC$ and $\angle A=40^\\circ$. Segment $AD$ bisects $\angle A$. Find $\angle ADB$."
  steps:
  - id: aops-angle-chasing-worked-example-p3-s1
    title: Use equal sides
    instruction: Equal sides $AB$ and $AC$ make the base angles at B and C equal.
    type: multipleChoice
    prompt: What is each base angle?
    choices:
    - id: a
      text: $70^\circ$
    - id: b
      text: $40^\circ$
    - id: c
      text: $20^\circ$
    - id: d
      text: $140^\circ$
    answer:
      choiceId: a
    explanation: The remaining $140^\circ$ splits equally.
    media:
    - type: image
      src: /assessments/aops/aops-angle-isosceles.svg
      alt: Isosceles triangle with equal sides, 40 degree vertex angle, and angle bisector AD.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-angle-chasing-worked-example-p3-s2
    title: Use the bisector
    instruction: $AD$ divides the $40^\circ$ vertex angle equally.
    type: multipleChoice
    prompt: "What is $\angle BAD$?"
    choices:
    - id: a
      text: $20^\circ$
    - id: b
      text: $40^\circ$
    - id: c
      text: $70^\circ$
    - id: d
      text: $80^\circ$
    answer:
      choiceId: a
    explanation: An angle bisector makes two equal 20 degree angles.
  - id: aops-angle-chasing-worked-example-p3-s3
    title: Focus on a subtriangle
    instruction: Triangle $ABD$ has angles 20 degrees at A and 70 degrees at B.
    type: multipleChoice
    prompt: "Which sum finds $\angle ADB$?"
    choices:
    - id: a
      text: $180-20-70$
    - id: b
      text: $20+70$
    - id: c
      text: $180-40-70$
    - id: d
      text: $360-20-70$
    answer:
      choiceId: a
    explanation: Use the triangle sum in ABD.
  - id: aops-angle-chasing-worked-example-p3-s4
    title: Calculate
    instruction: Evaluate the remaining angle.
    type: multipleChoice
    prompt: "What is $\angle ADB$?"
    choices:
    - id: a
      text: $90^\circ$
    - id: b
      text: $70^\circ$
    - id: c
      text: $110^\circ$
    - id: d
      text: $270^\circ$
    answer:
      choiceId: a
    explanation: $180-90=90$.
  - id: aops-angle-chasing-worked-example-p3-s5
    title: Interpret
    instruction: A right angle at D proves a further relation.
    type: multipleChoice
    prompt: What follows?
    choices:
    - id: a
      text: $AD\perp BC$
    - id: b
      text: $AD\parallel BC$
    - id: c
      text: $AB\perp AC$
    - id: d
      text: $D$ is the circle center
    answer:
      choiceId: a
    explanation: A 90 degree intersection means perpendicular lines.
