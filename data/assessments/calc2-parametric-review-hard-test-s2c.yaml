authoring: { visualRequirement: required, visualRationale: 'Each task relies on constructing or checking a trace, tangent, or differential path model.', difficultyTier: hard }
questions:
  - { id: q001, type: freeResponse, prompt: 'For $x=t^2-1$, $y=t(t^2-1)$, find every point with a horizontal tangent.', answer: { gradingMode: selfCheck, keyPoints: ['t equals plus or minus one over square root three', 'x equals negative two thirds', 'y equals plus or minus two over three square root three with opposite sign'] }, explanation: 'Solution: $dx/dt=2t$ and $dy/dt=3t^2-1$. Horizontal requires $3t^2-1=0$ with $t\ne0$, so $t=\pm1/\sqrt3$. The points are $(-2/3,\mp2/(3\sqrt3))$. Why it works: A horizontal tangent has zero vertical rate and nonzero horizontal rate. Common trap: Reporting parameter values when the prompt asks for points.' , difficultyDimensions: [auxiliaryTechnique, domainCondition, representationTransfer], difficultyEvidence: 'Solves a derivative condition, checks exclusion, and maps parameters to points.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q002, type: freeResponse, prompt: 'A student says $x=t^2,y=t^3$ is the whole curve $y^2=x^3$. Correct the statement and explain how the parameter interval changes the trace.', answer: { gradingMode: selfCheck, keyPoints: ['Cartesian relation y squared equals x cubed', 'x is nonnegative', 'all real t traces both branches', 'restricted t gives one branch'] }, explanation: 'Solution: Eliminating $t$ gives $y^2=x^3$ with $x\ge0$. All real $t$ traces both branches; $t\ge0$ traces the upper branch and $t\le0$ the lower branch. Why it works: Parameter restrictions choose a directed subset of a Cartesian locus. Common trap: Treating an eliminated equation as complete without its domain.' , difficultyDimensions: [representationTransfer, domainCondition, errorDiagnosis], difficultyEvidence: 'Reconciles locus, domain, and orientation while repairing a common claim.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q003, type: symbolicResponse, prompt: 'Find the exact arc length of $x=t^2/2$, $y=t^3/3$ from $t=0$ to $t=1$.', answer: { expectedLatex: '(2sqrt(2)-1)/3', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Speed is $\sqrt{t^2+t^4}=t\sqrt{1+t^2}$ on $[0,1]$. Thus $L=\int_0^1t\sqrt{1+t^2}dt=[(1+t^2)^{3/2}/3]_0^1=(2\sqrt2-1)/3$. Why it works: The interval lets $\sqrt{t^2}=t$, then a substitution finishes the integral. Common trap: Dropping the absolute value without checking $t\ge0$.' , difficultyDimensions: [simplification, domainCondition, auxiliaryTechnique], difficultyEvidence: 'Simplifies an absolute value, selects a substitution, and evaluates exact endpoints.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q004, type: freeResponse, prompt: '![Parametric loop trace](/media/calculus/parametric-review-trace.svg) Explain how you would determine whether a closed parameter interval traces a loop once or twice before applying $A=-\int y\,dx$.', answer: { gradingMode: selfCheck, keyPoints: ['check repeated position values', 'inspect orientation or period', 'use minimal tracing interval', 'double traversal doubles signed integral'] }, explanation: 'Solution: Identify the smallest interval that returns to the start with the same direction, and sample intermediate points or use period information. Use that interval once; a double traversal doubles the integral even though it encloses the same region. Why it works: The line integral counts directed traversal, not just the set of points. Common trap: Using a full trig period when the curve has a shorter period.' , difficultyDimensions: [globalLocalReasoning, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Distinguishes geometric region from traversal multiplicity and audits a line-integral setup.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q005, type: symbolicResponse, prompt: 'For $x=2\cos t$, $y=\sin t$, find the total area enclosed, using a parameter interval that traces the ellipse once.', answer: { expectedLatex: '2pi', equivalenceMode: expression, variables: [], tolerance: 0.000001 }, explanation: 'Solution: Use $0\le t\le2\pi$. $A=-\int ydx=-\int_0^{2\pi}\sin t(-2\sin t)dt=2\pi$. Why it works: The interval makes one counterclockwise traversal and the area formula converts the moving boundary to accumulation. Common trap: Forgetting the negative sign in $dx=-2\sin tdt$.' , difficultyDimensions: [representationTransfer, identityConstruction, modelOrDerivation], difficultyEvidence: 'Selects a single traversal, builds a line integral, and evaluates a trig-square integral.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q006, type: freeResponse, prompt: 'For $x=t^3$, $y=t^2$, diagnose why the usual vertical-tangent test at $t=0$ is inconclusive and determine the tangent behavior from $y^3=x^2$.', answer: { gradingMode: selfCheck, keyPoints: ['both derivatives zero', 'dy dx equals two over three t inverse', 'slope unbounded with opposite signs', 'cusp with vertical tangent direction'] }, explanation: 'Solution: Both coordinate rates vanish at 0, giving $0/0$. For $t\ne0$, $dy/dx=2/(3t)$, whose magnitude tends to infinity; the Cartesian relation has a cusp at the origin with vertical tangent direction. Why it works: Nearby slopes, not the indeterminate quotient itself, reveal local geometry. Common trap: Calling $0/0$ a slope of zero.' , difficultyDimensions: [domainCondition, reverseReasoning, representationTransfer], difficultyEvidence: 'Uses a nearby-rate limit and Cartesian form to resolve an indeterminate derivative.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q007, type: freeResponse, prompt: 'Set up, but do not evaluate, the area swept under $x=t-\sin t$, $y=1-\cos t$ for one arch. Explain the bounds.', answer: { gradingMode: selfCheck, keyPoints: ['zero to two pi', 'integral one minus cos t times one minus cos t dt', 'one arch begins and ends on x axis'] }, explanation: 'Solution: $A=\int_0^{2\pi}(1-\cos t)(1-\cos t)dt$. The endpoints have $y=0$ and the next matching cusp is after $2\pi$, so this is one arch. Why it works: Area under a parametric curve is $\int y(dx/dt)dt$ over a monotone left-to-right arch. Common trap: Using $0$ to $\pi$, which stops at the top rather than the next intercept.' , difficultyDimensions: [modelOrDerivation, domainCondition, representationTransfer], difficultyEvidence: 'Builds a parametric area element and derives a geometric tracing interval.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q008, type: freeResponse, prompt: 'For $x=t+1/t$, $y=t-1/t$, $t>0$, classify the tangent at $t=1$ and explain why the parameter restriction matters.', answer: { gradingMode: selfCheck, keyPoints: ['vertical tangent', 'x prime equals zero', 'y prime equals two', 'positive t selects one hyperbola branch'] }, explanation: 'Solution: $dx/dt=1-1/t^2$ and $dy/dt=1+1/t^2$. At $1$, $x''=0$ and $y''=2$, so the tangent is vertical. The restriction $t>0$ selects one branch of the hyperbola. Why it works: A zero horizontal rate with nonzero vertical rate is vertical. Common trap: Dividing in the wrong order.' , difficultyDimensions: [errorDiagnosis, domainCondition, representationTransfer], difficultyEvidence: 'Tests a derivative quotient, interprets the branch restriction, and corrects a plausible reversal.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q009, type: freeResponse, prompt: 'Compare two ways to model the length of $x=\cos^3t$,y=\sin^3t$ on $0\le t\le\pi/2$: parameter speed versus solving for one variable. State which is more direct and why.', answer: { gradingMode: selfCheck, keyPoints: ['differentiate parametrically', 'speed simplifies to three sine cosine', 'Cartesian form introduces fractional powers', 'parametric is more direct'] }, explanation: 'Solution: Parametric differentiation gives speed $3\sin t\cos t$, directly integrable on the first quadrant. Eliminating the parameter produces fractional powers and an awkward derivative. Why it works: The representation that makes the differential element simplest is preferred. Common trap: Choosing Cartesian form merely because a graph can be written implicitly.' , difficultyDimensions: [representationTransfer, reverseReasoning, auxiliaryTechnique], difficultyEvidence: 'Compares alternative representations and judges their derivative complexity.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q010, type: freeResponse, prompt: 'A motion model has $x=t^2-4t$,y=t^3-6t^2$ for $0\le t\le4$. Give a procedure for finding every horizontal and vertical tangent without losing simultaneous-zero cases.', answer: { gradingMode: selfCheck, keyPoints: ['differentiate both', 'solve y prime zero and x prime nonzero', 'solve x prime zero and y prime nonzero', 'separately analyze simultaneous zeros'] }, explanation: 'Solution: Compute both rates, apply the numerator/denominator conditions separately, then list common roots for local analysis rather than discarding them. Why it works: The slope quotient classifies only nonzero-over-zero and zero-over-nonzero directly. Common trap: Cancelling a factor before recording where both rates were zero.' , difficultyDimensions: [casePartition, domainCondition, proofJustification], difficultyEvidence: 'Partitions derivative roots into horizontal, vertical, and indeterminate classes.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q011, type: freeResponse, prompt: 'Explain why $\int_a^b y(t)x''(t)dt$ can be negative even when a closed curve encloses positive area, and give the repair.', answer: { gradingMode: selfCheck, keyPoints: ['orientation changes sign', 'clockwise versus counterclockwise', 'use negative integral or reverse bounds'] }, explanation: 'Solution: Clockwise traversal makes $\int ydx$ negative. Use $A=-\int ydx$ for counterclockwise convention, reverse the limits, or take the signed orientation into account. Why it works: Boundary integrals encode direction. Common trap: Taking an absolute value before checking whether the curve has been traced more than once.' , difficultyDimensions: [representationTransfer, errorDiagnosis, globalLocalReasoning], difficultyEvidence: 'Links orientation to signed accumulation and distinguishes sign correction from retracing.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q012, type: freeResponse, prompt: 'For a parameterized line segment, explain why $\sqrt{(x'')^2+(y'')^2}$ is speed rather than slope and how units confirm this.', answer: { gradingMode: selfCheck, keyPoints: ['coordinate rates length per parameter', 'square root length per parameter', 'integrating dt gives length', 'slope is dimensionless ratio'] }, explanation: 'Solution: Each coordinate derivative has length per parameter; their Euclidean magnitude has the same units, and multiplying by $dt$ yields length. A slope is the ratio $dy/dx$, so its units cancel. Why it works: Arc length accumulates distance, not vertical change per horizontal change. Common trap: Using $dy/dx$ as an arc-length integrand.' , difficultyDimensions: [modelOrDerivation, representationTransfer, proofJustification], difficultyEvidence: 'Uses dimensional reasoning to distinguish two related rate quantities.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q013, type: freeResponse, prompt: 'A curve is parameterized twice: $x=\cos t,y=\sin t$ and $x=\cos 2u,y=\sin2u$. State parameter intervals that each trace once and explain the change.', answer: { gradingMode: selfCheck, keyPoints: ['t zero to two pi', 'u zero to pi', 'double angular rate'] }, explanation: 'Solution: Use $0\le t\le2\pi$ for the first and $0\le u\le\pi$ for the second. The second parameter advances the angle twice as fast. Why it works: A trace closes when its angular argument advances $2\pi$. Common trap: Using $0$ to $2\pi$ for both and doubling area or length.' , difficultyDimensions: [parameterThreshold, representationTransfer, globalLocalReasoning], difficultyEvidence: 'Relates a transformed parameter rate to a minimal closed tracing interval.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q014, type: freeResponse, prompt: 'Give a model-selection justification for using parametric form rather than Cartesian form for a cycloid arch.', answer: { gradingMode: selfCheck, keyPoints: ['cycloid naturally generated by rolling motion', 'x prime y prime manageable', 'Cartesian elimination difficult', 'bounds given by one period'] }, explanation: 'Solution: The rolling-motion parameter supplies coordinates, derivatives, and one-arch bounds directly; eliminating it creates an impractical relation. Why it works: A model is good when it makes the needed geometry and differential element accessible. Common trap: Assuming Cartesian form is always more fundamental.' , difficultyDimensions: [modelOrDerivation, representationTransfer, reverseReasoning], difficultyEvidence: 'Selects a representation by comparing how well it exposes geometry, bounds, and derivatives.', prerequisiteObjectiveIds: [parametric-curves], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q015, type: freeResponse, prompt: 'For $x=t^2,y=t^4$, explain why the Cartesian curve is smooth at the origin even though the parameter speed is zero there.', answer: { gradingMode: selfCheck, keyPoints: ['y equals x squared', 'smooth parabola for x nonnegative trace', 'speed zero is not automatically cusp', 'nearby slope tends zero'] }, explanation: 'Solution: Eliminating gives $y=x^2$ with $x\ge0$, a smooth right-hand parabola. Although both coordinate rates vanish at 0, nearby slope is $2t$, tending to 0. Why it works: A stopped parameterization can describe a smooth geometric curve. Common trap: Equating zero speed with a cusp.' , difficultyDimensions: [reverseReasoning, domainCondition, representationTransfer], difficultyEvidence: 'Uses Cartesian geometry and a limiting slope to classify a simultaneous-zero point.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q016, type: freeResponse, prompt: 'Explain how a negative $dx/dt$ affects an area-under-a-parametric-curve integral and what must be checked before interpreting it as geometric area.', answer: { gradingMode: selfCheck, keyPoints: ['x decreases', 'signed dx is negative', 'check orientation and retracing', 'partition or reverse if necessary'] }, explanation: 'Solution: When $x''<0$, the integral $\int yx''dt$ accumulates with decreasing x and may be negative. Check trace direction, whether the curve retraces, and sign changes before converting signed accumulation to geometric area. Why it works: $dx$ carries orientation. Common trap: Treating all parameter intervals as left-to-right.' , difficultyDimensions: [domainCondition, casePartition, modelOrDerivation], difficultyEvidence: 'Analyzes a sign-changing differential and identifies the required geometric checks.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q017, type: freeResponse, prompt: 'A parameterized curve crosses itself. Describe how you would select the bounds for one enclosed loop before computing area.', answer: { gradingMode: selfCheck, keyPoints: ['solve repeated position', 'identify consecutive parameter values for same crossing', 'sample trace', 'avoid intervals enclosing multiple loops'] }, explanation: 'Solution: Solve for parameter pairs giving the same point, inspect the trace between consecutive crossing values, and choose the interval that encloses exactly the intended loop. Why it works: Self-intersections make algebraic periods larger than a single geometric region. Common trap: Choosing a full period without checking loop multiplicity.' , difficultyDimensions: [casePartition, modelOrDerivation, globalLocalReasoning], difficultyEvidence: 'Finds repeated positions and converts local trace information into a single-loop interval.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q018, type: freeResponse, prompt: 'For a parametric curve, explain the distinction between a vertical tangent and a point where the curve merely reverses horizontal direction.', answer: { gradingMode: selfCheck, keyPoints: ['vertical tangent dx prime zero dy prime nonzero', 'horizontal reversal may have y prime zero', 'check signs nearby', 'point path geometry'] }, explanation: 'Solution: A vertical tangent has $x''=0,y''\ne0$; a horizontal reversal concerns a change in sign of horizontal motion and may occur with a horizontal tangent or a stop. Inspect both rates and their nearby signs. Why it works: Tangent direction and motion reversal are different geometric questions. Common trap: Calling any zero $x''$ a turn without checking $y''$.' , difficultyDimensions: [casePartition, domainCondition, representationTransfer], difficultyEvidence: 'Separates derivative classification from local directional behavior.', prerequisiteObjectiveIds: [parametric-derivatives], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q019, type: freeResponse, prompt: 'Explain why a numerical graph is insufficient by itself to certify an exact arc length, and give the analytic verification path.', answer: { gradingMode: selfCheck, keyPoints: ['graph estimates only', 'differentiate coordinates', 'form speed', 'integrate exact or bound approximation'] }, explanation: 'Solution: A graph can suggest shape but not exact accumulated distance. Differentiate both coordinates, form $\sqrt{(x'')^2+(y'')^2}$, justify simplifications and bounds, then integrate or bound the result. Why it works: Length is a limiting sum encoded by the speed integral. Common trap: Measuring a screen chord or trusting plot resolution.' , difficultyDimensions: [estimationOrBounds, modelOrDerivation, proofJustification], difficultyEvidence: 'Distinguishes visual estimation from the exact differential-length derivation.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
  - { id: q020, type: freeResponse, prompt: 'Write a checklist for validating a parametric tangent/area/length solution before accepting its final algebra.', answer: { gradingMode: selfCheck, keyPoints: ['trace and parameter bounds', 'derivative/domain checks', 'correct differential model', 'orientation or units', 'exact endpoint evaluation'] }, explanation: 'Solution: Check the traced segment and bounds; compute both coordinate rates; select the correct tangent, area, or speed model; verify orientation/domain/units; then evaluate endpoints. Why it works: These checks validate the model before symbolic manipulation can conceal an error. Common trap: Treating a correct antiderivative as proof that the setup was correct.' , difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Performs a global validation across representation, differential model, and result.', prerequisiteObjectiveIds: [parametric-integrals], extensionObjectiveIds: [parametric-review-mastery] }
