questions:
- id: mom-easy-1
  title: Inelastic Collision
  type: numericResponse
  prompt: 'Adapted from OpenStax University Physics.


    A $2$ kg mass at $2$ m/s collides and sticks to a stationary $3$ kg mass. What
    is their final speed?'
  answer:
    gradingMode: auto
    tolerance: 0.1
    value: 0.8
  explanation: $m_1v_1 = (m_1+m_2)v_f \implies v_f = \frac{2 \times 2}{2+3}$.
