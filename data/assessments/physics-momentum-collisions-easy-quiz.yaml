questions:
  - id: mom-easy-q01
    title: Momentum Calculation
    type: numericResponse
    prompt: |
      What is the magnitude of the momentum (in kg·m/s) of a $1200\text{ kg}$ car traveling at $20\text{ m/s}$?
    answer:
      value: 24000.0
      tolerance: 100.0
    explanation: |
      Momentum is mass times velocity: $p = mv$.
      $p = (1200\text{ kg})(20\text{ m/s}) = 24000\text{ kg}\cdot\text{m/s}$.

  - id: mom-easy-q02
    title: Impulse Calculation
    type: numericResponse
    prompt: |
      A baseball player swings a bat and hits a ball. The bat exerts an average force of $5000\text{ N}$ on the ball for $0.002\text{ seconds}$. What is the magnitude of the impulse (in N·s) delivered to the ball?
    answer:
      value: 10.0
      tolerance: 0.1
    explanation: |
      Impulse is force multiplied by the time interval: $J = F \Delta t$.
      $J = 5000 \times 0.002 = 10\text{ N}\cdot\text{s}$.

  - id: mom-easy-q03
    title: Impulse-Momentum Theorem
    type: numericResponse
    prompt: |
      A $2.0\text{ kg}$ object is initially at rest. A net force of $15\text{ N}$ acts on it for $4.0\text{ seconds}$. What is the object's final speed in m/s?
    answer:
      value: 30.0
      tolerance: 0.1
    explanation: |
      Impulse equals change in momentum: $F \Delta t = \Delta p = m(v_f - v_i)$.
      $15(4.0) = 2.0(v_f - 0) \implies 60 = 2.0 v_f \implies v_f = 30\text{ m/s}$.

  - id: mom-easy-q04
    title: Changing Direction (Bouncing)
    type: numericResponse
    prompt: |
      A $0.50\text{ kg}$ ball is thrown horizontally towards a wall at $10\text{ m/s}$. It bounces straight back at $8\text{ m/s}$. What is the magnitude of the change in momentum (impulse) of the ball in kg·m/s?
    answer:
      value: 9.0
      tolerance: 0.1
    explanation: |
      Momentum is a vector. Let the initial direction be positive.
      $p_i = (0.50)(10) = 5.0\text{ kg}\cdot\text{m/s}$.
      $p_f = (0.50)(-8) = -4.0\text{ kg}\cdot\text{m/s}$.
      $\Delta p = p_f - p_i = -4.0 - 5.0 = -9.0\text{ kg}\cdot\text{m/s}$.
      The magnitude is $9.0\text{ kg}\cdot\text{m/s}$. (A common mistake is $5.0 - 4.0 = 1.0$, which ignores the direction change).

  - id: mom-easy-q05
    title: Inelastic Collision (Sticking Together)
    type: numericResponse
    prompt: |
      A $1000\text{ kg}$ car moving east at $15\text{ m/s}$ collides with a $1500\text{ kg}$ truck that is parked and at rest. The two vehicles lock together. What is their combined speed in m/s immediately after the collision?
    answer:
      value: 6.0
      tolerance: 0.1
    explanation: |
      Conservation of momentum: $m_1 v_{1i} + m_2 v_{2i} = (m_1 + m_2) v_f$.
      $1000(15) + 1500(0) = (1000 + 1500) v_f \implies 15000 = 2500 v_f$.
      $v_f = \frac{15000}{2500} = 6.0\text{ m/s}$.

  - id: mom-easy-q06
    title: Elastic vs Inelastic Definitions
    type: multipleChoice
    prompt: |
      Which of the following statements correctly distinguishes an **elastic** collision from an **inelastic** collision?
    choices:
      - id: a
        text: Momentum is conserved in elastic collisions, but not in inelastic collisions.
      - id: b
        text: Kinetic energy is conserved in elastic collisions, but some is lost (converted to heat/sound/deformation) in inelastic collisions.
      - id: c
        text: Objects always stick together in elastic collisions.
      - id: d
        text: Inelastic collisions only happen between soft objects, while elastic collisions only happen between hard objects.
    answer:
      choiceId: b
    explanation: |
      Momentum is conserved in ALL isolated collisions (both elastic and inelastic). The defining feature of an elastic collision is that **kinetic energy is also conserved**. In inelastic collisions, kinetic energy is lost to internal energy (deformation, heat, sound).

  - id: mom-easy-q07
    title: Recoil of a Skater
    type: numericResponse
    prompt: |
      An $80\text{ kg}$ ice skater is initially at rest on frictionless ice. He throws a $5.0\text{ kg}$ medicine ball horizontally forward at $4.0\text{ m/s}$. What is the magnitude of the skater's recoil velocity (in m/s) backward? Round to two decimal places.
    answer:
      value: 0.25
      tolerance: 0.05
    explanation: |
      Initial momentum is zero. $0 = m_\text{skater} v_\text{skater} + m_\text{ball} v_\text{ball}$.
      $0 = 80(v_\text{skater}) + 5.0(4.0) \implies 80 v_\text{skater} = -20$.
      $v_\text{skater} = -20 / 80 = -0.25\text{ m/s}$.
      The magnitude is $0.25\text{ m/s}$.

  - id: mom-easy-q08
    title: Two objects moving towards each other
    type: numericResponse
    prompt: |
      A $2.0\text{ kg}$ cart moving right at $5.0\text{ m/s}$ collides with a $3.0\text{ kg}$ cart moving left at $4.0\text{ m/s}$. They stick together. What is the magnitude of their final velocity in m/s?
    answer:
      value: 0.4
      tolerance: 0.1
    explanation: |
      Let right be positive.
      $P_\text{initial} = m_1 v_1 + m_2 v_2 = 2.0(5.0) + 3.0(-4.0) = 10.0 - 12.0 = -2.0\text{ kg}\cdot\text{m/s}$.
      $P_\text{final} = (m_1 + m_2) v_f = (5.0) v_f$.
      Conservation: $-2.0 = 5.0 v_f \implies v_f = -2.0 / 5.0 = -0.4\text{ m/s}$.
      The magnitude is $0.4\text{ m/s}$ (moving to the left).

  - id: mom-easy-q09
    title: Force from water hose
    type: numericResponse
    prompt: |
      A fire hose sprays water at a wall. The water hits the wall at $20\text{ m/s}$ and drops down (final horizontal velocity is zero). If $50\text{ kg}$ of water hits the wall every second, what is the average force (in Newtons) exerted by the wall on the water?
    answer:
      value: 1000.0
      tolerance: 10.0
    explanation: |
      Force is the rate of change of momentum: $F = \frac{\Delta p}{\Delta t} = \frac{m(v_f - v_i)}{\Delta t}$.
      For a 1-second interval, $m = 50\text{ kg}$.
      $F = \frac{50(0 - 20)}{1} = -1000\text{ N}$.
      The magnitude of the force is $1000\text{ N}$. (The wall pushes back with $1000\text{ N}$).

  - id: mom-easy-q10
    title: Perfectly Elastic Collision (Identical Masses)
    type: numericResponse
    prompt: |
      A billiard ball moving at $3.0\text{ m/s}$ collides perfectly elastically head-on with an identical stationary billiard ball. After the collision, what is the speed of the initially moving ball in m/s?
    answer:
      value: 0.0
      tolerance: 0.1
    explanation: |
      In a perfectly elastic 1D head-on collision between two identical masses, they exactly exchange velocities. The moving ball stops completely ($0\text{ m/s}$), and the stationary ball moves off at $3.0\text{ m/s}$.

  - id: mom-easy-q11
    title: Loss of Kinetic Energy
    type: numericResponse
    prompt: |
      A $4.0\text{ kg}$ block moving at $6.0\text{ m/s}$ collides inelastically with a $2.0\text{ kg}$ block at rest. They stick together. How much kinetic energy (in Joules) is lost in this collision?
    answer:
      value: 24.0
      tolerance: 1.0
    explanation: |
      Initial momentum: $p = 4.0(6.0) = 24\text{ kg}\cdot\text{m/s}$.
      Final velocity: $v_f = \frac{24}{4.0 + 2.0} = 4.0\text{ m/s}$.
      Initial KE: $\frac{1}{2}(4.0)(6.0^2) = 2.0(36) = 72\text{ J}$.
      Final KE: $\frac{1}{2}(6.0)(4.0^2) = 3.0(16) = 48\text{ J}$.
      Energy lost: $72 - 48 = 24\text{ J}$.

  - id: mom-easy-q12
    title: Conservation of Momentum Principle
    type: multipleChoice
    prompt: |
      Under what condition is the total momentum of a system of particles strictly conserved?
    choices:
      - id: a
        text: When the collision is perfectly elastic.
      - id: b
        text: When the net external force acting on the system is zero.
      - id: c
        text: Only when the particles stick together.
      - id: d
        text: Total momentum is always conserved regardless of external forces.
    answer:
      choiceId: b
    explanation: |
      Conservation of momentum relies on Newton's Third Law internal force pairs canceling out. If there is a net *external* force (like gravity or external friction), the total momentum of the system will change ($F_\text{net,ext} = \frac{dp}{dt}$). It is conserved only when external forces are zero or negligible.

  - id: mom-easy-q13
    title: Finding Mass from Collision
    type: numericResponse
    prompt: |
      A $2000\text{ kg}$ train car moving at $4.0\text{ m/s}$ couples with a stationary train car. After they couple, they move together at $1.6\text{ m/s}$. What is the mass of the second (initially stationary) train car in kg?
    answer:
      value: 3000.0
      tolerance: 50.0
    explanation: |
      $m_1 v_{1i} = (m_1 + m_2) v_f$
      $2000(4.0) = (2000 + m_2)(1.6)$
      $8000 = 3200 + 1.6 m_2$
      $4800 = 1.6 m_2 \implies m_2 = \frac{4800}{1.6} = 3000\text{ kg}$.

  - id: mom-easy-q14
    title: Explosion into Two Pieces
    type: numericResponse
    prompt: |
      A $10\text{ kg}$ object at rest in deep space explodes into two pieces. One piece has a mass of $2.0\text{ kg}$ and flies off at $40\text{ m/s}$. What is the speed of the other piece in m/s?
    answer:
      value: 10.0
      tolerance: 0.1
    explanation: |
      Initial momentum is zero. The two pieces must have equal and opposite momenta.
      $0 = m_1 v_1 + m_2 v_2 \implies m_2 v_2 = -m_1 v_1$.
      The second piece has mass $10 - 2.0 = 8.0\text{ kg}$.
      $8.0 v_2 = -2.0(40) = -80 \implies v_2 = -10\text{ m/s}$.
      The speed (magnitude) is $10\text{ m/s}$.

  - id: mom-easy-q15
    title: Force and Time graph
    type: multipleChoice
    prompt: |
      The force acting on a particle is plotted on a graph as a function of time. What does the area under the Force vs. Time curve represent?
    choices:
      - id: a
        text: Work done
      - id: b
        text: Change in kinetic energy
      - id: c
        text: Impulse (change in momentum)
      - id: d
        text: Power
    answer:
      choiceId: c
    explanation: |
      Impulse $J = \int F dt$, which is the area under the Force vs Time graph. By the impulse-momentum theorem, this is also equal to the change in momentum ($\Delta p$).
