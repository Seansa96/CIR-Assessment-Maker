lesson:
  introduction: |
    Convergence-test problems are usually not hard because of arithmetic. They are hard because the first move is a choice.

    The goal of this lesson is to make that choice less mysterious. Instead of memorizing isolated tests, inspect the term structure and ask what kind of evidence the terms provide.
  sections:
    - id: decision-map
      title: Start with a Decision Map
      required: true
      content: |
        ![A convergence test decision map organized by term structure](/assessments/calc2-infinite-series/convergence-test-decision-map.svg)

        A useful first pass is:

        1. Does $a_n$ fail to approach $0$? Use the divergence test.
        2. Is it geometric, p-series, or telescoping? Use the direct pattern.
        3. Does it involve factorials, exponentials, or powers raised to $n$? Try ratio or root.
        4. Does it look like a known positive series? Try comparison or limit comparison.
        5. Does it alternate signs? Check absolute convergence first, then use the alternating series test if needed.

        This order is not a law, but it prevents wasted work.

        ![Convergence test selection flowchart from term scan to divergence, comparison, ratio, alternating, and integral tests](/assessments/calc2-infinite-series/convergence-test-selection-flow.svg)
      check:
        id: decision-map-check
        type: multipleChoice
        prompt: Why should the divergence test often be checked early?
        choices:
          - id: a
            text: If the terms do not approach $0$, the series diverges immediately.
          - id: b
            text: It proves every series converges.
          - id: c
            text: It gives the exact sum of every series.
          - id: d
            text: It only works for alternating series.
        answer:
          choiceId: a
        explanation: |
          If $\lim_{n\to\infty}a_n\ne0$ or does not exist, then $\sum a_n$ diverges. This is a fast rejection test, not a convergence proof.

          Related topic: nth-term divergence test.

    - id: divergence-test-first
      title: The Divergence Test Is a Gatekeeper
      required: true
      content: |
        The nth-term divergence test says:

        $$
        \text{If }\lim_{n\to\infty}a_n\ne0\text{, then }\sum a_n\text{ diverges.}
        $$

        But the converse is false:

        $$
        \lim_{n\to\infty}a_n=0
        $$

        does not prove convergence.

        Think of this test as a gatekeeper. It can reject a series quickly, but it cannot admit a series as convergent.
      check:
        id: divergence-test-first-check
        type: multipleChoice
        prompt: If $\lim_{n\to\infty}a_n=0$, what can you conclude about $\sum a_n$ from the divergence test alone?
        choices:
          - id: a
            text: Nothing final; another test is needed.
          - id: b
            text: The series converges.
          - id: c
            text: The series diverges.
          - id: d
            text: The series must be geometric.
        answer:
          choiceId: a
        explanation: |
          Terms approaching zero is necessary for convergence, but not sufficient. The harmonic series is the classic warning.

    - id: known-families-first
      title: Recognize Known Families First
      required: true
      content: |
        Before reaching for a complicated test, look for a known family:

        - geometric: $\sum ar^n$
        - p-series: $\sum \frac{1}{n^p}$
        - telescoping: terms cancel after expansion

        These are foundational because they often become comparison targets for harder series.
      check:
        id: known-families-check
        type: selectAll
        prompt: Which series are known families that can often be handled directly?
        choices:
          - id: a
            text: '$\sum_{n=1}^{\infty}\frac{1}{n^3}$'
          - id: b
            text: '$\sum_{n=0}^{\infty}4\left(\frac13\right)^n$'
          - id: c
            text: '$\sum_{n=1}^{\infty}\left(\frac{1}{n}-\frac{1}{n+1}\right)$'
          - id: d
            text: '$\sum_{n=1}^{\infty}\frac{n!}{3^n}$'
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: |
          Choices A, B, and C are p-series, geometric, and telescoping respectively. The factorial expression suggests the ratio test.

          Related topic: structural recognition.

    - id: comparison-thinking
      title: Comparison Means Matching Dominant Behavior
      required: true
      content: |
        Comparison tests are about finding a simpler series with the same large-$n$ behavior.

        For rational expressions in $n$, the highest powers usually control the behavior:

        $$
        \frac{3n^2+1}{n^5+7}
        \sim
        \frac{3n^2}{n^5}
        =
        \frac{3}{n^3}.
        $$

        That suggests comparing to $\sum\frac{1}{n^3}$, a convergent p-series.

        Direct comparison needs an inequality. Limit comparison only needs a positive finite limiting ratio.
      check:
        id: comparison-thinking-check
        type: multipleChoice
        prompt: What is the best comparison family for $\sum_{n=1}^{\infty}\frac{5n+2}{n^4+1}$?
        choices:
          - id: a
            text: '$\sum \frac{1}{n^3}$'
          - id: b
            text: '$\sum n^3$'
          - id: c
            text: '$\sum \frac{1}{n}$'
          - id: d
            text: '$\sum \left(\frac12\right)^n$'
        answer:
          choiceId: a
        explanation: |
          The dominant behavior is $\frac{5n}{n^4}=\frac{5}{n^3}$. Compare with $\sum\frac{1}{n^3}$, which converges because $p=3>1$.

          Related topic: limit comparison using dominant powers.

    - id: integral-test-pattern
      title: Integral Test Handles Function-Like Terms
      required: true
      content: |
        The integral test is useful when $a_n=f(n)$ for a function that is:

        - continuous,
        - positive,
        - decreasing.

        Then:

        $$
        \sum a_n
        \quad\text{and}\quad
        \int f(x)\,dx
        $$

        either both converge or both diverge.

        Use it when the term resembles a function you can integrate, especially expressions involving logs, powers, or decreasing rational forms.
      check:
        id: integral-test-pattern-check
        type: multipleChoice
        prompt: Which condition is required before using the integral test in the standard way?
        choices:
          - id: a
            text: $f(x)$ is continuous, positive, and decreasing on the relevant interval.
          - id: b
            text: The series alternates signs.
          - id: c
            text: The term contains a factorial.
          - id: d
            text: The series has a finite number of terms.
        answer:
          choiceId: a
        explanation: |
          The integral test compares the series terms to areas under a positive decreasing curve.

    - id: ratio-root-thinking
      title: Ratio and Root Tests Detect Repeated Multiplication
      required: true
      content: |
        The ratio test is especially useful when terms contain factorials or exponentials:

        $$
        L=\lim_{n\to\infty}\left|\frac{a_{n+1}}{a_n}\right|.
        $$

        The root test is useful when the whole term is raised to the $n$th power:

        $$
        L=\lim_{n\to\infty}\sqrt[n]{|a_n|}.
        $$

        In both tests:

        - $L<1$ means absolute convergence,
        - $L>1$ means divergence,
        - $L=1$ means inconclusive.
      check:
        id: ratio-root-thinking-check
        type: multipleChoice
        prompt: Which series most naturally suggests the root test?
        choices:
          - id: a
            text: '$\sum_{n=1}^{\infty}\left(\frac{2n+1}{3n+5}\right)^n$'
          - id: b
            text: '$\sum_{n=1}^{\infty}\frac{1}{n^2}$'
          - id: c
            text: '$\sum_{n=1}^{\infty}\left(\frac{1}{n}-\frac{1}{n+1}\right)$'
          - id: d
            text: '$\sum_{n=1}^{\infty}\frac{1}{n}$'
        answer:
          choiceId: a
        explanation: |
          A full expression raised to the $n$th power is a strong root-test signal.

          Related topic: root test pattern recognition.

    - id: alternating-and-absolute
      title: Alternating Series Need Two Layers
      required: true
      content: |
        If a series alternates, first ask whether it converges absolutely:

        $$
        \sum |a_n|.
        $$

        If the absolute-value series converges, the original series converges absolutely.

        If the absolute-value series diverges, the alternating series may still converge conditionally. Then use the alternating series test:

        1. magnitudes decrease eventually,
        2. magnitudes approach $0$.

        This gives the important distinction:

        $$
        \text{absolute convergence}
        \quad\text{vs.}\quad
        \text{conditional convergence}.
        $$
      check:
        id: alternating-and-absolute-check
        type: multipleChoice
        prompt: What should you usually check first for an alternating series?
        choices:
          - id: a
            text: Whether the absolute-value series converges.
          - id: b
            text: Whether the first term is positive.
          - id: c
            text: Whether the graph is symmetric.
          - id: d
            text: Whether the sum is exactly $0$.
        answer:
          choiceId: a
        explanation: |
          Absolute convergence is stronger. If the absolute-value series converges, no alternating-series rescue is needed.

    - id: inconclusive-is-information
      title: Inconclusive Does Not Mean Failure
      required: true
      content: |
        Some tests can return an inconclusive result. For example, the ratio test gives no decision when $L=1$.

        That does not mean the series converges or diverges. It means the chosen test did not extract enough information.

        Common next moves:

        - simplify the term algebraically,
        - compare to a p-series or geometric series,
        - check alternating behavior,
        - use the integral test when the term comes from a positive decreasing function.
      check:
        id: inconclusive-is-information-check
        type: multipleChoice
        prompt: If the ratio test gives $L=1$, what should you conclude?
        choices:
          - id: a
            text: The ratio test is inconclusive, so another method is needed.
          - id: b
            text: The series converges.
          - id: c
            text: The series diverges.
          - id: d
            text: The series is geometric.
        answer:
          choiceId: a
        explanation: |
          $L=1$ is the inconclusive case for the ratio and root tests. You must choose another test or transform the expression.

          Related topic: limitations of convergence tests.
