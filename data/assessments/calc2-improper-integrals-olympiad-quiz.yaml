  prompt: 'For which real p does $\int_0^1[\ln(1/x)]^p dx$ converge?'
  choices: [{ id: a, text: '$p>-1$' }, { id: b, text: '$p>1$' }, { id: c, text: '$p<1$' }, { id: d, text: 'All real p' }]
  answer: { choiceId: a }
  explanation: 'Set u equal to ln(1/x), so x equals e to the negative u and dx equals negative e to the negative u du. The apparent endpoint singularity becomes an exponentially weighted integral from zero to infinity; the only issue is near u=0, where u to p is integrable exactly when p>-1.'
  difficultyDimensions: [auxiliaryTechnique, representationTransfer, parameterThreshold, domainCondition, globalLocalReasoning]
  subjectDifficultyTags: [logarithmicSubstitution, gammaIntegral]
  difficultyEvidence: reverses limits under a logarithmic substitution, tracks exponential weight, and finds the decisive local exponent after representation transfer.
  extensionObjectiveIds: [calc2-gamma-function]
- id: q005
  type: multipleChoice
  issueSignals:
  - id: improper-integral-bounds-error
  - id: p-series-misidentified
  - id: integral-test-error
  - id: limit-evaluation-error
  - id: logarithm-property-misapplied
