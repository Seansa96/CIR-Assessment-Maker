  prompt: 'What is $\int_0^\infty x^{1/2}e^{-x}dx$?'
  choices: [{ id: a, text: '$\sqrt\pi/2$' }, { id: b, text: '$\pi/2$' }, { id: c, text: '$1$' }, { id: d, text: 'It diverges at zero' }]
  answer: { choiceId: a }
  explanation: 'The endpoint x=0 is harmless because x to the one-half is integrable, while exponential decay handles infinity. Recognize the Gamma integral $\Gamma(3/2)$, then use $\Gamma(3/2)=\tfrac12\Gamma(1/2)=\sqrt\pi/2$. The point is not merely convergence but transferring to the Gamma-function recurrence.'
  difficultyDimensions: [representationTransfer, auxiliaryTechnique, domainCondition, reverseReasoning, proofJustification]
  subjectDifficultyTags: [gammaFunction, exponentialDecay]
  difficultyEvidence: verifies both endpoints, recognizes a special-function model, maps exponent to Gamma parameter, and applies a recurrence with a known base value.
  extensionObjectiveIds: [calc2-gamma-function]
- id: q003
  type: multipleChoice
  issueSignals:
  - id: improper-integral-bounds-error
  - id: p-series-misidentified
