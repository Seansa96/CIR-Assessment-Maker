  prompt: 'Which statement about $\int_{-\infty}^{\infty}x/(1+x^2)dx$ is correct?'
  choices: [{ id: a, text: 'It diverges ordinarily but has Cauchy principal value 0.' }, { id: b, text: 'It converges absolutely to 0.' }, { id: c, text: 'It converges conditionally to 0.' }, { id: d, text: 'It diverges because its terms do not tend to zero.' }]
  answer: { choiceId: a }
  explanation: 'The integrand is odd, so symmetric cutoffs cancel, giving principal value zero. But each ordinary tail is logarithmic-size and diverges; ordinary improper convergence requires those tails separately finite. Symmetry therefore identifies a different generalized limit, not a convergent integral.'
  difficultyDimensions: [casePartition, representationTransfer, errorDiagnosis, proofJustification, globalLocalReasoning]
  subjectDifficultyTags: [principalValue, parity]
  difficultyEvidence: distinguishes symmetric global cancellation from local one-sided tail requirements and diagnoses an invalid use of odd symmetry.
  extensionObjectiveIds: [calc2-cauchy-principal-value]
- id: q004
  type: multipleChoice
  issueSignals:
  - id: improper-integral-bounds-error
  - id: p-series-misidentified
  - id: integral-test-error
  - id: limit-evaluation-error
  - id: logarithm-property-misapplied
