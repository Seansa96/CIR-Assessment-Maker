  prompt: 'For which real p does $\int_0^\infty x^p/(1+x^2)dx$ converge?'
  choices: [{ id: a, text: '$-1<p<1$' }, { id: b, text: '$p>1$' }, { id: c, text: '$p<1$' }, { id: d, text: 'All real p' }]
  answer: { choiceId: a }
  explanation: 'This has two independent local regimes. Near zero it behaves like $x^p$, requiring p greater than negative one; at infinity it behaves like $x^{p-2}$, requiring p minus two below negative one, or p<1. Both conditions are necessary and sufficient, producing -1<p<1.'
  difficultyDimensions: [casePartition, representationTransfer, parameterThreshold, globalLocalReasoning, proofJustification]
  subjectDifficultyTags: [twoEndpointAsymptotics]
  difficultyEvidence: splits two defects, creates local models, solves two threshold inequalities, and intersects them into a global classification.
  extensionObjectiveIds: [calc2-asymptotic-analysis]
- id: q002
  type: multipleChoice
  issueSignals:
  - id: improper-integral-bounds-error
  - id: p-series-misidentified
  - id: integral-test-error
  - id: limit-evaluation-error
  - id: logarithm-property-misapplied
