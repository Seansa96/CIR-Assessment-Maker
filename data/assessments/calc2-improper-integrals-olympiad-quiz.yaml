  prompt: 'Let f be positive and decreasing on [1,infinity), and suppose $\int_1^\infty f(x)dx$ diverges. Which must be true?'
  choices: [{ id: a, text: '$\sum_{n=1}^\infty f(n)$ diverges.' }, { id: b, text: '$\sum f(n)$ converges absolutely.' }, { id: c, text: '$f(n)$ fails to approach zero.' }, { id: d, text: 'The integral test is inconclusive.' }]
  answer: { choiceId: a }
  explanation: 'The Integral Test applies because positivity, continuity in the standard version, and eventual decrease link the series and the improper integral. Divergence of the integral forces divergence of the corresponding positive series even though individual terms may still tend to zero. This transfers a continuous tail result to a discrete one.'
  difficultyDimensions: [representationTransfer, proofJustification, domainCondition, reverseReasoning, globalLocalReasoning]
  subjectDifficultyTags: [integralTest, seriesTransfer]
  difficultyEvidence: verifies theorem hypotheses, transfers between continuous and discrete models, and reasons contrapositive-style from an integral classification.
  extensionObjectiveIds: [calc2-integral-test]
