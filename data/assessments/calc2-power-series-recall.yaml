schemaVersion: 1
id: calc2-power-series-recall
title: Power Series Recall Drill
assessmentType: recallDrill
categoryId: calculus-2
topicId: power-series
skills:
- Determine radii and intervals of convergence
- Transform, differentiate, and integrate power series
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - calculus-2
  - power-series
modeDefault: practice
randomizeQuestions: true
authoring:
  visualRequirement: notApplicable
  visualRationale: This drill deliberately tests recall of vocabulary, forms, and interval conditions without showing the instructional diagrams.
items:
- id: r001
  type: typed
  skills:
  - power-series
  prompt: What test is almost always used to find the Radius of Convergence?
  answer:
    expected: Ratio Test
- id: r002
  type: typed
  skills:
  - power-series
  prompt: If a power series only converges at its center, what is the Radius of Convergence
    R?
  answer:
    expected: '0'
    aliases:
    - zero
- id: r003
  type: cloze
  skills:
  - power-series
  prompt: Why must you check the endpoints of the interval of convergence manually?
  answer:
    expected: Because the Ratio Test evaluates to L=1 at the endpoints, making it
      inconclusive.
- id: r004
  type: typed
  skills:
  - power-series
  prompt: For the function 1/(1-x), what is the geometric power series representation?
  answer:
    expected: \sum x^n
    aliases:
    - sum x^n
    - 1 + x + x^2 + ...
- id: r005
  type: cloze
  skills:
  - power-series
  prompt: When you differentiate or integrate a power series term-by-term, what happens
    to the Radius of Convergence?
  answer:
    expected: It stays exactly the same (though convergence at the endpoints might
      change).
- id: r006
  type: typed
  skills:
  - power-series-center
  prompt: In $\sum c_n(x-a)^n$, what is a called?
  answer:
    expected: center
    aliases:
    - center of the power series
- id: r007
  type: typed
  skills:
  - radius-of-convergence
  prompt: If a power series converges for every real x, what is its radius of convergence?
  answer:
    expected: infinity
    aliases:
    - infinite
    - $\infty$
- id: r008
  type: flashcard
  skills:
  - interval-of-convergence
  prompt: Does the radius calculation by itself decide whether either endpoint belongs to the interval of convergence?
  answer:
    expected: no
    aliases:
    - endpoints must be tested separately
- id: r009
  type: typed
  skills:
  - geometric-transformations
  prompt: What substitution in $1/(1-u)=\sum u^n$ produces a series for $1/(1+x^2)$?
  answer:
    expected: $u=-x^2$
    aliases:
    - -x^2
- id: r010
  type: flashcard
  skills:
  - coefficient-indexing
  prompt: After differentiating $\sum_{n=0}^{\infty}c_nx^n$, which original coefficient contributes to the coefficient of $x^k$?
  answer:
    expected: $c_{k+1}$
    aliases:
    - c sub k plus 1
- id: r011
  type: typed
  skills:
  - termwise-integration
  prompt: What factor replaces $x^n$ when it is integrated term by term?
  answer:
    expected: $x^{n+1}/(n+1)$
    aliases:
    - x^(n+1)/(n+1)
- id: r012
  type: flashcard
  skills:
  - power-series-uniqueness
  prompt: If two power series agree on an interval around their common center, what must be true of their corresponding coefficients?
  answer:
    expected: They are equal.
    aliases:
    - corresponding coefficients are equal
- id: r013
  type: typed
  skills:
  - cauchy-products
  prompt: What is the name of the coefficient convolution used to multiply two power series?
  answer:
    expected: Cauchy product
    aliases:
    - cauchy multiplication
- id: r014
  type: flashcard
  skills:
  - singularities-and-radius
  prompt: For an analytic function, what geometric feature commonly determines the radius of its Taylor series?
  answer:
    expected: the distance to the nearest singularity
    aliases:
    - nearest singularity
- id: r015
  type: typed
  skills:
  - even-odd-series
  prompt: Which powers can appear in the Maclaurin series of an even function?
  answer:
    expected: even powers
    aliases:
    - only even powers
