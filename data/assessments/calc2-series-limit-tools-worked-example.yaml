  - id: series-limit-tools-step-010
    title: Use root test for nth-power terms
    instruction: |
      If the whole term is raised to the $n$th power, the root test is designed to remove it.

      $$
      \sum_{n=1}^{\infty}\left(\frac{n+1}{2n+3}\right)^n
      $$
    type: multipleChoice
    prompt: What does the root test show?
    choices:
    - id: a
      text: |-
        The root limit is $\frac12$, so the series converges.
    - id: b
      text: The root limit is $1$, so the test proves divergence.
    - id: c
      text: The root limit is $2$, so the series diverges.
    - id: d
      text: The series diverges by oscillation.
    answer:
      choiceId: a
    explanation: |-
      Solution: Taking the $n$th root gives $\frac{n+1}{2n+3}\to \frac12<1$. Therefore the answer is The root limit is $\frac12$, so the series converges.. Therefore the answer is The root limit is $\frac12$, so the series converges.. Therefore the answer is The root limit is $\frac12$, so the series converges..

