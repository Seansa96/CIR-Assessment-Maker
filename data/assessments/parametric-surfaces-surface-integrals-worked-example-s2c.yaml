workedExamples:
- id: example-001
  title: Build the representation
  problem: For r(u,v)=<u,v,u+v>, find a normal vector.
  steps:
  - id: s001
    title: Differentiate by u
    instruction: What is ru?
    type: multipleChoice
    prompt: What is ru?
    choices:
    - id: a
      text: <1,0,1>
    - id: b
      text: Its sign reverses (answers 'What happens to a vector flux integral if the chosen normal reverses?', not 'What
        is ru?')
      issueSignals:
      - id: surface-orientation-parameterization-error
    - id: c
      text: The xy-plane (answers 'Which surface fits r(u,v)=<u,v,0>?', not 'What is ru?')
      issueSignals:
      - id: sign-error
    - id: d
      text: <0,0,1> (answers 'What is a normal direction to r(u,v)=<u,v,0>?', not 'What is ru?')
      issueSignals:
      - id: surface-orientation-parameterization-error
    answer:
      choiceId: a
    issueSignals:
    - id: surface-orientation-parameterization-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
