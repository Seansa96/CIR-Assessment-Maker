lesson:
  introduction: This lesson builds an acid-base model from definitions through equations, calculations, and verification.
  sections:
  - id: sec-1
    title: Neutralization pattern
    required: true
    content: Neutralization transfers protons so acid and base form water plus a salt or dissolved ions. Balance atoms and charge before interpreting the products.
    media:
    - type: image
      src: /media/chemistry/chemistry-acid-base-reactions-model.svg
      alt: Original diagram supporting neutralization pattern.
      caption: 
    check:
      id: chk-1
      type: multipleChoice
      prompt: Which net ionic equation represents strong acid–strong hydroxide neutralization?
      choices:
      - id: a
        text: H+ + OH− → H2O
        media: []
        issueSignals: []
      - id: b
        text: H+ + Cl− → HCl
        media: []
        issueSignals:
        - id: chemical-equation-balancing-error
          domains:
          - chemistry
      - id: c
        text: Na+ + OH− → NaOH
        media: []
        issueSignals:
        - id: chemical-equation-balancing-error
          domains:
          - chemistry
      - id: d
        text: H2O → H+ + OH−
        media: []
        issueSignals:
        - id: chemical-equation-balancing-error
          domains:
          - chemistry
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >-
        Solution: Choice A (H+ + OH− → H2O).


        Why it works: For the Neutralization pattern check, identify the governing acid-base relation in the prompt, apply it to the stated species or values, and verify charge, units, or model scope.


        Why the other choices fail: Choice B (H+ + Cl− → HCl) uses the wrong model or operation; choice C (Na+ + OH− → NaOH) ignores a stated condition; choice D (H2O → H+ + OH−) substitutes an irrelevant shortcut.
