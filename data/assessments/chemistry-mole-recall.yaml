schemaVersion: 1
id: chemistry-mole-recall
title: Mole and Molar Mass Recall Drill
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
- chemistry-stoichiometry
skills:
- chemistry-stoichiometry
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: How many particles are contained in exactly one mole of any substance?
  answer:
    expected: 6.022 × 10²³
    aliases:
    - 6.022e23
    - avogadro's number
    - 6.02 × 10²³
- id: r002
  type: typed
  prompt: What are the units of molar mass?
  answer:
    expected: g/mol
    aliases:
    - grams per mole
    - g mol⁻¹
- id: r003
  type: typed
  prompt: 'What is the numerical relationship between the atomic mass of an element
    in amu and its molar mass in g/mol?

    '
  answer:
    expected: They are numerically equal.
    aliases:
    - the same
    - equal
    - numerically identical
- id: r004
  type: typed
  prompt: 'To convert from grams to moles, you divide the mass by what quantity?

    '
  answer:
    expected: molar mass
    aliases:
    - M
    - the molar mass
- id: r005
  type: typed
  prompt: What is the molar mass of carbon (C) in g/mol?
  answer:
    expected: '12.011'
    aliases:
    - '12.01'
    - 12 g/mol
- id: r006
  type: typed
  prompt: What is the molar mass of oxygen (O) in g/mol?
  answer:
    expected: '15.999'
    aliases:
    - '16.00'
    - '16'
- id: r007
  type: flashcard
  prompt: State the definition of the mole.
  answer:
    expected: 'The mole is the SI unit of amount of substance equal to exactly 6.022
      × 10²³ representative particles (atoms, molecules, or ions).

      '
- id: r008
  type: typed
  prompt: What is the formula for converting grams to moles?
  answer:
    expected: n = m / M
    aliases:
    - moles = mass / molar mass
    - n = m/M
- id: r009
  type: typed
  prompt: 'Percent composition by mass is calculated by dividing the mass of the element
    in one mole of compound by what?

    '
  answer:
    expected: molar mass of the compound
    aliases:
    - the molar mass
    - the compound's molar mass
- id: r010
  type: typed
  prompt: What is Avogadro's number?
  answer:
    expected: 6.022 × 10²³
    aliases:
    - 6.022e23
    - 6.02 × 10²³
- id: r011
  type: typed
  prompt: What is the molar mass of H2O in g/mol? (H = 1.008, O = 15.999)
  answer:
    expected: '18.015'
    aliases:
    - '18.02'
    - '18'
- id: r012
  type: flashcard
  prompt: Explain why the molar mass of carbon is 12.011 g/mol rather than exactly
    12.000 g/mol.
  answer:
    expected: 'The periodic table atomic mass is a weighted average of all stable
      isotopes. Carbon is mostly C-12 (12.000 amu, 98.9%) but also contains C-13 (13.003
      amu, 1.1%), pulling the weighted average slightly above 12.000.

      '
