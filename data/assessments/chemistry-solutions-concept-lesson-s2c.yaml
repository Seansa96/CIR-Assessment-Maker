id: chemistry-solutions-concept-lesson-s2c
title: Solution Concentration and Preparation
assessmentType: conceptLesson
categoryId: chemistry
topicId: chemistry-solutions
modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [chemistry, solutions, concentration, molarity, dilution] }
authoring: { visualRequirement: required, visualRationale: 'Preparing a known-concentration solution depends on distinguishing solute, solvent, and final solution volume.', sourceId: src-20260720035703-91ea51b0d8 }
lesson:
  introduction: 'Concentration answers two different questions: how much solute is present, and relative to what amount of solution? Select the concentration form before calculating.'
  sections:
    - id: sc-01
      title: 1. Identify solute, solvent, and solution
      content: 'A solution is homogeneous. The solute is the substance being dissolved; the solvent is the dissolving medium; the solution is the final mixture. Concentration always refers to the final mixture unless a formula explicitly names solvent mass.'
      media: [{ type: image, src: /media/chemistry/solution-concentration-lab.svg, alt: Three-stage solution preparation diagram, caption: Molarity uses the final volume after the solute has dissolved. }]
      check: { id: sc-01-check, type: multipleChoice, prompt: 'When 5.00 g NaCl is dissolved and the final mixture is adjusted to 250.0 mL, which quantity belongs in a molarity denominator?', choices: [{ id: a, text: '250.0 mL of solution' }, { id: b, text: 'the mass of NaCl' }, { id: c, text: 'the initial water volume' }, { id: d, text: 'the molar mass of NaCl' }], answer: { choiceId: a }, explanation: 'Solution: Molarity uses liters of the final solution, so the relevant volume is 250.0 mL of solution. Why it works: Dissolving solute can change volume; the concentration definition controls the denominator. Common trap: Using the starting water volume. Why the other choices fail: b and d are mass quantities, while c is not guaranteed to equal final solution volume.' }
    - id: sc-02
      title: 2. Choose a concentration form
      content: 'Mass percent reports grams of solute per 100 g solution. Volume percent reports mL solute per 100 mL solution. ppm and ppb are small fractions: for dilute aqueous solutions, ppm is commonly mg/L and ppb is commonly micrograms/L. Molarity reports mol/L.'
      media: [{ type: image, src: /media/chemistry/solution-concentration-lab.svg, alt: Solution preparation diagram, caption: Different concentration forms use different reference quantities. }]
      check: { id: sc-02-check, type: multipleChoice, prompt: 'Which unit best communicates 2.5 mg fluoride in 1.0 L drinking water?', choices: [{ id: a, text: 'ppm' }, { id: b, text: 'molarity only' }, { id: c, text: 'mass percent only' }, { id: d, text: 'moles of water' }], answer: { choiceId: a }, explanation: 'Solution: In dilute water, 2.5 mg/L is approximately 2.5 ppm. Why it works: ppm is designed for very small mass fractions. Common trap: Writing 2.5%—that is ten thousand times larger. Why the other choices fail: b can be calculated but is not the customary trace-contaminant unit; c is poorly scaled; d does not state solute concentration.' }
    - id: sc-03
      title: 3. Use mass percent deliberately
      content: 'Mass percent is $$\frac{m_{solute}}{m_{solution}}\times100\%.$$ The solution mass includes both solute and solvent. If 8.0 g solute is mixed with 92.0 g water, the solution mass is 100.0 g.'
      media: [{ type: image, src: /media/chemistry/solution-concentration-lab.svg, alt: Balance and flask diagram, caption: Mass percent compares solute mass with total solution mass. }]
      check: { id: sc-03-check, type: multipleChoice, prompt: 'A solution contains 12.0 g glucose and 88.0 g water. What is its mass percent glucose?', choices: [{ id: a, text: '12.0%' }, { id: b, text: '13.6%' }, { id: c, text: '88.0%' }, { id: d, text: '0.120%' }], answer: { choiceId: a }, explanation: 'Solution: Total solution mass is 12.0 + 88.0 = 100.0 g, so mass percent is (12.0/100.0) × 100% = 12.0%. Why it works: The denominator is all of the solution. Common trap: Dividing by solvent mass only. Why the other choices fail: b uses 88.0 g as denominator; c is the water percentage; d shifts the decimal incorrectly.' }
    - id: sc-04
      title: 4. Define and rearrange molarity
      content: 'Molarity is $$M=\frac{n}{V}.$$ Use liters, not milliliters. Rearranging gives $$n=MV$$ and $$V=\frac{n}{M}.$$ Track units: mol/L times L leaves mol.'
      media: [{ type: image, src: /media/chemistry/solution-concentration-lab.svg, alt: Volumetric flask diagram, caption: A volumetric flask fixes the final solution volume used in molarity. }]
      check: { id: sc-04-check, type: numericResponse, prompt: 'How many moles are in 325.0 mL of 0.400 M KNO3?', answer: { value: 0.13, tolerance: 0.0005 }, explanation: 'Solution: Convert 325.0 mL to 0.3250 L. Then n = MV = (0.400 mol/L)(0.3250 L) = 0.130 mol. Why it works: Molarity is moles per liter, so multiplying by liters recovers moles. Common trap: Using 325.0 as liters and obtaining a result 1000 times too large.' }
    - id: sc-05
      title: 5. Connect mass, molar mass, and molarity
      content: 'When a problem begins with grams, first convert to moles with $$n=\frac{m}{M_m}.$$ Then divide by final solution volume. This is a two-stage unit path: grams → moles → molarity.'
      media: [{ type: image, src: /media/chemistry/solution-concentration-lab.svg, alt: Solution preparation pathway, caption: Molar mass connects a weighed sample to molarity. }]
      check: { id: sc-05-check, type: multipleChoice, prompt: 'What is the correct first operation for finding the molarity from 9.80 g H2SO4 and a final volume?', choices: [{ id: a, text: 'Divide 9.80 g by the molar mass' }, { id: b, text: 'Divide 9.80 g directly by liters' }, { id: c, text: 'Multiply grams by liters' }, { id: d, text: 'Use M1V1=M2V2' }], answer: { choiceId: a }, explanation: 'Solution: Divide the mass by H2SO4 molar mass to obtain moles, then use M = n/V. Why it works: Molarity is based on moles, not grams. Common trap: Treating g/L as mol/L. Why the other choices fail: b has the wrong unit; c does not form concentration; d applies only to dilution of an existing solution.' }
    - id: sc-06
      title: 6. Prepare a solution to a target molarity
      content: 'To make a known solution, calculate required moles from n = MV, convert moles to mass, weigh that mass, dissolve it in less than the final volume, then dilute exactly to the calibration mark. Do not add solute to an already measured final volume of water.'
      media: [{ type: image, src: /media/chemistry/solution-concentration-lab.svg, alt: Weigh dissolve and dilute workflow, caption: The calibration mark represents final solution volume, not added-water volume. }]
      check: { id: sc-06-check, type: multipleChoice, prompt: 'Which procedure correctly makes 250.0 mL of a target solution?', choices: [{ id: a, text: 'Dissolve the calculated solute, then add water until the solution reaches 250.0 mL.' }, { id: b, text: 'Measure 250.0 mL water, then add solute.' }, { id: c, text: 'Add solute until the flask mass is 250.0 g.' }, { id: d, text: 'Use any volume because molarity is mass-based.' }], answer: { choiceId: a }, explanation: 'Solution: Put the calculated solute in a volumetric flask, dissolve it, and fill to the 250.0 mL mark. Why it works: The target volume is the volume of solution. Common trap: Treating water volume as final solution volume. Why the other choices fail: b can overshoot final volume; c controls a different quantity; d confuses molarity with mass percent.' }
    - id: sc-07
      title: 7. Model dilution as conserved solute
      content: 'Dilution adds solvent without changing solute moles, so $$M_1V_1=M_2V_2.$$ Label the stock values as 1 and desired final values as 2; convert both volumes to the same units before solving.'
      media: [{ type: image, src: /media/chemistry/solution-concentration-lab.svg, alt: Stock-to-flask dilution workflow, caption: Dilution preserves solute moles but increases final volume. }]
      check: { id: sc-07-check, type: multipleChoice, prompt: 'A 2.00 M stock is diluted from 50.0 mL to 200.0 mL. What is the final molarity?', choices: [{ id: a, text: '0.500 M' }, { id: b, text: '8.00 M' }, { id: c, text: '2.00 M' }, { id: d, text: '0.125 M' }], answer: { choiceId: a }, explanation: 'Solution: M2 = M1V1/V2 = (2.00 M)(50.0 mL)/(200.0 mL) = 0.500 M. Why it works: The same solute amount occupies four times the volume, so concentration is one fourth. Common trap: Reversing V1 and V2. Why the other choices fail: b reverses the dilution; c ignores added solvent; d applies an extra factor of four.' }
