title: Improper Integrals Worked Example
assessmentType: workedExample
categoryId: calculus-2
subcategoryId: improper-integrals
subcategoryIds:
  - integration-techniques
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we001
    title: Classifying and evaluating improper integrals
    problem: |
      Improper integrals require you to replace the suspicious part of the integral with a limit. The most common situations are:

      - an infinite interval, such as $\int_1^\infty f(x)\,dx$;
      - a vertical asymptote or undefined point at an endpoint;
      - a vertical asymptote or undefined point inside the interval;
      - two infinite tails, such as $\int_{-\infty}^{\infty} f(x)\,dx$;
      - comparison or $p$-test situations where exact antiderivatives are not the best tool.

      The main decision is not just whether an antiderivative exists. The decision is where the limit must be placed and whether each required limit converges.
    steps:
      - id: s001
        title: Identify why the integral is improper
        instruction: |
          First classify the reason the integral is improper. You are looking for infinite bounds or places where the integrand is undefined on the interval.
        type: selectAll
        prompt: |
          Which integrals are improper?
        choices:
          - id: a
            text: '$\int_1^\infty \frac{1}{x^2}\,dx$'
          - id: b
            text: '$\int_0^1 \frac{1}{\sqrt{x}}\,dx$'
          - id: c
            text: '$\int_{-1}^{1} \frac{1}{x}\,dx$'
          - id: d
            text: '$\int_0^1 x^2\,dx$'
        answer:
          choiceIds: [a, b, c]
        hint: |
          Check bounds first, then check where the integrand is undefined.
        explanation: |
          Choice `a` is improper because the upper bound is infinite. Choice `b` is improper because $\frac{1}{\sqrt{x}}$ is undefined at $x=0$. Choice `c` is improper because $\frac{1}{x}$ is undefined at the interior point $x=0$.

          The technique choice is classification before computation. Do not start integrating until you know where the limit belongs.

      - id: s002
        title: Convert an infinite upper bound into a limit
        instruction: |
          For an infinite upper bound, replace infinity with a variable endpoint and send that endpoint to infinity after integrating.
        type: multipleChoice
        prompt: |
          Which setup correctly starts?

          $$
          \int_1^\infty \frac{1}{x^2}\,dx
          $$
        choices:
          - id: a
            text: '$\lim_{b\to\infty}\int_1^b \frac{1}{x^2}\,dx$'
          - id: b
            text: '$\int_1^b \lim_{b\to\infty}\frac{1}{x^2}\,dx$'
          - id: c
            text: '$\lim_{b\to 1}\int_b^\infty \frac{1}{x^2}\,dx$'
          - id: d
            text: '$\int_1^\infty -2x^{-3}\,dx$'
        answer:
          choiceId: a
        hint: |
          Keep the integrand unchanged and replace only the infinite endpoint.
        explanation: |
          The correct technique is the infinite-interval limit definition:

          $$
          \int_1^\infty \frac{1}{x^2}\,dx
          =
          \lim_{b\to\infty}\int_1^b x^{-2}\,dx.
          $$

          You do not move the limit inside the integrand first. You integrate over a finite interval, then evaluate the endpoint limit.

      - id: s003
        title: Use the p-test at infinity
        instruction: |
          The integral $\int_1^\infty \frac{1}{x^p}\,dx$ converges exactly when $p>1$.
        type: multipleChoice
        prompt: |
          Which statement is true?

          $$
          \int_1^\infty \frac{1}{x^p}\,dx
          $$
        choices:
          - id: a
            text: 'It converges when $p>1$ and diverges when $p\le 1$.'
          - id: b
            text: 'It converges when $p\ge 0$ and diverges when $p<0$.'
          - id: c
            text: 'It converges only when $p=1$.'
          - id: d
            text: 'It always converges because the integrand approaches $0$.'
        answer:
          choiceId: a
        hint: |
          Approaching zero is necessary, but not sufficient.
        explanation: |
          The correct technique is the $p$-test for infinite tails. For $\int_1^\infty x^{-p}\,dx$, convergence requires $p>1$. The common trap is thinking that any function approaching $0$ must have finite area. $\frac{1}{x}$ approaches $0$, but $\int_1^\infty \frac{1}{x}\,dx$ diverges.

      - id: s004
        title: Use the endpoint p-test
        instruction: |
          The endpoint version has the opposite-looking threshold: $\int_0^1 \frac{1}{x^p}\,dx$ converges when $p<1$.
        type: multipleChoice
        prompt: |
          Does this integral converge?

          $$
          \int_0^1 \frac{1}{\sqrt{x}}\,dx
          $$
        choices:
          - id: a
            text: 'Yes, because it is $\int_0^1 x^{-1/2}\,dx$ and $p=\frac{1}{2}<1$.'
          - id: b
            text: 'No, because the integrand is undefined at $0$.'
          - id: c
            text: 'No, because every endpoint singularity diverges.'
          - id: d
            text: 'Yes, because all positive functions converge on finite intervals.'
        answer:
          choiceId: a
        hint: |
          A singularity makes the integral improper, but not automatically divergent.
        explanation: |
          The technique choice is the endpoint $p$-test or direct limit evaluation. Since

          $$
          \frac{1}{\sqrt{x}}=x^{-1/2},
          $$

          the endpoint exponent is $p=\frac{1}{2}$. For $\int_0^1 \frac{1}{x^p}\,dx$, convergence occurs when $p<1$. The singularity at $0$ requires a limit, but that limit is finite.

      - id: s005
        title: Recognize endpoint divergence
        instruction: |
          Endpoint singularities with $p\ge 1$ diverge.
        type: multipleChoice
        prompt: |
          What happens?

          $$
          \int_0^1 \frac{1}{x}\,dx
          $$
        choices:
          - id: a
            text: 'It diverges because the endpoint $p$-test has $p=1$.'
          - id: b
            text: 'It converges to $1$.'
          - id: c
            text: 'It converges because $\ln(1)=0$.'
          - id: d
            text: 'It converges by symmetry.'
        answer:
          choiceId: a
        hint: |
          Evaluate $\lim_{a\to0^+}\int_a^1 \frac{1}{x}\,dx$.
        explanation: |
          The correct technique is the endpoint limit:

          $$
          \lim_{a\to0^+}\int_a^1 \frac{1}{x}\,dx
          =
          \lim_{a\to0^+}(\ln 1-\ln a).
          $$

          Since $\ln a\to-\infty$, the expression tends to $\infty$. The integral diverges. This is also the endpoint $p$-test boundary case $p=1$.

      - id: s006
        title: Split at an interior discontinuity
        instruction: |
          If the integrand is undefined inside the interval, split the integral at that point and test each side separately.
        type: multipleChoice
        prompt: |
          What is the correct setup?

          $$
          \int_0^2 \frac{1}{x-1}\,dx
          $$
        choices:
          - id: a
            text: '$\lim_{b\to1^-}\int_0^b \frac{1}{x-1}\,dx+\lim_{c\to1^+}\int_c^2 \frac{1}{x-1}\,dx$'
          - id: b
            text: '$\lim_{b\to1}\int_0^2 \frac{1}{x-1}\,dx$'
          - id: c
            text: '$\int_0^2 \ln|x-1|\,dx$'
          - id: d
            text: '$\lim_{b\to\infty}\int_0^b \frac{1}{x-1}\,dx$'
        answer:
          choiceId: a
        hint: |
          Approach the vertical asymptote from both sides.
        explanation: |
          The singularity is at the interior point $x=1$, so the technique choice is splitting the integral:

          $$
          \int_0^2 \frac{1}{x-1}\,dx
          =
          \int_0^1 \frac{1}{x-1}\,dx
          +
          \int_1^2 \frac{1}{x-1}\,dx,
          $$

          with each piece interpreted as a one-sided limit. If either side diverges, the whole improper integral diverges.

      - id: s007
        title: Split two infinite tails
        instruction: |
          For $(-\infty,\infty)$, choose a finite split point and require both tails to converge.
        type: multipleChoice
        prompt: |
          Which setup is valid?

          $$
          \int_{-\infty}^{\infty}\frac{1}{1+x^2}\,dx
          $$
        choices:
          - id: a
            text: '$\int_{-\infty}^{0}\frac{1}{1+x^2}\,dx+\int_{0}^{\infty}\frac{1}{1+x^2}\,dx$, each as its own limit'
          - id: b
            text: '$\lim_{b\to\infty}\int_{-b}^{b}\frac{1}{1+x^2}\,dx$ only'
          - id: c
            text: '$\int_{0}^{\infty}\frac{1}{1+x^2}\,dx$ only'
          - id: d
            text: 'No limit is needed because the function is continuous.'
        answer:
          choiceId: a
        hint: |
          Principal value is not the same as ordinary improper convergence.
        explanation: |
          The technique choice is two-tail splitting. For ordinary improper integrals,

          $$
          \int_{-\infty}^{\infty}f(x)\,dx
          =
          \int_{-\infty}^{0}f(x)\,dx+\int_{0}^{\infty}f(x)\,dx,
          $$

          and both pieces must converge independently. The symmetric limit $\lim_{b\to\infty}\int_{-b}^{b}f(x)\,dx$ is a Cauchy principal value, which is not enough for ordinary convergence.

      - id: s008
        title: Evaluate a convergent two-tail example
        instruction: |
          Some two-tail integrals converge because both separate tails converge.
        type: multipleChoice
        prompt: |
          What is the value?

          $$
          \int_{-\infty}^{\infty}\frac{1}{1+x^2}\,dx
          $$
        choices:
          - id: a
            text: '$\pi$'
          - id: b
            text: '$0$'
          - id: c
            text: '$2$'
          - id: d
            text: 'Diverges'
        answer:
          choiceId: a
        hint: |
          The antiderivative is $\arctan x$.
        explanation: |
          The technique choices are two-tail splitting and arctangent evaluation. Each tail converges:

          $$
          \int_{0}^{\infty}\frac{1}{1+x^2}\,dx=\frac{\pi}{2},
          \qquad
          \int_{-\infty}^{0}\frac{1}{1+x^2}\,dx=\frac{\pi}{2}.
          $$

          Adding the two convergent tails gives $\pi$.

      - id: s009
        title: Use comparison when exact integration is not the point
        instruction: |
          For many improper integrals, compare the integrand's large-$x$ behavior to a known $p$-integral.
        type: multipleChoice
        prompt: |
          What happens?

          $$
          \int_1^\infty \frac{x}{x^3+1}\,dx
          $$
        choices:
          - id: a
            text: 'Converges, because the integrand behaves like $\frac{1}{x^2}$ for large $x$.'
          - id: b
            text: 'Diverges, because the denominator has $x^3$.'
          - id: c
            text: 'Diverges, because the numerator has $x$.'
          - id: d
            text: 'Converges only by completing the square.'
        answer:
          choiceId: a
        hint: |
          Compare leading powers.
        explanation: |
          The technique choice is comparison or limit comparison. For large $x$,

          $$
          \frac{x}{x^3+1}\sim\frac{x}{x^3}=\frac{1}{x^2}.
          $$

          Since $\int_1^\infty \frac{1}{x^2}\,dx$ converges, this integral converges by comparison. Exact partial fractions are possible but less efficient for a convergence-only question.

      - id: s010
        title: Recognize divergence from nonzero tail behavior
        instruction: |
          If an integrand approaches a nonzero constant on an infinite interval, the area diverges.
        type: multipleChoice
        prompt: |
          What happens?

          $$
          \int_0^\infty \frac{x^2+1}{x^2+4}\,dx
          $$
        choices:
          - id: a
            text: 'Diverges, because the integrand approaches $1$.'
          - id: b
            text: 'Converges, because numerator and denominator have the same degree.'
          - id: c
            text: 'Converges by arctangent.'
          - id: d
            text: 'Converges by the endpoint $p$-test.'
        answer:
          choiceId: a
        hint: |
          Check the limit of the integrand as $x\to\infty$.
        explanation: |
          The technique choice is tail behavior before antiderivatives. Since

          $$
          \lim_{x\to\infty}\frac{x^2+1}{x^2+4}=1,
          $$

          the function behaves like a positive constant over an infinite interval. That produces infinite area, so the integral diverges. The arctangent part that appears after rewriting is not enough to cancel the linear growth.

      - id: s011
        title: Handle exponential decay
        instruction: |
          Exponential decay over an infinite interval often converges because the antiderivative has a finite endpoint limit.
        type: multipleChoice
        prompt: |
          What is the value?

          $$
          \int_0^\infty e^{-3x}\,dx
          $$
        choices:
          - id: a
            text: '$\frac{1}{3}$'
          - id: b
            text: '$3$'
          - id: c
            text: '$0$'
          - id: d
            text: 'Diverges'
        answer:
          choiceId: a
        hint: |
          Use $\lim_{b\to\infty}\int_0^b e^{-3x}\,dx$.
        explanation: |
          The technique choices are infinite-bound limit setup and exponential antiderivative:

          $$
          \lim_{b\to\infty}\int_0^b e^{-3x}\,dx
          =
          \lim_{b\to\infty}\left[-\frac{1}{3}e^{-3x}\right]_0^b
          =
          \frac{1}{3}.
          $$

          The endpoint term at infinity vanishes because $e^{-3b}\to0$.

      - id: s012
        title: Avoid the principal value trap
        instruction: |
          Symmetric cancellation does not prove ordinary improper convergence.
        type: multipleChoice
        prompt: |
          What is true about this ordinary improper integral?

          $$
          \int_{-\infty}^{\infty}\frac{x}{x^2+1}\,dx
          $$
        choices:
          - id: a
            text: 'It diverges as an ordinary improper integral, even though its principal value is $0$.'
          - id: b
            text: 'It converges to $0$ because the function is odd.'
          - id: c
            text: 'It converges to $\pi$.'
          - id: d
            text: 'It converges by the $p$-test with $p=2$.'
        answer:
          choiceId: a
        hint: |
          Test each tail separately.
        explanation: |
          The technique choice is two-tail splitting, not symmetric cancellation. The antiderivative is

          $$
          \frac{1}{2}\ln(x^2+1).
          $$

          On $[0,\infty)$ this tends to $\infty$, and on $(-\infty,0]$ it tends to $-\infty$. Since the separate tails do not both converge to finite numbers, the ordinary improper integral diverges. The symmetric principal value is $0$, but that is a different concept.


