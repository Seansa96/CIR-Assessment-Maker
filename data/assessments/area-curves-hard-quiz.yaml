questions:
- id: area-hard-1
  title: Integration with respect to y
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the area bounded by $x = y^2$ and $x = 16$.'
  answer:
    gradingMode: auto
    expected: (4/3)*64
  explanation: 'Integrate from $y=-4$ to $y=4$: $\int_{-4}^4 (16 - y^2) \, dy = \frac{4}3(64)$.'
