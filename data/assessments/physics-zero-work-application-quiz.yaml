questions:
- id: q-tension-work
  title: Work Done by Tension
  type: multipleChoice
  prompt: |
    Determine if the specified force does positive, negative, or zero work:
    The tension in a pendulum string as it swings downward.
  choices:
  - id: a
    text: Positive work
  - id: b
    text: Negative work
  - id: c
    text: Zero work
  answer:
    choiceId: c
  explanation: |
    Tension points radially inward toward the pivot, while the bob's displacement is always tangential to the circular path. 
    Radial and tangential directions are always perfectly perpendicular ($90^\circ$). 
    Therefore, the dot product is zero, and tension does zero work on a swinging pendulum.
  skills:
  - physics-work-energy
- id: q-normal-force-work
  title: Work Done by Normal Force on a Flat Surface
  type: multipleChoice
  prompt: |
    A block is pushed across a horizontal table at a constant speed. Does the normal force exerted by the table on the block do positive, negative, or zero work?
  choices:
  - id: a
    text: Positive work
  - id: b
    text: Negative work
  - id: c
    text: Zero work
  answer:
    choiceId: c
  explanation: |
    The normal force acts vertically upward, while the displacement of the block is purely horizontal.
    Because the angle between the normal force and the displacement is $90^\circ$, $\cos(90^\circ) = 0$, so the work done is zero.
  skills:
  - physics-work-energy
- id: q-carrying-object
  title: Carrying an Object Horizontally
  type: multipleChoice
  prompt: |
    A student holds a heavy $10\text{ kg}$ box and walks $5\text{ m}$ forward at a constant velocity. How much work does the student do on the box while walking forward?
  choices:
  - id: a
    text: Positive work ($500\text{ J}$)
  - id: b
    text: Negative work ($-500\text{ J}$)
  - id: c
    text: Zero work
  answer:
    choiceId: c
  explanation: |
    The student must exert an upward force equal to the box's weight ($mg \approx 100\text{ N}$) to keep it from falling. 
    However, the displacement is entirely horizontal. Because the force (upward) and displacement (forward) are perpendicular, the work done on the box by the student is zero.
  skills:
  - physics-work-energy
