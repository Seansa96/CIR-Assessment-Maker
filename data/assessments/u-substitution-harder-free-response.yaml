  - id: q007
    type: freeResponse
    prompt: |
      Evaluate the indefinite integral.

      $$
      \int \tan x\,dx
      $$
    answer:
      expected: |
        \[
        -\ln|\cos x|+C
        \]

        Equivalently:

        \[
        \ln|\sec x|+C
        \]
      gradingMode: selfCheck
    explanation: |
      Rewrite \(\tan x=\frac{\sin x}{\cos x}\).

      Let \(u=\cos x\). Then \(du=-\sin x\,dx\).

      $$
      \int \frac{\sin x}{\cos x}\,dx
      =
      -\int\frac{1}{u}\,du
      =
      -\ln|u|+C
      $$

      Substitute back to get \(-\ln|\cos x|+C\).

      Related topic: Trigonometric U-Substitution Leading to Logarithms

  - id: q008
    type: freeResponse
    prompt: |
