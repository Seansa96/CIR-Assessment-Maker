- id: q009
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int x^2\sin(x^3)\,dx

    $$

    '
  answer:
    expectedLatex: -\frac{1}{3}\cos(x^3)+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=x^3$. Then $du=3x^2\,dx$, so $x^2\,dx=\frac13du$.


    $$

    \int x^2\sin(x^3)\,dx

    =

    \frac13\int\sin u\,du

    =

    -\frac13\cos u+C

    $$


    Substitute back to get $-\frac13\cos(x^3)+C$.


    Related topic: U-Substitution with Trigonometric Compositions

    '
- id: q010
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int \frac{x}{x^2+4x+13}\,dx

    $$

    '
  answer:
    expectedLatex: \frac{1}{2}\ln(x^2+4x+13)-\frac{2}{3}\arctan\left(\frac{x+2}{3}\right)+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'This one is harder because the numerator is not exactly the derivative
    of the denominator.


    Write $x=\frac12(2x+4)-2$:


    $$

    \int \frac{x}{x^2+4x+13}\,dx

    =

    \frac12\int\frac{2x+4}{x^2+4x+13}\,dx

    -

    2\int\frac{1}{(x+2)^2+9}\,dx

    $$


    The first integral uses $u=x^2+4x+13$. The second uses the arctangent pattern.


    Related topic: Partial Numerator Matching with U-Substitution

    '
- id: q011
  type: symbolicResponse
  prompt: 'Evaluate the definite integral.


    $$

    \int_0^1 2x(x^2+1)^4\,dx

    $$

    '
  answer:
    expectedLatex: \frac{31}{5}
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Let $u=x^2+1$. Then $du=2x\,dx$.


    Change bounds:


    $$

    x=0\Rightarrow u=1,\qquad x=1\Rightarrow u=2

    $$


    $$

    \int_1^2u^4\,du=\frac{u^5}{5}\Big|_1^2=\frac{32-1}{5}=\frac{31}{5}

    $$


    Related topic: Definite U-Substitution with Changed Bounds

    '
- id: q012
  type: symbolicResponse
  prompt: 'Evaluate the definite integral.


    $$

    \int_0^{\pi/2}\sin x\cos^3x\,dx

    $$

    '
  answer:
    expectedLatex: \frac{1}{4}
    equivalenceMode: expression
    tolerance: 0
  explanation: 'Let $u=\cos x$. Then $du=-\sin x\,dx$.


    Change bounds:


    $$

    x=0\Rightarrow u=1,\qquad x=\frac{\pi}{2}\Rightarrow u=0

    $$


    $$

    \int_0^{\pi/2}\sin x\cos^3x\,dx

    =

    -\int_1^0u^3\,du

    =

    \int_0^1u^3\,du

    =

    \frac14

    $$


    Related topic: Definite Trigonometric U-Substitution

    '
