- id: q007
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int \tan x\,dx

    $$

    '
  answer:
    expectedLatex: -\ln|\cos x|+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Rewrite $\tan x=\frac{\sin x}{\cos x}$.


    Let $u=\cos x$. Then $du=-\sin x\,dx$.


    $$

    \int \frac{\sin x}{\cos x}\,dx

    =

    -\int\frac{1}{u}\,du

    =

    -\ln|u|+C

    $$


    Substitute back to get $-\ln|\cos x|+C$.


    Related topic: Trigonometric U-Substitution Leading to Logarithms

    '
