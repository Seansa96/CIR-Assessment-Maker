      Evaluate the indefinite integral.

      $$
      \int \frac{\sin x}{1+\cos^2 x}\,dx
      $$
    answer:
      expected: |
        \[
        -\arctan(\cos x)+C
        \]
      gradingMode: selfCheck
    explanation: |
      Let \(u=\cos x\). Then \(du=-\sin x\,dx\).

      $$
      \int \frac{\sin x}{1+\cos^2 x}\,dx
      =
      -\int\frac{1}{1+u^2}\,du
      =
      -\arctan u+C
      $$

      Substitute back to get \(-\arctan(\cos x)+C\).

      Related topic: U-Substitution Leading to Arctangent

  - id: q020
    type: freeResponse
    prompt: |
      Evaluate the definite integral.

      $$
      \int_1^e \frac{(\ln x)^2}{x}\,dx
      $$
    answer:
      expected: |
        \[
        \frac13
        \]
      gradingMode: selfCheck
    explanation: |
      Let \(u=\ln x\). Then \(du=\frac1x\,dx\).

      Change bounds:

      $$
      x=1\Rightarrow u=0,\qquad x=e\Rightarrow u=1
      $$

      $$
      \int_0^1u^2\,du=\frac{u^3}{3}\Big|_0^1=\frac13
      $$

      Related topic: Definite U-Substitution with Natural Logarithms
