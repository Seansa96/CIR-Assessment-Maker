      Substitute back to get \(\ln|\tan x+4|+C\).

      Related topic: U-Substitution with Tangent and Secant

  - id: q009
    type: freeResponse
    prompt: |
      Evaluate the indefinite integral.

      $$
      \int x^2\sin(x^3)\,dx
      $$
    answer:
      expected: |
        \[
        -\frac{1}{3}\cos(x^3)+C
        \]
      gradingMode: selfCheck
    explanation: |
      Let \(u=x^3\). Then \(du=3x^2\,dx\), so \(x^2\,dx=\frac13du\).

      $$
      \int x^2\sin(x^3)\,dx
      =
      \frac13\int\sin u\,du
      =
      -\frac13\cos u+C
      $$

      Substitute back to get \(-\frac13\cos(x^3)+C\).

      Related topic: U-Substitution with Trigonometric Compositions

  - id: q010
    type: freeResponse
    prompt: |
      Evaluate the indefinite integral.

      $$
      \int \frac{x}{x^2+4x+13}\,dx
      $$
    answer:
      expected: |
        \[
        \frac12\ln(x^2+4x+13)-\frac{2}{3}\arctan\left(\frac{x+2}{3}\right)+C
        \]
      gradingMode: selfCheck
    explanation: |
      This one is harder because the numerator is not exactly the derivative of the denominator.

      Write \(x=\frac12(2x+4)-2\):

      $$
      \int \frac{x}{x^2+4x+13}\,dx
      =
      \frac12\int\frac{2x+4}{x^2+4x+13}\,dx
      -
      2\int\frac{1}{(x+2)^2+9}\,dx
      $$

      The first integral uses \(u=x^2+4x+13\). The second uses the arctangent pattern.

      Related topic: Partial Numerator Matching with U-Substitution

  - id: q011
    type: freeResponse
    prompt: |
      Evaluate the definite integral.

      $$
      \int_0^1 2x(x^2+1)^4\,dx
      $$
    answer:
      expected: |
        \[
        \frac{31}{5}
        \]
      gradingMode: selfCheck
    explanation: |
      Let \(u=x^2+1\). Then \(du=2x\,dx\).

      Change bounds:

      $$
      x=0\Rightarrow u=1,\qquad x=1\Rightarrow u=2
      $$

      $$
      \int_1^2u^4\,du=\frac{u^5}{5}\Big|_1^2=\frac{32-1}{5}=\frac{31}{5}
      $$

      Related topic: Definite U-Substitution with Changed Bounds

  - id: q012
    type: freeResponse
    prompt: |
      Evaluate the definite integral.

      $$
      \int_0^{\pi/2}\sin x\cos^3x\,dx
      $$
    answer:
      expected: |
        \[
        \frac14
        \]
      gradingMode: selfCheck
    explanation: |
      Let \(u=\cos x\). Then \(du=-\sin x\,dx\).

      Change bounds:

      $$
      x=0\Rightarrow u=1,\qquad x=\frac{\pi}{2}\Rightarrow u=0
      $$

      $$
      \int_0^{\pi/2}\sin x\cos^3x\,dx
      =
      -\int_1^0u^3\,du
      =
      \int_0^1u^3\,du
      =
      \frac14
      $$

      Related topic: Definite Trigonometric U-Substitution

