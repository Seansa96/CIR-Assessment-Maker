questions:
- id: q001
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int 6x(3x^2+5)^7\,dx

    $$

    '
  answer:
    expectedLatex: \frac{(3x^2+5)^8}{8}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=3x^2+5$. Then $du=6x\,dx$.


    The integral becomes


    $$

    \int u^7\,du=\frac{u^8}{8}+C

    $$


    Substitute back to get $\frac{(3x^2+5)^8}{8}+C$.


    Related topic: U-Substitution with Polynomial Inner Functions

    '
- id: q002
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int \frac{x}{\sqrt{x^2+9}}\,dx

    $$

    '
  answer:
    expectedLatex: \sqrt{x^2+9}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=x^2+9$. Then $du=2x\,dx$, so $x\,dx=\frac12du$.


    $$

    \int \frac{x}{\sqrt{x^2+9}}\,dx

    =

    \frac12\int u^{-1/2}\,du

    =

    u^{1/2}+C

    $$


    Substitute back to get $\sqrt{x^2+9}+C$.


    Related topic: U-Substitution with Radical Denominators

    '
- id: q003
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int \frac{4x^3}{x^4+1}\,dx

    $$

    '
  answer:
    expectedLatex: \ln|x^4+1|+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=x^4+1$. Then $du=4x^3\,dx$.


    The integral becomes


    $$

    \int \frac{1}{u}\,du=\ln|u|+C

    $$


    Since $x^4+1>0$, this may also be written as $\ln(x^4+1)+C$.


    Related topic: U-Substitution Leading to Logarithms

    '
- id: q004
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

