- id: q015
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int \frac{x^2}{\sqrt{x^3+8}}\,dx

    $$

    '
  answer:
    expectedLatex: \frac{2}{3}\sqrt{x^3+8}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=x^3+8$. Then $du=3x^2\,dx$, so $x^2\,dx=\frac13du$.


    $$

    \frac13\int u^{-1/2}\,du

    =

    \frac13\cdot2u^{1/2}+C

    =

    \frac23\sqrt{u}+C

    $$


    Substitute back to get $\frac23\sqrt{x^3+8}+C$.


    Related topic: Radical U-Substitution with Cubic Inner Functions

    '
- id: q016
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int \frac{\cos(\sqrt{x})}{\sqrt{x}}\,dx

    $$

    '
  answer:
    expectedLatex: 2\sin(\sqrt{x})+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=\sqrt{x}$. Then $x=u^2$, so $dx=2u\,du$.


    $$

    \int \frac{\cos(\sqrt{x})}{\sqrt{x}}\,dx

    =

    \int \frac{\cos u}{u}(2u\,du)

    =

    2\int\cos u\,du

    =

    2\sin u+C

    $$


    Substitute back to get $2\sin(\sqrt{x})+C$.


    Related topic: U-Substitution with Square-Root Inner Functions

    '
- id: q017
  type: symbolicResponse
  prompt: 'Evaluate the indefinite integral.


    $$

    \int \frac{x+1}{(x^2+2x+5)^3}\,dx

    $$

    '
  answer:
    expectedLatex: -\frac{1}{4(x^2+2x+5)^2}+C
    equivalenceMode: derivative
    tolerance: 0
    variables:
    - x
  explanation: 'Let $u=x^2+2x+5$. Then $du=(2x+2)\,dx=2(x+1)\,dx$, so $(x+1)\,dx=\frac12du$.


    $$

    \frac12\int u^{-3}\,du

    =

    \frac12\left(\frac{u^{-2}}{-2}\right)+C

    =

    -\frac{1}{4u^2}+C

    $$


    Substitute back to get $-\frac{1}{4(x^2+2x+5)^2}+C$.


    Related topic: U-Substitution with Shifted Quadratics

    '
