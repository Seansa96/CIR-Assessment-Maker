items:
  - id: r-prob-vector-def
    type: flashcard
    prompt: |
      What two properties define a probability vector?
    answer:
      expected: 'Its entries must be non-negative, and the sum of its entries must equal exactly 1.'

  - id: r-stochastic-matrix-def
    type: flashcard
    prompt: |
      What defines a stochastic matrix?
    answer:
      expected: 'It is a square matrix whose columns are probability vectors (each column sums to 1).'

  - id: r-steady-state-equation
    type: flashcard
    prompt: |
      What is the defining matrix equation for a steady-state vector $\vec{q}$ under transition matrix $P$?
    answer:
      expected: '$P\vec{q} = \vec{q}$'

  - id: r-pagerank-eigenvalue
    type: cloze
    prompt: |
      The PageRank vector is mathematically defined as the steady-state vector of the web's transition matrix, which makes it an eigenvector corresponding to the eigenvalue $\lambda =$ {{1}}.
    answer:
      expected: '1'

  - id: r-pca-matrix
    type: flashcard
    prompt: |
      In Principal Component Analysis (PCA), which specific matrix is diagonalized to find the principal components?
    answer:
      expected: 'The covariance matrix of the data.'

  - id: r-pca-eigenvalue-choice
    type: flashcard
    prompt: |
      When reducing dimensions using PCA, how do you decide which eigenvectors to keep?
    answer:
      expected: 'You keep the eigenvectors corresponding to the largest eigenvalues (as they capture the most variance/information).'
