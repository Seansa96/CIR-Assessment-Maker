schemaVersion: 1
id: chemistry-electrochemistry-easy-quiz-s2c
title: Electrochemistry Easy Quiz
assessmentType: quiz
categoryId: chemistry
topicId: chemistry-electrochemistry
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [chemistry, electrochemistry, easy] }
authoring: { visualRequirement: required, visualRationale: 'A cell diagram supports electrode and flow interpretation.', difficultyTier: easy, sourceId: src-20260720035703-91ea51b0d8 }
questions:
  - id: q1
    type: multipleChoice
    prompt: 'At which electrode does $Zn(s)\rightarrow Zn^{2+}+2e^-$ occur?'
    choices: [{ id: a, text: anode, issueSignals: [] }, { id: b, text: cathode, issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }] }, { id: c, text: salt bridge, issueSignals: [{ id: chemistry-electrochem-cell-notation-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: The anode. Why it works: Zinc loses electrons, and oxidation defines the anode. Why the other choices fail: Reduction occurs at the cathode; a salt bridge is not an electrode.'
    difficultyDimensions: [conceptIdentification, directionReasoning]
    difficultyEvidence: 'Identifies the oxidation site from an explicit electron-producing half-reaction.'
    issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }, { id: chemistry-electrochem-cell-notation-error }]
  - id: q2
    type: multipleChoice
    prompt: 'In the pictured galvanic cell, electrons move through the wire in which direction?'
    media: [{ type: image, src: /media/chemistry/electrochemistry-galvanic-cell.svg, alt: Zinc anode at left and copper cathode at right with an external wire., caption: Use the electrode reactions to determine flow. }]
    choices: [{ id: a, text: 'from zinc anode to copper cathode', issueSignals: [] }, { id: b, text: 'from copper cathode to zinc anode', issueSignals: [{ id: chemistry-electrochem-flow-direction-reversed }] }, { id: c, text: 'through the salt bridge from zinc to copper', issueSignals: [{ id: chemistry-electrochem-flow-direction-reversed }] }]
    answer: { choiceId: a }
    explanation: 'Solution: Electrons flow from zinc anode to copper cathode. Why it works: Oxidation releases electrons at zinc and reduction consumes them at copper. Why the other choices fail: b reverses source and sink; c confuses electron flow in the wire with ion migration.'
    difficultyDimensions: [diagramInterpretation, directionReasoning]
    difficultyEvidence: 'Combines a visual electrode assignment with external-circuit flow.'
    issueSignals: [{ id: chemistry-electrochem-flow-direction-reversed }]
  - id: q3
    type: multipleChoice
    prompt: 'For $Mg(s)+2Ag^+(aq)\rightarrow Mg^{2+}(aq)+2Ag(s)$, which reactant is the oxidizing agent?'
    choices: [{ id: a, text: '$Ag^+$', issueSignals: [] }, { id: b, text: Mg, issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }] }, { id: c, text: Ag, issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }] }]
    answer: { choiceId: a }
    explanation: 'Solution: $Ag^+$ is the oxidizing agent. Why it works: It gains electrons and is reduced to Ag while causing Mg to oxidize. Why the other choices fail: Mg is the reducing agent; Ag is a product, not a reactant agent.'
    difficultyDimensions: [oxidationState, roleClassification]
    difficultyEvidence: 'Tracks oxidation-number changes and converts them into agent roles.'
    issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }]
  - id: q4
    type: numericResponse
    prompt: 'A galvanic cell uses $Ag^+/Ag$, $E^\circ_{red}=+0.80\ \mathrm{V}$, as cathode and $Ni^{2+}/Ni$, $E^\circ_{red}=-0.25\ \mathrm{V}$, as anode. Find $E^\circ_{cell}$ in volts.'
    answer: { value: 1.05, tolerance: 0.001 }
    explanation: 'Solution: $E^\circ_{cell}=0.80-(-0.25)=1.05\ \mathrm{V}$. Why it works: Subtract the anode reduction potential from the cathode reduction potential.'
    difficultyDimensions: [formulaSelection, signConvention]
    difficultyEvidence: 'Applies cathode-minus-anode while subtracting a negative value.'
    issueSignals: [{ id: chemistry-electrochem-potential-calculation-error }]
  - id: q5
    type: multipleChoice
    prompt: 'A reduction half-reaction is multiplied by 2 to balance electrons. What happens to its listed $E^\circ_{red}$?'
    choices: [{ id: a, text: 'It stays unchanged.', issueSignals: [] }, { id: b, text: 'It doubles.', issueSignals: [{ id: chemistry-electrochem-potential-calculation-error }] }, { id: c, text: 'It is divided by 2.', issueSignals: [{ id: chemistry-electrochem-potential-calculation-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: It stays unchanged. Why it works: Potential is an intensive property and does not scale with reaction amount. Why the other choices fail: b and c incorrectly treat voltage as an extensive quantity.'
    difficultyDimensions: [intensiveProperty, coefficientReasoning]
    difficultyEvidence: 'Separates equation balancing from potential scaling.'
    issueSignals: [{ id: chemistry-electrochem-potential-calculation-error }]
  - id: q6
    type: multipleChoice
    prompt: 'In $Zn(s)|Zn^{2+}(aq)||Cu^{2+}(aq)|Cu(s)$, what does the double vertical line represent?'
    choices: [{ id: a, text: 'the salt bridge or porous ionic junction', issueSignals: [] }, { id: b, text: 'a phase boundary within one half-cell', issueSignals: [{ id: chemistry-electrochem-cell-notation-error }] }, { id: c, text: 'the external electron-carrying wire', issueSignals: [{ id: chemistry-electrochem-cell-notation-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: It represents the salt bridge or ionic junction. Why it works: Conventional notation separates half-cells with a double line. Why the other choices fail: b is shown by a single line; c is not represented by the double bar.'
    difficultyDimensions: [notationReading, phaseBoundary]
    difficultyEvidence: 'Maps a symbolic separator to the physical cell component.'
    issueSignals: [{ id: chemistry-electrochem-cell-notation-error }]
  - id: q7
    type: multipleChoice
    prompt: 'At 25 C, a cell has $Q=0.010$ and $n=2$. Compared with $E^\circ$, the Nernst equation predicts E is'
    choices: [{ id: a, text: 'greater than $E^\circ$', issueSignals: [] }, { id: b, text: 'less than $E^\circ$', issueSignals: [{ id: chemistry-electrochem-nernst-direction-error }] }, { id: c, text: 'equal to $E^\circ$', issueSignals: [{ id: chemistry-electrochem-nernst-direction-error }] }]
    answer: { choiceId: a }
    explanation: 'Solution: E is greater than $E^\circ$. Why it works: $\log(0.010)=-2$, so subtracting the Nernst term adds about 0.059 V. Why the other choices fail: b reverses the sign effect; c applies only when Q=1.'
    difficultyDimensions: [quotientTrend, potentialDirection]
    difficultyEvidence: 'Uses the sign of a logarithm to predict a potential change.'
    issueSignals: [{ id: chemistry-electrochem-nernst-direction-error }]
  - id: q8
    type: numericResponse
    prompt: 'A current of $1.50\ \mathrm{A}$ flows for $4.00\ \mathrm{min}$. Calculate charge in coulombs.'
    answer: { value: 360, tolerance: 0.5 }
    explanation: 'Solution: $t=4.00(60)=240\ \mathrm{s}$ and $q=It=(1.50)(240)=360\ \mathrm{C}$. Why it works: An ampere is one coulomb per second.'
    difficultyDimensions: [unitConversion, quantitativeReasoning]
    difficultyEvidence: 'Converts minutes to seconds before applying current-times-time.'
    issueSignals: [{ id: chemistry-electrochem-faraday-stoichiometry-error }]
  - id: q9
    type: multipleChoice
    prompt: 'Which statement distinguishes an electrolytic cell from a galvanic cell during normal operation?'
    choices: [{ id: a, text: 'An electrolytic cell requires external electrical energy to drive a nonspontaneous reaction.', issueSignals: [] }, { id: b, text: 'Reduction occurs at the anode only in an electrolytic cell.', issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }] }, { id: c, text: 'Electrons are not transferred in an electrolytic cell.', issueSignals: [{ id: chemistry-electrochem-oxidation-reduction-reversed }] }]
    answer: { choiceId: a }
    explanation: 'Solution: An electrolytic cell requires external electrical energy. Why it works: The source drives a nonspontaneous redox direction. Why the other choices fail: b violates the electrode definitions; c denies the redox process.'
    difficultyDimensions: [cellComparison, energyDirection]
    difficultyEvidence: 'Distinguishes energy conversion while preserving electrode definitions.'
    issueSignals: [{ id: chemistry-electrochem-anode-cathode-confusion }, { id: chemistry-electrochem-oxidation-reduction-reversed }]
  - id: q10
    type: selectAll
    prompt: 'Select all functions of a salt bridge in a working galvanic cell.'
    choices: [{ id: a, text: 'permits ion migration between half-cells', issueSignals: [] }, { id: b, text: 'helps maintain electrical neutrality', issueSignals: [] }, { id: c, text: 'carries electrons through solution', issueSignals: [{ id: chemistry-electrochem-flow-direction-reversed }] }, { id: d, text: 'sets the tabulated reduction potentials', issueSignals: [{ id: chemistry-electrochem-potential-calculation-error }] }]
    answer: { choiceIds: [a, b] }
    explanation: 'Solution: Select a and b. Why it works: Mobile ions complete the internal circuit and prevent charge buildup. Why the other choices fail: c assigns wire-based electron flow to the bridge; d confuses a circuit component with an electrode property.'
    difficultyDimensions: [multiConditionReasoning, ionMigration]
    difficultyEvidence: 'Separates two related ionic functions from electron-flow and potential distractors.'
    issueSignals: [{ id: chemistry-electrochem-flow-direction-reversed }, { id: chemistry-electrochem-potential-calculation-error }]
