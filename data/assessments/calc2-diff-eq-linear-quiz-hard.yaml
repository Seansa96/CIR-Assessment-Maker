title: First-Order Linear Equations Quiz — Hard
assessmentType: quiz
categoryId: calculus-2
topicId: diff-eq-linear
modeDefault: practice
randomizeQuestions: true
skills: [find integrating factors, solve linear IVPs, model changing-volume mixtures]
navigation: { learningGoal: practice, activityType: focusedPractice, tags: [calculus-2, first-order-linear, differential-equations] }
questions:
- id: q001
  type: symbolicResponse
  skills: [find integrating factors]
  prompt: Enter an integrating factor for $y'-(2/x)y=x^3$ on $x>0$.
  answer: { expectedLatex: 'x^(-2)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: 'On x greater than zero, the integrating factor simplifies to x raised to negative two.' }
- id: q002
  type: symbolicResponse
  skills: [solve linear IVPs]
  prompt: Solve $y'+2y=4$ with $y(0)=1$.
  answer: { expectedLatex: '2-e^(-2x)', equivalenceMode: expression, tolerance: 0.000001, variables: [x], explanation: 'The constant particular solution is 2; the initial difference decays exponentially.' }
- id: q003
  type: numericResponse
  skills: [solve linear IVPs]
  prompt: For $y'+2y=4$, $y(0)=1$, find $y(1)$.
  answer: { value: 1.864665, tolerance: 0.019 }
  explanation: Substitute $x=1$ into $y=2-e^{-2x}$.
- id: q004
  type: symbolicResponse
  skills: [model changing-volume mixtures]
  prompt: A tank begins with 100 gal. Inflow is 2 gal/min and outflow is 3 gal/min. Enter $V(t)$.
  answer: { expectedLatex: '100-t', equivalenceMode: expression, tolerance: 0.000001, variables: [t], explanation: Net volume change is $2-3=-1$ gal/min. }
- id: q005
  type: numericResponse
  skills: [model changing-volume mixtures]
  prompt: In that tank, at what time in minutes does the volume reach 70 gal?
  answer: { value: 30, tolerance: 0.001 }
  explanation: Solve $100-t=70$.
