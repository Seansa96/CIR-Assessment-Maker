questions:
- id: q001
  type: multipleChoice
  prompt: 'You are reading a theorem: ''If a group $G$ is cyclic, then $G$ is abelian''. You notice that the group
    of symmetries of a square is abelian but NOT cyclic. What does this example demonstrate?'
  choices:
  - id: a
    text: It demonstrates that the converse of the theorem is false.
  - id: b
    text: It is a counterexample that disproves the theorem.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: It proves that the theorem is only vacuously true.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: It is an irrelevant example because it does not satisfy the hypothesis.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - logicalEquivalence
  difficultyEvidence: Evaluates an example against a conditional statement to deduce that it falsifies the converse,
    not the direct statement.
  explanation: 'Solution: It demonstrates that the converse of the theorem is false.

    Why it works: The theorem is $P \\implies Q$ (cyclic $\\implies$ abelian). The example has $Q$ true (abelian)
    but $P$ false (not cyclic). This shows that $Q \\implies P$ (the converse) is false.

    Why the other choices fail: B incorrectly labels it a counterexample to the theorem (which requires $P$ true
    and $Q$ false). C misuses the term vacuously true. D misses the fact that such examples are highly relevant
    for understanding the strictness of the implication direction.'
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
- id: q002
  type: multipleChoice
  prompt: Why can a mathematical definition never be proven false?
  choices:
  - id: a
    text: Because it does not assert a truth; it merely establishes a convention for naming objects that meet certain
      conditions.
  - id: b
    text: Because definitions are chosen by consensus to be universally true axioms.
    issueSignals:
    - id: mathematical-role-confusion
  - id: c
    text: Because definitions are derived from self-evident physical laws.
    issueSignals:
    - id: mathematical-role-confusion
  - id: d
    text: Because any attempt to disprove a definition would result in a logical paradox.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-role-confusion
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Distinguishes the epistemological status of definitions (conventions) from propositions (truth-bearers).
  explanation: 'Solution: Because it does not assert a truth; it merely establishes a convention for naming objects
    that meet certain conditions.

    Why it works: A definition is a linguistic shortcut. ''Let $X$ mean $Y$'' cannot be false; it is an assignment
    of meaning. Only statements that claim relationships *between* defined terms can be true or false.

    Why the other choices fail: B confuses definitions with axioms (which are assumed truths about undefined terms).
    C relies on physical laws, which is irrelevant to pure mathematics. D is pseudomathematical nonsense.'
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
- id: q003
  type: multipleChoice
  prompt: 'Read the following sentence carefully: ''An integer $p > 1$ is prime if its only positive divisors are
    $1$ and $p$.'' Logically, what connective does the word ''if'' represent in a formal definition?'
  choices:
  - id: a
    text: It represents 'if and only if' ($\iff$), because definitions establish exact equivalence.
  - id: b
    text: It represents a standard implication ($\implies$), meaning other numbers might also be called prime.
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: It represents the converse implication ($\impliedby$).
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: It represents logical AND ($\land$).
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - logicalEquivalence
  - conventionRecognition
  difficultyEvidence: Recognizes the standard mathematical convention that 'if' means 'if and only if' when introducing
    a definition.
  explanation: 'Solution: It represents ''if and only if'' ($\\iff$), because definitions establish exact equivalence.

    Why it works: By convention in mathematical writing, the word ''if'' inside a definition is understood as ''if
    and only if''. The defined term and the defining conditions are perfectly interchangeable.

    Why the other choices fail: B and C treat it as a one-way implication, which would allow objects failing the
    conditions to still be called ''prime'', destroying the purpose of a definition. D is grammatically and logically
    incorrect.'
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
- id: q004
  type: multipleChoice
  prompt: 'A text states: ''Theorem: The sum of two continuous functions is continuous.'' What is the hidden hypothesis
    in this loosely stated theorem?'
  choices:
  - id: a
    text: The two functions must share the same domain.
  - id: b
    text: The functions must be differentiable.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: c
    text: The sum must evaluate to a positive number.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: The functions must be defined as polynomials.
    issueSignals:
    - id: mathematical-structure-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - representationTransfer
  - conditionChecking
  - argumentMapping
  difficultyEvidence: Identifies unstated domain alignment requirements necessary for mathematical operations in
    theorem statements.
  explanation: 'Solution: The two functions must share the same domain.

    Why it works: To add two functions $f$ and $g$ to create $(f+g)(x) = f(x) + g(x)$, the input $x$ must be valid
    for both functions simultaneously. Therefore, they must have intersecting domains, usually assumed to be the
    same domain in shorthand contexts.

    Why the other choices fail: B adds an unnecessary, stronger condition (differentiability). C is an arbitrary
    restriction on the range. D restricts the type of function arbitrarily when the theorem applies broadly.'
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
- id: q005
  type: multipleChoice
  prompt: Which condition is sufficient by definition to conclude that 21 is odd?
  choices:
  - id: a
    text: $21=2(10)+1$ with 10 an integer.
  - id: b
    text: 21 is greater than 2.
    issueSignals:
    - id: magnitude-for-definition-substituted
  - id: c
    text: 21 has three positive divisors.
    issueSignals:
    - id: unrelated-number-property-used
  - id: d
    text: 21 is not divisible by 2.5.
    issueSignals:
    - id: noninteger-divisibility-condition
  answer:
    choiceId: a
  issueSignals:
  - id: magnitude-for-definition-substituted
  difficultyDimensions:
  - definitionApplication
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Selects the exact existential representation required by the odd-integer definition over superficially
    true numerical facts.
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
  explanation: 'Solution: $21=2(10)+1$ has the required form.

    Why it works: The odd definition requires twice an integer plus one.

    Why the other choices fail: B and C do not state the defining form, while D uses a noninteger divisor unrelated
    to parity.'
- id: q006
  type: multipleChoice
  prompt: By the definition of divisibility, which equation shows that 5 divides 35?
  choices:
  - id: a
    text: $35=5(7)$ for the integer 7.
  - id: b
    text: $35/5=7$.
    issueSignals:
    - id: fraction-for-divisibility-definition
  - id: c
    text: $5<35$.
    issueSignals:
    - id: order-for-divisibility-substituted
  - id: d
    text: 5 and 35 are both odd.
    issueSignals:
    - id: parity-for-divisibility-substituted
  answer:
    choiceId: a
  issueSignals:
  - id: fraction-for-divisibility-definition
  difficultyDimensions:
  - definitionApplication
  - representationTransfer
  - errorDiagnosis
  difficultyEvidence: Uses the required integer-multiplier equation instead of equivalent-looking arithmetic notation or unrelated properties.
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
  explanation: |-
    Solution: $35=5(7)$ gives the required integer multiplier.
    Why it works: $a\mid b$ means $b=ac$ for some integer c.
    Why the other choices fail: B is a quotient notation, C only compares size, and D describes parity rather than divisibility.
- id: q007
  type: multipleChoice
  prompt: Which number is composite by the stated prime/composite definitions?
  choices:
  - id: a
    text: 21, because its positive divisors include 1, 3, 7, and 21.
  - id: b
    text: 13, because it has the divisors 1 and 13.
    issueSignals:
    - id: prime-composite-confused
  - id: c
    text: 1, because it has one positive divisor.
    issueSignals:
    - id: one-classified-as-composite
  - id: d
    text: 2, because it is even.
    issueSignals:
    - id: even-for-composite-substituted
  answer:
    choiceId: a
  issueSignals:
  - id: prime-composite-confused
  difficultyDimensions:
  - definitionApplication
  - errorDiagnosis
  - counterexampleOrConstruction
  difficultyEvidence: Checks the divisor-count condition and rejects common category shortcuts involving 1, evenness, and two-divisor numbers.
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
  explanation: |-
    Solution: 21 is composite because it has positive divisors beyond 1 and itself.
    Why it works: A composite integer greater than 1 has more than two positive divisors.
    Why the other choices fail: 13 and 2 are prime, while 1 is neither prime nor composite.
- id: q008
  type: multipleChoice
  prompt: Which statement correctly identifies the greatest common divisor of 18 and 24?
  choices:
  - id: a
    text: It is 6, the largest positive integer dividing both 18 and 24.
  - id: b
    text: It is 72, because 18 times 24 is a common multiple.
    issueSignals:
    - id: gcd-lcm-confused
  - id: c
    text: It is 3, because 3 is the smallest prime divisor of both.
    issueSignals:
    - id: greatest-condition-ignored
  - id: d
    text: It is 42, because 18 plus 24 is their shared total.
    issueSignals:
    - id: arithmetic-for-gcd-substituted
  answer:
    choiceId: a
  issueSignals:
  - id: gcd-lcm-confused
  difficultyDimensions:
  - definitionApplication
  - errorDiagnosis
  - parameterThreshold
  difficultyEvidence: Tests common-divisor status and the greatest requirement while distinguishing a divisor from a multiple.
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
  explanation: |-
    Solution: 6 divides both numbers and no larger common divisor does.
    Why it works: The gcd is defined as the greatest positive common divisor.
    Why the other choices fail: B is a multiple, C is not greatest, and D is an unrelated sum.
- id: q009
  type: multipleChoice
  prompt: Which statement correctly gives the least common multiple of 6 and 8?
  choices:
  - id: a
    text: It is 24, the smallest positive integer divisible by both 6 and 8.
  - id: b
    text: It is 2, the greatest positive integer dividing both 6 and 8.
    issueSignals:
    - id: lcm-gcd-confused
  - id: c
    text: It is 48, because every product of the two numbers is least.
    issueSignals:
    - id: least-condition-ignored
  - id: d
    text: It is 14, because 6 plus 8 combines both numbers.
    issueSignals:
    - id: arithmetic-for-lcm-substituted
  answer:
    choiceId: a
  issueSignals:
  - id: lcm-gcd-confused
  difficultyDimensions:
  - definitionApplication
  - parameterThreshold
  - errorDiagnosis
  difficultyEvidence: Applies the least positive common-multiple condition while separating it from a gcd, arbitrary product, and sum.
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
  explanation: |-
    Solution: 24 is the least positive common multiple of 6 and 8.
    Why it works: Both 6 and 8 divide 24, and no smaller positive number has both divisibility properties.
    Why the other choices fail: B is the gcd, C is a common multiple but not least, and D is only a sum.
- id: q010
  type: multipleChoice
  prompt: If a and b are odd integers, which form proves that a+b is even?
  choices:
  - id: a
    text: $a+b=2m+1+2n+1=2(m+n+1)$ for integers m and n.
  - id: b
    text: $a+b=2m+2n+1$, so it has the odd form.
    issueSignals:
    - id: constant-term-combination-error
  - id: c
    text: a+b is even because odd plus odd is a familiar pattern.
    issueSignals:
    - id: pattern-for-definition-proof-substituted
  - id: d
    text: $a+b=(m+n)+1$, so it is divisible by 2.
    issueSignals:
    - id: factor-of-two-dropped
  answer:
    choiceId: a
  issueSignals:
  - id: constant-term-combination-error
  difficultyDimensions:
  - definitionApplication
  - proofJustification
  - errorDiagnosis
  difficultyEvidence: Builds an even-form witness from two odd-form witnesses and checks the integer closure needed by the definition.
  prerequisiteObjectiveIds:
  - ml-quantifiers-02
  explanation: |-
    Solution: $a+b=2(m+n+1)$ is twice an integer.
    Why it works: The sum $m+n+1$ is an integer, so the result has the defining even form.
    Why the other choices fail: B mishandles the two ones, C states a pattern without the requested definition proof, and D drops the factor 2.
