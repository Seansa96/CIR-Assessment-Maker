questions:
- id: q001
  type: multipleChoice
  prompt: 'You are reading a theorem: ''If a group $G$ is cyclic, then $G$ is abelian''. You notice that the group
    of symmetries of a square is abelian but NOT cyclic. What does this example demonstrate?'
  choices:
  - id: a
    text: It demonstrates that the converse of the theorem is false.
  - id: b
    text: It is a counterexample that disproves the theorem.
    issueSignals:
    - id: logical-evaluation-error
  - id: c
    text: It proves that the theorem is only vacuously true.
    issueSignals:
    - id: logical-evaluation-error
  - id: d
    text: It is an irrelevant example because it does not satisfy the hypothesis.
    issueSignals:
    - id: logical-evaluation-error
  answer:
    choiceId: a
  issueSignals:
  - id: logical-evaluation-error
  difficultyDimensions:
  - errorDiagnosis
  - representationTransfer
  - logicalEquivalence
  difficultyEvidence: Evaluates an example against a conditional statement to deduce that it falsifies the converse,
    not the direct statement.
  explanation: |-
    Solution: It demonstrates that the converse of the theorem is false.
    Why it works: The theorem is $P \\implies Q$ (cyclic $\\implies$ abelian). The example has $Q$ true (abelian) but $P$ false (not cyclic). This shows that $Q \\implies P$ (the converse) is false.
    Why the other choices fail: B incorrectly labels it a counterexample to the theorem (which requires $P$ true and $Q$ false). C misuses the term vacuously true. D misses the fact that such examples are highly relevant for understanding the strictness of the implication direction.
- id: q002
  type: multipleChoice
  prompt: Why can a mathematical definition never be proven false?
  choices:
  - id: a
    text: Because it does not assert a truth; it merely establishes a convention for naming objects that meet certain
      conditions.
  - id: b
    text: Because definitions are chosen by consensus to be universally true axioms.
    issueSignals:
    - id: mathematical-role-confusion
  - id: c
    text: Because definitions are derived from self-evident physical laws.
    issueSignals:
    - id: mathematical-role-confusion
  - id: d
    text: Because any attempt to disprove a definition would result in a logical paradox.
    issueSignals:
    - id: mathematical-role-confusion
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-role-confusion
  difficultyDimensions:
  - conceptualUnderstanding
  - errorDiagnosis
  difficultyEvidence: Distinguishes the epistemological status of definitions (conventions) from propositions (truth-bearers).
  explanation: |-
    Solution: Because it does not assert a truth; it merely establishes a convention for naming objects that meet certain conditions.
    Why it works: A definition is a linguistic shortcut. 'Let $X$ mean $Y$' cannot be false; it is an assignment of meaning. Only statements that claim relationships *between* defined terms can be true or false.
    Why the other choices fail: B confuses definitions with axioms (which are assumed truths about undefined terms). C relies on physical laws, which is irrelevant to pure mathematics. D is pseudomathematical nonsense.
- id: q003
  type: multipleChoice
  prompt: 'Read the following sentence carefully: ''An integer $p > 1$ is prime if its only positive divisors are
    $1$ and $p$.'' Logically, what connective does the word ''if'' represent in a formal definition?'
  choices:
  - id: a
    text: 'It represents ''if and only if'' ($\iff$), because definitions establish exact equivalence.'
  - id: b
    text: 'It represents a standard implication ($\implies$), meaning other numbers might also be called prime.'
    issueSignals:
    - id: mathematical-translation-error
  - id: c
    text: 'It represents the converse implication ($\impliedby$).'
    issueSignals:
    - id: mathematical-translation-error
  - id: d
    text: 'It represents logical AND ($\land$).'
    issueSignals:
    - id: mathematical-translation-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-translation-error
  difficultyDimensions:
  - representationTransfer
  - logicalEquivalence
  - conventionRecognition
  difficultyEvidence: Recognizes the standard mathematical convention that 'if' means 'if and only if' when introducing
    a definition.
  explanation: |-
    Solution: It represents 'if and only if' ($\\iff$), because definitions establish exact equivalence.
    Why it works: By convention in mathematical writing, the word 'if' inside a definition is understood as 'if and only if'. The defined term and the defining conditions are perfectly interchangeable.
    Why the other choices fail: B and C treat it as a one-way implication, which would allow objects failing the conditions to still be called 'prime', destroying the purpose of a definition. D is grammatically and logically incorrect.
- id: q004
  type: multipleChoice
  prompt: 'A text states: ''Theorem: The sum of two continuous functions is continuous.'' What is the hidden hypothesis
    in this loosely stated theorem?'
  choices:
  - id: a
    text: The two functions must share the same domain.
  - id: b
    text: The functions must be differentiable.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: c
    text: The sum must evaluate to a positive number.
    issueSignals:
    - id: mathematical-structure-recognition-error
  - id: d
    text: The functions must be defined as polynomials.
    issueSignals:
    - id: mathematical-structure-recognition-error
  answer:
    choiceId: a
  issueSignals:
  - id: mathematical-structure-recognition-error
  difficultyDimensions:
  - domainCondition
  - errorDiagnosis
  difficultyEvidence: Identifies unstated domain alignment requirements necessary for mathematical operations in
    theorem statements.
  explanation: |-
    Solution: The two functions must share the same domain.
    Why it works: To add two functions $f$ and $g$ to create $(f+g)(x) = f(x) + g(x)$, the input $x$ must be valid for both functions simultaneously. Therefore, they must have intersecting domains, usually assumed to be the same domain in shorthand contexts.
    Why the other choices fail: B adds an unnecessary, stronger condition (differentiability). C is an arbitrary restriction on the range. D restricts the type of function arbitrarily when the theorem applies broadly.
