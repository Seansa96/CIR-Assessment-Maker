    title: Continue the method
    required: true
    content: 'Next, evaluate slopes: What are the slopes at $(1,2)$? Here the target is 2 and 4. Compare this result with the diagram or stated constraints, then continue with assemble plane. The final conclusion, $z-5=2(x-1)+4(y-2)$, should answer the original question in the requested form rather than merely display an unlabelled calculation.'
