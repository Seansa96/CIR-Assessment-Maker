  - id: s04
    title: Worked micro-example
    required: true
    content: 'Use the short task Find the tangent plane to $z=x^2+y^2$ at $(1,2,5)$. as a model. First, find partials: What are $f_x$ and $f_y$? The resulting statement is $2x$ and $2y$. This identifies the governing relation and gives a checkable intermediate result.'
