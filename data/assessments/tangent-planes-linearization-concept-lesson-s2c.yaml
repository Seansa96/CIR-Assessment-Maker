    - type: image
      src: /media/calculus-3/tangent-planes.svg
      alt: Original tangent planes and linearization reference visual.
      caption: 
    check:
      id: check-01
      type: multipleChoice
      prompt: What object approximates a differentiable surface locally?
      choices:
      - id: a
        text: tangent plane
        media: []
        issueSignals: []
      - id: b
        text: f(a,b) (answers 'What is L(a,b)?', not 'What object approximates a differentiable surface locally?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: c
        text: fx(a,b) (answers 'What appears with x-a in a linearization?', not 'What object approximates a differentiable surface locally?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
      - id: d
        text: fy(a,b) (answers 'What appears with y-b?', not 'What object approximates a differentiable surface locally?')
        media: []
        issueSignals:
        - id: algebraic-simplification-error
          domains: []
