title: Charging an RC Circuit
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-dc-circuits
workedExamples:
- id: we2
  title: Time Constant and Charge
  prompt: An uncharged $5.0\text{ }\mu\text{F}$ capacitor is connected in series with
    a $1.0\text{ M}\Omega$ resistor and a $12\text{ V}$ battery. What is the charge
    on the capacitor after $5.0\text{ s}$?
  steps:
  - id: s1
    prompt: Calculate the time constant.
    explanation: 'Solution:

      1) $\tau = RC = (1.0 \times 10^6)(5.0 \times 10^{-6}) = 5.0\text{ s}$.


      Why it works:

      The time constant governs the rate at which the capacitor charges or discharges.'
  - id: s2
    prompt: Calculate the charge.
    explanation: 'Solution:

      1) Max charge $Q_0 = C\mathcal{E} = (5.0 \times 10^{-6})(12) = 60\text{ }\mu\text{C}$.

      2) Evaluate at $t = \tau$: $q(\tau) = Q_0 (1 - e^{-1})$.

      3) $q = 60 (1 - 0.368) = 60(0.632) \approx 37.9\text{ }\mu\text{C}$.


      Why it works:

      After one time constant, the capacitor is charged to approximately 63.2% of
      its maximum capacity.'
