workedExamples:
  - id: we-series-extension
    title: Distributing the Stretch
    problem: |
      When two springs are connected in series and pulled, how does the total stretch distribute between them?
    steps:
      - id: step-1
        title: Step 1 — Common Force
        instruction: |
          Two springs with constants $k_1$ and $k_2$ are connected in series. A total force $F$ is applied to the ends.
        type: multipleChoice
        prompt: |
          What is the tension force $F_1$ felt by the first spring compared to the total applied force $F$?
        choices:
          - id: a
            text: '$F_1 = F$'
          - id: b
            text: '$F_1 = F / 2$'
          - id: c
            text: '$F_1 = F - F_2$'
        answer:
          choiceId: a
        explanation: 'In series, the tension is uniform. Every spring in the chain feels the full applied force $F$.'
      - id: step-2
        title: Step 2 — Individual Stretch
        instruction: |
          Knowing that the first spring feels the full force $F$, we can find its individual stretch $x_1$.
        type: symbolicResponse
        prompt: |
          Using Hooke's Law ($F = k_1 x_1$), solve for $x_1$.
        answer:
          gradingMode: auto
          expectedLatex: F / k_1
          equivalenceMode: expression
          tolerance: 0
        explanation: 'The stretch is $x_1 = F / k_1$. This means the softer spring (smaller $k$) will stretch more than the stiffer spring in a series chain!'
