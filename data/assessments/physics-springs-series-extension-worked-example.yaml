navigation: { learningGoal: learn, activityType: guidedWorkedExample, tags: [physics-1, physics-work-energy] }
modeDefault: practice
randomizeQuestions: false
workedExamples:
  - id: we-series-symbolic
    title: Series spring extensions
    problem: 'Two springs $k_1$ and $k_2$ are pulled in series by a force $F$.'
    steps:
      - id: ses-1
        title: Common force
        instruction: 'The same tension acts through a massless series chain.'
        type: symbolicResponse
        prompt: 'Write the force in spring 1.'
        answer: { gradingMode: auto, expectedLatex: 'F', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $F_1=F$.\n\nWhy it works: Force is transmitted through both springs in series.'
      - id: ses-2
        title: Individual extension
        instruction: 'Use Hooke''s law for spring 1.'
        type: symbolicResponse
        prompt: 'Write $x_1$. '
        answer: { gradingMode: auto, expectedLatex: 'F/k_1', equivalenceMode: expression, tolerance: 0 }
        explanation: 'Solution: $x_1=F/k_1$.\n\nWhy it works: Rearranging $F=k_1x_1$ gives extension under the common force.'
  - id: we-series-numerical
    title: Numerical series extensions
    problem: 'Springs $k_1=100$ N/m and $k_2=200$ N/m are in series under $30$ N. Find the total extension.'
    steps:
      - id: sen-1
        title: Individual extensions
        instruction: 'Find both extensions before adding.'
        type: numericResponse
        prompt: 'What is $x_1$ in meters?'
        answer: { value: 0.3, tolerance: 0.001 }
        explanation: 'Solution: $x_1=30/100=0.30$ m.\n\nWhy it works: Each series spring carries the full $30$ N force.'
      - id: sen-2
        title: Add extensions
        instruction: 'Use $x_{total}=x_1+x_2$.'
        type: numericResponse
        prompt: 'What is the total extension in meters?'
        answer: { value: 0.45, tolerance: 0.001 }
        explanation: 'Solution: $x_2=30/200=0.15$ m, so $x_{total}=0.30+0.15=0.45$ m.\n\nWhy it works: Series extensions add along the force path.'
