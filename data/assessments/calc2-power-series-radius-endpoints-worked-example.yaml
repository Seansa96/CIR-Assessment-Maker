workedExamples:
  - id: power-series-radius-endpoints-main
    title: From Ratio Test to Full Interval
    problem: |
      Find the radius and interval of convergence for power series. The focus is on the workflow:

      1. Use the Ratio Test to find the open interval.
      2. Translate the inequality around the center.
      3. Test endpoints separately.

      ![Power series interval map showing center, radius, and endpoints as separate tests](/assessments/calc2-infinite-series/power-series-radius-endpoints-map.svg)
    steps:
      - id: power-series-step-001
        title: Identify the center
        instruction: |
          Consider:

          $$
          \sum_{n=1}^{\infty}\frac{(x-3)^n}{n2^n}.
          $$

          This is centered at $3$ because the power is $(x-3)^n$.
        type: multipleChoice
        prompt: What is the center of this power series?
        choices:
          - id: a
            text: '$3$'
          - id: b
            text: '$2$'
          - id: c
            text: '$0$'
          - id: d
            text: '$n$'
        answer:
          choiceId: a
        explanation: |
          The center is the value that makes $x-3=0$.

      - id: power-series-step-002
        title: Set up the Ratio Test
        instruction: |
          Let:

          $$
          a_n=\frac{(x-3)^n}{n2^n}.
          $$

          The Ratio Test uses:

          $$
          L=\lim_{n\to\infty}\left|\frac{a_{n+1}}{a_n}\right|.
          $$
        type: multipleChoice
        prompt: Why is the Ratio Test natural here?
        choices:
          - id: a
            text: The term contains powers depending on $n$.
          - id: b
            text: The series is definitely telescoping.
          - id: c
            text: The series has no variable.
          - id: d
            text: The terms do not approach zero for any $x$.
        answer:
          choiceId: a
        explanation: |
          Power series are usually handled by ratio or root tests to find the radius.

      - id: power-series-step-003
        title: Simplify the ratio
        instruction: |
          Compute:

          $$
          \left|\frac{(x-3)^{n+1}}{(n+1)2^{n+1}}\cdot\frac{n2^n}{(x-3)^n}\right|
          =
          \left|\frac{x-3}{2}\right|\frac{n}{n+1}.
          $$

          As $n\to\infty$, $\frac{n}{n+1}\to1$.
        type: multipleChoice
        prompt: What is the Ratio Test limit $L$?
        choices:
          - id: a
            text: '$\left|\frac{x-3}{2}\right|$'
          - id: b
            text: '$|x-3|$'
          - id: c
            text: '$\left|\frac{x}{3}\right|$'
          - id: d
            text: '$2|x-3|$'
        answer:
          choiceId: a
        explanation: |
          The factor $\frac{n}{n+1}$ approaches $1$, leaving $\left|\frac{x-3}{2}\right|$.

      - id: power-series-step-004
        title: Force convergence
        instruction: |
          The Ratio Test says the series converges when:

          $$
          \left|\frac{x-3}{2}\right|<1.
          $$

          This is equivalent to:

          $$
          |x-3|<2.
          $$
        type: multipleChoice
        prompt: What is the radius of convergence?
        choices:
          - id: a
            text: '$R=2$'
          - id: b
            text: '$R=3$'
          - id: c
            text: '$R=1$'
          - id: d
            text: '$R=\infty$'
        answer:
          choiceId: a
        explanation: |
          The series converges within $2$ units of the center $3$.

      - id: power-series-step-005
        title: Convert the inequality to an interval
        instruction: |
          From:

          $$
          |x-3|<2,
          $$

          write:

          $$
          -2<x-3<2.
          $$

          Add $3$:

          $$
          1<x<5.
          $$
        type: multipleChoice
        prompt: What is the open interval from the Ratio Test?
        choices:
          - id: a
            text: '$(1,5)$'
          - id: b
            text: '$(-2,2)$'
          - id: c
            text: '$(3,5)$'
          - id: d
            text: '$[1,5]$ automatically'
        answer:
          choiceId: a
        explanation: |
          The Ratio Test gives the open interval only. Endpoints still need testing.

      - id: power-series-step-006
        title: Test the left endpoint
        instruction: |
          Substitute $x=1$ into the original series:

          $$
          \sum_{n=1}^{\infty}\frac{(1-3)^n}{n2^n}
          =
          \sum_{n=1}^{\infty}\frac{(-2)^n}{n2^n}
          =
          \sum_{n=1}^{\infty}\frac{(-1)^n}{n}.
          $$

          This is an alternating harmonic series.
        type: multipleChoice
        prompt: What happens at $x=1$?
        choices:
          - id: a
            text: It converges conditionally.
          - id: b
            text: It diverges because it is harmonic with no alternating sign.
          - id: c
            text: It becomes geometric with ratio $2$.
          - id: d
            text: It is undefined.
        answer:
          choiceId: a
        explanation: |
          $\sum\frac{(-1)^n}{n}$ converges by the Alternating Series Test but not absolutely.

      - id: power-series-step-007
        title: Test the right endpoint
        instruction: |
          Substitute $x=5$:

          $$
          \sum_{n=1}^{\infty}\frac{(5-3)^n}{n2^n}
          =
          \sum_{n=1}^{\infty}\frac{2^n}{n2^n}
          =
          \sum_{n=1}^{\infty}\frac{1}{n}.
          $$

          This is the harmonic series.
        type: multipleChoice
        prompt: What happens at $x=5$?
        choices:
          - id: a
            text: It diverges.
          - id: b
            text: It converges absolutely.
          - id: c
            text: It converges conditionally.
          - id: d
            text: It becomes zero.
        answer:
          choiceId: a
        explanation: |
          The harmonic series diverges, so $x=5$ is excluded.

      - id: power-series-step-008
        title: State the final interval
        instruction: |
          The open interval is $(1,5)$.

          The left endpoint $1$ is included.

          The right endpoint $5$ is excluded.

          Final interval:

          $$
          [1,5).
          $$
        type: multipleChoice
        prompt: What is the interval of convergence?
        choices:
          - id: a
            text: '$[1,5)$'
          - id: b
            text: '$(1,5)$'
          - id: c
            text: '$[1,5]$'
          - id: d
            text: '$(1,5]$'
        answer:
          choiceId: a
        explanation: |
          Include $1$ because the alternating harmonic series converges. Exclude $5$ because the harmonic series diverges.

      - id: power-series-step-009
        title: Start a second example
        instruction: |
          Now consider:

          $$
          \sum_{n=1}^{\infty}\frac{n(x+2)^n}{5^n}.
          $$

          The center is $-2$.
        type: multipleChoice
        prompt: What is the center?
        choices:
          - id: a
            text: '$-2$'
          - id: b
            text: '$2$'
          - id: c
            text: '$5$'
          - id: d
            text: '$0$'
        answer:
          choiceId: a
        explanation: |
          The factor is $(x+2)^n=(x-(-2))^n$.

      - id: power-series-step-010
        title: Find the radius quickly
        instruction: |
          Ratio testing gives:

          $$
          L=\left|\frac{x+2}{5}\right|.
          $$

          So convergence requires:

          $$
          |x+2|<5.
          $$
        type: multipleChoice
        prompt: What is the radius of convergence?
        choices:
          - id: a
            text: '$R=5$'
          - id: b
            text: '$R=2$'
          - id: c
            text: '$R=7$'
          - id: d
            text: '$R=0$'
        answer:
          choiceId: a
        explanation: |
          The distance from the center is less than $5$.

      - id: power-series-step-011
        title: Compute endpoint candidates
        instruction: |
          From:

          $$
          |x+2|<5,
          $$

          the open interval is:

          $$
          -7<x<3.
          $$
        type: multipleChoice
        prompt: Which endpoints must be tested?
        choices:
          - id: a
            text: '$x=-7$ and $x=3$'
          - id: b
            text: '$x=-2$ and $x=5$'
          - id: c
            text: '$x=0$ and $x=5$'
          - id: d
            text: '$x=-5$ and $x=5$'
        answer:
          choiceId: a
        explanation: |
          The center is $-2$ and the radius is $5$, so the endpoints are $-2-5=-7$ and $-2+5=3$.

      - id: power-series-step-012
        title: Endpoint behavior for the second example
        instruction: |
          At $x=3$:

          $$
          \sum n
          $$

          diverges.

          At $x=-7$:

          $$
          \sum n(-1)^n
          $$

          also diverges because the terms do not approach zero.
        type: multipleChoice
        prompt: What is the final interval of convergence for $\sum\frac{n(x+2)^n}{5^n}$?
        choices:
          - id: a
            text: '$(-7,3)$'
          - id: b
            text: '$[-7,3]$'
          - id: c
            text: '$[-7,3)$'
          - id: d
            text: '$(-7,3]$'
        answer:
          choiceId: a
        explanation: |
          Both endpoint series diverge because their terms fail to approach zero.

      - id: power-series-step-013
        title: Separate radius from interval
        instruction: |
          The radius is only a distance. The interval records endpoints.

          A complete answer should include:

          - center,
          - radius,
          - endpoint tests,
          - final interval.
        type: selectAll
        prompt: Which parts belong in a complete interval-of-convergence solution?
        choices:
          - id: a
            text: Find the radius.
          - id: b
            text: Test both endpoints.
          - id: c
            text: Write final interval notation.
          - id: d
            text: Assume endpoints are always excluded.
        answer:
          choiceIds:
            - a
            - b
            - c
        explanation: |
          Endpoints can converge or diverge independently, so they cannot be assumed.
