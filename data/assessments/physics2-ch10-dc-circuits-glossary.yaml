    - id: t1
      term: Kirchhoff's Junction Rule
      definition: The sum of currents entering a junction equals the sum of currents leaving it (conservation
        of charge).
      drills:
      - id: t1-drill
        type: flashcard
        prompt: What does Kirchhoff's Junction Rule mean?
        answer:
          expected: The sum of currents entering a junction equals the sum of currents leaving it (conservation
            of charge).
        explanation: 'Solution:


          The sum of currents entering a junction equals the sum of currents leaving it (conservation
          of charge).


          Why it works:


          This definition identifies the essential meaning of Kirchhoff''s Junction Rule.'
        tags: []
    - id: t2
      term: Kirchhoff's Loop Rule
      definition: The algebraic sum of potential changes around any closed circuit loop is zero (conservation
        of energy).
      drills:
      - id: t2-drill
        type: flashcard
        prompt: What does Kirchhoff's Loop Rule mean?
        answer:
          expected: The algebraic sum of potential changes around any closed circuit loop is zero (conservation
            of energy).
        explanation: 'Solution:


          The algebraic sum of potential changes around any closed circuit loop is zero (conservation
          of energy).


          Why it works:


          This definition identifies the essential meaning of Kirchhoff''s Loop Rule.'
        tags: []
    - id: t3
      term: Time Constant
      definition: The product $RC$, representing the time required for an RC circuit to reach $63.2\%$
        of its final charge or decay to $36.8\%$ of its initial charge.
      drills:
