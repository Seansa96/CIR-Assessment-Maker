glossary:
  introduction: Core terms for DC circuits.
  sections:
  - id: terms
    title: Core terms
    required: true
    content: Definitions of rules and circuits.
    entries:
    - id: t1
      term: Kirchhoff's Junction Rule
      definition: The sum of currents entering a junction equals the sum of currents
        leaving it (conservation of charge).
    - id: t2
      term: Kirchhoff's Loop Rule
      definition: The algebraic sum of potential changes around any closed circuit
        loop is zero (conservation of energy).
    - id: t3
      term: Time Constant
      definition: The product $RC$, representing the time required for an RC circuit
        to reach $63.2\%$ of its final charge or decay to $36.8\%$ of its initial
        charge.
