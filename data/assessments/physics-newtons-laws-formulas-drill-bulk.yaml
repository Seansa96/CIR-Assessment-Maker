- id: drill-newton-2
  type: typed
  prompt: What equation states Newton's Second Law?
  answer:
    expected: F_net = ma
    expectedLatex: \vec{F}_{net} = m\vec{a}
    aliases:
    - F=ma
  explanation: 'Solution: $\vec F_{net}=m\vec a$.\n\nWhy it works: Net force causes acceleration proportional to mass.'
- id: drill-momentum-force
  type: typed
  prompt: What equation expresses force as rate of change of momentum?
  answer:
    expected: F = dp/dt
    expectedLatex: \vec{F} = \frac{d\vec{p}}{dt}
  explanation: 'Solution: $\vec F=d\vec p/dt$.\n\nWhy it works: Force changes momentum over time.'
