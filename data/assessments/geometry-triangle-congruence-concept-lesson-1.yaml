lesson:
  introduction: |-
    If two triangles are exactly the same size and exactly the same shape, they are **congruent**. But how do we prove it without having to measure all six parts (three sides and three angles) of both triangles?
  sections:
  - id: sec-cpctc
    title: Congruence and CPCTC
    required: true
    content: |-
      Two geometric figures are **congruent** (symbol: $\cong$) if they have exactly the same size and shape. For triangles, this means all corresponding sides are equal in length, and all corresponding angles are equal in measure.
      
      When writing a congruence statement, the order of the letters matters! If we write $\triangle ABC \cong \triangle DEF$, we are stating that:
      - $\angle A \cong \angle D$
      - $\angle B \cong \angle E$
      - $\angle C \cong \angle F$
      - $\overline{AB} \cong \overline{DE}$
      - $\overline{BC} \cong \overline{EF}$
      - $\overline{AC} \cong \overline{DF}$

      This principle is summarized by the acronym **CPCTC**: **C**orresponding **P**arts of **C**ongruent **T**riangles are **C**ongruent. Once you prove two triangles are congruent, you can use CPCTC to prove that any of their corresponding parts are equal!

  - id: sec-sss-sas
    title: SSS and SAS Congruence
    required: true
    content: |-
      To prove triangles are congruent, we don't actually need to check all six parts. We have shortcuts!
      
      **SSS (Side-Side-Side) Congruence Postulate**:
      If three sides of one triangle are congruent to three sides of another triangle, then the two triangles are congruent.
      
      **SAS (Side-Angle-Side) Congruence Postulate**:
      If two sides and the **included angle** (the angle exactly between those two sides) of one triangle are congruent to two sides and the included angle of another triangle, then the two triangles are congruent.
      
      *Warning:* The angle MUST be between the two sides. If the angle is not between the sides, you have SSA, which does NOT guarantee congruence!

questions:
- id: q-geom-cong-1
  title: Concept Check - Congruence Statements
  prompt: |-
    If $\triangle PQR \cong \triangle STU$, which side of $\triangle STU$ is guaranteed to be congruent to $\overline{PR}$?
  type: multipleChoice
  choices:
  - id: c1
    text: $\overline{ST}$
  - id: c2
    text: $\overline{TU}$
  - id: c3
    text: $\overline{SU}$
  answer:
    choiceId: c3
  explanation: |-
    Because the order of letters dictates the correspondence, the first and third letters of the first triangle ($\overline{PR}$) correspond to the first and third letters of the second triangle ($\overline{SU}$).
  skills:
  - geometry-triangle-congruence

- id: q-geom-cong-2
  title: Concept Check - SAS
  prompt: |-
    In $\triangle LMN$, what is the included angle between sides $\overline{LM}$ and $\overline{LN}$?
  type: multipleChoice
  choices:
  - id: c1
    text: $\angle L$
  - id: c2
    text: $\angle M$
  - id: c3
    text: $\angle N$
  answer:
    choiceId: c1
  explanation: |-
    The included angle is the angle formed where the two sides meet. Both sides $\overline{LM}$ and $\overline{LN}$ share the vertex $L$, making $\angle L$ the included angle.
  skills:
  - geometry-triangle-congruence
