workedExamples:
  - id: stoichiometric-rate
    title: Convert a species rate using stoichiometry
    problem: 'For $2NO_2\rightarrow2NO+O_2$, nitrogen dioxide disappears at $0.084\ \mathrm{M\,min^{-1}}$. Find the reaction rate and oxygen-formation rate.'
    steps:
      - id: sr1
        title: Identify the coefficient ratio
        instruction: 'Use the balanced equation rather than assuming all species change equally.'
        type: freeResponse
        prompt: 'What coefficient connects $NO_2$ to $O_2$?'
        answer: { gradingMode: selfCheck, keyPoints: ['2 mol NO2 per 1 mol O2'] }
        explanation: 'Solution: Two moles of $NO_2$ are consumed for each mole of $O_2$ formed. Why it works: Coefficients set the relative concentration-change rates.'
      - id: sr2
        title: Calculate the reaction rate
        instruction: 'Divide reactant disappearance by its coefficient.'
        type: numericResponse
        prompt: 'Find the reaction rate in $\mathrm{M\,min^{-1}}$.'
        answer: { value: 0.042, tolerance: 0.0001 }
        explanation: 'Solution: $0.084/2=0.042\ \mathrm{M\,min^{-1}}$. Why it works: $r=-\tfrac12\Delta[NO_2]/\Delta t$.'
      - id: sr3
        title: Report product formation
        instruction: 'The coefficient of oxygen is one.'
        type: numericResponse
        prompt: 'Find the $O_2$ formation rate in $\mathrm{M\,min^{-1}}$.'
        answer: { value: 0.042, tolerance: 0.0001 }
        explanation: 'Solution: $d[O_2]/dt=0.042\ \mathrm{M\,min^{-1}}$. Why it works: Its coefficient is one, so its formation rate equals r.'
  - id: initial-rate-law
    title: Infer a rate law from controlled trials
    problem: 'Trial 1 has $[A]=0.10$, $[B]=0.20$, rate $0.030$; trial 2 has $[A]=0.20$, $[B]=0.20$, rate $0.120$; trial 3 has $[A]=0.20$, $[B]=0.40$, rate $0.240$, in consistent units.'
    steps:
      - id: ir1
        title: Determine the order in A
        instruction: 'Compare trials 1 and 2, where only A changes.'
        type: numericResponse
        prompt: 'What is the order in A?'
        answer: { value: 2, tolerance: 0 }
        explanation: 'Solution: 2. Why it works: Doubling A makes rate four times larger, and $4=2^2$.'
      - id: ir2
        title: Determine the order in B
        instruction: 'Compare trials 2 and 3, where only B changes.'
        type: numericResponse
        prompt: 'What is the order in B?'
        answer: { value: 1, tolerance: 0 }
        explanation: 'Solution: 1. Why it works: Doubling B doubles the rate, so its exponent is one.'
      - id: ir3
        title: State and use the rate law
        instruction: 'Substitute a complete trial into $rate=k[A]^2[B]$.'
        type: numericResponse
        prompt: 'Find k for $rate=k[A]^2[B]$.'
        answer: { value: 15, tolerance: 0.01 }
        explanation: 'Solution: $k=0.030/(0.10^2\cdot0.20)=15$. Why it works: Dividing a measured rate by the concentration factor isolates k.'
  - id: first-order-time
    title: Use a first-order time model
    problem: 'A dye fades by a first-order process with $k=0.173\ \mathrm{min^{-1}}$ and initial concentration $0.800\ \mathrm{M}$.'
    steps:
      - id: fo1
        title: Find half-life
        instruction: 'Use the first-order half-life relation.'
        type: numericResponse
        prompt: 'Find $t_{1/2}$ in minutes.'
        answer: { value: 4.01, tolerance: 0.02 }
        explanation: 'Solution: $0.693/0.173=4.01\ \mathrm{min}$. Why it works: First-order half-life is set by k.'
      - id: fo2
        title: Choose an elapsed time
        instruction: 'Eight minutes is approximately two half-lives.'
        type: freeResponse
        prompt: 'What fraction remains after about two half-lives?'
        answer: { gradingMode: selfCheck, keyPoints: ['one quarter', '0.25'] }
        explanation: 'Solution: One quarter remains. Why it works: Each half-life multiplies the amount by one-half.'
      - id: fo3
        title: Compute remaining concentration
        instruction: 'Multiply the initial concentration by the remaining fraction.'
        type: numericResponse
        prompt: 'Approximate concentration after 8.0 min in M.'
        answer: { value: 0.2, tolerance: 0.01 }
        explanation: 'Solution: $0.800(1/2)^2=0.200\ \mathrm{M}$ approximately. Why it works: The elapsed time is close to two first-order half-lives.'
