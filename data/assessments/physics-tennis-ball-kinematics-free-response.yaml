questions:
- id: q001
  type: freeResponse
  prompt: |
    A tennis ball is thrown straight upward from ground level with initial speed $18\ \text{m/s}$. Ignore air resistance and use $g=9.8\ \text{m/s}^2$.

    Find the maximum height.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Final vertical velocity at the top is zero.
    - Use the no-time equation.
    - Acceleration is negative if upward is positive.
  explanation: |-
    Solution:
    The best equation is

    $$
    v_y^2=v_{0y}^2+2a_y\Delta y.
    $$

    At maximum height, $v_y=0$. With upward positive, $a_y=-9.8\ \text{m/s}^2$:

    $$
    0=18^2+2(-9.8)\Delta y.
    $$

    Solve for $\Delta y$:

    $$
    \Delta y=\frac{18^2}{2(9.8)}\approx16.5\ \text{m}.
    $$

    The technique choice is the no-time kinematic equation because the question asks for displacement and does not require time.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q002
  type: freeResponse
  prompt: |
    A tennis ball is dropped from rest from a height of $12\ \text{m}$. Ignore air resistance.

    Find the speed just before it hits the ground.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - The ball starts from rest.
    - Displacement is downward if upward is positive.
    - Use the no-time equation.
  explanation: |-
    Solution:
    Use

    $$
    v_y^2=v_{0y}^2+2a_y\Delta y.
    $$

    Here $v_{0y}=0$, $a_y=-9.8\ \text{m/s}^2$, and $\Delta y=-12\ \text{m}$. Therefore

    $$
    v_y^2=2(-9.8)(-12)=235.2.
    $$

    So $|v_y|\approx15.3\ \text{m/s}$. The velocity is downward, so $v_y\approx-15.3\ \text{m/s}$ if upward is positive.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q003
  type: freeResponse
  prompt: |
    A tennis ball is moving upward at $8\ \text{m/s}$ when it passes a window. It had been launched from the ground $2.0\ \text{s}$ earlier.

    What was its initial vertical velocity?
  answer:
    gradingMode: selfCheck
    keyPoints:
    - The given velocity is final velocity at the window.
    - Rearrange $v=v_0+at$ for $v_0$.
    - Gravity is negative with upward positive.
  explanation: |-
    Solution:
    The given final vertical velocity and time point to

    $$
    v_y=v_{0y}+a_yt.
    $$

    Solve for initial velocity:

    $$
    v_{0y}=v_y-a_yt.
    $$

    Substitute $v_y=8$, $a_y=-9.8$, and $t=2.0$:

    $$
    v_{0y}=8-(-9.8)(2.0)=27.6\ \text{m/s}.
    $$

    The manipulation is important: the problem gives final velocity and asks you to work backward.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q004
  type: freeResponse
  prompt: |
    A tennis ball is thrown horizontally from a balcony $20\ \text{m}$ above the ground. It lands $16\ \text{m}$ from the base of the balcony.

    Find its initial horizontal speed.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Horizontal launch means $v_{0y}=0$.
    - Find time from vertical motion first.
    - Use constant horizontal velocity after time is known.
  explanation: |-
    Solution:
    Split the motion into vertical and horizontal components. Vertically,

    $$
    \Delta y=v_{0y}t+\frac{1}{2}a_yt^2.
    $$

    Since the throw is horizontal, $v_{0y}=0$. With upward positive,

    $$
    -20=\frac{1}{2}(-9.8)t^2.
    $$

    This gives $t\approx2.02\ \text{s}$. Horizontally, acceleration is zero, so

    $$
    \Delta x=v_xt.
    $$

    Thus $v_x=16/2.02\approx7.9\ \text{m/s}$. The technique sequence is vertical equation for time, then horizontal constant-velocity motion.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q005
  type: freeResponse
  prompt: |
    A tennis ball is served horizontally at $30\ \text{m/s}$ from a height of $2.5\ \text{m}$. The net is $12\ \text{m}$ away.

    How far has the ball fallen by the time it reaches the net?
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Use horizontal motion to find time.
    - Horizontal launch gives $v_{0y}=0$.
    - Vertical fall depends on time squared.
  explanation: |-
    Solution:
    The horizontal equation is

    $$
    x=v_xt.
    $$

    So $t=12/30=0.40\ \text{s}$. Vertically, the ball starts with no vertical velocity, so the downward drop is

    $$
    \text{drop}=\frac{1}{2}gt^2=\frac{1}{2}(9.8)(0.40)^2\approx0.78\ \text{m}.
    $$

    The technique choice is component separation: horizontal motion gives time, and vertical motion gives the drop.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q006
  type: freeResponse
  prompt: |
    A tennis ball is launched from ground level and lands back at ground level after $3.0\ \text{s}$. Ignore air resistance.

    Find the initial vertical velocity.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Initial and final vertical positions are the same.
    - Use vertical displacement equation.
    - Solve for $v_{0y}$.
  explanation: |-
    Solution:
    The vertical displacement equation is

    $$
    \Delta y=v_{0y}t+\frac{1}{2}a_yt^2.
    $$

    Since the ball lands at the launch height, $\Delta y=0$. With $a_y=-g$:

    $$
    0=v_{0y}t-\frac{1}{2}gt^2.
    $$

    Divide by $t$ and solve:

    $$
    v_{0y}=\frac{1}{2}gt=\frac{1}{2}(9.8)(3.0)=14.7\ \text{m/s}.
    $$

    This is a backward kinematics setup because total flight time is given and initial velocity is unknown.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q007
  type: freeResponse
  prompt: |
    A tennis ball is launched at $22\ \text{m/s}$ at $35^\circ$ above the horizontal from ground level.

    Find the time to reach maximum height.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Resolve initial velocity into components.
    - At maximum height, vertical velocity is zero.
    - Use $v_y=v_{0y}+a_yt$.
  explanation: |-
    Solution:
    First decompose the launch velocity:

    $$
    v_{0y}=22\sin35^\circ\approx12.6\ \text{m/s}.
    $$

    At the top, $v_y=0$. Use

    $$
    v_y=v_{0y}+a_yt.
    $$

    With $a_y=-9.8$:

    $$
    0=12.6-9.8t.
    $$

    Therefore $t\approx1.29\ \text{s}$. The technique sequence is vector decomposition, then one-dimensional vertical kinematics.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q008
  type: freeResponse
  prompt: |
    A tennis ball must clear a fence $18\ \text{m}$ away and $4.0\ \text{m}$ high. It is launched from ground level with horizontal speed $12\ \text{m/s}$.

    What initial vertical velocity is needed for the ball to be exactly at the fence height?
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Horizontal motion determines the time to the fence.
    - Vertical position equation is solved for initial vertical velocity.
    - This is a final-position-given setup.
  explanation: |-
    Solution:
    Horizontal motion gives time:

    $$
    t=\frac{x}{v_x}=\frac{18}{12}=1.5\ \text{s}.
    $$

    Now use vertical position:

    $$
    \Delta y=v_{0y}t-\frac{1}{2}gt^2.
    $$

    Solve for $v_{0y}$:

    $$
    v_{0y}=\frac{\Delta y+\frac{1}{2}gt^2}{t}.
    $$

    Substitute $\Delta y=4.0$ and $t=1.5$:

    $$
    v_{0y}\approx\frac{4.0+0.5(9.8)(1.5)^2}{1.5}\approx12.35\ \text{m/s}.
    $$

    The technique sequence is horizontal time first, then manipulate vertical displacement for the unknown initial component.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q009
  type: freeResponse
  prompt: |
    A tennis ball is launched from ground level at $20\ \text{m/s}$ and lands $30\ \text{m}$ away at the same height.

    Find the launch angle. Ignore air resistance.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Same launch and landing height permits the range formula.
    - Solve for $\sin(2\theta)$.
    - There are usually two complementary launch angles.
  explanation: |-
    Solution:
    Since launch and landing heights match, use the projectile range equation:

    $$
    R=\frac{v_0^2\sin(2\theta)}{g}.
    $$

    Solve:

    $$
    \sin(2\theta)=\frac{Rg}{v_0^2}=\frac{30(9.8)}{20^2}=0.735.
    $$

    Thus $2\theta\approx47.4^\circ$ or $132.6^\circ$, so $\theta\approx23.7^\circ$ or $66.3^\circ$. The two answers reflect low-angle and high-angle trajectories with the same range.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
- id: q010
  type: freeResponse
  prompt: |
    A tennis ball is hit upward from a height of $1.2\ \text{m}$. Its initial vertical velocity is $10\ \text{m/s}$ upward.

    How long until it hits the ground?
  answer:
    gradingMode: selfCheck
    keyPoints:
    - Set final position to ground level.
    - Use the vertical position equation.
    - Solve a quadratic and keep the positive time.
  explanation: |-
    Solution:
    Use the vertical position equation with ground as $y=0$:

    $$
    y=y_0+v_{0y}t+\frac{1}{2}a_yt^2.
    $$

    Substitute $y=0$, $y_0=1.2$, $v_{0y}=10$, and $a_y=-9.8$:

    $$
    0=1.2+10t-4.9t^2.
    $$

    Rearranging gives $4.9t^2-10t-1.2=0$. The positive root is about $2.15\ \text{s}$. The technique choice is vertical quadratic motion because the final position is specified and the ball does not land at launch height.

    Why it works:
    The technique choice relies on kinematics equations.
  difficultyDimensions:
  - computational
  - conceptual
