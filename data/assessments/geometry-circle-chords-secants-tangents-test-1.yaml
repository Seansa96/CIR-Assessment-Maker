- id: q-circle-chords-secants-tangents-test-1
  type: multipleChoice
  prompt: 'A tangent line intersects a radius at the point of tangency. What angle do they form?'
  choices:
  - id: choice-A
    text: '180^\circ'
  - id: choice-B
    text: '45^\circ'
  - id: choice-C
    text: '90^\circ'
  answer:
    choiceId: choice-C
    explanation: 'A tangent is perpendicular to the radius at the point of tangency.'
  skills:
  - geometry-circle-chords-secants-tangents
