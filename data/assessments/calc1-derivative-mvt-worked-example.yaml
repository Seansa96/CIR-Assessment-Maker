workedExamples:
- id: we001
  title: From first principles to theorem use
  problem: |
    First find $f'(a)$ for $f(x)=x^2+3x$ from the definition. Then use the Mean Value Theorem for $f(x)=x^2$ on $[1,4]$.
  steps:
  - id: deriv-mvt-s001
    title: Set up the quotient
    instruction: |
      Use $[f(a+h)-f(a)]/h$.
    type: multipleChoice
    prompt: |
      Which difference quotient is correct for $f(x)=x^2+3x$?
    choices:
    - id: a
      text: $\frac{(a+h)^2+3(a+h)-(a^2+3a)}{h}$
    - id: b
      text: $\frac{a^2+3a}{h}$
    - id: c
      text: $\frac{(a+h)^2-a^2}{a}$
    - id: d
      text: $f(a+h)-h$
    answer:
      choiceId: a
    explanation: |
      The quotient must compare $f(a+h)$ with $f(a)$.
  - id: deriv-mvt-s002
    title: Simplify and limit
    instruction: |
      Expand, cancel, divide by $h$, then let $h\to0$.
    type: symbolicResponse
    prompt: |
      What is $f'(a)$?
    answer:
      expectedLatex: 2a+3
      equivalenceMode: expression
      variables:
      - a
      tolerance: 0.000001
    explanation: |
      After cancellation, the quotient is $2a+h+3$, so the limit is $2a+3$.
  - id: deriv-mvt-s003
    title: Average slope
    instruction: |
      For $g(x)=x^2$ on $[1,4]$, compute the secant slope.
    type: numericResponse
    prompt: |
      What is $\frac{g(4)-g(1)}{4-1}$?
    answer:
      value: 5
      tolerance: 0.000001
    explanation: |
      $(16-1)/3=5$.
  - id: deriv-mvt-s004
    title: Find the guaranteed point
    instruction: |
      The MVT guarantees a $c$ with $g'(c)=5$.
    type: numericResponse
    prompt: |
      What is $c$?
    answer:
      value: 2.5
      tolerance: 0.000001
    explanation: |
      Since $g'(x)=2x$, solve $2c=5$ to get $c=2.5$.
