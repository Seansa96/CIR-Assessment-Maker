skills:
- Select and execute factoring, completing-square, and formula methods
- Use discriminants and Vieta relations to reason about roots
- Solve disguised quadratics and verify transformed-equation candidates
- Model contextual and parameter conditions with quadratics
questions:
- id: q001
  type: multipleChoice
  prompt: Solve $3x^2+x-2=0$.
  choices:
  - id: a
    text: '$x=2/3$ or $x=-1$'
  - id: b
    text: '$x=-2/3$ or $x=1$'
  - id: c
    text: '$x=2$ or $x=-1/3$'
  - id: d
    text: '$x=-2$ or $x=1/3$'
  answer:
    choiceId: a
  explanation: $3x^2+x-2=(3x-2)(x+1)$, so the zero-product property gives $x=2/3$ or $x=-1$.
  skills: [factor-quadratics]
- id: q002
  type: multipleChoice
  prompt: Solve $x^2+2x-7=0$ by completing the square.
  choices:
  - id: a
    text: '$x=-1\pm2\sqrt2$'
  - id: b
    text: '$x=1\pm2\sqrt2$'
  - id: c
    text: '$x=-2\pm\sqrt7$'
  - id: d
    text: '$x=-1\pm\sqrt7$'
  answer:
    choiceId: a
  explanation: $x^2+2x=7$ becomes $(x+1)^2=8$, hence $x=-1\pm\sqrt8=-1\pm2\sqrt2$.
  skills: [complete-the-square]
- id: q003
  type: multipleChoice
  prompt: Find all real solutions of $x^4-5x^2+4=0$.
  choices:
  - id: a
    text: '$x=1,2$'
  - id: b
    text: '$x=-1,-2$'
  - id: c
    text: '$x=\pm1,\pm2$'
  - id: d
    text: '$x=\pm1,\pm4$'
  answer:
    choiceId: c
  explanation: Let $u=x^2$. Then $(u-1)(u-4)=0$, so $x^2=1$ or $x^2=4$ and all four signs occur.
  skills: [solve-disguised-quadratics]
- id: q004
  type: multipleChoice
  prompt: |-
    Solve
    $$\frac1x+\frac1{x-2}=\frac34.$$
  choices:
  - id: a
    text: '$x=4$ only'
  - id: b
    text: '$x=2/3$ only'
  - id: c
    text: '$x=4$ or $x=2/3$'
  - id: d
    text: '$x=0$ or $x=2$'
  answer:
    choiceId: c
  explanation: |-
    The restrictions are $x\ne0,2$. Multiplying by $4x(x-2)$ gives $3x^2-14x+8=0=(3x-2)(x-4)$. Both $2/3$ and $4$ satisfy the restrictions and original equation.
  skills: [verify-rational-equation-roots]
- id: q005
  type: multipleChoice
  prompt: Which quadratic has roots $3$ and $7$ and leading coefficient $2$?
  choices:
  - id: a
    text: '$2x^2-10x+21=0$'
  - id: b
    text: '$2x^2-20x+42=0$'
  - id: c
    text: '$x^2-20x+42=0$'
  - id: d
    text: '$2x^2+20x+42=0$'
  answer:
    choiceId: b
  explanation: $2(x-3)(x-7)=2(x^2-10x+21)=2x^2-20x+42$.
  skills: [construct-quadratics-from-roots]
- id: q006
  type: multipleChoice
  prompt: For which real values of $k$ does $x^2+kx+9=0$ have a repeated root?
  choices:
  - id: a
    text: '$k=6$ only'
  - id: b
    text: '$k=-6$ only'
  - id: c
    text: '$k=\pm3$'
  - id: d
    text: '$k=\pm6$'
  answer:
    choiceId: d
  explanation: A repeated root requires $k^2-4(1)(9)=0$, so $k^2=36$ and $k=\pm6$.
  skills: [solve-discriminant-parameter-conditions]
- id: q007
  type: multipleChoice
  prompt: Which equation has no real roots?
  choices:
  - id: a
    text: '$x^2-6x+9=0$'
  - id: b
    text: '$x^2+2x+5=0$'
  - id: c
    text: '$x^2-5x+6=0$'
  - id: d
    text: '$2x^2-8=0$'
  answer:
    choiceId: b
  explanation: Its discriminant is $2^2-4(1)(5)=-16<0$. The other equations have zero or positive discriminants.
  skills: [classify-roots-by-discriminant]
- id: q008
  type: multipleChoice
  prompt: Solve $2^{2x}-5\cdot2^x+6=0$.
  choices:
  - id: a
    text: '$x=2$ or $x=3$'
  - id: b
    text: '$x=1$ or $x=\log_2 3$'
  - id: c
    text: '$x=-1$ or $x=-\log_2 3$'
  - id: d
    text: '$x=\log_2 5$ only'
  answer:
    choiceId: b
  explanation: Let $u=2^x>0$. Then $u^2-5u+6=(u-2)(u-3)=0$, giving $2^x=2$ or $2^x=3$.
  skills: [solve-disguised-quadratics]
- id: q009
  type: multipleChoice
  prompt: If $r,s$ are the roots of $x^2-5x+1=0$, find $r^2+s^2$ without solving for the roots.
  choices:
  - id: a
    text: '$21$'
  - id: b
    text: '$23$'
  - id: c
    text: '$25$'
  - id: d
    text: '$27$'
  answer:
    choiceId: b
  explanation: Vieta gives $r+s=5$ and $rs=1$, so $r^2+s^2=(r+s)^2-2rs=25-2=23$.
  skills: [use-vieta-symmetrically]
- id: q010
  type: multipleChoice
  prompt: |-
    A ball's height after $t$ seconds is $h(t)=-5t^2+20t+25$. At what physically meaningful time does it reach the ground?
  choices:
  - id: a
    text: '$t=-1$ second'
  - id: b
    text: '$t=1$ second'
  - id: c
    text: '$t=4$ seconds'
  - id: d
    text: '$t=5$ seconds'
  answer:
    choiceId: d
  explanation: Setting $h=0$ gives $t^2-4t-5=(t-5)(t+1)=0$. The root $-1$ is algebraically valid but outside the model's domain $t\ge0$.
  skills: [interpret-contextual-roots]
- id: q011
  type: multipleChoice
  prompt: |-
    Two nonzero reciprocal numbers have sum $5$. Which monic quadratic has those numbers as its roots?
  choices:
  - id: a
    text: '$x^2-5x+1=0$'
  - id: b
    text: '$x^2+5x+1=0$'
  - id: c
    text: '$x^2-5x-1=0$'
  - id: d
    text: '$x^2-x+5=0$'
  answer:
    choiceId: a
  explanation: Reciprocal roots have product $1$. A monic quadratic with sum $5$ and product $1$ is $x^2-5x+1$.
  skills: [construct-quadratics-from-invariants]
- id: q012
  type: multipleChoice
  prompt: If $r+s=10$ and $rs=21$, what is $r^2+s^2$?
  choices:
  - id: a
    text: '$42$'
  - id: b
    text: '$58$'
  - id: c
    text: '$79$'
  - id: d
    text: '$100$'
  answer:
    choiceId: b
  explanation: $r^2+s^2=(r+s)^2-2rs=100-42=58$.
  skills: [use-symmetric-root-identities]
- id: q013
  type: selectAll
  prompt: Which statements are true for $ax^2+bx+c=0$ with real coefficients and $a\ne0$?
  choices:
  - id: a
    text: If $b^2-4ac>0$, there are two distinct real roots.
  - id: b
    text: If $b^2-4ac=0$, the equation factors as $a(x-r)^2=0$ for some real $r$.
  - id: c
    text: If $b^2-4ac<0$, the equation has no roots in the complex numbers.
  - id: d
    text: If $b^2-4ac<0$, the two roots form a complex-conjugate pair.
  answer:
    choiceIds: [a, b, d]
  explanation: A negative discriminant prevents real roots, not complex roots; the quadratic formula produces a conjugate pair.
  skills: [classify-roots-by-discriminant]
- id: q014
  type: selectAll
  prompt: Which practices are required in a rigorous solution of a transformed quadratic equation?
  choices:
  - id: a
    text: Record denominator, radical, logarithm, or contextual restrictions before transforming.
  - id: b
    text: Reverse every substitution and enforce the substituted expression's range.
  - id: c
    text: Keep every candidate after squaring because squaring is reversible.
  - id: d
    text: Substitute candidates into the original equation when a transformation may have introduced extras.
  answer:
    choiceIds: [a, b, d]
  explanation: Squaring is not reversible without a sign condition, so original-equation verification is necessary.
  skills: [verify-transformed-equation-roots]
- id: q015
  type: freeResponse
  prompt: |-
    Prove that every quadratic equation with real coefficients and negative discriminant has two complex-conjugate roots.
  answer:
    gradingMode: selfCheck
    expected: |-
      Let $\Delta=b^2-4ac<0$. Then $-\Delta>0$ and $\sqrt{\Delta}=i\sqrt{-\Delta}$. The quadratic formula gives
      $$x=\frac{-b\pm i\sqrt{-\Delta}}{2a}.$$
      Because $a,b,$ and $\sqrt{-\Delta}$ are real, changing the sign of the imaginary part takes one root to the complex conjugate of the other. The imaginary part is nonzero, so the two roots are distinct and nonreal.
    keyPoints:
    - Applies the quadratic formula with $\Delta<0$.
    - Rewrites $\sqrt{\Delta}$ as $i\sqrt{-\Delta}$.
    - Identifies equal real parts and opposite imaginary parts.
    - Notes that the roots are distinct and nonreal.
  explanation: Real coefficients make the quadratic formula symmetric under complex conjugation; a negative discriminant supplies the nonzero imaginary part.
  skills: [prove-conjugate-root-structure]
