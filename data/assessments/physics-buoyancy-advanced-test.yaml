questions:
- id: q001
  type: multipleChoice
  prompt: |
    A block of wood floats in a beaker of water ($\rho_{wood} < \rho_{water}$). You mark the water line on the side of the block.
    Then, you carefully pour a thin layer of oil over the water until the wood is completely covered. The oil is less dense than water but denser than the wood ($\rho_{wood} < \rho_{oil} < \rho_{water}$). 
    Compared to its initial position, does the block of wood rise, fall, or stay at exactly the same level relative to the water?
  choices:
  - id: a
    text: 'The block of wood rises relative to the water.'
  - id: b
    text: 'The block of wood falls (sinks deeper) relative to the water.'
  - id: c
    text: 'The block of wood stays at exactly the same level.'
  answer:
    choiceId: a
  explanation: |
    Solution:
    The block of wood rises relative to the water.
    
    Why it works:
    Before the oil is added, the water provides the entire buoyant force needed to support the block's weight. When the oil is added, the submerged upper portion of the block displaces oil instead of air. This displaced oil provides an *additional* upward buoyant force. Because the total buoyant force from both fluids must equal the block's constant weight, the buoyant force required from the water *decreases*. Therefore, the block displaces less water and rises relative to the water surface.
    
    Why the other choices fail:
    Adding fluid on top does not "weigh down" the block in this context; instead, the fluid provides buoyancy ($F_B = \rho V g$). Since air has negligible density and oil has significant density, replacing air with oil increases the upward lift on the top half of the block.
  difficultyDimensions:
  - RepresentationTransfer
  - IdentityConstruction
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
- id: q002
  type: symbolicResponse
  prompt: |
    A composite object is formed by gluing together two pieces: a heavy metallic mass $m_1$ of density $\rho_1$, and a light foam of mass $m_2$ and density $\rho_2$.
    Write the expression for the total buoyant force $F_B$ when the entire composite object is completely submerged in water (density $\rho_w$).
    Use `m_1`, `\rho_1`, `m_2`, `\rho_2`, `\rho_w`, and `g`.
  answer:
    expectedLatex: \rho_w g \left( \frac{m_1}{\rho_1} + \frac{m_2}{\rho_2} \right)
    equivalenceMode: expression
    variables: [m_1, \rho_1, m_2, \rho_2, \rho_w, g]
    tolerance: 0.00001
    keyPoints:
    - \rho_w g (m_1/\rho_1 + m_2/\rho_2)
  explanation: |
    Solution:
    $F_B = \rho_w V_{total} g$
    $V_{total} = V_1 + V_2 = \frac{m_1}{\rho_1} + \frac{m_2}{\rho_2}$
    $F_B = \rho_w g \left( \frac{m_1}{\rho_1} + \frac{m_2}{\rho_2} \right)$
    
    Why it works:
    The total buoyant force depends entirely on the total displaced volume. You simply find the individual volumes by dividing mass by density, sum them, and multiply by the fluid density and gravity.
  difficultyDimensions:
  - RepresentationTransfer
  - IdentityConstruction
  - AuxiliaryTechnique
  - Simplification
  - ModelOrDerivation
