modeDefault: practice
randomizeQuestions: true
questions:
  - id: q001
    type: numericResponse
    prompt: |
      Let $R$ be the region bounded by $y = \sqrt{x}$ and $y = x/2$.
      Find the volume of the solid generated by revolving $R$ around the **y-axis**.
      Provide the decimal value (use $\pi \approx 3.14159$).
    answer:
      value: 26.808
      tolerance: 0.1
    explanation: |
      Intersection: $\sqrt{x} = x/2 \implies x = x^2/4 \implies 4x = x^2 \implies x=0, 4$.
      Using Shells (vertical slices): $r = x$, $h = \sqrt{x} - x/2$.
      $V = 2\pi \int_0^4 x(\sqrt{x} - x/2)\,dx = 2\pi \int_0^4 (x^{3/2} - x^2/2)\,dx = 2\pi \left[ \frac{2}{5}x^{5/2} - \frac{x^3}{6} \right]_0^4$.
      $2\pi( \frac{64}{5} - \frac{64}{6} ) = 2\pi( \frac{384 - 320}{30} ) = 2\pi( \frac{64}{30} ) = \frac{64\pi}{15} \approx 13.404$.
      Wait, $2\pi(64/5 - 32/3) = 2\pi(192/15 - 160/15) = 64\pi/15 \approx 13.404$.
      Let me recalculate. $x^2/2$ integral is $x^3/6$. At $x=4$, $64/6 = 32/3$.
      $2\pi (64/5 - 32/3) = 2\pi (192/15 - 160/15) = 2\pi (32/15) = 64\pi/15 \approx 13.404$.

  - id: q002
    type: numericResponse
    prompt: |
      Let $R$ be the region bounded by $y = \sec x$, $y = 0$, $x = 0$, $x = \pi/4$.
      Find the volume of the solid generated by revolving $R$ around the **x-axis**.
    answer:
      value: 3.141
      tolerance: 0.1
    explanation: |
      Disk method: $V = \pi \int_0^{\pi/4} \sec^2 x\,dx = \pi [\tan x]_0^{\pi/4} = \pi (1 - 0) = \pi \approx 3.14159$.

  - id: q003
    type: multipleChoice
    prompt: |
      Which integral gives the volume of the solid generated by revolving the region bounded by $y = x^2$ and $y = 2x$ around the line $x = 3$?
    choices:
      - id: a
        text: $2\pi \int_0^2 (3 - x)(2x - x^2)\,dx$
      - id: b
        text: $2\pi \int_0^2 (x - 3)(2x - x^2)\,dx$
      - id: c
        text: $\pi \int_0^2 ((3 - x^2)^2 - (3 - 2x)^2)\,dx$
      - id: d
        text: $\pi \int_0^4 ((3 - y/2)^2 - (3 - \sqrt{y})^2)\,dy$
    answer:
      choiceId: a
    explanation: |
      Intersection is $x^2 = 2x \implies x=0, 2$. 
      Using shells ($dx$): Revolve around $x=3$ (vertical, parallel to slices).
      Radius is $3 - x$ (since region is to the left of $x=3$). Height is top - bottom = $2x - x^2$.
      $V = 2\pi \int_0^2 (3 - x)(2x - x^2)\,dx$.

  - id: q004
    type: numericResponse
    prompt: |
      Find the volume of the solid whose base is the region bounded by $y = x^2$ and $y = 4$, and whose cross sections perpendicular to the y-axis are squares.
    answer:
      value: 32
      tolerance: 0.1
    explanation: |
      Slices are perpendicular to y-axis, so integrate $dy$ from 0 to 4.
      The length of the base of the square is the horizontal distance between the right and left sides of the parabola: $x = \sqrt{y}$ and $x = -\sqrt{y}$.
      Base length $s = 2\sqrt{y}$.
      Area of square $A(y) = s^2 = 4y$.
      $V = \int_0^4 4y\,dy = [2y^2]_0^4 = 32$.

  - id: q005
    type: multipleChoice
    prompt: |
      You need to find the volume of the solid generated by revolving the region bounded by $y = \ln x$, $x=0, y=0, y=1$ around the y-axis. Which method is easiest?
    choices:
      - id: a
        text: Disk Method (with respect to y)
      - id: b
        text: Shell Method (with respect to x)
      - id: c
        text: Both are equally easy
    answer:
      choiceId: a
    explanation: |
      If you integrate with respect to $y$, the curve is $x = e^y$. Revolving around the y-axis gives solid disks: $\pi \int_0^1 (e^y)^2\,dy = \pi \int_0^1 e^{2y}\,dy$.
      If you integrate with respect to $x$, the top boundary is $y=1$ and the bottom is $y=\ln x$, but the region goes from $x=0$ to $x=e$, which means you have to split the integral at $x=1$. Disks are much easier!
