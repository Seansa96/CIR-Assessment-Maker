lesson:
  introduction: |-
    Beyond the angles inside a triangle, we can also look at the angles formed *outside* a triangle, and the rules governing how long the sides of a triangle must be to actually form a closed shape.
  sections:
  - id: sec-exterior
    title: The Exterior Angle Theorem
    required: true
    content: |-
      If you extend one side of a triangle past its vertex, you create an **exterior angle**. 
      
      The two interior angles that are not adjacent (next to) the exterior angle are called the **remote interior angles**.
      
      The **Exterior Angle Theorem** states that the measure of an exterior angle of a triangle is equal to the sum of the measures of its two remote interior angles.
      
      For example, if you extend side $\overline{BC}$ to a point $D$, creating exterior angle $\angle ACD$, then:
      $$m\angle ACD = m\angle A + m\angle B$$

  - id: sec-inequality
    title: The Triangle Inequality Theorem
    required: true
    content: |-
      Can you build a triangle out of three sticks of any length? The answer is no! If you have two very short sticks and one very long stick, the short ones won't be able to reach each other to close the triangle.
      
      The **Triangle Inequality Theorem** states that the sum of the lengths of any two sides of a triangle must be strictly greater than the length of the third side.
      
      If a triangle has side lengths $a, b,$ and $c$, then all three of these inequalities must be true:
      1. $a + b > c$
      2. $a + c > b$
      3. $b + c > a$
      
      If even one of these fails, the triangle cannot exist.

questions:
- id: q-geom-tri2-1
  title: Concept Check - Exterior Angles
  prompt: |-
    An exterior angle of a triangle measures $110^\circ$. If one of its remote interior angles measures $40^\circ$, what is the measure of the other remote interior angle?
  type: numericResponse
  answer:
    numericValue: 70
    tolerance: 0
  explanation: |-
    By the Exterior Angle Theorem, the exterior angle equals the sum of the two remote interior angles.
    $$110^\circ = 40^\circ + x$$
    $$x = 110^\circ - 40^\circ = 70^\circ$$
  skills:
  - geometry-triangles-basics

- id: q-geom-tri2-2
  title: Concept Check - Triangle Inequality
  prompt: |-
    Can a triangle have side lengths of $3$, $4$, and $8$?
  type: multipleChoice
  choices:
  - id: c1
    text: Yes
  - id: c2
    text: No
  answer:
    choiceId: c2
  explanation: |-
    Check the Triangle Inequality Theorem. The sum of the two smallest sides ($3 + 4 = 7$) must be greater than the largest side ($8$). Because $7$ is NOT greater than $8$, these sides cannot form a triangle.
  skills:
  - geometry-triangles-basics
