workedExamples:
- id: we2
  title: Equivalent Capacitance
  prompt: Three capacitors $C_1 = 2\text{ }\mu\text{F}$, $C_2 = 3\text{ }\mu\text{F}$,
    and $C_3 = 6\text{ }\mu\text{F}$ are connected in series. What is the equivalent
    capacitance?
  steps:
  - id: s1
    prompt: Apply the series combination formula.
    explanation: 'Solution:

      1) For series capacitors, $\frac{1}{C_{eq}} = \frac{1}{C_1} + \frac{1}{C_2}
      + \frac{1}{C_3}$.

      2) $\frac{1}{C_{eq}} = \frac{1}{2} + \frac{1}{3} + \frac{1}{6} = \frac{3}{6}
      + \frac{2}{6} + \frac{1}{6} = \frac{6}{6} = 1\text{ }\mu\text{F}^{-1}$.

      3) Therefore, $C_{eq} = 1\text{ }\mu\text{F}$.


      Why it works:

      In series, the same charge is pushed onto each capacitor, dividing the total
      voltage among them.'
