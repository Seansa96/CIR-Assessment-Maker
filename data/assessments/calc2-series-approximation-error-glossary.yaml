glossary:
  introduction: |
    ![Function, Taylor polynomial, and remainder gap](/assessments/calc2-infinite-series/taylor-approximation-error.svg)

    Use these terms to decide what an approximation theorem actually certifies.
  sections:
    - id: error-language
      title: Remainders and guarantees
      entries:
        - id: remainder
          term: Remainder
          definition: The exact difference between a target value and its finite approximation.
          notation: '$R_N=S-S_N$ or $R_n(x)=f(x)-P_n(x)$'
          drills:
            - id: remainder-cloze
              type: cloze
              prompt: 'In $S=S_N+R_N$, $R_N$ is the ____ tail.'
              answer: { expected: omitted }
              explanation: The remainder is what was not included in the partial sum.
        - id: alternating-estimate
          term: Alternating-series error estimate
          definition: For decreasing positive magnitudes tending to zero, the error magnitude is no more than the first omitted magnitude.
          notation: '$|R_N|\le b_{N+1}$'
          drills:
            - id: alternating-cloze
              type: cloze
              prompt: 'The alternating-series bound uses the first ____ term.'
              answer: { expected: omitted }
              explanation: It bounds the tail by the next magnitude after truncation.
        - id: lagrange-remainder
          term: Lagrange remainder bound
          definition: A Taylor-error bound using a maximum of the next derivative over the interval from the center to the input.
          notation: '$|R_n(x)|\le M|x-a|^{n+1}/(n+1)!$'
          drills:
            - id: lagrange-cloze
              type: cloze
              prompt: 'In Lagrange''s bound, $M$ bounds the magnitude of the next ____.'
              answer: { expected: derivative }
              explanation: The $(n+1)$st derivative controls the degree-$n$ remainder.
