questions:
- id: q001
  title: Apply OS as extended machine
  type: multipleChoice
  prompt: A system design discussion mentions **OS as extended machine**. Which conclusion is most defensible?
  choices:
  - id: a
    text: The OS gives programs safer abstractions than raw hardware.
  - id: b
    text: The concept can be ignored because applications can always control hardware safely.
  - id: c
    text: The concept matters only for historical systems and not for modern OS design.
  - id: d
    text: The concept proves there is one universal OS design for every workload.
  answer:
    choiceId: a
  explanation: The OS gives programs safer abstractions than raw hardware. This is why OS as extended machine matters in Introduction and System Calls.
