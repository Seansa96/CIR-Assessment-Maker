schemaVersion: 1
id: intro-physics-vectors
title: Intro to Vectors in Physics
assessmentType: quiz
categoryId: physics-1
subcategoryIds:
  - physics-vectors
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "Which quantity is a vector?"
    choices:
      - id: a
        text: "Displacement"
      - id: b
        text: "Time"
      - id: c
        text: "Temperature"
      - id: d
        text: "Mass"
    answer:
      choiceId: a
    explanation: |
      Displacement has both magnitude and direction, so it is a vector.

      Related topic: Vector Versus Scalar Quantities

  - id: q002
    type: multipleChoice
    prompt: "Which quantity is a scalar?"
    choices:
      - id: a
        text: "Speed"
      - id: b
        text: "Velocity"
      - id: c
        text: "Acceleration"
      - id: d
        text: "Force"
    answer:
      choiceId: a
    explanation: |
      Speed gives magnitude only, while velocity, acceleration, and force include direction.

      Related topic: Scalars and Vectors in Physics

  - id: q003
    type: multipleChoice
    prompt: "A displacement vector $(3,4)$ meters has what magnitude?"
    choices:
      - id: a
        text: "5 m"
      - id: b
        text: "7 m"
      - id: c
        text: "12 m"
      - id: d
        text: "25 m"
    answer:
      choiceId: a
    explanation: |
      The magnitude is $\sqrt{3^2+4^2}=5$ meters.

      Related topic: Magnitude of a Displacement Vector

  - id: q004
    type: multipleChoice
    prompt: "If an object moves 4 m east and then 3 m north, which vector represents its net displacement?"
    choices:
      - id: a
        text: "(4, 3) m"
      - id: b
        text: "(3, 4) m"
      - id: c
        text: "(7, 0) m"
      - id: d
        text: "(0, 7) m"
    answer:
      choiceId: a
    explanation: |
      East is the positive x-direction and north is the positive y-direction, giving $(4,3)$ m.

      Related topic: Displacement Components

  - id: q005
    type: multipleChoice
    prompt: "Which formula gives the x-component of a vector with magnitude $A$ at angle $\\theta$ above the positive x-axis?"
    choices:
      - id: a
        text: '$A_x=A\cos\theta$'
      - id: b
        text: '$A_x=A\sin\theta$'
      - id: c
        text: '$A_x=A/\sin\theta$'
      - id: d
        text: '$A_x=A+\cos\theta$'
    answer:
      choiceId: a
    explanation: |
      The x-component is adjacent to the angle, so cosine is used.

      Related topic: Resolving Physics Vectors into Components

  - id: q006
    type: multipleChoice
    prompt: "Which formula gives the y-component of a vector with magnitude $A$ at angle $\\theta$ above the positive x-axis?"
    choices:
      - id: a
        text: '$A_y=A\sin\theta$'
      - id: b
        text: '$A_y=A\cos\theta$'
      - id: c
        text: '$A_y=A/\cos\theta$'
      - id: d
        text: '$A_y=A-\sin\theta$'
    answer:
      choiceId: a
    explanation: |
      The y-component is opposite the angle, so sine is used.

      Related topic: Vertical Components of Vectors

  - id: q007
    type: multipleChoice
    prompt: "Two force vectors are $(5,0)$ N and $(0,2)$ N. What is the net force vector?"
    choices:
      - id: a
        text: "(5, 2) N"
      - id: b
        text: "(7, 0) N"
      - id: c
        text: "(0, 7) N"
      - id: d
        text: "(3, 2) N"
    answer:
      choiceId: a
    explanation: |
      Add components separately: $(5+0,0+2)=(5,2)$ N.

      Related topic: Net Force by Component Addition

  - id: q008
    type: multipleChoice
    prompt: "A vector pointing west has which sign for its x-component?"
    choices:
      - id: a
        text: "Negative"
      - id: b
        text: "Positive"
      - id: c
        text: "Zero"
      - id: d
        text: "Always equal to its y-component"
    answer:
      choiceId: a
    explanation: |
      West is usually the negative x-direction.

      Related topic: Sign Conventions for Vector Components

  - id: q009
    type: multipleChoice
    prompt: "What does the resultant vector represent?"
    choices:
      - id: a
        text: "The single vector equivalent to adding several vectors"
      - id: b
        text: "Only the largest vector"
      - id: c
        text: "Only the smallest vector"
      - id: d
        text: "A vector with no direction"
    answer:
      choiceId: a
    explanation: |
      The resultant summarizes the combined effect of multiple vectors.

      Related topic: Resultant Vectors

  - id: q010
    type: multipleChoice
    prompt: "If velocity is $(0,-6)$ m/s, which direction is the object moving?"
    choices:
      - id: a
        text: "Downward"
      - id: b
        text: "Upward"
      - id: c
        text: "Right"
      - id: d
        text: "Left"
    answer:
      choiceId: a
    explanation: |
      A zero x-component and negative y-component means motion straight downward.

      Related topic: Interpreting Velocity Components

  - id: q011
    type: numericResponse
    prompt: "Find the magnitude of a force vector $(8,6)$ N."
    answer:
      value: 10
      tolerance: 0.0001
    explanation: |
      $\sqrt{8^2+6^2}=\sqrt{100}=10$ N.

      Related topic: Magnitude of Force Vectors

  - id: q012
    type: numericResponse
    prompt: "A velocity vector has magnitude 20 m/s at $0^\\circ$. What is its x-component?"
    answer:
      value: 20
      tolerance: 0.0001
    explanation: |
      $v_x=20\cos0^\circ=20$ m/s.

      Related topic: Velocity Components

  - id: q013
    type: numericResponse
    prompt: "A force has magnitude 10 N at $90^\\circ$. What is its y-component?"
    answer:
      value: 10
      tolerance: 0.0001
    explanation: |
      $F_y=10\sin90^\circ=10$ N.

      Related topic: Force Components at Special Angles

  - id: q014
    type: freeResponse
    prompt: "Explain why displacement is different from distance traveled."
    answer:
      expected: |
        Displacement is a vector from start to finish, so it includes direction.
        Distance traveled is the total path length and has no direction.
      gradingMode: selfCheck
    explanation: |
      Displacement depends only on the change in position, while distance tracks the full path length.

      Related topic: Displacement Versus Distance

  - id: q015
    type: numericResponse
    prompt: "Two displacement vectors are $(2,3)$ m and $(5,-1)$ m. What is the x-component of their resultant?"
    answer:
      value: 7
      tolerance: 0.0001
    explanation: |
      Add x-components: $2+5=7$.

      Related topic: Resultant Displacement Components
