items:
  - { id: r1, type: typed, prompt: 'Complete the definition: oxidation is ____ of electrons.', answer: { expected: 'loss', aliases: ['loss of electrons', 'electron loss'] }, explanation: 'Solution: Loss. Why it works: Electron loss raises the oxidation number of the oxidized species.' }
  - { id: r2, type: typed, prompt: 'During a redox reaction, what happens to the oxidizing agent?', answer: { expected: 'it is reduced', aliases: ['gains electrons', 'it gains electrons'] }, explanation: 'Solution: It is reduced. Why it works: The oxidizing agent accepts the electrons donated by the reducing agent.' }
  - { id: r3, type: typed, prompt: 'After balancing O with water and H with $H^+$ in an acidic half-reaction, what is used to balance charge?', answer: { expected: 'electrons', aliases: ['e-', 'e^-'] }, explanation: 'Solution: Electrons. Why it works: Electron coefficients adjust charge without changing the atom inventory.' }
  - { id: r4, type: typed, prompt: 'Name the electrode where oxidation occurs in every electrochemical cell.', answer: { expected: 'anode' }, explanation: 'Solution: Anode. Why it works: The electrode name is defined by the reaction occurring there, not by its sign.' }
  - { id: r5, type: typed, prompt: 'State the external electron-flow direction in a galvanic cell.', answer: { expected: 'from anode to cathode', aliases: ['anode to cathode'] }, explanation: 'Solution: From anode to cathode. Why it works: Oxidation releases electrons at the anode and reduction consumes them at the cathode.' }
  - { id: r6, type: typed, prompt: 'In a typical galvanic cell, which salt-bridge ions migrate toward the anode half-cell as positive ions accumulate there?', answer: { expected: 'anions', aliases: ['negative ions'] }, explanation: 'Solution: Anions. Why it works: Their negative charge offsets the cations produced by oxidation at the anode.' }
  - { id: r7, type: typed, prompt: 'State the formula for standard cell potential using tabulated reduction potentials.', answer: { expected: 'cathode reduction potential minus anode reduction potential', aliases: ['Ecell = Ecathode - Eanode', 'E°cell = E°red,cathode - E°red,anode'] }, explanation: 'Solution: $E^\circ_{cell}=E^\circ_{red,cathode}-E^\circ_{red,anode}$. Why it works: The potential difference is measured from the oxidation electrode to the reduction electrode.' }
  - { id: r8, type: typed, prompt: 'For a cell reaction as written under standard conditions, what signs of $E^\circ_{cell}$ and $\Delta G^\circ$ indicate spontaneity?', answer: { expected: 'positive E and negative delta G', aliases: ['E positive and ΔG negative', 'positive cell potential and negative free energy'] }, explanation: 'Solution: $E^\circ_{cell}>0$ and $\Delta G^\circ<0$. Why it works: $\Delta G^\circ=-nFE^\circ_{cell}$ with positive n and F.' }
  - { id: r9, type: typed, prompt: 'State the simplified Nernst equation at 25 C using base-10 logarithms.', answer: { expected: 'E = E° - (0.05916/n) log Q', aliases: ['E=E0-(0.05916/n)logQ'] }, explanation: 'Solution: $E=E^\circ-(0.05916/n)\log Q$. Why it works: The logarithmic term corrects standard potential for the current composition.' }
  - { id: r10, type: typed, prompt: 'State the values or relation among E, Q, and K when a cell reaction reaches equilibrium.', answer: { expected: 'E = 0 and Q = K', aliases: ['zero potential and Q equals K'] }, explanation: 'Solution: $E=0$ and $Q=K$. Why it works: At equilibrium there is no net chemical driving force available for electrical work.' }
  - { id: r11, type: typed, prompt: 'What relation connects charge q, current I, and elapsed time t?', answer: { expected: 'q = It', aliases: ['q=I t', 'charge equals current times time'] }, explanation: 'Solution: $q=It$. Why it works: Current is charge per unit time.' }
  - { id: r12, type: typed, prompt: 'What does $F=96485\ \mathrm{C\,mol^{-1}}$ convert?', answer: { expected: 'charge and moles of electrons', aliases: ['coulombs to moles of electrons', 'moles of electrons to coulombs'] }, explanation: 'Solution: It converts between electric charge and moles of electrons. Why it works: One mole of electrons carries approximately 96485 coulombs.' }
