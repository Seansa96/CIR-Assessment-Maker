  - id: friction-terms
    title: Friction Terms
    entries:
      - { id: static-friction, term: Static friction, definition: 'Contact force that prevents relative slipping and adjusts up to a maximum.', drills: [{ id: fg1, type: cloze, prompt: 'Static friction prevents relative ____.', answer: { expected: slipping, expectedLatex: '', aliases: [sliding], media: [] }, explanation: 'Solution: Slipping.\n\nWhy it works: Static friction acts before surfaces slide.' }] }
      - { id: kinetic-friction, term: Kinetic friction, definition: 'Contact force opposing relative sliding with magnitude $f_k=\mu_kN$.', drills: [{ id: fg2, type: cloze, prompt: 'Kinetic friction occurs during relative ____.', answer: { expected: sliding, expectedLatex: '', aliases: [slip], media: [] }, explanation: 'Solution: Sliding.\n\nWhy it works: Kinetic friction models moving contact.' }] }
      - { id: coefficient, term: Coefficient of friction, definition: 'Dimensionless ratio that relates friction magnitude to normal force.', drills: [{ id: fg3, type: typed, prompt: 'What symbol commonly represents a friction coefficient?', answer: { expected: mu, expectedLatex: '\mu', aliases: [], media: [] }, explanation: 'Solution: $\mu$.\n\nWhy it works: Friction coefficients are denoted by Greek mu.' }] }
      - { id: normal-force, term: Normal force, definition: 'Contact force perpendicular to a surface that sets friction limits.', drills: [{ id: fg4, type: typed, prompt: 'What contact force appears in $f_k=\mu_kN$?', answer: { expected: 'normal force', expectedLatex: 'N', aliases: [normal], media: [] }, explanation: 'Solution: Normal force.\n\nWhy it works: Kinetic friction is proportional to it.' }] }
