workedExamples:
- id: we-sound-intensity
  title: Deriving and applying Sound Intensity
  problem: Use the labeled model to derive and calculate the intensity from $I=P/(4\pi r^2)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: Identify the source power $P$ and the distance $r$ to the observer.
    prompt: Identify the parameters.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Power P and distance r
    explanation: 'Solution: We are given the total acoustic power $P$ and the radial distance $r$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step2
    title: State the assumptions
    instruction: State the assumption about how the sound spreads.
    prompt: What is assumed about emission?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Isotropic spherical emission.
    explanation: 'Solution: Assume it acts as an isotropic point source, radiating spherically in all directions with no reflections.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step3
    title: Name the target
    instruction: Identify the target variable.
    prompt: Name the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Intensity I
    explanation: 'Solution: We want to calculate the sound intensity $I$ in W/m$^2$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step4
    title: Write the governing relation
    instruction: Write the equation relating intensity to power and distance.
    prompt: Write the equation.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - I = P / (4\pi r^2)
    explanation: 'Solution: $I = \frac{P}{4\pi r^2}$\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step5
    title: Isolate the target
    instruction: Isolate the target variable (it is already isolated).
    prompt: Isolate the target.
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - I = P / (4\pi r^2)
    explanation: 'Solution: The equation is ready to use.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step6
    title: Substitute the known values
    instruction: Given a speaker emitting $P = 50.0$ W at a distance $r = 10.0$ m, calculate $I$.
    prompt: Calculate the intensity.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: 'Solution: $I = 50.0 / (4\pi(10.0)^2) = 50 / (1256.6) \approx 0.0398$ W/m$^2$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step7
    title: Check units and limiting behavior
    instruction: Check the units of the calculation.
    prompt: What are the units?
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - W/m^2
    explanation: 'Solution: Watts divided by meters squared yields W/m$^2$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
  - id: step8
    title: State the result
    instruction: State the final calculated intensity.
    prompt: State the result.
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: 'Solution: The intensity is $0.0398$ W/m$^2$.\n\nWhy it works: This step applies the stated physical model and carries its result into the next step.'
- id: sound-decibel-we002
  title: Decibel Change From an Intensity Ratio
  problem: A sound's intensity becomes 100 times greater. Find the increase in sound intensity level.
  steps:
  - id: sound-decibel-we002-step-1
    title: Apply the level-difference relation
    type: symbolicResponse
    prompt: Write the change in level for an intensity ratio $I_2/I_1$.
    answer: {expectedLatex: '\Delta\beta=10\log_{10}\left(\frac{I_2}{I_1}\right)', equivalenceMode: expression, tolerance: 0}
    explanation: 'Solution: Use $\Delta\beta=10\log_{10}(I_2/I_1)$. Why it works: the reference intensity cancels when two sound levels are subtracted.'
  - id: sound-decibel-we002-step-2
    title: Calculate the increase
    type: numericResponse
    prompt: Calculate the level increase in decibels.
    answer: {value: 20, tolerance: 0.01}
    explanation: 'Solution: $10\log_{10}(100)=20\ \text{dB}$. Why it works: a factor of 100 is two factors of ten, each contributing 10 dB.'
