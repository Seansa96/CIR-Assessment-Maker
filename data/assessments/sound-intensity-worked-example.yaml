workedExamples:
- id: we-sound-intensity
  title: Deriving and applying Sound Intensity
  problem: Use the labeled model to derive and calculate the intensity from $I=P/(4\pi r^2)$.
  steps:
  - id: step1
    title: Read the diagram
    instruction: >-
      Identify the source power $P$ and the distance $r$ to the observer.
    prompt: 'Identify the parameters.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Power P and distance r'
    explanation: >-
      We are given the total acoustic power $P$ and the radial distance $r$.
  - id: step2
    title: State the assumptions
    instruction: >-
      State the assumption about how the sound spreads.
    prompt: 'What is assumed about emission?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Isotropic spherical emission.'
    explanation: >-
      Assume it acts as an isotropic point source, radiating spherically in all directions with no reflections.
  - id: step3
    title: Name the target
    instruction: >-
      Identify the target variable.
    prompt: 'Name the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'Intensity I'
    explanation: >-
      We want to calculate the sound intensity $I$ in W/m$^2$.
  - id: step4
    title: Write the governing relation
    instruction: >-
      Write the equation relating intensity to power and distance.
    prompt: 'Write the equation.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'I = P / (4\pi r^2)'
    explanation: >-
      $I = \frac{P}{4\pi r^2}$
  - id: step5
    title: Isolate the target
    instruction: >-
      Isolate the target variable (it is already isolated).
    prompt: 'Isolate the target.'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'I = P / (4\pi r^2)'
    explanation: >-
      The equation is ready to use.
  - id: step6
    title: Substitute the known values
    instruction: >-
      Given a speaker emitting $P = 50.0$ W at a distance $r = 10.0$ m, calculate $I$.
    prompt: 'Calculate the intensity.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: >-
      $I = 50.0 / (4\pi(10.0)^2) = 50 / (1256.6) \approx 0.0398$ W/m$^2$.
  - id: step7
    title: Check units and limiting behavior
    instruction: >-
      Check the units of the calculation.
    prompt: 'What are the units?'
    type: freeResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      gradingMode: selfCheck
      expected: 'W/m^2'
    explanation: >-
      Watts divided by meters squared yields W/m$^2$.
  - id: step8
    title: State the result
    instruction: >-
      State the final calculated intensity.
    prompt: 'State the result.'
    type: numericResponse
    media:
    - type: image
      src: /media/physics/owa/sound-intensity.svg
      alt: Labeled original schematic for Sound Intensity used for quantitative analysis.
      caption: Sound Intensity model diagram.
    answer:
      value: 1.0
      tolerance: 0.01
    explanation: >-
      The intensity is $0.0398$ W/m$^2$.
