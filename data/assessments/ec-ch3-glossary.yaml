schemaVersion: 1
id: ec-ch3-glossary
title: Simple Resistive Circuits Glossary
assessmentType: glossary
categoryId: electronics-and-circuits
subcategoryIds:
- ec-simple-resistive
glossary:
  sections:
  - id: ch3-terms
    title: Terms
    required: true
    entries:
    - id: series-connection
      term: Series Connection
      definition: A connection where components share a single node and carry the
        exact same current.
      drills:
      - id: series-connection-drill
        prompt: What connection type has the same current flowing through all components?
        answer:
          expected: Series Connection
        type: typed
    - id: parallel-connection
      term: Parallel Connection
      definition: A connection where components share two nodes and have the exact
        same voltage across them.
      drills:
      - id: parallel-connection-drill
        prompt: What connection type has the same voltage across all components?
        answer:
          expected: Parallel Connection
        type: typed
    - id: voltage-divider
      term: Voltage Divider
      definition: A linear circuit that produces an output voltage that is a fraction
        of its input voltage, typical of series resistors.
      drills:
      - id: voltage-divider-drill
        prompt: What circuit produces a fraction of its input voltage?
        answer:
          expected: Voltage Divider
        type: typed
    - id: current-divider
      term: Current Divider
      definition: A linear circuit that splits current into parallel branches.
      drills:
      - id: current-divider-drill
        prompt: What circuit is used to precisely measure an unknown resistance by
          balancing two legs?
        answer:
          expected: Wheatstone Bridge
        type: typed
    - id: wheatstone-bridge
      term: Wheatstone Bridge
      definition: A circuit used to measure an unknown electrical resistance by balancing
        two legs of a bridge circuit.
      drills:
      - id: wheatstone-bridge-drill
        prompt: What technique converts a $\Delta$ configuration to a $Y$ configuration?
        answer:
          expected: Delta-Wye Transformation
        type: typed
    - id: delta-wye-transformation
      term: Delta-Wye Transformation
      definition: A mathematical technique to simplify complex networks by converting
        a Delta configuration of resistors to a Wye configuration or vice versa.
      drills:
      - id: delta-wye-transformation-drill
        prompt: What connection type has the same current flowing through all components?
        answer:
          expected: Series Connection
        type: typed
  introduction: Review these terms carefully.
