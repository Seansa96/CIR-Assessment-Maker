- id: we-alternating-series-3
  title: Combine monotonicity, classification, and error control
  problem: |
    Consider
    $$\sum_{n=1}^{\infty}(-1)^{n-1}\frac{n}{n^2+1}.$$
    Prove that it converges conditionally, then find the least $N$ for which
    the alternating-series bound guarantees $|R_N|<0.001$.
  steps:
  - id: step-alternating-series-3-1
    title: Establish decrease and limit zero
    instruction: |
      Let $b_n=n/(n^2+1)$. For $f(x)=x/(x^2+1)$,
      $$f'(x)=\frac{1-x^2}{(x^2+1)^2}\le 0\quad\text{for }x\ge1.$$
      Thus $b_n$ is nonincreasing. Dividing numerator and denominator by $n^2$
      also shows $b_n\to0$.
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: What does this establish for the signed series?
    choices:
    - id: a
      text: It converges by the alternating-series test.
    - id: b
      text: It converges absolutely by the ratio test.
    - id: c
      text: It diverges because $f'(1)=0$.
    - id: d
      text: It telescopes.
    answer:
      choiceId: a
    explanation: |-
      Solution: Nonincreasing magnitudes tending to zero are the alternating-series hypotheses; strict decrease at every index is unnecessary. Therefore the answer is It converges by the alternating-series test.. Therefore the answer is It converges by the alternating-series test.. Therefore the answer is It converges by the alternating-series test.. Therefore the answer is It converges by the alternating-series test.. Therefore the answer is It converges by the alternating-series test.. Therefore the answer is It converges by the alternating-series test..

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

      Why the other choices fail: It converges absolutely by the ratio test. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; It diverges because $f'(1)=0$. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; It telescopes. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
  - id: step-alternating-series-3-2
    title: Rule out absolute convergence
    instruction: |
      Compare the absolute values with the harmonic series:
      $$\lim_{n\to\infty}\frac{n/(n^2+1)}{1/n}
      =\lim_{n\to\infty}\frac{n^2}{n^2+1}=1.$$
      The limit comparison test therefore shows
      $\sum n/(n^2+1)$ diverges.
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Which final classification follows?
    choices:
    - id: a
