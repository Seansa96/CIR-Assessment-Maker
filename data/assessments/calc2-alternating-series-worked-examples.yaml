    - id: b
      text: Absolutely convergent
    - id: c
      text: Divergent by comparison
    - id: d
      text: Inconclusive
    answer:
      choiceId: a
    explanation: |-
      Solution: The signed series converges, but the series of magnitudes diverges. Therefore the answer is Conditionally convergent.

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

      Why the other choices fail: Absolutely convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent by comparison conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Inconclusive conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
  - id: step-alternating-series-3-3
    title: Form the remainder inequality
    instruction: |
      The first omitted magnitude is
