  - id: step-alternating-series-1-4
    title: State the classification
    instruction: 'The signed series converges, while its absolute-value series diverges. By definition,

      the alternating harmonic series is conditionally convergent.

      '
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Which classification includes both established facts?
    choices:
    - id: a
      text: Conditionally convergent
    - id: b
      text: Absolutely convergent
    - id: c
      text: Divergent by the term test
    - id: d
      text: Telescoping
    answer:
      choiceId: a
    explanation: |-
      Solution: Conditional convergence means convergence without absolute convergence. Therefore the answer is Conditionally convergent.

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

      Why the other choices fail: Absolutely convergent conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Divergent by the term test conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; Telescoping conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
- id: we-alternating-series-2
  title: |-
    Guarantee an approximation to $\ln 2$
  problem: |
    The alternating harmonic series satisfies
    $$\ln 2=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}n.$$
    Find the least $N$ for which the partial sum $S_N$ is guaranteed by the
    alternating-series remainder theorem to have error less than $0.01$.
  steps:
  - id: step-alternating-series-2-1
    title: Identify the first omitted magnitude
    instruction: |
      After $N$ terms, the first omitted term has magnitude
      $b_{N+1}=1/(N+1)$. The alternating-series remainder theorem gives
      $|R_N|=|\ln 2-S_N|\le b_{N+1}$.
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Which bound is supplied by the theorem?
    choices:
    - id: a
      text: |-
        $|R_N|\le 1/(N+1)$
    - id: b
      text: |-
        $|R_N|\le 1/N$ only
    - id: c
      text: $|R_N|=1/(N+1)$ for every $N$
    - id: d
      text: |-
        $|R_N|\le 1/(N+1)^2$
    answer:
      choiceId: a
    explanation: |-
      Solution: The theorem bounds the error by the magnitude of the first omitted term; it does not claim equality. Therefore the answer is $|R_N|\le 1/(N+1)$.

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

      Why the other choices fail: $|R_N|\le 1/N$ only conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $|R_N|=1/(N+1)$ for every $N$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $|R_N|\le 1/(N+1)^2$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
  - id: step-alternating-series-2-2
    title: Translate the accuracy requirement
    instruction: |
      To guarantee error strictly below $0.01=1/100$, require
      $$\frac1{N+1}<\frac1{100}.$$
      Because both denominators are positive, this is equivalent to $N+1>100$.
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Which inequality correctly preserves the word “less” in the problem?
    choices:
    - id: a
      text: $N+1>100$
    - id: b
      text: |-
        $N+1\ge 100$
    - id: c
      text: $N+1<100$
    - id: d
      text: |-
        $N+1\le 100$
    answer:
      choiceId: a
    explanation: |-
      Solution: At $N+1=100$, the theorem gives a bound of $0.01$, not a bound strictly smaller than $0.01$. Therefore the answer is $N+1>100$.

      Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

      Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

      Why the other choices fail: $N+1\ge 100$ conflicts with this criterion: Direct comparison uses nonnegative terms; $N+1<100$ conflicts with this criterion: Direct comparison uses nonnegative terms; $N+1\le 100$ conflicts with this criterion: Direct comparison uses nonnegative terms.
  - id: step-alternating-series-2-3
    title: Choose the least integer
    instruction: |
      The least integer satisfying $N+1>100$ is $N=100$. With $N=99$,
      the theorem only yields $|R_{99}|\le 1/100$, so $N=99$ does not meet
      the requested strict guarantee.
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: What is the least acceptable value of $N$?
    choices:
    - id: a
      text: '99'
    - id: b
      text: '100'
    - id: c
      text: '101'
    - id: d
      text: '10'
    answer:
      choiceId: b
    explanation: 'Solution: $N=100$ makes the next magnitude $1/101<0.01$. Therefore the answer is 100.


      Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.


      Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.


      Why the other choices fail: 99 conflicts with this criterion: Direct comparison uses nonnegative terms; 101 conflicts with this criterion: Direct comparison uses nonnegative terms; 10 conflicts with this criterion: Direct comparison uses nonnegative terms.'
  - id: step-alternating-series-2-4
    title: Interpret the guarantee
    instruction: |
      The conclusion is about the error of the partial sum:
      $$\left|\ln 2-S_{100}\right|\le\frac1{101}<0.01.$$
      No decimal evaluation of all 100 terms is needed to prove this guarantee.
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Which statement is justified without computing $S_{100}$?
    choices:
    - id: a
      text: |-
        $S_{100}$ is within $0.01$ of $\ln 2$.
    - id: b
      text: |-
        $S_{100}=\ln 2$ exactly.
    - id: c
      text: |-
        $S_{100}$ differs from $\ln 2$ by exactly $1/101$.
    - id: d
      text: $S_{100}$ is an underestimate because $100$ is even.
    answer:
      choiceId: a
    explanation: |-
      Solution: The remainder theorem provides an upper bound, not an exact error. Therefore the answer is $S_{100}$ is within $0.01$ of $\ln 2$.. Therefore the answer is $S_{100}$ is within $0.01$ of $\ln 2$.. Therefore the answer is $S_{100}$ is within $0.01$ of $\ln 2$.. Therefore the answer is $S_{100}$ is within $0.01$ of $\ln 2$.. Therefore the answer is $S_{100}$ is within $0.01$ of $\ln 2$.. Therefore the answer is $S_{100}$ is within $0.01$ of $\ln 2$..

      Why it works: Convergence of $\sum a_n$ requires the necessary condition $a_n\to0$. A nonzero limit, an infinite limit, or no limit immediately proves divergence.

      Common trap: $a_n\to0$ is necessary but not sufficient; the harmonic series is the standard counterexample.

