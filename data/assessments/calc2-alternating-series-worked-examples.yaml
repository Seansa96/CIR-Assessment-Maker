    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Why does the divergence of the harmonic series matter here?
    choices:
    - id: a
      text: It proves the original series is not absolutely convergent.
    - id: b
      text: It overturns the alternating-series test and proves divergence.
    - id: c
      text: It proves the original series has sum zero.
    - id: d
      text: It shows that $1/n$ does not tend to zero.
    answer:
      choiceId: a
    explanation: |-
      Solution: Absolute convergence is tested using the series of absolute values; the signed series can still converge. Therefore the answer is It proves the original series is not absolutely convergent.. Therefore the answer is It proves the original series is not absolutely convergent.. Therefore the answer is It proves the original series is not absolutely convergent.. Therefore the answer is It proves the original series is not absolutely convergent.. Therefore the answer is It proves the original series is not absolutely convergent.. Therefore the answer is It proves the original series is not absolutely convergent..

