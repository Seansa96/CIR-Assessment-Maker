workedExamples:
  - id: we-alternating-series-1
    title: Classify the alternating harmonic series
    problem: |
      Determine whether
      $$\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n}$$
      converges absolutely, converges conditionally, or diverges. Justify every condition you use.
    steps:
      - id: step-alternating-series-1-1
        title: Isolate the magnitude sequence
        instruction: |
          Write the terms as $(-1)^{n-1}b_n$ with $b_n=1/n$. The alternating-series
          test concerns the positive magnitude sequence $b_n$, not the signed terms.
        type: multipleChoice
        prompt: Which sequence must be checked for decrease and limit zero?
        choices:
          - id: a
            text: '$b_n=1/n$'
          - id: b
            text: '$b_n=(-1)^{n-1}$'
          - id: c
            text: '$b_n=(-1)^{n-1}/n$'
          - id: d
            text: '$b_n=n$'
        answer:
          choiceId: a
        explanation: The theorem is stated for positive magnitudes in a representation $(-1)^{n-1}b_n$.
      - id: step-alternating-series-1-2
        title: Verify the alternating-series hypotheses
        instruction: |
          For every $n\ge 1$, $b_{n+1}=1/(n+1)<1/n=b_n$, so the magnitudes decrease.
          Also, $\lim_{n\to\infty}1/n=0$. Therefore the alternating-series test proves
          convergence of the signed series.
        type: multipleChoice
        prompt: What conclusion follows from these two checks?
        choices:
          - id: a
            text: The signed series converges.
          - id: b
            text: The signed series converges absolutely.
          - id: c
            text: The signed series diverges because its terms alternate.
          - id: d
            text: No conclusion is possible until its exact sum is known.
        answer:
          choiceId: a
        explanation: Decrease and limit zero establish convergence, but not absolute convergence.
      - id: step-alternating-series-1-3
        title: Test absolute convergence separately
        instruction: |
          Taking absolute values removes the signs:
          $$\sum_{n=1}^{\infty}\left|\frac{(-1)^{n-1}}{n}\right|
          =\sum_{n=1}^{\infty}\frac1n.$$
          This is the harmonic series, which diverges.
        type: multipleChoice
        prompt: Why does the divergence of the harmonic series matter here?
        choices:
          - id: a
            text: It proves the original series is not absolutely convergent.
          - id: b
            text: It overturns the alternating-series test and proves divergence.
          - id: c
            text: It proves the original series has sum zero.
          - id: d
            text: It shows that $1/n$ does not tend to zero.
        answer:
          choiceId: a
        explanation: Absolute convergence is tested using the series of absolute values; the signed series can still converge.
      - id: step-alternating-series-1-4
        title: State the classification
        instruction: |
          The signed series converges, while its absolute-value series diverges. By definition,
          the alternating harmonic series is conditionally convergent.
        type: multipleChoice
        prompt: Which classification includes both established facts?
        choices:
          - id: a
            text: Conditionally convergent
          - id: b
            text: Absolutely convergent
          - id: c
            text: Divergent by the term test
          - id: d
            text: Telescoping
        answer:
          choiceId: a
        explanation: Conditional convergence means convergence without absolute convergence.

  - id: we-alternating-series-2
    title: Guarantee an approximation to $\ln 2$
    problem: |
      The alternating harmonic series satisfies
      $$\ln 2=\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}n.$$
      Find the least $N$ for which the partial sum $S_N$ is guaranteed by the
      alternating-series remainder theorem to have error less than $0.01$.
    steps:
      - id: step-alternating-series-2-1
        title: Identify the first omitted magnitude
        instruction: |
          After $N$ terms, the first omitted term has magnitude
          $b_{N+1}=1/(N+1)$. The alternating-series remainder theorem gives
          $|R_N|=|\ln 2-S_N|\le b_{N+1}$.
        type: multipleChoice
        prompt: Which bound is supplied by the theorem?
        choices:
          - id: a
            text: '$|R_N|\le 1/(N+1)$'
          - id: b
            text: '$|R_N|\le 1/N$ only'
          - id: c
            text: '$|R_N|=1/(N+1)$ for every $N$'
          - id: d
            text: '$|R_N|\le 1/(N+1)^2$'
        answer:
          choiceId: a
        explanation: The theorem bounds the error by the magnitude of the first omitted term; it does not claim equality.
      - id: step-alternating-series-2-2
        title: Translate the accuracy requirement
        instruction: |
          To guarantee error strictly below $0.01=1/100$, require
          $$\frac1{N+1}<\frac1{100}.$$
          Because both denominators are positive, this is equivalent to $N+1>100$.
        type: multipleChoice
        prompt: Which inequality correctly preserves the word “less” in the problem?
        choices:
          - id: a
            text: '$N+1>100$'
          - id: b
            text: '$N+1\ge 100$'
          - id: c
            text: '$N+1<100$'
          - id: d
            text: '$N+1\le 100$'
        answer:
          choiceId: a
        explanation: At $N+1=100$, the theorem gives a bound of $0.01$, not a bound strictly smaller than $0.01$.
      - id: step-alternating-series-2-3
        title: Choose the least integer
        instruction: |
          The least integer satisfying $N+1>100$ is $N=100$. With $N=99$,
          the theorem only yields $|R_{99}|\le 1/100$, so $N=99$ does not meet
          the requested strict guarantee.
        type: multipleChoice
        prompt: What is the least acceptable value of $N$?
        choices:
          - id: a
            text: '99'
          - id: b
            text: '100'
          - id: c
            text: '101'
          - id: d
            text: '10'
        answer:
          choiceId: b
        explanation: $N=100$ makes the next magnitude $1/101<0.01$.
      - id: step-alternating-series-2-4
        title: Interpret the guarantee
        instruction: |
          The conclusion is about the error of the partial sum:
          $$\left|\ln 2-S_{100}\right|\le\frac1{101}<0.01.$$
          No decimal evaluation of all 100 terms is needed to prove this guarantee.
        type: multipleChoice
        prompt: Which statement is justified without computing $S_{100}$?
        choices:
          - id: a
            text: '$S_{100}$ is within $0.01$ of $\ln 2$.'
          - id: b
            text: '$S_{100}=\ln 2$ exactly.'
          - id: c
            text: '$S_{100}$ differs from $\ln 2$ by exactly $1/101$.'
          - id: d
            text: '$S_{100}$ is an underestimate because $100$ is even.'
        answer:
          choiceId: a
        explanation: The remainder theorem provides an upper bound, not an exact error.

  - id: we-alternating-series-3
    title: Combine monotonicity, classification, and error control
    problem: |
      Consider
      $$\sum_{n=1}^{\infty}(-1)^{n-1}\frac{n}{n^2+1}.$$
      Prove that it converges conditionally, then find the least $N$ for which
      the alternating-series bound guarantees $|R_N|<0.001$.
    steps:
      - id: step-alternating-series-3-1
        title: Establish decrease and limit zero
        instruction: |
          Let $b_n=n/(n^2+1)$. For $f(x)=x/(x^2+1)$,
          $$f'(x)=\frac{1-x^2}{(x^2+1)^2}\le 0\quad\text{for }x\ge1.$$
          Thus $b_n$ is nonincreasing. Dividing numerator and denominator by $n^2$
          also shows $b_n\to0$.
        type: multipleChoice
        prompt: What does this establish for the signed series?
        choices:
          - id: a
            text: It converges by the alternating-series test.
          - id: b
            text: It converges absolutely by the ratio test.
          - id: c
            text: It diverges because $f'(1)=0$.
          - id: d
            text: It telescopes.
        answer:
          choiceId: a
        explanation: Nonincreasing magnitudes tending to zero are the alternating-series hypotheses; strict decrease at every index is unnecessary.
      - id: step-alternating-series-3-2
        title: Rule out absolute convergence
        instruction: |
          Compare the absolute values with the harmonic series:
          $$\lim_{n\to\infty}\frac{n/(n^2+1)}{1/n}
          =\lim_{n\to\infty}\frac{n^2}{n^2+1}=1.$$
          The limit comparison test therefore shows
          $\sum n/(n^2+1)$ diverges.
        type: multipleChoice
        prompt: Which final classification follows?
        choices:
          - id: a
            text: Conditionally convergent
          - id: b
            text: Absolutely convergent
          - id: c
            text: Divergent by comparison
          - id: d
            text: Inconclusive
        answer:
          choiceId: a
        explanation: The signed series converges, but the series of magnitudes diverges.
      - id: step-alternating-series-3-3
        title: Form the remainder inequality
        instruction: |
          The first omitted magnitude is
          $$b_{N+1}=\frac{N+1}{(N+1)^2+1}.$$
          Put $k=N+1$. The desired sufficient condition is
          $k/(k^2+1)<1/1000$.
        type: multipleChoice
        prompt: Which inequality results after multiplying by the positive quantity $1000(k^2+1)$?
        choices:
          - id: a
            text: '$k^2-1000k+1>0$'
          - id: b
            text: '$k^2-1000k+1<0$'
          - id: c
            text: '$1000k^2-k+1000<0$'
          - id: d
            text: '$k^2+1000k+1>0$'
        answer:
          choiceId: a
        explanation: $1000k<k^2+1$ rearranges to $k^2-1000k+1>0$.
      - id: step-alternating-series-3-4
        title: Find and verify the least index
        instruction: |
          For integer $k\ge1$, test the boundary values:
          $$\frac{999}{999^2+1}>\frac1{1000},
          \qquad
          \frac{1000}{1000^2+1}<\frac1{1000}.$$
          Hence the least $k$ is $1000$, so the least $N=k-1$ is $999$.
        type: multipleChoice
        prompt: Why is checking both $k=999$ and $k=1000$ important?
        choices:
          - id: a
            text: It proves $N=999$ works and that no smaller integer can satisfy the bound.
          - id: b
            text: It proves the remainder equals the first omitted term.
          - id: c
            text: It proves absolute convergence.
          - id: d
            text: It replaces the monotonicity check.
        answer:
          choiceId: a
        explanation: A least-integer claim needs both sufficiency at the candidate and failure immediately below it.
