- id: we-alternating-series-1
  title: Classify the alternating harmonic series
  problem: |
    Determine whether
    $$\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{n}$$
    converges absolutely, converges conditionally, or diverges. Justify every condition you use.
  steps:
  - id: step-alternating-series-1-1
    title: Isolate the magnitude sequence
    instruction: 'Write the terms as $(-1)^{n-1}b_n$ with $b_n=1/n$. The alternating-series

      test concerns the positive magnitude sequence $b_n$, not the signed terms.

      '
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: Which sequence must be checked for decrease and limit zero?
    choices:
    - id: a
      text: $b_n=1/n$
    - id: b
      text: $b_n=(-1)^{n-1}$
    - id: c
      text: $b_n=(-1)^{n-1}/n$
    - id: d
      text: $b_n=n$
    answer:
      choiceId: a
    explanation: |-
      Solution: The theorem is stated for positive magnitudes in a representation $(-1)^{n-1}b_n$. Therefore the answer is $b_n=1/n$.

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

      Why the other choices fail: $b_n=(-1)^{n-1}$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $b_n=(-1)^{n-1}/n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $b_n=n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
  - id: step-alternating-series-1-2
    title: Verify the alternating-series hypotheses
    instruction: |
      For every $n\ge 1$, $b_{n+1}=1/(n+1)<1/n=b_n$, so the magnitudes decrease.
      Also, $\lim_{n\to\infty}1/n=0$. Therefore the alternating-series test proves
      convergence of the signed series.
    type: multipleChoice
    issueSignals:
    - id: alternating-series-test-error
    - id: series-test-selection-error
    - id: p-series-misidentified
    - id: exponent-rule-misapplied
    - id: limit-evaluation-error
    prompt: What conclusion follows from these two checks?
    choices:
    - id: a
      text: The signed series converges.
    - id: b
      text: The signed series converges absolutely.
    - id: c
      text: The signed series diverges because its terms alternate.
    - id: d
      text: No conclusion is possible until its exact sum is known.
    answer:
      choiceId: a
    explanation: |-
      Solution: Decrease and limit zero establish convergence, but not absolute convergence. Therefore the answer is The signed series converges.. Therefore the answer is The signed series converges.. Therefore the answer is The signed series converges.. Therefore the answer is The signed series converges.. Therefore the answer is The signed series converges.. Therefore the answer is The signed series converges..

      Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

      Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

      Why the other choices fail: The signed series converges absolutely. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; The signed series diverges because its terms alternate. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; No conclusion is possible until its exact sum is known. conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
  - id: step-alternating-series-1-3
    title: Test absolute convergence separately
    instruction: |
      Taking absolute values removes the signs:
      $$\sum_{n=1}^{\infty}\left|\frac{(-1)^{n-1}}{n}\right|
      =\sum_{n=1}^{\infty}\frac1n.$$
      This is the harmonic series, which diverges.
