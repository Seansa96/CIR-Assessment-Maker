questions:
- id: q001
  type: multipleChoice
  prompt: Parallel lines $l$ and $m$ are intersected by a transversal $t$. If alternate interior angles
    measure $(3x + 15)^\circ$ and $(5x - 21)^\circ$, what is the measure of these angles?
  difficultyDimensions:
  - Recall that alternate interior angles are equal when lines are parallel.
  - 'Set up equation: $3x + 15 = 5x - 21$.'
  - 'Solve for $x$: $2x = 36 \implies x = 18$.'
  - 'Substitute to find the angle: $3(18) + 15 = 54 + 15 = 69^\circ$.'
  choices:
  - id: a
    text: $18^\circ$
    issueSignals:
    - id: variable-instead-of-angle
      domains: []
  - id: b
    text: $69^\circ$
  - id: c
    text: $111^\circ$
    issueSignals:
    - id: supplementary-confusion
      domains: []
  - id: d
    text: $48^\circ$
    issueSignals:
    - id: algebraic-sign-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    When lines are parallel, alternate interior angles are congruent (equal in measure).

    $3x + 15 = 5x - 21$

    Subtract $3x$ from both sides: $15 = 2x - 21$

    Add 21 to both sides: $36 = 2x$

    $x = 18$.

    Substitute $x$ back into either expression to find the angle:

    $3(18) + 15 = 54 + 15 = 69^\circ$.


    Why it works:

    Transversals crossing parallel lines create exactly two angle measures (one acute, one obtuse), and
    they are supplementary. Alternate interior angles are both acute (or both obtuse), so they must be
    equal.


    Why the other choices fail:

    - $18^\circ$ is the value of $x$, not the angle itself.

    - $111^\circ$ is the supplementary angle to the correct answer ($180 - 69$). This would be the measure
    of the consecutive (same-side) interior angles.

    - $48^\circ$ comes from a sign error when moving terms (e.g., $3x - 15 = 5x - 21$).

    '
- id: q002
  type: multipleChoice
  prompt: Two parallel lines are cut by a transversal. The consecutive (same-side) interior angles measure
    $(2x + 10)^\circ$ and $(3x - 5)^\circ$. What is the value of $x$?
  difficultyDimensions:
  - Recall that consecutive interior angles are supplementary.
  - 'Set up equation: $(2x + 10) + (3x - 5) = 180$.'
  - 'Solve for $x$: $5x + 5 = 180 \implies 5x = 175 \implies x = 35$.'
  choices:
  - id: a
    text: $35$
  - id: b
    text: $15$
    issueSignals:
    - id: equality-instead-of-supplementary
      domains: []
  - id: c
    text: $80$
    issueSignals:
    - id: variable-substitution-error
      domains: []
  - id: d
    text: $100$
    issueSignals:
    - id: angle-instead-of-variable
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    Consecutive (same-side) interior angles are supplementary when the lines are parallel.

    $(2x + 10) + (3x - 5) = 180$

    $5x + 5 = 180$

    $5x = 175$

    $x = 35$.


    Why it works:

    If you slide one intersection down the transversal to lay exactly on top of the other, consecutive
    interior angles will form a linear pair (a straight line), which means they must sum to $180^\circ$.


    Why the other choices fail:

    - $15$ comes from incorrectly setting the angles equal to each other: $2x + 10 = 3x - 5 \implies x
    = 15$.

    - $80$ is the measure of the smaller angle ($2(35) + 10 = 80^\circ$), but the question asked for $x$.

    - $100$ is the measure of the larger angle ($3(35) - 5 = 100^\circ$).

    '
- id: q003
  type: multipleChoice
  prompt: What is the sum of the interior angles of a regular dodecagon (12-sided polygon)?
  difficultyDimensions:
  - Identify $n = 12$.
  - 'Apply the interior angle sum formula: $(n - 2) \times 180^\circ$.'
  - 'Calculate: $10 \times 180 = 1800^\circ$.'
  choices:
  - id: a
    text: $2160^\circ$
    issueSignals:
    - id: formula-n-error
      domains: []
  - id: b
    text: $1800^\circ$
  - id: c
    text: $144^\circ$
    issueSignals:
    - id: single-angle-error
      domains: []
  - id: d
    text: $360^\circ$
    issueSignals:
    - id: exterior-sum-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    A dodecagon has $n = 12$ sides.

    The formula for the sum of the interior angles of an $n$-sided polygon is:

    $\text{Sum} = (n - 2) \times 180^\circ$

    $\text{Sum} = (12 - 2) \times 180^\circ$

    $\text{Sum} = 10 \times 180^\circ = 1800^\circ$.


    Why it works:

    Any polygon can be triangulated by drawing non-intersecting diagonals from a single vertex. An $n$-sided
    polygon will always be split into exactly $n-2$ triangles. Since every triangle contains $180^\circ$
    of interior angle, the total is $(n-2) \times 180^\circ$.


    Why the other choices fail:

    - $2160^\circ$ comes from forgetting to subtract 2 from $n$ before multiplying ($12 \times 180$).

    - $144^\circ$ would be the measure of a *single* interior angle if it were a regular decagon, wait
    no, $1800 / 12 = 150^\circ$. $144^\circ$ is a single angle of a decagon (10 sides).

    - $360^\circ$ is the sum of the *exterior* angles of any convex polygon.

    '
- id: q004
  type: multipleChoice
  prompt: If the measure of one interior angle of a regular polygon is $160^\circ$, how many sides does
    the polygon have?
  difficultyDimensions:
  - 'Use the exterior angle shortcut: Exterior angle = $180^\circ - 160^\circ = 20^\circ$.'
  - Recall the sum of exterior angles is always $360^\circ$.
  - Calculate $n = 360 / 20 = 18$.
  choices:
  - id: a
    text: $16$
    issueSignals:
    - id: division-error
      domains: []
  - id: b
    text: $20$
    issueSignals:
    - id: angle-instead-of-sides
      domains: []
  - id: c
    text: $18$
  - id: d
    text: $14$
    issueSignals:
    - id: interior-formula-algebra-error
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    **Method 1 (Exterior Angle Shortcut):**

    The interior and exterior angles always form a linear pair (they sum to $180^\circ$).

    Exterior angle = $180^\circ - 160^\circ = 20^\circ$.

    The sum of all exterior angles is always $360^\circ$. Since it''s a regular polygon, all $n$ exterior
    angles are equal.

    $n = \frac{360^\circ}{20^\circ} = 18$ sides.


    **Method 2 (Interior Formula):**

    $\frac{(n-2) \times 180}{n} = 160$

    $180n - 360 = 160n$

    $20n = 360 \implies n = 18$.


    Why it works:

    The exterior angle method is vastly superior because the sum of exterior angles is a constant ($360^\circ$),
    regardless of how many sides the polygon has. You never have to deal with the $n-2$ algebra.


    Why the other choices fail:

    - $16$ might come from an arithmetic error $360 / 20 = 16$ or $160 / 10$.

    - $20$ is the measure of the exterior angle in degrees, not the number of sides.

    - $14$ comes from algebraic errors while attempting Method 2.

    '
- id: q005
  type: multipleChoice
  prompt: What is the sum of the exterior angles (one at each vertex) of a convex 50-sided polygon?
  difficultyDimensions:
  - Recall the exterior angle sum theorem for convex polygons.
  - State the sum is always $360^\circ$.
  choices:
  - id: a
    text: $8640^\circ$
    issueSignals:
    - id: interior-sum-confusion
      domains: []
  - id: b
    text: $360^\circ$
  - id: c
    text: $9000^\circ$
    issueSignals:
    - id: formula-n-error
      domains: []
  - id: d
    text: $7.2^\circ$
    issueSignals:
    - id: single-angle-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The sum of the exterior angles of *any* convex polygon is always $360^\circ$, regardless of the number
    of sides.

    Sum = $360^\circ$.


    Why it works:

    Imagine walking around the perimeter of the polygon. At each vertex, you turn by the exterior angle.
    Once you complete the circuit and return to your starting direction, you have made exactly one full
    rotation, which is $360^\circ$. This physical reality is independent of how many turns you took.


    Why the other choices fail:

    - $8640^\circ$ is the sum of the *interior* angles ($(50-2) \times 180$).

    - $9000^\circ$ is $50 \times 180$, forgetting to subtract 2 for the interior sum.

    - $7.2^\circ$ is the measure of a *single* exterior angle if the polygon were regular ($360 / 50$).

    '
- id: q006
  type: multipleChoice
  prompt: In a regular polygon, the interior angle is 4 times as large as the exterior angle. How many
    sides does the polygon have?
  difficultyDimensions:
  - Set exterior angle as $x$ and interior angle as $4x$.
  - 'Use the linear pair property: $x + 4x = 180 \implies 5x = 180 \implies x = 36^\circ$.'
  - 'Use the exterior sum to find $n$: $360 / 36 = 10$.'
  choices:
  - id: a
    text: $8$
    issueSignals:
    - id: division-error
      domains: []
  - id: b
    text: $12$
    issueSignals:
    - id: formula-algebra-error
      domains: []
  - id: c
    text: $10$
  - id: d
    text: $9$
    issueSignals:
    - id: interior-instead-of-exterior
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    Let the exterior angle be $x$.

    The interior angle is $4x$.

    The interior and exterior angles form a straight line, so they sum to $180^\circ$:

    $x + 4x = 180^\circ$

    $5x = 180^\circ$

    $x = 36^\circ$ (the exterior angle).

    Since the sum of all exterior angles is always $360^\circ$:

    Number of sides = $\frac{360^\circ}{36^\circ} = 10$.

    It is a decagon.


    Why it works:

    Using the linear pair ($180^\circ$) to find the exterior angle, and then dividing $360^\circ$ by that
    exterior angle, completely avoids the messier $\frac{(n-2)180}{n}$ formula.


    Why the other choices fail:

    - $8$ might be a guess or an arithmetic error. An octagon has exterior angles of $45^\circ$ and interior
    angles of $135^\circ$ (which is 3 times, not 4 times, as large).

    - $12$ corresponds to a regular dodecagon (exterior $30^\circ$, interior $150^\circ$, which is 5 times
    as large).

    - $9$ is a nonagon (exterior $40^\circ$, interior $140^\circ$, which is 3.5 times as large).

    '
