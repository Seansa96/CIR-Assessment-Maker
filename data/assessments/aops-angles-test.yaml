questions:
- id: q001
  type: multipleChoice
  prompt: 'Convert $\frac{7\pi}{12}$ radians to degrees.'
  choices:
  - {id: a, text: '$75^\circ$'}
  - {id: b, text: '$95^\circ$'}
  - {id: c, text: '$105^\circ$'}
  - {id: d, text: '$120^\circ$'}
  answer: {choiceId: c}
  explanation: 'Multiply by $180/\pi$: $(7\pi/12)(180/\pi)=105^\circ$.'
- id: q002
  type: multipleChoice
  prompt: 'Vertical angles measure $(3x+5)^\circ$ and $(5x-35)^\circ$. Find their common angle measure.'
  choices:
  - {id: a, text: '$20^\circ$'}
  - {id: b, text: '$55^\circ$'}
  - {id: c, text: '$65^\circ$'}
  - {id: d, text: '$115^\circ$'}
  answer: {choiceId: c}
  explanation: Congruence gives $3x+5=5x-35$, so $x=20$ and each angle is $65^\circ$.
- id: q003
  type: multipleChoice
  prompt: 'Adjacent angles forming a line measure $(4x+8)^\circ$ and $(2x+16)^\circ$. What is the larger angle?'
  choices:
  - {id: a, text: '$68^\circ$'}
  - {id: b, text: '$96^\circ$'}
  - {id: c, text: '$104^\circ$'}
  - {id: d, text: '$112^\circ$'}
  answer: {choiceId: d}
  explanation: The angles sum to $180^\circ$, so $6x+24=180$ and $x=26$. The larger angle is $4(26)+8=112^\circ$.
- id: q004
  type: multipleChoice
  prompt: 'Alternate interior angles formed by parallel lines measure $(3x+14)^\circ$ and $(5x-30)^\circ$. Find the angle measure.'
  choices:
  - {id: a, text: '$22^\circ$'}
  - {id: b, text: '$66^\circ$'}
  - {id: c, text: '$80^\circ$'}
  - {id: d, text: '$100^\circ$'}
  answer: {choiceId: c}
  explanation: Set the alternate interior angles equal. Then $3x+14=5x-30$, so $x=22$ and the angle is $80^\circ$.
- id: q005
  type: multipleChoice
  prompt: 'A transversal cuts lines $r$ and $s$. A pair of corresponding angles both measure $73^\circ$. Which conclusion is justified?'
  choices:
  - {id: a, text: '$r\perp s$'}
  - {id: b, text: '$r\parallel s$ by the corresponding-angles converse.'}
  - {id: c, text: The transversal is parallel to both lines.}
  - {id: d, text: No conclusion is possible because corresponding angles cannot be equal.}
  answer: {choiceId: b}
  explanation: Congruent corresponding angles are a sufficient condition for the two lines to be parallel.
- id: q006
  type: multipleChoice
  prompt: 'The two marked sides of the triangle are equal, and the vertex angle is $40^\circ$. What is each base angle?'
  media:
  - type: image
    src: /assessments/aops/aops-angle-isosceles.svg
    alt: Isosceles triangle with two equal sides and a 40-degree vertex angle.
  choices:
  - {id: a, text: '$40^\circ$'}
  - {id: b, text: '$60^\circ$'}
  - {id: c, text: '$70^\circ$'}
  - {id: d, text: '$80^\circ$'}
  answer: {choiceId: c}
  explanation: The base angles are equal and total $180-40=140$ degrees, so each is $70^\circ$.
- id: q007
  type: multipleChoice
  prompt: 'A triangle has remote interior angles $(2x+5)^\circ$ and $(x+10)^\circ$. Its exterior angle is $(5x-15)^\circ$. Find the exterior angle.'
  choices:
  - {id: a, text: '$45^\circ$'}
  - {id: b, text: '$55^\circ$'}
  - {id: c, text: '$60^\circ$'}
  - {id: d, text: '$75^\circ$'}
  answer: {choiceId: c}
  explanation: The exterior-angle theorem gives $5x-15=3x+15$, hence $x=15$ and the exterior angle is $60^\circ$.
- id: q008
  type: multipleChoice
  prompt: 'An inscribed angle measuring $(3x+4)^\circ$ intercepts a $140^\circ$ arc. Find $x$.'
  choices:
  - {id: a, text: '$18$'}
  - {id: b, text: '$22$'}
  - {id: c, text: '$44$'}
  - {id: d, text: '$46$'}
  answer: {choiceId: b}
  explanation: The angle is $140/2=70$ degrees, so $3x+4=70$ and $x=22$.
- id: q009
  type: multipleChoice
  prompt: 'Opposite angles of a cyclic quadrilateral measure $(2x+10)^\circ$ and $(4x+20)^\circ$. Find $x$.'
  choices:
  - {id: a, text: '$15$'}
  - {id: b, text: '$20$'}
  - {id: c, text: '$25$'}
  - {id: d, text: '$30$'}
  answer: {choiceId: c}
  explanation: Opposite cyclic angles are supplementary, so $6x+30=180$ and $x=25$.
- id: q010
  type: multipleChoice
  prompt: 'Two chords intersect inside a circle. The intercepted arcs for an angle and its vertical angle measure $86^\circ$ and $54^\circ$. Find the angle.'
  choices:
  - {id: a, text: '$16^\circ$'}
  - {id: b, text: '$35^\circ$'}
  - {id: c, text: '$70^\circ$'}
  - {id: d, text: '$140^\circ$'}
  answer: {choiceId: c}
  explanation: An angle formed by intersecting chords inside a circle is half the sum of the intercepted arcs, so $(86+54)/2=70$ degrees.
- id: q011
  type: multipleChoice
  prompt: 'Two secants meet outside a circle and intercept arcs of $210^\circ$ and $74^\circ$. Find the exterior angle.'
  choices:
  - {id: a, text: '$34^\circ$'}
  - {id: b, text: '$68^\circ$'}
  - {id: c, text: '$142^\circ$'}
  - {id: d, text: '$284^\circ$'}
  answer: {choiceId: b}
  explanation: The exterior angle is half the difference of the arcs, so $(210-74)/2=68$ degrees.
- id: q012
  type: multipleChoice
  prompt: 'A tangent-chord angle measures $(4x+2)^\circ$ and intercepts an arc of $116^\circ$. Find $x$.'
  choices:
  - {id: a, text: '$12$'}
  - {id: b, text: '$14$'}
  - {id: c, text: '$28$'}
  - {id: d, text: '$29$'}
  answer: {choiceId: b}
  explanation: The angle is half the intercepted arc, or $58^\circ$. Thus $4x+2=58$ and $x=14$.
- id: q013
  type: selectAll
  prompt: 'Which observations are each sufficient by themselves to prove that two lines cut by a transversal are parallel?'
  choices:
  - {id: a, text: A pair of corresponding angles is congruent.}
  - {id: b, text: A pair of alternate interior angles is congruent.}
  - {id: c, text: A pair of same-side interior angles is supplementary.}
  - {id: d, text: A pair of vertical angles is congruent.}
  answer: {choiceIds: [a, b, c]}
  explanation: The first three are parallel-line converses. Vertical angles are congruent at every intersection and do not compare the two lines.
- id: q014
  type: selectAll
  prompt: 'Which angle formulas correctly match the position of the angle vertex?'
  choices:
  - {id: a, text: A vertex at the center gives the full measure of its intercepted arc.}
  - {id: b, text: A vertex on the circle gives half the measure of its intercepted arc.}
  - {id: c, text: A vertex inside at intersecting chords gives half the sum of two intercepted arcs.}
  - {id: d, text: A vertex outside at two secants gives half the sum of the intercepted arcs.}
  answer: {choiceIds: [a, b, c]}
  explanation: The outside-secant formula uses half the positive difference of the far and near arcs, not the sum.
- id: q015
  type: freeResponse
  prompt: Prove that an inscribed angle intercepting a diameter is a right angle. Your proof must explain why the result is structural rather than a consequence of the drawing.
  media:
  - type: image
    src: /assessments/aops/aops-angle-diameter.svg
    alt: Circle with diameter AB, center O, and point C on the circle joined to A, O, and B.
  answer:
    gradingMode: selfCheck
    expected: 'Let $AOB$ be a diameter and let $C$ lie on the circle. Join $C$ to $O$. Because $OA=OC$ and $OB=OC$, triangles $AOC$ and $BOC$ are isosceles. If $\angle ACO=\alpha$ and $\angle OCB=\beta$, then the corresponding central angles are $180^\circ-2\alpha$ and $180^\circ-2\beta$. Those central angles form the straight angle $AOB$, so $(180-2\alpha)+(180-2\beta)=180$. Hence $\alpha+\beta=90^\circ$, and $\angle ACB=90^\circ$.'
    keyPoints:
    - Uses radii to identify two isosceles triangles.
    - Expresses the two central angles in terms of the base angles.
    - Uses the straight angle along the diameter.
    - Concludes that the inscribed angle is $90^\circ$.
  explanation: Equal radii and the straight central angle force the right angle for every point $C$ on the semicircle.
