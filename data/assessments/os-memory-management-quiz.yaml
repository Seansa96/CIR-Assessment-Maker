- id: q004
  title: Explain Free memory management
  type: freeResponse
  prompt: 'In a short answer, explain why **Free memory management** matters in Memory Management.

    '
  answer:
    expected: 'The OS tracks free and allocated memory using structures such as bitmaps or free lists. A complete answer should
      also note that fragmentation can make free memory hard to use even when total free space seems large.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Free memory management
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Memory Management. The key is to connect the term to what the OS controls or protects.

    '
