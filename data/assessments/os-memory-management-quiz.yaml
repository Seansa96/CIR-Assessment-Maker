questions:
- id: q001
  title: Recognize No abstraction problem
  type: multipleChoice
  prompt: 'Which statement best describes **No abstraction problem** in operating systems?

    '
  choices:
  - id: a
    text: Without memory abstraction, programs can interfere with each other and must know physical placement details.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'Without memory abstraction, programs can interfere with each other and must know physical placement details.
    The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
