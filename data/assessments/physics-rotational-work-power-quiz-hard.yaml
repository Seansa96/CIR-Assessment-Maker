questions:
- id: q1
  type: numericResponse
  prompt: A motor delivers $500 \text{ W}$ of power to maintain a flywheel spinning
    at a constant $50 \text{ rad/s}$. What is the frictional torque opposing the motor?
  answer:
    value: 10.0
    tolerance: 0.5
  explanation: $P = \tau\omega \implies \tau = P/\omega = 500 / 50 = 10 \text{ N}\cdot\text{m}$.
