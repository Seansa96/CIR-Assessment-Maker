questions:
- id: q001
  title: Variable torque work
  type: numericResponse
  prompt: |-
    A torque varies as $\tau=4\theta$ from $0$ to $3.0\text{ rad}$. How much work is done?
  answer:
    value: 18.0
    tolerance: 0.2
  explanation: |
    Solution: $W=\int_0^3 4\theta\,d\theta=2\theta^2\big|_0^3=18$ J.

    Why it works: Rotational work is the area under a torque-versus-angle relation, so a variable torque must be integrated.
  difficultyDimensions: [symbolicManipulation, modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [variableTorque]
  difficultyEvidence: A torque function must be integrated over angular displacement rather than treated as a constant.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q002
  title: Power from rpm
  type: numericResponse
  prompt: |-
    A motor provides $25\text{ N}\cdot\text{m}$ while spinning at $240\text{ rpm}$. What is power?
  answer:
    value: 628.3
    tolerance: 3.0
  explanation: |
    Solution: $240$ rpm is $240(2\pi/60)=8\pi$ rad/s. Thus $P=\tau\omega=25(8\pi)=628.3$ W.

    Why it works: Instantaneous rotational power equals torque times angular speed, after the rate is expressed in radians per second.
  difficultyDimensions: [unitConversion, modelOrDerivation, unitAnalysis]
  subjectDifficultyTags: [rotationalPower]
  difficultyEvidence: The applied rotational relation requires a rate-unit conversion before calculating power.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q003
  title: Work between speeds
  type: numericResponse
  prompt: |-
    A flywheel with $I=3.0$ speeds from $4$ to $10\text{ rad/s}$. How much work is required?
  answer:
    value: 126.0
    tolerance: 0.5
  explanation: |
    Solution: $W=\Delta K_{rot}=\tfrac12I(\omega_f^2-\omega_i^2)=1.5(100-16)=126$ J.

    Why it works: Net rotational work changes rotational kinetic energy, so only the initial and final angular speeds are needed.
  difficultyDimensions: [modelOrDerivation, simplification, representationTransfer]
  subjectDifficultyTags: [workEnergy]
  difficultyEvidence: A speed change is modeled through rotational kinetic energy rather than an unspecified torque history.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q004
  title: Average torque
  type: numericResponse
  prompt: |-
    A wheel gains $500\text{ J}$ over $20\text{ rad}$. What average torque acted?
  answer:
    value: 25.0
    tolerance: 0.2
  explanation: |
    Solution: $\tau_{avg}=W/\Delta\theta=500/20=25$ N m.

    Why it works: Average torque is the constant torque that would do the same work through the stated angular displacement.
  difficultyDimensions: [reverseReasoning, modelOrDerivation, unitAnalysis]
  subjectDifficultyTags: [averageTorque]
  difficultyEvidence: The work relation is inverted to infer an effective torque from energy and angle data.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q005
  title: Torque-angle graph
  type: multipleChoice
  prompt: |-
    On a $\tau$ versus $\theta$ graph, work is:
  choices:
  - id: a
    text: |-
      area under the curve
  - id: b
    text: |-
      slope of the curve
  - id: c
    text: |-
      final angle only
  - id: d
    text: |-
      maximum torque only
  answer:
    choiceId: a
  explanation: |
    Solution: Work is the area under the curve.

    Why it works: $W=\int\tau\,d\theta$, so summing torque times small angular intervals is the geometric area on a torque-angle graph.

    Why the other choices fail: Slope describes how torque changes with angle, while final angle or maximum torque alone omits the accumulated rotational work.
  difficultyDimensions: [representationTransfer, modelOrDerivation, errorDiagnosis]
  subjectDifficultyTags: [torqueAngleGraph]
  difficultyEvidence: An integral relation is interpreted as a graphical area rather than a numerical substitution.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q006
  title: Stopping angle
  type: numericResponse
  prompt: |-
    A wheel with $K_{rot}=240\text{ J}$ is stopped by $12\text{ N}\cdot\text{m}$ of braking torque. Through what angle does it turn?
  answer:
    value: 20.0
    tolerance: 0.2
  explanation: |
    Solution: The brake removes 240 J, so $240=(12)\theta$ and $\theta=20$ rad.

    Why it works: A constant opposing torque does negative work whose magnitude equals the rotational kinetic energy removed.
  difficultyDimensions: [signConvention, reverseReasoning, modelOrDerivation]
  subjectDifficultyTags: [brakingWork]
  difficultyEvidence: The sign of braking work is interpreted before using its magnitude to infer stopping angle.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q007
  title: Torque from power
  type: numericResponse
  prompt: |-
    A machine delivers $1500\text{ W}$ at $50\text{ rad/s}$. What torque is delivered?
  answer:
    value: 30.0
    tolerance: 0.2
  explanation: |
    Solution: $\tau=P/\omega=1500/50=30$ N m.

    Why it works: The power relation $P=\tau\omega$ can be rearranged when the angular speed and delivered power are known.
  difficultyDimensions: [reverseReasoning, modelOrDerivation, unitAnalysis]
  subjectDifficultyTags: [powerToTorque]
  difficultyEvidence: A rotational power relation is algebraically inverted with compatible watt, radian-per-second, and torque units.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q008
  title: Opposing torques work
  type: numericResponse
  prompt: |-
    Driving torque is $18\text{ N}\cdot\text{m}$ and resistive torque is $5\text{ N}\cdot\text{m}$ through $8\text{ rad}$. What net work is done?
  answer:
    value: 104.0
    tolerance: 0.5
  explanation: |
    Solution: $\tau_{net}=18-5=13$ N m, then $W_{net}=\tau_{net}\Delta\theta=(13)(8)=104$ J.

    Why it works: Opposing torques combine algebraically; the net torque is the one that determines net work and the kinetic-energy change.
  difficultyDimensions: [signConvention, multiStep, modelOrDerivation]
  subjectDifficultyTags: [netWork]
  difficultyEvidence: Competing rotational effects must be combined before work is calculated.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q009
  title: Power sign
  type: multipleChoice
  prompt: |-
    If torque and angular velocity have opposite signs, instantaneous power is:
  choices:
  - id: a
    text: |-
      negative
  - id: b
    text: |-
      positive
  - id: c
    text: |-
      zero always
  - id: d
    text: |-
      undefined
  answer:
    choiceId: a
  explanation: |
    Solution: The instantaneous power is negative.

    Why it works: $P=\tau\omega$; opposite signs give a negative product, indicating rotational energy is being removed.

    Why the other choices fail: Opposite signs are not zero or undefined, and a positive product would require torque and angular velocity in the same rotational direction.
  difficultyDimensions: [signConvention, qualitativeCheck, errorDiagnosis]
  subjectDifficultyTags: [powerSign]
  difficultyEvidence: The sign of a scalar product is interpreted physically as energy removal rather than merely computed.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
- id: q010
  title: Final omega from torque
  type: numericResponse
  prompt: |-
    A $6.0\text{ N}\cdot\text{m}$ torque acts through $15\text{ rad}$ on $I=5.0$ initially at rest. What is $\omega_f$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: |
    Solution: $W=\tau\Delta\theta=(6.0)(15)=90$ J. Set this equal to $\tfrac12(5.0)\omega_f^2$, giving $\omega_f=6.0$ rad/s.

    Why it works: With the wheel starting from rest, applied work becomes entirely rotational kinetic energy.
  difficultyDimensions: [multiStep, modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [workToAngularSpeed]
  difficultyEvidence: Torque work must be connected to a kinetic-energy change to infer a final rotational speed.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-rotational-work-power]
