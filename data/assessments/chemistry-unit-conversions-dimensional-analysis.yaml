schemaVersion: 1
id: chemistry-unit-conversions-dimensional-analysis
title: Unit Conversions and Dimensional Analysis
assessmentType: quiz
categoryId: chemistry
subcategoryId: chemistry-measurements
subcategoryIds:
  - chemistry-units
modeDefault: practice
randomizeQuestions: true
questionTimerSeconds:
assessmentTimerSeconds:
questions:
  - id: q001
    type: multipleChoice
    prompt: "What is dimensional analysis mainly used for?"
    choices:
      - id: a
        text: "Converting units using conversion factors"
      - id: b
        text: "Naming compounds only"
      - id: c
        text: "Balancing charges only"
      - id: d
        text: "Drawing atoms only"
    answer: { choiceId: a }
    explanation: |
      Dimensional analysis tracks units so unwanted units cancel and desired units remain.

      Related topic: Dimensional Analysis
  - id: q002
    type: multipleChoice
    prompt: "Which conversion factor converts meters to centimeters?"
    choices:
      - id: a
        text: "100 cm / 1 m"
      - id: b
        text: "1 cm / 100 m"
      - id: c
        text: "1 m / 1000 cm"
      - id: d
        text: "10 cm / 1 m"
    answer: { choiceId: a }
    explanation: |
      There are 100 centimeters in 1 meter.

      Related topic: Metric Length Conversions
  - id: q003
    type: multipleChoice
    prompt: "Convert 2.5 m to centimeters."
    choices:
      - id: a
        text: "250 cm"
      - id: b
        text: "25 cm"
      - id: c
        text: "0.025 cm"
      - id: d
        text: "2500 cm"
    answer: { choiceId: a }
    explanation: |
      $2.5\text{ m}\times100\text{ cm}/1\text{ m}=250\text{ cm}$.

      Related topic: Meter to Centimeter Conversion
  - id: q004
    type: multipleChoice
    prompt: "How many milliliters are in 1 liter?"
    choices:
      - id: a
        text: "1000 mL"
      - id: b
        text: "100 mL"
      - id: c
        text: "10 mL"
      - id: d
        text: "0.001 mL"
    answer: { choiceId: a }
    explanation: |
      Milli- means one-thousandth, so 1000 milliliters make 1 liter.

      Related topic: Liter and Milliliter Conversion
  - id: q005
    type: multipleChoice
    prompt: "Convert 0.750 L to milliliters."
    choices:
      - id: a
        text: "750 mL"
      - id: b
        text: "75.0 mL"
      - id: c
        text: "0.750 mL"
      - id: d
        text: "7500 mL"
    answer: { choiceId: a }
    explanation: |
      $0.750\text{ L}\times1000\text{ mL}/1\text{ L}=750\text{ mL}$.

      Related topic: Volume Unit Conversion
  - id: q006
    type: multipleChoice
    prompt: "How many grams are in 1 kilogram?"
    choices:
      - id: a
        text: "1000 g"
      - id: b
        text: "100 g"
      - id: c
        text: "10 g"
      - id: d
        text: "0.001 g"
    answer: { choiceId: a }
    explanation: |
      Kilo- means one thousand.

      Related topic: Kilogram to Gram Conversion
  - id: q007
    type: multipleChoice
    prompt: "Convert 45 mg to grams."
    choices:
      - id: a
        text: "0.045 g"
      - id: b
        text: "45,000 g"
      - id: c
        text: "4.5 g"
      - id: d
        text: "0.45 g"
    answer: { choiceId: a }
    explanation: |
      Since $1000\text{ mg}=1\text{ g}$, $45\text{ mg}=0.045\text{ g}$.

      Related topic: Milligram to Gram Conversion
  - id: q008
    type: multipleChoice
    prompt: "Which setup converts 12 inches to centimeters using 1 inch = 2.54 cm?"
    choices:
      - id: a
        text: "12 in x 2.54 cm / 1 in"
      - id: b
        text: "12 in x 1 in / 2.54 cm"
      - id: c
        text: "12 cm x 2.54 in / 1 cm"
      - id: d
        text: "12 / 2.54 in"
    answer: { choiceId: a }
    explanation: |
      Inches must cancel, leaving centimeters.

      Related topic: Unit Cancellation
  - id: q009
    type: multipleChoice
    prompt: "Convert 12 inches to centimeters."
    choices:
      - id: a
        text: "30.48 cm"
      - id: b
        text: "4.72 cm"
      - id: c
        text: "14.54 cm"
      - id: d
        text: "0.212 cm"
    answer: { choiceId: a }
    explanation: |
      $12\times2.54=30.48$.

      Related topic: English-Metric Conversion
  - id: q010
    type: multipleChoice
    prompt: "Which conversion factor would convert hours to minutes?"
    choices:
      - id: a
        text: "60 min / 1 h"
      - id: b
        text: "1 min / 60 h"
      - id: c
        text: "24 h / 1 day"
      - id: d
        text: "1 h / 24 min"
    answer: { choiceId: a }
    explanation: |
      Hours cancel when hours are in the denominator of the conversion factor.

      Related topic: Time Unit Conversions
  - id: q011
    type: multipleChoice
    prompt: "Convert 2.0 hours to minutes."
    choices:
      - id: a
        text: "120 min"
      - id: b
        text: "30 min"
      - id: c
        text: "60 min"
      - id: d
        text: "2 min"
    answer: { choiceId: a }
    explanation: |
      $2.0\text{ h}\times60\text{ min}/1\text{ h}=120\text{ min}$.

      Related topic: Multi-Step Unit Setup
  - id: q012
    type: multipleChoice
    prompt: "A car travels 60 miles in 2 hours. What is its average speed?"
    choices:
      - id: a
        text: "30 miles/hour"
      - id: b
        text: "120 miles/hour"
      - id: c
        text: "62 miles/hour"
      - id: d
        text: "58 miles/hour"
    answer: { choiceId: a }
    explanation: |
      Average speed is distance divided by time.

      Related topic: Derived Units
  - id: q013
    type: multipleChoice
    prompt: "If density is 2.0 g/mL and volume is 5.0 mL, what is mass?"
    choices:
      - id: a
        text: "10 g"
      - id: b
        text: "2.5 g"
      - id: c
        text: "7.0 g"
      - id: d
        text: "0.40 g"
    answer: { choiceId: a }
    explanation: |
      $m=dV=(2.0\text{ g/mL})(5.0\text{ mL})=10\text{ g}$.

      Related topic: Density as a Conversion Factor
  - id: q014
    type: multipleChoice
    prompt: "If a medicine dose is 5 mg per kg, how much is needed for a 10 kg patient?"
    choices:
      - id: a
        text: "50 mg"
      - id: b
        text: "2 mg"
      - id: c
        text: "15 mg"
      - id: d
        text: "0.5 mg"
    answer: { choiceId: a }
    explanation: |
      $10\text{ kg}\times5\text{ mg/kg}=50\text{ mg}$.

      Related topic: Rate-Based Conversion Factors
  - id: q015
    type: multipleChoice
    prompt: "What should happen to units you do not want in dimensional analysis?"
    choices:
      - id: a
        text: "They should cancel"
      - id: b
        text: "They should be ignored"
      - id: c
        text: "They should be copied to the final answer"
      - id: d
        text: "They should be squared"
    answer: { choiceId: a }
    explanation: |
      Unit cancellation is the main bookkeeping tool in dimensional analysis.

      Related topic: Unit Cancellation
  - id: q016
    type: multipleChoice
    prompt: "Convert 3.0 days to hours."
    choices:
      - id: a
        text: "72 h"
      - id: b
        text: "24 h"
      - id: c
        text: "0.125 h"
      - id: d
        text: "30 h"
    answer: { choiceId: a }
    explanation: |
      $3.0\text{ days}\times24\text{ h/day}=72\text{ h}$.

      Related topic: Day to Hour Conversion
  - id: q017
    type: multipleChoice
    prompt: "Which setup converts 2.0 g/mL to g/L?"
    choices:
      - id: a
        text: "2.0 g/mL x 1000 mL / 1 L"
      - id: b
        text: "2.0 g/mL x 1 L / 1000 mL"
      - id: c
        text: "2.0 g/mL x 1 mL / 1000 L"
      - id: d
        text: "2.0 g/mL x 1 g / 1 L"
    answer: { choiceId: a }
    explanation: |
      Milliliters must cancel from the denominator, so the conversion factor needs mL in the numerator.

      Related topic: Converting Compound Units
  - id: q018
    type: multipleChoice
    prompt: "What is 2.0 g/mL in g/L?"
    choices:
      - id: a
        text: "2000 g/L"
      - id: b
        text: "0.002 g/L"
      - id: c
        text: "2.0 g/L"
      - id: d
        text: "500 g/L"
    answer: { choiceId: a }
    explanation: |
      $2.0\text{ g/mL}\times1000\text{ mL/L}=2000\text{ g/L}$.

      Related topic: Compound Unit Conversion
  - id: q019
    type: multipleChoice
    prompt: "Which statement about conversion factors is true?"
    choices:
      - id: a
        text: "They are ratios equal to 1"
      - id: b
        text: "They always change the actual amount"
      - id: c
        text: "They cannot use metric prefixes"
      - id: d
        text: "They remove the need for units"
    answer: { choiceId: a }
    explanation: |
      Conversion factors multiply by 1 in a form that changes units.

      Related topic: Conversion Factor Meaning
  - id: q020
    type: multipleChoice
    prompt: "What is the best way to check a conversion setup before calculating?"
    choices:
      - id: a
        text: "Verify that unwanted units cancel and desired units remain"
      - id: b
        text: "Ignore units and multiply all numbers"
      - id: c
        text: "Round before setting up"
      - id: d
        text: "Always divide by the largest number"
    answer: { choiceId: a }
    explanation: |
      Correct units are a strong sign that the conversion setup is arranged properly.

      Related topic: Checking Dimensional Analysis


