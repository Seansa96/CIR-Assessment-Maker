workedExamples:
  - id: we-rollercoaster-energy
    title: Energy in a Rollercoaster Loop
    problem: |-
      A rollercoaster car of mass $m$ starts from rest at the top of a hill of height $H$. It descends the hill and enters a vertical loop of radius $R$. Assume friction and air resistance are negligible.

      Using **conservation of energy**, determine the minimum height $H$ required for the car to successfully complete the loop without falling off the track at the highest point.

      After establishing the symbolic relationship, calculate the minimum starting height $H$ if the loop has a radius $R = 15 \text{ m}$.

      ![Rollercoaster loop diagram showing start height, loop radius, top-of-loop height, and downward forces at the top](/media/physics/worked-examples/rollercoaster-loop-energy.svg)
    steps:
      - id: step-we-rollercoaster-energy-1
        title: Conceptualize the Physics at the Top of the Loop
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        explanation: |
          Solution: At the threshold, $N=0$ and $v_{top}^2=gR$.

          Why it works: Gravity alone supplies the required centripetal force when contact is just maintained.
        instruction: |-
          To find the minimum height $H$, we must first understand the condition for the car to "just barely" make it around the top of the loop.

          At the top of the loop, two forces act on the car:
          1.  **Gravity** ($mg$) acting downwards.
          2.  **Normal Force** ($N$) from the track, also acting downwards.

          These forces provide the centripetal acceleration required to keep the car moving in a circle of radius $R$:
          $$mg + N = \frac{mv_{top}^2}{R}$$

          The "minimum speed" condition occurs when the car is just about to fall off the track. At this exact threshold, the track is no longer pushing on the car, meaning the normal force $N = 0$.

          Setting $N = 0$, we find the minimum required speed at the top of the loop ($v_{top}$):
          $$mg = \frac{mv_{top}^2}{R}$$
          $$v_{top}^2 = gR$$
      - id: step-we-rollercoaster-energy-2
        title: Set up the Conservation of Energy Equation Symbolically
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        explanation: |
          Solution: $mgH=\tfrac12mv_{top}^2+mg(2R)$.

          Why it works: Mechanical energy is conserved from the start height to the loop top.
        instruction: |-
          Now we use conservation of mechanical energy to relate the initial state (at height $H$) to the final state (at the top of the loop, height $2R$).

          Since there are no non-conservative forces doing work, total energy is conserved:
          $$E_{initial} = E_{top}$$
          $$K_{initial} + U_{initial} = K_{top} + U_{top}$$

          **Initial State (top of hill):**
          The car starts from rest, so $K_{initial} = 0$.
          The potential energy is $U_{initial} = mgH$.

          **Final State (top of loop):**
          The car is moving with speed $v_{top}$, so $K_{top} = \frac{1}{2}mv_{top}^2$.
          The car is at a height of $2R$ (the diameter of the loop), so $U_{top} = mg(2R)$.

          Equating the two states:
          $$mgH = \frac{1}{2}mv_{top}^2 + mg(2R)$$
      - id: step-we-rollercoaster-energy-3
        title: Solve for the Minimum Height Symbolically
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        explanation: |
          Solution: Substitute $v_{top}^2=gR$ to obtain $H=2.5R$.

          Why it works: Mass and $g$ cancel from every term in the energy equation.
        instruction: |-
          We substitute our threshold condition $v_{top}^2 = gR$ into the energy equation:
          $$mgH = \frac{1}{2}m(gR) + mg(2R)$$

          Notice that the mass $m$ and gravitational acceleration $g$ appear in every term, so they cancel out:
          $$H = \frac{1}{2}R + 2R$$
          $$H = 2.5R$$

          This elegant symbolic result tells us that regardless of the mass of the rollercoaster car, or even the gravity of the planet you are on, the starting hill must be exactly 2.5 times the radius of the loop for the car to safely make it through.
      - id: step-we-rollercoaster-energy-4
        title: Substitute Numerical Values
        type: freeResponse
        prompt: Did you understand this step?
        answer:
          gradingMode: selfCheck
        explanation: |
          Solution: For $R=15$ m, $H=2.5R=37.5$ m.

          Why it works: The symbolic threshold relation applies to any loop radius under the stated ideal assumptions.
        instruction: |-
          With our symbolic relationship established, the numerical calculation is straightforward.

          Given a loop radius $R = 15 \text{ m}$:
          $$H = 2.5(15 \text{ m})$$
          $$H = 37.5 \text{ m}$$

          The rollercoaster must start from a minimum height of $37.5 \text{ m}$ to successfully complete a $15 \text{ m}$ radius loop.

  - id: we-rollercoaster-speed
    title: Find Speed from a Frictionless Height Drop
    problem: A rollercoaster car starts from rest 20 m above a lower point on a frictionless track. Find its speed at the lower point using $g=9.8$ m/s$^2$.
    steps:
      - id: roller-speed-1
        title: State the energy equation
        type: freeResponse
        prompt: Which energy equation connects the initial and final states?
        answer:
          gradingMode: selfCheck
          keyPoints: ['$mgh=\frac12mv^2$', '$K_i+U_i=K_f+U_f$']
        instruction: The car starts at rest and the lower point is chosen as zero gravitational potential energy.
        explanation: |
          Solution: $mgh=\tfrac12mv^2$.

          Why it works: With no friction or drag, mechanical energy is conserved.
      - id: roller-speed-2
        title: Solve for the speed
        type: numericResponse
        prompt: What is the speed in m/s?
        choices: []
        answer: { value: 19.79899, tolerance: 0.001 }
        instruction: Solve $v=\sqrt{2gh}$.
        explanation: |
          Solution: $v=\sqrt{2(9.8)(20)}=19.8$ m/s.

          Why it works: The car's lost gravitational potential energy becomes kinetic energy.
