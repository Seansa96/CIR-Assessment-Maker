questions:
  - id: test-hard-matrix-polynomial
    type: multipleChoice
    prompt: |
      Let $A$ be a square $n \times n$ matrix. If $A^2 - 3A + 2I = 0$ (where $I$ is the identity matrix and $0$ is the zero matrix), which of the following is an expression for $A^3$?
    choices:
      - id: c1
        text: '$A^3 = 7A - 6I$'
      - id: c2
        text: '$A^3 = 3A^2 - 2A$'
      - id: c3
        text: '$A^3 = 9A - 4I$'
      - id: c4
        text: '$A^3 = A + 2I$'
    answer:
      choiceId: c1
    explanation: |
      From the given equation, $A^2 = 3A - 2I$. Multiply both sides by $A$: $A^3 = 3A^2 - 2A$. Now substitute $A^2$ back in: $A^3 = 3(3A - 2I) - 2A = 9A - 6I - 2A = 7A - 6I$.

  - id: test-hard-vector-span-logic
    type: multipleChoice
    prompt: |
      Let $\vec{v}_1, \vec{v}_2, \vec{v}_3$ be vectors in $\mathbb{R}^3$. If $\vec{v}_3 = 2\vec{v}_1 - \vec{v}_2$, which of the following is necessarily true about the linear combination $c_1\vec{v}_1 + c_2\vec{v}_2 + c_3\vec{v}_3$?
    choices:
      - id: c1
        text: 'It can be rewritten entirely in terms of $\vec{v}_1$ and $\vec{v}_2$.'
      - id: c2
        text: 'It must equal the zero vector.'
      - id: c3
        text: 'The vectors $\vec{v}_1, \vec{v}_2, \vec{v}_3$ form a basis for $\mathbb{R}^3$.'
      - id: c4
        text: '$\vec{v}_1$ and $\vec{v}_2$ must be multiples of each other.'
    answer:
      choiceId: c1
    explanation: |
      Substitute $\vec{v}_3$: $c_1\vec{v}_1 + c_2\vec{v}_2 + c_3(2\vec{v}_1 - \vec{v}_2) = (c_1 + 2c_3)\vec{v}_1 + (c_2 - c_3)\vec{v}_2$. Since $\vec{v}_3$ is already a linear combination of the other two, adding it doesn't provide any "new" directions.

  - id: test-hard-transpose-algebra
    type: multipleChoice
    prompt: |
      Simplify the matrix expression: $((AB)^T + C^T)^T$ assuming all matrices are $n \times n$.
    choices:
      - id: c1
        text: '$AB + C$'
      - id: c2
        text: '$B^TA^T + C$'
      - id: c3
        text: '$A^TB^T + C^T$'
      - id: c4
        text: '$BA + C$'
    answer:
      choiceId: c1
    explanation: |
      The transpose distributes over addition: $(X + Y)^T = X^T + Y^T$.
      So, $((AB)^T + C^T)^T = ((AB)^T)^T + (C^T)^T$.
      The transpose of a transpose is the original matrix: $AB + C$.

  - id: test-hard-matrix-equation-solve
    type: multipleChoice
    prompt: |
      Find the matrix $X$ that solves the equation $2X + A = B$, where:
      $A = \begin{bmatrix} 4 & -2 \\ 0 & 6 \end{bmatrix}$ and $B = \begin{bmatrix} 8 & 0 \\ 4 & -2 \end{bmatrix}$.
    choices:
      - id: c1
        text: '$\begin{bmatrix} 2 & 1 \\ 2 & -4 \end{bmatrix}$'
      - id: c2
        text: '$\begin{bmatrix} 4 & 2 \\ 4 & -8 \end{bmatrix}$'
      - id: c3
        text: '$\begin{bmatrix} 6 & -1 \\ 2 & 2 \end{bmatrix}$'
      - id: c4
        text: '$\begin{bmatrix} 2 & -1 \\ -2 & 4 \end{bmatrix}$'
    answer:
      choiceId: c1
    explanation: |
      Isolate $X$: $2X = B - A$.
      $B - A = \begin{bmatrix} 8-4 & 0-(-2) \\ 4-0 & -2-6 \end{bmatrix} = \begin{bmatrix} 4 & 2 \\ 4 & -8 \end{bmatrix}$.
      Divide by 2: $X = \begin{bmatrix} 2 & 1 \\ 2 & -4 \end{bmatrix}$.

  - id: test-hard-matrix-vector-commute
    type: multipleChoice
    prompt: |
      Let $\vec{u}$ and $\vec{v}$ be $n \times 1$ column vectors. The product $\vec{u}^T\vec{v}$ results in a $1 \times 1$ scalar (the dot product). 
      What are the dimensions of the product $\vec{u}\vec{v}^T$, and is it generally equal to $\vec{v}\vec{u}^T$?
    choices:
      - id: c1
        text: 'It is an $n \times n$ matrix, and $\vec{u}\vec{v}^T = (\vec{v}\vec{u}^T)^T$.'
      - id: c2
        text: 'It is an $n \times n$ matrix, and $\vec{u}\vec{v}^T = \vec{v}\vec{u}^T$.'
      - id: c3
        text: 'It is a scalar, and $\vec{u}\vec{v}^T = \vec{v}\vec{u}^T$.'
      - id: c4
        text: 'The product is undefined.'
    answer:
      choiceId: c1
    explanation: |
      $\vec{u}$ is $n \times 1$ and $\vec{v}^T$ is $1 \times n$. Their product is $n \times n$ (an outer product). It is not symmetric unless $\vec{u}$ and $\vec{v}$ are multiples of each other. However, taking the transpose of $\vec{u}\vec{v}^T$ gives $(\vec{v}^T)^T\vec{u}^T = \vec{v}\vec{u}^T$.
