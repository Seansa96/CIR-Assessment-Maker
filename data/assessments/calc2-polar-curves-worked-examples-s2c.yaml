workedExamples:
  - id: limacon-identification
    title: Identify and Trace a Limacon
    problem: 'Classify $r=1+2\cos\theta$ and describe the interval producing its inner loop.'
    steps:
      - { id: li-1, title: 'Compare coefficients', instruction: 'The form is a plus b cosine theta.', type: multipleChoice, prompt: 'Which comparison predicts an inner loop?', choices: [{ id: a, text: '$|b|>|a|$' }, { id: b, text: '$|a|>|b|$' }, { id: c, text: '$a=b=0$' }, { id: d, text: '$b=0$' }], answer: { choiceId: a }, explanation: 'Solution: Here absolute b is 2 and absolute a is 1, so the limacon has an inner loop. Why it works: The radius becomes negative. Common trap: Calling it a cardioid. Why the other choices fail: They give other limacon/circle cases.' }
      - { id: li-2, title: 'Locate pole crossings', instruction: 'Solve r equals zero.', type: freeResponse, prompt: 'Find the two zero angles in $[0,2\pi]$.', answer: { gradingMode: selfCheck, keyPoints: ['two pi over three', 'four pi over three'] }, explanation: 'Solution: One plus two cosine theta equals zero gives cosine theta equals negative one half, so theta equals two pi over three and four pi over three. Why it works: r equals zero places the point at the pole. Common trap: Using only one reference-angle solution.' }
      - { id: li-3, title: 'Interpret the sign', instruction: 'Test a midpoint of the interval between zeros.', type: multipleChoice, prompt: 'What does negative r between these zeros create?', choices: [{ id: a, text: 'an inner loop on opposite rays' }, { id: b, text: 'an undefined gap' }, { id: c, text: 'a straight line' }, { id: d, text: 'a larger outer loop' }], answer: { choiceId: a }, explanation: 'Solution: Negative radius plots on opposite rays and traces the inner loop. Why it works: Signed radius reverses direction by pi. Common trap: Dropping negative values. Why the other choices fail: They ignore the signed-radius rule.' }
  - id: polar-circle-conversion
    title: Convert a Polar Circle to Cartesian Form
    problem: 'Convert $r=4\cos\theta$ to Cartesian form and identify the circle.'
    steps:
      - { id: pc-1, title: 'Clear the denominator-free radius', instruction: 'Multiply by r before substituting identities.', type: symbolicResponse, prompt: 'Write the equation after multiplying by r.', answer: { expectedLatex: 'r^2=4r cos(theta)', equivalenceMode: expression, variables: [r,theta], tolerance: 0.000001 }, explanation: 'Solution: Multiplying gives $r^2=4r\cos\theta$. Why it works: This creates expressions with direct Cartesian identities. Common trap: Squaring both sides unnecessarily.' }
      - { id: pc-2, title: 'Substitute Cartesian identities', instruction: 'Use r squared equals x squared plus y squared and r cosine theta equals x.', type: freeResponse, prompt: 'Write the resulting Cartesian equation before completing the square.', answer: { gradingMode: selfCheck, keyPoints: ['x squared plus y squared equals four x'] }, explanation: 'Solution: $x^2+y^2=4x$. Why it works: The radius identities replace both polar expressions. Common trap: Replacing r cosine theta with y.' }
      - { id: pc-3, title: 'Read the circle geometry', instruction: 'Complete the square in x.', type: multipleChoice, prompt: 'What is the final circle?', choices: [{ id: a, text: '$(x-2)^2+y^2=4$' }, { id: b, text: '$x^2+(y-2)^2=4$' }, { id: c, text: '$x^2+y^2=16$' }, { id: d, text: '$(x+2)^2+y^2=4$' }], answer: { choiceId: a }, explanation: 'Solution: Add 4 to both sides: $(x-2)^2+y^2=4$. Why it works: The center is $(2,0)$ and radius 2. Common trap: Centering the circle at the pole. Why the other choices fail: They use the wrong center or radius.' }
  - id: polar-to-parametric
    title: Turn a Polar Rule into a Parametric Path
    problem: 'Write a Cartesian parametric path for $r=2\cos\theta$, using $\theta$ as parameter.'
    steps:
      - { id: pp-1, title: 'Use component formulas', instruction: 'Set x equal to r cosine theta and y equal to r sine theta.', type: freeResponse, prompt: 'Write x(theta) and y(theta) before simplification.', answer: { gradingMode: selfCheck, keyPoints: ['x equals two cosine squared theta', 'y equals two sine theta cosine theta'] }, explanation: 'Solution: $x=2\cos^2\theta$ and $y=2\sin\theta\cos\theta$. Why it works: A polar point resolves into its Cartesian components. Common trap: Treating r as a constant.' }
      - { id: pp-2, title: 'Choose one-trace bounds', instruction: 'Use a range where cosine is nonnegative to avoid retracing.', type: multipleChoice, prompt: 'Which interval traces this circle once without negative r?', choices: [{ id: a, text: '$-\pi/2\le\theta\le\pi/2$' }, { id: b, text: '$0\le\theta\le2\pi$' }, { id: c, text: '$0\le\theta\le4\pi$' }, { id: d, text: '$\theta=0$ only' }], answer: { choiceId: a }, explanation: 'Solution: On this interval cosine is nonnegative and the circle is traversed once. Why it works: Bounds are part of the parameterized path. Common trap: Using a full period and retracing with negative radius. Why the other choices fail: They retrace or undertrace.' }
