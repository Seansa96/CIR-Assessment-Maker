lesson:
  introduction: |-
    In previous lessons, we found the *angles* formed by intersecting chords and secants. Now, we will learn how to find the *lengths* of the segments formed by these intersections.
  sections:
  - id: sec-intersecting-chords
    title: Intersecting Chords Theorem
    required: true
    content: |-
      When two chords intersect inside a circle, they divide each other into two segments. 
      
      **Intersecting Chords Theorem**: The product of the segments of one chord is equal to the product of the segments of the other chord.
      
      If chord $AB$ and chord $CD$ intersect at point $E$ inside the circle, then:
      $$AE \times EB = CE \times ED$$
      
      *Mnemonic*: "Piece times Piece = Piece times Piece"

  - id: sec-intersecting-secants
    title: Intersecting Secants Theorem
    required: true
    content: |-
      A secant is a line that intersects a circle at two points and continues outside the circle. When two secants intersect at a point *outside* the circle, they each have an "outer" part and a "whole" length.
      
      **Intersecting Secants Theorem**: The product of the whole secant segment and its outer part equals the product of the whole secant segment and its outer part for the other secant.
      
      If secants from external point $P$ intersect the circle at $A, B$ and $C, D$ (where $A$ and $C$ are the closer points to $P$), then:
      $$PA \times PB = PC \times PD$$
      
      *Mnemonic*: "Outer times Whole = Outer times Whole"

questions:
- id: q-geom-cst-1
  title: Concept Check - Intersecting Chords
  prompt: |-
    Two chords intersect inside a circle. The segments of the first chord have lengths $3$ and $8$. The segments of the second chord have lengths $4$ and $x$. What is the value of $x$?
  type: numericResponse
  answer:
    numericValue: 6
    tolerance: 0
  explanation: |-
    Piece $\times$ Piece = Piece $\times$ Piece
    $$3 \times 8 = 4 \times x$$
    $$24 = 4x \implies x = 6$$
  skills:
  - geometry-circle-chords-secants-tangents

- id: q-geom-cst-2
  title: Concept Check - Intersecting Secants
  prompt: |-
    Two secants intersect at point $P$ outside a circle. The first secant has an outer piece of $4$ and an inner piece of $5$. The second secant has an outer piece of $3$ and an inner piece of $x$. What is the *whole length* of the second secant?
  type: numericResponse
  answer:
    numericValue: 12
    tolerance: 0
  explanation: |-
    Outer $\times$ Whole = Outer $\times$ Whole.
    The whole length of the first secant is $4 + 5 = 9$.
    Let $W$ be the whole length of the second secant.
    $$4 \times 9 = 3 \times W$$
    $$36 = 3W \implies W = 12$$
    (If asked, the inner piece $x$ would be $12 - 3 = 9$, but the question asked for the *whole length*, which is $12$).
  skills:
  - geometry-circle-chords-secants-tangents
