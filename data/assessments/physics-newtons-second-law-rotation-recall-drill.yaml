items:
  - { id: nr1, type: cloze, prompt: 'Rotational Newton''s second law is $\sum\tau=I____$.', answer: { expected: alpha, expectedLatex: '\alpha', aliases: ['angular acceleration'], media: [] }, explanation: 'Solution: Insert $\alpha$.\n\nWhy it works: Net torque produces angular acceleration.', tags: [law] }
  - { id: nr2, type: typed, prompt: 'What rotational quantity is analogous to mass?', answer: { expected: 'moment of inertia', expectedLatex: 'I', aliases: [inertia], media: [] }, explanation: 'Solution: It is moment of inertia.\n\nWhy it works: It resists angular acceleration.', tags: [analogy] }
  - { id: nr3, type: cloze, prompt: 'For no-slip string motion, $a=R____$.', answer: { expected: alpha, expectedLatex: '\alpha', aliases: [], media: [] }, explanation: 'Solution: Insert $\alpha$.\n\nWhy it works: Tangential acceleration equals radius times angular acceleration.', tags: [constraint] }
  - { id: nr4, type: typed, prompt: 'What is angular acceleration when net torque is zero?', answer: { expected: zero, expectedLatex: '0', aliases: ['0'], media: [] }, explanation: 'Solution: It is zero.\n\nWhy it works: $\alpha=\tau_{net}/I$.', tags: [equilibrium] }
  - { id: nr5, type: cloze, prompt: 'Torque is force times the perpendicular ____ arm.', answer: { expected: lever, expectedLatex: '', aliases: [moment], media: [] }, explanation: 'Solution: Insert lever.\n\nWhy it works: Torque uses perpendicular distance to the axis.', tags: [torque] }
  - { id: nr6, type: typed, prompt: 'What diagram identifies forces for rotational dynamics?', answer: { expected: 'free body diagram', expectedLatex: '', aliases: [FBD], media: [] }, explanation: 'Solution: It is a free-body diagram.\n\nWhy it works: It isolates forces before torques are summed.', tags: [strategy] }
