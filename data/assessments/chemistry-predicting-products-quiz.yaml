questions:
- id: q001
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - elemental-states
  prompt: 'Predict the product of the synthesis reaction between solid Magnesium and Oxygen gas. Be sure to consider charges and elementary forms.'
  choices:
  - id: a
    text: $Mg_2O$
  - id: b
    text: $MgO$
  - id: c
    text: $MgO_2$
  - id: d
    text: $Mg_2O_2$
  answer:

    choiceId: b
  explanation: 'Magnesium forms a $+2$ ion and Oxygen forms a $-2$ ion. Their charges balance with a 1:1 ratio, resulting in the empirical formula $MgO$.'

- id: q002
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - chemical-reactions-balancing
  prompt: 'Predict the products when aqueous Lead(II) nitrate is mixed with aqueous Potassium iodide.'
  choices:
  - id: a
    text: $PbI(s) + K(NO_3)_2(aq)$
  - id: b
    text: $PbI_2(aq) + KNO_3(aq)$
  - id: c
    text: $PbI_2(s) + KNO_3(aq)$
  - id: d
    text: $Pb_2I(s) + KNO_3(aq)$
  answer:

    choiceId: c
  explanation: 'This is a double replacement reaction. $Pb^{2+}$ pairs with $I^-$ to form $PbI_2$. $K^+$ pairs with $NO_3^-$ to form $KNO_3$. Based on solubility rules, most iodides are soluble except those of $Pb^{2+}$, $Ag^+$, and $Hg_2^{2+}$. Therefore, $PbI_2$ is a solid precipitate.'

- id: q003
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - ionic-compounds
  prompt: 'What are the expected products when solid Calcium carbonate ($CaCO_3$) decomposes upon heating?'
  choices:
  - id: a
    text: $Ca(s) + C(s) + O_3(g)$
  - id: b
    text: $CaO(s) + CO_2(g)$
  - id: c
    text: $CaC(s) + O_2(g)$
  - id: d
    text: $Ca(s) + CO_3(g)$
  answer:

    choiceId: b
  explanation: 'Metal carbonates decompose into a metal oxide and carbon dioxide gas upon heating. Therefore, $CaCO_3 \rightarrow CaO + CO_2$.'

- id: q004
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - solubility-rules
  prompt: 'When aqueous solutions of Sodium chloride ($NaCl$) and Potassium nitrate ($KNO_3$) are mixed, what precipitate forms?'
  choices:
  - id: a
    text: $NaNO_3$
  - id: b
    text: $KCl$
  - id: c
    text: Both $NaNO_3$ and $KCl$
  - id: d
    text: No precipitate forms.
  answer:

    choiceId: d
  explanation: 'Swapping partners yields $NaNO_3$ and $KCl$. All sodium and potassium salts are soluble. All nitrates and most chlorides are soluble. Since both possible products are soluble, no reaction occurs.'

- id: q005
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  - elemental-states
  prompt: 'Predict the products of the single replacement reaction between solid Zinc ($Zn$) and aqueous Hydrochloric acid ($HCl$).'
  choices:
  - id: a
    text: $ZnCl(aq) + H(g)$
  - id: b
    text: $ZnCl_2(aq) + H_2(g)$
  - id: c
    text: $ZnH_2(s) + Cl_2(g)$
  - id: d
    text: No reaction occurs.
  answer:

    choiceId: b
  explanation: 'Zinc replaces hydrogen in the acid. Zinc forms a $+2$ ion, so it pairs with two chloride ions ($-1$) to form $ZnCl_2$. Hydrogen is displaced as a diatomic gas, $H_2$.'

- id: q006
  type: multipleChoice
  skills:
  - chemical-reactions-predicting
  prompt: 'What are the products of the complete combustion of Propane ($C_3H_8$)?'
  choices:
  - id: a
    text: $CO(g) + H_2O(g)$
  - id: b
    text: $CO_2(g) + H_2(g)$
  - id: c
    text: $CO_2(g) + H_2O(g)$
  - id: d
    text: $C(s) + H_2O(g)$
  answer:

    choiceId: c
  explanation: 'Complete combustion of any hydrocarbon always produces Carbon dioxide ($CO_2$) and Water ($H_2O$).'
