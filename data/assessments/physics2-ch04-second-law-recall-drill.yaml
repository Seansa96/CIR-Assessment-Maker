id: physics2-ch04-second-law-recall-drill
title: Second Law of Thermodynamics Recall Drill
assessmentType: recallDrill
categoryId: physics-2
topicId: physics2-second-law-thermodynamics
items:
- id: rd1
  prompt: What is the formula for the efficiency of a Carnot engine in terms of reservoir
    temperatures?
  answer: $e_C = 1 - \frac{T_c}{T_h}$
- id: rd2
  prompt: What is the thermodynamic definition of the change in entropy for a reversible
    process?
  answer: $\Delta S = \int \frac{dQ_r}{T}$
- id: rd3
  prompt: According to the Second Law, what happens to the total entropy of the universe
    in any real process?
  answer: It increases ($\Delta S_{univ} > 0$).
- id: rd4
  prompt: What is the efficiency definition for any general heat engine?
  answer: $e = \frac{W}{Q_h}$
