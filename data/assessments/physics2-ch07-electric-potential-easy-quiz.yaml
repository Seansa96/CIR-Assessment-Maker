- id: q005
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-equipotentials
  prompt: 'Displacement d parallel to a uniform E gives delta V:'
  choices:
  - id: a
    text: -E/d
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: -Ed
  - id: c
    text: +Ed
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: zero V/m at x=2 m
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: b
  explanation: 'Solution: delta V=-integral E dot dl=-Ed.


    Why it works: Potential decreases along the field.


    Why the other choices fail: The alternatives reverse sign or use incorrect distance dependence.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-equipotentials
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
