- id: q004
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-field-from-potential
  prompt: 'Equidistant from +Q and -Q, net potential is:'
  choices:
  - id: a
    text: kQ/r with field direction
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: angle-dependent
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: zero
  - id: d
    text: 2kQ/r
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: c
  explanation: 'Solution: Scalar contributions +kQ/r and -kQ/r cancel.


    Why it works: Potential adds algebraically and has no vector angle.


    Why the other choices fail: The distractors add magnitudes or confuse potential with field.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-field-from-potential
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
