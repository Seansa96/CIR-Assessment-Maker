- id: q007
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-potential-energy
  prompt: Work by electric field along one equipotential?
  choices:
  - id: a
    text: qV
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: -qV
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: depends on path length
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: zero
  answer:
    choiceId: d
  explanation: 'Solution: W=-q delta V=0.


    Why it works: Electrostatic work depends on endpoint potential difference, not path length.


    Why the other choices fail: Nonzero answers use absolute potential rather than its change.'
  difficultyDimensions:
