- id: q008
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-potential-difference
  prompt: 'Equipotentials are half as far apart for the same delta V. Field magnitude is:'
  choices:
  - id: a
    text: unchanged
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: zero joules of work
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: twice as large
  - id: d
    text: half as large
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: c
  explanation: 'Solution: |E| is approximately |delta V|/delta s; halved spacing doubles E.


    Why it works: Field magnitude is the potential gradient.


    Why the other choices fail: The distractors invert or discard the gradient-spacing relationship.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-difference
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
