- id: q010
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-field-from-potential
  prompt: Adding a constant to V changes E how?
  choices:
  - id: a
    text: not at all
  - id: b
    text: reverses it
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: sets E to zero
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: only changes it on conductors
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: E=-grad V, and the gradient of a constant is zero.


    Why it works: The reference for potential is arbitrary.


    Why the other choices fail: The alternatives confuse potential reference with spatial derivative.'
