questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  prompt: Which of the following is true about electric field lines and equipotential surfaces?
  explanation: 'Solution:

    Electric field lines must intersect equipotential surfaces at right angles ($90^\circ$).


    Why it works:

    If the field had a component parallel to the surface, work would be done moving a charge along the surface,
    which contradicts the definition of an equipotential surface.

    Why the other choices fail: They are never parallel. Field lines point toward decreasing potential. No work
    is required along an equipotential surface.'
  choices:
  - id: a
    text: They are always perpendicular to each other.
  - id: b
    text: They are always parallel to each other.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: They point in the direction of increasing potential.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Work is required to move a charge along an equipotential surface.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Apply the topic’s defining relation to a direct case.
  skills:
  - physics2-ch07-electric-potential-potential-energy
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-electrostatics-applications
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-energy
- id: q002
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-potential-difference
  prompt: A -2.0 nC charge moves through +5.0 V. Find delta U.
  choices:
  - id: a
    text: -1.0e-8 J
  - id: b
    text: +1.0e-8 J
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: -2.5e-9 J
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: +2.5e-9 J
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: delta U=q delta V=-1.0e-8 J.


    Why it works: Potential-energy change includes the sign of q.


    Why the other choices fail: The positive value drops the negative-charge sign; other values use wrong scale
    or operation.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-difference
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
  - physics2-ch07-electric-potential-potential-energy
- id: q003
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-potential-calculation
  prompt: Potential 0.20 m from +4.0 nC with V(infinity)=0?
  choices:
  - id: a
    text: -180 V
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: 90 V
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: 360 V
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: 180 V
  answer:
    choiceId: d
  explanation: 'Solution: V=kQ/r=180 V.


    Why it works: Potential is a signed scalar proportional to Q/r.


    Why the other choices fail: The sign reversal assumes negative source; other values lose or double a factor.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch07-electric-potential-potential-calculation
  difficultyEvidence: Requires applying the topic’s governing relation and interpreting its physical sign, geometry,
    or scaling.
  prerequisiteObjectiveIds:
