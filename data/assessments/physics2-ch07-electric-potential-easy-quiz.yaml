- id: q006
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-electrostatics-applications
  prompt: V(x)=5x^2 V. E_x at x=2 m?
  choices:
  - id: a
    text: -20 V/m
  - id: b
    text: +20 V/m
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: -10 V/m
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: 5 V/m
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: E_x=-dV/dx=-10x=-20 V/m.


    Why it works: The field is the negative potential derivative.


    Why the other choices fail: The distractors reverse sign or omit the derivative factor/evaluation.'
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
