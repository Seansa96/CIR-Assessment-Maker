- id: q009
  type: multipleChoice
  skills:
  - physics2-ch07-electric-potential-potential-calculation
  prompt: Angle of E to an equipotential surface?
  choices:
  - id: a
    text: arbitrary
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  - id: b
    text: 90 degrees
  - id: c
    text: 0 degrees
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  - id: d
    text: 45 degrees
    issueSignals:
    - id: physics2-model-assumption-error
      domains:
      - physics-2
  answer:
    choiceId: b
  explanation: 'Solution: E is perpendicular to an equipotential.


    Why it works: A tangential component would change potential along that surface.


    Why the other choices fail: Other angles imply a tangential component.'
  difficultyDimensions:
