questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: Which of the following is true about electric field lines and equipotential surfaces?
  explanation: 'Solution:

    Electric field lines must intersect equipotential surfaces at right angles ($90^\circ$).


    Why it works:

    If the field had a component parallel to the surface, work would be done moving a charge along the
    surface, which contradicts the definition of an equipotential surface.

    Why the other choices fail: They are never parallel. Field lines point toward decreasing potential.
    No work is required along an equipotential surface.'
  choices:
  - id: a
    text: They are always perpendicular to each other.
  - id: b
    text: They are always parallel to each other.
  - id: c
    text: They point in the direction of increasing potential.
  - id: d
    text: Work is required to move a charge along an equipotential surface.
  answer:
    choiceId: a
