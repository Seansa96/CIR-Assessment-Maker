schemaVersion: 1
id: chemistry-reactions-classification-recall
title: "Reaction Classification Drill"
assessmentType: recallDrill
categoryId: chemistry
topicId: chemistry-reactions
skills:
- Apply chemistry concepts
- chemistry-reactions
- Apply Chemical Reactions
navigation:
  learningGoal: recall
  activityType: mixedRecallSet
  tags:
  - chemistry
  - chemistry-reactions
modeDefault: practice
items:
  - id: rc-drill-1
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'Classify $2H_2 + O_2 \rightarrow 2H_2O$.'
    answer:
      expected: "synthesis"
      aliases:
        - "combination"
    explanation: >-
      Two reactants combine to form one compound, which is the defining pattern of synthesis.
  - id: rc-drill-2
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'Classify $CH_4 + 2O_2 \rightarrow CO_2 + 2H_2O$.'
    answer:
      expected: "combustion"
    explanation: >-
      A hydrocarbon reacts with oxygen and forms carbon dioxide and water, the characteristic complete-combustion pattern.
  - id: rc-drill-3
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'Complete the classification: $AgNO_3 + NaCl \rightarrow AgCl + NaNO_3$ is a ___ replacement reaction.'
    answer:
      expected: "double"
    explanation: >-
      The cations exchange anions: silver pairs with chloride and sodium pairs with nitrate, so this is double replacement. AgCl is the precipitate.
  - id: rc-drill-4
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'Classify $CaCO_3 \rightarrow CaO + CO_2$.'
    answer:
      expected: "decomposition"
    explanation: >-
      One compound breaks into two simpler products, which is the pattern of decomposition.
  - id: rc-drill-5
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'Classify $Zn + 2HCl \rightarrow ZnCl_2 + H_2$.'
    answer:
      expected: "single"
      aliases:
        - "single replacement"
    explanation: >-
      Zinc replaces hydrogen in the acid, producing a salt and hydrogen gas; this is single replacement.
  - id: rc-drill-6
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'When aqueous $BaCl_2$ and $Na_2SO_4$ form solid $BaSO_4$, what reaction class describes the ion exchange?'
    answer:
      expected: "double"
      aliases:
        - "double replacement; precipitation"
    explanation: >-
      The ions exchange partners and insoluble barium sulfate forms, so it is a double-replacement precipitation reaction.
  - id: rc-drill-7
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'Classify $2Mg + O_2 \rightarrow 2MgO$.'
    answer:
      expected: "synthesis"
      aliases:
        - "combination"
    explanation: >-
      Two reactants form a single product, so the overall reaction is synthesis. It is also oxidation of magnesium.
  - id: rc-drill-8
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'In $Fe_2O_3 + 3CO \rightarrow 2Fe + 3CO_2$, which broad reaction process is central: redox or double replacement?'
    answer:
      expected: "redox"
      aliases:
        - "redox reaction"
    explanation: >-
      Iron(III) is reduced to elemental iron while carbon monoxide is oxidized to carbon dioxide; electron transfer makes this a redox reaction.
  - id: rc-drill-9
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'An acid reacts with a base to form water and an ionic compound. What familiar reaction class is this?'
    answer:
      expected: "double replacement"
      aliases:
        - "neutralization; double replacement"
    explanation: >-
      The ions exchange partners, and the acid’s hydrogen ions combine with hydroxide to form water. This is neutralization, commonly classified as double replacement.
  - id: rc-drill-10
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'Classify $2KClO_3 \rightarrow 2KCl + 3O_2$.'
    answer:
      expected: "decomposition"
    explanation: >-
      A single reactant yields multiple products, the defining decomposition pattern.
  - id: rc-drill-11
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'A metal reacts with oxygen to form a metal oxide. Which broad class fits the one-product pattern?'
    answer:
      expected: "synthesis"
      aliases:
        - "combination"
    explanation: >-
      The elements combine into one compound, so this fits synthesis (combination).
  - id: rc-drill-12
    type: typed
    skills:
      - chemical-reactions-types
    prompt: 'In $HCl + NaOH \rightarrow NaCl + H_2O$, what is the reaction called?'
    answer:
      expected: "neutralization"
      aliases:
        - "acid-base neutralization"
    explanation: >-
      An acid and a base produce water and a salt. The net ionic process is hydrogen ions combining with hydroxide ions to make water.
