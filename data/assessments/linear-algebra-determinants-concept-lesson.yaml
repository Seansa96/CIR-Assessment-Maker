lesson:
  introduction: >-
    The determinant is a single number computed from a square matrix that
    encodes a remarkable amount of information: whether the matrix is invertible,
    how much it scales area or volume, and more. In this lesson, we explore how
    to compute determinants and what they tell us.
  sections:
    - id: det-2x2
      title: The 2×2 Determinant
      content: |
        For a $2 \times 2$ matrix $A = \begin{bmatrix} a & b \\ c & d \end{bmatrix}$, the determinant is:
        $$\det(A) = ad - bc$$

        Geometrically, $|\det(A)|$ gives the area of the parallelogram formed by the column vectors of $A$.
        If $\det(A) > 0$, the transformation preserves orientation; if $\det(A) < 0$, it reverses it.
        If $\det(A) = 0$, the columns are linearly dependent and the matrix is **not invertible**.
      check:
        id: check-2x2
        type: numericResponse
        prompt: |
          Compute $\det \begin{bmatrix} 5 & 3 \\ -2 & 4 \end{bmatrix}$.
        answer:
          value: 26
          tolerance: 0
        explanation: |
          $\det = (5)(4) - (3)(-2) = 20 + 6 = 26$.

    - id: det-3x3-cofactor
      title: Cofactor Expansion for 3×3 Matrices
      content: |
        For larger matrices, we use **cofactor expansion** (also called expansion along a row or column).

        The **cofactor** $C_{ij}$ of entry $a_{ij}$ is:
        $$C_{ij} = (-1)^{i+j} M_{ij}$$
        where $M_{ij}$ is the **minor** — the determinant of the submatrix obtained by deleting row $i$ and column $j$.

        Expanding along the first row of a $3 \times 3$ matrix:
        $$\det(A) = a_{11}C_{11} + a_{12}C_{12} + a_{13}C_{13}$$

        **Tip**: Choose the row or column with the most zeros to minimize computation.
      check:
        id: check-3x3
        type: numericResponse
        prompt: |
          Expand along the first row to find $\det \begin{bmatrix} 2 & 0 & -1 \\ 3 & 1 & 2 \\ -1 & 4 & 0 \end{bmatrix}$.
        answer:
          value: -29
          tolerance: 0
        explanation: |
          Expanding along row 1: $\det A = a_{11}C_{11} + a_{12}C_{12} + a_{13}C_{13}$.

          $C_{11} = (+1)\det\begin{bmatrix}1&2\\4&0\end{bmatrix} = (0-8) = -8$.

          $C_{12} = (-1)\det\begin{bmatrix}3&2\\-1&0\end{bmatrix} = -(0-(-2)) = -2$.

          $C_{13} = (+1)\det\begin{bmatrix}3&1\\-1&4\end{bmatrix} = (12-(-1)) = 13$.

          $\det A = 2(-8) + 0(-2) + (-1)(13) = -16 + 0 - 13 = -29$.

    - id: det-properties
      title: Key Properties of Determinants
      content: |
        Determinants have several powerful properties that make computation easier:

        1. **Row Scaling**: $\det$ scales by the same factor: multiplying a row by $k$ multiplies the determinant by $k$.
        2. **Row Swap**: Swapping two rows **negates** the determinant.
        3. **Row Replacement**: Adding a multiple of one row to another does **not** change the determinant.
        4. **Triangular Matrices**: $\det$ equals the **product of diagonal entries** for triangular matrices.
        5. **Product Rule**: $\det(AB) = \det(A)\det(B)$.
        6. **Transpose**: $\det(A^T) = \det(A)$.
        7. **Invertibility**: $A$ is invertible if and only if $\det(A) \neq 0$.
      check:
        id: check-properties
        type: multipleChoice
        prompt: |
          Suppose $\det(A) = 6$ for a $3 \times 3$ matrix $A$. What is $\det(2A)$?
        choices:
          - id: c1
            text: '12'
          - id: c2
            text: '48'
          - id: c3
            text: '18'
          - id: c4
            text: '36'
        answer:
          choiceId: c2
        explanation: |
          Scaling the entire matrix $A$ by $2$ means every row is multiplied by $2$. Each row scaling multiplies the determinant by $2$. For a $3 \times 3$ matrix with 3 rows, $\det(2A) = 2^3 \det(A) = 8 \times 6 = 48$.
