lesson:
  introduction: |
    Congruence and similarity are not statements that two triangles merely look alike. They are controlled ways to transfer information. Congruence transfers exact lengths and angles because the triangles differ only by rigid motion or reflection. Similarity transfers angles and ratios because one triangle may be a scaled copy of the other. In both settings, correct correspondence is the logical spine of the argument.
  sections:
  - id: aops-triangles-congruence-meaning
    title: Congruence as rigid structure
    required: true
    content: |
      Two triangles are congruent when a sequence of translations, rotations, and reflections can place one exactly on the other. Orientation does not matter: a mirror image is still congruent because reflection preserves every distance and angle. Congruence therefore promises six matching facts—three side equalities and three angle equalities—but a proof normally establishes only enough initial data to invoke a congruence criterion. The remaining matches follow afterward.

      The diagram encodes three side pairs with one, two, and three tick marks. Those markings are givens; unmarked visual similarities are not. Once SSS proves the triangles congruent, corresponding angles may be transferred safely.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-congruence.svg
      alt: Triangles ABC and DEF with three pairs of corresponding sides identified by matching tick marks.
      caption: Side marks, not apparent size or orientation, provide the SSS data.
    check:
      id: aops-triangles-congruence-meaning-check
      type: multipleChoice
      prompt: Which transformation can reverse orientation while preserving triangle congruence?
      choices:
      - {id: a, text: Reflection}
      - {id: b, text: Nonuniform horizontal stretching}
      - {id: c, text: Changing only one side length}
      - {id: d, text: Replacing one angle by its supplement}
      answer: {choiceId: a}
      explanation: 'A reflection is a rigid motion: it preserves every length and angle even though it reverses orientation.'
  - id: aops-triangles-correspondence
    title: Correspondence before calculation
    required: true
    content: |
      A congruence statement is ordered. Writing $\triangle ABC\cong\triangle DEF$ asserts $A\leftrightarrow D$, $B\leftrightarrow E$, and $C\leftrightarrow F$. It follows that $AB\leftrightarrow DE$, $BC\leftrightarrow EF$, and $AC\leftrightarrow DF$. If the order is wrong, a perfectly valid theorem can produce a false equation.

      Build the order from marks or established angle facts. Match a distinctive vertex first—for example, the vertex between the one-tick and two-tick sides—then follow adjacent sides. Only after congruence is proved may you invoke corresponding parts of congruent triangles, often abbreviated CPCTC. CPCTC is a consequence, not a criterion for starting the proof.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-congruence.svg
      alt: Marked triangles showing that A corresponds to D, B to E, and C to F.
      caption: The tick pattern forces the order ABC to match DEF.
    check:
      id: aops-triangles-correspondence-check
      type: multipleChoice
      prompt: 'Given $\triangle ABC\cong\triangle DFE$, which side corresponds to $BC$?'
      choices:
      - {id: a, text: '$DE$'}
      - {id: b, text: '$DF$'}
      - {id: c, text: '$FE$'}
      - {id: d, text: '$AB$'}
      answer: {choiceId: c}
      explanation: The order gives $B\leftrightarrow F$ and $C\leftrightarrow E$, so $BC\leftrightarrow FE$.
  - id: aops-triangles-congruence-criteria
    title: What information actually fixes a triangle
    required: true
    content: |
      The standard congruence criteria encode rigidity. SSS fixes all three side lengths. SAS fixes two sides and their included angle—the angle between those sides. ASA fixes two angles and their included side; AAS uses two angles and a nonincluded side. Since two angles determine the third, either angle criterion fixes shape, while the known side fixes scale. In right triangles, HL uses equality of the hypotenuse and one corresponding leg; the right angles supply the necessary structure.

      A sound proof names both the criterion and the matching data. Saying only “SAS” hides the main obligation: show that the equal angle is actually included between the two equal side pairs.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-congruence.svg
      alt: Two triangles whose three corresponding side pairs are marked equal for SSS congruence.
      caption: SSS is visible here because every corresponding side pair is explicitly marked.
    check:
      id: aops-triangles-congruence-criteria-check
      type: multipleChoice
      prompt: Two right triangles have congruent hypotenuses and one pair of congruent legs. Which criterion applies directly?
      choices:
      - {id: a, text: AA}
      - {id: b, text: HL}
      - {id: c, text: SSA for arbitrary triangles}
      - {id: d, text: AAA}
      answer: {choiceId: b}
      explanation: The known right angles make hypotenuse-leg a valid right-triangle congruence criterion.
  - id: aops-triangles-insufficient-data
    title: 'Ambiguity checks: SSA and AAA'
    required: true
    content: |
      SSA is generally ambiguous. With two side lengths and a nonincluded angle, the remaining side may swing into two positions, producing two noncongruent triangles, one triangle, or none. A special right-triangle HL case avoids this ambiguity because the right angle and hypotenuse impose additional restrictions. AAA also does not prove congruence: it fixes shape but permits every positive scale.

      When data resemble a theorem, locate the angle relative to the known sides. If it is not included, do not rename SSA as SAS. When only angles are known, expect similarity rather than congruence unless a length is also fixed.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-congruence.svg
      alt: Congruent-triangle reference diagram used to contrast complete SSS data with insufficient SSA or AAA data.
      caption: Removing a side mark can change rigid SSS information into an ambiguous case.
    check:
      id: aops-triangles-insufficient-data-check
      type: multipleChoice
      prompt: Two triangles have the same three angle measures, but one has perimeter 18 and the other perimeter 30. What follows?
      choices:
      - {id: a, text: They are congruent by AAA.}
      - {id: b, text: They are similar but not congruent.}
      - {id: c, text: They cannot both exist.}
      - {id: d, text: They are congruent by SSS.}
      answer: {choiceId: b}
      explanation: AAA fixes the angle pattern and hence shape, while the different perimeters show different scales.
  - id: aops-triangles-similarity-criteria
    title: Similarity criteria and proportional structure
    required: true
    content: |
      Similar triangles have congruent corresponding angles and proportional corresponding sides. AA is often the most efficient criterion: two angle matches force the third. SAS similarity requires two proportional side pairs and congruent included angles. SSS similarity requires one common ratio across all three corresponding side pairs.

      Write proportions in one consistent direction. If small-to-large is $2:5$, then every small length divided by its matching large length is $2/5$. Mixing a small-to-large ratio in one fraction with a large-to-small ratio in another creates a plausible-looking but false equation.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-similarity.svg
      alt: Triangle ABC with segment DE parallel to BC, creating smaller triangle ADE with matching angle arcs.
      caption: Parallel lines create two angle pairs, so triangle ADE is similar to triangle ABC by AA.
    check:
      id: aops-triangles-similarity-criteria-check
      type: multipleChoice
      prompt: Corresponding side lengths of two triangles are $4,6,8$ and $10,15,20$. Which criterion proves similarity?
      choices:
      - {id: a, text: SSS similarity, because all three ratios equal $2/5$.}
      - {id: b, text: SSS congruence, because all sides are listed.}
      - {id: c, text: SSA similarity.}
      - {id: d, text: No criterion applies.}
      answer: {choiceId: a}
      explanation: Each first-triangle side is $2/5$ of its corresponding second-triangle side, which is SSS similarity.
  - id: aops-triangles-scale
    title: Linear scale, perimeter, and area
    required: true
    content: |
      If the length scale factor from a smaller triangle to a larger one is $k$, every corresponding length—including medians, altitudes, angle bisectors, and perimeter—is multiplied by $k$. Area is multiplied by $k^2$ because it contains two independent length dimensions. Conversely, an area ratio of $m:n$ gives a positive length ratio of $\sqrt m:\sqrt n$.

      This dimensional distinction is a powerful error check. A scale factor of 3 cannot make area merely three times as large; it makes a base and its corresponding height each three times as large, so area is nine times as large.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-similarity.svg
      alt: Nested similar triangles ADE and ABC used to compare corresponding lengths and areas.
      caption: The same linear factor scales every matching segment; its square scales area.
    check:
      id: aops-triangles-scale-check
      type: multipleChoice
      prompt: Similar triangles have areas 36 and 100. What is the positive small-to-large perimeter ratio?
      choices:
      - {id: a, text: '$9:25$'}
      - {id: b, text: '$3:5$'}
      - {id: c, text: '$6:25$'}
      - {id: d, text: '$18:50$ only; it cannot be simplified.'}
      answer: {choiceId: b}
      explanation: 'The length and perimeter ratio is the square root of $36:100$, which is $6:10=3:5$.'
  - id: aops-triangles-similarity-engines
    title: Parallel segments and the altitude-to-hypotenuse engine
    required: true
    content: |
      A segment parallel to one side of a triangle creates a smaller similar triangle. Corresponding and shared angles prove AA before any proportion is written. In a right triangle, the altitude from the right angle to the hypotenuse creates two smaller right triangles, each similar to the original and to the other. If the hypotenuse is split into lengths $p$ and $q$, with total $c=p+q$, then similarity yields

      $$h^2=pq,\qquad a^2=cp,\qquad b^2=cq,$$

      where $h$ is the altitude and each leg is paired with its adjacent hypotenuse segment. These are geometric-mean consequences, not formulas to use without the right-angle and perpendicular-altitude hypotheses. Verify the segment correspondence before deciding whether a leg pairs with $p$ or $q$.
    media:
    - type: image
      src: /assessments/aops/aops-triangles-altitude-hypotenuse.svg
      alt: Right triangle ABC with altitude CD to hypotenuse AB, splitting AB into segments p and q.
      caption: The altitude produces three AA-similar right triangles and the geometric-mean relations.
    check:
      id: aops-triangles-similarity-engines-check
      type: multipleChoice
      prompt: An altitude to a right triangle's hypotenuse divides it into segments 4 and 9. What is the altitude length?
      choices:
      - {id: a, text: '$\sqrt{13}$'}
      - {id: b, text: '$6$'}
      - {id: c, text: '$13$'}
      - {id: d, text: '$36$'}
      answer: {choiceId: b}
      explanation: The established similarity gives $h^2=pq=36$, so the positive altitude is $h=6$.
