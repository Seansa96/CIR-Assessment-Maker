schemaVersion: 1
id: calc2-diff-eq-intro-test-easy
title: Modeling Differential Equations Test — Easy
assessmentType: test
categoryId: calculus-2
topicId: diff-eq-intro-modeling
modeDefault: practice
randomizeQuestions: true
skills: [classify equations, construct rate models, interpret slope fields]
navigation: { learningGoal: evaluate, activityType: formalTest, tags: [calculus-2, differential-equations, modeling] }
questions:
- id: q001
  type: numericResponse
  skills: [classify equations]
  prompt: What is the order of $y''''+y=0$?
  answer: { value: 4, tolerance: 0.001 }
  explanation: Order is determined by the highest derivative.
- id: q002
  type: symbolicResponse
  skills: [construct rate models]
  prompt: A radioactive sample $A$ decays at a rate proportional to the amount present. Enter $dA/dt$ using positive constant $r$.
  answer: { expectedLatex: '-r*A', equivalenceMode: expression, tolerance: 0.000001, variables: [r, A], explanation: Decay makes the rate negative and proportional to A. }
- id: q003
  type: numericResponse
  skills: [interpret slope fields]
  prompt: For $y'=2x+y$, find the slope at $(-1,3)$.
  answer: { value: 1, tolerance: 0.001 }
  explanation: 'Substitute the point: $2(-1)+3=1$.'
- id: q004
  type: numericResponse
  skills: [analyze equilibria]
  prompt: For $y'=y(12-y)$, what is the nonzero equilibrium?
  answer: { value: 12, tolerance: 0.001 }
  explanation: Set $y(12-y)$ equal to zero.
- id: q005
  type: symbolicResponse
  skills: [verify differential-equation solutions]
  prompt: If $y=Ce^{5x}$, enter $y'$.
  answer: { expectedLatex: '5*C*e^(5x)', equivalenceMode: expression, tolerance: 0.000001, variables: [C, x], explanation: Differentiate the exponential using the chain rule. }
