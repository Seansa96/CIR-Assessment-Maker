schemaVersion: 1
id: calc2-series-approximation-error-hard-test
title: Series Approximation and Error Hard Test
assessmentType: test
categoryId: calculus-2
topicId: series-approximation-error
skills:
- Compute alternating, geometric, integral, and Lagrange remainder bounds
- Select truncation indices that satisfy strict tolerances
- Interpret and propagate absolute and relative errors
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - calculus-2
  - series-approximation-error
  - hard
  - remainder-bounds
modeDefault: evaluate
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - bound-alternating-series-remainders
  prompt: |
    The first ten terms of
    $\displaystyle\sum_{n=1}^{\infty}(-1)^{n+1}/n$ approximate
    $\log 2$. Which error bound is guaranteed by the alternating-series
    estimate?
  choices:
  - id: a
    text: |-
      $|R_{10}|\le 1/11$
  - id: b
    text: |-
      $|R_{10}|\le 1/10$
  - id: c
    text: |-
      $|R_{10}|\le 1/100$
  - id: d
    text: $R_{10}=1/11$
  answer:
    choiceId: a
  explanation: The absolute error is no larger than the magnitude of the eleventh term, the first omitted
    term.
- id: q002
  type: multipleChoice
  skills:
  - compute-lagrange-remainder-bounds
  prompt: |
    Use the degree-three Maclaurin polynomial for $e^x$ at $x=0.2$.
    Which is a valid Lagrange error bound?
  choices:
  - id: a
    text: $e^{0.2}(0.2)^4/4!$
  - id: b
    text: $(0.2)^3/3!$
  - id: c
    text: $e^{-0.2}(0.2)^4/4!$
  - id: d
    text: $(0.2)^4/3!$
  answer:
    choiceId: a
  explanation: The fourth derivative is $e^t$, whose maximum on zero through 0.2 is $e^{0.2}$, and the
    remainder divides by $4!$.
- id: q003
  type: multipleChoice
  skills:
  - compute-exact-geometric-remainders
  prompt: |
    For $|x|<1$, let $S_N=\sum_{n=0}^{N}x^n$. What is the exact
    remainder $1/(1-x)-S_N$?
  choices:
  - id: a
    text: $x^{N+1}/(1-x)$
  - id: b
    text: $x^N/(1-x)$
  - id: c
    text: $x^{N+1}$
  - id: d
    text: $1/(1-x^{N+1})$
  answer:
    choiceId: a
  explanation: The omitted tail begins at exponent N plus one and is itself geometric.
- id: q004
  type: multipleChoice
  skills:
  - apply-integral-test-remainder-bounds
  prompt: |
    Let $R_N=\sum_{n=N+1}^{\infty}1/n^2$. Which bracket is valid?
  choices:
  - id: a
    text: |-
      $1/(N+1)\le R_N\le1/N$
  - id: b
    text: |-
      $1/N\le R_N\le1/(N+1)$
  - id: c
    text: |-
      $1/(N+1)^2\le R_N\le1/N^2$
  - id: d
    text: $R_N=1/N$
  answer:
    choiceId: a
  explanation: Integrating $x^{-2}$ from N plus one and from N gives the lower and upper bounds respectively.
- id: q005
  type: multipleChoice
  skills:
  - bound-arctangent-series-errors
  prompt: |
    Approximate $\arctan(1/2)$ with
    $x-x^3/3+x^5/5$ at $x=1/2$. What alternating-series error bound
    results?
  choices:
  - id: a
    text: $1/896$
  - id: b
    text: $1/384$
  - id: c
    text: $1/128$
  - id: d
    text: $1/7$
  answer:
    choiceId: a
  explanation: |-
    The first omitted magnitude is $(1/2)^7/7=1/(128\cdot7)=1/896$.
- id: q006
  type: multipleChoice
  skills:
  - use-alternating-taylor-error-bounds
  prompt: |
    Using $1-x^2/2!+x^4/4!$ to approximate $\cos(0.3)$, which bound
    follows from the alternating-series estimate?
  choices:
  - id: a
    text: $(0.3)^6/6!$
  - id: b
    text: $(0.3)^5/5!$
  - id: c
    text: $(0.3)^4/4!$
  - id: d
    text: $(0.3)^6/5!$
  answer:
    choiceId: a
  explanation: At this input the cosine terms decrease, and the first omitted nonzero term has degree
    six.
- id: q007
  type: multipleChoice
  skills:
  - choose-truncation-counts-for-tolerances
  prompt: |
    How many terms of the alternating harmonic series guarantee absolute
    error less than $0.001$?
  choices:
  - id: a
    text: $1000$
  - id: b
    text: $999$
  - id: c
    text: $1001$
  - id: d
    text: $100$
  answer:
    choiceId: a
  explanation: With N terms the error is at most $1/(N+1)$; the strict inequality $1/(N+1)<1/1000$ first
    holds at N equals 1000.
- id: q008
  type: multipleChoice
  skills:
  - bound-binomial-series-truncations
  prompt: |
    Approximate $\sqrt{1.1}$ by $1+x/2-x^2/8$ with $x=0.1$.
    What is the magnitude of the first omitted term?
  choices:
  - id: a
    text: $1/16000$
  - id: b
    text: $1/8000$
  - id: c
    text: $1/1600$
  - id: d
    text: $1/16$
  answer:
    choiceId: a
  explanation: The cubic coefficient is $1/16$, so its magnitude at one tenth is $(1/16)(1/1000)=1/16000$.
- id: q009
  type: multipleChoice
  skills:
  - distinguish-absolute-and-relative-error
  prompt: |
    An approximation to a nonzero value L has absolute error at most
    $2\times10^{-5}$, and $|L|\ge0.4$. What relative error is guaranteed?
  choices:
  - id: a
    text: |-
      At most $5\times10^{-5}$
  - id: b
    text: |-
      At most $8\times10^{-6}$
  - id: c
    text: |-
      Exactly $5\times10^{-5}$
  - id: d
    text: At most $0.4$
  answer:
    choiceId: a
  explanation: |-
    Divide the absolute bound by the smallest allowed magnitude, giving $2\times10^{-5}/0.4=5\times10^{-5}$.
- id: q010
  type: multipleChoice
  skills:
  - propagate-product-approximation-errors
  prompt: |
    Suppose $|A-\tilde A|\le\epsilon$, $|B-\tilde B|\le\delta$,
    $|\tilde A|\le M$, and $|\tilde B|\le N$. Which bound follows for
    $|AB-\tilde A\tilde B|$?
  choices:
  - id: a
    text: |-
      $M\delta+N\epsilon+\epsilon\delta$
  - id: b
    text: |-
      $\epsilon+\delta$
  - id: c
    text: |-
      $MN\epsilon\delta$
  - id: d
    text: |-
      $M\epsilon+N\delta$
  answer:
    choiceId: a
  explanation: |-
    Write $A=\tilde A+e$ and $B=\tilde B+d$; the difference is $\tilde A d+\tilde B e+ed$.
- id: q011
  type: multipleChoice
  skills:
  - bound-shifted-logarithm-remainders
  prompt: |
    Approximate $\log(1.2)$ with the degree-two Taylor polynomial for
    $\log x$ centered at one. Which Lagrange bound is valid?
  choices:
  - id: a
    text: $1/375$
  - id: b
    text: $1/750$
  - id: c
    text: $1/125$
  - id: d
    text: $1/75$
  answer:
    choiceId: a
  explanation: The third derivative is $2/x^3$, bounded by two on the interval, so the error is at most
    $2(0.2)^3/3!=1/375$.
- id: q012
  type: multipleChoice
  skills:
  - find-geometric-truncation-indices
  prompt: |
    The sum $\sum_{n=0}^{\infty}(0.2)^n$ is truncated after exponent N.
    What is the smallest N making the exact tail less than $10^{-4}$?
  choices:
  - id: a
    text: $5$
  - id: b
    text: $4$
  - id: c
    text: $6$
  - id: d
    text: $3$
  answer:
    choiceId: a
  explanation: The tail is $0.2^{N+1}/0.8$; it equals $0.0004$ at N equals four and $0.00008$ at N equals
    five.
- id: q013
  type: multipleChoice
  skills:
  - bound-sine-polynomial-errors
  prompt: |
    The degree-seven Maclaurin polynomial approximates $\sin(0.5)$.
    Which alternating-series error bound applies?
  choices:
  - id: a
    text: $(0.5)^9/9!$
  - id: b
    text: $(0.5)^8/8!$
  - id: c
    text: $(0.5)^7/7!$
  - id: d
    text: $(0.5)^9/8!$
  answer:
    choiceId: a
  explanation: The included terms end at degree seven, so the first omitted sine term has degree nine.
- id: q014
  type: multipleChoice
  skills:
  - check-error-estimate-hypotheses
  prompt: |
    Which conditions justify the first-omitted-term error estimate for
    $\sum(-1)^n b_n$?
  choices:
  - id: a
    text: |-
      $b_n\ge0$, eventually nonincreasing, and $b_n\to0$
  - id: b
    text: $b_n$ is bounded
  - id: c
    text: |-
      $\sum b_n$ converges absolutely
  - id: d
    text: $b_n$ alternates in sign
  answer:
    choiceId: a
  explanation: The alternating remainder theorem needs nonnegative magnitudes decreasing to zero; absolute
    convergence is sufficient in some cases but not the theorem's defining hypothesis.
- id: q015
  type: multipleChoice
  skills:
  - interpret-error-bound-direction
  prompt: |
    A theorem proves $|R_N|\le10^{-6}$. Which conclusion is logically
    valid?
  choices:
  - id: a
    text: The actual error could be smaller or zero.
  - id: b
    text: The actual error equals $10^{-6}$.
  - id: c
    text: The approximation has exactly six correct decimal places.
  - id: d
    text: The remainder must be positive.
  answer:
    choiceId: a
  explanation: An upper bound limits magnitude but determines neither equality, sign, nor an exact digit
    count without further information.
