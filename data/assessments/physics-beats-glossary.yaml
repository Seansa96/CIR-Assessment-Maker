glossary:
  introduction: Use these terms to distinguish the source frequencies from the audible amplitude pattern they create.
  sections:
  - id: beats-terms
    title: Core terms
    entries:
    - id: beat-frequency
      term: beat frequency
      definition: The number of loudness pulses per second produced by two nearby frequencies; $f_{beat}=|f_1-f_2|$.
      drills:
      - id: beat-frequency-drill
        type: typed
        prompt: Two tones are $440\ \text{Hz}$ and $444\ \text{Hz}$. What is the beat frequency in hertz?
        answer:
          expected: '4'
    - id: superposition
      term: superposition
      definition: The principle that the displacement from overlapping waves is their algebraic sum.
      drills:
      - id: superposition-drill
        type: cloze
        prompt: Beats arise because two waves combine by {{superposition}}.
        answer:
          expected: superposition
    - id: envelope
      term: amplitude envelope
      definition: The slowly varying outer curve that shows the changing amplitude of a superposed wave.
      drills:
      - id: envelope-drill
        type: typed
        prompt: What name is given to the slowly varying curve that bounds a beat pattern?
        answer:
          expected: amplitude envelope
    - id: average-frequency
      term: average frequency
      definition: The carrier-like frequency $(f_1+f_2)/2$ in the sum of two equal-amplitude nearby-frequency waves.
      drills:
      - id: average-frequency-drill
        type: cloze
        prompt: The fast oscillation in a beat pattern has approximately the {{average frequency}} of the sources.
        answer:
          expected: average frequency
