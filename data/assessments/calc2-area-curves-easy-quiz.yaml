questions:
- id: area-easy-poly-intersect
  title: Intersecting Polynomials
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by the parabola $y = 5x - x^2$ and the line $y = x$.
  answer:
    gradingMode: auto
    expectedLatex: 32/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Find intersections: $5x - x^2 = x \implies x^2 - 4x = 0 \implies x(x - 4) = 0 \implies x = 0, 4$.
    2. The parabola $y = 5x - x^2$ opens downward and is above $y = x$ on $(0, 4)$.
    3. Set up the integral: $A = \int_0^4 ((5x - x^2) - x) \, dx = \int_0^4 (4x - x^2) \, dx$.
    4. Integrate: $[2x^2 - \frac{x^3}{3}]_0^4 = 2(16) - \frac{64}{3} = 32 - \frac{64}{3} = \frac{96 - 64}{3} = \frac{32}{3}$.
- id: area-easy-root-linear
  title: Radical and Linear Intersection
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by $y = \sqrt{x}$ and $y = \frac{x}{2}$.
  answer:
    gradingMode: auto
    expectedLatex: 4/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Find intersections: $\sqrt{x} = \frac{x}{2} \implies x = \frac{x^2}{4} \implies x^2 - 4x = 0 \implies x(x - 4) = 0 \implies x = 0, 4$.
    2. On $(0, 4)$, $\sqrt{x} \ge \frac{x}{2}$. (e.g. at $x=1$, $1 \ge 0.5$).
    3. Set up the integral: $A = \int_0^4 (\sqrt{x} - \frac{x}{2}) \, dx$.
    4. Integrate: $[\frac{2}{3}x^{3/2} - \frac{x^2}{4}]_0^4 = (\frac{2}{3}(8) - \frac{16}{4}) - 0 = \frac{16}{3} - 4 = \frac{16}{3} - \frac{12}{3} = \frac{4}{3}$.
- id: area-easy-trig-basic
  title: Basic Trigonometric Curves
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by $y = \cos x$ and $y = \sin x$ between $x = 0$ and $x = \frac{\pi}{4}$.
  answer:
    gradingMode: auto
    expectedLatex: \sqrt{2} - 1
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. On $[0, \frac{\pi}{4}]$, $\cos x \ge \sin x$.
    2. The curves intersect exactly at $x = \frac{\pi}{4}$.
    3. Set up the integral: $A = \int_0^{\pi/4} (\cos x - \sin x) \, dx$.
    4. Integrate: $[\sin x + \cos x]_0^{\pi/4} = (\sin(\frac{\pi}{4}) + \cos(\frac{\pi}{4})) - (\sin(0) + \cos(0))$.
    5. Evaluate: $(\frac{\sqrt{2}}{2} + \frac{\sqrt{2}}{2}) - (0 + 1) = \sqrt{2} - 1$.
- id: area-easy-exponential
  title: Exponential Curves
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by $y = e^x$, $y = e^{-x}$, and the vertical line $x = 1$.
  answer:
    gradingMode: auto
    expectedLatex: e + e^{-1} - 2
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Find intersection: $e^x = e^{-x} \implies e^{2x} = 1 \implies 2x = 0 \implies x = 0$.
    2. On $(0, 1)$, $e^x > e^{-x}$.
    3. Set up the integral: $A = \int_0^1 (e^x - e^{-x}) \, dx$.
    4. Integrate: $[e^x + e^{-x}]_0^1 = (e^1 + e^{-1}) - (e^0 + e^{-0}) = e + e^{-1} - 2$.
- id: area-easy-rational
  title: Rational Function and Line
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by $y = \frac{1}{x}$, $y = x$, and the vertical line $x = 2$.
  answer:
    gradingMode: auto
    expectedLatex: 3/2 - \ln(2)
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. Find intersection of curves: $\frac{1}{x} = x \implies x^2 = 1 \implies x = 1$ (for $x > 0$).
    2. The region is bounded between $x = 1$ and $x = 2$.
    3. On $(1, 2)$, the line $y = x$ is above $y = \frac{1}{x}$.
    4. Set up the integral: $A = \int_1^2 (x - \frac{1}{x}) \, dx$.
    5. Integrate: $[\frac{x^2}{2} - \ln|x|]_1^2 = (\frac{4}{2} - \ln 2) - (\frac{1}{2} - \ln 1) = 2 - \ln 2 - 0.5 = 1.5 - \ln 2 = \frac{3}{2} - \ln 2$.
- id: area-easy-horizontal-slice
  title: Horizontal Slicing Basic
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by the sideways parabola $x = y^2 - 4$ and the $y$-axis ($x = 0$).
  answer:
    gradingMode: auto
    expectedLatex: 32/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Find intersections on the $y$-axis by setting $x = 0$: $y^2 - 4 = 0 \implies y = \pm 2$.
    2. The region is to the left of the $y$-axis. The right boundary is $x = 0$ and the left boundary is $x = y^2 - 4$.
    3. Integrate with respect to $y$: $A = \int_{-2}^2 (0 - (y^2 - 4)) \, dy = \int_{-2}^2 (4 - y^2) \, dy$.
    4. Use even symmetry: $2 \int_0^2 (4 - y^2) \, dy = 2[4y - \frac{y^3}{3}]_0^2 = 2(8 - \frac{8}{3}) = 2(\frac{16}{3}) = \frac{32}{3}$.
- id: area-easy-below-axis
  title: Area Below the x-axis
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by $y = x^2 - 6x$ and the $x$-axis.
  answer:
    gradingMode: auto
    expectedLatex: 36
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Find intersections: $x^2 - 6x = 0 \implies x(x - 6) = 0 \implies x = 0, 6$.
    2. The parabola opens upward, so it is below the $x$-axis on $(0, 6)$.
    3. Area must be positive, so we integrate the top minus bottom: $A = \int_0^6 (0 - (x^2 - 6x)) \, dx = \int_0^6 (6x - x^2) \, dx$.
    4. Integrate: $[3x^2 - \frac{x^3}{3}]_0^6 = 3(36) - \frac{216}{3} = 108 - 72 = 36$.
- id: area-easy-absolute-value
  title: Absolute Value Symmetry
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by $y = |x|$ and $y = 2$.
  answer:
    gradingMode: auto
    expectedLatex: 4
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Find intersections: $|x| = 2 \implies x = -2, 2$.
    2. The line $y = 2$ is above the absolute value graph.
    3. By symmetry, the area is twice the area in the first quadrant.
    4. $A = 2 \int_0^2 (2 - x) \, dx = 2[2x - \frac{x^2}{2}]_0^2 = 2(4 - 2) = 2(2) = 4$.
    5. Geometrically, this is a triangle with base 4 and height 2. Area $= \frac{1}{2}bh = \frac{1}{2}(4)(2) = 4$.
- id: area-easy-cubic
  title: Cubic and Linear Intersection
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact **total** area of the region bounded by $y = x^3$ and $y = x$.
  answer:
    gradingMode: auto
    expectedLatex: 1/2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    1. Intersections: $x^3 = x \implies x^3 - x = 0 \implies x(x^2 - 1) = 0 \implies x = -1, 0, 1$.
    2. There are two regions. By symmetry, they have the same area.
    3. For $[0, 1]$, $x \ge x^3$. Area = $\int_0^1 (x - x^3) \, dx = [\frac{x^2}{2} - \frac{x^4}{4}]_0^1 = \frac{1}{2} - \frac{1}{4} = \frac{1}{4}$.
    4. Total area = $2 \times \frac{1}{4} = \frac{1}{2}$.
- id: area-easy-inverse-trig-basic
  title: Arctangent Integrand
  type: symbolicResponse
  skills:
  - area-curves-easy
  prompt: |
    Find the exact area of the region bounded by $y = \frac{1}{1+x^2}$, the $x$-axis, and the vertical lines $x = -1$ and $x = 1$.
  answer:
    gradingMode: auto
    expectedLatex: \pi/2
    equivalenceMode: expression
    tolerance: 0
  explanation: |
    1. The function is strictly positive, so the area is just the definite integral from $-1$ to $1$.
    2. $A = \int_{-1}^1 \frac{1}{1+x^2} \, dx$.
    3. The antiderivative is $\arctan x$.
    4. $A = [\arctan x]_{-1}^1 = \arctan(1) - \arctan(-1) = \frac{\pi}{4} - (-\frac{\pi}{4}) = \frac{\pi}{2}$.
