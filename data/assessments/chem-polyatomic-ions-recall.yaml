schemaVersion: 1
id: chem-polyatomic-ions-recall
title: Common Polyatomic Ions Recall
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
  - chem-ions
  - chemistry-compounds
skills:
  - chem-ions
modeDefault: practice
randomizeQuestions: true
items:

  # ── Nitrogen-based ─────────────────────────────────────────────────────────
  - id: drill-ammonium
    type: flashcard
    prompt: 'What is the formula and charge of the ammonium ion?'
    answer:
      expected: 'NH4+, charge 1+'
      aliases: [NH4+, ammonium 1+]
    explanation: >-
      Ammonium (NH4+) is the only common polyatomic cation you must memorize.
      Nitrogen has 5 valence electrons; bonded to 4 H with an extra proton gives 1+ charge.
    tags: [nitrogen, cation, polyatomic]

  - id: drill-ammonium-name
    type: cloze
    prompt: 'The polyatomic cation NH4+ is called ____.'
    answer:
      expected: ammonium
    explanation: Ammonium (NH4+) is the conjugate acid of ammonia (NH3) and forms ionic salts.
    tags: [nitrogen, cation, polyatomic]

  - id: drill-nitrate
    type: flashcard
    prompt: 'What is the formula and charge of the nitrate ion?'
    answer:
      expected: 'NO3-, charge 1-'
      aliases: [NO3-, nitrate 1-]
    explanation: >-
      Nitrate (NO3-) has nitrogen in a +5 oxidation state. The -ate suffix means
      the ion with MORE oxygen in the nitrogen oxyanion series.
    tags: [nitrogen, anion, oxyanion, polyatomic]

  - id: drill-nitrite
    type: flashcard
    prompt: 'What is the formula and charge of the nitrite ion?'
    answer:
      expected: 'NO2-, charge 1-'
      aliases: [NO2-, nitrite 1-]
    explanation: >-
      Nitrite (NO2-) has nitrogen in a +3 oxidation state. The -ite suffix means
      the ion with FEWER oxygen than the -ate form. NO2- vs. NO3-.
    tags: [nitrogen, anion, oxyanion, polyatomic]

  - id: drill-nitrate-vs-nitrite
    type: cloze
    prompt: 'Nitrate has the formula ____, while nitrite has the formula ____.'
    answer:
      expected: NO3-, NO2-
      aliases: [NO3 NO2]
    explanation: >-
      -ate ions have more oxygen than -ite ions. Nitrate = NO3- (3 oxygens),
      nitrite = NO2- (2 oxygens). Both have a 1- charge.
    tags: [nitrogen, oxyanion, polyatomic]

  # ── Sulfur-based ───────────────────────────────────────────────────────────
  - id: drill-sulfate
    type: flashcard
    prompt: 'What is the formula and charge of the sulfate ion?'
    answer:
      expected: 'SO42-, charge 2-'
      aliases: [SO42-, SO4 2-]
    explanation: >-
      Sulfate (SO42-) has sulfur in a +6 oxidation state. It is one of the most
      common polyatomic ions and appears in many salts (e.g., CaSO4, Na2SO4).
    tags: [sulfur, anion, oxyanion, polyatomic]

  - id: drill-sulfite
    type: flashcard
    prompt: 'What is the formula and charge of the sulfite ion?'
    answer:
      expected: 'SO32-, charge 2-'
      aliases: [SO32-, SO3 2-]
    explanation: >-
      Sulfite (SO32-) has sulfur in a +4 oxidation state and one fewer oxygen than
      sulfate. Both sulfate and sulfite carry a 2- charge.
    tags: [sulfur, anion, oxyanion, polyatomic]

  - id: drill-bisulfate
    type: flashcard
    prompt: 'What is the formula and charge of the hydrogen sulfate (bisulfate) ion?'
    answer:
      expected: 'HSO4-, charge 1-'
      aliases: [HSO4-, hydrogen sulfate 1-, bisulfate]
    explanation: >-
      Hydrogen sulfate (bisulfate, HSO4-) is sulfate with one added H+. Adding a
      hydrogen to a 2- ion gives a 1- ion. It is the conjugate base of H2SO4.
    tags: [sulfur, anion, hydrogen, polyatomic]

  - id: drill-thiosulfate
    type: flashcard
    prompt: 'What is the formula and charge of the thiosulfate ion?'
    answer:
      expected: 'S2O32-, charge 2-'
      aliases: [S2O32-, S2O3 2-]
    explanation: >-
      Thiosulfate (S2O32-) looks like sulfate but with one oxygen replaced by a
      sulfur. The prefix thio- indicates replacement of oxygen by sulfur.
    tags: [sulfur, anion, oxyanion, polyatomic]

  # ── Phosphorus-based ───────────────────────────────────────────────────────
  - id: drill-phosphate
    type: flashcard
    prompt: 'What is the formula and charge of the phosphate ion?'
    answer:
      expected: 'PO43-, charge 3-'
      aliases: [PO43-, PO4 3-]
    explanation: >-
      Phosphate (PO43-) has phosphorus in a +5 oxidation state. Its high 3- charge
      makes it important in buffers and biological molecules (DNA backbone).
    tags: [phosphorus, anion, oxyanion, polyatomic]

  - id: drill-hydrogen-phosphate
    type: flashcard
    prompt: 'What is the formula and charge of the hydrogen phosphate ion?'
    answer:
      expected: 'HPO42-, charge 2-'
      aliases: [HPO42-, HPO4 2-]
    explanation: >-
      Hydrogen phosphate (HPO42-) is phosphate with one H+ added: PO43- + H+ gives HPO42-.
      Important in biochemical buffering systems.
    tags: [phosphorus, anion, hydrogen, polyatomic]

  - id: drill-dihydrogen-phosphate
    type: flashcard
    prompt: 'What is the formula and charge of the dihydrogen phosphate ion?'
    answer:
      expected: 'H2PO4-, charge 1-'
      aliases: [H2PO4-, H2PO4 1-]
    explanation: >-
      Dihydrogen phosphate (H2PO4-) has two H+ added to phosphate: PO43- + 2H+ gives H2PO4-.
      It and HPO42- form the phosphate buffer system at physiological pH.
    tags: [phosphorus, anion, hydrogen, polyatomic]

  - id: drill-phosphate-family
    type: typed
    prompt: 'List the three phosphate-family ions in order of decreasing charge.'
    answer:
      expected: PO43-, HPO42-, H2PO4-
    explanation: >-
      Each addition of H+ to phosphate raises the charge by 1: PO4 3- → HPO4 2- → H2PO4 1-.
    tags: [phosphorus, anion, polyatomic]

  # ── Carbon-based ───────────────────────────────────────────────────────────
  - id: drill-carbonate
    type: flashcard
    prompt: 'What is the formula and charge of the carbonate ion?'
    answer:
      expected: 'CO32-, charge 2-'
      aliases: [CO32-, CO3 2-]
    explanation: >-
      Carbonate (CO32-) has carbon in a +4 oxidation state. It forms slightly soluble
      salts with many metals (e.g., CaCO3 = limestone).
    tags: [carbon, anion, oxyanion, polyatomic]

  - id: drill-bicarbonate
    type: flashcard
    prompt: 'What is the formula and charge of the bicarbonate (hydrogen carbonate) ion?'
    answer:
      expected: 'HCO3-, charge 1-'
      aliases: [HCO3-, hydrogen carbonate 1-, bicarbonate]
    explanation: >-
      Bicarbonate (HCO3-) is carbonate with one H+ added. It is the key ion in blood
      buffering and carbonated beverages.
    tags: [carbon, anion, hydrogen, polyatomic]

  - id: drill-acetate
    type: flashcard
    prompt: 'What is the formula and charge of the acetate ion?'
    answer:
      expected: 'C2H3O2- (or CH3COO-), charge 1-'
      aliases: [C2H3O2-, CH3COO-, acetate 1-]
    explanation: >-
      Acetate (C2H3O2- or CH3COO-) is the conjugate base of acetic acid (vinegar).
      Memorize both formulas; CH3COO- shows the carboxylate group clearly.
    tags: [carbon, anion, organic, polyatomic]

  - id: drill-oxalate
    type: flashcard
    prompt: 'What is the formula and charge of the oxalate ion?'
    answer:
      expected: 'C2O42-, charge 2-'
      aliases: [C2O42-, C2O4 2-]
    explanation: >-
      Oxalate (C2O42-) is the dicarboxylate ion found in kidney stones (calcium oxalate)
      and in spinach and other plants.
    tags: [carbon, anion, organic, polyatomic]

  - id: drill-cyanide
    type: flashcard
    prompt: 'What is the formula and charge of the cyanide ion?'
    answer:
      expected: 'CN-, charge 1-'
      aliases: [CN-, cyanide 1-]
    explanation: >-
      Cyanide (CN-) is a simple diatomic anion consisting of carbon triple-bonded to
      nitrogen. It is a well-known poison because it binds to cytochrome c oxidase.
    tags: [carbon, nitrogen, anion, polyatomic]

  # ── Hydroxide and Peroxide ─────────────────────────────────────────────────
  - id: drill-hydroxide
    type: flashcard
    prompt: 'What is the formula and charge of the hydroxide ion?'
    answer:
      expected: 'OH-, charge 1-'
      aliases: [OH-, hydroxide 1-]
    explanation: >-
      Hydroxide (OH-) is one of the most important ions in chemistry. It defines bases
      in the Arrhenius model and participates in countless reactions.
    tags: [oxygen, hydrogen, anion, polyatomic]

  - id: drill-peroxide
    type: flashcard
    prompt: 'What is the formula and charge of the peroxide ion?'
    answer:
      expected: 'O22-, charge 2-'
      aliases: [O22-, O2 2-]
    explanation: >-
      Peroxide (O22-) contains an O-O single bond with each oxygen in the -1 oxidation
      state. Found in H2O2 (hydrogen peroxide) and sodium peroxide (Na2O2).
    tags: [oxygen, anion, polyatomic]

  # ── Chlorine oxyanion family ────────────────────────────────────────────────
  - id: drill-hypochlorite
    type: flashcard
    prompt: 'What is the formula and charge of the hypochlorite ion?'
    answer:
      expected: 'ClO-, charge 1-'
      aliases: [ClO-, hypochlorite 1-]
    explanation: >-
      Hypochlorite (ClO-) has chlorine in the +1 oxidation state. The prefix hypo-
      means "less than" — it has the fewest oxygens in the chlorine oxyanion series.
      Found in bleach (NaOCl).
    tags: [chlorine, anion, oxyanion, polyatomic]

  - id: drill-chlorite
    type: flashcard
    prompt: 'What is the formula and charge of the chlorite ion?'
    answer:
      expected: 'ClO2-, charge 1-'
      aliases: [ClO2-, chlorite 1-]
    explanation: >-
      Chlorite (ClO2-) has chlorine in the +3 oxidation state and two oxygens.
      The -ite suffix = one fewer oxygen than the -ate form.
    tags: [chlorine, anion, oxyanion, polyatomic]

  - id: drill-chlorate
    type: flashcard
    prompt: 'What is the formula and charge of the chlorate ion?'
    answer:
      expected: 'ClO3-, charge 1-'
      aliases: [ClO3-, chlorate 1-]
    explanation: >-
      Chlorate (ClO3-) has chlorine in the +5 oxidation state and three oxygens.
      The -ate suffix = the "standard" higher-oxygen form in the series.
    tags: [chlorine, anion, oxyanion, polyatomic]

  - id: drill-perchlorate
    type: flashcard
    prompt: 'What is the formula and charge of the perchlorate ion?'
    answer:
      expected: 'ClO4-, charge 1-'
      aliases: [ClO4-, perchlorate 1-]
    explanation: >-
      Perchlorate (ClO4-) has chlorine in the +7 oxidation state and four oxygens.
      The prefix per- means "more than" — it has the most oxygens.
      Perchlorate salts are very soluble and strong oxidizers.
    tags: [chlorine, anion, oxyanion, polyatomic]

  - id: drill-chlorine-family-order
    type: typed
    prompt: 'List the four chlorine oxyanions from fewest to most oxygens (name and formula).'
    answer:
      expected: hypochlorite ClO-, chlorite ClO2-, chlorate ClO3-, perchlorate ClO4-
    explanation: >-
      Hypo-...ite (1 O), ...ite (2 O), ...ate (3 O), per-...ate (4 O).
      This naming pattern applies to all halogen oxyanion families.
    tags: [chlorine, anion, oxyanion, polyatomic]

  # ── Chromium and Manganese ─────────────────────────────────────────────────
  - id: drill-chromate
    type: flashcard
    prompt: 'What is the formula and charge of the chromate ion?'
    answer:
      expected: 'CrO42-, charge 2-'
      aliases: [CrO42-, CrO4 2-, chromate 2-]
    explanation: >-
      Chromate (CrO42-) has chromium in a +6 oxidation state. Solutions are yellow.
      It is a strong oxidizer and a known carcinogen (hexavalent chromium).
    tags: [chromium, anion, oxyanion, polyatomic]

  - id: drill-dichromate
    type: flashcard
    prompt: 'What is the formula and charge of the dichromate ion?'
    answer:
      expected: 'Cr2O72-, charge 2-'
      aliases: [Cr2O72-, Cr2O7 2-, dichromate 2-]
    explanation: >-
      Dichromate (Cr2O72-) contains two chromium atoms and seven oxygens.
      Solutions are orange-red. In acidic solution, it is a powerful oxidizing agent.
    tags: [chromium, anion, oxyanion, polyatomic]

  - id: drill-permanganate
    type: flashcard
    prompt: 'What is the formula and charge of the permanganate ion?'
    answer:
      expected: 'MnO4-, charge 1-'
      aliases: [MnO4-, permanganate 1-]
    explanation: >-
      Permanganate (MnO4-) has manganese in the +7 oxidation state. Its intensely purple
      color makes it easy to identify. It is a very strong oxidizer used in redox titrations.
    tags: [manganese, anion, oxyanion, polyatomic]

  # ── Summary / cross-family drills ──────────────────────────────────────────
  - id: drill-charges-summary-1
    type: typed
    prompt: 'Which common polyatomic ions carry a 1+ charge?'
    answer:
      expected: ammonium (NH4+)
    explanation: Ammonium is the only common polyatomic cation in introductory chemistry.
    tags: [cation, polyatomic]

  - id: drill-charges-summary-3-minus
    type: typed
    prompt: 'Which common polyatomic ion carries a 3- charge?'
    answer:
      expected: phosphate (PO43-)
    explanation: Phosphate (PO43-) is the only standard monatomic-sized polyatomic with a 3- charge.
    tags: [anion, polyatomic]

  - id: drill-all-1-minus
    type: typed
    prompt: >-
      Name five polyatomic ions that all carry a 1- charge (give formula and name).
    answer:
      expected: OH-, NO3-, NO2-, HCO3-, ClO3- (many valid sets)
      aliases: [hydroxide nitrate nitrite bicarbonate chlorate]
    explanation: >-
      Many common polyatomic anions are 1-: hydroxide (OH-), nitrate (NO3-), nitrite (NO2-),
      bicarbonate (HCO3-), hypochlorite (ClO-), chlorite (ClO2-), chlorate (ClO3-),
      perchlorate (ClO4-), permanganate (MnO4-), acetate (C2H3O2-), cyanide (CN-).
    tags: [anion, charge, polyatomic]

  - id: drill-all-2-minus
    type: typed
    prompt: >-
      Name four polyatomic ions that all carry a 2- charge (give formula and name).
    answer:
      expected: SO42-, SO32-, CO32-, CrO42- (many valid sets)
      aliases: [sulfate sulfite carbonate chromate]
    explanation: >-
      Common 2- polyatomic ions: sulfate (SO42-), sulfite (SO32-), carbonate (CO32-),
      hydrogen phosphate (HPO42-), thiosulfate (S2O32-), chromate (CrO42-),
      dichromate (Cr2O72-), oxalate (C2O42-), peroxide (O22-).
    tags: [anion, charge, polyatomic]
