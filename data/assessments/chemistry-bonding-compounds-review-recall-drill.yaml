- id: r001
  type: typed
  prompt: Define particle model and name the representation in which it is used.
  answer:
    expected: A representation identifying the particles present and how they are connected or arranged.
    aliases:
    - particle model
  explanation: 'Solution: A representation identifying the particles present and how they are connected or arranged. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r002
  type: typed
  prompt: What does ionic compound tell you to count or distinguish?
  answer:
    expected: An electrically neutral substance made of cations and anions in a repeating assembly.
    aliases:
    - ionic compound
  explanation: 'Solution: An electrically neutral substance made of cations and anions in a repeating assembly. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r003
  type: typed
  prompt: State one condition that must be checked when using molecular compound.
  answer:
    expected: A substance composed of discrete covalently bonded molecules.
    aliases:
    - molecular compound
  explanation: 'Solution: A substance composed of discrete covalently bonded molecules. Why it works: The definition identifies
    the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r004
  type: typed
  prompt: Connect network covalent solid to an observable or particle-level consequence.
  answer:
    expected: An extended covalent structure without separate molecular units.
    aliases:
    - network covalent solid
  explanation: 'Solution: An extended covalent structure without separate molecular units. Why it works: The definition identifies
    the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r005
  type: typed
  prompt: Define formula unit and name the representation in which it is used.
  answer:
    expected: The lowest whole-number ratio of ions represented by an ionic compound formula.
    aliases:
    - formula unit
  explanation: 'Solution: The lowest whole-number ratio of ions represented by an ionic compound formula. Why it works: The
    definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r006
  type: typed
  prompt: What does chemical nomenclature tell you to count or distinguish?
  answer:
    expected: A rule system for assigning names to substances and translating names into formulas.
    aliases:
    - chemical nomenclature
  explanation: 'Solution: A rule system for assigning names to substances and translating names into formulas. Why it works:
    The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r007
  type: typed
  prompt: State one condition that must be checked when using charge balance.
  answer:
    expected: The equality of total positive and negative charge in a neutral ionic formula.
    aliases:
    - charge balance
  explanation: 'Solution: The equality of total positive and negative charge in a neutral ionic formula. Why it works: The
    definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r008
  type: typed
  prompt: Connect Lewis structure to an observable or particle-level consequence.
  answer:
    expected: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges.
    aliases:
    - Lewis structure
  explanation: 'Solution: An electron-bookkeeping drawing showing bonds, lone pairs, and sometimes formal charges. Why it
    works: The definition identifies the exact model feature needed before applying a rule or drawing a conclusion.'
- id: r009
  type: typed
  prompt: Define formal charge and name the representation in which it is used.
  answer:
    expected: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding electrons.
    aliases:
    - formal charge
  explanation: 'Solution: The bookkeeping charge obtained by assigning each atom all nonbonding electrons and half the bonding
    electrons. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r010
  type: typed
  prompt: What does resonance contributor tell you to count or distinguish?
  answer:
    expected: One of two or more valid Lewis structures with the same atom arrangement but different electron placement.
    aliases:
    - resonance contributor
  explanation: 'Solution: One of two or more valid Lewis structures with the same atom arrangement but different electron
    placement. Why it works: The definition identifies the exact model feature needed before applying a rule or drawing a
    conclusion.'
- id: r011
  type: typed
  prompt: State one condition that must be checked when using molecular geometry.
  answer:
    expected: The three-dimensional arrangement of bonded atom positions around a selected center.
    aliases:
    - molecular geometry
  explanation: 'Solution: The three-dimensional arrangement of bonded atom positions around a selected center. Why it works:
