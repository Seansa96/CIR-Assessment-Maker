lesson:
  introduction: >-
    This reinforcement lesson connects charge sign, field direction, vector components, and superposition. The target is a
    reliable diagram-to-equation workflow rather than formula recognition.
  sections:
  - id: physics2-reinforcement-fields-s1
    title: Separate source, field, and force
    required: true
    content: >-
      The electric field is determined by the source charges. A test charge samples that field through $\mathbf F=q\mathbf E$;
      a negative test charge experiences force opposite the field direction.
    check:
      id: physics2-reinforcement-fields-s1-check
      type: multipleChoice
      prompt: A source arrangement produces $\mathbf E$ upward at a point. What is the force on a charge $q=-2\,\mathrm{nC}$ placed there?
      choices:
      - { id: a, text: 'Upward with magnitude $2\,\mathrm{nC}\,E$', issueSignals: [{ id: physics2-force-sign-error, domains: [physics-2] }] }
      - { id: b, text: 'Downward with magnitude $2\,\mathrm{nC}\,E$' }
      - { id: c, text: 'Zero because the field belongs to the sources', issueSignals: [{ id: physics2-field-force-confusion, domains: [physics-2] }] }
      - { id: d, text: 'Downward with magnitude $E/(2\,\mathrm{nC})$', issueSignals: [{ id: physics2-force-units-error, domains: [physics-2] }] }
      answer: { choiceId: b }
      explanation: >-
        Solution: Use $\mathbf F=q\mathbf E$. Since $q$ is negative, the force is opposite the upward field and has magnitude $|q|E$.
        Why it works: The field is source-owned; the test-charge sign determines the sampled force direction.
        Why the other choices fail: a ignores the negative sign, c confuses field with force, and d divides instead of multiplying.
    difficultyDimensions: [representation, sign]
    difficultyEvidence: Converts a signed field into a force direction and unit-consistent magnitude.
  - id: physics2-reinforcement-fields-s2
    title: Add vectors before magnitudes
    required: true
    content: Two equal source contributions can cancel one component and reinforce another. Add components, not scalar field magnitudes.
    check:
      id: physics2-reinforcement-fields-s2-check
      type: multipleChoice
      prompt: Two equal positive charges sit symmetrically on the x-axis. At a point on the y-axis, which field component survives?
      choices:
      - { id: a, text: 'The x-components cancel and the y-components add' }
      - { id: b, text: 'The y-components cancel and the x-components add', issueSignals: [{ id: physics2-component-swap, domains: [physics-2] }] }
      - { id: c, text: 'Both components cancel because the charges are equal', issueSignals: [{ id: physics2-equal-charge-zero-error, domains: [physics-2] }] }
      - { id: d, text: 'The scalar magnitudes add but direction cannot be determined', issueSignals: [{ id: physics2-vector-magnitude-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: Reflecting one charge across the y-axis reverses its x-component while preserving the upward y-component.
        Why it works: Symmetry cancels opposite components and reinforces aligned components.
        Why the other choices fail: They swap components, cancel by magnitude alone, or abandon the direction that symmetry supplies.
    difficultyDimensions: [symmetry, vectorComponents]
    difficultyEvidence: Requires a component-level symmetry argument.
  - id: physics2-reinforcement-fields-s3
    title: Interpret field-line density
    required: true
    content: Field-line drawings encode direction and relative strength. Lines begin on positive charge and end on negative charge or infinity; closer spacing means stronger field.
    check:
      id: physics2-reinforcement-fields-s3-check
      type: multipleChoice
      prompt: At two points on the same field-line diagram, point P has twice the local line density of point Q. What qualitative conclusion is justified?
      choices:
      - { id: a, text: 'The field at P is approximately twice as strong as at Q, if the drawing uses uniform line weighting' }
      - { id: b, text: 'The potential at P is twice the potential at Q', issueSignals: [{ id: physics2-field-potential-confusion, domains: [physics-2] }] }
      - { id: c, text: 'The charge at P is twice the charge at Q', issueSignals: [{ id: physics2-field-source-location-error, domains: [physics-2] }] }
      - { id: d, text: 'The field direction at P must be perpendicular to the field line', issueSignals: [{ id: physics2-field-line-direction-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >-
        Solution: Under the stated line-density convention, denser lines represent a larger field magnitude, so P is approximately twice as strong.
        Why it works: Field lines are tangent to $\mathbf E$ and their density represents magnitude.
        Why the other choices fail: Line density is not potential, local source charge, or a perpendicular direction.
    difficultyDimensions: [representation, interpretation]
    difficultyEvidence: Interprets a field diagram without treating it as a literal charge map.
  - id: physics2-reinforcement-fields-s4
    title: Check inverse-square scaling
    required: true
    content: For a localized point-charge field, doubling the observation distance reduces the magnitude by a factor of four. The direction must still be checked from the source sign.
    check:
      id: physics2-reinforcement-fields-s4-check
      type: multipleChoice
      prompt: A point charge produces $E_0$ at distance $r$. What is the field magnitude at $3r$?
      choices:
      - { id: a, text: '$E_0/3$' , issueSignals: [{ id: physics2-distance-power-error, domains: [physics-2] }] }
      - { id: b, text: '$E_0/9$' }
      - { id: c, text: '$3E_0$', issueSignals: [{ id: physics2-distance-direction-error, domains: [physics-2] }] }
      - { id: d, text: '$E_0$ because the source charge is unchanged', issueSignals: [{ id: physics2-field-distance-error, domains: [physics-2] }] }
      answer: { choiceId: b }
      explanation: >-
        Solution: Coulomb's field scales as $1/r^2$, so replacing $r$ by $3r$ gives $E_0/3^2=E_0/9$.
        Why it works: The source is unchanged but geometric spreading changes the field at the observation point.
        Why the other choices fail: a uses inverse-linear scaling, c reverses the dependence, and d ignores distance.
    difficultyDimensions: [scaling, limitingCase]
    difficultyEvidence: Applies a distance transformation and checks the physical trend.
