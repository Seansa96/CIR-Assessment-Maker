workedExamples:
- id: aops-circles-we-1
  title: From circumference to area
  prompt: 'A circular garden has circumference $18\pi$ meters. Find its area.'
  steps:
  - id: aops-circles-we-1-s1
    title: Extract the radius from the circumference
    prompt: 'Use the circumference formula $C = 2\pi r$ to find the radius.'
    difficultyDimensions:
    - Identify the correct formula connecting circumference to radius.
    - Set up $2\pi r = 18\pi$ and solve.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$2\pi r = 18\pi$.'
      - Dividing both sides by $2\pi$: $r = 9$ meters.
    explanation: |
      Solution:
      The circumference formula is $C = 2\pi r$. Substituting the given circumference:
      $$2\pi r = 18\pi$$
      Dividing both sides by $2\pi$ (the $\pi$ factors cancel entirely):
      $$r = \frac{18\pi}{2\pi} = 9 \text{ meters}$$

      Why it works:
      The circumference and area formulas are linked through the radius. The circumference gives us the radius, and the radius gives us the area. This two-step pipeline ($C \to r \to A$) is the standard approach for any problem where the boundary length is given and the enclosed area is requested.
  - id: aops-circles-we-1-s2
    title: Compute the area from the radius
    prompt: 'Substitute $r = 9$ into $A = \pi r^2$.'
    difficultyDimensions:
    - Apply $A = \pi r^2$ with $r = 9$.
    - Square the radius first, then multiply by $\pi$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - $A = \pi(9)^2 = 81\pi$ square meters.
    explanation: |
      Solution:
      $$A = \pi r^2 = \pi(9)^2 = 81\pi \text{ square meters}$$

      Why it works:
      The radius (a 1D length) is squared in the area formula because area is 2-dimensional. The units follow the same logic: meters $\times$ meters $=$ square meters. Always square the radius *before* multiplying by $\pi$ to avoid the error $A = (81\pi)^2$.
  - id: aops-circles-we-1-s3
    title: Verify with the scaling relationship
    prompt: 'The circumference is $18\pi$ and the radius is 9. If the radius were doubled to 18, reason about how the area would change to confirm your answer is in the right ballpark.'
    difficultyDimensions:
    - A circle with $r = 18$ has circumference $36\pi$ (double) and area $\pi(18)^2 = 324\pi$ (four times).
    - Confirm $81\pi$ is less than $324\pi$ and consistent with $r = 9$ being half of 18.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Doubling radius doubles circumference: $r = 18$ gives $C = 36\pi$.
      - Doubling radius quadruples area: $r = 18$ gives $A = 324\pi = 4 \times 81\pi$.
      - Our answer of $81\pi$ is exactly $1/4$ of $324\pi$, which is consistent.
    explanation: |
      Solution:
      For a circle with $r = 18$ (double our radius): $C = 2\pi(18) = 36\pi$ and $A = \pi(18)^2 = 324\pi$.
      Our area of $81\pi$ satisfies $81\pi \times 4 = 324\pi$, confirming that our radius-9 circle has exactly $1/4$ the area of a radius-18 circle — precisely as expected when the radius is halved.

      Why it works:
      The quadratic relationship between radius and area is one of the most important facts about circles. When radius scales by a factor of $k$, area scales by $k^2$. This is why doubling a circle's radius does NOT double its area — it quadruples it. This non-intuitive scaling is the source of many classic errors.

- id: aops-circles-we-2
  title: Scaling a circular display
  prompt: 'A circular display is enlarged so its radius becomes $3/2$ of the original. The original area is 80 square centimeters. Find the new area.'
  steps:
  - id: aops-circles-we-2-s1
    title: Identify the linear scale factor and the area scale factor
    prompt: 'Determine $k$ (the linear scale factor) and $k^2$ (the area scale factor).'
    difficultyDimensions:
    - The linear scale factor is the ratio of the new radius to the old: $k = 3/2$.
    - Area scales by the square: $k^2 = (3/2)^2 = 9/4$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Linear scale factor $k = 3/2$.
      - Area scale factor $k^2 = 9/4$.
    explanation: |
      Solution:
      The radius is scaled by $k = \frac{3}{2}$ (the new radius is $1.5$ times the old).
      Area is a 2D measurement, so it scales by the *square* of the linear factor:
      $$k^2 = \left(\frac{3}{2}\right)^2 = \frac{9}{4}$$

      Why it works:
      Intuitively: area $= \pi r^2$. If we replace $r$ with $\frac{3}{2}r$, the new area is $\pi(\frac{3}{2}r)^2 = \pi \cdot \frac{9}{4} r^2 = \frac{9}{4} \cdot \pi r^2$. The $9/4$ factor multiplies the entire original area.
  - id: aops-circles-we-2-s2
    title: Compute the new area
    prompt: 'Apply the area scale factor to the original area of 80 square centimeters.'
    difficultyDimensions:
    - Multiply: $80 \times (9/4)$.
    - Simplify by dividing 80 by 4 first, then multiplying by 9.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$80 \times (9/4) = 20 \times 9 = 180$ square centimeters.'
    explanation: |
      Solution:
      The new area equals the original area multiplied by the area scale factor:
      $$A_{\text{new}} = 80 \times \frac{9}{4} = \frac{80}{4} \times 9 = 20 \times 9 = 180 \text{ square centimeters}$$

      Why it works:
      Dividing by the denominator before multiplying by the numerator avoids large intermediate numbers. Scaling factors multiply the measurement — adding the factor or using it as an exponent of the area would be incorrect.
  - id: aops-circles-we-2-s3
    title: Sanity-check with a direction argument
    prompt: 'The radius increased by 50%. Verify that the area increased by more than 50% (i.e., by 125%), confirming the quadratic scaling.'
    difficultyDimensions:
    - A 50% linear increase gives a $(1.5)^2 = 2.25 = 225\%$ area increase relative to the original.
    - The area increased from 80 to 180, which is $180/80 = 2.25$, confirming a $125\%$ increase.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - 'New area / Old area $= 180/80 = 9/4 = 2.25$.'
      - The area grew by $125\%$, not $50\%$ — consistent with the $k^2$ rule.
    explanation: |
      Solution:
      The ratio of new to old area is $180 / 80 = 9/4 = 2.25$.
      This means the area grew by $225\% - 100\% = 125\%$, not the naive $50\%$ that would follow from only considering the linear scale.

      Why it works:
      A classic misconception is that "50% bigger radius → 50% bigger area." The quadratic law kills this intuition: a $50\%$ increase in radius ($k = 1.5$) causes a $125\%$ increase in area ($k^2 - 1 = 1.25$). This has real-world consequences: doubling a pizza's diameter gives you 4 times the pizza, not 2 times.

- id: aops-circles-we-3
  title: Sector with a removed angle
  prompt: 'A radius-12 disk has a $150°$ sector removed. Find the area that remains.'
  steps:
  - id: aops-circles-we-3-s1
    title: Find the remaining sector angle and express it as a fraction of the full disk
    prompt: 'Compute the angle of the remaining region and reduce it to lowest-terms fraction of $360°$.'
    difficultyDimensions:
    - Remaining angle $= 360° - 150°$.
    - Reduce the fraction $210/360$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Remaining angle $= 210°$.
      - Fraction $= 210/360 = 7/12$.
    explanation: |
      Solution:
      The removed sector spans $150°$. The full circle is $360°$, so the remaining region spans:
      $$360° - 150° = 210°$$
      Expressing this as a fraction of the full disk:
      $$\frac{210}{360} = \frac{7}{12}$$
      (Dividing numerator and denominator by 30.)

      Why it works:
      The central angle of a sector is directly proportional to the fraction of the disk's area it occupies. A $210°$ sector is $7/12$ of $360°$, so it holds $7/12$ of the total area — regardless of the radius.
  - id: aops-circles-we-3-s2
    title: Compute the full disk area and multiply by the fraction
    prompt: 'Find the total area of the radius-12 disk, then apply the $7/12$ fraction.'
    difficultyDimensions:
    - Full area $= \pi(12)^2$.
    - Multiply by $7/12$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Full area $= 144\pi$.
      - Remaining area $= 144\pi \times (7/12) = 84\pi$ square units.
    explanation: |
      Solution:
      The full disk area:
      $$A = \pi r^2 = \pi(12)^2 = 144\pi$$
      The remaining area (after removing the $150°$ sector):
      $$A_{\text{remain}} = 144\pi \times \frac{7}{12} = \frac{144}{12} \pi \times 7 = 12\pi \times 7 = 84\pi$$

      Why it works:
      The $12$ in the denominator of the fraction conveniently cancels with the $12^2 = 144 = 12 \times 12$ in the area, leaving a clean integer multiplication. This is not a coincidence when the radius and the angle reduction share a common factor.
  - id: aops-circles-we-3-s3
    title: Verify the result with a bounding argument
    prompt: 'Confirm that $84\pi$ is geometrically reasonable by checking it against the half-disk and full disk areas.'
    difficultyDimensions:
    - Half the disk ($180°$) has area $72\pi$.
    - The full disk ($360°$) has area $144\pi$.
    - Since $210° > 180°$, the remaining area should be greater than $72\pi$ but less than $144\pi$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - '$72\pi < 84\pi < 144\pi$ ✓.'
      - The remaining $210°$ sector is more than a half-disk but less than the full disk, so $84\pi$ is reasonable.
    explanation: |
      Solution:
      The half-disk area (for $180°$) would be $\frac{1}{2}(144\pi) = 72\pi$.
      The remaining region spans $210° > 180°$, so its area must be greater than $72\pi$.
      The remaining region spans $210° < 360°$, so its area must be less than $144\pi$.
      Our answer $84\pi$ satisfies $72\pi < 84\pi < 144\pi$. ✓

      Why it works:
      A bounding check does not prove the answer is correct, but it will quickly catch order-of-magnitude errors (like accidentally computing the removed sector's area of $60\pi$ instead of the remaining $84\pi$).

- id: aops-circles-we-4
  title: Two concentric circles — annulus area
  prompt: 'A large circle has a circumference of $20\pi$. A smaller concentric circle has a radius that is $3/5$ of the large circle''s radius. Find the area of the ring (annulus) between the two circles.'
  steps:
  - id: aops-circles-we-4-s1
    title: Find both radii
    prompt: 'Extract the outer radius from the circumference, then compute the inner radius.'
    difficultyDimensions:
    - Set $2\pi r = 20\pi$ to find the outer radius.
    - Multiply by $3/5$ to find the inner radius.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Outer radius $R = 10$.
      - Inner radius $r = (3/5)(10) = 6$.
    explanation: |
      Solution:
      From the circumference of the large circle: $2\pi R = 20\pi \implies R = 10$.
      The inner radius is $3/5$ of the outer radius: $r = (3/5)(10) = 6$.

      Why it works:
      All measurements of the inner circle scale linearly with the inner radius, so we compute the inner radius directly from the given proportional relationship.
  - id: aops-circles-we-4-s2
    title: Find both circle areas
    prompt: 'Compute the area of each circle separately.'
    difficultyDimensions:
    - Outer area: $\pi R^2 = \pi(10)^2$.
    - Inner area: $\pi r^2 = \pi(6)^2$.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Outer area $= 100\pi$.
      - Inner area $= 36\pi$.
    explanation: |
      Solution:
      $$A_{\text{outer}} = \pi(10)^2 = 100\pi$$
      $$A_{\text{inner}} = \pi(6)^2 = 36\pi$$

      Why it works:
      We compute both areas separately before subtracting. Although the compact formula $\pi(R^2 - r^2)$ exists, computing each area individually makes intermediate errors easier to catch.
  - id: aops-circles-we-4-s3
    title: Compute the annulus area and verify with the scaling law
    prompt: 'Subtract the inner area from the outer area, then verify using the area scale factor.'
    difficultyDimensions:
    - Annulus area $= A_{\text{outer}} - A_{\text{inner}}$.
    - Verify: The inner circle has area $(3/5)^2 = 9/25$ of the outer circle.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Annulus area $= 100\pi - 36\pi = 64\pi$ square units.
      - Scaling check: $(3/5)^2 = 9/25$, so inner area $= (9/25)(100\pi) = 36\pi$ ✓.
    explanation: |
      Solution:
      The annulus area is the area of the ring between the two circles:
      $$A_{\text{annulus}} = 100\pi - 36\pi = 64\pi \text{ square units}$$
      **Scaling verification:** The inner radius is $3/5$ of the outer radius, so the inner circle's area is $(3/5)^2 = 9/25$ of the outer circle's area: $\frac{9}{25}(100\pi) = 36\pi$ ✓.

      Why it works:
      The annulus area formula generalizes to $\pi(R^2 - r^2) = \pi(R+r)(R-r)$ by factoring the difference of squares: $\pi(10+6)(10-6) = \pi(16)(4) = 64\pi$. This factored form is useful when neither radius is given directly (e.g., when the sum and difference of the radii are known).
