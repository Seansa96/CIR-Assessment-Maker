workedExamples:
- id: aops-circles-introduction-worked-example-problem-1
  title: From circumference to area
  problem: A circular garden has circumference $18\pi$ meters. Find its area.
  steps:
  - id: aops-circles-introduction-worked-example-p1-s1
    title: Parse the target
    instruction: Separate the given boundary length from the requested two-dimensional area.
    type: multipleChoice
    prompt: Which formula should be used first?
    choices:
    - id: a
      text: $C=2\pi r$
    - id: b
      text: $A=\pi r^2$
    - id: c
      text: $d=\pi r$
    - id: d
      text: $C=\pi r^2$
    answer:
      choiceId: a
    explanation: Circumference determines the radius before area can be found.
    media:
    - type: image
      src: /assessments/aops/aops-circles-structure.svg
      alt: Circle centered at O with radius and diameter distinguished.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-circles-introduction-worked-example-p1-s2
    title: Recover the radius
    instruction: Set $2\pi r=18\pi$ and divide by $2\pi$.
    type: multipleChoice
    prompt: What is $r$?
    choices:
    - id: a
      text: 9 meters
    - id: b
      text: 6 meters
    - id: c
      text: 18 meters
    - id: d
      text: $9\pi$ meters
    answer:
      choiceId: a
    explanation: The factors of $\pi$ cancel, giving $r=9$.
  - id: aops-circles-introduction-worked-example-p1-s3
    title: Compute the area
    instruction: Substitute the recovered radius into $A=\pi r^2$.
    type: multipleChoice
    prompt: What area results?
    choices:
    - id: a
      text: $81\pi$ square meters
    - id: b
      text: $18\pi$ square meters
    - id: c
      text: $36\pi$ square meters
    - id: d
      text: $162\pi$ square meters
    answer:
      choiceId: a
    explanation: $A=\pi(9)^2=81\pi$.
  - id: aops-circles-introduction-worked-example-p1-s4
    title: Check units
    instruction: Area must use square units and should scale quadratically.
    type: multipleChoice
    prompt: Which unit is correct?
    choices:
    - id: a
      text: square meters
    - id: b
      text: meters
    - id: c
      text: cubic meters
    - id: d
      text: degrees
    answer:
      choiceId: a
    explanation: Area is two-dimensional.
  - id: aops-circles-introduction-worked-example-p1-s5
    title: State the conclusion
    instruction: Answer the requested quantity, not the intermediate radius.
    type: multipleChoice
    prompt: What is the final answer?
    choices:
    - id: a
      text: $81\pi$ square meters
    - id: b
      text: 9 meters
    - id: c
      text: $18\pi$ meters
    - id: d
      text: $81$ meters
    answer:
      choiceId: a
    explanation: The garden's area is $81\pi$ square meters.
- id: aops-circles-introduction-worked-example-problem-2
  title: Scaling a circular display
  problem: A circular display is enlarged so its radius becomes $3/2$ of the original. The original area is $80$ square centimeters. Find the new area.
  steps:
  - id: aops-circles-introduction-worked-example-p2-s1
    title: Identify the scale
    instruction: The linear scale factor is the ratio of the new radius to the old.
    type: multipleChoice
    prompt: What is the linear factor?
    choices:
    - id: a
      text: $3/2$
    - id: b
      text: $2/3$
    - id: c
      text: $3$
    - id: d
      text: $9/4$
    answer:
      choiceId: a
    explanation: All lengths scale by $3/2$.
    media:
    - type: image
      src: /assessments/aops/aops-circles-scaling.svg
      alt: Two circles with radii r and three-halves r illustrating linear and area scaling.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-circles-introduction-worked-example-p2-s2
    title: Choose the area law
    instruction: Area scales by the square of a linear factor.
    type: multipleChoice
    prompt: What is the area factor?
    choices:
    - id: a
      text: $9/4$
    - id: b
      text: $3/2$
    - id: c
      text: $3$
    - id: d
      text: $4/9$
    answer:
      choiceId: a
    explanation: Square $3/2$ to get $9/4$.
  - id: aops-circles-introduction-worked-example-p2-s3
    title: Apply the factor
    instruction: Multiply the original area by $9/4$.
    type: multipleChoice
    prompt: What calculation is correct?
    choices:
    - id: a
      text: $80\cdot 9/4$
    - id: b
      text: $80\cdot 3/2$
    - id: c
      text: $80+9/4$
    - id: d
      text: $80\div 9$
    answer:
      choiceId: a
    explanation: A scale factor multiplies, rather than adds to, the measurement.
  - id: aops-circles-introduction-worked-example-p2-s4
    title: Evaluate
    instruction: Simplify $80\cdot9/4$.
    type: multipleChoice
    prompt: What is the new area?
    choices:
    - id: a
      text: 180 square centimeters
    - id: b
      text: 120 square centimeters
    - id: c
      text: 90 square centimeters
    - id: d
      text: 320 square centimeters
    answer:
      choiceId: a
    explanation: $80/4=20$ and $20\cdot9=180$.
  - id: aops-circles-introduction-worked-example-p2-s5
    title: Sanity-check
    instruction: The radius increased by 50 percent, so area must increase by more than 50 percent.
    type: multipleChoice
    prompt: Which observation supports the answer?
    choices:
    - id: a
      text: $180>120$
    - id: b
      text: $180<80$
    - id: c
      text: Area should scale linearly.
    - id: d
      text: Units should be centimeters.
    answer:
      choiceId: a
    explanation: Quadratic growth makes the area more than $120$.
- id: aops-circles-introduction-worked-example-problem-3
  title: Sector with a removed center angle
  problem: A radius-12 disk has a $150^\circ$ sector removed. Find the area that remains.
  steps:
  - id: aops-circles-introduction-worked-example-p3-s1
    title: Translate the region
    instruction: The remaining region corresponds to the rest of the full $360^\circ$ turn.
    type: multipleChoice
    prompt: What angle remains?
    choices:
    - id: a
      text: $210^\circ$
    - id: b
      text: $150^\circ$
    - id: c
      text: $120^\circ$
    - id: d
      text: $510^\circ$
    answer:
      choiceId: a
    explanation: $360-150=210$.
    media:
    - type: image
      src: /assessments/aops/aops-circles-sector.svg
      alt: Circle sector with a central angle and shaded region distinguishing sector area.
      caption: Use only the labels and markings stated in the problem.
  - id: aops-circles-introduction-worked-example-p3-s2
    title: Write the fraction
    instruction: Convert the remaining central angle into a fraction of the disk.
    type: multipleChoice
    prompt: Which fraction is correct?
    choices:
    - id: a
      text: $210/360=7/12$
    - id: b
      text: $5/12$
    - id: c
      text: $7/6$
    - id: d
      text: $12/7$
    answer:
      choiceId: a
    explanation: Reduce $210/360$ by 30.
  - id: aops-circles-introduction-worked-example-p3-s3
    title: Find the disk area
    instruction: Use $A=\pi r^2$ with $r=12$.
    type: multipleChoice
    prompt: What is the whole area?
    choices:
    - id: a
      text: $144\pi$
    - id: b
      text: $24\pi$
    - id: c
      text: $12\pi$
    - id: d
      text: $288\pi$
    answer:
      choiceId: a
    explanation: $12^2=144$.
  - id: aops-circles-introduction-worked-example-p3-s4
    title: Find the remainder
    instruction: Multiply the full area by $7/12$.
    type: multipleChoice
    prompt: What remains?
    choices:
    - id: a
      text: $84\pi$ square units
    - id: b
      text: $60\pi$ square units
    - id: c
      text: $72\pi$ square units
    - id: d
      text: $252\pi$ square units
    answer:
      choiceId: a
    explanation: $144\pi\cdot7/12=84\pi$.
  - id: aops-circles-introduction-worked-example-p3-s5
    title: Bound the result
    instruction: The remaining angle exceeds half a turn but is less than a full turn.
    type: multipleChoice
    prompt: Which bound must hold?
    choices:
    - id: a
      text: $72\pi<84\pi<144\pi$
    - id: b
      text: $84\pi<72\pi$
    - id: c
      text: $84\pi>144\pi$
    - id: d
      text: $84\pi$ is a length.
    answer:
      choiceId: a
    explanation: The area must lie between half and all of the disk.
