workedExamples:
  - id: we-spring-gravity
    title: Launching a Block
    problem: |
      Let's combine spring potential energy and gravitational potential energy using conservation of mechanical energy.
    steps:
      - id: step-1
        title: Step 1 — Initial Energy
        instruction: |
          A block of mass $m$ sits on top of a vertical spring (constant $k$) which is compressed downward by a distance $d$ from its relaxed length. The system is at rest. Let's set gravitational potential energy $U_g = 0$ at this initial compressed position.
        type: symbolicResponse
        prompt: |
          What is the total initial mechanical energy $E_i$ of the system?
        answer:
          gradingMode: auto
          expectedLatex: (1/2)*k*d^2
          equivalenceMode: expression
          tolerance: 0
        explanation: 'Since it starts from rest ($K_i = 0$) and we set $U_{g,i} = 0$, the only energy is the spring potential energy: $E_i = \frac{1}{2}kd^2$.'
      - id: step-2
        title: Step 2 — Final Energy
        instruction: |
          The spring is released, launching the block straight up into the air. The spring detaches when it reaches its relaxed length. At the block's maximum height $h$ (measured from the launch point), it briefly stops moving.
        type: symbolicResponse
        prompt: |
          What is the total final mechanical energy $E_f$ of the system at maximum height?
        answer:
          gradingMode: auto
          expectedLatex: m*g*h
          equivalenceMode: expression
          tolerance: 0
        explanation: 'At max height, $K_f = 0$ and the spring is detached so $U_{s,f} = 0$. The only energy is gravitational: $E_f = mgh$.'
      - id: step-3
        title: Step 3 — Conservation of Energy
        instruction: |
          Since there are no nonconservative forces doing work (ignoring air resistance), $E_i = E_f$.
        type: symbolicResponse
        prompt: |
          Set $E_i = E_f$ and solve for the maximum height $h$.
        answer:
          gradingMode: auto
          expectedLatex: (k*d^2)/(2*m*g)
          equivalenceMode: expression
          tolerance: 0
        explanation: 'Equating them gives $\frac{1}{2}kd^2 = mgh$. Dividing by $mg$ yields $h = \frac{kd^2}{2mg}$.'
