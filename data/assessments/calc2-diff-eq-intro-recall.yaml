items:
- id: differential-equation
  type: flashcard
  prompt: What makes an equation a differential equation?
  answer: { expected: 'It contains an unknown function and one or more of its derivatives.' }
  explanation: The unknown is a function rather than a single number.
  tags: [definition]
- id: order
  type: typed
  prompt: The order of a differential equation is the order of its ____ derivative.
  answer: { expected: highest, aliases: [highest-order] }
  explanation: Powers of derivatives do not determine order.
  tags: [classification]
- id: solution-check
  type: flashcard
  prompt: How do you verify that a proposed function solves a differential equation?
  answer: { expected: 'Substitute the function and its derivatives into the differential equation and obtain a true statement.' }
  explanation: Verification tests the original equation, not just a rearranged form.
  tags: [verification]
- id: ivp
  type: flashcard
  prompt: What extra information turns a differential equation into an initial value problem?
  answer: { expected: 'An initial condition for the dependent variable or its derivatives.' }
  explanation: Initial data selects one member of a solution family.
  tags: [ivp]
- id: slope-field
  type: flashcard
  prompt: In a slope field for $y'=F(x,y)$, what does a short segment at $(x,y)$ represent?
  answer: { expected: 'The slope F(x,y) of a solution through that point.', aliases: ['the solution slope'] }
  explanation: Solution curves are tangent to these segments.
  tags: [slope-field]
- id: equilibrium
  type: typed
  prompt: A constant solution of $y'=F(y)$ occurs where $F(y)$ equals ____.
  answer: { expected: zero, aliases: ['0'] }
  explanation: A constant function has derivative zero.
  tags: [equilibrium]
- id: proportional-growth
  type: cloze
  prompt: “A population grows at a rate proportional to its size” translates to $P'=____$.
  answer: { expected: kP, aliases: ['k*p'] }
  explanation: “Proportional to P” introduces a constant $k$ times $P$.
  tags: [modeling]
- id: rumor-model
  type: flashcard
  prompt: In a fixed population of size $M$, why can a rumor model contain $y(M-y)$?
  answer: { expected: 'It counts interactions between people who have heard the rumor and people who have not.' }
  explanation: The two factors represent the two relevant groups.
  tags: [modeling]
