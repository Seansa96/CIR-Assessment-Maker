- id: q001
  type: multipleChoice
  prompt: 'What is the domain of $f(x,y)=\ln(x-y)$?'
  choices:
  - id: a
    text: $x>y$
  - id: b
    text: '$x\ge y$'
    issueSignals:
    - id: domain-range-misidentified
  - id: c
    text: all pairs
    issueSignals:
    - id: domain-range-misidentified
  - id: d
    text: $x<y$
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: domain-range-misidentified
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: A real logarithm needs a strictly positive argument.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Sets, Sequences, and Functions.

    Why the other choices fail: Choice b, ''$x\ge y$'', does not give ''$x>y$'' for ''What is the domain of $f(x,y)=\ln(x-y)$?''.
    It substitutes a different result, representation, or condition for the one the prompt specifies.

    Choice c, ''all pairs'', does not give ''$x>y$'' for ''What is the domain of $f(x,y)=\ln(x-y)$?''. It substitutes a different
    result, representation, or condition for the one the prompt specifies.

    Choice d, ''$x<y$'', does not give ''$x>y$'' for ''What is the domain of $f(x,y)=\ln(x-y)$?''. It substitutes a different
    result, representation, or condition for the one the prompt specifies.'
