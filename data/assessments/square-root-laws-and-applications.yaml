questions:
- id: q001
  type: multipleChoice
  prompt: Simplify $$\sqrt{50}$$.
  choices:
  - id: a
    text: $$(5\sqrt{2}$$)
  - id: b
    text: $$(25\sqrt{2}$$)
  - id: c
    text: $2\sqrt{25}$
  - id: d
    text: $\sqrt{25}$
  answer:
    choiceId: a
  explanation: 'Since $50=25\cdot2$, $\sqrt{50}=\sqrt{25}\sqrt2=5\sqrt2$.


    Related topic: Simplifying Square Roots with Perfect-Square Factors

    '
- id: q002
  type: multipleChoice
  prompt: Which expression is equivalent to $(\sqrt{18x^2})$, assuming $(x\ge0$)?
  choices:
  - id: a
    text: $(3x\sqrt2)$
  - id: b
    text: $(9x\sqrt2)$
  - id: c
    text: $(3\sqrt{x})$
  - id: d
    text: $(18x)$
  answer:
    choiceId: a
  explanation: 'Factor $(18x^2=9\cdot2\cdot x^2)$, so the square root is $(3x\sqrt2)$
    when $(x\ge0)$.


    Related topic: Simplifying Radical Expressions with Variables

    '
- id: q003
  type: multipleChoice
  prompt: Which rule is valid for nonnegative $(a)$ and $(b)$?
  choices:
  - id: a
    text: $(\sqrt{ab}=\sqrt a\sqrt b)$
  - id: b
    text: $(\sqrt{a+b}=\sqrt a+\sqrt b)$
  - id: c
    text: $(\sqrt{a-b}=\sqrt a-\sqrt b)$
  - id: d
    text: $(\sqrt{a^2}=a^2)$
  answer:
    choiceId: a
  explanation: 'Square roots distribute over multiplication for nonnegative factors,
    but not over addition or subtraction.


    Related topic: Product Property of Square Roots

    '
- id: q004
  type: multipleChoice
  prompt: Simplify $$(\sqrt{72})$$.
  choices:
  - id: a
    text: $(6\sqrt2)$
  - id: b
    text: $(8\sqrt9)$
  - id: c
    text: $(36\sqrt2)$
  - id: d
    text: $(3\sqrt8)$
  answer:
    choiceId: a
  explanation: 'Use $72=36\cdot2$, so $\sqrt{72}=6\sqrt2$.


    Related topic: Simplifying Square Roots

    '
- id: q005
  type: multipleChoice
  prompt: Which expression is in simplest radical form?
  choices:
  - id: a
    text: $(2\sqrt3)$
  - id: b
    text: $(\sqrt{12})$
  - id: c
    text: $(\sqrt{27})$
  - id: d
    text: $(5\sqrt4)$
  answer:
    choiceId: a
  explanation: '$(2\sqrt3)$ has no perfect-square factor left inside the radical.


    Related topic: Simplest Radical Form

    '
- id: q006
  type: multipleChoice
  prompt: Simplify $$(\sqrt{3}\cdot\sqrt{12})$$.
  choices:
  - id: a
    text: '6'
  - id: b
    text: $(\sqrt{15})$
  - id: c
    text: $(3\sqrt{12})$
  - id: d
    text: $(6\sqrt3)$
  answer:
    choiceId: a
  explanation: '$(\sqrt3\sqrt{12}=\sqrt{36}=6)$.


    Related topic: Multiplying Square Roots

    '
- id: q007
  type: multipleChoice
  prompt: Simplify $$(\frac{\sqrt{45}}{\sqrt5})$$.
  choices:
  - id: a
    text: '3'
  - id: b
    text: $(9)$
  - id: c
    text: $(3\sqrt5)$
  - id: d
    text: $(\sqrt{40})$
  answer:
    choiceId: a
  explanation: 'Combine the quotient: $\sqrt{45}/\sqrt5=\sqrt9=3$.


    Related topic: Quotient Property of Square Roots

    '
- id: q008
  type: multipleChoice
  prompt: Rationalize the denominator of $$(\frac{4}{\sqrt2})$$.
  choices:
  - id: a
    text: $(2\sqrt2)$
  - id: b
    text: $(4\sqrt2)$
  - id: c
    text: $(\frac{2}{\sqrt2})$
  - id: d
    text: $(\sqrt2)$
  answer:
    choiceId: a
  explanation: 'Multiply by $\sqrt2/\sqrt2$: $4/\sqrt2=4\sqrt2/2=2\sqrt2$.


    Related topic: Rationalizing Square-Root Denominators

    '
- id: q009
  type: multipleChoice
  prompt: Solve $$(\sqrt{x}=7)$$.
  choices:
  - id: a
    text: '49'
  - id: b
    text: '14'
  - id: c
    text: '7'
  - id: d
    text: $(\pm7)$
  answer:
    choiceId: a
  explanation: 'Square both sides: $x=7^2=49$. The square-root symbol means the principal
    nonnegative root.


    Related topic: Solving Basic Square-Root Equations

    '
- id: q010
  type: multipleChoice
  prompt: A right triangle has legs 6 and 8. Which expression gives the hypotenuse?
  choices:
  - id: a
    text: $(\sqrt{6^2+8^2})$
  - id: b
    text: $(\sqrt{8^2-6^2})$
  - id: c
    text: $(6+8)$
  - id: d
    text: $(\sqrt{6+8})$
  answer:
    choiceId: a
  explanation: 'The Pythagorean theorem gives $$(c=\sqrt{a^2+b^2})$$.


    Related topic: Square Roots in the Pythagorean Theorem

    '
- id: q011
  type: numericResponse
  prompt: Evaluate $$(\sqrt{144})$$.
  answer:
    value: 12
    tolerance: 0.0001
  explanation: '$$(12^2=144)$$, so the principal square root of 144 is 12.


    Related topic: Perfect-Square Roots

    '
- id: q012
  type: numericResponse
  prompt: A square has area 81 square units. What is its side length?
  answer:
    value: 9
    tolerance: 0.0001
  explanation: '$$(If A=s^2, then s=\sqrt A=\sqrt{81}=9)$$.


    Related topic: Square Roots in Area Applications

    '
- id: q013
  type: numericResponse
  prompt: Simplify $$(\sqrt{200})$$. What is the coefficient of the simplified radical?
  answer:
    value: 10
    tolerance: 0.0001
  explanation: '$$(\sqrt{200}=\sqrt{100\cdot2}=10\sqrt2)$$, so the coefficient is
    10.


    Related topic: Extracting Perfect-Square Factors

    '
- id: q014
  type: freeResponse
  prompt: 'Explain why


    $$

    \sqrt{9+16}

    \ne

    \sqrt9+\sqrt{16}

    $$


    is true.

    '
  answer:
    expected: 'The square root does not distribute over addition.


      $$

      \sqrt{9+16}

      =

      \sqrt{25}

      =

      5

      $$


      while


      $$

      \sqrt9+\sqrt{16}

      =

      3+4

      =

      7.

      $$

      '
    gradingMode: selfCheck
  explanation: 'Checking a simple example shows that the addition shortcut gives the
    wrong value.


    Related topic: Common Square-Root Law Mistakes

    '
- id: q015
  type: numericResponse
  prompt: A diagonal of a rectangle with side lengths 5 and 12 has length $$(\sqrt{5^2+12^2})$$.
    What is the diagonal length?
  answer:
    value: 13
    tolerance: 0.0001
  explanation: '$$(\sqrt{5^2+12^2}=\sqrt{25+144}=\sqrt{169}=13)$$.


    Related topic: Square Roots in Distance and Diagonal Applications

    '
