id: physics2-ch15-ac-components-concept-lesson
title: AC Sources and Components
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-ac-circuits
lesson:
  introduction: This lesson develops the main ideas behind AC Sources and Components and connects them
    to the governing physical relationships.
  sections:
  - id: l1-sec1
    title: Alternating Current
    required: true
    content: 'An AC generator produces a sinusoidally varying voltage: $v(t) = V_{max} \sin(\omega t)$,
      where $\omega = 2\pi f$.'
  - id: l1-sec2
    title: Resistors, Inductors, Capacitors in AC
    required: true
    content: 'In an AC circuit:

      - Resistors: Voltage and current are in phase.

      - Inductors: Voltage leads current by $90^\circ$. Reactance is $X_L = \omega L$.

      - Capacitors: Voltage lags current by $90^\circ$. Reactance is $X_C = \frac{1}{\omega C}$.'
