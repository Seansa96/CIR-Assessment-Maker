lesson:
  introduction: >
    This lesson develops a repeatable way to solve AC Sources and Components problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch15-ac-components-s1
    title: Name the model and quantities
    required: true
    content: >
      AC Sources and Components uses X_L = omega L and X_C = 1/(omega C). In the name the model and quantities stage, evaluate angular frequency first and compare how inductive and capacitive opposition change with frequency.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving AC Sources and Components problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch15-ac-components-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for AC Sources and Components, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use X_L = omega L and X_C = 1/(omega C) after you evaluate angular frequency first and compare how inductive and capacitive opposition change with frequency.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this AC Sources and Components problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-ac-components-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables X_L = omega L and X_C = 1/(omega C) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-ac-components-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit AC Sources and Components.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-ac-components-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for AC Sources and Components, first evaluate angular frequency first and compare how inductive and capacitive opposition change with frequency. Then apply X_L = omega L and X_C = 1/(omega C) with one consistent coordinate system and solve for the requested quantity.


        Why it works: X_L = omega L and X_C = 1/(omega C) connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
