topicId: physics2-ac-circuits
workedExamples:
- id: l1-sec1
  title: Alternating Current
  explanation: 'An AC generator produces a sinusoidally varying voltage: $v(t) = V_{max}
    \sin(\omega t)$, where $\omega = 2\pi f$.'
- id: l1-sec2
  title: Resistors, Inductors, Capacitors in AC
  explanation: 'In an AC circuit:

    - Resistors: Voltage and current are in phase.

    - Inductors: Voltage leads current by $90^\circ$. Reactance is $X_L = \omega L$.

    - Capacitors: Voltage lags current by $90^\circ$. Reactance is $X_C = \frac{1}{\omega
    C}$.'
