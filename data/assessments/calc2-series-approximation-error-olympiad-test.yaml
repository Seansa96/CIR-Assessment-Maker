- id: q004
  type: freeResponse
  skills:
  - find-large-geometric-truncation-counts
  prompt: |
    Truncate $\sum_{n=0}^{\infty}(0.9)^n$ after exponent N. What is
    the smallest N making the exact remainder less than $0.01$?

    Give the conclusion and a complete calculation or theorem-based justification.
  answer:
    gradingMode: selfCheck
    keyPoints:
