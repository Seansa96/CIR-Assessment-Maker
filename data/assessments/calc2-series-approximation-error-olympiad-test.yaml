- id: q002
  type: freeResponse
  skills:
  - bound-central-difference-errors
  prompt: |
    If $|f'''(t)|\le M$ near x, what bound holds for the central
    difference approximation
    $[f(x+h)-f(x-h)]/(2h)$ to $f'(x)$?

    Give the conclusion and a complete calculation or theorem-based justification.
  answer:
    gradingMode: selfCheck
    keyPoints:
    - The even Taylor terms cancel, and the two cubic remainders together contribute at most $Mh^3/3$, followed by division by $2h$.
