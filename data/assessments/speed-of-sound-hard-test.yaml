- id: q001
  type: numericResponse
  skills:
  - physics-speed-of-sound
  prompt: Use the Speed of Sound diagram and the model $v\approx331+0.6T_C$. A calibrated scenario scales
    the reference values by 1.1. Determine the speed in air. Give a numerical answer.
  answer:
    value: 377.3
    tolerance: 3.773
  explanation: Apply $v\approx331+0.6T_C$ consistently to the scaled scenario; the requested speed in
    air is 377.3.
  media:
  - type: image
    src: /media/physics/owa/speed-of-sound.svg
    alt: Labeled original schematic for Speed of Sound used for quantitative analysis.
    caption: Speed of Sound model diagram.
