questions:
  - id: q001
    type: numericResponse
    skills: [physics-traveling-waves]
    prompt: |
      A traveling wave has a wavelength of 0.75 m and a frequency of 4.0 Hz. What is the wave speed in m/s?
    answer:
      value: 3.0
      tolerance: 0.03
    explanation: |
      Using $v = \lambda f$, $v = 0.75 \times 4.0 = 3.0$ m/s.
  - id: q002
    type: numericResponse
    skills: [physics-traveling-waves]
    prompt: |
      An ocean wave travels at 2.5 m/s and has a frequency of 0.50 Hz. What is its wavelength in meters?
    answer:
      value: 5.0
      tolerance: 0.05
    explanation: |
      Using $v = \lambda f$, $\lambda = v / f = 2.5 / 0.50 = 5.0$ m.
  - id: q003
    type: numericResponse
    skills: [physics-traveling-waves]
    prompt: |
      A sound wave travels at 343 m/s and has a wavelength of 0.686 m. What is its frequency in Hz?
    answer:
      value: 500.0
      tolerance: 5.0
    explanation: |
      Using $v = \lambda f$, $f = v / \lambda = 343 / 0.686 = 500$ Hz.
  - id: q004
    type: numericResponse
    skills: [physics-traveling-waves]
    prompt: |
      A transverse wave on a string has a wave speed of 12.0 m/s and a period of 0.20 s. Find its wavelength in meters.
    answer:
      value: 2.4
      tolerance: 0.024
    explanation: |
      Using $v = \lambda / T$, $\lambda = vT = 12.0 \times 0.20 = 2.4$ m.
  - id: q005
    type: numericResponse
    skills: [physics-traveling-waves]
    prompt: |
      A longitudinal wave has a wavelength of 0.15 m and travels at 330 m/s. What is its period in seconds?
    answer:
      value: 0.000454
      tolerance: 0.00001
    explanation: |
      Using $v = \lambda / T$, $T = \lambda / v = 0.15 / 330 \approx 0.000454$ s.
