id: s2c-dev-traveling-waves-mock-quiz
title: 'S2C Dev Mock Quiz: Traveling Waves'
description: Development-only trial for traveling waves, demonstrating the blueprint variation axes.
assessmentType: quiz
categoryId: s2c-dev
topicId: s2c-physics-trial
skills:
