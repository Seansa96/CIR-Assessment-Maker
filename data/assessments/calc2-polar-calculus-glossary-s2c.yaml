glossary:
  introduction: 'Use this map to choose a polar area or length model before integrating.'
  sections:
    - id: polar-calculus-terms
      title: Sector and path formulas
      required: true
      content: 'Polar calculus is driven by the radial sector model and the changing-radius path model.'
      entries:
        - { id: polar-area, term: Polar area, definition: 'Area swept by a polar radius over an angular interval.', notation: '$A=\frac12\int r^2d\theta$', examples: ['Use one loop or one stated region.'], aliases: [sector accumulation], media: [{ type: image, src: /media/calculus/polar-review-loop-sector.svg, alt: Shaded polar sector }], tags: [area], drills: [{ id: area-drill, type: cloze, prompt: 'Polar area uses one half times the integral of ____ squared.', answer: { expected: r, aliases: [radius] }, explanation: 'Solution: The missing quantity is r. Why it works: Sector area is proportional to radius squared. Common trap: Using r without squaring.' }] }
        - { id: annular-sector, term: Area between polar curves, definition: 'Area bounded by two radii over an interval.', notation: '$\frac12\int(r_o^2-r_i^2)d\theta$', examples: ['Verify outer/inner order with a sample angle.'], aliases: [annular sector], media: [{ type: image, src: /media/calculus/polar-review-loop-sector.svg, alt: Annular sector }], tags: [area-between], drills: [{ id: annular-drill, type: cloze, prompt: 'Between-curves area subtracts ____ squared minus ____ squared.', answer: { expected: 'outer; inner', aliases: ['outer,inner'] }, explanation: 'Solution: Subtract outer squared minus inner squared. Why it works: Sector areas, not radial lengths, are subtracted. Common trap: Squaring outer minus inner.' }] }
        - { id: polar-length, term: Polar arc length, definition: 'Length along a polar trace whose radius may vary.', notation: '$L=\int\sqrt{r^2+(dr/d\theta)^2}\,d\theta$', examples: ['Use a one-trace interval.'], aliases: [polar path length], media: [{ type: image, src: /media/calculus/polar-review-loop-sector.svg, alt: Curved polar path }], tags: [arc-length], drills: [{ id: length-drill, type: flashcard, prompt: 'What two squared terms appear in polar arc length?', answer: { expected: 'r squared and dr dtheta squared', aliases: ['r^2 and r prime squared'] }, explanation: 'Solution: They are r squared and radial-rate squared. Why it works: Both angular and radial motion contribute. Common trap: Using r alone.' }] }
