questions:
- id: q001
  type: multipleChoice
  prompt: Which Jacobian factor belongs to cylindrical coordinates?
  choices:
  - id: a
    text: r
  - id: b
    text: rho squared sin phi
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: c
    text: 1/r (answers 'Which factor must appear in a polar double integral?', not 'Which Jacobian factor belongs to cylindrical
      coordinates?')
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: d
    text: theta (answers 'Which factor must appear in a polar double integral?', not 'Which Jacobian factor belongs to cylindrical
      coordinates?')
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: polar-rectangular-conversion-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: A polar cross-section contributes the radius factor.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Polar Coordinates.

    Why the other choices fail: Choice b, ''rho squared sin phi'', does not give ''r'' for ''Which Jacobian factor belongs
    to cylindrical coordinates?''. It substitutes a different result, representation, or condition for the one the prompt
    specifies.

    Choice c, ''1/r'', does not give ''r'' for ''Which Jacobian factor belongs to cylindrical coordinates?''. It substitutes
    a different result, representation, or condition for the one the prompt specifies.

    Choice d, ''theta'', does not give ''r'' for ''Which Jacobian factor belongs to cylindrical coordinates?''. It substitutes
    a different result, representation, or condition for the one the prompt specifies.'
