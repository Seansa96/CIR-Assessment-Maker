- id: q003
  type: multipleChoice
  prompt: In cylindrical coordinates, what remains unchanged from rectangular coordinates?
  choices:
  - id: a
    text: z
  - id: b
    text: r (answers 'What is $x^2+y^2$ in polar coordinates?', not 'In cylindrical coordinates, what remains unchanged from
      rectangular coordinates?')
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: c
    text: theta (answers 'Which factor must appear in a polar double integral?', not 'In cylindrical coordinates, what remains
      unchanged from rectangular coordinates?')
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: d
    text: rho
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
