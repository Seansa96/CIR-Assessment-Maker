    text: Spherical
  - id: b
    text: Rectangular only
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: c
    text: Polar two-dimensional
    issueSignals:
    - id: polar-rectangular-conversion-error
  - id: d
    text: Parametric only
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: polar-rectangular-conversion-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: Constant rho describes a sphere.

    Why it works: This uses the defining relationship for the topic. Review path: Trigonometry → Polar Coordinates.

    Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
