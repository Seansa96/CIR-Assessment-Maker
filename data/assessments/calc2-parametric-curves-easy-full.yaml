questions:
- id: q-6ac84f
  type: numericResponse
  title: Evaluate x (1)
  prompt: If $x(t) = t^3 - 2t$ and $y(t) = 2t^2$, find the value of $x$ when $t =
    3$.
  answer:
    value: 21
    tolerance: 0.01
  explanation: $x(3) = 3^3 - 2(3) = 27 - 6$.
  skills:
  - parametric-curves
- id: q-4b68f3
  type: multipleChoice
  title: Plotting Parametric Curves (2)
  prompt: Given $x = 3t$ and $y = t^2$, what is the position at $t=2$?
  choices:
  - id: c1
    text: $(6, 4)$
  - id: c2
    text: $(3, 2)$
  - id: c3
    text: $(4, 6)$
  - id: c4
    text: $(6, 2)$
  answer:
    choiceId: c1
  explanation: Substitute $t=2$ into $x = 3(2) = 6$ and $y = 2^2 = 4$.
  skills:
  - parametric-curves
- id: q-d1bc36
  type: symbolicResponse
  title: Eliminate Parameter (3)
  prompt: Eliminate the parameter $t$ to find a Cartesian equation in terms of $x$
    for the curve $x = 5t$, $y = t^2$. Express $y$ in terms of $x$.
  answer:
    expectedLatex: (x/5)^2
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: Since $x=5t$, we have $t=x/5$. Substitute into $y=t^2$ to get $y=(x/5)^2$.
  skills:
  - parametric-curves
- id: q-991484
  type: symbolicResponse
  title: Eliminate Parameter (4)
  prompt: Eliminate the parameter $t$ to find a Cartesian equation in terms of $x$
