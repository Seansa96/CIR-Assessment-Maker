lesson:
  introduction: This lesson develops Beats from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      When two sound waves of slightly different frequencies are sounded simultaneously, they interfere constructively and destructively in alternating patterns over time. The physical phenomenon perceived is a regular pulsing variation in loudness known as beats.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s1-check
      type: multipleChoice
      prompt: What causes beats?
      choices: [{id: a, text: Two nearby frequencies superpose}, {id: b, text: One tone has zero amplitude}, {id: c, text: Sound travels in a vacuum}, {id: d, text: A single tone reflects}]
      answer: {choiceId: a}
      explanation: Nearby frequencies alternately interfere constructively and destructively.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The measurable quantities are the two source frequencies $f_1$ and $f_2$. The resulting beat frequency $f_{\text{beat}}$ is the rate at which the volume pulses from maximum to minimum and back to maximum.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s2-check
      type: multipleChoice
      prompt: What does beat frequency measure?
      choices: [{id: a, text: Loudness pulses per second}, {id: b, text: Wave speed}, {id: c, text: Average amplitude}, {id: d, text: Distance between sources}]
      answer: {choiceId: a}
      explanation: The beat frequency is the rate of repeating loudness changes.
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model uses the sum of two waves at a fixed point in space: $y(t) = A\cos(2\pi f_1 t) + A\cos(2\pi f_2 t)$. Applying the sum-to-product identity yields $y(t) = \left[2A\cos\left(2\pi \frac{f_1 - f_2}{2} t\right)\right] \cos\left(2\pi \frac{f_1 + f_2}{2} t\right)$.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s3-check
      type: multipleChoice
      prompt: Which operation models two overlapping sound waves?
      choices: [{id: a, text: Add their displacements}, {id: b, text: Multiply their frequencies}, {id: c, text: Divide amplitudes}, {id: d, text: Subtract their speeds}]
      answer: {choiceId: a}
      explanation: Linear superposition adds wave displacements.
  - id: s4
    title: Calculus connection
    content: >-
      The calculus derivation shows that the resulting wave has a fast oscillating carrier frequency equal to the average of the two sources: $f_{\text{avg}} = \frac{f_1 + f_2}{2}$. The amplitude of this wave is modulated by the slowly varying envelope term $\cos\left(2\pi \frac{f_1 - f_2}{2} t\right)$.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s4-check
      type: multipleChoice
      prompt: The fast carrier-like frequency is closest to which value?
      choices: [{id: a, text: '$(f_1+f_2)/2$'}, {id: b, text: '$|f_1-f_2|$'}, {id: c, text: '$f_1f_2$'}, {id: d, text: '$f_1/f_2$'}]
      answer: {choiceId: a}
      explanation: The sum-to-product form contains an average-frequency oscillation.
  - id: s5
    title: Derivation or justification
    content: >-
      Because the human ear perceives maximum loudness both when the envelope is at a maximum ($+1$) and a minimum ($-1$), the beat frequency is twice the modulation frequency. Thus, $f_{\text{beat}} = 2 \times \frac{|f_1 - f_2|}{2} = |f_1 - f_2|$.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s5-check
      type: multipleChoice
      prompt: Which expression gives the audible beat frequency?
      choices: [{id: a, text: '$|f_1-f_2|$'}, {id: b, text: '$f_1+f_2$'}, {id: c, text: '$f_1f_2$'}, {id: d, text: '$f_1/f_2$'}]
      answer: {choiceId: a}
      explanation: The audible loudness-pulse rate is the absolute source-frequency difference.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, the superposition of the two slightly offset waves looks like a high-frequency sine wave squished inside a slowly varying, low-frequency outer envelope. Each bulge of the envelope is one 'beat'.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s6-check
      type: multipleChoice
      prompt: What does one envelope bulge represent?
      choices: [{id: a, text: One beat}, {id: b, text: One wavelength in air}, {id: c, text: A source position}, {id: d, text: A change in sound speed}]
      answer: {choiceId: a}
      explanation: Envelope bulges track the repeating maxima of perceived loudness.
  - id: s7
    title: Quantitative strategy
    content: >-
      A common quantitative strategy in piano tuning is listening to the beat frequency between a tuning fork and a string. The beat frequency gives the absolute difference, but not the sign. Adjusting the string tension slightly reveals whether it was too high or too low based on whether the beat frequency increases or decreases.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s7-check
      type: multipleChoice
      prompt: Why can beats help tune a string to a fork?
      choices: [{id: a, text: The difference frequency is audible}, {id: b, text: Beats change gravity}, {id: c, text: Beats remove harmonics}, {id: d, text: Beats make both tones equal in amplitude}]
      answer: {choiceId: a}
      explanation: The beat rate reports how far apart the frequencies are.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: If $f_1 = f_2$, the beat frequency is zero (no beats, perfect unison). The human ear can typically only distinguish beats if the frequency difference is less than about 20 Hz.
    media:
    - type: image
      src: /media/physics/owa/beats.svg
      alt: Labeled original schematic for Beats used for quantitative analysis.
      caption: Beats model diagram.
    check:
      id: beats-s8-check
      type: multipleChoice
      prompt: If $f_1=f_2$, what is $f_{beat}$?
      choices: [{id: a, text: '$0\ \text{Hz}$'}, {id: b, text: '$f_1$'}, {id: c, text: '$2f_1$'}, {id: d, text: It is undefined}]
      answer: {choiceId: a}
      explanation: Equal source frequencies have zero difference and no changing envelope.
