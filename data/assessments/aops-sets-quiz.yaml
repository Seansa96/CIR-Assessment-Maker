- id: q005
  type: freeResponse
  prompt: |-
    A Sets problem has been changed so that the obvious first method no longer applies directly. Explain how you would decide whether **use inclusion-exclusion** is still legal, and name one condition you would check.
  answer:
    expected: |-
      Check whether the structure still contains subsets and whether the constraints needed for use inclusion-exclusion remain true.
    gradingMode: selfCheck
    keyPoints:
    - Mentions subsets.
    - Mentions use inclusion-exclusion.
    - Checks a condition or edge case.
  explanation: |-
    The purpose is to test method selection. Related topic: Sets; specific technique: use inclusion-exclusion.
  skills:
  - aops-sets
