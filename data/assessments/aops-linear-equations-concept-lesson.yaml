skills:
- Preserve equivalence while solving linear equations
- Classify equations and systems by solution count
- Select substitution or elimination from system structure
- Build and verify linear models with units and context restrictions
lesson:
  introduction: |-
    Solving a linear equation means replacing it with simpler equations that have exactly the same solutions. The central invariant is not that symbols “move”; it is that the same reversible operation is applied to both sides. That viewpoint explains ordinary solving, exceptional parameter cases, systems, and why a numerically correct answer can still fail a word problem.
  sections:
  - id: equality-and-equivalent-equations
    title: Preserve the solution set, not just the appearance of equality
    required: true
    content: |-
      An equation is a condition on possible values. Two equations are equivalent when they have the same solution set. Adding or subtracting the same expression on both sides preserves equivalence. Multiplying or dividing both sides by the same known nonzero number also preserves equivalence.

      For example,

      $$3x-7=14\iff3x=21\iff x=7.$$

      Each arrow represents a reversible operation. The phrase “move $-7$ to the other side” hides the real step: add 7 to both sides. Naming the operation makes sign choices and restrictions visible.
    check:
      id: equality-and-equivalent-equations-check
      type: multipleChoice
      prompt: 'Which operation transforms $5-2x=17$ into an equivalent equation?'
      choices:
      - id: a
        text: Subtract 5 from both sides to obtain $-2x=12$.
      - id: b
        text: Delete 5 from the left side only.
      - id: c
        text: Divide the left side by $-2$ but leave the right side unchanged.
      - id: d
        text: Replace $-2x$ by $2x$.
      answer:
        choiceId: a
      explanation: Applying the same subtraction to both sides preserves exactly the same solutions.
  - id: simplification-fractions-and-verification
    title: Simplify structure before isolating the variable
    required: true
    content: |-
      Distribute multiplication, combine like terms on each side, and clear numerical denominators before choosing the final isolation steps. When clearing denominators, multiply every term by a common denominator.

      Example:

      $$\frac{x}{2}+\frac{x-1}{3}=4.$$

      Multiplying the entire equation by 6 gives $3x+2(x-1)=24$, not merely $3x+(x-1)=24$. Then $5x-2=24$, so $x=26/5$.

      Substitute into the original equation rather than only the last simplified line. The original form checks arithmetic and confirms that denominator or context restrictions were respected.
    check:
      id: simplification-fractions-and-verification-check
      type: multipleChoice
      prompt: 'After multiplying $\dfrac{x}{4}-\dfrac{x+1}{6}=2$ by 12, which equation is correct?'
      choices:
      - id: a
        text: '$3x-2(x+1)=24$'
      - id: b
        text: '$3x-(x+1)=2$'
      - id: c
        text: '$12x-12(x+1)=24$'
      - id: d
        text: '$x-(x+1)=24$'
      answer:
        choiceId: a
      explanation: The factors are $12/4=3$ and $12/6=2$, and the right side also receives the factor 12.
  - id: unique-none-or-infinitely-many
    title: Cancellation classifies the equation
    required: true
    content: |-
      A linear equation may have one solution, no solution, or infinitely many solutions.

      - If simplification produces $ax=b$ with $a\ne0$, there is one solution $x=b/a$.
      - If the variable cancels and a false statement remains, such as $0=5$, no value works.
      - If the variable cancels and a true identity remains, such as $0=0$, every value in the original domain works.

      Do not divide by a coefficient until checking whether it might be zero. In the parameter equation $(k-2)x=6$, the formula $x=6/(k-2)$ is valid only for $k\ne2$. At $k=2$, the equation becomes $0=6$, so there is no solution.
    check:
      id: unique-none-or-infinitely-many-check
      type: multipleChoice
      prompt: 'How should $3(x-2)=2(x+5)+x$ be classified?'
      choices:
      - id: a
        text: One solution, $x=16$
      - id: b
        text: No solution, because simplification gives $-6=10$
      - id: c
        text: Infinitely many solutions, because the $x$ terms cancel
      - id: d
        text: One solution, $x=0$
      answer:
        choiceId: b
      explanation: Cancellation alone does not imply infinitely many solutions; the remaining constants must form a true statement.
  - id: systems-and-simultaneous-solutions
    title: A system asks for a shared solution
    required: true
    content: |-
      A solution of two equations in $x,y$ is an ordered pair satisfying both equations at once. Graphically, it is an intersection point.

      Use substitution when a variable is already isolated or has an easy coefficient. Use elimination when adding suitable multiples makes one variable cancel. For

      $$x+y=9,\qquad x-y=1,$$

      addition immediately gives $2x=10$, so $x=5$ and then $y=4$.

      Systems also have three classifications. Independent nonparallel equations have one solution; distinct parallel equations have none; equivalent equations describe the same line and have infinitely many.
    check:
      id: systems-and-simultaneous-solutions-check
      type: multipleChoice
      prompt: 'What is the most efficient first move for $4x+3y=8$ and $2x-3y=10$?'
      choices:
      - id: a
        text: Add the equations to eliminate $y$.
      - id: b
        text: Multiply both equations by zero.
      - id: c
        text: Add the left sides but subtract the right sides.
      - id: d
        text: Divide by $y$ before checking whether $y=0$.
      answer:
        choiceId: a
      explanation: The coefficients $3$ and $-3$ already cancel under addition.
  - id: modeling-relationships-and-units
    title: Model the relationship before solving
    required: true
    content: |-
      A word problem is not solved by guessing which numbers to combine. Define variables with units, translate a relationship, solve, and then interpret the requested quantity.

      For motion, distance equals rate times time because $(\text{distance}/\text{time})(\text{time})=\text{distance}$. If a 120-mile trip takes two hours, partly at 50 mph and partly at 70 mph, let $t$ be the hours at 50 mph. Then the remaining time is $2-t$, and

      $$50t+70(2-t)=120.$$

      Units expose incorrect expressions: adding a speed directly to a time is meaningless. Context also restricts solutions; times and counts usually cannot be negative.
    check:
      id: modeling-relationships-and-units-check
      type: multipleChoice
      prompt: 'A taxi charges a fixed $4 fee plus $2.50 per mile. Which equation models a $19 fare for $m$ miles?'
      choices:
      - id: a
        text: '$4+2.5m=19$'
      - id: b
        text: '$4m+2.5=19$'
      - id: c
        text: '$6.5m=19$'
      - id: d
        text: '$2.5(m+19)=4$'
      answer:
        choiceId: a
      explanation: The fixed fee is added once, while the mileage charge scales with miles.
  - id: nonreversible-operations-and-lost-cases
    title: Some algebraic moves destroy information
    required: true
    content: |-
      Dividing by an expression containing a variable is only reversible when that expression is nonzero. If an equation contains $x(x-3)=0$ and both sides are divided by $x$, the valid case $x=0$ disappears. Check the zero case before division.

      Multiplying an equation by zero is worse: every equation becomes $0=0$, so all information is lost. Squaring can add solutions because opposite quantities have the same square. These moves may be useful only when their lost or added cases are tracked explicitly.

      Verification in the original equation is the final defense, but good solving also records the condition at the exact step where reversibility can fail.
    check:
      id: nonreversible-operations-and-lost-cases-check
      type: multipleChoice
      prompt: 'Before dividing $x(x-5)=2x$ by $x$, what must be done?'
      choices:
      - id: a
        text: Check $x=0$ separately, because division by $x$ would exclude it.
      - id: b
        text: Assume $x>0$ without justification.
      - id: c
        text: Multiply the equation by zero.
      - id: d
        text: Replace $x$ by 1.
      answer:
        choiceId: a
      explanation: Division by a variable expression can discard its zero case.
  - id: parameter-synthesis
    title: Synthesis—classify a parameter family before dividing
    required: true
    content: |-
      Consider

      $$(k-2)x=k-2.$$

      If $k\ne2$, the common coefficient is nonzero and division gives $x=1$. If $k=2$, both sides become zero, so the equation is $0=0$ and every real $x$ is a solution.

      The tempting one-line cancellation of $k-2$ is incomplete because cancellation is division, and division requires a nonzero divisor. Parameter problems test whether a familiar procedure is legal in every case.

      A reliable routine is: identify the would-be divisor, split into zero and nonzero cases, solve each simplified equation, and state its solution set explicitly.
    check:
      id: parameter-synthesis-check
      type: multipleChoice
      prompt: 'Classify $(m+3)x=2(m+3)$ for real $m$.'
      choices:
      - id: a
        text: '$x=2$ for $m\ne-3$; every real $x$ for $m=-3$'
      - id: b
        text: '$x=2$ for every real $m$'
      - id: c
        text: No solution when $m=-3$
      - id: d
        text: Every real $x$ for every real $m$
      answer:
        choiceId: a
      explanation: At $m=-3$ the equation becomes $0=0$; otherwise division by $m+3$ is legal.
