schemaVersion: 1
id: python-oop-recall
title: Python OOP Recall
assessmentType: recallDrill
categoryId: python
subcategoryIds:
- python-oop
modeDefault: practice
randomizeQuestions: true
items:
- id: r001
  type: typed
  prompt: What keyword defines a new class?
  answer:
    expected: class
- id: r002
  type: typed
  prompt: What is the special name of the constructor method in Python?
  answer:
    expected: __init__
    aliases:
    - __init__()
- id: r003
  type: typed
  prompt: What keyword refers to the current instance of the class and must be the
    first parameter of any instance method?
  answer:
    expected: self
- id: r004
  type: typed
  prompt: What built-in function is used inside a subclass to call a method (like
    `__init__`) from its parent class?
  answer:
    expected: super
    aliases:
    - super()
- id: r005
  type: typed
  prompt: What is the term for when a subclass provides its own specific implementation
    of a method that is already defined in its parent class?
  answer:
    expected: override
    aliases:
    - overriding
    - overrides
- id: r006
  type: flashcard
  prompt: In the definition `class Enemy(Character):`, what is the parent class?
  answer:
    expected: Character
- id: r007
  type: flashcard
  prompt: What does the `@property` decorator do?
  answer:
    expected: It allows you to access a method as if it were a regular attribute (without
      parentheses).
