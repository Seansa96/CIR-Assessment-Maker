glossary:
  sections:
    - title: "Heap Structures"
      entries:
        - term: "Min-Heap"
          definition: "A complete binary tree where every parent node has a value less than or equal to its children."
        - term: "Max-Heap"
          definition: "A complete binary tree where every parent node has a value greater than or equal to its children."
        - term: "Complete Binary Tree"
          definition: "A binary tree in which every level, except possibly the last, is completely filled, and all nodes are as far left as possible."
        - term: "Priority Queue"
          definition: "An abstract data type where each element has a priority, and elements with higher priority are served before elements with lower priority."
