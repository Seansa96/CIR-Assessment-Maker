schemaVersion: 1
id: aops-quadrilaterals-test
title: Quadrilaterals Test
description: A fifteen-question assessment of multi-step measurement, classification evidence, counterexamples, and proof.
assessmentType: test
categoryId: art-of-problem-solving
topicId: aops-quadrilaterals
modeDefault: test
randomizeQuestions: true
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags: [art-of-problem-solving, aops-quadrilaterals, geometry, quadrilateral-proof, classification]
skills:
- Solve multi-step parallelogram, rhombus, and trapezoid measurements
- Classify special quadrilaterals from sufficient evidence
- Use counterexamples to reject invalid converses
- Prove a parallelogram diagonal property from parallel-side geometry
questions:
- id: q001
  type: multipleChoice
  prompt: The angles of a convex quadrilateral are $x^\circ$, $(x+20)^\circ$, $2x^\circ$, and $(2x+40)^\circ$. What is its largest angle?
  choices:
  - {id: a, text: '$100^\circ$'}
  - {id: b, text: '$120^\circ$'}
  - {id: c, text: '$140^\circ$'}
  - {id: d, text: '$160^\circ$'}
  answer: {choiceId: c}
  explanation: The sum gives $6x+60=360$, so $x=50$ and the largest angle is $2x+40=140$ degrees.
- id: q002
  type: multipleChoice
  prompt: In parallelogram $ABCD$, diagonals meet at $O$, $AO=2x+7$, and $OC=4x-5$. Find $AC$.
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-parallelogram.svg
    alt: Parallelogram ABCD with diagonals bisecting at O.
    caption: Translate diagonal bisection into an equation before reconstructing the whole diagonal.
  choices:
  - {id: a, text: '$19$'}
  - {id: b, text: '$24$'}
  - {id: c, text: '$38$'}
  - {id: d, text: '$76$'}
  answer: {choiceId: c}
  explanation: $2x+7=4x-5$ gives $x=6$. Each half is 19, so $AC=38$.
- id: q003
  type: multipleChoice
  prompt: Consecutive angles of a parallelogram are in the ratio $2:3$. What are their measures?
  choices:
  - {id: a, text: '$60^\circ$ and $90^\circ$'}
  - {id: b, text: '$72^\circ$ and $108^\circ$'}
  - {id: c, text: '$80^\circ$ and $120^\circ$'}
  - {id: d, text: '$90^\circ$ and $135^\circ$'}
  answer: {choiceId: b}
  explanation: Consecutive angles sum to 180; $2k+3k=180$ gives $k=36$.
- id: q004
  type: multipleChoice
  prompt: In a quadrilateral, one pair of opposite sides is both parallel and congruent. What follows?
  choices:
  - {id: a, text: The quadrilateral must be a parallelogram.}
  - {id: b, text: The quadrilateral must be a rectangle.}
  - {id: c, text: The quadrilateral must be a rhombus.}
  - {id: d, text: No classification follows.}
  answer: {choiceId: a}
  explanation: One opposite pair both parallel and congruent is a sufficient parallelogram test.
- id: q005
  type: multipleChoice
  prompt: An isosceles trapezoid has bases 14 and 26 and legs 10. What are its height and area?
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-trapezoid.svg
    alt: Isosceles trapezoid decomposed by altitudes into a central rectangle and two congruent right triangles.
    caption: Split the base difference equally between the two congruent corner triangles.
  choices:
  - {id: a, text: Height 6 and area 120}
  - {id: b, text: Height 8 and area 160}
  - {id: c, text: Height 10 and area 200}
  - {id: d, text: Height 12 and area 240}
  answer: {choiceId: b}
  explanation: Each offset is $(26-14)/2=6$, so height is 8 by the 6-8-10 triangle. Area is $\tfrac12(14+26)(8)=160$.
- id: q006
  type: multipleChoice
  prompt: For the isosceles trapezoid in Question 5, what is a diagonal length?
  choices:
  - {id: a, text: '$4\sqrt{13}$'}
  - {id: b, text: '$4\sqrt{17}$'}
  - {id: c, text: '$4\sqrt{29}$'}
  - {id: d, text: '$8\sqrt{29}$'}
  answer: {choiceId: c}
  explanation: The diagonal's horizontal run is $6+14=20$ and its rise is 8, so $d=\sqrt{20^2+8^2}=\sqrt{464}=4\sqrt{29}$.
- id: q007
  type: multipleChoice
  prompt: A rhombus has diagonals 16 and 30. What are its perimeter and area?
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-special-types.svg
    alt: Rhombus whose perpendicular diagonals bisect one another.
    caption: Half-diagonals form an 8-15-17 right triangle.
  choices:
  - {id: a, text: Perimeter 34 and area 240}
  - {id: b, text: Perimeter 68 and area 120}
  - {id: c, text: Perimeter 68 and area 240}
  - {id: d, text: Perimeter 92 and area 480}
  answer: {choiceId: c}
  explanation: Half-diagonals 8 and 15 give side 17, so perimeter is 68; area is $\tfrac12(16)(30)=240$.
- id: q008
  type: multipleChoice
  prompt: A parallelogram has congruent diagonals. Which classification is forced?
  choices:
  - {id: a, text: Rectangle}
  - {id: b, text: Rhombus}
  - {id: c, text: Kite but not parallelogram}
  - {id: d, text: Square}
  answer: {choiceId: a}
  explanation: Congruent diagonals specialize a parallelogram to a rectangle; equal sides are not established, so square is too strong.
- id: q009
  type: multipleChoice
  prompt: A parallelogram has perpendicular diagonals. Which classification is forced?
  choices:
  - {id: a, text: Rectangle}
  - {id: b, text: Rhombus}
  - {id: c, text: Isosceles trapezoid only}
  - {id: d, text: Square}
  answer: {choiceId: b}
  explanation: Perpendicular diagonals specialize a parallelogram to a rhombus; congruent diagonals or right angles have not been established.
- id: q010
  type: multipleChoice
  prompt: A parallelogram has diagonals that are both congruent and perpendicular. What is the most specific forced classification?
  choices:
  - {id: a, text: Kite}
  - {id: b, text: Rectangle}
  - {id: c, text: Rhombus}
  - {id: d, text: Square}
  answer: {choiceId: d}
  explanation: The first extra property gives rectangle status and the second gives rhombus status, so both together force a square.
- id: q011
  type: multipleChoice
  prompt: Which counterexample correctly disproves the claim that congruent diagonals force a quadrilateral to be a rectangle?
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-counterexamples.svg
    alt: Isosceles trapezoid with congruent diagonals but without four right angles.
    caption: The right-hand figure satisfies the proposed hypothesis without satisfying its conclusion.
  choices:
  - {id: a, text: A non-rectangle isosceles trapezoid}
  - {id: b, text: A square}
  - {id: c, text: A rectangle}
  - {id: d, text: An equilateral triangle}
  answer: {choiceId: a}
  explanation: Isosceles trapezoids have congruent diagonals but need not have right angles.
- id: q012
  type: multipleChoice
  prompt: The vertices $A(0,0)$, $B(6,0)$, $C(8,4)$, and $D(2,4)$ form a parallelogram. What is its area?
  choices:
  - {id: a, text: '$16$'}
  - {id: b, text: '$20$'}
  - {id: c, text: '$24$'}
  - {id: d, text: '$32$'}
  answer: {choiceId: c}
  explanation: Base $AB$ has length 6 and the perpendicular distance between the horizontal base lines is 4, so area is $6\cdot4=24$.
- id: q013
  type: selectAll
  prompt: Which conditions are each sufficient on their own to prove that a quadrilateral is a parallelogram? Select all that apply.
  choices:
  - {id: a, text: Both pairs of opposite angles are congruent.}
  - {id: b, text: Both pairs of opposite sides are congruent.}
  - {id: c, text: The diagonals bisect each other.}
  - {id: d, text: The diagonals are perpendicular.}
  answer: {choiceIds: [a, b, c]}
  explanation: Perpendicular diagonals alone also occur in kites and other orthodiagonal quadrilaterals.
- id: q014
  type: selectAll
  prompt: Which properties hold for every isosceles trapezoid? Select all that apply.
  choices:
  - {id: a, text: The legs are congruent.}
  - {id: b, text: Each pair of base angles is congruent.}
  - {id: c, text: The diagonals are congruent.}
  - {id: d, text: The diagonals are perpendicular.}
  answer: {choiceIds: [a, b, c]}
  explanation: Congruent legs define the family and imply congruent base-angle pairs and diagonals, but not perpendicular diagonals.
- id: q015
  type: freeResponse
  prompt: |
    Prove that the diagonals of parallelogram $ABCD$ bisect each other. Let diagonals $AC$ and $BD$ meet at $O$. Your proof must name the triangles used, justify their congruence, and state both resulting segment equalities.
  media:
  - type: image
    src: /assessments/aops/aops-quadrilaterals-parallelogram.svg
    alt: Parallelogram ABCD with diagonals AC and BD crossing at O.
    caption: Use one pair of opposite parallel sides, vertical angles at O, and an opposite-side equality.
  answer:
    gradingMode: selfCheck
    expected: 'Because $AB\parallel CD$, alternate interior angles give $\angle ABO=\angle CDO$. Vertical angles give $\angle AOB=\angle COD$. Opposite sides of a parallelogram are congruent, so $AB=CD$. Thus $\triangle AOB\cong\triangle COD$ by AAS. Corresponding parts then give $AO=OC$ and $BO=OD$. Therefore $O$ bisects both diagonals.'
    keyPoints:
    - Selects triangles $AOB$ and $COD$.
    - Uses alternate interior angles from parallel sides.
    - Uses vertical angles and $AB=CD$.
    - Concludes triangle congruence by AAS.
    - Deduces both $AO=OC$ and $BO=OD$.
  explanation: The conclusion follows from corresponding parts of congruent triangles, not from the intersection merely looking centered.
