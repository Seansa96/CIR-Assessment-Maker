questions:
- id: q001
  type: multipleChoice
  prompt: In a kite, the non-vertex angles (the angles between unequal sides) are always equal. If the
    vertex angles of a kite measure $40^\circ$ and $100^\circ$, what is the measure of each of the non-vertex
    angles?
  difficultyDimensions:
  - Recognize the sum of the angles is $360^\circ$.
  - 'Subtract the known angles: $360 - (40 + 100) = 220^\circ$.'
  - 'Divide by 2 because the remaining two angles are equal: $220 / 2 = 110^\circ$.'
  choices:
  - id: a
    text: $110^\circ$
  - id: b
    text: $220^\circ$
    issueSignals:
    - id: division-omission
      domains: []
  - id: c
    text: $140^\circ$
    issueSignals:
    - id: sum-calculation-error
      domains: []
  - id: d
    text: $70^\circ$
    issueSignals:
    - id: triangle-sum-confusion
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    A kite is a quadrilateral, so the sum of its four interior angles is $360^\circ$.

    Let $x$ be the measure of each of the two equal non-vertex angles.

    $x + x + 40^\circ + 100^\circ = 360^\circ$

    $2x + 140^\circ = 360^\circ$

    $2x = 220^\circ$

    $x = 110^\circ$.


    Why it works:

    A kite is symmetrical across its main diagonal (the line connecting the two vertex angles). This symmetry
    guarantees that the two non-vertex angles (where the short side meets the long side) are perfect mirror
    images and thus exactly equal.


    Why the other choices fail:

    - $220^\circ$ is the sum of the two angles, failing to divide by 2.

    - $140^\circ$ is the sum of the two vertex angles ($100 + 40$).

    - $70^\circ$ assumes the total sum is only $180^\circ$ or $280^\circ$.

    '
- id: q002
  type: multipleChoice
  prompt: The diagonals of a rhombus measure $10\text{ cm}$ and $24\text{ cm}$. What is the perimeter
    of the rhombus?
  difficultyDimensions:
  - Recall that diagonals of a rhombus bisect each other at right angles (forming 4 right triangles).
  - 'Find the legs of the right triangle: $10/2 = 5$ and $24/2 = 12$.'
  - 'Use Pythagorean theorem to find the side length (hypotenuse): $5^2 + 12^2 = c^2 \implies c = 13$.'
  - 'Multiply by 4 for the perimeter: $13 \times 4 = 52$.'
  choices:
  - id: a
    text: $13\text{ cm}$
    issueSignals:
    - id: perimeter-side-confusion
      domains: []
  - id: b
    text: $52\text{ cm}$
  - id: c
    text: $68\text{ cm}$
    issueSignals:
    - id: full-diagonal-pythagorean-error
      domains: []
  - id: d
    text: $104\text{ cm}$
    issueSignals:
    - id: full-diagonal-perimeter-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The diagonals of a rhombus are perpendicular bisectors of each other. This means they cross at $90^\circ$
    and cut each other exactly in half.

    This splits the rhombus into four identical right triangles. The legs of each right triangle are half
    the lengths of the diagonals:

    $10 / 2 = 5\text{ cm}$

    $24 / 2 = 12\text{ cm}$.

    The hypotenuse of this right triangle is the side of the rhombus ($s$).

    $5^2 + 12^2 = s^2 \implies 25 + 144 = 169 \implies s = 13\text{ cm}$.

    Since a rhombus has 4 equal sides, the perimeter is:

    $P = 4 \times 13 = 52\text{ cm}$.


    Why it works:

    This is one of the most frequently tested geometry patterns. The perpendicular bisecting diagonals
    always create right triangles that allow you to easily find the side length using the Pythagorean
    theorem.


    Why the other choices fail:

    - $13\text{ cm}$ is the length of just one side.

    - $68\text{ cm}$ comes from using the full diagonals in the Pythagorean theorem: $\sqrt{10^2 + 24^2}
    = 26$, then $26 \times 4 = 104$, or similar math errors.

    - $104\text{ cm}$ is $4 \times 26$, resulting from the full diagonal error above.

    '
- id: q003
  type: multipleChoice
  prompt: In isosceles trapezoid $WXYZ$, bases $WX$ and $YZ$ are parallel. The length of diagonal $WY$
    is $5x - 8$ and the length of diagonal $XZ$ is $2x + 13$. What is the value of $x$?
  difficultyDimensions:
  - Recall that the diagonals of an isosceles trapezoid are equal in length.
  - 'Set up equation: $5x - 8 = 2x + 13$.'
  - 'Solve for $x$: $3x = 21 \implies x = 7$.'
  choices:
  - id: a
    text: $7$
  - id: b
    text: $3$
    issueSignals:
    - id: arithmetic-error
      domains: []
  - id: c
    text: $27$
    issueSignals:
    - id: substitution-error
      domains: []
  - id: d
    text: $14$
    issueSignals:
    - id: algebra-sign-error
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    One of the defining properties of an isosceles trapezoid is that its diagonals are equal in length.

    Therefore, $WY = XZ$.

    $5x - 8 = 2x + 13$

    Subtract $2x$ from both sides: $3x - 8 = 13$

    Add 8 to both sides: $3x = 21$

    Divide by 3: $x = 7$.


    Why it works:

    Just like a rectangle (which is a special isosceles trapezoid where the legs are perfectly vertical),
    the symmetry of an isosceles trapezoid guarantees that the distance from one corner to the opposite
    corner is the same for both pairs.


    Why the other choices fail:

    - $3$ might be a math error (e.g., $5x - 2x = 3x$, and $13 - 8 = 5$).

    - $27$ is the length of the diagonal itself ($5(7) - 8 = 27$), not the value of $x$.

    - $14$ might come from an algebraic sign error, like $7x = 5$.

    '
- id: q004
  type: multipleChoice
  prompt: A trapezoid has bases of length 12 and 20. What is the length of its midsegment (the line segment
    connecting the midpoints of the non-parallel legs)?
  difficultyDimensions:
  - 'Recall the midsegment formula: $M = (b_1 + b_2) / 2$.'
  - 'Calculate: $(12 + 20) / 2 = 32 / 2 = 16$.'
  choices:
  - id: a
    text: $8$
    issueSignals:
    - id: subtraction-instead-of-addition
      domains: []
  - id: b
    text: $32$
    issueSignals:
    - id: division-omission
      domains: []
  - id: c
    text: $16$
  - id: d
    text: $15$
    issueSignals:
    - id: guessing
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    The length of the midsegment of a trapezoid is the average of the lengths of the two bases.

    $\text{Midsegment} = \frac{\text{Base}_1 + \text{Base}_2}{2}$

    $\text{Midsegment} = \frac{12 + 20}{2}$

    $\text{Midsegment} = \frac{32}{2} = 16$.


    Why it works:

    The midsegment is exactly halfway between the top base and the bottom base. Because the legs of a
    trapezoid are straight lines, the width of the trapezoid expands linearly from top to bottom. Therefore,
    the width exactly in the middle must be the exact mathematical average.


    Why the other choices fail:

    - $8$ is the difference between the bases ($20 - 12$), or half the difference ($16/2 = 8$).

    - $32$ is the sum of the bases, failing to divide by 2.

    - $15$ might be a guess assuming the answer is exactly halfway between 10 and 20.

    '
- id: q005
  type: multipleChoice
  prompt: In rhombus $ABCD$, the diagonals intersect at $E$. If $m\angle ABE = 34^\circ$, what is $m\angle
    BAE$?
  difficultyDimensions:
  - Recall that diagonals of a rhombus intersect at $90^\circ$ ($m\angle AEB = 90^\circ$).
  - Recognize that $\triangle ABE$ is a right triangle.
  - Calculate $m\angle BAE = 90 - 34 = 56^\circ$.
  choices:
  - id: a
    text: $56^\circ$
  - id: b
    text: $34^\circ$
    issueSignals:
    - id: isosceles-assumption-error
      domains: []
  - id: c
    text: $68^\circ$
    issueSignals:
    - id: bisector-confusion
      domains: []
  - id: d
    text: $90^\circ$
    issueSignals:
    - id: intersection-angle-confusion
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    The diagonals of a rhombus intersect at a $90^\circ$ angle, making $\angle AEB = 90^\circ$.

    Therefore, $\triangle ABE$ is a right triangle.

    The two acute angles in a right triangle must be complementary (sum to $90^\circ$).

    $m\angle ABE + m\angle BAE = 90^\circ$

    $34^\circ + m\angle BAE = 90^\circ$

    $m\angle BAE = 90^\circ - 34^\circ = 56^\circ$.


    Why it works:

    Every rhombus is broken cleanly into four identical right triangles by its diagonals. The acute angles
    of these triangles correspond to half of the vertex angles of the rhombus (since the diagonals also
    bisect the vertex angles).


    Why the other choices fail:

    - $34^\circ$ assumes $\triangle ABE$ is an isosceles right triangle, which is only true if the rhombus
    is a square.

    - $68^\circ$ is the full measure of the vertex angle $B$ ($34 \times 2$), not the angle asked for.

    - $90^\circ$ is the measure of the intersection angle $\angle AEB$.

    '
- id: q006
  type: multipleChoice
  prompt: Which of the following conditions is NOT sufficient to prove that a quadrilateral is a parallelogram?
  difficultyDimensions:
  - 'Analyze condition A: Opposite sides are parallel (Definition, Sufficient).'
  - 'Analyze condition B: Diagonals bisect each other (Sufficient).'
  - 'Analyze condition C: One pair of opposite sides is BOTH parallel and equal (Sufficient).'
  - 'Analyze condition D: One pair of opposite sides is parallel, and the OTHER pair is equal in length
    (Insufficient - could be an isosceles trapezoid).'
  choices:
  - id: a
    text: One pair of opposite sides is both parallel and equal in length.
    issueSignals:
    - id: sufficient-confusion
      domains: []
  - id: b
    text: One pair of opposite sides is parallel, and the other pair of opposite sides is equal in length.
  - id: c
    text: Both pairs of opposite angles are equal.
    issueSignals:
    - id: sufficient-confusion
      domains: []
  - id: d
    text: The diagonals bisect each other.
    issueSignals:
    - id: sufficient-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    Let''s review the conditions:

    - One pair parallel AND equal: Sufficient. (This locks the other two sides into being parallel and
    equal as well).

    - Both pairs of opposite angles equal: Sufficient.

    - Diagonals bisect each other: Sufficient.

    - One pair parallel, OTHER pair equal: **Not Sufficient**. This describes a quadrilateral like an
    isosceles trapezoid, which is definitively NOT a parallelogram.


    Why it works:

    This is a classic trap in geometry proofs. If the top and bottom are parallel, and the left and right
    are equal, the left and right could be leaning inwards towards each other identically, forming an
    isosceles trapezoid instead of a parallelogram.


    Why the other choices fail:

    - The other choices are all standard theorems that prove a quadrilateral is a parallelogram. The question
    asks for the one that is NOT sufficient.

    '
