questions:
- id: newton-hard-1
  title: Calculus Force
  type: symbolicResponse
  prompt: 'Adapted from OpenStax University Physics.


    The position of a $1$ kg mass is given by $x(t) = 1t^3$. What is the net force
    $F(t)$ as a function of time?'
  answer:
    gradingMode: auto
    expectedLatex: 6*t
    equivalenceMode: expression
    tolerance: 0
  explanation: $v(t) = 3t^2$, $a(t) = 6t$. $F(t) = ma(t) = 1(6t) = 6t$.
