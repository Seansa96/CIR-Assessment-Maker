questions:
  - id: nl-hard-q01
    title: Calculus-based Force from Position
    type: symbolicResponse
    prompt: |
      The position of a mass $m$ is given by $x(t) = c t^3 - b t$, where $c$ and $b$ are constants. What is the net force $F(t)$ acting on the mass as a function of time? Enter your expression in terms of $m, c, b,$ and $t$.
    answer:
      expectedLatex: 6*m*c*t
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Velocity $v(t) = \frac{dx}{dt} = 3ct^2 - b$.
      Acceleration $a(t) = \frac{dv}{dt} = 6ct$.
      Newton's Second Law: $F(t) = ma(t) = m(6ct) = 6mct$.

  - id: nl-hard-q02
    title: Two Connected Blocks on a Horizontal Surface
    type: symbolicResponse
    prompt: |
      Block 1 (mass $m_1$) and Block 2 (mass $m_2$) are touching on a frictionless horizontal surface. A horizontal force $F$ is applied to Block 1, pushing it against Block 2, so they accelerate together. Enter the expression for the contact force $P$ that Block 1 exerts on Block 2.
    answer:
      expectedLatex: F*m_2/(m_1 + m_2)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      System acceleration: $a = \frac{F}{m_1 + m_2}$.
      Consider Block 2: the only horizontal force acting on it is the contact force $P$.
      $P = m_2 a = m_2 \left(\frac{F}{m_1 + m_2}\right) = \frac{F m_2}{m_1 + m_2}$.

  - id: nl-hard-q03
    title: Atwood Machine with a Massive Rope
    type: numericResponse
    prompt: |
      An Atwood machine consists of two masses $m_1 = 3.0\text{ kg}$ and $m_2 = 5.0\text{ kg}$ hung over a frictionless, massless pulley. However, the rope connecting them has a total mass of $1.0\text{ kg}$. At the instant the rope is evenly distributed on both sides (half its mass on each side), what is the acceleration of the system in m/s²? Use $g = 9.8\text{ m/s}^2$. Round to two decimal places.
    answer:
      value: 2.18
      tolerance: 0.05
    explanation: |
      The total moving mass is $M_\text{total} = m_1 + m_2 + m_\text{rope} = 3.0 + 5.0 + 1.0 = 9.0\text{ kg}$.
      The driving force is the difference in weight on each side.
      Right side mass = $m_2 + 0.5 = 5.5\text{ kg}$. Left side mass = $m_1 + 0.5 = 3.5\text{ kg}$.
      Net force = $(5.5 - 3.5)g = 2.0g$.
      $a = \frac{F_\text{net}}{M_\text{total}} = \frac{2.0(9.8)}{9.0} = \frac{19.6}{9.0} \approx 2.177\text{ m/s}^2$.

  - id: nl-hard-q04
    title: Painter on a Scaffold (Pulley System)
    type: numericResponse
    prompt: |
      A $70\text{ kg}$ painter stands on a $20\text{ kg}$ platform. The platform is suspended by a rope that goes up over a pulley and back down to the painter, who pulls on it to lift himself and the platform at a constant velocity. What is the tension in the rope in Newtons? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 441.0
      tolerance: 1.0
    explanation: |
      Consider the painter + platform as a single system. Total mass = $70 + 20 = 90\text{ kg}$.
      Total weight = $90 \times 9.8 = 882\text{ N}$.
      Two segments of the rope are pulling UP on this system: the one attached to the platform, and the one the painter holds.
      So, $2T = W \implies 2T = 882 \implies T = 441\text{ N}$.

  - id: nl-hard-q05
    title: Force from Velocity squared
    type: numericResponse
    prompt: |
      A $0.50\text{ kg}$ particle experiences a net force $F(v) = -k v^2$, where $k = 0.20\text{ kg/m}$. If the particle's initial velocity is $10\text{ m/s}$, how long (in seconds) does it take for its velocity to drop to $5.0\text{ m/s}$?
      *(Hint: $a = \frac{dv}{dt}$ and integrate).*
    answer:
      value: 0.25
      tolerance: 0.02
    explanation: |
      $F = ma \implies -kv^2 = m\frac{dv}{dt}$.
      $\frac{dv}{v^2} = -\frac{k}{m}dt$.
      Integrate from $t=0$ ($v=10$) to $t$ ($v=5$):
      $\left[-\frac{1}{v}\right]_{10}^5 = -\frac{k}{m}t \implies -\frac{1}{5} - \left(-\frac{1}{10}\right) = -\frac{0.20}{0.50}t$.
      $-\frac{2}{10} + \frac{1}{10} = -0.4t \implies -\frac{1}{10} = -0.4t$.
      $0.4t = 0.1 \implies t = \frac{0.1}{0.4} = 0.25\text{ s}$.

  - id: nl-hard-q06
    title: Apparent Weight on an Incline
    type: numericResponse
    prompt: |
      A box rests on a scale that is placed on a frictionless incline angled at $30°$ to the horizontal. If the box has a mass of $10\text{ kg}$ and the entire setup (box + scale) is sliding down the incline, what does the scale read in Newtons? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 84.9
      tolerance: 1.0
    explanation: |
      The scale reads the normal force perpendicular to its surface.
      Since both scale and box are in freefall along the incline, there is no acceleration perpendicular to the incline.
      The only forces perpendicular to the incline are the normal force $N$ and gravity component $mg\cos 30°$.
      $N - mg\cos 30° = 0 \implies N = 10(9.8)\cos 30° = 98(0.866) \approx 84.87\text{ N}$.
      Note: Along the incline, the scale doesn't measure anything because both accelerate at $g\sin 30°$ together.

  - id: nl-hard-q07
    title: Chain Sliding off a Table
    type: symbolicResponse
    prompt: |
      A uniform chain of mass $M$ and length $L$ is held on a frictionless table with a length $x$ hanging over the edge. It is released from rest. Enter the expression for its acceleration $a$ as a function of $x$. Use $g$ for gravity.
    answer:
      expectedLatex: g*x/L
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The mass of the hanging part is $m_\text{hang} = M\frac{x}{L}$.
      The driving force is the weight of the hanging part: $F_\text{net} = m_\text{hang} g = M g \frac{x}{L}$.
      The total mass being accelerated is $M$.
      $a = \frac{F_\text{net}}{M} = \frac{M g x / L}{M} = g \frac{x}{L}$.

  - id: nl-hard-q08
    title: Three Connected Blocks
    type: numericResponse
    prompt: |
      Three blocks ($m_1 = 1.0\text{ kg}$, $m_2 = 2.0\text{ kg}$, $m_3 = 3.0\text{ kg}$) are connected by strings on a frictionless horizontal surface. A force of $12\text{ N}$ is applied to $m_3$, pulling the whole train ($m_1$ is in back, $m_3$ in front). What is the tension in the string connecting $m_1$ and $m_2$?
    answer:
      value: 2.0
      tolerance: 0.1
    explanation: |
      Total mass = $1.0 + 2.0 + 3.0 = 6.0\text{ kg}$.
      Acceleration $a = \frac{F}{M_\text{total}} = \frac{12}{6.0} = 2.0\text{ m/s}^2$.
      The string between $m_1$ and $m_2$ only needs to pull $m_1$.
      $T = m_1 a = 1.0(2.0) = 2.0\text{ N}$.

  - id: nl-hard-q09
    title: Block on a Wedge (No Friction)
    type: numericResponse
    prompt: |
      A block of mass $m$ rests on a wedge of angle $30°$ and mass $M$. The wedge is on a frictionless horizontal floor. What horizontal force must be applied to the wedge so that the block does not slide up or down the wedge? Answer in terms of $m, M,$ and $g$. What is the numerical coefficient of $(M+m)g$? Round to three decimal places.
      *(Hint: You want the block and wedge to accelerate together such that the normal force from the wedge provides the necessary horizontal acceleration and balances gravity vertically).*
    answer:
      value: 0.577
      tolerance: 0.01
    explanation: |
      For the block not to slide, it must have the same horizontal acceleration $a$ as the wedge, and zero vertical acceleration.
      Forces on block: Gravity $mg$ (down), Normal $N$ (perpendicular to wedge surface, so $N$ is angled at $30°$ from the vertical).
      Vertical: $N\cos 30° = mg \implies N = \frac{mg}{\cos 30°}$.
      Horizontal: $N\sin 30° = ma$.
      Substitute $N$: $\frac{mg}{\cos 30°}\sin 30° = ma \implies a = g\tan 30°$.
      The required force on the system: $F = (M+m)a = (M+m)g\tan 30°$.
      $\tan 30° = \frac{1}{\sqrt{3}} \approx 0.577$.

  - id: nl-hard-q10
    title: Force from Power and Time
    type: numericResponse
    prompt: |
      An engine delivers a constant power $P = 1000\text{ W}$ to accelerate a $500\text{ kg}$ car from rest. Ignoring friction, what is the net force on the car at $t = 10\text{ s}$?
      *(Hint: Work $W = Pt = \frac{1}{2}mv^2$. Find $v(t)$, then $a(t)$, then $F$. Or use $P = Fv$).*
    answer:
      value: 158.1
      tolerance: 1.0
    explanation: |
      $W = Pt = 1000(10) = 10000\text{ J}$.
      $\frac{1}{2}mv^2 = 10000 \implies \frac{1}{2}(500)v^2 = 10000 \implies 250v^2 = 10000 \implies v^2 = 40 \implies v = \sqrt{40} \approx 6.32\text{ m/s}$.
      Since $P = Fv \implies F = \frac{P}{v} = \frac{1000}{\sqrt{40}} = \frac{1000}{6.324} \approx 158.1\text{ N}$.

  - id: nl-hard-q11
    title: Air Resistance (Terminal Velocity)
    type: symbolicResponse
    prompt: |
      An object of mass $m$ falls under gravity, experiencing air resistance proportional to its velocity squared: $F_\text{drag} = b v^2$. Enter the expression for its terminal velocity $v_t$. Use $g$ for gravity.
    answer:
      expectedLatex: \sqrt{m*g/b}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      At terminal velocity, the net force is zero (acceleration is zero).
      Gravity (down) is balanced by drag (up).
      $mg = b v_t^2 \implies v_t^2 = \frac{mg}{b} \implies v_t = \sqrt{\frac{mg}{b}}$.

  - id: nl-hard-q12
    title: Helicopter Lifting a Cable
    type: numericResponse
    prompt: |
      A helicopter accelerates upward at $3.0\text{ m/s}^2$ while lifting a uniform cable of mass $20\text{ kg}$ and length $10\text{ m}$. What is the tension in the cable exactly at its midpoint ($5.0\text{ m}$ from the bottom)? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 128.0
      tolerance: 1.0
    explanation: |
      The tension at the midpoint only has to support and accelerate the bottom half of the cable.
      Mass of bottom half: $m = 10\text{ kg}$.
      Equation of motion for the bottom half: $T_\text{mid} - mg = ma$.
      $T_\text{mid} = m(g + a) = 10(9.8 + 3.0) = 10(12.8) = 128\text{ N}$.

  - id: nl-hard-q13
    title: Normal Force on a Curved Bridge
    type: numericResponse
    prompt: |
      A $1000\text{ kg}$ car crosses a convex (humpbacked) bridge that is a circular arc of radius $50\text{ m}$. At the exact top of the bridge, the car is moving at $15\text{ m/s}$. What is the normal force exerted by the bridge on the car? Use $g = 9.8\text{ m/s}^2$.
    answer:
      value: 5300.0
      tolerance: 10.0
    explanation: |
      At the top of the bridge, the centripetal acceleration points downward.
      $\sum F_y = mg - N = \frac{mv^2}{R}$.
      $N = mg - \frac{mv^2}{R} = 1000(9.8) - \frac{1000(15^2)}{50} = 9800 - \frac{1000(225)}{50} = 9800 - 20(225) = 9800 - 4500 = 5300\text{ N}$.

  - id: nl-hard-q14
    title: Pulleys with Mechanical Advantage
    type: numericResponse
    prompt: |
      A $50\text{ kg}$ block is suspended by a movable pulley. A rope goes from the ceiling, around the movable pulley, and then up to a fixed pulley and down to a person. If the person pulls the rope with a constant force of $300\text{ N}$, what is the upward acceleration of the block? Use $g = 9.8\text{ m/s}^2$. Round to one decimal place. (Ignore the mass of pulleys and rope).
    answer:
      value: 2.2
      tolerance: 0.1
    explanation: |
      The movable pulley is supported by two segments of the rope, so the upward force on the pulley (and the block) is $2T$.
      $T = 300\text{ N} \implies F_\text{up} = 600\text{ N}$.
      Net force on block: $F_\text{net} = 2T - mg = 600 - 50(9.8) = 600 - 490 = 110\text{ N}$.
      Acceleration $a = \frac{F_\text{net}}{m} = \frac{110}{50} = 2.2\text{ m/s}^2$.

  - id: nl-hard-q15
    title: Two Blocks and a Wedge
    type: multipleChoice
    prompt: |
      Block A is on a frictionless horizontal table. A string connects it over a pulley to Block B, which hangs vertically. If we change the setup so that Block A is now on a frictionless incline (sloping downwards towards the pulley), what happens to the tension in the string and the acceleration of Block B, assuming Block B still moves downwards?
    choices:
      - id: a
        text: Tension decreases, acceleration increases.
      - id: b
        text: Tension increases, acceleration increases.
      - id: c
        text: Tension increases, acceleration decreases.
      - id: d
        text: Both remain the same.
    answer:
      choiceId: a
    explanation: |
      Original setup: $m_B g - T = m_B a$ and $T = m_A a$.
      $m_B g = (m_A + m_B)a \implies a = \frac{m_B g}{m_A + m_B}$.
      Incline setup: gravity now helps pull Block A towards the pulley.
      $m_B g - T' = m_B a'$ and $T' + m_A g\sin\theta = m_A a'$.
      $m_B g + m_A g\sin\theta = (m_A + m_B)a' \implies a' = \frac{m_B g + m_A g\sin\theta}{m_A + m_B}$.
      Since the driving force is larger, the new acceleration $a'$ is **greater** than $a$.
      For tension: from $m_B g - T = m_B a$, we get $T = m_B(g - a)$. Since $a$ has increased to $a'$, the term $(g - a')$ is smaller, so the tension $T'$ has **decreased**.
