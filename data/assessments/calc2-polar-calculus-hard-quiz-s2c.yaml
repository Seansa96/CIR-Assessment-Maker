authoring: { visualRequirement: required, visualRationale: 'Hard polar calculus requires independently constructing regions and trace intervals.', difficultyTier: hard, sourceId: src-20260719182540-a40fdcd443 }
questions:
  - { id: q001, type: freeResponse, prompt: 'For $r=1+2\cos\theta$, set up the inner-loop area and justify its bounds.', answer: { gradingMode: selfCheck, keyPoints: ['zeros two pi over three and four pi over three', 'one half integral r squared', 'negative radius interval traces loop'] }, explanation: 'Solution: $A=\frac12\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)^2d\theta$. The consecutive zeros bound the negative-radius inner loop. Why it works: r equals zero marks pole endpoints and r squared supplies sector area. Common trap: Integrating the full limacon.', difficultyDimensions: [auxiliaryTechnique, domainCondition, modelOrDerivation], difficultyEvidence: 'Finds trig thresholds, identifies a signed-radius loop, and forms its area model.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q002, type: freeResponse, prompt: 'Describe how to set up the area common to $r=2\sin\theta$ and $r=2\cos\theta$ in the first quadrant.', answer: { gradingMode: selfCheck, keyPoints: ['intersection pi over four', 'smaller radius', 'split zero to pi over four and pi over four to pi over two'] }, explanation: 'Solution: The curves meet at pi over four. The common region uses the smaller radius: one half integral of four sine squared from zero to pi/4 plus one half integral of four cosine squared from pi/4 to pi/2. Why it works: Points inside both must satisfy the smaller radial bound. Common trap: Using outer-minus-inner, which gives the between-region.', difficultyDimensions: [casePartition, representationTransfer, modelOrDerivation], difficultyEvidence: 'Finds an intersection, switches radial ownership, and constructs an overlap model.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q003, type: freeResponse, prompt: 'For $r=\theta$ on zero to two pi, explain why the area formula does not reduce to one fixed-radius sector formula.', answer: { gradingMode: selfCheck, keyPoints: ['spiral radius changes', 'integrate theta squared', 'fixed sector needs constant r'] }, explanation: 'Solution: Radius changes continuously, so the curve is a spiral and $A=\frac12\int_0^{2\pi}\theta^2d\theta$. Why it works: Each differential sector has a different radius. Common trap: Using an endpoint radius in $\frac12r^2\Delta\theta$.', difficultyDimensions: [representationTransfer, modelOrDerivation, errorDiagnosis], difficultyEvidence: 'Classifies a variable-radius path and rejects an invalid fixed-radius shortcut.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q004, type: freeResponse, prompt: 'Set up polar arc length for $r=\cos\theta$ on a one-trace interval and explain why 0 to 2 pi can overcount.', answer: { gradingMode: selfCheck, keyPoints: ['choose negative pi over two to pi over two', 'speed square root cos squared plus sin squared equals one', 'full period retraces circle'] }, explanation: 'Solution: Use $-\pi/2\le\theta\le\pi/2$; speed is one, so length is pi. The full interval retraces the circle with negative radius. Why it works: A one-trace interval is part of the length model. Common trap: Integrating 0 to 2 pi and reporting double length.', difficultyDimensions: [domainCondition, identityConstruction, globalLocalReasoning], difficultyEvidence: 'Chooses a nonretracing interval, simplifies speed by identity, and accounts for multiplicity.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q005, type: freeResponse, prompt: 'Explain why polar intersections require checking the pole separately even in an area-between-curves problem.', answer: { gradingMode: selfCheck, keyPoints: ['multiple theta names at pole', 'zeros of each r', 'can change bounds or region'] }, explanation: 'Solution: The pole has many angular descriptions, so solve each r equals zero in addition to equating radii. A pole intersection can be a boundary endpoint and change the intended region. Why it works: Polar coordinates are nonunique at r equals zero. Common trap: Treating equal-radius equations as exhaustive.', difficultyDimensions: [casePartition, representationTransfer, errorDiagnosis], difficultyEvidence: 'Extends intersection analysis with a coordinate-nonuniqueness case.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q006, type: freeResponse, prompt: 'A student uses $\frac12\int(r_o-r_i)^2d\theta$ for a polar between-region. Diagnose it algebraically and geometrically.', answer: { gradingMode: selfCheck, keyPoints: ['cross term erroneous', 'subtract sector areas', 'outer squared minus inner squared'] }, explanation: 'Solution: Expanding the student expression creates a false negative two outer-inner cross term. Geometrically, subtract the two sector areas: one half integral outer squared minus inner squared. Why it works: Radial thickness is not the sector radius. Common trap: Treating a thin annulus like one sector of thickness radius.', difficultyDimensions: [errorDiagnosis, identityConstruction, modelOrDerivation], difficultyEvidence: 'Uses algebraic expansion and sector geometry to repair a plausible formula.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q007, type: freeResponse, prompt: 'For a polar curve with an absolute value in r, explain why area and arc-length bounds may need partitions at zeros of the inside expression.', answer: { gradingMode: selfCheck, keyPoints: ['absolute value changes sign behavior', 'partition at zeros', 'derivative changes for length', 'trace differs from original'] }, explanation: 'Solution: Partition where the inside expression changes sign. The absolute value changes the radial trace and can make the derivative piecewise for length. Why it works: Absolute value changes both geometry and differentiability. Common trap: Reusing bounds and derivative from the unsigned equation.', difficultyDimensions: [casePartition, domainCondition, representationTransfer], difficultyEvidence: 'Handles sign thresholds that alter graph and calculus models.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q008, type: freeResponse, prompt: '![Polar region](/media/calculus/polar-review-loop-sector.svg) Give a procedure to verify the outer radius on every subinterval of a polar between-curves problem.', answer: { gradingMode: selfCheck, keyPoints: ['find intersections', 'partition', 'test sample angle each interval', 'plot sign/ray if negative'] }, explanation: 'Solution: Find all relevant intersections and zeros, partition the angular domain, and compare radii at a sample angle in each interval while respecting negative-radius plotting. Why it works: Radial order can switch only at a boundary event. Common trap: Assuming one comparison works over the entire interval.', difficultyDimensions: [casePartition, representationTransfer, proofJustification], difficultyEvidence: 'Combines intersection partitioning, sampled order checks, and signed-radius geometry.', prerequisiteObjectiveIds: [polar-curves], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q009, type: freeResponse, prompt: 'Use dimensional reasoning to distinguish a polar area setup from a polar arc-length setup.', answer: { gradingMode: selfCheck, keyPoints: ['area r squared dtheta square units', 'length radical linear units', 'theta dimensionless'] }, explanation: 'Solution: r squared d theta has square-length units, while the length radical has length units. Why it works: Theta is dimensionless, so the power of radius determines the result’s units. Common trap: Choosing formulas by visual complexity instead of quantity requested.', difficultyDimensions: [representationTransfer, proofJustification, modelOrDerivation], difficultyEvidence: 'Uses units to select and justify a polar calculus model.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
  - { id: q010, type: freeResponse, prompt: 'Write a full model-validation checklist for a polar area or arc-length solution.', answer: { gradingMode: selfCheck, keyPoints: ['sketch or sample', 'zeros intersections pole', 'sign and trace once', 'outer inner or speed formula', 'bounds units'] }, explanation: 'Solution: Sketch/sample the curves; find zeros, intersections, and pole cases; determine sign and one-trace intervals; choose outer/inner or polar-speed model; verify bounds and units. Why it works: Each check addresses a distinct source of polar modeling error. Common trap: Beginning integration before the region/path is identified.', difficultyDimensions: [errorDiagnosis, proofJustification, modelOrDerivation], difficultyEvidence: 'Audits every stage of a polar calculus model.', prerequisiteObjectiveIds: [polar-calculus], extensionObjectiveIds: [polar-review-bounds-area-length] , issueSignals: [{ id: polar-area-calculation-error }, { id: polar-derivative-error }, { id: parametric-arc-length-error }, { id: chain-rule-missed }, { id: pythagorean-theorem-misapplied }, { id: trigonometric-identity-misapplied }]}
