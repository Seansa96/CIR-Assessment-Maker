- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: In an RL circuit immediately after the switch is closed (connecting the battery), what is the current?
  explanation: 'Solution:

    The current is initially zero.


    Why it works:

    An inductor opposes sudden changes in current. Since the current was zero before the switch was closed, it must
    be zero immediately after.

    Why the other choices fail: Current grows over time, reaching maximum after a long time ($t \to \infty$).'
  choices:
  - id: a
    text: Zero
  - id: b
    text: Its maximum value
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Half its maximum value
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: Infinity
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
- id: q002
  type: multipleChoice
  skills:
  - physics2-ch14-modeling
  prompt: When analyzing self-inductance in Inductance, which first step makes use of $\\mathcal{E}_L=-L\\,dI/dt$
    physically meaningful?
  choices:
  - id: a
    text: Define the system, identify the relevant quantities and directions, then check the relation's assumptions.
  - id: b
    text: Substitute every listed number before deciding what quantity the equation represents.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: Ignore units because the formula supplies the correct dimension automatically.
    issueSignals:
    - id: physics2-units-error
      domains:
      - physics-2
  - id: d
    text: Treat directed quantities as positive regardless of the selected convention.
    issueSignals:
    - id: physics2-sign-direction-error
      domains:
      - physics-2
  answer:
    choiceId: a
  explanation: 'Solution: Define the model before substituting values and then check units, direction, and the stated
    condition.


    Why it works: \\mathcal{E}_L=-L\\,dI/dt relates defined physical quantities in the self-induced emf and magnetic
    energy model; it is not a number-matching rule.


    Why the other choices fail: The alternatives skip model selection, dimensional analysis, or the sign convention
    that gives the result physical meaning.'
  difficultyDimensions: &id002
  - modelOrDerivation
  - representationTransfer
  subjectDifficultyTags:
  - physics2-ch14-modeling
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
