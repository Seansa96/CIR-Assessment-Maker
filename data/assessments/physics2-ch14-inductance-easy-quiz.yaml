questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: In an RL circuit immediately after the switch is closed (connecting the
    battery), what is the current?
  options:
  - id: a
    text: Zero
    isCorrect: true
  - id: b
    text: Its maximum value
    isCorrect: false
  - id: c
    text: Half its maximum value
    isCorrect: false
  - id: d
    text: Infinity
    isCorrect: false
  explanation: 'Solution:

    The current is initially zero.


    Why it works:

    An inductor opposes sudden changes in current. Since the current was zero before
    the switch was closed, it must be zero immediately after.

    Why the other choices fail: Current grows over time, reaching maximum after a
    long time ($t \to \infty$).'
