questions:
- id: physics-elastic-materials-focused-q001
  type: multipleChoice
  prompt: A solid block is pushed sideways so that its shape changes while its volume is approximately unchanged. Which modulus describes this response?
  choices:
  - { id: a, text: Shear modulus. }
  - { id: b, text: Bulk modulus. }
  - { id: c, text: Young's modulus. }
  answer: { choiceId: a }
  explanation: |
    Solution: Use the shear modulus.

    Why it works: A force parallel to a face produces shear deformation, which changes shape rather than primarily length or volume.

    Why the other choices fail: Bulk modulus concerns pressure-driven volume change, while Young's modulus concerns axial stretching or compression.
  difficultyDimensions: [representationTransfer, modelOrDerivation]
  subjectDifficultyTags: [modulusSelection]
  difficultyEvidence: The deformation description must be classified before choosing the appropriate modulus.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-elastic-materials-focused-q001
- id: physics-elastic-materials-focused-q002
  type: multipleChoice
  prompt: A metal rod remains in its linear elastic range. Its tensile force and resulting elongation are both doubled. What happens to its Young's modulus?
  choices:
  - { id: a, text: It remains the same. }
  - { id: b, text: It doubles. }
  - { id: c, text: It is cut in half. }
  answer: { choiceId: a }
  explanation: |
    Solution: It remains the same.

    Why it works: In the linear elastic range, stress and strain both double, so their ratio, Young's modulus, remains a property of the material.

    Why the other choices fail: The modulus is not the applied force or the elongation; it is the ratio of stress to strain for the material in its elastic range.
  difficultyDimensions: [modelOrDerivation, simplification]
  subjectDifficultyTags: [youngsModulus]
  difficultyEvidence: The proportional stress-strain relation must be interpreted as an invariant ratio.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-elastic-materials-focused-q002
- id: physics-elastic-materials-focused-q003
  type: multipleChoice
  prompt: A report says a sample has yielded permanently after a large load is removed. Which use of a linear elastic modulus is justified?
  choices:
  - { id: a, text: Use it only for the earlier elastic-range behavior, not to predict the permanent deformation. }
  - { id: b, text: Use it unchanged to compute the permanent deformation. }
  - { id: c, text: Set the modulus to zero because the sample was loaded. }
  answer: { choiceId: a }
  explanation: |
    Solution: Use the modulus only for the earlier elastic-range behavior.

    Why it works: Linear elastic moduli model reversible, small deformation; yielding signals that the material has left the range where that model predicts the final shape.

    Why the other choices fail: Extending the linear model through permanent deformation is unsupported, and loading a material does not make its elastic modulus automatically zero.
  difficultyDimensions: [domainCondition, errorDiagnosis, modelOrDerivation]
  subjectDifficultyTags: [elasticLimit]
  difficultyEvidence: The yielding condition must be used to reject an otherwise familiar calculation model.
  prerequisiteObjectiveIds: [phys1-obj-elastic-material-response]
  extensionObjectiveIds: [phys1-obj-elastic-material-response]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-elastic-materials-focused-q003
