- id: q001
  type: multipleChoice
  prompt: What factor replaces dA under a change of variables?
  choices:
  - id: a
    text: '$|\partial(x,y)/\partial(u,v)|du\,dv$'
  - id: b
    text: $du+dv$
    issueSignals:
    - id: algebraic-simplification-error
  - id: c
    text: '$dx\,dy$ unchanged'
    issueSignals:
    - id: algebraic-simplification-error
  - id: d
    text: $1/J$ always
    issueSignals:
    - id: sign-error
  answer:
    choiceId: a
  issueSignals:
  - id: algebraic-simplification-error
  difficultyDimensions:
  - representationTransfer
  - auxiliaryTechnique
  difficultyEvidence: Connects a vector-calculus representation, its governing relation, and the required interpretation.
  explanation: 'Solution: The determinant provides the local area scale.

    Why it works: This uses the defining relationship for the topic. Review path: Calculus 2 → Integration Techniques.

    Why the other choices fail: Choice b, ''$du+dv$'', does not give ''$|\partial(x,y)/\partial(u,v)|du\,dv$'' for ''What
    factor replaces dA under a change of variables?''. It substitutes a different result, representation, or condition for
    the one the prompt specifies.

    Choice c, ''$dx\,dy$ unchanged'', does not give ''$|\partial(x,y)/\partial(u,v)|du\,dv$'' for ''What factor replaces dA
    under a change of variables?''. It substitutes a different result, representation, or condition for the one the prompt
    specifies.

    Choice d, ''$1/J$ always'', does not give ''$|\partial(x,y)/\partial(u,v)|du\,dv$'' for ''What factor replaces dA under
    a change of variables?''. It substitutes a different result, representation, or condition for the one the prompt specifies.'
