items:
- id: drill-stack-trace
  prompt: 'Start with an empty Stack `S`. Perform the following operations:

    `S.push(A)`

    `S.push(B)`

    `S.pop()`

    `S.push(C)`


    What is the element currently at the top of the stack?

    '
  answer: { expected: 'C' }
- id: drill-queue-trace
  prompt: 'Start with an empty Queue `Q`. Perform the following operations:

    `Q.enqueue(X)`

    `Q.enqueue(Y)`

    `Q.dequeue()`

    `Q.enqueue(Z)`


    What element will be returned by the *next* `Q.dequeue()` operation?

    '
  answer: { expected: 'Y' }


