glossary:
  introduction: Use these terms to make quantitative chemistry decisions precisely.
  sections:
  - id: terms
    title: Core terms
    entries:
    - id: e1
      term: conversion factor
      definition: A ratio of equivalent quantities equal to one.
      drills:
      - id: d1
        type: flashcard
        prompt: Define conversion factor.
        answer:
          expected: ratio of equivalent quantities
        explanation: 'Solution: ratio of equivalent quantities. Why it works: A ratio of equivalent quantities equal to one.'
    - id: e2
      term: metric prefix
      definition: A power-of-ten unit multiplier.
      drills:
      - id: d2
        type: flashcard
        prompt: Define metric prefix.
        answer:
          expected: power-of-ten multiplier
        explanation: 'Solution: power-of-ten multiplier. Why it works: A power-of-ten unit multiplier.'
    - id: e3
      term: compound unit
      definition: A unit formed by multiplication or division of base units.
      drills:
      - id: d3
        type: flashcard
        prompt: Define compound unit.
        answer:
          expected: combined base units
        explanation: 'Solution: combined base units. Why it works: A unit formed by multiplication or division of base units.'
    - id: e4
      term: squared conversion
      definition: A conversion requiring the linear factor squared.
      drills:
      - id: d4
        type: flashcard
        prompt: Define squared conversion.
        answer:
          expected: square the linear factor
        explanation: 'Solution: square the linear factor. Why it works: A conversion requiring the linear factor squared.'
    - id: e5
      term: cubic conversion
      definition: A conversion requiring the linear factor cubed.
      drills:
      - id: d5
        type: flashcard
        prompt: Define cubic conversion.
        answer:
          expected: cube the linear factor
        explanation: 'Solution: cube the linear factor. Why it works: A conversion requiring the linear factor cubed.'
    - id: e6
      term: dimensional analysis
      definition: A calculation that uses unit cancellation.
      drills:
      - id: d6
        type: flashcard
        prompt: Define dimensional analysis.
        answer:
          expected: unit cancellation calculation
        explanation: 'Solution: unit cancellation calculation. Why it works: A calculation that uses unit cancellation.'
