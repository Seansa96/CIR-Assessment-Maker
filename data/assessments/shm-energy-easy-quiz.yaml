  - modelOrDerivation
  - representationTransfer
- id: q006
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: A 0.250-kg cart has total oscillator energy 0.500 J. At $x=0.0800\,\mathrm{m}$ its spring potential energy is 0.180 J. What is the cartâ€™s speed in m/s?
  answer:
    value: 1.6
    tolerance: 0.016
  explanation: 'Solution: First find $K=0.500-0.180$, then use $K=\tfrac12mv^2$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
