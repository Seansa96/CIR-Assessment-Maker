- id: q007
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: At what fraction of its amplitude is a spring oscillator when its elastic potential energy is one-quarter of its total energy? Give a positive number.
  answer:
    value: 0.5
    tolerance: 0.005
  explanation: 'Solution: Since $U/E=x^2/A^2$, $x/A=\sqrt{1/4}$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q008
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: A 0.400-kg mass is moving at 1.50 m/s as it passes equilibrium. What is the total mechanical energy of its undamped oscillation in J?
  answer:
    value: 0.45
    tolerance: 0.0045
  explanation: 'Solution: At equilibrium $U=0$, so the total energy equals $\tfrac12mv^2$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q009
  type: symbolicResponse
  skills:
  - physics-shm-energy
  prompt: Given $E=\tfrac12kA^2$, solve symbolically for the positive amplitude $A$.
  answer:
    expectedLatex: sqrt(2*E/k)
    equivalenceMode: expression
    tolerance: '0.000001'
    variables:
    - E
    - k
    - A
  explanation: 'Solution: Multiply by $2/k$ and take the positive square root because amplitude is a magnitude.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q010
  type: symbolicResponse
  skills:
  - physics-shm-energy
  prompt: Starting from $E=\tfrac12mv^2+\tfrac12kx^2$, solve for the positive speed $v$.
  answer:
    expectedLatex: sqrt((2*E-k*x^2)/m)
    equivalenceMode: expression
    tolerance: '0.000001'
    variables:
    - E
    - m
    - v
    - k
    - x
  explanation: 'Solution: Isolate the kinetic-energy term, multiply by $2/m$, and take the positive root.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
