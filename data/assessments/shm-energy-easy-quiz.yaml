questions:
- id: q001
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: A 120-N/m spring carries a 0.200-kg block. The block is released from rest at $x=0.100\,\mathrm{m}$. What is the total mechanical energy in J?
  answer:
    value: 0.6
    tolerance: 0.006
  explanation: 'Solution: At an endpoint the energy is all spring potential energy, $E=\tfrac12kA^2$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q002
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: An oscillator has $k=80.0\,\mathrm{N/m}$ and amplitude $0.150\,\mathrm{m}$. Find the elastic potential energy at $x=0.0900\,\mathrm{m}$ in J.
  answer:
    value: 0.324
    tolerance: 0.0033
  explanation: 'Solution: Use $U=\tfrac12kx^2$ at the stated displacement.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q003
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: A block has total oscillator energy 2.00 J. At a particular position its spring potential energy is 0.720 J. What is its kinetic energy in J?
  answer:
    value: 1.28
    tolerance: 0.013
  explanation: 'Solution: Mechanical energy is conserved, so $K=E-U$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q004
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: A 0.500-kg mass attached to a 50.0-N/m spring has amplitude 0.200 m. What is its maximum speed in m/s?
  answer:
    value: 2.0
    tolerance: 0.02
  explanation: 'Solution: At equilibrium, $\tfrac12mv_{\max}^2=\tfrac12kA^2$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
  difficultyDimensions:
  - modelOrDerivation
  - representationTransfer
- id: q005
  type: numericResponse
  skills:
  - physics-shm-energy
  prompt: A spring oscillator has total energy 0.900 J and spring constant 72.0 N/m. What is its amplitude in meters?
  answer:
    value: 0.158114
    tolerance: 0.0016
  explanation: 'Solution: Set $E=\tfrac12kA^2$ and solve for $A$.


    Why it works: The stated model applies under the prompt conditions, and the result is checked against its units and constraints.'
