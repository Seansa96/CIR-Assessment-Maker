- id: we-sequence-fundamentals-1
  title: Evaluate a rational sequence limit
  problem: |
    Find
    $$\lim_{n\to\infty}\frac{3n^2-2n+1}{n^2+4},$$
    and explain why lower-degree terms do not determine the answer.
  steps:
  - id: step-sequence-fundamentals-1-1
    title: Identify the dominant scale
    instruction: 'Both numerator and denominator have degree two. Divide every term by

      $n^2$, the largest power present, rather than keeping only the leading

      terms without justification.

      '
    type: multipleChoice
    prompt: What expression results after division by $n^2$?
    choices:
    - id: a
      text: $(3-2/n+1/n^2)/(1+4/n^2)$
    - id: b
      text: $(3n-2+1/n)/(n+4/n)$
    - id: c
      text: $(3-2n+n^2)/(1+4n^2)$
    - id: d
      text: $3/4$
    answer:
      choiceId: a
    explanation: |-
      Solution: Dividing term-by-term makes every lower-order contribution an explicit vanishing fraction. Therefore the answer is $(3-2/n+1/n^2)/(1+4/n^2)$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $(3n-2+1/n)/(n+4/n)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $(3-2n+n^2)/(1+4n^2)$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $3/4$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-sequence-fundamentals-1-2
    title: Take component limits
    instruction: |
      As $n\to\infty$, $1/n\to0$ and $1/n^2\to0$. Therefore the numerator
      approaches $3$ and the denominator approaches $1$.
    type: multipleChoice
    prompt: Which denominator fact permits the quotient limit law?
    choices:
    - id: a
      text: Its limit is $1$, which is nonzero.
    - id: b
      text: It contains a positive term.
    - id: c
      text: It has the same degree as the numerator.
    - id: d
      text: It is larger than the numerator.
    answer:
      choiceId: a
    explanation: 'Solution: The quotient law requires a nonzero limiting denominator. Therefore the answer is Its limit is $1$, which is nonzero.. Therefore the answer is Its limit is $1$, which is nonzero.. Therefore the answer is Its limit is $1$, which is nonzero..


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.


      Why the other choices fail: It contains a positive term. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; It has the same degree as the numerator. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; It is larger than the numerator. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.'
  - id: step-sequence-fundamentals-1-3
    title: Compute the quotient
    instruction: |
      Applying the limit laws gives
      $$\frac{3-0+0}{1+0}=3.$$
      The limit is the ratio of leading coefficients because the degrees match.
    type: multipleChoice
    prompt: What is the sequence limit?
    choices:
    - id: a
      text: $0$
    - id: b
      text: $3/4$
    - id: c
      text: $3$
    - id: d
      text: |-
        $+\infty$
    answer:
      choiceId: c
    explanation: |-
      Solution: After normalization, all lower-degree terms vanish and the leading-coefficient ratio is $3/1$. Therefore the answer is $3$.

      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

      Why the other choices fail: $0$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $3/4$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $+\infty$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
  - id: step-sequence-fundamentals-1-4
    title: Check the scale
    instruction: 'For large $n$, the expression is close to $3n^2/n^2=3$. This

      asymptotic check agrees with the exact limit-law calculation.

      '
    type: multipleChoice
    prompt: If the denominator instead had degree three, what would the same dominant-power reasoning predict?
    choices:
    - id: a
      text: A limit of $0$
    - id: b
      text: A limit of $3$
    - id: c
      text: |-
        A limit of $+\infty$
    - id: d
      text: Oscillation
    answer:
      choiceId: a
    explanation: |-
      Solution: A degree-two numerator divided by a degree-three denominator has size proportional to $1/n$. Therefore the answer is A limit of $0$.

      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

      Why the other choices fail: A limit of $3$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; A limit of $+\infty$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; Oscillation conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
- id: we-sequence-fundamentals-2
  title: Prove divergence with parity subsequences
  problem: |
    Determine whether
    $$a_n=(-1)^n+\frac1n$$
    converges. If it diverges, identify two subsequential limits.
  steps:
  - id: step-sequence-fundamentals-2-1
    title: Separate even indices
    instruction: |
      For $n=2k$,
      $$a_{2k}=1+\frac1{2k}\longrightarrow1.$$
      Thus the even-indexed subsequence converges to $1$.
    type: multipleChoice
    prompt: Why does $(-1)^{2k}$ equal $1$?
    choices:
    - id: a
      text: Every even power of $-1$ is positive.
    - id: b
      text: $2k$ approaches zero.
    - id: c
      text: $1/(2k)$ is positive.
    - id: d
      text: The exponent is larger than one.
    answer:
      choiceId: a
    explanation: 'Solution: Parity controls the oscillatory component independently of the vanishing correction. Therefore the answer is Every even power of $-1$ is positive.. Therefore the answer is Every even power of $-1$ is positive.. Therefore the answer is Every even power of $-1$ is positive..


      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.


      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.


      Why the other choices fail: $2k$ approaches zero. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $1/(2k)$ is positive. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; The exponent is larger than one. conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.'
  - id: step-sequence-fundamentals-2-2
    title: Separate odd indices
    instruction: |
      For $n=2k+1$,
      $$a_{2k+1}=-1+\frac1{2k+1}\longrightarrow-1.$$
    type: multipleChoice
    prompt: What is the odd subsequential limit?
    choices:
    - id: a
      text: $-1$
    - id: b
      text: $0$
    - id: c
      text: $1$
    - id: d
      text: |-
        $+\infty$
    answer:
      choiceId: a
    explanation: |-
      Solution: The reciprocal correction vanishes, leaving the odd sign value $-1$. Therefore the answer is $-1$.

      Why it works: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit. A sequence converges only when its terms approach one finite number from all sufficiently large indices.

      Common trap: Checking several numerical terms suggests a pattern but does not prove a limit; account for sign changes, growth rates, and subsequences.

      Why the other choices fail: $0$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $1$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit; $+\infty$ conflicts with this criterion: Evaluate the long-run behavior of $a_n$ using limit laws, dominant terms, or a standard limit.
  - id: step-sequence-fundamentals-2-3
    title: Use uniqueness of limits
    instruction: 'Every subsequence of a convergent sequence must approach the same limit.

      Here the even and odd subsequences approach different values, so the full

      sequence diverges.

      '
    type: multipleChoice
    prompt: Which contradiction rules out convergence?
    choices:
    - id: a
      text: A convergent sequence cannot have subsequential limits $1$ and $-1$.
    - id: b
      text: A convergent sequence cannot contain negative terms.
    - id: c
      text: Every divergent sequence is unbounded.
    - id: d
      text: The reciprocal sequence diverges.
    answer:
      choiceId: a
    explanation: 'Solution: Uniqueness of the sequential limit applies to every subsequence. Therefore the answer is A convergent sequence cannot have subsequential limits $1$ and $-1$.. Therefore the answer is A convergent sequence cannot have subsequential limits $1$ and $-1$.. Therefore the answer is A convergent sequence cannot have subsequential limits $1$ and $-1$..


      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.


