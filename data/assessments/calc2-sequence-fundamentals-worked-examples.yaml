      text: The monotone convergence theorem for sequences
    - id: b
      text: The divergence test for series
    - id: c
      text: The ratio test
    - id: d
      text: The geometric-series formula
    answer:
      choiceId: a
    explanation: 'Solution: Increasing plus bounded above is the exact hypothesis needed for monotone convergence. Therefore the answer is The monotone convergence theorem for sequences.


