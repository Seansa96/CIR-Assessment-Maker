- id: we-sequence-fundamentals-3
  title: Prove a nonlinear recurrence converges
  problem: |
    Let $a_1=1$ and $a_{n+1}=\sqrt{3+a_n}$. Prove that $(a_n)$ converges
    and find its limit.
  steps:
  - id: step-sequence-fundamentals-3-1
    title: Find the candidate fixed point
    instruction: |
      If a limit $L$ exists, continuity would give $L=\sqrt{3+L}$.
      Solving $L^2-L-3=0$ gives
      $$L=\frac{1\pm\sqrt{13}}2.$$
      Since every term is positive, only
      $\alpha=(1+\sqrt{13})/2$ can be the limit.
    type: multipleChoice
    prompt: What has this fixed-point calculation proved so far?
    choices:
    - id: a
      text: Only the possible positive limit, not convergence.
    - id: b
      text: The sequence converges immediately.
    - id: c
      text: |-
        Every term equals $\alpha$.
    - id: d
      text: The sequence is decreasing.
    answer:
      choiceId: a
    explanation: |-
      Solution: A fixed point is a candidate until boundedness and monotonicity establish convergence. Therefore the answer is Only the possible positive limit, not convergence.. Therefore the answer is Only the possible positive limit, not convergence.. Therefore the answer is Only the possible positive limit, not convergence..

      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.

      Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.

      Why the other choices fail: The sequence converges immediately. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; Every term equals $\alpha$. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; The sequence is decreasing. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.
  - id: step-sequence-fundamentals-3-2
    title: Prove the invariant upper bound
    instruction: |
      Because $a_1=1<\alpha$, assume $a_n<\alpha$. Then
      $$a_{n+1}=\sqrt{3+a_n}<\sqrt{3+\alpha}=\alpha,$$
      where the last equality uses $\alpha^2=3+\alpha$. Induction gives
      $a_n<\alpha$ for all $n$.
    type: multipleChoice
    prompt: Which fact closes the induction?
    choices:
    - id: a
      text: |-
        $\sqrt{3+\alpha}=\alpha$
    - id: b
      text: |-
        $\alpha<0$
    - id: c
      text: $a_{n+1}=a_n$
    - id: d
      text: |-
        $3+\alpha<0$
    answer:
      choiceId: a
    explanation: |-
      Solution: The candidate fixed point becomes a self-preserving boundary for the recurrence. Therefore the answer is $\sqrt{3+\alpha}=\alpha$.

      Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

      Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

      Why the other choices fail: $\alpha<0$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $a_{n+1}=a_n$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $3+\alpha<0$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
  - id: step-sequence-fundamentals-3-3
    title: Prove monotone increase
    instruction: |
      Since $a_n>0$, compare nonnegative quantities by squaring:
      $$a_{n+1}\ge a_n
      \iff 3+a_n\ge a_n^2
      \iff (\alpha-a_n)(a_n-\beta)\ge0,$$
      where $\beta=(1-\sqrt{13})/2<0$. The proved bounds
      $\beta<a_n<\alpha$ make the product nonnegative.
    type: multipleChoice
    prompt: |-
      Why is the negative root $\beta$ useful even though it cannot be the limit?
    choices:
    - id: a
      text: It factors the inequality that proves monotonicity.
    - id: b
      text: It is the first term.
    - id: c
      text: It becomes an upper bound.
    - id: d
      text: It makes the sequence alternate.
    answer:
      choiceId: a
    explanation: 'Solution: Both fixed points factor $3+x-x^2$, and the interval between them determines its sign. Therefore the answer is It factors the inequality that proves monotonicity.. Therefore the answer is It factors the inequality that proves monotonicity.. Therefore the answer is It factors the inequality that proves monotonicity..


      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.


      Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.


      Why the other choices fail: It is the first term. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; It becomes an upper bound. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit; It makes the sequence alternate. conflicts with this criterion: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit.'
  - id: step-sequence-fundamentals-3-4
    title: Invoke the theorem and identify the limit
    instruction: |
      The sequence is increasing and bounded above by $\alpha$, so it
      converges. Passing to the limit in the recurrence is now justified,
      and positivity selects
      $$\lim_{n\to\infty}a_n=\frac{1+\sqrt{13}}2.$$
    type: multipleChoice
    prompt: Which theorem supplies existence of the limit?
    choices:
