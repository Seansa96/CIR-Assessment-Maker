  - id: step-sequence-fundamentals-2-4
    title: Distinguish boundedness from convergence
    instruction: |
      The sequence is bounded—for example, $-1<a_n\le2$—but it does not
      converge. Boundedness guarantees convergent subsequences, not convergence
      of the entire sequence.
    type: multipleChoice
    prompt: Which additional property, together with boundedness, would guarantee convergence?
    choices:
    - id: a
      text: Monotonicity
    - id: b
      text: Alternating signs
    - id: c
      text: Integer indices
    - id: d
      text: A positive first term
    answer:
      choiceId: a
    explanation: 'Solution: The monotone convergence theorem requires both a one-directional order and an appropriate bound. Therefore the answer is Monotonicity.


      Why it works: The Monotone Convergence Theorem says an increasing sequence bounded above, or a decreasing sequence bounded below, has a finite limit. Establish both monotonicity and the appropriate bound before concluding convergence.


      Common trap: Boundedness alone does not imply a sequence converges; for example, $(-1)^n$ is bounded but oscillates.


