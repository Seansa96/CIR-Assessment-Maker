- id: physics-static-structures-focused-q002
  type: numericResponse
  prompt: A $2.0\text{ m}$ horizontal beam is hinged at its left end. A $120\text{ N}$ load hangs at its right end, and a vertical cable supports the beam $1.5\text{ m}$ from the hinge. Ignore the beam's weight. What cable tension in N produces torque balance?
  answer: { value: 160, tolerance: 0.3 }
  explanation: |
    Solution: $T(1.5)-(120)(2.0)=0$, so $T=240/1.5=160\text{ N}$.

    Why it works: Taking torques about the hinge removes the hinge force and leaves the cable and load torques to balance.
  difficultyDimensions: [modelOrDerivation, simplification]
  subjectDifficultyTags: [torqueBalance]
  difficultyEvidence: A signed torque equation must be constructed from the specified locations.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-static-structures-focused-q002
- id: physics-static-structures-focused-q003
  type: multipleChoice
  prompt: A beam has zero net vertical force. Which additional condition is required for static equilibrium?
  choices:
  - { id: a, text: The net torque about any point must also be zero. }
  - { id: b, text: Every individual force must be zero. }
  - { id: c, text: The beam must have zero mass. }
  answer: { choiceId: a }
  explanation: |
    Solution: The net torque about any point must also be zero.

    Why it works: A nonzero torque can rotate a beam even when its net force is zero, so rigid-body static equilibrium needs both force and torque balance.

    Why the other choices fail: Forces may be nonzero and balanced, and mass does not prevent equilibrium; neither replaces the torque condition.
  difficultyDimensions: [errorDiagnosis, reverseReasoning, modelOrDerivation]
  subjectDifficultyTags: [equilibriumConditions]
  difficultyEvidence: The learner must reject the incomplete force-only equilibrium claim.
  prerequisiteObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  extensionObjectiveIds: [phys1-obj-rigid-structure-equilibrium]
  sourceChunkIds: [src-20260720001005-93652b69c4:chunk-1043]
  blueprintId: physics-static-structures-focused-q003
