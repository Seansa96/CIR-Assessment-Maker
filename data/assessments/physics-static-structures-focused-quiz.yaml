questions:
- id: physics-static-structures-focused-q001
  type: multipleChoice
  prompt: A horizontal beam is hinged at its left end. Which force has zero torque about that hinge?
  choices:
  - { id: a, text: The vertical hinge force. }
  - { id: b, text: A load hanging halfway along the beam. }
  - { id: c, text: The beam's weight acting at its center. }
  answer: { choiceId: a }
  explanation: |
    Solution: Choose the vertical hinge force.

    Why it works: Its line of action passes through the chosen pivot, so its perpendicular lever arm is zero.

    Why the other choices fail: The load and the beam's weight act away from the hinge and therefore have nonzero lever arms.
  difficultyDimensions: [modelOrDerivation, representationTransfer]
  subjectDifficultyTags: [pivotChoice]
  difficultyEvidence: The diagram description must be translated into a torque statement.
  prerequisiteObjectiveIds: [phys1-obj-newtons-laws]
