questions:
- id: q001
  type: multipleChoice
  prompt: A trapezoid has bases of length 8 and 14, and a height of 5. What is its area?
  difficultyDimensions:
  - 'Recall the area formula for a trapezoid: $A = 1/2 \cdot (b_1 + b_2) \cdot h$.'
  - 'Add the bases: $8 + 14 = 22$.'
  - 'Multiply by height and halve: $1/2 \cdot 22 \cdot 5 = 55$.'
  choices:
  - id: a
    text: $110$
    issueSignals:
    - id: one-half-omission
      domains: []
  - id: b
    text: $55$
  - id: c
    text: $27.5$
    issueSignals:
    - id: double-halving-error
      domains: []
  - id: d
    text: $70$
    issueSignals:
    - id: single-base-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The formula for the area of a trapezoid is $A = \frac{1}{2}(b_1 + b_2)h$.

    Substitute the known values:

    $A = \frac{1}{2}(8 + 14) \times 5$

    $A = \frac{1}{2}(22) \times 5$

    $A = 11 \times 5 = 55$.


    Why it works:

    The area of a trapezoid is exactly the same as the area of a rectangle whose width is the *average*
    of the two bases. $\frac{8 + 14}{2} = 11$. A rectangle of $11 \times 5$ has an area of 55.


    Why the other choices fail:

    - $110$ forgets to multiply by $\frac{1}{2}$ ($22 \times 5$).

    - $27.5$ halves the result again ($55/2$).

    - $70$ uses only the bottom base ($14 \times 5 = 70$), assuming it''s a parallelogram.

    '
- id: q002
  type: multipleChoice
  prompt: A rhombus has diagonals of length 12 and 16. What is its area?
  difficultyDimensions:
  - 'Recall the rhombus/kite area formula: $A = 1/2 \cdot d_1 \cdot d_2$.'
  - 'Calculate: $1/2 \cdot 12 \cdot 16 = 96$.'
  choices:
  - id: a
    text: $192$
    issueSignals:
    - id: one-half-omission
      domains: []
  - id: b
    text: $48$
    issueSignals:
    - id: double-halving-error
      domains: []
  - id: c
    text: $96$
  - id: d
    text: $40$
    issueSignals:
    - id: perimeter-confusion
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    The area of any quadrilateral with perpendicular diagonals (including rhombi and kites) is $A = \frac{1}{2}
    d_1 d_2$.

    $A = \frac{1}{2}(12)(16)$

    $A = 6 \times 16 = 96$.


    Why it works:

    If you draw a bounding rectangle tightly around a rhombus, the rectangle''s sides will equal the rhombus''s
    diagonals ($12 \times 16$). The rhombus takes up exactly half the space inside that bounding rectangle.


    Why the other choices fail:

    - $192$ forgets the $\frac{1}{2}$ ($12 \times 16$).

    - $48$ is the area of just half the rhombus ($\frac{1}{2} \times 96$).

    - $40$ is the perimeter of this rhombus (side length is 10, $10 \times 4 = 40$).

    '
- id: q003
  type: multipleChoice
  prompt: A large square with side length 10 has a smaller square with side length 4 completely removed
    from its interior. What is the area of the remaining shaded region?
  difficultyDimensions:
  - 'Calculate area of large square: $10^2 = 100$.'
  - 'Calculate area of small square: $4^2 = 16$.'
  - 'Subtract: $100 - 16 = 84$.'
  choices:
  - id: a
    text: $60$
    issueSignals:
    - id: linear-subtraction-error
      domains: []
  - id: b
    text: $84$
  - id: c
    text: $96$
    issueSignals:
    - id: linear-area-error
      domains: []
  - id: d
    text: $36$
    issueSignals:
    - id: linear-subtraction-squared
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    To find the area of a region with a hole in it, find the total area and subtract the area of the hole.

    Area of large square = $10^2 = 100$.

    Area of small square hole = $4^2 = 16$.

    Remaining area = $100 - 16 = 84$.


    Why it works:

    Areas are strictly additive (and subtractive). You cannot simply subtract the side lengths first.


    Why the other choices fail:

    - $60$ comes from subtracting the perimeters ($40 - 16 = 24$), wait no, $10 \times (10-4) = 60$.

    - $96$ comes from subtracting the side lengths first ($10 - 4 = 6$), and assuming the area is $100
    - 4 = 96$.

    - $36$ comes from subtracting the side lengths first ($10 - 4 = 6$) and then squaring the result ($6^2
    = 36$).

    '
- id: q004
  type: multipleChoice
  prompt: Two similar hexagons have a scale factor (ratio of corresponding sides) of $3:5$. If the area
    of the smaller hexagon is $45$, what is the area of the larger hexagon?
  difficultyDimensions:
  - 'Recognize that the area ratio is the square of the linear ratio: $3^2 : 5^2 = 9 : 25$.'
  - 'Set up proportion: $45 / x = 9 / 25$.'
  - 'Solve for $x$: $9x = 1125 \implies x = 125$.'
  choices:
  - id: a
    text: $75$
    issueSignals:
    - id: linear-scaling-error
      domains: []
  - id: b
    text: $125$
  - id: c
    text: $225$
    issueSignals:
    - id: arithmetic-error
      domains: []
  - id: d
    text: $15$
    issueSignals:
    - id: inverted-ratio-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The ratio of the sides (linear ratio) is $3:5$.

    The ratio of the areas must be the square of the linear ratio: $3^2 : 5^2 = 9:25$.

    Set up a proportion using the area of the smaller hexagon (45):

    $\frac{9}{25} = \frac{45}{A}$

    Notice that $45$ is exactly $9 \times 5$. Therefore, $A = 25 \times 5 = 125$.


    Why it works:

    Area is a two-dimensional measurement. When you stretch a shape by a factor of $k$, it stretches in
    both the horizontal and vertical directions, multiplying the total area by $k^2$.


    Why the other choices fail:

    - $75$ applies the linear ratio directly to the area ($\frac{45}{3} \times 5 = 75$).

    - $225$ is an arithmetic mistake.

    - $15$ divides by 3 instead of using the ratio correctly.

    '
- id: q005
  type: multipleChoice
  prompt: A kite has one diagonal that is 3 times as long as the other diagonal. If the area of the kite
    is $54$, what is the length of the shorter diagonal?
  difficultyDimensions:
  - Let diagonals be $x$ and $3x$.
  - 'Set up equation: $1/2 \cdot x \cdot 3x = 54$.'
  - 'Simplify: $1.5 x^2 = 54 \implies x^2 = 36$.'
  - 'Solve for $x$: $x = 6$.'
  choices:
  - id: a
    text: $12$
    issueSignals:
    - id: one-half-omission
      domains: []
  - id: b
    text: $18$
    issueSignals:
    - id: longer-diagonal-confusion
      domains: []
  - id: c
    text: $9$
    issueSignals:
    - id: algebra-error
      domains: []
  - id: d
    text: $6$
  answer:
    choiceId: d
  explanation: 'Solution:

    Let the shorter diagonal be $x$ and the longer diagonal be $3x$.

    The area of a kite is $A = \frac{1}{2} d_1 d_2$.

    $54 = \frac{1}{2}(x)(3x)$

    $54 = \frac{3}{2}x^2$

    Multiply both sides by 2:

    $108 = 3x^2$

    Divide by 3:

    $36 = x^2$

    $x = 6$.

    The shorter diagonal is 6.


    Why it works:

    Defining unknowns in terms of a single variable ($x$ and $3x$) allows you to use the area formula
    to solve a simple quadratic.


    Why the other choices fail:

    - $12$ results from forgetting the $\frac{1}{2}$ in the area formula ($x \cdot 3x = 54 \implies 3x^2
    = 54 \implies x^2 = 18$... wait, no, $x \cdot 3x / 2 = 54 \implies$ if they forgot the half, $3x^2=54
    \implies x^2=18$. Wait, if they do $3x^2 = 108$ incorrectly, they might get 12).

    - $18$ is the length of the *longer* diagonal ($3 \times 6$).

    - $9$ might come from $54 / (3+3)$.

    '
- id: q006
  type: multipleChoice
  prompt: What is the area of a regular hexagon with a side length of 4?
  difficultyDimensions:
  - Break hexagon into 6 equilateral triangles.
  - 'Recall equilateral triangle area formula: $s^2\sqrt{3}/4$.'
  - 'Area of one triangle: $4^2\sqrt{3}/4 = 4\sqrt{3}$.'
  - 'Multiply by 6: $24\sqrt{3}$.'
  choices:
  - id: a
    text: $12\sqrt{3}$
    issueSignals:
    - id: division-error
      domains: []
  - id: b
    text: $24$
    issueSignals:
    - id: root-three-omission
      domains: []
  - id: c
    text: $48\sqrt{3}$
    issueSignals:
    - id: formula-error
      domains: []
  - id: d
    text: $24\sqrt{3}$
  answer:
    choiceId: d
  explanation: 'Solution:

    A regular hexagon can be perfectly divided into 6 identical equilateral triangles.

    The side length of these triangles is the same as the side length of the hexagon ($s=4$).

    The area of one equilateral triangle is $\frac{s^2\sqrt{3}}{4}$.

    Area of one triangle $= \frac{4^2\sqrt{3}}{4} = \frac{16\sqrt{3}}{4} = 4\sqrt{3}$.

    Since there are 6 triangles, the total area is:

    $6 \times 4\sqrt{3} = 24\sqrt{3}$.


    Why it works:

    This decomposition method ($6 \times$ equilateral triangles) is by far the most reliable way to find
    the area of a regular hexagon, bypassing the need to memorize the full apothem formula ($1/2 \cdot
    a \cdot p$).


    Why the other choices fail:

    - $12\sqrt{3}$ is the area of exactly half the hexagon (3 triangles).

    - $24$ forgets the $\sqrt{3}$ component entirely.

    - $48\sqrt{3}$ comes from using $s^2\sqrt{3}/2$ or a similar incorrect formula for the triangle.

    '
