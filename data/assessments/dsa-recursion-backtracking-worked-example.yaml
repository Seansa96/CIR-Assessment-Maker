workedExamples:
- id: we001
  title: Trace a Recursion, Backtracking, and Divide-and-Conquer decision
  problem: 'Work through a realistic case: exploring valid configuration combinations. Select an approach, preserve its invariant, and explain the tradeoff.'
  steps:
  - title: Recognize the workload
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: 'Which requirement matters most in this scenario: exploring valid configuration combinations?'
    choices:
    - id: a
      text: The access pattern and bound
    - id: b
      text: The name of the structure
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: The access pattern and bound. The trace follows the module invariant and workload.
    id: step-1
  - title: Protect the invariant
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: What must the update preserve?
    choices:
    - id: a
      text: each recursive path must reach a base case and restore temporary state
    - id: b
      text: Only the output formatting
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: each recursive path must reach a base case and restore temporary state. The trace follows the module invariant and workload.
    id: step-2
  - title: Choose the implementation
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: Which implementation action fits Recursion, Backtracking, and Divide-and-Conquer?
    choices:
    - id: a
      text: generating choices with backtracking
    - id: b
      text: Scan unrelated data repeatedly
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: generating choices with backtracking. The trace follows the module invariant and workload.
    id: step-3
