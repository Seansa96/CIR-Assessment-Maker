items:
  - { id: rwpr1, type: cloze, prompt: 'For constant aligned torque, $W=\tau____$.', answer: { expected: theta, expectedLatex: '\theta', aliases: ['angular displacement'], media: [] }, explanation: 'Solution: Insert $\theta$.\n\nWhy it works: Work is torque times angular displacement.', tags: [work] }
  - { id: rwpr2, type: typed, prompt: 'What formula gives instantaneous rotational power?', answer: { expected: 'tau omega', expectedLatex: '\tau\omega', aliases: ['P=tau omega'], media: [] }, explanation: 'Solution: $P=\tau\omega$.\n\nWhy it works: It is the rotational analogue of force times velocity.', tags: [power] }
  - { id: rwpr3, type: cloze, prompt: 'Rotational kinetic energy is $K=\tfrac12 I____^2$.', answer: { expected: omega, expectedLatex: '\omega', aliases: ['angular velocity'], media: [] }, explanation: 'Solution: Insert $\omega$.\n\nWhy it works: Rotational energy depends on angular-speed squared.', tags: [energy] }
  - { id: rwpr4, type: typed, prompt: 'What unit measures power?', answer: { expected: watt, expectedLatex: 'W', aliases: [watts], media: [] }, explanation: 'Solution: It is the watt.\n\nWhy it works: A watt is one joule per second.', tags: [units] }
  - { id: rwpr5, type: cloze, prompt: 'Net rotational work equals the change in rotational ____ energy.', answer: { expected: kinetic, expectedLatex: '', aliases: [], media: [] }, explanation: 'Solution: Insert kinetic.\n\nWhy it works: This is the rotational work-energy theorem.', tags: [work-energy] }
  - { id: rwpr6, type: typed, prompt: 'What integral gives work from a variable torque?', answer: { expected: 'integral tau d theta', expectedLatex: '\int\tau\,d\theta', aliases: [], media: [] }, explanation: 'Solution: Use $\int\tau\,d\theta$.\n\nWhy it works: It adds differential torque-angle work.', tags: [variable-torque] }
