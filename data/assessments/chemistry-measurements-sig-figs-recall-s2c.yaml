items:
- id: item-1
  type: typed
  prompt: How many significant figures are in 0.02030?
  answer:
    expected: '4'
  explanation: 'Solution: The significant digits are 2, 0, 3, and the final 0.


    Why it works: Zeros between nonzero digits and trailing decimal zeros are significant.'
- id: item-2
  type: typed
  prompt: State the rounding rule for addition and subtraction.
  answer:
    expected: Round to the least number of decimal places.
  explanation: 'Solution: Locate the least precise decimal place before rounding.


    Why it works: Addition/subtraction precision is controlled by decimal place.'
- id: item-3
  type: typed
  prompt: State the rounding rule for multiplication and division.
  answer:
    expected: Round to the fewest significant figures.
  explanation: 'Solution: Count the significant figures in the measured factors.


    Why it works: Products and quotients inherit the least significant-figure count.'
- id: item-4
  type: typed
  prompt: What is density?
  answer:
    expected: mass divided by volume
  explanation: 'Solution: Use $d=m/V$.


    Why it works: Density connects a sample’s mass and volume.'
- id: item-5
  type: typed
  prompt: 'Which is more accurate: 9.99 g or 10.48 g when accepted is 10.50 g?'
  answer:
    expected: 10.48 g
  explanation: 'Solution: 10.48 g is closer to 10.50 g.


    Why it works: Accuracy means closeness to an accepted value.'
- id: item-6
  type: typed
  prompt: Write 4500 with two significant figures in scientific notation.
  answer:
    expected: $4.5\times10^3$
  explanation: 'Solution: $4.5\times10^3$ preserves two significant figures.


    Why it works: Scientific notation makes intended precision explicit.'
- id: item-7
  type: typed
  prompt: What does a trailing zero in 2.300 communicate?
  answer:
    expected: It is significant and indicates measured precision.
  explanation: 'Solution: The digits 2, 3, 0, 0 are significant.


    Why it works: Decimal trailing zeros are meaningful in a measurement.'
- id: item-8
  type: typed
  prompt: What unit commonly expresses liquid density?
  answer:
    expected: $\mathrm{g/mL}$
  explanation: 'Solution: Mass divided by liquid volume is commonly reported as g/mL.


    Why it works: The unit follows directly from $m/V$.'
- id: item-9
  type: typed
  prompt: Is a counted dozen exact or measured?
  answer:
    expected: exact
  explanation: 'Solution: Twelve objects are counted, not read from an instrument.


    Why it works: Counts do not introduce measurement uncertainty.'
- id: item-10
  type: typed
  prompt: What does percent error compare?
  answer:
    expected: The difference from accepted value relative to accepted value.
  explanation: 'Solution: Use $|experimental-accepted|/accepted\times100\%$.


    Why it works: The accepted value provides the reference scale.'
