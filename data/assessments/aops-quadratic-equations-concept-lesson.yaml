      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-quadratic-equations-recognition
    title: Recognition cues
    required: true
    content: 'Look for these triggers: standard form, choose factoring vs formula, substitute to reduce degree. Record the givens, unknown, and any restriction before selecting a method.'
    check:
      id: aops-quadratic-equations-recognition-check
      type: multipleChoice
      prompt: In Quadratic Equations, what should be checked before applying a method?
