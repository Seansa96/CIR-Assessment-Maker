lesson:
  introduction: Learn to solve Quadratic Equations problems by recognizing quadratics, factoring, quadratic formula, substitution, irrational roots and justifying each theorem or transformation.
  sections:
  - id: aops-quadratic-equations-motivation
    title: What the topic helps you notice
    required: true
    content: Quadratic Equations is useful when a problem hides a relationship that is easier to see than to calculate. The important ideas are quadratics, factoring, quadratic formula, substitution, irrational roots.
    check:
      id: aops-quadratic-equations-motivation-check
      type: multipleChoice
      prompt: In Quadratic Equations, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
        text: Whether the diagram looks proportional.
      - id: c
        text: Whether a familiar answer choice appears.
      - id: d
        text: Whether a decimal estimate is convenient.
      answer:
        choiceId: a
      explanation: The theorem or strategy conditions in the stated givens.
  - id: aops-quadratic-equations-definitions
    title: Definitions and theorem conditions
    required: true
    content: State each condition before using it. In this topic, a theorem is a conditional statement, not a pattern-matching shortcut.
    check:
      id: aops-quadratic-equations-definitions-check
      type: multipleChoice
      prompt: In Quadratic Equations, what should be checked before applying a method?
      choices:
      - id: a
        text: The theorem or strategy conditions in the stated givens.
      - id: b
