workedExamples:
  - id: we-atwood-incline-friction
    title: Inclined-Plane Atwood Machine with Kinetic Friction
    problem: |
      A $2.0\text{ kg}$ hanging mass $m_1$ is connected to an $8.0\text{ kg}$ block $m_2$ on a $30^\circ$ incline. The block on the incline slides down the plane. The coefficient of kinetic friction between $m_2$ and the plane is $\mu_k=0.10$.

      Use $g=9.8\text{ m/s}^2$. Find the acceleration and the tension.

      ![Inclined-plane Atwood machine with kinetic friction opposing the motion of the block down the plane](/media/physics/worked-examples/atwood-incline-friction.svg)
    steps:
      - id: step-atwood-incline-friction-direction
        title: Decide the Direction of Friction
        instruction: |
          The block on the incline is sliding down the plane. Kinetic friction always points opposite the relative sliding motion.

          Therefore, friction on $m_2$ points **up the plane**, in the same direction as tension.
        type: multipleChoice
        prompt: In this setup, which direction does kinetic friction act on the inclined block?
        choices:
          - id: a
            text: Up the incline, opposite the block's down-slope motion.
          - id: b
            text: Down the incline, because gravity pulls downward.
          - id: c
            text: Perpendicular to the incline, because friction is a normal force.
        answer:
          choiceId: a
        explanation: |
          Friction does not automatically point uphill or downhill. It points opposite the actual or impending sliding direction.

      - id: step-atwood-incline-friction-size
        title: Compute the Kinetic Friction Force
        instruction: |
          The normal force on the inclined block is:

          $$
          N=m_2g\cos\theta.
          $$

          The kinetic friction force is:

          $$
          f_k=\mu_k N=\mu_k m_2g\cos\theta.
          $$
        type: numericResponse
        prompt: What is $f_k$ in Newtons?
        answer:
          value: 6.79
          tolerance: 0.08
        explanation: |
          Substitute:

          $$
          f_k=(0.10)(8.0)(9.8)\cos(30^\circ)
          \approx 6.79\text{ N}.
          $$

          Related topic: Normal force on an incline. The normal force is $mg\cos\theta$, not $mg$, because the surface is tilted.

      - id: step-atwood-incline-friction-equations
        title: Write Equations Along the Motion
        instruction: |
          Choose positive down the incline for $m_2$ and upward for $m_1$.

          For the inclined block:

          $$
          m_2g\sin\theta - T - f_k = m_2a.
          $$

          For the hanging mass:

          $$
          T-m_1g=m_1a.
          $$
        type: multipleChoice
        prompt: Why are both $T$ and $f_k$ subtracted in the inclined-block equation?
        choices:
          - id: a
            text: Both tension and kinetic friction point up the incline, opposite the chosen positive direction.
          - id: b
            text: Both tension and kinetic friction point down the incline with gravity.
          - id: c
            text: They are subtracted only because all friction forces are negative by definition.
        answer:
          choiceId: a
        explanation: |
          Signs come from direction, not from the name of the force. In this coordinate choice, down the incline is positive, while tension and friction point up the incline.

      - id: step-atwood-incline-friction-acceleration
        title: Add Equations and Solve for Acceleration
        instruction: |
          Add the two equations:

          $$
          m_2g\sin\theta - f_k - m_1g = (m_1+m_2)a.
          $$

          Therefore:

          $$
          a=\frac{m_2g\sin\theta-f_k-m_1g}{m_1+m_2}.
          $$
        type: numericResponse
        prompt: What is the acceleration in $\text{m/s}^2$?
        answer:
          value: 1.28
          tolerance: 0.04
        explanation: |
          Substitute:

          $$
          a=\frac{8.0(9.8)\sin(30^\circ)-6.79-2.0(9.8)}{8.0+2.0}
          $$

          $$
          a=\frac{39.2-6.79-19.6}{10.0}
          \approx 1.28\text{ m/s}^2.
          $$

      - id: step-atwood-incline-friction-tension
        title: Find Tension from the Hanging Mass
        instruction: |
          Use:

          $$
          T-m_1g=m_1a.
          $$
        type: numericResponse
        prompt: What is the tension in Newtons?
        answer:
          value: 22.16
          tolerance: 0.08
        explanation: |
          Solve:

          $$
          T=m_1g+m_1a
          =19.6+2.0(1.28)
          \approx 22.16\text{ N}.
          $$

          Tension is larger than the hanging weight because the hanging mass accelerates upward.

  - id: we-atwood-horizontal-friction
    title: Half-Atwood Machine on a Rough Horizontal Table
    problem: |
      A $5.0\text{ kg}$ hanging mass $m_1$ is connected to an $8.0\text{ kg}$ block $m_2$ on a rough horizontal table. The coefficient of kinetic friction between the table and $m_2$ is $\mu_k=0.20$.

      The hanging mass moves downward, pulling the table block to the right. Use $g=9.8\text{ m/s}^2$.

      Find the acceleration and the tension.

      ![Half-Atwood machine with a rough horizontal table and kinetic friction opposing the table block's motion](/media/physics/worked-examples/atwood-horizontal-friction.svg)
    steps:
      - id: step-atwood-horizontal-friction-normal
        title: Find the Friction Force on the Table Block
        instruction: |
          The table is horizontal, so the normal force on the table block is:

          $$
          N=m_2g.
          $$

          Since the block slides right, kinetic friction points left:

          $$
          f_k=\mu_km_2g.
          $$
        type: numericResponse
        prompt: What is $f_k$ in Newtons?
        answer:
          value: 15.68
          tolerance: 0.05
        explanation: |
          Substitute:

          $$
          f_k=(0.20)(8.0)(9.8)=15.68\text{ N}.
          $$

      - id: step-atwood-horizontal-friction-equations
        title: Write the Equations for Each Mass
        instruction: |
          Use positive downward for $m_1$ and positive rightward for $m_2$.

          Hanging mass:

          $$
          m_1g-T=m_1a.
          $$

          Table block:

          $$
          T-f_k=m_2a.
          $$
        type: multipleChoice
        prompt: Which equation belongs to the rough-table block?
        choices:
          - id: a
            text: '$T-f_k=m_2a$'
          - id: b
            text: '$T+f_k=m_2a$'
          - id: c
            text: '$m_2g-T-f_k=m_2a$'
        answer:
          choiceId: a
        explanation: |
          Tension pulls the table block right, while kinetic friction points left. Weight and normal force cancel vertically and do not belong in the horizontal equation.

      - id: step-atwood-horizontal-friction-acceleration
        title: Add the Equations
        instruction: |
          Add the equations so tension cancels:

          $$
          m_1g-f_k=(m_1+m_2)a.
          $$

          Therefore:

          $$
          a=\frac{m_1g-f_k}{m_1+m_2}.
          $$
        type: numericResponse
        prompt: What is the acceleration in $\text{m/s}^2$?
        answer:
          value: 2.56
          tolerance: 0.04
        explanation: |
          Substitute:

          $$
          a=\frac{5.0(9.8)-15.68}{5.0+8.0}
          =\frac{33.32}{13.0}
          \approx 2.56\text{ m/s}^2.
          $$

          Related topic: Half-Atwood with friction. Friction reduces the net driving force supplied by the hanging mass.

      - id: step-atwood-horizontal-friction-tension
        title: Solve for Tension
        instruction: |
          Use the table-block equation:

          $$
          T-f_k=m_2a.
          $$
        type: numericResponse
        prompt: What is the tension in Newtons?
        answer:
          value: 36.18
          tolerance: 0.08
        explanation: |
          Solve:

          $$
          T=m_2a+f_k
          =8.0(2.56)+15.68
          \approx 36.18\text{ N}.
          $$

          You can check using the hanging mass:

          $$
          T=m_1g-m_1a
          \approx 49.0-5.0(2.56)
          \approx 36.18\text{ N}.
          $$

      - id: step-atwood-horizontal-friction-common-trap
        title: Avoid the Common Friction Trap
        instruction: |
          A common mistake is to add friction to the driving force. Friction opposes the table block's motion, so it reduces the system's net driving force.
        type: multipleChoice
        prompt: If $\mu_k$ were increased while all masses stayed the same, what would happen to the acceleration?
        choices:
          - id: a
            text: It would decrease because friction removes more of the hanging mass's driving force.
          - id: b
            text: It would increase because friction helps the rope pull harder.
          - id: c
            text: It would stay the same because tension cancels in the system equation.
        answer:
          choiceId: a
        explanation: |
          In the system equation $m_1g-f_k=(m_1+m_2)a$, increasing $f_k$ makes the numerator smaller, so the acceleration decreases.
