workedExamples:
  - id: we-polarity-co2-h2o
    title: 'CO₂ vs H₂O — Geometry Determines Net Dipole'
    problem: |
      Both $CO_2$ and $H_2O$ contain polar bonds. Determine whether each molecule is polar or nonpolar, and explain why the two molecules behave differently despite both having polar bonds.
    steps:
      - id: s1-co2-geometry
        title: 'CO₂ — Step 1: Determine geometry'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the CO₂ geometry analysis and continue.
        instruction: |
          **Lewis structure:** O=C=O (two C=O double bonds; C has no lone pairs)

          **Electron domains on C:** 2 (each double bond = 1 domain)

          **AXₙEₘ:** AX₂E₀ → **Linear geometry**, 180° bond angle.

      - id: s2-co2-polarity
        title: 'CO₂ — Step 2: Assess bond dipoles and net dipole'
        type: multipleChoice
        answer:
          choiceId: b
        prompt: |
          Each C=O bond is polar ($\Delta EN = 3.5 - 2.5 = 1.0$). In a linear $O=C=O$ molecule, the two C=O bond dipoles:
        choices:
          - id: a
            text: Both point toward the same oxygen, giving a large net dipole
          - id: b
            text: Point in exactly opposite directions (180° apart) and cancel, giving zero net dipole
          - id: c
            text: Both point toward the carbon, making carbon the negative end
          - id: d
            text: Are perpendicular to each other, resulting in a net dipole at 90°
        instruction: |
          In linear $CO_2$, the two C=O bond dipoles point in exactly **opposite directions** — one to the left, one to the right. As vectors, they cancel:

          $$\vec{\mu}_{net} = \vec{\mu}_{C=O(left)} + \vec{\mu}_{C=O(right)} = 0$$

          $CO_2$ is **nonpolar** ($\mu = 0$ D) despite its polar bonds. This is why $CO_2$ is a gas at room temperature and does not dissolve readily in water.

      - id: s3-h2o-geometry
        title: 'H₂O — Step 1: Determine geometry'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the H₂O geometry analysis and continue.
        instruction: |
          **Lewis structure:** H—O—H, with 2 lone pairs on O.

          **Electron domains on O:** 4 (2 bonds + 2 lone pairs)

          **AXₙEₘ:** AX₂E₂ → **Bent geometry**, bond angle ~104.5°.

      - id: s4-h2o-polarity
        title: 'H₂O — Step 2: Assess bond dipoles and net dipole'
        type: multipleChoice
        answer:
          choiceId: a
        prompt: |
          The two O—H bond dipoles in water both point toward O ($\delta^-$ on O, $\delta^+$ on H). In the bent geometry, the net dipole moment is:
        choices:
          - id: a
            text: Nonzero, pointing toward O, because the two bond dipoles reinforce each other
          - id: b
            text: Zero, because two identical bonds always cancel
          - id: c
            text: Nonzero, pointing toward H, because H is positive
          - id: d
            text: Zero, because the two lone pairs cancel the bond dipoles
        instruction: |
          In the **bent** geometry, the two O—H bond dipoles both point toward the same side (toward O). Because they are at a ~104.5° angle rather than 180°, they do **not** cancel — their vector sum points toward the oxygen:

          $$\vec{\mu}_{net} = \vec{\mu}_{O-H1} + \vec{\mu}_{O-H2} \neq 0$$

          $H_2O$ has $\mu = 1.85$ D — one of the largest dipole moments of any small molecule. This polarity drives hydrogen bonding and water's exceptional solvent properties.

  - id: we-polarity-substituted
    title: 'CHCl₃ vs CCl₄ — Substitution Breaks Symmetry'
    problem: |
      $CCl_4$ (carbon tetrachloride) and $CHCl_3$ (chloroform) have the same tetrahedral carbon framework. One is polar and one is not. Predict which is polar and explain why.
    steps:
      - id: s5-ccl4
        title: 'CCl₄ — Symmetry makes it nonpolar'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Review the CCl₄ polarity analysis and continue.
        instruction: |
          **Geometry:** AX₄E₀ → perfect tetrahedral (109.5°). All four substituents are identical (Cl).

          **Bond polarity:** Each C—Cl bond is polar ($\Delta EN = 3.2 - 2.5 = 0.7$).

          **Net dipole:** Four C—Cl bond dipoles point outward from C toward each Cl, arranged symmetrically in 3D. As vectors, they sum to **zero**.

          $$CCl_4 \text{ is nonpolar} \quad (\mu = 0 \text{ D})$$

          $CCl_4$ was once widely used as a nonpolar solvent and dry-cleaning agent (though it is toxic and no longer used for this purpose).

      - id: s6-chcl3
        title: 'CHCl₃ — Substitution breaks the symmetry'
        type: multipleChoice
        answer:
          choiceId: c
        prompt: |
          In $CHCl_3$, one Cl of $CCl_4$ is replaced by H. The C—H bond ($\Delta EN \approx 0.4$) is much less polar than C—Cl ($\Delta EN \approx 0.7$). What is the result?
        choices:
          - id: a
            text: '$CHCl_3$ is nonpolar because the tetrahedral geometry still makes dipoles cancel'
          - id: b
            text: '$CHCl_3$ is nonpolar because C—H bonds have no dipole'
          - id: c
            text: '$CHCl_3$ is polar because replacing one Cl with H breaks the perfect symmetry, so the bond dipoles no longer cancel'
          - id: d
            text: '$CHCl_3$ is polar only in solution, not in the gas phase'
        instruction: |
          **Geometry:** Still tetrahedral (109.5°).

          **Bond dipoles:** Three large C—Cl dipoles + one small C—H dipole. The three C—Cl dipoles point toward the Cl atoms; the one C—H dipole points toward H (but is smaller).

          The loss of perfect symmetry means the vector sum is **not zero**:

          $$CHCl_3 \text{ is polar} \quad (\mu = 1.04 \text{ D})$$

          The net dipole points roughly from H toward the Cl side. Chloroform is used as a solvent for many organic compounds precisely because of this intermediate polarity.

      - id: s7-polarity-rule
        title: The Symmetry Rule — Final Summary
        type: multipleChoice
        answer:
          choiceId: b
        prompt: |
          Which statement best summarizes when a molecule with polar bonds is **nonpolar overall**?
        choices:
          - id: a
            text: When all bond angles are equal to 109.5°
          - id: b
            text: When the molecular geometry is symmetric enough that all bond dipoles cancel as vectors
          - id: c
            text: When the central atom has a formal charge of zero
          - id: d
            text: When the molecule has an even number of bonds
        instruction: |
          A molecule with polar bonds is nonpolar if and only if its geometry causes all bond dipole vectors to **cancel exactly**. This requires symmetric arrangements of identical bonds:

          - Linear with 2 identical bonds ($CO_2$) ✓
          - Trigonal planar with 3 identical bonds ($BF_3$) ✓
          - Tetrahedral with 4 identical bonds ($CCl_4$) ✓
          - Octahedral with 6 identical bonds ($SF_6$) ✓

          Any asymmetry — a different substituent, a lone pair on the central atom, an asymmetric geometry — will break the cancellation and produce a polar molecule.
