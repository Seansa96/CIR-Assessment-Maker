- id: example-2
  title: Compare CCl4 and CHCl3
  problem: Determine how substitution changes a tetrahedral vector sum.
  steps:
  - id: s5-ccl4
    title: Step 1
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 1 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Four equal C-Cl vectors in tetrahedral CCl4 cancel by symmetry.
    explanation: 'Solution: Four equal C-Cl vectors in tetrahedral CCl4 cancel by symmetry. Why it works: This step follows
      the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: s6-chcl3
    title: Step 2
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 2 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - Replacing one chlorine with hydrogen makes the bond-vector set unequal.
    explanation: 'Solution: Replacing one chlorine with hydrogen makes the bond-vector set unequal. Why it works: This step
      follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
  - id: s7-polarity-rule
    title: Step 3
    instruction: Record the relevant electron, charge, particle, or evidence decision before continuing.
    type: freeResponse
    prompt: Explain step 3 of the analysis in your own words.
    answer:
      gradingMode: selfCheck
      keyPoints:
      - The remaining vectors in CHCl3 do not cancel, so the molecule is polar.
    explanation: 'Solution: The remaining vectors in CHCl3 do not cancel, so the molecule is polar. Why it works: This step
      follows the topic''s accounting rules and supplies a separate check before the final conclusion.'
