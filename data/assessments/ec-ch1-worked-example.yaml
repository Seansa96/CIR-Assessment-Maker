workedExamples:
- id: we1
  title: Calculating Energy from Voltage and Current
  steps:
  - id: step1
    prompt: Find the expression for power.
    instruction: $p = vi = (10 + 2t)(4t) = 40t + 8t^2\text{ W}$
    title: Find the expression for power.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  - id: step2
    prompt: Integrate power to find energy.
    instruction: $w = \int_0^2 p \, dt = \int_0^2 (40t + 8t^2) \, dt = [20t^2 + \frac{8}{3}t^3]_0^2
      = 20(4) + \frac{8}{3}(8) = 80 + 21.33 = 101.33\text{ J}$
    title: Integrate power to find energy.
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: The voltage and current at the terminals of an automobile battery during
    a charge cycle are $v = (10 + 2t)\text{ V}$ and $i = 4t\text{ A}$ for $t \ge 0$.
    Find the total energy transferred to the battery between $t=0$ and $t=2$ seconds.
