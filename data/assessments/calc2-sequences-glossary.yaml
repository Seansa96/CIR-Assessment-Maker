glossary:
  introduction: |
    Study the core vocabulary and expression forms from Intro to Sequences. The recall portion asks you to retrieve terms, formulas, and decision rules before moving into series convergence.
  sections:
    - id: notation-and-definition
      title: Sequence Notation and Definitions
      required: true
      content: |
        A sequence is an ordered list of terms. The notation $a_n$ names the term in position $n$, and the notation $\{a_n\}$ names the full sequence.
      entries:
        - id: sequence
          term: Sequence
          definition: |
            An ordered list of numbers written in a definite order, usually indexed by positive integers.
          notation: '$\{a_1,a_2,a_3,\dots\}$'
          examples:
            - '$1,4,7,10,\dots$ is a sequence.'
          aliases: []
          tags: [sequence, sequence-notation]
          drills:
            - id: sequence-definition-flashcard
              type: flashcard
              prompt: What is a sequence?
              answer:
                expected: An ordered list of numbers written in a definite order.
              explanation: A sequence is discrete; it is indexed by positions such as $1,2,3,\dots$.
              tags: [sequence, sequence-notation]

        - id: term-index
          term: Index
          definition: |
            The integer subscript that identifies a term's position in the sequence.
          notation: '$a_n$'
          examples:
            - In $a_5$, the index is $5$.
          aliases: [subscript]
          tags: [index, sequence-notation]
          drills:
            - id: index-cloze
              type: cloze
              prompt: 'Complete the sentence: In $a_n$, the value $n$ is the ____ of the term.'
              answer:
                expected: index
                aliases: [subscript]
              explanation: The index tells which position in the sequence is being referenced.
              tags: [index, sequence-notation]

        - id: general-term
          term: General Term
          definition: |
            A formula for $a_n$ that describes the term in position $n$.
          notation: '$a_n=f(n)$'
          examples:
            - '$a_n=3n-2$ has first terms $1,4,7,\dots$.'
          aliases: [nth term]
          tags: [general-term, explicit-formula]
          drills:
            - id: general-term-typed
              type: typed
              prompt: What name is commonly used for a formula that gives $a_n$ in terms of $n$?
              answer:
                expected: general term
                aliases: [nth term, explicit formula]
              explanation: The general term lets you generate any term by substituting the index.
              tags: [general-term, explicit-formula]

        - id: explicit-formula
          term: Explicit Formula
          definition: |
            A formula that gives $a_n$ directly from $n$, without needing previous terms.
          notation: '$a_n=3n-2$'
          examples:
            - '$a_{10}=3(10)-2=28$.'
          aliases: []
          tags: [explicit-formula, sequence-generation]
          drills:
            - id: explicit-formula-recognition
              type: recognition
              prompt: Which formula is explicit?
              choices:
                - id: a
                  text: '$a_n=3n-2$'
                - id: b
                  text: '$a_n=a_{n-1}+3$'
                - id: c
                  text: '$a_1=5$ only'
                - id: d
                  text: '$S_n=a_1+\dots+a_n$'
              answer:
                choiceId: a
                expected: '$a_n=3n-2$'
              explanation: An explicit formula gives $a_n$ directly from $n$.
              tags: [explicit-formula, sequence-generation]

        - id: recursive-formula
          term: Recursive Formula
          definition: |
            A formula that defines each term using one or more previous terms, plus an initial term.
          notation: '$a_1=1,\ a_n=2a_{n-1}$'
          examples:
            - '$1,2,4,8,\dots$ can be defined by $a_1=1,\ a_n=2a_{n-1}$.'
          aliases: [recursion]
          tags: [recursive-formula, sequence-generation]
          drills:
            - id: recursive-formula-cloze
              type: cloze
              prompt: 'A formula such as $a_n=2a_{n-1}$ defines a term using a ____ term.'
              answer:
                expected: previous
                aliases: [prior, earlier]
              explanation: Recursive rules need earlier terms to produce later ones.
              tags: [recursive-formula, sequence-generation]

    - id: convergence-and-patterns
      title: Convergence and Common Patterns
      required: true
      content: |
        Convergence asks whether the terms approach one real number as $n$ grows. Some sequences settle, some grow without bound, and some oscillate forever.
      entries:
        - id: sequence-convergence
          term: Convergent Sequence
          definition: |
            A sequence whose terms approach a specific real number $L$ as $n\to\infty$.
          notation: '$\lim_{n\to\infty}a_n=L$'
          examples:
            - '$\frac{1}{n}\to0$.'
          aliases: [converges]
          tags: [sequence-convergence, sequence-limits]
          drills:
            - id: convergence-symbolic
              type: symbolic
              prompt: Write the notation that says the sequence $a_n$ converges to $L$.
              answer:
                expectedLatex: '\lim_{n\to\infty}a_n=L'
                aliases:
                  - 'lim a_n = L'
              explanation: This notation says the terms approach $L$ as the index grows without bound.
              tags: [sequence-convergence, sequence-limits]

        - id: divergent-sequence
          term: Divergent Sequence
          definition: |
            A sequence that does not approach one real number.
          notation: '$\lim_{n\to\infty}a_n$ does not exist'
          examples:
            - '$3n+2$ diverges to $+\infty$.'
            - '$\sin(n\pi/2)$ diverges by oscillation.'
          aliases: [diverges]
          tags: [divergence, sequence-limits]
          drills:
            - id: divergent-sequence-recognition
              type: recognition
              prompt: Which behavior makes a sequence divergent?
              choices:
                - id: a
                  text: The terms approach $0$.
                - id: b
                  text: The terms approach one fixed real number.
                - id: c
                  text: The terms fail to approach one real number.
                - id: d
                  text: The terms are all fractions.
              answer:
                choiceId: c
                expected: The terms fail to approach one real number.
              explanation: Divergence includes unbounded growth, unbounded decrease, or persistent oscillation.
              tags: [divergence, sequence-limits]

        - id: continuous-function-sequence-theorem
          term: Continuous Function Limit Theorem for Sequences
          definition: |
            If $f(n)=a_n$ for integer $n$ and $\lim_{x\to\infty}f(x)=L$, then $\lim_{n\to\infty}a_n=L$.
          notation: '$f(n)=a_n,\ \lim_{x\to\infty}f(x)=L\Rightarrow\lim_{n\to\infty}a_n=L$'
          examples:
            - Treat $\frac{4n-3}{3n+4}$ like a rational function limit.
          aliases: [sequence limit theorem]
          tags: [continuous-limit-method, sequence-limits]
          drills:
            - id: continuous-function-theorem-flashcard
              type: flashcard
              prompt: Why can ordinary function limit techniques help evaluate many sequence limits?
              answer:
                expected: If a continuous function agrees with the sequence at integer inputs and has a limit as x approaches infinity, then the sequence has the same limit.
              explanation: This lets you use rational limits, logarithm laws, and sometimes L'Hospital's Rule on sequence expressions.
              tags: [continuous-limit-method, sequence-limits]

        - id: oscillating-sequence
          term: Oscillating Sequence
          definition: |
            A sequence whose terms keep moving among different values instead of approaching one value.
          notation: '$\sin(n\pi/2)$'
          examples:
            - '$\sin(n\pi/2)$ cycles through values such as $1,0,-1,0,\dots$.'
          aliases: [cycles]
          tags: [oscillation, divergence]
          drills:
            - id: oscillating-sequence-cloze
              type: cloze
              prompt: 'A sequence that cycles among different values instead of approaching one value often diverges by ____.'
              answer:
                expected: oscillation
                aliases: [oscillating]
              explanation: Oscillation prevents the sequence from settling to a single limit.
              tags: [oscillation, divergence]

        - id: factorial-growth
          term: Factorial Growth
          definition: |
            Growth involving $n!$, which eventually outpaces any fixed-base exponential $c^n$.
          notation: '$n!=n(n-1)(n-2)\cdots1$'
          examples:
            - '$\frac{(-3)^n}{n!}\to0$.'
          aliases: [factorial]
          tags: [factorial-growth, growth-rates]
          drills:
            - id: factorial-growth-recognition
              type: recognition
              prompt: Which grows faster eventually?
              choices:
                - id: a
                  text: '$n!$'
                - id: b
                  text: '$3^n$'
                - id: c
                  text: '$n$'
                - id: d
                  text: '$\ln n$'
              answer:
                choiceId: a
                expected: '$n!$'
              explanation: Factorial growth eventually beats fixed-base exponential, polynomial, and logarithmic growth.
              tags: [factorial-growth, growth-rates]

        - id: exponential-sequence
          term: Exponential Sequence
          definition: |
            A sequence of the form $r^n$ or a constant multiple of $r^n$.
          notation: '$a_n=r^n$'
          examples:
            - '$(0.2)^n\to0$ because $|0.2|<1$.'
            - '$(-1.3)^n$ diverges because $|-1.3|>1$.'
          aliases: []
          tags: [exponential-sequence, growth-rates]
          drills:
            - id: exponential-sequence-cloze
              type: cloze
              prompt: 'For $a_n=r^n$, the sequence converges to $0$ when $|r|$ is less than ____.'
              answer:
                expected: 1
                aliases: [one]
              explanation: If $|r|<1$, repeated multiplication shrinks the magnitude toward $0$.
              tags: [exponential-sequence, growth-rates]

    - id: monotonicity-boundedness
      title: Monotonicity and Boundedness
      required: true
      content: |
        Monotonicity describes whether the terms move consistently up or down. Boundedness describes whether all terms stay inside fixed upper and lower limits.
      entries:
        - id: increasing-sequence
          term: Increasing Sequence
          definition: |
            A sequence satisfying $a_n<a_{n+1}$ for all relevant $n$.
          notation: '$a_n<a_{n+1}$'
          examples:
            - '$3n+2$ is increasing.'
          aliases: []
          tags: [increasing-sequence, monotonicity]
          drills:
            - id: increasing-sequence-cloze
              type: cloze
              prompt: 'Complete the condition for increasing: $a_n\ \_\_\_\_ \ a_{n+1}$.'
              answer:
                expected: <
                aliases: [less than]
              explanation: Each next term must be larger than the current term.
              tags: [increasing-sequence, monotonicity]

        - id: decreasing-sequence
          term: Decreasing Sequence
          definition: |
            A sequence satisfying $a_n>a_{n+1}$ for all relevant $n$.
          notation: '$a_n>a_{n+1}$'
          examples:
            - '$\frac{1}{5n}$ is decreasing.'
          aliases: []
          tags: [decreasing-sequence, monotonicity]
          drills:
            - id: decreasing-sequence-typed
              type: typed
              prompt: What term describes a sequence where each next term is smaller than the previous term?
              answer:
                expected: decreasing
                aliases: [decreasing sequence]
              explanation: Decreasing means $a_n>a_{n+1}$.
              tags: [decreasing-sequence, monotonicity]

        - id: monotonic-sequence
          term: Monotonic Sequence
          definition: |
            A sequence that is either increasing throughout or decreasing throughout.
          notation: increasing or decreasing
          examples:
            - '$\frac{1}{5n}$ is monotonic because it decreases.'
          aliases: [monotone]
          tags: [monotonicity]
          drills:
            - id: monotonic-sequence-flashcard
              type: flashcard
              prompt: What does monotonic mean for a sequence?
              answer:
                expected: It is increasing throughout or decreasing throughout.
              explanation: A sequence that rises and falls is not monotonic.
              tags: [monotonicity]

        - id: bounded-above
          term: Bounded Above
          definition: |
            A sequence is bounded above if there is a number $M$ such that $a_n\le M$ for all $n$.
          notation: '$a_n\le M$'
          examples:
            - '$\sin(n\pi/2)$ is bounded above by $1$.'
          aliases: [upper bound]
          tags: [bounded-above, boundedness]
          drills:
            - id: bounded-above-cloze
              type: cloze
              prompt: 'A sequence is bounded above if $a_n\le ____$ for all $n$.'
              answer:
                expected: M
                aliases: [some number M, upper bound]
              explanation: The value $M$ is an upper bound for every term.
              tags: [bounded-above, boundedness]

        - id: bounded-below
          term: Bounded Below
          definition: |
            A sequence is bounded below if there is a number $m$ such that $a_n\ge m$ for all $n$.
          notation: '$a_n\ge m$'
          examples:
            - '$\frac{1}{5n}$ is bounded below by $0$.'
          aliases: [lower bound]
          tags: [bounded-below, boundedness]
          drills:
            - id: bounded-below-recognition
              type: recognition
              prompt: Which statement says a sequence is bounded below?
              choices:
                - id: a
                  text: '$a_n\le M$ for all $n$'
                - id: b
                  text: '$a_n\ge m$ for all $n$'
                - id: c
                  text: '$a_n<a_{n+1}$ for all $n$'
                - id: d
                  text: '$a_n$ has no limit'
              answer:
                choiceId: b
                expected: '$a_n\ge m$ for all $n$'
              explanation: A lower bound is a floor that no term goes below.
              tags: [bounded-below, boundedness]

        - id: bounded-sequence
          term: Bounded Sequence
          definition: |
            A sequence that is both bounded above and bounded below.
          notation: '$m\le a_n\le M$'
          examples:
            - '$\sin(n\pi/2)$ is bounded because $-1\le a_n\le1$.'
          aliases: []
          tags: [bounded-sequence, boundedness]
          drills:
            - id: bounded-sequence-symbolic
              type: symbolic
              prompt: Write a compact inequality showing a sequence $a_n$ is bounded between lower bound $m$ and upper bound $M$.
              answer:
                expectedLatex: 'm\le a_n\le M'
                aliases:
                  - 'm <= a_n <= M'
              explanation: Bounded means every term stays between a fixed lower and upper bound.
              tags: [bounded-sequence, boundedness]
