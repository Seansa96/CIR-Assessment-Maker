questions:
  - id: fric-easy-q01
    title: Kinetic Friction Calculation — Horizontal Surface
    type: numericResponse
    prompt: |
      A $6.0\text{ kg}$ block slides on a horizontal surface. The coefficient of kinetic friction is $\mu_k = 0.35$. Using $g = 9.8\text{ m/s}^2$, calculate the magnitude of the kinetic friction force in Newtons. Round to one decimal place.
    answer:
      value: 20.6
      tolerance: 0.5
    explanation: |
      On a horizontal surface with no vertical forces other than gravity, the normal force is $N = mg$.
      $$N = (6.0\text{ kg})(9.8\text{ m/s}^2) = 58.8\text{ N}$$
      $$f_k = \mu_k N = 0.35 \times 58.8 = 20.58\text{ N} \approx 20.6\text{ N}$$

  - id: fric-easy-q02
    title: Maximum Static Friction Calculation
    type: numericResponse
    prompt: |
      A $12\text{ kg}$ box rests on a flat floor. The coefficient of static friction is $\mu_s = 0.50$. Using $g = 9.8\text{ m/s}^2$, what is the **maximum** static friction force in Newtons that must be overcome to start the box moving? Round to one decimal place.
    answer:
      value: 58.8
      tolerance: 0.5
    explanation: |
      The maximum static friction is $f_{s,\max} = \mu_s N$.
      $$N = mg = (12)(9.8) = 117.6\text{ N}$$
      $$f_{s,\max} = 0.50 \times 117.6 = 58.8\text{ N}$$

  - id: fric-easy-q03
    title: Static vs Kinetic Coefficient
    type: multipleChoice
    prompt: |
      For two given surfaces in contact, how does the coefficient of kinetic friction ($\mu_k$) generally compare to the coefficient of static friction ($\mu_s$)?
    choices:
      - id: a
        text: $\mu_k$ is usually greater than $\mu_s$
      - id: b
        text: $\mu_k$ is usually less than $\mu_s$
      - id: c
        text: They are exactly equal for all materials
      - id: d
        text: There is no general relationship between them
    answer:
      choiceId: b
    explanation: |
      It is generally easier to keep an object moving than to start it moving. This means the maximum static friction force is greater than the kinetic friction force, so $\mu_s > \mu_k$.

  - id: fric-easy-q04
    title: Determining the Coefficient of Kinetic Friction
    type: numericResponse
    prompt: |
      A student pushes a $15\text{ kg}$ desk across a horizontal floor at a **constant velocity**. The student pushes horizontally with a force of $45\text{ N}$. Using $g = 9.8\text{ m/s}^2$, what is the coefficient of kinetic friction ($\mu_k$)? Round to two decimal places.
    answer:
      value: 0.31
      tolerance: 0.05
    explanation: |
      Constant velocity means net force is zero, so the applied push equals kinetic friction: $F_\text{push} = f_k = 45\text{ N}$.
      The normal force is $N = mg = 15(9.8) = 147\text{ N}$.
      $$f_k = \mu_k N \implies \mu_k = \frac{f_k}{N} = \frac{45}{147} \approx 0.306$$

  - id: fric-easy-q05
    title: Applied Force Less Than Maximum Static Friction
    type: numericResponse
    prompt: |
      A $10\text{ kg}$ block is at rest on a floor ($\mu_s = 0.40$). You push horizontally with a force of $25\text{ N}$. Using $g = 9.8\text{ m/s}^2$, what is the magnitude of the friction force acting on the block?
    answer:
      value: 25.0
      tolerance: 0.5
    explanation: |
      First, check the maximum static friction: 
      $$f_{s,\max} = \mu_s mg = 0.40(10)(9.8) = 39.2\text{ N}$$
      Since the push ($25\text{ N}$) is less than $39.2\text{ N}$, the block doesn't move. The static friction force adjusts exactly to match the applied force.
      Therefore, $f_s = 25\text{ N}$.

  - id: fric-easy-q06
    title: Direction of Kinetic Friction
    type: multipleChoice
    prompt: |
      A book is sliding across a table to the **East**. In which direction does the kinetic friction force act on the book?
    choices:
      - id: a
        text: East
      - id: b
        text: West
      - id: c
        text: Up
      - id: d
        text: Down
    answer:
      choiceId: b
    explanation: |
      Kinetic friction always acts in the direction opposite to the object's velocity relative to the surface. Since the book is moving East, friction acts to the West.

  - id: fric-easy-q07
    title: Friction and Normal Force (Upward Pull)
    type: numericResponse
    prompt: |
      A $20\text{ kg}$ box is on a floor ($\mu_k = 0.30$). You attach a rope and pull with a force of $50\text{ N}$ directed **straight up** (vertically), but the box doesn't lift off the floor. As you push the box horizontally, what is the kinetic friction force? Use $g = 9.8\text{ m/s}^2$. Round to one decimal place.
    answer:
      value: 43.8
      tolerance: 1.0
    explanation: |
      The upward pull reduces the normal force. Vertical equilibrium:
      $$N + F_\text{up} = mg \implies N = mg - F_\text{up}$$
      $$N = 20(9.8) - 50 = 196 - 50 = 146\text{ N}$$
      $$f_k = \mu_k N = 0.30(146) = 43.8\text{ N}$$

  - id: fric-easy-q08
    title: Friction and Surface Area
    type: multipleChoice
    prompt: |
      A rectangular brick is dragged across a rough surface, first on its large flat face, and then on its smaller side. Assuming the surface and the brick's mass remain unchanged, how does the kinetic friction force compare in the two cases? (Assume the classical model of dry friction).
    choices:
      - id: a
        text: Friction is greater when sliding on the large flat face.
      - id: b
        text: Friction is greater when sliding on the smaller side.
      - id: c
        text: Friction is the same in both cases.
      - id: d
        text: Friction only exists when sliding on the large flat face.
    answer:
      choiceId: c
    explanation: |
      According to the standard model of dry friction ($f_k = \mu_k N$), the kinetic friction force depends only on the coefficient of friction and the normal force. It is **independent of the apparent area of contact**.

  - id: fric-easy-q09
    title: Sliding to a Stop
    type: numericResponse
    prompt: |
      A hockey puck slides on ice ($\mu_k = 0.05$) and slows down. Using $g = 9.8\text{ m/s}^2$, what is the magnitude of its acceleration (deceleration) in m/s²? Round to two decimal places.
    answer:
      value: 0.49
      tolerance: 0.05
    explanation: |
      The only horizontal force is kinetic friction.
      $$F_\text{net} = f_k = \mu_k mg$$
      Using Newton's Second Law: $ma = \mu_k mg \implies a = \mu_k g$
      $$a = 0.05 \times 9.8 = 0.49\text{ m/s}^2$$
      (The acceleration vector points opposite to velocity).

  - id: fric-easy-q10
    title: Friction on an Incline (Normal Force)
    type: numericResponse
    prompt: |
      A $5.0\text{ kg}$ block is at rest on a ramp angled at $20°$ above the horizontal. Using $g = 9.8\text{ m/s}^2$, what is the normal force on the block? Round to one decimal place.
    answer:
      value: 46.0
      tolerance: 0.5
    explanation: |
      On an incline, the component of gravity perpendicular to the surface is $mg \cos\theta$.
      $$N = mg \cos\theta = 5.0(9.8)\cos(20°) = 49(0.9397) \approx 46.0\text{ N}$$

  - id: fric-easy-q11
    title: Independence of Velocity
    type: multipleChoice
    prompt: |
      In the simple model of kinetic friction, how does the friction force change as the object's sliding speed increases?
    choices:
      - id: a
        text: It increases linearly with speed.
      - id: b
        text: It increases proportionally to the square of the speed.
      - id: c
        text: It decreases as speed increases.
      - id: d
        text: It is approximately independent of the sliding speed.
    answer:
      choiceId: d
    explanation: |
      In the standard Coulomb model of dry friction, $f_k = \mu_k N$, and $\mu_k$ is considered a constant. The kinetic friction force does not depend on the object's velocity. (In contrast, fluid drag/air resistance does depend heavily on speed).

  - id: fric-easy-q12
    title: Incline Sliding — Kinetic Friction
    type: numericResponse
    prompt: |
      A $2.5\text{ kg}$ block slides down a ramp angled at $15°$. The coefficient of kinetic friction is $\mu_k = 0.20$. Using $g = 9.8\text{ m/s}^2$, calculate the magnitude of the kinetic friction force. Round to one decimal place.
    answer:
      value: 4.7
      tolerance: 0.5
    explanation: |
      The normal force on the incline is $N = mg \cos\theta$.
      $$N = 2.5(9.8)\cos(15°) = 24.5(0.9659) = 23.66\text{ N}$$
      $$f_k = \mu_k N = 0.20(23.66) \approx 4.73\text{ N}$$

  - id: fric-easy-q13
    title: Cause of Friction
    type: multipleChoice
    prompt: |
      At a microscopic level, what is the primary cause of dry friction between two solid surfaces?
    choices:
      - id: a
        text: Gravitational attraction between the atoms of the two objects.
      - id: b
        text: Magnetic repulsion between surface electrons.
      - id: c
        text: Intermolecular forces (adhesion) and microscopic surface roughness locking together.
      - id: d
        text: Air pressure pushing the objects together.
    answer:
      choiceId: c
    explanation: |
      Friction arises from the interactions between the atoms/molecules of the two surfaces at the points of actual contact. This involves temporary chemical bonds (adhesion) and the physical interlocking of microscopic bumps and valleys on the surfaces.

  - id: fric-easy-q14
    title: Determining Mass from Friction
    type: numericResponse
    prompt: |
      A block is pulled across a horizontal surface where $\mu_k = 0.40$. The kinetic friction force is measured to be $31.4\text{ N}$. What is the mass of the block? Use $g = 9.8\text{ m/s}^2$ and round to one decimal place.
    answer:
      value: 8.0
      tolerance: 0.2
    explanation: |
      $$f_k = \mu_k N = \mu_k (mg)$$
      $$mg = \frac{f_k}{\mu_k} = \frac{31.4}{0.40} = 78.5\text{ N}$$
      $$m = \frac{78.5}{9.8} = 8.01\text{ kg} \approx 8.0\text{ kg}$$

  - id: fric-easy-q15
    title: Starting vs Keeping it Moving
    type: numericResponse
    prompt: |
      A heavy crate has $\mu_s = 0.60$ and $\mu_k = 0.45$. Its mass is $50\text{ kg}$ ($g = 9.8\text{ m/s}^2$). How much **more** force is required to *start* the crate moving than is required to *keep* it moving at a constant speed across a level floor?
    answer:
      value: 73.5
      tolerance: 2.0
    explanation: |
      Force to start (overcome max static friction): $f_{s,\max} = \mu_s mg = 0.60(50)(9.8) = 294\text{ N}$
      Force to keep moving (match kinetic friction): $f_k = \mu_k mg = 0.45(50)(9.8) = 220.5\text{ N}$
      Difference = $294 - 220.5 = 73.5\text{ N}$
