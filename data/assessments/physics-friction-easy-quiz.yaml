questions:
- id: fric-easy-1
  title: Kinetic Friction
  type: numericResponse
  prompt: 'Adapted from OpenStax University Physics.


    A $6$ kg block slides on a horizontal surface with $\mu_k = 0.39$. Calculate the
    kinetic friction force (use $g=9.8$).'
  answer:
    gradingMode: auto
    expected: 22.93
    tolerance: 0.2
  explanation: $f_k = \mu_k N = 0.39 \times (6)(9.8) = 22.932$ N.
