questions:
- id: shell-easy-1
  title: Basic Shell Method
  type: symbolicResponse
  prompt: 'Adapted from OpenStax Calculus Volume 2.


    Find the volume generated by rotating the region bounded by $y = 5x^2$, $x=1$,
    and $y=0$ about the y-axis.'
  answer:
    gradingMode: auto
    expectedLatex: (5/2)\pi
    equivalenceMode: expression
    tolerance: 0
  explanation: $2\pi \int_0^1 x(5x^2) \, dx = 2\pi 5 [x^4/4]_0^1 = \frac{5\pi}{2}$.
