schemaVersion: 1
id: chem-describing-gases-pressure-measurement-quiz
title: Barometers and Pressure Measurement Quiz
assessmentType: quiz
categoryId: chemistry
topicId: chem-describing-gases
skills:
  - chem-describing-gases
  - barometer-reading
  - pressure-conversions
navigation:
  learningGoal: practice
  activityType: focusedPractice
  tags:
    - chemistry
    - chem-describing-gases
modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 10
questions:
  - id: q001
    type: numericResponse
    prompt: A mercury barometer reads 760 mm Hg. What is the atmospheric pressure in atm?
    answer:
      value: 1
      tolerance: 0.001
    explanation: By definition, $760\ \text{mm Hg}=760\ \text{torr}=1.00\ \text{atm}$.
  - id: q002
    type: numericResponse
    prompt: A barometer reads 735 torr. What is the atmospheric pressure in atm?
    answer:
      value: 0.967
      tolerance: 0.002
    explanation: |
      $$735\ \text{torr}\left(\frac{1\ \text{atm}}{760\ \text{torr}}\right)=0.967\ \text{atm}$$
  - id: q003
    type: numericResponse
    prompt: Convert 0.850 atm to torr.
    answer:
      value: 646
      tolerance: 1
    explanation: |
      $$0.850\ \text{atm}\left(\frac{760\ \text{torr}}{1\ \text{atm}}\right)=646\ \text{torr}$$
  - id: q004
    type: multipleChoice
    prompt: 'A liquid barometer is used primarily to measure:'
    choices:
      - id: a
        text: the mass of a gas sample
      - id: b
        text: atmospheric pressure
      - id: c
        text: the volume of a container
      - id: d
        text: the temperature of a liquid
    answer:
      choiceId: b
    explanation: Atmospheric pressure pushes on the reservoir and supports a liquid column of measurable height.
  - id: q005
    type: multipleChoice
    prompt: If atmospheric pressure increases, what happens to the height of mercury in a standard mercury barometer?
    choices:
      - id: a
        text: It rises.
      - id: b
        text: It falls.
      - id: c
        text: It always remains at 760 mm.
      - id: d
        text: Mercury changes into a gas.
    answer:
      choiceId: a
    explanation: Greater external atmospheric pressure pushes harder on the reservoir, supporting a taller mercury column.
  - id: q006
    type: numericResponse
    prompt: A barometer reading is 101.325 kPa. What is the pressure in atm?
    answer:
      value: 1
      tolerance: 0.002
    explanation: Standard atmospheric pressure is $101.325\ \text{kPa}=1.00\ \text{atm}$.
  - id: q007
    type: multipleChoice
    prompt: Why is there nearly a vacuum above the mercury column in a traditional barometer?
    choices:
      - id: a
        text: It prevents atmospheric pressure from acting on the reservoir.
      - id: b
        text: It keeps pressure above the column negligible, so the column balances atmospheric pressure below.
      - id: c
        text: It makes mercury denser.
      - id: d
        text: It supplies gas molecules for the measurement.
    answer:
      choiceId: b
    explanation: With negligible pressure at the top, the column height is determined by the pressure exerted by the atmosphere on the reservoir.
  - id: q008
    type: numericResponse
    prompt: A weather station reports 0.920 atm. What pressure should a mercury barometer show in mm Hg?
    answer:
      value: 699.2
      tolerance: 1
    explanation: |
      $$0.920\ \text{atm}\left(\frac{760\ \text{mm Hg}}{1\ \text{atm}}\right)=699.2\ \text{mm Hg}$$
  - id: q009
    type: multipleChoice
    prompt: Which equality is valid for ordinary chemistry pressure conversions?
    choices:
      - id: a
        text: $1\ \text{atm}=760\ \text{torr}$
      - id: b
        text: $1\ \text{atm}=76\ \text{torr}$
      - id: c
        text: $1\ \text{atm}=7600\ \text{kPa}$
      - id: d
        text: $1\ \text{torr}=1\ \text{atm}$
    answer:
      choiceId: a
    explanation: One atmosphere is defined as 760 torr, and a torr is essentially the same pressure unit as a mm Hg for this course.
  - id: q010
    type: multipleChoice
    prompt: A barometer reading falls from 760 mm Hg to 730 mm Hg. What does this indicate?
    choices:
      - id: a
        text: Atmospheric pressure has decreased.
      - id: b
        text: Atmospheric pressure has increased.
      - id: c
        text: The amount of liquid has no relationship to pressure.
      - id: d
        text: The temperature must be exactly 0 °C.
    answer:
      choiceId: a
    explanation: A lower supported column means the external atmospheric pressure is lower.
  - id: q011
    type: numericResponse
    prompt: Convert 1.25 atm to kPa using $1\ \text{atm}=101.325\ \text{kPa}$.
    answer:
      value: 126.7
      tolerance: 0.2
    explanation: |
      $$1.25\ \text{atm}\left(\frac{101.325\ \text{kPa}}{1\ \text{atm}}\right)=126.7\ \text{kPa}$$
  - id: q012
    type: multipleChoice
    prompt: Which instrument is appropriate for directly measuring the pressure of a gas trapped in a container rather than atmospheric pressure?
    choices:
      - id: a
        text: A manometer
      - id: b
        text: A balance
      - id: c
        text: A buret
      - id: d
        text: A thermometer
    answer:
      choiceId: a
    explanation: A manometer compares a confined gas pressure with a reference pressure; a barometer measures atmospheric pressure.
