questions:
  - id: implement-ll-count
    type: code
    difficultyDimensions: ["Pointer manipulation", "Edge case handling"]
    subjectDifficultyTags: ["Data-Structures-Lists"]
    prerequisiteObjectiveIds: ["obj-dsa-linked-01"]
    prompt: |
      **Counting Node Values**

      You are given the `head` pointer of a singly linked list. The `Node` class is defined as:
      
      ```python
      class Node:
          def __init__(self, value):
              self.value = value
              self.next = None
      ```

      Write a Python function `count_occurrences(head, target)` that traverses the list and returns the number of times `target` appears as a node's value. If the list is empty (`head` is `None`), it should return 0.

      ```python
      def count_occurrences(head, target):
          # Write your traversal logic here
          pass
      ```
    answer:
      gradingMode: automatic
      codeLanguage: python
      testCases:
        - input: |
            n1 = Node(5); n2 = Node(10); n3 = Node(5); n1.next = n2; n2.next = n3
            count_occurrences(n1, 5)
          expectedOutput: "2"
        - input: "count_occurrences(None, 10)"
          expectedOutput: "0"
        - input: |
            n1 = Node(7)
            count_occurrences(n1, 3)
          expectedOutput: "0"
    explanation: |
      Solution:
      ```python
      def count_occurrences(head, target):
          count = 0
          current = head
          while current is not None:
              if current.value == target:
                  count += 1
              current = current.next
          return count
      ```

      Why it works:
      We use a `current` pointer to step through the list. The loop continues as long as `current` points to a valid Node. Inside the loop, we check the value, increment our counter if it matches, and critically, we advance the pointer using `current = current.next` to avoid an infinite loop.
