  prompt: "**Counting Node Values**\n\nYou are given the `head` pointer of a singly linked list. The `Node`\
    \ class is defined as:\n\n```python\nclass Node:\n    def __init__(self, value):\n        self.value\
    \ = value\n        self.next = None\n```\n\nWrite a Python function `count_occurrences(head, target)`\
    \ that traverses the list and returns the number of times `target` appears as a node's value. If the\
    \ list is empty (`head` is `None`), it should return 0.\n\n```python\ndef count_occurrences(head,\
    \ target):\n    # Write your traversal logic here\n    pass\n```\n"
  answer:
    gradingMode: automatic
    codeLanguage: python
    testCases:
    - input: 'n1 = Node(5); n2 = Node(10); n3 = Node(5); n1.next = n2; n2.next = n3

        count_occurrences(n1, 5)

        '
      expectedOutput: '2'
    - input: count_occurrences(None, 10)
      expectedOutput: '0'
    - input: 'n1 = Node(7)

        count_occurrences(n1, 3)

        '
      expectedOutput: '0'
  explanation: "Solution:\n```python\ndef count_occurrences(head, target):\n    count = 0\n    current\
    \ = head\n    while current is not None:\n        if current.value == target:\n            count +=\
    \ 1\n        current = current.next\n    return count\n```\n\nWhy it works:\nWe use a `current` pointer\
    \ to step through the list. The loop continues as long as `current` points to a valid Node. Inside\
    \ the loop, we check the value, increment our counter if it matches, and critically, we advance the\
    \ pointer using `current = current.next` to avoid an infinite loop.\n"
