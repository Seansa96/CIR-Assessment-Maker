workedExamples:
- id: example-001
  title: Build the representation
  problem: 'Find the domain of $f(x,y)=\sqrt{9-x^2-y^2}$.'
  steps:
  - id: s001
    title: Set the radicand condition
    instruction: What inequality is required?
    type: multipleChoice
    prompt: What inequality is required?
    choices:
    - id: a
      text: '$x^2+y^2\le9$'
    - id: b
      text: Use an unrelated formula.
      issueSignals:
      - id: domain-range-misidentified
    - id: c
      text: Reverse a required sign or role.
      issueSignals:
      - id: sign-error
    - id: d
      text: Treat the quantity as a scalar when it is not.
      issueSignals:
      - id: domain-range-misidentified
    answer:
      choiceId: a
    issueSignals:
    - id: domain-range-misidentified
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $x^2+y^2\le9$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Sets, Sequences, and Functions.

      Why the other choices fail: Each changes a sign, swaps a role, or applies a different relationship.'
