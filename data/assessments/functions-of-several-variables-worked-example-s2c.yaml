    - id: a
      text: '$x^2+y^2\le9$'
    - id: b
      text: $x^2+y^2=4$ (answers 'Which is a level curve of $f(x,y)=x^2+y^2$ at value 4?', not 'What inequality is required?')
      issueSignals:
      - id: domain-range-misidentified
    - id: c
      text: $-5$ (answers 'Find $f(1,-2)$ for $f(x,y)=x^2+3y$.', not 'What inequality is required?')
      issueSignals:
      - id: sign-error
    - id: d
      text: 'The disk of radius 3 centered at the origin. (answers ''After obtaining ''$x^2+y^2\le9$'' while solving ''Find
        the domain of $f(x,y)=\sqrt{9-x^2-y^2}$.'', what should be checked next?'', not ''What inequality is required?'')'
      issueSignals:
      - id: domain-range-misidentified
