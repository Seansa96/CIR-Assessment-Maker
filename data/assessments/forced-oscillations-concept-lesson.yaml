lesson:
  introduction: This lesson develops Forced Oscillations from a diagram, a mathematical model, and a calculus-based
    interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      A forced (or driven) oscillation occurs when a periodic external driving force is applied to a damped harmonic oscillator. The physical system now includes mass $m$, a restoring spring $k$, a damping mechanism $b$, and an external motor or driver applying a force $F(t) = F_0 \sin(\omega t)$.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s1, type: multipleChoice, prompt: 'What defines a forced oscillation?', choices: [{id: a, text: 'A periodic external force'}, {id: b, text: 'A constant displacement'}, {id: c, text: 'No force'}, {id: d, text: 'An unrelated quantity'}], answer: {choiceId: a}, explanation: 'This follows from the forced-oscillation model.'}
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      New quantities include the amplitude of the driving force $F_0$, and the driving angular frequency $\omega$. This driving frequency is independent of the system's natural angular frequency, which is denoted $\omega_0 = \sqrt{k/m}$.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s2, type: multipleChoice, prompt: 'Which symbol is the driving angular frequency?', choices: [{id: a, text: '$\omega$'}, {id: b, text: 'A constant displacement'}, {id: c, text: 'No force'}, {id: d, text: 'An unrelated quantity'}], answer: {choiceId: a}, explanation: 'This follows from the forced-oscillation model.'}
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model adds the driving force to Newton's Second Law: $F_{\text{net}} = -kx - bv + F_0 \sin(\omega t) = ma$. The system will initially exhibit complex transient behavior, but will eventually settle into a steady-state oscillation at the driving frequency $\omega$.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s3, type: multipleChoice, prompt: 'What is added in a forced oscillator model?', choices: [{id: a, text: 'External force added to restoring and damping forces'}, {id: b, text: 'A constant displacement'}, {id: c, text: 'No force'}, {id: d, text: 'An unrelated quantity'}], answer: {choiceId: a}, explanation: 'This follows from the forced-oscillation model.'}
  - id: s4
    title: Calculus connection
    content: >-
      The calculus connection formulates the non-homogeneous differential equation: $m\frac{d^2x}{dt^2} + b\frac{dx}{dt} + kx = F_0 \sin(\omega t)$. The particular solution (steady-state) takes the form $x(t) = A \cos(\omega t - \phi)$.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s4, type: multipleChoice, prompt: 'What type of differential equation describes forced motion?', choices: [{id: a, text: 'A nonhomogeneous differential equation'}, {id: b, text: 'A constant displacement'}, {id: c, text: 'No force'}, {id: d, text: 'An unrelated quantity'}], answer: {choiceId: a}, explanation: 'This follows from the forced-oscillation model.'}
  - id: s5
    title: Derivation or justification
    content: >-
      By substituting the proposed solution into the differential equation and grouping sine and cosine terms, one derives the amplitude of the steady-state motion: $A = \frac{F_0}{\sqrt{m^2(\omega_0^2 - \omega^2)^2 + b^2\omega^2}}$. Resonance occurs when the denominator is minimized.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s5, type: multipleChoice, prompt: 'Why is amplitude large at resonance?', choices: [{id: a, text: 'The denominator is minimized'}, {id: b, text: 'A constant displacement'}, {id: c, text: 'No force'}, {id: d, text: 'An unrelated quantity'}], answer: {choiceId: a}, explanation: 'This follows from the forced-oscillation model.'}
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, plotting the steady-state amplitude $A$ against the driving frequency $\omega$ creates a resonance curve. The curve features a prominent peak when $\omega \approx \omega_0$. The smaller the damping $b$, the sharper and higher the peak.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s6, type: multipleChoice, prompt: 'Where is the resonance-curve peak?', choices: [{id: a, text: 'Near the natural frequency'}, {id: b, text: 'A constant displacement'}, {id: c, text: 'No force'}, {id: d, text: 'An unrelated quantity'}], answer: {choiceId: a}, explanation: 'This follows from the forced-oscillation model.'}
  - id: s7
    title: Quantitative strategy
    content: >-
      A crucial quantitative strategy is identifying when resonance occurs. For lightly damped systems, resonance is practically at $\omega = \omega_0$. At resonance, the system absorbs energy from the driving force most efficiently.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s7, type: multipleChoice, prompt: 'What should be compared to identify resonance?', choices: [{id: a, text: 'The natural frequency'}, {id: b, text: 'A constant displacement'}, {id: c, text: 'No force'}, {id: d, text: 'An unrelated quantity'}], answer: {choiceId: a}, explanation: 'This follows from the forced-oscillation model.'}
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: As damping $b \to 0$, the amplitude at resonance $\omega = \omega_0$ approaches infinity, which physically means the system breaks (e.g., a shattered glass). If $\omega \to \infty$, the inertia of the mass prevents response, and $A \to 0$.
    media:
    - type: image
      src: /media/physics/owa/forced-oscillations.svg
      alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
      caption: Forced Oscillations model diagram.
    check: {id: forced-s8, type: multipleChoice, prompt: 'As $\omega$ becomes very large, what happens to amplitude?', choices: [{id: a, text: 'It approaches zero'}, {id: b, text: 'It becomes infinite'}, {id: c, text: 'It equals the mass'}, {id: d, text: 'It is unchanged'}], answer: {choiceId: a}, explanation: 'Inertia prevents an arbitrarily fast driver from producing a large response.'}
