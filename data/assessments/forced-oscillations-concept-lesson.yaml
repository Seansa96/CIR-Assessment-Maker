    title: Physical system and assumptions
    content: For **Forced Oscillations**, start from the model $\omega_0=\sqrt{k/m}$. This step connects
      the physical picture to the physical system and assumptions. State assumptions, track SI units,
      and explain what a limiting case means before calculating.
