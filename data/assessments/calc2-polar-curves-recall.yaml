items:
  - id: recall-1
    type: flashcard
    skills:
      - polar-curves
    prompt: For a polar point $(r,\theta)$, what Cartesian coordinates does it represent?
    answer:
      expectedLatex: (r\cos\theta,\ r\sin\theta)
  - id: recall-2
    type: flashcard
    skills:
      - polar-curves
    prompt: What Cartesian equations connect $x$, $y$, $r$, and $\theta$?
    answer:
      expectedLatex: x=r\cos\theta,\quad y=r\sin\theta,\quad r^2=x^2+y^2
  - id: recall-3
    type: flashcard
    skills:
      - polar-curves
    prompt: What is another polar representation of the same point $(r,\theta)$ using a negative radius?
    answer:
      expectedLatex: (-r,\theta+\pi)
  - id: recall-4
    type: flashcard
    skills:
      - polar-curves
    prompt: A polar curve passes through the pole when what equation is satisfied?
    answer:
      expectedLatex: r=0
  - id: recall-5
    type: flashcard
    skills:
      - polar-curves
    prompt: For $r=a\cos(n\theta)$ or $r=a\sin(n\theta)$, how many petals does the rose have when $n$ is odd?
    answer:
      expected: n petals
  - id: recall-6
    type: flashcard
    skills:
      - polar-curves
    prompt: For $r=a\cos(n\theta)$ or $r=a\sin(n\theta)$, how many petals does the rose have when $n$ is even?
    answer:
      expected: 2n petals
  - id: recall-7
    type: flashcard
    skills:
      - polar-curves
    prompt: In limaçons of the form $r=a\pm b\sin\theta$ or $r=a\pm b\cos\theta$, what condition gives an inner loop?
    answer:
      expectedLatex: \frac{a}{b}<1
  - id: recall-8
    type: flashcard
    skills:
      - polar-curves
    prompt: In limaçons of the form $r=a\pm b\sin\theta$ or $r=a\pm b\cos\theta$, what condition gives a cardioid?
    answer:
      expectedLatex: \frac{a}{b}=1
  - id: recall-9
    type: flashcard
    skills:
      - polar-curves
    prompt: When checking intersections of two polar curves, why is solving $r_1(\theta)=r_2(\theta)$ sometimes not enough?
    answer:
      expected: The same point can occur with different angles or with a negative radius representation.
  - id: recall-10
    type: flashcard
    skills:
      - polar-curves
    prompt: For two polar curves, what special point should be checked separately when finding intersections?
    answer:
      expected: The pole
  - id: recall-11
    type: flashcard
    skills:
      - polar-curves
    prompt: Which axis symmetry is suggested when replacing $\theta$ with $-\theta$ leaves a polar equation unchanged?
    answer:
      expected: Symmetry about the polar axis
  - id: recall-12
    type: flashcard
    skills:
      - polar-curves
    prompt: Which axis symmetry is suggested when replacing $\theta$ with $\pi-\theta$ leaves a polar equation unchanged?
    answer:
      expected: Symmetry about the line $\theta=\frac{\pi}{2}$
