questions:
- id: q001
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: An ocean swell propagates with a wavelength of 14.21 m passing a buoy at
    45.9 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 288.3982
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*45.9 = 288.3982 rad/s.
- id: q002
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: An ocean swell propagates with a wavelength of 6.65 m passing a buoy at
    74.5 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.9448
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 6.65 = 0.9448 rad/m.
- id: q003
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: An ocean swell propagates with a wavelength of 12.27 m passing a buoy at
    3.6 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.5121
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 12.27 = 0.5121 rad/m.
- id: q004
  type: numericResponse
  skills:
  - physics-traveling-waves
  prompt: A laboratory ripple tank generates water waves of length 6.8 m at a frequency
    of 97.0 Hz. What is the wave speed in m/s?
  answer:
    value: 659.6
    tolerance: 0.05
  explanation: v = lambda * f = 6.8 * 97.0 = 659.60 m/s.
- id: q005
  type: numericResponse
