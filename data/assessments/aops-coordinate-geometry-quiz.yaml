questions:
- id: q001
  type: multipleChoice
  prompt: What is the distance between the points $(2, -3)$ and $(5, 1)$?
  difficultyDimensions:
  - 'Recall the distance formula: $d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$.'
  - 'Substitute values: $\sqrt{(5 - 2)^2 + (1 - (-3))^2}$.'
  - 'Simplify: $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5$.'
  choices:
  - id: a
    text: $5$
  - id: b
    text: $7$
    issueSignals:
    - id: linear-sum-error
      domains: []
  - id: c
    text: $\sqrt{13}$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: d
    text: $25$
    issueSignals:
    - id: square-root-omission
      domains: []
  answer:
    choiceId: a
  explanation: 'Solution:

    The distance formula is derived from the Pythagorean theorem: $d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$.

    Plug in the points $(2, -3)$ and $(5, 1)$:

    $d = \sqrt{(5 - 2)^2 + (1 - (-3))^2}$

    $d = \sqrt{(3)^2 + (4)^2}$

    $d = \sqrt{9 + 16} = \sqrt{25} = 5$.


    Why it works:

    The horizontal distance between the points is 3, and the vertical distance is 4. These form the legs
    of a right triangle. The hypotenuse (the direct distance between the points) is exactly 5, forming
    a classic 3-4-5 right triangle.


    Why the other choices fail:

    - $7$ is the sum of the horizontal and vertical distances ($3 + 4 = 7$), which is the "taxicab" distance,
    not the straight-line distance.

    - $\sqrt{13}$ comes from an algebraic sign error: $(1 - 3)^2 = (-2)^2 = 4$, leading to $\sqrt{9+4}$.

    - $25$ forgets to take the final square root.

    '
- id: q002
  type: multipleChoice
  prompt: What is the midpoint of the line segment connecting $(-4, 7)$ and $(8, 3)$?
  difficultyDimensions:
  - 'Recall the midpoint formula: $\left(\frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2}\right)$.'
  - 'Calculate x-coordinate: $(-4 + 8) / 2 = 2$.'
  - 'Calculate y-coordinate: $(7 + 3) / 2 = 5$.'
  choices:
  - id: a
    text: $(12, 4)$
    issueSignals:
    - id: distance-confusion
      domains: []
  - id: b
    text: $(2, 5)$
  - id: c
    text: $(4, 10)$
    issueSignals:
    - id: division-omission
      domains: []
  - id: d
    text: $(6, 2)$
    issueSignals:
    - id: subtraction-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The midpoint formula simply averages the $x$-coordinates and the $y$-coordinates.

    $M = \left( \frac{-4 + 8}{2}, \frac{7 + 3}{2} \right)$

    $M = \left( \frac{4}{2}, \frac{10}{2} \right)$

    $M = (2, 5)$.


    Why it works:

    The middle of a line segment is found exactly halfway along the $x$-axis and exactly halfway along
    the $y$-axis. Averaging two numbers always yields the number exactly halfway between them.


    Why the other choices fail:

    - $(12, 4)$ comes from subtracting instead of adding, which calculates horizontal/vertical distances
    rather than the midpoint.

    - $(4, 10)$ forgets to divide the sums by 2.

    - $(6, 2)$ comes from a subtraction error (e.g., $\frac{8 - (-4)}{2} = 6$).

    '
- id: q003
  type: multipleChoice
  prompt: Point $M$ is the midpoint of segment $AB$. If $M$ is at $(3, -2)$ and endpoint $A$ is at $(-1,
    4)$, what are the coordinates of endpoint $B$?
  difficultyDimensions:
  - 'Set up midpoint equations: $(-1 + x)/2 = 3$ and $(4 + y)/2 = -2$.'
  - 'Solve for $x$: $-1 + x = 6 \implies x = 7$.'
  - 'Solve for $y$: $4 + y = -4 \implies y = -8$.'
  choices:
  - id: a
    text: $(1, 1)$
    issueSignals:
    - id: midpoint-confusion
      domains: []
  - id: b
    text: $(2, 2)$
    issueSignals:
    - id: subtraction-error
      domains: []
  - id: c
    text: $(7, -8)$
  - id: d
    text: $(5, -10)$
    issueSignals:
    - id: arithmetic-error
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    Let endpoint $B$ be $(x, y)$.

    Using the midpoint formula:

    $\frac{-1 + x}{2} = 3 \implies -1 + x = 6 \implies x = 7$.

    $\frac{4 + y}{2} = -2 \implies 4 + y = -4 \implies y = -8$.

    Endpoint $B$ is $(7, -8)$.


    Why it works:

    You can also use the "jump" method. To get from $A(-1, 4)$ to $M(3, -2)$, the $x$-coordinate jumped
    $+4$ (from -1 to 3), and the $y$-coordinate jumped $-6$ (from 4 to -2). Apply that exact same jump
    from $M$ to get to $B$: $x$ jumps from 3 to $3+4=7$, and $y$ jumps from -2 to $-2-6=-8$.


    Why the other choices fail:

    - $(1, 1)$ is the midpoint between $A$ and $M$ ($(-1+3)/2=1$ and $(4-2)/2=1$), effectively treating
    $M$ as the other endpoint.

    - $(2, 2)$ is a math error.

    - $(5, -10)$ is a math error.

    '
- id: q004
  type: multipleChoice
  prompt: What is the slope of the line passing through the points $(-2, 5)$ and $(4, -7)$?
  difficultyDimensions:
  - 'Recall the slope formula: $m = (y_2 - y_1) / (x_2 - x_1)$.'
  - 'Substitute values: $(-7 - 5) / (4 - (-2))$.'
  - 'Simplify: $-12 / 6 = -2$.'
  choices:
  - id: a
    text: $2$
    issueSignals:
    - id: aops-sign-error
      domains: []
  - id: b
    text: $-2$
  - id: c
    text: $-1/2$
    issueSignals:
    - id: run-over-rise-error
      domains: []
  - id: d
    text: $-12$
    issueSignals:
    - id: division-omission
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The formula for slope is $m = \frac{y_2 - y_1}{x_2 - x_1}$ (rise over run).

    $m = \frac{-7 - 5}{4 - (-2)}$

    $m = \frac{-12}{4 + 2}$

    $m = \frac{-12}{6} = -2$.


    Why it works:

    Slope measures the steepness of a line. A negative slope means the line goes downwards from left to
    right. Here, for every 6 units you move right, you drop 12 units, which simplifies to dropping 2 units
    for every 1 unit right.


    Why the other choices fail:

    - $2$ comes from a sign error (e.g., $12/6 = 2$).

    - $-1/2$ comes from calculating run over rise (x over y).

    - $-12$ forgets to divide by the run.

    '
- id: q005
  type: multipleChoice
  prompt: Which of the following lines is parallel to the line $y = 3x - 4$?
  difficultyDimensions:
  - Identify the slope of the given line is $m = 3$.
  - Recall that parallel lines have identical slopes.
  - Find the choice with $m = 3$.
  choices:
  - id: a
    text: $y = -3x + 2$
    issueSignals:
    - id: negative-slope-confusion
      domains: []
  - id: b
    text: $y = \frac{1}{3}x - 4$
    issueSignals:
    - id: reciprocal-confusion
      domains: []
  - id: c
    text: $y = -\frac{1}{3}x + 5$
    issueSignals:
    - id: perpendicular-confusion
      domains: []
  - id: d
    text: $y = 3x + 7$
  answer:
    choiceId: d
  explanation: 'Solution:

    The equation $y = 3x - 4$ is in slope-intercept form ($y = mx + b$), so its slope is $m = 3$.

    Parallel lines must have exactly the same slope.

    Look for the choice with a slope of 3.

    $y = 3x + 7$ has a slope of 3.


    Why it works:

    If two lines have the same steepness (slope) but cross the y-axis at different points (different y-intercepts),
    they will run side-by-side forever without ever touching.


    Why the other choices fail:

    - $y = -3x + 2$ has a slope of -3 (it goes down, not up).

    - $y = \frac{1}{3}x - 4$ has a reciprocal slope.

    - $y = -\frac{1}{3}x + 5$ is **perpendicular** to the original line (negative reciprocal slope).

    '
