schemaVersion: 1
id: chemistry-nuclear-concept-lesson-s2c
title: 'Nuclear Chemistry: Decay, Energy, and Radiation Evidence'
assessmentType: conceptLesson
categoryId: chemistry
topicId: chemistry-nuclear
modeDefault: practice
randomizeQuestions: false
navigation: { learningGoal: learn, activityType: conceptLesson, tags: [chemistry, nuclear-chemistry] }
authoring: { visualRequirement: required, visualRationale: 'Daughter-number changes and radiation penetration are spatial relationships that benefit from diagrams.', sourceId: src-20260720035703-91ea51b0d8 }
lesson:
  introduction: 'Nuclear chemistry follows two bookkeeping rules—conserve mass number and atomic number—then connects unstable nuclei to decay timing, binding energy, radiation evidence, and exposure decisions.'
  sections:
    - id: notation-equations
      title: Nuclear equations conserve two numbers
      required: true
      content: 'In $^A_ZX$, A counts protons plus neutrons and Z counts protons. A balanced nuclear equation has the same total A and total Z on both sides, even though the element identity may change.'
      check:
        id: c1
        type: multipleChoice
        prompt: 'Complete $^{238}_{92}U\rightarrow{}^{234}_{90}Th+\ ?$.'
        choices:
          - { id: a, text: '$^4_2He$', issueSignals: [] }
          - { id: b, text: '$^0_{-1}e$', issueSignals: [{ id: chemistry-nuclear-conservation-error }] }
          - { id: c, text: '$^0_0\gamma$', issueSignals: [{ id: chemistry-nuclear-conservation-error }] }
        answer: { choiceId: a }
        explanation: 'Solution: The missing particle is $^4_2He$. Why it works: The differences are $238-234=4$ and $92-90=2$. Why the other choices fail: beta and gamma have mass number zero and cannot balance the missing mass number four.'
    - id: decay-modes
      title: Each decay mode moves to a characteristic daughter
      required: true
      content: 'Alpha emission changes A by −4 and Z by −2. Beta-minus keeps A fixed and raises Z by one. Positron emission and electron capture keep A fixed and lower Z by one. Gamma changes neither.'
      media: [{ type: image, src: /media/chemistry/nuclear-decay-daughter-map.svg, alt: Map of mass-number and atomic-number changes for five radioactive decay modes., caption: Apply the indicated changes, then identify the daughter element from its new atomic number. }]
      check:
        id: c2
        type: multipleChoice
        prompt: 'What daughter results when $^{14}_{6}C$ undergoes beta-minus emission?'
        choices:
          - { id: a, text: '$^{14}_{7}N$', issueSignals: [] }
          - { id: b, text: '$^{10}_{4}Be$', issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }] }
          - { id: c, text: '$^{14}_{5}B$', issueSignals: [{ id: chemistry-nuclear-decay-daughter-error }] }
        answer: { choiceId: a }
        explanation: 'Solution: $^{14}_{7}N$. Why it works: Beta-minus emission leaves A unchanged and increases Z from 6 to 7. Why the other choices fail: b applies an alpha shift; c applies the positron or electron-capture direction.'
    - id: stability
      title: Stability patterns guide likely transformations
      required: true
      content: 'Light stable nuclei tend toward similar neutron and proton counts; heavier stable nuclei require proportionally more neutrons. Neutron-rich nuclei can move toward stability by beta-minus decay, while proton-rich nuclei can use positron emission or electron capture.'
      check:
        id: c3
        type: multipleChoice
        prompt: 'Which decay commonly moves a neutron-rich nuclide toward a better neutron-to-proton balance?'
        choices:
          - { id: a, text: beta-minus emission, issueSignals: [] }
          - { id: b, text: positron emission, issueSignals: [{ id: chemistry-nuclear-stability-pattern-error }] }
          - { id: c, text: gamma emission only, issueSignals: [{ id: chemistry-nuclear-stability-pattern-error }] }
        answer: { choiceId: a }
        explanation: 'Solution: Beta-minus emission. Why it works: A neutron changes into a proton while A remains fixed, lowering the neutron-to-proton ratio. Why the other choices fail: positron emission changes a proton toward a neutron; gamma emission does not change either count.'
    - id: half-life
      title: Radioactive decay is first-order and fractional
      required: true
      content: 'A half-life is the time for half of the current radioactive nuclei to decay. After n half-lives, the remaining amount is $N_0(1/2)^n$; equal times remove equal fractions, not equal absolute amounts.'
      check:
        id: c4
        type: numericResponse
        prompt: 'An $80.0\ \mathrm{mg}$ sample passes through three half-lives. How many milligrams remain?'
        answer: { value: 10.0, tolerance: 0.01 }
        explanation: 'Solution: $80.0(1/2)^3=10.0\ \mathrm{mg}$. Why it works: Each half-life halves the amount that remains.'
    - id: binding-energy
      title: Mass defect records nuclear binding energy
      required: true
      content: 'A bound nucleus has slightly less mass than its separated protons and neutrons. The positive difference is the mass defect, whose energy equivalent is binding energy. Fission splits very heavy nuclei; fusion joins very light nuclei. Both can release energy when products are more tightly bound per nucleon.'
      check:
        id: c5
        type: multipleChoice
        prompt: 'Why is the mass of a bound nucleus less than the total mass of its separated nucleons?'
        choices:
          - { id: a, text: 'The mass difference corresponds to released binding energy.', issueSignals: [] }
          - { id: b, text: 'Some protons cease to exist when the nucleus forms.', issueSignals: [{ id: chemistry-nuclear-conservation-error }] }
          - { id: c, text: 'Mass defect means the bound nucleus has negative mass.', issueSignals: [{ id: chemistry-nuclear-mass-energy-error }] }
        answer: { choiceId: a }
        explanation: 'Solution: The mass difference corresponds to binding energy. Why it works: Formation of a more tightly bound state releases energy according to $E=\Delta mc^2$. Why the other choices fail: b violates nucleon bookkeeping; c confuses a positive mass difference with negative total mass.'
    - id: radiation-evidence
      title: Penetration, detection, and hazard are related but distinct
      required: true
      content: 'Alpha radiation has short range and high local ionization, beta penetrates farther, and gamma generally penetrates much farther. Detectors or dosimeters record radiation interactions. Safety depends on radiation type, energy, shielding, exposure time, distance, and whether material is outside or inside the body.'
      media: [{ type: image, src: /media/chemistry/nuclear-radiation-penetration.svg, alt: Alpha stopped by paper, beta by thin metal, and gamma reduced by dense shielding., caption: Penetration informs shielding, while source location also controls biological risk. }]
      check:
        id: c6
        type: multipleChoice
        prompt: 'Which statement best compares alpha radiation outside and inside the body?'
        choices:
          - { id: a, text: 'It is easily stopped externally but can cause intense local damage if inhaled or ingested.', issueSignals: [] }
          - { id: b, text: 'It always poses the greatest external whole-body penetration hazard.', issueSignals: [{ id: chemistry-nuclear-penetration-hazard-confusion }] }
          - { id: c, text: 'It cannot interact with tissue because paper stops it.', issueSignals: [{ id: chemistry-nuclear-penetration-hazard-confusion }] }
        answer: { choiceId: a }
        explanation: 'Solution: Choose a. Why it works: Alpha has low external penetration but deposits energy strongly over a short path when the source is internal. Why the other choices fail: b ignores its short range; c confuses easy external shielding with an inability to ionize tissue.'
