questions:
- id: q1
  type: multipleChoice
  prompt: 'When a wheel rolls without slipping on a flat surface, the instantaneous
    velocity of the point on the wheel in contact with the ground is:'
  choices:
  - id: c1
    content: Zero
  - id: c2
    content: $v_{cm}$
  - id: c3
    content: $2v_{cm}$
  answer:
    choiceId: c1
  explanation: The contact point is instantaneously at rest relative to the surface.
