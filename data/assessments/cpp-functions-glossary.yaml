schemaVersion: 1
id: cpp-functions-glossary
title: C++ Functions Glossary
assessmentType: glossary
categoryId: c++
topicId: c++-functions
modeDefault: practice
navigation: { learningGoal: learn, activityType: glossary, tags: [c++, c++-functions, function-contracts] }
authoring: { visualRequirement: notApplicable, visualRationale: This reference defines function-contract vocabulary; the concept lesson shows the call flow. }
glossary:
  introduction: Review the vocabulary that describes a C++ function's interface, implementation, and effect on caller data.
  sections:
  - id: function-contract-terms
    title: Function contract terms
    entries:
    - id: cpp-function-declaration
      term: Function declaration
      definition: A signature that states a function's return type, name, and parameter types without its implementation body.
      drills: [{ id: cpp-function-declaration-drill, type: typed, prompt: A function's signature without its body is its ________., answer: { expected: declaration } }]
    - id: cpp-function-definition
      term: Function definition
      definition: The complete function, including the body that executes when the function is called.
      drills: [{ id: cpp-function-definition-drill, type: typed, prompt: The function form that contains executable statements is its ________., answer: { expected: definition } }]
    - id: cpp-function-parameter
      term: Parameter and argument
      definition: A parameter is the local name in a function signature; an argument is the expression supplied by the caller.
      drills: [{ id: cpp-function-argument-drill, type: typed, prompt: The value supplied at a call site is an ________., answer: { expected: argument } }]
    - id: cpp-const-reference
      term: Const reference
      definition: A parameter such as `const std::string& text` that avoids a copy while preventing mutation through that parameter.
      drills: [{ id: cpp-const-reference-drill, type: typed, prompt: The parameter form that avoids copying and forbids mutation is a const ________., answer: { expected: reference } }]
