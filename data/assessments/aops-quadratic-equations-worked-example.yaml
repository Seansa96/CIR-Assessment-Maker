- id: aops-quadratic-equations-problem-1
  title: Completing the square when integer factoring fails
  problem: |-
    Solve

    $$x^2+2x-7=0$$

    by completing the square, then verify the root sum and product.
  steps:
  - id: aops-quadratic-equations-p1-s1
    title: Isolate the variable terms
    instruction: |-
      Move the constant to the other side:

      $$x^2+2x=7.$$

      The equation is monic, so no leading-coefficient division is needed.
    type: multipleChoice
    prompt: Which equation is equivalent?
    choices:
    - id: a
      text: '$x^2+2x=7$'
    - id: b
      text: '$x^2+2x=-7$'
    - id: c
      text: '$x^2=2x+7$'
    - id: d
      text: '$x^2-2x=7$'
    answer:
      choiceId: a
    explanation: Add 7 to both sides.
  - id: aops-quadratic-equations-p1-s2
    title: Add the completing-square term to both sides
    instruction: |-
      Half of 2 is 1, and $1^2=1$. Add 1 to both sides:

      $$x^2+2x+1=8,$$

      so $(x+1)^2=8$.
    type: multipleChoice
    prompt: What completed square is obtained?
    choices:
    - id: a
      text: '$(x+1)^2=8$'
    - id: b
      text: '$(x+2)^2=8$'
    - id: c
      text: '$(x+1)^2=7$'
    - id: d
      text: '$(x-1)^2=8$'
    answer:
      choiceId: a
    explanation: Expanding $(x+1)^2$ gives $x^2+2x+1$.
  - id: aops-quadratic-equations-p1-s3
    title: Take both square-root branches
    instruction: |-
      From $(x+1)^2=8$,

      $$x+1=\pm\sqrt8=\pm2\sqrt2.$$

      Therefore

      $$x=-1\pm2\sqrt2.$$
    type: multipleChoice
    prompt: Why is the $\pm$ required?
    choices:
    - id: a
      text: Both $2\sqrt2$ and $-2\sqrt2$ have square 8.
    - id: b
      text: Every equation has two roots.
    - id: c
      text: The coefficient 2 may have either sign.
    - id: d
      text: Square roots are undefined without it.
    answer:
      choiceId: a
    explanation: Solving a square equation requires both opposite values.
  - id: aops-quadratic-equations-p1-s4
    title: Check root relations without messy substitution
    instruction: |-
      The roots are $r=-1+2\sqrt2$ and $s=-1-2\sqrt2$. Their sum is $-2$, matching $-b/a=-2$, and their product is

      $$(-1)^2-(2\sqrt2)^2=1-8=-7,$$

      matching $c/a=-7$.
    type: multipleChoice
    prompt: Which pair of checks matches the original coefficients?
    choices:
    - id: a
      text: '$r+s=-2$ and $rs=-7$'
    - id: b
      text: '$r+s=2$ and $rs=7$'
    - id: c
      text: '$r+s=-7$ and $rs=-2$'
    - id: d
      text: '$r+s=0$ and $rs=8$'
    answer:
      choiceId: a
    explanation: Vieta's relations verify both branches together.
  - id: aops-quadratic-equations-p1-s5
    title: Connect to the quadratic formula
    instruction: |-
      The formula gives

      $$\frac{-2\pm\sqrt{4+28}}2=\frac{-2\pm4\sqrt2}2=-1\pm2\sqrt2,$$

      confirming the completed-square result.
    type: multipleChoice
    prompt: What is the discriminant of the equation?
    choices:
    - id: a
      text: '8'
    - id: b
      text: '16'
    - id: c
      text: '28'
    - id: d
      text: '32'
    answer:
      choiceId: d
    explanation: $b^2-4ac=2^2-4(1)(-7)=32$.
- id: aops-quadratic-equations-problem-2
  title: A quartic that is quadratic in x squared
  problem: |-
    Solve over the reals:

    $$x^4-5x^2+4=0.$$
  steps:
  - id: aops-quadratic-equations-p2-s1
    title: Name the repeated structure
    instruction: |-
      The powers are $(x^2)^2$ and $x^2$. Let $u=x^2$. Because $x$ is real, carry the restriction $u\ge0$.
    type: multipleChoice
    prompt: Which substitution lowers the equation to a quadratic?
    choices:
    - id: a
      text: '$u=x^2$'
    - id: b
      text: '$u=x^4$'
    - id: c
      text: '$u=x-5$'
    - id: d
      text: '$u=4x$'
    answer:
      choiceId: a
    explanation: Then $x^4=u^2$.
  - id: aops-quadratic-equations-p2-s2
    title: Solve the quadratic in u
    instruction: |-
      The transformed equation is

      $$u^2-5u+4=0=(u-1)(u-4).$$

      Thus $u=1$ or $u=4$; both satisfy $u\ge0$.
    type: multipleChoice
    prompt: What are the values of $u$?
    choices:
    - id: a
      text: '$u=-1,-4$'
    - id: b
      text: '$u=1,4$'
    - id: c
      text: '$u=0,5$'
    - id: d
      text: '$u=2,3$'
    answer:
      choiceId: b
    explanation: The factors have product 4 and sum $-5$ in the polynomial.
  - id: aops-quadratic-equations-p2-s3
    title: Reverse each substitution value completely
    instruction: |-
      From $x^2=1$, obtain $x=\pm1$. From $x^2=4$, obtain $x=\pm2$. Therefore the candidate set is

      $$\{-2,-1,1,2\}.$$
    type: multipleChoice
    prompt: Which mistake would omit valid roots?
    choices:
    - id: a
      text: Taking only the positive square root of each $u$ value
    - id: b
      text: Factoring $u^2-5u+4$
    - id: c
      text: Recording $u\ge0$
    - id: d
      text: Checking the original quartic
    answer:
      choiceId: a
    explanation: Each positive square value has two opposite real square roots.
  - id: aops-quadratic-equations-p2-s4
    title: Verify by factor structure
    instruction: |-
      The original polynomial factors as

      $$(x^2-1)(x^2-4)=(x-1)(x+1)(x-2)(x+2).$$

      This confirms all four roots and shows none were duplicated.
    type: multipleChoice
    prompt: Which factorization matches the original polynomial?
    choices:
    - id: a
      text: '$(x^2-1)(x^2-4)$'
    - id: b
      text: '$(x^2+1)(x^2+4)$'
    - id: c
      text: '$(x^2-5)(x^2+4)$'
    - id: d
      text: '$(x-1)(x-4)$'
    answer:
      choiceId: a
    explanation: Expanding gives $x^4-5x^2+4$.
  - id: aops-quadratic-equations-p2-s5
    title: Generalize the substitution restriction
    instruction: |-
      If the transformed quadratic had produced $u=-3$, it would be rejected for real $x$ because $x^2\ge0$. The substitution's range is part of the equation, not an optional final observation.
    type: multipleChoice
    prompt: 'Over the reals, what should be done with a transformed root $u=-3$ when $u=x^2$?'
    choices:
    - id: a
      text: Reject it because no real square equals $-3$.
    - id: b
      text: Convert it to $x=\pm3$.
    - id: c
      text: Keep $x=-3$ only.
    - id: d
      text: Replace it with $u=3$.
    answer:
      choiceId: a
    explanation: Reversing a substitution must respect its real range.
- id: aops-quadratic-equations-problem-3
  title: Squaring creates an extraneous candidate
  problem: |-
    Solve over the reals:

    $$\sqrt{x+5}=x-1.$$
  steps:
  - id: aops-quadratic-equations-p3-s1
    title: Record restrictions before squaring
    instruction: |-
      The square root requires $x+5\ge0$, and its value is nonnegative. Since it equals $x-1$, we also need $x-1\ge0$. The combined effective restriction is $x\ge1$.
    type: multipleChoice
    prompt: Which restriction is strongest?
    choices:
    - id: a
      text: '$x\ge-5$'
    - id: b
      text: '$x\ge1$'
    - id: c
      text: '$x\ne1$'
    - id: d
      text: No restriction
    answer:
      choiceId: b
    explanation: Both sides must be defined, and the right side must match a nonnegative principal square root.
  - id: aops-quadratic-equations-p3-s2
    title: Square and form a quadratic
    instruction: |-
      Squaring gives

      $$x+5=(x-1)^2=x^2-2x+1.$$

      Move all terms to one side:

      $$x^2-3x-4=0.$$
    type: multipleChoice
    prompt: Which quadratic results?
    choices:
    - id: a
      text: '$x^2-3x-4=0$'
    - id: b
      text: '$x^2-x-4=0$'
    - id: c
      text: '$x^2-2x+6=0$'
    - id: d
      text: '$x^2-3x+4=0$'
    answer:
      choiceId: a
    explanation: Subtract $x+5$ from $x^2-2x+1$.
  - id: aops-quadratic-equations-p3-s3
    title: Solve the squared equation
    instruction: |-
      Factor:

      $$(x-4)(x+1)=0.$$

      The squared equation has candidates $x=4$ and $x=-1$.
    type: multipleChoice
    prompt: Which candidate set comes from the quadratic?
    choices:
    - id: a
      text: '$\{4,-1\}$'
    - id: b
      text: '$\{4,1\}$'
    - id: c
      text: '$\{-4,1\}$'
    - id: d
      text: '$\{-4,-1\}$'
    answer:
      choiceId: a
    explanation: The factor roots are 4 and $-1$.
  - id: aops-quadratic-equations-p3-s4
    title: Apply the recorded restriction and original equation
    instruction: |-
      The restriction $x\ge1$ immediately rejects $-1$. Direct substitution confirms

      $$\sqrt{4+5}=3=4-1.$$

      Thus $x=4$ is the only solution.
    type: multipleChoice
    prompt: Why is $x=-1$ extraneous?
    choices:
    - id: a
      text: It violates $x\ge1$ and gives $2=-2$ in the original equation.
    - id: b
      text: Negative numbers cannot solve any equation.
    - id: c
      text: It does not solve the squared equation.
    - id: d
      text: The quadratic formula rejects it.
    answer:
      choiceId: a
    explanation: Squaring erased the sign mismatch between the original sides.
  - id: aops-quadratic-equations-p3-s5
    title: Explain the nonreversible step
    instruction: |-
      If $A=B$, then $A^2=B^2$. The converse is not automatic: $A^2=B^2$ permits $A=B$ or $A=-B$. Squaring changed implication into a broader condition, so original-equation verification is logically necessary.
    type: multipleChoice
    prompt: Which statement explains why squaring may add roots?
    choices:
    - id: a
      text: Opposite numbers have equal squares.
    - id: b
      text: Squaring is undefined for negative numbers.
    - id: c
      text: Every squared equation is linear.
    - id: d
      text: Square roots always have two displayed values.
    answer:
      choiceId: a
    explanation: The squared equation cannot distinguish equal from opposite original sides.
