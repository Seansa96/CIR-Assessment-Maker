questions:
  - id: et-markov-next-state
    type: multipleChoice
    prompt: |
      Let $P$ be a transition matrix for a Markov chain, and $\vec{x}_0$ be the initial state vector.
      Which mathematical expression represents the state vector at step 2 ($\vec{x}_2$)?
    choices:
      - id: c1
        text: '$2P\vec{x}_0$'
      - id: c2
        text: '$P^2\vec{x}_0$'
      - id: c3
        text: '$P\vec{x}_0 + P$'
      - id: c4
        text: '$\vec{x}_0^2 P$'
    answer:
      choiceId: c2
    explanation: |
      The state at step 1 is $\vec{x}_1 = P\vec{x}_0$. The state at step 2 is $\vec{x}_2 = P\vec{x}_1$. Substituting the first into the second gives $\vec{x}_2 = P(P\vec{x}_0) = P^2\vec{x}_0$.

  - id: et-steady-state-eigenvalue
    type: multipleChoice
    prompt: |
      A steady-state vector $\vec{q}$ of a stochastic matrix $P$ satisfies the equation $P\vec{q} = \vec{q}$.
      This means $\vec{q}$ is an eigenvector of $P$. What is its corresponding eigenvalue?
    choices:
      - id: c1
        text: '$\lambda = 0$'
      - id: c2
        text: '$\lambda = 1$'
      - id: c3
        text: 'It depends on the specific matrix $P$.'
      - id: c4
        text: '$\lambda = -1$'
    answer:
      choiceId: c2
    explanation: |
      The equation $P\vec{q} = \vec{q}$ can be rewritten as $P\vec{q} = 1\vec{q}$. This exactly matches the eigenvector definition $P\vec{q} = \lambda\vec{q}$ with $\lambda = 1$.

  - id: et-pca-matrix-target
    type: multipleChoice
    prompt: |
      In Principal Component Analysis (PCA), which matrix extracted from the data is diagonalized to find the principal components?
    choices:
      - id: c1
        text: 'The identity matrix'
      - id: c2
        text: 'The transition matrix'
      - id: c3
        text: 'The covariance matrix'
      - id: c4
        text: 'The adjacency matrix'
    answer:
      choiceId: c3
    explanation: |
      PCA involves computing the covariance matrix of the dataset (which measures how the features vary together) and finding its eigenvectors and eigenvalues.

  - id: et-pca-eigenvalue-meaning
    type: multipleChoice
    prompt: |
      When analyzing the eigenvalues of a covariance matrix in PCA, what do the largest eigenvalues indicate?
    choices:
      - id: c1
        text: 'The directions containing the most noise/error.'
      - id: c2
        text: 'The directions that capture the most variance (information) in the data.'
      - id: c3
        text: 'The directions with the highest correlation.'
      - id: c4
        text: 'The directions that should be deleted for compression.'
    answer:
      choiceId: c2
    explanation: |
      The eigenvalues represent the variance of the data projected along the corresponding eigenvectors. The largest eigenvalues point to the "principal components" that capture the most essential information, allowing us to safely discard the components with small eigenvalues.

  - id: et-pagerank-analogy
    type: multipleChoice
    prompt: |
      The Google PageRank algorithm mathematically treats the entire internet as a giant:
    choices:
      - id: c1
        text: 'Markov chain'
      - id: c2
        text: 'Covariance matrix'
      - id: c3
        text: 'Inner product space'
      - id: c4
        text: 'Diagonal matrix'
    answer:
      choiceId: c1
    explanation: |
      PageRank models the web as a Markov chain, where web pages are the "states" and the hyperlinks between them dictate the "transition probabilities" of a random surfer moving from page to page.
