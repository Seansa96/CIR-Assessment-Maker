    entries:
    - id: grid-container
      term: Grid Container
      definition: 'The parent element with display: grid.'
      drills:
      - id: grid-container-drill
        type: typed
        prompt: 'What is the term for: The parent element with display: grid.?'
        answer:
          expected: Grid Container
          aliases:
          - grid container
        explanation: The term is Grid Container.
    - id: grid-template-columns
      term: grid-template-columns
      definition: Defines the columns of the grid with a space-separated list of values.
      drills:
      - id: grid-template-columns-drill
        type: typed
        prompt: 'What is the term for: Defines the columns of the grid with a space-separated list of values.?'
        answer:
          expected: grid-template-columns
          aliases:
          - grid-template-columns
        explanation: The term is grid-template-columns.
    - id: fr-unit
      term: fr Unit
      definition: A fractional unit that represents a fraction of the available space in the grid container.
      drills:
      - id: fr-unit-drill
        type: typed
        prompt: 'What is the term for: A fractional unit that represents a fraction of the available space in the grid container.?'
        answer:
          expected: fr Unit
          aliases:
          - fr unit
        explanation: The term is fr Unit.
