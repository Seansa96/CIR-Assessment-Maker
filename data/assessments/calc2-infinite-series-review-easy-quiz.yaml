schemaVersion: 1
id: calc2-infinite-series-review-easy-quiz
title: Infinite Series Comprehensive Review Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: infinite-series-review
skills:
- Relate sequences of partial sums to series convergence
- Select and justify convergence tests
- Classify convergence, analyze power series, and estimate error
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - infinite-series-review
  - easy
  - cumulative-review
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - connect-series-and-partial-sums
  prompt: |
    If $S_N=\sum_{n=1}^{N}a_n$ and $\lim_{N\to\infty}S_N=7$, what is $\sum_{n=1}^{\infty}a_n$?
  choices:
  - id: a
    text: $7$
  - id: b
    text: $0$
  - id: c
    text: $a_7$
  - id: d
    text: The series diverges.
  answer:
    choiceId: a
  explanation: An infinite series is defined as the limit of its partial sums, so its sum is seven.
- id: q002
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    What conclusion follows immediately for $\sum_{n=1}^{\infty}\frac{3n+1}{n+4}$?
  choices:
  - id: a
    text: It diverges because the terms approach $3$.
  - id: b
    text: It converges by comparison.
  - id: c
    text: It converges to $3$.
  - id: d
    text: The term test proves convergence.
  answer:
    choiceId: a
  explanation: The summand tends to three rather than zero, so the necessary condition for convergence
    fails.
- id: q003
  type: multipleChoice
  skills:
  - sum-a-geometric-series
  prompt: |
    Evaluate $\sum_{n=0}^{\infty}5(1/3)^n$.
  choices:
  - id: a
    text: $15/2$
  - id: b
    text: $5/2$
  - id: c
    text: $15$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: The ratio has magnitude below one, and $5/(1-1/3)=15/2$.
- id: q004
  type: multipleChoice
  skills:
  - recognize-telescoping-series
  prompt: |
    What is $\sum_{n=1}^{\infty}\left(\frac1n-\frac1{n+1}\right)$?
  choices:
  - id: a
    text: $1$
  - id: b
    text: $0$
  - id: c
    text: $1/2$
  - id: d
    text: Diverges
  answer:
    choiceId: a
  explanation: The partial sum is $1-1/(N+1)$, whose limit is one.
- id: q005
  type: multipleChoice
  skills:
  - select-a-benchmark-series
  prompt: |
    Which series converges?
  choices:
  - id: a
    text: |-
      $\sum 1/n^{3/2}$
  - id: b
    text: |-
      $\sum 1/n$
  - id: c
    text: |-
      $\sum 1/\sqrt n$
  - id: d
    text: |-
      $\sum 1$
  answer:
    choiceId: a
  explanation: A p-series converges exactly when its exponent is greater than one.
- id: q006
  type: multipleChoice
  skills:
  - use-direct-comparison
  prompt: |
    Since $0\le\frac1{n^2+4}\le\frac1{n^2}$, what follows?
  choices:
  - id: a
    text: |-
      $\sum1/(n^2+4)$ converges.
  - id: b
    text: |-
      $\sum1/(n^2+4)$ diverges.
  - id: c
    text: Both sums are equal.
  - id: d
    text: No conclusion is possible.
  answer:
    choiceId: a
  explanation: A nonnegative series bounded above by the convergent p-series with exponent two converges.
- id: q007
  type: multipleChoice
  skills:
  - apply-limit-comparison
  prompt: |
    Which benchmark is most natural for $\sum\frac{4n+1}{n^3+2}$?
  choices:
  - id: a
    text: |-
      $\sum1/n^2$
  - id: b
    text: |-
      $\sum1/n$
  - id: c
    text: |-
      $\sum n^2$
  - id: d
    text: |-
      $\sum(1/2)^n$
  answer:
    choiceId: a
  explanation: The quotient of leading powers behaves like $4/n^2$, so limit comparison with $1/n^2$ is
    decisive.
- id: q008
  type: multipleChoice
  skills:
  - apply-the-alternating-series-test
  prompt: |
    Why does $\sum_{n=1}^{\infty}(-1)^{n-1}/n$ converge?
  choices:
  - id: a
    text: $1/n$ decreases to $0$.
  - id: b
    text: |-
      $\sum1/n$ converges.
  - id: c
    text: Its ratio has limit below $1$.
  - id: d
    text: Alternating signs alone suffice.
  answer:
    choiceId: a
  explanation: The magnitudes decrease monotonically to zero, which supplies both alternating-series hypotheses.
- id: q009
  type: multipleChoice
  skills:
  - classify-absolute-and-conditional-convergence
  prompt: |
    How is $\sum_{n=1}^{\infty}(-1)^{n}/n$ classified?
  choices:
  - id: a
    text: Conditionally convergent
  - id: b
    text: Absolutely convergent
  - id: c
    text: Divergent
  - id: d
    text: Geometric
  answer:
    choiceId: a
  explanation: The alternating harmonic series converges, while its absolute-value series is harmonic
    and diverges.
- id: q010
  type: multipleChoice
  skills:
  - select-the-ratio-test
  prompt: |
    Which test is usually most efficient for $\sum_{n=1}^{\infty}\frac{3^n}{n!}$?
  choices:
  - id: a
    text: Ratio test
  - id: b
    text: Integral test
  - id: c
    text: Alternating-series test
  - id: d
    text: Telescoping test
  answer:
    choiceId: a
  explanation: |-
    Consecutive-term division cancels the factorial and gives ratio $3/(n+1)\to0$.
- id: q011
  type: multipleChoice
  skills:
  - interpret-an-inconclusive-test
  prompt: |
    If $\lim|a_{n+1}/a_n|=1$, what does the ratio test conclude?
  choices:
  - id: a
    text: Nothing; another argument is needed.
  - id: b
    text: Absolute convergence
  - id: c
    text: Conditional convergence
  - id: d
    text: Divergence
  answer:
    choiceId: a
  explanation: The ratio test is inconclusive at its boundary value one.
- id: q012
  type: multipleChoice
  skills:
  - estimate-alternating-remainders
  prompt: |
    For an alternating series with decreasing magnitudes, what bounds $|S-S_N|$?
  choices:
  - id: a
    text: $b_{N+1}$
  - id: b
    text: $b_N+b_{N+1}$
  - id: c
    text: $1/N$ for every series
  - id: d
    text: $|S_N|$
  answer:
    choiceId: a
  explanation: The alternating-series estimation theorem bounds the remainder by the first omitted magnitude.
- id: q013
  type: multipleChoice
  skills:
  - find-a-power-series-radius
  prompt: |
    What is the radius of convergence of $\sum_{n=0}^{\infty}((x-2)/4)^n$?
  choices:
  - id: a
    text: $4$
  - id: b
    text: $2$
  - id: c
    text: $1/4$
  - id: d
    text: |-
      $\infty$
  answer:
    choiceId: a
  explanation: Geometric convergence requires $|(x-2)/4|<1$, equivalently $|x-2|<4$.
- id: q014
  type: multipleChoice
  skills:
  - test-power-series-endpoints
  prompt: |
    After finding $|x-c|<R$ for a power series, how should the interval of convergence be completed?
  choices:
  - id: a
    text: Substitute and test each endpoint separately.
  - id: b
    text: Always include both endpoints.
  - id: c
    text: Always exclude both endpoints.
  - id: d
    text: Differentiate the original function.
  answer:
    choiceId: a
  explanation: Ratio or root tests usually leave equality unresolved, so each endpoint becomes its own
    numerical series.
- id: q015
  type: multipleChoice
  skills:
  - use-taylor-polynomials
  prompt: |
    What is the quadratic Maclaurin polynomial for $e^x$?
  choices:
  - id: a
    text: $1+x+x^2/2$
  - id: b
    text: $x+x^2$
  - id: c
    text: $1+x^2/2$
  - id: d
    text: $1+x+x^2$
  answer:
    choiceId: a
  explanation: Every derivative of $e^x$ equals one at zero, giving coefficients $1/k!$.
attemptQuestionCount: 15
