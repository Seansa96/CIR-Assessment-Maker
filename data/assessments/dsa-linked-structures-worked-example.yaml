workedExamples:
- id: we001
  title: Trace a Linked Structures and Memory-Aware Containers decision
  problem: 'Work through a realistic case: an editor undo history with stable nodes. Select an approach, preserve its invariant, and explain the tradeoff.'
  steps:
  - title: Recognize the workload
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: 'Which requirement matters most in this scenario: an editor undo history with stable nodes?'
    choices:
    - id: a
      text: The access pattern and bound
    - id: b
      text: The name of the structure
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: The access pattern and bound. The trace follows the module invariant and workload.
    id: step-1
  - title: Protect the invariant
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: What must the update preserve?
    choices:
    - id: a
      text: every next and previous link preserves a reachable, non-cyclic structure
    - id: b
      text: Only the output formatting
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: every next and previous link preserves a reachable, non-cyclic structure. The trace follows the module invariant and workload.
    id: step-2
  - title: Choose the implementation
    instruction: Trace the decision before writing code.
    type: multipleChoice
    prompt: Which implementation action fits Linked Structures and Memory-Aware Containers?
    choices:
    - id: a
      text: inserting after a known node
    - id: b
      text: Scan unrelated data repeatedly
    - id: c
      text: Skip boundary tests
    - id: d
      text: Assume infinite memory
    answer:
      choiceId: a
    explanation: inserting after a known node. The trace follows the module invariant and workload.
    id: step-3
