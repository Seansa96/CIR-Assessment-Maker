schemaVersion: 1
id: chemistry-periodic-table-group-names-recall
title: Periodic Table Group Names Recall
assessmentType: recallDrill
categoryId: chemistry
subcategoryIds:
- chemistry-periodic-table
skills:
- chemistry-periodic-table
modeDefault: practice
randomizeQuestions: false
items:
- id: group-1a-name
  type: cloze
  prompt: 'Complete:


    Group 1A elements, except hydrogen as a special case, are called the ____.

    '
  answer:
    expected: 'alkali metals

      - alkali metal group'
  explanation: 'Group 1A metals are called alkali metals because they form strongly
    basic compounds with water. Hydrogen sits above the group but is not usually treated
    as an alkali metal.

    '
  tags:
  - group-names
  - group-1a
- id: group-2a-name
  type: cloze
  prompt: 'Complete:


    Group 2A elements are called the ____.

    '
  answer:
    expected: 'alkaline earth metals

      - alkaline earth metal group'
  explanation: 'Group 2A metals are the alkaline earth metals. They commonly form
    2+ ions.

    '
  tags:
  - group-names
  - group-2a
- id: group-3a-name
  type: typed
  prompt: 'What is the common family name for Group 3A?

    '
  answer:
    expected: 'boron group

      - boron family'
  explanation: 'Group 3A is commonly called the boron group or boron family. Aluminum
    is the most commonly encountered metal from this family in introductory ionic
    naming.

    '
  tags:
  - group-names
  - group-3a
- id: group-4a-name
  type: typed
  prompt: 'What is the common family name for Group 4A?

    '
  answer:
    expected: 'carbon group

      - carbon family'
  explanation: 'Group 4A is the carbon group. These elements often share four valence
    electrons, but they do not all behave like simple fixed-charge ionic metals.

    '
  tags:
  - group-names
  - group-4a
- id: group-5a-name
  type: flashcard
  prompt: 'Group 5A is commonly called what?

    '
  answer:
    expected: 'nitrogen group, also called pnictogens

      - nitrogen group - pnictogens'
  explanation: 'Group 5A is the nitrogen group. The name pnictogens is also used,
    especially when discussing periodic trends.

    '
  tags:
  - group-names
  - group-5a
- id: group-6a-name
  type: flashcard
  prompt: 'Group 6A is commonly called what?

    '
  answer:
    expected: 'oxygen group, also called chalcogens

      - oxygen group - chalcogens'
  explanation: 'Group 6A is the oxygen group. Chalcogens commonly form 2- ions in
    introductory ionic compounds.

    '
  tags:
  - group-names
  - group-6a
- id: group-7a-name
  type: cloze
  prompt: 'Complete:


    Group 7A elements are the ____.

    '
  answer:
    expected: 'halogens

      - halogen group'
  explanation: 'Group 7A elements are halogens. They commonly form 1- ions and make
    salts with metals.

    '
  tags:
  - group-names
  - group-7a
- id: group-8a-name
  type: cloze
  prompt: 'Complete:


    Group 8A elements are the ____.

    '
  answer:
    expected: 'noble gases

      - noble gas group'
  explanation: 'Group 8A elements are noble gases. Their filled valence shells make
    them relatively unreactive.

    '
  tags:
  - group-names
  - group-8a
- id: halogen-location
  type: flashcard
  prompt: 'Which A-group contains fluorine, chlorine, bromine, and iodine?

    '
  answer:
    expected: Group 7A, the halogens
  explanation: 'Fluorine, chlorine, bromine, iodine, and astatine are Group 7A halogens.
    For ionic naming, they usually become 1- anions ending in -ide.

    '
  tags:
  - group-names
  - halogens
- id: noble-gas-location
  type: typed
  prompt: 'Which A-group contains helium, neon, argon, krypton, xenon, and radon?

    '
  answer:
    expected: 'Group 8A, the noble gases

      - 8A noble gases - noble gases'
  explanation: 'Group 8A contains the noble gases. Helium is placed with the noble
    gases because its valence shell is full.

    '
  tags:
  - group-names
  - noble-gases
