- id: q004
  title: Explain Security descriptors
  type: freeResponse
  prompt: 'In a short answer, explain why **Security descriptors** matters in Windows Case Study.

    '
  answer:
    expected: 'Windows access control uses security descriptors and access tokens to mediate object access. A complete answer
      should also note that permissions depend on token identity and object policy together.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Security descriptors
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Windows Case Study. The key is to connect the term to what the OS controls or protects.

    '
