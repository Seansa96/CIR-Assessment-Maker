questions:
- id: q001
  title: Recognize Windows design lens
  type: multipleChoice
  prompt: 'Which statement best describes **Windows design lens** in operating systems?

    '
  choices:
  - id: a
    text: Windows emphasizes object-based kernel structures, compatibility, security descriptors, and broad device/application
      support.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'Windows emphasizes object-based kernel structures, compatibility, security descriptors, and broad device/application
    support. The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
