lesson:
  introduction: This lesson develops Comparing SHM and Circular Motion from a diagram, a mathematical
    model, and a calculus-based interpretation.
  sections:
  - id: s1
    title: Physical system and assumptions
    content: >-
      Simple harmonic motion can be viewed as the one-dimensional projection of uniform circular motion. Imagine an object moving in a circle of radius $A$ at constant angular velocity $\omega$. If we shine a light on it edge-on, its shadow on a flat screen exhibits simple harmonic motion.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
  - id: s2
    title: Vocabulary and measurable quantities
    content: >-
      The measurable quantities in this model include the radius of the circle (which corresponds to the amplitude $A$ of SHM), the angular velocity $\omega$ (which corresponds to the angular frequency of SHM), and the position angle $\theta = \omega t + \phi$.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
  - id: s3
    title: Mathematical model
    content: >-
      The mathematical model uses right-triangle trigonometry. If an object is at an angle $\theta$ on a circle of radius $A$, its $x$-coordinate is $x(t) = A\cos(\theta)$. Substituting $\theta = \omega t + \phi$, we get $x(t) = A\cos(\omega t + \phi)$, the exact equation for SHM position.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
  - id: s4
    title: Calculus connection
    content: >-
      The calculus connection becomes elegant here: the velocity of the object in uniform circular motion has a tangential magnitude $v_T = A\omega$. The $x$-component of this tangential velocity is $v_x = -A\omega\sin(\omega t + \phi)$. Differentiating $x(t)$ gives exactly this same result.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
  - id: s5
    title: Derivation or justification
    content: >-
      We derive the acceleration similarly. Centripetal acceleration in circular motion is $a_c = v_T^2/A = A\omega^2$ directed toward the center. The $x$-component of this acceleration is $-A\omega^2\cos(\omega t + \phi)$. This matches $a = -\omega^2 x$, the defining requirement for simple harmonic motion.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
  - id: s6
    title: Graphical interpretation
    content: >-
      Graphically, tracking the $x$ and $y$ projections of the circular path yields a cosine and sine wave respectively. This illustrates why sinusoidal functions perfectly describe oscillations—they are the components of constant-rate rotation.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
  - id: s7
    title: Quantitative strategy
    content: >-
      A useful quantitative strategy when solving SHM problems is the 'reference circle' method. By visualizing the object on the reference circle, phase angles $\phi$ and instantaneous velocities become intuitive geometric problems rather than pure algebra.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
  - id: s8
    title: Boundary checks and transfer
    content: >-
      Boundary checks: When the object passes through the center of the shadow ($x=0$), the reference circle particle is at the top or bottom ($\theta = \pi/2$ or $3\pi/2$), meaning its velocity is entirely in the $x$-direction, matching the maximum velocity of SHM.
    media:
    - type: image
      src: /media/physics/owa/shm-circular-motion.svg
      alt: Labeled original schematic for Comparing SHM and Circular Motion used for quantitative analysis.
      caption: Comparing SHM and Circular Motion model diagram.
