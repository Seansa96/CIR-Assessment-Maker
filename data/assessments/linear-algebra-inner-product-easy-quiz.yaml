questions:
  - id: eq-cauchy-max
    type: numericResponse
    prompt: |
      Suppose $\vec{u}$ and $\vec{v}$ are vectors in an inner product space, with $\|\vec{u}\| = 5$ and $\|\vec{v}\| = 6$.
      According to the Cauchy-Schwarz inequality, what is the maximum possible value of the inner product $\langle \vec{u}, \vec{v} \rangle$?
    answer:
      value: 30
      tolerance: 0
    explanation: |
      The Cauchy-Schwarz inequality states that $|\langle \vec{u}, \vec{v} \rangle| \leq \|\vec{u}\| \|\vec{v}\|$.
      Therefore, the inner product can be at most $5 \times 6 = 30$.

  - id: eq-homogeneity-axiom
    type: multipleChoice
    prompt: |
      According to the Homogeneity axiom of inner products, which of the following is equivalent to $\langle c\vec{u}, \vec{v} \rangle$ for a scalar $c$?
    choices:
      - id: c1
        text: '$\langle \vec{u}, c\vec{v} \rangle$'
      - id: c2
        text: '$c\langle \vec{u}, \vec{v} \rangle$'
      - id: c3
        text: '$c^2\langle \vec{u}, \vec{v} \rangle$'
      - id: c4
        text: 'Both A and B are correct.'
    answer:
      choiceId: c4
    explanation: |
      The axiom specifically states $\langle c\vec{u}, \vec{v} \rangle = c\langle \vec{u}, \vec{v} \rangle$. Because inner products are symmetric, $c\langle \vec{u}, \vec{v} \rangle = c\langle \vec{v}, \vec{u} \rangle = \langle c\vec{v}, \vec{u} \rangle = \langle \vec{u}, c\vec{v} \rangle$. Therefore, pulling the scalar $c$ out to the front or moving it to the second vector are both valid operations!

  - id: eq-evaluation-inner-product
    type: multipleChoice
    prompt: |
      Let $\mathbb{P}_2$ be the vector space of polynomials of degree at most 2. 
      Define an inner product as $\langle p, q \rangle = p(-1)q(-1) + p(0)q(0) + p(1)q(1)$.
      Let $p(t) = t^2$ and $q(t) = t$. Are $p$ and $q$ orthogonal in this inner product space?
    choices:
      - id: c1
        text: 'Yes, because their inner product evaluates to 0.'
      - id: c2
        text: 'No, because their inner product evaluates to 2.'
      - id: c3
        text: 'Yes, because neither polynomial is the zero vector.'
      - id: c4
        text: 'No, because they are different degree polynomials.'
    answer:
      choiceId: c1
    explanation: |
      We evaluate the inner product:
      $p(-1) = 1$, $q(-1) = -1 \implies (1)(-1) = -1$
      $p(0) = 0$, $q(0) = 0 \implies (0)(0) = 0$
      $p(1) = 1$, $q(1) = 1 \implies (1)(1) = 1$
      Summing these up: $-1 + 0 + 1 = 0$.
      Since $\langle p, q \rangle = 0$, the polynomials are indeed orthogonal under this specific inner product!
