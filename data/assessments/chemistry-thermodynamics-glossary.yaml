glossary:
  introduction: |
    Master the terminology and equations related to energy transfer, specific heat, and the laws governing thermodynamics.
  sections:
    - id: laws-of-thermodynamics
      title: The Laws of Thermodynamics
      required: true
      content: |
        These laws govern the transfer and transformation of energy.
      entries:
        - id: first-law-thermodynamics
          term: First Law of Thermodynamics
          definition: |
            Energy cannot be created or destroyed, only transferred or transformed. Also known as the Law of Conservation of Energy.
          notation: '$\Delta U = q + w$'
          examples:
            - 'The energy lost by a system is exactly equal to the energy gained by its surroundings.'
          aliases: [Law of Conservation of Energy]
          media: []
          tags: [first-law, thermodynamics, energy]
          drills:
            - id: first-law-cloze
              type: cloze
              prompt: 'The First Law of Thermodynamics is also known as the Law of ____ of Energy.'
              answer:
                expected: Conservation
                aliases: [conservation]
              explanation: Energy is conserved; it merely changes forms.
              tags: [first-law, thermodynamics]

        - id: second-law-thermodynamics
          term: Second Law of Thermodynamics
          definition: |
            The total entropy of an isolated system can never decrease over time, and is constant if and only if all processes are reversible.
          notation: '$\Delta S_{univ} > 0$'
          examples:
            - 'Heat naturally flows from a hotter object to a colder one, increasing total entropy.'
          aliases: [Law of Entropy]
          media: []
          tags: [second-law, entropy, thermodynamics]
          drills:
            - id: second-law-typed
              type: typed
              prompt: 'Which law of thermodynamics states that the entropy of the universe is always increasing?'
              answer:
                expected: Second Law
                aliases: [Second, 2nd, 2nd law]
              explanation: The second law deals with the natural direction of processes and entropy.
              tags: [second-law, thermodynamics]

    - id: heat-and-energy
      title: Heat and Energy Variables
      required: true
      content: |
        Terms used to describe heat transfer and thermal properties of substances.
      entries:
        - id: specific-heat-capacity
          term: Specific Heat Capacity
          definition: |
            The amount of heat energy required to raise the temperature of one gram of a substance by one degree Celsius (or one Kelvin).
          notation: '$c$ or $c_s$'
          examples:
            - 'The specific heat of liquid water is $4.18 \text{ J/(g} \cdot ^\circ\text{C)}$.'
          aliases: [Specific heat]
          media: []
          tags: [specific-heat, heat]
          drills:
            - id: specific-heat-recognition
              type: recognition
              prompt: 'What term refers to the energy needed to raise 1 gram of a substance by $1^\circ\text{C}$?'
              choices:
                - id: a
                  text: Heat Capacity
                - id: b
                  text: Specific Heat Capacity
                - id: c
                  text: Enthalpy
                - id: d
                  text: Entropy
              answer:
                choiceId: b
                expected: Specific Heat Capacity
              explanation: Specific heat is per gram, whereas heat capacity is for an entire object.
              tags: [specific-heat, heat]

        - id: heat-capacity
          term: Heat Capacity
          definition: |
            The amount of heat energy required to raise the temperature of an entire object or defined amount of substance by one degree Celsius.
          notation: '$C$'
          examples:
            - 'A large swimming pool has a much higher heat capacity than a cup of water, even though they have the same specific heat.'
          aliases: []
          media: []
          tags: [heat-capacity, heat]
          drills:
            - id: heat-capacity-cloze
              type: cloze
              prompt: 'While specific heat is per gram, ____ capacity is the energy required to heat an entire given object by $1^\circ\text{C}$.'
              answer:
                expected: heat
                aliases: [Heat]
              explanation: Heat capacity depends on both the material and its total mass.
              tags: [heat-capacity, heat]

        - id: enthalpy
          term: Enthalpy
          definition: |
            A thermodynamic quantity equivalent to the total heat content of a system. It is equal to the internal energy of the system plus the product of pressure and volume.
          notation: '$H = U + PV$'
          examples:
            - 'The change in enthalpy ($\Delta H$) is the heat absorbed or released at constant pressure.'
          aliases: []
          media: []
          tags: [enthalpy, energy]
          drills:
            - id: enthalpy-typed
              type: typed
              prompt: 'What thermodynamic quantity is represented by the symbol H and describes total heat content?'
              answer:
                expected: Enthalpy
                aliases: [enthalpy]
              explanation: Enthalpy change is commonly measured in chemical reactions as heat flow.
              tags: [enthalpy, energy]

        - id: entropy
          term: Entropy
          definition: |
            A thermodynamic quantity representing the unavailability of a system''s thermal energy for conversion into mechanical work, often interpreted as the degree of disorder or randomness in the system.
          notation: '$S$'
          examples:
            - 'A gas has higher entropy than a solid because its molecules are more disordered.'
          aliases: []
          media: []
          tags: [entropy, disorder]
          drills:
            - id: entropy-typed
              type: typed
              prompt: 'What term describes the degree of disorder or randomness in a thermodynamic system?'
              answer:
                expected: Entropy
                aliases: [entropy]
              explanation: Entropy increases when a solid melts or a liquid boils.
              tags: [entropy, disorder]

    - id: equations-to-memorize
      title: Equations to Memorize
      required: true
      content: |
        Critical formulas used in thermodynamics and calorimetry.
      entries:
        - id: specific-heat-equation
          term: Specific Heat Equation
          definition: |
            The equation used to calculate the amount of heat transferred to or from a substance based on its mass, specific heat, and change in temperature.
          notation: '$q = mc\Delta T$'
          examples:
            - '$q$ is heat, $m$ is mass, $c$ is specific heat, and $\Delta T$ is the change in temperature.'
          aliases: [Heat transfer equation]
          media: []
          tags: [equation, specific-heat]
          drills:
            - id: specific-heat-equation-cloze
              type: cloze
              prompt: 'Complete the formula for heat transfer: $q = m \cdot c \cdot \Delta$ ____'
              answer:
                expected: T
                aliases: [t]
              explanation: $\Delta T$ represents the change in temperature ($T_{final} - T_{initial}$).
              tags: [equation, specific-heat]
