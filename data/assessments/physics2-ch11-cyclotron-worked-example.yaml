workedExamples:
- id: we1
  title: Radius of an Electron's Path
  steps:
  - id: s1
    prompt: Apply the circular motion formula.
    explanation: 'Solution:

      1) Equate magnetic force to centripetal force: $qvB = \frac{mv^2}{r}$.

      2) Solve for $r$: $r = \frac{mv}{qB}$.

      3) Substitute: $r = \frac{(9.1 \times 10^{-31})(3.0 \times 10^6)}{(1.6 \times 10^{-19})(0.20)}$.

      4) $r = \frac{27.3 \times 10^{-25}}{0.32 \times 10^{-19}} \approx 85.3 \times 10^{-6}\text{ m} =
      85.3\text{ }\mu\text{m}$.


      Why it works:

      The magnetic force acts perpendicular to the velocity, changing the particle''s direction but not
      its speed.'
    title: Apply the circular motion formula.
    instruction: 'Work through this step: Apply the circular motion formula.'
    type: freeResponse
    answer:
      gradingMode: selfCheck
  problem: An electron moves with a speed of $3.0 \times 10^6\text{ m/s}$ perpendicular to a uniform magnetic
    field of $0.20\text{ T}$. What is the radius of its circular path? (Use $m = 9.1 \times 10^{-31}\text{
    kg}$ and $e = 1.6 \times 10^{-19}\text{ C}$).
