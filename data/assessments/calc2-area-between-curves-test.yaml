questions:
- id: q001
  type: numericResponse
  skills:
  - area-between-curves
  prompt: |
    Find the total area enclosed by the curves $y = x^3 - x$ and $y = 3x$.

    *Hint: Find all three points of intersection and set up two integrals.*
  answer:
    value: 8
    tolerance: 0.01
  explanation: |
    $x^3 - x = 3x \implies x^3 - 4x = 0 \implies x(x-2)(x+2) = 0$. Intersections are at $-2, 0, 2$.
    On $[-2, 0]$, cubic is on top: $\int_{-2}^0 (x^3 - 4x)\,dx = 4$.
    On $[0, 2]$, line is on top: $\int_0^2 (4x - x^3)\,dx = 4$.
    Total = $4 + 4 = 8$.
- id: q002
  type: numericResponse
  skills:
  - area-between-curves
  prompt: |
    Find the area bounded by the curves $x = 2y^2$ and $x = y^2 + 4$.
  answer:
    value: 10.666
    tolerance: 0.1
  explanation: |
    Intersection: $2y^2 = y^2 + 4 \implies y^2 = 4 \implies y = \pm 2$.
    Right curve is $y^2 + 4$. Left curve is $2y^2$.
    $A = \int_{-2}^2 (y^2 + 4 - 2y^2)\,dy = \int_{-2}^2 (4 - y^2)\,dy = 32/3 \a\approx 10.666$.
- id: q003
  type: selectAll
  skills:
  - area-between-curves
  prompt: |
    Which of the following integrals correctly compute the area bounded by $y = \sqrt{x}$, $y = x - 2$, and the x-axis?
  choices:
  - id: a
    text: $\int_0^2 \sqrt{x}\,dx + \int_2^4 (\sqrt{x} - (x - 2))\,dx$
  - id: b
    text: $\int_0^4 (\sqrt{x} - (x - 2))\,dx$
  - id: c
    text: $\int_0^2 ((y + 2) - y^2)\,dy$
  answer:
    choiceIds:
      - a
      - c
  explanation: |
    If sliced vertically (dx), the bottom curve changes at $x=2$ (from $y=0$ to $y=x-2$). This requires two integrals.
    If sliced horizontally (dy), the right curve is $x = y+2$ and left is $x = y^2$, requiring only one integral from $y=0$ to $y=2$.
- id: q004
  type: numericResponse
  skills:
  - area-between-curves
  prompt: |
    Find the area of the region bounded by $y = 12 - x^2$ and $y = x^2 - 6$.
  answer:
    value: 72
    tolerance: 0.1
  explanation: |
    Intersection: $12 - x^2 = x^2 - 6 \implies 2x^2 = 18 \implies x^2 = 9 \implies x = \pm 3$.
    $A = \int_{-3}^3 (12 - x^2 - (x^2 - 6))\,dx = \int_{-3}^3 (18 - 2x^2)\,dx = [18x - 2x^3/3]_{-3}^3$.
    At $x=3$: $54 - 18 = 36$.
    At $x=-3$: $-54 + 18 = -36$.
    Total: $36 - (-36) = 72$.
- id: q005
  type: multipleChoice
  skills:
  - area-between-curves
  prompt: |
    Set up the integral for the area bounded by $y = \sec^2 x$ and $y = \sin x$ from $x = 0$ to $x = \pi/4$.
  choices:
  - id: a
    text: $\int_0^{\pi/4} (\sec^2 x - \sin x)\,dx$
  - id: b
    text: $\int_0^{\pi/4} (\sin x - \sec^2 x)\,dx$
  - id: c
    text: $\int_0^1 (\sec^2 x - \sin x)\,dx$
  - id: d
    text: $\int_0^{\pi/4} (\sec^2 x + \sin x)\,dx$
  answer:
    choiceId: a
  explanation: |
    On $(0, \pi/4)$, $\sec^2 x > 1$ and $\sin x < 1$, so $\sec^2 x$ is the upper curve.
- id: pauls-notes-1-exponential
  type: symbolicResponse
  skills:
  - area-between-curves
  prompt: |
    Find the area of the region bounded by $y = e^{2x - 1}$, $y = e^{5 - x}$, $x = 0$ and $x = 3$.
  answer:
    gradingMode: auto
    expectedLatex: e^5 + (1/2)e^{-1} - (3/2)e^3 + e^2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Intersection: $e^{2x - 1} = e^{5 - x} \implies 2x - 1 = 5 - x \implies 3x = 6 \implies x = 2$.
    The curves intersect at $x = 2$, which is within our interval $[0, 3]$. We split the integral.

    On $[0, 2]$, test $x = 1$: $y_1 = e^1$, $y_2 = e^4$. So $e^{5 - x}$ is the upper curve.
    On $[2, 3]$, test $x = 3$: $y_1 = e^5$, $y_2 = e^2$. So $e^{2x - 1}$ is the upper curve.

    Area $A = \int_0^2 (e^{5 - x} - e^{2x - 1}) \, dx + \int_2^3 (e^{2x - 1} - e^{5 - x}) \, dx$
    $A = [-e^{5 - x} - \frac{1}{2}e^{2x - 1}]_0^2 + [\frac{1}{2}e^{2x - 1} + e^{5 - x}]_2^3$
    $A = (-e^3 - \frac{1}{2}e^3) - (-e^5 - \frac{1}{2}e^{-1}) + (\frac{1}{2}e^5 + e^2) - (\frac{1}{2}e^3 + e^3)$
    $A = -\frac{3}{2}e^3 + e^5 + \frac{1}{2}e^{-1} + \frac{1}{2}e^5 + e^2 - \frac{3}{2}e^3 = \frac{3}{2}e^5 - 3e^3 + e^2 + \frac{1}{2e}$
- id: pauls-notes-2-y-axis
  type: symbolicResponse
  skills:
  - area-between-curves
  prompt: |
    Find the area of the region bounded by $x = 6y - y^2$, $x = 2y$, $y = -2$ and $y = 5$.
  answer:
    gradingMode: auto
    expectedLatex: 71/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Intersection: $6y - y^2 = 2y \implies y^2 - 4y = 0 \implies y = 0, 4$.
    Both points are in $[-2, 5]$. Split the integral: $[-2, 0]$, $[0, 4]$, and $[4, 5]$.

    On $[-2, 0]$, test $y = -1$: $x_1 = -7$, $x_2 = -2$. $2y$ is right curve.
    On $[0, 4]$, test $y = 2$: $x_1 = 8$, $x_2 = 4$. $6y - y^2$ is right curve.
    On $[4, 5]$, test $y = 5$: $x_1 = 5$, $x_2 = 10$. $2y$ is right curve.

    Area $A = \int_{-2}^0 (2y - (6y - y^2)) \, dy + \int_0^4 ((6y - y^2) - 2y) \, dy + \int_4^5 (2y - (6y - y^2)) \, dy$
    $A = \int_{-2}^0 (y^2 - 4y) \, dy + \int_0^4 (4y - y^2) \, dy + \int_4^5 (y^2 - 4y) \, dy$
    $A = [\frac{1}{3}y^3 - 2y^2]_{-2}^0 + [2y^2 - \frac{1}{3}y^3]_0^4 + [\frac{1}{3}y^3 - 2y^2]_4^5$
    $A = 0 - (-\frac{8}{3} - 8) + (32 - \frac{64}{3}) - 0 + (\frac{125}{3} - 50) - (\frac{64}{3} - 32) = \frac{32}{3} + \frac{32}{3} + \frac{7}{3} = \frac{71}{3}$
- id: pauls-notes-3-trig
  type: symbolicResponse
  skills:
  - area-between-curves
  prompt: |
    Find the area of the region bounded by $x = \cos(\pi y)$, $x = 3$, $y = 0$ and $y = 4$.
  answer:
    gradingMode: auto
    expectedLatex: 12
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    The maximum value of $\cos(\pi y)$ is $1$, so $x = 3$ is always to the right of $x = \cos(\pi y)$.
    No intersection points to check.

    Area $A = \int_0^4 (3 - \cos(\pi y)) \, dy = [3y - \frac{1}{\pi}\sin(\pi y)]_0^4$
    $A = (12 - 0) - (0 - 0) = 12$
- id: image-scan-1
  type: symbolicResponse
  skills:
  - area-between-curves
  prompt: |
    Find the exact area of the region enclosed by $y = x^2$ and $y = 4 - x^2$.
  answer:
    gradingMode: auto
    expectedLatex: 16\sqrt{2}/3
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    Find the intersection points by setting the equations equal:
    $x^2 = 4 - x^2 \implies 2x^2 = 4 \implies x^2 = 2 \implies x = \pm\sqrt{2}$.
    Between $-\sqrt{2}$ and $\sqrt{2}$, $y = 4 - x^2$ is the upper curve.

    Area $A = \int_{-\sqrt{2}}^{\sqrt{2}} ((4 - x^2) - x^2) \, dx = \int_{-\sqrt{2}}^{\sqrt{2}} (4 - 2x^2) \, dx$
    $A = \left[ 4x - \frac{2}{3}x^3 \right]_{-\sqrt{2}}^{\sqrt{2}}$
    $A = \left( 4\sqrt{2} - \frac{2}{3}(\sqrt{2})^3 \right) - \left( -4\sqrt{2} - \frac{2}{3}(-\sqrt{2})^3 \right)$
    $A = \left( 4\sqrt{2} - \frac{4\sqrt{2}}{3} \right) - \left( -4\sqrt{2} + \frac{4\sqrt{2}}{3} \right) = 2 \left( \frac{12\sqrt{2} - 4\sqrt{2}}{3} \right) = 2 \left( \frac{8\sqrt{2}}{3} \right) = \frac{16\sqrt{2}}{3}$
- id: image-scan-3
  type: symbolicResponse
  skills:
  - area-between-curves
  prompt: |
    Find the area of the region enclosed by $f(x) = x^3 - 4x^2 + x - 1$ and $g(x) = -x^2 + 2x - 4$.
  answer:
    gradingMode: auto
    expectedLatex: 17/2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    First, find the intersection points:
    $x^3 - 4x^2 + x - 1 = -x^2 + 2x - 4$
    $x^3 - 3x^2 - x + 3 = 0$
    Factor by grouping: $x^2(x - 3) - 1(x - 3) = 0 \implies (x^2 - 1)(x - 3) = 0$.
    The intersection points are $x = -1, 1, 3$. This splits the region into two intervals.

    On $[-1, 1]$, test $x = 0$: $f(0) = -1$, $g(0) = -4$, so $f(x)$ is the upper curve.
    On $[1, 3]$, test $x = 2$: $f(2) = -7$, $g(2) = -4$, so $g(x)$ is the upper curve.

    $A_1 = \int_{-1}^1 (x^3 - 3x^2 - x + 3) \, dx = \left[ \frac{1}{4}x^4 - x^3 - \frac{1}{2}x^2 + 3x \right]_{-1}^1$
    $A_1 = (\frac{1}{4} - 1 - \frac{1}{2} + 3) - (\frac{1}{4} + 1 - \frac{1}{2} - 3) = (\frac{7}{4}) - (-\frac{11}{4}) = \frac{18}{4} = \frac{9}{2}$.

    $A_2 = \int_1^3 (-x^3 + 3x^2 + x - 3) \, dx = \left[ -\frac{1}{4}x^4 + x^3 + \frac{1}{2}x^2 - 3x \right]_1^3$
    $A_2 = (-\frac{81}{4} + 27 + \frac{9}{2} - 9) - (-\frac{1}{4} + 1 + \frac{1}{2} - 3) = (\frac{9}{4}) - (-\frac{7}{4}) = \frac{16}{4} = 4$.

    Total Area = $A_1 + A_2 = \frac{9}{2} + 4 = \frac{17}{2} = 8.5$.
- id: image-scan-4
  type: symbolicResponse
  skills:
  - area-between-curves
  prompt: |
    Consider the region bounded by $y = \sqrt{x - 2}$, the $x$-axis, and $x = 11$. Find the exact area of the region.
    *(Challenge: Try solving this twice, once setting up the integral with the differential $dx$ and once with $dy$!)*
  answer:
    gradingMode: auto
    expectedLatex: 18
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    **Method 1: Integrating with respect to $x$ ($dx$)**
    The curve intersects the $x$-axis at $\sqrt{x-2} = 0 \implies x = 2$.
    $A = \int_2^{11} \sqrt{x-2} \, dx$. Let $u = x-2, du = dx$. Bounds become $0$ to $9$.
    $A = \int_0^9 u^{1/2} \, du = \left[ \frac{2}{3}u^{3/2} \right]_0^9 = \frac{2}{3}(27) = 18$.

    **Method 2: Integrating with respect to $y$ ($dy$)**
    The limits for $y$ are from $y=0$ (the $x$-axis) to the intersection at $x=11$: $y = \sqrt{11-2} = 3$.
    Rewrite the curve as a function of $y$: $y = \sqrt{x-2} \implies y^2 = x - 2 \implies x = y^2 + 2$.
    The right boundary is $x = 11$, and the left boundary is $x = y^2 + 2$.
    $A = \int_0^3 (11 - (y^2 + 2)) \, dy = \int_0^3 (9 - y^2) \, dy$
    $A = \left[ 9y - \frac{1}{3}y^3 \right]_0^3 = (27 - 9) - 0 = 18$.
