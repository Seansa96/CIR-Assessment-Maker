        - slice thickness
        - bounds or variable interval
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: A complete model identifies the slice measurement, its thickness ($dx$ or $dy$), and the bounds over which those slices are accumulated. Why it works: These pieces determine the infinitesimal contribution and the portion of the object included. Common trap: Naming only a formula skips the geometric quantity the formula is meant to represent.'
