lesson:
  introduction: An integral is a limit of accumulated small geometric contributions. Before choosing a formula, identify one representative piece, its measurement, and the thickness that carries it across the region.
  sections:
  - id: geom-meaning
    title: 1. Read an integral as accumulated change
    required: true
    content: For a nonnegative function, $\int_a^b f(x)\,dx$ accumulates heights $f(x)$ across tiny widths $dx$. Its value is an area when height is measured in length units, but the same structure can represent volume, arc length, work, or another accumulated quantity.
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Representative vertical slice inside a region between two curves
      caption: Start with one small contribution
    check:
      id: geom-meaning-check
      type: multipleChoice
      prompt: If $f(x)$ is measured in meters and $x$ in meters, what are the units of $\int_a^b f(x)\,dx$?
      choices:
      - id: a
        text: square meters
        media: []
        issueSignals: []
      - id: b
        text: meters per second
        media: []
        issueSignals: []
      - id: c
        text: meters
        media: []
        issueSignals: []
      - id: d
        text: unitless
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The integral combines a height in meters with a width $dx$ in meters, giving $\text{m}\cdot\text{m}=\text{m}^2$. Why it works: Unit multiplication follows the representative rectangle $f(x)\,dx$. Common trap: The integral does not retain only the units of the function. Why the other choices fail: Meters per second introduces time; meters omits the slice width; unitless omits both measurements.'
