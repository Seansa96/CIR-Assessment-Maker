  - id: geom-slice
    title: 2. Make one representative slice explicit
    required: true
    content: A vertical slice has thickness $dx$ and runs from a lower $y$-value to an upper $y$-value. Its height is not either curve alone; it is $y_{\mathrm{top}}-y_{\mathrm{bottom}}$. The integral adds the areas of these thin rectangles.
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Vertical rectangle with width dx and height upper curve minus lower curve
      caption: The slice height is a difference of measurements.
    check:
      id: geom-slice-check
      type: multipleChoice
      prompt: For the region between $y=x+4$ and $y=x^2$ on $0\le x\le2$, which expression is the vertical-slice height?
      choices:
      - id: a
        text: $x+4-x^2$
        media: []
        issueSignals: []
      - id: b
        text: $x^2-(x+4)$
        media: []
        issueSignals: []
      - id: c
        text: $x+4$
        media: []
        issueSignals: []
      - id: d
        text: $x^2$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: On $[0,2]$, $x+4$ lies above $x^2$, so height equals upper minus lower: $(x+4)-x^2$. Why it works: A vertical rectangle measures a change in $y$. Common trap: Reversing the order makes the area contribution negative. Why the other choices fail: The reversed difference has the wrong sign; either single curve omits the other boundary.'
