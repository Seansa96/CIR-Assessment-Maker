  - id: geom-variable
    title: 3. Let the slice direction choose the variable
    required: true
    content: Vertical slices vary in $x$, so their boundaries are naturally written as $y=f(x)$ and their thickness is $dx$. Horizontal slices vary in $y$, so their boundaries are written as $x=R(y)$ and $x=L(y)$ with thickness $dy$.
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Vertical slice showing top minus bottom measurement
      caption: 'Rotate the slice mentally: horizontal slices use right minus left instead.'
    check:
      id: geom-variable-check
      type: multipleChoice
      prompt: A horizontal slice through a region has right boundary $x=R(y)$ and left boundary $x=L(y)$. What is its length?
      choices:
      - id: a
        text: $R(y)-L(y)$
        media: []
        issueSignals: []
      - id: b
        text: $L(y)-R(y)$
        media: []
        issueSignals: []
      - id: c
        text: $R(y)+L(y)$
        media: []
        issueSignals: []
      - id: d
        text: $dy$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: A horizontal distance is right coordinate minus left coordinate, $R(y)-L(y)$. Why it works: The slice measures change in $x$ while $y$ is held fixed. Common trap: $dy$ is thickness, not the slice length. Why the other choices fail: Left minus right reverses sign; addition is not a distance between boundaries.'
