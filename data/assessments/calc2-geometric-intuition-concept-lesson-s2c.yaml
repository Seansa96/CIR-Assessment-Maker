  - id: geom-sign
    title: 5. Separate signed accumulation from geometric area
    required: true
    content: 'A definite integral is signed: a graph below the $x$-axis contributes negatively. Geometric area is nonnegative, so a region crossing an axis must be split or modeled with an absolute value. This distinction prevents a cancellation from being misreported as area.'
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Region model emphasizing measurement differences
      caption: Area uses a nonnegative slice measurement; signed integral may not.
    check:
      id: geom-sign-check
      type: multipleChoice
      prompt: Why can $\int_{-1}^{1}x\,dx=0$ even though the region between $y=x$ and the $x$-axis has positive geometric area?
      choices:
      - id: a
        text: The integral uses opposite signed contributions that cancel.
        media: []
        issueSignals: []
      - id: b
        text: The region has no width.
        media: []
        issueSignals: []
      - id: c
        text: Every odd function has zero area.
        media: []
        issueSignals: []
      - id: d
        text: $dx$ is zero.
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: The portion below the axis contributes negatively and cancels the equal positive portion above it. Why it works: A definite integral records signed accumulation. Common trap: Geometric area requires adding magnitudes, not cancelling them. Why the other choices fail: The region has width; oddness gives signed cancellation rather than zero area; $dx$ is a differential width, not zero.'
