  - id: geom-bounds
    title: 4. Bounds describe where the slice exists
    required: true
    content: 'The lower and upper bounds are not decoration: they tell the integral which slices to accumulate. Find them from intersections, stated endpoints, or the physical start and end of the region. A correct integrand with incorrect bounds models a different object.'
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Shaded region bounded by curves and endpoints
      caption: Bounds mark the first and last slice included in the model.
    check:
      id: geom-bounds-check
      type: multipleChoice
      prompt: If two curves intersect at $x=-1$ and $x=3$, which bounds describe all vertical slices between them?
      choices:
      - id: a
        text: $-1\le x\le3$
        media: []
        issueSignals: []
      - id: b
        text: $-1\le y\le3$
        media: []
        issueSignals: []
      - id: c
        text: $0\le x\le2$
        media: []
        issueSignals: []
      - id: d
        text: $x\ge3$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: Vertical slices are indexed by $x$, beginning at the left intersection $-1$ and ending at the right intersection $3$. Why it works: The interval lists every slice location once. Common trap: Do not use $y$-bounds unless the model uses horizontal slices. Why the other choices fail: The remaining choices omit part of the region or use the wrong variable.'
