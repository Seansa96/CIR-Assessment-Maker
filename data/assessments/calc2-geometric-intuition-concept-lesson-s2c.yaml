  - id: geom-units
    title: 6. Use units to check the model
    required: true
    content: A slice model has the form measurement $\times$ thickness. For area, length times length gives square units. For volume, cross-sectional area times length gives cubic units. If the units do not match the requested quantity, revisit the measurement assigned to the slice.
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Slice as measurement times thickness
      caption: Units provide a fast independent model check.
    check:
      id: geom-units-check
      type: multipleChoice
      prompt: A cross-sectional area $A(x)$ is measured in $\text{cm}^2$ and $x$ in cm. What are the units of $\int_a^bA(x)\,dx$?
      choices:
      - id: a
        text: $\text{cm}^3$
        media: []
        issueSignals: []
      - id: b
        text: $\text{cm}^2$
        media: []
        issueSignals: []
      - id: c
        text: cm
        media: []
        issueSignals: []
      - id: d
        text: $\text{cm}^{-1}$
        media: []
        issueSignals: []
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: 'Solution: $A(x)\,dx$ has units $\text{cm}^2\cdot\text{cm}=\text{cm}^3$, so the integral is a volume. Why it works: Cross-sectional area times thickness is a volume slice. Common trap: Do not report the units of $A(x)$ alone after integrating. Why the other choices fail: Square or linear units are missing one length factor; inverse length has no geometric interpretation here.'
