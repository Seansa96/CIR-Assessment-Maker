  - id: geom-workflow
    title: 7. Commit to a model before evaluating
    required: true
    content: 'Use a repeatable sequence: sketch the region or solid, choose slice direction, label its measurement and thickness, find bounds, write the integral, check units and sign, then evaluate. This workflow transfers directly to area, volume, arc length, surface area, and physical accumulation problems.'
    media:
    - type: image
      src: /media/calculus/geometric-slice-model.svg
      alt: Complete representative-slice diagram
      caption: Sketch
    check:
      id: geom-workflow-check
      type: freeResponse
      prompt: Before evaluating an integral for a geometric quantity, name the three pieces of information a representative slice must supply.
      choices: []
      answer:
