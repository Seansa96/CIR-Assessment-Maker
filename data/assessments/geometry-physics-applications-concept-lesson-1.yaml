lesson:
  introduction: |-
    Geometry is the language of Physics. When objects move, or when forces push on them, we describe those actions using geometric tools. The most fundamental of these tools is the **Vector**.
  sections:
  - id: sec-vectors
    title: What is a Vector?
    required: true
    content: |-
      In geometry, a line segment just has a length. A **Vector** is a directed line segment; it has both a **magnitude** (length) and a **direction** (an angle).
      
      Vectors are usually drawn as arrows. The starting point is the "tail" and the pointy end is the "head".
      
      We write vectors in component form as $\langle x, y \rangle$, which tells us how far to move horizontally and vertically from the tail to reach the head. For example, vector $\vec{v} = \langle 3, -2 \rangle$ means "go right $3$ units and down $2$ units".

  - id: sec-translations
    title: Translations as Vectors
    required: true
    content: |-
      A **translation** is a geometric transformation that slides a figure to a new position without rotating or resizing it. Every point in the figure is moved the exact same distance and in the exact same direction.
      
      This means a translation is perfectly described by a single vector!
      
      If you translate a triangle using the vector $\vec{v} = \langle 4, 1 \rangle$, you simply add $4$ to the $x$-coordinate and $1$ to the $y$-coordinate of every single vertex of the triangle.
      
      In physics, this vector could represent the **displacement** of an object (how far it moved and in what direction).

questions:
- id: q-geom-phys-1
  title: Concept Check - Vector Components
  prompt: |-
    A point starts at $(2, 5)$ and moves to the point $(6, 8)$. What is the component form of the vector that describes this translation?
  type: multipleChoice
  choices:
  - id: c1
    text: $\langle 4, 3 \rangle$
  - id: c2
    text: $\langle 8, 13 \rangle$
  - id: c3
    text: $\langle -4, -3 \rangle$
  - id: c4
    text: $\langle 3, 4 \rangle$
  answer:
    choiceId: c1
  explanation: |-
    To find the components of a vector from Point $A$ to Point $B$, subtract the starting coordinates from the ending coordinates.
    $x$-component: $6 - 2 = 4$
    $y$-component: $8 - 5 = 3$
    The vector is $\langle 4, 3 \rangle$.
  skills:
  - geometry-physics-applications

- id: q-geom-phys-2
  title: Concept Check - Applying a Translation
  prompt: |-
    A triangle has a vertex at $(-3, 4)$. It is translated by the vector $\vec{v} = \langle 5, -2 \rangle$. What are the coordinates of the new vertex?
  type: multipleChoice
  choices:
  - id: c1
    text: $(2, 2)$
  - id: c2
    text: $(-8, 6)$
  - id: c3
    text: $(-15, -8)$
  answer:
    choiceId: c1
  explanation: |-
    Add the vector components to the original coordinates.
    New $x$: $-3 + 5 = 2$
    New $y$: $4 + (-2) = 2$
    The new vertex is at $(2, 2)$.
  skills:
  - geometry-physics-applications
