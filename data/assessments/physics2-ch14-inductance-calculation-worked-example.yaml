workedExamples:
- id: we2
  title: Inductance of a Solenoid
  prompt: A solenoid of length $0.5\text{ m}$ has $1000$ turns and a cross-sectional
    area of $2.0 \times 10^{-3}\text{ m}^2$. Find its self-inductance.
  steps:
  - id: s1
    prompt: Use the formula for a solenoid's inductance.
    explanation: 'Solution:

      1) $L = \mu_0 n^2 A l$, where $n = N/l = 1000/0.5 = 2000\text{ turns/m}$.

      2) $L = (4\pi \times 10^{-7})(2000)^2 (2.0 \times 10^{-3})(0.5)$.

      3) $L = (4\pi \times 10^{-7})(4 \times 10^6)(1.0 \times 10^{-3}) = 16\pi \times
      10^{-4} \approx 5.03 \times 10^{-3}\text{ H} = 5.03\text{ mH}$.


      Why it works:

      The self-inductance depends purely on the geometry and number of turns of the
      coil.'
