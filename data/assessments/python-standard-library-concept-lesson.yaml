lesson:
  introduction: |
    Python comes with "batteries included". You don't need to write every piece of logic from scratch! 
    The Python Standard Library provides modules for common tasks like generating random numbers, doing complex math, or saving data to a file.
  sections:
    - id: importing-modules
      title: Importing Modules
      required: true
      content: |
        To use a module from the standard library, you must `import` it at the top of your file.

        ```python
        import math

        # Use the dot syntax to access functions inside the module
        health_bonus = math.floor(10.7)  # Rounds down to 10
        ```
        
        You can also import specific functions to avoid typing the module name every time:
        
        ```python
        from math import floor, ceil
        
        health_bonus = floor(10.7)
        ```
      check:
        id: importing-modules-check
        type: multipleChoice
        prompt: |
          Which is the correct way to import just the `sqrt` function from the `math` module?
        choices:
          - id: a
            text: '`import sqrt from math`'
          - id: b
            text: '`from math import sqrt`'
          - id: c
            text: '`import math.sqrt`'
          - id: d
            text: '`include <math.sqrt>`'
        answer:
          choiceId: b
        explanation: |
          The syntax is `from <module> import <function>`. This allows you to call `sqrt(25)` directly instead of `math.sqrt(25)`.

    - id: random-module
      title: The random Module
      required: true
      content: |
        In game development, randomness is essential for dice rolls, critical hits, and loot generation.
        The `random` module provides exactly this.

        ```python
        import random
        
        # Random integer between a and b (inclusive)
        d20_roll = random.randint(1, 20)
        print(f"You rolled a {d20_roll}!")
        
        # Pick a random item from a list
        loot_table = ["Sword", "Shield", "Gold", "Trash"]
        dropped_item = random.choice(loot_table)
        print(f"The monster dropped: {dropped_item}")
        ```
      check:
        id: random-module-check
        type: multipleChoice
        prompt: |
          If you want to simulate a 6-sided dice roll, what is the correct function call?
        choices:
          - id: a
            text: '`random.randint(1, 6)`'
          - id: b
            text: '`random.choice(6)`'
          - id: c
            text: '`random.rand(6)`'
          - id: d
            text: '`random.randint(0, 5)`'
        answer:
          choiceId: a
        explanation: |
          `randint(a, b)` returns a random integer N such that `a <= N <= b`. To get 1 through 6, you must pass 1 and 6.

    - id: os-and-json
      title: The os and json Modules
      required: true
      content: |
        If you want to create a Save System for your RPG, you'll need the `os` and `json` modules.
        
        - `os.path` helps you check if files exist before loading them.
        - `json` helps you convert Python dictionaries into text (to save to a file) and back again (to load).

        ```python
        import os
        import json
        
        # Saving data (dict to JSON string)
        player_data = {"name": "Arthur", "level": 5}
        json_string = json.dumps(player_data)
        
        # Checking if a save file exists
        if os.path.exists("savegame.json"):
            print("Save file found! Loading game...")
        else:
            print("No save found. Starting new game...")
        ```
      check:
        id: os-and-json-check
        type: multipleChoice
        prompt: |
          What does `json.dumps()` do?
        choices:
          - id: a
            text: It deletes a JSON file from the hard drive.
          - id: b
            text: It converts a Python dictionary into a JSON-formatted string.
          - id: c
            text: It converts a JSON-formatted string into a Python dictionary.
          - id: d
            text: It downloads a JSON file from the internet.
        answer:
          choiceId: b
        explanation: |
          `dumps` stands for "dump string". It takes a Python object (like a dict) and outputs a string. The opposite is `loads` ("load string").
