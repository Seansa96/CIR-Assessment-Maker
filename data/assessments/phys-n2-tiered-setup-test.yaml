schemaVersion: 1
id: phys-n2-tiered-setup-test
title: Newton's Laws - Tiered Setup Test
assessmentType: test
categoryId: physics-1
subcategoryIds:
- physics-newton-laws
navigation:
  learningGoal: evaluate
  activityType: formalTest
  tags:
  - translation-only
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 20
questions:
- id: n2-test-t1-1
  type: multipleChoice
  prompt: '[Tier 1: Direct] Set up Newton''s Second Law for a block of mass $m$ pushed
   \rhorizontally with force $F$ on a frictionless surface.'
  choices:
  - id: a
    text: $\Sigma F_x = F = m a_x$
  - id: b
    text: $\Sigma F_x = F - mg = m a_x$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The simplest direct application. Gravity and
    normal force cancel in the y-direction.'
- id: n2-test-t2-1
  type: multipleChoice
  prompt: '[Tier 2: Disguised] Set up the y-equation for a block of mass $m$ pulled
    by a rope at an upward angle $\theta$ with tension $T$. The block does not leave
    the floor.'
  choices:
  - id: a
    text: $\Sigma F_y = N + T\sin\theta - mg = 0$
  - id: b
    text: $\Sigma F_y = N - mg = 0$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The normal force is reduced because the tension
    provides some upward lift.'
- id: n2-test-t3-1
  type: multipleChoice
  prompt: '[Tier 3: Exam-Style] Two blocks $m_1$ and $m_2$ are in contact on a frictionless
    table. A force $F$ pushes on $m_1$. Set up the equation to find the contact force
    $F_c$ between them.'
  choices:
  - id: a
    text: 'Treat as a system to find $a = F / (m_1+m_2)$, then isolate $m_2$: $F_c
      = m_2 a$.'
  - id: b
    text: $F_c = F$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** The internal contact force depends entirely
    on the mass being accelerated by that specific boundary.'
- id: n2-test-t4-1
  type: multipleChoice
  prompt: '[Tier 4: Novel] A pendulum hangs from the ceiling of a train accelerating
   \rhorizontally at $a$. Set up the equations to find the angle $\theta$ it hangs
    at equilibrium relative to the train.'
  choices:
  - id: a
    text: $T\sin\theta = ma$ and $T\cos\theta = mg$
  - id: b
    text: $T = ma$ and $mg = 0$
  answer:
    choiceId: a
  explanation: '**Instructor Notes:** In the ground frame, the tension must provide
    the\rhorizontal acceleration $ma$ while balancing gravity $mg$.'
