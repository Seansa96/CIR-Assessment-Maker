modeDefault: practice
randomizeQuestions: true
attemptQuestionCount: 15
questions:
  - id: n2-tier-q01
    title: Level 1 - Net Force 1D
    type: symbolicResponse
    prompt: |
      A block of mass $m$ is pushed to the right with force $F_1$ and pushed to the left with force $F_2$. Enter the expression for the net horizontal force on the block (assuming right is positive).
    answer:
      expectedLatex: F_1 - F_2
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Net force is the vector sum of all forces. Since $F_1$ is positive (right) and $F_2$ is negative (left), $\Sigma F = F_1 - F_2$.

  - id: n2-tier-q02
    title: Level 1 - Acceleration 1D
    type: symbolicResponse
    prompt: |
      For the block in the previous question (mass $m$, pushed right by $F_1$, left by $F_2$), enter the expression for its horizontal acceleration $a$.
    answer:
      expectedLatex: (F_1 - F_2)/m
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      $\Sigma F = ma \implies F_1 - F_2 = ma \implies a = \frac{F_1 - F_2}{m}$.

  - id: n2-tier-q03
    title: Level 2 - Elevating a Mass
    type: symbolicResponse
    prompt: |
      A crane lifts a crate of mass $m$ upwards with an acceleration $a$. Write the expression for the tension $T$ in the lifting cable. Use $g$ for gravity.
    answer:
      expectedLatex: m*(g + a)
      aliases:
        - m*g + m*a
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Let up be positive. Forces on the crate are $T$ (up) and $mg$ (down).
      $\Sigma F_y = ma \implies T - mg = ma \implies T = mg + ma = m(g + a)$.

  - id: n2-tier-q04
    title: Level 2 - Accelerating Downward
    type: symbolicResponse
    prompt: |
      The crane now lowers the crate of mass $m$ such that it accelerates downwards with magnitude $a$. Enter the expression for the tension $T$ in the cable.
    answer:
      expectedLatex: m*(g - a)
      aliases:
        - m*g - m*a
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Let down be positive (since it accelerates down).
      $mg - T = ma \implies T = mg - ma = m(g - a)$.

  - id: n2-tier-q05
    title: Level 1 - Apparent Weight (Weightless)
    type: symbolicResponse
    prompt: |
      If the crane cable snaps, the crate falls freely. What is the expression for the tension $T$ during this free fall?
    answer:
      expectedLatex: 0
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      In free fall, the downward acceleration is exactly $g$.
      $T = m(g - g) = 0$. The cable is slack, providing no force.

  - id: n2-tier-q06
    title: Level 2 - Components of a Pull
    type: symbolicResponse
    prompt: |
      You pull a box of mass $m$ across a smooth (frictionless) floor with a force $F$ directed at an angle $\theta$ above the horizontal. Enter the expression for the horizontal acceleration $a$.
    answer:
      expectedLatex: F*\cos(\theta)/m
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The horizontal component of the pull is $F\cos\theta$. Since there is no friction, this is the only horizontal force.
      $\Sigma F_x = ma \implies F\cos\theta = ma \implies a = \frac{F\cos\theta}{m}$.

  - id: n2-tier-q07
    title: Level 3 - Normal Force with Angled Pull
    type: symbolicResponse
    prompt: |
      For the box in the previous question (mass $m$, pulled by $F$ at angle $\theta$ above horizontal), enter the expression for the normal force $N$ exerted by the floor.
    answer:
      expectedLatex: m*g - F*\sin(\theta)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Vertical forces must balance (no vertical acceleration).
      $N$ (up) + $F\sin\theta$ (up) = $mg$ (down).
      $N = mg - F\sin\theta$.

  - id: n2-tier-q08
    title: Level 2 - Atwood Machine Acceleration
    type: symbolicResponse
    prompt: |
      Two masses $m_1$ and $m_2$ ($m_1 > m_2$) hang from a massless string over a frictionless pulley. Enter the expression for the magnitude of their acceleration $a$.
    answer:
      expectedLatex: g*(m_1 - m_2)/(m_1 + m_2)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      System approach: The driving force is gravity on $m_1$ ($m_1 g$) and the opposing force is gravity on $m_2$ ($m_2 g$). Total mass is $m_1 + m_2$.
      $a = \frac{F_\text{net}}{m_\text{tot}} = \frac{m_1 g - m_2 g}{m_1 + m_2} = g \frac{m_1 - m_2}{m_1 + m_2}$.

  - id: n2-tier-q09
    title: Level 3 - Atwood Machine Tension
    type: symbolicResponse
    prompt: |
      For the same Atwood machine ($m_1 > m_2$), enter the expression for the tension $T$ in the string.
    answer:
      expectedLatex: 2*m_1*m_2*g/(m_1 + m_2)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Look at $m_2$ (accelerating up): $T - m_2 g = m_2 a \implies T = m_2(g + a)$.
      Substitute $a$: $T = m_2 \left( g + g \frac{m_1 - m_2}{m_1 + m_2} \right) = m_2 g \left( 1 + \frac{m_1 - m_2}{m_1 + m_2} \right)$.
      $T = m_2 g \left( \frac{m_1 + m_2 + m_1 - m_2}{m_1 + m_2} \right) = m_2 g \left( \frac{2m_1}{m_1 + m_2} \right) = \frac{2m_1 m_2 g}{m_1 + m_2}$.

  - id: n2-tier-q10
    title: Level 2 - Two blocks pushed together
    type: symbolicResponse
    prompt: |
      A horizontal force $F$ pushes against block A (mass $m_A$), which pushes against block B (mass $m_B$). They slide together on a frictionless surface. Enter the expression for the acceleration $a$ of the two-block system.
    answer:
      expectedLatex: F/(m_A + m_B)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Treat them as a single system of mass $(m_A + m_B)$ being pushed by external force $F$.
      $a = \frac{F}{m_A + m_B}$.

  - id: n2-tier-q11
    title: Level 3 - Contact Force between blocks
    type: symbolicResponse
    prompt: |
      In the previous scenario (Force $F$ pushes block A, which pushes block B), enter the expression for the contact force $F_{AB}$ that block A exerts on block B.
    answer:
      expectedLatex: F*m_B/(m_A + m_B)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Look only at block B. The only horizontal force on it is $F_{AB}$.
      $F_{AB} = m_B a$.
      Substitute $a = \frac{F}{m_A + m_B}$.
      $F_{AB} = \frac{F m_B}{m_A + m_B}$.

  - id: n2-tier-q12
    title: Level 2 - Car towing a trailer
    type: symbolicResponse
    prompt: |
      A car of mass $M$ provides a forward driving force $F_d$. It tows a trailer of mass $m$. Ignore friction and air resistance. Enter the expression for the tension $T$ in the tow hitch.
    answer:
      expectedLatex: F_d*m/(M + m)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Total acceleration is $a = \frac{F_d}{M + m}$.
      The trailer is pulled only by the tension $T$.
      $T = ma = m \left( \frac{F_d}{M + m} \right)$.

  - id: n2-tier-q13
    title: Level 1 - Centripetal Acceleration Formula
    type: symbolicResponse
    prompt: |
      An object of mass $m$ moves in a circle of radius $R$ at a constant speed $v$. Enter the expression for the required net force (centripetal force) $F_c$.
    answer:
      expectedLatex: m*v^2/R
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Centripetal acceleration is $a_c = v^2/R$.
      By Newton's Second Law, $F_\text{net} = ma_c = \frac{mv^2}{R}$.

  - id: n2-tier-q14
    title: Level 2 - Conical Pendulum Setup
    type: symbolicResponse
    prompt: |
      A mass $m$ hangs from a string of length $L$. It swings in a horizontal circle, tracing out a cone. The string makes an angle $\theta$ with the vertical. The only vertical forces are gravity and the vertical component of tension. Enter the expression for the tension $T$.
    answer:
      expectedLatex: m*g/\cos(\theta)
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      The mass does not accelerate vertically.
      Upward force is $T\cos\theta$ (since $\theta$ is with the vertical). Downward is $mg$.
      $T\cos\theta = mg \implies T = \frac{mg}{\cos\theta}$.

  - id: n2-tier-q15
    title: Level 3 - Unbanked Curve Maximum Speed
    type: symbolicResponse
    prompt: |
      A car (mass $m$) navigates a flat, unbanked curve of radius $R$. The coefficient of static friction is $\mu_s$. Enter the expression for the maximum safe speed $v_\text{max}$ before skidding.
    answer:
      expectedLatex: \sqrt{\mu_s*g*R}
      equivalenceMode: expression
      tolerance: 0
    explanation: |
      Static friction provides the centripetal force: $f_s = \frac{mv^2}{R}$.
      Maximum friction is $f_{s,\max} = \mu_s N = \mu_s mg$.
      Set them equal: $\mu_s mg = \frac{mv_\text{max}^2}{R}$.
      Masses cancel: $\mu_s g = \frac{v_\text{max}^2}{R} \implies v_\text{max} = \sqrt{\mu_s g R}$.
