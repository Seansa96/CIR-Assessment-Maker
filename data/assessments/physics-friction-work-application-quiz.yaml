questions:
- id: q-friction-slide
  title: Sliding to a Stop
  type: symbolicResponse
  prompt: "A $2.0\\text{ kg}$ block slides on a rough horizontal floor ($\\mu_k = 0.25$, $g = 10\\text{ m/s}^2$). It starts with a speed of $4.0\\text{ m/s}$. \nHow far $d$ (in meters) does the block slide before coming to a complete stop?\n"
  answer:
    gradingMode: auto
    expectedLatex: 3.2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    First, find the friction force: $f_k = \mu_k mg = (0.25)(2.0)(10) = 5.0\text{ N}$.
    The change in kinetic energy is $\Delta K = K_f - K_i = 0 - \frac{1}{2}(2.0)(4.0)^2 = -16\text{ J}$.
    By the energy theorem, $W_f = \Delta K \implies -f_k d = -16$.
    $-5.0 d = -16 \implies d = 3.2\text{ m}$.
