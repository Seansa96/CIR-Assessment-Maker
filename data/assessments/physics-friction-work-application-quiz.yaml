questions:
- id: q-friction-slide
  title: Sliding to a Stop
  type: symbolicResponse
  prompt: |
    A $2.0\text{ kg}$ block slides on a rough horizontal floor ($\mu_k = 0.25$, $g = 10\text{ m/s}^2$). It starts with a speed of $4.0\text{ m/s}$. 
    How far $d$ (in meters) does the block slide before coming to a complete stop?
  answer:
    gradingMode: auto
    expectedLatex: 3.2
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    First, find the friction force: $f_k = \mu_k mg = (0.25)(2.0)(10) = 5.0\text{ N}$.
    The change in kinetic energy is $\Delta K = K_f - K_i = 0 - \frac{1}{2}(2.0)(4.0)^2 = -16\text{ J}$.
    By the energy theorem, $W_f = \Delta K \implies -f_k d = -16$.
    $-5.0 d = -16 \implies d = 3.2\text{ m}$.
  skills:
  - physics-work-energy
- id: q-friction-incline
  title: Sliding Down an Incline
  type: symbolicResponse
  prompt: |
    A $5.0\text{ kg}$ block slides $3.0\text{ m}$ down a rough ramp inclined at $37^\circ$ to the horizontal. The coefficient of kinetic friction is $\mu_k = 0.20$.
    Use $g = 10\text{ m/s}^2$, $\sin(37^\circ) = 0.6$, and $\cos(37^\circ) = 0.8$.
    Calculate the work done (in Joules) strictly by the force of kinetic friction on the block.
  answer:
    gradingMode: auto
    expectedLatex: -24
    equivalenceMode: expression
    tolerance: 0.1
  explanation: |
    The normal force on an incline is $N = mg \cos\theta$.
    $N = (5.0)(10)(0.8) = 40\text{ N}$.
    The kinetic friction force is $f_k = \mu_k N = (0.20)(40) = 8.0\text{ N}$.
    Friction acts exactly opposite to the direction of motion, so the work done by friction is $W_f = -f_k d$.
    $W_f = -(8.0\text{ N})(3.0\text{ m}) = -24\text{ J}$.
  skills:
  - physics-work-energy
- id: q-friction-coefficient
  title: Finding the Friction Coefficient
  type: symbolicResponse
  prompt: |
    A $50\text{ kg}$ crate is given an initial velocity of $6.0\text{ m/s}$ on a flat floor and slides a distance of $9.0\text{ m}$ before stopping.
    Using energy methods and assuming $g = 10\text{ m/s}^2$, determine the coefficient of kinetic friction $\mu_k$ between the crate and the floor.
  answer:
    gradingMode: auto
    expectedLatex: 0.2
    equivalenceMode: expression
    tolerance: 0.05
  explanation: |
    The initial kinetic energy is $K_i = \frac{1}{2}mv_i^2 = \frac{1}{2}(50)(6.0)^2 = 25(36) = 900\text{ J}$.
    The final kinetic energy is $K_f = 0$.
    The work done by friction is $W_f = \Delta K = -900\text{ J}$.
    We also know $W_f = -f_k d = -(\mu_k mg) d$.
    $-(\mu_k (50)(10))(9.0) = -900$
    $-4500 \mu_k = -900 \implies \mu_k = \frac{900}{4500} = \frac{1}{5} = 0.2$.
  skills:
  - physics-work-energy
