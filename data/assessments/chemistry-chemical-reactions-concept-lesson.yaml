lesson:
  introduction: 'While there are millions of possible chemical reactions, almost all
    of them in general chemistry fall into one of three major classes: precipitation
    reactions, acid-base reactions, and oxidation-reduction (redox) reactions. Recognizing
    these patterns allows you to predict what products will form when two substances
    are mixed.

    '
  sections:
  - id: precipitation
    title: Precipitation Reactions
    required: true
    content: 'A **precipitation reaction** occurs when two aqueous solutions of soluble
      salts are mixed, and they react to form an insoluble solid product called a
      **precipitate**.


      This is a type of **double-displacement** (or metathesis) reaction, where the
      cations and anions "swap partners."

      General form: AB(aq) + CD(aq) → AD(s) + CB(aq)


      **Example:** Mixing silver nitrate and sodium chloride.

      $$

      \text{AgNO}_3(aq) + \text{NaCl}(aq) \rightarrow \text{AgCl}(s) + \text{NaNO}_3(aq)

      $$


      How do you know AgCl is solid? You must use **solubility rules**:

      - Most nitrates (NO3⁻) and alkali metal (Group 1) salts are soluble. (NaNO3
      is soluble, stays aq).

      - Most chlorides (Cl⁻) are soluble, *except* those of Ag⁺, Pb²⁺, and Hg₂²⁺.
      (AgCl is insoluble, becomes s).

      '
    check:
      id: precipitation-check
      type: multipleChoice
      prompt: 'Which of the following describes the key event in a precipitation reaction?

        '
      choices:
      - id: a
        text: Two soluble ionic compounds in solution react to form an insoluble solid
          product.
      - id: b
        text: A solid dissolves into a liquid solvent.
      - id: c
        text: Electrons are transferred from one atom to another.
      - id: d
        text: An acid neutralizes a base to form water.
      answer:
        choiceId: a
      explanation: 'A precipitation reaction specifically involves the formation of
        an insoluble solid (the precipitate) from the mixing of two aqueous solutions.

        '
  - id: acid-base
    title: Acid-Base (Neutralization) Reactions
    required: true
    content: 'An **acid-base reaction** (specifically an Arrhenius neutralization)
      involves an acid reacting with a base to form water and an ionic salt.


      - **Acid**: A substance that produces H⁺ ions in solution.

      - **Base**: A substance that produces OH⁻ ions in solution.


      General form: Acid + Base → Water + Salt

      $$

      \text{HCl}(aq) + \text{NaOH}(aq) \rightarrow \text{H}_2\text{O}(l) + \text{NaCl}(aq)

      $$


      The driving force for this reaction is the formation of the very stable water
      molecule from H⁺ and OH⁻ ions. The remaining ions (Na⁺ and Cl⁻) stay dissolved
      in solution as the "salt."


      If you perform a titration and exactly balance the moles of H⁺ and OH⁻, the
      resulting solution is neutral.

      '
    check:
      id: acid-base-check
      type: multipleChoice
      prompt: 'When sulfuric acid (H2SO4) reacts completely with potassium hydroxide
        (KOH), what are the products?

        '
      choices:
      - id: a
        text: Water (H2O) and potassium sulfate (K2SO4)
      - id: b
        text: Hydrogen gas (H2) and potassium sulfate (K2SO4)
      - id: c
        text: Water (H2O) and potassium sulfide (K2S)
      - id: d
        text: Potassium hydride (KH) and sulfur dioxide (SO2)
      answer:
        choiceId: a
      explanation: 'This is an acid-base neutralization. The H⁺ from the acid and
        OH⁻ from the base form water. The remaining cation (K⁺) and anion (SO4²⁻)
        form the salt, potassium sulfate (K2SO4).

        '
  - id: redox
    title: Oxidation-Reduction (Redox) Reactions
    required: true
    content: '**Redox reactions** involve the **transfer of electrons** from one reactant
      to another. They include combustion, rusting, batteries, and single-displacement
      reactions.


      Key definitions (remember "OIL RIG" - Oxidation Is Loss, Reduction Is Gain):

      - **Oxidation**: The loss of electrons.

      - **Reduction**: The gain of electrons.

      - Oxidation and reduction *always* occur together. If one thing loses electrons,
      something else must gain them.


      **Example: Metal with acid**

      $$

      \text{Zn}(s) + 2\text{HCl}(aq) \rightarrow \text{ZnCl}_2(aq) + \text{H}_2(g)

      $$

      - Zinc metal starts neutral (0 charge) and becomes Zn²⁺. It lost 2 electrons
      → **Zn is oxidized**.

      - Hydrogen starts as H⁺ and becomes neutral H₂ gas (0 charge). It gained electrons
      → **H⁺ is reduced**.

      - Chloride (Cl⁻) stays Cl⁻ on both sides. It is a "spectator ion" and is neither
      oxidized nor reduced.

      '
    check:
      id: redox-check
      type: multipleChoice
      prompt: 'In the reaction 2Na(s) + Cl2(g) → 2NaCl(s), which element is reduced?

        '
      choices:
      - id: a
        text: Chlorine (Cl) — it goes from neutral Cl2 to Cl-, gaining an electron.
      - id: b
        text: Sodium (Na) — it goes from neutral Na to Na+, losing an electron.
      - id: c
        text: Both sodium and chlorine are reduced.
      - id: d
        text: Neither; this is not a redox reaction.
      answer:
        choiceId: a
      explanation: 'Reduction is the gain of electrons. Chlorine starts as a neutral
        element (0) and ends as the chloride ion (-1). Its charge went down (was reduced)
        because it gained electrons. Sodium is oxidized (loses electrons).

        '
  - id: complete-net-ionic
    title: Complete and Net Ionic Equations
    required: true
    content: 'To truly understand what happens in aqueous reactions, chemists write
      equations that show the actual species present.


      **1. Molecular Equation**: Shows all reactants and products as intact compounds.

      AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)


      **2. Complete Ionic Equation**: Shows all *strong electrolytes* completely dissociated
      into ions. (Leave solids, liquids, gases, and weak electrolytes intact).

      Ag⁺(aq) + NO₃⁻(aq) + Na⁺(aq) + Cl⁻(aq) → AgCl(s) + Na⁺(aq) + NO₃⁻(aq)


      **3. Net Ionic Equation**: Removes the **spectator ions** (ions that appear
      unchanged on both sides of the equation). In this case, Na⁺ and NO₃⁻ just watch
      the reaction happen.

      **Ag⁺(aq) + Cl⁻(aq) → AgCl(s)**


      The net ionic equation reveals the core chemical change taking place.

      '
    check:
      id: net-ionic-check
      type: multipleChoice
      prompt: 'What is the net ionic equation for the reaction between strong acid
        HCl(aq) and strong base NaOH(aq)?

        Molecular: HCl(aq) + NaOH(aq) → H2O(l) + NaCl(aq)

        '
      choices:
      - id: a
        text: H+(aq) + OH-(aq) → H2O(l)
      - id: b
        text: H+(aq) + Cl-(aq) + Na+(aq) + OH-(aq) → H2O(l) + Na+(aq) + Cl-(aq)
      - id: c
        text: Na+(aq) + Cl-(aq) → NaCl(aq)
      - id: d
        text: HCl(aq) + OH-(aq) → H2O(l) + Cl-(aq)
      answer:
        choiceId: a
      explanation: 'Complete ionic: H⁺ + Cl⁻ + Na⁺ + OH⁻ → H₂O(l) + Na⁺ + Cl⁻.

        Na⁺ and Cl⁻ are spectator ions. Canceling them leaves the net ionic equation:
        H⁺(aq) + OH⁻(aq) → H₂O(l). This is the net ionic equation for *any* strong
        acid-strong base reaction!

        '
