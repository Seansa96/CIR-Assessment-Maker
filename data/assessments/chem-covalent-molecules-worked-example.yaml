workedExamples:
  - id: we-bond-types-sigma-pi
    title: Counting Sigma and Pi Bonds in Common Molecules
    problem: |
      For each of the following molecules, determine: (a) the bond order of each unique bond, and (b) the total number of sigma ($\sigma$) and pi ($\pi$) bonds.

      Molecules: $HCN$, $C_2H_4$ (ethylene), $C_2H_2$ (acetylene).
    steps:
      - id: s1-hcn
        title: 'HCN — Hydrogen Cyanide'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Consider the analysis and continue.
        instruction: |
          Draw the Lewis structure of $HCN$:

          $$
          H\text{—}C \equiv N
          $$

          - H—C bond: **single bond**, bond order = 1 → 1 $\sigma$
          - C≡N bond: **triple bond**, bond order = 3 → 1 $\sigma$ + 2 $\pi$

          **Total for HCN: 2 $\sigma$ bonds, 2 $\pi$ bonds.**

          Formal charges: H = 0; C: $4 - 0 - 4 = 0$; N: $5 - 2 - 3 = 0$. All zero — this is the best structure.

      - id: s2-c2h4
        title: 'C₂H₄ — Ethylene'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Consider the analysis and continue.
        instruction: |
          The Lewis structure of $C_2H_4$:

          $$
          H_2C\text{=}CH_2
          $$

          Each carbon forms a double bond to the other carbon and single bonds to two H atoms.

          - 4 C—H single bonds: each is 1 $\sigma$ → **4 $\sigma$**
          - 1 C=C double bond: 1 $\sigma$ + 1 $\pi$ → **1 $\sigma$, 1 $\pi$**

          **Total for C₂H₄: 5 $\sigma$ bonds, 1 $\pi$ bond.**

          The π bond in ethylene is responsible for its restricted rotation. Geometric (cis/trans) isomers of substituted ethylenes are stable because breaking the π bond to rotate requires ~270 kJ/mol.

      - id: s3-c2h2
        title: 'C₂H₂ — Acetylene'
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Consider the analysis and continue.
        instruction: |
          The Lewis structure of $C_2H_2$:

          $$
          H\text{—}C \equiv C\text{—}H
          $$

          - 2 C—H single bonds: each is 1 $\sigma$ → **2 $\sigma$**
          - 1 C≡C triple bond: 1 $\sigma$ + 2 $\pi$ → **1 $\sigma$, 2 $\pi$**

          **Total for C₂H₂: 3 $\sigma$ bonds, 2 $\pi$ bonds.**

          Acetylene is linear ($180°$) at each C because each C has only 2 electron domains (one bond to H, one triple bond to the other C).

  - id: we-bond-energy-enthalpy
    title: Using Bond Energies to Estimate ΔH for a Reaction
    problem: |
      Use average bond energies to estimate $\Delta H$ for the hydrogenation of ethylene:

      $$
      H_2C\text{=}CH_2(g) + H_2(g) \longrightarrow H_3C\text{—}CH_3(g)
      $$

      Average bond energies: C—H = 413 kJ/mol; C=C = 614 kJ/mol; C—C = 347 kJ/mol; H—H = 436 kJ/mol.
    steps:
      - id: s4-identify-bonds-broken
        title: Identify Bonds Broken (Reactant Side)
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Consider the bond-breaking analysis and continue.
        instruction: |
          Look at the reactants: $C_2H_4$ and $H_2$.

          Bonds broken in **$H_2C=CH_2$**:
          - 4 C—H bonds: $4 \times 413 = 1652$ kJ
          - 1 C=C bond: $1 \times 614 = 614$ kJ

          Bonds broken in **$H_2$**:
          - 1 H—H bond: $1 \times 436 = 436$ kJ

          $$
          \sum D(\text{bonds broken}) = 1652 + 614 + 436 = \mathbf{2702 \text{ kJ}}
          $$

      - id: s5-identify-bonds-formed
        title: Identify Bonds Formed (Product Side)
        type: freeResponse
        answer:
          gradingMode: selfCheck
        prompt: Consider the bond-forming analysis and continue.
        instruction: |
          Look at the product: $H_3C$—$CH_3$ (ethane).

          Bonds formed in **$CH_3CH_3$**:
          - 6 C—H bonds: $6 \times 413 = 2478$ kJ
          - 1 C—C bond: $1 \times 347 = 347$ kJ

          $$
          \sum D(\text{bonds formed}) = 2478 + 347 = \mathbf{2825 \text{ kJ}}
          $$

      - id: s6-calculate-delta-h
        title: Calculate ΔH and Interpret
        type: numericResponse
        answer:
          value: -123
          tolerance: 5
        prompt: |
          Calculate $\Delta H$ using the formula:

          $$
          \Delta H \approx \sum D(\text{broken}) - \sum D(\text{formed})
          $$

          Enter your answer in kJ (negative for exothermic).
        instruction: |
          $$
          \Delta H \approx 2702 - 2825 = -123 \text{ kJ/mol}
          $$

          The reaction is **exothermic** ($\Delta H < 0$). This makes physical sense — converting a π bond (weak, ~267 kJ of the C=C minus C—C) into two C—H bonds and a C—C single bond releases energy.

          The experimental value is −137 kJ/mol, so our estimate is within about 10% — reasonable for average bond energies.
