items:
- id: group-1a-elements
  type: typed
  prompt: 'List the common Group 1A elements in order, treating hydrogen as the special
    nonmetal at the top.

    '
  answer:
    expected: hydrogen, lithium, sodium, potassium, rubidium, cesium, francium
    aliases:
    - H, Li, Na, K, Rb, Cs, Fr
  explanation: 'Group 1A is H, Li, Na, K, Rb, Cs, Fr. The metals in this group commonly
    form 1+ ions: Li+, Na+, K+, Rb+, Cs+, and Fr+.

    '
  tags:
  - group-1a
  - common-ions
- id: group-1a-ion
  type: cloze
  prompt: 'Complete:


    Alkali metals usually form ions with a charge of ____.

    '
  answer:
    expected: 1+
    aliases:
    - 1
  explanation: 'Group 1A metals have one valence electron and usually lose it to form
    1+ cations.

    '
  tags:
  - group-1a
  - common-ions
- id: group-2a-elements
  type: typed
  prompt: 'List the common Group 2A elements in order.

    '
  answer:
    expected: beryllium, magnesium, calcium, strontium, barium, radium
    aliases:
    - Be, Mg, Ca, Sr, Ba, Ra
  explanation: 'Group 2A is Be, Mg, Ca, Sr, Ba, Ra. These alkaline earth metals commonly
    form 2+ ions.

    '
  tags:
  - group-2a
  - common-ions
- id: magnesium-ion
  type: flashcard
  prompt: 'What common ion does magnesium form?

    '
  answer:
    expected: Mg2+
    aliases:
    - magnesium ion is 2+
    - Mg 2+
  explanation: 'Magnesium is in Group 2A, so it usually loses two valence electrons
    to form Mg2+.

    '
  tags:
  - group-2a
  - common-ions
- id: group-3a-elements
  type: typed
  prompt: 'List the common Group 3A elements.

    '
  answer:
    expected: boron, aluminum, gallium, indium, thallium
    aliases:
    - B, Al, Ga, In, Tl
  explanation: 'Group 3A is B, Al, Ga, In, Tl. In introductory ionic naming, aluminum
    is especially important because it forms Al3+.

    '
  tags:
  - group-3a
  - common-ions
- id: aluminum-ion
  type: cloze
  prompt: 'Complete:


    Aluminum commonly forms the ion ____.

    '
  answer:
    expected: Al3+
    aliases:
    - Al 3+
    - aluminum 3+
  explanation: 'Aluminum is a Group 3A metal and commonly forms Al3+.

    '
  tags:
  - group-3a
  - common-ions
- id: group-4a-elements
  type: typed
  prompt: 'List the common Group 4A elements.

    '
  answer:
    expected: carbon, silicon, germanium, tin, lead
    aliases:
    - C, Si, Ge, Sn, Pb
  explanation: 'Group 4A is C, Si, Ge, Sn, Pb. This group is less useful for simple
    fixed-charge ion memorization because carbon and silicon are usually covalent,
    while tin and lead commonly have variable charges.

    '
  tags:
  - group-4a
  - common-ions
- id: tin-lead-variable
  type: flashcard
  prompt: 'Which common Group 4A metals often require Roman numerals in ionic compound
    names?

    '
  answer:
    expected: tin and lead, commonly Sn2+/Sn4+ and Pb2+/Pb4+
    aliases:
    - Sn and Pb
    - tin and lead
  explanation: 'Tin and lead can form multiple cations, so names like tin(II), tin(IV),
    lead(II), and lead(IV) are used.

    '
  tags:
  - group-4a
  - variable-charge-metals
- id: group-5a-elements
  type: typed
  prompt: 'List the common Group 5A elements.

    '
  answer:
    expected: nitrogen, phosphorus, arsenic, antimony, bismuth
    aliases:
    - N, P, As, Sb, Bi
  explanation: 'Group 5A is N, P, As, Sb, Bi. Nitrogen and phosphorus commonly form
    3- anions in simple ionic patterns.

    '
  tags:
  - group-5a
  - common-ions
- id: nitride-phosphide-charge
  type: cloze
  prompt: 'Complete:


    Nitride and phosphide ions usually have a charge of ____.

    '
  answer:
    expected: 3-
    aliases:
    - -3
  explanation: 'Group 5A nonmetals often gain three electrons to reach a noble-gas-like
    valence shell, forming 3- anions.

    '
  tags:
  - group-5a
  - common-ions
- id: group-6a-elements
  type: typed
  prompt: 'List the common Group 6A elements.

    '
  answer:
    expected: oxygen, sulfur, selenium, tellurium, polonium
    aliases:
    - O, S, Se, Te, Po
  explanation: 'Group 6A is O, S, Se, Te, Po. Oxygen and sulfur are especially common
    in introductory ionic compounds.

    '
  tags:
  - group-6a
  - common-ions
- id: oxide-sulfide-charge
  type: cloze
  prompt: 'Complete:


    Oxide and sulfide ions usually have a charge of ____.

    '
  answer:
    expected: 2-
    aliases:
    - -2
  explanation: 'Group 6A nonmetals commonly gain two electrons, forming 2- anions
    such as O2- and S2-.

    '
  tags:
  - group-6a
  - common-ions
- id: group-7a-elements
  type: typed
  prompt: 'List the common Group 7A halogens.

    '
  answer:
    expected: fluorine, chlorine, bromine, iodine, astatine
    aliases:
    - F, Cl, Br, I, At
  explanation: 'Group 7A is F, Cl, Br, I, At. These halogens commonly form 1- anions.

    '
  tags:
  - group-7a
  - common-ions
- id: halide-charge
  type: cloze
  prompt: 'Complete:


    Fluoride, chloride, bromide, and iodide usually have a charge of ____.

    '
  answer:
    expected: 1-
    aliases:
    - -1
  explanation: 'Halogens have seven valence electrons and commonly gain one electron
    to form 1- ions.

    '
  tags:
  - group-7a
  - common-ions
- id: group-8a-elements
  type: typed
  prompt: 'List the common Group 8A noble gases.

    '
  answer:
    expected: helium, neon, argon, krypton, xenon, radon
    aliases:
    - He, Ne, Ar, Kr, Xe, Rn
  explanation: 'Group 8A is He, Ne, Ar, Kr, Xe, Rn. They normally do not form common
    monatomic ions in introductory chemistry.

    '
  tags:
  - group-8a
  - common-ions
- id: noble-gas-common-ion
  type: flashcard
  prompt: 'What common ion charge should you memorize for noble gases in introductory
    ionic naming?

    '
  answer:
    expected: none; noble gases usually do not form common monatomic ions
    aliases:
    - no common ion
    - none
  explanation: 'Noble gases already have filled valence shells, so they are not part
    of the usual fixed-charge ion pattern used for binary ionic compound naming.

    '
  tags:
  - group-8a
  - common-ions
