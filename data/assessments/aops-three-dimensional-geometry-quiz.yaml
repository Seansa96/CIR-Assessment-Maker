questions:
- id: q001
  type: multipleChoice
  prompt: A rectangular prism has a length of 8, a width of 5, and a height of 4. What is its volume?
  difficultyDimensions:
  - 'Recall the volume formula for a rectangular prism: $V = l \cdot w \cdot h$.'
  - 'Calculate: $8 \cdot 5 \cdot 4 = 160$.'
  choices:
  - id: a
    text: $184$
    issueSignals:
    - id: surface-area-confusion
      domains: []
  - id: b
    text: $160$
  - id: c
    text: $40$
    issueSignals:
    - id: missing-dimension-error
      domains: []
  - id: d
    text: $17$
    issueSignals:
    - id: addition-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The volume of a rectangular prism is $V = \text{length} \times \text{width} \times \text{height}$.

    $V = 8 \times 5 \times 4$

    $V = 160$.


    Why it works:

    Volume measures the number of $1 \times 1 \times 1$ cubes that fit inside the solid. The base layer
    is a rectangle of $8 \times 5 = 40$ cubes. The height is 4, meaning there are 4 identical layers stacked
    on top of each other. $40 \times 4 = 160$.


    Why the other choices fail:

    - $184$ is the *surface area* of the prism ($2(8\cdot 5) + 2(8\cdot 4) + 2(5\cdot 4)$).

    - $40$ is the area of just the base ($8 \times 5$).

    - $17$ is the sum of the dimensions ($8 + 5 + 4$).

    '
- id: q002
  type: multipleChoice
  prompt: A cylinder has a radius of 3 cm and a height of 10 cm. What is its volume?
  difficultyDimensions:
  - 'Recall the volume formula for a cylinder: $V = \pi r^2 h$.'
  - 'Calculate: $\pi \cdot (3)^2 \cdot 10 = 90\pi$.'
  choices:
  - id: a
    text: $30\pi\text{ cm}^3$
    issueSignals:
    - id: radius-squared-omission
      domains: []
  - id: b
    text: $90\pi\text{ cm}^3$
  - id: c
    text: $60\pi\text{ cm}^3$
    issueSignals:
    - id: circumference-base-error
      domains: []
  - id: d
    text: $300\pi\text{ cm}^3$
    issueSignals:
    - id: radius-diameter-confusion
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The volume of a cylinder is $V = \pi r^2 h$.

    $V = \pi(3^2)(10)$

    $V = \pi(9)(10)$

    $V = 90\pi\text{ cm}^3$.


    Why it works:

    Like any prism-like shape, the volume is found by taking the area of the base and multiplying it by
    the height. The base is a circle with area $\pi r^2$. Multiply that flat circle area by the height
    $h$ to sweep out the full 3D cylinder.


    Why the other choices fail:

    - $30\pi$ forgets to square the radius ($\pi \times 3 \times 10$).

    - $60\pi$ uses the circumference for the base instead of the area ($2\pi r \times h = 60\pi$).

    - $300\pi$ uses $10$ as the radius and $3$ as the height ($\pi \times 100 \times 3$).

    '
- id: q003
  type: multipleChoice
  prompt: The total surface area of a cube is $150\text{ m}^2$. What is the length of one edge of the
    cube?
  difficultyDimensions:
  - 'Recall a cube has 6 identical square faces: $SA = 6s^2$.'
  - 'Set up equation: $6s^2 = 150$.'
  - 'Solve for $s^2$: $s^2 = 25$.'
  - 'Solve for $s$: $s = 5$.'
  choices:
  - id: a
    text: $25\text{ m}$
    issueSignals:
    - id: square-root-omission
      domains: []
  - id: b
    text: $5\text{ m}$
  - id: c
    text: $12.5\text{ m}$
    issueSignals:
    - id: linear-division-error
      domains: []
  - id: d
    text: $12\text{ m}$
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    A cube has 6 identical square faces. Let $s$ be the edge length.

    $\text{Total Surface Area} = 6 \times (\text{Area of one face})$

    $150 = 6 \times s^2$

    Divide by 6:

    $25 = s^2$

    Take the square root:

    $s = 5\text{ m}$.


    Why it works:

    Always break surface area problems down into their component 2D shapes. A cube is just 6 squares glued
    together.


    Why the other choices fail:

    - $25$ is the area of a single face ($s^2$), forgetting to take the square root.

    - $12.5$ divides 150 by 12 (the number of edges), which is the formula for the sum of the edge lengths,
    not surface area.

    - $12$ might come from dividing 150 by 12 and rounding.

    '
- id: q004
  type: multipleChoice
  prompt: What is the volume of a sphere with a radius of 6?
  difficultyDimensions:
  - 'Recall the volume formula for a sphere: $V = \frac{4}{3} \pi r^3$.'
  - 'Calculate $r^3$: $6^3 = 216$.'
  - 'Multiply by $4/3$: $(216 / 3) \times 4 = 72 \times 4 = 288$.'
  - 'Attach $\pi$: $288\pi$.'
  choices:
  - id: a
    text: $144\pi$
    issueSignals:
    - id: surface-area-confusion
      domains: []
  - id: b
    text: $288\pi$
  - id: c
    text: $864\pi$
    issueSignals:
    - id: fraction-omission
      domains: []
  - id: d
    text: $72\pi$
    issueSignals:
    - id: formula-error
      domains: []
  answer:
    choiceId: b
  explanation: 'Solution:

    The formula for the volume of a sphere is $V = \frac{4}{3}\pi r^3$.

    $V = \frac{4}{3}\pi (6^3)$

    $V = \frac{4}{3}\pi (216)$

    $V = 4 \times \pi \times 72$

    $V = 288\pi$.


    Why it works:

    Unlike prisms, spheres do not have a flat base, so their volume formula requires calculus to derive.
    The $r^3$ term ensures the measurement is 3-dimensional.


    Why the other choices fail:

    - $144\pi$ is the *surface area* of the sphere ($4\pi r^2 = 4\pi(36) = 144\pi$).

    - $864\pi$ forgets the $\frac{1}{3}$ fraction ($\pi r^3 = 216\pi$, wait $4\pi r^3 = 864\pi$).

    - $72\pi$ is $\frac{1}{3}\pi r^3$, forgetting the 4 in the numerator.

    '
- id: q005
  type: multipleChoice
  prompt: A cylindrical soup can has a radius of $r$ and a height of $h$. Which of the following expressions
    represents the total surface area of the outside of the can (including both the top and bottom lids)?
  difficultyDimensions:
  - Recognize a cylinder has two circular bases (top and bottom).
  - 'Area of two bases: $2 \times \pi r^2$.'
  - Recognize the side (lateral) surface unrolls into a rectangle with width equal to circumference ($2\pi
    r$) and height $h$.
  - 'Lateral area: $2\pi r h$.'
  - 'Total surface area: $2\pi r^2 + 2\pi rh$.'
  choices:
  - id: a
    text: $\pi r^2 + 2\pi rh$
    issueSignals:
    - id: one-base-omission
      domains: []
  - id: b
    text: $2\pi r^2 + \pi rh$
    issueSignals:
    - id: circumference-error
      domains: []
  - id: c
    text: $2\pi r^2 + 2\pi rh$
  - id: d
    text: $\pi r^2 h$
    issueSignals:
    - id: aops-volume-confusion
      domains: []
  answer:
    choiceId: c
  explanation: 'Solution:

    The total surface area of a cylinder consists of three parts: the top circular lid, the bottom circular
    lid, and the curved lateral side.

    Area of top lid = $\pi r^2$.

    Area of bottom lid = $\pi r^2$.

    (Combined bases = $2\pi r^2$).

    If you slice the curved lateral side vertically and unroll it, it forms a rectangle. The height of
    this rectangle is $h$. The length of this rectangle wrapped exactly once around the circular lid,
    so its length is the circumference of the circle: $2\pi r$.

    Lateral area = $2\pi r \times h = 2\pi rh$.

    Total Surface Area = $2\pi r^2 + 2\pi rh$.


    Why it works:

    Visualizing 3D shapes unrolled into flat 2D "nets" is the best way to understand surface area formulas
    rather than purely memorizing them.


    Why the other choices fail:

    - $\pi r^2 + 2\pi rh$ forgets one of the lids (this would be the surface area of a cup without a lid).

    - $2\pi r^2 + \pi rh$ uses an incorrect lateral area formula.

    - $\pi r^2 h$ is the formula for Volume, not surface area.

    '
