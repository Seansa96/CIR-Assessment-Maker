workedExamples:
- id: we001
  title: Convert binary to Gray code conceptually
  problem: For binary value `b = 0b1011`, compute the Gray-code pattern using `b ^ (b >> 1)`.
  steps:
  - id: enc-s001
    title: Name the contract
    type: multipleChoice
    prompt: Which assumption is most important before applying this technique?
    choices:
    - id: a
      text: The word width and interpretation
    - id: b
      text: The variable name
    - id: c
      text: The editor theme
    - id: d
      text: The order of source files
    answer:
      choiceId: a
    explanation: Bit-level reasoning depends on width and interpretation.
    instruction: Start by naming the representation assumptions.
  - id: enc-s002
    title: Choose the invariant
    type: multipleChoice
    prompt: What should the transformation preserve?
    choices:
    - id: a
      text: The intended mathematical or bit-field property
    - id: b
      text: The exact source expression
    - id: c
      text: The number of lines of code
    - id: d
      text: The decimal notation of every intermediate
    answer:
      choiceId: a
    explanation: The invariant explains the correctness of the transformation.
    instruction: Identify what must stay true through the manipulation.
  - id: enc-s003
    title: Boundary check
    type: numericResponse
    prompt: How many set bits are in `0b10101000`?
    answer:
      value: 3
      tolerance: 0
    explanation: The one bits are at three positions.
    instruction: Use a small value to keep the manipulation visible.
  - id: enc-s004
    title: Edge-case habit
    type: multipleChoice
    prompt: Which follow-up case is most useful for low-level arithmetic?
    choices:
    - id: a
      text: A zero or boundary input
    - id: b
      text: Only a random middle input
    - id: c
      text: A longer variable name
    - id: d
      text: An unrelated floating-point value
    answer:
      choiceId: a
    explanation: Boundary inputs reveal assumptions about masks, shifts, and wraparound.
    instruction: Now decide what to test next.
  - id: enc-s005
    title: Explain the technique
    type: freeResponse
    prompt: Explain how to reason about a encodings, checksums, and error correction trick before trusting it in code.
    answer:
      expected: Name the word width and interpretation, identify the invariant, trace a small example, and test zero or boundary cases before relying on the expression.
      gradingMode: selfCheck
      keyPoints:
      - Names word width/interpretation
      - Mentions invariant
      - Mentions small example or edge cases
    explanation: 'Related topic: Encodings, Checksums, and Error Correction from the computer arithmetic algorithms category.'
    instruction: Finish by connecting the trick back to the underlying bit model.
