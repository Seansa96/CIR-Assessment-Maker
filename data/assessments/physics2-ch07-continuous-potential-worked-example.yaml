      media: []
      keyPoints: []
      circuitAnswer: 
      graphingAnswer: 
    explanation: >-
      Solution: V=kQ/sqrt(z^2+R^2)=71.9 V.


      Why it works: Every ring element is the same distance from the axial point, so scalar potential integrates to kQ/r.
