workedExamples:
- id: we2
  title: Potential of a Charged Ring
  prompt: Find the electric potential at a distance $z$ along the central axis of
    a uniform ring of radius $R$ and total charge $Q$.
  steps:
  - id: s1
    prompt: Set up the integral.
    explanation: 'Solution:

      1) Every charge element $dq$ on the ring is at the exact same distance $r =
      \sqrt{R^2 + z^2}$ from the point on the axis.

      2) $dV = k \frac{dq}{\sqrt{R^2 + z^2}}$.

      3) Since the denominator is constant, $\int dV = \frac{k}{\sqrt{R^2 + z^2}}
      \int dq$.

      4) $V = k \frac{Q}{\sqrt{R^2 + z^2}}$.


      Why it works:

      Because potential is a scalar, we don''t have to worry about vector components
      cancelling out. The constant distance pulls out of the integral.'
