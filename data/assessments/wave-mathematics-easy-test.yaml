questions:
- id: q001
  type: numericResponse
  prompt: A wave has frequency 5.0 Hz. What is its period in seconds?
  answer: { value: 0.2, tolerance: 0.005 }
  explanation: |
    Solution: $T=1/f=1/5.0=0.20$ s.

    Why it works: Period and frequency are reciprocal measures of repetition rate.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q002
  type: numericResponse
  prompt: A wave travels at 12 m/s with wavelength 3.0 m. What frequency in Hz does it have?
  answer: { value: 4, tolerance: 0.05 }
  explanation: |
    Solution: $f=v/\lambda=12/3.0=4.0$ Hz.

    Why it works: The wave relation $v=f\lambda$ connects how fast a pattern moves with its spatial and temporal repetition.
  difficultyDimensions: [modelOrDerivation, unitAnalysis]
- id: q003
  type: numericResponse
  prompt: A sinusoidal wave has frequency 10 Hz. What angular frequency in rad/s does it have?
  answer: { value: 62.832, tolerance: 0.1 }
  explanation: |
    Solution: $\omega=2\pi f=2\pi(10)=62.832$ rad/s.

    Why it works: One cycle corresponds to $2\pi$ radians of phase.
  difficultyDimensions: [unitConversion, modelOrDerivation]
- id: q004
  type: multipleChoice
  prompt: In a fixed medium, a wave's frequency doubles while its speed remains unchanged. What happens to wavelength?
  choices:
  - { id: a, text: It is halved. }
  - { id: b, text: It doubles. }
  - { id: c, text: It is unchanged. }
  - { id: d, text: It becomes zero. }
  answer: { choiceId: a }
  explanation: |
    Solution: It is halved.

    Why it works: With fixed $v=f\lambda$, wavelength is inversely proportional to frequency.

    Why the other choices fail: Doubling or preserving wavelength would change speed, and a finite-frequency wave does not have zero wavelength.
  difficultyDimensions: [proportionalReasoning, modelComparison]

