questions:
- id: q001
  type: multipleChoice
  difficultyDimensions:
  - conceptual-mapping
  - principle-recognition
  prompt: According to Ohm's Law, what happens to the current through a resistor if
    the applied voltage is doubled?
  options:
  - id: a
    text: It doubles.
    isCorrect: true
  - id: b
    text: It halves.
    isCorrect: false
  - id: c
    text: It quadruples.
    isCorrect: false
  - id: d
    text: It remains the same.
    isCorrect: false
  explanation: 'Solution:

    Ohm''s law is $V = IR$. If $R$ is constant and $V \to 2V$, then $I \to 2I$.


    Why it works:

    For an ohmic material, resistance does not depend on voltage. Thus, voltage and
    current are directly proportional.

    Why the other choices fail: Halving or remaining the same would imply non-linear
    or inverse relationships.'
