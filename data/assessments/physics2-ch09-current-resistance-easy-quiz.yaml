- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: According to Ohm's Law, what happens to the current through a resistor if the applied voltage is doubled?
  explanation: 'Solution:

    Ohm''s law is $V = IR$. If $R$ is constant and $V \to 2V$, then $I \to 2I$.


    Why it works:

    For an ohmic material, resistance does not depend on voltage. Thus, voltage and current are directly proportional.

    Why the other choices fail: Halving or remaining the same would imply non-linear or inverse relationships.'
  choices:
  - id: a
    text: It doubles.
  - id: b
    text: It halves.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: It quadruples.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: It remains the same.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
