lesson:
  introduction: |
    Mathematical writing assigns different jobs to definitions, theorems, examples, and proofs. Recognizing the job tells you what you may use and what still needs evidence.
  sections:
    - id: s01
      title: Definitions set meaning
      content: |
        A definition fixes how a term will be used. When a proof says “because n is even,” return to the definition of even and unpack the consequence it gives.
    - id: s02
      title: Theorems make conditional promises
      content: |
        A theorem often has hypotheses and a conclusion. Check every hypothesis before applying it; the conclusion is available only within the stated scope.
    - id: s03
      title: Examples illustrate but do not establish universals
      content: |
        An example can clarify a definition or disprove a universal claim. It cannot by itself prove that every object has a property.
    - id: s04
      title: Counterexamples test scope
      content: |
        One permitted case that violates a universal statement is enough to refute it. A counterexample must satisfy the setup; an unrelated object does not test the claim.
