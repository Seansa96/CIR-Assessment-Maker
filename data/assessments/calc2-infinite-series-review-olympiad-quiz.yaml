- id: q001
  type: multipleChoice
  skills:
  - compute-radii-with-limsup
  prompt: |
    A power series $\sum a_nx^n$ has $a_n=2^n$ for even n and
    $a_n=3^n$ for odd n. What is its radius of convergence?
  choices:
  - id: a
    text: $1/3$
  - id: b
    text: $1/2$
  - id: c
    text: |-
      $1/\sqrt6$
  - id: d
    text: $1$
  answer:
    choiceId: a
  explanation: |-
    Solution: The limsup of $|a_n|^{1/n}$ is three, so Cauchy-Hadamard gives reciprocal radius one-third. Therefore the answer is $1/3$.

    Why it works: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$. The series converges precisely when the sequence $S_N$ has a finite limit.

    Common trap: Terms approaching zero do not guarantee that the partial sums converge; separate the term test from an actual convergence test.

    Why the other choices fail: $1/2$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $1/\sqrt6$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$; $1$ conflicts with this criterion: A series $\sum a_n$ is defined through its partial sums $S_N=\sum_{n=1}^{N}a_n$.
