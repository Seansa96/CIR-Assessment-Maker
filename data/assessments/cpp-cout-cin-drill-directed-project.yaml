directedProject:
  summary: >-
    Practice reading keyboard input with cin and printing formatted output with
    cout. You will build three small programs that combine cin and cout in
    increasingly useful ways.
  estimatedTimeMinutes: 10
  resources: []
  phases:
    - id: phase-1-name-greeting
      title: "Greet the User"
      steps:
        - id: step-1-ask-name
          title: "Ask for a Name and Greet"
          instruction: |
            Create a new C++ console project named `CinCoutDrill`.

            Write a program that asks the user for their first name and prints a
            personalized greeting:

            ```cpp
            #include <iostream>
            #include <string>
            using namespace std;

            int main() {
                string name;
                cout << "What is your first name? ";
                cin >> name;
                cout << "Hello, " << name << "! Welcome to C++." << endl;
                return 0;
            }
            ```

            Build and run. Type your name when prompted and verify the greeting appears.

            **Key concept:** `cin >> name` reads one word from the keyboard and stores
            it in the `name` variable. The `>>` operator is called the *extraction operator*.
          checklist:
            - id: chk-ask-name
              text: "Program prompts for a name and prints a personalized greeting"
          resources: []

    - id: phase-2-chaining
      title: "Chaining Output"
      steps:
        - id: step-2-chain
          title: "Chain Multiple Values in One Statement"
          instruction: |
            Replace your `main()` with this program that chains multiple values in a
            single `cout` statement:

            ```cpp
            int main() {
                string firstName, lastName;
                int age;

                cout << "First name: ";
                cin >> firstName;
                cout << "Last name: ";
                cin >> lastName;
                cout << "Age: ";
                cin >> age;

                cout << "Name: " << firstName << " " << lastName
                     << ", Age: " << age << endl;

                return 0;
            }
            ```

            Build and run. Notice how the single `cout` chains six values together
            using `<<`. This is the standard pattern for mixing text and variables.
          notesPrompt: "Try entering your actual information. Does the output look correct?"
          checklist:
            - id: chk-chain
              text: "Program chains multiple values in one cout statement"
            - id: chk-mixed-types
              text: "Program reads both string and int types from cin"
          resources: []

    - id: phase-3-calculator
      title: "Simple Calculator"
      steps:
        - id: step-3-math
          title: "Read Two Numbers and Show Arithmetic"
          instruction: |
            Replace your `main()` with a program that reads two integers and prints
            all four basic arithmetic results:

            ```cpp
            int main() {
                int x, y;

                cout << "Enter first number: ";
                cin >> x;
                cout << "Enter second number: ";
                cin >> y;

                cout << x << " + " << y << " = " << (x + y) << endl;
                cout << x << " - " << y << " = " << (x - y) << endl;
                cout << x << " * " << y << " = " << (x * y) << endl;
                cout << x << " / " << y << " = " << (x / y) << endl;

                return 0;
            }
            ```

            Build and run. Try these inputs:
            1. `10` and `3` — what does `10 / 3` print? (integer division!)
            2. `7` and `0` — what happens with division by zero?
          notesPrompt: "What did 10 / 3 print? Why isn't it 3.333?"
          checklist:
            - id: chk-arithmetic
              text: "Program prints sum, difference, product, and quotient"
            - id: chk-integer-division
              text: "Noticed that integer division truncates the decimal"
          resources: []

        - id: step-4-challenge
          title: "Challenge: Add Remainder"
          instruction: |
            Add a fifth line to your output that shows the remainder (modulus):

            ```cpp
            cout << x << " % " << y << " = " << (x % y) << endl;
            ```

            The `%` operator gives the *remainder* after integer division.
            For example, `10 % 3` is `1` because 10 ÷ 3 = 3 remainder 1.

            Run the program again with `10` and `3` to verify.
          checklist:
            - id: chk-modulus
              text: "Added the modulus line and verified the output"
          resources: []
