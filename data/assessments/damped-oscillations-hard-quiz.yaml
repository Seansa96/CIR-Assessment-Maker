  prompt: A mass of 1.92 kg is attached to a horizontal spring with constant 236.7
    N/m on a frictionless table. What is the period of oscillation in seconds?
  answer:
    value: 0.5659
    tolerance: 0.05
  explanation: T = 2*pi*sqrt(m/k) = 2*pi*sqrt(1.92/236.7) = 0.5659 s.
