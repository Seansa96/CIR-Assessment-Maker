items:
  - { id: cr1, type: cloze, prompt: 'For point masses, $I=\sum m____^2$.', answer: { expected: r, expectedLatex: 'r', aliases: [radius], media: [] }, explanation: 'Solution: Insert $r$.\n\nWhy it works: Each mass is weighted by distance squared.', tags: [discrete] }
  - { id: cr2, type: typed, prompt: 'What theorem shifts inertia to a parallel axis?', answer: { expected: 'parallel axis theorem', expectedLatex: 'I=I_{cm}+Md^2', aliases: [], media: [] }, explanation: 'Solution: It is the parallel-axis theorem.\n\nWhy it works: It adds $Md^2$ to center-of-mass inertia.', tags: [axis] }
  - { id: cr3, type: cloze, prompt: 'A solid disk has $I=____MR^2$ about its center.', answer: { expected: '1/2', expectedLatex: '\tfrac12', aliases: ['one half'], media: [] }, explanation: 'Solution: Insert $\tfrac12$.\n\nWhy it works: This is the standard central-axis disk formula.', tags: [shapes] }
  - { id: cr4, type: typed, prompt: 'What operation replaces a sum for a continuous distribution?', answer: { expected: integral, expectedLatex: '\int', aliases: [integration], media: [] }, explanation: 'Solution: Use an integral.\n\nWhy it works: Continuous mass is built from infinitesimal elements.', tags: [continuous] }
  - { id: cr5, type: cloze, prompt: 'A removed hole is ____ from a composite inertia.', answer: { expected: subtracted, expectedLatex: '', aliases: [subtract], media: [] }, explanation: 'Solution: Insert subtracted.\n\nWhy it works: The hole represents missing mass.', tags: [composite] }
  - { id: cr6, type: typed, prompt: 'What units measure moment of inertia?', answer: { expected: 'kilogram meter squared', expectedLatex: '\mathrm{kg\,m^2}', aliases: ['kg m2'], media: [] }, explanation: 'Solution: They are kg m$^2$.\n\nWhy it works: Inertia is mass times distance squared.', tags: [units] }
