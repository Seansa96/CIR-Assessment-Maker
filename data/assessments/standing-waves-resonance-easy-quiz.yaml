questions:
- id: q001
  type: numericResponse
  skills:
  - physics-standing-waves-resonance
  prompt: A laboratory ripple tank generates water waves of length 5.93 m at a frequency
    of 95.2 Hz. What is the angular frequency omega in rad/s?
  answer:
    value: 598.1592
    tolerance: 0.05
  explanation: omega = 2*pi*f = 2*pi*95.2 = 598.1592 rad/s.
- id: q002
  type: numericResponse
  skills:
  - physics-standing-waves-resonance
  prompt: A seismic surface wave has a characteristic wavelength of 13.4 m and vibrates
    at 7.8 Hz. What is the wave number k in rad/m?
  answer:
    value: 0.4689
    tolerance: 0.05
  explanation: k = 2*pi / lambda = 2*pi / 13.4 = 0.4689 rad/m.
- id: q003
  type: numericResponse
  skills:
