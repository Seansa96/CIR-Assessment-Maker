  prompt: A tensioned cable vibrates with wavelength 15.61 m when driven at 47.0 Hz.
    What is the wave speed in m/s?
  answer:
    value: 733.67
    tolerance: 0.05
  explanation: v = lambda * f = 15.61 * 47.0 = 733.67 m/s.
