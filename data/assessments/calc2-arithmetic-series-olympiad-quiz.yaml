- id: q001
  type: multipleChoice
  skills:
  - solve-symmetric-arithmetic-progressions
  prompt: 'Five increasing positive terms are in arithmetic progression. Their sum

    is $55$, and the product of the first and last terms is $85$. What is

    the common difference?

    '
  choices:
  - id: a
    text: $3$
  - id: b
    text: $2$
  - id: c
    text: $4$
  - id: d
    text: $5$
  answer:
    choiceId: a
  explanation: 'Solution: The middle term is eleven, so the endpoints are $11-2d$ and $11+2d$; their product gives $121-4d^2=85$. Therefore the answer is $3$.


    Why it works: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$. For a finite sum, use $S_n=n(a_1+a_n)/2$ after identifying the correct first and last terms.


    Common trap: The $n$th term has $(n-1)d$, not $nd$; distinguish the number of terms from the index of the final term.


    Why the other choices fail: $2$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $4$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$; $5$ conflicts with this criterion: An arithmetic sequence has constant difference $d$, so $a_n=a_1+(n-1)d$.'
