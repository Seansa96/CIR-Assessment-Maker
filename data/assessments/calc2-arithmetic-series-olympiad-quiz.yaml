schemaVersion: 1
id: calc2-arithmetic-series-olympiad-quiz
title: Arithmetic Series Olympiad Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: arithmetic-series
skills:
- Solve symmetric, digit, floor-sum, and parameterized progressions
- Connect arithmetic progressions with means and discrete differences
- Use index invariants and exact finite-sum partitions
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - arithmetic-series
  - olympiad
  - finite-progressions
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - solve-symmetric-arithmetic-progressions
  prompt: |
    Five increasing positive terms are in arithmetic progression. Their sum
    is $55$, and the product of the first and last terms is $85$. What is
    the common difference?
  choices:
  - id: a
    text: $3$
  - id: b
    text: $2$
  - id: c
    text: $4$
  - id: d
    text: $5$
  answer:
    choiceId: a
  explanation: The middle term is eleven, so the endpoints are $11-2d$ and $11+2d$; their product gives
    $121-4d^2=85$.
- id: q002
  type: multipleChoice
  skills:
  - solve-arithmetic-triples-from-power-sums
  prompt: |
    Three increasing positive integers in arithmetic progression have sum
    $21$ and sum of squares $165$. What are they?
  choices:
  - id: a
    text: $4,7,10$
  - id: b
    text: $3,7,11$
  - id: c
    text: $5,7,9$
  - id: d
    text: $1,7,13$
  answer:
    choiceId: a
  explanation: Write the terms as $7-d,7,7+d$; their squares sum to $147+2d^2=165$, so d equals three.
- id: q003
  type: multipleChoice
  skills:
  - invert-quadratic-partial-sums
  prompt: |
    A sequence has partial sums $S_n=n(3n+1)$. What is $a_n$?
  choices:
  - id: a
    text: $6n-2$
  - id: b
    text: $6n+1$
  - id: c
    text: $3n+1$
  - id: d
    text: $6n-1$
  answer:
    choiceId: a
  explanation: Subtract $S_{n-1}=(n-1)(3n-2)$ from S_n to obtain $6n-2$.
- id: q004
  type: multipleChoice
  skills:
  - evaluate-floor-arithmetic-sums
  prompt: |
    Evaluate $\displaystyle\sum_{k=1}^{20}\left\lfloor\frac{3k+1}{5}\right\rfloor$.
  choices:
  - id: a
    text: $122$
  - id: b
    text: $120$
  - id: c
    text: $126$
  - id: d
    text: $118$
  answer:
    choiceId: a
  explanation: Group k into four blocks of five; increasing k by five raises each floor by three, and
    the first block sums to eight, giving $8+(8+15)+(8+30)+(8+45)=122$.
- id: q005
  type: multipleChoice
  skills:
  - solve-arithmetic-digit-numbers
  prompt: |
    The digits of a three-digit number form an increasing arithmetic
    progression and sum to $18$. Reversing the digits increases the number
    by $594$. What is the number?
  choices:
  - id: a
    text: $369$
  - id: b
    text: $258$
  - id: c
    text: $147$
  - id: d
    text: $468$
  answer:
    choiceId: a
  explanation: The digits are $6-d,6,6+d$, and reversal changes the number by $198d$; hence d equals three.
- id: q006
  type: multipleChoice
  skills:
  - relate-arithmetic-and-harmonic-means
  prompt: |
    Positive numbers $a,b,c$ have reciprocals in arithmetic progression.
    Which equation must hold?
  choices:
  - id: a
    text: $b=2ac/(a+c)$
  - id: b
    text: $b=(a+c)/2$
  - id: c
    text: $b^2=ac$
  - id: d
    text: $b=a+c$
  answer:
    choiceId: a
  explanation: The condition $2/b=1/a+1/c$ solves to the harmonic-mean formula $b=2ac/(a+c)$.
- id: q007
  type: multipleChoice
  skills:
  - compare-arithmetic-and-geometric-progressions
  prompt: |
    Three positive numbers are simultaneously in arithmetic progression and
    geometric progression in the same order. What must be true?
  choices:
  - id: a
    text: All three numbers are equal.
  - id: b
    text: The middle number is twice the first.
  - id: c
    text: The common difference is one.
  - id: d
    text: The common ratio is two.
  answer:
    choiceId: a
  explanation: The middle is both the arithmetic and geometric mean of the endpoints; equality in AM–GM
    forces the endpoints equal.
- id: q008
  type: multipleChoice
  skills:
  - derive-parameter-ratios-from-partial-sums
  prompt: |
    An arithmetic sequence with first term a and difference d satisfies
    $S_{20}=5S_{10}$. What is $a:d$?
  choices:
  - id: a
    text: $-7:6$
  - id: b
    text: $7:6$
  - id: c
    text: $-6:7$
  - id: d
    text: $1:1$
  answer:
    choiceId: a
  explanation: Substitute the two sum formulas to obtain $20a+190d=50a+225d$, hence $30a=-35d$.
- id: q009
  type: multipleChoice
  skills:
  - use-index-symmetry
  prompt: |
    In an arithmetic sequence, $a_2+a_{14}=30$. What is
    $a_5+a_{11}$?
  choices:
  - id: a
    text: $30$
  - id: b
    text: $16$
  - id: c
    text: $60$
  - id: d
    text: Cannot be determined
  answer:
    choiceId: a
  explanation: Both index pairs sum to sixteen, so the explicit linear formula gives equal term sums.
- id: q010
  type: multipleChoice
  skills:
  - solve-deletion-average-problems
  prompt: |
    One number is removed from $1,2,\ldots,100$, and the average of the
    remaining $99$ numbers is $50$. Which number was removed?
  choices:
  - id: a
    text: $100$
  - id: b
    text: $50$
  - id: c
    text: $99$
  - id: d
    text: $1$
  answer:
    choiceId: a
  explanation: |-
    The original total is 5050 and the remaining total is $99\cdot50=4950$, leaving removed value 100.
- id: q011
  type: multipleChoice
  skills:
  - characterize-arithmetic-sequences-by-differences
  prompt: |
    Which identity for every applicable n characterizes arithmetic
    sequences?
  choices:
  - id: a
    text: $a_{n+2}-2a_{n+1}+a_n=0$
  - id: b
    text: $a_{n+1}^2=a_na_{n+2}$
  - id: c
    text: $a_{n+2}=a_{n+1}a_n$
  - id: d
    text: $a_{n+1}/a_n$ is constant
  answer:
    choiceId: a
  explanation: A zero second difference says consecutive first differences are equal.
- id: q012
  type: multipleChoice
  skills:
  - sum-arithmetic-subsequences
  prompt: |
    For $a_n=2n+1$, evaluate $a_3+a_6+\cdots+a_{30}$.
  choices:
  - id: a
    text: $340$
  - id: b
    text: $330$
  - id: c
    text: $310$
  - id: d
    text: $610$
  answer:
    choiceId: a
  explanation: The ten sampled terms run from seven to sixty-one with common difference six, so their
    sum is $10(7+61)/2=340$.
- id: q013
  type: multipleChoice
  skills:
  - solve-equal-block-sums
  prompt: |
    The list $1,2,\ldots,20$ is split after k. For which k do the two
    blocks have equal sum?
  choices:
  - id: a
    text: $14$
  - id: b
    text: $10$
  - id: c
    text: $15$
  - id: d
    text: No such k
  answer:
    choiceId: a
  explanation: |-
    The total is 210, so the first block must sum to 105; $14\cdot15/2=105$.
- id: q014
  type: multipleChoice
  skills:
  - analyze-square-arithmetic-progressions
  prompt: |
    The squares $1$ and $49$ are the first and third terms of a
    three-term arithmetic progression of squares. What is the middle term?
  choices:
  - id: a
    text: $25$
  - id: b
    text: $24$
  - id: c
    text: $16$
  - id: d
    text: $36$
  answer:
    choiceId: a
  explanation: The middle arithmetic term is the endpoint average $(1+49)/2=25$, which is the square of
    five.
- id: q015
  type: multipleChoice
  skills:
  - derive-general-arithmetic-sums
  prompt: |
    Simplify $\sum_{k=1}^{n}[a+(k-1)d]$.
  choices:
  - id: a
    text: $na+dn(n-1)/2$
  - id: b
    text: $na+dn(n+1)/2$
  - id: c
    text: $a+(n-1)d$
  - id: d
    text: $n(a+d)$
  answer:
    choiceId: a
  explanation: |-
    Sum the constant a over n terms and use $\sum_{k=1}^{n}(k-1)=n(n-1)/2$.
