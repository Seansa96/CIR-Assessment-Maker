- id: q-usub-et-1
  title: Basic U-Sub (Polynomial)
  prompt: |-
    Evaluate the indefinite integral:
    $$\int 3x^2(x^3 + 4)^5 \, dx$$
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{1}{6}(x^3 + 4)^6 + C$
  - id: c2
    text: $\frac{1}{5}(x^3 + 4)^6 + C$
  - id: c3
    text: $(x^3 + 4)^6 + C$
  - id: c4
    text: $x^3(x^3 + 4)^6 + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = x^3 + 4$. Then $du = 3x^2 \, dx$.
    Substitute to get $\int u^5 \, du = \frac{1}{6}u^6 + C$.
    Substitute back to get $\frac{1}{6}(x^3 + 4)^6 + C$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-et-2
  title: Basic U-Sub (Trig)
  prompt: |-
    Evaluate the indefinite integral:
    $$\int \sin(x)\cos^3(x) \, dx$$
  type: multipleChoice
  choices:
  - id: c1
    text: $-\frac{1}{4}\cos^4(x) + C$
  - id: c2
    text: $\frac{1}{4}\cos^4(x) + C$
  - id: c3
    text: $-\frac{1}{4}\sin^4(x) + C$
  - id: c4
    text: $\cos^4(x) + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = \cos(x)$. Then $du = -\sin(x) \, dx$, so $-du = \sin(x) \, dx$.
    Substitute to get $-\int u^3 \, du = -\frac{1}{4}u^4 + C$.
    Substitute back to get $-\frac{1}{4}\cos^4(x) + C$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-et-3
  title: Basic U-Sub (Exponential)
  prompt: |-
    Evaluate the indefinite integral:
    $$\int x e^{x^2} \, dx$$
  type: multipleChoice
  choices:
  - id: c1
    text: $\frac{1}{2} e^{x^2} + C$
  - id: c2
    text: $e^{x^2} + C$
  - id: c3
    text: $2 e^{x^2} + C$
  - id: c4
    text: $x^2 e^{x^2} + C$
  answer:
    choiceId: c1
  explanation: |-
    Let $u = x^2$. Then $du = 2x \, dx$, so $\frac{1}{2}du = x \, dx$.
    Substitute to get $\frac{1}{2} \int e^u \, du = \frac{1}{2}e^u + C$.
    Substitute back to get $\frac{1}{2} e^{x^2} + C$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-et-4
  title: Definite Integral Bounds
  prompt: |-
    When evaluating $\int_{0}^{\pi/2} \cos(x) \sin^2(x) \, dx$ using the substitution $u = \sin(x)$, what are the new limits of integration for the $u$-integral?
  type: multipleChoice
  choices:
  - id: c1
    text: From $0$ to $1$
  - id: c2
    text: From $1$ to $0$
  - id: c3
    text: From $0$ to $\pi/2$
  - id: c4
    text: From $-1$ to $1$
  answer:
    choiceId: c1
  explanation: |-
    When $x = 0$, $u = \sin(0) = 0$.
    When $x = \pi/2$, $u = \sin(\pi/2) = 1$.
    The new limits are from $0$ to $1$.
  skills:
  - calc2-u-sub-integration

- id: q-usub-et-5
  title: Evaluating a Definite Integral
  prompt: |-
    Evaluate the definite integral:
    $$\int_{0}^{1} 2x(x^2 + 1)^2 \, dx$$
  type: numericResponse
  answer:
    value: 2.333
    tolerance: 0.05
  explanation: |-
    Let $u = x^2 + 1$. Then $du = 2x \, dx$.
    Bounds: when $x=0, u=1$. When $x=1, u=2$.
    The integral becomes $\int_{1}^{2} u^2 \, du = [\frac{1}{3}u^3]_{1}^{2}$.
    Evaluate: $\frac{1}{3}(2^3) - \frac{1}{3}(1^3) = \frac{8}{3} - \frac{1}{3} = \frac{7}{3} \approx 2.333$.
  skills:
  - calc2-u-sub-integration
