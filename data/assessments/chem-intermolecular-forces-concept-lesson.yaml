skills:
  - chem-intermolecular-forces
modeDefault: practice
randomizeQuestions: false
lesson:
  introduction: |
    Why is water a liquid at room temperature while carbon dioxide is a gas? The answer lies in **intermolecular forces (IMFs)** — the attractions *between* molecules. While covalent and ionic bonds (intramolecular forces) hold atoms together to form molecules, IMFs determine the physical state (solid, liquid, gas) and properties like boiling point, viscosity, and surface tension.
  sections:
    - id: sec-london-dispersion
      title: London Dispersion Forces
      required: true
      content: |
        **London dispersion forces** exist between **all** atoms and molecules. They are the only intermolecular forces present in nonpolar molecules and noble gases.

        How they work: electrons are constantly moving. At any given instant, the electron cloud may become temporarily asymmetric, creating an **instantaneous dipole**. This temporary dipole induces a similar dipole in an adjacent molecule, resulting in a weak, short-lived attraction.

        **Polarizability:** The strength of dispersion forces depends on how easily the electron cloud can be distorted (its polarizability). Larger atoms/molecules have more electrons located farther from the nucleus, making them more polarizable.

        **Trend:** Dispersion forces generally **increase with molar mass** (size) and **surface area** (linear molecules have stronger dispersion forces than spherical, highly branched molecules of the same mass).
      media:
        - type: image
          src: /media/chemistry/solids-liquids-gases/chem-imf-london-dispersion.png
          alt: Illustration showing an instantaneous dipole on one atom inducing a dipole on a neighboring atom, creating a London dispersion force.
          caption: "Dispersion forces arise when temporary fluctuations in electron distribution create instantaneous, induced dipoles."
      check:
        id: chk-imf-1
        type: multipleChoice
        prompt: |
          Which of the following noble gases has the **highest** boiling point?
        choices:
          - id: a
            text: Helium (He, ~4 g/mol)
          - id: b
            text: Neon (Ne, ~20 g/mol)
          - id: c
            text: Argon (Ar, ~40 g/mol)
          - id: d
            text: Xenon (Xe, ~131 g/mol)
        answer:
          choiceId: d
        explanation: |
          Since noble gases are nonpolar, they rely entirely on **London dispersion forces**. Xenon is the largest atom with the most electrons, making its electron cloud the most polarizable. Stronger dispersion forces mean more thermal energy is required to boil it, giving Xenon the highest boiling point.

    - id: sec-dipole-dipole
      title: Dipole-Dipole Forces
      required: true
      content: |
        **Dipole-dipole forces** exist only between **polar molecules**. These molecules have permanent dipole moments due to polar bonds and asymmetric geometry.

        The partially positive end ($\delta^+$) of one molecule is electrostatically attracted to the partially negative end ($\delta^-$) of another molecule.

        For molecules of roughly equal mass and size (where dispersion forces are similar), the presence of dipole-dipole forces significantly **increases the boiling point**.

        *Example:* Propane ($CH_3CH_2CH_3$, 44 g/mol, nonpolar) boils at −42°C. Acetaldehyde ($CH_3CHO$, 44 g/mol, polar) boils at +20°C. The dipole-dipole forces in acetaldehyde require more energy to overcome.
      check:
        id: chk-imf-2
        type: multipleChoice
        prompt: |
          Which of the following molecules exhibits dipole-dipole forces?
        choices:
          - id: a
            text: '$CO_2$'
          - id: b
            text: '$CCl_4$'
          - id: c
            text: '$H_2S$'
          - id: d
            text: '$N_2$'
        answer:
          choiceId: c
        explanation: |
          Dipole-dipole forces require a **polar molecule**. $CO_2$, $CCl_4$, and $N_2$ are all nonpolar due to symmetry or homonuclear bonding. $H_2S$ has a bent geometry (AX₂E₂) making it polar, so it exhibits dipole-dipole forces.

    - id: sec-hydrogen-bonding
      title: Hydrogen Bonding
      required: true
      content: |
        **Hydrogen bonding** is an exceptionally strong type of dipole-dipole interaction. It occurs only when a hydrogen atom is covalently bonded to a small, highly electronegative atom: **Fluorine (F), Oxygen (O), or Nitrogen (N)**.

        Because F, O, and N are so electronegative, they pull the shared electrons completely away from the hydrogen. Hydrogen (which has no core electrons to shield its nucleus) is left as an almost bare proton, carrying a very large $\delta^+$ charge. This proton interacts strongly with the lone pair on an F, O, or N atom of an adjacent molecule.

        Hydrogen bonding explains the unusually high boiling points of $H_2O$, $NH_3$, and $HF$ compared to heavier compounds in their respective groups. It is also the force that holds the two strands of DNA together.
      media:
        - type: image
          src: /media/chemistry/solids-liquids-gases/chem-imf-hydrogen-bonding.png
          alt: 3D diagram showing hydrogen bonds between multiple water molecules (H-bonds connect H to O).
          caption: "In liquid water, the highly polar O-H bonds create strong partial charges, allowing each water molecule to participate in multiple hydrogen bonds."
      check:
        id: chk-imf-3
        type: selectAll
        prompt: |
          Which of the following molecules can form hydrogen bonds with other molecules of the same kind? Select all that apply.
        choices:
          - id: a
            text: '$CH_3OH$ (Methanol)'
          - id: b
            text: '$CH_3F$ (Fluoromethane)'
          - id: c
            text: '$NH_3$ (Ammonia)'
          - id: d
            text: '$H_2S$ (Hydrogen sulfide)'
        answer:
          choiceIds:
            - a
            - c
        explanation: |
          Hydrogen bonding requires an H covalently bonded to **N, O, or F**. Methanol ($CH_3OH$) has an O—H group. Ammonia ($NH_3$) has N—H bonds. Both can hydrogen bond. $CH_3F$ has F, but the H atoms are bonded to C, not F. $H_2S$ does not have N, O, or F.

    - id: sec-ion-dipole
      title: Ion-Dipole Forces
      required: true
      content: |
        **Ion-dipole forces** exist between an ion and the partial charge on the end of a polar molecule. These are the strongest of the intermolecular forces (though still weaker than true ionic/covalent bonds).

        When an ionic compound like NaCl dissolves in water, the positive $Na^+$ ions are attracted to the $\delta^-$ oxygen atoms of water, and the negative $Cl^-$ ions are attracted to the $\delta^+$ hydrogen atoms. This **hydration** (or solvation) releases energy, allowing the ionic crystal lattice to dissolve.
      check:
        id: chk-imf-4
        type: multipleChoice
        prompt: |
          Which interaction is primarily responsible for the dissolution of ionic salts in water?
        choices:
          - id: a
            text: London dispersion forces
          - id: b
            text: Hydrogen bonding
          - id: c
            text: Ion-dipole forces
          - id: d
            text: Covalent bonding
        answer:
          choiceId: c
        explanation: |
          The attraction between the full charge of an ion and the partial charges (dipoles) of polar water molecules (**ion-dipole forces**) provides the energy required to overcome the strong ionic bonds holding the salt crystal together.

    - id: sec-imf-properties
      title: Physical Properties Governed by IMFs
      required: true
      content: |
        The strength of intermolecular forces directly dictates many physical properties of liquids:

        - **Boiling Point / Melting Point:** Increase as IMF strength increases (more energy needed to separate molecules).
        - **Vapor Pressure:** **Decreases** as IMF strength increases. Stronger forces hold molecules in the liquid phase, preventing them from escaping into the gas phase.
        - **Viscosity:** The resistance of a liquid to flow. Increases with stronger IMFs (and with longer, entangled molecules).
        - **Surface Tension:** The energy required to increase the surface area of a liquid. Molecules at the surface are pulled inward by IMFs. Stronger IMFs → higher surface tension (water has very high surface tension due to hydrogen bonding).
      check:
        id: chk-imf-5
        type: multipleChoice
        prompt: |
          Comparing diethyl ether (weak IMFs) and water (strong IMFs), which of the following is true at room temperature?
        choices:
          - id: a
            text: Diethyl ether has a higher boiling point and higher vapor pressure.
          - id: b
            text: Water has a higher boiling point and higher vapor pressure.
          - id: c
            text: Water has a higher boiling point and lower vapor pressure.
          - id: d
            text: Diethyl ether has a higher viscosity and lower vapor pressure.
        answer:
          choiceId: c
        explanation: |
          Because water has **stronger IMFs** (hydrogen bonding), it is much harder for its molecules to escape into the gas phase, resulting in a **lower vapor pressure** and a **higher boiling point**. Diethyl ether is highly volatile (high vapor pressure) due to its weak IMFs.
