schemaVersion: 1
id: calc2-convergence-tests-easy-quiz
title: Convergence Tests Easy Quiz
assessmentType: quiz
categoryId: calculus-2
topicId: convergence-tests
skills:
- Check the term test before selecting a convergence test
- Select and apply comparison, limit comparison, integral, ratio, and root tests
- Recognize test hypotheses and inconclusive outcomes
navigation:
  learningGoal: practice
  activityType: mixedPractice
  tags:
  - calculus-2
  - convergence-tests
  - easy
  - test-selection
modeDefault: practice
randomizeQuestions: true
questions:
- id: q001
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    What does $\lim a_n=2$ prove about $\sum a_n$?
  choices:
  - id: a
    text: The series diverges.
  - id: b
    text: The series converges to $2$.
  - id: c
    text: The ratio test is required.
  - id: d
    text: The series converges absolutely.
  answer:
    choiceId: a
  explanation: A convergent series must have terms tending to zero, so a nonzero limit proves divergence.
- id: q002
  type: multipleChoice
  skills:
  - apply-the-p-series-test
  prompt: |
    For which $p$ does $\sum_{n=1}^{\infty}1/n^p$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>0$
  - id: d
    text: Every real $p$
  answer:
    choiceId: a
  explanation: The p-series threshold is strict; the boundary $p=1$ is the divergent harmonic series.
- id: q003
  type: multipleChoice
  skills:
  - apply-the-geometric-series-test
  prompt: |
    Which geometric series converges?
  choices:
  - id: a
    text: |-
      $\sum(3/4)^n$
  - id: b
    text: |-
      $\sum(5/4)^n$
  - id: c
    text: |-
      $\sum(-1)^n$
  - id: d
    text: |-
      $\sum2^n$
  answer:
    choiceId: a
  explanation: Only the first series has a ratio whose magnitude is strictly below one.
- id: q004
  type: multipleChoice
  skills:
  - check-integral-test-hypotheses
  prompt: |
    Which conditions are required for the standard integral test with
    $a_n=f(n)$?
  choices:
  - id: a
    text: $f$ is continuous, positive, and decreasing eventually.
  - id: b
    text: $f$ is negative and increasing.
  - id: c
    text: $f$ is periodic.
  - id: d
    text: $f$ has an elementary antiderivative only.
  answer:
    choiceId: a
  explanation: Rectangle-integral comparison requires a positive decreasing continuous model on a tail
    interval.
- id: q005
  type: multipleChoice
  skills:
  - use-direct-comparison-for-convergence
  prompt: |
    For positive terms, which fact proves $\sum a_n$ converges?
  choices:
  - id: a
    text: |-
      $0\le a_n\le b_n$ and $\sum b_n$ converges
  - id: b
    text: |-
      $0\le a_n\le b_n$ and $\sum b_n$ diverges
  - id: c
    text: |-
      $a_n\ge b_n\ge0$ and $\sum b_n$ converges
  - id: d
    text: |-
      $a_n\to0$
  answer:
    choiceId: a
  explanation: A positive series dominated by one with finite total mass must also have finite total mass.
- id: q006
  type: multipleChoice
  skills:
  - use-direct-comparison-for-divergence
  prompt: |
    For nonnegative terms, which fact proves $\sum a_n$ diverges?
  choices:
  - id: a
    text: |-
      $a_n\ge b_n$ and $\sum b_n$ diverges
  - id: b
    text: |-
      $a_n\le b_n$ and $\sum b_n$ diverges
  - id: c
    text: |-
      $a_n\ge b_n$ and $\sum b_n$ converges
  - id: d
    text: $a_n$ is bounded
  answer:
    choiceId: a
  explanation: A series at least as large as a divergent positive benchmark cannot have bounded partial
    sums.
- id: q007
  type: multipleChoice
  skills:
  - apply-limit-comparison
  prompt: |
    If $a_n,b_n>0$ and $\lim a_n/b_n=4$, what follows?
  choices:
  - id: a
    text: |-
      $\sum a_n$ and $\sum b_n$ have the same convergence behavior.
  - id: b
    text: Both series converge to $4$.
  - id: c
    text: |-
      $\sum a_n$ always diverges.
  - id: d
    text: |-
      $\sum a_n$ always converges.
  answer:
    choiceId: a
  explanation: A finite positive asymptotic ratio makes the terms comparable in both directions on a tail.
- id: q008
  type: multipleChoice
  skills:
  - apply-the-ratio-test
  prompt: |
    If $\lim|a_{n+1}/a_n|=0.6$, what does the ratio test prove?
  choices:
  - id: a
    text: Absolute convergence
  - id: b
    text: Conditional convergence
  - id: c
    text: Divergence
  - id: d
    text: No conclusion
  answer:
    choiceId: a
  explanation: A ratio limit strictly below one proves convergence of the magnitude series.
- id: q009
  type: multipleChoice
  skills:
  - apply-the-root-test
  prompt: |
    If $\lim\sqrt[n]{|a_n|}=3/2$, what does the root test prove?
  choices:
  - id: a
    text: The series diverges.
  - id: b
    text: The series converges absolutely.
  - id: c
    text: The series converges conditionally.
  - id: d
    text: The series sums to $3/2$.
  answer:
    choiceId: a
  explanation: A root limit above one means the terms fail to decay geometrically and in fact do not approach
    zero.
- id: q010
  type: multipleChoice
  skills:
  - recognize-inconclusive-test-results
  prompt: |
    What does a ratio-test limit of $1$ mean?
  choices:
  - id: a
    text: The ratio test is inconclusive.
  - id: b
    text: The series converges.
  - id: c
    text: The series diverges.
  - id: d
    text: The series is geometric.
  answer:
    choiceId: a
  explanation: Both convergent and divergent p-series have consecutive ratio limits equal to one.
- id: q011
  type: multipleChoice
  skills:
  - select-tests-for-factorials
  prompt: |
    Which test is usually most direct for $\sum n!/5^n$?
  choices:
  - id: a
    text: Ratio test
  - id: b
    text: Integral test
  - id: c
    text: Alternating-series test
  - id: d
    text: Telescoping test
  answer:
    choiceId: a
  explanation: Consecutive factorials cancel to $n+1$, making the ratio easy to evaluate.
- id: q012
  type: multipleChoice
  skills:
  - select-tests-for-nth-powers
  prompt: |
    Which test is especially natural for
    $\sum[(2n+1)/(3n+4)]^n$?
  choices:
  - id: a
    text: Root test
  - id: b
    text: Integral test
  - id: c
    text: Telescoping
  - id: d
    text: Alternating-series test
  answer:
    choiceId: a
  explanation: The nth root removes the outer exponent and leaves a simple rational limit of $2/3$.
- id: q013
  type: multipleChoice
  skills:
  - diagnose-integral-test-misuse
  prompt: |
    Why is the standard integral test not directly applicable to
    $\sum(-1)^n/n$?
  choices:
  - id: a
    text: The summand model is not positive.
  - id: b
    text: $1/x$ has no antiderivative.
  - id: c
    text: The terms do not approach zero.
  - id: d
    text: The index begins at one.
  answer:
    choiceId: a
  explanation: The standard integral test compares positive areas and does not incorporate alternating
    signs.
- id: q014
  type: multipleChoice
  skills:
  - choose-asymptotic-comparisons
  prompt: |
    Which benchmark is best for limit comparison with
    $(4n^2+1)/(n^5+3)$?
  choices:
  - id: a
    text: $1/n^3$
  - id: b
    text: $1/n^2$
  - id: c
    text: $1/n^5$
  - id: d
    text: $2^{-n}$
  answer:
    choiceId: a
  explanation: The dominant quotient is $4n^2/n^5=4/n^3$.
- id: q015
  type: multipleChoice
  skills:
  - use-test-selection-workflows
  prompt: |
    What should usually be checked before applying a more specialized
    convergence test?
  choices:
  - id: a
    text: Whether the terms approach zero
  - id: b
    text: Whether the exact sum is an integer
  - id: c
    text: Whether the first term is positive
  - id: d
    text: Whether the index can be renamed
  answer:
    choiceId: a
  explanation: A failed zero-term condition ends the problem immediately and prevents unnecessary work.
