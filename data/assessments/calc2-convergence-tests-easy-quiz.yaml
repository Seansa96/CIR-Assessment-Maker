  prompt: 'Which geometric series converges?

    '
  choices:
  - id: a
    text: |-
      $\sum(3/4)^n$
  - id: b
    text: |-
      $\sum(5/4)^n$
  - id: c
    text: |-
      $\sum(-1)^n$
  - id: d
    text: |-
      $\sum2^n$
  answer:
    choiceId: a
  explanation: |-
    Solution: Only the first series has a ratio whose magnitude is strictly below one. Therefore the answer is $\sum(3/4)^n$.

    Why it works: Write the series as $\sum(-1)^n b_n$. The Alternating Series Test requires $b_n\ge0$, eventual decrease, and $b_n\to0$; then test $\sum b_n$ separately to distinguish absolute from conditional convergence.

    Common trap: Alternation alone is not enough. A series can pass the Alternating Series Test yet fail absolute convergence.

    Why the other choices fail: $\sum(5/4)^n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum(-1)^n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$; $\sum2^n$ conflicts with this criterion: Write the series as $\sum(-1)^n b_n$.
