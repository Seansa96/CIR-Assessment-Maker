- id: q005
  type: multipleChoice
  skills:
  - use-direct-comparison-for-convergence
  prompt: |
    For positive terms, which fact proves $\sum a_n$ converges?
  choices:
  - id: a
    text: |-
      $0\le a_n\le b_n$ and $\sum b_n$ converges
  - id: b
    text: |-
      $0\le a_n\le b_n$ and $\sum b_n$ diverges
  - id: c
    text: |-
      $a_n\ge b_n\ge0$ and $\sum b_n$ converges
  - id: d
    text: |-
      $a_n\to0$
  answer:
    choiceId: a
  explanation: |-
    Solution: A positive series dominated by one with finite total mass must also have finite total mass. Therefore the answer is $0\le a_n\le b_n$ and $\sum b_n$ converges.

    Why it works: Direct comparison uses nonnegative terms. An upper bound by a convergent benchmark proves convergence, while a lower bound by a divergent benchmark proves divergence.

    Common trap: The inequality direction matters: an upper bound by a divergent series and a lower bound by a convergent series prove nothing.

    Why the other choices fail: $0\le a_n\le b_n$ and $\sum b_n$ diverges conflicts with this criterion: Direct comparison uses nonnegative terms; $a_n\ge b_n\ge0$ and $\sum b_n$ converges conflicts with this criterion: Direct comparison uses nonnegative terms; $a_n\to0$ conflicts with this criterion: Direct comparison uses nonnegative terms.
