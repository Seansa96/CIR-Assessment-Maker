- id: q001
  type: multipleChoice
  skills:
  - apply-the-divergence-test
  prompt: |
    What does $\lim a_n=2$ prove about $\sum a_n$?
  choices:
  - id: a
    text: The series diverges.
  - id: b
    text: The series converges to $2$.
  - id: c
    text: The ratio test is required.
  - id: d
    text: The series converges absolutely.
  answer:
    choiceId: a
  explanation: |-
    Solution: A convergent series must have terms tending to zero, so a nonzero limit proves divergence. Therefore the answer is The series diverges.. Therefore the answer is The series diverges.. Therefore the answer is The series diverges.. Therefore the answer is The series diverges.. Therefore the answer is The series diverges.. Therefore the answer is The series diverges..

    Why it works: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors. The Ratio Test gives absolute convergence for $L<1$, divergence for $L>1$, and no conclusion for $L=1$.

    Common trap: Do not reverse the ratio or treat $L=1$ as convergence; factorial cancellation must be completed before taking the limit.

    Why the other choices fail: The series converges to $2$. conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; The ratio test is required. conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors; The series converges absolutely. conflicts with this criterion: Form $L=\lim_{n\to\infty}|a_{n+1}/a_n|$ after cancelling common factors.
- id: q002
  type: multipleChoice
  skills:
  - apply-the-p-series-test
  prompt: |
    For which $p$ does $\sum_{n=1}^{\infty}1/n^p$ converge?
  choices:
  - id: a
    text: $p>1$
  - id: b
    text: |-
      $p\ge1$
  - id: c
    text: $p>0$
  - id: d
    text: Every real $p$
  answer:
    choiceId: a
  explanation: |-
    Solution: The p-series threshold is strict; the boundary $p=1$ is the divergent harmonic series. Therefore the answer is $p>1$.

    Why it works: Match the positive tail to $\sum 1/n^p$. Its threshold is strict: it converges only when $p>1$ and diverges for $p\le1$.

    Common trap: The harmonic boundary $p=1$ diverges, so replacing $p>1$ with $p\ge1$ changes the conclusion.

    Why the other choices fail: $p\ge1$ conflicts with this criterion: Match the positive tail to $\sum 1/n^p$; $p>0$ conflicts with this criterion: Match the positive tail to $\sum 1/n^p$; Every real $p$ conflicts with this criterion: Match the positive tail to $\sum 1/n^p$.
- id: q003
  type: multipleChoice
