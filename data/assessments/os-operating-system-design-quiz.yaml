- id: q004
  title: Explain Reliability
  type: freeResponse
  prompt: 'In a short answer, explain why **Reliability** matters in Operating System Design.

    '
  answer:
    expected: 'Reliability improves when faults are isolated, interfaces are narrow, and recovery paths are designed intentionally.
      A complete answer should also note that reliability is not added only by testing at the end.

      '
    gradingMode: selfCheck
    keyPoints:
    - Names Reliability
    - Explains the OS mechanism or boundary
    - Mentions the relevant tradeoff or clarifying boundary
  explanation: 'Related topic: Operating System Design. The key is to connect the term to what the OS controls or protects.

    '
