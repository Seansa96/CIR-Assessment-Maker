questions:
- id: q001
  title: Recognize Design requirements
  type: multipleChoice
  prompt: 'Which statement best describes **Design requirements** in operating systems?

    '
  choices:
  - id: a
    text: An OS design starts from goals such as reliability, performance, portability, security, maintainability, and compatibility.
  - id: b
    text: It is only a naming convention and does not affect resource sharing, protection, or scheduling.
  - id: c
    text: It is handled entirely by application code without kernel or operating-system involvement.
  - id: d
    text: It can always be solved by adding faster hardware rather than changing operating-system design.
  answer:
    choiceId: a
  explanation: 'An OS design starts from goals such as reliability, performance, portability, security, maintainability, and
    compatibility. The distractors either ignore the OS boundary or confuse a design tradeoff with a universal rule.

    '
