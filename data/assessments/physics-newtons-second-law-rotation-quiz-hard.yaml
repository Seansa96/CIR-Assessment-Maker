questions:
- id: q1
  type: numericResponse
  prompt: A solid disk ($I = \frac{1}{2}MR^2$) of mass $10 \text{ kg}$ and radius
    $0.5 \text{ m}$ is pulled by a string wrapped around its edge with a constant
    tension of $15 \text{ N}$. What is the angular acceleration?
  answer:
    value: 6.0
    tolerance: 0.5
  explanation: $I = 0.5(10)(0.25) = 1.25 \text{ kg}\cdot\text{m}^2$. $\tau = rF =
    0.5(15) = 7.5 \text{ N}\cdot\text{m}$. $\alpha = 7.5 / 1.25 = 6.0 \text{ rad/s}^2$.
