questions:
- id: hard-q001
  type: numericResponse
  prompt: A wheel with moment of inertia 2.0 kg m^2 experiences a net torque of 10 N m. What angular acceleration in rad/s^2 results?
  answer: { value: 5, tolerance: 0.1 }
  explanation: |
    Solution: $\alpha=\tau_{net}/I=10/2.0=5.0$ rad/s^2.

    Why it works: Rotational Newton’s second law relates net torque to angular acceleration in the same way net force relates to linear acceleration.
  difficultyDimensions: [modelOrDerivation, unitAnalysis, representationTransfer]
  subjectDifficultyTags: [netTorque]
  difficultyEvidence: A rotational analogue of Newton's second law is selected with its moment-of-inertia parameter.
  prerequisiteObjectiveIds: [phys1-obj-torque]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
- id: hard-q002
  type: numericResponse
  prompt: A 0.50 m radius disk has $I=1.5$ kg m^2. A 18 N tangential force and an opposing 6 N tangential force act at the rim. What angular acceleration in rad/s^2 results?
  answer: { value: 4, tolerance: 0.08 }
  explanation: |
    Solution: $\tau_{net}=(18-6)(0.50)=6.0$ N m. Therefore $\alpha=6.0/1.5=4.0$ rad/s^2.

    Why it works: Tangential rim forces produce torques equal to force times radius, and their opposing senses must be combined before applying $\tau_{net}=I\alpha$.
  difficultyDimensions: [multiStep, signConvention, modelOrDerivation]
  subjectDifficultyTags: [competingTorques]
  difficultyEvidence: Force geometry and rotational direction are both resolved before the dynamics relation is applied.
  prerequisiteObjectiveIds: [phys1-obj-torque]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
- id: hard-q003
  type: numericResponse
  prompt: A 12 N force acts at 30 degrees to a 0.40 m radius on a wheel with $I=0.80$ kg m^2. What angular acceleration in rad/s^2 does it produce?
  answer: { value: 3, tolerance: 0.06 }
  explanation: |
    Solution: $\tau=rF\sin\theta=(0.40)(12)\sin30^\circ=2.4$ N m. Then $\alpha=2.4/0.80=3.0$ rad/s^2.

    Why it works: Only the force component perpendicular to the radius produces torque; that torque divided by inertia sets the angular acceleration.
  difficultyDimensions: [representationTransfer, trigonometricModel, multiStep]
  subjectDifficultyTags: [angledForce]
  difficultyEvidence: The force-angle geometry must be converted into torque before rotational dynamics can be applied.
  prerequisiteObjectiveIds: [phys1-obj-torque]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
- id: hard-q004
  type: symbolicResponse
  prompt: A tangential force $F$ acts at the rim of a solid disk of mass $M$ and radius $R$. Enter the resulting angular acceleration.
  answer:
    expectedLatex: '2*F/(M*R)'
    equivalenceMode: expression
    variables: [F, M, R]
    tolerance: 0.000001
  explanation: |
    Solution: $\tau=FR$ and $I=\tfrac12MR^2$. Thus $\alpha=\tau/I=FR/(\tfrac12MR^2)=2F/(MR)$.

    Why it works: The tangential force supplies a rim torque and the disk’s mass distribution supplies its moment of inertia.
  difficultyDimensions: [symbolicManipulation, modelCombination, reverseReasoning]
  subjectDifficultyTags: [solidDisk]
  difficultyEvidence: Torque and shape-specific inertia models must be combined symbolically.
  prerequisiteObjectiveIds: [phys1-obj-moment-of-inertia-ke]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
- id: hard-q005
  type: multipleChoice
  prompt: Two objects receive the same nonzero net torque. Object A has twice the moment of inertia of object B. How do their angular accelerations compare?
  choices:
  - { id: a, text: Object A has half the angular acceleration of object B. }
  - { id: b, text: Object A has twice the angular acceleration of object B. }
  - { id: c, text: They have equal angular acceleration. }
  - { id: d, text: Neither accelerates because their torques are equal. }
  answer: { choiceId: a }
  explanation: |
    Solution: Object A has half the angular acceleration of object B.

    Why it works: For the same net torque, $\alpha=\tau_{net}/I$, so angular acceleration is inversely proportional to moment of inertia.

    Why the other choices fail: Doubling inertia cannot double acceleration; equal torque does cause acceleration, but the unequal inertias give unequal values.
  difficultyDimensions: [proportionalReasoning, reverseReasoning, errorDiagnosis]
  subjectDifficultyTags: [inertiaComparison]
  difficultyEvidence: The dynamics relation is used qualitatively and in reverse to compare two systems.
  prerequisiteObjectiveIds: [phys1-obj-moment-of-inertia-ke]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
- id: hard-q006
  type: numericResponse
  prompt: A rotor with $I=4.0$ kg m^2 accelerates from rest to 18 rad/s in 6.0 s at constant angular acceleration. What net torque in N m is required?
  answer: { value: 12, tolerance: 0.2 }
  explanation: |
    Solution: $\alpha=(18-0)/6.0=3.0$ rad/s^2. Then $\tau_{net}=I\alpha=(4.0)(3.0)=12$ N m.

    Why it works: The angular kinematics supplies the acceleration first, then rotational Newton’s second law converts that acceleration into a required torque.
  difficultyDimensions: [multiStep, modelCombination, reverseReasoning]
  subjectDifficultyTags: [kinematicsToDynamics]
  difficultyEvidence: Kinematics and dynamics must be sequenced, with torque inferred from a target rotational motion.
  prerequisiteObjectiveIds: [phys1-obj-rotational-variables]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
- id: hard-q007
  type: multipleChoice
  prompt: A force is applied directly through a wheel’s axis. What angular acceleration about that axis does this force produce by itself?
  choices:
  - { id: a, text: Zero, because its lever arm is zero. }
  - { id: b, text: The largest possible value, because the force is at the axis. }
  - { id: c, text: A value equal to force divided by mass. }
  - { id: d, text: An undefined value because the radius is zero. }
  answer: { choiceId: a }
  explanation: |
    Solution: Zero, because its lever arm is zero.

    Why it works: A line of action through the axis has no perpendicular distance, so it contributes no torque and therefore no angular acceleration about that axis.

    Why the other choices fail: Force divided by mass is linear, not rotational, acceleration; the geometry gives a well-defined zero torque rather than a maximum or undefined result.
  difficultyDimensions: [representationTransfer, errorDiagnosis, modelOrDerivation]
  subjectDifficultyTags: [zeroTorque]
  difficultyEvidence: Geometric line-of-action reasoning is connected to rotational, not linear, acceleration.
  prerequisiteObjectiveIds: [phys1-obj-torque]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
- id: hard-q008
  type: numericResponse
  prompt: A 3.0 kg point mass is attached 0.60 m from a frictionless axle. A 9.0 N tangential force acts on the mass. What angular acceleration in rad/s^2 results about the axle?
  answer: { value: 5, tolerance: 0.1 }
  explanation: |
    Solution: $I=mr^2=3.0(0.60)^2=1.08$ kg m^2 and $\tau=Fr=9.0(0.60)=5.4$ N m. Thus $\alpha=5.4/1.08=5.0$ rad/s^2.

    Why it works: A point mass’s inertia grows with the square of its radius, while a tangential force’s torque grows linearly with radius.
  difficultyDimensions: [modelCombination, multiStep, representationTransfer]
  subjectDifficultyTags: [pointMassInertia]
  difficultyEvidence: The point-mass inertia and force torque must be constructed from the same radius before being combined.
  prerequisiteObjectiveIds: [phys1-obj-torque]
  extensionObjectiveIds: [phys1-obj-newtons-second-law-rotation]
