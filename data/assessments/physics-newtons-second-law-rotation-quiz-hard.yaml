questions:
- id: hard-q001
  type: numericResponse
  prompt: |-
    A net torque of $10\text{ N}\cdot\text{m}$ acts on a wheel with $I = 2.0\text{ kg}\cdot\text{m}^2$. What is its angular acceleration?
  answer:
    value: 5.0
    tolerance: 0.1
  explanation: |-
    $\alpha = \frac{\tau_{net}}{I} = \frac{10}{2.0} = 5.0$ rad/s$^2$.
