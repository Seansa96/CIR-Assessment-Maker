- id: hard-q007
  type: symbolicResponse
  prompt: |-
    A force $F$ is applied tangentially to the edge of a solid uniform disk of mass $M$ and radius $R$. Derive the expression for its angular acceleration $\alpha$.
  answer:
    expectedLatex: |-
      \frac{2F}{MR}
    equivalenceMode: derivative
    variables:
    - F
    - M
    - R
    tolerance: 0.001
  explanation: |-
    Torque is $\tau = FR$. MOI of a solid disk is $I = \frac{1}{2}MR^2$. Using $\tau = I\alpha$, we get $FR = (\frac{1}{2}MR^2)\alpha \implies \alpha = \frac{2F}{MR}$.
