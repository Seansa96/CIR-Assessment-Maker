questions:
- id: q001
  type: symbolicResponse
  prompt: Solve $y'+y=0$ with $y(0)=7$.
  skills:
  - ede-ch02-first-order-equations-linear-ivps
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-linear-ivps
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: 7e^{-x}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: |-
    Solution: The general solution is $Ce^{-x}$ and the initial value gives $C=7$.

    Why it works: Differentiation gives $y'=-y$ and $y(0)=7$.
- id: q002
  type: multipleChoice
  prompt: Which equation is separable as written?
  skills:
  - ede-ch02-first-order-equations-separable-equilibria
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-separable-equilibria
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $y'=x(1+y^2)$
  - id: b
    text: $y'+xy=1$
    issueSignals:
    - id: ede-method-selection-error
      domains: &id001
      - elementary-differential-equations-bvp
  - id: c
    text: $y'=x+y$
    issueSignals:
    - id: ede-separation-error
      domains: *id001
  - id: d
    text: $y''=xy$
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $y'=x(1+y^2)$ is separable.

    Why it works: It becomes $dy/(1+y^2)=x\,dx$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q003
  type: symbolicResponse
  prompt: Solve $y'=xy$ with $y(0)=2$.
  skills:
  - ede-ch02-first-order-equations-separable-equilibria
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - symbolicExecution
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-separable-equilibria
  difficultyEvidence: Requires carrying out symbolic steps and checking the resulting expression.
  answer:
    expectedLatex: 2e^{x^2/2}
    equivalenceMode: expression
    variables:
    - x
    tolerance: 0.0001
  explanation: |-
    Solution: Separation gives $\ln|y|=x^2/2+C$, and the condition gives $y=2e^{x^2/2}$.

    Why it works: Differentiation returns $xy$ and the initial value is $2$.
- id: q004
  type: multipleChoice
  prompt: For $y'=y^{1/3}$, $y(0)=0$, which standard theorem conclusion is justified?
  skills:
  - ede-ch02-first-order-equations-existence-uniqueness
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-existence-uniqueness
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: Continuity gives existence, but continuity of $f_y$ fails at zero so the standard uniqueness test does
      not apply.
  - id: b
    text: No solution exists.
    issueSignals:
    - id: ede-existence-uniqueness-confusion
      domains: *id001
  - id: c
    text: Continuity of $f$ alone guarantees uniqueness.
    issueSignals:
    - id: ede-existence-uniqueness-confusion
      domains: *id001
  - id: d
    text: The equation is linear.
    issueSignals:
    - id: ede-equation-structure-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Existence is supported, while the standard uniqueness test does not apply.

    Why it works: $f$ is continuous but $f_y$ is singular at zero.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q005
  type: multipleChoice
  prompt: Which substitution is appropriate for $y'+y=xy^2$?
  skills:
  - ede-ch02-first-order-equations-nonlinear-transformations
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-nonlinear-transformations
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: $v=y^{-1}$
  - id: b
    text: $v=y/x$
    issueSignals:
    - id: ede-homogeneous-substitution-error
      domains: *id001
  - id: c
    text: $v=y^2$
    issueSignals:
    - id: ede-bernoulli-substitution-error
      domains: *id001
  - id: d
    text: $v=x+y$
    issueSignals:
    - id: ede-method-selection-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Use $v=y^{-1}$.

    Why it works: This is Bernoulli with $n=2$, so $v=y^{1-n}$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
