- id: q007
  type: numericResponse
  prompt: For $M=x^2+2y$ and $N=2x+3y^2$, evaluate $M_y-N_x$.
  skills:
  - ede-ch02-first-order-equations-exact-equations
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - calculation
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-exact-equations
  difficultyEvidence: Requires forming the relevant expression and evaluating it accurately.
  answer:
    value: 0
    tolerance: 0
  explanation: |-
    Solution: $M_y=2$ and $N_x=2$, so the difference is $0$.

    Why it works: A zero difference confirms the cross-partial exactness test.
- id: q008
  type: multipleChoice
  prompt: 'If $\Phi_x=2xy$ and $\Phi_y=x^2+6y$, which potential is correct up to a constant?'
  skills:
  - ede-ch02-first-order-equations-exact-equations
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-exact-equations
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: '$\Phi=x^2y+3y^2$'
  - id: b
    text: '$\Phi=2xy+x^2+6y$'
    issueSignals:
    - id: ede-potential-function-error
      domains: *id001
  - id: c
    text: '$\Phi=x^2y+6y$'
    issueSignals:
    - id: ede-potential-function-error
      domains: *id001
  - id: d
    text: '$\Phi=xy^2+3y^2$'
    issueSignals:
    - id: ede-exactness-test-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $\Phi=x^2y+3y^2$.

    Why it works: Its partial derivatives are exactly the two supplied components.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q009
  type: multipleChoice
  prompt: For a nonexact equation, $(M_y-N_x)/N=4x$ throughout a region. Which integrating factor is supported?
  skills:
  - ede-ch02-first-order-equations-integrating-factors
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-integrating-factors
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: '$\mu(x)=e^{2x^2}$'
  - id: b
    text: '$\mu(x)=4x$'
    issueSignals:
    - id: ede-integrating-factor-error
      domains: *id001
  - id: c
    text: '$\mu(y)=e^{4y}$'
    issueSignals:
    - id: ede-integrating-factor-error
      domains: *id001
  - id: d
    text: '$\mu(x)=2x^2$'
    issueSignals:
    - id: ede-integrating-factor-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: $\mu=e^{\int4x dx}=e^{2x^2}$.

    Why it works: The diagnostic depends only on $x$ and must be integrated before exponentiation.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
- id: q010
  type: multipleChoice
  prompt: For $y'+(1/x)y=x$ with $y(2)=1$, which interval is appropriate before solving?
  skills:
  - ede-ch02-first-order-equations-linear-ivps
  media: []
  difficultyDimensions:
  - modelOrDerivation
  - errorDiagnosis
  subjectDifficultyTags:
  - ede-ch02-first-order-equations-linear-ivps
  difficultyEvidence: Requires selecting a governing relation, applying a stated condition, and diagnosing a plausible
    error.
  choices:
  - id: a
    text: '$(0,\infty)$'
  - id: b
    text: '$(-\infty,0)$'
    issueSignals:
    - id: ede-condition-ignored
      domains: *id001
  - id: c
    text: '$(-\infty,\infty)$'
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  - id: d
    text: '$(2,\infty)$'
    issueSignals:
    - id: ede-validity-interval-error
      domains: *id001
  answer:
    choiceId: a
  explanation: |-
    Solution: Use $(0,\infty)$.

    Why it works: The coefficient is discontinuous at zero, and the maximal connected interval must contain $2$.

    Why the other choices fail: The distractors reflect the registered structural, condition, or method errors rather than the stated equation.
