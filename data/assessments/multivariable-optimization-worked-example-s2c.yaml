workedExamples:
- id: example-001
  title: Build the representation
  problem: Find the constrained extrema of $f(x,y)=x+y$ subject to $x^2+y^2=1$.
  steps:
  - id: s001
    title: Set gradient relation
    instruction: What equation is required?
    type: multipleChoice
    prompt: What equation is required?
    choices:
    - id: a
      text: '$\langle1,1\rangle=\lambda\langle2x,2y\rangle$'
    - id: b
      text: '$\sqrt2$ (answers ''What is the maximum?'', not ''What equation is required?'')'
      issueSignals:
      - id: algebraic-simplification-error
    - id: c
      text: $f_x=0$ and $f_y=0$ (answers 'What is required at an interior differentiable critical point?', not 'What equation
        is required?')
      issueSignals:
      - id: sign-error
    - id: d
      text: A saddle point (answers 'If D is negative at a critical point, what is it?', not 'What equation is required?')
      issueSignals:
      - id: algebraic-simplification-error
    answer:
      choiceId: a
    issueSignals:
    - id: algebraic-simplification-error
    difficultyDimensions:
    - representationTransfer
    - auxiliaryTechnique
    explanation: 'Solution: $\langle1,1\rangle=\lambda\langle2x,2y\rangle$

      Why it works: This uses the defining relationship for the topic. Review path: Calculus 1 → Classical Theorems of Differential
      Calculus.

      Why the other choices fail: Choice b, ''$\sqrt2$ (answers ''What is the maximum?'', not ''What equation is required?'')'',
      does not give ''$\langle1,1\rangle=\lambda\langle2x,2y\rangle$'' for ''What equation is required?''. It substitutes
      a different result, representation, or condition for the one the prompt specifies.

      Choice c, ''$f_x=0$ and $f_y=0$ (answers ''What is required at an interior differentiable critical point?'', not ''What
      equation is required?'')'', does not give ''$\langle1,1\rangle=\lambda\langle2x,2y\rangle$'' for ''What equation is
      required?''. It substitutes a different result, representation, or condition for the one the prompt specifies.

      Choice d, ''A saddle point (answers ''If D is negative at a critical point, what is it?'', not ''What equation is required?'')'',
      does not give ''$\langle1,1\rangle=\lambda\langle2x,2y\rangle$'' for ''What equation is required?''. It substitutes
      a different result, representation, or condition for the one the prompt specifies.'
  - id: s002
    title: Use symmetry
    instruction: What candidate directions result?
    type: multipleChoice
    prompt: What candidate directions result?
    choices:
