questions:
- id: q1
  type: numericResponse
  prompt: A wheel rotates with a constant angular acceleration of $2.0 \text{ rad/s}^2$.
    If it starts from rest, what is its angular displacement after $5.0 \text{ s}$?
  answer:
    value: 25.0
    tolerance: 0.5
  explanation: $\theta = \omega_0 t + \frac{1}{2}\alpha t^2 = 0 + 0.5(2.0)(25) = 25
    \text{ rad}$.
