questions:
- id: q001
  title: Spin-up from rpm
  type: numericResponse
  prompt: A motor speeds a disk from $120\text{ rpm}$ to $600\text{ rpm}$ in $8.0\text{
    s}$. What is $\alpha$?
  answer:
    value: 6.283
    tolerance: 0.03
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $120\text{ rpm}=4\pi$ and $600\text{ rpm}=20\pi\text{ rad/s}$, so $\alpha=2\pi$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q002
  title: Revolutions during spin-up
  type: numericResponse
  prompt: A wheel starts from rest and reaches $30\text{ rad/s}$ in $10\text{ s}$.
    How many revolutions occur?
  answer:
    value: 23.87
    tolerance: 0.1
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\theta=15(10)=150\text{ rad}$, so revolutions $=150/(2\pi)=23.9$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q003
  title: Braking alpha
  type: numericResponse
  prompt: A wheel at $40\text{ rad/s}$ stops after $20$ revolutions. What is $\alpha$?
  answer:
    value: -6.366
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $20\text{ rev}=40\pi\text{ rad}$. $0=40^2+2\alpha(40\pi)$, so $\alpha=-6.37$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q004
  title: Two-phase motion
  type: numericResponse
  prompt: A rotor starts at $5\text{ rad/s}$, accelerates at $2\text{ rad/s}^2$ for
    $6\text{ s}$, then continues at final speed for $4\text{ s}$. What total angle
    is covered?
  answer:
    value: 134.0
    tolerance: 0.5
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    First phase $\theta_1=66\text{ rad}$ and $\omega_f=17\text{ rad/s}$. Second phase
    $\theta_2=68\text{ rad}$. Total $134\text{ rad}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q005
  title: Same sign
  type: multipleChoice
  prompt: 'If $\omega_i$ and $\alpha$ are both positive, then:'
  choices:
  - id: a
    text: angular speed increases
  - id: b
    text: the wheel must slow
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: c
    text: the wheel reverses immediately
    issueSignals:
    - id: unit-conversion-error
  - id: d
    text: angular displacement must be negative
    issueSignals:
    - id: linear-angular-confusion
    - id: sign-error
  answer:
    choiceId: a
  explanation: 'Solution:

    angular speed increases


    Why it works:

    Same signs mean speeding up.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q006
  title: Quadratic time
  type: numericResponse
  prompt: A wheel starts at $4\text{ rad/s}$ with $\alpha=2\text{ rad/s}^2$. How long
    to rotate $60\text{ rad}$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $60=4t+t^2$, giving positive root $t=6\text{ s}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q007
  title: Find initial speed
  type: numericResponse
  prompt: A wheel rotates $80\text{ rad}$ in $5.0\text{ s}$ while $\alpha=4.0\text{
    rad/s}^2$. What was $\omega_i$?
  answer:
    value: 6.0
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $80=5\omega_i+50$, so $\omega_i=6\text{ rad/s}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q008
  title: Reverse stopping point
  type: numericResponse
  prompt: A wheel has $\omega_i=10\text{ rad/s}$ and $\alpha=-4\text{ rad/s}^2$. What
    angular displacement occurs before it first stops?
  answer:
    value: 12.5
    tolerance: 0.05
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $0=10^2+2(-4)\theta$, so $\theta=12.5\text{ rad}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q009
  title: Angle between speeds
  type: numericResponse
  prompt: A rotor speeds from $8$ to $20\text{ rad/s}$ with $\alpha=3\text{ rad/s}^2$.
    Through what angle?
  answer:
    value: 56.0
    tolerance: 0.2
  explanation: 'Solution:

    See numerical/symbolic answer.


    Why it works:

    $\theta=(400-64)/6=56\text{ rad}$.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
- id: q010
  title: Radians
  type: multipleChoice
  prompt: Why use radians in rotational kinematics?
  choices:
  - id: a
    text: Radians connect arc length by $s=r\theta$.
  - id: b
    text: Degrees make torque zero.
    issueSignals:
    - id: torque-force-confusion
    - id: unit-conversion-error
  - id: c
    text: Radians only matter when $\alpha=0$.
    issueSignals:
    - id: rotational-concept-misunderstood
  - id: d
    text: No conversion is ever needed.
    issueSignals:
    - id: rotational-concept-misunderstood
  answer:
    choiceId: a
  explanation: 'Solution:

    Radians connect arc length by $s=r\theta$.


    Why it works:

    Radians preserve the direct connection between angular and linear measures.


    Why the other choices fail:

    The distractors relate to common errors in fixed-axis rotation, such as confusing
    linear and angular kinematics, using the wrong lever arm, or misunderstanding
    moment of inertia.

    '
  difficultyDimensions:
  - conceptual
  - model-or-derivation
