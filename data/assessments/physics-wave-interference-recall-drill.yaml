items:
- {id: int-r1, type: cloze, prompt: 'Superposition gives $y_R={{y_1+y_2}}$.', answer: {expected: 'y_1+y_2'}, explanation: 'Solution: Add displacements. Why it works: linear waves overlap by algebraic addition.'}
- {id: int-r2, type: typed, prompt: 'What happens to a pulse reflected from a fixed end?', answer: {expected: it inverts}, explanation: 'Solution: It inverts. Why it works: the fixed boundary must remain at zero displacement.'}
- {id: int-r3, type: cloze, prompt: 'A pulse at a free end reflects {{without inversion}}.', answer: {expected: without inversion}, explanation: 'Solution: Identify no inversion. Why it works: the free end can move, so the reflected pulse maintains its displacement sign.'}
- {id: int-r4, type: typed, prompt: 'What interference results when two equal upward pulses overlap?', answer: {expected: constructive interference}, explanation: 'Solution: Constructive interference. Why it works: their positive displacements add.'}
- {id: int-r5, type: cloze, prompt: 'Equal opposite pulses can produce {{complete cancellation}}.', answer: {expected: complete cancellation}, explanation: 'Solution: Identify complete cancellation. Why it works: their algebraic displacement sum is zero.'}
- {id: int-r6, type: typed, prompt: 'At a boundary, can wave energy be both reflected and transmitted?', answer: {expected: yes}, explanation: 'Solution: Yes. Why it works: an impedance change generally splits incident energy into reflection and transmission.'}
