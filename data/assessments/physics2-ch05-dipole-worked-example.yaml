title: Electric Field of a Dipole
assessmentType: workedExample
categoryId: physics-2
topicId: physics2-electric-charges-fields
workedExamples:
- id: we1
  title: Field on the axis of a dipole
  prompt: Two charges $+q$ and $-q$ are separated by a distance $d$. Find the electric
    field on the axis connecting them, at a distance $z$ from the center ($z > d/2$).
  steps:
  - id: s1
    prompt: Set up the superposition sum.
    explanation: 'Solution:

      1) Let the origin be at the center. The positive charge is at $+d/2$ and the
      negative charge is at $-d/2$.

      2) The field from $+q$ is $E_+ = k \frac{q}{(z - d/2)^2}$ pointing away (positive
      z).

      3) The field from $-q$ is $E_- = -k \frac{q}{(z + d/2)^2}$ pointing toward (negative
      z).

      4) $E_{net} = E_+ + E_-$.


      Why it works:

      The superposition principle allows us to sum the vector contributions from individual
      point charges.'
