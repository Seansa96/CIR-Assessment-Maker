questions: []
workedExamples:
- id: dipole-axial
  title: Field on the dipole axis
  problem: Charges $+q$ and $-q$ form a dipole with moment $p=qd$. Find the far field at an axial point on the $+p$ side.
  steps:
  - id: dipole-axial-direction
    title: Compare the two contributions
    instruction: Draw both field vectors at the observation point.
    hint: The nearer charge has the larger field magnitude.
    type: multipleChoice
    prompt: What is the direction of the far axial field on the $+p$ side?
    choices:
    - { id: a, text: Along $+p$, because the nearer positive end wins over the opposite contribution }
    - { id: b, text: Along $-p$, because the negative charge always determines the far field, issueSignals: [{ id: physics2-dipole-direction-error, domains: [physics-2] }] }
    - { id: c, text: Zero, because the source charges have equal magnitude, issueSignals: [{ id: physics2-dipole-cancellation-error, domains: [physics-2] }] }
    - { id: d, text: Perpendicular to the dipole axis, issueSignals: [{ id: physics2-dipole-geometry-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: On the $+p$ side, the positive charge's outward field is $+p$-directed and is slightly stronger than the negative charge's opposing field.
      Why it works: Equal charges do not cancel when their distances differ.
      Why the other choices fail: They confuse equal source magnitudes with equal field contributions or choose the wrong geometry.
  - id: dipole-axial-expression
    title: Retain the leading term
    instruction: Subtract the two axial Coulomb fields and expand for $x\gg d$.
    hint: The $1/x^2$ terms cancel; the first surviving term contains $p$.
    type: multipleChoice
    prompt: Which far-axial magnitude is correct?
    choices:
    - { id: a, text: '$kp/x^2$', issueSignals: [{ id: physics2-dipole-monopole-error, domains: [physics-2] }] }
    - { id: b, text: '$2kp/x^3$' }
    - { id: c, text: '$kp/(2x^3)$', issueSignals: [{ id: physics2-dipole-factor-error, domains: [physics-2] }] }
    - { id: d, text: '$2kpx^{-2}$', issueSignals: [{ id: physics2-dipole-power-error, domains: [physics-2] }] }
    answer: { choiceId: b }
    explanation: >
      Solution: Expanding the difference of the two fields gives the first nonzero term $E_{ax}=2kp/x^3$.
      Why it works: A dipole has zero net charge, so the monopole $1/x^2$ term cancels.
      Why the other choices fail: They retain monopole scaling or use the wrong geometric factor.
  - id: dipole-axial-number
    title: Evaluate the axial field
    instruction: Substitute $p=6.0\,\mathrm{nC\,m}$ and $x=0.20\,\mathrm m$.
    hint: Use $k=8.99\times10^9$.
    type: multipleChoice
    prompt: Which value is closest to the far axial field magnitude?
    choices:
    - { id: a, text: '$1.35\times10^4\,\mathrm{N/C}$' }
    - { id: b, text: '$6.74\times10^3\,\mathrm{N/C}$', issueSignals: [{ id: physics2-dipole-axial-factor-error, domains: [physics-2] }] }
    - { id: c, text: '$1.35\times10^3\,\mathrm{N/C}$', issueSignals: [{ id: physics2-dipole-distance-power-error, domains: [physics-2] }] }
    - { id: d, text: '$1.35\times10^4\,\mathrm{N/C}$ opposite to $p$', issueSignals: [{ id: physics2-dipole-sign-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: $E=2kp/x^3=2(8.99\times10^9)(6.0\times10^{-9})/(0.20)^3=1.35\times10^4\,\mathrm{N/C}$.
      Why it works: The axial factor is two and the direction is along $p$ on the positive side.
      Why the other choices fail: b is the equatorial magnitude, c loses a factor of ten, and d reverses the direction.
- id: dipole-equatorial
  title: Field on the perpendicular bisector
  problem: Use the same dipole with $p=6.0\,\mathrm{nC\,m}$ and find the far field at radius $r=0.20\,\mathrm m$ on its perpendicular bisector.
  steps:
  - id: dipole-equatorial-direction
    title: Use perpendicular-bisector symmetry
    instruction: Pair the fields from $+q$ and $-q$.
    hint: The observation point is equally distant from both charges.
    type: multipleChoice
    prompt: Which component pattern is correct at the equatorial point?
    choices:
    - { id: a, text: Components perpendicular to the dipole axis cancel; axial components add toward $-q$ }
    - { id: b, text: Axial components cancel, leaving zero field, issueSignals: [{ id: physics2-dipole-cancellation-error, domains: [physics-2] }] }
    - { id: c, text: Both fields point away from the center, issueSignals: [{ id: physics2-dipole-vector-addition-error, domains: [physics-2] }] }
    - { id: d, text: The field points from $-q$ toward $+q$, issueSignals: [{ id: physics2-dipole-direction-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: Equal distances cancel the components perpendicular to the dipole axis; the two axial components point toward $-q$ and add.
      Why it works: Symmetry cancels equal opposite components but preserves the aligned components.
      Why the other choices fail: They cancel the wrong components, add vectors by magnitude, or reverse the dipole direction.
  - id: dipole-equatorial-expression
    title: Apply the geometric factor
    instruction: Use the far-field dipole result on the perpendicular bisector.
    hint: Compare with the axial result at the same distance.
    type: multipleChoice
    prompt: Which far-equatorial magnitude is correct?
    choices:
    - { id: a, text: '$kp/r^3$' }
    - { id: b, text: '$2kp/r^3$', issueSignals: [{ id: physics2-dipole-geometry-factor-error, domains: [physics-2] }] }
    - { id: c, text: '$kp/r^2$', issueSignals: [{ id: physics2-dipole-monopole-error, domains: [physics-2] }] }
    - { id: d, text: '$kpr^3$', issueSignals: [{ id: physics2-dipole-power-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: The equatorial dipole magnitude is $kp/r^3$, half the axial magnitude at the same distance.
      Why it works: The same dipole cancellation leaves a $1/r^3$ term but the geometry changes the factor from two to one.
      Why the other choices fail: b uses the axial factor, c uses monopole scaling, and d has the distance power inverted.
  - id: dipole-equatorial-number
    title: Evaluate the equatorial field
    instruction: Substitute the given moment and radius.
    hint: Use $E=kp/r^3$.
    type: multipleChoice
    prompt: Which value is closest to the equatorial field magnitude?
    choices:
    - { id: a, text: '$6.74\times10^3\,\mathrm{N/C}$' }
    - { id: b, text: '$1.35\times10^4\,\mathrm{N/C}$', issueSignals: [{ id: physics2-dipole-axial-factor-error, domains: [physics-2] }] }
    - { id: c, text: '$3.37\times10^3\,\mathrm{N/C}$', issueSignals: [{ id: physics2-dipole-distance-power-error, domains: [physics-2] }] }
    - { id: d, text: '$6.74\times10^3\,\mathrm{N/C}$ toward $+q$', issueSignals: [{ id: physics2-dipole-sign-error, domains: [physics-2] }] }
    answer: { choiceId: a }
    explanation: >
      Solution: $E=kp/r^3=(8.99\times10^9)(6.0\times10^{-9})/(0.20)^3=6.74\times10^3\,\mathrm{N/C}$ toward $-q$.
      Why it works: The equatorial magnitude is half the axial result at equal distance.
      Why the other choices fail: b doubles the correct result, c uses the wrong distance power, and d reverses the direction.
