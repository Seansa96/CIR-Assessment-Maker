schemaVersion: 1
id: calc2-disk-washer-recall
title: Disk and Washer Method Recall
assessmentType: recallDrill
categoryId: calculus-2
subcategoryId: volumes-of-solids
subcategoryIds:
  - volumes-of-solids
modeDefault: practice
randomizeQuestions: true
items:
  - id: r001
    type: typed
    prompt: "When revolving around the x-axis using disks/washers, do you integrate with respect to x or y?"
    answer:
      expected: x
      aliases:
        - dx
  - id: r002
    type: typed
    prompt: "When revolving around the y-axis using disks/washers, do you integrate with respect to x or y?"
    answer:
      expected: y
      aliases:
        - dy
  - id: r003
    type: flashcard
    prompt: "What is the formula for the area of a cross-sectional washer?"
    answer:
      expected: "pi * (R^2 - r^2), where R is outer radius and r is inner radius."
  - id: r004
    type: flashcard
    prompt: "If revolving around the line $y = -3$, and the curve is $y = x^2$, what is the radius?"
    answer:
      expected: "$x^2 - (-3) = x^2 + 3$"
  - id: r005
    type: typed
    prompt: "What mathematical shape is created by a cross-section of the Disk method?"
    answer:
      expected: circle
      aliases:
        - disk


