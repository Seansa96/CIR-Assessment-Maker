- id: ex-terminal-velocity
  title: Gravity and Drag
  problem: |
    Let's find the terminal velocity of an object falling from rest under gravity with linear drag.
  steps:
  - id: step-1
    title: Step 1 — Set up the Force Equation
    instruction: |
      We define **downward as the positive direction** to simplify signs, so velocity $v > 0$ as it falls. Gravity pulls down (+), drag pulls up (-).
    type: multipleChoice
    prompt: Which equation correctly represents Newton's Second Law for this falling object?
    choices:
    - id: a
      text: $m \frac{dv}{dt} = mg + bv$
    - id: b
      text: $m \frac{dv}{dt} = mg - bv$
    - id: c
      text: $m \frac{dv}{dt} = -mg - bv$
    answer:
      choiceId: b
    explanation: 'Solution: $m\,dv/dt=mg-bv$.\n\nWhy it works: Downward is positive and drag opposes downward motion.\n\nWhy the other choices fail: They assign an incorrect force sign.'
  - id: step-2
    title: Step 2 — The Terminal Condition
    instruction: |
      As the object speeds up, the upward drag force $bv$ grows. Eventually, the drag force perfectly cancels gravity ($bv = mg$), resulting in zero net force.
    type: multipleChoice
    prompt: When the net force is zero, what is the acceleration of the object?
    choices:
    - id: a
      text: $g$
    - id: b
      text: $0$
    - id: c
      text: $-g$
    answer:
      choiceId: b
    explanation: 'Solution: $a=0$.\n\nWhy it works: Zero net force gives zero acceleration.\n\nWhy the other choices fail: Terminal velocity is nonzero but constant.'
  - id: step-3
    title: Step 3 — Solve for Terminal Velocity
    instruction: |
      At this point of zero acceleration, the velocity is constant. We call this the terminal velocity $v_t$.
    type: symbolicResponse
    prompt: Set the acceleration in your Newton's law equation to 0, and solve for $v_t$. What does $v_t$ equal?
    answer:
      gradingMode: auto
      expectedLatex: mg/b
      equivalenceMode: expression
      tolerance: 0
    explanation: 'Solution: $v_t=mg/b$.\n\nWhy it works: Terminal speed satisfies $mg-bv_t=0$.'

- id: terminal-velocity-we002
  title: Evaluate Terminal Speed
  problem: 'A falling object has mass 3.0 kg and linear drag coefficient $b=6.0\ \mathrm{kg/s}$. Find its terminal speed.'
  steps:
  - id: tvwe4
    title: Apply terminal-speed formula
    instruction: Use $v_t=mg/b$.
    type: numericResponse
    prompt: 'What terminal speed is reached in m/s?'
    answer: { value: 4.9, tolerance: 0.01 }
    explanation: 'Solution: $v_t=(3.0)(9.8)/6.0=4.90$ m/s.\n\nWhy it works: At terminal speed, drag balances weight.'
  - id: tvwe5
    title: Check net force
    instruction: Determine the net force at terminal speed.
    type: numericResponse
    prompt: 'What is the net force in newtons?'
    answer: { value: 0, tolerance: 0.01 }
    explanation: 'Solution: The net force is $0$ N.\n\nWhy it works: Terminal speed has zero acceleration.'
