workedExamples:
- id: ex-terminal-velocity
  title: Gravity and Drag
  problem: |
    Let's find the terminal velocity of an object falling from rest under gravity with linear drag.
  steps:
  - id: step-1
    title: Step 1 — Set up the Force Equation
    instruction: |
      We define **downward as the positive direction** to simplify signs, so velocity $v > 0$ as it falls. Gravity pulls down (+), drag pulls up (-).
    type: multipleChoice
    prompt: Which equation correctly represents Newton's Second Law for this falling object?
    choices:
    - id: a
      text: $m \frac{dv}{dt} = mg + bv$
    - id: b
      text: $m \frac{dv}{dt} = mg - bv$
    - id: c
      text: $m \frac{dv}{dt} = -mg - bv$
    answer:
      choiceId: b
    explanation: Gravity is in the positive direction ($mg$), and drag opposes motion, so it is in the negative direction ($-bv$).
  - id: step-2
    title: Step 2 — The Terminal Condition
    instruction: |
      As the object speeds up, the upward drag force $bv$ grows. Eventually, the drag force perfectly cancels gravity ($bv = mg$), resulting in zero net force.
    type: multipleChoice
    prompt: When the net force is zero, what is the acceleration of the object?
    choices:
    - id: a
      text: $g$
    - id: b
      text: $0$
    - id: c
      text: $-g$
    answer:
      choiceId: b
    explanation: By Newton's second law, if $F_{\text{net}} = 0$, then $a = 0$. The object stops accelerating.
  - id: step-3
    title: Step 3 — Solve for Terminal Velocity
    instruction: |
      At this point of zero acceleration, the velocity is constant. We call this the terminal velocity $v_t$.
    type: symbolicResponse
    prompt: Set the acceleration in your Newton's law equation to 0, and solve for $v_t$. What does $v_t$ equal?
    answer:
      gradingMode: auto
      expectedLatex: mg/b
      equivalenceMode: expression
      tolerance: 0
    explanation: $0 = mg - bv_t \implies bv_t = mg \implies v_t = mg/b$.
