directedProject:
  summary: >-
    Write three small C++ programs that explore different ways to print text to
    the console. You will practice using cout, endl, \n, and escape sequences
    like \" and \\.
  estimatedTimeMinutes: 10
  resources: []
  phases:
    - id: phase-1-greeting
      title: "Print a Greeting"
      steps:
        - id: step-1-create
          title: "Create a New Console Project"
          instruction: |
            1. Open Visual Studio and create a new **Console App** (C++) project.
            2. Name it `HelloVariations`.
            3. Delete any generated code in the `.cpp` file so you start with a blank file.
          checklist:
            - id: chk-project
              text: "Created a new C++ console project named HelloVariations"
          resources: []

        - id: step-2-greeting
          title: "Print Your Name on Separate Lines"
          instruction: |
            Write a program that prints a greeting on two separate lines using `\n`.

            ```cpp
            #include <iostream>
            using namespace std;

            int main() {
                cout << "Hello, my name is [Your Name]!\n";
                cout << "Welcome to C++!\n";
                return 0;
            }
            ```

            Replace `[Your Name]` with your actual name. Build and run with **Ctrl+F5**.
          notesPrompt: "What output did you see in the console?"
          checklist:
            - id: chk-greeting
              text: "Program prints two lines with your name"
            - id: chk-builds
              text: "Program compiles and runs without errors"
          resources: []

    - id: phase-2-box
      title: "Print a Box Pattern"
      steps:
        - id: step-3-box
          title: "Draw a Box with Stars"
          instruction: |
            Replace your `main()` code so the program prints this exact pattern:

            ```
            **********
            *        *
            *  C++!  *
            *        *
            **********
            ```

            Use one `cout` statement per line, each ending with `\n` or using `endl`.

            **Hint:** You can chain `endl` like this: `cout << "**********" << endl;`
          notesPrompt: "Did you use \\n or endl? Which do you prefer?"
          checklist:
            - id: chk-box
              text: "Console displays the star box pattern correctly"
          resources: []

    - id: phase-3-escapes
      title: "Escape Sequences"
      steps:
        - id: step-4-escapes
          title: "Print Special Characters"
          instruction: |
            Write a new program (or modify the existing one) that prints the following
            lines exactly. You will need escape sequences to print quotes and backslashes:

            ```
            She said, "Hello!"
            File path: C:\Users\Documents
            Price: $9.99	Qty: 3	Total: $29.97
            ```

            Escape sequence reference:
            - `\"` prints a literal double-quote
            - `\\` prints a literal backslash
            - `\t` prints a tab character
            - `\n` prints a newline
          checklist:
            - id: chk-quotes
              text: "Output includes a line with literal double-quotes"
            - id: chk-backslash
              text: "Output includes a line with literal backslashes"
            - id: chk-tab
              text: "Output includes a line using tab characters for alignment"
          resources: []

        - id: step-5-reflect
          title: "Review What You Learned"
          instruction: |
            You've now used five different escape sequences: `\n`, `\"`, `\\`, `\t`, and `endl`.

            Take a moment to answer these reflection questions in the notes box:
            1. What is the difference between `\n` and `endl`?
            2. Why do you need `\\` to print a single backslash?
            3. When would `\t` be more useful than spaces?
          notesPrompt: "Write your answers to the three reflection questions."
          checklist:
            - id: chk-reflect
              text: "Answered the reflection questions"
          resources: []
