authoring: { visualRequirement: required, visualRationale: Learners must recognize a differential curve segment and an axis-based surface radius., difficultyTier: easy }
questions:
  - { id: q001, type: multipleChoice, prompt: 'For y=f(x), which formula gives differential arc length?', media: [{ type: image, src: /media/calculus/geometric-slice-model.svg, alt: A differential slope triangle with hypotenuse ds }], choices: [{ id: a, text: '$\sqrt{1+[f''(x)]^2}\,dx$' }, { id: b, text: '$f(x)dx$' }, { id: c, text: '$\pi f(x)^2dx$' }, { id: d, text: '$f''(x)dx$' }], answer: { choiceId: a }, explanation: 'Solution: $ds=\sqrt{1+[f''(x)]^2}dx$. Why it works: The Pythagorean theorem combines dx and $dy=f''(x)dx$. Common trap: $f''(x)dx$ is vertical change, not slanted distance. Why the other choices fail: b omits slope geometry; c is disk area; d omits the horizontal component.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: Recognizes the differential triangle and chooses its derived length formula. }
  - { id: q002, type: multipleChoice, prompt: 'If f(x)=3x+1, what is the arc-length integrand without dx?', choices: [{ id: a, text: '$\sqrt{10}$' }, { id: b, text: '$3x+1$' }, { id: c, text: 3 }, { id: d, text: '$\sqrt{1+3x+1}$' }], answer: { choiceId: a }, explanation: 'Solution: f prime is 3, so $\sqrt{1+3^2}=\sqrt{10}$. Why it works: Arc length uses the square of the derivative. Common trap: Do not use the original line value. Why the other choices fail: b is f; c is only its slope; d does not square the slope.', difficultyDimensions: [auxiliaryTechnique, simplification], difficultyEvidence: Differentiates a linear function and substitutes its slope into the standard formula. }
  - { id: q003, type: multipleChoice, prompt: 'For a curve written x=g(y), what is the matching arc-length differential?', choices: [{ id: a, text: '$\sqrt{1+[g''(y)]^2}\,dy$' }, { id: b, text: '$\sqrt{1+[g''(y)]^2}\,dx$' }, { id: c, text: '$g(y)dy$' }, { id: d, text: '$\pi g(y)^2dy$' }], answer: { choiceId: a }, explanation: 'Solution: Use $\sqrt{1+[g''(y)]^2}dy$. Why it works: The small horizontal change is $dx=g''(y)dy$. Common trap: Switch derivative, differential, and bounds together. Why the other choices fail: b mixes variables; c omits the Pythagorean factor; d is disk area.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Transfers the arc-length construction to a y-parameterized curve. }
  - { id: q004, type: multipleChoice, prompt: 'A curve y=x+2 is revolved about the x-axis. What is its surface radius?', choices: [{ id: a, text: '$x+2$' }, { id: b, text: '$\sqrt2$' }, { id: c, text: x }, { id: d, text: '$\pi(x+2)^2$' }], answer: { choiceId: a }, explanation: 'Solution: The radius is y-distance to y=0, so $r=x+2$. Why it works: The curve lies above the x-axis. Common trap: $\sqrt2$ is the arc-length factor for this line, not radius. Why the other choices fail: c is x-location; d is disk area.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Distinguishes axis distance from slope and cross-sectional area. }
  - { id: q005, type: multipleChoice, prompt: 'What is the surface-area differential for radius r and arc-length element ds?', choices: [{ id: a, text: '$2\pi r\,ds$' }, { id: b, text: '$\pi r^2ds$' }, { id: c, text: '$r\,ds$' }, { id: d, text: '$2\pi r^2$' }], answer: { choiceId: a }, explanation: 'Solution: $dS=2\pi r\,ds$. Why it works: A narrow surface band is circumference times slanted width. Common trap: $\pi r^2$ is an area of a disk, not circumference. Why the other choices fail: b and d use disk-style radius square; c omits the circular path.', difficultyDimensions: [representationTransfer, modelOrDerivation], difficultyEvidence: Selects the surface-band model from competing geometry formulas. }
  - { id: q006, type: multipleChoice, prompt: 'For rotation about y=4, what is the radius from y=f(x)?', choices: [{ id: a, text: '$|f(x)-4|$' }, { id: b, text: f(x) }, { id: c, text: '$f(x)+4$' }, { id: d, text: '$4f(x)$' }], answer: { choiceId: a }, explanation: 'Solution: Radius is $|f(x)-4|$. Why it works: It is a nonnegative vertical distance to y=4. Common trap: f(x) alone assumes the axis is y=0. Why the other choices fail: b ignores the shift; c and d are not distances.', difficultyDimensions: [representationTransfer, domainCondition], difficultyEvidence: Creates an axis-distance expression for an offset horizontal axis. }
  - { id: q007, type: multipleChoice, prompt: 'If all coordinate lengths are in centimeters, an arc-length result has what units?', choices: [{ id: a, text: centimeters }, { id: b, text: square centimeters }, { id: c, text: cubic centimeters }, { id: d, text: centimeters per second }], answer: { choiceId: a }, explanation: 'Solution: Arc length is measured in centimeters. Why it works: ds is a length. Common trap: The square root does not create square units. Why the other choices fail: b is area; c is volume; d is a rate.', difficultyDimensions: [representationTransfer, errorDiagnosis], difficultyEvidence: Uses units to distinguish a length accumulation from area or volume. }
  - { id: q008, type: multipleChoice, prompt: 'If all coordinate lengths are in centimeters, a surface-area result has what units?', choices: [{ id: a, text: square centimeters }, { id: b, text: centimeters }, { id: c, text: cubic centimeters }, { id: d, text: unitless }], answer: { choiceId: a }, explanation: 'Solution: Surface area is in square centimeters. Why it works: Circumference and ds are both lengths. Common trap: Surface area is not volume. Why the other choices fail: b loses one factor; c adds a nonexistent thickness; d has no geometric unit.', difficultyDimensions: [representationTransfer, errorDiagnosis], difficultyEvidence: Checks the dimensional consequence of circumference times slanted length. }
  - { id: q009, type: multipleChoice, prompt: 'Which integral is the arc length of y=x on [0,2]?', choices: [{ id: a, text: '$\int_0^2\sqrt2\,dx$' }, { id: b, text: '$\int_0^2x\,dx$' }, { id: c, text: '$\int_0^2\pi x^2\,dx$' }, { id: d, text: '$\int_0^2(1+x)dx$' }], answer: { choiceId: a }, explanation: 'Solution: f prime is 1, so the integrand is $\sqrt{1+1}=\sqrt2$. Why it works: Apply the arc-length formula. Common trap: x is the function value, not the slope. Why the other choices fail: b uses area under the line; c is disk volume; d does not square slope.', difficultyDimensions: [auxiliaryTechnique, representationTransfer], difficultyEvidence: Differentiates the line and builds its definite arc-length model. }
  - { id: q010, type: multipleChoice, prompt: 'What should be labeled before setting up surface area of revolution?', choices: [{ id: a, text: axis of rotation and radius distance }, { id: b, text: only the antiderivative }, { id: c, text: only the final units }, { id: d, text: neither axis nor radius }], answer: { choiceId: a }, explanation: 'Solution: Label the axis and the radius measured to it. Why it works: They determine the circumference factor. Common trap: Starting with a formula can hide an incorrect axis distance. Why the other choices fail: b and c come after the model; d omits its essential geometry.', difficultyDimensions: [modelOrDerivation, representationTransfer], difficultyEvidence: Identifies the essential model-building labels that constrain the surface integral. }
