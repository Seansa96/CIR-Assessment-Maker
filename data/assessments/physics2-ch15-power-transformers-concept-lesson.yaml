id: physics2-ch15-power-transformers-concept-lesson
title: Power in AC & Transformers
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-ac-circuits
lesson:
  introduction: This lesson develops the main ideas behind Power in AC & Transformers and connects them
    to the governing physical relationships.
  sections:
  - id: l3-sec1
    title: Average Power
    required: true
    content: 'The average power delivered in an AC circuit depends on the RMS values and the power factor:
      $P_{avg} = I_{rms} V_{rms} \cos\phi$, where $\cos\phi = R/Z$. Inductors and capacitors consume zero
      average power.'
  - id: l3-sec2
    title: Transformers
    required: true
    content: 'A transformer steps up or steps down AC voltages based on the turns ratio: $\frac{V_S}{V_P}
      = \frac{N_S}{N_P}$. Assuming ideal efficiency, power is conserved: $I_P V_P = I_S V_S$.'
