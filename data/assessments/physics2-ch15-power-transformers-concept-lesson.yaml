        Solution: During name the model and quantities for Power in AC & Transformers, first identify primary and secondary labels, use turns ratio, then apply ideal-power reasoning to current. Then apply V_s/V_p = N_s/N_p with one consistent coordinate system and solve for the requested quantity.


        Why it works: V_s/V_p = N_s/N_p connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
