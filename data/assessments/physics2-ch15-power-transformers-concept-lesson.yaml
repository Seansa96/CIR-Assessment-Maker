lesson:
  introduction: >
    This lesson develops a repeatable way to solve Power in AC & Transformers problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch15-power-transformers-s1
    title: Name the model and quantities
    required: true
    content: >
      Power in AC & Transformers uses V_s/V_p = N_s/N_p. In the name the model and quantities stage, identify primary and secondary labels, use turns ratio, then apply ideal-power reasoning to current.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Power in AC & Transformers problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch15-power-transformers-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Power in AC & Transformers, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use V_s/V_p = N_s/N_p after you identify primary and secondary labels, use turns ratio, then apply ideal-power reasoning to current.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Power in AC & Transformers problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-power-transformers-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables V_s/V_p = N_s/N_p relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-power-transformers-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Power in AC & Transformers.
        media: []
        issueSignals:
        - id: physics2-physics2-ch15-power-transformers-units-error
          domains:
          - physics-2
