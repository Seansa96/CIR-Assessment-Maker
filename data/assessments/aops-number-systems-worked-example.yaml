workedExamples:
- id: aops-number-systems-problem-1
  title: Classify boundary cases by the smallest set
  problem: |-
    Under the convention $\mathbb N=\{1,2,3,\ldots\}$, classify each number in the smallest of $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ that contains it:
    $$-3,\quad 0,\quad \frac72,\quad \sqrt{49},\quad \sqrt5,\quad 2+3i.$$
  steps:
  - id: aops-number-systems-p1-s1
    title: State the nesting and convention
    instruction: Use $\mathbb N\subset\mathbb Z\subset\mathbb Q\subset\mathbb R\subset\mathbb C$ and note that zero is excluded from $\mathbb N$ here.
    type: multipleChoice
    prompt: With this convention, what is the smallest set containing $0$?
    choices:
    - {id: a, text: '$\mathbb N$'}
    - {id: b, text: '$\mathbb Z$'}
    - {id: c, text: '$\mathbb R\setminus\mathbb Q$'}
    - {id: d, text: '$\mathbb C\setminus\mathbb R$'}
    answer: {choiceId: b}
    explanation: Zero is an integer and is excluded from the stated natural-number convention.
  - id: aops-number-systems-p1-s2
    title: Classify the integer cases
    instruction: $-3$ and $0$ are integers but not positive natural numbers. Also simplify $\sqrt{49}=7$, which is natural.
    type: multipleChoice
    prompt: Which pair receives smallest set $\mathbb Z$?
    choices:
    - {id: a, text: '$-3$ and $0$'}
    - {id: b, text: '$0$ and $7/2$'}
    - {id: c, text: '$\sqrt{49}$ and $\sqrt5$'}
    - {id: d, text: '$-3$ and $\sqrt{49}$'}
    answer: {choiceId: a}
    explanation: Neither is positive, but both are integers.
  - id: aops-number-systems-p1-s3
    title: Separate rational nonintegers from irrational reals
    instruction: $7/2$ is rational but not an integer. The number $\sqrt5$ is irrational because $5$ is not a perfect square.
    type: multipleChoice
    prompt: What is the smallest set containing $\sqrt5$?
    choices:
    - {id: a, text: '$\mathbb Z$'}
    - {id: b, text: '$\mathbb Q$'}
    - {id: c, text: '$\mathbb R$'}
    - {id: d, text: '$\mathbb N$'}
    answer: {choiceId: c}
    explanation: It is a real irrational number, so $\mathbb R$ is the first named set containing it.
  - id: aops-number-systems-p1-s4
    title: Identify the nonreal complex case
    instruction: $2+3i$ has nonzero imaginary part, so it is complex but not real.
    type: multipleChoice
    prompt: Which property keeps $2+3i$ out of $\mathbb R$?
    choices:
    - {id: a, text: Its real part is positive.}
    - {id: b, text: Its imaginary coefficient is nonzero.}
    - {id: c, text: It contains an integer.}
    - {id: d, text: Its magnitude exceeds one.}
    answer: {choiceId: b}
    explanation: Real numbers are precisely the complex numbers whose imaginary coefficient is zero.
  - id: aops-number-systems-p1-s5
    title: Record the complete classification
    instruction: |-
      The smallest sets are
      $$-3\in\mathbb Z,\ 0\in\mathbb Z,\ 7/2\in\mathbb Q,\ \sqrt{49}=7\in\mathbb N,\ \sqrt5\in\mathbb R,\ 2+3i\in\mathbb C.$$
    type: multipleChoice
    prompt: Why is $\sqrt{49}$ classified only after simplifying it?
    choices:
    - {id: a, text: Radical notation alone does not imply irrationality.}
    - {id: b, text: Every radical is complex but nonreal.}
    - {id: c, text: Square roots cannot be integers.}
    - {id: d, text: Classification depends on typography.}
    answer: {choiceId: a}
    explanation: The exact value, not its written form, determines the number set.
- id: aops-number-systems-problem-2
  title: Convert a repeating decimal exactly
  problem: Convert $0.\overline{27}=0.272727\ldots$ to a fraction in lowest terms.
  steps:
  - id: aops-number-systems-p2-s1
    title: Name the repeating block
    instruction: Let $x=0.\overline{27}$. The repeating block has two digits.
    type: multipleChoice
    prompt: By what power of ten should $x$ be multiplied to shift one complete block?
    choices:
    - {id: a, text: '$10$'}
    - {id: b, text: '$100$'}
    - {id: c, text: '$1000$'}
    - {id: d, text: '$27$'}
    answer: {choiceId: b}
    explanation: Two decimal places require multiplication by $10^2$.
  - id: aops-number-systems-p2-s2
    title: Align the repeating tails
    instruction: Multiplying gives $100x=27.\overline{27}$, whose fractional tail matches that of $x$.
    type: multipleChoice
    prompt: Which two equations should be subtracted?
    choices:
    - {id: a, text: '$100x=27.\overline{27}$ and $x=0.\overline{27}$'}
    - {id: b, text: '$10x=2.\overline7$ and $x=0.\overline{27}$'}
    - {id: c, text: '$27x=0.\overline{27}$ and $x=27$'}
    - {id: d, text: '$x^2=0.\overline{27}$ and $x=0$'}
    answer: {choiceId: a}
    explanation: Matching tails cancel under subtraction.
  - id: aops-number-systems-p2-s3
    title: Eliminate the infinite tail
    instruction: Subtracting yields $100x-x=27$, so $99x=27$.
    type: multipleChoice
    prompt: Why does the repeating part disappear?
    choices:
    - {id: a, text: Identical infinite tails are subtracted.}
    - {id: b, text: Repeating decimals are rounded to zero.}
    - {id: c, text: Multiplication makes the number terminate.}
    - {id: d, text: The block 27 is prime.}
    answer: {choiceId: a}
    explanation: The subtraction is exact; no truncation occurs.
  - id: aops-number-systems-p2-s4
    title: Solve and reduce
    instruction: $x=27/99=3/11$ after dividing numerator and denominator by $9$.
    type: multipleChoice
    prompt: What is the fraction in lowest terms?
    choices:
    - {id: a, text: '$27/100$'}
    - {id: b, text: '$27/90$'}
    - {id: c, text: '$3/11$'}
    - {id: d, text: '$11/3$'}
    answer: {choiceId: c}
    explanation: $\gcd(27,99)=9$.
  - id: aops-number-systems-p2-s5
    title: Verify by division
    instruction: Dividing $3$ by $11$ produces remainders that repeat the digits $27$, confirming $3/11=0.\overline{27}$.
    type: multipleChoice
    prompt: What property of $3/11$ establishes rationality most directly?
    choices:
    - {id: a, text: It is a quotient of integers with denominator $11\ne0$.}
    - {id: b, text: It lies between zero and one.}
    - {id: c, text: It has infinitely many digits.}
    - {id: d, text: Its numerator is prime.}
    answer: {choiceId: a}
    explanation: The quotient definition is exact and decisive.
- id: aops-number-systems-problem-3
  title: Prove a square root irrational
  problem: Prove that $\sqrt6$ is irrational.
  steps:
  - id: aops-number-systems-p3-s1
    title: Assume a lowest-terms fraction
    instruction: Suppose for contradiction that $\sqrt6=p/q$, where $p,q$ are coprime integers and $q\ne0$.
    type: multipleChoice
    prompt: Why is the coprime condition essential?
    choices:
    - {id: a, text: It makes a later common prime factor contradictory.}
    - {id: b, text: It guarantees $p=q$.}
    - {id: c, text: It makes both integers odd.}
    - {id: d, text: It permits division by zero.}
    answer: {choiceId: a}
    explanation: Rational representations can always be reduced before beginning the proof.
  - id: aops-number-systems-p3-s2
    title: Square the exact equation
    instruction: Squaring and clearing the nonzero denominator gives $p^2=6q^2$.
    type: multipleChoice
    prompt: Which primes must divide $p^2$?
    choices:
    - {id: a, text: '$2$ only'}
    - {id: b, text: '$3$ only'}
    - {id: c, text: '$2$ and $3$'}
    - {id: d, text: Every prime}
    answer: {choiceId: c}
    explanation: The right side is divisible by both prime factors of $6$.
  - id: aops-number-systems-p3-s3
    title: Transfer prime divisibility to the base
    instruction: Since a prime dividing a square divides its base, both $2$ and $3$ divide $p$. Thus $6\mid p$, so write $p=6k$.
    type: multipleChoice
    prompt: What substitution follows?
    choices:
    - {id: a, text: '$p=2k$ only'}
    - {id: b, text: '$p=3k$ only'}
    - {id: c, text: '$p=6k$'}
    - {id: d, text: '$p=k/6$'}
    answer: {choiceId: c}
    explanation: Divisibility by the distinct primes 2 and 3 implies divisibility by 6.
  - id: aops-number-systems-p3-s4
    title: Force the same divisibility in the denominator
    instruction: Substituting gives $36k^2=6q^2$, so $q^2=6k^2$. The same prime argument shows $6\mid q$.
    type: multipleChoice
    prompt: Which contradiction has now been reached?
    choices:
    - {id: a, text: '$p$ and $q$ share factors $2$ and $3$ despite being coprime.'}
    - {id: b, text: '$q$ is nonzero.'}
    - {id: c, text: '$p^2$ is positive.'}
    - {id: d, text: '$6$ has two prime factors.'}
    answer: {choiceId: a}
    explanation: A lowest-terms numerator and denominator cannot both be divisible by 6.
  - id: aops-number-systems-p3-s5
    title: Close the contradiction proof
    instruction: Therefore the assumption that $\sqrt6$ is rational is false, so $\sqrt6$ is irrational.
    type: multipleChoice
    prompt: What made the conclusion rigorous rather than a decimal observation?
    choices:
    - {id: a, text: The quotient definition led to an impossible common factor.}
    - {id: b, text: A calculator displayed many digits.}
    - {id: c, text: Six is even.}
    - {id: d, text: The square root symbol usually denotes an irrational number.}
    answer: {choiceId: a}
    explanation: The argument excludes every possible rational representation.
