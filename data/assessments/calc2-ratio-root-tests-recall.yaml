schemaVersion: 1
id: calc2-ratio-root-tests-recall
title: Ratio and Root Tests Recall Drill
assessmentType: recallDrill
categoryId: calculus-2
topicId: ratio-root-tests
modeDefault: practice
randomizeQuestions: true
skills: [ratio-test, root-test, convergence-test-selection]
navigation:
  learningGoal: recall
  activityType: recognitionDrill
  tags: [calculus-2, ratio-root-tests, recall, convergence-tests]
items:
- id: rr-ratio-form
  type: typed
  prompt: 'State the limit used by the Ratio Test, including absolute values.'
  answer:
    expected: 'L = lim |a_(n+1)/a_n|'
    aliases: ['limit of the absolute value of a n plus 1 over a n', 'lim |a_{n+1}/a_n|']
  explanation: The Ratio Test compares successive absolute term magnitudes.
  tags: [ratio-test, formula]
- id: rr-root-form
  type: typed
  prompt: 'State the limit used by the Root Test, including absolute values.'
  answer:
    expected: 'L = lim nth root of |a_n|'
    aliases: ['lim sqrt[n]{|a_n|}', 'limit of the nth root of absolute a n']
  explanation: The Root Test takes the nth root of each absolute term.
  tags: [root-test, formula]
- id: rr-convergence-threshold
  type: cloze
  prompt: 'For either test, if $L<1$, the series converges ____.'
  answer:
    expected: absolutely
    aliases: [absolute, 'with absolute convergence']
  explanation: Both tests are applied to absolute values, so $L<1$ proves absolute convergence.
  tags: [ratio-test, root-test, conclusions]
- id: rr-divergence-threshold
  type: cloze
  prompt: 'For either test, if $L>1$ (or $L=\infty$), the series ____.'
  answer:
    expected: diverges
    aliases: [is divergent]
  explanation: A geometric-decay comparison cannot succeed when the limiting growth factor exceeds one.
  tags: [ratio-test, root-test, conclusions]
- id: rr-boundary-case
  type: flashcard
  prompt: What conclusion does either test give when $L=1$?
  answer:
    expected: The test is inconclusive; use another appropriate test.
    aliases: [inconclusive, no conclusion, choose another test]
  explanation: $L=1$ occurs for both convergent and divergent series, so neither test decides the case.
  tags: [ratio-test, root-test, inconclusive]
- id: rr-factorial-cue
  type: recognition
  prompt: |
    Which test is usually the best first choice for

    $$
    \sum_{n=1}^{\infty}\frac{7^n}{n!}?
    $$
  choices: [{ id: a, text: Ratio Test }, { id: b, text: Root Test }, { id: c, text: p-series test }, { id: d, text: Telescoping }]
  answer: { choiceId: a, expected: Ratio Test }
  explanation: Factorials simplify immediately in the successive-term ratio.
  tags: [ratio-test, selection]
- id: rr-nth-power-cue
  type: recognition
  prompt: |
    Which test is usually the best first choice for

    $$
    \sum_{n=1}^{\infty}\left(\frac{4n-1}{7n+3}\right)^n?
    $$
  choices: [{ id: a, text: Root Test }, { id: b, text: Ratio Test }, { id: c, text: Integral Test }, { id: d, text: Alternating Series Test }]
  answer: { choiceId: a, expected: Root Test }
  explanation: The nth root removes the outer nth power and leaves a simple rational limit.
  tags: [root-test, selection]
- id: rr-do-not-force
  type: recognition
  prompt: Which series is least suitable for forcing either the Ratio or Root Test as a first method?
  choices: [{ id: a, text: '$\sum_{n=1}^{\infty}\frac1{n^3}$' }, { id: b, text: '$\sum_{n=1}^{\infty}\frac{4^n}{n!}$' }, { id: c, text: '$\sum_{n=1}^{\infty}(\frac{2n+1}{5n})^n$' }, { id: d, text: '$\sum_{n=1}^{\infty}\frac{n!}{6^n}$' }]
  answer: { choiceId: a, expected: '$\sum_{n=1}^{\infty}\frac1{n^3}$' }
  explanation: A p-series is classified directly. Both Ratio and Root Tests return the unhelpful boundary value 1 for this kind of algebraic term.
  tags: [test-selection, inconclusive]
