schemaVersion: 1
id: linear-algebra-span-basis-easy-test
title: Span, Independence, and Basis Test
assessmentType: test
categoryId: linear-algebra
subcategoryIds:
  - linear-algebra-linear-combinations-span
  - linear-algebra-linear-independence-basis
modeDefault: evaluate
randomizeQuestions: true
attemptQuestionCount: 5
skills:
  - span
  - linear-independence
  - basis
  - dimension
questions:
  - id: test-easy-span-plane
    type: multipleChoice
    prompt: |
      If two vectors in $\mathbb{R}^3$ are linearly independent, what is their span geometrically?
    choices:
      - id: c1
        text: 'A point'
      - id: c2
        text: 'A line passing through the origin'
      - id: c3
        text: 'A plane passing through the origin'
      - id: c4
        text: 'All of $\mathbb{R}^3$'
    answer:
      choiceId: c3

  - id: test-easy-independence-multiple
    type: multipleChoice
    prompt: |
      Let $S = \{\vec{u}, \vec{v}, \vec{w}\}$. If $\vec{u} = 2\vec{v} - \vec{w}$, what can you conclude about $S$?
    choices:
      - id: c1
        text: 'It is a basis for $\mathbb{R}^3$.'
      - id: c2
        text: 'It is linearly dependent.'
      - id: c3
        text: 'It is linearly independent.'
      - id: c4
        text: 'It spans $\mathbb{R}^3$.'
    answer:
      choiceId: c2

  - id: test-easy-basis-dimension
    type: multipleChoice
    prompt: |
      If a vector space $V$ has a basis consisting of 4 vectors, what is the dimension of $V$?
    choices:
      - id: c1
        text: '1'
      - id: c2
        text: '2'
      - id: c3
        text: '4'
      - id: c4
        text: 'It cannot be determined without knowing the vectors.'
    answer:
      choiceId: c3

  - id: test-easy-nullity
    type: multipleChoice
    prompt: |
      Let $A$ be a $4 \times 7$ matrix. If the dimension of the null space of $A$ is 4, what is the rank of $A$?
    choices:
      - id: c1
        text: '0'
      - id: c2
        text: '3'
      - id: c3
        text: '4'
      - id: c4
        text: '7'
    answer:
      choiceId: c2

  - id: test-easy-zero-vector-dep
    type: multipleChoice
    prompt: |
      Does a set of vectors containing the zero vector always form a linearly dependent set?
    choices:
      - id: c1
        text: 'Yes, because the equation $c_1\vec{v}_1 + \dots + c_p\vec{v}_p = \vec{0}$ can be satisfied by putting a non-zero weight on the zero vector.'
      - id: c2
        text: 'Yes, because the zero vector spans the entire space.'
      - id: c3
        text: 'No, it depends on the other vectors in the set.'
      - id: c4
        text: 'No, the zero vector is always linearly independent of everything else.'
    answer:
      choiceId: c1
