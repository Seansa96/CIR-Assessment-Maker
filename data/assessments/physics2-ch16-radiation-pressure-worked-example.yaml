workedExamples:
- id: we2
  title: Solar Radiation Pressure
  prompt: Sunlight reaches the Earth with an intensity of $1360\text{ W/m}^2$. Calculate
    the radiation pressure exerted on a perfectly reflecting satellite panel.
  steps:
  - id: s1
    prompt: Use the reflecting pressure formula.
    explanation: 'Solution:

      1) For a perfectly reflecting surface, momentum transfer is doubled: $P = \frac{2I}{c}$.

      2) Substitute: $P = \frac{2(1360)}{3.0 \times 10^8}$.

      3) Calculate: $P = \frac{2720}{3.0 \times 10^8} \approx 9.07 \times 10^{-6}\text{
      Pa} = 9.07\text{ }\mu\text{Pa}$.


      Why it works:

      The photons bounce back, changing their momentum from $p$ to $-p$, creating
      a net change of $2p$, which imparts twice the force compared to absorption.'
