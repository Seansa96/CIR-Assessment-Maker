- id: q001
  type: numericResponse
  skills:
  - physics-forced-oscillations
  prompt: Use the Forced Oscillations diagram and the model $\omega_0=\sqrt{k/m}$. A calibrated scenario
    scales the reference values by 1.1. Determine the natural angular frequency. Give a numerical answer.
  answer:
    value: 3.3
    tolerance: 0.033
  explanation: Apply $\omega_0=\sqrt{k/m}$ consistently to the scaled scenario; the requested natural
    angular frequency is 3.3.
  media:
  - type: image
    src: /media/physics/owa/forced-oscillations.svg
    alt: Labeled original schematic for Forced Oscillations used for quantitative analysis.
    caption: Forced Oscillations model diagram.
