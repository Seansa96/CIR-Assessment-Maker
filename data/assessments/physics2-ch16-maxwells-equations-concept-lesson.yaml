lesson:
  introduction: >
    This lesson develops a repeatable way to solve Maxwell's Equations problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch16-maxwells-equations-s1
    title: Name the model and quantities
    required: true
    content: >
      Maxwell's Equations uses curl B = mu_0 J + mu_0 epsilon_0 dE/dt. In the name the model and quantities stage, identify whether conduction or changing electric field supplies the magnetic-field source.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Maxwell's Equations problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch16-maxwells-equations-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Maxwell's Equations, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use curl B = mu_0 J + mu_0 epsilon_0 dE/dt after you identify whether conduction or changing electric field supplies the magnetic-field source.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Maxwell's Equations problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-maxwells-equations-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables curl B = mu_0 J + mu_0 epsilon_0 dE/dt relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-maxwells-equations-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Maxwell's Equations.
        media: []
        issueSignals:
        - id: physics2-physics2-ch16-maxwells-equations-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
