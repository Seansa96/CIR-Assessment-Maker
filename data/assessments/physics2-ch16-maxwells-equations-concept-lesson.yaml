title: Maxwell's Equations
assessmentType: conceptLesson
categoryId: physics-2
topicId: physics2-electromagnetic-waves
lesson:
  introduction: This lesson develops the main ideas behind Maxwell's Equations and connects them to the
    governing physical relationships.
  sections:
  - id: l1-sec1
    title: Displacement Current
    required: true
    content: Ampere's Law originally only accounted for conduction currents. Maxwell added the displacement
      current term, $I_d = \epsilon_0 \frac{d\Phi_E}{dt}$, to explain how a changing electric field produces
      a magnetic field, completing the symmetry of electromagnetism.
  - id: l1-sec2
    title: The Four Equations
    required: true
    content: 'Maxwell''s equations are:

      1) Gauss''s Law for E: $\oint \vec{E} \cdot d\vec{A} = \frac{q}{\epsilon_0}$

      2) Gauss''s Law for B: $\oint \vec{B} \cdot d\vec{A} = 0$

      3) Faraday''s Law: $\oint \vec{E} \cdot d\vec{l} = -\frac{d\Phi_B}{dt}$

      4) Ampere-Maxwell Law: $\oint \vec{B} \cdot d\vec{l} = \mu_0 I + \mu_0 \epsilon_0 \frac{d\Phi_E}{dt}$'
