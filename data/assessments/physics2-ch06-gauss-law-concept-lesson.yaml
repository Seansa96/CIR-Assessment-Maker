lesson:
  introduction: >
    Gauss's law relates total electric flux through a closed surface to the charge enclosed by that surface. It is always true,
    but it gives a simple field calculation only when symmetry makes the field magnitude and direction tractable.
  sections:
  - id: physics2-ch06-gauss-law-s1
    title: State the law and its scope
    required: true
    content: The law is $\oint_S\mathbf E\cdot d\mathbf A=Q_{enc}/\epsilon_0$. The surface is closed and $Q_{enc}$ means algebraic charge inside it.
    check:
      id: physics2-ch06-gauss-law-s1-check
      type: multipleChoice
      prompt: Which statement correctly distinguishes Gauss's law from a field shortcut?
      choices:
      - { id: a, text: It applies only to spheres and directly gives a constant field on any surface, issueSignals: [{ id: physics2-gauss-symmetry-overreach, domains: [physics-2] }] }
      - { id: b, text: It applies to any closed surface, but symmetry is needed to solve easily for $E$'s local value }
      - { id: c, text: It applies to open surfaces if the field is uniform, issueSignals: [{ id: physics2-gauss-open-surface-error, domains: [physics-2] }] }
      - { id: d, text: It says flux depends on all charge outside the surface, issueSignals: [{ id: physics2-gauss-enclosed-charge-error, domains: [physics-2] }] }
      answer: { choiceId: b }
      explanation: >
        Solution: Gauss's law is a closed-surface flux law for any geometry; a symmetric Gaussian surface makes the integral usable for $E$.
        Why it works: The law and the computational shortcut are different claims.
        Why the other choices fail: They restrict the law, use an open surface, or count external charge in $Q_{enc}$.
    difficultyDimensions: [modelOrDerivation, constraints]
    difficultyEvidence: Tests the applicability condition rather than formula recall.
  - id: physics2-ch06-gauss-law-s2
    title: Choose a Gaussian surface
    required: true
    content: >
      Match the surface to the source symmetry: a cylinder for an infinite line, a sphere for a point or spherical source,
      and a pillbox for an infinite plane.
    check:
      id: physics2-ch06-gauss-law-s2-check
      type: multipleChoice
      prompt: What Gaussian surface best matches an infinite line charge when finding the field a distance $r$ away?
      choices:
      - { id: a, text: A coaxial cylinder of radius $r$ and length $L$ }
      - { id: b, text: A sphere centered on one point of the line, issueSignals: [{ id: physics2-gauss-symmetry-mismatch, domains: [physics-2] }] }
      - { id: c, text: A flat disk whose normal is along the line, issueSignals: [{ id: physics2-gauss-symmetry-mismatch, domains: [physics-2] }] }
      - { id: d, text: An arbitrary cube enclosing part of the line, issueSignals: [{ id: physics2-gauss-symmetry-mismatch, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >
        Solution: Use a coaxial cylinder: the radial field is constant on its curved surface and tangent to the end caps.
        Why it works: The cylinder turns the flux integral into $E(2\pi rL)$.
        Why the other choices fail: Their surfaces do not make $E$ constant with a single known direction on the contributing area.
    difficultyDimensions: [representation, symmetry]
    difficultyEvidence: Requires mapping source symmetry to surface geometry.
  - id: physics2-ch06-gauss-law-s3
    title: Count enclosed charge
    required: true
    content: Only charge inside the closed Gaussian surface contributes to $Q_{enc}$. External charges can alter local field but contribute zero net flux through the surface.
    check:
      id: physics2-ch06-gauss-law-s3-check
      type: multipleChoice
      prompt: A spherical Gaussian surface encloses $+2q$ and an external charge $-5q$ lies outside. What is $Q_{enc}$?
      choices:
      - { id: a, text: '$-3q$', issueSignals: [{ id: physics2-gauss-external-charge-error, domains: [physics-2] }] }
      - { id: b, text: '$+2q$' }
      - { id: c, text: '$+7q$', issueSignals: [{ id: physics2-gauss-external-charge-error, domains: [physics-2] }] }
      - { id: d, text: '$0$ because the outside charge cancels it', issueSignals: [{ id: physics2-gauss-enclosed-charge-error, domains: [physics-2] }] }
      answer: { choiceId: b }
      explanation: >
        Solution: $Q_{enc}$ includes only charges inside the surface, so it is $+2q$.
        Why it works: External charges produce field lines entering and leaving in equal net amount.
        Why the other choices fail: They include or cancel an external charge in the enclosed-charge total.
    difficultyDimensions: [representation, errorDiagnosis]
    difficultyEvidence: Separates local field effects from net enclosed flux.
  - id: physics2-ch06-gauss-law-s4
    title: Solve the cylindrical case
    required: true
    content: For line density $\lambda$, a coaxial cylinder gives $E(2\pi rL)=\lambda L/\epsilon_0$, hence $E=\lambda/(2\pi\epsilon_0r)$.
    check:
      id: physics2-ch06-gauss-law-s4-check
      type: multipleChoice
      prompt: An infinite line has $\lambda>0$. Which field magnitude and direction follow from the cylindrical Gaussian surface?
      choices:
      - { id: a, text: '$E=\lambda/(2\pi\epsilon_0r)$, radially outward' }
      - { id: b, text: '$E=\lambda/(4\pi\epsilon_0r^2)$, radially outward', issueSignals: [{ id: physics2-gauss-spherical-scaling-error, domains: [physics-2] }] }
      - { id: c, text: '$E=\lambda/(2\pi\epsilon_0r)$, radially inward', issueSignals: [{ id: physics2-gauss-sign-direction-error, domains: [physics-2] }] }
      - { id: d, text: '$E=\lambda/(\epsilon_0L)$, along the line', issueSignals: [{ id: physics2-gauss-flux-area-error, domains: [physics-2] }] }
      answer: { choiceId: a }
      explanation: >
        Solution: The curved area is $2\pi rL$ and $Q_{enc}=\lambda L$, so $E=\lambda/(2\pi\epsilon_0r)$; positive charge gives outward field.
        Why it works: Cylindrical area grows as $r$, producing inverse-$r$ scaling.
        Why the other choices fail: b uses spherical area, c reverses the direction, and d omits the curved area.
    difficultyDimensions: [calculation, symmetry, limitingCase]
    difficultyEvidence: Combines geometry, algebra, sign, and radial scaling.
  - id: physics2-ch06-gauss-law-s5
    title: Check the shortcut
    required: true
    content: Gauss's law is not automatically the best computational method. If the source lacks enough symmetry, the integral may not isolate a single constant $E$.
    check:
      id: physics2-ch06-gauss-law-s5-check
      type: multipleChoice
      prompt: Why is a spherical Gaussian surface generally not enough to find the field of two unequal point charges together?
      choices:
      - { id: a, text: The law fails for more than one charge, issueSignals: [{ id: physics2-gauss-law-scope-error, domains: [physics-2] }] }
      - { id: b, text: The total flux is still known, but $E$ varies over the sphere so it cannot be factored out of the integral }
      - { id: c, text: There is no closed surface around two charges, issueSignals: [{ id: physics2-gauss-surface-error, domains: [physics-2] }] }
      - { id: d, text: External charge always changes net flux, issueSignals: [{ id: physics2-gauss-external-charge-error, domains: [physics-2] }] }
      answer: { choiceId: b }
      explanation: >
        Solution: The law still gives total flux, but unequal charges destroy spherical symmetry, so $E$ is not constant on the sphere.
        Why it works: Factoring $E$ from the integral requires constant magnitude and a known angle over the contributing surface.
        Why the other choices fail: The law allows multiple charges, closed surfaces exist, and external charge has zero net flux contribution.
    difficultyDimensions: [modelOrDerivation, constraints]
    difficultyEvidence: Identifies the precise failure of a tempting but invalid shortcut.
