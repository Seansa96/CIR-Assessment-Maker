workedExamples:
- id: l2-sec1
  title: Statement of Gauss's Law
  explanation: 'Gauss''s Law states that the net electric flux through any closed
    surface (a Gaussian surface) is equal to the net charge enclosed divided by the
    permittivity of free space:

    $$\oint \vec{E} \cdot d\vec{A} = \frac{q_{enc}}{\epsilon_0}$$'
- id: l2-sec2
  title: Conductors in Electrostatic Equilibrium
  explanation: Inside a conductor in electrostatic equilibrium, the electric field
    is zero. By Gauss's Law, any net charge must reside entirely on its surface. The
    electric field just outside the surface is perpendicular to the surface and has
    magnitude $E = \frac{\sigma}{\epsilon_0}$.
