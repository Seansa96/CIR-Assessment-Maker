lesson:
  introduction: |-
    Beyond just the angles, cyclic quadrilaterals have a beautiful mathematical relationship between the lengths of their sides and their diagonals. This relationship is captured by Ptolemy's Theorem.
  sections:
  - id: sec-ptolemys
    title: Ptolemy's Theorem
    required: true
    content: |-
      Let $ABCD$ be a cyclic quadrilateral with side lengths $a, b, c,$ and $d$. Let the two diagonals be $d_1$ and $d_2$.
      
      **Ptolemy's Theorem** states that the product of the diagonals is equal to the sum of the products of the opposite sides.
      
      $$d_1 \times d_2 = (a \times c) + (b \times d)$$
      
      In words: Multiply the lengths of the two diagonals. That number will be exactly equal to multiplying the left/right sides together, multiplying the top/bottom sides together, and adding those two results!

  - id: sec-converse
    title: The Converse of Ptolemy's Theorem
    required: true
    content: |-
      Just like the Pythagorean Theorem has a converse to prove if a triangle is a right triangle, Ptolemy's Theorem has a converse to prove if a quadrilateral is cyclic!
      
      If you have *any* quadrilateral, and you measure its sides and diagonals, and you find that $d_1 d_2 = ac + bd$, then you have mathematically proven that a circle can be perfectly drawn through all four corners.
      
      This is a powerful tool for proving shapes are cyclic without knowing any of the angles!

questions:
- id: q-geom-cyc2-1
  title: Concept Check - The Formula
  prompt: |-
    A cyclic quadrilateral has sides $a=2$, $b=3$, $c=4$, and $d=5$, where $a, c$ are opposite sides and $b, d$ are opposite sides. If one diagonal is length $x$ and the other is length $y$, what is the value of $x \times y$?
  type: numericResponse
  answer:
    numericValue: 23
    tolerance: 0
  explanation: |-
    According to Ptolemy's Theorem, the product of the diagonals ($xy$) is equal to the sum of the products of opposite sides ($ac + bd$).
    $$xy = (2 \times 4) + (3 \times 5)$$
    $$xy = 8 + 15 = 23$$
  skills:
  - geometry-cyclic-quadrilaterals

- id: q-geom-cyc2-2
  title: Concept Check - Application to Rectangles
  prompt: |-
    We know every rectangle is a cyclic quadrilateral. If a rectangle has a length of $L$ and a width of $W$, its diagonals $D$ are equal in length. What formula do you get if you apply Ptolemy's Theorem to a rectangle?
  type: multipleChoice
  choices:
  - id: c1
    text: $D^2 = 2LW$
  - id: c2
    text: $D^2 = L^2 + W^2$
  - id: c3
    text: $D = L + W$
  answer:
    choiceId: c2
  explanation: |-
    The diagonals are equal, so $d_1 \times d_2$ becomes $D \times D = D^2$.
    The opposite sides are equal, so $a \times c$ is $L \times L = L^2$, and $b \times d$ is $W \times W = W^2$.
    Ptolemy's Theorem becomes $D^2 = L^2 + W^2$. This is exactly the **Pythagorean Theorem**!
  skills:
  - geometry-cyclic-quadrilaterals
