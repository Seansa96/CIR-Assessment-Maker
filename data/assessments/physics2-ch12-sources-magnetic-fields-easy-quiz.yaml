  prompt: If you double the current in a long straight wire, what happens to the magnetic field at a fixed
    distance from the wire?
  explanation: 'Solution:

    For a long straight wire, $B = \frac{\mu_0 I}{2\pi r}$. Since $B \propto I$, doubling $I$ doubles
    $B$.


    Why it works:

    The magnetic field strength is directly proportional to the current causing it.

    Why the other choices fail: It is a linear relationship, not a squared or inverse one.'
  choices:
  - id: a
    text: It doubles.
  - id: b
    text: It quadruples.
  - id: c
    text: It halves.
  - id: d
    text: It remains the same.
  answer:
    choiceId: a
