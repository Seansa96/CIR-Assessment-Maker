- id: q001
  type: multipleChoice
  difficultyDimensions: &id001
  - modelOrDerivation
  - errorDiagnosis
  prompt: If you double the current in a long straight wire, what happens to the magnetic field at a fixed distance
    from the wire?
  explanation: 'Solution:

    For a long straight wire, $B = \frac{\mu_0 I}{2\pi r}$. Since $B \propto I$, doubling $I$ doubles $B$.


    Why it works:

    The magnetic field strength is directly proportional to the current causing it.

    Why the other choices fail: It is a linear relationship, not a squared or inverse one.'
  choices:
  - id: a
    text: It doubles.
  - id: b
    text: It quadruples.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: c
    text: It halves.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  - id: d
    text: It remains the same.
    issueSignals:
    - id: physics2-method-selection-error
      domains:
      - physics-2
  answer:
    choiceId: a
  difficultyEvidence: Requires selecting the governing physical model and checking an assumption or representation.
