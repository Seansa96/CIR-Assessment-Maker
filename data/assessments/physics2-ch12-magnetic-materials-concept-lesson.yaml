lesson:
  introduction: >
    This lesson develops a repeatable way to solve Magnetic Materials problems: identify the physical model, represent directions and signs, calculate, and test the result.
  sections:
  - id: physics2-ch12-magnetic-materials-s1
    title: Name the model and quantities
    required: true
    content: >
      Magnetic Materials uses B = mu_0(H + M). In the name the model and quantities stage, separate an applied field from material response and use the stated permeability model.


      Write the target quantity symbolically before inserting values. Keep vector directions or thermodynamic signs visible until the final line, then compare the result with a simple limiting case.
    media:
    - type: image
      src: /media/physics2/ch05-relationship-map.svg
      alt: >
        Model map for solving Magnetic Materials problems.
      caption: Identify quantities, directions, and a verification check before calculating.
    check:
      id: physics2-ch12-magnetic-materials-s1-check
      type: multipleChoice
      prompt: >
        In the name the model and quantities step for Magnetic Materials, what is the most reliable next action?
      choices:
      - id: a
        text: >
          For name the model and quantities, use B = mu_0(H + M) after you separate an applied field from material response and use the stated permeability model.
        media: []
        issueSignals: []
      - id: b
        text: >
          During name the model and quantities, ignore the stated sign, direction, or reference quantity in this Magnetic Materials problem.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-magnetic-materials-sign-direction-error
          domains:
          - physics-2
      - id: c
        text: >
          During name the model and quantities, substitute every listed number before deciding which variables B = mu_0(H + M) relates.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-magnetic-materials-method-selection-error
          domains:
          - physics-2
      - id: d
        text: >
          During name the model and quantities, accept the numerical result without checking whether its units and limiting behavior fit Magnetic Materials.
        media: []
        issueSignals:
        - id: physics2-physics2-ch12-magnetic-materials-units-error
          domains:
          - physics-2
      answer:
        choiceId: a
        choiceIds: []
        expected: 
        gradingMode: 
        expectedLatex: 
        equivalenceMode: 
        variables: []
        value: 
        tolerance: 
        media: []
        keyPoints: []
        circuitAnswer: 
        graphingAnswer: 
      explanation: >
        Solution: During name the model and quantities for Magnetic Materials, first separate an applied field from material response and use the stated permeability model. Then apply B = mu_0(H + M) with one consistent coordinate system and solve for the requested quantity.


        Why it works: B = mu_0(H + M) connects the named physical quantities only after their signs, directions, and constraints are defined.


        Why the other choices fail: Ignoring a reference changes the physical meaning, premature substitution can select the wrong model, and skipping a units or limit check leaves an error undetected.
