lesson:
  introduction: |-
    If you draw a triangle, you can always draw a circle that perfectly touches all three vertices (the circumcircle). But what about a four-sided shape? Can you always draw a circle through all four corners of a quadrilateral? The answer is no! When you *can*, it's very special.
  sections:
  - id: sec-definition
    title: What is a Cyclic Quadrilateral?
    required: true
    content: |-
      A **cyclic quadrilateral** is a polygon with four sides where all four vertices lie perfectly on the circumference of a single circle. 
      
      The circle is said to be *circumscribed* about the quadrilateral, and the quadrilateral is said to be *inscribed* in the circle. 
      
      Not all quadrilaterals are cyclic. For example, a non-rectangular rhombus is not cyclic because its four corners can never sit on the same circle.

  - id: sec-opposite-angles
    title: The Opposite Angle Theorem
    required: true
    content: |-
      Because the vertices of a cyclic quadrilateral lie on a circle, the interior angles are actually **inscribed angles**.
      
      Look at any two opposite angles in a cyclic quadrilateral (like $\angle A$ and $\angle C$). $\angle A$ intercepts an arc on one side of the circle, and $\angle C$ intercepts the arc on the *other* side of the circle. Together, their intercepted arcs cover the entire $360^\circ$ of the circle!
      
      Because an inscribed angle is half its intercepted arc, the sum of the two opposite angles must be half of $360^\circ$.
      
      **Cyclic Quadrilateral Theorem**: The opposite angles of a cyclic quadrilateral are **supplementary** (they add up to $180^\circ$).
      $$m\angle A + m\angle C = 180^\circ$$
      $$m\angle B + m\angle D = 180^\circ$$

questions:
- id: q-geom-cyc-1
  title: Concept Check - Opposite Angles
  prompt: |-
    Quadrilateral $PQRS$ is inscribed in a circle. If $m\angle P = 70^\circ$, what is the measure of the opposite angle, $\angle R$?
  type: numericResponse
  answer:
    numericValue: 110
    tolerance: 0
  explanation: |-
    The opposite angles of a cyclic quadrilateral must add up to $180^\circ$ (they are supplementary).
    $$180^\circ - 70^\circ = 110^\circ$$
  skills:
  - geometry-cyclic-quadrilaterals

- id: q-geom-cyc-2
  title: Concept Check - Identifying Cyclic Quads
  prompt: |-
    Which of the following common quadrilaterals is ALWAYS cyclic?
  type: multipleChoice
  choices:
  - id: c1
    text: A kite
  - id: c2
    text: A rhombus
  - id: c3
    text: A rectangle
  - id: c4
    text: A parallelogram
  answer:
    choiceId: c3
  explanation: |-
    To be cyclic, the opposite angles MUST add up to $180^\circ$. In a **rectangle**, all four angles are exactly $90^\circ$. Opposite angles will always be $90^\circ + 90^\circ = 180^\circ$, meaning every rectangle is guaranteed to be a cyclic quadrilateral!
  skills:
  - geometry-cyclic-quadrilaterals
