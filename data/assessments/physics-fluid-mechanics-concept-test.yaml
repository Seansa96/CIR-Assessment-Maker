modeDefault: evaluate
randomizeQuestions: true
questions:
  - id: fm-q01
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Students confuse force and pressure in fluids."
    prerequisiteObjectiveIds: [physics-fluid-statics]
    extensionObjectiveIds: [physics-fluid-statics]
    prompt: |
      Which of the following best describes the relationship between force and pressure in a static fluid?
    choices:
      - id: a
        text: 'Pressure is the total force exerted by the fluid on an entire surface.'
      - id: b
        text: 'Force and pressure are exactly the same physical quantity.'
      - id: c
        text: 'Pressure is the force exerted perpendicularly per unit area of a surface.'
      - id: d
        text: 'Pressure is the force exerted parallel to a surface.'
    answer:
      choiceId: c
    explanation: |
        Solution: Pressure is a scalar quantity defined as $P = F_{\perp}/A$.
        
        Why it works: In a static fluid, pressure pushes outward isotropically (in all directions). However, when it contacts a solid boundary, it only exerts a net force perpendicular (normal) to that surface area.
        
        Why the other choices fail: Total force depends on the size of the area, whereas pressure is an intensive property (force *per* unit area). Fluids cannot exert static parallel (shear) forces.

  - id: fm-q02
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Shape independence of hydrostatic pressure."
    prerequisiteObjectiveIds: [physics-fluid-statics]
    extensionObjectiveIds: [physics-fluid-statics]
    prompt: |
      Three open-top containers of different shapes (one cylindrical, one widening at the top, one narrowing at the top) are filled with water to the exact same depth. How does the water pressure at the bottom of the three containers compare?
    choices:
      - id: a
        text: 'It is highest in the container that widens at the top.'
      - id: b
        text: 'It is highest in the container that narrows at the top.'
      - id: c
        text: 'It is exactly the same in all three containers.'
      - id: d
        text: 'It depends on the total volume of water in each container.'
    answer:
      choiceId: c
    explanation: |
        Solution: Hydrostatic pressure in a uniform fluid depends only on depth ($P = P_0 + \rho g h$).
        
        Why it works: The pressure at a given point in a static fluid is determined purely by the vertical weight of the fluid column directly above it, extending to the surface. The shape of the container walls, the total volume, and the total weight of the fluid are irrelevant.
        
        Why the other choices fail: This phenomenon is known as the "hydrostatic paradox." Even a thin tube of water can exert massive pressure if it is tall enough.

  - id: fm-q03
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Pascal's Principle conceptualization."
    prerequisiteObjectiveIds: [physics-fluid-statics]
    extensionObjectiveIds: [physics-fluid-statics]
    prompt: |
      According to Pascal's Principle, if you apply an additional pressure to a completely enclosed, incompressible fluid, what happens?
    choices:
      - id: a
        text: 'The pressure is transmitted undiminished to every point in the fluid and to the walls of the container.'
      - id: b
        text: 'The pressure dissipates as it travels away from the source.'
      - id: c
        text: 'The fluid compresses significantly to absorb the pressure.'
      - id: d
        text: 'The pressure only increases in the downward direction due to gravity.'
    answer:
      choiceId: a
    explanation: |
        Solution: This is the defining statement of Pascal's Principle, which underlies hydraulic machinery.
        
        Why it works: Because the fluid is incompressible, pushing on one part forces all other parts to push outward identically. An extra 10 Pa applied at the top results in an extra 10 Pa everywhere else in the fluid.
        
        Why the other choices fail: It does not dissipate, and fluids are modeled as incompressible in this context.

  - id: fm-q04
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Hydraulic lift force multiplication."
    prerequisiteObjectiveIds: [physics-fluid-statics]
    extensionObjectiveIds: [physics-fluid-statics]
    prompt: |
      In a hydraulic lift, a small force applied to a small piston can lift a heavy car on a large piston. Does this violate the conservation of energy?
    choices:
      - id: a
        text: 'Yes, it produces more energy than is put in.'
      - id: b
        text: 'No, because the small piston must be pushed down a much larger distance.'
      - id: c
        text: 'No, because the pressure on the large piston is less than on the small piston.'
      - id: d
        text: 'Yes, unless the fluid is perfectly frictionless.'
    answer:
      choiceId: b
    explanation: |
        Solution: Work is Force times distance ($W = F d$).
        
        Why it works: Pascal's Principle guarantees equal *pressure* ($P_1 = P_2$), meaning $F_1/A_1 = F_2/A_2$. While the force $F_2$ on the large piston is huge, the volume of fluid displaced is conserved ($V = A_1 d_1 = A_2 d_2$). The small piston must move a massive distance $d_1$ to move the large piston a tiny distance $d_2$. The work done ($F_1 d_1 = F_2 d_2$) is perfectly conserved.
        
        Why the other choices fail: Pressure is equal, not less. Energy is always conserved.

  - id: fm-q05
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Archimedes' Principle definition."
    prerequisiteObjectiveIds: [physics-archimedes-principle]
    extensionObjectiveIds: [physics-archimedes-principle]
    prompt: |
      What determines the magnitude of the buoyant force acting on an object partially or completely submerged in a fluid?
    choices:
      - id: a
        text: 'The total mass of the object.'
      - id: b
        text: 'The density of the object.'
      - id: c
        text: 'The weight of the fluid that is displaced by the object.'
      - id: d
        text: 'The depth to which the object is submerged.'
    answer:
      choiceId: c
    explanation: |
        Solution: This is Archimedes' Principle.
        
        Why it works: A submerged volume $V_{sub}$ pushes an equal volume of fluid out of the way. The upward buoyant force precisely equals the gravitational weight of that missing chunk of fluid ($F_B = \rho_{fluid} V_{sub} g$).
        
        Why the other choices fail: The object's own mass or density only determines whether it will float or sink, not the magnitude of the buoyant force itself. Depth doesn't matter as long as it's fully submerged (since pressure increases linearly on both top and bottom).

  - id: fm-q06
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Buoyant force on sinking objects."
    prerequisiteObjectiveIds: [physics-archimedes-principle]
    extensionObjectiveIds: [physics-archimedes-principle]
    prompt: |
      A heavy iron block and a light wood block of exactly the same size and shape are both held completely submerged underwater. How do the buoyant forces on them compare?
    choices:
      - id: a
        text: 'The buoyant force is greater on the iron block.'
      - id: b
        text: 'The buoyant force is greater on the wood block.'
      - id: c
        text: 'The buoyant force is exactly the same on both.'
      - id: d
        text: 'The iron block has no buoyant force because it sinks.'
    answer:
      choiceId: c
    explanation: |
        Solution: Buoyant force depends only on displaced fluid volume.
        
        Why it works: Because they are the exact same size ($V_{sub}$ is identical) and in the same fluid ($\rho_{fluid}$ is identical), they displace the exact same weight of water. Therefore, they experience the exact same upward buoyant force.
        
        Why the other choices fail: The iron sinks because its downward weight ($mg$) is greater than this buoyant force. The wood shoots upward because its weight is less than this buoyant force. But the upward force itself is identical.

  - id: fm-q07
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Floating equilibrium conditions."
    prerequisiteObjectiveIds: [physics-archimedes-principle]
    extensionObjectiveIds: [physics-archimedes-principle]
    prompt: |
      When an object floats in equilibrium on the surface of a liquid, what is true about the buoyant force?
    choices:
      - id: a
        text: 'It is strictly greater than the object''s weight.'
      - id: b
        text: 'It is exactly equal to the object''s weight.'
      - id: c
        text: 'It is less than the object''s weight.'
      - id: d
        text: 'It is zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: Floating in equilibrium means the object has zero vertical acceleration.
        
        Why it works: By Newton's First Law, the net force must be zero. The upward buoyant force must perfectly balance the downward force of gravity (the object's weight).
        
        Why the other choices fail: If it were greater, the object would accelerate upward. The object displaces just enough fluid so that the displaced weight equals its own total weight.

  - id: fm-q08
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Melting ice cube puzzle."
    prerequisiteObjectiveIds: [physics-archimedes-principle]
    extensionObjectiveIds: [physics-archimedes-principle]
    prompt: |
      An ice cube is floating in a glass of water, filled exactly to the brim. When the ice cube completely melts, what happens to the water level?
    choices:
      - id: a
        text: 'The water overflows.'
      - id: b
        text: 'The water level drops.'
      - id: c
        text: 'The water level remains exactly the same.'
      - id: d
        text: 'It depends on the initial size of the ice cube.'
    answer:
      choiceId: c
    explanation: |
        Solution: Apply Archimedes' Principle to floating ice.
        
        Why it works: While floating, the ice displaces a volume of water equal to the *weight* of the entire ice cube. When it melts, it turns into water. The weight of this newly melted water is exactly equal to the weight of the original ice cube. Therefore, it perfectly fills the "hole" (the displaced volume) it had previously created.
        
        Why the other choices fail: It doesn't overflow or drop because the mass of $H_2O$ is conserved, and liquid water has the same density as the displaced fluid.

  - id: fm-q09
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Continuity equation conceptualization."
    prerequisiteObjectiveIds: [physics-fluid-dynamics-continuity]
    extensionObjectiveIds: [physics-fluid-dynamics-continuity]
    prompt: |
      Water flows through a horizontal pipe that gradually narrows. According to the Equation of Continuity, what happens to the speed of the water as it enters the narrower section?
    choices:
      - id: a
        text: 'The speed decreases.'
      - id: b
        text: 'The speed increases.'
      - id: c
        text: 'The speed remains constant.'
      - id: d
        text: 'The speed becomes zero.'
    answer:
      choiceId: b
    explanation: |
        Solution: The Equation of Continuity for an incompressible fluid is $A_1 v_1 = A_2 v_2$.
        
        Why it works: This represents conservation of mass (volume flow rate is constant). Because the same volume of water must pass through the narrower area ($A$ decreases) in the same amount of time, the water must travel faster ($v$ increases) to get out of the way.
        
        Why the other choices fail: If speed decreased or remained constant, water would pile up and compress inside the pipe, violating incompressibility.

  - id: fm-q10
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Bernoulli's principle on pressure and speed."
    prerequisiteObjectiveIds: [physics-bernoullis-equation]
    extensionObjectiveIds: [physics-bernoullis-equation]
    prompt: |
      As water flows from a wide section of a horizontal pipe into a narrow section, it speeds up. According to Bernoulli's principle, what happens to the internal fluid pressure in the narrow section?
    choices:
      - id: a
        text: 'The pressure increases.'
      - id: b
        text: 'The pressure decreases.'
      - id: c
        text: 'The pressure remains constant.'
      - id: d
        text: 'It depends on the atmospheric pressure outside.'
    answer:
      choiceId: b
    explanation: |
        Solution: Bernoulli's equation ($P + \frac{1}{2}\rho v^2 + \rho gh = \text{constant}$) represents conservation of energy density.
        
        Why it works: For a horizontal pipe ($\Delta h = 0$), if the kinetic energy density ($\frac{1}{2}\rho v^2$) increases because the fluid speeds up, the pressure energy density ($P$) must decrease to keep the total sum constant.
        
        Why the other choices fail: A common misconception is that fluid "squeezed" into a narrow pipe has higher pressure. In reality, it must be accelerated into the narrow section, meaning a high pressure behind it is pushing it toward a lower pressure region ahead of it.

  - id: fm-q11
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Airplane wing lift generation."
    prerequisiteObjectiveIds: [physics-bernoullis-equation]
    extensionObjectiveIds: [physics-bernoullis-equation]
    prompt: |
      An airplane wing (airfoil) is shaped such that air flows faster over the top surface than the bottom surface. How does this generate lift according to fluid dynamics?
    choices:
      - id: a
        text: 'The faster air on top exerts a higher pressure downward.'
      - id: b
        text: 'The faster air on top exerts a lower pressure downward.'
      - id: c
        text: 'The air simply bounces off the bottom surface.'
      - id: d
        text: 'The wing''s shape creates a vacuum above it.'
    answer:
      choiceId: b
    explanation: |
        Solution: This is an application of Bernoulli's principle.
        
        Why it works: Higher fluid speed results in lower fluid pressure. Because the air over the top moves faster, the pressure on the top surface is less than the pressure on the slower-moving bottom surface. This pressure difference ($P_{bottom} > P_{top}$) creates a net upward force (lift).
        
        Why the other choices fail: Faster air means *lower* pressure, not higher. While deflection (Newton's 3rd Law) also contributes to lift, Bernoulli's principle directly addresses the pressure differential.

  - id: fm-q12
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Torricelli's Law."
    prerequisiteObjectiveIds: [physics-bernoullis-equation]
    extensionObjectiveIds: [physics-bernoullis-equation]
    prompt: |
      Water leaks out of a small hole near the bottom of a large, open water tank. The speed of the water exiting the hole depends primarily on:
    choices:
      - id: a
        text: 'The diameter of the hole.'
      - id: b
        text: 'The total volume of water in the tank.'
      - id: c
        text: 'The vertical depth of the water surface above the hole.'
      - id: d
        text: 'The atmospheric pressure.'
    answer:
      choiceId: c
    explanation: |
        Solution: Torricelli's Law is derived from Bernoulli's equation: $v = \sqrt{2gh}$.
        
        Why it works: The potential energy of the water at the surface ($\rho gh$) is converted entirely into kinetic energy ($\frac{1}{2}\rho v^2$) at the exit hole (since both are exposed to the same atmospheric pressure $P_0$). Thus, the exit speed depends only on the depth $h$.
        
        Why the other choices fail: It's exactly analogous to an object dropped from height $h$ in free fall. Hole size affects volume flow rate, but not speed.

  - id: fm-q13
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Viscosity conceptualization."
    prerequisiteObjectiveIds: [physics-viscosity]
    extensionObjectiveIds: [physics-viscosity]
    prompt: |
      Which of the following best describes "viscosity" in a fluid?
    choices:
      - id: a
        text: 'The fluid''s resistance to compression.'
      - id: b
        text: 'The fluid''s internal friction or resistance to flow.'
      - id: c
        text: 'The fluid''s density.'
      - id: d
        text: 'The fluid''s tendency to evaporate.'
    answer:
      choiceId: b
    explanation: |
        Solution: Viscosity ($\eta$) is a measure of internal fluid friction.
        
        Why it works: When layers of fluid slide past one another, viscous forces resist this shearing motion. Honey has high viscosity (flows slowly), while water has low viscosity (flows easily).
        
        Why the other choices fail: Resistance to compression is the bulk modulus. Density is mass per volume.

  - id: fm-q14
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Poiseuille's law and radius dependence."
    prerequisiteObjectiveIds: [physics-viscosity]
    extensionObjectiveIds: [physics-viscosity]
    prompt: |
      According to Poiseuille's law for viscous flow in a pipe, if the radius of the pipe is reduced by half, what happens to the volume flow rate (assuming pressure difference remains constant)?
    choices:
      - id: a
        text: 'It is reduced to $1/2$ of its original value.'
      - id: b
        text: 'It is reduced to $1/4$ of its original value.'
      - id: c
        text: 'It is reduced to $1/8$ of its original value.'
      - id: d
        text: 'It is reduced to $1/16$ of its original value.'
    answer:
      choiceId: d
    explanation: |
        Solution: Poiseuille's law states $Q = \frac{\pi r^4 \Delta P}{8 \eta L}$.
        
        Why it works: The volume flow rate $Q$ is proportional to the *fourth power* of the radius ($r^4$). If $r$ is halved ($r/2$), the flow rate becomes $(1/2)^4 = 1/16$ of the original flow.
        
        Why the other choices fail: The extreme sensitivity to radius is why narrowed arteries in the human body are so dangerous; a small reduction in radius causes a massive drop in blood flow.

  - id: fm-q15
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Laminar vs Turbulent flow."
    prerequisiteObjectiveIds: [physics-viscosity]
    extensionObjectiveIds: [physics-viscosity]
    prompt: |
      What characterizes "turbulent" flow compared to "laminar" flow?
    choices:
      - id: a
        text: 'Turbulent flow is characterized by smooth, parallel layers sliding over one another.'
      - id: b
        text: 'Turbulent flow is characterized by chaotic, irregular, swirling eddies.'
      - id: c
        text: 'Turbulent flow only occurs in perfectly frictionless fluids.'
      - id: d
        text: 'Turbulent flow always has a lower velocity than laminar flow.'
    answer:
      choiceId: b
    explanation: |
        Solution: Flow regimes are characterized by the Reynolds number.
        
        Why it works: Laminar flow is smooth and orderly (layers don't mix). When velocity increases or viscosity decreases, the flow becomes unstable and transitions to turbulent flow, characterized by chaotic mixing, vortices, and energy dissipation.
        
        Why the other choices fail: Option A describes laminar flow. Turbulence dissipates lots of energy, so it's not frictionless. It generally occurs at *higher* velocities.

  - id: fm-q16
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Apparent weight in fluids."
    prerequisiteObjectiveIds: [physics-archimedes-principle]
    extensionObjectiveIds: [physics-archimedes-principle]
    prompt: |
      When you hold a heavy rock underwater, it feels lighter than when you hold it in the air. This "apparent weight" is equal to:
    choices:
      - id: a
        text: 'The true weight minus the buoyant force.'
      - id: b
        text: 'The buoyant force minus the true weight.'
      - id: c
        text: 'The true weight divided by the density of water.'
      - id: d
        text: 'Just the buoyant force.'
    answer:
      choiceId: a
    explanation: |
        Solution: Apparent weight is the upward force your hand must provide to support the object.
        
        Why it works: To hold it still, the net force must be zero: $F_{hand} + F_{buoyant} - mg = 0$. Therefore, the apparent weight ($F_{hand}$) is $mg - F_{buoyant}$. The buoyant force assists you, making the object feel lighter.
        
        Why the other choices fail: If the buoyant force were greater than true weight, it would float and you would have to push it *down*.

  - id: fm-q17
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Equation of continuity with compressibility."
    prerequisiteObjectiveIds: [physics-fluid-dynamics-continuity]
    extensionObjectiveIds: [physics-fluid-dynamics-continuity]
    prompt: |
      The simple continuity equation ($A_1 v_1 = A_2 v_2$) applies only under which specific assumption about the fluid?
    choices:
      - id: a
        text: 'The fluid is completely frictionless (non-viscous).'
      - id: b
        text: 'The fluid is incompressible (constant density).'
      - id: c
        text: 'The fluid is undergoing turbulent flow.'
      - id: d
        text: 'The fluid is stationary.'
    answer:
      choiceId: b
    explanation: |
        Solution: The general continuity equation is $\rho_1 A_1 v_1 = \rho_2 A_2 v_2$ (conservation of mass flow rate).
        
        Why it works: If we assume the fluid is incompressible (like liquid water), its density doesn't change ($\rho_1 = \rho_2$). The densities cancel out, leaving $A_1 v_1 = A_2 v_2$ (conservation of volume flow rate).
        
        Why the other choices fail: Viscosity doesn't invalidate mass conservation. It certainly isn't stationary. For compressible gases, you must include $\rho$.

  - id: fm-q18
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Venturi effect conceptually."
    prerequisiteObjectiveIds: [physics-bernoullis-equation]
    extensionObjectiveIds: [physics-bernoullis-equation]
    prompt: |
      A Venturi tube is a pipe with a narrowed middle section (a throat). How does a Venturi tube measure fluid flow speed?
    choices:
      - id: a
        text: 'By measuring the increase in temperature in the throat.'
      - id: b
        text: 'By measuring the difference in pressure between the wide section and the narrow throat.'
      - id: c
        text: 'By measuring the electrical resistance of the fluid.'
      - id: d
        text: 'By measuring the increase in volume in the throat.'
    answer:
      choiceId: b
    explanation: |
        Solution: The Venturi effect combines Continuity and Bernoulli's principles.
        
        Why it works: The fluid must speed up in the narrow throat (Continuity). This increased kinetic energy requires a drop in pressure (Bernoulli). By measuring this pressure drop ($\Delta P$), the velocity of the fluid can be mathematically calculated.
        
        Why the other choices fail: Temperature and electrical resistance are irrelevant to the core fluid mechanical principles. Volume doesn't increase (fluids are incompressible).

  - id: fm-q19
    type: multipleChoice
    difficultyDimensions: [scenario, representation]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Terminal velocity in viscous fluids."
    prerequisiteObjectiveIds: [physics-viscosity]
    extensionObjectiveIds: [physics-viscosity]
    prompt: |
      When a small sphere falls through a viscous fluid, it eventually reaches a constant "terminal velocity." What forces are balanced at this point?
    choices:
      - id: a
        text: 'Gravity pulling down is balanced by the buoyant force pushing up.'
      - id: b
        text: 'Gravity pulling down is balanced by the sum of the buoyant force and the viscous drag force pushing up.'
      - id: c
        text: 'Viscous drag pulling down is balanced by buoyancy pushing up.'
      - id: d
        text: 'Gravity pulling down is balanced only by the viscous drag force.'
    answer:
      choiceId: b
    explanation: |
        Solution: Terminal velocity means zero acceleration, so the net force is zero.
        
        Why it works: There are three forces acting: gravity (downward), buoyancy (upward, constant), and viscous drag (upward, increases with speed). At terminal velocity, $F_{drag}$ has increased just enough so that $F_{drag} + F_{buoyant} = F_{gravity}$.
        
        Why the other choices fail: Buoyancy alone is not enough to balance gravity (otherwise it would float, not fall). Drag alone ignores the always-present buoyant force.

  - id: fm-q20
    type: multipleChoice
    difficultyDimensions: [scenario, constraints]
    subjectDifficultyTags: [conceptual-interpretation]
    difficultyEvidence: "Gauge pressure vs absolute pressure."
    prerequisiteObjectiveIds: [physics-fluid-statics]
    extensionObjectiveIds: [physics-fluid-statics]
    prompt: |
      A car tire pressure gauge reads 32 psi. What does this "gauge pressure" represent?
    choices:
      - id: a
        text: 'The absolute total pressure inside the tire.'
      - id: b
        text: 'The pressure exerted solely by the atmosphere on the tire.'
      - id: c
        text: 'The difference between the absolute pressure inside the tire and the atmospheric pressure outside.'
      - id: d
        text: 'The total force exerted by the air on the rubber.'
    answer:
      choiceId: c
    explanation: |
        Solution: $P_{absolute} = P_{gauge} + P_{atm}$.
        
        Why it works: A gauge measures pressure *relative* to the ambient surroundings (atmosphere). When a tire is totally flat (matches ambient air), the gauge reads zero, even though there is still ~14.7 psi of absolute atmospheric pressure inside it.
        
        Why the other choices fail: Absolute pressure would be $32 + 14.7 = 46.7$ psi. It is not a force, it's a pressure.
