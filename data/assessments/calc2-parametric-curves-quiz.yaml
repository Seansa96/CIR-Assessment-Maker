questions:
  - id: q-param-curves-quiz-1
    type: multipleChoice
    title: Eliminating the Parameter
    prompt: |
      Eliminate the parameter $t$ to find the Cartesian equation for the curve defined by:
      
      $$
      x = 2t + 1, \quad y = t - 3
      $$
    choices:
      - id: c1
        text: '$y = \frac{1}{2}x - \frac{7}{2}$'
      - id: c2
        text: '$y = 2x - 7$'
      - id: c3
        text: '$y = \frac{1}{2}x - \frac{5}{2}$'
      - id: c4
        text: '$y = x - 4$'
    answer:
      choiceId: c1
    explanation: |
      Solve the first equation for $t$:
      $x = 2t + 1 \implies 2t = x - 1 \implies t = \frac{x - 1}{2}$.
      
      Substitute this into the second equation:
      $y = \left(\frac{x - 1}{2}\right) - 3 = \frac{1}{2}x - \frac{1}{2} - 3 = \frac{1}{2}x - \frac{7}{2}$.
    skills:
      - parametric-curves

  - id: q-param-curves-quiz-2
    type: multipleChoice
    title: Circle Parametrization
    prompt: |
      Which of the following represents a circle of radius 4 centered at the origin, traced counterclockwise?
    choices:
      - id: c1
        text: '$x = 4\cos t, \quad y = 4\sin t, \quad 0 \le t \le 2\pi$'
      - id: c2
        text: '$x = 4\sin t, \quad y = 4\cos t, \quad 0 \le t \le 2\pi$'
      - id: c3
        text: '$x = 16\cos t, \quad y = 16\sin t, \quad 0 \le t \le 2\pi$'
      - id: c4
        text: '$x = 4\cos(2t), \quad y = 4\sin(2t), \quad 0 \le t \le \pi$'
    answer:
      choiceId: c1
    explanation: |
      The standard counterclockwise parametrization of a circle of radius $r$ centered at the origin is $x = r\cos t, y = r\sin t$ for $0 \le t \le 2\pi$. 
      
      Setting $r = 4$ yields $x = 4\cos t, y = 4\sin t$.
    skills:
      - parametric-curves

  - id: q-param-curves-quiz-3
    type: multipleChoice
    title: Ellipse Domain
    prompt: |
      The equations $x = 3\cos t$ and $y = 2\sin t$ for $0 \le t \le \pi$ trace what part of an ellipse?
    choices:
      - id: c1
        text: 'The top half'
      - id: c2
        text: 'The bottom half'
      - id: c3
        text: 'The right half'
      - id: c4
        text: 'The entire ellipse'
    answer:
      choiceId: c1
    explanation: |
      The interval $0 \le t \le \pi$ covers angles in the first and second quadrants. 
      In this range, $\sin t \ge 0$, which means $y \ge 0$. 
      Therefore, the curve traces the top half of the ellipse.
    skills:
      - parametric-curves

  - id: q-param-curves-quiz-4
    type: multipleChoice
    title: Direction of Motion
    prompt: |
      Consider the curve $x = e^t$, $y = e^{2t}$ for $-\infty < t < \infty$. 
      As $t$ increases, in which direction does the particle move?
    choices:
      - id: c1
        text: 'From left to right along $y = x^2$ for $x > 0$'
      - id: c2
        text: 'From right to left along $y = x^2$ for $x > 0$'
      - id: c3
        text: 'From left to right along $y = \sqrt{x}$ for $y > 0$'
      - id: c4
        text: 'From right to left along $y = \sqrt{x}$ for $y > 0$'
    answer:
      choiceId: c1
    explanation: |
      Eliminating $t$, we note $e^{2t} = (e^t)^2$, so $y = x^2$. 
      Since $x = e^t$, the domain is $x > 0$. 
      As $t$ goes from $-\infty$ to $\infty$, $e^t$ increases from near $0$ towards $\infty$. 
      Thus, $x$ is increasing, meaning the particle moves from left to right along the right half of the parabola.
    skills:
      - parametric-curves
