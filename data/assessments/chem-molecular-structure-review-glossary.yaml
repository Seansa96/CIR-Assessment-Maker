      term: valence electron
      definition: An electron in the occupied outer shell that can participate in bonding or ion formation.
      drills:
      - id: g01
        type: flashcard
        prompt: State the meaning of valence electron in this bonding unit.
        answer:
          expected: An electron in the occupied outer shell that can participate in bonding or ion formation.
          aliases:
          - valence electron
        explanation: 'Solution: An electron in the occupied outer shell that can participate in bonding or ion formation.
          Why it works: This meaning keeps the term tied to the particle or electron model used in the topic.'
